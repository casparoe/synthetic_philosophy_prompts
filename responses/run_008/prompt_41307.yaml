prompt: |-
  I'm a graduate student in international relations, and I've become puzzled by a pattern in how my field, and the broader foreign-policy establishment, use history as an instrument. On one hand, there is now a whole apparatus of "applied history": think tanks run programs that convene historians to advise on current crises, and the most successful of these exercises was surely the one built around the Thucydides trap. Graham Allison and his collaborators at Harvard's Belfer Center popularized the phrase in the early 2010s, and to back it up they assembled a case file of sixteen historical episodes in which a rising power threatened to displace a ruling one, of which twelve ended in war. The slogan rests on a line from Thucydides which, in Richard Crawley's translation, reads: "The growth of the power of Athens, and the alarm which this inspired in Lacedaemon, made war inevitable." The case count is then used, in books like Allison's Destined for War (2017) and in countless op-eds since, as a kind of base rate for the U.S.–China relationship: a 12-out-of-16 record is cited as a reason to expect, and to work against, war between a ruling and a rising great power. Alongside this, policy schools teach a more modest craft, usually traced to a pair of scholars who studied how administrations actually reason: put the candidate analogy side by side with the present situation, list the similarities and the differences, and ask which of the similarities actually mattered to the outcome in the historical case.

  Here is what puzzles me. This counting practice coexists, in the same newspapers and the same think tanks, with a sharply different attitude toward other historical analogies. Invoking Munich — the claim that some adversary is another Hitler and that concession is another appeasement — is now treated by editors and foreign-policy professionals as an intellectual tic, a sign that the writer has stopped thinking. The lesson of 1938 is said to have been "learned" so often, and so badly, that the analogy is presumptively misleading; the Vietnam-era debates were in large part a war over which template, Munich or Vietnam, was the right one, and the exhaustion of that war is what produced the current norm. Yet the same people who dismiss Munich-style reasoning on the ground that surface similarities (a dictator, a territorial demand) are doing work that only structural similarities should do will, in the next column, aggregate sixteen "power transitions" spanning five centuries into a single frequency, as though Portugal facing Spain in the late 1400s and Britain facing Germany before 1914 were instances of one kind of thing.

  What I'd like you to do is reconstruct the implicit theory, or theories, of history that this practice presupposes. Does treating the case file as a base rate presuppose that history is governed by regularities stable enough to support frequencies — and if so, how does the practice answer the obvious objection that the sixteen cases were admitted into the class by the very similarity judgment the count is supposed to ground? Is the practice actually committed to one view, or is it compatible with several: for instance, with the view that historical outcomes are unique, under which the count would have to be doing something other than evidential work — a reminder, a rhetorical condensation, a way of triggering attention? Is the hostility to Munich analogies consistent with the enthusiasm for case-counting, or do the two rest on conflicting views about which resemblances carry historical weight, and if they conflict, which part of the practice is philosophically doing the heavy lifting? Finally, tell me what would have to change if the implicit view were replaced by a frankly probabilistic one: would the case file have to be abandoned, or merely rebuilt with explicit and independently motivated criteria of inclusion, and would an analogy then function as an argument at all, or only as a checklist of ways things have gone wrong before? Along the way, I'd like to know where the practice is genuinely underdetermined — where several quite different philosophies of history would license exactly the behavior we observe, so that the behavior itself settles less than it seems to.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **User Persona:** Graduate student in International Relations (IR). Sophisticated, familiar with the literature (Allison, Thucydides Trap, Munich/Vietnam analogies), critical of methodological inconsistencies.
      *   **Core Puzzle:** The inconsistency in how history is used in foreign policy.
          *   *Practice A:* "Applied History" / Case Counting (e.g., Thucydides Trap). Treats history as a dataset (16 cases, 12 wars) to establish base rates/probabilities. Aggregates disparate cases (Portugal/Spain, UK/Germany) into one category.
          *   *Practice B:* Rejection of Specific Analogies (e.g., Munich). Treats history as unique/contingent. Dismisses surface similarities (dictator, territorial demand) as misleading. Demands structural nuance.
      *   **The Conflict:** Why is counting 16 disparate cases acceptable while invoking Munich is taboo? Both rely on similarity judgments.
      *   **Tasks:**
          1.  Reconstruct the implicit theory/theories of history presupposed by the "case counting" practice.
          2.  Address the objection of circularity (cases selected *because* they fit the outcome).
          3.  Determine if the practice is committed to one view (regularities) or compatible with others (rhetorical/reminder).
          4.  Analyze the consistency between hostility to Munich and enthusiasm for case-counting. Which view carries the weight?
          5.  Describe what would change under a "frankly probabilistic" view (abandon file? rebuild criteria? function of analogy?).
          6.  Identify where the practice is *underdetermined* (where multiple philosophies license the same behavior).

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *Thucydides Trap (Allison):* Positivist, quasi-scientific. Assumes structural realism (anarchy, power distribution) drives outcomes more than agency or context. History repeats *structurally*.
      *   *Munich Analogy:* Constructivist or Interpretivist critique. Context matters. Agency matters. "Hitler" is a moral label, not just a structural position.
      *   *The Tension:* Positivism vs. Historicism.
      *   *Circularity:* Selection bias. If you define "power transition" by "war happened," you get war. If you define it by "rising vs. ruling," you need independent criteria.
      *   *Underdetermination:* Policymakers might use history pragmatically. It doesn't matter if it's "true" science; does it work to mobilize attention?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the observation (it's a genuine methodological schism). Frame the response around the tension between *nomothetic* (law-seeking) and *idiographic* (particularizing) approaches.

      *   **1. The Implicit Theory of the "Case File" (Thucydides Trap):**
          *   *Theory:* Structural Realism / Positivism. History is a laboratory. Units (states) are fungible. Time is flat (1500s = 2020s).
          *   *The Base Rate:* Implies stability of causal mechanisms. If $X$ (rising power) + $Y$ (ruling power) $\rightarrow$ $Z$ (war) happened 75% of the time, it's a probability.
          *   *The Circularity Objection:* This is the weak point. Allison selects cases *post hoc* based on the outcome (war) or a loose definition of "threat." To defend this, the practitioner must claim *theoretical priors* define the class, not the outcome. (e.g., "Power transition theory" defines the class, war is the test). But often, the definition is fuzzy.

      *   **2. Compatibility with Other Views (Is it *really* probabilistic?):**
          *   Is it actually science? Or is it *rhetoric*?
          *   *View A:* Genuinely probabilistic (Positivist).
          *   *View B:* Pedagogical/Heuristic (Pragmatist). The number isn't a stat; it's a "stop and think" sign.
          *   *View C:* Constitutive (Constructivist). The story *creates* the reality (self-fulfilling prophecy).
          *   *Conclusion:* The practice is *underdetermined*. A skeptic and a believer can both use the number 12/16, but for different reasons.

      *   **3. The Munich vs. Case-Count Inconsistency:**
          *   *Why hate Munich?* It's too *specific* and *moralized*. It implies a specific agent (Hitler) and a specific moral failure (appeasement). It shuts down debate.
          *   *Why love Case-Counting?* It feels *structural* and *neutral*. It implies "forces beyond our control" rather than "moral failure."
          *   *The Conflict:* They rest on conflicting views. Munich rejection = Historicism (context is king). Case Counting = Positivism (structures rule).
          *   *Which does the heavy lifting?* The *political utility*. Case counting allows for preparation (build navy). Munich analogy demands immediate moral action (fight now). The establishment prefers manageable risks over moral crusades.

      *   **4. The "Frankly Probabilistic" Reform:**
          *   What if we took probability seriously?
          *   *Pre-registration:* Define criteria *before* looking at outcomes.
          *   *Reference Class Problem:* How do we define the class? (All states? Only great powers? Only nuclear?)
          *   *Analogy Function:* Analogy becomes a hypothesis generator, not proof. "Here are the variables that mattered in the past; do they exist now?"
          *   *Abandon the file?* No, but rebuild it with rigorous coding.

      *   **5. Underdetermination (The Philosophical "Blind Spot"):**
          *   Where do different philosophies converge on the same behavior?
          *   *Behavior:* Citing the 16 cases.
          *   *Philosophy 1:* Realist (It's a law).
          *   *Philosophy 2:* Pragmatist (It's a useful warning).
          *   *Philosophy 3:* Rhetorician (It's a persuasive device).
          *   *Insight:* The practice survives *because* it is underdetermined. If it were forced to be strictly scientific, it might collapse under scrutiny. If it were admitted as just rhetoric, it might lose authority. Ambiguity is a feature, not a bug.

  4.  **Refining and Polishing:**

      *   *Tone:* Academic, rigorous, respectful of the user's expertise. Avoid talking down. Use IR theory terminology (positivism, historicism, structural realism, reference class problem).
      *   *Clarity:* Ensure the distinction between *nomothetic* (law-like) and *idiographic* (unique) is clear.
      *   *Addressing the Prompt:* Make sure every specific question in the prompt is answered. (Implicit theory? Circularity? Compatibility? Munich conflict? Probabilistic reform? Underdetermination?)

  5.  **Self-Correction/Critique during Drafting:**
      *   *Check:* Did I explain *why* Munich is rejected specifically? Yes, need to emphasize the "lesson learned" fatigue and the moralization aspect.
      *   *Check:* Did I address the circularity of the 16 cases? Yes, the "selection on the dependent variable" issue is crucial.
      *   *Check:* Is the distinction between "structural" and "surface" similarities clear? This is key to the Munich vs. Thucydides contrast.
      *   *Refinement:* Make sure to highlight that "Applied History" often masquerades as social science without meeting its standards.

  6.  **Final Review against User Prompt:**
      *   Reconstruct implicit theory? (Done: Structural Positivism).
      *   Presuppose stable regularities? (Yes).
      *   Answer circularity objection? (Theoretical priors vs. selection bias).
      *   Compatible with unique outcomes view? (Yes, as rhetoric/heuristic).
      *   Hostility to Munich consistent? (No, conflicting views of resemblance).
      *   What changes under frank probability? (Rigorous coding, reference class clarity).
      *   Where is it underdetermined? (The utility of the number survives multiple ontological commitments).

  7.  **Final Polish:** (Produces the structured response below).
answer: |-
  This is a profound methodological critique that cuts to the epistemological core of International Relations (IR). You have identified a tension between two modes of historical reasoning that coexist uneasily within the foreign-policy establishment: a **quasi-positivist structuralism** (the case count) and a **cautious historicism** (the rejection of Munich).

  To reconstruct the implicit theories of history at work here, we must look at how these practices treat time, causality, and the unit of analysis. Here is an analysis of the philosophical architecture supporting the "Applied History" apparatus, the inconsistency regarding Munich, and the implications of a genuinely probabilistic turn.

  ### 1. The Implicit Theory of the "Case File"
  The practice of aggregating sixteen cases to derive a 75% war probability presupposes a **nomothetic** view of history. It assumes history is governed by stable, trans-historical regularities that can be isolated from context.

  *   **Ontology:** It relies on a **Structural Realist** ontology. States are fungible units (Athens = China; Sparta = US). The internal politics, culture, or ideology of the units are secondary to their position in the distribution of capabilities.
  *   **Temporality:** Time is "flat." The year 1500 is functionally equivalent to 2024 for the purposes of the causal mechanism. The technology of war changes, but the *logic* of war (fear, honor, interest) does not.
  *   **Causality:** It assumes **conjunctive causality** that is stable across cases. If $X$ (rising power) and $Y$ (ruling power) are present, $Z$ (war) is the likely output, regardless of intervening variables ($A, B, C$).

  **The Circularity Objection:**
  You ask how this practice answers the objection that the sixteen cases were admitted into the class by the very similarity judgment the count is supposed to ground. This is the classic problem of **selection on the dependent variable**.
  *   *The Defense:* Proponents like Allison argue they are not selecting on the outcome (war), but on the *condition* (power transition). They claim a theoretical prior defines the class: "Any instance where a rising power reaches 80% of the ruling power's GDP."
  *   *The Weakness:* In practice, the coding is often retrospective and fuzzy. Cases are frequently included because they are *known* to be crises. If the criteria for "power transition" are flexible enough to include Portugal/Spain but exclude other non-war transitions, the "base rate" is an artifact of classification, not a discovery of nature.
  *   *The Implicit Fix:* The practice implicitly relies on **expert intuition** to validate the class. It asks the reader to trust that the historian's judgment of "similarity" is theoretically sound, even if the statistical presentation suggests otherwise. It dresses hermeneutic judgment in the clothing of frequency data.

  ### 2. Compatibility with Unique Outcomes (The "Underdetermination" of Practice)
  Is the practice committed to the view that history repeats? Surprisingly, **no**. This is where the practice is genuinely **underdetermined**.

  The behavior of citing "12 out of 16" licenses itself under three distinct philosophies of history, allowing practitioners to shift between them as needed:
  1.  **Positivist:** The number is a literal probability. History is a dataset.
  2.  **Pragmatist/Heuristic:** The number is a "speed bump." It doesn't matter if the cases are truly comparable; the statistic serves to interrupt hubris. It forces the policymaker to acknowledge risk.
  3.  **Rhetorical/Constitutive:** The number is a speech act. It creates a "state of emergency" or a "strategic mindset." Whether the history is "true" is less important than whether the narrative mobilizes resources.

  Because the *behavior* (citing the stat) is the same in all three, the practice survives scrutiny. If challenged on scientific grounds, the practitioner retreats to the Pragmatist defense ("It's just a heuristic"). If challenged on relevance, they retreat to the Positist defense ("The data shows..."). This ambiguity is a feature, not a bug; it maximizes the tool's utility across different audiences.

  ### 3. The Munich Inconsistency: Conflicting Views of Resemblance
  The hostility toward Munich analogies is **inconsistent** with the enthusiasm for case-counting, and they rest on conflicting views of which resemblances carry weight.

  *   **The Munich Rejection (Historicist):** When editors dismiss Munich, they are arguing that **surface similarities** (a dictator, a territorial demand) are misleading. They demand **contextual specificity**. They argue that 1938 was unique because of Hitler's specific ideology, the memory of WWI, and the state of British rearmament. To invoke Munich is to ignore the *disanalogies*. This is a historicist position: outcomes are path-dependent and unique.
  *   **The Case-Count Acceptance (Structuralist):** When the same editors accept the Thucydides Trap, they are arguing that **structural similarities** (power ratios) are determinative. They ignore the *disanalogies* (nuclear weapons, economic interdependence, 15th-century navigation vs. cyber warfare).

  **Which view is doing the heavy lifting?**
  It is not a philosophical view, but a **political utility**.
  *   **Munich** implies a *moral* obligation to fight. It identifies a specific villain and demands immediate, often risky, confrontation to avoid "appeasement." It closes down policy debate.
  *   **Thucydides Trap** implies a *structural* risk to be managed. It suggests competition is inevitable but war is not. It opens up a field of "competition short of war" (deterrence, hedging, diplomacy).
  *   **The Resolution:** The foreign-policy establishment prefers the Thucydides Trap because it legitimizes long-term resource allocation without demanding immediate moral crusades. The rejection of Munich is less about historical rigor and more about avoiding the "never again" trap that led to Vietnam or Iraq. The establishment tolerates structural determinism (Thucydides) because it is manageable; it rejects moral determinism (Munich) because it is escalatory.

  ### 4. Toward a Frankly Probabilistic View
  If the field were to replace its current implicit view with a **frankly probabilistic** one (Bayesian or frequentist rigor), the practice would have to change significantly:

  1.  **Pre-Registration of Criteria:** The criteria for inclusion in the "case file" would need to be defined *ex ante*, independent of the outcome. We would need a dataset of *all* power transitions, including those that did not lead to war, to calculate a true base rate. (Allison claims to do this, but the coding of "transition" is often contested).
  2.  **The Reference Class Problem:** A probabilistic view must acknowledge that the probability of war depends on which "class" you put the US-China relationship in.
      *   Class A: Nuclear powers (Probability $\approx$ 0).
      *   Class B: Trading partners (Probability $< X$).
      *   Class C: All rising/ruling dyads since 1500 (Probability $= 75\%$).
      *   *Change:* Analysts would have to report conditional probabilities, not a single base rate.
  3.  **Function of Analogy:** Analogy would cease to be an argument ("This is like that, therefore X") and become a **hypothesis generator**.
      *   *Current:* "Munich happened, so we must fight."
      *   *Probabilistic:* "In cases resembling Munich, variable $V$ (rearmament speed) was the predictor of success/failure. Do we have variable $V$?"
      *   The analogy becomes a checklist of causal mechanisms to test, not a template for action.

  ### 5. Where the Practice is Underdetermined
  You asked where several different philosophies license exactly the behavior we observe. This is the crux of why the inconsistency persists.

  *   **The "Lesson" as a Focal Point:** Both the Positivist (who believes in laws) and the Constructivist (who believes history is a story we tell) can agree on using the 12/16 statistic to create a **focal point** for coordination.
      *   The Positivist uses it to say: "The risk is real."
      *   The Constructivist uses it to say: "We need a shared narrative to organize the bureaucracy."
      *   *Result:* Both write the same memo.
  *   **The "Cautionary Tale":** Both the Historicist (who thinks every case is unique) and the Determinist (who thinks they repeat) can use history to argue for caution.
      *   The Historicist says: "It's complex, so don't be hubristic."
      *   The Determinist says: "The odds are against us, so don't be hubristic."
      *   *Result:* Both advise restraint.

  **Conclusion:**
  The "Applied History" apparatus survives because it is **methodologically agnostic**. It draws authority from the prestige of science (the count) while retaining the flexibility of humanism (the narrative). The inconsistency regarding Munich reveals that the field is not actually searching for historical truth; it is searching for **actionable heuristics**.

  The Thucydides Trap is tolerated because it is a heuristic for *competition*. Munich is rejected because it is a heuristic for *war*. The implicit theory of history is therefore **instrumentalist**: history is valid insofar as it produces useful policy categories. If you were to impose a frankly probabilistic standard, you would likely break the apparatus, because the "case file" would shrink, the probabilities would become conditional and messy, and the rhetorical power of the "inevitable" would vanish. The current practice persists not because it is philosophically coherent, but because it is politically functional.
