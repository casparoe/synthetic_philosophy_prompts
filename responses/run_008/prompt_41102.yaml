      *   *Actually, looking closer:* The user wants to keep Case 5 (Doctor QoL = No). That is the easiest one (Autonomy). The hard one is 1 vs 2.
      *   *Let's try the "Intent and Causality" Principle.*
      *   *Principle:* **Intentional Relief of Suffering within the Trajectory of Dying.**
