answer: |-
  Here is the prep sheet you asked for, written as continuous prose so you can drop it straight into your notes file. I am going to be blunt because you asked for it, and because the room you are walking into is likely to be sharper on the theory than you are expecting. The weakest joint in your paper is not the central bank analogy, though that is fragile, but rather the theoretical tension between your claim and the strict neo-Roman definition of domination. You are arguing that monarchy reduces domination because monarchs do not exercise power partisanly. However, Pettit and the republicans in that room define domination as the capacity for arbitrary interference, regardless of whether it is exercised. A monarch retains reserve powers. Therefore, by their own lights, the mere existence of those reserve powers constitutes domination, even if the monarch is too polite to use them. If you do not address the distinction between the exercise of power and the capacity for power, the two neo-Roman specialists in the room will dismantle the core theoretical claim in under three minutes. You need to pivot your definition of domination slightly toward actual interference or argue that the social norm against using reserve powers is so strong it removes the capacity, but be ready for them to reject that move.

  Regarding the central bank analogy, you asked whether it is an asset or a liability. It is an asset for intuition but a liability for precision. It is an asset because it instantly communicates the logic of depoliticization to the comparative politics people and the deliberative democrats; everyone understands why we do not elect central bankers. However, it is a liability because central banks have specific, measurable mandates like inflation targeting, whereas a head of state has a vague symbolic mandate. When the comparativists ask how you measure the neutrality of a monarch versus a central banker, you will struggle. Use the analogy to open the door on the logic of insulation, but close the door on it before they ask about accountability mechanisms. Concede that the analogy breaks down on measurability but holds on the structural incentive to remain above the fray.

  You guessed correctly that the deliberative democrats will hit you on the arbitrariness of hereditary succession. You should concede this up front. Do not try to argue that heredity is reasonable or justifiable via public reason. Instead, argue that it is a tragic necessity or a strategic exception to public reason required to secure the higher-order good of non-domination. Frame it as a trade-off where we accept a private reason violation (arbitrary birth) to secure a public reason victory (neutral arbitration). If you try to defend heredity as inherently legitimate, you will lose the deliberative democrats entirely. If you frame it as a functional tool that happens to be arbitrary but produces non-arbitrary outcomes, you might keep them engaged. Expect the first question to come from this group, phrased something like, how can an office founded on a principle that no citizen could reasonably accept serve as the guardian of liberty for all citizens. Your reply should be that legitimacy is composite, and while the selection method fails the test of public reason, the output of the office passes it by ensuring no partisan faction captures the symbolic height of the state. The soft spot here is that deliberative democrats care deeply about process, not just outcomes, so they may reject the trade-off entirely.

  The neo-Roman republicans will come next, and their objection will be sharper. They will ask whether the reserve powers of the monarch do not themselves constitute a form of domination, regardless of whether they are used. They will cite the definition of freedom as non-domination requiring the absence of arbitrary power, not just the non-exercise of it. Your reply needs to be that the convention of non-use is so constitutive of the modern monarchy that the capacity is effectively nullified, making it a paper tiger rather than a dominating power. You should argue that the cost of activating those powers is so high socially and politically that the capacity does not exist in any meaningful sense. The soft spot here is empirical. If you cannot prove that the cost is prohibitive in all cases, they will argue the potential remains. You need to be ready to cite specific instances where monarchs refused to act despite pressure, but acknowledge that the threat remains latent.

  The comparative politics people will not care about the theory as much as the history. They will bring up Weimar, where the President was elected but used reserve powers to undermine democracy, and they will bring up De Gaulle, where the presidency became a site of partisan dominance. They might also point out that many parliamentary republics, like Germany or Italy, manage to have neutral heads of state without monarchy. Their question will be phrased as a request for evidence that monarchies actually perform better than parliamentary republics on measures of democratic stability or partisan neutrality. Your reply should be that while parliamentary republics can achieve neutrality, they face higher transaction costs to maintain it because the office is always potentially contestable in the future. The monarch is structurally insulated in a way an elected president, even a ceremonial one, is not. The soft spot here is that your evidence is likely anecdotal. There is no robust statistical data showing monarchies are less dominating than republics. Concede the lack of large-N evidence but argue that the mechanism is logical rather than empirical.

  Now for the question you are quietly hoping nobody asks. I am confident I know which one it is because it is the standard functionalist counter to institutional conservatism. They will ask why heredity is necessary at all. If the goal is to remove partisan contestation, why not have a single-term non-renewable elected president, or a head of state chosen by lottery, or appointed by a supermajority of the legislature for life? These mechanisms also remove the incentive for partisan contestation without relying on aristocratic privilege. This question is dangerous because it severs the link between your functional goal and your specific institutional recommendation. It suggests you are defending monarchy specifically rather than neutral heads of state generally. Your reply must be that heredity is the only method that completely removes the office from the timeline of political careers. A single-term president is still a former politician with allies; a lottery winner is still a citizen with preferences. A monarch is socialized from birth into the role and has no political future to return to. The soft spot is that this sounds like special pleading for tradition. You need to emphasize the totalizing nature of monarchical socialization compared to other methods.

  Finally, a note on your delivery. You are walking into a room of skeptics who view monarchy as either a quaint relic or an injustice. Do not apologize for the topic, but do not romanticize it either. Keep the tone clinical and institutional. If you sound like a royalist, you will lose the theorists. If you sound like a mechanist, you will keep them listening. Be prepared to concede that this argument only works for surviving constitutional monarchies and does not justify installing new ones. That concession will save you from the charge of being reactionary. If you try to argue this model should be exported, you will be hammered on the transition costs and the injustice of creating new aristocrats. Limit the scope to preservation of existing stable systems. Good luck, and watch out for the Pettitians on the definition of domination. That is where the paper lives or dies.
