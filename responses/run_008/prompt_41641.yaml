answer: |-
  This is a profound observation that cuts to the heart of how we use probability in the wild. You have identified a robust asymmetry that sits at the intersection of metaphysics, ethics, and pragmatics.

  There is no single, universally agreed-upon term for this exact asymmetry, but it is a recognized tension in the philosophy of probability, law, and medicine. It is often discussed under the umbrellas of **"The Problem of the Single Case,"** **"Naked Statistical Evidence,"** and **"Actuarial vs. Clinical Prediction."**

  However, none of these fully capture the *asymmetry of reaction* you describe (why we forgive the actuary but blame the oncologist). To "carve the joint" as you requested, we need to look beyond the math and into the **teleology of the probability statement**—what the number is *for*.

  Here is the breakdown of the existing literature, followed by a proposed conceptual framework and a coined term to capture this specific phenomenon.

  ### 1. The Existing Landscape

  You correctly dismissed the Frequentist vs. Bayesian debate. Two Bayesians can disagree on this because the disagreement isn't about how the number was derived, but about **what the number claims to represent.**

  *   **The Reference Class Problem (Reichenbach, Hájek):** This is the technical core. Your sister belongs to infinite reference classes (women, humans, patients with this cancer, patients with this cancer *and* this genetic marker, patients treated by this doctor on a Tuesday). The insurance claim also belongs to many classes, but we agree to treat it as a random draw from the *policy pool*. In medicine, we feel the patient *should* be their own reference class. If the statistic fails, we assume we picked the wrong class (i.e., we missed a relevant variable about *her*), not that the universe rolled dice.
  *   **Naked Statistical Evidence (Thomson, Cohen):** In legal philosophy, this explains the jury case. Courts reject bare statistics (e.g., "95% of buses in town belong to the defendant's company") because they lack **causal specificity**. A probability based on a group property does not touch the individual's *agency* or *specific act*.
  *   **Aleatory vs. Epistemic Uncertainty:**
      *   *Aleatory (Risk):* Inherent randomness (the coin flip).
      *   *Epistemic (Uncertainty):* Lack of knowledge (the hidden card).
      *   **The Crux:** We treat insurance fraud as *Aleatory* (even if it's not, we model it as irreducible risk). We treat medical outcomes as *Epistemic* (if we knew everything about her biology, the probability would be 0% or 100%). Therefore, a failure in medicine feels like a knowledge failure, whereas a failure in insurance feels like a variance realization.

  ### 2. The Carving: "The Teleology of the Estimate"

  The asymmetry you feel is not about the probability itself, but about the **Normative Function** of the statement in that context. I propose we call this phenomenon:

  #### **The Singular Accountability Asymmetry**

  This concept posits that the "truth value" of a single-case probability is determined by whether the probability is being used to **Sort**, **Intervene**, or **Attribute**.

  Here is how the joint is carved:

  1.  **Sorting (Insurance):** The goal is portfolio management. The individual case is a *token* of a type. The "truth" of the model is its calibration over the *set*.
      *   *Verdict:* The single outcome is **noise**.
      *   *Why:* The model makes no promise about the specific claim, only about the reserve required for the *bucket* of claims.
  2.  **Intervening (Medicine):** The goal is causal manipulation of a specific system. The probability is a proxy for **competence**.
      *   *Verdict:* The single outcome is **signal**.
      *   *Why:* Medicine is a fiduciary practice. When a doctor says "90%," it functions pragmatically as a warranty of diligence. If the treatment fails, the implicit counterfactual arises: *"There must have been a variable we missed that would have moved her to the 10%."* We treat the uncertainty as reducible (Epistemic), so failure implies error.
  3.  **Attributing (Law):** The goal is moral desert based on specific acts.
      *   *Verdict:* The single outcome is **irrelevant**; the statistic is **inadmissible**.
      *   *Why:* Conviction requires a narrative link between *this* defendant and *this* crime. Group statistics bypass the individual's agency, violating the principle of **Individualized Justice**.
  4.  **Pricing (Bookmaker):** The goal is market balance.
      *   *Verdict:* The single outcome is **inventory risk**.
      *   *Why:* The odds are not a prediction of truth, but a price to balance the book. If the underdog wins, the odds weren't "wrong"; the bookie just has to pay out. The truth claim is about the *market*, not the *match*.

  ### 3. Why the Asymmetry Exists (The Mechanism)

  The reason the oncologist's 90% feels falsifiable while the actuary's 70% does not lies in **Counterfactual Sensitivity.**

  *   **In Insurance:** We accept that even with perfect information, the claim *could* still be fraudulent or not. The randomness is treated as inherent to the event (Aleatory). Therefore, the single outcome cannot falsify the probability.
  *   **In Medicine:** We operate under the **Ideal of Specificity**. We believe that if we had *enough* data (genomics, proteomics, lifestyle), we could predict *this* patient's outcome with near certainty. Therefore, the 90% is admitted to be a placeholder for our ignorance. When the bad outcome happens, it reveals the ignorance. The probability wasn't a property of the universe; it was a property of our limited view.

  This is why the family feels the doctor was "wrong." They aren't arguing about the math; they are arguing that **the reference class was too broad.** They are demanding a probability of 1 or 0 for *her*, and the failure proves the model didn't achieve that.

  ### 4. Running the Boundary Cases

  Let's test **The Singular Accountability Asymmetry** against your four cases:

  *   **The Fraud Model (Sorting):**
      *   *Function:* Capital allocation.
      *   *Asymmetry:* Low. The model is not responsible for the specific claim's truth, only the portfolio's solvency.
      *   *Reaction:* "Bad luck." (Variance accepted).
  *   **The Oncologist (Intervening):**
      *   *Function:* Causal intervention on a unique system.
      *   *Asymmetry:* High. The doctor is an agent promising a specific outcome for a specific identity.
      *   *Reaction:* "You were wrong about *me*." (Variance rejected as ignorance).
  *   **The Bookmaker (Pricing):**
      *   *Function:* Liquidity and risk transfer.
      *   *Asymmetry:* Null. The odds are explicitly not truth-claims about the event, but prices for a contract.
      *   *Reaction:* "The market moved." (Truth claim displaced to the balance sheet).
  *   **The Jury (Attributing):**
      *   *Function:* Moral judgment of a specific will.
      *   *Asymmetry:* Extreme. Statistics are actively excluded ("Naked Statistical Evidence").
      *   *Reaction:* "Reasonable Doubt." (Group probability is deemed irrelevant to individual guilt).

  ### 5. A Coined Term for Your Toolkit

  If you need a label for this in your reporting or discussions, I propose:

  **"The Epistemic-Actuarial Divide"**

  *   **Definition:** The distinction between contexts where a probability is treated as a measure of *inherent randomness* (Actuarial/Insurance), where single outcomes do not falsify the model, versus contexts where a probability is treated as a measure of *incomplete knowledge* (Epistemic/Medicine/Law), where single outcomes feel like falsifications of the model's completeness.
  *   **Usage:** "We are facing an *Epistemic-Actuarial Divide* here. The stakeholders are treating this risk score as Epistemic (a claim about this specific client's truth), but the model is built Actuarially (a claim about the portfolio's behavior). We need to align expectations on whether this number is a *diagnosis* or a *price*."

  ### 6. Does the Pattern Dissolve?

  You asked if this might dissolve under scrutiny. It holds up, but with one caveat: **Calibration.**

  If your insurance model says 70% fraud, and over 100 cases, 90 turn out to be fraud, your colleagues *will* say the model is wrong. The immunity only exists for the *single case*.
  However, in medicine, if a doctor has a 90% success rate and over 100 cases, 90 succeed, but *your sister* fails, the family *still* feels the statistic was "wrong about her."

  This confirms the **Singular Accountability Asymmetry**. In insurance, the *aggregate* validates the *singular*. In medicine, the *singular* is felt to override the *aggregate* because the "unit of value" is the individual life, not the portfolio return.

  ### Summary

  The word you are looking for doesn't exist as a single dictionary term, but the concept is the **Normative Load of the Singular.**

  *   **Insurance:** The number is a **Tool for Sorting.** (Single case error is acceptable noise).
  *   **Medicine:** The number is a **Proxy for Knowledge.** (Single case error is unacceptable ignorance).
  *   **Law:** The number is a **Substitute for Narrative.** (Single case error is a violation of rights).
  *   **Betting:** The number is a **Price for Risk.** (Single case error is a cost of business).

  The asymmetry arises because we tolerate randomness in **finance**, but we demand causality in **care** and **justice**. When you present a number, you must declare whether it is a **price** (actuarial) or a **promise** (epistemic). Your colleagues treat it as a price; your sister's family treated it as a promise.
