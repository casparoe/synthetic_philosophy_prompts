  You press me hard, and rightly so, for Frank was the sharpest mind I ever encountered, and his argument on coherence is indeed a formidable piece of logic that I cannot simply wave away. I concede that if probability is defined solely as a measure of actual psychological belief, then consistency in betting is the only standard we have to prevent sure loss, and on this narrow ground of rational conduct, Ramsey has bested my earlier attempts to define probability purely by introspection. However, you mistake my aim if you think I sought merely to describe how men *do* bet; I sought to explain why, given the same evidence, one expectation is objectively more reasonable than another, regardless of whether anyone is willing to lay a wager. The Dutch Book argument secures consistency, but it says nothing about the *validity* of the initial quotients, and it presupposes a numerical precision that often does not exist in our logical relations; two men may be perfectly coherent yet hold vastly different beliefs on the same evidence, and my theory claims there is a logical relation between evidence and hypothesis that makes one of them more right than the other, even if I must admit I never satisfactorily articulated how we perceive this relation. So, while coherence governs the arithmetic of belief, it does not explain the origin of the reasonable degree of belief itself, which remains, I suspect, a logical relation waiting for a clearer epistemology than I provided.
