prompt: |-
  I help run a lunchtime philosophy group at the software company where I work — mostly engineers, zero philosophy background, but honestly they'll argue with you all day if you get past the jargon. Next session is on pragmatist theories of truth, specifically Peirce vs. James, because last month someone tossed out "isn't that just 'truth is whatever works for you'" and the whole discussion collapsed from there and I had to wave my hands. I've got 45 minutes and a whiteboard.

  Don't write me the explanation itself — I can do that part. I need the plan. What has to be in place before I even say the word "truth" (I'm guessing Peirce's picture of inquiry settling down, if pressed indefinitely by whoever cares to investigate, has to come first, so that James's version — truth as what a belief does for the believer's life, verified along the way — shows up as a deformation of it rather than just a different mood). Then one carrying example for the whole session that separates "useful because true" from "true because useful": I'm tempted by a debugging example (the hypothesis about the bug that any competent engineer would converge on if they traced it forever, vs. the story about the system that's just easiest to live with) — but please actually evaluate whether that works or whether it smuggles in the wrong side, and if it fails, tell me what the example must have and lack and give me a better one. Then the misconception map: I expect "pragmatism = relativism," "James licenses wishful thinking," and "Peirce was just James but earlier and more rigorous," and I want to know at exactly which point in the sequence each one gets headed off — not in a Q&A scramble at the end. Plus one closing question I could ask that would tell me whether they actually got the distinction rather than just enjoyed the vibe. And whatever genuinely can't be done in 45 minutes, tell me to flag it as out of scope up front instead of fudging it.

  One more wrinkle: I got into this after reading somewhere that Peirce himself was annoyed at James for what he did with the idea, grumbling that James had turned his principle into something about being practical in the everyday business sense. I'm not sure how much of that historical grievance to bring in — does it help the group see the contrast, or is it just gossip? You decide where it belongs in the sequence or whether to cut it entirely. Also feel free to tell me if my whole framing (Peirce-first, James-as-deviation) biases the session unfairly — I read enough to know some people think that ordering is itself a contested interpretation, and if so I'd rather know than steamroll the group with it.
