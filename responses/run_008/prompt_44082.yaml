answer: |-
  Here is a 50-minute lesson plan designed to move students from computational confusion to conceptual clarity.

  ### **Session Goal**
  To demonstrate that probability is not an intrinsic property of an object (the chord), but a property of the **process** used to generate it. The "paradox" dissolves when the sampling mechanism is specified.

  ### **1. Prerequisites: The Principle of Indifference (10 Minutes)**
  **Objective:** Establish where the Principle of Indifference (PoI) works and where it becomes ambiguous. Do not start with the circle.

  *   **The Comfort Zone (Discrete):** Start with a die. Why is $P(6) = 1/6$? Because of symmetry and ignorance. We have no reason to prefer one face over another. This is PoI working correctly on a finite set.
  *   **The Danger Zone (Continuous):** Move to a stick of length 1. You break it at a "random" point.
      *   *Ask:* "What is the probability the break is in the first half?" (Answer: 1/2).
      *   *Ask:* "How do you know?" (Answer: We assume the break point is uniformly distributed along the length).
      *   *The Trap:* Ask, "What if I choose the break point by picking a random *area* on a square attached to the stick?"
      *   *Key Takeaway:* In continuous spaces, "random" is meaningless without specifying the **measure** (length, area, volume, etc.). "Uniform" on length is not "uniform" on area.
  *   **Why this matters:** You are inoculating them against the idea that "random" is a default state. It is a modeling choice.

  ### **2. The Setup: Circle and Triangle (5 Minutes)**
  **Objective:** Define the geometric problem clearly without ambiguity.

  *   Draw a circle of radius $R$.
  *   Inscribe an equilateral triangle.
  *   **The Question:** "If we draw a **random chord**, what is the probability its length exceeds the side of the triangle?"
  *   **The Pause:** Before solving, ask: "Define 'random chord' for me."
  *   *Anticipate:* Students will say "Pick two points on the edge" or "Pick a midpoint."
  *   *Action:* Do not validate any single definition yet. Write their suggestions on the board as **Method A**, **Method B**, etc. Tell them you will test *all* of them.

  ### **3. The Physical Demonstrations (15 Minutes)**
  **Decision:** **Yes, use concrete physical demonstrations.** Abstract drawing invites the suspicion that the teacher is "drawing to fit the answer." Physical generation forces the students to accept the *process* as the source of truth.

  Use one large magnetic board or projected interface for all three to keep the focus on the *rule change*, not the props.

  *   **Method 1 (The Endpoints):**
      *   *Apparatus:* Two spinners on the circumference.
      *   *Action:* Spin both. Connect the points.
      *   *Math:* Fix one point. The other must land in the 1/3 arc opposite to it.
      *   *Result:* **1/3**.
  *   **Method 2 (The Radius):**
      *   *Apparatus:* One spinner for angle, one ruler for distance from center $d \in [0, R]$.
      *   *Action:* Pick angle, pick distance $d$ uniformly. Draw chord perpendicular to radius.
      *   *Math:* Chord is long if $d < R/2$. Since $d$ is uniform on $[0, R]$, probability is $(R/2)/R$.
      *   *Result:* **1/2**.
  *   **Method 3 (The Midpoint):**
      *   *Apparatus:* A "dartboard" circle.
      *   *Action:* Throw a dart. Where it lands is the *midpoint* of the chord.
      *   *Math:* Chord is long if midpoint falls inside the incircle of the triangle (radius $R/2$). Probability is Area(Small)/Area(Large) = $\pi(R/2)^2 / \pi R^2$.
      *   *Result:* **1/4**.

  **Pedagogical Note:** Emphasize the visual density. In Method 2, midpoints cluster near the center (linear uniformity). In Method 3, midpoints are spread evenly over the area (area uniformity). This visual difference is the key to the "no calculus" understanding.

  ### **4. Addressing Misconceptions (10 Minutes)**
  **Objective:** Head off the three specific misconceptions you identified.

  *   **Misconception 1: "One answer is secretly right; the others cheated."**
      *   *Intervention:* Point to the math on the board. "Did I integrate wrong? Did I measure area wrong?" No. The math is flawless. The *premises* differed.
      *   *Analogy:* "If I ask 'How far is New York?', the answer depends on whether you measure from my house, the city center, or the airport. All are correct distances; the question was incomplete."
  *   **Misconception 2: "Probability theory is inconsistent."**
      *   *Intervention:* Probability is consistent logic applied to models. If the model ("random chord") is ill-posed, the output is undefined. The theory isn't broken; the *question* was.
  *   **Misconception 3: "The Principle of Indifference tells us the truth."**
      *   *Intervention:* Return to the stick example. PoI says "treat unknown options equally." But in infinite sets, *which* options? Uniform on radius? Uniform on area? Uniform on angle? PoI is a constraint we *apply*, not a law of nature we *discover*. It strains when symmetry is ambiguous.

  ### **5. Resolution & Scope (5 Minutes)**
  **Objective:** Close the session without overcomplicating.

  *   **The Moral:** "Random" is shorthand for a specific physical or algorithmic procedure. In real-world science, you never ask "What is the probability of X?" You ask "What is the probability of X *given process Y*?"
  *   **What to Cut:**
      *   **Jaynes's Invariance Solution:** Cut it. It requires calculus and transformation groups. It suggests there *is* a "correct" physical answer (the straw drop), which might confuse the moral that *context* dictates the method.
      *   **The Cube Factory (von Mises):** Cut it. It's the same paradox in 3D. It reinforces the point but eats time better spent on the exit question.
  *   **Closing Statement:** "Bertrand's Paradox isn't a paradox of math. It's a paradox of language. It teaches us to be precise about how we generate data."

  ### **6. The Exit Question (5 Minutes)**
  **Objective:** Distinguish memorization from understanding.

  Do not ask for the three probabilities. Do not ask for the derivations. Ask them to link the **probability** back to the **process**.

  **The Question:**
  > "A computer program is written to simulate 'random chords.' It picks a point $(x, y)$ uniformly from the **area** of the circle and declares that point to be the chord's midpoint.
  >
  > 1. What probability does this program output for the chord being longer than the triangle side?
  > 2. A second program picks a distance $d$ uniformly from $[0, R]$ and an angle $\theta$ uniformly from $[0, 2\pi]$. Why does this program produce a *different* probability, even though both claim to pick 'random' parameters?"

  **Grading Rubric (Mental Check):**
  *   **Memorizer:** Will answer "1/4" for part 1. For part 2, they will say "Because one is area and one is length," but may struggle to explain *why* that changes the density of chords.
  *   **Grasper:** Will answer "1/4" for part 1. For part 2, they will explicitly state that **uniformity on the radius clusters midpoints near the center**, whereas **uniformity on the area spreads them out**, changing the weight given to long vs. short chords. They understand that "random parameter" $\neq$ "random object."

  ### **Summary of Logistics**
  *   **Props:** Large circle board, 2 spinners, 1 ruler, 1 "dart" (magnetic dot).
  *   **Board Work:** Three columns. Label them by *Method*, not by *Answer*.
  *   **Tone:** Investigative. You are not revealing a trick; you are revealing a definition.
  *   **Time Management:** If the demos run long, cut the derivation of Method 1 (it's the most intuitive) and focus on the tension between Method 2 (linear) and Method 3 (area), as that highlights the measure problem best.
