answer: |-
  **MEMORANDUM**

  **TO:** Investment Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Recommendation: Proposal on Ambiguity Budgeting

  **Recommendation**

  I recommend that the Committee **adopt a modified version** of the consultant's proposal.

  Specifically, we should reject the proposed *quantity cap* (the "ambiguity budget") and replace it with an **Ambiguity-Adjusted Hurdle Rate**. Under this framework, assets with unquantifiable return distributions are not excluded or capped by allocation size. Instead, they must clear a higher required rate of return commensurate with the degree of model disagreement or data scarcity. Additionally, any such investment must pass a "robustness stress test" demonstrating solvency under the adverse assumptions of the conflicting models (e.g., the pessimistic climate infrastructure pricing model).

  **Normative Position: Ambiguity Aversion is Defensible**

  This recommendation rests on a definite normative stance: For a university endowment, ambiguity aversion is not a cognitive bias to be corrected, but a rational fiduciary response to model risk.

  While standard expected utility theory suggests investors should maximize based on best-estimate probabilities, endowments operate under distinct constraints that make ambiguity costly. We are not a perpetual hedge fund with unlimited capital calls; we are a liquidity-constrained institution with a mandatory spending rule. This creates path dependency. If our "best estimate" on an ambiguous asset proves wrong due to structural model error (rather than random variance), the resulting drawdown may force us to cut spending or lock in losses at the precise moment we should be rebalancing. In this context, treating an urn of unknown composition as riskier than a known 50/50 urn is not an Ellsberg bias; it is a recognition that *parameter uncertainty* compounds *market risk*.

  **The Modification: Pricing Uncertainty Rather Than Rationing It**

  The consultant's original proposal imposes a hard cap on ambiguous assets. This is operationally blunt. It treats a 1% allocation to a highly ambiguous venture the same as a 10% allocation, provided the total bucket remains under the limit. It also risks arbitrarily excluding asset classes that offer vital diversification benefits simply because their history is short.

  The **Ambiguity-Adjusted Hurdle Rate** corrects this by integrating ambiguity into the price mechanism.
  1.  **Mechanism:** If the Investment Staff proposes an asset where validated models disagree (like the climate infrastructure fund), the Investment Committee will apply a penalty spread to the hurdle rate. For example, if the standard hurdle for private infrastructure is 8%, and model disagreement implies significant Knightian uncertainty, the hurdle may rise to 10% or 12%.
  2.  **Rationale:** This allows us to harvest the ambiguity premium (addressing Faction 3) but only if the expected return is sufficiently high to compensate for the risk that *all* models are wrong. It converts a binary "in/out" decision into a continuous risk-return tradeoff.

  **Engaging the Losing Side: The "Alpha" Argument**

  The strongest argument against this approach comes from the faction viewing ambiguity aversion as a bias (Faction 2 and 3). Their position is that ambiguity premiums are essentially "free alpha" left on the table by fearful investors. They argue that as a long-horizon investor, we should act as the "smart money" that absorbs this uncertainty, using best-estimate probabilities to price assets. They contend that by discounting these assets, we are irrationally paying a premium for safety we do not need.

  This argument fails to distinguish between *risk* (known distribution) and *model error* (unknown distribution). The "Alpha" argument assumes that estimation errors are independent and wash out over time. However, ambiguity often arises from non-stationary environments—such as climate change—where history is not a reliable guide to the future. In these regimes, errors are correlated and systemic. If we invest based on a "best estimate" that ignores the possibility that the model structure itself is flawed, we are not harvesting alpha; we are selling insurance against tail events without charging adequate premiums. Our modification ensures we only take this exposure if the expected return explicitly compensates us for the possibility that our models are structurally broken.

  **Operationalizing the "Guess"**

  By modifying the proposal to focus on hurdle rates and stress testing, we resolve the operational dilemma of how to act when our best estimate is "somebody's guess."

  Under the original "Ambiguity Budget," a guess triggers a cap. Under my modified framework, a guess triggers a **discount**. When the staff presents an investment where the return distribution is derived from conflicting models:
  1.  We do not ask them to pick the "right" model.
  2.  We require them to value the asset under the *most adverse* of the plausible models.
  3.  We require the investment to clear the hurdle rate even under that adverse valuation.

  This ensures that if our "guess" is wrong, it is wrong in a way we can afford. We do not need to know the true probability distribution to invest prudently; we only need to know that the margin of safety is wide enough to absorb the error.

  **Conclusion**

  The consultant's instinct to flag ambiguity is correct, but his tool is too rigid. By adopting the Ambiguity-Adjusted Hurdle Rate, we uphold prudent stewardship without surrendering the diversification and return benefits of complex assets. We acknowledge that ambiguity is costly without treating it as forbidden.

  I move that we instruct the staff to draft implementation guidelines for this modified framework by next quarter.
