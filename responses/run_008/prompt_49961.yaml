prompt: |-
  A bit of context first: I'm a philosophy MA student and I have to hand a roughly two-page thesis proposal to my advisor in a few weeks. My topic is the paradox of fiction, but here's my problem -- every time I read the classic statement of it (we feel fear/pity for fictional characters, those emotions require belief that something bad is happening, and we don't believe any such thing), my mind wanders to the weird cases instead of the canonical ones. My half-formed idea is that the standard solutions -- the make-believe/quasi-emotion camp, the thought-theory camp, the illusion camp -- were all reverse-engineered for the canonical case, and they've basically never been stress-tested on what I've been calling "reality-entangled" cases: getting angry at a real actor because of what their character did, watching something like a historical drama about real people and feeling you now know them, rewatching a movie and crying at a scene you've seen ten times and know beat by beat, an author dying mid-series and that retroactively changing how the remaining books feel, parasocial attachment to characters. In some of these the emotion seems to have a real object, in some a fictional one, and in some it's genuinely unclear. My hunch is that once you sort cases by the reality-status of the emotional object, the paradox either dissolves or multiplies -- and I want the thesis to figure out which.

  Can you turn this into an actual proposal? I need: a precise statement of the question (my advisor's first question will be "what is the thesis of the thesis," and I need a determinate answer, not a vibe), why the existing positions leave it open -- without rehashing the three premises for the billionth time -- and the method for a nine-month MA thesis. It's pure philosophy, no empirical work, though building a taxonomy of cases and seeing which solutions handle which cases might be the actual core contribution, I'm not sure. Also tell me honestly what would count as the project failing, and whether the whole thing is too big for an MA thesis and should be narrowed -- e.g., down to just the real-people-in-fiction cases, or just the rereading/rewatching ones. If you think my "reality-entangled" framing is confused or just relabels a distinction people already draw, please say that too, better to find out now than in my advisor's office.

  No citations or literature review needed, I'll slot those in myself. Just make it a document I could actually hand in: question, motivation, why it's open, what I'd do month by month, what failure looks like. Casual is fine but it can't be hand-wavy.
