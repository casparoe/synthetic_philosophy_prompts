  Here is a draft of the proposal document, written to be handed directly to your advisor, followed by a section of "off-the-record" feedback on scope and viability.

  ***

  # Thesis Proposal

  **Working Title:** Stress-Testing the Paradox of Fiction: Ontological Hybrids and the Taxonomy of Emotional Objects

  **1. The Research Question**
  The standard formulation of the Paradox of Fiction relies on a binary distinction between "fictional objects" and "real objects." Current solutions (Make-Believe, Thought Theory, Illusion) are optimized to resolve the tension in canonical cases (e.g., fearing a monster known to be nonexistent). This thesis asks: **Does the Paradox of Fiction persist, dissolve, or fragment when applied to "ontologically hybrid" cases where the object of emotion is neither purely fictional nor purely real?**

  Specifically, I will investigate whether the paradox is a single philosophical problem or a category error resulting from treating "fiction" as a monolithic ontological category. My working hypothesis is that sorting cases by the reality-status of the emotional object reveals that existing solutions are not competing answers to one question, but partial solutions to distinct problems.

  **2. Motivation and Gap in the Literature**
  The existing literature treats the Paradox of Fiction as a problem of *psychological consistency* regarding *purely fictional* entities. The three premises (we feel emotions; emotions require belief in existence; we lack that belief) are debated extensively, but the second term—"the fictional entity"—is rarely interrogated beyond the binary of exists/does-not-exist.

  This leaves a significant gap regarding "boundary cases" where the ontology of the object is ambiguous or mixed. For example:
  *   **Historical Fiction:** We feel pity for a dramatized version of a real person (e.g., Lincoln in a film). We believe the person existed, but not that the specific depicted suffering occurred.
  *   **Actor/Character Conflation:** Audiences feel anger toward an actor for the actions of their character. The object of anger is a real person, but the cause is a fictional action.
  *   **Parasocial/Serialized Fiction:** An author's death mid-series retroactively alters the emotional status of the remaining text. The fiction becomes a "fragment of reality" (a historical artifact of an unfinished life).

  Existing theories are not stress-tested against these cases. Make-Believe theory struggles when the object is partially real; Thought Theory struggles when the emotion is directed at a real person (the actor) for a fictional reason. By focusing exclusively on canonical cases, the literature risks solving a simplified version of the problem while leaving the actual phenomenology of fiction consumption unexplained.

  **3. Thesis Statement**
  I argue that the Paradox of Fiction is not a single paradox but a family of problems distinguished by the ontological status of the emotional object. Consequently, a unified solution (e.g., "all fiction emotions are quasi-emotions") is insufficient. Instead, I will propose a **Typology of Emotional Objects** that maps specific ontological configurations (Pure Fiction, Hybrid, Real-Target/Fictional-Cause) to the appropriate philosophical explanation. The paradox dissolves only when we stop treating "fiction" as a uniform category.

  **4. Methodology**
  This is a project in pure philosophical analysis. It will proceed in three stages:
  1.  **Taxonomy Construction:** I will define a rigorous typology of "boundary cases" based on the ontological status of the object (e.g., *Ontologically Hybrid* vs. *Epistemically Stable*). I will exclude cases that are purely psychological (e.g., simple suspense) to focus on ontological ambiguity.
  2.  **Stress-Testing:** I will apply the three dominant solutions (Walton's Make-Believe, Carroll's Thought Theory, and the Illusion Theory) to these boundary cases. I will look for points of failure where a theory requires ad hoc adjustments to accommodate the hybrid nature of the object.
  3.  **Synthesis:** I will argue for a pluralist approach. If the Typology holds, the "solution" to the paradox is recognizing that different emotional relations to fiction require different metaphysical accounts.

  **5. Timeline (9 Months)**
  *   **Months 1-2:** Refine the taxonomy. Select 3-4 specific "boundary cases" to serve as the primary test beds (e.g., Historical Drama, Actor Conflation). Finalize literature review on existing solutions.
  *   **Months 3-4:** Draft Chapter 1: The limits of the canonical formulation. Why the binary distinction fails.
  *   **Months 5-6:** Draft Chapter 2: The Stress Test. Applying Walton, Carroll, etc., to the boundary cases. Identifying the specific friction points.
  *   **Month 7:** Draft Chapter 3: The Typology Proposal. Arguing for the pluralist solution.
  *   **Month 8:** Full draft revision. Checking for coherence and tightening arguments.
  *   **Month 9:** Final polish and formatting.

  **6. Conditions for Failure**
  This project would fail if:
  *   **Triviality:** The existing theories can accommodate the boundary cases with only minor, non-substantive tweaks. (e.g., if Make-Believe theory can easily explain anger at actors as "make-believed anger" without losing explanatory power).
  *   **Psychological Reduction:** The analysis devolves into empirical claims about audience psychology rather than philosophical claims about the ontology of the object.
  *   **Scope Creep:** The taxonomy becomes a list of examples without a unifying philosophical principle connecting them.

  ***

  # Off-the-Record Feedback (The "Reality Check")

  Here is the honest assessment you asked for, regarding the framing, scope, and viability.

  **1. On the "Reality-Entangled" Framing**
  "Reality-entangled" is a bit vague and sounds more like media studies terminology than analytic philosophy. In the proposal above, I shifted this to **"Ontologically Hybrid Cases."** This is sharper. It signals to your advisor that you are making a metaphysical claim about the *object* of the emotion, not just a phenomenological claim about how it feels.
  *   *Keep:* The core insight that the object's status varies.
  *   *Drop:* The label "reality-entangled." Use "ontological ambiguity" or "hybrid objects."

  **2. On Scope (Crucial)**
  Your original list of cases is too big for 9 months.
  *   **Rewatching:** This is actually a different problem. It challenges the *belief* premise (I know what happens), not the *object* premise (the object is still fictional). Mixing this with the "Angry at Actor" case might confuse your taxonomy.
  *   **Author Death:** This is very niche and risks becoming about biography rather than fiction.
  *   **Recommendation:** Narrow your thesis to **Ontologically Hybrid Objects** (Historical Fiction and Actor/Character Conflation). These two directly challenge the idea that the object is "non-existent." Leave "Rewatching" for the conclusion as a secondary point about epistemic status, or cut it entirely.
  *   *Why?* If you try to solve the "Rewatching" paradox (which is about knowledge) and the "Actor" paradox (which is about reference) simultaneously, you might end up with two mini-theses instead of one. The "Hybrid Object" angle is the strongest philosophical hook.

  **3. On Failure Conditions**
  I was blunt in the proposal, but here is the nuance: The biggest risk is **Walton**. Kendall Walton's *Mimesis as Make-Believe* is incredibly elastic. He can arguably explain anger at an actor as a "prop-oriented make-believe" game.
  *   *Your Counter:* You need to argue *early* that while Walton *can* explain it, doing so strips the emotion of its normative force. If I'm actually harassing an actor on Twitter, that's real harm, not make-believe. If the theory calls that "make-believe," the theory is out of touch with the moral reality of the situation. Lean into the **ethical/normative** implications of these boundary cases to make your thesis stick.

  **4. Is it too big?**
  It is borderline. An MA thesis is usually 40-60 pages.
  *   If you try to build a *new* theory: Too big.
  *   If you argue that *existing* theories are incomplete and propose a *classification system* instead of a new theory: Doable.
  *   *Advice:* Position your thesis as a **critique of the unified approach**. You don't need to solve the paradox for every case; you just need to prove that *one* solution cannot cover *all* cases. That is a negative thesis, which is easier to defend in 9 months.

  **5. Final Verdict**
  The idea is strong enough for an MA. It shows you understand the literature (by knowing where it's weak) and you have a clear method (taxonomy/stress-test). Just tighten the scope to "Hybrid Objects" and you should be safe. Good luck.
