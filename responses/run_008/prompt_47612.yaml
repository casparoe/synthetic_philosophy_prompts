  8.  **Self-Correction during drafting:**
      *   *Correction:* Initially, I thought about putting the Legal question higher. But if the science is wrong, the law doesn't matter. The Welfare Scientists' objection that "Neurons != Suffering" is the foundational kill shot. That must be #1.
      *   *Correction:* Make sure the Neuroanatomist objection distinguishes between total neurons and *forebrain/pallial* neurons, as the prompt specifies forebrain.
      *   *Correction:* The "Hope nobody asks" should be the one that exposes the gap between theory and practice most brutally. "How do we measure this without killing the animal?" is the operational killer.

  9.  **Final Polish:** Check the "Must Land" section. It needs to be emphatic. The connection between substrate and capacity is the linchpin.

  *(Self-Correction on "Hope Nobody Asks"):* A philosopher might fear the "marginal cases" argument (humans with low neuron counts). But in an *operationalizing workshop*, the practical "How do you measure this on a live animal?" is more damaging to the *goal* of the workshop. I will choose the Measurement/Feasibility question as the "Hope nobody asks" because it stops the policy dead in its tracks.

  *(Refining the "Must Land"):* It has to be the Cognition vs. Affect reply. If neurons only track IQ, the welfare metric is useless.

