      *   **Core Claim:** Moral status is graded.
      *   **Metric:** Forebrain neuron count (proxy for capacity for valenced experience).
      *   **Rejection:** Species membership (no independent weight), Behavioral criteria (under-reporting), Absolute brain size (body size confound), Encephalization quotients (imprecise).
      *   **Goal:** Operationalizing welfare criteria.

  3.  **Drafting the Objections (Audience Voice):**
      *   *Welfare Scientists:* They care about *evidence of suffering*. They will say, "Neurons don't scream." They worry about false negatives (ignoring suffering in low-neuron animals). They use terms like "trade-off," "analgesic," "affective state."
      *   *Neuroanatomists:* They care about *accuracy*. They know about pallial neurons vs. total neurons, nuclear vs. laminar structures, density issues (e.g., birds vs. mammals). They will ask about specific taxa (cephalopods, insects, birds).
      *   *Legal Scholar:* They care about *application*. "How do I write this into law?" "Where is the cutoff?" "How do I measure this on a farm?"

  4.  **Developing the Replies & Soft Spots:**
      *   *Objection 1: Cognition vs. Affect (Welfare Scientists).* This is the biggest threat. If neurons = smarts, not suffering, the thesis collapses.
