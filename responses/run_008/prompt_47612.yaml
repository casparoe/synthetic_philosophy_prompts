          *   *Reply:* Acknowledge they feel *something*, but the *magnitude/scope* of the moral weight is lower. Don't deny sentience, deny equal weight.
          *   *Soft Spot:* Risk of appearing to dismiss insect welfare entirely.
      *   *Objection 3: Density/Structure (Neuroanatomists).* Birds have dense palliums. Some mammals have large but sparse brains.
          *   *Reply:* Specify *forebrain/pallial* neurons, not total. Acknowledge density matters (cite Herculano-Houzel).
          *   *Soft Spot:* Data gaps for many species.
      *   *Objection 4: Regulatory Bright Lines (Legal).* Graded status is hard to legislate.
          *   *Reply:* Tiers/Bands rather than binary. Risk-based regulation.
          *   *Soft Spot:* Still messy for enforcement.
      *   *Objection 5: Body Size Confound.*
          *   *Reply:* That's why we use neuron count, not mass. Whales have huge brains but low density compared to primates in some areas.
          *   *Soft Spot:* Allometry is still tricky.
      *   *The "Hope Nobody Asks" Question:* Usually something that exposes a fatal flaw or a repugnant conclusion. E.g., "Human infants/anencephalic humans" or "Invasive measurement." Let's go with the Human Exceptionalism/Infant angle or the Measurement Problem. The Measurement Problem is more practical for this workshop. Actually, the *Human* angle is the philosophical killer. If a human has fewer neurons than a chimp (hypothetically/pathologically), do they lose status? Or, more practically: "How do you count neurons in a live pig?" Let's go with the **Measurement/Feasibility** question because it kills *operationalization*.
      *   *The "Must Land" Reply:* The link between neuron count and *valenced experience capacity* (not cognition). If this fails, the metric is irrelevant to welfare.

