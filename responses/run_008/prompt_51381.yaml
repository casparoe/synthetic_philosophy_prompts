answer: |-
  First, take a breath. Copyedit fatigue is a real phenomenon. When you've stared at a sentence for the forty-fifth time, it stops being a vehicle for meaning and starts looking like a strange arrangement of shapes. Your intuition is sharp, though. You've stumbled onto one of the stickiest problems in the philosophy of language, and your gut is mostly right.

  You are asking about **performative utterances** (words that do things) versus **constative utterances** (words that describe things). J.L. Austin, the philosopher who invented this distinction, famously argued that language in fiction is "hollow" or "parasitic." He thought a priest in a play saying "I pronounce you husband and wife" was just pretending to marry people, not actually doing it.

  But as you've noticed, that doesn't explain dedications, libel, or slang. Austin was looking at the *characters*. He missed the *author*.

  Here is the principle that sorts your eight cases, stated in plain language.

  ### The Principle of Real-World Accountability

  **An utterance performs a real-world action if, and only if, the actual human author can be held accountable for its effects in the actual world.**

  If the consequences stay inside the story, the character is accountable. If the consequences leak into reality, *you* are accountable. The "magic" of fiction creates a bubble. Most of the time, speech acts bounce off the inside of that bubble. But when you punch a hole in the bubble—by signing your name, by damaging a reputation, or by introducing a word into the common tongue—the speech act escapes and becomes real.

  It comes down to three questions:
  1.  **Who is speaking?** (The Author or the Puppet?)
  2.  **Where does it land?** (In the World or in the Story?)
  3.  **Who pays the price?** (You or the Character?)

  ***

  ### Handling Your Eight Cases

  Here is how the Principle of Real-World Accountability handles your list. I am not overturning many of your verdicts, but I am clarifying *why* they hold.

  **1. The Priest in the Book**
  *   **Verdict:** Worked (in the story).
  *   **Analysis:** The speaker is a character. The accountability lies within the fictional universe. The couple is married *in the story*. No real-world marriage license is generated. The bubble holds.
  *   **Principle:** Fictional accountability.

  **2. The Dedication**
  *   **Verdict:** Worked (in the real world).
  *   **Analysis:** The speaker is *you*, the author, stepping out from behind the curtain. You are using the book as a physical object to transfer affection/ownership. If you didn't give him the book, you'd be lying. You are accountable.
  *   **Principle:** Real-world accountability.

  **3. The Narrator's Promise**
  *   **Verdict:** Inert.
  *   **Analysis:** The speaker is a construct (the narrator). The audience knows the narrator cannot be held liable for truth in the real world. There is no mechanism for the reader to collect on that promise. It bounces off the inside of the bubble.
  *   **Principle:** Fictional accountability (failed uptake in reality).

  **4. The Coined Phrase**
  *   **Verdict:** Real (realest on the list).
  *   **Analysis:** This is the strongest case for authorial power. You introduced a signifier into the real-world linguistic ecosystem. Your friends use it. You are accountable for its usage and meaning. You changed the real world's vocabulary.
  *   **Principle:** Real-world accountability (via linguistic uptake).

  **5. The Libelous Landlord**
  *   **Verdict:** Real accusation.
  *   **Analysis:** Even though a character says it, *you* wrote it. If the landlord sues, *you* pay, not the narrator. The law pierces the fictional bubble because the damage is real. You are accountable.
  *   **Principle:** Real-world accountability (legal liability).

  **6. The Satirical Senator**
  *   **Verdict:** Nothing happened.
  *   **Analysis:** Here is the nuance. You wrote it, so technically you are the speaker. However, social convention grants satire a "get out of jail free" card. The audience agrees to interpret the speech as *not* factual assertion. Because the convention waives your accountability for truth, the act remains inert.
  *   **Principle:** Real-world accountability (waived by convention).
  *   *Note on reconciling 5 and 6:* In case 5, you presented a jerk as a thief (factual claim). In case 6, you presented a senator as corrupt via exaggeration (opinion/satire). The law and society hold you accountable for facts, not opinions.

  **7. The Disclaimer**
  *   **Verdict:** Legal-ish, but not a lie.
  *   **Analysis:** This is a legal performative. By signing it, you are entering a contract with the publisher and the public. It performs the action of limiting liability. If the characters *were* real, you would be in breach of contract, not necessarily lying about facts. It's a rule-setting move, not a truth claim.
  *   **Principle:** Real-world accountability (contractual).

  **8. The Movie Actor**
  *   **Verdict:** Nothing real.
  *   **Analysis:** The actor is simulating a judge. The director is simulating a courtroom. No one is held accountable for the sentence. The bubble is double-thick (fiction within a fiction).
  *   **Principle:** Fictional accountability.

  **Do any verdicts need overturning?**
  Only a slight adjustment on **Case 7**. You said you don't feel like you'd be "lying." You are correct. The disclaimer isn't a statement of fact; it's a legal shield. If the people *were* real, you wouldn't be a liar; you'd be a defendant. The speech act succeeds legally even if the premise is false.

  ***

  ### Austin and the "Parasitic" Claim

  You asked about Austin's idea that fiction is "parasitic." He argued that fictional speech acts are like a car engine running in neutral—the parts move, but the car doesn't go anywhere.

  Your gut is right to reject this for cases 2, 4, and 5. Austin was analyzing the *characters*. He assumed the author was invisible. But when you write a dedication, coin a word, or commit libel, you are not invisible. You are punching through the neutral gear.

  *   **Case 2 (Dedication):** Not parasitic. It's the author speaking directly.
  *   **Case 4 (Coinage):** Not parasitic. It's the author changing the language.
  *   **Case 5 (Libel):** Not parasitic. It's the author causing harm.

  The fiction is only "parasitic" when the author successfully hides behind the characters (Cases 1, 3, 8). When the author gets caught (Cases 2, 4, 5, 7), the speech act becomes fully fertile.

  ***

  ### Predictions for New Cases

  Here is what the Principle of Real-World Accountability predicts for your three new scenarios.

  **(a) The Author's Note Apology**
  *   *Scenario:* You put a note at the end apologizing to your hometown.
  *   *Prediction:* **This is a real apology.**
  *   *Why:* You are speaking as the Author, not the Narrator. You are signing your name (implicitly or explicitly) to a sentiment that acknowledges real-world harm. If the town accepts it, the relationship changes. You are accountable for the sentiment. It is a performative act of contrition.

  **(b) The Grandmother's Letter**
  *   *Scenario:* You reprint a real letter where she promised your grandfather something.
  *   *Prediction:* **The promise is not re-performed.**
  *   *Why:* The promise was a speech act that happened *then*. Reprinting it is a *report* of a speech act, not the act itself. It's like printing a recording of a wedding vow; it doesn't marry the couple again. The accountability belonged to your grandmother in her specific context. You are merely displaying evidence of her accountability. The promise is "frozen," as you guessed.

  **(c) The Reading Event**
  *   *Scenario:* You read the priest's wedding lines aloud to an audience.
  *   *Prediction:* **No marriage occurs, but a performance does.**
  *   *Why:* You are the author, but in this context, you are simulating the character. The audience knows you are not acting as a priest with legal authority. There is no real-world accountability for the marital status of the characters. However, you *are* performing the act of "reading," and that is real. You are entertaining them. The wedding is inert; the reading is live.

  ***

  ### A Final Thought for the Copyedits

  The reason this feels messy is that a novel is a hybrid object. It is a physical thing in the real world (paper, ink, legal liability) and a mental thing in the imagination (story, emotion, fictional truth).

  When you are writing the story, you live in the mental thing. When you are dealing with dedications, disclaimers, and libel, you are dealing with the physical thing.

  Your fatigue comes from trying to hold both in your head at once. During copyedits, you are forced to look at the physical object (the text). That is why the "realness" of the words is bothering you. You are looking at the engine while it's supposed to be driving the car.

  Trust your gut. You know when you are speaking as the Author and when you are speaking through the Puppet. That distinction is the only one that matters.

  Good luck with the final pass. Toward the finish line now.
