answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Seminar:** Theories of Truth (Graduate Level)
  **Signatories:** [The Dialetheist], [The Classicist]
  **Date:** October 26, 2023

  ### I. Agreed Claims

  We, the undersigned, acknowledge the following claims as common ground. We accept these as the starting point for our debate, agreeing that any adequate theory of truth must account for these data points without special pleading.

  1.  **The Compelling Nature of the T-Schema:** Instances of the T-schema ($T\langle A \rangle \leftrightarrow A$) are pretheoretically compelling. Abandoning them universally is unacceptable; abandoning them selectively requires a principled justification that does not merely stipulate the desired outcome.
  2.  **Inconsistency of Naive Truth:** Given classical logic, a naive theory of truth (which accepts the unrestricted T-schema and standard structural rules) is inconsistent. The Liar paradox demonstrates that from plausible premises, a contradiction ($L \land \neg L$) is derivable.
  3.  **The Status of Explosion:** The principle of *Ex Falso Quodlibet* (Explosion: $A \land \neg A \to B$) is a valid theorem of classical logic. It is not a misunderstanding or a historical accident, but a formal consequence of the classical definitions of conjunction, negation, and validity.
  4.  **Utility of Classical Logic:** Classical logic is the appropriate instrument for reasoning about consistent subject matters, including ordinary arithmetic, empirical science, and most everyday discourse. We agree that classical logic is not "wrong" in these domains.
  5.  **Pretheoretic Data:** Ordinary speakers, when confronted with the Liar sentence ("This sentence is not true"), exhibit unstable intuitions. They are inclined to assert it and deny it, or to feel that it is true if and only if it is false. A solution must explain this instability, not merely suppress it.
  6.  **Criteria for Solution:** A successful solution to the semantic paradoxes must do more than block the derivation of contradiction. It must explain *why* the paradox arises (diagnostic adequacy) and justify the proposed revision to logic or truth theory (cost-benefit adequacy). Merely restating the problem (e.g., by labeling the Liar "ungrounded" without explaining why ungroundedness blocks truth) is insufficient.

  ### II. Map of Disagreements

  We disagree on the interpretation of the data above. To ensure we are not arguing past one another, we have formulated our opposing positions below. Each row describes the same point of contention. The left column is phrased such that the Dialetheist accepts it as an accurate description of her view; the right column is phrased such that the Classicist accepts it as an accurate description of his. Neither formulation presupposes the falsity of the other.

  | Topic | Dialetheist Formulation | Classicist Formulation |
  | :--- | :--- | :--- |
  | **The Status of the Liar** | The Liar sentence is a true contradiction: it is both true and not true. The inconsistency lies in the semantic reality itself. | The Liar sentence demonstrates that naive truth cannot be consistently maintained. The sentence is either truth-valueless, indeterminate, or the T-schema must be restricted. |
  | **The Scope of Logic** | Classical logic is not universally valid. It fails in semantic contexts involving self-reference, requiring a paraconsistent logic (e.g., LP) to handle these cases correctly. | Classical logic is universally valid. Apparent failures in semantic contexts arise from equivocation, category errors, or defects in the language, not from flaws in the logic. |
  | **The Cost of Revision** | Rejecting Explosion is a theoretical cost, but it is preferable to the cost of restricting the T-schema or accepting truth-value gaps. It preserves the transparency of truth. | Rejecting Explosion is a prohibitive theoretical cost that undermines the normative force of logic. Restricting the T-schema is preferable to accepting that contradictions can be true. |
  | **The Nature of Assertion** | One can rationally accept a contradiction without accepting *everything*. Acceptance of $A$ and $\neg A$ does not entail rational collapse. | To assert $A$ and $\neg A$ is to violate the norm of consistency. If one accepts a contradiction, one has no rational barrier to accepting arbitrary claims (pragmatically, if not formally). |

  ### III. Cruxes and Predictions

  We have identified specific subquestions ("cruxes") where settling the matter would move at least one party. For each crux, we identify a specific argument or phenomenon that bears on it, and we record our predictions in advance.

  **1. The Revenge Problem**
  *   **Question:** Are revenge paradoxes (e.g., "This sentence is not true or glutty") a principled objection to dialetheism, or are they handled by the same machinery that handles the Liar?
  *   **Relevant Case:** The "Extended Liar" in the context of LP (Logic of Paradox).
  *   **Dialetheist Prediction:** Revenge sentences are simply more true contradictions. The dialetheic machinery treats them identically to the standard Liar; no new hierarchy is needed.
  *   **Classicist Prediction:** Revenge paradoxes show that dialetheism cannot express its own semantic categories (e.g., "just false"). To define the logic, the dialetheist must use a classical meta-language, conceding the universality of classical logic.

  **2. Detachment and Modus Ponens**
  *   **Question:** Is the failure of Modus Ponens for the material conditional in logics like LP a serious cost, or an artifact of conflating the material conditional with a detachable conditional?
  *   **Relevant Case:** The behavior of the conditional in LP vs. a relevant conditional (e.g., in $LP_m$ or $RM3$).
  *   **Dialetheist Prediction:** The failure is an artifact. A suitable detachable conditional can be added to the system without restoring Explosion. The material conditional is not the "real" implication.
  *   **Classicist Prediction:** The failure is a serious cost. If a logic cannot support Modus Ponens for its primary conditional without risking triviality, it cannot serve as a norm for inference. Adding a stronger conditional inevitably reintroduces Curry's paradox.

  **3. Ordinary Inconsistencies**
  *   **Question:** Are putative ordinary contradictions (inconsistent laws, conflicting databases, borderline vagueness) real contradictions in the dialetheist's sense, or something weaker that both theories can classify differently?
  *   **Relevant Case:** A legal system containing statute $A$ and statute $\neg A$.
  *   **Dialetheist Prediction:** These are genuine, localized contradictions. The world (or our normative reality) is sometimes inconsistent, and paraconsistent logic allows us to reason through them without explosion.
  *   **Classicist Prediction:** These are conflicts of *prescription* or *information*, not contradictions in *truth*. The logic remains classical; the conflict is resolved by priority rules or by acknowledging error in the database.

  **4. Curry's Paradox and Localization**
  *   **Question:** Do the Liar and Curry's paradoxes show that dialetheism localizes the problem, or merely relocates it?
  *   **Relevant Case:** Curry's sentence ($C$: "If $C$ is true, then $B$").
  *   **Dialetheist Prediction:** Dialetheism localizes the problem. By rejecting contraction or Modus Ponens for the conditional, we block Curry while accepting the Liar. The cost is contained.
  *   **Classicist Prediction:** Dialetheism relocates the problem. To block Curry, the dialetheist must weaken the conditional so much that it no longer functions as implication, effectively surrendering the ability to reason about conditionals classically.

  **5. [Added Crux] The Norms of Assertion and Denial**
  *   **Question:** Can the act of "denial" be pragmatically distinguished from "asserting negation" in a way that preserves rational communication?
  *   **Relevant Case:** A dialogue where one party asserts $L$ and the other denies $L$.
  *   **Dialetheist Prediction:** Yes. Denial is a primitive speech act distinct from asserting $\neg$. A dialetheist asserts $L$ and denies $L$, communicating inconsistency without confusion.
  *   **Classicist Prediction:** No. In a shared public language, denial just *is* asserting negation. If the dialetheist asserts $L$ and denies $L$, she is asserting $L \land \neg L$, which signals a breakdown in communication norms.

  ### IV. Verdict on Verbal vs. Substantive Dispute

  We have considered the deflationist objection: that our dispute is merely verbal, hinging on the label "true" or the definition of "logic."

  **Verdict:** The dispute is **not merely verbal**, though it contains verbal elements.

  1.  **The Verbal Component:** There is a terminological overlap regarding the word "logic." The Classicist tends to define logic as the study of *truth-preservation* (where truth is exclusive of falsity). The Dialetheist defines logic as the study of *non-triviality preservation* (where information can be inconsistent). If we stipulate definitions rigidly, we could talk past each other. Similarly, if "true" is treated purely deflationarily, the claim "true contradiction" may look like a category error.
  2.  **The Substantive Core:** However, a substantive disagreement survives careful formulation. It concerns **normative guidance for reasoning**.
      *   The Classicist advocates for a normative constraint on belief: *One ought not believe contradictions.*
      *   The Dialetheist advocates for a descriptive adequacy of semantics: *One ought to believe what follows from the evidence, even if it is contradictory.*
      *   This has practical consequences. It affects how we design databases, how we interpret legal codes, how we program AI reasoning systems, and how we teach critical thinking. If the Dialetheist is right, we should build systems that tolerate inconsistency without crashing. If the Classicist is right, we should build systems that force consistency checks at the cost of expressive power.

  **Conclusion for Next Semester:**
  We agree to stop arguing about whether classical logic is "false" or dialetheism is "irrational." Instead, we will focus on **Crux #2 (Detachment)** and **Crux #5 (Norms of Assertion)**. If the Dialetheist can specify a detachable conditional that avoids Curry without collapsing into classical logic, and if she can demonstrate a pragmatic account of denial that facilitates communication, the Classicist agrees to reconsider the "prohibitive cost" claim. Conversely, if the Classicist can demonstrate that all dialetheic solutions require a classical meta-language that reinstates the hierarchy they seek to avoid, the Dialetheist agrees to reconsider the "universality" claim.

  ***

  **Signed,**

  _________________________ (The Dialetheist)

  _________________________ (The Classicist)
