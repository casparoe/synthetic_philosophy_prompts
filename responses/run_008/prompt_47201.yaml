  *(Refining Popper's View):* Popper doesn't say *nothing* can be predicted. He says *large scale historical destiny* cannot be predicted. Conditional predictions (if A then B) are possible. I need to be careful not to caricature Popper as saying "social science is impossible." He says "Historicism is impossible."

