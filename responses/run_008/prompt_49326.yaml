answer: |-
  This is a genuinely sophisticated insight for a high school team. You are absolutely right: your coach is using a shorthand for a value judgment they haven't articulated, and you've correctly identified that this is the same problem AI safety researchers face (specifically "impact regularization" and "attainable utility preservation"). You can't minimize side effects unless you define what counts as "impact" versus "goal achievement."

  Since you asked me to take a position, I am going to take one that might lose you a few points in a specific match but will win you more matches over a season, keep you out of the penalty box, and make you a more desirable alliance partner.

  **The Stance:** We are adopting a **Conservative Integrity** policy.
  **The Logic:** In FIRST, ref consistency is low. If a move relies on a ref agreeing with your interpretation of "legal," you are introducing variance. Variance loses championships. Furthermore, alliance selection is political. Teams pick partners they trust not to get them DQ'd. A team that pushes the rules to the breaking point (like tipping structures) is often left off top alliances because they are seen as a liability. We prioritize **predictability** over **maximum theoretical score**.

  Here is the procedure.

  ***

  # The Pit Crew "Collateral Damage" Checklist

  **Time limit:** 2 minutes max.
  **Who:** Lead Programmer, Drive Coach, or Pit Lead.
  **Tools:** None. Do not open the rulebook. If you need the rulebook to justify it, it's already a red flag.

  ### The Questions

  **1. Is this action strictly necessary to score the points we are targeting?**
  *   **No:** **STOP.** Do not do it. It is by definition a side effect.
  *   **Yes:** Proceed to Q2.
  *   *Note:* "Necessary" means "we cannot score these specific points without this specific movement." It does not mean "this is the fastest way."

  **2. If we do this, can the field return to its original state without human intervention?**
  *   **No (Permanent/Semi-Permanent Change):** **STOP.** (e.g., tipping a structure, bending a pole, leaving game pieces in neutral zones).
  *   **Yes (Transient Change):** Proceed to Q3. (e.g., moving a cone that another robot will pick up).

  **3. Does this action remove the opponent's ability to play, or just make it harder?**
  *   **Removes Ability:** **STOP.** (e.g., trapping them indefinitely, breaking their path).
  *   **Makes it Harder:** Proceed to Q4. (e.g., taking a piece they wanted, blocking a lane temporarily).
  *   *Judgment Call:* This is where strategy meets ethics. Disruption is part of the game; disabling is not.

  **4. If a ref watches this in slow motion, will they hesitate?**
  *   **Yes (They might hesitate):** **STOP.** You are betting your match on a ref's mood.
  *   **No (It's clearly legal):** **GO.**

  ***

  # What This Procedure Cannot Do

  I need to be honest about the limitations so you don't blame the checklist when things go wrong.

  1.  **It cannot predict Ref Variance:** One ref might let you push a cone; another might yellow card you. This checklist minimizes the risk, but doesn't eliminate it.
  2.  **It cannot calculate exact risk/reward:** It doesn't tell you if the 2 seconds saved is worth the risk. It just flags the risk.
  3.  **It is not the Rulebook:** If the rulebook says "You cannot touch X," and this checklist says "Go," the rulebook wins. This is for gray areas only.
  4.  **It relies on honesty:** If the drive team lies to themselves about whether an action is "necessary," the checklist fails.

  ***

  # Running the Cases

  Here is how we apply the **Conservative Integrity** stance using the checklist on your three scenarios.

  ### Case 1: The Neutral Cone Incident
  *Scenario:* Auton pushes a neutral cone into the opponent's zone while transiting to your zone.
  *   **Q1 (Necessary?):** **No.** You were transiting. Pushing the cone was not required to move the robot.
  *   **Verdict:** **STOP.**
  *   **Analysis:** This is a textbook side effect. The goal was "get to zone." The effect was "move cone." Since moving the cone wasn't the goal, it's collateral damage.
  *   **Fix:** Adjust auton pathing to route around neutral pieces, even if it takes 0.5 seconds longer. The risk of a penalty outweighs 0.5 seconds.

  ### Case 2: Crossing the Opponent Loading Zone
  *Scenario:* Auton cuts through opponent loading zone to save 2 seconds.
  *   **Q1 (Necessary?):** **No.** You said going around is possible, just slower.
  *   **Verdict:** **STOP.**
  *   **Analysis:** Under our Conservative Integrity stance, "faster" does not equal "necessary." You are choosing to enter a high-traffic zone belonging to the other alliance.
  *   **The Unpopular Truth:** Saving 2 seconds is rarely worth the risk of contact penalties or annoying your potential future alliance partners. If you become known as the team that cuts through zones, captains will pick the slower robot that stays in its own lane during alliance selection.
  *   **Fix:** Take the longer path. Consistency beats speed.

  ### Case 3: Tipping the Game Structure
  *Scenario:* Max score requires tipping a structure. Rules allow touching, but don't require tipping.
  *   **Q1 (Necessary?):** **Yes** (for this specific max score plan).
  *   **Q2 (Reversible?):** **No.** Once tipped, it stays tipped until reset by humans.
  *   **Verdict:** **STOP.**
  *   **Analysis:** This is where I know the team will push back. "But it's legal!"
  *   **My Defense:**
      1.  **Ref Risk:** Even if the rules allow touching, many rulesets have a clause about "field damage" or "egregious disruption." A tipped structure looks like damage. You are inviting a ref to make a split-second judgment call against you in the heat of the match.
      2.  **Alliance Politics:** Do you want to be on an alliance with a team that tips structures? It makes the field messy for everyone, including your partners in the next match. It signals "We care about our points more than the game ecosystem."
      3.  **Awards:** FIRST awards (Chairman's, Engineering Inspiration) care about culture. Destroying field elements rarely looks good in a submission video.
      4.  **Expected Value:** If there is a 10% chance a ref calls it a penalty and disqualifies you, the expected value of that strategy plummets.
  *   **Fix:** Find the second-highest scoring strategy that leaves the structure standing. Leave the points on the table. Win the match by defense and consistency, not by breaking the scenery.

  ***

  # Final Word

  You asked for a way to make value judgments explicit. Here it is: **We value being a safe, predictable alliance partner over squeezing out marginal points through aggressive field manipulation.**

  This checklist will sometimes feel like it's tying your hands. It is supposed to. It forces you to find solutions that work *within* the spirit of the game, not just the letter. In AI safety, we call this "corrigibility"—making sure the system doesn't break things while trying to help. In FIRST, we call it Gracious Professionalism.

  Print this out. Tape it to the pit wall. If the drive team wants to override a "STOP," the Coach has to sign off on it personally. That friction alone will stop 90% of the bad ideas.

  Good luck at regionals.
