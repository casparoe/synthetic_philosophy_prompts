prompt: |-
  ok so I'm on my school's robotics team (FIRST-style, one robot, lots of alliances) and I've been given a job I don't totally know how to do. our coach keeps telling the programmers "don't cause side effects on the field" and that's it, that's the whole instruction, and honestly it drives me mad because nobody can say what it means. obviously we're SUPPOSED to affect the field, that's the whole game — moving game pieces is literally how you score. but then at our last tournament our auton pushed a neutral cone into another alliance's zone while driving to ours, the refs huddled for like five minutes, and half of them called it a penalty and half didn't, and I realised nobody — not the refs, not our coach, not the rulebook — actually has a definition of "side effect". the rulebook just says don't "unnecessarily damage or disrupt" things which is so vague it might as well not exist.

  I got curious and read some stuff online about how people who work on AI safety deal with this exact problem, because apparently it's a real research question — how do you tell a machine to "avoid side effects" when it needs to change the world to do its job, and when you can't write down everything that matters? like the ideas about measuring how far the robot gets from some default state, or only letting it do things you explicitly listed as fine, or comparing what it can still reach/undo afterwards. I'm not going to pretend I understood all of it, but the thing I took away is: maybe there's no way to define "side effect" without first deciding what counts, and the best you can do is make those value judgements explicit instead of hiding them in a vague word. that actually sounds like something our team could use.

  so here's what I want: write us a decision procedure the pit crew can actually run between matches, in maybe two minutes with no laptop and no philosophy degree. it should be a set of questions in order, it should say what a "yes" or "no" to each question means for the robot's plan, it should mark the points where the procedure can't decide and a human (coach or drive team) has to make a call, and it should be honest about where it's just a judgement call dressed up as a checklist. then run it on three cases from our actual season: (1) the neutral cone thing, (2) our auton crossing through the opposing alliance's loading zone because it's two seconds faster than going around, and (3) a plan where the only way to hit our max score involves tipping over a game structure that the rules let us touch but don't require. I'd like you to actually take a position in the write-up — don't give me "there are several approaches and it depends"; pick one and defend it, even for case 3, which I already know will give us an answer the team won't like. also be upfront about what the procedure can't do. and just so you know, everything you write should be in American English even though I'm writing to you in British — the rest of the team reads it and they'll complain about "colour" lol. cheers!
