      *   *The Problem:* How can "nothing" cause "something"? (The gardener doesn't water, plant dies).
      *   *Position 1: Realism/Absenteeism.* Absences are real entities/forces. (Hard to defend metaphysically).
      *   *Position 2: Counterfactual Dependence.* $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred. (Problem: Too many causes. If the Queen didn't water the plant, is she a cause? Yes, counterfactually. But intuitively no).
      *   *Position 3: Normative/Default Expectations.* Causation depends on what *should* have happened. (The gardener had a duty; the Queen did not).
      *   *Position 4: Process/Mechanism.* Causation requires a physical process/transfer of energy. Omissions lack this. So omissions aren't *real* causes, just explanatory tools.

  3.  **Translate to Narrative Vocabulary:**
      *   *Metaphysics of Absence* $\rightarrow$ *Ontology of the Text.* What exists in the story world?
      *   *Counterfactuals* $\rightarrow$ *Reader Expectation/Alternative Plotlines.*
      *   *Norms/Defaults* $\rightarrow$ *Genre Conventions/Character Motivation/Setup.*
      *   *Physical Process* $\rightarrow$ *On-Page Action/Scene.*

      *   *Drafting the Translation:*
          *   **The Absentee Realists:** Argue the "Negative Space" is actual ink. The silence *is* the sound. The unwritten chapter has weight equal to the written one.
          *   **The Counterfactualists:** Focus on the "What If." If the character *had* made the call, the scene changes. Causation is the difference between the Draft A and Draft B.
          *   **The Normativists (The Duty View):** Focus on "Setup" and "Promise." A Chekhov's Gun creates a *duty* to fire. If it doesn't fire, that omission matters *because* of the setup. Without the setup (the duty), the omission is invisible.
          *   **The Process Theorists:** Focus on "On-Page vs. Off-Page." If it isn't dramatized, it didn't happen. Omission is just a summary label for a lack of scenes, not a causal force itself.

  4.  **Develop the Residue Report:**
      *   *Clean Maps:* Normative view maps perfectly to Chekhov's Gun/Setup-Payoff. Counterfactuals map to Reader Expectation.
      *   *Distortions:* The "Physical Process" view fights against subtext. In fiction, the *lack* of process *is* the process.
      *   *No Expression:* The "Infinity of Non-Causes" (The Queen problem). In narrative, we don't care about the Queen. We care about the POV. The narrative frame filters out the infinite non-causes automatically.

  5.  **Formulate the Verdict:**
      *   *The Core Question:* Is the "infinite non-causes" problem a plot hole?
      *   *Answer:* No. Narrative has a built-in filter: **Relevance/Attention.**
      *   *Why?* Philosophy looks at the *universe* of the story. Readers look at the *contract* of the story.
      *   *The "Letter That Never Arrives":* It works if the *expectation* of the letter is established (Normative). The reader doesn't wonder "Why didn't the postman bring it?" or "Why didn't a bird carry it?" They wonder "Why did the sender not send it?" or "Why did the recipient not check the mail?" based on emotional stakes.
      *   *Reader's Brain:* Uses "Narrative Causation" (E.M. Forster's "The king died and then the queen died" vs. "The king died and then the queen died of grief"). Narrative causation is psychological, not physical. It relies on *salience*, not metaphysical sufficiency.

