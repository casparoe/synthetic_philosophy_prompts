prompt: |-
  I'm taking a philosophy of language seminar on vagueness this semester, and it has collided in an awkward way with my day job as an ML engineer. At work I spend my time around classifiers that output graded confidences, where the obvious view is that the graded output simply is the semantic content and any sharp cutoff — accept above 0.7, reject below — is a threshold we impose for practical reasons. That picture pulls me toward degree-theoretic treatments of vague predicates. But in the seminar, the position that keeps surviving objections surprisingly well is epistemicism: the view that there is a sharp cutoff in the extension of 'heap' or 'bald' all along, and that our sense that no such cutoff exists is mere ignorance, even if it is ignorance of a very strange and in-principle-unremediable kind. My classmates find epistemicism absurd on its face; I've stopped being sure it's worse off than the alternatives, especially once higher-order vagueness starts making trouble for everyone.

  So: give me your credence that epistemicism about vagueness is correct, and I want the derivation, not a survey of the positions. Decompose the question into the sub-claims your number actually rides on — for instance, how likely it is that preserving classical bivalence and a compositional semantics is worth paying the price of unknowable cutoffs; how much weight the tolerance intuition (that removing or adding a single grain can never flip a heap) deserves as genuine data about meaning rather than as a false theory we happen to find natural; whether the sheer unknowability of the cutoffs is evidence against them or just an expected consequence of the view; and any other terms you think belong, such as whether the degree-theoretic rival's problems with higher-order vagueness are deep or merely technical. Assign a rough probability to each term with a one-line justification, show how they combine into your final credence, and tell me which term you are least confident in. Finally, tell me what would move your number most — a particular kind of argument, a worked-out semantics for a rival view, or some class of cases — and whether my ML analogy (graded scores as the semantics, thresholds as pragmatics) is doing any real work in this debate or is just a misleading picture I've imported from the wrong domain.
