answer: |-
  Dear Colleague,

  It is entirely understandable why the criminal trial analogy has become such a sticky fixture in the pedagogy of statistics and the rhetoric of the replication crisis. It offers a ready-made moral architecture for what is otherwise a dry procedural debate, assigning roles of innocence, guilt, and justice to abstract mathematical concepts. However, your instinct to stress-test it before building a feature around it is correct, because while the analogy is pedagogically useful for introducing the mechanics of significance testing, it becomes actively misleading when used to defend the current scientific ecosystem against charges of structural flaw. When you pull on the threads of this comparison, you find that it supports the Bayesian critique far more robustly than it supports the frequentist defense, and ultimately, it may obscure the real engine of the replication crisis rather than illuminate it.

  To begin the audit, we must lay out the correspondences exactly as your sources have presented them. In this mapping, the null hypothesis plays the role of the defendant, who is presumed innocent until proven guilty. The alternative hypothesis is the charge, asserting that some effect or relationship exists. The data collected in an experiment serve as the evidence presented to the jury. The significance level, typically set at alpha equals 0.05, functions as the standard of proof, akin to beyond a reasonable doubt. A statistically significant result is a conviction, leading to the rejection of the null, while a non-significant result is an acquittal, or a failure to reject the null. Under this framework, a Type I error, or false positive, is a wrongful conviction of an innocent null hypothesis, and the alpha level represents the society's tolerated rate of such injustices. Finally, replication serves as the appeal process, where a second court reviews the evidence to confirm or overturn the original verdict. The frequentist argument relies on this mapping to claim that a 5 percent error rate is a feature, not a bug, just as the legal system accepts that some innocent people will be convicted to ensure that guilty people do not go free. They argue that when replications fail, it is akin to discovering a wrongful conviction, which should lead to sanctioning the specific prosecutor for misconduct rather than abolishing the court system itself.

  The Bayesian statistician you interviewed, however, hijacks this same mapping to argue the opposite. She points out that in a real trial, the jury is not asked to consider the long-run error rate of the judicial system across all possible trials. Instead, they are asked to assess the probability that this specific defendant committed this specific crime given the evidence at hand. This is a question of posterior probability, not long-run frequency. In her view, the courtroom is inherently Bayesian because it deals with updating belief about a singular event based on priors and evidence. When frequentists defend p-values by citing long-run error rates, they are answering a question the jury never asked. They are saying that the procedure is reliable over infinite trials, while the scientist, like the juror, wants to know if the current hypothesis is true. This reversal suggests that the trial analogy actually demonstrates why significance testing is ill-suited for scientific inference, because science, like law, is concerned with the truth of the specific case, not the properties of the procedure used to judge it.

  The analogy begins to fracture critically when we examine the nature of the defendant. In a criminal trial, the presumption of innocence is often a plausible state of affairs. A random person selected from the population is likely innocent of any specific crime charged. In psychology and many social sciences, however, the null hypothesis usually stipulates that an effect is exactly zero. Many methodologists argue that in the natural world, nothing is ever exactly zero. Everything is correlated with something else to some minute degree if the sample size is large enough. This means the defendant is almost always guilty from the start. If the null hypothesis is false by definition, then rejecting it is not a triumph of evidence over innocence, but merely a matter of gathering enough witnesses to detect a trivial effect. In the trial analogy, this is equivalent to prosecuting a defendant who is technically guilty of some infraction, but not the meaningful crime charged. When sample sizes are large enough, significance tests will inevitably convict the null hypothesis even if the effect is too small to matter. This disanalogy undermines the frequentist defense because it suggests that the 5 percent error rate is not measuring wrongful convictions of the innocent, but rather convictions of the technically guilty who are practically innocent. The system is not tolerating error; it is guaranteeing convictions regardless of truth, provided the lab has enough resources to increase sample size or tweak measures.

  A second and perhaps more damaging break in the analogy concerns the visibility of verdicts. In a legal system, acquittals are recorded alongside convictions. We know how many people were tried and how many were found not guilty. This transparency allows us to estimate the base rate of guilt and the actual error rate of the system. In science, particularly under the current publication regime, journals predominantly publish convictions. Non-significant results, the acquittals, are filed away in desk drawers. This creates a scenario where the public only sees the guilty verdicts. If a court only published convictions and hid all acquittals, the claimed 5 percent wrongful conviction rate would be impossible to verify and likely vastly underestimated. You would see a stream of convictions and assume the defendants were guilty, unaware that for every conviction there were ten hidden acquittals or that the prosecutors only brought cases they knew they could win. This publication bias means the scientific literature does not represent a random sample of trials conducted, but a filtered sample of successful convictions. Consequently, the frequentist claim that we accept a 5 percent error rate is hollow because the denominator required to calculate that rate is missing. The replication crisis is not just about individual misconduct; it is about a system that hides the acquittals necessary to make the error rate meaningful. This strongly suggests the crisis is a design flaw rather than merely prosecutorial misconduct, because the design incentivizes hiding the very data needed to validate the procedure.

  The third major disanalogy lies in the distinction between the specific case and the long-run procedure. The frequentist defense rests entirely on the logic of long-run behavior. They argue that if we use this method over thousands of studies, only 5 percent of true nulls will be rejected. But scientists do not conduct thousands of studies on the same hypothesis to average out the error. They conduct one study and want to know if that specific finding is true. This returns us to the Bayesian critique. A defendant in a trial does not care about the long-run error rate of the court; they care about their own liberty. Similarly, a reader of a scientific paper cares about whether the specific finding is real, not whether the method is reliable in the abstract. When the frequentist says the system is sound because the error rate is controlled over the long run, they are changing the subject from the truth of the finding to the reliability of the tool. In the context of the replication crisis, where the goal is to determine which published findings are true, the long-run guarantee offers little comfort if the specific finding in front of you is likely false due to low prior probability. The trial analogy exposes this gap because our intuition about trials is Bayesian, even if the statistical test being defended is frequentist. We intuitively feel that a conviction should mean the defendant is probably guilty, but the p-value does not tell us that. It tells us that the evidence is unlikely under innocence, which is not the same thing.

  When we weigh these disanalogies against the conclusions drawn by your two camps, the frequentist defense struggles to survive. Their claim that the crisis is primarily about misconduct relies on the assumption that the trial system is functioning as designed, with honest reporting and plausible null hypotheses. But if the null hypotheses are almost always false to begin with, and if the acquittals are hidden from the record, the system is not functioning as designed. It is functioning as a conviction machine. In such a system, treating a failed replication as mere grounds for scrutinizing the lab ignores the possibility that the lab followed the rules perfectly and still produced a false positive because the rules themselves do not account for the base rate of true effects. The analogy, properly understood, suggests that a wrongful conviction in a system with hidden acquittals and implausible innocence is a sign of systemic failure, not just individual bad actors. Therefore, the analogy does not support the claim that the crisis is misconduct rather than bad design. It suggests the design facilitates the misconduct by making convictions easy and acquittals invisible.

  The Bayesian's reversal holds up better under scrutiny, though it too requires nuance. Her argument that the trial is about updating belief in a specific case aligns with what scientists actually want from their data. However, even she must acknowledge that real courts do not explicitly calculate posterior probabilities. They rely on heuristics and standards of proof that are somewhat frequentist in spirit. Yet, the core of her point remains valid: the mismatch between what the test provides (long-run error rates) and what the user wants (probability of truth) is a fundamental source of confusion and error. The trial analogy supports her view because it highlights that we treat scientific findings as truths about the world, similar to verdicts about guilt, rather than as outputs of a filtering procedure. If we treated them as the latter, we would be less surprised by failures to replicate. But because we treat them as verdicts, we are shocked when the defendant turns out to be innocent upon appeal. The analogy thus supports the Bayesian conclusion that we need methods that address the probability of the hypothesis given the data, rather than the probability of the data given the hypothesis.

  If the criminal trial is the wrong picture, and I believe it is for the purposes of explaining the replication crisis to a general audience, a better analogy would be a medical screening test for a rare disease. In this scenario, the null hypothesis is that the patient is healthy. A significant result is a positive test result. The alpha level is the false positive rate of the test. The crucial element here is the base rate, or the prior probability. If a disease is extremely rare, say one in ten thousand people have it, and you screen a hundred thousand people with a test that has a 5 percent false positive rate, you will find five thousand false positives and only ten true positives. Even with a highly accurate test, the vast majority of positive results will be false alarms. This maps perfectly onto the replication crisis in fields where true effects are rare. Researchers are running screening tests on thousands of potential relationships, most of which are null. When they publish the positives, they are publishing mostly false alarms, not because they are malicious prosecutors, but because they are ignoring the base rate. This analogy captures the structural nature of the problem better than the trial. It shows that even honest, well-meaning screeners will produce a literature full of false positives if the condition being tested for is rare and the screening tool is not adjusted for that rarity. It also explains why replication fails: when you re-test the positive cases, you are often re-testing the false alarms.

  Furthermore, the screening analogy accommodates the issue of publication bias naturally. Imagine if hospitals only published the names of patients who tested positive, while hiding all the negative results. The public would believe the disease was an epidemic, when in reality it was a statistical artifact of the screening process. This mirrors the file drawer problem in science. It shifts the blame from the individual doctor to the protocol of reporting. It also clarifies the role of sample size. In screening, testing more people doesn't change the false positive rate of the test itself, but in science, larger samples can detect trivial effects, akin to a test so sensitive it detects harmless biological markers and flags them as disease. This helps explain why large studies often find significant but meaningless effects. The screening analogy avoids the moral weight of the criminal trial, which implies guilt and innocence, and replaces it with health and error, which feels more appropriate for empirical measurement. It allows you to explain that the replication crisis is not necessarily a scandal of fraud, but a predictable outcome of screening for rare truths with imperfect tools and biased reporting.

  In sum, while the criminal trial analogy is seductive because it imbues statistics with moral drama, it ultimately obscures the mathematical realities driving the replication crisis. It encourages the frequentist defense to hide behind the concept of acceptable error rates while ignoring the hidden acquittals and implausible nulls that make those rates meaningless in practice. It supports the Bayesian critique only insofar as it highlights the mismatch between procedural reliability and specific truth, but even then, it relies on an idealized version of legal reasoning. For your feature, I would suggest using the trial analogy only to introduce the concepts, and then explicitly dismantling it to reveal the screening test analogy underneath. This allows you to acknowledge the sources you interviewed while guiding the reader to a more accurate understanding of why findings fail to replicate. It moves the narrative from a story about bad apples in the courtroom to a story about a flawed diagnostic protocol in a hospital, which is both more precise and more conducive to the structural reforms that many methodologists are now advocating. You can tell your readers that we have been treating our science like a series of trials when we should have been treating it like a series of screenings, and that understanding the difference is the key to fixing the literature.
