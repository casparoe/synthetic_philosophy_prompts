answer: |-
  Your hypothesis is substantially correct, but it requires a sharper anatomical dissection to explain *why* the debate is structurally immune to resolution via technology or empirical observation. The persistence of the debate is not merely a failure of communication; it is a collision between two distinct ontologies of what an economy *is*.

  Here is a diagnosis of the structure of the disagreement, an evaluation of the "firm-scale" objection, and an assessment of what could constitute progress.

  ### 1. Diagnosis: Optimization vs. Generation

  Your distinction between the **static allocation question** and the **dynamic discovery question** is the correct axis of analysis. However, the deeper divergence is about the **origin of the data**.

  *   **The Lange/Tech Position (The Engineer's View):** The economy is a system of equations where the variables (preferences, resource constraints, technological coefficients) exist independently of the mechanism used to solve them. The problem is *computational complexity*. If you can build a machine fast enough to process the existing data, you can find the equilibrium. Rationality is defined as **consistency** (maximizing a given function subject to constraints).
  *   **The Mises/Hayek Position (The Ecologist's View):** The variables do not exist prior to the process. Prices are not merely data points to be fed into a calculator; they are **generated** by the act of exchange under private property. Without the risk of loss and the hope of gain (institutional features), the data (prices) reflecting subjective valuation and opportunity cost never come into existence. Rationality is defined as **adaptation** (discovering new ends and means in a state of ignorance).

  **The Category Error:**
  The technological reopenings (cybernetics, big data, AI) commit a category error by assuming the Hayekian knowledge problem is a **latency** problem (we don't have the data fast enough) rather than an **existence** problem (the data is not there to be had).

  Hayek's argument is not that the central board is too slow; it is that the relevant knowledge is *inarticulate*. It exists only in the specific actions of agents responding to local incentives. A machine learning model requires a training set. In a market, the training set is generated by profit and loss. In a planned economy, there is no profit and loss, therefore there is no training set. You cannot train a model on data that is only created by the process you are trying to replace.

  **Verdict on your hypothesis:** You are right. The debate recurs because the "Pro-Planning" side keeps upgrading the *calculator*, while the "Anti-Planning" side keeps pointing out that there are no *numbers* to calculate.

  ### 2. The Firm-Scale Point: Decisive or Confound?

  The argument that large firms (Amazon, Walmart) are "planned economies" that function efficiently is the most common modern rebuttal to Mises. Is it decisive?

  **Theoretical Status: A Confound.**
  The firm-scale argument relies on a false equivalence between **internal coordination** and **systemic valuation**.
  *   **Shadow Pricing:** Firms do use internal transfer prices, but these are ultimately anchored by external market prices. If Amazon plans its logistics, it compares the cost of a truck against the market price of fuel, labor, and vehicles. If the entire economy were Amazon, there would be no market price for trucks, only administrative allocation.
  *   **The Boundary of the Firm:** Ronald Coase asked why firms exist if markets are efficient. His answer: transaction costs. But he also implied firms have limits. As a firm grows, internal bureaucratic costs rise. The fact that firms *stop* growing at a certain point (they don't merge into one global firm) suggests there is a diseconomy of scale in planning.
  *   **Discipline:** Internal planning within a firm is disciplined by the *external* market. If Walmart plans poorly, it loses stock value or goes bankrupt. A state planning board faces no equivalent residual claimancy.

  **Empirical Status: Unsettled in Principle, Settled in Practice.**
  In principle, we cannot run a controlled experiment of a closed global planned economy. In practice, every attempt to scale planning beyond the firm level (USSR, Maoist China) has collapsed into shortages or reverted to black markets. Proponents argue these were political failures, not calculation failures. Opponents argue the political failures were *caused* by the calculation impossibility (you cannot run a modern economy on command, so you must resort to coercion).

  **Diagnosis:** The firm-scale point is not a decisive empirical refutation of the SCD because it ignores the **transitivity of prices**. It shows planning works *parasitically* on a market background. It is evidentially valuable only to show that planning is possible *at margins*, not that it can replace the margin itself.

  ### 3. What Would Count as Progress?

  Given that the debate is ontological (what is a price?) rather than merely technical, standard empirical tests fail. Progress requires shifting the terrain from "Can we compute it?" to "Can we incentivize it?"

  **A. Formal Result: Mechanism Design Theory**
  Progress has actually already occurred, but it is ignored in the popular reboot cycle. **Mechanism Design** (Hurwicz, Maskin, Myerson) formalized the SCD. It asks: *Can we design a system where agents truthfully reveal their private information?*
  *   **The Result:** Under certain conditions, no mechanism can simultaneously satisfy efficiency, incentive compatibility, and individual rationality without something resembling property rights and market exchange.
  *   **Progress:** Acknowledging that the SCD was resolved mathematically in the late 20th century under the banner of **Incentive Compatibility**. The "calculation" problem is actually an **incentive** problem. A computer can solve the equations if it has the data; the problem is getting agents to provide true data without ownership stakes.

  **B. Conceptual Decomposition: Parametric vs. Constitutive**
  Progress requires a sharper decomposition of the function of price:
  1.  **Parametric:** Prices as parameters for decision-making (Lange's view).
  2.  **Constitutive:** Prices as the *outcome* of property rights negotiation (Mises' view).
  If the debate participants cannot agree on whether prices are inputs or outputs, no technical argument will land. Progress looks like forcing the "Tech" side to explain the **generation mechanism** of their training data, not just the processing power.

  **C. The "Endogenous Ends" Test**
  You mentioned ends are endogenous. A specific test for this would be **innovation rates under different information regimes**.
  *   If the Lange model is sufficient, a closed system with high compute should be able to optimize *technological discovery* as well as allocation.
  *   If the Hayek model is correct, innovation requires the disequilibrium profits that only a market can signal.
  *   **Progress:** Comparative studies of R&D efficiency in state-directed sectors (defense, space) vs. market-directed sectors (consumer tech, pharma). The persistent need for "spin-offs" from state research to find commercial viability supports the Hayekian view that the *valuation* of the technology is the hard part, not the engineering.

  ### 4. Assessment of the Periodic Reopenings

  Are the reopenings a sign of life or a symptom of ill-posedness?

  **They are a symptom of ill-posedness, driven by "Solutionism."**
  The debate reopens every time the **cost of computation** drops by an order of magnitude.
  *   1970s: Mainframes $\rightarrow$ "We can solve the input-output tables."
  *   1990s: PCs $\rightarrow$ "We can run the Lange iterations."
  *   2020s: AI/LLMs $\rightarrow$ "We can predict demand."

  Each time, the Anti-Planning side replies: "You are solving the wrong equation."
  The reopening persists because the **Pro-Planning** narrative is politically and aesthetically appealing (order, rationality, control), while the **Anti-Planning** narrative is epistemically humble (chaos, discovery, limits).

  The question is ill-posed because it frames a **political-economic institutional problem** as a **technical engineering problem**. As long as the debate is framed as "Can a computer plan the economy?" rather than "Can a computer replicate the incentive structures of private property?", it will never settle.

  ### Conclusion

  Your diagnosis is correct: the two sides are answering different questions.
  *   **Side A:** Can we optimize a known function? (Yes, with enough compute).
  *   **Side B:** Can we define the function without property rights? (No, because the variables don't exist).

  **Progress** will not come from a bigger computer or a new empirical study of the USSR. It will come from recognizing that **Mechanism Design** has subsumed the Socialist Calculation Debate. The question is no longer "Can we calculate?" but "Is the mechanism incentive-compatible?"

  The periodic reopenings are not signs of theoretical life; they are signs of **technological distraction**. They treat the economy as a puzzle to be solved rather than a process to be inhabited. Until the "Tech" proponents can explain how their system generates *counterfactual* opportunity costs without private ownership of capital, they are merely describing a more efficient way to allocate resources that do not exist. The debate is settled in theory (by Mechanism Design and Information Economics) but remains open in politics because the theoretical settlement denies the feasibility of a desired political outcome.
