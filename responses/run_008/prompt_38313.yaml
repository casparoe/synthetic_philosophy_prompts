answer: |-
  **Essay Question**

  "It is often argued that nuclear deterrence is rational *ex ante* but irrational *ex post*." Critically assess whether this paradox can be resolved by surrendering control (through delegation or automation), or whether such mechanisms merely displace the irrationality. In your answer, address the evidential difficulty of evaluating a policy whose success consists entirely in non-events.

  ***

  **Model Answer**

  The central paradox of nuclear deterrence lies in the temporal split between the formation of a policy and its potential execution. *Ex ante*, prior to any attack, maintaining a posture of assured retaliation is rational: it preserves sovereignty and prevents war. However, *ex post*, following a devastating first strike, retaliation is arguably irrational. It cannot undo the damage, it invites further destruction, and it serves no defensive purpose. The deterrent threat, therefore, relies on a conditional intention to perform an act that, should the condition obtain, would be pointless.

  This creates a crisis of intentionality. As Gregory Kavka illustrated with his Toxin Puzzle, an agent cannot genuinely intend to perform an action they know they will have no reason to perform when the time comes. If a state leader knows retaliation is irrational *ex post*, they cannot credibly intend it *ex ante*. A bluff is unstable; if an adversary detects the bluff, deterrence fails. To make the threat credible, the leader must convince the adversary that retaliation might occur even if it is irrational.

  This is where the surrender of control becomes theoretically vital. Thomas Schelling proposed the "threat that leaves something to chance," suggesting that leaders can enhance credibility by relinquishing perfect command. By delegating launch authority to subordinates, automating responses (e.g., "Dead Hand" systems), or cultivating irrational reputations, the leader makes retaliation less a calculated choice and more a probabilistic risk. This resolves the intention paradox not by making retaliation rational, but by making it independent of rational calculation at the moment of crisis. The rationality shifts from the *act* of retaliation to the *structure* of the system. The leader intends to build a machine that might kill everyone, which is rational *ex ante*, even if the machine's specific action is not.

  However, this does not fully resolve the ethical or logical tension; it displaces it. Surrendering control introduces the risk of accidental war, meaning the policy is rational only if the risk of accident remains lower than the risk of attack. Furthermore, it morally divorces the decision-maker from the consequence, potentially lowering the threshold for catastrophe.

  Finally, any assessment of deterrence's rationality faces a profound evidential puzzle. Deterrence succeeds when nothing happens. Because the counterfactual (what would have happened without the arsenal) is unknowable, we cannot empirically verify efficacy. We cannot distinguish between successful deterrence and an adversary who never intended to attack. This creates a feedback loop where failure is catastrophic but success is invisible. Policymakers may over-invest in deterrent capabilities based on the unproven assumption that they are working, or they may misread an adversary's restraint as weakness.

  In conclusion, surrendering control can logically bridge the gap between *ex ante* and *ex post* rationality by making retaliation a mechanical probability rather than a deliberate choice. However, this comes at the cost of introducing accidental risk and obscuring the policy's actual effectiveness. The paradox is not solved, but managed through the deliberate courting of disaster.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Distinction between *Ex Ante* and *Ex Post* Rationality (4 marks)**
  *   **Requirement:** Clearly articulate that setting up the deterrent is beneficial (preventive), while executing it after a strike is useless (retaliatory).
  *   **Common Mistake:** Treating deterrence as a single static state without analyzing the temporal shift in incentives.

  **2. The Problem of Conditional Intention (4 marks)**
  *   **Requirement:** Explain why a rational actor cannot genuinely intend to do something they know will be irrational at the time of action (the credibility gap).
  *   **Common Mistake:** Asserting that leaders can simply "choose" to retaliate without addressing the logical impossibility of the intention.

  **3. Mechanisms of Surrendered Control (4 marks)**
  *   **Requirement:** Analyze delegation, automation, or "chance" as tools to bypass the *ex post* choice, noting that they make the threat credible by removing human hesitation.
  *   **Common Mistake:** Describing these mechanisms technically without explaining *how* they solve the intentionality problem.

  **4. The Evidential Puzzle (4 marks)**
  *   **Requirement:** Address the epistemic problem that success is a non-event, making it impossible to verify if the policy works or if the adversary was never hostile.
  *   **Common Mistake:** Ignoring the counterfactual problem and assuming non-attack proves deterrent efficacy.

  **5. Critical Judgment on Resolution (4 marks)**
  *   **Requirement:** Conclude whether the paradox is truly resolved or merely displaced (e.g., swapping irrational retaliation for accidental risk).
  *   **Common Mistake:** Offering a definitive "yes/no" without acknowledging the trade-off between credibility and safety.

  ***

  **Examiner's Note**

  A first-class answer does not merely cite Schelling or Kavka but demonstrates *why* their concepts are necessary to bridge the logical gap between forming an intention and executing it; it treats the evidential puzzle not as an afterthought, but as a fundamental barrier to claiming the policy is rational at all.
