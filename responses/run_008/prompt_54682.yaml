  *   **Case 6 (Concealment/Illegality):** Secretly breaking the law for votes is corrupt.
  *   **Case 1 (Formal Breach):** Procurement rules forbid conflicts of interest, regardless of bid price. Trust in the process matters more than the outcome.

  This exempts:
  *   **Cases 2 & 4 (Social Ritual):** Declared gifts or symbols are tolerated social lubricants.
  *   **Case 5 (Public Mandate):** Open policy promises are democracy, not bribery.
  *   **Case 7 (Informal Norm):** Queue-jumping for kin is a private favour within a low-stakes informal system.

