      *   *Refining the (2) vs (5) point:* This is the crux. Standard Moral Expected Utility (MEU) *assumes* intertheoretic comparability. If the user denies that, they need a different decision rule (e.g., Stochastic Dominance, or "My Favorite Theory"). I need to point out that (2) and (5) are mathematically incompatible as stated.
