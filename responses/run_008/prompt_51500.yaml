          *   *Severity:* **Very High.** This is a direct mathematical contradiction. You can't do (2) without rejecting the strong version of (5).
          *   *Resolution:* Must weaken (5) to "practically difficult" or adopt a different decision rule (like stochastic dominance) that doesn't require cardinal comparability.

