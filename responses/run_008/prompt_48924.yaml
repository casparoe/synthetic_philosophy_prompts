answer: |-
  You have independently rediscovered one of the most famous and frustrating problems in the history of artificial intelligence and philosophy of mind. The robot thought experiment you half-remember is indeed real, and the structural impossibility you encountered with your cat-sitting list is the exact same logical hole.

  Here is the carving of the territory you asked for, separating the established terms, your specific intuition, and where the everyday human version fits.

  ### 1. The Robot Thought Experiment
  The story you are recalling is from Daniel Dennett's 1984 essay *"Cognitive Wheels: The Frame Problem of AI."*

  In the parable, a robot (R1) is tasked with retrieving a battery from a wagon. It succeeds, but the battery was sitting on a bomb, which also gets pulled out and explodes. The designers build R1D1, a robot designed to consider side effects. R1D1 sits there computing forever, checking every possible implication of its action (e.g., "if I pull the wagon, the wall color won't change," "the number of wheels won't change"), and the bomb explodes before it finishes.

  This is the canonical illustration of **The Frame Problem**.

  ### 2. Validating Your Carving (The Two Sub-Problems)
  You asked if your split between "(1) when to stop checking" and "(2) what's still true" is a real joint in the literature. **It is.** However, the terminology is notoriously messy because researchers often use "The Frame Problem" to refer to both, either, or the combination.

  Here is how the literature actually separates them:

  *   **Your Problem (2): "What's still true afterwards"**
      *   **Technical Name:** The **Logical Frame Problem** (or the Persistence Problem).
      *   **Definition:** In formal logic, if you state that an action changes *X*, you must explicitly state that it does *not* change *Y, Z, A, B...* The problem is how to represent that most things *don't* change without writing infinite axioms.
      *   **Fit:** This matches your smart plug automation. You want the kettle to turn on, but you don't want to write rules specifying that the lights stay off, the Wi-Fi stays on, the cat stays alive, etc.
      *   **Status:** Largely "solved" in technical AI via specific logical formalisms (like situation calculus), but only in closed, simplified worlds.

  *   **Your Problem (1): "When is it safe to stop checking"**
      *   **Technical Name:** The **Relevance Problem** (often called the **Philosophical Frame Problem**).
      *   **Definition:** Even if you can logically represent what stays the same, how does the system know which of the billions of potential facts are *relevant* to the current goal?
      *   **Fit:** This matches your cat-sitting list. The blinking light is irrelevant *unless* there is smoke. Determining that relevance requires knowing the context (battery age, history of false alarms), which cannot be fully encoded in the rule itself.
      *   **Status:** Unsolved. This is considered a core problem of "common sense."

  *   **A Third Sibling: The Qualification Problem**
      *   There is a third term you should know: **The Qualification Problem** (named by John McCarthy).
      *   **Definition:** It is impossible to list all the preconditions (qualifications) required for an action to succeed or a rule to apply.
      *   **Fit:** This is the most precise fit for your "Rule 14" issue. "Ignore the blinking light" requires the qualification "unless it's blinking at 5Hz," "unless there's a smell of burning," etc. Every exception invites a meta-exception.
      *   **Relationship:** Many philosophers treat the Qualification Problem as a subset or close cousin of the Frame Problem.

  ### 3. The Everyday Human Version
  You noted that humans "walk out the door without checking." You are asking if the human experience of this problem has a distinct name from the AI version.

  The *problem* is the same (The Frame/Qualification Problem), but the *human capacity to bypass it* has its own established treatment.

  *   **Tacit Knowledge (Michael Polanyi):** Polanyi's famous maxim is **"We know more than we can tell."** This describes exactly your inability to write down the ignoring rules. You possess knowledge (the light is safe) that you cannot fully articulate because it relies on a web of context you aren't consciously accessing.
  *   **Background Coping (Hubert Dreyfus):** Drawing on Heidegger, Dreyfus argued that the Frame Problem proves AI cannot work via symbolic rules. Instead, humans operate via "background coping"—a non-representational, embodied familiarity with the world. We don't "ignore" the wall color because we never considered it in the first place; it wasn't salient.
  *   **The Clapham Omnibus (Legal Theory):** In law, this is the "reasonable person" standard. You cannot write a contract that covers every eventuality, so you rely on the implicit standard of what a "reasonable person" would ignore or notice. Your cat-sitter list fails because it tries to replace the "reasonable person" standard with explicit rules.

  ### 4. Do You Need to Coin a Name?
  You do not need to coin a name for the *problem*, because **The Frame Problem** (specifically the **Qualification** and **Relevance** aspects) is the established term for the structural impossibility you found. If you search for these terms, you will find the exact literature you are intuiting.

  However, if you want to label the *specific everyday phenomenon* of "trying to write instructions on what to ignore and failing," there isn't a single catchy noun phrase other than **"The Explicitation Trap"** (which is descriptive but not a formal term).

  **Why "The Frame Problem" is still the best label:**
  Even though it sounds technical, it is the only term that captures the *infinite regress* of exceptions. "Tacit Knowledge" describes the *solution* (your brain), but "The Frame Problem" describes the *failure* (your list). Since you are asking about the pattern of the list failing, "The Frame Problem" is the accurate diagnostic.

  **Where the edge cases sit:**
  *   If you are discussing the *logic* of the exceptions: Use **The Qualification Problem**.
  *   If you are discussing the *relevance* of the exceptions: Use **The Relevance Problem**.
  *   If you are discussing the *human inability to write them down*: Use **Polanyi's Paradox**.
  *   If you want the *umbrella term* that covers the robot story, the AI logic, and your cat-sitter list: Use **The Frame Problem**.

  ### Conclusion
  You have carved a real joint. The literature distinguishes between the persistence of truth (Logical Frame) and the relevance of information (Philosophical Frame/Relevance), though both often fall under the "Frame Problem" banner. Your everyday example is the human-scale manifestation of the **Qualification Problem** (a subset of the Frame Problem), resolved in humans by **Tacit Knowledge**.

  You do not need to coin a new term, but you should be aware that "The Frame Problem" is often used loosely. To be precise in your notes, you are dealing with the **Qualification Problem** experienced through the lens of **Polanyi's Paradox**.

  Verdict: The Frame Problem
