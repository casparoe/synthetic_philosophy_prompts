answer: |-
  Dear Colleague,

  It is a pleasure to correspond with you regarding the design of this diagnostic instrument. Your observation that early-career researchers often invoke the importance–tractability–neglectedness framework as a shibboleth while relying on heuristic shortcuts in practice is one I have shared for some time. The goal of this quiz is not to test their knowledge of the framework but to reveal the implicit decision rules they actually apply when the abstract labels are stripped away. In designing the following instrument, I began by brainstorming several candidate questions that I ultimately discarded to ensure discriminative validity. For instance, I initially considered asking respondents to choose between global poverty and animal welfare, but I rejected this because both causes are sufficiently established within your readership that social desirability bias would likely compress the variance, leaving us unable to distinguish between a scale-first thinker and a multiplicative thinker. I also discarded a question about existential risk versus global health because the stakes are so asymmetrical that nearly all reasonable agents would choose the existential risk mitigation, failing to separate those who treat scale as lexically prior from those who simply apply a high discount rate to future populations. Instead, I have constructed scenarios where the trade-offs are uncomfortable and the arithmetic is ambiguous, forcing the respondent to reveal their underlying priority function.

  The quiz consists of ten concrete scenarios woven into the narrative below. To administer this, you should present these scenarios to the reader and ask them to record which option they would choose in each case. In the first scenario, imagine a disease that kills one million people annually but is fully funded by national governments such that your marginal contribution would achieve nothing, contrasted with a disease that kills one hundred thousand people annually but has zero existing funding. The first option is to prioritize the one-million-death disease because the sheer scale of suffering is paramount, while the second option is to prioritize the one-hundred-thousand-death disease because the counterfactual impact of your contribution is higher. This case is designed to separate those who treat importance as absolute scale from those who treat it as scale discounted for what others would do anyway. In the second scenario, consider Cause Alpha, which affects ten million people, has low tractability, and is highly crowded, versus Cause Beta, which affects one million people, has high tractability, and is highly neglected. Mathematical multiplication of the three factors suggests Cause Beta is superior, yet Cause Alpha is an order of magnitude larger in absolute terms. The first option is to choose Cause Alpha because the scale dominates the other factors, and the second option is to choose Cause Beta because the product of the three factors is higher. This exposes whether the respondent combines factors multiplicatively or lets the largest number dominate lexicographically.

  In the third scenario, you are evaluating a field crowded with large institutional donors where additional funding yields diminishing marginal returns, versus a field crowded with individual activists and voices where funding is scarce but coordination is difficult. The first option is to avoid the field crowded with activists because having one voice among many feels pointless, and the second option is to avoid the field crowded with donors because the next dollar buys less there. This distinction isolates whether neglectedness matters to the respondent through marginal returns or through the value of advocacy and coordination. The fourth scenario involves biological aging, a problem of vast scale that remains stubbornly unsolved despite significant attention. The first option is to rule it out entirely because the tractability is too low to justify investment, and the second option is to keep it in contention because the scale is so large it overrides tractability concerns. This tests whether tractability can ever be low enough to knock an enormous cause out of the top rank entirely. In the fifth scenario, consider a risk that threatens ten billion future lives who do not yet exist versus a certainty that harms one million existing people. The first option is to prioritize the future lives due to the sheer scale of the population at stake, and the second option is to prioritize the existing people because the moral weight of non-existent beings is uncertain or discounted. This addresses whether the sheer scale of risks to people who don't yet exist can count toward importance.

  The sixth scenario presents a choice where a direct cost-effectiveness analysis suggests Option A saves more lives per dollar, but an ITN framework scoring suggests Option B is the higher priority cause area. The first option is to fund Option A because what an extra dollar buys is the ultimate metric, and the second option is to fund Option B because the framework identifies it as the strategic priority. This separates those who bypass the three-factor scaffold from those who rely on it. In the seventh scenario, you have enough resources to completely solve one moderate-sized problem or to make a dent in ten large problems. The first option is to solve the one problem completely to remove it from the world, and the second option is to spread the resources to maximize the total sum of good across all ten. This identifies the satisficing stance where the goal is to finish a task rather than optimize comparative arithmetic. The eighth scenario involves a cause where government intervention is likely within five years versus a cause where no such intervention is expected. The first option is to deprioritize the cause with likely government intervention because others will do it anyway, and the second option is to prioritize it because the scale remains high regardless of who solves it. This further probes the counterfactual definition of importance. In the ninth scenario, consider a cause that is scientifically difficult but has clear metrics versus one that is scientifically easy but suffers from severe coordination failures. The first option is to avoid the coordination problem because tractability includes social feasibility, and the second option is to avoid the scientific problem because tractability refers primarily to technical solvability. This refines the definition of tractability. Finally, in the tenth scenario, imagine a cause with moderate scale and high tractability that is already saturated with experts, versus a cause with moderate scale and moderate tractability that has no experts. The first option is to join the saturated field because the path is clear, and the second option is to join the empty field because being a pioneer has intrinsic value. This serves as a final check on the neglectedness-as-advocacy axis.

  To interpret the results, you will need to map the pattern of answers onto the five leaves we discussed. If a respondent consistently chooses the counterfactual options in the first and eighth scenarios, the multiplicative option in the second, the marginal returns option in the third, the tractability-veto option in the fourth, and the direct cost-effectiveness option in the sixth, they align with the strict multiplicative ITN leaf. This profile indicates a reader who genuinely uses the framework as a calculative engine rather than a label. If the respondent chooses the absolute scale options in the first, second, and fifth scenarios, prioritizing the largest numbers regardless of funding or tractability, they map to the scale-first leaf. This reader treats importance as lexically prior to the other factors. If the respondent chooses the direct cost-effectiveness option in the sixth scenario and the marginal returns option in the third, while showing flexibility on the framework in the second scenario, they belong to the marginal cost-effectiveness first leaf. These readers bypass the three-factor scaffold and ask directly what the next dollar or hour buys. If the respondent chooses the advocacy-based neglectedness option in the third scenario and the pioneer option in the tenth, they map to the neglectedness-as-advocacy leaf. For these readers, crowdedness matters through voice and coordination rather than returns. If the respondent chooses the solve-completely option in the seventh scenario, they map to the satisficing leaf, indicating a stance where the real goal is to pick one problem and throw resources at it until it is solved, regardless of comparative arithmetic.

  There are combinations of answers that correspond to no recognized position, and in these cases, you should mark the leaf as unnamed rather than inventing a label. For instance, if a respondent treats importance as absolute scale in the first scenario but applies a tractability veto in the fourth scenario without regard for the scale, their decision rule is internally inconsistent relative to the defined axes. Similarly, if a respondent prioritizes future generations in the fifth scenario but rejects direct cost-effectiveness in the sixth scenario without a clear framework justification, this suggests a confusion of moral intuitions rather than a coherent prioritization strategy. It is crucial to be honest about the limitations of this instrument. Specifically, the quiz cannot reliably separate the strict multiplicative ITN leaf from the marginal cost-effectiveness first leaf when the framework's arithmetic aligns perfectly with direct cost-effectiveness estimates. In cases where the most neglected cause is also the most cost-effective, both decision rules yield the same choice, and the quiz cannot discern the underlying reasoning. To separate these two leaves reliably, an additional case would be needed where the most neglected cause is known to be less cost-effective than a crowded cause due to high overhead or implementation risks, forcing a trade-off between the framework's recommendation and the direct dollar impact. Furthermore, the quiz may struggle to distinguish between the scale-first leaf and the satisficing leaf if the single problem the satisficer chooses happens to be the largest scale problem available. To separate these, you would need a case where the satisficer chooses a smaller problem simply because it is solvable, whereas the scale-first thinker would still choose the larger, unsolvable problem.

  I hope this design serves your blog well. The constraint of continuous prose was challenging but ultimately beneficial, as it forces the reader to engage with the scenarios as a coherent narrative rather than a checklist to be gamified. By embedding the questions in this manner, we reduce the likelihood that readers will recognize the intended mapping and adjust their answers to appear more rational. The resulting data should give you a clearer picture of whether your readership is truly operating within the ITN framework or merely using it as a vocabulary to justify intuitions derived from scale, advocacy, or satisficing heuristics. Please let me know if you require further refinement on the scoring logic or if you wish to expand the limitations section to address specific sub-populations within your readership.

  Sincerely,

  Your Colleague in Decision Theory
