  # METAPHYSICS OF SCIENCE: WHAT ARE LAWS?
  ### A Decision Tree for Midterm Review

  **START:** You agree science finds regularities (e.g., "All electrons repel"). But what *makes* these regularities hold?

  ---

  ### NODE 1: The Twin Universe Test
  **Imagine two possible worlds.** In both worlds, every single particle moves in exactly the same way from the beginning of time to the end. The complete history of events is **identical**.
  *   **Q:** Could the **Laws of Nature** be different in these two worlds? (e.g., In World A the events are law-governed; in World B they are just a cosmic accident?)
      *   **NO (Same History = Same Laws):** Laws depend entirely on the pattern of events. → *Go to Node 2 (The Humean Path)*
      *   **YES (Same History ≠ Same Laws):** Laws are something *over and above* the events. → *Go to Node 3 (The Anti-Humean Path)*

  ---

  ### NODE 2 (Humean Path): The Ideal Librarian Test
  **You believe laws are just the best summary of the events.** But what makes a summary the "Best"?
  *   **Q:** If an ideal reasoner (no cognitive limits, no human biases) analyzed the universe, would they find **one objective "Best System"** of laws?
      *   **YES:** There is a fact of the matter about simplicity and strength, independent of us.
          *   **LEAF: Humean Best-System Analysis (Lewis)**
          *   *Laws are the axioms of the system that best balances simplicity and strength in describing the mosaic of events.*
      *   **NO:** "Best" depends on what counts as simple *for beings like us* (our cognitive interests).
          *   **Q:** Do we keep using the word "Law"?
              *   **Yes:** → *LEAF: Pragmatic Humeanism* (Laws are real but interest-relative).
              *   **No:** → *LEAF: Eliminativism / Skepticism* (There are only patterns; "Law" is a misleading fiction).

  ---

  ### NODE 3 (Anti-Humean Path): The Brute Fact Test
  **You believe laws govern events, not just describe them.** Where does this governing power come from?
  *   **Q:** Are laws **fundamental brute facts** (they just *are*), or do they arise from the **nature of things** (properties/objects)?
      *   **YES (Brute Facts):** Laws are fundamental ingredients of reality, not explained by anything deeper.
          *   **LEAF: Primitivism (Maudlin / Carroll)**
          *   *Laws are irreducible. They tell matter how to behave, but there is no further explanation for why the laws exist.*
      *   **NO (Grounded in Natures):** Laws hold because of what properties/objects *are*. → *Go to Node 4*

  ---

  ### NODE 4 (Grounding Path): The Source of Power Test
  **You believe laws arise from the nature of properties.** Where does the necessity live?
  *   **Q:** Is the necessity **external** (a relation between two separate things) or **internal** (built into the thing itself)?
      *   **EXTERNAL:** Properties (Universals) are distinct, and a Law is a relation linking them (e.g., *N(F, G)*).
          *   **LEAF: Necessitation View (Armstrong / Dretske / Tooley)**
          *   *Laws are relations among Universals. Being F necessitates being G, but F itself doesn't contain the power.*
      *   **INTERNAL:** To have a property *just is* to have a certain power/disposition.
          *   **LEAF: Dispositionalism / Powers View (Bird / Mumford)**
          *   *Laws are metaphysically necessary because an electron's charge *is* a power to repel. It couldn't be otherwise.*

  ---

  ### ANALYSIS & CRITICAL NOTES

  **(A) Indistinguishable Leaves (The "Empirical Equivalence" Problem)**
  *   **Lewisian BSA vs. Pragmatic Humeanism:** It is difficult to distinguish these empirically. If we are not ideal reasoners, we can never know if the "Best System" is objective or just best *for us*. Some argue this makes the Lewisian view unknowable.
  *   **Primitivism vs. Armstrong:** Both posit extra facts beyond the mosaic. In practice, both face the "Inference Problem" (how does a law actually *make* particles behave?). Some critics argue Armstrong's "Necessitation Relation" is just Primitivism in disguise (a "brute necessitator").

  **(B) Empty Logical Space (Unoccupied Combinations)**
  *   **Anti-Humean + Mind-Dependent:** There are almost no defenders of the view that laws are *ontologically extra* (Anti-Humean) but also *dependent on human interests*.
      *   *Why?* If you posit laws as real entities over and above the mosaic, you usually do so to secure objectivity. Making them mind-dependent undermines the motivation for positing them in the first place (you could just be a Pragmatic Humean).
  *   **Humean + Dispositionalism:** This combination is generally considered incoherent.
      *   *Why?* Dispositions/Powers are modal features (they point to what *would* happen). Humeanism denies irreducible modality in the base mosaic. You cannot ground powers in a Humean mosaic without collapsing the powers into mere regularities (which defeats the Dispositionalist view).

