      *   **Goal:** Determine consistency, identify contradictions/tensions, rank them by severity, and suggest the "cheapest" thing to give up.

  2.  **Deconstruct the Tensions:**

      *   **Tension A: Embodiment (1) vs. Abstract Concepts (5).**
          *   (1) says understanding is *rooted* in lived bodily experience.
          *   (5) admits understanding terms like "electron" without direct experience, via words/pictures.
          *   *Conflict:* If (1) is the *ultimate* foundation, how does (5) work? Is it second-hand understanding? Does it count as "real" understanding?
          *   *Severity:* High. This strikes at the definition of understanding itself.

      *   **Tension B: Embodiment (1) vs. Fictional Qualia (3).**
