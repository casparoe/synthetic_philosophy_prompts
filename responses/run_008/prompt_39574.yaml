          *   *Conflict:* If understanding requires bodily grounding, how do they understand the ungrounded? Is it metaphorical mapping? If so, does that undermine the necessity of direct grounding?
          *   *Severity:* Medium-High. It challenges the necessity of direct experience.

      *   **Tension C: Use Theory (2) vs. Embodiment (1).**
          *   (2) says meaning is public use (Wittgenstein). No private fact.
          *   (1) says meaning is rooted in *my* lived bodily experience (phenomenological/private).
          *   *Conflict:* Wittgenstein explicitly argued *against* private ostensive definition. If meaning is public use, my private sensation of "salt" is irrelevant to the meaning of the word "salt," only my correct usage of it matters.
          *   *Severity:* Very High. This is a classic philosophical clash (Phenomenology vs. Logical Behaviorism/Use Theory).

      *   **Tension D: AI Skepticism (4) vs. Abstract Concepts (5) & Fictional Qualia (3).**
          *   (4) says AI doesn't understand because it lacks grounding/experience.
          *   (5) says *I* understand "electron" without grounding/experience (just via words).
