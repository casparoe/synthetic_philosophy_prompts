  3.  **Evaluate Sub-claims (The "Dependencies"):**

      *   *Claim 1: Culture as Causal Variable.* Can ideas drive history, or are they just epiphenomena of material conditions (Marxist view)?
          *   *Assessment:* Modern social science generally accepts bidirectional causality. Culture isn't *just* lagged material conditions.
          *   *Probability:* High.

      *   *Claim 2: Directionality/Confounding.* Is it Protestantism $\to$ Capitalism, or Capitalism $\to$ Protestantism, or Common Cause (e.g., literacy, political fragmentation)?
          *   *Assessment:* This is the biggest battleground. Recent econometric work (e.g., Cantoni, Becker & Woessmann) suggests literacy and human capital are huge mediators. The "common cause" problem is severe.
          *   *Probability:* Moderate/Low (for the *strong* Weberian claim).

      *   *Claim 3: The Mechanism.* Is it specifically *predestination anxiety* leading to *ascetic accumulation*? Or is it literacy, trust networks, or exclusion from guilds/state jobs?
          *   *Assessment:* Historians and sociologists largely reject the specific psychological mechanism. They favor institutional/network explanations (e.g., dissenters couldn't be bureaucrats, so they became merchants).
