      *   *Modern work:* Sascha Becker and Ludger Woessmann used this. They found Protestantism correlated with prosperity, but mediated by literacy.
      *   *Better Experiment:* Look for regions where Protestantism took hold *without* the usual confounders (e.g., not more urban, not more literate initially). Or look at Catholic regions with similar constraints.
      *   *Specific Idea:* The spread of printing presses. Printing $\to$ Literacy $\to$ Protestantism. If we instrument Protestantism with distance to Wittenberg (printing diffusion), does capitalism still follow? (This has been done).
      *   *What would move the needle?* Finding a Protestant enclave that was *anti-literacy* but still capitalist, or a Catholic enclave that was *pro-literacy* but stagnated. Or, finding the "anxiety" variable measured historically (hard).
      *   *Best bet:* Comparative institutional analysis. If we find Protestant regions succeeded *only* when they had inclusive institutions, regardless of ethos, that kills P.

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the engineering mindset. Validate the "correlation $\neq$ causation" instinct.
