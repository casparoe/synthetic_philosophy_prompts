prompt: |-
  i teach a philosophy of science elective and next week we're on ian hacking's looping effects — how a classification for a kind of person changes the people it sorts, whose changed behavior then feeds back into what the category seems to mean, and around it goes. i want to close the session with a villanelle and i think the form is actually doing real work here, so heres what i want:

  the two refrains should be the two halves of the loop. one line about the category remaking the person it names, one line about the person remaking the category. the trick i want exploited: a villanelle's refrains come back verbatim but in a different stanza each time, with different lines around them — so the same line should read differently each time it returns, the way the same diagnosis means something different to a person on their third encounter with it. dont update the wording of the refrains, let the surrounding context do the shifting, thats the whole point.

  please ground it in one concrete case rather than floating in abstraction. multiple personality is hacking's classic but autism might land better with my students — your call, just pick one and commit. no quotation marks around anything hacking actually wrote, i dont want to check attributions, just render the idea.

  and the final tercet, where the two refrains finally sit next to each other for the first time: that should land on something like his worry that these loops never settle into stable natural kinds — the category keeps moving because we keep moving, and sometimes the loop just winds down and the kind more or less evaporates (he thought something like this happened with fugue, the mad travelling thing — gesture at it if you want, dont lean on it). leave it a bit unsettled, since thats honestly where the seminar discussion ended up.

  someone who knows looping effects should nod along at how the form tracks the idea; someone who doesnt should still get a decent poem about being named and changed by the name. and sorry for the long spec — form poems, they invite micro-managing.
