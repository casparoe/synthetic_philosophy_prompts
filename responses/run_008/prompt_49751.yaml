answer: |-
  Your intuition is spot on. Your friend has constructed a "gotcha" argument that sounds clever but relies on a conflation of two distinct philosophical concepts. If you use his argument in class, you risk looking like you don't understand value theory. If you attack his argument correctly, you'll look much sharper.

  Here is the breakdown of where his argument fails, the cost of fixing it, and how you can still get a good grade by finding a *real* objection to the theory.

  ### 1. Which step to attack?
  **Attack Step (3).**

  > *(3) if two things are incommensurable, then no comparison between them holds. it's not that one is bigger, it's that "bigger than" doesn't even apply.*

  This is the fatal flaw. Your friend is conflating **incommensurability** with **incomparability**.

  *   **Commensurability** means there is a common unit of measurement (a "currency") that allows for trade-offs. (e.g., "1 hour of labor = $20").
  *   **Comparability** means you can rank them ordinally. (e.g., "Safety is more important than Cost").

  **Lexical views explicitly deny commensurability but assert comparability.**
  The theory says there is no *exchange rate* (you can't trade 1 billion pinpricks for 1 migraine), but there is still a *ranking* (1 migraine is strictly worse than 1 billion pinpricks).

  **The Analogy:**
  Think of a military hierarchy. A General is lexically superior to a Private.
  *   **Incommensurable:** You cannot trade 1,000 Privates for 1 General. They are not on the same scale of "units of soldier."
  *   **Comparable:** The General still outranks the Private. The command "General > Private" holds true.

  Your friend claims that because you can't trade them (incommensurable), you can't rank them (incomparable). That is false. Lexical priority is precisely the claim that **ranking exists without trading.**

  ### 2. What is the "cost" of attacking Step 3?
  If you argue that Step 3 is false (to save the theory from your friend's contradiction charge), you are committing to the view that **value structures can be hierarchical without being reducible to a single number.**

  *   **The Philosophical Price:** You have to accept that "goodness" isn't just one big bucket of points (like utilitarianism usually thinks). You have to accept that some values "trump" others. This is a standard move in deontology and rights-based theories (e.g., "One person's right to life trumps the convenience of a million people").
  *   **Is it a high price?** No. This is a very mainstream philosophical position. It doesn't make you look radical; it makes you look precise.

  ### 3. How to handle the assignment (Arguing *Against* the Theory)
  Your assignment is to argue *against* Lexical Threshold Negative Utilitarianism (LTNU). Your friend tried to prove it is **logically incoherent** (a contradiction). You now know that's false.

  **Do not use your friend's argument.** If you submit that, a knowledgeable professor will mark it down for confusing incommensurability with incomparability.

  Instead, you should argue that the theory is **logically coherent but normatively implausible.** This is actually a stronger, more sophisticated critique. It shows you understand the theory well enough to see it doesn't contradict itself, but you reject it because of its consequences.

  Here are two real objections you can use for your paper:

  #### A. The "Sorites" or "Cliff" Objection (The Boundary Problem)
  This attacks the definition of the "threshold."
  *   **The Argument:** Pain is a spectrum. Imagine a pain scale from 1 to 10. Let's say the threshold is at 5.0.
  *   **The Problem:** What is the moral difference between a pain at 4.99 and a pain at 5.01? Phenomenologically (in experience), they are almost identical. But morally, LTNU says the 5.01 is *infinitely* worse than the 4.99.
  *   **The Conclusion:** A theory that creates an infinite moral chasm based on a microscopic, arguably arbitrary difference in physical sensation is implausible. It makes morality too sensitive to measurement errors.

  #### B. The "Intuition Pump" Objection (The Cost of Priority)
  This attacks the *implications* of the lexical priority.
  *   **The Argument:** LTNU says preventing one above-threshold pain is more important than *any* amount of pleasure or mild pain prevention.
  *   **The Scenario:** Imagine you can either (A) Prevent one severe migraine for one person, or (B) Ensure 10 billion people live lives of perfect, blissful utopia for 100 years.
  *   **The Implication:** LTNU forces you to choose (A). You must sacrifice the utopia of billions to spare one person a headache.
  *   **The Conclusion:** While avoiding the "billion pinpricks" bullet is good, biting *this* bullet is worse. It implies we should ignore massive amounts of well-being for trivial gains in severe pain avoidance. This violates our considered moral judgments about the greater good.

  ### Summary Strategy for Your Paper
  1.  **Acknowledge the Friend's Point (briefly):** "One might argue that lexical views are self-contradictory because they compare things they claim cannot be traded..."
  2.  **Dismiss it Philosophically:** "...However, this confuses *incommensurability* (no common currency) with *incomparability* (no ranking). Lexical views claim we can rank values without trading them. Therefore, the theory is logically consistent."
  3.  **Pivot to the Real Attack:** "However, being logically consistent does not make it *correct*. The theory fails because..."
  4.  **Deploy Objection A or B:** Use the "Cliff" argument or the "Utopia vs. Migraine" argument.

  **Why this gets you an A:**
  Most students will just repeat the "it's contradictory" line. By showing that the theory *isn't* contradictory but is *still wrong*, you demonstrate a higher level of philosophical understanding. You keep the threshold idea (avoiding the "billion pinpricks" absurdity) but show why the specific *lexical* mechanism breaks down at the edges.
