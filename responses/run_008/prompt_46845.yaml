answer: |-
  You are right to be suspicious. Your verdicts display a classic pattern of motivated reasoning: you apply the outside view to constrain others and the inside view to liberate yourself and your tribe. However, there is a coherent principle that can salvage some of your intuitions while exposing the hypocrisy in others.

  The principle is not about *how much* private information you have, nor simply about whether the reference class is heterogeneous. It is about **Ex-Ante Causal Leverage.**

  **The Principle:** You are justified in overriding a base rate (outside view) only if you can identify a specific, causal factor that (1) is distinct from the factors driving the reference class statistics, (2) is verifiable *before* the outcome is known, and (3) has a known magnitude of effect sufficient to overcome the base rate pressure.

  If your "inside view" relies on narrative coherence, effort, or unique circumstances that cannot be independently measured or linked to a causal mechanism prior to the result, you must default to the outside view.

  ### Testing Your Suspicious Principles

  You proposed two principles you suspected were traps. You were right to doubt them.

  1.  **"Inside view is legitimate when you have genuine private information."**
      *   **Verdict:** **Fail.** As you noted, your friend has private information about his startup (his grit, his code, his customers). If private information alone justified the inside view, you would have to be confident in his success too. Private information is necessary but not sufficient; it must be *causally potent* information, not just *detailed* information.
  2.  **"Inside view is legitimate when the reference class is heterogeneous or gerrymandered."**
      *   **Verdict:** **Fail.** This is the standard defense of the deluded insider. Every failed startup founder believes their market is unique. Heterogeneity is only relevant if the *dimensions of difference* map to the *dimensions of failure*. If startups fail due to cash flow, and you claim your case is unique because of your "culture," the heterogeneity is irrelevant.

  ### Applying Ex-Ante Causal Leverage to Your Verdicts

  Here is where the principle holds your cases together, and where it forces you to concede error.

  **1. The Engineer vs. The Doctor (Principle Holds)**
  *   **Engineer:** He identifies a specific component that is marginal. This is a verifiable, causal lever. The reference class (successful launches) is invalidated because a necessary condition for success is missing in this specific instance. **Inside view wins.**
  *   **Doctor:** Survival statistics in medicine often reflect biological variance that is currently irreducible noise. Unless the doctor can point to a specific biomarker in your case that causally alters the disease progression (ex-ante verifiable), the specifics are indeed noise. **Outside view wins.**
  *   *Why it works:* One deals with deterministic mechanics (engineer), the other with probabilistic biology (doctor).

  **2. The Forecasting Paradox (Principle Holds)**
  *   **Modest vs. Extreme:** You trust the modest forecaster because their edge likely comes from better processing of public information (calibration), which is a stable causal lever. The extreme forecaster often relies on a "special insight" story that is hard to verify ex-ante.
  *   **Life-Changing Forecasts:** The fact that life-changing forecasts came from extreme views is a survivorship bias. For every extreme view that paid off, a thousand failed. You should trust the modest forecaster for *accuracy*, but you might *bet* on the extreme forecaster for *optionality* (low probability, high impact). This isn't an epistemic contradiction; it's a utility distinction.

  **3. The Startup vs. Career Pivot (Principle Forces an Overturn)**
  *   **The Conflict:** You dismiss your friend's detailed plan but endorse your own pivot despite similar base rates.
  *   **The Verdict:** **You must overturn your confidence in your own career pivot.**
  *   **Why:** Unless you possess a verifiable asset (e.g., a signed contract, a proprietary technology, a confirmed network advantage) that *causally* insulates you from the market forces that kill other pivots, you are relying on narrative. "Knowing things about my situation" is usually a euphemism for "I have a story about why I'm different." If your friend's plan is "detailed and coherent," he likely feels the same. To be consistent, you must admit your career pivot is a long shot, or concede that your friend's startup deserves more hope than you grant it.

  **4. Civilizational Doom (Principle Forces an Overturn)**
  *   **The Conflict:** You discount general doom on base rates but exempt your community's scenario.
  *   **The Verdict:** **You must overturn the exemption for your community's scenario.**
  *   **Why:** The claim that "the class of failed doom predictions was assembled by people who never considered the mechanism" is itself an inside-view story. Unless your community can demonstrate a causal mechanism that is *quantitatively* different from past failed predictions (e.g., energy density thresholds that were previously impossible), you are engaging in tribal epistemology. The base rate of "predictions of imminent doom" is the strongest causal lever available here.

  ### Prediction for the New Case

  **The Case:** A small organization decides whether to attempt a project that has failed everywhere it has been tried, but under materially different conditions each time.

  **Application of the Principle:**
  1.  **Check the Reference Class:** The project has failed everywhere. This establishes a strong negative base rate.
  2.  **Check the "Different Conditions":** Are these conditions *causally linked* to the specific failure modes of the past attempts?
      *   *Scenario A:* Past failures were due to lack of funding, regulatory blocks, and supply chain issues. The new organization has unlimited funding, regulatory approval, and owned supply chains.
          *   **Prediction:** **Inside View Wins.** The causal levers of failure have been removed. The reference class is no longer exchangeable.
      *   *Scenario B:* Past failures were due to fundamental physics or human behavior (e.g., user adoption of a confusing interface). The new organization claims "conditions are different" because they have a better team or a new marketing strategy.
          *   **Prediction:** **Outside View Wins.** The "different conditions" are not causally sufficient to overcome the structural failure mode. The organization is likely rationalizing.

  **Final Forecast:** In the absence of specific evidence mapping the "different conditions" to the *root causes* of past failures, you must assume the conditions are superficially different but causally identical. **Bet on failure.** The burden of proof is on the organization to demonstrate causal leverage, not on you to prove exchangeability.

  ### Summary

  Your gut is trying to tell you that **specificity beats statistics**, but only when that specificity is **structural, not narrative**.

  *   **Structural Specificity:** "This bolt is weak." (Engineer) -> Trust Inside View.
  *   **Narrative Specificity:** "We work harder." (Startup Friend) -> Trust Outside View.
  *   **Structural Specificity:** "We have a signed contract." (Your Career) -> Trust Inside View.
  *   **Narrative Specificity:** "I know my situation." (Your Career) -> Trust Outside View.

  You are currently granting yourself "Structural" status for things that are likely "Narrative." To be epistemically honest, apply the same skepticism to your career and your community's doom scenarios that you apply to your friend's startup. If you can't point to the lever, trust the base rate.
