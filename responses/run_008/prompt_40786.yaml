  So there's this guy Dave on the payments team who I eat lunch with a few times a week, and he has WILDLY strong opinions about trolley-problem style hypotheticals, which we argue about constantly. I've been keeping mental notes on his verdicts, and I finally have a new one I want to spring on him, but I want to go in knowing roughly what he'll say and, honestly, whether he's even tracking consistently. Here's his track record on the classics: diverting a runaway trolley away from five people onto a side track with one person on it — fine, flip the switch. Pushing a big guy off a footbridge to stop the trolley and save five — not fine, he got genuinely mad I even asked. A surgeon cutting up one healthy patient for organs to save five — obviously not. A doctor turning off a ventilator at the dying patient's own request — fine; the same doctor giving a lethal injection at the same patient's request — not fine. Letting a kid drown in a shallow pond because helping would ruin your shoes — you're a monster; not donating $50 to save a faraway kid — eh, that's fine, nobody's a monster for that. And one work-flavored one we did last month: an on-call engineer who can flip a config flag to stop a runaway process from wiping five customers' data, at the cost of one customer's data getting wiped instead — Dave said flip it, definately.

  The new case I want to hit him with: a saboteur deliberately sends the trolley toward five people, then goes and stands on a side track, gloating about it. You can divert the trolley, and there are two side tracks — one where the saboteur is standing, one where a complete innocent is standing. Assume diverting to either track only takes the person on that track, the trolley stops harmlessly either way, one person dies either way, and the five are saved either way. So which track does Dave pick — the saboteur, the innocent, does he not care, or does he refuse both diversions and take his hands off the wheel?

  Act like a professional ethicist and think it through properly, maybe brainstorm the candidate rules first. Which rules actually fit his whole track record? I suspect the organ-harvesting verdict and the ventilator verdict pull in different directions, so it's probably not one clean rule. Then tell me what each surviving rule predicts about the saboteur track specifically, give me your best guess at what he'll say with your reasoning, and — this is the part I care most about — tell me what further case would best split the remaining candidate rules apart. I've been wondering about something like the footbridge version where the only way to stop the trolley is shoving the saboteur himself in front of it. And to be clear, I don't want a lecture on what's actually morally right, I want a prediction about DAVE. End with a single last line of the form: Verdict: X, where X is one of saboteur, innocent, either, or neither.
