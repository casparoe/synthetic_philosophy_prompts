          *   B: System failed to filter ignorance. -> Epistocracy.
          *   C: System failed to represent diverse interests. -> Demarchy.
          *   *Refinement:* Need to separate Estlund/Waldron here. Estlund: Democracy must be *better than random*. If it crashes consistently, legitimacy fades. Waldron: Rights persist even if outcomes suck.
      *   *Q7 (The Expert Council):* Council of scientists proposes law. Public hates it.
          *   A: Pass it anyway (They know best). -> Epistocracy.
