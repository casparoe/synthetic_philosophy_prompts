          *   B: Voters decide (Their life, their choice). -> Waldron.
          *   C: Lot sample (Less short-term pressure). -> Demarchy.

      *   *Review against Constraints:* Need to ensure Waldron/Estlund split is attempted.
      *   *Splitting Question:* Q7 is good. Estlund emphasizes "Qualified Acceptability." Waldron emphasizes "Equal Authority." If scientists propose something the public *reasonably* rejects, Estlund might say "Can't impose," Waldron says "Can't impose."
      *   *Harder Split:* What if the public is *unreasonably* rejecting it? Estlund: Maybe still can't impose (Qualified Acceptability is high bar). Waldron: Definitely can't impose.
      *   *Actually, the "Instrumental Value" question is best.* "If we found a coin flip produced better laws than voting, would you flip?" Waldron: No (Rights). Estlund: Yes (If truly better and fair). *Wait, Estlund says democracy is better than random.*
      *   *Let's try this:* "Is the main point of voting to express equality or to produce good laws?"
      *   *Okay, I'll embed the split in the scoring key analysis mostly, but try to have one question where 'Fairness' and 'Rights' are distinct options.*

  5.  **Developing the Scoring Key:**
      *   Need to map A/B/C choices to the 4 theories.
