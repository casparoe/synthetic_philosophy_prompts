answer: |-
  This is a fantastic pedagogical tool. The challenge you've identified is real: undergrads (and most adults) hold "zombie theories"—views that walk like epistocracy but talk like proceduralism until pressed.

  Below is the 10-question diagnostic instrument, designed to be handed directly to students. Following that is the **Instructor's Key**, which includes the scoring logic, the specific theoretical mapping you requested, and the critical analysis of the Waldron/Estlund overlap and "homeless" positions.

  ***

  # The "Who Should Decide?" Quiz

  **Instructions:** Read each scenario and pick the answer that feels most right to you. There are no correct answers, only consistent ones. Don't overthink it—go with your gut reaction.

  **1. The False Fact Referendum**
  A state puts a new economic policy on the ballot. Every independent study says the policy will raise prices. However, 60% of voters are convinced it will lower prices (they are factually wrong). The policy passes, and prices go up.
  *   **A.** The outcome is legitimate. Voters have the right to make mistakes about their own lives.
  *   **B.** The outcome is flawed. We shouldn't let factual errors dictate laws that hurt everyone.
  *   **C.** The process was the problem. A random group of regular people would have listened to the studies more than politicians did.

  **2. The Biased Knowledge Test**
  Imagine we require voters to pass a basic civics test. The test is fair and measures actual knowledge, but because of historical inequality, it accidentally disqualifies 40% of one ethnic group and only 10% of others.
  *   **A.** Ban the test. Equal right to vote is more important than filtering for knowledge.
  *   **B.** Keep the test. Competence matters more than perfect demographic balance.
  *   **C.** Ditch the test *and* elections. Pick decision-makers by lottery so everyone has an equal chance to serve.

  **3. The Accuracy Gap**
  Suppose we have data showing the general public picks the "best" policy 51% of the time. A council of highly educated experts picks the "best" policy 70% of the time.
  *   **A.** Give the council more power. A 19-point gap in accuracy is too big to ignore.
  *   **B.** Stick with the public. 51% is good enough, and fairness matters more than squeezing out extra accuracy.
  *   **C.** Replace both. Experts are out of touch, and the public is too noisy. Use a representative sample of citizens instead.

  **4. The Citizens' Assembly Success**
  A "Citizens' Assembly" (regular people chosen by lottery) solves a housing crisis that the elected Parliament failed to fix for ten years.
  *   **A.** This proves we should replace Parliament with Assemblies. Elections attract careerists, not problem-solvers.
  *   **B.** This is just luck. One success doesn't prove the system is better overall.
  *   **C.** This proves voters are ignorant. We should have let the housing experts decide in the first place.

  **5. The "Why Vote?" Question**
  When you cast a ballot, what is the main reason your vote should count?
  *   **A.** Because I am a citizen with equal dignity to my neighbors.
  *   **B.** Because my input helps the group find the right answer.
  *   **C.** Because I represent a slice of the community that needs to be heard directly.

  **6. The Disaster Scenario**
  Imagine studies prove that holding elections actually makes the country poorer and less safe compared to other systems, but banning elections would violate people's sense of freedom.
  *   **A.** Keep elections. The right to participate is worth the cost.
  *   **B.** Reform or restrict elections. If the system causes harm, we should fix the mechanics to get better results.
  *   **C.** Switch to sortition (lottery). It keeps the freedom of participation without the harms of campaigning.

  **7. The Expert Veto**
  Scientists unanimously agree a certain law is necessary to prevent a pandemic. The majority of voters vote against it because they don't like the restrictions.
  *   **A.** Enforce the law. Some things are too important to be voted on.
  *   **B.** Respect the vote. People have a right to reject even good advice from above.
  *   **C.** Put it to a jury of citizens. Let a random group decide after hearing the evidence, not the whole mob or just the scientists.

  **8. The Plural Voting Idea**
  John Stuart Mill suggested giving extra votes to people with higher education (e.g., professors get 2 votes, others get 1).
  *   **A.** Sounds fair. More knowledge should mean more influence.
  *   **B.** Sounds wrong. One person, one vote is the only equal standard.
  *   **C.** Sounds outdated. We shouldn't weight votes; we should weight *selection* by picking a diverse group to decide.

  **9. The Disagreement Problem**
  People fundamentally disagree about what makes a "good life." How should the government handle this?
  *   **A.** Let everyone weigh in equally. It's the only fair way to handle disagreement.
  *   **B.** Let the most knowledgeable weigh in more. Some views are objectively better than others.
  *   **C.** Let a representative microcosm decide. A small group that looks like society can negotiate better than a mass crowd.

  **10. The Oracle's Offer**
  An oracle tells you: "If you keep universal voting, freedom remains high but growth is slow. If you switch to rule by the knowledgeable, growth doubles but freedom feels restricted."
  *   **A.** Keep universal voting. Freedom to participate is the priority.
  *   **B.** Switch to knowledgeable rule. Good outcomes (growth) are the point of politics.
  *   **C.** Find a third way. Neither mass voting nor elite rule is the only option.

  ***

  # Instructor's Key & Theoretical Analysis

  ### Scoring Logic
  Tally the student's answers. While no human is perfectly consistent, look for the **dominant column**.

  *   **Mostly A's:** Rights-Based Pure Proceduralism (Waldron Neighborhood)
  *   **Mostly B's:** Epistocracy / Instrumentalism (Brennan Neighborhood)
  *   **Mostly C's:** Demarchy / Lottocracy (Burnheim / van Reybrouck Neighborhood)
  *   **Mixed A/B (Specific Pattern):** Epistemic Proceduralism (Estlund Neighborhood)
  *   **Mixed/Inconsistent:** "Homeless" or Unreflective Prior

  ### Theoretical Mapping

  #### 1. Rights-Based Pure Proceduralism (The "A" Cluster)
  *   **Core Theory:** Jeremy Waldron, David Estlund (on the fairness constraint).
  *   **Diagnosis:** These students believe political authority derives from respecting individuals as equals. Even if the outcome is wrong (Q1) or costly (Q6), the *process* of equal voting confers legitimacy.
  *   **Nuance:** They reject epistocracy not because it wouldn't work, but because it violates a right (Q2, Q5).

  #### 2. Epistocracy / Instrumentalism (The "B" Cluster)
  *   **Core Theory:** Jason Brennan, John Stuart Mill (Plural Voting), Plato.
  *   **Diagnosis:** These students view voting as a tool to produce good outcomes. If the tool is broken (ignorant voters, Q1) or a better tool exists (experts, Q3), they are willing to sacrifice equality for accuracy.
  *   **Nuance:** Watch for Q8. If they chose A there, they are classic Millians (Plural Voting). If they chose B on Q3 but A on Q8, they may be "Soft Epistocrats" who want competence but fear the optics of weighted voting.

  #### 3. Demarchy / Lottocracy (The "C" Cluster)
  *   **Core Theory:** John Burnheim, David Van Reybrouck, Hélène Landemore (recent work).
  *   **Diagnosis:** These students are dissatisfied with the *structure* of representation. They see elections as inherently oligarchic (Q4) and believe descriptive representation (a microcosm of society) solves the tension between competence and fairness (Q7, Q9).
  *   **Nuance:** This is often the "uncategorized" bucket for students who hate elites but also think the "mob" is irrational.

  #### 4. Epistemic Proceduralism (The "A/B Hybrid")
  *   **Core Theory:** David Estlund.
  *   **Diagnostic Pattern:** Usually **A on Q2 & Q5** (Fairness/Rights are constraints) but **B on Q3 & Q6** (Acknowledges epistemic value/outcomes matter).
  *   **The Estlund Stopper:** The key differentiator is Q6 and Q7. Unlike the Pure Proceduralist (Waldron), the Estlundian admits democracy is valuable *because* it tends to track truth better than random, but rejects Epistocracy because it fails the "Qualified Acceptability Requirement" (it can't be justified to all qualified points of view).
  *   **Note:** In a 10-question quiz, these students often look like Waldronians. See "Critical Flag 1" below.

  ### Critical Flag 1: The Waldron / Estlund Overlap
  You asked to flag if two views answer identically. **Yes, Waldron and Estlund will largely collapse in this quiz.**
  *   **Why:** Both reject epistocracy and support universal suffrage in almost all real-world scenarios.
  *   **The Split:** The theoretical split is *why* they support it. Waldron: Intrinsic right. Estlund: Instrumental value + Fairness constraint.
  *   **The Quiz Limitation:** Q6 (The Disaster Scenario) is your best splitter.
      *   **Waldron:** Keep elections even if they make us poorer (Rights are trumps).
      *   **Estlund:** If democracy is *worse than random*, its authority dissolves. However, Estlund argues democracy is *never* worse than random in practice.
  *   **Recommendation:** In your debrief, tell the "A" cluster: "You are Proceduralists. Some of you think voting is a *right* (Waldron); others think it's a *fair procedure that usually works* (Estlund). The difference matters only if democracy starts failing catastrophically."

  ### Critical Flag 2: "Homeless" Positions
  You asked to note answer patterns that correspond to unoccupied positions.

  **1. The "Incoherent Epistocrat" (Mostly B, but A on Q2)**
  *   **Pattern:** Wants rule by the knowledgeable (Q3, Q7) but rejects tests that have disparate impact (Q2).
  *   **Analysis:** This is the most common view in the general public. It is theoretically unstable. If knowledge is the criteria for authority, you must accept the distribution of that criteria, even if correlated with ethnicity. If you reject the correlation, you are prioritizing fairness over knowledge, which undermines the epistocratic premise.
  *   **Verdict:** **Unoccupied by theorists.** It's a "have my cake and eat it too" position. Nobody defends it because it collapses under scrutiny.

  **2. The "Elite Demarchist" (Mostly C, but B on Q8)**
  *   **Pattern:** Wants selection by lot (Q4, Q7) but also thinks professors should get more weight (Q8).
  *   **Analysis:** Sortition relies on the premise of *equality of capacity* to judge. Plural voting relies on *inequality of capacity*. Holding both suggests a confusion about whether the problem is *who* decides (elites vs. people) or *how* they decide (votes vs. lots).
  *   **Verdict:** **Historically Homeless.** Burnheim explicitly argues against plural voting within assemblies. This view is likely just confusion.

  **3. The "Benevolent Dictator" (All B's, specifically Q3 & Q7)**
  *   **Pattern:** If the expert gap is large enough (Q3) or the stakes are high enough (Q7), they hand over the keys.
  *   **Analysis:** This is a occupied position (Plato, Confucian Meritocracy), *but* it fails the "Estlund Stopper." If they answer "Yes" to a 90% accurate dictator (Q3 follow-up), they are vulnerable to the "Who guards the guardians?" objection.
  *   **Verdict:** **Occupied but Vulnerable.** Use this to introduce the "No One Knows Who Knows" objection.

  ### Debrief Tips for the Workshop
  1.  **Validate the "A" Cluster:** Remind them that "Rights-Based" doesn't mean "Outcomes don't matter," it means "Rights constrain how we chase outcomes."
  2.  **Challenge the "B" Cluster:** Ask them the "Estlund Stopper" orally: "Who decides who is knowledgeable?" If their answer is "a test," ask "Who writes the test?"
  3.  **Highlight the "C" Cluster:** This is usually the most novel view for undergrads. Emphasize that this isn't "randomness," it's "statistical representation."
  4.  **The "Homeless" Talk:** Be honest with the students who score inconsistently. "Your intuition wants competence, but your conscience wants equality. That tension is exactly what political theory is for. You're not broken; you're just doing philosophy."
