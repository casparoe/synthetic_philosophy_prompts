  *(Self-Correction on Waldron/Estlund Split)*: I need to be careful. Estlund is *not* a pure instrumentalist. He argues democracy is *generally* epistemically valuable. But the *authority* comes from fairness. However, if democracy were *demonstrably worse* than a fair epistocracy, Estlund admits the argument for democracy weakens significantly compared to Waldron. Waldron's argument is deontological (rights-based). Estlund's is "proceduralist but truth-tracking."
  *Decision:* I will note in the analysis that for the purpose of an undergrad quiz, these two often collapse into "Democratic Proceduralist," but I will provide the nuance in the key.

