      *   *Solution:* Need a question where *accuracy* is conceded but *authority* is questioned. Or a question about *why* we value the vote.
      *   *Refinement:* Actually, the prompt asks me to flag if they answer identically. I need to try to split them.
      *   *Splitting Case:* A scenario where democracy gets the *wrong* answer. Waldron: Still legitimate because rights were respected. Estlund: Still legitimate because procedure was fair/acceptable, *provided* it wasn't clearly worse than random.
      *   *Better Split:* A scenario about *expertise*. Waldron: Expertise is irrelevant to the right to rule. Estlund: Expertise is relevant to the *quality* of the system, but not enough to override fairness.
      *   *Decision:* I will try to construct a question that separates them based on *why* they reject epistocracy. If I can't, I will flag it in the analysis section as requested. Actually, Estlund's "Qualified Acceptability Requirement" is the key. If a system is more accurate but reasonably rejectable, Estlund says no. Waldron says no because of equal authority.
      *   *Wait, a better split:* What if the "expert" rule is *less* accurate than democracy? Epistocrat says no. Waldron says no (rights). Estlund says no (fairness).
      *   *Okay, the real split is:* Does the *value* of voting depend on its contribution to good outcomes? Waldron: No, it's intrinsic. Estlund: Yes, instrumentally, but constrained by fairness.
      *   *Question Idea:* "If we proved voting doesn't improve policy, should we keep it?" Waldron: Yes (Right). Estlund: Maybe/No (Instrumental value needed).
      *   *Actually, let's look at the "Oracle" prompt:* Estlund uses the "No One Knows Who Knows" argument. Waldron uses the "Right to Participate" argument.
      *   *Strategy:* I will design the quiz to group them closely but try to find one question about the *source* of legitimacy (Rights vs. Fairness/Truth-tracking). If they end up clustered, I will note it in the "Homeless/Overlap" section as requested.

  4.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (The False Belief Case):* 60% believe false fact. Policy fails.
          *   A: Unjust outcome (Truth matters). -> Epistocracy lean.
          *   B: Legitimate outcome (Process matters). -> Proceduralist lean.
