      *   *Epistemic Proceduralism (Estlund):* Democracy is good *because* it tends to produce good outcomes (better than random), BUT authority doesn't come from being *right*, it comes from being *fairly acceptable* to qualified points of view. We can reject epistocracy even if it's slightly more accurate, because it fails the "qualified acceptability" test.
      *   *Demarchy (Burnheim/van Reybrouck):* Elections are inherently oligarchic/biased. Sortition (lottery) creates descriptive representation and removes careerist incentives. Focus is on *who* decides (representative microcosm) rather than just *how many* decide.

  3.  **Address Critical Requirement 1 (Waldron vs. Estlund):**
