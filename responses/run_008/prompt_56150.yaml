          *   Explain *why* it feels substantive to participants if it's verbal/conventional.
          *   Identify what would count as *progress* (conceptual distinction, pragmatic rule, or abandonment).
          *   **Style:** British English (spelling, vocabulary, tone).

  2.  **Deconstruct the "Species Problem":**
      *   *The Biological Species Concept (BSC):* Reproductive isolation. Good for sympatric animals, bad for asexuals, fossils, or plants that hybridise.
      *   *The Phylogenetic Species Concept (PSC):* Smallest monophyletic group. Good for cladistics, leads to "taxonomic inflation" (splitting).
      *   *The Morphological Concept:* Looks. Traditional, subjective.
      *   *The Ecological Concept:* Niche.
      *   *The Core Tension:* Evolution is a continuous process; taxonomy requires discrete categories. Nature is fuzzy; language is sharp.

  3.  **Address the "Substantive vs. Verbal" Debate:**
      *   *Is it verbal?* In a strict sense, yes. We are arguing over how to apply a label. But it's not *merely* verbal like arguing whether a hotdog is a sandwich. It has real consequences for conservation, law, and funding.
      *   *Is it substantive?* It touches on ontology. Do species exist as natural kinds (real entities) or are they mental constructs (classes)?
      *   *The "Different Questions" Hypothesis:* This is the strongest diagnostic angle. Some concepts aim to describe *process* (speciation), others aim to describe *pattern* (classification), others aim to facilitate *practice* (identification/conservation).
      *   *Why it feels substantive:* Because the stakes are high (conservation funding, legal protection). Also, biologists are realists; they believe they are discovering nature, not inventing it.

  4.  **Formulate the Diagnosis:**
      *   *Thesis:* It is primarily a **category error** resulting from trying to impose discrete labels on a continuous process, compounded by **pluralistic utility**. It's not purely verbal, but it's not a single substantive mystery waiting for a "fact of the matter" to solve it.
      *   *Analogy:* Colour spectrums. Where does red end and orange begin? The physics is real (wavelengths), the boundary is conventional, but the utility is real (traffic lights).
      *   *The "Fact of the Matter":* There isn't one single fact. The fact is evolution is gradual.
      *   *Progress:* Moving towards **pluralism** (using different concepts for different purposes) and **operational clarity** (stating which concept is being used). Abandonment is unlikely/unhelpful.

  5.  **Drafting the Content (incorporating British English):**
      *   *Spelling:* Colour, centre, analyse, programme, modelling, etc.
      *   *Vocabulary:* Whilst, amongst, favour, realise, specialised.
      *   *Tone:* Academic but accessible, thoughtful, slightly reserved but engaging.

  6.  **Step-by-Step Outline:**
      *   **Introduction:** Acknowledge the depth of the user's insight. State the diagnosis clearly (it's a mix of ontology and pragmatics, often talked past each other).
      *   **The Ontological vs. Operational Divide:** Distinguish between species as *processes* (evolutionary units) vs. species as *taxa* (ranking units).
      *   **Why it feels substantive:** The "Realism" trap. Biologists feel like explorers. Conservation stakes make it feel real.
