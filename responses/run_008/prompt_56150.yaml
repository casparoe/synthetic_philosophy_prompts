      *   **User's Level:** Amateur but well-read (knows about Biological Species Concept, Phylogenetic Species Concept, Morphological, etc.).
      *   **Core Question:** Is this disagreement substantive (about reality), verbal (about language), or are they answering different questions (pragmatic vs. ontological)?
