answer: |-
  You have put your finger on precisely the right nerve. The 'species problem' is one of the most enduring frustrations in the philosophy of biology, and your intuition that the disagreement might not be what it appears to be is shared by many philosophers of science.

  To offer the diagnosis you seek: the disagreement is neither purely substantive (a mystery about the fabric of reality) nor purely verbal (a quibble over dictionary definitions). Rather, it is a **category error compounded by pragmatic pluralism**. The rival camps are often answering different questions under the same label, yet they speak as though they are describing the same ontological feature of the world.

  Here is the breakdown of why this persists, why it feels substantive to the practitioners, and what progress might look like.

  ### 1. The Ontological Mismatch: Process vs. Pattern
  The root of the trouble is that evolution is a continuous process, whilst taxonomy requires discrete categories. Nature presents us with a branching continuum of genetic and phenotypic change. There are no neon signs in the genome that flash 'New Species Here'.

  When biologists argue over definitions, they are often conflating two distinct things:
  *   **Species as Processes:** This view (often aligned with the Biological Species Concept) sees a species as a dynamic lineage held together by gene flow. The question here is causal: *What keeps this group together?*
  *   **Species as Taxa:** This view (often aligned with the Phylogenetic Species Concept) sees a species as a static tip on the tree of life. The question here is historical: *Where did this lineage split?*

  If you are studying hybridisation in birds, the 'process' view is vital; if you are cataloguing beetles in a museum, the 'pattern' view is more useful. When a population geneticist argues with a taxonomist, they are often talking past one another. One is asking about the *mechanism* of cohesion; the other is asking about the *diagnosis* of difference. They are not disagreeing about the facts of the case (the DNA, the morphology, the breeding habits); they are disagreeing about which feature grants the group the *status* of 'species'.

  ### 2. Why it Feels Substantive (The Realism Trap)
  You asked why this does not feel verbal to the participants. It feels substantive because biologists are, by and large, scientific realists. They believe they are discovering nature, not inventing it.

  If I argue with you over whether a particular shade is 'red' or 'orange', we know we are arguing about a label on a spectrum. But if a conservation biologist argues that a population is a distinct species, the stakes are material. Legal protection, funding, and land rights hinge on that classification. If the classification were merely a convention, it would feel arbitrary. Because the consequences are real, the definition feels like it must be tracking a real boundary in nature.

  Furthermore, there is a metaphysical debate lurking beneath the surface: **Are species natural kinds or historical individuals?**
  *   If species are **natural kinds** (like 'gold' or 'water'), they should have essential properties. This drives the search for a universal definition.
  *   If species are **historical individuals** (a specific segment of the tree of life, like 'The British Empire' or 'The 1992 Olympic Team'), they do not need essential properties, only spatiotemporal continuity.

  Most professional biologists operate as if species are natural kinds, which is why they hunt for a universal definition. Many philosophers argue they are individuals. This mismatch ensures the debate continues: you cannot find a universal definition for something that is, by its nature, a unique historical entity.

  ### 3. Is there a Fact of the Matter?
  You asked what fact could decide the matter. The uncomfortable answer is: **none.**

  There is no 'fact of the matter' regarding where to draw the line, because the line is a human imposition on a gradient. Consider the 'ring species' problem (such as the *Ensatina* salamanders in California). Population A breeds with B, B with C, C with D, but A cannot breed with D.
  *   The **Biological** concept struggles here (are they one species or two?).
  *   The **Phylogenetic** concept might split them all.
  *   The **facts** (who mates with whom) are entirely known.

  The uncertainty is not empirical; it is conceptual. No amount of additional DNA sequencing will tell us whether the gap between A and D is 'large enough' to constitute a species boundary, because 'large enough' is a value judgement, not a measurement.

  ### 4. What Counts as Progress?
  Given this diagnosis, what would constitute progress? I would rule out the admission that the term should be abandoned. 'Species' is too deeply embedded in science, law, and public understanding. It is a 'folk kind' that has been professionalised; we cannot simply discard it without losing the ability to communicate.

  Progress lies in **operational pluralism** and **explicit contextualisation**.

  *   **Operational Pluralism:** We must accept that 'species' is a polysemous term (like 'bank', which can mean a financial institution or the side of a river). We should not seek a 'Grand Unified Theory' of species. Instead, we should accept that different definitions serve different research programmes. A definition suitable for conservation law (which needs clear boundaries) need not be the same as one for evolutionary theory (which needs to capture dynamic processes).
  *   **Explicit Contextualisation:** Progress is made when a biologist writes, "We treat these populations as distinct species under the Phylogenetic Species Concept for the purposes of this conservation assessment," rather than implying they have discovered the 'true' essence of the organism.

  The friction arises when one camp claims their definition is the 'real' one. The moment biologists treat species concepts as **tools** rather than **truths**, the tension dissipates.

  ### Summary Diagnosis
  The disagreement is not verbal in the trivial sense (like arguing over spelling), but it is **conventional** in the philosophical sense. It is a dispute over how to map our discrete language onto a continuous reality.

  It feels substantive because the map has real-world consequences (conservation, medicine, agriculture). However, it is not a mystery about the world waiting to be solved by better microscopes or sequencers. The 'joints' of the tree of life are real, but the size of the 'carve' we call a species is a human decision.

  Progress will not come from finding the one true definition. It will come from the discipline maturing enough to say: *"We are using this definition for this purpose, and we acknowledge that another definition might be better for a different purpose."* Until then, the circling will continue, not because nature is hiding the answer, but because we are asking nature to answer a question it cannot ask itself.
