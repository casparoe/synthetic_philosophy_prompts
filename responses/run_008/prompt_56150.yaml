  9.  *(Mental check on specific British spellings)*: 'programme' (for research programmes), 'modelling', 'favour', 'categorisation'.

  10. **Final Review of the Argument:** The core insight should be that 'species' is a *theoretical term* trying to do too many jobs. It's like asking "What is a 'mountain'?" Geologically, it's continuous elevation. Legally, it's a boundary for zoning. Biologically, it's both lineage and reproductive community. The disagreement persists because different sub-disciplines need different tools.

