answer: |-
  # Section Plan: The Semantics and Pragmatics of Slurs (50 Minutes)

  ## 1. Dependency Structure: Theory vs. Data
  **Order:** Introduce **substitution failures first**, then introduce the **at-issue/non-at-issue distinction**.
  **Reasoning:** Second-year students grasp theoretical taxonomy best when it serves as a solution to a puzzle they have already encountered. If you define "at-issue" and "non-at-issue" abstractly, students treat them as arbitrary labels. By first demonstrating that slurs and neutral counterparts behave differently under negation and conditionals (the substitution failure), you create an *explanatory gap*. The distinction is then introduced as the tool required to close that gap. This moves the lesson from "memorizing definitions" to "diagnosing linguistic behavior."

  ## 2. Example Vehicle
  **Recommendation:** **Invented toy slur** (e.g., "glub" stipulated to mean "redhead" + derogatory content).
  **Justification:** Real slurs carry historical trauma that can distract from the semantic mechanism or make students hesitant to engage with the logical forms. A dated slur risks confusion regarding reclamation dynamics. An invented term isolates the semantic variable.
  **Must Demonstrate:** That once derogatory content is stipulated as part of the word's convention, it behaves stably across embeddings (negation, conditionals, questions) just like natural slurs.
  **Must NOT Demonstrate:** Real-world social harm or complex sociological reclamation. The goal is to show semantic stability, not to model the ethics of appropriation; using a real slur (even dated) risks implying the semantic content is mutable based on social history, which contradicts the lesson's core claim about stability.

  ## 3. Sequence and Misconception Absorption

  ### Phase 1: The Substitution Puzzle (15 mins)
  *   **Activity:** Present paired sentences on slides using the toy slur vs. neutral counterpart (e.g., "Alex is a glub" vs. "Alex is a redhead").
  *   **Test:** Embed these in negation ("It is not the case that...") and conditionals ("If Alex is a...").
  *   **Observation:** Students observe that while the descriptive content is negated/conditionalized, the derogatory content persists (projects).
  *   **Misconception Absorption 1:** *"If in-group speakers can use it, the word itself must be neutral."*
      *   **Point of Absorption:** Immediately after comparing the slur to the neutral counterpart.
      *   **Strategy:** Clarify that *permission to use* (sociological) is distinct from *semantic content* (linguistic). Even if a redhead uses "glub" among redheads, the word still encodes the derogatory component; the social context licenses the utterance, but it does not erase the semantic content. This prevents students from conflating social appropriateness with semantic neutrality.

  ### Phase 2: The Distinction and Cancellation (20 mins)
  *   **Activity:** Introduce the **At-Issue/Non-At-Issue** distinction to explain the projection observed in Phase 1.
  *   **Test:** Attempt cancellation (e.g., "Alex is a glub, but I don't mean anything negative by that").
  *   **Observation:** The utterance sounds contradictory or infelicitous; the offensiveness remains despite the explicit denial.
  *   **Misconception Absorption 2:** *"Appropriated uses are just a matter of tone."*
      *   **Point of Absorption:** During the cancellation test.
      *   **Strategy:** Show that changing tone or adding a "no offense" clause does not remove the non-at-issue content. This directly counters the belief that offensiveness is entirely a matter of speaker intent or prosody. The content is encoded, not merely performed.

  ### Phase 3: Scope and Refusals (10 mins)
  *   **Activity:** Summarize the findings: Slurs carry stable, non-at-issue content that projects and resists cancellation.
  *   **Refusals:**
      1.  **Indexicality:** We will not cover theories that treat the derogatory content as indexical to the speaker's attitude.
      2.  **Expressive-vs-Descriptive Content:** We will not debate whether the derogatory content is truth-conditional (descriptive) or use-conditional (expressive).
      *   **Is refusing both right?** **Yes.** For a single 50-minute section, the priority is establishing the *phenomenon* of non-at-issue content (projection and non-cancellability). Debating the metaphysical status of that content (indexicality) or its truth-conditional contribution (expressive vs. descriptive) requires technical machinery that obscures the primary pedagogical goal. These are second-order debates suitable for a later lecture once the basic distinction is secured.

  ### Phase 4: Check for Understanding (5 mins)
  *   **Activity:** Pose the diagnostic question (see below).

  \answer{In the utterance 'It is false that the manager is a [slur]', is the derogatory component of the slur being denied?}
