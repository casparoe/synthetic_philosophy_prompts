answer: |-
  **The Scenario**
  Consider a hollow, spherical shell of immense mass density rotating at angular velocity $\omega$ relative to the asymptotic distant stars. Inside this shell, suspended freely in the vacuum cavity, sits a bucket of water held stationary relative to the shell's inner surface. In Newtonian mechanics, the shell's rotation is causally irrelevant to the interior; inertia is fixed by absolute space, so if the bucket rotates relative to absolute space (as it would if the shell drags it along, or if we view the shell as rotating around a static bucket), centrifugal forces should arise. However, in General Relativity, the rotating mass-energy current generates a gravitomagnetic field that drags local inertial frames. In the limit of sufficient mass density (the Brill-Cohen limit), the dragging becomes perfect: the local inertial frame inside rotates exactly with the shell. Consequently, a bucket stationary relative to the shell is also stationary relative to the local inertial frame, and the water surface remains perfectly flat, despite the system's rotation relative to the distant universe.

  **The Analysis**
  Here is how the predictions break down. The **Newtonian Substantivalist** claims inertial structure is a fixed background independent of matter. They predict the water *must* climb if the bucket rotates relative to absolute space, regardless of the shell's mass. Since the bucket is rotating relative to the distant stars (our proxy for the global frame), they expect centrifugal forces. The **Machian Relationist** claims inertia arises solely from relations between bodies. Since the bucket is at rest relative to the massive shell (the dominant matter), they predict the water stays *flat*. **General Relativity** sides with the Relationist here: the physics dictates that the local definition of "non-rotating" is determined by the nearby matter distribution via the metric field. Because the shell's mass drags the inertial frames to match its own rotation, the bucket is locally non-rotating, and the water does not climb. The substantivalist loses this round because the physics demonstrates that inertial structure is not fixed *a priori*; it is a boundary-value problem dynamically coupled to the stress-energy tensor.

  **The Deciding Feature**
  The feature doing the work is the **dynamical nature of inertial structure**. In Newtonian mechanics, inertial frames are a rigid stage upon which matter acts. In this GR scenario, inertial frames are a flexible fabric that matter can twist. The verdict isn't baked in by definition; it is derived from the Einstein field equations, specifically the off-diagonal terms ($g_{0i}$) that couple mass currents to spacetime geometry. The water stays flat not because we stipulated relationism is true, but because the gravitational interaction literally alters the local standard of non-rotation.

  **The Substantivalist Comeback**
  Do not let your students think this ends the war. A sophisticated substantivalist (specifically a **Metric Field Realist**) will concede that *Newtonian* absolute space is dead but argue that the **metric field** ($g_{\mu\nu}$) itself is the new substance. Their comeback relies on **gravitational waves**. In GR, the metric field can ripple and carry energy through a vacuum, independent of any matter sources (as seen in vacuum solutions like Minkowski or Schwarzschild spacetime). If inertia were purely relational (dependent only on matter), an empty universe would have no inertial structure. But GR allows an empty universe to have a well-defined geometry. The realist argues: "The water stayed flat not because of the *shell*, but because the *metric field* inside was dragged. That field is a physical entity distinct from the matter." They survive by shifting the ontology from "Space" to "The Metric Field," claiming it is a real object that mediates inertia, not just a codification of relations between rocks and stars.
