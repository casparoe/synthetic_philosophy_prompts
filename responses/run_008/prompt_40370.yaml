prompt: |-
  A guy in my reading group keeps saying the algorithmic fairness impossibility results are basically the Heisenberg uncertainty principle of machine learning: just as you can't pin down a particle's position and momentum at the same time, you can't have a risk score that's calibrated across groups and also equal in its error rates across groups. He points at the whole COMPAS/ProPublica dust-up and the Kleinberg et al. and Chouldechova papers from a few years back, and says the upshot is humility: it's a deep tradeoff woven into the fabric of the problem, like the speed of light, not an engineering failure, and no amount of cleverness gets you around it.

  Another friend, a philosophy grad student, thinks this is silly. Her line is that the impossibility results are really just demanding that a number be both even and odd. If you write down criteria that happen to be jointly unsatisfiable except in degenerate cases -- perfect prediction, everyone getting the same score, identical base rates -- then sure, you've proved something, but it's a triviality dressed up as physics. There's no law of nature in the neighborhood, just a choice of definitions, and calling it a Heisenberg-style limit is precisely what smuggles in the wrong conclusion, that we've hit a wall when actually we just wrote down two things that don't fit together.

  I have to write something up for the group and honestly I can't tell whose right. Can you audit both analogies for me? Spell out what maps onto what in each -- in the Heisenberg version, what plays the role of the particle, the measurement act, and the two quantities, and what plays those roles on the fairness side; in the even-and-odd version, what's the number and what are the parity conditions. Then tell me where each analogy breaks, and be picky about which breaks actually matter for the conclusion each person wants, namely whether these results are a deep unavoidable tradeoff or a definitional artifact. There's one wrinkle I only half understand: the theorems only bite when base rates differ across groups, and that's a contingent empirical fact about the world rather than something the definitions hand you -- does that make the tradeoff more physical than even-and-odd suggests, or less? At the end I want you to actually take a side: which of my two friends is closer to the truth, and is there a better analogy that neither of them has hit on? Please don't use headings, bullet points, bold text, or tables -- just continuous prose like you're writing me an email. And don't hand me a menu of options and let me choose; commit to a verdict and defend it.
