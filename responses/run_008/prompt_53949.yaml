  The ice in our glasses had melted enough to dilute the bourbon when Elena pushed her coaster aside.

  "You're still stuck on the arithmetic," Elena said. "But the only number that matters is the one on the recommendation form. Two against, one for. The candidate is out."

  "The arithmetic is the point," Mark replied. "We agreed on the criteria beforehand. Research, teaching, collegiality. All three required. On every single criterion, a majority of this committee said yes. Two to one on research. Two to one on teaching. Two to one on collegiality. By the department's own rules, the candidate passes."

  "By a phantom rule," Elena said. "Show me the member who voted yes on all three. You can't. A voted no on collegiality. B voted no on teaching. C voted no on research. There is no majority for hiring. There is only a majority for each isolated premise, stitched together into a verdict nobody actually endorsed. That's not a collective judgment; it's a procedural illusion."

  "It's the only way to make the group's verdict track the group's reasons," Mark said. "If we vote only on the conclusion, we sever the link between what we believe to be true and what we decide to do. A direct vote allows us to say 'No Hire' while simultaneously asserting as a body that the research is strong, the teaching is strong, and the candidate is collegial. We would be publishing a lie. We would be asserting facts that a majority of us explicitly reject."

  "We wouldn't be asserting facts," Elena countered. "We would be issuing a verdict. The committee isn't a person, Mark. It doesn't have a mind to hold beliefs. It has a mandate to make a decision. When you aggregate premise-by-premise, you manufacture a 'collective position' that no individual holds. You're letting a majority who never agreed on anything jointly overrule the actual majority who voted against the hire. And the machinery is brittle. Flip the criteria to disjunctive—hire if *any* criterion is met—and your method reverses the outcome without anyone changing their mind. Suddenly we'd be forced to hire a candidate everyone individually rejected."

  "That reversal proves the need for consistency, not the flaw in premise voting," Mark said. "If the criteria are conjunctive, we must vote on the conjuncts. If they are disjunctive, we vote on the disjuncts. The method respects the logic of the criteria. Your direct vote ignores the logic entirely. You say 'nobody holds the conjunction,' but why should group attitudes mirror individual attitudes? A corporation can be liable for negligence even if no single employee was negligent. The group's rationality is distinct from the members' psychology."

  "But it's not rational if it contradicts itself," Elena said. "You're arguing for a system where the committee 'believes' things a majority of it rejects. If we vote directly, we might reject the hire, but at least we aren't claiming the candidate is excellent in every category while rejecting them. Wait, no—your way claims they are excellent in every category and hires them. My way rejects them. The problem is your way creates a coherent story that is false to the voters. My way creates a verdict that is true to the voters but lacks a unified reason."

  "It lacks a unified reason because the voters are inconsistent," Mark said. "But the institution needs a reason. Tomorrow, the Dean asks why we rejected the candidate. If I say 'Because a majority found the research weak,' I am lying. A majority found the research strong. If I say 'Because a majority found the teaching weak,' I am lying again. Premise voting gives the Dean the truth: the committee found all criteria met. Direct voting leaves us mute or dishonest."

  "There is a middle path," Elena said, leaning in. "Sequential voting. We vote on research first. If it passes, we move to teaching. If at any point a premise fails, we stop. And anyone whose overall judgment contradicts the running tally is expected to revise their vote on the next premise to maintain consistency."

  "That turns deliberation into an elimination game," Mark said immediately. "The outcome depends entirely on the order of the votes. If we vote on research first, and C—who thinks research is weak—gets outvoted, C might feel pressured to vote 'weak' on teaching to force a rejection, even if they believe the teaching is strong. You're incentivizing strategic insincerity. The vote's order decides the outcome, not the members' reasons."

  "Better order dependency than collective fiction," Elena said. "At least then the verdict matches a possible path of reasoning."

  "Or," Mark said, "we admit the deadlock isn't a puzzle to be solved. It's evidence that 'what the committee believes' is a fiction. Only individuals ever judge. The committee is just a mechanism to aggregate power, not minds. Maybe the right move is to acknowledge we don't have a collective belief and send the Dean three separate reports."

  Elena paused, her hand hovering over her glass. For a moment, the eliminativist exit seemed to hang in the air between them, tempting and clean. If the committee doesn't think, then there is no paradox, only three people who disagree.

  "But the University will act in the committee's name tomorrow," Elena said quietly. "They won't accept three reports. They want a recommendation. They want us to be a single agent. If we tell them the agency is a fiction, they'll appoint a new committee that pretends it isn't."

  "Then we are trapped," Mark said. "Either we lie about our reasons or we lie about our verdict."

  "Or we argue about whether this meeting counts as having happened at all," Elena said. "If the procedure was flawed, was there ever a vote?"

  "We voted," Mark said. "We just disagree on what the vote was for."

  "We disagree on whether 'we' exists."

  Mark signaled the server. "Another round?"

  "Yes," Elena said. "But if we vote on it, I'm voting on the conclusion."

  "And I'm voting on the premise that we need more time."
