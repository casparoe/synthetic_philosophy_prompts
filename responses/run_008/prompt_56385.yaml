  My book club read a pop-philosophy piece on knowledge and practical stakes, and I copied down how it explained the view because something about it bugged me and I can't tell what. The author (no one you'd know, it was a newsletter thing) put it roughly like this: 'Contextualism says that whether you know something depends on your practical situation -- the same person, with exactly the same evidence, can count as knowing that the bank is open on Saturday when the stakes are low, and fail to know it when a lot rides on being wrong. This is because knowledge just is a context-sensitive property, the way "tall" is: the word picks out different thresholds in different settings, so there is no fact of the matter about what you know independent of the conversational context. It follows that knowledge has nothing to do with truth or justification -- those are internal, but knowledge is partly a social or practical status, which is why Descartes was wrong to look for certainty inside the mind. The lottery problem shows this neatly: nobody knows their ticket will lose, but if you were offered a bet at fantastic odds you'd be practically certain, and that's all knowledge amounts to.'

  So my question: is this a fair summary? Go through it bit by bit. I'd like to know what a defender of the view would accept, what they'd push back on, and where the author has glued together things that the literature keeps apart -- because I have a feeling there's at least one place where two distinct positions got mashed into one, and also a place where a technical term got used in its everyday sense. Also tell me whether the conclusion the author draws at the end actually follows from the parts that are right.

