answer: |-
  This is a sophisticated position to hold. Harsanyi's 1955 argument ("Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility") remains the gold standard for deriving utilitarianism from rational choice theory. It is elegant, formal, and avoids the squishy moral intuitions that usually plague normative ethics.

  However, you are right to suspect that the theorem is doing heavy lifting that isn't advertised in the axioms. The move from "rational choice under uncertainty" to "moral obligation" is not a free lunch.

  Here is the ranking of defeaters specific to the theorem-as-argument, ordered from **Fatal** (breaks the derivation) to **Awkward** (requires technical patching), along with how a committed Harsanyi defender would respond.

  ---

  ### 1. The Category Error: Risk vs. Justice (Fatal)
  **The Objection:** This is the critique you alluded to at the end, and it is the strongest. Harsanyi's theorem models social choice as a *single* agent choosing under risk (the Veil of Ignorance). But a society is not a single agent.
  When *I* take a risk with *my* life (e.g., a 50% chance of great pain for a 50% chance of great pleasure), that is prudence. When *society* imposes a 50% chance of pain on *Person A* and a 50% chance of pleasure on *Person B*, that is justice.
  The theorem assumes that the rationality governing intrapersonal trade-offs (risk) is identical to the rationality governing interpersonal trade-offs (justice). Critics (like John Rawls, ironically, though he used the Veil differently, and later David Gauthier) argue this is a category error. You cannot derive the *separateness of persons* away simply by modeling them as outcomes of a random variable.

  *   **Why it sinks the argument:** It attacks the bridge between the premises and the conclusion. Even if the math holds, the *interpretation* of the math as "morality" is unjustified. It proves that a rational agent behind a veil would choose utilitarianism for *themselves*, not that society *ought* to be utilitarian.
  *   **Harsanyi Defender's Response:** They will wave this away as semantic quibbling. They argue that if you accept the moral premise that "all persons count equally" (which is built into the equal probability assignment behind the veil), then the distinction between risk and justice collapses. To deny this is to deny the impartiality required for ethics in the first place.
  *   **Verdict:** **Fatal.** This is the point where the formal result runs out of road. The theorem proves a claim about rational preference, not a claim about moral truth, unless you smuggle in the premise that "impartiality = equal probability," which is itself a moral claim, not a rational one.

  ### 2. The Measurement Gap: Interpersonal Utility Comparisons (Fatal/Severe)
  **The Objection:** Von Neumann-Morgenstern (VNM) utility functions are unique only up to positive affine transformations ($u' = au + b$, where $a > 0$). This means Person A's utility scale has an arbitrary zero point and an arbitrary unit size compared to Person B's.
  To sum utilities ($W = \sum u_i$), you need **Cardinal Unit Comparability**. You need to know that 1 "util" for Alice is the same "size" as 1 "util" for Bob. Expected Utility Theory (EUT) *alone* does not provide this. Harsanyi acknowledges this but argues we can make these comparisons via "extended preferences" (imagining ourselves in another's shoes).
  *   **Why it sinks the argument:** If you cannot objectively fix the $a$ and $b$ constants across persons, the sum is meaningless. You could make any social outcome optimal simply by rescaling Alice's utility function. The theorem requires a substantive empirical/metaphysical claim about the comparability of mental states that EUT does not guarantee.
  *   **Harsanyi Defender's Response:** They concede this is an additional assumption but argue it is a *necessary* one for any coherent ethics. They claim that denying interpersonal comparability leads to moral skepticism. They argue we do make these comparisons in practice (e.g., giving a pill to a suffering child rather than a mildly annoyed adult), so the theory should accommodate that data.
  *   **Verdict:** **Severe.** It doesn't break the logic, but it breaks the claim that this is *just* rationality. It requires a robust theory of value measurement that many economists and philosophers reject. It shifts the burden from "rationality demands utilitarianism" to "rationality + controversial metaphysics demands utilitarianism."

  ### 3. Diamond's Critique: Ex Ante vs. Ex Post Fairness (Severe)
  **The Objection:** Peter Diamond (1967) provided the specific counter-example you mentioned.
  *   **Option A:** Person 1 gets 1 utility, Person 2 gets 0. (Deterministic)
  *   **Option B:** A coin flip. Heads: P1 gets 1, P2 gets 0. Tails: P1 gets 0, P2 gets 1.
  *   **Harsanyi/Utilitarian View:** Expected utility is 0.5 for both people in Option B, and 0.5 aggregate in Option A. Indifference.
  *   **Diamond's View:** Option B is morally superior because it gives both people an *ex ante* equal chance. Option A is unfair ex post.
  *   **Why it sinks the argument:** It shows that Harsanyi's aggregation rule ignores the moral value of procedural fairness. It implies that the only thing that matters is the final distribution of welfare, not the process or the claims individuals have *before* the outcome is realized.
  *   **Harsanyi Defender's Response:** They concede this implication but deny it is a bug. They argue that "fairness" is not a fundamental value; it is derivative of welfare. If the coin flip doesn't increase total welfare, caring about it is "rule worship" or irrational fetishism. They prioritize *ex post* welfare over *ex ante* rights.
  *   **Verdict:** **Severe.** It doesn't break the math, but it forces you to accept a very specific, controversial view of fairness (that it doesn't matter independently of outcomes). If you have the intuition that the coin flip *is* better, Harsanyi's theorem tells you that you are being irrational. That's a hard pill to swallow.

  ### 4. Entangled Preferences (Awkward/Fixable)
  **The Objection:** You asked about this specifically. If Alice's utility function includes Bob's welfare (she loves him), and Bob's includes Alice's, summing them leads to double-counting. $U_{social} = (U_{self} + U_{bob}) + (U_{self} + U_{alice})$. This inflates the weight of interconnected people compared to hermits.
  *   **Why it matters:** It violates the "individualistic" assumption of the theorem. It suggests the "persons" aren't the right unit of aggregation.
  *   **Harsanyi Defender's Response:** This is easily fixed. Harsanyi specifies that the aggregation should be over **self-regarding preferences** only. We strip out other-regarding preferences before summing to avoid double-counting. We treat people as if they only cared about their own consumption/experience for the sake of the calculation.
  *   **Verdict:** **Awkward.** It's technically fixable, but it requires an artificial dissection of human psychology. It implies that my love for you is morally relevant only insofar as it makes *me* happy, not insofar as it makes *you* better off. It works, but it feels reductive.

  ### 5. The Axiomatic Foundation (Awkward)
  **The Objection:** Harsanyi relies on the Independence Axiom of Expected Utility Theory. Behavioral economics (Allais Paradox, Ellsberg Paradox) suggests rational humans systematically violate this. If EUT is descriptively false or normatively suspect, Harsanyi's derivation collapses.
  *   **Harsanyi Defender's Response:** They stick to the normative gun. "Humans make mistakes; the axioms define rationality." They would argue that if you violate Independence, you are susceptible to Dutch Books (money pumps), so you *should* obey the axioms even if you don't naturally.
  *   **Verdict:** **Awkward.** This attacks the foundation of modern economics, not just Harsanyi. If you buy EUT, you buy this. If you don't, Harsanyi is the least of your worries.

  ---

  ### The Honest Verdict

  You asked: *"Is the theorem being asked to do more work than any formal result can do?"*

  **Yes.**

  Here is the precise limitation: **Harsanyi's Theorem is a consistency proof, not a foundational proof.**

  It proves: *IF* you accept (1) VNM rationality, *AND* (2) the Veil of Ignorance (impartiality), *AND* (3) Interpersonal Comparability... *THEN* you must be a Utilitarian.

  It does **not** prove that you *should* accept (1), (2), or (3).
  *   **(1)** is contested by non-EUT theorists.
  *   **(2)** is a moral assumption disguised as a rational setup (why equal probability? why not maximin?).
  *   **(3)** is a metaphysical assumption about the nature of value.

  The strongest attack available is indeed the one you identified: **The theorem proves less than utilitarianism.** It proves that a *single rational agent* spreading risk across *possible identities* would choose utilitarianism. It does not prove that a *society* of *distinct agents* is obligated to maximize that sum.

  The move from "I would choose this for myself if I didn't know who I was" to "We must do this for each other now that we know who we are" requires a moral premise that the theorem does not supply. It requires the premise that **morality is just prudence under ignorance.** Many philosophers (Kantians, Contractualists, Rawlsians) deny this premise. They argue morality is about respecting the distinctness of persons, not merging them into a single expected-utility maximizer.

  **Summary for your conviction:**
  If you hold the view firmly, you are essentially betting on three things:
  1.  That Interpersonal Utility Comparisons are objectively possible.
  2.  That "Fairness" has no value independent of "Welfare."
  3.  That the "Separateness of Persons" is morally irrelevant compared to the "Unity of the Rational Agent."

  If you are comfortable with those three substantive moral commitments, the theorem holds. If you think any of those three are false, the theorem is mathematically sound but morally inert. The defeaters aren't errors in Harsanyi's math; they are rejections of the moral premises he had to sneak in to get the math to start.
