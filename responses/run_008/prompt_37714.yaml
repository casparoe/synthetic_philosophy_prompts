answer: |-
  This is a profound dilemma that touches on one of the oldest questions in democratic theory: **The Boundary Problem.** As political theorist Robert Dahl noted, while democracy presumes that those affected by a decision should have a say, it cannot itself define *who* constitutes "the people" entitled to make that decision without circular reasoning.

  Your unease is well-founded. Each of your colleagues' positions relies on a different democratic principle, and each has significant flaws when applied to a complex, regional issue like downtown pedestrianization. Below is an analysis of the principles at play, an evaluation of the specific claims, and a framework for drawing a defensible line.

  ### 1. Evaluating Your Colleagues' Positions

  **Colleague 1: The "All-Affected" Principle**
  *   *The Argument:* Anyone impacted by the decision should vote.
  *   *The Strength:* It aligns with our moral intuition about fairness. The commuters (40% of the workforce) will face daily disruption or benefit from improved air quality/access.
  *   *The Weakness:* The "ripple effect" is infinite. Does a farmer who sells produce to downtown restaurants get a vote? Does a resident of the next province who might visit the city in five years get a vote? If you follow this principle strictly, the electorate becomes unmanageable and potentially larger than the population of the region. It lacks a stopping point.

  **Colleague 2: The "All-Subjected" Principle**
  *   *The Argument:* Only those subject to the city's coercive authority (laws/taxes) should vote.
  *   *The Strength:* It aligns with traditional legal sovereignty. It prevents outside interference in local self-government.
  *   *The Weakness:* It is legally formalistic but practically blind. Commuters *are* subject to city traffic and pedestrian laws while downtown. Business owners *do* pay city taxes. Excluding them because their *home* is elsewhere ignores that they are subjects of the city's authority during working hours. However, this principle also struggles with the teenagers; they are subject to the laws but excluded by age.

  **Colleague 3: The Partisan/Strategic Principle**
  *   *The Argument:* Expand the franchise to secure the desired outcome.
  *   *The Strength:* None, ethically.
  *   *The Weakness:* This is the most dangerous position. It treats the referendum not as a search for the public good, but as a tool for entrenchment. If discovered (and it likely would be), it would permanently destroy the council's legitimacy and invite lawsuits. It converts a democratic exercise into a gerrymandering of the electorate. **This option should be rejected outright.**

  ### 2. Weighing the Specific Claims

  To draw a line, we must weigh the *intensity* and *nature* of the stake each group holds.

  *   **The Commuters (Strong Claim):** They are the strongest case for inclusion. They are physically present daily, subject to local laws, and economically integral. Excluding them creates a "taxation (of time/effort) without representation" scenario.
  *   **The Business Owners (Moderate/Complex Claim):** They have a financial stake. However, granting votes based on property or commercial interest risks **plutocracy** (where wealth equals voting power). A business owner with ten storefronts should not have ten votes. Their interest is better served through stakeholder consultation than ballot expansion.
  *   **The Surrounding Township (Weak Claim for Voting, Strong for Cooperation):** While economically linked, they are a separate sovereign entity. Allowing their residents to vote in your city undermines their own council's authority. The solution here is not to dilute your electorate, but to form a **regional task force** where both councils vote on the plan jointly.
  *   **The Teenagers (Moral Claim):** This is an argument for lowering the voting age generally, not just for this referendum. Singling out one issue to allow 16-year-olds to vote sets a confusing precedent. If the city believes 16-year-olds are competent, lower the age for *all* elections.
  *   **Future Residents/Environment (Stewardship Claim):** While morally vital, they cannot vote. This is the responsibility of the *current* electorate to act as stewards. You cannot delegate this to non-existent voters, but you can require impact studies as part of the information provided to current voters.

  ### 3. Is the Boundary Arbitrary?

  You asked if any boundary is ultimately arbitrary. **Yes, but not all arbitrary lines are equal.**

  There is a difference between a *convenient* line and a *reasoned* line.
  *   **Residency** is convenient. It is easy to verify. But it is not neutral; it privileges homeowners and long-term residents over workers and renters. In a bedroom community where the downtown is an economic hub for the region, strict residency privileges the "sleepers" over the "doers."
  *   **Arbitrariness is acceptable only if justified by administrative necessity.** If you cannot verify non-resident status reliably, residency is the only choice. But if you can verify employment or property ownership, sticking to residency solely for simplicity ignores the substantive justice of the situation.

  ### 4. A Principled Framework: "Reciprocal Impact + Administrative Viability"

  To defend your decision, I recommend adopting a hybrid approach that acknowledges the limits of the referendum while creating alternative channels for inclusion.

  **Step 1: Define the Core Electorate (The "Subjected" Baseline)**
  Stick with **Residency** for the binding referendum, but acknowledge why.
  *   *Justification:* Municipal elections are legally structured around residence. Changing this for a single vote may be illegal or open to challenge. Residency ensures the voter is accountable to the community 24/7, not just 9-to-5.
  *   *Mitigation:* Acknowledge that residency is a proxy for "stake," not the definition of it.

  **Step 2: Create a "Stakeholder Assembly" (The "Affected" Compensation)**
  Since you cannot easily expand the ballot, you must expand the *process*.
  *   Establish a formal advisory body comprising the excluded groups (commuters, business owners, township reps).
  *   Give this body the power to propose amendments to the pedestrianization plan *before* it goes to referendum.
  *   *Principle:* If they cannot vote on the *decision*, they must have veto power over the *details* that affect them most (e.g., loading zones, transit access).

  **Step 3: Regionalize the Decision (The Township Solution)**
  If the Township's economy is truly dependent on your downtown, this is not a City issue; it is a **Regional issue**.
  *   Propose a joint resolution. The City Council and Township Council both vote to approve the plan.
  *   This respects the sovereignty of the Township residents (who vote for their own councilors) without requiring them to register in your city.

  **Step 4: Address the Intergenerational Gap**
  *   Regarding teenagers: If the council is serious about their long-term stake, propose a bylaw to lower the voting age to 16 for *all* municipal elections moving forward. Do not make it a one-time exception.
  *   Regarding future residents: Commission an independent long-term impact study (20-50 years) and make it mandatory reading material for all voters.

  ### 5. Recommendation for the Council

  When you speak to your council, you might frame it this way:

  > "We are facing the 'Boundary Problem.' If we let everyone affected vote, the election becomes unmanageable. If we let only residents vote, we ignore the people who make our downtown function. And if we choose voters based on how they might vote, we corrupt the process.
  >
  > I propose we keep the referendum restricted to residents for legal and administrative clarity, **but** we condition the implementation of the result on two things:
  > 1. The formation of a Downtown Stakeholder Board (commuters, business, township) with the power to negotiate mitigation measures (transit, parking, access).
  > 2. A formal inter-municipal agreement with the Township, ensuring their council formally consents to the regional economic impact.
  >
  > This respects the sanctity of the ballot while acknowledging that our democracy extends beyond our property lines."

  ### Summary
  The boundary is indeed somewhat arbitrary, but **procedural justice** can compensate for **boundary arbitrariness**. You cannot give everyone a vote, but you can give everyone a voice. By keeping the vote simple (residency) but making the *governance* inclusive (stakeholder boards and regional agreements), you maintain administrative feasibility without sacrificing democratic legitimacy. Reject the partisan approach entirely; it solves a short-term political problem by creating a long-term constitutional crisis.
