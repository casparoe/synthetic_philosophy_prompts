prompt: |-
  I serve on the council of a small city that is planning a referendum on whether to pedestrianize the entire downtown core. The vote's rules are straightforward in one respect — registered residents of the city may vote — but as the vote approaches, several groups have objected to being excluded. Roughly forty percent of the people who work downtown commute from outside the city limits and would be directly affected by the change; the surrounding township, whose residents depend on downtown businesses, has formally asked for a say; local business owners argue that anyone with a commercial stake, resident or not, should be entitled to vote; and a group of parents has argued, on the other side, that even resident teenagers who will live with the consequences for decades longer than most voters are excluded. Finally, an environmental group has petitioned on behalf of future residents who obviously cannot vote at all.

  My fellow council members have offered various responses: one says the franchise should track who bears the consequences of the decision; another says it should track who is subject to the city's laws and taxes, since the vote is merely self-government by those people; a third says we should simply extend the vote to whichever excluded groups would likely support the council's preferred outcome, since that's how politics actually works and everyone does it anyway. I'm uneasy about all three responses, but I'm struggling to articulate a principled way to decide who gets to vote. Is there a defensible way to draw the line here, or is any boundary we choose ultimately arbitrary, in which case we should perhaps just stick with residency for administrative simplicity? I'd appreciate a thoughtful analysis of how the various claims should be weighed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Role:** City Council Member in a small city.
      *   **Issue:** A referendum on pedestrianizing the downtown core.
      *   **Conflict:** The current voting rule is "registered residents." Several groups feel excluded (commuters, surrounding township, business owners, teenagers, future residents).
      *   **Colleagues' Positions:**
          1.  *All-Affected Principle:* Vote based on who bears consequences.
          2.  *All-Subjected Principle:* Vote based on who is subject to laws/taxes (self-government).
          3.  *Cynical/Partisan:* Extend vote to those who support the council's preference.
      *   **User's Stance:** Uneasy about all three, seeking a principled way to decide, wondering if boundaries are arbitrary or if residency is best for simplicity.
      *   **Goal:** A thoughtful analysis of the claims, weighing the principles, and offering a defensible recommendation.

  2.  **Deconstruct the Ethical/Political Principles:**
      *   **Residency (Status Quo):** Administrative simplicity, clear legal boundary, aligns with traditional municipal authority. *Weakness:* Ignores significant stakeholders (commuters, businesses).
      *   **All-Affected Principle (Colleague 1):** Democratic ideal that anyone impacted should have a say. *Weakness:* "Affected" is infinite (future generations, environment, regional economy). Hard to define boundaries.
      *   **All-Subjected Principle (Colleague 2):** Focuses on coercion/authority. If the city laws bind you, you should vote. *Weakness:* Commuters are subject to traffic laws downtown, but maybe not zoning taxes. Business owners pay taxes but might not live there.
      *   **Partisan/Strategic (Colleague 3):** Unethical, undermines legitimacy. *Weakness:* Destroys trust, openly corrupt.
      *   **Stakeholder/Competence/Duration:** (Implicit in the prompt's examples). Teenagers (duration), Future Residents (intergenerational justice).

  3.  **Evaluate the Specific Claims:**
      *   *Commuters (40% of workforce):* Highly affected daily. Subject to traffic/pedestrian laws while there. *Argument:* Strong claim under "All-Subjected" and "All-Affected."
      *   *Surrounding Township:* Economic dependency. *Argument:* Regional impact. *Counter:* They have their own council. Voting here undermines their own governance.
      *   *Business Owners:* Financial stake. Pay taxes. *Argument:* Property ownership often links to voting historically. *Counter:* Risk of plutocracy (wealth = votes).
      *   *Teenagers:* Long-term consequences. *Argument:* Intergenerational equity. *Counter:* Legal minority, capacity issues (though some places lower voting age).
      *   *Future Residents/Environment:* No voice. *Argument:* Stewardship. *Counter:* Impossible to implement in a referendum (dead can't vote).

  4.  **Analyze the "Arbitrariness" Question:**
      *   Is *any* boundary arbitrary? Yes, to some extent. All political boundaries are lines drawn on a continuum of connection.
      *   Does that mean we should just stick with residency? Not necessarily. Simplicity is a value, but legitimacy is also a value. If the decision drastically alters the region, strict residency might cause backlash/legal challenges.

  5.  **Develop a Framework for Decision Making:**
      *   Need to balance *Legitimacy* (does the vote count?), *Feasibility* (can we run the election?), and *Justice* (is it fair?).
      *   Reject the Partisan approach immediately (ethical baseline).
      *   Acknowledge the tension between "All-Affected" (too broad) and "All-Subjected" (too narrow/legalistic).
      *   Propose a "Principle of Reciprocal Impact + Administrative Viability."

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the difficulty. This is a classic problem in democratic theory (the "boundary problem"). Validate the user's unease.
      *   *Critique of Colleagues:*
          *   Colleague 1 (Affected): Noble but unbounded. Where does it stop?
          *   Colleague 2 (Subjected): Better, but misses economic stakeholders who aren't legally "subject" in the same way.
          *   Colleague 3 (Partisan): Dangerous. Erodes trust.
      *   *Analyzing the Excluded Groups:*
          *   Commuters: Strongest case. They are "temporary subjects."
          *   Business Owners: Complicated. Property-based voting is controversial. Maybe a stakeholder advisory role instead of a vote?
          *   Township: Regional issue. Should be handled via inter-municipal agreement, not diluting city vote.
          *   Teens/Future: Important moral considerations, but hard to codify in a single referendum. Lowering voting age is a separate policy change.
      *   *The "Arbitrariness" Trap:* Address the user's specific worry. Yes, lines are somewhat arbitrary, but *reasoned* lines are better than *convenient* ones. Residency isn't neutral; it privileges homeowners over workers.
      *   *Recommendation/Path Forward:*
          1.  Stick to Residency *but* mitigate exclusion. How?
          2.  Advisory referendums vs. Binding.
          3.  Stakeholder consultations (non-voting).
          4.  Regional cooperation (Township).
          5.  If expanding the franchise, do it based on *substantial presence* (e.g., work address + tax contribution), not just preference.
      *   *Conclusion:* Emphasize that the *process* matters as much as the *boundary*.

  7.  **Refining the Tone:**
      *   Needs to be professional, philosophical but practical, empathetic to the political reality.
      *   Avoid being too academic; keep it actionable for a council member.
