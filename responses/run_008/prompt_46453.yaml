answer: |-
  You have identified a genuine tension in epistemology: the conflict between **prediction-based validation** (Tetlock/Forecasting) and **explanation-based validation** (Science/History). Your tentative principle ("licenses a risky prediction") is a strong heuristic for forecasting, but it fails as a general theory of knowledge because it conflates *temporal prediction* with *logical constraint*.

  Darwin did not predict *when* finches would diverge, but his theory placed **hard constraints** on what biological forms could exist. A plane crash investigator does not predict the crash, but the wreckage places **physical constraints** on the story. The 2008 post-mortem analysts offer neither; they offer a flexible narrative that fits the data but rules out little.

  Here is the coherent principle that extracts the logic from your five verdicts.

  ### The Principle of Invariant Constraint

  A retrospective explanation is epistemically legitimate if and only if it satisfies two conditions:

  1.  **Counterfactual Robustness:** The proposed causal mechanism must impose specific constraints on the world such that, had the outcome been significantly different, the evidence or system state would also have been observably different. (It must rule out *something*).
  2.  **Selection Neutrality:** The explanation must not be the product of a selection process that filtered for narrators who could best fit the known outcome. (It must carry **Epistemic Cost**).

  #### Motivation by Case

  *   **Case 1 (2008 Post-Mortem) → Distrust.**
      *   *Fails Selection Neutrality.* The analysts are a selected group speaking after the fact. They paid no epistemic cost (reputation, capital) for their view.
      *   *Fails Counterfactual Robustness.* "Debt was high" is compatible with "No Crash" (debt can stay high for years). The explanation is too flexible; it doesn't rule out the counterfactual world where debt was high but the crash didn't happen.
  *   **Case 2 (Darwin) → Trust.**
      *   *Passes Counterfactual Robustness.* Natural selection constrains the *space of possible biological forms*. It predicts you won't find complex life without reproduction, or rabbits in the Precambrian. These are "risky claims" about the structure of reality, even if not temporal predictions.
      *   *Passes Selection Neutrality.* Darwin gathered data to test the mechanism, not to fit a known outcome. The theory pays a high theoretical cost: if finches weren't related, the theory dies.
  *   **Case 3 (WWI vs. USSR) → Distrust WWI, Trust USSR.**
      *   *WWI (Sarajevo):* Fails Counterfactual Robustness. This is the **Replaceability Test**. If you remove the Archduke, do you remove the War? Historians argue no; the alliance structure was the load-bearing wall, the assassination was a replaceable trigger. The explanation privileges a contingent path.
      *   *USSR (Stagnation):* Passes Counterfactual Robustness. If you remove the economic stagnation and imperial overstretch, does the collapse still happen? Unlikely. The structural explanation identifies load-bearing constraints that make the outcome nearly deterministic, not just contingent.
  *   **Case 4 (Plane Crash) → Trust.**
      *   *Passes Counterfactual Robustness.* Physics is the ultimate constraint. A fatigue crack leaves specific striations. If the crack hadn't caused the failure, the metal would look different. The wreckage rules out alternative stories.
      *   *Passes Selection Neutrality.* The metal does not care about the narrative. The evidence constrains the investigator.
  *   **Case 5 (2008 Pre-Mortem) → Trust.**
      *   *Passes Selection Neutrality.* This is the crucial distinction from Case 1. In 2006, the analyst exposed themselves to falsification. They paid an **Epistemic Cost** (being wrong would have ruined their career).
      *   *Note on "Identical Analysis":* You note the analysis is "essentially that same." This is the illusion. In 2006, the claim is probabilistic ("High risk of crash"). In 2009, the claim often shifts to deterministic ("This made it inevitable"). The *words* are similar, but the **modal commitment** differs. The principle trusts the 2006 wager, not the 2009 narration.

  ---

  ### Application to New Cases

  **Case A: The 2045 Historian (Taiwan War)**
  *   *Claim:* "War was the inevitable result of semiconductor supply concentration."
  *   *Verdict:* **Distrust.**
  *   *Reasoning:* This fails **Counterfactual Robustness**. "Inevitable" is a red flag for hindsight determinism. Did semiconductor concentration *rule out* peace? Or did it just raise the stakes? A robust explanation would specify the mechanism: "Concentration created a specific vulnerability X that forced a kinetic response because diplomatic option Y was exhausted." Without specifying the *constraint* that made peace impossible, this is a narrative fallacy (Case 1). It treats a structural pressure as a deterministic cause.

  **Case B: The Doctor (Rare Diagnosis)**
  *   *Claim:* "The diagnosis was visible in the chart all along."
  *   *Verdict:* **Conditional Trust.**
  *   *Reasoning:* Apply the **Constraint Test**.
      *   *Trust:* If the chart contained objective data points (e.g., specific enzyme levels) that met diagnostic criteria *existing at the time*, regardless of the outcome. The data constrains the diagnosis.
      *   *Distrust:* If the doctor is re-interpreting ambiguous symptoms (e.g., "the patient looked tired") based on knowing the outcome. This is **Selection Bias** (Case 1). The doctor is fitting the narrative to the known result, not demonstrating that the data ruled out other diagnoses.

  ---

  ### The Trade-Off: Which Verdict Must Go?

  You asked for honesty about whether a simpler principle requires sacrificing one of your five verdicts.

  **The Simpler Principle:** *"Legitimacy requires a risky temporal prediction."* (Your tentative principle).
  *   **Sacrifices:** **Case 2 (Darwin)** and **Case 4 (Plane Crash)**.
  *   **Why:** Neither Darwin nor the forensic team made a *temporal* prediction that could have failed *before* the event. Darwin explained existing data; forensics explained existing wreckage. If you demand temporal prediction, you must classify evolutionary biology and forensic engineering as "less legitimate" than macroeconomic forecasting. This is epistemically costly.

  **The Coherent Principle:** *"Legitimacy requires Invariant Constraint + Selection Neutrality."* (My proposed principle).
  *   **Sacrifices:** **None of the five verdicts, but it requires refining Case 1 vs. Case 5.**
  *   **The Tension:** You stated the 2006 and 2009 analyses were "essentially that same." My principle insists they *cannot* be the same if your trust levels differ.
      *   If the analysis is *truly* identical (same logic, same probability weight), then your gut is inconsistent: you should trust the explanation in 2009 just as much as 2006, even if you don't respect the analyst's foresight.
      *   To save your verdict, you must admit that the 2009 version usually smuggles in **determinism** ("This *caused* the crash") that wasn't present in the 2006 version ("This *risked* a crash").
      *   **Recommendation:** Keep the Complex Principle. It preserves the distinction between Science (Darwin), Forensics (Plane), and Forecasting (2008 Pre), while correctly identifying Narrative Fallacies (2008 Post, WWI Trigger).

  **Final Advice:**
  Your intuition is correct that "Risky Prediction" is too narrow. Replace it with **"Costly Constraint."**
