prompt: |-
  Two people in my grad cohort have been at each other for like a year now and our advisor wants them to try an adversarial collaboration before the next workshop. One is a proper higher-order theory person (Rosenthal style, thoughts about thoughts), the other is first-order all the way (Tye/Dretske flavor, phenomenal character fixed by the tracking/representation itself, no monitor needed). They keep talking past each other and it's getting a bit painful to watch. Can you write the document they should come out with?

  I want the claims they can both actually sign, and I mean genuinely sign, not diplomatic mush. Then the residual disagreements stated exactly, with the wording of each side's own view phrased so that that side would accept it — e.g. the higher-order person gets to say something like a state is conscious in virtue of being the target of a suitable higher-order representation, and the first-order person gets to say consciousness is carried by the state itself, and the joint document shouldn't smuggle in a resolution. Then the cruxes: I suspect one is whether there can be mental states that are phenomenally conscious but unavailable to any higher-order thought, and another is whether reportability or cognitive accessibility is constitutive of consciousness or just evidence of it. Maybe also whether the higher-order machinery must itself be conscious, since that threatens a regress and the first-order person thinks that's the whole ballgame. For each crux, give a concrete case or argument both sides would agree bears on it — blindsight and the stuff people say about it, split-brain patients reporting only half a scene, the infant/animal question of creatures who presumably have pain but maybe no concepts for their own states — and write down what each side predicts about that case in advance, so if it goes one way somebody has to move.

  Also: if you think part of their fight is verbal (like whether "state consciousness" and "creature consciousness" are being run together, or what "a thought about" a state even amounts to), say which part and why, since those bits might be dissolveable while the rest is real.

  One formatting thing: they want to circulate this as an email to the whole group, so please write it as continuous prose only, no headings or bullet points or tables or bold anything — just paragraphs, the way you'd write a long email. If a section needs separating, do it with a sentence, not a header. Also don't bother with citations or a reading list, none of us need it, just the substance. Keep it honest to both sides — I dont want either of them to feel the document leans toward the other.
