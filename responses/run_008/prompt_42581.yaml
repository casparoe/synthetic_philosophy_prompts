answer: |-
  Hi everyone, following our advisor's suggestion that we attempt an adversarial collaboration before the next workshop, we have spent the last week trying to isolate exactly where our views converge and where they diverge. The goal of this email is to circulate a document we have both signed off on, which lays out the substantive claims we share, the specific terminology where we suspect we might be talking past one another, and the concrete empirical cruxes where our theories make different predictions. We want to be clear that this is not a resolution of the debate, but rather a map of the battlefield that we hope will structure our contribution to the workshop and prevent further conversations from stalling on undefined terms. We believe this format allows us to maintain our respective theoretical commitments while agreeing on what would count as evidence against them.

  To start with the common ground, we both agree that consciousness is a natural phenomenon that should be explained within a physicalist framework, and we both endorse a representationalist approach to the mind. We agree that there is a meaningful distinction between mental states that are conscious and those that are unconscious, and that this distinction is not merely a matter of degree but involves a qualitative difference in kind. We also agree that introspective reports from subjects are crucial data points, though we differ on what these reports indicate about the underlying metaphysics. Furthermore, we both accept that cognitive access and reportability are intimately linked to consciousness, even if we disagree on whether that link is constitutive or merely evidential. We agree that any viable theory must account for the intuition that there is something it is like to be in a conscious state, and that this subjective character must be explained without invoking non-physical properties.

  We have identified specific areas where we suspect verbal disagreement may be inflating the substantive conflict, and we want to flag these for the group. One potential source of confusion is the distinction between state consciousness and creature consciousness. The higher-order proponent insists that a creature is conscious only insofar as it is in conscious states, whereas the first-order proponent worries that the higher-order view sometimes conflates the capacity for introspection with the capacity for experience itself. We agree to stipulate that when we discuss consciousness in this document, we are referring primarily to state consciousness, meaning the property of a specific mental state being phenomenally conscious, rather than the general wakefulness or alertness of the organism. Another verbal issue concerns the phrase a thought about a state. The higher-order proponent clarifies that this does not necessarily imply a full-blown conceptual judgment or linguistic encoding, but rather a non-conceptual higher-order representation that targets the first-order state. The first-order proponent accepts this clarification for the sake of argument but maintains that if this targeting mechanism is unconscious, it is unclear how it confers consciousness without magic. We agree to treat the higher-order mechanism as potentially unconscious to avoid regress, but note that this remains a point of contention regarding explanatory power.

  Having cleared some of the terminological underbrush, we can state our residual disagreements exactly, using wording that each of us accepts as accurate to our own view. The higher-order proponent holds that a mental state is conscious in virtue of being the target of a suitable higher-order representation, meaning that without this meta-representational layer, the state remains unconscious regardless of its first-order content. The first-order proponent holds that consciousness is carried by the state itself, provided that the state has the appropriate causal and representational connection to the world, and that no monitor or higher-order thought is needed to make the state conscious. We agree that this is the fundamental split: one side sees consciousness as a relational property involving a hierarchy of states, and the other sees it as an intrinsic property of a specific kind of first-order state. Neither of us believes the other's formulation is merely a restatement of our own, and we agree that this difference drives our divergent predictions about empirical cases.

  The first empirical crux concerns whether there can be mental states that are phenomenally conscious but unavailable to any higher-order thought or cognitive access. We agree to focus on cases of blindsight and similar dissociations where patients deny seeing a stimulus but can guess its properties above chance. The first-order proponent predicts that such patients may retain a diminished but genuine phenomenal consciousness that they cannot report on or access cognitively, implying that reportability is evidence of consciousness but not constitutive of it. The higher-order proponent predicts that these patients lack phenomenal consciousness entirely in the blindsight field, and that their accurate guessing is driven by unconscious first-order states that lack the higher-order targeting required for experience. If it can be demonstrated through non-report measures that blindsight patients possess rich phenomenology without access, the higher-order view must concede ground, whereas if phenomenology tracks access perfectly, the first-order view must explain why the intrinsic property vanishes when access is lost.

  The second crux involves creatures with limited conceptual capacities, such as human infants or non-human mammals, and whether they possess phenomenal consciousness. The first-order proponent predicts that these creatures have conscious states because they possess first-order representational systems that track environmental features, regardless of whether they have the capacity to think about their own thoughts. The higher-order proponent predicts that these creatures only have conscious states if they possess the machinery for higher-order representation, which may require conceptual capacities they lack, implying that without such machinery, there is nothing it is like to be them. We agree that evidence regarding the neural correlates of meta-representation in infants and animals bears directly on this question. If neuroscientific data shows phenomenal consciousness in the absence of prefrontal circuits associated with higher-order thought, the first-order view is supported, whereas if consciousness correlates strictly with those higher-order circuits, the higher-order view is supported.

  The third crux addresses the regress problem and whether the higher-order machinery must itself be conscious. The higher-order proponent maintains that the higher-order representation need not be conscious to make the target state conscious, arguing that requiring the higher-order state to be conscious would invite an infinite regress. The first-order proponent argues that if the higher-order state is unconscious, it is mysterious how it can confer consciousness on the target, suggesting that the higher-order view either collapses into a first-order view of the higher-state or fails to explain the transition from unconscious to conscious. We agree to treat this as a theoretical constraint rather than an empirical test for now, but we note that if the higher-order proponent cannot explain the mechanism of conferment without appealing to intrinsic consciousness somewhere in the chain, the first-order proponent wins on grounds of parsimony. Conversely, if the first-order proponent cannot explain why some first-order states are conscious and others are not without invoking a functional role that looks like higher-order monitoring, the higher-order proponent wins on explanatory scope.

  We are circulating this now so that the group can see where we stand before the workshop, and we invite feedback on whether we have characterized the cruxes fairly. Our commitment is that if the evidence from these cases points decisively one way, we will update our views accordingly, or at least acknowledge where our theory requires ad hoc adjustments. We hope this makes our upcoming presentation more productive and stops us from repeating the same objections without engaging the underlying predictions. We look forward to discussing this with you all soon.
