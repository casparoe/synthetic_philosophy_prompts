prompt: |-
  At a recent family dinner, my brother-in-law Dev recounted something from his two years working for a water-infrastructure NGO in a country I won't name. To get his project's permits processed, he gave the permits clerk a bottle of whisky at the new year and, on another occasion, an envelope of cash to the clerk's office as a collective thanks after a difficult application finally cleared. Two of my friends who were present — Amara, who studied political science, and Tom, an anthropologist — spent the rest of dinner arguing about whether Dev had behaved corruptly, and they each asked me afterward to say who had won. I couldn't, and I'd rather not signal a view. Here is the exchange as it unfolded.

  (1) Amara opened by saying the envelope of cash was a straightforward bribe: a payment by a private party to a public official in connection with the performance of duty is corrupt by definition, and dressing it as thanks or custom doesn't change what it is. She added that definitions like this aren't Western parochialism — impartial public office is a norm every modern state officially endorses, including this one.

  (2) Tom answered that Amara's definition does the work only if you already know which payments count as "in connection with duty." The cash came after the application cleared; the whisky was a seasonal courtesy the clerk would have received from dozens of others; neither payment was conditional on anything. In that setting, he said, the gift is not an exchange at all but what anthropologists would call diffuse rather than specific reciprocity — it builds a relationship rather than purchases a service. Calling that corruption imports a Western wall between the market and the gift that this society never built.

  (3) Amara replied that the timing distinction is illusory: a tip is just a bribe paid after the fact, and everyone who tips a waiter knows that the real currency is future service. What the payment actually purchases is standing in a queue that officially doesn't exist. And the clerk's "duty" is not a fixed output — processing speed, order, and attention are all discretionary — so a system in which gifts are expected quietly converts equal entitlement into something auctioned off in envelopes.

  (4) Tom countered that on that reasoning every gift economy is corrupt, since all gifts create expectations; Amara had quietly reduced reciprocity to transaction and then indicted the transaction. He also noted that Amara had shifted from deviation-from-duty to outcomes-over-time: if corruption just means "any practice that generates unequal access to discretionary services," then legacy admissions at Amara's own university are corruption too — which she might accept, but then her charge no longer singles out Dev's whisky.

  (5) Amara said she was happy to bite that bullet: her real criterion is not deviation from duty but the erosion of the ideal that public decisions should track the merits of the case, and institutions that auction access — whether via envelopes, legacy preferences, or campaign contributions — sit on a continuum of failing that ideal, with the envelope further along it. Corruption, she said, is best understood as a property of the system of expectations, and Dev made himself a consenter to that system.

  (6) Tom closed by saying that a system-level standard gives Dev no action-guidance at all: an individual cannot unilaterally redesign a gift culture, refusing the whisky would have read as contempt, and Amara's position amounts to demanding that Dev absorb the moral costs of a badly designed institution so that she can keep her categories clean. Better to say the system is corrupting without saying Dev behaved corruptly.

  Please adjudicate this move by move: for each of the six numbered moves, say whether the point is sound, defeated by something said earlier or later in the exchange, or sound only given a hidden assumption, and identify that assumption. Then say who is right about what, and — importantly — what, if anything, both of them are missing. In particular, I'd like your view on whether the distinction Tom draws in (2) between specific and diffuse reciprocity can bear the moral weight he puts on it, and whether Amara's shift in (5) to a system-level criterion is a principled refinement or a moving of goalposts.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a six-move debate between Amara (Political Science) and Tom (Anthropology) regarding whether Dev's actions (gifts to a clerk) constitute corruption.
      *   **Format:** For each of the six moves, evaluate soundness (sound, defeated, sound only with hidden assumption). Identify assumptions.
      *   **Conclusion:** Determine who is right about what. Identify what *both* are missing.
      *   **Specific Focus:** Evaluate Tom's distinction between specific/diffuse reciprocity (Move 2) and Amara's shift to a system-level criterion (Move 5).
      *   **Constraint:** The user wants me to avoid signaling a personal view on the specific case (Dev's actions) but rather analyze the *arguments*. However, the prompt asks me to "adjudicate," which implies making a judgment on the *quality of the arguments*, not necessarily condemning Dev. I need to be careful not to violate the "I'd rather not signal a view" constraint regarding Dev's morality directly, but I must answer the philosophical questions posed.
      *   **Tone:** Analytical, balanced, philosophical, precise.

  2.  **Deconstruct the Moves:**

      *   **Move 1 (Amara):** Cash to public official for duty = bribe/corrupt by definition. Norm of impartiality is universal (officially).
          *   *Analysis:* Strong legalistic/formalist definition. Relies on the assumption that official norms reflect actual moral obligations and that context doesn't alter the definition of "payment for duty."
          *   *Vulnerability:* Ignores cultural context and timing (post-factum).

      *   **Move 2 (Tom):** Distinction between specific (quid pro quo) and diffuse (relationship building) reciprocity. Gifts aren't exchanges. Western market/gift wall is parochial.
          *   *Analysis:* Strong anthropological descriptive claim.
          *   *Vulnerability:* Descriptive doesn't equal normative. Just because a culture *views* it as diffuse doesn't mean it *functions* without exclusionary effects.
          *   *Assumption:* Cultural validity equals moral validity.

      *   **Move 3 (Amara):** Timing is illusory (like tipping). Discretionary power (speed, attention) is what's being bought. Converts equal entitlement to auction.
          *   *Analysis:* Strong functionalist critique. Addresses Tom's timing argument.
          *   *Vulnerability:* Equates all discretion with corruption.
          *   *Assumption:* Discretion in bureaucracy is inherently suspect if influenced by social capital.

      *   **Move 4 (Tom):** Reductio ad absurdum (all gift economies corrupt). Accuses Amara of shifting goalposts (duty -> outcomes). Points out hypocrisy (legacy admissions).
          *   *Analysis:* Strong logical pressure. Highlights inconsistency in Amara's application of the principle.
          *   *Vulnerability:* Tu quoque (legacy admissions) doesn't prove Dev is innocent, just that Amara is inconsistent.
          *   *Assumption:* If a definition applies to Western institutions, it loses its bite for Dev (moral equivalence).

      *   **Move 5 (Amara):** Bites the bullet. Criterion is erosion of merit-based public decision. System of expectations. Dev is a consenter.
          *   *Analysis:* Principled consistency. Moves from act-based to system-based ethics.
          *   *Vulnerability:* Demands high individual cost for systemic change.
          *   *Assumption:* Individual participation validates the system significantly enough to warrant blame.

      *   **Move 6 (Tom):** System-level standard offers no action guidance. Refusal has social cost (contempt). Demands Dev absorb moral costs for Amara's clean categories. Distinguishes "system is corrupting" vs "Dev is corrupt."
          *   *Analysis:* Strong pragmatic/agent-centered critique. Distinguishes structural sin from individual guilt.
          *   *Vulnerability:* Can lead to moral quietism (everyone is just following orders/culture).
          *   *Assumption:* Individual agency is too constrained by culture to warrant moral blame.

  3.  **Evaluate Specific Questions:**
      *   *Tom's Specific vs. Diffuse Reciprocity:* Can it bear moral weight? Descriptively yes, normatively weak. Diffuse reciprocity can still exclude outsiders.
      *   *Amara's Shift (Move 5):* Principled refinement or moving goalposts? It looks like a refinement to maintain consistency, but it does broaden the scope significantly. It's a shift from *legalistic* to *structural* corruption.

  4.  **Identify What Both Miss:**
      *   **The Power Dynamic:** Neither focuses enough on the *vulnerability* of the clerk or the *necessity* for Dev. Was Dev exploiting power or surviving?
      *   **The "Clean Hands" Problem:** Both assume Dev had a choice that didn't carry severe penalties.
      *   **The Function of the Gift:** Is the gift *actually* building community (Tom) or *actually* buying speed (Amara)? In reality, it's likely both.
      *   **Institutional Design:** Both blame either the individual or the culture, missing the specific institutional failures (low wages, lack of transparency) that make the gift necessary.
      *   **The "Nameless Country":** The anonymity suggests the specific institutional context matters more than the abstract debate.

  5.  **Drafting the Adjudication (Iterative Process):**

      *   *Intro:* Acknowledge the complexity. State that this is a classic clash between Universalism (Amara) and Particularism/Contextualism (Tom).
      *   *Move-by-Move:*
          *   (1) Sound on legal definition, assumes official norms = moral reality.
          *   (2) Sound descriptively, assumes description = justification. Hidden assumption: Cultural coherence implies moral permission.
          *   (3) Sound functionally, assumes all discretion = commodification.
          *   (4) Sound logically (consistency check), assumes equivalence (legacy = bribery).
          *   (5) Sound philosophically (consistency), assumes individual complicity = culpability.
          *   (6) Sound pragmatically, assumes structural determinism limits moral agency.
      *   *Who is Right:* Amara on the *structural effect* (it does erode impartiality). Tom on the *individual culpability* (Dev is trapped).
      *   *The Missing Pieces:* The distinction between *survival corruption* vs. *greed corruption*. The role of institutional design (wages, procedures). The distinction between *blame* and *responsibility*.
      *   *Specific Focus Answers:*
          *   Tom's Reciprocity: Descriptively useful, normatively insufficient. Diffuse reciprocity can still be exclusionary.
          *   Amara's Shift: Principled refinement. She moves from act-utilitarianism to rule/system-ethics. Not goalpost moving, but deepening.

  6.  **Refining the Output:**
      *   Ensure I don't condemn Dev personally (respecting the user's constraint about not signaling a view on Dev specifically, though I must analyze the *arguments* about him).
      *   Make sure the "Hidden Assumptions" are explicit.
      *   Ensure the "What Both Miss" section is substantive.

      *(Self-Correction during drafting)*: I need to be careful with Move 4. Tom's point about legacy admissions is a *tu quoque*. It attacks Amara's consistency, not the truth of her claim about Dev. I should note that.
      *(Self-Correction on Move 6)*: Tom's distinction between "system corrupting" and "Dev corrupt" is crucial. This is the distinction between *structural sin* and *personal guilt*. I need to highlight this.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Adjudicate move by move? Yes.
      *   Sound/Defeated/Assumption? Yes.
      *   Who is right about what? Yes.
      *   What are they missing? Yes.
      *   Specific view on Reciprocity and System-level criterion? Yes.

      *Wait, one constraint check:* "I'd rather not signal a view." The user says *they* don't want to signal a view. They are asking *me* to adjudicate. I should provide the analysis requested without being preachy about Dev's morality, but I must answer the philosophical question of whether the arguments hold. I will focus on the *logic* of the arguments rather than declaring Dev "Guilty" or "Innocent."

      *Wait, another constraint check:* The prompt asks me to "say who is right about what." This requires taking a stance on the *arguments*, not necessarily on Dev's soul. I can say "Amara is right about the systemic effect" without saying "Dev is a criminal."

      *Let's structure the response clearly.*

      *   **Introduction:** Frame the debate (Universalism vs. Contextualism).
