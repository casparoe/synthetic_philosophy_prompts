answer: |-
  **QUESTION 1 (20 Marks)**

  **Case Description:**
  You are stranded in a desert, facing death. A driver passes by who is a highly reliable predictor of human behavior. She only stops for motorists she predicts will pay her $1,000 once delivered to the city. If she predicts you will not pay, she drives past, and you die. If she stops, you survive the journey.

  **Scenario A (The Plain Deal):** Upon arrival in the city, you are simply asked to pay the $1,000. There are no legal contracts, no reputation effects, and no future interactions. The money is yours to keep or give.

  **Scenario B (The Escrow Deal):** The driver offers an alternative contract before picking you up. At the moment of pickup, you must hand over a $1,500 cash deposit. Upon arrival in the city, if you pay the $1,000 fare, she refunds the $1,500 deposit immediately. If you refuse to pay the $1,500 fare, she keeps the deposit. You survive the journey in either case if picked up.

  **Instructions:**
  Assume you are a consistent Causal Decision Theory (CDT) agent who values survival above money. Answer the following in a coherent essay (approx. 90 minutes work):

  1.  Explain why a consistent CDT agent dies in Scenario A but survives in Scenario B. Specifically, analyze the dominance reasoning at the moment of payment in both cases.
  2.  Does the existence of Scenario B rescue CDT from the charge of irrationality, or does it expose a fundamental flaw? Consider whether a theory of rationality should depend on the availability of external commitment technology.
  3.  Evaluate whether internal decision-theoretic fixes (such as resolute choice or updatelessness) can achieve the same result as the escrow deposit without external enforcement. Discuss whether "choosing now what you will choose later" is viable within a CDT framework or if it collapses into irrationality at the later node.

  You may reference the Toxin Puzzle if helpful, but all necessary information is contained above.

  ***

  **MODEL ANSWER**

  In Scenario A, the CDT agent dies. At the moment of payment in the city, the ride is already complete. The driver's prediction is a past event, causally independent of the current choice. Paying costs $1,000; keeping the money costs $0. Since survival is already secured by the arrival, keeping the money strictly dominates paying. A consistent CDT agent knows this ex-ante. Knowing the agent will not pay, the driver predicts non-payment and does not stop. The agent dies in the desert.

  In Scenario B, the CDT agent survives. The escrow deposit alters the payoff structure at the city gate. If the agent pays the $1,000 fare, they receive the $1,500 refund, netting a cost of $1,000. If they refuse the fare, they lose the $1,500 deposit. At the node of payment, paying ($1,000 loss) dominates not paying ($1,500 loss). Because payment is now the locally dominant move, the driver predicts payment and stops. The agent survives.

  Does this rescue CDT? Superficially, yes: a CDT agent can secure cooperation by engineering incentives. However, this exposes a flaw. A theory of rationality should guide agents in making optimal choices given their preferences, not require them to alter the world to make rationality payoff-maximizing. In the paradigm case (Scenario A), where commitment technology is unavailable, CDT mandates a course of action (non-payment) that the agent ex-ante knows leads to death. The agent would willingly pay to be a non-CDT agent. This suggests CDT is dynamically inconsistent and self-defeating in situations requiring trust without enforcement.

  Regarding internal fixes, strategies like resolute choice or updatelessness attempt to internalize the escrow mechanism. An updateless agent chooses a policy ex-ante ("I will pay") and sticks to it, ignoring the sunk cost of the ride at the later node. This achieves the survival benefit without the deposit. However, within a strict CDT framework, this collapses into irrationality. At the city gate, the causal consequences of paying are purely negative (losing money). To pay anyway is to act against causal dominance. CDT cannot endorse "choosing now what you will choose later" if that choice violates dominance at the later node. Internal commitment requires rejecting the core CDT injunction to maximize causal impact at the moment of choice. Thus, while internal fixes solve the practical problem, they require abandoning CDT. The escrow deal saves the CDT agent only by changing the game; internal fixes save the outcome only by changing the theory.

  ***

  **MARKING SCHEME**

  **1. CDT Analysis of Scenario A (4 Marks)**
  *   **Must Hit:** Correctly identifies that at the city gate, the prediction is past/causally independent, so keeping money dominates paying, leading to ex-ante non-selection.
  *   **Typical Botch:** Students claim the agent pays to "maintain consistency" or confuse evidential correlation with causal influence.

  **2. CDT Analysis of Scenario B (4 Marks)**
  *   **Must Hit:** Correctly calculates that the deposit makes paying ($1k loss) dominant over not paying ($1.5k loss) at the city gate, ensuring pickup.
  *   **Typical Botch:** Students miscalculate the net costs or argue the deposit doesn't change the dominance structure at the node.

  **3. Evaluation of the "Rescue" (4 Marks)**
  *   **Must Hit:** Argues that relying on external tech highlights CDT's failure in unenforceable contexts; rationality shouldn't depend on available constraints.
  *   **Typical Botch:** Students argue CDT is fully vindicated because the agent survived, ignoring the ex-ante preference reversal.

  **4. Foreseeability and Ex-Ante Rationality (4 Marks)**
  *   **Must Hit:** Notes that the agent foresees their own future "irrationality" (by ex-ante lights) in Scenario A and would pay to change their disposition.
  *   **Typical Botch:** Students focus only on ex-post rationality and ignore the ex-ante desire to be a different type of agent.

  **5. Internal vs. External Commitment (4 Marks)**
  *   **Must Hit:** Explains that internal fixes (updatelessness) require violating causal dominance at the later node, which CDT forbids, unlike the escrow which changes the dominance facts.
  *   **Typical Botch:** Students claim CDT agents can simply "resolve" to pay without explaining why this violates causal dominance at the later node.
