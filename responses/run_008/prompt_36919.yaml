      *   **Tension H: (5) Long-Run vs. (1) Ideal Rationality.**
          *   (1) claims EU is for *ideal rationality*.
          *   (5) claims EU is justified by *empirical convergence*.
          *   *Problem:* Ideal rationality usually applies to one-off cases (single-shot). (5) justifies it via repeated cases.
