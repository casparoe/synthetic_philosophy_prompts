answer: |-
  The phenomenon you describe is central to the philosophy of science, biology, and social theory. There is no single word that perfectly captures every nuance across all three domains (biology, physics/geometry, economics), but there is a precise vocabulary that maps onto your description.

  The most established keyword for the general phenomenon is **Naturalized Teleology**. However, depending on the specific domain and the ontological commitment you wish to signal, three more specific terms carve the landscape better: **Teleonomy**, **Invisible Hand Explanations**, and **Equilibrium Explanations**.

  Here is the breakdown of the literature, the terms, and the ontological debate regarding the "unowned rationale."

  ### 1. The Primary Keyword: Teleonomy
  If you are looking for the biological standard, the term is **Teleonomy**.
  *   **Origin:** Coined by Colin Pittendrigh (1958) and popularized by Ernst Mayr (1974).
  *   **Definition:** It distinguishes "purposeful" behavior or structures in living systems from cosmic or divine teleology. It asserts that a system can be goal-directed (end-directed) without a conscious goal-representing mind, provided the "goal-directedness" is encoded in a genetic or structural program shaped by evolution.
  *   **Fit:** It fits your moth example perfectly. It validates the explanation ("to jam sonar") as genuine without positing a moth-psychology or a Designer.
  *   **Limitation:** It is heavily biologized. It implies a history of selection acting on a "program." It fits the honeycomb example less well, as the hexagon shape is often a result of physical surface tension and packing constraints (physics) rather than a genetic program selected for hexagonality specifically.

  ### 2. The Social/Economic Keyword: Invisible Hand Explanations
  For your economics example, the specific literature uses **Invisible Hand Explanations**.
  *   **Literature:** Adam Smith (origin), Robert Nozick (*Anarchy, State, and Utopia*), Edna Ullmann-Margalit (*The Invisible Hand and the Cunning of Reason*).
  *   **Definition:** An explanation where an aggregate outcome (Y) is produced by the actions of individuals, none of whom intended Y, and the existence of Y explains the stability or persistence of the system.
  *   **Fit:** Perfect for the price example. Nozick explicitly argues that these are not metaphors but rigorous explanatory patterns where the "unowned rationale" (information pooling) sustains the practice.
  *   **Limitation:** Specific to social aggregation. It doesn't help with the honeycomb or the moth.

  ### 3. The Structural/General Keyword: Equilibrium Explanations
  For the honeycomb (physics/optimization) and potentially the others, the philosopher **Elliott Sober** offers the term **Equilibrium Explanation**.
  *   **Literature:** Elliott Sober, *Reconstructing the Past* (1983) and *The Nature of Selection*.
  *   **Definition:** An explanation that cites the stability of a state rather than its specific causal history. X is the way it is because, given the constraints of the system, X is the only (or most) stable state. If the system were perturbed, it would return to X.
  *   **Fit:** This captures the "reason-giving" force without requiring a detailed history. The honeycomb is hexagonal not necessarily because bees *selected* hexagons over squares historically, but because hexagons are the equilibrium state of wax packing under pressure.
  *   **Advantage:** It treats the "rationale" (efficiency/stability) as a real constraint on the system, akin to a law of nature, rather than just a historical accident.

  ### 4. The Ontological Status: Is the Rationale Real?
  You asked whether the standard view is that these are shorthands for history, or if the rationale itself is real. This is the **Etiological vs. Systemic** debate in the philosophy of function.

  **View A: The Etiological Account (History is Truth-Maker)**
  *   **Proponents:** Larry Wright (1973), Ruth Millikan (1984), Karen Neander (1991).
  *   **Claim:** The statement "The heart beats to pump blood" is only true if there is a specific **history of selection** where ancestors who pumped blood survived.
  *   **Implication:** The "unowned rationale" is not real in the present; it is a ghost of the past. If the history didn't happen, the explanation is false, even if the outcome is beneficial now.
  *   **Verdict:** This view treats your explanations as **shorthand for selection histories**.

  **View B: The Systemic/Contribution Account (Current Role is Truth-Maker)**
  *   **Proponents:** Robert Cummins (1975), John Bigelow & Robert Pargetter (1987).
  *   **Claim:** A function is defined by the current causal contribution of a trait to the capacity of a containing system.
  *   **Implication:** The "rationale" is real if the system *actually depends* on that outcome now, regardless of history.
  *   **Verdict:** This allows the "unowned rationale" to be **ontologically real** as a systemic constraint.

  **View C: Optimality Realism (The "Pull" of the Future)**
  *   **Proponents:** Some evolutionary modelers; Aristotelian revivalists (e.g., Mark Bedau on "Goal-Directedness").
  *   **Claim:** In optimality models, the mathematical optimum exerts a causal "pull." The explanation is not just history; it is that the system is organized such that deviations from Y are penalized.
  *   **Verdict:** This treats the rationale as a **structural reality**. The "reason" exists in the topology of the fitness landscape or the economic market structure.

  ### 5. Boundary Cases and a Coined Term
  You asked for boundary testing regarding forgotten social practices and artifacts.

  *   **Forgotten Social Practices:** (e.g., knocking on wood).
      *   Under **Etiological** views: If the original protective function is gone and no one believes it, it has no function. It is a "survival."
      *   Under **Systemic/Invisible Hand** views: If the practice currently serves to reduce group anxiety (even if unnoticed), it retains the explanatory status.
  *   **Artifacts:** (e.g., a chair).
      *   These fall **outside** your definition by degree, not kind. Artifacts have a *reasoner* (the designer). However, if the designer is dead and the *use* evolves beyond the design (e.g., using a chair to prop a door), it re-enters your category of "unowned rationale."

  **If you require a coined term:**
  If "Teleonomy" feels too biological and "Equilibrium" too static, the precise philosophical coinage for "explanatory rationale without a reasoner" is **Anagentive Finality**.
  *   **Definition:** A causal explanation where the end-state (final cause) determines the existence of the antecedent condition, absent any representing agent.
  *   **Boundary:** It extends to any system with negative feedback or selection pressure (biology, markets, evolution, physics). It excludes artifacts *while the designer's intent is causally active*, but includes them once the system operates independently of that intent.

  ### Summary Recommendation
  1.  **For Literature Search:** Use **"Naturalized Teleology"** as the broad umbrella. Use **"Teleonomy"** for biology, **"Invisible Hand Explanations"** for economics, and **"Equilibrium Explanations"** for structural/optimization cases.
  2.  **For the "Reason-Giving" Aspect:** Cite **Elliott Sober**. He argues that equilibrium explanations *do* genuine explanatory work distinct from causal history. They explain why the system *must* be this way, given the constraints.
  3.  **For the Ontology:** The standard view in philosophy of biology (Millikan/Neander) is **Etiological** (it's shorthand for history). However, the view in philosophy of economics (Nozick) and complex systems theory is often **Realist about the Rationale** (the systemic constraint is the cause).

  **Key Texts to Locate:**
  *   Ernst Mayr, *Toward a New Philosophy of Biology* (on Teleonomy).
  *   Larry Wright, "Functions" (The Philosophical Review, 1973).
  *   Robert Nozick, *Anarchy, State, and Utopia* (Chapter on Invisible Hand Explanations).
  *   Elliott Sober, *The Nature of Selection* (Chapter on Equilibrium Explanation).
  *   Ruth Millikan, *Language, Thought, and Other Biological Categories* (Proper Functions).

  The phenomenon is well-trodden, but your intuition is correct: the tension lies in whether we treat the "rationale" as a historical ghost (Etiological) or a present systemic reality (Equilibrium/Systemic).
