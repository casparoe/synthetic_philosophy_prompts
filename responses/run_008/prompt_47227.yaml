answer: |-
  You have correctly identified the Rietdijk–Putnam argument, and your intuition that it proves "too much too cheaply" is shared by many philosophers of physics. The argument is logically valid, but its soundness hinges entirely on the metaphysical interpretation of Special Relativity's kinematics.

  The defective step is **(1)**, but not for the reason you initially feared. Rejecting (1) does **not** commit you to a privileged frame. Instead, it requires you to reject the assumption that "determinacy" is a property that extends across spacelike intervals.

  Here is the diagnosis of the argument, the specific philosophical move required to block it, and the cost of making that move.

  ### 1. The Defective Step: Premise (1)
  > *(1) If an event is determinate for one inertial observer, it is determinate simpliciter.*

  This premise looks innocent because it appeals to the democratic spirit of Relativity: no observer is special. However, it smuggles in a hidden assumption about the **topology of determinacy**.

  It assumes that the relation "is determinate relative to observer $O$" is transitive and frame-independent in a way that maps onto **simultaneity hyperplanes**. But Special Relativity gives us no physical justification for treating a simultaneity slice as an ontological boundary. A simultaneity slice is a coordinate convention; it is not a causal structure.

  **The Stein Objection:**
  In 1968 (and clarified in 1991), philosopher Howard Stein provided the definitive rebuttal. He argued that if we want to define "determinate" in a way that is consistent with the causal structure of Minkowski spacetime, we should not define it via simultaneity. Instead, we should define it via **causal connectibility**.

  *   **Stein's Definition:** An event $E$ is determinate *with respect to* an event $P$ if and only if $E$ lies in the past light cone of $P$.
  *   **The Consequence:** Under this definition, the Andromedan events on the jogger's "now" slice are **spacelike separated** from you. They are not in your past light cone. Therefore, they are **not determinate with respect to you**, even if they are determinate with respect to the jogger.

  By rejecting (1), you are not saying the jogger is "wrong." You are saying that "determinate" is a **relation** between events, not a global property of the universe. Event $A$ can be determinate relative to Observer $X$ without being determinate relative to Observer $Y$, provided $A$ and $Y$ are spacelike separated. This preserves Lorentz invariance perfectly because the light-cone structure is invariant, whereas simultaneity hyperplanes are not.

  ### 2. Why It Looked Innocent
  Premise (1) relies on a pre-relativistic intuition about time. In Newtonian physics, simultaneity is absolute, so the set of "present" events is the same for everyone. If the present is real, the whole slice is real.

  In Special Relativity, the "now" slice is observer-dependent. Premise (1) tries to salvage the Newtonian intuition by saying, "Okay, slices differ, but *reality* shouldn't." It forces you to union all the slices together. Since the union of all possible "now" slices for an observer at a point covers the entire spacetime manifold, you get the Block Universe.

  The trick is that it treats **epistemic accessibility** (what I can calculate is "now" for someone else) as equivalent to **ontological fixity** (what exists independently of me). Just because the jogger *can* assign a time coordinate to Andromeda doesn't mean that time coordinate has ontological weight for you.

  ### 3. Addressing the "Privileged Frame" Worry
  You wrote: *"Rejecting (1) seems to mean that when two co-located observers disagree about which distant events are present, one of them is simply wrong... which sounds like a privileged frame."*

  This is the crucial misunderstanding to clear up. If you reject (1) along Steinian lines:
  *   **You** say: "Andromeda's future is indeterminate relative to me."
  *   **The Jogger** says: "Andromeda's future (my 'now') is determinate relative to me."
  *   **The Resolution:** Neither of you is wrong. You are making statements about different **relations**. Determinacy is not a monadic property (like "being red"); it is a dyadic relation (like "being to the left of").
      *   "Event $E$ is determinate relative to Observer $A$" is true.
      *   "Event $E$ is determinate relative to Observer $B$" is false.
      *   There is no contradiction here, just as "Paris is to the left of London" (from one perspective) and "Paris is to the right of London" (from another) can both be true without a privileged perspective.

  You do not need a privileged frame to say that spacelike separated events do not have a fixed determinacy relation. You only need the invariant light-cone structure, which SR already provides.

  ### 4. The Quantum Mechanics Tension
  Your worry about quantum indeterminism is astute. The Rietdijk–Putnam argument claims to refute QM indeterminism a priori. If you accept the Block Universe, how do you handle QM?

  There are two ways to live with the Block Universe + QM:

  **Option A: The Block Contains Probabilities (Compatibilism)**
  The Block Universe does not imply *causal determinism*; it implies *ontological eternalism*.
  *   **Causal Determinism:** Prior states *necessitate* future states. (QM rejects this).
  *   **Ontological Eternalism:** Past, present, and future events all equally *exist* in the manifold. (SR suggests this).
  *   **Resolution:** A quantum measurement outcome can be probabilistic in its *causal genesis* but still be a fixed point in the *spacetime geometry*. The "probability" describes the measure of branches (Many Worlds) or the likelihood of a world-line having that property (Single History). In this view, the future is "settled" in the sense that it exists, but not "settled" in the sense that it was forced by the past. This preserves the math of QM but changes the metaphysics of time.

  **Option B: Reject SR as Fundamental (Preferred Foliation)**
  Some interpretations of QM (e.g., Bohmian Mechanics, objective collapse theories like GRW) genuinely require a preferred notion of simultaneity to make sense of non-locality or collapse.
  *   If you believe QM indeterminism is fundamental and the future is *ontologically open* (not just unknown), then the Block Universe is false.
  *   **Cost:** You must posit that Special Relativity is only empirically adequate, not fundamentally true. There is a "true" simultaneity, but it is hidden from us by the dynamics (Lorentz invariance is a symmetry of the laws, but not the ontology). This is a viable physical position (defended by Tim Maudlin and others), but it is a heavy cost: you are modifying the spacetime structure to save the metaphysics of time.

  ### 5. Summary of Costs
  If you reject Premise (1) to save indeterminism:
  *   **What you gain:** You avoid the conclusion that the future is ontologically fixed by kinematics alone. You allow for a "relativistic becoming" where the future is not real relative to the present.
  *   **What you lose:** You lose the intuition that "reality" is a global, transitive relation. You must accept that "what exists" is relative to an event's position in spacetime (specifically, its past light cone). This is sometimes called "Fragmentalism" or "Relativistic Presentism."
  *   **Does it save QM?** It saves the *idea* of an open future relative to an observer, but it makes the metaphysics of QM more complex (you can't just point to a global wavefunction on a slice).

  ### Recommendation
  Your friend's argument is a classic "proof" of Eternalism, but it is not a knockdown refutation of indeterminism. It relies on equating **coordinate simultaneity** with **ontological reality**.

  You should reject **(1)**.
  *   **Why:** Because "determinacy" should track causal influence (light cones), not coordinate conventions (simultaneity slices).
  *   **Cost:** You must abandon the idea that there is a single, global "Now" that divides reality from unreality.
  *   **Benefit:** You preserve the possibility that the future is not fixed relative to the present, keeping room for quantum indeterminacy without needing to posit a privileged frame. You keep Special Relativity exactly as it is, but you refuse to let its kinematics dictate your ontology of time.

  The argument fails because it assumes that because we *can* calculate a time for Andromeda, that time *exists* in the same way our local present exists. In a relativistic universe, existence is local to the light cone.
