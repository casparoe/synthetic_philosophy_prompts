answer: |-
  1. Sketch

  Elias argues from **Status and Dignity**. For him, marriage is a social ontology—it makes a private bond publicly real. The state's involvement isn't just about rights; it's about recognition. Without the state's witness, the commitment lacks civic weight. His pain (the estate fight) proves why the legal shield matters, but his conviction is that the shield protects something sacred, not just material.

  Delphine argues from **Function and Distribution**. She sees marriage as a regulatory technology that misallocates resources. By privileging the conjugal dyad, the state ignores other vital care networks (friends, siblings, polycules). Her critique is utilitarian but ethical: why should love determine tax liability or hospital access?

  **The Hinge:** The definition of the "Witness." Elias sees the witness (state/community) as validating the promise, making it "too big for two." Delphine sees the witness as a bouncer, excluding those who deserve care rights but lack the romantic label. The conflict turns on whether marriage creates dignity or merely distributes it.

  2. The scene

  The bottle was empty, or close enough that tilting it made a glugging sound neither of them wanted to acknowledge. Elias stared at the dark glass. Delphine was washing a spoon she'd already washed.

  "We should sleep," Elias said.

  "In a minute," Delphine said. She didn't turn around. "Tomorrow's going to be loud."

  "Tomorrow is a party. Tonight is the last quiet hour we get."

  Delphine dried the spoon. Put it away. Turned around, leaning against the counter. "Are you happy about it? Sarah and Jen?"

  "They're in love. They want the thing."

  "They want the thing," Delphine repeated. "Or they want the tax bracket. The immigration shield. The default inheritance."

  "Don't start."

  "I'm not starting. I'm asking what we're celebrating. Because if it's just the rights bundle, we could hand those out at the DMV. No need for the flowers. No need for the vows."

  Elias rubbed his face. The skin felt loose, tired. "It's not just the rights. You know that. You teach family law, Delphine. You know the difference between a contract and a status."

  "Do I? Because looking at the case law, it's mostly a bundle of rights wrapped in a veil of sentiment. And the sentiment is expensive. It costs everyone outside the veil."

  "It costs you nothing."

  "It costs me my friends." Delphine pushed off the counter. "It costs me the ability to say, 'This is my person, I care for them, give us the same stability you give the couple down the street,' without having to prove we're sleeping together. The campaign for same-sex marriage taught the state that gay people are just like everyone else. And it was right. We're just as capable of forgetting our friends."

  Elias flinched. Just a little. A tightening around the eyes. "That's cruel."

  "It's observation. You fought for entry into the institution. I'm looking at the institution and asking why the walls are so high."

  "The walls keep people safe." Elias tapped the table. "When Mark died, I had his name on the deed. I had the marriage certificate. And I *still* had to fight his cousin over the estate. He had a piece of paper saying he was blood. I had a piece of paper saying I was family. Imagine if I didn't have mine. Imagine if I was just... a friend. A caretaking unit." He spat the phrase like it was cold meat. "I would be nothing. The state would see nothing."

  "So the state should see something else," Delphine said softly. "Attach the rights to the care. If you're signing the hospital forms, if you're paying the mortgage, if you're raising the kid. Let the state reward the work, not the romance."

  "Romance," Elias said. "Is that what you think this is? Romance?"

  "I think it's a specific kind of intimacy the state has decided is the only kind that matters."

  "It's not the state that decides it matters. It's us. It's the promise." Elias leaned forward. "Mark used to say marriage is a promise too big for two people. Which is why there has to be a witness."

  Delphine smiled, but it didn't reach her eyes. "I know the line, Elias. I've read your speeches. But who's the witness? Is it the guests? The priest? Or is it the clerk at the county office who stamps the form?"

  "It's the community. The state stands in for the community."

  "The state is a clerk," Delphine said. "And the community is drunk. Tomorrow, everyone will watch Sarah and Jen promise to put each other first above everyone else. Above their aging parents. Above their friends. And we'll clap. Because the witness says it's good."

  "The witness says it's *real*."

  "The witness says it's *legal*." Delphine walked to the table, pulled out a chair, sat opposite him. "Look. I know what you did. I know what you lost. My career exists because you marched. I'm not ungrateful. But you won the fight and now you're guarding the trophy like it's holy water. It's a legal instrument. It distributes goods. And it distributes them badly."

  "And if you dismantle it?" Elias asked. "If you get your wish. Caretaking units. Declarations. What happens to the promise? The thing that's too big for two?"

  "It gets smaller. Maybe that's honest."

  "It gets weaker." Elias shook his head. "You want to flatten it. Make it about who changes the IV bag. But marriage isn't about who changes the bag. It's about who promises to be there when the bag needs changing before anyone knows it's empty. It's a status. It changes who you are in the eyes of the world. You can't legislate that into a generic care contract."

  "Why not? Why is the romantic bond the only one worthy of status?"

  "Because it's the one people kill for. Die for. Break themselves for."

  "People do that for their kids. For their sisters. For their causes." Delphine rested her chin on her hand. "You're conflating the intensity of the feeling with the utility of the structure. You want the state to recognize your dignity. I want the state to stop withholding rights from people who don't fit your shape."

  "My shape?"

  "The couple. The dyad. The monogamous unit." Delphine sighed. "I'm tired, Elias. I didn't mean to sound like I'm spitting on your grave. Or Mark's."

  "You sound like you think the fight was a mistake."

  "I think the fight was necessary, but the victory was incomplete. We got the keys to the house, but the house is built on a foundation that excludes half the people we love. I don't want to burn the house down. I just want to knock out some walls."

  Elias looked at the empty bottle. "Mark said the witness makes the promise big. Because two people can break a promise quietly. But if the world is watching... if the state is watching... you have to break it loudly. There's a cost to breaking it."

  "The cost is high," Delphine agreed. "But who pays it? The people who need the protection most aren't the ones getting married, Elias. They're the ones who can't. Or won't. And you're telling them their care doesn't count unless it looks like yours."

  "I'm telling them that nothing counts unless it's recognized." Elias stood up. His knees popped. "You talk about distribution. Rights. Bundles. You sound like a lawyer. I'm talking about being seen. When I buried him, the state knew I was the widower. Not the friend. Not the partner. The widower. That word... it carried the weight. It kept the cousin away. Eventually."

  "Eventually," Delphine said. "But you had to fight."

  "I had the ground to stand on."

  "I want to build a bigger floor."

  Elias walked to the sink. Picked up a glass. Put it down. "You can't build a floor out of air, Delphine. You need pillars. Marriage is a pillar. It's old. It's flawed. But it holds the roof up."

  "It holds the roof up for some of us."

  "Better some than none."

  "That's not a moral argument. That's triage."

  "It's survival." Elias turned to her. "You're young. You have time to theorize the ideal. I lived the real. And the real is that without the pillar, the roof falls on your head. I won't tell Sarah and Jen to wait for your new floor. I'll tell them to stand under the pillar."

  Delphine stood up too. They were close now, in the dim kitchen light. "I'm not telling them to wait. I'm telling them to know what they're signing. It's not just love. It's a merger. It's the state saying, 'We value this bond above that one.' And I hate that the state gets to say that."

  "The state says it because we made them," Elias said. "We made them say it."

  "And now we're stuck with what they heard." Delphine reached out, touched his arm. Just for a second. "Go to bed, Elias. Tomorrow you have to wear a suit."

  "So do you."

  "Mine fits better."

  Elias snorted. A dry, tired sound. "Goodnight, Delphine."

  "Night."

  She didn't move until he shuffled out of the kitchen. She stayed there, looking at the empty bottle, wondering if the witness was watching her now, or if she was just talking to the dark.

  3. Where it lands

  The argument ends in exhaustion, not resolution. Elias concedes internally that the system is imperfect (the cousin fight), but holds that the symbolic weight of "widower" was the only thing that saved him. He views Delphine's idealism as a luxury of safety he helped build. Delphine concedes that the "pillar" provides real protection, even if the architecture is exclusionary. She acknowledges her debt to him without retracting her critique. They remain allies, but the generational fracture is visible: he protects the institution that saved him; she critiques the institution that limits her.

  4. Craft notes

  I focused on rhythm over rhetoric. Philosophical points are delivered through interruption and physical action (washing the spoon, the empty bottle) to prevent "debate team" stiffness. The "witness" motif anchors the abstract legal theory in personal grief. I deliberately flattened the legal theory—Delphine gestures at "caretaking units" without defining the statutory mechanism, keeping it character-driven. The generational tension is subtextual until the end; Delphine's touch on his arm signals affection despite the disagreement. The unsaid element is the fear both share: that the other is right, and admitting it would invalidate their life's work.
