answer: |-
  1. The unifying property across eating figs, finishing proofs, and bathing is not a specific sensation but the functional state of consciously taking satisfaction in those experiences as they occur. This attitudinal stance constitutes the pleasure itself, regardless of the disparate sensory inputs involved.

  2. Once pleasure is identified as this specific mode of consciousness rather than a qualitative feel, we can sum episodes by measuring the intensity and duration of the subject's favorable orientation toward their experience. The heterogeneity of the objects does not prevent aggregation because the metric applies uniformly to the attitude itself.

  3. The value-bearer is the occurrent conscious state of enjoying, which is intrinsically good simply in virtue of being experienced, not because it satisfies a prior condition. This secures the hedonist's claim that pleasure is the good without reducing value to desire satisfaction.

  4. Unlike desire, which is fundamentally forward-looking and contingent on future outcomes, attitudinal pleasure is a contemporaneous reaction to what is currently happening or being felt. You can be pleased by something you never desired, and desire something without being pleased by it, proving the concepts are distinct.

  5. The heterogeneity problem dissolves because it mistakenly demands a shared sensory quality where only a shared functional role is required for well-being. By locating the good in the subject's active engagement rather than passive reception of a uniform feel, hedonism retains its monistic structure without phenomenological implausibility.
