answer: |-
  Good morning. Welcome to what I hope will be a genuinely productive three days.

  Looking around this room, I see a gathering that is, frankly, rare. We have constitutional lawyers who draft the amendments and argue before the benches. We have quantitative political scientists who construct the datasets and democracy indices that end up in footnotes and headlines alike. And we have advocacy staff who translate those findings into briefings for donors and press releases for the public.

  Usually, these three groups operate in sequence, or in parallel, but rarely in the same room. The scholars produce the measure, the lawyers argue the case, and the advocates sound the alarm. But when we talk about "democratic backsliding," that linear division of labor breaks down. The definition of the problem determines the solution. The measurement creates the reality. And the label itself carries a verdict.

  So, my job this morning is not to tell you what backsliding is. My job is to ask why we cannot agree on what it is, and to suggest that this disagreement is not a bug in our system, but the central feature we are here to study.

  For the next three days, I want us to chew on a specific tension. It lies between two competing accounts of what backsliding actually means.

  On the first account, backsliding is defined by **mechanism**. It is a repertoire of moves. We know the list: court-packing, the capture of media regulators, the rewriting of electoral laws, the use of supermajorities to rewrite constitutions. On this view, backsliding is about the hollowing out of the competitive arena, even if the outward forms of democracy remain intact. It is about the *rules of the game* being rigged, regardless of the score.

  On the second account, backsliding is defined by **outcome**. It asks a simpler, starker question: Can power change hands? Are elections genuinely competitive? If the opposition can still win, and if they do win, has democracy really backslid?

  These two accounts often travel together. But they do not always align. And when they come apart, they force us to reveal which account we are actually holding.

  Consider a hypothetical case, one that might mirror discussions we will have later in the week. Imagine a government that has systematically captured the referees. It has packed the courts, skewed the media landscape, and changed the campaign finance rules to favor the incumbent. By the mechanism account, this is a textbook case of backsliding. The arena is compromised.

  But then, imagine that government loses the election anyway. The opposition takes power. The transition is peaceful. By the outcome account, the system worked. Power changed hands.

  So, is this backsliding?

  If you are a lawyer focused on constitutional integrity, you might say yes. The damage to the institutions remains, even if the incumbent lost. The virus is still in the host.
  If you are a quant focused on competitiveness, you might say no. The key variable—alternation in power—held true. To label this backsliding might be to move the goalposts.
  And if you are an advocate trying to brief a donor, you are in a bind. Do you warn that the institutions are still captured? Or do you celebrate the resilience of the electorate?

  This divergence is not just theoretical. It determines where we focus our energy. Do we fix the rules, or do we just watch the elections?

  This brings me to a second, perhaps more uncomfortable question: Who effectively decides these matters?

  Part of what makes "backsliding" such a difficult concept is that its application is not a matter of epistemology alone. It is a matter of authority.

  To the scholars in the room: You build the indices. You choose the indicators. You weight the variables. When you publish a score that drops a country from "Free" to "Partly Free," you are not merely describing a reality. You are creating a signal that triggers treaty procedures, freezes aid, or alters credit ratings. Your pen does work in the world.

  To the advocates in the room: You need words that survive contact with a press release. You need clarity to mobilize action. But in seeking that clarity, you inevitably sharpen the concept, sometimes beyond what the evidence can bear. This is not a corruption of the science; it is a fact of the politics. You hold part of the pen, too.

  We cannot pretend that concept-choice is neutral. But we also cannot surrender to the idea that it is merely political. If we treat every definition as a power grab, we lose the ability to analyze anything. If we treat every definition as a neutral fact, we ignore the power we wield. We need to find a way to speak honestly about the stakes of our definitions without abandoning the rigor required to make them stick.

  Finally, we have to confront the word itself. "Backsliding."

  It suggests sliding *back* from something. It presupposes a starting point. It implies there was a moment of stability, a democratic peak, a constitutional settlement from which we are now retreating.

  But for many of the states we will discuss over the next three days, that baseline is contested. Was the starting point a genuine democratic consolidation? Or was it a flawed settlement that masked deeper tensions? Was accession to a supranational body a mark of democratic maturity, or a technocratic constraint that fueled populist backlash?

  If the baseline was itself unstable, or illiberal, or unfinished, can "backsliding" be a neutral analytical concept at all? Or is it essentially contested?

  I am not asking you to resolve this by lunch. I am asking you to let that question hang over the panels.

  Later today, we will turn to specific cases. You will hear arguments about Hungary, Poland, Turkey, and the United States. I ask that you resist the urge to treat these countries as settled illustrations of the concept. Their status is precisely what is in dispute. If we use them as proof of our definitions, we beg the question. Instead, let the friction between the concept and the case do the work.

  We are here because the old labels are fraying. We are here because the tools we used to measure democracy in the 1990s are straining under the realities of the 2020s.

  So, let us not seek a consensus definition by the end of this workshop. Consensus might mean we have smoothed over the very tensions that matter. Instead, let us map the disagreement. Let us understand why the lawyer sees a crisis where the quant sees continuity. Let us understand why the advocate needs a verdict where the scholar sees a spectrum.

  The concept is the problem. Let's make it our project.

  Thank you, and I look forward to the conversation.
