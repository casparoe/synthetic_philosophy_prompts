prompt: |-
  I'm in a post-Keynesian economics reading group that's been working through Keynes's 1937 piece in the Quarterly Journal of Economics, the one where he replies to his critics and ends up explaining why he thinks investment is so unstable. The passage everyone in the group treats as scripture: he lists the kind of questions an investor actually faces — the prospect of a European war, the price of copper twenty years hence, the rate of interest twenty years hence, the obsolescence of a new plant — and says, roughly, that about these matters there is no scientific basis for forming any calculable probability whatever, and that on these questions we simply do not know. And then the part the group really loves: he goes on that the necessity for action and decision compels practical men to overlook this awkward fact, so they end up behaving exactly as if they had a good Benthamite calculation of the pros and cons behind them, when the honest answer has been pulled out of the air.

  In the group this has become a slogan — "we simply do not know" — deployed to end arguments, most recently against a classmate of mine who is Bayesian-inclined. He said, reasonably I thought, that even without frequency data a person could put a prior on where interest rates will be in twenty years and update as evidence comes in, and he was told, in effect, that Keynes had shown that doing this is unscientific, and that was that. My instinct is that the slogan is doing a lot more work than the passage actually licenses, but when I tried to say why out loud it came out as hand-waving. So this is what I want from you: a menu of the distinct precise claims "we simply do not know" could be making in that passage, laid out roughly from weakest to strongest. Maybe something like: the boring reading where it just means no actuarial/frequency basis is available (surely true but nobody disputes it); a middle reading turning on the fact that Keynes had this earlier book, the Treatise on Probability, where as I understand it probabilities don't have to be numerical and there's some extra notion like the "weight" of an argument, so maybe the 1937 line is a claim inside his own framework about non-numerical probabilities (I honestly don't know if that's relevant, tell me); and the radical reading, which is how my reading group uses it, that no assignment at all — not even a subjective degree of belief — is even intelligible for questions like these, so the Bayesian isn't just wrong, he's doing something meaningless.

  For each reading, I'd want a verdict: is it plausible on its own, is it plausibly what the 1937 Keynes is committed to, and — this is the part I actually need — does that reading support using the line to shut down my classmate, or does it only support something much weaker, like "your prior is a guess and you should hold it loosely"? If some reading does license the shut-down move, say so honestly; if the strong reading only works combined with extra premises nobody in the group has stated out loud, I want that pointed out, since I suspect it's the unstated premises doing all the work. Something I can actually bring back to the group and defend without sounding like I'm just being contrarian.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Post-Keynesian economics reading group discussing Keynes's 1937 QJE article ("The General Theory of Employment").
      *   **Key Passage:** Keynes's discussion of fundamental uncertainty (prospect of European war, price of copper, rate of interest, obsolescence). "There is no scientific basis on which to form any calculable probability whatever. We simply do not know."
      *   **Conflict:** The group uses "we simply do not know" as a slogan to shut down a Bayesian classmate who argues for subjective priors.
      *   **User's Instinct:** The slogan is doing too much work. The user wants a structured analysis of the possible interpretations of this claim.
      *   **Task:** Create a "menu" of distinct precise claims (weak to strong), evaluate their plausibility (textual/philosophical), and determine if they justify shutting down the Bayesian.
      *   **Specific Requirements:** Address the *Treatise on Probability* connection, distinguish between ontological and epistemological uncertainty, and identify hidden premises.

  2.  **Deconstruct the Key Passage & Context:**
      *   **Text:** "The sense in which I am using the term [uncertainty] is... that the prospect of a European war is uncertain, or the price of copper and the rate of interest twenty years hence... About these matters there is no scientific basis on which to form any calculable probability whatever. We simply do not know."
      *   **Context:** 1937 QJE article is a summary/defense of *The General Theory* (1936). It focuses on the role of expectations in investment.
      *   **Background:** Keynes's *A Treatise on Probability* (1921). Key concepts: logical relations between propositions, non-numerical probabilities, "weight" of evidence.

  3.  **Develop the "Menu" of Interpretations:**

      *   *Level 1: The Methodological/Empirical Claim (Weakest).*
          *   Claim: No *frequency* data exists for unique events.
          *   Implication: You can't use actuarial tables.
          *   Bayesian Rebuttal: Bayesians know this; they use subjective priors, not frequencies.
          *   Verdict: True, but doesn't shut down the Bayesian.

      *   *Level 2: The *Treatise* Claim (Intermediate).*
          *   Claim: Probabilities are logical relations. If evidence is insufficient, the relation is non-numerical or undefined. The "weight" of evidence is too low.
          *   Implication: Assigning a number is logically invalid, not just empirically hard.
          *   Bayesian Rebuttal: Subjective Bayesians (Ramsey/Savage) reject the logical theory of probability. They define probability as degree of belief.
          *   Verdict: Plausible for 1937 Keynes, but requires accepting Keynes's 1921 theory over Ramsey's critique. Doesn't fully shut down the Bayesian unless the Bayesian accepts Keynes's definition of probability.

      *   *Level 3: The Ontological/Structural Claim (Strong).*
          *   Claim: The future is *created* by decisions, not discovered. The economic system is non-ergodic.
          *   Implication: There is no "truth" to be approximated. The distribution doesn't exist.
          *   Bayesian Rebuttal: Bayesians model uncertainty about parameters, but if the structure itself changes endogenously, the model breaks.
          *   Verdict: Stronger Post-Keynesian reading (Davidson, Minsky). Requires extra premises about non-ergodicity.

      *   *Level 4: The Psychological/Pragmatic Claim (The "Animal Spirits" angle).*
          *   Claim: Even if you *could* assign a number, human psychology doesn't work that way. We rely on convention.
          *   Implication: Bayesian updating is descriptively false.
          *   Verdict: Descriptive, not normative. Doesn't prove the Bayesian *can't*, just that they *don't*.

      *   *Level 5: The Radical Epistemological Claim (Strongest/Group's Usage).*
          *   Claim: It is *meaningless* to assign a degree of belief. It is irrational to act *as if* you know.
          *   Implication: Bayesianism is nonsense in this domain.
          *   Verdict: This is the "shut down" move. But is it textually supported? Keynes says practical men *do* behave as if they know. He critiques the *consequences* (instability), not necessarily the *logical possibility* of the belief.

  4.  **Evaluate the "Shut Down" Move:**
      *   Does Keynes say Bayesian priors are impossible? Or does he say they lack *scientific basis*?
      *   Keynes distinguishes between "risk" (calculable) and "uncertainty" (incalculable).
      *   The Bayesian says "I have a subjective degree of belief." Keynes says "That belief has no weight."
      *   *Crucial Point:* The group is conflating "no scientific basis" with "no subjective basis." Keynes admits people *do* form expectations (via convention), he just says those expectations aren't grounded in knowledge.
      *   *Hidden Premise:* To shut down the Bayesian, you need the premise that *only* scientifically grounded probabilities are rational/valid. Keynes might agree, but the Bayesian disagrees by definition.

  5.  **Drafting the Response:**
      *   **Tone:** Academic, precise, sympathetic to the user's skepticism, respectful of the reading group's tradition but critical of the dogmatism.
      *   **Structure:**
          1.  Introduction acknowledging the user's insight (the slogan is overworked).
          2.  The Menu (Levels 1-4/5).
          3.  For each level: Definition, Textual Plausibility, Verdict on the Bayesian Argument.
          4.  The *Treatise on Probability* connection (essential context).
          5.  The "Hidden Premises" analysis (what's actually doing the work).
          6.  Conclusion/Script for the group.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between the 1921 *Treatise* (logical probability) and the 1936/37 General Theory (macroeconomic uncertainty). Keynes evolved, but the 1937 piece explicitly links back to the *Treatise*.
      *   *Nuance:* The Bayesian classmate is likely a *subjective* Bayesian (Ramsey/de Finetti). Keynes was friends with Ramsey and knew this critique. The 1937 piece is arguably a doubling down on the *Treatise* view against the Ramsey view.
      *   *Key Distinction:* "We do not know" vs. "We cannot assign a number." Keynes says "no scientific basis... calculable probability." He doesn't explicitly say "you cannot feel a degree of belief." He says acting on it *as if* it's knowledge is the problem.
      *   *Non-Ergodicity:* This is Paul Davidson's interpretation. It's not explicitly in the 1937 text but is the standard Post-Keynesian elaboration. I should mention it as the "extra premise."

  7.  **Final Polish:** Check against the user's specific constraints.
      *   Menu from weak to strong? Yes.
      *   Verdict on plausibility? Yes.
      *   Verdict on shutting down the classmate? Yes.
      *   Identify hidden premises? Yes.
      *   Actionable advice for the group? Yes.

  8.  *(Final thought)*: Ensure I emphasize that Keynes's point is often about the *consequences* for investment (volatility), not just the metaphysics of probability. The "shut down" ignores the practical point Keynes is making about why investment fluctuates.

  9.  **Constructing the Output.** (Proceed to generate response based on these thoughts.)
answer: |-
  This is an excellent diagnostic of a common problem in heterodox economics circles: a powerful insight hardening into a dogma that stops inquiry rather than advancing it. Your instinct is correct. The slogan "we simply do not know" is being asked to carry metaphysical weight that the text does not necessarily support, specifically to defeat a subjective Bayesian framework that Keynes was actually aware of and arguably responding to.

  Keynes's 1937 QJE article ("The General Theory of Employment") is indeed the locus classicus for the distinction between *risk* (calculable) and *uncertainty* (incalculable). However, using it to declare subjective Bayesianism "meaningless" requires several interpretive leaps.

  Here is a menu of four distinct interpretations of the claim "there is no scientific basis on which to form any calculable probability whatever... We simply do not know," arranged from weakest to strongest.

  ### Level 1: The Empirical/Frequency Claim (The "No Data" Reading)
  *   **The Claim:** For unique, macro-historical events (like a war in 20 years or the price of copper in 2044), there is no frequency distribution of past occurrences from which to derive an objective probability.
  *   **Textual Plausibility:** **High.** This is the literal reading of "no scientific basis." Keynes is contrasting investment decisions with roulette or actuarial tables.
  *   **Relation to *Treatise on Probability*:** Consistent. In the *Treatise*, Keynes argues that probability is a logical relation between evidence and hypothesis. If the evidence is unique, the logical relation may not be numerically measurable.
  *   **Verdict on the Bayesian Classmate:** **Does not shut them down.**
      *   *Why:* Subjective Bayesians (Ramsey, de Finetti, Savage) explicitly agree with this. They argue that probability *isn't* about frequencies; it's about coherent degrees of belief. When your classmate says "I can put a prior on it," they are not claiming to have frequency data. They are claiming they can quantify their own ignorance. Level 1 Keynes says "you have no data," and Level 1 Bayesian says "I know, that's why I'm using a prior." They are talking past each other.

  ### Level 2: The Logical/Weight of Evidence Claim (The *Treatise* Reading)
  *   **The Claim:** Probability is not just a number; it requires "weight." Weight is the amount of relevant evidence relative to irrelevant evidence. For long-term investment, the evidence is so scant that the "weight" is near zero. Therefore, assigning a precise number (e.g., "5% chance") is logically misleading because it implies a precision the evidence cannot support.
  *   **Textual Plausibility:** **High.** This connects the 1937 article back to the 1921 *Treatise*. Keynes writes in 1937 that he used the term "uncertainty" in a specific sense where "the prospect of a European war is uncertain." In the *Treatise*, he argues that some probabilities are non-numerical.
  *   **Relation to *Treatise on Probability*:** **Central.** This is the core Keynesian technical objection to Bayesianism. Keynes views probability as *logical* (objective relation between propositions); Bayesians (following Ramsey's 1926 critique of Keynes) view probability as *psychological* (consistency in betting behavior).
  *   **Verdict on the Bayesian Classmate:** **Does not shut them down, but challenges their coherence.**
      *   *Why:* This reading says the Bayesian's number is *arbitrary*, not that it is *impossible*. It supports the critique: "Your prior is a guess and you should hold it loosely." It does not support the claim that forming a prior is unintelligible. It only works if the Bayesian accepts Keynes's definition of probability as a logical relation. If the Bayesian holds the Ramsey view (probability = degree of belief), Keynes's objection is a category error from their perspective. To use this to shut them down, you must first win the 1920s debate between Keynes and Ramsey.

  ### Level 3: The Non-Ergodic/Ontological Claim (The Post-Keynesian Reading)
  *   **The Claim:** The economic future is not just unknown; it is *unknowable* because it does not yet exist. The economic system is "non-ergodic." Statistical regularities from the past do not govern the future because human creativity and policy change the structure of the system itself. Therefore, there is no "true" probability distribution waiting to be approximated, even subjectively.
  *   **Textual Plausibility:** **Medium.** This is implicit in the 1937 text (the future depends on decisions made today) but is more explicitly developed by later Post-Keynesians like Paul Davidson and Hyman Minsky. Keynes says the "existing state of expectations" depends on a "mass of conventional judgment."
  *   **Relation to *Treatise on Probability*:** **Compatible but distinct.** This moves from epistemology (what we can know) to ontology (what exists).
  *   **Verdict on the Bayesian Classmate:** **Stronger, but requires extra premises.**
      *   *Why:* If the future is created by decisions, a probability distribution over that future is a category mistake. However, a Bayesian can counter that they are modeling their *uncertainty about the creative process*, not the process itself. To shut down the classmate here, your group needs to explicitly assert the **Non-Ergodicity Axiom**. Without stating that premise, the slogan "we do not know" sounds like mere ignorance rather than structural indeterminacy.

  ### Level 4: The Radical Epistemological Claim (The Group's Slogan)
  *   **The Claim:** It is irrational to assign *any* numerical value to these propositions. To do so is not just inaccurate; it is a form of self-deception ("pretending" to have a Benthamite calculation). The only rational response is to acknowledge the void.
  *   **Textual Plausibility:** **Low/Mixed.** Keynes says practical men *cannot* help but act as if they have a calculation ("the necessity for action and decision compels practical men to overlook this awkward fact"). He critiques the *consequences* of this behavior (instability), but he acknowledges it as a psychological necessity. He does not explicitly say a philosopher or economist *cannot* assign a subjective probability, only that doing so provides no *scientific* guide for action.
  *   **Relation to *Treatise on Probability*:** **Tension.** In the *Treatise*, Keynes allows for non-numerical probabilities. He doesn't say belief is impossible, just that it isn't always measurable.
  *   **Verdict on the Bayesian Classmate:** **The "Shut Down" Move.**
      *   *Why:* This is the only level that justifies ending the argument. It claims Bayesianism is *meaningless* in this domain.
      *   *The Catch:* This reading relies on a hidden normative premise: **"Rationality requires a scientific basis."** If you define rationality as "acting on scientifically calculable probabilities," then yes, the Bayesian is irrational. But if you define rationality as "acting consistently with one's beliefs" (the Bayesian definition), the Keynesian objection fails. The group is using Level 4 to win an argument, but they are smuggling in a definition of rationality that the Bayesian rejects.

  ---

  ### The Hidden Premises Doing the Work

  You suspected unstated premises were doing the heavy lifting. You are right. To move from "Keynes says we don't know" to "The Bayesian is wrong," your group is relying on two unstated assumptions:

  1.  **The Scientificity Premise:** That a probability assignment is only valid if it has a "scientific basis" (objective/logical/empirical).
      *   *Counter:* The Bayesian rejects this. They argue subjective coherence is sufficient for validity.
      *   *Keynes's View:* Keynes likely agrees with the premise, but he admits humans *violate* it out of necessity.
  2.  **The Normative/Descriptive Conflation:** Keynes is describing *why investment is unstable* (because people pretend to know what they don't). The group is using this description as a *normative rule* for economic modeling (therefore, models shouldn't assign probabilities).
      *   *Counter:* One could argue that *because* people pretend to know, a Bayesian model of their behavior is actually the most accurate description of reality, even if the underlying knowledge is absent.

  ### How to Bring This Back to the Group

  You don't need to be contrarian; you need to be precise. Here is a script/strategy for your next meeting:

  1.  **Validate the Core Insight:** Start by agreeing that Keynes's point about the lack of *frequency data* (Level 1) and the low *weight of evidence* (Level 2) is devastating for naive neoclassical models that treat investment risk like insurance risk.
  2.  **Introduce the Ramsey Context:** Mention that Keynes knew Frank Ramsey. Ramsey argued exactly what your classmate is arguing: that probability is degree of belief, not logical relation. The 1937 article is Keynes doubling down on his 1921 view *against* Ramsey.
      *   *Point:* "When we tell the Bayesian 'Keynes proved you wrong,' we are actually just saying 'Keynes preferred his 1921 definition of probability over Ramsey's.' That's a philosophical choice, not a settled fact."
  3.  **Distinguish "No Basis" from "No Belief":**
      *   *Point:* "Keynes says there is no *scientific basis* for a calculation. He does not say a human being cannot feel a degree of confidence. In fact, he says they *must* feel it to act. If the Bayesian is modeling the *psychology of the investor*, assigning a prior might be descriptively accurate even if epistemologically hollow."
  4.  **Propose the "Weight" Compromise:**
      *   *Point:* "Instead of shutting down the prior, maybe we should demand the Bayesian disclose the **weight** of their evidence. A prior on copper prices in 20 years should have a massive confidence interval or a 'weight' parameter attached to it. If they treat that prior as hard data in a model, *then* we can hit them with the 1937 quote."

  ### Summary Verdict

  *   **Does the passage license the shut-down?** No, not on its own.
  *   **What does it license?** It licenses the claim that the Bayesian's prior is **arbitrary**, **ungrounded**, and **dangerous if treated as knowledge**.
  *   **What is missing?** The move from "ungrounded" to "meaningless" requires the extra premise that *only grounded probabilities are rational*.

  If you frame it this way, you aren't defending the Bayesian against Keynes; you are defending the *precision of the argument* against the slogan. You can tell the group: "Keynes doesn't say the Bayesian is lying; he says the Bayesian is guessing. Let's make them admit they're guessing, rather than pretending the guess is impossible." This keeps the spirit of the Post-Keynesian critique without turning it into a conversation-stopper.
