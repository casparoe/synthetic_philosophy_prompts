answer: |-
  This is a classic administrative instantiation of the Ship of Theseus. You are correct that metaphysics cannot give you a "true" answer because identity over time is not a discovery, it is a convention. However, metaphysics *can* give you a map of the trade-offs you are making when you set that convention.

  Below is the **Heritage Persistence Protocol (HPP)**. It is designed to be run in under two hours. It separates factual continuity from policy weighting, forces explicit decisions on "hard cases," and provides a defensible paper trail for when the county commission calls.

  ### Part 1: The Heritage Persistence Protocol (HPP)

  **Instructions for Reviewer:** Complete Sections A, B, and C. Tally the scores. If the result is "Ambiguous," proceed to Section D. Do not skip Section E (The Policy Declaration).

  #### Section A: Material Continuity (The "Stuff" Lens)
  *Metaphysical Basis: Mereological Essentialism (an object is its parts).*
  *Goal: Establish the baseline of physical survival.*

  1.  **[FACT]** Estimate the percentage of original historic fabric (by volume or structural significance) remaining in the current structure.
      *   > 50% original fabric.
      *   10% – 50% original fabric.
      *   < 10% original fabric.
  2.  **[FACT]** Are the original materials arranged in their original configuration (joinery, orientation, layering)?
      *   Yes (Original assembly logic retained).
      *   No (Materials salvaged and reconfigured).
      *   N/A (No original materials).

  **Section A Termination:**
  *   If >50% fabric AND original configuration: **Presumptive YES.** (Skip to Section E).
  *   If <10% fabric: **Presumptive NO.** (Proceed to Section B to check for override).
  *   If 10–50%: **Ambiguous.** (Proceed to Section B).

  #### Section B: Spatio-Temporal Continuity (The "Form" Lens)
  *Metaphysical Basis: Perdurantism / Spacetime Worms (an object is a continuous path through time and space).*
  *Goal: Establish if the "process" of the building was interrupted.*

  3.  **[FACT]** Has the structure remained in its original geographic location (footprint)?
      *   Yes (Never moved).
      *   No (Relocated).
      *   Partial (Moved <100 yards to save from destruction).
  4.  **[FACT]** Was there a break in the structure's existence (a period where it ceased to function or was fully dismantled)?
      *   No (Continuous use/maintenance).
      *   Yes, < 5 years (Temporary stabilization/dismantling).
      *   Yes, > 5 years (Long-term ruin or storage).
  5.  **[FACT]** Does the current form match the historic form (design, dimensions, appearance)?
      *   Yes (In-kind replacement).
      *   No (Substantial design alteration).

  **Section B Termination:**
  *   If Location=Yes AND Break=No AND Form=Yes: **Strong Continuity.** (Proceed to Section C).
  *   If Location=No OR Break=>5 years: **Broken Continuity.** (Likely NO unless overridden by Section C).

  #### Section C: Functional & Interest Continuity (The "Policy" Lens)
  *Metaphysical Basis: Conceptualism (identity depends on our classificatory interests).*
  *Goal: Determine if the "identity" that matters to the public still exists.*

  6.  **[POLICY]** Does the structure still serve its historic function, or a function culturally equivalent to it?
      *   Yes (e.g., Bridge still carries traffic).
      *   No (e.g., Ship in a museum).
      *   *Note: This is a value call. A ship in a museum is no longer a "ship" functionally, but is a "artifact" functionally.*
  7.  **[POLICY]** Is the "story" of the structure tied to its **materials** (e.g., "the wood from this forest") or its **location/event** (e.g., "the site of the treaty")?
      *   Tied to Materials.
      *   Tied to Location/Event.

  **Section C Scoring:**
  *   If Tied to Location + Location=Yes (from Sec B): **Override Material Loss.** (Verdict: YES).
  *   If Tied to Materials + Fabric=<10% (from Sec A): **Confirm Material Loss.** (Verdict: NO).
  *   If Function=No (Museum piece): **Verify Conservation Status.** If conserved as an artifact, Verdict: YES (as Artifact, not Structure).

  #### Section D: The Fission & Conflict Clause
  *Use ONLY if two entities claim the same identity (e.g., original parts rebuilt elsewhere vs. replica on original site).*

  **The Tie-Breaker Rule:**
  For immovable heritage (buildings, bridges), **Location + Function > Material.**
  For movable heritage (ships, vehicles), **Material + Continuous Chain of Custody > Location.**

  *   **Scenario:** Original timber rebuilt on new site VS. New timber on original site.
  *   **Decision:** The structure on the **Original Site** retains the Register Identity. The structure with the **Original Timber** is designated a "Collection of Historic Fabric" (eligible for different status, but not the Building Identity).
  *   **Rationale:** The Register protects *places*. A pile of old wood in a new place is a collection, not a place.

  #### Section E: The Policy Declaration (Required for Defense)
  *This section prevents the reviewer from hiding behind "facts."*

  **Reviewer Statement:**
  "I am recommending [YES/NO] based primarily on [Material / Location / Function] continuity."

  **Justification:**
  "Although [Fact X] suggests the object is not materially identical, we are prioritizing [Value Y] because the statute intends to protect [State Interest Z]."

  **Sign-off Authority:**
  *   **Presumptive YES/NO:** Senior Reviewer.
  *   **Ambiguous / Override:** Board of Trustees (Required for cases where Material <10% but Identity = YES).

  ---

  ### Part 2: Running the Cases

  Here is how the HPP processes your three files.

  #### Case (a): The Covered Bridge (80% new timber, in situ, working)
  *   **Sec A (Material):** <50% fabric (20% old). **Presumptive NO.**
  *   **Sec B (Form):** Location=Yes. Break=No. Form=Yes. **Strong Continuity.**
  *   **Sec C (Policy):** Function=Yes (traffic). Story=Tied to Location (crossing the river).
  *   **Result:** **YES.**
  *   **Rationale:** The "Location + Function" override in Section C validates the identity despite material loss. The bridge is treated as a *perdurant process* of maintenance rather than a static *endurant object*.
  *   **Defense:** "We protect the historic crossing. The timber is the maintenance cost of that protection."

  #### Case (b): The Harbor Ship (60% new material, museum hall)
  *   **Sec A (Material):** >50% fabric (40% new, 60% old/conserve). **Presumptive YES.**
  *   **Sec B (Form):** Location=No (Harbor to Museum). Break=Yes (Raised from water).
  *   **Sec C (Policy):** Function=No (No longer sails). Story=Tied to Materials (the specific vessel).
  *   **Result:** **YES (with qualification).**
  *   **Rationale:** High material retention secures the identity, but the change in function shifts its category from "Structure" to "Artifact."
  *   **Defense:** "The identity survives in the fabric, even though the function has ceased. It is the same ship, now serving as a museum object."

  #### Case (c): The Logging Flume (Continuously rebuilt every 15 years, same spot, same plans)
  *   **Sec A (Material):** <10% fabric (None original, cyclical replacement). **Presumptive NO.**
  *   **Sec B (Form):** Location=Yes. Break=No (Continuous operation). Form=Yes.
  *   **Sec C (Policy):** Function=Yes. Story=Tied to Location/Process.
  *   **Result:** **HARD MIDDLE CASE (Requires Board Sign-off).**
  *   **The Conflict:** The HPP flags this as a **Failure of Materiality**. Under the "Retention of Historic Fabric" statute, this is *not* the 1850s flume. It is a 2024 flume built to 1850s specs.
  *   **The "Unliked" Outcome:** The procedure forces you to admit **this is not the historic structure.** It is a *living tradition* manifesting as a structure.
  *   **Why you won't like this:** If your office values "intangible heritage" or "continuous use," this procedure blocks you. It reveals that your statute is biased toward *static objects*, not *continuous processes*. To register the Flume, the Board must explicitly vote to override the Material clause, acknowledging they are changing the definition of "Historic Fabric" to include "Continuous Replication."

  ---

  ### Part 3: Where This Procedure Will Misfire (Failure Modes)

  You asked for honesty about limitations. This tool is a heuristic, not a truth machine. It will fail in the following scenarios:

  **1. The "Disneyfication" Loophole**
  *   **The Case:** A building burns down. It is rebuilt exactly (100% form continuity) on the same spot (100% location continuity) with 0% original material.
  *   **The Glitch:** Section B and C might push this to a "YES" if the Board values "Streetscape" over "Fabric."
  *   **The Risk:** You end up protecting a replica. Metaphysically, it is a replica. Politically, it looks the same.
  *   **Mitigation:** Enforce the Section A "Presumptive NO" for <10% fabric strictly unless there is a documented *interruption* of less than 2 years.

  **2. The "Living Structure" Problem**
  *   **The Case:** A heritage orchard or a tree whose branches are pruned/replaced over time.
  *   **The Glitch:** Biological entities replace their material constantly. The HPP treats material loss as degradation; for biology, it is life.
  *   **The Risk:** The procedure might de-register a 200-year-old oak because none of its cells are original.
  *   **Mitigation:** Add a "Biological Exception" clause to Section A for living heritage.

  **3. The "Component Swap" (Sails and Ropes)**
  *   **The Case:** A ship where the hull is original, but sails, rigging, and engine are replaced every 5 years.
  *   **The Glitch:** Is the engine part of the "ship"? If yes, identity is lost. If no, identity remains.
  *   **The Risk:** Inconsistent rulings on what counts as "fabric" vs. "consumable."
  *   **Mitigation:** Define "Structural Fabric" vs. "Consumable Inventory" in your office guidelines. (e.g., Sails are inventory; Keel is fabric).

  **4. The "Identity Shift"**
  *   **The Case:** A church becomes a restaurant.
  *   **The Glitch:** Section C asks if function is equivalent. A restaurant is not a church.
  *   **The Risk:** You might rule it "Not the same" because the function died. But historically, adaptive reuse is often encouraged.
  *   **Mitigation:** Clarify in Section C that "Compatible Adaptive Reuse" counts as Functional Continuity for the sake of preservation, even if the *social* function changes.

  ---

  ### Part 4: Implementation Guide for Your Office

  To make this defensible against a county commission, you must assign responsibility for the "Value Calls."

  1.  **The Reviewer (Historian):** Responsible for **Sections A & B**. These are factual findings (percentages, dates, locations). If they get these wrong, it's negligence.
  2.  **The Senior Registrar:** Responsible for **Section C (Policy)**. They decide if the "Story" is tied to Material or Location. This is where the "vibes" get codified.
  3.  **The Board:** Responsible for **Section D (Fission)** and **Section E (Overrides)**. When the procedure says "Hard Middle" (like the Flume), the Board must vote. This insulates your staff from political pressure.

  **The Script for the County Commission:**
  When they ask, *"Why isn't this the historic barn?"*
  You say: *"Our protocol distinguishes between the **historic place** and the **historic materials**. In this case, the materials were lost. We can protect the site, but we cannot certify the structure as the original artifact. To do otherwise would violate our statutory requirement to protect 'historic fabric.'"*

  When they ask, *"Why IS this the historic barn when it's all new wood?"*
  You say: *"The protocol recognizes that some structures are defined by their **location and continuous use**. The material replacement was part of the structure's historic life-cycle, not a reconstruction. The identity persists in the continuity of the place."*

  ### Summary
  You cannot solve the Ship of Theseus. But you can stop fighting about it by agreeing on *which lens* you are using for *which case*. This procedure forces you to admit when you are making a policy choice (valuing location over wood) rather than pretending it's a factual discovery. The Flume case will hurt, but it will tell you the truth about your statute: it protects *things*, not *traditions*. If you want to protect the Flume, you need to change the law, not the metaphysics.
