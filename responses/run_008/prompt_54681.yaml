prompt: |-
  I work at a state heritage office and we keep having fights about whether a thing is still "the same thing" after it gets restored or rebuilt, and I have a feeling philosophers have basically been fighting about this exact issue for two thousand years under the name Ship of Theseus. So help me steal their tools.

  Background: our office maintains a register of protected structures, and register status carries real obligations and grant money, so identity claims have consequences. When someone replaces every rotten board in an 1850s barn over 40 years, is it still the 1850s barn? When a covered bridge gets 80% new timber but stays standing in the same place the whole time? When a ship is raised from a harbor, conserved piece by piece with lots of new material, and put in a museum? Our current rule is basically vibes plus a line in our statute about "retention of historic fabric," which everyone interprets differently depending on what outcome they want.

  What I want is a decision procedure a reviewer can actually run on an identity claim in an afternoon, no philosophy degree required. It should be grounded in what the actual metaphysics of persistence says -- I gather there are roughly three families of answers (stuff-continuity, continuity of form/structure/process, and "no deep fact of the matter, it depends on our interests"), and I suspect a good procedure uses all three as different lenses rather than picking one. So:

  1. Give me the ordered questions a reviewer asks, what counts as enough of an answer at each step, and where the procedure terminates in a "yes it's the same," "no it isn't," or "here's the hard middle case."
  2. Be explicit about which steps are genuinely factual and which are value calls dressed up as facts (like whether material continuity matters more than the structure staying in use -- I suspect that's not something metaphysics can settle for us, it's a policy choice, and I'd rather the procedure say so than pretend).
  3. Handle the fission-style case: the barn that was dismantled, and someone rebuilt a barn from its parts on the original site while a preservation group simultaneously rebuilt a barn from modern materials incorporating a few original pieces on a site across town. Both are claiming to be the register entry. Whatever you say here, say it honestly, including if the right answer is that "same building" is a bad question and we should be asking a different one.
  4. Then run the procedure on three real-ish cases from our files: (a) the covered bridge with ~80% new timber replaced in situ over decades, still carrying traffic; (b) the harbor ship raised, conserved, and now 60% new material in a museum hall; (c) a logging flume, originally temporary by design, that has been continuously rebuilt from scratch every ~15 years following the same plans at the same spot. One of these should come out in a way I won't like -- I won't tell you which, but flag it yourself.

  Also tell me where this procedure will predictably misfire. Like, I already know it'll struggle with things that are supposed to be replaced, ropes and sails and the like, and with buildings whose "identity" maybe was always tied to their use rather than their boards. Be upfront about failure modes rather than giving me something that only works on tidy cases.

  Make it usable: my reviewers have maybe two hours per claim, they're historians not logicians, and the output has to be defensible when a county commission yells at us. If a step needs a judgment call, name who should make it (reviewer, senior registrar, or the board).
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Works at a state heritage office.
      *   **Problem:** Disputes over whether restored/rebuilt structures retain their "historic identity" (Ship of Theseus problem). Current rules are vague ("vibes," "retention of historic fabric").
      *   **Goal:** A practical decision procedure (algorithm/checklist) for reviewers to use in ~2 hours.
      *   **Requirements:**
          1.  Ordered questions with termination conditions (Yes/No/Hard Case).
          2.  Explicit distinction between factual claims and value/policy judgments.
          3.  Handle fission cases (two claimants).
          4.  Apply to three specific cases (Bridge, Ship, Flume).
          5.  Identify failure modes/limitations.
          6.  Usable by historians, defensible against public/political pressure.
          7.  Grounded in metaphysical persistence theories (Material, Structural/Functional, Conceptual/Interest-relative).

  2.  **Deconstruct the Metaphysics (The "Tools"):**
      *   *Material Continuity (Endurantism/Mereological Essentialism lite):* Is it the same stuff? (The "Stuff" Lens).
      *   *Structural/Functional Continuity (Perdurantism/Patternism):* Is it the same shape, function, and location over time? (The "Form" Lens).
      *   *Conceptual/Interest-Relative (Conventionalism):* Do we *treat* it as the same for our specific purposes? (The "Policy" Lens).
      *   *Fission:* When one thing becomes two, identity breaks. We need a priority rule.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Ask if it has old wood. If yes, keep. If no, ask if it looks the same. If yes, keep. If split, pick the one on the original site.
      *   *Critique 1:* Too simple. Doesn't distinguish policy from fact. Doesn't handle the "vibes" issue. Doesn't explicitly flag the hard cases.

      *   *Attempt 2 (Adding Metaphysical Rigor):*
          *   Step 1: Material % (Fact).
          *   Step 2: Location/Design (Fact).
          *   Step 3: Purpose of Register (Value).
          *   Step 4: Fission rule.
      *   *Critique 2:* Better. Needs to be more specific about thresholds and who decides what. Needs to acknowledge that "identity" is often a proxy for "value."

      *   *Attempt 3 (Refining for the User's Constraints):*
          *   Need a "Triage" approach.
          *   Need to separate *Ontological Claims* (What is it?) from *Normative Claims* (What do we want to protect?).
          *   The "Hard Middle" needs to be a specific outcome, not just confusion.
          *   The Fission case needs a tie-breaker based on the *purpose* of the register.

  4.  **Developing the "Heritage Persistence Protocol" (HPP):**
      *   *Phase 1: The Material Baseline (The "Stuff" Lens).* Quantify fabric. This is factual.
      *   *Phase 2: The Continuity of Form & Function (The "Form" Lens).* Location, design, use. This is mostly factual but involves interpretation of "design."
      *   *Phase 3: The Interest-Relative Check (The "Policy" Lens).* Why does it matter? This is the value call.
      *   *Phase 4: Fission/Conflict.* Priority rules.

      *   *Refining the "Value Call":* The user wants to know where metaphysics stops and policy begins. Metaphysics says "identity is vague." Policy says "we need a binary decision." The procedure must flag where the reviewer is making a policy choice disguised as a discovery.

  5.  **Addressing the Specific Cases:**
      *   (a) Covered Bridge (80% new, in situ, working). *Prediction:* Passes Form/Function, fails Material. Likely a "Yes" based on function/location, but flagged as high replacement.
      *   (b) Harbor Ship (60% new, museum). *Prediction:* Passes Material (conserved original), fails Function (not a ship anymore). Likely a "Yes" based on material significance, but function is dead.
      *   (c) Logging Flume (Continuous rebuild, temporary design). *Prediction:* Fails Material (none original), Passes Form/Location. *The "Unliked" Outcome:* This is the tricky one. If the flume is *defined* by its process of replacement, it might be the "same" process, but heritage registers usually value *fabric*. I suspect the procedure will rule it *not* the same building because it lacks fabric continuity, which contradicts the "living tradition" vibe. Or, conversely, it rules it *is* the same, which contradicts the "historic fabric" statute. Let's aim for the latter: The procedure might validate it as a "Persistent Process" rather than a "Persistent Object," which breaks the register's logic. I will flag the Flume as the one that exposes the system's bias toward static objects.

  6.  **Addressing Fission:**
      *   If Barn A (original parts, new site) vs. Barn B (new parts, original site).
      *   Metaphysics: Neither is strictly identical.
      *   Policy: We need one.
      *   Rule: Priority to *Location* + *Function* over *Material* for immovable heritage. (Because land is the primary constraint).

  7.  **Addressing Failure Modes:**
      *   Living structures (trees).
      *   Digital heritage.
      *   Intangible heritage tied to buildings.
      *   "Disneyfication" (perfect replica).

  8.  **Finalizing the Output Structure:**
      *   Introduction: Acknowledge the Ship of Theseus.
      *   The Protocol (Steps 1-4).
      *   The Fission Clause.
      *   Case Studies.
      *   Failure Modes.
      *   Implementation Notes (Who decides what).

  9.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I distinguish fact vs. value? *Adjustment:* Add explicit tags [FACT] and [POLICY] to steps.
      *   *Check:* Is it doable in 2 hours? *Adjustment:* Keep the questions binary or scalar where possible. Avoid deep philosophical inquiry.
      *   *Check:* Is the "Unliked" case clear? *Adjustment:* I'll bet on the Flume. Heritage offices usually hate "reconstructions" even if continuous. The procedure might force a "No" on a culturally significant continuous practice, revealing the bias of the register itself.
      *   *Check:* Defensibility. *Adjustment:* Emphasize that the "Policy" steps require Senior Registrar sign-off so the frontline reviewer isn't burned.

  10. **Final Polish:** Ensure tone is professional, empathetic to the bureaucratic struggle, and philosophically accurate without being jargon-heavy. (e.g., explain "perdurantism" as "space-time worm" or "process").

  *(Self-Correction on the "Unliked" Case)*: Wait, if the flume is rebuilt every 15 years following the same plans, it has *zero* original fabric. Under a "retention of historic fabric" statute, it *should* fail. But if the *tradition* is the heritage, it should pass. The procedure will likely force a "No" because it prioritizes fabric continuity in Step 1. This reveals the statute's limitation. I will highlight this tension.

  *(Self-Correction on the Ship)*: A ship in a museum is no longer a ship functionally. It's an artifact. Does it retain identity? Yes, as an artifact. The procedure needs to allow "Change of Function" if "Material Significance" is high.

  *(Self-Correction on the Bridge)*: 80% new timber. That's high. But it's in situ. This is the classic "maintained building" case. It should pass, but barely.

  Okay, ready to write. The structure will be:
  1.  **The Heritage Persistence Protocol (HPP)** - The core tool.
  2.  **The Fission & Conflict Clause** - Handling duplicates.
  3.  **Case Applications** - Running the tool.
  4.  **Known Failure Modes** - Where the tool breaks.
  5.  **Implementation Guide** - Roles and responsibilities.

  Let's make sure the distinction between *Ontological Identity* (is it the same object?) and *Registrative Eligibility* (does it qualify for the list?) is clear. The user asks about "identity," but the *consequence* is eligibility. The procedure should bridge this by treating "Identity for Registration Purposes" as the target.

  Let's refine the "Value Call" aspect. The user wants to know where metaphysics ends and policy begins.
  *   Metaphysics: Continuity is a spectrum.
  *   Policy: We need a cutoff.
  *   The procedure must explicitly state: "You are setting a cutoff here."

