prompt: |-
  I run post-incident reviews for a payments platform. We average one significant incident a week; each review gets ninety minutes with a rotating cast of engineers, and afterwards I sign a report that names a single root cause and a corrective action, because our auditors — and occasionally a regulator — will not accept anything less. The philosophy of science I've half-remembered says that inference to the best explanation is comparative: you infer to the best of the alternatives actually considered, which means a good report depends on which alternatives got onto the table, not just on how you score them. It also says there's a standing worry that the best of a bad lot isn't the same thing as the true one. Please turn all of this into a procedure my team can actually run inside the time and expertise constraints we have: how to force rival hypotheses into consideration instead of scoring whatever the first responder fixated on; what the scoring criteria should be and how to handle it when the usual virtues — simplicity, scope, mechanism — pull against each other; what makes an amendment count as an ad hoc patch to a dying hypothesis rather than a legitimate refinement; and, hardest for me, a stopping rule for when the evidence leaves two hypotheses live and the procedure should return no defensible root cause rather than pick the current leader, with the gaps where an engineer's judgment cannot be replaced by the checklist marked as such. I'd also like you to be honest about where the procedure will misfire — where it will certify a story because the room is tired, or refuse one because the honest hypothesis is boring. Then run it on two incidents: one where the leading explanation fits all the evidence but only by positing a condition nothing in the logs requires, and one where two subsystems failed in the same hour and each team has a clean explanation of its own half that cannot touch the other's. Finish by drafting the paragraph I can send to an auditor who has rejected a report on the grounds that, quote, root cause analysis must terminate in a root cause.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and response:

  1.  **Deconstruct the Request:**

      *   **Context:** Post-incident reviews (PIRs) for a payments platform.
      *   **Constraints:** 1 incident/week, 90 minutes per review, rotating engineers, auditor/regulator requirement for a *single* root cause and corrective action.
      *   **Philosophical Basis:** Inference to the Best Explanation (IBE) is comparative. Quality depends on the set of alternatives considered. Risk: "Best of a bad lot" $\neq$ Truth.
      *   **Deliverables:**
          1.  A concrete procedure (90 mins) to force rival hypotheses.
          2.  Scoring criteria (handling conflicting virtues like simplicity vs. scope).
          3.  Criteria for distinguishing ad hoc patches vs. legitimate refinements.
          4.  A stopping rule for when evidence is inconclusive (no defensible root cause).
          5.  Honest admission of procedure failure modes (fatigue, boring hypotheses).
          6.  Run the procedure on two specific hypothetical incidents (Case A: Unrequired condition; Case B: Dual failure/siloed explanations).
          7.  Draft a paragraph for an auditor rejecting the "must terminate in a root cause" demand.

  2.  **Analyze the Tension:**

      *   *Constraint:* Auditors demand a single root cause.
      *   *Reality:* Complex systems often have multiple contributing factors or ambiguous causality.
      *   *Philosophy:* IBE requires good alternatives.
      *   *Time:* 90 minutes is very short for deep epistemic work.
      *   *Goal:* Create a rigorous process that satisfies the auditor *mostly*, but protects the team from lying or oversimplifying to the point of danger, while acknowledging where the process breaks.

  3.  **Drafting the Procedure (The "90-Minute IBE Protocol"):**

      *   *Phase 1: Preparation (Pre-meeting):* Can't waste 90 mins gathering facts. Need a timeline and logs ready.
      *   *Phase 2: Hypothesis Generation (0-20 mins):* Need to prevent fixation. Technique: "Devil's Advocate" or "Pre-mortem" style. Force 3 distinct hypotheses minimum.
      *   *Phase 3: Scoring & Comparison (20-60 mins):* Need criteria. Simplicity, Scope, Mechanism, Consilience (fit with background knowledge). Need a way to weigh them.
      *   *Phase 4: Ad Hoc Check (60-75 mins):* Is the hypothesis being saved by arbitrary tweaks?
      *   *Phase 5: Stopping Rule & Reporting (75-90 mins):* When to say "We don't know."
      *   *Failure Modes:* Acknowledge fatigue, social pressure, "boring truth."

  4.  **Developing Specific Mechanisms:**

      *   *Forcing Rivals:* The "Three-Column Rule." You cannot discuss the first hypothesis until two others are written down.
      *   *Scoring:* Use a weighted matrix but keep it simple. 1-5 scale.
      *   *Ad Hoc vs. Refinement:* The "Independent Test" criterion. Does the tweak predict something new or just explain the old data?
      *   *Stopping Rule:* If the top two scores are within a margin of error (e.g., 10%), declare "Indeterminate." *Crucial Conflict:* Auditors demand a root cause. I need to address how to report "Indeterminate" to an auditor who hates that. *Correction:* The prompt asks for a stopping rule *for the procedure*, then a letter to the auditor *if* they reject a report based on that. So the procedure *must* allow for "No Root Cause," even if the auditor fights it.

  5.  **Addressing the Specific Incidents:**

      *   *Case 1 (The Ghost Condition):* Leading explanation fits evidence but posits a condition not in logs (e.g., "Network packet loss" when logs show perfect transmission).
          *   *Application:* The "Independent Test" fails. It's likely an ad hoc save. Procedure should flag this.
      *   *Case 2 (The Twin Failure):* Two subsystems fail. Team A says "DB lock." Team B says "Cache eviction." Neither explains the other.
          *   *Application:* Scope is limited for both. Consilience is low. Procedure should likely result in "Indeterminate/Complex Interaction" rather than picking one.

  6.  **Addressing the Auditor:**

      *   Auditors want linear causality ($A \rightarrow B$). Reality is often networked ($A + B + C \rightarrow D$).
      *   The letter needs to be firm but professional. It needs to cite industry standards (like NIST or safety science) that acknowledge complexity.
      *   *Key argument:* False certainty is a compliance risk.

  7.  **Refining the Output (Self-Correction during drafting):**

      *   *Critique:* 90 minutes is tight for all this.
      *   *Fix:* Emphasize pre-work. The meeting is for *decision*, not discovery.
      *   *Critique:* Auditors won't accept "We don't know."
      *   *Fix:* The procedure allows "Indeterminate," but the *report* might need to frame it as "Root Cause: Systemic Interaction Ambiguity" with a corrective action of "Improved Observability." This satisfies the form without lying about the substance. *Wait, the prompt asks for a letter to an auditor who rejected a report.* This implies I should empower the user to push back. I will draft the letter to defend the "Indeterminate" finding.
      *   *Philosophy Check:* Ensure IBE concepts (consilience, simplicity, ad hocness) are clearly mapped to engineering terms.

  8.  **Final Polish:**

      *   Tone: Professional, rigorous, slightly weary but determined (matching the user's vibe).
      *   Structure: Procedure -> Failure Modes -> Case Studies -> Auditor Letter.
      *   Check constraints: 90 mins, rotating cast, payments context.

  9.  **Drafting the Content (Mental Outline):**
      *   **Intro:** Acknowledge the tension.
      *   **The Protocol:** "The 90-Minute Triangulation."
      *   **Scoring:** The "Virtue Matrix."
      *   **Ad Hoc:** The "New Prediction" test.
      *   **Stopping:** The "Margin of Doubt."
      *   **Failure Modes:** Honesty section.
      *   **Case 1:** The Ghost Condition (Fail the ad hoc test).
      *   **Case 2:** The Twin Failure (Fail the scope test/Indeterminate).
      *   **Auditor Letter:** The "False Certainty" argument.

  10. **Final Review against Prompt:**
      *   Procedure for rival hypotheses? Yes (Three-Column Rule).
      *   Scoring criteria? Yes (Virtue Matrix).
      *   Ad hoc vs. refinement? Yes (Independent Test).
      *   Stopping rule? Yes (Margin of Doubt).
      *   Honest misfire admission? Yes.
      *   Run on two incidents? Yes.
      *   Draft paragraph for auditor? Yes.

      *Self-Correction on Auditor Letter:* The prompt asks for a paragraph to send to an auditor who *rejected* a report because it didn't terminate in a root cause. This means the procedure *did* trigger the stopping rule (no root cause), and the auditor hated it. The letter must justify why "No Root Cause" is the compliant answer.

      *Refining the "Single Root Cause" constraint:* The prompt says auditors *will not accept anything less*. This creates a direct conflict with the philosophical stopping rule. I need to navigate this. The procedure should identify when a single root cause is a *lie*. The letter is the weapon to use when that lie is refused. I will structure the procedure to output "Root Cause: Insufficient Evidence" if the stopping rule triggers, and the letter defends that specific output.

      *Wait, one more nuance:* "Inference to the best explanation... implies a good report depends on which alternatives got onto the table." I need to make sure the procedure documents the *rejected* hypotheses, not just the winner, to show the auditor the work was done.

      *Let's write.*
answer: |-
  ### The 90-Minute Triangulation Protocol

  This procedure is designed to fit your 90-minute window while enforcing the epistemic rigor required to avoid the "best of a bad lot" trap. It assumes a Facilitator (you) and a Scribe (rotating engineer).

  **Pre-Work (Required before the clock starts):**
  *   **Timeline:** A minute-by-minute sequence of events (logs, deploys, alerts).
  *   **The "Fix":** What was done to restore service?
  *   **Constraint:** No hypothesis discussion before the meeting.

  #### Phase 1: Forced Divergence (0–20 Minutes)
  *Goal: Prevent fixation on the First Responder's narrative.*
  1.  **The Silent Write (5 mins):** Everyone writes down *three* distinct potential causes on sticky notes (digital or physical). No discussion.
      *   *Constraint:* One must be technical (code/config), one operational (process/human), and one external (vendor/network).
  2.  **The Board (10 mins):** Scribe clusters notes. You select the top three distinct clusters as **H1, H2, H3**.
      *   *Rule:* If the First Responder's theory is H1, H2 and H3 must be structurally different, not just variations of H1.
  3.  **The Charter (5 mins):** Define what evidence would *kill* each hypothesis. (e.g., "If H1 is true, the database CPU must have spiked. If it didn't, H1 is dead.")

  #### Phase 2: Scoring & Comparison (20–60 Minutes)
  *Goal: Comparative scoring, not absolute truth.*
  Use the **Virtue Matrix**. Score each hypothesis 1–5 on the following. Do not average; look for profiles.

  | Virtue | Definition | Engineering Translation |
  | :--- | :--- | :--- |
  | **Consilience** | Fits with background knowledge. | Does this match how the system is known to behave? (e.g., "This service usually times out, not crashes.") |
  | **Scope** | Explains the breadth of evidence. | Does it explain *only* the error, or also the latency spike and the log gap? |
  | **Simplicity** | Fewest new assumptions. | Does it require positing a new bug, or just a known bug in a new place? |
  | **Mechanism** | Plausible causal chain. | Is there a physical/logical path from A to B, or is it "magic"? |

  **Handling Conflicts:**
  *   *Simplicity vs. Scope:* If H1 is simple but misses 20% of the evidence, and H2 is complex but fits 100%, **H2 wins.** In payments, unexplained evidence is risk.
  *   *Mechanism vs. Consilience:* If the mechanism is clear but contradicts system knowledge (e.g., "The database committed a transaction it shouldn't have"), **flag as Critical Unknown.** Do not override known system invariants for a convenient story.

  #### Phase 3: The Ad Hoc Check (60–75 Minutes)
  *Goal: Distinguish refinement from patching.*
  When a hypothesis is challenged by evidence, the proponent may amend it.
  *   **The Test:** Does the amendment generate a *new* prediction that can be verified?
      *   *Legitimate Refinement:* "If the cache was stale, we should see high latency on read-replicas." (Check logs).
      *   *Ad Hoc Patch:* "The cache was stale, but the logs didn't record it because the logger was also broken." (Unless you can prove the logger broke *independently*, this is a dying hypothesis gasping for air).
  *   **Rule:** A hypothesis survives only one ad hoc patch. A second patch kills it.

  #### Phase 4: The Stopping Rule (75–90 Minutes)
  *Goal: Decide whether to claim a Root Cause.*
  1.  **Calculate the Gap:** Compare the top two scores.
  2.  **The Margin of Doubt:** If H1 and H2 are within 15% total score, **do not select a root cause.**
  3.  **The Output:**
      *   *If H1 wins clearly:* Report H1 as Root Cause.
      *   *If Indeterminate:* Report Root Cause as **"Indeterminate: Competing Hypotheses."**
      *   *Corrective Action for Indeterminate:* "Increase observability to distinguish between H1 and H2 in future incidents." (This satisfies the auditor's demand for an action without lying about the cause).

  ---

  ### Honest Failure Modes

  This procedure is not a truth machine. It is a risk mitigation tool. It will misfire in the following ways:

  1.  **The Fatigue False Positive:** At minute 85, the team is tired. A complex H2 will feel "too much work" compared to a simple H1. The scoring will bias toward simplicity artificially. *Mitigation:* You (Facilitator) must call a 5-minute silence at minute 75 to reset cognitive load before scoring.
  2.  **The Boring Truth:** The true cause might be "gradual bit rot in a library nobody owns." It scores low on Mechanism (hard to trace) and Simplicity (boring). The team will prefer a dramatic "Bad Deploy" narrative. *Mitigation:* You must explicitly ask: "What if the cause is mundane?" in Phase 1.
  3.  **The Social Hierarchy:** If the Staff Engineer in the room favors H1, junior engineers will not defend H2. *Mitigation:* Anonymous scoring for Phase 2. Everyone writes scores on paper before reading them out.

  ---

  ### Case Runs

  #### Case 1: The Ghost Condition
  **Incident:** Payment processing halts for 10 minutes.
  **Leading Explanation (H1):** "Third-party provider rate-limited us."
  **Evidence:** Logs show 429 errors.
  **Problem:** Logs also show the request rate was well below the contractual limit.
  **Procedure Run:**
  *   **Phase 1:** H1 (Rate Limit), H2 (Internal Throttling), H3 (Clock Skew).
  *   **Phase 2:** H1 scores high on Simplicity (common issue) but low on Consilience (we weren't over the limit). H2 scores low on Mechanism (no code path found).
  *   **Phase 3 (Ad Hoc):** Proponent of H1 amends: "They changed the limit without telling us."
      *   *Test:* Can we verify this? No, vendor says no.
      *   *Verdict:* This is an **Ad Hoc Patch**. It saves the hypothesis by positing a condition (undocumented limit change) that has no evidence other than the incident itself.
  *   **Phase 4 (Stopping):** H1 is tainted by ad hoc reasoning. H2 and H3 are weak.
  *   **Result:** **Indeterminate.**
  *   **Report:** Root Cause: "Unverified External Constraint." Action: "Implement client-side rate limiting telemetry to capture provider headers independently."

  #### Case 2: The Twin Failure
  **Incident:** Checkout service and Ledger service fail within 5 minutes of each other.
  **Leading Explanation (H1):** "Checkout DB locked." (Checkout Team)
  **Rival Explanation (H2):** "Ledger Cache eviction." (Ledger Team)
  **Evidence:** Both logs show errors. Neither team's logs show errors originating from the *other* service.
  **Procedure Run:**
  *   **Phase 1:** H1 (Checkout), H2 (Ledger), H3 (Shared Infrastructure/Network).
  *   **Phase 2:** H1 has perfect Scope for Checkout, zero for Ledger. H2 has perfect Scope for Ledger, zero for Checkout. H3 (Network) fits both but has low Mechanism (network team says green).
  *   **Phase 3:** H1 and H2 proponents refuse to amend; they claim the other service is a "victim," not a cause.
  *   **Phase 4 (Stopping):** H1 and H2 are tied in score (both explain half the incident). H3 is too vague. The gap between H1/H2 and H3 is large, but the gap between H1 and H2 is zero.
  *   **Result:** **Indeterminate: Coupled Failure.**
  *   **Report:** Root Cause: "Correlated Subsystem Failure." Action: "Decouple health checks; implement circuit breaker between Checkout and Ledger." (Note: We do not name a single subsystem as the root).

  ---

  ### The Auditor Letter

  **Context:** You have submitted a report marked "Indeterminate: Competing Hypotheses." The auditor has rejected it, citing: *"Root cause analysis must terminate in a root cause."*

  **Draft Paragraph:**

  > "We acknowledge the requirement for a definitive root cause; however, in complex distributed systems, enforcing a singular causal narrative where evidence supports multiple competing hypotheses introduces a compliance risk greater than ambiguity. Our review process adheres to the principle of Inference to the Best Explanation, which dictates that selecting a 'root cause' when the evidence margin between alternatives is statistically insignificant constitutes a fabrication of certainty. By reporting 'Indeterminate,' we are not declining to terminate the analysis, but rather accurately terminating it at the limit of our observability. The corrective action provided (enhanced telemetry to distinguish between the competing hypotheses) addresses the actual risk: the inability to distinguish cause, not the cause itself. Accepting a fabricated single cause would violate the integrity of the risk register by directing remediation efforts toward a potentially incorrect subsystem, leaving the true vulnerability unpatched."
