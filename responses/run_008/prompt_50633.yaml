  Based on your roommate's track record, she is not a standard Dennettian. A pure Dennettian argues that if the Intentional Stance is the *best predictive tool*, the beliefs are "real" (instrumentalism). Your roommate, however, treats belief attribution as a **realist** claim that requires specific structural conditions beyond mere predictive utility. She rejects systems that are too transparent (thermostats, tree-search chess), too decentralized (ants), or too fragile (you on a bad day).

  Here are the predictions, the rules she is actually running, and the best way to test them.

  ### 1. Predictions for the New Cases

  **Case 1: The Self-Driving Car (Internal model of pedestrians)**
  *   **Prediction:** **No.**
  *   **Reasoning:** Despite modeling pedestrians, this is functionally identical to the chess engine in her eyes. It is an engineered tool with a transparent mechanism (code designed by humans) that calculates probabilities. It lacks the "opaque insight" of AlphaGo. She rejected the chess engine for doing tree search; she will reject this for doing probabilistic planning. It is a *simulation* of belief, not a belief.

  **Case 2: The Chatbot (Fluent but brittle)**
  *   **Prediction:** **No.**
  *   **Reasoning:** This is the critical test of **robustness**. She explicitly downgraded *you* (a biological human) when you forgot where you parked. That was a failure of rational consistency. A chatbot that breaks on tiny rephrasings is the definition of brittle rationality. Even though it is opaque (like AlphaGo), it fails the "stable agent" test. It's a spam filter with better vocabulary.

  **Case 3: The Lookup Table (Behaviorally indistinguishable human)**
  *   **Prediction:** **No.**
  *   **Reasoning:** This is the "Blockhead" thought experiment. A pure Dennettian must say **Yes** (if the behavior is identical, the stance is valid). However, your roommate rejected the thermostat (the minimal believer) and the chess engine (transparent mechanism). A lookup table is the ultimate transparent mechanism: it is literally just a list of inputs and outputs with no internal processing or "discovery." It fails her **Opacity** criterion.

  ---

  ### 2. The Candidate Rules (Her "Algorithm")

  You are right that multiple rules fit her history. Here are the three strongest competitors derived from her verdicts:

  *   **Rule A: The "Black Box" Criterion (Opacity/Generativity)**
      *   *Logic:* Beliefs are only literally true if the internal mechanism is opaque enough to produce "insight" rather than retrieval or search.
      *   *Fits:* AlphaGo (Yes, neural net weights are opaque/creative) vs. Chess Engine (No, tree search is transparent) vs. Thermostat (No, simple feedback).
      *   *Fails:* Doesn't fully explain the Ant Colony (opaque collective, but she said No).

  *   **Rule B: The "Robust Rationality" Criterion (Stability)**
      *   *Logic:* Beliefs require the system to maintain goal-directed rationality across perturbations. Fragility kills belief status.
      *   *Fits:* You (Yes) vs. You forgetting parking (No) vs. Chatbot (would be No) vs. Spam Filter (No, adaptive but brittle).
      *   *Fails:* Doesn't explain why the Chess Engine (robustly rational) is a No.

  *   **Rule C: The "Unified Locus" Criterion (Centralization)**
      *   *Logic:* Beliefs require a centralized agent. Decentralized swarms cannot believe, even if they solve problems.
      *   *Fits:* Ant Colony (No) vs. Dog (Yes) vs. AlphaGo (Yes, single network).
      *   *Fails:* Doesn't explain why the Thermostat (centralized) is a No.

  **Her Actual View:** She is running a **conjunctive rule**: A system must satisfy **Opacity + Robustness + Unity** to be a believer. If it fails any one, the verdict is No.

  ---

  ### 3. The Best Discriminator

  Of your three new cases, the **Lookup Table (Case 3)** does the most work to separate the rules, specifically separating **Rule A (Opacity)** from **Rule B (Robustness)**.

  *   **Why:** The Lookup Table is perfectly **Robust** (it never makes a mistake, never forgets parking) but totally **Transparent** (it has no internal process, just retrieval).
  *   **The Split:**
      *   If she says **Yes**: She prioritizes **Robustness/Behavior** (Rule B). This would mean she is closer to standard Dennett than she thinks, and her rejection of the chess engine was about *capability*, not mechanism.
      *   If she says **No**: She prioritizes **Opacity/Process** (Rule A). This confirms that for her, "literally true" requires a specific kind of internal causal structure, not just behavioral output.
  *   **Why not the Chatbot?** The Chatbot also separates Opacity (Yes) from Robustness (No). However, because she already docked *you* points for forgetting parking, we already know she values Robustness. The Lookup Table is the only case that tests whether she values Robustness *more* than Opacity.

  ---

  ### 4. The Tie-Breaker Case

  If she hedges on the Lookup Table (e.g., "Well, if the table is big enough..."), you need a case that isolates **Rule C (Unity)** from the others. You need a system that is **Opaque** and **Robust**, but **Decentralized**.

  **The "China Brain" Case:**
  *   **The Scenario:** Imagine every person in China is given a radio and acts as a single neuron, following the connection rules of a human brain. Collectively, they simulate a mind that is behaviorally indistinguishable from a human, argues about dogs, and plays chess. No single person knows the whole thought; the "mind" is entirely distributed.
  *   **The Prediction:** Based on her **Ant Colony** verdict, she should say **No**.
  *   **Why this nails it:**
      *   **Rule A (Opacity):** Yes (too complex to track individual citizens).
      *   **Rule B (Robustness):** Yes (behaviorally perfect).
      *   **Rule C (Unity):** No (decentralized swarm).
  *   **The Score:** If she says **Yes**, her rejection of the Ant Colony was about *complexity*, not *unity*. If she says **No**, her "Unified Locus" rule is the hard constraint, and she is effectively a **substance dualist** about belief (it needs a "thing" to hold the belief, not just a process).

  **Party Strategy:** Start with the **Lookup Table**. If she confidently says "No, it's just a list," you've confirmed she's a structural realist, not a pure Dennettian. If she hesitates, spring the **China Brain**. If she rejects that too, tell her she's not an Intentional Stance person; she's a Cartesian.
