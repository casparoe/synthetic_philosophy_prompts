answer: |-
  Based on Dana's track record, she isn't running a simple "markets are good" or "markets are bad" algorithm. She is running a **conditional permissibility framework** that hinges on two specific failure modes: **Coercion by Necessity** and **Corruption of Civic Function.**

  Here is the breakdown of the rules, the predictions, the confidence levels, and the stress tests.

  ### The Candidate Rules

  **Rule 1: The "Coercion + Corruption" Framework (Most Likely)**
  *   **The Logic:** Market transactions are morally neutral *unless* one of two conditions is met:
      1.  **Coercion by Necessity:** The seller is acting out of dire need (poverty, disaster survival), which invalidates meaningful consent. (Explains: Poor kidney, hurricane generators, vote buying).
      2.  **Civic Corruption:** The transaction undermines a public good or democratic process. (Explains: Vote buying, potentially charity scalping).
  *   **Why it fits:** It explains why regular ticket scalping is fine (no necessity, private good) but generator gouging is wrong (survival necessity). It explains why plasma is fine (usually supplemental income) but a poor man's kidney is wrong (debt/survival). It explains her defensiveness on surrogacy: she has to argue the "well-compensated professional" angle to prove the *Coercion* condition isn't met.

  **Rule 2: The "Essential vs. Luxury Access" Framework (Strong Contender)**
  *   **The Logic:** You can buy *comfort* or *convenience*, but you cannot buy *access* to essential goods or rights.
  *   **Why it fits:** Legroom (comfort) = Fine. Line standing for a restaurant (convenience) = Fine. Generators (survival essential) = Wrong. Votes (civic right) = Wrong.
  *   **The Tension:** This rule struggles slightly with the kidney/plasma distinction unless you classify kidneys as "essential bodily integrity" and plasma as "renewable fluid." It also makes the "Poor man" specification on the kidney verdict redundant (if kidneys are essential, *any* sale should be wrong).

  ### Predictions on the New Cases

  Here is how Dana likely rules on the four new cases, ranked by my confidence in the prediction.

  **1. The Broke Student Selling Eggs**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** This is the cleanest match for her "Poor man selling kidney" verdict. The bodily risk is lower than a kidney (more like plasma), but the *economic coercion* is identical ("only way she can stay in school"). Under Rule 1, the desperation invalidates the consent. Under Rule 2, education is arguably an essential good, but the coercion argument is stronger.
  *   **Confidence:** **High.** The "broke/only way" language mirrors the "poor/debts" language of the kidney case too perfectly to ignore.

  **2. The Hospital VIP Queue Fee**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** This distinguishes "comfort" from "care." Airline legroom is comfort; hospital appointments are health/survival. This aligns with the hurricane generator verdict (essential goods during need cannot be marketized). Even if the patient isn't in an emergency, healthcare is treated as a necessity class distinct from restaurants or airlines.
  *   **Confidence:** **High.** Dana draws a hard line at survival necessities (generators), and healthcare fits that bucket better than legroom.

  **3. The Charity Benefit Scalper**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** Regular scalping is fine because it's a private entertainment contract. A *charity benefit* introduces a civic/community purpose. Buying out the allotment undermines the *purpose* of the event (community support/fundraising access), similar to how buying votes undermines the purpose of an election. It shifts from "private commerce" to "corruption of a public good."
  *   **Confidence:** **Medium.** This depends on whether Dana views the "charity" label as decorative or substantive. If she views the ticket purely as a property right, she might say Fine. But given her stance on vote-buying, I suspect she sees the *purpose* of the queue as morally relevant.

  **4. The Tech Worker Selling a Kidney**
  *   **Verdict:** **Fine.** (But see confidence below).
  *   **Reasoning:** This is the critical test of Rule 1. If her ban on the "poor man" was about *poverty*, then a "comfortably-off" seller removes the coercion, making the transaction valid (like the professional surrogate). If her ban was about *organs*, she would still say Wrong. Given she allows surrogacy (deep bodily involvement) provided the compensation is high/professional, I predict she applies the same logic here: Wealth validates consent.
  *   **Confidence:** **Low.** (This is the bet I'd least take).

  ### Where the Rules Split (The Stress Points)

  The friction between **Rule 1 (Coercion)** and **Rule 2 (Essential/Bodily Integrity)** creates specific fault lines in your session.

  *   **The Kidney Split:** If Dana says the Tech Worker case is **Wrong**, she is running a **Bodily Integrity Rule** (organs are never for sale, regardless of wealth). If she says **Fine**, she is running a **Coercion Rule** (organs are for sale if you aren't desperate). Her defensiveness on surrogacy suggests she *wants* to believe the Coercion Rule, but fears the Bodily Integrity counter-argument.
  *   **The Queue Split:** If Dana says the Hospital VIP fee is **Fine**, she is running a pure **Market Liberty Rule** (queues are just time, time is money). If she says **Wrong**, she is running an **Essential Access Rule** (you can't buy access to necessities). The Airline Legroom verdict makes this tricky; she must distinguish *comfort* (legroom) from *care* (hospital).

  ### The Tie-Breaker Case

  To definitively distinguish whether Dana is running the **Coercion Rule** or a **Civic Integrity Rule**, propose this case:

  **"A wealthy person paying a substitute to serve their mandatory jury duty."**

  *   **Why it works:**
      *   **Coercion Rule Prediction:** **Fine.** The substitute is presumably willing and compensated; the wealthy person is not desperate. There is no economic coercion.
      *   **Civic Integrity Rule Prediction:** **Wrong.** Jury duty is a civic obligation, like voting. Allowing substitution corrupts the "peer" aspect of a jury of peers, similar to vote-buying.
  *   **Why it's better than the Tech Kidney:** The kidney case is muddied by bodily integrity concerns. Jury duty is purely about civic obligation vs. market convenience, which cleanly separates her "Vote Buying" (Wrong) verdict from her "Line Standing" (Fine) verdict.

  ### Honesty Check: The Shaky Prediction

  I am flagging **Case 1 (The Tech Worker Kidney)** as the prediction I would bet least on.

  **Why:** It is the only case that directly contradicts the *specific wording* of her past verdict ("Poor man... wrong"). While logic suggests the variable is the poverty, human moral intuition often has a "yuck factor" regarding organ sales that persists regardless of wealth. Her defensiveness about surrogacy shows she is aware of the "bodily commodification" slippery slope. She might rule the Tech Worker case **Wrong** simply to avoid sliding down that slope, even if her "Coercion Rule" logically permits it. It is the point where her stated principles are most likely to crack under the weight of visceral intuition.
