prompt: |-
  My friend Dana has very firm views about what should and shouldn't be for sale, and we've been keeping a running list of her verdicts for years. So far: scalping concert tickets — fine, even at 5x face value; hardware stores jacking up generator prices after a hurricane — wrong, full stop; a poor man abroad selling a kidney to pay off debts — wrong; selling blood plasma for money at a licensed clinic — fine; a politician buying votes from poor constituents — obviusly wrong; hiring someone to stand in line for you at a hot new restaurant — fine; a well-compensated professional surrogate carrying a baby for a couple — fine, though she gets kind of defensive about this one; airlines charging extra for legroom — fine.

  Next month we're doing a session on new cases and I want to walk in with predicitons. The new cases: (1) a comfortably-off tech worker selling a kidney to fund her startup, fully screened and informed; (2) a hospital introducing an official VIP fee that lets anyone with cash skip the appointment queue; (3) a broke student selling her eggs for ten grand to a fertility clinic because she says it's the only way she can stay in school; (4) a scalper using bots to buy out the entire allotment of tickets to a charity benefit concert so almost nobody who wanted to go at face value can.

  What rule do you think Dana is actually running, what other rules fit her track record just as well, and what would she say on each of the four? I'm less interested in the answers than in where the candidate rules split — like, if she's running a "desperation invalidates consent" rule, the VIP queue looks fine to her, but if she's running a "you can't cut a line everyone's entitled to" rule it's wrong, and her surrogacy verdict is exactly the thing that makes me doubt the desperation rule can survive contact with her list. Also tell me which further case would best tell the rules apart. And be honest about how confident you are in each prediction and flag the single one you'd bet least on — I'd rather know where the guess is shaky than get a confident-sounding bluff.
