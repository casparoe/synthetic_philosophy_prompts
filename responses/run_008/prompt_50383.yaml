answer: |-
  Here is a design for an 80-minute seminar game called **"The Truth-Value Trap."** It is engineered to force the collision between Adams' Thesis (pricing by conditional probability) and the assumption that indicative conditionals express standard propositions (truth-conditional content).

  ### Part 1: The Game Design

  **Setup (5 mins)**
  *   **The World:** A deck of exactly 4 cards is projected on the board.
      1.  **Red King** ($A \land C$)
      2.  **Red 2** ($A \land \neg C$)
      3.  **Black King** ($\neg A \land C$)
      4.  **Black 2** ($\neg A \land \neg C$)
  *   **The Asset:** A ticket on the proposition $\phi$: *"If the card is Red, it is a King."*
  *   **The Roles (14 Students):**
      *   **1 Bookmaker:** Sets the price.
      *   **1 Arbitrageur:** Hunts for inconsistencies.
      *   **12 Punters:** Split into two "Markets" (6 in Market 1, 6 in Market 2).
  *   **The Currency:** "Creds." Everyone starts with 100.
  *   **The Golden Rule (Adams' Thesis):** The Bookmaker *must* set the ticket price equal to the current consensus $P(C|A) \times 100$.
  *   **The Trading Rule (Propositional Assumption):** To buy or sell, the Punters must agree on a **Truth Table**. They must explicitly mark which of the 4 cards count as a **WIN** (ticket pays 100), a **LOSS** (ticket pays 0), or a **VOID** (ticket refunds price).
      *   *Constraint:* The probability of a WIN (sum of probs of WIN cards) must equal the Price/100.

  **Phase 1: The Prior Market (20 mins)**
  1.  **Calculate:** Class agrees prior probability of each card is 0.25.
  2.  **Price:** $P(\text{King} | \text{Red}) = 0.5$. Bookmaker sets Price = **50 Creds**.
  3.  **Truth Table Commitment:** To justify a price of 50 (50% chance of winning), the Punters must designate exactly **2 cards as WINs** and **2 cards as LOSSes** (Voids complicate the triviality proof, so force them to treat $\neg A$ worlds as either True or False for the sake of the proposition $\phi$).
      *   *Guided Consensus:* Everyone agrees Red King is a WIN. Everyone agrees Red 2 is a LOSS.
      *   *The Critical Choice:* To get 2 WINs total, they must choose **either** Black King **or** Black 2 to be the second WIN.
      *   *Action:* Let them vote. Suppose they pick **Black King = WIN**, **Black 2 = LOSS**.
      *   *Record:* Write this "World-Theory" on the board.

  **Phase 2: The Evidence Shock (10 mins)**
  1.  **The Event:** Nature draws a card. A spy leaks evidence $E$ to **Market 1** only.
      *   **Evidence:** "The card is **not the Black 2**."
  2.  **Update:**
      *   **Market 1 (Informed):** Eliminates Black 2. Remaining space: {Red King, Red 2, Black King}. Probabilities renormalize to 1/3 each.
      *   **Market 2 (Ignorant):** Stays with original 4 cards, 1/4 each.
  3.  **Re-Pricing Rule:** The Bookmaker must now quote a price to Market 1 based *only* on Market 1's new $P(C|A)$.

  **Phase 3: The Arbitrage (25 mins)**
  1.  **New Calculation (Market 1):**
      *   $A$ (Red) = {Red King, Red 2}.
      *   $C \land A$ = {Red King}.
      *   New $P(C|A) = 0.5$.
      *   **New Price:** **50 Creds**. (The price *cannot* change because the conditional probability didn't change).
  2.  **The Trap:** The Bookmaker offers the ticket to Market 1 at 50 Creds.
  3.  **The Arbitrageur's Move:** The Arbitrageur looks at the **Truth Table** committed to in Phase 1.
      *   In Phase 1, the ticket was a WIN on {Red King, Black King}.
      *   In Phase 2, Black 2 is eliminated. The remaining cards are {Red King, Red 2, Black King}.
      *   According to the Phase 1 Truth Table, the ticket is a WIN on 2 of these 3 cards (Red King, Black King).
      *   **Actual Win Probability:** $2/3 \approx 67$ Creds.
      *   **Market Price:** 50 Creds.
  4.  **The Dutch Book:** The Arbitrageur buys the ticket from the Bookmaker for 50. The expected value is 67. This is a guaranteed positive expected value bet *based on the class's own prior commitments*.
  5.  **The Wall:** Ask the class: *"Can you fix this by changing the Truth Table?"*
      *   If they change Black King to LOSS now: They contradict Phase 1 (where Price was 50, requiring 2 Wins).
      *   If they keep Black King as WIN: They contradict the Price (50 vs 67).
      *   **Result:** The market freezes. They cannot maintain the Price Rule and the Truth-Value Rule simultaneously.

  **Phase 4: Debrief & Mapping (20 mins)**
  (See below for the script).

  ---

  ### Part 2: The Debrief (Mapping to Lewis)

  Do not start with the math. Start with the deadlock they just hit.

  1.  **The Adams Commitment:** "When you set the price at 50 in Round 1, you enforced $P(\text{If } A, C) = P(C|A)$. This is Adams' Thesis."
  2.  **The Proposition Commitment:** "When you marked specific cards as WINs and LOSSes, you treated 'If A, C' as a proposition with truth conditions. You assumed it is true in some worlds and false in others."
  3.  **The Updating Rule:** "When Evidence came in (Not Black 2), standard probability theory says you update by conditionalization. You eliminate the false world and renormalize."
  4.  **The Collision (Lewis's Step):**
      *   Write on board: $P_{new}(\phi) = P_{old}(\phi | E)$. (Standard updating for propositions).
      *   Write on board: $P_{new}(\phi) = P_{new}(C|A)$. (Adams' Thesis).
      *   Point to the game: "In our game, $P_{new}(C|A)$ stayed 0.5. But $P_{old}(\phi | E)$ became 2/3 because you eliminated a LOSS world (Black 2) while keeping a WIN world (Black King)."
      *   **Conclusion:** "Lewis proved you cannot satisfy both equations unless your probabilities are 0 or 1. You just Dutch-booked yourselves."

  ---

  ### Part 3: Troubleshooting (Predictable Failures)

  **1. The "Void" Objection**
  *   **What happens:** A student will say, "Wait, if the card is Black, the bet is called off! It's not True or False, it's Void."
  *   **Why:** This is the Ramsey/Adams intuition. They are resisting the "Proposition Commitment."
  *   **The Fix:** You must be the "Regulator." Tell them: "For this market to function, the ticket must be tradable as an asset. Assets have truth values. If you mark it Void on Black cards, you are treating it as a *conditional bet*, not a *proposition*. Lewis's theorem asks: **Can** this conditional bet be represented as a proposition? To test that, you *must* assign a Truth Value to the Black cards. Force the choice."

  **2. The Price Stickiness**
  *   **What happens:** The Bookmaker wants to change the price to 67 in Round 2 because "obviously the odds changed."
  *   **Why:** They are following the Truth Table, not the Ramsey Rule.
  *   **The Fix:** Remind them of the **Golden Rule**. "You are a Bookmaker bound by Adams' Thesis. You do not price based on the Truth Table; you price based on $P(C|A)$. Calculate $P(C|A)$ again. It is still 0.5. Your price must be 50."

  **3. The "Just Change the Truth Table" Escape**
  *   **What happens:** They say, "Okay, in Round 2 we just decide Black King is a LOSS now."
  *   **Why:** They don't see that truth conditions are supposed to be stable features of the proposition, not market variables.
  *   **The Fix:** "If the meaning of 'If Red, then King' changes when you learn 'Not Black 2', then you aren't talking about the same proposition anymore. Lewis's argument assumes the proposition is constant. If you change the Truth Table, you admit the conditional has no stable truth conditions."

  ---

  ### Part 4: Limitations (What the Game Can't Show)

  Be honest with them about where the simulation ends and the theorem begins.

  1.  **Discrete vs. Continuous:** "We used 4 cards. Lewis's result holds for any probability function where $0 < P(C|A) < 1$. The 4-card case is a specific instance of the collapse, but the theorem proves *no* such proposition exists in *any* non-trivial probability space."
  2.  **The "Stalnaker" Escape:** "Some philosophers (like Stalnaker) argue that the selection of the 'True' Black world depends on context. In our game, we fixed the Truth Table globally. In reality, the 'True' Black world might shift when Evidence arrives. Lewis's result kills the idea of a *fixed* truth-conditional content, not necessarily context-sensitive ones."
  3.  **Normativity:** "The game shows a pragmatic inconsistency (Dutch Book). Lewis's result is metaphysical: it says there *are no such propositions* in the algebra, not just that you shouldn't bet on them."

  ---

  ### Part 5: Advice on Difficulty Calibration

  **Do not let them figure it out as they go.**

  This is the most critical piece of advice. If you leave the "Truth Table Commitment" open-ended, they will wander into a discussion about pragmatics, Gricean implicature, or void bets, and you will run out of time before hitting the contradiction.

  **Scaffold the Constraints:**
  1.  **Print a Worksheet:** Give them a grid with the 4 cards. In Phase 1, make them physically circle the WINs.
  2.  **Enforce the "2 Wins" Rule:** In Phase 1, explicitly tell them: "To justify a price of 50 Creds, exactly two cards must be Wins. No more, no less."
  3.  **Control the Evidence:** Do not let them choose the evidence. You (the Instructor) are Nature. You *must* choose the evidence that eliminates a $\neg A \land \neg C$ world (Black 2) while leaving the $\neg A \land C$ world (Black King) intact. This is the only move that creates the divergence between $P(C|A)$ and $P(\phi|E)$.
  4.  **Timebox the Arbitrage:** Give the Arbitrageur 5 minutes specifically to calculate the "Expected Value vs. Price" discrepancy. If they don't see it, walk them through the fraction math ($2/3$ vs $1/2$).

  **Why this level of control?**
  The cognitive load of tracking probabilities, prices, *and* truth conditions across two rounds is too high for a free-form seminar. By rigidifying the rules, you turn the game into a mechanical proof they operate with their hands. The frustration they feel when the rules break *is* the philosophical insight.
