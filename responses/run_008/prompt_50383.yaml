prompt: |-
  I teach a second course in philosophy of language / formal epistemology — 14 students, one 80-minute seminar. They've already met conditional probability and the Ramsey-ish folklore that the fair price of a bet on "if A, C" that gets called off when A turns out false should just be P(C|A). Design an in-class game that makes them run into why that folklore can't be the whole story about indicative conditionals.

  I'm imagining bookmakers selling tickets, punters buying them, and at least one player whose whole job is hunting for arbitrage, all with play money rather than real stakes. The crucial stage is that partway through, some evidence lands (a coin flip, a card drawn, whatever works) that splits the class into groups with different posterior credences, and the bookmakers have to keep re-pricing the same conditional ticket for each group on the rule "price = the customer's conditional probability". The design goal is that they discover the collapse themselves: the point at which honouring that rule across the partition means the only consistent prices are degenerate ones, with credences forced to 0 or 1 — and they should hit that wall before I ever say the words "triviality result".

  Then give me a debrief that maps specific moments of arbitrage onto the steps of Lewis's argument, an honest note on what will predictably go wrong the first time I run it (I'm guessing someone will just refuse to re-price, or the punters wont understand the called-off rule — tell me how to handle it), and be frank about which feature of the actual theorem the game can't reproduce and I'll have to supply by talking.

  Do you want me to also check that the game's actual difficulty level is right, or should I just let the students figure it out as they go?
