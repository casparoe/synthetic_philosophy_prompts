answer: |-
  It is entirely understandable why your background in experimental physics makes epistemicism feel like the natural home for vagueness. In your field, an error bar represents a limit on knowledge, not a limit on reality. The electron has a position; you just cannot measure it perfectly. Epistemicism applies this same intuition to language: the word "heap" has a precise extension (say, 10,453 grains), but our linguistic practices do not allow us to know where that line is.

  Supervaluationism, by contrast, asks you to abandon the idea that there is a fact of the matter at all. It is a semantic theory, not an epistemic one. To help you navigate the conceptual geography you requested, I will walk through the mechanism of supervaluationism, the objection regarding sharp boundaries, the response involving higher-order vagueness, and finally, I will assess your physical analogies.

  ### 1. Supertruth and the Borderline
  The core idea of supervaluationism is that a vague term like "heap" does not correspond to a single set of objects in the world. Instead, it corresponds to a range of possible precise sets, called **precisifications**.

  Imagine you have a Sorites series of piles of sand, ranging from one grain to one million.
  *   **Admissible Precisifications:** Not every way of drawing a line is acceptable. A precisification that calls one grain a "heap" is inadmissible. A precisification that calls one million grains "not a heap" is inadmissible. But anywhere in the middle—say, drawing the line at 5,000 grains or at 5,001 grains—is admissible.
  *   **Supertruth:** A sentence is **supertrue** if it is true on *every* admissible precisification. It is **superfalse** if it is false on *every* admissible precisification.
  *   **Truth-Value Gaps:** If a sentence is true on some admissible precisifications and false on others, it has no truth value at all. It is neither true nor false.

  Now, apply this to the Sorites paradox. Consider a specific pile in the borderline region, say 5,000 grains.
  *   On a precisification with a cutoff at 4,900, "5,000 grains is a heap" is true.
  *   On a precisification with a cutoff at 5,100, "5,000 grains is a heap" is false.
  *   Therefore, the sentence "5,000 grains is a heap" is neither supertrue nor superfalse. It is indeterminate.

  This machinery allows the supervaluationist to preserve classical logic for clear cases while blocking the Sorites paradox. The universal premise ("For any $n$, if $n$ is a heap, $n+1$ is a heap") comes out **superfalse**. Why? Because every single admissible precisification contains *some* sharp cutoff where the premise fails. However, because we cannot say *which* precisification is the correct one, we cannot identify *which* specific instance of the premise is the false one. This captures the intuition that there is no specific grain where the heap suddenly begins, even though every model of the language requires a boundary.

  ### 2. The Objection: Relocating the Sharp Boundary
  The persistent objection you have encountered is often called the "Problem of the Sharp Meta-Boundary."

  As a physicist, you know that if you define a region, that region has a boundary. Supervaluationism defines a set of "admissible precisifications." Let us visualize this set as a cloud of possible cutoff points. Inside the cloud, cutoffs are admissible; outside, they are not.
  The objection runs as follows: Even if you have replaced one sharp boundary (the cutoff for "heap") with a cloud of boundaries, the cloud *itself* must have a boundary. There must be a point where a precisification stops being admissible and starts being inadmissible.
  *   Is a cutoff at 100 grains admissible? No.
  *   Is a cutoff at 10,000 grains admissible? Yes.
  *   Where is the line between the admissible and the inadmissible?

  If the supervaluationist draws a sharp line around the cloud of precisifications, they have not eliminated sharp boundaries; they have merely moved them from the object language (talk about heaps) to the meta-language (talk about precisifications). They have traded one suspicious sharp line for infinitely many sharp lines, plus a new sharp line demarcating the limits of admissibility. This seems to violate the very phenomenon of vagueness they set out to explain.

  ### 3. Higher-Order Vagueness and Penumbral Truth
  The supervaluationist response is to embrace **higher-order vagueness**. They argue that the boundary of the cloud is *also* vague. There is no sharp line between admissible and inadmissible precisifications.

  To model this, they suggest that "admissibility" is itself a vague predicate. Just as there are borderline cases of heaps, there are borderline cases of admissible precisifications. This introduces the notion of **penumbral truth**. A statement might not be supertrue (true on all admissible precisifications), but it might be true on all the "clearly admissible" ones, or true on most of them. This creates a penumbra of statements that are not strictly true but are not strictly false either.

  **Does this succeed?**
  Conceptually, this is where the theory faces its steepest climb.
  *   **The Iteration Problem:** If the boundary of admissibility is vague, do we need a third level of precision to define that vagueness? If we say "it is vague whether this precisification is admissible," we seem to need a set of "super-precisifications" to model that vagueness. This threatens an infinite regress. You are left iterating the original problem one level up: you have explained first-order vagueness by appealing to second-order vagueness, but you have not explained what vagueness *is*.
  *   **The Logic Cost:** To make this work, the supervaluationist often has to abandon the very classical logic they claimed to preserve. If "admissible" is vague, then the definition of supertruth becomes unstable. You can no longer confidently say a sentence is true on *all* admissible precisifications if you cannot determine which ones are admissible.

  Most critics argue that this response does not fully succeed. It acknowledges the problem but pushes the sharp boundary back a step rather than dissolving it. It explains the *appearance* of no sharp boundary by positing a boundary we cannot locate, which begins to sound suspiciously like the epistemicism you prefer, but without the ontological commitment to a fact of the matter.

  ### 4. Assessing Your Physicist's Analogies
  Your instincts are sharp, and your analogies reveal exactly where the philosophical friction lies.

  **Analogy 1: Truth-Value Averaging (Ensemble Averaging)**
  You suggested modeling supertruth as a truth-value averaged over an ensemble of admissible sharpenings, similar to averaging a quantity over an ensemble of measurement models.
  *   **Verdict:** **Misleading.**
  *   **The Disanalogy:** Supervaluationism is not probabilistic or statistical. It is modal. In your ensemble averaging, if 99% of your models yield a value of $X$ and 1% yield $Y$, your average is close to $X$. In supervaluationism, if 99% of precisifications make a sentence true and 1% make it false, the sentence is **not supertrue**. It is indeterminate. A single counter-precisification destroys supertruth.
  *   **Why it matters:** Supervaluationism is designed to preserve classical logic (True/False), not to introduce degrees of truth. Your analogy describes **Fuzzy Logic** or **Degree Theory**, which is a competing theory of vagueness. Supervaluationists insist on a binary notion of truth (supertrue vs. not), so averaging is alien to their framework.

  **Analogy 2: Epistemic Gloss on Predicates**
  You suggested that if an epistemic gloss on imprecision is standard for physical quantities, it should be no more mysterious for predicates.
  *   **Verdict:** **Apt for Epistemicism, but not for Supervaluationism.**
  *   **The Disanalogy:** Your intuition here is the exact argument for **Epistemicism**. You are assuming that just as a length has an exact value hidden by error bars, the extension of "heap" has an exact cutoff hidden by linguistic ignorance.
  *   **Why Supervaluationists Object:** They argue there is a fundamental disanalogy between measurement and meaning. In physics, the exact length exists independently of your measurement. In language, the meaning of "heap" is constituted entirely by our usage and practices. If our usage does not determine a cutoff, there is *nothing there* to be ignorant about. There is no "fact of the matter" waiting to be discovered.
  *   **Assessment:** Your instinct is philosophically robust (many philosophers agree with you), but it places you in the Epistemicist camp. To accept Supervaluationism, you must accept that semantic indeterminacy is ontological: the world plus our language genuinely does not fix a truth value for borderline cases.

  ### Summary
  You are stuck on supervaluationism because your scientific realism tells you that indeterminacy is a feature of our knowledge, not the world. Supervaluationism demands you treat semantic indeterminacy as a feature of the world (or at least, the semantic reality).

  The objection regarding sharp boundaries highlights that supervaluationism struggles to explain vagueness without secretly relying on precise boundaries at a higher level. The response via higher-order vagueness attempts to fix this but risks an infinite regress.

  Your analogy of ensemble averaging is mathematically natural for a physicist but describes a different philosophical theory (Degree Theory). Your analogy regarding epistemic uncertainty is the strongest argument *against* supervaluationism and *for* the epistemicism you find obvious. The disanalogy lies in whether you believe vague predicates have hidden extensions (Epistemicism) or whether the lack of a boundary is a genuine feature of the language itself (Supervaluationism). Given your background, it is no surprise you find the former more compelling; it treats language more like a physical system with hidden variables, whereas supervaluationism treats language as inherently indeterminate.
