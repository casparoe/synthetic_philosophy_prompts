answer: |-
  This is a remarkably sharp dissection of the current ethical landscape. You have identified exactly where the seams show in reproductive ethics. As a philosopher working in this field, I often find myself defending practices that, when laid out side-by-side as you have done, look logically inconsistent.

  You are asking for the *underlying theory* that makes this patchwork cohere, or an admission that it doesn't. To answer this properly, I need to resist the urge to immediately reach for the "slippery slope" or "eugenics" labels, as those are often conversation-stoppers rather than explanations. Instead, let's treat this as a problem in normative ethics and metaphysics.

  I am going to structure this response by first mapping the competing theoretical frameworks (the "brainstorming" phase), then evaluating which one best explains current practice, and finally answering your specific question about the fault line between "avoiding the worst" and "selecting the best."

  ### Phase 1: Mapping the Theoretical Landscape

  Let's lay out the three main ethical frameworks that usually compete in this space. We can test current practices against each to see which one fits.

  **1. The Person-Affecting View (The "Harm" Model)**
  *   **Core Claim:** An action is wrong only if it makes some *particular* person worse off than they would otherwise have been.
  *   **Application to Embryos:** If I discard Embryo A (Tay-Sachs) and implant Embryo B (Healthy), have I harmed Embryo A? No, because Embryo A never becomes a person. It has no interests to violate.
  *   **The Problem:** This view struggles to explain why we think screening is *obligatory*. If no one is harmed by having Tay-Sachs (because that specific child wouldn't exist otherwise), why is it better to screen?
  *   **Fit with Practice:** Poor. Current practice treats screening as a medical good, almost a duty. The Person-Affecting view suggests it's morally neutral.

  **2. The Impersonal View (The "Total Value" Model)**
  *   **Core Claim:** We should maximize the total amount of well-being in the world, regardless of *who* exists. A world with a happy person is better than a world with a suffering person, even if they are different people.
  *   **Application to Embryos:** Selecting the healthy embryo creates more net utility. Selecting the "smarter" embryo also creates more net utility.
  *   **The Problem:** This view licenses *everything*. If you have a duty to maximize utility, you have a duty to pick the embryo with the highest polygenic score for IQ, health, and conscientiousness. It also leads to the "Repugnant Conclusion" (maximizing population size over quality).
  *   **Fit with Practice:** Partial. It explains disease screening, but it contradicts the ban on enhancement/sex selection. If we were pure utilitarians, the "designer baby" discourse wouldn't be taboo; it would be mandatory.

  **3. The Threshold View (The "Satisficing" Model)**
  *   **Core Claim:** Parents have an obligation to ensure their child has a life *worth living* (or above a minimum threshold of decency), but they do not have an obligation to maximize the child's potential.
  *   **Application to Embryos:** You must avoid conditions that dip below the threshold (Tay-Sachs). You are not required to boost conditions that are already above it (IQ, Height).
  *   **Fit with Practice:** High. This aligns perfectly with the "screen disease, don't select enhancement" norm.
  *   **The Problem:** Where is the line? Is being 5'5" below the threshold? Is an IQ of 85? The threshold is notoriously vague.

  ### Phase 2: Solving the "Who Got Helped?" Puzzle

  You asked: *When you pass over the Tay-Sachs embryo... who exactly got helped?*

  If we accept the **Non-Identity Problem** (formulated by Derek Parfit), we must admit that the child born is not the "victim" of the disease who was saved. The child born is a *different* individual than the one who would have had Tay-Sachs.

  So, who is the beneficiary? Current practice quietly relies on a hybrid of two justifications:

  1.  **Impersonal Harm Reduction:** The world contains less suffering. The genetic counselor speaks of the "future child" as a shorthand for "the child who will exist in this slot." It is a useful fiction. We treat the *role* of "the child" as having rights, even if the *occupant* of the role changes.
  2.  **Parental Integrity:** The help is partly for the *parents' moral agency*. We recognize that bringing a child into existence with a known, severe suffering condition violates the parents' duty of stewardship. The "help" is preserving the moral coherence of the family unit.

  **The Philosophical Cost:** To make this work, we have to accept that "harm" in reproduction doesn't mean "making someone worse off than they were" (since they weren't), but "creating someone in a worse state than the alternative available." This is a subtle but crucial shift. It moves us from a *comparative* harm model (you vs. your past self) to a *counterfactual* harm model (you vs. the possible you).

  ### Phase 3: The Donor vs. Embryo Asymmetry

  This is the most glaring inconsistency you noted. Why is picking a tall sperm donor fine, but picking a tall embryo taboo?

  There is no clean *ethical* distinction here. The distinction is largely **institutional and historical.**

  1.  **The Medical Model vs. The Market Model:** Fertility clinics operate under a medical license. Their mandate is "health." Sperm banks operate closer to a matchmaking service. When you pick a donor, it is framed as "choosing a partner" (a natural process), whereas embryo selection is framed as "manufacturing" (an artificial process).
  2.  **The Natural Lottery Intuition:** Selecting a donor feels like influencing the *odds* of the natural lottery. Selecting an embryo feels like *rigging* the lottery after the tickets have been printed. Ethically, the outcome is the same (a child with specific genetics), but the *agency* feels different.
  3.  **Predictability:** Donor traits are probabilistic (tall dad + tall mom ≠ tall kid). PGT (Preimplantation Genetic Testing) is becoming deterministic. We are more comfortable with probabilistic enhancement than deterministic selection.

  **Verdict:** You are right to be suspicious. This asymmetry is largely "vibes" codified into law. It rests on a distinction between *pre-conception* choice (donor) and *post-conception* choice (embryo), even though IVF blurs that line completely. If we were consistent, either both should be regulated or neither.

  ### Phase 4: The Fault Line (Satisficing vs. Maximizing)

  Now to your core question: *What view of parental obligation does this presuppose, and what changes if we shift it?*

  Current practice presupposes a **Principle of Harm Avoidance** (Threshold View).
  *   **Obligation:** Do not create a child who will suffer significantly.
  *   **Permission:** You may allow chance to determine other traits.

  The rival view is Julian Savulescu's **Principle of Procreative Beneficence**.
  *   **Obligation:** Parents are morally obligated to select the child, of the possible children they could have, who is expected to have the best life, or at least as good a life as the others.

  **If we shifted from Harm Avoidance to Procreative Beneficence, here is what breaks:**

  1.  **The End of "Random" Genetics:** If you are obligated to select the *best* embryo, you are obligated to use PGT-P (polygenic testing) for IQ, health, and personality. Refusing to screen becomes negligence.
  2.  **The Obligation to Edit:** If gene editing (CRISPR) becomes safe, the Maximizing View suggests you are *obligated* to use it. Not editing your child to be immune to HIV or cancer would be akin to refusing a vaccine.
  3.  **Sibling Valuation:** If you have multiple children, and you maximized for the first but not the second (due to cost or embryo availability), have you wronged the second? The Maximizing View introduces a comparative justice issue between siblings that the Threshold View avoids.
  4.  **The Right to an Open Future:** Feinberg argued children have a right to an open future. Enhancement might *close* futures (e.g., selecting for extreme musical talent might pressure the child into music). The Threshold View protects the child's right to define themselves; the Maximizing View risks pre-loading their identity.

  ### Phase 5: Where is it Underdetermined?

  You asked where several theories could license the same practice.

  **Sex Selection:**
  *   *Theory A (Liberty):* Parents have reproductive liberty; sex selection is fine.
  *   *Theory B (Social Harm):* Sex selection leads to demographic imbalances (as seen in parts of Asia); therefore, ban it.
  *   *Theory C (Expressivist):* Selecting sex expresses a preference for one gender over another, which is sexist.
  *   *Current Practice:* Bans sex selection (in many countries). This aligns with Theory B and C, but overrides Theory A. However, if the reason is purely "Social Harm," then in a country with no demographic imbalance (like the US), it should be permitted. The fact that clinics often ban it anyway suggests they are adopting the Expressivist view voluntarily to avoid stigma.

  **Disease Screening:**
  *   *Theory A (Utilitarian):* Less suffering is good.
  *   *Theory B (Expressivist Objection):* Screening against disability says "disabled lives are not worth living," which harms existing disabled people.
  *   *Current Practice:* Ignores Theory B. This suggests society has implicitly decided that the *impersonal value* of reducing suffering outweighs the *expressive harm* to the disability community. This is a fragile consensus.

  ### Conclusion: The Coherent Line (or lack thereof)

  Is there a coherent line? **Yes, but it is a "Medical Model" line, not a purely ethical one.**

  The arrangement presupposes that **reproduction is a medical event first, and a moral event second.**
  1.  **Medical Mandate:** Fix pathology (Tay-Sachs).
  2.  **Market Permission:** Allow consumer choice where medicine ends (Donor traits).
  3.  **Ethical Constraint:** Do not allow medical technology to override social equality (No sex selection, no IQ enhancement).

  The fault line you sensed is the transition from **Negative Eugenics** (preventing the "unfit" from being born, framed as health) to **Positive Eugenics** (encouraging the "fit," framed as enhancement).

  If you believe parents are obligated to select for the *best-off* possible child (Maximizing), the current system collapses. You would need to mandate embryo screening for all IVF cycles, subsidize genetic enhancement for the poor (to prevent inequality), and likely restrict the reproductive liberty of those who refuse to optimize (just as we restrict parents who refuse life-saving medical treatment for existing children).

  The current practice is a compromise: it uses the language of *health* to do the work of *selection*, while drawing a shaky line at *enhancement* to avoid the historical trauma of eugenics. It is not logically airtight, but it is socially functional. It allows us to reduce suffering without accepting the burden of optimizing humanity.

  **My Professional Assessment:**
  The "vibes" you detect are the friction between **Person-Affecting Ethics** (which governs how we treat existing people) and **Impersonal Ethics** (which governs how we select future people). We pretend the embryo is a patient to justify screening, but pretend it isn't a person to justify discarding. We pretend donor selection is "natural" to justify enhancement, but call embryo selection "artificial" to ban it.

  It is a patchwork. But it is a patchwork designed to keep the Non-Identity Problem from dissolving our moral intuitions entirely. If we were fully consistent, we would either have to stop screening (because no one is harmed) or start maximizing (because we should always choose the best). We do neither. We choose the middle path: *avoid the tragic, accept the mundane.*
