prompt: |-
  I work as a risk analyst at a mid-sized consultancy, and an uncomfortable amount of my job is producing probability numbers before we have any real data. A client's board wants "a prior probability" that a merger clears regulatory review, that a supplier is the one who causes a delay, that a prototype exceeds some spec, and my manager's standard line is "just make it 50/50" or "spread it evenly across the options, it's symmetric anyway." I took a philosophy of probability course years ago and remember enough to be nervous: the principle of indifference (assign equal probability when you have no reason to favor one possibility over another) sounded great until we got to that chord-in-a-circle problem, where the same "no reason to prefer one over another" reasoning gives you 1/3 or 1/2 or 1/4 depending on which feature of the chords you treat as the equally-likely thing. I never fully understood what the lesson of that was supposed to be, and honestly I still don't.

  So what I want from you is a procedure I can actually run at my desk when someone asks me to "just assume it's uniform." Give me the questions to ask in order: something like how to pin down what the candidate "possibilities" even are, how to test whether the equal-probability assignment survives changing how I describe the same situation, what counts as a red flag that the answer is an artifact of my bookkeeping rather than the world, and where the procedure stops and says I should refuse to give a number at all (or admit that any number I give is a placeholder for eliciting someone's actual beliefs). Be honest about the parts that are judgment calls wearing a procedure costume — I'd rather know where I'm guessing. Then run it on three cases for me: (1) three suppliers with no track record, client wants "1/3 each" on which one causes the delay; (2) the chord problem itself, all three of the classic setups; and (3) something continuous — say a client manufacturing rods to be between 0 and 2 cm wants a prior on whether a given rod is under 1 cm, where the answer flips depending on whether you split the range or the ratio, I think the textbook version involves cubes. Include at least one case where your procedure rejects an assignment my manager would consider obviously fine.

  After the main write-up, give me a JSON array with one object per case (so four objects total counting the three chord setups), each with these fields: "case" (short name), "partition" (the candidate way of slicing up the possibilities), "verdict" (one of "indifference safe", "indifference arbitrary", "refuse to quantify"), "reason" (one sentence), and "fallback" (what I should do instead if it's not safe). Keep it parseable — I want to paste this into my notes template. And please don't be wishy-washy: if the principled answer is that a lot of these numbers my firm hands out are decorative, say so plainly.
