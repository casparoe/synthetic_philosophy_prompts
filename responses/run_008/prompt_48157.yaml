answer: |-
  The implicit theory of privacy underpinning the UK census 100-year rule is **Generational Harm Mitigation**, operationalized through a **Contextual Boundary.**

  It is not a pure "control" view (because you cannot opt out), nor is it a strict "individual harm" view (because, as you note, it protects people long after they are dead, and sometimes fails to protect those who are still alive). Instead, it rests on the assumption that **privacy is a property of a family line, not just an individual, and that the capacity for reputational harm decays over roughly three generations.**

  Here is the straight answer on why this is the case, why the 100-year figure is a flawed proxy for it, and what would change if we actually followed the theory to its logical conclusion.

  ### 1. The Theory: Privacy as a Decaying Familial Asset
  The census schedule is not a collection of individual forms; it is a record of a *household*. The implicit privacy view recognises that exposing the details of that household (illegitimacy, mental illness, poverty, servitude) does not just embarrass the enumerated individual; it embarrasses their children and grandchildren.

  When the rule was tightened from 50 years to 100 years in the 1960s (under the Public Records Act), the driving concern was specifically the protection of **living descendants**. A 50-year seal protected the enumerated (mostly dead), but it exposed their children (who might be in their 50s or 60s) to potential stigma. By moving to 100 years, the state acknowledged that privacy claims extend beyond the grave to the immediate lineage.

  Therefore, the theory is **Harm-Based**, but the "harm" is defined socially and familially, not individually. It assumes that once the social network that remembers the person is dead, and their immediate dependents are dead, the data loses its capacity to inflict reputational damage. It treats privacy as a resource that depletes over time as the social context that gives the data meaning dissolves.

  ### 2. The 100-Year Figure: A Heuristic, Not a Logic
  Does the 100-year figure follow from this theory? **No.** It is a bureaucratic compromise that approximates the theory but fails to embody it.

  As you correctly identified, 100 years is arbitrary relative to lifespan. A child born in 1951 could theoretically be alive in 2051. Conversely, a 90-year-old in 1921 was dead long before 2021. If the theory were strictly "no living person can be harmed," the release date would be variable, tied to the death of the youngest person on the schedule.

  The 100-year rule exists because **administrative certainty trumps philosophical precision.**
  *   **Tracking deaths is hard:** To release records based on actual death, the National Archives would need to cross-reference every census schedule against death registers for every person on every page. In the pre-digital era (when the rule was solidified), this was impossible.
  *   **The "Three Generation" Proxy:** 100 years is roughly three generations. It is a "bright line" heuristic that assumes that by the time a century has passed, the "zone of social memory" has closed. It is a rule of thumb designed to be easily understood and applied, rather than a precise ethical calculation.

  So, the 100-year seal is a **pragmatic approximation of the Generational Harm theory.** It accepts that some living people (the very old) might be exposed, and some dead people (the very old) are protected unnecessarily, in exchange for a rule that is administratively possible to enforce.

  ### 3. What Would Change If We Followed the Theory?
  If we were to strictly apply the **Generational Harm Mitigation** theory rather than the **100-Year Heuristic**, the handling of census records would have to change in three significant ways:

  **A. Individual Redaction rather than Schedule Sealing**
  Currently, the whole page is sealed. If the goal is to prevent harm to living people, we should release the 1951 census *now*, but redact the entries of anyone who can be proven to be still alive (or whose children are still alive). We have the computational power to cross-reference census data with death indices. We could release the 1951 census with black boxes over the names of the 5-year-olds who might still be living, while revealing the rest. This would satisfy the harm principle without the arbitrary wait.

  **B. Differentiated Sensitivity Levels**
  The current rule treats all data equally. A name and age are treated the same as a note about "feeble-mindedness" or "lunacy" (common in older censuses). A strict harm-based theory would suggest that **sensitive data should have a longer seal than administrative data.** You might release the names and occupations after 50 years, but keep medical or institutional details sealed for 150. The current "one size fits all" approach ignores the varying potential for harm.

  **C. Shift from "Household" to "Individual" Privacy Rights**
  The current system treats the household as a single privacy unit. If the theory is truly about harm, the head of household shouldn't be able to "wait out" the privacy of a lodger or a servant on their page. A strict application would require that the release of a specific line on the census depends on the lifespan of *that specific person*, not the head of the house. This would fragment the historical record (some lines visible, some blacked out), which historians hate, but it would be the only way to truly align with the stated privacy goal.

  ### Summary
  The 100-year rule is not a principled stand on individual rights. It is a **utilitarian compromise** designed to protect the **reputational dignity of descendants** while maintaining **administrative feasibility.**

  It rests on the view that privacy is about preventing social harm to a family line, not about individual control. The 100-year figure is simply the point where the state guesses that the risk of that harm has statistically diminished enough to justify the historical value of release. If we cared more about the theory than the administration, we would release records continuously based on verified death dates, accepting a fragmented historical record in exchange for precise privacy protection. We don't do that because, ultimately, the state values the integrity of the historical dataset and administrative simplicity over perfect privacy alignment.
