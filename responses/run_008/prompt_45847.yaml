      *   *Premise 3:* "Any further policy... is by definition fighting against nature."
          *   *Critique:* If Premise 1 & 2 are shaky, this conclusion doesn't hold. Policies might be addressing *remaining* social barriers, not biology.
      *   *Normative Question:* "How do we decide how much equalizing is enough?"
          *   *Approach:* Need to distinguish between *equality of opportunity* vs. *equality of outcome*.

