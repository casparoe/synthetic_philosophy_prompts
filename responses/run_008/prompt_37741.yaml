answer: |-
  # Q&A Prep Sheet: The Two Problems of Old Evidence

  **Strategy Overview:** Your core move is a *dissolution via distinction*. You are arguing that the "Problem of Old Evidence" is a category error resulting from conflating a psychological update (diachronic) with a logical relation (synchronic). Your vulnerability is that by solving the synchronic problem with "history of construction," you risk admitting that Bayesian confirmation theory is insufficient. Your goal in Q&A is to hold the line that Bayesianism is the *engine*, but history provides the *fuel map*. Do not get dragged into defending the counterfactuals as psychologically real; defend them as normative idealizations.

  **Concessions to Make Up Front:**
  1.  **Bayesianism is not a theory of discovery.** Concede immediately that the probability calculus cannot tell you how to generate hypotheses. You are only claiming it can evaluate them *once the history of their generation is supplied*.
  2.  **Counterfactuals are idealizations.** Do not claim agents actually have these credences. Claim these are the credences required to make the agent's update rational.
  3.  **Archival limits.** Admit you are not doing archival history yourself; you are proposing a framework for *how* to use that history if available.

  ---

  ## The Objections (Ordered by Damage Potential)

  ### 1. The Senior Philosopher of Science (Glymour Tradition)
  **The Objection:** "You've spent twenty minutes distinguishing two problems, only to solve the synchronic one by saying 'look at the history of construction.' But that was Glymour's original point: Bayesianism is blind to construction. By admitting the calculus is silent on the synchronic relation unless supplemented by historical facts about origins, aren't you just conceding that Bayesian confirmation theory is incomplete? You haven't solved the problem of old evidence; you've dissolved Bayesianism's claim to solve it."

  **The Reply:** "I am conceding that Bayesianism is not a *logic of discovery*, but I am denying that this makes it incomplete as a *logic of justification*. Think of it like a court of law. The rules of evidence (the calculus) don't tell the detective how to find the fingerprint. But once the fingerprint is found, the rules tell us how much weight it carries. My claim is that the 'weight' of old evidence depends on the chain of custody (the hypothesis construction). If I hand you a fingerprint found at the scene versus one planted later, the probabilistic impact changes, even if the print is identical. The calculus processes the input; the history fixes the input. That doesn't break the calculus; it just specifies the boundary conditions."

  **Candid Soft Spot:** This is your most dangerous exchange. If they press that "boundary conditions" are doing *all* the work and the calculus is just a passive recipient, your view collapses into "Bayesianism is useless for this case." You need to insist the calculus still does the work of *comparing* the likelihoods once the partition is set.

  ### 2. The Subjective Bayesian (Dutch Book Argument)
  **The Objection:** "You say the synchronic relation is fixed by history, not the calculus. But if my synchronic credences don't align with the evidential relations you've identified, am I irrational? If I refuse to update on old evidence because I know it's old, and you say I should, aren't you vulnerable to a diachronic Dutch Book? If the calculus is silent, what normative force does your 'historical partition' have?"

  **The Reply:** "The Dutch Book argument applies to the diachronic update—the actual change in credence over time. I accept that. Once the historian fixes the correct partition based on the hypothesis's origin, the agent *must* update according to the calculus to avoid incoherence. The 'silence' I mention is about *which* partition to use, not how to move between them. The calculus tells you how to drive; the history tells you which road you're on. You can't Dutch Book someone for choosing the wrong road, only for driving recklessly once they're on it."

  **Candid Soft Spot:** The distinction between "choosing the road" and "driving" is metaphorical. If the "road" (partition) determines the probability assignment, and the calculus doesn't select the road, a clever bookie could potentially exploit the gap between your historical selection and the agent's actual credence. Be prepared to admit that the "historical selection" is a rational reconstruction, not a mechanical rule.

  ### 3. The Imprecise Credences Epistemologist
  **The Objection:** "Your diachronic solution relies on the counterfactual credence the agent *would have had*. You treat this as a point value. But given the complexity of the web of belief, there is no fact of the matter about what Einstein would have believed without GR. It's not just unknown; it's indeterminate. By forcing a point value, you're introducing a false precision that imprecise credences were designed to avoid."

  **The Reply:** "I agree that psychologically, the credence is indeterminate. But normatively, we need a sharp value to assess whether the update was *justified*. When we ask if Einstein was rational, we aren't doing psychology; we're doing rational reconstruction. We ask: 'Is there *any* coherent assignment of prior credence consistent with his other beliefs that would license this update?' If yes, the update is defensible. The point value is a tool for checking coherence, not a claim about Einstein's neural state."

  **Candid Soft Spot:** This is a standard "idealization" defense, but it's weak against the imprecise crowd. They will argue that a set of probabilities is the *correct* model, not just a psychological limitation. If you insist on point values for the counterfactual, you look dogmatic. Consider conceding that a *range* of counterfactual credences could work, provided the update falls within the resulting range.

  ### 4. The Graduate Student (Garbling Problem)
  **The Objection:** "I worked on the garbling problem for my seminar paper. When you ask what credence an agent would have had in Mercury's perihelion without GR, you have to subtract GR from their web of belief. But GR is entangled with their understanding of mechanics, optics, and mathematics. You can't remove it without 'garbling' the rest of their beliefs. So the counterfactual baseline is incoherent."

  **The Reply:** "That is a serious challenge for global counterfactuals. That's why I restrict the counterfactual move to the *diachronic* problem of the specific agent's confidence, and I rely on the *synchronic* historical partition for the evidential relation. For the diachronic case, we don't need to subtract the whole theory; we only need to subtract the specific entailment link between the hypothesis and the evidence. We ask: 'Knowing what you know about the world, but not knowing H entails E, how confident are you in E?' This isolates the link without garbling the background physics."

  **Candid Soft Spot:** This is technically difficult to sustain. Entailment isn't always isolatable. If the student presses that understanding the *meaning* of the evidence requires the theory, you're in trouble. Your best bet is to pivot back to the Synchronic/Historical solution as the primary heavy-lifter, treating the counterfactual as a secondary check.

  ### 5. The Historian of Physics
  **The Objection:** "You talk about 'facts about how the hypothesis was built.' Whose construction? Einstein's in 1915? Hilbert's? The community's in 1919? And on what archival basis? If you say 'Einstein,' I can show you letters where he was confused about the field equations. If you say 'the community,' that's a sociological mess. You're using 'history' as a black box to solve a formal problem."

  **The Reply:** "I'm not doing the archival work today, but the framework demands it. The 'agent' is the relevant epistemic authority for the context. In 1915, it was Einstein. In 1919, it was the Royal Society. The partition is indexed to the *construction context*. If the historical record shows Einstein was attending to mathematical consistency rather than empirical fit during construction, that fixes the partition differently than if he was tuning parameters to fit Mercury. I'm offering a schema for interpreting those archives, not a specific historical claim."

  **Candid Soft Spot:** You are vulnerable to the charge of vagueness. If you can't give a concrete example of how a specific archival fact changes the partition, this sounds like hand-waving. Have one concrete example ready (e.g., Einstein's struggle with the November 1915 field equations vs. his earlier Zurich Notebook).

  ### 6. The Statistician
  **The Objection:** "In statistics, we solved this decades ago. It's called out-of-sample testing or cross-validation. You build a model on one dataset and test it on another. If you test on the data you trained on, you overfit. Philosophers call this 'old evidence'; we call it 'bad methodology.' Why are we treating this as a deep paradox instead of a warning against data snooping?"

  **The Reply:** "You're absolutely right that practice solves the *pragmatic* problem. But philosophy is asking about the *confirmational* status. If I hand you a model that fits the data perfectly, and tell you 'I built this specifically to fit this data,' your confidence drops. If I say 'I built this for theoretical reasons and it happens to fit,' your confidence rises. The data is the same. The 'out-of-sample' logic explains the practice, but it doesn't explain why the *same data* confirms the hypothesis more in the second case than the first. That's the evidential relation I'm analyzing."

  **Candid Soft Spot:** The statistician is right that the "paradox" is often just a confusion about experimental design. Don't fight them on the utility of cross-validation. Fight them on the *interpretation* of why cross-validation works (i.e., it proxies for the historical construction facts).

  ### 7. The Partition Selection Objection (General Audience)
  **The Objection:** "You say the historian selects the partition based on the hypothesis's origin. But isn't selecting the partition itself a probabilistic judgment? How do I know which features of the 'origin' are relevant without already having a probability distribution over which features matter? Isn't this circular?"

  **The Reply:** "It's not circular; it's hierarchical. The relevance of the origin features is determined by the *goals* of the theorist, not by probabilities. Was the theorist trying to save the phenomena? Or unify two theories? These are intentional states, not probabilistic ones. Once we identify the intention (e.g., 'unify gravity and inertia'), that dictates the partition (e.g., 'worlds where gravity and inertia are distinct' vs. 'worlds where they are unified'). The intention fixes the partition; the partition feeds the calculus."

  **Candid Soft Spot:** This assumes intentions are clear and map neatly to partitions. Often, theorists have mixed motives. If pressed, admit that sometimes the history is ambiguous, and in those cases, the confirmation relation remains indeterminate.

  ### 8. The "So What?" Objection (General Audience)
  **The Objection:** "Okay, suppose you're right. There are two problems, and history solves one, counterfactuals solve the other. What changes? Do we calculate posteriors differently? Do we teach Bayesianism differently? Or is this just a metaphysical distinction with no practical payoff?"

  **The Reply:** "It changes how we evaluate scientific controversies. When critics say 'that theory was just built to fit the data,' they are raising a synchronic objection about the partition. When proponents say 'but it explains the data so well,' they are pointing to the likelihoods. My framework shows they are talking past each other. It also saves Bayesianism from trying to do the impossible: deriving evidential relevance from pure math. It tells us where to look for the answers: in the lab notebooks, not just the equations."

  **Candid Soft Spot:** This is your closing pitch. Keep it punchy. If they feel it's purely academic, you lose the room. Emphasize the "lab notebooks" line.

  ---

  ## The Killer Question (Hope Nobody Asks)

  **The Question:** "You conjecture that the difficulties arise from trying to make facts about origins do work inside a formalism that has no vocabulary for origins. But if the formalism has no vocabulary for origins, and you say origins determine the confirmation relation, isn't the probability calculus doing *no work* in the synchronic case? If the heavy lifting is done by the history of construction, why isn't this just a dissolution of the problem rather than a solution? Why call this Bayesian confirmation theory at all?"

  **Why It Hurts:** This targets your core conjecture. If the formalism is silent on the synchronic relation, and the synchronic relation is what matters for "evidence," then you have effectively argued that Bayesianism *cannot* handle old evidence, you've just dressed up the admission in fancy language. It threatens to turn your talk from a "solution" into a "surrender."

  **Emergency Reply:** "It's not a dissolution because the calculus is still the *arbiter*. History selects the partition, but the calculus determines whether the evidence confirms, disconfirms, or is irrelevant *within* that partition. Without the calculus, history is just narrative. Without history, the calculus is blind. I'm arguing for a hybrid view: Bayesianism is the engine, but it needs a driver. Acknowledging the driver doesn't mean the engine is broken; it means it's not a self-driving car."

  **Backup Plan:** If they press that the engine is idle, concede that for the *synchronic* case, the calculus is a processing tool, not a generative one. Reiterate that this saves the diachronic case (actual learning) for pure Bayesianism, which is where the Dutch Book arguments live. Split the difference to save the diachronic half of your thesis.
