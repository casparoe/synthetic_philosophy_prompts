answer: |-
  You have stumbled onto one of the oldest and deepest problems in philosophy of science, and your intuitions are remarkably sharp. You are asking about the distinction between **Natural Kinds** (categories that exist in nature regardless of us) and **Conventional Kinds** (categories we impose on nature for convenience).

  Your rough stab at a principle is very close to the truth, but it is indeed "three principles wearing a trenchcoat." To make it work as a single principle, we need to tighten the definition of "something about themselves."

  Here is the precise principle that unifies your verdicts, followed by how it handles your hard cases and where you might need to adjust your list.

  ### The Principle: Causal Cohesion

  **A category is "real" (a natural kind) if and only if the members share a cluster of properties *because* they share a common underlying causal structure that exists independently of human observation.**

  Let's break down the three requirements hidden in that sentence:
  1.  **Clustering:** The things must share multiple traits (not just one).
  2.  **Common Cause:** Those traits must exist *because* of a shared internal mechanism (microstructure, lineage, or process), not just because they look similar.
  3.  **Independence:** That mechanism must exist whether we name it or not.

  If a category is defined by a human threshold, a functional use, or a relationship to *us* (or our filing systems), it lacks Causal Cohesion.

  ---

  ### Part 1: Running Your List Through the Principle

  This principle cleanly separates your "Real" from your "Not Real" list.

  *   **Lithium (Real):** All lithium atoms have 3 protons. This microstructure *causes* the chemical behavior. The cause is internal and independent. **Pass.**
  *   **Jade (Not Real):** Jadeite and nephrite look alike and are carved alike, but they have different crystal structures and chemical compositions. There is no single "jade-causing" mechanism. They are a functional grouping, not a causal one. **Pass.**
  *   **Fish (Not Real):** As you noted, this group excludes tetrapods (cows/whales) despite shared ancestry. The category "fish" groups things by habitat and shape (gills/fins), but there is no exclusive common causal mechanism (lineage) that includes tuna and sharks but excludes cows. **Pass.**
  *   **Whales (Real):** Moving whales to "Mammal" tracks a shared lineage and physiological mechanism (lungs, milk, warm blood) that exists independently of whether we call them fish or mammals. **Pass.**
  *   **Pluto (Not Real):** This is the trickiest one. Pluto's physical properties didn't change. But the category "Planet" was redefined to require "clearing the neighborhood." This is a *relational* property (depends on other rocks nearby), not an *intrinsic* one (depends on the rock itself). The 2006 vote was a decision to prioritize a dynamical filing system over intrinsic physical similarity. **Pass.**
  *   **Cancer (Real):** This is a mechanism (uncontrolled division due to regulatory failure). It clusters symptoms (tumors, metastasis) via a specific causal process. **Pass.**
  *   **Hypertension (Not Real):** Blood pressure is a continuous variable. There is no biological switch that flips at 130/80. The "kind" is created by the threshold, not by a distinct causal mechanism that suddenly appears at that number. The risk increases gradually; the category is a line drawn by a committee. **Pass.**

  So far, so good. Your gut was tracking **Causal Cohesion** almost perfectly.

  ---

  ### Part 2: The Hard Cases (Deuterium and Salamanders)

  Now we apply the principle to the cases that make you sweat.

  #### 1. Heavy Water and Deuterium
  *The Question:* Is Deuterium Hydrogen? Is Heavy Water Water?
  *The Verdict:* **It depends on the causal domain.**

  This is where your "trenchcoat" suspicion was right. "Realness" is often relative to the *level of explanation* you are using.
  *   **In Chemistry:** Electrons determine bonding. Deuterium has the same electron configuration as Hydrogen. Therefore, for chemical reactions, Deuterium *is* Hydrogen. Heavy Water *is* Water. The causal mechanism (electron shells) is shared.
  *   **In Nuclear Physics:** Neutrons determine mass and stability. Deuterium behaves differently in a reactor than Protium (regular hydrogen). Here, they are distinct natural kinds.

  **The Principle's Ruling:** A category is real *relative to the causal powers you are investigating.*
  *   If you are mixing cocktails, Heavy Water is Water (Real).
  *   If you are building a nuclear moderator, Heavy Water is a distinct substance from Light Water (Real Kind: Deuterium Oxide).
  *   **Advice:** You don't need to drop this verdict. You just need to accept that "Hydrogen" is a real kind at the chemical level, but splits into two real kinds at the nuclear level. Nature is layered.

  #### 2. The Salamanders (Ring Species)
  *The Question:* Are species real kinds if they blur into each other?
  *The Verdict:* **Species are real processes, but the boundaries are sometimes conventional.**

  This is the edge of the principle. Evolution is a continuous process, but our categories are discrete boxes.
  *   **Causal Cohesion:** A species is held together by *gene flow*. That is the causal mechanism. As long as the salamanders around the valley can interbreed with their neighbors, they are one "kind" because the gene pool is cohesive.
  *   **The Break:** Where the ring closes and the ends cannot interbreed, the causal mechanism (gene flow) has broken. Two distinct causal systems now exist.
  *   **The Fuzz:** The exact point where one species becomes two is often vague. Does the kind stop existing halfway around the valley? No. The *cohesion* weakens until it snaps.

  **The Principle's Ruling:** Species are **Homeostatic Property Clusters**. They are real because there is a mechanism (reproduction/genetics) keeping the properties clustered. However, because the mechanism is dynamic, the *boundaries* can be fuzzy without making the *kind* fake.
  *   **Advice:** Keep "Species are real." Accept that "Real" does not mean "Sharp Boundaries." A cloud is real, even if you can't say exactly which air molecule is the edge of the cloud.

  ---

  ### Part 3: The Cost (Which Verdicts to Drop or Adjust)

  You asked for honesty about where this principle forces you to change your mind. There are two places where your gut verdicts fight the principle.

  #### 1. Hypertension (Adjust the nuance, keep the verdict)
  You said Hypertension is "not real." The principle agrees the *category threshold* is conventional. However, you worried that heart attacks are real.
  *   **The Adjustment:** Distinguish between the **Phenomenon** and the **Diagnosis**.
      *   *High Blood Pressure:* Real phenomenon. Continuous, causal, dangerous.
      *   *Hypertension (ICD-10 Code):* Conventional category. A bureaucratic bucket for "BP high enough to warrant treatment."
  *   **Why:** If you say "Hypertension isn't real," a patient might think their risk isn't real. The *risk* is a natural kind (vascular stress); the *label* is a conventional kind (insurance billing).
  *   **Verdict:** Keep "Not Real" for the *category definition*, but acknowledge the underlying *variable* is real.

  #### 2. Pluto (Drop the "Nothing Changed" argument)
  You said, "Nothing about Pluto changed... astronomers were just tidying the filing."
  *   **The Adjustment:** You are right that Pluto didn't change, but you are slightly wrong that "nothing new got discovered." By 2006, we had discovered the Kuiper Belt. We realized Pluto wasn't a lone oddball; it was the first discovered member of a huge population of icy bodies.
  *   **Why:** The "Real" category here is **Dwarf Planet** or **Kuiper Belt Object**. These have high Causal Cohesion (similar composition, similar orbits). The category "Planet" (meaning the 8 dominant gravitational cleaners) is also a real dynamical class, but it is defined by *relational* power, not intrinsic stuff.
  *   **Verdict:** Keep "Not Real" for Pluto as a *Major Planet*, but recognize that the demotion wasn't *just* bookkeeping; it was recognizing that Pluto belongs to a different causal cluster (Kuiper Belt) than the Earth/Jupiter cluster.

  ### Summary: The Single Principle

  **A category is real if it supports inductive inference based on intrinsic causal mechanisms.**

  *   **Lithium:** Tells you how it reacts (Intrinsic). **Real.**
  *   **Jade:** Tells you nothing about its crystal structure (Extrinsic/Visual). **Not Real.**
  *   **Fish:** Tells you nothing about its ancestry (Extrinsic/Habitat). **Not Real.**
  *   **Hypertension:** Tells you nothing about a specific biological switch (Threshold). **Not Real.**
  *   **Deuterium:** Tells you about nuclear mass, not chemical bonding. **Real, but context-dependent.**
  *   **Salamanders:** Tells you about gene flow, even if the boundary is fuzzy. **Real, but dynamic.**

  **Where you might be wrong:**
  Don't treat "Real" as "Perfectly Sharp." Clouds, species, and even "mountains" are real natural kinds, but they have fuzzy edges. The principle of Causal Cohesion allows for fuzziness at the boundaries, as long as there is a glue holding the center together.

  Your brother-in-law argument strategy: Ask him, "Does this category let me predict something new about the object that I couldn't see just by looking at it?" If yes (Lithium, Cancer), it's real. If no (Jade, Hypertension threshold), it's a filing system.
