answer: |-
  You should stop pushing her.

  On the technical question: **Your sister is right, and you are misapplying the theorem.** Good's Theorem does not prove that she is irrational.

  On the interpersonal question: **You should drop the argument.** Using decision theory to override someone's autonomy regarding their own medical information is ethically fraught and likely to damage your relationship.

  Here is the breakdown of why the math doesn't support your position, and why the "rationality" argument is the wrong framework for this situation.

  ### 1. Where Good's Theorem Breaks Down
  I.J. Good's 1967 theorem on the *Value of Information* states that for a rational agent maximizing expected utility, the expected value of free, relevant information is always non-negative.

  However, the theorem relies on specific axioms that do not hold in your sister's case. Here is exactly what breaks:

  **A. Utility is defined over outcomes, not beliefs**
  Standard decision theory (the kind Good's Theorem uses) assumes your "utility function" (what you value) depends on the **state of the world** and the **actions you take**. It assumes that *knowing* the state of the world does not, in itself, change your utility.
  *   **The Break:** Your sister's utility function clearly includes her **psychological state**. For her, "believing I might be healthy" has higher utility than "knowing I am sick," even if the physical reality is the same. If knowledge itself causes pain (anxiety, depression, loss of hope), then information has a *negative intrinsic cost*.

  **B. "Free" means zero cost, not just zero dollars**
  Good's Theorem assumes the information is "free." In economics and decision theory, cost includes **psychological cost**.
  *   **The Break:** Even if the test costs \$0, it costs her peace of mind. If the expected psychological distress outweighs the instrumental benefit of the information, the net value is negative. Since there is no treatment, the *instrumental* benefit (the ability to change your actions to improve outcomes) is effectively zero. Therefore, the calculation is: $0 \text{ (benefit)} - \text{Psychological Cost} < 0$.

  **C. The "No Treatment" Clause**
  Good's Theorem is about the *instrumental* value of information—how it helps you make better decisions.
  *   **The Break:** If there is no treatment, there are no decisions to make. You cannot alter the outcome. If you cannot alter the outcome, the information has no instrumental value. If the information has no instrumental value, but carries a psychological burden, a rational agent should refuse it.

  ### 2. The "Right Not to Know"
  In bioethics, this is a well-established concept called the **Right Not to Know**.

  Major genetic counseling guidelines (such as those from the National Society of Genetic Counselors) explicitly support a patient's choice to decline testing for untreatable conditions. This is not viewed as "irrational"; it is viewed as a valid exercise of autonomy.

  Why? Because human beings are not expected utility maximizers in the cold, mathematical sense. We are emotional agents. Anticipatory grief is a real, tangible harm. If knowing the result turns 10 years of life into 10 years of waiting for a symptom to appear, that is a net reduction in quality of life.

  ### 3. Should You Keep Pushing?
  **No.**

  You asked: *"If she's just being irrational I want to keep pushing her."*

  Even if she were being irrational by your definition (which she isn't), this is not a domain where "rationality" should be weaponized.

  1.  **Bodily Autonomy:** She has the right to decide what happens to her body and her mind.
  2.  **Psychological Safety:** You are advocating for her to potentially take on a heavy psychological burden against her will. That is not a helpful sibling dynamic.
  3.  **Misunderstanding Rationality:** Rationality is a tool for achieving *your* goals. If her goal is "maximize peace of mind," then refusing the test is the **rational** choice. You are trying to impose *your* goal ("maximize knowledge") onto her utility function.

  ### Summary
  *   **Technically:** Good's Theorem assumes information doesn't hurt you psychologically and that you can use the information to change outcomes. Neither is true here.
  *   **Ethically:** There is no obligation to know medical information, especially when it cannot change your health trajectory.
  *   **Interpersonally:** Drop it. Respecting her choice is the only rational move for preserving your relationship.

  **Verdict:** Your sister is right. The theorem doesn't apply. Let it go.
