answer: |-
  This is a classic and profound stalemate in decision theory. Your hypothesis is astute: the disagreement is indeed rooted in divergent assumptions about the **locus of control** (what constitutes the "choice variable"), but it is not merely verbal. It reflects a substantive clash between competing normative ideals of rationality—specifically, the tension between *dynamic consistency* and *ex ante optimality*—compounded by ambiguity about the *technology of self-binding*.

  Here is a diagnosis of the impasse, an analysis of why the camps talk past one another, and an assessment of what might constitute progress.

  ### 1. Diagnosis: A Categorial Mismatch on the Locus of Control

  You are correct that the camps are answering different questions under the heading "What should the driver do?" However, this is not simply a semantic confusion; it is a disagreement about the **ontology of the agent**.

  *   **Camp 1 (The Consistent/Ex Interim Camp):**
      *   **Locus of Control:** The local action at the specific node.
      *   **Constraint:** *Dynamic Consistency.* A plan is only rational if, when you arrive at the decision point, you still want to execute it.
      *   **The Argument:** They argue that the driver at the intersection *cannot* control the driver at the other intersection. Since the driver has forgotten where he is, he cannot condition his action on history. If he plans to Exit, he calculates at the node that Continuing yields 2.5 vs. 2.0. He will therefore defect from his plan. A rational agent anticipates this defection. Therefore, the only *implementable* strategy is the mixed strategy (4/3).
      *   **Underlying View:** The agent is a sequence of temporal slices. Rationality is about what a slice can actually cause *given* the predicted behavior of other slices.

  *   **Camp 2 (The Ex Ante Camp):**
      *   **Locus of Control:** The plan selected prior to the loss of memory.
      *   **Constraint:** *Ex Ante Pareto Efficiency.* If there is a strategy that yields a higher payoff for the agent-as-a-whole, and nothing physically prevents it, rationality demands it.
      *   **The Argument:** They argue that accepting 4/3 is defeatist. It treats the agent's future irrationality as a fixed constraint rather than a failure of rationality. If "rationality" means anything, it means having the capacity to stick to the optimal plan even when local incentives shift. To say the answer is 4/3 is to define rationality as "managing your own weakness" rather than "being strong."
      *   **Underlying View:** The agent is a whole person extended over time. Rationality is a property of the whole trajectory, not just the instantaneous impulse.

  *   **Camp 3 (The FDT/Updateless Camp):**
      *   **Locus of Control:** The decision algorithm (source code).
      *   **Constraint:** *Logical Correlation.* The decision at Intersection 1 and Intersection 2 are outputs of the same function given identical inputs.
      *   **The Argument:** They dissolve the distinction between Camp 1 and Camp 2. They argue that Camp 1 makes a causal error: choosing "Exit" at this intersection *logically implies* choosing "Exit" at the other intersection, because the physical state (the absent-minded brain) is identical. You don't need a commitment device; you need to recognize that you are not choosing an *action*, you are choosing a *policy output*.
      *   **Underlying View:** The agent is a computational process. Control extends to all logical instantiations of that process.

  **Verdict on Your Hypothesis:** You are right that they are answering different questions. Camp 1 asks, "What action maximizes utility given my epistemic state and lack of binding?" Camp 2 asks, "What plan maximizes utility for the person?" Camp 3 asks, "What algorithm maximizes utility across all instantiations?" The stalemate persists because "Rational Choice" is overloaded to cover all three.

  ### 2. Substantive vs. Verbal: The Hidden Variable of Commitment

  Is this disagreement merely verbal? No. It has substantive implications, but the substance lies in a hidden premise: **The Technology of Self-Binding.**

  The disagreement bottoms out in differing assumptions about the cost and availability of commitment devices.
  *   **Camp 1** assumes binding is **impossible**. (The driver has no precommitment technology; he is truly absent-minded).
  *   **Camp 2** assumes binding is **costless/perfect**. (The driver can simply "decide" and his future self obeys).
  *   **Camp 3** assumes binding is **logical**. (The driver's physical continuity enforces consistency without external tools).

  This is why the debate feels intractable. Camp 1 accuses Camp 2 of "magic" (assuming a commitment device that doesn't exist). Camp 2 accuses Camp 1 of "fatalism" (assuming a weakness of will that shouldn't exist for a rational agent).

  **Evidence from the Literature:**
  *   **Aumann and Hart (Camp 1 leanings):** They emphasize that if a strategy is not *time-consistent*, it cannot be a solution to the game played against oneself. They treat the future self as a distinct player who will maximize their own interim utility.
  *   **McClennen (Camp 2 leanings):** In *Rationality and Dynamic Choice*, he argues for "resolute choice." He posits that rational agents have the capacity to bind themselves by the sheer force of prior intention. This is a substantive claim about human psychology and normative capacity, not just math.
  *   **Yudkowsky/Soares (Camp 3):** They argue that Causal Decision Theory (CDT) fails here because it ignores the correlation between the agent's decision and the prediction of that decision (even by the agent's future self).

  The disagreement is substantive because it predicts different behaviors in analogous real-world scenarios (e.g., voting, Newcomb's Problem, oligopoly pricing). If you side with Camp 1, you defect in Prisoner's Dilemmas against a clone of yourself. If you side with Camp 3, you cooperate. This is not a verbal dispute; it is a disagreement about the structure of causality and agency.

  ### 3. Why No Progress Has Been Made

  Progress has stalled because the debate oscillates between **normative** claims (what *should* a rational agent do?) and **descriptive** claims (what *can* an agent physically do?).

  1.  **Conflating Guidance and Evaluation:**
      *   Decision theory is sometimes meant to be *action-guiding* (What should I calculate right now?). Camp 1 wins here; you can't calculate your way into 4 if your calculation tells you to Continue.
      *   Decision theory is sometimes meant to be *evaluative* (Was this agent rational?). Camp 2 wins here; an agent who gets 4 is more successful than one who gets 4/3.
      *   Until the seminar distinguishes between "Rationality as a Calculator" and "Rationality as a Trait," the camps will remain incompatible.

  2.  **The Identity Question:**
      *   You mentioned personal identity. This is the bedrock intuition. Camp 1 implicitly treats the driver at Intersection 1 and Intersection 2 as **distinct agents** linked by a game tree. Camp 2 and 3 treat them as the **same agent**.
      *   Neither side can prove their ontology without begging the question. If you assume they are distinct agents, Camp 1 is right. If you assume they are the same agent, Camp 2/3 is right. The formalism of the problem (the game tree) does not dictate the metaphysics of the agent.

  ### 4. What Would Count as Progress?

  Since a "verdict" is unlikely (as it would require solving the metaphysics of agency), progress lies in **clarification and formalization of assumptions**.

  **A. Explicit Modeling of Commitment Technology**
  Progress would come from stopping the question "What should the driver do?" and starting with "What binding technologies are available?"
  *   *Scenario A:* No binding (Camp 1 applies). Result: 4/3.
  *   *Scenario B:* Perfect resolute binding (Camp 2 applies). Result: 4.
  *   *Scenario C:* Logical binding (Camp 3 applies). Result: 4.
  *   **Progress:** Acknowledging that the "Absent-Minded Driver" is not one problem, but three different problems depending on the assumed *causal structure of the self*.

  **B. Distinguishing "Rationality" Concepts**
  The seminar could adopt a convention to distinguish between:
  *   **Dynamic Consistency:** A constraint on plans (Camp 1).
  *   **Ex Ante Optimality:** A constraint on outcomes (Camp 2).
  *   **Updatelessness:** A constraint on information processing (Camp 3).
  *   **Progress:** Agreeing that a theory can satisfy one but not the others. For example, admitting that CDT satisfies Dynamic Consistency but fails Ex Ante Optimality in this specific case, while FDT does the reverse. This moves the debate from "Who is right?" to "Which property do we value more?"

  **C. Formal Unification (The "Causal Graph" Approach)**
  Recent work in causal modeling (e.g., by Icard, or in the Functional Decision Theory literature) attempts to draw the causal graph explicitly.
  *   If the graph shows a causal link from Decision 1 to Decision 2, Camp 1 is wrong.
  *   If the graph shows no link (only a common cause in the past), Camp 1 is right.
  *   **Progress:** Agreeing on the causal graph. If the driver is truly absent-minded, is there a causal link between his choice at node 1 and node 2? Physically, yes (it's the same brain). Informationally, no. Resolving whether *logical* dependence counts as *causal* dependence for decision theory would be a major formal breakthrough.

  ### 5. Conclusion: Expectation of Future Consensus

  Should you expect progress? **No, not in the form of a consensus on the "correct" answer.**

  The Absent-Minded Driver is a "boundary case" for decision theory, much like the Sorites Paradox is for language. It exposes the limits of our concepts of "choice" and "self."
  *   If you view decision theory as a tool for **engineering autonomous agents**, Camp 3 (FDT/Updateless) is gaining traction because it produces better outcomes in multi-agent and self-referential settings.
  *   If you view decision theory as a model of **human economic behavior**, Camp 1 is more robust because humans rarely achieve resolute choice (Camp 2) and often fail to recognize logical correlations (Camp 3).

  **Recommendation for your Seminar:**
  Propose that the stalemate is a feature, not a bug. The value of the Absent-Minded Driver is not to find the solution, but to force a choice of **meta-principles**. The most productive path forward is to stop asking "What is the rational payoff?" and start asking "Which invariance principle are we willing to sacrifice?"
  *   Camp 1 sacrifices Ex Ante Optimality to save Dynamic Consistency.
  *   Camp 2 sacrifices Dynamic Consistency to save Ex Ante Optimality.
  *   Camp 3 sacrifices Causal Independence to save both.

  The diagnosis is that the disagreement is **substantive** (it concerns the causal structure of agency) but manifests as a **verbal** dispute (over the definition of rationality). Progress lies not in solving the driver's problem, but in explicitly mapping the trade-offs between the normative principles each camp holds dear.
