answer: |-
  Here is a complete lesson plan designed for your constraints. It focuses on the **betting structure** to generate the intuition, uses a **bag-and-slip method** to proxy the amnesia, and saves the jargon for the debrief.

  ### **Session Plan: The Sleeping Beauty Casino**
  **Time:** 60 Minutes
  **Materials:**
  *   1 Fair Coin.
  *   2 Small Boxes or Bowls (label one "The Bank," one "The Discard").
  *   30 Small Slips of Paper (all identical size/color).
  *   Pens.
  *   Candy or Tokens (about 20 pieces).
  *   Whiteboard/Chalkboard.

  ---

  ### **Part 1: The Setup (5 Minutes)**
  Gather the students. Tell them the story exactly as you summarized it in your prompt (Sunday night, coin flip, Monday/Tuesday wake-ups, memory wipe).

  **Crucial Instruction:** "Today, you are not philosophers. You are gamblers. We are going to run this experiment 10 times. In every experiment, one of you will be chosen to be 'Beauty.' You will not know which experiment number we are on. You will not know the coin result. You will only know that you are awake."

  **The Proxy for Amnesia:**
  Explain that since you can't erase memories, you will use **Random Selection** to simulate the uncertainty.
  *   "In a Tails world, there are twice as many 'wake-ups' as in a Heads world. So, if we run this 10 times, there will be roughly 15 wake-ups total. You might be picked once, or twice, or not at all. When you are picked, you are just a 'waking' drawn from the pool of all possible wakings."

  ---

  ### **Part 2: Game Round A — "The Per-Waking Payout" (15 Minutes)**
  **Goal:** Make them feel the pull of the "One-Third" intuition.

  1.  **The Rule:** "Whenever you are woken up, you must bet on Heads or Tails. If you guess correctly, **you** get a candy."
  2.  **The Process:**
      *   You (the facilitator) stand at the front. Turn your back to the class.
      *   Flip the coin. Look at it. Do not show them.
      *   **If Heads:** Write "H" on **1** slip of paper. Put it in "The Bank."
      *   **If Tails:** Write "T" on **2** slips of paper. Put them in "The Bank."
      *   Shake the box.
      *   Draw **one** slip from the box. Hand it to a student (this student is now "Beauty").
      *   The student looks at the slip. It will just say "Wake" (prepare these slips beforehand) — *Wait, no.*
      *   *Correction for flow:* To save time, don't draw from a box. **You** are the experiment.
      *   *Revised Process:*
          1.  Flip Coin (Hidden).
          2.  If Heads: Call **1** student's name.
          3.  If Tails: Call **2** students' names (one after the other).
          4.  Called students come to the front. They do not know how many others were called. They write "H" or "T" on a card and hand it to you.
          5.  They return to seats.
          6.  Reveal Coin.
          7.  **Payoff:** Every student who guessed right gets a candy.
  3.  **Run this 5 times.**
  4.  **Observation:** Students will notice that in Tails rounds, *two* people get candy. In Heads rounds, only *one* person gets candy.
  5.  **Ask:** "To maximize your personal candy intake, what should you guess?"
      *   *Expected Result:* Most will say "Tails." Because Tails produces more opportunities to win.

  ---

  ### **Part 3: Game Round B — "The Per-Experiment Payout" (15 Minutes)**
  **Goal:** Make them feel the pull of the "One-Half" intuition.

  1.  **The Rule:** "We are running 5 more experiments. The rule changes. The **Class** gets a point only if the Coin matches the guess. But here is the catch: **We only count one guess per experiment.**"
  2.  **The Process:**
      *   Flip Coin (Hidden).
      *   If Heads: Call **1** student.
      *   If Tails: Call **2** students.
      *   **Crucial Change:** If you call two students (Tails), they must **agree** on a single guess before handing it to you. If they disagree, the class gets no points for that round.
      *   (Alternatively, simpler for time): You tell them, "If I call two of you, I will average your answers. If one says H and one says T, it's a wash."
      *   *Best Version:* "If I call two of you, only the **first** person's guess counts for the class score."
  3.  **Payoff:** If the guess matches the coin, the *whole class* gets a candy (or a point on the board). If wrong, no one gets it.
  4.  **Run this 5 times.**
  5.  **Ask:** "To maximize the class candy, what should the first person guess?"
      *   *Expected Result:* Students will realize Heads and Tails are equally likely to produce a "Win" for the class. The frequency of wakings doesn't matter anymore; only the frequency of the coin matters. They will likely revert to "50/50" or "Heads."

  ---

  ### **Part 4: The Debrief (20 Minutes)**
  Now you introduce the philosophy.

  **1. Map the Experience:**
  *   "In Round A, most of you bet on Tails. Why?"
      *   *Student Answer:* "Because there were more chances to win."
      *   *Philosophical Label:* This is the **Thirder** position. They argue that probability is about your location in time. Since 2/3 of all wakings happen in Tails-worlds, you should act as if Tails is 2/3 likely.
  *   "In Round B, most of you switched to 50/50. Why?"
      *   *Student Answer:* "Because the coin doesn't care how many times we wake up."
      *   *Philosophical Label:* This is the **Halfer** position. They argue that probability is about the physical coin. No new information was given when you woke up, so it stays 50/50.

  **2. The Core Conflict:**
  Write on the board: **Is probability about the World (the Coin) or the Observer (the Waking)?**
  *   Explain that smart philosophers disagree on this. The game showed that *both* answers can be "right" depending on what you are trying to achieve (winning personal bets vs. tracking truth).

  **3. The "Amnesia" Critique (5 Minutes):**
  Be honest about the simulation's flaws.
  *   **The Problem:** "In our game, when I called two students for Tails, those were two different people. In the real problem, it's the *same* person waking up twice."
  *   **Why it matters:** If you are the same person, you might care about your total happiness across both days (favoring Round A). If you are distinct people, you might care about how many people are right (favoring Round B).
  *   **The Takeaway:** The Sleeping Beauty problem isn't just about math; it's about *identity*. Are "Monday-You" and "Tuesday-You" the same agent? The game couldn't perfectly simulate that, but the betting tension remains the same.

