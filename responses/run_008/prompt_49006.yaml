  ### **Prediction: What Will Go Wrong**
  1.  **The "It's Obviously 50%" Pushback:** Some students will refuse to engage with Round A. They will say, "It's a coin. It's 50%. I don't care how many times you wake me."
      *   *Fix:* Don't argue. Just let them lose candy in Round A. Experience is a better teacher.
  2.  **Collusion:** In Round B (Tails rounds with 2 students), the two students might turn to each other and whisper.
      *   *Fix:* Enforce a "No Talking" rule during the experiment phase.
  3.  **Time Creep:** Managing 14 students coming up one by one takes time.
      *   *Fix:* If it drags, reduce the rounds from 5+5 to 3+3. The pattern emerges quickly.
  4.  **Confusion on Rules:** Students might think the *slip* tells them the day.
      *   *Fix:* Emphasize that the slip/envelope only signifies "You are awake." It contains no data about Monday or Tuesday.

  ### **Final Advice for the Facilitator**
  Your role is to be the "Experiment," not the "Teacher." Be mysterious with the coin. When paying out candies in Round A, make a show of handing out *two* candies for Tails rounds and *one* for Heads rounds. Let the material reward do the arguing for you. When they ask, "So what's the real answer?" your best response is: "Philosophers have been arguing about this for 20 years. What do *you* think?"
