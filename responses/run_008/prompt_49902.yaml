answer: |-
  The Simple Conditional Analysis (SCA) claims $x$ is disposed to $M$ if $x$ would $M$ if stimulated. This fails because counterfactuals track outcomes, not underlying powers. Consider a sorcerer. If he removes a glass's fragility the moment it's struck (a **fink**), the glass won't break. SCA falsely concludes it wasn't fragile. If he wraps it in foam (**mask**), it won't break either. SCA again falsely concludes it wasn't fragile. Finks remove the power; masks block its expression while the power remains.

  Lewis's repair requires the disposition survive until just before the stimulus. This handles finks effectively because it locks in the disposition's existence prior to the interference. If the glass was fragile a millisecond before the strike, the fink's removal doesn't erase that fact. However, this repair fails masks. The power exists shortly before impact, yet the conditional "if struck, would break" remains false. Requiring an intrinsic causal basis helps isolate masks (foam is extrinsic), but intrinsic finks remain problematic. The repair copes better with finks because it secures the temporal priority of the disposition.

  Now, the self-modifying glass. Milliseconds before impact, the surface lattice shifts to diamond-hardness. Impact occurs. No shatter. Lattice reverts. Timing is crucial. The change precedes contact but follows the approach. Does this remove fragility or block it?

  This pressures the individuation of the disposition's basis more than the fink/mask boundary. If fragility is tied to the *instantaneous* molecular structure, the basis vanishes upon device activation (fink). If tied to the *standard* structure, the device interposes a barrier (mask). Unlike standard masks, the barrier is intrinsic to the object during the stimulus. Unlike standard finks, the underlying "body" remains glass-like. The device effectively swaps the causal basis temporarily.

  I classify this as a **structural fink**. The disposition's categorical basis literally ceases to exist during the critical window. The object loses the property that grounds the disposition temporarily. This placement depends on viewing dispositions as supervening on current physical states, not historical kinds. If dispositions are historical, it's a mask.

  Settled consensus: The unqualified SCA is dead. Finks and masks refute it. Contested: Whether any restricted conditional analysis survives (many argue for primitive dispositionalism instead). Also contested is the mask/fink boundary itself—specifically, how to distinguish masks from "lucky" non-manifestations where the basis is absent. The device case shows that if intrinsic bases can fluctuate rapidly, the line between losing a power and blocking it blurs. The metaphysics hinges on whether dispositions are rigid or time-slice sensitive. Most agree SCA is untenable; disagreement remains on whether conditional analyses can be patched or abandoned for dispositional essentialism. Fluctuating bases destabilize truth values, challenging analyses relying on fixed stimulus conditions.
