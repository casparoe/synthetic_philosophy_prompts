answer: |-
  This is a sharp reading of the landscape. You are correct that the term "meme" was culturally co-opted while the scientific research program was effectively absorbed and neutered by the broader Cultural Evolution (CE) community.

  Here is the diagnosis: The dispute was **substantive at the ontological level but pragmatic at the methodological level.** It stalled not because it was merely verbal, but because the memeticists made a high-risk ontological bet (that culture *must* have discrete replicators to evolve) that proved empirically unnecessary for modeling, while their opponents offered a lower-risk alternative (population dynamics + cognitive attractors) that yielded results without settling the ontology.

  Here is the breakdown of the claims, the impasse, and the path forward.

  ### 1. The Substantive Core: The Fidelity Threshold
  You asked what each side claimed that the other denied. It boils down to a specific empirical threshold regarding **copying fidelity.**

  *   **The Memeticist Claim (Dawkins/Dennett/Blackmore):** Cumulative cultural adaptation requires a "replicator" mechanism analogous to the gene. Specifically, transmission fidelity must be high enough that *selection* acts on the variation, rather than *transmission error* swamping the signal. Dennett explicitly argued that without high-fidelity copying, you cannot get the ratchet effect of cumulative culture. The "meme" was posited as the necessary physical/cognitive vehicle to ensure this fidelity.
  *   **The Critic Claim (Sperber):** Cultural transmission is inherently low-fidelity reconstruction. We do not copy; we infer. Therefore, stability (why recipes or rituals stay the same) cannot be explained by copying fidelity. It must be explained by **cognitive attractors**—the fact that human minds are similar enough that we reconstruct the *same* idea from *different* inputs.
  *   **The Pragmatic Defection (Boyd/Richerson):** They effectively sidestepped the ontological fight. They argued that you can model frequency-dependent selection, prestige bias, and conformity without agreeing on what the "unit" is. If the math predicts trait frequencies in a population, the existence of a "replicator" is a metaphysical luxury, not a scientific necessity.

  **The Diagnosis:** The fight was substantive because it hinged on a falsifiable claim: *Is high-fidelity replication a necessary condition for cumulative cultural evolution?* Memetics said Yes; Sperber said No. However, it became a stalemate because Memetics failed to identify the replicator. If you can't point to the meme (is it a melody? a lyric? a neural pattern?), you can't measure its fidelity. Without measurable fidelity, the core claim is untestable.

  ### 2. The Explanandum Mismatch
  Your third theory is the most insightful: **the sides were trying to explain different phenomena.**

  *   **Memetics wanted to explain *Success* (Virality):** Why did *this* idea spread and *that* one die? This requires a focus on the properties of the *information* itself (the meme's fitness). This aligns with the internet usage of "meme."
  *   **Cultural Evolution/Sperber wanted to explain *Structure* (Stability):** Why does culture look designed? Why do kinship systems or tool technologies show complex adaptation over time? This requires a focus on the *process* of transmission and the *constraints* of the learner.

  This mismatch explains why the fight petered out. The CE crowd (Boyd/Richerson heirs) successfully explained *Structure* using population models without needing to solve the *Success* problem at the individual unit level. They showed how maladaptive traits can spread (conformity bias) and how adaptive traits can accumulate (prestige bias) without ever defining a "meme." The memeticists, meanwhile, got stuck trying to define the unit of success, which turned out to be context-dependent and fuzzy.

  ### 3. Why "Internet Memes" Don't Rescue Memetics
  Your reading group member who says internet memes don't rescue the theory is right, but for a deeper reason than just "attention."

  Internet memes actually support **Sperber's reconstruction model** more than Dawkins' replication model. When a meme template (e.g., *Distracted Boyfriend*) spreads, it is not copied with high fidelity. It is *remixed*. The image is the attractor; the text is reconstructed by each user to fit their local context. The stability is in the *structure* of the template, not the specific content.

  If anything, digital trace data shows that cultural transmission is a mix of copying and mutation, where the "mutation" is often the point of the transmission. This undermines the strict Dawkinsian requirement for high-fidelity copying as the engine of evolution. It suggests fidelity is graded, not binary.

  ### 4. What Counts as Progress?
  The question has not dissolved, but the framing has shifted from "Are there memes?" to "What are the mechanics of transmission?" Progress will not come from better definitions of "meme," but from **granular transmission data.**

  *   **Digital Trace Data:** This is the biggest game-changer. We now have datasets where we can see the actual transmission chains (retweets, forks, code commits, remix chains).
      *   *Progress looks like:* Measuring the **mutation rate** vs. **selection pressure** in these chains. If we see that variants survive because of their content (selection) vs. because of the network structure (drift), we can quantify the "Darwinian" nature of the process without needing a strict replicator ontology.
  *   **Graded Fidelity:** We need to move past the binary "copy vs. reconstruct." Progress lies in modeling fidelity as a variable. Some cultural traits (technical recipes) demand high fidelity; others (folklore) tolerate high mutation. A unified theory would predict *when* fidelity is enforced by social norms and *when* it is relaxed.
  *   **The "Replicator" as a Process, not a Thing:** The honest answer is that the search for the "cultural gene" was a category error. Progress comes from viewing replication as an **achievement**, not a starting condition. Sometimes culture replicates (copy-paste); sometimes it reconstructs (rumors). The research program should focus on the conditions that shift the system from one mode to the other.

  ### Summary Diagnosis
  The memetics dispute was a **substantive ontological gamble that lost to pragmatic modeling.**

  *   **Memetics claimed:** No replicator, no evolution.
  *   **Critics showed:** You can have evolution (population change) without clear replicators, via reconstruction and attractors.
  *   **Result:** The field adopted the math of evolution (CE) but dropped the ontology of the gene (Memetics).

  The dispute stalled because the memeticists could not operationalize their core variable (the meme). Progress is now happening not by resolving the definition of "meme," but by rendering it unnecessary through high-resolution transmission data that allows us to measure selection and drift directly on cultural variants, regardless of their ontological status. The "meme" was a useful heuristic to get the field started, but it was a scaffold that had to be removed once the building (Cultural Evolution) was standing.
