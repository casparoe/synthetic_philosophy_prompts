      *   *Epidemiology of Representations (Sperber):* Focus on the *cognitive processor*. Culture isn't copied; it's reconstructed. Stability comes from cognitive attractors, not high-fidelity copying. Transmission is low-fidelity; content is stable because minds are similar.
      *   *Dual Inheritance Theory (Boyd/Richerson):* Focus on *population dynamics*. Don't get hung up on the ontology of the "unit." Use models (frequency-dependent bias, prestige bias, etc.) to predict cultural change. Pragmatic approach.
      *   *Outcome:* Memetics as a specific research program faded. Cultural Evolution (CE) absorbed the math but dropped the strict "replicator" ontology. Internet "memes" are a folk concept, not the scientific one.

  3.  **Evaluate the User's Hypotheses:**
      *   *Hypothesis 1 (Won Quietly):* Population modelers got the goods; replicator framing was just a metaphor. *Verdict:* Partially true, but misses the ontological clash.
      *   *Hypothesis 2 (Verbal/Definitional):* They meant different things by "copying." *Verdict:* True, but "just verbal" underestimates the theoretical consequences.
      *   *Hypothesis 3 (Different Explananda):* Memeticists = why content spreads. Opponents = why content is stable/structured. *Verdict:* This is the strongest insight. It gets at the *purpose* of the theory.

  4.  **Formulate the Diagnosis:**
      *   *Is it Substantive, Verbal, or Divergent?* It's a mix, but primarily **divergent research strategies grounded in a substantive ontological disagreement.** It's not *just* verbal because the ontology dictates the methodology. If culture is replicators, you look for lineages. If it's attractors, you look for cognitive biases.
      *   *What did they deny?*
          *   Memeticists denied that reconstruction could produce cumulative adaptation without high-fidelity replication. (Dennett's "copying fidelity" argument).
          *   Sperberians denied that high-fidelity replication exists in culture to the degree required for Darwinian selection.
          *   Boyd/Richerson effectively said: "The ontology doesn't matter if the math works."
      *   *Why did it stall?* Memetics hit a wall empirically. It's hard to identify discrete memes. Cultural Evolution (CE) succeeded because it was agnostic.
      *   *The "Internet Meme" Red Herring:* Crucial point. Internet memes *look* like Dawkins' memes (copy/paste), but they evolve via modification/remix, not just selection on static units. They actually support Sperber's reconstruction view more than strict Dawkinsian replication.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate the user's observation. Yes, the term won, the theory lost.
      *   *Diagnosis:* It's not purely verbal. It's a **methodological impasse caused by an ontological gamble.** Memetics bet on the *unit* (replicator). CE bet on the *process* (transmission biases).
      *   *The Core Disagreement:* It's about **Fidelity vs. Attractors.**
          *   Memetics: Stability requires high-fidelity copying (like DNA).
