  8.  *(Final thought on the "Win")*: Did the population modelers win? Yes, pragmatically. But the ontological question (is there a cultural replicator?) remains technically unresolved, just deemed less useful. I should frame it as a shift from *ontology* to *pragmatics*.

  9.  *(Structure)*:
