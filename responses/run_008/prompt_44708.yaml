          1.  *Coordination/Moralised:* "The Silent Greeting." (Don't speak above a whisper in public spaces). Locals think it shows respect for shared air. Visitors find it hard.
          2.  *Exploitative/Systemic:* "The Service Tithe." (Listed price is 50%, rest is direct to staff, but staff are underpaid by the state). If you don't pay, staff lose income.
          3.  *Fairness/Queue:* "The Token Queue." (Physical tokens needed to enter spaces, hoarding is frowned upon).
          4.  *Extraction:* "The Visitor's Levy." (A specific tax only tourists pay, justified as 'maintenance', but locals know it's just revenue).
          5.  *Bonus/Vibe:* "The Left-Hand Rule." (Never pass items with left hand). Purely symbolic, no real harm, but locals get offended.
      *   *Mechanics:* Visitors start with 20 Marks. Scenarios cost Marks. Compliance costs Marks (e.g., paying the tithe). Non-compliance risks Sanction (losing Marks or social capital). Locals get points for "Social Order" but lose points for "Conflict" if they sanction too aggressively.
      *   *Rounds:* Round 1 (Visitors blind). Round 2 (Visitors know rules, Locals swap).

  3.  **Predicting Failure Points:**

      *   *Gamification:* People will try to "win" (maximise tokens) rather than engage morally.
      *   *Anger:* The exploitative rule might make Visitors feel genuinely cheated/angry at the *game*, not the concept.
      *   *Locals Boredom:* Locals might just enforce everything blindly.
      *   *Time:* 90 mins is tight for setup, 2 rounds, and deep debrief.

  4.  **Mitigation Strategies:**

      *   *Framing:* Emphasise "play to explore, not to win."
      *   *Debrief Safety:* Allow venting about the exploitative rule immediately.
      *   *Time Management:* Cut Round 2 short if needed; the debrief is the priority.
      *   *Local Instructions:* Tell locals to vary their enforcement (some strict, some lenient).

  5.  **Limitations of the Game:**

      *   *Real World Stakes:* No actual social ostracisation or legal trouble.
      *   *Cultural Depth:* Can't replicate the feeling of *belonging* or *history*.
      *   *Power Dynamics:* Visitors in the game can leave anytime; real visitors might be dependent on the host.

