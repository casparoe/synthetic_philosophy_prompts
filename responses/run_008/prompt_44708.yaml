answer: |-
  Here is a complete package for your session: the game design, a candid risk assessment, and a committed debrief framework. I have kept the language in British English as requested.

  ***

  # Part 1: The Game — "Visitors in Velmara"

  **Time:** 40 minutes (20 per round)
  **Players:** 14 (7 Locals, 7 Visitors)
  **Materials:** Printed role cards, tokens (or poker chips), pens, paper.

  ### The Setup
  Divide the group. **Locals** sit in an inner circle; **Visitors** sit in an outer circle. Visitors receive a starting endowment of **20 Marks** (tokens). Locals receive **Social Capital** (points on a sheet).

  ### The Conventions (Local Rules)
  *Give these cards only to the Locals. They contain the rule, the justification, and the sanction mechanism.*

  1.  **The Hush (Coordination/Moralised):**
      *   *Rule:* In public spaces, voice volume must not exceed a murmur.
      *   *Justification:* "Noise pollutes the shared air. Loudness is selfishness."
      *   *Sanction:* If a Visitor speaks loudly, the Local loses 1 Social Capital to publicly 'shush' them. The Visitor loses 2 Marks.
  2.  **The Split (Exploitative System):**
      *   *Rule:* Menu prices are 50%. The other 50% is paid directly to the server in cash.
      *   *Justification:* "The State pays us nothing. Your extra Marks keep our children fed."
      *   *Sanction:* If a Visitor refuses, the Local (server) takes no sanction, but the Local group loses 5 Social Capital collectively (shame). The Visitor saves Marks but gains a 'Rude' marker.
  3.  **The Line (Fairness):**
      *   *Rule:* Entry to popular venues requires a physical token taken from a dispenser. Hoarding tokens is forbidden.
      *   *Justification:* "First come, first served is the only justice."
      *   *Sanction:* Locals may physically block entry (Visitor loses turn) if hoarding is suspected. Cost to Local: 1 Social Capital.
  4.  **The Gate (Extraction):**
      *   *Rule:* Visitors must pay a 5-Mark 'Heritage Fee' to walk through the town square. Locals walk free.
      *   *Justification:* "You come to see our beauty; you must help polish it." (Privately, Locals know the money goes to the Mayor's private purse).
      *   *Sanction:* Guards (assigned Locals) confiscate 10 Marks if caught evading. Cost to Guard: 2 Social Capital.

  ### The Mechanics
  *   **Visitors:** You have 3 scenarios (Eating, Travelling, Sightseeing). Each requires a decision. You want to keep your Marks, but you also want to avoid 'Rude' markers.
  *   **Locals:** You want to maintain Social Order (high group score). Sanctioning costs *you* personally, but not sanctioning disorder costs the *group*.
  *   **Round 1:** Visitors are blind to the rules. They must infer them from Local reactions.
  *   **Round 2:** Swap roles. Visitors now know the rules. Locals get new justification cards (some become cynical about the rules).

  ***

  # Part 2: Honesty Check — What Will Go Wrong

  You asked for candour. Here is where this specific design usually fractures in a non-academic setting.

  **1. The "Gamification" Trap**
  *   **The Risk:** Your group are problem-solvers. In Round 1, Visitors will treat the conventions as a logic puzzle to be cracked for token efficiency, not a moral dilemma. They will calculate the cost of the 'shush' versus the cost of silence.
  *   **The Fix:** In the briefing, explicitly forbid talk of "optimisation." Tell them: *"Play this as if you care about being a good guest, not as if you are trying to leave Velmara with the most tokens. If I hear you discussing 'token efficiency', I will pause the game."*

  **2. The Anger Spike (The Split)**
  *   **The Risk:** 'The Split' (tipping analogue) often generates genuine irritation rather than philosophical curiosity. A Visitor might feel morally superior refusing to pay, while a Local (playing a server) might feel personally attacked by the refusal, even if it's roleplay.
  *   **The Fix:** Pre-brief the Locals on 'The Split'. Tell them: *"If a Visitor refuses, do not act angry. Act disappointed or weary. This isn't a conflict; it's a tragedy of structure."* This keeps the temperature down for the debrief.

  **3. The Time Crunch**
  *   **The Risk:** 90 minutes vanishes. If Round 1 runs long, you will rush the debrief. The debrief is the actual philosophy; the game is just the prompt.
  *   **The Fix:** Hard stop Round 1 at 20 minutes, even if mid-scenario. Round 2 is less important than Round 1 for the 'blind' experience. If you must, cut Round 2 to 10 minutes or skip it entirely to ensure 35 minutes for discussion.

  **4. Local Apathy**
  *   **The Risk:** Locals might not want to spend their Social Capital to sanction. If no one enforces 'The Gate' or 'The Hush', the Visitors feel no pressure.
  *   **The Fix:** Give Locals a private incentive. *"The Local with the highest Social Capital at the end chooses the topic for next month."* Give them a stake in enforcement.

  ***

  # Part 3: Limitations — What You Must Supply

  The game cannot reproduce the **weight of history** or the **fear of genuine ostracisation**.

  1.  **No Real Consequences:** In Velmara, a Visitor can be 'rude' and leave with their dignity intact. In reality, breaking a norm might mean you are denied service, reported to police, or socially isolated. You must remind the group in the debrief that *real* obligations often carry teeth that Velmara lacks.
  2.  **No Cultural Empathy:** Visitors in the game don't *feel* the beauty of 'The Hush'. They just see it as a restriction. You need to ask: *"Does the aesthetic or spiritual value of a local custom create an obligation to respect it, even if it's impractical?"*
  3.  **The Exit Option:** In the game, Visitors can theoretically walk away. In reality, power dynamics (visa status, economic dependence) often remove the option to leave. You must introduce the variable of **dependency**. *"Does your obligation change if you are a tourist (leaving in a week) versus an expat (living here for years)?"*

  ***

  # Part 4: The Committed Debrief Notes

  *Do not facilitate this neutrally. Your group wants an argument, not a hug. Here is the stance I recommend you take. It is defensible, but it is not uncontroversial. Use this to provoke them.*

  ### The Core Distinction: Harm vs. Harmony
  My position is that moral obligation for a visitor rests on **preventing harm**, whereas local convention often rests on **maintaining harmony**. You are obliged to the former, but only requested to the latter.

  ### 1. The Hush (Coordination)
  *   **Verdict:** **Not Morally Obligatory.**
  *   **Defence:** This is a coordination convention masquerading as a moral virtue. Locals claim noise "pollutes the air," but that is metaphorical. Unless your voice physically damages hearing or prevents emergency communication, silence is an aesthetic preference, not a duty.
  *   **The Trap:** Locals will argue that breaking it causes *social* harm (distress to others).
  *   **Counter-Argument:** Mere offence is not harm. If the local culture is fragile enough that a loud voice breaks it, the culture is the problem, not the voice. You owe them politeness, not silence.
  *   **Facilitator Prompt:** *"Who stayed quiet because they thought it was wrong to be loud, versus who stayed quiet because they didn't want to be shushed? If the shushing stopped, would the obligation remain?"*

  ### 2. The Split (Exploitative System)
  *   **Verdict:** **Obligatory (with resentment).**
  *   **Defence:** This is the hardest one. The system is rotten. However, the worker is currently hostage to it. Refusing to pay the 'Split' does not punish the State or the Owner; it punishes the server. Until the system is changed, the visitor is morally entangled. To withhold the money is to use the worker as a means to your own moral purity.
  *   **The Trap:** Visitors will argue, *"I shouldn't prop up a bad system."*
  *   **Counter-Argument:** You aren't propping it up; the State is. You are merely mitigating the damage the State is causing *right now*. Pay the tithe, then write to the Mayor.
  *   **Facilitator Prompt:** *"Is it better to be a clean-handed visitor who leaves the waiter hungry, or a complicit visitor who ensures they eat?"*

  ### 3. The Line (Fairness)
  *   **Verdict:** **Genuinely Obligatory.**
  *   **Defence:** Queueing is not cultural; it is universalisable fairness. It relies on the Kantian idea that if everyone jumped the queue, the system collapses. It applies in Velmara, London, or Tokyo. A visitor has no right to prioritise their time over a local's time.
  *   **The Trap:** *"But I'm only here for a day."*
  *   **Counter-Argument:** That makes it worse. You are extracting value from their patience.
  *   **Facilitator Prompt:** *"Did anyone feel the queue rule was 'Velmari'? Or did it feel like a rule for anywhere? If it's universal, is it really a local convention?"*

  ### 4. The Gate (Extraction)
  *   **Verdict:** **Not Obligatory.**
  *   **Defence:** This is discrimination based on status. "When in Rome" applies to customs, not to robbery. A convention that exists solely to transfer wealth from the outsider to the insider without reciprocal value is not a norm; it is a tax without representation.
  *   **The Trap:** Locals will argue, *"It's the law of the land."*
  *   **Counter-Argument:** Unjust laws do not create moral obligations, only prudential ones. You should evade 'The Gate' if you can do so safely. Obeying it is prudence (avoiding the fine), not morality.
  *   **Facilitator Prompt:** *"At what point does 'When in Rome' become 'When in Rome, do as the Romans say, even if they are picking your pocket'?"*

  ### Closing Challenge for the Group
  End on this: *"We agreed that 'The Split' was obligatory because a human being needed the money. We agreed 'The Gate' was not, because it was just revenue. But in the real world, tipping often funds the revenue of the owner, not the worker, and 'Heritage Fees' often fund the preservation of the culture you came to enjoy. The line is messier than Velmara suggests. Your homework is to identify one thing you do when travelling that you now suspect is actually 'The Gate' in disguise."*
