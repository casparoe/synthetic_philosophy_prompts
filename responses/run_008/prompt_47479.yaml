answer: |-
  When we reached for the slogan history is written by the victors last week, I think we all felt the immediate intuitive pull of it, but as I tried to write up the exchange for today, it became clear that the sentence is doing too much work at once. To really test our classmate's inference that Holocaust denial laws are merely the Allies protecting their own narrative, we need to disentangle the phrase into three distinct claims, ranging from a modest observation about resources to a radical claim about truth itself. The weakest and most plausible reading is material: victorious states simply have more money to fund archives, endow university chairs, and print schoolbooks for the defeated nations. In general historiography, this is hard to deny; the infrastructure of history costs money, and winners usually control the treasury. However, when we apply this to the Holocaust, the fit is awkward. Much of the definitive evidence we rely on today comes not from Allied propaganda but from the meticulous records kept by the Nazi bureaucracy itself, captured intact by the victors but authored by the perpetrators. Furthermore, if the victors simply wrote history to suit themselves, we would expect the Western Allies to have emphasized Nazi crimes immediately and consistently, yet during the early Cold War, realpolitik often led to the rehabilitation of Wehrmacht officers and the downplaying of atrocities to secure West Germany against the Soviet Union. This material reading might explain why Allied perspectives are prominent, but it does not support the inference that the standard account is false or that denial laws are protecting a fabrication; having more money to publish the truth does not make the truth contingent on that money.

  Moving to a stronger, more political reading, the slogan suggests that victors actively suppress or discredit inconvenient testimony from the losers to consolidate power. This is also historically plausible; show trials like Nuremberg did frame the narrative, and occupied nations often have their histories rewritten by occupiers. In the specific case of Holocaust denial laws in Germany, this reading seems to do the most work for our classmate's argument, as it frames criminalization as a tool of state power enforcing a specific memory. Yet even here, the timeline complicates the victors thesis. Most laws against Holocaust denial were not imposed by the Allies in 1945 but were adopted by democratic Germany decades later, often driven by domestic political consensus and a desire to protect human dignity rather than Allied decree. While this reading supports the idea that memory laws are instruments of power, it still fails to support the claim that the historical narrative itself is undeserving of confidence. Conflating the legal protection of memory with the empirical validity of history is a category error; a state can criminalize denial without that criminalization being the source of the historical evidence.

  The strongest and most radical reading, which I suspect is where the argument wants to rest, is epistemological: it claims that there is no objective history, only narratives imposed by power, so mainstream history is simply whatever the powerful settled on. This view treats truth as entirely contingent on victory. While this is a provocative stance in memory studies, it is historically untenable regarding the Holocaust because the empirical evidence exceeds the political will of the victors. The gas chambers were not built by Allied command, and the Wannsee Protocol was not drafted by Winston Churchill. If we accept this radical reading, then yes, our classmate's inference follows logically: the standard account deserves reduced confidence because it is merely an instrument of power. But accepting this reading requires us to dismiss the perpetrator records, the physical evidence, and the testimonies of victims as equally constructed by power, which most historians in this room would reject. The problem is that people who reach for this slogan in debate usually intend the radical reading to do the argumentative work while relying on the plausibility of the modest reading to gain assent. They start with the undeniable fact that winners fund schools, then quietly slide into the claim that winners fabricate truth. In the context of our seminar, recognizing this equivocation is crucial. If we treat the slogan as a material observation, it reminds us to check our sources and funding, but it doesn't invalidate the Holocaust. If we treat it as an epistemological claim, it invalidates all history, not just the Holocaust, and renders our own discipline impossible. The challenge for us is to acknowledge that while memory laws are indeed political acts shaped by power, the historical event they refer to rests on evidence that survives the victors just as much as the vanquished.
