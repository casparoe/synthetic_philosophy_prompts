answer: |-
  **Activity Design: The Unnamed Awakening**

  **Setup (5 mins)**
  Distribute 10 tokens to each of the 16 students. Explain the ledger: points contribute to participation grades. You will flip a fair coin out of sight. There are two phases: Control and Experimental.

  **Control Run (10 mins)**
  Students close eyes. Flip coin. Regardless of outcome, announce: "Interview Phase." Students open eyes, write credence in Heads (0–100%) and wager tokens at those odds. Collect slips. Reveal coin. Calculate average credence (should hover near 50%). Explain this establishes the baseline: without structural variation, the coin dictates credence.

  **Experimental Run (15 mins)**
  Reset tokens. Students close eyes. Flip coin.
  *Heads:* Announce "Interview Phase" once.
  *Tails:* Announce "Interview Phase," collect slips, say "Close eyes," wait 30 seconds, announce "Interview Phase" again.
  Students must treat every "Interview Phase" announcement as indistinguishable. They record credence and wager again.
  *Mechanism:* The "amnesia" is procedural. You enforce indistinguishability by standardizing the script and environment. Students submit anonymous slips each time.

  **Scoring (5 mins)**
  Reveal coin. Score wagers: If Heads, winners gain tokens; if Tails, losers lose. Crucially, on Tails, losses are doubled because there were two interviews.

  **Debrief (45 mins)**
  1.  **Data Comparison:** Compare Control credences (~50%) with Experimental credences. Likely, Experimental wagers skewed toward Tails (lower Heads credence) to avoid double-losses.
  2.  **The Dispute:** Ask why credences shifted. The coin fairness didn't change (Control proved that). The evidence changed: "I am being interviewed now."
  3.  **Mapping Reasoning:**
      *   *Halfer:* "The coin is fair. Being interviewed gives no new info about the coin." (Matches Control).
      *   *Thirder:* "There are three possible interviews (H-Mon, T-Mon, T-Tue). I am in one. Only one is Heads." (Matches Experimental betting strategy).
  4.  **Self-Location:** Highlight the question: "How many times am I having this conversation today?" This indexical fact drives the Thirder view.
  5.  **Reveal:** Name the "Sleeping Beauty Problem."

  **Predictable Failures & Mitigation**
  *   *Memory Leak:* Students will know if it's the second round because they remember the first. *Handle:* Acknowledge this openly. Instruct them to bracket their memory and act *as if* they forgot. The philosophical point holds even if the psychology is simulated.
  *   *Betting vs. Credence:* Students may bet Thirder (to save points) but claim Halfer credence. *Handle:* Separate the questions. Ask "What do you believe?" then "What do you bet?" Highlight the tension.
  *   *Coordination:* Students might signal each other. *Handle:* Strict no-talk rule during eyes-closed phases.

  **The Unreproducible Feature**
  Be plain: You cannot manufacture genuine first-person uncertainty about temporal location. They know class is 75 minutes; they know you just spoke. You must ask them to *imagine* the loss of temporal indexicals. The activity demonstrates the *logic* of self-locating belief, not the phenomenology. The friction they feel—the artificiality of the amnesia—is actually useful: it mirrors the philosophical discomfort with discarding self-knowledge. Tell them: "The problem isn't that you remember the last round; the problem is imagining a world where that memory doesn't exist. That imaginative leap is the entire problem."
