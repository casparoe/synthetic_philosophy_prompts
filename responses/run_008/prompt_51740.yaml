      **Activity Design: The Unnamed Awakening**

      **Setup (5 mins)**
      Distribute 10 tokens to each student. Explain the ledger: points contribute to participation grades. You will flip a fair coin out of sight. There are two phases: Control and Experimental.

      **Control Run (10 mins)**
      Students close eyes. Flip coin. Regardless of outcome, announce: "Interview Phase." Students open eyes, write credence in Heads (0–100%) and wager tokens (even odds). Collect slips. Reveal coin. Calculate average credence (should hover near 50%). Explain this establishes the baseline: without structural variation, the coin dictates credence.

      **Experimental Run (15 mins)**
      Reset tokens. Students close eyes. Flip coin.
      *Heads:* Announce "Interview Phase" once.
      *Tails:* Announce "Interview Phase," collect slips, say "Close eyes," wait 30 seconds, announce "Interview Phase" again.
      Students must treat every "Interview Phase" announcement as indistinguishable. They record credence and wager again.
      *Mechanism:* The "amnesia" is procedural. You enforce indistinguishability by standardizing the script and environment. Students submit anonymous slips each time.

      **Scoring (5 mins)**
      Reveal coin. Score wagers: If Heads, winners gain tokens; if Tails, losers lose. Crucially, on Tails, losses are doubled because there were two interviews.

      **Debrief (45 mins)**
      1.  **Data Comparison:** Compare Control credences (~50%) with Experimental credences. Likely, Experimental wagers skewed toward Tails (lower Heads credence) to avoid double-losses.
