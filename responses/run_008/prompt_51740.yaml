          *   *Amnesia Proxy:* Students submit answers anonymously via slip or app. The instructor tells them "You are now being interviewed." They don't know if it's Interview 1 or 2 because the instructor shuffles the process.
          *   *Actually, simpler:* Divide the class into two temporal phases without them knowing which phase they are in? No, they are all there.
          *   *Refined Mechanism:* The "Amnesia" is simulated by the instructor collecting responses and telling them "This is an interview." On Tails, the instructor collects responses twice. On Heads, once. The students don't know if the collection they are participating in is the first or second collection *if* there are two.
          *   *Wait, the prompt says:* "design a mechanism that stands in for the amnesia, so that a student cannot tell which of their own interviews this one is."
