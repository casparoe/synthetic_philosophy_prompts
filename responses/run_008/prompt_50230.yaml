answer: |-
  The real patterns view survives these exposures only by conceding that ontology is strictly gradient and stance-relative, which insulates it from falsification but costs any claim to capturing folk-psychological essences.

  Regarding the overgeneration problem, this is not fatal but forces a shift from Dennett's original informal formulation to the information-theoretic refinement offered by Ladyman and Ross. For the view to hold, "compression" must be formalized via metrics like AIC or BIC that penalize model complexity alongside error; if you cannot define a metric where the intentional stance consistently outperforms the physical stance on noise-bearing data, the view collapses. The cost of absorbing this is that "realness" becomes entirely dependent on the chosen metric, meaning if a future complexity measure shows that belief-attribution is less efficient than brute physical modeling for certain agents, those agents literally lack beliefs. This isn't ad-hoc qualification so long as you accept that "real" means "informationally efficient," but it does mean the view cannot guarantee the reality of beliefs antecedent to the calculation.

  On the undergeneration side, where a system is predictable via the design stance without intentional vocabulary, the view can legitimately absorb this because Dennett explicitly treats belief attribution as gradient rather than binary. What would make the view wrong here is not the existence of such cases, but the discovery that the intentional stance *never* offers a computational advantage over the design stance for any complex system; if beliefs never buy predictive power beyond functional description, they are not real patterns. The cost of absorbing the specific case you mention is accepting that some humans (or sophisticated AI) might operate without "beliefs" in the real-patterns sense, which clashes with folk intuition but is consistent with the theory's eliminativist leanings. Defenders pay for this resilience by surrendering the idea that "belief" names a natural kind with a sharp boundary.

  The neural network interpretability case is awkward but not fatal, provided the view insists on robustness across noise as a criterion for reality. If every transient activation cluster counts as a pattern, the ontology explodes; to avoid this, defenders must argue that only features stable under intervention and context-shift are real, which aligns with current causal interpretability research. The view fails if it turns out that high-level behavioral prediction is possible without any stable intermediate features (i.e., if the system is truly holistic with no compressible sub-structures), because then the intentional stance would have no patterns to latch onto. The cost of absorbing the current state of interpretability is acknowledging that human mental states might be vastly more distributed and polysemantic than folk psychology assumes, potentially making the term "belief" useful only as a high-level gloss rather than a description of internal structure.

  Overall, the view's survival is due to genuine resilience in its core metaphysical commitment—that existence is a matter of predictive utility—rather than bolted-on qualifications, provided you accept that commitment. It looks ad-hoc only if you expect it to preserve folk-psychological categories while simultaneously subjecting them to information-theoretic scrutiny; if you allow the scrutiny to eliminate or reshape those categories, the view is consistent. The insulation is a defect only if you think metaphysics should constrain science; if you think metaphysics should track science's best predictive tools, the insulation is a feature.

  On the literature status: It is settled among specialists that Dennett's original 1991 formulation was too loose regarding "compression," leading to the Ladyman and Ross (2007) refinement which is now the standard for serious defense. However, it is live disagreement whether normative constraints (as argued by Baker) are required alongside predictive efficiency to fix the content of patterns, and whether information-theoretic metrics can ever fully capture the normativity inherent in intentional attribution. Textbooks often present Dennett's view as static, missing this shift toward ontic structural realism and the ongoing debate over whether predictability alone is sufficient for content fixation.
