  3.  **Analyze Lead 1: Overgeneration (Gerrymandering):**
      *   *Objection:* Any finite data set can be "compressed" by a list. "Coin flips + Mars longitude" predicts itself but supports no novel projection.
      *   *Dennett's Defense:* Real patterns must support *novel* prediction across contexts, not just retrodiction. They must be robust under noise.
      *   *Vulnerability:* The definition of "novelty" and "context" is crucial. If "context" is defined too loosely, gerrymandered patterns survive. If defined too tightly, it looks circular ("real patterns are the ones we like").
      *   *Verdict:* Not fatal, but requires a robust theory of *projectibility* (Goodman-style). If RPV relies on an undefined notion of "natural kind" to filter patterns, it collapses into realism about natural kinds.
      *   *Live Disagreement:* Ladyman & Ross (*Every Thing Must Go*) sharpen this using information theory (AIC/BIC). They argue Dennett was too loose. So, the "compression" metric needs formalizing.
      *   *Cost:* RPV becomes dependent on specific information-theoretic metrics. If those metrics yield counterintuitive results (e.g., denying beliefs because a physical model is slightly more compressed), RPV wobbles.

  4.  **Analyze Lead 2: Undergeneration (Design Stance Sufficiency):**
      *   *Objection:* If a system is predictable via Design Stance (function) without Intentional Stance (belief/desire), does it have beliefs?
      *   *Scenario:* A simple robot or a heavily conditioned human.
      *   *Dennett's Defense:* Beliefs are attributed when the Intentional Stance is the *most efficient* predictive tool. If Design is better, then beliefs aren't the right granularity.
      *   *Vulnerability:* This bites the bullet. Dennett *would* say such a system lacks full-blooded beliefs (maybe "proto-beliefs").
      *   *Cost:* It makes belief attribution gradient and stance-relative. This clashes with folk intuition (binary belief), but fits Dennett's eliminativist-leaning realism.
      *   *Verdict:* Absorbable, but costs intuitive alignment. It's not fatal because RPV *expects* ontology to shift with granularity. The risk is if *no* stance ever wins out uniquely (indeterminacy).

  5.  **Analyze Lead 3: Neural Networks (Interpretability):**
