      *   *Live Disagreement:* Current ML interpretability debates (polysemanticity, superposition) challenge the idea of neat "features." If the "patterns" are distributed and non-linear, does the Intentional Stance still apply?
      *   *Verdict:* Awkward. RPV needs to explain why *some* NN patterns count as mental states and others don't, without smuggling in folk psychology.
      *   *Cost:* RPV risks becoming a post-hoc label for whatever science finds, rather than a constraint on science.

