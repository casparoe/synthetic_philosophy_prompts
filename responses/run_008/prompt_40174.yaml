      Your diagnosis is correct. This is not a verbal dispute about the definition of "lying," but a substantive clash regarding the *locus of moral wrongness*. The stalemate persists because each side prioritizes a different moral value without acknowledging the other's hierarchy.

      The **practice-based view** commits to the integrity of communication as a social institution. For them, assertion is a constitutive rule-governed practice. The wrong is *betrayal*: violating the implicit contract that assertions aim at truth. Their move protects the reliability of language itself. Consequently, in your witness case, the witness is indeed "cleaner" regarding the specific norm of assertion, even if the outcome is deleterious. They might concede she violated a broader duty of cooperation, but not the specific duty of truthfulness.

      The **effect-based view** commits to the autonomy and epistemic integrity of the hearer. For them, the wrong is *manipulation*: intentionally corrupting another's belief state. The method is incidental; the violation of cognitive agency is central. In the witness case, they see no moral daylight between the lie and the engineered truth. Both are assaults on the hearer's grasp of reality.

      Is the debate verbal? No. If it were merely about the word "lying," they could agree to call both "deception" and move on. But they disagree on whether the *method* carries independent moral weight. The practice theorist sees the lie as a unique category of wrong (forgery); the effect theorist sees it as merely one tool among many for the same wrong (theft of truth).

      Does the witness case break the tie? No. It is a perfect Rorschach test. The practice theorist sees a rule-follower who exploited a loophole (legally clean, morally ambiguous). The effect theorist sees a deceiver who hid behind semantics (morally dirty). Each side re-describes the case to fit their locus of wrongness. The witness case confirms the structural divergence rather than resolving it.

      What counts as progress? Stop asking "Which is worse?" and start asking "Which duty is in play?" Progress requires a hybrid framework acknowledging two distinct wrongs: a *specific* wrong of lying (violating the norm of assertion) and a *general* wrong of deceiving (violating the duty of non-maleficence regarding belief). Lying is often worse because it compounds the general wrong of deception with the specific wrong of norm-violation. However, in contexts like your witness case, where the norm is legally circumscribed, the general wrong of deception may dominate.

