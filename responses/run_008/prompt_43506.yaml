          2.  Present the Menu of Theses (numbered, with Empirical/Conceptual/Evaluation/Interlocutor mapping).
          3.  Address the "Looseness" verdict.
          4.  Critique/Expand User's Framing.
      *   *Key Check:* Ensure empirical vs. conceptual separation is visible. Flag disputes (e.g., Graeber/Wengrow vs. Diamond/Scott).

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate "agriculture" with "civilization." They are related but distinct in the literature (e.g., Göbekli Tepe).
      *   *Correction:* Ensure the "Worst Mistake" attribution is clear (Jared Diamond, *Discover Magazine*, 1987). This adds weight to the "popular science writer" the student forgot.
      *   *Nuance:* The "Affluent Society" thesis (Sahlins) is about *wanting little*, not just *having little*. Distinguish between objective caloric intake and subjective leisure.
      *   *Nuance:* The "Mistake" language is teleological. Highlight this conceptual flaw.

  9.  **Final Review against Constraints:**
