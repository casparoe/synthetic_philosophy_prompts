answer: |-
  ### Brainstorming Candidates

  1.  **The Rural Clinician (Burnout vs. Non-Abandonment):** A sole-provider therapist in a remote area reaches clinical burnout. Act Consequentialism (AC) mandates stopping immediately to prevent errors (negative marginal utility). Deontology mandates staying until patients are stabilized (duty of non-abandonment).
      *   *Critique:* AC can argue that the *practice* of therapy relies on trust, so abandoning patients undermines the system. It requires careful stipulation to ensure AC doesn't absorb the duty via "rule worship" or long-term trust calculations.

  2.  **The Inherited Promise (Fidelity vs. Optimization):** You promised a dying friend to personally tutor their child. AC calculates you are a mediocre tutor; hiring a pro and donating the surplus saves more lives. Deontology binds you to the personal commitment.
      *   *Critique:* AC can argue the promise was to *ensure* education, not necessarily to do it personally. It risks becoming a semantic debate about the content of the obligation rather than a structural clash.

  3.  **The Tainted Donation (Constraint vs. Efficiency):** A shelter director can accept a large anonymous donation from a corrupt source (efficient, saves lives) or refuse it (constraint against complicity) and raise the funds manually (arduous). AC takes the money and stops at the burnout threshold. Deont refuses the money and works past the threshold to cover the shortfall.
      *   *Critique:* This is the strongest candidate. It cleanly isolates the **constraint** (blocking the efficient route) and the **undertaken obligation** (keeping the shelter open) as structural multipliers of burden. It avoids the "semantic promise" trap of Candidate 2 and the "systemic trust" absorption of Candidate 1.

  **Winner:** **The Tainted Donation.** It best satisfies the requirement that the demandingness flows from structural features (constraints blocking cheap routes) rather than temperament.

  ***

  ### The Scenario

  You are the director of a homeless shelter facing a sudden budget shortfall that will force you to close in one month, displacing fifty residents. An anonymous foundation offers a grant that covers the deficit entirely, but you discover the funds originate from a human trafficking ring; the donation is legal, untraceable, and refusing it guarantees the closure. An Act Consequentialist analysis suggests taking the money: the immediate harm of the trafficking is unaffected by your refusal, and the shelter's good outweighs the abstract complicity. However, you operate under deontological constraints against benefiting from grave injustice and a fiduciary duty to your residents that forbids abandonment. The grant is off the table. To keep the shelter open, you must personally launch an emergency fundraising campaign, working 80-hour weeks for six months to replace the funds, pushing you well past the point of sustainable burnout.

  ***

  ### Analysis

  **(1) The Verdicts**
  *   **The Act Consequentialist (AC):** Takes the grant. The moral mathematics are clear: 50 people housed vs. 50 people on the street. The trafficking ring's activities are causally independent of this specific transaction (the money is already made). The AC director secures the shelter's future with minimal personal cost. Crucially, the AC has a **principled stopping point**: they will fundraise only until the marginal utility of their labor dips below zero (e.g., when their exhaustion leads to management errors or health costs that outweigh the housing provided). Once the gap is filled efficiently, they rest.
  *   **The Deontologist:** Refuses the grant. Accepting it violates a negative duty (non-complicity in injustice) and potentially treats the residents as mere means to a "good outcome" by compromising the moral integrity of the institution. Because the "cheap" route is blocked by constraint, the Deontologist must take the "expensive" route: personal labor. Furthermore, the undertaken obligation to the residents (non-abandonment) binds them to keep the shelter open *regardless* of the personal cost, provided it doesn't reach the level of impossibility. They are required to work the 80-hour weeks past the point where an AC would have stopped, bearing a significantly heavier burden to achieve the *same* outcome (keeping the shelter open) without the moral stain.

  **(2) The Structural Feature Doing the Work**
  The demandingness arises from the **interaction of a negative constraint and a special obligation.**
  *   The **constraint** (do not benefit from injustice) blocks the low-cost, high-efficiency solution (the grant). This forces the agent into a high-cost labor channel.
  *   The **special obligation** (fiduciary duty to current residents) prevents the agent from simply closing the shelter when the efficient route is blocked.
  *   In standard cases, constraints *reduce* demandingness (you don't *have* to save everyone). Here, the constraint eliminates the *efficient* way of meeting an existing obligation, thereby *increasing* the personal cost of meeting that obligation.

  **(3) The Removal Test**
  If we remove the **constraint** (allow the Deontologist to accept tainted money), the case collapses back to the standard story: the Deontologist takes the grant, works less, and is less demanding than the AC (who might still worry about long-term reputational effects).
  If we remove the **special obligation** (allow the Deontologist to close the shelter if funds aren't found), the Deontologist simply closes the shop and walks away. This would be *less* demanding than the AC (who might argue for continuing to fight for the greater good).
  It is only the *combination*—being forced to achieve a specific goal (keep the shelter) while being forbidden from using the most efficient means (tainted money)—that generates the reverse demandingness.

  **(4) The Deontologist's Fight-Back & Verdict**
  The Deontologist's best defense is to appeal to the **latitude of imperfect duty** or a **threshold of self-preservation**. They might argue: "My duty to the residents is binding, but not suicidal. If the fundraising requires sacrificing my health past a certain threshold, I am permitted to close the shelter."
  *   **Honest Verdict:** This saves the Deontologist from absurdity but **relocates the demandingness**. It moves the debate from "How much must I sacrifice?" to "Where exactly is the threshold of permissible self-sacrifice?" The AC has a clear metric for their threshold (marginal utility = 0). The Deontologist now faces the difficult task of defining a non-arbitrary threshold for "too much cost" without collapsing back into consequentialist calculation. If they set the threshold too high, they are still more demanding than the AC; if they set it too low, they risk violating the very duty that motivated the stance. The structural pressure remains, even if the absolute limit is adjusted.

  ***

  ### Note on Rule Consequentialism (RC)
  This case offers a fascinating pivot for your seminar: **Rule Consequentialism (RC) likely matches the Deontologist.**
  An RC would ask: "What rule regarding donations maximizes well-being?" A rule like *"Shelters must not accept funds known to originate from severe rights violations"* likely produces better long-term outcomes (maintaining public trust, not incentivizing laundering, preserving the moral integrity of the aid sector) than a rule allowing it.
  Therefore, the RC would also refuse the grant and endure the hard fundraising.
  *   **Teaching Point:** This shows that the "Demandingness Objection" is often specific to *Act* Consequentialism. If your students think Deontology is the only home for "integrity" or "constraints," showing them that RC can generate the same demanding verdict (via optimal rules) unsettles the idea that constraints are uniquely deontological. It suggests the "monster" isn't consequentialism per se, but *act*-optimization without regard for institutional integrity.
