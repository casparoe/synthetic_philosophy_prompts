answer: |-
  The apparent agreement evaporates because Everettian branches are non-maximal concrete parts of a single physical history, whereas Lewisian worlds are maximal concrete entities spanning the entirety of logical space.

  **Restatement of Lewis in Everettian Vocabulary**

  To translate Lewis into your formalism, we must treat each Lewisian world as a distinct universal wavefunction $|\Psi\rangle_L$ rather than a branch within a single $|\Psi\rangle_E$.

  1.  **Concreteness and Indexical Actuality:** For Lewis, each $|\Psi\rangle_L$ is as concrete as your observed reality; there is no abstract "map" versus "territory" distinction between possible and actual worlds. "Actual" is purely indexical: when you say "actually," you refer to the specific $|\Psi\rangle_L$ you inhabit, just as "here" indexes your spatial location. In your vocabulary, this means every decohered history that *could* exist does exist as a separate universal state, not merely as a component of one superposition.
  2.  **Isolation:** Lewisian worlds are spatiotemporally isolated primitives. No signal, particle, or entanglement can ever exist between $|\Psi\rangle_{L1}$ and $|\Psi\rangle_{L2}$. In your terms, this is stricter than decoherence: it is not that the overlap $\langle \Psi_{L1} | \Psi_{L2} \rangle$ is effectively zero due to environmental monitoring; it is that the Hilbert spaces themselves are disjoint by definition, with no common past interaction Hamiltonian.
  3.  **Counterpart Theory:** Lewis denies transworld identity. You do not exist in other worlds; rather, counterparts exist who resemble you closely. In Everettian terms, this rejects the view that a pre-branching observer splits into successors. Instead, for every branch where a measurement outcome differs, there is a distinct individual in a distinct world who is qualitatively similar to you but numerically distinct, handling modal claims like "I could have measured spin-up" via resemblance rather than identity.
  4.  **Recombination:** Lewis's principle of plenitude states that any arrangement of duplicate parts that is logically consistent exists as a world. In your vocabulary, this means the "space of worlds" includes every Hamiltonian, every dimensionality, and every initial condition that does not entail a logical contradiction, regardless of whether they are solutions to *our* Schrödinger equation.

  **Residue Report**

  **(a) Isolation: Primitive vs. Dynamical**
  Lewis's isolation is metaphysical and primitive; worlds are isolated because being spatiotemporally related is part of the definition of being in the *same* world. Your branches are isolated dynamically and emergently; they share a common past light cone and are components of a single entangled state, rendered effectively independent only through decoherence timescales and the stability of pointer states. This difference is substantial: Lewisian isolation is absolute and necessary, whereas Everettian isolation is contingent and approximate (interference revival is physically possible, however improbable). Consequently, Lewis avoids the "preferred basis problem" by fiat (worlds are defined by their isolation), whereas you must derive the branching structure from the Hamiltonian and environmental interaction, leaving your "worlds" ontologically vague compared to Lewis's crisp plurality.

  **(b) Recombination vs. Hilbert Space Structure**
  The structure of the "space of worlds" differs fundamentally, and this difference dismantles the utility of Everettianism for Lewisian modal analysis. Lewis requires plenitude to analyze modality: a proposition is possible if and only if it is true at some world. Your branches are constrained by the specific Hamiltonian and initial conditions of our universe; they do not contain worlds where the fine-structure constant differs or where gravity is non-quantized, unless your formalism is extended to a landscape multiverse. Therefore, Everettian branches cannot ground logical or nomological possibility in the Lewisian sense. Furthermore, Lewis lacks a natural measure over worlds (the "problem of probability"), whereas your branches carry Born-rule weights. For Lewis, all worlds exist equally; for you, branches exist with different amplitudes. This structural difference prevents the translation of Lewis's counterfactual analysis, which relies on similarity ordering across a plenitude of variations, whereas your branching offers only variations permitted by unitary evolution of a specific state.

  **(c) Unique Elements and the Ersatz Question**
  There are elements in Lewis with no Everettian counterpart, specifically worlds with different fundamental laws and the rejection of branching identity in favor of counterparts. There are elements in Everett with no Lewisian counterpart, specifically the continuous amplitude measure and the common causal history of branches. Regarding the "ersatz" charge: Lewis defines ersatz worlds as abstract representations (e.g., maximal consistent sets of propositions) rather than concrete entities. Your branches are **genuine concrete entities** by Lewis's lights—they are made of fields and particles, not propositions. However, they fail to be Lewisian *worlds* because they are not maximal; a branch is a proper part of the universal wavefunction. Thus, Everettianism is not a form of Modal Realism but rather a form of **Actualist Pluralism** regarding parts of a single concrete maximum. The translation fails not because your vocabulary is insufficient, nor because Lewis was smuggling abstractions, but because Everettianism posits one concrete universe with many parts, while Lewis posits many concrete universes with no parts in common. The agreement was illusory: you share a commitment to concrete plurality, but disagree on whether that plurality constitutes the whole of reality or parts of a single whole.
