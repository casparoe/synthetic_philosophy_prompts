      *   *Let's check Move 4.* "Framework just goes silent." Yes, incompleteness. "Bolt on a rule... Maximin." Yes. "Just pessimism dressed up." It is a specific attitude. "Turns the set back into one precise ranking." It produces a complete ordering, yes. But the *belief state* remains imprecise. Ben is mostly right about the decision theoretic cost.

