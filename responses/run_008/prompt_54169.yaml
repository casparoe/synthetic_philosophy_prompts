answer: |-
  **MEMORANDUM**

  **TO:** The Investigations Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding the Final Report on the Automatic Writing Study

  **1. Recommendation**

  I recommend that the Committee adopt the second course of action proposed: the publication of the raw data and the full methodological record, accompanied by a neutral preface that explicitly withholds the Society's endorsement of the survival hypothesis. This publication should be completed within six months of our next meeting. Simultaneously, we should authorize the design of a prospective study with pre-registered scoring criteria, to commence only after the current data is made public.

  We must neither certify the findings as proof of communication nor suppress them as inconclusive. To do the former would betray our duty to rigor; to do the latter would betray our duty to inquiry.

  **2. The Sidgwickian Mandate**

  Our Society was founded on a specific ethical and epistemological tension articulated by Henry Sidgwick. He insisted that the question of survival be treated as an empirical matter, settled neither by a priori materialism nor by a priori faith. Sidgwick navigated between two fears: the fear of credulity, which accepts wonder without warrant, and the fear of dogmatism, which dismisses testimony without examination.

  Our task in this memo is to apply that tension to a dataset that is, by its nature, ambiguous. We possess twelve scripts containing veridical details that resist ordinary explanation, supported by a statistical analysis suggesting improbability by chance. Against this, we have methodological compromises: scoring criteria fixed after the fact, a cluster of successes among close associates, and evidence of the medium's physical proximity to information sources prior to specific sittings.

  Sidgwick's method requires us to weigh this not as a binary of "proof" or "disproof," but as a contribution to a cumulative record. However, this raises two distinct questions that this Committee must answer before voting.

  **3. Institutional Certification vs. Individual Belief**

  The first question is whether the standards for a learned society's public certification should differ from the standards a rational individual requires for private belief. Sidgwick spent his career torn between what the evidence warranted for him personally and what the Society could responsibly assert.

  An individual member, reviewing these twelve scripts in the context of their own experience, might rationally find the survival hypothesis to be the most plausible working explanation. The statistician on our committee maintains that even with conservative corrections, the aggregate is improbable on the hypothesis of chance. For an individual, this "residuum" of testimony may be sufficient to shift the burden of probability.

  However, the Society speaks with an institutional voice that carries weight beyond the individual. When we endorse a conclusion, we invite the public to rely on our vetting. If we endorse survival as a working hypothesis based on data where scoring criteria were fixed *post hoc*, we lower the barrier for certification below the standard required for scientific claims in any other field. Sidgwick resigned from leadership roles within our movement when he felt the Society's public stance outpaced its evidentiary security. We cannot afford to be more credulous than our founder. To endorse this report is to claim that the methodological flaws—the retrospective scoring and the potential for information leakage regarding the town visit—are negligible. They are not negligible. They are fatal to a claim of certification, even if they are not fatal to the interest of the data.

  **4. Aggregation and Selection Effects**

  The second question concerns Sidgwick's aggregation principle. He argued that while no single sitting should convince anyone, dismissing all of them at once requires a general assumption of unreliability that itself lacks evidence. The strength of our position relies on the accumulation of independent testimonies.

  However, this principle assumes that the testimonies are being weighed fairly. We must confront whether our aggregation principle has the resources to handle selection effects. We have roughly four hundred scripts. Twelve were rated as hits. The criteria for those hits were determined only after the scripts were read.

  The faction urging endorsement argues that the content of the twelve scripts stands on its own merit; the method of selection does not erase the veridical details. They argue that demanding pre-registered criteria in a field this exploratory is to impose a dogmatic refusal to examine the phenomena as they actually occur. They contend that if we wait for perfect methodology, we will never accumulate the very evidence Sidgwick demanded.

  The faction urging archiving argues the opposite: that the 388 scripts which did not hit must be counted against the hypothesis, not set aside as merely inconclusive. If we select the best dozen from a pool of four hundred after reading them, we are not demonstrating survival; we are demonstrating that in a large enough pool of vague statements, something memorable will always turn up. They argue that publishing this without a prospective follow-up invites the criticism that we are cherry-picking anomalies, thereby damaging the cumulative project we seek to advance.

  Both sides have merit. The endorsement faction is right that strict pre-registration can stifle discovery in nascent fields. The archiving faction is right that *post hoc* selection corrupts the statistical weight of the hits. But there is a third path. Sidgwick's accumulation principle relies on the transparency of the record. If we publish the raw data—the twelve hits *and* the 388 misses, along with the audit regarding the town visit—we allow the broader scientific community to weigh the selection effect for themselves. We contribute to the accumulation of evidence without falsely inflating its weight through institutional endorsement.

  **5. Consideration of Opposing Views**

  I must address the strength of the positions I am not recommending.

  To those who wish to publish with endorsement: You argue that the medium charged no fee, that no fraud was detected in supervision, and that the statistical improbability remains even after correction. You argue that the Society's purpose is to advocate for the legitimacy of these inquiries, and that a neutral stance is indistinguishable from skepticism. I acknowledge the force of this. If we treat this phenomenon as real, treating it with the cold detachment of a null hypothesis may feel like a betrayal of the subject matter. Furthermore, if the statistician is correct, we are sitting on a finding that challenges the materialist consensus. To withhold endorsement is to delay a potential paradigm shift.

  To those who wish to archive the data and begin anew: You argue that the methodological contamination is too severe. The medium's presence in the town prior to one of the best scripts suggests normal acquisition, however unintentional. The *post hoc* scoring makes the "hits" scientifically unusable. You argue that publishing this invites ridicule that will poison the well for the prospective study. I acknowledge this risk. Our credibility is our currency. If we publish data that is easily dismantled by external critics due to the scoring protocol, we may hinder the very acceptance we seek.

  **6. Resolution**

  Despite these valid concerns, neither extreme satisfies the Sidgwickian balance.

  Endorsement fails because it conflates the "working hypothesis" of an individual researcher with the "certified conclusion" of an institution. We cannot endorse a hypothesis derived from criteria that were not fixed in advance. To do so would be to prioritize our desire for a result over the integrity of our method.

  Archiving fails because it treats the data as worthless rather than flawed. The twelve scripts remain part of the global residuum of testimony. To hide them because they are imperfect is to engage in the very dogmatic refusal Sidgwick warned against. It suggests that unless evidence is perfect, it is non-existent.

  Therefore, we must publish the data without endorsement. This course acknowledges the reality of the findings (satisfying the demand to examine) while withholding the stamp of approval (satisfying the demand against credulity). It treats the report not as a verdict, but as a exhibit in the ongoing trial.

  **7. Time Frame and Next Steps**

  I propose the following timeline:
  1.  **November Meeting:** Vote to adopt the recommendation of publication without endorsement.
  2.  **December – February:** Redact personal identifiers of the sitters to protect privacy, while retaining all data relevant to the scoring and the audit findings.
  3.  **March:** Release the report publicly, accompanied by a statement of methodological limitations drafted by this Committee.
  4.  **April:** Convene a sub-committee to design the prospective study, with scoring criteria fixed prior to the first sitting, to begin recruitment by year's end.

  This path honors our history. It admits that we do not know the answer, but insists that the question is worth asking, provided we ask it honestly.

  I look forward to discussing this with you next month.
