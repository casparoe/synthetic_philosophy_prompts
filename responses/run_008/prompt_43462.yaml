  **Diagnostic: Which Position on Linguistic Relativity Do You Actually Hold?**

  **Q1. The Russian Blues (Online/Offline):** Russian speakers distinguish blue shades faster. Does this count as linguistic shaping if no speech is planned?
  *   **No:** Effects require speech preparation. → **Leaf 1: Universalist ("Thinking for Speaking")**.
  *   **Yes:** Offline effects exist. → **Q2**.

  **Q2. The Grammatical Gender (Degree/Kind):** Spanish/German speakers personify "bridge" differently. Does language make some traits *unthinkable* or merely salient?
  *   **Unthinkable:** Some contents are unavailable. → **Leaf 2: Strong Relativist**.
  *   **Salient:** All thoughts possible; attention nudged. → **Q3**.

  **Q3. The Permanence (Permanence):** Do these offline nudges persist when the language is not in use?
  *   **Yes:** Fixed cognitive trait. → **Leaf 3: Permanent Relativist**.
  *   **No:** Active only during use/context. → **Leaf 4: Moderate Neo-Whorfian**.

  **Commentary & Diagnostics:**

  *   **Indistinguishable Leaves:** The **Deflationary View** ("effects are artifacts of language being online") occupies Leaf 1 alongside the Universalist. Both deny offline effects; they differ only rhetorically (packaging vs. artifact). This tree cannot genuinely separate them.
  *   **Empty Space:** The combination "Online Only + Unthinkable" is incoherent. If a thought is unavailable offline but available during speech preparation, it is not genuinely unthinkable.
  *   **Unexplored Leaf:** Leaf 3 (Permanent Relativist) is largely unexplored. It implies monolingual cognition is fixed by early acquisition, unlike bilinguals who may switch contexts.
  *   **Distinctions:** All three distinctions do work. Online/Offline splits the major camps. Degree/Kind isolates the Strong view. Permanence separates Moderate from Permanent.

