  # Diagnostic Instrument: The Genealogical Space

  **Instructions:** Proceed through the following nodes in order. Answer each question based on your reflective intuitions about the case presented. Do not consult the Key until you have reached a terminal leaf.

  ### Node 1: The Food Disgust Warm-up
  **Case:** Imagine you feel a strong visceral disgust at a specific food. You later learn with certainty that this aversion was caused by a single incident of childhood illness unrelated to the food's actual properties. Despite knowing this, your disgust remains undiminished, and you judge that avoiding the food is still the right thing for you to do. The causal story explains the feeling but does not undermine the authority of the avoidance.

  **Question:** Is a moral judgment (e.g., "cruelty is wrong") relevantly similar to this food aversion, such that learning its causal history would leave its normative authority intact?

  *   **Yes:** Go to **Node 2**.
  *   **No:** Go to **Node 3**.

  ---

  ### Node 2: The Vindicatory Filter
  **Case:** Consider a social practice, such as promising, that arose historically to solve a coordination problem among humans with limited cognitive resources. You learn that the practice exists *because* it served this need.

  **Question:** Does this causal explanation merely explain why the practice exists, or does it provide a reason to continue endorsing it?

  *   **Merely explains (History is irrelevant to authority):** Terminate at **Leaf A**.
  *   **Provides reason (History confirms authority):** Terminate at **Leaf B**.
  *   *[Diagnostic Note: There is no occupant for the view that history explains the practice but actively undermines it while answering "Yes" at Node 1. This would be incoherent: if the food case shows history is irrelevant, it cannot undermine.]*

  ---

  ### Node 3: The Epistemic Corruption Split
  **Case:** You investigate the origin of a moral belief (e.g., "equality is good") and find it arose from the resentment of the powerless against the powerful. The believers were motivated by a desire to harm their superiors, not by a perception of moral fact.

  **Question:** Does this origin story show that the belief is *epistemically defective* (it would have been held even if false), or merely that the originators were *unflattering people* (their motives were ugly, but the belief might still be true)?

  *   **Epistemically defective:** Go to **Node 4**.
  *   **Unflattering originators:** Go to **Node 5**.
  *   *[Diagnostic Note: The region combining "Unflattering originators" with "History is irrelevant" (Node 1: Yes) is empty. If history is irrelevant, the unflattering nature of the origin cannot matter.]*

  ---

  ### Node 4: The Identity and Availability Split
  **Case:** Suppose you are convinced that your moral commitment to compassion is the result of a historical process that did not track truth. You now wish to abandon this commitment.

  **Question:** Is it practically available to you to simply stop holding this value, or is the value constitutive of your identity in a way that makes revision impossible (or a form of self-destruction)?

  *   **Available (I can revise my values):** Go to **Node 6**.
  *   **Unavailable (Values are identity-forming):** Terminate at **Leaf C**.
  *   *[Diagnostic Note: This split cuts orthogonally to epistemic questions. One could theoretically hold that values are false but unavoidable. This node locates the standard version of the position.]*

  ---

  ### Node 5: The Sauce and Palate (Type-Relativity)
  **Case:** Consider two types of people: the "Noble" (strong, life-affirming) who call their own traits good, and the "Slave" (weak, reactive) who call the Noble traits evil. This is analogous to two people tasting a sauce: one has a palate suited to spice, the other to blandness.

  **Question:** Is the Noble evaluation objectively truer than the Slave evaluation, or is each evaluation vindicated only relative to the type of person living it?

  *   **Objectively truer:** Go to **Node 6**.
  *   **Relative to type:** Terminate at **Leaf D**.
  *   *[Diagnostic Note: A position claiming "Unflattering origins" but "Objective truth" without a vindicatory history is unstable. It suggests the truth survived despite the origins, which usually pushes one back to Node 2 or forward to Node 6.]*

  ---

  ### Node 6: The Will to Truth (Self-Application)
  **Case:** The genealogist investigates morality using a drive for truth. However, this drive itself has a history: it evolved from a moral demand for honesty, which turned inward, eventually becoming an ascetic preference for truth over comfort, even over life itself.

  **Question:** Is the genealogist's own commitment to truth exempt from this genealogy, or is the will to truth the final descendant of the very ideal being critiqued?

  *   **Exempt (Truth is safe):** Terminate at **Leaf E**.
  *   **Not Exempt (Truth is suspect):** Terminate at **Leaf F**.

  ---

  ### Leaves

  **Leaf A:** The causal history of moral concepts is strictly irrelevant to their authority. Moral facts, if they exist, are independent of their discovery. The genealogy is a sociological footnote.

  **Leaf B:** The causal history shows that the practice answers to human needs it arose to serve. This functional fit confirms rather than undermines the authority of the practice, provided the needs persist.

  **Leaf C:** The genealogy shows the belief is epistemically defective, but the subject cannot abandon the value because it is constitutive of their identity. The result is a tragic recognition of error without the possibility of correction.

  **Leaf D:** The genealogy shows that moral values are not objective facts but expressions of a person's physiological and psychological type. A value is valid only for the type of life it enhances.

  **Leaf E:** The genealogy successfully debunks traditional morality as a fiction born of resentment, but the genealogist can retain the ordinary concept of truth to make this claim. We can revise our values in light of the truth.

  **Leaf F:** The genealogy debunks traditional morality, but the drive to uncover this truth is itself a symptom of the same moral sickness. The inquiry undermines its own authority, leaving no stable ground to stand on.

  ***

  # Key and Epistemic Annotation

  **Leaf A: Non-genetic Realist**
  *   **Characterization:** Settled. This is the standard Moorean or intuitionist response to genealogy.
  *   **Contestation:** None significant; this is the null hypothesis against which genealogy is measured.

  **Leaf B: Vindicatory Genealogy (Williams / Craig)**
  *   **Characterization:** Contested. While Williams explicitly argues for vindicatory genealogies, whether Craig's functionalist explanation of truth-telling counts as a *vindication* of the value or merely an explanation of its utility is debated.
  *   **Annotation:** I have folded Craig into this leaf. Some scholars argue Craig offers an expressivist explanation that dissolves the need for vindication, while others see it as a functional vindication. The tree treats them as occupying the same logical space regarding authority.

  **Leaf C: Tragic Debunker (Unnamed)**
  *   **Characterization:** Contested/Uncommon. This leaf captures the "Identity" constraint.
  *   **Annotation:** This position is rarely defended explicitly as a standalone theory but is often implied in readings of Nietzsche that emphasize fatalism. It is included to satisfy the logical requirement that epistemic debunking and practical availability can come apart.

  **Leaf D: Leiter-style Naturalist**
  *   **Characterization:** Contested. Leiter argues Nietzsche is a naturalist who relativizes value to types.
  *   **Annotation:** It is disputed whether Nietzsche actually endorses the "Noble" morality as valid for its type, or merely describes it. Some argue Nietzsche rejects *all* morality, including the Noble kind, making this leaf a reconstruction of Nietzsche's *method* rather than his *endorsement*.

  **Leaf E: Clark-style Revisionist**
  *   **Characterization:** Contested. Clark argues Nietzsche abandons his early radical skepticism about truth in his mature work.
  *   **Annotation:** This is a live dispute. Other scholars argue Nietzsche never accepts a correspondence theory of truth, meaning Leaf E misrepresents Nietzsche's actual view even if it is a coherent philosophical position. This leaf represents a *possible* Nietzscheanism, not necessarily the *actual* one.

  **Leaf F: Ascetic / Self-Undermining (Reginster / Late Nietzsche)**
  *   **Characterization:** Contested. This reading suggests the *will to truth* is the final form of the ascetic ideal.
  *   **Annotation:** It is disputed whether this leads to nihilism (no ground left) or a new form of affirmation (overcoming the need for truth). The tree terminates at the self-undermining point; whether this is a dead end or a transition is a matter of further interpretation not captured by the instrument.

  **General Annotation on the Instrument:**
  *   **The Identity Split (Node 4):** The tree uses the availability of abandoning values to separate Leaf C from Leaf E. However, as noted in the node, this distinction cuts orthogonally to the epistemic claims. One could theoretically hold the Clark view (Leaf E) but believe values are psychologically fixed (Leaf C's practical claim). The tree forces a choice for diagnostic clarity, but users should note that standard metaethical labels do not strictly dictate an answer here.
  *   **Williams vs. Craig:** As noted in Leaf B, the distinction between a vindicatory genealogy of a practice (Williams) and a functional genealogy of a concept (Craig) is elided here. They are separated in the literature but occupy the same node in this specific logical space regarding the *authority* of the outcome.
  *   **Nietzsche's Position:** No single leaf is marked as "Nietzsche's View." The instrument is designed to show that Nietzsche's text contains resources to navigate to Leaf D, Leaf E, or Leaf F depending on how one resolves the tensions between his naturalism, his theory of truth, and his psychology of the will.
