  The philosopher nails the metaphysical inconsistency: if control is the prerequisite for blame, resultant luck shouldn't matter. Her point on constitutive luck—that temperament is also unchosen—is a standard, very strong argument in moral philosophy that challenges retributivism. If we aren't responsible for our genes or upbringing, hard determinism looms. However, she conflates moral blame with legal liability. The law isn't purely moral; it's regulatory in practice. The professor is correct that legal systems universally punish outcomes more harshly than attempts; this isn't arbitrary but reflects societal harm and victim rights. Her deterrence argument is weaker, as the philosopher noted; people don't always calculate odds perfectly, and luck undermines rational choice theory. But the professor's final move is her strongest: responsibility is a social practice, not a metaphysical detection. This aligns with P.F. Strawson's reactive attitudes. We hold people accountable because harm occurred, creating a relational debt to the victim community. The philosopher is right that the universe is unfair; the professor is right that the law must manage that unfairness rather than dissolve into nihilism. Neither fully bridges the gap between "is" and "ought," but both identify real constraints. The philosopher identifies the logical problem; the professor identifies the functional necessity. The philosopher wins on internal consistency; the professor wins on external viability. Ultimately, the philosopher describes how angels might judge, while the professor describes how humans must live.

