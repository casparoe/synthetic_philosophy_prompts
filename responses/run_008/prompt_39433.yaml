  Both overlooked the expressive function of law beyond deterrence or blame. Punishment communicates societal condemnation, which varies by harm level regardless of intent. They also ignored the psychological reality: the second driver will likely suffer profound guilt, effectively self-punishing in a way the first won't. The law often mirrors this natural psychological consequence. Neither distinguished between criminal punishment and civil liability. Tort law handles the "luck" aspect differently, focusing on compensation for harm rather than moral blame, which could resolve the tension between outcome and intent. They completely missed the victim's family's perspective. For them, the difference between a flat tire and a dead child isn't philosophical; it's existential. The law serves their need for closure as much as it serves abstract justice. Ignoring the victim's claim reduces the debate to a theoretical exercise detached from the human cost that necessitates legal systems in the first place.

