answer: |-
  The tension between Expected Utility (EU) theory and Ergodicity Economics boils down to a single question: When you make a decision, are you betting for a committee of parallel selves, or for your single future self?

  As engineers, we know that system architecture matters. You can have the best optimization algorithm in the world, but if the system crashes on edge cases, the optimization is irrelevant. This is the core of the debate over how rational agents should handle money across time.

  ### The Trap of the Ensemble Average

  The standard textbook answer is Expected Value (or Expected Utility) maximization. You calculate the average outcome across all possible branches of the future and choose the path with the highest number. This works perfectly for additive processes. If you find $100 on the street today or flip a coin for $200 tomorrow, the math is straightforward.

  But financial markets and investment decisions are multiplicative. Your today's bankroll is tomorrow's principal. This is where the "ensemble average" (parallel universes) diverges from the "time average" (single trajectory).

  Consider a simple bet: You stake your entire bankroll. With 50% probability, it multiplies by 1.5. With 50% probability, it multiplies by 0.6.
  *   **Arithmetic Expectation:** $0.5 \times 1.5 + 0.5 \times 0.6 = 1.05$.
      On average, you gain 5% per bet. A standard EU agent with linear utility (caring only about raw dollar value) would bet everything, every time.
  *   **Time Trajectory:** Suppose you play twice, winning once and losing once.
      Start: $100.
      Win: $150.
      Lose: $150 \times 0.6 = $90.
      Start: $100.
      Lose: $60.
      Win: $60 \times 1.5 = $90.

  In both sequences, you end up with $90. You lost 10% of your wealth, despite the positive expected value. The geometric mean is $\sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.95$. While the *ensemble* of all possible bettors gets richer on average, the *individual* bettor following that average goes broke. This is the ergodicity problem: the average across space does not equal the average across time.

  ### The Ergodicity Claim

  The ergodicity crowd argues that rationality must be defined by the time average. You do not get to average over parallel universes; you live through one sequence. Therefore, a rational agent should maximize the geometric growth rate of their wealth, not the arithmetic expectation.

  This leads directly to the Kelly Criterion. Instead of betting everything, you bet a fraction of your bankroll that maximizes the expected logarithm of wealth. In the example above, betting 100% leads to ruin. Betting a specific fraction (roughly 25% in this case) ensures your bankroll grows over the long run. The argument is that this isn't just a finance trick; it's a correction to decision theory. Standard EU theory implicitly assumes you can pool risk across parallel selves, which is physically impossible for a single agent. By ignoring path dependence, EU encourages strategies that lead to "gambler's ruin" even when the odds are in your favor.

  ### The Expected Utility Defense

  The counterargument from the EU camp is that ergodicity economics is solving a problem that EU already solves, just with different syntax. EU theory doesn't mandate linear utility. If an agent defines their utility function as $U(w) = \ln(w)$ (logarithmic utility), maximizing expected utility yields the exact same betting fraction as the Kelly Criterion.

  From this view, there is no conflict. The ergodicity people are just describing an agent with log utility. But why must an agent have log utility? Preferences are subjective.
  1.  **Short Horizons:** If you need $1 million tomorrow to save a life, and you have $500k, maximizing long-term growth is irrational. You should take the risky bet that gives you a chance to hit the target, even if it likely ruins you.
  2.  **External Financing:** If you can bet with someone else's money (limited liability), your personal bankroll isn't the constraint. You might rationally choose high-variance strategies that would kill a self-funded agent.
  3.  **Diminishing Needs:** If you already have enough money to buy everything you'll ever want, protecting the downside matters more than growth. You should under-bet Kelly.

  The EU argument concludes that Kelly is not a theory of rationality; it's the optimal strategy for one specific preference structure (caring about proportional growth) under one specific constraint (repeated bets with no outside help). Dressing it up as a fundamental law is marketing.

  ### The Verdict

  Here is the commitment: **The ergodicity crowd is right that standard Expected Utility practice smuggles in a physical impossibility, making geometric growth the necessary baseline for any persistent agent.**

  While it is formally true that EU can *mimic* Kelly by selecting log utility, this misses the causal direction. In EU theory, utility is a psychological preference—you can choose to be risky or safe. In ergodicity economics, geometric growth is a physical constraint—you either survive the multiplicative process or you don't.

  For a software engineer, the distinction is clear: Ergodicity is about system stability; EU is about optimization. You cannot optimize a system that has crashed. Any agent that intends to remain an agent over time *must* respect the multiplicative structure of reality. If you use EU with linear utility in a multiplicative world, you are modeling a ghost, not a person. The fact that EU can be "patched" to avoid ruin by tweaking preferences admits that the default framework is dangerous. It places the burden of survival on the user's psychology rather than the model's physics.

  Therefore, geometric growth maximization should be the null hypothesis for rationality in any domain where stakes compound and ruin is absorbing. EU is useful for handling edge cases (short horizons, specific consumption needs), but it should be viewed as a deviation from the survival baseline, not the baseline itself.

  **What would change my mind?**
  If it could be demonstrated that real-world agents consistently thrive over long horizons using non-ergodic strategies (e.g., maximizing arithmetic returns) without relying on external bailouts or reset mechanisms, the argument for ergodicity as a fundamental constraint would weaken. But history suggests that without a mechanism to limit ruin, multiplicative systems inevitably select for those who respect the geometric mean.
