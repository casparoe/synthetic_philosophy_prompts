answer: |-
  This is a profound narrative problem because it mirrors the actual philosophical condition. You have intuited correctly: the stalemate you are reading about is not a temporary lack of ingenuity; it is a structural feature of the debate.

  To answer your specific diagnostic questions: No, this is not merely verbal. No, a completed physics would not dissolve it. And no, a new theorem will not solve it.

  Here is the diagnosis of the disagreement, followed by an honest assessment of whether progress is possible, and what that means for your ending.

  ### 1. The Diagnosis: A Clash of Explanatory Priorities

  The most accurate way to view this dispute is not as a disagreement about *facts*, but as a disagreement about **which facts require the most urgent explanation.**

  Your Mathematician (the Platonist) is haunted by the **phenomenon of constraint.** He feels that mathematics possesses a rigidity that human invention does not. He cannot *decide* that there are only five prime numbers; the system resists his will. To him, the primary thing that needs explaining is this *objectivity*. If math is just a game we made up, why can't we change the rules to make the Riemann Hypothesis true? The resistance he feels implies an external reality.

  Your Poet (the Nominalist/Fictionalist) is haunted by the **phenomenon of access.** She looks at the human brain—a physical object evolved to track predators and gather fruit—and asks how it could possibly reach out and touch abstract objects that exist outside of space and time. To her, the primary thing that needs explaining is *causal contact*. If numbers are real things, where are they? How do they push neurons around? If they can't push neurons around, how do we know anything about them?

  **The Diagnosis:** The debate is endless because both sides are demanding the other solve their specific mystery while dismissing their own mystery as secondary.
  *   The Platonist says: "I'll worry about how I touch the numbers later; first explain why I can't lie about them."
  *   The Nominalist says: "I'll worry about why the game is rigid later; first explain how your brain touches a ghost."

  This is not a verbal dispute. If it were merely verbal, they could agree on a definition of "existence" and move on. But they can't. When the Platonist says "exists," he means "is true independently of human opinion." When the Nominalist says "exists," he means "is a causal node in the physical universe." They are using the same word to point at two different criteria for reality. However, because both criteria feel essential to a complete picture of the world, the argument is substantive. They are fighting over which criterion gets to define reality.

  ### 2. The Empirical Dead End

  You asked if a hidden empirical question underlies this—specifically, if physics finishing its job would solve it.

  The answer is no. This is the hard pill for the novelist who wants a plot resolution based on discovery.

  *   **If Physics is fully nominalized (Field's dream realized):** Suppose someone rewrites all of quantum mechanics and general relativity without using numbers, using only concrete physical relations. The Platonist does not concede. He simply says, "You have merely found a more cumbersome language to describe the same underlying mathematical structure. The structure is still there."
  *   **If Physics is fully mathematized (The "It from Bit" scenario):** Suppose physics concludes that the universe *is* literally made of information or mathematical structures. The Nominalist does not concede. She says, "You have just elevated the map to the territory. You are worshipping the model."

  Empirical success does not settle ontological status. The success of mathematics in physics is the one thing both sides agree on; they just disagree on *why* it succeeds. The Platonist says it succeeds because it matches the blueprint of reality. The Nominalist says it succeeds because we evolved to discard any cognitive tools that *didn't* match the patterns of reality (a sort of evolutionary fictionalism). Both explanations are consistent with the same empirical data.

  ### 3. Can There Be Progress?

  You asked if anything would count as progress—a theorem, a distinction, a completion.

  **Internal Progress:** Within mathematics, progress is endless. Within philosophy of mathematics, progress is **dialectical, not cumulative.**

  In science, theories stack up; Newton is absorbed into Einstein. In this debate, theories cycle. A new position arises (e.g., "Modal Structuralism" or "Quasi-Empiricism") that solves the Access problem but creates a new Truth problem, or vice versa.

  **The only thing that counts as "progress" here is a shift in burden.**
  For a long time, the Platonist had the high ground because math felt so undeniably true. Then Benacerraf (in the 70s) shifted the burden by articulating the Access problem so sharply that Platonism looked mystical. Then the failure of Field's program shifted the burden back, making Nominalism look like it couldn't account for science.

  **Will it end?** No. Because the debate rests on two fundamental human intuitions that are both correct but mutually incompatible in this context:
  1.  **The Intuition of Independence:** Truths feel discovered, not made.
  2.  **The Intuition of Naturalism:** Everything real must fit into the causal web of nature.

  As long as humans possess both intuitions, the debate continues. It is structurally endless in the same way the debate between "Free Will" and "Determinism" is endless. It is not a puzzle to be solved; it is a tension to be inhabited.

  ### 4. Implications for Your Novel

  This diagnosis gives you a difficult but potentially more powerful constraint for your ending.

  If you let one character definitively "win" via a logical knockout, you risk writing a fable rather than a novel. It would feel intellectually dishonest to the reader who senses the depth of the stalemate, and it might betray the characters' intelligence. If they are truly brilliant, they should see the strength of the other's position.

  However, a stalemate does not mean a lack of resolution. **Narrative resolution is not the same as philosophical resolution.**

  Here are three ways to handle the ending, given the diagnosis:

  **Option A: The Existential Shift (The "Kierkegaardian" Ending)**
  The argument doesn't end, but the *need* for the argument to end dissolves. One character realizes that their commitment to their view isn't about proof, but about *temperament*. The Mathematician admits he is a Platonist because he needs the comfort of eternal truths in a dying world. The Poet admits she is a Nominalist because she values human agency over eternal structures. They stop trying to convert each other and start appreciating the tension as the engine of their friendship. The resolution is emotional, not logical.

  **Option B: The Pragmatic Truce (The "Feynman" Ending)**
  They agree to a "shut up and calculate" treaty. They acknowledge that while they disagree on the *metaphysics*, they agree on the *practice*. The Mathematician continues to prove theorems as if they are discovered; the Poet continues to edit texts as if meanings are constructed. They accept that they are playing different language games that happen to overlap. This is honest to the philosophy (many working mathematicians are "working Platonists" regardless of their philosophy) but acknowledges the lack of final verdict.

  **Option C: The Tragedy of Incompleteness (The "Gödel" Ending)**
  You lean into the structural endlessness. The novel ends with them still arguing, but the *stakes* have changed. Perhaps one is dying, or losing their mind. The tragedy isn't that they couldn't solve the problem; it's that the problem is bigger than them. The endlessness of the argument becomes a metaphor for the endurance of the human spirit. The argument is the only thing that keeps them alive. To stop arguing would be to admit the end of their intellectual vitality.

  ### Recommendation

  Given your research and the integrity of your premise: **Do not let one win.**

  If the Mathematician wins, you validate a metaphysics that has no causal mechanism. If the Poet wins, you validate a view that struggles to explain the rigidity of truth. Either choice simplifies a mystery that has resisted the smartest humans for a century.

  The most honest ending—and perhaps the most moving—is to accept your diagnosis: **The argument is structurally endless.**

  But an endless argument is not a failed story. The story isn't about who is right about the primes. The story is about two people who love each other enough to keep engaging with the other's worldview, even knowing they can never fully inhabit it. The "resolution" is that they realize the *gap* between their views is where the friendship lives. If one converted, the conversation would die.

  Let them keep arguing. Let the reader close the book knowing the question is open, but feeling that the *asking* was worth it. That is the only progress available in this domain, and it is enough for a novel.
