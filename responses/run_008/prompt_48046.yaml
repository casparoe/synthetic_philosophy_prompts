answer: |-
  # JOINT STATEMENT ON FREE WILL AND MORAL RESPONSIBILITY

  **Signed:**  
  [The Hard Incompatibilist Representative]  
  [The Reasons-Responsiveness Compatibilist Representative]  
  **Date:** October 26, 2023  
  **Subject:** Findings of the Two-Year Adversarial Collaboration on Agency and Desert

  ## I. GLOSSARY AND DIAGNOSTIC NOTE

  To ensure precision, the undersigned parties agree to the following stipulative definitions for the purposes of this document. These definitions are intended to isolate the concepts under dispute rather than to presuppose the truth of either party's comprehensive theory.

  *   **Free Will:** The specific control condition required to justify basic-desert moral responsibility. (Note: Parties agree this term is often used to denote mere voluntary action; here it refers strictly to the *responsibility-grounding* control.)
  *   **Moral Responsibility:** The status of being an appropriate target of reactive attitudes (e.g., resentment, moral indignation, gratitude) wherein such attitudes are justified by the agent's moral quality of will.
  *   **Basic Desert:** A mode of moral responsibility wherein blame or praise is justified solely because the agent performed the action and owned the mechanism producing it, excluding justifications based on consequentialist aims (e.g., rehabilitation, deterrence) or contractualist obligations.
  *   **Leeway:** The ability to have done otherwise in the exact same circumstances, holding fixed the past and the laws of nature (Alternative Possibilities).
  *   **Sourcehood:** The property of being the ultimate originator of an action, such that the causal chain initiating the action begins with the agent in a way that is not fully determined by prior external factors.
  *   **Reasons-Responsiveness:** The capacity of the mechanism producing an action to recognize and react to sufficient moral and practical reasons, such that the agent would have acted differently had there been sufficient reason to do so.

  **Diagnostic Note on Verbal vs. Substantive Disagreement:**  
  The parties diagnose that certain historical disputes were merely verbal. Specifically, if "Free Will" is defined strictly as **Reasons-Responsiveness**, both parties agree humans possess it. If "Free Will" is defined as requiring **Leeway** or **Ultimate Sourcehood** in a deterministic world, both parties agree humans lack it. The residual **substantive disagreement** concerns whether **Basic Desert** requires Leeway/Ultimate Sourcehood, or whether Reasons-Responsiveness alone is sufficient to justify Basic Desert in a deterministic world.

  ## II. AGREED CLAIMS

  The undersigned parties endorse the following claims under the terms defined above:

  1.  **Determinism and Leeway:** If determinism is true, no agent possesses Leeway. The future is fixed by the past and the laws of nature.
  2.  **Frankfurt Cases:** Frankfurt-style cases successfully demonstrate that Leeway is not necessary for *guidance control* (the capacity to guide one's behavior via reasons). Both parties agree these cases refute the Principle of Alternative Possibilities (PAP) as a necessary condition for *some* notion of responsibility, though they disagree on whether this notion suffices for Basic Desert.
  3.  **Indeterministic Noise:** The discovery of indeterministic noise (randomness) in human decision-making processes would not, by itself, enhance an agent's control or justify Basic Desert. Randomness does not equate to agency.
  4.  **Manipulation Arguments:** Manipulation arguments successfully identify a tension for Compatibilism regarding causal history. Both parties agree that if a manipulated agent is relevantly similar to an ordinary deterministic agent regarding psychological structure, consistency in judgment requires treating them similarly regarding responsibility.
  5.  **Determinism's Implications:** Determinism itself does not imply fatalism (that agents' deliberations are causally inert) nor does it imply that agents lack Reasons-Responsiveness.
  6.  **Empirical Neutrality:** Current neuroscientific and psychological data confirm that human decision-making involves complex processing consistent with Reasons-Responsiveness, but do not settle the metaphysical question of whether such processing suffices for Basic Desert.

  ## III. AREAS OF DISAGREEMENT

  The following table outlines the substantive disagreements remaining after collaboration. Each position is phrased to be acceptable to the party holding it.

  | Issue | Hard Incompatibilist Position | Reasons-Responsiveness Compatibilist Position |
  | :--- | :--- | :--- |
  | **1. Compatibility of Determinism and Basic Desert** | Basic Desert moral responsibility is incompatible with determinism. Because determinism precludes the agent from being the ultimate source of their actions, blame grounded purely in desert is never justified, even if the agent is reasons-responsive. | Basic Desert moral responsibility is compatible with determinism. If an agent owns the mechanism producing their action (via Reasons-Responsiveness), they are the appropriate target of desert-based blame, regardless of whether the past determined that mechanism. |
  | **2. Moral Relevance of Causal History (The Manipulation Argument)** | There is no morally relevant difference between an agent whose deliberation is covertly engineered by a designer and an agent shaped by ordinary deterministic causes. In both cases, the agent lacks ultimate control over who they are; thus, if the engineered agent is not responsible, neither is the ordinary agent. | There is a morally relevant difference. An agent shaped by ordinary deterministic causes can "own" their mechanism through historical processes of critical reflection and acceptance. An engineered agent lacks this history of ownership. Therefore, the ordinary agent can be responsible while the engineered agent is not. |
  | **3. Necessity of Sourcehood** | Basic Desert requires Ultimate Sourcehood. An agent must be the *causa sui* (cause of oneself) in some significant respect to deserve basic blame. Since this is metaphysically impossible, Basic Desert is never justified. | Basic Desert requires only Guidance Control, not Ultimate Sourcehood. As long as the action issues from the agent's own reasons-responsive mechanism, the requirement for sourcehood is satisfied without needing to be the ultimate originator of the mechanism itself. |

  ## IV. CRUXES AND PROBATIVE TESTS

  The parties identify the following subquestions as cruxes. Settling these would move at least one party to revise their position. For each crux, we specify the evidence required and record advance predictions.

  ### Crux 1: The Continuum of Causal History
  **The Exercise:** Both parties agree to evaluate a continuum of cases:
  *   **Case A (Direct Control):** An agent whose every choice is dictated moment-to-moment by a hidden designer.
  *   **Case B (Engineered at Birth):** An agent engineered once at birth with specific psychological traits and no further intervention, developing normally thereafter.
  *   **Case C (Ordinary Determinism):** An agent shaped by ordinary heredity and upbringing in a deterministic world, possessing identical psychological traits to Case B.

  **The Test:** Parties must identify where responsibility judgments shift along this continuum.
  **Agreed Evidence Criteria:**
  *   **Evidence against Hard Incompatibilism:** If the Compatibilist can identify a non-arbitrary point between Case B and Case C where responsibility emerges, grounded in a principled distinction regarding *mechanism ownership* rather than mere intuition.
  *   **Evidence against Compatibilism:** If the Compatibilist assigns responsibility in Case C but not Case B, but cannot specify a metaphysical or psychological difference between them other than the mere fact of "ordinary" vs. "engineered" history (begging the question).

  **Advance Predictions:**
  *   **Hard Incompatibilist Prediction:** "We predict the Compatibilist will assign responsibility in Case C but deny it in Case B. We predict their justification will become unstable or ad hoc at the boundary between B and C, relying on the intuition that 'ordinary' history is special without explaining *why* deterministic ordinary history confers ownership that deterministic engineered history does not."
  *   **Compatibilist Prediction:** "We predict the Hard Incompatibilist will deny responsibility in Cases A, B, and C. We predict their judgment will become unstable when confronted with the psychological identity of agents in Case B and Case C. If they admit the agents are psychologically identical yet treat them differently regarding *practical* accountability, their view ignores the reality of agency. If they treat them the same (no responsibility), they must explain why human practices of blame are universally unjustified despite functional differences between A and C."

  ### Crux 2: The Function of Reactive Attitudes
  **The Exercise:** Empirical investigation into whether resentment and indignation lose their normative force if believed to be determined.
  **Agreed Evidence Criteria:** If it can be shown that believing in determinism systematically undermines the capacity for genuine moral reconciliation (forgiveness) without consequentialist benefits, this bears on the viability of the Incompatibilist stance. If it can be shown that such beliefs do not undermine these practices, this bears on the viability of the Compatibilist stance.

  **Advance Predictions:**
  *   **Hard Incompatibilist Prediction:** "We predict that abandoning Basic Desert will not erode moral community but rather replace retributive anger with protective and reconciliatory attitudes that are more humane."
  *   **Compatibilist Prediction:** "We predict that abandoning Basic Desert will erode the sense of mutual accountability required for deep interpersonal relationships, reducing partners to objects of management rather than moral peers."

  ## V. JOINT CONCLUSION ON DEBATE PROGRESS

  After two years of collaboration, we agree that the debate will not be moved by further iterations of intuition pumps regarding Frankfurt cases or manipulation scenarios, as these have reached a reflective equilibrium where each side interprets the cases through their own metaphysical commitments. What would actually move the debate is not new metaphysical arguments, but rather a convergence on the *normative function* of responsibility practices. Specifically, progress requires empirical and conceptual work determining whether the justification for Basic Desert is fundamentally backward-looking (requiring metaphysical sourcehood) or whether it can be vindicated entirely by its forward-looking role in sustaining moral communities without invoking metaphysically robust "could have done otherwise" claims. Until we agree on whether the *point* of blame is to give agents their metaphysical due or to sustain a specific form of moral relationship, the metaphysical disputes regarding determinism will remain stalemate.
