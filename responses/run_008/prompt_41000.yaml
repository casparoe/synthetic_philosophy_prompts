answer: |-
  Here is the translation of the endurantism-perdurantism debate into the vocabulary of technical animation, followed by the residue report and an analysis of your specific suspicions.

  ### Part 1: The Translation

  #### Perdurantism (The "Baked Cache" View)
  In this framework, a material object is not a single node in the scene graph that moves. Instead, the object is the **entire animation sequence** laid out along the timeline, analogous to a baked geometry cache (like an Alembic file) or the final rendered image sequence.

  *   **The Object:** The "spacetime worm" is the full playblast or cache from Frame 1 to Frame 240. It is a four-dimensional volume.
  *   **Temporal Parts:** A character at a specific moment is not the whole character; it is a **time-slice**. Technically, this is the mesh geometry as it exists at a specific frame evaluation (e.g., the vertex positions at $t=12$).
  *   **Change:** Change is not one thing altering its properties. It is simply **variation between slices**. Frame 12 has the arm down; Frame 48 has the arm up. There is no contradiction because Frame 12 and Frame 48 are distinct parts of the larger whole, just as the head and tail are distinct parts of the mesh in space.
  *   **Persistence:** To say the character "persists" is to say that these frames are stitched together into a single continuous data structure. There is no single mesh traveling through time; there is only the static block of data extending across the timeline.

  **Confidence in this translation:** High. This maps very closely to the "worm view" in classical four-dimensionalism.

  #### Endurantism (The "Scene Graph" View)
  In this framework, a material object is the **node in the scene graph** (the DAG - Directed Acyclic Graph). It is the rig and the base mesh definition that sits at the top of the hierarchy.

  *   **The Object:** The character is the single transform node or the root joint of the rig. It is **wholly present** at every frame the timeline is scrubbed to.
  *   **Numerical Identity:** When you move from Frame 12 to Frame 48, you are not looking at a different slice of a worm. You are looking at the **same node** evaluated at a different context. The UUID (Universally Unique Identifier) of the node remains constant.
  *   **Change:** Change is the **deformation** of that single mesh. The vertices move, the skin weights apply differently, but the underlying geometry asset and the rig controlling it remain numerically identical. The object retains its identity while its properties (vertex positions) vary.
  *   **Persistence:** Persistence is the continuity of the **reference**. As long as the scene graph pointer points to the same object ID, the object endures through the timeline, regardless of how much the deformation modifies its appearance.

  **Confidence in this translation:** Medium-High. This captures the "wholly present" intuition, though it relies on a specific interpretation of how software handles object references.

  ***

  ### Part 2: The Residue Report

  This section details what fits, what breaks, and what is missing when we force metaphysics into a 3D pipeline.

  #### 1. What Translates Cleanly
  *   **Perdurantism and Frame Sequences:** The idea that an object is extended in time just as it is extended in space maps perfectly to the difference between a **procedural rig** and a **baked point cache**. A cache stores the state of every vertex at every frame. It treats time as just another axis of data storage, exactly as perdurantists treat time as a dimension of existence.
  *   **Endurantism and Instancing:** The way a single mesh asset can be instanced multiple times in a scene, yet remain "one mesh" in memory, parallels the endurantist claim that an object can be wholly present at multiple times without being divided. The data exists once; the evaluation happens many times.

  #### 2. What Had to Be Distorted
  *   **Discrete vs. Continuous Time:** Your software works in discrete frames (24fps, 30fps, etc.). Metaphysics generally debates persistence through *continuous* time. To make the analogy work, we have to pretend that **interpolation curves** (the math between keyframes) represent the "genuine" continuous time, while the frames are just samples. However, ultimately, the computer renders discrete slices. Perdurantism in your world is forced to be a "frame-series" ontology, whereas in metaphysics, it is usually a "continuous worm" ontology.
  *   **The Nature of Properties:** In software, a "property" is a value in a channel box (translate X, rotate Y). In metaphysics, properties (universals or tropes) are debated fiercely. Mapping "vertex position" to "metaphysical property" works for illustration but distorts the philosophical weight of what a property *is*.

  #### 3. What Cannot Be Said (The Inexpressible Residue)
  *   **The Ground of Identity:** Your software determines identity via **UUIDs** or node paths. If you copy-paste a rig, it gets a new UUID; it is now a "different" object, even if identical in every other way. Metaphysics asks *what makes* it the same object. The software simply *stipulates* it via a database key. The question of *why* the UUID tracks the object cannot be answered by the software; it is an external convention imposed by the artist or the file format.
  *   **Conscious Experience:** Metaphysics of persistence often ties into personal identity (am I the same person I was yesterday?). Your pipeline handles meshes, not subjects. There is no vocabulary in the scene graph for "first-person persistence."

  ***

  ### Part 3: Addressing Your Suspicions

  You have two specific suspicions about whether this analogy holds water. Here is the verdict.

  #### Suspicion 1: The "Compression" Objection
  *Your suspicion:* The software stores one mesh + animation curves to save space (compression), rather than storing every frame (baked cache). Is Endurantism just a file-format optimization rather than a truth about reality?

  *Verdict:* **Your suspicion is well-founded.**
  The "Endurant" structure of the scene graph is procedurally efficient. It is a function $f(t)$ that generates geometry, rather than a lookup table of pre-existing geometry.
  *   **The Distortion:** If you bake the cache (convert to Perdurantism), the animation plays back exactly the same visually. The ontology of the *viewers* experience does not change, only the data structure changes.
  *   **The Metaphysical Implication:** If Endurantism were true of the *world*, it wouldn't just be a compression algorithm for the universe's hard drive. It would mean there is something fundamental about an object being "wholly present."
  *   **Conclusion:** The analogy trades on a feature of **data representation**, not necessarily ontology. The fact that Maya stores a rig rather than a cache tells us about computer memory management, not necessarily about the nature of time. However, an Endurantist would argue that the *procedural generation* is the closer analogy to reality: the laws of physics (the rig) determine the state of matter (the mesh) at time $t$, rather than the universe storing every state explicitly.
  *   **Confidence:** High. This is a standard objection to computational analogies in metaphysics (the "simulation hypothesis" problem).

  #### Suspicion 2: The "Convention" Objection
  *Your suspicion:* In animation, whether two frames belong to the same character is settled by convention (naming, rig swapping, splices). Is the Endurantist's "strict numerical identity" just a convention we impose, like a node name?

  *Verdict:* **This points to a gap in the 3D framework.**
  In your software, identity is indeed largely conventional. You can swap a rig onto a different mesh. You can morph one character into another. You can cut two shots together where the "same" character is actually two different assets with matching shaders. The software treats them as "the same" because the **editorial decision** says so, not because of a metaphysical link.
  *   **The Metaphysical Gap:** Endurantists argue that numerical identity is a **brute fact**, not a convention. They claim there is a real difference between "one object changing" and "one object vanishing and a duplicate appearing."
  *   **The Software Limit:** Your vocabulary cannot express this brute fact. In the scene graph, if you delete Node A and create Node B with identical transforms, the software sees two objects. If you keep Node A and move it, it sees one. But *why* the node persists is just a matter of the user not hitting "Delete."
  *   **Conclusion:** The residue points to something the **3D-animation framework cannot express**. The software handles *continuity of reference* (pointers), but metaphysics demands *continuity of substance*. Your suspicion is correct: the software resolves identity by fiat (convention/UUID), whereas the metaphysical debate is about whether that fiat corresponds to anything real.
  *   **Confidence:** Medium-High. This touches on the "Problem of Temporary Intrinsics" and "Relative Identity," which are contested.

  ***

  ### Part 4: Contested Readings and Confidence Levels

  Throughout this translation, I have relied on specific philosophical interpretations that are not universally accepted. I am flagging them here:

  1.  **Perdurantism and Temporal Parts:** I have assumed the "Classical Perdurantist" view that temporal parts are concrete entities, analogous to spatial parts. Some philosophers (Exdurantists or Stage Theorists) argue that only the current "stage" (frame) exists, and talk of the "worm" is just modal talk.
      *   *Confidence in mapping:* High for Classical Perdurantism, Medium for Stage Theory.
  2.  **Endurantism and Sortals:** I have assumed the Endurantist needs a "rig" (a sortal concept) to define what the object is to track it through change. Some Endurantists argue identity is primitive and needs no such criteria.
      *   *Confidence in mapping:* Medium. The "rig" is a good analogy for a sortal, but not all Endurantists accept sortals are necessary for identity.
  3.  **The Nature of the "Scene Graph":** I am treating the scene graph as a representation of ontological structure. It could equally be argued that the scene graph is just a user interface for a underlying database that is itself perdurantist (storing state changes).
      *   *Confidence in mapping:* Medium. This depends on the specific software architecture (e.g., USD vs. Maya binary).

  ### Final Confidence Assessment

  *   **Claim:** Perdurantism maps to Baked Caches/Frame Sequences. (**Confidence: High**)
  *   **Claim:** Endurantism maps to Procedural Rigs/Scene Graph Nodes. (**Confidence: Medium-High**)
  *   **Claim:** The "Compression" objection undermines the Endurantist analogy as an ontological proof. (**Confidence: High**)
  *   **Claim:** The "Convention" objection reveals that software handles identity by fiat, whereas metaphysics seeks a brute fact. (**Confidence: Medium-High**)

  ### The Point I Am Least Sure Of

  I am least sure about the mapping of **Numerical Identity to Scene Graph UUIDs**.

  In metaphysics, numerical identity is supposed to be a relation that holds independently of how we label or track things. In 3D software, identity is *constituted* by the label (the UUID or node path). If you change the UUID, the software treats it as a new object, even if the geometry is identical. If metaphysics is about how the world is *independent* of our tracking systems, then the software's method of tracking (which is purely conventional and database-driven) might be the exact opposite of what Endurantism claims. I am uncertain if there is any technical equivalent to "mind-independent identity" in a system that is entirely defined by user input and data structures.
