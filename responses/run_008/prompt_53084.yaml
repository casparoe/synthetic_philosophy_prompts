answer: |-
  The coffee machine hummed with a low, vibrating exhaustion, the only sound in the hospital staff room besides the occasional clink of a spoon against ceramic. It was five o'clock, and the light outside the high window was failing, casting long shadows across the table where two stacks of paper lay separated by a sugar bowl. Dr Millar stirred his espresso slowly, the spoon ringing against the cup, while Dr Kaur leaned back in her chair, her arms crossed over the registry data. They had an hour before the formulary committee would convene to decide the fate of novoril, and neither had blinked yet.

  Millar said, The randomised trial is the only document on this table that matters. It is an experiment, not a story about what doctors happened to do. In the aggregate, novoril shows a forty-eight percent recovery rate against tradamil's forty-two. That is the average causal effect. We are not paid to explain why doctors prescribed what they did; we are paid to decide what works.

  Kaur replied, If we act on the aggregate alone, we are blind to who we are treating. Look at the registry. In the marginal table, tradamil appears superior, sixty-five percent to fifty-one. But you know why. The doctors gave novoril to the severe cases. Four hundred severe patients on novoril versus only one hundred on tradamil. If you ignore that stratification, you are punishing novoril for being used on the sick. You would be endorsing a policy where we give the inferior drug to the severe patients because the data says they do worse, when in fact they do worse because they are severe.

  Millar set his spoon down. I am not endorsing the registry marginal. I am saying the registry is observational noise. We have a trial. In the trial, the allocation was random. The marginal comparison is unbiased by design. Why would I look for subgroups in a randomised trial unless I suspected the treatment effect varied? And even then, I would not override the marginal result with a subgroup analysis unless I had a prior hypothesis. Here, the stratification is by blood pressure control at one month. That is not a baseline characteristic. That is a consequence of the treatment.

  Kaur uncrossed her arms and tapped the second exhibit. This is where your faith in the marginal becomes dangerous, James. In the trial, if you stratify by blood pressure control, tradamil wins in both groups. Eighty percent versus seventy-six in the controlled group, twenty-three versus twenty in the uncontrolled. If you apply the sure-thing principle, you should prefer tradamil. If I am better off regardless of whether my blood pressure is controlled or not, why would I take novoril?

  Millar shook his head. Because the treatment determines whether you are in the controlled group. Novoril controls blood pressure in half its patients; tradamil in only a third. By conditioning on blood pressure, you are blocking the very pathway by which novoril works. You are asking, What is the effect of the drug holding the mechanism constant? That is not the question a patient asks. A patient asks, What happens if I take this pill? They do not ask, What happens if I take this pill and pretend the physiological consequence does not exist?

  Kaur leaned forward. So you admit that stratification can lie. You admit that looking at the tables within the tables can reverse the truth.

  Millar said, I admit that stratifying on a post-treatment variable is mischief. It is selection bias introduced by the hand of the drug itself. But that is why the trial marginal is safe. Randomization balances the unobserved confounders. The registry is where the danger lies. In the registry, the marginal says tradamil is better. If you follow the registry marginal, you commit the ecological fallacy. You ignore the confounding by severity.

  Kaur smiled thinly. And yet, here we are. In the registry, you want me to ignore the marginal and look at the strata. In the trial, you want me to ignore the strata and look at the marginal. You are asking me to apply one rule to the observational data and the opposite rule to the experimental data. What is the rule, James? Is it written in the numbers?

  Millar paused. The rule is in the design. In the registry, the allocation is biased, so we must adjust for the bias using pre-treatment covariates. Severity was measured before treatment. It is a confounder. In the trial, the allocation is random, so the marginal is unbiased. The blood pressure variable is a mediator. Conditioning on a mediator induces bias.

  Kaur said, But how do you know that from the tables? Look at the numbers alone. In the registry, we have a reversal. In the trial, we have a reversal. The arithmetic is identical. The proportions shift, the weights shift, the conclusion flips. If I hand you these two exhibits without the labels, without telling you which variable was measured before treatment and which was measured after, could you tell me which stratification is valid and which is mischief?

  Millar looked down at the papers. The numbers themselves do not carry timestamps.

  Kaur pressed the point. Exactly. The tables are silent. You are relying on external knowledge. You are relying on the story that severity causes both treatment assignment and outcome, while blood pressure is caused by treatment and causes outcome. If you rely on the story, then statistical inference is not a machine that grinds data into decisions. It is a framework for encoding what we already believe about the world.

  Millar sighed. I am not saying the data alone settle it. I am saying that in the context of a regulatory decision, we privilege the randomised trial because it minimizes the need for those stories. But I concede that in the absence of a trial, if we must use observational data, we cannot ignore pre-treatment stratification. If we did, we would be saying that doctors' prescribing habits define the efficacy of the drug. That is absurd. So I concede the registry marginal is useless. We must accept the stratified registry result that novoril is superior in both severity groups.

  Kaur nodded slowly. And I concede that the stratified trial result is useless. If we condition on the mediator, we underestimate the total effect of novoril. We would be rejecting a drug because we blocked its mechanism. So we agree on the decision. Novoril goes on the formulary.

  Millar said, Then the debate is academic.

  Kaur shook her head. No. The debate is about what we teach the students next week. If we tell them that Simpson's paradox is resolved by stratification, they will look at the trial blood pressure table and recommend tradamil. If we tell them that Simpson's paradox is resolved by trusting the marginal, they will look at the registry and recommend tradamil. They need to know why one stratification saves the truth and the other kills it.

  Millar rubbed his temples. The distinction is causal. Confounders must be adjusted for. Mediators must not.

  Kaur said, But that is a tautology. How do they know which is which? In the kidney stone literature, the open surgery had a lower success rate overall but higher success rates for both small and large stones. The stratification by stone size was valid because stone size is a pre-treatment confounder affecting both treatment choice and success. In the admissions data at Berkeley, the marginal showed bias against women, but the stratified data by department showed no bias, or even bias against men. There, the department choice was a mediator, or perhaps a collider, depending on your view. The numbers looked like reversals in both cases.

  Millar replied, In the admissions case, the department choice was not caused by the gender in a way that mediated the acceptance. It was a preference. But yes, the structure matters. You cannot solve Simpson's paradox with arithmetic. You need a causal graph.

  Kaur said, So we are teaching them that statistics cannot save them from themselves. They must bring the causality to the table before they open the spreadsheet.

  Millar said, I would put it differently. We are teaching them that the marginal table answers the question of what happened, while the stratified table answers the question of what would happen under specific conditions. In the registry, the question is what would happen if we assigned novoril to mild and severe patients appropriately. The stratified table approximates that. In the trial, the question is what happens if we assign novoril to the population. The marginal table answers that. The stratified trial table answers what happens if we assign novoril and then magically fix blood pressure control, which is impossible.

  Kaur said, But consider the policy implication. If we approve novoril based on the trial marginal, we are accepting that it works better overall. But if we look at the registry, we see that doctors are still biased against it. They give it to the severe cases. If we approve it, will they continue to do that? If they continue to give it only to severe cases, the marginal outcome in the real world will look like the registry marginal: tradamil will appear better. The hospital will see a drop in overall recovery rates when they switch, because the allocation bias will persist even if the drug is better.

  Millar frowned. That is an implementation problem, not an inference problem.

  Kaur said, It is an inference problem about the target of inference. Are we estimating the efficacy in a trial population, or the effectiveness in this hospital? If the hospital doctors do not change their prescribing habits, the stratified efficacy will not translate to marginal effectiveness. The registry tells us about the doctors as much as the drugs.

  Millar said, Then the committee's job is to change the doctors' habits. We issue the guideline that novoril is superior for both mild and severe cases. We use the stratified registry data to convince the clinicians that their bias is hurting patients. We use the trial marginal to convince the administrators that the drug is safe and effective on average.

  Kaur said, So we use both tables. But we use them for different audiences.

  Millar said, Precisely. But there is a risk. If we present the stratified trial data to the clinicians, they might seize on it. They might say, Look, tradamil is better for patients with controlled blood pressure. They might restrict novoril to patients whose blood pressure they think they can control, which defeats the purpose of the drug.

  Kaur said, Then we must not show them the stratified trial data. We must hide it.

  Millar laughed softly. Hide the data? That is not science.

  Kaur said, It is prudence. If the data are misleading without the causal context, and the audience lacks the causal context, presenting the data is irresponsible. You argued earlier that stratification chosen after the data have been seen is where mischief enters. Here, the blood pressure stratification was likely exploratory. It was not pre-specified.

  Millar said, I did argue that. And I stand by it. Post-hoc subgroup analysis is the engine of false discovery. But in this case, we know the mechanism. We know blood pressure is a mediator. It is not just a data-driven carve-up; it is a physiological fact.

  Kaur said, But the students will not always know the physiology. They will only have the tables. If we teach them that the resolution of Simpson's paradox depends on knowing whether the variable is a confounder or a mediator, we are teaching them that the paradox is not a statistical problem at all. It is a knowledge problem.

  Millar leaned back. Perhaps that is the lesson. That there is no statistical rule statable purely in terms of the tables that could settle which table to act on. The answer always depends on something outside the tables.

  Kaur said, That is a hard lesson for a statistics seminar.

  Millar said, It is an honest one. We can write down the inequalities. We can show the weights. But we cannot show the arrows. The arrows are in our heads.

  Kaur looked at the clock. We have twenty minutes. Do we recommend novoril unconditionally?

  Millar said, Yes. But with a caveat. We recommend novoril based on the trial marginal and the registry stratified data. We explicitly warn against using the registry marginal or the trial stratified data.

  Kaur said, And if a student asks why?

  Millar said, You tell them because the registry marginal confounds severity with treatment, and the trial stratified data conditions on a mediator.

  Kaur said, And if they ask how they could have known that from the numbers?

  Millar was silent for a moment. Then he said, You tell them they could not. You tell them that without the timeline, without the knowledge of what caused what, the numbers are just shapes. You tell them that inference requires a model of the world, not just a model of the data.

  Kaur nodded. I can teach that. But I want one more concession. You must admit that your instinct to trust the marginal is not always virtuous. In the registry, trusting the marginal was wrong. It required you to defer to the stratified view. You only trust the marginal when the design protects it.

  Millar said, I admit it. The marginal is only holy when the allocation is random. When the allocation is observational, the marginal is a mixture of effect and bias. I was too quick to dismiss the registry stratified data earlier. I treated it as just another subgroup analysis. It is not. It is an attempt to reconstruct randomization.

  Kaur said, And I must admit that my instinct to stratify is not always virtuous. In the trial, stratifying was wrong. It required me to defer to the marginal view. I was too quick to look for the reversal in the trial data because I enjoy finding them. I treated the mediator like a confounder.

  Millar said, So we are both humbled. The paradox is not a trick to be solved. It is a warning.

  Kaur said, A warning that the world is not a table.

  Millar picked up his cup. The coffee was cold. He drank it anyway. Then he said, Let's go. The committee will want to know why we are ignoring half the data.

  Kaur gathered the papers. We are not ignoring it. We are interpreting it. There is a difference.

  Millar stood up. Just make sure you explain the difference clearly. I do not want to spend the next hour defending why we are not recommending the drug that wins in two out of four tables.

  Kaur smiled. We are recommending the drug that wins in the two tables that correspond to reality. The other two tables correspond to ghosts.

  Millar opened the door. Then let us hope the committee believes in ghosts less than they believe in drugs.

  They walked out into the corridor, leaving the coffee room empty, the two exhibits still lying on the table, the numbers identical in ink but opposite in truth, waiting for a story to tell them which way to point.
