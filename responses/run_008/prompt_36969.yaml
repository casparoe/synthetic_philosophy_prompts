          *   *Critique 2: Theory-Ladenness & Objectivity.* Arago knew where to look. Lakatos claims rational choice based on objective progress. Kuhn claims incommensurability/paradigm shift. *Analysis:* Lakatos admits observation is theory-impregnated but insists the *logic of appraisal* is objective. The fact that Arago needed the theory to find the fact doesn't make it Kuhnian conversion; it makes it a successful prediction. The "objective" part is the comparison of empirical content growth, not the psychology of discovery.
