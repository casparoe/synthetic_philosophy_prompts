  *(Self-Correction during drafting)*: I need to be careful not to overstate the "success" of the ICA. The prompt notes the government was only required to *respond*. The abortion success was specific. Climate change recommendations, for instance, faced more resistance. I should acknowledge that the "authority" was contextual, not structural.

  *(Refining the Term Limit argument)*: The prompt asks if term limits are a "crude proxy." I need to argue that term limits accept the *logic of election* (ambition) but try to curb its *duration*. Sortition rejects the *logic of election* entirely. The ICA proves that a body without ambition behaves differently than a body of term-limited ambitious people.

