answer: |-
  Here is a mapping of the Irish Citizens' Assembly (ICA) onto democratic theory, structured to address the bidirectional relationship between sortition theory and the empirical case, followed by a specific analysis of the term-limit question.

  ### I. Theory $\rightarrow$ Case: What Sortition Predicts and Explains

  Standard sortition theory posits that random selection is the distinctively democratic mode of constituting a body, contrasting it with election (aristocratic/oligarchic). It argues that the lot produces descriptive representation, eliminates dependence on wealth or rhetoric, and structurally precludes a political class. The ICA validates these claims in three specific areas, while providing a stress test for a fourth.

  **1. Descriptive Representation without Campaigning**
  Theory predicts that a stratified random sample will mirror the population's demographics better than an elected body, without requiring candidates to possess capital or rhetorical skill.
  *   **The Case:** The ICA's 99 members were stratified by gender, age, region, and social class from the electoral register. The result was a body that looked like Ireland in a way the Dáil never has.
  *   **Theoretical Validation:** This confirms the claim that the lot bypasses the "filter" of electability. No member needed to raise funds, join a party, or cultivate a public persona. The mechanism of selection (the sort) successfully decoupled *representation* from *ambition*.

  **2. The Structural Elimination of the Career Politician**
  Theory argues that sortition prevents the emergence of a distinct political class because no one can campaign for the seat, retain it, or build a career upon it.
  *   **The Case:** Members served for the life of the body, received expenses but no salary, and had no pathway to re-appointment.
  *   **Theoretical Validation:** This explains the ICA's capacity for compromise, particularly on the Eighth Amendment. Because members faced no electoral punishment and sought no future office, they were free to vote according to their deliberative judgment rather than partisan survival. The theory correctly predicts that removing the *prospect* of a career changes the *nature* of the decision-making.

  **3. Legitimacy via Procedural Integrity (The Scandal Test)**
  A critical, often under-examined tenet of sortition theory is that the legitimacy of the body rests entirely on the integrity of the randomization process. If the lot is rigged, the "democratic" claim collapses.
  *   **The Case:** Seven replacement members were removed when it was discovered they had been recruited through a polling company employee's acquaintances rather than by strict lot.
  *   **Theoretical Validation:** This episode vindicates the theory's insistence on procedural purity. The scandal did not concern the *competence* of the seven members, but the *method* of their selection. Their removal was necessary to restore the body's claim to be a microcosm of the public. This confirms that in sortition, *how* you get in is the sole source of your authority to speak for those who are not there.

  **4. Attrition and Replacement**
  Theory often treats the sortited body as a static snapshot. However, the ICA saw a 20% withdrawal rate over its lifespan.
  *   **The Case:** Members dropped out due to the time commitment (weekends over months) and were replaced by new lot.
  *   **Theoretical Nuance:** This highlights a practical limitation in the theory. Sortition assumes a "duty to serve" akin to jury duty, but political deliberation is more onerous than legal adjudication. The theory must account for the fact that high attrition requires a secondary lottery mechanism, which introduces a slight temporal discontinuity in the "descriptive snapshot."

  ### II. Case $\rightarrow$ Theory: Where Theory is Silent or Misdescribes

  While sortition theory explains the *composition* and *internal incentives* of the ICA well, it is surprisingly silent on the *external constraints* and *epistemic structures* that defined the Assembly's actual power.

  **1. Agenda Control and the "Capture" Worry**
  Classic sortition theory (e.g., Athenian models) often assumes the sortited body is sovereign or at least self-agendizing. It struggles to account for a "managed" mini-public.
  *   **The Case:** The Oireachtas (parliament) chose the five topics. The government could add or withhold questions.
  *   **Theoretical Gap:** This validates the critique that sortition without agenda-setting power is vulnerable to elite capture. The theory claims the lot democratizes power, but if the *questions* are determined by career politicians, the lot merely democratizes the *answers* to elite prompts. The ICA shows that sortition can be co-opted as a tool of "conflict management" for difficult issues (like abortion) that established parties prefer not to own.

  **2. Deliberative Scaffolding vs. Co-Equality**
  Theory often romanticizes the "wisdom of the crowd," assuming co-equal citizens can deliberate effectively on complex policy.
  *   **The Case:** The Assembly was chaired by a retired Supreme Court judge (Mary Laffoy) and relied heavily on curated expert testimony and facilitators.
  *   **Theoretical Gap:** The theory underestimates the need for epistemic hierarchy. A body of co-equals without structured guidance risks demagoguery or confusion. The ICA succeeded not because it was a raw assembly of peers, but because it functioned more like a **grand jury**: citizens empowered to weigh evidence presented by experts, guided by a neutral judicial figure. Sortition theory needs to integrate the necessity of *facilitated deliberation* rather than assuming deliberation emerges naturally from the mix of people.

  **3. Advisory Authority vs. Decisional Power**
  Sortition theory often conflates *legitimacy* with *authority*. It assumes that because a body is descriptively representative, its decisions should bind.
  *   **The Case:** The ICA's recommendations were advisory. The government was required to respond, not to adopt. Yet, on abortion, the recommendations were adopted; on climate change, they were largely delayed or diluted.
  *   **Theoretical Gap:** The ICA demonstrates that the power of a sortited body is not institutional but **moral and political**. Its authority came from the public perception of its integrity and the political cost to the government of ignoring it. Theory needs to distinguish between *binding sortition* (legislative) and *advisory sortition* (consultative). The ICA suggests advisory sortition is more viable in modern states, but its efficacy depends on the media environment and public pressure, variables theory rarely models.

  **4. Accountability Mechanisms**
  Theory argues sortition replaces electoral accountability with "internal" accountability (to one's peers and the process).
  *   **The Case:** Members had no constituency, no continuity, and no capacity to oversee implementation.
  *   **Theoretical Gap:** This confirms the "accountability deficit" critique. Once the ICA disbanded, there was no mechanism to hold anyone responsible for the *outcome* of the policies, only the *process* of the recommendation. Sortition solves the problem of *input* legitimacy (who decides) but leaves *output* accountability (who fixes it if it goes wrong) entirely to the traditional elected parliament.

  ### III. Term Limits vs. Sortition: The Question of Careerism

  Your specific interest lies in whether the ICA suggests term limits are a crude proxy for sortition, or if they serve different functions. The ICA evidence strongly suggests the latter: **Term limits and sortition address different stages of the political lifecycle.**

  **1. Ex Post vs. Ex Ante Control**
  *   **Term Limits:** Operate *ex post*. They accept the logic of election (ambition, campaigning, selection for desire for office) but attempt to truncate the duration of power. They assume the problem is *entrenchment*.
  *   **Sortition:** Operates *ex ante*. It rejects the logic of election. It assumes the problem is *selection bias*.
  *   **The ICA Evidence:** The ICA members did not just have limited time; they had *no ambition* for the role. A term-limited politician still campaigns, raises money, and makes promises to get the seat. They enter office owing debts to donors and parties. The ICA members entered owing nothing to anyone but the process itself.
  *   **Conclusion:** Term limits are indeed a crude proxy. They evict the incumbent but invite a new aspirant. Sortition invites a non-aspirant. The ICA's success on contentious issues (abortion) stemmed from the fact that members were not positioning themselves for the next election. Term limits do not solve this; a term-limited deputy still behaves like a politician while in office.

  **2. Rotation in Office vs. Rotation of Citizens**
  *   **Traditional Rotation:** Historically, rotation meant citizens taking turns holding office (e.g., Athenian archons).
  *   **Modern Term Limits:** This is rotation of *elites*.
  *   **The ICA:** This is rotation of *ordinary citizens* into a specific deliberative task.
  *   **Theoretical Implication:** The ICA shows that "rotation" is only democratic if the pool being rotated is the whole citizenry, not just the class of people willing to run for office. The ICA validates the claim that **removing the desire for office is more transformative than limiting the tenure of office.**

  **3. The "Crude Proxy" Verdict**
  Does the ICA suggest term limits are a crude proxy? **Yes.**
  Term limits attempt to cure the symptoms of careerism (entrenchment) without curing the disease (the selection of ambitious actors). The ICA demonstrates that a body constructed without ambition behaves fundamentally differently than a body of ambitious actors whose time is merely capped.
  *   *However,* the ICA also shows the limits of sortition: it works for *recommendation* and *constitutional moments* (like repealing the Eighth Amendment), but it does not replace the need for a governing class that implements policy over time.
  *   **Synthesis:** Term limits are a mechanism for managing a professional political class. Sortition is a mechanism for bypassing it. The ICA proves that bypassing is possible and effective for specific deliberative tasks, but it does not prove that sortition can replace the executive function where continuity and accountability are required.

  ### Summary for the Term Paper

  In mapping the Irish Citizens' Assembly, you can argue that it serves as a **proof of concept for the descriptive and anti-careerist claims of sortition theory**, particularly validated by the integrity scandal (which proved the lot is the source of legitimacy) and the abortion vote (which proved non-ambitious actors can resolve moral impasses).

  However, you must concurrently argue that the episode **exposes the silence of sortition theory regarding power dynamics.** The theory explains who sits at the table, but not who sets the table, who writes the menu, or who clears the plates. The ICA was powerful not because of its constitutional authority, but because of its moral authority—a distinction theory must sharpen.

  Finally, regarding term limits: The ICA demonstrates that term limits are a **structural constraint on ambition**, whereas sortition is a **structural elimination of ambition.** The Assembly's relative success suggests that while term limits may reduce entrenchment, only sortition (or something very near to it) can produce the kind of disinterested deliberation that resolved the abortion question. They are not proxies for one another; they are tools for different jobs. Term limits manage the political class; sortition temporarily suspends it.
