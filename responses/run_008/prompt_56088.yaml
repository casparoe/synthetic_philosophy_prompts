prompt: |-
  I do infrastructure finance for a living -- I build the DCF models that decide whether a toll road or a water system gets funded, so I live in net present value, weighted average cost of capital, term structures, risk premia, that whole world. Lately I've gotten into the philosophical fight about "pure time preference" -- the idea (rejected by basically everyone who writes on it, starting with Ramsey and Sidgwick) that a benefit in the year 2300 counts for less *just because it's later*, holding everything else fixed. I want you to restate that whole debate in my vocabulary, as faithfully as you can, and then tell me what didn't survive the translation.

  Specifically, translate: the pure time preference debate itself; the Stern-versus-Nordhaus style fight over what discount rate to use for climate (near-zero pure rate plus growth-based discounting versus rates backed out of market returns); the distinction philosophers insist on between discounting a benefit because it comes later and discounting it because the recipients will be richer, or because the future might not exist; and the objection that you can't read an ethical weight off market prices because future people aren't parties to any market transaction.

  Then the residue report, which is what I actually care about: which parts of the philosophers' argument map cleanly onto things I already have (a term structure with a default/existence component, marginal utility weighting via consumption growth, the difference between pricing risk to an investor and valuing a benefit to a recipient), which parts only fit if you distort them, and which parts have no expression at all in how I think about discount rates. Two things I specifically want your read on. First, my models produce one number for delta and it's basically unrecoverable what's inside it -- if pure time preference is supposed to be this precise, distinct thing, is that a defect in my vocabulary or is the philosopher's "pure" rate actually not operational? Second, my discounting is exponential because that's what makes the math time-consistent, but apparently some of these people argue for declining discount rates over centuries -- is that expressible in my framework at all, or does it break something structural?

  And the big question at the end: is there anything the philosophers are arguing about that genuinely has no counterpart in finance vocabulary, and if so, is that because my vocabulary is missing something, or because their disagreement is less substantive than it looks? I'm fluent in my stuff but only a dabbler in theirs, so don't assume I know the jargon on their side -- but don't water down mine either.
