answer: |-
  # Which view of virtual objects do you actually hold?

  **Node 1: Start Here**
  Think of your main character in your favorite online game. Not the graphics, but the *thing* you control. We are going to test what you think that thing *is* by putting it through five stress tests. Follow your gut instinct for each scenario.

  **Node 2: The Backup Test (Case 1)**
  *Scenario:* The game server crashes and is shut down for a month. When it returns, they restore your character from a backup saved a week before the crash. You lost a week of progress.
  *   **A:** It is the **same character**, just restored like a healed wound. (Go to Node 3)
  *   **B:** It is a **new duplicate**, a copy that merely resembles the old one. (Go to Node 4)

  **Node 3: The Clone Test (Case 2)**
  *Scenario:* A bug creates two numerically distinct copies of your "Unique" sword. Both exist in the game world simultaneously.
  *   **A:** This is impossible; one must be a fake or the bug prevents equipping. (Go to **Leaf 1**)
  *   **B:** Both are real instances of the same sword-pattern; uniqueness is just a rule, not a metaphysical fact. (Go to **Leaf 2**)

  **Node 4: The Cash Test (Case 3)**
  *Scenario:* You buy a rare item from a third-party seller for real money. The game company didn't authorize it.
  *   **A:** You acquired a **Thing** (a digital object that now belongs to you). (Go to Node 5)
  *   **B:** You acquired a **Right** (a permission or status recognized by other players). (Go to Node 5)
  *   **C:** You acquired **Nothing** (just pixels; the Terms of Service say you own nothing). (Go to Node 6)

  **Node 5: The Wrecking Ball Test (Case 4)**
  *Scenario:* Another player deliberately destroys a build you spent a year constructing.
  *   **A:** This is **vandalism against property**; they broke something that was yours. (Go to **Leaf 3**)
  *   **B:** This is **rude behavior**; they violated a social norm or game rule, but didn't damage "property." (Go to Node 6)

  **Node 6: The Harm Branch Entry**
  *Note:* We now leave the question of *objects* to ask about *harm*. This branch tests where you think pain lives in a virtual space.
  *   **Proceed to Node 7.**

  **Node 7: The Pain Test (Case 5)**
  *Scenario:* A player performs a distressing, violent act on your avatar in a shared world. You are left genuinely shaken and upset.
  *   **A:** The harm lives **in the World**; the avatar itself was violated. (Go to **Leaf 1** *[See Analysis]* )
  *   **B:** The harm lives **in the Player**; the avatar was just the medium for hurting you. (Go to **Leaf 4**)
  *   **C:** The harm is **Nowhere**; your reaction is an illusion or overreaction to code. (Go to **Leaf 5**)

  ***

  **Leaf 1: Virtual Realism (Chalmers-Style)**
  *Path:* Same Character + One Real Sword + Harm in World.
  *View:* Virtual objects are genuine digital objects. They exist, they persist, and they can be harmed. You didn't lose a week of progress; you lost *time* from your character's life.

  **Leaf 2: The Abstract-Artifact View**
  *Path:* Same Character + Both Swords Real.
  *View:* A virtual sword is like a poem or a song. The "object" is the abstract pattern (the code/design), not the specific instance on the screen. Copies are just new performances of the same work.

  **Leaf 3: The Institutional View**
  *Path:* Thing/Right + Vandalism.
  *View:* Virtual objects are created by social agreement and rules (like money or marriage). They are real because we treat them as real. Destroying a build violates the "status function" you hold in that community.

  **Leaf 4: Fictional Props (Walton-Esque)**
  *Path:* Nothing/Rude + Harm in Player.
  *View:* Virtual objects are props that prescribe imaginings. The sword isn't real, but your fear is. The harm isn't to the avatar (which is fiction), but to the *person* imagining through it.

  **Leaf 5: Flat Irrealism**
  *Path:* Nothing + Harm Nowhere.
  *View:* There is nothing there but electrical signals. To speak of "virtual property" or "virtual harm" is a category error. You were tricked by the interface, but no ontological wrong occurred.

  ***

  ### Analysis of the Logical Space

  **(a) Indistinguishable Leaves**
  **Virtual Realism (Leaf 1)** and **The Institutional View (Leaf 3)** are not fully separated by this tree. A Realist believes objects are digital physical things; an Institutionalist believes they are social rights. However, both answer "Same Character" (Node 2) and "Vandalism" (Node 5) identically. To separate them, we would need a node asking: *"If every human vanished, would the virtual sword still exist?"* (Realist: Yes, on the server; Institutionalist: No, it requires a society).

  **(b) Unoccupied Combinations**
  **The "Real Object / No Harm" Gap:** There is no named position that answers **Node 2-A** (It is the same character/Real Object) but **Node 7-C** (Harm is Nowhere).
  *Verdict:* This combination is **incoherent**. If you believe the virtual object is real enough to have identity over time (Realism), you generally must accept it is real enough to be the locus of harm; claiming it exists but cannot be harmed contradicts the definition of a persistent digital object.
