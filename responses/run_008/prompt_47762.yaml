      *   *Critical Insight:* In practical forecasting (like Good Judgment Project style), intervals often collapse into "point estimate + confidence." If the goal is *scoring* (Brier score, Log score), intervals are hard to score properly without converting to points.
      *   *The "Dead End" Possibility:* Is IP actually useful for *forecasting outcomes* (will X happen?) vs. *decision making under ambiguity* (Ellsberg style)?
      *   *Refinement:* For predicting election outcomes or project timelines, a single number (properly calibrated) is usually more actionable and scoreable than an interval. Intervals shine when the *model* is unstable, not just when the *outcome* is uncertain.
