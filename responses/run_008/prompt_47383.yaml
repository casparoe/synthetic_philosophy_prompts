answer: |-
  **A JOINT STATEMENT ON THE FUNCTION OF NEGRO ART**
  **New York City, 1927**

  **Signed:**
  *On behalf of the Committee for Civil Rights through Culture:* W.E.B. Du Bois
  *On behalf of the New Negro Alliance for Aesthetic Liberty:* Alain Locke, Wallace Thurman

  **Preamble**
  We, the undersigned, recognise that the so-called 'Negro Problem' is not merely sociological but spiritual. We acknowledge that the Harlem Renaissance represents a watershed moment wherein the Negro mind seeks to articulate itself. While we differ on the *ends* of this articulation, we agree that the silence of the past is no longer tenable. This document outlines the terrain upon which we stand together, the cliffs across which we stare, and the experiments by which history shall judge us.

  ### I. Claims Accepted by Both Camps

  1.  **On the Condition of the Race:** We agree that the American Negro exists in a state of psychological siege. Lynching, disenfranchisement, and the caricaturing of Black life in white media constitute a concerted attack on the humanity of the race.
  2.  **On the Power of Representation:** We agree that art is not created in a vacuum. White America largely judges the capacity of the Negro race for citizenship and civilisation based upon the cultural products Negroes create. Misrepresentation has material consequences.
  3.  **On the Necessity of Excellence:** We agree that mediocrity serves no one. Whether for the sake of the race or the sake of the muse, Black art must strive for the highest technical and emotional standards.
  4.  **On the Artist's Humanity:** We agree that the Black artist is a human being first, possessed of an individual soul that cannot be wholly subsumed by a political programme without damage to the creative spirit.
  5.  **On the Limit of Art:** We agree that art alone cannot dismantle Jim Crow. Legislation, economic power, and direct action are required alongside cultural production. Art is a sword, or a flower, but it is not the hand that wields the sword or picks the flower.

  ### II. Table of Disagreements

  | Area of Contention | The Du Bois Position (Art as Armament) | The Autonomist Position (Locke/Thurman/FIRE!!) |
  | :--- | :--- | :--- |
  | **Primary Obligation** | The artist owes a debt to the Race. To ignore the struggle is to aid the oppressor. | The artist owes a debt to the Truth and the Muse. To subordinate art to a cause is to kill the art. |
  | **Subject Matter** | Focus should be placed on the dignified, the educated, and the uplifting to counteract stereotypes. | Focus should be placed on the authentic, the unvarnished, and the full spectrum of life, including the sordid. |
  | **Audience** | Art must educate the white majority and inspire the Black masses. | Art must satisfy the creative impulse of the individual; the audience is secondary. |
  | **Risk Assessment** | The risk of reinforcing stereotypes outweighs the risk of artistic stifling. | The risk of artistic stifling outweighs the risk of temporary misunderstanding by the public. |

  ### III. The Cruxes

  We identify three fundamental divergences. For each, we propose a concrete case or work currently in circulation or production. We record our predictions herein, to be opened at a future date.

  **Crux 1: Is Beauty a Route to Political Truth, or an End in Itself?**
  *   **The Dispute:** Camp One argues that beauty is only valuable insofar as it reveals the humanity of the Negro to a hostile world. Camp Two argues that beauty is a universal value; achieving it proves humanity automatically, without needing to plead a case.
  *   **The Case:** *The Poetry of Langston Hughes.* Specifically, his use of jazz rhythms and dialect to depict working-class Black life.
  *   **Camp One Prediction (Du Bois):** We predict that while Hughes's work possesses rhythm, its focus on the 'low-down' folk without explicit moralising will be seized upon by white critics to confirm the Negro is merely a creature of instinct, thereby hindering the fight for political equality.
  *   **Camp Two Prediction (Locke/Thurman):** We predict that Hughes's honesty will create a new aesthetic standard. By treating Black vernacular as worthy of high art, we force the world to recognise the complexity of Black soul, achieving dignity through authenticity rather than respectability.

  **Crux 2: Who Decides What Counts as 'Good' Propaganda?**
  *   **The Dispute:** Camp One believes the 'Talented Tenth' and leadership organisations (like the NAACP) must guide the narrative to ensure it serves the race. Camp Two believes that any external guidance is censorship, and that the 'new chains' of respectability are as damaging as the old chains of slavery.
  *   **The Case:** *FIRE!! Magazine (1926).* A publication dedicated to younger artists, featuring stories on homosexuality, prostitution, and colourism within the Black community.
  *   **Camp One Prediction (Du Bois):** We predict this publication will be a scandal that wastes the energy of gifted young writers on filth, alienating the Black middle class whose support is necessary for racial advancement.
  *   **Camp Two Prediction (Thurman):** We predict this publication will be the only work of this era remembered in fifty years, because it dared to treat Black people as complex adults rather than children needing protection.

  **Crux 3: The Definition of Propaganda (Verbal Dispute)**
  *   **The Dispute:** Camp One defines 'propaganda' as *any* art that persuades an audience of a viewpoint (which they argue is all art). Camp Two defines 'propaganda' as *didactic* art created with a specific political agenda.
  *   **The Case:** *Aaron Douglas's Murals.* Stylised African motifs used to depict Black history.
  *   **Camp One Prediction (Du Bois):** We claim this is excellent propaganda because it instills race pride. We admit it is beautiful, but its utility makes it valuable.
  *   **Camp Two Prediction (Locke):** We claim this is excellent Art. Its political effect is a byproduct of its aesthetic power. To call it propaganda reduces its universal significance to a temporary political tool.
  *   **Resolution on Terminology:** We acknowledge that when Camp One says 'All art is propaganda,' they mean 'All art has social consequences.' When Camp Two says 'Art is not propaganda,' they mean 'Art should not be *conscripted* for social ends.' We agree to disagree on the label, provided we agree on the freedom of the artist to create.

  ### IV. Concluding Remark

  We part ways not as enemies, but as strategists debating the best manoeuvre in a long war. Camp One fears that without a shield, the race will be devoured by prejudice. Camp Two fears that with a shield, the race will never be seen as fully human. We agree to let the work stand. If the art is truly great, it may yet satisfy the demands of the politician and the priest of beauty alike.

  **W.E.B. Du Bois**
  *Editor, The Crisis*

  **Alain Locke**
  *Professor of Philosophy, Howard University*

  **Wallace Thurman**
  *Editor, FIRE!!*
