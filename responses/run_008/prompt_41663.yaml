prompt: |-
  I host a philosophy-of-science podcast aimed at grad students and statistically literate non-specialists, and next month's guest is a philosopher who has spent her career defending the single-case propensity interpretation of probability -- the view that a probability is a real, physical disposition of a particular trial or setup to produce a particular outcome, so that a given radium atom really has, right now, a propensity of such-and-so to decay within the hour, and this is not shorthand for anything about long runs or anyone's degrees of belief. She is allergic to rehashing the standard frequency-versus-subjectivism survey, and she is very good at compressing objections into a friendly-sounding "that's a nice epistemology point, but I'm doing metaphysics" and moving on. I have about 45 minutes. Draft me eight to ten questions that do more than invite a restatement of the view, with at least one question each on the following, and for each of those, a follow-up keyed to the reply she is most likely to give.

  First, the asymmetry problem: ordinary probabilities invert freely through Bayes' theorem -- the probability of decay given the state is exactly as well-defined as the probability of the state given decay -- but propensities seem to point forward in time, cause-like, so there is no such thing as a propensity of the atom's being in its present state, given that it decayed; I want a question that forces her to say which side she gives up, the dispositional character or the full probability calculus, and a follow-up for whichever half she sacrifices. Second, the bridging problem: why should an ensemble of independent trials with a given single-case propensity produce a stable limiting frequency, given that any argument via the laws of large numbers appears to presuppose probabilities at the level propensities were supposed to explain. Third, the reference-class or trial-conditions problem: a propensity is a disposition of a trial under a description -- the same coin toss has different propensities under different specifications of the setup -- so I want a question about what fixes the relevant description without smuggling in our ignorance (at which point the view risks collapsing into subjectivism about evidence). Fourth, whether the quantum-mechanical motivation actually does the work her tradition claims: does the propensity reading add anything to the Born rule beyond a label, and what happens to the view if deterministic hidden-variable or Everettian physics turns out to be true. Fifth, the dispositions analogy she leans on -- propensities are supposed to be like fragility or solubility, single-case and real -- and where she thinks the analogy is load-bearing, given that familiar dispositions have identifiable causal bases, and it is far from obvious what the causal basis of a 1/3 propensity could be.

  A few constraints and requests. Keep the mathematics at the level of conditional probability -- no measure theory on air. For each follow-up, state in a sentence or two what reply you are anticipating and why that's the probable one, since I may need to ad-lib around it. Finally, be candid about the plan's fragility: flag which of your anticipated replies are extrapolations from her tradition's textbook responses rather than from anything she has actually committed to in print, and tell me specifically which question you would cut or restructure if, five minutes in, it turned out she defends a long-run rather than single-case version of the view -- that is, where the list silently depends on a contestable reading of her position, and what signal from her would tell me to abandon that reading.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Host/Context:** Philosophy-of-science podcast, grad students/stat-literate non-specialists, 45 minutes.
      *   **Guest:** Philosopher defending *single-case propensity interpretation* of probability (real, physical disposition of a particular trial, not long-run frequency or subjective belief).
      *   **Guest's Style:** Allergic to standard frequency-vs-subjectivism rehashes, good at deflecting epistemological objections as "metaphysics," compresses objections.
      *   **Goal:** 8-10 questions that go beyond restatement.
      *   **Required Topics (with follow-ups):**
          1.  Asymmetry Problem (Bayes vs. Causal Direction).
          2.  Bridging Problem (Propensity to Frequency/LLN).
          3.  Reference Class/Trial Conditions (Description dependence).
          4.  QM Motivation (Born rule, Hidden Variables/Everett).
          5.  Dispositions Analogy (Fragility/Solubility vs. Causal Basis).
      *   **Constraints:** Math at conditional probability level (no measure theory).
      *   **Follow-up Requirement:** State anticipated reply and why.
      *   **Meta-Commentary:** Flag fragility/extrapolations, identify which question to cut if she turns out to be a long-run propensity theorist (though the prompt says she defends single-case, I need to be alert to drift), and identify signals to abandon the reading.

  2.  **Deconstruct the Guest's Position & Potential Defenses:**
      *   *Single-Case Propensity:* Probability is a physical property of a specific setup at a specific time (e.g., Popper, Giere, maybe Miller).
      *   *Deflection Tactic:* "That's epistemology, I'm doing metaphysics." (i.e., "How do we *know* the propensity?" is irrelevant to "What *is* the propensity?").
      *   *The Trap:* Many propensity arguments rely on QM, but QM interpretations vary. Many rely on dispositions, but dispositions are controversial.
      *   *The "Long-Run" Drift:* Sometimes single-case theorists sneak in long-run stability as a *definition* of the propensity's magnitude, which undermines the single-case claim.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Asymmetry.*
          *   *Issue:* $P(A|B) \neq P(B|A)$ in propensities, but Bayes says they are linked. Propensities are causal (future-directed).
          *   *Question:* How do you handle inverse probabilities (diagnostic reasoning)?
          *   *Follow-up:* If she sacrifices the probability calculus, she loses utility. If she sacrifices directionality, she loses the "propensity" distinctness.
          *   *Drafting:* Focus on the tension between Humphreys' paradox and Bayes.

      *   *Topic 2: Bridging (LLN).*
          *   *Issue:* Why do propensities yield frequencies? If you use LLN to explain it, aren't you presupposing probability?
          *   *Question:* What *makes* the frequency converge?
          *   *Follow-up:* She might say it's a "law of nature." I need to press on whether that law is probabilistic (circular) or deterministic (undermines propensity).

      *   *Topic 3: Reference Class.*
          *   *Issue:* A coin toss has different propensities depending on how you describe the setup (e.g., "toss" vs. "toss with wind speed X").
          *   *Question:* What fixes the description? Is it the *maximal* specification?
          *   *Follow-up:* If maximal, isn't it deterministic (0 or 1)? If not maximal, isn't it epistemic (what we know)?

      *   *Topic 4: QM Motivation.*
          *   *Issue:* Propensity is often tied to QM indeterminism.
          *   *Question:* Does this view survive Bohm or Many-Worlds?
          *   *Follow-up:* If she says "QM is indeterministic," I need to ask if the philosophy depends on that physics being true.

      *   *Topic 5: Dispositions Analogy.*
          *   *Issue:* Fragility has a molecular structure. What is the "structure" of a 0.5 propensity?
          *   *Question:* What is the categorical base?
          *   *Follow-up:* If she says "it's primitive," does that make it occult?

      *   *Filling the remaining 3-5 questions:*
          *   Need to address her specific deflection tactic ("That's epistemology").
          *   Need to address the "magnitude" problem (Why *this* number?).
          *   Need to address the utility of the view (What work does it do?).
          *   Need a closing question on the future of the field.

  4.  **Refining Follow-ups and Anticipations:**
      *   *Constraint Check:* Must state anticipated reply and why.
      *   *Constraint Check:* Must flag extrapolations vs. printed commitments.
      *   *Constraint Check:* Must identify the "Long-Run" drift signal.

  5.  **Addressing the "Long-Run" Contingency:**
      *   The prompt says she defends single-case. But often, when pressed on *magnitude*, single-case theorists define the magnitude *by* the hypothetical long-run frequency. This is a vulnerability.
      *   *Signal:* If she defines the single-case propensity value *as* the limit of a hypothetical infinite sequence, she's effectively a long-run theorist (like Reichenbach or von Mises but modalized).
      *   *Cut:* The Bridging Problem (Q2) becomes redundant or needs total restructuring if she admits the magnitude *is* the long-run tendency. Actually, the Reference Class question (Q3) is more fragile here because long-run theories handle reference classes differently (collectives). I should flag Q3 or Q2. Let's flag Q2 (Bridging) because if propensity *is* defined by long-run behavior, the "bridge" is tautological, not explanatory.

  6.  **Developing the Content (incorporating the "Allergic to Epistemology" trait):**
      *   I need to make sure the questions don't sound like "How do we measure this?" but rather "What constitutes this?"
      *   For the Asymmetry question, I need to prevent her from saying "Bayes is for beliefs." I need to force: "Is physical reality Bayes-compatible?"

  7.  **Final Review against Constraints:**
      *   8-10 questions? Yes.
      *   Conditional probability math only? Yes.
      *   Follow-ups with anticipated replies? Yes.
      *   Meta-commentary on fragility? Yes.
      *   Signal for long-run drift? Yes.

  8.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Asymmetry" question explicitly mentions Humphreys or the inversion problem so she can't dodge.
      *   *Correction:* Ensure the "Dispositions" question distinguishes between *having* a disposition and the *magnitude* of that disposition.
      *   *Correction:* The "Long-Run" contingency needs to be very clear in the meta-commentary section.

      *(Self-Correction on the "Long-Run" instruction)*: The prompt asks me to tell them specifically which question to cut/restructure *if* it turns out she defends a long-run version. Since the prompt *says* she defends single-case, this is a contingency plan. I need to identify which question relies *most* on the single-case assumption. The Bridging Problem (Q2) assumes single-case propensities need to *explain* frequencies. If she says propensities *are* defined by frequencies (long-run), Q2 changes from "How do you bridge?" to "Why is this not just frequentism?" So Q2 is the one to restructure.

      *(Refining the "Extrapolation" flag)*: I don't know *which* philosopher this is (could be Gillies, Miller, a specific contemporary). I must admit I am extrapolating from the "Propensity Tradition" (Popper/Giere/Humphreys) generally.

      *(Final Polish)*: Ensure the tone is professional, suitable for a host prepping for a rigorous interview.

  9.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here is a draft of ten questions tailored to your constraints, the guest's specific defensive habits, and the required technical depth.

  ### Interview Plan: The Single-Case Propensity Defense

  **Context:** 45 minutes.
  **Target:** Stat-literate non-specialists/Grad students.
  **Strategy:** Prevent deflection into "metaphysics vs. epistemology" by framing epistemic constraints as metaphysical boundaries.

  ---

  #### 1. The Asymmetry Problem (Humphreys' Paradox)
  **Question:** "Standard probability calculus allows inversion: $P(\text{Decay}|\text{Atom})$ is mathematically linked to $P(\text{Atom}|\text{Decay})$ via Bayes' theorem. But propensities seem inherently time-directed—a cause-like disposition of the present to produce a future. There is no physical disposition of a *future* decay to produce a *past* atomic state. Do you deny that inverse probabilities represent real propensities, or do you deny that propensities must obey the standard probability calculus?"

  **Follow-up:** "If you sacrifice the calculus to save the causal direction, you lose the ability to model diagnostic reasoning physically. If you save the calculus by allowing 'backward propensities,' you seem to lose the dispositional, cause-like character that distinguishes your view from frequentism. Which specific axiom are you willing to break to keep the view coherent?"
  *   **Anticipated Reply:** She will likely argue that propensities are only a *subset* of probabilities (the forward-looking ones) and that Bayes' theorem is a rule for updating *beliefs* about propensities, not a relation between propensities themselves.
  *   **Why:** This is the standard Popperian/Giere escape route to preserve the metaphysical "production" aspect without breaking math.

  #### 2. The Bridging Problem (Propensity to Frequency)
  **Question:** "Let's assume a single-case propensity of 0.5 for a coin toss. Why should an ensemble of these independent trials produce a stable limiting frequency of 0.5? Any argument using the Law of Large Numbers seems to presuppose a probability distribution over the trials to prove the convergence. Are you explaining frequencies using propensities, or just positing a brute law that propensities *happen* to match frequencies?"
  *   **Anticipated Reply:** She will likely claim it is a "law of nature" that propensities manifest as frequencies in the long run, treating the connection as primitive rather than derived.
  *   **Why:** This avoids the circularity of using probability to prove probability, though it risks making the view empirically empty.

  **Follow-up:** "If that connection is a primitive law of nature, is it possible for a world to exist where the propensity is 0.5 but the long-run frequency is 0.9? If yes, your view is untestable; if no, isn't the frequency doing the metaphysical heavy lifting after all?"
  *   **Anticipated Reply:** She will say "No, that world is not physically possible," effectively tying the magnitude of the propensity to the hypothetical frequency.
  *   **Why:** This is the danger zone where single-case views often collapse into modalized frequentism.

  #### 3. The Reference Class (Trial Conditions)
  **Question:** "A propensity is a disposition of a setup under a description. A coin toss has one propensity given 'fair toss,' but a different one given 'toss with wind speed X.' What fixes the relevant description for the single case? Is it the maximal physical specification of the setup?"
  *   **Anticipated Reply:** She will argue for the "maximal specification" of the physical setup at the time of the trial.
  *   **Why:** This is the standard move to prevent the propensity from varying based on an agent's ignorance (which would make it epistemic).

  **Follow-up:** "If you require maximal physical specification, Laplace's Demon would assign probabilities of only 0 or 1. If you allow less than maximal specification, aren't you smuggling in an agent's ignorance about which details matter, effectively collapsing back into an epistemic view?"
  *   **Anticipated Reply:** She will distinguish between *deterministic* maximal specifications and *indeterministic* maximal specifications, insisting nature itself can be maximally specified yet still yield 0.5.
  *   **Why:** This leans heavily on the QM motivation (Topic 4).

  #### 4. The Quantum Motivation
  **Question:** "Your view finds its strongest footing in quantum mechanics, specifically the Born rule. But does the propensity interpretation add anything to the Born rule other than a label? If we discovered a deterministic hidden-variable theory tomorrow that recovered the same statistics, would you abandon propensities, or would you argue the hidden variables themselves have propensities?"
  *   **Anticipated Reply:** She will likely argue that QM is fundamentally indeterministic and that hidden-variable theories are either ruled out or would themselves require propensities at a deeper level.
  *   **Why:** Most propensity theorists tie their metaphysics to the truth of indeterministic physics.

  **Follow-up:** "So your metaphysics depends on the physical truth of indeterminism? If Everettian Many-Worlds is true, where every outcome happens, does the concept of a 'single-case propensity to produce *this* outcome' cease to have meaning?"
  *   **Anticipated Reply:** She may argue that Even in Many-Worlds, there is a propensity for an observer to find themselves on a specific branch (self-locating uncertainty).
  *   **Why:** This is a common contemporary adjustment to save propensities in deterministic multiverse scenarios.

  #### 5. The Dispositions Analogy (Causal Basis)
  **Question:** "You lean on the analogy that propensities are like fragility or solubility—real, single-case dispositions. But fragility has a categorical base: molecular structure. What is the categorical base of a 0.5 propensity? Is there a physical structure that *is* the probability, or is the propensity itself the base?"
  *   **Anticipated Reply:** She will likely argue that propensities are "fundamental" dispositions that do not require a further categorical base, unlike macroscopic dispositions like fragility.
  *   **Why:** This isolates propensities as primitive physical properties to avoid infinite regress.

  **Follow-up:** "If they are primitive properties without a structural base, how do they exert causal influence? In standard metaphysics, dispositions cause outcomes via their base. If the propensity *is* the base, how does a number (0.5) physically push an atom to decay?"
  *   **Anticipated Reply:** She will reject the "pushing" picture, arguing that probabilistic causation is not deterministic forcing but a weighted tendency that doesn't require a mechanical 'push.'
  *   **Why:** This preserves the indeterminism but risks making the causation occult.

  #### 6. The "Metaphysics vs. Epistemology" Deflection
  **Question:** "You often distinguish your project as metaphysics (what probability *is*) rather than epistemology (how we *know* it). But if a single-case propensity is physically real, it must make a difference to the physical world. If that difference is indistinguishable from a world where probabilities are just frequencies or beliefs, is the metaphysical distinction doing any work?"
  *   **Anticipated Reply:** She will argue it makes a difference to *counterfactuals*: what *would* happen in a single case, even if the long run is identical.
  *   **Why:** This is the core selling point of single-case views (handling singular events).

  **Follow-up:** "But if the counterfactual 'what would happen' cannot be tested without running an ensemble, and the ensemble behavior is identical to frequentism, isn't the single-case propensity an empirically silent metaphysical posits?"
  *   **Anticipated Reply:** She will argue that scientific realism often posits unobservables (like electrons) that are only testable via ensemble effects.
  *   **Why:** She will align propensities with other unobservable theoretical entities.

  #### 7. The Magnitude Problem
  **Question:** "Why is the propensity of this radium atom *exactly* 0.5 (or whatever specific value) rather than 0.500001? In a deterministic setup, the base fixes the outcome. In your view, what fixes the specific numerical magnitude of the propensity in a single case?"
  *   **Anticipated Reply:** She will likely say the magnitude is a fundamental physical constant associated with the setup, fixed by the laws of nature.
  *   **Why:** This treats probability values like mass or charge.

  **Follow-up:** "Mass is additive; two bricks have double the mass of one. Are propensities additive or combinable? If I combine two independent setups, what physical operation yields the new propensity magnitude?"
  *   **Anticipated Reply:** She will point to the product rule for independent events as the physical combination rule.
  *   **Why:** She will try to map the mathematical rules directly onto physical combination.

  #### 8. The "No-Outcome" Problem
  **Question:** "Consider a single-case propensity for an event that never occurs. If an atom has a propensity to decay but is destroyed before it decays, did it possess that propensity? If yes, how was it manifested? If no, was the propensity dependent on the future outcome?"
  *   **Anticipated Reply:** She will say the propensity existed as a disposition even if unmanifested, just as a glass is fragile even if it never breaks.
  *   **Why:** Standard dispositional essentialism.

  **Follow-up:** "Fragility is defined by *if* struck, *then* break. Propensity is defined by *if* left alone, *then* decay with probability X. If the 'then' never happens, isn't the magnitude of the propensity underdetermined by the physical history of that single case?"
  *   **Anticipated Reply:** She will argue the magnitude is fixed by the *type* of physical setup, not the specific history of the token event.
  *   **Why:** This retreats to a type-based view, which weakens the "single-case" claim.

  #### 9. Alternative Interpretations
  **Question:** "Many statisticians find that Bayesian subjective probability handles singular cases perfectly well without positing new physical properties. What explanatory power do you gain by reifying the probability as a physical propensity that a subjective Bayesian lacks?"
  *   **Anticipated Reply:** She will argue that Bayesians cannot explain *why* the world is stable enough for learning to occur, whereas propensities ground that stability.
  *   **Why:** This is the standard realist critique of instrumentalism.

  **Follow-up:** "But if the Bayesian updates on the same frequencies your propensities predict, and makes the same decisions, is the 'grounding' you propose anything more than a philosophical preference for realism?"
  *   **Anticipated Reply:** She will argue that science aims for truth about the world, not just successful betting, and propensities describe the world as it is.
  *   **Why:** Appeal to scientific realism.

  #### 10. Future Directions
  **Question:** "Given the difficulties with asymmetry and reference classes we've discussed, where do you see the most promising development for propensity theory? Is it in refining the metaphysics of dispositions, or in finding new physical applications beyond standard QM?"
  *   **Anticipated Reply:** She will likely point toward evolutionary biology or complex systems where single-case fitness propensities are discussed.
  *   **Why:** This is a growing area for propensity applications outside physics.

  **Follow-up:** "In biology, fitness is often defined by actual reproductive success. If you apply propensities there, do you face the same circularity problems with frequencies that we see in physics?"
  *   **Anticipated Reply:** She will argue that fitness is a cause of reproduction, not defined by it, mirroring her physics view.
  *   **Why:** Consistency across domains.

  ---

  ### Meta-Commentary & Fragility Analysis

  **1. Extrapolation Flags:**
  *   **Anticipated Replies:** The replies listed above are extrapolated from the "Propensity Tradition" (Popper, Giere, Humphreys, Miller) rather than specific recent papers by this specific guest. While she is a career defender of the view, she may have developed novel responses to Humphreys' Paradox (Q1) or the Reference Class problem (Q3) that deviate from the textbook Popperian line. Be prepared to pivot if she cites a specific recent paper that alters the standard defense.
  *   **The "Metaphysics" Deflection:** I have assumed she will use the "epistemology vs. metaphysics" distinction to deflect Q6. If she has moved toward a more naturalized metaphysics that embraces epistemic constraints, this question may need to be softened to avoid sounding like a strawman.

  **2. The "Long-Run" Drift Contingency:**
  *   **The Signal:** Watch closely during **Question 2 (Bridging)** and **Question 3 (Reference Class)**. If she defines the *magnitude* of the single-case propensity *as* the limiting frequency of a hypothetical infinite sequence of identical trials (rather than a primitive property that *causes* the frequency), she is effectively defending a **Long-Run Propensity** view (like Reichenbach's but modalized), not a Single-Case view.
  *   **The Signal Phrase:** If she says, "The propensity value *just is* the tendency to produce a long-run frequency," abandon the Single-Case line of questioning.
  *   **Question to Cut/Restructure:** If this drift occurs, **Question 2 (Bridging)** becomes redundant or misleading. The "bridge" is no longer a problem for her because she defines the propensity *via* the bridge.
      *   *Restructure:* Instead of asking "How do propensities produce frequencies?", ask "If the magnitude is defined by the hypothetical frequency, how is this distinct from Von Mises' frequentism other than the addition of a modal operator?"
      *   *Why:* The Single-Case view claims to explain frequencies via single-case properties. The Long-Run view defines single-case properties via frequencies. This is a fundamental metaphysical divergence. If she is the latter, Q1 (Asymmetry) and Q5 (Dispositions) also lose force, as long-run views handle asymmetry differently. However, Q2 is the most direct test of this definition.

  **3. Math Level Check:**
  *   All questions use conditional probability notation ($P(A|B)$) and concepts like "limiting frequency" or "0 vs 1" without invoking measure spaces, sigma-algebras, or integration. This fits the "statistically literate non-specialist" constraint.

  **4. Time Management:**
  *   With 45 minutes and 10 questions (plus follow-ups), you have roughly 4 minutes per question block. This is tight. If she is verbose, prioritize Q1 (Asymmetry), Q2 (Bridging), and Q4 (QM) as these are the technical pillars of her view. Q9 and Q10 can be dropped if time runs short.
