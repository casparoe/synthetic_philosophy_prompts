      *   Is it honest about limits? (Yes, Grace > Supererogation).
      *   Is it respectful of the user's bookkeeping background? (Yes, use that language).

  6.  *(Self-Correction during drafting)*: I initially thought about calling Valjean's sacrifice "duty." But for a normal person, saving Champmathieu is supererogatory. For Valjean, it's constitutive of his new self. I need to make that distinction clear. Also, need to be careful not to reduce Javert to a cartoon villain; his integrity is part of the tragedy.

