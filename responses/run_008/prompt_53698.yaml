  ### NOTES ON LOGICAL SPACE

  **Inseparable Leaves:**
  *   **Leaf 5 (Expertise) and Leaf 6 (Career):** These are logically distinct but rhetorically adjacent. Both advocate for elections and longevity. The tree separates them based on *what* skill is valued (policy knowledge vs. political navigation), but in a dinner scene, both characters will sound like they are defending "experienced politicians." To separate them, the Leaf 6 character must emphasize party loyalty and deal-making, while the Leaf 5 character emphasizes technical competence and briefings.

  **Unoccupied Branches:**
  *   **The "Reluctant Professional" (Node 1: Surgeon → Node 2: Liar):** This path suggests elections are necessary for skill, but campaigning is corrupt. This view is logically coherent (e.g., "We need experts, but hate how they get chosen"), but rarely defended in practice because it offers no mechanism for selection other than the one it condemns. It is unoccupied because it leads to paralysis.
  *   **The "Ambitious Lottery" (Node 1: Neighbor → Node 5: Willing):** This path suggests ordinary people should govern, but those who *want* to should be the ones picked. This is incoherent within the logic of sortition, as ambition is the specific vector lottery is designed to bypass. Any character here would effectively be arguing for elections while using lottery vocabulary.
  *   **The "Technocratic Staff" (Node 3: No → Node 5: Willing):** A view where members rotate strictly (to prevent corruption) but staff are empowered careerists (to ensure competence). This is the *de facto* reality of many systems but rarely an *advocated* position because it admits the members are figureheads. It is unoccupied because no one wants to argue publicly that the elected/selected members are irrelevant.
