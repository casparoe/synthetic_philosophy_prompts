      *   *Nuance:* Is it *merely* verbal? If it were merely verbal, they should be able to translate each other. Sider argues they *can't* (the variantist can't capture the "structure" claim). Deflationists argue the "structure" claim is empty.
      *   *Better Diagnosis:* It's a **clash of theoretical frameworks** masquerading as a dispute over the *same* question. It's not just "verbal" in the trivial sense (like "bank" of a river vs. financial "bank"). It's a **metasemantic stalemate**. The realists are doing *metaphysical* semantics (world-first), while deflationists are doing *linguistic/conceptual* semantics (language/mind-first). They agree on the first-order facts (there are particles arranged table-wise) but disagree on whether there is a *further fact* about which quantifier "carves at the joints."
      *   *Conclusion:* It is a substantive disagreement about *what metaphysics is supposed to do*, framed as a disagreement about *what exists*. The "What exists?" question is the locus of collision, but the underlying disagreement is about the legitimacy of "structure" as a theoretical primitive.

