answer: |-
  This is a sophisticated diagnosis of a stalemate that many have sensed but few have articulated with this level of precision. You are correct that rehashing the arguments is useless; the arguments are not waiting for better articulation, they are waiting for a premise that neither side is willing to grant.

  Here is a diagnosis of the disagreement type, an evaluation of your hypothesis, and a candid assessment of what constitutes progress.

  ### 1. Diagnosis: A Clash of Normative Axioms, Not Derivations

  The disagreement is **substantive**, not verbal, but it is **foundational** rather than derivational. It is not that the two sides disagree on the implications of a shared set of premises; they disagree on the axioms regarding the source of normative authority.

  Your hypothesis—that the fork lies between *discovery* (realism) and *constitution* (constructivism/subjectivism) regarding values—is accurate, but it can be sharpened. The specific axis of disagreement is **the normative status of computational stability.**

  *   **The Idealization Axiom:** If an agent's preferences stabilize under increased information, compute time, and coherence, that stable point is *authoritative* over the current preferences. (Normativity flows from the *attractor*.)
  *   **The Skeptic Axiom:** Normative authority is indexed to the *actual* causal history of the agent. If the path to the stable point involves changing the agent's utility function (via "coherence laundering"), the resulting preferences belong to a *successor agent*, not the original. (Normativity flows from the *source*.)

  This is a **Metaethical Impasse masquerading as an Engineering Specification.**

  CEV was introduced as a solution to the Alignment Problem (an engineering control problem). However, to justify *why* the AI should obey the CEV rather than the Current Volition, proponents implicitly rely on a metaethical claim: that the CEV is "more you" than the current you. The skeptics deny this metaethical claim.

  Because the metaethical claim cannot be proven without begging the question (you must already accept that idealization confers authority to believe that idealization confers authority), the debate cannot move via argumentation. It is a clash of intuitions about personal identity and the nature of "ought."

  ### 2. The "Coherence Laundering" Charge is the Pivot

  You mentioned the "coherence laundering" objection. This is the strongest point of leverage in the stalemate.

  The idealization-friendly camp treats "coherence" (consistency, transitivity, lack of cognitive bias) as a **neutral filter**. They assume that removing noise reveals the signal.
  The skeptics treat "coherence" as a **value judgment**. They argue that human values are inherently messy, context-dependent, and sometimes contradictory. Forcing them into a coherent utility function isn't "cleaning" them; it's *replacing* them with a different value system (one that prizes consistency over, say, poetic ambiguity or context-sensitive exceptions).

  If the skeptics are right, CEV is not "what we would want if we knew more." It is "what a different agent, who values coherence more than we do, would want."

  This turns the disagreement into a question of **Value Preservation vs. Value Improvement.**
  *   **Side A** believes our current values are broken and need improvement (via idealization) to be valid.
  *   **Side B** believes our current values are the only ones that matter, and "improvement" is just euphemism for "replacement."

  ### 3. Is it Two Different Questions?

  You asked if this is an engineering question and a metaethical question sharing one heading. **Yes.** This is the primary source of the stall.

  *   **The Engineering Question:** "What target function can we specify such that the resulting AI is safe, stable, and acceptable to humans?"
  *   **The Metaethical Question:** "Which preferences have the right to govern the future?"

  CEV attempted to answer the Engineering Question by solving the Metaethical Question. It assumed that if we solved "What are our true preferences?", the engineering problem would dissolve.

  The stall occurred because the Metaethical Question is likely unsolvable (or at least undecidable between the two camps), while the Engineering Question is urgent. The skeptics are blocking the Engineering solution because the Metaethical justification is weak. The proponents are frustrated because the Engineering need is critical.

  ### 4. What Counts as Progress?

  Given this diagnosis, here is the honest answer about progress.

  **A. Conceptual Distinction (High Value)**
  Progress requires explicitly **decoupling** the metaethical justification from the engineering specification.
  *   *Old Frame:* "We must build CEV because it is what we *truly* want."
  *   *New Frame:* "We may not know what we truly want, but Current Volition is unsafe (due to bias/short-termism), and CEV is a *heuristic* for a safe target that preserves enough continuity to be acceptable."
  *   *Why this helps:* It lowers the stakes. You don't need to prove CEV is "Authoritative Truth." You only need to prove it is "Less Dangerous than the Alternative." This moves the debate from metaethics to risk assessment.

  **B. Formal Results (Low Value)**
  More theorems on preference aggregation or extrapolation are unlikely to help. We already know about Arrow's Impossibility Theorem and the fragility of utility functions. The problem isn't mathematical; it's philosophical. A formal proof that "idealization changes identity" would just be accepted by Side B and rejected by Side A as irrelevant to normativity.

  **C. Decision-Theoretic Shifts (Highest Value)**
  The field has actually made progress by **abandoning the CEV frame** in favor of **Corrigibility and Uncertainty.**
  *   **Inverse Reinforcement Learning (IRL):** Modern alignment research often focuses on inferring rewards from behavior without assuming the human is rational or that there is a single "true" reward. It accepts ambiguity.
  *   **Corrigibility:** Instead of trying to lock in "what we really want," the goal is to build an AI that *allows itself to be corrected* as we figure out what we want.
  *   **Why this counts:** It sidesteps the "Discovery vs. Constitution" fork. If the AI remains uncertain and corrigible, it doesn't matter if reflection discovers or constitutes values; the AI stays under human control while the humans decide.

  **D. Nothing At All (Regarding the Original Question)**
  If you strictly mean progress on the question *"Is CEV the normatively authoritative volition?"*, the answer is **nothing.** That is a hard philosophical deadlock. Unless there is a breakthrough in metaethics that convinces subjectivists that idealization confers authority (or vice versa), that specific thread is dead.

  ### Summary

  The stall is real because CEV tried to solve a control problem by invoking a contested theory of personal identity and normative realism.

  **Progress looks like:**
  1.  Admitting the metaethical question is undecidable.
  2.  Reframing CEV not as "The Truth" but as "A Safety Heuristic."
  3.  Shifting technical focus from **Extrapolation** (guessing the future ideal self) to **Uncertainty** (acknowledging we don't know the true self) and **Corrigibility** (letting the current self decide later).

  The debate ran aground because it treated a **policy decision** (who should the AI listen to: current us or idealized us?) as a **truth claim** (who *really* are we?). Progress comes from treating it as a policy decision subject to risk constraints, not a metaphysical discovery.
