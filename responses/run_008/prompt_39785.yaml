prompt: |-
  So this has suddenly become my problem: six weeks into being seconded to a national law commission's criminal law working group, and our first live item is whether to reccommend decriminalising incest between consenting adults in the narrow situation of a test case now before us: two people who met in their thirties, found out through donor records they're half-siblings, brought up in seperate households, one of them infertile, both adults, both say it's fully consensual — and one of them is facing prosecution, since under our law the offence applies regardless of fertility or upbringing. The group is split between 'some things the law just has to express, no further argument needed' and 'no victim, no crime', and neither side is arguing very well.

  I need you to draft the recommendation memo I'll circulate before our next meeting. Take the role of a philosopher of law who knows the Hart–Devlin debate inside out — the Wolfenden recommendation, Devlin on enforcing shared morality, Hart's reply — but think it through carefully before writing, don't just recite the debate at me. The memo needs: a concrete bottom line the commission could act on (keep the offence, narrow it, or drop it, with whatever conditions), the reasoning, and a genuinely fair treatment of the strongest point on the losing side — I want the Devlinian position steel-manned, not caricatured as 'the majority finds it icky', though you should tell me if that's ultimately all it amounts to. Then a short section saying where my commission should draw the line between law expressing morality and law protecting people, so we have a principle for the next case, not just a verdict on this one.

  Finally, and this part matters to me: end by saying what would change your mind — what evidence about cases like this one, or what argument, would point you to a different recommendation, and where in your own reasoning you think you're most likely to have gone wrong. Please don't pad it out with reading lists or citations; we can dig up references ourselves, I just need the argument done properly.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of Law (expert in Hart-Devlin, Wolfenden, legal moralism vs. liberalism).
      *   **Task:** Draft a recommendation memo for a National Law Commission's Criminal Law Working Group.
      *   **Scenario:** A specific test case involving consenting adult half-siblings (met in 30s, separate households, one infertile, prosecution ongoing).
      *   **Current State:** Group is split between "law must express morality" (Devlin-esque) and "no victim, no crime" (Hart/Mill-esque). Neither side is arguing well.
      *   **Requirements:**
          1.  Concrete bottom line (Keep, Narrow, or Drop).
          2.  Reasoning based on deep engagement with Hart-Devlin (not just recitation).
          3.  Steel-manned treatment of the losing side (specifically the Devlinian position).
          4.  A guiding principle for future cases (Law expressing morality vs. Law protecting people).
          5.  Reflexive conclusion: What would change my mind? Where might I be wrong?
          6.  Constraint: No padding, reading lists, or excessive citations.

  2.  **Determine the Stance/Recommendation:**
      *   *Option A (Keep Offence):* Hard to justify under liberal principles given the specific facts (separate upbringing, no coercion, infertility removes genetic risk). Risks looking purely moralistic without harm.
      *   *Option B (Drop Offence entirely):* Too radical for a commission likely bound by social stability concerns. Ignores the specific harms of familial power dynamics even in adulthood.
      *   *Option C (Narrow the Offence):* This is the sweet spot. It respects the liberal harm principle while acknowledging the specific societal interest in family integrity. It allows for a recommendation to amend the statute to include exemptions for this specific scenario (adults, separate upbringing, no genetic risk/coercion).
      *   *Decision:* Recommend *narrowing* the offence. This provides a concrete action, balances the theories, and addresses the specific test case without blowing up the whole legal framework regarding incest.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** State the recommendation clearly immediately.
      *   **Context:** Briefly acknowledge the test case and the theoretical impasse.
      *   **The Core Argument (Hart vs. Devlin applied):**
          *   Need to move beyond "No Victim" vs. "It's Wrong."
          *   Hart's view: Law shouldn't punish immorality *per se*. Needs harm.
          *   Devlin's view: Society has a right to protect its moral fabric because disintegration leads to harm.
          *   Application: In this specific case, the "harm" is minimal (infertile, separate upbringing). The "moral fabric" argument is weak here because the family unit wasn't violated in the traditional sense (no grooming, no dependency).
      *   **Steel-manning the Devlinian Position:**
          *   Avoid "icky." Focus on the *institution* of the family.
          *   Argument: Incest laws aren't just about genetics; they're about maintaining clear boundaries within the fundamental unit of society. Blurring these lines, even in edge cases, risks normalizing dynamics that are usually harmful. The law acts as a bright-line rule to prevent slippage.
          *   Why it loses *here*: A bright-line rule that catches clearly harmless conduct loses legitimacy. Legitimacy is required for the law to function.
      *   **The Guiding Principle:**
          *   Distinguish between *malum in se* (wrong in itself due to harm) and *malum prohibitum* (wrong because prohibited for social order).
          *   Principle: The criminal law may enforce morality *only* when that morality is constitutive of a social institution that prevents tangible harm (like the family structure protecting children). When the institutional harm is absent (separate upbringing, adulthood), the moral prohibition loses its legal warrant.
      *   **Reflexive Conclusion (Intellectual Honesty):**
          *   What changes my mind? Evidence that "genetic sexual attraction" (GSA) is inherently coercive due to psychological wiring, even in adults. Or evidence that narrowing the law leads to increased abuse in grey areas.
          *   Where might I be wrong? Underestimating the expressive function of law. Maybe the law *teaches* rather than just punishes.

  4.  **Refining the Tone:**
      *   Needs to be professional, authoritative, yet philosophical.
      *   Avoid academic jargon where possible, but use the concepts precisely.
      *   Ensure the "Steel-man" section feels respectful, not dismissive.
      *   Ensure the "What would change my mind" section feels genuine, not perfunctory.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I just recite Hart-Devlin? *Correction:* Ensure I apply it to the *infertility* and *separate upbringing* facts. That's the crux.
      *   *Check:* Is the Devlin section strong enough? *Correction:* Focus on the "disintegration thesis." It's not about disgust; it's about social cohesion.
      *   *Check:* Is the recommendation actionable? *Correction:* Specify the statutory amendments (exemptions).
      *   *Check:* Did I answer the "What changes your mind" prompt? *Correction:* Make sure it targets the *reasoning*, not just new facts.

  6.  **Final Polish:** Check word count and flow. Ensure the distinction between "law expressing morality" and "law protecting people" is clear in the principle section. (The prompt asks for a short section on where to draw the line).

      *(Self-Correction on the "Losing Side"):* If I recommend narrowing the law, the "Losing Side" is the strict Devlinian view (Keep the offence). I need to make sure their argument is presented as the strongest possible version before explaining why it doesn't apply *in this specific instance*.

      *(Refining the Principle):* The line should be drawn at *institutional integrity vs. private conduct*. Law protects the institution of the family; it does not police private sexual conduct that does not threaten that institution's core function (care/protection of dependents).

      *(Refining the "Change Mind" section):* Be specific. If sociological data shows that exceptions erode the taboo leading to harm elsewhere, that undermines the Harm Principle calculation.

  7.  **Final Output Generation** (Proceeding to draft based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Criminal Law Working Group, National Law Commission
  **FROM:** [Your Name], Seconded Legal Consultant
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Statutory Interpretation and Reform of Incest Offences (Ref: Test Case 44-B)

  ### 1. Executive Summary and Recommendation

  The Commission is currently deadlocked between a liberal "harm principle" approach and a legal moralist "social cohesion" approach regarding the prosecution of consenting adult half-siblings who met post-puberty.

  **Recommendation:** I recommend the Commission propose a **statutory narrowing** of the incest offence. Specifically, we should recommend an affirmative defence or statutory exemption for cases where: (a) both parties are over 18; (b) they were not raised in the same household; and (c) conception is biologically impossible (due to infertility, same-sex pairing, or sterilization).

  We should not recommend repealing the offence entirely, nor should we recommend proceeding with the prosecution in the current test case under the existing blanket prohibition.

  ### 2. Reasoning: Beyond the Hart–Devlin Impasse

  The current debate in the Working Group mirrors the 1950s clash between Lord Devlin and H.L.A. Hart. One side argues that without a specific victim, the state has no warrant to intervene (Hart/Mill). The other argues that the law must enforce shared morality to prevent social disintegration (Devlin). Both positions, as currently argued here, are too abstract.

  **The Liberal Position (Hart):**
  Hart's critique of the Wolfenden Report's implementation was not that morality is irrelevant, but that *immorality itself* is not a sufficient condition for criminalization. There must be harm. In this specific test case, the traditional harms associated with incest are absent. There is no risk of genetic defect (infertility), no abuse of dependency (separate upbringing), and no coercion (adults meeting as strangers). To prosecute here is to punish status rather than conduct that causes detriment. If the criminal law is to command respect, it must appear rational to the citizenry. Punishing conduct that is, by all empirical measures, harmless in this specific context, renders the law arbitrary.

  **The Legal Moralist Position (Devlin) – Steel-Manned:**
  The strongest argument against my recommendation is not that the public finds this conduct "disgusting." Disgust is ephemeral. The robust Devlinian argument is that the family unit is the foundational structure of society, and the taboo against incest is the load-bearing wall of that structure.

  From this view, the law is not merely punishing a specific act; it is maintaining a bright-line boundary that preserves the clarity of familial roles. Even if *this* couple causes no harm, creating a legal exception blurs the line. It signals that the taboo is negotiable based on fertility or upbringing history. Devlin would argue that society has a right to protect its moral environment just as it protects its physical environment. If the law retreats from this boundary, it risks a "slippery slope" where the sanctity of the family structure is eroded, potentially leading to increased ambiguity in cases involving power dynamics that are harder to police (e.g., subtle coercion within shared households). The law acts as a normative teacher; weakening the lesson weakens the protection.

  **Why the Moralist Position Fails Here:**
  While the Devlinian concern for institutional integrity is valid, it fails in this specific instance because the *institution* of the family was never functionally present between these two parties. They were strangers who discovered a biological link. Prosecuting them does not protect the family unit; it protects a biological technicality. Furthermore, Devlin's "disintegration thesis" relies on the idea that moral shifts lead to social collapse. There is no evidence that granting a narrow exemption for adult, separate-household, infertile siblings threatens the stability of the family unit for the vast majority. To insist on the blanket prohibition here sacrifices individual liberty without securing the social good the prohibition is meant to ensure.

  ### 3. Guiding Principle: Expressing Morality vs. Protecting People

  To resolve future cases, the Commission should adopt the following demarcation principle:

  **The Criminal law may enforce morality only when that morality is constitutive of a social institution that prevents tangible harm.**

  *   **Law Protecting People:** When conduct involves coercion, dependency, or tangible risk of harm (genetic or psychological), the state intervenes to protect the vulnerable. This is the core of the incest prohibition (protecting children and dependents within a household).
  *   **Law Expressing Morality:** The law may express moral boundaries *only* when those boundaries are necessary to maintain the integrity of the protective institution.

  In this test case, the "protective institution" (the family household) did not exist between the parties. Therefore, the moral expression loses its protective warrant. We draw the line at the point where the *function* of the family (care, upbringing, dependency) ceases to be relevant. Where the relationship is purely biological between autonomous adults, the liberal harm principle takes precedence over the moralist institutional argument.

  ### 4. Reflexive Conclusion: Uncertainty and Falsifiability

  I hold this recommendation provisionally. There are two specific developments that would change my mind and lead me to support maintaining the blanket offence:

  1.  **Evidence of Inherent Coercion:** If sociological or psychological evidence emerged demonstrating that "Genetic Sexual Attraction" between adult relatives creates an inherent psychological power imbalance that renders consent functionally impossible, even in separate households, my reliance on the "consenting adults" premise would collapse. If the biological link itself creates a vulnerability akin to dependency, the Harm Principle would justify intervention.
  2.  **Erosion of the Norm:** If data from jurisdictions that have narrowed incest laws showed a correlating increase in abuse cases within *shared* households (due to the normalization of the behaviour blurring the lines for predators), the Devlinian "slippery slope" argument would become empirical rather than theoretical.

  **Where I May Be Wrong:**
  My reasoning relies heavily on the distinction between "biological link" and "familial relationship." I may be underestimating the **expressive function of law**. It is possible that the law's value lies not in preventing harm in every individual case, but in stating a universal truth about human relations that transcends individual circumstances. If the law is primarily a teacher rather than a shield, then making exceptions for "harmless" cases might undermine the lesson. I am betting that the law's legitimacy depends on its rationality regarding harm; I may be wrong, and it may depend more on its consistency regarding taboo.

  I recommend we proceed with the narrowing proposal, but commission a review of comparative data from jurisdictions with similar exemptions to monitor the "erosion" risk.
