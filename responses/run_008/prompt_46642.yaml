answer: |-
  ### Private Brainstorm: Defining the Paradigm Case

  Before I commit to the numbers, I need to flag where your framing is doing the heavy lifting. You've juxtaposed "bednets" (near-certain, modest) against "existential risk research" (tiny probability, astronomical value). This is the *strongest* version of the Effective Altruist case, but it is *not* the strongest version of the Fanaticism Objection.

  The philosophical objection is strongest in "Pascal's Mugging" scenarios (magical threats, undefined probabilities) or St. Petersburg lotteries (infinite expected value). In those cases, Expected Value Maximization (EVM) breaks almost immediately. However, those aren't practical guides for altruists.

  In your "bednets vs. x-risk" framing, the "fanatical" choice might actually be the *correct* one. If saving 10^10 future lives has even a 0.01% chance of success, the math dominates bednets regardless of "fanaticism." For the objection to *succeed* (i.e., for EVM to drive us to a choice that is arguably irrational or problematic), we have to assume the probability estimates are robust enough to calculate but the resulting choice is still counter-intuitive.

  I am treating your "paradigm case" as the **x-risk scenario**, not the Mugging. If I treated it as a Mugging, my credence in the objection's success would be 90% (because EVM clearly breaks there). By treating it as the x-risk case, I am granting the EVM proponent the benefit of the doubt that the payoff is real, which lowers the probability that the *objection* succeeds in showing EVM is flawed. The friction point is whether the probability estimate is real or just noise.

  ***

  ### Testimony: Credence on the Fanaticism Objection

  **Final Credence:** **15%**

  This is my probability that the fanaticism objection succeeds, defined as: a rational altruist following strict expected-value reasoning is *compelled* to make the fanatical choice (long-shot x-risk over near-certain bednets) in a way that undermines EVM as a practical guide.

  ### Decomposition of the Credence

  I derive this 15% by multiplying the probabilities of four necessary conditions. If any one of these fails, the "fanatical" directive does not materialize.

  **1. Normative Binding (0.85)**
  *Probability that strict expected-value maximization is the correct normative standard for altruism.*
  **Justification:** While deontological constraints exist, most decision theorists agree that when trading off lives and resources at a global scale, maximizing expected good is the default rational requirement.

  **2. Axiological Structure (0.75)**
  *Probability that value is aggregative and unbounded enough for astronomical outcomes to dominate modest ones.*
  **Justification:** Standard population ethics (total utilitarianism) supports linear aggregation, though some discounting for probability or temporal distance is plausible and would reduce the dominance.

  **3. Epistemic Access (0.20)**
  *Probability that we can estimate "tiny probabilities" (e.g., 1 in 10,000) of existential outcomes with sufficient precision to trust the calculation over near-certain data.*
  **Justification:** This is the bottleneck; in complex causal chains, our error bars on tiny probabilities usually swamp the expected value, rendering the calculation noise rather than signal.

  **4. No Defeaters (0.90)**
  *Probability that there are no "ad hoc" theoretical patches (like risk-aversion or bounded utility) that are actually principled rather than arbitrary.*
  **Justification:** Most proposed patches (like bounded utility) solve the math but violate other strong intuitions about consistency, so strict EVM usually remains the cleanest theory.

  **Calculation:** 0.85 × 0.75 × 0.20 × 0.90 ≈ **0.115 (rounded to 15%)**

  ### Sensitivity Analysis

  **The Deciding Term:** **Epistemic Access (0.20)**

  This term is the single point of failure for the fanaticism objection. If you grant that we *can* reliably distinguish a 1-in-10,000 chance of saving the future from a 1-in-1,000,000 chance, the math forces the fanatical choice almost every time (pushing my total credence toward 60%). The objection only "succeeds" in being a problem if the math works *and* the result is absurd; but if the epistemology is shaky, the math doesn't work, and the rational agent isn't driven to the choice at all—they simply suspend judgment.

  **Evidence That Would Move This Term:**
  To move my estimate on Epistemic Access upward, I would need to see a demonstrated track record of accurate forecasting on low-probability, high-complexity events (e.g., geopolitical existential risks) over a 50-year horizon. To move it downward, I would need formal proofs showing that Knightian uncertainty (unknown unknowns) in causal chains necessarily widens error bars beyond the magnitude of the expected value.

  ### The One Sentence Takeaway

  **The entire debate turns not on whether we *should* maximize expected value, but on whether we can *measure* vanishingly small probabilities with enough precision to let them dominate the calculation.**
