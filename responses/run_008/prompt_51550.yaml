  Here is the breakdown of your friend's "vibe algorithm," the truth about Win-Stay-Lose-Shift, and how you can actually win a bet later.

  ### 1. What rule is she actually running?
  Based on her track record, she is intuitively applying **Axelrod's Three Principles of Success**, with a heavy emphasis on **Noise Tolerance**.

  *   **Nice:** Never defect first. (Eliminates *Always Defect*).
  *   **Retaliatory:** Punish defection to avoid being a sucker. (Eliminates *Always Cooperate*).
  *   **Forgiving:** Return to cooperation after punishment to restore mutual benefit. (Eliminates *Grim Trigger*).

  She likes **Tit-for-Tat (TFT)** because it hits all three. She likes **Generous Tit-for-Tat (GTFT)** even more (or equally) because it adds explicit **Noise Tolerance**. In real-world simulations, standard TFT gets stuck in endless revenge loops if a single "mistake" (noise) happens. GTFT fixes this by occasionally forgiving a defection. She hates **Grim Trigger** because it fails the "Forgiving" test catastrophically in noisy environments.

  **The Alternative Rule (The Trap):**
  There is a second rule that fits her history perfectly: **"Action Reciprocity."**
  *   TFT, GTFT, and Grim Trigger all mirror the opponent's *action* (You did C, I do C; You did D, I do D).
  *   **Win-Stay-Lose-Shift (WSLS)** does *not* mirror actions. It mirrors **payoffs**. (Did I get a good score? I keep doing what I did. Did I get a bad score? I switch).
  *   If her vibe is strictly about "fairness" (matching actions), she might dislike WSLS. If her vibe is about "success" (matching payoffs), she will like it. Given she likes GTFT (which is about success/stability), she's likely a "Success" voter.

  ### 2. Real Prediction for Win-Stay-Lose-Shift (WSLS)
  **Verdict:** **Does Well.**
  **Her Call:** She will almost certainly say **"Does Well."**

  **Reasoning:**
  WSLS (also known as **Pavlov**) is arguably *better* than TFT in long repeated play, especially when there is any chance of error (noise).
  *   **It corrects mistakes:** If TFT makes a mistake against another TFT, they alternate Defect/Cooperate forever (C-D, D-C, C-D). WSLS detects the low payoff and switches until they lock back into Mutual Cooperation (C-C).
  *   **It exploits suckers:** Unlike TFT, which cooperates forever with *Always Cooperate*, WSLS will eventually test and exploit naive strategies (though it cooperates with ALLC initially, it can shift if the payoff matrix allows).
  *   **It fits her rules:** It is Nice (starts with Cooperate), Retaliatory (switches to Defect if suckered), and Forgiving (switches to Cooperate after mutual punishment).

  **Betting Advice:** **Do not bet against her on this one.** If you bet "Does Bad" and she bets "Does Well," she wins the bet, and reality proves her right. You will look like you didn't do the reading. Agree with her, nod sagely, and say, *"Yeah, Pavlovian strategies usually dominate in evolutionary tournaments because they fix the noise problem."*

  ### 3. The Strategy That Splits the Rules (Your Winning Move)
  To actually win a bet, you need a strategy where "Forgiveness" and "Exploitability" fight each other. You want to propose **Tit-for-Two-Tats (TF2T)**.

  **The Strategy:** Cooperate on the first two turns. Thereafter, only defect if the opponent defected on the **previous two** turns. (It forgives a single defection completely).

  **Why this splits the candidate rules:**
  *   **Rule A (Max Forgiveness):** "If GTFT is good because it forgives, TF2T is better because it forgives *more*." -> **Prediction: Does Well.**
