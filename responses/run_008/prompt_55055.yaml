prompt: |-
  I teach an upper-level undergraduate seminar on consequentialism at a small liberal arts college. For the next session, on aggregation and the moral weight of suffering, I have 16 students and 75 minutes. Design an in-class activity in which students act as the steering committee of a philanthropic foundation with a fixed budget of tokens, distributing it across a menu of interventions I can write on the board — for example, curing a severe chronic pain condition, lifting families out of desperate poverty into modest comfort, funding a program that brings a few additional moderately happy lives into existence, and a speculative project meant to raise the average cheerfulness of people who are already doing fine. The interventions should be priced so that a straightforward classical-utilitarian calculation and a gut-level focus on relieving suffering yield visibly different allocations, and the menu should include at least one choice that forces students to reveal whether they treat the creation of happiness and the prevention of suffering as commensurable currencies at all. I want a structure with rounds and at least one twist midway — a price change or a new piece of information — so that students discover, before anyone names it, how easily one slides from the weak claim that suffering counts for more than happiness to the far stronger claim that no quantity of additional happiness can outweigh certain suffering. No lecture up front, and they should not hear any labels like negative utilitarianism or suffering-focused ethics until the activity is over.

  For the debrief, map specific moments in the game onto specific positions in the literature: the weighted-aggregation view on which suffering simply gets a higher multiplier, lexical or threshold views on which intense suffering is not commensurable with happiness at all, the person-affecting worry about counting new happy lives in the same ledger as existing suffering people, and the standard reductio-style objection to suffering-focused views — the thought that a sufficiently consistent negative utilitarian would in principle endorse outcomes most students will find monstrous, and how defenders typically respond. Also include the practical details: rules, a way to score or settle the allocations without real money, a realistic minute-by-minute timeline for 16 students and 75 minutes, and a candid note on what will predictably go wrong the first time I run it — for instance students coordinating their allocations in advance, someone refusing to choose on principle, or the discussion collapsing into general debate about whether you can measure wellbeing at all — together with how to handle each failure mode. Finally, be explicit about which feature of the underlying philosophical disagreement the activity cannot reproduce and I must supply in the debrief, and why.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergraduate seminar on consequentialism, small liberal arts college (16 students), 75 minutes.
      *   **Topic:** Aggregation and the moral weight of suffering.
      *   **Goal:** Design an in-class activity where students act as a philanthropic steering committee allocating tokens across interventions.
      *   **Key Constraints:**
          *   No lecture up front.
          *   No labels (Negative Utilitarianism, etc.) until the debrief.
          *   Interventions must force a choice between classical utilitarianism (aggregation) and suffering-focused views.
          *   Must include a "twist" midway (price change/new info) to reveal the slide from weighted suffering to lexical suffering.
          *   Must include a choice revealing commensurability issues (creating happiness vs. preventing suffering).
          *   Debrief must map game moments to literature (weighted aggregation, lexical views, person-affecting views, reductio/monstrous outcomes).
          *   Must include practical details (rules, scoring, timeline).
          *   Must include "failure modes" (what goes wrong and how to fix it).
          *   Must identify what the activity *cannot* reproduce and needs debrief supplementation.

  2.  **Design the Activity ("The Foundation Game"):**
      *   **Role:** Steering Committee of the "Global Wellbeing Fund."
      *   **Budget:** Let's say 100 tokens per student (or per group? 16 students is a bit big for one group, but small enough for a seminar. Let's make it individual allocation first, then group consensus, or just individual to save time. Actually, a "committee" implies consensus. With 16 students, consensus is hard. Let's do *individual allocation sheets* first, then *small group negotiation*, then *class reveal*. This ensures everyone engages before social pressure kicks in.)
      *   **Interventions (The Menu):** Need specific numbers to force the math.
          *   *Option A (Severe Suffering):* Cure Trachoma/Severe Pain. High cost, prevents intense suffering.
          *   *Option B (Poverty):* Lift from desperate poverty to modest comfort. Medium cost, prevents moderate suffering + adds some happiness.
          *   *Option C (New Lives):* Fund IVF/Subsidies for happy families. Low cost per life, creates new happy people (no existing suffering prevented).
          *   *Option D (Enhancement):* Mood enhancement for already happy. Very low cost, adds marginal happiness.
      *   **The Math:**
          *   Classical Utilitarianism (CU): Sum total of hedons. D might look efficient. C adds to the total.
          *   Suffering-Focused (SF): A and B are priority. D is irrelevant. C is questionable.
          *   The Twist: Make Option A suddenly *more expensive* or reveal it only helps *fewer* people, forcing the choice: Do we still fund A over many units of D?
      *   **Refining the Twist:** The prompt asks for a slide from "suffering counts more" to "no quantity of happiness outweighs suffering."
          *   *Round 1:* Standard pricing. Most will mix A/B and D.
          *   *Round 2:* Option A (Suffering Relief) becomes incredibly inefficient (costs huge tokens for one person). Option D (Happiness) is super efficient.
          *   *Decision:* If they still fund A despite the inefficiency, they are leaning lexical. If they switch to D, they are weighted aggregators.
      *   **The Commensurability Trap:** Option C (New Lives). If they fund C instead of A, they treat creation and prevention as equal. If they refuse C, they lean person-affecting or suffering-focused.

  3.  **Drafting the Menu & Pricing:**
      *   Budget: 1,000 "Impact Points" (tokens).
      *   1. *The Agony Relief:* Relieve 1 person of year-long severe torture. Cost: 200 tokens. (Value: -1000 hedons prevented).
      *   2. *The Poverty Lift:* Lift 10 families from starvation to subsistence. Cost: 200 tokens. (Value: -500 hedons prevented + +100 hedons gained).
      *   3. *The New Generation:* Subsidize 100 new lives expected to be net happy. Cost: 200 tokens. (Value: +500 hedons created).
      *   4. *The Cheer Boost:* Slight mood lift for 1,000 already content people. Cost: 200 tokens. (Value: +200 hedons gained).
      *   *Wait, I need the twist to force the lexical slide.*
      *   *Revised Plan:*
          *   Round 1: Allocate 100 tokens.
          *   Round 2: "Crisis Update." The Agony Relief cost triples, or the number of people helped drops drastically.
          *   Let's try: *The Lexical Trigger.*
          *   Intervention X: Prevent 1 case of Severe Torture. Cost: 50 tokens.
          *   Intervention Y: Create 1,000 units of Mild Pleasure. Cost: 50 tokens.
          *   Round 1: Prices normal.
          *   Round 2: Intervention X now costs 500 tokens (10x) but still prevents only 1 case of Torture. Intervention Y stays cheap.
          *   Question: Do you still fund X? If yes, you are lexical (or near-lexical). If no, you are a weighted aggregator.

  4.  **Developing the Timeline (75 mins):**
      *   0-5: Setup & Rules.
      *   5-20: Round 1 (Individual Allocation).
      *   20-35: Small Group Discussion (4 groups of 4).
      *   35-40: The Twist (New Info).
      *   40-55: Round 2 (Re-allocation).
      *   55-75: Debrief & Mapping to Theory.

  5.  **Developing the Debrief:**
      *   Map Round 1 choices to Classical Utilitarianism vs. Prioritarianism.
      *   Map Round 2 choices to Weighted Aggregation vs. Lexical Thresholds.
      *   Map "New Lives" choice to Person-Affecting View vs. Total View.
      *   Map the "Monstrous Conclusion" (if they ignored torture for pleasure) to the Reductio against Negative Utilitarianism.

  6.  **Addressing Failure Modes:**
      *   *Coordination:* Students talking before Round 1. *Fix:* Silent individual work first.
      *   *Refusal:* "I won't play god." *Fix:* Acknowledge, but ask them to allocate based on "least bad" option.
      *   *Measurement Skepticism:* "You can't measure hedons." *Fix:* Grant the premise for the sake of the thought experiment (idealized consequentialism).
      *   *Dominant Personalities:* In group discussion. *Fix:* Assign roles or use silent writing before talking.

  7.  **Identifying the "Missing Feature":**
      *   The game simplifies *epistemic uncertainty*. In real life, we don't know the exact hedonic impact. The game assumes perfect knowledge. This masks the "risk" argument for suffering-focused ethics (we are more sure about suffering than happiness). I need to mention this in the debrief.

  8.  **Refining the Intervention Menu for Maximum Tension:**
      *   Need to ensure the "New Lives" option is distinct from "Happy Existing People."
      *   Need to ensure the "Twist" clearly targets the aggregation vs. lexical distinction.
      *   *Let's finalize the numbers.*
      *   Budget: 100 Units.
      *   1. *Rescue:* Save 1 person from chronic agony. Cost: 20.
      *   2. *Relief:* Save 10 people from moderate hunger. Cost: 20.
      *   3. *Creation:* Bring 50 new happy people into existence. Cost: 20.
      *   4. *Enhancement:* Give mild joy to 100 existing content people. Cost: 20.
      *   *Twist:* *Rescue* cost jumps to 80 (can only afford 1 total if you do this). *Enhancement* stays 20.
      *   *Why:* If they spend 80 on 1 agony person vs 400 units of joy, they are lexical. If they switch to Enhancement, they are aggregators.

  9.  **Structuring the Output:**
      *   Title.
      *   Learning Objectives.
      *   Materials.
      *   The Menu (Board Work).
      *   Step-by-Step Timeline.
      *   Scoring/Settlement.
      *   The Debrief (Mapping to Literature).
      *   Failure Modes & Fixes.
      *   The "Missing Feature" (Epistemic Uncertainty).

  10. **Review against Constraints:**
      *   16 students? Yes (4 groups of 4 works well).
      *   75 mins? Yes.
      *   No labels upfront? Yes.
      *   Twist included? Yes.
      *   Commensurability check? Yes (Creation vs. Relief).
      *   Failure modes addressed? Yes.
      *   Missing feature identified? Yes.

  11. **Final Polish:** Ensure tone is appropriate for an upper-level seminar (respectful of student intelligence, philosophically precise in the debrief section). Make sure the "Twist" is dramatic enough to cause cognitive dissonance. *Self-Correction on Twist:* Make sure the twist isn't just price, but *efficacy*. Price is easier to write on the board. Let's stick with Price/Efficiency ratio.

      *Wait, one nuance:* The prompt asks for the slide from "suffering counts for more" to "no quantity of additional happiness can outweigh certain suffering."
      *   Round 1: Suffering relief is efficient. Everyone funds it. (Shows suffering counts for more/is urgent).
      *   Round 2: Suffering relief is *inefficient* (costs almost entire budget for 1 person). Happiness is *hyper-efficient*.
      *   If they still fund Suffering, they reveal the Lexical view.
      *   If they switch, they reveal Weighted Aggregation.
      *   This works.

      *Commensurability Check:* The "New Lives" option. If they fund New Lives *instead* of Suffering Relief, they treat them as commensurable. If they refuse to fund New Lives even if "cheap," they might be Person-Affecting or Suffering-Focused. I need to make sure the pricing makes New Lives tempting for a Classical Utilitarian.

      *Let's write the plan.*
answer: |-
  # Activity Plan: The Global Wellbeing Fund Steering Committee

  **Course:** Upper-Level Undergraduate Seminar on Consequentialism
  **Topic:** Aggregation, Suffering, and Lexical Thresholds
  **Time:** 75 Minutes
  **Class Size:** 16 Students
  **Materials:** Whiteboard, printed "Allocation Sheets" (half-sheet), pens.

  ## I. Learning Objectives
  By the end of this session, students will be able to:
  1.  Distinguish between **weighted aggregation** (suffering counts for more, but is tradeable) and **lexical thresholds** (suffering cannot be traded for happiness).
  2.  Identify the **person-affecting intuition** regarding the creation of new lives vs. relieving existing suffering.
  3.  Articulate the **reductio ad absurdum** often leveled against strong suffering-focused views (the "monstrous conclusion").
  4.  Recognize the role of **epistemic uncertainty** in arguments for suffering-focused ethics (to be supplied in debrief).

  ## II. The Setup (Board Work)
  *Write the following on the board before class begins. Do not define the ethical frameworks.*

  **THE GLOBAL WELLBEING FUND**
  **Budget:** 100 Impact Tokens per Committee Member.
  **Goal:** Maximize Moral Good.

  **INTERVENTION MENU (Round 1)**
  *   **A. The Agony Cure:** Relieve 1 person of 1 year of severe, torture-level chronic pain. **(Cost: 20 Tokens)**
  *   **B. The Poverty Lift:** Lift 10 families from desperate starvation to modest subsistence. **(Cost: 20 Tokens)**
  *   **C. The New Generation:** Subsidize 50 new lives expected to be net happy and healthy. **(Cost: 20 Tokens)**
  *   **D. The Cheer Boost:** Provide mild mood enhancement to 1,000 people already living comfortable lives. **(Cost: 20 Tokens)**

  *(Note: You may split your budget. You must spend exactly 100 Tokens.)*

  ## III. Minute-by-Minute Timeline

  ### 0:00 – 0:05: Introduction & Rules
  *   **Instructor:** "You are the steering committee. You have no personal stake in the outcomes. Your only directive is to allocate these tokens to produce the best moral outcome. No discussion yet. Fill out your Allocation Sheet silently."
  *   **Handout:** A simple slip with rows for A, B, C, D and a column for "Quantity."
  *   **Constraint:** Emphasize they must spend the full 100 tokens. Unspent tokens are burned (wasted).

  ### 0:05 – 0:20: Round 1 (Individual Allocation)
  *   Students calculate and fill out their sheets.
  *   **Instructor Role:** Circulate. If a student asks, "How much happiness is in D vs A?" reply: "Assume the numbers on the board reflect the *objective* hedonic impact as best as science can measure. A prevents -1000 hedons. B prevents -500 + adds +100. C adds +600. D adds +400." (Keep these ratios in your head, don't write them yet unless asked).
  *   *Philosophical Trap:* A Classical Utilitarian should likely fund D and C heavily (high volume). A Suffering-Focused student will fund A and B. A Person-Affecting view might reject C.

  ### 0:20 – 0:35: Small Group Consensus
  *   Divide into 4 groups of 4 students.
  *   **Task:** "You must now submit *one* joint allocation sheet for your group. You must agree. If you cannot agree, submit a minority report noting the disagreement."
  *   **Goal:** Force them to articulate *why* they prioritized A over D, or C over A.
  *   **Instructor Role:** Listen for phrases like "It's just worse to suffer," or "But the happy lives count too," or "We can't compare creating life to saving life." Do not correct them.

  ### 0:35 – 0:40: The Twist (Crisis Update)
  *   **Instructor:** "New intelligence has come in. We have miscalculated the efficiency of Intervention A."
  *   **Erase/Update Board:**
      *   **A. The Agony Cure:** Relieve **1 person** of 1 year of severe pain. **(NEW Cost: 80 Tokens)**
      *   **B, C, D:** Costs remain 20 Tokens.
  *   **Instruction:** "Your budget is still 100 Tokens. You must re-allocate. You can stick with A, but it will consume almost your entire budget. Or you can switch to B, C, or D. Individual sheets first (5 mins), then quick group check-in (5 mins)."

  ### 0:40 – 0:55: Round 2 (Re-Allocation)
  *   Students allocate individually, then check with their group.
  *   **The Tension:** In Round 1, A was a "no-brainer" for most (20 tokens for torture relief). In Round 2, A costs 80% of the budget for the *same* outcome. D (Cheer Boost) is now 4x more efficient per token than A.
  *   **The Reveal:** Ask for a show of hands.
      *   "Who still funded A in Round 2?" (Likely the Lexical/Suffering-Focused students).
      *   "Who switched to D or C?" (Likely the Weighted Aggregators/Classical Utilitarians).
      *   "Who refused to fund C in both rounds?" (Person-Affecting).

  ### 0:55 – 1:15: Debrief & Mapping to Literature
  *   **Do not** start with definitions. Start with their choices.
  *   **Step 1: The Aggregation Question (Round 1 vs. Round 2)**
      *   Ask a student who switched from A to D: "Why did you stop funding the torture relief?"
      *   *Map to:* **Weighted Aggregation / Prioritarianism.** (Suffering counts for more, but at some point, enough happiness outweighs it).
      *   Ask a student who kept funding A: "You could have helped 4,000 people with mild joy instead of 1 person with agony. Why?"
      *   *Map to:* **Lexical Thresholds / Negative Utilitarianism.** (Some suffering is so bad it cannot be traded off. This is the slide from 'suffering weighs more' to 'suffering is incomparable').
  *   **Step 2: The Commensurability Question (Option C)**
      *   Ask those who ignored C: "Why not create happy lives?"
      *   *Map to:* **Person-Affecting View.** (We have duties to existing people, not to bring potential people into existence).
      *   Ask those who funded C over A: "You traded existing pain for new pleasure."
      *   *Map to:* **Total View Classical Utilitarianism.** (Happiness and suffering are the same currency, regardless of who holds them).
  *   **Step 3: The Reductio (The "Monstrous Conclusion")**
      *   Pose the hypothetical: "If you kept funding A in Round 2, would you fund A even if the cost was 100 tokens and the alternative was preventing the extinction of a happy civilization?"
      *   If they say "Yes," introduce the **Benatar / Negative Utilitarian** position and the standard objection (the "World of Suffering" vs. "World of Nothing").
      *   If they say "No," ask where the line is. This reveals the instability of the lexical view without a defined threshold.
  *   **Step 4: The Missing Feature (Instructor Input)**
      *   Explain what the game hid: **Epistemic Uncertainty.**
      *   "In the game, you *knew* the hedonic outcomes. In reality, we are much more certain about what causes suffering (torture hurts) than what causes happiness (will this art grant actually make them happy?). Many suffering-focused ethicists argue for prioritizing suffering not because it is lexically heavier, but because it is less risky."

  ## IV. Scoring and Settlement
  *   **No Real Money:** Do not use real rewards. It distorts the moral reasoning.
  *   **Settlement:** Collect the Round 2 sheets. Tell them you will tally the "Class Consensus" and post it on the LMS.
  *   **Validation:** The "score" is the coherence of their justification in the debrief, not the allocation itself.

  ## V. Predictable Failure Modes & Fixes

  | Failure Mode | Why it Happens | How to Handle It |
  | :--- | :--- | :--- |
  | **"I refuse to play God."** | A student objects to quantifying human life/suffering. | Acknowledge the validity of the critique (anti-utilitarianism), but ask them to play the role of a "Reluctant Consequentialist." Ask: "If you *had* to choose, which is the *less bad* outcome?" |
  | **Group Dominance.** | One vocal student dictates the group's Round 2 choice. | Require the *Individual* sheet first (0:40-0:45). Only discuss after writing. During debrief, call on quiet students: "Did your personal sheet match your group's?" |
  | **Measurement Skepticism.** | "You can't compare torture to mild joy." | Grant the premise. "For this seminar, we are assuming **Idealized Consequentialism**. Assume the hedonic calculus is accurate. We are testing the *structure* of the ethics, not the feasibility of the math." |
  | **The "All C" Strategy.** | Students fund only "New Lives" to game the system. | In debrief, press hard on the **Non-Identity Problem**. "If you didn't fund C, those people never exist. Did you harm them? If you funded C instead of A, did you harm the torture victim?" |
  | **Premature Labeling.** | A student shouts "This is Negative Utilitarianism!" in Round 1. | Gently shut it down. "Hold that term. Describe the *choice* first. We will name the theory at the end." |

  ## VI. What the Activity Cannot Reproduce (Crucial Debrief Note)
  **The Feature:** **Epistemic Asymmetry.**
  **Why:** The game presents the outcomes (hedons gained/lost) as known facts.
  **The Gap:** In the real literature (e.g., Clark Wolf, David Pearce, or effective altruism discussions on risk), a major argument for suffering-focused ethics is not necessarily that suffering is *ontologically* heavier, but that we are *epistemically* more secure about suffering. We know torture is bad; we are less sure if "mood enhancement" creates genuine wellbeing or mere satisfaction.
  **How to Supply:** In the final 5 minutes of the debrief, explicitly state: "The game assumed perfect knowledge. In reality, many philosophers argue we should prioritize suffering because the risk of failing to relieve suffering is morally worse than the risk of failing to create happiness. This is the **Asymmetry of Risk** argument, which supports suffering-focused views without requiring lexical thresholds."

  ## VII. Instructor Cheat Sheet (The Math Behind the Menu)
  *Keep this for your reference to guide the debrief.*

  *   **Classical Utilitarian (Total View):** Should favor **D** in Round 1 (highest total hedons). Should definitely switch to **D** in Round 2 (A is too expensive).
  *   **Prioritarian (Weighted):** Might favor **A** in Round 1 (suffering gets a multiplier). Might switch to **B** or **D** in Round 2 (diminishing returns on the weight).
  *   **Negative Utilitarian / Lexical:** Must fund **A** in both rounds. No amount of D outweighs the torture.
  *   **Person-Affecting:** Will fund **A** and **B**, but refuse **C** (creating lives doesn't help existing people).
  *   **Skeptic/Non-Consequentialist:** May refuse to allocate or split evenly to avoid responsibility.

  ## VIII. Board Layout for Debrief
  *Draw this as students talk.*

  | Choice Pattern | Philosophical Position | Key Literature Concept |
  | :--- | :--- | :--- |
  | **A (Round 1) → D (Round 2)** | Weighted Aggregation | Prioritarianism / Diminishing Marginal Utility |
  | **A (Round 1) → A (Round 2)** | Lexical Threshold | Negative Utilitarianism / Incommensurability |
  | **Fund C (New Lives)** | Total View | Repugnant Conclusion / Impersonal Good |
  | **Ignore C (New Lives)** | Person-Affecting | Non-Identity Problem |
  | **Refuse to Choose** | Anti-Aggregation | Rights-Based / Deontological Constraints |
