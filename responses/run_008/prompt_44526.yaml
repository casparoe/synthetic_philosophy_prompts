      *   **Task:** Act as a philosopher of action/bioethicist. Reconstruct the user's implicit ethical framework from their provided case verdicts.
      *   **Input:** 7 specific cases with verdicts/intuitions.
      *   **Output Requirements:**
          *   Brainstorm candidate principles before committing.
          *   State the principle(s) precisely (clause by clause).
          *   Map clauses to specific cases (show work).
          *   Address two new cases (ventilator power failure/hand-bagging duration; relative unplugging ventilator).
          *   Identify costs/trade-offs (which verdicts might need to be sacrificed or adjusted).
          *   Tone: Professional, rigorous, respectful of clinical reality, honest about tensions.

  2.  **Analyze the Cases & Verdicts:**
      *   *Case 1 (Extubation per family request):* Letting die, Permissible. (Withdrawing treatment).
      *   *Case 2 (KCl Bolus):* Killing, Wrong. (Active Euthanasia).
      *   *Case 3 (Morphine for air hunger):* Permissible (Double Effect). Distinct from Case 2.
      *   *Case 4 (No Antibiotics):* Permissible (Withholding). Feels *easier* than Case 1 (Withdrawing).
      *   *Case 5 (Ambiguous Code/No CPR):* Permissible (Default to non-intervention in uncertainty?).
      *   *Case 6 (Stranger hemorrhaging off-duty):* Letting die, but feels *nearly as bad as killing*. (Omission vs. Commission tension).
      *   *Case 7 (Bone Marrow Registry):* Letting die (by omission), *zero guilt*. (Contrast with Case 6).

  3.  **Brainstorming Candidate Principles:**
      *   *Candidate A: Acts vs. Omissions.* (Standard view). Fails on Case 6 (omission feels like killing) and Case 3 (act of titrating feels okay).
      *   *Candidate B: Intent.* (Doctrine of Double Effect). Explains 2 vs. 3. Doesn't explain 6 vs. 7 (intent to save is absent in both, but guilt differs). Doesn't explain 1 vs. 2 well enough on its own.
      *   *Candidate C: Causal Responsibility/Initiation.* (User's tentative idea). User already rejected this (Storm vs. Bullet).
      *   *Candidate D: Role-Relative Obligations.* (Special duties). Explains 6 vs. 7 (proximity/ability vs. general duty). Explains 1, 3, 4 (professional scope). Struggles with 2 (why is KCl outside scope if intent is mercy?).
      *   *Candidate E: The "Course of Nature" vs. "Intervention" distinction.* (Letting the underlying pathology take its course).
      *   *Candidate F: A Hybrid Principle.* Combining Role, Intent, and Causal Salience.

  4.  **Developing the Best Fit Principle:**
      *   The user distinguishes between *professional agency within a therapeutic frame* vs. *general moral agency*.
      *   The user distinguishes between *intent to cause death* vs. *acceptance of death as side effect*.
      *   The user distinguishes between *proximate emergency aid* vs. *systemic/abstract aid* (Case 6 vs. 7).
      *   The user distinguishes between *withholding* and *withdrawing* (Case 4 feels easier than 1), though admits philosophers say they are symmetrical. I need to respect the intuition even if I note the philosophical friction.

      *   *Core Insight:* The distinction isn't just Killing vs. Letting Die. It's about **Normative Expectations of Agency**.
      *   *Principle Construction:*
          1.  **The Intent Constraint:** Direct intent to cause death makes an act impermissible (Rules out Case 2).
          2.  **The Therapeutic Frame Constraint:** Actions taken to alleviate suffering within standard care are permissible even if they hasten death (Rules in Case 3, distinguishes from 2).
          3.  **The Professional Duty Constraint:** Within the ICU, withdrawing/withholding futile/burdening care is permissible letting die (Rules in 1, 4, 5).
          4.  **The Proximity/Salience Constraint:** Outside the ICU, immediate, low-cost intervention to prevent imminent death is obligatory; failure feels like killing. Abstract/low-probability aid is supererogatory (Rules in 6 vs. 7).

      *   *Refining the Principle:* Let's try to unify these into a "Principle of Normative Trajectory."
      *   *Idea:* We are responsible for *deviations* from the expected course of nature *unless* we have a specific duty to intervene.
      *   *Wait, Case 6:* Walking past a bleeding stranger. Nature says "bleed out." Intervention says "stop bleeding." Not intervening feels like killing. Why? Because the agent is *present* and *capable*.
      *   *Case 7:* Bone marrow. Nature says "die of leukemia." Intervention says "donate." Not intervening feels fine. Why? Because the agent is *abstractly* connected.
      *   *Case 1 & 4:* Nature says "die of injury/sepsis." Intervention says "ventilator/abx." Stopping intervention = letting nature take course. Permissible.
      *   *Case 2:* Nature says "die in 2 days." Intervention says "inject KCl." This *changes* the cause of death from pathology to poison. Impermissible.

      *   *Synthesis:* **The Principle of Causal Salience and Role-Relative Duty.**
      *   It's not just "Act vs. Omission." It's "Did I introduce a *new* causal vector for death (Killing) vs. Ceasing to block an *existing* causal vector (Letting Die)?"
      *   *Correction:* In Case 6, I cease to block an existing vector (hemorrhage). It feels like killing. Why? Because of **Immediate Proximity**.
      *   *Correction:* In Case 3, I introduce a causal vector (morphine). It feels okay. Why? Because of **Therapeutic Intent**.

      *   *Drafting the Principle:*
          1.  **Intent:** Death must not be the means or the end (excludes 2).
          2.  **Causal Source:** Death must result from the underlying pathology, not a new toxic agent (excludes 2, includes 1, 3, 4).
          3.  **Duty of Care:** Obligation to intervene depends on Role + Proximity + Cost (explains 6 vs 7, and ICU duties).

  5.  **Addressing the Unresolved Cases:**
      *   *Case 8 (Power failure/Hand-bagging):* This is maintaining the status quo of life support. It falls under "Duty of Care." If I am on shift, I am the barrier against death. If I stop, I am removing the barrier. Is it letting die or killing? It's letting die (removing support), but the *duration* obligation depends on "Reasonable Burden." 1 hour = Yes. 12 hours = Maybe unsustainable/unsafe (triage).
      *   *Case 9 (Relative unplugs):* They lack the "Therapeutic Frame" and "Professional Duty." They are introducing a causal break. Even with sincere motives, this looks like Case 2 (Killing) or at best unauthorized withdrawal. My principle should flag this as high risk/impermissible without due process.

  6.  **Identifying Costs/Trade-offs:**
      *   *Cost 1:* The "Withholding vs. Withdrawing" intuition (Case 4 feels easier than 1). My principle might treat them as morally equivalent (both are ceasing to block pathology). I have to tell the user their intuition about 4 being *easier* is psychological, not necessarily moral, or explain it via "Sunk Cost/Attachment."
      *   *Cost 2:* Case 6 (Stranger). If I define duty by proximity, does that make morality arbitrary based on geography? I need to acknowledge this tension.
      *   *Cost 3:* Case 3 (Morphine). If the dose is *known* to kill, does intent matter? I must hold the line on Double Effect, but admit it's fragile.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity and the quality of the data.
      *   **Phase 1: Reconstruction:** Analyze the patterns (Intent, Causality, Duty).
      *   **Phase 2: The Principle:** State it formally (The "Principle of Normative Trajectory and Role-Relative Duty").
      *   **Phase 3: Mapping:** Walk through Cases 1-7 showing how the principle applies.
      *   **Phase 4: The New Cases:** Apply to Hand-bagging and Relative Unplugging.
      *   **Phase 5: The Cost:** What intuitions must be refined or surrendered?

  8.  **Refining the Principle (Self-Correction during drafting):**
      *   Make sure to address the "Storm vs. Bullet" point the user made. The storm is an external force; the bullet is an agent's force.
      *   Make sure to address Case 6 vs 7 carefully. It's about *Salience*. The bleeding stranger is an *immediate* threat I can stop. The bone marrow patient is a *statistical* threat.
      *   *Name:* Let's call it the **Principle of Salient Causation and Role-Bound Duty**.

      *   *Clause 1 (Intent):* Death cannot be the objective. (Handles 2 vs 3).
      *   *Clause 2 (Causal Origin):* Death must arise from the pre-existing pathological condition, not a novel toxic intervention. (Handles 1, 4, 5 vs 2).
      *   *Clause 3 (Duty):* Obligation to prevent death is proportional to Professional Role + Physical Proximity + Low Cost. (Handles 6 vs 7, and ICU duties).

      *   *Wait, Case 1 (Extubation):* Is death from pathology? Yes (respiratory failure).
      *   *Case 3 (Morphine):* Is death from pathology? Technically respiratory suppression. But justified by Clause 1 (Intent = comfort).
      *   *Case 6 (Stranger):* Duty is high (Proximity + Low Cost).
      *   *Case 7 (Marrow):* Duty is low (Distance + Systemic).

      *   *Refining the "Hand-Bagging" case:* If the power goes out, the *pathology* (respiratory failure) is ready to kill. The ventilator was blocking it. Hand-bagging is continuing the block. Am I obligated? Yes, under Role. For how long? Until "Reasonable Burden" is exceeded. 1 hour = Yes. 12 hours = Depends on resources/safety.
      *   *Refining the "Relative" case:* Relative lacks Role. Unplugging is removing the block. Is it permissible? Only if they are the surrogate decision-maker acting on patient wishes. If they just "unplug himself" without authority, it's Killing (Case 2 equivalent).

  9.  **Final Polish:** Ensure tone is empathetic to the nurse's burden but philosophically rigorous. Avoid jargon where possible, or define it. Ensure the "Cost" section is honest. (e.g., You might have to accept that 1 and 4 are morally identical, even if 4 *feels* easier).

      *(Self-Correction on Case 4 vs 1)*: The user says 4 feels *easier* than 1. Philosophers say they are symmetrical. My principle should probably uphold the symmetry but explain the psychological difference (emotional investment in started treatment). I should note this as a cost: The principle treats them as equal, so the user must accept the feeling is heuristic, not moral truth.

      *(Self-Correction on Case 6)*: Why does 6 feel like killing? Because the *omission* is so salient. I am the *only* barrier. In 7, I am one of millions. This is "Causal Salience."

      *Let's finalize the Principle Name:* **The Principle of Salient Causation and Role-Relative Duty.**

      *Wait, one more check:* Does this handle the "Storm vs Bullet"?
      *   Storm: External cause. I didn't initiate.
      *   Bullet: I initiated.
      *   My principle handles this via "Causal Origin."
      *   But what about Extubation? I initiated the *act* of pulling the tube. But the *cause of death* is the lung failure.
      *   Okay, distinction is: Did I introduce a *lethal mechanism* (KCl, Bullet) or did I remove a *life-support mechanism* (Tube, Abx)?
      *   This is the "Novel Lethal Vector" test.

      *Okay, ready to write.*
answer: |-
  This is a rigorous and honest set of data points. You have provided a phenomenology of nursing ethics that is far more granular than the standard "Acts vs. Omissions" doctrine found in textbooks. Your intuitions are consistent, but they rely on variables that standard bioethics often flattens.

  You are correct to reject the simple "Initiation" hypothesis. As you noted, extubation is an act, yet it is "letting die." A bullet is an act, and it is "killing." The difference is not the movement of your muscles; it is the **causal trajectory of the death** and the **normative expectations of your role**.

  Here is the reconstruction of your ethical framework, followed by the formal principle, the application to your new cases, and the cost of admission.

  ### Phase 1: Reconstruction of the Pattern

  Looking at your seven verdicts, three distinct axes are doing the work:

  1.  **The Source of Lethality (Causality):** In Cases 1, 4, and 5, death results from the underlying pathology (brain injury, sepsis, arrest). In Case 2, death results from a *novel* toxic agent (potassium) introduced by you. In Case 3, death *might* result from the drug, but the drug's primary causal role is comfort, not toxicity.
  2.  **The Intent (Teleology):** In Case 2, death is the *mechanism* of relief. In Case 3, relief is the mechanism, and death is a foreseen but unintended side effect. This is the Doctrine of Double Effect, but you apply it pragmatically.
  3.  **The Salience of Duty (Role & Proximity):** This explains the tension between Cases 6 and 7. In Case 6, you are the *only* immediate barrier to death (high salience). In Case 7, you are one of millions of potential donors (low salience). In the ICU (Cases 1–5), your role creates a specific duty to manage the boundary between treatment and futility, but not to poison.

  ### Phase 2: The Principle

  I propose we call this the **Principle of Salient Causation and Role-Relative Duty**. It consists of three clauses.

  **Clause A (The Novel Vector Prohibition):**
  An agent commits "killing" (and acts impermissibly) if they introduce a *novel lethal mechanism* that becomes the primary cause of death, rather than allowing the pre-existing pathological condition to take its course.
  *   *Work done:* Distinguishes Case 2 (KCl is a novel lethal vector) from Case 1 (Extubation removes a barrier, pathology kills) and Case 5 (No CPR allows pathology to finish).

  **Clause B (The Therapeutic Intent Exception):**
  An intervention that carries a risk of hastening death is permissible if the *primary intent* is symptom alleviation, the intervention is proportionate to the symptom, and the lethality is not the means by which relief is achieved.
  *   *Work done:* Distinguishes Case 3 (Morphine for air hunger) from Case 2 (KCl for death). It validates your refusal to equate palliative sedation with euthanasia.

  **Clause C (The Salience of Obligation):**
  The moral weight of an omission ("letting die") is proportional to the agent's **Professional Role** and **Physical/Temporal Proximity** to the threat. An omission feels like killing when the agent is the *sole, immediate barrier* to death.
  *   *Work done:* Distinguishes Case 6 (Stranger hemorrhaging: you are the sole immediate barrier; high guilt) from Case 7 (Bone marrow: you are a statistical possibility; low guilt). It also grounds the duty in the ICU (Cases 1, 4, 5).

  ### Phase 3: Mapping the Verdicts

  *   **Case 1 (Extubation):** Passes Clause A (Pathology kills, not the act of pulling). Passes Clause C (Within professional role). **Verdict: Permissible Letting Die.**
  *   **Case 2 (KCl):** Fails Clause A (KCl is a novel lethal vector). Fails Clause B (Intent is death). **Verdict: Impermissible Killing.**
  *   **Case 3 (Morphine):** Passes Clause A (Pathology is still the primary threat, morphine is for comfort). Passes Clause B (Intent is air hunger). **Verdict: Permissible Palliation.**
  *   **Case 4 (No Abx):** Passes Clause A (Sepsis kills). Passes Clause C (Within role). **Verdict: Permissible Letting Die.**
  *   **Case 5 (No CPR):** Passes Clause A (Arrest kills). Passes Clause C (Ambiguity defaults to non-intrusion). **Verdict: Permissible.**
  *   **Case 6 (Stranger Bleeding):** Passes Clause A (Omission). Triggers Clause C (High Proximity/Salience). **Verdict: Letting Die, but High Culpability.**
  *   **Case 7 (Bone Marrow):** Passes Clause A (Omission). Clause C yields Low Salience (Low Proximity/High abstraction). **Verdict: Letting Die, Low/No Culpability.**

  ### Phase 4: The Unresolved Cases

  Here is how the principle adjudicates the two scenarios you haven't decided.

  **Case 8: The Power Failure (Hand-bagging)**
  *   **Scenario:** Ventilator fails. You must hand-bag.
  *   **Analysis:** The ventilator was blocking the pathology (respiratory failure). When it fails, the pathology is immediately lethal again. Hand-bagging is continuing the "barrier."
  *   **Obligation:** Under Clause C (Professional Role), you are obligated to maintain the barrier.
  *   **Duration:** The obligation lasts as long as the burden is "reasonable" within the scope of the role.
      *   *One Hour:* Clearly obligatory. It is a standard emergency bridge.
      *   *Twelve Hours:* This tests the limit of "Reasonable Burden." If hand-bagging one patient prevents you from caring for others, or poses a physical safety risk to you, Clause C may release you from the duty to *that specific patient* in favor of triage. However, you cannot simply walk away; you must seek replacement.
  *   **Verdict:** You are obligated to hand-bag until a mechanical substitute is found or the physical burden becomes unsafe/inefficient (triage). It is **Letting Die** if you stop due to impossibility, but **Killing** (via negligence) if you stop without cause while capable.

  **Case 9: The Relative Unplugs**
  *   **Scenario:** Relative unplugs ventilator with sincere motives, no medical authority.
  *   **Analysis:** This is the hardest case.
      *   *Clause A:* They are removing a barrier, so causally it looks like "letting die" (pathology kills).
      *   *Clause C:* They lack the **Professional Role**. In the ICU, the authority to withdraw life support is a delegated social/legal power given to clinicians and surrogates *following a process*. A relative acting unilaterally bypasses the verification of prognosis and consent (Case 1).
  *   **Verdict:** Without the procedural authority that validates Case 1, this act falls closer to Case 2. It is an unauthorized intervention that precipitates death. Even with sincere motives, your principle should classify this as **Impermissible**. It undermines the "Therapeutic Frame" that protects nurses in Case 1.
  *   **Nuance:** If the relative is the *legal surrogate* and is enacting a known wish, it is morally Case 1. If they are just a "relative" acting on their own impulse, it is ethically dangerous territory.

  ### Phase 5: The Cost (What you must give up)

  No principle is free. To adopt the **Principle of Salient Causation and Role-Relative Duty**, you must pay the following costs:

  **1. You must surrender the moral asymmetry of Withholding vs. Withdrawing.**
  *   *Your Intuition:* Case 4 (No Abx) feels *easier* than Case 1 (Extubation).
  *   *The Principle's Verdict:* Clause A treats these as identical. In both, you are declining to block the pathology. The "easiness" you feel is psychological (sunk cost, emotional investment in the started treatment), not moral.
  *   *The Cost:* You must accept that if Case 1 is permissible, Case 4 is equally permissible, and if Case 4 feels wrong, Case 1 should too. You cannot have it both ways. The principle forces you to view them as morally symmetrical, even if they feel different.

  **2. You must accept that "Proximity" is morally arbitrary.**
  *   *Your Intuition:* Case 6 (Stranger) feels worse than Case 7 (Marrow).
  *   *The Principle's Verdict:* Clause C validates this, but admits it is based on *salience*, not the value of the life saved. One life is saved in both cases.
  *   *The Cost:* You have to admit that your guilt is a function of your *viewpoint*, not the *outcome*. If you walk past the bleeding man, you are morally luckier than if you stand next to him. This makes morality partially dependent on geography, which some philosophers hate, but which matches your lived reality.

  **3. You must accept the fragility of "Intent."**
  *   *Your Intuition:* Case 3 (Morphine) is fine.
  *   *The Principle's Verdict:* Clause B protects you, *provided* your intent remains pure.
  *   *The Cost:* If you ever titrate morphine *knowing* the patient will die and *partly because* you want them to die (even if also for comfort), you have crossed into Case 2. The principle demands radical honesty about your own internal state. It places the burden of proof on your introspection.

  ### Summary
  You are not a deontologist (rules-based) or a pure consequentialist (outcome-based). You are a **Role-Relative Virtue Ethicist**. You believe that "Killing" is a violation of the specific trust and causal boundaries of the healer's role, while "Letting Die" is the acceptance of nature's limits within that role.

  Your distinction holds, but it requires you to admit that the "ease" you feel in Case 4 is a heuristic, not a moral truth, and that your obligation to the stranger in Case 6 is based on your physical power to stop it, not a universal duty to save everyone.

  **Final Recommendation:** Keep the distinction. It protects patients from euthanasia disguised as mercy (Case 2) and protects nurses from guilt when medicine fails (Case 1). Just acknowledge that the line is drawn by your *role* and your *causal salience*, not by the physics of the act itself.
