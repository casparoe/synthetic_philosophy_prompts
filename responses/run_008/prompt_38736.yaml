      *   **Mapping to Modern Vocabulary:**
          *   *UA vs. MoS:* Berkeley distinguishes the *measure* (UA) from the *substance* (wealth/labor). He treats paper notes as the MoS that represents the UA. He realizes the MoS doesn't need intrinsic value (commodity) to function as a UA.
