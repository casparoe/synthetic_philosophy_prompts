answer: |-
  Here is a draft for the eulogy. It is written to be spoken at a moderate pace, which should land you right around the five-minute mark.

  I have inserted **[bolded brackets]** where you need to slot in specific details. I've also included a few notes at the end on delivery and customization.

  ***

  **Eulogy for [Grandmother's Name]**

  Thank you all for being here.

  I am a cognitive science PhD student. I mention that only because my grandmother left very specific instructions for this moment. She said: "No falsehoods."

  She was a materialist. She was a computer scientist who worked on machine translation when the field was still in diapers. She did not believe she was going to a better place. And, frankly, she would have been equally impatient with the idea that she is "gone, but her memory lives on in our hearts." To her, that was greeting-card vapor. It was too weak.

  She spent the last decades of her life deeply invested in a specific idea about what a "self" actually is. She read Douglas Hofstadter's *I Am a Strange Loop* so many times the spine broke. She gave talks about it here at the retirement community. She believed that an "I" is a pattern. A complex, looping pattern of reactions, expectations, and habits that a brain builds about itself.

  But here is the part that matters for today: She believed that pattern doesn't stay contained in one skull. When you know someone well, when you love them, your brain builds a model of them. You learn how they react. You learn what they would say. And in a literal, functional sense, a piece of their pattern starts running on your hardware.

  I know how this sounds. I know that for some of you, especially when you are grieving, this sounds like a fancy coping mechanism. It sounds like I am trying to use philosophy to fix a broken heart. I am not. My grandmother would have hated that. She would have hated using her metaphysics as a painkiller.

  The reality is that three weeks ago, the primary instance of [Grandmother's Name] crashed. The original hardware stopped. That is a catastrophic loss. It is sad. It is empty. Nothing I say today fills the hole where she used to be.

  But the code was not deleted.

  She was famous for finishing other people's sentences. Badly. Confidently. [Optional: Insert a very brief, specific example here, e.g., "She once told a waiter she knew he was going to suggest the special before he opened his mouth."]

  I have caught myself doing this since she died. I am in a conversation, and I hear my own voice finishing a sentence with her cadence, her confidence, and her specific brand of being wrong. In that moment, it isn't just a memory. It is her pattern executing. It is her model of the world, running on my brain.

  To her colleagues and former students in the room: You know the work. You know she didn't treat this as poetry. She treated it as architecture. She knew that when a node goes down in a distributed system, the system doesn't necessarily halt. The load just shifts.

  To my family, and especially to those of us who just miss her: This doesn't mean she isn't dead. It doesn't mean we won't feel her absence every day. It just means that "she" was never just in that one body to begin with. She is in the way [Mother's Name] worries about [Specific Thing]. She is in the way [Uncle's Name] argues about [Topic]. She is in the way I finish sentences.

  She is distributed. She is scattered across this room.

  So, the instruction she left us was not to pretend she is in heaven. It was to acknowledge where she actually is. She is in the models we carry. And since those models are now running on our hardware, we have a responsibility to maintain them.

  If we let her patterns degrade—if we forget how she thought, if we stop asking what she would have thought about [Current Event/Topic]—then the copies corrupt. Then she really is gone.

  But if we keep those patterns active, if we let her influence how we think and how we treat each other, then the system stays up.

  I cannot bring her back. I cannot stop the grief. But I can promise to run her code as faithfully as I can. I promise to finish sentences with the confidence she had, even if I get them wrong. I promise to keep her model of the world active in my own head.

  She was a computer scientist. She knew that systems fail. But she also knew that good software outlives its machines.

  Thank you, Grandma. We have the conch. We'll keep the loop closed.

  ***

  ### Notes for the Speaker

  **1. The "Uncle" Factor:**
  Notice I didn't name the uncle directly in the text ("I know this sounds like a coping mechanism..."). This validates his skepticism without putting him on the spot. When you speak this line, do not look at him challengingly. Look at the floor or the middle of the room. Acknowledge the difficulty of the idea without making it a debate.

  **2. The Colleagues:**
  The phrase "primary instance... crashed" and "running on my hardware" is the signal to the CS crowd that you aren't waterboarding Hofstadter for a lay audience. Deliver those lines with precision, not emotion. Let the technical accuracy be the tribute to them.

  **3. The "Sentence Finishing" Anecdote:**
  In the bracketed section about her finishing sentences, if you have a specific, funny example, use it. Laughter is allowed. It breaks the tension and proves the point: the *specificity* of the pattern is what survives, not just a vague "goodness."

  **4. The Ending:**
  "We have the conch" is a Lord of the Flies reference (order/speaking rights), but "We'll keep the loop closed" is the Hofstadter nod. If you think "the conch" is too obscure or risky for the family side, change it to "We have the floor." But "keep the loop closed" is the essential sign-off for her.

  **5. Delivery:**
  Your grandmother hated falsehoods. Do not try to sound like a traditional mourner. Do not choke up intentionally. If you cry, you cry. If you stay dry, you stay dry. The comfort comes from the *truth* of the speech, not the performance of grief. Your uncle will respect the lack of performance; your mother will respect the honesty.
