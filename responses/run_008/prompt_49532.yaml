answer: |-
  Here is the full session design. It is built to run for exactly three hours with ten participants. It relies on cumulative rewriting of a single scene to make the erosion of "character" palpable.

  ### Session Title: The Sanctification Trap
  **Goal:** To interrogate whether the "boring moral saint" is a failure of human nature or a failure of narrative mechanics.
  **Participants:** 10 writers.
  **Duration:** 180 minutes (3 hours).
  **Materials Needed:**
  *   12 Constraint Cards (printed on cardstock, see below).
  *   A4 paper or notebooks for everyone.
  *   Two distinct boxes/bowls for voting (labelled 'FRIEND' and 'READER').
  *   Small slips of paper for voting.
  *   Whiteboard or flipchart for the debrief.
  *   Timer (visible to all).

  ---

  ### Run of Show (Timing is Strict)

  **0:00 – 0:10 | Introduction & Setup**
  *   Welcome. No theory. No mention of Susan Wolf.
  *   **Instruction:** "We are going to write a single 500-word scene. A moment of conflict or decision. You will rewrite this *same* scene three times. Each time, the moral gravity of your protagonist increases. Your job is not to judge the morality, but to observe what happens to the *writing*."
  *   **Prompt:** "A situation where your character wants something (a object, a truth, a favour, a departure) but obtaining it costs someone else something. Write the moment they decide what to do."

  **0:10 – 0:40 | Round 1: The Human (Baseline)**
  *   **Write (30 mins):** Draft the scene naturally.
  *   **Pair Share (10 mins):** Split into 5 pairs. Read aloud to each other. No critique yet. Just: "What did you notice about the character's voice?"

  **0:40 – 1:10 | Round 2: The Good Person (Moderate Constraints)**
  *   **Deal Cards:** Each writer draws **two** cards from **Deck A** (Decency).
  *   **Write (25 mins):** Rewrite the *same* scene. You must adhere to the cards. If the cards make the original action impossible, change the action, not the cards.
  *   **Pair Share (15 mins):** Swap partners from Round 1. Read the new version. Discuss: "What became harder to write? Did the dialogue change?"

  **1:10 – 1:40 | Round 3: The Saint (Radical Constraints)**
  *   **Deal Cards:** Each writer draws **two** cards from **Deck B** (Sacrifice). *Keep previous cards active.*
  *   **Write (25 mins):** Rewrite the scene again.
  *   **Pair Share (15 mins):** Swap partners again. Read. Discuss: "Is there a person left here, or just a function?"

  **1:40 – 1:50 | Break**
  *   Essential. Minds need to reset before the vote.

  **1:50 – 2:10 | The Blind Vote**
  *   **Anonymise:** Everyone copies 3-4 lines from their Round 3 (Saint) version onto a slip of paper. No names.
  *   **Collect:** Put all slips in a central pile. Shuffle.
  *   **Distribute:** Hand out 2 slips to each person (not their own).
  *   **Vote:** Each writer gets 2 voting slips.
      *   **Box 1 (FRIEND):** "Would I want this person in my life?" (Yes/No)
      *   **Box 2 (READER):** "Would I keep reading a novel about this person?" (Yes/No)
  *   **Tally:** You count the votes on the whiteboard.

  **2:10 – 3:00 | The Debrief (Facilitator Script Below)**
  *   Mapping the results to the craft/philosophy tension.

  ---

  ### The Constraint Cards

  Print these, cut them out, and sort into two decks.

  **Deck A: Decency (Round 2)**
  1.  **Radical Honesty:** The character cannot tell a lie, even a white lie, to spare feelings.
  2.  **No Retaliation:** If provoked, the character cannot respond with anger or sarcasm.
  3.  **Fairness:** The character must consider the needs of a stranger equal to their own needs.
  4.  **Transparency:** The character cannot hide their motives; if asked 'why', they must tell the truth.
  5.  **Kindness:** The character must prioritise the other person's comfort over their own efficiency.
  6.  **Responsibility:** The character must accept blame for any ambiguity, even if it isn't fully their fault.

  **Deck B: Sacrifice (Round 3)**
  7.  **Impartiality:** The character cannot favour family/friends over strangers in resource allocation.
  8.  **Vocation Check:** If the time spent on this scene could be spent alleviating suffering elsewhere, they must acknowledge that guilt.
  9.  **Asset Liquidation:** The character must be willing to give away anything they own that someone else needs more.
  10. **Emotional Labour:** The character cannot feel resentment. They must *feel* gladness at the sacrifice.
  11. **Project Abandonment:** If their personal goal conflicts with a moral duty, the goal must be dropped immediately.
  12. **Self-Erasure:** The character cannot use 'I want' as a justification for any action.

  ---

  ### The Vote Mechanics

  This needs to be clinical to separate the aesthetic from the ethical.

  1.  **The Excerpt:** Writers copy 3-4 lines from their *Round 3* draft. This ensures the vote is based on the "Saint" version, not the "Human" version they liked initially.
  2.  **The Ballot:** Two distinct boxes.
      *   **Box 1 (Life):** "Would you invite this person to your birthday dinner?"
      *   **Box 2 (Art):** "Would you turn the page to see what happens to them next?"
  3.  **The Reveal:** Tally the results publicly.
      *   *Expected Outcome:* High 'No' on Art. Mixed on Life (some will say 'Yes, they'd be safe', others 'No, they'd be exhausting').
      *   *The Pivot:* If anyone votes 'Yes' on Art for a Saint, ask them why. (Usually, they've accidentally written a martyr, which is dramatic, defeating the point).

  ---

  ### Facilitator's Debrief Script (Skeleton)

  *Do not lecture. Use their grievances to build the theory.*

  **Phase 1: The Craft Complaint (20 mins)**
  *   **Ask:** "Look at the 'Reader' votes. Why did you say no? Use writer terms."
  *   **Likely Answers:** "No conflict," "No agency," "Dialogue was wooden," "No stakes."
  *   **Map it:** Write these on the board.
      *   *No Conflict* → *No Obstacle.*
      *   *No Agency* → *No Desire.*
      *   *Wooden* → *No Idiosyncrasy.*
  *   **Point:** "So, narrative requires desire, obstacle, and quirk. The Saint removed all three. Is that because goodness removes desire, or because *novels* require desire?"

  **Phase 2: The Life Complaint (20 mins)**
  *   **Ask:** "Look at the 'Friend' votes. Even those who said 'Yes', what was the hesitation?"
  *   **Likely Answers:** "They'd make me feel guilty," "They're no fun," "It feels one-sided," "I couldn't trust their affection."
  *   **Map it:**
      *   *Guilt* → *They judge us by existing.*
      *   *No Fun* → *No shared frivolity.*
      *   *One-sided* → *No reciprocity.*
  *   **Point:** "A friend requires reciprocity. A Saint gives, but doesn't *take*. Is a relationship possible without mutual selfishness?"

  **Phase 3: The Reveal (10 mins)**
  *   **Introduce Wolf:** "There is a philosophical essay by Susan Wolf, 'Moral Saints'. She argues exactly what you found: a life maximised for morality crowds out the 'non-moral virtues' (humour, hobbies, love of specific people) that make a life attractive."
  *   **The Twist:** "Wolf says the Saint is unattractive as a *person*. You found they are also unreadable as a *character*."
  *   **The Question:** "Does this prove Wolf right? Or does it prove that novels are inherently immoral structures because they demand flaw?"

  **Phase 4: Resistance & Cost (10 mins)**
  *   **Ask:** "At which card did you want to rebel? Where did you think, 'This isn't morality, this is madness'?"
  *   **Discussion:** Usually Card 7 (Impartiality) or Card 10 (Emotional Labour).
  *   **Closing:** "If you can resist a constraint and still be 'good', then the Saint isn't defined by the constraint. If you can't resist it, the character dies. Your job as writers isn't to solve this. It's to live in the tension. Write decent people who struggle with the cost of decency."

  ---

  ### Predictable Failure Modes

  1.  **The Smug Saint:** A participant writes a Saint who is internally arrogant about their goodness.
      *   *Result:* The character becomes interesting (villainous) again. The "boring" point is lost.
      *   *Fix:* In the debrief, call this out. "You smuggled a flaw back in to make the prose work. That proves the point: without flaw, there is no voice."
  2.  **The Martyr Pivot:** A participant turns the scene into a tragedy where the Saint suffers greatly.
      *   *Result:* Suffering is dramatic. The group votes 'Yes' on Reader.
      *   *Fix:* Challenge the constraint. "Card 10 says no resentment. If they enjoy the sacrifice, where is the tragedy? If they suffer, are they truly a Saint or just a victim?"
  3.  **The Secret Rebel:** The character obeys the rule but thinks rude thoughts in narration.
      *   *Result:* This is actually the sweet spot.
      *   *Fix:* Highlight this. "The narration is the last place for humanity. When the thought goes, the person goes."
  4.  **Time Creep:** The writing rounds overrun.
      *   *Fix:* Be ruthless. At 25 mins, stop them even if unfinished. The friction of being cut off is part of the exercise.

  ### The Philosophical Blind Spot

  Be upfront about this in the debrief.
  **The Blind Spot:** *Interiority vs. Exteriority.*
  "This workshop judges the Saint from the *outside*. We look at them and find them boring. But Wolf admits the Saint might feel *fulfilled* on the inside. We cannot write that interiority without making it sound like boredom, because fiction is a language of desire and lack. We cannot simulate a soul that lacks nothing. We are testing the *aesthetics* of goodness, not the *experience* of it."

  ---

  ### Confidence Ratings & Uncertainty

  **High Confidence (I'd stake money on this):**
  *   **The Mechanic:** Rewriting the *same* scene is the strongest way to show erosion. New scenes allow writers to dodge the constraint by changing the plot. Rewriting forces them to break the character.
  *   **The Vote:** Separating 'Friend' and 'Reader' will reliably produce a split result. It forces the distinction between ethical value and aesthetic value.
  *   **The Failure Modes:** The "Smug Saint" and "Martyr" pivots are classic writer dodges. They will happen.

  **Medium Confidence (Educated Guess):**
  *   **Timing:** 25 minutes for a rewrite is tight for literary writers who like to polish. You may need to bully them into "vomit drafting" the constraints.
  *   **The Debrief:** Whether the group can sustain the philosophical nuance without you leading them. Some may just want to talk about "weak endings." You have to keep steering them back to "Is the weakness in the writing or the goodness?"

  **Low Confidence (The Guess):**
  *   **The Emotional Resonance:** Whether they will *feel* the loss of the character or just see it intellectually. Some writers are too technical; they might treat the constraints as a logic puzzle rather than a character death.

  **The Single Point I Am Least Sure About:**
  *   **Card 10 (Emotional Labour):** "The character cannot feel resentment." This is the hardest constraint to write because it demands controlling internal narration. It risks stopping the writing process entirely. If the room stalls here, tell them: "Describe the absence of the feeling, rather than the feeling itself."

  ### Final Note on Tone
  Keep your British English consistent. Use "programme" if you print a handout, "centre" for the arts venue. Avoid "envision", "delve", or "unlock". Use "try", "look at", "open". When you speak, sound like a colleague, not a teacher. You are midlist; they are peers. You are all struggling with the same impossibility.
