prompt: |-
  I'm a journalist who covers science and ideas for a general-audience outlet, and I run a newsletter where a couple times a year I do an interactive "what do you actually believe?" quiz — did one on free will last year that did pretty well numbers-wise, though the comment section turned into a war about the scoring key. The next one I want to do is on the internal vs external reasons debate: when we say someone "has a reason" to do something, does that have to connect up with what they'd want after thinking it through properly from where they actually are, or can there be reasons that hold of you even if no amount of deliberation, however ideal, would ever bring you to care? I want to sort readers by how they react to cases, not by which -ism they already call themselves, so no questions like "are you a Humean about reasons" — the labels should only show up in the scoring key at the end.

  Please give me around eight questions, each a short concrete scenario with two or three answer options. I'd like these cases in there (or close variants): the person who wants a few drinks before the career-defining party tomorrow and just hasn't thought about how they'll feel; someone who is fully informed, perfectly intelligent, completely unmoved by other people's suffering, and doesn't care that they don't care — is that a mistake about reasons or just how they're wired; the arrogant man who would be devastated to find out his wife is deceiving him but whose arrogance is exactly what makes it impossible to get him to honestly reflect his way to caring; and someone who fully grants that a consideration counts in favor of something and still shrugs "so what." You can invent one or two more cases if a branch of the logical space needs its own diagnostic. Then the scoring key: map answer patterns onto the main positions — the strict internalist view where reasons must trace back to soundly deliberated motivation, looser versions that let very latent or abstract motivations count, the externalist realist view that reasons can hold independent of any motivational route to them, views on which seeing a reason just is being moved by it (so the shrugging person is in some sense defective rather than merely indifferent), and constitutivist-flavored views that ground reasons in being an agent at all. And please flag honestly what the quiz can't separate — e.g. can it really tell apart "there are no external reasons" from "external reasons exist but only license criticism, not motivation"?

  One more thing: for any answer pattern that doesn't correspond to any actual position in the literature, say so and tell me whether that's because the combination is incoherent or just unattractive/unexplored — I find those "empty corners" fascinating and might write a little sidebar about them. Keep the quiz itself in plain American English since my readers are not philosophers, and don't water down the scoring key's accuracy just to make it friendlier; I'm fine with it being a bit spiky, readers seem to like that. Typos in my questions are my own fault but please fix any you'd introduce!
reasoning: |-
  Here's a thinking process that leads to the suggested quiz and scoring key:

  1.  **Analyze the Request:**
      *   **Target Audience:** General audience (science/ideas newsletter), not philosophers. Needs plain American English.
      *   **Topic:** Internal vs. External Reasons (Williams, Nagel, etc.).
      *   **Format:** ~8 questions, short concrete scenarios, 2-3 answer options each. No jargon in questions.
      *   **Specific Cases Required:**
          1.  Drinker before the party (short-sighted vs. future self).
          2.  Psychopath/Unmoved by suffering (fully informed, doesn't care).
          3.  Arrogant husband (blocked from reflection by vice).
          4.  "So What?" shrugger (acknowledges consideration, remains unmoved).
          5.  1-2 invented cases to fill logical space.
      *   **Scoring Key:** Map patterns to positions (Strict Internalism, Looser Internalism, External Realism, Judgment Internalism/Motivation, Constitutivism).
      *   **Constraints:** Flag limitations/ambiguities (e.g., criticism vs. motivation). Identify "empty corners" (incoherent/unexplored combos).
      *   **Tone:** Engaging, slightly spiky in the key (accurate over friendly), interactive feel.

  2.  **Deconstruct the Philosophy (Internal vs. External Reasons):**
      *   *Internalism (Williams):* A reason must be grounded in the agent's "subjective motivational set" (S) via sound deliberation. If no route from S to $\phi$-ing, no reason.
      *   *Externalism:* Reasons exist independently of motivation. You can have a reason to $\phi$ even if $\phi$-ing serves no desire you have or would have.
      *   *Constitutivism:* Reasons stem from the nature of agency itself. To be an agent *is* to be bound by certain norms.
      *   *Judgment Internalism:* To judge that you have a reason *just is* (or necessarily involves) being motivated.
      *   *Nuance:* "Sound deliberation" (correcting ignorance, imagining vividly) vs. "Ideal reflection" (changing values).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Case 1: The Drinker (Short-sightedness).*
          *   Scenario: Alex wants drinks tonight but will regret it at the big party tomorrow.
          *   Options: (A) No reason to stop (doesn't want to now), (B) Reason to stop (future self matters), (C) Reason only if Alex *would* care if vividly imagining the hangover.
          *   *Refinement:* Need to distinguish between "current desire" vs. "deliberated desire."

      *   *Case 2: The Unmoved Observer (Psychopath/Suffering).*
          *   Scenario: Jordan knows people suffer, is smart, but feels nothing. Doesn't care about not caring.
          *   Options: (A) No reason to help (no motivation possible), (B) Reason exists anyway (suffering is bad), (C) Defective agent (constitutivist).

      *   *Case 3: The Arrogant Husband (Blocked Reflection).*
          *   Scenario: Mark is arrogant. Wife cheating. If he knew, he'd be crushed. But arrogance prevents him from seeking truth/caring.
          *   Options: (A) No reason to suspect (can't get there from here), (B) Reason exists (truth is good for him), (C) Reason exists *because* he would care if he weren't arrogant (idealized self).

      *   *Case 4: The "So What?" Shruggers (Judgment Internalism).*
          *   Scenario: Taylor admits "This helps my health" but says "So what?" and keeps smoking.
          *   Options: (A) Taylor is irrational/broken (judgment implies motive), (B) Taylor is fine (belief $\neq$ motive), (C) Taylor has a reason but won't act.

      *   *Case 5: Invented - The Bored Immortal (Long-term/Identity).*
          *   Need to test if reasons survive radical changes in motivation.
          *   Scenario: Casey takes a pill to love math forever. Before pill, hates math.
          *   Options: (A) No reason now, (B) Reason now (future self), (C) Reason depends on deep values.
          *   *Actually, let's stick closer to the "Reason for Action" debate.* Let's do a "Duty vs. Desire" case.
          *   *Revised Case 5: The Reluctant Benefactor.* You can save a stranger at great cost. You don't care about strangers.
          *   Options: (A) No reason (too costly, no desire), (B) Reason exists (moral demand), (C) Reason exists only if you value "being good."

      *   *Case 6: Invented - The Mistaken Tourist (Ignorance vs. Value).*
          *   Scenario: Sam wants to go to the museum. It's closed.
          *   *Wait, this is too simple (instrumental).* Let's try the "Painful Truth" case.
          *   Scenario: Jamie could live a happy life based on a lie, or a hard life based on truth. Jamie prefers the lie.
          *   Options: (A) Reason to lie (satisfies desire), (B) Reason for truth (independent value), (C) Reason for truth (if Jamie reflected on dignity).

      *   *Case 7: The Addict (Compulsion vs. Reason).*
          *   Scenario: Pat is addicted. Wants to quit deep down, but urge is strong.
          *   Options: (A) Reason to quit (deep desire), (B) No reason (current motivation dominates), (C) Reason exists regardless of desire (health is good).

      *   *Case 8: The Aesthetic Snob (Taste).*
          *   Scenario: Robin hates modern art. Friend says "You're missing out." Robin says "I know I'm missing out, I don't care."
          *   Options: (A) No reason to look (no interest), (B) Reason to look (value is there), (C) Reason to look (if Robin valued culture).

      *   *Review against constraints:* Need to ensure options map cleanly to Internal/External/Constitutivist/Judgment Internalist.
      *   *Refining Options:* Make sure A, B, C correspond roughly to "Internal," "External," "Nuanced/Internal-Idealized" across questions to make scoring easier, OR mix them up to prevent pattern guessing. Mixing is better for integrity, but harder to score. Let's try to keep the *logic* consistent even if the letters vary.
      *   *Actually, for a newsletter quiz, randomizing letters is better to prevent cheating, but I need to provide the scoring logic.* I will label the options clearly in the key.

      *   *Let's finalize the 8 cases.*
          1.  Drinker (Present vs. Deliberated Future).
          2.  Psychopath (Morality without Motivation).
          3.  Arrogant Husband (Vice blocking deliberation).
          4.  Shruggers (Judgment Internalism).
          5.  The Happy Lie (Truth vs. Happiness).
          6.  The Stranger's Pain (Costly Altruism).
          7.  The Bored Student (Value vs. Interest).
          8.  The Last Man (Environmental value without humans? Maybe too niche). Let's go with **The Reluctant Artist**. Someone has talent but hates art. Do they have a reason to develop it?

  4.  **Developing the Scoring Key:**
      *   Need to define the archetypes:
          *   *The Hard Internalist (Williams-style):* Reasons must link to subjective motivational set (S) via sound deliberation.
          *   *The Idealizing Internalist:* Reasons link to what you *would* want if rational/virtuous.
          *   *The External Realist:* Reasons are facts independent of you.
          *   *The Judgment Internalist:* To see a reason *is* to be moved.
          *   *The Constitutivist:* Reasons come from the job description of being an agent.
      *   Need to identify "Empty Corners":
          *   E.g., Believing reasons exist externally but never motivate anyone ever (queer properties).
          *   E.g., Believing you can have a reason but it's irrational to act on it.
      *   Need to flag limitations: The quiz can't distinguish between "No external reasons" and "External reasons exist but are inert."

  5.  **Drafting the Content (incorporating tone):**
      *   Intro: Hook the reader.
      *   Questions: Keep them punchy.
      *   Key: Be precise but accessible. Use the "spiky" tone requested.

  6.  **Refining the Philosophy in the Key:**
      *   *Strict Internalism:* Bernard Williams. "Sound deliberation" from existing S.
      *   *Externalism:* Thomas Nagel, Derek Parfit. Reasons are objective.
      *   *Constitutivism:* Christine Korsgaard, David Velleman. Agency constitutes the norm.
      *   *Judgment Internalism:* Michael Smith. If you judge it good, you are motivated (unless irrational).
      *   *Empty Corner:* "External Reasons that are never motivating even in principle" vs "External Reasons that motivate only the virtuous."

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the arrogant husband? Yes.
      *   *Check:* Did I include the shrugger? Yes.
      *   *Check:* Are the options distinct?
      *   *Check:* Is the English plain? (Avoid "normativity," "pro-attitude," "deliberative route").
      *   *Check:* Scoring logic. I need to make sure the user can actually tally this. I'll assign points to options (e.g., Option A = 1 point Internal, Option B = 1 point External, etc.) or group them by "Predominant Pattern." Grouping by pattern is more robust for a newsletter. I will describe the *pattern* of answers.
      *   *Wait, simpler:* I will categorize the *options* in the key. "If you mostly chose options that prioritized current desire..." No, that's vague.
      *   *Better:* I will label the options in the *Key* (not the quiz) as Type 1, Type 2, Type 3. Then the reader matches their choices.
      *   *Actually, best for a newsletter:* "Tally your answers."
          *   Option A = Internalist leanings.
          *   Option B = Externalist leanings.
          *   Option C = Nuanced/Constitutivist leanings.
          *   *Problem:* Some questions don't fit that triad perfectly.
          *   *Solution:* I will write the Key to analyze *combinations*. "If you said X on Q2 and Y on Q4..." That's too complex for a newsletter.
          *   *Compromise:* I will design the options so they consistently map to three main buckets (Internal, External, Constitutivist/Judgment), with the Key explaining the nuance.
          *   *Wait, the prompt asks to map answer patterns onto positions.* I should allow for mixed views.
          *   *Decision:* I will provide a "Scorecard" in the key. "Count how many times you chose the option that appealed to [Desire], [Fact], or [Agency]."

      *   *Re-evaluating the "Empty Corner" request:* I need to explicitly state which combinations of answers are philosophically weird.
      *   *Re-evaluating the "Limitations":* Explicitly state what the quiz misses.

  8.  **Final Polish:**
      *   Ensure the "Arrogant Husband" case distinguishes between "can't get there" (Internal) vs "should be there" (External/Idealized).
      *   Ensure the "Shrugger" distinguishes between "irrational" (Judgment Internalism) vs "amoralist" (Externalist/Separatist).
      *   Check word count and tone.

      *(Self-Correction on Scoring)*: To make this usable for a newsletter, I shouldn't make the scoring *too* algorithmic. I will group the questions by "Theme" in the key and explain what their choice reveals. I will provide a "Dominant View" summary based on the majority of their choices.

      *Let's refine the options to be clearly identifiable in the key.*
      *   Option 1 (The "Me" Answer): Focuses on what I want/care about.
      *   Option 2 (The "World" Answer): Focuses on what is true/good regardless of me.
      *   Option 3 (The "Ideal/Agent" Answer): Focuses on what I *should* want or what being rational requires.

      *Wait, one constraint:* "no questions like 'are you a Humean about reasons'". Okay.
      *   "labels should only show up in the scoring key". Okay.

      *Let's write.*

      *(Final check on the "Empty Corner")*: A common empty corner is believing reasons are external *and* that recognizing them necessarily motivates (External Judgment Internalism). This is rare because if reasons are external, why must they motivate? Usually, Externalists are Motivation Externalists. I should highlight this.

      *(Final check on Limitations)*: The quiz can't distinguish between "There are no external reasons" and "External reasons exist but are silent/inert." This is the "Queerness" objection vs. "Error Theory."

      *Okay, ready to generate.*
answer: |-
  # The "Why Do Anything?" Quiz

  **Instructions:** Read each scenario and pick the answer that feels most true to you. Don't overthink it, and don't answer based on what you think a philosopher *should* say. Answer based on what you actually believe would be happening in the room.

  ***

  **1. The Hangover**
  Alex has a career-defining networking event tomorrow morning. Tonight, Alex really wants to have several drinks with friends. Alex knows, vaguely, that a hangover would ruin the event, but in the moment, the desire for the drink is overwhelming and the future event feels abstract. Does Alex have a reason to stop at one drink?
  *   **A.** No. Right now, Alex wants the drinks. If the future event doesn't feel motivating to Alex *now*, there's no reason to stop.
  *   **B.** Yes. The future career success is a reason, regardless of whether Alex feels motivated by it right now.
  *   **C.** Yes, but only because if Alex vividly imagined the hangover and thought clearly, Alex *would* want to stop. The reason depends on that hypothetical better version of Alex.

  **2. The Cold Observer**
  Jordan is perfectly intelligent and fully informed about a stranger's suffering. Jordan understands the facts completely but feels absolutely no emotional pull to help. Jordan also doesn't care that they don't care. Does Jordan have a reason to help?
  *   **A.** No. Reasons have to connect to what you care about. If nothing about suffering moves Jordan, even in principle, there's no reason.
  *   **B.** Yes. Suffering is bad. That fact gives Jordan a reason, even if Jordan is too cold to feel it.
  *   **C.** Yes. To be a rational agent is to recognize the claims of others. Jordan isn't just "cold"; Jordan is failing at being an agent.

  **3. The Arrogant Husband**
  Mark's wife is deceiving him. If Mark found out, he would be devastated and would want to leave her. However, Mark is so arrogant that he refuses to look at the evidence. His arrogance blocks him from ever honestly reflecting his way to caring about the truth. Does Mark have a reason to investigate the truth?
  *   **A.** No. You can't have a reason to do something if your own psychology makes it impossible for you to ever want to do it.
  *   **B.** Yes. The truth is good for him, and his wife's fidelity matters, regardless of his blindness.
  *   **C.** Yes. He has a reason because a version of him *without* the vice of arrogance would care. The reason is there, waiting for the vice to clear.

  **4. The Shrug**
  Taylor smokes. When told, "Smoking damages your health," Taylor says, "I grant that health is a consideration in favor of quitting. I just don't care. So what?" Is Taylor making a mistake?
  *   **A.** No. You can acknowledge a fact without it moving you. Taylor is honest, not broken.
  *   **B.** Yes. If you truly grasp that something is a "reason," you *feel* a pull. Taylor is claiming to see a reason but isn't moved, which is a contradiction.
  *   **C.** Yes, but not because of motivation. Taylor is damaging the machinery of their own agency. You can't consistently will your own destruction.

  **5. The Happy Lie**
  Casey can take a pill that will make them believe a happy lie (that their art is brilliant) for the rest of their life, or live a harder life knowing the truth (that their art is mediocre). Casey prefers the lie. Does Casey have a reason to choose the truth?
  *   **A.** No. Casey wants happiness. The lie provides it. That's the only reason that counts.
  *   **B.** Yes. Truth is valuable independently of whether we want it. Casey has a reason to face reality.
  *   **C.** Yes. Valuing truth is part of what it means to have a mind at all. Choosing the lie is a kind of suicide of the self.

  **6. The Costly Stranger**
  You can save a stranger from significant harm, but it will cost you a major life goal (like missing a championship game or a deadline). You don't know the stranger and don't care about them. Do you have a reason to help?
  *   **A.** No. The cost to your goals outweighs the benefit to a stranger you have no connection to.
  *   **B.** Yes. Their need is a reason, even if it's not strong enough to override your goals. It counts for something.
  *   **C.** Yes. If you were fully rational, you would see that your goals aren't more important than another person's basic welfare.

  **7. The Bored Prodigy**
  Riley has a natural talent for math but hates it. Riley would be happier and more fulfilled pursuing music. Does Riley have a reason to develop the math talent anyway?
  *   **A.** No. If Riley hates it and would be happier elsewhere, there's no reason to do math.
  *   **B.** Yes. Developing one's talents is objectively good, even if it makes you miserable.
  *   **C.** Yes, but only if Riley values "excellence" deep down. If Riley truly rejected all value in excellence, the reason would vanish.

  **8. The Final Choice**
  Imagine a person who has no desires, no goals, and no cares about anything (perhaps due to a rare condition). They are just sitting there. Do they have any reasons to get up and walk around?
  *   **A.** No. No desires means no reasons. They have no engine.
  *   **B.** Yes. There are things that are good for humans (movement, health) regardless of desire.
  *   **C.** Yes. Merely by being a person capable of action, they are bound by the norms of action. To act is to have reasons.

  ***

  # Scoring Key & Diagnosis

  **How to Score:**
  Tally which letter you chose most often.
  *   **Mostly A's:** The Strict Internalist
  *   **Mostly B's:** The External Realist
  *   **Mostly C's:** The Idealizer or Constitutivist
  *   **Mixed Bag:** See "The Fractured View" below.

  *(Note: In a few questions, the options shift slightly to fit the scenario, but the *logic* of A, B, and C remains consistent across the quiz.)*

  ### 1. The Strict Internalist (Mostly A's)
  **The Vibe:** "Reasons are psychological fuel."
  You believe that for something to count as a reason for *you*, it has to connect to something you actually care about (or would care about if you weren't ignorant or confused). If a consideration doesn't hook into your "subjective motivational set," it's not a reason for you; it's just a fact about the world.
  **Philosophical Company:** Bernard Williams, Simon Blackburn.
  **The Spiky Truth:** You are immune to moral scolding that doesn't resonate with your values, but you risk making reasons too fragile. If you change your desires, your reasons vanish. You also have to tell the "Cold Observer" (Q2) that they have no reason to stop torturing people if they don't care about suffering. That's a hard pill to swallow.

  ### 2. The External Realist (Mostly B's)
  **The Vibe:** "Reasons are facts, not feelings."
  You believe reasons exist independently of your psychology. Suffering is bad, truth is good, and health matters *whether or not* you care. You think the Internalist is confusing "having a reason" with "feeling motivated." You're comfortable saying someone can have a reason to do something even if no amount of thinking would ever make them want to do it.
  **Philosophical Company:** Derek Parfit, Thomas Nagel, David Enoch.
  **The Spiky Truth:** You save morality from the psychopath (Q2), but you make reasons mysterious. If a reason doesn't connect to what I want, how does it grab me? You have to believe in "normative facts" that float out there in the universe, waiting to be noticed. Critics call this queer; you call it objective.

  ### 3. The Idealizer / Constitutivist (Mostly C's)
  **The Vibe:** "Reasons come from your best self or your job description."
  You occupy the middle ground. You agree with Internalists that reasons must connect to the agent, but you think "the agent" isn't just their current messy desires. It's who they *would* be if they were rational (Idealizing Internalism) or what they *must* be to count as an agent at all (Constitutivism). You think the Shrugger (Q4) isn't just different; they're broken or irrational.
  **Philosophical Company:** Christine Korsgaard, David Velleman, Michael Smith.
  **The Spiky Truth:** You get to say the psychopath is making a mistake (Q2) without appealing to spooky external facts. But you walk a tightrope. If you define the "ideal self" too loosely, you're just an Internalist. If you define it too strictly, you're just an Externalist in disguise. Also, you have to tell people who reject your "ideal" that they are defective agents. Good luck with that at dinner parties.

  ### 4. The Fractured View (No Clear Majority)
  **The Vibe:** "It depends on the scenario."
  Most people are here. You might be an Externalist about morality (Q2) but an Internalist about prudence (Q1). This is a perfectly stable position, but it requires you to explain why reasons work one way in ethics and another way in self-interest.
  **Philosophical Company:** Most normal human beings.
  **The Spiky Truth:** You avoid the extremes, but you lack a unified theory. If reasons are internal for hobbies but external for murder, what *is* a reason? Is it one thing or two?

  ***

  # Empty Corners & Limitations

  **The "External Judgment Internalist" (The Empty Corner)**
  Did you choose **B** on Question 2 (External Reasons exist) but **B** on Question 4 (Judging a reason *necessarily* moves you)?
  Congratulations, you occupy a nearly empty corner of the philosophical map.
  *   **Why it's empty:** Usually, if you think reasons are external facts (B on Q2), you admit that people can know those facts and not care (The Amoralist). If you think recognizing a reason *forces* motivation (B on Q4), you usually think reasons are grounded in our own rational nature (C on Q2).
  *   **The Verdict:** This combination is logically possible but unstable. If reasons are external facts, why *must* they move us? If they must move us, aren't they internal to our rationality? If you hold this view, you believe in objective facts that somehow hack our motivational software automatically. You are rare.

  **The "Inert Externalist" (The Unexplored Valley)**
  Did you choose **B** on almost everything, but you also think that knowing these reasons doesn't necessarily motivate anyone?
  *   **The Verdict:** You are a classic External Realist, but you face the "So What?" challenge. If a reason can exist for a person but never motivate them, even in principle, does it do any work? You might believe reasons exist solely to license *criticism* (we can blame the psychopath) rather than to guide *action*. This is a coherent view, but it renders reasons toothless for the person holding them.

  **What This Quiz Can't Tell You**
  1.  **Error Theory vs. Internalism:** If you answered **A** mostly, you might be an Internalist (reasons are internal) OR an Error Theorist (there are no reasons at all, only desires). The quiz treats these similarly because they result in the same advice: "If you don't care, don't do it."
  2.  **The Source of Normativity:** The quiz distinguishes *where* reasons come from (desires vs. facts vs. agency), but it can't tell you *why* those things generate reasons. That requires a metaphysics test, not a intuition pump.
  3.  **The "Sound Deliberation" Gap:** In Question 1 and 3, the difference between Option A and Option C hinges on what counts as "sound deliberation." Internalists fight bloody wars over whether correcting a vice (like arrogance) counts as deliberation or changing the self. The quiz lumps these together for brevity.

  **Final Note for the Comment Section:**
  If you found yourself arguing with the wording of the scenarios ("But Alex *would* care if..."), you've just discovered the entire field of meta-ethics since 1980. Welcome to the war.
