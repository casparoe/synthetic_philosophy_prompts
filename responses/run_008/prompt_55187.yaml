answer: |-
  This is a precise diagnostic of the disciplinary self-conception of philosophy. The observation that philosophy departments treat the history of philosophy as *systematic* curriculum, whereas science departments treat the history of science as *contextual* curriculum, cuts to the bone of the "progress" debate.

  To answer your question, we must separate the **logical commitments** of the curriculum from the **sociological habits** of the profession, and then model the counterfactual where philosophy adopts the epistemic stance of the hard sciences.

  ### 1. Strict Presuppositions vs. Compatible Explanations

  You ask what the practice *strictly presupposes*. It is crucial not to conflate what the curriculum *implies* about the nature of truth with what it *requires* for pedagogical utility.

  **What the curriculum strictly presupposes:**
  1.  **The Problems are Path-Dependent:** It presupposes that you cannot fully understand the current state of a philosophical problem (e.g., the mind-body problem) without understanding the specific conceptual architecture built by Descartes or Kant. In physics, you can understand gravity via General Relativity without understanding Newton's *Principia*, because the math supersedes the conceptual framing. In philosophy, the *framing* is often the substance. The curriculum presupposes that the *genealogy of concepts* is part of the *content* of the concepts.
  2.  **The Arguments are Instruments, Not Just Claims:** It presupposes that the value of reading Kant is not merely to learn "what Kant thought" (which could be summarized in a textbook), but to practice the *activity* of navigating complex, high-stakes argumentation. It treats primary texts as gymnasiums for reasoning rather than repositories of data.
  3.  **No Definitive Refutation:** It strictly presupposes that no past major figure has been *decisively* refuted in a way that renders their text inert. If Hume were "phlogiston," reading the *Enquiry* would be like reading a treatise on caloric theory: interesting historically, but dangerous for learning current thermodynamics. The fact that Hume is taught in *Epistemology* (not *History of Ideas*) presupposes his arguments are still the best available tools for generating skeptical pressure.

  **What merely "fits well" (but is not required):**
  1.  **The "No Progress" Thesis:** The view that philosophy makes *no* cumulative progress fits the curriculum perfectly, but the curriculum does not *require* it. One could believe philosophy progresses (e.g., we have better logic now) but still believe that engaging with the "ur-texts" is the most efficient way to train the intuition required to make further progress.
  2.  **Scholastic Self-Perpetuation:** It fits well with the idea that the profession is a guild protecting its territory by requiring initiation rites (reading dense, old texts). This is likely sociologically true, but it is an explanation of *why the practice persists*, not what the practice *presupposes about truth*.

  **The "Phlogiston" Test:**
  Does the practice presuppose Descartes is not phlogiston? **Yes.** If Descartes were phlogiston, his dualism would be taught as a "historical error" in a single lecture within a Cognitive Science course. Instead, Dualism is taught as a *live option* (or at least a live target) in Metaphysics courses, often using Descartes' own text. The curriculum presupposes that the *Cartesian Theater* is not a falsified hypothesis, but a persistent structural feature of how humans conceptualize mind.

  ### 2. Can a Progress-Believer Justify the Kant Curriculum?

  Yes, a progress-believer (someone who thinks formal logic, decision theory, and scientific integration constitute progress) can coherently justify the history-heavy curriculum, but they must shift the justification from **content** to **method**.

  **The "Conceptual Geography" Justification:**
  A progress-believer argues that philosophy progresses by *dissolving* or *refining* questions, not just answering them. To know that a question has been dissolved, you must know what the question *was*.
  *   **Example:** We have made progress on "free will" via compatibilist frameworks and neuroscience. However, to understand *why* the hard incompatibilist position feels compelling, you need Kant. You need to feel the force of the *Critique* to understand why the progress you've made is significant.
  *   **The Coherent Position:** "Philosophy has progressed, but the progress is fragile and easily lost if we forget the conceptual traps that generated the problems. We read Kant not because he is right, but because he is the smartest person who was wrong, and understanding his error prevents us from repeating it."

  **The "Primary Source as Data" Justification:**
  In science, the data is the world. In philosophy, the data is often *our own intuitions and concepts*. The history of philosophy is a dataset of how high-intelligence humans have previously mapped these concepts. Ignoring it is like a physicist ignoring previous experimental results.

  **Where the Justification Fails:**
  The progress-believer cannot justify the **"Kant Scholar"** career track. If philosophy progresses like science, specialization should be by *problem area* (e.g., "Philosophy of Quantum Mechanics"), not by *historical figure* (e.g., "Kant Scholar"). A "Newton Scholar" in a physics department is a historian of science, not a physicist. The existence of "Kant Scholars" within *Philosophy Departments* (rather than History Departments) strictly presupposes that Kant's text contains inexhaustible philosophical truth, not just historical significance. A consistent progress-believer would view the "Kant Scholar" job description as an inefficiency.

  ### 3. The Counterfactual: If Philosophy Progressed Like Hard Science

  If we operated under the belief that philosophy accumulates settled results that render past frameworks obsolete, the curriculum and profession would undergo a radical transformation.

  **What Gets Cut:**
  1.  **History of Philosophy Sequences:** The "Ancient," "Modern," and "19th Century" requirements vanish. These become electives for those interested in intellectual history.
  2.  **Primary Source Exegesis:** Courses titled "Reading Kant" or "Seminar on Wittgenstein" disappear. You do not read Einstein to learn Relativity; you read a textbook. You would not read the *Critique of Pure Reason*; you would read a summary of "Transcendental Idealism" in a Metaphysics textbook, noted as a superseded framework.
  3.  **The "Scholar" Track:** Tenure lines defined by historical figures are converted to lines defined by problem domains (e.g., "Assistant Professor of Normative Ethics," not "Assistant Professor of Moral Philosophy with focus on Hume").

  **What Replaces It:**
  1.  **Textbook-Based Core:** Undergraduates would learn "Settled Philosophy." This might include:
      *   Classical and Bayesian Logic (as math).
      *   Standard Decision Theory.
      *   Consensus views in Philosophy of Mind (e.g., functionalism or physicalism, taught as the working hypothesis).
      *   Consensus views in Metaethics (if any exist).
  2.  **Integration with Empirical Science:** The curriculum would merge with Cognitive Science, Physics, and Economics. A "Metaphysics" course would look like "Foundations of Physics." An "Ethics" course would look like "Moral Psychology and Game Theory."
  3.  **Problem-Solving Labs:** Instead of writing essays interpreting texts, students would solve problems. "Here is a paradox in decision theory; propose a formal modification to resolve it."

  **What Would Be Lost:**
  1.  **The Ability to Question the Paradigm:** Science teaches you to work *within* a paradigm. Philosophy's history-heavy model teaches you to question *the paradigm itself*. By engaging with dead figures who operated under different assumptions, students learn that current assumptions are contingent. A "scientific" philosophy curriculum risks producing technicians who can optimize the current framework but cannot recognize when the framework itself is incoherent.
  2.  **Nuance and Ambiguity:** Textbooks flatten disagreement. Reading the *Meditations* forces you to grapple with ambiguity and the texture of argument. A textbook summary of Descartes gives you the "conclusion" without the "struggle." You lose the training in navigating uncertainty.
  3.  **The Humanistic Element:** The current model treats philosophy as a conversation across centuries. The scientific model treats it as a construction project. You lose the sense of connection to the "Great Conversation," which is a primary driver of student engagement and moral development.

  ### Summary

  The curricular practice of teaching history as core philosophy **strictly presupposes that philosophical problems are not solved by supersession, but by reinterpretation.** It assumes that the *argumentative moves* of the past are reusable tools, not discarded scaffolding.

  While a progress-believer can justify this as "training in conceptual geography," the existence of "Kant Scholars" within philosophy departments betrays a deeper commitment: it implies that the *source* of philosophical insight is not the current state of the art, but the depth of engagement with foundational texts.

  If philosophy truly believed it progressed like physics, it would fire the historians, write textbooks, and turn the "Kant Scholars" into historians of science. The fact that it hasn't suggests that, at an institutional level, philosophy believes its past is not a graveyard of errors, but a library of live ammunition.
