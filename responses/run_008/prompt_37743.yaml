answer: |-
  You have not mangled the terminology at all. In fact, you've grasped the central tension in modern normative ethics better than many undergraduates. The debate between the "Ought Implies Can" (OIC) crowd and the "Moral Residue" crowd is exactly where this philosophical battle is fought.

  The short answer to your question—"whichever way the philosophy actually goes"—is that **philosophy does not agree.** This is a live, unresolved war. However, the *nuance* of how they fight gives you specific tools for your novel.

  Here is the breakdown of the two camps, how they handle your specific questions, and how that translates to your character's ending.

  ---

  ### Camp 1: The Rationalists (No Genuine Dilemmas)
  **Core Principle:** *Ought Implies Can.*
  **Key Thinkers:** Kantians, many Utilitarians, W.D. Ross (with a caveat).

  **The Argument:**
  Logic dictates that if you are morally obligated to do X, it must be possible for you to do X. If your character *cannot* be in two places at once, she cannot be obligated to be in two places at once. Therefore, one of those "oughts" is not a real, final obligation. It might *feel* like an obligation, but upon rational reflection, one duty overrides the other.

  **Answering your Question 2 (Explaining away the residue):**
  This camp argues that moral residue (guilt, regret) is **psychological, not ontological.**
  *   **The Explanation:** The guilt is real pain, but it doesn't track a moral truth. It tracks an emotional attachment.
  *   **Is it irrational?** Not necessarily "irrational," but it is *non-cognitive*. It's like grieving a death that was inevitable. The grief is real, but it doesn't mean you could have prevented the death.
  *   **W.D. Ross's Compromise:** Philosopher W.D. Ross introduced *prima facie* duties. You have a duty to your mother and a duty to your sister. Both are real. But when they clash, one becomes your *actual* duty. The other doesn't disappear; it just gets overridden. The guilt you feel is the "friction" of the overridden duty. It proves you are a good person (because you recognize the duty), not that you did the wrong thing.

  **Novelistic Implication:**
  If you write from this perspective, the guilt is a **hurdle.**
  *   **The Arc:** Your character chooses the sister. She saves the sister. She feels guilty about the mother. The resolution of the book involves her realizing that saving the sister was the *objective* right choice. She learns to forgive herself.
  *   **The Theme:** Moral clarity is possible. We can find the right path through the noise.
  *   **The Risk:** It can feel didactic or tidy. If the mother dies and the sister lives, and the book says "You did the right thing, stop crying," it might feel emotionally false to the reader, even if it's logically sound.

  ---

  ### Camp 2: The Tragedians (Genuine Dilemmas Exist)
  **Core Principle:** *Moral Residue tracks Moral Reality.*
  **Key Thinkers:** Bernard Williams, Martha Nussbaum, Ruth Barcan Marcus, Walter Sinnott-Armstrong.

  **The Argument:**
  This camp argues that the world is messy and morality is not a clean mathematical equation. Sometimes, values are **incommensurable** (you can't measure them against each other on the same scale). A duty to a dying parent and a duty to a imperiled sibling might be of equal weight.
  *   **Answering your Question 1 (The OIC counter-attack):**
      They do bite the bullet, but they do it gracefully. They argue that OIC applies to *actions*, but not necessarily to *obligations*.
      *   **Sinnott-Armstrong's View:** You can have an obligation you cannot fulfill. The fact that you can't do it doesn't make the obligation vanish; it just means you are doomed to violate *something*.
      *   **The "Remainder":** When you make the choice, you don't just "override" the other duty; you **violate** it. You do something wrong to save someone else. The "residue" (guilt) is the rational recognition that you have committed a moral violation, even if it was the *best available* option.

  **Novelistic Implication:**
  If you write from this perspective, the guilt is a **scar.**
  *   **The Arc:** Your character chooses the sister. She saves the sister. She feels guilty about the mother. The resolution is *not* forgiveness. The resolution is integration. She accepts that she is now a person who let her mother die alone. She carries that weight.
  *   **The Theme:** Life is tragic. Doing the "best" thing still costs something real. Goodness does not guarantee a clean conscience.
  *   **The Benefit:** This is usually more compelling in literature. It aligns with the reader's intuition that losing a mother is a catastrophic loss that shouldn't be "solved" by the fact that the sister is safe.

  ---

  ### The Crucial Distinction: "Wrongdoing" vs. "Moral Loss"

  There is a third concept, pioneered by **Bernard Williams**, called **Agent-Regret**. This might be the most useful tool for your book.

  Williams argues that you can regret an outcome *because you were the agent of it*, even if you did the right thing.
  *   **Example:** A truck driver who hits a child through no fault of his own (the child ran out). The driver isn't "guilty" (he didn't do wrong), but he feels "agent-regret" that *he* was the one who hit the child.
  *   **Applied to your novel:** Your character doesn't have to believe she did the *wrong* thing to feel the guilt. She feels the guilt because *she* is the one who wasn't there.

  **How to write this:**
  *   **Irrational Guilt (Camp 1):** She thinks, "I am a bad daughter." (This is a cognitive error she must fix).
  *   **Agent-Regret (Williams):** She thinks, "I am the person who wasn't there." (This is a fact she must live with).

  ### Recommendation for the Novel

  You asked: *"If the residue is just her being irrational, I should write the guilt as something she needs to get over. If the residue tracks a real moral loss, then the ending where she never fully forgives herself is the honest one."*

  **Go with the "Real Moral Loss" (Camp 2/Williams).**

  Here is why, from a storytelling perspective:
  1.  **Stakes:** If one option is clearly "Right," the tension evaporates once she figures it out. If both options demand a piece of her soul, the tension persists until the last page.
  2.  **Character Depth:** A character who "gets over" abandoning her dying mother risks seeming sociopathic or too neatly healed. A character who saves her sister but is forever haunted by the mother's voice is complex.
  3.  **Philosophical Honesty:** Even if the philosophers in Camp 1 are logically correct, the *phenomenology* (the lived experience) of Camp 2 is more human. We do not experience hard choices as math problems; we experience them as tears in the fabric of our lives.

  **How to execute the "Residue" ending without making her depressed:**
  Don't write the guilt as a paralysis. Write it as a **cost.**
  *   She saves the sister.
  *   The sister is grateful.
  *   The character accepts the gratitude, but she knows she paid for it with her mother's final moments.
  *   She doesn't seek forgiveness (because there is none to be had from the dead). She seeks **atonement** or **endurance**.

  **Terminology Check:**
  *   You used **"Moral Residue"** correctly. (Sometimes called "Tragic Remainder").
  *   You used **"Ought Implies Can"** correctly.
  *   You used **"Genuine Moral Dilemma"** correctly.
  *   **One addition:** Look up **"Incommensurability."** This is the idea that the value of "being with mother" and "saving sister" cannot be measured on the same scale. This supports the "Genuine Dilemma" view.

  **Summary:**
  Philosophy doesn't settle this, but **Literature** usually sides with the Residue Camp. If you write the guilt as something she must "get over," you risk minimizing the loss of the mother. If you write the guilt as a fitting response to a tragic loss, you honor both the sister's life and the mother's death.

  Let her choose. Let her save the sister. Let her never quite forgive herself. That is where the story lives.
