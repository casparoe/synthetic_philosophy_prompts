prompt: |-
  Two friends of mine got into it after a talk on cosmology and asked me to referee, and honestly I couldn't. The topic was why there's something rather than nothing. Maya's opening line was that nothingness is the simpler state, so the existence of anything at all is what calls for a special explanation — you don't ask why nothing happened, you ask why something did. Dev said that's backwards: nothing isn't a rival hypothesis that "lost out" to being. There was never a lottery between existence and non-existence, so asking why being won is confused at the start. Then it went like this. (1) Maya said simpler things need less explaining, and nothing is the simplest thing there could be — so treating something as the thing needing the extra story isn't bias, it's just how explanation works. (2) Dev said "nothing is simple" already smuggles in what he's denying: calling it simple treats nothing as a state things could be in, but nothing is the absence of everything, so it can't be a default any more than it can be a non-default — there's no fact there to be either. (3) Maya pointed out that physicists themselves talk about the universe arising from a quantum nothing, so clearly "nothing" does explanatory work and isn't incoherent on its face. (4) Dev said the physicists' nothing is a quantum vacuum — fields, laws, the whole apparatus — which is something, and that this proves his point rather than hers. And he added that any "why" question needs a cause or a law to lean on, so demanding an explanation of the existence of explanations is asking for something that couldn't exist. (5) Maya said fine, maybe every chain of explanation has to stop somewhere — but then the honest answer is "brute fact," not "bad question," and Dev kept sliding between those two without flagging it. Can you take it move by move, say who's right at each step (not just who wins overall), and tell me whether Maya's final complaint about the slide is actually fair?
