answer: |-
  You have essentially reinvented **Functional Decision Theory (FDT)**, but you are stumbling over the exact boundary condition that separates FDT from Causal Decision Theory (CDT) and Evidential Decision Theory (EDT).

  You are asking for a triage of your commitments. Here is the ranking of tensions by severity, followed by the diagnosis and the cheapest patch.

  ### 1. The Tension Ranking

  **Severity: CRITICAL — "Strangers reason like me" vs. "Defect against strangers"**
  This is the engine failure. Your theory states: *Cooperation is warranted when agents run the same decision procedure.* You observe: *Strangers run roughly the same procedure.* You conclude: *Defect.*
  This is a direct contradiction. If your decision theory says "outputs correlate when algorithms match," and you believe the algorithms match, your math forces you to Cooperate. You cannot have superrationality without the correlation that drives it. If you defect, you are implicitly claiming the algorithms *don't* match in the relevant way.

  **Severity: MODERATE — Hitchhiker vs. PD Stranger Intuition**
  You feel Paying (Hitchhiker) and Defecting (PD Stranger) are consistent, while critics say they aren't.
  *   **Why critics say it's inconsistent:** Both cases involve a "causally inert" moment. In Hitchhiker, the driver is gone. In PD, the other player's move is already determined (by physics/logic) even if you don't know it. If you accept logical correlation in one (Hitchhiker), why not the other?
  *   **Why it feels consistent to you:** In Hitchhiker, the driver *modeled* you. Your algorithm caused the prediction. In PD Stranger, the stranger did not model you.
  *   **Verdict:** This is solvable, but it requires a precise definition of "logical correlation" (see below). It is less severe than the first tension because it's a definitional nuance, not a direct contradiction of input/output.

  **Severity: LOW — Implementation Details**
  Your commitment that substrate doesn't matter (brain scan vs. simulation) is actually the strongest part of your position. This is standard FDT/TDT doctrine and creates no internal conflict. It only creates conflict if you try to draw the line at "biological humans" vs "copies," which you explicitly said you wouldn't do.

  ---

  ### 2. The Diagnosis: The "Same Procedure" Leak

  The problem is your definition of **"Same Decision Procedure."**

  You are defining it as *"reasoning through the question roughly the same way."*
  FDT defines it as *"logical subjunctive dependence."*

  Here is the leak: Most humans are **not** running the same decision procedure as you, even if they use similar words to describe it.
  *   **You** are running FDT: "I choose the output of my algorithm that yields the best world, acknowledging that my algorithm's output is logically correlated with the other player's."
  *   **The Stranger** is running CDT: "I choose the action that causally yields the best outcome, assuming the other player's move is fixed."

  Even if the stranger concludes "Defect" and you conclude "Defect," you did not arrive there via the *same function*. They arrived there via causal dominance. You arrived there via... well, if you are consistent, you should arrive at *Cooperate* against another FDT agent.

  **The Conflict:**
  If you truly believe strangers are running **your** algorithm (FDT), you **must cooperate**. Two FDT agents playing a one-shot PD with common knowledge of each other's rationality will cooperate, because their outputs are logically linked.
  If you want to **defect**, you must believe the strangers are **not** running your algorithm. They are running CDT.

  ### 3. The Cheapest Patch

  You do not need to give up One-Boxing.
  You do not need to give up Paying the Hitchhiker.
  You do not need to give up Cooperating with Copies.

  **You must give up the empirical claim that "most humans reason roughly the way I do."**

  This is the cheapest patch because it is empirically true and saves your entire theoretical framework.

  **The Patched Position:**
  1.  **Theory:** Cooperation is warranted when there is **logical subjunctive dependence** between my output and the other player's output (or the predictor's prediction).
  2.  **Copies/Newcomb/Hitchhiker:** Dependence exists. (Copy is identical; Predictor simulated me). **Result:** Cooperate/Pay/One-Box.
  3.  **PD Stranger:** Dependence does **not** exist. The stranger is not simulating me, nor are we clones. Crucially, the stranger is **not running FDT**. They are running CDT. Their decision is not a function of my algorithm's output; it is a function of their own causal reasoning.
  4.  **Result:** Defect.

  **Why this fixes the Hitchhiker Intuition:**
  This explains why Hitchhiker feels different from PD Stranger.
  *   **Hitchhiker:** The driver *accessed* your algorithm (via prediction). There is a logical link.
  *   **PD Stranger:** The stranger did *not* access your algorithm. There is no logical link, only a statistical one (which CDT/FDT agree is insufficient for cooperation in the absence of a common cause).

  ### 4. Summary of What Has to Give

  1.  **Drop:** The belief that random strangers are "reasoning through it roughly the way I do." They are reasoning *about* it, but they are using a different decision theory (CDT) than you (FDT).
  2.  **Keep:** The distinction that cooperation requires logical correlation, not just causal independence.
  3.  **Refine:** Your definition of "Same Procedure." It doesn't mean "similar internal monologue." It means "output is logically determined by the same abstract function."

  **Final Verdict:**
  Your intuition to Defect against strangers is correct *for an FDT agent in a world of CDT agents*. Your intuition to Cooperate with copies is correct *for an FDT agent in a world of FDT agents/clones*. The friction comes from assuming the real world is populated by FDT agents. It isn't. Once you update that empirical belief, your decision theory snaps into consistency.
