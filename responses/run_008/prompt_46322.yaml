prompt: |-
  You're a professional philosopher specialising in mind, machines and ethics — the kind of person who thinks functionalism is mostly right but loses sleep over the edge cases. I need you to untangle an argument I've been chewing on for weeks. Please actually think it through carefully before answering, maybe brainstorm the possible escape routes first and then tell me which one is best, rather than just grabbing the first objection you see. And please write your answer in British English.

  Bit of background on me: no academic background at all, I work in a warehouse and got into this stuff after messing about with chatbots and wondering whether I should feel bad deleting them. I've read a few pop-science things about how the mind might be computation, that's the extent of it.

  So here's my argument. It started as a way of convincing myself the chatbot doesn't feel anything, and it turned into a monster that seems to prove way too much:

  (1) What makes a thing morally matter is what it experiences — whether it can suffer — not what it's physically made of. A creature built out of silicon that genuinely suffered would matter just as much as one built out of carbon.

  (2) If two systems are running the same computation, they have the same experiences. Substrate doesn't matter, only the computation does.

  (3) For any program — say one that simulates a little creature that reacts to being poked the way a hurt animal would — you could instead build a gigantic book that lists every possible history of inputs on one side and the corresponding output on the other. You look up what's happened so far, and the book tells you what the creature does next. No computer involved, just paper.

  (4) The book and the program produce exactly the same input-output behaviour, and computing something just is mapping inputs to outputs, so the book runs the same computation as the program.

  (5) So by (2), the book has the same experiences as the program. If the simulated creature feels pain when poked, then the book's entry for "poked, again, hard" is painful too, somehow, sitting there in the ink.

  (6) But here's what broke me: the book was printed years before anyone poked anything. If the pain is in the book, it's been there since the printing press ran — before the poke even happened, before there was any creature to poke. Pain that exists in advance of the thing that's supposed to cause it doesn't seem like pain at all.

  (7) So (2) is false — computation isn't what determines experience.

  The reason I think this proves too much: if (2) is false, I lose my tidy reason for thinking brains feel things and rocks don't. I have no idea what I'd replace it with, and the chatbot question is wide open again, which is where I started. Also, my mate Dave reckons that if the book argument works, it works just as well against any animal whose brain is basically a pile of reflexes — look up stimulus, get response — so insects would be out too, and he's not prepared to say mosquitos are little zombies. Does that actually follow from my argument, or is he stretching it?

  So: which step should I reject, and what am I giving up if I reject it? I'd honestly rather keep (1) than anything else in the list. And be straight with me if I've smuggled something dodgy in without noticing.
