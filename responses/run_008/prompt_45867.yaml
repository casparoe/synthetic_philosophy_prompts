  TO: Interpretation Committee
  FROM: [Your Name]
  DATE: October 26, 2023
  SUBJECT: Decision Memo: Famine Gallery Wall Text

  We are deadlocked over grammar, but we are deciding over history. Draft A makes "drought" the subject; Draft B makes "policy" the subject. As a novelist, I know this shifts agency. As a historian, I must ask which subject the archive supports.

  The archive resolves the entitlement question definitively. Rainfall data shows a moderate deficit, not total crop failure. This was not solely a Food Availability Decline. Simultaneously, grain exports continued and rural wages collapsed faster than prices rose. Mortality concentrated among landless laborers, not landholders. This aligns with Amartya Sen's entitlement theory: people starved not because food was absent, but because their economic capacity to claim it was destroyed. Draft A is therefore factually insufficient; it describes a natural disaster where the archive describes a structural one. To adopt A would be to sanitize the record.

  However, the Trustees' concern is legitimate. A museum is not a courtroom. Draft B's phrase "policy failed" and "preventable deaths" functions as a verdict. While historically defensible, it risks turning the gallery into a polemic, alienating the community and donors whose support ensures this history is told at all. We must honor the dead without indicting the living descendants of those who administered relief, however poorly. The curators fear that softening this language absolves the administration; the trustees fear that sharpening it prosecutes them. Both fears are valid.

  Therefore, I recommend we adopt neither A nor B, but a third text that retains the archive's precision without the courtroom's tone.

  **Proposed Draft C:**
  "Between 1896 and 1898, moderate drought strained harvests; however, continued grain exports and collapsing wages denied laborers access to available food. Tens of thousands died."

  This text acknowledges the drought (satisfying A) but identifies the economic mechanisms (exports, wages) that caused mortality (satisfying B). It replaces the moral judgment "failed" with the structural observation "denied access." It removes "preventable," which implies intent, and replaces it with the demonstrable fact that food was "available." This satisfies the entitlement thesis without assigning malicious intent. It tells the truth about the mechanism of death without requiring a judge's gavel.

  To resolve future deadlocks on the remaining 200 labels, I propose we adopt the following three criteria for agency and voice:

  1.  **Verify the Subject:** Every label must identify the primary actor. If a process is natural (drought, blight), use intransitive verbs. If a process is human (exports, relief works, tax collection), use transitive verbs. Do not allow human decisions to hide behind passive voice or naturalizing metaphors.
  2.  **Distinguish Mechanism from Judgment:** Describe *how* an outcome occurred (e.g., "wages fell below subsistence") rather than *why* it was moral or immoral (e.g., "cruel wages"). Let the evidence imply the judgment. Our role is to illuminate the structure of suffering, not to assign moral culpability to specific individuals.
  3.  **Test for Entitlement:** When describing scarcity, always verify if food was physically absent or economically inaccessible. If the latter, the text must reflect the economic barrier, not just the shortage.

  Draft A protects the donors but distorts the archive. Draft B protects the archive but endangers the institution's broader mission. Draft C allows us to tell the truth without turning the gallery into a trial. We can honor the victims by accurately describing how they were lost, without needing to name the executioners to do so.

  I move we adopt Draft C.
