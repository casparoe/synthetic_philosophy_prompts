  2.  **Determine the Recommendation:**
      *   Draft A is historically inaccurate based on the archive (it wasn't just drought; exports continued, wages collapsed). It hides agency.
      *   Draft B is historically accurate but potentially too polemical for a permanent gallery ("preventable deaths," "policy failed"). It risks alienating donors/trustees.
      *   Draft C (Synthesis): Needs to be accurate (acknowledging entitlement failure) without being overly litigious (avoiding "preventable" or direct accusation if possible, while still assigning agency).
      *   *Decision:* Propose a third text (Draft C). It allows for historical accuracy (Sen's entitlement theory supported by archive) while mitigating the "courtroom" feel by focusing on structural mechanisms rather than moral judgment words like "failed" or "preventable."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
