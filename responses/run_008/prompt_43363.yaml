answer: |-
  The central question of this proposed research project is whether the phenomenon of information cascades remains robust when the order of decision-making is endogenous rather than exogenously imposed. Classic models of rational herding and information cascades rest on a foundational assumption that agents act in a fixed, known sequence, observing only the actions of their predecessors. Under these conditions, once a sufficient number of early actors make the same choice, later agents rationally ignore their own private information and follow the crowd, creating a cascade where public history overwhelms private signals. However, in many real-world settings ranging from financial markets to consumer adoption, the order of action is not imposed by an experimenter or a rigid protocol but is chosen by the agents themselves. A depositor deciding whether to withdraw funds, a consumer deciding whether to adopt a new technology, or a reviewer deciding whether to post a rating can all choose to wait. If this waiting is observable, the timing of an action becomes a signal in itself. An agent who acts immediately may reveal high confidence in their private information, whereas an agent who delays may reveal uncertainty or an absence of informative signals. My hypothesis is that once timing is endogenous and observable, the logic of cascades partly undoes itself, since the silence that typically sustains a cascade becomes informative, and forward-looking agents should account for this when inferring the state of the world. This project seeks funding to develop a combined theory and experiment program that asks whether information cascades are robust to endogenous timing, and if they are not, what institutional details, such as deadlines that force simultaneous decisions, opaque order of action, or visible queues, restore them or break them further.

  The standard cascade results leave this question open because they treat the sequence of moves as a primitive of the model rather than an equilibrium outcome. By assuming exogenous order, existing theory sidesteps the strategic value of timing. If an agent can delay, the cost of waiting must be weighed against the benefit of observing others, but crucially, the act of waiting also reveals information to others. This creates a signaling game embedded within the learning problem. If high-signal agents act early and low-signal agents wait, the mere observation of an early action conveys more than just the choice itself; it conveys the precision of the information underlying that choice. This could theoretically prevent cascades from forming because later agents can distinguish between a herd driven by strong signals and a herd driven by the mere accumulation of weak signals from agents who happened to move early. However, it is also possible that strategic complementarities or coordination motives could sustain herding even with endogenous timing, particularly if waiting is costly. The literature currently lacks a formal treatment of this timing dimension, leaving a gap in our understanding of how social learning functions when agents control the tempo of their participation.

  To address this, the first phase of the project, spanning months one through four, will focus on theoretical model building. I will construct a game-theoretic model where a finite number of agents receive private signals about an underlying state and choose both an action and a timing within a continuous or discrete window. The model will incorporate a cost of delay to prevent indefinite waiting and ensure equilibrium existence. The primary theoretical deliverable will be a characterization of the perfect Bayesian equilibrium, specifically examining whether a cascade region exists where agents ignore private signals regardless of timing, or whether the equilibrium separates types based on when they act. I will derive comparative statics regarding the cost of waiting and the precision of private signals. If the theory yields a determinate prediction that endogenous timing disrupts cascades, this will form the null hypothesis for the experimental phase. If the model proves intractable in continuous time, I will discretize the timing periods to ensure solvability, ensuring the theoretical groundwork is solid before proceeding to human subjects research.

  The second phase, running from month five to month nine, will involve laboratory experiments designed to test the theoretical predictions and explore institutional variations. The baseline treatment will replicate the standard exogenous order cascade experiment to establish a control group where herding is expected to occur. The primary treatment will introduce endogenous timing, allowing subjects to choose when to submit their decision within a fixed window, with their timing visible to subsequent actors. To determine what counts as the cascade surviving versus collapsing, I will measure the rate at which subjects deviate from their private signals when public history suggests a contrary action. In the baseline, high deviation rates indicate a cascade. In the endogenous timing treatment, a collapse of the cascade would be evidenced by a significant reduction in this deviation rate, implying subjects are using timing information to weight private signals more heavily. Beyond this core comparison, I will implement additional treatments to test institutional details. One treatment will impose a hard deadline that forces simultaneous decisions after a waiting period, testing whether forced synchronization restores herding. Another treatment will make the order of action opaque, so subjects see actions but not when they occurred relative to others, isolating the effect of timing visibility. A final treatment will introduce a visible queue, simulating settings where waiting is public but the identity of those waiting is unknown. These contrasts will allow us to pinpoint exactly which institutional features sustain social learning and which trigger inefficient herding.

  The final three months, from month ten to month twelve, will be dedicated to data analysis and dissemination. I will estimate structural parameters to quantify the weight subjects place on timing information relative to action information and write up the results for publication. An honest account of the risks involved must acknowledge that the project could fail or turn out to be trivial in several ways. Theoretically, the model may yield multiple equilibria that are difficult to refine, making the predictions ambiguous. If the equilibrium is pooling regardless of timing, the theoretical contribution would be limited to confirming the robustness of standard results. Experimentally, subjects might fail to understand the strategic implications of timing, treating the decision as a simple choice without regard for the signaling value of delay. If subjects ignore timing entirely due to cognitive constraints, the result would be a null effect that confirms the standard model only by virtue of behavioral friction rather than rational calculation. Additionally, if the cost of waiting is calibrated poorly, either too high or too low, it could swamp the signaling effect, rendering the treatments indistinguishable. I will mitigate these risks through pilot sessions to calibrate costs and instructions, and by designing the theoretical model to accommodate bounded rationality if the fully rational model proves too fragile.

  The answer to this question matters significantly outside the laboratory, particularly for the design of product review systems and the regulation of financial platforms. In online marketplaces, platforms often display reviews chronologically, implicitly encouraging early adoption. If endogenous timing breaks cascades, platforms might benefit from hiding timestamps to encourage more herding and faster adoption of popular items. Conversely, if timing reveals quality, highlighting when a review was posted could protect consumers from early, low-information herding. In financial contexts, the logic applies directly to bank runs. If depositors can observe others waiting to withdraw, this silence might signal confidence in the bank's solvency, potentially stabilizing the system. However, if institutional structures obscure timing or force simultaneous decisions, such as during a trading halt or a coordinated withdrawal window, the stabilizing signal of waiting is lost, potentially exacerbating panic. Understanding whether the silence of the crowd is informative or merely empty is crucial for designing institutions that either harness the efficiency of social learning or protect against the fragility of rational herding. This project will provide the first systematic evidence on whether the timing of action is a mere detail or a fundamental determinant of collective behavior.
