  The debrief
  Reveal the term "Pascal's Mugging." Explain that the activity simulated the conflict between Expected Value reasoning and epistemic humility. EV reasoning compels acceptance because any non-zero probability multiplied by huge utility equals huge value. Your refusal implies a hidden rule: "Ignore probabilities below threshold X." Discuss the cost of this rule. If X is 1%, you safely ignore the mugger but also ignore asteroid impacts or engineered pandemics—low-probability, high-stakes risks relevant to your article. If X is 0%, you are vulnerable to every fantastical claim. The activity demonstrates why existential risk is hard to reason about: the same heuristic that protects you from scams also blinds you to extinction events. The "mugger" isn't the person; it's the math. The solution isn't obvious, which is why your readers struggle. This tension is the core of your feature: how to act on faint signals of catastrophe without becoming paralyzed by every hypothetical doom. Ask the group: "What rule would you adopt now?" There is no right answer, only trade-offs. Connect this to superintelligence: if the payoff is infinite survival, even a tiny probability demands massive investment. But if the claim is nonsense, that investment is wasted. The group must feel the weight of that uncertainty. Emphasize that rationality itself is the problem here.

  What will go wrong the first time
  Participants may treat the pitches as comedy, undermining the stakes. Proposers might fail the math constraint (making EV negative), breaking the trap. Deciders might collude to "bankrupt" the facilitator, missing the point. Some will refuse to calculate, dismissing the exercise as absurd. The facilitator might struggle to keep the EV calculation neutral without validating the claims. Time management is risky; pitches can ramble. Ensure the prize incentive is clear; if tokens feel worthless, the dilemma vanishes. Watch for dominant voices swaying the group during deliberation. If the facilitator laughs, the tension breaks. Prepare a script to redirect humor back to the decision matrix. Have backup numbers ready if Proposers write impossible math.

  What the activity cannot reproduce
  This cannot reproduce the visceral fear of actual extinction or financial ruin. Real existential risks involve complex scientific models, not simple envelopes. It abstracts away the political and social costs of acting on low-probability risks. Participants know it's a game; real decision-makers face career risk. It cannot simulate the cumulative burden of many small "muggings" over a lifetime. The activity simplifies probability assessment; real science requires expert consensus, not just a number.
