answer: |-
  This is a remarkably precise phenomenological description. You have isolated a tension that sits right at the fault line between the Strawsonian practice of holding responsible and the metaphysical reality of causal history. You are correct that the standard shelves (excuses, exemptions, moral luck) do not quite fit, because they operate on the *normative status* of the act or agent, whereas your observation concerns the *affective accessibility* of the agent as a target.

  Here is the breakdown of the nearest concepts, why they miss, and a proposal for what is actually happening.

  ### 1. The Nearest Misses

  **A. Strawson's "Objective Attitude"**
  In *Freedom and Resentment*, P.F. Strawson distinguishes between **reactive attitudes** (resentment, gratitude, indignation), which we hold toward "participants" in moral life, and the **objective attitude**, which we hold toward "objects" (those exempted by insanity, infancy, or extreme coercion).
  *   **The Fit:** Your description of the wrongdoer looking like "the output of a mechanism" or "weather" is a perfect description of adopting the Objective Attitude. You are viewing them as something to be managed or understood, rather than a will to be reckoned with.
  *   **The Miss:** For Strawson, the Objective Attitude is generally global or tied to *exemption* (they are not a full moral agent). You are applying it *locally* (to this act, not the person) and *without exemption* (you still judge the act wrong and them culpable). You are treating a full participant as a mechanism *piecemeal*. Strawson warns that sustaining the Objective Attitude toward loved ones is inhuman; you are finding it humanizing (pity), but unstable (the tyre needs pumping).

  **B. The Fundamental Attribution Error (Psychology)**
  This is the cognitive bias where we over-emphasize dispositional traits ("he is vicious") and under-emphasize situational factors ("he is grieving") when judging others.
  *   **The Fit:** This explains the *mechanism* of the shift. The backstory forces a shift from dispositional to situational attribution.
  *   **The Miss:** This is descriptive, not normative. It explains *that* you stop resenting, but not whether you *should*. It also doesn't capture the symmetry with admiration. If I learn a "self-made" hero had rich parents, my admiration deflates. That isn't an attribution error; it's a re-evaluation of merit.

  **C. Constitutive Moral Luck (Nagel)**
  Nagel argues we are judged on things outside our control (temperament, upbringing).
  *   **The Fit:** The backstory reveals the luck involved in their character formation.
  *   **The Miss:** As you noted, moral luck usually problematizes the *judgment* itself (i.e., "maybe they aren't culpable"). You are keeping the judgment of culpability intact while losing the *heat* of the resentment. The luck explains the feeling, but shouldn't, by your own lights, change the blame.

  ### 2. The Coinage: Provenance Deflation

  Since no existing term captures the piecemeal, non-exempting, symmetrical nature of this shift, I propose we call this **Provenance Deflation**.

  **Definition:** *Provenance Deflation* is the reduction of reactive attitudes (blame or admiration) toward an agent, triggered not by excusing conditions or a change in the act's moral quality, but by the salience of the causal history (provenance) of the agent's character. It occurs when the agent is perceived less as a **locus of origination** and more as a **locus of transmission**.

  **Why "Provenance"?**
  In art, provenance determines value. A painting is the same object, but if its provenance reveals it was a forgery or a student work rather than a master's, our aesthetic stance shifts. Similarly, in ethics, the "act" is the same, but when the provenance of the *will* becomes visible, the moral stance shifts.

  **Why "Deflation"?**
  It works symmetrically. It deflates the high pressure of resentment, but it also deflates the high pressure of admiration. It reduces the *magnitude* of the reactive attitude without necessarily negating its *direction* (you still think the act was bad/good).

  ### 3. What the Detail is Actually Doing

  You ask if this is a rational update or a psychological seduction. Under the lens of Provenance Deflation, it is a **Stance-Shift regarding Sourcehood.**

  **1. The Illusion of the Black Box**
  Reactive attitudes (resentment/admiration) require the agent to be a "black box." We punish the box because we treat the output as originating *in* the box. When you learn the backstory, the box becomes transparent. You see the gears (trauma, privilege, biology) turning inside.
  *   **Rational Update?** If you believe that *ultimate* sourcehood is required for full desert, then yes, learning the gears are external is a rational update.
  *   **Psychological Seduction?** If you are a compatibilist (which your "abstract belief" suggests you might be), then the gears *being there* doesn't change responsibility. In this light, Provenance Deflation is a seduction. It mimics the logic of exemption without the warrant.

  **2. The Role of Narrative Specificity**
  You noted abstract determinism doesn't work, but specific stories do. This is because abstract determinism is a *theory*, while a backstory is an *image*.
  *   Resentment is an emotional response to a perceived threat/insult.
  *   Pity/Understanding is an emotional response to a perceived vulnerability.
  *   The specific story provides the **imagistic cues** for vulnerability. It allows you to categorize the harm as "collateral damage of their history" rather than "targeted aggression." It re-categorizes the event from **Interpersonal** (You vs. Me) to **Impersonal** (Me vs. The Causal Chain).

  ### 4. Edges and Boundaries of Provenance Deflation

  To test if this concept holds, we apply your constraints:

  **A. Does it require the backstory to be sad?**
  *   **No.** It requires the backstory to be *determinative*.
  *   *Test Case:* If you learn a colleague is vicious simply because they were spoiled rotten and never told "no," your resentment might not turn to pity, but it will turn to contempt or dismissal. The *heat* of the personal resentment still deflates. They become "spoiled goods" rather than "enemy." The admiration case confirms this: learning of unearned advantage deflates admiration without requiring sadness.

  **B. Does it work for third parties (e.g., a Juror)?**
  *   **Normatively, it should not.** In a legal context, we explicitly bracket Provenance Deflation. We allow "mitigating circumstances" (excuses), but we do not allow "he had a bad childhood" as a general defense for a competent adult.
  *   **Descriptively, it does.** Jurors *are* susceptible to Provenance Deflation. This is why defense attorneys provide backstories even when they don't meet the legal bar for insanity. They are inducing Provenance Deflation to lower the "moral temperature" of the room, hoping it bleeds into the verdict. A robust justice system tries to inoculate jurors against this; your personal life invites it.

  **C. Does it survive the story wearing off? (The Tyre Problem)**
  *   **No, and this is crucial.** Provenance Deflation is not a *discovery*; it is a *practice*.
  *   When you learn the story, you adopt the **Objective Stance** temporarily. But because the agent is still a *participant* (they are still walking around, still capable of choice), the default human setting is to revert to the **Reactive Stance**.
  *   The "pumping" you describe is the cognitive labor of maintaining the Objective Stance toward a Participant. Strawson argued this is unsustainable generally; you are finding it unsustainable specifically. It requires active **narrative maintenance**. If you stop rehearsing the causal story, the "black box" closes, and the agent looks like a source of will again.

  ### 5. Conclusion: Rational or Seduction?

  It is a **Rational Seduction**.

  It is **Rational** in the sense that it aligns your emotional response with your metaphysical belief (that actions have causes). It makes your inner life consistent with your philosophy.

  It is a **Seduction** because it bypasses the normative requirements of responsibility. It grants you the peace of determinism without the cost of abandoning the practice of blame. You get to keep judging them (which feels just) while losing the pain of resentment (which feels good).

  The fact that it works on admiration proves it is not about *mercy*; it is about **agency**. You are not forgiving them; you are dissolving the "them" that could be blamed. The "them" becomes a vessel for prior causes.

  **Summary Term:** **Provenance Deflation**.
  **Definition:** The piecemeal reduction of reactive attitudes (blame/praise) resulting from the salience of an agent's causal history, rendering the agent a locus of transmission rather than origination, requiring narrative maintenance to sustain.

  It is a philosophical hack: using the truth of causality to disable the pain of responsibility, without formally abandoning the language of right and wrong. It is not a bug in your moral operating system; it is a feature of being a determinist living in a reactive world.
