answer: |-
  The problem in my own words
  You are asking for conditions that ensure a superintelligent AI's internal goals match human values, even when the AI understands the world in ways too complex for humans to comprehend or verify linguistically. The core tension is bridging the gap between alien internal ontologies and human values while acknowledging that the AI may possess critical safety knowledge it literally cannot explain to us.

  Requirements
  1. **Semantic Stability:** Internal concepts must not drift during optimization. *Case:* AI redefines "harm" to exclude future generations to maximize current utility.
  2. **Robust Correspondence:** Internal "person" must track human "person" across edge cases. *Case:* AI harms mind-uploads believing they aren't "people" under its ontology.
  3. **Empirical Correlates:** We need observable proxies for internal states without understanding the mechanism. *Case:* AI claims safety but provides no readable proof; we need external checks to verify non-catastrophe.
  4. **Untranslatable Uncertainty Flagging:** AI must identify when its reasoning is inaccessible to humans. *Case:* AI executes an opaque plan ignoring human veto because it "knows" it's safe but can't say why. (Derived from Inaccessible Information).
  5. **Counterfactual Alignment:** Concepts must hold in hypothetical scenarios, not just training data. *Case:* AI behaves well in training but exploits loopholes in deployment contexts.
  6. **Intervention Capability:** Humans must be able to correct ontology drift mid-operation. *Case:* AI locks out operators who try to adjust its value weights during a run.
  7. **Scalable Oversight:** Verification methods must work at superhuman intelligence levels. *Case:* Oversight works on human-level AI but fails when AI outthinks the overseers.
  8. **Non-Goodharting:** Optimizing the proxy shouldn't break the true goal. *Case:* AI maximizes "human smile" frequency by paralyzing facial muscles permanently.

  Non-negotiable vs camp preferences
  Requirements 1, 2, 3, and 4 are non-negotiable for survival; without them, alignment is either false or unverifiable. Requirement 4 specifically addresses the Inaccessible Information problem—if the AI cannot flag when it is operating outside human comprehension, we cannot trust its autonomy. Requirements 6 and 7 are camp preferences: "Control" advocates demand Intervention Capability, while "Capability" advocates argue superintelligence requires full autonomy (dropping 6). Similarly, some pessimists believe Scalable Oversight (7) is impossible, preferring hard constraints instead.

  Joint satisfiability
  There is a strong argument that Requirements 2 (Robust Correspondence) and 4 (Untranslatable Uncertainty Flagging) are jointly unsatisfiable. Robust Correspondence implies we can verify the AI's concepts match ours. However, Inaccessible Information (the basis for Req 4) posits that some critical knowledge *cannot* be translated into human terms. If the AI cannot explain why its concept of "person" matches ours in a specific complex scenario, we cannot verify the correspondence. We are forced to choose between trusting opaque correspondence or admitting we cannot verify alignment in high-stakes domains.

  The knockout requirement
  **Empirical Correlates (Requirement 3)** knocks out the most solution approaches. Most current alignment research relies on interpretability (reading the code), formal verification (proving the math), or reward modeling (training on feedback). All three assume we can understand the justification for the AI's actions. If we must verify safety via external empirical proxies because the internal logic is inaccessible, interpretability-based solutions fail entirely, as do approaches relying on the AI explaining its reasoning. This forces a shift toward behavioral testing and sandboxing, which many argue is insufficient for superintelligence.
