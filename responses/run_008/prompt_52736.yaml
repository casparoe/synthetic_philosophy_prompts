answer: |-
  # Quiz: What's Your Rule for Speaking Up?

  We've talked about who you are and how you update your beliefs. Now let's talk about your mouth. When is it actually okay to flat-out say something is the case? Is it when you know it? When it's true? When you have a good hunch? Or does it depend entirely on the room you're standing in?

  Below are 8 scenarios. Don't overthink them—go with your gut reaction about whether the speaker did something **wrong** (improper, out of line) or **right** (acceptable, in bounds).

  ***

  ### 1. The Million-to-One Shot
  You hold one ticket in a fair lottery with a million tickets. The odds of losing are 99.9999%. Before the draw, you turn to a friend and say, "I'm going to lose." As it happens, you do lose.
  *   **A.** You shouldn't have said that. You didn't *know* you'd lose; it was just a guess based on odds.
  *   **B.** It's fine. The odds were overwhelming, and you turned out right.
  *   **C.** It's fine, provided you genuinely felt you were going to lose.

  ### 2. The Closet Creationist
  A high school biology teacher is a devout creationist who personally rejects evolution. However, they have studied the scientific literature extensively and can explain the evidence perfectly. During class, they state, "Humans and chimpanzees share a common ancestor."
  *   **A.** This is improper. You shouldn't assert things you don't personally believe.
  *   **B.** This is proper. The statement is supported by evidence and is part of their job.
  *   **C.** It depends on whether the students know about the teacher's personal views.

  ### 3. The Stopped Clock
  You walk into a room and glance at a clock on the wall. It reads 2:00 PM. You say, "It's 2:00 PM." It is indeed 2:00 PM. However, unknown to you, the clock broke exactly 24 hours ago and is stuck on 2:00.
  *   **A.** You shouldn't have asserted that. You got lucky; you didn't actually know the time.
  *   **B.** It's fine. You had every reason to trust the clock, and you were right.
  *   **C.** It's fine. As far as you were concerned, you knew the time.

  ### 4. The Moved Meeting
  All the emails and calendar invites say the meeting is at 3:00 PM. The organizer changed it to 4:00 PM an hour ago but forgot to notify anyone. At 2:30 PM, you tell a colleague, "The meeting is at 3:00 PM."
  *   **A.** You made a mistake. You asserted something false.
  *   **B.** You're blameless. You had the best available evidence.
  *   **C.** You should have hedged. You should have said, "I think it's at 3:00 PM."

  ### 5. The Rain Check
  You look out the window and see it is raining. A friend asks, "Do you believe it's raining?" You reply, "Yes, it's raining, but I don't believe it." (Perhaps you feel disconnected from your own mind, or you think your eyes are deceiving you, even though they aren't).
  *   **A.** That's nonsense. You can't say it's raining if you don't believe it.
  *   **B.** It's weird, but if it is raining, you told the truth.
  *   **C.** It's just a conversational oddity. There's no real rule broken.

  ### 6. The Poker Bluff
  You are playing a high-stakes poker game. You have a terrible hand. When it's your turn, you look your opponent in the eye and say, "I have a straight."
  *   **A.** You lied. Asserting falsehoods is wrong.
  *   **B.** It's part of the game. The normal rules of speaking don't apply here.
  *   **C.** You shouldn't have said it. You didn't believe it, and you didn't know it.

  ### 7. The Bridge Out
  You haven't been to the river today, but a reliable news alert and three friends have texted you that the bridge is out. You meet a driver and say, "The bridge is out."
  *   **A.** You shouldn't say that unless you've seen it yourself.
  *   **B.** It's fine. You have authoritative testimony.
  *   **C.** It's fine, as long as the bridge is actually out.

  ### 8. The Hurtful Truth
  You know for a fact that your friend's partner is cheating. You also know your friend is currently recovering from a major surgery and stress could harm their health. Your friend asks, "Is my relationship okay?" You say, "Yes, everything is fine."
  *   **A.** You lied. Truth is the only norm that matters.
  *   **B.** You did the right thing. Kindness overrides strict truth-telling here.
  *   **C.** You violated the norm of assertion, but you weren't *blameworthy* for doing so.

  ***

  # The Scoring Key (The Philosopher's Autopsy)

  *Note: This quiz is designed to sort your intuitions, not to diagnose you with a degree in epistemology. Below is how to tally your answers, followed by a candid explanation of where this quiz—and the philosophy behind it—breaks down.*

  ### Step 1: Tally Your Answers
  For each question, assign points to the columns below based on which option you chose.

  | Q # | Option A Points | Option B Points | Option C Points |
  | :--- | :--- | :--- | :--- |
  | **1 (Lottery)** | **Knowledge** | **Justification** | **Belief** |
  | **2 (Teacher)** | **Belief** | **Justification** | **Context** |
  | **3 (Clock)** | **Knowledge** | **Justification** | **Knowledge** |
  | **4 (Meeting)** | **Truth** | **Justification** | **Prudence** |
  | **5 (Moore)** | **Belief** | **Truth** | **Context** |
  | **6 (Poker)** | **Truth** | **Context** | **Knowledge** |
  | **7 (Bridge)** | **Knowledge** | **Justification** | **Truth** |
  | **8 (Truth)** | **Truth** | **Context** | **Knowledge** |

  *(Note: In Q3, both A and C lean Knowledge, but A is stricter. In Q8, C is a "Knowledge Norm but Blameless" hybrid.)*

  ### Step 2: Find Your Dominant Norm
  Whichever column has the most points is your primary intuition.

  *   **Mostly Knowledge:** You hold the **Knowledge Norm**. You think assertion is a tool for sharing knowledge. If you don't know it, you shouldn't say it (even if it's true or likely).
      *   *Your Awkward Commitment:* You have to tell the lottery player they were wrong to say they'd lose, even though they did lose and the odds were a million to one.
  *   **Mostly Justification:** You hold the **Justification Norm**. You think assertion is about sharing reasonable beliefs. If you have the evidence, you're clear to speak.
      *   *Your Awkward Commitment:* You have to say the person with the stopped clock was speaking properly, even though their accuracy was pure luck.
  *   **Mostly Truth:** You hold the **Truth Norm**. You think the only sin is lying (asserting falsehoods).
      *   *Your Awkward Commitment:* You have to condemn the poker player for bluffing, and you might have to condemn the surgeon-protecting friend in Q8 for lying to save feelings.
  *   **Mostly Belief:** You hold the **Belief Norm**. You think assertion is an expression of your own mind. Sincerity is the only rule.
      *   *Your Awkward Commitment:* You have to say the biology teacher in Q2 is doing something improper, even though they are teaching settled science correctly.
  *   **Mostly Context:** You are a **Deflationary/Contextualist**. You think there is no single rule; norms shift based on the situation (poker vs. classroom vs. hospital).
      *   *Your Awkward Commitment:* You struggle to explain *why* the context shifts. If norms are just vibes, how do we ever criticize anyone?

  ### Step 3: The Honesty Check (Read This Part)

  If you are using this quiz for your blog, you need to include this section. Most quizzes hide their limitations; this one exposes them.

  **1. The Load-Bearing Questions**
  This quiz cannot reliably distinguish between some positions without specific "load-bearing" questions.
  *   **Belief vs. Justification:** This split rests almost entirely on **Q2 (The Teacher)**. If a user answers "Proper" on Q2 but "Improper" on Q1 (Lottery), they are likely a Justification theorist. If they answer "Improper" on Q2, they are a Belief theorist. If Q2 is answered ambiguously, you cannot separate Belief from Justification norms.
  *   **Knowledge vs. Justification:** This split rests on **Q1 (Lottery)** and **Q3 (Clock)**. The Knowledge Norm says both are improper (no knowledge). The Justification Norm says both are proper (high odds/reliable clock). If a user says Lottery is "Improper" but Clock is "Proper," they hold an unstable position (rejecting statistical knowledge but accepting perceptual luck).
  *   **Truth vs. Knowledge:** This is the hardest split. It relies on **Q4 (Meeting)**. Truth Norm says "Improper" (it was false). Knowledge Norm says "Improper" (you didn't know). They often yield the same result. The only way to separate them is if someone says the Lottery assertion (Q1) is "Proper" *because it was true*, but the Meeting assertion (Q4) is "Improper" *because it was false*. That is a pure Truth Norm.

  **2. The Prudence Trap**
  **Q8 (The Hurtful Truth)** is a validity check. Many people answer based on *prudence* (was this a smart thing to do?) rather than *propriety* (was this a valid assertion?).
  *   If a user marks "Improper" on Q8 because it was mean, they are confusing moral norms with assertion norms.
  *   If a user marks "Proper" on Q8 because it was kind, they are prioritizing consequences over truth.
  *   **Warning:** If a respondent's answers on Q1, Q3, and Q4 (epistemic cases) contradict their answers on Q8 (moral cases), their score is likely noise. They aren't tracking assertion norms; they are tracking "being a good person."

  **3. Incoherent Patterns**
  Some answer combinations do not map to real philosophical positions. If you see these, the respondent is likely guessing or confused:
  *   **The "Lucky Truth" Contradiction:** Saying Q1 (Lottery) is **Improper** (because it wasn't known) but Q3 (Clock) is **Proper** (because it was true). This rejects statistical knowledge but accepts Gettiered luck. Very few philosophers hold this.
  *   **The "Sincere Liar" Contradiction:** Saying Q6 (Poker) is **Improper** (because it's a lie) but Q2 (Teacher) is **Proper** (even though they don't believe it). This punishes game-lies but excuses professional-lies. This isn't a standard norm; it's just inconsistent moralizing.
  *   **The "Truth-Only" Outlier:** Saying Q4 (Meeting) is **Proper** (even though false). This is logically impossible for a Truth Norm. If they say this, they are actually a Justification theorist who miscategorized the question.

  **4. Unexplored Territory**
  *   **The "Knowledge but Blameless" Gap:** Many people feel that asserting a Justified Falsehood (Q4) is *technically* wrong but *blameless*. This quiz forces a binary choice. Respondents who feel this tension might score as "Knowledge Norm" (because they admit impropriety) but feel alienated by the "Awkward Commitment" (which suggests they should blame the speaker). This quiz cannot capture the "Knowledge Norm + Excuse" hybrid view, which is actually quite popular in recent literature.

  **5. A Note on the "Truth Norm"**
  Be aware that the **Truth Norm** leaf is very sparse. Almost no contemporary epistemologist holds a pure Truth Norm (that *only* truth matters) because it makes blameless error impossible to forgive. If someone scores as "Truth Norm," they are likely a layperson conflating "lying" with "asserting," or they are prioritizing moral honesty over epistemic norms. Treat this result as "Pre-Theoretic Intuition" rather than a defended philosophical stance.
