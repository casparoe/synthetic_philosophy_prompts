prompt: |-
  Our university's student conduct board has a hearing next week and I need a written opinion to circulate beforehand, and honestly I keep going back and forth on this one so I want your actual reasoning, not just a summary of the positions.

  The case: a resident advisor, let's call her M., was asked by campus police where a specific student was. The student had a restraining order situation with an ex-partner, there was an active welfare concern, and M. believed -- I think reasonably -- that if she confirmed the student was hiding in a friend's room down the hall, the police would have to log it and it could get back to the ex-partner somehow (there's a dispute about whether this fear was realistic). So she said she didn't know. Two days later the student was found safe, and it came out that M. had lied. Our code of conduct treats "providing false information to university officials" as a serious violation with a mandatory suspension recommendation, basically regardless of motive.

  The board is split in a way that maps pretty neatly onto the old Kant vs. consequentialist fight about lying to the murderer at the door. One faction says the rule is the rule, lying to officials corrodes the whole system, and if everyone got to lie whenever they judged the stakes were high, the institution stops working -- plus you can't build a conduct code on each person's private risk assessment of whether their lie will help. The other faction says come on, obviously she did the right thing, she protected a frightened student, and punishing her signals to every RA that the institution prefers procedural cleanliness over student safety. There's also a middle position floating around: find a violation but deviate from the mandatory suspension for "extraordinary circumstances," which our code technically permits but almost never does.

  Draft the written opinion I'll circulate before the hearing. It should recommend a concrete outcome (full sanction as written, violation with no suspension, or no violation at all -- your pick), and it has to take the losing side's strongest argument seriously, not just the strawman version. I'd especially like you to get into the question of whether the "system collapse" argument for never lying to officials actually holds up here -- like, is M.'s lie the kind that generalizes badly, or the kind where the generalization is exactly what we'd endorse? And whether motive should matter at sentencing when it arguably can't matter at the liability stage. The board members are smart but only one has any philosophy background, so keep the theory load-bearing but not lecture-y. One page-ish, no citations needed, I just need the reasoning to be tight.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Task:** Draft a written opinion for a university student conduct board hearing.
      *   **Case:** Resident Advisor (M.) lied to campus police about a student's location to protect the student from an ex-partner (restraining order/welfare concern). M. feared confirmation would leak. Student was found safe later. M. admitted lying.
      *   **Code:** "Providing false information to university officials" is a serious violation with a *mandatory suspension recommendation*.
      *   **Conflict:** Deontological (rule-based) vs. Consequentialist (outcome-based) approaches.
          *   Side A: Rule is rule. Lying corrodes trust/system. Private risk assessment is unreliable.
          *   Side B: M. did the right thing (safety > procedure). Punishing her signals safety doesn't matter.
          *   Side C (Middle): Violation found, but waive mandatory suspension due to "extraordinary circumstances."
      *   **Requirements:**
          *   Recommend a concrete outcome (pick one).
          *   Take the losing side's strongest argument seriously (steelman, don't strawman).
          *   Address the "system collapse" argument (does this lie generalize badly?).
          *   Address the role of motive (liability vs. sentencing).
          *   Tone: Smart, tight reasoning, theory load-bearing but not lecture-y.
          *   Length: ~1 page.
          *   No citations.

  2.  **Determine the Recommended Outcome:**
      *   *Option 1: Full Sanction (Suspension).* Too harsh. Ignores the moral weight of protecting a vulnerable student. Undermines trust between RAs and residents.
      *   *Option 2: No Violation.* Legally/code-wise difficult. She *did* lie to an official. Exonerating her completely might suggest lying is fine whenever you feel like it, weakening the code.
      *   *Option 3: Violation + Waived Suspension (The Middle Path).* This acknowledges the breach of protocol (maintaining the rule's validity) while recognizing the moral justification (avoiding the unjust outcome). It fits the "extraordinary circumstances" clause.
      *   *Decision:* I will argue for **Option 3**. It allows for the most nuanced discussion of the philosophical tensions requested (liability vs. sentencing, rule vs. exception).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Introduction:** State the recommendation clearly up front. (Violation found, mandatory suspension waived).
      *   **The Core Tension:** Acknowledge the Kant vs. Consequentialist split without using those labels explicitly (keep it practical).
      *   **Addressing the "System Collapse" Argument (The Losing Side):**
          *   The argument: If RAs can lie when *they* think it's necessary, the chain of command breaks. Police can't trust RAs.
          *   Counter/Refinement: This isn't a "selfish lie" or a "convenience lie." It's a "confidentiality/protection lie." The generalization isn't "lie whenever"; it's "lie when necessary to prevent imminent harm where protocol fails."
          *   Steelman: Acknowledge that allowing *any* exception creates risk. We must admit that M.'s risk assessment *could* have been wrong.
      *   **The Role of Motive:**
          *   Liability: Motive usually doesn't change *what* happened (the actus reus). She lied.
          *   Sentencing: Motive is everything here. The code allows deviation for "extraordinary circumstances." This is the safety valve.
      *   **The "Murderer at the Door" Analogy:**
          *   Briefly touch on this. The "police" here aren't the murderer, but the *system* they represent (logging data) posed the risk.
      *   **Conclusion:** Reiterate the balance. Uphold the rule, mitigate the penalty.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Violation but no suspension" too wishy-washy?
      *   *Fix:* Make sure the reasoning for the *violation* is strong. We can't just say "she lied but it's okay." We must say "she lied, which is normally unacceptable, but the context transforms the *punishment*, not the *fact*."
      *   *Critique:* Did I address the "system collapse" enough?
      *   *Fix:* Dedicate a specific paragraph to the "generalization" test. If every RA lied to protect privacy, would the system collapse? Or would it just mean RAs take confidentiality seriously? The distinction is between lying to *evade* responsibility vs. lying to *fulfill* a higher duty of care.
      *   *Tone Check:* Ensure it doesn't sound like a philosophy lecture. Use terms like "institutional integrity" and "duty of care" rather than "categorical imperative" and "utilitarian calculus."

  5.  **Final Polish:**
      *   Check length.
      *   Ensure the recommendation is unambiguous.
      *   Verify the "steelman" requirement is met (acknowledge the risk of subjective risk assessment).

  6.  **Final Review against constraints:**
      *   Concrete outcome? Yes (Violation, waived suspension).
      *   Losing side respected? Yes (The risk of subjective exceptions is real).
      *   System collapse addressed? Yes (Distinguishing types of lies).
      *   Motive discussed? Yes (Liability vs. Sanction).
      *   One page-ish? (Will aim for ~500-600 words).

  *(Self-Correction during final drafting)*: I need to make sure I don't sound like I'm encouraging RAs to lie. The emphasis must be on the *rarity* of the circumstance. The "extraordinary circumstances" clause is key.

  7.  **Drafting the Content:** (Proceeding to generate output based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Student Conduct Board
  **FROM:** [Your Name/Role]
  **RE:** Case of M. – Provision of False Information
  **DATE:** [Date]

  **Recommendation**
  I recommend the Board find M. responsible for providing false information to a university official, but invoke the "extraordinary circumstances" clause to waive the mandatory suspension recommendation. A formal reprimand and educational sanction are appropriate; removal from the RA role is not.

  **Reasoning**
  This case forces us to choose between two legitimate goods: the reliability of our conduct processes and the safety of vulnerable students. The argument for strict enforcement is not merely bureaucratic; it is structural. If RAs are permitted to withhold or falsify information based on private risk assessments, the chain of command fractures. Campus police and administrators rely on RAs as accurate nodes in a safety network. If we endorse M.'s lie as *permissible conduct* rather than *excusable breach*, we risk normalizing a system where institutional actors decide unilaterally which rules to follow. The "system collapse" fear is real: a code of conduct cannot function if every violation comes with a footnote reading "unless I thought it was necessary."

  However, the "system collapse" argument fails here because it treats all lies as functionally identical. They are not. A lie told to evade accountability (e.g., covering up a party violation) corrodes trust. A lie told to preserve confidentiality in a high-stakes welfare situation functions differently. The generalization we are testing is not "RAs may lie to police," but rather "RAs may withhold location data when disclosure poses a credible, imminent threat to a resident's safety that official channels cannot guarantee." If generalized, this principle does not destroy the system; it clarifies that the duty of care sometimes supersedes the duty of disclosure. M. did not lie to undermine the university's authority, but to fulfill the university's broader promise of safety.

  This distinction allows us to separate *liability* from *sanctioning*. At the liability stage, motive cannot change the facts: M. knowingly provided false information. To find "no violation" would be to rewrite the code retroactively and suggest that intent negates the act. This sets a dangerous precedent where the truthfulness of an official statement becomes subjective. We must uphold the rule to maintain its integrity.

  Yet, a rule without equity is tyranny. This is why the "extraordinary circumstances" provision exists. It acknowledges that strict liability can produce unjust outcomes when applied to complex human realities. Motive is irrelevant to *whether* the rule was broken, but it is dispositive regarding *how* we respond. Punishing M. with suspension signals that procedural cleanliness outweighs student protection. That is a message no safety-oriented institution should send. It would teach future RAs that in a crisis, they should prioritize their own compliance over a resident's vulnerability.

  By finding a violation but waiving the suspension, we achieve two things. First, we affirm that lying to officials is presumptively unacceptable and remains a violation of the code. Second, we acknowledge that the moral weight of protecting a student from potential harm constitutes an extraordinary circumstance that mitigates culpability. We uphold the rule without sacrificing the person.

  **Outcome**
  Find M. Responsible. Waive Mandatory Suspension. Issue Formal Reprimand.
