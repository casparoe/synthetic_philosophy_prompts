answer: |-
  # JOINT STATEMENT ON THE INTERNAL/EXTERNAL REASONS DISPUTE

  **Signatories:** A Proponent of Neo-Humean Internalism & A Defender of Unconditioned External Reasons
  **Date:** 24 May 2024
  **Subject:** The Current State of the Dispute Following Bernard Williams's 'Internal and External Reasons'

  Having engaged in a prolonged adversarial collaboration, we submit this statement to clarify the terrain of the reasons debate for those familiar with Bernard Williams's original formulation. While we remain opposed on fundamental metaphysical and conceptual issues, we have identified a stable platform of shared commitments and isolated the precise loci of our divergence.

  ### I. Agreed Claims

  1.  **The Deliberative Route:** Both parties accept that for a consideration to function as a reason *for an agent*, there must be a conceivable deliberative route by which the agent could arrive at acting on it. We reject the notion of reasons that are entirely opaque to the agent's cognitive architecture. The disagreement lies not in the existence of the route, but in the constraints on its starting point.
  2.  **Distant vs. Pathological Deliberators:** We agree on the distinction between a 'distant' deliberator (who possesses the capacity to reason to a conclusion but lacks information or time) and a 'pathological' deliberator (whose rational capacities are impaired, e.g., by severe depression or coercion). The Internalist must explain why the pathological agent lacks reasons without collapsing this distinction into a mere lack of motivation; the Externalist must explain how reasons bind the pathological agent without demanding the impossible.
  3.  **The Burden of Explanation:** We agree that specific counter-examples cannot be defined away. Specifically, the **Amoralist** (who acknowledges moral facts but is unmoved) and the **Future-Indifferent Agent** (who cares nothing for their own future pain) are not merely verbal anomalies. The Internalist bears the burden of explaining why these agents are not simply rational variants; the Externalist bears the burden of explaining how a reason exists for them if it cannot engage their subjective motivational set ($S$).
  4.  **Normative Force:** Both sides agree that reasons possess normative force; they are not merely descriptions of psychological causation. We disagree on whether this force is constituted by the agent's psychology or by objective normative truths.

  ### II. Remaining Disagreements

  | Issue | The Internalist Position | The Externalist Position |
  | :--- | :--- | :--- |
  | **1. Status of the Internal Reasons Thesis (IRT)** | The IRT is a **conceptual truth** (analytic) about the word 'reason'. To speak of a reason for $\phi$-ing where no sound deliberative route exists from $S$ is to misuse the concept. | The IRT is a **substantive metaphysical claim** which is false. 'Reason' denotes a relation to objective value; restricting it to $S$ is a philosophical error, not a conceptual necessity. |
  | **2. The Idealised Deliberator** | The Externalist's 'idealised agent' **smuggles substantive rational requirements** into the starting set. By claiming the ideal agent *would* be motivated by morality, you are presupposing the conclusion that morality is rational. | The idealised agent **identifies objective norms**. We are not smuggling in preferences; we are describing what a fully informed, rational agent *ought* to want. Rationality itself imposes constraints on $S$. |
  | **3. Guidance and Coherence** | An external reason that cannot in principle guide deliberation is a **philosopher's shadow**. Normativity requires the possibility of motivational uptake; otherwise, it is merely a 'cosmic should'. | An external reason that cannot guide is still a **coherent normative item**. Truths about reasons exist independently of our capacity to grasp them (like mathematical truths); guidance is a secondary benefit, not a condition of existence. |

  ### III. Cruxes and Shared Cases

  Beneath the categorical disagreements above lie two specific cruxes where our predictions diverge on shared intuition pumps.

  **Crux A: Normative Force without Motivational Uptake**
  *   **The Question:** Does normative force dissolve if the agent is constitutionally incapable of caring?
  *   **Shared Case:** *The Anhedonic Ascetic.* An agent who is fully informed, rational, and suffers from no cognitive deficits, but who possesses a fixed psychological constitution that renders them incapable of caring about their own physical well-being or pleasure. They knowingly drink poison.
  *   **Internalist Prediction:** The case shows there is **no reason** for the Ascetic not to drink. To say otherwise severs the link between reasons and agency. The tragedy is that they lack a motive, not that they ignore a reason.
  *   **Externalist Prediction:** The case shows the Ascetic is **irrational**. The reason exists (self-preservation is objectively good); the agent is defective. The intuition that 'they ought not drink' persists even if they cannot care.

  **Crux B: The Amoralist's Indifference (Fault vs. Difference)**
  *   **The Question:** Is the amoralist's lack of motivation a failure of rationality or a mere difference in taste?
  *   **Shared Case:** *The Consistent Villain.* An agent who reasons perfectly instrumentally, understands the suffering they cause, but values cruelty above all else and has no latent sympathy to be awakened by deliberation.
  *   **Internalist Prediction:** The case shows the Villain is **not irrational**, only morally repugnant. We cannot find a fault in their reasoning process. To call them irrational is to moralise the concept of reason.
  *   **Externalist Prediction:** The case shows the Villain is **substantively irrational**. Valuing cruelty is a failure to respond to objective value. The fault lies in their evaluative judgement, which is a rational faculty, not just a desire.

  ### IV. Drafters' Assessment on Verbal Dispute

  Regarding the instruction to identify whether any part of this dispute is verbal: **We judge that a significant portion of the dispute is verbal, specifically concerning the label 'reason'.**

  *   **Why:** Both sides agree on the non-normative facts (the agent's psychology, the outcome of deliberation, the objective value of the act). The Internalist reserves the word 'reason' for considerations linked to $S$. The Externalist reserves the word 'reason' for objective normative truths.
  *   **Substantive Remainder:** However, the dispute is not *merely* verbal. It turns on the substantive metaphysical question of whether rationality is purely instrumental (Internalist) or whether it can dictate ends (Externalist). If rationality can dictate ends, the Internalist's conceptual claim becomes false. Thus, while the terminology is contested, the underlying disagreement about the nature of rationality is genuine.

  ***

  **Signed,**

  *Dr. A. Hume (Neo-Humean Internalist)*
  *Prof. E. Realist (Defender of External Reasons)*
