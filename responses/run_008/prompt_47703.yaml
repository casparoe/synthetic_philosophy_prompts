answer: |-
  The objection from the separateness of persons is the most famous critique of utilitarianism in modern political philosophy. Associated primarily with John Rawls and Robert Nozick, it charges that utilitarianism extends the rational principle of prudence—sacrificing a present good for a greater future gain—from the individual to society. In doing so, it treats the distinct experiences of different people as if they belonged to a single super-person, thereby legitimizing the sacrifice of some for the sake of others. While the rhetorical force of this objection is undeniable, its normative engine is often left obscure. Most discussions gesture at the distinction between intra-personal and inter-personal trade-offs and stop. To understand whether this objection truly defeats utilitarianism, we must ask: what exactly is doing the work in it?

  To answer this, we must distinguish three candidate readings of the objection. The first is the **compensation reading**. This interprets the objection as a metaphysical or accounting claim. Within a single life, a loss can be offset by a later gain because there is a single ledger of well-being belonging to one subject. Between persons, no such ledger exists; a loss to A cannot be literally cancelled by a gain to B. On this reading, utilitarianism is wrong because it counts uncompensated losses as net gains.

  The second is the **authority reading**. This interprets the objection as a claim about moral status and sovereignty. Each person possesses a claim over their own life that others may not override. The problem is not that the loss is uncompensated, but that the trade-off was not authorized by the person whose life is being used. Here, the focus shifts from the metaphysics of value to the boundaries of agency.

  The third is the **anti-concentration reading**. This interprets the objection as a distributive concern. It is an aversion to patterns where burdens are concentrated on a few while benefits are scattered across the many. This reading does not necessarily reject aggregation, but it demands that the distribution of burdens be sensitive to the distinctness of persons, perhaps requiring a prioritarian or sufficientarian weighting rather than simple summation.

  To test which reading carries the weight, consider a specific case. Imagine a policy that maximizes aggregate lifetime well-being by imposing serious early-life burdens on a minority. However, each burdened person later receives, within her own life, benefits that she, fully informed and looking back, judges to outweigh those burdens. Every life, burdened and unburdened, goes better as a whole than it would under any alternative. On the compensation reading (a), this policy should be straightforwardly permissible. The objection forbids utilitarianism because it allows uncompensated losses across persons; here, every loss is compensated within the life of the loser. The ledger is balanced.

  If our considered judgment is that this policy could still be wrong, the compensation reading is insufficient. But before abandoning it, we must confront a complication regarding personal identity. The compensation reading relies on the assumption that a life is the sort of thing whose balance can be struck. This assumes a robust view of personal identity over time. If we accept a reductionist view, such as Derek Parfit's, the "self" is nothing more than a series of psychologically connected experiences. On this view, the distinction between intra-personal and inter-personal trade-offs diminishes. Compensating a present self with a future self is metaphysically no different than compensating one person with another; both involve balancing distinct moments of experience. If personal identity is this fragile, the compensation reading loses its grip entirely, for there is no deep "self" to hold the intra-personal ledger. The objection cannot rest on a metaphysical distinction that dissolves under scrutiny.

  Thus, we must look to the authority and anti-concentration readings to explain any residual unease about the test case. Does the authority reading condemn the policy? This depends on whether the minority consented to the imposition. If the policy was imposed by a state without specific consent, a Nozickian might argue that the individuals were used as means, regardless of the net benefit to them. However, if the individuals, looking back, endorse the trade as making their lives better, the claim of violated authority weakens. It is difficult to maintain that a person's sovereignty is violated by a process that results in a life they affirm as good. Unless one posits a right to refuse benefits or a right to participate in the decision-making process irrespective of the outcome, the authority reading struggles to condemn a policy that guarantees a net gain for every participant.

  This leaves the anti-concentration reading. Even if every life goes better overall, the policy concentrates severe suffering in a specific group at a specific time. The objection here is not about the lack of compensation or the violation of rights, but about the unfairness of the distribution. It is the moral ugliness of requiring a few to suffer intensely so that the aggregate total rises, even if those few are eventually compensated. This reading captures the intuition that there is something objectionable about the *structure* of the sacrifice, independent of the final tally. However, if this is the core of the objection, it is no longer a critique unique to utilitarianism's handling of persons. It is a critique of aggregation itself. Any view that allows burdens to be concentrated for the sake of a greater total—even a prioritarian view that weights the worse-off more heavily—could theoretically endorse a similar policy if the weights are overcome by the magnitude of the benefits.

  This analysis forces a verdict on what is doing the work in the separateness of persons objection. The compensation reading is the most literal interpretation of Rawls's analogy, but it is the weakest. It relies on a metaphysical distinction between intra- and inter-personal relations that is either question-begging (assuming a robust self) or collapses under reductionist scrutiny (where intra-personal trade-offs are just inter-personal trade-offs between time-slices). The authority reading is philosophically distinct, grounding the objection in rights rather than value, but it fails to condemn the test case where the burdened agents retrospectively endorse their lives.

  Therefore, the anti-concentration reading states the objection at its strongest. It captures the enduring moral intuition that drives the critique: that we should not treat the distribution of well-being as a fluid resource to be manipulated for a sum. However, accepting this reading transforms the nature of the objection. It ceases to be a specific critique of utilitarianism's failure to respect the *metaphysics* of persons and becomes a general critique of *aggregative* ethics. If the work is being done by an aversion to concentrated burdens, then the objection applies equally to prioritarianism or any view that permits trade-offs between persons. Prioritarianism gives weight to the worse-off, but it still aggregates; it still permits imposing burdens on some if the weighted gains to others are sufficiently large.

  Consequently, the separateness of persons objection, when stripped of its metaphorical reliance on the "super-person," reveals itself to be a demand for strict distributive constraints, perhaps even a form of egalitarianism that prohibits certain kinds of trade-offs entirely. The verdict is that the compensation reading is metaphysically unstable, and the authority reading is too narrow to cover the intuitive wrongs of distribution. The anti-concentration reading is the only one that sustains the moral force of the objection, but in doing so, it admits that the problem is not utilitarianism's failure to recognize persons as separate, but rather the permissibility of aggregation itself. The objection does not defeat utilitarianism specifically; it threatens every moral view that allows the claims of one person to be outweighed by the claims of others, regardless of how those claims are weighted. The separateness of persons is not a boundary that utilitarianism crosses and others respect; it is a demand that no aggregative view can fully satisfy without abandoning the project of maximizing the good.
