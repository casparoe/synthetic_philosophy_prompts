answer: |-
  This is a classic move in debates about long-term forecasting, and your skepticism is well-founded. The phrase "right but early" is often used as a rhetorical shield to protect a theory from empirical falsification. However, it *can* refer to substantive claims about mechanisms and historical baselines.

  Here are four distinct precise theses people are expressing when they deploy "right but early," along with verdicts on their plausibility and whether they actually support your dinner companion's argument (that we should still worry about limits).

  ### 1. The "Temporary Escape Hatch" Thesis
  *   **The Claim:** Malthus identified a hard physical constraint (land/energy vs. population). He was wrong about the *timing* because he couldn't foresee specific one-time bonuses (fossil fuels, synthetic fertilizer) that temporarily relaxed the constraint. Once those one-time bonuses are depleted, the original constraint re-engages.
  *   **Plausibility:** **Moderate.** It is factually true that fossil fuels and the Green Revolution acted as massive one-time multipliers for carrying capacity. It is physically true that these are finite. The uncertainty lies in whether substitution (renewables, lab-grown food) can replace the one-time bonus before it runs out.
  *   **Does it block the "Don't Worry" move?** **Yes.** This is the strongest version of the argument. It concedes Malthus missed a variable (tech shock) but insists the underlying equation (limits exist) remains binding once the shock absorbs.
  *   **The Trap:** It assumes substitution is impossible or insufficient. If technology creates a *permanent* escape hatch (e.g., fusion + vertical farming), this thesis fails.

  ### 2. The "Historical Baseline" Thesis
  *   **The Claim:** Malthus wasn't making a prediction about the future so much as describing the default state of biological systems. For 99% of human history, population growth *did* outstrip resources, and misery/famine checked it. The last 200 years are the anomaly, not the Malthusian trap. "Right but early" means "The anomaly will end, and the baseline will return."
  *   **Plausibility:** **High (Historically), Low (Predictively).** It is undeniably true that pre-1800s history was Malthusian. However, assuming complex societies must revert to a biological baseline ignores the possibility of a "phase shift" (a permanent transition to a new equilibrium).
  *   **Does it block the "Don't Worry" move?** **Yes, but weakly.** It suggests we should worry because anomalies usually correct. However, it relies on an argument from history ("it always goes back") rather than a specific mechanism ("here is why it must go back").
  *   **The Trap:** It commits the "gambler's fallacy" of history. Just because a pattern held for 10,000 years doesn't guarantee it holds for the next 100, especially after industrialization fundamentally changed the rules of production.

  ### 3. The "Logic Valid, Parameters Wrong" Thesis
  *   **The Claim:** Malthus's *logic* was correct (exponential growth hits linear limits), but his *parameters* were wrong. He assumed resource growth was linear (arithmetic). If resource growth is also exponential (via technology), the collision is delayed indefinitely. "Right but early" here means "The collision is real, but the slopes of the lines were different than he thought."
  *   **Plausibility:** **High.** This is the most charitable reading. It treats Malthusianism as a structural model rather than a specific prophecy. It acknowledges that limits exist *somewhere*, even if the horizon is further out.
  *   **Does it block the "Don't Worry" move?** **No.** This actually helps the Tech Cousin. If the parameters were just wrong, the theory needs updating, not defending. It admits Malthus's specific prediction failed. It supports worrying about limits *in the abstract*, but doesn't validate Malthus's specific warning as actionable today.
  *   **The Trap:** It risks becoming trivial. If you keep adjusting the parameters (the "slope" of tech growth) every time a limit is reached, the theory never actually predicts a crash, it just predicts "limits exist somewhere."

  ### 4. The "Infinite Horizon" Thesis (The Cheat)
  *   **The Claim:** The event (collapse/famine) has not happened *yet*. Therefore, it is still possible. Since it is possible, the theory is not falsified, merely delayed.
  *   **Plausibility:** **None.** This is logically trivial. Anything that is not physically impossible is "still possible." This turns the theory into a tautology: "Limits will bind eventually, unless they don't."
  *   **Does it block the "Don't Worry" move?** **No.** This is pure defensiveness. It offers no reason to worry *now* rather than in 1,000 years. It shields the theorist from being proven wrong without offering actionable insight.
  *   **The Trap:** This is the unfalsifiable rescue clause you suspected. If "early" can mean 200 years, why not 2,000? If there is no time bound on the prediction, it ceases to be a scientific prediction and becomes a belief.

  ***

  ### Is "Right But Early" a Coherent Category?

  You asked for an honest take on whether this distinction is principled or just post-hoc rationalization. Here is the verdict:

  **1. The Falsifiability Test**
  "Right but early" is only a coherent scientific category if the theory specifies a **mechanism** that is still active and a **window** that has not yet closed.
  *   *Coherent:* "The aquifer will run dry in 50 years." (It's been 20 years. The theory is right but early.)
  *   *Incoherent:* "Civilization will collapse due to resource limits." (It's been 200 years. The theory is right but early.)
  Without a specified mechanism and a finite horizon, "right but early" is indistinguishable from "wrong."

  **2. The Mechanism vs. Outcome Distinction**
  A theory can be right about the *pressure* but wrong about the *breaking point*.
  *   If your friend means "The pressure of population on resources is real (Mechanism), even if the crash hasn't happened (Outcome)," that is a coherent position.
  *   If your friend means "The crash *must* happen because Malthus said so," that is dogma.
  The distinction is visible *before* the fact only if the theorist commits to specific indicators (e.g., "When grain prices hit X relative to wages, the trap closes"). If they don't commit to indicators, they are cheating.

  **3. The Verdict on Your Dinner Argument**
  *   **The Tech Cousin** is relying on **Extrapolation**: The past 200 years prove limits can be overcome indefinitely.
  *   **The Econ Grad Student** is relying on **Reversion**: The past 10,000 years prove limits cannot be overcome indefinitely.

  The phrase "right but early" is being used to bridge the gap.
  *   If they mean **Thesis 1 (Escape Hatch)**, they have a point worth listening to: We are living off capital (fossils/soil) rather than income (solar/regeneration).
  *   If they mean **Thesis 4 (Infinite Horizon)**, they are wasting your time.

  **Summary Advice for the Next Dinner:**
  Ask them to define the **mechanism** and the **timeline**.
  *   *"What specific resource limit are we talking about?"*
  *   *"What signal would tell us the 'early' period is over and the 'right' period has begun?"*

  If they can't answer that, "right but early" is just a way of refusing to update a belief in the face of contrary evidence. If they can, you're having a real debate about physics and economics, not history.
