prompt: |-
  I got into an argument at a friend's birthday dinner (of all places) about whether we should worry about long-run resource limits, and the whole thing turned on this one exchange. My friend's cousin, who works in tech, brushed off the whole worry by saying Malthus has been wrong for two hundred years, population exploded and food kept up, so anyone invoking limits is on the wrong side of history. Then someone else at the table -- a guy doing a masters in environmental econ -- shot back with a line I've been chewing on ever since: that Malthus wasn't wrong, he was just early. Everyone nodded like that settled it, but driving home I realized I have no idea what "right but early" is actually claiming, or whether it's a legitimate defense or just a way of making a theory unfalsifiable.

  I want to get clear on this before it comes up again, because the phrase seems to be doing a lot of work in different directions depending on who says it. Can you lay out the distinct precise theses someone might be expressing when they say Malthus (or any long-run theorist like him) was right but early? I'm guessing some readings are pretty trivial, like "the bad outcome is still possible eventually," while others are substantive, like the idea that he correctly described a mechanism that actually governed most of human history and was only suspended by a temporary escape hatch (fossil fuels, the Green Revolution, whatever) that could close again. And presumably at least one reading is basically cheating -- a way of holding onto a theory no matter what happens, since "early" can never be refuted by any amount of delay.

  For each reading, tell me whether it's plausible on its own terms and, importantly, whether it actually supports what the guy at dinner used it for, which was blocking the move from "he was wrong" to "so we shouldn't worry about limits now." I suspect some readings support that and others don't, and I'd also like your honest take on whether "right but early" is even a coherent category for predictions about the real world -- is there a principled difference between a theory that's right but early and one that's just wrong with a rescue clause bolted on, or is the distinction only ever visible after the fact? Please give me the readings as a list I can actually work through, with verdicts, rather than one essay-length defense of whichever reading you find most sympathetic. I don't care about the historical details of Malthus's own revisions to his book, just what people are claiming when the line gets deployed now.
