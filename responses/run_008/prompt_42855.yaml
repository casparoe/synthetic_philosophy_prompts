  You are conflating the uncertainty of the world with the uncertainty of the evidence, and worse, you have the epistemic direction of fit backwards. The proposition 'It seems greenish to me now' is held with certainty at the moment of experience, even if 'The cloth is green' is not; your credences do not constitute the experience, the experience constrains the credences. Jeffrey's rule treats the new probabilities on the color partition as brute inputs, but it offers no normative account of why *those* numbers rather than others—it simply stipulates the shift, making the rule a black box that hides the actual evidential relation. By contrast, strict conditionalization on the sensory proposition derives the shift via likelihoods, keeping the probabilistic dependencies transparent and preserving commutativity across sequences of updates. Since Diaconis and Zabell have shown that any coherent Jeffrey update can be reconstructed as a strict conditionalization on a richer algebra, your 'ordinary condition of perception' is actually just strict conditioning on a proposition you're refusing to articulate. Why posit a new rule of rationality when the old one suffices, provided you describe the evidence accurately?
