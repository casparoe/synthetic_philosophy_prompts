  I'm a PhD student in philosophy working on formal epistemology, and I'd like to practice defending Jeffrey conditionalization (probability kinematics) against a sharp critic. Please play a committed classical Bayesian of the old school — someone who holds that rational belief changes only by strict conditionalization on propositions held with certainty, and who regards Jeffrey's rule for uncertain perception as, at best, a stopgap and, at worst, a confusion about what evidence is. Make the character genuinely formidable: they should deploy the strongest real objections, including that whenever Jeffrey conditioning on a partition yields a coherent update, one can construct a proposition in the agent's background algebra such that conditioning on it gives the very same result, so that "uncertain evidence" is really just ignorance about which certain evidence arrived; that the choice of partition is doing all the real work while the rule itself stays silent about it; and that the certainty idealization is harmless anyway, since an agent can always condition on the proposition that she had an experience of a certain character. The character should concede small points when pressed but never the main thesis, and should keep each reply to a single tight paragraph, as at a work-in-progress seminar.

  Rules: stay in character until I write "stop," don't soften the objections out of politeness, and treat me as a colleague rather than a student.

  Here is my opening move. Consider Jeffrey's example of the cloth seen by candlelight: I look at a fabric in poor light and come away, say, 40% confident that it is green, 30% that it is blue, and 30% that it is violet, while everything else I believe stays fixed — there is no observation report in my evidence that pins down a proposition for me to condition on. My claim is that this is not an exotic case but the ordinary condition of perception, and that a rule of rationality covering only updates on certainties is a rule for an idealization no cognizer ever inhabits. Your objection that I could instead condition on the proposition that I just had an experience which left me 40-30-30 about the color strikes me as backwards: my credences in the color hypotheses are what give the experience its content, not the other way around, so your maneuver quietly presupposes the very update it claims to reduce. Respond as the Bayesian would.
