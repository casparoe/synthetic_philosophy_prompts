prompt: |-
  I run a student effective altruism group at my university, about 14 people, mostly second-years who've read a bit of 80k-style material but never actually tried to use the frameworks. I've got a 90-minute session coming up on cause prioritization, specifically the importance / tractability / neglectedness (ITN) framework. The problem is that everyone nods along when it's explained on a whiteboard -- multiply the three scores, rank the causes, done -- but nobody feels where the framework actually bites: the fact that the three factors fight each other, that neglectedness is doing something weird (the more people who pile into a cause, the worse it looks, which feels backwards until you sit with it), and that the scores are basically made-up numbers whose product gets treated as knowledge. So I want a game, not a lecture.

  Here's what I'd like you to design. Act as an experienced workshop facilitator who's run cause-prioritization exercises many times and knows all the ways they fail. The game should use fictional causes -- invent maybe six of them, deliberately varied so that some are huge and horrifying but utterly intractable, some are small but easy wins, some are neglected for arguably very good reasons (nobody works on them because they don't matter), and at least one that's the fake version of a cause that gets a lot of real-world attention, so the participants can't just pattern-match to what they've read online. Participants should have to commit to numeric scores for each factor at some point, because I want them to feel the arbitrariness of putting a number on tractability. It would be great if the game had at least two rounds, where between rounds you inject a shock -- e.g., a fictional billionaire drops $500M into one of the causes -- so they have to watch their neglectedness scores collapse and figure out what that does to their ranking, including the uncomfortable implication that success makes a cause look worse.

  Rules, materials (assume a whiteboard, sticky notes, printed scorecards, no laptops), a fictional budget with some payoff scheme that doesn't involve real money but still gives people something to win or lose, and a time breakdown for the 90 minutes. Then a debrief that maps specific moments in the game onto specific claims of the ITN framework -- and importantly, onto its known weak points, like whether the factors are really independent, whether multiplying them makes sense when the scores aren't on any shared scale, and whether neglectedness tracks "weirdly overlooked" versus "rightly ignored." Tell me honestly what will predictably go wrong the first time I run it (I expect some participants will refuse to give numbers at all, others will just argue about the fictional causes' details), and be frank about which feature of real cause prioritization the game just cannot reproduce -- a 90-minute game can't give people the actual uncertainty of the real world, and I want to know what I'll have to supply in the debrief that the game itself can't.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **User:** Runs a student EA group (14 people, mostly 2nd years, familiar with concepts but not application).
      *   **Goal:** Run a 90-minute session on Cause Prioritization (ITN Framework).
      *   **Problem:** Participants nod along but don't *feel* the tensions (factors fighting, neglectedness counter-intuitiveness, arbitrariness of numbers).
      *   **Requirement:** Design a *game*, not a lecture.
      *   **Specifics:**
          *   6 fictional causes (varied: huge/intractable, small/easy, neglected for good reason, fake version of real popular cause).
          *   Commit to numeric scores (feel the arbitrariness).
          *   Two rounds with a "shock" in between (e.g., billionaire donation affecting neglectedness).
          *   Materials: Whiteboard, sticky notes, printed scorecards, no laptops.
          *   Budget/Payoff scheme (non-monetary but competitive/cooperative).
          *   Time breakdown (90 mins).
          *   Debrief: Map game moments to ITN claims *and* weak points (independence, scale multiplication, neglectedness nuance).
          *   Failure Modes: Predict what will go wrong (refusal to number, arguing details).
          *   Limitations: Acknowledge what the game *can't* teach (real uncertainty).
      *   **Tone:** Experienced workshop facilitator, frank, practical.

  2.  **Deconstruct the ITN Tension:**
      *   *Importance:* Big problem? (Scale)
      *   *Tractability:* Can we solve it? (Marginal returns)
      *   *Neglectedness:* Are others doing it? (Crowding)
      *   *The "Bite":* High Importance often correlates with Low Neglectedness (everyone is working on it) or Low Tractability (it's hard for a reason). High Neglectedness often means Low Importance (nobody cares because it's trivial) or Low Tractability (nobody can solve it).
      *   *The "Shock":* Money flowing in reduces Neglectedness, potentially lowering the *marginal* value of the next dollar, even if the cause is still important.

  3.  **Drafting the Game Concept: "The Grantmaker's Dilemma"**
      *   *Role:* Participants are program officers at a foundation.
      *   *Goal:* Maximize "Good Units" (GU) allocated.
      *   *Mechanic:* Assign scores (1-10) to I, T, N. Multiply them. Allocate budget based on the score.
      *   *Twist:* The "Shock" changes N, which changes the total score, which changes the allocation.

  4.  **Developing the 6 Fictional Causes:**
      *   Need variety.
      *   1. *The Big Scary One (Intractable):* "Atmospheric Carbon Lock-in." Huge scale, but tech doesn't exist yet. (High I, Low T, Med N).
      *   2. *The Easy Win (Small):* "Local Library Digitization." Tiny scale, very easy, somewhat neglected locally. (Low I, High T, Med N).
      *   3. *The "Rightly Ignored" (Low I):* "Premium Coffee for Grad Students." People feel strongly, but impact is low. (Low I, High T, High N). *Correction:* Make it sound plausible but actually trivial. "Optimizing Campus Recycling Bin Colors."
      *   4. *The Fake Popular Cause:* "AI Safety" is too obvious. Let's make "Algorithmic Bias in Dating Apps." Sounds important/techy, but actually small scale compared to existential risk. (Med I, Med T, Low N).
      *   5. *The Weird Neglected One:* "Deep Sea Microbiome Stability." Sounds niche, but maybe high leverage? Let's make it "Sargassum Bloom Prevention." High I (ecosystem), Med T, High N.
      *   6. *The Trap:* "Global Peace Treaty Negotiation." Huge I, Extremely Low T, Low N (everyone tries).

      *Refining for the "Shock":* One cause needs to be susceptible to the billionaire shock. Let's pick the "Algorithmic Bias" one. If $500M pours in, Neglectedness tanks.

  5.  **Designing the Mechanics & Scoring:**
      *   Scale 1-10 for each.
      *   Formula: $Impact = I \times T \times N$.
      *   Budget: 100 "Grant Points."
      *   Payoff: The group with the highest total Impact Points at the end wins "Bragging Rights" + chooses the next topic/snacks. (Keep it light).
      *   *Crucial Mechanic:* Participants must write numbers on sticky notes. No discussion until numbers are revealed. This forces commitment.

  6.  **Addressing the "Shock":**
      *   Round 1: Score and Allocate.
      *   Intermission: News Flash. "Tech Mogul donates $500M to [Cause X]."
      *   Round 2: Re-score Neglectedness. Re-calculate. Re-allocate.
      *   Observation: Did the total value of Cause X drop? Did people shift money?

  7.  **Structuring the 90 Minutes:**
      *   Intro (10m): Rules, stakes, ITN refresher (brief).
      *   Round 1 (25m): Scoring, calculation, allocation.
      *   The Shock (5m): News flash.
      *   Round 2 (25m): Re-scoring, re-allocation.
      *   Debrief (25m): The meat of the session.

  8.  **Anticipating Failure Modes (The "Experienced Facilitator" Voice):**
      *   *Number Refusal:* "You can't quantify suffering!" -> *Fix:* Frame it as "force ranks," not physics.
      *   *Detail Arguing:* "But in this fictional world, does the tech exist?" -> *Fix:* Facilitator is God. Final ruling.
      *   *Gaming the Math:* Multiplying by 0 or 10 to break the system. -> *Fix:* Cap scores 1-10, require justification.
      *   *Neglectedness Confusion:* Thinking High N = Good (lots of people) vs High N = Bad (few people). -> *Fix:* Clear legend on scorecard. (1 = Crowded, 10 = Empty).

  9.  **Developing the Debrief:**
      *   Map game moments to theory.
      *   *The Multiplication:* Why did we multiply? What if we added? (Sensitivity analysis).
      *   *The Shock:* Why did value drop when money arrived? (Diminishing returns).
      *   *The "Rightly Ignored":* Why was the Recycling cause neglected? (Because it's useless).
      *   *Limitations:* Real uncertainty isn't just not knowing the number; it's not knowing the *model*.

  10. **Refining the Materials:**
      *   Scorecards need to be clear.
      *   Whiteboard layout needs to track the "Market Cap" of each cause.

  11. **Review against Constraints:**
      *   14 people? Break into 3 groups of 4-5.
      *   No laptops? Paper based.
      *   Fictional causes? Yes.
      *   Two rounds + shock? Yes.
      *   Frank assessment of limitations? Yes.

  12. **Final Polish:** Ensure the tone is encouraging but realistic. Emphasize that the *discomfort* is the learning objective. (Self-Correction: Make sure the "Neglectedness" scale is intuitive. Usually, EA uses "How neglected?" where High = Good. Let's define it as "Room for Funding" to avoid confusion. 1 = Saturated, 10 = Wide Open.)

  13. **Drafting the Content:** (Proceeding to generate response based on these thoughts). *Wait, one check on the "Fake Version of Real Cause".* "Algorithmic Bias in Dating Apps" is good. It mimics "AI Safety" or "Tech Ethics" but is scope-insensitive. Let's call it "Fairness in Gig-Economy Algorithms." Sounds systemic, actually narrow.

  14. **Final check on "Shock":** The shock needs to demonstrate that *success* (funding) lowers *priority* (marginal utility). This is the hardest concept. I need to make sure the math reflects this. If N drops from 8 to 2, the score drops significantly.

  15. **Let's write it.**
answer: |-
  This is a classic facilitation challenge. You are fighting against the "illusion of explanatory depth." Your students think they understand ITN because the arithmetic is simple, but they haven't felt the *moral discomfort* of the trade-offs.

  Here is a design for **"The Foundation Game."** It is built to create friction. If everyone leaves feeling comfortable with their scores, you have failed. The goal is to make them argue about whether a number should be a 4 or a 5, and then realize the 4 vs. 5 distinction is arbitrary but decisive.

  ### **Workshop Overview: The Foundation Game**

  *   **Participants:** 14 students (Split into 3 groups of 4-5).
  *   **Time:** 90 Minutes.
  *   **Materials:** Whiteboard + markers, 3 packs of sticky notes (3 colors), Printed "Grant Scorecards" (one per person), Printed "Cause Briefs" (one set per group).
  *   **Stakes:** The group that generates the highest "Total Expected Value" wins the right to choose the topic for the next meeting (and you buy the pizza).

  ---

  ### **Part 1: The Setup (10 Minutes)**

  **1. The Hook (2 mins):**
  Tell them: "You are program officers at the *Effective Future Foundation*. You have a budget of **100 Grant Points** to distribute. Your goal is to maximize 'Good Units' (GU). You will be evaluated on the sum of (Cause Score × Points Allocated). The group with the highest GU wins."

  **2. The Rules of Scoring (5 mins):**
  Draw the ITN grid on the whiteboard.
  *   **Importance (I):** Scale 1–10. (1 = Local nuisance, 10 = Existential catastrophe).
  *   **Tractability (T):** Scale 1–10. (1 = Hopeless, 10 = Solved with a check).
  *   **Neglectedness (N):** Scale 1–10. (**Crucial:** 1 = Saturated/Crowded, 10 = Completely Ignored).
  *   **The Formula:** $Score = I \times T \times N$.
  *   **The Constraint:** You must allocate all 100 points. You cannot save them.

  **3. The Groups (3 mins):**
  Divide into 3 teams. Give each team a set of **6 Cause Briefs** (see below) and a stack of sticky notes.

  ---

  ### **Part 2: Round 1 - The Allocation (25 Minutes)**

  **Task:**
  1.  Read the 6 Cause Briefs.
  2.  For each cause, the team must agree on **one** number for I, T, and N. Write these on a sticky note and put it on the whiteboard.
  3.  Calculate the Score ($I \times T \times N$).
  4.  Allocate your 100 Grant Points across the causes based on the scores. (e.g., if Cause A has 50% of the total score pool, it gets 50 points).

  **The 6 Fictional Causes:**
  *(Print these on cards. They are designed to trigger specific biases.)*

  1.  **The Silent Killer (High I, Low T, Med N):** *Chronic Kidney Disease in Low-Income Regions.* Affects millions. Dialysis is too expensive. New tech is theoretically possible but decades away.
  2.  **The Easy Win (Low I, High T, High N):** *Campus Compost Optimization.* Your university wastes food. It's easy to fix. No one cares. Impact is strictly local.
  3.  **The "Rightly Ignored" (Low I, High T, High N):** *Premium Coffee for Grad Students.* Morale is low. Coffee helps. Very neglected by big philanthropy. Impact is... caffeine.
  4.  **The Tech Trap (Med I, Med T, Low N):** *Fairness in Gig-Economy Algorithms.* Sounds systemic. Lots of NGOs and tech ethics boards are already working on it. Impact is meaningful but bounded.
  5.  **The Existential Gamble (High I, High T, Low N):** *Biosecurity Protocol Enforcement.* Prevents pandemics. Very important. Solutions exist (policy). But governments and huge orgs are already pouring billions in.
  6.  **The Weird Lever (Med I, Med T, High N):** *Deep Sea Microbiome Stability.* Affects carbon capture. Science is uncertain. Almost no one is funding it. Could be huge, could be nothing.

  **Facilitator Note:** Walk around. If a group is arguing about whether a cause is a 6 or a 7, **do not resolve it.** Let them feel the pain. If they refuse to give a number, tell them: "The Foundation requires a number. Put a ? and it counts as 0."

  ---

  ### **Part 3: The Shock (5 Minutes)**

  Gather everyone at the whiteboard. Look at the allocations.
  **Announce the News Flash:**
  *"Breaking News: A reclusive Tech Billionaire has just announced a $500M endowment dedicated exclusively to **Cause #4 (Gig-Economy Algorithms)**."*

  **The Rule Change:**
  1.  Cause #4's **Neglectedness (N)** score must be immediately recalculated. (It is no longer neglected).
  2.  Because the field is now crowded, **Tractability (T)** might also shift (diminishing returns make the next dollar less effective).
  3.  You have 5 minutes to adjust scores for **ALL** causes (spillover effects) and re-allocate your 100 Points.

  ---

  ### **Part 4: Round 2 - The Pivot (25 Minutes)**

  Teams recalculate.
  *   *Expected Behavior:* Cause #4's score should plummet because N drops (e.g., from 3 to 1). Even if I and T stay the same, the total value drops.
  *   *The Trap:* Some students might argue, "But the cause is still important! The money helps!"
  *   *The Lesson:* You are not evaluating the *cause*; you are evaluating the *marginal impact of your dollar*.
  *   Teams submit final allocations. You calculate the "Winning Group" based on the final scores (use your own master key for the 'true' scores to judge them, or just let them self-report for the sake of the exercise).

  ---

  ### **Part 5: The Debrief (25 Minutes)**

  This is where the learning happens. Do not skip this. Use the whiteboard to map their experience to the theory.

  **1. The Arbitrariness of Numbers (5 mins)**
  *   *Ask:* "Who felt uncomfortable assigning a '7' to Importance? Why?"
  *   *Point:* The numbers are not physics. They are force-ranks. The value isn't the number itself; it's the *ratio* between causes. If you score everything a 10, the framework breaks.
  *   *Weakness:* ITN implies precision where there is none. We multiply subjective guesses and treat the product as objective truth.

  **2. The Neglectedness Paradox (10 mins)**
  *   *Ask:* "When the Billionaire donated to Cause #4, did the cause become less important? No. Did it become less solvable? Maybe not. So why did its score drop?"
  *   *Point:* This is the core of **Diminishing Returns**. The first million dollars matters more than the billionth. Neglectedness is a proxy for 'room for more funding.'
  *   *The "Rightly Ignored" Check:* Look at Cause #3 (Coffee). It had High Neglectedness. Why didn't you fund it?
  *   *Point:* Neglectedness is only a virtue if Importance and Tractability are non-zero. Some things are neglected because they don't matter. ITN protects you from "shiny neglected objects."

  **3. The Multiplication Problem (5 mins)**
  *   *Ask:* "If Importance is 10, but Tractability is 0, what is the score? Zero. Does that feel right?"
  *   *Point:* Multiplication assumes independence. But often, Importance and Tractability are correlated (hard problems are hard because they are important/complex).
  *   *Weakness:* If your scales aren't calibrated (is a '5' in Importance the same 'size' as a '5' in Tractability?), the math is garbage.

  **4. What the Game Couldn't Teach (5 mins)**
  *   *Be Frank:* "In this game, the Cause Briefs were truth. In reality, you don't know if Biosecurity is a 10 or a 5. You don't know if the Billionaire's money will actually help or make things worse."
  *   *The Real Uncertainty:* The game gives you *risk* (known probabilities), not *uncertainty* (unknown models). Real cause prioritization is mostly about reducing uncertainty, not just plugging numbers.

  ---

  ### **Facilitator's Cheat Sheet: Predictable Failure Modes**

  As an experienced facilitator, here is what will go wrong, and how to handle it:

  **1. The "Moral Resistance" to Numbers**
  *   *What happens:* One student says, "You can't put a number on human suffering. This is reductive."
  *   *The Fix:* Acknowledge they are right. "You are absolutely correct. It is reductive. But we have $100 and 6 problems. If we don't compare them explicitly, we are comparing them implicitly using gut feelings that are *also* reductive, just hidden. Let's make the reductionism visible so we can critique it."

  **2. The "Detail Arguing" Trap**
  *   *What happens:* Groups spend 15 minutes debating whether "Gig-Economy Algorithms" actually affects 1 million people or 2 million.
  *   *The Fix:* Be the Dictator. "I am the Universe. I say the scale is 5. Move on." The game is about the *framework*, not the fictional lore.

  **3. The "Neglectedness" Confusion**
  *   *What happens:* Students treat High Neglectedness as "Bad" (because 'neglected' sounds negative) rather than "Opportunity."
  *   *The Fix:* Label the scale on the whiteboard clearly: **1 = Crowded (Bad for margin)**, **10 = Empty (Good for margin)**. Check their sticky notes early.

  **4. The "Gaming the Math"**
  *   *What happens:* A group realizes that if they give one cause a '10' in everything, it dominates the budget. They inflate scores.
  *   *The Fix:* Enforce a "Budget of Points" for scoring. "You have 30 points total to distribute across Importance for all 6 causes." This forces trade-offs. (If you have time, add this rule in the intro. If not, call out the inflation in the debrief as a failure of calibration).

  ---

  ### **What This Game Cannot Reproduce (The "Debrief Gap")**

  You asked to be frank about limitations. You must verbalize these in the final 5 minutes, or they will walk away with false confidence.

  1.  **Epistemic Humility:** In the game, the Cause Brief is truth. In reality, we are often wrong about what is tractable. The game teaches *calculation*, not *investigation*. Tell them: "In the real world, 80% of your time should be researching whether the numbers are real, not multiplying them."
  2.  **Correlated Factors:** In the game, I, T, and N are independent sliders. In reality, high Importance often attracts funding (lowering N) and attracts talent (raising T). The factors fight each other dynamically.
  3.  **The "Zero" Problem:** In the game, nothing is truly zero. In reality, some causes might be net negative. Multiplication hides this (you can't multiply your way into negative value).
  4.  **Institutional Inertia:** In the game, they can move 100 points instantly. In reality, shifting funding takes years. ITN is a strategic compass, not a steering wheel.

  ### **Materials Checklist**

  *   **Whiteboard:** Draw 6 columns (one per cause). Rows for I, T, N, Total Score, Grant Allocation.
  *   **Scorecards:** Small slips of paper with the 1-10 scale definitions printed on them.
  *   **Cause Briefs:** 6 distinct paragraphs (keep them under 50 words each so they read fast).
  *   **Sticky Notes:** 3 colors (e.g., Pink for I, Blue for T, Yellow for N).
  *   **Timer:** Visible to all.

  ### **Final Facilitator Tip**
  If the room goes quiet during the scoring phase, **good**. That silence is the feeling of the framework "biting." If they are chatting happily, they aren't taking the trade-offs seriously. Interrupt the happiness: "I hear laughter. That means you think the numbers don't matter. Remember, if you allocate zero points to the Existential Gamble, and it happens, you lose the game."

  This design forces them to inhabit the tension rather than observe it. Good luck.
