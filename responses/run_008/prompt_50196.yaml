          *   Debits = Pain/Suffering.
          *   Netting Operation = Aggregation/Summation (Bentham's Felicific Calculus).
          *   "In the Black" = Positive Net Utility (The world is "good").
          *   The Goal = Maximize the bottom line (Net Surplus).
      *   *The Implication:* Everything is fungible. A dollar is a dollar. A unit of pain cancels a unit of pleasure. This is *strong commensurability*.

  3.  **Part 2: Where the Ledger Breaks Down:**
      *   *Issue 1: Fungibility.* In real accounting, \$1000 debt can be paid by \$1000 income. In morality, does 1000 units of itchiness really cancel 1 unit of torture? The *quality* matters, not just quantity.
      *   *Issue 2: The Zero Point.* In accounting, zero is neutral. In morality, is zero "no sensation" or "absence of suffering"? Negative Utilitarians argue the baseline matters.
      *   *Issue 3: Distribution.* Accounting cares about the total sum. Morality often cares about *who* holds the debt. (One person tortured vs. everyone getting a cookie). The ledger hides the *bearer* of the cost.
      *   *Issue 4: Infinity/Lexicality.* Some values resist quantification. If pain is lexically worse, it's not a number; it's a veto.

  4.  **Part 3: What the Analogy Smuggles In:**
      *   It assumes *continuity*.
      *   It assumes *substitutability*.
      *   It assumes *agent-neutrality* regarding the source of the credit/debit (it doesn't matter who suffers, just that the sum is low).
