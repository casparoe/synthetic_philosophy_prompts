answer: |-
  Your colleague's record is remarkably consistent, but it is not the consistency of a naive realist (who would say "if it's in the theory, it's real") nor of a strict instrumentalist (who would say "nothing is real"). She is drawing fine-grained distinctions between *ontology* (things), *structure* (dynamics/equations), and *reference* (continuity across theory change).

  Here are three principles that fit her past verdicts equally well, their predictions for your new cases, my assessment of her actual view, and a crucial test case to settle the matter.

  ### Three Candidate Principles

  **1. Selective Structural Realism (SSR)**
  *   **The Rule:** A posit is "real" if and only if the mathematical structure or relations defining it are preserved in the successor theory. The intrinsic nature of the entity (the "stuff") may be discarded, but the structural role survives.
  *   **Fit to Record:**
      *   *Ether:* The mechanical medium was discarded (not real), but the Fresnel/Maxwell equations survived (the "real part").
      *   *Point-Masses:* The objects were idealizations (not real), but the gravitational dynamics survived in GR (real).
      *   *Electron:* The classical description vanished, but the referential role and charge/mass structure persisted (real).
      *   *Phlogiston/Caloric:* No structural continuity to modern chem/thermo (not real).

  **2. Fundamental Ontological Naturalism (FON)**
  *   **The Rule:** A posit is "real" if and only if it appears in the inventory of our current best *fundamental* theory. Effective, phenomenological, or superseded posits are "not real," even if useful.
  *   **Fit to Record:**
      *   *Ether/Point-Masses:* Not in GR or QM (not real).
      *   *Electron/EM Field:* In the Standard Model/QFT (real).
      *   *Phlogiston/Caloric:* Not in current theory (not real).
      *   *Nuance:* This fits the "Not Real" verdicts perfectly. It accommodates the "Ether" nuance by treating the "real part" as a reference to the *current* field theory, not the past ether theory itself.

  **3. Causal-Experimental Realism (CER)**
  *   **The Rule:** A posit is "real" if and only if it denotes a causal source that can be manipulated or detected independently of the theory describing it ("If you can spray it, it's real").
  *   **Fit to Record:**
      *   *Electron:* We can manipulate electron beams (real).
      *   *EM Field:* We can engineer antennas (real).
      *   *Phlogiston/Caloric/Absolute Space:* No causal handle (not real).
      *   *Nuance:* This struggles slightly with the "Point-Mass" verdict (they caused gravity, so why not real?), unless she classifies them as non-causal idealizations. It fits the Ether verdict (couldn't manipulate the mechanical medium) well.

  ---

  ### Predictions for the New Cases

  | Case | **SSR** (Structure Survives) | **FON** (In Fundamental Theory) | **CER** (Can Manipulate) |
