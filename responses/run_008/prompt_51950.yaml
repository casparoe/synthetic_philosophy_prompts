      *   *The Sorites:* Acknowledge that vagueness is inherent to continuity. There is no sharp line, which implies identity might be vague (or the concept is flawed).
      *   *Parfit:* This is the crucial pivot. The user's messiness comes from trying to force *Relation R* into the box of *Numerical Identity*.
