answer: |-
  Here is the breakdown of your friend's metaphysical profile, the prediction for the "Wave" case, and the test case to expose her underlying rule.

  ### 1. Diagnosing the Rules
  You are right to be suspicious. Her verdicts look consistent on the surface, but they pull in different theoretical directions. Here is how the three candidate rules stack up against her five existing rulings:

  *   **Rule A: Sortal-Tracking (Conceptualism)**
      *   *Theory:* Objects exist only relative to the concepts (sortals) we apply to them. If we stop counting it as a statue, it ceases to be one.
      *   *Fit:* Explains **Goliath/Lumpl** (two concepts = two objects) and **Person/Body** (psychological sortal $\neq$ biological sortal).
      *   *Strain:* It struggles with the **House**. We could conceptually stop calling the renovated building a "house" and call it a "collection of new bricks," but she says it *is* the same house. This suggests she thinks there is a fact of the matter independent of our current labeling. It also struggles with the **Ring**; if we *called* the re-cast gold "the old ring," a strict sortal-tracker might have to accept that, but she says it's objectively a new ring.
  *   **Rule B: Persistence Conditions (Constitution View)**
      *   *Theory:* Objects are distinct if they have different modal properties (what they can survive). Constitution is a relation, not identity.
      *   *Fit:* This is the strongest fit. It perfectly explains **Goliath/Lumpl** (clay survives squashing, statue doesn't), **Ring** (gold survives melting, ring doesn't), and **Person** (person survives transplant, body doesn't).
      *   *Strain:* It requires a specific theory of *which* conditions belong to which sortal. Why does a House survive total brick replacement (loose matter conditions) but a Ring does not survive melting (strict form conditions)? She needs a principle to explain why some artifacts are matter-flexible and others are form-rigid.
  *   **Rule C: Continuous History (Causal/Narrative)**
      *   *Theory:* An object persists if there is an unbroken causal chain of the right kind.
      *   *Fit:* Explains the **Ring** (melting breaks the chain) and **Person** (psychological continuity).
      *   *Strain:* It strains against the **House**. If every brick is replaced, is the causal chain of the *structure* broken? She says no. This implies she cares about *functional* continuity, not just physical/causal continuity.

  **Verdict on the Rules:** She is almost certainly running a **Constitution View (Rule B)** with a specific add-on for artifacts: **Artifact Essentialism.** She believes artifacts have persistence conditions determined by their *intended function or status*, not just their matter.

  ### 2. Prediction: The Case of "Wave"
  **My Prediction:** She will say **Wave does not survive.** The statue ceases to exist; only the lump of clay remains.

  **The Reasoning:**
  Look closely at her **Gold Ring** verdict. She says if you melt a ring and re-cast it, it is a *new* ring. This is the key. It proves she believes artifacts can be destroyed even if their matter persists, provided their *defining continuity* is broken.
  *   For a **Ring**, the defining continuity is physical form/function. Melting breaks it.
  *   For a **House**, the defining continuity is habitation/structure. Renovation preserves it.
  *   For a **Statue/Artwork**, the defining continuity is usually *Art Status* (intent + recognition).

  In the "Wave" case, the artist *formally kills the work*. This is not like the House renovation (maintenance); it is like the Ring melting (termination). Even though the clay is still shaped like a wave, the "career" of the artwork has been intentionally terminated. Since she distinguishes the Statue from the Clay (Goliath/Lumpl), the Clay (Lumpl) survives on the shelf, but the Statue (Goliath) dies the moment the art-world status is revoked.

  **Why this wins the bet:** If she were a pure physicalist, she'd say the statue survives because the shape is there. If she were a pure sortal-conventionalist, she might say "it depends if we keep calling it Wave." But her Ring verdict shows she treats artifact destruction as *objective* based on the break in the artifact's specific conditions. Revoking art status is the functional equivalent of melting the gold.

  ### 3. The Test Case: "The Secret Swap"
  To confirm this diagnosis (and potentially win a future bet), spring this case on her. It forces a conflict between her **House** ruling (functional continuity) and her **Ring** ruling (physical/form continuity).

  **The Case:**
  > "Remember the house that survived the 10-year renovation where every brick was replaced? Imagine that during that renovation, the owners secretly hired a company to build a *perfect duplicate* of the house on the same foundation overnight while the family was on vacation. They tore down the original and put the replica in its place. The family returns, lives there for another 20 years, and never knows the difference. Is it the same house?"

  **Why this works:**
  *   **If she says "Same House":** She prioritizes **Functional/Sortal Continuity** over Physical History. This aligns with her House verdict but puts massive strain on her Ring verdict (why doesn't a re-cast ring count if the function is the same?). It suggests she is a Functionalist.
  *   **If she says "New House":** She prioritizes **Physical/Causal Continuity**. This aligns with her Ring verdict (melting breaks the chain) but strains her House verdict (replacing every brick should also break the physical chain). It suggests she is a Spatiotemporal Continuity theorist.
  *   **If she says "It depends on the Intent":** She is a true **Constitutionalist/Intentionalist** (my prediction). She will likely argue that because the *function* of the house (sheltering the family) was never interrupted, the House survives, unlike the Ring which was melted (function lost).

  **How to use it:**
  If she says **Wave died** (as I predict) but **the Swap House survives**, you have confirmed she runs a **Functionalist Constitution View**. Artworks require active status (Wave died), but Houses require only functional continuity (Swap House survived). If she says **both died**, she is a strict Physical Continuity theorist. If she says **both survived**, she is a Sortal Conventionalist.

  Good luck with the bet. Based on the Ring case, the "Art Status" is the fragile variable here. Wave is dead.
