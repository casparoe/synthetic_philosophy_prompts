answer: |-
  I think your friend makes a compelling case for thick extrapolation, and I want to start by conceding the strongest part of her argument because if we ignore it, the thin position looks like mere conservatism. She is right that our current values are often hostage to our ignorance. If I oppose a certain medical procedure because I mistakenly believe it causes harm, correcting that factual error changes my preference, and if I oppose a social arrangement because I lack the conceptual vocabulary to understand how it could be just, then merely correcting facts doesn't fix the underlying moral blind spot. There is something intuitively appealing about the idea that what I truly want is tied to who I would be if I were the best version of myself, not the compromised version I am now. If CEV is supposed to save us from ourselves, it seems counterproductive to stop the saving process halfway through just to preserve our current prejudices. However, I think the thin approach survives this critique because it rests on a different foundational goal than your friend assumes. She is treating CEV as an optimization process for value, whereas I see it as a preservation process for agency. The moment thick extrapolation adds new moral concepts or forces experiences that fundamentally alter the weighting of my current cares, it risks solving the problem of ignorance by solving the problem of me.

  This is the identity continuity problem I mentioned, but I think it goes deeper than just saying the extrapolated self is a stranger. It is about the asymmetry of care between the current self and the idealized self. If we allow thick extrapolation to add new values or radically reprioritize existing ones based on moral growth, we have to accept that the idealized me might not care about the things current-me finds essential. Maybe the idealized me realizes that my attachment to my specific family members is parochial and decides that resources should be distributed according to a strictly impartial calculus. That might be morally better, but it is no longer my volition in any meaningful sense. The rationale for using my volition as the input is that I am the stakeholder whose life is being lived. If the output reflects the values of a entity that shares my causal history but not my motivational structure, the AI is effectively being handed over to a successor species that happens to have originated from us. Thin extrapolation draws a bright line at correcting errors in the service of existing values, whereas thick extrapolation allows the values themselves to be rewritten in the name of improvement. The risk isn't just that the AI serves a stranger, but that it serves a stranger who has been authorized to override the interests of the actual person living under the AI's governance.

  This leads directly into the epistemic problem you noted, which is that thick extrapolation is underdetermined in a way that thin extrapolation is not. We have a reasonably shared understanding of what constitutes a factual error or a cognitive bias like scope insensitivity. We can model those corrections without needing to simulate a specific life history. But moral growth is not a single vector. There are countless ways a person could grow smarter, know more, and think faster, and different trajectories will lead to different moral endpoints. If I become a utilitarian after deep reflection, but you become a virtue ethicist, which path was the true extrapolation of our shared humanity? Because we cannot actually run this simulation in our heads, any claim about what thick extrapolation yields is inevitably a projection of the programmer's own values about what constitutes moral progress. Thin extrapolation acts as a constraint against this smuggling operation. It forces the system to work with the values we actually have, cleaned of obvious bugs, rather than allowing the designers to define what moral maturity looks like and then attributing that maturity to us.

  Now, regarding your point about aggregation, I don't think you are conflating two separate issues. In fact, I think the aggregation problem is where the political cost of thick extrapolation becomes undeniable. CEV usually involves combining the extrapolated volitions of all humans into a single coherent target for the AI. If we are using thin extrapolation, we are aggregating the cleaned-up preferences of the people who actually exist. There is a direct line of consent, however hypothetical, between the population and the outcome. But if we use thick extrapolation, we are aggregating the preferences of idealized entities that do not exist. The people living under the resulting AI regime are the current, non-idealized humans. If the bargain struck between millions of thickly-extrapolated selves requires sacrifices that the current selves would reject, on what grounds do we claim the current selves are bound by that agreement? It creates a democratic deficit where the governed are subject to laws justified by the consent of their better angels, who are not around to suffer the consequences. The legitimacy of the AI's rule depends on it being friendly to us, not to our potential successors.

  Your friend might argue that this consent problem applies to any long-term planning, but the distinction is that thick extrapolation explicitly changes the signatories of the social contract. If I agree to a diet plan based on what my healthy future self would want, that is fine because the future self is still me operating in the same moral framework. But if the healthy future self decides that food is irrelevant and I should be fed nutrient paste while I starve for culinary experiences, the contract is broken. Multiply this by billions of people, and the thick extrapolation process could easily generate a convergence that looks nothing like what humanity would consent to now. It might be a better world by some objective metric, but it would not be a world built on human volition. Thin extrapolation accepts that we might be morally flawed, but it insists that the correction for those flaws must come from us, through our own lived experience and reflection, not from an AI that simulates a growth trajectory we never actually took. The goal of Friendly AI should be to give us the future we want, not the future we should have wanted if we were different people.
