      *   If the sim shuts off tomorrow, retirement is useless. If it shuts off in 100 years, retirement is fine, longtermism is hurt.
      *   The real issue isn't the length, it's the *uncertainty*. But we act under uncertainty everywhere. We shouldn't assign P(shutdown) = 1.
      *   The "Simulation Discount" should apply to *everything*, but if it applies to everything, it cancels out in comparative terms (unless one project is more "sim-fragile" than another).

  8.  **Refine the Argument for the User:**
      *   Acknowledge the strength of (1)-(4). This is the "Bostrom Bind."
