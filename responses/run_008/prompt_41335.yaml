answer: |-
  You have put your finger on the central tension in modern decision theory and AI safety, and your intuition is correct: standard decision theory assumes a **Cartesian boundary** (a clean separation between agent and environment) that does not exist in physical reality.

  There is an established term for this configuration in the literature you are likely encountering (specifically within the Machine Intelligence Research Institute and associated decision theory circles): **Embedded Agency**.

  However, because this term is relatively new and siloed within AI safety rather than general philosophy or classical control theory, it is understandable that you missed it. It is often discussed alongside **Second-Order Cybernetics** (the engineering lineage) and **Enactivism** (the cognitive science lineage).

  Since you asked for precision, I will not just give you the label. I will define the configuration using your engineering intuition, distinguish it from simple feedback control, and explain why your three "breaking points" are indeed facets of a single structural constraint.

  ### The Term: Embedded Agency

  **Definition:** An embedded agent is a physical subsystem that optimizes a goal function over an environment that *contains* the agent itself, subject to the constraint that the agent's model of the environment (including itself) must be strictly smaller and less complex than the environment itself.

  This differs from the standard "Cartesian Agent" model (like AIXI or a standard POMDP) which assumes the agent can receive arbitrary sensory data and output arbitrary actions without its own computational process being part of the state space it is modeling.

  ### Why Your Three Problems Travel Together

  You identified three breakdowns: lossy self-modeling, blurred sensing/acting, and lack of external scoring. These are not separate issues; they are the necessary consequences of removing the Cartesian boundary. They travel together because they all stem from **computational irreducibility** and **causal entanglement**.

  1.  **The Lossy Self-Model (Gödelian Limit):**
      *   *Engineering view:* You cannot build an observer that perfectly reconstructs the state of a system if the observer is part of that system, unless the system is trivial. To simulate yourself perfectly, you need a computer as complex as yourself, which you cannot fit inside yourself.
      *   *Decision Theory view:* This creates **Logical Uncertainty**. The agent cannot know the output of its own computation before it computes it. If it could, it would face Löb's Theorem paradoxes (proving its own consistency leads to inconsistency).
      *   *Why it clusters:* Because the model is lossy, the agent cannot treat its own future actions as fixed facts known in the present. It must reason about *what it would do* without actually doing it yet. This breaks standard Causal Decision Theory.

  2.  **Blurred Sensing/Acting (Physicality of Computation):**
      *   *Engineering view:* In a standard block diagram, the sensor block and the actuator block are distinct. In an embedded system, the heat generated by the CPU (computation) affects the temperature of the plant (environment). The act of measuring (drawing current) changes the voltage.
      *   *Decision Theory view:* This is the **Problem of Intervention**. In a Cartesian model, `do(X)` is a primitive. In an embedded model, `do(X)` is a physical process that has side effects beyond the intended variable change.
      *   *Why it clusters:* Because computation is physical, information gathering is a form of action. You cannot "observe" without perturbing. This forces the agent to optimize its *information gathering* as part of its policy, not just its actuation.

  3.  **No External Vantage Point (Self-Referential Scoring):**
      *   *Engineering view:* Stability is usually proven by a Lyapunov function defined from outside. If the system must prove its own stability using its own logic, it hits Gödelian limits.
      *   *Decision Theory view:* This is the **Problem of Counterfactuals**. To evaluate a policy, you need to know "what would happen if I chose B instead of A." But if you are embedded, choosing B changes the physical state of the optimizer. There is no "outside" world where you chose B but kept your internal structure identical.
      *   *Why it clusters:* Without an external oracle to score outcomes, the agent must construct counterfactuals internally. But since its self-model is lossy (Point 1), its counterfactuals are necessarily approximations, leading to potential self-fulfilling or self-undermining prophecies.

  ### Distinguishing the Boundaries

  You asked where the edges are. Does a thermostat count? A firm? A human? The concept only "bites" when specific conditions are met. We can distinguish three levels of embedding:

  **Level 1: Embedded Control (The Thermostat)**
  *   **Configuration:** Controller is inside the plant.
  *   **Model:** None (or fixed heuristic).
  *   **Verdict:** This is your old work. It is *embedded control*, but not *embedded agency*.
  *   **Why it doesn't bite:** The thermostat does not model the room. It does not model itself. It does not reason about counterfactuals ("If I turned on the heat, the room would be warmer"). It simply reacts. The "lossy self-model" problem does not exist because there is no self-model.

  **Level 2: Strategic Embedding (The Firm)**
  *   **Configuration:** Firm sets prices; market includes the firm.
  *   **Model:** Models the market, including its own market share.
  *   **Verdict:** This is on the boundary.
  *   **Why it bites:** If the firm models the market's reaction to its prices, it is modeling a system that contains its output. However, if it treats its own internal decision process as a "black box" (i.e., "I will decide optimally" without modeling *how* it decides), it avoids the Gödelian trap. It bites only if the firm tries to model *its own decision process* as part of the market dynamics (e.g., "If the market knows I am an optimizer, they will anticipate my price cut").

  **Level 3: Reflexive Embedding (The Human / AGI)**
  *   **Configuration:** Agent models the world, including itself modeling the world.
  *   **Model:** Explicit self-model used for deliberation.
  *   **Verdict:** This is **Embedded Agency** proper.
  *   **Why it bites:** This is where your three problems converge. The agent must reason about its own reasoning. It encounters the "tiling agents" problem (how to trust a successor agent that is identical to itself) and the "Newcomb problem" (where your decision is correlated with the environment's state because both are outputs of similar computations).

  ### The Ancestral Literature

  While **Embedded Agency** is the modern decision-theoretic term, your control engineering background will find its roots in **Second-Order Cybernetics** (Heinz von Foerster, 1970s).
  *   **Slogan:** "The observer is the observed."
  *   **Relevance:** It explicitly deals with the closure of the observer into the system. However, cybernetics tended to focus on *stability* and *organization*, whereas your interest (and modern decision theory) focuses on *optimization* and *choice*.

  There is also a niche physics term: **Endophysics** (Otto Rössler).
  *   **Definition:** Physics described from the inside of the universe rather than the outside.
  *   **Relevance:** It addresses the "no external vantage point" issue directly, arguing that time and causality look different from the inside.

  ### Summary Definition for Your Use

  If you wish to use a term that bridges your engineering past with your philosophical present, I recommend using **Embedded Agency**, but defining it with the precision you requested:

  > **Embedded Agency** is the structural configuration wherein an optimizing subsystem is causally entangled with the environment it models, such that:
  > 1.  **Computational Containment:** The agent's self-model is necessarily a lossy compression of its own physical state.
  > 2.  **Causal Closure:** Sensing and acting are physical processes within the modeled causal graph, not boundary conditions.
  > 3.  **Evaluative Immanence:** Policy scoring must be performed by the agent itself, without access to an external truth oracle.

  **Why the pieces travel together:** They are the triad of constraints imposed by **physical realism** on **optimization**. You cannot have a physical optimizer that is larger than the universe, isolated from the universe, or judged by a god outside the universe. Once you accept the agent is physical, all three constraints apply simultaneously.

  **Recommendation:** If you want to read the specific literature tackling this, search for the **"Embedded Agency" research agenda by Scott Garrabrant and Abram Demski (MIRI)**. It is the only body of work that treats these three problems as a unified mathematical cluster rather than separate philosophical puzzles.
