prompt: |-
  so for my ethics seminar we have to write a short "where I stand" paper on the trolley stuff and before I hand it in I want someone to poke holes in my set of positions. Here it is: (1) I accept the doctrine of double effect — it's wrong to intend someone's death as a means to saving others, but it can be permissible to cause a death you merely foresee as a side effect, when the good is proportionate. (2) In the standard switch case (divert the trolley away from five and onto one) diverting is fine. (3) In the footbridge case (push the big guy off the bridge to stop the trolley) it's wrong, and I think double effect is exactly what explains the difference — the death is a means in the one case and a side effect in the other. (4) In the loop version — where the side track loops back around so the trolley would hit the five anyway unless the one person's body stops it — I still think diverting is fine, it feels basically like the switch case to me. (5) There's a point someone made in class that I actually agree with: in the footbridge case the man's death isn't strictly necessary for saving the five. What saves them is the trolley being stopped, and if by some fluke he survived the impact and the trolley still stopped, the five would be just as saved. (6) I don't think foreseeing a death with certainty is the same as intending it — a friend keeps telling me that if you're certain the one will die when you flip the switch, you "effectively" intend his death, and I keep saying no, because that would also condemn the painkiller cases in medicine that basically everyone accepts.

  Go through these and tell me which ones are actually in tension, which only look like they are, and how bad each tension is. Rank them by severity instead of giving me a flat list, and for each real one tell me what would have to give and roughly what giving it up would cost me elsewhere (like whether I can still keep my verdicts on the cases, or whether I lose the explanation I liked). Then tell me which single revision would clean up the most. Dont be gentle about it — the paper is due Friday and I'd much rather hear it from you than in the margins from my TA, who has already hinted that my take on the loop version might be "doing more work than I realize," which is honestly part of why im worried.
