  8.  **Final Polish:** Organize with clear headings. Ensure the distinction between *moral weight* and *enforceable authority* is clear. (This is the crux of the user's worry).

  **(Self-Correction during drafting):** I need to make sure I don't dismiss the neighbor's comment entirely. Sometimes culture *does* become policy. I should advise the user to probe whether this philosophy is *aspirational* or *operational*.

  9.  **Final Output Structure:**
