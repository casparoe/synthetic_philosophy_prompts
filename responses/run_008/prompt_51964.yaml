prompt: |-
  My partner and I just moved into a cohousing community (about 30 households, shared dinners a few nights a week, most decisions by rough consesus), and I'm trying to figure out where we now stand philosophically. At one of the dinners a neighbor described the place as "communitarian rather than liberal," and I went and looked it up — from what I can tell, communitarian philosophers like Sandel and MacIntyre think the community's values can legitimately override individual rights, and that liberals like Rawls got it wrong when they made individual rights the bottom line. So here's my question: living like this, how do I work out which of my personal choices the community is now entitled to weigh in on — how we raise our kid, what I post online, whether I can skip the shared meals, even religion eventually? Is there some principle for drawing the line between what's the community's business and what's mine, or does being a communitarian basically mean accepting that the line gets drawn wherever the group says it does? I'd rather know what I've actually signed up for now than find out at the next consesus meeting, honestly.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** The user and their partner moved into a cohousing community (30 households, shared dinners, consensus decision-making).
      *   **Trigger:** A neighbor described the community as "communitarian rather than liberal."
      *   **User's Understanding:** They've researched communitarianism (Sandel, MacIntyre) vs. liberalism (Rawls) and understand the core tension: community values vs. individual rights.
      *   **Core Question:** How do I determine the boundary between personal autonomy and community authority? Is there a principle, or is it just "whatever the group says"?
      *   **Underlying Concern:** Anxiety about loss of autonomy (parenting, social media, attendance, religion) and a desire for clarity *before* conflicts arise.

  2.  **Deconstruct the Philosophical Labels:**
      *   *Liberalism (Rawlsian):* Priority of the right over the good. Individual rights are trumps. The state/community is neutral about the "good life."
      *   *Communitarianism (Sandel, MacIntyre, Taylor):* The self is "encumbered." We are defined by our attachments. The "good" (community values) helps define the "right." Rights aren't absolute trumps if they undermine the community's fabric.
      *   *Cohousing Reality:* Most cohousing isn't a philosophical commune. It's a practical housing arrangement with social benefits. The neighbor's comment might be more descriptive of *vibe* than a strict philosophical charter.

  3.  **Address the Core Question (The Boundary Line):**
      *   *Is it "whatever the group says"?* Ideally, no. Even communitarians believe in limits. Unchecked majoritarianism (or consensus tyranny) is dangerous.
      *   *Is there a principle?* Yes, but it's likely implicit in the community's governing documents, not just in philosophy books.
      *   *Key Distinction:* "Cohousing" $\neq$ "Intentional Community/Commune." This is a crucial legal and practical distinction.

  4.  **Formulate a Strategy for the User:**
      *   **Validate:** Acknowledge the validity of the concern. It's a smart question to ask.
      *   **Clarify the Label:** Warn against taking one neighbor's philosophical label as legal/structural doctrine. Cohousing is usually pragmatic, not ideological.
      *   **Identify the Actual Boundaries:** Where does the authority actually come from? (Bylaws, agreements, norms).
      *   **Philosophical Framework (Practical Application):** How to think about the "line" using communitarian logic without surrendering all rights.
          *   *Harm Principle (modified):* Does this choice harm the community's viability?
          *   *Reciprocity:* If I benefit from the commons, what do I owe?
          *   *Exit Rights:* The ultimate liberal safeguard in a communitarian setting.
      *   **Actionable Steps:** What should the user *do* now? (Read docs, ask questions, observe).

  5.  **Drafting the Response (Iterative Process):**

      *   *Intro:* Validate the insight. It's a profound question. But caution against over-interpreting one neighbor's comment.
      *   *Section 1: Cohousing vs. Commune.* This is vital. Most cohousing is private ownership + shared space. It's not a collective where the group owns you. Distinguish *social pressure* from *governance authority*.
      *   *Section 2: The Philosophical "Line".* If they *are* leaning communitarian, how does that work?
          *   Sandel/MacIntyre don't advocate totalitarianism. They argue rights are *contextual*.
          *   The "Line" is usually drawn at *sustainability of the common good*.
          *   Example: Skipping meals (low impact) vs. Noise/Safety (high impact).
      *   *Section 3: The "Consensus" Trap.* Consensus can feel more coercive than voting. Discuss the difference between "policy" and "norms."
      *   *Section 4: Practical Due Diligence.* What documents matter? (Bylaws, Covenants, CC&Rs). These are the *real* rules, not the philosophy.
      *   *Section 5: The "Exit Option".* The ultimate check on community power is the ability to leave. If that's restricted, it's a red flag.
      *   *Conclusion:* Reassure. It's likely more about "thick social norms" than "legal authority."

  6.  **Refining the Tone:**
      *   Needs to be empathetic but analytical.
