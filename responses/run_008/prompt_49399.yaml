answer: |-
  ### The verdict
  The argument collapses at **Step 3**, which incorrectly assumes current variance predicts future responsiveness, leading to the false conclusion in **Step 5**. Heritability describes the sources of *existing* differences within a specific context, not how those differences change when the environment itself is altered.

  ### Step-by-step autopsy
  **Premise 1:** Roughly correct for adults in wealthy nations, though estimates vary by age and study design.
  **Premise 2:** Statistically true for current variance decomposition, but misleadingly implies environmental influence is inherently small or fixed.
  **Premise 3:** **False.** Heritability is context-dependent; changing the environment changes the variance structure, potentially shrinking gaps if interventions target limiting factors.
  **Premise 4:** Technically true (less environmental variance raises heritability), but irrelevant to whether absolute gaps or population means change.
  **Premise 5:** **False.** Policy can shrink gaps if environmental disadvantages are unequally distributed or if interventions have differential benefits.

  ### The height test
  Height is 80% heritable in rich countries, yet the Dutch gained 20cm in 150 years due to nutrition alone. This proves high heritability doesn't prevent massive environmental shifts in averages. Furthermore, height heritability drops in poorer nations because environmental variance (malnutrition, disease) overwhelms genetic potential. If your cousin's logic held, the Dutch couldn't have grown taller, and heritability would be high everywhere. Instead, when environments improve and equalize, averages shift and gaps can close, demonstrating that heritability estimates are snapshots, not destiny.

  ### What my cousin can still claim
  He is right that within current wealthy societies, genetic differences explain most existing IQ variation. Heritability predicts swapping two kids' schools today might not change their ranking. It tells us that under status quo conditions, genes drive differences. However, it says nothing about changing the status quo, fixing systemic inequalities, or comparing populations across time. It measures the present, not potential.
