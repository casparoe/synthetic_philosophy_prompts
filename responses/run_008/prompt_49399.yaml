  Okay so this started at thanksgiving and has been bugging me for two weeks. My older cousin is really into genetics youtube and he hit me with this argument about IQ and I couldn't answer it even though I'm pretty sure it's wrong. He says: (1) Twin studies in rich countries find IQ is around 80% heritable, meaning 80% of the variation between people is due to genetic variation. (2) If genes cause 80% of the differences, then enviroment can only cause the remaining 20%. (3) So if you improved everyone's environment equally — better schools, better nutrition, whatever — the *differences* between people would stay basically the same, since you haven't changed anyone's genes. (4) In fact equalizing environments would push heritability UP toward 100%, because you've removed environmental variation, so the gaps would be more genetic than ever. (5) Therefore stuff like school funding or nutrition programs can never shrink achievement gaps, at best they lift everyone equally. And he backs it up with the fact that identical twins raised apart really do end up with very similar IQs, so it's not like their making premise 1 up.

  The reason I suspect something is broken: I remember reading that height is ALSO super heritable in rich countries, like 0.8, yet the Dutch gained something like 20 cm in average height over the last century and a half, which was obviously nutrition and not genes. Also apparently IQ heritability is much lower in poorer countries, which seems weird if genes are just out there causing the differences. But I genuinely can't point at which numbered step is the wrong one — 2 through 4 each sound fine to me on their own. If I had to keep one premise it would be 1, since the twin data seems solid.

