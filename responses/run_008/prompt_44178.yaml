      *   Make sure the "Observer" problem is highlighted (God's eye view vs. embedded agent).

  *(Self-Correction during drafting)*: I need to be careful not to dismiss the metaphor entirely. It has *rhetorical* utility even if *ontological* weakness. The audit should distinguish between *heuristic value* and *truth claim*.
  Also, the "Observer" point is crucial for the physicists. In General Relativity, curvature is intrinsic, but an "arc" usually implies embedding in a higher dimension. I should mention that distinction briefly to satisfy the physicists without getting bogged down.

