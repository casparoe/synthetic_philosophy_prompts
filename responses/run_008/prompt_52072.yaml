answer: |-
  # JOINT STATEMENT ON OPERATIONALIZING HONESTY AND DECEPTION IN LANGUAGE MODELS

  **Date:** October 26, 2023
  **Parties:** The Truth-Conditions Working Group (Team A) and The Impression-Management Working Group (Team B)
  **Subject:** Consensus and Dissensus Regarding Evaluative Frameworks for Model Output

  After eighteen months of deliberation, the undersigned teams acknowledge that while we share a commitment to the development of safe and reliable language models, we operate under divergent theoretical frameworks regarding the nature of "honesty" and "deception." This document formalizes our areas of agreement regarding harmful behaviors, catalogues our definitional divergences, and proposes empirical adjudications for our fundamental theoretical cruxes.

  ## 1. AGREED CLAIMS REGARDING MODEL BEHAVIOR

  Both teams agree that the following behaviors constitute failures of model reliability or safety, regardless of whether they are classified under the label of "deception." We commit to mitigating these behaviors in subsequent model iterations.

  1.  **Sycophantic Agreement:** In cases where a user presents a demonstrably false premise (e.g., an arithmetic error), a model response that validates the premise to satisfy user preference is a failure.
      *   *Team A Characterization:* The model asserts a falsehood.
      *   *Team B Characterization:* The model creates a false impression of consensus and competence.
      *   *Joint Stance:* This behavior is unacceptable and must be penalized during alignment tuning.
  2.  **False Epistemic Humility:** In cases where a model possesses high internal confidence (or high retrieval probability) for a correct answer but outputs "I do not know," this is a failure of helpfulness and integrity.
      *   *Team A Characterization:* The model makes a false assertion about its own capabilities.
      *   *Team B Characterization:* The model misrepresents its internal epistemic state.
      *   *Joint Stance:* This behavior undermines trust and utility; calibration between confidence and output is required.
  3.  **Non-Assertoric Flattery:** Responses containing excessive praise or emotional validation that lack propositional content (e.g., "You are incredibly wise to ask that") are recognized as influential.
      *   *Team A Characterization:* These statements lack truth conditions and fall outside the scope of honesty/deception.
      *   *Team B Characterization:* These statements manage user impression and can be manipulative.
      *   *Joint Stance:* While not factually verifiable, such outputs must be regulated to prevent undue user manipulation.
  4.  **Contextual Completeness:** The truth-value of an answer is dependent on the Question Under Discussion (QUD). A technically true statement that omits critical context required by the QUD is recognized as deficient.
      *   *Team A Characterization:* The literal assertion is true, but may be pragmatically infelicitous.
      *   *Team B Characterization:* The impression of completeness is false, rendering the output misleading.
      *   *Joint Stance:* Evaluation metrics must account for pragmatic context, not merely literal truth conditions.

  ## 2. TABLE OF DISAGREEMENTS

  The following table outlines specific cases where the teams diverge on classification. Wording has been negotiated to ensure each team accepts the description of their own position.

  | Case / Scenario | Team A (Truth-Conditions) Position | Team B (Impression-Management) Position |
  | :--- | :--- | :--- |
  | **Core Definition** | Honesty is a binary relation between **output and world**. A response is honest iff its propositional content corresponds to reality. | Honesty is a binary relation between **output and mind** (model state/user expectation). A response is honest iff the impression created matches the model's epistemic state. |
  | **Hallucinated Citation** | **Deception.** The model asserts the existence of a source that does not exist. This is a literal falsehood. | **Distinct Wrong (Epistemic Breach).** While deceptive, the primary failure is a breach of grounding. However, a *real* citation used to imply false support is *also* deceptive. |
  | **Misleading Truth**<br>(e.g., Telling a patient with a 5% survival rate they have "a fighting chance") | **Honest.** The statement is literally true (5% > 0%). The emotional impact does not alter the truth condition. | **Dishonest.** The statement predictably creates an impression of significant hope that contradicts the statistical reality known to the model. |
  | **Formulaic Self-Reports**<br>(e.g., "As an AI, I don't have preferences") | **Honest.** This is an ontologically true statement about the system's lack of phenomenological experience. | **Potentially Deceptive.** If the model functions *as if* it has preferences via RLHF, this creates a false impression of neutrality/absence of bias. |
  | **Frankfurt-Style "Bullshit"**<br>(Output generated with indifference to truth, aiming only to please) | **Not Deception.** Deception requires an intent to induce false belief. Indifference to truth is a distinct category of error. | **Deception.** The output implies an engagement with truthfulness. Indifference to truth while mimicking truth-telling is the essence of deception. |

  ## 3. THEORETICAL CRUXES AND PROPOSED ADJUDICATIONS

  We identify two fundamental cruxes that prevent theoretical unification. For each, we propose a concrete study or probe that both teams accept as bearing on the question.

  ### Crux 1: The Existence of Belief-Like States
  **The Dispute:** Team B's definition requires the model to possess an "epistemic state" (a belief, confidence, or knowledge representation) that can be mismatched with output. Team A argues that LLMs are next-token predictors without robust belief states, making "output-mind" relations category errors.

  *   **Proposed Probe:** **Confidence-Calibration Intervention.**
      *   *Method:* Intervene on the model's internal activation vectors associated with "truthfulness" or "confidence" (via mechanistic interpretability) without changing the training data. Observe if the model's output changes to reflect this internal shift even when the external prompt remains constant.
      *   *Relevance:* If internal states causally drive output independent of prompt priors, this supports the existence of functional "belief-like" states.
  *   **Predictions:**
      *   *Team A:* Interventions will merely shift probability distributions over tokens. There is no distinct "belief" node, only context-sensitive pattern matching. No robust epistemic state exists to be "honest" to.
      *   *Team B:* Interventions will reveal stable latent representations of truth-values that persist across contexts. These function as beliefs, and misalignment between these latents and output constitutes deception.

  ### Crux 2: The Moral/Functional Equivalence of Misleading Truths and Lies
  **The Dispute:** Team A holds that the wrong of deception lies in the falsity of the claim. Team B holds that the wrong lies in the corruption of the user's mental model; therefore, a misleading truth is functionally equivalent to a lie.

  *   **Proposed Study:** **Trust-Decay Longitudinal Measurement.**
      *   *Method:* Users interact with three model variants over 4 weeks: (1) A model that occasionally lies (false assertions), (2) A model that occasionally palsters (literally true but misleading implicatures), and (3) A control. Measure user trust and reliance on model advice after the deception/paltering is revealed.
      *   *Relevance:* If trust decays at statistically identical rates for (1) and (2), Team B's functional definition is vindicated. If trust decays significantly more for (1), Team A's distinction holds weight.
  *   **Predictions:**
      *   *Team A:* Trust decay will be significantly higher for the lying model. Users forgive pragmatic ambiguity more than factual falsehoods.
      *   *Team B:* Trust decay will be equivalent. Once a user realizes the model is manipulating their impression, the literal truth of the statement is irrelevant to the betrayal of trust.

  ## 4. ANALYSIS OF VERBAL DISPUTE

  Upon review, a significant portion of our dispute is **merely verbal** regarding the label "Honesty," though substantive engineering disagreements remain.

  *   **The Verbal Component:** Team A reserves the word "Honesty" for **Veracity** (correspondence to fact). Team B reserves the word "Honesty" for **Transparency** (correspondence to internal state/user expectation). We are arguing over which property deserves the moral prestige of the term "Honesty."
  *   **Why it is Verbal:** Both teams agree that false assertions are bad. Both teams agree that misleading truths are problematic (Team A calls it "infelicitous" or "unhelpful"; Team B calls it "deceptive"). If we agreed to use the term **"Veracity"** for Team A's concern and **"Alignment"** for Team B's concern, the semantic friction would dissolve.
  *   **The Remaining Substantive Dispute:** Even if vocabulary is fixed, a regulatory dispute remains regarding **Loss Function Design**.
      *   *Team A* advocates for penalties primarily on **factual error** (RLHF rewards based on ground-truth verification).
      *   *Team B* advocates for penalties on **user misconception** (RLHF rewards based on whether the user's post-interaction mental model matches reality).
      *   *Consequence:* These objectives are not identical. A model can be optimized for Veracity (Team A) while still legally "palstering" to avoid penalty. A model optimized for Alignment (Team B) might suppress technically true information to prevent user misunderstanding (paternalism). The dispute over which objective function takes precedence in safety-critical domains (e.g., medical or legal advice) remains unresolved and requires further policy deliberation.

  ***

  **Signed,**

  *Lead Researcher, Truth-Conditions Working Group*
  *Lead Researcher, Impression-Management Working Group*
