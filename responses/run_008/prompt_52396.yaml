answer: |-
  Friends, family, sangha, and colleagues, we gather to witness Dana and Marcus not as static entities merging, but as flowing processes aligning. We are here to honor a commitment made across the impermanence of life.

  Dana has spent fifteen years sitting with the truth that the self is empty. Marcus studies how the brain constructs the self as a model. They arrive at this altar from opposite directions, meeting in the recognition that who you are today is not who you will be in ten years. Traditional weddings promise eternity between solids. This ceremony acknowledges that while the selves change, the intention can remain steady.

  Marriage is not a cage for the soul, but a container for the practice. It is the agreement to walk the same path even as the walkers change. Marcus jokes that the self is just the brain's user interface; Dana says it's empty. Fortunately, both agree that ignoring the check-engine light is still a bad idea. Love is not owning the dashboard; it is caring for the drive.

  So, how do you promise without a permanent promiser? You promise from this moment to the next. You bind not your essence, but your direction.

  **The Vows**

  Dana, please repeat:
  I, this current arising, take you, Marcus, as my partner.
  I know you will change, and I will change.
  I promise to meet whatever form you take with kindness.
  I promise to tend this connection even as the conditions shift.
  I vow to practice love not as a possession, but as an action.

  Marcus, please repeat:
  I, this current arising, take you, Dana, as my partner.
  I know the self is a story, but this story matters.
  I promise to care for the future iterations of you.
  I promise to hold this space when the ground feels empty.
  I vow to walk this path until the path ends.

  **The Ring Exchange**

  These rings are circles, having no beginning and no end. They are not shackles, but reminders. When you look at them, remember that gold holds its shape only because of pressure and heat. Wear them as a reminder that continuity is made, not found.

  Dana, place the ring on Marcus's finger:
  With this ring, I honor our continuity.

  Marcus, place the ring on Dana's finger:
  With this ring, I honor our continuity.

  **The Pronouncement**

  You have spoken your intentions before this community. You have acknowledged the impermanence of your selves and the durability of your care. You have not promised to freeze time, but to move through it together.

  There is a power in this room, born of your families' faith and your sangha's practice. It is the power of presence. By the authority of this present moment, I pronounce you partners for the path ahead. You are now bound by the promise to meet each other, again and again.

  Go now, as you are, into what comes.

  Vow strategy: Frame vows as commitments between unfolding processes rather than static entities, emphasizing continuous renewal over permanent contract.
