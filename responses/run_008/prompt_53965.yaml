answer: |-
  This is not boring at all. You have stumbled directly into the central tension in the philosophy of language from the 1970s to today. You are correctly identifying the friction between **Semantic Externalism** (meaning is outside the head) and the messy reality of how scientific classification actually evolves.

  You are right that **"Division of Linguistic Labor"** (Hilary Putnam) covers your first batch of examples (the jackdaw/rook and the grandmother's arthritis). That concept explains how *individuals* can defer to experts.

  But your second batch—where the *experts/community* are wrong, or where the "essence" turns out to be fragmented—requires a different set of tools. There isn't one single catchy phrase like "Division of Labor," but there is a specific framework for it.

  Here is the carve-up you asked for.

  ### 1. The Umbrella: The Causal Theory of Reference
  The overarching framework for both of your observations is the **Causal Theory of Reference** (championed by Kripke and Putnam).

  The core tenet is that words latch onto the world via a historical chain of usage (an initial "baptism" of a thing, passed down to us), not via a description in our heads. Because the link is causal/historical rather than descriptive, the theory explicitly allows for **"Ignorance and Error."**

  *   **The Term:** Philosophers literally refer to this as **"Reference under Ignorance and Error."**
  *   **The Mechanism:** I can refer to *Einstein* even if I believe he invented the lightbulb. I can refer to *Gold* even if I think it's a yellow liquid. The reference is secured by the causal chain, not my beliefs.

  This explains why your grandmother isn't speaking a private language. She is plugged into the public causal chain of the word "arthritis," even if her descriptive understanding of it is false.

  ### 2. The Carve-Up: Gold vs. Jade vs. Whale
  Your intuition that the "Jade" case differs from the "Gold" case is philosophically spot-on. This is where the **Microstructural Essence** view clashes with the **Homeostatic Property Cluster** view.

  #### Case A: Gold (The Microstructural Essentialist)
  *   **The Status:** "Gold" is treated as a **Natural Kind Term** with a hidden essence.
  *   **The Rule:** Putnam argued that for terms like "water" or "gold," the extension is fixed by the underlying microstructure (H₂O, Atomic Number 79).
  *   **Can the community be wrong?** In a sense, no. If the community points to a pile of metal and says "This is gold," but it turns out to be Pyrite (Fool's Gold), we say the community was *mistaken* about the extension. They *thought* they were referring to Au, but they were pointing at FeS₂.
  *   **Why:** The word "gold" is rigidly designated to *whatever has atomic number 79*. If the stuff you have doesn't have that number, you aren't using the word "gold" correctly, even if everyone agrees you are. The science dictates the meaning.

  #### Case B: Jade (The Counter-Example)
  *   **The Status:** This is famous in philosophy as **"The Jade Counter-Example."** Putnam himself had to concede that "jade" breaks his strict microstructural rule.
  *   **The Rule:** Jadeite and Nephrite are chemically distinct. By the "Gold" rule, "Jade" should be an ambiguous term (like "bank" for river/money). But it isn't. We use it as a unified term.
  *   **Why:** "Jade" is not defined by its microstructure; it is defined by its **superficial properties** (green, hard, polishable, carveable).
  *   **The Term:** Philosophers (like Richard Boyd) call this a **Homeostatic Property Cluster (HPC)**. A kind is defined not by one essential atom, but by a cluster of properties that tend to hang together. In the case of jade, the "cluster" is aesthetic/functional, not chemical.
  *   **Answering your question:** The community *doesn't* get to be wrong about Jade in the same way as Gold, because "Jade" was never about the chemistry to begin with. The word successfully referred to a *functional kind*, not a *chemical kind*. When science discovered the chemical split, it didn't change the word's meaning; it just added scientific footnotes to a folk category.

  #### Case C: Whales/Fish (The Taxonomic Revision)
  *   **The Status:** This is a conflict between **Folk Taxonomy** and **Scientific Taxonomy**.
  *   **The Rule:** In folk biology, "fish" is defined functionally (lives in water, swims, has fins). In Linnaean/Phylogenetic taxonomy, "fish" is defined by ancestry (gills, cold-blooded, specific clade).
  *   **Did the meaning change?** This is debated.
      *   **View 1 (Discovery):** Whales were never fish. The word "fish" always implicitly tracked ancestry, we just didn't know it. (This aligns with the "Gold" view).
      *   **View 2 (Meaning Change):** The word "fish" *did* change meaning. In 1700, "fish" meant "aquatic animal." In 2000, "fish" means "non-tetrapod craniate." We engaged in **Conceptual Engineering** or **Taxonomic Revision**.
  *   **Most Consensus:** Most philosophers of biology lean toward View 2. "Fish" is a **paraphyletic group**. We excluded whales not because we discovered a hidden essence of "fish-ness" that whales lacked, but because we decided to reorganize our language to match evolutionary trees better. This is a change in *classification*, not necessarily a discovery of a pre-existing metaphysical fact.

  ### 3. One More Tool: Reference Magnetism
  You asked: *"Where the communal fact that's supposed to settle usage is absent... and the word goes on meaning something anyway."*

  David Lewis offered a concept called **Reference Magnetism** (or *Eligibility*).
  The idea is that the world has "natural joints." Some groupings of things are more "eligible" to be the referents of our words than others. Even if our descriptions are messy or wrong, our words are "magnetically" pulled toward the most natural kind in the vicinity.

  *   **Gold:** The "magnet" is Atomic Number 79. It's so strong it pulls the word "gold" to it, ignoring superficial look-alikes.
  *   **Jade:** The "magnet" is weaker. The superficial properties (green stone) are strong enough to hold the word together, even though the chemical reality is split.
  *   **Whales:** The "magnet" shifted. Originally, the "aquatic" magnet was strong. Later, the "evolutionary ancestry" magnet became stronger for scientists, pulling the word "fish" away from whales.

  ### Summary of Terms
  If you want to search for more reading, here is the vocabulary list for the phenomena you noticed:

  1.  **Semantic Externalism:** The broad view that meaning isn't just in the head.
  2.  **Division of Linguistic Labor:** Why *you* don't need to know the difference between a rook and a jackdaw (Individual ignorance).
  3.  **Reference under Ignorance and Error:** Why the *community* can be wrong about the properties of a thing but still refer to it (Community ignorance).
  4.  **Homeostatic Property Cluster (HPC):** Why "Jade" stays one word despite having two chemical structures (Functional kinds vs. Microstructural kinds).
  5.  **Taxonomic Revision / Conceptual Change:** Why "Whales aren't fish" might be a change in our language games rather than a discovery of a hidden essence.

  **To answer your specific final question:**
  *Does the community get to be wrong about jade the way it can't be wrong about gold's atomic number?*

  **Yes.** Because "Gold" is a **Microstructural Kind** (the essence *is* the chemistry), whereas "Jade" is a **Functional/Aesthetic Kind** (the essence is the use/look). The community cannot be wrong about Gold's chemistry because the chemistry *makes* it gold. The community *can* be "wrong" (or rather, indifferent) about Jade's chemistry because the chemistry doesn't make it jade; the carving does.
