answer: |-
  You have stumbled into one of the deepest, messiest rabbit holes in philosophy and law. You are absolutely right to feel that something weird is going on. Your intuition that "nothing cannot cause something" is shared by many physicists and metaphysicians, but your intuition that the cousin is responsible is shared by almost every moral and legal system in history.

  Here is the breakdown of what is happening, the names for these concepts, and where the line is actually drawn.

  ### 1. The Name of the Problem
  The specific concept you are looking for is **Causation by Omission** (or *Omissive Causation*).

  The broader debate is often framed as **Acts vs. Omissions**. The specific puzzle about why the cousin counts but the guy in Ohio doesn't is sometimes called the **Problem of Infinite Omissions** or the problem of **Causal Selection**.

  ### 2. Can "Nothing" Cause "Something"?
  This is the metaphysical heart of your question.
  *   **Physically:** Your cousin is right. In the strict laws of physics, causation usually involves the transfer of energy or momentum. Your cousin did not transfer energy to the plants. The sun transferred energy to the leaves, evaporation transferred water out of the soil, and gravity pulled the molecules apart. Your cousin physically did *nothing*.
  *   **Counterfactually:** Your grandma is right. In logic and explanation, we use the **Counterfactual Theory of Causation**. This asks: *If X had not happened, would Y have occurred?*
      *   If the cousin *had* watered the plants, they would be alive.
      *   Therefore, his not watering them is a necessary condition for their death.

  Most modern philosophers argue that omission isn't "physical" causation, but it is **explanatory** causation. It explains *why* the event happened in a way that matters to humans, even if it doesn't satisfy the laws of physics. So, when Grandma says "You killed them," she is speaking morally and explanatorily. When Cousin says "I didn't touch them," he is speaking physically. **They are both right, but they are using different dictionaries.**

  ### 3. The "Guy in Ohio" Problem (Causal Selection)
  This is the part that kept you up at night. If "not watering" is the cause, then *everyone* who didn't water them is a cause. The neighbor, you, the guy in Ohio. Logically, you are all equal. So how do we pick the cousin?

  Philosophers and legal theorists (most notably **H.L.A. Hart and Tony Honoré** in their book *Causation in the Law*) argue that we don't pick causes based on physics alone. We pick them based on **Normative Expectations**.

  We scan the world for "abnormal" conditions or breaches of duty.
  *   **The Background:** Plants need water. People play Xbox. People in Ohio stay in Ohio. These are "normal" states of affairs. We don't list normal background conditions as causes. (We don't say "The plants died because of the absence of rain from the sky" unless it was a drought).
  *   **The Abnormality:** A person who *promised* to water plants and *didn't* is a deviation from the expected norm.

  **The Rule for Picking the Non-Doer:**
  The rule that filters out the Ohio guy and selects the cousin is **Assumption of Duty** combined with **Salience**.
  1.  **Assumption of Duty:** By agreeing to do it, the cousin moved himself from the "background" (everyone else) to the "foreground" (the designated agent). He created a specific expectation.
  2.  **Salience:** In the story of the dead plants, the cousin is the most *relevant* character. The Ohio guy is irrelevant noise.

  So, to answer your question: Yes, there is a rule. It is not a law of physics; it is a **social and normative filter**. We select the cause that involves a breach of a specific obligation.

  ### 4. Killing vs. Letting Die
  You asked if there is a difference between "causing death" and "letting happen."
  *   **The Doctrine of Doing and Allowing:** Many philosophers argue there is a moral difference. Actively poisoning a plant is "killing." Failing to water it is "letting die."
  *   **The Consequentialist View:** Other philosophers (like Peter Singer) argue the result is the same (dead plant), so the moral blame should be the same.

  However, in law and common sense, the distinction is huge.
  *   **Killing:** You intervene to change the course of nature to cause death.
  *   **Letting Die:** You refrain from intervening in a course of nature that leads to death.

  Your cousin "let them die." But because he had a **duty of care**, the law and morality often treat "letting die" (when you have a duty) as equivalent to "killing." This is why Grandma says "You killed them." She is collapsing the distinction because his duty makes the omission just as blameworthy as an action.

  ### 5. The Toddler in the Pool
  This is the crucial test case.
  *   **The Scenario:** You watch a toddler fall in. You do nothing. Toddler drowns.
  *   **The Duty:** In the US, generally, there is no *legal* duty to rescue a stranger (unlike in France or Germany). However, there is a nearly universal *moral* duty.
  *   **The Comparison:**
      *   **The Cousin:** Had a specific, voluntary duty (promise) + proximity.
      *   **The Neighbor:** Had proximity + general moral duty, but no specific promise.
      *   **The Toddler Watcher:** Has a general moral duty (and often a legal one if they are a caregiver, but not if they are a stranger).

  **Where does the line fall?**
  The toddler-watcher is on the **same side of the line as the cousin** regarding *moral blame*, but perhaps not legal blame (depending on jurisdiction).
  Why? Because of **Capacity and Proximity**.
  *   The guy in Ohio lacks *capacity* (he can't get there in time).
  *   The neighbor lacks *assumed duty* (didn't promise).
  *   The cousin and the toddler-watcher both have **capacity** (they are there) and a **duty** (one promised, one is a basic moral agent witnessing a catastrophe).

  Philosopher **Judith Jarvis Thomson** argued that we have "modest" duties not to harm, but "stronger" duties once we undertake a task or are in a unique position to help. The cousin put himself in a unique position. The toddler-watcher is in a unique position by chance. Both are morally culpable for omitting to act, but the cousin is *more* culpable because he invited the responsibility.

  ### 6. So, Who Wins the Argument?
  Here is the philosophical verdict you can take to your family:

  1.  **Is it real causation?** No, not physically. The cousin did not inject death into the plants. The lack of water did. But yes, explanatorily. His omission is the best *explanation* for the death.
  2.  **Did he kill them?** Technically, he "let them die." But because he accepted the **Duty of Care**, the moral weight is the same as killing. Grandma is morally right; Cousin is physically right.
  3.  **Why not the neighbor?** Because the neighbor didn't alter the **Normative Expectation**. The world expects neighbors to be neighbors; it expects designated plant-sitters to sit plants. The cousin broke a specific rule of the social contract he agreed to.
  4.  **The "Nothing" Problem:** You are right that "nothing" happened. But in human affairs, **expectations are real things**. When you create an expectation (a promise) and then fail to meet it, the "absence" of that action becomes a powerful force.

  **The Bottom Line:**
  Your cousin is trying to hide behind **Metaphysical Causation** (I didn't touch them).
  Your grandma is arguing from **Moral Causation** (You broke the chain of survival you promised to maintain).

  In human relationships, Moral Causation wins. The "bad thing" he did wasn't an event in time; it was the **breach of a reliance**. You relied on him; he didn't deliver. That is why he is the "killer" in the story, and the guy in Ohio is not. The guy in Ohio was never part of the story. The cousin wrote himself into the script and then refused to say his lines.

  **Philosophical Term to Drop:** If you want to sound like you know what you're talking about, tell them this is a classic case of **"Causation by Omission filtered by Normative Salience."** The cousin wasn't just a non-doer; he was a *relevant* non-doer.
