  | **1. Sleeping Beauty** | **1/3 (Thirder)** | ❌ (Implies 1/2) | ✅ (Implies 1/3) | ✅ (Implies 1/3) |
  | **2. Doomsday Arg.** | **Reject** | ❌ (Supports Doomsday) | ✅ (Cancels Doomsday) | ✅ (Cancels Doomsday) |
