prompt: |-
  Second-year PhD student here in philosophy, with a strong decision theory / logic background but pretty weak measure theory, trying to pick a dissertation area within formal epistemology, and I keep coming back to imprecise probabilities. The problem is that I honestly can't tell which parts of the field are live open problems and which are just people talking past each other about formalism. My advisor thinks the whole IP program is a solution in search of a problem ("just pick a credence"), which makes me worry about sunk costs, but the stuff on dilation and decision rules does look genuinely unsettled to me.

  So: what do you think the main open questions actually are right now, and which two or three would you prioritize for someone with about three years and my kind of background? I care way less about the list than about the reasoning behind the ordering. For each question, I'd want to know: does settling it matter for things downstream or is it self-contained, is it tractable with mostly philosophical tools or does it demand serious math, and what would count as progress (a theorem? a worked case? a decision-rule comparison?).

  For orientation, some things I've heard floated as candidate problems, though I'm not sure how seriously to take any of them: whether dilation is a genuine phenomenon or an artifact of how we set up the credal set; the proliferation of decision rules over sets of probabilities (maximin, E-admissibility, maximality, interval dominance) and whether there's any principled way to choose between them; whether "i just don't have a credence here" should be modeled as a set of probabilities at all, versus higher-order credences or something that isn't probabilistic full stop; and the older worry that a credal set just collapses back into one weird precise probability once you ask how the agent bets across multiple decisions. Is the collapse worry (if its even right) a knockdown argument, a reason to change what we mean by the set, or something else? Where would you actually spend three years, and what would you tell me to avoid even if it looks tempting?
