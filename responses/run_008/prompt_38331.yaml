answer: |-
  **Project Title:** The Intergenerational Demos: Dead-Hand Control and the Boundary Problem in AI Alignment

  **1. Research Question**
  Current AI alignment research operates on a tacit assumption regarding the *demos*—the boundary of whose preferences count toward value aggregation. The standard formulation presumes a synchronous population ("humanity" or "all affected stakeholders"). However, because large language models and value-learning systems are trained on historical corpora, they inevitably ingest the expressed preferences of individuals who are no longer alive. Since the dead cannot update their preferences, their static values exert a disproportionate gravitational pull on system behavior relative to the living, whose values are dynamic and underrepresented in accumulated text.

  This project asks: **Should the values of the dead count when an AI aggregates human values, and with what weight?**

  Specifically, it interrogates three competing normative stances:
  1.  **Full Weight:** The past possesses equal moral standing in shaping the future (a conservative/traditionalist view).
  2.  **Discounted Weight:** The past counts but decays over time (a gradualist view).
  3.  **Zero Weight:** The earth belongs to the living; dead-hand control is illegitimate (a Jeffersonian view).

  The dissertation will argue that the current overrepresentation of the dead in training data is not merely a technical bias to be debiased, but a tacit political answer to the boundary question that requires explicit normative justification.

  **2. The Gap in Standard Resources**
  Existing frameworks for value aggregation implicitly take a stance on the boundary problem but fail to defend it against the challenge of intergenerational asymmetry.

  *   **Liberal Neutrality:** Standard liberal accounts argue systems should remain neutral among competing conceptions of the good. However, neutrality presupposes a defined constituency among whom to be neutral. By including historical data without adjustment, current systems are not neutral between *living* conceptions of the good; they are biased toward *past* conceptions. Liberal neutrality offers no mechanism for deciding whether the dead are part of the constituency entitled to neutral consideration.
  *   **Majoritarian Aggregation:** Utilitarian or preference-aggregation models typically assume a concurrent electorate. In AI training, the "vote" is cast via data tokens. Because the accumulated text of the past dwarfs the generated text of the present, the "majority" is historically skewed. Majoritarian theory lacks a temporal discounting function to explain why a preference expressed in 1920 should weigh equally with one expressed in 2020.
  *   **Ideal-Advisor Accounts:** Some alignment proposals suggest AI should serve what we *would* want if we were fully informed and rational. While this allows for moral progress, it relies on extrapolating from actual human data. If the base data is dominated by agents who cannot update their information (the dead), the "idealization" process is anchored to obsolete epistemic and normative conditions. These accounts assume the advisors are capable of reflection, whereas the dead, as represented in data, are fixed.

  None of these resources addresses the *constitutive* question: Is the alignment target a cross-generational aggregate or a contemporary consensus?

  **3. Methodology**
  The project employs a method of **normative conceptual analysis tested against worked cases**. It will not attempt to solve the technical problem of machine unlearning or data weighting, but rather to establish the normative criteria by which such technical solutions should be judged.

  **Phase 1: Conceptual Framework (Months 1–4)**
  I will construct a typology of intergenerational authority. This involves defining "dead-hand control" in the context of statistical learning. I will distinguish between *cultural inheritance* (beneficial transmission of knowledge) and *normative lock-in* (harmful prevention of value drift). The output will be a set of criteria for distinguishing between legitimate tradition and illegitimate stagnation in AI behavior.

  **Phase 2: Worked Cases (Months 5–8)**
  The framework will be stress-tested against three specific domains of rapid intergenerational value change. In each case, I will analyze how a model trained on historical data would likely behave versus a model restricted to contemporary data, and evaluate the normative implications.
  1.  **Carceral Ethics:** Shifts from retributive to restorative justice models. Does an AI aligned on historical legal texts reinforce outdated punitive norms?
  2.  **Privacy and Autonomy:** Shifts from community-centric to individual-centric privacy norms. Does an AI trained on pre-digital era literature violate contemporary expectations of informational self-determination?
  3.  **Environmental Stewardship:** Shifts from anthropocentric resource extraction to ecocentric preservation. Does the "dead weight" of industrial-era values brake necessary normative shifts regarding nature?

  **Phase 3: Synthesis and Policy Implications (Months 9–12)**
  I will synthesize the findings into a proposal for "Temporal Alignment." This will outline how AI developers might explicitly weight training data based on the normative framework established in Phase 1. The conclusion will argue for treating the *demos* of AI as a design parameter rather than an accidental byproduct of data availability.

  **4. Conditions for Project Failure**
  Given the speculative nature of the claim, the project must define clear failure conditions to ensure rigor. The project will be considered to have failed if:
  1.  **Technical Incoherence:** It turns out that "values of the dead" cannot be meaningfully distinguished from "values of the living" within embedding spaces. If the representation of values is sufficiently entangled that temporal provenance cannot be normatively isolated, the boundary question dissolves.
  2.  **Normative Collapse:** If analysis reveals that the "Jeffersonian" (zero weight) position is self-defeating—for example, if the living rely on the dead's values to define their own identity such that discounting the dead harms the living—then the core tension collapses.
  3.  **Triviality:** If the "bias" toward the dead is shown to be negligible compared to other biases (e.g., corporate, geographic), the specific focus on intergenerational justice may be deemed too narrow to warrant a distinct theoretical framework.

  **5. Scope and Feasibility**
  This scope is designed for a one-year fellowship. It deliberately avoids engaging with the full technical stack of AI safety (e.g., RLHF mechanics, specific architecture changes) and avoids the broader metaphysics of personhood. It restricts itself to the *political philosophy of data*. By focusing on three concrete case studies rather than a comprehensive survey of all moral domains, the project remains tractable. The goal is not to produce a final alignment algorithm, but to produce the normative justification required to demand one. This ensures the output is a complete philosophical argument suitable for dissertation chapters or a monograph, regardless of the pace of technical AI development.
