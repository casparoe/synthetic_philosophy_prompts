  I'm writing a dissertation prospectus on whose values aligned AI systems should serve. My half-formed idea: the field treats the aggregation base as obvious — "humanity," or perhaps "all affected stakeholders" — but democratic theory has long known that fixing the demos is the hardest part, and I suspect current AI systems answer this boundary question by accident. Because training corpora overrepresent people who are no longer alive, the dead receive a large implicit weight; and since their values can no longer change, they function as a form of dead-hand control: when the values of living generations shift, the system acts as a brake on that shift. No one has yet argued that this is an answer to the boundary question rather than a bug. Turn this into a prospectus: state the question precisely (should the values of the dead count when an AI aggregates human values, and with what weight — full weight, discounted, or zero on the Jeffersonian thought that the earth belongs to the living?), explain why the standard resources — liberal neutrality, majoritarian aggregation, ideal-advisor accounts — each implicitly take a stance but none addresses it, sketch the method (conceptual analysis tested against worked cases of intergenerational value change on some contested practice), say what would count as the project failing, and keep the scope realistic for a one-year fellowship. Don't include citations; I'll supply those myself.
