answer: |-
  This is a sophisticated trap. Your friend has constructed a *reductio* that conflates the **Static Paradox** of self-deception (how can one simultaneously believe $p$ and not-$p$?) with the **Voluntarism Paradox** (how can one intend to believe what one does not already believe?). Her argument is seductive because it relies on a univocal notion of "intention" that works perfectly for interpersonal deception but fractures when applied to the first-person case and the acquisition of new knowledge.

  Your instinct is correct: Stage A and Stage B fail independently, and exposing the slide between them is the key to saving intentional self-deception without collapsing into doxastic nihilism. Here is a diagnosis structured for your dissertation chapter and seminar presentation.

  ### 1. Diagnosis of Stage A: The Static Paradox
  **The Claim:** Self-deception is impossible because it requires simultaneous contradictory beliefs ($p$ and not-$p$) within a unified agent.
  **The Seductive Premise:** Premise (2): *One cannot intend to produce in someone a false belief that $p$ without oneself believing that not-$p$.*

  **Why it looks fine:** This premise captures the essential asymmetry of deception. To lie to another, I must know the truth they are being denied. If we model self-deception strictly on interpersonal deception (the "Lying Model"), the self-deceiver must know the truth to hide it from themselves. This preserves the intuition that self-deception is an *active* wrongdoing (hence blameworthy) rather than a passive mistake.

  **Where it breaks:** It assumes that the "knowing" required for the intention must be **conscious, occurrent, and simultaneous** with the "believing" of the falsehood.
  **The Rejection:** Reject the requirement for *conscious simultaneity*. You can intend to bring about a belief state without explicitly representing the intention *as* "making myself believe a falsehood."

  **The Cost:** You must weaken the notion of intention from "full conscious plan" to "sub-intentional agency" or "motivated manipulation."
  **How to pay the cost without homunculi:** Adopt a **temporal or dispositional split** rather than a structural one. The agent possesses the evidence for not-$p$ (dispositionally) and performs actions (avoiding the receipts, focusing on the good times) intended to sustain $p$. The agent does not need to token the thought "I am hiding the truth from myself." They simply token the thought "I don't need to look at that receipt today."
  *   **Preserves:** Intentionality of other-deception (Premise 1 stays true for others).
  *   **Preserves:** Blameworthiness (the spouse is responsible for the avoidance strategies).
  *   **Avoids:** Literal partitioning (it's one agent acting over time, not two agents in one head).

  ### 2. Diagnosis of Stage B: The Voluntarism Paradox
  **The Claim:** Intentional belief acquisition is impossible because you cannot intend to believe $p$ unless you already take a stance on $p$.
  **The Seductive Premise:** Premise (7): *If one cannot intend to produce a belief whose content one doesn't already take some doxastic stance toward, no one can intentionally acquire a belief at all.*

  **Why it looks fine:** It relies on the **Transparency Thesis** (Evans, 1982). To deliberate about whether to believe $p$, I must look outward to the world to see if $p$ is true. I cannot look inward to my will. Therefore, "intending to believe" seems to bypass the constitutive norm of belief (truth). If I intend to believe $p$ regardless of truth, I am not believing; I am fantasizing.

  **Where it breaks:** It conflates **intending to believe that $p$** (specific content) with **intending to find out whether $p$** (inquiry).
  **The Rejection:** Reject the idea that intentional doxastic agency requires aiming at a *specific propositional content* in advance. In ordinary learning (your footnote example), you do not intend to believe $p$. You intend to believe *whatever is true about the footnote*.

  **The Cost:** You must concede **Direct Doxastic Voluntarism** (I cannot simply choose to believe) to save **Indirect Doxastic Voluntarism** (I can choose actions to influence belief).
  **How to pay the cost:** Distinguish between the *object* of the intention.
  *   In **Self-Deception (Stage A)**: The object is a specific content ($p$) motivated by desire. The intention is corrupted.
  *   In **Inquiry (Stage B)**: The object is the *truth-value* of $p$. The intention is pure.
  Premise (7) fails because in inquiry, the doxastic stance required is *suspension of judgment*, not belief in not-$p$. I can intend to resolve suspension.

  ### 3. Pricing the Escape Routes
  Here is how the standard accounts fare against your constraints (Keep other-deception intentional; Keep self-deceiver blameworthy; No homunculi).

  | Account | Stage A (Self-Deception) | Stage B (Voluntarism) | Cost to Your Constraints |
  | :--- | :--- | :--- | :--- |
  | **Deflationary (Mele)** | **Denies Intentionality.** Self-deception is merely biased evidence processing. | **Saves Inquiry.** Learning is intentional; self-deception is a glitch. | **High.** Hard to blame the spouse. If it's just a bias, she is mistaken, not deceptive. Violates your desire to preserve agency/blame. |
  | **Partitioning (Davidson)** | **Saves Intentionality.** One partition knows not-$p$, the other believes $p$. | **Threatened.** If partitions are separate agents, can one intend to teach the other? | **High.** Violates your "no homunculi" constraint. Multiplies agents to save the phenomenon. Makes unity of agency impossible. |
  | **Intentionalist (Sartre/Velleman)** | **Saves Intentionality.** Agent knowingly hides truth from self (Bad Faith). | **Saves Inquiry.** We aim at truth, but can flee from it. | **Medium.** Risks the Static Paradox unless you adopt the "sub-intentional" modification suggested above. |
  | **Your Target (Hybrid)** | **Quasi-Intentional.** Agent intends avoidance strategies, not the belief state directly. | **Truth-Aimed.** Agent intends inquiry, not specific belief content. | **Low.** Preserves blame (strategies are chosen), preserves unity (one agent over time), preserves learning. |

  ### 4. The Crucial Asymmetry: Do They Fail Together?
  Your friend argues they stand or fall on Premise (2). **They do not.** They fail for different reasons, and this asymmetry is the theoretical payload of your chapter.

  **Stage A fails due to an Epistemic/Temporal Ambiguity.**
  The self-deceiver does not need to *believe* not-$p$ occurrently to intend to avoid knowing it. They only need to *suspect* not-$p$ enough to feel anxiety. The intention is not "Make me believe $p$" (which triggers the paradox); the intention is "Don't let me see the evidence for not-$p$." This is an intention to *manage access*, not an intention to *fix content*. This preserves blameworthiness (I chose to look away) without requiring simultaneous contradictory belief.

  **Stage B fails due to a Teleological Ambiguity.**
  The learner does not intend to believe $p$. They intend to satisfy the **norm of belief** (truth).
  *   **Self-Deception:** Aims at a specific content ($p$) *in tension* with the norm of truth. (This is why it is irrational).
  *   **Inquiry:** Aims at the norm of truth *which determines* the content. (This is why it is rational).

  **The Slide:** Your friend's argument slides from "Intending to produce belief $p$" (which requires taking a stance on $p$) to "Intending to engage in belief-forming processes" (which requires only taking a stance on the *value of truth*).
  In Stage A, the agent corrupts the process to get a specific result. In Stage B, the agent engages the process to get *any* result. Premise (7) is true for Stage A (you can't intend to believe $p$ if you think $p$ is false without irrationality) but false for Stage B (you can intend to find the truth about $p$ while agnostic).

  ### 5. Seminar Strategy
  When you present this, frame the friend's argument as a **Category Error regarding the Object of Intention.**

  1.  **Concede Premise (1) for Others:** Interpersonal deception requires knowing the truth. Keep this. It anchors the concept of deception.
  2.  **Modify Premise (2) for Self:** In self-deception, the intention is not *to believe $p$*, but *to avoid confirming not-$p$*. This is an intention regarding **evidence access**, not **doxastic content**. This dissolves the Static Paradox without deflating agency. The spouse intends to *not look* at the receipts, not to *believe* in fidelity against evidence. She is blameworthy for the avoidance, not the belief.
  3.  **Reject Premise (7) for Inquiry:** Intentional learning is not intending a belief-state; it is intending a **resolution of uncertainty**. The content is a variable, not a constant. The intention is "Believe $p$ if $p$, believe not-$p$ if not-$p$." This is a coherent intention that does not require prior belief.

  **The Takeaway:**
  Self-deception is possible not because we can believe contradictions, but because we can intentionally **manage the conditions** under which we form beliefs.
  Doxastic voluntarism is possible not because we can believe at will, but because we can **will the inquiry** that leads to belief.

  Your friend's argument proves too much because it treats all doxastic intentions as if they were attempts to **fix a conclusion** rather than **satisfy a norm**. By distinguishing aiming at a *proposition* (Stage A's corruption) from aiming at a *truth-value* (Stage B's standard), you save the spouse's agency, save the student's learning, and keep your mind unified.
