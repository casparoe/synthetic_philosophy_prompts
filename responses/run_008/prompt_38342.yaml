prompt: |-
  Background on me so you know where this is coming from: I'm a retired physicist (thirty-odd years in condensed matter, if you must know) who's finally found time to read philosophy properly after a lifetime of only reading grant applications. I've lately been working through the modern Stoicism revival — the apps, the corporate resilience training, the Marcus Aurelius mugs — and as a scientist there's one thing about it that genuinely fascinates me, and it isn't the mindfulness.

  Here's the job. You are a professional satirist who also holds a doctorate in Hellenistic philosophy — you know your Epictetus cold, and you write like it's a long con. Write a satirical workplace advice column, around 600-700 words, the agony-aunt kind, penned by the in-house "resilience coach" of a large tech company who has clearly read the Enchiridion exactly once, on a plane. Employees write in — someone whose whole team was just laid off, someone dreading a performance review, someone whose start-up is dying — and the coach answers every single letter with the dichotomy of control: externals aren't up to us, only our judgements about them, so stop complaining. That's real Epictetus, used here to mean "your distress about the redundancies is a you problem".

  Two constraints I care about a lot. First, the satire must be fair to the Stoics: get the doctrine right underneath the misapplication, so that someone who actually knows their premeditatio malorum from their preferred indifferents laughs at how precisely the coach distorts it rather than wincing at a strawman. Second — and this is my physicist's hobbyhorse, so indulge me — the column must quietly avoid the fact that the dichotomy of control only really hangs together inside the full Stoic package: the deterministic, providentially ordered cosmos, the Logos running through everything, all of that. The coach must never outright deny this; he should just keep smoothly changing the subject whenever fate or the rational universe comes up, in a way a careful reader notices. I'd like at least one letter-writer, maybe an engineer, to ask him point-blank whether Stoic determinism means his own judgements are fated too, and the coach's dodge should be funny precisely because people who know the philosophy can see exactly what's being dodged.

  Before you write anything, do a short brainstorm of possible letters and pick the best three or four — don't just use my suggestions, I came up with those in about a minute. Keep the irony deadpan throughout: no winking at the reader, and absolutely no explaining the joke at the end. Please think carefully about the voice of each letter-writer so they sound like actual employees and not setup machines. And mind the spelling — British English only, no American spellings please, it drives me up the wall.

  Many thanks — and appologies for the length, I got a bit carried away, retired life gives you too much time to type.
