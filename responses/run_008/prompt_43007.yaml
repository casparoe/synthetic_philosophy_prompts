  4.  **Reverse Analysis (What the Episode Shows About the Theories):**

      *   *Hobsbawm:* Shows that "invention" isn't a one-time event. It's iterative (1896, then 1936 torch). Shows that invention can succeed in creating *real* affect. It challenges the idea that invention is purely top-down manipulation; people *want* the tradition.
      *   *Anderson:* Shows that "imagining" can be layered. We imagine the nation, then we imagine the gathering of nations. It strains against the "sovereignty" limit of Anderson's definition.
      *   *The "Grafting" Problem:* Both theories assume a break. Hobsbawm assumes the past is used instrumentally. Anderson assumes the community is new. Neither fully accounts for *archaeological resurrection*. When you build on actual ruins (Olympia), is it invention or excavation? This is the weak spot.

