      *   **Theoretical Lenses:** Eric Hobsbawm ("Invented Tradition") and Benedict Anderson ("Imagined Communities").
      *   **Specific Tasks:**
          1.  Map Hobsbawm's functions (binding, legitimacy, values) to the Olympics (noting the transnational vs. national tension).
          2.  Map Anderson's framework to a transnational community (does it fit, strain, or need extension?).
