          5.  Address Anderson's "imagined" nature: Does it deflate the fraud charge?
          6.  Address temporal reality: Can a consciously invented tradition become "genuinely real" over time?
          7.  Address the "grafting" problem: The existence of a *real* ancient predecessor. Where do the theories go silent/weak here?
      *   **Constraint:** Do not summarize the theories (user has read them). Focus on careful mapping and critical application. Acknowledge limitations where theories don't fit.

  2.  **Analyze Hobsbawm ("Invented Tradition"):**

      *   *Core Concept:* Traditions are often recent constructs presented as ancient to establish continuity with the past.
      *   *Functions:*
          1.  Establishing social cohesion/group membership.
          2.  Establishing/legitimizing institutions.
          3.  Socialization/inculcation of beliefs/values.
      *   *Application to Olympics:*
          *   *Binding:* It binds a transnational community (athletes, viewers). *Tension:* Hobsbawm focuses on *nation-states*. The Olympics compete with nationalism (national anthems are played, but the ideal is international peace). It creates a "community of nations."
          *   *Legitimacy:* Coubertin needed legitimacy. Linking to Ancient Greece provided authority. The IOC became the legitimizing institution.
          *   *Values:* Amateurism (Victorian class values), fair play, peace.
      *   *The "Fraud" Question:* Hobsbawm's project was historical demystification, not necessarily moral dismissal. "Invented" doesn't mean "fake" in terms of social impact. It means "constructed."
      *   *The "Real" Predecessor:* Hobsbawm deals with *discontinuity* masked as *continuity*. The Olympics have a *real* discontinuity (1500 years). But the *name* and *location* provide a hook. Hobsbawm might struggle if the claim isn't "this is continuous" but "this is a *revival*." Coubertin admitted it was a revival, but the *rituals* (torch, marathon) were sold as ancient.

  3.  **Analyze Anderson ("Imagined Communities"):**

      *   *Core Concept:* Nations are imagined because members will never know most fellow members, yet feel a communion.
