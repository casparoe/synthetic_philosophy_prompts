      *   **Diagnosis 2: The Ontology of the Choice Set (Substantive):**
          *   Address the user's "individuation" hypothesis.
          *   Optimizers: The set exists (even if unknown, it's probabilistically definable).
          *   Satisficers: The set is constructed *during* search. It's not a selection from a menu; it's a generation of possibilities.
          *   *Diagnosis:* This is substantive. It's about whether the world is "small" (given) or "large" (constructed).

      *   **Diagnosis 3: Procedural vs. Substantive Rationality (Normative):**
          *   Optimizers: Rationality = Coherence of preferences/outcomes.
          *   Satisficers: Rationality = Appropriateness of the heuristic/procedure given cognitive limits.
          *   *Diagnosis:* This is the deepest substantive rift. They are defining the word "rational" differently.

      *   **Addressing the Psychological Literature:**
