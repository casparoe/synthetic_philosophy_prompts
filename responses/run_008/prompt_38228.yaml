answer: |-
  Here is a breakdown of the Planck quip ("Science advances one funeral at a time") dissected into distinct claims, evaluated against both the history of science and the history of moral revolutions (specifically Appiah's cases of dueling and slavery).

  ### The Menu of Claims

  #### 1. The Psychological Intransigence Claim
  *   **The Claim:** Individual human beings are cognitively incapable of altering their fundamental worldview or paradigm once established. Belief change is psychologically impossible for adults; therefore, the old guard must die for the new idea to survive.
  *   **Verdict:** **Flat-out False.**
  *   **The History Test:** This fails in both science and morals. In science, Planck himself noted exceptions, and history is full of senior scientists who embraced relativity or germ theory late in life. In morals, it fails spectacularly. In the case of dueling, many active duelists stopped dueling while retaining their status; they didn't need to die, they needed to be shamed. Regarding slavery, prominent abolitionists (like John Newton, author of *Amazing Grace*) were former slave traders who underwent profound moral conversions while alive.
  *   **Confidence:** **95%**. The historical record contains too many verified instances of late-life conversion (both intellectual and moral) for this to hold as a universal law.

  #### 2. The Demographic Replacement Claim
  *   **The Claim:** Change is primarily driven by cohort replacement. The old generation holds the old view until death; the new generation is socialized into the new view. Progress is a function of turnover rates, not persuasion.
  *   **Verdict:** **Defensible (for Science), False (for Appiah's Morals).**
  *   **The History Test:** This is the strongest reading of Planck within the philosophy of science (akin to Kuhnian paradigm shifts). Young physicists have less invested in the old math. However, Appiah's specific cases contradict this. The abolition of the British slave trade (1807) and the decline of dueling in the 19th century happened faster than demographic turnover would allow. The *same* people who dueled in 1820 were often the ones policing against it by 1840. The norm shifted under their feet; they didn't wait for a new cohort to replace them.
  *   **Confidence:** **90%**. While demographic change drives some long-term moral shifts (e.g., LGBTQ+ rights), Appiah's core examples of "honor" shifts rely on rapid re-coordination among existing peers, not waiting for them to die off.

  #### 3. The Institutional Power Claim
  *   **The Claim:** It is not about belief, but about resources. Incumbents control the journals, the grants, the legislature, or the social clubs. They block new ideas/practices to protect their status. Change only occurs when their institutional grip loosens via death or retirement.
  *   **Verdict:** **Defensible (but context-dependent).**
  *   **The History Test:** In science, this is robust (tenure, grant committees). In moral revolutions, it is mixed. In the American South, the "incumbent" slaveholding class did resist until forced by war (a form of violent removal of power). However, in British abolition and the end of dueling, the "incumbents" (the aristocracy) were often the *leaders* of the change. They didn't lose power; they redefined what power looked like. If the Planck quip implies power must be vacated to change norms, Appiah's cases show power can *drive* the change.
  *   **Confidence:** **85%**. (See "Least Certain" below). This is the messiest category because "power" is hard to disentangle from "honor."

  #### 4. The Incentive and Audience Claim
  *   **The Claim:** People are pragmatic. They stick to old norms because the social cost of switching is too high (loss of reputation, career, honor). When the "funeral" happens, it isn't the person dying, but the death of the *audience* that mattered. Once the social incentives flip, compliance follows regardless of private belief.
  *   **Verdict:** **Defensible (and the best fit for Appiah).**
  *   **The History Test:** This aligns closely with Appiah. Dueling didn't end because everyone suddenly became pacifists; it ended because the audience (other gentlemen) stopped respecting the duelist and started respecting the man who refused. The "funeral" was the death of the *social reward*, not the person. Similarly, slavery became economically and diplomatically costly. This reading saves the Planck quip by metaphorically interpreting "funeral" as the death of the old incentive structure.
  *   **Confidence:** **90%**. This is the most sociological reading and fits the mechanism of norm cascades well.

  ***

  ### Editor's Note: The "Least Sure" Verdict

  If you need to hedge one point in print, hedge **Claim 3 (The Institutional Power Claim)**.

  **Why:** It is difficult to empirically separate "institutional blockage" from "shifts in honor." In the case of American slavery, institutional power clearly blocked change until the "incumbents" were removed (via Civil War). But in British abolition, the incumbents voted themselves out of the trade. Distinguishing whether they did so because they lost power or because their definition of honor changed is a matter of historical interpretation, not settled fact.

  While I am confident that Planck's literal claim (people must die) is false for moral revolutions, the degree to which *structural power* vs. *social honor* drives that change is still debated among historians. Appiah emphasizes honor; Marxists emphasize power. The Planck quip sits ambiguously between them.

  ### Summary for the Column
  The Planck quip is a description of **epistemic inertia** (how we know things), while Appiah is describing **normative coordination** (how we live together).
  *   In science, data often waits for the old guard to die.
  *   In morals, honor waits for no one; it can flip in a decade among the very same people.

  Using Planck to refute Appiah is a category error. One describes the decay of a paradigm; the other describes the cascade of a reputation.
