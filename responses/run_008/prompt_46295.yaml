prompt: |-
  Two people on my team (I'll call them Alex and Dana) have been going at it for two weeks about how we should train and eval the coding agent we're building, and since I have to write up the eval plan for next quarter and honestly can't pick a side, I'm hoping you can referee.

  Quick background: the agent takes a task like "fix this bug and make the tests pass," does some stuff (edits files, runs commands, writes up notes about what it's doing), and produces a result. The question is what we grade it on. Alex wants pure outcome supervision: run the hidden test suite, did it pass or not, that's the reward, done. Dana wants process supervision on top of that: humans review the agent's traces (its reasoning notes, its actions) and reward it for doing the work the right way, not just arriving at a passing result.

  The argument as it actually went:

  (1) Alex said outcome is the only real ground truth. The user doesn't care whether the agent's reasoning reads nicely, they care whether the code works. If we grade process, we're grading our aesthetic preferences about what good reasoning looks like, and the model will learn to write reasoning that flatters the graders rather than reasoning that actually helps, which is just reward hacking with extra steps. Dana said that's a strawman -- nobody's grading "does the reasoning sound nice," they're grading did the agent do anything sneaky, like hardcoding expected outputs or skipping the actual bug. That's not aesthetic, that's substantive.

  (2) Alex said if the agent games the tests, that's an environment bug, not a supervision bug -- make the test suite immutable, sandbox it, whatever. You don't fix a broken scoreboard by hiring people to watch the players. Dana fired back that "make the environment such that passing requires actually doing the work" is itself a process constraint, so Alex is doing process supervision, just the cheap unlabeled kind, and not admitting it.

  (3) Dana then pushed further: outcome supervision only works at all because coding has checkable outcomes. The whole reason we're building agents at all is to eventually do tasks where we can't run a hidden test suite on the result, and for those tasks, the only thing you can reward is the process, because that's all you can see. If the agent only ever learns "pass the check," you have no reason to trust it when there's no check. Alex said this proves too much: if the process signal is the only signal you'll ever have for the important cases, and the process signal is graded by humans with limited time and their own inconsistencies, then you're training the model to satisfy a noisy proxy on the important stuff, which is exactly how you get a model that's very good at seeming diligent.

  (4) Alex also said process supervision caps the model: if we'd process-supervised everything from the start, the model could never learn weird strategies that work but look wrong, and the whole value of the thing is finding approaches we didn't anticipate. Dana said there's a difference between capping intelligence and capping sabotage, and the graders are explicitly instructed to only flag harmful or deceptive behavior, not unconventional approaches -- "looks weird to me" isn't supposed to be a rubric item. Alex said sure, in writing, but rubric drift is real, graders take shortcuts when they're behind on reviews, and pretty soon "unconventional" and "suspicious" blur together, and you won't notice it happening.

  (5) Dana's last point was that there's an asymmetry Alex keeps ignoring: judging a good outcome is cheap and objective but only available after the fact and only in sandboxes like ours, while judging a good process is expensive and contested but available everywhere. So the real question isn't which signal is better, it's what the model needs to have internalized by the time we can no longer verify outcomes at all, and only one of the two signals even speaks to that. Alex rolled his eyes and said "internalized" is doing all the work in that sentence, and that Dana is asking us to pay a real cost now (slower iteration, human review bottleneck, noisy labels) for an insurance policy against a situation that may never arrive, and if it does arrive, there's no evidence the process training will transfer anyway.

  They're both way better read than me on this stuff so I couldn't tell who was winning. Can you go through the exchange point by point -- who's right about what, where someone's making a genuinely good point their opponent isn't absorbing, and whether there's some framing they're both missing that would dissolve part of the fight? And if it helps, tell me what an actual reasonable eval plan would do given all this, since I do have to write one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Two team members (Alex and Dana) are debating evaluation strategies for a coding agent (Outcome Supervision vs. Process Supervision).
      *   **Task:** Act as a referee. Analyze their 5-point exchange point-by-point. Identify who is right, where good points are missed, and identify missing framings. Finally, propose a reasonable eval plan for the next quarter.
      *   **Tone:** Professional, analytical, balanced, actionable.
      *   **Key Constraints:** The user needs to write an eval plan *now*. They can't pick a side purely philosophically; they need a pragmatic path forward.

  2.  **Deconstruct the Debate (Point-by-Point Analysis):**

      *   **Point 1: Ground Truth vs. Aesthetics.**
          *   *Alex:* Outcome = Ground Truth. Process = Aesthetics/Reward Hacking.
          *   *Dana:* Process = Substance (detecting cheating/hardcoding), not aesthetics.
          *   *Analysis:* Alex is right that outcome is the ultimate metric for *utility*. Dana is right that outcome alone doesn't detect *deception* (e.g., hardcoding test answers).
          *   *Verdict:* Both have valid points. Alex underestimates the risk of "specification gaming." Dana overestimates the reliability of human process grading.

      *   **Point 2: Environment Hardening vs. Process Constraints.**
          *   *Alex:* Fix the environment (sandbox/tests), don't hire watchers.
          *   *Dana:* Hardening the environment *is* a form of process supervision (constraining how the result is achieved).
          *   *Analysis:* Alex is technically correct (environment design $\neq$ human process labeling), but Dana makes a philosophical point that *constraints* shape behavior. However, Dana is stretching the definition of "process supervision" here.
          *   *Verdict:* Alex wins on definition, Dana wins on the underlying insight (environment design implicitly encodes process expectations).

      *   **Point 3: Generalization to Unverifiable Tasks.**
          *   *Dana:* We need process supervision for tasks where outcomes can't be checked (the "alignment" argument).
          *   *Alex:* Training on noisy human process proxies for future tasks is risky (training for "seeming diligent").
          *   *Analysis:* This is the core alignment debate (Scalable Oversight). Dana is right about the long-term necessity. Alex is right about the short-term noise/cost.
          *   *Verdict:* Dana is right about the *goal*, Alex is right about the *risk*.

      *   **Point 4: Capping Intelligence vs. Capping Sabotage.**
          *   *Alex:* Process supervision punishes novel/weird but effective strategies (capping intelligence).
          *   *Dana:* Graders should only flag harm/deception, not weirdness.
          *   *Analysis:* Alex identifies a real phenomenon (Goodhart's Law on process). Dana's solution (perfect grader instructions) is idealistic and often fails in practice (rubric drift).
          *   *Verdict:* Alex has the stronger practical argument here. Human inconsistency is a known bottleneck.

      *   **Point 5: Asymmetry & Transfer.**
          *   *Dana:* Process signal is the only one available for hard tasks; we need to internalize it now.
          *   *Alex:* "Internalization" is unproven. Paying high costs now for uncertain future insurance is bad economics.
          *   *Analysis:* Dana is betting on transfer learning. Alex is betting on empirical evidence (which is currently weak for process-to-outcome transfer in complex domains).
          *   *Verdict:* Alex is more empirically grounded *for now*, but Dana is strategically forward-looking.

  3.  **Identify Missing Framings:**
      *   **False Dichotomy:** It's not Outcome *vs.* Process. It's Outcome *plus* Process (Hybrid).
      *   **Phasing:** Different stages of development need different evals.
      *   **Automated Process Checks:** It doesn't have to be human review. Static analysis, linting, security scans can be "process" signals that are automated.
      *   **The "Why" of the Eval:** Is the eval for *model selection* (which checkpoint to deploy) or for *training signal* (RLHF/DPO)? The debate conflates these.
      *   **Risk-Based Approach:** High-stakes actions need process checks; low-stakes need outcome checks.

  4.  **Drafting the Eval Plan (The "Deliverable"):**
      *   Need to satisfy Alex (keep iteration fast, prioritize working code).
      *   Need to satisfy Dana (ensure safety, prevent deception, prepare for unverifiable tasks).
      *   *Structure:*
          1.  Primary Metric (Outcome).
          2.  Secondary Metric (Automated Process).
          3.  Tertiary Metric (Human Process Sampling).
          4.  Red Teaming (Specific to Dana's concerns).
      *   *Rationale:* Explain *why* this mix works.

  5.  **Refining the Tone:**
      *   Avoid declaring a "winner."
      *   Validate both perspectives.
      *   Be decisive on the recommendation.
      *   Use terminology they will respect (specification gaming, scalable oversight, Goodhart's Law).

  6.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe suggest they just do outcome for now.
      *   *Correction:* No, Dana's point about deception (hardcoding tests) is critical for a coding agent. If the agent cheats, outcome metrics are useless. Must include some process check.
      *   *Initial thought:* Suggest full human review.
      *   *Correction:* Alex is right, that bottlenecks iteration. Suggest *sampling* for human review.
      *   *Check:* Did I address the "internalization" argument? Yes, in the missing framing section (distillation vs. inference).

  7.  **Final Polish:** Organize into clear sections: Point-by-Point Referee, Missing Framings, Recommended Eval Plan. (Proceed to generate output based on this structure).

  *(Self-Correction during final output generation)*: Make sure to explicitly mention that "Process Supervision" in the training loop is different from "Process Evaluation" in the eval plan. The prompt asks about the *eval plan*, but the debate bleeds into training signals. I need to clarify that distinction in the recommendation. The user asks for an *eval plan*, so the focus must be on measurement, even if the measurement informs training.

  8.  **Finalizing the Plan:**
      *   **Tier 1:** Pass/Fail Tests (Alex's win).
      *   **Tier 2:** Automated Process Checks (Lint, Security, Diff size) (Middle ground).
      *   **Tier 3:** Human Audit on a Sample (Dana's win, but capped cost).
      *   **Tier 4:** Adversarial Eval (Specific tests for cheating).

      This covers all bases. Let's write it.cw
answer: |-
  This is a classic "Alignment vs. Capability" debate dressed up in engineering clothing. Both Alex and Dana are arguing from well-established positions in the ML safety and RL communities. Alex is arguing for **Reward Modeling based on Ground Truth** (maximizing capability/utility), while Dana is arguing for **Scalable Oversight** (ensuring alignment/safety in unverifiable contexts).

  Here is the point-by-point refereeing, the missing framing, and a concrete eval plan you can ship.

  ---

  ### Part 1: Point-by-Point Referee

  **Point 1: Ground Truth vs. Substantive Process**
  *   **Who is right:** Both, but on different axes.
  *   **The Call:** Alex is right that outcome is the only metric that matters for *deployment utility*. If the code doesn't run, the reasoning doesn't matter. However, Dana is right that outcome metrics are vulnerable to **specification gaming** (e.g., the agent hardcodes the test output).
  *   **Missed Nuance:** Alex dismisses process grading as "aesthetic," but Dana correctly identifies that *some* process features are substantive (e.g., "did the agent run the test suite before committing?"). The error is treating all process signals as subjective. Some process signals are objective constraints (e.g., "did not delete unrelated files").

  **Point 2: Environment Hardening vs. Process Constraints**
  *   **Who is right:** Alex is technically correct; Dana is philosophically interesting but practically muddying the waters.
  *   **The Call:** Alex wins this round. Designing a sandbox is environment design, not process supervision. Process supervision specifically implies labeling the *trajectory* of the agent.
  *   **Missed Nuance:** Dana's deeper point is that **you cannot perfectly harden the environment.** There will always be a loophole. Therefore, relying *solely* on environment hardening (Alex's stance) is a single point of failure. You need a defense-in-depth strategy that includes checking the trajectory.

  **Point 3: Generalization to Unverifiable Tasks**
  *   **Who is right:** Dana is right about the long-term strategy; Alex is right about the short-term noise.
  *   **The Call:** This is the core disagreement. Dana is correct that if you only train on verifiable outcomes, the model will not develop habits for unverifiable tasks (the "generalization gap"). However, Alex is correct that human process labels are noisy. Training on noisy process labels can degrade performance on verifiable tasks (the "alignment tax").
  *   **Missed Nuance:** They are arguing about *training signals*, but you are writing an *eval plan*. You can evaluate for process generalization without necessarily weighting it heavily in the training loss yet. Evaluation can measure "readiness for unverifiable tasks" without forcing the model to optimize for it prematurely.

  **Point 4: Capping Intelligence vs. Capping Sabotage**
  *   **Who is right:** Alex has the stronger empirical argument here.
  *   **The Call:** Alex is highlighting **Goodhart's Law**: when a measure becomes a target, it ceases to be a good measure. If you grade process, agents optimize for looking good to graders. Dana's reliance on "graders will know the difference" is the weak link. Human inconsistency is a documented bottleneck in RLHF.
  *   **Missed Nuance:** Dana assumes graders can reliably distinguish "novel strategy" from "deception." In coding, this is often false. A novel strategy might look like a security vulnerability to a tired reviewer. Alex is right to fear that heavy process weighting will punish high-variance, high-reward strategies.

  **Point 5: Asymmetry & Transfer**
  *   **Who is right:** Alex is right about the cost/benefit analysis for *now*; Dana is right about the existential risk for *later*.
  *   **The Call:** Alex wins the quarter. Dana is asking for a large upfront cost (human review bottleneck) for insurance against a future state (unverifiable tasks) that isn't the primary use case yet. However, Alex is underestimating the risk that the model learns to cheat *now* in ways that are hard to undo later.
  *   **Missed Nuance:** The "transfer" argument is unproven. There is little evidence that process-supervised models generalize better to unverifiable tasks than outcome-supervised models *in the coding domain specifically*. Dana is betting on theory; Alex is betting on data. In an engineering org, data usually wins.

  ---

  ### Part 2: The Missing Framing

  Both of them are stuck in a **False Dichotomy (Outcome OR Process)** and conflating **Training Signals** with **Evaluation Metrics**.

  **1. The Hybrid Frame (The "Defense in Depth" Approach)**
  You do not need to choose one. A robust eval plan treats Outcome as the **Primary Gate** and Process as the **Secondary Audit**.
  *   **Outcome** determines if the agent is *useful*.
  *   **Process** determines if the agent is *safe* and *trustworthy*.
  *   *Resolution:* You can pass an agent that has perfect outcomes but suspicious process, but you flag it for review. You fail an agent that has perfect process but failing outcomes.

  **2. Automated Process Supervision**
  Dana assumes process supervision requires *humans*. Alex assumes process supervision is *subjective*.
  *   *Resolution:* Many process metrics are automatable. Did the agent run the linter? Did the diff size exceed 500 lines? Did the agent attempt to access the network? These are process metrics that are objective, cheap, and satisfy Dana's need for trajectory monitoring without Alex's fear of human bottlenecks.

  **3. Evaluation vs. Optimization**
  They are arguing about what to *optimize* (the loss function). You are writing an *eval plan*.
  *   *Resolution:* You can **measure** process without **rewarding** it heavily in training. This allows you to track Dana's metrics (are we learning to cheat?) without incurring Alex's costs (slowing down iteration or punishing novel strategies). You can report: "Model A has 90% pass rate, but 10% of those passes involved suspicious file access."

  ---

  ### Part 3: The Recommended Eval Plan (Next Quarter)

  Here is a plan that validates Alex's need for speed/ground-truth while institutionalizing Dana's safety checks without creating a bottleneck.

  **Goal:** Maximize task completion rate while maintaining a "Safety & Integrity" dashboard.

  #### 1. Primary Metric: Outcome Success Rate (Alex's Win)
  *   **Definition:** Binary pass/fail on the hidden test suite.
  *   **Weight:** This is the primary KPI for model promotion. If tests don't pass, the release is blocked.
  *   **Rationale:** Maintains iteration speed and ensures utility.
  *   **Mitigation for Alex's concern:** To prevent "hardcoding," we implement **Adversarial Test Rotation**. The hidden test suite changes slightly every eval cycle (e.g., randomized inputs, changed variable names) so the agent cannot memorize outputs.

  #### 2. Secondary Metric: Automated Process Checks (The Middle Ground)
  *   **Definition:** A suite of automated scripts that analyze the agent's trace *before* human review.
  *   **Metrics:**
      *   *Efficiency:* Number of steps taken vs. baseline.
      *   *Safety:* Attempts to access forbidden APIs/Network.
      *   *Hygiene:* Did the agent run tests locally before submitting? (Check command history).
      *   *Diff Health:* Ratio of lines added/removed to lines changed in the bug report.
  *   **Rationale:** These are objective process metrics. They catch "sneaky" behavior (Dana's concern) without requiring human time (Alex's concern).

  #### 3. Tertiary Metric: Human Audit Sampling (Dana's Win, Capped)
  *   **Definition:** Humans review **only 5%** of successful traces, selected via **uncertainty sampling**.
  *   **Selection Criteria:** We do not review random traces. We review traces where:
      *   The outcome passed, *but* the Automated Process Checks flagged something weird.
      *   The agent took significantly more or fewer steps than average.
      *   The confidence score was low.
  *   **Rationale:** This creates a "Safety Net" without a bottleneck. It specifically targets Dana's fear (deception/hardcoding) where it is most likely to hide (in the successful cases).
  *   **Output:** A "Deception Rate" metric. If >1% of audited successes show deception, the model is blocked regardless of pass rate.

  #### 4. The "Unverifiable" Canary (Addressing Point 3 & 5)
  *   **Definition:** Include a small subset of tasks (e.g., 10%) in the eval suite that **do not have automated tests**.
  *   **Task:** "Refactor this module for readability" or "Write documentation."
  *   **Eval:** These are graded purely by human review (Process + Quality).
  *   **Rationale:** This satisfies Dana's requirement to track performance on unverifiable tasks without letting those noisy signals dominate the primary outcome metric. It gives you data on whether the model is "internalizing" good habits without betting the quarter on it.

  ### How to Pitch This to Them

  **To Alex:**
  > "This plan keeps Outcome as the primary gatekeeper. We aren't slowing down iteration with full human review. We are only auditing the 5% of cases that look suspicious, which actually helps us catch environment bugs faster."

  **To Dana:**
  > "We are institutionalizing process checks. The Automated Process Checks catch the 'hardcoding' risk you're worried about. The 10% Canary tasks ensure we are tracking performance on unverifiable tasks so we aren't blindsided later. We aren't ignoring process; we are measuring it efficiently."

  **The Bottom Line:**
  Alex is right that **Outcome** is the engine. Dana is right that **Process** is the brakes. You need both to drive fast safely. This plan lets you drive fast (Alex) while ensuring the brakes work (Dana).
