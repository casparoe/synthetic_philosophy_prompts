      *   *Immunity to Error Through Misidentification (IEM):* When I say "I am in pain," I can't be right that pain is occurring but wrong that *I* am the one in pain. This suggests the "I" isn't just a demonstrative pick-out; it's constitutive. (Shoemaker, Wittgenstein).
      *   *The Unity of Consciousness:* Multiple thoughts happen at once. They are bound together. What binds them? A subject? (Kant's transcendental unity of apperception).
