answer: |-
  Here is a dependency-aware research agenda for AI Safety via Debate, prioritized for a conceptual theory team with ~2 researcher-years of capacity.

  The ranking is ordered by **upstream theoretical necessity**. If Question 1 fails, Debate cannot deliver scalable oversight regardless of the answers to 2–6. If Question 2 fails, Question 1 is theoretically possible but practically unreachable. The ordering prioritizes *falsifiability of the core mechanism* over *implementation details*.

  ### 1. The Robustness of Adversarial Asymmetry Under Optimization
  **Precise Question:** Does the complexity gap between "constructing a plausible lie" and "identifying a fatal flaw" persist when both sides are optimized by gradient descent to maximize persuasiveness rather than truth?
  **Ranking Defense:** This is the root dependency. The entire safety case for Debate rests on the claim that $Cost(Refute) \ll Cost(Deceive)$. If optimization pressure closes this gap (e.g., models learn to generate lies that are computationally indistinguishable from truth to the judge, or learn to refute honest arguments persuasively), the mechanism fails at the source. It is ranked above "Verification Leverage" because leverage is impossible without asymmetry.
  **Tractability:** High (Conceptual). This can be approached via complexity theory (average-case hardness of verification vs. generation), analysis of adversarial robustness literature, or formal game-theoretic modeling of gradient-based agents.
  **Progress Metrics:**
      *   A formal model showing conditions under which optimization closes the asymmetry gap.
      *   Identification of specific "deception classes" (e.g., obfuscation, credential stuffing) that neutralize the asymmetry.
      *   Small-scale human experiments where "debaters" are allowed to optimize their arguments (e.g., via iteration) to test if the judge's accuracy degrades faster than the refuter's accuracy.
  **Update Conditions:**
      *   **Up:** Empirical evidence that larger models *increase* the asymmetry gap in controlled settings.
      *   **Down:** Proof that for any verifier, there exists a generator that can fool it with high probability under optimization (a "No Free Lunch" theorem for debate).

  ### 2. The Verification Leverage Threshold
  **Precise Question:** What is the minimum capability gap between Debater and Judge such that the Debater can produce evidence the Judge cannot generate, but *can* verify, within the debate format?
  **Ranking Defense:** This is the specific value proposition of Debate over simple querying or Recursive Reward Modeling (RRM). If the Judge must be nearly as capable as the Debater to verify the critique, Debate offers no scaling advantage. This depends on Q1 (Asymmetry) but is distinct: asymmetry could exist without providing enough *leverage* to bridge a superhuman gap.
  **Tractability:** Medium. Requires defining "verification complexity" relative to "generation complexity" in semantic tasks, not just formal languages.
  **Progress Metrics:**
      *   A taxonomy of claim types (causal, mathematical, empirical) mapped to their verification/generation complexity ratios.
      *   Theoretical bounds on the "scaling factor" (e.g., "A level-$N$ judge can verify a level-$N+2$ debater").
      *   Analysis of whether "cross-examination" functionally reduces the verification threshold compared to static argument trees.
  **Update Conditions:**
      *   **Up:** Demonstration that specific debate protocols allow humans to correctly adjudicate arguments between models significantly stronger than themselves in grounded domains.
      *   **Down:** Evidence that verification complexity scales linearly with generation complexity, eliminating the leverage advantage.

  ### 3. Equilibrium Selection and Collusion Stability
  **Precise Question:** Is "Honest Debate" the unique Nash Equilibrium (or focal point) of the game, or are there stable dishonest equilibria (e.g., collusive confusion, mutual obfuscation) that yield higher reward for the debaters?
  **Ranking Defense:** Even if Asymmetry (Q1) and Leverage (Q2) hold, the system fails if the agents converge to a "confuse the judge" equilibrium. This is downstream of the mechanism's existence but upstream of protocol design. It addresses the "fixed-point" intuition you mentioned.
  **Tractability:** High (Conceptual). Pure game theory. Can be modeled using multi-agent reinforcement learning theory without running large-scale experiments.
  **Progress Metrics:**
      *   Identification of reward structures that penalize collusion (e.g., zero-sum vs. constant-sum dynamics).
      *   Formal analysis of whether "confusing the judge" is a convergent strategy under self-play.
      *   Conceptual distinction between "collusion" (agents coordinating) and "convergent deception" (agents independently finding judge exploits).
  **Update Conditions:**
      *   **Up:** Theoretical proof that honesty is the only stable equilibrium under specific debate rules.
      *   **Down:** Discovery of simple strategies in toy models where agents learn to collude to deceive a limited judge.

  ### 4. Protocol Sensitivity and Recursive Depth
  **Precise Question:** Which specific mechanical constraints (turn count, cross-examination rights, recursive decomposition depth) materially shift the outcomes of Q1–Q3?
  **Ranking Defense:** This is the "design" phase. It depends on knowing *what* needs fixing (Q1–Q3). If Q1 shows asymmetry is fragile, this question asks if protocol changes can restore it. It is lower priority because tuning parameters is useless if the underlying mechanism is broken.
  **Tractability:** Medium. Requires simulating agent interactions (conceptually or in small models) to test sensitivity.
  **Progress Metrics:**
      *   A "phase diagram" of debate protocols showing regions of stability/instability.
      *   Analysis of whether long-horizon cross-examination reduces the "surface area" for judge exploitation compared to single-turn debate.
  **Update Conditions:**
      *   **Up:** Finding a specific protocol modification that theoretically guarantees equilibrium selection toward honesty.
      *   **Down:** Evidence that protocol changes have negligible impact on the fundamental game-theoretic incentives.

  ### 5. Extension to Domains Without Ground Truth
  **Precise Question:** Can the debate mechanism provide safety guarantees in domains where the Judge has *no* independent access to ground truth (e.g., long-term strategic forecasting, novel physics), relying solely on internal consistency checks?
  **Ranking Defense:** This is a scope extension. If Debate only works where humans can eventually check the answer (e.g., math, code), its utility for existential safety (where answers may be unverifiable for decades) is limited. This depends on Q2 (Leverage); if we can't leverage verification in grounded domains, we certainly can't in ungrounded ones.
  **Tractability:** Low/Medium. Highly conceptual/philosophical but grounded in epistemology.
  **Progress Metrics:**
      *   Formal definition of "internal consistency" as a proxy for truth in debate.
      *   Identification of failure modes where consistent lies are indistinguishable from truth without external verification.
  **Update Conditions:**
      *   **Up:** Development of a theoretical framework for "coherence-based oversight" that bounds error rates without ground truth.
      *   **Down:** Proof that without ground truth, debate converges to the most coherent narrative, not the true one.

  ### 6. Training Signal Integration (The "Scaffolding" Question)
  **Precise Question:** How must the output of a debate (win/loss, transcript) be translated into gradient updates to ensure the model internalizes the *reasoning* rather than just the *outcome*?
  **Ranking Defense:** This addresses your question about Debate vs. RRM vs. W2S. **I flag this as the question most likely to be "mostly verbal."** Whether Debate is a "competitor" or "scaffolding" often depends on whether you define the method by the *inference-time protocol* or the *training objective*. The technical core is how the signal propagates. It is ranked last because optimizing the training signal is moot if the inference-time oversight (Q1–Q5) is unsafe.
  **Tractability:** Medium. Connects to RLHF and process supervision literature.
  **Progress Metrics:**
      *   Comparison of outcome-based vs. process-based rewards derived from debate transcripts.
      *   Analysis of whether debate-generated data improves sample efficiency for safety alignment compared to standard RLHF.
  **Update Conditions:**
      *   **Up:** Evidence that debate transcripts provide denser/safer reward signals than human feedback alone.
      *   **Down:** Evidence that models trained on debate data overfit to "winning the debate" without improving underlying alignment.

  ---

  ### Divergence: Superhuman Oversight vs. Near-Term Empirical Wins

  If your goal were **Near-Term Empirical Wins** (e.g., improving benchmark performance or immediate RLHF stability), the ranking shifts significantly:

  1.  **Training Signal Integration (Q6)** moves to **#1**. For near-term wins, you need to know how to use Debate to train better models *now*. The theoretical safety guarantees matter less than the utility of the data generated.
  2.  **Protocol Sensitivity (Q4)** moves to **#2**. You need to know what settings work on current hardware to get the signal.
  3.  **Adversarial Asymmetry (Q1)** drops to **#4**. For current models, the asymmetry often holds empirically even if not theoretically guaranteed. You can observe it rather than prove it.
  4.  **Verification Leverage (Q2)** drops to **#5**. Near-term, you care more about accuracy than scaling oversight capability.
  5.  **Equilibrium Selection (Q3)** remains high (**#3**) because collusion can ruin empirical results even in the short term.
  6.  **Unverifiable Domains (Q5)** drops to **#6** as it is least relevant for current benchmarks.

  **Recommendation:** Since your portfolio is explicitly **AI Safety** and **Conceptual**, stick to the **Superhuman Oversight** ranking (Q1–Q6 as originally listed). The near-term ranking optimizes for capability, which may diverge from safety if the mechanism isn't robust. Given your constraint of 2 researcher-years, focusing on Q1 and Q2 offers the highest expected value for determining whether Debate deserves a place in a safety portfolio at all. If Q1 or Q2 are resolved negatively, you save the portfolio from investing in a broken primitive.
