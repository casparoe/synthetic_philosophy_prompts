prompt: |-
  I chair the quarterly portfolio review at a mid-sized software company: every three months, a panel of eight engineering and product managers has to decide which in-flight projects continue, which get more time, and which we kill. The official doctrine, pushed hard by our CFO, is that these decisions must be forward-looking only: money already spent is gone, so the only question for each project is whether the next pound spent there beats the next pound spent anywhere else. Sunk costs are, on this view, simply irrelevant, and any appeal to them — 'we've come too far to stop now', 'we can't waste what we've put in' — is flagged as the sunk cost fallacy and struck from the discussion. But in practice the panel keeps running into cases that make us doubt the doctrine is the whole story. Killing a project one month from delivery because the forward-looking numbers have dipped seems to discard something real; and everyone senses that 'how much has already been spent' sometimes carries genuine information about whether the remaining spend is worth it — though nobody on the panel can say crisply when, or whether that's just the fallacy talking in a nicer accent.

  What I want from you is a decision procedure the panel can actually run in the meeting: roughly twenty minutes per project, no finance analyst in the room, managers with no training in decision theory, and a written rationale for each decision that the CFO's office will audit afterwards. The procedure should be grounded in what decision theory and the empirical literature on escalation of commitment actually support, translated into questions a manager can answer without the theory behind them. The hard part, as I see it, is separating the legitimate from the illegitimate uses of the past: past investment as *evidence* about future payoffs (learning curves, what completion unlocks, what the history reveals about the team's estimates) versus past investment as a supposed *claim* on the future ('we owe it success'). The procedure needs to make that distinction operational, and it also has to handle the things the pure doctrine ignores: option value of being nearly done, the reputational and morale costs of killing things, the fact that the counterfactual 'spend the money elsewhere' is often fictional because the alternative isn't a project but nothing. Please mark the points where the procedure runs out and a human judgement call has to take over, and be honest about where the procedure will misfire — say, the systematic biases it can't detect from inside the room.

  Then run it on three cases so the panel can see it in action: (1) a data-migration project, eleven months in, budget 60% spent, where the forward-looking case for finishing is genuinely close but completion is two weeks away; (2) a customer-facing feature, four months in, whose forward-looking case is clearly negative, but where the team that built it is one we will need for the next project and morale is fragile; and (3) a case where the procedure's honest answer is 'kill it' even though the panel will hate saying so and will be tempted to bend the procedure — pick the details of that one yourself. Finally, state clearly what the procedure cannot do: the questions it cannot answer even in principle, and where a panel using it in good faith could still get the wrong answer. Please write the whole thing in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Context:** Quarterly portfolio review at a mid-sized software company.
      *   **Panel:** 8 engineering/product managers (no decision theory training, no finance analyst).
      *   **Constraint:** ~20 minutes per project. Written rationale required for CFO audit.
      *   **Core Conflict:** CFO's strict "sunk cost fallacy" doctrine (forward-looking only) vs. practical reality (sunk costs often contain signal, killing projects has hidden costs).
      *   **Goal:** A decision procedure that distinguishes legitimate uses of past data (evidence) from illegitimate ones (emotional claim), incorporates option value/morale/reputational factors, and acknowledges its own limits.
      *   **Output:**
          1.  The Decision Procedure (operational steps/questions).
          2.  Application to three specific cases.
          3.  Statement of limitations (what it can't do).
          4.  Tone/Style: British English.

  2.  **Theoretical Grounding (Mental Check):**

      *   *Sunk Cost Fallacy:* Ignoring irrecoverable costs. Correct in principle, but often misapplied by ignoring *information* contained in past spend.
      *   *Escalation of Commitment:* The tendency to throw good money after bad to justify past decisions. The procedure must mitigate this.
      *   *Real Options Theory:* Being "nearly done" has value (completion option). Abandonment has value (stop loss).
      *   *Signaling/Reputation:* Killing projects affects team trust and future recruitment.
      *   *Counterfactual Problem:* "Spend elsewhere" is often theoretical; budget might just vanish if not used.
      *   *Procedural Rationality:* Since perfect rationality is impossible, we need a structured process to reduce bias.

  3.  **Drafting the Procedure (The "Sunk Cost Filter"):**

      *   *Name:* Needs to sound professional but descriptive. "The Forward-Looking Evidence Protocol"? "The Portfolio Continuation Heuristic"? Let's go with **The Continuation Evidence Protocol (CEP)**.
      *   *Structure:* Needs to fit 20 mins.
          *   Phase 1: The Forward Look (The CFO's requirement).
          *   Phase 2: The Past as Signal (The nuance).
          *   Phase 3: The Hidden Costs of Killing (The reality).
          *   Phase 4: The Decision & Rationale.
      *   *Key Distinction:* Past spend as *cost* (ignore) vs. Past spend as *data* (use).
      *   *Questions:* Must be answerable by managers without math.
      *   *Audit Trail:* Needs a specific template for the written rationale.

  4.  **Refining the "Past as Signal" aspect:**

      *   Why does past spend matter?
          *   Learning curves (are we faster now?).
          *   Technical debt revealed (was the estimate wrong?).
          *   Sunk cost as *proximity* (are we actually near the end?).
      *   *Trap:* "We spent £1m, so it must be valuable." -> *Correction:* "We spent £1m, does that prove the remaining £100k yields value?"

  5.  **Refining the "Hidden Costs" aspect:**

      *   Morale.
      *   Credibility with stakeholders.
      *   Re-deployability of the team.
      *   Contractual penalties.

  6.  **Developing the Three Cases:**

      *   *Case 1 (Data Migration):* Near completion. Forward-looking close.
          *   *Analysis:* High option value of completion. Sunk cost indicates proximity (evidence), not claim.
          *   *Verdict:* Continue.
      *   *Case 2 (Customer Feature):* Negative NPV. Fragile team.
          *   *Analysis:* Forward-looking says kill. But "Hidden Costs" (morale/team retention) might outweigh the savings. Need to weigh the cost of killing vs. cost of finishing.
          *   *Verdict:* Likely Continue (as a "team retention investment" re-classified), or Kill with mitigation. Let's argue for a "Strategic Continuation" with caveats.
      *   *Case 3 (The Hard Kill):* Needs to be a case where the procedure says "Kill" but emotions scream "Keep".
          *   *Idea:* A pet project of a senior leader, technically fascinating but commercially dead. High sunk cost, low future value, high emotional attachment.
          *   *Verdict:* Kill.

  7.  **Addressing Limitations:**

      *   Cannot detect political pressure.
      *   Cannot predict black swans.
      *   Cannot quantify morale perfectly.
      *   Garbage in, garbage out (if estimates are lied about).

  8.  **Writing in British English:**

      *   Spellings: *Programme, Centre, Analyse, Colour, Organisation*.
      *   Vocabulary: *Whilst, Whilst, Whilst* (use sparingly), *Shall, Ought*.
      *   Tone: Professional, slightly formal, pragmatic.

  9.  **Iterative Review against Constraints:**

      *   *20 mins?* The questions need to be tight.
      *   *No Finance Analyst?* Avoid NPV/IRR calculations. Use "Value vs. Effort" scales.
      *   *CFO Audit?* The rationale template must explicitly address the "Sunk Cost" rule to show compliance, even while bending it via "Evidence".
      *   *Distinction Operational?* Yes, by separating "Cost" questions from "Evidence" questions.

  10. **Final Polish:**

      *   Ensure the distinction between *sunk cost as weight* (bad) and *sunk cost as data* (good) is crystal clear.
      *   Make sure the "Human Judgement Call" points are highlighted.
      *   Check the Case 3 details to ensure it's tempting but clearly a "Kill" under the logic. (Let's make it a legacy platform rewrite that's been overtaken by market shifts).

  *(Self-Correction during drafting)*: I initially thought about allowing "Morale" to override financials too easily. I need to make sure the procedure forces them to quantify the morale cost as a "future cost of killing" rather than a "past debt". The CFO wants forward-looking logic. So, "Killing this costs £X in recruitment/training" is acceptable; "We owe them" is not. I must emphasise this framing.

  *(Refining the Procedure Name)*: "The Continuation Evidence Protocol" sounds a bit dry. Let's call it **The Portfolio Continuation Protocol (PCP)**.

  *(Refining Case 2)*: If the forward-looking case is *clearly* negative, continuing is technically violating the CFO's rule unless we reframe the "benefit". The benefit isn't the feature revenue, it's the *retention of the team*. This is a crucial distinction for the audit trail.

  *(Refining Case 3)*: Make it a "Strategic Bet" that has lost its strategic premise. E.g., An AI integration built before the market shifted to a different model standard.

  Let's assemble the document.

  *Structure:*
  1. Introduction & Philosophy.
  2. The Protocol (4 Stages).
  3. The Audit Template.
  4. Limitations & Failure Modes.
  5. Case Studies.
  6. Conclusion.

  *Language Check:* Ensure "programme", "analyse", "centre", "favour", "modelling" are used. Avoid Americanisms like "color", "center", "organize".

  *Time Check:* 20 mins per project.
  Stage 1: 5 mins.
  Stage 2: 5 mins.
  Stage 3: 5 mins.
  Stage 4: 5 mins.
  Perfect.

  *Decision Theory Check:*
  - Sunk Cost Fallacy: Addressed by separating cost from info.
  - Escalation of Commitment: Mitigated by Stage 2 (Evidence check).
  - Real Options: Addressed by Stage 1 (Completion value).
  - Principal-Agent Problem: Addressed by Audit Template.

  Ready to write.cw
answer: |-
  **To:** Portfolio Review Panel
  **From:** Chair, Quarterly Portfolio Review
  **Subject:** The Portfolio Continuation Protocol (PCP) – Operational Guidance

  ### 1. Introduction and Philosophy

  The CFO's doctrine is correct in principle but incomplete in practice. Strict adherence to 'forward-looking only' logic ignores the informational value of the past and the organisational costs of abandonment. However, indulging the 'sunk cost fallacy'—treating past spend as a debt the future must repay—is a guaranteed route to value destruction.

  This document establishes the **Portfolio Continuation Protocol (PCP)**. It is designed to fit within our twenty-minute per-project slot, requires no financial modelling, and produces a written rationale acceptable to the CFO's office.

  **The Core Distinction:**
  The PCP forces a separation between two uses of the past:
  1.  **Past as Cost (Illegitimate):** 'We have spent £500k, so we must finish.' This is the fallacy. The money is gone.
  2.  **Past as Evidence (Legitimate):** 'We have spent £500k and encountered three major architectural blockers; this evidence suggests the remaining work is riskier than originally planned.' This is data.

  The procedure below operationalises this distinction. It treats 'completion' as an asset (option value) and 'killing' as an action with its own future costs (reputational/morale debt), rather than past debts.

  ---

  ### 2. The Portfolio Continuation Protocol (PCP)

  **Time Allocation:** 20 Minutes per Project
  **Participants:** Panel of 8 (Engineering/Product Managers)
  **Input:** Project Lead presentation (max 5 mins), followed by 15 mins deliberation using the four stages below.

  #### Stage 1: The Forward-Looking Baseline (5 Minutes)
  *Goal: Satisfy the CFO's doctrine first. Establish the pure economic case.*

  **Question 1.1:** If we ignored all past spend and team attachment, would we start this project *today* as a new initiative?
  *   [ ] Yes
  *   [ ] No
  *   [ ] Only because we are near the end

  **Question 1.2:** What is the specific value of the *next* increment of work (e.g., the next month/sprint)?
  *   *Note: Do not list total project value. List only the value unlocked by the immediate next spend.*

  **Question 1.3:** Is there a confirmed, available alternative use for the funds and headcount required for that next increment?
  *   [ ] Yes (Specify: _______________)
  *   [ ] No (The budget would likely remain unspent or the team would be on the bench)

  *Decision Point:* If 1.1 is 'No', 1.2 is 'Low/Unclear', and 1.3 is 'Yes', the default decision is **Kill**. Proceed to Stage 4 to record rationale. If the answer is ambiguous, proceed to Stage 2.

  #### Stage 2: The Past as Evidence (5 Minutes)
  *Goal: Use history to inform the future, not justify the past. Detect Escalation of Commitment.*

  **Question 2.1 (The Estimate Audit):** Compare original estimates to actuals to date.
  *   Are we behind schedule/budget due to *unforeseen complexity* (bad signal) or *scope creep* (management failure)?
  *   *If unforeseen complexity:* Does this imply the *remaining* work is also underestimated? (If yes, downgrade future value).

  **Question 2.2 (The Learning Curve):** What capability have we built that we did not have at the start?
  *   Does finishing this project unlock technical infrastructure that makes *future* projects cheaper? (This is 'Option Value').
  *   *Note: This must be concrete (e.g., 'a new API gateway'), not abstract (e.g., 'team knowledge').*

  **Question 2.3 (The Proximity Check):**
  *   Is the project 'nearly done' in a technical sense (integration/testing only) or a political sense ('we hope it's done')?
  *   *Rule:* If technical completion is <10% of total effort remaining, mark as **High Option Value**.

  *Decision Point:* If Stage 2 reveals that past spend indicates high risk for future spend, revert to **Kill**. If it reveals high option value or low remaining effort, proceed to Stage 3.

  #### Stage 3: The Cost of Killing (5 Minutes)
  *Goal: Account for morale, reputation, and contractual friction as future costs.*

  **Question 3.1 (The Team Tax):** If we kill this, what is the cost to re-deploy or retain the team?
  *   Will key staff leave? (Estimate recruitment/training cost of replacement).
  *   Will trust in leadership degrade, making future estimates less reliable?

  **Question 3.2 (The Stakeholder Tax):**
  *   Have we publicly promised this to a customer or regulator?
  *   Is the reputational damage of cancellation greater than the cost of finishing?

  **Question 3.3 (The 'Nothing' Counterfactual):**
  *   Refer back to 1.3. If the alternative is 'nothing' (bench time), does finishing this project keep the team productive enough to justify the cost, even if the feature itself is low value?
  *   *Warning:* Do not use this to justify busywork. Only use if the team cannot be re-deployed to higher-value work immediately.

  *Decision Point:* Add the 'Cost of Killing' (3.1 + 3.2) to the 'Cost of Finishing'. Compare against 'Value of Finishing' (1.2 + 2.2). If Value > Cost, **Continue**. Otherwise, **Kill**.

  #### Stage 4: The Decision & Audit Rationale (5 Minutes)
  *Goal: Produce the written record.*

  The Project Lead must draft the rationale using the **PCP Audit Template** (see below). The Panel Chair must sign off that no 'Sunk Cost as Claim' language is used.

  ---

  ### 3. The PCP Audit Template

  *To be completed for every project review. This document is subject to CFO audit.*

  **Project Name:** ___________________
  **Decision:** [ ] Continue [ ] Kill [ ] Pause

  **1. Forward-Looking Case:**
  *We are continuing/killing because the next £X of spend is expected to generate £Y of value / prevent £Z of loss.*
  *(Do not mention money already spent in this section.)*

  **2. Evidence from Past Performance:**
  *Past performance indicates that remaining estimates are [Reliable / Optimistic / Pessimistic] because...*
  *(Here you may mention past spend only as a predictor of future difficulty.)*

  **3. Abandonment Costs (If Killing):**
  *We have accounted for the following future costs of stopping:*
  *   [ ] Team re-deployment costs
  *   [ ] Contractual penalties
  *   [ ] Reputational damage
  *   *None of these are treated as 'sunk costs', but as future liabilities triggered by cancellation.*

  **4. Option Value (If Continuing):**
  *Completion unlocks the following capabilities for future projects:*
  *   _________________________________________________

  **Chair's Attestation:**
  *I confirm that the decision was not influenced by the sentiment that 'we have invested too much to stop'.*
  **Signed:** ___________________

  ---

  ### 4. Limitations and Failure Modes

  The Panel must be aware of where the PCP cannot protect us.

  1.  **The Political Blind Spot:** The PCP cannot detect when a Project Lead is lying about 'Abandonment Costs' (e.g., exaggerating morale risk) to protect their empire. The Panel must rely on collective knowledge of the individual's credibility.
  2.  **The 'Nothing' Counterfactual Trap:** If the alternative to spending is truly 'nothing' (budget sits idle), the procedure may justify low-value work simply to keep heads down. This is efficient for resource utilisation but dangerous for strategic focus. A human judgement call is required to ask: *'Should this budget be returned to the pool rather than spent on low-value work?'*
  3.  **Quantifying Morale:** Stage 3 asks for recruitment costs, but morale damage is often intangible and long-tail. The procedure may systematically undervalue the cost of killing projects if the panel is cynical.
  4.  **Escalation of Commitment in Disguise:** A clever Project Lead can frame 'Sunk Cost as Claim' as 'Evidence'. (e.g., 'We've built the architecture' vs 'We've spent the money'). The Panel must remain vigilant against semantic gaming.

  **Where Human Judgement Takes Over:**
  If the PCP yields a 'Continue' decision, but the Panel feels a deep sense of unease or 'dead cat' energy, the Panel Chair has the authority to call a **Red Flag Vote**. This overrides the procedure and forces a 'Pause' for external review. This acknowledges that checklists cannot capture intuition born of experience.

  ---

  ### 5. Application to Three Cases

  Here is how the Panel should apply the PCP to the specific scenarios raised.

  #### Case 1: The Data-Migration Project
  *   **Status:** 11 months in, 60% budget spent. 2 weeks to delivery. Forward-looking case is 'close' (marginal value).
  *   **PCP Analysis:**
      *   *Stage 1 (Forward):* Value of next increment is low, but cost is also very low (2 weeks).
      *   *Stage 2 (Evidence):* Past spend confirms we are technically at the 'integration/testing' phase (Proximity Check = High Option Value). The 'cost' to finish is negligible compared to the total sunk cost.
      *   *Stage 3 (Killing):* Cost of killing includes leaving the system in a half-migrated state (technical debt) and demoralising a team at the finish line.
      *   *Stage 4 (Rationale):* 'Continue. Not because of past spend, but because the cost to complete (2 weeks) is lower than the cost of abandoning the migration state (technical debt). The past spend is evidence that we are in the final 10% of effort.'
  *   **Verdict:** **Continue.**
  *   **Why:** This is the legitimate use of 'nearly done'. The option value of completion outweighs the marginal forward-looking revenue.

  #### Case 2: The Customer Feature & Fragile Team
  *   **Status:** 4 months in. Forward-looking case is *clearly negative* (feature won't earn its keep). Team is fragile/needed for next project.
  *   **PCP Analysis:**
      *   *Stage 1 (Forward):* Pure product logic says **Kill**. Value < Cost.
      *   *Stage 2 (Evidence):* Past spend shows the feature is buildable, but market demand was misjudged. No technical option value.
      *   *Stage 3 (Killing):* High 'Team Tax'. If killed, key engineers may leave. Recruitment/training for the *next* project will cost more than finishing this one.
      *   *Stage 4 (Rationale):* 'Continue. Not for feature revenue, but as a retention investment. The cost of finishing is lower than the cost of team churn and re-hiring for the Q3 roadmap. We are re-classifying this spend from 'Product Development' to ' Organisational Capability'.'
  *   **Verdict:** **Continue (with caveats).**
  *   **Why:** The procedure allows us to capture the 'morale cost' as a future financial liability. However, the Audit Template must be honest: we are not lying to the CFO that the *feature* is valuable; we are stating the *team retention* is the value.
  *   **Risk:** This bends the doctrine. The CFO may challenge the accounting code. The Panel must be prepared to defend 'Retention' as a valid asset class.

  #### Case 3: The 'Strategic' Platform Rewrite (The Hard Kill)
  *   **Status:** 18 months in. 80% budget spent. Built on a technology stack that the market has recently abandoned (e.g., a specific AI model architecture that became obsolete last quarter). Forward-looking case: Negative.
  *   **The Trap:** The Project Lead is a VP. The team is senior. The argument will be: 'We are 80% done. The new stack is unproven. We owe it to the architects to let them finish.'
  *   **PCP Analysis:**
      *   *Stage 1 (Forward):* If we started today, would we build this? **No.** Market shifted.
      *   *Stage 2 (Evidence):* Past spend is evidence of *strategic drift*, not proximity. The '80% done' is a fallacy; it is 80% of the *old* requirement, 0% of the *new* requirement.
      *   *Stage 3 (Killing):* Team Tax is high (senior staff ego). However, Stage 1.3 asks: Is there an alternative use? Yes, moving them to the new stack.
      *   *Stage 4 (Rationale):* 'Kill. Past spend confirms the technical approach is now obsolete. Continuing incurs future technical debt. The cost of re-deploying senior staff is lower than the cost of maintaining a legacy system upon launch.'
  *   **Verdict:** **Kill.**
  *   **Why:** This is where the Panel will hate the procedure. The 'Sunk Cost as Claim' voice will be loudest here ('Think of the 18 months!'). The PCP forces the acknowledgement that the past spend is evidence of *failure*, not *progress*.
  *   **Human Judgement Call:** The Chair must ensure the VP does not bully the panel. If the VP threatens to leave, that is a 'Team Tax' to be quantified in Stage 3, not a veto on Stage 1.

  ---

  ### 6. What the Procedure Cannot Do

  We must be clear-eyed about the limits of the PCP.

  1.  **It Cannot Predict Black Swans:** The PCP relies on estimates. If the team lies about the '2 weeks to finish' in Case 1, the procedure fails. It assumes good-faith data entry.
  2.  **It Cannot Solve Strategic Confusion:** If the company does not know what it wants to be, Stage 1 (Forward-Looking Value) becomes guesswork. The PCP optimises decisions; it does not create strategy.
  3.  **It Cannot Quantify 'Regret':** There is a genuine human emotion in abandoning work. The PCP treats this as a 'cost'. Sometimes, the feeling of waste is corrosive regardless of the financial logic. The procedure cannot fix culture, only manage it.
  4.  **It Cannot Detect 'Zombie Projects':** A project can pass the PCP by having low costs and low value, shuffling along indefinitely. The Panel must periodically ask: *'If this project didn't exist, would we miss it?'* If the answer is no, kill it, regardless of the PCP score.

  **Final Instruction to the Panel:**
  Use the PCP to structure your thinking, not to replace it. If the procedure says 'Continue' but your gut says 'This is a disaster', use the **Red Flag Vote**. The CFO audits our paperwork; the market audits our results. The paperwork must be clean, but the results must be right.

  **Chair, Portfolio Review**
