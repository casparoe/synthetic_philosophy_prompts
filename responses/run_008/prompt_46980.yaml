answer: |-
  # Quiz: Which View of Technology and Politics Do You Actually Hold?

  **Instructions:** Read each of the ten short cases below. Choose the single answer option that best matches your judgment of that specific situation. Do not worry about being consistent yet; just answer honestly based on how you see the case. At the end, use the Scoring Key to tally your results.

  ***

  **1. The Nuclear Station**
  A large nuclear power plant requires armed guards, strict secrecy about its internal workings, and a rigid chain of command to operate safely.
  *   **A.** The physics of radiation and the risk of meltdown make centralized control and secrecy unavoidable; you cannot run this machine democratically.
  *   **B.** The machine is just hardware; the secrecy and guards come from the government regulations and ownership laws wrapped around it.
  *   **C.** The technology makes centralized control much easier and cheaper than open management, so most societies choose it, but other ways are theoretically possible.

  **2. The Hostile Bench**
  A public park installs benches with metal armrests every meter and a half, making it impossible for a person to lie down and sleep on them.
  *   **A.** The armrests are a physical command to "do not sleep" that works even if no police officer is watching.
  *   **B.** The bench is just furniture; it only becomes political because the city government placed it in a public space to manage behavior.
  *   **C.** The design makes sleeping difficult, but it does not strictly prevent it; it simply nudges people to move elsewhere.

  **3. The Digital Gate**
  A restaurant replaces paper menus with QR codes, and a subway system installs turnstiles that require a smartphone to open.
  *   **A.** These systems assume a specific type of citizen (able-bodied, tech-literate) and quietly exclude everyone else by design.
  *   **B.** The technology is neutral; the exclusion happens only because the business owners and transit authority chose not to provide alternatives.
  *   **C.** The systems do not ban anyone outright, but they make participation significantly more expensive and awkward for some riders.

  **4. The Mobile Phone**
  Activists use mobile phones to organize protests, while authoritarian governments use the same networks to track and arrest those activists.
  *   **A.** The device is a blank slate; it takes on the politics of whoever holds it and how they choose to use it.
  *   **B.** The network architecture inherently creates a record of location and contact, which favors surveillance regardless of who is in charge.
  *   **C.** The phone itself is innocent, but the laws governing the service providers determine whether it becomes a tool for liberty or control.

  **5. The Mandated Design**
  A government passes a law requiring curb cuts at every corner, or mandates that all phones use the same charging connector.
  *   **A.** The politics is entirely in the law; the concrete curb cut or the port is just an object obeying an order.
  *   **B.** Once installed, the curb cut enforces accessibility whether the law stays on the books or is repealed the next day.
  *   **C.** The mandate makes accessibility the default path, reducing the need for constant political fighting over each individual corner.

  **6. The Car-Free Zone**
  A city council decides it wants neighbors to meet more often, so it bans private cars from the town center and widens the sidewalks.
  *   **A.** Since the political goal came first, the empty street is just a tool carrying out an order; the politics remain in the council, not the pavement.
  *   **B.** Now that the cars are gone, the street itself enforces the social outcome; neighbors will meet because the artifact makes it the only option.
  *   **C.** The new layout makes socializing easier and driving impossible, biasing the neighborhood toward interaction without guaranteeing it.

  **7. The Speed Bump**
  A residential street installs raised humps of asphalt to force drivers to slow down, with no signs, officers, or tickets.
  *   **A.** The bump enforces the speed limit by physics; the driver has no choice but to comply if they want to avoid damage.
  *   **B.** The bump is just a lump of asphalt; the driver still chooses to slow down to protect their suspension.
  *   **C.** The bump makes speeding uncomfortable, encouraging compliance without removing the driver's ability to speed.

  **8. The Lasting Road**
  Compare a park bench with armrests to a massive highway interchange. The bench can be torn out in a day; the road network takes decades to undo.
  *   **A.** The road locks in a way of life for generations in a way the bench cannot; the scale of the artifact changes its political nature.
  *   **B.** Both are just objects; the commitment comes from the budget and the legal zoning, not the concrete itself.
  *   **C.** The road embodies the decision so deeply through its cost and size that it becomes invisible, whereas the bench remains a visible debate.

  **9. The Shopping Cart**
  A supermarket uses shopping carts that lock with a coin deposit, preventing them from being taken out of the parking lot.
  *   **A.** The lock mechanism settles the question of theft; the design solves the problem without needing a security guard.
  *   **B.** The cart is neutral; the store's policy on deposits is what stops the theft, not the metal lock.
  *   **C.** The lock makes theft inconvenient enough that most people won't try it, but determined thieves can still break it.

  **10. The Fire Exit**
  A building installs a fire exit door that sounds a loud alarm if opened, intended to prevent unauthorized entry while maintaining safety.
  *   **A.** The alarm embeds a decision that security is more important than silent egress, regardless of who uses the door.
  *   **B.** The door is a safety tool; the alarm is a separate security policy attached to it by the building manager.
  *   **C.** The alarm creates a tension between safety and security, making users hesitate but not stopping them from leaving in an emergency.

  ***

  # Scoring Key

  ### Part 1: Tallying Your Position

  For each question, find the option you chose below and add one point to the corresponding View.

