  ### Part 2: What The Positions Mean

  *   **The Tool View:** You believe artifacts are neutral. Politics lies entirely in the users, owners, or laws surrounding the object. A hammer can build a house or break a window; the hammer itself has no opinion.
  *   **The Strong View:** You believe certain technologies force specific social forms. The physics or engineering of the machine makes some political arrangements impossible and others unavoidable (e.g., nuclear power *requires* hierarchy).
  *   **The Soft View:** You believe technologies do not force outcomes, but they bias the world. They make some arrangements easy and cheap, and others expensive and awkward. This "gradient" does most of the political work.
  *   **The Designed-Politics View:** You believe an artifact can embody a specific decision made by its designer. That decision persists in the object even when later users are innocent or unaware of the intent.
  *   **The Context View:** You believe politics is never in the artifact alone, but in the *situation of its adoption*. A bench is political in a public park because the city put it there; the same bench on a private patio is just furniture.

  ### Part 3: Limitations and Empty Spaces

  **1. Positions This Quiz Cannot Fully Separate**
  *   **Tool View vs. Context View:** These two are very close. Both argue the object itself is not the source of politics. The quiz tries to separate them by asking about laws and settings (Questions 4, 5, 6), but in practice, people who hold one often sound like they hold the other. If you scored high in both, you likely believe objects are passive, but you disagree on whether the *setting* counts as part of the object or part of the "user."
  *   **Strong View vs. Designed View:** These often overlap. If a designer embeds a political choice into a machine (Designed), and that machine then forces users to behave a certain way (Strong), the result looks the same. The difference is whether you think the *physics* forces the outcome (Strong) or the *human intent* locked in the metal (Designed). Questions 1 and 8 try to split this, but a high score in both suggests you see them as two sides of the same coin.

  **2. Combinations No One Actually Holds (Empty Spaces)**
  If your answers resulted in a mix of the following, your position may be logically inconsistent, or at least very rare:

  *   **High Tool View + High Strong View:** This combination suggests you believe objects are neutral *and* that they force social outcomes. This is incoherent. Usually, this happens when a person answers based on the *specific object* rather than a consistent theory (e.g., "Phones are neutral, but nuclear plants are dangerous"). If this is you, you may not have a single theory, but rather a case-by-case intuition.
  *   **High Context View + High Designed View:** This suggests you believe politics is *only* in the situation of adoption (Context), but also that the designer's intent persists in the object regardless of the situation (Designed). These contradict. One says the setting matters most; the other says the object's history matters most. This combination is unattractive to most thinkers because it splits the source of power in two incompatible directions.
  *   **High Soft View + High Strong View:** This is the "unthought" space. The Soft View says technology *biases* (nudges); the Strong View says technology *determines* (forces). Holding both strongly implies you think machines both leave you a choice and take it away. While some people feel this tension emotionally, it is rarely a stable philosophical position.

  **Note on the "Brother-in-Law" Position:**
  If you scored highest in the **Context View**, you hold the position your brother-in-law retreats to. You believe that even the armrested bench is political solely through the city government that ordered it, and the same bench on a private patio would be nothing of the kind. This is a defensible position, but note that the quiz flags it as hard to separate from the Tool View. To distinguish yourself from a pure Tool theorist, check if you scored high on Questions 5 and 6 (Law and Politics-First). A Tool theorist sees the law and the object as separate; a Context theorist sees the law's installation of the object as the single political event.
