answer: |-
  # The Limits of the Calculus: A Decision Quiz

  **Instructions:** Below are nine scenarios involving choices under uncertainty. There are no trick questions, and no answers are objectively "correct" in the eyes of the editors. Please select the option that best matches your genuine intuition or likely action. Do not answer based on what you think decision theory *should* say; answer based on what *you* would do.

  ***

  **1. The Street Magician**
  A stranger stops you on the street. They claim to be a time-traveller from a dimension where money is irrelevant. They ask for your wallet ($200 inside). In exchange, they promise to use their powers to prevent a fatal car crash that would otherwise happen tomorrow. They cannot prove their identity. If you believe there is even a 1 in 10,000 chance they are telling the truth, the mathematical expectation favours giving them the wallet. Do you hand it over?
  A) Yes. If the math says the expected good is higher, I must follow the math.
  B) No. The story is too absurd; the probability is effectively zero regardless of the math.
  C) No. Even if the math favoured it, it is irrational to bet life savings on unverifiable claims.

  **2. The Scaling Offer**
  Imagine the stranger in Question 1 changes their offer. They keep the request ($200) but increase the promised payoff. First, they promise to save 100 lives. Then 1,000. Then 1 billion. Is there *any* number of lives promised that would compel you to hand over the wallet, assuming you cannot verify their power?
  A) Yes. If the number of lives is high enough, the expected value outweighs the implausibility.
  B) No. There is a limit to how much I will bet on a claim with no evidence, regardless of the stakes.
  C) No. The problem isn't the stakes; it's that my belief in their power drops faster than the stakes rise.

  **3. The Certain vs. The Possible**
  You have a donation budget of $1,000.
  *   **Charity A** will definitely provide bednets that save 5 lives.
  *   **Charity B** has a 1 in 1,000,000 chance of preventing a pandemic that would kill 10,000,000 people. (Expected value: 10 lives).
  Which charity do you support?
  A) Charity B. The expected number of lives saved is higher.
  B) Charity A. Saving 5 lives for sure is better than a near-certain failure.
  C) It depends on how reliable the estimate for Charity B is.

  **4. The Infinite Coin**
  A casino offers a game. A fair coin is flipped. If it lands Heads on the first flip, you win $2. If Tails, it flips again. If Heads on the second flip, you win $4. If Tails, it flips again. The pot doubles every time Tails appears. The game ends when Heads appears. The mathematical expected value of this game is infinite. What is the most you would pay to play?
  A) A large sum (e.g., $1,000+). The potential payout is theoretically unlimited.
  B) A modest sum (e.g., $20–$50). The chance of winning big is too small to justify more.
  C) Nothing. The game is a theoretical trick that doesn't work in the real world.

  **5. The Accumulating Risk**
  You are a safety inspector. A certain procedure carries a 1 in 10,000,000,000 risk of causing a global catastrophe. It is performed once a day. Individually, the risk is negligible. Over 100 years, however, the cumulative risk becomes significant. How do you regulate the *individual* instances?
  A) Ban the procedure immediately. The sum of the risks is what matters.
  B) Allow individual instances. No single act creates a meaningful danger.
  C) Allow instances until the cumulative risk crosses a visible threshold, then ban.

  **6. The Absolute Floor**
  Consider a probability of 1 in $10^{100}$ (a 1 followed by 100 zeros). Is there *any* possible positive outcome—saving a universe, ending all suffering forever—that would make it rational to take an action with this specific probability of success?
  A) Yes. If the outcome is valuable enough, the probability doesn't matter.
  B) No. Probabilities this small should be treated as zero for decision-making.
  C) No. Claims involving odds this extreme are impossible to evidence, so the credence should be zero.

  **7. The Source of Hesitation**
  When you hesitate to accept a tiny-probability/high-stakes bet (like the ones above), what do you think is happening?
  A) My intuition is correct; the math of expected value breaks down at extremes.
  B) My intuition is an evolved bias; I am afraid of looking foolish, not irrational.
  C) My intuition is a heuristic for missing information; I suspect the odds are wrong.

  **8. The Cap on Good**
  Suppose you could save 1,000,000 lives. Now suppose you could save 1,000,000,000 lives. Is the second outcome *one thousand times better* than the first, or does the value "flatten out" because you cannot comprehend the difference?
  A) It is exactly one thousand times better. Numbers scale linearly.
  B) It is better, but not one thousand times better. Value has diminishing returns.
  C) It is better, but I cannot judge the ratio without knowing who the people are.

  **9. The Trusted Expert**
  Return to the donation case (Question 3). Suppose Charity B's odds are not a guess, but are certified by a panel of Nobel laureates in relevant fields who stake their reputations on the 1 in 1,000,000 figure. Does this change your choice?
  A) No. I still prefer the certain 5 lives.
  B) Yes. With trusted verification, I switch to the high-stakes option.
  C) Yes. I would split the donation between both.

  ***

  # Scoring Key & Interpretation

  This key does not assign points. Instead, identify the pattern of your answers to locate your decision-theoretic profile. Note that most people hold a mixture of views; the profiles below represent "ideal types."

  ### Diagnostic Questions
  Not all questions weigh equally in distinguishing theories.
  *   **Questions 1, 2, & 6** are the primary diagnostics for **Probability Thresholds** vs. **Fanaticism**.
  *   **Questions 3 & 8** are the primary diagnostics for **Bounded Utility** vs. **Linear Utility**.
  *   **Questions 4 & 9** are the primary diagnostics for **Evidential Responses** vs. **Structural Responses**.
  *   **Question 7** identifies the **Debunker**.

  ### Position Profiles

  **1. The Fanatical Expected-Value Maximiser**
  *   **Typical Answers:** 1(A), 2(A), 3(A), 4(A), 6(A), 8(A).
  *   **View:** You hold that rationality requires maximising expected value regardless of how small the probability or how large the stake. If the math says "do it," you do it. You believe utility is unbounded (saving a billion lives is exactly 1,000 times better than saving a million) and that probabilities never truly hit zero.
  *   **Note:** This position is logically consistent but often leads to counter-intuitive conclusions (e.g., handing over your wallet to a mugger if they promise enough).

  **2. The Bounded-Utility Theorist**
  *   **Typical Answers:** 3(B), 8(B), 6(A or B).
  *   **View:** You believe that value has a ceiling. Saving 10 billion lives is better than saving 100, but not proportionally so. Eventually, adding more "good" stops increasing the value of the outcome enough to justify tiny probabilities.
  *   **Distinction:** Unlike the Threshold View, you might accept a 50% chance of a huge payoff, but reject a 1 in a billion chance, not because the probability is too small, but because the payoff isn't *that* much more valuable than a moderate one.

  **3. The Threshold (Lexical) View**
  *   **Typical Answers:** 2(B), 5(B), 6(B).
  *   **View:** You believe there is a "probability floor." Any probability below a certain point (e.g., 1 in a trillion) counts as zero for decision-making, regardless of the stake. This prevents "Pascal's Mugging" without needing to cap the value of the outcome.
  *   **Distinction:** This differs from the Evidential Response because you would still reject the bet even if you were *guaranteed* the probability was accurate (Question 6).

  **4. The Evidential Responder**
  *   **Typical Answers:** 1(C), 2(C), 6(C), 9(B).
  *   **View:** You do not cap probabilities or utilities structurally. Instead, you believe that as a claim becomes more outlandish, the evidence required to believe it becomes impossibly high. You reject the Mugging not because the math is wrong, but because your *credence* in the claim drops faster than the stake rises.
  *   **Diagnostic:** If you answered (B) to Question 9 (switching when experts verify), you likely hold this view. You are willing to act on tiny probabilities, but only when the evidence is robust.

  **5. The Debunker**
  *   **Typical Answers:** 7(B).
  *   **View:** You believe the conflict between "common sense" and "expected value" is a psychological artifact. You likely think human intuition evolved for medium-stakes, medium-probability environments (the African savannah) and misfires when applied to astronomical stakes.
  *   **Implication:** Depending on whether you trust the math or the intuition more, a Debunker can end up as a Fanatic (trust the math) or a Thresholder (trust the intuition).

  ### Ambiguities and Overlaps

  **Risk Aversion vs. Bounded Utility**
  This quiz cannot cleanly separate *Risk Aversion* from *Bounded Utility*.
  *   **Risk Aversion** means you prefer a sure thing over a gamble with the same expected monetary value (e.g., preferring $50 for sure over a 50% chance of $100).
  *   **Bounded Utility** means you value additional units of "good" less as you have more of them.
  *   **The Conflation:** In Question 4 (The Infinite Coin), answering (B) could mean you have a cap on how much money matters to you (Bounded Utility) OR it could mean you simply dislike volatility (Risk Aversion). Both positions reject the Fanatical view, but for different technical reasons. For the purpose of this quiz, they function similarly: both reject the Fanatical conclusion.

  **The Evidential vs. Threshold Distinction**
  Questions 2 and 6 are designed to separate these, but in practice, they often yield the same behaviour.
  *   If you answered **2(C)** ("My belief drops faster than stakes rise"), you are an **Evidential Responder**.
  *   If you answered **2(B)** ("No number compels me"), you are a **Thresholder**.
  *   *Why it matters:* The Thresholder refuses the bet even if God guarantees the odds. The Evidential Responder accepts that if the evidence were perfect, the bet would be rational.

  ### Unoccupied Logical Space

  **The Asymmetric Fanatic**
  There is a coherent combination of answers that few people defend: **Bounded Utility for Gains, but Fanaticism for Losses.**
  *   *Pattern:* You would not pay to play the Infinite Coin game (Question 4, Answer B), but you *would* pay to prevent a 1 in a billion chance of human extinction (Question 3, Answer A).
  *   *Status:* This view is logically possible (perhaps avoiding catastrophe is lexically more important than creating happiness), but it is rarely explicitly argued for in decision theory. Most theorists try to apply the same rule to gains and losses. If you found yourself answering differently to Question 3 depending on whether it was framed as "saving lives" or "preventing death," you may occupy this rare space.

  **The Risk-Neutral Non-Fanatic**
  Another rare position is being **Risk-Neutral** (you care only about averages) but **Non-Fanatical** (you reject tiny probabilities).
  *   *Pattern:* You accept 50/50 bets freely, but reject 1-in-a-billion bets regardless of stake.
  *   *Status:* This is the **Threshold View**. It is often occupied by policymakers (ignoring "noise" risks) but rarely by moral philosophers, who worry that setting a probability floor arbitrarily ignores real catastrophes that happen to be unlikely.

  ### A Note on "Correctness"
  If you found yourself inconsistent (e.g., answering "Yes" to Question 3 but "No" to Question 6), do not worry. This inconsistency is the norm. It suggests you are sensitive to *context* (e.g., charitable giving vs. abstract lotteries) rather than committed to a single abstract principle. Decision theory is currently divided on whether consistency across these contexts is a requirement of rationality or a demand of a theory that is too rigid for human life.
