      *   *Critique:* The prompt asks for 8-10 questions. I have 9 drafted. Let's add one more about *repetition* to distinguish Threshold from EV more clearly. (Actually Q4 covers accumulation). Let's make sure Q4 is clear.
      *   *Critique:* The prompt asks to flag if risk-aversion is orthogonal to fanaticism. I need to make sure the scoring key explains this clearly. (Yes, risk aversion is about diminishing marginal utility of wealth, fanaticism is about linearity of utility across states. In tiny-prob/high-stakes, they converge, but they are distinct mechanisms).

  6.  **Final Polish:** Check against the "no technical vocabulary" rule in the quiz section. "Expected value" is allowed per the prompt ("readers comfortable with the phrase"), but better to describe it as "average outcome" or "mathematical expectation" in the text to be safe, or use it sparingly. The prompt says readers are comfortable with 'expected value', so I can use it in the intro or explanations, but the *questions* should be concrete. I will avoid it in the options to keep it accessible.

