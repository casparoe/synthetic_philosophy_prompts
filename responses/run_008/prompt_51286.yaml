      *   *Unoccupied Space:* Coherent but undefended views (e.g., Bounded Utility but Fanatical about Probabilities?).

  4.  **Writing - Section by Section:**

      *   *Intro:* Set the tone. Thoughtful, neutral.
      *   *Questions:* Polish the wording. Ensure "Expected Value" isn't used in the questions themselves, just the concept.
      *   *Scoring:* Create a clear mapping system. Instead of "If you got mostly As," use "Pattern Recognition."
