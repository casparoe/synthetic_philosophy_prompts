      *   *Review against constraints:* Are any questions redundant? Q1 and Q5 are similar (Mugging vs. Floor). Q1 is about a specific interaction, Q5 is about the abstract principle. Let's make Q1 about the *specific* mugging interaction and Q5 about the *abstract* limit. Q6 covers the Evidential response well. Q3 covers St. Petersburg. Q4 covers aggregation. Q2 covers Effective Altruism/Longtermism tradeoffs.
