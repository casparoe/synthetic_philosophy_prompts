      *   **The Circularity Charge:** Distinguish between *premise circularity* (begging the question) and *rule circularity* (using a rule to validate the rule). The latter might be acceptable (van Cleve).
      *   **Weaknesses/Skeptic's Counter:** What if the world *is* chaotic in the long run? What if our "structure" is just a local bubble? Acknowledge this vulnerability.

