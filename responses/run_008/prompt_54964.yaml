      *   **Context:** The user is a philosophy of science student with adjacent ML experience.
      *   **Problem:** A friend (ML practitioner) has constructed an argument linking the No-Free-Lunch (NFL) theorems to Hume's Problem of Induction, concluding that induction is no more reasonable than counter-induction or tea leaves.
      *   **Task:** Act as a philosopher of science who takes NFL seriously. Brainstorm first, then walk through the argument step-by-step. Identify which premise/inference to reject. Discuss the cost of rejection (e.g., assumptions about world structure). Address circularity/vindication. Be upfront about weaknesses in the diagnosis. Explain technical details of NFL if relevant.
