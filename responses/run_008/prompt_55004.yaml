      *   *Epistemic (Entitlement/Structural) Reading:* Often associated with trying to save hinges for epistemology. If they aren't knowledge, scepticism wins. So, we need a broader notion of justification (e.g., Wright's entitlement, Pritchard's anti-luck virtue epistemology applied to hinges). They are rational, just not evidentially supported.

