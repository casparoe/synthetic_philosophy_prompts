answer: |-
  You have identified a genuine and well-documented instability in strategic interaction, though it does not have a single, universally recognized proper noun like "The Prisoner's Dilemma." Your intuition is correct: standard Schelling points and the Game of Chicken describe the *geometry* of the standoff, but they do not fully capture the *temporal pathology* you are staging—the race to disable one's own cognition.

  In game theory and security studies, this dynamic is most often referred to as a **Commitment Race**, specifically one driven by **First-Strike Instability** or **Preemptive Self-Binding**.

  However, for your purposes as a novelist, those terms are a bit dry. To give you the "carving" you need to distinguish this from mere brinkmanship, I propose we refine the terminology into **"Competitive Irrevocability."**

  Here is the breakdown of the phenomenon, how it differs from its neighbors, and the boundaries you requested.

  ### 1. The Core Mechanism: Flexibility as Liability
  In standard decision theory, having more options (flexibility) is inherently valuable. This is the "value of waiting." In the dynamic you are describing, **flexibility is a liability.**

  *   **Schelling Commitment:** "I am binding myself to this threat so you know I will carry it out." (Focus: Credibility).
  *   **Your Dynamic:** "I must bind myself *before you bind yourself*, and the binding must happen faster than I can calculate the cost." (Focus: Temporal Preemption).

  The crucial distinction is that Schelling treats commitment as a *tool* chosen by a rational actor. In your scenes, the *availability* of the tool creates a pressure cooker where rationality itself becomes a weakness. If you stop to calculate the cost of resigning from the firm, you signal that you are still deliberating. If you are still deliberating, you haven't committed. If you haven't committed, you can still be preempted. Therefore, **the capacity to deliberate is a strategic vulnerability.**

  ### 2. Differentiation from Near Neighbors

  | Concept | The Structure | Why It's Not Your Pattern |
  | :--- | :--- | :--- |
  | **Game of Chicken** | Two parties drive toward collision; first to swerve loses. | In Chicken, the goal is to *persist*. In your pattern, the goal is to *restrict oneself*. In Chicken, you want the other guy to think you won't swerve. In your pattern, you must *make it impossible* to swerve. |
  | **Brinkmanship** | Pushing a dangerous situation to the limit to force a concession. | Brinkmanship implies a calculated risk ("I will go 90% to the edge"). Your characters are going 100% over the edge to prove they aren't calculating. Brinkmanship keeps an escape route open; your pattern burns it. |
  | **Schelling Commitment** | Making a threat credible by removing one's own choice. | Schelling focuses on the *outcome* of the commitment (deterrence). You are focusing on the *process* of the commitment (the race). Schelling assumes the actor chooses the commitment wisely. Your pattern rewards choosing it *unwisely but quickly*. |
  | **Escalation of Commitment** | (Psychology) Throwing good money after bad due to sunk costs. | This is internal and retrospective. Your pattern is external, prospective, and competitive. |

  ### 3. A Proposed Definition: Competitive Irrevocability
  To help you stage this honestly, here is a definition you can use as a litmus test for your scenes.

  **Competitive Irrevocability** occurs when:
  1.  **Mutual Vulnerability:** Both parties know that whoever retains the ability to change their mind loses the standoff.
  2.  **Epistemic Closure:** The act of commitment requires the suppression of future deliberation.
  3.  **The Deliberation Penalty:** Any pause taken to assess consequences is interpreted by the opponent (and the audience) as a lack of commitment, inviting preemptive defeat.
  4.  **Negative-Sum Velocity:** The speed of the interaction outpaces the speed of information processing, ensuring that the "winner" often secures a pyrrhic victory or a shared catastrophe.

  ### 4. Boundary Cases and Variations
  You mentioned specific boundary cases that vex you. Here is how they fit into the framework of Competitive Irrevocability.

  #### A. The Feigned Commitment (The "Madman" Variant)
  *   **Scenario:** A character pretends to have bound themselves irrevocably, but secretly keeps an escape route open.
  *   **Verdict:** This is **not** Competitive Irrevocability; this is **Strategic Deception** (or Nixon's "Madman Theory").
  *   **The Edge:** It counts as your pattern *only if* the character is at risk of being exposed. If they are found out, they lose instantly because they failed the "sincerity" test. The tension in your novel comes from the fact that *true* irrevocability wins. If a character is faking it, they are playing a different game (bluffing). If they are caught faking it, they collapse.
  *   **Writing Tip:** The most tense version of this is when the character *starts* faking it, but the pressure of the race forces them to make the fake commitment real (the "Ulysses" slip).

  #### B. The Deliberated Commitment (The "Calculated" Variant)
  *   **Scenario:** A character thinks for an hour, then binds themselves.
  *   **Verdict:** This fails the pattern. In Competitive Irrevocability, the *value* of the move is derived from the *lack* of deliberation.
  *   **The Edge:** If a character deliberates, they must hide it. They must stage the commitment to *look* spontaneous. If the opponent suspects deliberation, the commitment loses credibility. This creates a rich layer of subtext: characters frantically thinking while acting as if they aren't.

  #### C. The Third-Party Engineer (The "Arms Dealer")
  *   **Scenario:** A third character understands the mechanism and forces the race.
  *   **Verdict:** This is a pure instance of the dynamic.
  *   **The Edge:** The third party does not need to bind themselves. They simply manipulate the **information environment** to increase the perceived speed of the threat. They whisper to Party A that Party B is about to resign, triggering Party A's preemptive resignation. This is the "Security Dilemma" in action: defensive moves look like offensive threats.

  ### 5. Why Rationality Punishes Itself
  You asked if it is an artifact of your staging that rationality punishes itself. It is not. This is a known paradox in game theory called the **"Paradox of Rational Commitment."**

  In a standard game, the rational player wins because they maximize utility. In a Commitment Race, the "rational" player (who weighs costs and benefits) loses to the "committed" player (who ignores costs and benefits).
  *   **Rationality** requires keeping options open until the last moment.
  *   **Winning** requires closing options before the last moment.

  Therefore, to win, one must voluntarily accept a handicap (the loss of agency). This is why your characters often end up in catastrophic outcomes: the mechanism selects for the person most willing to ignore the catastrophe.

  ### 6. Summary for Your Writer's Bible
  If you need a label to pin on the wall while you write, use **"The Commitment Race."** It is the recognized term in political science and game theory (e.g., in literature on alliance formation or crisis bargaining).

  However, to capture the specific *human* texture you are exploring, I recommend using the phrase **"Competitive Irrevocability."**

  **The Litmus Test for a Scene:**
  1.  **Is flexibility weakness?** If a character says, "Let's wait and see," do they lose?
  2.  **Is sincerity a weapon?** Does the character's known inability to lie or backtrack make them more dangerous?
  3.  **Is time the enemy?** Does the mere passage of time degrade their position?
  4.  **Is the outcome secondary?** Is the focus less on *what* they decided and more on the fact *that* they decided first?

  If the answer to these is yes, you are staging Competitive Irrevocability. You are not just writing about conflict; you are writing about the **cost of agency**. Your characters are paying with their future freedom to purchase present security. That is a profound subject, and it is absolutely real.
