answer: |-
  Based on the case law of your cousin's moral intuitions, here is an analysis of her underlying rule, predictions for your specific situations, and a strategy for the dinner table.

  ### 1. The Verdict on Your Three Cases

  Based on her precedents, here is how she will likely rule on your scenarios:

  **Case A: The Late Grandmother (Visit Grave Yearly)**
  *   **Verdict:** **BINDS.**
  *   **Reasoning:** This is almost identical to her "Dead Friend's Secret" precedent. The promisee is deceased, cannot be harmed, and cannot rely on you. However, she ruled that the obligation persists despite this. The "inconvenience" of visiting a grave is also analogous to the "inconvenient airport drive." The only variable is the passage of time, which she hasn't cited as a voiding factor.

  **Case B: The Promise to Self (Quit Vaping)**
  *   **Verdict:** **DOES NOT BIND (or is not a promise).**
  *   **Reasoning:** This is the weak point in her jurisprudence. Every binding case she cited involves a second party (friend, kid, dead friend). Every non-binding case involves a defect in the *transaction* (gunpoint, trickery, joke). A promise to oneself lacks a "promisee." While she believes "words bind you," promises are inherently social contracts. She will likely classify this as a "resolution" or "intention," not a promise. If she *does* say this binds, she is a radical integrity absolutist (see below).

  **Case C: The Drunken Party Promise (Name Kid After Guy)**
  *   **Verdict:** **DOES NOT BIND.**
  *   **Reasoning:** This falls under her "Obvious Joking Promise" exception. While she says internal intent (lying) doesn't matter, *contextual signals* do. A drunken promise at a party is socially understood as non-serious, similar to "I swear I'll never let you down, buddy." It lacks the "serious context" required to invoke the obligation, unlike the airport drive or the deathbed promise.

  ### 2. The Rule She Is Actually Running

  Your cousin is operating under a principle of **Objective Conventionalism**.

  *   **The Core:** A promise is a social technology (a speech act). When you use the tool correctly (serious context, voluntary, understandable), the tool does the work regardless of your internal mental state.
  *   **Why it fits:**
      *   *Lying binds:* You used the tool correctly, even if you meant to misuse it. The social contract is broken by the words, not the thought.
      *   *Dead friend binds:* The tool was activated; the subsequent unavailability of the other party doesn't deactivate the tool.
      *   *Jokes/Guns don't bind:* These are "defective transactions." In one, the tool wasn't seriously engaged (joke); in the other, the user was coerced (gunpoint).
      *   *Kids bind extra hard:* This adds a "Duty of Care" modifier to the Conventionalist rule. Vulnerable participants increase the stakes of the contract.

  ### 3. Alternative Rules That Fit Just As Well

  To test her, you need to distinguish her rule from these two competitors:

  **Alternative A: The "Reasonable Reliance" Rule**
  *   **Theory:** You are bound if a reasonable person would rely on your words.
  *   **Fit:** Explains Airport (they relied), Joke (no reasonable reliance), Gunpoint (no valid agreement).
  *   **Tension:** Struggles with the "Dead Friend" case (they can't rely anymore) and the "Lying" case (if you never intended to keep it, did you create reliance? Yes, objectively, but it's a stretch).

  **Alternative B: The "Personal Integrity" Rule**
  *   **Theory:** The obligation is entirely about the promisor's moral character, not the promisee's rights.
  *   **Fit:** Explains Lying (you corrupted your character), Dead Friend (your integrity remains), Airport (you remain trustworthy).
  *   **Tension:** Struggles with the "Joke" case. If it's about *my* integrity, why does it matter if *you* thought I was joking?

  ### 4. The Dinner Test Case

  To figure out which rule is really driving her (Conventionalism vs. Reliance vs. Integrity), bring up **The Comatose Spouse Case.**

  **The Scenario:**
  > "Imagine I promise my spouse I will read to them every night. The next day, they fall into a permanent coma. They can't hear me, they can't understand me, and they can never rely on me again. Do I still have to read to them every night?"

  **Why this works:**
  *   **If she says YES (Binds):** She is a **Personal Integrity Absolutist**. The obligation is about *your* word, regardless of whether it lands on any ears. This implies your **Vaping Promise** (Promise to Self) might actually bind in her eyes, because the listener's capacity doesn't matter.
  *   **If she says NO (Does Not Bind):** She is a **Reliance/Expectation Theorist**. The obligation exists only because the other person expects it. This creates a conflict with her **Dead Friend** ruling (unless she argues the dead friend's *memory* relies on it).
  *   **If she says "It Depends on if they heard it before the coma":** She is a **True Conventionalist** (like the analysis in Section 2). The contract was validly formed *before* the incapacity, so it holds (like the dead friend).

  **Follow-up Question:**
  If she says the Comatose Case **Binds**, immediately hit her with the **Vaping Promise**:
  > "So if the listener doesn't matter, does a promise spoken out loud to an empty room bind you? Because I told no one I'd quit vaping, but I said the words."

  *   If she says **Yes**: She believes in the Magic of Words (Radical Formalism).
  *   If she says **No**: She admits a promise requires a *social other*, which undermines the idea that "words alone bind you."

  **Recommendation:** Start with the **Comatose Spouse**. It cleanly separates "Duty to Self/Integrity" from "Duty to Other/Reliance," which is the fault line in all her previous rulings.
