answer: |-
  This is a fascinating counterfactual. To reconstruct Carnap's reaction, we have to resist the temptation to treat him as a subjective Bayesian *manqué*. Carnap's project was fundamentally different from the Ramsey-de Finetti-Savage tradition that Glymour was critiquing. Carnap was building a **logical** theory of probability ($probability_1$), not a psychological or decision-theoretic one.

  If Carnap had lived to 1985 and read Glymour, I believe he would have reacted with a mixture of polite bewilderment and firm clarification. He would not have seen the Problem of Old Evidence (POE) as a crisis for his system, but rather as a category mistake arising from confusing the **logic of justification** with the **psychology of discovery**.

  Here is my reconstruction of his position, followed by an assessment of its vulnerabilities.

  ### The Carnapian Reconstruction: "The Timelessness of Logical Relations"

  Carnap would likely argue that the POE only arises if you conflate the *epistemic state of the scientist* with the *logical relation between sentences*.

  **1. Confirmation is Synchronic, Not Diachronic**
  For Carnap, the confirmation function $c(H, E)$ represents a logical relation (like entailment, but partial) between a hypothesis and a body of evidence. Logical relations do not have timestamps. The statement "The total evidence $E$ confirms hypothesis $H$ to degree $r$" is timelessly true, provided $E$ and $H$ are formulated within the same linguistic framework.

  When Einstein formulated General Relativity (GR), the statement $c(GR, E_{total})$ became true, where $E_{total}$ included the perihelion of Mercury. The fact that astronomers knew about Mercury's perihelion in 1850 is irrelevant to the *logical* relation. The relation existed (in the sense of logical possibility) as soon as the sentences were meaningful.

  **2. The "Newness" is in the Insight, Not the Evidence**
  Carnap would bite the bullet that **logical confirmation does not update.** If $E$ is part of the total evidence, it is part of the total evidence. You don't conditionalize on it again.

  So, what happened in 1915? Carnap would say Einstein did not *change* the confirmation relation; he *discovered* it. Prior to 1915, scientists could not see that $GR \rightarrow E_{Mercury}$. They were logically non-omniscient. The "confirmation event" was not a Bayesian update on $E$ (which was already known), but a shift in the scientist's *psychological degree of belief* to align with the objective logical relation $c(GR, E)$.

  **3. Rejecting the Subjective $P(E) = 1$ Constraint**
  Carnap would point out that the POE is particularly acute for subjective Bayesians because they tie confirmation to *changes in belief* via conditionalization. If you already believe $E$ with certainty, you can't update on it.

  But for Carnap, $E$ isn't assigned a subjective probability of 1; rather, $E$ is a **premise** in the confirmation function. The question isn't "Does learning $E$ raise the probability of $H$?" (which implies $E$ was unknown). The question is "Given that $E$ is our total evidence, how probable is $H$?" Since $E$ is *always* the total evidence in a proper rational reconstruction, the "oldness" of $E$ drops out. The confirmation is always relative to what we know *now*.

  **4. Addressing Your Friend's Claim**
  Your friend is half-right. Carnap did distinguish between incremental confirmation (relevance) and absolute confirmation (firmness). However, Carnap wouldn't say the Mercury case is *just* about discovering entailment. He would say it is about recognizing that $GR$ fits into the inductive logic of the total evidence better than Newtonian mechanics did.

  He would likely say: *"The problem of old evidence is an artifact of trying to model the history of science (a psychological process) using a logic of science (a static relation). We should not demand that the logic of confirmation mirror the temporal sequence of discovery."*

  ### The Vulnerabilities: Where Carnap Would Stumble

  While this response is faithful to Carnap's temperament (calm, distinction-heavy, prioritizing logic over history), I think it leaves his system vulnerable in three specific ways that Glymour and later philosophers correctly identified.

  **1. The Problem of New Concepts (Language Dependence)**
  This is the biggest hole. Carnap's confirmation functions are defined relative to a specific linguistic framework ($L$). The predicates and logical structure must be fixed to calculate $c(H, E)$.
  *   **The Issue:** General Relativity didn't just add a new hypothesis to the old language; it introduced new concepts (curved spacetime, metric tensors) that didn't exist in the Newtonian linguistic framework.
  *   **The Vulnerability:** If the language changes, the confirmation function $c$ changes. There is no neutral $c$-function to compare Newton and Einstein. Carnap's system struggles to account for **conceptual innovation**. If the "total evidence" includes statements formulated in a new language that didn't exist when the evidence was first observed, how do we construct the logical relation? Carnap's static logic has no mechanism for language evolution. He would have to admit that $c(GR, E_{Mercury})$ and $c(Newton, E_{Mercury})$ are calculated in different logical systems, making the comparison less "objective" than he claimed.

  **2. Irrelevance to Scientific Practice (The "Guide" Problem)**
  Carnap wanted inductive logic to be a guide for scientific inquiry (a "inductive engine").
  *   **The Issue:** If confirmation is timeless and static, it cannot guide inquiry. It can only rationalize it post-hoc. If the logical relation $c(H, E)$ was always there, why did we need to wait for Einstein?
  *   **The Vulnerability:** By relegating the "discovery" to psychology, Carnap surrenders the most interesting part of science to the realm of the irrational (or at least, the non-logical). A theory of confirmation that cannot explain why we value *novel predictions* over *accommodations of old data* (even if logically they should be equivalent) fails to capture a key norm of scientific practice. Scientists *do* treat novel predictions as more confirmatory than accommodations of old data (the "predictivism" thesis). Carnap's system says they shouldn't. If his logic contradicts robust scientific intuition, the logic looks like a Procrustean bed.

  **3. The "Tacking" Paradox and Ad Hoc Hypotheses**
  If confirmation is just a logical relation between $H$ and total evidence $E$, and $E$ is fixed:
  *   **The Issue:** Any hypothesis $H$ that entails $E$ gets confirmed. If I construct a wildly ad hoc theory *just* to fit the known perihelion of Mercury, Carnap's logic might assign it high confirmation relative to $E$, provided the logical structure allows it.
  *   **The Vulnerability:** Subjective Bayesians solve this with priors (ad hoc theories get low priors). Carnap rejects subjective priors. He relies on "structure descriptions" or "state descriptions" to generate objective priors. But these are notoriously rigid. It is very hard to construct a Carnapian $c$-function that penalizes ad hoc complexity in the way scientists do. Without a dynamic updating mechanism to penalize theories that were *designed* to fit old evidence (as opposed to predicting it), his system risks confirming gerrymandered hypotheses just as much as deep explanatory ones.

  ### Conclusion

  If Carnap had faced Glymour, he would have stood his ground: **"The Problem of Old Evidence is not a problem for logic, only for psychology."** He would have argued that the confirmation of GR by Mercury was always logically valid; the 1915 event was merely human beings catching up to the logic.

  However, this victory would be pyrrhic. By insulating his logic from the temporal dynamics of science, he would have rendered his system incapable of handling **conceptual change** (new vocabularies) and **methodological norms** (the value of prediction over accommodation). He would have saved the "objectivity" of confirmation at the cost of making it irrelevant to the actual history and practice of scientific theory choice.

  In short: Carnap would have solved the *logical* paradox by denying its premise, but in doing so, he would have conceded that his inductive logic cannot fully reconstruct the rationality of scientific progress.
