  A friend of mine who took one ethics course summarized the "wrong kind of reasons" problem for me like this: "D'Arms and Jacobson basically proved consequentialism is false. If a demon will torment you unless you desire that your children fail, you have an overwhelming reason to want that. But it's obviously the wrong kind of reason — it doesn't make the desire rational, or your children failing a good thing. The consequentialist has to say the desire is rational anyway, since having it gets you more satisfaction, which is absurd. So they concluded that whether an attitude is rational never depends on anything you want." I feel like the last sentence overshoots, and I half-remember the blackmail/demon style cases being about belief rather than desire. Is this a fair summary? Tell me which parts he got right, what's subtly wrong, and whether his conclusion survives once you fix the errors. Keep it to one paragraph, no more than 200 words.
