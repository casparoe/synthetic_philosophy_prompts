answer: |-
  *   **The Aesthetic Excuse:** Artistic truth supersedes biographical fact; the drama's insight justifies the lie.
  *   **The Meta-Commentary:** The falsification is the subject; the work is about how memory corrupts, not just what it records.
  *   **The Immortality Trade:** Salieri gains his wish (remembrance) through infamy; posthumous benefit and harm are inseparable.
  *   **The Complicit Audience:** The confessional frame implicates the viewer in keeping the legend alive, shifting ethical burden.
  *   **The Distinction Collapse:** The accusation (murder) is the necessary mechanism for the appropriation (martyrdom); they cannot be untangled.
  *   **Oblivion vs. Distortion:** The work suggests the only true posthumous harm is being forgotten; distortion is the price of survival.

  ***

  **The Price of Memory: Ethics and Falsification in *Amadeus***

  *Amadeus* does not ask for forgiveness regarding its historical falsifications; rather, it posits that falsification is the inevitable cost of posthumous survival. The work's ethical position is that the dead do not own their memories once they enter the cultural bloodstream. By framing the narrative as Salieri's confession to the "spirits of the future," Shaffer and Forman acknowledge the slander while arguing that the "truth" of Mozart's genius requires the myth of his martyrdom. The work does not claim the lie is harmless, but that it is necessary to sustain the intensity of Mozart's presence in the modern imagination. To sanitize Mozart would be to diminish the tragic gravity of his loss; thus, the work accepts the ethical burden of slander as the tuition for immortality.

  Your distinction between accusative falsification (lying about deeds) and appropriative falsification (conscripting a person into another's meaning) is a vital heuristic, yet *Amadeus* demonstrates where this boundary dissolves. Initially, the distinction holds: Salieri's claim of poison is accusative, while his portrayal of Mozart as a vulgar child-instrument of God is appropriative. However, the text reveals that the accusation is the engine of the appropriation. Salieri cannot establish Mozart as the "martyr of grace" without becoming the murderer. The lie about the deed (accusative) is required to secure the meaning of the life (appropriative). If Salieri merely neglected Mozart, Mozart remains a tragic figure of poverty; if Salieri kills him, Mozart becomes a sacrificial lamb in Salieri's war against God. The categories bleed because the moral injury of the accusation is what grants the appropriator the power to define the victim's legacy. The distinction fails to account for cases where the lie about action is the prerequisite for the theft of meaning.

  This leads to the knotted problem of posthumous benefit and harm. Salieri explicitly craves remembrance, and the legend grants it, yet the currency is infamy. Does this payment settle the debt? In standard accounts of posthumous harm, we assume the dead have an interest in reputational purity. *Amadeus* challenges this by suggesting the dead have a stronger interest in *presence*. Salieri prefers to be remembered as a villain than forgotten as a mediocrity. Here, the frame device—Salieri addressing posterity directly—does not excuse the wrong (which would imply no wrong was committed), nor does it merely mitigate it (acknowledging the wrong but citing competing values). Instead, the frame aggravates the ethical violation. By breaking the fourth wall, the work implicates the audience as co-conspirators. Salieri says, in effect, "I know this is a lie, and I know you know, but you will keep me alive anyway." This awareness transforms the falsification from a careless error into a calculated transaction between the dead narrator and the living viewer. It aggravates the wrong because it removes the defense of ignorance; we are invited to enjoy the slander knowingly.

  The difference between the 1979 play and the 1984 film sharpens this ethical tension. The play is verbal and confessional, centering Salieri's voice; the harm feels primarily accusative, focused on his testimony. The film, however, is visual. Forman's camera lingers on Mozart's vulnerability and childishness, deepening the appropriative harm. We do not just hear about Mozart's reduction; we see him infantilized. Yet the film also grants Mozart a sensory vitality that the play cannot match. In this sense, the film pays the debt of appropriation with the currency of vividness, restoring some agency through performance even as the script denies it.

  Philosophically, *Amadeus* contributes a uncomfortable proposition to the debate on posthumous harm: that distortion may be a condition of memory itself. Standard ethics assumes we can honor the dead by preserving them accurately. *Amadeus* suggests that accurate preservation often leads to oblivion, while violent distortion ensures survival. The work adds the concept of "necessary violation" to the discourse. It argues that to keep the dead relevant, we must remake them in our image, which is inherently a form of appropriation. If the work adds nothing new to the definition of harm, it persists in our intuition because it dramatizes the guilt of the living. We feel the wrong because we recognize our own participation in myth-making. We want the genius of Mozart without the boredom of history, and *Amadeus* forces us to admit that this desire is predatory. The work does not resolve the ethics of memory; it stages the crime so vividly that we cannot claim innocence while enjoying the performance.
