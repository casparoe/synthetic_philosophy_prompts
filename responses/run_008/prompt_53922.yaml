      *   *The Cost:* The cost is that you *must* be willing to destroy the world if the trigger is pulled. You cannot be "cool-headed" at the moment of truth. You must have surrendered your cool-headedness in advance. This partially validates (6) but reframes it: It's not that leaders must be *emotionally* irrational, but that they must be *procedurally* bound.

