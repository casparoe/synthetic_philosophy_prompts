answer: |-
  ### The rules that fit her

  **1. The Market Baseline:** In exchanges of standard commercial goods or services where no prior relationship exists, justice is achieved by adhering to the prevailing market rate, rendering the labor effort required to produce the goods irrelevant. This explains Rulings 1 and 2, where market prices dictated fairness despite disparities in work hours or the nature of the goods.

  **2. The Specific Equivalence Exception:** In exchanges involving unique personal property or established standing partnerships, justice is determined by the specific mutual desire of the traders or fidelity to a prior agreement, overriding the current spot market price. This explains Ruling 3 (unique desire overrides market value) and Ruling 4 (prior contract overrides spring market surge).

  ### What they predict

  **The Market Baseline** implies the generator sale is **unfair**. The generator is a standard commercial good, and there is no prior relationship between the dealer and the family. Since the dealer is charging ten times his cost and more than any other regional dealer, he has violated the prevailing market rate that establishes commensurability for such goods.

  **The Specific Equivalence Exception** implies the generator sale is **fair**. The family explicitly consented to the price and stated afterward that they valued the generator even more than the cost ("gladly have paid double"). If the parties' own assessment of value overrides market price in the piano trade, their assessment should override it here too.

  ### My call

  Dara will rule the sale **unfair**. While the family's consent mirrors Ruling 3, the generator is a standard necessity, not a unique luxury like a piano or record collection. Aristotle distinguishes between exchange for mutual advantage and the exploitation of necessity; money is meant to measure need, not to profit from desperation. Dara's previous rulings respect market stability (Ruling 1 & 2) and fidelity (Ruling 4), but nowhere does she endorse profiting from acute vulnerability when a market standard exists. This rule is **Aristotle's**, not Dara's invention; she has intuitively grasped his distinction between *reciprocity* (which requires proportionality) and mere *voluntary transfer* (which can be exploitative). The "consent" of the desperate is not true reciprocity in the Nicomachean sense.

  ### The trade that would settle it

  A tourist with a broken-down car in a remote town agrees to pay a local mechanic five times the standard shop rate for a repair, explicitly saying, "I know it's high, but I need to get home." There is no prior relationship, and the service is standard.

  *   **The Market Baseline** would rule this **unfair**, because the service is standard and the price violates the prevailing rate, regardless of the tourist's willingness to pay.
  *   **The Specific Equivalence Exception** would rule this **fair**, because the parties mutually agreed on the value based on the tourist's specific need, mirroring the subjective valuation in the piano trade.
