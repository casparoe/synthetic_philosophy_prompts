prompt: |-
  I'm defending my dissertation next month. Core claim: split-brain patients remain a single subject of experience — the commisurotomy disrupts report and voluntary motor control, not consciousness itself. My argument sketch: the cross-cuing and diagonal reaching literature shows patients can act as one agent in ecologically normal settings, shared subcortical and affective processing persists after the cut, and the classic "two minds" experiments mostly demonstrate two response channels rather than two experiencers. The committee is mostly analytic philosophers of mind, plus one neuropsychologist who's actually worked with commissurotomy patients and is famous for thinking the two-minds view is just obviously correct, and a Kantian who keeps asking whether anything could ever count against my position. Draft my Q&A prep sheet: the objections in roughly the order they'll come, phrased the way each of those people would actually put them, with a two-minute reply to each and a note on where the reply is softest. Include the question I'm hoping nobody asks — you know the one, about what single-subject experience even predicts that two-streams-plus-integration doesn't. And please actually take a side on whether my thesis survives the neuropsychologist or whether I should concede partial disunity up front — I don't want a menu of options, I want your call and the reasoning behind it.
