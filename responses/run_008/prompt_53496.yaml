answer: |-
  ### Strategic Call: Concede Partial Disunity Up Front

  **Do not defend "Strict Unity."** Your thesis survives only if you reframe it immediately. The Neuropsychologist holds the empirical high ground on behavior and report. If you insist that commissurotomy leaves *agency* and *access* fully unified, you will be empirically falsified in the room, and you will lose credibility with the entire committee.

  **The Move:** Concede that *functional unity* (report, voluntary motor control, access consciousness) is disrupted. Hold firm only on *phenomenal unity* (the subject of experience).
  **Reasoning:** This disarms the Neuropsychologist (you agree with their data) while preserving your philosophical contribution (the distinction between functional fragmentation and the ontological status of the subject). If you fight the behavioral data, you look like an armchair philosopher ignoring science. If you accept the data but reinterpret its metaphysical implication, you look like a sophisticated philosopher of neuroscience.

  ***

  ### Q&A Prep Sheet

  #### 1. The Neuropsychologist (The Empirical Objection)
  **The Question:** "I've sat across the table from these patients. I've seen the left hand undo what the right hand just buttoned. I've seen them guess with the left hand what the right hand just named, with genuine surprise. You're telling me this is one mind? That seems like you're redefining 'mind' to save a theory. How do you explain inter-manual conflict without positing two agents?"

  **The Reply (2 mins):**
  "I agree with your data completely, and I want to be clear: I am not denying the inter-manual conflict or the surprise. My claim is not that the *brain* functions as one unit post-commissurotomy—it clearly doesn't. My claim is about the *subject of experience*, not the subject of control.

  When the left hand unbuttons the shirt, I argue this isn't evidence of a second *person* inside. It's evidence of a fragmented *access* system within a single phenomenal field. Think of it like severe akrasia or alien hand syndrome in non-split patients. We don't posit a second soul when a Tourette's patient acts against their will; we posit a disruption in the motor hierarchy.

  By conceding that *access* and *agency* are divided, I align with your observations. But I'm arguing that the *experience* of that conflict—the frustration, the confusion—is still happening to a single 'I'. If there were truly two minds, we wouldn't see the cross-cuing and the ecological integration we see in normal settings. We'd see two distinct agents fighting for control constantly. Instead, we see one agent struggling with a disconnected tool. I'm preserving the unity of the *experiencer* while accepting the disunity of the *executor*."

  **Softest Point:** You are relying on an analogy (Tourette's/Akrasia) that might not hold up under scrutiny. If the left hand can solve puzzles the right hand doesn't know about, is that really just "motor disruption"?

  #### 2. The Kantian (The Transcendental Objection)
  **The Question:** "You speak of a 'single subject of experience.' But for Kant, the 'I think' must be able to accompany all my representations. If the left hemisphere has representations the right cannot access, and vice versa, how can the 'I think' accompany *both*? If you claim it does, aren't you making a metaphysical assertion that is immune to empirical falsification? What could possibly count against your unity claim?"

  **The Reply (2 mins):**
  "That is the central tension of the project. I am not claiming the 'I think' accompanies every representation *simultaneously* in a fully integrated way. I am claiming there is a single *locus* of ownership, even if access to that locus is gated.

  To answer your falsification challenge: If we found evidence that the two hemispheres had distinct, incommensurable *qualia*—for example, if the left saw red and the right saw green in the same visual field and reported distinct, non-overlapping emotional reactions that could never be reconciled even subcortically—that would count against me.

  However, my argument is that the subcortical integration *prevents* this total split. The 'I' is not the sum of the data access; it's the unified field of feeling. If the patient feels frustration about the conflict, that frustration is singular. A dual-subject view struggles to explain who feels the frustration of the conflict itself. If there are two minds, Mind A shouldn't care about Mind B's motor errors. But the patients do care. That shared affective burden is my evidence for a single transcendental subject, even if empirical access is divided."

  **Softest Point:** The claim that "shared affect" proves a "single subject" is vulnerable. Two distinct subjects could theoretically share a subcortical affective pool without being one "I."

  #### 3. The Analytic Philosophers (The Criteria Objection)
  **The Question:** "You're drawing a distinction between phenomenal unity and access unity. But what are the truth conditions for 'single subject'? If behavior is divided, report is divided, and neural integration is severed, what work is the 'single subject' doing? Is it just a placeholder? If two streams function independently, why posit one subject rather than two subjects with a shared subcortical bridge?"

  **The Reply (2 mins):**
  "It's not a placeholder; it's a claim about parsimony and the nature of conflict. The 'two minds' view multiplies entities without necessity. It posits two *experiencers* to explain two *output channels*.

  My view predicts that the conflict is *intra*-personal, not *inter*-personal. When a split-brain patient hesitates, it should look like indecision, not like negotiation. The literature suggests the former. The 'two streams plus integration' model you suggest effectively concedes my point: if there is integration sufficient to bind the streams into a coherent ecological agent, then the 'two subjects' label is doing no work.

  The work my 'single subject' claim does is locate the pathology. It says the damage is to the *broadcasting mechanism*, not the *receiver*. If I damage your speaker system, you don't become two people; you just can't express yourself in stereo. I'm arguing the corpus callosum is the speaker system, not the listener."

  **Softest Point:** The analogy of the "speaker system" is weak. The corpus callosum transfers *information*, not just output. If the right hand doesn't know what the left saw, the "listener" (consciousness) seems to have been split.

  #### 4. The Question You Hope Nobody Asks (The Prediction Question)
  **The Question:** "Okay, let's grant your distinction between phenomenal and access unity. But what does 'single-subject experience' actually *predict* that 'two-streams-plus-integration' doesn't? If the behavioral outputs are identical in both models, aren't you just arguing semantics? What is the empirical cash value of your ontological claim?"

  **The Reply (2 mins):**
  "The empirical cash value lies in the *resolution* of conflict and the *nature* of learning. The 'two minds' model predicts that learning should be strictly hemispheric—what the left learns, the right shouldn't benefit from, except via slow subcortical osmosis.

  My 'single subject' model predicts that because there is one experiencer, there should be faster, more robust generalization when tasks are framed ecologically rather than laterally. We see this in the cross-cuing literature: patients develop strategies to unify information that a 'two minds' system shouldn't bother coordinating.

  More importantly, it predicts the *phenomenology of report*. If I ask the patient, 'Did you feel confused?', a two-minds view expects two answers or a dominant one suppressing the other. A single-subject view expects one answer that reflects a unified, albeit confused, state. The fact that patients report a singular narrative of their life, post-surgery, despite the disconnection, is the prediction. They don't report 'we'; they report 'I'. That linguistic data is the empirical cash value."

  **Softest Point:** Patients reporting "I" is linguistic convention, not proof of ontology. A dual-subject system could easily adopt the singular pronoun for social convenience. This is your weakest empirical link.

  ***

  ### Final Advice for the Defense
  When the Neuropsychologist speaks, **nod**. Validate their expertise. Say, "Your work on [Specific Study] is exactly why I distinguish access from phenomenology." Do not fight them on the *what*; fight them on the *so what*. You are not correcting their science; you are interpreting its metaphysical limits. Good luck.
