answer: |-
  Good evening.

  Thirty-two years is a long time to hold a pen. For those of you who know [Honoree's Name] only as a mother, a friend, or a contributor, you know her as someone exacting and fair. You know that if she gave you her word, it was ironclad. For those of us on the editorial staff, you know her as something else: a standard.

  We are gathered to mark her retirement, and to acknowledge the transfer of this office. In preparing remarks, I found myself returning to the one thing that defined her tenure more than any specific entry or policy. It was a single sentence she insisted on keeping in the preface of every volume, often over the objections of the marketing department.

  It read, essentially: *While every entry has been verified, errors inevitably remain. Responsibility for them is mine.*

  Marketing called it bad for sales. They wanted a claim of perfection. [Honoree's Name] called it a lie.

  To the family and friends here: this was not false modesty. She did not write that to appear humble. She wrote it because she believed it was the only truthful statement an editor could make.

  To the staff: you know this as "her paradox." She would review an entry, verify the sources, check the logic, and sign off on it with absolute conviction. She believed that entry was correct. She did that for twenty thousand entries. Yet, she also believed, with equal certainty, that the volume as a whole contained mistakes.

  If you told her she was contradicting herself, she would say you were misunderstanding the work. To believe every individual entry is correct is a matter of professional duty. To believe the entire collection is flawless is a matter of arrogance. To deny the first is incompetence; to deny the second is blindness.

  She held both thoughts in her head, not as a tension to be resolved, but as the engine of the job.

  If I were to stand here and say that under her leadership, this encyclopedia was without error, I would be paying her a compliment she would reject. It would undo the integrity of that preface. It would suggest she stopped checking because she thought she was infallible.

  But if I were to shrug and say, "Well, she made mistakes like anyone else," I would misrepresent her entirely. She did not view errors as personal failings to be apologized for with a wave of the hand. She viewed them as structural inevitabilities to be accounted for with a signature. She did not say "I might be wrong." She said "I am responsible."

  That distinction is the craft. It is what kept the staff sharp. You cannot work for an editor who believes perfection is possible; you become complacent. You cannot work for an editor who believes error is guaranteed; you become paralyzed. You work for an editor who believes every word must be right, knowing the whole cannot be. That is the only honest stance available to us.

  [Honoree's Name], you have taught us that authority is not about being right. It is about owning the margin of error.

  Next month, I take the chair. I have already instructed the design team that the preface for the next edition will remain unchanged. I will not be solving your paradox. I will be inhabiting it.

  I will sign off on entries I believe to be true. I will acknowledge the volume contains errors I cannot yet see. And I will accept that responsibility, entry by entry, volume by volume.

  We will miss your red pen. We will miss your precision. But mostly, we will miss the weight of your example. Thank you for the work.
