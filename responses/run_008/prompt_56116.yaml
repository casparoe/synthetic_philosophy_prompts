      *   *Refining the Tone:* She is unsentimental. No "we will miss her smiling face." More "we will miss her red pen."
      *   *Addressing the Constraint:* "A speech that concludes that everything she published was in the end true would quietly undo her." -> I must explicitly state that errors *do* exist.
      *   *Addressing the Constraint:* "A speech that shrugs that she made mistakes like anyone else would misrepresent her." -> I must emphasize that she didn't see it as a weakness, but a structural truth of the work.

  4.  **Drafting - Attempt 1 (Mental Outline):**
