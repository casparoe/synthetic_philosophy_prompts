      *   Step (3) is technically true (activations differ), but Step (4) is a non-sequitur because it assumes mechanism identity requires activation identity.
      *   Step (2) is the weak link: "Same components do the *same* causal work." What does "same" mean here? If it means "numerically identical activation values," then yes, it fails. If it means "functionally equivalent causal role within a computational graph," it holds.

  3.  **Identify the Core Philosophical/Technical Issue:**
      *   **Type vs. Token:** The friend is insisting on token identity (this specific activation vector) while MAD relies on type identity (this specific *subgraph* or *feature circuit* being active).
      *   **Abstraction Levels:** Neural networks operate at multiple levels. Weights are fixed. Activations vary. But *circuits* (subgraphs of features) can be stable across inputs.
      *   **Causal Abstraction:** The field of Causal Abstraction (Geiger et al.) provides the formal toolkit to answer "what fixes the typing?"
      *   **Robustness/Invariance:** A mechanism is defined by *invariance* to certain perturbations. If I change the input slightly, the mechanism should remain the "same" if the *computation* remains the same, even if activations shift slightly.

