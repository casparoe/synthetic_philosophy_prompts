answer: |-
  **MEMORANDUM**

  **TO:** Standards Committee
  **FROM:** Chair, Standards Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Editorial Policy Regarding Racial Slurs in Public Records

  **Purpose**

  This memo serves as a formal recommendation to resolve the committee's deadlock regarding the usage of racial slurs in editorial content, specifically triggered by the recent county planning board incident. Our current style guide is insufficient for the digital landscape. We require a policy that balances fidelity to the public record with our duty to minimize harm to our readers and staff. After evaluating the existing proposals and considering the specific constraints of our multi-platform distribution, I recommend adopting a Tiered Context Policy.

  **Evaluation of Current Positions**

  We have considered three primary positions. The Standards Editor argues for verbatim usage in the body text to preserve historical accuracy and avoid sanitizing the offense. The Features Editor argues for paraphrase to prevent our publication from acting as a vector for the slur's circulation. A third proposal suggests asterisking the word as a compromise.

  We must also weigh the objection raised regarding asterisking: that it is not a neutral middle path. By obscuring only certain letters, we oblige the reader to cognitively complete the word. This shifts the burden of performance from the writer to the reader, forcing them to enact the slur privately to understand the text. This psychological burden is significant and suggests asterisking may combine the harms of both verbatim and paraphrase approaches without securing the benefits of either.

  Furthermore, we must address the use/mention distinction. Philosophically, quoting a slur (mentioning it) is distinct from wielding it as an insult (using it). However, in practice, the capacity of a slur to wound resides not solely in its literal content or intent, but in its social force. Reprinting the word, even in quotation marks, reanimates that force. It risks traumatizing readers who are the target of the slur and exposes our staff to harm during the editing process. Therefore, the argument that quotation fully neutralizes the word's toxicity is insufficient. Truth-telling does not require replication.

  **The Tiered Context Recommendation**

  I propose we reject a monolithic rule in favor of a policy that distinguishes between *editorial narrative* and *archival evidence*.

  **1. Editorial Narrative (Headlines, Body Text, Newsletters)**
  In all editorial writing constructed by our staff, the slur must not be printed verbatim. We will use descriptive phrasing (e.g., "the member used a racial slur for Black Americans"). This applies strictly to headlines, subheads, and body copy.

  **2. Push Notifications and Subject Lines**
  The slur is strictly prohibited in any push notification, email subject line, or social media preview text. These channels are intrusive; readers cannot choose whether to encounter the content before clicking. The risk of unintended exposure outweighs any journalistic benefit.

  **3. Archival Evidence (Transcripts and Captions)**
  Where we publish a direct transcript of audio or video evidence, or closed captions for an unedited clip, the text must match the audio verbatim. If the speaker says the word, the caption must reflect the word. This preserves the integrity of the record without amplifying the word through our editorial voice.

  **Addressing Operational Inconsistencies**

  Two specific wrinkles threaten the viability of any policy we adopt: the embedded video clip and our newsletter distribution.

  Regarding the video clip: We have confirmed the audio will remain unbleeped to document the severity of the incident. If we paraphrase in the text but print the word in the captions, critics may cry hypocrisy. However, this is not inconsistency; it is categorization. The body text is our report *on* the event; the captions are a transcript *of* the event. By labeling the video clearly as "unedited footage," we signal to the reader that the transcript is an evidentiary record, not an editorial endorsement. This allows us to maintain accuracy without becoming a vector for the word in our narrative voice.

  Regarding newsletters: The push notification constraint is non-negotiable. A reader scrolling through a lock screen should never encounter a racial slur from our publication. The Tiered Policy solves this by mandating paraphrase in all subject lines and preview text, regardless of the content within the linked article. This protects the reader's autonomy and prevents algorithmic flagging that could suppress our distribution.

  **Rationale for Adoption**

  This recommendation wins because it separates the *fact* of the slur from the *repetition* of the slur. The Standards Editor is correct that we must not soften what happened; the unbleeped video and verbatim captions ensure the public record remains intact. However, the Features Editor is correct that our editorial voice should not circulate the word unnecessarily.

  By restricting verbatim usage to archival transcripts, we acknowledge that the word exists in the world without granting it privilege in our journalism. We report the harm without inflicting it anew upon those who encounter our text in passing. This approach respects the use/mention distinction in theory while acknowledging its limits in practice. It recognizes that while we cannot erase the planning board member's words, we can choose not to make them our own.

  **Action Item**

  I move that the committee adopt the Tiered Context Policy as outlined above. This provides desk editors with clear, actionable guidance: paraphrase in narrative, verbatim only in direct transcripts/captions, and never in push notifications. This policy updates our decades-old guidance to fit the realities of digital consumption while upholding our commitment to truth and community care.

  I request a vote on this recommendation at the next meeting.
