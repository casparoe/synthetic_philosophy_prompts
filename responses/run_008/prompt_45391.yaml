      *   *What cannot be reproduced?* Yes, internal sanctions.

      *(Self-Correction on Moore Round)*: Forcing a student to say "P but I don't know P" might just result in giggles. I need to make sure the *pedagogical point* lands. I will frame it as a "Contractual Obligation" round where they are paid to assert things they lack evidence for, to see if the *Hearer* rejects it. That shifts the burden to the norm of acceptance, which is linked to assertion. Actually, better: Have the Speaker assert, and the Hearer penalize if the Speaker admits ignorance. This simulates the social sanction.

