      *   *What Cannot Be Reproduced:*
          *   Internal Sanctions (Blame/Criticism vs. Point Loss).
          *   The game has external penalties. Real life has internal social/epistemic blame.
          *   *Bridge:* Ask students "Did you lose points, or did you feel *wrong*?"

  5.  **Refining the Plan (Self-Correction during drafting):**
      *   *Critique:* 75 minutes is tight for 3 rounds + debrief with 22 students.
