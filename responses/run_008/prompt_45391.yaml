      *   *The Lottery Case:* Needs to happen in a round where Truth is rewarded but Knowledge is required. If I hold 19 losing tickets out of 20, I *believe* it will lose, it *will* lose (probably), but I don't *know* it. This creates tension.
      *   *The Moore Case:* Needs a round where students are forced to assert something they can't verify but are told is true, or where they assert without belief. Actually, the prompt asks for "P is true, but I have no idea." This is hard to force. Better: Force a situation where they *have* the truth but lack the epistemic status, and see if they feel comfortable asserting. Or, have a round where they must assert based *only* on belief, leading to Moore-like awkwardness if challenged.
      *   *Payoff:* Points system. Class-wide leaderboard or small group scores? Small groups (pairs/trios) work best for engagement. 22 students = 11 pairs.
