      *Better:* Speaker is told the color by the TA (Testimony). Speaker must assert to Hearer. Hearer asks "How do you know?" Speaker must say "TA told me." Hearer decides if that counts as Knowledge.
      *Best for Moore:* In the final debrief, I will ask a volunteer to assert "The card is Red, but I don't know it" after a round where they saw the card. The *refusal* to say it is the data point.
