          *   *Theory Link:* Truth Rule (Assert P only if P is true).
      *   *Round 2 (The Knowledge Regime):* Goal: Maximize points. Penalty for False Assertions *AND* Penalty for "Unwarranted" Assertions (even if true).
          *   *Scenario:* Same Lottery. Speaker holds 19. Asserts "This is a loser."
          *   *Twist:* Hearer can challenge "How do you know?" If Speaker says "Just odds," they lose points even if right.
          *   *Outcome:* Students feel the "shame" or risk of asserting without seeing the card.
          *   *Theory Link:* Knowledge Rule (Assert P only if you Know P).
      *   *Round 3 (The Belief/Insincerity Regime):* Goal: Maximize points. Penalty for asserting what you don't believe.
          *   *Scenario:* Card draw. Speaker sees card. Must assert color.
          *   *Twist:* Speaker is forced to assert against their evidence sometimes? No, that's lying. Let's make it about *Moore*. Speaker sees Red card. Must say "This is Red, but I don't know it."
          *   *Correction:* The prompt asks for a round that tempts a Moore-style assertion. Let's make a round where the *rules* allow assertion on mere belief, but the *social pressure* makes "I believe P, but P might be false" feel weird.
