          *   Lucky guessers.
          *   Forgetting rules.
          *   External vs. Internal sanctions.

  4.  **Fleshing out the Details (Writing the Content):**

      *   *Materials:* Deck of cards (remove jokers), printed "Lottery Tickets" (slips of paper, 1 marked 'WIN'), Score sheets.
      *   *Payoff:* Points. 100 base. +10 for successful coordination, -20 for violation.
      *   *The "Moore" Round:* I need to engineer this carefully. If I tell a student "The card is Red," and they say "The card is Red," that's testimony. If I tell them "Say: The card is Red, but I don't know it," they will laugh.
      *   *Alternative:* In Round 3, give the Speaker a card face down. Tell them "I (the TA) know this card is Red. You don't. Assert that it is Red." They will hesitate. This creates the Moore-like tension.
      *   *Wait, the prompt asks for the students to assert "such-and-such is true, but I have no idea whether it is."* Okay, I will force the script for one trial. It will feel absurd. That's the point.

      *   *Debrief Mapping:*
          *   Round 1 (Lottery) -> Truth Rule (It was true, so why did it feel risky in Round 2?).
