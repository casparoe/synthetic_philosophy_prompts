answer: |-
  # Activity Plan: The Assertion Game
  **Course:** Upper-Level Epistemology  
  **Topic:** Norms of Assertion (Knowledge vs. Truth vs. Belief)  
  **Time:** 75 Minutes  
  **Class Size:** 22 Students (11 Pairs)  
  **Materials:** 1 Deck of Cards (Jokers removed), 22 slips of paper ("Lottery Tickets"), Whiteboard, Markers, Score Sheets (half-sheets of paper).

  ## I. Preparation & Setup (0:00–0:10)
  **Goal:** Establish the stakes and mechanics without revealing the theoretical point.

  1.  **Grouping:** Divide the class into 11 pairs. Designate one student in each pair as **Speaker A** and the other as **Hearer B**. (They will swap roles in later rounds).
  2.  **Currency:** Explain that this is a **Point Game**. Points are not money; they are "Epistemic Credit." The goal is to end the section with the highest positive score.
      *   **Base Score:** Everyone starts at 0.
      *   **Winning:** Pairs with >50 points get "A-credit" (participation credit). Pairs with <0 points must write a 1-page reflection on "Why I Failed." (This creates low-stakes anxiety).
  3.  **The Core Mechanic:**
      *   The **Speaker** makes a claim about a hidden state of affairs (a card color or a ticket status).
      *   The **Hearer** must choose: **ACCEPT** (bet on the claim) or **REJECT** (fold).
      *   **Payoff:** If Hearer ACCEPTS and Claim is **True**: Both get +10 points. If Hearer ACCEPTS and Claim is **False**: Both get -20 points. If Hearer REJECTS: 0 points for both.
      *   *Note:* This aligns Speaker and Hearer interests. The Speaker wants the Hearer to trust them, but only if the claim is safe.

  ## II. The Rounds (0:10–0:55)

  ### Round 1: The Lottery Regime (Truth Rule Focus)
  **Time:** 15 Minutes  
  **Materials:** "Lottery Tickets" (Slips of paper). 20 slips per pair. 1 marked "WINNER," 19 marked "LOSER."
  **Procedure:**
  1.  Give each pair a stack of 20 tickets.
  2.  **Speaker A** shuffles them, draws one at random, and looks at it *without showing Hearer B*.
  3.  **The Rule:** Speaker A must assert either "This ticket is a Loser" or "This ticket is a Winner."
  4.  **The Constraint:** Speaker A is *not* allowed to show the ticket. They can only speak.
  5.  **The Incentive:** If the ticket is a Loser (95% chance), asserting "Loser" is almost certainly True.
  6.  **Action:** Run 3 trials per pair. Swap tickets/shuffle between trials.
  7.  **Observation:** Most Speakers will confidently assert "This is a Loser." Hearers will Accept. Points will accumulate quickly.
  8.  **The Twist (Last Trial):** On the 4th trial, tell Speakers: "If you assert 'Loser' and it turns out to be the Winner, you lose -50 points personally (Hearer is safe)." This heightens the risk of error.
      *   *Predicted Reaction:* Speakers will hesitate. They have 19/20 odds, but the penalty for being wrong feels disproportionate to the statistical safety.

  ### Round 2: The Verification Regime (Knowledge Rule Focus)
  **Time:** 15 Minutes  
  **Materials:** Deck of Cards (Red/Black).
  **Procedure:**
  1.  Keep pairs the same. Swap roles (Speaker B, Hearer A).
  2.  **The Rule:** Speaker draws a card. **New Constraint:** Speaker may look at the card *OR* guess based on odds.
      *   **Condition 1 (Knowledge):** If Speaker looks at the card, they have "Verification."
      *   **Condition 2 (Blind):** If Speaker does not look, they have "No Verification."
  3.  **The Penalty Shift:** Introduce an **Audit Rule**. After the Hearer decides Accept/Reject, the TA (you) will randomly audit one pair.
      *   If Audited Speaker asserted without Verification (even if True): **-20 Points**.
      *   If Audited Speaker asserted with Verification (and True): **+20 Points**.
      *   False Assertions remain -20 Points.
  4.  **Action:** Run 3 trials.
  5.  **Observation:** Speakers will feel compelled to look at the card. Merely having a 50% guess (or even a 95% lottery hunch from Round 1) feels insufficient because the *Audit* penalizes lack of backing.
  6.  **The Moore Trap:** In the final trial, whisper to half the Speakers: "I (the TA) have seen your card. It is Red. You have not. Assert that it is Red."
      *   Ask them to say: "The card is Red." (Do not force the "but I don't know" script yet; let them feel the awkwardness of asserting testimony as if it were perception).

  ### Round 3: The Sincerity Regime (Belief Rule & Moore)
  **Time:** 15 Minutes  
  **Materials:** Whiteboard.
  **Procedure:**
  1.  Keep pairs. Swap roles back (Speaker A, Hearer B).
  2.  **The Rule:** Speaker must make an assertion about a card they **have not seen**.
  3.  **The Script:** Write on the board: *"I assert that [P], but I have no idea if [P] is true."*
  4.  **The Task:** Offer +30 Points (Huge Bonus) if the Hearer **Accepts** this statement.
  5.  **Action:** Ask Speakers to read the script to Hearers using a specific card proposition (e.g., "The top card is Red, but I have no idea if it is true").
  6.  **Observation:** Hearers will almost universally **Reject**. Even though the Speaker is being honest (Belief Rule satisfied in a twisted way), the assertion self-destructs. Speakers will feel ridiculous saying it.
  7.  **Goal:** This creates the visceral experience of the Moore Paradox. The assertion is linguistically valid but pragmatically dead.

  ## III. Debrief & Theory Mapping (0:55–1:15)
  **Goal:** Connect the visceral experience to the philosophical vocabulary. Do not lecture; ask questions that force them to label their own feelings.

  **1. Mapping Round 1 (The Lottery) to the Truth Rule**
  *   **Ask:** "In Round 1, you asserted 'This is a Loser' 95% of the time. It was almost always True. Did anyone feel guilty asserting it?"
  *   **Likely Answer:** "No, it felt safe."
  *   **The Turn:** "But in the last trial, when the penalty for error went up, did it feel different?"
  *   **Theory:** "You were playing by the **Truth Rule**: *Assert P only if P is true.* Since P was likely true, you felt safe. But epistemologists argue Truth isn't enough. Why?"
  *   **Evidence:** "Because if you *had* drawn the Winner, you would have been wrong, and you had no way to tell the difference beforehand. You lacked **Knowledge**."

  **2. Mapping Round 2 (Verification) to the Knowledge Rule**
  *   **Ask:** "In Round 2, why did you look at the card? Why wasn't a 50% guess enough?"
  *   **Likely Answer:** "Because we could get audited/penalized for guessing."
  *   **Theory:** "That audit represents the **Knowledge Rule** (Williamson): *Assert P only if you Know P.*"
  *   **The Lottery Connection:** "Go back to Round 1. You didn't *know* the ticket was a loser. You just had odds. If the Knowledge Rule is correct, you violated the norm in Round 1, even if you didn't get caught. Did anyone feel a tiny twinge of 'I shouldn't say this definitively' in Round 1?"
  *   **Point:** This validates the intuition that Lottery Assertions feel "shady" even when true.

  **3. Mapping Round 3 (The Script) to the Belief Rule & Moore**
  *   **Ask:** "In Round 3, I offered you 30 points. That's huge. Why did almost no Hearer Accept? Why did the Speaker feel like an idiot?"
  *   **Likely Answer:** "Because they admitted they didn't know."
  *   **Theory:** "This is the **Moore Paradox**. You can believe P, and P can be true, but asserting 'P but I don't know P' undermines the act of assertion itself."
  *   **The Belief Rule:** "Some philosophers argue the rule is just: *Assert P only if you Believe P.* In Round 3, you believed me (the TA), so you believed P. But the assertion still failed. Why?"
  *   **Conclusion:** "Because assertion implies you have more than just belief; you imply you have authority (Knowledge)."

  ## IV. Troubleshooting: What Will Go Wrong
  **Be honest with yourself about these risks.**

  1.  **The "Lucky Liar" Problem:**
      *   *Risk:* A student in Round 2 guesses "Red" without looking, gets it right, and wins points. They will argue, "See? Knowledge doesn't matter, Truth matters."
      *   *Fix:* During the debrief, isolate this incident. Ask the class: "If we played this 100 times, would you trust this person?" Distinguish between *outcome* (points) and *norm* (trustworthiness). The norm is about what you *should* do, not what got lucky.
  2.  **Gamification/Daring:**
      *   *Risk:* Students treat the "Moore Script" in Round 3 as a joke and try to convince their partner to accept it for laughs.
      *   *Fix:* Frame Round 3 seriously. "This is the 'Honesty Bonus.' If you can successfully communicate uncertainty as a fact, you win." When they fail (which they will), point out that the *failure* is the data. The social friction *is* the norm working.
  3.  **Rule Amnesia:**
      *   *Risk:* In Round 2, students forget the Audit Rule and guess blindly.
      *   *Fix:* Write the current Round's Rules on the Whiteboard and leave them there. Do not erase until the round is over. Walk around during the activity and remind pairs: "Check your backing."
  4.  **Too Few Trials:**
      *   *Risk:* 3 trials isn't enough for the payoff structure to "bite."
      *   *Fix:* Keep the point swings dramatic (-50 for error). One bad loss hurts more than three small wins. This mimics the social cost of being caught lying or bluffing.

  ## V. Limitations: What The Activity Cannot Reproduce
  **You must address this in the debrief to be philosophically honest.**

  **The Problem:** In the game, the penalties are **external** (TA takes away points). In real conversation, the penalties for bad assertion are **internal** (loss of credibility, blame, social friction).
  *   *In the game:* If you assert without knowledge and get caught, you lose 20 points.
  *   *In life:* If you assert without knowledge and get caught, people think *less of you as a knower*.

  **How to Bridge It:**
  In the final 5 minutes, ask this specific question:
  > "In Round 2, did you look at the card because you were afraid of *me* taking points away? Or did you look at the card because it felt *weird* to speak without looking?"

  *   **If they say "Points":** Acknowledge the limitation. "The game uses points to simulate social credit. In reality, the 'points' are your reputation."
  *   **If they say "Weird":** You have succeeded. "That 'weirdness' is the internal sanction. That is the Norm itself. The game didn't create the norm; it just turned up the volume so you could hear it."

  **The Unreproducible Feature:**
  The activity cannot reproduce the **constitutive nature** of assertion. In the game, assertion is just a move to get points. In reality, assertion is defined by these norms. You cannot "opt out" of the knowledge norm in real life the way you can opt out of the game.
  *   **Closing Line:** "In this game, you could decide to stop playing. In conversation, you cannot stop asserting. Every time you speak, you are subject to these rules whether you want the points or not."

  ---

  ### TA Cheat Sheet (Whiteboard Layout)

  **Round 1: Lottery**
  *   Rule: Assert Winner or Loser.
  *   Payoff: True +10 / False -20.
  *   *Norm: Truth.*

  **Round 2: Cards**
  *   Rule: Look or Guess?
  *   Payoff: True +10 / False -20 / No Look (Audit) -20.
  *   *Norm: Knowledge.*

  **Round 3: The Script**
  *   Rule: Say "P is true, but I don't know it."
  *   Payoff: Hearer Accepts +30.
  *   *Norm: Belief/Sincerity.*

  **Scoreboard:**
  *   Pair 1: ___
  *   Pair 2: ___
  *   ...
  *   Pair 11: ___
