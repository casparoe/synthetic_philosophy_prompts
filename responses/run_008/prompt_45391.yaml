      *Decision:* Round 3 will be the "Blind Assertion" round. Speaker is given a statement written by the TA (e.g., "The card in my pocket is Red"). They don't know. They are offered huge points to assert it. They will feel the Moore-paradoxical tension if they try to assert it sincerely.

      *Actually, let's go with the Prompt's specific suggestion:* "tempting someone into a Moore-style assertion." I will create a rule where they get points for Truth, but lose points for claiming Knowledge. So they want to assert P, but want to deny Knowing P. "P is true, but I don't know it." This creates the conflict.

