      *   *Terminology:* Ensure 'Acquaintance Principle' is described clearly without citing Hopkins.
      *   *Feasibility:* Be realistic. 12k words is roughly 40 pages. That's not a lot. The structure needs to be lean.
      *   *Risk:* The "triviality" risk is the biggest one. I need to emphasize that the proposal must argue for a *normative* shift, not just a descriptive one.

  10. **Final Review against Constraints:**
