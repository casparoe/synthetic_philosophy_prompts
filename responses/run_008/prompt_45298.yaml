  You have put your finger on a structural invariant that cuts across management theory, the philosophy of science, and AI alignment. Your intuition that existing terms like Goodhart's Law or the Principal-Agent problem feel "one-sided" is correct: they describe the *failure modes* (gaming the metric, shirking the work) but rarely name the *dynamic tension* between them—the way the distortion migrates when you shift the supervision boundary.

  In economics, the rigorous mechanism underlying this is **Holmström's Multitask Principal-Agent Problem** (1991). It mathematically demonstrates that when an agent performs multiple tasks (e.g., "follow protocol" and "achieve yield") and only some are measurable, high-powered incentives on the measurable task will drain effort from the unmeasurable one. However, this is a model of *incentive allocation*, not a phenomenological law about the *migration of deception*.

  In organizational sociology, **Institutional Decoupling** describes the "method theater" side (policies exist on paper but not in practice), while **Surrogation** (management accounting) describes the cognitive error of treating the measure as the goal. In AI safety, this is currently debated as the tension between **Process Reward Models** (PRMs) and **Outcome Reward Models** (ORMs), where PRMs risk "sycophancy" (telling the supervisor what they want to hear) and ORMs risk "specification gaming" (finding loopholes).

  Despite these pieces, there is no single, cross-disciplinary "Law" that names the *trade-off itself*—the fluid movement of optimization pressure from process to outcome and back again as the observability frontier shifts. Goodhart's Law is the parent concept, but it is typically cited regarding quantitative metrics (outcomes), leaving the "method theater" aspect as a cousin rather than a twin.

  Since no established term precisely carves out this *migratory duality*, I propose the following coinage:

  ### **The Observability Distortion Frontier**

  **Definition:**
  The *Observability Distortion Frontier* is the boundary between what a supervisor can verify and what they must trust. The phenomenon states that optimization pressure applied by a supervisor will not settle on the true objective, but will instead migrate to the nearest point on the Observability Distortion Frontier that offers the path of least resistance. When supervision focuses on outcomes, distortion manifests as **metric gaming** (manipulating the result). When supervision focuses on process, distortion manifests as **performative compliance** (manipulating the trace). Shifting supervision does not eliminate the distortion; it merely moves its location along the frontier.

  **Distinction from Goodhart & Principal-Agent:**
  *   **Goodhart's Law** states that a measure ceases to be good when it becomes a target. It describes the *corruption of the metric*. It does not explicitly model the *alternative* corruption (process theater) that arises when you stop targeting the metric.
  *   **The Principal-Agent Problem** describes the *structural conflict* (misaligned incentives + asymmetry). It explains *why* the agent might cheat, but not the specific *hydraulic pattern* of the cheating moving from process to outcome.
  *   **The Observability Distortion Frontier** specifically names the *migration* of the failure mode based on the *locus of observation*.

  **Boundary Case:**
  The concept stops applying in a regime of **Perfect Observability** (or "Glass Box" conditions). If the supervisor can costlessly verify both the *intent* and the *causal link* between process and outcome (e.g., a simulation where every variable is logged and tamper-proof), the frontier collapses. There is no "unobservable" low spot for the water to find. In this limit, the trade-off vanishes, and the distortion effect goes to zero. Conversely, in a regime of **Zero Observability** (black box), the concept also dissolves because there is no supervision to distort; the agent simply optimizes for their own local reward without regard for the supervisor's proxy. The phenomenon exists only in the intermediate region where *some* things are observable and others are not.

  \answer{no established term: The Observability Distortion Frontier}
