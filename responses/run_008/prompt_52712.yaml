      *   *Claim 2: Mapping is arbitrary (like Morse).*
          *   **Scientist's view:** Mostly true (frozen accident theory), but there's evidence of stereochemical affinity (chemical attraction between codons/anticodons and amino acids) in early evolution. It's not *purely* arbitrary, but mostly conventional now. This is mainstream, not fringe.
      *   *Claim 3: Every code we know traces to a mind.*
          *   **Scientist's view:** True by definition of "code" in human context, but begs the question. Natural processes create patterns (snowflakes, crystal lattices) that store information without minds.
      *   *Claim 4: Information, by definition, comes from a mind.*
          *   **Scientist's view:** False. Shannon information theory defines information mathematically, independent of meaning or mind. Biological information is functional, not necessarily semantic in the human sense.
      *   *Logical Gap:* Even if DNA is a code, and codes usually come from minds, asserting it *must* come from a mind is an argument from ignorance (God of the Gaps). Also, the "code" emerged from chemical chemistry, not top-down programming.

