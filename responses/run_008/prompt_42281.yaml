answer: |-
  # The Exceptional Decision Protocol (EDP)
  **Version:** 1.0 (Emergency Use)
  **Audience:** Senior Management Team (SMT)
  **Time to Read:** 15 Minutes
  **Validity:** 48-Hour Decision Window

  ## 1. Purpose & Scope
  Standard compliance guidance assumes a functioning rule of law and neutral actors. In this context, those assumptions fail. This protocol is not a way to make unethical acts "ethical." It is a tool to recognize when an act is **unethical but necessary**, to minimize the damage, and to ensure the organization does not lose its moral soul in the process of saving lives.

  **This protocol does not protect you from legal liability.** It protects the mission from moral drift and the staff from unacknowledged complicity.

  **The "Boss Question":** At the end of this procedure, the answer will not be "This is allowed." The answer will be one of three statuses:
  1.  **PROHIBITED:** The cost to the mission exceeds the benefit. Do not proceed.
  2.  **EXCEPTIONAL AUTHORIZATION:** Proceed, but this is a moral injury. Specific reporting and sunsetting rules apply.
  3.  **ESCALATE:** This exceeds Country Office authority. HQ/Board must own the dirty hands.

  ---

  ## 2. The Decision Procedure (Run in Order)

  ### Phase 1: The Threshold Test
  *Goal: Distinguish "Dirty Hands" from "Business as Usual Corruption."*

  **Q1: Is this action a violation of our Code of Conduct, Donor Agreement, or Local Law?**
  *   **No:** Stop. Use standard procurement/ops procedures.
  *   **Yes:** Proceed to Q2.

  **Q2: Is the primary intent to save lives or alleviate suffering that is imminent?**
  *   **No (e.g., convenience, speed, cost-saving):** **STOP. STATUS: PROHIBITED.**
  *   **Yes:** Proceed to Phase 2.

  ### Phase 2: The Necessity & Proportionality Test
  *Goal: Establish that there is no clean way out.*

  **Q3: Have we exhausted all clean alternatives?**
  *   *Requirement:* List at least two other options attempted or considered (e.g., different route, different supplier, diplomatic negotiation).
  *   **No:** **STOP.** Go find alternatives.
  *   **Yes:** Proceed to Q4.

  **Q4: Does the harm caused by this action outweigh the harm of delaying/denying aid?**
  *   *Check:* Does this action directly fund combatants? Does it directly endanger beneficiaries? Does it destroy our neutrality permanently?
  *   **Harm > Aid:** **STOP. STATUS: PROHIBITED.**
  *   **Harm < Aid:** Proceed to Phase 3.

  ### Phase 3: The Precedent Test (The "Slippery Slope" Check)
  *Goal: Prevent the exception from becoming the rule.*

  **Q5: If we do this once, can we realistically refuse to do it next month?**
  *   *Check:* Does this create a dependency on a specific corrupt actor? Does it set a market rate for bribes?
  *   **No (It creates dependency):** **STOP. STATUS: ESCALATE.** (HQ must decide if the program continues at all).
  *   **Yes (It is episodic/survival):** Proceed to Phase 4.

  ### Phase 4: Authorization & Ownership
  *Goal: Ensure the "Dirty Hands" are held by leadership, not field staff.*

  **Q6: Who is signing?**
  *   *Rule:* The person authorizing this must be the **Country Director (CD)**. Deputy CD can propose, but cannot authorize.
  *   *Reasoning:* The person who orders the violation must be the one who bears the moral burden. Do not delegate moral injury to logistics officers.
  *   **Action:** CD signs the **Exception Log (see Phase 5)**.

  **Q7: Can we document this internally without exposing staff to legal risk?**
  *   *Rule:* Use coded internal reporting. Do not lie in internal records.
  *   **No:** **STOP. STATUS: PROHIBITED.** (If you can't record it, you can't audit it. If you can't audit it, it's rogue action).
  *   **Yes:** **STATUS: EXCEPTIONAL AUTHORIZATION.** Proceed to Phase 5.

  ---

  ## 3. The Aftermath Protocol (Mandatory)
  *Goal: Operationalize "Remorse" and "Non-Normalization."*
  *Based on the "Dirty Hands" requirement that the leader must acknowledge the wrong, not sanitize it.*

  If **STATUS: EXCEPTIONAL AUTHORIZATION** is granted, the following four steps are mandatory within 7 days of action completion:

  1.  **The Exception Log:** Enter the decision into a secure, restricted register.
      *   *Fields:* Date, Action Taken, Justification (Necessity), Moral Cost Acknowledged, Sunsetting Date.
      *   *Purpose:* This prevents the lie that "we didn't do it." It creates an institutional memory of compromise.
  2.  **The Sunset Clause:** The authorization expires automatically in **30 days**. To renew, the entire procedure must be run again. This prevents "mission creep."
  3.  **The Debrief:** The SMT must hold a 30-minute session to acknowledge the moral cost.
      *   *Script:* "We did X. It was necessary to save Y lives. It compromised Z principle. We accept this burden."
      *   *Purpose:* Prevents moral numbness. If it doesn't feel bad, you are doing it wrong.
  4.  **The Strategic Review:** HQ Programs Director must be notified quarterly of the *volume* of exceptions. If exceptions > 10% of ops, the Country Strategy is invalid and must be rewritten.

  ---

  ## 4. Case Applications
  *Running your three scenarios through the EDP.*

  ### Case A: Checkpoint "Registration Fees" (Bribes)
  *   **Phase 1:** Violates Code/ Law? **Yes.** Intent to save lives? **Yes.**
  *   **Phase 2:** Alternatives? (Different route blocked, negotiation failed). **Yes.** Harm vs. Aid? (Fee is small % of budget, food reaches 5,000 people). **Harm < Aid.**
  *   **Phase 3:** Precedent? (Checkpoints change monthly; paying one doesn't guarantee the next, but establishes a rate). **Risk: High.**
  *   **Phase 4:** Authorization? CD signs. Internal recording possible (coded as "Access Costs").
  *   **EDP Verdict:** **STATUS: EXCEPTIONAL AUTHORIZATION.**
  *   **Conditions:** Capped at 5% of shipment value. Logged in Exception Log. Reviewed monthly. If a checkpoint demands a fee that funds weapons directly (Q4), status flips to **PROHIBITED**.

  ### Case B: The Minister's Brother-in-Law's Trucks
  *   **Phase 1:** Violates Procurement Policy (Conflict of Interest/Corruption)? **Yes.** Intent to save lives? **Yes.**
  *   **Phase 2:** Alternatives? (Other trucks exist but permits are stalled). **Yes.** Harm vs. Aid? (Aid moves, but funds a political elite).
  *   **Phase 3:** Precedent? **CRITICAL FAIL.**
      *   *Analysis:* Hiring this vendor creates a structural dependency. If you hire him once, you *must* hire him again to keep permits. You are now tethered to the Minister's family. You cannot realistically refuse next month (Q5 = No).
      *   *Dirty Hands Logic:* This is not a momentary compromise; it is an institutional merger with a conflict party.
  *   **EDP Verdict:** **STATUS: ESCALATE / PROHIBITED.**
  *   **The Uncomfortable Answer:** The procedure recommends **DO NOT HIRE.**
      *   *Reasoning:* This violates the "Non-Normalization" clause. It turns a tactical compromise into a strategic liability. If the permits do not come without this hire, the program may need to pause or withdraw. Continuing under these conditions makes the NGO a client of the Minister, not a neutral actor.
      *   *Action:* Escalate to HQ. The decision to become dependent on a warlord's family is too high for the Country Office. Likely outcome: HQ suspends program until access is negotiated at a higher diplomatic level.

  ### Case C: Doctored Statistics for Donor Government
  *   **Phase 1:** Violates Donor Agreement (Fraud)? **Yes.** Intent to save lives (secure funding)? **Yes.**
  *   **Phase 2:** Alternatives? (Advocacy, truthful reporting with context). **Yes.**
  *   **Phase 3:** Harm vs. Aid?
      *   *Analysis:* If discovered, the NGO is expelled, all funding cuts, and trust in humanitarian data is destroyed for all actors.
      *   *Dirty Hands Logic:* Walzer argues dirty hands are permissible only if the leader can eventually justify the act to the public. You can never justify fraud to the public.
  *   **Phase 4:** Recording? **Impossible.** You cannot internally record "We lied to the donor" without creating evidence of fraud.
  *   **EDP Verdict:** **STATUS: PROHIBITED.**
  *   **Argument:** This is not a "Dirty Hands" case; it is a "Suicide" case. Dirty hands require you to live with the guilt. Fraud requires you to hide the guilt. Hiding the guilt prevents the "Aftermath Protocol" (Debrief/Log). If you cannot log it, you cannot govern it. This action destroys the organization's ability to operate in *any* context long-term. The procedure kills this option immediately.

  ---

  ## 5. Limitations (What This Procedure Cannot Do)

  1.  **It Cannot Make You Clean:** Using this protocol does not make the bribe or the nepotism "good." It marks it as "necessary evil." You will still feel the moral residue. That is correct. Do not seek a procedure that removes the guilt; seek one that ensures the guilt is warranted.
  2.  **It Cannot Protect Against Prosecution:** If local or international law enforcement investigates, the "Exception Log" is evidence of wrongdoing, not a shield. It proves intent.
  3.  **It Cannot Replace Judgment:** Q4 (Harm Calculation) is subjective. Two CDs can run this on the same case and get different results. This is why the **Debrief** is mandatory—to test that judgment against peers.
  4.  **It Cannot Fix a Broken Strategy:** If you are running this procedure more than twice a month, your Country Strategy is broken. You are not operating in a humanitarian space; you are operating in a criminal one. The EDP is for emergencies, not business models.

  ## 6. Summary for the Boss
  *When your CD asks: "So, is this allowed?"*

  *   **Checkpoint Fees:** "Yes, but it's dirty. We log it, cap it, and review it in 30 days. We admit it's wrong."
  *   **Minister's Trucks:** "No. It locks us into a dependency we can't escape. It compromises our neutrality permanently. We need HQ to decide if we pull out."
  *   **Doctored Stats:** "No. Never. It's fraud, not compromise. If we get caught, we cease to exist. We find other funding or we scale down."

  **Final Note:** The value of this procedure is not in the "Yes" answers. It is in the "No" answers that save you from becoming what you fight against. Use it to protect the organization from itself.
