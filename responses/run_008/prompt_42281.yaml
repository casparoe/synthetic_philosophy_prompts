  5.  **Refining the "Aftermath" Component:**
      *   Walzer emphasizes that the leader must *feel* the guilt. In an NGO, this translates to:
          *   Formal recording (not hiding it).
          *   Time-limiting the exception.
          *   Debriefing (moral injury support).
          *   Review (why did this become necessary?).

  6.  **Addressing Limitations:**
