  *(Refining the Statistics Case)*: The user suspects this is beyond the procedure. I should agree but explain *why* within the procedure's logic (it fails the "Publicity" or "Reversibility" test).

  Let's build the "Exceptional Decision Protocol (EDP)."

  *Step 1: The Threshold.* Is this illegal/unethical? If no, normal process. If yes, proceed.
