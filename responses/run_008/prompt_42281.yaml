      *   *Re-evaluating the "Uncomfortable Answer":* The user suspects stats are beyond the procedure. I should argue *why* the procedure kills that one. But maybe the "Uncomfortable Answer" is on the Trucking. Hiring the brother-in-law cements corruption. The procedure should say "No, find another way, even if it costs time." That's the hard operational pill. Let's go with that. The Trucking case should be a "No" or "Escalate to HQ" because it creates a long-term liability, whereas fees are immediate survival.
