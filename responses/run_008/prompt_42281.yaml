  8.  **Drafting the Content (Iterative refinement):**
      *   *Title:* Needs to sound official but distinct from Compliance. "Exceptional Decision Protocol (EDP)."
      *   *Tone:* Stern, pragmatic, protective of the staff and the mission.
      *   *Structure:*
