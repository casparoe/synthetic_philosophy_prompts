  2.  **Deconstruct "Dirty Hands" Ethics for Operations:**
      *   *Core Concept:* Sometimes doing the right thing (saving lives) requires doing something wrong (breaking a rule/principle). The leader must acknowledge the wrong, not sanitize it.
      *   *Key Components:*
          *   **Necessity:** Is there truly no other way?
          *   **Proportionality:** Does the good outweigh the bad?
          *   **Publicity/Accountability:** Can this be defended (eventually)? Who owns it?
          *   **Remorse/Restitution:** Acknowledging the moral injury, not treating it as business as usual.
          *   **Non-Normalization:** Preventing the exception from becoming the rule.

  3.  **Drafting the Procedure (The "Dirty Hands Protocol" - DHP):**
      *   *Constraint:* 48-hour window, 15-minute read time, no philosophy background.
      *   *Structure:* Needs to look like an SOP (Standard Operating Procedure).
      *   *Phases:*
          1.  Triage (Is this actually a dirty hands issue or just corruption?)
          2.  Necessity Test (Last resort?)
          3.  Harm Calculation (Lesser evil?)
