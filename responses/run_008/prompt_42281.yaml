      *   **Requirements:**
          *   Step-by-step questions with stopping points.
          *   Distinction between "No," "Yes with Moral Cost," and "Escalate to Judgment."
          *   Inclusion of *aftermath* protocols (recording, guilt, accountability, preventing normalization).
