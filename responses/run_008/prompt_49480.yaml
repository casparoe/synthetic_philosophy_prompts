answer: |-
  **Setting:** *A faculty office, late afternoon. Whiteboards covered in modal operators and probability functions. Two coffee cups, one empty, one half-full.*

  **Characters:**
  *   **ELENA:** Truth-Conditionalist. Defends a Stalnaker/Lewis-style possible worlds semantics.
  *   **MARCUS:** Probabilist. Defends an Adams/Edgington-style non-truth-conditional view.

  **MARCUS:** (Capping a marker) Okay, if we're going to co-teach this, the grad students need to see the blood in the water immediately. We can't sandbag the triviality results. If I start with Adams, and you start with Stalnaker, they'll think it's just a terminological dispute. It's not. It's an impossibility proof.

  **ELENA:** I agree. But if you lead with Lewis's general proof, their eyes will glaze over before we get to the semantics. Let's ground it. You wanted to use the die example for the handout?

  **MARCUS:** Yes. It's the cleanest way to show why $P(A \to C) = P(C|A)$ kills the truth-conditionalist. Look, imagine a fair die. Let $E$ be "The die lands even" $\{2, 4, 6\}$. Let $S$ be "The die lands six" $\{6\}$. We all agree $P(S|E) = 1/3$.

  **ELENA:** Agreed.

  **MARCUS:** Now, you say "If $E$, then $S$" expresses a proposition. Call it $H$. This proposition $H$ is either true or false at each of the six outcomes. Since $P(H)$ is supposed to equal $P(S|E)$, $P(H)$ must be $1/3$.

  **ELENA:** So far, so good.

  **MARCUS:** Here's the squeeze. If $H$ is a standard proposition, it partitions the logical space. Consider the outcomes where $E$ is true: $\{2, 4, 6\}$. For $H$ to have probability $1/3$ overall, and given that conditionals are usually vacuous or true when the antecedent is false... actually, let's stick to the constraint. If $H$ is true, does that mean $S$ must be true given $E$?

  **ELENA:** On my view, $H$ is true at a world $w$ if $S$ is true at the closest $E$-world to $w$. So at world 6, $H$ is true. At world 2, the closest even world is 2, where $S$ is false, so $H$ is false.

  **MARCUS:** Exactly. So $H$ is true at $\{6\}$ and false at $\{2, 4\}$ (within the even partition). But now, apply the Law of Total Probability. $P(H) = P(H|E)P(E) + P(H|\neg E)P(\neg E)$. If we assume the standard constraint that a conditional is certainly true given its antecedent and consequent, and certainly false given its antecedent and negated consequent... Elena, if $H$ is a proposition in the algebra, learning $H$ is true should update your credence in $S$ given $E$ to 1.

  **ELENA:** Only if $H$ entails $E \supset S$.

  **MARCUS:** But if $P(H) = P(S|E)$, then learning $H$ shouldn't change the probability of $S$ given $E$ *unless* $P(S|E)$ was already 0 or 1. That's Lewis's point. If $P(S|E) = 1/3$, and you learn the proposition $H$ is true, your new credence in $S$ given $E$ becomes 1. But if $H$ just *is* the conditional, your credence in $H$ *was* your credence in $S$ given $E$. You can't have a proposition whose probability is $1/3$ but which, when learned to be true, makes the conditional probability 1, without violating the ratio analysis. In the die case, there simply isn't a proposition $H$ such that $P(H) = 1/3$ and $P(S|E \land H) = 1$ while $P(S|E \land \neg H) = 0$. The math forces $P(S|E)$ to collapse to 0 or 1.

  **ELENA:** (Leaning back) I know the proof, Marcus. But look at what you're buying to avoid it. You're saying "If the die is even, it's six" has no truth value. It's just a expression of your 1/3 credence.

  **MARCUS:** I'm saying it *is* an expression of conditional credence. That's all it does. It saves the equation $P(\text{If } A, C) = P(C|A)$.

  **ELENA:** At the cost of logic. That's the trade I want the students to see. You save the probability equation by sacrificing embeddability. Consider: "It is not the case that if the die is even, it lands six."

  **MARCUS:** I can handle negation via assertibility conditions. To assert the negation is to assert that the conditional credence is low.

  **ELENA:** But what about: "Either if the die is even it lands six, or if it's odd it lands five." That's a disjunction of conditionals. On my view, it's a disjunction of propositions. It has truth conditions. It's true if the closest even world is a six-world or the closest odd world is a five-world. On your view? What is the assertibility condition of a disjunction of two things that aren't propositions?

  **MARCUS:** (Sighs) We handle it pragmatically. Or we paraphrase. "Either my credence in six given even is high, or my credence in five given odd is high."

  **ELENA:** That paraphrase fails. I can know my credences are both moderate, say 1/3 each, but still know the disjunction is true because I know the die is rigged to land on 6 or 5. The truth of the compound depends on the world, not my head. If you deny truth conditions, you have to treat every embedding as a special case, a new rule for 'not', 'or', 'if'. I bite the bullet on the probability.

  **MARCUS:** Bite the bullet how?

  **ELENA:** I deny that $P(A \to C) = P(C|A)$ is an identity. It's an approximation. It holds for simple, unembedded conditionals in contexts where we aren't considering the probability of the conditional itself. The failure of the equation is the price of making conditionals truth-apt. If they are propositions, they obey the laws of probability for propositions, not the laws of conditional chance.

  **MARCUS:** That's a big bullet. It severs the link between assertion and belief. The Ramsey Test says: to evaluate "If $A$, $C$", I add $A$ to my beliefs and check $C$. That yields $P(C|A)$. If you say the probability of the conditional is *not* that, you're saying my degree of belief in the proposition is not my degree of assertibility.

  **ELENA:** I'm saying degree of belief tracks truth, and assertibility tracks probability, and for conditionals, they come apart. But consider the bet, Marcus. That's your favorite weapon.

  **MARCUS:** It's the knockout punch. A conditional bet: "I bet you \$10 that if the die is even, it's six." If the die lands 3, the bet is called off. Void. If the die lands 2, I lose. If 6, I win. The expected value of that bet is determined entirely by $P(S|E)$. It is *not* determined by the probability of any proposition $H$ that is false when the die lands 3. If $H$ were a proposition false at 3, the bettor would lose on 3. But we don't lose on 3. We get our money back.

  **ELENA:** The betting interpretation assumes the bet is only about the truth of the consequent in the actual world. But my semantics is about *nearby* worlds. When I assert "If $A$, $C$", I am claiming that in the relevant $A$-worlds, $C$ holds. The bet is a crude instrument that only checks the actual world. It misses the modal content.

  **MARCUS:** But the intuition of the "void" bet is robust. It matches the grammar of "given." And it matches the behavior of long-shot antecedents. Suppose $A$ is "The moon is made of cheese." $P(A)$ is near 0. $P(C|A)$ might be high if we're in a fairy tale context. But $P(A \to C)$ as a proposition... if it's a material conditional, it's near 1. If it's a variably strict conditional, it's still constrained by the probability of the antecedent being true in the actual world to some degree. My view lets $P(\text{If } A, C)$ be high even when $P(A)$ is tiny, provided $P(C|A)$ is high.

  **ELENA:** And my view lets me say "If the moon were cheese, it would be delicious" is true, regardless of my credence in the moon being cheese. But let's talk about iteration. "If (if $A$ then $B$), then $C$."

  **MARCUS:** (Winces) Okay. Iterated conditionals are hard for Adams.

  **ELENA:** They're impossible without truth values. You can't have a conditional antecedent if the antecedent has no truth value. You can't condition on an expression of credence.

  **MARCUS:** I can condition on the *fact* that the conditional credence is high. But I admit, it's clumsy.

  **ELENA:** It's not just clumsy; it changes the subject. The sentence is about the world, not about credences. Look, Marcus, we're preparing a seminar. We need to tell them where the bodies are buried.

  **MARCUS:** Agreed. So, for the syllabus: Week 1, the Ramsey Test and Adams' Thesis. Week 2, Lewis's Triviality. Week 3, the response.

  **ELENA:** And the response needs to be balanced. If I concede too much, they'll think truth-conditionalism is dead. If you concede too much, they'll think expressivism is just a stopgap.

  **MARCUS:** So, let's end the first session with the "Least Bad Concession." I'll start. My least bad concession is that conditionals do not obey classical logic. If "If $A$, $B$" has no truth value, then Modus Ponens isn't validity-preservation in the classical sense. It's a rule of coherent credence change. I have to tell the students that logic, for conditionals, is non-truth-functional.

  **ELENA:** And mine is that the Ramsey Test is not an identity. I have to tell them that $P(\text{If } A, C) \neq P(C|A)$ in the strict sense. The equation fails for embedded cases, and it fails when we condition on the conditional itself. I have to accept that the intuitive link between conditional credence and the probability of the conditional is a pragmatic illusion, or at best, a limit case.

  **MARCUS:** (Taps the whiteboard) So I give up Truth for Probability.

  **ELENA:** And I give up the Ramsey Identity for Embeddability.

  **MARCUS:** It's a stalemate.

  **ELENA:** It's a distinction without a winner. But the students will have to choose which bullet they prefer biting. The logical bullet or the probabilistic bullet.

  **MARCUS:** (Picks up his coat) I'll draft the die problem set. Make sure you check my logic on the partition.

  **ELENA:** I will. And I'll draft the embedding examples. "If it's not the case that if it rains, the match is cancelled..."

  **MARCUS:** ...then we play.

  **ELENA:** Exactly. See you Tuesday, Marcus.

  **MARCUS:** Tuesday, Elena. Don't let the triviality results keep you up.

  **ELENA:** Only until I figure out how to embed a probability function in a possible world.

  *(They exit. The whiteboard remains, covered in the unresolved tension between $P(C|A)$ and $\to$.)*
