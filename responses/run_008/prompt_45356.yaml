answer: |-
  1. If the integrity objection ultimately concerns which thoughts an agent can fittingly act from, does it not collapse into a theory of character rather than a refutation of consequentialist norms? If you insist it remains a theoretical refutation, what work is the word 'objection' doing beyond recommending a different psychological disposition?

  2. Suppose a consequentialist theory directs agents never to calculate, yet the ultimate justification for their projects remains external to those projects themselves. What precisely remains wrong with an agent who lives this way, if not the presence of calculative thoughts in her mind?

  3. Does your objection presuppose that 'integrity' names a psychological fact about the unity of a life that any theory of right action must accommodate? If so, what would count as evidence for this constraint beyond our intuitive resistance to the consequentialist description?

  4. You argue that abandoning ground projects alienates an agent from her life, but couldn't a consequentialist claim that promoting the good is itself such a ground project? If she responds that this is merely an adopted commitment rather than a constitutive one, how do you distinguish the two without begging the question against her?

  5. Your argument appears to move between criticizing the consequentialist act and criticizing the consequentialist agent's psychology. If you concede the act can be right even when the psychology is alienated, what force does the integrity objection retain against the theory itself?
