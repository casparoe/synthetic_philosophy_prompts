answer: |-
  **MEMORANDUM**

  **TO:** New Writing Panel
  **FROM:** [Your Name/Chair]
  **DATE:** 24 May 2024
  **SUBJECT:** Specification for Permissible Invention in Biographical & Docudrama Scripts

  ### 1. PURPOSE
  This document establishes the operational standard for assessing scripts based on real lives. Its purpose is to replace ad hoc decision-making with a consistent rubric. It distinguishes between **Non-Negotiable Requirements** (ethical and legal red lines) and **Panel Preferences** (areas where artistic judgement must be exercised, acknowledging existing factional divides).

  ### 2. NON-NEGOTIABLE REQUIREMENTS
  *Failure to meet these criteria results in an automatic request for revision or rejection. These are not subject to artistic override.*

  **2.1 The Integrity of Moral Causality**
  The script must not alter the fundamental moral agency of a real person without explicit signalling.
  *   **Test:** If a real person made a decision for Reason A, and the script changes it to Reason B, does this shift exonerate or condemn them in a way the historical record does not support?
  *   **Ruling:** Motive substitution that fundamentally alters the ethical valence of an action (e.g., changing a selfish act to a selfless one, or vice versa) is prohibited unless framed as speculative fiction within the text.

  **2.2 The Cumulative Impression Test**
  The script must not create a false overall portrait through the selective arrangement of true events.
  *   **Test:** If a knowledgeable observer (biographer, family member) viewed the production, would they recognise the *person*, even if they dispute specific scenes?
  *   **Ruling:** A script passes if the "gestalt" of the character aligns with the consensus of the historical record. A script fails if it uses technically true scenes to construct a demonstrably false character (lying by omission/selection).

  **2.3 The Duty of Care Sliding Scale**
  The permissible level of invention is inversely proportional to the proximity of living memory.
  *   **Test:** Are the subject's immediate descendants or peers alive and likely to engage with the work?
  *   **Ruling:**
      *   **Historical (>100 years):** High invention permissible.
      *   **Recent (<50 years):** High duty of care. Invention that causes distress to living relatives regarding private matters requires consultation or anonymisation.
      *   **Living Subjects:** Requires consent or rigorous public interest justification.

  **2.4 The Contract of Expectation**
  The marketing and theatrical framing must match the level of factual fidelity.
  *   **Test:** Does the audience know they are watching a speculation?
  *   **Ruling:** A script sold as "The True Story" cannot contain unflagged composite characters or invented interiority. A script sold as "Inspired By" or "A Fantasia" carries more latitude, but *still* must adhere to Requirement 2.1 (Moral Causality). Marketing cannot excuse defamation.

  ### 3. OPERATIONAL CRITERIA (PANEL PREFERENCES)
  *These areas are subject to debate. The Panel must vote on these per script, acknowledging that different members prioritise different values. There is no single "correct" verdict here, only a consensus.*

  **3.1 Composite Characters (The "Dramatic Economy" Preference)**
  *   **Faction A (Purists):** Composites are inherently deceptive. Real people should not bear the actions of others.
  *   **Faction B (Dramatists):** Composites are necessary to avoid narrative clutter.
  *   **Compromise Standard:** Composites are permissible *provided* they do not attribute specific, documented negative actions of a real, identifiable individual to the composite. (e.g., You may merge three workmates into one, but you cannot make that composite the sole antagonist if the real antagonists were different people).

  **3.2 Invented Interiority (The "Psychological Access" Preference)**
  *   **Faction A (Empiricists):** If there is no diary entry or recording, we cannot know their thoughts.
  *   **Faction B (Expressionists):** Drama requires access to the inner life; external action is insufficient.
  *   **Compromise Standard:** Interior monologues are permissible if they are **consistent with external evidence**. A character cannot express a motive in private that contradicts their public actions without explanation.

  **3.3 Private Material (The "Right to Privacy" Preference)**
  *   **Faction A (Transparency):** If it is true and relevant, it is public domain.
  *   **Faction B (Protection):** Secrets kept in life should remain secrets in death, out of respect for the family.
  *   **Compromise Standard:** "True but Private" material (affairs, diagnoses) requires a **Public Interest Test**. Does revealing this secret illuminate a matter of public significance, or is it merely salacious? If the latter, it must be cut or anonymised.

  ### 4. SCENARIO APPLICATIONS
  *How to apply the above requirements to common script issues.*

  | Scenario | Standard Application | Verdict Guide |
  | :--- | :--- | :--- |
  | **Composite Characters** | Check against Req 2.1 & 3.1. | **Pass:** Merges three neutral colleagues into one for pace. <br> **Fail:** Merges three colleagues, but attributes a specific documented act of sabotage from *one* real person to the *composite*, implicating the families of the other two. |
  | **Invented Interiority** | Check against Req 3.2. | **Pass:** 2am monologue reflecting known anxieties found in letters. <br> **Fail:** Monologue confessing to a crime the person was acquitted of, with no new evidence. |
  | **Motive Substitution** | Check against Req 2.1. | **Pass:** Condensing a complex financial motive into a simpler line for clarity. <br> **Fail:** Changing a decision made for greed into one made for love to make the protagonist more likable. |
  | **Selection that Lies** | Check against Req 2.2. | **Pass:** Omitting boring years to focus on the crisis. <br> **Fail:** Showing only the subject's failures to portray them as incompetent, while omitting their documented successes (or vice versa). |
  | **Recency** | Check against Req 2.3. | **Pass:** Inventing dialogue for a Tudor monarch. <br> **Fail:** Inventing a scandalous affair for a singer who died in 2009, whose children are in the audience. |
  | **The Frame** | Check against Req 2.4. | **Pass:** A surreal musical where the dead narrator admits they are guessing. <br> **Fail:** A naturalistic drama marketed as "The True Story" containing unflagged fabrications. |
  | **Private Material** | Check against Req 3.3. | **Pass:** Revealing a diagnosis that explains their public collapse. <br> **Fail:** Revealing an affair that has no bearing on the public work, solely for dramatic shock. |

  ### 5. KNOWN INCOMPATIBILITIES & TRADE-OFFS
  *The Panel must acknowledge that the following pairs of requirements cannot always be jointly satisfied. In these cases, a conscious trade-off must be recorded in the meeting minutes.*

  **5.1 Dramatic Necessity vs. Biographical Fidelity**
  *   **Conflict:** A script may require a composite character to function as a play (Dramatic Necessity), but this inherently dilutes Biographical Fidelity.
  *   **Resolution:** The Panel must vote on which value takes precedence for *this specific production*. There is no universal rule.

  **5.2 Family Sensitivity vs. Historical Record**
  *   **Conflict:** The historical record may be damning (Fidelity), but the family is suffering (Duty of Care).
  *   **Resolution:** If the subject is recent (Req 2.3), Duty of Care usually overrides Fidelity unless there is a overriding Public Interest. For historical figures, Fidelity overrides Sensitivity.

  **5.3 Audience Complicity vs. Audience Deception**
  *   **Conflict:** An audience may understand theatrical convention (e.g., soliloquies are invented), but a specific line may still mislead them about a fact.
  *   **Resolution:** We cannot rely on "the audience knows it's a play." If a specific invention creates a lasting false belief about a real person's character, it is deceptive regardless of the genre.

  ### 6. ANALYSIS OF CANDIDATE STANDARDS
  *Note for Panel Chairs: This section explains why the above specification is necessary.*

  There are three common shortcuts used to avoid these difficult conversations. This specification is designed to exclude them. The single requirement that does the most work to exclude all three is **Requirement 2.1: The Integrity of Moral Causality.**

  1.  **Excludes the "Facts-Only" View:** A strict facts-only approach forbids *all* invention, including composite characters and interiority, rendering most drama impossible. Requirement 2.1 allows invention (interiority, compression) *provided* it does not alter the moral cause-and-effect of the person's life. It permits artistic licence without surrendering truth.
  2.  **Excludes the "Emotional Truth" View:** This view suggests that if the *feeling* is right, the facts don't matter. Requirement 2.1 blocks this by demanding that motives (the engine of morality) cannot be swapped simply because they "feel" more dramatic. A flattering lie is still a lie under this standard.
  3.  **Excludes the "Genre-Contract" View:** This view suggests that if the marketing says "Based on a True Story," anything goes. Requirement 2.1 asserts that some distortions are unethical regardless of the marketing label. You cannot sell a defamation as a "fantasia" if it assigns specific, damaging moral agency to a real person without warrant.

  **Conclusion:**
  By anchoring the standard in **Moral Causality** rather than **Factual Accuracy** or **Audience Expectation**, we allow the writers to write plays, but prevent them from rewriting history.

  ***

  **END OF DOCUMENT**
