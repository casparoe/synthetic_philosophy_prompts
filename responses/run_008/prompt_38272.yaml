answer: |-
  This is a provocative and tightly written draft. You have identified a genuine tension in the literature: the tendency to treat the Ship of Theseus as a purely metaphysical puzzle while ignoring the epistemic conditions under which artifact identity is ascribed. However, your move from "identity judgments rely on evidence" to "identity talk is historical inquiry, not metaphysics" is a large leap that invites the very objections you anticipate.

  Here are detailed comments addressing your four specific questions, followed by a general assessment.

  ### 1. Retroactivity: Metaphysics or Epistemology?

  You ask whether the 2010 discovery shows that *identity verdicts change* or merely that *evidence changes*. This is the critical hinge of your paper.

  *   **The Risk:** As it stands, a standard realist will read your 2010 case as a straightforward epistemological update. They will argue: "In 1980, the ship *was* (say) 60% original. We *believed* it was 100% original. In 2010, we corrected the belief. The truth value of 'The ship is mostly original' did not flip; our access to the truth did."
  *   **The Opportunity:** To make this a metaphysical threat rather than an epistemological truism, you must argue that for artifacts, **there is no fact of the matter independent of the historical narrative.** If artifact identity is constitutively dependent on *recognized* continuity (social/legal/historical), then the discovery doesn't just reveal a fact; it *settles* a fact that was previously indeterminate.
  *   **The Line:** The principled line lies in **supervenience**. If identity supervenes on physical properties + causal history *regardless of our knowledge*, you are making an epistemological point. If identity supervenes on physical properties + *established* causal history (where 'established' implies an epistemic community), you are making an ontological point.
  *   **Verdict:** Currently, the draft leans too heavily on the epistemological reading ("Identity judgments... are hostage to our evidence"). To threaten the conventionalist defusal, you need to argue that the *criteria* for artifact identity include an epistemic component (e.g., "continuous recognition as the same object"), not just a causal one.

  ### 2. The History Analogy: Semantics vs. Assertion

  You suspect a critic will say, "The sentence was always true or false; 2010 merely told us which." You are right to suspect this; this is the default realist position.

  *   **Defensibility:** The analogy is defensible *if* you lean into the specific ontology of artifacts. Unlike electrons or tigers, artifacts are defined by intention and function. If the "identity" of a museum ship is partly a function of its status *as a museum piece* (a social role), then that status is indeed sensitive to historical verification in a way that natural kinds are not.
  *   **The Conflation:** You risk conflating **truth conditions** with **assertibility conditions**.
      *   *Realist:* Truth conditions are fixed by the world. Assertibility changes with evidence.
      *   *Your Claim:* For artifacts, assertibility conditions *constitute* the truth conditions.
  *   **How to Fix:** You need to explicitly argue that artifact identity is a **status function** (to use Searle's term) rather than a brute physical fact. If being "The Ship of Theseus" is like being "The President" or "Legal Tender," then your historical inquiry analogy holds water. If it is like being "Water," it does not. You need to make the category mistake explicit: treating artifacts as natural kinds is the error, not just the sortal move.

  ### 3. Weakest Point and Critic's Attack

  **Weakest Point:** The claim that "the realist... is in serious trouble, because her real object... plays no role."
  This is an overstatement. The object (the wood, the arrangement) plays a massive role; it constrains the historical narrative. You cannot declare a pile of ash to be the Ship of Theseus even with a compelling narrative.

  **The Sharpest Critic's Attack:**
  A critic (likely a neo-Lockean or a four-dimensionalist) will attack your **Criteria vs. Evidence distinction**.
  *   *The Attack:* "You argue that because we use evidence to determine continuity, continuity is evidentiary. This is a non-sequitur. We use evidence to determine if a murder occurred, but the murder's occurrence is not constituted by the evidence. You have shown that identity *claims* are revisable, not that identity *facts* are."
  *   *The Vulnerability:* Your 2010 case describes a change in *classification* based on new data. The critic will argue this is compatible with a robust metaphysical realism about identity. You haven't yet proven that the metaphysical fact *waited* for the dendrochronology to come into existence.

  ### 4. Development Potential

  **Most Worth Developing:** The claim that **artifact identity has the structure of historical inquiry.**
  This is the most novel and promising element. It moves the debate from "vagueness in the world" to "the nature of social ontology."

  **Requirements for Development:**
  1.  **Engage Social Ontology:** You need to engage with Amie Thomasson (*Ordinary Objects*) or Lynne Baker. They argue artifacts depend on human intentions. You can extend this: if they depend on intentions, they depend on the *tracking* of those intentions, which is an epistemic/historical process.
  2.  **Distinguish Natural vs. Artificial:** You must explicitly argue why ships differ from organisms. (e.g., An organism's identity is biological; a ship's identity is institutional/historical).
  3.  **Refine the "Realist in Trouble" Claim:** Soften this. Instead of saying realism is dead, argue that **Artifact Realism** requires an **Epistemic Constraint**. This is a more defensible position: "To be the same artifact, an object must be *traceably* the same artifact."
  4.  **More Cases:** You need a case where the evidence *cannot* be found. If the records are burned, is the ship indeterminate? If yes, you have a strong argument for ontic indeterminacy. If no, you retreat to epistemology.

  ### General Assessment

  **Is this a relabeling of a familiar epistemological point?**
  Currently, **yes, it risks being read that way.** The draft argues that our *judgments* change with evidence. Most philosophers accept this. To make it a metaphysical contribution, you must argue that the *identity conditions themselves* for artifacts include an epistemic clause (e.g., "x is the same ship as y only if there is a verifiable causal chain").

  **Recommendation:**
  Pivot the argument. Do not argue that *metaphysics* is replaced by *history*. Argue that the **metaphysics of artifacts is inherently historical/epistemic** in a way that the metaphysics of natural kinds is not.
  *   *Current Thesis:* Identity talk is historical inquiry rather than metaphysics.
  *   *Stronger Thesis:* The metaphysics of artifact identity supervenes on epistemic accessibility to history, whereas natural kind identity does not.

  This preserves your insight (the 2010 case matters) but shields you from the "you're just talking about knowledge" objection by grounding it in the specific ontology of human-made objects.

  **Final Verdict:** The core insight is valuable, but the draft currently presents an epistemological observation as a metaphysical conclusion. Tighten the link between *artifact nature* and *epistemic dependence* to make the argument stick.
