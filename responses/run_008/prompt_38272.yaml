      *   *Critic's Attack:* "You are confusing the *criteria* for identity with the *evidence* for meeting those criteria." The critic will argue that material continuity is a metaphysical relation, not an evidentiary one. The discovery in 2010 reveals the metaphysical relation existed all along.
      *   *Another Attack:* The "40% original" metric is arbitrary. Why does that matter for identity? The sortal view says *functional/organizational* continuity matters, not atomic composition. The user assumes material composition matters without fully arguing why the sortal view is insufficient there.

