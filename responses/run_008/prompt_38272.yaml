      *   **Thought Experiment:** Museum restores ship (1890-1980). In 2010, dendrochronology reveals 40% of "new" wood was actually "old" scavenged wood from 1905.
      *   **Implication:** Identity-relevant predicates (e.g., "mostly original," "continuous material continuity") flip in 2010 without the ship changing physically.
      *   **Conclusions:**
          1.  Sortal defusal is incomplete (depends on revisable narrative).
          2.  Artifact identity is like historical inquiry (answerable to evidence), not metaphysics.
          3.  Realism about artifact identity is in trouble (the object doesn't settle the truth).

  3.  **Evaluate Question 1: Retroactivity vs. Epistemology:**
      *   *The User's Worry:* Is this just saying "we learned new facts"?
      *   *My Analysis:* The standard realist/conventionalist distinction usually assumes metaphysical facts are fixed. If the user claims the *truth value* of identity statements changes retroactively based on evidence, that's a strong claim (anti-realism/verificationism). If they claim only our *justification* changes, it's standard epistemology.
      *   *The Draft's Phrasing:* "Whether the ship is 'mostly original' changed in 2010, while the ship did not." This suggests truth-value change, not just epistemic access.
      *   *Critique:* This is the crux. A realist will say the fact was always there; we just didn't know it. To threaten the conventionalist, the user needs to argue that *there was no fact of the matter* until the evidence arrived, or that the criteria for identity are inherently evidentiary. The draft leans towards the latter but needs to be sharper to avoid the "you're just talking about knowledge" objection.

  4.  **Evaluate Question 2: History vs. Semantics:**
      *   *The User's Worry:* Conflating semantics with warranted assertion.
      *   *My Analysis:* The critic's likely reply (which the user anticipates) is the standard realist move: Truth is timeless. "The ship was mostly original in 1980" was true then, we just found out in 2010.
      *   *Counter-argument:* If identity is *constituted* by historical narrative (as the user suggests), and narratives are revisable constructs, then identity might be revisable. But this risks collapsing into social constructivism.
