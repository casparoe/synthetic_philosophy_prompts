answer: |-
  You are right to be suspicious. Your friend is making a classic category mistake—specifically, she is conflating a semantic distinction about *terms* with an ontological claim about *kinds*. She is using a logical puzzle about reference to prove a sociological point about reality.

  Gongsun Long (c. 320–250 BCE) of the School of Names (*Ming Jia*) was indeed obsessed with the relationship between *ming* (names/terms) and *shi* (actualities/reality). However, his project was generally to rectify names so they corresponded *more* precisely to reality, not to show that reality is malleable to convention.

  Here is a breakdown of the distinct precise claims "A white horse is not a horse" (*Bai ma fei ma*) could be expressing, evaluated for truth and their utility to your friend's argument.

  ### 1. The Extensional Reading (Set Theory)
  **The Claim:** The set of white horses is not identical to the set of horses.
  *   **Formalization:** $\{x \mid White(x) \land Horse(x)\} \neq \{x \mid Horse(x)\}$
  *   **Analysis:** This is mathematically trivial. The set of horses includes black horses, brown horses, etc. The set of white horses is a proper subset. Therefore, the two sets are not identical.
  *   **Verdict:** **Trivially True.**
  *   **Does it support your friend?** **No.** Showing that the *extension* of "white horse" is narrower than "horse" does not prove that the category "horse" is invented. It merely proves that adding a modifier restricts the reference. It says nothing about whether "horse" itself is a natural kind or a social construct.

  ### 2. The Intensional Reading (Meaning/Criteria)
  **The Claim:** The concept (or intension) of "white horse" is not identical to the concept of "horse."
  *   **Analysis:** To apply the term "horse," one looks for a certain shape/form. To apply "white horse," one looks for that shape *plus* a certain color. The criteria for application are different. Therefore, the *meaning* of the compound term is not the same as the simple term.
  *   **Verdict:** **Substantive and True.**
  *   **Does it support your friend?** **No.** This shows that language is compositional (meanings combine). It does not show that the underlying categories are arbitrary. One could argue that shape and color are objective features of the world, and our terms track them precisely. This actually suggests language *can* discover distinctions in the world, rather than inventing them.

  ### 3. The Identity Reading (Logic of the Copula)
  **The Claim:** The term "white horse" is not synonymous with the term "horse."
  *   **Analysis:** In Classical Chinese, the negative *fei* (非) often functions as "is not identical to" or "is not the same as," rather than the English "is not a member of the class." If we read the sentence as "White Horse $\neq$ Horse" (identity) rather than "White Horse $\notin$ Horse" (membership), the statement is logically sound.
  *   **Verdict:** **True (under this translation).**
  *   **Does it support your friend?** **No.** This is a point about linguistic synonymy. Even if "white horse" isn't synonymous with "horse," a white horse can still be an *instance* of a horse. Your friend needs to prove that instances don't belong to kinds, not that names aren't synonyms.

  ### 4. The Metaphysical Reading (Platonic Realism)
  **The Claim:** The Universal "Whiteness" combined with the Universal "Horseness" is not identical to the Universal "Horseness" alone.
  *   **Analysis:** Many scholars interpret Gongsun Long as a realist about universals. He argues that "white" and "horse" are separate abstract entities. When they combine, they form a new complex entity. The complex entity is not the same as the simple entity.
  *   **Verdict:** **Defensible (within his metaphysical system).**
  *   **Does it support your friend?** **Actually, it undermines her.** This reading suggests Gongsun Long believed in *objective, mind-independent universals*. If "Horseness" and "Whiteness" are real, distinct entities that combine according to strict rules, then categories are **discovered**, not invented. This is the opposite of social constructionism; it is a form of hard realism.

  ### 5. The Constructivist Reading (Your Friend's Interpretation)
  **The Claim:** The boundary between what counts as a "horse" and what counts as a "white horse" is arbitrary, demonstrating that all categorization is a matter of linguistic convention rather than natural fact.
  *   **Analysis:** This reading assumes that because we *can* distinguish the terms, the distinction is imposed by us rather than found in the world. It treats the paradox as evidence that language cuts reality up however it likes.
  *   **Verdict:** **False (as an interpretation of Gongsun Long) / Unsubstantiated (as a general claim).**
  *   **Does it support your friend?** **Yes, but only by force.** This is the only reading that gets her to her conclusion, but it requires ignoring the text's likely intent (precision in naming) and making a logical leap. Just because a distinction is *linguistic* doesn't mean it isn't *grounded*. We distinguish "water" from "ice" linguistically, but the phase change is physical. Distinguishing "white horse" from "horse" tracks a real difference in properties (color), even if the *decision* to name it separately is conventional.

  ### The Diagnosis: Where She is Smuggling

  Your friend is smuggling in a premise she hasn't earned: **The Fallacy of Linguistic Idealism.**

  She is arguing:
  1.  Linguistic categories are distinct (True: "white horse" $\neq$ "horse").
  2.  Therefore, the boundaries between categories are not found in nature (False Non Sequitur).

  Gongsun Long's point in the *White Horse Dialogue* is generally understood as a warning against sloppy language. He is arguing that if you ask for a "horse," a yellow or black one will do; if you ask for a "white horse," a yellow or black one will *not* do. Therefore, "white horse" is not "horse."

  His goal was the **Rectification of Names** (*Zheng Ming*): ensuring that social and political terms match reality precisely so that governance works. He was a conservative realist who worried that if we let "white horse" count as just "horse" in all contexts, we lose the ability to make precise distinctions required for law and ritual.

  ### Conclusion

  You can tell your friend this:

  The readings of "A white horse is not a horse" that are **true** (Extensional, Intensional, Identity) are merely logical or semantic observations about how modifiers work. They do not entail that the underlying kinds are invented.

  The reading that **would** support her conclusion (that categories are arbitrary conventions) is **false** to the text. Gongsun Long wasn't saying categories are fake; he was saying they are *rigid* and *distinct*. He believed "Horse" and "White" were real universals that combined in specific ways.

  By using Gongsun Long to argue for social constructionism, she is ironically using an ancient **realist** to argue for **anti-realism**. The paradox shows that language is precise, not that reality is fluid.
