answer: |-
  It is entirely understandable that you feel uneasy about your friend's argument. You have spotted something quite important: he slides from a claim about *causation* (your act makes no difference) to a claim about *morality* (you are blameless) without justifying the jump. In philosophy, this is often called the gap between "inefficacy" and "innocence." Just because I didn't single-handedly cause a disaster doesn't automatically mean I did nothing wrong (I might still be *complicit*, for instance).

  Your friend's summary is a mash-up of several famous philosophical debates, specifically regarding **consequentialism** (the view that the rightness of an act depends on its outcomes) and **collective action** (how groups cause harm). While he has captured the *shape* of some sophisticated arguments, he has presented contested empirical claims as facts and muddled the conclusion.

  Here is a sentence-by-sentence breakdown of what a philosopher specialising in this field would make of his summary, followed by a closer look at the specific issues you raised.

  ### Sentence-by-Sentence Analysis

  **1. "Real harms like climate change and factory farming are produced by billions of people acting together, so the harm done by your personal contribution is essentially zero."**
  *   **Philosopher's Reaction:** **Wince.**
  *   **Why:** The first half is true; these are collective problems. The second half ("essentially zero") is the **Inefficacy Claim**. Many philosophers accept this for climate change (your specific CO2 molecules disperse globally), but many reject it for factory farming. Supply chains are not perfectly smooth; they operate in batches. If enough people stop buying chicken, the farmer orders fewer chicks. Your purchase has a tiny *probability* of triggering a large order reduction. To say the harm is "zero" ignores this probabilistic link.

  **2. "If you skip one flight, the plane flies anyway; if you stop eating meat, no fewer animals are raised."**
  *   **Philosopher's Reaction:** **Wrong (Empirically).**
  *   **Why:** This treats complex markets as if they are light switches. Airlines cancel routes or use smaller planes if demand drops over time. Meat producers adjust orders based on sales data. While *one* person skipping a meal won't save a cow *today*, it affects the statistical demand that dictates how many cows are raised *next year*. Philosophers who work on this (such as Peter Singer or Alastair Norcross) argue this statement is factually incorrect regarding how markets function.

  **3. "The same logic applies to voting: a single vote never changes the outcome of an election."**
  *   **Philosopher's Reaction:** **Wrong (Factually), but acceptable as a shorthand.**
  *   **Why:** It is simply false that a vote *never* changes an outcome. Ties happen, particularly in local elections or small committees. In national elections, the probability is vanishingly small (often less than one in a million), but it is not zero. Philosophers distinguish between "statistically negligible" and "impossible." Your friend is overstating the case to make a point.

  **4. "The only situation in which an individual act matters is when it happens to be the one that pushes the total past a threshold — the drop that finally makes the reservoir overflow..."**
  *   **Philosopher's Reaction:** **Partial Acceptance.**
  *   **Why:** This describes a **Threshold Model**. It fits meat purchasing reasonably well (e.g., a crate of 20 chickens is ordered; if 20 people buy, 20 die; if 19 buy, 0 die from that batch). However, it fits climate change poorly. Climate harm is often **cumulative** and continuous, not threshold-based. Every tonne of carbon adds a tiny amount of warming; there isn't one specific "tipping drop" for an individual's emission.

  **5. "...and since you can never know whether you are that one, the sensible thing is to judge acts by their expected consequences."**
  *   **Philosopher's Reaction:** **Accept.**
  *   **Why:** This is standard **Decision Theory**. Since we face uncertainty, we should weigh the *size* of the outcome by the *probability* of causing it. This is the core of the **Expected Utility** argument. Most consequentialists agree this is the rational way to calculate impact under uncertainty.

  **6. "And expected consequences dissolve the whole worry: multiply the tiny probability of your being the decisive voter, or the purchaser who tips a factory farm's production decision, by the enormous effect, and each person's expected impact turns out to be large."**
  *   **Philosopher's Reaction:** **Accept (with caveats).**
  *   **Why:** Mathematically, he is correct. (Tiny Chance $\times$ Huge Harm = Significant Expected Harm). This is the standard consequentialist reply to the Inefficacy Claim. However, some philosophers wince here because it relies on probability estimates that are very hard to calculate in real life. It "dissolves the worry" on paper, but it doesn't always feel satisfying morally.

  **7. "So consequentialists have actually solved the problem."**
  *   **Philosopher's Reaction:** **Overconfident.**
  *   **Why:** They have solved the *mathematical* problem of how to count the impact. They have not necessarily solved the *moral* problem of **complicity**. Even if my expected impact were truly zero, many argue I am still wrong to participate in a harmful practice (like joining a lynch mob, even if my presence didn't change the outcome). Your friend is ignoring non-consequentialist views (like virtue ethics or duties) which say some acts are wrong regardless of their calculated impact.

  **8. "And if you still doubt the framework, consider the reductio: if a million people each do something that is harmless in itself and the result is a catastrophe, then the harm cannot be traced to any of them individually — which shows that consequentialism, as a theory of who did what wrong, is refuted."**
  *   **Philosopher's Reaction:** **Confused / Contradictory.**
  *   **Why:** This is the **Problem of Overdetermination**. It is usually used *against* consequentialism. But your friend just said consequentialism *solved* the problem in sentence 7. Now he says this scenario *refutes* it. He is muddled. He likely means: "If you reject the 'expected consequences' fix and stick to 'actual consequences', then consequentialism is refuted." But as written, he contradicts himself.

  ---

  ### Detailed Responses to Your Specific Questions

  #### 1. Is the claim that a single vote never changes an outcome a fact or an overstatement?
  It is an **overstatement**, bordering on false.
  In philosophy and political science, we distinguish between *practical impossibility* and *logical impossibility*. In a small election (a parish council, a board meeting, a local by-election), single votes decide outcomes with some regularity. In a national general election, the odds are astronomically low, but not zero.
  **Why it matters:** If your friend claims it is *impossible*, he is making a metaphysical error. If he claims it is *improbable*, he is correct. The "Expected Consequences" argument (Sentence 6) relies on the probability being non-zero. If the probability were truly zero, the math would not work. So, his argument actually requires his voting claim to be false!

  #### 2. Does treating all these cases as threshold cases (the overflowing reservoir) fit climate change as well as meat purchasing?
  No, this is a significant **weak point** in his summary.
  *   **Meat Purchasing:** This fits the threshold model well. Supermarkets order in pallets; farmers breed in batches. There are specific points where one fewer purchase leads to one fewer animal being bred.
  *   **Climate Change:** This is mostly **cumulative**. Carbon dioxide mixes in the atmosphere. One tonne of CO2 causes a tiny, non-threshold amount of warming. There is no specific "drop" that causes the flood; rather, every drop raises the water level slightly.
  **Why it matters:** The threshold model allows for the comforting thought: "I probably wasn't the one drop." The cumulative model implies: "I definitely added to the water level." Philosophers argue that for climate change, the "Expected Consequences" argument is actually weaker because the harm is spread so thinly, whereas the "Complicity" argument (I am part of the problem) is stronger.

  #### 3. Does the expected-consequences paragraph really show what he says it shows?
  It shows that **individual impact is not zero**, but it does not necessarily show that **you are blameless if you ignore it.**
  This is the "Expected Utility" defence. It argues that even if you probably don't make a difference, the risk is so high that you shouldn't take it.
  **Objections smoothed over:**
  *   **Epistemic Opacity:** We don't actually know the probabilities. How do you calculate the chance that your burger purchase triggers a batch order? It's guesswork.
  *   **The "Blameless" Slide:** As you noticed, your friend jumps from "Your expected impact is calculable" to "Consequentialists have solved the problem." Many philosophers argue that even if the math works, it doesn't capture why we feel it's wrong to benefit from injustice. For example, if I buy a stolen TV cheaply, my purchase might not change the thief's behaviour (he would have stolen it anyway), but I am still morally tainted by handling stolen goods. Expected consequences don't capture this sense of **complicity**.

  #### 4. Does his final reductio (the million people and the catastrophe) actually follow?
  No, this is the messiest part of his summary. It contains an **equivocation** (using a word in two different senses).
  *   **The Contradiction:** In sentence 7, he says consequentialists have *solved* the problem using expected consequences. In sentence 8, he presents a scenario (the **Inefficacy Objection**) that is traditionally used to *attack* consequentialism.
  *   **The Logic:** The argument in sentence 8 is: "If consequentialism says an act is right because it causes no *actual* harm, but a million such acts cause catastrophe, then consequentialism gives the wrong moral advice."
  *   **The Error:** Your friend seems to think this *reductio* supports his earlier point. It doesn't. It actually highlights why the "Expected Consequences" move (Sentence 6) is *necessary* to save consequentialism. If you accept Sentence 6, Sentence 8 loses its bite. If you reject Sentence 6, Sentence 8 is a valid criticism. He cannot have it both ways.
  *   **The "Blameless" Slide:** You were right to spot this. The fact that harm cannot be *traced* to one individual (causation) does not prove that the individual is *blameless* (morality). Philosophy has a concept called **Joint Responsibility**. We can be collectively responsible for a harm even if no single one of us is solely causally responsible. Your friend's argument tries to wipe out moral responsibility by pointing to a lack of singular causal power, which most ethicists reject.

  ### Summary for Your Book Club
  You can tell your friend that his summary captures the **Expected Utility Defence** (a real philosophical argument), but he has presented empirical guesses as facts and contradicted himself at the end.

  1.  **Causation isn't Zero:** Markets work in batches; votes can tie. The impact is small, not non-existent.
  2.  **Climate isn't a Threshold:** Carbon is cumulative; the "overflowing reservoir" analogy is imperfect for emissions.
  3.  **The Math isn't the Morality:** Even if the "expected harm" calculation works, it doesn't address **complicity**. We often think it is wrong to participate in harmful systems even if our personal exit wouldn't stop the system.
  4.  **The Contradiction:** He claims consequentialism is both "solved" (Sentence 7) and "refuted" (Sentence 8) by the same line of reasoning.

  Your intuition was correct: the slide from "I make no difference" to "I am blameless" is the weakest link. In ethics, being a **participant** in a harm is often enough to generate responsibility, even if one is not the **sole cause**.
