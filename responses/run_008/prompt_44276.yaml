answer: |-
  The apparent conflict between deflationism about truth and the explanationist defense of scientific realism is genuine only if deflationism is restricted to a narrow disquotational schema, but dissolves once truth is understood as a generalized expressive device capable of sustaining explanatory discourse without denoting a substantive property.

  **1. The Dissertation Question**

  The central question driving this dissertation is: Does the explanatory success of scientific theories require truth to be a substantive property, or can a revised deflationary account sustain the necessary explanatory generalizations without collapsing into realism? This question is framed to admit a negative answer; it is possible that upon rigorous analysis, the explanatory role demanded by scientific realism cannot be fulfilled by any property lacking causal power or robust correspondence relations, in which case deflationism would be incompatible with a plausible philosophy of science. Conversely, it is possible that the demand for a substantive property arises from a category mistake regarding the logical function of truth-predicates, in which case deflationism survives intact. The dissertation aims to determine which of these outcomes obtains by analyzing the logical structure of explanatory claims involving truth.

  **2. The Gap in Existing Deflationist Replies**

  The primary objection to deflationism from scientific realism is the Explanationist Argument (often associated with the No-Miracles Argument). Realists argue that the predictive success of our best scientific theories is best explained by the truth of those theories. If truth is merely a logical device for disquotation or generalization, as deflationists claim, it cannot serve as an explanans in a substantive causal or structural explanation.

  Standard deflationist replies typically proceed by disquoting the explanatory claim. When the realist says, "The truth of Theory T explains its success," the deflationist translates this to "The fact that T's constituent sentences obtain explains the success." While logically valid within a deflationary framework, this move is often unsatisfying because it appears to change the subject. The realist is not merely asking why specific predictions came true; they are asking why *true* theories, as a class, succeed where false ones fail. They seek an explanation that appeals to a unifying property shared by successful theories. The standard minimalist move dissolves the unifying property into a list of individual instances.

  This dissertation argues that existing replies leave the question open because they fail to distinguish between truth as a *logical operator* and truth as a *normative aim of inquiry*. By treating the deflationist reply solely as a logical reduction, both sides overlook the possibility that the explanatory work is done by the expressive capacity of the truth predicate to generalize over infinite domains, rather than by a metaphysical property. However, this defense remains untested against cases where disquotation is pragmatically awkward or logically complex. Therefore, the existing literature has not yet determined whether deflationism can sustain the *generalizations* required by scientific explanation without secretly presupposing a substantive notion of truth-as-aim.

  **3. Method and Chapter Outline**

  The project will proceed through five chapters, moving from the statement of the problem to stress-testing the deflationary account against hard cases, and finally to a synthesis.

  *Chapter 1: The Explanationist Objection and the Deflationist Constraint.*
  This chapter will formalize the Explanationist Argument against deflationism. It will distinguish between "local" explanations (why this specific prediction worked) and "global" explanations (why true theories generally work). I will map the precise point where the deflationist claims the realist is making a category error, establishing the baseline definitions of "substantive property" and "logical device" that will be used throughout the dissertation.

  *Chapter 2: The Limits of Disquotation.*
  Here I will analyze the standard deflationist strategy of disquoting explanatory claims. I will argue that while disquotation works for individual instances, it struggles to capture the modal force of the realist's claim (i.e., that it is *because* they are true that they succeed, not just that they succeed). I will examine whether the deflationist can recover this modal force using only logical resources, or if this requires smuggling in a substantive notion of reference.

  *Chapter 3: Truth as Generalization vs. Truth as Aim.*
  This chapter develops the core hypothesis: that the conflict rests on sliding between truth as a device for generalization and truth as a target property. I will construct a model where deflationism accounts for the "target" aspect not as a metaphysical property but as a normative constraint on assertion and inference. The goal is to show that one can aim at truth (in the sense of trying to assert only what satisfies the disquotation schema) without believing truth is a substantive property that does causal work.

  *Chapter 4: Stress-Testing the Generalization Device.*
  To ensure the proposed model is robust, I will apply the generalization-device reading to three hard cases where disquotational paraphrases feel least natural.
  *   **Mathematical Truth:** Since mathematical statements do not seem to have causal predictive success in the empirical sense, does the deflationist account of truth-as-generalization hold when there is no empirical "success" to explain?
  *   **Pejorative-Laden Claims:** Statements involving thick ethical concepts or pejoratives often resist simple disquotation because the truth-conditions are entangled with expressive content. I will test whether the deflationist can generalize over these without conceding substantive moral properties.
  *   **Statements about the Far Future:** Claims about the distant future cannot be currently verified or used to build instruments. If truth is a device for generalization, what is it generalizing over in cases where verification is impossible? This tests whether deflationism covertly relies on a substantive notion of "fitting the world" independent of our expressive capabilities.

  *Chapter 5: Synthesis and Implications.*
  The final chapter will integrate the findings. If the hard cases show that deflationism fails to account for the explanatory role without substantiveness, I will argue for a "quietist" concession where deflationism accepts a minimal explanatory role without full-blown realism. If the hard cases are resolved, I will demonstrate how the revised deflationary account neutralizes the No-Miracles Argument. The conclusion will outline the consequences for both metaphysics and philosophy of science.

  **4. Completion Criteria and Failure Modes**

  A completed dissertation will offer a definitive answer to whether the Explanationist Argument succeeds against deflationism. Success is defined as providing a coherent deflationary account that explains why true theories succeed without invoking truth as a substantive property.

  *Failure Mode A (Strong Failure):* The project demonstrates that deflationism is incompatible with scientific realism. This would mean the distinction between "truth as device" and "truth as aim" is untenable, and any account capable of handling the explanatory demand must be substantive. This is a philosophically significant result, effectively refuting a major contemporary position.
  *Failure Mode B (Weak Failure):* The project shows that the conflict is verbal, but the proposed resolution requires modifying deflationism so heavily that it is no longer recognizable as deflationism (e.g., by accepting robust normative properties).
  *Salvageable Thesis:* Even if the primary hypothesis fails, the dissertation will be salvageable if it successfully isolates the precise point of incompatibility. A thesis proving that deflationists *must* concede some explanatory power to truth (a "modest substantivism") is a viable contribution. Similarly, a thesis proving that scientific realists *must* abandon the explanationist argument to remain coherent with logic is also viable. The project fails only if it remains inconclusive about whether the conflict is genuine or verbal.

  **5. Feasibility and Scope Assessment**

  Completing this dissertation in a nine-month fellowship period is highly ambitious and risks superficiality, particularly regarding Chapter 4. The technical work required to properly analyze the logical structure of explanatory claims in Chapter 2 and 3 is dense, and the "hard cases" in Chapter 4 each represent sub-fields (philosophy of math, metaethics, philosophy of time) that could themselves sustain dissertations.

  To make this doable in nine months, I recommend cutting Chapter 4 down significantly. Rather than treating mathematical truth, pejoratives, and future statements as equal pillars, I should select only the case most directly relevant to scientific realism. Statements about the far future are the most pertinent to the No-Miracles Argument, as scientific realism often hinges on claims about unobservables which function similarly to future claims in terms of verification gaps. Mathematical truth and pejoratives, while interesting, may be distractions that dilute the core argument about scientific explanation.

  Alternatively, if the fellowship is intended to support the *writing* of a dissertation based on prior research, the scope is manageable. However, if this period includes the bulk of the research and argument construction, I must narrow the focus to Chapters 2 and 3 exclusively. The core contribution lies in the distinction between truth-as-device and truth-as-aim; the hard cases are illustrative, not foundational. Cutting Chapter 4 ensures a rigorous treatment of the central conflict rather than a survey of applications. I will proceed with the assumption that the fellowship supports the writing phase, but I will structure the work so that Chapter 4 can be jettisoned if time runs short, leaving a coherent four-chapter thesis focused squarely on the realism objection.
