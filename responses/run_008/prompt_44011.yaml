answer: |-
  Here is a sequence of ten questions designed to move from ontological clarification to normative implications, progressively narrowing the space available for the "identity is not binary" deflection.

  ### Phase 1: Ontology and Individuation
  *These first three questions allow her to establish the gradient view, but begin to demand precise definitions of the "pattern."*

  **1. The Model/Instance Distinction**
  "You argue that those who knew the deceased host a *partial instance* of their self-pattern, not merely a *model* of them. But cognitively, when I simulate your choices or recall your voice, I am running an internal representation. What is the ontological difference between a high-fidelity simulation of a person and a fragment of their selfhood? At what point does the isomorphism become identity?"
  *(Strategic Intent: Addresses Pressure Point 1. It forces her to define the threshold where 'representation' becomes 'instantiation' without relying on the binary deflection yet.)*

  **2. The Sherlock Holmes Problem**
  "Millions of readers have rich, detailed, self-referential models of Sherlock Holmes in their heads. They can simulate his reasoning and feel grief at his death. On your view, are they hosting fragments of Sherlock Holmes? If not, why does the causal history of a biological brain grant ontological status to a pattern that a fictional character's pattern lacks?"
  *(Strategic Intent: Addresses Pressure Point 2. It tests individuation. If she says 'no,' she must explain why causal history matters for patterns. If she says 'yes,' she risks trivializing the view.)*

  **3. The Metric of Selfhood**
  "If personal identity is a matter of degree, we need a metric. When you say a spouse is 'partially present' in a survivor, what are we measuring? Is it the volume of shared memory, the complexity of the predictive model, or the causal influence on the survivor's behavior? How would we quantify the 'amount' of person remaining?"
  *(Strategic Intent: Addresses Pressure Point 3. It accepts the gradient but demands the resources to describe it. It makes the 'binary deflection' harder by asking for the units of the gradient.)*

  ### Phase 2: Persistence and Conflict
  *These questions accept the gradient but press on the logical consequences of fragmentation, making it difficult to dismiss contradictions as merely 'binary worries.'*

  **4. The Sorites of Forgetting**
  "Let's apply that metric to time. As my memory of the deceased fades over decades, the pattern in my brain degrades. Is there a lower bound where the fragment ceases to be *them* and becomes merely *a memory of them*? Or is it a smooth asymptote toward zero? If the latter, does a 0.01% fragment still count as numerical identity?"
  *(Strategic Intent: Addresses Pressure Point 3. It pushes the Sorites paradox. If she refuses a threshold, she must explain how practical identity survives near-zero instantiation.)*

  **5. Uploads and Concentration**
  "Standard patternists argue that a perfect digital upload preserves the person. On your distributed view, would a single, perfect upload be 'more' of the person than a thousand fragmented, imperfect models in the minds of loved ones? Does the coherence of the pattern matter more than its distribution?"
  *(Strategic Intent: Addresses Pressure Point 4. It contrasts her view with standard patternism. It forces her to weigh 'fidelity' against 'distribution'.)*

  **6. Contradictory Fragments**
  "If the self is distributed, different hosts will instantiate conflicting versions of the person. I might host a fragment that remembers him as generous; his business partner hosts a fragment that remembers him as cruel. Are these contradictory truths about the same pattern? Can the same person be both generous and cruel in reality, or does the fragmentation dissolve the contradiction?"
  *(Strategic Intent: Extends Pressure Point 2 & 4. It tests whether the view can handle logical inconsistency across fragments without collapsing into relativism.)*

  ### Phase 3: Normativity and Action
  *Here the deflection becomes difficult. Moral obligations often require binary decisions (act or don't act), forcing her to find thresholds within the gradient.*

  **7. Interests of the Fragment**
  "You take this to be a factual claim, not just consolation. But for a fact to matter morally, the entity usually needs interests. Can a 10% pattern fragment have interests? If the fragment in my mind is too thin to suffer or desire, can it be harmed by my actions?"
  *(Strategic Intent: Addresses Pressure Point 5. It challenges the normative grip of the view. If fragments have no interests, obligations to them are weak.)*

  **8. The Obligation to Remember**
  "If letting a memory fade reduces the instantiation of the deceased, is forgetting a moral failure? Do we owe it to the dead to keep their pattern active in us? If I choose to move on and let the pattern degrade, am I harming *them*?"
  *(Strategic Intent: Addresses Pressure Point 5. It forces a binary moral choice [obligation vs. no obligation] based on a gradient ontology.)*

  **9. The Limit of Reframing**
  "You often note that these questions treat identity as binary when your view dissolves the binary. I want to press on that methodological move. Is there *any* proposition about the self that your view treats as strictly true or false? Or is 'factuality' itself a gradient in your ontology? If everything is a matter of degree, what anchors the view as a scientific claim rather than a metaphor?"
  *(Strategic Intent: The Trap. It directly addresses the deflection constraint. It forces her to admit either that some binaries exist (undermining the deflection) or that factuality is gradient (risking unfalsifiability).)*

  ### Phase 4: Falsification
  *The closing question tests the scientific status of the claim.*

  **10. The Falsification Condition**
  "Finally, what would count against your view? Is there a specific finding in cognitive science or a thought experiment outcome that would prove the self-pattern *cannot* be distributed in the way you describe? What observation would force you to abandon the claim that the dead persist in us?"

  **Expected Follow-Up:**
  *If she answers that nothing could falsify it (e.g., "It's a framework, not a hypothesis"):*
  "If the view is unfalsifiable, in what sense is it a 'factual claim' about personal identity rather than a normative stance on how we *ought* to treat the dead? How do we distinguish your ontology from a very sophisticated poetic metaphor?"

  *If she answers with a neural condition (e.g., "If we find the self is localized"):*
  "Given that current neuroscience already suggests the self is distributed across networks rather than a single locus, hasn't that condition already been met? Why does the distribution *within* one brain support distribution *across* multiple brains?"
