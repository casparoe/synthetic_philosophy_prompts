          *   *Revisionist:* If I stay, is it irrational?
          *   *The "Self-Signaling" Loophole:* Even in anonymity, I know. So it affects future self-trust.
          *   *The Hard Case:* A robot with no memory of pain/pleasure from past decisions, only current state.
          *   *Better Formalization:* History-Dependent Utility vs. State-Dependent Utility.
          *   *Key Distinction:* **Instrumental vs. Intrinsic.** Is the sunk cost a *tool* (instrumental) to achieve a future goal, or is the avoidance of waste an *end* in itself (intrinsic)?
      *   **Diagnosis of the Stalemate:**
