answer: |-
  This stalemate is not only predictable; it is structurally inevitable given how the question is currently framed. You are correct that your group is talking past one another, but the diagnosis requires more precision than "conceptual vs. empirical." The disagreement is not merely about idealization; it is about the **domain of the utility function**.

  Here is the diagnostic breakdown you need to unstick the group, distinguishing settled facts from contested models, spelling out the implicit formalisms, and identifying where progress is actually possible.

  ### 1. Settled vs. Contested

  First, clear the air on what is actually agreed upon.

  *   **Settled (Descriptive):** Humans systematically violate the "ignore sunk costs" norm. The Arkes & Blumer (1985) theater ticket experiment and subsequent replication literature confirm that people are more likely to consume a good (sit through a bad play, finish a bad meal) if they have paid for it, even when the cost is unrecoverable and anonymity is preserved. This is a robust empirical fact.
  *   **Settled (Axiomatic):** In a standard Expected Utility Theory (EUT) framework with time-separable preferences, past costs cannot enter the maximization problem. If $U = \sum \delta^t u(c_t)$, then $c_{t-k}$ is a constant and drops out of the derivative. To say sunk costs matter *within this specific mathematical framework* is a calculation error.
  *   **Contested (Normative):** Does the descriptive violation represent a **bug** (a cognitive error leading to suboptimal outcomes) or a **feature** (a heuristic that optimizes for a broader utility function that includes history, reputation, or self-concept)?

  The stalemate exists because the Textbook faction is defending the *Axiomatic* claim, while the Revisionist faction is defending the *Normative* claim, but both are using the phrase "rational agent."

  ### 2. The Implicit Models

  To stop the circles, you must force each side to write down their utility function. They are optimizing different things.

  #### Model A: The Consequentialist (Textbook)
  *   **Utility Domain:** Outcomes/States of the World ($W$).
  *   **Function:** $U_t = E[\sum_{k=0}^{\infty} \delta^k v(w_{t+k})]$.
  *   **Assumption:** Preferences are **history-independent**. The agent cares about where they end up, not how they got there. "Waste" is not an intrinsic disutility; it is only instrumentally bad because it reduces resources available for future $w$.
  *   **Commitment:** If you honor a sunk cost, you are mathematically double-counting. You paid $X$ (past), and now you pay time/effort $Y$ (future) to get benefit $Z$. The $X$ is gone. If $Z - Y < 0$, you quit. If you stay because of $X$, you are maximizing $Z - Y - X$, which is incoherent because $X$ is not a variable you can influence.
  *   **View of Revisionists:** You are smuggling "reputation" or "self-esteem" into $v(w)$. If you do that, you aren't honoring the sunk cost; you are purchasing a future good (reputation).

  #### Model B: The History-Dependent / Expressive (Revisionist)
  *   **Utility Domain:** Trajectories/Actions ($A$) and Outcomes ($W$).
  *   **Function:** $U_t = E[\sum \delta^k v(w_{t+k}, a_{t}, a_{t-1}, ..., a_{t-k})]$.
  *   **Assumption:** Preferences are **history-dependent** or **action-dependent**. The agent derives utility (or disutility) from the *consistency* of their actions over time, or from avoiding the label "wasteful."
  *   **Commitment:** "Waste aversion" is a legitimate preference, like a preference for fairness. If I feel pain from wasting resources, that pain is a *current* utility cost. Therefore, finishing the project minimizes total pain (future effort + current regret).
  *   **View of Textbookers:** You are arbitrarily restricting the domain of utility to "consequentialist states" to make the math clean, thereby defining away valid human preferences. Your model isn't "more rational"; it's just narrower.

  ### 3. The "Tautology" Charge

  The Revisionists are right to be annoyed by the Textbook reply ("That's just a forward-looking benefit!"), but the Textbookers are right that it matters *where* the benefit comes from.

  Here is the precise point of contention: **Is the disutility of waste intrinsic or instrumental?**

  *   **Instrumental (Textbook):** I hate wasting money because money is useful for *other things*. Once the money is gone, hating the waste helps me nothing.
  *   **Intrinsic (Revisionist):** I hate wasting money because "being a wasteful person" is a state I dislike, regardless of future purchasing power.

  If the Revisionist claims the benefit is "signaling to others," the Textbooker wins: that is a forward-looking consequence.
  If the Revisionist claims the benefit is "signaling to myself" (self-concept), the Textbooker *still* wins technically: that is a future psychological state ($w_{t+1}$ = "I feel competent").

  **The only way the Revisionist wins** is if they argue that the utility function *must* include the past action itself as an argument, independent of its effect on future states. This is a **non-consequentialist** ethics.
  *   *Example:* I keep a promise not because it makes me feel good (consequentialist), but because breaking it is inherently wrong (deontological).
  *   *Applied to Sunk Costs:* I finish the project not because it helps my reputation or self-esteem, but because "quitting after investing" is intrinsically disvalued in my preference ordering.

  **Diagnosis:** The Textbook faction assumes Consequentialism is a requirement of Rationality. The Revisionist faction assumes Consequentialism is an optional (and often poor) modeling choice. **This is a philosophical disagreement masquerading as a decision-theoretic one.**

  ### 4. Adjudication: The "Amnesiac" Test

  To move past verbal disputes, you need a scenario where the "redescribe-it-as-a-payoff" move fails. You need to isolate **Intrinsic Waste Aversion** from **Instrumental Self-Signaling**.

  **The Setup:**
  Construct a decision problem with three constraints:
  1.  **Anonymity:** No social reputation effects.
  2.  **Memory Wipe (Theoretical):** The agent will not remember the decision or the feeling of "waste" in the future. (Or, use a model where future utility is discounted to zero).
  3.  **No Learning:** The decision provides no information about the world or the agent's ability.

  **The Scenario:**
  You pay \$100 for a ticket to a VR experience. Upon entering, you realize the experience is neutral (utility = 0) but requires 1 hour of mild boredom (cost = -10 utils). You can leave immediately.
  *   *Condition A:* You are told, "If you leave, the \$100 is donated to a charity you like."
  *   *Condition B:* You are told, "If you leave, the \$100 is burned. No one knows. You will not remember this specific decision tomorrow."

  **The Prediction:**
  *   **Textbook (Consequentialist):** Indifferent between A and B regarding the stay/leave decision. The \$100 is gone. Compare 1 hour boredom (-10) vs 0. Leave in both cases.
  *   **Revisionist (Strong):** In Condition B, if the agent stays, it *cannot* be for reputation (anonymous) or future self-trust (memory wipe). If they stay, they are maximizing a utility function that explicitly penalizes the *history* of "money burned for nothing."

  **Why this adjudicates:**
  If subjects (or models) stay in Condition B, the Textbook claim that "sunk costs are irrelevant to rational choice" is false *unless* you define rationality as "Consequentialism."
  If the Textbookers say, "Well, a rational agent wouldn't have that preference," they are admitting their claim is normative (defining the "Good"), not structural (defining "Consistency").

  ### 5. What Counts as Progress?

  Your group will not resolve this by arguing about whether the wine collector is "really" rational. You need to shift the question.

  **1. Stop asking "Is it Rational?"**
  "Rationality" is doing too much work. It conflates *internal consistency* (Textbook) with *ecological fitness* (Revisionist).
  *   **Progress:** Agree to use **"Dynamic Consistency"** for the Textbook view and **"Adaptive Optimality"** for the Revisionist view.
  *   *Statement:* "Honoring sunk costs is dynamically inconsistent (Textbook), but may be adaptively optimal in environments with high switching costs or reputation tracking (Revisionist)."

  **2. Formalize the "Waste" Parameter.**
  Ask the Revisionists to write down the utility function that justifies the sunk cost.
  *   Bad Model: $U = Benefit - Cost + SunkCost$ (This is mathematically incoherent).
  *   Good Model: $U = Benefit - Cost - \lambda \cdot \mathbb{I}(Waste)$, where $\mathbb{I}(Waste)$ is an indicator function for "resources expended with no return."
  *   *Discussion:* Now you can debate the value of $\lambda$. Is $\lambda$ a bug (cognitive distortion) or a parameter (stable preference)?

  **3. The Empirical Pivot.**
  The psychologists in your room should challenge the economists on the **origin** of the preference.
  *   *Hypothesis:* Sunk cost sensitivity is a learned heuristic for environments where "quitting" usually signals "low quality" or "lack of commitment," and agents cannot perfectly distinguish between anonymous and public settings.
  *   *Test:* Do people honor sunk costs less when explicitly trained to distinguish anonymous vs. public contexts? If the bias persists in strict anonymity, it supports the "Intrinsic Preference" model. If it vanishes, it supports the "Overgeneralized Heuristic" model.

  ### Summary for the Group

  Tell them this:

  1.  **The Textbook faction** is defending **Dynamic Consistency**. They are right that if you change your plan solely because of a past cost, you are vulnerable to a "money pump" (Dutch Book) *if* your preferences are purely consequentialist.
  2.  **The Revisionist faction** is defending **Ecological Rationality**. They are right that in the real world, "quitting" is rarely costless (reputation, self-trust), and a heuristic of "don't waste" prevents exploitation in repeated games.
  3.  **The Stalemate** is because Textbookers treat Consequentialism as a law of logic, while Revisionists treat it as an empirical claim about human preferences.
  4.  **The Resolution:** Acknowledge that honoring sunk costs is **axiomatically irrational** (violates standard EUT) but potentially **instrumentally rational** (maximizes welfare in a complex social/biological environment).

  The progress lies in admitting that "Rationality" has two definitions here. One is about the *structure* of reasoning (consistency); the other is about the *success* of the agent (fitness). You cannot prove one wrong with the tools of the other.
