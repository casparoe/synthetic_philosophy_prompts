          *   *Model A (The Textbook/Axiomatic):* Consequentialism. Preferences are over *outcomes*, not *histories*. $U(outcome)$. Sunk costs are history.
          *   *Model B (The Revisionist/Process):* Preferences over *histories* or *trajectories*. $U(outcome, history)$. Or, bounded rationality where history proxies for hidden variables.
      *   **The "Tautology" Trap:** Address the revisionist claim that textbookers redefine everything as forward-looking.
          *   *Counter:* If the utility function includes "keeping promises to oneself," that *is* a forward-looking benefit. The textbook view holds *if* you define the utility function correctly.
          *   *Nuance:* The fight is about what belongs in the utility function. Is "wasting money" intrinsically bad (history-dependent), or is it bad only because it reduces future wealth (consequentialist)?
      *   **Adjudicating Scenario (The Formal Setup):**
