      *   *The Models:*
          *   *Economist Model:* Dynamic consistency, time-separable utility, Bayesian updating. $U_t = \sum \delta^k u(c_{t+k})$. Past $c_{t-k}$ drops out.
          *   *Psychologist/Behavioral Model:* Prospect theory (loss aversion), mental accounting, self-signaling, escalation of commitment. Utility depends on reference points set by past actions.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the frustration. Validate the user's guess (conceptual vs. empirical) but refine it. It's deeper: it's about the *domain of the utility function*.
      *   **Settled vs. Contested:**
