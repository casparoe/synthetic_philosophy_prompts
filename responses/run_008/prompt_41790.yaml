answer: |-
  Your roommate is going through a very classic phase. What you're describing is the "Intro to Theory" overdose, where nuanced philosophical arguments get distilled into hard-and-fast rules suitable for a video essay thumbnail. While his enthusiasm is commendable, his summary is a patchwork of conflations, category errors, and significant overstatements.

  Here is a piece-by-piece breakdown of his claims, how they hold up against actual literary theory, and where you stand on the *Frankenstein* argument.

  ### 1. "Wimsatt/Beardsley and Barthes proved intention has *no place* in interpretation."
  **Verdict: Overstatement.**

  *   **What the theorists actually said:**
      *   **Wimsatt & Beardsley ("The Intentional Fallacy," 1946):** They were New Critics. They argued that authorial intention is not the *standard* by which we judge a work's success. If an author intended to write a tragedy but wrote a comedy, the text is a comedy. They argued that if the intention isn't realized *in the text*, it doesn't count. They did not argue that knowing the intention is forbidden or impossible, only that it isn't the *authority* on meaning.
      *   **Roland Barthes ("The Death of the Author," 1967):** Barthes was attacking the idea of the Author as a theological figure—a single God-like source who dictates the "One True Meaning." He wanted to liberate the text so that the *Reader* could produce meaning.
  *   **The Roommate's Error:** He has turned a methodological caution ("don't rely *solely* on intention") into a prohibition ("intention is irrelevant"). Most anti-intentionalists admit that biographical context can be *useful*, they just deny that it is *definitive*.

  ### 2. "Everything relevant has to be public in the text."
  **Verdict: Conflation of New Criticism and Post-Structuralism.**

  *   **The Nuance:** This is actually a New Critical stance (Wimsatt/Beardsley), not really a Barthesian one. New Critics treated the poem as a self-contained artifact (a "well-wrought urn"). Barthes, however, was a post-structuralist; he cared about language, culture, and intertextuality (other texts), which are not strictly "in the text."
  *   **The Roommate's Error:** By insisting everything must be "public in the text," he is ignoring that language itself is a public system of codes that exists outside the book. But more importantly, this view excludes historical context, which most modern theorists (even non-intentionalists) accept as vital for understanding how a text would have been read *then* versus *now*.

  ### 3. "Therefore, all readings are equally valid."
  **Verdict: False. This is the biggest leap.**

  *   **The Theory:** Neither Barthes nor Wimsatt/Beardsley argued for "anything goes" relativism.
      *   Barthes wanted to empower the reader, but he still believed in the constraints of language. You cannot read *Moby Dick* as a cookbook and claim it's a valid interpretation of the linguistic signs provided.
      *   The idea that "all readings are equally valid" is a caricature of Reader-Response theory, often mocked as "the affective fallacy."
  *   **The Reality:** Texts have constraints. A reading must be arguable based on the evidence (the words on the page, the cultural codes, the historical context). If your roommate says, "This text means I should eat a sandwich," and there is no metaphorical or literal support in the text, his own theoretical framework should reject that reading. "Death of the Author" does not mean "Birth of the Anarchist Reader."

  ### 4. "Intentionalism is a museum piece; no serious theorist defends it."
  **Verdict: False.**

  *   **The Landscape:** Intentionalism never died; it went underground and evolved.
      *   **E.D. Hirsch:** Defended "validity in interpretation" based on authorial will for decades.
      *   **Actual Intentionalism:** Still dominant in history, biography, and law. (If you are in court, authorial intent of a contract matters).
      *   **Hypothetical Intentionalism:** A popular middle-ground today. It asks: "What would a properly informed audience have understood the author to mean?" This uses biography not to worship the author, but to reconstruct the communicative context.
      *   **Cognitive Narratology:** Modern scholars often look at authorial mind as a cognitive process relevant to how stories are constructed.
  *   **The Roommate's Error:** He is treating a specific 1960s/70s French theoretical moment as the eternal state of academia. In practice, most English departments operate on a hybrid model: The text is primary, but authorial context is a crucial tool.

  ### 5. "Stylometry (Trump tweets, Shakespeare) proves the framework is collapsing."
  **Verdict: Category Error.**

  *   **The Distinction:** This is the most sophisticated-sounding but actually the most confused part of his argument.
      *   **Stylometry/Attribution:** This is a **forensic** question. It asks: *Which human hand produced these marks?* It is about causality and origin.
      *   **Death of the Author:** This is a **hermeneutic** question. It asks: *Who controls the meaning of these marks?*
  *   **Why it doesn't refute Barthes:** Proving Shakespeare wrote a specific passage tells us *who* wrote it. It does not tell us *what Hamlet means*. Barthes would say, "Great, now we know the scribe. Does that stop us from interpreting Hamlet through a Freudian, Marxist, or Queer lens?" No.
  *   **The "Author Coming Back":** Knowing who wrote the Trump tweets helps us understand the *source*, but "Death of the Author" was never about denying that humans write things. It was about denying that the human's *internal secret thoughts* are the final judge of the text's public meaning. Stylometry finds the body; it doesn't resurrect the God.

  ### 6. The *Frankenstein* Argument: Is biography "gossip"?
  **Verdict: You are right; he is being dogmatic.**

  *   **The Theory:** Reading *Frankenstein* knowing Mary Shelley lost a child is not "worshiping the author-god." It is **historical contextualization**.
  *   **Why it matters:** Literature is a communicative act. When Shelley wrote about a creature born without a mother, or a creator horrified by his creation, she was writing within a specific emotional and historical horizon.
      *   **Intentionalist view:** She meant to explore grief.
      *   **Anti-Intentionalist view:** The text contains codes of grief that resonate differently if we know the context of 1816 vs. 2024.
  *   **The Middle Ground:** You don't need to be an intentionalist to agree with yourself. You can argue that **context enriches significance.**
      *   If you ignore Shelley's biography, you might miss the specific texture of the grief in the novel.
      *   If you *only* look at the biography, you might reduce the novel to a diary entry.
      *   **Your stance:** You said you are "licensed to read differently." This is correct. Knowledge changes the horizon of interpretation. It doesn't fix the meaning (you can still read it as a critique of science), but it adds a layer of resonance regarding creation and loss. Calling that "gossip" is an aggressive dismissal of historical materialism.

  ### Summary for Your Next Argument

  Your roommate is holding a **Fundamentalist Anti-Intentionalist** position that few actual scholars hold. Here is how you can push back:

  1.  **On "All Readings Valid":** Ask him if a reading that contradicts the plain text is valid. If he says no, then intention isn't the only thing dead; reader anarchy is too. Texts have constraints.
  2.  **On Stylometry:** Point out that knowing *who* wrote a text (forensics) is different than knowing *what authority* that person has over the meaning (hermeneutics). Finding out Shakespeare wrote a line doesn't tell us if Shylock is a villain or a victim.
  3.  **On *Frankenstein*:** Tell him you aren't trying to worship Mary Shelley. You are trying to understand the **conditions of production**. Ignoring the author's life isn't "theory," it's often just bad history. We don't read texts in a vacuum; we read them in a world where authors live, suffer, and write.
  4.  **On "Museum Piece":** Remind him that "New Intentionalism" and "Historical Contextualism" are alive and well. The "Death of the Author" is a useful metaphor for letting go of the search for One True Meaning, but it is not a rulebook for banning biographies.

  **Bottom Line:** You are licensed to use biography. It doesn't solve the text, but it illuminates it. Your roommate has mistaken a tool for liberation (freeing the text from the Author's dictatorship) for a tool of censorship (banning the Author from the conversation).
