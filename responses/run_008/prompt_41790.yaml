      *   *Section 3: The Stylometry Argument.*
          *   Explain the category error. Forensic authorship $\neq$ Hermeneutic authority. Knowing Trump wrote a tweet doesn't tell you how to interpret it politically.
      *   *Section 4: The Frankenstein Case.*
