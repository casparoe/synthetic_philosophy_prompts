      *   *Section 1: The Theory (Wimsatt/Beardsley & Barthes).*
          *   Clarify "Intentional Fallacy": It's about judging *success*, not banning *context*.
          *   Clarify "Death of the Author": It's about limiting authority, not erasing the person.
          *   Address the "All Readings Valid" point: This is the biggest error. Textual constraints exist.
      *   *Section 2: Is Intentionalism Dead?*
