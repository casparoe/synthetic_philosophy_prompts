          *   Distinguish between *meaning* (what the text says) and *significance* (what it means to us/why it matters).
      *   *Conclusion:* Summarize. Roommate is half-right but drawing wrong conclusions. User is practically right but might need better theoretical vocabulary.

  4.  **Refining the Nuance (Self-Correction during drafting):**
