  Elara, a secular utilitarian archivist facing terminal illness, and Kael, a devout nomadic chieftain struggling with famine, are confined in spacelike-separated bunkers with no channel through which either one's choices can affect the other's decision-making—no messages, signals, or side effects ever reach the counterpart—yet each possesses verified historical records of the other's character and core values; Elara can expend her last energy reserves to activate a shield that preserves Kael's ancestral lands (useless to her), while Kael can expend his last rations to fund a trust that preserves Elara's archives (useless to him), and though neither can ever observe the other's action nor punish defection, both reason that the other is sufficiently rational and principled to recognize that mutual cooperation yields a unique Pareto improvement over their respective defaults, binding their choices through recursive inference rather than causal signal.

  **Analysis**

  **Why each side gains:** Both agents face a Prisoner's Dilemma structure where defection is the dominant causal strategy, but mutual cooperation offers a superior outcome for both specific value systems (Elara values knowledge preservation; Kael values land survival). The gain is conditional: Elara only benefits from her sacrifice if Kael reciprocates, and vice versa. If either acts alone, they incur a cost with zero return, making the payoff strictly dependent on the correlation of their choices.

  **The Mechanism:** The work is done by **recursive psychological modeling**. Since they cannot simulate each other's source code (being dissimilar humans), they rely on "character reading." Elara reasons: "Kael is honorable; he knows I am honorable; he knows I won't cooperate unless I expect him to; therefore, to secure my cooperation, he will cooperate." This creates a subjunctive link: *If* I cooperate, it is because I am the type who expects reciprocity, which means he is likely the type to provide it. The correlation isn't logical identity (like clones) but empirical confidence in shared rationality and integrity.

  **If You Delete That Part:** Remove the ability to model the other's character (e.g., they are total strangers with no records), and the subjunctive link vanishes. Without evidence of the other's rationality or honor, there is no basis to expect reciprocity. The scenario collapses into a standard one-shot Prisoner's Dilemma where causal decision theory dictates defection, and the trade fails.

  **The Skeptic's Attack:** A skeptic would argue this is **empirical induction, not acausal logic**. Because the agents are dissimilar and human-level, their decisions are not logically bound; they are merely correlated by common human traits. When Elara cooperates, she isn't trading; she is acting on *hope* backed by data. From a causal perspective, her action cannot influence Kael's, so her sacrifice is effectively unconditional. She is paying a cost based on a belief, which is the definition of altruism (or gambling), not trade. The "acausal" label is a lab coat draped over trust.

  Verdict: disguised altruism
