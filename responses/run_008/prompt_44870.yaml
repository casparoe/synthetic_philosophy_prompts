answer: |-
  This is a profound question that cuts to the bone of legal philosophy. You have identified the central tension in Peter Suber's *The Paradox of Self-Amendment*, from which Nomic is derived. Your dichotomy—between **revocable consent** (contractualism) and **self-validating procedure** (positivism/bootstrapping)—is essentially the debate between social contract theory and legal positivism, played out in microcosm.

  Here is an analysis of what Nomic presupposes, whether it holds together, and how it mirrors (and diverges from) real legal systems.

  ### 1. Which reading does the practice presuppose?

  The practice presupposes **both**, but at different ontological levels. It is a layered system.

  **Internally (The Player Perspective):** It presupposes **Pure Proceduralism.**
  Once you are seated at the table, the source of a rule's validity is solely its procedural pedigree. If Rule 10 says "Rules passed by 2/3 vote are valid," and you pass Rule 11 by a 2/3 vote, Rule 11 is valid. You cannot argue, "But Rule 11 is unjust," or "I didn't personally consent to Rule 11." Within the magic circle of the game, authority is circular and self-referential. This simulates the Kelsenian *Grundnorm* or the Hartian *Rule of Recognition*.

  **Externally (The Human Perspective):** It presupposes **Revocable Consent.**
  As you noted, if you stand up and quit, the rules cease to bind you. The game has no police; it has no territory. Its entire existence relies on the continued voluntary participation of the players. Therefore, the *ultimate* source of authority is not the rules themselves, but the **social fact of play.**

  **The Synthesis:**
  Nomic presupposes that **procedural authority is real, but contingent.** It is a simulation of a sovereign legal system running on a substrate of contract. Suber designed it this way intentionally. He wanted to show that even in a system where rules can change anything, there is a "hard shell" of reality (the players' willingness to play) that the rules cannot penetrate.

  So, to answer your specific dilemma: The binding force of every passed rule traces back to the original agreement *to be bound by the procedure.* It is revocable consent wearing proceduralist clothing. The "bootstrapping" is a fiction that only works as long as the players agree to pretend it works.

  ### 2. Is the presupposition coherent?

  **Logically, yes. Ontologically, it is precarious.**

  The coherence relies on distinguishing between the **Constituted Power** (the rules of the game) and the **Constituent Power** (the players making the game).
  *   **Coherence:** As long as the players do not exercise their Constituent Power to leave, the Constituted Power can legitimately claim to be sovereign. The system is coherent because the participants voluntarily suspend their external sovereignty to submit to the internal procedure.
  *   **The Paradox:** The incoherence arises if the rules attempt to bind the Constituent Power. For example, if Nomic passes a rule saying "No player may quit the game," that rule is procedurally valid but ontologically null. It highlights the limit of the system: **Rules cannot generate their own obligation.**

  This is where your "quit" observation is devastatingly accurate. The ability to quit is the **Schmittian Exception** applied to gaming. Carl Schmitt argued that the true sovereign is he who decides on the exception. In Nomic, the true sovereign is not the rulebook, but the player who decides to stop playing. Because the system acknowledges (implicitly) that you *can* quit, it admits that its authority is not self-contained.

  Therefore, the presupposition is coherent only if you accept that the "law" of Nomic is a **conditional imperative**: "If you wish to play, you must obey." It is not a categorical imperative.

  ### 3. Do real legal systems presuppose the same thing?

  This is the most critical part of your inquiry. Real legal systems look like Nomic's internal layer (Proceduralism), but they function like Nomic's external layer (Consent/Power).

  **What Real Systems Share with Nomic:**
  *   **Hart's Rule of Recognition:** Legal philosopher H.L.A. Hart argued that every legal system has an ultimate rule (e.g., "The Constitution is supreme") that validates all other rules. Crucially, Hart admitted this ultimate rule is not "valid" in a legal sense; it is a **social fact.** Officials simply *accept* it. This is identical to Nomic players accepting the initial ruleset.
  *   **The Kelsenian Gap:** Hans Kelsen argued that law rests on a "Basic Norm" (*Grundnorm*) that is presupposed but not proven. Nomic makes this explicit: the Basic Norm is "Obey the initial ruleset."
  *   **Self-Amendment:** Real constitutions have amendment clauses. They allow the legal system to change its own source code, just like Nomic.

  **What Real Systems Have That Nomic Lacks:**
  *   **Coercion and Monopoly on Violence:** This is the big one. If you "quit" a real legal system (tax evasion, ignoring laws), the state coerces you. Nomic lacks the *enforcement mechanism* that separates law from games. Real legal systems claim authority *regardless* of your individual consent. Nomic collapses without it.
  *   **The Illusion of Perpetuity:** Real legal systems work hard to hide the "Consent" layer. They use myth, history, and ceremony to make the Constitution seem sacred or timeless, rather than a contingent agreement among people who could walk away. Nomic, by contrast, is brutally honest: if the players stop, the law dies.
  *   **Territoriality:** You can quit Nomic by standing up. You cannot quit a jurisdiction without going somewhere else (which is another jurisdiction). Real law claims to cover a reality you cannot simply opt out of without ceasing to participate in society.

  **The Crucial Difference:**
  Real legal systems presuppose **Sovereignty**, whereas Nomic presupposes **Participation.**
  *   In Nomic, authority flows from the bottom up (players -> rules).
  *   In Real Law, authority claims to flow from the top down (State -> subjects), even if the philosophical ground is actually bottom-up (Social Contract).

  Real legal systems are essentially Nomic games that have successfully convinced the players they cannot quit. They have obscured the "quit" option through physical coercion and psychological hegemony.

  ### Conclusion

  Your intuition is correct: Nomic is **revocable consent wearing proceduralist clothing.**

  The practice presupposes that authority is a **status function** created by collective intentionality (to use John Searle's term). The rules only have power because we collectively agree to count certain sounds and marks as "binding rules."

  Is it coherent? Yes, as a model of **Legal Positivism.** It demonstrates that validity (was the rule passed correctly?) is separate from efficacy (do people follow it?) and morality (is the rule good?).

  Do real systems presuppose this? **Yes, but they mask it.**
  At the root, the US Constitution binds you not because it is logically self-validating, but because a critical mass of people with guns and social influence agree to act as if it does. If everyone decided tomorrow that the Constitution was void, it would be. Nomic just removes the masks. It shows that the "Rule of Law" is ultimately a game we agree to play, and the moment we stop agreeing, the "immutable" rules become just paper.

  Suber's genius was not in inventing a game where rules change, but in inventing a game that forces you to realize **you are the source of the law, not the text.** The "bootstrapping" is real, but only because you are the one holding up your own bootstraps.
