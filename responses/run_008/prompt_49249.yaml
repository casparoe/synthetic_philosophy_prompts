prompt: |-
  Got into an argument at a barbeque a couple weekends ago with my cousin's husband, who does cybersecurity for a living, and it's been rattling around in my head since. The topic drifted to evolution somehow, and when I pushed back on his intelligent design leanings he hit me with: DNA is literally a code — it's got letters, it's got words, it gets transcribed and then translated into another representation, and every code anyone has ever encountered had a coder behind it. So it's not a metaphor, it's an observation. Then a biochemist friend of ours who was there waved this off as "just a convenient way of talking" and both of them left unhappy, and I didn't feel like either of them had actually said anything.

  Here's my problem: I think both of them were gesturing at the word "code" without ever pinning down what they meant by it, and I realized I can't either. So can you lay out the distinct, precise claims that "DNA is a code" might actually be making? I can sort of imagine a spectrum running from something trivially true (there's a systematic mapping between codon triples and amino acids, so it's a code the way a substitution cipher is) up to something doing serious metaphysical work (DNA is a code in the same sense as a program, or in whatever sense entails an intentional author). For each reading, tell me whether it's a platitude, whether it's substantive but defensible, or whether it's just false, and — this is the part I actually care about — whether that reading would support his "codes have coders" inference. Does the inference only go through on the most question-begging reading, or is there some honest version of it that a non-religious person should worry about?

  One more thing. I have a CS degree, so I can't help noticing that the cell really does look like it has an interpreter (ribosomes), a copy step (transcription), regulatory logic, error correction, the whole stack. Is the computing vocabulary genuinely earning its keep in biology, or is it a metaphor biologists have gotten so comfortable with that it's started quietly smuggling in assumptions? Don't dumb down the computing side, but I've taken zero biology since highschool, so explain the molecular stuff as you go.
