answer: |-
  Your tentative principle—that an assumption is legitimate only if substituting a realistic one leaves predictions unchanged—is indeed too strict. It fails your own Friedman verdicts because a realistic billiard player *would* miss shots, and a realistic tree *would* have shaded branches. You accept those idealizations not because the predictions are identical, but because the *systematic tendency* is captured, and the errors are treated as noise rather than structural flaws.

  Conversely, your rejections (Mortgages, Bank Runs) share a different feature: the false assumption eliminates the very source of the risk or dynamic the model is supposed to explain.

  To capture all your verdicts, you need a principle that distinguishes between **simplifying a mechanism** versus **eliminating a cause**. Here is the repaired principle, followed by its application to your unsettled cases and the new examples.

  ### The Principle of Constitutive Relevance

  **An unrealistic assumption is a legitimate idealization if and only if the falsity of the assumption does not remove the causal source of the specific phenomenon the model is intended to explain or price.**

  This principle divides idealizations into two categories:
  1.  **Negligible Distortions:** The assumption simplifies the *mechanism* (e.g., calculation instead of selection, point particles instead of volumes) but preserves the *causal force* driving the target outcome (e.g., skill/selection, kinetic energy). The error introduced is random or second-order relative to the target.
  2.  **Constitutive Exclusions:** The assumption simplifies the *environment* or *agents* in a way that structurally precludes the phenomenon of interest (e.g., crashes, panics). Here, the falsity is not a distortion; it is a denial of the explanandum.

  ### Applying the Principle to Your Verdicts

  *   **Ideal Gas & Population Genetics:** **Legitimate.** The falsity (no volume/interaction; infinite size) simplifies the math but does not remove the causal source of pressure or selection. The errors are negligible within the specified domain.
  *   **Friedman (Billiard/Leaves):** **Legitimate.** The assumption (calculation/optimization) is a *surrogate* for the true causal force (learning/natural selection). The falsity of the mechanism produces errors (missed shots), but these are noise around the equilibrium position, which is the target. The causal source of the *position* (skill/selection) is preserved.
  *   **Calvo Pricing:** **Legitimate.** The falsity (random resets) is a tractable surrogate for sticky prices. It preserves the causal source of inflation dynamics (nominal rigidity) without needing to model the specific psychology of managers.
  *   **Mortgage Securities & Bank Runs:** **Cheating.** In the mortgage case, the assumption (no nationwide fall) removes the *source of the risk* being priced. In the bank run case, the assumption (common knowledge of solvency) removes the *source of the panic* (uncertainty/coordination failure). These violate Constitutive Relevance.
  *   **Epidemic Models (Homogeneous Mixing):** **Settled Verdict.** This depends on the *target*.
      *   If the target is **aggregate growth rate ($R_0$)**: **Legitimate.** The causal source of transmission (contact) is preserved, even if the structure is simplified. The error is quantitative.
      *   If the target is **targeted intervention (e.g., close schools vs. bars)**: **Cheating.** The causal source of superspreading is *network structure*. By assuming homogeneous mixing, you assume away the very mechanism (clustering) that determines which policy works.
      *   *Advice:* You should classify this as **Legitimate for macro-forecasting, Illegitimate for micro-policy.** Your unease stems from governments using a macro-legitimate model to justify micro-specific lockdowns.

  ### The Biology vs. Economics Asymmetry

  **You should retain this asymmetry, but ground it in mechanism, not discipline.**

  Your distrust of economic "as-if" maximization compared to biological "as-if" optimization is principled, provided it rests on **Enforcement Mechanisms**.
  *   **Biology:** "As-if optimization" is underwritten by Natural Selection. There is a rigorous, causal feedback loop that *enforces* the optimization over time. Organisms that don't behave as-if they optimize are removed from the sample. The idealization is causally backed.
  *   **Economics:** "As-if profit maximization" is often underwritten by an assumption of Rationality or Competition. However, competitive selection in markets is often slow, imperfect, or blocked by barriers to entry. Managers have agency that deviates from profit max without immediate "extinction."
  *   **Verdict:** The asymmetry is defensible *if* the economist cannot demonstrate a robust selection mechanism comparable to natural selection. If an economic model can show that market forces *punish* deviation as rigorously as nature punishes biological inefficiency, the asymmetry dissolves. Until then, your skepticism is a valid heuristic for causal weakness.

  ### The New Cases

  **1. The Coase Theorem (Zero Transaction Costs)**
  *   **Verdict:** **Legitimate.**
  *   **Reasoning:** The target of the Coase theorem is not to predict that transaction costs *are* zero, but to isolate the effect of *property rights* from the friction of *bargaining*. It functions as a "frictionless plane" in physics. The falsity (costs are actually positive) does not remove the causal source of the insight (that rights allocation matters only when frictions exist). It is a contrastive explanation, not a predictive claim about reality.

  **2. Integrated Assessment Models (IAMs) for Climate (Rational Expectations)**
  *   **Verdict:** **Cheating (Intellectual Fraud).**
  *   **Reasoning:** The target is to price long-run climate damage and policy. The central causal sources of climate risk are **uncertainty, irreversibility, and political myopia**. By assuming rational expectations, the model assumes agents perfectly foresee climate trajectories and discount them optimally over centuries. This assumes away the very coordination failures, uncertainty premiums, and political inertia that constitute the economic problem of climate change. It treats a complex, path-dependent political failure as a solvable optimization problem. This violates Constitutive Relevance.

  ### Summary of the Repaired Principle

  **The Principle of Constitutive Relevance:**
  > *An unrealistic assumption is legitimate if the falsity of the assumption introduces only quantitative error or tractable simplification regarding the model's target. It is illegitimate if the falsity of the assumption eliminates the causal mechanism responsible for the variance, risk, or dynamic that the model aims to explain.*

  **Instruction for Future Cases:**
  When evaluating a model, ask: *"If I make this assumption true, does the phenomenon I am studying disappear?"*
  *   If yes (e.g., No Crash assumption in Crash Pricing): **Cheating.**
  *   If no (e.g., No Calculation assumption in Billiard Shots): **Legitimate.**

  You need not surrender your verdicts, only clarify the Epidemic case based on the *specific policy target*. Your asymmetry is not prejudice; it is a sensitivity to the strength of the causal enforcement mechanism backing the "as-if" claim.
