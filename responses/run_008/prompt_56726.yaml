answer: |-
  You are absolutely right to feel a slide happening between steps (3) and (4). Your intuition is spot-on: the argument relies on an equivocation on the word "obtains" (and relatedly, on what we mean by "reality").

  Your flatmate is technically correct that you are smuggling in a specific notion of "outcome," but she is failing to explain why that notion doesn't destroy agency. The good news is that there is a standard Lewisian response that saves both Modal Realism and the seriousness of your choices.

  Here is the breakdown of where the argument breaks, the "trick" to fixing it, and what it costs you to accept it.

  ### The Diagnosis: The Equivocation on "Obtains"

  The problem lies in **Step (4)** and how it feeds into **Step (3)**.

  *   **Meaning A (Global):** An outcome obtains if it exists *somewhere* in the pluriverse (the sum total of all concrete worlds).
  *   **Meaning B (Local/Indexical):** An outcome obtains if it exists *in this world* (the world we inhabit, which we indexically call "actual").

  Under Modal Realism, Step (4) is true only under **Meaning A**. No matter what you choose here, there is a counterpart somewhere who chooses the other way, so the "menu of outcomes" exists globally.

  However, Step (3) ("the whole point of choosing is to affect which outcomes obtain") is only plausible under **Meaning B**. When you deliberate about giving to charity, you do not care whether the outcome "charity is given" exists *somewhere* in the multiverse. You care whether it obtains *here*, in your community, in your life.

  The argument fails because it uses Meaning A to establish the premise in (4), but then relies on Meaning B to make the conclusion in (5) feel devastating.

  ### Which Step to Give Up?

  You should reject the unqualified version of **Step (3)**.

  **Replace Step (3) with:**
  > "(3*) The point of choosing is to affect which outcomes obtain **in my world**."

  Once you make this change, Step (5) no longer follows. Even if the "total inventory" of the pluriverse is fixed, the inventory of *your* world is not. Your choice determines whether *this* world is a world where you cheat or a world where you remain faithful.

  ### The "Trick": Indexical Actuality

  This is the concept your flatmate is refusing to articulate clearly. For David Lewis, the word "actual" is **indexical**. It works just like the words "here," "now," or "I."

  *   When you say "I am here," you aren't denying that other places exist. You are just locating yourself.
  *   When you say "It is now 2024," you aren't denying that 1924 exists (in time). You are locating yourself in time.
  *   When you say "This world is actual," you aren't denying that other worlds exist. You are locating yourself in logical space.

  **The Lewisian Defense of Deliberation:**
  Deliberation is not about changing the *pluriverse* (the collection of all worlds). It is about determining **which world you are in**.

  Since causal connections do not cross world boundaries, what happens in the other worlds is causally inert relative to you. The counterpart of you who cheated on their partner is not your partner's problem; *you* are. The suffering caused by the cheating counterpart happens in a disconnected universe. The suffering caused by *you* happens *here*.

  Therefore, you have every reason to deliberate seriously. You want to ensure that the world you inhabit (the "actual" one) is a good one, regardless of whether bad worlds exist elsewhere.

  ### What Does This Cost You?

  To accept this solution, you have to pay a metaphysical price. You have to give up the idea that your choices change the **total sum of reality**.

  1.  **You lose "Cosmic Impact":** You must accept that from a "God's eye view" of the entire pluriverse, your choice makes no difference. The total inventory of events across all reality is fixed. If you give to charity, there is a world where you do; if you don't, there is a world where you don't. The pluriverse contains both either way.
  2.  **You gain "Local Impact":** In exchange, you keep the only kind of impact that matters ethically. You determine the character of *your* world.

  Most philosophers (including Lewis) argue this is a fair trade. Ethics is local. We care about *our* pain, *our* partners, and *our* communities. The fact that there is a disconnected universe where things go differently is morally irrelevant to us, just as the fact that there is a place on Earth where it is raining (while it is sunny here) is irrelevant to whether I need an umbrella.

  ### How to Talk to Your Flatmate

  Tell her you accept the distinction between the **Pluriverse** (all worlds) and the **Universe** (our world).

  *   **Concede:** "Okay, I grant that the total inventory of the Pluriverse is fixed regardless of my choice."
  *   **Press:** "But agency and ethics are world-bound. Causation doesn't jump between worlds. So, my choice determines the inventory of *this* world."
  *   **The Kicker:** "If deliberation is pointless because counterparts do the other thing elsewhere, then eating is also pointless. There is a world where I starve and a world where I eat. Does that mean I shouldn't bother making lunch? Obviously not. I care about what happens *here*, not what happens *somewhere*."

  ### Summary

  *   **The Error:** Equivocation on "obtains" (Global vs. Local).
  *   **The Fix:** Qualify Step (3) to refer to outcomes in *this* world.
  *   **The Cost:** Admitting your choices don't change the total sum of all reality, only your location within it.
  *   **The Result:** You keep Modal Realism, and you keep the seriousness of deliberation.

  Your flatmate is right that the argument as you stated it is invalid, but she is wrong if she thinks Modal Realism leads to nihilism. The "shrug" in Step (5) is indeed a mistake—not because the worlds aren't real, but because you are the one who has to live in *this* one.
