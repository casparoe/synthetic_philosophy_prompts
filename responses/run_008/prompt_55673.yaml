  2.  **Deconstruct "Moloch" vs. Prisoner's Dilemma:**
      *   PD is usually 2 players, one-shot. Moloch is often N-player, iterative, where the *system* rewards behaviour that destroys the group.
      *   Key element: Arms races. Everyone spends resources to stay relative, but absolute welfare drops.
      *   Key element: Unenforceable agreements. Talking doesn't help because defection is incentivized.
      *   Key element: The "Vote" requirement. This needs to simulate trying to regulate the trap. The risk needs to be that if *anyone* defects after the regulation, the regulators suffer more.

