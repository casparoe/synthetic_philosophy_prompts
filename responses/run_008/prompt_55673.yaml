answer: |-
  # Session Plan: The Arms Race (Moloch)

  **Time:** 40 minutes
  **Players:** 12–15
  **Materials:** Slips of paper (at least 5 per person), pens, whiteboard/chalkboard for scores.

  ## 1. The Rules (Read this out or print it)

  **Goal:** Finish the game with the highest personal score.

  **Setup:**
  *   You will play **5 Rounds**.
  *   Each round, you start with **5 Effort Tokens**.
  *   On your slip of paper, write your **Name** and your **Bid** (a number between 0 and 5).
  *   Hand your slip to me. I will collect them all.

  **Scoring:**
  *   **The Prize:** The top one-third of bidders (e.g., top 5 people in a group of 15) share **10 Points** equally.
  *   **The Cost:** You subtract your Bid from your points.
  *   **Ties:** If there's a tie for the last prize spot, the points for that spot are shared among the tied players.
  *   **Example:** If you bid 3 and make the top third, you get (Share of 10) minus 3. If you bid 3 and don't make the top third, you get 0 minus 3 (so, -3).

  **Communication:**
  *   Between rounds, you have **2 minutes** to talk to each other. You can make promises, form alliances, or beg.
  *   **Warning:** There is no way to enforce promises. You can lie.

  **The Vote (Before Round 4):**
  *   We will vote on **"The Treaty"**.
  *   **The Treaty:** If passed, all bids are capped at 2. Anyone who bids over 2 gets 0 points automatically.
  *   **The Cost:** Voting 'Yes' costs **1 Point** (administrative effort). Voting 'No' costs nothing.
  *   **The Catch:** The Treaty **only passes if everyone votes Yes**.
  *   **The Risk:** If even one person votes 'No', the Treaty fails. The 'Yes' voters still lose their 1 Point, but the bid cap is **not** enforced. Everyone goes back to normal rules.

  ---

  ## 2. Payoff Table (For your reference)

  *Assume 15 players. Top 5 win the prize pool of 10 points (2 points each).*

  | Your Bid | If You Win (Top 5) | If You Lose (Bottom 10) |
  | :--- | :--- | :--- |
  | **0** | +2 points | 0 points |
  | **1** | +1 point | -1 point |
  | **2** | 0 points | -2 points |
  | **3** | -1 point | -3 point |
  | **4** | -2 points | -4 points |
  | **5** | -3 points | -5 points |

  *Note: If everyone bids 0, everyone ties for first. 10 points / 15 people = 0.66 points each. Net score: 0.66.*
  *Note: If everyone bids 5, everyone ties. 0.66 points - 5 cost = -4.33 each.*
  *Incentive: If everyone else bids 0, and you bid 1, you win outright. 10 points - 1 cost = 9 points.*

  ---

  ## 3. Minute-by-Minute Plan

  **00:00 – 05:00 | Intro & Rules**
  *   Hand out slips. Explain the rules clearly. Check understanding: "If I bid 5 and come last, what's my score?" (-5). "If we all bid 0, what happens?" (We share the prize).
  *   Emphasise: *This is competitive. Your goal is to beat the others.*

  **05:00 – 10:00 | Round 1 & 2 (The Escalation)**
  *   **Round 1:** Collect bids. Calculate scores quickly (you need to know who is in the top third). Write names and scores on the board.
  *   **Talk (2 mins):** Let them chat. They will likely say "Let's all bid 0."
  *   **Round 2:** Collect bids. Expect some to trust the pact, others to bid 1 or 2 to "test" it. Update scores.

  **10:00 – 20:00 | Round 3 (The Betrayal)**
  *   **Talk (2 mins):** Promises will be stronger. "I swear I'll bid 0."
  *   **Round 3:** Collect bids. By now, most should be bidding high (3–5) because someone betrayed the pact in Round 2. Scores will likely drop into negatives.
  *   **Highlight:** Point out the average score on the board. "Look how much effort we're spending for how little reward."

  **20:00 – 25:00 | The Vote**
  *   Explain the Treaty rules again. Be very clear about the **Unanimity** and the **Cost of Failure**.
  *   **Secret Vote:** Have them write 'Yes' or 'No' on a slip. Collect privately.
  *   **Reveal:** Count the Yes/No votes aloud.
  *   **Outcome:**
      *   *If Unanimous Yes:* Deduct 1 point from everyone. Announce the cap is active.
      *   *If Any No:* Deduct 1 point from Yes-voters only. Announce the Treaty failed. Normal rules apply.
  *   *Note:* Expect this to fail. The fear of being the sucker is the point.

  **25:00 – 35:00 | Round 4 & 5 (The Aftermath)**
  *   **Round 4:** Run the round under the new conditions (whether Treaty passed or failed).
  *   **Talk (1 min):** Brief chat.
  *   **Round 5:** Final round. Go big or go home.
  *   **Calculate Final Scores:** Announce the winner. Give a round of applause.

  **35:00 – 40:00 | Debrief**
  *   Sit in a circle. Put the scores on the board.
  *   Ask the questions listed below. Do not lecture. Let them realise the trap.

  ---

  ## 4. Debrief Guide (Socratic Method)

  **Don't say:** "This is Moloch."
  **Do ask:**

  1.  **On the beginning:** "In Round 1, what was the best outcome for the group as a whole?" (Everyone bids 0). "Did we get it?"
  2.  **On the talk:** "We had time to talk and make promises. Why didn't that fix the problem?" (Because anyone could lie to win). "Did talking make it better or worse?" (Sometimes worse, because you know who lied).
  3.  **On the Vote:** "Who voted Yes? Why?" (Wanted peace). "Who voted No? Why?" (Didn't trust others / Didn't want to lose the point). "If you knew for sure everyone else would vote Yes, would you have voted Yes?" (Usually yes). "So what stopped us?" (Doubt).
  4.  **On the feeling:** "How did it feel when you realised you had to bid 5 just to stay even, even though you hated doing it?"
  5.  **The Map:** "Where else do we see this? Where do people compete so hard they all end up tired and worse off, even though nobody wanted it?" (Expect: Exams, climate change, arms races, influencers editing photos).

  **Closing Thought:** "In this game, I was the referee. I could stop the rounds. In real life, there is no referee. The competition doesn't stop for lunch."

  ---

  ## 5. Predictable Failures (And how to handle them)

  1.  **The "Philosophy Kid" Meta-Game:** One student might realise the point is cooperation and try to force everyone to bid 0 loudly.
      *   *Fix:* Remind them the prize is for the *individual* highest score. If they cooperate and someone else defects, the cooperator loses. The incentive must remain real.
  2.  **Calculation Bottleneck:** You spending 10 minutes adding up scores.
      *   *Fix:* Pre-calculate the "Prize Share" based on attendance. If 15 people, top 5 get 2 points each. Just write the bids on the board, circle the top 5, assign points. Keep it moving.
  3.  **The Vote Succeeds:** If by miracle everyone votes Yes and obeys.
      *   *Fix:* That's fine. Ask them: "Was it easy to trust? What if there were 1,000 players instead of 15?" Scale is part of the problem.
  4.  **Boredom/Chaos:** Kids throwing random numbers.
      *   *Fix:* Keep the energy up. "Round 3 starts now, pens down in 30 seconds!" Make it feel like a market crash.

  ---

  ## 6. The Honest Limitation

  **"In this game, you can walk away when the bell rings; in the real world, Moloch doesn't care if you're tired, and there is no final round where you can cash out."**
