      *   **Topic:** Moloch (Scott Alexander version) - multi-polar traps, competition leading to suboptimal outcomes despite everyone knowing better.
      *   **Goal:** Design a game where students *feel* the trap, not just hear about it.
      *   **Constraints:**
          1.  No real money (points okay).
          2.  Not a standard Prisoner's Dilemma (PD). Must allow communication/promises that are unenforceable. Communication should potentially make betrayal feel worse.
          3.  Include a mid-game vote on changing rules (binding agreement), but make voting risky due to distrust (fear others won't comply/if the mechanism fails). If this feels rigged/uninteresting, cut it (but try to keep it if possible).
