prompt: |-
  so quick context: me and a friend run a lunchtime philosophy-ish club at our school, we usually get 12-15 people and 40 minutes in a classroom. next week it's my turn to run the session and i want to do one on Moloch — the idea (the scott alexander essay version, not the bible one) that when loads of actors compete and none of them can afford to unilaterally stop competing, everyone ends up in an outcome they all hate even though noone actually chose it. i dont want to lecture about it though, i want them to feel it happen to them.

  so: design an actual game we can play where the rules themselves build the trap. things i care about:

  1. no real money, points are fine
  2. it should be more than a dressed-up prisoner's dilemma that everyone in the room has already seen. the bit i find most interesting is where they CAN talk to each other and make promises, but there's no mechanism to make anyone keep a promise — so the talking turns out to be useless, or even makes things worse because now they know exactly who betrayed them
  3. partway through i want to offer a vote on changing the rules, and i want the payoffs set up so that voting for the binding agreement is risky *only if* you doubt the others will comply — i want them to feel the fear that kills the fix. if you think that bit is too rigged to be interesting, say so and cut it, dont keep it just cos i asked

  give me: exact rules written so a 14 year old understands them first time, the actual payoff table, a minute-by-minute plan for the 40 minutes, a debrief that maps what happened onto the idea without turning into me lecturing, a note on what will predictably go wrong the first time i run it, and one honest sentence about what part of the idea a classroom game just cant reproduce (real Moloch has no facilitator and no end of term, for a start).

  commit to one design — dont give me options to pick between. and write it in british english please, im not having "math class" slip into my club notes.
