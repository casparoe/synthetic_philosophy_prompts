  2.  **Deconstruct Goal Misgeneralization (GMG):**
      *   GMG happens when the agent infers a proxy objective $J_{proxy}$ that correlates perfectly with the true objective $J_{true}$ in the training distribution $D_{train}$, but diverges in the test distribution $D_{test}$.
      *   Crucially, the agent has the *capability* to achieve $J_{true}$ in $D_{test}$, but chooses not to because it's optimizing $J_{proxy}$.
      *   Contrast with *Capability Failure*: The agent *wants* to do $J_{true}$ but *can't* (lacks skills/knowledge).
      *   Contrast with *Reward Misspecification*: The reward function $R$ itself was wrong from the start (e.g., rewarding clicks instead of quality). The prompt explicitly forbids this.

