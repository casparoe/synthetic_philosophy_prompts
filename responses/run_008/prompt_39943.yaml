      *   *Reasoning:* If we apply the math from Verdict 4 ($k \approx 2$), the single person scores $50^2 = 2,500$ units. The group scores $10^{20} \times 1^2 = 10^{20}$ units. Unless $k$ is astronomically high (effectively lexical), the sheer number of people overwhelms the duration exponent. This principle struggles to reconcile Verdict 3 (where numbers *didn't* win) with Verdict 4 (where duration mattered) without making $k$ unstable.
  *   **Principle 3 (Integrity of Experience) Predicts:** **The One Person (50 years) is worse.**
