          *   *Move:* Distinguishes *ontological grounding* from *explanatory utility*.
          *   *Argument:* Pressure explains the piston better than molecular trajectories, even if molecules fix pressure. Similarly, social structures explain social outcomes better than individual psychologies.
          *   *Core Position:* Explanatory Non-Reductionism.

      *   **Move 4: Mara's Counter (Reflexivity/Beliefs)**
          *   *Claim:* The gas analogy fails because people respond to aggregates (reflexivity).
