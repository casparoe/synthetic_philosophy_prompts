  8.  *(Final check on the "Network" point)*: Dev's network argument is essentially an argument for *structuralism*. Mara counters by calling it a "plural fact." This is the definition of "Supervenience." If the structure supervenes on individuals, Mara wins ontologically. If the structure explains better, Dev wins pragmatically.

