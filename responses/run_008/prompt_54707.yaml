      *   *Exploiter:* The Park Owner. They know SRs will self-regulate to avoid the penalty. They know CDTs will trickle in until the marginal agent stops.
      *   *Why is this exploitation?* The owner designs the threshold *knowing* the SR psychology. If they set the threshold at 99, SRs might go. By setting it at 50 (half the group), they ensure SRs (who think "All or Nothing") see the "All" outcome as penalized.
