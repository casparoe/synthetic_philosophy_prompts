      *   *SRs are worse off.* They missed out on a benefit because their coordination logic forced them to consider the *global* consequence of crossing the threshold, whereas CDTs were able to "sneak" up to the threshold without triggering the global penalty (because no single CDT agent sees themselves as responsible for the threshold crossing).
