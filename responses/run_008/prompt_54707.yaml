          *   *SRs are worse off.* ($1500 < $1960).
      *   *Why?* Because SRs internalize the risk of the threshold crossing for the *whole group* in their probability calculation, dampening their participation rate to optimize the *average*. CDTs, ignoring the externality they impose on others, flood the zone up to the exact tipping point, capturing the maximum surplus for the early adopters (who are also the group members).
      *   *Wait, in the CDT case, the *group* gets 1960. In the SR case, the *group* gets 1500.*
