      *   *Conclusion:* The vulnerability is strictly tied to the *strength* of the symmetry assumption.

  6.  **Hofstadter's Defense:**
      *   *Defense:* "Superrationality applies to the *reasoning process*, not the outcome. If the mechanism punishes correlation, a superrationalist should recognize that the 'symmetry class' includes the mechanism designer if the designer is also rational."
      *   *Counter:* The designer isn't playing the same game. They are setting the rules.
      *   *Better Defense:* "SRs would recognize this trap and coordinate on a *different* equilibrium (e.g., a Schelling point of 49 members)."
      *   *Counter:* SRs can't coordinate on *different* actions (some go, some stay) without breaking symmetry. They can only coordinate on probabilities. As shown, the probability optimization yields lower utility than the CDT cascade.
      *   *Verdict:* The defense reclassifies the damage but doesn't block it. It admits SRs lose utility in this specific institutional design.

  7.  **Generalization:**
      *   *Is this a one-off?* No. Any mechanism with **threshold penalties for collective action** (congestion, regulatory scrutiny, antitrust, "too big to fail" taxes) will penalize SRs more than CDTs.
      *   *Takeaway:* Tight-knit communities are visible targets. Their predictability is a liability.

