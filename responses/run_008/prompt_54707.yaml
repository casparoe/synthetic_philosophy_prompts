      *   *Does it rely on SR stupidity?* No, it relies on the *symmetry assumption*. SRs assume "If I go, we go." They cannot conceive of a world where *some* go and *some* don't, because they assume identical reasoning leads to identical outputs. CDTs allow for heterogeneity in outcome (some arrive early, some late, or simply probabilistic independence).
      *   *Wait, Hofstadter's SR allows for probabilistic strategies.* In the Platonia Dilemma, they send with probability $1/N$.
      *   *Counter:* If SRs use a mixed strategy (probability $p$), the expected number of visitors is $Np$.
