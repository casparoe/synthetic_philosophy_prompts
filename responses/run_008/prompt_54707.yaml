      *   *19.6 > 15.* CDTs win.
      *   *Why?* Because SRs treat the *probability* of crossing the threshold as a cost to be minimized globally. CDTs treat the threshold as a cliff that *others* will stop them from reaching. The CDTs effectively "free ride" on the fact that the 50th person won't join, allowing 49 people to enjoy the low rate. SRs, fearing the 50th person (themselves, probabilistically) might join, dampen the rate for everyone.
      *   *This is subtle and strong.* It shows SRs are *too* cooperative/risk-averse regarding collective outcomes in a mechanism designed to punish collective action.

  5.  **Refining the Stress Test:**
      *   *One Defector:* If one SR defects (acts CDT), they join the 49. Does this break the symmetry?
