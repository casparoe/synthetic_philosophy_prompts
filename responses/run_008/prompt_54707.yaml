          *   *This works.* The SRs are locked out of a beneficial deal because their coordination triggers a penalty clause that uncoordinated agents naturally dance around.
          *   *Refining the "Exploiter":* The Insurer knows this. They set the threshold *specifically* to catch the SRs. "We know you guys talk/think alike. We're pricing for that."
