      *   *Goal:* Maximize collective utility assuming correlation.
      *   *Vulnerability:* It assumes the "correlation" holds across the relevant decision space. It relies on the assumption that the *game* is defined purely by the players' internal reasoning, ignoring external mechanisms that can decouple the payoff structure based on individual actions in a way that breaks the symmetry *ex post* or creates a "tax" on coordination.

