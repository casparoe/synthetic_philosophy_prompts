      *(Self-Correction)*: I should explicitly mention Ruth Chang. It's the standard reference for this exact cluster of intuitions. It validates the user while giving them the vocabulary.

      *(Refining Case 4)*: The wavering is actually a feature, not a bug. It shows the difficulty of distinguishing Indifference from Parity. I should explain *how* to tell the difference (the Small Improvement Test).

      *(Refining Case 5)*: This is the strongest point of critique. If there is a "right answer" hidden, then the choice isn't hard because of value, but because of knowledge. That changes the nature of the agency.

