answer: |-
  ### The Contingency Pact

  You and a freelance partner, Elena, have a standing handshake deal to stabilize your incomes against market volatility. Before the fiscal year began, Elena assessed your character—she's shrewd but not psychic, right about 90% of the time—and set up a conditional bonus clause based on that assessment. She reasoned: "If my partner is the type who covers shared costs in a crisis, I want them to have a buffer when things go smoothly." A random, external regulatory audit (a 50/50 chance independent of your behavior) determines which branch of the pact activates. If the audit *doesn't* happen (Heads), and Elena predicted you would be cooperative, you automatically receive a \$2,000 referral bonus. If the audit *does* happen (Tails), the bonus fund is locked, and you receive a request to cover a \$200 compliance penalty to keep both your accounts in good standing. You have just received the request: the audit happened. The \$2,000 bonus was never sent. You must decide whether to transfer the \$200 now.

  ***

  ### Specification Check
  *   **Independent Coin:** The regulatory audit is external and random (50/50), not influenced by your character or decision.
  *   **Fallible Predictor:** Elena's assessment is based on past behavior and intuition (90% accuracy), not omniscience or simulation.
  *   **Ordinary Setting:** Freelance business partnership, compliance penalties, referral bonuses.
  *   **Mugging Structure:** You are in the "Tails" branch (asked to sacrifice). The "Heads" benefit (\$2,000) is counterfactual; it depended on your *disposition* to pay in this branch, but since you are in this branch, you didn't get it.
  *   **No Stipulated Verdict:** The payoff structure (\$200 cost vs. \$2,000 counterfactual gain) drives the logic, not a declared "right answer."

  ***

  ### Decision Theory Analysis

  **Causal Decision Theory (CDT):**
  CDT looks for causal leverage. The audit has already occurred. Elena's prediction and the setup of the bonus fund happened in the past. Your transfer of \$200 now cannot causally reach back in time to change Elena's prediction, nor can it change the fact that the audit occurred. The \$2,000 is gone regardless of what you do. Paying costs you \$200 with zero causal return.
  *Verdict: Don't Pay.*

  **Evidential Decision Theory (EDT):**
  EDT asks what your action indicates about the world. Normally, EDT one-boxes in Newcomb's Problem because your choice is evidence of the Predictor's past move. However, in this *Counterfactual* Mugging, you have already observed the "bad" branch (the audit happened). This observation "screens off" the correlation. You know for a fact the bonus wasn't triggered. While paying is evidence that you are a "cooperative type," and a cooperative type *would have* gotten the bonus in the *other* branch, you are not in the other branch. Conditioning on the known audit result breaks the evidential link to the payout. (Note: This is where CM differs from Newcomb's; EDT typically collapses into CDT *ex-post* in Mugging cases).
  *Verdict: Don't Pay (Ex-Post).*

  **Updateless / One-Boxing Policy (UDT/TDT):**
  This approach ignores the specific branch update and asks: "What policy should I have committed to *before* knowing the audit result?" If you adopt the policy "Pay if asked," Elena (90% accurate) likely predicts this, sets up the bonus, and you expect to gain: $(0.5 \times 0.9 \times \$2,000) - (0.5 \times \$200) = \$900 - \$100 = \$800$ expected value. If you adopt "Don't Pay," the bonus is never set up, and your expected value is \$0. To secure the *ex-ante* benefit, you must follow through *ex-post*, even when it feels like a sunk cost.
  *Verdict: Pay.*

  ***

  ### The Working Feature: Independence
  You suspected correctly: the independence of the "coin" is the engine here. In real life, "coins" (market crashes, audits, illnesses) often correlate with dispositions (risky agents get audited more; unhealthy people get sick more). If that correlation exists, EDT sneaks back in. If being the "type to pay" made you *less likely to be audited* (perhaps because Elena only partners with safe people who don't get audited), then Paying becomes evidence that you are in the "Heads" world. But by stipulating the audit is genuinely random, we sever that link. We force the agent to realize that the only way to win is to care about the counterfactual world where they aren't currently standing. The case forces you to value the *consistency of your algorithm* over the *causal consequences of your specific act*.

  ### Impact of Correlation
  If we allow correlation back in (e.g., "People who refuse to pay penalties tend to be flagged for audits 80% of the time"), the verdicts shift dramatically.
  *   **CDT:** Still says Don't Pay (your payment now doesn't change the flagging that already happened).
  *   **EDT:** Now says **Pay**. Your payment is strong evidence that you are the "low-risk" type, which implies a higher probability that the audit shouldn't have happened or that future audits won't happen. The evidential link is restored because the "coin" is no longer independent of the "type."
  *   **Updateless:** Still says Pay, but the margin of victory shrinks because EDT is now doing some of the heavy lifting.

  ### Predictor Accuracy Threshold
  The Updateless edge dissolves when the predictor is too unreliable to make the *ex-ante* policy profitable.
  *   **Cost (C):** \$200
  *   **Benefit (B):** \$2,000
  *   **Probability of Tails (Audit):** 0.5
  *   **Accuracy (p):** ?
  *   **Break-even:** You pay if Expected Value of Policy > 0.
      $$(0.5 \times p \times B) - (0.5 \times C) > 0$$
      $$p \times 2000 > 200$$
      $$p > 0.1$$
  *   **Result:** Even if Elena is only **11% accurate** (barely better than random), the Updateless policy still dictates paying. The high ratio of Benefit to Cost (\$2,000 vs \$200) sustains the mugging even with a very shrewd-but-fallible predictor. The edge only dissolves if she is worse than a coin flip herself.

  ### The Strongest CDT Attack
  The causal decision theorist attacks the **sunk cost fallacy**. They argue that Updateless Decision Theory is asking you to throw good money after bad to satisfy a ghost. The \$2,000 bonus is not just "counterfactual"; it is *non-existent*. It never existed in this timeline. By paying the \$200, you are not "securing" the \$2,000; you are literally lighting \$200 on fire in a universe where you received nothing. The CDTer argues that rationality is about navigating the world you *actually inhabit*, not appeasing a version of yourself in a world that didn't happen. To pay is to treat a past prediction as a deity that demands tribute, rather than a historical fact that is already settled. The weakest joint in the Mugging is the demand that you act as if the counterfactual branch has moral or practical weight equal to the actual one.
