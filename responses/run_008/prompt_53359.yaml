      *   *Thesis 5: The Strong Cognition Claim.* Statistical correlation is *categorically insufficient* for semantic understanding, regardless of scale.
          *   Status: Philosophical/Stipulative (depends on definition of understanding).
          *   Type: Conceptual/Stipulative.
          *   Supports (a)? Yes.
          *   Supports (b)? Yes.
          *   Survives Human Predictability? *No* (if human cognition is also statistical).
          *   Survives Non-Verbatim? Yes.

  4.  **Refining and Polishing the Theses:**
      *   Need to ensure the progression from trivial to strong is clear.
