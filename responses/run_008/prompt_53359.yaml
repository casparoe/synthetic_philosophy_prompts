answer: |-
  Here is a disentanglement of the claims compressed into the slogan "language models are just stochastic parrots," structured for your reading group. The list proceeds from the architectural baseline to the strongest philosophical assertion.

  ### 1. The Architectural Truism
  **Thesis:** *The model generates output by sampling from probability distributions over tokens, conditioned on prior context, without an internal world model or explicit semantic representation.*
  *   **Status:** **Trivially True.** This is a description of the transformer architecture and training objective (next-token prediction).
  *   **Claim Type:** **Empirical/Architectural.** It describes the mechanism, not the capability.
  *   **Supports (a) Dismissing Feedback Study?** **No.** A tool can be useful without a world model (e.g., a calculator does not "understand" arithmetic but yields correct sums).
  *   **Supports (b) Prediction Scaling Fails?** **No.** It leaves open the possibility that "understanding" is an emergent property of complex statistical modeling.
  *   **Survives Human Predictability?** **Yes.** This claim makes no comparison to humans.
  *   **Survives Novel/Non-Verbatim Output?** **Yes.** Sampling from a distribution inherently produces novel strings; verbatim reproduction is not required for this thesis to hold.

  ### 2. The Grounding Deficit
  **Thesis:** *The model's symbols are ungrounded; they refer to other tokens in the training corpus rather than to entities, properties, or states of affairs in the external world.*
  *   **Status:** **Substantive and Defensible.** This relies on semantic externalism (meaning requires a causal link to the world).
  *   **Claim Type:** **Conceptual/Semantic.** It defines meaning as requiring a connection outside the text stream.
  *   **Supports (a) Dismissing Feedback Study?** **Partially.** If "evaluating an essay" requires referencing the actual student's intent or the real-world truth of claims, the model lacks the capacity to do so. However, if evaluation is purely formal (grammar, structure), this claim does not dismiss the study.
  *   **Supports (b) Prediction Scaling Fails?** **Yes.** If grounding is a prerequisite for understanding, and scaling only adds more text, the gap cannot be closed without multimodal/embodied input.
  *   **Survives Human Predictability?** **Yes.** Humans have sensory-motor bodies; the claim highlights a *difference* between humans and LLMs, not a similarity.
  *   **Survives Novel/Non-Verbatim Output?** **Yes.** One can generate novel sentences about unicorns without grounding; novelty does not confer reference.

  ### 3. The Illocutionary Gap
  **Thesis:** *The model produces sentences but does not perform speech acts; it has no communicative intent, cannot assert truths, and bears no responsibility for its utterances.*
  *   **Status:** **Substantive and Defensible.** Based on Speech Act Theory (Austin/Searle). The model simulates the *locution* (words) without the *illocution* (intent/force).
  *   **Claim Type:** **Conceptual/Pragmatic.** It concerns the social function of language.
  *   **Supports (a) Dismissing Feedback Study?** **Yes.** Feedback is inherently an illocutionary act (an evaluation, a suggestion, a critique). If the model cannot intend to evaluate, it is merely simulating the *form* of feedback, rendering the study's measure of "feedback quality" superficial.
  *   **Supports (b) Prediction Scaling Fails?** **Yes.** If understanding is tied to agency and intent, statistical scaling cannot produce a moral or communicative agent.
  *   **Survives Human Predictability?** **Yes.** While human speech is predictable, humans possess intent. The claim distinguishes the *source* of the utterance, not its predictability.
  *   **Survives Novel/Non-Verbatim Output?** **Yes.** One can fluently answer novel questions without having intent (e.g., a parrot answering a question it was trained to answer in varied contexts).

  ### 4. The Derivative Creativity Claim
  **Thesis:** *The model cannot generate propositions genuinely novel to its training distribution; it can only recombine or interpolate between fragments of existing text.*
  *   **Status:** **Contested / Likely False.** Empirical evidence suggests LLMs can solve novel reasoning tasks and write code for libraries not seen in training, suggesting latent abstraction rather than mere recombination.
  *   **Claim Type:** **Empirical.** It makes a testable prediction about out-of-distribution generalization.
  *   **Supports (a) Dismissing Feedback Study?** **Yes.** If the "insightful" feedback is merely a recombination of existing pedagogical advice found online, it is not genuine evaluation of *this* student's unique work.
  *   **Supports (b) Prediction Scaling Fails?** **Yes.** If the system is fundamentally derivative, it cannot achieve the generative flexibility characteristic of understanding.
  *   **Survives Human Predictability?** **Yes.** Humans are also influenced by prior input, but we credit them with novelty if they synthesize in new ways. This claim denies the model that same credit.
  *   **Survives Novel/Non-Verbatim Output?** **No.** This is the specific vulnerability. If the model answers a truly novel question fluently without verbatim training strings, this thesis is empirically undermined unless "recombination" is defined so loosely as to become trivial.

  ### 5. The Categorical Exclusion (The Strong Claim)
  **Thesis:** *Statistical correlation between symbols is categorically insufficient for semantic understanding, regardless of complexity, scale, or performance.*
  *   **Status:** **Philosophical / Stipulative.** This is the core "Chinese Room" argument applied to deep learning. It defines understanding as something non-statistical (e.g., causal, embodied, or phenomenal).
  *   **Claim Type:** **Conceptual / Stipulative.** It functions as a definition of what deserves the word "understanding."
  *   **Supports (a) Dismissing Feedback Study?** **Yes.** It renders the study category-invalid. No matter how good the feedback looks, it is semantically empty by definition.
  *   **Supports (b) Prediction Scaling Fails?** **Yes.** This is the only thesis that guarantees scaling will *never* work, as it posits a kind mismatch, not a capacity limit.
  *   **Survives Human Predictability?** **No.** This is the critical weakness. If human cognition is also fundamentally predictive (as suggested by predictive processing theories in cognitive science), then statistical correlation *is* sufficient for understanding (since humans understand). To maintain this thesis, one must assert humans possess a non-statistical component.
  *   **Survives Novel/Non-Verbatim Output?** **Yes.** Even perfect performance on novel tasks is dismissed as "stochastic" trickery rather than understanding.

  ***

  ### Conclusion: Diagnosing Your Reading Group

  The two uses of the slogan in your meeting depended on **Thesis 5 (The Categorical Exclusion)**, but they smuggled in **Thesis 3 (The Illocutionary Gap)** to do the rhetorical work.

  1.  **To dismiss the feedback study (Use 1):** The group relied on the idea that because the model lacks intent (Thesis 3), its output cannot count as "evaluation." However, to ensure this dismissal holds regardless of how good the feedback is, they leaned on Thesis 5 (it's *just* statistics, so it doesn't count).
  2.  **To predict scaling failure (Use 2):** This relies entirely on Thesis 5. If understanding were an emergent property of statistical complexity (Thesis 1), scaling might work. Thesis 5 asserts it cannot.

  **Can a reasonable opponent accept this reading?**
  A reasonable opponent (e.g., a functionalist or pragmatist) **cannot accept Thesis 5** while maintaining that the models are useful, *if* "useful" implies a proxy for understanding. However, they **can accept Thesis 5** if they adopt an **Instrumentalist Stance**:
  *   *"Yes, the model is a stochastic parrot without understanding (Thesis 5 is true). However, 'understanding' is a folk-psychological term we project onto systems that predict behavior well. The model is useful not because it understands, but because it simulates understanding well enough for the task."*

  **Recommendation for the Group:**
  Ask your colleagues to specify if they are making an **empirical claim** (the model fails at task X because of architecture) or a **conceptual claim** (the model fails at task X because it lacks 'mind').
  *   If empirical, Thesis 4 is vulnerable to data (novel question answering).
  *   If conceptual, Thesis 5 is vulnerable to the "Human Predictability" objection (are we stochastic parrots?).

  If they cannot answer this, the slogan is doing no work other than signaling allegiance to a specific philosophical stance on cognition.
