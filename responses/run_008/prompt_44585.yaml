answer: |-
  # The Intuition Audit: What Do You Do When Gut Feelings Clash?

  You've probably heard that philosophy relies on "intuitions"—those immediate gut reactions to thought experiments like the Trolley Problem or Gettier cases. But what happens when your gut says "Yes" and someone else's says "No"?

  Recent studies suggest that intuitions aren't universal. They shift based on culture, education, and even the order in which questions are asked. This quiz doesn't ask you to recite theories. Instead, it presents ten concrete scenarios involving disagreement. Your job is to pick the reaction that feels most honest to you.

  At the end, the scoring key will map your pattern of responses to one of six philosophical profiles.

  ***

  ### 1. The Name Game (Gödel)
  **The Case:** You present the classic "Gödel" case to two groups. John learns that Gödel proved a famous theorem, but in reality, a man named Schmidt did the work and Gödel stole it. When John says "Gödel," is he talking about the thief (Gödel) or the prover (Schmidt)?
  **The Disagreement:** Group A (mostly Western) says "The Thief." Group B (mostly East Asian) says "The Prover." Both groups understood the story perfectly.
  **Your Reaction:**
  *   **A.** One group is misidentifying the reference; there is a fact of the matter about who John means.
  *   **B.** They are using the name "Gödel" to pick out different things; both are correct relative to their linguistic habits.
  *   **C.** This specific case is too ambiguous to settle anything; the story doesn't give enough context about John's intent.

  ### 2. The Rain Ritual (Invented)
  **The Case:** In a remote village, everyone believes a specific dance causes rain. It rains 50% of the time they dance, purely by chance. The villagers unanimously say, "We *know* the dance works."
  **The Disagreement:** An external epistemologist says, "They don't *know* that; it's just luck." The villagers insist they do.
  **Your Reaction:**
  *   **A.** The villagers are wrong; their consensus doesn't change the fact that their belief isn't properly connected to the truth.
  *   **B.** The word "know" means something different in the village than it does in the epistemologist's seminar; they aren't actually disagreeing.
  *   **C.** If the whole community agrees and relies on it successfully enough to survive, calling it "knowledge" is useful enough for them.

  ### 3. The Trolley Switch (Culture)
  **The Case:** A runaway trolley will kill five people. You can pull a lever to divert it, killing one person instead.
  **The Disagreement:** In Study X, 80% of participants in Country A say "Pull." In Country B, only 40% say "Pull."
  **Your Reaction:**
  *   **A.** Morality is universal; one of these cultures has a mistaken intuition about the value of life.
  *   **B.** Moral concepts are shaped by social structures; neither intuition is "mistaken," they just serve different social functions.
  *   **C.** This variation suggests we shouldn't use trolley problems to figure out objective morality in the first place.

  ### 4. The Dinner Party (In-Group vs. Out-Group)
  **The Case:** You argue about a moral case at dinner.
  **The Disagreement:** Scenario 1: Your best friend, who shares your background and education, disagrees with your intuition. Scenario 2: A person from a culture you know little about disagrees with your intuition.
  **Your Reaction:**
  *   **A.** I am more worried when my friend disagrees; that suggests *I* might be making a reasoning error.
  *   **B.** I am more worried when the stranger disagrees; that suggests my view might be culturally biased.
  *   **C.** I am equally worried in both cases; disagreement is a signal to check my arguments regardless of the source.

  ### 5. The Wording Switch (Framing)
  **The Case:** You ask people if an action is "permissible." 70% say Yes. You ask the exact same people if the action is "forbidden." Only 40% say No (which is the same as permissible).
  **The Disagreement:** The same person gives conflicting intuitions based on synonyms.
  **Your Reaction:**
  *   **A.** This shows people aren't reliable reporters of their own moral views; we should discard this data.
  *   **B.** This is just a performance error, like a typo; their underlying competence is stable if we ask better.
  *   **C.** This proves that "permissibility" isn't a fixed property; it shifts with how the question is framed.

  ### 6. The Philosophy Major (Expertise)
  **The Case:** Laypeople give wildly different intuitions on a complex case. Professional philosophers with 10+ years of training show high agreement.
  **The Disagreement:** The novices say X, the experts say Y.
  **Your Reaction:**
  *   **A.** The experts have trained out the noise; their intuition is the evidence that matters.
  *   **B.** The experts are an echo chamber; the laypeople represent the real human intuition we care about.
  *   **C.** If the answer depends on a degree, we aren't discovering truth, we're just learning a specific jargon game.

  ### 7. The Definition Shift (Concepts)
  **The Case:** Two groups argue about whether a robot can "feel pain." Group 1 defines pain as "neural firing." Group 2 defines pain as "behavioral distress."
  **The Disagreement:** Group 1 says "No." Group 2 says "Yes."
  **Your Reaction:**
  *   **A.** One definition is scientifically more accurate; we should correct the group using the wrong one.
  *   **B.** This is a purely verbal dispute; once they clarify definitions, the disagreement vanishes.
  *   **C.** The fact that definitions vary this much shows "pain" is too messy a concept for rigorous philosophy.

  ### 8. The Theory Trap (Method)
  **The Case:** You have a ethical theory that perfectly predicts all the data and solves all logical contradictions. However, it violates your gut feeling on one famous case.
  **The Disagreement:** Your Theory says "Do X." Your Intuition says "Never do X."
  **Your Reaction:**
  *   **A.** Trust the theory; intuitions are often buggy heuristics.
  *   **B.** Trust the intuition; if a theory violates deep moral instincts, the theory is broken.
  *   **C.** Revise the theory until it matches the intuition; that's the whole point of doing philosophy.

  ### 9. The Expert Deadlock (Skepticism)
  **The Case:** Even among top-tier experts, there is no consensus on a foundational case (e.g., specific Gettier variants). They have debated it for 50 years.
  **The Disagreement:** The experts are split 50/50.
  **Your Reaction:**
  *   **A.** We haven't found the right argument yet; keep working on it.
  *   **B.** This indicates there is no fact of the matter to find; the question is ill-posed.
  *   **C.** This shows that intuition-based methods have reached their limit; we need a new methodology (e.g., empirical science).

  ### 10. The WEIRD Sample (Bias)
  **The Case:** 90% of published philosophy studies rely on participants from Western, Educated, Industrialized, Rich, Democratic (WEIRD) societies.
  **The Disagreement:** A critic says, "Your conclusions are just local customs." The philosopher says, "Basic logic is universal."
  **Your Reaction:**
  *   **A.** The critic is right; we cannot generalize these findings to humanity as a whole.
  *   **B.** The philosopher is right; cognitive architecture is shared, so the sample size doesn't invalidate the logic.
  *   **C.** Both are partially right; the logic holds, but the *importance* of the cases might be culturally specific.

  ***

  ## Scoring Key

  Count up your answers. You likely won't have a perfect score for one letter—that's normal. Look for the cluster that matches your majority. Be honest: if you split evenly between two, read both profiles.

  ### Mostly A's: The Gatekeeper & The Expert
  **Positions:** *Deflationary Discounting* or *Expertise Defense*.
  **The Gist:** You believe there is a truth of the matter, but not everyone has equal access to it. You are comfortable saying that some groups (often the untrained or the culturally specific) are "wrong" or "biased" while others (often the experts or your own group) are tracking reality.
  **The Tension:** You need to be careful about *why* you discount certain intuitions. If you discount the East Asian response in Q1 but trust the Philosopher response in Q6, you are an **Expert**. If you discount the "foreign" response in Q3 but trust the "friend" response in Q4, you are a **Gatekeeper**.
  **Honesty Check:** This view risks circularity. How do you know the experts are right without using the very intuitions they hold?

  ### Mostly B's: The Translator & The Relativist
  **Positions:** *Conceptual Relativism* or *Moral Pluralism*.
  **The Gist:** You see disagreement as a sign of difference, not error. When people clash, you suspect they are using different concepts (like "knowledge" or "pain") or operating within different valid frameworks. Nobody is necessarily wrong; they are just speaking different "languages."
  **The Tension:** This makes philosophy very peaceful but potentially toothless. If every disagreement is verbal (Q7), do we ever actually solve problems?
  **Honesty Check:** Are you willing to apply this to yourself? If a culture intuits that slavery is permissible, is that just a "different concept" of personhood, or is it a mistake?

  ### Mostly C's: The Skeptic & The Architect
  **Positions:** *Radical Skepticism* or *Methodological Minimalism*.
  **The Gist:** You think the variation proves the tool is broken. If intuitions flip based on wording (Q5) or culture (Q3), they can't be the foundation of philosophy.
  *   **If you leaned toward "We need new methods" (Q9, Q10):** You are a **Skeptic** about intuition. You want philosophy to look more like science.
  *   **If you leaned toward "Trust the theory over the gut" (Q8):** You are an **Architect**. You think intuitions were never the point; the arguments and logical coherence are what matter. Intuitions are just decorations.
  **The Tension:** It is very hard to do philosophy without *any* appeal to what seems plausible. Even "logic" relies on some intuitions about validity.
  **Honesty Check:** If you throw out intuitions, what do you replace them with? If the answer is "data," where does the interpretation of that data come from?

  ### The Mixed Bag (Most Common Result)
  **Position:** *Performance Error Theorist* or *Pragmatist*.
  **The Gist:** You probably picked A on some, B on others. You think *some* variation is noise (distraction, wording, Q5) and *some* variation is real difference (Q3). You try to filter the signal from the noise case-by-case.
  **The Diagnosis:** This is the most common view among working philosophers, though rarely admitted. It requires a lot of judgment calls.
  **Honesty Check:** This view is vulnerable to the "Bias Blind Spot." It is very easy to categorize the intuitions you agree with as "Signal" and the ones you disagree with as "Noise." Look closely at Q4 (Friend vs. Stranger). If you treat your friends' disagreements as "reasoning errors" but strangers' disagreements as "cultural differences," you may be protecting your own bias under the guise of pragmatism.

  ### A Note on Overlaps
  This quiz cannot perfectly separate **The Skeptic** from **The Architect**. Both reject the authority of raw intuition, but one wants to abandon the project (Skeptic) while the wants to rebuild it on theory (Architect). If you scored high on C, ask yourself: *Do I want to stop using thought experiments, or just stop trusting my gut feeling about them?*

  Similarly, **The Gatekeeper** and **The Expert** often overlap. The distinction lies in whether you think training *reveals* the truth (Expert) or merely *filters* the biased (Gatekeeper). If you think philosophy makes you *better* at seeing truth, you're an Expert. If you think it just makes you *less* susceptible to cultural bias, you're a Gatekeeper.
