  1. **The mapping**
  The players were primarily the United States and the Soviet Union, joined by Britain. Their options were to continue atmospheric testing, abstain unilaterally, shift operations underground, or negotiate a ban. The payoffs involved securing military-technical advantages against incurring domestic and global health costs. The "bottom" raced toward was a heavily contaminated biosphere yielding diminishing strategic returns. This differs from a standard two-player prisoner's dilemma because the primary victims—the global public consuming strontium-90—had no seat at the table. In a classic dilemma, players harm each other directly; here, competitors harmed themselves slightly but externalized the bulk of the damage onto non-participants. Competitors were also victims, yet powerless to stop the cycle without mutual agreement. Unilateral disarmament risked strategic inferiority while costs were distributed globally, complicating incentives beyond simple bilateral competition.

  2. **Where the trap model fits**
  The trap model fits the pre-1963 period well because the incentives aligned with competitive externalization. Each superpower faced pressure to validate new warhead designs, particularly for missile delivery, where atmospheric data was easiest to gather. Defecting—testing while others paused—offered a private profit in technical knowledge and perceived resolve. Conversely, unilateral abstention ceded a potential advantage, creating a classic race dynamic. Crucially, the costs were externalized. The health burdens fell on global populations, not the decision-makers in Washington or Moscow. This separation allowed the race to continue despite rising internal awareness of fallout risks. The trap binds when individual rationality dictates defection despite collective ruin. Here, continuing tests was individually rational for security planners who prioritized immediate strategic parity over diffuse, long-term environmental health. The model explains why testing escalated even as public controversy grew; the competitive pressure to avoid falling behind outweighed the shared interest in cleanliness until the costs became politically untenable. Furthermore, the multipolar nature intensified the trap. It was not just US versus USSR; Britain's entry complicated verification and trust. Each actor feared that any pause would be exploited by the others. The model captures the inertia: even when parties preferred a cleaner environment, competition made continuing the default. Competitive pressure ensured no nation could afford to stop first, locking them into pollution that seemed necessary short-term.

  3. **Where the model breaks**
  The model breaks down regarding the timing and the nature of the exit. By 1963, underground testing technology had matured, making atmospheric tests largely substitutable for developmental purposes. This raises a critical question: did coordination defeat the trap, or had the trap already dissolved because abstention became costless? If underground testing offered equivalent military data without the fallout, the strategic penalty for signing the treaty vanished. The evidence favors the reading that the trap had dissolved. The superpowers did not sacrifice security for safety; they sacrificed a convenient method for a slightly more expensive but equally effective one. This implies that races to the bottom are rarely exited by agreement alone when the incentives to defect remain strong. Instead, agreements tend to codify shifts that technology or changing circumstances have already made viable. If atmospheric testing remained the only way to verify high-yield weapons, the treaty likely would not have held. Therefore, the episode suggests that multipolar traps are resilient to moral suasion or negotiation unless the underlying payoff structure changes. The treaty was less a triumph of cooperation over competition and more a recognition that the competition could continue underground. This limits generalizability: coordination works only when the race no longer requires harmful behavior. The model overlooks how technological shifts render traps obsolete, making exits look like moral victories when they were strategic lateral moves.

  4. **What the episode shows about the theory**
  This episode suggests theory requires modification to account for exogenous shocks and technological substitution. It is neither a pure confirmation nor an anomaly, but a case where the trap was permeable. Exits from multipolar traps typically require something exogenous to change the payoff structure. Two shocks mattered: public health controversy over strontium-90 raised domestic political costs, and the Cuban Missile Crisis raised geopolitical tension costs. However, the technology shift was paramount. The commons-contamination side is better captured by externalized-cost models than strictly competitive ones. In a strict race, competitors harm each other. Here, they harmed the commons to compete. If harm is externalized, regulating the method solves the problem without stopping competition. Theory assumes agents are locked into actions; this case shows agents can switch to maintain competition while reducing harm. Thus, the theory should anticipate that traps may be escaped not by ending the competition, but by finding new equilibria where the competitive advantage does not require the socially costly behavior. Shared external shocks are necessary to align incentives; without outcry and fear, the status quo likely would have persisted. If the "bottom" becomes technologically obsolete, the trap collapses. It was not purely a victory of coordination, but a convergence of self-interest with safety due to progress.

  5. **Verdict**
  This is not a clean instance of a multipolar trap defeated by coordination. It is a case of a trap dissolving due to technological substitution and external pressure. The single caveat a reader should retain is that agreements are most likely to succeed when the cost of cooperation drops to near zero. Do not assume because this trap escaped, others can be negotiated away while incentives to defect remain high. The 1963 treaty worked because the superpowers could still race underground. True traps, where defection remains profitable, are far more resistant to negotiation.
