answer: |-
  ### Exam Question

  **Essay Question (90 Minutes)**

  In 1974, Karl Popper described Darwinian natural selection as a "metaphysical research programme" rather than a testable scientific theory, largely due to the worry that "survival of the fittest" constitutes a tautology. By 1978, he partially retracted this view, conceding that the theory could be tested in specific instances while maintaining reservations about its universal status.

  Write an essay evaluating the philosophical coherence of Popper's position and his retraction. Your answer must address the following:

  1.  Analyze the tautology objection. Does interpreting fitness as a causal *propensity* rather than a retrospective description successfully defuse the charge that the theory is untestable, or does this merely shift the problem?
  2.  Clarify exactly what Popper's retraction conceded. Did he come to view the *core* theory as testable, or only restricted applications? Argue whether maintaining that the core is metaphysical while applications are testable is a stable philosophical position or an unstable compromise.
  3.  Assess what this episode implies for falsificationism as a demarcation criterion. Does Popper's correction demonstrate the self-correcting strength of the methodology, or does it reveal a systemic failure where the criterion licensed a misclassification for decades?
  4.  Briefly address whether Popper's treatment of Darwinism generalizes consistently to other historical sciences, given his own reliance on "situational logic" and the Rationality Principle in explaining human history.

  *Note: No credit will be given for discussions regarding creationism or intelligent design. Focus strictly on the internal philosophical coherence of Popper's arguments.*

  ***

  ### Model Answer

  Popper's initial classification of Darwinism as metaphysical rested on the claim that natural selection is analytically true: if fitness is defined solely by differential survival, then "the fittest survive" reduces to "those who survive, survive." This renders the theory immune to falsification. However, this objection relies on a statistical definition of fitness. If fitness is interpreted as a causal *propensity*—a dispositional property of an organism to survive and reproduce in a specific environment independent of the actual outcome—the tautology is defused. Fitness becomes a theoretical posit that *predicts* survival rather than describing it post hoc. Yet, this does not fully settle the matter. Measuring propensity independently of survival statistics remains methodologically difficult, meaning the propensity interpretation saves the theory from tautology but leaves it vulnerable to the charge of being difficult to test in practice. Popper's initial verdict was thus not baseless, but it conflated difficulty of testing with impossibility of testing.

  Popper's 1978 retraction was nuanced. He did not declare natural selection a fully falsifiable theory in the same vein as Newtonian physics. Instead, he conceded that *specific applications* of the theory (e.g., industrial melanism) are testable, while suggesting the general principle might retain a metaphysical character. This is an unstable compromise. If a theory's core principles cannot be tested, but its specific models can, the core functions as a heuristic rather than a scientific law. By retaining the "metaphysical research programme" label for the general theory while accepting the scientific status of its instances, Popper attempts to salvage falsificationism without admitting the criterion was too blunt. However, this creates a dichotomy where a theory is scientifically useful and empirically successful yet ontologically "metaphysical." A more coherent view would acknowledge that the theory is testable in principle, even if universal claims are hard to falsify outright.

  This episode weighs heavily against falsificationism as a rigid demarcation criterion. If the criterion requires decades of external pressure from biologists and philosophers to correct a misclassification of biology's central theory, it lacks the robustness Popper claimed. Proponents might argue that Popper's willingness to correct himself shows the methodology is self-correcting. However, a demarcation criterion should distinguish science from non-science *ex ante*, not *ex post*. That Popper misclassified Darwinism suggests the criterion is sensitive to the philosopher's understanding of the theory's structure rather than the theory's actual empirical content. It reveals that falsificationism is often applied dogmatically before being adjusted pragmatically.

  Finally, Popper's treatment of Darwinism sits uneasily with his methodology for the historical social sciences. Popper advocated for "situational logic," where human action is explained via the "Rationality Principle"—the assumption that agents act appropriately to their situation. Popper admitted the Rationality Principle is almost empty and not strictly testable, yet he deemed it essential for historical explanation. If untestable principles are permissible in historical sociology to generate testable situational models, rejecting Darwinism for similar reasons is inconsistent. Both are historical sciences relying on general principles to explain particular events. Popper's harsher demarcation against Darwinism suggests a bias against biological reductionism rather than a consistent application of his own logic of scientific discovery. Ultimately, the episode highlights the difficulty of applying a logic of physics to the complex, historical nature of biological explanation.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Analysis of Tautology and Propensity (4 Marks)**
  *   **Must Hit:** Student must explain that the tautology arises from defining fitness retrospectively and evaluate whether the *propensity* interpretation solves this or merely shifts the evidential burden.
  *   **Loss of Marks:** Treating the propensity interpretation as a definitive "solution" that settles the debate, rather than a move that invites further methodological scrutiny regarding independent measurement.

  **2. Nature of Popper's Retraction (4 Marks)**
  *   **Must Hit:** Student must distinguish between the testability of *specific applications* (which Popper accepted) and the *general theory* (which Popper kept as metaphysical).
  *   **Loss of Marks:** Reading the retraction as a simple, total recantation where Popper admitted Darwinism is "just like physics" without nuance.

  **3. Stability of the Compromise Position (4 Marks)**
  *   **Must Hit:** Student must argue whether it is coherent to label a theory's core "metaphysical" while accepting its instances as "scientific." (e.g., Is it a stable heuristic view or a contradiction?)
  *   **Loss of Marks:** Failing to evaluate the *stability* of the position, merely describing what Popper said without critiquing the logical tension between the two statuses.

  **4. Implications for Falsificationism (4 Marks)**
  *   **Must Hit:** Student must take a stance on whether this episode validates falsificationism (as self-correcting) or undermines it (as too blunt/slow to demarcate effectively).
  *   **Loss of Marks:** Derailing into the forbidden creationism/evolution debate, or claiming the episode proves falsificationism is "wrong" without explaining *why* regarding the criterion's function.

  **5. Generalization to Historical Sciences/Situational Logic (4 Marks)**
  *   **Must Hit:** Student must connect the Darwinism case to Popper's "situational logic" in social science, noting the inconsistency in allowing untestable principles there but not in biology.
  *   **Loss of Marks:** Omitting the reference to situational logic entirely, or failing to draw the comparative parallel between the Rationality Principle and Natural Selection.
