answer: |-
  This is a sharp hunch. You are correct that the "spec sheet" is often the real philosophical payload here, because the history of this problem is essentially a history of theorists choosing which desideratum to sacrifice. The analogy to the neural binding problem is heuristic gold: it isolates the structural issue (combination vs. collection) from the metaphysical baggage, though the stakes differ (truth conditions vs. signal coherence).

  Here is the spec sheet for an adequate theory of propositional unity, followed by the incompatibility matrix and the scorecard.

  ### The Spec Sheet: Desiderata for Propositional Unity

  **1. The Distinction Criterion (Non-Negotiable)**
  *   **Requirement:** The theory must ontologically or functionally distinguish a unified proposition from a mere aggregate (set, list, or heap) of its constituents.
  *   **Motivating Case:** The set {Socrates, Wisdom} exists whenever the proposition *Socrates is wise* exists, but the set does not predicate wisdom of Socrates. It has no truth conditions. The theory must identify the "glue" or structural feature that converts the list into a claim.
  *   **Status:** If you fail this, you haven't addressed the problem; you've dissolved the subject matter.

  **2. The Regress Terminator (Non-Negotiable)**
  *   **Requirement:** The account of unity must not generate a vicious infinite regress (Bradley's Regress).
  *   **Motivating Case:** If a relation $R$ unifies $a$ and $b$, is $R$ related to $a$ by a further relation $R'$? If yes, regress. If no, why was $R$ allowed to unify without help while $a$ and $b$ needed help? The theory must explain why the chain stops without arbitrariness.
  *   **Status:** A vicious regress renders the explanation vacuous. (Note: A *benign* regress is a possible escape hatch, but must be argued for).

  **3. The No-Smuggling Rule (Non-Negotiable)**
  *   **Requirement:** The machinery used to explain unity cannot itself presuppose the very unity it is meant to explain.
  *   **Motivating Case:** Explaining predication by invoking a "combining relation" often smuggles in predication (since the relation must *apply* to the relata). Explaining the proposition by invoking a "judging mind" smuggles in the mind's ability to form unified thoughts.
  *   **Status:** Circular explanations are formally invalid.

  **4. The Falsehood Condition (Non-Negotiable)**
  *   **Requirement:** The theory must account for the unity of false propositions equally with true ones.
  *   **Motivating Case:** *Socrates is foolish* is just as unified a proposition as *Socrates is wise*, even if Socrates isn't foolish. If unity relies on the existence of a "fact" or "state of affairs," false propositions risk becoming nothing at all (Meinongian embarrassment) or losing their unity.
  *   **Status:** A theory that only unifies truths fails to explain the nature of *propositions* (which are bearers of truth values, not just truth).

  **5. Ontological Parsimony (Aesthetic/Debatable)**
  *   **Requirement:** Minimize the introduction of new categories of being (e.g., modes of being, non-merelogical composition, abstract facts).
  *   **Motivating Case:** Positing a "State of Affairs" as a primitive entity solves unity but clutters the ontology. Nominalist preferences weigh heavily here.
  *   **Status:** Preferable, but many realists argue reality is just cluttered. Sacrificing this is often the price of satisfying 1–4.

  **6. Cognitive Realizability (Aesthetic/Debatable)**
  *   **Requirement:** It should be plausible that a cognitive agent (human or AI) could grasp or instantiate this unity.
  *   **Motivating Case:** If the "glue" is a metaphysical abstraction inaccessible to thought, how do we think propositions? This is where your binding problem analogy lives.
  *   **Status:** Important for naturalists, less so for Platonists.

  ---

  ### The Incompatibility Matrix

  Your hunch is correct, but I would sharpen the conflict. The jointly unsatisfiable pair is **Full Analyzability** (a subset of No-Smuggling) and **Non-Brute Termination**.

  *   **The Conflict:** To satisfy **No-Smuggling**, you want to analyze unity into constituent parts and a combining principle. But any combining principle (a relation, a function, a copula) either *is* a unity (smuggling) or *needs* combining (Regress). To stop the regress (**Regress Terminator**), you must eventually posit something that unifies *brutely*—it just does the job without further explanation (e.g., Armstrong's "non-merelogical composition" or the Tractarian "logical form").
  *   **The Verdict:** You cannot have a theory that fully analyzes unity without presupposing it *and* terminates without brute facts. Every theory must choose: either accept a brute primitive (sacrificing Full Analyzability) or accept a regress and argue it is benign (sacrificing the standard interpretation of Regress Termination). There is no "free" explanation of unity; it is either a fundamental feature of reality or a linguistic illusion.

  ---

  ### Contender Scorecard

  **Armstrong-style States of Affairs**
  Armstrong bites the ontological bullet to save unity. He posits "states of affairs" as the basic particulars, where instantiation is not a relation but a non-merelogical mode of composition. This satisfies the **Distinction Criterion** robustly and stops the **Regress** by fiat (instantiation doesn't need a further linker). However, it struggles with **Parsimony** (new ontological category) and the **Falsehood Condition** (false propositions must correspond to non-existent states of affairs, requiring a Meinongian tweak or a linguistic proxy). It solves the metaphysics by making unity primitive.

  **The Tractatus Picture Theory**
  Wittgenstein argues that a proposition shares a "logical form" with the fact it depicts; the unity is shown by the arrangement of names, not said by a further symbol. This elegantly satisfies **No-Smuggling** (no copula needed) and **Termination** (form is transcendental). However, it fails the **Falsehood Condition** in its strictest reading (a false picture depicts a non-existent configuration, raising questions about its sense) and ultimately sacrifices **Cognitive Realizability** for mysticism ("what can be shown cannot be said"). It dissolves the regress by silencing the question.

  **Trope-Bundle Approaches**
  This view treats properties as particularized (tropes) and objects as bundles of compresent tropes. Unity is provided by a "compresence" relation. It scores high on **Parsimony** (no universals) but is highly vulnerable to **Bradley's Regress** regarding the compresence relation itself (what binds the tropes to the compresence?). It often handles **Falsehood** by treating false propositions as mismatched bundles, but risks collapsing the **Distinction Criterion** if compresence is just another trope in the bundle.

  **Deflationary / Pragmatic Moves**
  This camp (later Wittgenstein, Brandom, some neo-Fregeans) argues the problem is a category mistake. Propositions aren't metaphysical objects needing glue; they are moves in a language game or inferential roles. This maximizes **Parsimony** and avoids **Regress** by denying the metaphysical premise. However, it arguably fails the **Distinction Criterion** in the realist sense (it explains linguistic practice, not truth-makers) and sidesteps the **Falsehood Condition** by treating truth as assertibility. It solves the problem by claiming there is no problem, only grammar.

  ---

  ### On the Binding Problem Analogy

  The analogy is load-bearing for **Distinction** and **Cognitive Realizability**, but breaks down on **Falsehood** and **Ontology**. In neuroscience, "binding" is a causal/functional mechanism (e.g., synchronous firing) that distinguishes *red-triangle* from *red + triangle* in processing; this maps perfectly to the structural requirement of unity without regress (the synchrony *is* the glue, no further glue needed). However, the neural binding problem doesn't care about truth conditions—a brain can bind "red" and "square" falsely without metaphysical embarrassment. The neural version is about *correlation*; the propositional version is about *normativity* (correctness). If you are naturalizing the mind, the neural solution (functional binding) might satisfy the cognitive desiderata, but it leaves the metaphysical desiderata (what makes that binding *true* or *about* something) untouched.
