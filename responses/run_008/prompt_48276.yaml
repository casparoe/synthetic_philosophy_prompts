      *   *Check:* Is the "Novel Prediction" mapping honest? *Action:* Admit it's the weakest link. Code doesn't predict; it *accommodates*. The "prediction" is really "architectural capacity."
      *   *Check:* Is the distinction between "Hard Core" and "Implementation" clear? *Action:* Emphasize *Invariants* over specific lines of code.

  8.  **Final Polish:** Organize into clear sections: The Mapping, Residue Q1, Residue Q2. Use formatting (bolding, lists) for readability. (Proceed to generate output based on these thoughts.)

  *(Self-Correction on "Novel Prediction"):* I need to be careful here. In Lakatos, a progressive theory predicts something *unexpected* that turns out to be true. In software, we don't usually discover unexpected truths. We satisfy requirements. A better mapping might be "Unplanned Capability." If the architecture allows a feature you *didn't* design for initially to be added easily, that's "novel predictive power." I will use this nuance.

  *(Self-Correction on "Truth"):* Science seeks truth. Software seeks *correctness relative to spec*. But specs change. So "Truth" in SE is "Business Value." I need to make sure this distinction is sharp in Q2.

  9.  **Finalizing the Structure:**
      *   **Intro:** Acknowledge the insight (it's a good analogy).
      *   **Part 1: The MSRP Mapping:** Break down Core, Belt, Heuristics, Shift.
      *   **Part 2: Residue Report Q1:** Parallel runs vs. Retrospective rationality.
