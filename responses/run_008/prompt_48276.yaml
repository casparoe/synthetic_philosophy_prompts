      *   **Task:**
          1.  **Map Lakatos to Software Engineering:** Translate Imre Lakatos's "Methodology of Scientific Research Programmes" (MSRP) into software engineering vocabulary (hard core, protective belt, heuristics, progressive/degenerating). Be honest about fit/misfit.
          2.  **Residue Report (The Core Value):** Address two specific questions:
              *   *Q1:* Does the ability to run systems side-by-side (forking/strangler fig) dissolve the Lakatosian tension (retrospective rationality), or is the rewrite/refactor debate still genuine?
              *   *Q2:* What in Lakatos has *no* expression in SE vocabulary? Is it a gap in SE vocabulary or a flaw in Lakatos? Flag any smuggled assumptions (e.g., copyability of code).
      *   **Tone:** Professional, peer-to-peer (engineer to engineer), intellectually rigorous, honest (admit where the analogy breaks), no fluff.

  2.  **Deconstruct Lakatos (MSRP) for the Mapping:**
      *   *Research Programme:* A sequence of theories sharing a core. -> *Codebase/Project Lifecycle.*
      *   *Hard Core:* Fundamental assumptions, irrefutable by convention. -> *Architectural Invariants/Core Domain Logic.*
      *   *Protective Belt:* Auxiliary hypotheses, adjustable to save the core. -> *Shims, Adapters, Special Cases, Config Flags.*
      *   *Negative Heuristic:* Don't touch the hard core. -> *Coding Standards, "Don't touch legacy" rules.*
      *   *Positive Heuristic:* How to develop the belt/core. -> *Roadmap, Refactoring Strategy.*
      *   *Novel Prediction:* Predicting new facts. -> *New Features/Capabilities without regression.*
      *   *Progressive Problemshift:* Theory predicts new facts + explains old ones. -> *Feature velocity + stability.*
      *   *Degenerating Problemshift:* Theory only patches anomalies, no new predictions. -> *Bug fix treadmill, technical debt accumulation.*
      *   *Rival Programmes:* Competing theories. -> *Microservices vs. Monolith, Rewrite vs. Legacy.*

  3.  **Drafting the Mapping (Iterative Refinement):**
      *   *Hard Core:* In payments, this is the ledger integrity, the saga coordinator rule. It's not just "code," it's the *invariants*.
      *   *Protective Belt:* This is the `if (client == 'special_one')` blocks. The adapters.
      *   *Progressive:* Can we add a new payment provider easily? (Yes = Progressive).
      *   *Degenerating:* Does adding a provider require 3 new shims and break 2 old tests? (Yes = Degenerating).
      *   *Honesty Check:* Does code have "predictions"? Not really. It has *requirements*. A "novel prediction" in science is like a "new use case supported without breaking old ones." I need to be careful not to stretch "prediction" too far. Code doesn't predict nature; it executes logic. The "prediction" is "this architecture will support requirement X."

  4.  **Addressing Residue Question 1 (Side-by-Side vs. Retrospective Rationality):**
      *   *Lakatos:* You often don't know if a programme is degenerating until a rival succeeds. Rationality is retrospective.
      *   *SE:* We *can* run A/B tests. Strangler fig allows parallel run.
      *   *Analysis:* Does this solve it? No. Because the cost of the parallel run is the variable. The "rationality" is still retrospective regarding *business value*. You can run them side-by-side, but knowing *which one is cheaper to maintain* takes time. Also, the "rewrite" often fails not technically but organizationally (Brooks's Law, domain knowledge loss). So the Lakatosian tension remains: is the degeneration fixable (refactor) or fatal (rewrite)? The empirical data exists but is noisy (velocity vs. stability).
      *   *Key Insight:* The ability to fork doesn't remove the risk; it just changes the cost function. Lakatos's point about "tenacity" (sticking with a degenerating programme because it might turn progressive) maps perfectly to "don't rewrite, refactor."

  5.  **Addressing Residue Question 2 (What's Missing/Smuggled):**
      *   *Missing in SE:* "Truth." Science aims at truth (verisimilitude). Software aims at *utility* or *value*. A buggy program that makes money is "successful" in SE, but "false" in Science.
