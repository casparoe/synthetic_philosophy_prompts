  So my friend Dev and I had a genuinely stupid two-hour argument last night about Death in Damascus (the Gibbard and Harper thought experiment from the 70s, the one that's sort of a companion case to Newcomb — it riffs on a Borges story, though I only half remember the details, so let me set it up how I understand it). You're in Damascus at noon and you literally bump into Death, who makes a threatening gesture. You know Death will come for you tomorrow, and that tomorrow he'll be in exactly one of two places: Damascus or Aleppo. If he's in whichever city YOU're in, you die; if you're in the other one, you live. You have the option to ride overnight to Aleppo. And the kicker: Death is an extremely good predictor of your choices — call it 99% accurate — and he goes to the city he predicted you'd be in, and everyone in the case knows about the prediction accuracy. There's also a small cost to fleeing: a miserable night on horseback, and dying exhausted in Aleppo seems marginally worse than dying at home, but not much.

  Dev is a hardcore two-boxer and he walked me through what he says is the obvious causal analysis: your choice tonight doesn't causally affect where Death is tomorrow, his location is already fixed by a prediction he made, so you should reason over the fixed possibilities — if he's in Damascus, flee; if he's in Aleppo, stay — and since he turned up in Damascus looking almost surprised to see me (implying he'd planned on Aleppo, like he'd predicted I'd run), the causally smart move is... actually here's where it got murky, because Dev's own version came out weird: he admitted that if he's confident he'll follow the causal recommendation, his belief about where Death is flips, and then the causal recommendation flips too, and it never settles. But he still insisted the evidential/one-boxer answer — "stay home, you can't outpredict a near-perfect predictor, all fleeing gets you is a doomed night ride into the city where he's waiting" — confuses being rational with being lucky, and that any theory that recommends staying is recommending an act that's ~certain to kill you.

  Here's what I actually want from you: a real number, not vibes. Your credence that staying in Damascus is the rational choice in this case as I've set it up, decomposed into the sub-questions it hangs on. I'd expect something like: your probability that causal decision theory rather than evidential/one-boxer reasoning is the right general framework for cases like this; your probability that, even granting CDT, its verdict in THIS case is genuinely unstable (flipping depending on what the agent believes she'll do) versus my having botched Dev's presentation of it; your probability that the 99% versus literally-perfect predictor stipulation changes which act is rational (like, does anything like dominance reasoning even get a grip when the prediction tracks the act?); your probability that a decision theory whose recommendation is, by its own lights, foreseen to be useless counts as thereby refuted, versus the "rationality is about acting right given your evidence, not about winning" line; plus any other terms you think belong. Give each term a number and a one-line justification, show me how they combine into your final credence, and tell me which term you're least confident in and what argument or consideration would most move it. For calibration: my credence that staying is rational is about 0.55 and Dev's that fleeing is rational is about 0.85 — so also tell me where you'd guess the actual disagreement between us lives (framework choice? what CDT really says here? whether self-defeating advice is a mark against a theory?). I want to know if Dev and I even disagree about a substantive question or whether we've just triangulated a case where "the rational choice" maybe isn't well-defined at all.
