  # HANDOUT: What Do You Actually Believe? (One Page)

  **Instructions:** Answer each question honestly based on your gut reaction. There are no "correct" answers. Follow the arrows to find your moral profile.

  **Q1. The Transplant Surgeon:** A surgeon can kill one healthy patient to harvest organs and save five dying patients. Is this **permissible**?
  *   **YES** → Go to **Leaf A**.
  *   **NO** → Go to Q2.

  **Q2. The Drowning Child vs. Famine:** Is letting a child drown in a pond in front of you **equally as bad** as ignoring famine victims far away whom you could save with the same money?
  *   **YES** → Go to **Leaf A**.
  *   **NO** → Go to Q3.

  **Q3. The Trolley Switch:** A runaway trolley will kill five. You can flip a switch to divert it onto a track where it will kill one. Is this **permissible**?
  *   **NO** → Go to **Leaf B**.
  *   **YES** → Go to Q4.

  **Q4. The Footbridge:** The only way to stop the trolley is to push a large stranger off a bridge. Is this **permissible**?
  *   **YES** → Go to **Leaf A** *(Note: Check consistency with Q1)*.
  *   **NO** → Go to Q5.

  **Q5. The Medical Pair:** Is switching off a ventilator at a patient's request **morally different** from giving them a lethal injection at their request?
  *   **YES** → Go to **Leaf E**.
  *   **NO** → Go to Q6.

  **Q6. The Threshold:** If pushing the man off the bridge would save **one hundred** people instead of five, would it become **permissible**?
  *   **YES** → Go to **Leaf D**.
  *   **NO** → Go to Q7.

  **Q7. The Volunteer:** If the man on the bridge **volunteered** to be pushed, would pushing him become **perfectly fine**?
  *   **YES** → Go to **Leaf C**.
  *   **NO** → Go to **Leaf B**.

  **Q8. [Cross-Check] The Family Test:** Revisit Q1. If the five dying patients were **your family**, would killing the one healthy stranger become **permissible**?
  *   **YES** → You lean toward **Leaf D** (Pro Tanto).
  *   **NO** → You lean toward **Leaf B** or **C**.

  ---

  ### YOUR MORAL PROFILE

  **Leaf A: Straight Consequentialist**
  *The View:* Outcomes are all that matter; doing harm vs. allowing it carries no intrinsic weight.
  *The Awkward Commitment:* You must agree the surgeon is morally required to cut up the healthy patient to save the five.

  **Leaf B: Non-moralized Doing/Allowing**
  *The View:* The distinction is real based on causal facts (who initiated the threat), regardless of rights or consent.
  *The Awkward Commitment:* You must argue that pushing a volunteer off the bridge is still morally wrong, even if they want it.

  **Leaf C: Moralized Doing/Allowing**
  *The View:* The distinction matters because of rights and special obligations (e.g., distance, consent), not just physics.
  *The Awkward Commitment:* You must explain why distance makes ignoring famine victims less blameworthy than ignoring a drowning child.

  **Leaf D: Pro Tanto Distinction**
  *The View:* Doing harm is worse than allowing it, but the distinction can be outweighed by enough good consequences.
  *The Awkward Commitment:* You must identify the specific number of lives saved that suddenly makes pushing the man permissible.

  **Leaf E: Killing vs. Letting Die**
  *The View:* There is a stricter, separate line in medical cases between killing and letting nature take its course.
  *The Awkward Commitment:* You must defend why turning off a machine is not "killing," even though it causes the death just as surely as the injection.

  ***

  # TEACHER'S COMMENTARY & DEFENSE NOTES

  ### 1. Can the Case Set Separate "Killing/Letting Die" from "Doing/Allowing"?
  **Honest Flag:** **No, not by verdict alone.**
  Both the *Doing/Allowing* theorist and the *Killing/Letting Die* theorist will answer **YES** to Q5 (Ventilator vs. Injection are different). The Doing/Allowing theorist says one is an *omission* and one is an *act*. The Killing/Letting Die theorist says one is *letting die* and one is *killing*.
  *   **Why this matters for your discussion:** Use Leaf E to spark debate. Ask students *why* they think they are different. If they say "Because one is acting," they are actually on the Doing/Allowing view (Leaf B/C). If they say "Because one is interfering with nature vs. initiating death," they are on Leaf E. The tree sorts by *verdict*, but your discussion must sort by *justification*.

  ### 2. Indistinguishable Leaves
  **Honest Flag:** **Leaf B (Non-moralized) and Leaf C (Moralized) can collapse.**
  If a student answers **NO** to Q7 (Volunteer), they land on Leaf B. However, a Moralized theorist might also say "No" if they believe some rights are inalienable (you can't consent to death).
  *   **Defense:** Explain that Leaf B is rare in pure form. Most people who care about "doing" harm care because of *rights* (Leaf C). Leaf B is included to capture the intuition that "violence is just bad, period," even with consent.

  ### 3. Empty Logical Space
  **Observation:** **The "Reverse Difficulty" Zone.**
  There is no coherent leaf for someone who says the **Footbridge (Push)** is permissible but the **Trolley Switch** is not.
  *   **Why it's empty:** It is psychologically and philosophically unattractive. The Switch is intuitively easier to justify than the Bridge. A view that accepts the harder case (Push) but rejects the easier case (Switch) lacks a principled distinction (like "means vs. side-effect") and looks like arbitrary contrarianism.

  ### 4. The Cross-Check (Q8)
  **Purpose:** Q8 detects **Special Obligation** intuitions vs. **Strict Rules**.
  *   **How to use it:** If a student answered **NO** to Q1 (Surgeon/Strangers) but **YES** to Q8 (Surgeon/Family), they are inconsistent on *impartiality*. They likely hold a **Moralized/Pro Tanto** view (Leaf C or D) where special relationships override general rules. This is a great discussion starter: "Is morality impartial, or do we owe more to our family?"
  *   **Inconsistency Alert:** If they answer **YES** to Q1 (Strangers) but **NO** to Q8 (Family), they are logically consistent but emotionally unusual. If they answer **YES** to Q1 and **YES** to Q4 (Push), flag them as **Leaf A** but note they are "Hardcore" Consequentialists.

  ### 5. Defense to Your Teacher
  *   **Neutrality:** The questions avoid jargon like "deontology," "utilitarianism," or "rights." They ask for verdicts on concrete cases.
  *   **Coverage:** The five leaves cover the major positions in normative ethics regarding harm (Consequentialism, Doctrine of Doing and Allowing, Rights-based views, Threshold views, and Medical Exceptionalism).
  *   **Pedagogy:** The tree forces students to confront tensions (e.g., Switch vs. Bridge) before giving them the vocabulary to resolve them, which generates genuine curiosity for the lecture portion.
