          *   Writing/Clarity: +5 (It's coherent, even if wrong).
          *   *Base:* 100 - 70 + 5 = 35? That seems too harsh for a coherent argument, even if wrong. Let's recalibrate.
          *   *Recalibration:* This is a philosophy/history exam. Accuracy matters.
          *   Thesis (Relativism): The prompt asks "Does his argument depend on cultural relativism... OR something weaker?" The student picks Relativism. This is a defensible *starting* position, but she fails to support it against the text's appeal to Nature. Let's say -20 for missing the "Nature/Reason" nuance.
          *   Fact (Brazil): This is egregious. -15.
          *   Interpretation (Adjudication): She says "nothing to adjudicate." Montaigne clearly adjudicates Europeans as worse. -15.
          *   Rousseau: -5.
          *   Engagement with Prompt (Stability): She says stable, text suggests sliding. -10.
