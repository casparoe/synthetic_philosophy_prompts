  2.  **Analyze the Source Material (Montaigne's "Of Cannibals"):**
      *   *Core Argument:* Montaigne critiques the European habit of calling everything foreign "barbarous." He argues we should judge by "reason," not "custom."
      *   *Relativism?* This is a classic debate in Montaigne scholarship.
          *   *Strong Relativism:* No objective truth, all customs equal.
          *   *Weak Relativism/Universalism:* Customs vary, but there is a universal standard of *Nature* or *Reason* by which we *can* judge. Montaigne often suggests the Tupinambá are *closer* to nature/reason than Europeans, who are corrupted by art/civilization.
      *   *Travel:* Montaigne *did not* travel to Brazil. He spoke to a servant who had been there and to explorers. This is a factual error.
      *   *Cannibalism vs. Torture:* Montaigne argues eating a dead body is less barbarous than torturing a living one (burning, racks). This implies a moral comparison, not just "different strokes."
      *   *Stability:* Does he slide? Many scholars argue he *does* slide. He starts by questioning the label "barbarous," but ends up praising the Tupinambá virtues (courage, honesty) as *objectively* better than European vices (treachery, cruelty). This suggests he isn't a strict relativist; he thinks some things are genuinely better.
      *   *Rousseau:* The "Noble Savage" concept is often attributed retrospectively to Montaigne. While Montaigne praises the Tupinambá, calling it a formulation of Rousseau's specific thesis is anachronistic but not entirely baseless. However, saying Montaigne is "essentially the first to formulate it" is a strong claim that might oversimplify.

  3.  **Evaluate the Student's Answer against the Prompt:**

      *   *Claim 1: "It's clear Montaigne is a cultural relativist."*
          *   *Assessment:* Debatable/Likely Wrong. Most scholars argue Montaigne uses the Tupinambá to critique Europe based on a *universal* standard of nature/reason, not to say all customs are equal. He thinks the Tupinambá are *better*, not just *different*.
          *   *Cost:* Significant. This is the core thesis of the essay.

      *   *Claim 2: "Montaigne travelled to Brazil to observe the Tupinambá first hand..."*
          *   *Assessment:* Factually Wrong. Montaigne never left Europe. He relied on second-hand accounts (specifically a servant who lived with the Tupinambá for a time).
          *   *Cost:* Moderate to High. Shows lack of basic textual/biographical knowledge.

      *   *Claim 3: "...showing that their customs function perfectly well for them, so by their own standards they are every bit as civilized as we are by ours."*
          *   *Assessment:* Misinterpretation. Montaigne argues they are civilized by the standard of *Reason/Nature*, which is universal, not "by their own standards."

      *   *Claim 4: "cannibalism is barbarous by our lights, torture by theirs, and there is nothing to adjudicate between them."*
          *   *Assessment:* Wrong. Montaigne explicitly adjudicates. He says eating the dead is *better* than torturing the living. He says European wars are *worse*. He is making a moral judgment, not suspending it.

      *   *Claim 5: "In this he anticipates Rousseau's noble savage..."*
          *   *Assessment:* Debatable/Flag for Grader. It's a common connection, but saying he "formulates" it is strong. It's a plausible reading but risks anachronism.
          *   *Cost:* Low/Moderate depending on strictness.

      *   *Claim 6: "One might object that Montaigne now and then appeals to universal reason or nature... but that is just rhetorical flourish..."*
          *   *Assessment:* Wrong. Appeals to Nature/Reason are central to his skepticism, not just flourishes. This dismisses the counter-evidence to her thesis rather than engaging with it.

      *   *Prompt Requirement (i) Custom vs. Reason:*
          *   *Assessment:* Student mentions custom but gets the role of reason wrong (says it's rhetorical).
