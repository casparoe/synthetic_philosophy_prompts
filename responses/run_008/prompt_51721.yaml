          *   *Cost:* Moderate.

      *   *Prompt Requirement (Stability):*
          *   *Assessment:* Student says it's stable relativism. Most scholarship suggests instability or a move toward natural law.
          *   *Cost:* Moderate.

  4.  **Drafting the Grade and Comments:**

