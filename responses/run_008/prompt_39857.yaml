answer: |-
  ### Epistemic Mechanics of the Northern Rock Run

  The Northern Rock episode is not merely a liquidity crisis; it is a natural experiment in the epistemic foundations of coordination failures. While the Diamond-Dybvig (DD) model provides the skeletal payoff structure—a coordination game with multiple equilibria (run vs. no-run)—it assumes away the informational dynamics that actually drove the event. In standard DD, the switch between equilibria is often treated as a "sunspot," an extrinsic random variable. Northern Rock demonstrates that the "sunspot" was endogenous to the information structure: the regulatory attempt to solve a liquidity problem inadvertently solved the *coordination* problem in the wrong direction by altering the common knowledge state.

  **The Players and the Real Option Set**
  The players were not simply "depositors" and "the bank." They were heterogeneous retail depositors (stratified by deposit size relative to the insurance cap), wholesale lenders (who exited first, creating the fundamental shock), and the authorities (Bank of England [BoE], FSA, Treasury).
  *   **Depositors:** Faced a binary choice: Withdraw or Stay.
      *   *Payoff to Stay:* Interest + Principal, contingent on bank solvency and liquidity.
      *   *Payoff to Withdraw:* Principal (minus transaction/time costs), guaranteed if early, contingent on remaining liquidity if late.
      *   *Constraint:* The deposit insurance scheme (£2k at 100%, 90% of next £33k) meant that for any depositor with >£35k, withdrawal was a dominant strategy *if* the probability of bank failure exceeded a low threshold. Crucially, even for a *solvent* bank, illiquidity implies a delay in payout. For rational agents with liquidity needs or risk aversion, a solvent-but-illiquid bank is functionally distinct from a solvent-and-liquid one.
  *   **The Bank/Authorities:** Had the option to borrow from the BoE discount window. The payoff was survival vs. stigma.

  **The Epistemic Shift: The September 14 Announcement**
  Classical DD assumes common knowledge of the payoffs and the bank's type (liquid/illiquid). Before September 14, the wholesale freeze was mutual belief among financial insiders but not common knowledge among retail depositors. Depositors held noisy private signals (news of subprime troubles) but lacked a public signal to coordinate upon.

  The BoE's announcement of emergency liquidity support was intended to signal solvency ("We are lending because they are safe"). However, in epistemic terms, it transformed the bank's liquidity status from *private rumor* to *common knowledge*.
  1.  **Signal Content:** The announcement revealed that the bank could not fund itself in the market. While authorities claimed solvency, the *action* (emergency lending) revealed illiquidity.
  2.  **Coordination Focal Point:** In a multiple-equilibrium game, players need a focal point to select an equilibrium. The announcement served as a focal point for the "Run" equilibrium. It told every depositor: "The bank needs help." Crucially, it told every depositor that *every other depositor* now knew the bank needed help.
  3.  **Rationality:** Assuming common knowledge of rationality, if I know you know the bank is illiquid, I know you have an incentive to withdraw (to beat the queue or avoid insurance haircuts). Therefore, I must withdraw. The announcement did not change the fundamentals of solvency immediately, but it changed the *higher-order beliefs* about other depositors' actions.

  **Queues, Television, and Common Knowledge**
  The physical queues and their 24-hour television coverage performed the heavy epistemic lifting. This addresses the limitation of "mutual belief" vs. "common knowledge."
  *   **Rubinstein's Email Game:** Rubinstein (1989) showed that if common knowledge is approximated by a long chain of confirmations (e.g., emails that might not arrive), cooperation collapses; "almost" common knowledge is not enough. Depositors might have privately worried (private signals), but without knowing others worried, staying was safe.
  *   **The TV Broadcast:** The televised queues acted as a public signal with near-perfect transmission. It created common knowledge of the *run itself*, not just the bank's trouble. It established $E^k(\text{Run})$ for a sufficiently high $k$. A depositor seeing the queue on TV knows others see it, knows others know others see it, etc. This shattered the "no-run" equilibrium by making the "run" strategy visibly dominant. The queue was proof that the coordination on withdrawal was already underway; joining the queue became the only rational response to avoid being last in line (a payoff dominance argument).

  **Global Games vs. Pure Common Knowledge**
  The pure common-knowledge story (DD) suggests the run was a self-fulfilling prophecy selected by a sunspot. However, the Global Games literature (Morris & Shin) offers a sharper fit. Global Games introduce noisy private signals about fundamentals to select a *unique* equilibrium.
  *   **Northern Rock Application:** Depositors received private signals (news reports) and a precise public signal (BoE announcement). Morris & Shin (2002) demonstrate that precise public signals can outweigh private signals and destabilize a system. The BoE announcement was a high-precision public signal of liquidity distress. Even if private signals suggested solvency, the public signal coordinated expectations on the threshold where withdrawal becomes optimal.
  *   **Verdict:** The Global Games treatment describes the episode better than pure CK. Pure CK allows for a calm equilibrium that simply wasn't taken. Global Games explains *why* the calm equilibrium vanished: the public signal pushed the aggregate belief past the critical threshold for a unique run equilibrium.

  **The September 17 Guarantee: Payoffs vs. Epistemics**
  The Chancellor's guarantee of all deposits ended the run almost instantly. We must disentangle two effects:
  1.  **Payoff Change:** The guarantee altered the payoff matrix. Withdrawal was no longer dominant for capped depositors. Staying became weakly dominant (keep interest, no risk).
  2.  **Epistemic Change:** The guarantee signaled a commitment of state capital. It made solvency support common knowledge.

  *Evidence for Discrimination:*
  *   **Speed of Stop:** The run stopped "almost immediately." If the change were purely epistemic (updating beliefs about solvency), one might expect a tapering as confidence slowly returned. The immediacy suggests a payoff dominance shift: the incentive to queue vanished instantly.
  *   **The 88-92% Who Stayed:** The majority never withdrew. This suggests that for most, the private signal of solvency was sufficient *if* the coordination risk was removed. They were waiting for a focal point to stay.
  *   **Rationality under Cap:** For large depositors, withdrawal was rational even for a solvent bank under the old insurance regime (due to liquidity delay risk). The guarantee removed this fundamental rationality.
  *   **Conclusion:** The guarantee worked primarily by changing the **payoffs**, rendering the coordination problem moot. However, it also reinforced the epistemic state by making the government's backing a public, common fact.

  **Meta-Analysis: What the Episode Shows About Theory**
  Northern Rock is neither a simple confirmation nor a total refutation of epistemic game theory; it is a case of **unintended epistemic intervention**.
  1.  **Confirmation:** It confirms that common knowledge of vulnerability (via the BoE announcement and TV queues) triggers coordination on the bad equilibrium. It validates the Global Games insight that public signals can be destabilizing.
  2.  **Anomaly/Strain:** Standard theory assumes authorities act to restore the "good" equilibrium. Here, the authority's move (liquidity support) triggered the bad equilibrium because they failed to model the epistemic content of their action. They treated liquidity as a fundamental variable, not an informational signal.
  3.  **Limitations:** No model in this family fully explains the *velocity* of the social contagion via TV. Epistemic models treat agents as logical processors of information; they do not fully capture the behavioral feedback loop where seeing a queue induces panic beyond rational calculation of insurance caps. Furthermore, the theory is silent on why the BoE failed to anticipate the signal value of their rescue; this is a limitation of *modeling the regulator*, not the depositors.
  4.  **Verdict:** The episode confirms the mechanism of common knowledge coordination but highlights a critical blind spot: regulatory actions are themselves moves in the epistemic game, not just adjustments to fundamental payoffs.

  ### Structured Summary

  | Stage and date | Event | Information state | Game-theoretic mechanism | Explains | Leaves unexplained |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Pre-Crisis (Summer 2007)** | Wholesale markets freeze; Northern Rock cannot roll over funding. | **Private/Mutual Belief:** Financial insiders know of liquidity stress; retail depositors have noisy private signals (news) but no coordination focal point. | **Noisy Private Signals (Global Games):** Private signals are insufficient to cross the threshold for a unique run equilibrium. | Why no retail run occurred despite wholesale funding collapse. | Why insiders did not signal distress earlier (reputation costs). |
  | **Trigger (14 Sept 2007)** | BoE announces emergency liquidity support. | **Common Knowledge of Distress:** Liquidity problem becomes public fact. Common knowledge that all depositors now know the bank is vulnerable. | **Public Signal Coordination (Morris-Shin):** Precise public signal overrides private signals of solvency, selecting the run equilibrium. | Why the rescue announcement triggered the run rather than calming it. | Why authorities failed to anticipate the epistemic impact of the announcement. |
  | **Escalation (14-17 Sept 2007)** | Queues form; TV broadcasts images continuously. | **Common Knowledge of Action:** It is common knowledge that others are withdrawing ($E^k(\text{Run})$). | **Rubinstein's Email Game (Inverse):** TV acts as perfect public broadcast, overcoming "almost common knowledge" barriers to coordination. | The velocity and scale of the run; why rational depositors joined queues. | The psychological contagion element beyond rational payoff calculation. |
  | **Resolution (17 Sept 2007)** | Chancellor guarantees all deposits. | **Common Knowledge of Safety:** Payoffs change; state backing is public and credible. | **Dominant Strategy Shift:** Withdrawal ceases to be dominant; Stay becomes weakly dominant. | The immediate cessation of the run. | Why 8-12% had already withdrawn despite underlying solvency (hysteresis). |
  | **Episode Verdict** | **Overall Assessment** | **Epistemic Intervention** | **Refinement of Common-Knowledge Framework** | **Confirms that regulatory actions function as epistemic signals that can select equilibria.** | **Standard models do not endogenize the regulator's failure to understand their own signaling power.** |
