answer: |-
  This is a strong, distinctive thesis, but it sits in a dangerous intersection of meta-ethics, political philosophy, and social science. Your asymmetry claim (coordination vs. redistribution/reliance) is your shield, but it's also your biggest target.

  Here is your Q&A battle plan, ordered by likelihood and seating arrangement.

  ### Strategic Concessions (Say these early or weave them in)
  Before you take questions, or in your opening remarks, concede two things to disarm the room:
  1.  **Epistemic Access:** Concede that a visitor cannot be bound by a convention they *could not reasonably have known*. You are arguing for an obligation conditional on access, not strict liability. This pre-empts the "I didn't know tipping was mandatory" defense.
  2.  **The "Bad Convention" Clause:** Concede that if the convention itself is unjust (e.g., a segregation norm), it generates no moral obligation, regardless of reliance. This keeps the Kantians from thinking you are defending *any* status quo.

  ---

  ### 1. The Lewisian Objection (The Majority)
  **The Vibe:** Polite but pedantic. They care about equilibrium, common knowledge, and arbitrariness.
  **The Question:** "You're leaning heavily on the distinction between coordination and redistribution, but on the Lewisian account, *all* conventions are arbitrary solutions to coordination problems. Even tipping coordinates expectations between diner and server. If the arbitrariness is what usually blocks moral force, why does the *content* of the equilibrium (wages vs. sidewalk position) change the normative status? Aren't you just smuggling in consequences where the convention should be doing the work?"

  *   **Damage if fumbled:** High. If you can't distinguish your view from standard conventionalism, you lose the "moral obligation" claim.
  *   **The 2-Minute Reply:**
      "That's the crux of it. I agree with Lewis that the *origin* is arbitrary. But I'm arguing the *normative force* isn't derived from the equilibrium itself, but from the **reliance interests** that crystallize *after* the equilibrium is established.
      With the sidewalk, the reliance is transient; if I walk on the left, you dodge me, and we move on. The equilibrium resets instantly. With tipping, the reliance is structural. Employers have set base wages at $2.13 *because* of the convention. Waiters have accepted jobs *because* of the convention.
      So, I'm not saying the convention itself creates the duty. I'm saying violating the convention triggers a **harm of disappointed reliance** that is qualitatively different in the redistributive case. The Lewisian account explains how the rule gets there; my account explains why breaking it later is a moral wrong, not just a rationality failure."
  *   **Where it's soft:** You are bordering on rule-utilitarianism here. If they press on "why is disappointed reliance moral rather than just unfortunate?", you need to be ready to pivot to Fairness (see Killer Question).

  ### 2. The Kantian Objection (The Couple in the Back)
  **The Vibe:** Stern, focused on autonomy and the source of normativity.
  **The Question:** "You're claiming these are *moral* obligations. But on my reading, you've only generated hypothetical imperatives. 'If you want to participate in the US dining system, then you ought to tip.' Where is the Categorical Imperative? If I choose not to eat in that restaurant, or choose to visit a country where I don't know the norms, your obligation vanishes. That sounds like prudence, not duty."

  *   **Damage if fumbled:** Medium-High. They will categorize your view as non-moral.
  *   **The 2-Minute Reply:**
      "I appreciate the distinction, but I'd locate the categorical force not in the *act* of tipping, but in the **duty of fair play**. Once I voluntarily enter the scheme and accept the benefits of the labor provided under the presumption of compliance, I incur an obligation to uphold my end.
      It's not 'if you want to fit in.' It's 'if you accept the benefit of a system sustained by others' sacrifice, you must not free-ride.' That duty of reciprocity is categorical in the context of interaction. The convention merely identifies *what* counts as fair play in that context. So the imperative is: 'Do not exploit reliance.' The convention just tells you what exploitation looks like here."
  *   **Where it's soft:** This shifts your ground from "conventions create obligations" to "fairness creates obligations, conventions track them." Some Lewisians might pounce on this shift.

  ### 3. The Empiricist (The Norms Researcher)
  **The Vibe:** Impatient with armchair speculation. Wants operationalization.
  **The Question:** "You're making a strong empirical claim: that waiters structure their life plans around tips more than pedestrians structure plans around sidewalk norms. Do you have evidence for that asymmetry? Pedestrians plan routes and timing based on flow expectations. If your theory rests on the *degree* of reliance, you need to show the reliance is actually asymmetric, not just assert it."

  *   **Damage if fumbled:** Medium. Makes you look naive about social science.
  *   **The 2-Minute Reply:**
      "That's a fair challenge for the full paper, and I welcome the data. But philosophically, I'm distinguishing between **coordination reliance** and **economic reliance**.
      Pedestrian flow is fluid; if I block you, you go around, and your long-term plans remain intact. Wage structures are rigid; they are legal and contractual commitments made *ex ante*. My claim isn't that pedestrians feel less annoyed, but that the *institutional scaffolding* in the tipping case is harder to reverse. I'm happy to refine the empirical strength of that claim, but the *type* of reliance—contractual wage setting vs. momentary pathing—is the relevant moral distinction."
  *   **Where it's soft:** They might have a study showing that wage reliance is actually low (e.g., waiters hate tipping and want flat wages). If that's true, your "life-structuring" argument collapses. **Prep:** Check recent literature on server wage preferences.

  ---

  ### 4. The Killer Question (The One You Hope Nobody Asks)
  **The Vibe:** This won't come from a specific "camp." It will come from the smartest generalist in the room, likely during the second round of questions. They will smell that your theory lacks a unique meta-ethical foundation.
  **The Question:** "You keep using the phrase 'life-structuring reliance' to ground the obligation. But isn't that just a proxy for **expectation utility**? You're essentially saying: 'The obligation exists because violating it causes more harm/disappointment than violating a sidewalk norm.'
  If that's true, you haven't found a new source of moral obligation in conventions. You've just built a rule-utilitarian calculus where 'conventions' are heuristics for 'where utility loss is highest.' If the waiter actually *preferred* no tipping, your obligation would vanish. So, isn't this just utilitarianism in convention costume?"

  *   **Damage if fumbled:** **Critical.** This undermines the novelty of your thesis. If you are just a utilitarian, the Lewisians will say you don't need conventions, and the Kantians will say you have no deontological ground.
  *   **The 2-Minute Reply (The "Fairness" Pivot):**
      "That is the sharpest objection, and I need to be precise. If my argument were solely about the *amount* of harm, I would be a utilitarian. But my argument is about the **relational wrong of free-riding**.
      Consider the sidewalk: If I walk on the wrong side, I cause inconvenience, but I am not *taking advantage* of a system others sustain for me. In the tipping case, I am accepting a service priced artificially low *on the condition* that I make up the difference.
      The obligation doesn't track the *utility* the waiter gains; it tracks the **fairness of my participation**. Even if the waiter would prefer a flat wage, if *this* is the system currently sustaining their employment, and I enter it, I owe it to *them* (not to the universe's utility) to not exploit the gap between the sticker price and the living wage. It's a duty of reciprocity, not maximization."
  *   **Where it's soft:** You are now walking a tightrope between Fair Play Theory (Hart/Rawls) and Utilitarianism. If they press, "But why is free-riding wrong if it doesn't maximize utility?", you must stand firm on **Reciprocity** as a brute moral fact, not reducible to good outcomes.
      *   *Prep:* Re-read Hart's "Are There Any Natural Rights?" and Rawls' "Legal Obligation and the Duty of Fair Play." You need to sound like you belong in that tradition, not the utilitarian one.

  ### Summary Advice for the Room
  *   **Lewisians:** Speak their language ("equilibrium," "arbitrariness"), but insist that *post-equilibrium reliance* changes the normative landscape.
  *   **Kantians:** Use the word "Reciprocity" and "Exploitation." Avoid "Consequences."
  *   **Empiricist:** Don't bluff. Offer to collaborate or refine the empirical claim.
  *   **The Killer:** Do not deny the utilitarian overlap. Admit the *outcome* looks similar, but insist the *grounding* (relational fairness vs. aggregate good) is distinct.

  **Final tip:** When the Killer Question comes, pause. Take a sip of water. Say, "That's the question I was most worried about, and here is why I think the distinction holds..." Honesty about the difficulty disarms the aggression. Good luck.
