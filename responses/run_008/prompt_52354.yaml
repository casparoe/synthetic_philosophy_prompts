answer: |-
  This is a sharp puzzle. You've correctly identified that the standard "free speech vs. censorship" frame misses the specific philosophical machinery these laws rely on. If you treat memory laws as simply "the state enforcing historical accuracy," they collapse under the weight of the scholarship exception (if truth is settled, why let scholars tweak it?) and the fraud comparison (if it's about lying, why isn't intent to deceive required?).

  To make the criminalization approach coherent, you have to stop viewing it as **epistemic policing** (protecting the truth) and start viewing it as **status policing** (protecting the community).

  Here is a reconstruction of the view of speech, truth, and harm required to make these laws hold together, followed by the breakdown of what is essential and where the theory is underdetermined.

  ### 1. Reconstructing the Coherent View

  For the law to be coherent given the exceptions you noted, it must presuppose the following three commitments:

  **A. Truth as "Civic Foundation" rather than "Empirical Fact"**
  The law does not treat the Holocaust as a scientific theory (open to falsification) nor as a simple property line (static). It treats it as a **constitutive fact** of the polity.
  *   *The Presupposition:* There is a distinction between *historical details* (which scholars may debate) and *historical legitimacy* (which is the bedrock of the state's moral authority).
  *   *Why this solves the scholarship puzzle:* A scholar questioning the gas chamber capacity is engaging with the *details* of the event within the accepted *framework* of its occurrence. A denier is rejecting the *framework* itself. The law protects the framework, not the granular data. The state isn't claiming omniscience about history; it's claiming sovereignty over the *terms of civic membership*.

  **B. Speech as "Performative Act" rather than "Proposition"**
  In the US tradition (Millian marketplace of ideas), speech is a proposition to be weighed. In the memory-law tradition, denial is treated as a **speech act** (in the Austinian sense).
  *   *The Presupposition:* Saying "the Holocaust didn't happen" in public is not an attempt to convey information; it is a performance of exclusion. It functions like a verbal assault or a threat, not an argument.
  *   *Why this solves the fraud puzzle:* Fraud requires a deceived victim because the harm is epistemic (you believed a lie). Memory laws don't require a deceived victim because the harm is relational. The audience doesn't need to be tricked for the act to be damaging, just as a racial slur damages dignity even if everyone knows it's false. The harm is the *assertion of dominance* over the victims' memory.

  **C. Harm as "Dignitary Destabilization" rather than "Individual Deception"**
  *   *The Presupposition:* The injury is to the **standing** of the survivors and descendants within the public sphere.
  *   *Why this solves the "diffuse harm" problem:* If the harm were just "people believing lies," the state would have to prove causation. By defining the harm as dignitary, the injury is immediate and intrinsic to the utterance. It undermines the victims' status as equal citizens whose suffering is recognized by the state. It creates a "second victimization."

  ### 2. Strict Requirements vs. Optional Commitments

  You asked which components are load-bearing. If you remove some, does the whole structure collapse?

  **Strict Requirement: The Dignity/Status Component**
  *   *Verdict:* **Essential.**
  *   *Reasoning:* If you strip away the dignitary harm and rely solely on "protecting historical truth," the law becomes indefensible against the charge of state propaganda. If the state jails you merely for being wrong about history, the scholarship exception makes no sense (why allow scholars to potentially be "wrong" or revisionist?). The law *only* works if the crime is the *insult to the community*, not the *error in the fact*. The "truth" is merely the proxy for the dignity.

  **Optional Commitment: The "Settled Truth" Component**
  *   *Verdict:* **Contingent/Reframable.**
  *   *Reasoning:* The state does not actually need to claim the history is metaphysically settled. It only needs to claim that *disputing it in this manner* is incompatible with civic peace.
  *   *How it could drop:* A jurisdiction could theoretically frame these laws not as "The Holocaust happened, period," but as "Invoking the Holocaust to incite hatred is a public order violation." However, most European laws *do* lean on the "settled truth" rhetoric. They could drop the strong epistemic claim and survive on a "public order/dignity" claim alone, but they choose not to because the epistemic claim strengthens the moral weight. It is a rhetorical bolster, not a logical necessity.

  **Optional Commitment: The "Bad Faith" Distinction**
  *   *Verdict:* **Pragmatic, not Philosophical.**
  *   *Reasoning:* The scholarship exception implies a distinction between good-faith inquiry and bad-faith denial. Philosophically, this is messy (how do you prove intent?). But legally, it's a pressure valve. The system *could* theoretically ban all questioning, but it drops this commitment to avoid stifling legitimate history. It is a pragmatic concession, not a core philosophical tenet.

  ### 3. Where the Theory is Underdetermined

  This is the crucial part for your article. There is no single philosophical engine driving this. There are at least three distinct theories that all license the same laws, and they contradict each other in their foundations. This confirms your suspicion: **there is no "One Deep Principle."**

  **Theory A: Militant Democracy (The Political Prerequisite)**
  *   *Logic:* Democracy requires certain truths to function. The Holocaust represents the destruction of the rule of law. To deny it is to attack the prerequisite of the current democratic order.
  *   *Focus:* Preservation of the State.
  *   *Conflict:* This is authoritarian-adjacent. It says "Some ideas are too dangerous to exist."

  **Theory B: Expressive Justice (The Moral Statement)**
  *   *Logic:* The law is not about consequences (deterrence); it is about expression. By punishing denial, the state expresses solidarity with the victims. It is a ritual of collective mourning.
  *   *Focus:* Moral Solidarity.
  *   *Conflict:* This makes the law symbolic. If the goal is expression, does it matter if it works? (Usually, proponents say yes, it matters).

  **Theory C: Non-Domination (The Republican Liberty)**
  *   *Logic:* Drawing on Philip Pettit's republicanism. Freedom is not just non-interference, but non-domination. Denial creates a social hierarchy where the denier claims the power to define the victim's reality. This is a form of domination. The law prevents the domination.
  *   *Focus:* Equality of Status.
  *   *Conflict:* This is the most liberal-friendly justification, but it requires accepting that speech can be an act of domination.

  **The Underdetermination:**
  You can support these laws because you are a **statist** (protecting the regime), a **communitarian** (protecting the group's dignity), or a **liberal egalitarian** (preventing domination). These are mutually incompatible worldviews, yet they all converge on "jail the denier." This means the law is an **Overlapping Consensus** (to borrow Rawls' term). It is stable not because everyone agrees on *why* it's right, but because everyone agrees *that* it's right for different reasons.

  ### 4. Advice for the "One Deep Principle" Ending

  Your editor wants a punchy ending. Your instinct is correct: there isn't a single principle. If you force one, you will misrepresent the philosophy. However, you can give the editor a "punchy insight" that captures the *structure* of the agreement without lying about the *foundation*.

  **Don't write:** "The principle is that truth is more important than speech." (False, because of the scholarship exception).
  **Don't write:** "The principle is that dignity trumps liberty." (Too vague, ignores the US counter-example).

  **Do write something like this:**
  > "We often ask whether memory laws protect the past or the future. The philosophical reality is more unsettling: they protect the *present*. They are not epistemological claims about what happened, but constitutional claims about who we are. The deep principle isn't that the state knows the truth. It's that a community cannot survive if its members are free to erase each other's existence. The law treats history not as a subject to be studied, but as a boundary to be inhabited. We do not jail deniers because they are wrong about the dead; we jail them because they are hostile to the living."

  **Why this works:**
  1.  It acknowledges the "settled truth" puzzle (it's not about epistemology).
  2.  It captures the "harm" element (hostility to the living/dignity).
  3.  It accommodates the underdetermination (statists, communitarians, and egalitarians can all agree that "erasing existence" is the threat, even if they disagree on why that matters).
  4.  It gives the editor the "punchy" line ("boundary to be inhabited") without simplifying the philosophy into a falsehood.

  **Summary for your piece:**
  The coherence of memory laws relies on shifting the category of the crime from **Falsehood** (epistemic) to **Violence** (relational). The "scholarship exception" proves the state isn't policing facts; it's policing *social relations*. The underdetermination means the laws are robust precisely because they rest on multiple, conflicting philosophical pillars that all happen to point in the same direction. Your ending should reflect that convergence, not a fictional unity.
