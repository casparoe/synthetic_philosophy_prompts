  3.  **Drafting the Reconstruction (The "Coherent View"):**
      *   To make sense of this, the legal system isn't treating history like *science* (falsifiable, open) nor like *property* (static). It's treating it like *constitutional fact* or *civic infrastructure*.
      *   *Truth:* Not "ontological truth" (what actually happened in metaphysical detail) but "normative truth" (what constitutes the basis of our civic agreement). It's a "foundational fact."
      *   *Speech:* Not a marketplace of ideas (where bad speech is countered by good speech) but a performative act of exclusion. Denial isn't an argument; it's a signal of hostility to the community's basis.
      *   *Harm:* Not epistemic (believing a lie) but existential/relational. It undermines the standing of victims/survivors within the polity. It's a "dignitary harm" to the group.

  4.  **Analyzing Requirements (Strict vs. Optional):**
