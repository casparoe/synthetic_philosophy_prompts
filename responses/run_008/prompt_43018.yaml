prompt: |-
  I'm a novelist four books in, and my next project is a trilogy set in a border region where the losing side got basically erased from the record — the standard narative everywhere is the victors', down to place names and which battle counts as "the" battle. Everyone keeps telling me "history is written by the victors" like it settles something, but every time I try to actually use the idea it slips away from me: sometimes it's a claim about archives (who kept records and who burned them), sometimes about which accounts got printed and translated, sometimes about narrative form itself (what we find a satisfying ending mirrors what counts as winning), and sometimes it's just full-blown relativism (no fact of the matter, only perspectives, and my "recovered" loser is as much my invention as anything). I've got about two years of research stamina and one shot at this trilogy, so I can't chase all of it — I need to triage the philosophical work instead of drowning in it.

  So: what are the actual open questions in this territory that would change how I write, which one or two should I work through first, and which are overrated for someone in my position? For instance — does it matter for me whether the losers' perspective is even recoverable, or is reconstructing it just fiction wearing footnotes? Where does the relativist version of the thesis bite and where is it a fancy excuse for laziness? Is the "perspective" talk more like a point about evidence or more like a point about emplotment, and does the difference matter for a novelist as opposed to a historian? I care about the reasoning behind your ordering, not a survey, and please no reading list — I can't verify citations from where I'm writing and don't want one anyway.

  Structure your answer in four sections, in this order: (1) "The questions that change the book" — the two or three issues that would genuinely alter drafting decisions, with why each is upstream of the others, roughly 250-350 words; (2) "Real but not urgent" — genuine open problems in the field that nonetheless wouldn't move a single sentence I write, ~150 words; (3) "Seductive dead ends" — framings that sound profound but that I should actively resist while drafting, ~150 words; (4) "What would change my ranking" — what would make me reshuffle the order, ~100 words.
