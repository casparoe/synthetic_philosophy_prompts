      *   *Section 1:* Need to ensure I hit the 250-350 range. I need to elaborate on *why* these are upstream.
          *   Point 1: Is the recovery *truth* or *myth*? If truth, you need evidence trails in the plot. If myth, you need emotional resonance despite gaps. This dictates how characters argue about the past.
          *   Point 2: Form as victory. If coherent narratives are a victor's tool, should the loser's story be fragmented? This dictates chapter structure and pacing.
          *   *Drafting:* Start with the recoverability question. Then move to narrative form. Explain the drafting consequence for each.
      *   *Section 2:* Keep it tight. Focus on metaphysical realism vs. constructivism. It matters to philosophers, not to the reader's immersion.
      *   *Section 3:* Focus on "lazy relativism" and "archive fetishism."
      *   *Section 4:* Keep it punchy. Genre shift or thematic shift.

