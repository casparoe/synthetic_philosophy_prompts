          First, decide whether your recovered history is ontologically stable or inherently fictional. If you treat the losers' past as objectively recoverable, your plot must hinge on finding evidence—maps, diaries, physical traces. This makes the trilogy a mystery where truth exists waiting to be found. If you treat it as inherently constructed, the plot hinges on persuasion and belief; the "truth" is whatever sticks. This changes dialogue from debate over facts to competition over narrative resonance.
          Second, interrogate whether coherent storytelling is itself a victor's tool. Victors get clean arcs; the erased often leave fragments. If you give the losers a satisfying three-act structure, you may be assimilating them into the very logic that erased them. This is upstream of structure: do you write smooth prose that hides the erasure, or fragmented prose that performs it? Choosing smoothness prioritizes reader comfort; choosing fragmentation prioritizes thematic fidelity. These two questions determine whether your book is a recovery mission or a memorial, and whether your form fights your content. Resolve these before drafting chapter one, because you cannot revise a structural philosophy without rewriting the whole manuscript.
