answer: |-
  (1) "The questions that change the book"
  First, decide whether your recovered history is ontologically stable or inherently fictional. If you treat the losers' past as objectively recoverable, your plot must hinge on finding evidence—maps, diaries, physical traces. This makes the trilogy a mystery where truth exists waiting to be found. Characters seek proof. If you treat it as inherently constructed, the plot hinges on persuasion and belief; the "truth" is whatever sticks. Characters seek influence. This changes dialogue from debate over facts to competition over narrative resonance. It determines whether your climax is a revelation of data or a shift in public sentiment. You must choose whether a "fact" exists independent of the record, because your protagonists will either hunt for objects or hunt for allies.

  Second, interrogate whether coherent storytelling is itself a victor's tool. Victors get clean arcs; the erased often leave fragments. If you give the losers a satisfying three-act structure, you may be assimilating them into the very logic that erased them. This is upstream of structure: do you write smooth prose that hides the erasure, or fragmented prose that performs it? Choosing smoothness prioritizes reader comfort; choosing fragmentation prioritizes thematic fidelity. If you choose fragmentation, you risk alienating readers; if you choose smoothness, you risk hypocrisy. These two questions determine whether your book is a recovery mission or a memorial, and whether your form fights your content. Resolve these before drafting chapter one, because you cannot revise a structural philosophy without rewriting the whole manuscript. The first dictates character motivation; the second dictates sentence-level rhythm and plot resolution. Ignoring them means writing a draft that contradicts its own thesis. You cannot halfway believe in the archive; either the key exists, or it doesn't. It also dictates the ending: does justice require closure, or is openness the only honest conclusion?

  (2) "Real but not urgent"
  The metaphysical debate over whether historical facts exist independent of human observation is genuine but irrelevant to your drafting. Whether there is a "real" battle that happened regardless of records matters less than whether your characters believe there is. Your readers will not pause to question ontological realism if the emotional stakes hold. Similarly, the ethics of who has the right to tell the story—appropriation versus representation—is crucial for publicity but rarely alters the internal mechanics of a scene. These are external constraints or marketing concerns, not structural load-bearing walls. Worrying about the absolute truth of the past distracts from the relative truth of the characters experiencing it. Focus on the phenomenology of history—how it feels to live inside erasure—rather than the metaphysics of history itself. You can write a convincing lie or a convincing truth using the same prose techniques. Historians need to settle the fact; novelists need to settle the experience. The gap between event and record is where you live, not the status of the event itself.

  (3) "Seductive dead ends"
  Resist the trap of hard relativism, where "all perspectives are equal" becomes an excuse for narrative laziness. If every account is equally valid, stakes evaporate; why care who wins the argument? This leads to muddy, indecisive prose that refuses to commit to a reality. Also, avoid archive fetishism. Don't let the mechanism of erasure—burning books, changing names—become the plot itself. Readers care about the people losing their homes, not the bureaucracy of memory. Making the trilogy about the *process* of history-writing rather than the *cost* of it turns your characters into lecturers. It sounds profound to deconstruct narrative form constantly, but if every chapter reminds the reader "this is just a story," you break immersion. This approach creates a hollow intellectualism that prioritizes being clever over being felt. Don't let the theory eat the story. Use the theory as scaffolding, not decoration. If the philosophy shows in the text, it should be in the silence, not the footnote.

  (4) "What would change my ranking"
  If you shift from historical realism to speculative fiction, the recoverability question matters less; you can invent the archive entirely. If your goal changes from telling a story to critiquing the genre itself, the "seductive dead ends" become the main point. Also, if you discover primary sources that contradict your premise during research, you must pivot from philosophical triage to factual accommodation. But for now, assume the erasure is total. This ranking assumes the losers' view is the primary lens. If you balance the scales with victor POVs, the tension between form and content diminishes, and standard pacing rules apply. Context shifts change priorities. Keep your genre constraints clear.
