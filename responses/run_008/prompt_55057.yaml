answer: |-
  Here is the procedure, grounded in the normative-counterfactual account of omission causation, stripped of metaphysics and built for a 90-minute clinical governance meeting.

  ### The "Omission Filter" Procedure
  **Time Allocation:** 45 minutes for analysis, 30 minutes for consensus, 15 minutes for documentation.
  **Facilitator:** Chair (You).
  **Goal:** Distinguish between *causal background* (things that didn't happen but weren't expected to) and *causal failure* (things that didn't happen and should have).

  #### Step 1: The Counterfactual Test (The "But-For" Check)
  **Question:** If the omitted action *had* occurred, would the harm have been avoided or significantly mitigated?
  *   **Yes:** Proceed to Step 2.
  *   **No:** Stop. This omission is **not a cause**. It is irrelevant. (e.g., If the specialist had been called, but the patient was already past saving, the failure to call is not a cause of death).
  *   **Philosophical Ground:** Causal dependence. If the outcome doesn't change, the omission isn't a cause.

  #### Step 2: The Access Test (The "Could They?" Check)
  **Question:** Did the person/system have the *physical and structural ability* to perform the action at that specific time?
  *   **Criteria:** Were they on site? Did they have access to the records/equipment? Were they physically capable?
  *   **Yes:** Proceed to Step 3.
  *   **No:** Stop. This omission is a **Background Condition**. (e.g., An off-duty doctor, a passerby, a specialist in a different building without telehealth access).
  *   **Philosophical Ground:** This solves the "infinitely many omissions" problem. The Pope didn't save the patient, but we exclude him because he lacked access. We exclude the off-duty doctor for the same reason.

  #### Step 3: The Expectation Test (The "Should They?" Check)
  **Question:** Was there a pre-existing duty, protocol, or reasonable expectation that *this* agent would perform *this* action?
  *   **Evidence:** Job description, roster, clinical guideline, standard operating procedure.
  *   **Yes:** This is a **Causal Failure (Root Cause)**.
  *   **No:** This is a **Contributing Factor**. (e.g., A nurse noticed a problem outside their assigned bay but wasn't rostered for that patient).
  *   **Philosophical Ground:** Causal selection is normative. We pick the omission that violates a norm. Without a norm, an omission is just a state of the world, not a cause of harm.

  #### Step 4: The Systemic Baseline (For Non-Human Omissions)
  **Question:** If no individual is identified in Step 3, was there a system designed to automate this action?
  *   **Yes (System failed):** **Systemic Cause**. (e.g., IT glitch, broken alarm).
  *   **No (System didn't exist):** **Latent Condition**. (e.g., No protocol existed for this rare event).
  *   **Decision:** If "Systemic Cause," the committee stops assigning individual blame and moves to vendor/IT review. If "Latent Condition," the committee moves to policy creation, not incident attribution.

  ---

  ### What I Simplified (And Why)
  To make this fit a 90-minute meeting, I dropped three philosophical nuances. You need to know what they are so you don't get tripped up by a clever clinician.

  1.  **The Metaphysics of "Negative Events":** Philosophers argue over whether "not doing X" is an event at all. I dropped this. For the committee, treat the omission as a *fact* ("The drug was not administered"). We aren't debating reality; we are debating responsibility.
  2.  **Contrastive Causation:** Strictly speaking, causation is "X rather than Y caused Z rather than W." (e.g., "Delaying the call *by 10 mins* caused *cardiac arrest* rather than *ICU transfer*"). I simplified this to binary (Cause/Not Cause). If you get stuck on degrees of harm, move it to "Contributing Factor" and move on.
  3.  **Foreseeability Nuance:** I collapsed "foreseeability" into "Expectation/Protocol." Philosophically, you can have a duty to foresee risks even without a protocol. Practically, if there's no protocol, clinicians will fight the "duty" claim. Rely on written expectations to keep the peace.

  ---

  ### Running the Cases

  #### Case 1: The Distracted Nurse (Handover Failure)
  *   **Step 1 (Counterfactual):** If the nurse had registered the rising heart rate, would the arrest have been prevented? **Yes.** (Early intervention likely succeeds).
  *   **Step 2 (Access):** Was the nurse on duty and present? **Yes.**
  *   **Step 3 (Expectation):** Is monitoring and handover documentation part of the nursing protocol? **Yes.**
  *   **Step 4 (Systemic):** N/A (Individual identified).
  *   **Verdict:** **Causal Failure.**
  *   **Committee Output:** The omission to document/escalate is a cause. This aligns with intuition and duty.

  #### Case 2: The Off-Duty Doctor (The "Nearby" Specialist)
  *   **Step 1 (Counterfactual):** If the doctor had come in, would the patient have survived? **Plausibly Yes.** (Passes the "but-for" test).
  *   **Step 2 (Access):** Did they have structural access? **No.** They were off-roster, likely without badge access, and not logged into the system. Their presence would have required a *new* action (coming in), not just the omission of an existing duty.
  *   **Step 3 (Expectation):** Was there a duty? **No.** Off-duty staff have no clinical obligation to intervene unless a specific "duty to rescue" law applies (rare in this context) or they voluntarily assume care.
  *   **Verdict:** **Background Condition.**
  *   **Committee Output:** The off-duty doctor is **not a cause**.
  *   **Why you won't like it:** It feels like a "missed opportunity." But philosophically, their absence is no different than the absence of a doctor from a neighboring hospital. To call this a cause expands liability to everyone physically capable of helping, which is unsustainable. The procedure forces you to accept this.

  #### Case 3: The IT Glitch (The Phantom Order)
  *   **Step 1 (Counterfactual):** If the request had been generated, would the harm be avoided? **Yes.**
  *   **Step 2 (Access):** Could an individual have fixed it? **No.** The charting happened, but the backend failed. No individual had access to the code pipeline.
  *   **Step 3 (Expectation):** Did an individual breach a duty? **No.** They followed the charting protocol.
  *   **Step 4 (Systemic):** Was there a system designed to do this? **Yes.** Did it fail? **Yes.**
  *   **Verdict:** **Systemic Cause.**
  *   **Committee Output:** No individual omission caused this. The *system's* failure to process data is the cause.
  *   **Why you won't like it:** You cannot discipline a server. You cannot mandate "try harder" for software. The committee must pivot to vendor management, which feels like "no result" for an incident meeting.

  ---

  ### Where This Procedure Will Misfire
  No procedure is perfect. Here are the three scenarios where this logic will break, and you will need to override it using your Chair's discretion.

  **1. The "Impossible Duty" (Systemic Negligence)**
  *   **Scenario:** A nurse is assigned 10 patients (protocol says 4). They miss a deterioration.
  *   **The Glitch:** Step 3 says "Yes, there was a duty." Step 2 says "Yes, they had access." The procedure labels this a **Causal Failure** by the nurse.
  *   **The Reality:** The *cause* is the staffing decision by management, not the nurse's omission. The procedure cannot see upstream management failures.
  *   **Fix:** If evidence shows capacity was structurally removed, upgrade "Causal Failure" to "Latent Condition" and refer to Hospital Administration.

  **2. The "Emerging Risk" (No Protocol)**
  *   **Scenario:** A novel complication arises. No guideline exists. A clinician fails to guess the right intervention.
  *   **The Glitch:** Step 3 asks "Was there a pre-existing duty?" If no protocol exists, the answer is "No." The procedure exonerates the clinician as "Contributing Factor."
  *   **The Reality:** Clinicians have a general duty of care beyond checklists.
  *   **Fix:** In the absence of protocol, Step 3 becomes "Would a reasonable peer have identified this?" This reintroduces subjectivity, but it's necessary for novel cases.

  **3. The "Conflicting Duty"**
  *   **Scenario:** A nurse omits checking Patient A because they were resuscitating Patient B.
  *   **The Glitch:** The procedure flags the omission for Patient A as a "Causal Failure" (Duty existed, Access existed).
  *   **The Reality:** The duty was overridden by a higher-priority duty.
  *   **Fix:** Add a "Triage Exception" to Step 3. If the agent was engaged in a higher-acuity intervention, the omission is a **Background Condition** relative to the lower-acuity patient.

  ### Final Instruction to the Committee
  Print this procedure. Put it on the screen at the start of the meeting. Tell them: *"We are not asking what physically could have changed the past. We are asking what failed in the system of care we designed. If there was no duty and no access, it is not a cause we can fix. If there was a duty and no system, it is a system cause. If there was a duty and a system, it is an individual cause."*

  This keeps you out of metaphysics and keeps the hospital out of court.
