prompt: |-
  I'm a program officer at a mid-sized regional foundation. We disburse roughly forty grants a year to nonprofits, and the terms of each grant specify a small set of numbers the grantee reports quarterly — meals served, job placements at six months, students reading at grade level, shelter nights provided. Reviewing those numbers is part of my job, and over the past few years I've watched several of them go strange. A job-training grantee's placement rate kept climbing while the employers who used to call us with feedback stopped calling; a literacy program's book count tripled in the two quarters after I mentioned book counts at a gathering of our grantees, while its waiting list stayed the same length. I know the slogan version of Goodhart's law — that when a measure becomes a target it stops measuring what it used to — but the slogan doesn't tell me what to do on a Tuesday afternoon with a renewal decision due Friday. And I suspect the slogan papers over several different situations: sometimes the number is being gamed, sometimes the number never measured what we assumed, sometimes our attention itself improved the work, and sometimes the grantee has simply gotten better at counting.

  Please write a decision procedure I can actually run: the questions to ask, in order; what counts as a sufficient answer to each; where the procedure ends in a no to renewal; where it flags the metric as broken rather than the grantee as dishonest; and where it hands the decision back to me or to the board because the underlying question is whether we still care about the thing the number proxies, which is a question of values rather than facts. Two constraints to respect: I generally have one afternoon per grantee, and any change to reporting requirements must be approved by the board and announced to all grantees at once, so the procedure should say explicitly when replacing a metric is worth that cost and when quietly living with a degraded one is the better call.

  Then run the procedure on three cases: the job-training placement rate described above; a food bank whose meals-served number is flat and, as far as I can tell, honest, but whose client interviews suggest demand has shifted toward a population the metric does not capture; and a homelessness grantee whose shelter-nights figure sails past our target every quarter — where I want the procedure to be able to conclude that the grantee is fine and the real problem is that we set the target too low, a conclusion I am not eager to bring to the board, since we set the target. Finally, be explicit about where the procedure will misfire: the recurring situations it was not built to handle, and the ways a determined grantee could satisfy every step of it while still hollowing out the underlying work.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Program Officer at a mid-sized regional foundation (40 grants/year).
      *   **Problem:** Goodhart's Law in action (metrics gaming, metric drift, etc.). Needs a practical decision procedure for grant renewals, not just theory.
      *   **Specific Challenges:** Distinguishing between gaming, broken metrics, genuine improvement, and counting improvements. Needs to handle value judgments vs. factual judgments.
      *   **Constraints:**
          *   Time: ~1 afternoon per grantee.
          *   Reporting Changes: High friction (Board approval + all grantees notified). Need to decide when to change a metric vs. live with it.
          *   Output: A step-by-step decision procedure (questions, sufficient answers, stop points).
          *   Application: Run the procedure on three specific cases (Job Training, Food Bank, Homelessness).
          *   Critique: Explicitly state where the procedure fails or can be gamed.

  2.  **Deconstruct the Core Problem:**
      *   The user needs a heuristic to triage "weird numbers."
      *   The procedure needs to be efficient (1 afternoon).
      *   It needs to separate *grantee performance* from *metric validity*.
      *   It needs to identify *value misalignment* (do we still care about this outcome?).
      *   It needs to manage the political cost of changing metrics.

  3.  **Drafting the Decision Procedure (The "Metric Triage Protocol"):**
      *   *Goal:* Move from "Something looks off" to a specific action (Renew, Don't Renew, Fix Metric, Escalate).
      *   *Structure:* Sequential filters. If you pass Filter 1, go to Filter 2. If you fail, stop and act.
      *   *Step 1: Verification (Is the number real?)* Focus on data integrity.
      *   *Step 2: Contextualization (Does the number match reality on the ground?)* Focus on qualitative alignment.
      *   *Step 3: Causality (Did the metric cause the change?)* Focus on Goodhart's Law mechanisms.
      *   *Step 4: Valuation (Do we still care about what is being measured?)* Focus on mission alignment.
      *   *Step 5: Cost-Benefit (Is fixing the metric worth the hassle?)* Focus on the constraint about board approval.

      *Refining the Steps:*
      *   Make the questions specific.
      *   Define "Sufficient Answer."
      *   Define "Exit Conditions" (Renew, Reject, Flag, Escalate).

  4.  **Developing the Three Case Studies:**
      *   *Case 1: Job Training (The Gamer).* Placement rate up, employer feedback down.
          *   *Expected Outcome:* Likely gaming. Procedure should flag dishonesty or metric breakdown.
      *   *Case 2: Food Bank (The Shift).* Meals flat, demand shifted to uncaptured population.
          *   *Expected Outcome:* Metric is broken/blind. Grantee is honest. Need to change metric (but weigh cost).
      *   *Case 3: Homelessness (The Sandbagger).* Shelter nights sail past target.
          *   *Expected Outcome:* Target too low. Grantee is fine. Procedure needs to allow admitting the foundation set a bad target without blaming the grantee.

  5.  **Addressing the Constraints & Limitations:**
      *   *Time:* Keep the steps doable in 3-4 hours.
      *   *Reporting Changes:* Explicitly include a "Change Threshold."
      *   *Limitations:* Acknowledge that sophisticated gaming can pass this check. Acknowledge that human bias affects the "qualitative" checks.

  6.  **Writing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise and the difficulty of the task.
      *   **The Protocol:** Name it something professional (e.g., "The Metric Integrity & Renewal Protocol"). Use a flowchart logic.
      *   **Step 1: Data Integrity.** (Counting better vs. lying).
      *   **Step 2: Ground Truth.** (Does the number match the story?).
      *   **Step 3: Incentive Distortion.** (Goodhart's check).
      *   **Step 4: Mission Alignment.** (Values check).
      *   **Step 5: The Fix Cost.** (Board/Reporting constraint).
      *   **Running the Cases:** Apply the steps rigorously to the three scenarios.
      *   **Failure Modes:** Be honest about where this breaks (e.g., collusion, subtle quality erosion).

  7.  **Refining the Logic (Self-Correction during drafting):**
      *   *Critique:* Is Step 3 too hard to do in an afternoon?
      *   *Fix:* Make Step 3 about looking for *corroborating evidence* of distortion (like the employer calls stopping), not proving causality definitively.
      *   *Critique:* How do we handle the "Target too low" case without embarrassing the board?
      *   *Fix:* Frame it as "Environmental Shift" or "Capacity Growth" rather than "Bad Target Setting." The procedure should allow for "Renew + Adjust Target" without labeling it a failure of the foundation.
      *   *Critique:* The user asked for explicit "No Renewal" points.
      *   *Fix:* Ensure each step has a "Stop & Reject" condition.

  8.  **Final Polish:**
      *   Tone: Professional, empathetic, pragmatic.
      *   Formatting: Clear headings, bullet points, bold text for decisions.
      *   Check against constraints: Did I mention the board approval cost? Yes. Did I mention the 1-afternoon limit? Yes.

  9.  **Final Review against the Prompt:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   End points (No/Flag/Handoff)? Yes.
      *   Constraint (Board cost)? Yes.
      *   Run on 3 cases? Yes.
      *   Explicit misfire section? Yes.

      *(Self-Correction on Case 3)*: The prompt says "a conclusion I am not eager to bring to the board, since we set the target." The procedure needs to give the PO cover to recommend renewal *and* target adjustment without explicitly saying "We messed up." I need to phrase the output of the procedure to allow for "Target Recalibration" as a standard maintenance task, not an admission of guilt.

      *(Self-Correction on Case 1)*: The prompt implies the grantee might be gaming. The procedure needs to distinguish between "Gaming" (Renewal No) and "Metric Broken" (Renewal Yes, Fix Metric). In the job case, if employers stopped calling, that suggests the *quality* of placements dropped, even if the *count* is real. This is a "Quality vs. Quantity" trap. The procedure needs to catch this.

      *(Self-Correction on Case 2)*: Food bank. Metric is flat, but demand shifted. The metric is blind. The grantee is honest. The procedure should lead to "Renew + Propose Metric Change."

      *(Refining the "Misfire" section)*: Need to mention "Collusion" (clients coached to lie), "Creaming" (serving easiest clients), and "PO Bias" (PO likes the ED so ignores red flags).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ## The Metric Integrity & Renewal Protocol (MIRP)

  **Purpose:** To distinguish between grantee performance, metric validity, and mission alignment within a single afternoon of review.
  **Constraint:** Reporting changes require Board approval and system-wide rollout. This protocol prioritizes renewal decisions over metric redesign unless the metric is actively harmful.

  ### Phase 1: Data Integrity (The "Counting" Check)
  *Time allocation: 45 minutes*

  **Question 1.1:** Can the grantee trace the reported number back to individual source documents (logs, intake forms, timesheets) for a random sample of 10% of the reported total?
  *   **Sufficient Answer:** Yes, the sample matches the aggregate within a 2% margin of error.
  *   **Insufficient Answer:** No, records are missing, aggregated too early, or the sample reveals >5% discrepancy.
  *   **Decision:** If **Insufficient**, flag for **Audit**. Do not renew until audit is resolved. If fraud is confirmed, **Terminate**.

  **Question 1.2:** Has the methodology for counting changed since the last grant period (e.g., new software, new definition of "meal" or "placement")?
  *   **Sufficient Answer:** No change; OR Yes, but the change was disclosed and accounts for <15% of the variance in the numbers.
  *   **Insufficient Answer:** Yes, the change was undisclosed and accounts for >15% of the variance.
  *   **Decision:** If **Insufficient**, mark as **Counting Artifact**. Proceed to Phase 2, but discount the numerical growth. Do not penalize grantee yet.

  ### Phase 2: Ground Truth (The "Smell" Check)
  *Time allocation: 90 minutes*

  **Question 2.1:** Do qualitative indicators (site visits, client interviews, third-party feedback) correlate with the quantitative trend?
  *   **Sufficient Answer:** Yes. (e.g., Higher placements = more employer partners; Higher meals = more lines at the door).
  *   **Insufficient Answer:** No. (e.g., Placements up, employer calls down; Meals flat, waiting list doubled).
  *   **Decision:** If **Insufficient**, the metric is **Decoupled**. Proceed to Phase 3.

  **Question 2.2:** If the metric is decoupled, is the grantee serving the *intended* population, or have they shifted to an easier-to-serve population to hit the number?
  *   **Sufficient Answer:** Population demographics remain consistent with grant intent.
  *   **Insufficient Answer:** Demographics have shifted significantly toward lower-need clients ("creaming").
  *   **Decision:** If **Insufficient**, this is **Mission Drift**. **Recommend No Renewal** unless grantee commits to corrective plan.

  ### Phase 3: Incentive Distortion (The "Goodhart" Check)
  *Time allocation: 60 minutes*

  **Question 3.1:** Is the behavior driving the number sustainable without compromising quality?
  *   **Sufficient Answer:** Yes. The method of achieving the number aligns with best practices in the field.
  *   **Insufficient Answer:** No. (e.g., Job placements are 30-day gigs just to hit the "placement" metric; Shelter nights are inflated by keeping people who don't need overnight care).
  *   **Decision:** If **Insufficient**, the metric is **Perverse**. Flag for **Metric Replacement**. Renewal decision depends on Phase 4.

  **Question 3.2:** Is the target itself the problem (too low or too rigid)?
  *   **Sufficient Answer:** The grantee exceeded the target due to genuine capacity growth or unexpected demand, but quality remains high.
  *   **Insufficient Answer:** The target was set based on outdated data and encourages sandbagging or limits expansion.
  *   **Decision:** If **Insufficient**, flag for **Target Recalibration**. This is a Foundation error, not a Grantee error.

  ### Phase 4: Valuation (The "Values" Check)
  *Time allocation: 30 minutes*

  **Question 4.1:** If we ignore this number entirely, do we still believe this grantee is doing work we want to fund?
  *   **Sufficient Answer:** Yes. The underlying work is valuable even if the current metric doesn't capture it.
  *   **Insufficient Answer:** No. The number was the primary proxy for the value we cared about, and without it, the work is not a priority.
  *   **Decision:** If **Insufficient**, **Recommend No Renewal**. This is a strategic pivot, not a performance failure.

  ### Phase 5: The Fix Cost (The "Board" Check)
  *Time allocation: 15 minutes*

  **Question 5.1:** Is the metric broken enough to justify the cost of Board approval and system-wide reporting changes?
  *   **Criteria for "Yes":** The metric is perverse (Phase 3.1), actively misleading (Phase 2.1), or blinds us to a major demographic shift (Phase 2.2).
  *   **Criteria for "No":** The metric is merely "degraded" (e.g., slightly gamed but still directionally accurate) or the issue is a one-time anomaly.
  *   **Decision:**
      *   If **Yes**: Renew grantee *conditionally* on collaborating to design a new metric for the next cycle. Prepare Board memo.
      *   If **No**: Renew grantee. Note the degradation in internal files. Live with the noise.

  ***

  ## Case Applications

  ### Case 1: The Job-Training Grantee
  *Scenario: Placement rate climbing; employer feedback calls stopped.*

  *   **Phase 1 (Integrity):** Records show placements are real people hired. **Pass.** (It's not fake data).
  *   **Phase 2 (Ground Truth):** Quantitative trend (up) contradicts qualitative feedback (silence). **Fail (Decoupled).**
  *   **Phase 3 (Distortion):** Investigation reveals placements are short-term contracts or with friendly employers who don't provide feedback. Quality is compromised to hit the count. **Fail (Perverse).**
  *   **Phase 4 (Valuation):** We care about *sustainable* jobs, not just hires. Without the employer feedback, the number is worthless. **Fail (Values).**
  *   **Phase 5 (Fix Cost):** Is this metric broken enough to change? Yes, because it is actively incentivizing low-quality placements.
  *   **Protocol Output:** **Do Not Renew** in current form. Offer a 6-month bridge grant *only if* they agree to co-design a new metric (e.g., "retention at 6 months" + "employer satisfaction score"). If they refuse, terminate.
  *   **Rationale:** This is gaming that harms the mission. The cost of changing the metric is justified because the current one is dangerous.

  ### Case 2: The Food Bank
  *Scenario: Meals served flat; client interviews show demand shifted to a population the metric doesn't capture (e.g., from families to seniors).*

  *   **Phase 1 (Integrity):** Counts are honest. **Pass.**
  *   **Phase 2 (Ground Truth):** Numbers flat, but waiting list/need is up. **Fail (Decoupled).**
  *   **Phase 2.2 (Population):** Demographics have shifted. **Fail (Mission Drift - but not grantee's fault).** The grantee is serving the need, but the *metric* is blind to the new need.
  *   **Phase 3 (Distortion):** No perverse incentive found. They aren't turning away seniors to feed families to hit a "family meal" count. **Pass.**
  *   **Phase 4 (Valuation):** Do we care about feeding seniors? Yes. **Pass.**
  *   **Phase 5 (Fix Cost):** Is the metric broken enough to change? Yes. "Meals served" is too blunt. It hides the shift in need.
  *   **Protocol Output:** **Renew.** Flag for **Metric Replacement**. Propose adding a demographic breakdown to the "meals served" line item.
  *   **Rationale:** The grantee is honest and effective. The metric is the liability. The cost of Board approval is worth it to ensure future grants target the actual demographic need.

  ### Case 3: The Homelessness Grantee
  *Scenario: Shelter nights sail past target every quarter.*

  *   **Phase 1 (Integrity):** Logs match. **Pass.**
  *   **Phase 2 (Ground Truth):** High numbers match full beds and turned-away requests. **Pass.**
  *   **Phase 3 (Distortion):** Are they keeping people who don't need shelter? No. **Pass.** Is the target the problem? Yes. **Fail (Target Recalibration).**
  *   **Phase 4 (Valuation):** Do we still care about shelter nights? Yes. **Pass.**
  *   **Phase 5 (Fix Cost):** Does this require a new metric? No. It requires a new *target*.
  *   **Protocol Output:** **Renew.** Flag for **Target Recalibration**.
  *   **Board Memo Language:** Do not write "We set the target too low." Write: "Grantee capacity has exceeded projections due to efficient operations and increased community demand. Recommend adjusting baseline targets for next cycle to reflect current capacity and prevent resource under-utilization."
  *   **Rationale:** This protects the grantee from being penalized for success and protects the Board from feeling incompetent. It treats target adjustment as routine maintenance, not a failure of governance.

  ***

  ## Failure Modes: Where This Procedure Misfires

  You asked for explicit honesty about where this tool will break. No checklist can capture the complexity of human systems. Here is where the MIRP will fail:

  **1. The "Collusive Gaming" Blind Spot**
  *   **The Situation:** The grantee coaches clients on how to answer your interview questions. "When the foundation calls, say you have a job."
  *   **Why MIRP Fails:** Phase 2 relies on qualitative checks (interviews). If the data entering Phase 2 is already corrupted by the grantee, the procedure validates the lie.
  *   **Mitigation:** You must occasionally bypass the grantee for third-party data (e.g., state unemployment records instead of grantee placement logs). This is outside the "one afternoon" constraint and requires special investigation.

  **2. The "Quality Erosion" Lag**
  *   **The Situation:** A literacy program focuses on "students reading at grade level." They teach to the test. Students pass the test but cannot read a newspaper.
  *   **Why MIRP Fails:** Phase 3 asks if behavior is sustainable. Teaching to the test *is* sustainable. The quality erosion only shows up years later, beyond your renewal cycle.
  *   **Mitigation:** This requires longitudinal tracking, which mid-sized foundations rarely have. You must acknowledge that this procedure validates *short-term* integrity, not *long-term* impact.

  **3. The "Program Officer Bias" Vector**
  *   **The Situation:** You like the Executive Director of the Homelessness grantee (Case 3).
  *   **Why MIRP Fails:** In Phase 2 and 3, many answers are subjective ("Does this smell right?"). If you trust the person, you will mark "Pass" on questions you should mark "Fail."
  *   **Mitigation:** This procedure works best when peer-reviewed. Have another PO run the protocol on your grantee once a year.

  **4. The "Metric Freeze" Trap**
  *   **The Situation:** Phase 5 advises "living with a degraded metric" to save Board capital.
  *   **Why MIRP Fails:** If you do this for three grantees a year, over five years you have 15 grants running on broken data. You lose the ability to evaluate your own portfolio's impact.
  *   **Mitigation:** Track the "Deferred Maintenance" list. If more than 20% of your portfolio is flagged as "Living with degraded metric," you must force a Board conversation about reporting overhaul, regardless of the cost.

  **5. The "Values Handoff" Dodge**
  *   **The Situation:** Phase 4 asks if you still care about the thing the number proxies.
  *   **Why MIRP Fails:** It hands the decision back to you ("Question of values"). It does not solve the problem of a foundation that no longer knows what it believes.
  *   **Mitigation:** If you find yourself hesitating at Phase 4 frequently, the problem is not the grantees or the metrics; it is the Foundation's strategy. That requires a Board retreat, not a renewal protocol.
