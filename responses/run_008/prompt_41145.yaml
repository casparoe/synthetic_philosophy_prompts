prompt: |-
  I'm on the board of a mid-sized land trust — we do habitat restoration, wetlands, grassland easements, that kind of thing. A big decision is coming up at next month's meeting and I want a decision memo written beforehand that I can circulate.

  The situation: a donor family wants to fund a 30-year restoration of a drained valley bottom back to wetland, several thousand acres, beavers, fish, waterfowl, the works. It would be the biggest project in our history. One of our newer board members, who's deep in the effective altruism world, is arguing we should decline it. His claim: more habitat means more wild animals, and if the average wild animal life is bad — starvation, disease, parasitism, most offspring dying before maturity, and wetlands are especially brutal about this — then restoring habitat is basically manufacturing suffering at scale. He's not being lazy about it either, he brought population estimates. Most of the old gaurd on the board are horrified and say that's just not how anyone thinks about conservation, but nobody has actually written down why it's wrong, and I don't want us to vote on vibes.

  Draft the memo the board will actually vote on. It needs to recommend a concrete course of action — fund it, decline it, fund with conditions, whatever you think holds up — and I want it to do a few specific things:

  - Keep the empirical question (are wild animal lives net negative on average, and how confident can anyone honestly be about that) separate from the moral ones (does aggregate welfare even constrain what we do, vs biodiversity or ecological integrity as goods in their own right, donor intent, what we owe the community). Don't let one get smuggled in as the answer to the other.
  - Take the EA guy's strongest version seriously rather than treating it as an intrusion on the mission. If our whole organization implicitly assumes flourishing wild nature is a good thing, the memo should own that and either defend it or qualify it.
  - Give us a decision procedure for this whole class of case, not just this project — what evidence would change our answer, and who we'd be if we acted differently depending on how the numbers came out. If the honest answer is that the empirical question is so uncertain both sides are betting, say that and explain how to bet.

  One more thing: keep it readable. Our board includes a retired dairy farmer and a dermatologist, so no wall of philosophy jargon, but don't dumb it down either — they can smell a dodge.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Context:** Mid-sized land trust board meeting.
      *   **Issue:** A major donor wants to fund a 30-year, multi-thousand-acre wetland restoration project.
      *   **Conflict:** A new board member (Effective Altruism/EA background) argues against it based on "wild animal suffering" (WAS) – claiming wild lives are net negative, so creating habitat creates suffering. Old guard board members are horrified but lack a structured counter-argument.
      *   **Goal:** A decision memo to circulate before the vote.
      *   **Requirements:**
          *   Recommend a concrete course of action.
          *   Separate empirical questions (are wild lives net negative?) from moral questions (do we value biodiversity/ecological integrity regardless?).
          *   Take the EA argument seriously (steelman it), don't dismiss it as mission drift.
          *   Provide a decision procedure for future cases (not just this one).
          *   Acknowledge uncertainty (if both sides are betting, say so).
          *   **Tone:** Readable for a diverse board (farmer, doctor, etc.), no jargon, but intellectually honest. No dodging.

  2.  **Determine the Recommendation:**
      *   *Option A: Decline.* This validates the EA concern but likely destroys the organization's core mission and donor relationships. It's too radical for a land trust.
      *   *Option B: Fund Unconditionally.* Ignores the EA concern, risks internal division, doesn't address the uncertainty.
      *   *Option C: Fund with Conditions/Mitigation.* This is the middle path. It acknowledges the concern, commits to monitoring/adaptive management, and reaffirms the mission while accepting the uncertainty.
      *   *Decision:* **Fund with Conditions (Adaptive Management & Monitoring).** This allows the trust to pursue its core mission while taking the welfare concern seriously enough to monitor outcomes. It treats the EA argument as a risk factor to be managed, not a veto.

  3.  **Structure the Memo:**
      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** The bottom line up front.
      *   **The Proposal:** Briefly describe the Valley Bottom Restoration.
      *   **The Objection:** Fairly state the EA/Wild Animal Suffering argument.
      *   **Analysis - Part 1: The Empirical Question:** What do we actually know about wild animal welfare? (Uncertainty, lack of consensus).
      *   **Analysis - Part 2: The Moral Question:** What is our mission? (Ecological integrity vs. individual welfare).
      *   **Decision Procedure:** How we handle this going forward.
      *   **Recommendation:** The specific vote.

  4.  **Drafting - Section by Section:**

      *   *Header:* Keep it professional.
      *   *Executive Summary:* Needs to be clear. We are proceeding, but we are acknowledging the concern and setting up a framework to handle it.
      *   *The Proposal:* Keep it brief. 30 years, wetlands, biodiversity.
      *   *The Objection:* This needs care. Don't mock it. State it clearly: "More animals = more suffering if life is net negative." Acknowledge the data the member brought (population estimates).
      *   *Empirical Analysis:* This is the "are they right?" section.
          *   *Key point:* Science doesn't know. We can't measure "suffering" in a fish or a beaver objectively yet.
          *   *Key point:* It's a bet. Both sides are betting. The EA side bets suffering > joy. The Conservation side bets existence > non-existence.
          *   *Tone:* Honest uncertainty.
      *   *Moral Analysis:* This is the "does it matter?" section.
          *   *Key point:* Land trusts value *systems*, not just individuals.
          *   *Key point:* Donor intent and community expectations.
          *   *Key point:* If we stop because of this, do we stop *all* conservation? (Slippery slope but relevant).
          *   *Key point:* We need to own our values. We believe biodiversity is good *even if* individuals suffer.
      *   *Decision Procedure:* How to vote next time.
          *   1. Is it within mission?
          *   2. Is the empirical uncertainty too high? (If we knew for sure it was a torture chamber, would we stop?)
          *   3. Mitigation. Can we reduce suffering? (e.g., predator management, disease control - though tricky in wildlands).
      *   *Recommendation:* Approve the project. Establish a "Welfare & Ecology Working Group" to monitor and report. This shows we take it seriously without halting the work.

  5.  **Refining the Tone:**
      *   *Avoid:* "Utilitarian calculus," "Negative utilitarianism," "Ecocentrism vs. Sentientism."
      *   *Use:* "Bottom line," "What we know vs. what we guess," "Our core purpose."
      *   *Audience Check:* The dairy farmer cares about animal welfare but also land health. The dermatologist cares about evidence. The EA member cares about logic.
      *   *Self-Correction during drafting:* I initially thought about suggesting specific mitigation (like culling). *Correction:* No, that's too controversial for a land trust and might violate the "wild" aspect. Better to focus on *monitoring* and *research* rather than active intervention in natural processes, which could undermine the restoration goal. The recommendation should be to *study* the impact, not necessarily intervene to stop natural predation/starvation, unless it's human-caused suffering. Actually, better yet: Commit to reviewing emerging science.

  6.  **Final Polish:**
      *   Check against constraints: Did I separate empirical/moral? Yes. Did I take EA seriously? Yes. Is there a decision procedure? Yes. Is it readable? Yes.
      *   Make sure the recommendation is actionable. "Approve funding, establish working group."

  7.  **Final Review against the "Vibes" constraint:** The user said "I don't want us to vote on vibes." The memo needs to feel structured and logical, not just "we feel nature is good." It needs to explicitly state *why* we prioritize ecological integrity over individual welfare uncertainty.

      *(Self-Correction on the Recommendation)*: If I recommend "Fund with Conditions," what conditions? We can't promise to stop starvation. That's nature. The condition should be on *governance*: We accept this uncertainty as a known risk, we commit to reviewing new data, and we affirm our mission statement explicitly includes ecological integrity *over* individual welfare metrics where they conflict. This protects the board from future paralysis.

      *Revised Recommendation:* Approve the project. Amend the strategic plan to explicitly acknowledge the tension between individual welfare and ecosystem health. Create a protocol for evaluating future projects where welfare concerns are raised.

      *Wait, let's look closer at the EA argument.* If the EA member is right, this is a moral catastrophe. The memo needs to acknowledge that *if* we knew for sure wild lives were net negative, this would be hard to justify. But since we *don't* know, we fall back on our charter.
      *Okay, let's finalize the recommendation:* Proceed with the project. Formalize a "Mission & Ethics Framework" that clarifies how we weigh individual welfare against ecosystem health. This answers the "who we'd be" requirement.

  8.  **Drafting the Content:** (Mental outline of the text)
      *   Start with the decision: Go ahead.
      *   Explain the EA argument fairly.
      *   Break down the Science (We don't know).
      *   Break down the Ethics (We value systems).
      *   Set the Rule for next time (The Decision Procedure).
      *   Closing.

      *Refining the "Decision Procedure":*
      1. Mission Alignment.
      2. Evidence Threshold (Is the harm certain or speculative?).
      3. Mitigation (Can we reduce harm without killing the project?).
      4. Values Check (Does this contradict our core charter?).

      *Let's write it.* (Focusing on clear headings, bullet points, and plain English).

      *One nuance:* The EA member brought population estimates. I should acknowledge that. "We accept the population math, but not the welfare valuation."

      *Another nuance:* The "betting" aspect. "Both sides are betting on uncertain science. We are betting on the value of wild systems."

      *Okay, ready to generate.*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Land Trust Name]
  **FROM:** [Your Name/Executive Committee]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Valley Bottom Restoration Project & Ethical Framework

  ### 1. Executive Summary
  **Recommendation:** The Board should **approve** the Valley Bottom Restoration Project as proposed, subject to the adoption of a new *Ethical Decision Framework* (detailed in Section 5).

  **Reasoning:** The objection raised regarding wild animal suffering is logically coherent and deserves serious engagement. However, current science cannot definitively answer whether wild animal lives are "net negative." In the face of this empirical uncertainty, the Land Trust must act according to its established mission: preserving ecological integrity and biodiversity. To decline this project based on speculative welfare metrics would effectively halt most conservation work. Instead of stopping, we will formalize how we weigh individual animal welfare against ecosystem health for this and all future projects.

  ### 2. The Proposal
  The donor family proposes funding a 30-year restoration of the [Valley Name] bottomlands.
  *   **Scope:** ~3,000 acres of drained agricultural land returned to functional wetland.
  *   **Ecological Goal:** Re-establish hydrology, native vegetation, and habitat for beavers, fish, waterfowl, and amphibians.
  *   **Significance:** This would be the largest single project in our organization's history.

  ### 3. The Objection (The "Wild Animal Suffering" Argument)
  A concern has been raised that restoring this habitat will increase the population of wild animals. The argument proceeds as follows:
  1.  **Empirical Claim:** Life in the wild involves significant suffering (starvation, disease, predation, exposure). For many species, most offspring die shortly after birth.
  2.  **Moral Claim:** If the average life is net negative (more suffering than joy), bringing more animals into existence creates more net suffering.
  3.  **Conclusion:** Therefore, restoring habitat may be morally harmful, even if it benefits "biodiversity."

  This argument is not a distraction; it challenges the foundational assumption of conservation: that *more wild nature is inherently good.* We must address it directly.

  ### 4. Analysis

  #### A. The Empirical Question: What do we know?
  **Status:** *High Uncertainty.*

  The claim that wild animal lives are net negative is a hypothesis, not a proven fact.
  *   **The Data Gap:** We have population estimates (as provided by our board member), but we do not have a scientific metric for "suffering" vs. "flourishing" in non-human animals. We cannot measure the subjective experience of a beaver or a duck with the precision required to do the math.
  *   **The Bet:** Both sides of this debate are making a bet on uncertain science.
      *   *The EA Bet:* Assumes suffering outweighs positive experiences (feeding, mating, rearing young, play).
      *   *The Conservation Bet:* Assumes existence and natural function outweigh the costs of mortality and predation.
  *   **Conclusion:** Because the science is inconclusive, we cannot use "net negative welfare" as a factual veto. It remains a philosophical risk, not an empirical certainty.

  #### B. The Moral Question: What is our mission?
  **Status:** *Defined by Charter and Community.*

  Even if we assume high levels of suffering in the wild, we must decide if that constrains our work.
  *   **Systems vs. Individuals:** Land trusts are mandated to protect *ecosystems*, not individual animals. A functioning wetland requires predation, decomposition, and natural mortality. To manage for individual welfare (e.g., preventing starvation or predation) would require turning the preserve into a managed zoo, which violates our mission of "wild" restoration.
  *   **Donor Intent & Community Trust:** Our donors and the public support us to protect land and wildlife. Pivoting to prioritize individual welfare metrics over ecological health would break faith with the community we serve and the donors who fund us.
  *   **The "Non-Existence" Alternative:** If we do not restore this land, it likely remains in drainage-intensive agriculture. This also involves animal suffering (livestock management, pest control, loss of wild habitat). We cannot assume the status quo is morally neutral.

  ### 5. Decision Procedure for Future Cases
  To ensure we are not voting on "vibes" in the future, the Board adopts the following four-step test for projects where ethical objections are raised:

  1.  **Mission Alignment:** Does the project advance our core goal of ecological integrity? (If No: Decline).
  2.  **Evidence Threshold:** Is the claimed harm *empirically certain* or *theoretically possible*?
      *   *Example:* If a project was proven to introduce a torturous invasive disease, that is certain harm.
      *   *Example:* General predation and starvation are theoretical welfare risks inherent to wild systems.
      *   *Rule:* We do not halt projects based on theoretical welfare risks inherent to wild nature.
  3.  **Mitigation:** Can we reduce specific, human-caused suffering without compromising ecological function? (e.g., removing snares, preventing human-wildlife conflict).
  4.  **Values Check:** Does acting on this objection require us to become a different organization? (If Yes: Decline the objection).

  ### 6. Recommendation & Next Steps

  **Motion:** Approve the Valley Bottom Restoration Project funding.

  **Condition:** Concurrently adopt the *Ethical Decision Framework* above. This acknowledges the board member's concern by formalizing how we evaluate it, without allowing uncertain welfare metrics to paralyze our core mission.

  **Implementation:**
  1.  **Working Group:** Establish a small committee (including the dissenting board member, if willing) to review emerging science on wild animal welfare annually.
  2.  **Reporting:** Include a brief section in our annual report on how we balance ecosystem health with animal welfare considerations.
  3.  **Communication:** When discussing this project publicly, we speak to our mission (biodiversity, water quality, resilience). We do not engage in public debate on the "net value of wild life," as this is outside our expertise and mandate.

  ### 7. Closing
  We are not ignoring the possibility that wild animals suffer. We are acknowledging that we cannot measure it precisely, and that our organization is built to protect *nature*, not to manage the subjective well-being of every individual within it.

  If we decline this project, we are effectively saying that conservation cannot proceed until we solve a philosophical problem that the rest of the world has not solved. That is not a position a land trust can hold. We proceed with humility, knowing we are betting on the value of wild systems, but we proceed with our eyes open.

  **Vote Required:** Simple Majority
  **Attachments:** Project Budget, Ecological Impact Study, Draft Ethical Decision Framework.
