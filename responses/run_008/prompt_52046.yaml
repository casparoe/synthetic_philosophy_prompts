prompt: |-
  I am a junior at a public high school, and I serve as one of two student members on a five-person conduct committee that hears disciplinary cases: cheating, plagiarism, harassment, misuse of school accounts. We meet roughly twice a month. Each hearing gets about thirty minutes of deliberation, the evidence is mostly testimony — statements from students and teachers, screenshots, sometimes nothing but flatly conflicting accounts — and every finding goes to the dean with a written rationale, with sanctions running from a reprimand to a recommendation of expulsion. I have a vote but not a veto, and the adults on the committee tend to defer to whichever student speaks with more confidence, which worries me.

  In economics we just covered Adam Smith, and my teacher mentioned that before the book about markets he wrote a 1759 book about how people judge conduct, The Theory of Moral Sentiments. The ideas I took from it, and want to put to use, are these: that we approve or disapprove of someone by sympathy, by coming to feel some part of what they seemed to feel, and that we can only go along with a feeling when we can share it; that when I judge my own past conduct I split in two, the agent I was and the spectator I now am, and try to see what I did as a fair, well-informed stranger would see it; that this internal judge can be corrupted, because we crave the approval of the actual people around us and can confuse the desire to be praised with the desire to be worthy of praise; and that punishment in particular is justified only at the level an impartial bystander could endorse, since spectators sympathize with an offender's suffering only up to a point.

  Please write a procedure the committee can actually run in a hearing. It should give the questions to ask, in order; what counts as enough of an answer to move on; the points at which the procedure must stop and say that this one is a judgment a human has to make and own, rather than pretending to compute it; and a short set of self-checks a member can use to tell whether they are consulting the impartial spectator or just the room — the parents waiting outside, the dean, the loudest person at the table. Then run the procedure on three cases: (1) a senior with a scholarship at stake who copied two paragraphs into a paper and, when first asked, said the source was common knowledge; (2) a ninth grader, disliked by half the school, who sent one cruel message about a classmate to a group chat; and (3) a case with no witnesses where two students give opposite accounts of who shoved whom, one of them a friend of mine. I want at least one of the worked cases to come out somewhere I won't like, and I want you to be honest about what the procedure cannot do — especially whether Smith's apparatus gives any answer at all when sympathy itself is the problem, as when the whole committee feels warmly toward a student who did something serious.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Junior in high school, student member of a 5-person conduct committee (2 students, 3 adults).
      *   **Context:** Hearings happen twice a month, 30 mins deliberation each. Evidence is often testimonial/conflicting. Outcomes range from reprimand to expulsion recommendation.
      *   **Problem:** Adults defer to the most confident student voice. User worries about bias, peer pressure, and the weight of the decision.
      *   **Framework:** Adam Smith's *The Theory of Moral Sentiments* (1759). Key concepts: Sympathy (sharing feelings), Impartial Spectator (internal judge), Agent vs. Spectator split, Corruption of praise vs. praiseworthiness, Punishment limited by spectator sympathy.
      *   **Task:**
          1.  Design a concrete hearing procedure based on Smith's ideas (questions, thresholds, stop-points, self-checks).
          2.  Apply the procedure to three specific cases (Senior plagiarism, 9th-grade cyberbullying, He-said/She-said shoving).
          3.  Constraint: At least one outcome must be uncomfortable/unpopular for the user.
          4.  Constraint: Be honest about the limits of Smith's framework (especially when sympathy is biased).

  2.  **Deconstruct Smith's *Theory of Moral Sentiments* for this Context:**
      *   *Sympathy:* We need to understand the *motives* of the accused and the *grievances* of the victim/community. Can we "enter into" them?
      *   *Impartial Spectator:* The core mechanism. We must strip away personal connection, status, and confidence. What would a neutral observer say?
      *   *Praiseworthiness vs. Praise:* Are we punishing to look good to the Dean/Parents, or because it's actually deserved?
      *   *Proportionality:* Punishment is justified only as far as the impartial spectator sympathizes with the resentment against the offender. Too much punishment disgusts the spectator.

  3.  **Drafting the Procedure (The "Smithian Protocol"):**
      *   *Structure:* Needs to fit a 30-minute deliberation. Needs to be actionable.
      *   *Phase 1: Fact-Finding (The Agent's View).* What happened? What did they intend?
      *   *Phase 2: The Spectator's View (Sympathy Check).* Can we inhabit the motives? Can we inhabit the victim's resentment?
      *   *Phase 3: The Impartial Test (Corruption Check).* Removing status/confidence.
      *   *Phase 4: Sanctioning (Proportionality).* Matching the resentment.
      *   *Stop Points:* Where logic ends and judgment begins.
      *   *Self-Checks:* Questions to ask oneself to detect bias.

  4.  **Developing the Three Cases:**

      *   *Case 1: Senior Plagiarism.*
          *   *Facts:* Copied 2 paragraphs. Claimed "common knowledge." Scholarship at stake.
          *   *Smithian Analysis:* Intent matters. Was it lazy or deceptive? "Common knowledge" defense suggests awareness of rules but testing boundaries.
          *   *Sympathy:* Hard to sympathize with deception, but easy to sympathize with pressure (scholarship).
          *   *Impartial Spectator:* Would they care about the scholarship? No. They care about the integrity of the school.
          *   *Outcome:* Needs to be firm but proportional. Expulsion might be too much (spectator sympathizes with the ruin of a life over 2 paragraphs), but a slap on the wrist undermines the rule. *Decision:* Failing grade + Suspension. (Uncomfortable because of the scholarship stakes).

      *   *Case 2: 9th Grade Cyberbullying.*
          *   *Facts:* One cruel message. Student is generally disliked.
          *   *Smithian Analysis:* The "disliked" status is dangerous. We must ignore the general reputation. Focus on the specific act.
          *   *Sympathy:* Can we sympathize with the sender? Maybe impulse? Can we sympathize with the victim? Yes, public humiliation.
          *   *Impartial Spectator:* Would they punish more because the kid is annoying? No.
          *   *Outcome:* Restorative rather than purely punitive. *Decision:* Apology + Counseling. (This might be the "comfortable" one, or maybe I need to make it harder). Let's make it harder: The committee wants to expel because he's "toxic." Smith says no, punishment must match the specific resentment of *this* act.

      *   *Case 3: The Shoving (Friend involved).*
          *   *Facts:* No witnesses. Conflicting accounts. One is my friend.
          *   *Smithian Analysis:* This is the hardest. Sympathy is naturally biased toward the friend. The "Impartial Spectator" demands I discount my friend's testimony or treat the uncertainty as a tie.
          *   *Smith's Limit:* Smith relies on sympathy. If I *can't* sympathize with the accuser because I'm too close to the accused, the mechanism breaks.
          *   *Outcome:* I must recuse or vote for "insufficient evidence." If I vote, I must vote against my friend if the impartial view suggests guilt, OR acknowledge I cannot be impartial. Let's make the procedure demand recusal or a "not proven" verdict. *Decision:* "Not Proven" / No Sanction, but with a heavy note on the burden of proof. *Wait, the prompt asks for one outcome I won't like.*
          *   *Revision:* Let's make Case 1 the one I won't like. I want to save the senior. But Smith says the Impartial Spectator doesn't care about the scholarship. So the procedure forces a harsh penalty.
          *   *Revision for Case 3:* If I am the user, I have a vote. If I follow Smith, I must suppress my sympathy for my friend. If the evidence is truly 50/50, the benefit of the doubt goes to the accused. But if I feel my friend is lying... okay, let's make Case 3 the "Recusal" case. That's the honest Smithian move.
          *   *Actually, let's look at the "Uncomfortable Outcome" constraint again.* "I want at least one of the worked cases to come out somewhere I won't like."
          *   *Strategy:* In Case 1 (Senior), the natural student impulse is to save the senior (scholarship). Smith's Impartial Spectator says integrity > consequences. So the procedure mandates a sanction that jeopardizes the scholarship. That hurts.
          *   In Case 3 (Friend), the procedure should force me to acknowledge I cannot be impartial.

  5.  **Addressing the Limits of Smith:**
      *   Smith assumes we *can* access the Impartial Spectator.
      *   What if the committee *collectively* likes the offender? (The "Popular Cheater" problem).
      *   What if the committee *collectively* hates the offender? (The "Unliked 9th Grader" problem).
      *   Smith offers no algorithm for when sympathy is universally corrupted. He relies on education/habit. I need to state this clearly.

  6.  **Refining the Procedure (Iterative Drafting):**
      *   *Step 1: The Narrative.* (Establish facts).
      *   *Step 2: The Motive.* (Why did they do it? Can we enter into it?).
      *   *Step 3: The Resentment.* (Does the victim/community resentment match the act?).
      *   *Step 4: The Veil of Ignorance (Smithian Style).* (If we didn't know who they were, what would we do?).
      *   *Step 5: The Sanction.* (Proportional to resentment).
      *   *Self-Check:* "Am I voting this way because the Dean is watching?" "Am I voting this way because this student is popular?"

  7.  **Writing the Response:**
      *   *Tone:* Respectful, serious, intellectual but practical. Acknowledge the user's maturity.
      *   *Structure:*
          1.  Introduction (Validating the Smithian approach).
          2.  The Procedure (The "Spectator Protocol").
          3.  The Self-Checks.
          4.  The Limits (Honesty about Smith).
          5.  The Three Cases (Applied).
      *   *Check against constraints:* 30 min hearing context? Yes. Questions in order? Yes. Stop points? Yes. Uncomfortable outcome? Yes (Case 1). Limits addressed? Yes.

  8.  **Final Polish:**
      *   Ensure the distinction between "desire to be praised" (Dean/Parents) and "desire to be praiseworthy" (Smith) is clear.
      *   Make sure the "Stop Point" is clear: When evidence is missing, the Spectator cannot judge facts, only procedure.
      *   Ensure the "Friend" case handles the conflict of interest honestly. Smith would say you cannot be an impartial spectator regarding a friend.

  *(Self-Correction during drafting Case 1)*: If I make the penalty expulsion, that might be too harsh for 2 paragraphs. Smith argues for proportionality. The spectator sympathizes with the student's ruin. So, a failing grade and suspension is the "Smithian" middle ground—upholding the rule without destroying the life. But for a junior worried about a senior's scholarship, even a suspension might feel like "I didn't save them." I will frame the uncomfortable outcome as the refusal to mitigate based on consequences.

  *(Self-Correction during drafting Case 3)*: If one is my friend, Smith's *Impartial Spectator* is internal. But in a committee, I have to vote. If I know I'm biased, the only moral act is recusal. I will make the procedure mandate recusal in Case 3. That is the "honest" outcome.

  *(Self-Correction on Limits)*: The prompt asks specifically about when "sympathy itself is the problem." I need to highlight that Smith doesn't solve groupthink. If the whole room loves the cheater, the Spectator is silent.

  9.  **Final Review against Prompt:**
      *   Procedure with questions? Yes.
      *   Thresholds to move on? Yes.
      *   Stop points (human judgment)? Yes.
      *   Self-checks? Yes.
      *   Three cases run? Yes.
      *   One outcome I won't like? Yes (Case 1).
      *   Honest about limits? Yes.

