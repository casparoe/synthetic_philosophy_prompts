  6.  **Prediction Markets:** Public figures accept privacy loss as a cost of status; private couples do not. Markets here function as information aggregation vs. harassment tools. **Verdict: Split.**
  7.  **University Auction:** This is your flip-flop because it pits Institutional Revenue against Institutional Integrity (Meritocracy). Selling seats corrupts the signaling value of the degree, similar to selling votes.

  **The Verdict to Abandon:**
  You should resolve Case 7 (University Auction) to a **No**. If you forbid selling national votes because it corrupts the democratic signal, you must forbid selling university seats because it corrupts the meritocratic signal. A degree is a credential of competence; if it can be bought, the signal is noise. The revenue benefit does not outweigh the corruption of the institution's core function, especially when compared to the life-saving urgency of kidneys (Case 1).

  **Application to Novel Cases:**
  1.  **Line-standing at Congressional Hearings:** **No.** This corrupts the democratic function of access and transparency. It allows wealth to substitute for civic engagement, similar to vote selling.
  2.  **ER Fast-track:** **No.** This corrupts the medical triage function (need-based) into a wealth-based allocation. Unlike kidneys (where money *creates* supply), here money merely *reallocates* existing emergency care, exploiting asymmetric vulnerability (pain/death).

