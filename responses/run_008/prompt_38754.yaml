prompt: |-
  I have just been appointed director of a new character-education program at a public secondary school, and in a month I must deliver the opening address at the staff workshop that inaugurates it. The appointment has become philosophically awkward for me. The program's prospectus to parents leans heavily on the language of virtue: we will, it promises, cultivate honesty, courage, and compassion as stable traits of character. In preparing my remarks, I have been reading the situationist literature, and it has unsettled me more than I anticipated — Hartshorne and May's finding in the late 1920s that a child's honesty on a classroom test barely predicts whether she cheats at a game of marbles later the same afternoon; Darley and Batson's Good Samaritan study, in which a seminarian's being in a hurry mattered more to whether he stopped to help than anything about his dispositions; Milgram's obedience results; the bystander experiments. If cross-situational consistency of character is largely an illusion, then a curriculum promising to build it is promising the wrong thing, and a staff that half-knows this will smell it at once — several of our teachers trained in psychology.

  Please write the address: roughly ten minutes, delivered to a mixed room of skeptical psychology-trained teachers, enthusiastic donors seated at the back, and colleagues who mainly want practical guidance. It must take situationism seriously rather than deflect it — I want it to concede the Hartshorne and May result explicitly and openly, and then to argue that the program survives the concession. What I would like the speech to make real is a reorientation I have been considering: that we teach character partly as situation-design, so that students learn to audit the pressures of a scene — hurry, diffusion of responsibility, whatever norms are most salient — and to alter those pressures, meaning that Aristotelian habituation survives situationism by treating the situations themselves as among the things habituated. I want that idea actually argued, not merely gestured at, but in language a tired teacher at four in the afternoon on an inset day can follow; and I want the speech to end with the room convinced that the program is more honest, not less ambitious, for the concession.
reasoning: |-
  Here's a thinking process that leads to the suggested address:

  1.  **Analyze the Request:**
      *   **Role:** Director of a new character-education program at a public secondary school.
      *   **Task:** Deliver an opening address at a staff workshop (inaugural).
      *   **Audience:** Mixed group:
          *   Skeptical psychology-trained teachers (know the situationist literature).
          *   Enthusiastic donors (seated at the back, want results/virtue).
          *   General colleagues (want practical guidance, likely tired).
      *   **Constraint/Challenge:** The prospectus promises "stable traits of character" (virtue ethics language), but the Director has been reading situationist literature (Hartshorne & May, Darley & Batson, Milgram, etc.) which suggests cross-situational consistency is an illusion.
      *   **Goal:** Concede the situationist findings explicitly (don't deflect), but argue the program survives and thrives.
      *   **Core Argument:** Reorient character education from *just* building internal traits to *also* teaching "situation-design." Students should learn to audit and alter situational pressures (hurry, diffusion of responsibility, norms). Aristotelian habituation survives by habituating the *management of situations*.
      *   **Tone:** Honest, ambitious, accessible (for a tired teacher at 4 PM), convincing.
      *   **Length:** Roughly 10 minutes (approx. 1,300 - 1,500 words spoken at a moderate pace).

  2.  **Deconstruct the Core Argument (The "Pivot"):**
      *   *The Problem:* Traditional virtue ethics says "Be honest." Situationism says "Honesty isn't a stable thing; it depends on the context."
      *   *The Concession:* Admit Hartshorne & May were right. A kid isn't "honest" in the abstract.
      *   *The Solution:* Character isn't just *who you are*; it's *what you notice* and *how you shape the room*.
      *   *The Mechanism:* "Situation-Design." Teach students to recognize the "hurry," the "crowd," the "authority figure," and actively change those variables.
      *   *The Payoff:* This makes the program *more* honest (intellectually rigorous) and *more* ambitious (active agency vs. passive trait accumulation).

  3.  **Drafting - Section by Section:**

      *   **Introduction (0-2 mins):** Acknowledge the occasion, the mixed audience, and the elephant in the room. Set the tone of intellectual honesty.
          *   *Hook:* The promise in the prospectus vs. the reality in the research.
          *   *Audience Check:* Nod to the psychologists in the room. Nod to the donors. Nod to the tired teachers.

      *   **The Concession (2-4 mins):** Address the situationist literature directly.
          *   *Specifics:* Mention Hartshorne & May (honesty/marbles), Darley & Batson (seminarian/hurry).
          *   *Implication:* If character isn't a solid brick, are we building on sand?
          *   *Validation:* Tell the psychologists, "You are right."

      *   **The Pivot/Reorientation (4-7 mins):** Introduce "Situation-Design."
          *   *Concept:* Character is not just internal armor; it's external navigation.
          *   *Analogy:* Driving. It's not just having "good driver genes"; it's knowing when the road is icy and slowing down.
          *   *Application:* How do we teach this? Auditing the scene.
          *   *Aristotle Update:* Habituation isn't just doing the right thing; it's habituating the *awareness* of the situation.

      *   **Practical Guidance (7-9 mins):** Give the tired teachers something concrete.
          *   *Example:* Cheating. Don't just say "Don't cheat." Ask "What about this test setup invites cheating?"
          *   *Example:* Bullying/Bystander. Don't just say "Be brave." Ask "Who is watching? How do we break the diffusion of responsibility?"
          *   *Benefit:* Reduces moral fatigue for teachers. It's not about fixing the kid's soul; it's about fixing the room's dynamics.

      *   **Conclusion (9-10 mins):** Bring it back to ambition and honesty.
          *   *Address Donors:* We aren't lowering the bar; we're making the target real.
          *   *Address Staff:* We are partners in design.
          *   *Final Line:* A strong closer about honesty and ambition.

  4.  **Refining the Tone:**
      *   *Avoid Jargon:* Keep "situationism" explained simply.
      *   *Empathy:* Acknowledge teacher fatigue ("inset day," "4 PM").
      *   *Respect:* Don't talk down to the psychologists or the donors.
      *   *Rhythm:* Use pauses, rhetorical questions, and short sentences for impact.

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Add more classroom examples. Make sure the "situation-design" concept feels like a tool, not a theory.
      *   *Critique:* Did I mention the donors?
      *   *Fix:* Ensure the ending speaks to their investment without sucking up.
      *   *Critique:* Is the Hartshorne & May reference clear?
      *   *Fix:* Explicitly mention the honesty test vs. marbles.

  6.  **Drafting - Iteration 2 (Writing the Speech):**
      *   *Opening:* Start with the prospectus. It's bold.
      *   *Middle:* The "Bad News" (situationism) followed by the "Good News" (agency).
      *   *Key Phrase:* "Architects of context."
      *   *Closing:* "More honest, not less ambitious." (Use the prompt's requirement).

  7.  **Final Polish:** Check word count and timing. (Aiming for ~1400 words for 10 mins). Ensure the transition from "virtue is an illusion" to "virtue is design" is smooth. *Self-Correction during drafting:* Make sure I don't dismiss Aristotle entirely. The prompt says "Aristotelian habituation survives situationism by treating the situations themselves as among the things habituated." I need to make sure that specific philosophical nuance lands.

      *   *Refining the Aristotle point:* It's not that habits don't exist; it's that the habit is *situational awareness*. The "phronesis" (practical wisdom) is knowing which situation you are in.

  8.  **Final Review against constraints:**
      *   Concede Hartshorne & May? Yes.
      *   Argue situation-design? Yes.
      *   Accessible language? Yes.
      *   Address all audience segments? Yes.
      *   End on "more honest, not less ambitious"? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Good afternoon. Thank you for being here. I know it is an inset day, I know it is late, and I know that "character education" can sometimes sound like one more item on a checklist that never gets shorter.

  I want to begin by talking about the brochure. Many of you have seen the prospectus we sent to parents. It is a beautiful document. It promises that this program will cultivate honesty, courage, and compassion as stable traits of character. It suggests that we are going to build students who are honest *in general*, courageous *in general*, and kind *in general*.

  It is a noble promise. But as I prepared for today, reading through the literature to ensure our curriculum was robust, I found myself in a difficult position. Specifically, I found myself reading the work of the situationists.

  For those of you trained in psychology, you know the names. Hartshorne and May. Darley and Batson. Milgram.

  For those who haven't spent the last decade reading journals, let me summarize the bad news. In the late 1920s, Hartshorne and May ran massive studies on children. They tested their honesty on classroom exams, and then they observed them in games of marbles, and then in athletic contests. They found almost no correlation. A child who didn't cheat on a math test might cheat at marbles an hour later. Honesty, it seemed, wasn't a solid thing inside the child. It was a reaction to the specific context.

  Then there is the Good Samaritan study. Seminarians—men training for the priesthood—were asked to give a talk. Some were told they were late; some were told they had time. On their way, they passed a man slumped in an alley, coughing. The variable that predicted whether they stopped to help wasn't their religiosity, or their personality, or their moral education. It was hurry. If they were in a rush, they walked past.

  The situationist argument is unsettling: Cross-situational consistency is largely an illusion. There is no "honesty" trait that travels with a student from the math exam to the locker room to the dinner table. There are only specific responses to specific pressures.

  I stand here today to tell you that the psychologists in this room are right. The literature is correct. If we promise parents that we are going to forge a steel core of virtue that never bends, regardless of the situation, we are lying. And if we lie to parents, we will lose the students, and we will lose each other.

  So, does that mean we pack up? Does that mean this program is dead on arrival?

  No. It means this program is just getting started.

  It means we have to change our definition of what we are doing. We are not in the business of manufacturing immutable character traits. We are in the business of teaching **situation-design.**

  Here is the pivot. The situationists say character is fragile because the world is full of traps. Hurry. Diffusion of responsibility. Obedience to authority. Salient norms of competition. They argue that because these pressures exist, character is an illusion.

  I argue that because these pressures exist, character is a skill.

  We need to stop teaching character as if it were merely internal armor, and start teaching it as external navigation. We need to teach our students to audit the room.

  Think of it like driving. We do not teach a teenager to drive by hoping they develop a "safe driver personality." We teach them to scan the road. We teach them that when it rains, the braking distance doubles. We teach them to notice the blind spot. We habituate them to recognize the *hazard*, not just to press the pedal.

  That is what we are going to do here. We are going to keep the Aristotelian idea of habituation, but we are going to update the object of the habit. We are not just habituating the action; we are habituating the *awareness of the context.*

  What does this look like at 4:00 PM on a Tuesday?

  It looks like this: When we discuss honesty, we do not just say, "Cheating is wrong." That relies on a trait that Hartshorne and May proved is unstable. Instead, we ask the students: "Look at this test setup. The desks are close together. The proctor is at the front looking at a phone. The norm in this peer group is that 'everyone does it.' What are the pressures here?"

  We teach the student to identify the pressure. And then we ask: "How do you alter the situation?"

  Maybe altering the situation means moving your desk. Maybe it means asking the teacher for a seat change. Maybe it means saying to a friend before the exam, "I'm not sharing answers today, so don't ask." That is not just "being honest." That is *designing a context* where honesty is possible.

  Consider the bystander effect. We know that in a crowd, responsibility diffuses. No one helps because everyone assumes someone else will. A traditional character program says, "Be the hero." A situationist program says, "Notice the crowd."

  We teach our students that when they see a conflict in the hallway, their first moral task is to break the diffusion. Point at a specific person. "You, in the red shirt, call the office." We habituate the *interruption* of the social script.

  To my colleagues who are tired: I want you to hear this clearly. This approach reduces your burden. You are not responsible for fixing a child's soul. You are not responsible for welding a steel beam of virtue into their spine that must hold up under every weight life throws at them. That is impossible.

  You are responsible for helping them read the room. You are a coach of context. When a student fails morally, we do not ask, "What is wrong with you?" We ask, "What was the trap? Was it hurry? Was it authority? Was it the fear of social exclusion? And how do we build a railing there next time?"

  To the donors and parents listening, or represented here today: I know you want your children to be good people. So do I. But a good person who collapses the moment they are in a rush is not a good person; they are a fair-weather friend. By admitting that situations control us, we empower students to control the situations. This is not lowering the bar. It is making the training real. We are not selling you a magic pill. We are offering you a toolkit.

  And to the psychology staff in the front rows: I need your help. I need you to hold my feet to the fire. If I start talking about "building character" as if it's a brick, call me out. Help us design the audits. Help us identify the situational variables in our own school culture. Where are the hurry traps? Where is the diffusion of responsibility happening in our cafeteria? Let's map them.

  This reorientation makes us more honest, because we are admitting the complexity of human behavior. We are not pretending that a lecture on courage will stop a student from obeying a harmful authority figure if the social cost of dissent is too high. We admit the cost. And then we work on lowering it.

  But it also makes us more ambitious.

  It is easy to tell a child to "be brave." It is much harder to teach them to recognize the social dynamics that suppress bravery, and to give them the social tools to dismantle those dynamics. It is easier to preach virtue than to teach architecture.

  We are going to teach architecture.

  We are going to teach our students that they are not just passengers in their own moral lives, subject to the winds of circumstance. They are the designers. They can slow down the hurry. They can clarify the ambiguity. They can name the norm and change it.

  If Hartshorne and May are right, and character is not a consistent trait, then consistency must be manufactured. It must be built, situation by situation, through awareness and design.

  So, let us not promise that we will send home children who never cheat, never falter, and never yield to pressure. That is not education; that is fantasy.

  Let us promise that we will send home students who know when they are being pressured. Students who can look at a situation and say, "This setup is designed to make me complicit," and who have the habit, the skill, and the courage to redesign it.

  That is a harder thing to teach. It requires more of us as staff. It requires more intellectual honesty. But it is the only version of character education that survives contact with reality.

  We are not here to build statues. We are here to build architects. And I believe that is a program worth opening.

  Thank you.
