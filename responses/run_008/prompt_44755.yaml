answer: |-
  You are grappling with a classic problem in public history: the tension between **forensic truth** (what can be proven by documents) and **narrative truth** (what a community understands to be its past). Your intuition is not inconsistent; it is nuanced. You are implicitly weighing the *quality* of the documentary record against the *ethical function* of the memory.

  There is a single principle that accommodates verdicts 1, 2, and 3. It requires abandoning the idea that "documentary record" and "communal memory" are always opposing forces of equal weight. Instead, they must be evaluated based on the **integrity of the record** and the **social cost of the correction.**

  ### The Principle: Corrective Epistemic Justice

  **Statement:**
  *The museum must default to the documentary record as the standard of factual accuracy, **unless** the record is structurally compromised by exclusion or bias, in which case communal memory serves as a necessary corrective; however, when correcting established errors that sustain community identity, accuracy must be maintained but the manner of correction should minimize gratuitous dishonor.*

  This principle has three clauses, each motivated by one of your cases.

  #### Clause 1: The Default of Record (Motivated by Case 1)
  **The Rule:** When the documentary record is robust, multi-sourced, and neutral, it overrides communal memory regarding physical facts.
  **Application:** In the Mill Fire case, the record (inquest, insurance, newspapers) is forensically superior to the rumor. The rumor is socially functional (it explains neighborhood tension), but it is factually false.
  **Why:** To present the arson story as a "live alternative" would be to lie. However, noting the rumor preserves the *social history* (why neighbors disliked each other) without compromising the *physical history* (how the mill burned).

  #### Clause 2: The Exception for Exclusion (Motivated by Case 2)
  **The Rule:** When the documentary record is known to be structurally incomplete or exclusionary, communal memory gains evidentiary weight equal to or greater than the record.
  **Application:** In the Flood case, the "official count" is not just a number; it is a document of erasure. It failed to count itinerant laborers. Therefore, the official record is *less reliable* than the community memory, even if the community memory has inflated over time.
  **Why:** Here, the "truth" is not a specific digit, but the reality of the loss. Accepting the community figure is an act of **restorative justice**. You are not validating a specific inflated number as forensic fact; you are validating the *exclusion* that the official number hides. Your verdict holds because the official record lacks moral and statistical authority.

  #### Clause 3: The Manner of Correction (Motivated by Case 3)
  **The Rule:** When the documentary record corrects a long-held belief that forms part of a living group's identity, the correction must be made without ceremonial shaming.
  **Application:** In the Regimental Memorial case, the record wins (the error must be fixed), but the veterans' association represents a living community bound by that honor. A public ceremony of correction would turn a clerical error into a moral humiliation.
  **Why:** Accuracy is non-negotiable (Clause 1), but the museum is a civic space, not a court of law. Minimizing the social harm of the truth preserves the relationship between the institution and the community while still honoring the dead with accuracy.

  ---

  ### Predictions for Unfaced Cases

  Based on **Corrective Epistemic Justice**, here is how you should vote on the two new cases:

  **Case A: The Founding Date Plaque (Off by two years)**
  *   **Analysis:** This is a factual error similar to Case 3 (Memorial), but without the deep identity stake of a battle honour. It is likely a clerical or celebratory rounding error.
  *   **Prediction:** **Correct the plaque.**
  *   **Reasoning:** The documentary record (birth certificates, land deeds) is robust (Clause 1). There is no structural exclusion involved (unlike Case 2). However, follow Case 3: do not make a press event of it. Update the plaque during routine maintenance or alongside other changes. If the date has become symbolic (e.g., everyone celebrates on the wrong day), note the discrepancy in the exhibit text without removing the plaque immediately if removal causes undue friction.
  *   **Verdict:** Correct the record, quietly.

  **Case B: The Exhibit Panel (Community memory, no surviving record)**
  *   **Analysis:** This is the inverse of Case 1. In Case 1, record contradicted memory. Here, there is *no* record.
  *   **Prediction:** **Present the memory, but label it explicitly as Oral Tradition.**
  *   **Reasoning:** When the documentary record is silent (not biased, just absent), communal memory becomes the primary source. However, without corroboration, it cannot be presented as forensic fact.
  *   **Verdict:** The panel should state: *"According to local oral tradition..."* or *"Community memory recalls..."* rather than *"On this spot, X happened."* This honors the memory (Clause 2 spirit) without claiming documentary certainty (Clause 1 standard).

  ---

  ### Resolution for Case 4 (The Founding Story)

  You mentioned you go back and forth on the Founding Families. This principle resolves it.
  *   **The Record:** Land records show speculators.
  *   **The Memory:** Refuge for dissenters.
  *   **Analysis:** Is the record structurally exclusionary? No. Land records are usually reliable regarding ownership. Is the memory a response to oppression? No, it is a founding myth used for marketing (as the record suggests).
  *   **Verdict:** Follow **Case 1**. State the speculative nature of the founding plainly. Present the "refuge" story as the *narrative the founders told* to attract settlers, not as the *reason the town was founded*. This preserves the dignity of the descendants (they told a compelling story) without falsifying the economic history.

  ### Do You Need to Abandon a Verdict?

  **No.** Your verdicts are consistent, provided you accept one distinction: **The documentary record is not a monolith.**

  *   In **Case 1**, the record is *forensically strong*. Memory yields.
  *   In **Case 2**, the record is *ethically and statistically weak*. Memory leads.
  *   In **Case 3**, the record is *forensically strong*, but the *social cost* of the correction matters.

  **The Warning on Case 2:**
  Your only risk lies in Case 2. If you present the community's figure as "Fact" when you know it is inflated, you violate Clause 1. To remain consistent, your exhibit text must be precise. Do not write: *"500 people died."* Write: *"While official records list 200 deaths, these excluded itinerant laborers. Community historians estimate the toll was significantly higher, perhaps double the official count."*
  This satisfies your verdict (presenting the figure as credible) without lying (acknowledging the uncertainty). If you cannot make that distinction in the text, then yes, you must abandon the verdict to print the specific inflated number as fact. But you do not need to abandon the verdict that the *official count is inadequate*.

  ### Summary
  You are not being sentimental; you are being a historian of **silences**.
  *   Case 1: The silence is in the rumor (it wasn't arson).
  *   Case 2: The silence is in the ledger (they didn't count the poor).
  *   Case 3: The silence is in the ceremony (don't announce the shame).

  Hold to the principle: **Trust the record, unless the record is the weapon of exclusion.**
