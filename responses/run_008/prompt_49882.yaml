          *   *Assessment:* This is a contentious philosophical claim. While some argue they are related (both involve easy knowledge/transmission issues), many prominent epistemologists distinguish them.
              *   *Dogmatism:* Often about known entailment and defeaters.
              *   *Bootstrapping:* Often about basic knowledge sources and circularity/confirmation.
              *   *Cohen's View:* Bootstrapping is a problem for externalism/reliabilism specifically regarding "easy knowledge."
