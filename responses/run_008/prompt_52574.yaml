answer: |-
  **Designer's Note: The Logical Space**
  Before scoring, understand the terrain. Goodhart failures cluster into five distinct mechanisms. The **Incentive Engineer** sees adversarial gaming; the cure is monitoring. The **Selection Skeptic** sees regression to the mean; the cure is humility. The **Proxy Ontologist** sees causal decoupling; the cure is better theory. The **Anti-Optimizer** sees systemic fragility; the cure is satisficing. The **Measured Optimist** sees correctable error; the cure is better statistics.

  **Hybrid Profile:** The "Pragmatic Dualist" scores high on both Engineer and Skeptic. They believe gaming and noise are distinct problems requiring separate toolkits (contracts *and* shrinkage). This is a stable, occupied position.
  **Unoccupied Combination:** The "Fatalist Optimist" believes metrics are fundamentally noisy (Skeptic) yet fully curable by normalization (Optimist). This slot is empty; it is incoherent to claim noise is inevitable yet removable.
  **Indistinguishable Pair:** The quiz cannot cleanly separate the Proxy Ontologist from the Anti-Optimizer. Both prescribe "stop optimizing this proxy," differing only on whether the cause is broken causality or excessive pressure. In practice, their verdicts overlap.

  ***

  **What Kind of Goodhart's Law Do You Believe In?**

  **1. The Sales Promotion**
  You promote the salesperson with the best quarter. Next year, their performance averages out. Why?
  A) They lost motivation after the bonus.
  B) The first quarter was statistical luck.
  C) The quota didn't measure relationship building.

  **2. The Pest Bounty**
  A government pays for rat tails. The rat population explodes. Why?
  A) Farmers are breeding rats for income.
  B) The count excludes underground nests.
  C) You shouldn't pay for body parts.

  **3. The University Ranking**
  Colleges hire consultants to boost ranking scores. Student learning stays flat. Why?
  A) Administrators are gaming the inputs.
  B) Rankings measure prestige, not education.
  C) Optimization pressure distorts priorities.

  **4. Hospital Wait Times**
  A hospital reduces reported wait times. Patient outcomes worsen. Why?
  A) Staff are hiding patients in hallways.
  B) Wait time is a noisy proxy for health.
  C) Targeting speed sacrifices care quality.

  **5. Algorithmic Hiring**
  An AI model filters resumes. Diversity drops, retention stays same. Why?
  A) The training data was biased.
  B) The model optimizes for retention, not merit.
  C) Automated hiring should be banned.

  **6. Fund Performance**
  A star investment fund crashes after five years of gains. Why?
  A) The manager took excessive risks to keep fees.
  B) Five-year track records are mostly noise.
  C) The strategy doesn't scale with capital.

  **7. Code Quality**
  Developers reduce bug counts after a metric is introduced. System stability drops. Why?
  A) Developers are hiding bugs in legacy code.
  B) Bug counts don't measure architectural debt.
  C) Metric pressure kills creative problem-solving.

  **8. Customer Satisfaction**
  Survey scores rise, but customer churn increases. Why?
  A) Staff are bribing customers for reviews.
  B) Surveys measure momentary mood, not loyalty.
  C) Chasing scores distracts from product fixes.

  **9. Safety Incidents**
  A factory reports zero incidents. A major accident occurs. Why?
  A) Workers are afraid to report minor issues.
  B) Accidents are rare, random events.
  C) A "zero incident" target is impossible.

  **10. The Fix**
  You must redesign the system. What is your primary tool?
  A) Stronger contracts and monitoring.
  B) Better normalization and stratification.
  C) Remove the target entirely.

  ***

  **Scoring Key**

  Tally your answers. While most questions offer three options, they map to the five positions below. Note which letter you chose most frequently.

  **Mostly A: The Incentive Engineer**
  You view Goodhart's Law as a principal-agent problem. Metrics fail because people cheat. Your solutions involve rotation, monitoring, and punishment. You believe Ravi is right: contracts matter more than philosophy.
  *Critique:* You may overlook failures where everyone is honest.

  **Mostly B: The Selection-Effects Skeptic**
  You see disappointment as statistical inevitability. Extremes regress to the mean; noise looks like signal. You believe Ravi's wife is partially right: measurement error is key, but you doubt normalization fixes everything.
  *Critique:* You may underestimate human ingenuity in gaming.

  **Mostly C: The Proxy Ontologist**
  You believe the metric was never the target. Optimization breaks the causal link between proxy and goal (e.g., test scores vs. learning). You want better theory, not better contracts.
  *Critique:* You may struggle to define unmeasurable goals.

  **Mostly "Remove Target" (Q3, Q4, Q5, Q7, Q9, Q10): The Anti-Optimizer**
  You believe optimization pressure itself is toxic. You prefer dashboards of unranked metrics and satisficing. You align with the Ontologist but focus on systemic pressure rather than causality.
  *Critique:* You may lack tools for necessary accountability.

  **Mostly "Better Stats" (Q1, Q5, Q8, Q10): The Measured Optimist**
  You believe Goodhart is curable. With stratification, shrinkage, and better instruments, metrics beat judgment. You side with Ravi's wife: measurement error is the villain, not the measure.
  *Critique:* You may overestimate the power of adjustment.

  **Hybrid Profile: The Pragmatic Dualist**
  If you split evenly between **A (Engineer)** and **B (Skeptic)**, you hold a robust view: gaming and noise are distinct failures requiring distinct fixes. You monitor cheaters *and* adjust for regression. This is the most operationally resilient position.

  **Unoccupied Profile: The Fatalist Optimist**
  If you found yourself choosing "It's noise" (Skeptic) but also "Stats fix it" (Optimist) consistently, you occupy an unstable slot. If noise is fundamental, normalization cannot fully cure it. This combination is theoretically incoherent.

  **Diagnostic Limitation**
  This quiz cannot cleanly separate the **Proxy Ontologist** from the **Anti-Optimizer**. Both groups frequently select "Remove the target" or "Metric is wrong" across scenarios. The distinction lies in *why*: the Ontologist cites broken causality; the Anti-Optimizer cites systemic fragility. In organizational practice, however, their recommendations converge: stop optimizing the proxy.
