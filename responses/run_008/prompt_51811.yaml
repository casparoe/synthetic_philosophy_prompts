  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain Aumann's theorem correctly? Yes: Same Priors + Common Knowledge of Posteriors -> Agreement.
      *   *Check:* Did I address the "pooled information" vs "compromise" distinction? Yes, this is about the sufficiency of statistics. A posterior is not a sufficient statistic for the private information that generated it, usually.
