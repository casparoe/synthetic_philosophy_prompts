answer: |-
  **Setup and materials**
  Divide the 12 students into two teams (Alpha and Beta). You need: 20 index cards, 4 envelopes, pens, a whiteboard for scoring, and a stash of candy (or extra credit points) as currency. Arrange chairs so teams face each other. You are the Banker and Judge. The goal is to accumulate points by successfully endorsing claims. The critical constraint: In Rounds 1 and 2, the word "true" and all semantic equivalents (accurate, correct, fact, reality) are banned from speech and writing.

  **The rounds**
  **Round 1: Direct Verification (10 minutes)**
  Team Alpha writes five simple empirical claims on cards (e.g., "The door is closed," "2+2=4"). They hand them to Team Beta. Beta must endorse each claim to earn points. To endorse, a Beta member must read the card and assert its validity without using the T-word.
  *Constraint:* They must say the sentence itself or negate it. If they say "It is true that the door is closed," they lose a point. They must say "The door is closed."
  *Goal:* Show that for specific sentences, "true" is redundant. You can just assert the sentence.

  **Round 2: The Blind Envelope (15 minutes)**
  Team Alpha writes a sentence on a card, seals it in an envelope, and places it on the table. They tell Beta: "Everything inside this envelope is reliable." Team Beta must now commit to the contents *without opening the envelope* to earn a large point bonus. They must formulate a single sentence that endorses the unknown content.
  *Constraint:* The T-word ban remains.
  *Goal:* They will struggle. They cannot list the sentence (they don't know it). They need a generalizing device. If they say "I endorse the content," pause and ask if "endorse" differs from "true." If they fail to formulate a generalization, they get no points. This creates the functional need for the truth predicate.

  **Round 3: The Crash (10 minutes)**
  Lift the ban. Team Alpha writes two cards and places them face up. Card A: "Card B is false." Card B: "Card A is true." Team Beta must assign a truth value (True/False) to both cards simultaneously to win the final jackpot. They have 5 minutes to consensus.
  *Goal:* They will fail. Any assignment leads to contradiction. The device that saved them in Round 2 breaks here.

  **Payoffs and scoring**
  Use candy as immediate feedback.
  *   **Round 1:** 1 piece per successful direct endorsement. (Easy money).
  *   **Round 2:** 5 pieces per team member *if* they successfully formulate a blind endorsement. If they cannot, zero. This creates the "stakes": without the logical utility of truth, they cannot access the value inside the envelope.
  *   **Round 3:** 10 pieces each if they solve the paradox. (They won't). If they declare it unsolvable, give them 1 piece each for "intellectual honesty."
  *   **Penalty:** If anyone slips and uses "true" or "accurate" in Rounds 1 or 2, the whole team loses 2 points. This enforces the constraint strictly.

  **Debrief**
  Spend the final 15 minutes mapping the game to the theory.
  1.  **Round 1 = Redundancy:** Ask why Round 1 was easy. Map this to Frege's claim: "It is true that snow is white" says no more than "Snow is white." The predicate adds no property.
  2.  **Round 2 = Generalization:** Ask why Round 2 was hard. Map this to Quine's point: We need "true" not to describe the world, but to generalize over sentences we cannot list (blind endorsement). The word isn't a property name; it's a logical tool for infinite conjunctions. When they tried to say "I endorse the content," highlight that they just reinvented the truth predicate. This *is* the deflationist lesson: truth *is* that device.
  3.  **Round 3 = Expressive Completeness:** Why did the tool break? Deflationism accepts that if a language is strong enough to generalize (Round 2), it is strong enough to refer to itself (Round 3). The paradox isn't a deep metaphysical mystery; it's a bug in the logical utility. The vertigo they felt is the cost of having a useful language.

  **Predictable failures and fixes**
  *   **The Synonym Loophole:** In Round 2, students will say "The content is correct" or "I affirm the envelope."
      *   *Fix:* Do not penalize this. Instead, highlight it during Debrief. Ask: "What work is 'correct' doing here?" If it allows blind endorsement, it functions exactly as "true." This confirms the deflationist view: any word doing that job *is* the truth predicate. It's not a bug; it's proof that the function is unavoidable.
  *   **Round 3 Silence:** Students may refuse to play the Liar round, sensing a trap.
      *   *Fix:* Insist they must assign values to win the points. Force the contradiction. The failure is the data point.
  *   **Time Creep:** Round 2 can drag.
      *   *Fix:* Hard stop at 15 minutes. If they haven't formulated the sentence, they lose. The frustration is part of the lesson.

  **What the game can't do**
  This activity demonstrates the *functional* utility of the truth predicate and its logical risks, but it cannot prove the *metaphysical* claim that truth isn't a property. Students might leave thinking, "Okay, 'true' is useful for generalization, but doesn't it still correspond to reality?" The game shows why we need the word, not why the property doesn't exist. You must explicitly state this limitation at the very end: "We felt why we need the word, but deflationism goes further—it says there's nothing else *to* truth besides this utility. That step requires philosophical argument, not just a game."
