          2.  *Malkovich Entering His Own Portal:* Is this the regress problem (turtles all the way down)? Or is it a Same-Order/Self-Representational view (Kriegel) where 1st and 2nd order collapse? Is the "Malkovich restaurant" a horror show of pure self-awareness?
          3.  *The Ending:* Craig is trapped in a body (needs correction on whose body). He is a paralyzed witness. Is this conscious by HOT criteria? Awareness without agency/reporting?
