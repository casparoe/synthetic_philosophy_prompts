  2.  **Fact-Check the Plot (Crucial Step):**
      *   *User's memory:* "Craig ends up trapped inside his daughter's ex-hostage-taker's daughter."
      *   *Actual Plot:* Craig Schwartz ends up trapped inside **Emily**, the daughter of **Maxine** and **John Malkovich**. Wait, let's verify.
