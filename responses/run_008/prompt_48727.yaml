      *   *User's Hunch:* It's an artifact of conflating observation/estimator, or just human talk.
      *   *My Assessment:* The user's hunch is *partially* right but misses the normative dimension. A robot *can* be Moorean, but not in the way they think.
      *   *The "Defect":* It's not a defect in the vocabulary, but a limitation in the architecture. Standard estimators treat belief as an *object* to be observed. Human belief is *constitutive* of the assertion.
