      *   *Section 2: Residue.* Highlight the "Observation vs. Constitution" gap.
      *   *Section 3: The Verdict.* This is the most important part.
          *   Can the robot be Moorean? No.
          *   Why? Because the robot's "I believe" is a report on its state $P(x|z)$. A human's "I believe" is an expression of commitment.
          *   Is the vocabulary defective? It's specialized. It's not defective for robotics, but it assumes a "view from nowhere" (objective observer of self) which precludes the "view from here" (subjective agent).
