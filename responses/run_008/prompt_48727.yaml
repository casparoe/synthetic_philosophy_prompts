  2.  **Deconstruct Moore's Paradox (Philosophical Core):**
      *   *The Sentences:*
          *   Omissive: $p \land \neg Bp$ ("Rain, but I don't believe rain").
          *   Commissive: $p \land B\neg p$ ("Rain, but I believe not-rain").
      *   *The Puzzle:*
          *   Logically consistent: $p$ can be true while $Bp$ is false.
          *   Pragmatically absurd: Asserting it seems irrational/self-defeating.
          *   Indexicality: Works in 1st person present ("I believe"), fails in 3rd person ("He believes") or past tense ("I believed").
      *   *Explanations:*
          *   *Pragmatics (Grice):* Asserting $p$ implies you believe $p$. So asserting $p \land \neg Bp$ implies $Bp \land \neg Bp$.
          *   *Doxastic Logic (Hintikka):* Belief is transparent to the believer. If you believe $p$, you believe you believe $p$.
          *   *Expressivism (Wittgenstein):* "I believe" isn't a report on an internal state; it's an expression of the state itself (like a cry of pain).

  3.  **Translate to Engineering Vocabulary (Task 1):**
      *   *Belief:* Posterior distribution $P(x|z)$.
      *   *Truth:* Ground state $x_{true}$.
      *   *Assertion:* Outputting a estimate $\hat{x}$ or a probability.
      *   *Omissive:* $x_{true} = \text{rain} \land P(\text{rain}|z) < \text{threshold}$.
      *   *Commissive:* $x_{true} = \text{rain} \land P(\neg \text{rain}|z) > \text{threshold}$.
      *   *Consistency:* Perfectly possible for estimator to be wrong (high loss).
      *   *Absurdity:* Where is it? In the *act of outputting* the statement while holding the state.
      *   *Tense/Person:* 3rd person = Telemetry log (consistent). 1st person = Current control loop state.

