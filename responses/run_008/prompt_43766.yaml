answer: |-
  **The Debate in Trading Vocabulary**

  **Frequentism:** Probability is solely the long-run hit rate on your calibration spreadsheet. A single match has no probability; only the portfolio does. If you price 10,000 events at 2.00 and the strike rate isn't 50%, your model is broken. You cannot speak of the chance of *this* Super Bowl, only the performance of your pricing engine over infinite repetitions. Single-event pricing is merely a placeholder for aggregate validation. CLV is irrelevant unless it correlates to long-term ROI.

  **Subjectivism (Bayesianism):** Probability is your limit price. It is the degree of belief encoded in the line you're willing to defend. If you lay 1.50, that is your probability. When team news breaks and you drift to 1.60, you've updated your belief; there is no external truth, only information states. The market price is the liquidity-weighted consensus of these beliefs. Sharp money isn't "correcting" the price to reality; it's forcing lazy bookmakers to align their beliefs with better information. The overround is simply the cost of transacting subjective uncertainty.

  **Propensity:** Probability is a physical property of the fixture, independent of the market or history. There is a "true price" inherent in the team strengths, pitch conditions, and referee assignment, even if this exact match never repeats. A steam move isn't just liquidity shifting; it's the market converging on this ontological reality. When a whale hits your price, they aren't just expressing belief; they're exploiting the gap between your subjective line and the event's actual propensity to occur.

  **Residue Report**

  Your hypothesis is operationally sound but ontologically glib.

  **Clean Maps:**
  1.  **Subjectivism ↔ Market Making:** You are correct. Bookmaking is pure subjectivism. Your prices are offers based on current information and risk exposure. You don't need "true" probability; you need a book that balances liability. The market price is indeed public degrees of belief, adjusted for liquidity.
  2.  **Frequentism ↔ Performance Review:** Your calibration sheets are frequentist tools. You validate subjective prices against empirical frequencies. If your 33% shots hit 40% over a season, you adjust. This is the only place frequentism lives in your world: post-trade analysis.

  **Bent Fits:**
  1.  **Propensity ↔ "True Odds":** Traders talk about "true odds," but usually mean "efficient market price" or "model output," not metaphysical propensity. You treat the true price as a target for CLV, but you don't need it to *exist* physically, only to be exploitable. The propensity theorist insists the chance is *in the match*. You insist the chance is *in the model*. When you say a steam move is "convergence," you're using propensity language, but you'd accept it's just better information (subjectivism) if the P&L holds.

  **No Counterpart:**
  1.  **Single-Case Objective Chance:** This is the philosophical residue with no trading equivalent. Philosophers argue whether a single coin toss *has* a probability. You don't care. You price it, hedge it, or lay it. Whether the chance is real or just a useful fiction doesn't impact your hedge ratio.
  2.  **Unique Events:** Frequentism technically breaks here. The exact conditions of a specific match never repeat. Traders ignore this philosophical hurdle by assuming stationarity (that past data applies to the present). Philosophers argue this assumption is unjustified; traders know it's necessary to open the book.

  **Verdict:**
  You settled this pragmatically, not theoretically. You operate as a **Subjectivist** during pricing (setting lines based on belief/info), a **Frequentist** during review (validating via hit rates), and a **Propensity realist** only when hunting value (assuming the market can be wrong about a "true" price).

  The philosophers' conflict matters to you only where risk management meets model confidence. If you treat probability as purely subjective, model risk is just belief error. If you treat it as propensity, model risk is measurement error. The leftover confusion isn't in your world; it's in theirs. They're arguing about what the number *is*; you're arguing about whether the number beats the close. They want truth; you want edge. That's why the debate feels familiar but unresolved—you use all three tools depending on whether you're pricing, hedging, or auditing.
