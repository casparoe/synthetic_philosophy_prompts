prompt: |-
  My friend and I got into a marathon argument last weekend (like five hours, we ordered a second pizza) about longtermism and I'm still chewing on it. She's a strong longtermist -- not the watered-down "the future matters a bit" version, but the view that, because there could be so many people in the future, reducing existential risk basically swamps every other moral consideration, and that things like global poverty just don't compare in scale. I pushed back on a bunch of fronts and she had answers for all of them, some of which I honestly couldn't rebut on the spot. Rather than re-argue it with her I want to actually get my head straight about where the real weak points are.

  For context on who's asking: I'm a mid-30s software engineer, no kids, could realistically either donate a big chunk of income, try to switch into some kind of AI safety or biosecurity work, or just keep living my normal life and stop thinking about this. So the prioritization I care about is practical-slash-personal, not "what should academia work on next."

  Here's what I want: of the open questions in this debate -- and I'll list a few we hit but don't feel bound to them -- which ones actually matter for a decision like mine, and which are academic in the bad sense, where even settling them wouldn't change what I should do? The ones we hit were: whether we're just clueless about the long-run effects of anything we do (she granted this more than I expected but said it cuts both ways); whether person-affecting views are right, i.e., whether preventing people from existing can even be bad for them; whether the far future is actually likely to be good rather than a vast mediocre or bad thing that we'd be helping to perpetuate; whether "existential risk" lumps together qualitatively different things (permanent collapse that might be recoverable vs. true extinction vs. locking in bad values forever); and whether expected-value reasoning just breaks at these tiny-probability-huge-payoff scales, including the kind of case where you'd have to take a deal that's almost certainly worthless for a one-in-a-billion shot at astronomical value.

  So rank the open questions for me, and defend the ranking. What I mean by defend: tell me which of these is upstream of the others (e.g., is cluelessness the thing that everything else quietly depends on?), which are tractable in the sense that ordinary reasoning and evidence could move them in my lifetime rather than needing new physics or a solved population ethics, and which are neglected not because they're unimportant but because nobody's incentivized to work on them. And for the ones you'd deprioritize for my purposes, say whether that's because they don't matter for the decision or because no realistic update on them would change my options.

  Also, maybe more useful than the ranking itself: what evidence or arguments, over the next few years, should I be watching for that would most change where this all lands? Like, what would make even a fairly committed longtermist say "okay, actually donate to bednets instead," and what would make a skeptic like me flip?

  Two housekeeping things: please write in American English (I've been reading too much British EA writing and it's messing with me, "whilst" needs to leave my vocabulary), and don't give me a reading list -- assume I can't look anything up, just explain the ideas inline as you go.
