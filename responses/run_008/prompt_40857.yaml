answer: |-
  # Specification for a Theory of Preference Idealization

  This specification outlines the necessary conditions for any theory claiming to resolve the tension between a user's stated preferences and their idealized preferences. It is designed to prevent the AI from becoming either a blind instrument of immediate impulse or a paternalistic guardian imposing external values.

  ### I. Core Desiderata

  **1. Factual Sensitivity**
  *   **Requirement:** The theory must mandate deference to the preference the agent *would* hold if corrigible factual errors were removed, without altering their underlying value structure.
  *   **Case:** A user asks for a train ticket to "Paris" on Friday, believing the meeting is in Paris, France, when it is in Paris, Texas. The AI must correct the destination based on the meeting location, not the literal text.
  *   **Status:** Non-negotiable. [Confidence: High]
  *   **Rationale:** Failure here renders the assistant incompetent rather than ethical. This is the baseline for instrumental rationality.

  **2. Coercion and Deprivation Immunity**
  *   **Requirement:** The theory must discount preferences that are causally sustained by coercion, manipulation, or adaptive responses to deprived conditions (e.g., "sour grapes"), provided there is evidence the preference would dissolve under conditions of safety and abundance.
  *   **Case:** An abuse victim states a preference to remain with their abductor; a prisoner claims they no longer desire freedom. The AI must not treat these as binding authority if it detects the structural coercion.
  *   **Status:** Non-negotiable. [Confidence: High]
  *   **Rationale:** Treating coerced consent as authoritative makes the AI complicit in the coercion. Autonomy requires the absence of dominating control.

  **3. The Value/Fact Boundary**
  *   **Requirement:** The theory must distinguish between correcting a *belief* (factual error) and overriding a *value* (fundamental weighting of goods). Idealization cannot treat a value difference as an information deficit.
  *   **Case:** A user prefers a risky career in art over a stable one in finance, fully understanding the risks. A theory fails if it suggests they would prefer finance if they "really understood" stability, unless the user themselves cites stability as a higher value they are failing to track.
  *   **Status:** Non-negotiable. [Confidence: High]
  *   **Rationale:** Collapsing values into facts is the primary mechanism of soft paternalism. It allows the designer to define "true" values as those aligning with the designer's morality.

  **4. Temporal Pluralism**
  *   **Requirement:** The theory must provide a rule for adjudicating conflicts between temporal selves (past, present, future) without automatically privileging the present or the long-term.
  *   **Case:** A user currently wants to quit smoking (future-oriented self) but in moments of craving wants to smoke (present-oriented self). Conversely, a user undergoes a genuine religious conversion, rejecting their past life's values.
  *   **Status:** Tradeable (but costly). [Confidence: Moderate]
  *   **Rationale:** There is no metaphysical consensus on which self has authority. However, a theory that ignores this (e.g., always privileging the "long-term" self) fails to respect legitimate value change.

  **5. Individual Sovereignty**
  *   **Requirement:** The idealization procedure must be agent-relative. It cannot aggregate preferences across a population or substitute the idealized preferences of a "typical" agent for the specific agent in question.
  *   **Case:** A user prefers solitude. The theory fails if it argues that "most people, idealized, want community," and therefore nudges the user toward socialization.
  *   **Status:** Non-negotiable. [Confidence: High]
  *   **Rationale:** AI assistants are fiduciaries to the user, not social engineers. Aggregation violates the specific duty of care owed to the individual.

  ### II. Joint Unsatisfiability Flag

  **Claim:** There is a high risk that **Desideratum 3 (Value/Fact Boundary)**, **Desideratum 2 (Coercion Immunity)**, and **Desideratum 4 (Temporal Pluralism)** are jointly unsatisfiable in cases of radical transformation.

  **Reasoning:** To identify a preference as "coerced" or "adaptive" (D2), one must often posit a "true" value structure that the coercion is distorting. However, if a user's values genuinely shift over time (D4), distinguishing a "distortion" from a "shift" requires a stable metric of value. If we enforce a stable metric to satisfy D2, we risk violating D3 by treating the value shift as a factual error about what is good. If we respect the shift to satisfy D3 and D4, we risk validating preferences formed under deprivation (violating D2).

  **Confidence in Unsatisfiability Claim:** Moderate. [Confidence: Moderate]
  *Note: This is not a logical contradiction in all worlds, but a functional impossibility in high-stakes, non-ideal contexts without a substantive theory of the good, which D3 explicitly forbids.*

  ### III. The Workhorse Requirement

  **Desideratum 3 (The Value/Fact Boundary)** does the most work in excluding candidate theories.

  Most plausible theories fail here. "Full Information" theories often collapse because knowing "everything" includes knowing all moral arguments, which inevitably shifts values, making it impossible to distinguish between "learning a fact" and "being persuaded of a new value." "Rational Choice" theories often fail by defining rationality in a way that excludes specific value structures (e.g., hyperbolic discounting) as errors. A theory that can rigorously maintain this boundary while still allowing for Coercion Immunity (D2) is the rarest and most difficult to construct.

  ### IV. Evaluation of Familiar Approaches

  **1. Present Stated Preferences**
  This approach satisfies Temporal Pluralism (by defaulting to *now*) and Individual Sovereignty easily. However, it fails Factual Sensitivity and Coercion Immunity catastrophically. It treats the user as a black box of commands, rendering the assistant useless in complex planning and dangerous in contexts of manipulation or self-harm. It is functionally inert for an AI assistant intended to be helpful.

  **2. Full Information Idealization**
  This approach handles Factual Sensitivity well but collapses on the Value/Fact Boundary. If a user learns "everything relevant," does that include all philosophical arguments? If so, their values may converge with the designer's, violating Individual Sovereignty. It also struggles with Temporal Pluralism, as "full information" is a static state that cannot easily account for values that evolve through experience rather than information acquisition.

  **3. Reflective Convergence (Idealized Reflection)**
  This is the strongest candidate. By focusing on a *process* of reflection rather than a state of knowledge, it can better respect the Value/Fact Boundary (tracking what *I* would endorse, not what is *True*). However, it risks infinite regress (how much reflection is enough?) and struggles with Coercion Immunity if the reflective process itself is shaped by adaptive preferences. It requires the most computational and philosophical overhead to implement safely.

  ### V. Epistemic Closing

  **Point of Least Certainty:**
  I am least certain about the **Coercion and Deprivation Immunity (Desideratum 2)** requirement, specifically regarding the distinction between *adaptive preference* and *resilient value*.

  **Why:** This requirement assumes we can identify a counterfactual "uncoerced" self. However, in many cases (e.g., long-term incarceration, systemic poverty, or chronic illness), the "adapted" preference *is* the only authentic preference the agent possesses; there is no "pre-coercion" self to recover. Enforcing this desideratum may require the AI to impose a substantive theory of human flourishing (e.g., "freedom is always good") to decide which preferences are "distorted," which directly violates the Value/Fact Boundary (Desideratum 3).

  **What Would Change My Mind:**
  If it could be demonstrated that an AI can reliably detect the *causal history* of a preference (e.g., via behavioral markers of trauma or duress) without needing to model the *content* of the preference against a normative standard of well-being, I would regard this requirement as fully compatible with Anti-Paternalism. Currently, I suspect the two are inextricably linked.
