answer: |-
  Your suspicion is well-founded. Your cousin has constructed an argument that reaches a sensible practical conclusion (avoid active management) but uses a chain of reasoning that is theoretically shaky and potentially dangerous for your long-term financial health.

  The summary mixes a standard definition of market efficiency with a specific, narrow game-theory result (Milgrom–Stokey), then extrapolates that result far beyond its intended scope. A financial economist would agree with the *spirit* of the advice (index funds are usually better) but would strongly object to the *logic* used to get there, particularly the claim that prices are untrustworthy.

  Here is a claim-by-claim breakdown of your cousin's summary.

  ### Claim 1: "If markets are informationally efficient, prices already reflect everything that is known."
  *   **Economist's View:** **Mostly Accepted.**
  *   **Nuance:** This is the standard definition of the **Efficient Market Hypothesis (EMH)**. However, economists distinguish between weak, semi-strong, and strong forms. "Everything that is known" usually implies *publicly* known information. If prices reflected *private* information perfectly, no one would bother gathering private information (a paradox known as Grossman–Stiglitz).
  *   **For You:** This is a safe assumption to work with. It means you shouldn't expect to beat the market by reading the news, because the news is already in the price.

  ### Claim 2 & 3: "The Milgrom–Stokey no-trade theorem... [shows] rational traders can never profit from private information: the moment they attempt to trade on it, the attempt itself reveals the information to the other side, and the expected profit evaporates."
  *   **Economist's View:** **Technically True in Theory, Misleading in Practice.**
  *   **The Theorem:** The Milgrom–Stokey theorem (1982) is a famous result in financial theory. It states that if two traders are rational, share the **same prior beliefs** (common priors), and know that the other is rational, they will not trade purely based on speculative information. If one offers to trade, the other realizes, "They must know something I don't," and adjusts their price accordingly until the profit opportunity disappears.
  *   **The Misstatement:** The theorem relies on extremely strict assumptions that do not hold in the real world. Specifically, it assumes **common priors**. In reality, traders have different models, different data, and different interpretations of the world (heterogeneous priors).
  *   **Why it matters:** Because people disagree on *how* to interpret information, trade *does* happen, and informed traders *do* profit (otherwise, there would be no incentive for analysts to work). The theorem explains why trade is theoretically puzzling, not why it is impossible.
  *   **For You:** Your cousin uses this to say "active trading is futile." While it is *difficult* to profit from private information, the theorem does not prove it is mathematically impossible in the real world. However, for a non-professional, the practical outcome is the same: you are unlikely to be the informed trader.

  ### Claim 4: "So all actual trading must be either irrational or driven by non-informational needs like liquidity and hedging..."
  *   **Economist's View:** **Partially Accepted.**
  *   **Nuance:** Economists agree that a vast amount of trading volume is indeed driven by liquidity needs (e.g., a pension fund rebalancing, an investor needing cash for a house) or hedging (e.g., an airline buying oil futures). This is often called "noise trading" in academic literature.
  *   **The Misstatement:** Labeling the remainder as "irrational" is too strong. Much trading is driven by **differences of opinion**, not irrationality. Two rational people can look at the same data and come to different valuation conclusions. That is not irrationality; it is diversity of thought.
  *   **For You:** It is true that you shouldn't trade just to trade. Most turnover is indeed liquidity-driven. This supports the case for low-turnover index funds.

  ### Claim 5: "...and the enormous daily volume of the stock market is therefore evidence that prices are driven by noise rather than knowledge."
  *   **Economist's View:** **False / Non-Sequitur.**
  *   **Nuance:** High volume does not prove prices are noise. Prices are a mechanism for aggregating knowledge. Even if 90% of trades are liquidity-driven, the remaining 10% (the informed traders) are sufficient to push prices toward their fundamental value. This is the core insight of Kyle (1985) and other market microstructure models: a small amount of informed trading can make prices highly informative.
  *   **For You:** This is a critical error in your cousin's logic. High volume does not mean the price is wrong. It just means many people are exchanging ownership for reasons other than changing their view of the company's value.

  ### Conclusion: "It follows that prices cannot be trusted as a measure of what anything is really worth."
  *   **Economist's View:** **Dangerous and Contradictory.**
  *   **The Flaw:** This conclusion contradicts the premise of investing in an index fund. If prices are "noise" and cannot be trusted as a measure of worth, then buying an index fund (which buys assets at current market prices) is buying a basket of random noise.
  *   **The Consensus:** While prices are not *perfect* (bubbles and crashes happen), they are the **best available unbiased estimator** of value. For an investor, "trust" doesn't mean "believe the price is perfect forever." It means "believe the price is the fairest starting point."
  *   **For You:** If you accept your cousin's conclusion, you cannot invest at all. If prices are meaningless, you cannot know if the market is cheap or expensive. The prudent view is that prices are *mostly* right, and trying to prove them wrong (active management) is expensive and risky.

  ### Summary: Where the Cousin is Right vs. Wrong

  | Claim | Verdict | Practical Implication for You |
  | :--- | :--- | :--- |
  | **Markets are efficient** | **Mostly True** | Don't try to beat the market using public news. |
  | **Milgrom-Stokey Theorem** | **True in Model, False in Reality** | Don't use this as proof that trading is impossible; use it to understand why trading is *competitive*. |
  | **Trading is mostly liquidity** | **Mostly True** | Avoid high-turnover strategies; they generate fees without adding value. |
  | **Prices are just noise** | **False** | **Do not ignore prices.** They are your best guide to value. |
  | **Active management is pointless** | **Mostly True (for you)** | For a non-professional, the costs of active management usually outweigh the benefits. |

  ### The "Technically True but Misleading" Trap
  Your cousin has fallen into a trap common among quantitatively trained professionals: **confusing a model with reality.**

  The Milgrom-Stokey theorem is technically true *within its own mathematical assumptions*. However, those assumptions (specifically that all traders start with the same prior beliefs) are known to be false in the real world. Using a theorem that assumes "no one disagrees" to explain a world defined by disagreement is misleading.

  **Why this matters for your inheritance:**
  1.  **The Cousin's Goal:** He likely wants to steer you toward index funds (passive investing). This is generally excellent advice for an inheritor of a "modest sum."
  2.  **The Cousin's Logic:** He argues you should do this because *prices are meaningless*.
  3.  **The Risk:** If you believe prices are meaningless, you might be tempted to try to "find real value" yourself (stock picking) or wait for the "noise" to clear (market timing). Both are wealth-destroying behaviors.

  ### Final Recommendation
  A careful financial economist would tell you:
  *   **Accept:** That beating the market after fees is statistically unlikely for non-professionals.
  *   **Accept:** That much trading volume is noise/liquidity, which creates costs (spreads, fees) that eat into returns.
  *   **Reject:** The idea that prices are untrustworthy. Prices are the best consensus estimate of value we have.
  *   **Action:** Buy the low-cost index fund. Not because prices are noise, but because prices are **fair**, and the index fund allows you to capture the market's return without paying active managers to try (and usually fail) to find mispricings.

  Your cousin is right about the *decision* (choose the index fund), but wrong about the *reason* (prices are noise). Trust the prices enough to buy the market, but trust the statistics enough to know you can't beat it.
