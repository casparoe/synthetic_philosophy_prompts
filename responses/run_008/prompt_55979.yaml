      *   *Inseparable:* PSC (Monophyly) vs. PSC (Diagnosability) often require technical knowledge to split. ESC vs. Cohesion is also very tight. I need to flag this.

  6.  **Drafting the Content (incorporating the "Expert" persona):**
      *   Tone: Rigorous but accessible.
      *   Structure: Clear branching.
      *   Glosses: Accurate philosophical summaries.

  7.  **Review against Constraints:**
      *   *Start:* Shared realism? Yes, intro text establishes this.
