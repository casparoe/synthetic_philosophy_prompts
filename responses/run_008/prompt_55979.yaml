          *   *Node 2 (The Time Test):* Focus on ancestry. If a population gradually transforms, does the original species name travel with it?
          *   *Node 3 (The Exchange Test):* Focus on gene flow vs. distinctness. If genes swap but forms stay distinct, what matters?
          *   *Node 4 (The Diagnosis Test):* Focus on observability. If we can't tell them apart, are they still different?

  3.  **Mapping Paths to Concepts:**
      *   *Path A (Universal + Diachronic + Cohesion):* Evolutionary Species Concept (ESC) / Cohesion.
      *   *Path B (Sexual Only + Synchronic + Interbreeding):* Biological Species Concept (BSC).
      *   *Path C (Universal + Synchronic + Diagnosis):* Phylogenetic Species Concept (PSC - Diagnosability).
      *   *Path D (Universal + Synchronic + Ecology):* Ecological Species Concept (EcSC).
      *   *Path E (Pluralism):* Acknowledging different answers for different cases.

  4.  **Developing the Questions (The "Blind" Aspect):**
      *   *Q1:* Instead of "Do you care about asexuals?", ask: "Consider the Bdelloid Rotifers (no sex for 40M years). If we found a new variant, would you say 'New Species of Rotifer' is a meaningful claim, or is 'Species' the wrong word entirely?"
