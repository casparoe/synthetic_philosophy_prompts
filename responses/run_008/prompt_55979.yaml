answer: |-
  # The Species Concept Diagnostic
  **Instructions:** Answer the following four questions based on your intuition about the *case described*. Do not worry about which biological theory you think you "should" support. There are no wrong answers, only different commitments.

  ### START: The Realist Commitment
  *We begin with the agreement that species are real, mind-independent units of nature. There is a fact of the matter about how many species of Galápagos finch exist, independent of what we call them.*

  ---

  ### QUESTION 1: The Asexual Constraint
  **Case:** *Bdelloid rotifers* are microscopic animals that have reproduced asexually (cloning) for 40 million years. They show distinct variations in morphology and habitat.
  **Question:** Is the claim "This rotifer belongs to a different species than that one" **meaningful**, or is the word "species" simply the wrong tool for asexual life?

  *   **(A) Meaningful:** Asexual lineages can definitely be distinct species. → *Go to Q2*
  *   **(B) Wrong Tool:** "Species" implies reproduction; apply a different term (like "strain") to asexuals. → *Go to Q3*

  ---

  ### QUESTION 2: The Temporal Constraint
  **Case:** Consider the lineage from *Homo erectus* to *Homo sapiens*. Assume the change was gradual, with every generation able to breed with the next.
  **Question:** Did *Homo erectus* **go extinct** when it evolved into us, or did the species **persist** and simply change its traits over time?

  *   **(A) Persisted:** It is the same lineage/species, just modified. → *Go to Q4*
  *   **(B) Went Extinct:** *H. erectus* is a distinct unit that ended; we are a new unit. → *Go to Q4*

  ---

  ### QUESTION 3: The Cohesion Constraint
  **Case:** Wolves and Coyotes frequently hybridize and produce fertile offspring, yet they remain morphologically and ecologically distinct in the wild.
  **Question:** Does the fact that they exchange genes make them **one species**, or does their distinctness keep them as **two**?

  *   **(A) One Species:** Actual gene flow unifies them; boundaries are porous. → *Leaf I*
  *   **(B) Two Species:** Distinctness matters more than the swapping of genes. → *Go to Q4*

  ---

  ### QUESTION 4: The Epistemic Constraint
  **Case:** Two populations of frogs never interbreed in nature (they are reproductively isolated), but they look identical and share 99.9% of their DNA (cryptic species).
  **Question:** Are they **two species already**, or do they become two species only when we find a **diagnostic trait** to distinguish them?

  *   **(A) Two Species Already:** The isolation is real, even if we can't see it. → *Leaf II*
  *   **(B) Only When Distinguishable:** If we can't diagnose the difference, the species boundary is not scientifically established. → *Leaf III*

  ---

  ### QUESTION 5: The Scope Check (Meta-Question)
  *(Ask this of yourself regardless of which Leaf you reached)*
  **Question:** Does the logic you just followed apply equally to **bacteria**, **fossils**, and **sexual animals**?

  *   **(Yes):** You are a **Concept Monist**. (You believe one definition captures reality everywhere).
  *   **(No):** You are a **Concept Pluralist**. (You believe different groups require different species definitions).

  ---

  ### THE LEAVES: Where Your Intuitions Landed

  #### Leaf I: The Biological / Cohesion Concept
  *   **Path:** Q1(B) OR Q1(A)+Q3(A)
  *   **Gloss:** Species are reproductive communities; what holds them together is the actual or potential exchange of genes.
  *   **Metaphysics:** Species are **Individuals** (causally integrated units).
  *   **Note:** If you answered Q1(A) *and* Q3(A), you hold a **Cohesion** view (ecological or genetic cohesion unifies asexuals and sexuals). If Q1(B), you hold a strict **Biological Species Concept (BSC)**.

  #### Leaf II: The Evolutionary Species Concept (ESC)
  *   **Path:** Q1(A) + Q2(A) + Q4(A)
  *   **Gloss:** Species are lineages evolving separately from others with their own unitary evolutionary role and tendencies.
  *   **Metaphysics:** Species are **Lineages** (diachronic historical entities).
  *   **Note:** This view allows species to persist through gradual change (anagenesis) and applies to asexuals.

  #### Leaf III: The Phylogenetic Species Concept (PSC)
  *   **Path:** Q1(A) + Q2(B) + Q4(B)
  *   **Gloss:** Species are the smallest diagnosable clusters of organisms within which there is a parental pattern of ancestry and descent.
  *   **Metaphysics:** Species are **Classes** (defined by shared derived traits) or **Minimal Lineages**.
  *   **Note:** This view prioritizes "splitting" (cladogenesis) and requires observable differences.

  #### Leaf IV: The Ecological Species Concept (EcSC)
  *   **Path:** Q1(A) + Q3(B) + [Implicit reliance on niche]
  *   **Gloss:** Species are defined by their adaptive zone; distinctness is maintained by selection, not just gene flow.
  *   **Metaphysics:** Species are **Individuals** (unified by selection pressures).
  *   **Note:** If you chose Q3(B) because "they live differently," you lean Ecological. If because "they look different," you lean Phylogenetic.

  #### ⚠ Empty Cell: The "Asexual Interbreeder"
  *   **Path:** Q1(B) + Q3(A)
  *   **Status:** **UNDEFENDED POSITION.**
  *   **Why:** You cannot claim "Species" is the wrong word for asexuals (Q1-B) while simultaneously claiming that gene flow is the *only* thing that unifies a species (Q3-A). This implies interbreeding is necessary for specieshood, but then denies specieshood to things that can't interbreed. This is internally inconsistent.

  #### ⚠ Empty Cell: The "Eternal Morphology"
  *   **Path:** Q2(A) + Q4(B)
  *   **Status:** **UNATTRACTIVE POSITION.**
  *   **Why:** You claim a species persists through time despite changing traits (Q2-A), but also claim it isn't a species unless we can diagnose it at a specific slice (Q4-B). This creates a paradox where a species exists diachronically but vanishes epistemically whenever it stops looking distinct.

  ---

  ### INSTRUCTOR NOTES: Empty Cells & Inseparable Pairs

  **1. On Empty Logical Space**
  The tree is designed to reveal contradictions in "folk" species concepts.
  *   **The "Asexual Interbreeder" (Q1-B / Q3-A):** Students often hold this implicitly. They memorize the BSC ("interbreeding") but acknowledge asexuals exist. When forced to choose, they must either expand the definition (Cohesion/ESC) or restrict the scope (BSC Pluralism). There is no coherent monist position that requires sex but denies asexuals have species.
  *   **The "Eternal Morphology" (Q2-A / Q4-B):** This highlights the tension between *ontological* persistence (the lineage continues) and *epistemic* access (we need traits to name it). Most philosophers argue that if the lineage is real (Q2-A), the species exists regardless of our ability to diagnose it (rejecting Q4-B).

  **2. On Inseparable Leaves**
  Despite the tree's rigor, certain distinctions require technical knowledge undergraduates won't have. Be prepared to clarify these in discussion:
  *   **PSC (Diagnosability) vs. PSC (Monophyly):** Leaf III groups these. *Diagnosability* (Cracraft) requires a fixed trait. *Monophyly* (Mishler) requires a clade. A student might intuitively support one but not the other, but Q4 cannot split them.
  *   **ESC vs. Cohesion Concept:** Leaf II and Leaf I (Cohesion variant) are very close. Both view species as diachronic lineages. The **ESC** (Simpson/Wiley) emphasizes the *fate* of the lineage. The **Cohesion Concept** (Templeton) emphasizes the *mechanisms* (gene flow + ecological selection) holding it together. The tree treats them as a cluster because student intuitions on "lineage persistence" rarely distinguish between *fate* and *mechanism*.
  *   **EcSC vs. PSC:** In Q3, if a student chooses "Two Species," they may be motivated by ecology (niche difference) or morphology (diagnosability). The tree groups these as "Non-BSC Splitting" concepts. Use the Wolf/Coyote discussion to pry them apart: "Are they distinct because they *look* different (PSC) or because they *hunt* differently (EcSC)?"

  **3. On Pluralism**
  The "Scope Check" (Q5) is crucial. Many students will land on BSC (Leaf I) but answer "No" to Q5 (acknowledging fossils/asexuals need different rules). This is **Concept Pluralism** (e.g., Kitcher, Dupré). It is a defensible position, but it contradicts the textbook implication that there is *The* Species Concept. Use this to introduce the idea that "species" might be a *theoretical term* that picks out different patterns in different contexts.
