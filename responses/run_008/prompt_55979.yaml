      *   *Q4:* Instead of "Diagnosable?", ask: "Consider two frog populations that never interbreed but look identical (cryptic). Are they one species until we find a genetic marker, or two species already?"

  5.  **Addressing Empty Cells & Inseparable Pairs:**
      *   *Empty Cell:* "Asexuals matter" + "Interbreeding is necessary." (Contradiction).
