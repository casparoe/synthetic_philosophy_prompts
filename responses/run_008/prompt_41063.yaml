  ### The view, stated so it can fail

  Strong computationalism asserts that cognitive processes are literally computations defined over representational vehicles, implemented by neural mechanisms independent of their specific physical substrate. Crucially, there is a fact of the matter about which algorithm is running, determined by the system's causal topology rather than an observer's interpretation. This view fails if neural dynamics lack the discrete state transitions required for formal syntax, if the mapping between physical and computational states is gerrymandered rather than natural, or if cognitive capacities fundamentally exceed Turing-computable functions. It is not merely that the brain can be modeled computationally, but that its causal powers are computational powers. If the brain is essentially analog, continuous, and observer-relative in its state individuation, strong computationalism is false.

  ### What would count against it, ranked

  The most fatal threat is the Dynamic Triviality Problem. Putnam demonstrated that any open physical system can be mapped onto any finite automaton if the state mapping is unconstrained. Your defense relies on the counterfactual reply: implementation requires the physical system to support the right causal transitions, not just actual ones. However, this assumes stable state types. If neural dynamics are chaotic, counterfactuals become fragile. In a chaotic system, micro-variations explode, meaning the physical realizers of computational states lack the stability required for reliable state transitions. If the mapping from physical to computational states requires coarse-graining that washes out causally relevant details, the implementation is observer-relative. If there is no natural joint in the physical dynamics that aligns with discrete computational states, the fact of the matter you posit disappears. This attacks the ontology of implementation itself. If your partner is right that states are descriptive, there is no algorithm running independently of your model. The counterfactual reply assumes stable state types. If noise is intrinsic, not error, the boundaries blur. You need to prove neural noise is filterable, not constitutive. The crucial weakness here is individuation. For counterfactuals to hold, State A must be the same type across time. In a chaotic neural field, exact physical recurrence is impossible. You must group distinct physical microstates into one computational macrostate. If this grouping is not dictated by the physics itself but by your modeling choice, Putnam wins. The causal structure must carve nature at its joints, not yours.

  A serious defeater is the Analog/Biological Constraint. Strong computationalism often presupposes discrete state transitions. Yet, biology is messy. Graded potentials, ephaptic coupling, and neuromodulation suggest continuous parameter tuning rather than symbolic manipulation. If cognitive function depends on continuous dynamics that cannot be discretized without losing predictive power, the brain is not a digital computer. It might be a hybrid system, but if the computation is just an approximation of a differential equation, the dynamical systems view wins. This forces a retreat to analog computation, which risks collapsing into triviality if any physical change counts as computation. You must show that discrete spiking events, not continuous voltages, carry the computational load. Furthermore, neuromodulation changes the rules of processing continuously. If the algorithm changes every millisecond based on chemical concentration, is it still a fixed formal system? Or is it a dynamical system whose behavior we approximate computationally? Consider dendritic computation. If individual dendrites perform non-linear operations on continuous inputs before spiking, the neuron is not a simple unit. If the timing of spikes relative to oscillatory phases matters continuously, discretizing time loses information. You must demonstrate that the brain quantizes its own variables, not just that you can quantize them for simulation.

  Another serious issue is Insulation by Redefinition. If the definition of computation shifts from Turing-machine symbol manipulation to any causal process preserving information, the thesis becomes unfalsifiable. If every physical interaction is computational, computationalism explains nothing specific about cognition. Finally, Gödelian Arguments are merely awkward. Penrose-style objections claim human mathematics transcends algorithms. These are weak because they assume human consistency and ignore that brains might be probabilistic or unsound theorem provers. They are philosophically interesting but empirically toothless compared to the implementation problem. The core vulnerability is whether neural causality supports discrete individuation. If the brain is essentially continuous, your fact of the matter is an artifact of description. The counterfactual reply only works if the physical system respects the computational boundaries naturally. If noise is intrinsic, not error, the boundaries blur.

  ### What I should concede versus dismiss

  You should concede that the brain is not a classical von Neumann machine. If evidence shows continuous dynamics are cognitively penetrable, you must abandon discrete symbolic computationalism for hybrid or analog models. You must also concede that implementation requires natural kinds; if state individuation is purely pragmatic, your fact of the matter claim collapses. This means accepting that computationalism is an empirical hypothesis about neural architecture, not an a priori truth. If neuromodulation renders the program fluid rather than fixed, you must adjust the theory to accommodate dynamic reconfiguration rather than static algorithm execution. You must admit that if the grain of description is chosen solely for modeling convenience rather than causal boundaries, your partner wins. You should also concede that if noise is signal, your error-correction models fail. If variability is functional, not bug, the computational model of stable state is wrong.

  However, you are entitled to dismiss Gödelian arguments as relying on idealized assumptions about human rationality that neuroscience doesn't support. Humans are inconsistent; brains are probabilistic. You can also dismiss the claim that computation is merely metaphorical if you can demonstrate robust causal isolation of computational variables. If specific neural populations act as buffers or registers with reliable input-output mappings despite noise, the metaphor charge fails. The partner's claim that states are only descriptions is only true if no causal structure respects those descriptions. Your job is to find the causal structure. If you can show that disrupting specific computational patterns disrupts cognition while disrupting non-computational physical properties does not, you have empirical leverage. The concession is on the type of computation; the dismissal is on the existence of computation.

  ### Is the view insulated, and does it matter

  Computationalism has shifted from symbolic to connectionist to predictive processing. This looks like insulation. If every new discovery is absorbed by redefining computation, the view risks becoming a degenerating research program. However, some flexibility is necessary for research heuristics. The danger arises if the definition expands to include all physical dynamics, rendering the term vacuous. It matters because if computationalism explains everything, it explains nothing. You must maintain a boundary where non-computational dynamical explanations are possible and distinct. If the view cannot specify what would count as non-computational cognition, it is insulated dogma.

  Consider Lakatos's methodology of scientific research programs. A progressive program predicts novel facts; a degenerating one patches holes. Computationalism is progressive if it leads to new interventions (e.g., optogenetics targeting computational units). It is degenerating if it merely relabels dynamical equations as algorithms post-hoc. The insulation charge sticks if you cannot imagine a neural discovery that would force you to say, This is not computation. If your answer is nothing could, you are doing metaphysics, not science. The view matters because it dictates experimental design. If you treat noise as error, you filter it; if you treat it as signal (dynamics), you analyze it. Getting this wrong wastes decades. You must keep the definition tight enough to fail, or admit it's a stance, not a theory. The risk is that computationalism becomes a faith in discretization where none exists, blinding researchers to analog mechanisms that don't fit the schema. Your partner's dynamical view is the alternative hypothesis. If computationalism cannot distinguish itself from dynamics, it is empty.
