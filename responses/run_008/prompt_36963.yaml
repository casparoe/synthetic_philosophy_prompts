      *   **The User's Hypothesis:** They suspect the disagreement might be verbal (definitions), cross-purposes (descriptive vs. normative), or about institutional trust (political/normative).
      *   **The Task:** Diagnose the *type* of disagreement (substantive, verbal, cross-purposes, etc.). Don't just survey positions. Explain what would count as progress.
      *   **The Stakes:** If the "class-defect" view is right, arguing evidence with Dan is useless/harmful. If the "case-by-case" view is right, refusing to argue evidence is smug/entrenching.
      *   **Tone:** Intellectual, rigorous, empathetic to the frustration, avoiding platitudes about "how to talk to Dan" (though implications are welcome).

  2.  **Deconstruct the Philosophical Debate:**
