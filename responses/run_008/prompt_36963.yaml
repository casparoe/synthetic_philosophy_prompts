      *(Self-Correction on the "Descriptive vs Normative" hypothesis)*: The user suggested Side A is descriptive and Side B is normative. I need to address this. Actually, Side A (Generalists) is usually *normative* (you are irrational to believe) based on *descriptive* claims (psychology of belief). Side B is *normative* (you are permitted to believe). So the user's hypothesis there is slightly off. I should gently correct that while validating the intuition that they are talking past each other.

      *(Final thought on the "Class Defect" argument)*: The strongest version of Side A isn't that all CTs are false, but that the *style of reasoning* is epistemically vicious (Quassim Cassam's "Conspiracy Thinking"). This distinguishes it from "Investigative Journalism" which also finds conspiracies. This distinction is key to the "Progress" section.

