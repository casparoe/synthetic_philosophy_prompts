answer: |-
  This is an exceptionally sharp diagnosis of a genuine philosophical stalemate. You are right to feel that the literature mirrors your frustration with Dan; the reason is that the academic debate is stuck in the same trap as the interpersonal one.

  To answer your core question: **This is a hybrid disagreement.** It presents as a **verbal dispute** (definitions), operates as a **methodological cross-purpose** (process vs. content), but is driven by a **substantive disagreement about Bayesian priors** (institutional trust).

  Here is the proper diagnosis of why the argument never moves, what would count as progress, and what that implies for the situation with Dan.

  ### 1. The Diagnosis

  **Layer One: The Verbal Dispute (The Label)**
  Your hypothesis that this is partly verbal is correct, but it's more specific than just "unwarranted" vs. "any." The term "conspiracy theory" functions as a **slur in public discourse** but a **neutral descriptor in philosophy**.
  *   **Side A (Class-Defect)** often implicitly relies on the colloquial definition: "A theory that is not only about a conspiracy but is *suspect*." If you define a conspiracy theory as "an unwarranted belief in hidden coordination," then Side A is tautologically right.
  *   **Side B (Case-by-Case)** relies on the literal definition: "An explanation of events citing the intentional cooperation of agents." If you define it this way, Side B is empirically right (Watergate, Tuskegee, Iran-Contra).

  As long as they use the same phrase to denote different categories, they cannot disagree substantively. Side A says, "This category is toxic." Side B says, "This category contains true things." They are talking about different sets.

  **Layer Two: The Cross-Purposes (Vice vs. Truth)**
  This is where your "descriptive vs. normative" hypothesis needs tweaking. Both sides claim to be doing normative epistemology (how one *ought* to believe). However, they are evaluating different objects.
  *   **Side A is evaluating the *process* (Vice Epistemology).** They argue that the *mechanism* of conspiracy belief is inherently self-sealing. It treats counter-evidence as proof of the cover-up. Therefore, holding the belief *this way* is epistemically vicious, regardless of whether the conspiracy is real.
  *   **Side B is evaluating the *proposition* (Traditional Epistemology).** They argue that the *content* of the belief could be true. Therefore, dismissing it *a priori* is dogmatic.

  Side A says, "You are believing badly." Side B says, "You might be believing truly." These claims are compatible. You can believe a true thing badly (e.g., believing the earth is round because a psychic told you). The stalemate exists because Side B thinks proving the conspiracy *possible* refutes Side A, while Side A thinks proving the reasoning *flawed* refutes Side B.

  **Layer Three: The Substantive Core (The Priors)**
  This is the engine driving the bus. Underneath the definitions and methods lies a substantive disagreement about **Default Priors regarding Institutional Competence and Honesty.**
  *   **Side A** operates with a high prior trust in official narratives. To them, a claim that "the government faked the moon landing" requires extraordinary evidence because the prior probability of the government successfully faking something that big is low.
  *   **Side B** operates with a low prior trust. To them, the prior probability of government corruption is high enough that the "extraordinary evidence" threshold is lower.

  When Side A says, "That's too many people to keep a secret," they are making a claim about institutional competence. When Side B says, "They lied about WMDs," they are making a claim about institutional honesty. This is a political disagreement masquerading as an epistemological one.

  ### 2. What Would Count as Progress?

  The debate has been stagnant for twenty years because participants try to win on Layer 1 (definitions) to settle Layer 3 (trust). Progress requires abandoning the term "Conspiracy Theory" entirely as an analytical category.

  **A. Shift from "Theory" to "Thinking Style"**
  Progress looks like the distinction made by philosophers like Quassim Cassam. We stop asking "Is this conspiracy theory true?" and start asking "Is this *conspiracist thinking*?"
  *   **Conspiracy Theory:** A hypothesis about hidden coordination (can be true or false).
  *   **Conspiracism:** A style of reasoning that is immune to counter-evidence, sees patterns everywhere, and assumes malevolence as a default.

  If the literature (and you) can separate these, Side B's point (some conspiracies are real) is conceded, but Side A's point (conspiracism is epistemically defective) stands. **Progress is the consensus that one can investigate conspiracies without being a "conspiracy theorist" in the pejorative sense.**

  **B. Empirical Findings on Belief Updating**
  Abstract epistemology won't solve this. Progress requires cognitive science. We need empirical data on: *Do people who hold conspiracy beliefs update their priors when presented with disconfirming evidence?*
  *   If the data shows they *never* update (the "backfire effect"), Side A wins on practical grounds: the belief is functionally unfalsifiable for the holder.
  *   If the data shows they update *sometimes*, Side B wins: it's a normal belief subject to normal evidence.
  (Current literature suggests the "backfire effect" is rarer than thought, but *motivated reasoning* is pervasive. This supports a nuanced middle ground.)

  **C. Explicitly Acknowledging the Trust Variable**
  Progress requires admitting that the disagreement is about **authority**. The question shouldn't be "Is it rational to believe this theory?" but "Given the track record of this institution, what is the rational prior?"
  If we admit this, the debate moves from epistemology to political philosophy. We stop arguing about logic and start arguing about the legitimacy of power structures.

  ### 3. Implications for Dan (and You)

  You asked for the diagnosis first, but the utility of this diagnosis is that it tells you why your current strategy with Dan is failing.

  **If you argue Evidence (Side B's approach):**
  You are treating Dan's belief as a standard hypothesis. You assume that if you show him a gap in the logic or a contradictory fact, he will update.
  *   *Why it fails:* If Dan is engaged in **Conspiracism** (Layer 2: Process) rather than just holding a **Conspiracy Theory** (Layer 2: Content), the evidence doesn't matter. The evidence is interpreted *through* the lens of the conspiracy. Your fact is his "planted disinformation."
  *   *Diagnosis implication:* If the Class-Defect crowd is right about the *structure* of the belief (self-sealing), arguing evidence is indeed pointless. It feeds the machine.

  **If you argue Principle (Side A's approach):**
  You tell him, "You're being irrational," or "You can't trust that many people."
  *   *Why it fails:* This triggers Layer 3 (Trust). You are effectively saying, "Trust the institutions more than you do." To Dan, this sounds like you are part of the system he distrusts. It entrenches him.

  **The Way Forward (Based on the Diagnosis):**
  The diagnosis suggests you need to decouple the **Content** from the **Process**.
  1.  **Concede Layer 1 (Verbal):** Admit that real conspiracies happen. "Dan, you're right, the CIA *did* overthrow governments. Watergate *was* real. I'm not saying conspiracies are impossible." This disarms the "You're a sheep" accusation.
  2.  **Target Layer 2 (Process):** Shift the argument from *what* he believes to *how* he decides what to believe. "I'm not arguing about the moon landing. I'm arguing about what would change your mind. If NASA released X document, would you believe them? If not, why not?"
      *   If he says "Nothing would change my mind," you have identified the epistemic defect (unfalsifiability) without calling him stupid.
      *   If he says "Yes, but they won't," you move to Layer 3.
  3.  **Address Layer 3 (Trust) Directly:** "It seems like for you, this isn't about the evidence anymore. It's that you don't trust [Government/Science/Media] as far as you can throw them. I get that. But if you don't trust *any* source, you can't know anything, not just this."

  ### Summary
  The philosophical stalemate is a **Category Error**. The "Class-Defect" theorists are critiquing a *psychological posture* (conspiracism), while the "Case-by-Case" theorists are defending a *propositional category* (hypotheses of coordination).

  Progress counts as **dissolving the category**. We stop asking "Are conspiracy theories rational?" and start asking "Under what conditions does investigating power become epistemically vicious?"

  For Dan: If you treat his belief as a standard factual claim, you will lose, because for him, it is likely functioning as an identity-protective cognition (a process defect). You cannot evidence-bomb a process defect. You have to address the immunity mechanism itself.
