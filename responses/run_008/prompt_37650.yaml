answer: |-
  **1. Before You Begin**

  You are about to use a procedure that claims to formalise care ethics. This is a contradiction. Care ethics resists impartial machinery; it demands attentiveness to the particular. This card does not calculate entitlement. It is a discipline of attention designed to stop you from seeing only the file. It forces you to look for the relationship, not just the deficit.

  The objection that writing this down betrays the tradition is valid. Rules generalise; care particularises. However, without a shared procedure, your decisions become arbitrary, favouring the loud and charming over the inarticulate. This card is not a rulebook but a checklist for conscience. It ensures every file receives the same *quality* of scrutiny, even if the outcomes differ. Use it to justify why you looked beyond the score. If you find yourself ticking boxes without thinking, you have already failed. The procedure is not the care; it is the scaffold that holds space for it.

  **2. The Procedure**

  1.  **Competence and Safety (Fact):** Will funding this request prevent immediate harm or breakdown? If the care relationship is collapsing (violence, hospitalisation risk), authorise hours. If safe, proceed.
  2.  **Sustainability of the Relationship (Judgment Call):** Does the request preserve the primary care bond? *Sufficient answer:* Evidence that without respite, the caregiver will quit or become abusive. *Termination:* If the request undermines the bond (e.g., leaving the cared-for alone beyond capacity), deny. **Note:** This is a value judgment dressed as procedure; you are weighing relational survival against clinical metrics.
  3.  **Responsiveness of the Cared-For (Judgment Call):** Has the cared-for's voice been heard? *Sufficient answer:* Direct confirmation or reliable proxy of their wishes. *Termination:* If the cared-for explicitly rejects the intervention and possesses capacity, do not fund imposed care. **Note:** This prioritises autonomy over safety; it is a moral choice, not a clinical one.
  4.  **The Invisible Check (Judgment Call):** Are you favouring this file because the caregiver is articulate or likable? *Sufficient answer:* You have actively identified what is missing from the file (e.g., unspoken burden). If you cannot articulate the need beyond the application form, pause.
  5.  **The Hand-Off:** If Step 2 and 3 conflict (e.g., safety requires intervention the cared-for rejects), stop. Do not decide alone. Flag for team review. This is no longer a fact-finding mission; it is a values conflict requiring collective moral responsibility.

  **3. The Trial Run**

  **Mrs. Okafor:** The procedure authorises funding. Step 1 identifies risk: Dolores is brittle; the relationship is eroding. Step 2 confirms sustainability: two weeks' respite prevents caregiver collapse, preserving the long-term bond. Step 3 is satisfied; Mrs. Okafor's middling deficits allow safe temporary care. The formula would reject this due to low clinical scores, but care ethics prioritises the survival of the caring relationship. The hours are granted to save the daughter, thereby saving the mother's care network.

  **Mr. Whitfield:** The procedure denies funding. Step 1 finds no immediate safety risk. Step 2 fails: there is no caregiver relationship to sustain. Respite care presupposes a caregiver needing rest. Mr. Whitfield needs direct home care, not respite. Step 3 confirms his lucidity, but the resource is mismatched. This outcome is cold. He is vulnerable and alone, but this fund cannot fix structural abandonment. The file is rejected for respite and flagged for alternative services, though none may exist.

  **Harriet Boyd:** The procedure denies funding and closes the file. This is the outcome you will dislike. Step 1 notes her cardiac risk, but Step 3 vetoes intervention: the husband's shame and her refusal constitute a lack of responsiveness. Care ethics forbids imposing 'help' that destroys the dignity of the care relationship. Forcing aides upon them violates their moral agency. Despite the risk, you must respect their refusal. To do otherwise is paternalism, treating them as objects rather than participants in care. The file closes per policy, maintaining ethical consistency at the cost of safety.

  **4. Where It Fails**

  This procedure misfires when time pressure destroys attentiveness. Twenty minutes is insufficient for deep relational auditing; coordinators may revert to ticking boxes, falsely claiming ethical justification. It also fails where resources are structurally absent, as with Mr. Whitfield; ethics cannot conjure home care from a respite budget. Furthermore, the 'Invisible Check' relies on the coordinator's self-awareness. If a coordinator is unconsciously biased against a 'difficult' family like the Boyds, they may use Step 3 to justify abandonment rather than respect. Finally, the Hand-Off mechanism burdens the team; if every hard case is escalated, the system clogs. Watch for escalation fatigue.

  **5. The Bottom Line**

  Tell the ombudsman this is a relational audit, not a scoring matrix. It is not designed to ensure equal distribution, but equitable preservation of care networks. It is defensible because it documents *why* a relationship needed support, rather than proving *how much* deficit existed. It admits that sometimes, respecting autonomy means allowing refusal, even when risky. It is not impartial; it is partial to the sustainability of care.
