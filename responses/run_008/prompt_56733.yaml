answer: |-
  Dear friend, it is completely understandable that you are feeling unsettled by this reading, especially given the personal weight of the decision you and your partner are facing. Population ethics is notoriously complex, and popular summaries often streamline the philosophical debates in ways that can introduce significant inaccuracies. To help you sort out what to trust, it is best to walk through the claims you mentioned one by one, distinguishing between what is standard philosophical orthodoxy and where the book you read likely oversimplified or misstated the consensus.

  The description of the Repugnant Conclusion itself is largely accurate in its broad strokes. Derek Parfit did indeed argue that if you accept total utilitarianism, which holds that the value of a world is determined by the sum total of well-being within it, you are logically committed to the view that a world containing a massive number of people whose lives are barely worth living is better than a world with fewer people who are very happy. This is because, mathematically, enough small amounts of positive well-being can outweigh a smaller amount of very high well-being. Most philosophers agree that total utilitarianism implies this conclusion, and most also agree that the conclusion feels intuitively wrong or repugnant, which is why it bears that name. However, describing this as a definitive refutation is where the summary becomes contentious. In philosophy, a counterintuitive implication does not necessarily falsify a theory; sometimes it forces us to revise our intuitions. While many ethicists see the Repugnant Conclusion as a major strike against total utilitarianism, some defenders argue that we should accept the conclusion despite its unpleasantness, while others propose modifications to the theory, such as critical-level utilitarianism, to avoid it without abandoning the total view entirely. So, while it is a serious problem for the theory, calling it a proven refutation is stronger than the academic consensus usually allows.

  Where the book you are reading becomes clearly misleading is in its claim about Parfit's own solution. The author states that Parfit concluded we should switch to average utilitarianism, but this is historically and philosophically incorrect. In his seminal work Reasons and Persons, Parfit explicitly argued against average utilitarianism because it generates even worse paradoxes than total utilitarianism. For instance, average utilitarianism implies that adding a happy person to the world is bad if their happiness is below the current average, and it arguably implies that killing people with lives worth living but below the average would improve the world. Parfit spent the rest of his career searching for what he called Theory X, a satisfactory account of population ethics that avoids both the Repugnant Conclusion and the problems of average utilitarianism, but he never settled on average utilitarianism as the answer. Claiming that he endorsed it is a significant error that undermines the credibility of the book's summary of the field.

  Regarding the practical upshot for you and your partner, the claim that total utilitarianism turns procreation into a strict duty is a nuanced inference rather than a straightforward fact. It is true that under strict act utilitarianism, if creating a new person adds net positive utility to the world, you are theoretically maximizing the good by doing so. However, even among utilitarians, there is debate over whether this creates a binding obligation or merely a supererogatory act, meaning something that is good to do but not wrong to omit. Furthermore, many population ethicists endorse the asymmetry view, which holds that while we have a moral reason not to bring into existence a child who would suffer, we do not have a corresponding duty to bring into existence a child who would be happy. This view is widely held precisely to avoid the implication that everyone is morally failing whenever they choose not to have children. Therefore, the leap from total utilitarianism to a personal duty to procreate is not accepted by all ethicists, even those who work within utilitarian frameworks.

  Ultimately, while the theoretical implications of population ethics are fascinating, they are far from settled, and relying on a popular summary that contains factual errors about Parfit's own views should give you pause. The field does not offer a unified verdict that should dictate such a personal life choice. Most philosophers would agree that while the aggregate value of population matters for large-scale policy, it does not necessarily translate into a crushing individual obligation for prospective parents. You can acknowledge the theoretical puzzles without accepting that abstaining from procreation is a moral failure, especially given that the theory itself is still being debated and refined by experts. I hope this clarification helps relieve some of the pressure you are feeling and allows you and your partner to focus on what matters most to you personally rather than worrying about a purported philosophical duty that is far from established.
