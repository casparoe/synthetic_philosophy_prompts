  *Let's write.*
answer: |-
  **Setting:** *A quiet corner of a conference lounge, late afternoon. Two coffee cups sit between them. Elena (Gene-Centric) is reviewing a printout. Marcus (Multilevel Selection) leans forward.*

  **Marcus:** You're frowning at the abstract again, Elena. The colonial invertebrate case?

  **Elena:** I'm frowning at the conclusion. They claim this demonstrates "colony-level selection" overcoming "zooid-level selection." It's evocative, I'll grant you. Clonal colonies, somatic mutation, nutrient hoarding. It's essentially cancer in a modular organism.

  **Marcus:** Essentially, yes. But don't dismiss the "colony-level" tag so quickly. Look at the dynamics. You have a lineage of zooids that defects—shunts nutrients to its own gonads rather than the shared circulation. That lineage spreads *within* the colony. That's within-group selection. But colonies heavily infected with defectors produce fewer, smaller budded offspring. That's between-group selection.

  **Elena:** I don't deny the dynamics, Marcus. I deny the ontology. You're describing a single process: the differential replication of the defector allele versus the cooperator allele. The "colony" is just the environment in which the alleles are competing.

  **Marcus:** That's the reduction I object to. It's not just bookkeeping. We can measure the strength of selection at the colony level. We partition the variance in reproductive output. How much variance is due to differences *among* colonies in defector frequency, versus differences *among* zooid lineages *within* colonies? If the among-colony variance is significant, colony-level selection is a causal force.

  **Elena:** Significant statistically, perhaps. But causally? What is the replicator at the colony level? For selection to be fundamental, you need a unit that combines fidelity, longevity, and fecundity. The gene has that. A somatic mutation arises, it copies itself as the zooid grows. The colony buds. But the colony's "heredity" is leaky. Every time a bud forms, it's a lottery of how many defector zooids get included.

  **Marcus:** It's not that leaky. Budding is a form of asexual reproduction. If a colony has 10% defectors, the bud likely has near 10% defectors. There is statistical heredity. That's enough for selection to act.

  **Elena:** Statistical heredity isn't enough for *fundamental* selection. It's enough for the *vehicle* to persist temporarily. But look at the defector. It wins inside the colony because it replicates faster than the cooperator zooids. It loses at the colony level because the colony buds less. The net change in gene frequency is the sum of these forces. Why posit two "selections"? It's one calculation: does the allele increase or decrease?

  **Marcus:** Because the *cause* of the decrease matters. If you only look at the gene, you miss the mechanism suppressing the defection. The colony isn't just a passive bag of genes. It has physiology. The shared circulatory system is a mechanism that usually enforces cooperation. When the somatic mutation bypasses that, it triggers a collapse. The suppression of the defector is a property of the colony's survival, not just the gene's failure. If we want to explain why these colonies don't all dissolve into chaos, we need to talk about colony-level adaptation.

  **Elena:** Adaptation, fine. I distinguish the unit of adaptation from the unit of replication. The colony can be an adapter. It can be a vehicle that is well-designed. But who is the designer? Natural selection. And natural selection is fundamentally the survival of replicators. The "design" of the colony exists only because genes that build cooperative colonies have, on balance, out-replicated genes that build chaotic ones.

  **Marcus:** But "on balance" hides the conflict. In your view, the gene is the only actor. In mine, there is a genuine tension between two evolutionary processes. Think about the Price Equation. It partitions the change in gene frequency into a within-group component and a between-group component. They can oppose each other. In your invertebrate case, the within-group term favors the defector. The between-group term favors the cooperator.

  **Elena:** I accept the Price Equation. It's a mathematical identity. It doesn't dictate ontology. I can rewrite that equation entirely in terms of gene frequencies without remainder. The "between-group" term is just describing how the *context* affects the gene's fitness. A cooperator gene in a high-defector colony has low fitness. A cooperator gene in a low-defector colony has high fitness. That's gene-by-environment interaction. The environment happens to be other genes.

  **Marcus:** That's where we diverge. You call it "environment." I call it "group structure." If I can manipulate the variance among colonies—say, by forcing bottlenecks during budding—I can change the evolutionary outcome. I can make colony selection stronger than lineage selection. That sounds like causal control over a level of selection, not just tweaking a gene's environment.

  **Elena:** You're manipulating the variance in gene replication rates. You're making it so that a cooperator gene is more likely to end up in a successful budding event. You haven't created a new replicator. You've just changed the fitness landscape for the existing replicators.

  **Marcus:** But the landscape *is* the higher-level unit. If the colony reproduces, varies, and heredity exists, it meets Lewontin's criteria for evolution. Why deny it the status of a unit of selection?

  **Elena:** Because fidelity. You mentioned heredity earlier. In your invertebrate, the "colony genotype" isn't copied directly. It's reconstructed every generation via budding from somatic cells. Somatic mutation rates are high. The "defector" allele arises *de novo* often. The colony doesn't have the longevity to be a replicator. It dissolves, or buds imperfectly. The gene persists through millions of colony generations.

  **Marcus:** Longevity is a matter of degree. And fidelity is a matter of degree. If the budding process is accurate enough to maintain colony-level traits—like size, shape, or baseline cooperation rate—then colony-level selection can build adaptations at that level. The fact that somatic mutation *can* occur doesn't mean it *always* swamps the signal.

  **Elena:** I concede that. If the mutation rate is low enough, the colony behaves *as if* it were a replicator. But "as if" is doing a lot of work. My claim is that even if the math works out identically, the gene-level view explains *why* the fidelity exists. The genes code for the budding mechanism that ensures fidelity. The genes are still pulling the strings.

  **Marcus:** And I claim that once the colony exists, it exerts downward causation. The colony's physiology suppresses the defector lineage. Maybe it cuts off blood flow to hyper-active gonads. That's a colony-level trait selected for colony survival. You can describe that as "genes for cutting off blood flow," but the selection pressure came from the threat of colony collapse.

  **Elena:** The selection pressure came from the differential replication of the "blood-flow-cutting" genes. If those genes didn't replicate, the trait vanishes.

  **Marcus:** But they replicate *because* the colony survives. The colony's survival is the proximate cause of the gene's replication.

  **Elena:** Proximate, yes. Ultimate, no. The ultimate cause is that the gene out-replicated its allele. Look, Marcus, I'll give you this: for the purpose of modeling this invertebrate, your multilevel framework is incredibly useful. It highlights the conflict. It tells us where to look for mechanisms—like the circulatory shunting.

  **Marcus:** And I'll give you this: the gene is the only thing with true immortality. The colonies are mortal vehicles. I'm not asking you to believe the colony is immortal. I'm asking you to admit that selection is a causal process that can happen at any level where there is variation, heredity, and fitness differences.

  **Elena:** Then our disagreement isn't about the biology of the invertebrate. We agree on the variance partitioning. We agree on the mutation rates. We agree on the outcome.

  **Marcus:** We agree on the prediction. We disagree on the description.

  **Elena:** Precisely. You think the description matters because it reflects distinct causal forces. I think the description matters because it reflects the only entity that actually *copies* itself with high fidelity. If the math is intertranslatable, as the Price Equation suggests, then the choice is pragmatic. But I argue the gene-level view is *more* pragmatic because it doesn't break down when fidelity gets low. If colony budding becomes random, your "colony selection" vanishes. My "gene selection" just updates the fitness values.

  **Marcus:** But if colony budding becomes random, the *cause* of the evolutionary change has shifted. Ignoring that shift because the math still works at the gene level seems like ignoring the physics because the accounting balances.

  **Elena:** Then we are left with this: Is evolution defined by the *process* of sorting entities (your view), or by the *result* of replicator persistence (my view)?

  **Marcus:** I think it's the process. And in this invertebrate, there are two processes running in opposition.

  **Elena:** And I think there is one process, manifesting in a complex vehicle.

  **Marcus:** So we leave the invertebrate alone, and we still disagree.

  **Elena:** We leave the invertebrate alone. But we know exactly where the fault line is. It's not in the variance. It's in whether "unit of selection" means "unit of replication" or "unit of adaptation."

  **Marcus:** And whether intertranslatability implies ontological equivalence.

  **Elena:** Exactly. If the equations map one-to-one, is the difference real, or just a matter of coordinate systems?

  **Marcus:** In physics, coordinate systems matter. Gravity looks different in an accelerating frame. But the force is real.

  **Elena:** But in evolution, the "force" is replication. If the coordinate system obscures what is replicating, it's misleading.

  **Marcus:** Or if it obscures what is *being selected*, it's incomplete.

  *(They sit in silence for a moment, looking at the printout of the invertebrate colony.)*

  **Elena:** Same time tomorrow?

  **Marcus:** Same time.

  ***

  **Note on Liberties and Assumptions**
  I have taken the liberty of sharpening Elena's "replicator" criteria to align closely with a strict Dawkins/Williams interpretation, whereas some contemporary gene-selectionists allow for more pluralism in units of replication. Additionally, the biology of the hypothetical invertebrate was under-specified regarding the mechanism of budding; I assumed for the dialogue that budding allows for sufficient variance in defector load between parent and offspring colonies to make the MLS argument viable, rather than assuming perfect cloning which would negate within-colony variance. Finally, I treated the Price Equation as a neutral ground for both, though in practice, theorists disagree on whether its partitions represent causal forces or statistical abstractions.
