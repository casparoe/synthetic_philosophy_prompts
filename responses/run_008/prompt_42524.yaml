answer: |-
  You are right to be frustrated. The debate often stalls because participants treat the Exclusion Argument as a weapon rather than a diagnostic tool. Your hunch is correct: the Exclusion Argument is not an external attack on Non-Reductive Physicalism; it is the logical consequence of holding a specific set of intuitive constraints on causation simultaneously. When your reading group circles, it is because you are rotating through which constraint to sacrifice without admitting you are doing so.

  Below is the specification you requested. I have stripped away the rhetorical padding. These are the criteria any theory of mental causation must address. I have distinguished between constraints required by the broader physicalist worldview and those required by the specific intuition that minds matter.

  ### The Desiderata for Mental Causation

  #### 1. Causal Completeness of the Physical (Closure)
  *   **The Constraint:** For every physical event $e$ that has a cause, there exists a sufficient physical cause $c_p$ at the time $e$ occurs.
  *   **The Case:** This is the load-bearing version of closure. Weak closure ("every physical event has *a* physical cause") allows for dualist interaction (the physical cause needs help from the mental). *Completeness* asserts the physical story is closed; no non-physical "oomph" is needed to bridge the gap to the effect. Without this, physics is not fundamental.
  *   **Status:** **Non-Negotiable for Physicalists.** (Dualists reject this, but your debate is within physicalism).

  #### 2. Mental Efficacy (Difference-Making)
  *   **The Constraint:** Mental properties/events must be causally relevant to some effects (typically physical behavior or subsequent mental states). If the mental state had not occurred, the effect would not have occurred (or would have occurred differently).
  *   **The Case:** If mental states do not affect the world, they are epiphenomenal. This violates the basic intuition that beliefs and desires explain actions *because* they produce them. If pain doesn't cause the withdrawal, the withdrawal is merely coincident with the pain.
  *   **Status:** **Non-Negotiable.** (To deny this is to accept Epiphenomenalism, which is usually treated as a *reductio* of the theory leading to it).

  #### 3. Non-Identity (Distinctness)
  *   **The Constraint:** Mental properties ($M$) are not identical to physical properties ($P$). $M$ is multiply realizable or conceptually distinct from $P$.
  *   **The Case:** This is the defining commitment of *Non-Reductive* Physicalism. If $M = P$, the problem dissolves (Reductive Physicalism), but you lose the ability to generalize across different physical realizers (e.g., silicon vs. carbon brains). If you want to save the "specialness" of the mental without leaving physicalism, you must maintain this distinction.
  *   **Status:** **Non-Negotiable for Non-Reductive Physicalists.** (Reductive Physicalists drop this).

  #### 4. No Systematic Overdetermination
  *   **The Constraint:** Physical effects are not systematically caused by two *independent* sufficient causes.
  *   **The Case:** We accept accidental overdetermination (two shooters kill a victim; either shot was sufficient). We reject *systematic* overdetermination (every time I raise my hand, a physical cause *and* a mental cause independently suffice). It is ontologically profligate and implies a miraculous coincidence that the physical cause always aligns with the mental cause.
  *   **Status:** **Contested (See Analysis Below).** While "no overdetermination" is standard, the definition of "independent" is where the slack hides.

  #### 5. Causal Proportionality (Explanatory Relevance)
  *   **The Constraint:** The cause must be at the right "level" to explain the effect. A cause is too specific if it rules out relevant alternatives; too general if it includes irrelevant details.
  *   **The Case:** If my desire for water causes me to walk to the kitchen, citing the exact microphysical configuration of my neurons is causally true but explanatorily poor (it's too specific). Citing "desire" captures the relevant difference-maker. This distinguishes a *cause* from a *background condition* or a *micro-base*.
  *   **Status:** **Camp Preference/Methodological.** Crucial for interventionists and explanation-focused theorists (Yablo, Woodward); less critical for those focused on metaphysical production.

  #### 6. Interventionist Stability
  *   **The Constraint:** There must be a possible intervention on the mental variable that changes the effect variable, holding other variables fixed.
  *   **The Case:** This operationalizes "difference-making." If I cannot conceptually intervene on $M$ without changing $P$ (due to supervenience), can $M$ still be a cause? This criterion forces clarity on whether causation requires independent manipulability.
  *   **Status:** **Methodological Preference.** Essential for causal modeling approaches; irrelevant for process-theory accounts.

  ---

  ### The Inconsistency Proof (The Exclusion Argument)

  You asked if this list is just the Exclusion Argument in disguise. **Yes.** If you hold the first four desiderata as strictly defined above, they form an inconsistent tetrad. Here is the explicit derivation:

  1.  **Completeness:** Physical event $E$ (behavior) has a sufficient physical cause $P$.
  2.  **Efficacy:** Mental property $M$ causes $E$.
  3.  **Distinctness:** $M \neq P$.
  4.  **No Overdetermination:** $E$ does not have two sufficient causes ($P$ and $M$) unless they are related non-independently.

  **The Conflict:**
  If $P$ is sufficient for $E$ (by 1), and $M$ causes $E$ (by 2), then $E$ has two causes.
  If $M \neq P$ (by 3), they are distinct candidates.
  If they are distinct and both sufficient, this looks like overdetermination.
  If we forbid systematic overdetermination (by 4), one cause must be excluded.
  Since $P$ is guaranteed by Completeness (1), $M$ is excluded.
  **Result:** $M$ does not cause $E$. This contradicts Efficacy (2).

  **Where the "Slack" Might Be:**
  The only way to resolve this without dropping a premise is to attack the definition of **Overdetermination**.
  *   **Kim's View:** $P$ and $M$ compete for the *same* causal work. If $P$ does it, $M$ is idle. (No slack).
  *   **The Non-Reductive Counter:** $M$ and $P$ are not *independent*. $M$ supervenes on $P$. Therefore, this is not "two shooters" overdetermination; it is "determinable/determinate" causation (Yablo). The mental causes the effect *in virtue of* the physical.
  *   **The Interventionist Counter:** If we define causation via counterfactuals (Desideratum 6), $M$ can cause $E$ even if $P$ causes $E$, provided the counterfactual dependence holds. Overdetermination only occurs if the effect would have happened *without* $M$ (holding $P$ fixed). But you can't hold $P$ fixed and change $M$ (due to supervenience). Thus, the overdetermination test never triggers.

  **Verdict on Slack:** There is no metaphysical slack in the *production* view of causation (Kim). There is potential slack in the *difference-making* view of causation (Woodward/List & Menzies). If your group is arguing past each other, it is likely because the Reductive Physicalist is assuming a production view, while the Non-Reductive Physicalist is implicitly relying on a difference-making view.

  ---

  ### Which Requirement to Drop?

  If forced to choose, I would drop **Non-Identity (Distinctness)** in favor of a token-identity theory with property dualism, or accept a robust **Realization** relation that treats $M$ and $P$ as causally relevant in different ways. However, strictly speaking, the most defensible drop is **No Systematic Overdetermination**, provided you redefine "overdetermination" to exclude non-independent causes. The intuition that overdetermination is bad stems from cases of independent coincidence (two shooters). If $M$ and $P$ are metaphysically linked (supervenience/realization), the "coincidence" charge fails. Keeping Completeness and Efficacy is vital for physicalism and agency; keeping Distinctness is vital for the special sciences. The "No Overdetermination" principle is the only one that relies on a definition of independence that doesn't clearly apply to the mind-body relation.
