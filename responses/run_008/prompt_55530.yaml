  A friend from my rationality meetup — we've been arguing about common knowledge and coordination since the old forum threads on the muddy children puzzle — has a long track record of verdicts on these puzzles, and next week she's due to rule on a new one. I want to predict her before she rules. Her precedents: in the standard muddy-children puzzle, where the father publicly announces that at least one child is muddy and one bell rings per round, she says three muddy children can all deduce their status by the third bell, and she says the induction works for any number of children, however large; for two generals on an unreliable channel who cannot acknowledge messages, she says no attack is ever rationally coordinated, no matter how many crossings the protocol allows; for Rubinstein's email game with the usual payoffs — joint attack hugely rewarding, solo attack disastrous, small probability of message loss on each leg — she says the players never attack, however many layers of automated confirmation the protocol stacks; and for the muddy-children variant where the father's announcement is a stage whisper that each child might or might not have heard, she says the deduction collapses, even though every child in fact heard it.

  The new case is the email game again, same 2% loss per leg, but the payoff for attacking alone is now zero rather than a disaster — you march to the field, find no one, and walk home — while the joint attack stays hugely rewarding and the status quo stays mildly bad. Will she say they attack or not?

