      *   *HPC:* "Symptoms cluster together because of feedback loops. You don't need all symptoms, just enough, held together by a mechanism." -> *Clinical:* "A stable syndrome maintained by causal mechanisms (e.g., neuroprogression), allowing for symptom heterogeneity but high predictive validity."
      *   *Promiscuous Realism:* "Different cuts are real for different purposes." -> *Clinical:* "Different inclusion criteria are valid depending on whether the goal is prevention, research, or resource allocation."
