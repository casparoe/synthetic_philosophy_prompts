      *   *HPC:* Maps well to *syndromes* validated by *covarying symptoms* and *underlying mechanisms* that maintain stability, even if symptoms vary.
      *   *Promiscuous Realism:* Maps to *utility for specific interventions* or *prognostic groups* rather than one true taxonomy.
