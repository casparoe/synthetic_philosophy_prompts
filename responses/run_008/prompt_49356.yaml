answer: |-
  # The Skeleton & Surface Protocol (SSP)

  **Purpose:** To separate questions of *identity* (is this an 'a'?) from questions of *style* (is this a good 'a' for us?), and to identify when style has destroyed identity.
  **Time Limit:** 15 minutes per glyph.
  **Participants:** 3 Reviewers (Panel Lead, Scribe, Timekeeper).
  **Tools:** Printed test sheets (glyph in isolation, glyph in "control words," glyph in "stress words"), red marker, stopwatch.

  ---

  ## Part 1: The Procedure

  ### Phase 1: Structural Integrity (5 Minutes)
  *Goal: Determine if the skeleton is intact. This is a binary pass/fail based on topology and components.*

  **The Check:**
  Compare the submitted glyph against the "Parts List" for that character in your foundry's baseline standard (e.g., a standard Grotesque or Humanist reference).
  1.  **Component Count:** Does it have the required parts? (e.g., lowercase 'a' requires a bowl and a stem/stroke. If it lacks a bowl, it is not an 'a'.)
  2.  **Topology:** Are the counters (enclosed spaces) correct? (e.g., 'a' usually has one closed counter. 'c' has none. 'b' has one, but stem direction differs.)
  3.  **Differentiation:** Does it occupy unique visual space from its primary confusables? (e.g., 'a' vs. 'o', 'l' vs. 'I' vs. '1').

  **Pass Criteria:**
  *   All required components are present.
  *   Topology matches the character definition.
  *   **Termination Point (Rejection):** If the glyph fails Component Count or Topology, the review ends. The glyph is rejected as structurally incorrect. No style argument can save it.

  ### Phase 2: Contextual Legibility (5 Minutes)
  *Goal: Determine if the stylistic surface has starved the skeleton. This acknowledges your insight that context defines identity.*

  **The Check:**
  1.  **The Control Word:** View the glyph in a neutral word (e.g., "nano" for 'a', "hill" for 'l').
  2.  **The Stress Word:** View the glyph in a high-risk sequence (e.g., "ao" or "oa" for 'a'; "1lI" for 'l').
  3.  **The Squint Test:** Reviewers view the Stress Word from 2 meters away (or reduced to 12pt on screen). If the target glyph disappears or morphs into its neighbor, it fails.

  **Pass Criteria:**
  *   The glyph remains distinct from its neighbors in the Stress Word.
  *   The glyph is identifiable within 2 seconds in the Control Word.

  **Termination Point (Rejection):**
  *   If the panel unanimously agrees the glyph is confusable in the Stress Word, it is rejected for legibility.

  ### Phase 3: The Outsider Test (3 Minutes)
  *Goal: Break the panel's typographic bias. Used only if Phase 1 & 2 are disputed.*

  **The Check:**
  1.  Borrow two non-designers from the office.
  2.  Show them the **Stress Word** only (e.g., "ao") for 3 seconds.
  3.  Ask: "Read this word aloud."
  4.  Do not explain the font. Do not point to the glyph.

  **Pass Criteria:**
  *   Both outsiders read the word correctly without hesitation.
  *   **Termination Point (Rejection):** If either outsider misreads the word (e.g., reads "ao" as "oo"), the glyph is rejected. This is objective data.

  ### Phase 4: Escalation (2 Minutes)
  *Goal: Hand off matters of taste and policy.*

  **The Check:**
  If the glyph passes Phases 1–3 but the panel still feels "uneasy" (e.g., it's legible but looks weird, or it's legible but clashes with the rest of the family), the review stops.

  **Action:**
  *   Mark as **PASS (Conditional)**.
  *   Send to Design Director.
  *   **Note:** The Director decides if the style fits the foundry's brand and the font's intended use (UI/Signage). This is not a legibility decision; it is a product decision.

  ---

  ## Part 2: Candid Limitations

  You asked for honesty about where this procedure is smoke and mirrors. Here it is:

  1.  **The "Parts List" is Cultural:** There is no universal biological definition of an 'a'. A single-story 'a' is structurally different from a double-story 'a', yet both are 'a's. Phase 1 relies on your foundry's *internal* definition of standard forms. If your baseline is biased, the procedure is biased.
  2.  **The Outsider Test is Weak:** Two people is not a statistically significant sample. It is a heuristic, not science. It protects you from groupthink, not from actual market failure.
  3.  **Context is Infinite:** We test "ao" and "nano." We cannot test every kerning pair or language combination. A glyph might pass here and fail in a specific UI string (e.g., "fa0" vs "faO").
  4.  **The Escalation is Arbitrary:** When a case goes to you (Director), you are not solving a design problem; you are making a business ruling. You might approve a legible glyph that ruins the font's texture, or reject a beautiful glyph that doesn't fit the "UI/Signage" brand promise. That is your burden, not the panel's.

  ---

  ## Part 3: Application to Live Disputes

  Here is the SSP applied to your three current disputes.

  ### Case 1: The Geometric Single-Story 'a'
  *Issue: Bowl is so closed/circular it risks reading as 'o' with a stray stroke.*

  *   **Phase 1 (Structure):** **PASS.** Single-story 'a' is valid in geometric sans. It has a stem and a bowl. Topology is correct (one counter).
  *   **Phase 2 (Context):** **FAIL.** In the Stress Word "ao", the Squint Test reveals the 'a' and 'o' share identical width and height. The 'a' tail is too subtle to register at distance. The 'a' visually collapses into the 'o'.
  *   **Phase 3 (Outsider Test):** *Skipped due to Phase 2 Failure.*
  *   **Verdict:** **REJECT.**
  *   **Reasoning:** The stylistic surface (perfect circle) has starved the structural skeleton (the differentiating tail). It fails the Differentiation Check.
  *   **Designer Fix:** Open the counter slightly or extend the tail to break the circular silhouette.

  ### Case 2: The Blackletter 'a' in a Humanist Face
  *Issue: Period charm vs. unreadable at phone sizes.*

  *   **Phase 1 (Structure):** **PASS.** It is topologically an 'a'.
  *   **Phase 2 (Context):** **PASS (with caveats).** At display sizes, it reads fine in context. The humanist neighbors support it.
  *   **Phase 3 (Outsider Test):** **FAIL.** One outsider hesitates on the word "about" at 12pt simulation. They ask, "Is that an 'a' or a weird 'u'?"
  *   **Phase 4 (Escalation):** **TRIGGERED.**
  *   **Director's Decision (You):** **REJECT.**
  *   **Reasoning:** This is the answer the designer will hate. The glyph *might* be legible in a headline, but your foundry specializes in **UI and Signage**. A blackletter form in a humanist face creates a "speed bump" for the eye in high-velocity reading environments (phones, road signs). It violates the product policy, not just the design rules. It is a beautiful letter in the wrong job.
  *   **Note:** The panel should not argue aesthetics. They flag it as "High Risk for UI." You kill it based on market fit.

  ### Case 3: The Straightened Lowercase 'l'
  *Issue: Tightened spacing makes it confusable with Capital 'I' and Digit '1'.*

  *   **Phase 1 (Structure):** **FAIL.**
  *   **Reasoning:** In the context of UI and Signage, *differentiation is part of the structure.* A lowercase 'l' that is indistinguishable from 'I' or '1' lacks the structural component of "unique identity." It is a homoglyph hazard.
  *   **Verdict:** **REJECT.**
  *   **Reasoning:** This terminates in Phase 1. No amount of stylistic justification matters. In your specific market (UI/Signage), ambiguity between letter, number, and case is a functional error, not a stylistic choice.
  *   **Designer Fix:** Add a tail, a hook, or a spur. Sacrifice the tight spacing if necessary; safety overrides density.

  ---

  ## Summary for the Panel

  1.  **Structure first:** If the parts don't add up, stop.
  2.  **Context second:** If it vanishes in a word, stop.
  3.  **Outsiders third:** If normal people stumble, stop.
  4.  **Director last:** If it works but feels wrong, pass it up.

  **Final Warning to the Panel:**
  This procedure will not stop designers from arguing. It will only give you a common language for *why* you are arguing. When a designer says, "It's an expressive take," you reply, "Phase 2 failed: the expression hid the skeleton." When they say, "It's readable," you reply, "Phase 3 failed: the outsider read it wrong."

  And when Case 2 comes back to you, Director, remember: You are not judging the letter. You are judging the product. Kill the blackletter 'a' not because it's ugly, but because it slows down the user. That is a business decision, and only you can make it.
