prompt: |-
  I've spent two years in a reading group where the evolutionary psychology wars get re-fought monthly, and the striking thing is how little the actual methodological dispute moves. Everyone on both sides now agrees on the platitudes: adaptationist hypotheses must generate testable predictions, byproducts and constraints are real alternatives to adaptation, and post hoc flexibility is a vice. Gould and Lewontin won the rhetoric of the 1979 spandrels paper in the sense that even the most committed adaptationists disavow Panglossian storytelling in principle — and yet the same fights recur over cheater-detection modules, mating-preference findings, and cross-cultural psychological claims, with nobody conceding anything. My hypothesis is that the surface methodological dispute masks a deeper one about default priors: each side agrees what would count as evidence in the abstract, but they enter every case with different background assumptions about how often complex, finely tuned psychological traits are likely to be adaptations versus byproducts, and neither prior is itself testable in the way both sides demand of hypotheses. Is that right, or is the real disagreement something else — divergent standards for what a 'prediction' is, disciplinary turf wars, or smuggled-in political commitments about human nature? Diagnose the structure of the dispute using what the parties actually claim, and tell me what, if anything, would count as progress: a methodological innovation, a shared evidential threshold, or merely accepting that the disagreement is one about reasonable priors and not about science at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user has spent two years in a reading group discussing evolutionary psychology (EP) debates.
      *   **Observation:** Surface-level methodological agreements exist (testability, byproducts exist, post-hoc storytelling is bad), yet the fights recur endlessly over specific cases (cheater detection, mating preferences, etc.).
      *   **User's Hypothesis:** The core disagreement isn't methodological but about *default priors* (Bayesian prior probabilities regarding whether a trait is an adaptation vs. a byproduct). These priors are untestable.
      *   **Task:** Diagnose the structure of the dispute using actual claims from the parties. Evaluate the user's hypothesis against alternatives (divergent prediction standards, turf wars, political commitments). Determine what would count as progress (methodological innovation, shared threshold, or accepting it's about priors).

  2.  **Deconstruct the Evolutionary Psychology Debate:**
      *   **The "Adaptationists" (EP proponents):** Cosmides, Tooby, Buss, Pinker.
          *   Core claim: The mind is a collection of domain-specific modules shaped by natural selection in the EEA (Environment of Evolutionary Adaptedness).
          *   Method: Reverse engineering. Identify a problem faced by ancestors, hypothesize a mechanism, test for it.
          *   Prior (Implicit): Complex function $\rightarrow$ Likely adaptation. Null hypothesis is often "it's an adaptation."
      *   **The "Critics" (SPS/Pluralists):** Gould, Lewontin, Kitcher, Buller, Richardson, Fodor (to an extent).
          *   Core claim: Adaptationism is too easy; byproducts (spandrels), drift, and constraints are common. The EEA is unknowable.
          *   Method: Demand rigorous phylogenetic comparison, genetic evidence, or alternative explanations before accepting adaptation.
          *   Prior (Implicit): Complex function $\rightarrow$ Could easily be a byproduct or exaptation. Null hypothesis is "it's not necessarily an adaptation."

  3.  **Evaluate the User's Hypothesis (The "Priors" Argument):**
      *   *Is it right?* Yes, largely. This aligns with the Bayesian analysis of scientific reasoning. If Side A starts with $P(Adaptation) = 0.8$ and Side B starts with $P(Adaptation) = 0.2$, the same evidence $E$ will yield different posterior probabilities.
      *   *Nuance:* It's not just "priors" in a vacuum. It's about *burden of proof*. Who has to prove what? Adaptationists say "Show me it's *not* adaptive." Critics say "Show me it *is* adaptive."

  4.  **Consider Alternative Explanations:**
      *   *Divergent Standards for 'Prediction':* Adaptationists often accept "existence proofs" (the mechanism exists) as confirmation. Critics demand "novel predictions" (predicting a phenomenon not yet observed). This is a methodological sub-component of the prior dispute.
      *   *Disciplinary Turf Wars:* Psychologists vs. Anthropologists vs. Biologists. Psychology wants universals; Anthropology wants variation. This fuels the fire but isn't the *logical* structure of the dispute.
      *   *Political Commitments:* "Blank Slate" vs. "Human Nature." If EP implies fixed gender roles, critics resist. This is a motivational factor, not necessarily the epistemic structure, though it hardens the priors.

  5.  **Diagnose the Structure (Synthesizing the above):**
      *   The dispute is indeed a **clash of burden of proof** rooted in **divergent priors**.
      *   It looks like a methodological dispute because they argue about *evidence*, but they can't agree on the *weight* of that evidence because their starting assumptions differ.
      *   Key concept: **The Adaptationist Program as a Heuristic vs. a Claim.** Adaptationists treat it as a research strategy (assume adaptation to find function). Critics treat it as an empirical claim (asserting adaptation requires proof).

  6.  **Determine What Counts as Progress:**
      *   *Methodological Innovation?* Phylogenetic comparative methods (PCM) help, but hard for psychology (no fossils of minds).
      *   *Shared Evidential Threshold?* Unlikely. The thresholds are tied to the priors.
      *   *Accepting it's about Priors?* This is the most honest path. Moving from "You are unscientific" to "We have different risk tolerances for Type I vs. Type II errors."
      *   *Real Progress:* Shift from "Is it an adaptation?" to "What is the causal structure?" (Neuroscience, genetics). If we find the gene/neural circuit, the adaptation question becomes secondary or answerable via different means.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Acknowledge the insight:* Validate the user's observation. It's a sophisticated take.
      *   *Confirm the "Priors" Hypothesis:* Explain *why* it's priors. Use the Burden of Proof framing.
      *   *Add Nuance (The "Research Strategy" vs. "Ontological Claim" distinction):* This is crucial. Tooby/Cosmides often say "It's a heuristic." Critics say "You publish it as fact."
      *   *Address the Alternatives:* Briefly touch on politics and turf wars as *reinforcers* of the priors, not the root cause.
      *   *Define Progress:*
          1.  **Formalize the Priors:** Admit the Bayesian gap.
          2.  **Shift the Ontology:** Move to neuroscience/genetics (mechanisms over stories).
          3.  **Phylogenetic Rigor:** Use comparative psychology more.
          4.  **Accept Pluralism:** Some things are adaptations, some aren't. The question is the *rate*, which is the prior.

  8.  **Refining the Tone:**
      *   Academic but accessible.
      *   Respectful of both sides (avoid taking a side).
      *   Focus on philosophy of science/epistemology.

  9.  **Self-Correction/Check during drafting:**
      *   *Did I address the "prediction" aspect?* Yes, need to mention that adaptationists often count "fit" as prediction, while critics want "novelty."
      *   *Did I address the political aspect?* Yes, acknowledge it hardens the priors (e.g., gender differences).
      *   *Is the conclusion actionable?* Yes, suggest specific shifts in discourse.

  10. **Final Polish:** Ensure the distinction between "methodological agreement in principle" and "methodological disagreement in practice" is clear. (This is the "Spandrels" legacy).

  *(Self-Correction Note)*: I should make sure to mention that the "priors" aren't just arbitrary; they are based on different readings of evolutionary biology history. Adaptationists lean on Williams (1966); Critics lean on Gould (1979). This grounds the priors in literature, not just gut feeling.

  11. **Final Output Generation** (similar to the provided good response).
answer: |-
  Your hypothesis is remarkably precise, and it cuts closer to the epistemological bone than most meta-commentary on the subject. You have correctly identified that the "methodological agreement" is largely performative. Both sides recite the same incantations about falsifiability and alternative hypotheses, but they apply them with different **burdens of proof**, which is functionally equivalent to having divergent Bayesian priors.

  Here is a diagnosis of the structure of the dispute, an evaluation of your hypothesis against the alternatives, and an assessment of what could actually constitute progress.

  ### 1. The Structure of the Dispute: Burden of Proof as Prior Probability

  You are right that the core disagreement is about **default priors**, but in the philosophy of science, this manifests specifically as a disagreement over the **Null Hypothesis**.

  *   **The Adaptationist Prior:** The working assumption is that complex, functional psychological mechanisms are likely products of natural selection. The null hypothesis is often implicitly: *"This trait is noise/random until an adaptive function is demonstrated."* Or, more generously, *"Assume adaptation as a research heuristic to discover function."*
      *   **Risk Tolerance:** They are more tolerant of Type I errors (false positives: calling a byproduct an adaptation) because they view the cost of missing a true adaptation (Type II error) as higher for the progress of the field.
      *   **Evidence Threshold:** A mechanism that fits a proposed ancestral problem well enough to generate a model is often considered sufficient provisional evidence.

  *   **The Critic's Prior:** The working assumption is that complex traits can easily arise from developmental constraints, exaptation, or drift. The null hypothesis is: *"This trait is not an adaptation until proven otherwise via rigorous phylogenetic or genetic evidence."*
      *   **Risk Tolerance:** They are more tolerant of Type II errors (missing an adaptation) because they view the cost of Type I errors (Panglossian storytelling) as scientifically corrosive.
      *   **Evidence Threshold:** "Fit" between trait and environment is not evidence; it is the *thing to be explained*. They demand independent evidence (e.g., heritability studies, cross-species comparison) that isn't circular.

  **Why the fights recur:** When an EP proponent presents a cheater-detection module, they see it as *rejecting the null* (they found a function). The critic sees it as *failing to reject the null* (they haven't ruled out a general learning mechanism). Because they disagree on what the null *is*, no amount of data regarding the specific module settles the meta-dispute.

  ### 2. Evaluating the Alternatives

  Your hypothesis holds up well against the other potential diagnoses, though those factors act as accelerants.

  *   **Divergent Standards for 'Prediction':** This is real, but it is a *symptom* of the prior dispute. Adaptationists often accept "accommodation" (explaining known data) as a form of prediction if the model is precise. Critics demand "novel prediction" (predicting unknown data). This difference exists because Adaptationists believe the theoretical framework (evolutionary theory) is robust enough to support accommodation, while Critics believe the framework is too flexible, requiring novel prediction to constrain it.
  *   **Disciplinary Turf Wars:** This is a significant sociological factor. Evolutionary Psychology often colonizes social psychology, anthropology, and sociology. When EP claims to explain kinship (anthropology) or socialization (sociology) via Pleistocene modules, it threatens the explanatory sovereignty of those fields. However, turf wars explain the *heat* of the debate, not the *logical structure*.
  *   **Political Commitments:** This is the "smuggled-in" variable. If an adaptive hypothesis implies fixed gender differences, critics with egalitarian political commitments may raise their evidential threshold for that specific claim. Conversely, adaptationists with libertarian or conservative leanings may lower theirs. This doesn't mean the science is invalid, but it means the **priors are not purely epistemic; they are value-laden.** This makes the priors even harder to shift.

  ### 3. Diagnosis: The "Heuristic vs. Ontology" Confusion

  The deepest structural flaw, which reinforces your prior hypothesis, is a category error regarding the **Adaptationist Program**.

  *   **Adaptationists (Tooby, Cosmides, Pinker)** often argue in private or methodological sections that adaptationism is a **heuristic**: "Assume it's an adaptation to see if that leads to discoveries."
  *   **Critics (Gould, Lewontin, Buller)** attack adaptationism as an **ontological claim**: "You are asserting these things *are* adaptations without proof."

  The stalemate exists because Adaptationists publish the *ontological conclusion* ("Humans have a cheater-detection module") based on a *heuristic process*, while Critics evaluate the *ontological conclusion* using *ontological standards*. The Adaptationists feel the Critics are stifling research; the Critics feel the Adaptationists are publishing speculation as fact.

  ### 4. What Would Count as Progress?

  If the disagreement is indeed about untestable priors, standard "more data" approaches will fail. Progress requires shifting the terrain.

  **A. Formalizing the Priors (The Bayesian Solution)**
  Progress would look like an explicit admission of the prior divergence. Instead of arguing about whether a specific study proves a module, the debate should shift to: *"Given our current knowledge of human neuroplasticity, what is the reasonable prior probability that this specific cognitive task is domain-specific?"*
  *   **Innovation:** Pre-registering not just hypotheses, but the **evidential thresholds** required to accept them. If both sides agreed beforehand on what likelihood ratio would be needed to shift the prior, the fights would become quantitative rather than qualitative.

  **B. Shifting the Ontology (The Mechanistic Solution)**
  The EP wars are fought at the level of **function** (what is this for?) rather than **mechanism** (how does this work?).
  *   **Progress:** Neuroscience and genetics bypass the adaptationist debate. If we identify a specific neural circuit or genetic variant associated with "cheater detection," the question changes from "Is this an adaptation?" to "How did this circuit develop?"
  *   **Why it helps:** It forces the Adaptationists to ground modules in biology (raising their bar) and forces Critics to engage with physical mechanisms rather than logical possibilities of byproducts.

  **C. Phylogenetic Comparative Methods (The Biological Solution)**
  Evolutionary biology resolved similar debates not by arguing priors, but by building better trees.
  *   **Progress:** Evolutionary Psychology needs to become more comparative. If a "module" is truly an adaptation to the EEA, we should see graded variations in related primates or correlations with specific ecological pressures across human cultures.
  *   **Threshold:** A shared agreement that **convergent evolution** or **phylogenetic independence** is the only valid evidence for adaptation, ruling out "just-so stories" about the Pleistocene.

  **D. Accepting the Pluralism (The Philosophical Solution)**
  The most mature outcome is accepting your hypothesis: **The disagreement is about reasonable priors, not science itself.**
  *   **Progress:** Acknowledging that "Adaptationism" and "Spandrelism" are risk-management strategies.
      *   If you want to generate hypotheses quickly, use the Adaptationist prior.
      *   If you want to ensure robustness and avoid error, use the Critic's prior.
  *   **Outcome:** The field stops treating the other side as "unscientific" and starts treating them as representing different **error-cost functions**.

  ### Verdict

  Your hypothesis is correct. The methodological dispute is a proxy war for a Bayesian disagreement about the base rate of adaptation in the human mind.

  **True progress will not come from winning the argument.** It will come from:
  1.  **Mechanistic Grounding:** Moving from functional speculation to neural/genetic identification.
  2.  **Explicit Priors:** Admitting that the disagreement is about the burden of proof, not the data.
  3.  **Comparative Rigor:** Demanding phylogenetic evidence rather than EEA reconstruction.

  Until then, your reading group is correct: you are witnessing two different epistemic risk-assessments talking past each other, disguised as a fight about evidence.
