      *(Self-Correction during drafting)*: I need to be careful not to imply metrology *solves* the philosophical problem. Metrology *dissolves* it by operationalizing. The philosopher asks "Is it *really* a heap?" The chemist asks "Does it meet the method specification?" I must highlight this divergence in the verdict.

      *(Refining Point 1)*: Guard-banding is a decision rule to manage risk. Truth-value gaps are semantic. I need to make sure I don't conflate "we can't decide" with "it has no truth value."
      *(Refining Point 2)*: The Epistemicist cutoff is not just a spec limit. It's a fact about the world/language. In metrology, the spec limit is arbitrary (customer requirement). The "true value" is the physical reality. Epistemicism says the *meaning* determines the cutoff. This is subtle. I will map it to the "True Value of the Measurand" but emphasize the "in principle unknowable" aspect matches "Limit of Detection" logic only loosely. Actually, a better fit for Epistemicism is the *concept* of a True Value that exists independently of measurement capability.

      *(Refining Point 3)*: Precisifications. Are they calibration protocols? Yes, effectively. Different ways to operationalize "heap." But are they different *measurands*? If I define heap as >100 grains vs >1000 grains, have I changed the measurand? In ISO terms, yes. In Supervaluationism, no, it's the *same* concept sharpened. This is a tension point.

