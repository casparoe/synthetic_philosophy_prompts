answer: |-
  **Scenario: Stage One**

  Maya stands in the cafeteria line, tray in hand, eyeing the grilled chicken, the beef stew, and the lentil loaf. As a hedonic act utilitarian committed to minimizing suffering, she runs the numbers she's memorized from welfare reports: the chicken endured a cramped, painful life, and because a bird yields so little meat, her single serving accounts for perhaps one-hundredth of a life; the cow suffered too, though its pasture access mitigated some distress, yet because a carcass yields hundreds of servings, her portion represents merely one-thousandth of a life; the lentils spared domesticated animals but required harvesting that inevitably killed field mice and insects, a toll she estimates conservatively but cannot ignore. She assigns a moral weight to the chicken's intense suffering, a lower weight per unit time to the cow's, and an uncertain but non-zero weight to the wild creatures crushed by combines. When she sums the expected disutility—multiplying the probability of sentience by the intensity of suffering and dividing by the number of meals per animal—the beef stew emerges as the option with the lowest expected suffering count, purely because the sheer volume of meat per cow dilutes the moral cost of that single death across so many plates, whereas the lentil loaf carries the hidden burden of countless small wild deaths she feels compelled to count.

  **Expected-Suffering Comparison**

  | Option | Domesticated Lives/Meal | Wild Lives/Meal (Est.) | Suffering Intensity Weight | Expected Disutility (Relative) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Chicken** | ~0.02 (1 life / 50 meals) | Negligible | Very High (factory conditions) | **Highest** |
  | **Beef** | ~0.002 (1 life / 500 meals) | Negligible | Moderate/High (feedlot/pasture) | **Lowest (Conditional)** |
  | **Lentils** | 0 | ~0.005 (Uncertain) | Variable (Invertebrate vs. Rodent) | **Middle (Conditional)** |

  *   **Uncertainty Flag:** The verdict hinges entirely on the "Wild Lives/Meal" column for the lentils. If Maya assigns significant moral weight to insects or field rodents killed during harvest (e.g., via combine machinery or pesticides), the lentil disutility rises. If she assigns near-zero weight to invertebrates or assumes modern harvesting minimizes rodent death, the lentil disutility drops below beef.
  *   **Dependency:** The beef-over-chicken result is robust (based on solid biomass ratios). The beef-over-lentil result is fragile; it holds only if her credence in wild animal sentience and the magnitude of field deaths is sufficiently high to outweigh the 0.002 share of a cow's life. If field deaths are negligible, the vegan option wins.

  **Scenario: Stage Two**

  But Maya is not eating alone; she sits with five fellow volunteers from the campus animal-welfare group, all of whom have been struggling to maintain their vegan commitments amidst exam stress. She knows her choices are observed and interpreted as signals of what is permissible; if she orders the beef, two wavering members might rationalize their own return to meat, multiplying the demand for chicken and beef by a factor far exceeding her single meal, while the group's cohesion frays as their shared normative standard dissolves. Conversely, ordering the lentils reinforces the group's resolve, potentially preventing dozens of future animal meals through sustained advocacy and peer support, even if the lentils themselves carried a hidden field-death toll. Applying act utilitarianism to this broader causal web, the marginal benefit of saving a fraction of a cow today is dwarfed by the expected suffering caused by undermining the movement's credibility tomorrow, forcing her to pick up the lentil loaf despite her local calculus.

  **Pedagogical Analysis**

  **1. Features Doing the Work**
  *   **Stage One (Per-Meal Arithmetic):** The driving feature is the *dilution effect*. Because a cow provides significantly more caloric mass than a chicken, the moral cost of the death is amortized over more meals. This isolates the act from its social context and focuses strictly on the direct causal chain between purchase and animal death/suffering.
  *   **Stage Two (Observational Entanglement):** The driving feature is *signaling and precedent*. The act is no longer isolated; it is a public performance within a specific community. The consequences expand from the immediate supply chain to the behavioral changes of observers (the other volunteers).

  **2. Removal of Features**
  *   **If Per-Meal Arithmetic is Removed:** If we reason *per-life* (e.g., "killing is the harm regardless of yield") or if the suffering intensity of the cow is deemed so vastly superior to the chicken that it outweighs the ratio, the beef option loses in Stage One immediately.
  *   **If Observational Entanglement is Removed:** If Maya eats alone or among indifferent strangers, the social costs vanish. The verdict reverts to the Stage One calculus (Beef), assuming the wild-animal credences hold.

  **3. Utilitarian Critic Attacks**
  *   **Per-Life vs. Per-Meal:** A critic might argue that the harm is the *termination of a life project*, not just the suffering endured. If death is a distinct harm, the number of meals derived from the corpse is irrelevant; one death is one death. This collapses the beef advantage.
  *   **Dairy Entanglement:** Beef production is often inextricably linked to the dairy industry (male calves culled, dairy cows slaughtered for beef). A critic would argue that purchasing beef supports this dual system, effectively adding the suffering of dairy cows and killed calves to the beef meal's ledger, skyrocketing the expected disutility.
  *   **Invertebrate Weighting:** The Stage One verdict relies on high moral weight for field insects/rodents. A critic could argue that the probability of insect sentience is low enough, or their capacity for suffering minimal enough, that the "wild animal" term should be discounted to near zero. This restores the vegan option as the clear winner in Stage One.
  *   **Moral Weights Across Species:** The scenario assumes the cow's suffering per unit time is comparable to or lower than the chicken's. A critic could press that the *intensity* of suffering in a feedlot (for beef) is so extreme, or the life so deprived, that even 1/500th of it outweighs the vegan option's uncertain field deaths.
