prompt: |-
  My friend has been going down a decision-theory rabbit hole (podcasts, LessWrong, the whole thing) and tried to explain acausal trade to me like this: "It's the idea that two agents who can't communicate at all can still strike a bargain. Each one simulates the other, sees that the other will keep its end of the deal, and so keeps its own end — the bargain is enforced purely by mutual prediction instead of any causal signal. Since the agents can simulate each other perfectly, the deal is guaranteed to go through, and it works across light-years with nothing exchanged, so it's basically cooperation that travels faster than light. This also settles the one-shot prisoner's dilemma: if you're rational and can predict the other player, you should cooperate, and defection is just what agents do when they can't do game theory properly. And the punchline is we should already be acting on this — sacrificing resources now for hypothetical distant superintelligent civilizations, since they'd do the same for us, so acausal trade with aliens we'll never meet is exactly as rational as an ordinary contract."

  Some of this sounded too good to me, but I genuinely can't tell which parts are the actual view and which are just his enthuasiasm. Can you go through it bit by bit — what's a fair statement of what proponents claim, where he's overstating or conflating things, and whether that last conclusion about helping distant aliens actually follows from the defensible core?
