answer: |-
  The DSM's polythetic structure presupposes a pragmatic operationalism that covertly relies on latent variable essentialism for validity while employing prototype-like boundaries for reliability, making its claimed "atheoretical" stance philosophically incoherent.

  The polythetic format (e.g., 5 of 9) appears to endorse family resemblance, but the existence of a specific threshold implies a quantitative underlying trait rather than mere overlapping similarities; if the category were purely Wittgensteinian, there would be no logical justification for a magic number that separates "disorder" from "non-disorder" other than pragmatic convention. This threshold structure functions best under a latent variable model, where symptoms are fallible indicators of a single underlying construct (the essence), and meeting the threshold suggests a high probability that the latent cause is present. However, the Major Depressive Disorder carve-out (requiring mood or anhedonia) contradicts a pure latent indicator model where all symptoms should be theoretically interchangeable based on loading; instead, it adopts a prototype theory structure, acknowledging that some features are cognitively central to the category while others are peripheral.

  The DSM's insistence on being "descriptive" and "atheoretical" is a methodological defense designed to maximize inter-rater reliability by avoiding etiological disputes, but it fails ontologically because the selection of specific criteria inherently theorizes that these particular behaviors cluster together due to a shared underlying condition rather than random coincidence or social construction. You cannot define a medical or psychological kind without committing to a view of what binds the members together, whether that be a common cause (essentialism), a functional role (functionalism), or pragmatic utility (nominalism); the DSM attempts to have the validity benefits of essentialism while avoiding the evidentiary burden of proving the essence exists.

  When researchers push for dimensional models (such as HiTOP or RDoC), they are primarily rejecting the categorical assumption that mental disorders are natural kinds with discrete boundaries. This shift abandons the search for a specific disorder essence that patients either "have" or "don't have," replacing it with continuous trait distributions or network models where symptoms causally interact without necessarily stemming from a single latent disease entity. Consequently, the dimensional turn rejects the latent variable presupposition of the DSM's polythetic criteria, arguing that the heterogeneity allowed by the 5-of-9 structure is not evidence of a single complex essence, but evidence that the category itself is invalid.
