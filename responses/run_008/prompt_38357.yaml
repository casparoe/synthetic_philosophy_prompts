  4.  **[Paragraph 3, Doomsday Argument]** **Credit Lost (0/5):** Complete reversal. The Doomsday Argument is the canonical argument *for* SSA, not SIA. DA relies on SSA reasoning (your birth rank is a random sample from all humans). SIA is standardly used as the *rebuttal* to Doomsday (because SIA favors larger populations, it cancels the DA shift). Attributing DA to SIA undermines the entire theoretical framework discussed in the seminar.

  5.  **[General]** **Note:** While the prose is smooth, the conceptual mapping between SSA/SIA and their respective implications (PP vs. DA) is inverted on half the material. You have treated SSA as a weaker version of SIA, rather than a distinct assumption with opposite implications in these key cases.

