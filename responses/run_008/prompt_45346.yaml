answer: |-
  You have independently rediscovered a central problem in **Evolutionary Epistemology**, specifically the framework developed by the social psychologist **Donald Campbell**.

  The short answer to your first question is that there is no single, universally standardized noun for the *migration* itself, but the mechanism you describe is formally known as **Blind Variation and Selective Retention (BVSR)**, and the specific phenomenon of the rat pausing is **Vicarious Trial and Error (VTE)**.

  However, your intuition that these form a single historical continuum is the cutting edge of the field. Here is the breakdown of the literature, the terminology, and the answers to your specific structural questions.

  ### 1. The Name and the Literature
  The overarching framework is **Evolutionary Epistemology (EE)**.
  While Karl Popper popularized the idea that "our conjectures die in our stead," it was **Donald Campbell (1974)** who formalized the idea that this is not a metaphor, but a literal, continuous mechanism. He argued that the same logical process (BVSR) operates at the level of genes, neural pathways, individual thought, and scientific culture.

  *   **The Loop:** You identified it perfectly: *Variation → Selection → Retention.*
  *   **The Migration:** Campbell called this the **"substitution of death by error."** As you move up the ladder, the "selection" event happens earlier in the causal chain, further decoupled from actual biological death.

  **The Specific Term for the Rat:**
  The behavior you observed in the rats (pausing, swaying, sampling with the head) has a specific name in behavioral neuroscience: **Vicarious Trial and Error (VTE)**.
  *   **Origin:** Coined by Edward Tolman (1948).
  *   **Mechanism:** Modern neuroscience (e.g., work by David Redish) confirms that during VTE, the rat's hippocampus is "replaying" potential futures. The rat is physically running the maze in its head. The "cost" is metabolic and temporal, not physical safety.
  *   **Significance:** VTE is the empirical bridge between Rung 2 (body in world) and Rung 3 (simulation in head).

  ### 2. Are the Rungs Cumulative?
  **Yes.** The literature treats this as **scaffolding**, not replacement.

  Daniel Dennett, in *From Bacteria to Bach and Back*, provides the best account of this. He argues that higher rungs do not delete the lower rungs; they **subvene** them.
  *   **The Chess Player:** Your brother still runs the "rat's mechanisms." His basal ganglia and hippocampus are still doing VTE. The "board in his head" is a sophisticated simulation built on top of the older sensorimotor loop. If he becomes tired or stressed (cognitive load), he regresses to Rung 2 (impulsive moves) or Rung 1 (instinctual fear).
  *   **The Student:** The spreadsheet does not replace the student's brain; it acts as an **exocortex**. The student is still the selector, but the "variation" generation is offloaded to the software's logic.

  **Key Concept:** **Competence without Comprehension.** (Dennett). The lower rungs provide the "competence" (the ability to navigate) which the higher rungs then "comprehend" and optimize. You cannot have the chess player without the rat; the chess player is a rat with extra layers of inhibition and simulation.

  ### 3. Degree or Kind?
  This is the most debated question in cognitive science, but the consensus leans toward **Degree of Decoupling.**

  The metric is **how far the selection event is decoupled from the fitness consequence.**
  *   **Rung 1:** Selection = Death/Infertility. (Zero decoupling).
  *   **Rung 2:** Selection = Wasted Energy/Time. (Low decoupling).
  *   **Rung 3:** Selection = Cognitive Dissonance/Processing Time. (High decoupling).
  *   **Rung 4:** Selection = Ink on Paper / Digital Error Message. (Maximum decoupling).

  It is a difference of degree that becomes so large it *functions* as a difference of kind. The "kind" shift happens when the environment becomes **symbolic**. When your student uses a spreadsheet, they are interacting with a formal system that has its own internal logic (math) independent of the biological world. This is the realm of **Popper's "World 3"** (objective knowledge), but grounded in the biology of **Extended Cognition** (Clark & Chalmers, 1998).

  ### 4. Where are the Edges? (The Rat and The Pilot)
  You asked about the awkward positions. The literature has specific handles for these.

  **The Pausing Rat (Between Rung 2 and 3):**
  This is the **VTE Threshold**.
  *   **Definition:** The moment motor output is inhibited, but the motor cortex is still active.
  *   **Why it's awkward:** It is "embodied simulation." The rat is not yet fully abstract (Rung 3), but it is no longer purely reactive (Rung 2). It is testing the world *using* the world (its own body) as the model.
  *   **Verdict:** This belongs to Rung 3 (Internal Simulation), but it is the *primitive* end of it. It relies on proprioception, not symbols.

  **The Pilot with a Checklist (Between Rung 3 and 4):**
  This is **Distributed Cognition** (Edwin Hutchins, *Cognition in the Wild*).
  *   **Distinction from the Chess Player:** Your brother visualizing a move is **Internal Simulation** (Rung 3). The pilot using a checklist is **Externalized Cognition** (Rung 4).
  *   **Why it matters:** The checklist is a **social artifact**. It contains the "errors" of past pilots (the bodies that paid the bill). The pilot is not just simulating; they are outsourcing memory and logic to a tool designed by a committee.
  *   **Verdict:** This is Rung 4. It differs from the chess player because the "selection" is enforced by the protocol, not just the individual's imagination. The checklist prevents the error from even entering the imagination.

  ### 5. A Proposed Definition (If you need a label)
  Since no single term captures the *migration of cost* specifically, I suggest adopting Campbell's terminology but refining it for your course. You might call it:

  **The Hierarchy of Error Decoupling**
  *   **Definition:** A continuum of adaptive systems wherein the selection phase of the Variation-Selection-Retention loop is progressively decoupled from the ultimate fitness consequences.
  *   **Criterion for inclusion:** Any system where a "failure" can occur without terminating the system's ability to reproduce or continue operating.
  *   **Criterion for ranking:** Ranked by the *fidelity* of the model used for testing. (Genome → Body → Neural Map → External Symbol).

  ### Summary for your Syllabus
  If you want to give your students the "well-drawn concept" you requested:

  1.  **The Algorithm:** Blind Variation and Selective Retention (BVSR).
  2.  **The Trend:** The Substitution of Death by Error (Campbell).
  3.  **The Mechanism:** Vicarious Trial and Error (VTE) for the biological bridge.
  4.  **The Extension:** The Extended Mind Thesis for the tool bridge.
  5.  **The Takeaway:** Intelligence is not the absence of error; it is the ability to make errors *cheaper* and *earlier*.

  **Recommended Reading for You:**
  *   **Donald Campbell:** "Evolutionary Epistemology" (1974). This is the source code for your observation.
  *   **Daniel Dennett:** *From Bacteria to Bach and Back*, Chapter 4 & 5. (Explains the cumulative layering).
  *   **Edward Tolman:** "Cognitive Maps in Rats and Men" (1948). (The origin of VTE).
  *   **Edwin Hutchins:** *Cognition in the Wild*. (For the pilot/checklist/instrument aspect).

  You have correctly identified that "thinking" is just natural selection running at a higher clock speed with cheaper components. The rat is doing evolution; the student is doing evolution; the spreadsheet is doing evolution. The only thing that changes is who pays the bill.
