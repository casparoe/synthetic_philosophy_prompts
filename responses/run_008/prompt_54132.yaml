  ### The rule(s) she's running

  Her ontology splits based on category. For inanimate objects (ships, axes), she prioritizes **continuous functional history** over material composition. The Ship of Theseus remains the same because the function never ceased; the repaired ship beats the plank-ship because it maintained the narrative of use. Even disassembly doesn't kill identity if the *intent* is restoration (the stored planks case). However, for social collectives (bands), she switches to **constituent identity**. A band is defined by its specific human members; replace them, and the "soul" of the group dies, regardless of name or style. Matter matters for people; history matters for things. She treats objects as verbs (doing) and groups as nouns (being).

  ### Verdicts on my three cases

  1. **The Collector's Ship:** She'll call it a copy. This mirrors the Hobbes "plank-ship" scenario. When the *Aspasia* was scrapped and timbers sold as beams, its functional history died. The teleology shifted from "vessel" to "architecture." Reassembling them is resurrection, not continuation. The 60% original wood doesn't override the death of the object's purpose. Unlike the "stored planks" case, there was no intent to preserve the ship during its barn life. The wood was repurposed, not paused.
  2. **The Replica:** Definitely a copy. No original matter, no continuous history. It's a painting of a ship, not the ship. Plans are instructions, not identity.
  3. **The Barn Timbers:** They are relics, not the ship. Just as the discarded planks in the Hobbes variant weren't the "original ship" while sitting in a pile, these beams are merely remains. The *Aspasia* ceased to exist in 1902.

  She will argue that identity requires an unbroken chain of *being a ship*. The barn beam interlude breaks that chain. You cannot be a ship while serving as a barn wall. The Collector hasn't found the *Aspasia*; he's built a monument using its corpse. The wood remembers, but the ship does not. Like a human skeleton in a museum, the timbers are part of the history, but they are not the entity.

  ### My best guess on where she'll dig in

  She'll dig in on the definition of "scrapped." If you argue the timbers were "preserved" rather than "discarded," she might waver, but her Hobbes verdict suggests she values the active life of the object. She will insist that becoming barn beams was a category error that killed the ship's identity. You can't pause being a ship by becoming a roof. The emotional core for her is the *life* of the ship, not the wood.

  ### The case that would settle it

  Test case: A ship sinks in 1902, sits intact on the seabed (no function), and is raised in 1950. Is it the same ship? This isolates "functional continuity" from "material continuity." If she says "yes," function isn't required, only material integrity. If "no," then active use is essential, killing your collector's plot. This splits the "stored planks" (intent) from the "sunk ship" (accident). It tests whether "pause" requires human intent or just material stasis.
