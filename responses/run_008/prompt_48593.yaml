answer: |-
  Here is the specification for a theory of individual contributions to collective harms. This is designed to settle the debate by forcing the theory to survive contact with reality, not just intuition.

  ### I. The Test Cases
  *A viable theory must output a verdict on these without choking.*

  1.  **The Razor-Thin Election:** An election decided by 0 votes (a tie) or 1 vote.
      *   *Requirement:* Must explain why voting is rational even when the probability of pivotality is 1 in millions, but not magical.
  2.  **The Millionth Hamburger:** Industrial supply chains operate on bulk thresholds (e.g., a crate of 1,000 patties).
      *   *Requirement:* Must handle "probabilistic triggering." Your purchase probably does nothing, but has a small chance of triggering a bulk order that kills $X$ animals.
  3.  **The Transatlantic Flight:** CO2 is a stock pollutant; one flight adds a negligible amount to a global stock.
      *   *Requirement:* Must acknowledge that one flight does not causally trigger a specific climate disaster, yet still assess the moral weight of the emission.
  4.  **The Polluted Stream (Overdetermination):** A stream is already toxic enough to kill fish. You pour in one cup of poison. The fish die either way.
      *   *Requirement:* Must explain why this is still wrong (or why it isn't) without relying on the outcome (since the outcome is fixed).

  ### II. The Distinctions
  *A viable theory cannot collapse these concepts.*

  1.  **Harmless-by-Itself vs. Trivially-Harmful:**
      *   *Case:* Dropping a grain of sand on a scale (harmless) vs. adding 0.0000001°C warming (trivial harm).
      *   *Constraint:* Don't treat continuous harms as if they have zero impact just because they are imperceptible.
  2.  **Making a Difference vs. Joining In:**
      *   *Case:* Being the pivotal voter vs. being one of 51% in a landslide.
      *   *Constraint:* Distinguish between *causing* the outcome and *being part of the group* that caused it.
  3.  **Expected Value vs. Actual Difference Made:**
      *   *Case:* Buying a lottery ticket (high EV, usually zero actual return) vs. finding $20 (zero EV, high actual return).
      *   *Constraint:* Moral assessment should track ex-ante rationality, not just ex-post luck.
  4.  **Participation without Causation:**
      *   *Case:* Joining a firing squad where only one gun has live ammo (unknown which).
      *   *Constraint:* Must explain blameworthiness when causal contribution is null.

  ### III. The Plain Facts
  *A viable theory cannot contradict established mechanics.*

  1.  **Physics:** One flight's emissions do not change the climate trajectory in a measurable way. (Theories claiming your flight *causes* a hurricane are lying).
  2.  **Math:** Elections *do* occasionally come down to one vote, but it is statistically rare.
  3.  **Economics:** Meat is produced in lumpy batches, not atom-by-atom. There are trigger points in supply chains.

  ### IV. The Tension Pairs (The "Break Points")
  *These are pairs of desiderata that are likely incompatible. A theory usually has to sacrifice one to save the other.*

  1.  **Threshold Sensitivity vs. Non-Arbitrariness:**
      *   *Tension:* If you say the 1,000,000th burger triggers harm but the 999,999th doesn't, you make morality arbitrary. If you say they are equal, you ignore the economic reality of bulk ordering.
      *   *Risk:* Making the last person a "monster" and the second-to-last "innocent."
  2.  **Causal Truth vs. Moral Obligation:**
      *   *Tension:* If you admit the plain fact that "my flight changes nothing" (Causal Truth), it is incredibly hard to generate a "you ought not fly" (Moral Obligation) without appealing to vague notions of "purity."
      *   *Risk:* Either lying about causation to save morality, or accepting causation and killing morality.
  3.  **Individual Rationality vs. Collective Disaster:**
      *   *Tension:* It is individually rational to fly/eat meat (high benefit, near-zero personal cost/risk), but collectively disastrous.
      *   *Risk:* A theory that demands individual sacrifice without individual impact looks like superstition.

  ### V. Scorecard: The Two Contenders

  **Contender A: Expected Utility (Causal/Consequentialist)**
  *   *Mechanism:* Calculates (Probability of triggering harm × Magnitude of harm).
  *   **Election:** **Pass.** (Low prob × High value = Positive EV).
  *   **Burger:** **Pass.** (Acknowledges probabilistic thresholds; expects ~1 animal killed per X burgers bought).
  *   **Flight:** **Fail/Struggle.** (Continuous harm makes probability 1, but magnitude per person is near-zero. Hard to generate strong obligation).
  *   **Stream:** **Fail.** (Outcome is identical with or without you; causal impact is zero. Theory says action is permissible).
  *   **Tuesday Action:** "Calculate the odds. If the EV is negative, don't do it."

  **Contender B: Non-Causal Participation (Complicity/Integrity)**
  *   *Mechanism:* Focuses on what you are *doing* (joining a harmful practice), not what you *cause*.
  *   **Election:** **Pass.** (Voting is participating in democracy, regardless of pivotality).
  *   **Burger:** **Pass.** (Buying meat makes you a customer of the killing industry).
  *   **Flight:** **Pass.** (You are participating in the carbon economy).
  *   **Stream:** **Pass.** (Pouring poison is wrong even if the fish were already dead).
  *   **Tuesday Action:** "Don't get your hands dirty."
  *   **Weakness:** Struggles to explain *why* participation matters if it changes nothing. Risks becoming about moral purity rather than harm reduction.

  ### VI. The Killer Desideratum
  **The Overdetermination Constraint (The Polluted Stream).**

  This knocks out the most theories.
  *   **Why:** Pure Causal/Consequentialist theories (Contender A) crumble here. If the fish die anyway, your action caused no harm. If "no harm, no foul," then poisoning the stream is permissible. Almost no one accepts this conclusion.
  *   **The Cost:** To survive this, a theory must admit that **causation is not the only source of moral obligation.** This forces Causal theories to borrow from Participation theories, or die.

  ### VII. The Tuesday Verdict (Actionability)

  You asked for what to do on a Tuesday. Here is the synthesis required to win the argument and live the life:

  **The Theory You Want:** **Probabilistic Expected Utility + Complicity Heuristic.**

  1.  **For Supply Chains (Burgers/Eggs):** Use **Expected Utility**. The economics are lumpy. Your purchase has a real, non-zero probability of triggering a bulk order.
      *   *Tuesday Action:* Skip the burger. The math works. Your brother-in-law is wrong here; individual purchases *do* have expected causal impact.
  2.  **For Continuous Harms (Flights/Climate):** Use **Complicity**. Admit the plain fact: Your flight does not change the climate outcome. Do not lie and say "my flight causes a hurricane." Instead, argue: "I refuse to rent space on a lifeboat that is sinking, even if my weight doesn't sink it."
      *   *Tuesday Action:* Fly if you must, but don't claim it's harmless. Acknowledge it as a "necessary evil" or "complicity," not a neutral act.
  3.  **For Voting:** Use **Expected Utility**. The payoff is huge, the cost is low. Even 1 in a million odds are worth it.
      *   *Tuesday Action:* Vote.

  **How to beat your brother-in-law:**
  Tell him: "You're right that my single flight doesn't change the climate physics. But you're wrong that my burger doesn't matter, because supply chains have triggers. And even if I changed nothing, I'm not going to be the guy pouring poison in a dead stream just because the fish were already gone. Causation isn't the only thing that matters."

  **Winner:** **Contender B (Participation)** wins on the *Stream* and *Flight* (honesty about physics). **Contender A (EU)** wins on the *Burger* (economic reality). **Use the hybrid.**
