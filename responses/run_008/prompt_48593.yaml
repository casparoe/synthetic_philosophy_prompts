prompt: |-
  been going back and forth with my brother in law about whether one person's flight or one burger actually does anything, and before I pick a side I want the spec written down first. What does a theory of individual contributions to collective harms have to get right? Give me the desiderata -- the cases it must handle (voting in a large election, the millionth hamburger vs being the only customer, one transatlantic flight, throwing your trash in a stream that's already polluted), the distinctions it can't collapse (harmless-by-itself vs trivially-harmful, making a difference vs joining in, expected value vs actual difference made, participation without causation), the plain facts it has to stay consistent with (no single flight changes the climate, elections occasionally come down to one vote, meat gets produced at a certain scale for a reason), with the case or consideration behind each. And flag pairs of desiderata you suspect can't be jointly satisfied -- like getting both "my vote can matter because elections are sometimes razor thin" and "my hamburger doesn't matter even though the feedlot exists because enough people buy meat" without smuggling in an arbitrary threshold, or getting threshold sensitivity without saying the last person to buy the ticket is a monster while everyone before them is fine. Then very briefly score the two obvious contenders, expected-utility style accounts and non-causal "you're participating in it" accounts, against the list, and tell me which single desideratum knocks out the most theories. The bar is: good enough to tell me what to actually do on a Tuesday, not just to redescribe the puzzle.
