      *   *Equality of Resources (Dworkin):* Everyone gets the same share of external/internal resources.
          *   *Story:* The handicaps actively *destroy* resources (intelligence, beauty, strength). Dworkin's "envy test" would fail hard here. No one would envy the handicapped, but they also wouldn't choose to be handicapped if given a choice. It's negative redistribution.
      *   *Equality of Capabilities (Sen/Nussbaum):* Everyone has the same real freedom to function and achieve.
