      *   He wasn't reading Dworkin or Sen (who wrote later).
      *   So, is it a strawman? Yes, regarding *philosophical* egalitarianism.
      *   Is it a satire of *populist* or *political* rhetoric about equality? Yes.
      *   Is it about tyranny using equality as an *excuse*? Yes. This is the nuance. The regime isn't *actually* about justice; it's about control.

