      *   *Decision:* The prompt asks me to be honest. If the show's thesis is institutional, the verdict should reflect that. "none — institutional fatalism instead" fits the user's suspicion ("maybe Hamsterdam isn't an argument for any drug regime at all").

  9.  **Review against Constraints:**
