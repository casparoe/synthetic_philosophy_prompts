answer: |-
  Here is an analysis of the Hamsterdam arc designed for your applied ethics closing session, structured to address your specific pedagogical concerns.

  ### 1. What Hamsterdam Actually Models
  Your worry is well-founded: Hamsterdam is not a fair test of the Portuguese model nor of regulated legalization. It is best understood as **geographic containment via de facto decriminalization.**

  *   **Vs. Portugal:** Portugal decriminalized *possession* and *use*, but drug *trafficking* remained criminal. Crucially, it paired this with "Dissuasion Commissions" and immediate access to treatment. Hamsterdam decriminalizes *dealing* within the zones while offering no initial administrative framework or treatment infrastructure. It creates a free-trade zone for illicit narcotics.
  *   **Vs. Legalization:** Legalization implies state regulation of supply, quality control, taxation, and age restrictions. Hamsterdam leaves the supply chain entirely in the hands of the Barksdale/Stansfield organizations. There is no consumer safety, only police non-interference.
  *   **The Verdict on Fairness:** The arc stacks the deck against reform. By showing open-air use, public defecation, and violence *within* the zones, it presents a caricature of "no rules" rather than a regulated health approach. It tests **harm-reduction-without-sanction** (tolerance without support), which is the weakest version of reform. If your students conclude "decriminalization creates hellscape," they have misunderstood Portugal but correctly understood Hamsterdam.

  ### 2. What It Dramatizes Well About Prohibition
  Despite the flawed model, the arc offers a devastating critique of prohibitionist logic, specifically regarding **systemic incentives.**

  *   **The Balloon Effect:** The show visualizes the economic reality that demand is inelastic. When Colvin cracks down on corners, the trade moves; when he opens the zones, the trade concentrates. Prohibition does not reduce volume; it dictates geography.
  *   **The Statistics Game (CompStat):** The arc exposes how prohibition distorts policing. Officers arrest users to clear stats, not to reduce harm. Colvin's experiment proves that when you stop arresting for possession, crime statistics (robbery, homicide) in the *rest* of the district plummet because police resources are freed to solve violent crimes rather than process low-level drug offenses.
  *   **Violence Economics:** The arc demonstrates that violence in prohibition is primarily territorial. By granting the dealers recognized territory (the zones), Colvin removes the need for them to fight for corners in residential neighborhoods. The violence doesn't vanish; it is contained, proving that the bloodshed is a feature of the *black market*, not necessarily the pharmacology.

  ### 3. Where the Work Resists the Policy Reading
  You are correct to suspect the show's thesis is institutional, not pharmacological. Hamsterdam is not destroyed because the drugs kill people (they do, but that was happening before); it is destroyed because **it becomes politically inconvenient.**

  *   **The Institutional Kill Shot:** The experiment works by its own metrics (crime down, streets quiet). It ends because a mayoral candidate (Carcetti) needs a wedge issue and a police major (Rawls) needs to protect his career.
  *   **The Lesson:** The arc argues that rational policy cannot survive irrational political incentives. If you teach this as an argument for Portuguese-style decriminalization, you miss *The Wire's* darker point: even if the policy is sound, the institution (City Hall) will sacrifice it for optics. The failure is not criminological; it is bureaucratic.

  ### 4. Key Scenes for Evidence
  *   **Colvin briefing the Majors (Episode 3.04):** Colvin draws the map. *Evidence:* This is the utilitarian calculus. He explicitly argues for sacrificing the zones to save the neighborhoods. It frames the policy as a triage decision, not a moral endorsement of drugs.
  *   **The "Free Zone" Montage (Episode 3.05):** Quick cuts of public use, overdoses, and squalor. *Evidence:* This is the visual argument against "tolerance without treatment." It shows the moral cost of containment. It is the scene that scares policymakers.
  *   **Bubbles and Johnny in the Zone (Episode 3.07):** Bubbles navigates the danger to find Johnny. *Evidence:* This humanizes the "collateral damage." It shows that for the addict, the zone is not freedom; it is a cage. It highlights the lack of exit ramps.
  *   **Colvin at the City Council (Episode 3.11):** Colvin defends the program to politicians who never visited the site. *Evidence:* This demonstrates the epistemic gap. The politicians see headlines; Colvin sees results. It proves the policy died due to distance from reality.

  ### 5. The Moral Argument Regarding Addicts
  The show's treatment of addicts in the zones is a moral argument about **abandonment versus care.**

  *   **Containment:** Initially, the zones function as human storage. The police look away while people degrade. This is harm reduction only for the *neighborhood* (quieter streets), not for the *user*. It treats addicts as inevitable waste to be managed, not citizens to be healed.
  *   **The Shift:** Only later, when Dr. Levy brings in needles and methadone, does the model approach ethical harm reduction. The arc suggests that tolerance without treatment is merely segregation. The moral failure of Hamsterdam isn't that drugs were allowed; it's that dignity was not offered alongside the tolerance.

  ### 6. What Fiction Contributes That Policy Literature Doesn't
  Policy papers deal in aggregate data (overdose rates, arrest costs). Fiction deals in **phenomenology.**

  *   **The Feeling of Relief:** Literature tells you crime stats dropped. The show lets you feel the silence on a residential block that used to be a corner. It shows the ethical weight of giving a community back its public space.
  *   **The Moral Injury of the Officer:** Literature discusses "enforcement priorities." The show shows Officer Carver struggling to reconcile his duty with the absurdity of arresting a user while a murderer walks. It dramatizes the cognitive dissonance required to maintain prohibition.
  *   **The Texture of the Zone:** You cannot get the smell, the noise, or the hopelessness of the "Free Zone" from a DOJ report. Fiction forces the viewer to sit with the visceral reality of the trade, making the utilitarian calculus uncomfortable rather than abstract.

  ### 7. Pedagogical Warning
  Do not let your students leave thinking Hamsterdam is a viable blueprint for Portugal. Portugal is a health model; Hamsterdam is a policing strategy. Use the arc to discuss the **political viability** of reform. Ask: "If a program works criminally but fails politically, is it ethical to implement it?" That is the actual question *The Wire* asks.

  Verdict: none — institutional fatalism instead.
