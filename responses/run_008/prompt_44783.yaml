      *   *Respect?* No. They are treated as inevitable waste. There is no treatment offered initially. It's nihilistic harm reduction.
      *   *Contrast:* Portugal offers admin panels and treatment. Hamsterdam offers abandonment.

  7.  **Identify Fiction's Contribution:**
      *   Policy papers show stats (overdose rates, arrest numbers).
      *   Fiction shows the *texture*: the smell, the noise, the moral compromise of the police officer, the feeling of a neighborhood getting its streets back vs. the sacrifice of the zone residents. It humanizes the "collateral damage."

  8.  **Drafting the Response (Iterative refinement):**

