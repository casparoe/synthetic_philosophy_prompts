          *   *Conclusion:* It's closest to "harm-reduction-without-sanction" or a "free zone" experiment. It is *not* a fair test of Portugal or Legalization because it lacks the health infrastructure and regulatory oversight. It stacks the deck by showing the worst of the drug trade (violence, open use) without the safeguards of actual reform.

