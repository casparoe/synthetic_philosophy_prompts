      *   **Verdict Line:** Must start with "Verdict:", max 8 words, specific label.

  10. **Final Polish:** Ensure tone is academic yet engaged, suitable for an ethics instructor. (Self-Correction: Make sure not to sound like I'm just summarizing the plot. Keep the focus on the *ethical and policy implications*.)

