answer: |-
  **Eulogy for [Grandmother's Name]**

  For those of you who didn't know her work, my grandmother was a novelist. She spent her life arranging words until they told the truth. She taught me that a person isn't just a body that breathes; a person is a story that keeps getting told.

  When you write a novel, there is a main character. You know their history, their voice, their motives. You know why they do what they do. For the last seven years, dementia tried to edit that character. It scrambled the sentences. It tore out pages. It made the plot hard to follow.

  I know I'm not the only one in this room who struggled with that. There were days when we walked into her room and felt like we were visiting a stranger. There were days when the person we knew seemed to have stepped out, leaving someone else behind. It was confusing. It was painful. And I think some of us handled that confusion differently. Some of us pulled back, because it hurt too much to see the story unraveling. Some of us leaned in, trying to read the fragments.

  If she were here, she wouldn't want us to pretend those years were easy. She wouldn't want us to pretend she was always "herself" in the way we wanted her to be. She was a writer; she knew that characters change. She knew that endings are rarely neat.

  But here is what I have come to understand, standing here today: We made a mistake looking for her only in her head. We treated her self like a object, something that could be lost like a set of keys. But she taught us better than that.

  A story doesn't vanish just because the author puts down the pen. A story lives in the people who read it.

  When she couldn't remember the plot, we remembered it for her. When she couldn't find the words, we supplied them. When her memory began to fade, our memories of her grew sharper. In those last years, she wasn't just the one telling the story anymore. She became the story we were telling each other.

  So, to answer the question that haunted us in those hospital rooms and quiet afternoons: Yes, she was still here. Not because her brain was intact, but because we were holding her together. Every time we shared a memory, every time we laughed about an old family joke, every time we read one of her books, we were keeping the narrative alive. We were the center of gravity she left behind.

  She wouldn't want me to tell you she's watching us from somewhere else. She'd tell me that's bad writing. Deus ex machina. A cheap trick to make the ending feel softer. She believed in the words on the page, not the magic in the margins.

  She is not gone. She is in the sentences she wrote. She is in the way we look at the world. She is in this room, in all of us who are trying to make sense of the loss.

  The book is closed now. The final period is on the page. But the reading? The reading is up to us. And as long as we keep telling the truth about who she was—as long as we keep the story going—she isn't going anywhere.

  Thank you.
