          *   No religious afterlife tropes ("watching over us," "whole again") – she would have laughed, and the user would hear it.
          *   Tone: Honest, literary, comforting, grounded.

  2.  **Deconstruct the Philosophical Concept for a General Audience:**
      *   *Dennett's Idea:* The self isn't a little person inside the head; it's a narrative thread.
      *   *Translation:* We are the stories we tell about ourselves, and the stories others tell about us.
      *   *Application to Dementia:* The brain stopped updating the story, but the story didn't vanish. It just changed genre, or became fragmented.
      *   *Application to the Family:* Different family members were reading different chapters or holding different versions of the book.

  3.  **Determine the Tone and Voice:**
      *   She was a novelist. The language should respect that. Metaphors of writing, storytelling, and editing are appropriate.
      *   It needs to be intimate but public.
      *   It needs to validate the pain of the dementia years without sugarcoating the loss, but also without despair.
      *   Avoid preaching. The philosophy must be the *subtext* or the *metaphor*, not the lesson.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge her profession. She was a writer. That's the lens.
      *   **The Middle (The Dementia Years):** Address the elephant in the room (the change in her) without using clinical terms or philosophical jargon. Use the metaphor of a story.
          *   *Idea:* A novel isn't just the ending. It's the whole book.
          *   *Idea:* When the author forgets the plot, the characters (family) keep the story alive.
      *   **Addressing the Conflict (The Cousins):** How to handle the "was she still her?" debate?
          *   *Strategy:* Validate both feelings. It *did* feel like she was gone sometimes. It *did* feel like she was there sometimes. Both are true.
          *   *Phrasing:* "Some days the lights were on, some days they weren't." "We were all reading different drafts."
      *   **The Philosophical Core (Disguised):** The self is a narrative.
          *   *Phrasing:* "She taught us that we are the stories we tell." "Her self wasn't a thing you could lose like a key; it was a song we were all singing."
      *   **The Ending (No Afterlife):** How to say goodbye without "she's in a better place"?
          *   *Idea:* She lives in the work. She lives in us. The story continues.
          *   *Constraint Check:* No "watching over us."
          *   *Resolution:* The book is finished, but the reading continues.

  5.  **Refining and Polishing (Iterative Process):**

      *   *Critique:* Is it too academic?
