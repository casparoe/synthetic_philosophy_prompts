      *   *Best Guess:* **Backsliding.** Why? Because the Hungary precedent is the closest match (legalistic constitutional capture of courts/media). To rule otherwise would require overturning the logic of the Hungary entry.

  7.  **Identify the Decisive Fact:**
      *   What distinguishes "Majoritarian Reform" from "Authoritarian Backsliding"?
