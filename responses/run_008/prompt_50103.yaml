answer: |-
  This is an exceptionally clear and philosophically mature set of intuitions. You have independently rediscovered debates that have occupied political philosophers for the last century.

  To answer your first question directly: **No, there is no single, uncontested principle that captures all your verdicts.** Your intuitions are a hybrid of two competing frameworks that philosophers often treat as opposites. You are straddling **Libertarian Entitlement** (people own what they earn and exchange voluntarily) and **Fair Equality of Opportunity** (inequalities are only just if they don't arise from luck or coercion).

  Because these frameworks conflict, holding all your verdicts simultaneously creates logical tension. Below, I will map your cases to these frameworks, tell you where philosophers agree and disagree, and show you which verdicts you would likely need to adjust to be consistent.

  ### 1. The Attempted Unifying Principle
  The closest thing to a single principle that fits most of your gut reactions is this:

  > **The Principle of Fair Background Conditions:** *Holdings and transactions are just only if they arise from genuine choice and effort, rather than from coercion, deception, luck of birth, or past injustice.*

  Here is how your cases map to this principle:
  *   **Singer's Earnings (Fine):** Fits "Effort/Choice." She worked; fans chose.
  *   **Inheritance (Bothers you):** Fails "Luck of Birth." The children did not work; their advantage is purely status-based.
  *   **Flea Market (Wrong):** Fails "Genuine Choice." The seller lacked information, making the consent defective.
  *   **Con Man (Owed):** Fails "Past Injustice." The money originated in theft.
  *   **Landlord (Wrong):** Fails "Genuine Choice." Tenants pay due to necessity (coercion by circumstance), not free preference.
  *   **Historical Land (Owed):** Fails "Past Injustice." Current wealth rests on old theft.

  ### 2. Where the Principle Breaks (The Tensions)
  While the principle above *describes* your feelings, it is not philosophically stable without making hard choices. Here are the two major contradictions in your current view:

  **Tension A: The Singer's Earnings vs. The Singer's Children**
  *   **The Conflict:** If the Singer *justly earned* her money (as your first intuition says), she owns it fully. If she owns it fully, she has the right to give it to whom she pleases, including her children. To say she can earn it but not give it implies she never fully owned it.
  *   **The Philosophical Dispute:**
      *   *Libertarians (e.g., Robert Nozick)* argue that if the acquisition was just, the transfer is just. They would say your objection to inheritance is inconsistent with your approval of her earnings.
      *   *Egalitarians (e.g., John Rawls)* argue that "ownership" is a social convention, not a natural right. Society can allow you to earn money but tax 100% of it upon death to prevent aristocracy.
  *   **Consensus:** There is **no consensus** here. This is one of the central fights in political philosophy.

  **Tension B: The Singer vs. The Landlord**
  *   **The Conflict:** Both are charging "what the market will bear." The Singer charges high ticket prices because she is popular; the Landlord charges high rent because housing is scarce. Both transactions are voluntary. Why is one fair and the other exploitative?
  *   **The Philosophical Dispute:**
      *   Some argue the difference is **Necessity**. Music is a luxury; housing is a need. Exploiting need is coercion.
      *   Others argue this is inconsistent. If the fans *love* the music, is it not a "need" to them? If the landlord built the housing, why is he not entitled to the return on his investment like the Singer is?
  *   **Consensus:** There is **no consensus** on what counts as "exploitation" in a free market.

  ### 3. Which Verdicts Should You Give Up?
  To be logically consistent, you generally need to lean toward one of two "packages." You cannot comfortably keep all your current verdicts without accepting significant contradiction.

  #### Option 1: The "Meritocratic Libertarian" Path
  *   **Core Belief:** If you didn't steal or lie, you keep what you get. Property rights are absolute.
  *   **Verdicts to Keep:** Singer's Earnings (Fine), Inheritance (Fine), Flea Market (Fine—caveat emptor), Landlord (Fine).
  *   **Verdicts to Drop:** You must accept the Inheritance, the Flea Market deal, and the Landlord's rent as morally permissible.
  *   **Why drop the others?** Because if you believe in absolute property rights, you cannot interfere with how people use their property (inheritance) or price it (rent), provided no force was used.
  *   **Philosophical Support:** Robert Nozick, *Anarchy, State, and Utopia*.

  #### Option 2: The "Fair Equality" Path (Closer to your gut)
  *   **Core Belief:** Markets are only tools for justice if the starting line is fair and no one is desperate.
  *   **Verdicts to Keep:** Inheritance (Unfair), Flea Market (Unfair), Landlord (Unfair), Con Man (Rectify), Historical Land (Rectify).
  *   **Verdicts to Drop:** You must be more skeptical of the **Singer's Earnings**. If inheritance is unfair because it's unearned advantage, is genetic talent (which makes the singer famous) also unearned advantage? If the Landlord is wrong to profit from scarcity, is the Singer wrong to profit from her unique voice (a scarcity)?
  *   **Why drop the others?** To be consistent, you must acknowledge that *all* market advantages (even talent) are partly luck. If you tax inheritance to level the playing field, consistency suggests taxing extreme income derived from rare talent to the same degree.
  *   **Philosophical Support:** John Rawls, *A Theory of Justice* (with caveats).

  **Recommendation:** Your gut reactions align most closely with **Option 2**. Most people find the "Meritocratic Libertarian" view too harsh regarding the vulnerable (Landlord/Con Man). However, to be consistent with Option 2, you should soften your approval of the **Singer's Millions**. You don't have to say she did something *wrong*, but you should accept that society is justified in taxing her excess wealth to prevent her children from having the unfair advantage you objected to in the first place.

  ### 4. Expert Consensus and Disputes
  You asked where professionals agree and disagree.

  *   **Common Ground (Consensus):**
      *   **The Con Man Case:** Almost all philosophers agree that victims are owed rectification. If assets can be traced (even into a business), the original owners have a claim. This is standard restitution.
      *   **Fraud is Wrong:** The Flea Market case is widely seen as problematic, though some libertarians argue ignorance is the seller's responsibility. Most agree that *active* concealment makes a transaction voidable.

  *   **Heavily Disputed:**
      *   **Historical Land:** This is one of the most difficult problems in philosophy (Intergenerational Justice).
          *   *The Non-Identity Problem:* If the theft hadn't happened, the current poor descendants might never have been born (their parents wouldn't have met). Can you harm someone by an act that was a necessary condition for their existence?
          *   *Statute of Limitations:* Many argue that after enough time, current owners cannot be held responsible for ancestors' sins, and stability is more important than rectification.
          *   *Position:* There is **no settled view**. Some argue for symbolic reparations; others argue for full land return; others argue for nothing.
      *   **Inheritance:** As noted above, this is a fundamental split between Libertarians (absolute right to give) and Egalitarians (right to give ends where unfair dynasty begins).
      *   **The Landlord:** Disputed between those who see "market price" as moral (Austrian School) and those who see "monopoly on necessity" as coercive (Marxist/Social Democratic).

  ### 5. Applying Your View to the New Cases
  Based on your current intuitions (which lean toward **Option 2: Fair Equality**), here is what your principle implies for the two unlisted situations.

  **Case 1: The Perpetual Trust**
  *   *Situation:* A person leaves their entire fortune to a trust that pays their descendants forever, so they never work.
  *   *Your Principle's Verdict:* **Impermissible.**
  *   *Reasoning:* This is the Inheritance case amplified. You already objected to the singer's children inheriting "everything." A perpetual trust cements class stratification forever, violating the "Fair Background Conditions" principle. It allows the dead to rule the living and creates a permanent aristocracy based on luck of birth.
  *   *Philosophical Note:* Many legal systems actually limit this (e.g., the "Rule Against Perpetuities"), precisely for the reason your gut identifies.

  **Case 2: Selling a Kidney**
  *   *Situation:* A very poor person freely sells a kidney to a rich person for life-changing money. No force, no fraud.
  *   *Your Principle's Verdict:* **Impermissible (or Highly Restricted).**
  *   *Reasoning:* This matches the **Landlord** case. The transaction is formally voluntary, but the background condition is desperation. If the seller had a decent income, they wouldn't sell an organ. Therefore, the "choice" is coerced by poverty. Allowing this exploits vulnerability, similar to the landlord exploiting the housing shortage.
  *   *Philosophical Note:* This is fiercely debated.
      *   *Autonomy Advocates* argue banning it insults the poor person's agency.
      *   *Exploitation Theorists* (aligning with your intuition) argue that we should not allow the rich to turn the poor's bodies into spare parts, even if "paid."

  ### Summary
  You do not need to give up your gut feelings, but you should recognize they are not based on a single rule like "Voluntary = Good." They are based on a **theory of fairness** that values consent *only when* power and information are roughly balanced.

  To make your view consistent:
  1.  **Accept** that "Voluntary" is not enough (rejecting the Landlord and Kidney Sale).
  2.  **Accept** that "Earned" is partly luck (moderating your view on the Singer's extreme wealth).
  3.  **Accept** that Rectification has limits (acknowledging the Historical Land case is much harder to solve than the Con Man case).

  You are arguing for a system where markets are permitted, but strictly bounded by moral constraints on vulnerability and heredity. That is a coherent, defensible position, but it requires you to prioritize **Fairness** over absolute **Property Rights**.
