prompt: |-
  My friend Marnie has this whole thing about which bad-feeling emotion is the right one to have after you screw up, and which ones people should be steering each other toward. Her track record so far:

  - Guy cheats on his taxes, feels awful about the act ("that was a shitty thing I did") but doesn't spiral about being a bad person — she says that's basically the healthy version and that the feeling will actually help him fix it.
  - Same kind of guy, but instead he can't stop thinking "I'm the kind of person who does this" and its eating him alive — she thinks that's close to useless at best, corrosive at worst.
  - A kid caught shoplifting: parents who make him stand in front of the family and say what he is (a thief) vs. parents who make him return the item and apologize to the shopkeeper — she's firmly for the second and says the first is teaching the wrong thing.
  - Online public shaming pile-ons: against them even when the target genuinely did something wrong, and even when it "works".
  - Restorative justice circles, where the offender has to sit face to face with the people they harmed — surprisingly fine with those, says they're not about the self at all even though they sound humiliating.

  Next month she's visiting my ethics class and the students want to run some new cases past her, and I want to predict her verdicts beforehand so we can check. The new cases:

  1. A surgeon whose honest mistake killed a patient, who responds with intense guilt, reviews exactly what went wrong, changes her checklist — but privately holds onto "I'm still a good surgeon." Shame-free, or as some of the students will put it, shamelessly. Will Marnie approve?
  2. Survivor's guilt: someone who did nothing wrong at all, feels guilty anyway. Does her rule even apply? Is there such a thing as guilt without a bad act, and if so is it a counterexample to whatever she's running?
  3. A culture (people always want to say Japan, or the old Mediterranean honor cultures, honestly not sure it matters) where shame does a lot of the work that guilt does elsewhere. Is she committed to saying that whole arrangement is worse, or could she say it works fine for them? She once told me cultures can pick these things the way they pick utensils, but I've also heard her talk as if guilt-culture vs. shame-culture is a straight-up moral ranking, so I genuinely can't tell which she'd say.

  What I want from you: work out the rule(s) she's implicitly running that fit all five original verdicts. I suspect more than one rule fits — e.g. one about what the feeling targets (the act vs. the self), one about what it does (motivates repair vs. motivates hiding), maybe one about who applies it (your own conscience vs. an audience). For each rule that fits, say what it predicts for cases 1-3. Then give me your best guess on each case with your reasons, and tell me what further case would split whatever rules are still agreeing after this round. Also flag if you think any of her original five verdicts are actually in tension with each other, because the students will find it if there is one.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**
      *   **Goal:** Analyze Marnie's ethical framework regarding emotions (specifically guilt vs. shame) based on five provided examples, apply it to three new cases, identify potential tensions in her original views, and suggest a "splitter" case.
      *   **Input:** Five original verdicts (Tax cheat guilt vs. shame, Shoplifting parenting, Public shaming, Restorative justice).
      *   **Output:**
          1.  Identify implicit rule(s) fitting the original five.
          2.  Apply rules to predict verdicts for Cases 1-3.
          3.  Provide best guesses with reasoning.
          4.  Identify tensions in the original five.
          5.  Propose a "splitter" case to distinguish between competing rules.

  2.  **Analyze Marnie's Original Five Verdicts:**
      *   *Case A (Tax Cheat - Guilt):* Feels bad about the *act* ("shitty thing I did"). Doesn't spiral about *self*. Verdict: Healthy/Good. Function: Helps fix it.
      *   *Case B (Tax Cheat - Shame):* Feels bad about *self* ("I'm the kind of person..."). Verdict: Useless/Corrosive.
      *   *Case C (Shoplifting - Parents):* Labeling child ("You are a thief") vs. Action/Repair (Return item, apologize). Verdict: Repair good, Labeling bad.
      *   *Case D (Online Shaming):* Public pile-ons. Verdict: Against, even if target did wrong.
      *   *Case E (Restorative Justice):* Face-to-face with harmed. Verdict: Fine/Good. Reason: "Not about the self at all."

      *   *Synthesis of Principles:*
          *   **Target:** Act/Behavior vs. Self/Identity. (Guilt = Act, Shame = Self). Marnie prefers Act-focused.
          *   **Function/Outcome:** Repair/Correction vs. Hiding/Spiraling. Marnie prefers Repair.
          *   **Audience/Context:** Private/Conscience vs. Public/Spectacle. Marnie dislikes public spectacle (Online shaming) but likes structured interpersonal accountability (Restorative Justice).
          *   **Agency:** Does the emotion lead to agency (fixing) or paralysis (eating alive)?

      *   *Potential Tension:* Case D (Online Shaming) vs. Case E (Restorative Justice). Both involve an audience/other people witnessing the wrong. Why is one bad and the other good?
          *   *Distinction:* Online shaming is often about punishment/status reduction (Shame-focused, "You are bad"). Restorative justice is about harm repair (Guilt/Responsibility-focused, "You did harm, how to fix?"). Marnie explicitly says Restorative Justice is "not about the self."
          *   *Tension Check:* Is there a tension between "Public is bad" and "Restorative Justice is public"? The key seems to be *intent* and *structure*. Online shaming is unstructured, often infinite, and identity-attacking. Restorative justice is structured, finite, and harm-repairing.

  3.  **Formulate Implicit Rules:**
      *   *Rule 1 (The Target Rule):* Emotions should target specific *actions* and *harms*, not global *identity* or *character*. (Guilt > Shame).
      *   *Rule 2 (The Function Rule):* Emotions are valid if they motivate *repair* or *correction*. They are invalid if they motivate *hiding*, *paralysis*, or *self-loathing*.
      *   *Rule 3 (The Social Context Rule):* Social accountability is good only if it is structured toward *reintegration* and *harm repair*, not *exclusion* or *status destruction*.

  4.  **Apply Rules to New Cases:**

      *   *Case 1 (Surgeon):* Honest mistake, intense guilt, reviews error, changes checklist, maintains "I'm still a good surgeon."
          *   *Target:* Act (mistake), not Self (good surgeon). -> Passes Rule 1.
          *   *Function:* Review, change checklist (Repair). -> Passes Rule 2.
          *   *Context:* Private/Professional review. -> Passes Rule 3.
          *   *Prediction:* Approval.

      *   *Case 2 (Survivor's Guilt):* Did nothing wrong, feels guilty.
          *   *Target:* No act to target.
          *   *Function:* Does it motivate repair? Usually no, because there's nothing to fix. It's often paralyzing.
          *   *Marnie's Framework:* Her framework relies on "screwing up" (as per the prompt intro). If there's no screw up, is the emotion "right"?
          *   *Prediction:* She likely sees this as irrational/unhelpful. It violates the "Act" requirement (no bad act) and likely fails the "Repair" test (nothing to fix).

      *   *Case 3 (Shame Cultures):* Culture where shame does the work of guilt.
          *   *Target:* Often identity/status (Shame).
          *   *Function:* Social cohesion?
          *   *Marnie's History:* "Cultures can pick these things like utensils" (Relativist hint) VS "Guilt vs. Shame is a moral ranking" (Universalist hint).
          *   *Analysis:* If she prioritizes *Function* (Repair/Cohesion) over *Target* (Act vs. Self), she might accept it. If she prioritizes *Target* (Act > Self), she rejects it.
          *   *Clue:* She hates "I'm the kind of person" (Case B) and "You are a thief" (Case C). This suggests a strong bias against Identity-targeting. However, Restorative Justice (Case E) involves social pressure.
          *   *Prediction:* This is the trickiest. Given her strong stance against identity-labeling in Cases B & C, she should theoretically dislike Shame Cultures. *But*, if the Shame Culture functions to restore harmony (like Restorative Justice), she might make an exception. The prompt says she's inconsistent here ("genuinely can't tell"). I need to weigh the evidence. Her rejection of "I am a thief" is very strong. I'll lean towards her criticizing the *mechanism* but acknowledging the *outcome* if it leads to repair. Actually, looking at Case D (Online Shaming), she hates public status destruction. Shame cultures rely on public status threat. I predict she will be critical but nuanced.

  5.  **Identify Tensions in Original Five:**
      *   *The Big One:* Case D (No Online Shaming) vs. Case E (Yes Restorative Justice).
      *   *Why?* Both involve public exposure of wrongdoing.
      *   *Resolution:* Restorative Justice is consensual, structured, and focuses on the *victim's* needs/repair. Online shaming is mob-driven, unstructured, and focuses on *punishment/status*.
      *   *Is there a deeper tension?* Case A (Guilt is good) vs. Case E (Restorative Justice is good). Restorative Justice often induces shame *initially* to get to repair. Marnie says it's "not about the self." This is a definitional move. If the participant *feels* shame, does Marnie still approve?
      *   *Tension:* Case B (Shame is corrosive) vs. Case C (Parents labeling kid). These are consistent.
      *   *Real Tension:* The definition of "Shame." In Case E, she claims it's not about the self. But sitting face-to-face with someone you hurt is inherently an attack on your self-image as a "good person." She might be splitting hairs.

  6.  **Develop "Splitter" Cases:**
      *   Need to distinguish between Rule 1 (Target: Act vs. Self) and Rule 2 (Function: Repair vs. Hide).
      *   *Scenario:* A feeling targets the *Self* (Shame) but leads to *Repair*. (e.g., "I am a monster, so I must dedicate my life to fixing this.") Marnie says shame is corrosive (Case B), but Function Rule says Repair is good. Which wins?
      *   *Scenario:* A feeling targets the *Act* (Guilt) but leads to *Hiding*. (e.g., "I did a bad thing, I can never show my face again, I'll move away.") Targets act, but function is bad.
      *   *Scenario:* Public Shaming that works for Repair. (e.g., A community boycotts a business until they pay owed wages, then welcomes them back.) Is this Online Shaming (Bad) or Restorative (Good)?

  7.  **Drafting the Response:**
      *   *Structure:*
          1.  Derive the Rules (The "Marnie Framework").
          2.  Analyze Tensions in Original Data.
          3.  Predict Verdicts for Cases 1-3.
          4.  Propose the Splitter Case.
      *   *Tone:* Analytical, predictive, slightly philosophical (matching the ethics class context).

      *(Self-Correction during drafting)*: Make sure to address the "Survivor's Guilt" nuance. Marnie's framework is about "after you screw up." Survivor's guilt is "when you didn't screw up." This challenges the *precondition* of her rules.
      *(Refining Case 3)*: The prompt says she's inconsistent on this. I should highlight that ambiguity in the prediction.
      *(Refining Tensions)*: The tension between "Public Shaming is bad" and "Restorative Justice is good" is the most fertile ground for the students to dig.

  8.  **Final Polish:** Check against all constraints.
      *   Work out rules? Yes.
      *   Predict 1-3? Yes.
      *   Best guess + reasons? Yes.
      *   Splitter case? Yes.
      *   Flag tensions? Yes.

      *Let's refine the Rules:*
      1.  **The Object Rule:** Emotions must target *behavior/harm*, not *identity/essence*.
      2.  **The Teleology Rule:** Emotions are judged by their *consequences* (Repair/Reintegration vs. Paralysis/Exclusion).
      3.  **The Audience Rule:** Social pressure is legitimate only when *structured*, *consensual*, and *victim-centered*, not when it is *spectacle* or *mob-driven*.

      *Let's refine the Tension:*
      The tension is between the Object Rule and the Teleology Rule. In Case B, Shame is rejected because it targets Identity (Object Rule), even if it might theoretically motivate change (though she says it doesn't). In Case E, Restorative Justice is accepted because it leads to Repair (Teleology), even though it *looks* like Shame (Public, Face-to-face). She resolves this by claiming RJ isn't about the self. But is that empirically true? That's the tension.

      *Let's refine the Splitter:*
      A case where Shame (Identity target) *successfully* leads to Repair. Does she accept it because it worked (Teleology) or reject it because it was Shame (Object)?

      *Okay, ready to write.*
answer: |-
  Here is an analysis of Marnie's implicit ethical framework, the tensions within it, and predictions for your class cases.

  ### Part 1: The Marnie Framework (Implicit Rules)

  Based on her five original verdicts, Marnie is operating on three intersecting principles. She doesn't just care about *what* you feel, but *where* the feeling is aimed and *what work* it does.

  **Rule 1: The Object Rule (Act vs. Identity)**
  *   **Principle:** Moral emotions must target specific **actions** or **harms**, not global **identity** or **character**.
  *   **Evidence:** She approves of "that was a shitty thing I did" (Act) but rejects "I'm the kind of person who does this" (Identity). She rejects calling the kid a "thief" (Identity) but accepts making him return the item (Act/Repair).
  *   **Implication:** Guilt (act-focused) is generally superior to Shame (self-focused).

  **Rule 2: The Teleology Rule (Repair vs. Paralysis)**
  *   **Principle:** An emotion is "right" if it motivates **repair, correction, or reintegration**. It is "wrong" if it motivates **hiding, spiraling, or exclusion**.
  *   **Evidence:** The tax cheat who fixes his taxes is healthy; the one who eats himself alive is corrosive. Online shaming is rejected because it usually exiles the target; Restorative Justice is accepted because it reintegrates them through harm repair.

  **Rule 3: The Audience Rule (Structure vs. Spectacle)**
  *   **Principle:** Social accountability is permissible only when it is **structured, consensual, and victim-centered**. It is impermissible when it is **unstructured, mob-driven, or spectacle-oriented**.
  *   **Evidence:** Online pile-ons (Spectacle/Mob) are bad. Restorative Justice circles (Structured/Victim-centered) are good. Parents labeling a child in front of the family (Spectacle/Power imbalance) is bad.

  ---

  ### Part 2: Tensions in the Original Five

  There is one significant tension your students should be able to find. It lies between **Rule 1 (Object)** and **Rule 3 (Audience)**, specifically regarding **Case D (Online Shaming)** vs. **Case E (Restorative Justice)**.

  *   **The Tension:** Marnie claims Restorative Justice (Case E) is "not about the self." However, sitting face-to-face with someone you harmed is inherently an attack on your self-image. It induces shame. If the mechanism of Restorative Justice relies on the offender feeling the weight of their identity as a "harm-doer" to motivate change, then Case E contradicts Case B (where identity-focus is "corrosive").
  *   **The Conflict:** Is Marnie rejecting *Shame* (the feeling) or *Unstructured Punishment* (the context)?
      *   If she rejects Shame itself, Restorative Justice should be suspect.
      *   If she rejects Unstructured Punishment, Restorative Justice is fine, even if it induces shame.
  *   **Her Escape Hatch:** She explicitly says Restorative Justice is "not about the self." This is a definitional move to avoid the contradiction. She is arguing that *true* accountability is act-focused, even in public. Your students can challenge whether that is psychologically possible.

  ---

  ### Part 3: Predictions for New Cases

  Here is how the rules apply to your three new cases, along with my best guess at her verdict.

  #### Case 1: The Surgeon (Honest Mistake + Guilt + "I'm still good")
  *   **Rule 1 (Object):** Pass. She targets the mistake (checklist), not her identity ("good surgeon").
  *   **Rule 2 (Teleology):** Pass. She reviews errors and changes protocols (Repair).
  *   **Rule 3 (Audience):** Pass. This is private/professional review, not public spectacle.
  *   **Prediction:** **Strong Approval.**
  *   **Reasoning:** This is the textbook example of Marnie's "Healthy Guilt." It fits every criterion perfectly. The "shamelessly" comment by students might trip her up linguistically, but she will clarify that lacking *shame* (identity attack) is the goal, not lacking *responsibility*.

  #### Case 2: Survivor's Guilt (No Bad Act + Guilt)
  *   **Rule 1 (Object):** **Fail.** There is no "act" to target. The emotion is unmoored from behavior.
  *   **Rule 2 (Teleology):** **Fail.** Usually, survivor's guilt is paralyzing because there is nothing to repair. You cannot fix "surviving."
  *   **Prediction:** **Disapproval / Confusion.**
  *   **Reasoning:** Marnie's framework is built on the premise "after you screw up." Her rules are tools for *correction*. Survivor's guilt is a "false positive" in her system. She will likely argue this is a category error: "You can't have guilt without a transgression. That isn't guilt; that's grief or trauma, and treating it like guilt is dangerous because it implies a debt that can't be paid."
  *   **Nuance:** If the survivor uses the feeling to help others (e.g., "I survived, so I must help others survive"), she might approve of the *outcome*, but she will still critique the *emotion* itself as irrational.

  #### Case 3: Shame Cultures (Identity-focused social cohesion)
  *   **Rule 1 (Object):** **Fail.** These cultures explicitly target identity/status ("You have brought shame on this family").
  *   **Rule 2 (Teleology):** **Mixed.** These cultures often achieve social cohesion and repair (Function), but through identity threat.
  *   **Rule 3 (Audience):** **Mixed.** Often structured, but often coercive rather than consensual.
  *   **Prediction:** **Critical Nuance (The "Utensil" vs. "Ranking" Conflict).**
  *   **Reasoning:** This is where her inconsistency (which you noted) will show.
      *   *If she follows Rule 1:* She must condemn the culture. Calling someone "shameful" is the same as calling the kid a "thief."
      *   *If she follows Rule 2:* She might admit it "works" for social order, similar to how Restorative Justice works.
      *   **Best Guess:** She will argue that while these cultures function, they are **morally inferior** regarding individual well-being. She will likely say: "It works for the group, but it corrodes the individual. We know better now." She will try to have it both ways: acknowledging cultural relativity ("utensils") while maintaining that the *psychological mechanism* of shame is objectively more harmful than guilt ("ranking").

  ---

  ### Part 4: The Splitter Case

  To force a decision between her rules (specifically to test if she prioritizes **Object** vs. **Teleology**), present her with this case:

  **The "Redemptive Shame" Case:**
  > A CEO embezzles money. She feels deep shame ("I am a corrupt person"). This feeling is so overwhelming that she doesn't hide; instead, she publicly confesses, returns every cent, dissolves her company, and dedicates her life to anti-fraud advocacy. The shame motivated total repair and reintegration into society as a whistleblower.
  >
  > **Question:** Is her shame "healthy" because it fixed everything (Teleology), or "toxic" because it targeted her identity (Object)?

  **Why this splits the rules:**
  *   **If she prioritizes Rule 1 (Object):** She must condemn the emotion. Even though the outcome was good, the internal mechanism was "I am a corrupt person," which she previously called "corrosive."
  *   **If she prioritizes Rule 2 (Teleology):** She must approve the emotion. It resulted in maximum repair and zero hiding.
  *   **If she prioritizes Rule 3 (Audience):** She might approve because the confession was public/structured, but this doesn't solve the internal emotion problem.

  **Expected Outcome:** Marnie will likely try to wiggle out by saying, "The *shame* didn't fix it; the *guilt* underneath the shame did." Your students should press her: "If the subject reports it was shame that motivated them, do you overrule their self-report?" This forces her to admit whether she cares more about the *label* of the emotion or the *result*.

  ### Summary for the Class
  *   **Marnie's Core:** Act-focused, Repair-oriented, Structured Accountability.
  *   **The Weak Point:** The distinction between Restorative Justice (Good) and Online Shaming (Bad) relies on the claim that one isn't "about the self." Students should challenge whether public accountability can ever truly avoid attacking the self.
  *   **The Prediction:** She will love the Surgeon, reject the Survivor's Guilt as a category error, and struggle to consistently judge the Shame Culture without contradicting her earlier stance on the shoplifting kid.
