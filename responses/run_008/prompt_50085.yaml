prompt: |-
  I should say at the outset that until this term I had no involvement in university governance, and I have no training in formal social theory or economics. I have just begun a three-year appointment to my department's promotions committee, and in my first months of service I have run into a configuration in our deliberations that I am convinced must have a name, though I cannot find it. Let me describe it in plain terms.

  Our committee votes on propositions rather than on candidates as wholes. In a recent promotion case, the chair put three claims to us in sequence: first, that the candidate's research record meets the standard we normally require at promotion (this passed, four to three); second, that her teaching meets our standard (this also passed, four to three); and third — not put to a vote, but treated as settled policy from earlier cases — that anyone meeting both thresholds is to be recommended. We then voted on the direct question of whether to recommend her, and the answer was no, again four to three. What unsettled me was not the outcome but its structure: the majority that had affirmed the research record and the majority that voted against the recommendation were composed of different members. No individual colleague said anything inconsistent — each person's final vote followed from the claim or claims that person had doubts about — and yet the committee as a body had committed itself to a set of positions that jointly entail the opposite of what it decided.

  A second phenomenon has emerged from my reading of the minutes of earlier years. Faced with this kind of impasse, the committee's practice is to set aside whichever claim received the weakest support and let the rest stand. But I have found structurally identical cases from past years in which the outcome reversed depending on the order in which propositions were put to a vote: when the recommendation was voted first, the committee subsequently softened its assessment of the file to match, and when the file was assessed first, the recommendation was made to follow. The verdict appears to track the agenda rather than anyone's convictions, and I cannot tell whether this order-dependence is a separate phenomenon or just the first one viewed over time.

  I half remember, from an undergraduate course long ago, that Condorcet discovered something about majority voting producing results that go in a circle, but I believe that concerned rankings of candidates rather than yes-or-no claims, and I do not recall it covering a committee that affirms premises while rejecting what follows from them. So my questions are these. Does the first configuration have an established name? Is there a separate one for the second, the dependence of the group's verdict on the sequence of votes? And how, if at all, do they relate to that older result about cycling majorities — is my case a version of it, or something distinct that merely resembles it? I should warn you that a bare label will not satisfy me. What I want is the carving: what exactly the phenomenon is, what it is not, which of the two descriptions (order-dependence included or excluded) marks its true boundary, and if any part of it lacks a name, a proposed term with a definition and the sorts of cases that would fall just inside or just outside it. I would rather understand the shape of the thing than be able to cite it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a new member of a university promotions committee with no formal training in social theory or economics.
      *   **Observation 1:** The committee votes on premises (research standard met? teaching standard met?) and a conclusion (recommend promotion?). The majorities on the premises support promotion, but the majority on the conclusion opposes it. The majorities are not composed of the same individuals.
      *   **Observation 2:** Historical minutes show that the outcome depends on the *order* of voting (agenda setting). If the conclusion is voted on first, premises align to match. If premises are voted on first, the conclusion aligns to match (sometimes contradicting the logical implication of the premises).
      *   **Questions:**
          1.  Does the first configuration (affirming premises, rejecting conclusion) have a name?
          2.  Is there a separate name for the second (order dependence)?
          3.  How do they relate to Condorcet's cycling majority?
          4.  **Crucial Constraint:** "A bare label will not satisfy me." The user wants the "carving": exact definitions, boundaries, distinctions, and proposed terms if necessary. They want to understand the *shape* of the phenomenon.

  2.  **Identify the Core Concepts:**
      *   **Observation 1:** This is the classic **Discursive Dilemma** (or **Doctrinal Paradox**). It occurs when a group makes consistent individual judgments on interconnected propositions, but the collective judgment is inconsistent depending on whether you aggregate by premise or by conclusion.
      *   **Observation 2:** This is **Path Dependence** or **Agenda Dependence** in the context of judgment aggregation. It relates to how the sequence of decisions locks in outcomes.
      *   **Condorcet's Paradox:** This deals with *preferences* over *alternatives* (ranking candidates A, B, C), leading to cycles (A > B > C > A). The user's case deals with *judgments* on *propositions* (True/False on premises and conclusion). While related under the umbrella of Social Choice Theory, they are distinct mechanisms.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. Validate that their observation is sharp and corresponds to a well-studied area in social choice theory (specifically *Judgment Aggregation*).

      *   **Part 1: The First Configuration (Premises vs. Conclusion):**
          *   *Name:* The **Discursive Dilemma** (often used interchangeably with the **Doctrinal Paradox**).
          *   *Distinction:* Technically, the *Doctrinal Paradox* is the specific legal origin (court cases), while the *Discursive Dilemma* is the generalized logical structure. I should explain this nuance.
          *   *The "Carving":* Define the logical structure.
              *   Premise P1 (Research): Majority Yes.
              *   Premise P2 (Teaching): Majority Yes.
              *   Rule: If P1 & P2, then Conclusion C (Promote).
              *   Outcome: Majority on C says No.
          *   *Why it happens:* Different coalitions. (e.g., Person A doubts research, Person B doubts teaching, both vote No on promotion, but P1 and P2 pass because Person C votes Yes on both).
          *   *Boundary:* It requires logical connectivity between propositions. It is not just "hypocrisy"; it is a structural arithmetic inevitability given the voting rule.

      *   **Part 2: The Second Configuration (Order Dependence):**
          *   *Name:* **Agenda Dependence** (or Path Dependence in decision sequences).
          *   *Relation to Part 1:* It is the dynamic manifestation of the Discursive Dilemma. If you vote on the conclusion first (Conclusion-Based Procedure), you ignore the premises. If you vote on premises first (Premise-Based Procedure), you force the conclusion. The fact that the committee *adjusts* past votes to match the current outcome is a psychological/strategic layer on top of the logical paradox.
          *   *Nuance:* The user mentions the committee "softened its assessment... to match." This implies *preference adaptation* or *cognitive dissonance reduction*, not just mechanical voting. I need to distinguish the *logical* possibility of different outcomes based on procedure from the *behavioral* act of changing past records.

      *   **Part 3: Relation to Condorcet:**
          *   *Condorcet:* Preferences over alternatives (Ranking). Cycle: A>B, B>C, C>A.
          *   *User's Case:* Judgments over propositions (Truth values). Inconsistency: P1=True, P2=True, C=False (where P1&P2 -> C).
          *   *Connection:* Both are impossibility theorems in Social Choice. Condorcet leads to Arrow's Impossibility Theorem. The Discursive Dilemma leads to the List-Pettit Theorem (Impossibility in Judgment Aggregation).
          *   *Verdict:* Distinct but cousins. Condorcet is about *transitivity of preference*; Discursive Dilemma is about *logical consistency of belief*.

      *   **Part 4: Synthesis and "The Carving" (Addressing the specific request for boundaries):**
          *   I need to clearly delineate what is the *static* paradox vs. the *dynamic* process.
          *   *Static:* Discursive Dilemma (The snapshot of inconsistent votes).
          *   *Dynamic:* Procedural/Agenda Dependence (The movie of how the vote order changes the result).
          *   *Proposed Terminology:* If the user feels existing terms don't capture the "adjusting minutes" aspect, I should acknowledge that. The "adjusting minutes" is actually *retroactive rationalization*, which is behavioral, not purely logical.
          *   *Refining the Definition:* The core phenomenon is **Judgment Aggregation Inconsistency**.
          *   *Inside the boundary:* Any group deciding on logically connected propositions where majority voting on each leads to a logically inconsistent set.
          *   *Outside the boundary:* Simple hypocrisy (individual inconsistency), simple preference cycling (Condorcet without logical premises), or dictatorship (one person decides).

  4.  **Review and Refine:**
      *   *Tone:* Respectful, intellectual, matching the user's articulate style. Avoid overly dense jargon without explanation.
      *   *Accuracy Check:* Is "Discursive Dilemma" the best term? Yes, coined by Philip Pettit. "Doctrinal Paradox" is Kornhauser & Sager. I should mention both.
      *   *Addressing the "Minutes" issue:* The user notes the committee changes *past* assessments to match current votes. This is interesting. It's not just that the outcome changes; it's that the *record of reasoning* changes. This is **Procedural Malleability** or **Retrospective Coherence**. I should highlight this as a behavioral coping mechanism for the logical paradox.
      *   *Condorcet Check:* Ensure I explain *why* it's not exactly Condorcet. Condorcet = Intransitive social preference. Discursive = Inconsistent social belief set.

  5.  **Final Polish:** Organize with clear headings. Ensure the "Carving" section is distinct and satisfies the "shape of the thing" request. (Self-Correction: Make sure to explicitly answer the "order-dependence is a separate phenomenon or just the first one viewed over time" question.)

      *   *Decision:* Order dependence is a *consequence* of the Discursive Dilemma, not a separate phenomenon. If the logic were consistent, order wouldn't matter. Because the dilemma exists, the procedure (order) determines which inconsistency is avoided.

  6.  **Final Output Generation:** (Drafting the response based on these thoughts.)
answer: |-
  You have identified a genuine and well-documented structural problem in collective decision-making. Your intuition is correct: this is not merely administrative confusion, but a specific logical pathology that arises whenever a group votes on interconnected propositions.

  To give you the "carving" you requested, I will distinguish between the static logical structure you observed in your meeting and the dynamic procedural effect you observed in the minutes. I will then place them in relation to Condorcet's work.

  ### 1. The First Configuration: The Discursive Dilemma

  The configuration you described—where a majority affirms the premises, a majority affirms the logical rule connecting them to a conclusion, yet a majority rejects the conclusion—has an established name. It is most precisely called the **Discursive Dilemma**.

  In legal scholarship, where it was first formally identified (by Lewis Kornhauser and Lawrence Sager in 1986), it is often called the **Doctrinal Paradox**. However, the term *Discursive Dilemma* (championed by philosopher Philip Pettit) is broader and fits your university governance context better, as it applies to any body making reasoned judgments, not just courts.

  **The Carving of the Phenomenon:**
  *   **What it is:** A failure of *collective rationality* despite *individual rationality*. Every individual member holds a consistent set of views (e.g., "Research is good, Teaching is bad, therefore No Promotion"). However, when these views are aggregated by majority vote on each proposition separately, the resulting *collective* set of views is inconsistent (e.g., "Research is good [Majority], Teaching is good [Majority], therefore No Promotion [Majority]").
  *   **What it is not:** It is not hypocrisy. Hypocrisy implies an individual saying one thing and doing another. Here, every individual is consistent. It is not merely a "tie" or a "split decision." It is a mathematical guarantee that under certain distributions of opinion, majority voting on premises and majority voting on conclusions will yield contradictory outcomes.
  *   **The Boundary:** The phenomenon exists *only* where there is a logical dependency between the propositions voted upon. If the committee voted on "Research Quality" and "Favorite Color," no dilemma arises. The dilemma requires a constraint of the form: *If P and Q, then R.*

  **Why the majorities differ:**
  You noted that the majority affirming research was not the same as the majority rejecting promotion. This is the engine of the dilemma.
  *   *Voter 1:* Yes Research, No Teaching → No Promotion.
  *   *Voter 2:* No Research, Yes Teaching → No Promotion.
  *   *Voter 3:* Yes Research, Yes Teaching → Yes Promotion.
  *   *Result:* Research passes (2-1), Teaching passes (2-1), Promotion fails (1-2).
  The "No Promotion" coalition is a union of people who failed the candidate on *different* grounds. They agree on the verdict but disagree on the reasoning.

  ### 2. The Second Configuration: Agenda Dependence

  You asked whether the order-dependence you found in the minutes is a separate phenomenon or the first one viewed over time. It is the **dynamic consequence** of the Discursive Dilemma. The technical term is **Agenda Dependence** (or sometimes *Path Dependence* in judgment aggregation).

  It is not a separate logical beast; rather, it is the proof that the Discursive Dilemma is present. If the group's judgments were logically consistent, the order of voting would not change the outcome. The fact that the outcome *does* change depending on whether you vote on the premises first (Premise-Based Procedure) or the conclusion first (Conclusion-Based Procedure) is the defining characteristic of the dilemma.

  **The Carving of the Phenomenon:**
  *   **What it is:** The susceptibility of a group's final decision to the sequence in which questions are asked, specifically when those questions are logically linked.
  *   **The "Minutes" Observation:** You noted something subtle: the committee didn't just reach different outcomes; they *altered the record of the premises* to match the conclusion when the conclusion was voted on first. This adds a behavioral layer to the logical problem.
      *   *Pure Agenda Dependence:* Voting Order A leads to Outcome X; Voting Order B leads to Outcome Y.
      *   *Retrospective Coherence (Your specific case):* Voting Order B leads to Outcome Y, and the group *rewrites* the premises to ensure they logically support Y.
  *   **Boundary:** Pure Agenda Dependence is a structural feature of voting rules. What you observed in the minutes—softening assessments to match the verdict—is a *psychological coping mechanism* for the structural feature. It is an attempt to mask the Discursive Dilemma by forcing the premises to align with the conclusion after the fact.

  ### 3. Relation to Condorcet

  You recalled Condorcet correctly, but your suspicion that this is distinct is also correct. They are cousins, not twins.

  **Condorcet's Paradox (1785):**
  *   **Domain:** Preferences over *alternatives* (e.g., Candidate A vs. Candidate B vs. Candidate C).
  *   **The Glitch:** Intransitivity. The group prefers A to B, B to C, and C to A. There is no stable winner.
  *   **Shape:** A circle (Cycle).

  **The Discursive Dilemma (1980s/2000s):**
  *   **Domain:** Judgments over *propositions* (e.g., True/False on Research, Teaching, Promotion).
  *   **The Glitch:** Inconsistency. The group accepts P, accepts Q, accepts "If P and Q then R," but rejects R.
  *   **Shape:** A broken chain (Logical Disconnect).

  **The Connection:**
  Both are "Impossibility Theorems" in Social Choice Theory. Condorcet's paradox led to Arrow's Impossibility Theorem (you cannot perfectly aggregate preferences). The Discursive Dilemma led to the **List-Pettit Theorem** (2002), which proves that no voting system can simultaneously satisfy a few basic conditions (like anonymity and systematicity) when aggregating judgments on connected propositions without risking inconsistency or dictatorship.

  So, your case is not a version of Condorcet's cycling. Condorcet shows that a majority might not have a *favorite*. The Discursive Dilemma shows that a majority might have a *view* that makes no sense.

  ### 4. Summary and Proposed Terminology

  To satisfy your request for the "shape of the thing," here is how I would carve up the territory based on your description.

  **The Core Phenomenon:** **Judgment Aggregation Inconsistency.**
  This is the umbrella term. It covers any situation where individual rationality does not translate to collective rationality via majority voting.

  **Sub-Type A (The Static Snapshot):** **The Discursive Dilemma.**
  *   *Definition:* A set of majority votes on logically interconnected propositions that yields a collectively inconsistent set of beliefs.
  *   *Inside the boundary:* Your committee voting "Yes" on Research, "Yes" on Teaching, but "No" on Promotion.
  *   *Outside the boundary:* A committee where everyone agrees on the premises but disagrees on the weight of those premises (this is a value conflict, not a logical paradox).

  **Sub-Type B (The Dynamic Process):** **Procedural Determinacy.**
  *   *Definition:* The condition where the outcome of a judgment aggregation is determined not by the members' convictions, but by the choice of voting procedure (Premise-Based vs. Conclusion-Based).
  *   *Inside the boundary:* Your minutes showing different outcomes based on vote order.
  *   *Outside the boundary:* A unanimous vote (order would not matter).

  **The Behavioral Layer (Your Minutes Observation):** **Retrospective Rationalization.**
  *   *Definition:* The practice of altering the recorded judgments on premises to ensure logical consistency with a previously decided conclusion.
  *   *Note:* This lacks a standard formal name in social choice theory because formal theory assumes votes are fixed. This is a matter of *administrative practice* designed to hide the Discursive Dilemma.

  ### Conclusion

  You are witnessing the **Discursive Dilemma** manifesting through **Agenda Dependence**.

  It is distinct from Condorcet's cycling because it concerns logical consistency of beliefs rather than transitivity of preferences. The order-dependence you found in the minutes is not a separate phenomenon; it is the inevitable result of the committee attempting to navigate the Discursive Dilemma without acknowledging it. By voting on the conclusion first, they adopt a *Conclusion-Based Procedure* (which preserves the verdict but ignores the reasoning). By voting on premises first, they adopt a *Premise-Based Procedure* (which preserves the reasoning but might force a verdict they dislike).

  The fact that they alter the minutes to match the verdict suggests the committee intuitively understands that a "No Promotion" with "Yes Research/Yes Teaching" looks incompetent. They are prioritizing the *appearance* of rationality over the *record* of the vote. This is not a flaw in your memory or their minutes; it is a flaw in the voting architecture itself.
