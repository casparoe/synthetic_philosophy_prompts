  Here is the breakdown to settle the argument. We are going to construct two specific mathematical models. The first is a **Finite Model** where your friend is locally correct (switching at $100 is profitable) but globally wrong. The second is the **Cursed Model** where switching is always profitable, but the cost is that the expected value of the money ceases to exist.

  ### Part 1: The Finite Version (Your Friend is Right *This Time*)

  To make your friend right about the $100 envelope, we need a probability distribution for the smaller amount (let's call it $A$) such that seeing $100 makes it more likely that $100 is the smaller amount ($A$) than the larger amount ($2A$).

  **The Setup:**
  Imagine a lottery machine that picks the smaller amount $A$ according to this specific table. The amounts are discrete and finite.

  | Smaller Amount ($A$) | Probability $P(A)$ |
  | :--- | :--- |
  | $50 | 0.10 |
  | $100 | 0.80 |
  | $1,000,000 | 0.10 |
  | **Total** | **1.00** |

  The envelopes contain $(A, 2A)$. You pick one at random and open it.

  **1. The Calculation for $100**
  You open your envelope and see $V = 100$. This could have happened in two ways:
  1.  The smaller amount was $50 (Prob 0.10), and you picked the larger envelope ($2 \times 50$).
  2.  The smaller amount was $100 (Prob 0.80), and you picked the smaller envelope ($1 \times 100$).

  The probability of seeing $100 is the sum of these paths:
  $$P(V=100) = 0.5 \times P(A=50) + 0.5 \times P(A=100) = 0.5(0.10) + 0.5(0.80) = 0.45$$

  Now we compute the conditional probability that you hold the smaller amount ($A=100$) given you see $100$:
  $$P(A=100 \mid V=100) = \frac{0.5 \times 0.80}{0.45} = \frac{0.40}{0.45} = \frac{8}{9}$$
  $$P(A=50 \mid V=100) = \frac{0.5 \times 0.10}{0.45} = \frac{0.05}{0.45} = \frac{1}{9}$$

  **Expected Value of Switching:**
  If you switch, the other envelope contains $200 (if you hold $100) or $50 (if you hold $200, which is impossible here, wait—if you hold $100 derived from $A=50$, the other is $50).
  $$E[\text{Other} \mid V=100] = 200 \times \frac{8}{9} + 50 \times \frac{1}{9} = \frac{1600 + 50}{9} = \frac{1650}{9} \approx \$183.33$$

  **Verdict:** Your friend is right. $183.33 > 100$. Switching gains you ~$83.33 in expectation.

  **2. Where the Logic Fails (The Trap)**
  The 1.25x reasoning must fail somewhere to keep the total expected gain at zero (since the envelopes are symmetric before opening). It fails at the upper bound of the distribution.
  Suppose you open an envelope and see **$2,000,000**.
  This *must* mean $A = 1,000,000$ (since there is no $A=2,000,000$ in our table). You hold the larger envelope. The other envelope contains $1,000,000.
  $$E[\text{Other} \mid V=2,000,000] = 1,000,000$$
  **Verdict:** Switching loses you $1,000,000.

  **3. Why Your Friend Never Notices**
  In this specific distribution, the "Trap" ($V=2,000,000$) occurs with probability $0.5 \times 0.10 = 0.05$ (5%). The "Win" ($V=100$) occurs with probability 45%.
  If you play this game once, you likely see $100 and win. Your friend looks smart.
  If you play it 100 times, you will eventually hit the $2,000,000 case. When you do, the loss ($1M) wipes out all the previous small gains (~$83 each).
  *   Total Expected Gain from $100 cases: $0.45 \times 83.33 \approx +37.5$
  *   Total Expected Loss from $200 cases (derived from $A=100$): $0.40 \times (-100) = -40$
  *   Total Expected Gain from $1M cases: $0.05 \times 1,000,000 = +50,000$
  *   Total Expected Loss from $2M cases: $0.05 \times (-1,000,000) = -50,000$
  *   **Net Sum:** $37.5 - 40 + 50,000 - 50,000 \approx -2.5$ (Rounding errors aside, it sums to 0).

  Your friend doesn't notice the failure because the catastrophic loss happens at a value ($2M) that is **rare** (5% chance) and **large** (outside normal experience). In a casual argument, he assumes the distribution doesn't have a hard ceiling.

  ***

  ### Part 2: The Cursed Version (Always Switch)

  You asked for a setup where switching has positive expected value for **every single possible observed amount**. This is possible, but it requires sacrificing the existence of the mean.

  **The Setup:**
  Let the smaller amount $A$ take values $2^k$ for $k = 1, 2, 3, \dots$ (i.e., $2, 4, 8, 16, \dots$).
  We assign probabilities that decay slower than the standard paradox setup.
  $$P(A = 2^k) = \frac{1}{2} \left(\frac{2}{3}\right)^k$$
  *(Note: $\sum_{k=1}^{\infty} \frac{1}{2} (\frac{2}{3})^k = \frac{1}{2} \times \frac{2/3}{1/3} = 1$. This is a valid probability distribution.)*

  **1. Conditional Expectation**
  Suppose you observe $V = 2^k$. This happens if $A=2^k$ (you hold smaller) or $A=2^{k-1}$ (you hold larger).
  $$P(A=2^k \mid V=2^k) = \frac{0.5 \cdot P(A=2^k)}{0.5 \cdot P(A=2^k) + 0.5 \cdot P(A=2^{k-1})} = \frac{(2/3)^k}{(2/3)^k + (2/3)^{k-1}}$$
  Divide numerator and denominator by $(2/3)^k$:
  $$= \frac{1}{1 + (3/2)} = \frac{1}{2.5} = 0.4$$
  So, there is a 40% chance you hold the smaller amount ($2 \cdot 2^k$) and a 60% chance you hold the larger amount ($0.5 \cdot 2^k$).
  $$E[\text{Other} \mid V=2^k] = 0.4(2 \cdot 2^k) + 0.6(0.5 \cdot 2^k) = 2^k (0.8 + 0.3) = 1.1 \cdot 2^k$$
  **Verdict:** $1.1 \cdot 2^k > 2^k$. Switching is **always** beneficial, by 10%, no matter what value you see.

  **2. What Fails to Exist?**
  Your intuition says: "If switching is always good, I should switch before looking too."
  If you switch without looking, your expected gain is:
  $$E[\text{Gain}] = \sum_{v} P(V=v) \times (E[\text{Other}|v] - v) = \sum_{v} P(V=v) \times (0.1 v)$$
  Since $v$ grows exponentially ($2^k$) and $P(V=v)$ decays geometrically ($(2/3)^k$), the terms in this sum grow as $(4/3)^k$.
  $$\sum_{k=1}^{\infty} \text{const} \cdot \left(\frac{4}{3}\right)^k = \infty$$
  The expected gain is **positive infinity**.

  **The Catch:**
  For the symmetry argument ("envelopes are interchangeable") to hold, the expected amount of money in the envelopes must be a finite number. Let's calculate the expected value of the smaller amount $A$:
  $$E[A] = \sum_{k=1}^{\infty} 2^k \cdot P(A=2^k) = \sum_{k=1}^{\infty} 2^k \cdot \frac{1}{2} \left(\frac{2}{3}\right)^k = \frac{1}{2} \sum_{k=1}^{\infty} \left(\frac{4}{3}\right)^k = \infty$$
  **The Condition:** The mean amount of money in the envelope is **infinite**.
  When the mean is infinite, the statement $E[X] = E[Y]$ becomes $\infty = \infty$. In standard measure theory, you cannot subtract infinities. The expectation of the gain $E[Y - X]$ is undefined because the integral of the positive part diverges to $+\infty$ and the integral of the negative part (if you viewed it from the other envelope's perspective) also diverges. It is not zero; it is **undefined**.

  Your friend is "right" that switching increases expectation, but only because the expectation itself is a broken concept here. You are trading a finite amount for a slice of an infinite pie.

  ***

  ### Part 3: The Symmetry Intuition

  Here is exactly where the symmetry intuition snaps in each case.

  **1. In the Finite Version**
  *   **Status:** Symmetry is **Intact**.
  *   **Explanation:** Before you open the envelope, $E[\text{Gain}] = 0$. The envelopes are truly interchangeable.
  *   **The Break:** The symmetry breaks **conditionally**. By opening the envelope and seeing $100, you gain information. You are no longer in the "prior" state; you are in the "posterior" state. The information "$V=100$" is correlated with the underlying distribution. It tells you that you are likely in the "peak" of the probability mass ($A=100$) rather than the tail ($A=50$).
  *   **Why it feels like a paradox:** You confuse the *unconditional* symmetry (before looking) with the *conditional* asymmetry (after looking). Your friend applies the unconditional logic ("it's 50/50") to a conditional situation ("I see 100").

  **2. In the Cursed Version**
  *   **Status:** Symmetry is **Broken Globally**.
  *   **Explanation:** The envelopes are interchangeable in *distribution* (they have the same probability law), but they are **not** interchangeable in *expectation* because the expectation does not exist.
  *   **The Break:** The symmetry argument relies on the linearity of expectation: $E[Y - X] = E[Y] - E[X]$. This law holds only if $E[Y]$ and $E[X]$ are finite. When $E[X] = \infty$, the arithmetic $\infty - \infty$ is undefined.
  *   **Why it feels like a paradox:** You assume that "identical distributions" implies "zero expected difference." This is true for finite means, but false for infinite means. In the cursed version, you can construct a scenario where $Y$ is always stochastically larger than $X$ even if they come from the same "family" of distributions, simply because the tail is heavy enough to break the accounting.

  ### Summary for Your Buddy
  1.  **Finite Case:** He is right about $100 because the probability distribution is spiked there. He is wrong globally because the losses at the maximum possible value balance the books. He doesn't see the losses because they are rare or huge.
  2.  **Cursed Case:** He is right that switching always adds value, but only because the average amount of money in the room is infinite. The math of "expected value" stops working, so his conclusion is technically true but practically meaningless (you can't cash an infinite check).
  3.  **Symmetry:** In the real world (finite money), symmetry holds on average, but looking inside breaks the symmetry locally. In the infinite world, symmetry breaks because infinity isn't a number you can balance.
