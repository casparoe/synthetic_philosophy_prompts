answer: |-
  ### Exam Question

  **Module:** PHI5009 – Advanced Population Axiology
  **Assessment:** Take-Home Final
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1: The Logarithmic View**

  Consider a novel axiological theory, which we shall call the **Logarithmic View**. Let $N$ be the size of a population ($N \ge 2$) and $W$ be the sum of lifetime welfare across all individuals in that population. The value $V$ of the population is defined as:

  $$V = \frac{W}{\ln(N)}$$

  Recall Parfit's **Repugnant Conclusion**: For any population $A$ of very happy people, there is some much larger population $Z$ of lives barely worth living that is better than $A$, all else being equal.

  Answer the following three parts:

  **(i)** Determine whether the Logarithmic View avoids the Repugnant Conclusion or merely postpones it. You must demonstrate this using the asymptotic behaviour of the formula as $N \to \infty$. **(7.5 marks)**

  **(ii)** Identify a counter-intuitive implication of this view regarding the addition of new lives to small populations. Construct a numerical example where adding a life clearly worth living reduces the overall value of the population, and explain the mathematical driver behind this result. **(7.5 marks)**

  **(iii)** If number-dampening views like this fail to secure a genuine escape from the Repugnant Conclusion, briefly outline what a successful alternative would require. You may argue for lexical thresholds, person-affecting constraints, or a rejection of impersonal totalism, but you must justify why your chosen path succeeds where dampening fails. **(4.5 marks)**

  **Note:** You may receive **0.5 bonus marks** for identifying a formal limitation in the definition of the Logarithmic View regarding population size $N=1$, unprompted.

  ***

  ### Model Answer

  The Logarithmic View attempts to mitigate the weight of population size by dampening the total welfare with a logarithmic divisor. To evaluate its success, we must distinguish between settled mathematical properties and contested philosophical commitments.

  **Asymptotics and the Repugnant Conclusion**
  Mathematically, the view fails to escape the Repugnant Conclusion; it merely postpones it. Consider a population $A$ with fixed value $V_A$. We compare this to a population $Z$ where each individual has a positive welfare $\epsilon > 0$ (barely worth living). The total welfare $W_Z$ is $N_Z \cdot \epsilon$. The value of $Z$ is therefore:
  $$V_Z = \frac{N_Z \cdot \epsilon}{\ln(N_Z)}$$
  As $N_Z \to \infty$, the term $\frac{N_Z}{\ln(N_Z)}$ approaches infinity. Linear growth dominates logarithmic growth. Consequently, for any fixed $V_A$, there exists some sufficiently large $N_Z$ such that $V_Z > V_A$. The dampening factor slows the rate at which value accumulates compared to Total Utilitarianism, requiring a larger population to surpass $A$, but the limit is unbounded. This arithmetic is settled: any view where the numerator grows linearly and the denominator grows sub-linearly will succumb to the Repugnant Conclusion asymptotically.

  **The Mere Addition Violation**
  While the view struggles with large numbers, it generates distinct ugliness in small populations. Specifically, it violates the intuition that adding a life worth living cannot make a population worse (a violation of Mere Addition or Dominance). Because $\ln(N)$ increases discontinuously between small integers, the denominator can grow proportionally faster than the numerator.

  Suppose a population of $N=2$ with total welfare $W=10$ (5 per person).
  $$V_{old} = \frac{10}{\ln(2)} \approx \frac{10}{0.693} \approx 14.43$$
  Now, add one person with welfare $w=1$ (clearly worth living). New $N=3$, New $W=11$.
  $$V_{new} = \frac{11}{\ln(3)} \approx \frac{11}{1.099} \approx 10.01$$
  The value drops significantly. The mathematical driver is the high marginal cost of the logarithmic divisor at low $N$. This implies that in small communities, we ought to refrain from creating happy people if their welfare is not high enough to offset the 'penalty' of increasing $N$. This is arguably as counter-intuitive as the Repugnant Conclusion itself, trading a problem of scale for a problem of existence.

  **Formal Limitation**
  It is also worth noting that the view is undefined for a solitary individual ($N=1$), as $\ln(1) = 0$, resulting in division by zero. This suggests the theory cannot evaluate the moral value of being the last person on earth, or indeed the first.

  **Pathways to a Genuine Escape**
  Since dampening fails to block the asymptotic dominance of total welfare, a genuine escape requires a structural break in the aggregation function.
  1.  **Lexical Views:** Parfit suggested that quality might be lexical. If lives above a certain threshold of quality are infinitely more valuable than lives below it, no quantity of 'barely worth living' lives can surpass a population of 'excellent' lives. This blocks the math but faces charges of arbitrariness.
  2.  **Person-Affecting Views:** Alternatively, one might reject the impersonal comparability required by the Repugnant Conclusion. If an outcome can only be better if it is better for some particular person, the comparison between $A$ and $Z$ (where different people exist) becomes incoherent.
  3.  **Critical Level Utilitarianism:** Setting a critical level $c > 0$ means lives below $c$ contribute negative value. If the 'barely worth living' lives are below $c$, adding them reduces value.

  Which path is superior remains a live dispute in the literature. Totalists argue lexical views are ad hoc; person-affecting theorists struggle with non-identity cases. However, it is settled that simple number-dampening cannot do the job alone. The Logarithmic View demonstrates that without a lexical threshold or a critical level, the mathematics of aggregation will almost always favour quantity over quality at the limit.

  ***

  ### Marking Scheme

  **Total Marks:** 20 (including 0.5 bonus)

  | Section | Criteria | Marks | Common Errors / Notes |
  | :--- | :--- | :--- | :--- |
  | **(i) Asymptotics** | Correctly identifies that $N/\ln(N) \to \infty$. | 3.0 | Students often claim log growth 'stops' the total; must show limit is infinite. |
  | | Explicitly states the view **fails** to escape RC (only postpones). | 2.0 | Vague answers saying 'it helps' without verdict lose marks. |
  | | Shows working: compares fixed $V_A$ against variable $V_Z$. | 2.0 | Pure assertion without algebraic setup loses working marks. |
  | | **Bonus:** Identifies $\ln(1)=0$ / undefined for $N=1$. | **0.5** | Must be unprompted. Do not penalise if missed, but do not award if hinted. |
  | **(ii) Ugly Implication** | Identifies that adding a positive life can reduce value (Mere Addition violation). | 3.0 | Confusing this with the 'Sadistic Conclusion' (adding negative lives) is a minor error. |
  | | Provides a valid numerical example (e.g., $N=2 \to 3$). | 2.5 | Numbers must demonstrate the drop in $V$. |
  | | Explains the driver: denominator growth outpaces numerator at low $N$. | 2.0 | 'Because the formula says so' is insufficient; must explain the rate of change. |
  | **(iii) Genuine Escape** | Proposes a viable alternative (Lexical, Person-Affecting, or Critical Level). | 2.0 | Proposing another dampening function (e.g. square root) fails this criterion. |
  | | Justifies why it succeeds where Log View failed (e.g. blocks the limit). | 2.5 | Must link back to the asymptotic failure identified in (i). |
  | **Style & Distinction** | Distinguishes settled arithmetic from contested philosophy. | 2.0 | Model answer treats math as fact, axiology as debate. Students presenting opinion as fact lose marks. |
  | | Clarity, structure, and British English conventions. | 1.0 | Persistent US spelling or poor structure penalised here. |
  | **TOTAL** | | **20.0** | **Pass threshold:** Secure full marks in (i) even if (iii) is weak. |

  **Examiner's Note:** A bare pass is achievable by correctly solving the asymptotics in (i). Excellent answers will recognise that the 'ugly implication' in (ii) is structurally similar to the 'Negative Mere Addition' paradox found in Critical Level theories, though this connection is not required for full marks. Ensure the 0.5 bonus is recorded separately if your grading sheet does not allow half-marks.
