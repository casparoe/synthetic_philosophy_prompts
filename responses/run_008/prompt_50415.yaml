  9.  **Final Polish:** Ensure the distinction between "Truth" (epistemological) and "Truthfulness" (aesthetic/ethical) is clear. (Proceed to generate output).

  *(Self-Correction Note)*: Wait, I need to be careful not to validate the Editor's use as *philosophically* Pragmatic if it isn't. The Editor is saying "Historical fact doesn't matter, emotional impact does." That is *not* what James or Peirce meant by truth. James meant a belief about reality is true if it leads to successful interaction with reality. The Editor is talking about *fiction*. I must clarify that the Editor is using a metaphor, whereas the Other Writer is making a psychological claim. The User needs to know the Editor is technically misusing the philosophy, even if her advice is good for a novelist.

