      *   *Item 6: The Radical Relativist Reading.* Truth is *nothing but* convenience. No external anchor.
          *   *Editor Support:* Yes (extreme version).
          *   *Other Writer Support:* Yes.
          *   *Philosopher:* Neither (Sophists/Post-modern caricature).

  4.  **Refining the Peirce vs. James Distinction:**
      *   Peirce: Truth is *independent* of what you or I think, but defined by the *method* of science/inquiry. "What works" means "what successfully predicts experience in the long run." It's objective.
      *   James: Truth is more fluid. It's about the "marriage" between the idea and reality. If a belief brings good consequences (spiritual, moral, practical), it has "cash value." He allows for religious truth to be "true" if it works for the believer, even if not empirically verifiable in a Peircean sense.
