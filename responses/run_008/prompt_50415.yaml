answer: |-
  This is a superb question. You have correctly identified that "the truth is what works" is a philosophical shibboleth that gets tossed around like a coin that changes value depending on who spends it. Your editor and the festival writer are indeed using different currencies, and both are spending a debased version of the original Pragmatist coinage.

  Here is the menu you requested. I have broken the phrase down into six distinct readings, ranging from the methodological to the metaphysical. For each, I have assessed its defensibility, its alignment with your editor or the other writer, and its philosophical provenance (Peirce, James, or Pop).

  ### The Menu: Six Readings of "The Truth Is What Works"

  #### 1. The Heuristic Reading
  *   **The Claim:** Truth is a fixed property of reality, but we can't access it directly. However, beliefs that "work" (predict outcomes successfully) are our best *indicator* that we have found the truth. Utility is a *test* for truth, not the *definition* of it.
  *   **Defensibility:** **High.** This is scientifically robust. If your map helps you navigate the terrain, it's likely a good map.
  *   **Editor Fit:** **No.** She isn't saying fact-checking is a useful *test* you can skip; she's saying the facts don't matter.
  *   **Writer Fit:** **No.** This requires an external reality to check against.
  *   **Provenance:** **Peirce.** (He viewed pragmatism as a method for clarifying concepts to aid scientific inquiry, not a definition of truth itself).
  *   **Verdict:** Safe, boring, and not what anyone at your dinner party is arguing about.

  #### 2. The Aesthetic Reading (The Editor's Actual Position)
  *   **The Claim:** In the context of art, "truth" does not mean *correspondence to fact* but *coherence of experience*. A scene is "true" if it produces a genuine emotional or psychological effect in the reader, regardless of historical accuracy.
  *   **Defensibility:** **High (within aesthetics).** This is Aristotelian: poetry is more philosophical than history because it deals with universals (what *might* happen) rather than particulars (what *did* happen).
  *   **Editor Fit:** **Perfect.** This is exactly what she means. She is using "truth" as a synonym for "verisimilitude."
  *   **Writer Fit:** **Low.** The other writer was talking about a character's survival mechanism, not narrative resonance.
  *   **Provenance:** **Neither.** This is literary theory, not epistemology. She is borrowing Pragmatist *rhetoric* to defend an Aesthetic *choice*.
  *   **Verdict:** Defensible for a novelist, but philosophically distinct from Pragmatism. She is committing a category error, but a useful one for your craft.

  #### 3. The Psychological/Instrumental Reading (The Other Writer's Position)
  *   **The Claim:** A belief is "true for [Person X]" if holding that belief allows Person X to function, survive, or flourish. The external factuality is irrelevant; the internal utility constitutes the truth *for that subject*.
  *   **Defensibility:** **Medium.** Defensible in therapy or sociology (functionalism), but dangerous in epistemology. It conflates "truth" with "beneficial delusion."
  *   **Editor Fit:** **Low.** The editor cares about the *reader's* experience, not the character's sanity.
  *   **Writer Fit:** **Perfect.** This is the "belief that keeps her functional" argument.
  *   **Provenance:** **William James (Vulgarized).** James argued that if a belief brings "vital benefits," it has a claim to truth, but he didn't mean it creates its own reality.
  *   **Verdict:** Radical. It makes truth subjective. If a racist belief "works" for a racist (gives them community/status), this reading struggles to call it false without smuggling in external criteria.

  #### 4. The Jamesian "Cash-Value" Reading
  *   **The Claim:** Truth is not a static property. Truth *happens* to an idea. An idea becomes true insofar as it helps us get into satisfactory relation with other parts of our experience. "Working" includes moral, spiritual, and practical satisfaction.
  *   **Defensibility:** **Contested.** It dissolves the hard line between fact and value. It allows religious or moral truths to be "true" without empirical proof, provided they enrich life.
  *   **Editor Fit:** **Medium.** If "working" means "satisfying the reader's demand for meaning," this supports her.
  *   **Writer Fit:** **High.** The character's belief "works" by integrating her trauma, thus becoming "true" in her lived experience.
  *   **Provenance:** **William James.** (*Pragmatism*, 1907). He explicitly argued truth is made in the course of experience.
  *   **Verdict:** The bridge between the Editor and the Writer. It allows truth to be plural and process-based, but still requires a "marriage" with reality, not just wishful thinking.

  #### 5. The Peircean "Final Opinion" Reading
  *   **The Claim:** Truth is what the community of inquirers *would* agree upon if investigation were pushed far enough (the long run). "What works" means "what withstands all future testing and doubt."
  *   **Defensibility:** **High (Scientifically).** It anchors truth in reality (you can't believe your way out of gravity) but acknowledges our current fallibility.
  *   **Editor Fit:** **Opposite.** This view demands you check the facts, because the "final opinion" includes historical record.
  *   **Writer Fit:** **No.** A character's functional delusion would be considered false until it aligned with the "final opinion" of reality.
  *   **Provenance:** **C.S. Peirce.** He hated the idea that truth was individual satisfaction. For him, truth is *concrete* and *external*.
  *   **Verdict:** The antidote to the pop version. If your editor were a Peircean, she would tell you to fact-check because the "long run" of history matters.

  #### 6. The Radical Relativist Reading (The Pop Version)
  *   **The Claim:** There is no external reality to check against. Truth is *constituted* entirely by convenience, power, or immediate utility. If it works for me, it is true, period.
  *   **Defensibility:** **Low.** Self-refuting. (Is the statement "truth is relative" true for everyone, or just for you?)
  *   **Editor Fit:** **High (Implicitly).** "Don't bother with facts, just make it sing."
  *   **Writer Fit:** **High.** "Her truth is her truth."
  *   **Provenance:** **Sophists / Post-Modern Caricature.** Neither Peirce nor James endorsed this. James required a "lead" toward reality; Peirce required external constraint.
  *   **Verdict:** Philosophically bankrupt, but culturally dominant. This is the "mangled hybrid" you suspected.

  ***

  ### The Peirce vs. James Split (For Your Notes)

  You asked to flag where the line divides. Here is the precise friction point:

  **Peirce (The Realist):**
  *   **Motto:** "Truth is what *would* work eventually."
  *   **Anchor:** The External World.
  *   **View on your book:** Fact-checking matters. If you write that the Battle of Hastings was in 1067, that belief will not "work" in the long run of inquiry. It clashes with the brute fact of history.
  *   **Verdict on Editor:** Peirce would call your editor's advice "nominalist error." She is prioritizing the *sign* (the story) over the *object* (the history).

  **James (The Humanist):**
  *   **Motto:** "Truth is what *does* work now."
  *   **Anchor:** The Stream of Experience.
  *   **View on your book:** If the historical fact (1066) ruins the emotional arc, and changing it (to 1067) creates a richer, more meaningful experience for the reader without causing practical harm, James might allow the change. Truth is the "expedient in the way of thinking."
  *   **Verdict on Editor:** James is the Editor's patron saint, *but* with a caveat. James insisted that new truths must "marry" old truths. You can't just ignore history; you have to assimilate it. If your change creates a "better" story but violates the "stock of old opinions" (known history) without justification, James might say you've broken the chain of continuity.

  **The Mangle:**
  Your editor is using **James's language** ("what works") to justify **Aesthetic Coherence** (Reading #2), while implicitly relying on **Radical Relativism** (Reading #6) to dismiss the facts. She is borrowing James's flexibility but discarding his requirement that the belief must still connect to *some* reality (even if that reality is just the reader's emotional landscape).

  ***

  ### Dinner Party Cheat Sheet

  If you want to drop this knowledge without sounding pedantic, here is the synthesis:

  1.  **On the Editor:** "My editor is actually making an **Aristotelian** argument, not a Pragmatist one. She's arguing for *poetic truth* (universals) over *historical truth* (particulars). She's using 'what works' as a metaphor for emotional resonance."
  2.  **On the Other Writer:** "That writer was channeling a vulgarized **William James**. James argued truth is made in the process of living, but he didn't mean 'anything goes.' He meant a belief is true if it successfully guides you through experience without clashing violently with other verified truths."
  3.  **The Kicker:** "The danger is **Peirce's warning**. Peirce split from James because he thought defining truth as 'what satisfies me' was dangerous. Peirce insisted truth is what the community *must* agree on eventually. So, if I lie about history, I'm betting that no one will ever check. That's not pragmatism; that's just gambling."

  **Summary Verdict:**
  *   **Editor:** Defensible as *artistic advice*, philosophically loose.
  *   **Other Writer:** Defensible as *psychological description*, philosophically risky (slides into relativism).
  *   **Peirce:** Would tell you to fact-check.
  *   **James:** Would tell you to check if the fact-checking kills the "life" of the book, but warned against severing ties with reality entirely.

  You are not confidently wrong. You are correctly identifying that your editor is using a philosophical sledgehammer to crack an aesthetic nut.
