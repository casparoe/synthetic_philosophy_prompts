answer: |-
  This is a profound and structurally significant tension in bioethics and health policy. You have identified a fissure between the **deontological texture of clinical practice** and the **consequentialist architecture of health economics**. The asymmetry you describe is real, but its theoretical grounding is often obscured by pragmatic habit.

  Here is an analysis of the moral presuppositions of bedside practice, an assessment of its consistency with QALY-based allocation, an identification of the underdetermination in current theory, and a sketch of the implications of adopting Lexical-Threshold Negative Utilitarianism (LTNU).

  ### 1. The Bedside Presuppositions: Why Pain is Special

  The clinical asymmetry you describe—where pain relief is mandatory and pleasure enhancement is supererogatory—does not necessarily presuppose a global axiological claim that pain is lexically worse than pleasure in *all* contexts. Instead, it relies on a specific conception of the **goal of medicine** and the **doctor-patient relationship**.

  **A. The Duty of Rescue vs. The Duty of Beneficence**
  The strongest explanation is not axiological (about the value of states) but deontological (about the role of the agent). Clinical ethics is dominated by a **Duty of Rescue**. Pain represents an active harm, a threat to integrity, or a failure of function. The physician is cast as a rescuer. Pleasure enhancement, by contrast, falls under general beneficence. In moral philosophy, duties of rescue (preventing severe harm) are typically stringent and agent-relative, whereas duties to benefit (increasing welfare) are often weaker or imperfect.
  *   *Presupposition:* Medicine is a remedial institution, not a hedonic one. Its mandate is to restore the patient to a baseline of "normal functioning" (following Daniels/Boorse), not to elevate them above it. Pain pushes one below baseline; mere lack of extra pleasure does not.

  **B. The Veto of Suffering (Autonomy)**
  There is also an autonomy-based argument. Severe pain compromises agency; it coerces the will. A patient in agony cannot exercise meaningful autonomy. Therefore, relieving pain is a precondition for respecting autonomy. Enhancing pleasure in a content patient does not expand agency in the same way; it risks tipping into manipulation or paternalism.
  *   *Presupposition:* Pain relief restores the capacity for choice; pleasure enhancement imposes a specific conception of the good.

  **C. Is it Lexical Priority?**
  Does this imply lexical priority (no amount of pleasure offsets pain)? Clinically, **no**. We routinely trade pain for gain (e.g., post-surgical pain for a cured appendix, chemotherapy toxicity for remission). If pain were lexically prior in an absolute sense, no painful treatment could ever be justified.
  *   *Verdict:* The bedside practice presupposes a **threshold prioritarianism**, not strict lexicality. Suffering has priority *up to a point* (the restoration of function), after which trade-offs are permitted. It is a "sufficientarian" view of clinical duty: get the patient out of the red zone, then stop.

  ### 2. Reconciling Bedside Practice with QALYs

  The QALY (Quality-Adjusted Life Year) framework assumes **fungibility**: a 0.1 gain in utility is a 0.1 gain, whether it comes from removing agony or adding delight. This appears inconsistent with the bedside asymmetry. However, they can be reconciled through a **Division of Moral Labor**.

  **A. Agent-Relative vs. Agent-Neutral**
  *   **Bedside (Agent-Relative):** The clinician has a special obligation to *this* patient to prevent *this* harm. This is a constraint-based ethic. The clinician cannot say, "I won't treat your pain because I can generate more QALYs by giving Viagra to three happy men."
  *   **HTA/QALY (Agent-Neutral):** The policymaker allocates resources for the *population*. Here, the constraint relaxes into aggregation. The QALY is a bookkeeping device for efficiency *within the constraint set* established by clinical ethics.
  *   *Reconciliation:* The system is consistent if we view QALYs as a tool for maximizing health *subject to* the side-constraint that severe suffering must be addressed first. The inconsistency arises only if QALYs are treated as a complete moral theory rather than a metric for efficiency within a prioritarian framework.

  **B. The "Zero Point" Problem**
  Technically, most standard QALY instruments (like EQ-5D) cap "perfect health" at 1.0. They rarely measure "gains above neutral" in the hedonic sense you describe; they measure "health utility." A drug that makes a healthy person "feel good" usually yields 0 QALY gain in standard HTA because they are already at the ceiling of health utility.
  *   *Reconciliation:* The apparent commensurability is often illusory. HTA bodies rarely fund "enhancement." They fund movement from <1 to 1. They do not fund 1 to 1.2. Thus, practice and policy align: both prioritize moving people out of deficit over moving people into surplus. The theoretical inconsistency exists in the *math* of the utility scale, but not necessarily in the *funding rules*.

  ### 3. Theoretical Underdetermination

  Which rival accounts of the pleasure/pain relation license the current pattern (Bedside Asymmetry + QALY Commensurability)? The current system is a "reflective equilibrium" that allows at least three distinct theories to coexist because they converge on policy recommendations in most standard cases.

  1.  **Weighted Prioritarianism:** Suffering counts for more than pleasure because the moral weight of a benefit is a function of the recipient's baseline. Relieving pain helps the worse-off; enhancing pleasure helps the better-off. This licenses bedside priority and can be modeled in QALYs via equity weighting.
  2.  **Sufficientarianism:** There is a threshold of "enough." Below it (pain), justice demands intervention. Above it (contentment), justice is silent. This explains the bedside duty and explains why HTA rarely funds enhancement (everyone is assumed to be above the threshold of "health need").
  3.  **Hybrid Deontology/Consequentialism:** Clinical interaction is governed by deontological constraints (do no harm), while resource allocation is governed by consequentialist aggregation (maximize total health). This licenses the asymmetry in the room and the symmetry in the spreadsheet.

  **Where is the theory underdetermined?**
  It is underdetermined regarding **marginal cases**.
  *   *Case:* A treatment costs the same. Option A moves a patient from "Severe Pain" to "Mild Pain." Option B moves a patient from "Content" to "Ecstatic."
  *   *Current Practice:* Would likely fund A (clinical need).
  *   *QALY Logic:* If the utility gain is identical, B is fundable.
  *   *The Gap:* The current system hedges. It uses QALYs to measure *size* of benefit, but applies "clinical need" filters to determine *eligibility*. We don't know if this is because pain is objectively worse (axiology) or because medicine is structurally limited (institutional role).

  ### 4. Sketching a System Based on Lexical-Threshold Negative Utilitarianism (LTNU)

  If we abandon the current hedge and adopt **LTNU** as the explicit governing theory (Suffering is lexically worse than pleasure up to a threshold of elimination; pleasure has no moral weight against suffering), the health system would undergo radical transformation.

  **A. No Positive Duty to Enhance Happiness**
  Under LTNU, pleasure has no lexical weight against suffering. Therefore, a "duty to enhance happiness" in the population would vanish.
  *   *Change:* Funding for "feel-good" interventions (e.g., lifestyle drugs, cosmetic enhancements, mood-brighteners for the well) would drop to zero. Resources currently spent on marginal quality-of-life improvements for the healthy would be diverted entirely to suffering reduction.
  *   *QALY Impact:* The QALY metric would break. You cannot add "pleasure units" to "pain relief units." You would need a **Suffering-Adjusted Life Year (SALY)** metric where the goal is to minimize negative values, not maximize positive ones.

  **B. Funding Priorities**
  *   *Change:* Funding for pain relief in the ill would not just rival funding for enhancement; it would **consume** it. A LTNU system would likely defund treatments that offer marginal longevity or quality gains to those already above the suffering threshold if those resources could eliminate severe suffering elsewhere.
  *   *Example:* Expensive cancer drugs that extend life by 3 months in a painful state might be rejected in favor of palliative care that eliminates pain for 100 patients, even if the total "QALYs" are lower, because the *lexical* priority is eliminating the negative state.

  **C. Palliative Sedation: From Permissible to Obligatory**
  This is the most drastic implication. Currently, palliative sedation is permissible because we balance the value of consciousness against the value of pain relief.
  *   *LTNU View:* If the patient is above the threshold of intractable suffering, consciousness has no lexical weight to oppose the suffering.
  *   *Change:* If a patient is in lexically bad suffering and sedation is the only relief, LTNU suggests a **duty to sedate**. To keep them conscious is to prioritize a "good" (consciousness) that has no standing against the "bad" (suffering).
  *   *Caveat:* This holds only if the patient consents (autonomy constraint). But morally, the *physician's* hesitation based on the "sanctity of consciousness" would be unjustified under LTNU.

  **D. The Threshold Problem**
  LTNU requires defining the threshold.
  *   *Change:* The health system would need a rigorous, standardized definition of "Suffering Threshold." Any condition above this threshold becomes a moral emergency. Conditions below it (mild discomfort, mere dissatisfaction) become morally invisible to the system.
  *   *Risk:* This creates a "cliff-edge" effect. A patient just above the threshold gets everything; a patient just below gets nothing. This is administratively volatile compared to the smooth trade-offs of utilitarianism.

  ### Summary for your Dissertation

  The asymmetry you observe is not a bug but a feature of a system trying to serve two masters: the **individual patient** (who needs rescue from harm) and the **population** (which needs efficient allocation).

  *   **Bedside:** Presupposes a **Sufficientarian/Rescue Model**. Pain is a deficit to be corrected; pleasure is a surplus that is optional.
  *   **QALY:** Presupposes a **Fungible Utility Model**. Pain and pleasure are coordinates on a single line.
  *   **Reconciliation:** Possible only if QALYs are treated as a metric of *magnitude* constrained by a prioritarian rule of *eligibility*.
  *   **LTNU Implication:** Adopting LTNU would shatter the QALY framework, eliminate enhancement medicine, and potentially mandate sedation in intractable cases, shifting medicine from a practice of "health optimization" to "suffering elimination."

  Your dissertation could argue that the current "theoretical mess" is actually a pragmatic adaptation to the fact that we do not agree on the axiology of pain/pleasure, so we compartmentalize: we act like Negative Utilitarians at the bedside and like Hedonic Utilitarians in the boardroom. The ethical risk lies in letting the boardroom logic (QALYs) colonize the bedside, thereby eroding the lexical priority of suffering relief.
