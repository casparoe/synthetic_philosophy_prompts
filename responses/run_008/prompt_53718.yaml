answer: |-
  The Adventure of Silver Blaze" offers not a solution to the frame problem but a fantasy of its resolution, exposing the cognitive labor of relevance even as it disguises that labor within the artificial closure of the whodunit. When Sherlock Holmes asks Inspector Gregory what struck him as curious about the crime on Dartmoor, Gregory points to the missing racehorse and the dead trainer. Holmes corrects him: "I called your attention to the curious incident of the dog in the night-time." When Gregory notes that the dog did nothing, Holmes replies, "That was the curious incident." This exchange is the perfect emblem of the frame problem, that foundational crisis in artificial intelligence and cognitive science concerning how a reasoning system determines which of its indefinitely many beliefs are affected by an action and which remain fixed. In the technical formulation by McCarthy and Hayes, the problem is logical: how to program a robot to understand that moving a block does not change its color without explicitly listing every non-changing property in the universe. In the broader philosophical hands of Dennett and Dreyfus, it becomes the problem of relevance: how does a mind know what matters in a specific context without exhaustively checking every possible implication? The silent dog is informative only against a massive, unspoken background of expectations—that dogs bark at strangers, that this dog was present, that the night was quiet. Holmes solves the crime by isolating a non-event, but he can only do so because the story has already solved the frame problem for him.

  Detective fiction systematically hides the frame problem rather than solving it, creating a world where the combinatorial explosion of irrelevant data has been pruned by an authorial hand. In the reality of the moor, there were infinite non-events: the owl did not hoot, the wind did not shift east, the trainer's left boot did not untie. In Watson's narration, however, only the dog's silence is permitted to exist as a candidate for relevance. Watson narrates only what turns out to matter; in the story-world every noticed detail eventually pays off, as though the world were pre-filtered by Doyle who has already done the relevance work Holmes only seems to do. This is the genre's great cheat. Holmes's celebrated distinction between merely seeing and genuinely observing is not a triumph of cognitive processing over raw sensory input, but a reflection of the narrative structure itself. He does not struggle to filter the noise because the author has removed the noise. If Holmes were a real cognitive agent facing the frame problem, he would be paralyzed by the infinite silence of everything else that did not happen on the moor that night. The story presents a universe where significance is intrinsic to objects and events, waiting to be found, rather than imposed by the observer's goals and background knowledge.

  Yet, the story genuinely engages the frame problem in the moment Holmes forces the background expectations into the foreground. He does not simply notice the silence; he constructs the counterfactual frame that makes the silence meaningful. He must verify that the dog was there, that it was capable of barking, and that the intruder was indeed a stranger to the dog's usual behavior. This mirrors the philosophical shift from McCarthy's logical axioms to Dennett's expectation-based systems. The evidential force of the absence depends entirely on a background frame of expectations about dogs and intruders; knowing which non-events are informative is precisely the problem of relevance. Holmes engages this by treating the frame itself as evidence. He realizes that the dog's silence implies the intruder was known to the dog, which implicates the trainer, which reshapes the entire causal history of the crime. Here, the story acknowledges that relevance is not a property of the data but a relationship between the data and a model of the world. Holmes succeeds because he can rapidly swap frames—shifting from "stranger steals horse" to "acquaintance manipulates horse"—whereas Gregory remains stuck in a single, rigid frame where only positive actions count as clues.

  Does the story know the difference between its cheat and its engagement? It occupies a liminal space. It knows enough to make Holmes articulate the method, to warn against theorizing before data, and to highlight the danger of ignoring the negative space. But it cannot fully admit the cheat without collapsing the mystery. If Holmes acknowledged that he only noticed the dog because the universe was scripted to make the dog matter, the illusion of his genius would vanish. Therefore, the story must maintain the fantasy that Holmes's mind is the source of the filtering, rather than the author's pen. This tension is where the genre adds something vital to the philosophy that arguments alone do not. The philosophical debate describes the structural impossibility of perfect relevance; the detective story simulates the psychological experience of overcoming it. It offers the catharsis of closure in a world that is fundamentally open-ended.

  Ultimately, detective fiction is the fantasy of a world without a frame problem, and that fantasy teaches us about the real one by showing us what we desire when we think about thinking. We want a world where clues are distinct from noise, where effects follow causes cleanly, and where the right frame reveals the truth rather than constructing it. The genre satisfies this desire by providing a closed system where every detail is guaranteed to be relevant, a luxury unavailable to real cognitive agents. But by highlighting the "curious incident" of the dog, the story reminds us that intelligence is not about processing everything, but about knowing what to ignore. It teaches that the frame problem is not a bug to be fixed in our cognitive architecture, but the condition of intelligence itself. We are not Holmes, and the world is not a story; there is no author to filter the noise. But like Holmes, we survive by betting on which silences matter, constructing frames that allow us to act despite the infinite uncertainty of what did not happen. The story comforts us with the lie that the frame can be solved, but it haunts us with the truth that solving it requires changing the world into a story where only the relevant things exist.
