prompt: |-
  I'm a program officer at a mid-sized foundation, and every quarter our grants committee has to pick between proposals while the seven of us flatly disagree about what matters. Two are basically utilitarians, one holds a person-affecting view (thinks you can't be harmed before you exist), one gives serious moral weight to animals, one is a contractualist who thinks some ways of treating people are off the table regardless of payoff, and the rest are mixtures. So far we resolve this by whoever argues longest, and the board is starting to ask why we funded X over Y.

  I want a decision procedure the committee can actually run in a two-hour meeting, based on whatever the moral uncertainty literature actually says -- maximizing expected choiceworthiness, Borda-style aggregation across theories, Bostrom's moral parliament idea, variance voting -- but usable when nobody will give real probability weights to their theories. If a step starts with "estimate how confident you are in each theory," they'll refuse or just make numbers up, so the procedure needs a fallback. It should say what to do when theories use different currencies (a contractualist's "this is impermissible" isn't a number you can average with a utilitarian's), where it hands the call back to a plain majority because it's a values question the math can't settle, and it has to produce an explanation a board member could follow.

  Then run it on two of the proposals we recieve: (a) $500k for a campaign to phase out a painful but standard livestock procedure, versus the same money for vision screening and eyeglasses for schoolkids in low-income countries; (b) a grant to set up a far-future-focused research institute, where the person-affecting folks think the benefit is literally zero and the utilitarians think it dwarfs everything else. Include at least one case where the procedure gives an answer I won't like -- I'm the animal person, and I suspect the arithmetic favors the eyeglasses.

  Format, in this order: "The procedure" (numbered steps, short enough to print on one page), "The two cases" (a worked run of each, roughly half a page apiece), "Where it breaks" (one short paragraph on what this genuinely can't settle).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Program Officer at a mid-sized foundation.
      *   **Problem:** Grants committee (7 members) has deep moral disagreements (Utilitarianism, Person-Affecting View, Animal Ethics, Contractualism, Mixed). Current process is "whoever argues longest." Board is asking for justification.
      *   **Goal:** A decision procedure for a 2-hour meeting based on moral uncertainty literature (expected choiceworthiness, Borda, Moral Parliament, Variance Voting) but *without* requiring explicit probability weights (members refuse/fake them).
      *   **Constraints:**
          *   Must handle incommensurable currencies (e.g., Contractualist "impermissible" vs. Utilitarian "utils").
          *   Must have a fallback to majority vote when math fails.
          *   Must produce a board-friendly explanation.
          *   Must include a "hard truth" case (User is the animal person, expects arithmetic to favor eyeglasses).
          *   Format: "The procedure" (1 page), "The two cases" (worked examples), "Where it breaks" (limitations).

  2.  **Deconstruct the Moral Uncertainty Challenge:**
      *   *Standard Approach:* Maximize Expected Choiceworthiness (MEC). Requires $P(Theories) \times Value(Actions)$.
      *   *Constraint:* Users won't give probabilities ($P$).
      *   *Solution:* Use ordinal ranking or voting proxies. Borda Count is good for aggregating rankings without probabilities. "Moral Parliament" (Bostrom) suggests delegating voting power based on credence, but without credences, we treat each member/theory as a delegate.
      *   *Incommensurability:* Contractualist vetoes need a specific mechanism (e.g., a "red flag" step before scoring).
      *   *Time Limit:* 2 hours. Needs to be streamlined.
      *   *Board Explanation:* Needs to sound rigorous but not overly academic. "Weighted consensus" or "Multi-criteria evaluation."

  3.  **Drafting "The Procedure":**
      *   *Step 1: Screening (The Veto).* Address the Contractualist/Deontological concern first. If something is fundamentally rights-violating, it shouldn't enter the scoring. This handles the "different currencies" issue by filtering out the non-comparable negatives.
      *   *Step 2: Theory Delegation.* Instead of asking for probabilities, assign voting blocks to the *theories* represented, or simply treat each member's ranking as a vote. Given the prompt says "nobody will give real probability weights," treating each *member* as a proxy for their dominant theory is the most practical fallback. However, to align with moral uncertainty literature, we should ask them to rank *options* based on their theory, not just vote yes/no. Let's use a Modified Borda Count.
      *   *Step 3: Normalization (Variance Voting).* To prevent one intense theory from dominating, normalize the scores. But without numbers, we use ranks.
      *   *Step 4: Aggregation.* Sum the ranks.
      *   *Step 5: The Fallback.* If the spread is too tight or the "Veto" was contentious, default to majority vote but record the dissent.
      *   *Refinement:* Let's create a "Weighted Rank" system. Each member ranks the proposals (1st, 2nd, 3rd). We sum the ranks. But wait, the prompt asks for moral uncertainty literature. The "Moral Parliament" idea works best if we acknowledge the *theories* are the voters. Since members embody theories, we can ask members to score based on *their* theory's metrics, then rank those scores.
      *   *Simplification for 2 hours:*
          1.  **Rights Screen:** Contractualist veto check.
          2.  **Ordinal Ranking:** Each member ranks proposals 1 to N based on their moral framework.
          3.  **Borda Aggregation:** Convert ranks to points (1st = N pts, 2nd = N-1 pts).
          4.  **Intensity Check:** If a member feels a proposal is "catastrophic" vs "meh," they can flag it (limited use to prevent gaming).
          5.  **Decision:** Highest points wins. Tie/Narrow margin -> Majority Vote.
          6.  **Rationale:** Report the aggregate ranking, not just the winner.

      *   *Correction on "No Probabilities":* The literature (e.g., MacAskill) suggests if you can't assign credences, treat the theories as equally weighted voters *unless* there's consensus on one being stronger. Since they disagree, equal weighting of *members* (as theory proxies) is the only fair epistemic starting point without fake numbers.
      *   *Handling Incommensurability:* The Rights Screen handles the "forbidden" actions. For the rest, we assume "betterness" is comparable enough for ranking (ordinal utility).

  4.  **Drafting "The Two Cases":**
      *   *Case A (Animals vs. Humans):*
          *   Utilitarians (2): Likely favor eyeglasses (high QALYs/cost) OR animals (intense suffering). Usually, global health wins on pure utilitarian calculus unless the animal suffering is extreme. Let's make Eyeglasses win on Utilitarian calculus to satisfy the "I won't like it" constraint.
          *   Person-Affecting (1): Neutral on animals (non-persons), favors kids.
          *   Contractualist (1): Might object to livestock procedure if it violates dignity/rights, or okay with kids. Let's say they veto the livestock if it's cruel, or just rank kids higher. To make it interesting, let's say the livestock procedure is "standard" so Contractualist doesn't veto, but ranks kids higher (human priority).
          *   Animal Person (User): Ranks Animals #1.
          *   Mixed (2): Split.
          *   *Result:* Eyeglasses win. User is unhappy.
      *   *Case B (Far Future vs. Now):*
          *   Utilitarians (2): Far Future (existential risk reduction) dwarfs everything. Rank Institute #1.
          *   Person-Affecting (1): Future people don't exist yet. Benefit = 0. Rank Institute last.
          *   Contractualist (1): Indifferent or skeptical of abstract benefits.
          *   Animal Person (1): Skeptical.
          *   Mixed (2): Split.
          *   *Result:* Institute might win due to intensity of Utilitarians, or lose due to Person-Affecting veto logic. Let's make it a close call that goes to Majority Vote fallback.

  5.  **Drafting "Where it Breaks":**
      *   Need to acknowledge that ranking doesn't solve incommensurability fully.
      *   It doesn't solve the "fake numbers" problem if people game the ranks.
      *   It doesn't solve deep value conflicts (is a human worth 100 chickens?).

  6.  **Refining the Procedure (Self-Correction):**
      *   The prompt specifically mentions "Variance Voting" and "Moral Parliament."
      *   *Variance Voting:* Requires normalizing scores to prevent one voter from dominating. Since we aren't using numbers, we use Ranks (which are inherently normalized).
      *   *Moral Parliament:* Suggests bargaining. In a 2-hour meeting, bargaining is hard.
      *   *Best Fit:* A "Rights-Filtered Borda Count."
      *   *Step 1:* Veto (Contractualist/Deontological constraints).
      *   *Step 2:* Ranking (Each member ranks options based on their theory).
      *   *Step 3:* Aggregation (Borda).
      *   *Step 4:* Explanation (Translate Borda scores into "Broad Consensus").

      *Wait, I need to ensure the "Animal Person" loses Case A.*
      *   Utilitarians (2): Eyeglasses (high impact).
      *   Person-Affecting (1): Eyeglasses (existing people).
      *   Contractualist (1): Eyeglasses (duty to existing humans > animals).
      *   Mixed (2): Leaning Eyeglasses.
      *   Animal (1): Animals.
      *   Total: Eyeglasses crushes Animals. This fits the constraint.

      *Case B:*
      *   Utilitarians (2): Institute (Huge value).
      *   Person-Affecting (1): Institute (Zero value).
      *   Others: Mixed.
      *   This creates a clash of *scale*. Borda handles this by rank, not magnitude. So Utilitarians can't say "It's 1 million times better." They just say "It's #1." This dampens the long-termist dominance, which is a feature of ordinal voting. I should note this tension.

  7.  **Finalizing the Output Structure:**
      *   **The Procedure:** Numbered, concise, actionable.
      *   **The Two Cases:** Narrative walkthrough of the scoring.
      *   **Where it Breaks:** Honest limitation statement.

  8.  **Tone Check:** Professional, pragmatic, acknowledging the philosophical depth but prioritizing the decision.

      *(Self-Correction on "Moral Uncertainty Literature"):* I need to explicitly reference *why* this works.
      *   No probabilities -> Use Ordinal Rankings (MacAskill & Ord, "The Moral Uncertainty Workbook" suggests this when credences are unavailable).
      *   Different currencies -> Rights Veto + Ordinal normalization (Variance Voting logic).
      *   Board Explanation -> "Multi-perspective weighted consensus."

      *(Refining the Procedure Steps for the "No Probability" constraint):*
      Instead of asking members to weight theories, we treat the *committee composition* as the probability distribution. If 2/7 are utilitarian, utilitarianism gets 2/7 of the "vote weight" implicitly. This avoids asking them to assign numbers.

      *(Refining Case A):* Make sure the explanation shows *why* the animal person loses without dismissing their view.
      *(Refining Case B):* Show how the Person-Affecting view creates a floor of zero, but the Borda count might still pass the Institute if the "Zero" rank isn't last for everyone. Actually, if Person-Affecting ranks it last, and Utilitarians rank it first, it averages out.

      *(Wait, one constraint check):* "Include at least one case where the procedure gives an answer I won't like." Okay, Case A will be the eyeglasses winning.

      *(Final Polish):* Ensure the "Rights Screen" handles the Contractualist "off the table" issue. If a Contractualist says "X is impermissible," it gets disqualified unless overridden by a supermajority (to prevent one person holding the budget hostage). Let's say a single veto requires justification, and a 5/7 vote can override it (to prevent paralysis), but otherwise, it's out. Actually, for a foundation, a hard veto is risky. Let's make it a "High Risk Flag" that deducts points. No, the prompt says "some ways... are off the table." Okay, a Veto is better. One veto = out, unless 6/7 override (very high bar).

      *Wait, 2-hour meeting constraint.* Complex vetoes take time. Let's simplify: "Red Light/Green Light." If any member declares a Red Light based on deontological constraints, the proposal is paused for 15 mins. If not resolved, it's disqualified.

      *Let's write it.*

      *(Reviewing against "Moral Uncertainty Literature"):*
      *   MEV (Maximize Expected Value): Can't do without probs.
      *   Borda: Good for ordinal.
      *   Variance Voting: Normalizes intensity. Ranks do this naturally.
      *   Moral Parliament: Implicitly handled by member representation.
      *   Reference: MacAskill's work on ordinal rankings under uncertainty.

      *Okay, ready to draft.*

      *Wait, one more check on the "Animal Person" constraint.* "I'm the animal person, and I suspect the arithmetic favors the eyeglasses." I need to make sure the output confirms this suspicion.

      *Case B:* "Person-affecting folks think the benefit is literally zero." If they rank it last, and Utilitarians rank it first, does it win? With 7 people:
      Util (2): Rank 1
      PA (1): Rank Last
      Animal (1): Rank Low
      Contract (1): Rank Mid
      Mixed (2): Rank Mid
      Average rank might be mid-table. It might lose to "safe" bets. This illustrates the "tyranny of the middle" in Borda counts, which is a valid critique to include in "Where it breaks."

      *Okay, let's finalize the Procedure steps.*
      1. Rights Screen.
      2. Private Ranking.
      3. Score Conversion (Borda).
      4. Aggregation.
