answer: |-
  ### The Procedure

  **Goal:** Select grants under moral uncertainty without requiring explicit probability assignments.
  **Time:** 120 minutes max.
  **Method:** Rights-Filtered Borda Count (based on MacAskill/Ord ordinal approaches and Variance Voting logic).

  1.  **The Rights Screen (15 mins):**
      *   Any member may flag a proposal as "Impermissible" based on deontological/contractualist constraints (e.g., rights violations).
      *   **Rule:** A single flag disqualifies the proposal *unless* the other 6 members vote to override (unanimous consent among non-objectors). This respects the "off the table" constraint without allowing single-person hostage-taking.
      *   *Output:* A list of eligible proposals.

  2.  **Private Ordinal Ranking (20 mins):**
      *   Do not discuss scores. Each member privately ranks the *eligible* proposals from Best (1) to Worst (N) according to their own moral framework.
      *   **Constraint:** You cannot rank two proposals equally. You must break ties based on your best guess of "less bad" or "more good."
      *   *Why:* This bypasses the need for probability weights. The committee's composition *is* the probability distribution (e.g., if 2/7 are utilitarian, utilitarianism implicitly holds 29% of the weight).

  3.  **Score Conversion & Aggregation (15 mins):**
      *   Convert ranks to Borda points: If there are 3 proposals, 1st = 3 pts, 2nd = 2 pts, 3rd = 1 pt.
      *   Sum the points for each proposal.
      *   *Why:* Borda counting minimizes the impact of extreme outliers (Variance Voting logic) and respects ordinal preferences without demanding cardinal utility comparisons.

  4.  **The Intensity Check (15 mins):**
      *   Reveal scores. If the top two proposals are within 5% of total points, trigger a "Intensity Round."
      *   Members can optionally adjust their rank by one slot *only if* they can articulate a non-selfish moral reason for extreme intensity (e.g., "This prevents extinction," not "I really like this").
      *   Recalculate.

  5.  **Decision & Fallback (15 mins):**
      *   Highest score wins.
      *   **Fallback:** If the Rights Screen disqualifies all options, or the Intensity Check results in a tie, revert to simple majority vote. Record the dissenting theories for the board report.

  6.  **Board Narrative (Post-Meeting):**
      *   Do not report the math. Report: "The committee evaluated proposals through multiple ethical frameworks. While views differed on [X], the selected grant demonstrated the broadest consensus across competing moral priorities."

  ***

  ### The Two Cases

  **Case A: Livestock Welfare ($500k) vs. Global Health ($500k)**
  *Proposals:* (1) Phase out painful livestock procedure (Animal Focus). (2) Vision screening/eyeglasses for kids (Human Focus).

  *   **Step 1 (Rights Screen):** The Contractualist notes the livestock procedure is "standard industry practice," not a rights violation in their view, though regrettable. No veto. Both eligible.
  *   **Step 2 (Rankings):**
      *   **Utilitarians (2):** Rank Eyeglasses #1 (higher QALYs per dollar), Livestock #2.
      *   **Person-Affecting (1):** Rank Eyeglasses #1 (existing people), Livestock #2 (animals don't count as persons).
      *   **Contractualist (1):** Rank Eyeglasses #1 (duty to humans prioritized), Livestock #2.
      *   **Mixed (2):** Split. One ranks Livestock #1, one ranks Eyeglasses #1.
      *   **Animal Officer (You):** Rank Livestock #1 (intense suffering), Eyeglasses #2.
  *   **Step 3 (Aggregation):**
      *   Eyeglasses: (3pts × 5 voters) + (2pts × 1 voter) + (1pt × 1 voter) = **18 points**.
      *   Livestock: (1pt × 5 voters) + (2pts × 1 voter) + (3pts × 1 voter) = **8 points**.
  *   **Step 4 (Intensity):** You argue the suffering is extreme. However, under Borda rules, you cannot assign "100 points" to reflect this. You can only swap ranks. There are no other proposals to swap with.
  *   **Result:** **Eyeglasses win.**
  *   **Board Explanation:** "The committee prioritized direct benefits to existing human beneficiaries where consensus was strongest, while noting significant minority support for animal welfare interventions."
  *   **Your Outcome:** You lose. The procedure treats your moral intensity as equal to one vote, and the "currency" of human health QALYs dominates the ranking because 5/7 members prioritize humans. The math confirms your suspicion: without probability weights to boost the "Animal Theory" share, the headcount dictates the outcome.

  **Case B: Far-Future Institute vs. Status Quo**
  *Proposals:* (1) New Research Institute (Existential Risk). (2) Renewal of existing mid-sized grants (Status Quo).

  *   **Step 1 (Rights Screen):** No vetoes.
  *   **Step 2 (Rankings):**
      *   **Utilitarians (2):** Rank Institute #1 (value dwarfs everything), Status Quo #2.
      *   **Person-Affecting (1):** Rank Status Quo #1 (helps existing people), Institute #2 (benefit is literally zero/non-persons).
      *   **Animal Officer (You):** Rank Status Quo #1 (concrete good), Institute #2 (speculative).
      *   **Contractualist (1):** Rank Status Quo #1 (fulfills existing commitments), Institute #2.
      *   **Mixed (2):** Rank Status Quo #1 (risk aversion), Institute #2.
  *   **Step 3 (Aggregation):**
      *   Status Quo: (2pts × 5 voters) + (1pt × 2 voters) = **12 points**.
      *   Institute: (1pt × 5 voters) + (2pts × 2 voters) = **9 points**.
  *   **Step 4 (Intensity):** The Utilitarians invoke the Intensity Check. They argue the Institute prevents human extinction. They are allowed to swap their rank, but they already ranked it #1. They cannot penalize the Status Quo further without a third option.
  *   **Result:** **Status Quo wins.**
  *   **Board Explanation:** "The committee opted for a portfolio of proven interventions over high-variance long-term research, prioritizing near-term accountability."
  *   **Observation:** Here, the Borda count *protects* the committee from long-termist dominance. Because the Person-Affecting view assigns zero value, the Institute drops to the bottom of their list. The Utilitarians' belief that the Institute is "10,000x better" is compressed into a single rank point. The procedure neutralizes the magnitude of the disagreement, favoring the "safe" consensus.

  ***

  ### Where it Breaks

  This procedure cannot settle **incommensurable magnitude**. If the Utilitarians believe the Far-Future Institute is not just "better" but "infinitely more important" than anything else, a Borda count suppresses that signal to prevent tyranny. Conversely, if the Contractualist believes a proposal is "evil" rather than just "impermissible," the single-veto rule might be too weak (allowing 6/7 to override rights) or too strong (allowing 1/7 to paralyze). Finally, by treating committee members as proxy-weights for theories, the procedure assumes your foundation's hiring process accurately reflects the true probability of moral theories being correct—which it doesn't. It solves the *decision* problem, but it papers over the *epistemic* problem.
