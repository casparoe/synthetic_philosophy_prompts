answer: |-
  1. In lottery cases, asserting "I lost" feels improper despite high probability. In Gettier cases, asserting the true proposition often feels fine, even though knowledge is absent. How does the knowledge norm explain this asymmetry? If both lack knowledge, why does the propriety judgment shift?

  2. You might say lottery justification isn't safe or doesn't explain the truth. But if safety or explanation is doing the heavy lifting here, aren't you effectively abandoning knowledge for a different norm? Why not just adopt that norm directly?

  3. "p but I don't believe it" sounds insane; "p but I don't know it" sounds merely odd. Does the knowledge norm predict this graded weirdness? Or does your view treat both as equally violating, leaving the phenomenological difference unexplained?

  4. If assertion is constitutively governed by knowledge, like chess by its rules, imagine a community asserting on mere justification without objection. Are they violating the norm unnoticed, or have they changed the subject? If the former, how is the rule constitutive?

  5. In demon worlds or Gettier cases, speakers violate the norm but seem blameless. If a norm can't be reasonably followed in these scenarios, what regulatory work is it doing? Is it merely evaluative, and if so, why call it a norm of assertion?

  6. Stakeholders often affect assertability. If I know the bank is open, but the stakes are life-or-death, asserting seems improper. Does knowledge suffice, or do practical factors shift the knowledge threshold itself? How do you square this with pure intellectualism?

  7. To follow the norm, I must know that I know. But skepticism about higher-order knowledge is rampant. If I can't easily tell if I satisfy the norm, isn't it useless as a guide? How do speakers navigate this epistemic opacity?

  8. Some argue the norm is merely justified belief. If knowledge entails belief, isn't the knowledge norm redundant? What specific conversational moves does the knowledge norm license or prohibit that a justified belief norm wouldn't? Give me a concrete case.

  9. Rivals suggest "warranted assertibility" tracks knowledge without being identical. If the extensions match perfectly in ordinary cases, what metaphysical work is the knowledge condition doing? Is this just a verbal dispute about labeling conversational propriety?

  10. If knowledge is the norm, and knowledge is hard to get due to skepticism, does most ordinary assertion turn out improper? Are you committed to saying we rarely assert correctly? How do you avoid this skeptical collapse of everyday discourse?
