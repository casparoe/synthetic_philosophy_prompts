  Preamble
  Mary is a brilliant scientist confined to a black-and-white room. She learns every physical fact about colour vision but never sees colour herself. Upon release, she sees a red tomato. Does she learn something new? This quiz explores your intuition on what happens in that moment. Your answers will map your view onto the logical landscape of philosophical responses, without requiring you to know the technical terminology. Let us discover where your instincts lie.

  The quiz

  1. A deaf scientist knows all physical facts about violin sounds. Does she know what they sound like?
  A: Yes, she knows exactly.
  B: No, she lacks that knowledge.

  2. Mary is shown a blue banana but told it is red. Does she realise the trick?
  A: Yes, she knows the experience already.
  B: No, the experience surprises her.

  3. When Mary finally sees red, does she learn anything at all?
  A: She learns nothing new.
  B: She learns something new.

  4. A scientifically illiterate child has seen red. Does the child know what red looks like in the very respect Mary lacked?
  A: Yes, the child knows exactly that.
  B: No, the child lacks that knowledge too.

  5. Mary says: 'So that's what they were going on about.' Is this...
  A: A report of a new fact she discovered.
  B: An expression of a new capacity she acquired.

  6. You read everything about a public figure, then meet them. Did you learn anything?
  A: Yes, a new fact about them.
  B: No, just familiarity without new facts.

  7. Is knowing what red looks like primarily knowing how to imagine it?
  A: Yes, it is a skill.
  B: No, it is knowing how the world is.

  8. Is the knowledge Mary gains the same fact she already knew, just seen differently?
  A: Yes, it is the same fact.
  B: No, it is a completely different fact.

  9. Could Mary have deduced this knowledge from physics alone?
  A: Yes, it was hidden in the physics.
  B: No, physics could never predict this.

  10. If it is a new fact, is it a fact about her brain or reality beyond physics?
  A: It is a fact about her brain.
  B: It is a fact about reality beyond physics.

  Scoring key

  Tally your responses to find your philosophical leaf. If you predominantly chose 'No Gain' options in Questions 1, 2, and 3, you align with Daniel Dennett. You believe Mary's surprise is an illusion; she could have deduced the experience from physics alone. There is no epistemic gap. If you affirmed gain but emphasised skills, imagination, or behavioural capacities in Questions 5 and 7, you follow David Lewis or Laurence Nemirow. For you, knowledge of experience is knowing how to behave or imagine, not knowing a fact. This is the Ability Hypothesis.

  If you preferred 'familiarity' or 'meeting' over 'facts' in Question 6, you lean towards the Acquaintance view. This suggests a non-propositional gain distinct from mere ability, akin to recognising a face. If you treated Mary's gain as propositional (Questions 5 and 7), check Question 8. If you think it is the same fact viewed differently, you hold the Phenomenal Concept Strategy, defended by Brian Loar. You are a physicalist who believes concepts change, not facts. If you selected 'different fact', look to Question 9. If you think physics entailed it anyway, you believe the stipulation that Mary knew 'all physical facts' quietly failed. This representationalist view is often associated with Michael Tye. Finally, if you chose 'physics could never predict' and 'beyond physics' in Question 10, you agree with Frank Jackson's original 1982 conclusion: property dualism. There are irreducible, non-physical facts about consciousness. Your intuition is that physical science is incomplete.

  Note that consistency matters. Mixing 'No Gain' with 'New Fact' answers suggests unstable intuitions. The quiz forces a choice between preserving physicalism by denying new knowledge, or accepting dualism by affirming it. Most readers cluster around Dennett, Lewis, or Jackson. The middle ground of 'Old Fact Physicalism' requires careful distinction between facts and concepts, which Question 8 probes. If you found that distinction difficult, you may share the common intuition that seeing red simply feels different, regardless of the metaphysical label.

  Blind spots

  This quiz cannot cleanly separate the Phenomenal Concept Strategy from other 'Old Fact' views. Both claim Mary learns no new fact, only a new way of grasping an old one. However, philosophers dispute whether this relies on unique concepts or merely different modes of presentation. The quiz groups them because non-specialists rarely distinguish between a concept and a mode of presentation. Additionally, the Ability Hypothesis and Acquaintance view are often conflated. Knowing how to imagine red feels similar to being acquainted with redness. The quiz attempts to separate them via Question 6, but intuitive overlap remains. Consequently, readers landing on these leaves may occupy adjacent philosophical spaces that specialists keep distinct.

  Empty cells

  Certain answer patterns correspond to no recognised philosophical position. For instance, claiming Mary learns nothing (Question 3) yet admitting the deaf counterpart learns something (Question 1) is logically incoherent without special pleading. Similarly, asserting the gain is propositional (Question 5) but also merely an ability (Question 7) is contradictory by definition. Another empty cell involves selecting 'New Fact' yet insisting it was deducible from physics (Question 9). While some physicalists occupy this space, combining it with 'Non-physical' in Question 10 is impossible. These patterns indicate confused intuitions rather than a stable philosophical stance. They reveal where our folk psychology clashes with logical consistency.
