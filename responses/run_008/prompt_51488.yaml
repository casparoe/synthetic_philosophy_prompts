      *   **Constraints:** No technical jargon (no "temporal parts," "endurantism," "stage theory," "wholly present"). Options must be plain descriptions of what's happening.
      *   **Output:** Quiz + Scoring Key (mapping answers to views, identifying gaps/ambiguities).
