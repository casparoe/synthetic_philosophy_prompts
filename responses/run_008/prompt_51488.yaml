          *   *Option B:* No, it looks exactly the same at every moment.
          *   *Option C:* It's changing, but only in how it relates to time.
          *   *Refinement:* This is tricky for novices. Need to emphasize *homogeneity*.
          *   *Option A:* Yes, it is rotating. The part here now is different from the part that was here a second ago.
          *   *Option B:* No. Since every part is identical, nothing is actually changing.
          *   *Option C:* It depends on whether you care about the history of the parts.

      *   **Case 7: The Growing/Changing Object (General Change).**
          *   Scenario: A child grows up.
