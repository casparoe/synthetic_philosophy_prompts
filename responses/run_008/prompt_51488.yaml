          *   *Option C:* Two distinct people. The older one is not the younger one.
          *   *Option D:* One person made of two distinct "time-slices."
          *   *Refinement:* Avoid "time-slices."
          *   *Option A:* There is exactly one person in the room (you), just located in two spots.
          *   *Option B:* There are two people in the room. One is the older version, one is the younger.
          *   *Option C:* There are two bodies, but they belong to the same single life.

      *   **Case 6: Rotating Disc (Qualitative Identity).**
          *   Scenario: Homogeneous disc spinning.
          *   Intuition check: Change without qualitative difference.
          *   Draft Q6: Perfectly smooth disc spins. Is it changing?
