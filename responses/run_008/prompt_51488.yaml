answer: |-
  # Persistence Pre-Test: Intuitions About Objects and Time

  **Instructions:**
  Read each scenario carefully. There are no right or wrong answers here; we are interested in your immediate intuition about how to describe the situation. Choose the option that best matches what you think is *actually happening* in the world. Do not worry about technical terms; select the description that makes the most sense to you.

  ---

  ### 1. The Bent Poker
  A metal poker is perfectly straight on Monday. On Tuesday, it is bent. It is definitely the same poker (same serial number, same atoms, continuous history).
  **How is it possible for one thing to be straight and also bent?**
  A. It's not a contradiction. The poker simply has one shape on Monday and a different shape on Tuesday.
  B. "Straight" really means "straight-at-Monday." The poker has both properties (straight-at-Monday and bent-at-Tuesday) all along.
  C. Strictly speaking, the poker that exists on Monday is a different object from the poker that exists on Tuesday.
  D. There is no single "poker" that exists over time; there are just poker-stages linked together.

  ### 2. The Duplicator (Fission)
  You step into a teleporter. It scans you, destroys your body, and sends the data to Mars, where a perfect physical and psychological duplicate is built. At the exact same time, a glitch causes a duplicate to be built on Venus. Both Mars-You and Venus-You remember stepping into the teleporter.
  **Who are they?**
  A. Both of them are you. You are somehow in two places at once.
  B. Neither of them is you. You died when the original body was destroyed.
  C. Only one of them is you, but it is impossible to know which one.
  D. The "you" that stepped in is gone. The two people on the planets are new people who are exactly like you.

  ### 3. Tibbles and the Hair (Counting)
  Tibbles is a cat sitting on a mat. Tibbles has 1,000 hairs. Let's call the collection of matter that makes up Tibbles *minus one specific hair* "Tib." Tib is cat-shaped, alive, and sitting on the mat.
  **How many cats are on the mat?**
  A. Just one (Tibbles). Tib is just a part of a cat, not a cat itself.
  B. Two (Tibbles and Tib). They are distinct objects occupying almost the same space.
  C. It's vague. There is no precise fact about whether Tib counts as a cat.
  D. Tibbles ceases to be a cat the moment we focus on Tib; they swap identities.

  ### 4. The Ship of Theseus (Gradual Replacement)
  A wooden ship has its planks replaced one by one over ten years. By the end, not a single original plank remains. Meanwhile, someone saved all the old planks and reassembled them into a ship.
  **Which ship is the original Ship of Theseus?**
  A. The ship with the new planks. Identity is about continuous history, not original parts.
  B. The ship with the old planks. Identity is about the original material.
  C. Neither. The original ship ceased to exist during the process, and now there are two new ships.
  D. There is no fact of the matter. "Same ship" becomes meaningless halfway through.

  ### 5. The Time-Travel Handshake
  You have a time machine. You travel back 10 years and meet your younger self. You shake hands.
  **How many people are in the room?**
  A. One person (you), located in two different spots.
  B. Two people. The older you and the younger you are distinct individuals.
  C. Two bodies, but they belong to the same single life.
  D. One person made of two separate time-segments that happen to be touching.

  ### 6. The Rotating Disc
  Imagine a perfectly smooth, homogeneous metal disc spinning in a vacuum. Every part of the disc looks exactly like every other part.
  **Is the disc changing as it spins?**
  A. Yes. The part of the disc that is "here" now is different from the part that was "here" a second ago.
  B. No. Since every part is identical, nothing about the disc is actually different from moment to moment.
  C. It depends on whether you track the history of the atoms.
  D. The disc is changing, but only in its relationship to time, not in its physical properties.

  ### 7. The Statue and the Clay (Constitution)
  An artist takes a lump of clay and shapes it into a statue. Later, she crushes the statue back into a lump.
  **What is the relationship between the Statue and the Lump of Clay?**
  A. They are the exact same object.
  B. They are two different objects that share the same clay for a while.
  C. The Lump ceases to exist when the Statue is made, and a new object begins.
  D. The Statue is just a temporary arrangement of the Lump.

  ### 8. The Swampman (Sudden Replacement)
  Lightning strikes a dead tree and rearranges its atoms to create a perfect physical duplicate of you, while you are simultaneously vaporized. The duplicate has your memories and personality.
  **Is the duplicate you?**
  A. Yes. Physical and psychological continuity is all that matters.
  B. No. You died. The duplicate is a copy, not the original.
  C. Yes, but only because the original didn't survive to compete with it.
  D. It's a new person who merely thinks they are you.

  ### 9. The Growing Child (Parts Over Time)
  Consider yourself as a baby and yourself now.
  **What is the relationship between the baby and the adult?**
  A. They are the same object, which has changed properties.
  B. The baby is a literal part of the adult, just like a hand is part of a body.
  C. They are different objects connected by memory and biology.
  D. The baby no longer exists; only the adult exists now.

  ### 10. Future Concern
  Why should you care about pain that will happen to your body ten years from now?
  A. Because that body will literally be me.
  B. Because that person will remember being me and have my character.
  C. Because that person is part of the same continuous life story as me.
  D. I shouldn't care any more than I care about a stranger, unless they are psychologically connected to me.

  ---

  # Scoring Key & Instructor's Guide

  **Warning to Instructor:** This quiz is designed to map pre-theoretical intuitions onto metaphysical frameworks. However, students have not yet learned the vocabulary. The goal is to sort them into clusters that *align* with Endurantism, Perdurantism (Worm View), and Stage Theory, while acknowledging that without the theory, the lines are blurry.

  ### Profile A: The "Strict Identity" Cluster (Endurantism)
  *   **Typical Answers:** 1A, 2B, 3A, 4A or 4D, 5A, 6A or 6C, 7A, 8B, 9A, 10A.
  *   **Core Intuition:** Objects are "wholly present" at every moment. Identity is strict and one-to-one. Change is real but doesn't split the object.
  *   **Key Markers:**
      *   **Q1 (Poker):** Accepts incompatible properties as time-relative (1A) rather than positing different objects (1C).
      *   **Q5 (Time Travel):** Insists there is only *one* person in the room (5A), even if multilocated.
      *   **Q2 (Fission):** Tends to say the original died (2B), because one thing cannot become two.
      *   **Q3 (Tibbles):** Denies coincidence (3A). Only one cat-shaped object counts as a cat.

  ### Profile B: The "Spacetime Worm" Cluster (Perdurantism / Worm View)
  *   **Typical Answers:** 1C or 1D, 2D, 3B or 3C, 4A, 5C or 5D, 6A, 7B, 8A or 8D, 9B, 10C.
  *   **Core Intuition:** Objects extend through time like they extend through space. The "baby" is a part of the "adult."
  *   **Key Markers:**
      *   **Q9 (Growth):** Explicitly views the baby as a *part* of the adult (9B). This is the strongest indicator of 4D thinking.
      *   **Q5 (Time Travel):** Sees two bodies/persons in the room that belong to one life (5C/5D), rather than one multilocated person (5A).
      *   **Q1 (Poker):**倾向于 say Monday's poker and Tuesday's poker are different "bits" of the whole (1C/1D).
      *   **Q2 (Fission):** Often says the original is gone and two new ones exist (2D), or that survival doesn't require strict identity.

  ### Profile C: The "Momentary Stage" Cluster (Stage Theory)
  *   **Typical Answers:** 1D, 2D, 3B, 4D, 5B, 6A, 7B, 8D, 9C, 10B.
  *   **Core Intuition:** We are momentary time-slices. "Persistence" is just a matter of how we talk about relations between slices.
  *   **Key Markers:**
      *   **Q5 (Time Travel):** Insists there are *two people* in the room (5B), not just two bodies of one person.
      *   **Q1 (Poker):** Strongly favors the idea that the Monday-object and Tuesday-object are distinct (1D).
      *   **Q9 (Growth):** Sees baby and adult as different objects connected by relations (9C), rather than part/whole (9B).
      *   **Note:** This profile is notoriously difficult to distinguish from Profile B without technical setup. See limitations below.

  ### Profile D: "Unnamed" / Other Intuitions
  *   **Pattern:** Inconsistent answers, or heavy reliance on "No fact of the matter" (Vagueness).
  *   **Example:** Choosing "No fact of the matter" for Q1, Q3, Q4, and Q5.
  *   **Diagnosis:** This often maps to **Nihilism** (no composite objects exist) or **Radical Vagueness** (identity is never precise).
  *   **Why unnamed?** While "Ontic Vagueness" is a defended position, students who select this across the board usually haven't formed a metaphysical commitment yet; they are expressing semantic skepticism. It is not incoherent, but it is often a "refusal to play the game" rather than a rival theory of persistence.
  *   **Example:** Choosing "Two objects" for Q3 (Tibbles) but "One object" for Q7 (Statue/Clay).
  *   **Diagnosis:** **Coincidentalism.** They allow some objects to share space (cats) but not others (statues). This is attractive but theoretically unstable (why the difference?). It is explored in literature (e.g., Burke) but often rejected as ad hoc.

  ### Limitations & Honesty Check

  **1. The Worm/Stage Problem:**
  Be honest with your class: This quiz cannot cleanly separate the **Worm View** from **Stage Theory** for novices.
  *   *Why?* Both views agree that objects have temporal parts. In Q9 (Growth), both might select "The baby is a part of the adult." In Q5 (Time Travel), both agree there are two distinct entities in the room interacting.
  *   *The Difference:* Stage theory says "I *am* the stage." Worm theory says "I *am* the worm composed of stages." Without asking "Are you literally just a momentary slice?" (which is too leading), students will answer based on the *scenario*, not their ontology of the self.
  *   *Pedagogical Fix:* Use Q5 and Q9 to separate 3D (Endurance) from 4D (Worm/Stage). Use the lectures to explain the internal debate between Worm and Stage.

  **2. The Q1 (Poker) Wording Issue:**
  Option 1B ("straight-at-Monday") sounds like Adverbialism or Relationalism, which are Endurantist strategies. Option 1C sounds like Perdurantism. However, a student might pick 1A ("It's not a contradiction") without realizing that Endurantists fight hard to make that work.
  *   *Discrimination Power:* Low. Most non-philosophers pick 1A. It doesn't tell you much about their theory, only that they aren't bothered by temporary intrinsics yet.

  **3. The Q3 (Tibbles) Coincidence Trap:**
  Endurantists typically deny coincidence (Answer 3A). Perdurantists allow it easily (Answer 3B, because the cats have different temporal parts). However, some Endurantists accept coincidence (Answer 3B).
  *   *Discrimination Power:* Medium. If they pick 3A, they lean Endurantist. If they pick 3B, they could be either, but are more open to 4D.

  **4. What this quiz actually measures:**
  It measures **3D Intuitions** (Objects are wholly present, identity is strict, change is qualitative) vs. **4D Intuitions** (Objects extend in time, parts exist at times, identity is gen-identity).
  *   **Profile A** = 3D Intuitions.
  *   **Profile B & C** = 4D Intuitions.
  *   **Profile D** = Skepticism or Nihilism.

  **Recommendation for Class Discussion:**
