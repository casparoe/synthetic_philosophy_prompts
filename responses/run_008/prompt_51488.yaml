          *   *Option B:* Because it will be psychologically connected to me.
          *   *Option C:* Because it's part of the same life story.

      *   *Review against constraints:* 10 questions. Concrete scenarios. No jargon. Covers required cases (Poker, Fission, Tibbles, Theseus, Time Travel, Disc).
