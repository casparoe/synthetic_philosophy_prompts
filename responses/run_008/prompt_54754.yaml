  **Main Joke: The Quarantine**

  **Classical Logician:** "You admit the Liar sentence is true?"
  **Dialetheist:** "Yes."
  **Classical Logician:** "And you admit it's false?"
  **Dialetheist:** "Also yes."
  **Classical Logician:** "Then you accept a contradiction. So by *Ex Falso Quodlibet*, I can derive that I'm the Pope."
  **Dialetheist:** "You can write the proof, but the argument is invalid."
  **Classical Logician:** "It's a classical rule! From a contradiction, anything follows!"
  **Dialetheist:** "Not in my system. The contradiction is true, but the explosion is contained."
  **Classical Logician:** "So you're saying logic has a firewall?"
  **Dialetheist:** "I'm saying your explosion is a bug. My contradictions are quarantined."

  ***

  **Second Joke: The Problem of Exclusion**

  **Student:** "Professor, how do I know if a dialetheist disagrees with me?"
  **Professor:** "They'll say, 'I deny that.'"
  **Student:** "But if they deny it, isn't it false?"
  **Professor:** "Usually. But if the sentence is a dialetheia, their denial is true *and* false. So they've disagreed with you, but they haven't excluded the possibility that they agree with you."
  **Student:** "So how do I win the argument?"
  **Professor:** "You don't. You just accept that you're both right, wrong, and still talking."
