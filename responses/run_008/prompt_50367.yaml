  **Contextualism: 6/10.** Validates human review nuance but resists codification, making consistent auditing difficult.
  **Eliminativism: 1/10.** Impossible to implement; removing vague terms leaves policies unable to cover novel edge cases.

  **Verdict:** Degree-theory is the only operational winner. It suggests exposing classifier confidence internally for auditing, but beware showing users exact scores (they will game the threshold). Instead of binary ban/pass, use tiered interventions (shadow ban, warning, removal) mapped to probability bands. Acknowledging the continuum reduces the "cliff-edge" gaming behavior users currently exploit. Don't pretend the line is sharp; manage the gradient.
