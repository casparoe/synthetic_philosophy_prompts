answer: |-
  ### Desiderata for an Adequate Account of Mary's Post-Release Gains

  To evaluate the Knowledge Argument without begging the question, a theory must satisfy specific structural and explanatory conditions. Below are the requirements, categorized by their necessity and the specific philosophical work they must perform.

  #### 1. Robustness Across Variants
  An adequate account must not rely on the specific texture of the standard "red tomato" case. It must handle variations that stress-test the distinction between physical knowledge and phenomenal experience.
  *   **The Blue Banana Case:** Mary is released and sees a blue banana, which she was told was ripe. If her gain is merely "ability to imagine," she should not be surprised by the color mismatch. If she is surprised, the account must explain how an omniscient physicalist holds an expectation that experience falsifies.
      *   *Status:* **Non-negotiable.** A theory that explains the standard case but fails when expectation is violated (suggesting propositional content) is ad hoc.
  *   **The Color-Blind Mary:** Mary has all physical data but lacks the physiological hardware to see color (not just deprivation). Upon surgical correction, she gains color vision. The account must distinguish between gaining a new *capacity* (physiological) and gaining new *knowledge* (epistemic).
      *   *Status:* **Non-negotiable.** This isolates whether the argument rests on informational deprivation or biological limitation.
  *   **The Mirror Case:** Mary has never seen a human face, including her own. Upon release, she sees her reflection. The account must explain the gain without implying she lacked physical knowledge of her own facial structure.
      *   *Status:* **Non-negotiable.** This tests self-locating and recognitional components distinct from qualitative character (qualia).

  #### 2. Categorization of the Gain
  The theory must explicitly categorize what Mary acquires. Ambiguity here is the primary source of dialectical stalemate.
  *   **Propositional vs. Non-Propositional:** The account must state whether Mary learns a new *truth* (knowing-that) or acquires a *skill/acquaintance* (knowing-how/knowing-by).
      *   *Status:* **Non-negotiable.** The inference to non-physicalism hinges entirely on this.
  *   **Fact vs. Mode of Access:** If the gain is propositional, the account must distinguish between learning a *new fact* versus accessing an *old fact under a new mode of presentation* (concept).
      *   *Status:* **Non-negotiable.** This is the pivot point for the Phenomenal Concept Strategy.
  *   **Deduction vs. Imagination:** The account must explain why Mary could not deduce the experience from the physical facts, even if she possesses the concepts. Is the block logical, epistemic, or psychological?
      *   *Status:* **Non-negotiable.** If the block is merely psychological (cognitive limitation), physicalism stands. If logical (metaphysical gap), it falls.

  #### 3. Scope of Omniscience and Indexicality
  The stipulation that Mary knows "all physical facts" requires precise boundary conditions regarding self-location and indexicals.
  *   **Indexical Knowledge:** The account must specify if "all physical facts" includes indexical truths (e.g., "I am Mary," "This experience is occurring now").
      *   *Status:* **Non-negotiable.** Excluding indexicals risks making the omniscience stipulation incoherent; including them risks collapsing the argument into a triviality about perspective.
  *   **Impact on the Argument:** The theory must demonstrate whether including indexical knowledge blocks the inference to non-physicalism.
      *   *Status:* **Camp Prejudice (Physicalist).** Physicalists often wish to classify phenomenal knowledge as a species of indexical knowledge to save physicalism. Dualists view this as changing the subject. An adequate theory must argue for this classification, not assume it.

  #### 4. The Inference Mechanism
  The move from "Mary learns something" to "Physicalism is false" is not automatic. The theory must validate or invalidate the intermediate steps.
  *   **The Knowledge Principle:** The account must address the premise: "If one learns something new, one comes to know a new fact."
      *   *Status:* **Non-negotiable.** Denying this requires a robust alternative epistemology.
  *   **Closure Principle:** The account must address whether physical truths are closed under deduction. If Mary knows all physical truths, and phenomenal truths are physical, she should be able to deduce them.
      *   *Status:* **Non-negotiable.** This is the logical engine of the argument.
  *   **Fact Individuation:** The theory must provide criteria for when two pieces of knowledge count as knowledge of the *same* fact.
      *   *Status:* **Camp Prejudice (Dualist).** Dualists often insist that distinct concepts entail distinct facts. Physicalists insist distinct concepts can latch onto the same physical fact. An adequate theory must justify its individuation criteria without circularity.

  #### 5. Tensions and Incompatible Desiderata
  Certain intuitive demands on the theory may be mutually exclusive. An honest account must flag these tensions.
  *   **Omniscience vs. Surprise:** It is difficult to jointly satisfy the stipulation that Mary is *omniscient regarding physical facts* and the intuition that she is *genuinely surprised* by experience. If physical facts entail phenomenal facts, surprise implies a failure of deduction or a lack of prior knowledge.
      *   *Flag:* **Incompatible Pair.** A theory must either deny the entailment (dualism), deny the surprise (illusionism/strict deduction), or deny the omniscience scope (indexicality).
  *   **Truth-Aptness vs. Non-Propositional Gain:** It is difficult to explain why Mary's gain feels like learning a truth (truth-apt) while maintaining it is merely an ability (non-truth-apt). Abilities are not true or false; beliefs are.
      *   *Flag:* **Incompatible Pair.** The Ability Hypothesis struggles here. If Mary says "So *this* is what red looks like," she asserts a truth. If the theory says this is merely an ability, it must explain the propositional syntax of her report.

  #### 6. Classification of Requirements
  *   **Non-negotiable:** Handling variants (Blue Banana, Mirror), categorizing the gain (Prop vs. Ability), specifying omniscience scope, and validating the inference mechanism (Closure/Knowledge Principle). These are structural necessities for any coherent philosophical account.
  *   **Camp Prejudices:**
      *   *Physicalist Wish List:* That the gain be non-propositional (ability/acquaintance) or that concepts differ while facts remain identical.
      *   *Dualist Wish List:* That the gain be propositional and that distinct concepts necessarily track distinct facts.
      *   *Note:* An adequate theory cannot simply assert these prejudices; it must derive them from the non-negotiable criteria.

  ***

  **Evaluation of Existing Accounts**
  When run against these desiderata, the **Ability Hypothesis** satisfies the physicalist wish list by categorizing the gain as non-propositional, but it strains against the Non-negotiable requirement to handle the Blue Banana variant (explaining surprise without propositional expectation) and the Tension regarding truth-apt reports. The **Phenomenal Concept Strategy (PCS)** respects the Fact vs. Mode of Access distinction and handles the Omniscience Scope by positing unique phenomenal concepts, but it risks failing the Non-negotiable Inference Mechanism criterion if it cannot adequately explain why these concepts are physically irreducible without smuggling in dualist fact individuation (a Camp Prejudice). **Jackson's Recantation** (accepting physicalism but denying the Knowledge Argument's conclusion) effectively dissolves the Inference Mechanism by rejecting the Knowledge Principle, yet it struggles with the Omniscience vs. Surprise Tension, as it requires explaining how a physically omniscient agent remains epistemically open to supervenient truths without conceding a gap in the physical story.
