prompt: |-
  You are an expert set theorist with a strong feel for choice principles and for the fine print of transfinite recursion, and I need you to audit an argument for me with real care: before committing to any diagnosis, brainstorm and list which steps you find suspicious and why, then work through the argument stage by stage, name exactly where it fails, explain why the failing step looked innocent, and tell me what the smallest repair costs.

  A friend of mine claims to have proved Zorn's lemma in ZF alone, with no appeal to Choice anywhere. His argument:

  (1) Let (P, ≤) be a nonempty poset in which every chain has an upper bound. Suppose, for contradiction, that P has no maximal element.
  (2) Then for every x in P there is a y in P with x < y.
  (3) Climb. Fix any x_0 in P. Given x_α, use (2) to pick x_{α+1} strictly above x_α. Given the whole chain {x_β : β < λ} at a limit ordinal λ, the hypothesis of the lemma hands us an upper bound of that chain, and since nothing is maximal we can pick a strict one; call it x_λ. (He adds that in the familiar applications — independent sets ordered by inclusion, ideals, filters — you don't even pick at limit stages: the union of the chain is canonical and lies in P, so nothing is being smuggled in there.)
  (4) By construction, β < γ implies x_β < x_γ, so the map α ↦ x_α is an injection from the class of all ordinals into the set P.
  (5) But no set admits an injection of all the ordinals, and a strictly climbing injection would give exactly that. Contradiction.
  (6) So P has a maximal element, and since every move in the climb was either forced or a single selection from a nonempty set we were already promised, no appeal to Choice was made. Zorn's lemma is a theorem of ZF.
  (7) As a corollary, every set can therefore be well-ordered in ZF — the reals included — so the well-ordering theorem never needed Choice either.

  When I pressed him on step (3), he said that choosing one element from one nonempty set is just existential instantiation, that logicians do it in first-order proofs all the time, and that he is doing it one set at a time, never all at once.

  Here is my problem. I am confident that the Axiom of Choice is independent of ZF — that is essentially the one thing I am sure of in this area — so an argument that makes Zorn, and hence well-ordering, a theorem of ZF must break somewhere. But I have stared at every step and they all look like bookkeeping. My instinct is that the trouble is at the limit stage in (3), but when I press on it I find that the hypothesis really does guarantee an upper bound there, so I cannot articulate what is missing; and the union remark he appends makes the standard applications feel more solid to me, not less. I would also like to keep step (5), the ordinals-can't-inject part, because it is the one piece of the argument I actually understand and it looks like textbook reasoning about ordinals.

  So: which step do I reject, why did it look fine, and what exactly does rejecting it cost? If more than one step needs attention — if, say, the limit stages and the successor stages fail differently, or if the union aside in (3) is doing something separate from the official argument — please separate the failures and tell me which one is load-bearing. And if his argument is secretly fine as far as it goes but proves something weaker than he claims (say, only for posets where the limit-stage move is canonical), I want to know precisely what the residual gap to full Zorn is and what would have to be added to close it.
