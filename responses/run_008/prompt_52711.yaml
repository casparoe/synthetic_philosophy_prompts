answer: |-
  Dear Colleague,

  It is a pleasure to correspond with someone who understands that philosophy, like molecular biology, often comes down to whether you can isolate a variable without denaturing the sample. You are right to suspect that the mirror experiment is unpopular, and after running the design through my own mental assay, I believe I know why. Here is the best construction I can offer for a case where identity is preserved but what matters is lost, followed by the analysis of why the reaction might not be what you hope for.

  Imagine a procedure called Deep Stasis designed for interstellar travel where the subject remains conscious but metabolically slowed to one subjective second per year for a century. The brain is kept fully active via a synthetic scaffold that maintains causal signal flow between every neural state without interruption, ensuring no break in the chain of consciousness, no fission, and no loss of the physical substrate. You enter the machine today, and the person who emerges in one hundred years possesses a continuous, unbroken causal lineage of mental states from you, satisfying the strictest requirements for psychological continuity, yet the scaffold actively suppresses the encoding of new long-term memories and dampens emotional valence to zero to prevent psychological drift during the long wait. The resulting being is causally you, with no branching, and retains your core cognitive architecture, but possesses no direct memory of your pre-stasis life and no capacity to care about the projects you currently hold dear.

  Now let us run the analysis on this sample. A standard psychological-continuity theorist, who defines identity as the holding of a non-branching psychological chain, will look at the Deep Stasis case and verdict that identity is preserved. The causal chain is unbroken, there is no fission, and the physical vehicle is the same, so the identity conditions are met without stipulation. However, when Parfit's reductionist asks whether there is anything here that makes continued existence worth wanting, the answer must be no, or at least negligibly close to it. Parfit distinguishes between psychological continuity, which is transitive and sufficient for identity, and psychological connectedness, which involves direct memory and character links and is what actually grounds prudential concern. In this scenario, continuity is maintained by the scaffold, preserving identity, but connectedness is deliberately severed by the memory suppression and emotional dampening, stripping away what matters. They agree on identity because the chain holds, but they come apart on what matters because the reductionist sees that the chain is hollow; it has the structure of survival without the substance of a life that the current subject has reason to care about.

  The single feature doing the work here is the decoupling of transitive continuity from direct connectedness, which is the only wedge available to separate the variables in this direction. If you remove the scaffold's dampening and allow memories and values to persist naturally, connectedness returns, and what matters snaps back into alignment with identity, restoring the normal intuition that survival is desirable. A defender of the view that identity itself is what matters would attack this case by arguing that if it is truly you who emerges, then your future interests are necessarily your current interests, regardless of your ability to anticipate them; they would claim that the dampening procedure does not remove what matters but merely obscures your access to it, much like amnesia does not destroy the value of your life to you. This brings me to your suspicion about the coupled enzymes, and I am afraid your instinct is likely correct. While the Deep Stasis case uses the continuity-connectedness distinction to force a separation, it feels unstable because if connectedness drops to zero, most people will begin to deny identity as well, suggesting that in practice, you cannot knock out what matters without eventually lysing identity too. The variables are so tightly bound in our conceptual framework that pulling them apart in this direction requires such extreme conditions that the case ceases to feel like survival at all, which suggests the mirror experiment may be unbuildable in principle not because of a lack of ingenuity, but because identity and what matters are indeed functionally redundant in the non-branching cases we care about.
