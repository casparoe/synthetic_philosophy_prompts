      *   *Power Dynamic:* Friends are (ideally) equals. Politician/Voter is hierarchical (Patron/Client).
      *   *Resource Source:* Friends use their own resources. Politicians use *public* resources (tax money, state authority). This is the crux of the corruption definition.
