prompt: |-
  i teach an upper-level decision theory seminar, 12 students, 90 min session. we just finished subjective expected utility and dutch book arguments, next week is ambiguity. i want to design an in-class experiment where the students are the subjects and they walk straight into the ellberg-style result themselves, before i ever say the word ambiguity or mention any of the literature.

  rough shape i'm imagining: three betting conditions. one urn they know has exactly 50 red and 50 black balls. one urn where the red/black split is unknown (they can see its sealed and that i'm not peeking). and then a third condition where instead of drawing balls they're betting on outcomes of some trivia/sports/weather thing -- except i secretly gave half of them a "thanks for participating, here's some background reading" packet a week ago and nothing to the other half. so we get the classic known-vs-unknown comparison but also a test of whether people still shy away from the unknown when its their own area of competence on the line. i half-remember a result that ambiguity aversion basically evaporates when people feel knowledgable about the domain, even when the odds are objectively the same -- build the activity around testing that too, but don't worry about the citation, i don't need it.

  no real money obviously, so figure out a stakes currency (candy, extra credit points, whatever) and make the payoff scheme lopsided enough that indifference is not the comfortable answer. also partway through i want a second phase where they have to sell their already-placed bet to another student and we watch what prices actually clear at -- my hunch is the premium people demand to take an ambiguous bet off someone's hands is a much cleaner measure of the aversion than their initial picks are, so the game should surface that.

  then a proper debrief: map specific moments back onto the formal machinery they just learned -- where exactly the revealed preferences violate the axioms, what the sure-thing principle has to do with the pattern we're seeing, why the dutch book story they loved last week doesn't obviously come to the rescue here. and tell me honestly what will predictbly go wrong the first time i run it (one student already knows the paradox and blabs, the cheat-sheet half turns out to be terrible at judging what they know, everyone just picks whatever their neighbor picked) plus what a classroom version with fake stakes fundamentally can't reproduce about the thing we're studying.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level decision theory seminar, 12 students, 90-minute session.
      *   **Prerequisites:** Just finished Subjective Expected Utility (SEU) and Dutch Book arguments.
      *   **Topic:** Ambiguity (Ellsberg Paradox).
      *   **Goal:** Design an in-class experiment where students *experience* the violation before theory is introduced.
      *   **Key Components:**
          *   Three betting conditions: Known risk (50/50), Unknown risk (Ambiguous urn), Competence/Knowledge domain (Trivia/Sports/Weather).
          *   "Competence" manipulation: Half the class got a "background reading" packet a week ago (secretly), half didn't.
          *   Stakes: No real money (candy/points), needs to be lopsided to avoid indifference.
          *   Phase 2: Secondary market (selling bets to peers) to measure risk/ambiguity premiums.
          *   Debrief: Connect to SEU axioms, Sure-Thing Principle, Dutch Book limitations.
          *   Reality Check: Predict potential failures (spoilers, bad calibration of competence, herd behavior) and limitations of fake stakes.

  2.  **Deconstruct the Experiment Design:**
      *   *Constraint:* 12 students is a very small sample size. Statistical significance is impossible. The goal must be *pedagogical demonstration*, not empirical proof. The "competence" manipulation with only 6 students per group is extremely noisy. I need to advise the instructor on how to handle this delicately.
      *   *The "Competence" Manipulation:* Giving half the class a packet a week ago is risky. They might forget, or they might feel *less* confident if the packet was hard. A better in-class manipulation might be "General Knowledge" vs. "Obscure Knowledge" or "Self-Chosen Domain" vs. "Random Domain." However, the prompt specifically asks for the "packet" idea. I should refine it to ensure it actually creates a feeling of competence. Let's suggest a specific topic (e.g., "History of the Department" or "Specific Pop Culture") that is easy to cram.
      *   *The Bets:* Need to be clear.
          *   Urn A (Risk): 50 Red, 50 Black.
          *   Urn B (Ambiguity): 100 Balls, composition unknown.
          *   Event C (Competence): Question based on the packet.
          *   Event D (Ignorance): Question on a topic no one knows.
      *   *Stakes:* Candy is good. "Lopsided" means the payoff for winning should be high enough that saying "I don't care" feels like leaving money on the table, but the loss (getting nothing) feels like a miss.
      *   *Phase 2 (Market):* With 12 students, a full market is chaotic. A bilateral trade or a "market maker" (the professor) approach might be cleaner. But the prompt asks for student-to-student. Let's do a "matching" phase.

  3.  **Drafting the Session Plan (90 mins):**
      *   *Intro (5 min):* Set the stage, no theory talk.
      *   *Phase 1: Choice Task (20 min):* The Ellsberg + Competence choices.
      *   *Phase 2: Trading Task (20 min):* Selling the bets.
      *   *Data Aggregation (10 min):* Put results on board.
      *   *Debrief/Theory (35 min):* Connect to SEU, Sure-Thing, Dutch Book.

  4.  **Refining the "Competence" Manipulation:**
      *   *Critique:* Mailing packets a week ago is logistically fraught (some lose it, some don't read it).
      *   *Adjustment:* Do it *in class* at the start of the session or rely on a domain they *think* they know. Actually, the prompt says "secretly gave half of them... a week ago." I must respect the user's design intent but warn about the noise. I will suggest a specific topic that is easy to verify (e.g., "Rules of the specific game we play in class" vs. "Rules of a game nobody plays").
      *   *Better Idea:* Let's stick to the prompt's spirit but make it robust. Topic: "Local Trivia" (for the packet group) vs. "Obscure Trivia" (for the control).
      *   *Wait, actually:* The prompt says "secretly gave half... a packet." I need to make sure the instructor knows this is high-variance with N=6. I will advise them to check comprehension *before* the bet.

  5.  **Developing the Payoff Scheme:**
      *   To avoid indifference: Offer a choice between a sure thing and a bet, OR make the bets mutually exclusive.
      *   Ellsberg standard: Bet on Red in Urn A vs. Bet on Red in Urn B.
      *   To make it "lopsided": If you win, you get 5 candies. If you lose, 0. But you have to *commit* to one.
      *   Trading: If I hold a bet on Urn A, how much candy will I sell it to you for?

  6.  **Addressing the "What Will Go Wrong" (Reality Check):**
      *   *Spoiler:* With 12 upper-level students, odds are 1 knows Ellsberg.
      *   *Competence:* The packet group might feel *more* uncertain if they realized how much they didn't know (Dunning-Kruger reversal).
      *   *Herd Behavior:* Small room, they talk.
      *   *Fake Stakes:* No visceral loss aversion.
      *   *N=12:* Patterns might not show up. The instructor needs to be ready to "facilitate" the result if the data is muddy (ethically tricky, but pedagogically common in demos). *Correction:* I should advise them to be honest about the noise if the data is muddy, rather than faking it.

  7.  **Structuring the Debrief:**
      *   Map choices to SEU.
      *   Show the contradiction (Bet A > Bet B AND Bet Not-B > Bet Not-A).
      *   Sure-Thing Principle violation.
      *   Why Dutch Book doesn't force coherence here (no objective probabilities to exploit).

  8.  **Review against Constraints:**
      *   12 students.
      *   90 mins.
      *   No real money.
      *   Must include the "packet" competence test.
      *   Must include the trading phase.
      *   Must include the specific debrief points.

  9.  **Final Polish:**
      *   Tone: Collegial, experienced, practical.
      *   Formatting: Clear sections for the plan, the script, the debrief, and the "post-mortem."
      *   *Self-Correction on Competence:* The prompt mentions "Trivia/Sports/Weather." With 12 students, splitting into Sports vs. Weather is too thin. Let's suggest a specific "Class Lore" packet vs. "General Knowledge." It's more controlled. Actually, I'll stick to the prompt's "Trivia" but suggest a specific topic to ensure the "competence" feels real.
      *   *Trading Phase:* With 12 people, a double auction is hard. A "bid/ask" sheet passed around is better.

  10. **Finalizing the Output:** (Drafting the response based on these thoughts.)
      *   *Emphasis:* The small N is the biggest risk. I need to highlight that this is a *demonstration*, not a *test*.
      *   *Stakes:* Use "Course Credits" or "High Value Candy." Let's go with a raffle for a tangible prize (e.g., a book or coffee card) to increase stakes without using cash.
      *   *Packet:* Warn about the "week ago" timing. Suggest a quick quiz to verify they actually absorbed it.

  ( Self-Correction during drafting ): I need to make sure I don't lecture them on the solution. The prompt says "before i ever say the word ambiguity." The debrief comes *after* the experiment.

  Let's organize the response:
  1.  **Logistics & Stakes:** How to make it matter.
  2.  **The Protocol (Minute-by-Minute):** The flow.
  3.  **The Materials:** Urns, Packets, Sheets.
  4.  **The Debrief Script:** Connecting to theory.
  5.  **The Post-Mortem:** What will fail and why fake stakes matter.

  (Refining the Competence Manipulation): The prompt says "secretly gave half... a week ago." I will advise the instructor to verify this. If half the class didn't read it, the manipulation fails. I'll suggest a "calibration question" to filter who actually feels competent.

  (Refining the Trading): "Sell your already-placed bet." This implies they own the bet. So Phase 1 is "Choose a bet to own." Phase 2 is "Name your selling price." Phase 3 is "Match buyers and sellers."

  Okay, ready to write.
answer: |-
  This is a fantastic pedagogical approach. Experiencing the violation before naming it creates a "conceptual itch" that the theory can then scratch. With only 12 students, you are not running a study; you are running a *demonstration*. Your goal is not statistical significance, but visceral intuition.

  Here is a structured plan for the 90-minute session, designed to maximize the likelihood of the Ellsberg pattern emerging while integrating your competence manipulation and secondary market phase.

  ### 1. Logistics & Stakes (The "Fake Money" Problem)
  Since there is no real money, you need **salient stakes**. Candy is often too cheap for upper-level seminarians to care about.
  *   **Recommendation:** Create a "Course Lottery." Tell them: *"At the end of the semester, I will draw one name from the jar. That person gets to choose one of their problem set grades to drop, OR receives a $50 book voucher. The chips you earn today go into the jar. More chips = higher probability of winning."*
  *   **Why:** This creates a non-linear utility function (which is technically a confound for SEU, but for a demo, it creates enough tension to prevent indifference).
  *   **The Lopsided Payoff:** In the experiment, a win = 10 chips. A loss = 0 chips. This makes "I don't care" feel like leaving points on the table.

  ### 2. The Protocol (90 Minutes)

  #### **Phase 0: Setup & Calibration (0:00–0:10)**
  *   **The Packet Check:** You mentioned mailing packets a week ago. **Risk:** Half the class lost it or didn't read it.
  *   **Fix:** Start with a 2-minute "Competence Quiz" based *only* on the packet content. Do not grade it. Just have them self-report: "How many of these 5 questions did you get right?"
      *   *Instruction:* "If you got fewer than 3 right, you are in the 'Ignorance' group for the trivia bet, even if you got the packet. If you got 4-5, you are 'Competent'."
      *   *Why:* This ensures the "Competence" condition actually reflects felt competence, which is the psychological driver of the effect you want to show.
  *   **The Urns:** Place two physical urns (or opaque bags) at the front.
      *   **Urn K (Known):** Clearly show 50 Red / 50 Black chips. Mix them. Seal it.
      *   **Urn A (Ambiguous):** Show 100 chips. Tell them: "There are 100 chips, Red and Black. I determined the split using a random number generator before class. I know the number. You do not. It could be 100/0, 50/50, 0/100." Seal it.

  #### **Phase 1: Primary Choice Task (0:10–0:30)**
  Hand out a decision sheet. Tell them: *"You are building your portfolio. You must choose ONE option from each pair. Circle your choice. There are no right answers, only preferences."*

  *   **Pair 1 (Classic Ellsberg):**
      *   **1a:** Bet on **Red** from Urn K (Known). Win 10 chips.
      *   **1b:** Bet on **Red** from Urn A (Ambiguous). Win 10 chips.
  *   **Pair 2 (Classic Ellsberg Mirror):**
      *   **2a:** Bet on **Black** from Urn K (Known). Win 10 chips.
      *   **2b:** Bet on **Black** from Urn A (Ambiguous). Win 10 chips.
  *   **Pair 3 (Competence Manipulation):**
      *   **3a:** Bet that you score >80% on a **General Knowledge** trivia quiz (Topic: World Capitals). Win 10 chips.
      *   **3b:** Bet that you score >80% on a **Specialized** trivia quiz (Topic: The content of the Packet you received). Win 10 chips.
      *   *Note:* Ensure the "General Knowledge" is actually hard (obscure capitals) and the "Packet Knowledge" is verifiable (based on the quiz you just did).
  *   **Pair 4 (Control):**
      *   **4a:** Coin flip (Heads). Win 10 chips.
      *   **4b:** Draw Red from Urn K. Win 10 chips.
      *   *Goal:* Check if they understand probability. Indifference here is rational.

  *Collect the sheets immediately. Do not let them discuss.*

  #### **Phase 2: The Secondary Market (0:30–0:50)**
  *   **Assignment:** Randomly assign each student a "Endowment" based on their Phase 1 choices.
      *   *Twist:* To force trade, give Student 1 a bet on Urn A (Ambiguous) even if they preferred Urn K. Tell them: *"For the purpose of this market, you currently own the bet you circled in Pair 1. If you didn't circle one, I assigned you Urn A."*
  *   **The Task:** "You can keep your bet, or sell it to a classmate. Write down your **Minimum Selling Price** (in chips). The lowest seller matches with the highest buyer."
  *   **Execution:**
      1.  Ask everyone to write a "Sell Price" for their Urn K bet (0 to 10 chips).
      2.  Ask everyone to write a "Sell Price" for their Urn A bet (0 to 10 chips).
      3.  *Crucial:* Ask them to write a "Buy Price" for a classmate's Urn A bet.
  *   **The Reveal:** Collect the prices. Calculate the average "Spread" (Sell Price minus Buy Price) for Known vs. Ambiguous.
      *   *Hypothesis:* The spread for Ambiguous bets will be massive (people demand a premium to hold them, or refuse to buy them), whereas Known bets will cluster near the Expected Value (5 chips).

  #### **Phase 3: Aggregation & The "Aha" Moment (0:50–0:55)**
  *   Put the Phase 1 choices on the board anonymously.
  *   Tally: How many chose 1a (Known) AND 2a (Known)?
  *   Tally: How many chose 1b (Ambiguous) AND 2b (Ambiguous)?
  *   *Expected Result:* Most will cluster in 1a/2a (Ambiguity Aversion). A few will be consistent SEU agents (1a/2b or 1b/2a).
  *   Put the Phase 2 Prices on the board. Show the "Ambiguity Discount."

  #### **Phase 4: The Debrief (0:55–1:30)**
  *   **Step 1: The Violation.**
      *   Ask: "If you prefer Red in Urn K over Urn A, what must you prefer regarding Black?"
      *   If they say "Black in Urn A," point out the inconsistency.
      *   Write the SEU formula on the board: $U(Bet) = P(Red) \times u(Prize)$.
      *   Show that if $P(Red)_K > P(Red)_A$, then mathematically $P(Black)_A > P(Black)_K$.
      *   Show that their choices imply $P(Red)_K > P(Red)_A$ **AND** $P(Black)_K > P(Black)_A$.
      *   Sum of probabilities > 100%. "You broke math."
  *   **Step 2: The Sure-Thing Principle.**
      *   Frame it: "Imagine I tell you the ball is NOT Blue (there are no blue balls). Does that change your preference between Red-K and Red-A?"
      *   Explain that SEU requires preferences to remain stable when an event with probability zero (or irrelevant events) is removed. Their preference flipped based on the *source* of the uncertainty, not the event itself.
  *   **Step 3: Dutch Book.**
      *   Ask: "Can I Dutch Book you on this?"
      *   Explain: Last week we learned incoherent probabilities allow a bookie to take your money.
      *   The Twist: "Here, there is no objective probability to anchor against. I (the bookie) know the Urn A split. You don't. If I try to Dutch Book you, I have to bet *against* you. But if I know the urn is 90% Red, and you bet on Black because you're ambiguity averse, I will take that bet and crush you. But that's not a Dutch Book; that's just me having better information."
      *   **Key Takeaway:** Dutch Book arguments enforce coherence *given* a probability measure. They do not force you to *have* a probability measure in the face of ambiguity.
  *   **Step 4: Competence Effect.**
      *   Look at Pair 3 results.
      *   If the "Packet Group" preferred the Specialized bet, discuss **Source-Dependent Preferences**.
      *   "Why did you treat the Urn differently than the Trivia? The odds were equally unknown."
      *   Answer: Illusion of Control / Competence. SEU assumes $P(E)$ is a number. You treat $P(E)$ as a *feeling*.

  ---

  ### 3. Reality Check: What Will Predictably Go Wrong

  You asked for honesty. With N=12 and no real money, here are the failure modes:

  **1. The "Ellsberg Veteran"**
  *   **Risk:** In a seminar of 12, there is a 40% chance at least one student has seen this before. They will signal to others.
  *   **Mitigation:** Frame it as "Calibration for the new unit." If someone speaks up, acknowledge it: "Great, you know where this is going. For the sake of the demo, please play your true intuition, not the 'correct' theory answer. I want to see if the intuition holds even when you know the trap."

  **2. The Competence Manipulation Fails**
  *   **Risk:** The students who got the packet might feel *less* confident because the packet highlighted how much they didn't know (the Dunning-Kruger correction). Or, the "General Knowledge" topic accidentally aligns with a student's major (e.g., you pick Geography, one student is a Geographer).
  *   **Mitigation:** This is why the **Phase 0 Quiz** is critical. Do not rely on the packet distribution. Rely on the *self-reported confidence* from the quiz. Group them dynamically in the analysis based on who *felt* competent, not who got the email.

  **3. Herd Behavior / Signaling**
  *   **Risk:** 12 students in a room is intimate. If the first person to turn in their sheet hesitates and looks at the Urns, others will copy the hesitation.
  *   **Mitigation:** Collect sheets face down. Enforce silence strictly during Phase 1. "Pens down, eyes front."

  **4. The "Fake Stakes" Flatline**
  *   **Risk:** Students treat chips as abstract. They randomize choices because they don't care. You get a 50/50 split everywhere, and the "paradox" vanishes.
  *   **Mitigation:** The "Course Lottery" (dropping a grade) is the only thing that usually works in seminars. If you can't do that, bring **very good** chocolate. But be prepared: if the data is muddy, *own it*. Say: "Notice how hard it is to care about the chips? That's risk neutrality induced by low stakes. In the real world, with real capital, this aversion screams louder."

  **5. The Market Phase Liquidity Crisis**
  *   **Risk:** With 12 people, you might not have a natural buyer for every seller. The market clears at "No Trade."
  *   **Mitigation:** Act as the **Market Maker**. If no student will buy the Ambiguous bet at 4 chips, *you* buy it. "I, the Professor, am willing to buy your Ambiguous bet for 3 chips." This highlights the premium: "Why won't your classmates buy it for 5, but I will for 3? Because I know the odds." (Wait, don't reveal you know the odds yet).
      *   *Better:* Just aggregate the "Willingness to Accept" (WTA). Compare the average WTA for Known vs. Ambiguous. You don't need actual trades to show the price gap.

  ### 4. What Fake Stakes Fundamentally Can't Reproduce

  Be explicit about this in the debrief. It shows intellectual honesty.

  1.  **Wealth Effects:** SEU assumes utility is defined over final wealth states. In class, utility is defined over "candy/points." There is no income effect. Ambiguity aversion often increases with the size of the stake. They are testing the theory with pocket change.
  2.  **Responsibility:** In the experiment, if they lose, they blame luck. In the real world (e.g., a medical decision or investment), if they choose the Ambiguous option and lose, they feel *stupid*. Ambiguity aversion is partly **regret aversion**. Fake stakes remove the sting of regret.
  3.  **Adversarial Nature:** In the Ellsberg setup, the "unknown" is passive. In real life, unknown probabilities often imply an *adversary* (a market counterparty, an insurer). Students might be treating Urn A as "The Professor is trying to trick me," which is rational caution, not irrational aversion.

  ### Summary Checklist for You
  *   [ ] **Stakes:** Secure the "Grade Drop" or "Book Voucher" raffle permission.
  *   [ ] **Urns:** Prepare two distinct containers. Label them K and A.
  *   [ ] **Packets:** Send the "Competence" packet 1 week prior (Topic: e.g., "History of Decision Theory" or specific Class Rules).
  *   [ ] **Quiz:** Prepare the 5-question calibration quiz for the start of class.
  *   [ ] **Sheets:** Print decision sheets with clear Pair 1/2/3/4 options.
  *   [ ] **Board:** Leave space for the Tally and the Price Comparison.

  This design forces them to confront the inconsistency in their own preferences before you give them the vocabulary to excuse it. That cognitive dissonance is where the learning happens.
