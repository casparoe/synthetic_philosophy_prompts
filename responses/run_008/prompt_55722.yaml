          *   Actually, logic: If I believe $p$, then $\neg Bp$ is false. So if $p$ is false, the whole thing is false.
          *   Pragmatically: Asserting a disjunction usually implies I don't know which disjunct is true. But if I assert $p \lor \neg Bp$, do I present myself as believing $p$? Not necessarily.
