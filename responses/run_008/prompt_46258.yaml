answer: |-
  The most serious challenge to risk-weighted expected utility theory arises from issues of diachronic rationality and dynamic consistency. If an agent maximizes risk-weighted expected utility at every stage of a sequential decision problem, they may formulate a plan at an initial time that they prefer to abandon at a later time, because the risk function applies to the total gamble initially but only to the remaining sub-gamble later. This discrepancy can expose the agent to a money pump, where they pay to switch plans and end up with less money than they started with despite having consistent preferences at each snapshot. A committed defender of the view would concede that the theory violates dynamic consistency but dismiss the claim that this is fatal to its normative status. They would argue that dynamic consistency is not a constitutive norm of rationality when risk attitudes are sensitive to the global structure of choices, suggesting that a rational agent should adopt a sophisticated choice mechanism that anticipates their future shifts rather than treating the shift as an irrational inconsistency. While this avoids the money pump, it requires restricting the theory's application to specific planning contexts, which critics view as an ad hoc maneuver to save the theory from practical incoherence, leaving the defender with the awkward burden of explaining why rationality permits such diachronic fragmentation.

  Moving from diachronic issues to methodological concerns, the accommodation worry poses a significant threat to the theory's scientific status and explanatory power. Since both the utility function and the risk function are free parameters adjustable to fit observed choices, any preference ordering that satisfies stochastic dominance can be represented by some combination of the two. This suggests the theory is unfalsifiable by choice data alone, as it can retro-fit any consistent pattern of behavior. If this is right, the position has indeed been insulated into unfalsifiability, which is generally considered a defect in a theory claiming to explain behavior rather than merely re-describe it. A defender would concede that risk-weighted expected utility is more permissive than expected utility theory but dismiss the charge of vacuity by arguing that the theory is primarily normative rather than descriptive. They would contend that the risk function represents a genuine attitude toward risk that can be elicited through introspection or independent psychological measures, not just choice data, thereby preserving empirical content. However, if the risk function is only accessible through the very choices it is meant to explain, the worry remains that the theory offers a complex labeling system rather than a causal explanation, forcing the defender to rely on the intuitive plausibility of the risk attitude itself to justify the theory's validity.

  Regarding predictive exposure, the view genuinely predicts that an agent can exhibit risk aversion while possessing a linear utility function for wealth, whereas expected utility theory predicts that risk aversion must stem from diminishing marginal utility. This separation allows risk-weighted expected utility to account for cases where an agent is risk-averse over small stakes where wealth effects are negligible, a phenomenon expected utility theory struggles to explain without positing implausibly sharp curvature in the utility function. Furthermore, the theory predicts that preferences can reverse when common consequences are added to gambles, violating the Independence axiom, whereas expected utility theory predicts such preferences will remain stable. The exposure lies in the claim that risk attitude is a separate psychological component from utility curvature; if neuroeconomic or behavioral experiments demonstrate that risk attitudes shift exactly in tandem with changes in marginal utility without any independent variation, expected utility theory would gain confirmation at the expense of risk-weighted expected utility. This provides a clear empirical battleground, though currently, the data on small-stakes risk aversion tends to favor the risk-weighted view.

  A further pressure comes from the violation of the Independence axiom, which many decision theorists regard as a constitutive requirement of rationality. The argument is that if an agent prefers option A to B, they should still prefer A plus a common consequence to B plus that same consequence, because the common part should cancel out. Risk-weighted expected utility explicitly denies this, arguing that the common consequence changes the risk profile of the gamble. A defender would dismiss the Independence axiom as too strong for a theory that aims to capture ordinary rationality, arguing that ordinary people reasonably care about the security of the total package rather than isolated differences. Critics, however, maintain that violating Independence undermines the coherence of preference aggregation, making this a fundamental normative clash rather than a mere technical adjustment. The defender must therefore argue that our pre-theoretical intuitions about cases like the Allais paradox are more reliable than the abstract formal requirement of Independence, a move that shifts the debate to meta-ethical grounds about the source of normative authority.

  Finally, the least fatal but still awkward pressure concerns the distinction between explanation and re-description. Expected utility theory explains risk aversion via the economic concept of diminishing marginal utility, linking it to wealth effects. Risk-weighted expected utility explains it by positing a brute attitude toward risk. The worry is that positing a risk function simply names the phenomenon without explaining its origin or mechanism. A defender would argue that capturing the phenomenology of risk aversion is itself explanatory, as it validates the agent's perspective that risk is a distinct property of acts. However, if the risk function cannot be grounded in deeper psychological or evolutionary mechanisms, the theory risks appearing as a sophisticated way to say that agents prefer certainty without explaining why that preference is rational beyond the assertion that it is a basic attitude. This leaves the theory vulnerable to the charge that it rationalizes intuitions rather than subjecting them to critical scrutiny, which may be acceptable for a descriptive project but less satisfying for a normative one, leaving the defender to argue that the rationality of an attitude does not require it to be reducible to something else.
