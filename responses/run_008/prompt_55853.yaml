      *   **Context:** The user and their flatmate are debating a friend (a phil of mind student/expert) who is issuing verdicts on these cases. The friend seems to be leaning heavily towards "Stalinesque" explanations (pre-conscious editing) for most illusions, except for ordinary lag and waterfall.
      *   **Task:**
          1.  Predict the friend's verdict on the Flash-Lag Effect.
          2.  Work out the candidate rules underlying her previous rulings (at least two distinct rules).
          3.  Explain what each rule predicts for Flash-Lag.
