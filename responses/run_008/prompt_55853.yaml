      *   *Cutaneous Rabbit:* Stalinesque (phantom taps created before consciousness).
      *   *Backward Masking:* Stalinesque (never conscious).
      *   *Ordinary Perceptual Lag:* No revision, just latency.
      *   *Waterfall Illusion:* No retro-edit, later experience feels like it's about the earlier one (no rewrite).

      *Observation:* She is rejecting Orwellian revisions (memory tampering) in favour of Stalinesque fabrication (pre-conscious editing) for the "illusion" cases, but rejecting *any* revision/editing for "latency" or "aftereffect" cases. She seems to want to preserve the integrity of conscious content once it exists, pushing all the magic into the pre-conscious processing stage.

  3.  **Analyse the Flash-Lag Effect:**
      *   *Phenomenon:* A moving object and a flashed object are physically aligned at time $t$. The observer perceives the moving object as being ahead of the flashed object at time $t$.
      *   *Explanation 1 (Postdictive/Integration):* The brain waits for information about the motion trajectory to arrive, integrates it, and constructs the position of the moving object at the time of the flash based on where it *would* be. This implies a delay and construction. If the construction happens before consciousness, it's Stalinesque.
      *   *Explanation 2 (Differential Latency):* Motion processing is faster than flash processing. The moving object's position is processed quicker, so when consciousness accesses them, the moving object's signal is "newer" or ahead. No editing, just different arrival times.
      *   *Friend's Pattern:* She calls Colour Phi and Cutaneous Rabbit Stalinesque (construction/editing). She calls Ordinary Lag "just latency".
      *   *Conflict:* Flash-Lag can be explained by either construction (like Colour Phi) or differential latency (like Ordinary Lag).

