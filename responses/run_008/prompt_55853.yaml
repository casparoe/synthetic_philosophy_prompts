          *   *Prediction for Flash-Lag:* The moving dot and flash are perceived as a single spatial event involving motion. The brain constructs the position based on trajectory. This looks like Colour Phi. Verdict: **Stalinesque**.
      *   *Rule B (The "Differential Processing" Rule):* If the illusion can be explained by different processing speeds for different types of stimuli (motion vs. static), then no editing is needed. It's just like Ordinary Lag.
