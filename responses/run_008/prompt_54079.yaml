answer: |-
  # Which Response to the Doomsday Argument Do You Actually Hold?

  **1. The Urn**
  An urn contains either 10 balls or 1,000 balls, numbered sequentially from 1. You draw one ball at random and it reads '7'. You are told this is the only information you get.
  *   **A.** This makes the 10-ball urn much more likely.
  *   **B.** This makes the 1,000-ball urn more likely (more balls means more chances to draw *something*).
  *   **C.** This tells me nothing about the size of the urn; the draw wasn't truly random relative to the total.

  **2. God's Coin**
  A fair coin is flipped. Heads: one human is created. Tails: one trillion humans are created. You exist. You know nothing else about the world.
  *   **A.** I should favour Tails. Finding myself existing is stronger evidence in a world with more observers.
  *   **B.** I should favour Heads. The coin was fair; my existence doesn't change the odds of the flip.
  *   **C.** It depends on whether I count as a "random sample" of the possible humans.

  **3. The Prison Queue**
  You are in a prison where the phone queue is ordered strictly by remaining sentence length (shortest first). You learn you are 57th in the queue.
  *   **A.** This suggests the total queue is likely short; I'm surprisingly far up for a large prison.
  *   **B.** This tells me nothing about the total queue size; my position is determined by my sentence, not a random draw.
  *   **C.** This suggests the total queue is huge; surely there are more people behind me than ahead.

  **4. The Digital Future**
  Suppose the future holds trillions of digital minds uploaded from human brains. When counting "humans" for the Doomsday Argument, do you include them?
  *   **A.** Yes, any conscious observer counts.
  *   **B.** No, only biological humans count.
  *   **C.** There is no objective fact about who counts; choosing the class feels like picking the conclusion you want.

  **5. The Multiverse**
  Physicists confirm an infinite multiverse where every possible history occurs. You are early in *this* particular history.
  *   **A.** My early rank here still suggests this specific history will end soon.
  *   **B.** No, the existence of infinite other histories drowns out the evidence from my local rank.
  *   **C.** The question is meaningless; "I" exist in all histories, so rank doesn't apply.

  **6. The Trillion Scale**
  Imagine the future holds ten trillion people. You are human number 100 billion. Does being this "early" feel surprising?
  *   **A.** Yes, very. I should expect to be closer to the middle.
  *   **B.** No, not really. 100 billion is still a big number; "early" is subjective.
  *   **C.** It feels surprising, but I don't trust that feeling to predict the future.

  **7. The Margarine Tub**
  Apply the same logic to a tub of margarine. It has existed for 10 days. Does this suggest it will expire soon (total lifespan ~20 days) rather than later (total lifespan ~10 years)?
  *   **A.** Yes, the same logic applies. Most things don't last forever.
  *   **B.** No, humans are special observers; margarine is just stuff.
  *   **C.** Yes, the logic applies, but we already know margarine expiry dates, so it tells us nothing new.

  **8. The Prior Check**
  Before hearing the Doomsday Argument, did you already think human extinction was likely within a few centuries?
  *   **A.** No, I was optimistic. The argument worries me.
  *   **B.** Yes, I was already pessimistic. The argument just confirms it.
  *   **C.** Yes/No, but the argument doesn't change my view either way.

  **9. Time vs. Count**
  Would you prefer to run this argument based on how long humanity has *lasted* (years) rather than how many humans have *lived* (births)?
  *   **A.** Yes, duration feels more natural than birth ranks.
  *   **B.** No, birth ranks are the only thing that matters for observer selection.
  *   **C.** It makes no difference; they are interchangeable.

  **10. The "Why Me?"**
  Does the fact that you are *you* (a specific person with specific parents) matter for the calculation?
  *   **A.** No, I am just a random observer slot.
  *   **B.** Yes, my specific identity ties me to a specific era; I wasn't drawn from a hat.
  *   **C.** Maybe, but I'm not sure how to model that.

  ***

  # Scoring Key

  Tally your answers using the table below. Some answers contribute to more than one category because philosophical positions often overlap.

  | Question | Option A | Option B | Option C |
  | :--- | :--- | :--- | :--- |
  | **1. Urn** | +1 **Doom** | +1 **SIA** | +1 **Sample** |
  | **2. Coin** | +1 **SIA** | +1 **Doom** | +1 **Sample** |
  | **3. Prison** | +1 **Doom** | +1 **Sample** | +1 **SIA** |
  | **4. Digital** | +1 **Doom** | +1 **Doom** | +1 **RefClass** |
  | **5. Multiverse** | +1 **Doom** | +1 **SIA** | +1 **Sample** |
  | **6. Trillion** | +1 **Doom** | +1 **Prior** | +1 **Sample** |
  | **7. Margarine** | +1 **Time** | +1 **Sample** | +1 **Prior** |
  | **8. Prior** | +1 **Doom** | +1 **Prior** | +1 **Prior** |
  | **9. Time** | +1 **Time** | +1 **Doom** | +1 **Time** |
  | **10. Why Me** | +1 **Doom** | +1 **Sample** | +1 **Sample** |

  **Calculate your totals:**
  *   **Doom:** \_\_\_\_\_
  *   **SIA:** \_\_\_\_\_
  *   **Sample:** \_\_\_\_\_
  *   **RefClass:** \_\_\_\_\_
  *   **Prior:** \_\_\_\_\_
  *   **Time:** \_\_\_\_\_

  **Find your highest score:**

  *   **Mostly Doom:** **(a) Full Acceptance.** You treat your birth rank as genuine Bayesian evidence. You believe the urn logic applies to humanity, and you are willing to accept the uncomfortable conclusion that doom comes sooner rather than later.
  *   **Mostly SIA:** **(b) The Existence Advocate.** You lean towards the idea that finding yourself existing favours hypotheses with more observers. You likely chose "Favour Tails" on the Coin question. You think the Doomsday Argument ignores the evidence of your own existence.
  *   **Mostly Sample:** **(c) The Sampling-Fallacy Objector.** You reject the idea that you are a random sample from all humans. You likely chose " Tells me nothing" on the Prison Queue. You think the likelihood computation is a mirage because your existence is correlated with *when* you exist.
  *   **Mostly RefClass:** **(d) The Reference-Class Skeptic.** You flagged the Digital Future question as arbitrary. You believe the argument's force depends entirely on who counts as an observer, and since there is no objective fact about that, the argument fails.
  *   **Mostly Prior:** **(e) The "Nothing New" Position.** You accept the maths but deny the impact. You likely indicated that you were already pessimistic or that the argument doesn't move you. You think whatever update the argument delivers was already baked into your priors.
  *   **Mostly Time:** **(f) The Timespan Version.** You prefer reasoning about duration over birth ranks. You are comfortable with the logic but think framing it in years (like the margarine tub) is more honest than counting heads.

  ***

  # Notes on the Scoring Tree

  **1. Indistinguishable Leaves: (a) Full Acceptance and (f) The Timespan Version**
  You may have noticed that the "Doom" and "Time" scores often rise together. This is not a bug in the quiz, but a feature of the philosophy. Position (f) is substantively almost identical to position (a); it merely prefers to frame the evidence in terms of temporal duration rather than observer count. Unless a respondent explicitly rejects birth ranks *in favour* of duration (choosing 9A but 1B), the quiz cannot reliably separate them. If you scored high on both, you are effectively a Doomsday Accepter who prefers thinking in years.

  **2. Indistinguishable Leaves: (a) Full Acceptance and (e) The "Nothing New" Position**
  These two positions accept the same Bayesian update but disagree on whether it constitutes *new* information. The quiz attempts to separate them via Question 8 (The Prior Check), but a respondent who was already pessimistic for *other* reasons might score high on Doom simply because they agree with the conclusion. If you scored high on Doom but also high on Prior, you likely hold view (e): the argument is valid, but it hasn't actually changed your mind.

  **3. The Empty Leaf: The "Anti-SIA Doomsday" Combination**
  There is a combination of answers that lands nowhere on the tree: accepting the Urn logic (Q1A) but rejecting the Coin logic (Q2B) while also rejecting the Prison logic (Q3B). This pattern suggests you think birth rank is evidence in abstract urns, but not when observers are created by a coin flip, and not when queues are ordered by sentence length. Nobody holds this view consistently because it implies the sampling mechanism matters only when it's convenient. This view is likely incoherent; it treats "randomness" as a property of the object rather than the selection process.

  **4. The Unexplored Leaf: (d) Reference-Class Skeptic**
  Very few respondents land purely on (d) without also scoring high on (c) or (e). This is because rejecting the reference class usually implies rejecting the sampling method too. If you scored high on RefClass but low on everything else, you hold a rare view: that the maths is fine, the sampling is random, but we simply cannot agree on who counts as a human. This position is philosophically tenable but psychologically uncomfortable, as it leaves the argument valid in principle but useless in practice.
