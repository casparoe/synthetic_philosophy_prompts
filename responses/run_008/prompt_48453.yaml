      *   *Implication:* Requiring an upper bound for the empty chain means "There exists at least one element in the poset."
      *   *Why it matters:* If the poset is empty, there are no maximal elements. Zorn's Lemma concludes "There exists a maximal element." So the poset *must* be non-empty.
