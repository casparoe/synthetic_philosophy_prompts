answer: |-
  Your friend has walked you into a classic trap, but your intuition is correct: the argument is a *reductio ad absurdum* of his own premises, not a proof that chemistry is epiphenomenal. The logic holds together only because a specific word shifts its meaning between the mental case and the physical descent.

  The trick is in Premise (2), specifically in the word **"Distinct."**

  To make the Exclusion Argument work against the mind, "Distinct" must imply **Independence**. To make the Descent Argument work against the neurons, "Distinct" need only imply **Non-Identity**. Your friend is using the plausibility of the first to smuggle in the second.

  Here is the diagnosis of the slide, the two meanings of the premise, and what you actually give up if you reject it.

  ### 1. The Equivocation on "Distinct"

  The Exclusion Principle relies on the intuition that if two *separate* things are both fully capable of bringing about an effect, you have a bizarre coincidence (overdetermination). Two assassins firing at once is bizarre. But a neural firing and the molecules constituting it are not "separate" in the relevant sense.

  Here is Premise (2) written out under the two different meanings required to make the argument flow:

  **Meaning A (Required for the Mental Step):**
  > (2a) If Mental event $M$ causes Physical event $P$, and Physical event $C$ is sufficient for $P$, and $M$ is **ontologically independent from** $C$, then $P$ is overdetermined.

  *   **Why it works here:** If you are a dualist (or even a non-reductive physicalist treating the mental as a separate category), $M$ and $C$ are candidates for *independent* causal powers. If both are sufficient, it looks like double-counting. This forces you to either identify $M$ with $C$ or render $M$ inert.

  **Meaning B (Required for the Descent Step):**
  > (2b) If Higher-level event $H$ causes Physical event $P$, and Lower-level event $L$ is sufficient for $P$, and $H$ is **not numerically identical to** $L$, then $P$ is overdetermined.

  *   **Why it fails here:** This version drops the requirement of independence. It treats *any* non-identity as competition. But $H$ (neural) and $L$ (molecular) are not independent. $H$ is *realized by* $L$. $H$'s causal power is not a *second* source of power added to $L$'s; it is the *same* power described at a different grain.

  **The Slide:**
  Your friend uses **(2a)** to convince you that the mental must be physical (because independent mental causes would create systematic overdetermination). Then, without noticing, he switches to **(2b)** to argue that the neural must be molecular (because non-identical neural causes would create systematic overdetermination).

  If he sticks with **(2a)** for the descent, the argument stops. Why? Because the neural event is *not ontologically independent* from the molecular event. It depends on it. Therefore, they are not rival causes, and no overdetermination occurs.

  If he sticks with **(2b)** for the mental step, the argument never starts. Why? Because you could simply say the mental is distinct (non-identical) from the physical but dependent on it (realization), just like the neural is to the molecular. This would allow mental causation without identity, which is exactly what he wanted to rule out.

  ### 2. Why "Sufficiency" Isn't the Problem (But Helps the Trick)

  You suspected "sufficient" might be doing double duty. It is, but only because of the distinctness slide.

  In Premise (1), "sufficient" means **physical necessitation** (laws + state $\rightarrow$ outcome).
  In Premise (2), "sufficient" is treated as **causal completeness** (doing all the "work").

  The trick works because your friend assumes that if the molecular level provides the *necessitation*, it hogs all the *causal work*. But causal work is not a conserved quantity like energy. The molecules necessitate the arm rising. The neural pattern *also* necessitates the arm rising (via the molecules).
  *   In the **Assassin Case**: Assassin 1's bullet necessitates death. Assassin 2's bullet necessitates death. These are two separate chains of necessitation.
  *   In the **Neural/Molecular Case**: The molecules necessitate the arm rising. The neural event necessitates the arm rising *in virtue of* the molecules. This is one chain of necessitation described twice.

  By treating the neural event as a distinct sufficient cause in the same way an assassin is distinct, he treats a *description* of the cause as if it were a *rival* to the cause.

  ### 3. What You Give Up If You Reject (2)

  If you reject Premise (2) to save chemistry and biology, are you left with handwaving? No. You are rejecting the idea that **causal competition applies across levels of realization.**

  Here is what you are actually committing to:

  1.  **Causation is Level-Relative:** An event can be a sufficient cause at the neural level *and* a sufficient cause at the molecular level without them fighting. They are not competitors; they are nested.
  2.  **Dependence Blocks Exclusion:** The Exclusion Principle only applies to causes that are *independent*. If $A$ depends on $B$ (for its existence or its powers), $A$ and $B$ can both be sufficient for $E$ without overdetermination.
  3.  **Physics is Closed, but Not Exclusive:** You keep Premise (1) (Physical Closure). Every physical effect has a physical cause. You just deny that this *excludes* higher-level causes. The physical cause *secures* the higher-level cause's ability to act.

  ### 4. The Diagnosis in One Sentence

  The argument is valid only if "Distinct" means "Independent," but the descent to fundamental physics is plausible only if "Distinct" means "Non-Identical," and since realized events (neurons) are non-identical to but dependent on their realizers (molecules), the Exclusion Principle does not apply to them.

  ### Summary for Your Friend

  Tell him this:
  "You used the Exclusion Argument to force Mind-Brain identity by assuming Mental and Physical causes would be *independent* competitors (like two assassins). But when you moved to Neurons and Molecules, they aren't independent competitors; they are *dependent* realizers (like a flag and the cloth it's made of). If you apply the 'Independent' standard to Neurons/Molecules, they don't compete, so chemistry survives. If you apply the 'Non-Identical' standard to Mind/Brain, they don't compete, so dualism survives. You can't use the strict standard to kill the mind and the loose standard to kill the neurons."

  He can't have it both ways. If he wants to save physics from epiphenomenalism, he must admit that realization relations block causal exclusion. If he admits that, he has to let the mind off the hook too (unless he insists the mind is *independent* of the brain, in which case he's a dualist and loses the right to claim science supports him).
