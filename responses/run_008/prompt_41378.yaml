answer: |-
  **TO:** Clinical Ethics Committee, [Trust Name]
  **FROM:** [Your Name], External Ethics Advisor
  **DATE:** 24 May 2024
  **SUBJECT:** Ethical Opinion: Case of Mrs [X] – Artificial Nutrition in Advanced Dementia

  **Introduction**
  This memo addresses the contested proposal to insert a percutaneous endoscopic gastrostomy (PEG) tube for Mrs [X], a 79-year-old woman with moderately advanced Alzheimer's. The Committee is divided between respecting a valid Advance Decision to Refuse Treatment (ADRT) signed twelve years ago and protecting the apparent wellbeing of the patient's current self. This opinion recommends **against the insertion of a feeding tube**, proposing instead a robust plan for assisted hand-feeding. This conclusion rests on a convergence of clinical evidence, a specific interpretation of 'meaningful interaction', and a reconciliation of precedent autonomy with current experiential interests.

  **Ethical Analysis: Precedent Autonomy vs. Current Wellbeing**
  The central ethical tension lies between the critical interests of Mrs [X]'s past competent self and the experiential interests of her current self. The son argues that overriding the ADRT treats his mother as a different person, violating her right to narrative integrity. The daughter argues that enforcing it sacrifices a contented individual to satisfy the fears of a woman who no longer exists.

  The daughter's position invokes a compelling reversal of Dworkin: if the past self's critical interest was avoiding a life judged 'worthless', and the current self finds value and joy, does enforcing the ADRT serve any interest at all? It is a profound question. However, precedent autonomy retains moral weight not merely to punish the future self, but to protect the individual from medical interventions that contradict their foundational values regarding dignity and dependency.

  Crucially, in this specific case, the interests of the past and present selves are not in zero-sum conflict. The daughter assumes the tube is necessary to sustain Mrs [X]'s current contentment. The clinical evidence suggests otherwise. In advanced dementia, tube feeding does not significantly prolong life, does not prevent aspiration pneumonia (often exacerbating it), and frequently requires physical restraint, causing distress. Therefore, refusing the tube does not sacrifice the current self's happiness; rather, it protects her from invasive burden. We can honour the past self's refusal of medicalization *by* protecting the current self's quality of life. The ADRT serves as a powerful indicator of best interests, confirming that Mrs [X] would not want her remaining days defined by invasive procedures.

  **Interpretation of 'Meaningful Interaction'**
  Clinicians require guidance on the ADRT's threshold: *"no reasonable prospect that I will regain the ability to interact meaningfully."* The daughter cites Mrs [X]'s enjoyment of music and family visits as evidence of meaningful interaction. The son views this as 'pleasant confusion'.

  The Committee should advise that 'meaningful interaction' in the context of dementia care should not be restricted to high-level cognitive reciprocity. Emotional connection—recognising a granddaughter, responding to music—constitutes meaning. However, the ADRT must be read holistically. The clause regarding interaction was likely intended to exclude a state of total vegetative isolation. While Mrs [X] retains moments of connection, she lacks the capacity to understand the nature of the proposed treatment or its consequences.

  More importantly, the method of feeding impacts the capacity for interaction. Hand-feeding is a social, sensory act that facilitates the very interactions Mrs [X] enjoys. Tube feeding bypasses this, isolating the patient from the sensory pleasure of taste and the relational aspect of care. Thus, even if her current state meets the threshold of 'meaningful interaction', the proposed intervention undermines it.

  **Recommendation**
  The Committee should advise the treating team **against the insertion of a feeding tube**.

  1.  **Best Interests:** Given the lack of clinical benefit and the high burden of PEG feeding in advanced dementia, insertion is not in Mrs [X]'s best interests under the Mental Capacity Act. This aligns with national guidelines (e.g., NICE, BGS).
  2.  **Validity of ADRT:** While the applicability of the 'meaningful interaction' clause is contestable, the ADRT clearly expresses a wish to avoid artificial prolongation of life in advanced dementia. This wish remains a decisive factor in determining best interests.
  3.  **Care Plan:** The Trust should commit to a programme of careful hand-feeding. This respects the daughter's observation of her mother's contentment by preserving the sensory pleasures of eating and the relational nature of care, while respecting the son's insistence on honouring his mother's prior values against medicalization.

  **Conclusion**
  We cannot fully resolve the philosophical dispute over whether the past self binds the future self. However, we can resolve this case by recognising that the 'good' of the current self does not require invasive technology, and the 'values' of the past self oppose it. Refusing the tube is not an act of neglect, but a commitment to allow Mrs [X] to remain the cheerful woman her family knows, without subjecting her to a procedure she explicitly rejected and which clinical evidence suggests would harm her.

  **[Signature]**
  **External Ethics Advisor**
