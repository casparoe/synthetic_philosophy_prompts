          2.  Identify where the mapping breaks (disanalogies) and what assumptions it imports (passivity, determinism, lack of agency, single outcome).
          3.  Evaluate which disanalogies matter for the professor's conclusion (war was overdetermined/structural vs. assassination was insignificant).
          4.  Analyze the friend's "Murder on the Orient Express" analogy (compare necessary vs. sufficient causes).
          5.  Determine which analogy fits history better (or if it's a mix).
          6.  Verdict: Does the professor's conclusion survive without the analogy? If yes, restate it. If no, propose a better analogy.

  2.  **Step 1: Auditing the Powder Keg Analogy:**

      *   *Mapping:*
          *   Keg/Container = The European State System/Alliance Structures.
          *   Powder = Tensions (Imperialism, Nationalism, Militarism, Naval Race).
          *   Spark = Assassination of Franz Ferdinand.
          *   Blast = World War I.
      *   *Implicit Assumptions/Imports:*
          *   Passivity: The powder doesn't act; it just waits. (States are reactive, not active agents).
          *   Determinism: Once the spark hits, the explosion *must* happen. (No diplomatic off-ramps were possible).
          *   Interchangeability: Any spark works. (The specific nature of the assassination didn't matter).
