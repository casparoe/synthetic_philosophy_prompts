answer: |-
  ### Essay Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (but quality over quantity)

  **Question:**
  Strawson argues that because reactive attitudes are constitutive of human relationships, a wholesale shift to the objective stance is not a live option for us. Critics object that inevitability is not justification: deep-seated psychological tendencies like jealousy or tribal prejudice are also hard to eradicate, yet we do not take their inevitability as vindication. 

  Evaluate whether Strawson's appeal to the value of interpersonal relationships successfully answers this objection, or whether he merely relabels the status quo. In your answer, explain how the distinction between exemptions and excuses functions not merely as a classification of cases, but as evidence that the practices have internal standards capable of failure. Finally, assess whether Strawson can concede that particular practices require reform without undermining his claim that there is no external standpoint from which to judge the whole edifice. What cost does this concession exact?

  ***

  ### Model Answer

  Strawson's central challenge is to show that the practice of holding responsible is not merely a brute fact of human psychology but a justified component of human life. The critic's analogy to jealousy or tribal prejudice strikes at the heart of the "descriptive" reading of Strawson: if we cannot help but feel resentment, neither can we help but feel jealousy, yet we strive to mitigate the latter. If Strawson offers only a description of our psychological incapacities, he fails to justify the practice.

  To answer this, Strawson must adopt what is often called the "humanist reading." On this view, reactive attitudes are not just inevitable; they are the correlate of valuing interpersonal relationships. We do not justify jealousy because it undermines relationships; we justify resentment because it constitutes them. This supplies a normative standard: attitudes are appropriate insofar as they reflect a genuine demand for goodwill within a relationship. This moves beyond mere description by grounding the practice in the goods of human life, not just its causal inevitability.

  The distinction between exemptions and excuses is crucial here. If the practice were merely blind retribution, this distinction would collapse. An excuse (e.g., "I didn't see you") acknowledges the demand for goodwill but denies the violation. An exemption (e.g., "They are psychologically incapacitated"), however, suspends the demand itself because the agent cannot participate in the relationship. This distinction only makes sense if the practice has a point—namely, the maintenance of interpersonal relationships. If the practice were merely a mechanism for social control (like managing a dangerous animal), exemptions would be pragmatic calculations, not suspensions of a relational stance. Thus, the distinction evidences that the practice is governed by internal norms, not just causal forces.

  However, this invites the final complication: reform. If the practices have internal standards, they can fail to meet them. Strawson can concede that particular manifestations of resentment (e.g., disproportionate rage) are unjustified and require reform. This allows him to distinguish his view from the jealousy analogy: we reform jealousy because it conflicts with relational goods, whereas we refine resentment to serve them. 

  Yet, this concession exacts a cost. By allowing internal reform, Strawson admits that particular reactive attitudes can be critiqued against the standard of "human flourishing." This weakens his stronger claim that there is *no* external standpoint. If we can judge particular attitudes by how well they serve relationships, the pessimist may argue we can judge the whole framework by whether those relationships are themselves desirable. Strawson survives by arguing that the framework is constitutive of any life we could recognize as human, but he must accept that the boundary between internal reform and external critique is porous. He saves the practice from abolition, but only by admitting it is subject to normative evaluation beyond mere inevitability.

  ***

  ### Marking Scheme (Total: 20 Points)

  | **Criteria** | **Marks** | **Typical Failure (The "B" Trap)** |
  | :--- | :---: | :--- |
  | **1. The Inevitability Objection**<br>Student accurately reconstructs the jealousy/tribal prejudice objection not as a misunderstanding, but as a challenge to the *normative* force of Strawson's argument. | **4** | Treats the objection as a simple confusion about determinism rather than an is/ought problem regarding psychological entrenchment. |
  | **2. Normative vs. Descriptive**<br>Student explains how the "humanist reading" attempts to bridge the gap (value of relationships) rather than simply asserting Strawson is one or the other. | **4** | Picks a side ("It's just descriptive") without analyzing how Strawson tries to derive justification from the nature of the relationships themselves. |
  | **3. Function of Exemption/Excuse**<br>Student explains that the distinction evidences *internal standards* (relational demands) rather than just defining the terms or listing examples. | **4** | Defines exemption and excuse correctly but fails to link them to the *point* of the practice (i.e., treats them as taxonomic rather than functional). |
  | **4. Reform vs. Abolition**<br>Student distinguishes between reforming particular attitudes (allowed) and abolishing the framework (denied), showing how this counters the jealousy analogy. | **4** | Claims Strawson denies all possibility of change or reform to the practices, missing the nuance of internal adjustment. |
  | **5. The Cost of Concession**<br>Student identifies the tension: allowing internal reform weakens the "no external standpoint" claim, potentially reopening the door to skeptical critique. | **4** | Accepts Strawson's solution as seamless; fails to note that admitting internal standards creates a wedge for external critique. |
