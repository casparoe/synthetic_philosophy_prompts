answer: |-
  ### Part 1: Design Brainstorming & Selection

  **Candidate 1: The "Bug Bounty" Race**
  Teams race to fix simulated bugs on a whiteboard. Each bug fixed costs tokens. The first to clear the board wins a prize.
  *   *Verdict:* **Rule Out.** This tests speed and coordination, not commitment. It lacks the "sunk cost" trap because stopping is always safe (you just don't win). It doesn't replicate the pain of continuing a failing project.

  **Candidate 2: The "Feature Poker" Estimation Game**
  Teams estimate effort for features. If they go over budget, they lose points.
  *   *Verdict:* **Rule Out.** This is a planning exercise. It engages the prefrontal cortex (rational planning) rather than the emotional drive to recoup losses. It won't generate the visceral "we're in too deep" feeling you need.

  **Candidate 3: The "Migration Contract" (Modified Dollar Auction)**
  Teams bid tokens to "win" a project contract. Highest bidder wins the contract value; *all* bidders pay their bids.
  *   *Verdict:* **Select.** This is the only mechanic that structurally enforces loss aversion. It maps 1:1 to your migration scenario: the "prize" is the successful rewrite, the "bids" are sprint costs, and the "second-place penalty" is the sunk engineering time that yields no value if you don't ship.

  ---

  ### Part 2: The Activity Design — "The Migration Contract"

  **Framing:** Do not call this a "game." Call it a **"Resource Allocation Simulation."** Engineers respect systems; they distrust "fun."

  **Participants:** 24 Engineers.
  **Setup:** 4 Teams (Alpha, Beta, Gamma, Delta) of 6 people each.
  **Room:** Whiteboard divided into 4 columns (one per team). Projector for rules/timer.

  #### 1. The Token Economy
  *   **Starting Capital:** Each team receives **100 Tokens** (printed paper slips or just tally marks).
  *   **The Prize:** "The Migration Contract" is worth **400 Tokens** (paid to the winner *minus* their total bid).
  *   **The Cost:** Bids represent "Sprint Capacity."
  *   **The Debt Rule:** If a team runs out of tokens, they can bid on **Credit**. Credit is allowed up to -50 Tokens. *However*, any token spent on Credit costs **2 Tokens** to repay later (interest). This mimics taking on technical debt to keep a project alive.
  *   **The "Code Salvage" Rule (Constraint 1):** This is the twist that makes quitting painful. If a team drops out *while another team is still bidding*, **50% of their sunk tokens are transferred to the current highest bidder.**
      *   *Why:* In real life, if you quit a migration, your code often gets cannibalized by the team that takes over. You did the work; they get the credit.
      *   *Effect:* Quitting feels like subsidizing your rival.
  *   **The Public Ledger (Constraint 1):** The whiteboard tracks "Total Invested" per team. It is visible to all.

  #### 2. The Checkpoint Mechanic (Constraint 2)
  At Minute 45, you trigger **"The Architecture Review Board (ARB)."**
  *   **The Rule:** To pass the ARB and remain eligible for the contract, a team **must place a new bid higher than their previous bid.**
  *   **The Trap:** You cannot "hold" your position. To prove "momentum" to management, you must spend *more*. If you do not bid higher, you are marked "Stalled" and eliminated (triggering the Code Salvage Rule).
  *   **Why it fails:** In real life, checkpoints require evidence of progress. In software, "progress" is often conflated with "activity/spend." This mechanic forces escalation to satisfy the checkpoint.

  #### 3. Asymmetric Information (Constraint 3)
  *   **Alpha & Beta Teams:** Receive a sealed envelope marked **"Legacy Docs."** Inside: *"Your team has prior knowledge. Your bids count as 80% of face value. (e.g., A 10-token bid costs you only 8 tokens)."*
  *   **Gamma & Delta Teams:** Receive a sealed envelope marked **"Greenfield."** Inside: *"Standard complexity. Your bids count at 100% face value."*
  *   **Secrecy:** Teams cannot show envelopes. They only see the public bid amounts on the whiteboard.
  *   **Why:** This creates the "Rational Persistence vs. Escalation" distinction. Alpha/Beta can rationally bid higher because their costs are lower. Gamma/Delta will escalate blindly to match them, not knowing they are structurally disadvantaged.

  ---

  ### Part 3: Timeline & Facilitator Scripts

  **Total Time:** 90 Minutes.

  #### 0:00 – 0:10 | Setup & Briefing
  **Action:** Divide into 4 teams. Hand out tokens and sealed envelopes. Draw the Ledger on the whiteboard.
  **Script:**
  > "Welcome. This isn't a game; it's a resource allocation simulation. We're modeling a Platform Migration. There is one Contract available. Value is 400 tokens.
  >
  > Here are the rules:
  > 1. Bids are in increments of 10.
  > 2. Everyone pays their bid, regardless of winning.
  > 3. Winner gets 400 minus their total spend.
  > 4. If you run out of tokens, you can bid on Credit, but interest applies.
  > 5. **Crucial:** If you drop out while others are active, 50% of your sunk cost transfers to the leading team. That represents code salvage.
  >
  > You have 5 minutes to review your private constraints in your envelopes. Do not share them. Begin."

  #### 0:10 – 0:45 | Phase 1: The Honeymoon
  **Action:** Open bidding. Teams confer and submit bids. Update the whiteboard ledger publicly.
  **Facilitator Note:** Keep the pace brisk. "Alpha bids 20. Beta bids 30. Gamma, you're out of the lead. Do you match?"
  **Dynamic:** Early bidding will be rational. They will stop near 100 tokens (the break-even point).
  **Script (if they stall):**
  > "Reminder: The contract includes future maintenance revenue. The 400 token value is conservative. Are you sure you want to cede the platform to another team?"

  #### 0:45 – 0:55 | Phase 2: The ARB Checkpoint
  **Action:** Stop the clock. Stand up. Adopt a "Management" posture.
  **Script:**
  > "Pause. We are at the Q3 Architecture Review Board. I'm seeing variance in velocity. To approve continued funding for Q4, I need to see momentum.
  >
  > **New Directive:** To remain active in this auction, your next bid must be **higher** than your last. If you cannot demonstrate increased investment, we will assume the project is stalled and reassign resources. You have 2 minutes to submit your 'Momentum Bid'."
  **Dynamic:** This forces teams who wanted to stop (at 100 tokens) to bid 110, 120, etc., just to stay in the room. This is where the rational calculation breaks.

  #### 0:55 – 1:15 | Phase 3: The Escalation
  **Action:** Resume bidding. Watch for teams going into Credit (Debt).
  **Facilitator Note:** When a team goes into debt, announce it loudly. "Gamma is now bidding on Credit."
  **Script:**
  > "I see Gamma is leveraging credit to maintain position. Alpha, they are catching up. Do you defend your lead?"
  **Dynamic:** Bids will exceed 200, 300, even 400 tokens. The prize is 400, but they are spending 450 to win it. The "Code Salvage" rule prevents them from quitting because they don't want the other team to get their sunk points.

  #### 1:15 – 1:20 | The Close
  **Action:** When bids slow or time expires, declare the winner.
  **Script:**
  > "Time. Alpha is the winner with a bid of 450.
  > Alpha: You pay 450, get 400. Net: -50.
  > Beta: You bid 440. You pay 440. Get 0. Net: -440.
  > Gamma/Delta: You dropped out. You lose your sunk costs, plus 50% transferred to Alpha.
  >
  > Open your envelopes."

  #### 1:20 – 1:30 | The Debrief (The Most Important Part)
  **Action:** Reveal the asymmetric costs. Map the game to reality.

  ---

  ### Part 4: The Debrief Script & Mapping

  **Step 1: The Reveal (5 Minutes)**
  Ask Alpha/Beta to read their "Legacy Docs" (80% cost). Ask Gamma/Delta to read "Greenfield" (100% cost).
  **Observation:** Gamma/Delta will feel cheated. Alpha/Beta will realize they could have bid even higher.
  **Point:** "In the real world, not all migrations are equal. Some teams have better docs, fewer dependencies. If you don't know your relative position, you cannot calculate rational exit points."

  **Step 2: Mapping Game Moments to Postmortem Claims (10 Minutes)**
  Draw three columns on the whiteboard: **Game Moment**, **What You Said**, **Real World Equivalent**.

  | Game Moment | What You Said (Likely) | Real World Postmortem Claim |
  | :--- | :--- | :--- |
  | **The Checkpoint** | "We have to bid higher to pass ARB." | *"We need one more sprint to show progress to stakeholders."* |
  | **Going into Debt** | "We can afford the interest if we win." | *"We'll refactor the debt after launch."* |
  | **Not Quitting** | "If we quit, they get our code for half price." | *"If we cancel, the other team will just copy our work and ship first."* |
  | **The Win** | "We won, but we lost tokens." | *"The migration shipped, but morale is broken and budget is blown."* |

  **Step 3: The Lesson**
  > "Escalation of Commitment isn't stupidity. It's a rational response to a broken incentive structure.
  > 1. **The Salvage Rule:** We punished quitting more than failing. In our company, do we celebrate 'killing a project early' or do we treat it as a failure?
  > 2. **The Checkpoint:** We required *more spend* to prove *viability*. Do our governance meetings ask for 'what have we learned' or 'how much more do you need'?
  > 3. **The Asymmetry:** You didn't know your costs relative to others. Do we have visibility into other teams' blockers, or do we just compare shipping dates?"

  ---

  ### Part 5: Honest Assessment of Limitations

  **1. What Will Predictably Go Wrong (First Run)**
  *   **Collusion:** Engineers are smart. Two teams might agree privately to stop bidding at 50 tokens to split the prize.
      *   *Fix:* Add a rule: "Team communication is restricted to team members only. Cross-team negotiation results in immediate disqualification." Monitor the room.
  *   **The "Meta-Game" Call:** Someone will shout at Minute 20: "This is a dollar auction! Everyone stop bidding!"
      *   *Fix:* Do not validate the psychology. Respond with: "This is a market simulation. If you stop bidding, you cede market share to competitors who are willing to invest. Is your strategy to lose the platform?" Keep the framing economic, not psychological.
  *   **Token Accounting:** Keeping track of the "50% transfer" rule manually will be messy.
      *   *Fix:* Appoint one person per team as "CFO" to handle token math. You (Facilitator) keep the Master Ledger on the whiteboard.

  **2. What The Game Cannot Reproduce (The Missing Variable)**
  *   **Career Risk:** In the game, losing tokens is annoying. In real life, cancelling a project can get you fired or passed over for promotion. The game lacks *personal* consequence.
  *   **Time Dilation:** Real escalation happens over months, not minutes. The fatigue of "one more sprint" for six months wears down resistance. The game is adrenaline-fueled; real escalation is exhaustion-fueled.

  **3. How You Supply the Missing Variable in Debrief**
  You must explicitly bridge the gap between "Token Loss" and "Career Risk."
  **Script:**
  > "In this room, losing tokens buys you a coffee voucher. In Q4, when we canceled the Auth Migration, no one lost tokens. But three engineers were moved to the maintenance team.
  >
  > The game made you feel the *sunk cost*. I need you to remember that feeling next time you're in a steering committee. When you hear yourself say 'We're too far in to turn back,' I want you to ask: **Am I bidding for the project's success, or am I bidding to protect my own reputation?**
  >
  > If it's the latter, the rational move isn't 'one more sprint.' It's 'stop the auction.'"

  ### Final Facilitator Checklist
  1.  **Print Tokens:** 500+ paper slips per team (or use a digital tracker if preferred, but physical is better for "pain").
  2.  **Prepare Envelopes:** 2 "Legacy Docs", 2 "Greenfield".
  3.  **Whiteboard:** Pre-draw the Ledger columns.
  4.  **Timer:** Visible countdown.
  5.  **Mindset:** You are not a teacher. You are the "Market." Be neutral, slightly demanding, and focused on "momentum."
