          *   15-45: Bidding Round 1 (The Honeymoon).
          *   45-55: The Checkpoint (The Trap).
          *   55-75: Bidding Round 2 (The Escalation).
          *   75-90: Reveal & Debrief.

  4.  **Drafting the Content:**

      *   **Title:** "The Migration Contract."
      *   **Framing:** It's a resource allocation simulation, not a game.
      *   **Rules:** Clear, written on projector.
      *   **Scripts:** Need to sound like a PM/CTO, not a teacher.
      *   **Debrief:** Map "We're almost done" to the bidding increments. Map "Too much to stop" to the Handover Penalty.
      *   **Limitations:** Real life has career risk, not just token loss. Real life has longer time horizons. The game compresses time, removing the "fatigue" factor.

  5.  **Refining the "De-escalation as Loss" Mechanic:**
      *   The prompt asks for *one additional rule* beyond sunk costs.
      *   *Idea:* "The Continuity Bonus." If the project finishes (someone wins), everyone who *stayed in until the end* (even losers) gets a small consolation. If you drop out early, you get nothing. This punishes early exit.
      *   *Better Idea (from prompt suggestion):* "Public Commitment Ledger."
      *   *My Choice:* **"The Code Salvage Rule."** If Team A is winning and Team B drops out, 50% of Team B's spent tokens are transferred to Team A's score (representing Team A reusing Team B's work). Team B gets nothing. This makes quitting feel like gifting your work to a rival. It triggers competitive spite.

  6.  **Refining the Checkpoint:**
      *   Needs to fail.
      *   *Mechanic:* "The Compliance Gate." To pass the gate, you must demonstrate "momentum." Momentum = New Bid > Previous Bid. If you don't bid higher, you are deemed "Stalled" and eliminated (triggering Code Salvage Rule). So to pass the checkpoint, you *must* escalate.

  7.  **Refining Asymmetric Info:**
      *   Team 1 & 2: "Greenfield Advantage" (Bids count as 0.8x cost).
      *   Team 3 & 4: "Legacy Burden" (Bids count as 1.0x cost).
      *   They don't know others have different multipliers.
      *   Debrief: Team 3/4 will feel they played badly. Team 1/2 will feel they played smart. Reality: Structural advantage.

  8.  **Addressing "What will go wrong":**
      *   Engineers might collude (stop bidding). Need to prevent communication between teams.
      *   Someone might call out the game early ("This is a dollar auction!"). Need a script to handle that ("This is a resource sim, focus on the ROI").
      *   Tokens might run out. Need a "Credit Line" rule (allows negative tokens, representing technical debt). *Crucial addition.* If they run out of tokens, they can go into debt. Debt carries interest. This mimics real life "we'll fix the budget later."

  9.  **Final Review against Constraints:**
