prompt: |-
  You are an expert in the design of classroom games and simulations, with deep knowledge of game theory and behavioral economics, and you have a gift for turning abstract dynamics into activities people feel in their wallets before they understand them in their heads. Please think carefully and thoroughly before answering; I'd like you to begin with some brief brainstorming of candidate designs, tell me which one you'd rule out and why, and then develop your chosen design in full.

  Here is my situation. I'm a software engineer, no philosophy or social science background, but I've become the de facto organizer of a quarterly "engineering culture" afternoon at my company. I have 90 minutes and about 24 engineers, in a room with whiteboards and a projector but no budget for real prizes beyond coffee vouchers. I want the session to be about something I've watched destroy quarters of my professional life: escalation of commitment. We start a migration, we discover mid-project that it's failing, and instead of cutting our losses we authorize "one more sprint" — over and over. Everyone nods along to the postmortem every time, and then it happens again. Reading around, I keep hitting the dollar auction — the game where the second-highest bidder also pays and gets nothing, so both leaders keep bidding past the value of the prize — and it strikes me that this is exactly the shape of the trap. But I don't want to just explain it. I want them to fall into it.

  So: design me a runnable activity, built around a dollar-auction-style mechanic, in which the participants are engineers bidding on something plausibly like a real project decision, and the structure itself generates the escalation. I'd like you to consider these specific design constraints, which come from my read of the situation:

  1. Instead of auctioning a dollar for money, auction something like "ownership of the greenfield rewrite" against a stated budget of tokens, with the twist that the losing bidder's spent tokens are also gone — the "costs already sunk" mechanic — and with at least one additional rule I haven't thought of that makes de-escalation genuinely feel like a loss in the moment, not a relief. (I suspect something like a public "commitment ledger" on the whiteboard, where everyone can see how much each team has already sunk, might do work here — but you tell me whether that helps or just accelerates the trap.)

  2. Somewhere in the middle of the session, I want a deliberately staged "checkpoint" — the kind where management formally reviews whether to continue — and I want it designed so that it predictably fails to stop the escalation, the way our real checkpoints do. If you can make the checkpoint itself part of the mechanism rather than a pause in it, even better.

  3. Halfway through, reveal some asymmetric information — for instance, that one team was quietly given better odds from the start — so that the debrief can separate rational persistence (you actually were ahead) from escalation (you were behind and kept bidding anyway). This distinction matters to me and I don't fully trust myself to draw it cleanly, so build the debrief around it.

  For the deliverable: give me the full rules, the token economy, the timeline broken down by minutes, the scripts for the facilitator (me), and a debrief that maps specific moments in the game onto the specific claims people make in real project postmortems — "we're almost done," "we've invested too much to stop now," "the alternative is starting from zero." Then tell me honestly: what will predictably go wrong the first time I run this, and which part of real escalation of commitment no 90-minute game can reproduce — the thing I'll have to supply in the debrief myself — and how I should supply it. Please keep the engineering framing intact throughout; these people will disengage instantly if it smells like a psychology exercise.
