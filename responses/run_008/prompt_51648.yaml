      *   **Key Figures:** Fresnel, Maxwell, Worrall, Poincaré.
      *   **Core Task:** A *disciplined case analysis*, not a survey.
      *   **Specific Requirements:**
          1.  Map the episode onto SR's claim (structure survives, ontology doesn't). Define the "structure" precisely.
