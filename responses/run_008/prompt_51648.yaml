      *   *Check:* Worrall vs. Poincaré. Poincaré said the "true relations" survive. Worrall formalized this. Make sure to credit Poincaré's insight on "relations vs. objects."
      *   *Tone:* Academic, disciplined, critical. Avoid fluff.

