  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Fresnel:* Elastic solid ether, transverse waves. Equations for reflection/refraction (Fresnel coefficients).
      *   *Maxwell:* Electromagnetic field, light as EM wave. No mechanical ether required (though he kept it conceptually for a while).
      *   *Worrall (1989):* "Structural Realism: The Best of Both Worlds?" Uses Poincaré's quote about Fresnel's ether being "true" in relations, false in substance.
      *   *Structural Realism (SR):* Ontic (structure is all there is) vs. Epistemic (we only know structure). Worrall is usually Epistemic.
      *   *The "Structure":* The wave equation, boundary conditions, transverse nature, velocity relations.
      *   *The "Ontology":* Luminiferous ether as an elastic solid vs. Electromagnetic field.
      *   *Tension:* Is the math *really* the same? Or just isomorphic in limit cases? Did Maxwell actually derive Fresnel's equations directly, or did he show consistency?

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Define the episode and Worrall's thesis. State the paper's aim (critical analysis, not just exposition).

      *   **Section 1: Mapping the Episode (The SR Claim):**
          *   *Ontology:* Fresnel's "ether" (mechanical, elastic) $\rightarrow$ Discarded. Maxwell's "field" (electromagnetic state) $\rightarrow$ Retained (mostly).
          *   *Structure:* What survived? The wave equation ($\nabla^2 \psi = \frac{1}{v^2} \frac{\partial^2 \psi}{\partial t^2}$). The boundary conditions at interfaces. The transverse polarization requirement.
          *   *Nuance:* It wasn't a direct derivation. Maxwell showed his theory *accommodated* Fresnel's results. The mathematical form of the *phenomenological laws* survived.
          *   *Does it do work?* Yes, it explains continuity in prediction without committing to the mechanical model.

      *   **Section 2: Comparative Analysis (SR vs. Alternatives):**
          *   *Entity Realism (Hacking/Cartwright):* Focuses on manipulable entities. Did we manipulate the ether? No. Did we manipulate the field? Yes. But Entity Realism struggles with *why* the old equations worked if the entity was wrong. SR explains the *continuity* better.
          *   *Selective Realism (Psillos):* Distinguishes "essential" vs. "idle" parts of theory. Fresnel's ether was essential to *him*, but idle for the *math*. SR is cleaner here; it doesn't need to carve the theory into parts, it just looks at the relations. SR avoids the "how do we know what's essential?" problem pre-successor.

      *   **Section 3: Critiques and Strains (The "Cherry-Picking" Problem):**
          *   *Defining Structure:* Is it just the equations? If so, it's trivial. If it's the causal relations, did those survive? (Ether stress vs. Field tension).
          *   *Interpretive Choice:* We identify the structure *backwards* from Maxwell. Fresnel didn't see "EM structure"; he saw "mechanical vibration." Is SR just retroactive pattern matching?
          *   *Mathematical Form vs. Physical Meaning:* $\nabla \cdot E = 0$ vs. displacement in solid. Same math, different physics. Does SR gloss over this too much?
          *   *Vicker's Critique:* Structure isn't preserved, only *limiting behavior*.

      *   **Section 4: NMA vs. Pessimistic Induction:**
          *   *No-Miracles:* Fresnel's success wasn't a miracle because he got the structure right.
          *   *Pessimistic Induction:* Fresnel's ontology was false. PI says current ontology is likely false. SR splits the difference: Ontology false (PI wins), Success not miraculous (NMA wins on structure).
          *   *Tension:* If structure is all we know, does it count as "real"?

      *   **Conclusion: The Verdict:**
          *   Is it confirmation? It's the *best* case SR has.
          *   Is it redefinition? Maybe. "Structure" is vague.
          *   Is it irrelevant? No, it defines the debate.
          *   *Final take:* It validates SR as a *methodological* stance (look for structural continuity) but doesn't settle the metaphysical debate. It shows SR is a historiography of science as much as a philosophy.

