answer: |-
  # The Fog of the Future: Cluelessness, Decision Theory, and the Limits of Consequentialism

  The central promise of consequentialism is seductive in its clarity: do what produces the best outcome. Yet, this clarity dissolves when faced with the opacity of the future. If the moral worth of an action depends on consequences that ripple indefinitely into time, and if those ripples are fundamentally unknowable, does the theory collapse under the weight of its own epistemic demands? This is the problem of "cluelessness," a debate that has fractured effective altruism and longtermist circles. On one side stands the pessimist, channeling James Lenman, who argues that radical ignorance renders consequentialism practically inert. On the other stands the optimist, invoking G.E. Moore and Hilary Greaves, who suggests that epistemic limitations are manageable or symmetrical.

  Your own intervention in this debate identifies two crucial fault lines: first, whether cluelessness is a general condition of agency that implicates non-consequentialists too; and second, whether the real friction lies not in ethics but in decision theory, specifically regarding imprecise probabilities. Engaging these positions reveals that cluelessness is not a decisive objection to consequentialism as an axiology (a theory of value), but it is a decisive objection to standard *decision-theoretic implementations* of that axiology. The verdict is that consequentialism survives only by retreating from the claim that we can always identify the *single best* act, settling instead for a set of *permissible* acts under conditions of radical uncertainty.

  ### The Pessimist's Challenge: The Indefinite Ripple

  The pessimist's argument rests on the chaotic nature of causal chains. As Lenman argues, the consequences of any act extend indefinitely. Buying a coffee might sustain a barista who later writes a poem that inspires a dictator, or perhaps prevents one. Because the future is sensitive to initial conditions, our epistemic access to the "net good" of an action decays rapidly as the time horizon extends.

  This is particularly damaging for longtermism. If the moral importance of an action is determined by its impact on the deep future, and our ability to predict that future approaches zero, then longtermist consequentialism demands the impossible. It asks agents to maximize a variable they cannot measure. If a moral theory cannot distinguish between right and wrong actions because the relevant data is permanently inaccessible, it fails as a practical guide. The pessimist concludes that we are "clueless," and a theory that demands knowledge we cannot possess is defective.

  ### The Optimist's Defense: Symmetry and Wash-Out

  The optimist counters that the pessimist conflates *uncertainty* with *ignorance*. Following Greaves, she distinguishes between "simple" and "complex" cluelessness. In simple cluelessness, we lack evidence about the direction of side effects, but we have no reason to think they skew positive or negative. Here, symmetry considerations apply: the unknown good effects and unknown bad effects arguably "wash out," allowing us to focus on the known, immediate consequences.

  In complex cluelessness, we have specific reasons to think an action has opposing long-term effects (e.g., speeding up AI development might solve disease but also increase extinction risk). The optimist argues that even here, we are not utterly blind. We can assign probabilities to these outcomes and calculate expected value. Furthermore, she contends that this epistemic burden is not unique to consequentialism. Any moral theory that cares about the world at all must contend with the fact that we cannot fully trace the implications of our choices.

  ### Is Cluelessness a General Condition of Agency?

  Your first hypothesis suggests that the optimist is right to claim that "everyone is clueless," implying that this is a general feature of agency rather than a specific tax on consequentialism. There is merit to this. A rule-deontologist who follows the rule "Do not lie" might argue they are immune to cluelessness. However, most plausible deontological systems include exception clauses or competing duties (e.g., "Do not lie, unless it saves a life"). To know if the exception applies, the deontologist must trace consequences. If a lie saves a life today but triggers a war in ten years, does the rule still hold? If the deontologist cannot trace the causal chain, they too are clueless about whether their action violates the spirit of their moral law.

  However, your intuition that the "everyone's clueless" move is too quick is also correct. Consequentialism is uniquely vulnerable because it makes consequences the *sole* determinant of rightness. For the deontologist, consequences are often constraints or tie-breakers; for the consequentialist, they are the entire game. If the deontologist is clueless, they might default to the rule ("I didn't lie, so I'm safe"). If the consequentialist is clueless, they have no default. The comparison among acts—the engine of consequentialist deliberation—becomes impossible if the values of the options are unknown. Therefore, while epistemic limitation is a general human condition, it is a *structural* crisis for consequentialism in a way it is not for rule-based systems. The pessimist is right that consequentialism bears a heavier burden here.

  ### The Decision-Theoretic Reframing

  This brings us to your second hypothesis: that the disagreement is actually about decision theory, specifically whether rational choice requires sharp probabilities. This is the key to dissolving the stalemate.

  Standard Expected Utility Theory (EUT), which underpins most modern consequentialism, requires agents to assign a precise probability to every outcome. If I cannot assign a precise probability to "AI extinction," standard EUT says I cannot calculate the expected value. The pessimist sees this as a failure of the theory; the optimist tries to force a number where none exists.

  Both are operating under the assumption that rationality requires *sharp* credences. But if we adopt a framework of **Imprecise Probabilities**, the landscape changes. In this model, an agent's belief state is represented not by a single number (e.g., 5% risk) but by a set of probability functions (e.g., risk is between 1% and 20%).

  This reframing saves consequentialism from the charge of incoherence. Under imprecise probabilities, we may not be able to say that Act A is *better* than Act B (because their expected value intervals overlap). However, we can often say that Act A is *permissible* and Act C is *impermissible* (because C's interval is strictly lower). This preserves the action-guiding nature of the theory without demanding impossible precision. It concedes to the pessimist that we often cannot identify the *optimal* act, but it agrees with the optimist that we can still rule out *disastrous* acts.

  ### The Verdict: A Conditional Survival

  So, is cluelessness a decisive objection to consequentialism? The answer depends on which version of the theory is on the table.

  Cluelessness is a **decisive objection to Actual Consequentialism** (the view that rightness depends on what *actually* happens). Since we cannot know the actual future, this theory can never be used to guide action. It is also a **decisive objection to Sharp-Probability Expected Consequentialism** in domains of complex cluelessness (like longtermism). In these cases, the demand for precise probabilities forces agents to manufacture confidence they do not possess, leading to the "false precision" that fuels the pessimist's critique.

  However, cluelessness is **not a decisive objection to Imprecise Expected Consequentialism**. This version of the theory accepts the pessimist's epistemic premise—that we face indefinite ripples and unquantifiable risks—but rejects the inference that we must therefore remain silent. By shifting the normative question from "Which act is best?" to "Which acts are rationally permissible given our imprecise evidence?", the theory remains action-guiding without being delusional.

  This leads to a humbling conclusion for your reading group. Your second friend is right that cluelessness does not destroy consequentialism *in principle*, but she is wrong to think symmetry arguments easily resolve longtermist cases. Complex cluelessness in longtermism often results in such wide probability intervals that *no* clear ranking is possible. Your first friend is right that we are clueless about the "best" act, but wrong to think this paralyzes all moral reasoning.

  Ultimately, the dispute is indeed a proxy fight about decision theory. If you insist on sharp probabilities, the pessimist wins: consequentialism becomes a lottery ticket based on guesswork. If you accept imprecise probabilities, the optimist wins: consequentialism survives as a robust framework for ruling out catastrophe, even if it cannot promise utopia. The most defensible position is to adopt the latter. Cluelessness does not kill consequentialism, but it forces it to grow up. It must abandon the ambition of being a calculator of the optimal future and accept the role of a guardian against the intolerable one. In doing so, it acknowledges that while we cannot see the end of the ripple, we can still judge the stone we throw.
