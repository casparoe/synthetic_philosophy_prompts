answer: |-
  Here is the specification for a theory of Dirty Hands, derived from the constraints of the problem itself rather than allegiance to a specific moral framework.

  ### The Spec: Desiderata for a Theory of Dirty Hands

  **1. The Paradox Constraint (Non-Negotiable)**
  The theory must preserve the tension that the act is *simultaneously* politically obligatory and morally prohibited. It cannot dissolve the paradox by redefining "wrong" to mean "suboptimal" or "obligatory" to mean "permissible."
  *   **Motivation:** If you define the act as simply "the right thing to do," you have standard utilitarianism, not dirty hands. If you define it as "a crime," you have tyranny. The phenomenon exists specifically in the overlap where a leader *must* violate a norm to uphold the conditions that make norms possible.
  *   **Case:** The Public Health Official. If understating the risk is "right," she should feel no remorse. If it is "wrong," she should not do it. Dirty Hands demands she *must* do it, and *should* feel remorse.

  **2. The Differentiation Constraint (Non-Negotiable)**
  The theory must distinguish Dirty Hands from (a) Tragedy, (b) Routine Tradeoffs, and (c) Rationalization.
  *   **(a) vs. Tragedy:** In tragedy (e.g., Sophie's Choice), there is no morally clean option, but usually no *obligation* to choose the specific evil over the other. In Dirty Hands, there is a specific obligation to commit the violation.
  *   **(b) vs. Tradeoffs:** Budgeting is a tradeoff (funding parks vs. roads). Dirty Hands involves violating a side-constraint (rights, truth-telling), not just weighing goods.
  *   **(c) vs. Rationalization:** This is the strongest filter. The theory must provide an epistemic check against the "necessity" claim.
  *   **Motivation:** Without this, every strongman is a Dirty Hands saint. The theory must explain why the City Engineer diverting funds to the failing bridge is a Dirty Hands case, but diverting funds to his brother's company is not, even if both are justified by "infrastructure stability."
  *   **Status:** Non-Negotiable. Without this, the concept is useless for political judgment.

  **3. The Residue Requirement (Camp Preference / Debatable)**
  The theory must account for the "moral residue" (guilt, need for penance, public acknowledgment) without treating it as a mere psychological glitch. It must explain whether this residue is a bug (irrational squeamishness) or a feature (necessary moral accounting).
  *   **Motivation:** You suggested this is universal; I argue it is the primary fracture line. If the act was truly the "all-things-considered best," guilt is irrational noise. If guilt is rational, the act was not fully "best." A theory must pick a lane: either the guilt is the price of doing business (Walzer), or the guilt is a vestigial emotion we should educate away (Consequentialist).
  *   **Status:** Camp Preference. Consequentialists will reject the necessity of residue. Deontologists will demand it. A theory can be adequate without it *if* it explains why the residue disappears.

  **4. The Role Morality Condition (Non-Negotiable)**
  The theory must explain why the *office* licenses the act when the *person* cannot. It cannot simply be that "leaders have different morals." It must be that the *responsibilities* of the office alter the moral calculus.
  *   **Motivation:** If a private citizen lies to prevent panic, we call it fraud. If the Health Official does it, we call it stewardship. The theory must locate the normative shift in the institution, not the individual's soul.
  *   **Case:** The City Engineer. A private engineer hiding inspection data is negligent manslaughter. A Chief Engineer doing it to prevent city-wide bankruptcy and bridge abandonment might be Dirty Hands. The difference is the fiduciary scope.

  **5. The Successor Test (Non-Negotiable)**
  The theory must handle the "Clean Hands" objection: If I resign to keep my hands clean, and a crueler successor takes the job and does the dirty act *plus* extra evil, did my resignation help?
  *   **Motivation:** This tests whether the theory is self-indulgent. If the theory validates resignation in the face of necessity, it privileges the leader's soul over the populace's safety. An adequate theory must weigh the "contamination" of the leader against the "protection" of the led.
  *   **Status:** Non-Negotiable. Any theory that allows a leader to prioritize their own moral purity over the prevention of catastrophe fails the basic job description of leadership.

  ***

  ### The Joint Satisfiability Problem

  Here is the hard truth you asked for: **These desiderata are likely jointly unsatisfiable within a monistic moral ontology.**

  You cannot consistently hold that:
  1.  Act X is morally wrong (violates a binding norm).
  2.  Act X is all-things-considered obligatory (you ought to do it).
  3.  The agent is rational (not suffering from false guilt).

  In standard logic, "Ought implies Can," and "Ought implies Permissible." If you *ought* to do it, it is not *wrong*. To satisfy the spec, you must accept a fragmented morality: one system for the person (don't kill/lie) and one for the office (protect the state).

  If you demand a unified moral field, you must cut one desideratum.
  *   Cut #1 (Wrongness)? You become a Consequentialist.
  *   Cut #2 (Obligation)? You become a Pacifist/Absolutist (and fail the Successor Test).
  *   Cut #3 (Rationality)? You accept that leaders must live with necessary neuroses.

  **Verdict:** The spec is satisfiable *only* if you accept moral fragmentation (e.g., "Political Morality" vs. "Personal Morality") as a real feature of the universe, not just a heuristic. If you believe morality is singular, the spec is impossible.

  ***

  ### Contender Scorecard

  | Criterion | Walzerian (Necessary Evil) | Consequentialist (Shut Up & Multiply) | Role/Institutional (Office as Shield) |
  | :--- | :--- | :--- | :--- |
  | **Paradox** | **Pass.** Embraces the contradiction. Act is wrong, but done for the community. | **Fail.** Dissolves the paradox. If it maximizes good, it is right. Period. | **Pass.** The paradox lies between the *role* and the *person*, not the act itself. |
  | **Differentiation** | **Weak.** Relies on leader's character to distinguish from rationalization. Hard to verify. | **Strong.** Clear metric (outcomes). But risks justifying too much if calculus is skewed. | **Strong.** Bounded by the specific mandate of the office. Engineer can't lie about taxes. |
  | **Residue** | **Pass.** Guilt is the proof of goodness. Penance is required to rejoin the community. | **Fail.** Residue is irrational squeamishness. Should be outgrown. | **Mixed.** Residue belongs to the *office*, not the person. Person resigns/rotates to clear it. |
  | **Role Morality** | **Pass.** Explicitly about political leadership vs. private life. | **Fail.** Morality is universal. Office changes incentives, not duties. | **Pass.** The office *is* the moral agent. The person is just the temporary hand. |
  | **Successor** | **Pass.** Implies staying is harder (bearing guilt) than leaving. | **Pass.** Obviously stay if you do it better/cleaner. | **Risk.** Can lead to "I was just following the office script" abdication. |

  ***

  ### Confidence and Uncertainty

  **Confidence in Load-Bearing Claims:** High (85%+).
  The logical tension between "obligatory" and "wrong" is a structural feature of deontic logic, not just a philosophical quibble. The distinction between tragedy and dirty hands is also robust in the literature and practice.

  **Least Sure Point:** **The Residue Requirement.**
  I am flagging this because I may be conceding too much to the "tragic" intuition. It is possible that the demand for penance is not a moral necessity but a *social technology*—a way for the community to signal that the norm still holds even if it was violated. If residue is purely performative (a ritual to reassure the public) rather than constitutive (a real moral debt), then the Consequentialist can accept it pragmatically without admitting moral wrongness. If that is true, the "Paradox Constraint" softens: the act isn't *ontologically* wrong, but it must be *socially treated* as wrong to maintain norm stability. I am less certain whether this pragmatic workaround saves the theory or just kicks the can down the road.

  **Summary:** If you want a theory that keeps the "dirt" real, you must pay the metaphysical price of a fragmented morality. If you want a unified morality, you must admit that "Dirty Hands" is just a name for "Utilitarianism with extra steps and guilt rituals."
