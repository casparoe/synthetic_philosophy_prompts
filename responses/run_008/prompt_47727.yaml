      *   *The Continuity Thesis:* How to defend it? Focus on Chapter 26 of ToP ("The Application of Probability to Argument"). This is where he discusses non-numerical probabilities and incomparability. Focus on the "weight of evidence" distinction (probability vs. weight). If probability is $P$ and weight is $W$, GT uncertainty is just the case where $W$ is vanishingly small, making $P$ practically useless for decision making, even if $P$ exists logically.
      *   *Potential Pitfalls:* Did Keynes explicitly reject logical probability in the 1930s? He did write a review of Ramsey where he conceded some points. He did call the ToP a "failure" in later correspondence. I need to address these without letting them destroy the continuity argument. The key is distinguishing between the *formal machinery* (which he might have thought was incomplete) and the *ontological commitment* to uncertainty arising from lack of evidence.
