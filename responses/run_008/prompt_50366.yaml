answer: |-
  ### Desiderata for an Everettian Account of Probability

  To evaluate whether the Everettian interpretation (EQM) can legitimately recover the Born rule, we must first specify what success looks like. The following six desiderata constitute the evaluation standard. They are designed to test whether a proposal merely *labels* branch weights as probabilities or actually *justifies* the probabilistic norms of quantum practice within a deterministic, branching ontology.

  #### 1. Ontological Specification
  **Requirement:** The account must explicitly categorize the nature of the probability being derived. It must state whether the Born weight constitutes an objective chance (a physical propensity), a subjective credence (a rational degree of belief), a measure of existence, or a distinct fourth category.
  **Motivation:** In collapse theories, probability is typically treated as objective chance (the chance that a specific outcome *exclusively* occurs). In EQM, since all outcomes occur, the ontological category cannot be identical to the standard case without modification. Ambiguity here allows proposals to equivocate between physical measure and rational belief.
  **Status:** **Non-negotiable.** An account that does not specify what kind of thing probability is cannot be assessed for coherence.

  #### 2. Incoherence Resolution
  **Requirement:** The account must explain how probability assignments are meaningful given that the agent knows with certainty that every possible outcome will actualize on some branch. It must resolve the tension between "I know $X$ will happen" and "I assign probability $p < 1$ to $X$."
  **Motivation:** This is the core "Incoherence Problem." Standard justifications for probability rely on ignorance of which outcome will occur *simpliciter*. In EQM, there is no ignorance about the set of outcomes, only potentially about self-location. If this is not addressed, probability collapses to certainty (1) for all outcomes.
  **Status:** **Non-negotiable.** Failure here renders the concept of probability vacuous in the Everettian context.

  #### 3. Measure Stability (No Branch Counting)
  **Requirement:** The derivation of probabilities must be invariant under changes to the basis or the granularity of branching. It cannot rely on counting discrete branches, as branching is continuous and dependent on the decoherence basis, which is only approximately defined.
  **Motivation:** If probabilities depended on the number of branches, one could manipulate probabilities by refining the basis decomposition (e.g., splitting a low-weight branch into many high-weight sub-branches). The account must tie probability to the Hilbert space norm (amplitude squared) rather than branch cardinality.
  **Status:** **Non-negotiable.** This is a mathematical constraint imposed by the formalism of quantum mechanics itself.

  #### 4. Single-Case Normativity
  **Requirement:** The account must justify rational action (e.g., betting behavior) for a single measurement event, not merely in the limit of infinite repetitions. It must explain why an agent should prefer a bet with high Born weight over one with low Born weight, even though both pay out on some successor branch.
  **Motivation:** Scientific practice and daily life involve single-case decisions. An account that only recovers the Born rule as a long-run frequency fails to guide the agent *before* the measurement. Decision-theoretic approaches target this specifically; accounts relying solely on frequentism fail it.
  **Status:** **Non-negotiable.** A probability rule that cannot guide action in the present is pragmatically useless.

  #### 5. Phenomenological Recovery
  **Requirement:** The account must recover the ordinary pre-theoretic talk of chance and uncertainty sufficiently that experimental reports (e.g., "there was a 50% chance of spin up") are not rendered systematically false or radically reinterpretated.
  **Motivation:** If EQM requires us to say "I was uncertain" when we were actually certain of the wavefunction, or "there was a chance" when the outcome was determined, it risks an error theory of quantum practice. The account should save the phenomena of scientific discourse, not eliminate them.
  **Status:** **Substantive/Waivable.** One could argue that ordinary talk is folk physics that needs revision. However, waiving this comes at a high dialectical cost, as it concedes that EQM changes the meaning of probability rather than recovering it.

  #### 6. Empirical Safety Net (Maverick Accommodation)
  **Requirement:** The account must explain why the existence of observers on low-weight branches who record statistics violating the Born rule does not falsify the theory or undermine the rationality of high-weight agents.
  **Motivation:** EQM predicts the existence of "maverick" branches where frequencies diverge wildly from Born weights (e.g., a million heads in a row). The account must clarify why these observers are "unlikely" (in the relevant sense) without appealing to their non-existence (since they do exist).
  **Status:** **Non-negotiable.** Without this, EQM is empirically unstable, as it predicts observers who should, by all rights, reject the theory that predicts them.

  ***

  ### Structural Tensions and Eliminative Power

  **The Primary Tension: Incoherence Resolution vs. Single-Case Normativity**
  There is a significant tension between **Desideratum 2 (Incoherence Resolution)** and **Desideratum 4 (Single-Case Normativity)**.
  *   To resolve the incoherence problem, many accounts (e.g., self-locating uncertainty) introduce a form of ignorance: "I don't know which successor I will be."
  *   However, to satisfy single-case normativity via decision theory (e.g., Deutsch-Wallace), one often needs to argue that the agent should care about all successors weighted by amplitude, effectively treating the future as a deterministic distribution of goods rather than a locus of uncertainty.
  *   **The Conflict:** If I am truly uncertain about which branch I will be on (satisfying #2), it is unclear why I should maximize expected utility across *all* branches (satisfying #4). Conversely, if I am maximizing utility across all branches because they are all "me," it is unclear what sense of *uncertainty* remains to ground the probability claim. Balancing subjective ignorance with objective determinism is the tightrope walk of EQM probability.

  **The Most Eliminative Requirement: Incoherence Resolution (#2)**
  This is the single requirement that eliminates the most candidate accounts.
  *   **Naive Frequentism** fails immediately because frequencies exist on all branches.
  *   **Naive Subjectivism** fails because there is no standard ignorance of the outcome.
  *   **Branch Counting** fails because it cannot resolve *why* certainty of all outcomes yields non-trivial probabilities without arbitrary weighting.
  *   Any proposal that does not explicitly tackle the "certainty of all outcomes" paradox is dead on arrival. It forces the proponent to choose between modifying the concept of probability, modifying the concept of personal identity, or modifying the concept of uncertainty.

  ***

  ### Critique of the Desiderata List

  **One Thing the List Gets Wrong:**
  The list presupposes **Conceptual Conservatism**. By including **Phenomenological Recovery (#5)** and demanding that ordinary talk be "recovered rather than reinterpreted beyond recognition," the list biases the evaluation against revolutionary accounts that argue the pre-Everettian concept of probability was *always* incoherent or mistaken.
  A hardline Everettian might argue that we should not be trying to save the old notion of "chance" (which implies exclusive outcomes) but rather replace it with "caring measure" or "branch weight." By setting "recovery of ordinary talk" as a desideratum, the list potentially penalizes the most ontologically honest solution: admitting that EQM does not have "probability" in the classical sense, but has a functional analog that does the same work. The seminar should push back on whether "saving the phenomena" of language is a valid constraint on fundamental ontology, or whether we should simply accept that EQM changes the meaning of probability and judge it solely on whether the new meaning supports the same decision-theoretic norms.
