      *   *Q1 (Vagueness):* Addresses the "sharp line" objection.
      *   *Q2 (Agency/Infliction):* Addresses the "negative utilitarianism implies destroying the world" objection.
      *   *Problem Area:* Risk/Uncertainty.

  3.  **Brainstorming Defeaters & Objections:**

      *   *Fatal Defeaters:*
          *   **The Risk Collapse:** If I accept expected utility theory (EUT), lexical priorities break down unless probabilities are zero. If $P > 0$, then $P \times \infty$ (or lexical value) dominates. But if I reject EUT, I face Allais Paradox-type irrationality or paralysis.
          *   **The "Infliction" Loophole (Moral Luck):** If natural suffering doesn't count lexically, but inflicted does, then *preventing* natural suffering becomes secondary to *not inflicting*. But what about negligent suffering? Is it "natural" if I could have prevented it? This creates a perverse incentive structure (doxastic asymmetry).
          *   **Intransitivity/Representation:** Lexical orderings often violate continuity axioms required for standard utility representation. With vagueness, you get non-transitivity (A > B, B > C, but A not > C).

      *   *Serious Defeaters:*
