      *   *Correction on Infliction:* The user says "deliberately inflicted." This sounds like a constraint. But if the view is *consequentialist*, why does the *source* matter? This is a major tension. I need to highlight that this moves the view toward Rule Consequentialism or Hybrid Theory.
