  2. The fact that all camps produce identical cause rankings despite radically different mechanistic explanations suggests the framework is functioning as a shared language for intuitions rather than a distinct calculation engine. Camp one's insistence that weird numbers indicate input error rather than formula error confirms they view the rubric as ontologically primary, while the others view it as derivative.

  3. However, the second camp's claim that neglectedness is merely diminishing marginal returns posits a substantive economic structure that could diverge from simple multiplication in non-linear scenarios. If the true cost-effectiveness curve differs significantly from the ITN product, the disagreement becomes practically consequential for marginal grantmaking decisions.

  4. The hidden empirical question is the actual shape of the marginal returns curve for specific cause areas, specifically whether additional funding yields logarithmic, linear, or step-function impacts. Resolving whether neglectedness is an independent variable or a proxy for saturation requires data on how past funding shifts have altered outcomes.

  5. Progress requires abandoning the search for a universal formula and instead treating ITN as a communication checklist while reserving actual allocation decisions for explicit cost-effectiveness models. You should test your individuation hypothesis by attempting to score specific interventions rather than broad causes to see if the ranking variance actually increases.
