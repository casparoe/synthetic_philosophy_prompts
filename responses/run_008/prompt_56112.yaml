answer: |-
  Here is a definite diagnosis for your Extended Essay.

  **Diagnosis:** You are correct. The impasse is not empirical, nor is it primarily textual. It is **meta-ethical**. The debate stalls because the Situationists and the Virtue Ethicists are making different kinds of claims about the ontological status of "character."

  The Situationists (Doris, Harman) treat character traits as **scientific hypotheses** intended to causally predict behavior across diverse contexts. The Virtue Ethicists (Aristotle and his defenders) treat character traits as **normative ideals** intended to evaluate and guide moral development.

  The debate should be dissolved, not won. The Situationists have successfully proven that *global character traits do not exist as descriptive generalizations of the average human population*. The Virtue Ethicists should concede this point without flinching, because Aristotle never claimed they did. The conflict arises only when Virtue Ethicists attempt to defend the *empirical prevalence* of virtue rather than its *normative necessity* and *psychological possibility*.

  Here is the breakdown of why this is the case, what the texts commit each side to, and what counts as progress for your essay.

  ### 1. The Commitment of the Situationists (The Category Error)
  John Doris (*Lack of Character*) and Gilbert Harman explicitly frame their critique as an empirical falsification of a psychological theory. They commit themselves to the claim that for virtue ethics to be true, the "traits" it posits must function as **robust causal explanatory constructs**.

  *   **Their Words:** Doris argues that if virtues were real, they would demonstrate "cross-situational consistency." He treats the Aristotelian *virtue* as equivalent to a personality psychology "trait" (like the Big Five).
  *   **The Error:** They assume that because the *average* person fails the Milgram experiment or the Princeton Seminary study, the *concept* of a virtue is scientifically invalid. They move from "People generally do not have these traits" to "People cannot have these traits" or "The theory requiring these traits is false."
  *   **Why this stalls the debate:** They are attacking a descriptive claim ("Humans are consistent") that sophisticated virtue ethicists do not actually hold. They are fighting a straw man of "Naive Virtue Theory."

  ### 2. The Commitment of the Virtue Ethicists (The Normative Shield)
  Aristotle's text commits him to a normative ideal, not a statistical average.

  *   **Aristotle's Words:** In the *Nicomachean Ethics*, Aristotle explicitly states that the *phronimos* (the person of practical wisdom) is rare. He acknowledges that many people are incontinent (*akratic*) or vicious. He does not claim that virtue is the default state of humanity; he claims it is the *telos* (end goal) of human development.
  *   **The Defense:** When defenders argue that "global virtues are rare but possible," they are actually conceding the empirical point to save the normative theory. However, when they try to argue that the experiments are flawed or that consistency *does* exist in some data, they step into the Situationists' trap. They accept the Situationist's terms (that VE is an empirical theory) rather than correcting the terms.
  *   **The Real Commitment:** Virtue Ethics only requires that human psychology is *capable* of integration and consistency through habituation, not that it *currently displays* it.

  ### 3. Why the Rival Hypothesis (Hidden Empirical Question) is a Trap
  You mentioned a rival diagnosis: that there is a hidden empirical question about consistency that psychology can't yet settle. **Reject this.**

  Social psychology has already settled the matter for the general population: behavior is highly situation-dependent. Waiting for new studies to show "more consistency" is a losing strategy for the Virtue Ethicist. If your essay argues that "future psychology might prove Aristotle right," you are grounding a normative ethical theory on shaky, contingent scientific data. If psychology changes its mind in 20 years, your ethical theory collapses.

  Virtue Ethics must be robust enough to survive even if the Situationist data is 100% accurate regarding the general population. Therefore, the debate cannot be resolved by more data. It must be resolved by clarifying the *logical relationship* between the data and the theory.

  ### 4. Concrete Progress: What Your Essay Should Argue
  To move past the wall you've hit, your essay should propose a **redefinition of the empirical commitment**.

  **The Argument:**
  Virtue Ethics makes a *minimal* empirical commitment, not a *maximal* one.
  *   **Maximal Commitment (False):** "Humans naturally possess global traits." (Situationists refute this).
  *   **Minimal Commitment (Defensible):** "Human psychology is plastic enough that, under specific conditions of education and habituation, cross-situational consistency is *achievable*."

  **What Counts as Progress:**
  Progress is not a new experiment. It is a **conceptual distinction** between *possession* and *capacity*.
  1.  **Concede:** Admit that Situationist experiments prove most people lack global virtues.
  2.  **Pivot:** Argue that this refutes only a *descriptive* theory of human nature, not a *normative* theory of moral development.
  3.  **Resolve:** The debate dissolves if Virtue Ethicists stop claiming virtues are common and start claiming they are *cultivated*. The Situationist data describes the *untrained* mind; Virtue Ethics prescribes the *trained* mind.

  **Concrete Example for the Essay:**
  Use the analogy of physical fitness.
  *   **Situationist:** "I tested 1,000 random people, and none of them could deadlift 300kg. Therefore, 'elite athlete' is a myth."
  *   **Virtue Ethicist:** "Elite athletes are rare. They require specific training. The fact that random people can't do it doesn't mean the capacity isn't humanly possible."
  *   **Resolution:** The disagreement vanishes once we agree we are talking about *potential* vs. *actuality*.

  ### 5. Where Your Reading of Aristotle is Contestable (The Risk)
  To ensure your EE is critical and not one-sided, you must flag where this diagnosis risks misreading Aristotle.

  **The Vulnerability:**
  Aristotle *does* make some empirical claims about habituation. He believes that by doing just acts, we *become* just. He assumes a psychological mechanism where repeated action solidifies into character.
  *   **The Threat:** If Situationist psychology is taken to its extreme (e.g., if human cognition is *fragmented* such that no amount of habituation can create cross-situational consistency), then Aristotle's *mechanism* is empirically false, even if his *ideal* is coherent.
  *   **The Nuance:** You must acknowledge that while the *ideal* is safe from Situationism, the *pedagogy* (how we get there) is vulnerable. If situationism proves that "character" is never stable, even in experts, then Aristotle's account of *how* virtue works is empirically undermined, even if the goal remains valid.

  **How to handle this:**
  Argue that current Situationist data targets *ordinary* agents, not *experts* (the *phronimos*). There is evidence that experts (e.g., veteran firefighters, master chess players) *do* show consistency in their domain. The Virtue Ethicist can argue that the *phronimos* is a moral expert. The empirical burden shifts from "Do normal people have virtues?" to "Can moral experts be cultivated?" This is an open empirical question, but it saves the theory from immediate falsification.

  ### Summary Position for Your Essay
  1.  **Thesis:** The Situationist Critique fails because it mistakes a normative ideal for a descriptive generalization.
  2.  **Support:** Situationists attack the prevalence of traits; Aristotle only promises their possibility.
  3.  **Resolution:** The debate is dissolved by distinguishing between the *psychology of the average agent* (situation-determined) and the *psychology of the cultivated agent* (potentially consistent).
  4.  **Limit:** Acknowledge that if psychology proves *no* human can achieve integration, the theory fails, but current data does not show this.

  This approach allows you to take a definitive stand (supporting your hypothesis), utilize the literature you've read, and offer a philosophical resolution rather than just summarizing the stalemate. It shows the examiner you understand the *structure* of the argument, not just the content.
