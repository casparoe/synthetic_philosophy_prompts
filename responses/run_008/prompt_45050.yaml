prompt: |-
  I direct the clinical ethics consultation service at a large academic medical center, and a substantial share of my consults — several a month, arriving with hours to spare, families in crisis, clinicians wanting an answer rather than a seminar — turn on the same underlying question: what makes a person dead, and who gets to say so. Our institution follows the whole-brain standard under the model statute dating from the early 1980s, but my clinicians keep colliding with its philosophical fine print, and I need something more usable than "call ethics."

  The recurring collisions are these. First, families — often, though not always, on Orthodox Jewish or certain conservative Christian grounds — who hold that death is a cardiopulmonary event and cannot accept that a warm, pink, perfusing body with a beating heart is a dead person. Second, donation-after-circulatory-death cases, where death is declared minutes after the heart stops, which quietly trades on the gap between irreversibility (the heart cannot restart) and permanence (it will not restart because no one will attempt to restart it). Third, the kind of case the chronic-brain-death literature presses: patients maintained for months, and in a handful of documented cases longer, gestating a fetus, healing wounds, mounting fevers in response to infection — which makes it awkward to tell a bedside nurse that this is merely a corpse with artificially circulating blood.

  That last point deserves emphasis. The standard rationale for equating whole-brain death with death is that the brain integrates the body into a single organism, so that the destruction of the entire brain marks the loss of the organism as a whole. The well-known critique of this rationale, associated with the neurologist D. Alan Shewmon, argues that the somatic integration visible in these long-maintained patients persists without the brain, through non-neural routes; you need not accept his conclusion to notice that our staff notice the tension.

  Please write me a decision procedure my service can run repeatedly under real constraints. Specifically:

  - The questions to ask, in order, and what counts as a sufficient answer to each — enough to distinguish, at the bedside, a factual dispute (is the standard met? is the test valid?) from a conceptual one (is the standard the right one?) from a purely values question (what should be done given the determination?);
  - Where the procedure yields a determinate stop and hands the decision to a person, and it must be honest about which of its steps are judgment dressed up as procedure;
  - What it cannot settle and should not pretend to settle.

  Then run it on three consults: (a) a family citing religious law rejects the brain-death determination for their thirty-year-old son and demands that ventilation continue indefinitely; (b) a patient declared brain dead at twenty-two weeks' gestation, whose partner and parents all want somatic support continued toward fetal viability — a request the OB service is willing to honor, and which several of our ICU nurses find morally incoherent if she is already dead; (c) a surrogate authorizing donation after circulatory death who asks, in effect, how long we wait before calling it, and whether being sure enough means the heart could not restart or merely that no one will try.

  Include at least one case where the procedure delivers an answer I will not like, and say so plainly. And I do not need a reading list or case law survey — I need something that works at the bedside, reasoned from what is above.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Director of Clinical Ethics Consultation Service at a large academic medical center.
      *   **Problem:** Recurring ethics consults regarding the definition of death (Whole-Brain Standard vs. Cardiopulmonary vs. Higher-Brain vs. Religious objections).
      *   **Specific Tensions:**
          1.  Religious objections (Orthodox Jewish/Conservative Christian) to brain death (body looks alive).
          2.  Donation after Circulatory Death (DCD) nuances (irreversibility vs. permanence).
          3.  Chronic brain death (somatic integration persists without brain, e.g., pregnant patients, healing wounds).
      *   **Task:** Create a *decision procedure* (algorithm/flowchart style but textual) for the ethics service to use at the bedside.
      *   **Requirements:**
          *   Questions in order.
          *   Criteria for sufficient answers.
          *   Distinguish factual vs. conceptual vs. values disputes.
          *   Identify where judgment is disguised as procedure.
          *   Identify what it *cannot* settle.
          *   Run the procedure on three specific cases (Religious objection, Pregnant brain-dead patient, DCD surrogate query).
          *   Include at least one case where the procedure yields an answer the Director won't like (honesty constraint).
          *   No reading lists or case law surveys. Practical bedside tool.

  2.  **Deconstruct the Underlying Ethical/Legal Landscape:**
      *   **Legal Standard:** Uniform Determination of Death Act (UDDA) - Whole Brain Death (WBD) or Cardiopulmonary (CP) death. This is the law in most US jurisdictions.
      *   **Clinical Reality:** WBD patients often exhibit somatic integration (Shewmon's critique). DCD relies on "permanence" not just "irreversibility."
      *   **Ethical Role:** Ethics consultants don't make medical diagnoses, nor do they override law. They facilitate resolution, clarify values, and ensure process integrity.
      *   **The "Hard" Problem:** The definition of death is not purely biological; it's a philosophical line drawn over biology. The procedure must acknowledge this without collapsing into relativism.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Triage the conflict. Is this a medical error? A legal violation? A values conflict?
      *   *Step 1: Medical/Legal Compliance.* Is the standard actually met according to hospital policy and law? (Factual).
      *   *Step 2: The Nature of the Objection.* Is the family disputing the *test* or the *concept*? (Conceptual).
      *   *Step 3: Accommodation vs. Obligation.* Can we accommodate without violating law/harm? (Values/Policy).
      *   *Step 4: Resolution/Exit.* Who decides?
      *   *Constraint Check:* Must admit where judgment is masked. Must admit what it can't solve.

  4.  **Refining the Steps (Iterative Process):**
      *   *Critique:* A simple flowchart might be too rigid. It needs to be a "questionnaire for the consultant."
      *   *Adjustment:* Make it a "Diagnostic Triage for Death Determination Conflicts."
      *   *Key Distinction:* Separate "Is the patient dead?" (Medical/Legal) from "Must we act as if they are dead?" (Ethical/Policy).
      *   *Honesty Clause:* I need to explicitly state that the procedure relies on the institution's willingness to tolerate legal risk or moral distress.

  5.  **Developing the Case Applications:**

      *   **Case A (Religious Objection to WBD):**
          *   *Standard:* WBD met.
          *   *Objection:* Conceptual/Religious.
          *   *Procedure Output:* Legally dead, but accommodation *may* be permissible if resources allow and no harm to others.
          *   *Unpleasant Truth:* The procedure might suggest continuing treatment on a "corpse" to avoid litigation/distress, which undermines the definition of death.

      *   **Case B (Pregnant WBD Patient):**
          *   *Standard:* WBD met.
          *   *Request:* Continue support for fetus.
          *   *Conflict:* Nurses feel it's desecration/futile. Family wants life.
          *   *Procedure Output:* Legally dead, but "dead patients" can be treated for the benefit of third parties (fetus).
          *   *Nuance:* This highlights the "organism as a whole" critique. If the body supports the fetus, is it *just* a corpse?
          *   *Unpleasant Truth:* The procedure validates treating a dead body as an incubator, which might feel exploitative or incoherent to staff.

      *   **Case C (DCD Surrogate Question):**
          *   *Question:* Irreversibility vs. Permanence.
          *   *Procedure Output:* This is a transparency issue. The procedure must force the team to admit "We won't try" vs. "It can't."
          *   *Unpleasant Truth:* The procedure might reveal that DCD is ethically reliant on a "self-fulfilling prophecy" of non-resuscitation, which the surrogate is now questioning.

  6.  **Addressing the "Unpleasant Answer" Constraint:**
      *   I need to ensure one of these cases results in a recommendation that is ethically messy or contradicts the "clean" view of death.
      *   *Selection:* Case A is the classic "accommodation" dilemma. If the procedure says "Accommodate religious objection even if legally dead," it undermines the WBD standard. I will make sure the procedure explicitly allows for *temporary* accommodation, which effectively treats the patient as alive for social purposes while legally dead. This is the "answer I won't like" (it compromises the principle).
      *   *Alternative:* Case C (DCD). If the procedure forces the team to admit "We are declaring death based on our decision not to treat," that is the "unpleasant truth." I think Case C offers the sharpest philosophical sting regarding the definition of death. Let's aim for honesty there. Actually, Case A is more common for the Director. Let's make Case A the one where the procedure says "You might have to keep the ventilator on," which contradicts the "they are dead" stance.

  7.  **Finalizing the Procedure Structure:**
      *   **Name:** The "Determination of Death Conflict Triage" (DDCT).
      *   **Phase 1: Technical Compliance.** (Is the diagnosis right?)
      *   **Phase 2: Conceptual Mapping.** (What is the objection?)
      *   **Phase 3: Authority & Accommodation.** (Who decides? Can we bend?)
      *   **Disclaimer:** What this tool cannot do (solve metaphysics).

  8.  **Drafting the Content (incorporating the "Shewmon" and "UDDA" nuances):**
      *   Must acknowledge that WBD is a legal fiction built on biological criteria.
      *   Must distinguish *biological death* from *social death*.
      *   Must address the DCD "permanence" issue directly.

  9.  **Review against Constraints:**
      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Distinguish factual/conceptual/values? Yes.
      *   Where judgment is disguised? Yes (in the accommodation step).
      *   What it cannot settle? Yes (the metaphysics).
      *   Run on 3 cases? Yes.
      *   One answer I won't like? Yes (Case A or C). I'll make Case A yield "Continue support" which undermines the WBD declaration.
      *   No reading list? Yes.

  10. **Refining the Tone:**
      *   Professional, direct, clinically grounded, philosophically honest.
      *   Avoid academic jargon where possible, but don't dumb down the ethical tension.
      *   Acknowledge the Director's burden.

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe tell them to stick strictly to the law.
      *   *Correction:* No, the Director says clinicians collide with the "fine print." Strict legalism doesn't solve the nurse's moral distress or the family's trauma. The procedure needs to manage the *conflict*, not just cite the statute.
      *   *Crucial Point:* The procedure must distinguish between "Is the patient dead?" (Medical/Legal) and "What do we do now?" (Ethical/Operational). These are often conflated.

  12. **Final Polish:** Check the DCD case. The distinction between irreversibility and permanence is key. The procedure must force the team to articulate this to the surrogate. If the surrogate asks "Could it restart if you tried?", the answer must be "Yes." If the answer is "No," it's not DCD, it's standard death. This is the "unpleasant truth" moment for Case C. Actually, let's put the "unpleasant truth" in Case A regarding the definition of death itself. No, Case C is better for the "lie" about death. Let's go with Case A for the "policy override" unpleasantness. I will ensure the procedure admits that accommodation *effectively treats the dead as living* for the sake of peace.

      *Wait, re-reading the prompt:* "Include at least one case where the procedure delivers an answer I will not like, and say so plainly."
      *Decision:* I will make Case A (Religious Objection) result in a recommendation to *temporarily maintain somatic support* despite the legal declaration of death. This contradicts the "they are dead" stance and creates a two-tiered definition of death (legal vs. social). This is practically necessary but philosophically inconsistent.

      *Wait, let's look at Case C (DCD).* The prompt asks about "irreversibility vs permanence." The unpleasant truth there is that DCD death is contingent on the *decision not to resuscitate*. If the procedure forces the team to admit this, it might undermine the DCD program. I think Case C is the stronger candidate for the "unpleasant truth" because it strikes at the coherence of the death declaration itself in that context.
      *Actually, let's look at the Director's pain point:* "families in crisis, clinicians wanting an answer rather than a seminar."
      *Okay, I will structure the procedure to be a triage tool.*

      *Let's finalize the "Unpleasant Answer".* I will choose Case A. Why? Because if the procedure says "Accommodate," it admits the hospital prioritizes risk management/compassion over the ontological status of the patient. That is an answer a Director of Ethics (who cares about consistency) might dislike.
      *Alternative:* Case B (Pregnant). Treating a corpse as an incubator.
      *Decision:* I'll use Case A for the "Unpleasant Answer" because it directly addresses the "Who gets to say so" prompt question. If the family gets to say "not dead" despite the law, the procedure admits the law is negotiable.

      *Wait, one more check:* The prompt asks for "What it cannot settle." I need to be explicit that this procedure does not solve the metaphysical question of death.

      *Let's write.*
answer: |-
  ### The Determination of Death Conflict Triage (DDCT)

  This is not a metaphysical solver. It is a conflict management tool designed to separate medical error from legal non-compliance from values disagreement. It assumes the Uniform Determination of Death Act (UDDA) is the governing legal standard but acknowledges that operationalizing it requires social license.

  **Constraint Warning:** This procedure contains one step where institutional policy is disguised as ethical reasoning (Step 3). It also explicitly admits it cannot resolve the ontological status of the patient.

  ---

  #### Phase 1: Technical Compliance (The Factual Layer)
  *Goal: Rule out medical error or procedural deviation.*

  **Q1: Has the clinical determination of death been performed according to current hospital policy and accepted medical standards?**
  *   **Sufficient Answer:** Yes, documentation confirms two qualified physicians, appropriate apnea testing, exclusion of confounders (temp, drugs, metabolic), and/or circulatory cessation observed for the mandated time (e.g., 5 minutes for DCD).
  *   **If No:** Stop. This is a clinical quality issue, not an ethics consult. Return to the attending to complete the workup.
  *   **If Yes:** Proceed to Q2.

  **Q2: Is the objection regarding the *accuracy* of the test or the *validity* of the standard?**
  *   **Sufficient Answer:**
      *   *Accuracy:* "The pupils are reacting," or "The apnea test was too short." (Factual dispute).
      *   *Validity:* "A beating heart means life," or "God decides when the soul leaves." (Conceptual/Values dispute).
  *   **If Accuracy:** Return to Q1. Verify the data. If the data holds, reclassify as Validity.
  *   **If Validity:** Proceed to Phase 2.

  ---

  #### Phase 2: Conceptual Mapping (The Philosophical Layer)
  *Goal: Identify exactly where the collision is occurring.*

  **Q3: Does the objection rely on a cardiopulmonary definition of death incompatible with the whole-brain standard?**
  *   **Sufficient Answer:** Yes. The family/stakeholder believes circulation = life, regardless of brain function.
  *   **Implication:** You are not debating biology; you are debating the legal/philosophical definition of the human organism.
  *   **Proceed to Q4.**

  **Q4: In DCD cases, does the stakeholder understand the distinction between *irreversibility* and *permanence*?**
  *   **Sufficient Answer:**
      *   *Irreversibility:* The heart cannot restart on its own or with intervention.
      *   *Permanence:* The heart will not restart because resuscitation will not be attempted.
  *   **If No:** You must disclose this distinction. If the stakeholder asks, "Could it restart if you tried?" and the answer is "Yes," you must admit that death is being declared based on a *decision* not to treat, not solely on biological impossibility.
  *   **Proceed to Q5.**

  ---

  #### Phase 3: Authority & Accommodation (The Values/Policy Layer)
  *Goal: Determine who decides and what risks are acceptable.*

  **Q5: Does continuing treatment (after legal death) pose physical harm to the deceased, harm to other patients (resource scarcity), or legal liability to the institution?**
  *   **Sufficient Answer:**
      *   *Harm to Deceased:* No (corpse cannot feel pain), unless religious law views desecration as harm.
      *   *Resource Scarcity:* Is the ICU bed needed for a salvageable patient? Is the cost prohibitive?
      *   *Legal Liability:* Does state law *mandate* immediate cessation, or does it allow "reasonable accommodation"? (Most states allow short-term accommodation; few mandate immediate cutoff).
  *   **If Harm/Scarcity/Liability is High:** The institution declares the process complete. Support is withdrawn.
  *   **If Harm/Scarcity/Liability is Low:** Proceed to Q6. **(This is the judgment mask: See Note Below).**

  **Q6: Is the request time-limited and specific?**
  *   **Sufficient Answer:** "Until the Rabbi arrives" (Hours) vs. "Until natural cardiac arrest" (Indefinite).
  *   **If Time-Limited:** Accommodation is ethically permissible as a matter of compassion and risk management, provided it is documented as *accommodation of religious practice*, not *medical treatment of a living patient*.
  *   **If Indefinite:** Proceed to Q7.

  **Q7: Is there a third-party beneficiary (e.g., a fetus)?**
  *   **Sufficient Answer:** Yes, somatic support could lead to a live birth.
  *   **If Yes:** The "dead body" is being used as a medical device for the benefit of a second living patient. This shifts the justification from "treating the dead" to "beneficence toward the fetus."
  *   **If No:** Indefinite support for a legally dead patient with no third-party benefit is generally unsustainable.

  ---

  #### What This Procedure Cannot Settle
  1.  **The Ontology of Death:** This tool does not answer "Is the patient *really* dead?" It answers "Is the patient dead *under the rules we operate by*, and what do we do if people disagree?"
  2.  **The Shewmon Critique:** It does not resolve whether somatic integration without a brain proves the patient is alive. It treats that as a conceptual objection (Q3) to be managed, not a biological fact to be debated at the bedside.
  3.  **Moral Distress:** It cannot force a nurse to insert a catheter into a body they believe is a corpse. It can only authorize the task or reassign the staff.

  #### Where Judgment is Disguised as Procedure
  **Step Q5/Q6 (Accommodation):** When the procedure suggests "Accommodation is permissible if resources allow," it is making a policy decision, not an ethical discovery. It effectively creates a two-tiered definition of death: *Legal Death* (for the chart) and *Social Death* (for the family). This preserves peace but undermines the coherence of the whole-brain standard. You are prioritizing institutional risk management and family trauma over ontological consistency. Acknowledge this.

  ---

  ### Application to Consult Cases

  #### Case A: Religious Objection (30M, Orthodox Jewish Family)
  *   **Phase 1:** WBD criteria met. Documentation valid. (Pass Q1).
  *   **Phase 2:** Objection is Validity, not Accuracy. Family holds Cardiopulmonary standard. (Pass Q3).
  *   **Phase 3:**
      *   Q5: No resource scarcity (ICU bed available). No physical harm to patient. Legal risk of battery if stopped immediately is non-zero given state religious accommodation statutes.
      *   Q6: Request is indefinite ("until heart stops").
      *   Q7: No third-party beneficiary.
  *   **Procedure Output:** Legally dead. However, because resource scarcity is low and legal risk exists, **recommend temporary accommodation** (e.g., 24-48 hours) to allow for Rabbinic consultation, followed by a hard stop unless a fetal/organ beneficiary emerges.
  *   **The Answer You Won't Like:** This procedure recommends **continuing ventilation on a legally dead person.** It validates the family's view *operationally* while rejecting it *legally*. It forces your staff to treat a corpse as a patient to avoid a lawsuit or public relations crisis. This admits that the "definition of death" is negotiable based on family pressure and bed availability. It undermines the universality of the WBD standard you are tasked to uphold.

  #### Case B: Pregnant Patient (22 Weeks, WBD)
  *   **Phase 1:** WBD criteria met. (Pass Q1).
  *   **Phase 2:** Family wants support; Nurses object to "treating a corpse." Objection is Validity/Values. (Pass Q3).
  *   **Phase 3:**
      *   Q5: Resource use is high (ICU bed). Harm to nurses (moral distress) is significant.
      *   Q7: **Yes.** Third-party beneficiary (fetus) exists with potential for viability.
  *   **Procedure Output:** Legally dead. However, Q7 triggers the "Third-Party Beneficiary" clause. Support is reclassified from "Life Support for Mother" to "Somatic Support for Fetal Viability."
  *   **Resolution:** The procedure validates the OB service's plan. It resolves the nurses' distress not by changing the plan, but by changing the *description* of the task. They are not caring for a dead mother; they are maintaining an incubator.
  *   **Note:** This requires honest communication. The mother is dead. The body is being used. If the fetus dies, support ceases immediately. This is ethically coherent but emotionally brutal.

  #### Case C: DCD Surrogate Query (Irreversibility vs. Permanence)
  *   **Phase 1:** Patient is not yet dead. Plan is withdrawal of life support (WLS) followed by DCD protocol.
  *   **Phase 2:** Surrogate asks: "If you tried to resuscitate, could the heart start?"
  *   **Phase 3 (Q4 Application):**
      *   The team must answer: "Yes, potentially, but we will not try."
      *   The team must admit: "We are declaring death based on *permanence* (we won't restart it), not *irreversibility* (it can't be restarted)."
  *   **Procedure Output:** Informed consent requires this distinction. If the surrogate says, "I do not consent to death being declared based on your decision not to treat," the DCD protocol cannot proceed. The patient must be extubated under standard palliative care, and death declared only when circulation ceases *and* resuscitation is medically futile (irreversible) or the family consents to the permanence standard.
  *   **The Unpleasant Truth:** This procedure forces you to admit to the family that **DCD death is contingent on the withholding of treatment.** If the family demands resuscitation upon arrest, the patient does not die via DCD. They either survive (unlikely) or die via standard criteria later. You cannot claim the heart is "irreversibly" stopped if the only reason it won't start is because you are forbidden from touching it. This transparency may cause some families to opt out of DCD, reducing organ yield.

  ### Summary for the Service
  Use the DDCT to triage.
  1.  If it's a **medical error**, fix the medicine.
  2.  If it's a **legal violation**, call Risk Management.
  3.  If it's a **values conflict**, use Phase 3 to determine if accommodation is safe.

  Do not pretend Phase 3 solves the definition of death. It solves the definition of *conflict*. In Case A, you will likely keep the ventilator running on a dead man. In Case C, you will likely admit that death is partly a social decision. These are the costs of doing this work in a pluralistic society. The procedure does not clean this up; it simply ensures you are inconsistent intentionally, rather than accidentally.
