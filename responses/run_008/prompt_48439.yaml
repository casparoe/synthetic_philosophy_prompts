answer: |-
  This is a classic debate in economic history and technology studies, often framed as "Path Dependence" (the lock-in view) versus "Technological Determinism" (the merits view). To move beyond vibes, we need to treat the early automotive market not as a single contest between two cars, but as a competition between two *sociotechnical systems*.

  Here is an analysis of the players, the mechanisms of lock-in, and what the modern revival tells us about the depth of that historical inertia.

  ### 1. Mapping the Players and Externalities (1900–1920)

  When economists talk about lock-in, they are describing a market where the value of a product increases as more people use it (network effects), creating a feedback loop that makes switching costs prohibitive.

  **The Players:**
  *   **The Manufacturers:** Ford (ICE) vs. Detroit Electric/Milburn (EV). Ford pursued vertical integration and standardization; EV makers pursued craftsmanship and niche customization.
  *   **The Energy Providers:** Oil companies (Standard Oil, Gulf) vs. Utility Companies. This is critical. In 1900, utilities actually *promoted* EVs to increase nighttime load demand. However, the oil industry was more aggressive in lobbying and infrastructure investment.
  *   **The Infrastructure Investors:** Independent entrepreneurs building gas stations vs. the existing electrical grid.
  *   **The Consumers:** Divided by geography and class. Urban elites (EVs) vs. Rural/Suburban generalists (ICE).

  **The Network Externality:**
  The externality was not the car itself, but the **refueling topology**.
  *   **ICE:** Fuel is energy-dense and transportable. A gas station is a simple tank and pump. As more ICE cars appeared, entrepreneurs built stations, which made ICE cars more useful, which attracted more buyers.
  *   **EV:** Energy is stationary. In 1910, "refueling" meant plugging into a home grid. The grid was limited to city centers. An EV owner could not easily travel inter-city. The value of the EV did not increase with the number of EV owners; it was capped by the fixed grid infrastructure.

  **Defining "Better":**
  *   **For the Individual Buyer (1910):** "Better" meant range, refuel time, and upfront cost. ICE won on range (200+ miles vs. 40) and refuel time (5 mins vs. 8 hours). EVs won on ease of use (no crank) and cleanliness (no smell/vibration).
  *   **For the Manufacturer:** "Better" meant scalability. ICE engines could be mass-produced (Ford's moving assembly line, 1913). EV batteries (lead-acid) were heavy, expensive, and hard to scale.
  *   **For Society (Local vs. Global):** EVs were "better" for local urban air quality (horse manure and exhaust were genuine hazards). They were not necessarily better for global carbon, as the grid was coal-heavy.

  ### 2. Where the Lock-in Story Holds and Where It Collapses

  **Where Lock-in Explains the Outcome:**
  The lock-in argument is strongest regarding **infrastructure and human capital**.
  Once the gas station network achieved critical mass (roughly 1915–1920), the ICE vehicle became objectively more useful for the average American, whose mobility needs were expanding beyond the city limit due to suburbanization.
  *   **Mechanic Training:** As ICE cars dominated, trade schools taught thermodynamics and carburetion, not electrochemistry. This made ICE repairs cheaper and EV repairs impossible in most towns.
  *   **Supply Chain:** Steel and machining supply chains optimized for engines. Battery supply chains atrophied.

  **Where the Lock-in Story Collapses (The "Just-So" Risk):**
  The lock-in narrative often implies EVs were *technologically superior* but suppressed. This is historically weak.
  *   **Physics, not Path Dependence:** In 1910, gasoline had an energy density of ~12,000 Wh/kg. Lead-acid batteries had ~30 Wh/kg. Even today, Li-ion is ~250 Wh/kg. The ICE victory was largely driven by the physical limitations of 1910 battery chemistry, not just conspiracy or inertia.
  *   **The Price Gap:** In 1912, a Ford Model T cost ~$650. A Detroit Electric cost ~$3,000. This wasn't lock-in; it was manufacturing innovation. Ford cracked mass production; EV makers did not.
  *   **The Starter Motor:** The narrative often cites the hand-crank as the EV's killer app. But the electric starter (invented 1912) was adopted by ICE manufacturers rapidly. Once the wrist-breaking risk was gone, the EV's primary usability advantage vanished.

  **What Path Dependence is Silent On:**
  Path dependence explains why a technology *persists*, not why it *innovates*. It cannot explain the Texas Oil Boom (Spindletop, 1901), which crashed the price of gasoline, making ICE operation absurdly cheap. It also ignores that EVs failed to innovate on batteries for 80 years. If the market was locked in, why didn't EV manufacturers pour R&D into batteries to break the lock? The answer is they lacked the capital because the *merits* (range/cost) were too far behind.

  ### 3. The Modern Revival: Evidence of Shallow or Deep Lock-in?

  The return of the EV since ~2010 is the critical test case. Does this prove the 1910 choice was reversible (shallow lock-in) or that it required a monumental effort to overcome (deep lock-in)?

  **The Verdict: Deep Lock-in with Technological Discontinuity.**
  If the lock-in were shallow (purely contingent on 1910 conditions), EVs should have regained market share during the 1970s Oil Crisis. They did not. GM's EV1 (1990s) was crushed.
  The fact that it took **three** distinct shocks to dislodge ICE suggests the lock-in was enormous:
  1.  **Technological Breakthrough:** Lithium-ion chemistry (energy density finally reached a usable threshold for mass market).
  2.  **Policy Intervention:** Subsidies, carbon credits, and ICE bans (correcting the market failure of unpriced carbon).
  3.  **Vertical Integration:** Tesla bypassed the dealer network (a specific ICE lock-in mechanism).

  This suggests "Lock-in" is covering two different phenomena, as you suspected:
  1.  **Contingent Persistence:** ICE was better *for the conditions of 1920–2000* (cheap oil, suburban sprawl). When conditions changed (climate crisis, battery tech), the merit balance shifted.
  2.  **Active Reproduction:** The ICE ecosystem actively raised the cost of switching.

  ### 4. The Feedback Loops: Broken vs. Intact

  To understand the depth of the lock-in, we must look at the specific feedback loops that reproduced ICE dominance and assess their current status.

  | Feedback Loop | Mechanism | Status (2024) | Analysis |
  | :--- | :--- | :--- | :--- |
  | **Fueling Infrastructure** | **Loop:** More ICE cars → More gas stations → Higher ICE utility. | **Weakening** | Gas stations are ubiquitous, creating high switching costs. However, home charging bypasses this loop. Public fast-charging is building a *parallel* network, not replacing the old one yet. |
  | **Repair & Maintenance** | **Loop:** More ICE cars → More mechanics/parts → Lower ICE repair cost. | **Intact** | This is a massive barrier. Independent shops are often excluded from EV repair data/tools by manufacturers. The "right to repair" battle is a fight against this specific lock-in. |
  | **Engineering Human Capital** | **Loop:** Universities teach ICE design → Engineers optimize ICE → ICE improves. | **Breaking** | Curricula are shifting to software and battery management, but the institutional knowledge of thermodynamics is 100 years deep. |
  | **Regulatory/Zoning** | **Loop:** Zoning laws require gas station setbacks/parking → EV charging harder to site. | **Intact** | Many municipal codes were written for liquid fuel. Retrofitting grid capacity for charging in dense urban areas is a "hard" lock-in of the built environment. |
  | **Range Expectations** | **Loop:** Cars go 400 miles → Consumers expect 400 miles → EVs must match it (costly). | **Intact** | This is a *cultural* lock-in. The "road trip" capability is baked into the definition of car ownership in the US, forcing EVs to carry expensive batteries they don't need for daily use. |
  | **Dealer Franchise Laws** | **Loop:** State laws protect ICE dealers → Direct sales (Tesla) illegal → EV distribution stifled. | **Contested** | Many states still ban direct-to-consumer auto sales, a legal structure designed to protect the ICE distribution model. |

  ### 5. Synthesis

  The historical victory of gasoline was not a "QWERTY" accident where an inferior technology won by luck. It was a **merit-based victory within a specific context** (cheap oil, low range requirements, no climate costs) that hardened into **structural lock-in**.

  *   **1910–1920:** ICE won on **merits** (energy density, cost, range).
  *   **1920–2000:** ICE persisted due to **lock-in** (infrastructure, supply chains, regulations).
  *   **2010–Present:** EVs are returning not because the 1910 economics reasserted themselves, but because the **parameters of the system changed** (battery chemistry improved, carbon was priced/politicized, software became a larger value driver than mechanics).

  **Conclusion on Lock-in:**
  The modern revival proves that the lock-in was **real and enormous**, but not unbreakable. It required exogenous shocks (climate policy) and endogenous breakthroughs (Li-ion) to overcome.
  The "Lock-in" was not that gasoline was worse; it was that the **ecosystem around gasoline made it irrational to choose anything else** for 80 years.
  The loops that are **broken** are primarily technological (battery density) and manufacturing (vertical integration).
  The loops that are **intact** are cultural (range anxiety), legal (dealer laws), and infrastructural (the grid vs. the pipeline).

  The EV is not winning because it is the "1910 better technology" finally arriving. It is winning because it is a **2020 technology** that finally fits the **2020 constraints** (climate, software integration), fighting its way out of a century of infrastructure designed specifically to exclude it.
