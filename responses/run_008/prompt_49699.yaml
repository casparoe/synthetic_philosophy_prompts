answer: |-
  **Gate B12. 11:45 PM. The flight to Chicago is delayed indefinitely. Maya stirs a styrofoam cup of coffee that smells like burnt pennies. Dr. Ellis is rubbing her temples.**

  **Maya:** I still think you were too hard on the panelists. The data holds up. Skeletons don't lie. Pre-agricultural bones show less stress, better nutrition.

  **Ellis:** The enamel hypoplasia stats are robust, I'll grant you that. But you quoted Diamond's "worst mistake in human history" line like it was scripture.

  **Maya:** Because it is. Look at the trade. Hunter-gatherers work fewer hours. Varied diet. No surplus means no one can hoard resources, which means no one can boss anyone around. It's egalitarian by material necessity.

  **Ellis:** It's a compelling story. Too compelling.

  **Maya:** Truth isn't less true because it's compelling.

  **Ellis:** No, but let's grant your datapoints. Per-capita welfare drops. Workload increases. Hierarchy emerges. But agriculture lets the population grow by orders of magnitude. So whether it's a "mistake" quietly depends on your population ethics.

  **Maya:** Oh, here we go.

  **Ellis:** I'm serious. Does a world with billions of lives barely worth living beat a world with a few million excellent ones? If you call it a mistake, you're implicitly rejecting totalism.

  **Maya:** I *do* reject totalism. I'm not obligated to maximize the headcount. If life gets worse for the individual, adding more individuals doesn't fix the moral ledger.

  **Ellis:** Fine. But then you're stuck with the counterfactual. "Mistake" implies a choice was made where a better option was viable.

  **Maya:** The option was staying mobile. Foraging.

  **Ellis:** With eight billion people? It's a one-way ratchet, Maya. Once you cross the threshold, you can't go back. You can't just decide to un-invent wheat when the population density requires calories per acre that foraging can't provide.

  **Maya:** So we just accept the lock-in? "Oops, trapped ourselves, guess hierarchy is natural now"?

  **Ellis:** I'm saying "mistake" is the wrong word for a process no one chose. It's path dependence. And honestly, the "affluent forager" evidence you're leaning on? It's doing ideological work.

  **Maya:** Ideological work?

  **Ellis:** It got popular in the seventies because academics wanted a stick to beat modernity with. Most workload estimates extrapolate from a handful of contemporary groups. The !Kung in the sixties aren't a proxy for the Paleolithic. Their circumstances were specific.

  **Maya:** Even if the hours are debatable, the hierarchy point stands. Grain can be stored. Stored grain can be taxed. Stored grain can be stolen. That material reality creates kings.

  **Ellis:** I'll concede that. The surplus mechanism enables coercion. But you're evaluating a historical transition that has no control group. We don't get to run the simulation again without wheat.

  **Maya:** So what's the metric? If we can't say it was a mistake, what do we call it?

  **Ellis:** A trap. Maybe. But not a moral failure of the people who stepped in it.

  **Maya:** *[Takes a sip, grimaces]* Okay. "Trap" I can work with. But if it's a trap, the goal isn't to mourn the exit. It's to figure out how to mitigate the confinement.

  **Ellis:** Exactly. Instead of asking "was this bad?", ask "given we're here, how do we reduce the coercion the surplus enables?"

  **Maya:** So less romanticizing the band, more figuring out how to stop the hoarding without starving the billions.

  **Ellis:** Now you're doing history instead of mythology.

  **Maya:** Don't get smug. I still think the skeletons look healthier.

  **Ellis:** *[Smiles weakly]* They do. Drink your coffee, Maya. Flight's probably cancelled anyway.
