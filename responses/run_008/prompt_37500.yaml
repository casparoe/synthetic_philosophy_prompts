answer: |-
  This is a classic and exceptionally well-formulated metaphysical standoff. Your friend has adopted a rigorous, classical Leibnizian position: **Necessary PII + Relationism about Space/Time.** Her argument is valid; if you accept her premises, her conclusions follow. The disagreement is not about logic, but about the modal and ontological costs of those premises.

  Here is an analysis of where the argument goes, whether her distinctions are principled, and what the "cheapest consistent package" looks for someone with your constraints (no haecceities, extended space/time, possible symmetric worlds).

  ### 1. Is Her "Objects vs. Relations" Distinction Ad Hoc?

  **Verdict: No, it is principled, but it does not save her from the modal cost.**

  Your friend's move to deny that points and instants are "objects" (Premises 4–6) is standard **Leibnizian Relationism**. For a Leibnizian, space is not a container (substantivalism) but a system of relations between material bodies. If there are no bodies, there are no spatial relations, and thus no space. Therefore, arguing that "empty space has indiscernible points" is a category error for her, like arguing that "a bachelor has an indiscernible wife."

  *   **Is it principled?** Yes. It is historically and systematically consistent with her endorsement of PII. Leibniz himself argued exactly this way against Newtonian absolute space.
  *   **Does it help her with the Spheres?** No. This is where your leverage lies. In Black's universe, there *are* objects (the spheres). Since she admits spheres are objects, PII applies to them. Relationism about space merely means the spheres' spatial properties are exhausted by their relations to each other.
  *   **The Trap:** She cannot use relationism to dissolve the spheres *and* maintain there are two of them. If space is purely relational, the only properties the spheres have are (a) intrinsic (mass, size, color) and (b) relational (distance from the other sphere). If (a) is identical and (b) is symmetric (A is 1 mile from B; B is 1 mile from A), then under Strong PII, they collapse into one object.

  Her distinction is not ad hoc, but it forces her to bite a massive bullet: **Symmetric material universes are metaphysically impossible.**

  ### 2. The Real Cost of Your Friend's Position

  Your friend thinks she is preserving PII at no cost. She is wrong. She is paying for it with **modal richness**.

  By insisting that Black's world is impossible (like a round square), she is claiming that **nature cannot be symmetric.** This has consequences she may not have noticed:
  1.  **Physics Conflict:** Modern physics is replete with symmetric states. Bosons (like photons) can occupy the exact same quantum state; they are indiscernible in principle. If PII is a necessary truth about *objects*, then either bosons aren't objects (a tough sell) or quantum mechanics describes an impossible world.
  2.  **Cosmology:** A perfectly homogeneous and isotropic universe (a standard model in cosmology) would be impossible on her view. There must be some asymmetry to individuate regions of space or matter.
  3.  **The "One Sphere" Conclusion:** In Black's scenario, she must conclude there is not *two* spheres, but *one* sphere. But if there is only one sphere, what is it "one mile from"? Itself? But the setup stipulates a distance relation that is irreflexive (nothing is one mile from itself). So her position actually renders the description not just "two spheres" but "one sphere standing one mile from itself," which *is* a round square.

  **Cost Summary for Friend:** She saves PII but must deny the possibility of any symmetric world, potentially conflicting with logic (irreflexive relations require two relata) and science.

  ### 3. The Cheapest Consistent Package for You

  You want:
  1.  Extended space/time.
  2.  Possible two-sphere world.
  3.  **No haecceities** (no "bare thisness").

  If you simply reject PII (Premise 1) without qualification, you usually fall into **Substratum Theory** or **Haecceitism** (objects are distinct because they have a primitive "thisness" beyond their properties). You explicitly said you dislike this.

  The solution that fits your constraints is **Weak Discernibility** (championed by philosophers like Simon Saunders and James Ladyman).

  #### The Weak Discernibility Move
  This view modifies PII rather than trashing it. It distinguishes between:
  *   **Absolute Discernibility:** $x$ and $y$ differ by a monadic property (e.g., $x$ is red, $y$ is blue).
  *   **Weak Discernibility:** $x$ and $y$ stand in an **irreflexive relation** (e.g., $x$ is 1 mile from $y$).

  **How it solves your problem:**
  1.  **No Haecceities:** You do not need to posit a magical "thisness" to tell the spheres apart. You only need the logical fact that the relation "1 mile from" is irreflexive (nothing is 1 mile from itself).
  2.  **Two Spheres Possible:** The world contains two objects because the logical structure of the world satisfies $\exists x \exists y (x \neq y \land Rxy)$ where $R$ is irreflexive. The distinctness is grounded in the relation, not in primitive identity.
  3.  **Space/Time Extended:** Spatial points can be weakly discerned by their metric relations to each other (distance is irreflexive). You don't need to treat points as "objects" in the material sense to grant them distinctness via structural relations.

  **The Cost for You:**
  You must admit that **Strong PII is false.** Two objects *can* share all monadic and qualitative relational properties (e.g., both are "1 mile from a sphere of mass M"). They are distinct only because they occupy different nodes in the relational structure. You are committing to **Structuralism**: objects are individuated by their place in the web of relations, not by intrinsic qualitative differences.

  ### 4. Comparison of Options

  | Option | View | Cost/Commitment | Fits Your Constraints? |
  | :--- | :--- | :--- | :--- |
  | **Friend's View** | **Necessary Strong PII + Relationism** | Symmetric worlds are impossible. Quantum bosons are problematic. Black's world collapses to one sphere (contradiction). | No (Denies 2-sphere possibility). |
  | **Haecceitism** | **Contingent PII + Primitive Thisness** | Accepts "bare particulars." Metaphysically "spooky." Violates your dislike of haecceities. | No (Violates no-haecceity constraint). |
  | **Weak Discernibility** | **Structuralism / Weak PII** | Rejects Strong PII. Accepts that distinctness can be purely relational/logical. | **Yes.** (Allows 2 spheres, no haecceities, extended space). |
  | **Bundle Theory** | **Objects = Bundles of Properties** | If bundles are identical, objects are identical. Leads back to Friend's view unless modified by Weak Discernibility. | Mixed (Needs Weak Discernibility to work). |

  ### 5. How to Reply to Your Friend

  You can grant her that her position is internally consistent (Leibniz held it, after all), but argue that it is **dialectically costly** and **scientifically implausible**.

  **Specific Arguments to Use:**

  1.  **The Irreflexivity Trap:**
      *   "You agree that 'being one mile from' is an irreflexive relation. Nothing can be one mile from itself. If the Black universe contains this relation, logic dictates there must be at least two relata. If PII forces the relata to be identical, then the relation cannot exist. So you aren't just saying there is one sphere; you are saying the *description* of the world entails a logical contradiction (a sphere standing one mile from itself). Why privilege PII over the logical law of irreflexivity?"

  2.  **The Modal Cost:**
      *   "Your view implies that a perfectly symmetric universe is metaphysically impossible, like a married bachelor. This seems to legislate against the world's structure a priori. Given that our best physics (quantum statistics, cosmology) relies on symmetric states, why should we accept a metaphysical principle that renders our best science 'impossible'?"

  3.  **The Relationist Inconsistency:**
      *   "You use relationism to save space from PII (points aren't objects), but you won't let relationism save the spheres. If space is relational, the spheres' spatial properties *are* their relations to each other. If you admit that irreflexive relations can individuate spatial points (in a non-empty space), why can't they individuate the spheres? If you deny that relations can individuate points, you risk making space unextended. If you admit relations can individuate points, you should admit they can individuate spheres."

  4.  **Propose the Compromise (Weak Discernibility):**
      *   "I don't need haecceities. I only need **Weak Discernibility**. The spheres are distinct not because they have different qualities, but because they stand in an irreflexive relation. This preserves the spirit of PII (no brute distinctness) without the cost of denying symmetric worlds. It is a cheaper package than yours because it doesn't require us to call logically coherent scenarios 'impossible'."

  ### Conclusion

  Your friend's argument does not go "wrong" logically, but it goes wrong **pragmatically and modally**. She is protecting a principle (Strong PII) at the expense of logical possibility (irreflexive relations requiring two terms) and scientific plausibility.

  **The step to reject is Premise (1), but not entirely.** Reject the claim that *qualitative* indiscernibility implies identity. Replace it with the claim that *weak* discernibility (via irreflexive relations) is sufficient for distinctness.

  **What this costs you:** You must abandon the hope that every distinct object has a unique qualitative "profile." You must accept that the world can contain distinct things that are qualitatively identical, provided they are structurally distinct. This is the price of avoiding haecceities while keeping symmetric worlds possible. It is a much lower price than your friend's denial of symmetry.
