      *   **The Friend's Defense against "Too Much":** She is a Leibnizian relationist about space and time. Points/instants aren't *objects*, so PII doesn't apply to them directly. Spheres *are* objects, so PII applies. She's willing to bite the bullet that two bare spheres are impossible, just like bare points.
      *   **The User's Position:** Believes space has many locations, time is extended, and the two-sphere world is possible. Dislikes haecceities/bare thisnesses. Wants to know where the friend's argument fails, what the costs of rejecting steps are, and if the friend's distinction (objects vs. relations) is principled or ad hoc.
      *   **Goal:** specific analysis of the argument, costs of options, and evaluation of the friend's relationist move.

  2.  **Deconstruct the Friend's Argument:**
      *   (1) PII is Necessary (No distinct objects share *all* properties, including relational).
