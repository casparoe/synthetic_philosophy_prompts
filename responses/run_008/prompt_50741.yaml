  Your verdicts are best unified by a principle of **Threshold-Weighted Expected Value with a Certainty Safe Harbor**, which dictates that probabilities below a fixed epistemic floor are treated as zero, near-certain suffering claims create a permissible "safe harbor" even when outcompeted by uncertain options, uncertain options are preferred only when their expected value is astronomically higher, and moral obligations are bounded by a reasonable cost-to-agent constraint.

  **Clause 1: The Epistemic Floor**
  Probabilities below a specific threshold (plausibly between 0.001% and 1%) are treated as negligible regardless of magnitude.
  *   **Motivation:** This explains your refusal in (7) to act on the one-in-a-million chance despite the quadrillion stakes, distinguishing it from (4) where a 5% credence is actionable. It also supports (1), where a 2% credence is easily overridden.

  **Clause 2: The Certainty Safe Harbor**
  Actions addressing near-certain suffering are permissible and "clearly right" even if an alternative action has higher expected value but lower epistemic confidence.
  *   **Motivation:** This accommodates your judgment in (4) that the chicken donor is not doing wrong despite the insect charity having higher expected value, and in (6) that the mouse campaigner is clearly right while the insect campaigner is merely defensible. It also explains (2), where the bird's certainty dominates the insects' numbers.

  **Clause 3: The Astronomical Override**
  The Safe Harbor is breached if the uncertain option's expected value is sufficiently vast (orders of magnitude larger) to overcome the epistemic discount.
  *   **Motivation:** This captures why you lean toward the insect charity in (4) (trillions vs. millions) and why the insect campaign in (6) is defensible rather than wrong, despite the priority given to mice.

  **Clause 4: The Agent-Cost Constraint**
  Obligations to prevent suffering cease when the cost to the agent becomes significant relative to the expected harm prevented.
  *   **Motivation:** This justifies swatting the mosquito in (1), exterminating the ants in (3), and viewing relocation in (5) as supererogatory rather than required.

  **Verdicts on New Cases**
  *   **Insect-friendlier produce:** You **should pay the small premium**. This falls under Clause 3 (Astronomical Override) similar to the charity case in (4); the cost is small (within Clause 4), and the scale of industrial farming involves astronomical numbers that clear the epistemic floor.
  *   **Walking through grass:** It is **not worse to walk knowingly than absentmindedly**. Under this principle, the moral weight rests on the expected harm and the permissibility of the act itself (which is cleared by the Agent-Cost Constraint and the lack of astronomical stakes per walk). Knowledge does not alter the expected value of the outcome, nor does it push the act below the epistemic floor or above the cost constraint.

  **Conflicts and Required Revisions**
  This principle accommodates all seven of your verdicts without requiring you to abandon any, provided you accept that "clearly right" versus "defensible" tracks the epistemic confidence of the outcome rather than a strict binary of permissibility. The only tension lies in defining the precise epistemic floor; if your credence in mosquito sentience (2%) is actually above your functional floor, you must rely entirely on the Agent-Cost Constraint to justify (1), whereas if it is below the floor, (1) is justified by Clause 1. Given your verdict in (7), the floor is likely high enough that (1) sits near the boundary, requiring both clauses to fully explain the lack of hesitation.
