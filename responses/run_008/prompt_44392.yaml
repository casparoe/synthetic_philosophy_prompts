answer: |-
  You must teach Hume's logical point about invalid inference before Moore's semantic point about definition, because reversing this order convinces students that the is-ought gap is merely a linguistic stipulation rather than a structural requirement for valid argumentation. If you start with Moore, students conclude that "good" is simply undefinable, which makes Hume's observation look like a consequence of Moore's meta-ethics rather than a independent rule of logic; by starting with Hume, you establish that any valid argument for an "ought" requires a normative premise, and then use Moore to explain why naturalistic definitions cannot supply that premise without begging the question.

  **The Order and Example**
  Stick with your inequality example, but you must split its usage into two distinct phases to prevent the collapse you fear. In the first twenty minutes (Hume), present the argument: "Inequality erodes trust; therefore, we ought to redistribute." Ask students why this feels unsatisfying. When they identify the missing value judgment, write the hidden premise on the board ("We ought to maximize trust") to show the argument is now valid. This secures the logical point: "Is" premises alone cannot yield an "ought" conclusion, but "Is" + "Ought" premises can. In the next twenty minutes (Moore), pivot to the status of that hidden premise. Ask: "Can we define 'good' as 'maximizing trust' to make that premise analytically true?" Use the Open Question Argument here: "Is maximizing trust good?" must remain a meaningful question, proving the definition fails. This sequence ensures Moore reads as a deepening of the problem (you can't define away the normative premise) rather than a restatement of it.

  **Misconceptions and Timing**
  Expect three specific misconceptions, and head them off at these exact moments:
  1.  **"Hume bans 'ought' conclusions entirely."** Students will think no descriptive facts are relevant to ethics. Head this off immediately after you validate the argument with the hidden normative premise. Emphasize that Hume bans *purely* descriptive premises, not mixed ones.
  2.  **"Moore is just saying Hume's thing again."** This will arise during the transition. Head this off by explicitly labeling the board: "Hume = Validity (Structure)" vs. "Moore = Definition (Meaning)." Ask them: "If I define 'ought' as 'what God commands', have I solved Hume's problem?" (Yes, the argument becomes valid) "Have I solved Moore's?" (No, 'Is what God commands good?' remains an open question).
  3.  **"The Naturalistic Fallacy is arguing that what is natural is good."** This is the Appeal to Nature fallacy, not Moore's. Head this off only after you have secured Moore's actual definition (defining good in natural terms). Explicitly state: "Moore calls it the naturalistic fallacy when you *define* good as natural, not when you argue nature is good."

  **Searle**
  Do not bring in Searle. Institutional facts (like "promising") appear to bridge the gap, but explaining the distinction between brute and institutional facts requires a meta-ethical digression that will consume the time needed to separate Hume from Moore. In a fifty-minute section, Searle acts as a confounding variable that allows students to dismiss the is-ought gap as "solved" without understanding the logical distinction you are trying to cement.

  **Final Assessment Question**
  In the last five minutes, pose this scenario: "Suppose I argue: 'Lying causes anxiety, anxiety is natural, and what is natural is good; therefore, you ought not lie.' Have I satisfied Hume? Have I satisfied Moore?"
  *   **Correct Answer:** They satisfied Hume (the argument is valid because an "ought" premise was included), but they failed Moore (defining "good" as "natural" commits the naturalistic fallacy because 'Is what is natural good?' is an open question).
  *   **Diagnostic:** If they say "Failed both," they conflate the two. If they say "Passed both," they missed the Open Question Argument. If they say "Passed Hume, Failed Moore," they have successfully distinguished logical validity from semantic definition.
