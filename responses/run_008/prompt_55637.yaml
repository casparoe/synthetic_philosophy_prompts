answer: |-
  ### Private Brainstorming: Drafting the "Agreed Claims"

  *Initial Attempt 1:* "Both sides agree that moral sentences look like facts."
  *Critique:* The expressivist will wince. They deny moral sentences *are* like facts fundamentally, only superficially.
  *Revision:* "Both sides agree moral sentences function syntactically like factual claims."
  *Critique:* Better. But does the realist agree it's only syntactic? They think it's semantic too.
  *Revision:* "Both sides agree moral sentences function syntactically like factual claims and embed in logical operators."

  *Initial Attempt 2:* "Expressivists solve the logical problem."
  *Critique:* The realist will wince. They think expressivists *dissolve* it verbally or fail to solve it metaphysically.
  *Revision:* "Expressivists provide a formal account of consistency among attitudes."
  *Critique:* Realist might say "consistency of attitudes isn't logical validity."
  *Revision:* "Both agree expressivists provide a formal account of consistency that mimics logical validity."

  *Initial Attempt 3:* "Truth is deflationary."
  *Critique:* Realists often accept deflationism but insist it rests on representational content. Expressivists think it rests on attitudes.
  *Revision:* "Both agree deflationary truth predicates apply to moral sentences, but disagree on the underlying state."

  *Final Selection for Document:* Focus on the *phenomenon* of embedding, the *requirement* for compositionality, and the *formal success* of quasi-realism without conceding the metaphysical ground.

  ***

  ### Joint Statement on the Frege–Geach Problem

  **1. The problem, as both parties state it**

  Both parties agree that moral vocabulary embeds within logical operators—negation, conditionals, disjunctions—indistinguishably from descriptive vocabulary. The central explanatory burden is to account for the validity of arguments containing these embedded moral claims without stipulating validity by fiat. For example, in modus ponens arguments involving moral conditionals, the premises must share content across asserted and unasserted contexts. Geach's challenge insists that if moral sentences express different kinds of states in asserted versus embedded contexts, arguments equivocate. Any adequate semantics must explain why accepting the premises commits one to the conclusion in virtue of meaning, rather than through independent psychological coercion. The realist insists this requires truth-conditional content; the expressivist insists this requires a non-cognitive account of consistency. Both agree the phenomenon is real and requires a structural explanation.

  **2. Agreed claims**

  1.  **Phenomenological Equality:** Moral sentences and descriptive sentences are syntactically indistinguishable in embedded contexts. Any semantics must treat them compositionally.
  2.  **Validity Requirement:** Logical validity in moral arguments cannot be merely pragmatic or persuasive; it must rely on the semantic content of the constituents.
  3.  **Formal Mimicry:** The expressivist's machinery (e.g., Gibbard's planning states, Blackburn's commitment logic) successfully constructs a formal system where moral inferences preserve consistency analogous to truth-preservation.
  4.  **Realist Concession:** The realist concedes that quasi-realist systems achieve formal logical coherence and are not internally inconsistent, even if they deny these systems capture the metaphysical ground of validity.
  5.  **Expressivist Concession:** The expressivist concedes that their system mimics truth-conditional semantics closely enough that distinguishing them requires looking beyond surface logic to the nature of the mental states involved.
  6.  **Deflationary Availability:** Both parties agree that deflationary truth predicates (e.g., "It is true that stealing is wrong") are linguistically available for moral sentences without committing to robust correspondence theories immediately.
  7.  **Mixed Compounds:** Both agree that mixed moral/descriptive compounds (e.g., "Stealing is wrong or illegal") must be handled without positing systematic ambiguity in the logical operators.
  8.  **Explanatory Goal:** Both agree that the goal is to explain the *possibility* of moral disagreement and inference, not merely to catalogue linguistic usage.

  **3. Where we still disagree**

  | Topic | Expressivist Formulation (Fair to Expressivism) | Realist Formulation (Fair to Realism) |
  | :--- | :--- | :--- |
  | **Nature of Validity** | Validity is the preservation of consistency among non-cognitive attitudes (plans/norms). Truth-conditions are unnecessary projections. | Validity is the preservation of truth-values across representational states. Consistency of attitudes is a byproduct of truth-preservation, not the foundation. |
  | **Deflationary Truth** | Deflationary truth exhausts the concept; accepting "It is true that X" is just re-asserting X. No representational content is required. | Deflationary truth presupposes representational content; one cannot deflate truth unless the sentence already functions to describe reality. |
  | **Mental States** | Moral judgments are fundamentally distinct from beliefs (plans vs. maps), even if they behave similarly in logic. | Moral judgments are a subset of beliefs (representational states), differing in subject matter but not in functional kind. |

  **4. Cruxes, and what each side predicts**

  1.  **The Negation Problem (Schroeder's Challenge):** Can the expressivist distinguish the attitude expressed by "Stealing is wrong" from the attitude expressed by "Stealing is not wrong" without collapsing into belief-states?
      *   *Expressivist Prediction:* We can specify distinct types of planning states (e.g., being for blaming vs. being for not blaming) that are logically incompatible without being contradictory beliefs.
      *   *Realist Prediction:* Any specification of incompatibility between these attitudes will formally replicate the structure of contradictory beliefs, implying the states are beliefs after all.
      *   *Consequence:* If expressivists cannot specify the incompatibility without invoking belief-like content, they must concede moral judgments are representational.

  2.  **Probabilistic Embedding:** Can agents hold coherent credences (degrees of belief) in moral claims (e.g., "It is 50% likely that stealing is wrong")?
      *   *Expressivist Prediction:* Yes, via credences over planning states or normative uncertainties, without requiring moral facts to make the probabilities objective.
      *   *Realist Prediction:* No; coherent moral credences require moral propositions to be truth-apt candidates for probability functions, implying moral facts.
      *   *Consequence:* If moral credences are shown to be incoherent without truth-apt content, expressivism fails to account for moral uncertainty.

  3.  **The Goodness of Validity:** Is the validity of moral arguments explained by the nature of truth or the nature of rationality?
      *   *Expressivist Prediction:* Formal results will show validity derives from norms of rational planning consistency, independent of truth.
      *   *Realist Prediction:* Formal results will show norms of planning consistency are themselves truth-apt claims about rationality, restoring realism.
      *   *Consequence:* If norms of rationality are themselves representational, realism absorbs expressivism; if not, expressivism stands.

  **5. What is left, and what is verbal**

  A portion of the dispute is verbal, specifically regarding the label "belief." If "belief" means any state embedding in logic, the expressivist accepts moral judgments are beliefs. If "belief" means representational state, they deny it. However, the substantive disagreement remains regarding the metaphysical ground of logical relations. Is logic grounded in the structure of reality (realism) or the structure of rational agency (expressivism)? Both parties agree that further formal work on probabilistic embedding and the negation problem is required to settle this. Neither side believes the other's position is insulated; both agree that a failure to formalize non-cognitive credences would force a major revision of expressivism, while a failure to naturalize moral facts would force a revision of realism.
