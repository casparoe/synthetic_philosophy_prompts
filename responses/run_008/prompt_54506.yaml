answer: |-
  1. Synthetic gene circuits, like an arsenic-detecting E. coli construct, are routinely described as having functions despite lacking any evolutionary selection history. This immediate functional attribution by engineers and reviewers demonstrates that selection history is not a necessary condition for legitimate function talk in biological practice.

  2. Conversely, traits fixed purely by genetic drift may contribute causally to survival now, yet strict etiological accounts deny them function solely due to their historical origin. Treating these causally efficacious traits as functionless ignores their current explanatory role in the organism's viability.

  3. The causal-role approach captures both engineered circuits and drift-fixed traits by focusing on current systemic contributions rather than historical etiology. This makes it the superior default for working biologists who need to explain how capacities are produced in both natural and synthetic systems.

  4. Etiological accounts do excel at distinguishing proper functions from accidental effects, such as distinguishing the heart's pumping from its thumping sounds. However, this normative distinction is not required for most explanatory contexts in molecular and synthetic biology.

  5. Therefore, selected-effects should be demoted to a specific etiological subtype rather than treated as the exclusive definition of biological function. Retaining causal-role as the primary framework accommodates the full range of functional attributions actually used in contemporary biological research.
