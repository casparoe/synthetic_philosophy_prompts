  The study smelled of lemon polish and dead paper. On the desk, between a stack of graded calculus exams from 1998 and a cold cup of tea, sat the envelopes. Cream-colored, heavy stock. Aunt Margaret's handwriting on the front: *For the Girls.*

  Chloe had hers open. She hadn't taken the cash out, just peeked through the flap.

  "It's a no-brainer," Chloe said. She was pacing the rug, the envelope crinkling in her hand. "I look inside, I see an amount. Call it $M$. Your envelope has either $2M$ or $M/2$. Equal chance. So the expected value of switching is $(2M + M/2) / 2$. That's $1.25M$. I gain twenty-five percent just by swapping."

  Elena sat in the wingback chair, hands folded in her lap. She hadn't touched her envelope. "Put it down, Chlo."

  "Why? It's free money. Margaret was a mathematician, not a magician. The math holds."

  "The math holds only if you're allowed to assume the probability is fifty-fifty for *any* number you find," Elena said. "You're smuggling in a prior distribution that doesn't exist. You're assuming every dollar amount is equally likely to be in that envelope. From zero to infinity. That's impossible."

  "It's locally true, though," Chloe snapped. "Whatever I'm holding, the other side is double or half. Why wouldn't I switch?"

  "Because if that logic works for you, it works for me," Elena said. "I pick up my envelope. I run your same calculation. I decide to switch. So we swap. Now we're holding what we started with. Do we swap back? Your formula says yes. We stand here for eternity passing envelopes across the desk, getting richer on paper while the actual cash stays the same. It's absurd."

  "It's not absurd, it's expectation," Chloe said. "Expected value isn't what you get in one trial, it's the average over infinite trials."

  "We don't have infinite trials," Elena said. "We have one aunt. And she's dead."

  The door creaked. David leaned against the frame, holding a helmet under his arm. He'd ridden over from the university, still in his cycling kit. He looked at the envelopes, then at his cousins.

  "Let me guess," David said. "Chloe wants to swap. Elena says it's a symmetry trap."

  Chloe thrust the envelope toward him. "Tell her. $1.25$ expectation. It's basic decision theory."

  David walked in, setting the helmet on a stack of journals. He picked up the second envelope, weighing it in his hand. "In the abstract case, Elena's right. You can't assign equal probability to $2M$ and $M/2$ without knowing how Margaret funded the game. If she has a finite bankroll, there's a maximum amount. If you open an envelope and find that maximum, you know switching loses. That breaks the $50/50$ assumption."

  "But she didn't have a finite bankroll," Chloe said. "She had investments. She had... puzzles."

  "Actually," David said. He reached into his back pocket and pulled out a folded sheet of paper. "She left instructions. For me. In case you two couldn't agree."

  Elena sat forward. "Instructions?"

  "Methodology," David said. He unfolded the paper. "She didn't just pick numbers. She used a distribution. She flipped a coin. Heads, she put $1$ and $2$ in the envelopes. Tails, she flipped again. Heads, she put $2$ and $4$. Tails, flip again. $4$ and $8$. And so on. Each pair is half as likely as the one before."

  Chloe frowned. "So?"

  "So, I ran the conditional expectation," David said. "For any amount $x$ you find in your envelope—assuming $x > 1$—the probability that the other envelope contains $2x$ is not equal to the probability it contains $x/2$."

  "See?" Chloe pointed at Elena.

  "Wait," David held up a hand. "It's worse. Or better. Depending on how you look at it. Because of the way the probabilities decay... for any $x$ you open, the expected value of the other envelope is *higher* than $x$."

  Silence settled over the room. The grandfather clock in the hall ticked, a slow, heavy sound.

  "Okay," Elena said softly. "So Chloe is right. Switching is locally rational."

  "For every specific value observed, yes," David said. "If you open your envelope and see \$100, the math says the other one is worth more, on average. If you see \$1,000, the other one is worth more. If you see a million..."

  "Then we should both switch," Chloe said. She reached for Elena's envelope.

  "But if you both switch," Elena said, her voice tight, "you haven't changed the total money in the room. You've just swapped paper. How can the expected value of *both* envelopes be higher than the other?"

  David looked down at the desk. He traced the rim of the cold teacup. "Because the expected value of the money in the room is infinite."

  Chloe blinked. "What?"

  "The sum," David said. "Pair one is \$3, probability $1/2$. Pair two is \$6, probability $1/4$. Pair three is \$12, probability $1/8$. The expected total payout is $3(1/2) + 6(1/4) + 12(1/8) \dots$ It's $1.5 + 1.5 + 1.5 \dots$ It diverges. The mean is infinity."

  "That's not a number," Elena said.

  "It's a limit," David corrected. "Margaret built a St. Petersburg paradox into her will. When the expected value is infinite, standard dominance arguments break. You can't say 'Strategy A is better than Strategy B' because infinity minus infinity is undefined. The $1.25M$ calculation Chloe is using? It relies on the expectation being finite so you can compare the sums. Here, you're comparing two infinities."

  Chloe looked at the envelope in her hand. It felt lighter now. "So the math is broken?"

  "The math is consistent," David said. "It's our intuition that's broken. We expect 'Expected Value' to mean 'what you'll get on average.' But when the tail is this heavy, 'average' doesn't exist. In this specific game, yes, technically, for any number you see, you should switch. But if you switch, and then I switch, we haven't gained anything. The gain is real in the conditional sense, but虚幻 in the aggregate."

  "That's cowardly," Chloe said. "You're saying the formula works, but we're not allowed to use it?"

  "I'm saying the formula tells you to chase a ghost," David said. "Margaret knew this. She taught probability for forty years. She knew that if she made the stakes infinite, we'd fight over who had the bigger infinity."

  Elena stood up. She walked to the desk and placed her hand on her envelope. "So what do we do? If the expectation is infinite, does it matter which one I take?"

  "Practically? No," David said. "The utility of money isn't linear. You don't value a billion dollars a billion times more than a dollar. If you factor in utility—diminishing returns—the advantage of switching disappears. The 'gain' is all in the astronomical numbers that almost never happen."

  Chloe slumped into the chair opposite Elena. She looked at the envelope. "So I was right, but it doesn't matter."

  "You were right about the conditional probability," Elena said. "But you were wrong about what that probability buys you." She looked at David. "And you? You're the expert. If you were in this chair, would you switch?"

  David looked at the envelopes. He thought about the rent on his apartment, the tenure track review coming up in the fall, the bike he'd ridden over in the rain. He thought about Aunt Margaret, sitting in this chair, smiling as she wrote the checks that would fund this argument.

  "If I switch," David said, "I'm playing her game. I'm accepting that the value of this inheritance is defined by a sum that doesn't converge." He looked at Chloe. "If you switch, you're betting on the tail. You're betting you're in the one-in-a-million scenario where the numbers are huge. But most likely, we're both holding three digits."

  Chloe rubbed her thumb over the paper edge. "I need the money, Dave. I'm not playing for utility. I'm playing for the mortgage."

  "Then it doesn't matter," Elena said. "If the mean is infinite, the variance is infinite too. It's noise."

  "It's not noise," Chloe said. "It's twenty-five percent."

  "It's a mirage," Elena countered. "Because if you switch, and I switch, we're back where we started. The only way your $1.25M$ works is if I *don't* switch. But I'm rational too. So I switch. So we cancel out."

  "Unless," David said, "one of you commits. If Chloe swaps and Elena doesn't, Chloe gains. If they both swap, they break even. If neither swaps, they break even."

  Chloe looked at Elena. "Will you swap?"

  Elena looked at the envelope. She could feel the weight of the bills inside, or maybe she was imagining it. "If I say no, you'll think I'm scared of the math. If I say yes, I'm admitting the math makes sense."

  "The math makes sense," David said. "It just doesn't mean what you think it means."

  Elena picked up her envelope. She held it out to Chloe. "Take it."

  Chloe froze. "What?"

  "Take it," Elena said. "You want the switch? You want the $1.25$ expectation? Take it. I'll keep yours."

  "That's... that's not how the clause works," Chloe said. "We're supposed to look, then decide."

  "I've decided," Elena said. "I'm not looking. I'm taking the one in front of me. You can have mine. We swap blindly. Does that satisfy your expectation?"

  Chloe looked at the offered envelope. Then at her own. "If we swap blindly, the probability resets. It's $50/50$ again."

  "Then why do it?" Elena asked.

  "Because..." Chloe stopped. She looked at David.

  "Because it feels like agency," David said quietly. "Even if the EV is undefined, it feels like you're doing something."

  Chloe pushed Elena's hand back. "No."

  Elena let her hand drop. "No?"

  "If the expected value is infinite," Chloe said, her voice smaller now, "then the amount in here... it could be nothing. Or it could be everything. If I swap blindly, I'm just shuffling the infinite." She looked at the envelope she had originally picked. "I opened it. I saw the number. It was... it was a number."

  "And?"

  "And if I swap now, I'm betting against the number I saw," Chloe said. "You said for any number I see, the other is better. But you also said the total is infinite. If the total is infinite, the number I saw is statistically negligible. It doesn't matter what I saw."

  "Exactly," Elena said.

  "Then it doesn't matter what I do," Chloe said.

  "Margaret's clause," David said. "It says you *may* swap. Not that you *must*."

  Chloe looked at the envelope. She thought about the mortgage. She thought about the $1.25$ multiplier that had felt so solid five minutes ago, now dissolved into a cloud of divergent series.

  "I'm keeping it," Chloe said.

  Elena exhaled, a long, slow breath she seemed to have been holding since they walked into the room. "Me too."

  David nodded. He picked up his helmet. "Smart. Utility functions beat raw expectation every time."

  "It's not smart," Chloe said, sliding her envelope into her bag. "It's just... I don't want to play her game. Not this one."

  Elena stood up. She tucked her envelope into her jacket. "She wanted us to fight about the math. She always did. She wanted to see who trusted the formula more than the sister."

  "Who won?" David asked from the door.

  Elena looked at Chloe. Chloe looked at the floor.

  "Nobody switches," Elena said. "Nobody gains. The house wins."

  David smiled, a thin, tired smile. "That's the only convergence in the room."

  He left. The door clicked shut. The two sisters stood in the study, the envelopes safe in their bags, the infinite money locked away in the finite world.

  "You really saw a number?" Elena asked.

  Chloe nodded. "Yeah."

  "Was it big?"

  Chloe zipped her bag. "It was enough."

  "Good," Elena said. "Let's go get lunch."

  They turned off the light. The desk sat in the dark, the graded exams piled high, the ghost of the calculation hanging in the air, unresolved, like everything else.
