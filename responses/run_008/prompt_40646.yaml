      *   *Example:* Bank case. Low stakes (deposit check) = I know it's open. High stakes (mortgage payment due) = I don't know it's open (need more evidence), even if evidence is the same.
      *   *Opposing View (Invariantism):* Knowledge is purely epistemic (evidence/truth/belief). Stakes affect *action* (whether to act on the knowledge), not the knowledge state itself.

