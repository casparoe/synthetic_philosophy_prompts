      *   **Policy:** Must be real and enactable for the rest of the term (e.g., exam format, reading responses).
      *   **Structure:** Run both institutions in the same session (Vote first, then Prediction Market).
      *   **Mechanics:** Play money, simple materials (index cards/spreadsheet), live price display.
      *   **Secret Roles:** At least one manipulator (large budget, incentive to move price), a few insiders (private choices affect outcome). Reveal in debrief.
      *   **Deliverables:** Policy question/outcome, rules/materials, token economy, minute-by-minute timeline, secret role cards, debrief script (mapping to futarchy, addressing objections, limitations, predicted failures).
      *   **Language:** British English.

  2.  **Determine the Policy and Outcome:**
      *   *Constraint:* Must be measurable within the term.
      *   *Option A:* Take-home vs. In-class final. (Hard to measure "success" objectively within the term).
      *   *Option B:* Weekly reading responses optional vs. mandatory. (Easy to measure participation/grades, but might be too trivial).
      *   *Option C:* "The Class Collaboration Bonus." If the class average on the mid-term project exceeds X%, everyone gets 5% extra on the final grade.
      *   *Selection:* Let's go with a modification of Option B/C hybrid for immediate feedback.
      *   *Decision:* **Policy:** "Should the weekly reading response requirement be waived for the remainder of the term?"
      *   *Outcome Variable:* "Will the class average on the next major assignment (due in 4 weeks) be above 75%?"
      *   *Rationale:* This creates a tension. Students *want* less work (Vote Yes), but they might *believe* that doing the work leads to better grades (Market says No/low probability). Or vice versa. It links effort to outcome.
      *   *Refinement:* To make it tighter for a 90-minute session, the outcome needs to be something that *feels* resolvable soon, even if actual resolution is later. But the prompt says "measurable within the term." Let's stick with the Assignment Average.
      *   *Wait, a better tension:* If they vote to waive responses, they might believe grades will drop. If they vote to keep them, they believe grades will stay high.
      *   *Actually, the prompt asks to run the market conditional on the policy's adoption.*
      *   *Revised Policy:* "Adopt Policy X: No reading responses for the rest of term."
      *   *Outcome:* "Class Average on Final Project > 75%."
      *   *Market:* "Probability that Class Average > 75% *given* Policy X is adopted."
      *   *Tension:* Students vote *for* less work (Values). Market prices in the risk that less work = lower grades (Beliefs).
      *   *Wait, the prompt says:* "Run both institutions... first a straight vote... then a play-money prediction market."
      *   *Crucial Detail:* The market needs to resolve *eventually*, but trade happens *now*.
      *   *Let's simplify the outcome for the sake of the simulation's internal logic:* The outcome will be determined by a specific metric available at the end of the term (e.g., average grade on the next essay).
      *   *Policy:* "Abolish Weekly Reading Responses."
      *   *Outcome:* "Class Average on the Term Essay > 70%."

  3.  **Design the Token Economy:**
      *   Currency: "FutaBucks."
      *   Endowment: Equal for most, large for manipulator.
      *   Value: Top 3 traders get a tangible prize (chocolate, book voucher, or "drop lowest quiz score" coupon). This creates incentive.
      *   Market Mechanism: Simple Market Scoring Rule (LMSR) is too complex for a spreadsheet in real-time without coding. Let's use a continuous double auction via a shared Google Sheet or simple "Order Book" on the projector.
      *   *Simpler approach for 90 mins:* A parimutuel pool or a simple "Buy/Sell" against a house bank at a moving price.
      *   *Best for classroom:* A spreadsheet managed by the instructor (or TA) acting as the market maker. Students submit buy/sell orders, instructor updates price.
      *   *Price:* Probability (0-100).
      *   *Asset:* "YES" shares paying £1 if outcome occurs, £0 otherwise.
      *   *Initial Price:* 50p.

  4.  **Secret Roles:**
      *   *The Manipulator (The Whale):* Large budget. Goal: Push price to 90% or 10% regardless of truth. Why? To test market robustness. Incentive: Prize for moving price closest to target *and* maintaining it.
      *   *The Insiders (3 students):* They know something others don't. E.g., they have already drafted the essay, or they know the topic is easy. Their private info suggests high probability.
      *   *The Saboteur (Optional but fun):* Someone incentivized to ensure the outcome *fails* (e.g., if price is high, they slack off). *Correction:* The prompt asks for insiders whose *private behavioural choices* partly determine the outcome.
      *   *Refined Roles:*
          1.  **The Whale:** Budget 500 (others 100). Secret goal: Make closing price > 80%. Prize if achieved.
          2.  **The Slackers (3 students):** Secret instruction: If the policy passes (No responses), you will *not* do the reading. This lowers the class average probability. They know this private info.
          3.  **The Grinders (3 students):** Secret instruction: You will study extra hard regardless.

  5.  **Timeline (90 Minutes):**
      *   00-10: Intro & Policy Setup.
      *   10-20: The Vote (Values).
      *   20-30: Market Explanation & Endowment.
      *   30-60: Trading Session (Beliefs).
      *   60-75: Role Reveal & Data Analysis.
