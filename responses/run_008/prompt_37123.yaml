answer: |-
  # Simulation Design: The Futarchy Lab
  **Course:** Institutions and Collective Choice (Upper-Level Seminar)
  **Class Size:** 24 Students
  **Duration:** 90 Minutes
  **Room:** Movable desks, projector, internet access (for shared spreadsheet)

  ## 1. The Policy and Outcome Variable
  To ensure the tension between *values* (what students want) and *beliefs* (what students expect) is palpable, the policy must offer immediate relief but carry long-term risk.

  *   **Policy Question:** "Should the mandatory weekly reading response logs be abolished for the remainder of the term?"
      *   *Value Proposition:* Students generally *want* less busywork (Vote Yes).
      *   *Belief Proposition:* Students may *believe* that doing the logs correlates with higher understanding and grades (Market Price Low).
  *   **Outcome Variable:** "Will the Class Average on the Term Essay (due in 4 weeks) be 70% or higher?"
      *   *Resolution:* This will be marked and verified at the end of the term. The market resolves then.
  *   **The Futarchic Metric:** For the purpose of the simulation, we define the 'success' of the class as achieving the 70% average. In a true futarchy, the policy is adopted *only if* the market predicts it increases the probability of this metric relative to the status quo.

  ## 2. Materials and Token Economy
  *   **Currency:** "GovCoins" (GC).
  *   **Endowment:**
      *   Standard Trader: 100 GC.
      *   The Whale (Secret Role): 1,000 GC.
  *   **Asset:** A contract paying **10 GC** if the Class Average on the Term Essay is ≥ 70%. Pays **0 GC** otherwise.
  *   **Market Mechanism:** The Instructor acts as the Automated Market Maker (AMM) using a shared Google Sheet projected on the screen.
      *   *Price:* Expressed as a percentage probability (0–100%).
      *   *Movement:* For every net 5 contracts bought, price increases by 2%. For every net 5 sold, price decreases by 2%. (Simple linear market maker for classroom speed).
  *   **Incentives:**
      *   **Top 3 Portfolios:** The three students with the highest GC balance at the end of trading receive a tangible prize (e.g., £20 book voucher or a 'Late Pass' token for a future assignment).
      *   **Secret Role Incentives:** See Role Cards below.

  ## 3. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Introduction & Policy Setup** | Explain the policy question and the outcome variable. Distribute GovCoins (digital or physical tokens). |
  | **10–20** | **The Vote (Values)** | Secret ballot on whether to abolish reading responses. Tally and display results immediately. Do not enact yet. |
  | **20–30** | **Market Briefing** | Explain the asset, the payout, and the trading rules. Project the Google Sheet. Open the book at 50%. |
  | **30–60** | **Trading Session (Beliefs)** | Students trade. Instructor updates price live. Midway (45 min), announce "Breaking News" (e.g., "Essay topic released early") to spur activity. |
  | **60–70** | **Market Close & Role Reveal** | Freeze prices. Reveal the Secret Roles. Ask those students to explain their strategy. |
  | **70–90** | **Debrief & Theory** | Map the exercise to Robin Hanson's Futarchy. Discuss manipulation, reflexivity, and scalability. |

  ## 4. Secret Role Cards
  *Print these on index cards and distribute to specific students before class begins. Instruct them not to reveal their role until the debrief.*

  ### Role A: The Whale (1 Student)
  > **Your Budget:** 1,000 GovCoins (Others have 100).
  > **Your Public Goal:** Maximise your portfolio value like everyone else.
  > **Your Secret Objective:** You are a partisan activist. You want the market price to close **above 80%**, regardless of the true probability.
  > **Win Condition:** If the closing price is > 80%, you automatically win a prize, even if your portfolio loses money.
  > **Strategy:** Use your budget to buy aggressively and drive the price up. If you run out of money, try to convince others to buy.

  ### Role B: The Slackers (3 Students)
  > **Your Budget:** 100 GovCoins.
  > **Your Secret Information:** You have privately agreed that if the Reading Responses are abolished (Policy Passes), you will stop doing the reading entirely.
  > **Implication:** You know that if the Policy Passes, the Class Average is *less likely* to hit 70%.
  > **Strategy:** Trade based on this private information. If the Vote result (shown at min 20) was 'Yes', you should sell. If 'No', you may hold.
  > **Note:** Do not reveal this plan until the debrief.

  ### Role C: The Grinders (3 Students)
  > **Your Budget:** 100 GovCoins.
  > **Your Secret Information:** You intend to work hard regardless of the policy. You believe the Essay Topic is easier than last year.
  > **Implication:** You believe the probability of > 70% average is higher than the market thinks (intrinsic value > 50%).
  > **Strategy:** Buy early and hold.

  *(The remaining 17 students are Standard Traders with no secret info.)*

  ## 5. Debrief Script and Analysis

  ### Part 1: Mapping the Divergence (10 Minutes)
  "Look at the board. We have two numbers.
  1.  **The Vote:** X% of you voted to abolish the reading responses. This aggregates your **values**. You want less work.
  2.  **The Market Price:** Y%. This aggregates your **beliefs**. This is the collective wisdom on whether abolishing responses will result in a 70% average.

  In a standard democracy, the Vote decides. If X is high, we abolish the responses.
  In a Futarchy, the Market decides *conditional on the metric*. If our metric is 'Academic Performance', and the market price implies that abolishing responses drops the probability of success below a threshold, the policy is vetoed.

  **The Central Bet:** Robin Hanson's argument is that voters are irrational about facts but honest about feelings. Markets are rational about facts but indifferent to feelings. Today, did those two numbers come apart? If the Vote was 'Yes' (We want this) but the Price was 30% (We don't think this works), you have just felt the friction futarchy is designed to resolve."

  ### Part 2: Addressing the Objections (10 Minutes)
  "Now, let us look at the cracks in the mechanism. I need to reveal three things that were hidden from you."

  *(Reveal the Whale, Slackers, and Grinders)*

  **Objection 1: Manipulation.**
  "The Whale tried to move the price to 80%. Did they succeed? If the price ended near 80% despite the Slackers knowing the truth, the market failed to aggregate information; it aggregated budget.
  *Futarchic Defence:* At a national scale, manipulating a market on GDP or mortality rates requires billions. The cost of manipulation exceeds the gain from policy distortion. In this room, the Whale's budget was 10x the norm. In a nation, no single actor is 10x the norm. Your experience shows manipulation is possible, but does it show it is *profitable* at scale?"

  **Objection 2: Reflexivity (Self-Fulfilling Prophecies).**
  "The Slackers held private info that *their own behaviour* determines the outcome. If the price went low, they might have felt justified in slacking. If the price went high, they might have felt safe.
  *The Problem:* In prediction markets, traders usually observe an external reality. Here, the traders *are* the reality.
  *Futarchic Defence:* Futarchy works best on metrics individuals cannot easily manipulate alone (e.g., national crime rates vs. one student's essay grade). This simulation exaggerates the reflexivity problem because your class is a tiny, closed system."

  ### Part 3: Limitations and Predictable Failures (5 Minutes)
  "Be honest about what this simulation cannot do.
  1.  **Liquidity:** Real prediction markets need deep liquidity to absorb the Whale. We had 24 traders. A national market has millions.
  2.  **Stakes:** You played for vouchers. Citizens bet with their livelihoods. Low stakes encourage noise trading.
  3.  **Time:** The market resolves in 4 weeks. National policies resolve over decades. Long time horizons discount information heavily.

  **What will go wrong today?**
  Predictably, the price will stick at 50% for too long because students are shy. The Whale will likely dominate the order book, scaring off standard traders. The Slackers may not trade aggressively enough because they fear revealing their identity. These are not bugs in futarchy; they are bugs in *classroom simulations* of futarchy.

  **The Takeaway:**
  Futarchy does not claim to be perfect. It claims to be *better than the alternative* when values and facts are confused. Today, you voted with your hearts and traded with your heads. If those two spoke different languages, the simulation worked."

  ## 6. Instructor's Cheat Sheet: Predictable Failures & Mitigation

  | Failure Mode | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **Price Stagnation** | Students are risk-averse with play money; no one wants to move first. | Instructor acts as a 'noise trader' in the first 5 mins to create spread. |
  | **Whale Dominance** | The Whale buys everything immediately, price hits 99%, trading stops. | Cap individual holdings at 20% of the pool to force negotiation. |
  | **Collusion** | Standard traders realise they can swamp the Whale by pooling funds. | Remind them secretly that pooling is against 'market rules', or allow it as a lesson in coalition formation. |
  | **Outcome Ambiguity** | Students argue later about whether the Essay Average was calculated fairly. | Define the calculation method precisely in the syllabus beforehand. |

  ## 7. The Honest Limitation (For the Instructor)
  **What this simulation cannot reproduce:**
  The **separation of measure and control**. In this class, the students *are* the voters, the traders, *and* the subjects whose behaviour determines the outcome. In a national futarchy, the traders betting on GDP are not necessarily the voters setting the tax rate, nor are they the millions of workers determining the GDP.

  This entanglement creates a **moral hazard** unique to small groups. The Slackers know their laziness pays off if they short the market *and* the policy passes. In a nation, an individual cannot meaningfully alter GDP to win a bet. You must emphasise in the debrief that the simulation *overstates* the risk of sabotage because the 'market' is too small to be impersonal.

  **British English Note:** Ensure all handouts use 's' instead of 'z' in words like 'organise', 'maximise', and 'programme'. Use 'mark' instead of 'grade' where appropriate (e.g., "Class Average on the Term Essay"). Currency should be referred to as '£' or generic 'GovCoins' to avoid USD confusion.

  ---
  *End of Simulation Design*
