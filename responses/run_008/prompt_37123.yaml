      *   *Spelling:* Programme, behaviour, colour, analyse, centre.
      *   *Tone:* Academic but engaging.
      *   *Honesty:* Acknowledge liquidity issues, noise, and the fact that classroom stakes are low compared to national policy.

  7.  **Addressing Specific Prompt Requirements:**
      *   *Policy:* Abolish Reading Responses.
      *   *Outcome:* Class Essay Average > 70%.
      *   *Materials:* Projector, Google Sheet, Index Cards (for roles).
      *   *Tokens:* FutaBucks. Prize: Voucher or Grade Token.
      *   *Secret Roles:* Whale, Slackers.
      *   *Debrief:* Map to Hanson's "Vote on Values, Bet on Beliefs." Address manipulation objection. Admit simulation limits (liquidity, stakes).
      *   *Predictable Failures:* Students treating it as a game, price sticking at 50, Whale running out of money or being too obvious.

  8.  **Refining the Futarchy Logic:**
      *   Futarchy says: Vote on the *utility function* (do we want higher grades or less work?), Bet on the *causal link* (does less work cause lower grades?).
      *   In this sim:
          *   Vote: Do you want to abolish responses? (Preference/Value).
          *   Market: What is the probability of high grades *if* we abolish responses? (Belief/Causal).
          *   Divergence: If Vote is 90% YES (We want less work) but Market Price is 20% (We believe grades will crash), Futarchy says: Don't do it (if the metric is grades).
          *   *Wait, standard Futarchy:* You vote on the *metric* (Maximise Grades vs Maximise Leisure). Then the market decides the policy that maximises the metric.
          *   *Prompt Constraint:* "First a straight vote on the policy... then a play-money prediction market."
          *   *Adjustment:* To fit the prompt's flow while teaching the concept:
              1.  Vote: Shows what they *want* (Preferences).
              2.  Market: Shows what they *expect* (Information).
              3.  Comparison: If Vote = Yes but Market Probability = Low, there is a tension between desire and expectation.
              4.  *Futarchy Twist:* In true Futarchy, the market *decides* the policy based on the metric. Since I can't let the market decide the policy *in class* (it needs to resolve later), I must simulate the *decision rule*.
              5.  *Revised Plan:* The Vote is advisory (Values). The Market is the "Futarchic Check." If the market price implies the policy fails the metric, the instructor (acting as the Algorithm) vetoes the vote.
              6.  *Actually, keep it simpler:* Just run both and compare. The lesson is the *divergence*. The prompt asks to "make students feel the central bet... that these two can come apart." Okay, divergence is the key.

