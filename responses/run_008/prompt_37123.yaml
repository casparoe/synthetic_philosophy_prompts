  10. **Predictable Failures:**
      *   Liquidity drying up.
      *   Students colluding.
      *   The "Winner's Curse" (insiders not trading aggressively enough).
      *   Boredom during trading.

  11. **Final Review against Constraints:**
      *   British English? Yes.
      *   24 students? Yes.
      *   90 mins? Yes.
      *   Secret roles? Yes.
      *   Real policy? Yes.
      *   Honest limitations? Yes.

