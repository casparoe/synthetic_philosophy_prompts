prompt: |-
  Quick context before the ask: I teach the giant intro ethics lecture here — around 300 students, four TAs, and final letter grades are ultimately my signature on the line. Our department policy says course grades come from numerical scores, but it doesn't say how the number turns into a letter, and every semester I get the same fight: a student lands at 89.6, the TA emails me asking whether that's an A- or a B+, and I never have a principled answer, just vibes and guilt. It's obviously a sorites problem wearing a registrar's costume — no single tenth of a point can be what flips the letter, and yet some tenth of a point apparently does — but I'm tired of doing freshman-year philosophy of language on a deadline while an actual freshman waits on the email.

  So here's what I want: a decision procedure my TAs can actually run when a score lands in the borderline zone (say, anything within a point of a cutoff), one page they can keep open while grading. It should have questions in an order, what counts as a sufficient answer to each question, and where the procedure terminates with a plain "no bump" versus where it stops and hands the call to me because the remaining question is one of values rather than facts.

  Ground it in what the vagueness literature actually says, but translate honestly. I'm thinking: epistemicism says there IS a fact about where the A-/B+ line is and we just can't know it — what does that counsel, a published sharp cutoff we pretend is the real one? Supervaluationism says the boundary sentences are neither true nor false but the cutoff-in-general structure is fine — what does that counsel, maybe a gap where we resolve cases individually? Degree theories want everything graded rather than cut — but our registrar literally cannot record "0.7 of an A-." Part of what I want the procedure to do is be honest that each theory, operationalized, just relocates the sharp edge somewhere else (if we round, the 89.55 becomes the new battleground), and to say where the TA should notice that and shrug.

  Two constraints the procedure has to respect: (1) whatever it tells us to do has to be defensible to the grade-appeals committee, meaning consistent across students and not obviously arbitrary on its face; and (2) it has to run in the five minutes a TA has before moving on to the next stack. If some step can't be done honestly in five minutes, say so and design around it.

  Then run it on three cases: (a) the 89.6 regrade request from a student who came to office hours all semester; (b) a regrade appeal where re-scoring three exam answers moves a student from 88.9 to 89.4, still below the line, and now they want the borderline procedure triggered again; (c) the TA who thinks the whole procedure is missing the point and wants to grade holistically with no numbers at all, on the theory that numbers create the false precision. Include at least one case where the procedure gives an answer I won't like, and flag every step that's really a judgment call wearing a procedure costume. And tell me what the procedure cannot do — I'd rather know its failure modes now than discover them in an appeal hearing in May.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Instructor of a large intro ethics course (300 students, 4 TAs).
      *   **Problem:** Borderline grades (e.g., 89.6%) cause stress/guilt. Department policy gives numerical scores but no conversion rubric. The instructor wants a principled, defensible decision procedure for TAs to handle borderline cases (within 1 point of a cutoff).
      *   **Philosophical Grounding:** Must acknowledge vagueness literature (Epistemicism, Supervaluationism, Degree Theory) but translate into practice. Acknowledge that operationalizing these theories just moves the sharp edge.
      *   **Constraints:**
          1.  Defensible to grade-appeals committee (consistent, non-arbitrary).
          2.  Fast (5 minutes per case).
      *   **Deliverables:**
          1.  A one-page decision procedure (ordered questions, termination points, hand-off points).
          2.  Application to three specific cases (89.6 w/ office hours, 88.9->89.4 regrade, TA wanting holistic grading).
          3.  Identification of "judgment calls wearing procedure costumes."
          4.  Identification of failure modes/what the procedure cannot do.
          5.  Include at least one outcome the instructor won't like (honesty constraint).

  2.  **Deconstruct the Philosophical Theories & Operationalize:**
      *   *Epistemicism:* There is a fact of the matter, we just don't know it. *Operationalization:* Set a hard rule (e.g., 89.5 rounds up) and stick to it. It acknowledges the edge exists but admits our specific choice is conventional.
      *   *Supervaluationism:* True on all precisifications vs. false on all. Borderline cases lack truth value. *Operationalization:* Create a "zone of indeterminacy" (e.g., 89.0-89.9). Inside the zone, look for external validators (attendance, improvement). If no validator, default to lower grade (conservative).
      *   *Degree Theory:* Truth comes in degrees. *Operationalization:* We can't give "0.7 A-", but we can weight qualitative factors to push the score over the threshold.
      *   *The "Moving the Edge" Insight:* Any rule (like "round up at .5") just creates a new borderline (89.49 vs 89.51). The procedure must admit this.

  3.  **Drafting the Decision Procedure (The "Borderline Protocol"):**
      *   *Goal:* 5 minutes, defensible, consistent.
      *   *Structure:* Flowchart style.
      *   *Step 1: Verify Eligibility.* Is it actually in the zone? (e.g., 89.0 - 89.99).
      *   *Step 2: Check for Mechanical Error.* (Standard regrade policy).
      *   *Step 3: Check for Pre-Announced Tie-Breakers.* (Did the syllabus say attendance counts? Did it say final exam weights more?). *Crucial for appeals.*
      *   *Step 4: The "Effort/Engagement" Check.* (Office hours, improvement). *Risk: Bias.*
      *   *Step 5: The Default.* If no tie-breakers apply, what is the default? (Usually down, for defensibility).
      *   *Hand-off:* When does the TA call the Prof? (When the procedure yields "No Bump" but the TA feels strong moral distress, or if the student claims disability/accommodation issues).

  4.  **Refining the Procedure for Constraints:**
      *   *Appeals Defense:* Needs to rely on syllabus statements or objective data (LMS logs), not "I like them."
      *   *Time:* Must be checklist style.
      *   *Philosophy:* Explicitly state that rounding *is* an epistemicist fiction we adopt for administrative peace.

  5.  **Developing the Three Cases:**
      *   *Case A (89.6 + Office Hours):* Standard bump case. Does office hours count? If syllabus says "engagement," yes. If not, it's arbitrary. *Decision:* Bump if engagement was pre-defined as a factor.
      *   *Case B (88.9 -> 89.4 via Regrade):* This is tricky. They are still below 89.5 (assuming 89.5 cutoff). Do they get the "borderline" treatment? Yes, they are in the zone (89.0-89.9). But they just got points. *Decision:* Apply protocol. If no other factors, stays B+. *Unpleasant outcome:* Student gets no bump despite fighting for points.
      *   *Case C (TA wants holistic):* This challenges the numerical premise. *Decision:* Procedure says "No." Numbers are the institutional reality. Holistic grading happens *within* the number assignment, not after.

  6.  **Identifying "Judgment Calls in Costume":**
      *   Defining the "Zone" (Why 1 point? Why not 2?).
      *   Defining "Engagement" (Is office hours better than discussion board posts?).
      *   The Default Direction (Why round down vs. up?).

  7.  **Identifying Failure Modes:**
      *   Bias (office hours favor the privileged).
      *   The "89.49" problem (the new sharp edge).
      *   Grade Inflation pressure.

  8.  **Review against Constraints:**
      *   *One Page?* Keep it tight.
      *   *5 Minutes?* Checklist format.
      *   *Philosophy?* Intro and Outro explain the theoretical underpinnings.
      *   *Unpleasant Outcome?* Case B is the candidate.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, philosophical but pragmatic, slightly weary but rigorous.
      *   *Structure:*
          1.  Philosophical Preamble (The "Why").
          2.  The Protocol (The "How").
          3.  The "Costume" Warning (Where the philosophy hides).
          4.  Case Studies.
          5.  Failure Modes.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "round up." The prompt asks for a procedure that handles the *vagueness*. A simple rounding rule is too blunt and ignores the Supervaluationist "gap" idea. I should propose a "Zone of Discretion" where the number doesn't decide, but *documented behavior* does. If behavior is neutral, default to the lower grade (conservative principle for appeals).

      *Revised Protocol Idea:*
      1. Is score in [89.0, 89.99]?
      2. Is there a syllabus-defined tiebreaker (e.g., Final Exam score)?
      3. Is there documented "Course Engagement" (defined objectively)?
      4. If yes to 2 or 3 -> Bump.
      5. If no -> No Bump.
      6. TA can flag for Prof if "Equity Concern" exists.

      *Wait, Case B:* 89.4 is in the zone. They got points via regrade. Do they get *another* look? Yes, but if they fail the tiebreakers, they stay B+. This is the "outcome you won't like" (student fights for points, gets into zone, still doesn't get A-).

      *Case C:* TA wants to ignore numbers. Protocol must shut this down for consistency/appeals reasons.

      *Philosophy Check:*
      *   Epistemicism = The Cutoff (89.5).
      *   Supervaluationism = The Zone (89.0-89.9) where truth is indeterminate until precisified by tie-breakers.
      *   Degree Theory = Rejected by Registrar, but acknowledged as the reason for the Zone.
      *   Moving the Edge = Acknowledged in the "Costume" section.

  10. **Final Polish:** Ensure the distinction between TA decision and Prof hand-off is clear. Ensure the "5-minute" constraint is met by making the criteria objective (LMS logs, not vibes).

      *(Final thought on the "Unpleasant Outcome")*: The most unpleasant outcome for a *professor* might be a procedure that forces them to deny a bump to a hardworking student because the "objective" metrics weren't met, exposing the bias of those metrics. I will make Case B the one where the student stays at B+ despite being 0.1 away, because the procedure prioritizes *consistency* over *mercy* to survive appeals.

      *(Final thought on "Judgment Calls")*: The choice of *which* tie-breakers count is the big one. Office hours favor students with time/flexibility. I must highlight this.

      Let's write it.cw
answer: |-
  # The Borderline Protocol: A Decision Procedure for Grade Cutoffs

  **Purpose:** To resolve numerical scores falling within the "Zone of Indeterminacy" (±1.0 point of a letter cutoff) consistently, defensibly, and within 5 minutes.
  **Philosophical Grounding:** This protocol treats the numerical cutoff as an *Epistemicist* administrative fiction (we pretend there is a sharp line), acknowledges a *Supervaluationist* zone where the number alone lacks truth-value (the borderline zone), and rejects *Degree Theory* for final reporting (the Registrar requires a letter).
  **Constraint:** This procedure prioritizes **defensibility** (consistency) over **mercy** (individual nuance).

  ---

  ## Part I: The Procedure (TA Checklist)

  **Step 1: Verify Eligibility (30 seconds)**
  *   **Q:** Is the final numerical score within the Zone of Indeterminacy? (e.g., 89.0 – 89.99 for an A-/B+ boundary).
  *   **No:** Assign the corresponding letter. **Terminate.**
  *   **Yes:** Proceed to Step 2.

  **Step 2: Check for Mechanical Error (1 minute)**
  *   **Q:** Has a regrade request already altered this score?
  *   **Yes:** Proceed to Step 3. (Do not re-evaluate the same exam questions).
  *   **No:** Proceed to Step 3.

  **Step 3: Apply Pre-Announced Tie-Breakers (2 minutes)**
  *   *Consult Syllabus. If the syllabus is silent, use the Department Default below.*
  *   **Q1 (Weighted Component):** Is the score on the Final Exam (or heaviest weighting component) above the cutoff threshold for the higher letter? (e.g., Did they earn an A- average on the exam itself?)
      *   **Yes:** **BUMP** to higher letter. **Terminate.**
      *   **No:** Proceed to Q2.
  *   **Q2 (Objective Engagement):** Is there objective LMS data indicating engagement above the class median? (e.g., Discussion board posts > median, Quiz completion 100% vs <100%).
      *   *Note: Do not use "Office Hours" here unless logged. Do not use "Vibes."*
      *   **Yes:** **BUMP** to higher letter. **Terminate.**
      *   **No:** Proceed to Step 4.

  **Step 4: The Default Rule (30 seconds)**
  *   **Q:** Have all tie-breakers failed to distinguish this student from the lower grade cohort?
  *   **Action:** **NO BUMP.** Assign the lower letter.
  *   **Rationale:** In a Supervaluationist gap where no precisification makes the higher grade "True," the conservative default protects against grade inflation and appeals.

  **Step 5: The Hand-Off (1 minute)**
  *   **Q:** Does applying the Default Rule create a specific equity concern? (e.g., The student has a documented accommodation that statistically depressed their LMS metrics despite mastery).
  *   **Yes:** **FLAG FOR INSTRUCTOR.** Do not email student. Send me the file with a note: *"Protocol followed, but equity concern exists re: Accommodation X."*
  *   **No:** Email student the grade. **Terminate.**

  ---

  ## Part II: The "Costume" Warning (Read Before Grading)

  This procedure is not magic. It is a judgment call wearing a procedure costume. You need to know where the seams are so you don't lie to students or me.

  1.  **The Edge Has Moved, Not Vanished:** By setting the Zone at 1.0 point, we admit 88.9 is a B+ and 90.0 is an A-. But what about 89.99 vs 90.00? We have simply moved the Sorites battleground from 89.5 to 89.0. We accept this because the Registrar demands a line.
  2.  **The "Objective Engagement" Bias:** Using LMS data or Exam Weighting is defensible to an Appeals Committee, but it is not philosophically neutral. It favors students with high test-taking speed or high digital literacy. It disadvantages students who work 30 hours a week (can't post on forums at 2 AM). We use it because *consistency beats fairness* in an appeals hearing.
  3.  **The Default Direction:** Step 4 defaults to the *lower* grade. This is a value judgment disguised as a rule. We could default up (benefit of the doubt). We default down to maintain the value of the higher letter. If you disagree with this value, you must Flag for Instructor (Step 5).

  ---

  ## Part III: Case Applications

  ### Case A: The 89.6 with Office Hours
  *   **Scenario:** Student has 89.6%. Attended office hours weekly. Wants A-.
  *   **Protocol Run:**
      1.  **Zone:** Yes (89.6 is in 89.0-89.9).
      2.  **Mechanical:** No regrade.
      3.  **Tie-Breakers:**
          *   *Exam Weight:* Assume Exam score was B+ level. (Fail).
          *   *Objective Engagement:* Office hours are **not** LMS data. Unless you logged every visit in the gradebook, this is anecdotal. (Fail).
      4.  **Default:** No Bump.
      5.  **Hand-Off:** No accommodation flagged.
  *   **Result:** **B+.**
  *   **Why you won't like it:** The student did the "right thing" (office hours), but because it wasn't quantified in the syllabus as a tie-breaker, the protocol ignores it to prevent bias (TAs like extroverts better).
  *   **Philosophical Note:** Epistemicism demands we stick to the rule we set, even if it feels wrong in this particular instance.

  ### Case B: The Regrade Appeal (88.9 → 89.4)
  *   **Scenario:** Student appeals specific exam questions. You agree, score moves to 89.4. Student now invokes Borderline Protocol to get the A-.
  *   **Protocol Run:**
      1.  **Zone:** Yes (89.4 is in 89.0-89.9).
      2.  **Mechanical:** **YES.** A regrade already occurred.
      3.  **Tie-Breakers:** Protocol prohibits re-evaluating the same work. Are there other tie-breakers? (Exam weight/LMS). Assume No.
      4.  **Default:** No Bump.
      5.  **Hand-Off:** No.
  *   **Result:** **B+.**
  *   **Why you won't like it:** The student fought for the points, got the points, entered the zone, and *still* loses. This feels like a bait-and-switch.
  *   **Defensibility:** This is your shield. If you bump them, the student with 89.6 who *didn't* appeal can claim arbitrary treatment. The procedure treats the 89.4 and 89.6 identically.
  *   **Philosophical Note:** Supervaluationism. The truth value of "This is an A- student" remains indeterminate even after the regrade precisification.

  ### Case C: The Holistic TA
  *   **Scenario:** TA argues, "Numbers are false precision. I want to assign the letter based on my holistic view of their writing."
  *   **Protocol Run:**
      1.  **Zone:** N/A.
      2.  **Constraint Check:** The procedure requires a numerical score first (Department Policy).
      3.  **Action:** **Reject.**
  *   **Result:** TA must assign a number first, then run the protocol.
  *   **Why you won't like it:** The TA is philosophically right (Degree Theory), but institutionally wrong.
  *   **Defensibility:** If the TA assigns a letter without a number, and the student appeals, we have no record of *why*. If the TA assigns a number (89.4) and follows the protocol, we have a paper trail.
  *   **Philosophical Note:** This is the "Registrar's Costume." We acknowledge the numbers are vague, but we must wear the costume to leave the building.

  ---

  ## Part IV: Failure Modes (What This Procedure Cannot Do)

  1.  **It Cannot Eliminate Bias:** By prioritizing "Objective Engagement" (LMS logs) over "Subjective Effort" (Office hours), we systematically advantage students with flexible schedules and high-speed internet. The Appeals Committee will accept this; your conscience might not.
  2.  **It Cannot Solve the 89.0 Problem:** A student with 88.9 who wrote a brilliant final paper gets a B+. A student with 89.0 who slept through the final gets a B+ (potentially bumped to A- if tie-breakers align). The 0.1 difference is still morally arbitrary. The procedure admits this but says *consistency is more important than perfect justice*.
  3.  **It Cannot Handle "The Squeaky Wheel":** If a student threatens an appeal, do not deviate from the protocol. If you bump one because they complained, you invalidate the protocol for the 300 others.
  4.  **It Cannot Replace Instructor Judgment on Equity:** Step 5 is the only escape valve. If a student's low LMS engagement is due to a documented crisis/accommodation, the TA *must* flag it. If the TA fails to flag it, the procedure will produce a result that is legally defensible but ethically bankrupt.

  **Final Instruction to TAs:**
  When a student asks, "Why didn't I get the bump?", your answer is not "Because I decided." Your answer is: *"The course uses a standardized protocol for borderline scores to ensure all students are treated equally. Your score fell in the zone, but the tie-breaking criteria did not support a change."* Then close the email.
