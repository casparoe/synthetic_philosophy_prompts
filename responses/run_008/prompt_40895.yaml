answer: |-
  Here is the specification sheet for a causal explanation of the rise of modern industrial capitalism, designed to adjudicate between Weberian and Materialist accounts.

  ### I. The Spec: Desiderata for Causal Adequacy

  #### A. Positive Requirements (What must be covered)
  1.  **The Differentiation Criterion:** The explanation must distinguish *modern industrial capitalism* from *mercantile/adventurer capitalism*. It is not enough to explain trade, profit-seeking, or banking (which existed in Rome, Song China, and the Islamic Caliphates). It must explain the shift to:
      *   Rational organization of free labor.
      *   Reinvestment of profit for expansion rather than consumption or status acquisition.
      *   Systematic, calculated efficiency over opportunistic speculation.
  2.  **The Spatial-Temporal Lock:** The explanation must account for the specific locus (Northwestern Europe) and timing (16th–18th centuries). It cannot be a universal theory of human greed or trade, or it fails to explain why those universals didn't trigger the outcome elsewhere/earlier.
  3.  **The Psychological Mechanism:** The explanation must provide a plausible account of the *motivational shift*. Why did elites and masses begin to accept deferred gratification, disciplined labor, and the normalization of profit-maximization as a moral or practical duty?
  4.  **The Secularization Path:** The explanation must account for the persistence of the "capitalist spirit" after the religious or ideological origin story faded. (i.e., Why do we still work like Calvinists in a secular age?)

  #### B. Negative Constraints (Methodological Sins)
  1.  **No Teleological Smuggling:** You cannot define the cause using the vocabulary of the effect. (e.g., Calling early merchants "proto-capitalists" or calling Protestantism "bourgeois ideology" before proving the link).
  2.  **No Cultural Black-Boxing:** You cannot simply say "Culture X promotes growth." You must open the box: *which* specific doctrines, rituals, or social sanctions altered behavior, and how?
  3.  **The Exogeneity Test (Causal Direction):** The proposed cause must be shown to vary independently of the effect. You cannot claim Religion caused Capitalism if the adoption of Religion was itself determined by pre-existing economic density. You cannot claim Material Conditions caused Capitalism if those conditions were engineered by actors with specific cultural goals.
  4.  **No Mono-Causal Closure:** While identifying a primary driver is allowed, the explanation cannot treat necessary background conditions (law, technology, geography) as irrelevant.

  ---

  ### II. Rigor vs. Camp Prejudices

  Not all demands on this list are methodologically sound. Some are ideological commitments disguised as scientific rigor.

  *   **Genuine Demand:** **The Exogeneity Test.** This is non-negotiable. If the cause and effect are mutually constitutive (endogenous), you have a description, not an explanation. Both sides frequently fail here.
  *   **Genuine Demand:** **The Differentiation Criterion.** If your theory explains Venetian trade in 1400 as well as British industry in 1800, your theory is too broad to explain the specific transition.
  *   **Camp Prejudice (Materialist):** **"Ideas have no causal power."** This is metaphysical materialism, not social science. It assumes ideas are merely epiphenomenal "superstructure." A rigorous explanation allows ideas to function as independent variables *if* they pass the Exogeneity Test.
  *   **Camp Prejudice (Weberian/Idealist):** **"Material conditions are just background."** This ignores that religious movements require surplus, literacy, and urbanization to spread. Treating material prep as irrelevant is as dogmatic as treating it as sufficient.
  *   **Camp Prejudice (Both):** **"The mechanism must be conscious."** Demanding that every actor consciously intended the outcome (e.g., "Calvinists wanted to build capitalism") is a strawman. Unintended consequences (e.g., working hard to prove salvation, accidentally accumulating capital) are valid causal pathways.

  ---

  ### III. The Tension: Microfoundations vs. Macro-History

  Your suspicion is correct: **There is a genuine methodological tension between the Microfoundations Requirement and the Macro-Historical Scope.**

  *   **The Conflict:** Weber's argument relies on *micro-level psychology* (individual anxiety about salvation leading to individual work discipline). However, the outcome is a *macro-level structural order* (global markets, industrial class systems, state bureaucracies) unfolding over centuries.
  *   **The Problem:** Aggregating individual psychology to systemic change is notoriously difficult (the "Coleman's Boat" problem). Even if every Calvinist worked harder, why did that result in *industrialization* rather than just a richer agrarian society? Conversely, Materialist explanations often nail the macro-structures (enclosure acts, colonial resource flows) but gloss over why individuals accepted the brutal discipline of the factory over traditional labor rhythms.
  *   **Verdict:** This is not laziness on your part; it is the central unsolved problem in historical sociology. An explanation that satisfies the Micro requirement often loses the Macro scale, and vice versa. A complete theory needs a "transmission belt" (e.g., institutions, laws, family structures) that converts individual ethic into systemic order. Most theories, including Weber's, leave this transmission belt under-specified.

  ---

  ### IV. The Knockout Requirement

  If you want to end the argument, the single requirement that does the most work is **The Exogeneity Test (specifically regarding Reverse Causality).**

  This requirement asks: **Did the proposed cause exist and vary *before* and *independently of* the economic outcome?**

  #### Why this knocks out the Standard Materialist Rival:
  Materialists often argue that capitalism arose because material conditions (technology, trade routes, resource availability) ripened.
  *   **The Kill:** The **Differentiation Criterion** combined with Exogeneity. Material conditions for high-commerce existed in Song China, Abbasid Baghdad, and Renaissance Italy. If material conditions were the *exogenous* driver, capitalism should have erupted there. It didn't. This forces the Materialist to admit that material conditions are *necessary but not sufficient*, requiring a "spark" (institutional or cultural) to explain the specific *type* of capitalism that emerged in NW Europe. It destroys "vulgar materialism" that treats culture as a mere shadow of economics.

  #### Why this knocks out Weber's Thesis (Empirically):
  Weber argues Protestantism (specifically Calvinist anxiety) caused the capitalist spirit.
  *   **The Kill:** The **Reverse Causality** check. Historical data suggests that many of the most commercially advanced cities (e.g., in the Hanseatic League or Southern Germany) adopted Protestantism *because* they were already commercially dense, literate, and resentful of Catholic tithes. The "ethic" may have been a *rationalization* of behavior that was already profitable, rather than the cause of it. Furthermore, Catholic regions (Flanders, Northern Italy) and later non-Protestant regions (Japan, South Korea) industrialized successfully.
  *   **The Verdict:** If Protestantism was selected *by* emerging capitalist classes for its utility, it is an intervening variable, not a root cause.

  #### How to use this in your argument:
  Demand that your housemate specify **when the cause became independent of the effect.**
  *   If he is a Materialist: Ask him to explain why the *material* conditions of 14th-century Florence didn't produce the *industrial* discipline of 18th-century Lancashire. (Forces him to admit culture/institutions matter).
  *   If he is anti-Weber: Ask him to explain why the *psychological* shift toward deferred gratification and rational labor occurred in Protestant regions *before* those regions became economically dominant. (Forces him to admit ideas might lead material change).

  **The Winner:** Currently, the **Exogeneity Test** weighs heavier against Weber. Modern cliometrics (e.g., Davies, Fisman, etc.) suggest that economic development predicted Protestant adoption more strongly than Protestantism predicted economic development. However, the **Differentiation Criterion** weighs heavier against crude Materialism.

  **The Synthesis:** The only explanation that survives both is one where **Material Preconditions** (trade, cities) created a *capacity* for capitalism, but **Institutional/Cultural Shocks** (like the fragmentation of religious authority in Protestantism) lowered the *transaction costs* for the specific *rationalized behavior* required for industrialization. Weber was right about the *spirit*, but wrong about the *causal arrow*; Materialists are right about the *fuel*, but wrong about the *engine*.
