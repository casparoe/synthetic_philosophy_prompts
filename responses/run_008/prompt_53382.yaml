  2. I propose labeling the first group "Pragmatically Susceptible Attitudes," which are mental states like belief or admiration that can be sustained by benefits unrelated to their correctness.
  3. The contrasting group I call "Stimulus-Bound States," covering perception and reflexive emotions where the phenomenology is causally locked to the object's presentation and resists utility-based justification.
  4. Amusement belongs to Stimulus-Bound States because you cannot genuinely find a joke funny solely for profit, while trust fits Pragmatically Susceptible Attitudes since it involves a voluntary evaluative leap.
  5. The dividing line is mediate control: if you can maintain the state by reasoning about its consequences rather than its object, it is Pragmatically Susceptible, otherwise it remains bound to the object's presentation.
