answer: |-
  This is an excellent question. You have put your finger on one of the most subtle and debated tensions in Hume's monetary theory. As a historian of economic thought, I can tell you that this passage often trips up readers because it seems to violate the very "neutrality of money" principle Hume establishes in the preceding sentences.

  To give you a robust answer, I will first unpack the historical context of the "crown vs. pound" remark, then brainstorm three possible readings of the apparent contradiction, and finally offer the interpretation that best aligns with Hume's broader system in the *Political Discourses*.

  ### 1. Unpacking the "Crown vs. Pound" Remark

  You asked whether Hume is referring to debasement, ordinary inflation, or both. The short answer is **both**, but his primary theoretical point is about **price inflation driven by the quantity of money.**

  *   **Historical Context:** Henry VII reigned from 1485 to 1509. Hume published this essay in 1752. Over those 250 years, two major monetary phenomena occurred. First, the "Price Revolution": the influx of silver and gold from the Americas increased the European money supply drastically, driving up prices. Second, there was currency debasement. While Henry VII maintained a relatively stable coinage, his son Henry VIII notoriously debased the currency to fund wars, and subsequent monarchs adjusted standards.
  *   **The Math:** A "crown" was a silver coin worth 5 shillings. A "pound" (£) was a unit of account worth 20 shillings (4 crowns). When Hume says "a crown in Harry VII.'s time served the same purpose as a pound does at present," he is observing that the general price level had roughly quadrupled.
  *   **The Theoretical Point:** Hume is illustrating the **Quantity Theory of Money**. He is arguing that the *real* purchasing power of the economy hasn't necessarily changed just because the *nominal* numbers are bigger. If you have four times the coin, prices become four times higher, and the "oil" (money) is just thicker, but the "wheels" (trade) turn at the same speed. This establishes the **neutrality of money** in the long run: multiplying the money supply does not make a nation fundamentally richer in terms of goods and services.

  ### 2. Brainstorming Three Readings of the Contradiction

  The tension you identified is: *If money is neutral internally (prices adjust), how can having more of it provide an external advantage?*

  Here are three ways historians and economists have interpreted this:

  **Reading A: The "Real vs. Nominal" Distinction**
  *   **The Idea:** Hume is distinguishing between *private welfare* and *state power*.
  *   **Explanation:** For the private citizen, money is neutral. If you have twice as much gold, but bread costs twice as much, you are no better off. However, the *State* operates in a geopolitical arena where power is often measured nominally. A state with a larger stock of precious metal can mobilize resources *faster* or project power further, even if the internal cost of living is higher.
  *   **Weakness:** This feels like a slight dodge. If prices are truly proportioned, the state's tax revenue (in real terms) shouldn't buy more soldiers than a poorer state, unless there is a friction in the market.

  **Reading B: The "Relative Wage" Mechanism (Your Hypothesis)**
  *   **The Idea:** Money is neutral *over time* within one country, but not neutral *across space* between two countries at a specific moment.
  *   **Explanation:** This aligns with your intuition. Britain has a high money stock, so British wages are high. France (or German principalities) has a lower money stock, so their wages are low. When Britain hires mercenaries, it is arbitraging this difference. It uses its "expensive" gold to buy "cheap" foreign labor. If Britain tried to hire its own subjects, it would have to pay the high domestic wage.
  *   **Strength:** This fits the text perfectly ("pay of all their servants must rise in proportion to the public opulence").
  *   **Weakness:** As you noted, if money flows out to pay mercenaries, shouldn't the money stocks equalize, washing out the advantage?

  **Reading C: The "Short-Run Non-Neutrality" Reading**
  *   **The Idea:** Hume is famous for arguing that while money is neutral in the long run, it is *not* neutral in the short run. An increase in money stimulates industry before prices rise.
  *   **Explanation:** Perhaps the "advantage" in war comes from the fact that rich trading nations are in a perpetual state of monetary expansion (due to trade surpluses). This keeps their industry active and their tax base robust compared to stagnant neighbors. The "plenty of money" signals a dynamic economy that can sustain debt and hiring better than a poor neighbor.
  *   **Weakness:** The passage specifically talks about hiring mercenaries from *poorer* neighbors, which suggests the advantage lies in the *poverty* of the neighbor (low wages), not just the dynamism of the employer.

  ### 3. The Most Plausible Reading: Structural Heterogeneity and Purchasing Power

  I believe the most historically and textually accurate reading is a refined version of **Reading B**. Hume is not contradicting himself; he is distinguishing between **internal equilibrium** and **international disequilibrium.**

  Here is how to square the circle:

  **1. Neutrality applies to "Real Income," not "Command over Resources."**
  When Hume says the plenty of money is of "no consequence" internally, he means it does not increase the *real wealth* (goods, land, labor capacity) of the nation. A crown under Henry VII bought a basket of goods; a pound in 1752 buys the same basket. The nation is not "richer" in stuff.

  **2. The Advantage is Relative, not Absolute.**
  The advantage in war arises because price levels are **not equalized across borders**. Hume assumes a world where money does not flow instantly to create perfect Purchasing Power Parity (PPP).
  *   **Domestic Sphere:** Prices and wages have already adjusted to the high money stock. Labor is expensive.
  *   **Foreign Sphere:** The "poorer neighbours" have a lower money stock relative to their population. Their wages are low.
  *   **The Mechanism:** The British state uses its high nominal wealth to purchase foreign labor at low foreign prices. This is a transfer of real resources (soldiers) from the poor country to the rich country, paid for by the flow of money.

  **3. Why doesn't it "Wash Out"?**
  You asked: *"Doesn't the neutrality claim just apply at the level of europe as a whole, in which case the advantage should wash out?"*

  This is the sharpest part of your critique. Hume actually addresses this in his companion essay, *"Of the Balance of Trade."* He admits that if Britain sends gold abroad to pay mercenaries, Britain's money supply shrinks and the neighbor's grows. Eventually, prices in Britain fall and prices in the neighbor rise. The advantage *does* dissipate over time.

  **However,** Hume argues that rich, trading nations (like Britain and Holland) are in a structural position to **replenish** that money stock continuously through trade surpluses. They are "reservoirs" of money.
  *   They earn more gold through trade than they spend on mercenaries.
  *   Therefore, they can maintain a high domestic price level (high wages for their own workers) while simultaneously exploiting the low price levels of their neighbors for military power.

  **Conclusion on the Passage**
  Hume is arguing that **money is neutral for welfare, but potent for power.**
  *   **For the Citizen:** It doesn't matter if you are paid in crowns or pounds, as long as bread costs proportionately less or more.
  *   **For the State:** It matters immensely if your neighbor's bread (and soldiers) costs less than yours, because your surplus gold allows you to command their labor without bidding up your own domestic wages.

  The "contradiction" dissolves when you realize Hume is describing a **core-periphery dynamic**. The "neutrality" holds for the closed system (the kingdom itself), but the "advantage" holds in the open system (international relations) where disparities in money distribution allow the rich to extract labor from the poor. The rich country essentially exports its inflation by hiring foreigners, preserving its domestic purchasing power while projecting military force.

  ### Summary for your Course
  If you need to articulate this in an essay or seminar:
  1.  **Clarify the Crown/Pound:** It illustrates the Quantity Theory (nominal values change, real purchasing power stays constant).
  2.  **Resolve the Tension:** Hume distinguishes between *internal welfare* (where money is neutral) and *external state capacity* (where money is a tool of leverage).
  3.  **The Mechanism:** The advantage relies on **wage differentials** between nations. Rich nations hire poor nations' soldiers because their labor is cheaper in real terms.
  4.  **The Caveat:** Acknowledge your insight about the advantage "washing out." Note that Hume believes trading nations can sustain this advantage longer because trade surpluses constantly replenish the money stock, preventing the equilibrium that would eliminate the wage differential.

  You have read the text very carefully; spotting this tension shows you understand the core of Hume's monetary theory better than many undergraduates!
