      *   *Wait, one more thing:* The user asks about "debasement... or ordinary price inflation." Under Henry VII, the coinage was actually relatively stable compared to Henry VIII. But by Hume's time, the cumulative effect of New World silver + debasement meant prices were roughly 4x higher. Hume is conflating the two to make a QTM point. I should clarify that.

  8.  **Final Polish:** Ensure the tone is academic yet accessible (Historian of Economic Thought persona). Check that all parts of the prompt are answered. (Readings, Resolution, Crown/Pound explanation).

