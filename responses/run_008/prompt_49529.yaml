prompt: |-
  you're a historian of economic thought, so maybe you can help me out with a passage from hume's 1752 essay "Of Money" (from the Political Discourses). I'm reading it for a course and there's one thing i can't quite square.

  Here's the passage:

  "MONEY is not, properly speaking, one of the subjects of commerce; but only the instrument which men have agreed upon to facilitate the exchange of one commodity for another. It is none of the wheels of trade: It is the oil which renders the motion of the wheels more smooth and easy. If we consider any one kingdom by itself, it is evident, that the greater or less plenty of money is of no consequence; since the prices of commodities are always proportioned to the plenty of money, and a crown in Harry VII.'s time served the same purpose as a pound does at present. It is only the public which draws any advantage from the greater plenty of money; and that only in its wars and negociations with foreign states. And this is the reason, why all rich and trading countries from Carthage to Great Britain and Holland, have employed mercenary troops, which they hired from their poorer neighbours. Were they to make use of their native subjects, they would find less advantage from their superior riches, and from their great plenty of gold and silver; since the pay of all their servants must rise in proportion to the public opulence. Our small army of 20,000 men is maintained at as great expence as a French army twice as numerous."

  I follow the first part fine — money is just the oil, and if prices adjust to the quantity of coin, then how much money a country has shouldn't matter internally, a crown under Henry VII doing the same work as a pound today. What throws me is what comes right after: if the plenty of money is "of no consequence" for a kingdom taken by itself, how can the public still draw an advantage from a greater plenty of money in its wars and negotiations with foreign states? feels like the two claims pull against each other. Is the idea something like: your domestic wages and prices rise along with your money stock, but foreign soldiers can be hired at the (lower) wage levels of their poorer home country, so your extra gold buys more abroad than it does at home? And if thats the mechanism, doesn't the neutrality claim just apply at the level of europe as a whole, in which case the advantage should wash out? Please think carefully and maybe brainstorm two or three possible readings of the passage before settling on the one you find most plausible. Also, could you unpack the crown vs. pound remark — is Hume talking about debasement of the coinage, ordinary price inflation, or both?
