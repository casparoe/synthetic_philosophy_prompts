  **SUPERVISOR'S ADDENDUM: NOTES ON WRITING STRATEGY**

  To ensure you hit the 6,000-word target for the final paper without fluff, keep the following structural advice in mind as you move from this proposal to the draft:

  1.  **Signposting:** In a 6,000-word paper, the reader needs to know where they are. Use subheadings. End each section with a sentence that links to the next. For example, end the Correlation section by saying, "But even if we solve the correlation problem, we still face the question of how much chance each person deserves."
  2.  **Objection and Reply:** Don't just state your argument. State the strongest objection to it, then reply. This adds word count and depth. For instance, when arguing for the Weighted Lottery, anticipate the objection: "But a lottery means some of the five might die even if they win!" Reply to this by distinguishing between the chance of rescue and the certainty of rescue.
  3.  **Concrete Details:** When describing the thought experiments, give them just enough detail to be vivid but not so much that they become stories. "David is on a raft" is better than "David, a father of two, is on a raft." The former focuses on the moral structure; the latter invites irrelevant emotional considerations.
  4.  **Precision in Probabilities:** When discussing the 50/50 vs 5/6 split, be mathematically precise. Explain *why* 5/6 is the number. (1 person vs 5 people = 1 share vs 5 shares = 1/6 total vs 5/6 total). This clarity demonstrates rigor.
  5.  **Avoid History:** Do not spend words explaining who Taurek was or when he wrote. Assume the reader knows. Use the word count for *your* argument.

