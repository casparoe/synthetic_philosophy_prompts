answer: |-
  ### The Comparative Interest Worksheet (CIW)

  This procedure is designed to fit within a 30-minute review window. It does not ask committee members to become philosophers. Instead, it forces consistency by separating **factual assessments** (neuroanatomy, procedure duration) from **value judgments** (how much suffering is worth how much benefit).

  The core mechanism is the **Interest-Weighted Burden (IWB)**. This number adjusts the raw "pain" of the procedure by the animal's probable capacity to experience it. This prevents discounting suffering simply because the species is small or unpopular, while acknowledging that a mouse may not suffer *exactly* as a dog does.

  #### Part 1: The Worksheet (15 Minutes)

  **Section A: Capacity for Suffering (Facts & Precaution)**
  *Goal: Estimate the animal's ability to experience pain/distress. Do not ask "Is it a pet?" Ask "Does it have the hardware?"*
  1.  **Neuroanatomical Evidence:** Does the species possess a nociceptive system and brain structures associated with pain processing (e.g., cortex, pallium)?
      *   *Yes (Mammals, Adult Fish, Cephalopods)* → **Capacity Factor: 1.0**
      *   *Uncertain/Developing (Fish Larvae < 5 dpf, Insects)* → **Capacity Factor: 0.5** (Precautionary Default)
      *   *No Evidence (Invertebrates w/o ganglia)* → **Capacity Factor: 0.1**
  2.  **Behavioral Evidence:** Does the species show trade-off behavior (e.g., limping, avoiding pain despite hunger)?
      *   *Yes* → Keep Factor.
      *   *No/Unknown* → Keep Factor.
      *   *Note:* If evidence is contested (e.g., fish larvae), **you must use the higher factor (0.5)** unless the applicant provides peer-reviewed evidence to the contrary. This is the **Precautionary Rule**.

  **Section B: Procedure Burden (Facts)**
  *Goal: Quantify the negative experience regardless of species.*
  1.  **Intensity:** Mild (1), Moderate (2), Severe (3), Death/Terminal (4).
  2.  **Duration:** Acute (<1 hr), Short (1-24 hrs), Long (>24 hrs).
      *   *Multiplier:* Acute (1.0), Short (1.5), Long (2.0).
  3.  **Raw Burden Score:** Intensity × Duration Multiplier.
  4.  **Interest-Weighted Burden (IWB):** Raw Burden Score × Capacity Factor (from Section A).

  **Section C: Scientific & Social Benefit (Facts)**
  *Goal: Quantify the positive outcome.*
  1.  **Probability of Success:** Low (<30%), Medium (30-70%), High (>70%).
  2.  **Magnitude of Benefit:**
      *   *Educational/Training* (Score: 1)
      *   *Basic Knowledge* (Score: 2)
      *   *Therapeutic/Diagnostic Application* (Score: 3)
  3.  **Benefit Score:** Probability (0.3/0.5/0.8) × Magnitude.

  **Section D: The Consistency Check (Value Judgment Point #1)**
  *Goal: Expose speciesism.*
  *   **The Swap Test:** "If we proposed this exact Protocol (same IWB, same Benefit) using a Dog or Cat, would we approve it?"
      *   [ ] Yes
      *   [ ] No
      *   [ ] Unsure
  *   *Instruction:* If "No" or "Unsure," the committee must explicitly state why the current species makes it acceptable. "Public perception" is **not** a valid reason. "Lower capacity for suffering" is only valid if reflected in Section A.

  #### Part 2: The Decision Matrix (10 Minutes)

  *Goal: Turn scores into a decision. The thresholds below are placeholders; the Committee must vote to set them once per year.*

  | Interest-Weighted Burden (IWB) | Benefit Score < 1.0 (Low) | Benefit Score 1.0 - 2.0 (Med) | Benefit Score > 2.0 (High) |
  | :--- | :--- | :--- | :--- |
  | **Low (0.1 - 1.0)** | Approve | Approve | Approve |
  | **Moderate (1.1 - 3.0)** | **Reject** | Conditional Approval* | Approve |
  | **High (> 3.0)** | **Reject** | **Reject** | Conditional Approval* |

  *\*Conditional Approval requires specific refinements to lower IWB or increased monitoring.*

  **Value Judgment Point #2:** The Committee must vote on the Thresholds above. This is where you decide how much suffering is "worth" a potential cure. This is not science; it is policy.

  #### Part 3: Final Vote (5 Minutes)
  *   Does the protocol pass the Matrix?
  *   Did the Swap Test reveal an inconsistency? If yes, does the committee have a *capacity-based* justification?
  *   Final Vote: Approve / Modify / Reject.

  ---

  ### Application to Current Protocols

  Here is how the CIW processes the three cases you described. I have used standard threshold settings (Moderate Burden + Low Benefit = Reject) to demonstrate the logic.

  #### Case 1: Mouse Efficacy Study (Moderate Pain, Speculative Payoff)
  *   **Section A (Capacity):** Mammal. **Factor 1.0**.
  *   **Section B (Burden):** Moderate Pain (2) × Long Duration (2.0) = Raw 4.0. **IWB = 4.0 (High)**.
  *   **Section C (Benefit):** Probability Low (0.3) × Therapeutic (3) = **Benefit Score 0.9 (Low)**.
  *   **Section D (Swap Test):** If this were a dog, would we approve a High Burden/Low Benefit study? **No**.
  *   **Matrix Decision:** High IWB + Low Benefit = **REJECT**.
  *   **Committee Reaction:** This will be politically difficult. Committees routinely approve "speculative" mouse studies. The CIW forces you to admit that if the science isn't strong enough to justify a dog, it isn't strong enough to justify a mouse, unless you argue the mouse suffers *less*. But since the IWB is "High" due to duration/intensity, the capacity factor (1.0) doesn't save it.
  *   **Outcome:** The protocol is returned. The PI must either increase the probability of success (better preliminary data) or reduce the burden (shorter duration/less pain).

  #### Case 2: Zebrafish Larvae (Contested Pain, Worse Science)
  *   **Section A (Capacity):** Larvae (<5 dpf), evidence contested. **Precautionary Rule applies → Factor 0.5**.
  *   **Section B (Burden):** Same procedure as Mouse (Raw 4.0). **IWB = 2.0 (Moderate)**.
      *   *Note:* The IWB is lower than the mouse, acknowledging the uncertainty/lower capacity.
  *   **Section C (Benefit):** Probability Low (0.3) × Therapeutic (3) = 0.9. *However*, scientific quality is "slightly lower" than the mouse version. Let's downgrade Magnitude to Basic Knowledge (2). **Benefit Score = 0.6 (Low)**.
  *   **Section D (Swap Test):** If this were a dog? **No**.
  *   **Matrix Decision:** Moderate IWB + Low Benefit = **REJECT**.
  *   **Committee Reaction:** Researchers often view fish larvae as "non-animal" ethical free passes. The CIW acknowledges they *might* feel less (Factor 0.5), but because the science is *worse* than the mouse version, the Benefit Score drops. The procedure flags that you are accepting *more* uncertainty in science for *uncertain* ethical gain.
  *   **Outcome:** Rejection. The committee cannot claim the fish "don't count" while admitting the science is inferior. If the science is worse, the ethical bar must be lower, but not low enough to pass a Moderate Burden.

  #### Case 3: Rat-to-Pig Teaching Exercise (Terminal, Anesthetized)
  *   **Section A (Capacity):** Pig (Mammal, high cognitive complexity). **Factor 1.0**.
  *   **Section B (Burden):** Death/Terminal (4) × Acute (1.0) = Raw 4.0. **IWB = 4.0 (High)**.
      *   *Note:* Anesthesia reduces pain intensity, but "Death" remains a burden in most ethical frameworks (loss of future life). If your committee counts death as a burden, this scores High. If you only count pain, score Intensity as 1 (Anesthesia). Let's assume your committee follows standard IACUC guidelines where "Euthanasia" is a burden category.
  *   **Section C (Benefit):** Educational/Training. **Magnitude (1)**. Probability High (0.8). **Benefit Score = 0.8 (Low)**.
  *   **Section D (Swap Test):** If we killed a dog for anatomy teaching? **Absolutely Not**.
  *   **Matrix Decision:** High IWB + Low Benefit = **REJECT**.
  *   **Committee Reaction:** **This is the politically unacceptable outcome.** The institute has likely already purchased the pigs. The argument will be "They are anesthetized, they feel nothing."
  *   **Procedure Counter:** The CIW forces you to define if "Death" is a harm. If you mark "Death" as a burden (which you do for rats), you must mark it for pigs. The Benefit (Teaching) is categorically lower than Research in the Matrix. The procedure reveals that you are upgrading the animal's capacity (Rat → Pig) without upgrading the benefit (Teaching → Teaching).
  *   **Outcome:** Rejection. The committee must either revert to rats (Lower IWB due to lower Capacity Factor if argued, or simply lower public/ethical weight) or find a non-terminal alternative.

  ---

  ### Limitations: Where the Procedure Misfires

  This procedure is a tool for consistency, not a moral oracle. You need to know where it breaks so you don't hide behind it.

  **1. The "Death" Problem**
  The CIW struggles to quantify the harm of death versus the harm of pain. In Case 3, if the committee decides "Anesthesia eliminates pain, so Burden = 0," the protocol passes easily. If they decide "Death is a harm," it fails. The worksheet cannot solve this; it only forces you to vote on it explicitly in **Value Judgment Point #2**. A principled committee must debate whether killing a pig for teaching is different than killing a mouse for teaching, beyond just "public opinion."

  **2. Aggregate vs. Individual Suffering**
  The CIW scores a *protocol*, not a *population*. If a fish study uses 5,000 larvae (IWB 0.5 each) vs. 50 mice (IWB 1.0 each), the math might favor the fish. But if the *aggregate* suffering of 5,000 larvae exceeds 50 mice, the worksheet might miss it unless you add a "Total Animal Number" multiplier to the Burden Score. I omitted this to keep it under 30 minutes, but a principled committee should consider total biomass/suffering.

  **3. The "Capacity Factor" Trap**
  Assigning a "0.5" to fish larvae looks objective, but it is a philosophical guess. If new science proves larvae feel pain like adults, the committee is liable for past approvals. The **Precautionary Rule** protects you ethically but annoys researchers. You must be prepared to defend the "0.5" not as fact, but as risk management.

  **4. Institutional Survival**
  If you apply this strictly, you may reject 40% of your protocols (like Case 1). This threatens the institute's funding. The procedure cannot solve the conflict between "Ethical Consistency" and "Business Model."
  *   **Where you must go beyond the procedure:** When the Matrix says "Reject" but the Committee votes "Approve," you must record a **Dissenting Rationale**. Do not hide the inconsistency. Write: *"Approved despite Matrix recommendation due to institutional priority on degenerative disease research."* This makes the value judgment visible, which is all you can ask for.

  ### Implementation Strategy

  Do not present this as "Anti-Speciesism." Present it as **"Risk Management and Consistency."**
  *   "This protects us from publicity scandals by ensuring we can justify every decision with the same math."
  *   "This reduces committee meeting time by standardizing the debate."
  *   "This handles the uncertainty on fish/insects by using a standard precautionary default."

  If they laugh at "Equal Consideration," tell them this is "Standardized Burden-Benefit Analysis." It is the same engine, just without the philosophy decals.
