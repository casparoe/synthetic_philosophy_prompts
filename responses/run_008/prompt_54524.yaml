answer: |-
  It is a pleasure to correspond with a fellow traveler in the sciences. Your spectroscopist's instinct—that the coin talk is a claim about populations rather than persons—is remarkably precise, and it serves as an excellent anchor for the explanation you owe your grandchildren. You have stumbled upon the exact friction point where Normative Game Theory (how rational agents *should* act) grinds against Descriptive Game Theory (how human beings *do* act).

  Here is a consideration of your three questions, structured for your Sunday session.

  ### Part 1: Was the procedure sound?

  Both your son and your granddaughter are correct, but they are operating under different axioms. The disagreement arises because "bad card" has two distinct definitions in this context.

  **Your Son's Standard: Normative Dominance**
  In standard decision theory, a strategy is "dominated" if there exists another strategy (or combination of strategies) that yields a higher expected payoff regardless of what the opponent does.
  *   **NONE vs. BOTH:** BOTH yields 4 tokens; NONE yields 1. BOTH strictly dominates NONE. Your son was right to cross out NONE.
  *   **BOTH vs. Mixed LEFT/RIGHT:** If the Raider plays LEFT 50% of the time and RIGHT 50% of the time, the expected payoff is 5 tokens (0.5 × 0 + 0.5 × 10), regardless of the Guard's choice. Since 5 > 4, the *strategy* of mixing LEFT and RIGHT dominates the *pure strategy* of playing BOTH.

  By the strict mathematical definition of rationality, BOTH is a "bad" card. It is an inefficient way to achieve randomization. If you could outsource the decision to a perfect random number generator, you would never play BOTH.

  **Your Granddaughter's Standard: Implementation Feasibility**
  Your granddaughter is arguing from physical and psychological constraints. She notes two things:
  1.  **The Deck Constraint:** The rules allow only cards, not coins. A mixed strategy is not a move; it is a *procedure for selecting moves*.
  2.  **The Human Constraint:** As your runs test proved, humans are terrible random number generators. We suffer from "alternation bias" (switching too often) and the "gambler's fallacy."

  If a player *cannot* execute a 50-50 mix reliably, then BOTH is not dominated. In fact, if a player attempts to mix mentally and fails (e.g., they subconsciously play LEFT 60% of the time), a clever Guard will exploit that pattern, driving the Raider's average payoff below 4. In this behavioral context, BOTH is a "safe harbor" card. It guarantees 4 tokens without requiring cognitive randomization.

  **Verdict:** The procedure was sound *mathematically* but unsound *pedagogically* for the specific players at your table. Your son pruned the decision tree based on ideal capabilities; your granddaughter pruned it based on actual capabilities. Neither is false, but they describe different worlds.

  ### Part 2: How to choose between standards for teaching?

  You ask if there is a principled way to choose, or if you must simply stipulate. I suggest you do neither. Instead, you should **model the distinction.**

  If your goal is to teach the youngest member something "true," you must decide which truth is more valuable for their development.
  *   **The Son's Truth:** Teaches calculation, expected value, and the concept of an "optimal solution." It is the truth of the laboratory ideal.
  *   **The Granddaughter's Truth:** Teaches risk management, self-knowledge, and the limits of human cognition. It is the truth of the field operation.

  **Recommendation:** Keep BOTH in the deck.
  Here is why: In the real world (and in physical chemistry), we rarely have access to perfect randomization devices, and we are often risk-averse. The BOTH card represents **variance reduction**.
  *   Playing LEFT/RIGHT is high variance: You get 0 or 10.
  *   Playing BOTH is low variance: You get 4, every time.

  For a child (or a family budget), the certainty of 4 tokens may be preferable to the gamble of 5 expected tokens, especially if a run of zeros early in the game discourages them. By keeping BOTH, you teach that "optimal" does not always mean "best for me." It introduces the concept of **Utility** versus **Value**. The Son is maximizing Value (tokens); the Granddaughter is intuitively protecting Utility (enjoyment/stability).

  Tell them: *"We keep BOTH not because the math is wrong, but because humans are not calculators. BOTH is a card for days when you don't trust your own brain to be random."* This validates the Son's math while honoring the Granddaughter's observation.

  ### Part 3: What is the "50-50" advice actually meaning?

  This is the profound question, and your spectroscopist's instinct is exactly right. When your son tells the Guard to "go 50-50 in her head," he is making a claim about **ensembles**, not **events**.

  **1. Unexploitability, not Randomness**
  The advice is not actually about generating a random sequence. It is about rendering your information useless to the opponent. In game theory, this is the **Minimax** principle. If the Guard plays Left 60% of the time, the Raider *should* (normatively) play Left 100% of the time to exploit that bias. The Guard's goal is not to be "random"; it is to make the Raider *indifferent* between playing Left or Right.
  The "50-50" instruction is shorthand for: *"Do not allow your history to predict your future."*

  **2. The Population Interpretation**
  You noted the claim is about populations. In Nash Equilibrium terms, a mixed strategy can be interpreted in two ways:
  *   **Temporal:** One player plays Left half the time over 100 rounds.
  *   **Population:** 50% of the population plays Left, 50% plays Right.

  Since your grandchildren cannot execute the Temporal version (due to the runs test failure), the advice is best explained as a **Target Frequency**. You tell them: *"You do not need to flip a coin. You just need to check your scorecard every ten rounds. If you have played 'Left' seven times, you must play 'Right' more often until the numbers balance."*
  This shifts the burden from "psychic randomness" (which is impossible) to "calibration" (which is a scientific skill they can learn).

  **3. The Empty Advice vs. The Real Signal**
  You worried the advice is empty if none can execute it. It is not empty; it is **asymptotic**.
  Think of it like temperature in thermodynamics. A single molecule does not have a temperature; temperature is a property of the aggregate. Similarly, "50-50" is not a property of a single round; it is a property of the session.
  When your son advises the Guard to go 50-50, he is advising them to adopt a strategy where the *long-run average* converges to equality. He is telling them: *"If you play this way, no matter what the Raider does, you will limit your losses to 5 tokens per round on average."*

  **How to explain this to the grandchildren:**
  Tell them the coin is not a magic wand for their hands, but a ruler for their history.
  *"Grandpa's son wants you to be like a perfect machine. Grandpa's granddaughter knows you are human. The truth is in the middle. You cannot flip a coin in your head. But you can keep score. If you notice you are protecting the Left Door too often, the Raider will learn to attack the Left Door. The '50-50' rule just means: Don't let the Raider learn your habits. If you have been Left too much, go Right. Not because a coin told you to, but because the Raider is watching."*

  ### Summary for Sunday
  1.  **On the Chart:** Your son is mathematically right; your granddaughter is psychologically right. Keep **BOTH** in the deck. It teaches that certainty has value, and that human limitations are part of the game environment. Cross out **NONE**, as it is strictly inferior even to humans (1 token is too little to justify the safety).
  2.  **On the Standard:** Do not stipulate. Explain that the "Simplified Chart" is for robots, and the "Full Chart" is for families.
  3.  **On the Coin:** Explain that "50-50" is not a command for the next move, but a goal for the last hundred moves. It is about making oneself unreadable, not random.

  You have designed a game that accidentally teaches the difference between Expected Value and Expected Utility, and between Normative and Descriptive theory. That is a fine legacy for a spectroscopist. Enjoy the evening.
