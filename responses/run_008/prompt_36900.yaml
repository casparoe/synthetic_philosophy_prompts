          *   **Nuance:** This is the "Skeptical Solution." It's not exactly "fiction" (which implies falsehood), but rather that meaning is grounded in *community agreement* and *assertibility conditions*, not truth-conditional facts. "Fiction" is a bit too strong/nihilistic, but "social construct" is closer.
