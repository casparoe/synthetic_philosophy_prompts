answer: |-
  **MEMORANDUM**

  **TO:** Promotional Mechanics Committee
  **FROM:** Backend Engineering & Risk Assessment
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposed "St. Petersburg" Coin-Flip Jackpot Promotion

  ### 1. Executive Summary

  The Committee has reviewed the proposed coin-flip jackpot mechanic. This promotion is a practical implementation of the **St. Petersburg Paradox**, where the theoretical expected value (EV) is infinite, but the realizable value is constrained by physical and financial limits.

  **Verdict:** **APPROVE WITH CONDITIONS.**

  We cannot approve the promotion as currently pitched by Marketing (relying on infinite EV for acquisition) nor as initially scoped by Finance (relying solely on a balance sheet cap). To proceed, we must reprice the entry fee to reflect the *truncated* expected value and strictly codify the liability cap in the game logic. We must also revise all marketing copy to remove references to "unbounded" potential.

  **Concrete Recommendations:**
  *   **Liability Cap:** Hard-coded at **$1,048,576 (2²⁰)**. This aligns with a clean binary cutoff and stays within Finance's "few million" constraint.
  *   **Entry Fee:** Minimum **$25.00**. This ensures a positive house edge based on the capped EV.
  *   **Disclosure:** The $1M cap must be prominent in the UI *before* purchase, not buried in Terms & Conditions.

  ---

  ### 2. Mathematical & Financial Analysis

  The core conflict arises from the divergence between theoretical probability and operational reality.

  **The Theoretical Trap**
  In the classic St. Petersburg game, the payout is $2^k$ (where $k$ is the number of flips). Since the probability of reaching flip $k$ is $1/2^k$, the expected value is $\sum (1/2^k \times 2^k) = \sum 1 = \infty$. Marketing's acquisition model relies on players perceiving this infinite value.

  **The Truncated Reality**
  Finance is correct that our liability cap ($L$) renders the EV finite. However, the reduction is logarithmic, not linear. If we cap payouts at $L = 2^N$, the expected payout becomes approximately $N + 1$ dollars.
  *   With a cap of **$1,048,576 ($2^{20}$)**, the mathematical expected payout is only **~$21**.
  *   If we set the entry fee at $5 (as Marketing hinted for acquisition volume), the player has a positive expected value of +$16 per game. The company would lose roughly $16 for every participant, regardless of volume.
  *   To maintain a standard house edge (approx. 15-20%), the entry fee must exceed the truncated EV. Hence, the **$25 minimum entry fee**.

  **Does the Cap Defuse or Relocate the Problem?**
  The liability cap **defuses the solvency risk** but **relocates the reputational risk**.
  *   *Solvency:* The cap prevents a ruinous string of heads from bankrupting the company. Financially, the paradox is solved.
  *   *Reputation:* The "Paradox" exists because humans do not value money linearly (diminishing marginal utility). By capping the game, we remove the mathematical infinity, but if we continue to market the "unbounded" nature of the game, we create a disconnect between player expectation and game reality. The cap relocates the risk from our balance sheet to our brand trust. If a player hits the cap and realizes the "infinite" growth stopped silently, they may view the mechanic as deceptive.

  ---

  ### 3. Addressing the Committee Conflict

  Two opposing views were presented during deliberation. While we are approving the mechanic, we must address the validity of the concerns raised.

  **The Rejectionist Argument (Colleague B)**
  *Argument:* "Something is deeply off about a game whose appeal rests on an infinite number that neither a player nor our company will ever actually experience."
  *Assessment:* **This concern is valid and must drive our marketing constraints.**
  Colleague B correctly identifies that selling "infinite EV" is effectively selling a mathematical abstraction that does not exist in our universe. Relying on this for acquisition is ethically precarious and potentially legally actionable (false advertising). The "appeal" of the St. Petersburg paradox is a cognitive illusion; building a product on that illusion risks player backlash when they realize the median payout is actually quite low (50% of games end on the first flip, paying $2).
  *Resolution:* We accept Colleague B's premise that the "infinite" appeal is illusory. Therefore, Marketing is prohibited from using "infinite," "unbounded," or "theoretical infinity" in any copy. The promotion must be sold as a high-variance lottery with a fixed maximum prize, not a mathematical exploit.

  **The Approvalist Argument (Colleague A)**
  *Argument:* "Any positive expected value means we should run it (with the liability cap disclosed in the terms)."
  *Assessment:* **This argument is financially unsound in this context.**
  Colleague A argues that if the EV is positive for the *player*, we should run it as a loss leader for acquisition. This fails to account for the variance profile of this specific game. Because the EV is driven entirely by extremely rare events (e.g., a 1-in-a-million flip sequence), the "positive EV" is not felt by 99.9% of players. They will simply see a $25 fee for a likely $2 return. This does not drive retention; it drives churn. Furthermore, a guaranteed loss per transaction cannot be justified by acquisition projections unless the Lifetime Value (LTV) is exceptionally high, which is not guaranteed for promo-seekers.
  *Resolution:* We reject the notion of offering positive EV to the player. The entry fee must exceed the truncated EV to ensure the mechanic itself is sustainable.

  ---

  ### 4. Implementation Requirements

  To proceed, Engineering and Product must enforce the following:

  1.  **Hard-Stop Logic:** The game server must enforce the $1,048,576 cap at the logic layer. If a coin flip sequence theoretically exceeds this value, the round must terminate *at* the cap automatically. There should be no "continue flipping" state once the cap is reached.
  2.  **Probability Disclosure:** In the game rules, display the odds of hitting the cap (approx. 1 in 1,048,576). Do not rely on players intuiting this from the coin flip mechanic.
  3.  **Bankroll Segregation:** Finance to segregate the promo liability. Given the high variance, we must ensure that a cluster of cap-hits in a short window (statistically unlikely but possible) does not impact operational liquidity.
  4.  **Regulatory Review:** Legal to review the "Cap Disclosure." In many jurisdictions, changing the rules of a game of chance mid-stream (i.e., stopping the doubling at a certain point without clear prior notice) is prohibited. The cap must be presented as a rule of the game, not a limitation of the company.

  ### 5. Conclusion

  The St. Petersburg Paradox is a fascinating mathematical curiosity, but it is a dangerous business model if treated literally. By capping the liability and pricing the entry fee against the *truncated* expected value, we convert this from a paradoxical risk into a standard high-variance gambling product.

  We approve the promotion only on the condition that we abandon the "infinite value" narrative. We are not selling a mathematical loophole; we are selling a lottery ticket with a very large, but finite, jackpot.

  **Signed,**

  *Backend Engineering & Risk Committee*
