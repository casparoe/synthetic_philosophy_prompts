      *   *Conclusion:* The most standard move is distinguishing the *proposition* (which represents) from the *complex* (which obtains).

  8.  **Final Polish:** Ensure tone is appropriate for a metaphysics seminar (rigorous, precise, acknowledging historical context). Make sure to directly answer "Which premise should I give up?" (It's usually 1 or 7, via the Prop/Fact distinction).

