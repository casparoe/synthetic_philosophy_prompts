  so I'm in this elective at my school called "reasoning under uncertainty" (its like half philosophy, half decision theory, the teacher is weirdly obsessed with betting examples) and this week we covered Dutch book arguments. I think I get the core idea: if your credences violate the probability axioms, like they don't add up right or two contradictory things sum to more than 1, then a bookie can offer you a bunch of bets where each one individually looks fine to you but the whole pacakge guarantees you lose money. that part makes sense to me.

