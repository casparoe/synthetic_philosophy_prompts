          5.  Closing Question (assessment of equipotence understanding).
          6.  What to decline/exclude (and how).

  2.  **Deconstruct the Friend's Objections (for context):**
      *   *Objection 1:* Hilbert's Hotel presupposes a finished totality to do the shifting. (Circularity claim).
      *   *Objection 2:* "Bigger infinities" is bookkeeping. If $N$ maps to $2N$, they are the "same collection," just filtered. (Part-Whole intuition vs. Hume's Principle).
      *   *Underlying Issue:* Confusing mathematical consistency with physical possibility.

  3.  **Determine the Pedagogical Strategy:**
      *   *Time:* 50 minutes is tight. Need focus.
      *   *Concept:* Actual vs. Potential Infinity is the core. Cantor's bijections are the tool to distinguish them.
      *   *Example:* Hilbert's Hotel is indeed risky. It feels like a paradox/trick. A better example needs to be static and structural, not dynamic (shifting guests). *Galileo's Paradox* (Squares vs. Naturals) is historically grounded and philosophically richer for this audience. It highlights the conflict between Part-Whole intuition and One-to-One correspondence directly.
      *   *Flow:* Intuition -> Conflict -> Definition -> Resolution -> Limits.

  4.  **Drafting the Plan - Section by Section:**

      *   **1. Order of Introduction (The Arc):**
          *   Start with the *intuition* of infinity (Potential).
          *   Introduce the *problem* (Can we treat it as a completed object?).
          *   Introduce the *tool* (Counting/Matching without numbers).
          *   Define *Actual Infinity* via that tool.
          *   Address the *conflict* (Part-Whole vs. Bijection).
          *   Conclude with *Coherence vs. Reality*.
          *   *Dependency:* You can't define Actual Infinity without a criterion for "sameness of size" that doesn't rely on counting (since counting never ends). So, Bijection must come before the definition of Actual Infinity is solidified.

      *   **2. The Single Carrying Example:**
