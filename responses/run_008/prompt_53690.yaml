          *   *Candidate:* The Line Segment. *Verdict:* Too geometric/calculus-heavy.
          *   *Candidate:* Galileo's Squares ($1, 4, 9, 16...$ vs $1, 2, 3, 4...$). *Verdict:* Best. It's static. It shows a proper subset mapping to the whole. It directly addresses the friend's "bookkeeping" objection (is it the same collection?).
          *   *Requirements:* Must show pairing. Must show the subset relation. Must avoid dynamic language ("moving," "shifting").

      *   **3. Misconceptions & Intervention Points:**
          *   *Friend's Objection 1 (Circularity/Totality):* Address when defining Actual Infinity. Clarify that the definition *stipulates* the totality to test coherence, not to prove physical existence.
          *   *Friend's Objection 2 (Part-Whole vs. Bijection):* Address during the Squares example. This is the crux of Hume's Principle.
          *   *First-Year: Infinity = Large Number:* Address immediately in the warm-up.
          *   *First-Year: Cantor proved infinity exists:* Address in the Coherence vs. Reality section.
          *   *First-Year: Equipotence = Identity:* Address when discussing "same collection."

      *   **4. Coherence vs. Instantiability:**
          *   This needs a dedicated slot near the end. The friend's argument conflated the two. The plan must explicitly separate "Does this concept contradict itself?" from "Does this exist in the physical universe?"

      *   **5. Closing Question:**
          *   Needs to test if they understand that equipotence allows a part to equal the whole, which is the defining feature of actual infinity.
