  5.  **Final Polish:** (Self-Correction during drafting)
      *   Make sure the "Cruxes" section clearly links to the "Test Cases."
      *   Ensure the distinction between *having* knowledge and *knowing that one has* knowledge is clear, as this is often where the bootstrapping debate hides.
      *   *British English:* Ensure "scepticism" (with c), "programme" (if used), "analyse" (verb).
      *   *Formatting:* Use clear headings and numbering.

