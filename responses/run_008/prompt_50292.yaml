answer: |-
  ### 1. Prediction of Verdict
  **Verdict:** Maya will rule that there **is a duty** to donate the kidney.

  **Reasoning:** Her track record demonstrates a commitment to a highly demanding moral principle that prioritizes the prevention of severe harm (death/loss of life) over significant costs to the agent. Crucially, Case 5 (the flooded river) establishes that she accepts *mortal risk* to the rescuer as insufficient to negate a duty to save a life. While kidney donation involves bodily intrusion, the mortality risk is statistically lower than wading into a flooded river, and the long-term health impact is described as negligible. Furthermore, Case 4 (the physician working indefinitely) suggests she does not recognize a "fair share" cutoff for sacrifice. The fact that she is the *only* compatible donor (unlike Case 3's overdetermination) further strengthens the obligation in her framework.

  ### 2. Two Distinct Rules Fitting the Track Record
  Here are two principles that explain Cases 1–5 equally well but yield opposite verdicts on the kidney case.

  **Rule A: The Principle of Comparable Sacrifice (Strong Beneficence)**
  *   **Formulation:** An agent has a duty to prevent a very bad outcome (e.g., death) if doing so requires sacrificing nothing of *comparable* moral importance. Money, leisure, time, and even exposure to physical risk are not comparable to a human life.
  *   **Fit:** This explains Cases 1–3 (money/leisure < life), Case 4 (leisure < community health/lives), and Case 5 (risk of death < certain death of swimmer, assuming probability weights favor rescue).
  *   **Kidney Verdict:** **Duty.** A kidney and recovery time are not of comparable moral importance to a colleague's life.

  **Rule B: The Principle of Bodily Sovereignty**
  *   **Formulation:** An agent has a duty to assist others using external resources (money, time, labor) and by accepting environmental risks, but has no duty to submit to invasive bodily procedures or the permanent alteration of their biological integrity.
  *   **Fit:** This explains Cases 1–4 (all involve external resources or time) and Case 5 (wading into a river is an environmental risk, not a surgical invasion or biological loss). None of the previous cases tested the boundary of bodily intrusion.
  *   **Kidney Verdict:** **No Duty.** Surgery violates bodily sovereignty, making the act supererogatory rather than obligatory.

  *(Note: A "Fair Share Exhaustion" rule fits poorly because Case 4 implies an indefinite commitment ("foreseeable future"), which contradicts the idea that one can discharge one's duty by meeting a specific quota.)*

  ### 3. Best Guess at Maya's Actual Rule
  **Guess:** Maya is running **Rule A (The Principle of Comparable Sacrifice).**

  **Reasons:**
  1.  **Consistency with Case 5:** The strongest evidence is her verdict on the flooded river. Most people intuitively distinguish between *risking* one's life (Case 5) and *surgically altering* one's body (Kidney). However, a strict Singerian logic treats both as costs to be weighed against the benefit of a life saved. If Maya accepts a *higher* probability of death in the river case, it is inconsistent to reject a *lower* probability of death plus recovery time in the kidney case, unless she holds a specific deontological constraint about bodily integrity. Given she is in an applied ethics seminar analyzing Singer, she is likely attempting to apply Singer's logic consistently.
