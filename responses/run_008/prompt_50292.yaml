  ### 4. The Single Diagnostic Case
  **Case:** **Bone Marrow Donation.**
  *   **Scenario:** Maya is asked to donate bone marrow to a stranger. The procedure requires anesthesia and needles (bodily intrusion) but the marrow regenerates fully within weeks (no irreversible loss). She has not yet exceeded her fair share of monetary giving in this hypothetical.
  *   **Why this is most diagnostic:**
      *   This case isolates the **Bodily Integrity** variable from the **Irreversibility** and **Fair Share** variables.
      *   If she says **Duty**: It undermines Rule B (Bodily Sovereignty). If she accepts marrow, the objection is likely not to "bodily intrusion" generally, but perhaps to "permanent loss." This pushes her closer to Rule A.
      *   If she says **No Duty**: It supports Rule B. It shows that the barrier is the *invasion of the body* itself, not the permanence of the loss.
      *   *Alternative Consideration:* You might suggest a case about donating *more money* (e.g., 20% income) to test the "Fair Share" limit. However, we already have strong evidence from Case 4 that she accepts indefinite high burdens. The Bodily Integrity constraint is the only major variable *not* yet tested in her track record. Therefore, testing the body is more diagnostic than testing the money.

