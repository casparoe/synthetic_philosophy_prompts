          *   *Status:* Non-negotiable for Jeffrey, but often violated by alternatives. Actually, Jeffrey conditioning *is* partition invariant *for the specific partition used*. But if I define the input differently (coarse vs. fine), does the output change? Yes, Jeffrey conditioning is sensitive to the partition chosen for the input. This is a known weakness (the "partition problem"). So, is it a desideratum that it *shouldn't* matter? Yes, ideally. But Jeffrey fails this.
      *   *(5) Handling Extremes (0/1 Priors):* If $P_{old}(E) = 0$, can we update?
