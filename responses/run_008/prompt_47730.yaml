answer: |-
  Here is a structured list of desiderata for updating on uncertain evidence, calibrated for a formal epistemology field exam. I have categorized them by their normative force (Non-negotiable vs. Contested) and highlighted the structural tensions between them.

  ### Desiderata for Updating on Uncertain Evidence

  **1. Certainty Reduction (The Limit Condition)**
  *   **Requirement:** If the new credence in the evidence proposition $E$ is 1, the rule must yield the same posterior as strict conditionalization on $E$.
  *   **Case:** Any rule claiming to *generalize* Bayesian updating must recover the standard rule in the limit of certainty. If it diverges here, it is not an updating rule but a rival theory of belief revision.
  *   **Status:** **Non-negotiable.** (Jeffrey conditioning satisfies this.)

  **2. Rigidity (Conservativity)**
  *   **Requirement:** For every cell $E_i$ in the evidence partition, the conditional probability of any hypothesis $H$ given $E_i$ must remain unchanged: $P_{new}(H | E_i) = P_{old}(H | E_i)$.
  *   **Case:** The "dog" example. The sensory experience shifts your confidence that the dog is barking, but it does not, by itself, change your theory about what barking implies (e.g., the correlation between barking and intruders). The input is a shift in the *marginals* of the partition; the *conditionals* should be carried over.
  *   **Status:** **Contested.** (This is the primary fault line. See "Incompatibilities" below.)

  **3. Commutativity (Order-Independence)**
  *   **Requirement:** If an agent receives two distinct bodies of uncertain evidence sequentially, the final credence function should be identical regardless of the order in which the updates are processed.
  *   **Case:** Rational convergence. If two agents receive the same total evidence but process the impressions in a different temporal sequence, they should agree. If a rule allows for "drift" or cycling based on order, it introduces an arbitrary instability into belief states.
  *   **Status:** **Contested/Preference.** (Highly desirable, but standard Jeffrey conditioning fails this generally.)

  **4. Partition Invariance**
  *   **Requirement:** The posterior credence in $H$ should not depend on how the agent partitions the evidence space, provided the total probability mass assigned to the relevant coarse-grained events is identical.
  *   **Case:** Representation independence. Whether you model the sound as $\{Bark, \neg Bark\}$ with $P(Bark)=0.7$, or refine it to $\{Loud\_Bark, Quiet\_Bark, \neg Bark\}$ with $P(Loud)+P(Quiet)=0.7$, the implication for downstream hypotheses (like "Intruder") should be the same.
  *   **Status:** **Contested.** (Standard Jeffrey conditioning fails this; the result depends on how the 0.7 is distributed across the refined cells.)

  **5. Regularity (Handling Extremes)**
  *   **Requirement:** The rule must provide a defined output even when the prior credence in the evidence is 0 or 1 (specifically 0, as 1 is covered by Certainty Reduction).
  *   **Case:** Dogmatism prevention. An agent should be able to learn from evidence they previously thought impossible. If a rule requires $P_{old}(E) > 0$ to compute $P_{old}(H|E)$, it cannot model radical belief revision or the correction of prior certainties.
  *   **Status:** **Non-negotiable** (for a complete theory), though standard Bayesian rules fail it.

  ---

  ### Incompatibilities: The "Thicket"

  You asked to flag subsets of desiderata that cannot be jointly satisfied. There are two major impossibility results relevant to your exam.

  **1. Rigidity vs. Reliability Sensitivity (The Unreliable Instrument)**
  *   **The Conflict:** You cannot jointly satisfy **Rigidity (2)** on object-level propositions and **Accuracy about Reliability**.
  *   **The Case:** In the "unreliable instrument" scenario, the faint sound is evidence not only about the dog ($D$) but also about your hearing reliability ($R$). If you update by shifting $P(D)$ while holding $P(Intruder | D)$ fixed (Rigidity), you ignore the fact that the *nature* of the experience suggests your reliability is low. Learning "I seem to hear a bark" *should* lower $P(Intruder | Bark)$ because it correlates with false positives.
  *   **The Cost:** To save Rigidity, you must move the evidence to a phenomenal partition (e.g., $\{Seems\_Bark, Seems\_Silent\}$). Rigidity holds for *seemings*, but not for *barks*. If you insist on Rigidity for the object proposition ($Bark$), you render the agent insensitive to evidence about their own reliability. **Camp:** "Radical Probabilism" (Jeffrey) accepts Rigidity on the chosen partition; "Classical Bayesians" (Christensen, Field) often reject Rigidity on object propositions in favor of modeling the observation explicitly.

  **2. Rigidity vs. Commutativity (Diaconis & Zabell 1982)**
  *   **The Conflict:** You cannot jointly satisfy **Rigidity (2)** and **Commutativity (3)** for general sequences of updates.
  *   **The Case:** Diaconis and Zabell proved that standard Jeffrey conditioning is not commutative. If you update on partition $\mathcal{E}$ then $\mathcal{F}$, the result differs from $\mathcal{F}$ then $\mathcal{E}$, unless the updates satisfy specific independence constraints.
  *   **The Cost:** To save Commutativity, you must abandon strict Rigidity (allowing conditionals to shift during the update) or restrict the domain of allowable inputs. Field (1978) proposed a constraint to restore commutativity, but it requires the agent to specify how the new evidence affects the old partition's probabilities, effectively demanding more input than a simple probability shift.

  **3. Partition Invariance vs. The Jeffrey Input**
  *   **The Conflict:** You cannot satisfy **Partition Invariance (4)** if the input is defined solely as a new probability distribution over a specific partition.
  *   **The Case:** Because Jeffrey conditioning weights the old conditionals by the *new* partition probabilities, refining the partition changes the weights unless the internal ratios are preserved.
  *   **The Cost:** To save Invariance, the input must be richer than a probability distribution (e.g., a likelihood ratio or a constraint on the rich space).

  ---

  ### Scorecard: Three Contenders

  **1. Strict Conditionalization (Pretending Certainty)**
  *   **Performance:** Fails the prompt's core mission.
  *   **Score:** Passes Certainty Reduction, Commutativity, Partition Invariance. **Fails** Handling Uncertainty (by definition), Regularity (0 priors), and Reliability Sensitivity (forces dogmatism).
  *   **Verdict:** Inadequate for the topic. It treats uncertain evidence as certain, violating the spirit of the exam question.

  **2. Jeffrey Conditioning (Standard)**
  *   **Performance:** The baseline, but structurally fragile.
  *   **Score:** Passes Certainty Reduction, Rigidity. **Fails** Commutativity (generally), Partition Invariance, and Regularity (undefined for 0 priors). Vulnerable to the Unreliable Instrument objection if applied to object propositions.
  *   **Verdict:** The standard view, but you must defend its failure of Commutativity and Partition Invariance as acceptable costs of maintaining Rigidity on the chosen partition.

  **3. Rich Space Conditioning (Modeling the Observation)**
  *   **Performance:** The "Classical Bayesian" escape route.
  *   **Score:** Passes Certainty Reduction, Commutativity, Regularity (if priors are regular), and Reliability Sensitivity. **Fails** Rigidity *on the object space* (conditionals on $Bark$ shift), though it saves Rigidity on the *phenomenal space* ($Seems\_Bark$).
  *   **Verdict:** Theoretically robust but computationally demanding. It dissolves the "uncertain evidence" problem by converting it into "certain evidence about sensations" in a larger model. Your exam task is to argue whether this expansion is legitimate or an evasion of the normative problem of uncertain input.
