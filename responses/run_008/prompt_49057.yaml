      *   **Goal:** A sequence of 9-10 interview questions (with follow-ups) to "pin the character down" before writing a scene where he is "wrong in a way I can respect."
      *   **Required Coverage:**
          1.  Mechanism (light/geometry vs. signs).
          2.  Inclination without necessity (distinguishability from no influence).
          3.  Rational Soul (boundary of influence).
          4.  The Bread (money/ethics of casting nativities).
          5.  Harmony (connection to cosmology/theology).
          6.  The Scoffer (concession to a skeptic who accepts orbits but rejects astrology).
      *   **Constraints:**
          *   Phrasing must be understandable to a man of 1610 (no modern stats/psychology).
          *   Follow-ups must anticipate his likely defenses.
          *   End with a flagging of questions where modern sensibility might smuggle in.

  2.  **Deconstruct Kepler's Mindset (Historical Context):**
      *   *Time:* Early 17th Century (1600-1630 roughly).
      *   *Worldview:* Neo-Platonic, Christian, Mathematical. The universe is created by God according to number and weight/measure.
      *   *Astrology:* Not "magic" in the modern sense, but natural philosophy. Aspects (angles) are real geometric harmonies. Zodiac signs are arbitrary human divisions (mostly).
      *   *Motivation:* Financial necessity (Imperial Mathematician pay was arrears), but also genuine belief in cosmic sympathy.
      *   *Key Texts:* *Mysterium Cosmographicum*, *Astronomia Nova*, *Harmonices Mundi*, *Epitome Astronomiae Copernicanae*, *Tertius Interveniens*.
      *   *Tone:* Defensive, precise, pious, slightly weary of patrons, proud of his mathematical rigor.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Mechanism.*
          *   *Draft:* How do the planets affect us? Is it light?
          *   *Refinement:* Needs to address why geometry matters more than signs. Kepler believed aspects (angles at the earth) were the cause, not the constellations.
          *   *Q1:* Focus on the "ray" or "species." Why does the angle matter more than the star picture?
          *   *Follow-up:* Anticipate him saying it's about the soul of the earth perceiving geometry.

      *   *Requirement 2: Inclination vs. Necessity.*
          *   *Draft:* If it's not necessary, how do you know it's there?
          *   *Refinement:* Needs to avoid "falsifiability" language. Use "weather" or "husbandry" analogies.
          *   *Q2:* If the stars only incline, like weather inclines a farmer, how do you separate the star's push from the man's choice?
          *   *Follow-up:* When he uses the weather/humor analogy, press on the *evidence*. How do you see the inclination distinct from the event?

      *   *Requirement 3: Rational Soul.*
          *   *Draft:* What about free will?
          *   *Refinement:* "Free will" is okay, but "Rational Soul" is more period-accurate. Where does the *Animus Rationalis* take over?
          *   *Q3:* Where does the celestial ray stop and the divine spark begin?
          *   *Follow-up:* If the body is swayed, can the soul be swayed to listen to the body?

      *   *Requirement 4: The Bread (Money).*
          *   *Draft:* Why do you take money for horoscopes if you hate astrologers?
          *   *Refinement:* Use his "foolish daughter" metaphor.
          *   *Q4:* You call Astrology the foolish daughter. Why feed her if she is foolish?
          *   *Follow-up:* When he says she feeds the mother (Astronomy), ask if the mother is starved by the daughter's lies.

      *   *Requirement 5: Harmony (Cosmology).*
          *   *Draft:* Is this connected to your music of the spheres?
          *   *Refinement:* Connect the *Harmonices Mundi* geometry to the astrological aspects. Is it one system?
          *   *Q5:* Are these aspects the same harmonies that tune the spheres?
          *   *Follow-up:* If yes, does denying the astrology break the cosmology?

      *   *Requirement 6: The Scoffer.*
          *   *Draft:* What would you say to someone who believes your orbits but not your astrology?
          *   *Refinement:* A specific contemporary skeptic (maybe a strict Aristotelian or a proto-materialist).
          *   *Q6:* A man grants you the ellipses but calls the aspects poetry. What is lost?
          *   *Follow-up:* Distinguish his "natural astrology" from "judicial astrology" (fortune telling).

      *   *Filling the Gaps (Need 9-10 questions total).*
          *   Need to expand on the Mechanism (Light vs. Geometry).
          *   Need to expand on the Theology (God's intent).
          *   Need to expand on the Error (Where does he admit he might be wrong?).

      *   *Revised Plan:*
          1.  Mechanism (Light/Geometry).
          2.  Mechanism (Why angles not signs).
          3.  Inclination (Distinguishability).
          4.  Inclination (The Soul's resistance).
          5.  The Bread (Daughter/Mother).
          6.  The Bread (Ethics of specific predictions).
          7.  Harmony (Connection to Music/Solids).
          8.  Theology (God's purpose in making influence readable).
          9.  The Scoffer (Orbits without Aspects).
          10. Self-Doubt (Where the art fails).

  4.  **Refining Language (1610s Tone):**
      *   Avoid: "Psychology," "Statistics," "Causality," "Empirical data," "Hypothesis" (in the modern sense).
      *   Use: "Faculties," "Humors," "Providence," "Species," "Rays," "Configuration," "Sublunary," "Necessity," "Contingency."
      *   Tone: Respectful but probing. An interlocutor who knows his work.

  5.  **Drafting the Content (incorporating follow-ups):**
      *   *Self-Correction on Q2:* Make sure the follow-up pushes on the *observation* of inclination.
      *   *Self-Correction on Q5:* Ensure the link between *Harmonices Mundi* and Astrology is clear.
