  At Thanksgiving my brother and my aunt (she's a nurse) got into it about our mom, and I couldn't tell who was winning. Mom's got early dementia and basically runs her life off her phone — reminders for pills, meals, appoinments, everything. My brother said the phone counts as part of her memory now: it's always on her, she trusts it more than her own head these days, and she checks it automatically, like the classic notebook thought experiment where the guy writes everything down and it's supposed to count as his memory. My aunt said that's romantic nonsense. Her point: the notebook case works because the notebook is treated exactly like internal memory, and mom's phone doesn't qualify — half the time she reads a reminder and doesn't belive it, she'll call one of us and ask whether she already took the pills even right after the phone told her. A reminder you second-guess isn't memory, it's a suggestion. My brother answered that this holds the phone to a standard her own brain doesn't meet — she doubts her biological memories too, probably more than she doubts the phone, and nobody concludes from that she has no memory at all. Occasional doubt only matters if it's the normal state, and it isn't. My aunt's last move was that he'd quietly lowered the bar: the whole idea was supposed to be external stuff that functions as well as internal memory, but if her internal memory is shot then "as good as that" is a pretty low bar — by his logic a post-it she half-trusts would count, and then anything counts. They dropped it when pie showed up. Can you go through the exchange move by move, say who's right about what at each step, and whether there's something both of them are missing? Please keep it under 300 words.
