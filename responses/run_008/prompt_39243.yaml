answer: |-
  Here is an audit of the exam analogy, the breakdown of its mechanics, and an evaluation of your friend's consequentialist critique.

  ### 1. The Correspondence Table

  To see where the logic holds and where it snaps, we first need to map the anatomy of the analogy.

  | Exam Analogy Element | Ethical Counterpart | Function in the System |
  | :--- | :--- | :--- |
  | **Total Possible Points** | **Total Moral Value / Utility** | The metric of "goodness." |
  | **The Grader** | **Moral Law / God / Conscience** | The authority assigning status (Right/Wrong). |
  | **Pass Mark (e.g., 60%)** | **The Threshold of Duty** | The line separating "Permissible" from "Wrong." |
  | **Required Questions** | **Obligatory Acts** | Actions you *must* perform to reach the threshold. |
  | **Failing a Required Question** | **Violating a Duty** | Results in moral blame/wrongdoing. |
  | **Extra Credit Questions** | **Supererogatory Acts** | Actions that add value but aren't required. |
  | **Skipping Extra Credit** | **Omitting Supererogatory Acts** | Permissible; incurs no blame. |
  | **Completing Extra Credit** | **Performing Supererogatory Acts** | Praiseworthy; earns moral merit. |
  | **The Ceiling (100%)** | **(Problematic)** | Implies a limit to moral demand. |

  ### 2. The Audit: Where the Mapping Breaks

  Your intuition is correct: the analogy is doing heavy lifting that obscures the actual philosophical problems. Here are the four critical fracture points.

  **A. The Ceiling Problem (Satisficing vs. Maximizing)**
  *   **Exam:** There is a hard cap (100%). Once you hit the pass mark, you are safe. Once you hit 100%, you cannot do "more." This creates a natural zone for "extra" (between the pass mark and the cap, or beyond the cap if the system allows >100%).
  *   **Morality:** Most ethical systems view moral demand as open-ended. There is no "100% good." You can always give more charity, care more, or sacrifice more.
  *   **The Break:** If there is no ceiling, where does duty end and supererogation begin? The exam analogy *smuggles in a ceiling* to create space for the optional. Without that ceiling, the "extra credit" section just looks like more "required questions" you haven't gotten to yet.

  **B. The Cost/Effort Disanalogy**
  *   **Exam:** Extra credit is usually *easy* (trivia, bonus puzzles). It is low-cost, low-risk.
  *   **Morality:** Supererogatory acts are often *costly* (running into a burning building, donating a kidney).
  *   **The Break:** The analogy makes supererogation look trivial. It suggests that going "above and beyond" is just picking up loose points on the floor. It fails to capture that supererogation often involves significant personal sacrifice, which is precisely *why* we don't make it a duty.

  **C. The "Blame While Passing" Problem**
  *   **Exam:** If you miss a required question but make up points elsewhere, you pass. You are not "blamed."
  *   **Morality:** In many deontological systems, violating a specific duty (e.g., lying) is wrong *even if* you do enough other good to be a "net positive" person.
  *   **The Break:** The exam allows aggregation (points sum up). Morality often does not. You cannot "make up" for a murder with ten acts of charity. The analogy implies morality is aggregative, which biases the view toward consequentialism.

  **D. The External Grader**
  *   **Exam:** A professor sets the rules.
  *   **Morality:** For many, moral obligations are agent-neutral or internal.
  *   **The Break:** The analogy implies morality is heteronomous (rules imposed from outside). This makes "duty" feel like compliance rather than rational commitment.

  ### 3. The Consequentialist Verdict

  **Your friend is largely right, but the analogy is hiding the ball.**

  Standard Act Consequentialism is a **maximizing** theory, not a **satisficing** one.
  *   **Satisficing:** "Do enough good to pass the threshold." (This fits the exam analogy).
  *   **Maximizing:** "Produce the *most* good possible." (This fits your friend's view).

  If morality is maximizing, the "Pass Mark" in the analogy moves constantly. It is always set at the maximum points achievable in that moment. Therefore, the "Required Questions" expand to fill the entire exam. There is no "Extra Credit" section because *every* point available is required to get the highest grade.

  **Does the conclusion survive the disanalogies?**
  Yes. In fact, the disanalogies strengthen your friend's point.
  1.  **No Ceiling:** Because morality has no ceiling, a maximizing theory demands you keep climbing forever.
  2.  **Aggregation:** Because consequentialism aggregates value (like exam points), it allows you to trade duties. If saving five people gives more "points" than keeping one promise, the "required question" changes.

  The exam analogy only supports supererogation because it assumes a **Satisficing Consequentialist** or **Deontological** structure (a fixed bar you can clear). Your friend correctly identifies that if you remove the fixed bar (the pass mark), the distinction between "duty" and "supererogation" collapses into "sub-optimal" vs. "optimal."

  *Counter-move:* Some consequentialists adopt **"Satisficing Consequentialism"** (do *enough* good, not the *most*). If your prof holds this view, the analogy works. If your friend holds standard Maximizing Consequentialism, she is right: the analogy is incompatible with her theory.

  ### 4. The Shallow Pond and the Collapse of Heroism

  You raised a crucial point: *If saving the child in the shallow pond is a "Required Question," does the Extra Credit section vanish?*

  **The Strain:**
  In the exam analogy, "Required" questions are standard difficulty. "Extra Credit" is bonus.
  In the Pond Case (Peter Singer), the act is low-cost/high-impact. If we classify this as Duty (Required), then the "Required" section of the moral exam becomes massive. It covers almost every interaction where we can prevent harm at low cost.

  **The Consequence:**
  This pushes Supererogation into a tiny corner: **High Cost / High Impact.**
  *   **Duty:** Save the drowning child (wet clothes).
  *   **Supererogatory:** Run into the burning building (risk death).

  **Does Supererogation Collapse?**
  It doesn't vanish, but it shrinks. It becomes reserved for **Saints and Heroes**.
  *   **The Analogy's Distortion:** The exam analogy makes "Extra Credit" seem like *bonus trivia*. But in this shrunk version, Supererogation is *extreme sacrifice*.
  *   **The Risk:** If the "Required" section expands too much (e.g., you must donate all income until you are as poor as those you help), then *everything* becomes duty, and supererogation collapses entirely. This is the **Overdemandingness Objection** to consequentialism.

  The analogy fails here because it doesn't track **cost**. An exam question's "cost" is time/effort, but failing it doesn't hurt you physically. Moral duties often involve sacrifice. If the analogy accounted for cost, the "Required" section would have a "Reasonable Cost" limit. Anything beyond reasonable cost would be Supererogatory.
  *   *But:* Consequentialism often rejects "Reasonable Cost" as a limit on duty. This is why your friend says the analogy breaks: it imports a "Reasonable Cost" limit (the pass mark) that her theory rejects.

  ### 5. A Better Analogy: The Floor and The Horizon

  The exam analogy fails because it has a ceiling, a grader, and implies aggregation. A better analogy needs to capture:
  1.  **Open-endedness** (No ceiling).
  2.  **Optionality** (You can stop without blame).
  3.  **Cost** (Going further is harder).

  **The Analogy: Hiking a Mountain Range**

  *   **The Terrain:** Morality is a vast mountain range.
  *   **The Floor (Duty):** There is a baseline altitude below which you cannot go without falling into a ravine (harming others, violating rights). Staying above this line is **Obligatory**. If you fall below, you are **Blameworthy**.
  *   **The Horizon (Supererogation):** Above the baseline, the mountains go up forever. There is no peak.
      *   Climbing higher is **Praiseworthy**.
      *   Staying at the baseline is **Permissible**.
      *   The higher you climb, the thinner the air and the harder the climb (increasing **Cost**).
  *   **The Grader:** There is no grader. The "ravine" is objective (harm), and the "view" is objective (good), but no one is grading your hike.

  **How this handles the Consequentialist Critique:**
  *   **Maximizing Consequentialism:** Says, "You must climb as high as physically possible until you collapse." (The Floor becomes the Peak). This eliminates the "Permissible" zone.
  *   **Deontology/Common Sense:** Says, "Don't fall in the ravine. If you climb higher, great. If you stay on the plateau, you're fine."
  *   **The Pond Case:** Saving the child is staying on the plateau (low effort to avoid the ravine of "letting a child die"). Running into the burning building is climbing a steep peak (high effort).

  **Why this is better:**
  1.  **No Ceiling:** The mountains go on forever (addresses the open-endedness).
  2.  **Cost Sensitivity:** Climbing gets harder the higher you go (addresses the heroism/sacrifice issue).
  3.  **No Aggregation:** You can't climb one small hill to make up for falling into a ravine elsewhere (addresses the "murder vs. charity" issue).
  4.  **Internalizes the Limit:** The limit isn't an arbitrary "pass mark" set by a professor; it's the "baseline of safety" determined by the terrain itself.

  **Conclusion on your Friend:**
  Your friend's conclusion survives the audit. The exam analogy *presupposes* that there is a limit to what can be demanded (a pass mark). Consequentialism (maximizing) denies that limit. The analogy doesn't prove supererogation exists; it just assumes a moral structure (Satisficing/Deontology) where supererogation is already possible. To argue for supererogation against a consequentialist, you can't use an analogy that assumes a ceiling; you have to argue that the "Floor" (Duty) has a logical limit based on reasonable sacrifice, which the **Hiking Analogy** captures better than the Exam.
