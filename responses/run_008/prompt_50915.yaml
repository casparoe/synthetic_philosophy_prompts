  **The pair**
  Dr. Aris tells patient Elena, who deeply values resilience, "Given your commitment to being a fighter, aggressive chemotherapy is the only choice consistent with your character." Aris sincerely believes this maximizes survival chances. Both patients face critical recovery thresholds requiring immediate behavioral change. The appeal is fully transparent, offers no threats, and engages Elena's reasoning via her avowed values, yet Elena later feels coerced by her own identity, trapped by the framing of dissent as cowardice.

  Therapist Ben places a full-length mirror at the end of rehab ward hallways to encourage mobility. Patient Marco walks faster unconsciously to see his reflection. Ben sincerely believes this aids physical recovery equally to verbal encouragement. The cue operates covertly regarding its therapeutic purpose without engaging Marco's deliberation, yet when told, Marco appreciates the aid and feels no violation, viewing it as helpful scaffolding.

  **Verdicts by account**
  Raz's reason-bypassing account classifies Aris's appeal as legitimate persuasion because it explicitly engages Elena's rational capacity for consistency, connecting means to ends through her own values. It labels Ben's mirror as manipulation because the environmental cue bypasses Marco's conscious deliberation entirely, triggering automatic behavior. Sunstein and Noggle's covert-influence account similarly fails both scenarios: it clears Aris because the influence is transparent and publicly avowable, whereas it condemns Ben because the therapeutic intent was hidden from view, ignoring that Marco welcomes the disclosure upon learning it. Gorik's pressure account struggles with Aris; since no external costs or incentives are imposed, it likely counts as persuasion, overlooking the internal pressure of identity constraint which functions like a threat. It correctly clears Ben as non-coercive. Only the exploitation account tracks intuition accurately: it identifies Aris's tactic as manipulative for preying on Elena's specific vulnerability to identity-consistency, treating her self-image as a lever to bypass refusal. Conversely, it clears Ben because the mirror exploits no psychological defect or vulnerability, merely facilitating a pre-existing goal through neutral architecture. The theories cross sharply: procedural accounts (Raz, Sunstein) validate the manipulative case and condemn the benign one, while the substantive account (Exploitation) aligns with intuition. This reveals that transparency and rational engagement are insufficient conditions for non-manipulative influence, highlighting the need for a normative assessment of the target's psychology. The divergence shows that what matters is not the route of influence, but whether that route compromises the agent's capacity for self-governance by leveraging weaknesses rather than strengths. Since benevolence is symmetric across cases, motive-based defenses are unavailable, forcing reliance on method. This isolates the mechanism as the sole variable, sharpening the conflict between procedural and substantive theories.

  **The discriminating variable**
  The pair turns on *vulnerability exploitation versus heuristic facilitation*. Aris targets a constitutive vulnerability (identity), making refusal psychologically costly despite no external threat. Ben utilizes a neutral heuristic (visual feedback) that aids agency without compromising it. This variable separates the accounts because reason-bypassing and covert-influence focus on the *process* (consciousness/transparency), whereas the intuitive verdicts depend on the *normative impact* on autonomy. Exploitation theory captures this by distinguishing between leveraging weaknesses that undermine endorsement versus tools that enhance capacity.

  **The strongest reply**
  The reason-bypassing account gets the pair most badly wrong, classifying the benign mirror as manipulation and the coercive appeal as persuasion. Its strongest defense redefines "bypassing" not as skipping consciousness, but as subverting rational control. A Razian could argue the mirror does not subvert control but extends it, whereas the identity appeal subverts control by making rational revision impossible. By shifting from a descriptive to a normative definition of rational engagement, the account can recover the intuitive verdicts. However, this requires abandoning the clear procedural test that made the theory attractive, effectively collapsing it into a version of the exploitation account. This suggests that reason-bypassing cannot stand alone as a procedural metric; it must incorporate substantive judgments about which psychological routes preserve agency. If "bypassing" means "undermining self-governance," then the theory survives but loses its distinctive simplicity, admitting that the moral weight lies in the effect on autonomy, not the mere absence of conscious deliberation.

  **Build audit**
  The cases generate verdicts through structural features, not stipulation. The oncologist's transparency and the physiotherapist's covert cue are explicit, forcing theories to confront their criteria. If the discriminating variable (vulnerability exploitation) is removed from the oncologist case—say, by appealing to statistics rather than identity—the intuition of manipulation vanishes, aligning with Raz. If removed from the physio case—say, by hiding a threat—the intuition shifts to manipulation. This confirms the pair isolates the variable successfully, demonstrating that transparency and rational engagement are insufficient markers for distinguishing manipulation from legitimate influence.
