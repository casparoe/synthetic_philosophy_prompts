answer: |-
  This phrase is the cornerstone of a specific branch of moral philosophy called **Contractualism**, most famously associated with the philosopher T.M. Scanlon. Your friend is using it to argue against Utilitarianism (the idea that you should just add up all the benefits and harms).

  Your skepticism is well-founded. This phrase is doing a lot of heavy lifting, and depending on how you define "reasonably," it can mean anything from a trivial tautology to a radical restructuring of how we value human lives.

  Here is a breakdown of the five distinct ways to interpret "no one could reasonably reject," ranked from the most trivial to the most philosophically robust, along with an analysis of whether they support your friend's specific claim about aggregation (the "one person vs. many" problem).

  ### 1. The Empirical Reading (Psychological)
  **Meaning:** "No actual person, given their actual psychology and biases, would say 'no' to this rule if asked."
  *   **Defensibility:** **Low.** People are irrational, spiteful, selfish, or misinformed. A principle could be morally good but still rejected by actual people (e.g., a racist might reject a principle of equality).
  *   **Supports Friend's Claim?** **No.** In your "tiny tax to save a life" scenario, many actual people might reject paying even a tiny tax if they don't know the beneficiary. In the "harm one to benefit many" scenario, the majority might actually vote to harm the one person. This reading leads to majority rule, not moral truth.
  *   **Circular?** **No.** It's an empirical claim about human behavior, but it fails to capture moral obligation.

  ### 2. The Rational Self-Interest Reading (Hobbesian)
  **Meaning:** "No person acting purely to maximize their own expected well-being would reject this rule."
  *   **Defensibility:** **Moderate.** This is a standard game-theory approach. It assumes people are rational calculators.
  *   **Supports Friend's Claim?** **No.** In fact, it undermines it. If you have a million people gaining \$10 and one person losing \$1,000, a rational agent behind a "veil of ignorance" (not knowing if they will be the loser) might accept the risk. The odds of being the loser are 1 in a million. The *expected value* is positive. This reading usually leads *toward* Utilitarianism (adding up the benefits), which is exactly what your friend is trying to avoid.
  *   **Circular?** **No.** But it leads to the wrong conclusion for your friend's argument.

  ### 3. The Moralized Reading (Trivial/Circular)
  **Meaning:** "No one could reject this without being morally wrong." Here, "reasonably" is just a code word for "morally correctly."
  *   **Defensibility:** **Logically safe, but useless.** It's hard to argue against, but it doesn't explain *why* something is wrong.
  *   **Supports Friend's Claim?** **Technically yes, but vacuously.** If you define "reasonable" as "aligned with the correct moral view on aggregation," then the phrase holds. But it offers no independent reason to think the view is correct.
  *   **Circular?** **Yes, viciously.** It basically says: "This principle is right because no one could rightly reject it." It assumes the conclusion it's trying to prove. If you ask, "Why is it unreasonable to reject this?" the answer becomes "Because it's wrong to reject it."

  ### 4. The Idealized Deliberative Reading (Rawlsian)
  **Meaning:** "No one would reject this if they were fully informed, impartial, and motivated to find rules everyone could live with."
  *   **Defensibility:** **High.** This moves away from actual psychology to an ideal standard of negotiation. It asks what we *would* agree to under fair conditions.
  *   **Supports Friend's Claim?** **Maybe.** It depends on the rules of the negotiation. If the negotiators are allowed to aggregate benefits (pool their small gains to outbid the one person's loss), the one person loses. If the negotiators are barred from pooling claims, the one person wins. This reading doesn't solve the problem on its own; it just moves the problem to "what are the rules of deliberation?"
  *   **Circular?** **Risk of circularity.** If "impartial" secretly means "someone who doesn't aggregate benefits," then it's smuggling the conclusion in again.

  ### 5. The Comparative Complaint Reading (Scanlon's Actual View)
  **Meaning:** This is the specific technical reading your friend is likely using. It means: "A principle is rejected if there is an alternative principle that generates a **stronger individual complaint** than the one currently generated."
  *   **Defensibility:** **Controversial but sophisticated.** This is the "radical" reading. It shifts the focus from "total welfare" to "individual standing." It claims morality is about justifying your actions to each person individually, not to the group as a blob.
  *   **Supports Friend's Claim?** **Yes, perfectly.** This is designed specifically to handle the aggregation problem you described.
      *   *Case A (Tiny cost to save life):* The one person facing death has a massive complaint. The millions facing a tiny cost have trivial complaints. The "strongest individual complaint" is on the side of the dying person. Therefore, the principle allowing the tiny tax is one no one could reasonably reject.
      *   *Case B (Harm one to benefit many):* The one person facing severe harm has a massive complaint. The millions facing small benefits have trivial complaints (or trivial complaints about *losing* those benefits). Scanlon argues you cannot add up a million trivial complaints to outweigh one massive complaint. You compare the strongest complaint on Side A to the strongest complaint on Side B. The single victim's complaint wins.
  *   **Circular?** **The Danger Zone.** This is where your intuition about "smuggling in fairness" is strongest. Critics argue that deciding which complaints are "stronger" already requires a moral judgment. If you say the victim's complaint is stronger *because* it's unfair to aggregate, you are circular. Scanlon tries to avoid this by grounding "strength of complaint" in the significance of the loss to a human life, but many philosophers think the "no aggregation" rule is an input, not an output, of this system.

  ### Summary: What Your Friend Is Actually Doing

  Your friend is using **Reading #5 (The Comparative Complaint Reading)**.

  When they say the framework "handles that without adding up the little benefits," they are invoking a specific rule of Contractualism: **Individualism.** The theory posits that you must justify your action to every individual affected. You cannot tell the one person being sacrificed, "Well, your loss is outweighed by the sum of everyone else's gain." You have to tell them, "Your loss is outweighed by *someone else's* gain." If no single person gains enough to justify that victim's loss, the action is forbidden.

  **Is it defensible?**
  It is defensible if you believe morality is about **relationships and justification** between individuals. It is indefensible if you believe morality is about **maximizing overall good states of affairs**.

  **Is it circular?**
  It borders on circularity. The definition of "reasonable" in this framework effectively means "consistent with the idea that individuals cannot be sacrificed for the aggregate." If you don't already accept that individuals shouldn't be sacrificed for the aggregate, the phrase "no one could reasonably reject" won't convince you of it. It protects the conclusion by defining the premises.

  **The Verdict:**
  You lost the thread because your friend switched from a general English meaning of "reasonable" to a highly technical philosophical definition. In normal English, it seems reasonable to save a million people from a headache even if one person breaks a leg. In your friend's specific philosophical framework, "reasonable" is defined in a way that forbids that math. They aren't using the phrase to *discover* the answer; they are using the phrase to *enforce* a specific view of human value that prioritizes the worst-off individual over the sum of the crowd.
