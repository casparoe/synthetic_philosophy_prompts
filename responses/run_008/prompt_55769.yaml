      *   *Confidence:* I need to be honest. Philosophy isn't math. I should express high confidence on the *existence* of the tension, but moderate confidence on the *resolution*, acknowledging different Buddhist schools differ.
      *   *Least Sure:* Probably the specific resolution of Moral Desert. Some Buddhist tantras or specific schools might argue for a form of desert that doesn't require a self. I should flag that.

  8.  **Refining the content (Self-Correction during drafting):**
      *   *Correction:* Wait, the user asked for confidence levels on *my calls*. I need to rate how sure I am that X and Y are in tension.
      *   *Correction on Rebirth:* The user says "causal/continuity stream." This is the standard Buddhist view (dependent origination). The tension isn't really (2) vs (1), it's (2) + (1) vs (3).
      *   *Refining the "Desert" point:* This is the trickiest. Theravada often frames karma as natural law. Mahayana might frame it differently. But "Desert" (retributive justice) is very Abrahamic. Buddhism is usually consequentialist regarding karma (action -> result). So (4) is the outlier belief compared to standard Buddhism *and* (1).
      *   *Refining the "Retirement" point:* This is the "Parfitian Reductionism" problem. The standard Buddhist fix is the Two Truths. I should explain that clearly.

  9.  **Final Polish:** Check against constraints.
