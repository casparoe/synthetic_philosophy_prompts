  This is a classic "tainted achievement" problem, and your board's track record is actually quite sophisticated. You have implicitly developed a multi-factor test, but this new case forces two of your underlying principles into direct conflict.

  Here is the breakdown of your board's jurisprudence, how it applies to the doctor, and the commitments involved.

  ### 1. The Two Competing Rules
  Based on your five past decisions, two distinct rules explain your track record, but they yield opposite results for the doctor.

  **Rule A: The Causal Taint Principle (Inseparability)**
  *   **The Logic:** If the specific achievement being honored is *causally dependent* on the wrongdoing, the honor is compromised. You cannot separate the good from the bad because the good *is* the bad (or was produced directly by it).
  *   **Fits Cases:**
      *   *Case 1 (General):* The honor was *for* the defense of slavery. (Honor = Wrong).
      *   *Case 3 (Industrialist):* The donation (honor) existed *because* of the labor practices (wrong). (Resource = Wrong).
      *   *Case 5 (Living Donor):* The wealth (honor) existed *because* of abuse (wrong).
  *   **Prediction for Doctor:** **Remove.** The serum (honor) exists *because* of the non-consensual trials (wrong). They are the same event. Under this rule, the "era norms" don't matter; the causal link taints the monument.

  **Rule B: The Contemporaneous Contestation Principle (Era Norms)**
  *   **The Logic:** We judge the honoree by what was knowable and challenged *at the time*. If the behavior was standard, unchallenged, and "unremarkable" for that class/era, we retain the honor with context. If it was actively contested (strikes, campaigns), they knew better, and we remove it.
  *   **Fits Cases:**
      *   *Case 2 (President):* Vile views were "unremarkable for the time." -> **Keep.**
      *   *Case 3 (Industrialist):* Labor practices were contested by strikes/newspapers *while alive*. -> **Remove.**
      *   *(Case 1 fits here too, loosely: By the 1920s, the "Lost Cause" ideology was contested by Black citizens and allies, even if the heritage group ignored it.)*
  *   **Prediction for Doctor:** **Keep + Plaque.** Research ethics did not exist; nobody objected at the time. This matches Case 2 (President) perfectly: "For his time and class this was unremarkable."

  ### 2. The Closest Precedent
  **Structurally, Case 3 (Industrialist) is your closest precedent.**

  *   **Why:** In Case 2 (President), the wrong (views) was *abstract* and separate from the right (building the campus). You can have the campus without the views.
  *   In Case 3 (Industrialist) and the **Doctor Case**, the wrong is *instrumental*. The money for the donation came from the labor; the serum came from the trials. The "good thing" is the direct fruit of the "bad thing."
  *   **The Conflict:** The only difference between Case 3 and the Doctor is *contestation*. The Industrialist faced strikes; the Doctor faced silence (because ethics boards didn't exist).
  *   **The Decision Point:** Your board must decide if Case 3 was removed because the labor was *exploitative* (Causal Taint) or because it was *contested* (Contestation).
      *   If you believe Case 3 was removed because **exploitation is inherently disqualifying**, you remove the Doctor.
      *   If you believe Case 3 was removed because **he knew better and did it anyway**, you keep the Doctor.

  ### 3. Implicit Commitments
  Whichever way you go, you are setting a precedent for how the city values historical context versus victim restitution.

  **If you recommend Removal (Prioritizing Causal Taint):**
  *   **Commitment:** You are establishing that **outcomes do not justify means**, even if the means were legal/standard at the time.
  *   **Signal:** You prioritize the descendants of the orphans over the historical reputation of the medical community. You acknowledge that "standard practice" can still be commemorative disqualifier if it involves non-consensual harm to vulnerable populations.
  *   **Risk:** You open the door to reviewing any historical figure whose achievements relied on now-unacceptable standards (e.g., founders who used indentured servitude, architects who used segregated labor).

  **If you recommend Retention + Plaque (Prioritizing Era Norms):**
  *   **Commitment:** You are establishing that **historical context is the primary mitigator**. If the city didn't know better then, the city doesn't punish now.
  *   **Signal:** You prioritize the scientific legacy and the "greater good" of the serum over the specific rights of the orphan subjects. You treat the statue as a historical record of medical progress, warts and all.
  *   **Risk:** You signal to the descendants of the orphans that their ancestors' lack of consent is less important than the doctor's reputation. It may feel like the "unremarkable for the time" defense (Case 2) is being expanded to cover physical harm, not just speech/views.

  ### 4. The Tie-Breaker Hypothetical
  To help your board clarify which rule actually governs you, propose this hypothetical case at your next meeting. It isolates the "Method vs. Norms" tension without the emotional weight of medical trials or slavery.

  **The Hypothetical:**
  > "A statue of a 1950s City Engineer honored for designing the interstate bypass that saved the downtown from traffic collapse (Public Good). We discover the route was intentionally plotted to bulldoze a thriving Black business district (Public Harm). At the time, this was standard federal urban planning policy, fully legal, and faced no organized legal challenge until the 1970s."

  **How it splits the rules:**
  *   **Causal Taint Rule:** The highway's success (traffic flow) was *dependent* on the destruction of the district (route choice). **Prediction: Remove.**
  *   **Contestation Rule:** This was standard policy and unchallenged at the time (like the Doctor's trials, unlike the Industrialist's strikes). **Prediction: Keep + Plaque.**

  **Why this helps:**
  If your board instinctively says, *"No, you can't honor a highway built on destroyed homes, even if it was legal then,"* then you are a **Causal Taint** board. You should remove the Doctor.

  If your board says, *"That was the law then; we can't judge 1950s planning by 2020s standards, so we add a plaque,"* then you are a **Contestation** board. You should keep the Doctor.

  ### Recommendation
  Given that you have living descendants of the orphans in town, **Case 3 (Industrialist)** is the safer ethical anchor, even though the "contestation" element is missing. The "unremarkable for the time" defense (Case 2) works for *views* (speech), but your board has been much stricter when *physical harm or exploitation* is the engine of the achievement (Cases 1, 3, 5).

  The "unremarkable" defense usually protects *beliefs*, not *bodies*. Since the doctor's achievement required the use of children's bodies without consent, that aligns closer to the Industrialist's labor than the President's views.

  **Consistent Recommendation:** Remove the statue to a museum context (preserving the history, removing the honor) with an exhibit detailing both the serum's impact and the trials' cost. This honors the science without honoring the method.
