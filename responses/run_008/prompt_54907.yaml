prompt: |-
  I sit on the editorial board of a small literary magazine (I write novels myself, this is my unpaid penance) and we have a mess with our annual short-story prize. A shortlisted entry, submitted under a pen name, may have been written partly by an AI — someone ran it through detection software, but those tools seem about as reliable as a polygraph at a family reunion. Our rules only say entries must be the entrant's own unaided work, and we never defined unaided or said what would count as evidence. Half the board wants to interview the author and decide based on that; the author has agreed to answer questions but only in writing, no video, which makes it even more like a Turing setup. The other half says that's exactly the wrong kind of test: we're not trying to establish whether a mind exists, we're trying to figure out what happened at the keyboard, and how someone talks about a story afterward doesn't settle how it got written. I have to draft the board's decision memo before our announcement date in two weeks. Please write it: a concrete recommendation we can act on in that window (e.g. accept, disqualify, accept with conditions, or something else), criteria the board members can actually apply, and a serious treatment of the written-interview option — don't just assume the Turing-style evidence is irrelevant, argue it out. It can be a page, plain language, we're not philosophers.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Editorial Board Member of a small literary magazine (also a novelist).
      *   **Situation:** Annual short-story prize mess. Shortlisted entry (pen name) suspected of AI use. Detection software is unreliable. Rules say "entrant's own unaided work" but are undefined.
      *   **Conflict:** Half the board wants a written interview (author agreed, but no video). Half thinks that's useless (Turing test fallacy).
      *   **Task:** Draft a decision memo for the board.
      *   **Requirements:** Concrete recommendation (accept, disqualify, etc.), applicable criteria, serious treatment of the written interview option (argue for/against its utility), plain language, ~1 page length.
      *   **Deadline:** Two weeks.

  2.  **Determine the Stance/Recommendation:**
      *   *Option A: Disqualify immediately.* Too risky. No hard evidence. Could cause a scandal if the author is human.
      *   *Option B: Accept immediately.* Ignores the suspicion and the rules about "unaided work." Undermines trust.
      *   *Option C: Disqualify based on suspicion.* Unfair.
      *   *Option D: Accept with a caveat/statement.* Acknowledges the gray area.
      *   *Option E: Proceed with the interview but with specific criteria, then decide.* This seems the most balanced and actionable within two weeks. It respects the author's privacy (written only) while addressing the board's need for due diligence.
      *   *Refined Option:* **Proceed with the written interview, but shift the focus from "proving humanity" to "proving process."** If the author can't discuss the *craft* decisions, that's evidence. If they can, that's evidence. If the evidence remains inconclusive, the benefit of the doubt goes to the entrant (innocent until proven guilty), but the rules need updating for next year.
      *   *Decision:* **Conditional Acceptance pending Interview Review.** If the interview fails to demonstrate authorship, disqualify. If it succeeds, award. If inconclusive, award but issue a statement on rule ambiguity.
      *   *Actually, a stronger stance is needed for a memo:* **Proceed with the interview as a "Process Verification" step.** If the verification fails, disqualify. If it passes, award. This gives the board a clear path.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the problem clearly. No fluff.
      *   **The Core Issue:** The rules are vague ("unaided"), tech is unreliable. We need a human judgment call.
      *   **The Interview (The Turing Question):** Address the board's split.
          *   *Argument against:* A good prompter can mimic an author.
          *   *Argument for:* An AI user often lacks deep knowledge of *why* specific words were chosen if they didn't write them. It's not about "are you a robot?" it's about "did you make these choices?"
          *   *Conclusion:* The interview is valid *if* we ask the right questions (process, not philosophy).
      *   **Criteria:** What are we looking for? Specificity, revision history, intent.
      *   **Recommendation:** Conduct the interview. Set a deadline. Vote based on the *quality of the explanation*, not the "vibe."
      *   **Contingency:** What if it's a tie? What if inconclusive? (Benefit of the doubt usually applies in prizes unless fraud is proven).
      *   **Future:** Fix the rules for next year.

  4.  **Refining the Tone:**
      *   Needs to be professional but direct.
      *   "Plain language" means no academic jargon.
      *   Needs to bridge the divide between the two factions on the board.
      *   Acknowledge the "unpaid penance" vibe (slightly weary but dutiful).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hey board. We have a problem. AI detector says maybe, but it's junk. Rules say "unaided." Half want to talk to the author, half say don't bother. I say we talk to them, but ask about drafts and cuts, not "what is love." If they can tell us why paragraph 3 is there, they probably wrote it. If they say "the computer did it," they're out. Let's do this in 5 days so we have time to announce. If we can't decide, they win because we can't prove cheating. But let's try to decide.

  6.  **Drafting - Iteration 2 (Polishing for the Prompt):**
      *   Make it look like a memo.
      *   Ensure the argument about the written interview is nuanced. It's not a Turing test for *consciousness*, it's an audit for *labor*.
      *   Set concrete criteria: Drafts, specific word choices, cut material.
      *   Recommendation: Conditional Award.

  7.  **Final Polish (checking constraints):**
      *   Two-week window? Yes, build that into the timeline.
      *   Plain language? Yes.
      *   Concrete recommendation? Yes.
      *   Treatment of written interview? Yes, framed as "Process Audit."

  8.  **Final Review against the "Split Board":**
      *   Faction 1 (Interview): They get their interview.
      *   Faction 2 (Skeptics): They get strict criteria on *what* the interview must prove (labor, not soul).
      *   Outcome: A clear path forward.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm guaranteeing the interview will work. I need to acknowledge its limits but argue it's the *best available tool* we have right now. Also, the "benefit of the doubt" is crucial legally/ethically. If we can't prove cheating, we usually have to award. But we can try to prove authorship.

      *Revised Recommendation:* **Proceed with the written interview as a "Verification of Process."** If the author cannot satisfactorily explain specific creative choices or provide evidence of drafting, we disqualify based on inability to verify "unaided work." If they can, we award. This puts the burden of proof on verification, not necessarily "guilt."

      *Wait, one more thing:* The prompt asks for a "concrete recommendation we can act on." I should probably lean towards: **Award the prize contingent on a satisfactory process interview.** If the interview fails, the prize is withheld (not necessarily given to runner-up immediately, just withheld).

      *Let's write it.*

      *Structure:*
      1. Context.
      2. The Interview Debate (addressing the Turing concern).
      3. The Criteria (What counts as evidence).
      4. The Recommendation & Timeline.
      5. Future Rules.

      *Tone Check:* Professional, decisive, empathetic to the difficulty.

      *(Final thought on the "Written Interview" argument)*: I need to explicitly state that while a written interview can't prove a *mind*, it can prove *memory of labor*. AI users often hallucinate the process. Humans remember the struggle. That's the key distinction.

      *Let's go.*
answer: |-
  **MEMORANDUM**

  **TO:** Editorial Board, [Magazine Name]
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation regarding Shortlist Entry #[Redacted] (AI Suspicion)

  **The Situation**
  We have a shortlisted story suspected of AI generation. Our detection tools are inconclusive. Our rules require "unaided work" but define neither "unaided" nor the burden of proof. We have two weeks until the announcement. We cannot stall, and we cannot guess.

  **The Written Interview: Why It Matters**
  Half the board argues that a written interview is a "Turing Test" trap: a human can sound like a bot, and a bot-prompter can sound like a human. They are right that we cannot test for *consciousness*.

  However, we are not testing for a soul; we are testing for *labor*.

  An author who wrote a story remembers the friction of writing it. They remember the paragraph they cut, the word they swapped at 2 a.m., the structural problem they solved in the third draft. An entrant who merely prompted an AI may know what the story *says*, but they rarely know *why* it says it that way. A written interview, if focused strictly on process rather than theme, is the only forensic tool we have left. It is not perfect, but it is better than a coin flip.

  **Criteria for Verification**
  We will not ask the author "Did you use AI?" We will ask them to demonstrate authorship. To clear the "unaided work" bar, the author's written responses must satisfy **two of the following three** criteria:

  1.  **Specific Intent:** Can they explain *why* a specific, unusual word or image was chosen in a way that links to the story's deeper themes? (AI users often accept outputs based on surface-level appeal).
  2.  **Revision History:** Can they describe what the story looked like in an earlier draft? (e.g., "The ending was originally happier," or "Character X was a man in draft one").
  3.  **Negative Space:** Can they identify what they tried to write but failed to include? (Authors know what they missed; prompters only know what they got).

  **Recommendation**
  I recommend we proceed with a **Conditional Award**.

  1.  **Immediate Action:** Send the written questions to the author within 48 hours. Give them 5 days to respond.
  2.  **Evaluation:** The board votes on whether the responses meet the Criteria above. We are not voting on "Is this human?" We are voting on "Did this person demonstrate memory of the writing process?"
  3.  **Outcome A (Verification Successful):** We announce them as the winner. No public mention of the investigation.
  4.  **Outcome B (Verification Failed):** We disqualify the entry based on "inability to verify eligibility requirements." We do not accuse them of cheating publicly; we simply state they did not meet the criteria for "unaided work." The prize is withheld or passed to the runner-up at our discretion.
  5.  **Outcome C (Inconclusive):** If the board remains deadlocked after the interview, the benefit of the doubt goes to the entrant. We award the prize, but we issue a public note that the rules will be tightened next year.

  **Next Steps**
  This gives us a defensible process. It respects the author's privacy (written only) while addressing our duty to the other entrants. It allows us to make a decision within the two-week window.

  Please reply by EOD tomorrow with approval to send the questions. We need to fix the rules for next year, but for now, this is how we handle this year.
