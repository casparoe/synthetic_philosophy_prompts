prompt: |-
  My friend is a hardcore Peircean and I've been defending James for years, and last night we finally had it out properly — like three hours, whiskey, whiteboard, the works — about whether their two theories of truth are even disagreeing. He kept saying truth is whatever inquiry is fated to converge on in the long run, I kept saying truth is what works, and eventually we realized neither of us could state the other's position in words the other would accept. So before we go for round two, I want a document we could actually both sign.

  Draft the joint statement of an adversarial collaboration between a Peircean camp and a Jamesian camp on truth. I need: a numbered section of claims both sides accept (I suspect they agree on more than people think — that concepts get their meaning from practical consequences, that belief is a habit of action, maybe that inquiry is self-correcting — but phrase them so a partisan of either side would sign); then a disagreements section, with each disagreement stated twice, once in wording the Peircean endorses and once in wording the Jamesian endorses, since that's exactly where our fights kept stalling; then the cruxes. I think the real ones are (a) whether inquiry actually converges or that's just an article of faith Peirce smuggled in, (b) whether "works" can be pinned down non-circularly without already meaning "matches what inquiry would settle on", and (c) the whole ethics of believing ahead of the evidence — James's forced, living, momentous options versus Peirce thinking that's just letting self-deception in the door. But you tell me if I'm missing one. For each crux, give the argument or kind of case both camps would accept as bearing on it, with each side's prediction written down in advance. And if you think part of our dispute is verbal — that "the long run" and "what works" might even be two descriptions of the same thing, or that the disagreement only shows up in edge cases like beliefs about untestable religious claims — say which part and why, because my friend thinks the whole fight is substantive and I'm honestly not sure anymore.

  One more thing: my friend is touchy about the fact that Peirce got so fed up he renamed his own view "pragmaticism" specifically to distance himself from James — don't rub it in, but don't pretend it didn't happen either. No citations or reading lists please, we're working from what we remember from our argument.
