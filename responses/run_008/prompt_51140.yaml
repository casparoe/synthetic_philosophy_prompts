answer: |-
  **The Garden Centre Dialogue**

  **Characters:**
  *   **Eleanor:** Sceptic about omission causation. Prefers processes and transfers.
  *   **Julian:** Defender of omission causation. Comfortable with counterfactuals and norms.

  **Setting:** A damp, slightly chaotic garden centre in Cambridge. It is raining outside.

  **Eleanor:** (Holding a pot containing a crisp, brown tomato plant) Look at this. Properly dead.

  **Julian:** (Fiddling with a watering can) Tragic. Who's responsible?

  **Eleanor:** Don't start. I know what you're going to say. The gardener's *not* watering it killed it.

  **Julian:** Well, did it not? If he had watered it, it would be alive. That's counterfactual dependence. It's the gold standard.

  **Eleanor:** It's a category error, Julian. In physics, causes are events. Forces, collisions, energy transfers. "Nothing" cannot be a cause. You're trying to make a ghost push a brick.

  **Julian:** But we attribute liability based on this constantly. If a nurse fails to administer medicine and the patient dies, we say the omission caused the death. If you say 'nothing' killed them, the law collapses.

  **Eleanor:** The law is pragmatic. Metaphysics should track the furniture of the universe. And here's the furniture problem: the *too many causes* objection. If the gardener's not watering killed this plant, then so did the Queen's not watering it. And mine. And every person on Earth who didn't trek out here with a watering can. They all satisfy the counterfactual: if they had watered it, it would live.

  **Julian:** (Sighs) The classic inflation objection. But we have replies. We distinguish between *default* and *deviant* backgrounds. The gardener has a duty; the Queen does not. The gardener's omission is a deviation from the expected course of events. The Queen's inaction is just the background noise of the universe.

  **Eleanor:** That just pushes the problem into the notion of 'expectation'. You're making causation mind-dependent. It depends on what we *think* should happen, not what *does* happen.

  **Julian:** Not mind-dependent, but perhaps interest-relative. Causation is about explaining why things went wrong. The Queen's inaction doesn't explain the error because it wasn't part of the system's design.

  **Eleanor:** So causation is about design now? Not physics?

  **Julian:** Maybe causation isn't purely physical. Look, consider contrastivism. When we say 'the gardener's not watering caused the death', we're shorthand for a contrast: 'The gardener's not watering *rather than watering* caused the death *rather than survival*.' The Queen's not watering *rather than watering* isn't a relevant contrast because she was never supposed to water.

  **Eleanor:** (Puts the pot down on a display of peat moss) But where do these contrasts come from? Are they out there in the world, or are we just picking favourites among absences after the fact? It feels like you're sorting the universe based on human grievances.

  **Julian:** I think it's about stable structures. The gardener is part of the causal structure of this garden centre. The Queen isn't.

  **Eleanor:** Let's try a different angle. There's a difference between removing a support beam and simply not building one. My physicist gut says removing a beam interrupts an ongoing physical process—gravity takes over. Not building one is just... nothing happening. Do you treat those the same?

  **Julian:** Intuitively, they feel different. But metaphysically? In both cases, the building falls because support was absent. Whether the absence was created by removal or by non-construction, the dependence holds.

  **Eleanor:** But the energy profile is different. Removing a beam involves work. Not building one doesn't. If causation is real, it should track the energy.

  **Julian:** But suppose the beam was never ordered. The lack of the order caused the lack of the beam, which caused the collapse. We trace chains of omissions all the time.

  **Eleanor:** Here's the thing that really bugs me, though. You say the absence caused the death. But look at the plant. (She taps the dry soil). The dehydration killed it. The osmotic pressure gradients, the cell wall collapse. Those are positive, physical processes. The absence of water didn't *do* anything. The presence of dryness did the work.

  **Julian:** (Pauses, looking at the soil) That's a sharp point. You're saying the absence is merely the context for the positive process.

  **Eleanor:** Exactly. The dry soil is the cause. The 'not watering' is just the explanation for why the soil was dry.

  **Julian:** I... I need to concede something there. If we say the absence *itself* exerts force, that is mystical. But perhaps the absence *selects* which positive process occurs. If water were present, a hydration process would occur. Because water was absent, a dehydration process occurred. The absence determines which physical mechanism gets the stage.

  **Eleanor:** So the absence is a switch, not a pusher?

  **Julian:** Yes. A constraint. Like a hole in a gear. The hole doesn't push the mechanism, but its absence of material dictates the motion.

  **Eleanor:** I can live with that metaphorically. But if the 'hole' is defined by our expectations—like your gardener vs. the Queen—then the switch is in our heads, not the gear.

  **Julian:** (Frowns) That does worry me. If causation is partly normative, does that leak into blame? If I'm not responsible for the plant, did I cause its death?

  **Eleanor:** Precisely. In ethics, we distinguish killing from letting die. If omissions are causes identical to actions, that distinction vanishes. You become a murderer for every starved child you didn't feed.

  **Julian:** But the law needs omissions to be causes for negligence cases. If I'm a lifeguard and I don't save a swimmer, I caused the death. If I say 'nothing caused it, only the water did', I escape liability.

  **Eleanor:** Then maybe liability isn't strictly about metaphysical causation. Maybe it's about duty plus causation. The water caused the death; your duty made you liable for not stopping it. You don't need to make 'nothing' into a cause to blame the lifeguard.

  **Julian:** (Leans against a shelf of trowels) You might be right. If I insist omissions are full-blooded causes, I invite the 'too many causes' problem. If I say they're a different category—causal relevance rather than causal production—it might save the metaphysics but weaken the legal link.

  **Eleanor:** And if you make them dependent on norms, you make the fabric of reality sensitive to job descriptions. That's too high a price.

  **Julian:** So where does that leave us? I still think 'The gardener didn't water' is true and explanatory. You think it's a shorthand for 'The gardener failed in his duty while positive processes killed the plant'.

  **Eleanor:** I think it's a useful shorthand. But don't call it metaphysics. Call it pragmatics. The universe doesn't care about the gardener's contract. It only cares about the water.

  **Julian:** But the universe doesn't care about contracts, yet here we are, arguing about them. Maybe causation isn't just about the universe. Maybe it's about agents within it.

  **Eleanor:** (Picks up a healthy fern) Maybe. But I'm buying this one. I'm not going to risk relying on an absence to keep it alive. I'm going to pour water on it. Positive cause, positive effect.

  **Julian:** (Smiles) I'll water mine. Just in case the absence decides to do some work.

  ***

  **Author's Note**

  Where do I stand? I'm inclined towards a pluralist view, closer to Eleanor's pragmatism than Julian's realism about negative entities. I think causation is a concept we use to navigate the world, not merely a physical relation like gravity. Omissions are genuine causes in the sense that they are indispensable to our explanatory practices, particularly in ethics and law. However, Eleanor is right to worry about the metaphysics: if we treat absences as ontologically robust 'things', we invite mystery. The best approach is likely to view omission causation as a distinct category from productive causation—dependent on norms and counterfactuals rather than energy transfer. This preserves the utility for liability (Julian's concern) without committing to the mystical idea that 'nothing' can push 'something' (Eleanor's concern). The wind blows towards viewing causation as partly interest-relative, which feels less satisfyingly objective but fits the data of how we actually reason.
