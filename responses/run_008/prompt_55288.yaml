answer: |-
  Yes, the position defined by that configuration of commitments is formally identified in contemporary decision theory and population ethics as **Fanaticism** (or **Decision-Theoretic Fanaticism**), while the resistant stopping point you describe is termed **Timidity**.

  The term **Fanaticism** has been adopted technically (stripped of its pejorative colloquialism) in recent literature, most notably by Hayden Wilkinson ("In Defense of Fanaticism," 2022) and Nick Beckstead ("On the Overwhelming Importance of Shaping the Far Future," 2013), to denote exactly the conjunction you outlined: unbounded utility aggregation, linear probability weighting, and the refusal to discount tiny probabilities. Your distinction regarding Pascal's Mugging is recognized in this literature; while "Pascal's Mugging" originally referred to the evidential problem of a manipulative agent (Yudkowsky, 2007), it is often used loosely to describe the structural implication. However, **Fanaticism** is the precise label for the structural commitment itself, independent of the evidential context. It covers the view that for any certain benefit, there exists some sufficiently large potential benefit such that even a minuscule probability of achieving it outweighs the certain benefit.

  The companion phenomenon you identified—accepting moderate trade-offs but rejecting extreme ones—is formally labeled **Timidity**. In the same literature (Wilkinson 2022; Beckstead & Thomas 2021), Timidity is defined as the view that there is some threshold of probability below which outcomes do not count, or some threshold of stakes above which probability weighting ceases to be linear. Regarding coherence, the prevailing argument (Beckstead & Thomas, "A Paradox for Tiny Probabilities and Enormous Values") is that Timidity is diachronically inconsistent: it makes an agent vulnerable to money pumps or violates transitivity because the boundary between "negligible" and "significant" probability cannot be drawn without arbitrariness that leads to preference reversals when prospects are combined.

  The recognized escape routes from Fanaticism are classified as follows:
  1.  **Bounded Utility:** Rejecting the first commitment by positing a cap on total value (e.g., lexical prioritarianism or saturated welfare functions). This avoids Fanaticism but often entails the "Repugnant Conclusion" or other counterintuitive population ethics results.
  2.  **Risk-Weighted Expected Utility:** Rejecting the second commitment by adopting a non-linear probability weighting function (e.g., Buchak 2013). This allows tiny probabilities to count for less than their face value but faces challenges in justifying the specific curvature without ad hoc parameters.
  3.  **Probability Discounting:** Rejecting the third commitment by treating probabilities below a certain threshold as zero for decision-making purposes. This is the formalization of Timidity and inherits its coherence problems.
  4.  **Epistemic Constraints:** Distinguishing between *decision-theoretic* rejection and *epistemic* rejection. This route accepts the structure of Fanaticism but argues that in practice, probability estimates for astronomical stakes are never sufficiently robust to overcome the threshold (Lockhart 2019).

  The boundary you asked about—between rejecting the configuration and professing less confidence in the estimates—falls between **Structural Discounting** and **Epistemic Discounting**. Structural Discounting (Fanaticism's negation) claims that even a *known* probability of $10^{-100}$ counts for less than linear expectation. Epistemic Discounting claims that any *asserted* probability of $10^{-100}$ is epistemically unjustified and should be treated as undefined or effectively zero due to model uncertainty. The latter is often viewed as the more coherent escape route because it avoids the formal inconsistencies of Timidity while preserving standard expected utility theory for well-defined risks.
