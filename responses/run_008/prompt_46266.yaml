answer: |-
  This is a sophisticated request that cuts through the noise to the epistemological structure of the debate. You are correct that the scientific literature has not changed its fundamental contours in fifty years, yet the argument persists with the same heat.

  Here is the diagnosis, separated into the firm floor (consensus), the live wire (contested), the nature of the disagreement, and the path to progress.

  ***

  ### Part 1: The Firm Floor (Settled Consensus)
  *Among quantitative geneticists and psychometricians who are not advocating for a specific political outcome, the following are treated as technical facts, not opinions.*

  1.  **The Definition:** Heritability ($h^2$) is a population statistic, not an individual metric. It is the proportion of *phenotypic variance* in a *specific population* at a *specific time* attributable to genetic variance. It is not a measure of how "genetic" a trait is in an absolute sense.
  2.  **The Logical Gap:** High within-group heritability does **not** logically entail anything about between-group differences. Lewontin's seedling analogy is accepted as valid. You can have $h^2 = 1.0$ within two groups and have the mean difference between them be 100% environmental.
  3.  **Malleability:** High heritability does **not** imply immutability. Myopia is highly heritable, yet corrective lenses (an environmental intervention) solve it. PKU is genetic; dietary change prevents the cognitive deficit.
  4.  **No Direct Evidence for Genetic Group Differences:** There is currently no molecular genetic evidence that identifies specific alleles that explain the Black-White IQ gap (or similar group gaps) in the way we can identify alleles for height or skin color. The "genetic hypothesis" for group differences remains a hypothesis without direct mechanistic evidence.

  ### Part 2: The Live Wire (Genuinely Contested)
  *This is where the "experts" actually disagree. These are often presented in public discourse as settled facts by one side or the other, but they are methodologically live.*

  1.  **The Equal Environments Assumption (EEA):** Twin studies rely on the assumption that Monozygotic (MZ) twins share environments no more than Dizygotic (DZ) twins.
      *   *Contest:* Critics argue MZ twins are treated more similarly (dressed alike, spend more time together) *because* they look alike, inflating heritability estimates. Defenders argue studies controlling for this show minimal impact. The magnitude of this bias is not settled to zero.
  2.  **Gene-Environment Interaction (GxE):** Does heritability change depending on the environment?
      *   *Contest:* The Scarr-Rowe hypothesis suggests heritability of IQ is lower in low-SES families (because poverty constrains genetic potential) and higher in high-SES families. Some large-scale replications have failed to find this effect in certain countries (e.g., Australia, UK), while it holds in the US. If $h^2$ is unstable across SES, the "50-80%" number is not a universal constant.
  3.  **The "Default Hypothesis":** Proposed by Arthur Jensen, this is the methodological stance that between-group differences should be assumed to have the same causal structure as within-group differences until proven otherwise.
      *   *Contest:* This is not an empirical finding; it is a heuristic. Environmentalists reject it, arguing that because the groups have historically faced radically different environments (segregation, nutrition, lead exposure), the "default" should be environmental. Hereditarians argue that without evidence to the contrary, positing a unique environmental cause for groups is special pleading.
  4.  **Assortative Mating:** People mate with others similar in IQ.
      *   *Contest:* How strongly does this occur, and does it inflate heritability estimates in twin models that assume random mating? The correction factors are debated.

  ***

  ### Part 3: The Diagnosis
  *What kind of disagreement is this?*

  Based on how the sides speak, this is not primarily an empirical dispute, nor is it purely verbal. It is a **Burden-of-Proof Standoff disguised as an Empirical Dispute**, fueled by a **Category Error**.

  **1. The Category Error (Etiology vs. Malleability)**
  *   **Side A (Hereditarians)** speaks in the language of *variance decomposition*. When they say "IQ is heritable," they mean "In this dataset, genetic differences explain X% of the variance."
  *   **Side B (Environmentalists/Policy)** hears language of *causal potential*. When they hear "IQ is heritable," they hear "Interventions will fail."
  *   **The Clash:** Side A gets frustrated that Side B ignores the " Firm Floor" (that heritability $\neq$ immutability). Side B gets frustrated that Side A uses a technical statistic to imply policy fatalism, even if they don't say it explicitly. The argument stalls because Side A is answering "Where does the variance come from?" and Side B is asking "Can we change the mean?" These are different questions.

  **2. The Burden-of-Proof Standoff**
  This is the engine of the stalemate.
  *   **The Hereditarian Move:** They posit the "Default Hypothesis." They argue that since genes explain variance *within* groups, the null hypothesis for *between* group differences should include genetics. They place the burden on Environmentalists to prove the gap is *not* genetic. Since you cannot prove a negative (you cannot prove no gene exists), they claim a victory by default.
  *   **The Environmentalist Move:** They point to the Flynn Effect (IQ rising too fast for genetics) and historical oppression. They argue that since we know environments differ radically, the null hypothesis should be environmental. They place the burden on Hereditarians to identify the specific genes. Since molecular genetics hasn't found them yet, they claim a victory by default.
  *   **The Result:** Both sides claim the "null hypothesis" is on their side. Neither can be falsified with current tools. Side A says "Absence of evidence is not evidence of absence." Side B says "Extraordinary claims require extraordinary evidence."

  **3. The Values Mask**
  You suspected this was partly values. It is, but not in the way people think. It isn't just "racism vs. egalitarianism." It is a disagreement about **risk tolerance**.
  *   **Side A** fears the risk of *false negatives*: Ignoring biological constraints leads to wasted resources on interventions that won't work (e.g., trying to train an Olympic sprinter out of a non-athletic genotype).
  *   **Side B** fears the risk of *false positives*: Accepting a genetic explanation leads to harmful policy (e.g., cutting school funding) and moral hazard (e.g., prejudice), even if the science is later proven wrong.
  *   Because the stakes are moral/policy, both sides treat methodological uncertainties (like the EEA) as settled facts that support their moral position.

  ***

  ### Part 4: Path to Progress
  *Given this diagnosis, how do we move?*

  If the problem is a burden-of-proof standoff and a category error, more twin studies will not solve it. We have reached diminishing returns on behavioral genetics. Progress requires changing the terms of engagement.

  **1. Terminological Discipline (Solving the Category Error)**
  We need to retire the word "Heritability" in public discourse. It is too easily conflated with "Inheritance" or "Fixed."
  *   **Progress:** Replace "Heritability of IQ" with **"Variance Explained by Genetics in Context X."**
  *   **Why:** This forces the speaker to specify the environment. If $h^2$ is 80% in wealthy Sweden but 40% in impoverished contexts (due to GxE), the statistic itself reveals the potential for environmental intervention. It bridges the Etiology/Malleability gap.

  **2. Shift from Twin Studies to Molecular Genetics (Solving the Empirical Uncertainty)**
  Twin studies are indirect inference (comparing correlations). Molecular genetics (GWAS/Polygenic Scores) is direct observation.
  *   **Progress:** Stop arguing about twin assumptions (EEA). Start arguing about Polygenic Scores (PGS).
  *   **Why:** PGS allows us to test the "Default Hypothesis" directly. If group differences are genetic, PGS derived from Europeans should predict the mean difference in Africans (accounting for linkage disequilibrium). Currently, PGS does not fully transfer across populations, which limits the ability to test this. Progress looks like: **Trans-ancestry GWAS.** If we can build accurate predictors across ancestries and they *still* don't account for the mean gap, the genetic hypothesis loses its "default" status empirically, not just logically.

  **3. Decouple Policy from Etiology (Solving the Values Standoff)**
  The debate is stuck because everyone thinks we need to know *why* the gap exists to know *what to do*.
  *   **Progress:** Adopt a "Black Box" approach to intervention.
  *   **Why:** We do not need to know the heritability of hypertension to know that reducing salt intake helps. We do not need to know the heritability of IQ to know that early childhood nutrition or lead abatement raises scores.
  *   **The Concession:** Side A must concede that high $h^2$ does not justify withholding intervention. Side B must concede that interventions might have limits (ceiling effects) without that implying genetic determinism.
  *   **Metric of Success:** The debate moves from "Is it genetic?" to "Does Intervention X increase Y?" This renders the heritability estimate irrelevant to policy, neutralizing the values standoff.

  ### Summary Diagnosis
  The disagreement is a **Burden-of-Proof Standoff**. Both sides claim the null hypothesis.
  *   **Settled:** Within-group $h^2$ does not predict between-group differences. High $h^2$ does not mean immutability.
  *   **Contested:** The validity of twin assumptions (EEA), the stability of $h^2$ across SES (GxE), and the methodological rule for inferring group causes (Default Hypothesis).
  *   **Progress:** Requires shifting from behavioral genetics (twins) to molecular genetics (DNA) to test the group hypothesis directly, and decoupling policy efficacy from causal etiology.

  Until the field accepts that **heritability is a description of a specific population's variance, not a law of nature**, the loop will continue. The "firm floor" is solid, but the combatants keep trying to build policy houses on the "live wire."
