  *(Self-Correction on "Cat in Armour"):* I need to be careful not to validate the daughter's view too much. While the trawlerman is likely wrong, the daughter is also scientifically imprecise. The nervous systems are too different to claim "same inner life." I must emphasise *functional equivalence* of suffering without claiming *identity* of experience.

  *(Self-Correction on "Wind-up Toy"):* Acknowledge that historically, this was the Cartesian view. But modern biology rejects strict dualism. A mechanism *can* feel (humans are biological machines). The flaw is equating "mechanism" with "insentient."

