          *   Toys don't learn; crustaceans do (habituation, conditioning).
          *   Toys don't self-maintain/heal; crustaceans groom wounds.
          *   Toys don't trade off costs; hermit crabs sacrifice shell quality to avoid shock (implies valuation).
          *   Toys don't respond to anaesthetics in a way that mimics unconsciousness vs. just paralysis.
      *   *Smuggled Premise:* Mechanism precludes experience (Cartesian Beast Machine). Just because it's physical doesn't mean it's not feeling.
