      *   **Task:** Audit both analogies. Provide a correspondence table for each (what maps to what). Identify where mappings break. Focus on biological/philosophical details the user knows (ganglia, nociception vs. pain, hermit crab shell experiments, grooming, anaesthetics). Address concrete practices (eyestalk ablation, density, ice slurry killing). Identify what is being "smuggled in." Evaluate if conclusions survive. Suggest better approaches if analogies fail.
