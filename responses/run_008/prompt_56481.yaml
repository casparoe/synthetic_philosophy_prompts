  i can't tell whether this all hangs together or not. go through the pairs, tell me which ones are actually in tension and which only look like it, rank the real tensions by severity (not a flat list of everything that could maybe be a problem), and for each real one say what would have to give and what the revision would cost me. to be clear i don't have a pet commitment i'm secretly protecting — if the audit says one of these has to go, i want to know which and why. also please don't just restate the views back to me, i wrote them, i know what they say.

  format: end with a final line of the form Verdict: <one sentence naming the two commitments in the worst tension and which one has to give> — the seminar circulates these and we extract the bottom lines into a spreadsheet, so keep that last line to a single sentence, no hedging.
