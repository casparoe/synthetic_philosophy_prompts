  so next month my seminar does this thing where we all circulate a "position paper" of our current views on rational choice, and everyone else gets to attack it, and mine is on rationality across time and i want a consistency audit before it goes in the pile because once it's out there i can't quietly walk things back. here's the package as it stands:

