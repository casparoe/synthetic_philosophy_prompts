prompt: |-
  I'm a grad student TAing an intro epistemology course, and after spring break I have to run a fifty-minute section on higher-order evidence and epistemic akrasia. I know the material fine myself but I've never taught it, and last weekend I got a preview of where my students will be: my roommate (psych major, no philosophy background) and I argued about it for like two hours. Her position was basically "if you did the work yourself, some outside signal saying you're probably wrong is just noise — trust your own reasoning," and when I pushed back she said what I was describing sounded like gaslighting yourself, or like I was telling people to just be insecure. She eventually conceded around hour two, but honestly I could not tell you how I got her there, which is a problem since that's now my job.

  So don't explain akrasia to me — plan the section. What has to be in place before the question even makes sense to a nineteen-year-old (I'm guessing the first-order vs higher-order distinction, but tell me if that's right and which one comes first), and what single example should carry the whole thing. I was thinking of the student who carefully checks her exam answers, feels confident, and then overhears the TA say half the class made the exact same mistake on question 3 — but tell me if there's a better carrier, and what the example needs to have and needs to lack. Then the misconceptions: I can already predict "higher-order evidence is just more evidence" and "steadfast just means never changing your mind," but there are surely ones I can't see coming from inside this, and I want to know where in the sequence each one should get headed off, not just that it exists. Also what I should openly refuse to cover in fifty minutes and say so out loud (the peer disagreement lit? any of the formal stuff? the akrasia vs. Moore-paradoxical belief tangle?), and one question I can ask at the end that would seperate the students who actually got it from the ones who just nodded along. My roommate is proof it can land — I just need it to happen in under an hour, and on purpose.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** Grad student TA, intro epistemology course.
      *   **Task:** Plan a 50-minute discussion section on Higher-Order Evidence (HOE) and Epistemic Akrasia.
      *   **Context:** User knows the material but struggles to teach it to novices. Roommate (psych major, no phil background) argued against HOE for 2 hours ("trust your reasoning," "gaslighting"). User eventually won but can't reconstruct *how*.
      *   **Constraints:** 50 minutes. Intro level (19-year-olds).
      *   **Specific Needs:**
          *   Prerequisites (what concepts need to be established first?).
          *   Single "carrier" example (evaluate the "exam/TA" idea or propose a better one).
          *   Misconceptions (predictable and hidden ones, and *when* to address them).
          *   Scope Creep (what to explicitly exclude).
          *   Assessment (one final question to test understanding).
      *   **Tone:** Practical, pedagogical, direct. Don't explain the theory; plan the teaching.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Roommate Problem:* The roommate's intuition ("trust your own reasoning") is the default human stance. It feels rational to trust your first-order evidence. HOE feels like "doubting your doubt." The key is to show that *rationality* isn't just about getting the right answer, but about managing your cognitive limitations.
      *   *Time Limit:* 50 minutes is very short. You can't cover the literature. You need one through-line.
      *   *The "How I Won" Mystery:* The user likely won by finding a case where the first-order evidence was clearly compromised by a defeater (e.g., fatigue, bias, drugs) rather than just "someone said you're wrong." The lesson plan needs to replicate that breakthrough explicitly.

  3.  **Drafting the Plan - Section by Section:**

      *   **Prerequisites:** The user asks if First-Order vs. Higher-Order distinction comes first. Yes, absolutely. But it needs to be grounded, not abstract.
          *   *Idea:* Don't define them formally first. Elicit them from the example.
          *   *Correction:* Actually, a quick definition is needed *before* the deep dive, but derived from intuition. Let's put it in the first 5-10 mins.

      *   **The Carrier Example:**
          *   *User's Idea:* Student checks exam, feels confident, TA says half the class got Q3 wrong.
          *   *Critique:* It's okay, but a bit weak. Why does the TA's comment matter? Maybe the TA is lying? Maybe the TA means a *different* mistake? It relies on testimony.
          *   *Better Idea:* The "Drugged Math" case (Elga/Christensen style) or the "Fatigue" case.
          *   *Why:* It isolates the *capacity* to reason from the *content* of reasoning. The roommate's objection ("trust your reasoning") holds up when you think you're functioning normally. It crumbles when you know you're impaired.
          *   *Selection:* Let's stick close to the user's exam idea but sharpen it to the "Fatigue/Impairment" angle. It's more relatable than "drugs" and less testimonial than "TA says."
          *   *Revised Example:* The "All-Nighter Math Problem." You solve it. You feel sure. Then you realize you've been awake for 24 hours and your error rate on math goes up 50%.
          *   *Why this works:* It forces the distinction between "The math looks right" (1st order) and "My brain is broken" (2nd order).

      *   **Misconceptions & Timing:**
          *   *Misconception 1:* "HOE is just more 1st order evidence." (Needs to be addressed immediately when defining HOE).
          *   *Misconception 2:* "Steadfastness = Rational Confidence." (Addressed during the debate phase).
          *   *Misconception 3 (Hidden):* "Akrasia is just feeling unsure." (Need to distinguish *feeling* from *judgment*).
          *   *Misconception 4 (Roommate's):* "HOE is gaslighting/insecurity." (This is the big one. Needs to be addressed by framing rationality as *responsponsiveness to reliability*, not self-doubt).

      *   **Scope Creep (What to Cut):**
          *   Peer Disagreement (too big, distinct literature).
          *   Formal Bayesian modeling (way too technical).
          *   Moore's Paradox (too linguistic/logic focused).
          *   "Uniqueness vs. Permissivism" (too meta).

      *   **The "Killer" Question:**
          *   Needs to distinguish rote memorization from application.
          *   *Idea:* A case where HOE suggests you *shouldn't* change your mind. (e.g., you know the HOE source is unreliable). Or a case distinguishing Akrasia from Humility.
          *   *Better Idea:* The "Calibrated Confidence" case. If you know you are overconfident, should you lower confidence? Yes. But if you lower it *because* you think the answer is wrong, that's different than lowering it because you know your *process* is shaky.
          *   *Best Idea:* A scenario where following HOE leads to a known falsehood, but is still rational. Or, distinguishing between "I believe P, but I shouldn't" (Akrasia) vs "I believe P, and I should" (Standard).
          *   *Let's go with:* A variation on the carrier example where the HOE is misleading. Do you still have to obey it? (Tests if they understand HOE binds rationality, not truth).

  4.  **Refining the Flow (The 50-Minute Clock):**
      *   0-5: Hook & Definitions (1st vs 2nd Order).
      *   5-20: The Carrier Example (The All-Nighter). Walk through the intuition pump.
      *   20-35: The Roommate Objection (Gaslighting vs. Reliability). This is the core philosophical work.
      *   35-45: Defining Akrasia (The "All-Things-Considered" judgment).
      *   45-50: Wrap up & The Killer Question.

  5.  **Addressing the "How I Won" Mystery:**
      *   I need to explicitly tell the user *why* the roommate conceded. It was likely shifting the frame from "Truth" to "Reliability." I need to build that pivot into the lesson plan. The key is: *Rationality is about managing your cognitive machinery, not just grasping truths.*

  6.  **Review against Constraints:**
      *   Did I explain akrasia? No, assumed knowledge.
      *   Did I plan the section? Yes.
      *   Did I address the example? Yes, refined it.
      *   Did I schedule misconceptions? Yes.
      *   Did I list exclusions? Yes.
      *   Did I provide the final question? Yes.

  7.  **Final Polish:**
      *   Make sure the tone is supportive but authoritative (TA to TA).
      *   Ensure the "Gaslighting" objection is handled carefully—it's a strong emotional intuition.
      *   Check timing. 50 mins flies. Keep the lecture portions tight.

  *(Self-Correction during drafting)*: Wait, the user's exam example is actually quite good *if* modified. The TA saying "half the class got it wrong" is testimonial HOE. The "All-Nighter" is psychological HOE. Psychological HOE is easier to grasp for the "Gaslighting" objection because it's internal. Let's recommend the "All-Nighter" variant of the exam example. It keeps the user's context but fixes the epistemic mechanism.

  *(Refining the Misconception Timing)*: Don't save misconceptions for the end. Head them off *as they arise*. I will structure the plan to anticipate the pushback at the exact moment it usually occurs.

  *(Refining the Final Question)*: It needs to be multiple choice or short answer that reveals a specific confusion. Let's make it a "What should the agent believe?" scenario with a twist.

  8.  **Final Output Generation** (incorporating these thoughts into the structured response).
answer: |-
  This is a classic teaching bottleneck. The intuition that "my reasoning is my reasoning" is so deep that HOE feels like a category error to beginners. Your roommate's "gaslighting" objection is the most common and dangerous one because it frames rationality as *authenticity* rather than *reliability*.

  You won the argument with your roommate not by proving she was wrong about the math, but by shifting the metric from **Truth** (did I get the right answer?) to **Reliability** (is my cognitive machinery functioning?). You need to engineer that shift explicitly for the class.

  Here is the 50-minute battle plan.

  ### 1. The Prerequisites (Minutes 0–5)
  **Do not start with definitions.** Start with the distinction in action.

  *   **The Setup:** Write two sentences on the board.
      1.  "The butler did it."
      2.  "I am in no state to judge whether the butler did it."
  *   **The Ask:** "What kind of evidence supports sentence 1? What kind supports sentence 2?"
  *   **The Definition:** Elicit from them that (1) is about the *world* (First-Order) and (2) is about *your mind* (Higher-Order).
  *   **The Rule:** Write this down and keep it visible: **HOE is evidence about the relationship between you and the answer, not evidence about the answer itself.**

  **Why this first?** If you define HOE abstractly ("evidence about evidence"), they will treat it as just "more evidence." You must establish the *target* of the evidence (the cognitive agent) before you establish the *force* of the evidence.

  ### 2. The Carrier Example (Minutes 5–20)
  Your exam example is good, but the "TA testimony" version is vulnerable to "maybe the TA is lying." Use the **Fatigue Variant**. It blocks the "trust your reasoning" objection more effectively.

  *   **The Scenario:** "You are taking a logic exam. You reach Question 3. You work through the proof carefully. It looks valid. You feel 95% confident the answer is 'Valid'."
  *   **The Twist:** "Midway through Question 4, you check the time. You realize you have been awake for 28 hours. You know from past experience that after 24 hours awake, your error rate on logic proofs jumps from 5% to 50%."
  *   **The Question:** "Should you lower your confidence in your answer to Question 3? Why?"

  **Why this example works:**
  1.  **It isolates the machinery:** The first-order evidence (the proof on the page) hasn't changed. The proof still *looks* valid.
  2.  **It forces the split:** To say "No, I trust my reasoning," they have to argue that their current reasoning is immune to fatigue. That's empirically false.
  3.  **It preempts "Gaslighting":** It's not insecurity to acknowledge biology.

  **Teaching Move:** Draw a diagram on the board.
  *   Left side: **The Proof** (First-Order Evidence).
  *   Right side: **The Brain** (Higher-Order Evidence).
  *   Show that HOE attacks the connection between the Left and the Conclusion, not the Left itself.

  ### 3. Addressing Misconceptions (Integrated Sequence)
  Do not save misconceptions for the end. Head them off exactly when the intuition triggers them.

  **Misconception A: "HOE is just more First-Order Evidence."**
  *   **When:** Minute 10, during the Example.
  *   **The Pushback:** A student will say, "Knowing you're tired is just another fact, like knowing the light is dim."
  *   **The Fix:** Ask: "If the light is dim, you look closer at the paper. If your brain is tired, can you 'look closer' with your brain?"
  *   **The Point:** HOE defeats the *tool* you use to process the 1st-order evidence. You can't use the tool to fix the tool.

  **Misconception B: "Steadfastness = Rational Confidence." (The Roommate Objection)**
  *   **When:** Minute 15. Someone will say, "If I checked it, I checked it. Changing my mind is just being insecure/gaslighting myself."
  *   **The Fix:** This is where you replicate your breakthrough with your roommate.
  *   **Script:** "Imagine a calculator. You type 2+2. It says 5. You feel confident you typed it right. Then you notice the battery is leaking and the screen is flickering. Is it 'gaslighting the calculator' to doubt the output? Or is it *maintaining the standard of accuracy*?"
  *   **The Pivot:** Frame rationality not as "standing your ground" but as "calibrating confidence to reliability." Ignoring HOE isn't confidence; it's *arrogance* about your own biology.

  **Misconception C: "Akrasia is just feeling unsure."**
  *   **When:** Minute 30, defining Akrasia.
  *   **The Pushback:** Students confuse *anxiety* with *akrasia*.
  *   **The Fix:** Distinguish **Psychological Akrasia** (feeling doubtful) from **Epistemic Akrasia** (believing P while believing you shouldn't believe P).
  *   **The Test:** "You can be perfectly calm and still be epistemically akratic. It's about the judgment, not the feeling."

  ### 4. What to Explicitly Exclude (Minute 35)
  Say this out loud. It saves you from getting trapped in weeds.

  *   **"We are NOT doing Peer Disagreement."** (That's about *another person's* mind. HOE is about *your* mind. Keep it distinct).
  *   **"We are NOT doing Formal Bayes."** (We are talking about rational requirements, not calculating exact credences).
  *   **"We are NOT solving Moore's Paradox."** (We aren't asking if 'P and I shouldn't believe P' is a contradiction, but whether it's rational to hold).

  **Why:** If you don't draw these lines, a smart undergrad will try to solve the section by importing a half-remembered concept from the lecture or a different class.

  ### 5. Defining Epistemic Akrasia (Minutes 35–45)
  Now that they accept HOE matters, define the tension.

  *   **Definition:** Epistemic Akrasia is holding a belief while simultaneously believing that holding that belief is irrational.
  *   **The Formula:** `I believe P` + `I believe I shouldn't believe P`.
  *   **The Discussion:** "Is it ever rational to be akratic?"
      *   *Standard View:* No. Rationality requires coherence.
      *   *Nuance:* Sometimes you *can't* drop the belief (the proof still looks valid) even though you know you shouldn't hold it (you're tired).
      *   *The Takeaway:* Akrasia is a sign of cognitive brokenness. The goal of HOE is to *avoid* akrasia by adjusting confidence before the break happens.

  ### 6. The "Killer" Question (Minutes 45–50)
  You need a question that separates those who memorized the definition from those who understand the *mechanism*.

  **The Question:**
  > "Sarah is a brilliant mathematician. She proves a theorem and believes it is True. She then receives higher-order evidence that her proof contains a subtle error, but she cannot find the error—the proof still looks perfect to her.
  >
  > **Option A:** She stops believing the theorem is True.
  > **Option B:** She continues believing the theorem is True, but lowers her confidence significantly.
  > **Option C:** She continues believing the theorem is True with full confidence, because the first-order evidence (the proof) hasn't changed.
  >
  > Which is rational, and **why does Option A fail?**"

  **The Answer Key:**
  *   **Correct:** Option B.
  *   **Why A fails:** She cannot simply delete the belief because the first-order evidence (the proof) still compellingly supports P for her. She is cognitively stuck with the belief.
  *   **Why C fails:** Ignoring the HOE makes her overconfident relative to her reliability.
  *   **The Separator:** If they choose **A**, they think HOE *destroys* 1st-order evidence (Misconception A). If they choose **C**, they are "Steadfasters" (Misconception B). If they choose **B** but can't explain why A is impossible, they don't understand the *akratic tension* (that the proof still looks valid).

  ### Summary Checklist for You
  1.  **Board Work:** Keep the "World vs. Mind" distinction visible the whole time.
  2.  **The Pivot:** When they say "trust your reasoning," ask "what if the reasoning engine is broken?"
  3.  **The Boundary:** Cut off Peer Disagreement immediately if it comes up.
  4.  **The Goal:** You aren't trying to make them feel insecure. You are trying to make them see that **acknowledging limitations is a feature of rationality, not a bug.**

  If you stick to the "Fatigued Math" example and hammer the "Calculator/Battery" analogy, you will replicate your success with your roommate, but in 50 minutes instead of 2 hours.
