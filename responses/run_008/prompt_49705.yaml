answer: |-
  You have identified a genuine and widely felt pathology in contemporary economic methodology, particularly within the DSGE (Dynamic Stochastic General Equilibrium) and neoclassical traditions. While there is no single, canonical noun in the philosophy of economics that names this exact *switching mechanism* (in the way "Moral Hazard" names a specific incentive problem), it is a frequent subject of critique by methodologists like Daniel Hausman, Uskali Maki, and Dani Rodrik.

  It is often discussed under the umbrella of **"Friedmanian Tension"** or the **"Paradox of Instrumentalism,"** but these describe the static conflict, not the dynamic move you are observing.

  Since you asked for precision, I will propose a term that captures the specific dialectical structure you described, define it, distinguish it from nearby concepts, and address your questions about collective responsibility and principled boundaries.

  ### The Coinage: The Instrumentalist-Realist Pivot (IRP)

  I propose calling this move **The Instrumentalist-Realist Pivot** (or **IRP**).

  **Definition:**
  The IRP is a methodological maneuver in which the epistemic status of a model's core assumptions is shifted contextually to maximize the model's defensive and offensive utility.
  1.  **Defensive Mode (Instrumentalism):** When the *validity* of the model is challenged, assumptions are treated as **heuristic fictions**. Their falsity is declared irrelevant; the model is judged solely by predictive accuracy within the in-sample domain (Friedman's *as-if* methodology).
  2.  **Offensive Mode (Realism):** When the *output* of the model is used for policy or counterfactual analysis, assumptions are treated as **ontological commitments**. The reliability of the prediction is asserted to depend on the truth of the mechanisms (e.g., optimization, rational expectations) encoded in the assumptions.

  The "Pivot" occurs when the arguer moves between these modes without acknowledging the change in the truth-value assigned to the premises.

  ### Distinctions from Nearby Concepts

  You asked to distinguish this from plain inconsistency, Motte-and-Bailey, and legitimate context-dependence. Here is the differentiation:

  **1. vs. Plain Inconsistency**
  *   **Inconsistency** is usually unintentional or a sign of sloppy reasoning (holding $P$ and $\neg P$ simultaneously).
  *   **IRP** is functional and strategic. The arguer does not necessarily believe $P$ and $\neg P$ at the exact same instant. Rather, they assign $P$ a truth-value of *False/Ignore* in Context A (critique) and *True/Essential* in Context B (application). It is a *contextual* inconsistency masked as methodological flexibility.

  **2. vs. Motte-and-Bailey**
  *   **Motte-and-Bailey** involves two *claims*: a controversial one (Bailey) and a defensible one (Motte). When attacked, the arguer retreats to the Motte.
  *   **IRP** involves two *statuses of premises*. It is a **"Motte-and-Bailey of the Assumptions."**
      *   *The Motte:* "These assumptions are just tools; don't attack them as false." (Hard to refute because it lowers the bar).
      *   *The Bailey:* "This policy will work because the model captures real behavior." (High stakes).
      *   *Distinction:* In a standard Motte-and-Bailey, the arguer retreats to safety when attacked. In the IRP, the arguer *advances* to realism when doing policy. The switch is not just defensive; it is permissive. It allows the model to bypass the burden of proof required for realistic assumptions while retaining the authority of realistic assumptions.

  **3. vs. Legitimate Context-Dependence**
  *   **Legitimate Context-Dependence:** In physics, a frictionless plane is dispensable for calculating trajectory (prediction) but essential for calculating heat loss (mechanism). We know *in advance* which questions the assumption licenses.
  *   **IRP:** The boundary is not declared in advance. The assumption is treated as dispensable for prediction *until* a counterfactual is requested, at which point it is retroactively treated as essential. The switch is driven by *conversational convenience*, not by a principled map of the model's domain of applicability.

  ### The Collective Version: Distributed Methodological Bifurcation

  You asked if this counts when different people play the two roles (e.g., theorists defend the assumptions as instrumental, while policy economists treat them as real).

  **Yes.** This is **Distributed Methodological Bifurcation**.

  In this scenario, the discipline as a whole maintains the IRP without any single individual committing a logical contradiction.
  *   **Group A (Theorists):** "The model is a benchmark; the assumptions are stylized facts."
  *   **Group B (Policy Advisors):** "We use the model for stress tests because agents really do optimize intertemporally."

  This is often more insidious than the individual version because it creates a **Division of Epistemic Labor** that insulates the field from critique. The theorists can claim purity (we don't do messy reality), and the policy advisors can claim authority (our models are grounded in microfoundations). The "switch" happens in the citation chain rather than the conversation.

  ### The Principled Solution: Redrawing the Boundary

  Is there a way for defenders to dissolve the problem rather than just making the switch explicit? **Yes.**

  The principled boundary is determined by the **Lucas Critique** (1976).

  **The Problem:**
  If assumptions are merely instrumental (false but predictive), the model's parameters are likely *reduced-form* correlations. If you change the policy regime, those correlations will break.
  If assumptions are realistic (agents *actually* optimize), the parameters are *structural* and invariant to policy changes.

  **The Dissolution:**
  Defenders can dissolve the IRP by committing to one of two consistent positions *ex ante*:

  1.  **The Structuralist Commitment:** "We claim these assumptions are approximately true (or the parameters are structural). Therefore, we accept the burden of proving their realism via micro-evidence, and we accept that if the assumptions are falsified, the policy advice is invalid."
      *   *Result:* You cannot use false assumptions to justify policy. The IRP is blocked.

  2.  **The Reduced-Form Commitment:** "We claim these assumptions are fictions. Therefore, this model is licensed *only* for within-sample prediction or qualitative intuition. We explicitly disclaim any authority on counterfactual policy analysis outside the historical data range."
      *   *Result:* You cannot use the model for the policy questions that trigger the "Realist" leg of the pivot.

  **Why this is rarely done:**
  Admitting (2) drastically reduces the political and professional utility of the model (no policy recommendations = less influence). Admitting (1) drastically increases the empirical burden (proving rational expectations are real = very hard). The IRP exists precisely because it allows economists to avoid both burdens.

  ### Summary for Your Toolkit

  When you encounter this in seminar or in print, you can now characterize it precisely:

  > "This argument relies on an **Instrumentalist-Realist Pivot**. The assumptions are treated as **instrumental fictions** when defending the model against empirical critique, but as **structural truths** when deriving policy implications. Unless we commit to the **Lucas Critique** standard—where counterfactual validity requires structural invariance—this switch licenses policy recommendations that the model's own methodology declares unfounded."

  This framing moves the debate from "are the assumptions realistic?" (which they will dodge) to "what is the epistemic warrant for your counterfactual?" (which forces them to choose a lane).
