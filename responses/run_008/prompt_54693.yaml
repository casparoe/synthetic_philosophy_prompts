answer: |-
  Here is a structural plan for the fifty-minute session. It is designed to enforce conceptual clarity before allowing historical application, ensuring the Nazi example illuminates the theory rather than replacing it.

  ### 1. Dependency Order
  **Logic:** You cannot explain Fuller's critique until students understand what is being critiqued. You cannot understand the critique as *jurisprudential* (about the nature of law) rather than *political* (about obedience) until you sever the link between "valid law" and "moral obligation."

  *   **Block 1: The Question (Minutes 0–5).**
      *   **Must come first:** Establish that the debate is about *classification*, not *condemnation*.
      *   **Why:** If you start with the Grudge Informer, students default to Criminal Law mode ("Was she guilty?"). You must shift the frame to ("Was the statute she used *law*?").
      *   **Transition:** "We are not asking if the Nazi regime was evil. We assume it was. We are asking if its rules fit the definition of a legal system."

  *   **Block 2: The Target — Positivism (Minutes 5–15).**
      *   **Must come before Fuller:** Fuller's "Internal Morality" is a response to the Separation Thesis. If students don't grasp the Thesis, Fuller looks like he is just giving moral advice.
      *   **Why:** You must define Positivism not as "law is command" (Austin) but as "law's existence is one thing, its merit another" (Hart).
      *   **Transition:** "Hart argues we can identify law without judging its morality. Fuller argues the *method* of making law contains a morality that, if absent, destroys the 'law' label."

  *   **Block 3: The Challenge — Rex (Minutes 15–30).**
      *   **Must come before Hart's Critique:** Students must accept Fuller's claim that the eight desiderata are *constitutive* (make law possible) before Hart can challenge them as merely *instrumental* (make law effective).
      *   **Why:** If they view Rex as "drafting tips" now, Hart's critique later will seem redundant. You must force the "constitutive" reading first.
      *   **Transition:** "Fuller claims these aren't just tips for good government. He claims they are the *price of admission* for calling something law."

  *   **Block 4: The Counter — Hart's Poisoner (Minutes 30–40).**
      *   **Must come last:** This is the rebuttal. It relies on the distinction between "failing at a purpose" and "ceasing to exist."
      *   **Why:** This solidifies the disagreement. Hart concedes Rex failed at governing, but denies he failed at *making law*.
      *   **Transition:** "Hart agrees Rex was a failure. He disagrees on *what* Rex failed to be."

  ### 2. The Carrying Example
  **Decision:** Stick with **King Rex**. Do not substitute a tax ordinance.
  **Reasoning:** A tax ordinance invites policy debate ("Is this tax fair?"). Rex is abstract enough to isolate *form* from *content*. However, you must explicitly weaponize the reading to prevent the "management tips" misconception.

  **How to force the question (Minutes 20–25):**
  1.  **The Setup:** Ask the class: "If Rex publishes secret rules, is it *harder* to govern, or is it *impossible* to govern?"
  2.  **The Pivot:** If they say "harder," press them: "If I tell you to do something but don't tell you what it is, have I issued an order? Or have I made a noise?"
  3.  **The Trap:** Fuller argues the latter (no order issued = no law). Hart argues the former (bad order = bad law).
  4.  **The Hartian Counter (Minute 35):** Introduce Hart's "Poisoner" analogy here.
      *   *Instruction:* "Hart says a poisoner has an internal morality too (must be potent, undetectable, etc.). If the poisoner fails, is he 'not a poisoner'? No, he's just a bad criminal."
      *   *Application:* Ask students: "Is Rex like a legislator who failed to make law, or a poisoner who failed to kill?" This forces the distinction between *efficacy* (Hart) and *legality* (Fuller).

  ### 3. The Misconception Map
  You must interrupt the flow to correct these. Do not wait for Q&A.

  | Misconception | Timing of Intervention | The Intervention (What you say/do) |
  | :--- | :--- | :--- |
  | **1. The Nazi Hijack**<br>("This is about punishing war criminals") | **Minute 0–2** (Opening) | **Statement:** "In Criminal Law, you asked 'Is the informer guilty?' Today we ask 'Was the statute she used valid?' If you argue about Nazi evil, you have left Jurisprudence." |
  | **2. Positivism = Immorality**<br>("Hart says law doesn't need to be moral") | **Minute 10** (Defining Positivism) | **Distinction:** Write on board: *Separation of Law and Morals* ≠ *Separation of Law and Justice*. Say: "Hart says a law *can* be immoral. He does not say it *should* be. Positivism is a claim about identification, not endorsement." |
  | **3. Natural Law = Conscience**<br>("Fuller says judges should ignore bad statutes") | **Minute 15** (Introducing Fuller) | **Correction:** "Fuller is not arguing for judicial disobedience. He is arguing for a definition. He claims a system without the 8 desiderata isn't just 'bad law,' it is *not a legal system* at all. It's a conceptual claim, not a remedial one." |
  | **4. Fuller = Drafting Advice**<br>("The 8 ways are just best practices") | **Minute 25** (During Rex Analysis) | **Challenge:** "If these are just tips, then a secret law is still law, just poorly drafted. Fuller says a secret law is *no law*. Which reading fits the text? Look at his title: *Morality* of Law, not *Efficiency* of Law." |
  | **5. The Command Theory**<br>("Hart thinks law is just orders from a sovereign") | **Minute 12** (Defining Positivism) | **Clarification:** "Hart rejected Austin's command theory. Hart's 1958 point is narrower: Validity does not depend on moral worth. Do not confuse Hart with Austin." |

  **Handling the Rule of Recognition (RoR) Anachronism:**
  *   **Decision:** **Avoid it entirely in the core explanation.**
  *   **Justification:** The RoR appears in *The Concept of Law* (1961), three years after this debate. In 1958, Hart's defense of positivism rests on the "Separation Thesis," not the "Social Fact Thesis" of the RoR. Introducing the RoR now creates a false impression that Hart's 1958 argument relies on a rule of recognition that incorporates moral criteria (Inclusive Positivism). This confuses the specific clash: Fuller says morality is *necessary* for law; Hart says it is *contingent*.
  *   **Pedagogical Move:** Put the RoR in the "Refusals" list (see below). Tell students: "Hart later refined his theory to explain *how* we identify law (Rule of Recognition), but that is not the engine of this 1958 argument. Here, the engine is the Separation Thesis."

  ### 4. The Check
  **The Closing Question (Minute 48):**
  > "Imagine a Benevolent Dictator who saves the economy and protects human rights, but rules exclusively by secret, retroactive decrees that change daily.
  >
  > **For Fuller:** Is this a legal system?
  > **For Hart:** Is this a legal system?
  > **Why do they disagree?**"

  **Criteria for a Correct Answer:**
  *   **Fuller:** Must answer **No**. Reason: It fails the Internal Morality (publication, non-retroactivity, consistency). The *content* (benevolence) is irrelevant; the *form* destroys the reciprocity required for law.
  *   **Hart:** Must answer **Yes**. Reason: It is a system of primary and secondary rules (or commands) that is effective. The *content* (benevolence) and the *form* (secret/retroactive) affect the *value* of the law, not its *existence*.
  *   **The Disagreement:** Must identify that the split is over the **criteria of validity**. Fuller ties validity to procedural morality; Hart ties validity to social fact/efficacy.
  *   **Failure Condition:** Any answer that focuses on whether the citizens *should obey* the dictator, or whether the dictator is *good or bad*, indicates the student has reverted to the "Nazi Hijack" or "Obedience" frame.

  ### 5. Refusals
  At Minute 45, explicitly list what you are **not** doing. This manages anxiety for students who have done extra reading and prevents scope creep.

  1.  **The Rule of Recognition:** "We are not discussing *The Concept of Law* (1961). We are discussing the 1958 essays. Hart's later taxonomy of how law is identified is a different puzzle."
      *   *Why:* Pedagogical honesty regarding the texts assigned; prevents anachronistic confusion.
  2.  **Inclusive vs. Exclusive Positivism:** "We are not debating whether a Rule of Recognition *can* include morality. We are debating whether morality is *necessary* for law."
      *   *Why:* This is a second-order debate among positivists that obscures the primary Hart-Fuller clash.
  3.  **The Radbruch Formula:** "We are not analyzing the actual post-war German court decisions."
      *   *Why:* Keeps the session on *theory* (concept of law) rather than *doctrine* (application of law).
  4.  **Dworkin's Critique:** "We are not yet addressing whether law includes principles beyond rules."
      *   *Why:* Dworkin attacks both Hart and Fuller; introducing him now collapses the binary you need them to understand first.
  5.  **The "Grudge Informer" Solution:** "We are not deciding how the informer case should have been adjudicated."
      *   *Why:* Reinforces the opening constraint. The case is the *stimulus*, not the *subject*.

  **Transition to Refusals:** "Before we finish, I need to draw a boundary. Jurisprudence is a rabbit hole. To understand this specific debate, we must ignore three important topics that you will encounter later..." (List 1, 2, and 4). "And we must ignore the historical outcome..." (List 3 and 5).

  ### Timing Summary
  *   **00–05:** Intro & Nazi Containment (MC1, MC4).
  *   **05–15:** Positivism Defined (MC2, MC5).
  *   **15–30:** Fuller's Rex & Internal Morality (MC3).
  *   **30–40:** Hart's Critique (Poisoner Analogy).
  *   **40–45:** Synthesis of Disagreement.
  *   **45–48:** Refusals.
  *   **48–50:** The Check.
