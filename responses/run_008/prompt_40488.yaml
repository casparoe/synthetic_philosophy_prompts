answer: |-
  Here is a menu of distinct theses expressed by the slogan "one thought too many," arranged from weakest (most trivial/psychological) to strongest (most meta-ethical/radical), followed by an analysis of the temporal element and a mapping of these theses onto the three uses you described.

  ### I. The Menu of Theses (Weakest to Strongest)

  **1. The Pragmatic/Heuristic Thesis**
  *   **Claim:** In high-stakes, time-sensitive situations, deliberative calculation is inefficient and risks paralysis.
  *   **Implication:** The slogan is advice about cognitive load management. It asserts nothing about the moral value of the thought itself, only its utility in the moment.
  *   **Anti-theoretical?** No. A utilitarian could endorse this (rule-utilitarianism or "two-level" utilitarianism) as a strategy for maximizing good outcomes.

  **2. The Evidential (Diagnostic) Thesis**
  *   **Claim:** The occurrence of the thought at the moment of action is reliable evidence of a defective character or insufficient emotional attachment.
  *   **Implication:** The thought itself is morally neutral, but having it *reveals* that the agent lacks the virtue (love, loyalty) that should have been causally efficacious. It diagnoses a gap between the agent's professed values and their psychological dispositions.
  *   **Anti-theoretical?** No. A moral theory can demand that agents cultivate dispositions such that the calculation is unnecessary. The theory remains valid; the agent is merely deficient.

  **3. The Constitutive (Action-Type) Thesis**
  *   **Claim:** The presence of the thought changes the moral description of the action being performed.
  *   **Implication:** Saving a woman *because she is my wife* is a different action-type than saving a woman *because a principle permits me to save my wife*. The latter is not an act of marital devotion, but an act of compliance. The thought does not just reveal a defect; it alters the ontological status of the act.
  *   **Anti-theoretical?** Mildly. It suggests moral theory cannot capture the full description of the action, but it allows that the action might still be permissible.

  **4. The Constitutive (Relational) Thesis**
  *   **Claim:** The presence of the thought damages the relationship that grounds the obligation.
  *   **Implication:** Relationships like marriage or kinship are constituted by unmediated concern. To mediate that concern through a third-party principle (even a correct one) is to step outside the relationship while inside it. It treats the partner as a case under a law rather than a person in a bond.
  *   **Anti-theoretical?** Yes, regarding the *experience* of morality. It claims that certain moral goods (intimacy) are incompatible with certain forms of moral awareness (theoretical justification) occurring simultaneously.

  **5. The Meta-Ethical (Anti-Justificatory) Thesis**
  *   **Claim:** The obligation is "brute" and cannot be vindicated by any higher-order principle without destroying its nature.
  *   **Implication:** There is no valid argument that leads to "save your wife" other than "she is your wife." Attempting to construct a principled justification (e.g., "general partiality maximizes welfare") is not just unnecessary or revealing; it is a category error. The justification *must* remain tacit to exist.
  *   **Anti-theoretical?** Strongly. It asserts that impartial moral theory is fundamentally incapable of accommodating special obligations, not just practically, but in principle.

  ---

  ### II. The Temporal Element

  Is the timing essential? **Yes, but its importance varies by thesis strength.**

  *   **For Thesis 1 (Pragmatic):** The temporal element is **essential**. The claim only holds in emergencies where deliberation costs lives. It grants that thinking the thought *beforehand* (in calm reflection) is admirable or necessary.
  *   **For Thesis 2 (Evidential):** The temporal element is **contingent**. While the shock of the moment makes the thought more diagnostic, having the thought in calm reflection could also indicate a lack of deep love.
  *   **For Theses 3, 4, and 5 (Constitutive/Meta-Ethical):** The temporal element is **irrelevant**. If the thought corrupts the action or the relationship, it corrupts it whether it occurs in a split second or after a week of reflection. If I visit my grandmother and *motivate* myself via duty, it matters little if I decided that yesterday or today.

  *Williams' Original Position:* Williams leans toward **Thesis 3 and 4**, with a specific focus on the **moment of action**. He allows that the agent might reflect *afterwards* or even *beforehand* on why they have such dispositions. But the *motivating reason* at the time of the act cannot be the theoretical justification.

  ---

  ### III. Mapping the Theses to Your Three Uses

  You suspect the three uses cannot all be backed by the same thesis. You are correct. Here is what the slogan must mean for each use to work, and the plausibility of that interpretation.

  #### Use 1: Refuting Impartial Moral Theory (The Drowning Wife)
  *   **The Argument:** The husband hesitates to check the calculus. This refutes the calculus, not the hesitation.
  *   **Required Thesis:** **Thesis 5 (Meta-Ethical)** or a very strong **Thesis 3 (Constitutive Action-Type)**.
  *   **Why:** If we accept only Thesis 1 (Pragmatic) or Thesis 2 (Evidential), the theory survives. A utilitarian can say, "The theory is correct, but in emergencies, agents should act on instinct. If this agent hesitated, he is poorly trained, but the theory stands." To claim the *theory* is refuted by the hesitation, one must argue that the theory *demands* a thought that renders the action morally unintelligible or impossible.
  *   **Plausibility:** **Low to Moderate.** This is the classic Williams critique. It is plausible if you accept that moral theories must match our deepest intuitions about agency. However, it is vulnerable to the "Two-Level" reply: The theory justifies the *disposition* to act without thinking the thought. The theory says "Don't think the thought." Thus, the theory survives.

  #### Use 2: Objection to Acting from Duty (The Grandmother)
  *   **The Argument:** Visiting out of duty is wrong where love should be.
  *   **Required Thesis:** **Thesis 4 (Constitutive Relational).**
  *   **Why:** This is not an emergency, so Thesis 1 (Pragmatic) is dead on arrival. Thesis 2 (Evidential) is possible ("You don't love her"), but the critic usually means something stronger: that visiting *from duty* is a different, lesser kind of visit than visiting *from love*. It claims the relationship itself is degraded by the mediation of "duty."
  *   **Plausibility:** **Moderate.** This creates a tension between Kantian and Williams-style ethics. It is plausible if one views relationships as essentially emotional states. It is implausible if one views relationships as commitments that must endure *when* emotions fade. If duty is a safety net for love, it isn't "one thought too many"; it's the thought that keeps the relationship alive when love is tired.

  #### Use 3: Objection to Justifying Partiality on Principle
  *   **The Argument:** Articulating the justification for why your wife counts extra is itself a betrayal.
  *   **Required Thesis:** **Thesis 5 (Meta-Ethical/Anti-Justificatory).**
  *   **Why:** This use targets the *articulation* of the principle, not just the moment of action. It claims that the ground of partiality is brute. To say "I save her because partiality maximizes utility" is to fail to save her *as a wife*. To say "I save her because she is my wife" is the only valid move.
  *   **Plausibility:** **Low.** This is the most radical reading. It suggests a form of moral silence. It implies that we cannot be reflective about our commitments without corrupting them. This leads to a fragile morality where examining one's life philosophically is dangerous. Most people find it plausible that one can love one's wife *and* believe that loving one's wife is a good thing justified by a broader view of human flourishing. Denying this seems to fetishize unreflectiveness.

  ### IV. Summary of Incompatibility

  The phrase "one thought too many" functions as a **chameleon concept** in these debates:

  1.  **In the Drowning Case (Use 1)**, it is wielded as a **weapon against Theory**. It requires the Strongest Thesis (5) to work. If it is only about psychology (Thesis 1), the theorist wins.
  2.  **In the Grandmother Case (Use 2)**, it is wielded as a **weapon against Motivation**. It requires the Relational Thesis (4). It ignores the temporal constraint of the original case (since visiting grandma isn't an emergency), stretching the slogan to cover non-immediate contexts.
  3.  **In the Justification Case (Use 3)**, it is wielded as a **weapon against Discourse**. It requires the Meta-Ethical Thesis (5) applied to language itself. It suggests that moral philosophy is inherently alienating.

  **Conclusion:**
  The slogan is most plausible when interpreted as **Thesis 3 (Constitutive Action-Type)** restricted to **moments of intimate action**. It captures the truth that "saving my wife" and "instantiating a permission rule" feel like different things.

  However, to do the heavy lifting your interlocutors want (refuting theory, condemning duty, silencing justification), the slogan must be inflated to **Thesis 5**. At that strength, it becomes implausible because it demands that moral agents remain unreflective to remain moral. It conflates the *context of justification* (philosophy) with the *context of action* (living). A robust moral life likely requires the ability to hold the thought in reflection (to understand why we love) while suspending the thought in action (to love fully). The slogan is useful only if it distinguishes these two; your interlocutors are using it to collapse them.
