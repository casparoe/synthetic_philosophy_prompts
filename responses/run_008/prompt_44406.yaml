  You are a professional philosopher specializing in ethics and the foundations of social choice. Think carefully before you answer, and please begin with a few minutes of private brainstorming before committing to a list.

  My friend and I just spent an entire evening arguing about the torture-versus-dust-specks case, and we eventually realized we weren't really disagreeing about the case at all: we were disagreeing about what a principle for aggregating tiny harms across many people has to accomplish before it deserves to be called adequate. So before we have that argument again, I want the specification, not the verdict.

  Write me the desiderata: what any adequate theory of the interpersonal aggregation of small harms must deliver. At minimum I want you to address which of the following are genuine requirements and which are camp prejudices: transitivity of betterness across the full spectrum (the continuum running from one person tortured for fifty years up through larger and larger groups suffering ever-smaller harms, with no clear stopping point where our intuitions flip); consistency with the idea that some harms are de minimis, too small to be worth anyone's attention on their own; what happens when you take a single harm and spread it across a population, as in Parfit-style cases where each person suffers a tiny loss that no one notices but the total loss is enormous; separability, i.e., whether how badly off strangers are should be allowed to affect how I may treat the person in front of me; and whether the theory can avoid the practical conclusion that we are all perpetually obligated to drop everything to prevent vast numbers of tiny harms. For each desideratum, give the case or consideration behind it, say whether it is non-negotiable or reflects one camp's commitments, and flag any pair you suspect cannot be jointly satisfied -- if the list itself is jointly unsatisfiable, I want to know which subset and why, because that may be the real result. Also tell me which single requirement does the most work excluding candidate theories.

  Here is the twist from our argument, and I want you to evaluate it as a serious proposal rather than dismissing it: my friend suggested a "pairwise comparability" condition -- that a harm can only enter into aggregation with other harms if each sufferer would, on reflection, accept a trade between their harm and the other harms in question, so that a dust speck and a day of torture never sit in the same sum at all. Does this dissolve the paradox, or does it merely relocate it (e.g., to cases where everyone endures the same barely-noticeable harm)? Then, and only briefly, score continuous aggregative utilitarianism, a lexical or threshold view, and my friend's comparability proposal against your list. I care most about the requirements and their motivating cases, not the scorecard.
