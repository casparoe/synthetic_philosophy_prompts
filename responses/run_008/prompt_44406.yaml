  This is a sophisticated pivot. You are asking to move from the *verdict* (which side wins?) to the *jurisdiction* (what rules must the court follow?). This is the correct move. The Torture vs. Dust Specks debate is rarely about the specific case; it is a stress test for the structural integrity of our moral arithmetic.

  Below is the specification of desiderata for an adequate theory of interpersonal aggregation. I have classified them by their modal status (whether they are formal necessities or substantive commitments) and flagged the incompatibilities.

  ### I. The Desiderata Specification

  #### 1. Rational Transitivity
  *   **The Consideration:** If State A is morally better than State B, and State B is better than State C, then State A must be better than State C. This applies across the entire continuum of harms (from one speck to fifty years of torture). Without this, moral reasoning is vulnerable to "money pumps" (cycling preferences) and cannot guide choice.
  *   **Status:** **Non-negotiable (Formally).** While some ethicists (e.g., Larry Temkin) argue that "all-things-considered betterness" might be intransitive, any theory claiming to be a *social choice function* or a guide for rational action generally cannot abandon this without collapsing into arbitrariness.
  *   **Conflict:** This is the primary casualty of the "Spectrum Argument." Intuitively, we want to say Torture > Specks, but also that each step in the continuum (adding one person, reducing pain slightly) is not worse than the previous. Maintaining transitivity forces you to accept the sum of those steps, leading to the counter-intuitive verdict.

  #### 2. The De Minimis Constraint
  *   **The Consideration:** There exists a threshold of harm below which an individual's suffering carries zero moral weight *in isolation*. A dust speck in the eye is annoying, but not a moral object of concern. A theory should not treat a utility change of 0.000001 as morally identical in kind to a utility change of 1,000,000.
  *   **Status:** **Camp Prejudice (Substantive).** Strict aggregative consequentialists reject this (utility is continuous and linear). Non-aggregativists and common-sense morality insist on it. Whether this is a "requirement" depends on whether you prioritize formal continuity or intuitive salience.
  *   **Conflict:** Directly conflicts with **Sensitivity to Numbers** (see below). If individual harms below threshold $t$ count for nothing, how does a million of them sum to something above $t$? (The Sorites Problem).

  #### 3. Sensitivity to Numbers (Aggregation)
  *   **The Consideration:** If a harm is morally significant for one person, it must be *more* significant when suffered by many. If breaking one arm is bad, breaking a billion arms must be worse. A theory cannot be indifferent to the number of sufferers when the type of harm is held constant.
  *   **Status:** **Non-negotiable (Practically).** A theory that fails this is practically inert. It implies that saving a million people from a broken arm is no more urgent than saving one.
  *   **Conflict:** Conflicts with **De Minimis** if the harm in question is trivial. If dust specks are de minimis, does aggregating them eventually trigger moral significance? If yes, where is the cutoff? If no, you violate **Sensitivity to Numbers**.

  #### 4. Separability (Independence of Irrelevant Persons)
  *   **The Consideration:** Whether I am permitted to inflict a harm on Person A should not depend on the unrelated suffering of Person B in a distant country. My local obligations should be locally determined.
  *   **Status:** **Camp Prejudice (Substantive).** Utilitarianism rejects this (global sum matters). Contractualism and Agent-Relative views accept this. This is not a formal requirement of rationality, but a commitment about the *structure* of moral obligations.
  *   **Conflict:** Conflicts with **Demandingness**. If you reject separability, you are globally responsible for all aggregatable harms, which exacerbates the overload problem.

  #### 5. Action-Guidingness (No Paralysis)
  *   **The Consideration:** The theory must not generate obligations that are impossible to fulfill or that consume 100% of the agent's resources. If tiny harms aggregate infinitely, and we are obligated to prevent the greatest aggregate harm, we must spend every waking moment preventing dust specks globally.
  *   **Status:** **Non-negotiable (Pragmatic).** An ethical theory that demands moral sainthood to the point of functional paralysis is inadequate as a *human* ethics.
  *   **Conflict:** Conflicts with **Sensitivity to Numbers** + **No De Minimis**. If every speck counts and they sum up, the total negative utility of the world is infinite (or near enough), creating infinite obligation.

  ---

  ### II. The Impossibility Result

  You asked to flag pairs that cannot be jointly satisfied. The situation is more severe: there is a **Trilemma**. You cannot satisfy the following three desiderata simultaneously:

  1.  **Transitivity** (across the continuum).
  2.  **Continuity** (No lexical jumps; i.e., rejecting the idea that Torture is in a completely different category than Specks).
  3.  **Anti-Repugnance** (The verdict that Torture is worse than any number of Dust Specks).

  **Why:** If you accept Transitivity and Continuity, you must accept that a long chain of "slightly worse" trade-offs leads from Specks to Torture. Therefore, enough Specks must outweigh Torture. To avoid this (Anti-Repugnance), you must either break Transitivity (accept cycles) or accept Continuity failures (assert a Lexical Threshold where value jumps discontinuously).

  **The "Workhorse" Exclusionary Requirement:**
  **Transitivity.**
  This is the single requirement that does the most work excluding candidate theories. Most intuitive responses to the Torture vs. Specks case rely on intransitive judgments (e.g., "Specks are fine, slightly more specks are fine... eventually torture is not fine, but no single step was the turning point"). To build a formal theory, you must enforce transitivity. This immediately kills any view that relies on "vagueness" or "slippery slopes" to avoid the aggregation conclusion. It forces you to either accept the aggregation (Utilitarianism) or posit a hard, defensible cliff (Lexicalism).

  ---

  ### III. Evaluation of the "Pairwise Comparability" Proposal

  Your friend's proposal is a variation of **Contractualist Aggregation** or **Incommensurability**. The condition is: *Harm A aggregates with Harm B only if the sufferers could reasonably accept a trade between the two.*

  **Does it dissolve the paradox?**
  It dissolves the *verdict* (it successfully blocks the conclusion that Specks > Torture) but it **relocates the paradox to the boundary of commensurability.**

  1.  **The Relocation:** The paradox moves from "How many specks equal torture?" to "At what point does a trade become unacceptable?" If a pinprick is tradable for a speck, and a punch is tradable for a pinprick, transitivity suggests a punch is tradable for a speck. If your friend's theory blocks the trade between Speck and Torture directly, it violates Transitivity (see Desideratum 1). If it allows the chain of trades, it collapses back into Utilitarianism.
  2.  **The Homogeneous Case:** Consider a billion people with dust specks. Do they aggregate to outweigh one broken arm? Under your friend's view, a speck-sufferer would not trade for a broken arm. Therefore, the specks never enter the same "sum" as the arm. The billion specks are morally invisible compared to the arm.
      *   *Verdict:* This avoids the Torture conclusion but violates **Sensitivity to Numbers**. It implies that vast aggregates of trivial suffering can never outweigh a moderate harm. This is a bullet many find harder to bite than the original paradox.
  3.  **Assessment:** It is a serious proposal, effectively a **Lexical Threshold** disguised as a procedural constraint. It is not a dissolution of the problem, but a commitment to **Discontinuous Value**. It satisfies Anti-Repugnance and Action-Guidingness but fails Transitivity (if applied strictly to pairwise links) or Sensitivity to Numbers (if applied to aggregates).

  ---

  ### IV. Brief Scorecard

  Here is how the three theories score against the Non-negotiable desiderata (Transitivity, Sensitivity to Numbers, Action-Guidingness).

  | Theory | Transitivity | Sensitivity to Numbers | Action-Guidingness | Verdict on Specks vs. Torture |
  | :--- | :--- | :--- | :--- | :--- |
  | **Continuous Aggregative Utilitarianism** | **Pass** | **Pass** | **Fail** (Leads to Overload/Paralysis) | Specks > Torture (if N is large enough) |
  | **Lexical / Threshold View** | **Pass** (with discontinuity) | **Fail** (Below threshold) | **Pass** | Torture > Specks (Always) |
  | **Pairwise Comparability** | **Fail** (Violates chain logic) | **Fail** (Blocks aggregation) | **Pass** | Torture > Specks (Incommensurable) |

  **Analysis:**
  *   **Utilitarianism** is the only one that preserves formal rationality (Transitivity + Aggregation) but fails the practical constraint (Action-Guidingness). It is theoretically robust but practically implausible.
  *   **Lexical Views** preserve Action-Guidingness and the "Torture > Specks" intuition but must posit a magical cutoff point where value jumps. They struggle to justify *where* the threshold lies without arbitrariness.
  *   **Your Friend's Proposal** preserves the intuition and Action-Guidingness but sacrifices Transitivity. It claims that moral value is not a single currency. This is philosophically costly, as it makes trade-offs between different types of harm rationally unresolvable.

  ### V. Conclusion

  The real result of your evening's argument is likely this: **There is no theory that satisfies all five desiderata.**

  If you demand **Transitivity** and **Sensitivity to Numbers**, you must accept that enough specks outweigh torture (Utilitarianism).
  If you demand **Action-Guidingness** and **Anti-Repugnance** (Torture is worse), you must sacrifice either **Transitivity** (your friend's view) or **Sensitivity to Numbers** (Lexicalism).

  The argument should not be about which verdict is correct. It should be about which desideratum you are willing to abandon. Most philosophers abandon strict **Transitivity** (accepting some intransitivity in "all-things-considered" judgments) or abandon **Continuity** (accepting Lexical thresholds). Your friend's proposal is a specific mechanism for abandoning Continuity. It is a viable path, provided they are willing to admit that it renders vast numbers of trivial harms morally negligible.
