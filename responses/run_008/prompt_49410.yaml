prompt: |-
  I hold a version of the institutional critique of effective altruism: not the crude claim that effective altruists are indifferent to systemic change, but the more specific claim that EA's decision procedure is structurally biased toward the measurable. Because the movement's flagship method is to rank interventions by expected impact per dollar, using evidence of the kind that randomized trials and DALY-style metrics can produce, it will systematically over-fund interventions whose benefits are countable and under-fund those whose benefits are diffuse, slow, or political — institutional reform, state capacity, basic research, movement-building. On my view this is not a temporary gap that better measurement will close; it is a selection effect. The method determines which projects can compete at all, so the neglected interventions don't lose the competition — they never enter it.

  Tell me what would count against this view. I'd like a ranked map, from fatal to merely awkward, covering: observations that would show the bias is real but self-correcting as measurement tools improve; cases where EA institutions have funded hard-to-measure work at scale, and what such cases would do to my claim that the invisible interventions never get to compete; and structural predictions my view seems to make (about the shape of grant portfolios) that could turn out false. Then press on the philosophical core: is my implicit assumption — that diffuse, political, or slow-moving benefits can't be given fair expected-value estimates — actually tenable? If expected-value reasoning can in principle handle deep uncertainty, does my critique collapse into the much weaker complaint that the current estimates are poor, and if so, is that weaker complaint enough to sustain an institutional critique at all? Finally, assess honestly whether the view as I've stated it has been insulated from disconfirmation — whether anything could in principle show it false — and whether such insulation is a defect in a claim of this kind. Please distinguish what a thoughtful effective altruist would concede as counting against the critique from what only its committed opponents would say, and conclude with your own judgment of how exposed the view really is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Core Claim:** The user holds a specific version of the institutional critique of Effective Altruism (EA). It's not that EAs *ignore* systemic change, but that the *decision procedure* (ranking by expected impact per dollar using specific evidence types like RCTs/DALYs) creates a structural bias toward the measurable. This leads to systematic under-funding of diffuse, slow, or political interventions (institutional reform, state capacity, basic research, movement-building). This is a *selection effect*: these interventions don't lose the competition; they never enter it.
      *   **Task:** Tell the user what would count *against* this view.
      *   **Structure:**
          1.  Ranked map of counter-evidence (Fatal -> Merely Awkward).
          2.  Categories: Self-correction via measurement improvement, cases of funding hard-to-measure work (challenging the "never enter" claim), structural predictions about grant portfolios.
          3.  Philosophical Core: Is the assumption that diffuse benefits can't be given fair EV estimates tenable? If EV can handle deep uncertainty, does the critique collapse to "current estimates are poor"? Is that weak complaint enough for an institutional critique?
          4.  Falsifiability/Insulation: Has the view been insulated from disconfirmation? Is this a defect?
          5.  Perspective Distinction: What would a thoughtful EA concede vs. what only committed opponents would say?
          6.  Final Judgment: How exposed is the view really?

  2.  **Analyze the Core Claim (The "Measurability Bias" Critique):**

      *   *Strength:* It's a sophisticated critique. It acknowledges EA's intent but attacks the *mechanism*. It aligns with Goodhart's Law and the "streetlight effect."
      *   *Weakness:* It assumes EA is monolithic, static, and incapable of epistemic humility or methodological evolution. It assumes "measurable" is strictly defined by RCTs/DALYs, ignoring qualitative EV modeling.

  3.  **Drafting the Ranked Map (Counter-Evidence):**

      *   *Fatal:* Evidence that the decision procedure *itself* prioritizes the hard-to-measure when uncertainty is high (e.g., Longtermism). If EA funds things with *no* RCTs (AI safety, biosecurity policy) based on rough EV, the "measurability bias" claim is factually wrong regarding the movement's center of gravity.
      *   *Severe:* Data showing grant portfolios are shifting *away* from RCT-heavy global health toward policy/systemic work *without* a corresponding leap in measurement precision.
      *   *Moderate:* Internal mechanisms (cause prioritization research) explicitly designed to bring "invisible" interventions into the competition.
      *   *Awkward:* Acknowledgement of bias but framing it as a necessary heuristic trade-off (speed/accuracy) rather than a structural blind spot.

  4.  **Addressing the "Never Enter" Claim:**

      *   If Open Philanthropy funds US criminal justice reform or AI governance, these are hard to measure. Did they "enter the competition"? Yes, via cause prioritization research.
      *   *Counter-argument:* The user might say they entered *on EA terms* (forced quantification).
      *   *Rebuttal:* If the funding happens, the selection effect isn't excluding them, it's just evaluating them differently.

  5.  **Philosophical Core (EV and Deep Uncertainty):**

      *   *Question:* Can EV handle deep uncertainty?
      *   *EA View:* Yes, via "wide confidence intervals," "scenario planning," and "robust decision making."
      *   *Critique:* If EV *can* handle it, is the critique just "you're doing the math wrong"?
      *   *Nuance:* If the math requires assumptions that inherently favor the status quo (e.g., discount rates, probability assignments to political change), the bias remains structural even if EV is the tool.
      *   *Collapse:* If the critique collapses to "current estimates are poor," is that enough? Yes, if "poor" is systemic and persistent due to incentive structures (publish or perish, donor reporting).

  6.  **Falsifiability/Insulation:**

      *   *Risk:* The critique is vulnerable to the "No True Scotsman" or "Moving Goalposts." (e.g., "You funded policy? But you quantified it, so it's still measurability bias.")
      *   *Test:* Can the user specify a *specific* intervention that *should* be funded but isn't, and define the conditions under which EA *would* fund it?
      *   *Insulation:* If every attempt to fund hard-to-measure work is dismissed as "still too quantified," the critique is insulated.
      *   *Defect:* Yes, unfalsifiable claims are weak. But institutional critiques are often sociological, not purely empirical.

  7.  **Perspective Distinction:**

      *   *Thoughtful EA:* Concedes the "global health/development" phase was too RCT-focused. Acknowledges the "Longtermist" shift challenges the critique. Admits measurement drives behavior but argues it's a feature, not a bug, that is being calibrated.
      *   *Committed Opponent:* Says EA is inherently neoliberal/utilitarian and cannot value democracy/justice intrinsically, only instrumentally.

  8.  **Final Judgment:**

      *   The view is *less* exposed than it should be because it conflates "EA Global Health" with "EA as a whole." The rise of Longtermism (AI, Bio) significantly weakens the "RCT/DALY" specific critique, though a broader "quantification bias" might remain.
      *   The critique is strongest when applied to the *implementation* layer (grant officers needing metrics for reports) rather than the *prioritization* layer (philosophical cause selection).

  9.  **Refining and Polishing:**

      *   *Tone:* Respectful, analytical, rigorous. Match the user's intellectual level.
      *   *Structure:* Follow the prompt's requested sections exactly.
      *   *Key Insight:* The shift from "Global Health (RCTs)" to "Longtermism (Probabilistic Modeling)" is the biggest threat to this critique. The user needs to address why AI Safety funding doesn't disprove the measurability bias (answer: it replaces RCTs with subjective probabilities, which might still be biased).

  10. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe argue that EA funds basic science.
      *   *Correction:* EA doesn't fund much basic science directly. Better to focus on AI Safety and Biosecurity policy, which are high-uncertainty but high-funding.
      *   *Check:* Did I address the "selection effect" specifically? Yes, need to emphasize that cause prioritization research *is* the entry mechanism.
      *   *Check:* Did I address the "insulation" aspect? Yes, need to highlight the risk of redefining "measurable" to keep the critique alive.

  11. **Final Review against Prompt:**
      *   Ranked map? Yes.
      *   Observations on self-correction? Yes.
      *   Cases of hard-to-measure funding? Yes.
      *   Structural predictions? Yes.
      *   Philosophical core (EV & uncertainty)? Yes.
      *   Insulation/Falsifiability? Yes.
      *   Thoughtful EA vs. Opponent? Yes.
      *   Final Judgment? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sophisticated and charitable formulation of the institutional critique. It avoids the strawman that EAs are morally indifferent to justice, focusing instead on the *epistemic technology* of the movement (cost-effectiveness analysis, EV modeling) as a gatekeeping mechanism.

  To test the robustness of this view, we must identify what evidence would force you to update, distinguish between empirical and philosophical vulnerabilities, and assess whether the claim is falsifiable.

  ### I. A Ranked Map of Counter-Evidence

  Here is a hierarchy of observations that would count against your view, ranked from **Fatal** (would require abandoning the core thesis) to **Merely Awkward** (would require nuance but sustain the core).

  #### 1. Fatal: The "Longtermist" Pivot
  **Observation:** The majority of EA capital (e.g., Open Philanthropy, FTX-era funding) shifts from RCT-based global health to AI safety, biosecurity, and macroscopic strategy.
  **Why it counts:** These fields lack RCTs, DALYs, or historical baselines. They rely on subjective probability estimates, argumentative rigor, and "patient philanthropy."
  **Impact on Critique:** If the movement's center of gravity moves to interventions where *no* hard measurement is possible, yet funding scales massively, the claim that the decision procedure is biased toward the *measurable* is empirically falsified. It suggests the bias is toward the *tractable to argument*, not necessarily the *measurable in data*.
  **Your Counter-move:** You might argue subjective probabilities are still a form of forced quantification that biases against political nuance. But this weakens your claim from "biased toward the measurable" to "biased toward the quantifiable," which is a different, more philosophical objection.

  #### 2. Severe: Successful "Blind" Funding Mechanisms
  **Observation:** EA institutions create funding vehicles that explicitly decouple reporting from metrics (e.g., "no-strings-attached" grants to movement builders or policy entrepreneurs) and these vehicles outperform metric-tied grants in retrospective analysis.
  **Why it counts:** This shows the institution recognizes the selection effect and has engineered a workaround that functions *within* the EA ecosystem.
  **Impact on Critique:** It undermines the claim that the method *determines* which projects compete. If the method can self-modify to allow invisible interventions to compete, it is a flexible tool, not a structural cage.

  #### 3. Moderate: Cause Prioritization Research as Entry
  **Observation:** Significant resources are spent on "cause prioritization" research for areas like institutional reform, where the output is not a cost-per-life metric but a qualitative case for neglectedness and tractability.
  **Why it counts:** You claim invisible interventions "never enter" the competition. If EA funds researchers specifically to build the case for hard-to-measure interventions (e.g., US criminal justice reform, land use policy), those interventions *have* entered the competition.
  **Impact on Critique:** It forces you to concede that the barrier to entry is high, not non-existent. The critique shifts from "exclusion" to "high transaction costs for entry."

  #### 4. Awkward: Measurement Tools Improving on Diffuse Benefits
  **Observation:** New methodologies (e.g., process tracing, Bayesian updating on policy outcomes, longitudinal qualitative studies) gain traction within EA and successfully rank political interventions.
  **Why it counts:** This supports the "temporary gap" hypothesis you reject.
  **Impact on Critique:** If the "measurable" category expands to swallow the "diffuse" category without losing fidelity, the bias is technological, not structural.

  ---

  ### II. Structural Predictions and Portfolio Shapes

  Your view makes specific predictions about the shape of EA grant portfolios. If these turn out false, your view weakens.

  1.  **The "Tail" Prediction:** You predict that hard-to-measure work (policy, movement building) will always remain a small tail of the portfolio, regardless of total budget size.
      *   *Falsification:* If hard-to-measure work becomes the *head* of the portfolio (e.g., >50% of Open Phil's grants go to policy/advocacy without strict metrics), the selection effect is not dominant.
  2.  **The "Reporting" Prediction:** You predict that grantees working on systemic issues will be forced to distort their goals to fit metrics (Goodhart's Law), leading to mission drift.
      *   *Falsification:* If longitudinal studies of EA grantees show that policy groups maintain their political strategy without succumbing to metric-driven drift, the institutional pressure is weaker than assumed.
  3.  **The "Personnel" Prediction:** You predict EA organizations will disproportionately hire data scientists and economists over political theorists or historians.
      *   *Falsification:* If hiring data shows a shift toward interdisciplinary teams where qualitative experts hold veto power over quantitative models, the epistemic hierarchy is flattening.

  ---

  ### III. The Philosophical Core: Expected Value and Deep Uncertainty

  This is the crux of the matter. You assume that diffuse, political, or slow-moving benefits cannot be given fair expected-value (EV) estimates.

  **1. Is this assumption tenable?**
  Strictly speaking, no. Bayesian reasoning allows for probability assignments on unique events (e.g., "What is the probability this advocacy campaign shifts the Overton Window?"). EA philosophy explicitly incorporates "deep uncertainty" via tools like scenario planning and robust decision-making.
  *   **The Vulnerability:** If EV *can* in principle handle deep uncertainty, your critique risks collapsing into: *"EAs are currently bad at estimating these probabilities."*
  *   **Is that enough?** A critique based on "current incompetence" is weaker than "structural impossibility." However, you can salvage it by arguing that the *incentive structure* of EA (donors wanting justification, tax authorities requiring metrics) makes it *practically* impossible to use EV fairly for political work, even if it's *theoretically* possible. This moves the critique from epistemology to sociology.

  **2. Does the critique collapse?**
  If you concede that EV can handle deep uncertainty, you must admit that an intervention *could* win on EV grounds even if its benefits are diffuse.
  *   **The Rescue:** You can argue that the *prior distributions* EAs use are inherently biased. For example, assigning a low prior to "political change" because it lacks historical data is itself a bias toward the status quo. If the "neutral" starting point for EV modeling assumes stability, then revolutionary or reformist work is mathematically penalized before evidence is even considered.
  *   **Verdict:** The critique survives if you argue that the *parameters* of EV modeling (discount rates, probability priors, time horizons) are structurally conservative, not just that the *data* is missing.

  ---

  ### IV. Insulation from Disconfirmation

  **Has the view been insulated?**
  There is a risk of insulation here. If EA funds a political campaign, a proponent of your view might say, "They only funded it because they quantified the votes, thus distorting the work." If EA funds basic research, you might say, "They only funded it because they could count papers."
  *   **The Defect:** If every instance of funding hard-to-measure work is reinterpreted as "co-option into the measurable framework," the claim becomes unfalsifiable. A claim that explains all outcomes (funding = co-option; no funding = neglect) is a worldview, not a hypothesis.
  *   **The Fix:** You must specify a *counterfactual*. What would an EA portfolio look like if your critique were false? It would need to contain specific interventions that are *explicitly* funded *despite* the inability to quantify their impact, with the justification being qualitative moral urgency. If such grants exist and are celebrated within EA, your critique needs refinement.

  **Is insulation a defect?**
  Yes. In social science, a critique that cannot specify what would change its mind loses predictive power. However, institutional critiques are often *critical theory* rather than *empirical science*. Their goal is to reveal power dynamics, not to make point predictions. If you frame this as a sociological critique of power (quantification as power), insulation is less damaging. If you frame it as an empirical claim about allocation efficiency, insulation is fatal.

  ---

  ### V. Perspectives: Concessions vs. Opposition

  **What a Thoughtful Effective Altruist Would Concede:**
  1.  **Historical Validity:** They would agree that the "Global Health & Development" phase (2010–2018) was overly reliant on RCTs and DALYs, creating the exact bias you describe.
  2.  **Implementation Drag:** They would admit that grant reporting requirements often force grantees to manufacture metrics, creating inefficiency.
  3.  **The "Easy to Measure" Trap:** They would acknowledge that cause prioritization often starts with "what can we model?" rather than "what is most important?", which is a methodological error they are trying to correct.

  **What Only Committed Opponents Would Say:**
  1.  **Inherent Neoliberalism:** That EA is fundamentally a market-based ideology that *cannot* value public goods or democracy intrinsically, only instrumentally. (This attacks the moral core, not the decision procedure).
  2.  **Bad Faith:** That the shift to Longtermism is a deliberate evasion of the measurability critique, not a genuine evolution.
  3.  **Total Incompatibility:** That *any* quantification of human welfare is morally illicit, rendering the entire EV project void.

  ---

  ### VI. Final Judgment: How Exposed is the View?

  **The view is moderately exposed, primarily due to the Longtermist shift.**

  Your critique is highly accurate regarding the **2015 EA movement** (GiveWell, AMF, deworming). It is less accurate regarding the **2025 EA movement** (AI Safety, Biosecurity, Institutional Decision-Making).

  *   **The Weak Point:** The claim that invisible interventions "never enter" the competition is empirically vulnerable. Open Philanthropy's funding of US policy reform and AI governance shows that interventions with no RCTs and highly diffuse benefits *do* compete and win. They compete on *argumentative tractability*, not *measurement*.
  *   **The Strong Point:** The claim that the *requirement to justify* funding via a model biases the *type* of arguments made is robust. Even in AI Safety, there is pressure to produce "numbers" (e.g., timelines, probability of doom) that may be illusory.

  **Verdict:**
  To sustain this critique, you must update it from **"Bias toward the Measurable"** to **"Bias toward the Modelable."**
  EA does not require data; it requires a model. If a political intervention can be modeled (even with wide error bars), it can enter. If it resists modeling (e.g., cultural shift, dignity, solidarity), it is excluded.

  **Is this distinction fatal to your view?** No. It sharpens it. The critique is not that EAs love spreadsheets; it's that they love *reductionism*. If you pivot to argue that the decision procedure selects for interventions that can be *reduced to a causal chain*, you capture both the RCT era and the Longtermist era.

  **Falsifiability Check:**
  Your view remains falsifiable if you define "reductionism" operationally. For example: "If EA funds a project where the primary justification is 'this preserves a value we cannot define operationally,' the critique is false." Since EA rarely funds purely intrinsic values without an instrumental chain, your view remains safe but narrow. It is insulated from *empirical* disconfirmation (funding amounts) but vulnerable to *philosophical* disconfirmation (if EA successfully adopts non-reductionist moral epistemologies).

  **Recommendation:**
  Don't let opponents trap you into defending "measurement." Defend "epistemic reductionism." That is the structural bias that survives the transition from Global Health to AI Safety.
