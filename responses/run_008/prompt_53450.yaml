      *   *Current Consensus:* The Fischer thesis dominated for 30 years. Since the 90s/2000s, the pendulum has swung back toward shared responsibility (Clark's *Sleepwalkers* is the big one here). However, most serious historians still acknowledge Germany took the biggest risks.
