  # The Tribunal of St. Jude's: A Thought Experiment

  ### The Scenario
  **Setting:** The Device Approval Tribunal at St. Jude's Memorial Hospital.
  **Task:** A binary decision on whether to re-approve a legacy cardiac monitoring system (Verdict: *Safe* vs. *Unsafe*). The "correct" verdict is determined by an objective, post-hoc audit of the device's actual failure rate (unknown to the tribunal at the time of voting).
  **Panel Composition:**
  1.  **Incumbents (3):** Senior Cardiologists.
  2.  **Newcomer (1):** A rotating Junior Fellow, added to satisfy a new hospital governance policy requiring "broader representation."
  **Voting Rule:** Simple Majority.
  **Tie-Breaking:** In the event of a 2-2 split (possible only after the newcomer joins), the bylaws mandate an **unbiased random draw** (e.g., drawing straws) to avoid giving the Chair veto power. A "Win" for the draw counts as 0.5 probability of correctness.

  ### Member Competences
  Competence ($p$) is defined as the probability a member votes for the objectively correct verdict.

  *   **Senior Members ($S_1, S_2, S_3$):** $p = 0.75$.
      *   *Justification:* Derived from a 5-year audit of their individual diagnostic logs against confirmed outcomes. They consistently outperform chance but are not infallible.
  *   **Junior Member ($J_1$):** $p = 0.55$.
      *   *Justification:* Derived from calibration testing during fellowship. $J_1$ is sincere and aims for the truth, meeting the $>51\%$ threshold, but lacks the pattern recognition of the seniors.
  *   **Independence:** All members review the data independently. There is no deliberation that correlates their errors.

  ### Probability Computation

  #### 1. Original Panel ($n=3$)
  With 3 members, a majority requires 2 or 3 correct votes. There are no ties.
  Let $W$ = Correct Vote, $L$ = Incorrect Vote.
  *   **3W (Unanimous):** $0.75^3 = 0.4219$
  *   **2W (Split 2-1):** $\binom{3}{2} \times 0.75^2 \times 0.25 = 3 \times 0.5625 \times 0.25 = 0.4219$
  *   **Total Probability Correct ($P_3$):** $0.4219 + 0.4219 = \mathbf{0.84}$

  #### 2. Enlarged Panel ($n=4$)
  With 4 members, a majority requires 3 or 4 correct votes. A 2-2 split is a tie resolved by coin flip (0.5 value).
  *   **4W (Unanimous):** $0.75^3 \times 0.55 = 0.4219 \times 0.55 = 0.2320$ (Win)
  *   **3W (Seniors 3W, Junior L):** $0.75^3 \times 0.45 = 0.4219 \times 0.45 = 0.1898$ (Tie)
  *   **3W (Seniors 2W, Junior W):** $0.4219 \times 0.55 = 0.2320$ (Win)
  *   **2W (Seniors 2W, Junior L):** $0.4219 \times 0.45 = 0.1898$ (Tie)
  *   **2W (Seniors 1W, Junior W):**
      *   Seniors 1W: $\binom{3}{1} \times 0.75 \times 0.25^2 = 3 \times 0.75 \times 0.0625 = 0.1406$
      *   With Junior W: $0.1406 \times 0.55 = 0.0773$ (Tie)
  *   **Loss States (1W or 0W):** The remaining probability mass results in a loss regardless of the tie-break.

  **Calculation of $P_4$:**
  *   **Certain Wins:** $0.2320 + 0.2320 = 0.4640$
  *   **Tie States:** $0.1898 + 0.1898 + 0.0773 = 0.4569$
  *   **Value of Ties:** $0.4569 \times 0.5 = 0.2285$
  *   **Total Probability Correct ($P_4$):** $0.4640 + 0.2285 = \mathbf{0.69}$

  #### 3. The Degradation
  *   **Drop:** $0.84 - 0.69 = 0.15$ (15 percentage points).
  *   **Constraint Check:** The drop is strictly lower and exceeds the required 1 percentage point.

  ### The Single Feature: Competence Heterogeneity
  The feature driving this collapse is **adding a lower-competence member to an odd-sized panel.**

  **The Removal Test:**
  If we delete the competence gap and assume the newcomer has the same competence as the incumbents ($p=0.75$), the math changes:
  *   $P_3$ remains $0.84$.
  *   $P_4$ (Homogeneous):
      *   4W: $0.75^4 = 0.32$
      *   3W: $4 \times 0.75^3 \times 0.25 = 0.42$
      *   2W (Tie): $6 \times 0.75^2 \times 0.25^2 = 0.21$
      *   $P_4 = 0.32 + 0.42 + (0.5 \times 0.21) = 0.84$.
  *   **Result:** The drop vanishes (reducing to a negligible rounding difference of 0.0001 due to the tie-break).
  *   **Conclusion:** The degradation does not come from "adding a voter" per se, nor from the "even panel size" alone. It comes from the **dilution of average competence** combined with the **parity shift** that converts certain wins (2-1 splits) into uncertain ties (2-2 splits).

  ### The Condorcet Defender's Reply
  **Does this threaten the theorem?**
  No. It threatens the *gloss*. The Condorcet Jury Theorem (CJT) strictly assumes either homogeneous competence or specific conditions on the distribution of $p_i$ as $n \to \infty$. In finite samples, specifically when moving from odd to even $n$, the tie-breaking penalty is real. The defender would argue:
  1.  **Asymptotics:** CJT is a limit theorem ($n \to \infty$). Finite fluctuations are expected.
  2.  **Assumptions:** The standard gloss ignores competence heterogeneity.
  3.  **Redesign:** To ensure adding a member never reduces reliability:
      *   **Maintain Odd Sizes:** Only add members in pairs ($3 \to 5$) to avoid ties.
      *   **Weighted Voting:** Weight votes by log-odds of competence ($\ln(p/(1-p))$). The junior's vote would carry less weight, preventing them from forcing a tie against two seniors.

  ### Average Member Comparison
  *   **Original Panel:** Avg Competence = 0.75. Panel Accuracy = 0.84. (Panel > Average).
  *   **Enlarged Panel:** Avg Competence = $(0.75 \times 3 + 0.55) / 4 = 0.7375$. Panel Accuracy = 0.69.
  *   **Honest Assessment:** The enlarged panel is **less accurate than its average member**. This indicates severe damage. The voting mechanism (simple majority + random tie-break) has failed to aggregate the available information efficiently, actively destroying value by allowing a weak signal to deadlock strong signals.

  ### Maximum Possible Drop
  To maximize the drop, we maximize the Senior competence ($p_S \to 1.0$) and minimize the Junior competence ($p_J \to 0.51$).
  *   If $p_S = 1.0$, $P_3 = 1.0$.
  *   If $p_J = 0.51$:
      *   $P_4 = (1.0 \times 0.51) + 0.5 \times (1.0 \times 0.49) = 0.51 + 0.245 = 0.755$.
  *   **Max Drop:** $1.0 - 0.755 = 0.245$ (24.5%).
  *   **Bound:** This is a theoretical bound for the $3 \to 4$ transition under these rules. My construction (15%) is well within this bound, demonstrating the effect is not a fringe edge case but a robust risk.

  ### Summary Table

  | Panel Configuration | Panel Size | Individual Competences | Tie-Breaking Rule | Probability Correct | What Drives the Change |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Original Tribunal** | 3 | 0.75, 0.75, 0.75 | N/A (Odd) | 0.84 | Baseline (Strong Majority) |
  | **Enlarged Tribunal** | 4 | 0.75, 0.75, 0.75, 0.55 | Unbiased Random (0.5) | 0.69 | Weak voter converts Wins to Ties |
  | **Repaired (Homogeneous)** | 4 | 0.75, 0.75, 0.75, 0.75 | Unbiased Random (0.5) | 0.84 | Competence equality neutralizes parity loss |
  | **Repaired (Odd Size)** | 5 | 0.75, 0.75, 0.75, 0.55, 0.55 | N/A (Odd) | ~0.76* | Adding 2 members restores majority rule |

  *\*Note on Repaired Odd Size: Adding two juniors ($n=5$) still lowers accuracy from 0.84 due to low competence, but eliminates the specific "tie-dilution" penalty of the even panel. To guarantee improvement, weighted voting is required.*
