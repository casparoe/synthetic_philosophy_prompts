  ### Formal Comparison of Ergodic and Bargaining Arguments for Kelly Behavior

  To evaluate the claims of the ergodicity and bargaining arguments, we must first formalize the decision problem and the competing objective functionals.

  **Definitions:**
  Let $W_0$ be initial wealth. A gamble is a random variable $X$ representing the gross return multiplier ($W_1 = W_0 \cdot X$).
  1.  **Arithmetic Expectation (VNM Standard):** Maximize $E[W_1] = W_0 \cdot E[X]$.
  2.  **Geometric Expectation (Kelly):** Maximize $\exp(E[\log X])$, equivalent to maximizing $E[\log W_1]$.
  3.  **Time-Average Growth (Ergodic):** Maximize $g = \lim_{T\to\infty} \frac{1}{T} \log(W_T/W_0)$.
  4.  **Nash Product (Bargaining):** Maximize $\prod_{i} (U_i - d_i)$ over states $i$, where $d_i$ is the disagreement point.

  The central question is whether (3) and (4) constitute a *reform* of decision theory that supersedes (1), or whether they are merely derivations of a specific utility function $U(W) = \log W$ within the standard framework.

  #### 1. Derivation vs. Assumption: The Source of Concavity

  **The Ergodicity Argument**
  This argument begins with the dynamics of wealth. For a repeated multiplicative process $W_{t+1} = W_t \cdot X_t$, the wealth after $T$ steps is $W_T = W_0 \prod_{t=1}^T X_t$.
  The time-average growth rate is:
  $$ g = \lim_{T\to\infty} \frac{1}{T} \log \left( \frac{W_T}{W_0} \right) = \lim_{T\to\infty} \frac{1}{T} \sum_{t=1}^T \log X_t $$
  By the Law of Large Numbers, this converges to $E[\log X]$.
  *Derivation Status:* The logarithm here is not an assumption of preference; it is a mathematical consequence of the compounding operation. The argument claims that because the process is non-ergodic ($E[W_T] \neq \exp(T \cdot E[\log X])$), the ensemble expectation $E[W]$ is physically irrelevant to a single trajectory.
  *Concavity:* Concavity is not smuggled in as a utility preference; it is derived from the *dynamics*. However, the argument *does* smuggle in the premise that the agent's goal is to maximize long-run growth rate. If the agent's goal is to maximize expected wealth at a specific horizon $T$ (regardless of ruin risk), arithmetic expectation remains valid.

  **The Bargaining Argument**
  This argument models decision-making under uncertainty as a cooperative game between "outcome selves." Each possible state of the world $i$ is occupied by a version of the agent. They must agree on a policy $f$ (bet fraction) before the state is revealed.
  The Nash Bargaining Solution maximizes the product of utilities relative to a disagreement point (usually status quo):
  $$ \max_f \prod_i (U(W_i) - U(W_{sq})) $$
  Taking logs transforms the product to a sum:
  $$ \max_f \sum_i \log(U(W_i) - U(W_{sq})) $$
  If we assume utility is linear in wealth ($U(W)=W$) and the disagreement point is zero, this becomes $\max \sum \log W_i$, which is equivalent to maximizing $E[\log W]$.
  *Derivation Status:* The logarithm here arises from the axioms of bargaining (Pareto efficiency, Independence of Irrelevant Alternatives, Symmetry).
  *Concavity:* The concavity is structural to the *aggregation rule* across states, not necessarily the utility function over wealth itself. However, to recover Kelly exactly, one typically assumes linear utility over wealth so that the log comes from the Nash product.

  **Comparison:** Ergodicity derives log from *time dynamics*; Bargaining derives log from *social choice axioms*. Neither assumes log utility *a priori*, but both assume a higher-order goal (growth or fairness) that necessitates it.

  #### 2. The Standard VNM Response

  A standard Expected Utility (EU) theorist argues: "Maximize $E[U(W)]$. If you bet Kelly, it simply means your utility function is $U(W) = \log W$. No new theory is required."

  **Does this gut the arguments?**
  *   **Ergodicity:** The VNM response partially guts this. VNM theory is agnostic about *why* an agent has a specific utility function. Ergodicity economics claims to provide the *reason*: survival in non-ergodic environments instrumentally converges on log-utility behavior. However, formally, the behavior is indistinguishable from an agent with intrinsic log preferences. The "reform" claim rests on asserting that $E[\cdot]$ is the wrong operator. But since $E[\log W]$ is a valid expectation functional within VNM, the formalism holds without modification.
  *   **Bargaining:** The VNM response also absorbs this. If an agent's "utility" is defined as the Nash Product of outcome-utilities, then maximizing the expectation of *that* meta-utility is standard EU. The Bargaining argument attempts to derive the form of the utility function from fairness axioms. While normatively interesting, it does not break the VNM framework; it merely proposes a specific method for constructing $U$.

  **Verdict:** The VNM response does not make the arguments *false*, but it renders them *theoretically redundant*. They become derivations of a specific utility function rather than replacements for the decision theory itself.

  #### 3. Divergence Cases

  The two arguments are not perfectly co-extensive. Their domains of validity differ, revealing where one might hold while the other fails.

  *   **One-Shot Gambles:**
      *   *Ergodicity:* Fails to apply. There is no time average for a single event. The argument relies on $T \to \infty$.
      *   *Bargaining:* Applies naturally. The "copies" exist across possibility space, not time.
      *   *Implication:* If Kelly betting is rational for one-shot gambles, Ergodicity cannot be the fundamental justification.

  *   **Additive Income / Non-Multiplicative Wealth:**
      *   *Ergodicity:* The math becomes intractable. If $W_{t+1} = W_t \cdot X + Y$ (income), the log-growth rate does not separate cleanly. The "optimal" strategy may deviate from Kelly.
      *   *Bargaining:* Unaffected, provided utility is defined over final wealth states. The Nash product operates on outcomes, regardless of the path dynamics.

  *   **Bounded Utility:**
      *   *Ergodicity:* Problematic. If wealth has a hard cap (e.g., maximum possible utility in the universe), log growth eventually hits zero. The ergodic argument assumes unbounded growth potential.
      *   *Bargaining:* Handles this gracefully. The Nash product works over bounded utility ranges.

  *   **Literal Copies (Many Worlds):**
      *   *Ergodicity:* If all branches are real (Everettian), the ensemble average *is* the physical reality. The "single trajectory" premise dissolves.
      *   *Bargaining:* Strengthened. The "selves" are ontologically real, making the bargaining metaphor literal.

  **Verdict:** Bargaining has a wider domain of applicability (one-shot, bounded, additive). Ergodicity is strictly limited to repeated, multiplicative, unbounded processes.

  #### 4. Time-Bunching and Branch-Counting

  The ontological tension lies in whether we view uncertainty as "time" (Ergodic) or "branches" (Bargaining).

  Mathematically, the isomorphism is precise. A sequence of $T$ coin flips in time generates $2^T$ trajectories. An ensemble of $2^T$ agents flipping once generates $2^T$ outcomes.
  *   **Ergodic View:** I am one agent moving down *one* trajectory. I care about the time-average of that path.
  *   **Bargaining View:** I am a pre-commitment device for $2^T$ outcome-selves. I care about the geometric mean of their welfare.

  If we accept the "Many Worlds" or "Modal Realist" ontology, the Ergodic argument's claim that "the ensemble is a fiction" is false. The ensemble is real; I just don't know which index I am. In this case, the Ergodic argument collapses into the Bargaining argument (fairness across real copies).
  Conversely, if we view the Bargaining "selves" as merely hypothetical, the argument relies on a normative claim that hypothetical selves deserve veto power. This is ethically heavier than the Ergodic claim that "ruin ends the game."

  However, both arguments converge on the same functional: $\max E[\log W]$. This suggests the ontology is secondary to the mathematical structure of compounding/fairness.

  #### Thesis: Theoretical Redundancy

  Both the Ergodicity and Bargaining arguments are rigorous *derivations* of logarithmic utility, but neither constitutes a *reform* of decision theory.

  1.  **Mathematical Equivalence:** In the domain where both apply (repeated multiplicative gambles), they yield identical prescriptions. They are ontological duals: one integrates over time, the other over state-space.
  2.  **VNM Absorption:** Both arguments conclude that a rational agent should maximize $E[\log W]$. Standard Expected Utility Theory permits any monotonic utility function. Therefore, an agent following Kelly is simply an EU maximizer with $U(W) = \log W$.
  3.  **No Foundational Displacement:** The Ergodic claim that "Expectation is wrong" is only true if one insists $U(W)=W$ is the only rational utility. The Bargaining claim that "Arithmetic aggregation is unfair" is a normative justification for choosing $U(W)=\log W$. Neither requires changing the *rule* of decision theory (Maximize Expected Utility); they only inform the *choice* of the Utility function.

  The "reform" rhetoric arises from conflating the *operator* (Expectation) with the *function* (Utility). By shifting the logarithm from the operator (Geometric Expectation) to the function (Log Utility), standard theory absorbs the insights without structural change. The Ergodic argument provides a physical instrumentality for log-utility (survival), and the Bargaining argument provides a normative instrumentality (fairness), but neither displaces the VNM framework.

  \answer{neither}
