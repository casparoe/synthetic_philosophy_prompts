answer: |-
  **To:** The Steering Committee
  **From:** [Your Name/Advisor]
  **Subject:** Strategic Prioritisation for Postdoctoral Funding (Moral Psychology & Metaethics)

  You are correct to suspect that the standard WEIRD-sampling critique has reached diminishing returns. Merely adding more data points from non-Western populations without refining the *interpretative framework* yields more noise, not more signal. If we are to spend five years and three salaries on the implication of cross-cultural variation for moral objectivity, we must fund work that clarifies the *structure* of the disagreement before we measure its *extent*.

  Below is the committed ranking for our funding priorities, defended according to importance, tractability, neglectedness, and dependency.

  ### 1. The Semantic/Conceptual Priority: Verdict vs. Concept Disagreement
  **The Question:** Are cross-cultural moral differences best described as contradictory verdicts on shared values, or as divergent conceptual schemes where terms like 'harm', 'purity', or 'respect' pick out different natural kinds or social relations?

  **Defence of Ranking:**
  *   **Importance:** Critical. If variation is merely conceptual (e.g., one culture categorises a specific ritual act as 'pollution' while another does not categorise it as moral at all), then there is no genuine moral disagreement to threaten objectivity. This dissolves the relativist challenge at the root.
  *   **Neglectedness:** High. Moral psychology typically assumes conceptual equivalence to administer surveys (e.g., assuming 'harm' means the same thing in Tennessee and Tamil Nadu). Philosophers often assume shared concepts to construct thought experiments. Neither group sufficiently investigates the *extension* of moral concepts across cultures.
  *   **Dependency:** Maximum. The interpretation of all empirical data regarding variation or universality depends on knowing whether the subjects are talking about the same thing. Without this, data on variation is metaethically inert.
  *   **Tractability:** Moderate to High (given five years). This requires a mixed-methods approach: linguistic anthropology to map semantic fields, coupled with experimental philosophy to test concept application. A five-year postdoc allows for the necessary fieldwork, which is usually the bottleneck.

  ### 2. The Epistemic Priority: Universality and the Optical Illusion Analogy
  **The Question:** Does the near-universality of certain moral themes (harm, reciprocity) support moral realism any more than the universality of optical illusions supports colour realism?

  **Defence of Ranking:**
  *   **Importance:** High. Much of the defence of objectivity rests on convergence (i.e., 'we all agree on harm, therefore there is a truth of the matter'). This question challenges the inference from *shared psychology* to *mind-independent truth*. It forces a confrontation between evolutionary debunking arguments and robust realism.
  *   **Neglectedness:** Moderate. While philosophers discuss evolutionary debunking, the specific analogy to perceptual error (optical illusions) as a counter to the 'universality implies objectivity' argument is under-explored empirically.
  *   **Dependency:** High. This question only becomes live once we have established (via Priority 1) that there are indeed universals and not just conceptual overlaps.
  *   **Tractability:** Moderate. This is largely a theoretical project grounded in cognitive science. It requires mapping the cognitive architecture of moral judgment against perceptual architecture. It is less logistically difficult than Priority 1 but requires high-level philosophical synthesis.

  ### 3. The Folk Priority: The Metaethical Weight of Ordinary Commitments
  **The Question:** Should the objectivity commitments of ordinary moralisers (folk metaethics), which vary across cultures, carry any weight in determining the truth of moral objectivity?

  **Defence of Ranking:**
  *   **Importance:** Low to Moderate. Most metaethicists agree that folk intuitions are not truth-tracking in this domain (just as folk physics is not a guide to quantum mechanics). Establishing that the Baka or the British feel morality is objective tells us little about whether it *is*.
  *   **Neglectedness:** Low. This is currently the most crowded field in experimental philosophy. There are countless papers on 'folk moral realism'.
  *   **Dependency:** Low. Answers here do not settle ontological questions. They merely describe psychological states.
  *   **Tractability:** High. Surveys are cheap and quick. However, ease of execution should not drive funding when the philosophical yield is low.

  ---

  ### Overrated Implications and Non-Followers

  You asked plainly which putative implications of cultural variation are overrated. Based on this ranking, the following inferences should be treated with skepticism:

  1.  **Variation Entails Falsehood:** The mere existence of disagreement does not imply there is no truth of the matter. As Priority 1 suggests, much of this may be verbal dispute or divergent non-moral beliefs (e.g., about the efficacy of a ritual) rather than fundamental moral disagreement.
  2.  **Universality Entails Truth:** The fact that nearly all cultures prohibit unprovoked violence (Priority 2) is consistent with a shared evolutionary constraint that is entirely error-prone. Universality is evidence of shared *hardware*, not necessarily shared *access to truth*.
  3.  **Folk Realism Supports Realism:** The prevalence of objectivist talk in a culture (Priority 3) is likely a pragmatic feature of moral discourse (to motivate compliance) rather than a metaphysical insight. Funding should not chase the correlation between culture and folk realism unless it ties back to conceptual structure.

  ---

  ### Evidence That Would Shift the Ranking

  This strategy is robust, but not immutable. The following evidence over the next few years would compel us to reorder the priorities:

  *   **Move Priority 3 Up:** If rigorous cross-cultural work demonstrates that *access* to moral truth is mediated by specific social practices unique to certain cultures (a form of moral epistemology), then knowing which cultures possess 'objectivity commitments' might become a proxy for identifying reliable moral environments. This is unlikely, but if a 'moral perception' model gains traction, folk commitments become data on calibration.
  *   **Move Priority 2 Down:** If cognitive science conclusively demonstrates that moral judgment relies on domain-general reasoning rather than specialized modules (undermining the optical illusion analogy), the epistemic challenge weakens, and we may return to standard coherence theories of truth.
  *   **Move Priority 1 Down:** If linguistic anthropology reveals that moral concepts are, despite surface differences, translatable without significant loss of normative content across all human languages, the 'conceptual disagreement' hypothesis collapses. We would then have to accept that the variation is indeed verdictical, forcing us to confront the relativist challenge directly.

  ### Recommendation

  Allocate the three posts as follows:
  1.  **One Postdoc in Moral Anthropology/Linguistics:** Focused entirely on Priority 1 (Conceptual Mapping).
  2.  **One Postdoc in Philosophy of Cognitive Science:** Focused on Priority 2 (The Universality/Illusion Analogy).
  3.  **One Postdoc in Experimental Philosophy:** Focused on Priority 1 & 2 interface (Testing the conceptual hypotheses empirically).

  Do not fund a postdoc solely for Priority 3. That work is already being done adequately elsewhere. We should use our capital to clear the upstream conceptual blockage that renders the rest of the data ambiguous.
