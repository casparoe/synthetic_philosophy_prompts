answer: |-
  This is a classic tension in functionalist metaphysics, and you're right to spot that the intuitive asymmetry is doing too much work. Let's brainstorm the candidate explanations for why Aunt Hillary feels plausible while the China Brain feels empty, then cut down the list.

  **Candidate Explanations:**
  1.  **Component Intelligence:** Dumb parts allow emergent mind; smart parts block it.
  2.  **Causal Density/Speed:** Ants interact continuously/physically; China Brain uses discrete/slow signals.
  3.  **Natural Kind Status:** Colonies are evolved biological units; nations are artificial constructs.
  4.  **Interdependence:** Ants die without the colony; humans survive without the China Brain.
  5.  **Phenomenal Opacity:** We don't know what it's like to be an ant; we know what it's like to be a human.
  6.  **Competing Ascriptions:** We already count humans as agents; counting the nation as an agent feels like double-counting.

  **Evaluation:**
  Candidates (2) and (3) are rationalizations that functionalism should reject. If functional organization is what matters, signal speed (telegraph vs. pheromone) is irrelevant—a slow thinker is still a thinker. Similarly, evolution shouldn't dictate metaphysics; an artificial system can be mental. Candidate (4) has some traction regarding *individuation* (what counts as one system?), but it doesn't fully explain the *phenomenal* absence in Block's case.

  The real heavy lifters are (1), (5), and (6), which converge on your "half-baked idea." The asymmetry isn't about the *system's* capacity to process information; both cases stipulate that capacity is identical. The asymmetry is about **subject localization**.

  Your spectrum idea hits the nerve. When we move from dumb ants to smart humans, we aren't changing the functional capacity of the *whole*; we are changing the ontological status of the *parts*. In the ant case, the individual ant is not a candidate for subjecthood. There is a "vacancy" at the agent level, and the colony fills it. In the China Brain, every component is already a paradigmatic subject. Our folk psychology operates with a principle of **Explanatory Exclusion**: if the parts are already doing the thinking and feeling, positing a super-agent feels redundant, even magical.

  This isn't necessarily substrate chauvinism, but it is **agent chauvinism**. We are reluctant to multiply subjects beyond necessity. When the parts are humans, we assume *they* are the ones experiencing the pain or seeing the red, leaving nothing "left over" for the nation. When the parts are ants, we assume *they* are merely mechanical, so the experience must belong to the collective.

  Does this gradient track a real difference in subjecthood? Honestly, probably not. It tracks the limits of our folk-psychological framework for assigning responsibility and experience. We are equipped to navigate a world where agents are roughly human-sized and composed of non-agential parts. When faced with nested agents (humans within a nation), our intuition screams "category error" because we lack the cognitive schema for **nested subjecthood**.

  However, there is a genuine metaphysical worry hidden here: **Causal Integration**. In the ant colony, the "signals" (pheromones, physical carrying) are causally potent in virtue of the colony's structure. In the China Brain, the humans must *interpret* the signals to pass them on. They are acting as homunculi. This introduces a layer of intentionality at the part-level that might disrupt the functional isomorphism. If the humans are consciously deciding to pass the signal, the system isn't running automatically; it's being *simulated* by agents. The ant colony runs itself; the China Brain is *operated* by its parts.

  **Verdict:**
  The intuitions are inconsistent, but not useless. They reveal that our concept of "mind" is tied to **explanatory utility** rather than metaphysical essence. We ascribe mind to the level where the explanation bottoms out. For ants, that's the colony. For humans, that's the individual.

  Your suspicion is correct: the gradient tracks where we *locate* the agent, not whether the system functions mentally. The China Brain intuition fails because we cannot suppress our knowledge that the components are already subjects. We aren't refusing to multiply agents due to chauvinism; we are refusing because our concept of "subject" implies a kind of causal sovereignty that gets diluted when the subject is merely a gear in a larger machine they don't understand.

  If you're working on levels of explanation, the takeaway is this: "Mind" might be a level-relative predicate. It applies where the functional organization supports autonomous prediction and control. In the ant case, the colony is the autonomous unit. In the China case, the humans remain the autonomous units, and the nation is just a network they are temporarily inhabiting. The asymmetry isn't in the metaphysics of mind, but in the **granularity of agency**.
