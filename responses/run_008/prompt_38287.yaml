  **Brainstorming Phase**
  *Candidate Readings:* Austin (*HTTW*) implies uptake is ontologically necessary ("securing of uptake"). Searle (*Speech Acts*) shifts to intentionality + constitutive rules; uptake is a condition of satisfaction, not necessarily existence.
  *Reconstruction Options:* (1) Constitutive (no uptake = no act); (2) Causal (act exists via convention/intent; uptake is effect).
  *Edge Cases:*
  1.  *Sleeping Promise:* Tests obligation without recognition. Favors Causal.
  2.  *Noisy Warning:* Tests force vs. perlocution. Favors Causal.
  3.  *Ceremony:* Tests audience scope. Suggests uptake is institutional, not psychological.
  4.  *Looping:* Tests historicity. Suggests social practice overrides single-moment intent.
  *Gricean Intervention:* Force = reflexive intention. Risks eliminating institutional reality.
  *Verdict Strategy:* Hybrid. Uptake is constitutive for institutional validity, causal for interpersonal agency.

  ***

  **The Ontology of Uptake: Austin, Searle, and the Hearer's Contribution**

  J.L. Austin's insistence that an illocutionary act requires the "securing of uptake" stands in tension with John Searle's later prioritization of speaker intention and constitutive rules. Austin suggests that without the hearer's recognition that an act is being performed, the act misfires or remains incomplete. Searle, conversely, locates the act's identity in the speaker's imposition of conditions of satisfaction upon the world, mediated by convention. This divergence invites two reconstructions: the constitutive reading, where uptake is identity-conferring, and the causal-consequential reading, where uptake is merely a typical effect of a successfully executed procedure.

  Evaluating these reconstructions against edge cases reveals the insufficiency of a monolithic theory. Consider the promise made to a sleeping addressee. Under the constitutive reading, no promise occurs because recognition is impossible. Yet, third parties rightly demand performance from the promiser, suggesting the obligation—and thus the act—exists independently of hearing. This favors the causal-consequential reading: the act is fixed by the felicitous execution of the conventional procedure, while uptake belongs to the act's effects. Similarly, in the case of the warning shouted across a noisy street, the hearer ducks (a perlocutionary effect) but interprets the utterance as a joke (failed uptake). If uptake were constitutive, no warning occurred. However, intuitively, the speaker *did* warn, even if unsuccessfully understood. The causal reading preserves the act's identity despite hermeneutic failure.

  However, the causal reading falters in ceremonial settings. In a courtroom or marriage ceremony, the act's validity often hinges on specific authoritative uptake. A judge's recognition validates a sentence; a bystander's does not. This pressures both readings, suggesting uptake conditions are interest-relative and institutional rather than purely psychological. Neither Austin nor Searle clearly licenses this distinction, yet it implies that for institutional acts, uptake is constitutive of *validity*, not merely existence. Furthermore, consider whether perlocutionary effects loop back into illocutionary identity. If a standing pattern of successful persuasion establishes a speaker's authority, future utterances may count as threats where they previously counted as bluffs. This dynamic suggests illocutionary force is partly constituted by social history, challenging the static intentionalism of the causal reading.

  Introducing a Gricean intention-based account complicates this landscape. On this view, illocutionary force is fixed by the speaker's reflexive communicative intentions; uptake is evidence of intention, never a condition of the act's occurrence. This seemingly dissolves the Austin–Searle disagreement by internalizing force within the speaker's mind. However, it merely relocates the problem. It cannot account for the intuition that institutional acts, like marrying or sentencing, depend on something socially external to the speaker's intentions. One cannot intend to marry oneself; the officiant's uptake (as an agent of the institution) is required to change one's social status. The Gricean model reduces social facts to psychological states, failing to capture the normative weight of institutional illocutions.

  Consequently, neither the pure constitutive nor the pure causal-consequential reading suffices. A defensible verdict requires a hybrid "institutional-constitutive" view. For interpersonal acts like promising or warning, the causal-consequential reading is superior: the act is grounded in the speaker's agency and convention, with uptake serving as a normative expectation rather than an ontological precondition. This accommodates the sleeping promise and the noisy warning without dissolving the act's reality. However, for institutional acts, the constitutive reading holds: specific authoritative uptake is required to instantiate the social fact.

  The theoretical cost of this verdict is the abandonment of a unified theory of illocution. We must accept that "illocutionary act" names a heterogeneous class. Some acts create social facts requiring communal validation (Austin's strength), while others execute individual agency within norms (Searle's strength). The sleeping promise shows obligation can exist without uptake, but the courtroom shows validity cannot. Thus, the hearer's contribution is not uniform; it ranges from evidential confirmation in interpersonal contexts to constitutive authorization in institutional ones. To demand a single condition for all illocutions is to ignore the diverse social realities language constructs.
