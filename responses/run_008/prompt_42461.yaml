answer: |-
  **TIME ONTOLOGY DECISION TREE**

  **Start:** We agree dinosaurs existed and it rained last Tuesday.

  **Q1: Do past entities (like Caesar or dinosaurs) exist in any ontological sense, or do *only* present entities exist?**
  *   **Only Present Exist** → Go to Q2.
  *   **Past Entities Exist** → Go to Q3.

  **Q2: (Only Present) What makes "Caesar existed" true?**
  *   **Present properties of the world** (e.g., the world currently has the property *having-contained-Caesar*) → **Lucretian Presentism**.
  *   **Primitive tensed facts** (No present surrogate; it's just brute true) → **Standard Presentism**.

  **Q3: (Past Exists) Do future entities exist yet?**
  *   **No** → **Growing Block** (Past/Present exist; Future is nothing).
  *   **Yes** → Go to Q4.

  **Q4: (Future Exists) Are future contingent statements already true/false (settled)?**
  *   **No** (They are indeterminate/unsettled) → **Open Future (Eternalist Ontology)**.
  *   **Yes** (Settled) → Go to Q5.

  **Q5: (Block Universe) Is there a metaphysically privileged "Now" (or is relief that pain is over irreducible to tenseless facts)?**
  *   **Yes** (Requires privileged reference frame; passage is real) → **Moving Spotlight**.
  *   **No** ("Now" is indexical like "here"; relief is psychological) → **Plain Eternalism (B-Theory)**.

  ***

  **EMPTY / UNSTABLE COMBINATIONS**
  *   **Only Present + Future Exists:** Incoherent. If only present exists, future cannot exist yet.
  *   **Past Exists + Future No + Privileged Now = No:** Unstable. Growing Block usually requires a moving edge (privileged present) to define the "growth."
  *   **Open Future + Privileged Now:** Unexplored/Rare. Most open future views deny a fixed block, making a privileged frame redundant or conflicting with the indeterminacy.
  *   **Plain Eternalism + Privileged Now:** Contradiction. If there is a privileged Now, it is not Plain Eternalism (it becomes Spotlight).

  ***

  **WORKED EXAMPLE**
  **Profile:** Privileged Frame = **Yes**; Caesar Exists = **No**; Dentist Relief = **Irreducible**.

  1.  **Q1 (Caesar Exists?):** **No.** (Moves to Presentist Branch).
  2.  **Q2 (Truthmaker?):** *Not specified in profile.* To reach a leaf, we must ask. Let's assume they deny present properties ground past truths (common for those insisting on irreducible passage). Answer: **Primitive Facts**.
  3.  **Result:** **Standard Presentism**.

  *Note:* The "Privileged Frame" and "Dentist Relief" answers are consistent with Standard Presentism but don't distinguish it from Lucretian Presentism (both are A-theories). The truthmaker question (Q2) is the only splitter here. If they had said "Present Properties," they would be **Lucretian Presentists** despite the relief/frame intuitions.
