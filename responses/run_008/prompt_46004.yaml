      *   "What does rejecting it cost?" -> You lose the ability to solve games like the one Dana provided using *only* CKR. You need Trembling Hand Perfection.
      *   "Strict vs Weak principle?" -> Strict = Never a best response. Weak = Best response only against measure-zero beliefs.
      *   "Forward induction?" -> It uses weak dominance logic but adds belief restrictions.

      *Self-Correction during drafting:* I need to be careful not to say Weak Dominance is "wrong." It's a useful solution concept, but it corresponds to a stronger epistemic condition than just CKR. Dana's error is claiming CKR *alone* mandates it.
      *Actually, looking closer at Premise (1):* "A rational player never plays a dominated strategy." This is the claim to attack. A rational player *can* play a weakly dominated strategy if they are certain the opponent will play the specific strategy that makes them indifferent. CKR doesn't rule out that certainty.
