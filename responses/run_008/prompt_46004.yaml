      *   **Address the "Insurance Argument":** The insurance argument holds *if* you believe every opponent strategy is possible (full support). But CKR restricts the set of possible opponent strategies. If the strategies that make the insurance pay off are eliminated as "irrational" in a *different* order, the insurance isn't needed.
