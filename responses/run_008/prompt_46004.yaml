      *   *The Crucial Point:* Eliminating a weakly dominated strategy assumes that the opponent assigns *positive probability* to the strategies where the domination is strict. But if we eliminate those opponent strategies *later* in the chain, we are making an assumption about beliefs that might not be justified by rationality alone.
