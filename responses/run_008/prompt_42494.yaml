answer: |-
  You are right to be concerned, and your intuition that something is "off" is correct. Your roommate is making a category error that is well-known in the philosophy of quantum mechanics: he is conflating **ontology** (what exists) with **measure** (how much it exists).

  He is acting like a "branch counter." He assumes that because a branch exists, it has equal weight to every other branch. This is not how the Many-Worlds Interpretation (MWI) works, even according to its strongest proponents.

  Here is the principled breakdown you need, followed by exactly what to say at the table on Thursday.

  ### 1. Where do the odds come from? (The Born Rule)
  In MWI, the universe is described by a wavefunction. When a quantum event happens, the wavefunction doesn't collapse; it branches. However, these branches are not created equal. They have **amplitudes**.

  The "probability" of finding yourself in a specific branch is determined by the squared modulus of that amplitude (the **Born Rule**).
  *   **Branch Counting is a Fallacy:** You cannot simply count branches. The decomposition of the wavefunction into "worlds" is continuous and dependent on how you look at it (the basis problem). There isn't a discrete "1 world where I win" and "9 worlds where I lose." There is a *measure* of existence.
  *   **The Deutsch-Wallace Theorem:** Physicists David Deutsch and David Wallace proved (within decision theory) that a rational agent in an MWI universe *must* act as if the Born Rule probabilities are real. If you don't weight your decisions by these amplitudes, you become **diachronically inconsistent**. You will make decisions today that your future selves (across the multiverse) will universally regret, weighted by their measure.

  **The takeaway:** In MWI, "probability" isn't about *whether* a branch exists; it's about **how much of the total wavefunction** that branch occupies. You should care about your future selves in proportion to their measure.

  ### 2. Analyzing His Two Arguments
  He is contradicting himself, though both errors stem from ignoring the Born Rule.

  **The Poker Argument (Maximizing the Best Branch)**
  *   **His Logic:** "Some version of me wins, so I play for him."
  *   **The Error:** He is optimizing for the *existence* of a winning self, ignoring the *measure* of that self.
  *   **Why it's wrong:** If he makes a call with a 10% chance of winning, 90% of the "measure" of him goes broke, and 10% gets rich. Unless he values the rich 10% ten times more than the broke 90% (which he doesn't; he still has to pay rent in the 90% branches), this is irrational. He is sacrificing the majority of his future selves to subsidize a tiny minority.

  **The Insurance Argument (All Branches are Equal)**
  *   **His Logic:** "The loss branch exists anyway, so insurance is useless."
  *   **The Error:** He treats the branches as binary (loss/no loss) rather than looking at utility *within* the branches.
  *   **Why it's wrong:** Insurance doesn't prevent the loss branch from existing; it transfers value *within* that branch. In the branch where luggage is lost, the version of him *with* insurance has higher utility (money) than the version *without*. Since that branch has significant measure, he should want to maximize utility in it.

  **Which is more wrong?**
  They are equally wrong philosophically (both ignore branch measure), but the **Poker argument is more dangerous.** The insurance argument is just saving him a premium while risking a manageable loss. The poker argument is actively transferring wealth from the "majority of hims" to the "minority of hims" at a negative expected value. It is financial suicide by multiverse.

  ### 3. How to Talk to Him (The Strategy)
  Do not argue about whether MWI is true. He knows more physics than you, and you will get bogged down. Argue about **Decision Theory within MWI.** Accept his premise (MWI is real) and show him his conclusion (reckless behavior) does not follow.

  **The Distinction to Articulate:**
  Tell him he is confusing **Existence** with **Weight**.
  *   "You're acting like every branch gets one vote. But MWI says branches have different weights. You're making decisions that hurt 90% of you to help 10% of you. That's not rationality; that's self-sabotage across the multiverse."

  ### 4. What to Say at the Table on Thursday
  When he goes all-in on a thin draw, wait for the action to fold to you. Look him in the eye and say one of the following, depending on how technical you want to get:

  **Option A: The Decision Theory Burn (Recommended)**
  > "If you make this call, the Born Rule says 85% of your future selves are going broke tonight. You're sacrificing the majority of your wavefunction to subsidize a tiny sliver of yourself who gets lucky. That's not playing the odds; that's hate-playing your own copies."

  **Option B: The Inconsistency Check**
  > "You skipped insurance because the loss branch exists anyway, but now you're playing poker like only the win branch matters. You can't treat the branches as 'all real' when it saves you money and 'only the winner counts' when you're bluffing. Pick a measure theory and stick to it."

  **Option C: The Short & Sharp (For the moment he flips his cards)**
  > "You're not playing the player, you're playing the amplitude. And right now, your amplitude is in the gutter."

  ### Summary for your peace of mind
  You don't have to live with this. He is not being a "good Everettian"; he is being a bad decision theorist. Even Hugh Everett III (who proposed MWI) did not advocate for Russian Roulette or reckless gambling. He understood that while all outcomes occur, **we experience only one path**, and the likelihood of experiencing a path is governed by the squared amplitude.

  He is using quantum physics to justify gambling addiction. Call it what it is, but use his own vocabulary to do it.
