answer: |-
  Your diagnosis is sharp, and you are right to sense that the debate has calcified. The reason nobody has changed their mind since the eighties is not because the arguments have reached a state of perfection, but because the debate is structurally incapable of producing a winner. It is not a stalemate due to a lack of intellectual effort; it is a stalemate due to a clash of incommensurable moral frameworks.

  Here is the diagnosis of why this is happening, broken down by your specific queries.

  ### 1. Are they answering different questions?
  Your theory is correct, but it goes deeper than just "killing vs. bodily rights." The two camps are operating with different definitions of what a **right** actually is.

  The Thomson side treats rights as **boundaries**. A right is a fence around the self that others cannot cross, regardless of the consequences. In this framework, the fetus (even if a person) is an intruder. The moral question is: *Does the intruder have the right to breach the fence?* The answer is no, because fences are absolute.

  The Marquis side treats rights as **claims to protection**. A right is an entitlement to certain goods (like a future) that the community must respect. In this framework, the fetus is a beneficiary. The moral question is: *Does the beneficiary have a claim on the resources required to sustain that future?* The answer is yes, because depriving them of that future is the primary harm.

  When these two collide, they talk past each other because they prioritize different moral currencies. The Thomson side prioritizes **liberty and integrity** (negative rights). The Marquis side prioritizes **welfare and value** (positive claims). You cannot trade liberty for welfare without already having a metric to decide which one matters more. Since the debate is *about* establishing that metric, neither side can use the metric to win the debate.

  ### 2. Is there a hidden shared question?
  There is no hidden shared question that, if answered, would settle the dispute. You suggested "whether death is a deprivation" or "who bears the burdens of rescue." The problem is that both sides have already answered those questions in ways that favor their own starting positions.

  *   **On Deprivation:** The Marquis side says death is the ultimate deprivation. The Thomson side replies that deprivation doesn't justify forced labor. There is no neutral arbiter to decide if "avoiding deprivation" outweighs "avoiding forced labor."
  *   **On Rescue:** The Thomson side frames pregnancy as **Good Samaritanism** (supererogatory, not mandatory). The Marquis side frames pregnancy as **Parental Obligation** (mandatory, based on biological connection).

  The hidden variable isn't a question; it's the **status of the biological relationship**. The Thomson analogies (violinist, burglar, seeds) work hard to strip away the biological tie to make it look like a random intrusion. The Marquis argument relies on the biological tie to establish a special duty. The stalemate persists because one side sees the biological connection as morally irrelevant to consent, while the other sees it as the very source of obligation. Neither can prove their view of the biological connection without begging the question.

  ### 3. Is it bedrock intuitions all the way down?
  Yes. This is the uncomfortable truth of the literature. The published arguments are largely post-hoc rationalizations for deep-seated moral instincts.

  Psychologically, the two sides weigh moral foundations differently. The Thomson side relies heavily on intuitions regarding **oppression and bodily sovereignty**. The visceral reaction is: *No one owns me.* The Marquis side relies heavily on intuitions regarding **harm and sanctity**. The visceral reaction is: *Do not snuff out a budding life.*

  Philosophical arguments in this domain function like lawyers in a courtroom. They are there to defend the client (the intuition), not to find the truth. When a Thomsonian hears the "Future Like Ours" argument, they don't feel its force because their intuition doesn't register "potential future" as outweighing "current bodily violation." When a Marquisian hears the "Violinist" argument, they reject the analogy because their intuition registers the fetus as a child, not a stranger.

  The arguments haven't changed minds because arguments rarely change bedrock intuitions. They only refine the edges of what people already believe.

  ### 4. What would count as progress?
  If you are looking for a "knockout argument" that will convert the room, you will be waiting forever. That kind of progress is impossible here. However, genuine philosophical progress is still available if you redefine what success looks like.

  **A. Acknowledge the Tragedy**
  Progress looks like moving from "Who is right?" to "What is lost?" Both sides capture a genuine moral truth. Bodily autonomy *is* fundamental. Potential life *is* valuable. A mature ethical stance admits that in this specific conflict, one genuine value must be sacrificed for another. Progress is accepting the "moral remainder"—the guilt or regret that remains even after making the "right" choice. If your group can agree that the issue is tragic rather than solvable, you have made progress.

  **B. Shift from Principle to Policy**
  The abstract debate is stuck. Progress happens when you move to the conditions of the choice. Instead of asking "Is abortion permissible?", ask "Under what social conditions does this choice become less coercive?" This shifts the debate from metaphysics to material reality. It doesn't solve the ethics of killing, but it addresses the ethics of the situation surrounding the killing.

  **C. Test the Limits of the Analogies**
  Instead of trying to fix the analogies, expose their breaking points. The Violinist analogy breaks down at viability or birth. The Future Like Ours argument breaks down at conception vs. implantation. Progress is mapping the exact coordinates where each side's intuition starts to waver, rather than pretending the principle holds everywhere.

  ### 5. Verdict: Hard or Ill-Posed?
  The question is **genuinely hard**, not ill-posed. It is ill-posed only if you assume there must be a single, consistent, universal rule that satisfies all moral intuitions. There isn't.

  The stalemate exists because you are asking a question that forces a collision between two foundational pillars of modern morality: individual liberty and the protection of vulnerable life. In most cases, these pillars support each other. In pregnancy, they contradict.

  **Diagnosis:** You are witnessing a **category collision**. The Thomson side is arguing from the category of **Tort Law** (trespass, consent, bodily integrity). The Marquis side is arguing from the category of **Human Rights** (right to life, protection of the innocent). Until one side concedes that their category does not fully cover the phenomenon of pregnancy, the debate will remain exactly where it was in 1985.

  If you want to move the needle in your group, stop trying to solve the ethics of abortion and start analyzing the ethics of the *impasse*. Ask the group: "What does it say about our moral language that we have two perfectly coherent arguments that lead to opposite conclusions?" That is where the actual philosophy is hiding now.
