  My brother and I have been going back and forth for months about whether ChatGPT actually understands what you say to it or whether it's just really good at faking. My position was basically "if it can explain a joke to you it understands something," his is "it's a fancy autocomplete, full stop." Last week he sent me a blog post saying this settles it and I want to know if it actually does before I conceed. Here's the part he's leaning on:

