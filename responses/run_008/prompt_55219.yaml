  Some of this sounds simplified to me but honestly I can't tell which parts. Like the vodka thing reads like a legend somebody made up, but maybe it's a real documented experiment, idk. Can you go through it and tell me what's solid, what's exaggerated or subtly off, and whether the punchline about today's chatbots actually follows from whatever parts are solid? I'm especially curious whether "it's just pattern matching frequencies so it can't handle anything new" is something Hofstadter really claimed or the blogger's glos on it. Also please tell me how confident you are in each verdict you give, and single out the one point you're least sure about, because I'm bringing this back to my brother and do not want to get caught asserting something that turns out to be wrong.
