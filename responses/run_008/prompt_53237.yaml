prompt: |-
  I'm in a course on measurement and its failures (we just covered Goodhart's law, including the variants -- regressional, extremal, adversarial -- not just the original econometrics version), and I could use your help with something practical. I also TA our intro CS course, and me and the lecturer are about to redesign how 400ish students get graded, most of it auto-scored. Last year we gave points for number of unit tests passed and got back hundreds of trivial asserts ("assert add(1,1)==2") which was... a lesson.

  Can you turn what the theory says about metrics failing under optimization pressure into a procedure we can actually run whenever someone proposes a new grading metric? Like: the questions to ask in order, what counts as a sufficient answer to each, where the procedure should just say no, and where it has to punt to a human judgment call (I want those honestly flagged, not hidden). We're two people with maybe 15 minutes per metric, no fancy stats, and the stakes are real because the metric determines how these students spend their whole semester. Then run it on two of our current candidates: (a) giving lab credit based on lines of code changed per commit, and (b) giving participation credit for words written in the course forum. At least one of those I actually want to keep, so if the procedure kills it, tell me that anyway -- and also say what the procedure can't catch, like ways grading can go wrong that no per-metric audit would ever see.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** TA for an intro CS course (400 students), taking a course on measurement/failure (specifically Goodhart's Law variants: regressional, extremal, adversarial).
      *   **Task:** Create a practical procedure/checklist to evaluate proposed grading metrics based on measurement theory. Then apply it to two specific candidates: (a) Lines of Code (LOC) changed per commit, and (b) Words written in the course forum.
      *   **Constraints:** Two people, 15 minutes per metric, no fancy stats, high stakes (student behavior/grades).
      *   **Requirements:**
          *   Turn theory into a step-by-step procedure.
          *   Include questions, sufficient answers, "hard no" criteria, and "human judgment" flags.
          *   Run the procedure on the two candidates.
          *   Be honest even if it kills a desired metric.
          *   Identify blind spots (what the procedure *can't* catch).

  2.  **Deconstruct Goodhart's Law for this Context:**
      *   *Original:* When a measure becomes a target, it ceases to be a good measure.
      *   *Regressional:* The measure correlates with the goal but has noise. Optimizing the measure selects for the noise. (e.g., Test scores correlate with understanding, but optimizing for scores selects for test-taking tricks).
      *   *Extremal:* The relationship holds in the normal range but breaks at extremes. (e.g., Study time helps up to a point, then burnout).
      *   *Adversarial (Causal):* Agents actively game the metric to maximize reward without achieving the goal. (e.g., The `assert add(1,1)==2` incident).

  3.  **Drafting the Procedure (The "Goodhart Audit"):**
      *   *Goal:* Fast, practical, theory-grounded.
      *   *Time:* 15 mins.
      *   *Steps:*
          1.  **Define the True Goal:** What do we *actually* want? (Must be distinct from the metric).
          2.  **Causal Link:** Does doing the metric *cause* the goal, or just correlate?
          3.  **Gaming Surface:** How easy is it to fake? (Adversarial).
          4.  **Noise/Regression:** Is there a lot of variance unrelated to skill? (Regressional).
          5.  **Extremal Check:** What happens if a student maximizes this obsessively? (Extremal).
          6.  **Cost of Failure:** If it breaks, who gets hurt? (Stakes).
          7.  **Verdict:** Pass, Fail, or Human Review.

      *   *Refining the Steps for the User:* Make it a checklist with specific "Stop" conditions.

  4.  **Running the Procedure on Candidate (a): LOC per Commit:**
      *   *Goal:* Meaningful progress, iterative development.
      *   *Causal Link:* Weak. More code $\neq$ better code.
      *   *Gaming:* High. Students can add whitespace, comments, or redundant code.
      *   *Extremal:* Obsessive committing of tiny changes or massive dumps.
      *   *Verdict:* Hard No. (Classic example of bad metric).

  5.  **Running the Procedure on Candidate (b): Forum Words:**
      *   *Goal:* Engagement, helping others, asking good questions.
      *   *Causal Link:* Weak/Moderate. Writing *can* indicate thinking, but word count is a proxy for volume, not quality.
      *   *Gaming:* High. Fluff, "I agree", copying prompts.
      *   *Extremal:* Novels posted, spamming.
      *   *Verdict:* Hard No (as a direct grading metric). *Nuance:* Can be a *threshold* for participation, but not a *scale*.

      *Wait, the user said "At least one of those I actually want to keep."*
      *   If I kill both, I need to explain *how* to salvage the intent without using the broken metric.
      *   For Forum: Use it as a *binary* check (did you post?) + spot check quality, or use peer upvotes (with caveats).
      *   For LOC: Use it as a *diagnostic* for TAs (who is struggling?), not for grading.
      *   *Decision:* I must be honest. If the procedure says "No," I say "No." But I will offer the "Salvage" option in the analysis.

  6.  **Identifying Blind Spots (What the audit misses):**
      *   Systemic bias (metrics might disadvantage certain groups).
      *   Interaction effects (Metric A + Metric B create a weird loop).
      *   Instructor/TA burden (implementation cost).
      *   Student morale/psychological safety.
      *   The "Campbell's Law" aspect (institutional pressure on the TAs).

  7.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the `assert add(1,1)==2` trauma.
      *   **The Procedure:** "The 15-Minute Goodhart Audit." Clear steps, decision gates.
      *   **Application:** Run (a) and (b) through the audit.
      *   **Blind Spots:** What the audit doesn't see.
      *   **Recommendation:** How to actually grade (holistic/rubric-based).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 15 minutes realistic?
      *   *Fix:* Keep the questions sharp. Don't ask for data analysis. Ask for *plausibility*.
      *   *Critique:* The user wants to keep one metric.
      *   *Fix:* I need to be firm. If the metric is fundamentally broken by Goodhart's law, I can't endorse it. I must explain *why* keeping it is dangerous, but suggest how to capture the *signal* without the *noise*.
      *   *Theory Check:* Ensure I explicitly reference Regressional, Extremal, and Adversarial in the steps.

  9.  **Final Polish:**
      *   Tone: Professional, empathetic to the TA workload, rigorous on the theory.
      *   Formatting: Bold key terms, use lists for readability.

  *(Self-Correction on the "Keep One" constraint)*: The user said "At least one of those I actually want to keep, so if the procedure kills it, tell me that anyway." This implies I should not bias the procedure to save their favorite. I must remain objective. I will likely kill both as *direct grading scales*, but suggest how to use them as *signals*.

  10. **Finalizing the Procedure Steps:**
      1.  Goal vs. Proxy.
      2.  Adversarial Ease (Can I game this in 5 mins?).
      3.  Extremal Behavior (What does the max score look like?).
      4.  Regressional Noise (Does luck/skill ratio work?).
      5.  The "TA Sanity" Check.

