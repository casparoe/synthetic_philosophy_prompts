answer: |-
  This is a classic measurement problem. You have already observed **Adversarial Goodhart's Law** in the wild (the `assert add(1,1)==2` incident). Students optimized the proxy (tests passed) rather than the goal (correct implementation).

  Since you have 15 minutes, no stats, and high stakes, you need a **heuristic audit**, not a statistical validation. Below is the **15-Minute Goodhart Audit**. It is designed to force you to articulate the causal mechanism and stress-test the metric against the three variants you studied.

  ---

  ### Part 1: The 15-Minute Goodhart Audit

  **Timebox:** 15 Minutes max. If you exceed this, the metric is too complex to manage safely.
  **Participants:** You + Lecturer.
  **Output:** PASS, FAIL, or HUMAN-REVIEW.

  #### Step 1: The Goal/Proxy Separation (2 mins)
  *   **Question:** Write down the **True Goal** (e.g., "Student understands recursion") and the **Metric** (e.g., "Recursive function passes 5 tests") on separate lines.
  *   **Sufficient Answer:** The Goal describes a *state of mind or capability*. The Metric describes a *countable output*.
  *   **Hard No:** If you cannot articulate the Goal without using words from the Metric (e.g., Goal: "Write more code"; Metric: "Lines of code"), **STOP. FAIL.**
  *   **Theory:** This checks for **Construct Validity**. If the proxy *is* the goal, you aren't measuring; you are defining.

  #### Step 2: The Adversarial Test (5 mins)
  *   **Question:** As a lazy student who wants points but doesn't want to learn, how specifically do I maximize this metric without achieving the Goal? Give a concrete example.
  *   **Sufficient Answer:** "It would take significant effort to game, roughly equal to doing the work."
  *   **Hard No:** "I can write a script," "I can copy-paste," or "I can add junk data." If the cost to game is $< 10\%$ of the cost to learn, **STOP. FAIL.**
  *   **Theory:** This checks for **Adversarial Goodhart's Law**. If the causal link is weak, agents will sever it.

  #### Step 3: The Extremal Stress Test (3 mins)
  *   **Question:** Imagine a student obsessively optimizes this metric to get 150% of the possible points. What does their behavior look like? Is it beneficial or harmful to them/you?
  *   **Sufficient Answer:** "They are working harder on the actual learning material."
  *   **Hard No:** "They are spamming," "They are burning out," or "They are clogging our storage/grading queue." If the extreme behavior is net-negative, **STOP. FAIL.**
  *   **Theory:** This checks for **Extremal Goodhart's Law**. Relationships often break at the tails.

  #### Step 4: The Regressional Noise Check (3 mins)
  *   **Question:** If two students have the exact same skill level, how much could their scores differ due to luck, style, or topic choice?
  *   **Sufficient Answer:** "Scores would be within 5-10% of each other."
  *   **Hard No:** "It depends on which problem they picked," or "One writes verbosely, one concisely." If variance is high unrelated to skill, **FLAG FOR HUMAN-REVIEW.**
  *   **Theory:** This checks for **Regressional Goodhart's Law**. Optimizing the measure selects for the noise (luck/style) rather than the signal (skill).

  #### Step 5: The "TA Sanity" Failsafe (2 mins)
  *   **Question:** If this metric breaks (as they always do), how hard is it to override or fix?
  *   **Sufficient Answer:** "We can manually adjust grades easily."
  *   **Hard No:** "It's auto-locked in the LMS," or "We don't have time to review appeals." If you cannot intervene, **STOP. FAIL.**
  *   **Theory:** This is **Control Theory**. You need a feedback loop to correct measurement drift.

  ---

  ### Part 2: Running the Audit on Your Candidates

  Here is the honest application of the procedure. I am not biasing this to save your favorites.

  #### Candidate (a): Lab credit based on Lines of Code (LOC) changed per commit

  **Step 1: Goal/Proxy**
  *   **Goal:** Iterative development, steady progress, not dumping code at the last minute.
  *   **Metric:** Sum of LOC added/modified per git commit.
  *   **Result:** Pass. (Distinct concepts).

  **Step 2: Adversarial Test**
  *   **Question:** How do I game this?
  *   **Answer:** I write the whole lab in one file, then use a script to split it into 50 commits, adding whitespace or comments between each. Or I add a massive comment block with the problem statement in every commit.
  *   **Result:** **FAIL.** Cost to game is near zero (simple script). This is a textbook Adversarial failure.

  **Step 3: Extremal Stress Test**
  *   **Question:** What does 150% effort look like?
  *   **Answer:** A student commits every single character typed. The repo history becomes unusable. Storage costs balloon. TAs cannot review history because it's noise.
  *   **Result:** **FAIL.** Net negative for everyone.

  **Step 4: Regressional Noise**
  *   **Question:** Do verbose students get higher scores than concise students for the same skill?
  *   **Answer:** Yes. A student who writes `x = x + 1` gets more points than `x += 1`. A student who names variables descriptively gets more points than one using math symbols.
  *   **Result:** **FAIL.** Punishes good style (conciseness) and rewards bad style (verbosity).

  **Verdict:** **HARD NO.**
  *   **Why:** It actively penalizes good engineering practices (conciseness, atomic commits) and rewards padding.
  *   **Salvage:** Do not use for *grading*. Use for *alerting*. If a student has 0 commits until 24h before deadline, flag them for academic integrity review or outreach. It is a diagnostic signal, not a reward signal.

  ***

  #### Candidate (b): Participation credit for words written in course forum

  **Step 1: Goal/Proxy**
  *   **Goal:** Community engagement, helping peers, articulating confusion.
  *   **Metric:** Total word count of posts.
  *   **Result:** Pass. (Distinct concepts).

  **Step 2: Adversarial Test**
  *   **Question:** How do I game this?
  *   **Answer:** "I agree with the above post, because I also think that..." repeated 50 times. Or posting the assignment prompt and saying "Here is the prompt."
  *   **Result:** **FAIL.** Very easy to generate fluff.

  **Step 3: Extremal Stress Test**
  *   **Question:** What does 150% effort look like?
  *   **Answer:** Students write novellas. TAs cannot read them. Important questions get buried under walls of text. Students feel pressured to perform "engagement" rather than actually asking for help.
  *   **Result:** **FAIL.** Degrades the signal-to-noise ratio of the forum for everyone.

  **Step 4: Regressional Noise**
  *   **Question:** Do non-native speakers or concise thinkers get penalized?
  *   **Answer:** Yes. A student who asks a perfect 10-word question ("Why does segfault here?") provides high value but gets low score. A student who rambles gets high score.
  *   **Result:** **FAIL.** High variance based on writing style, not CS understanding.

  **Verdict:** **HARD NO (as a scaled metric).**
  *   **Why:** It incentivizes spam and disadvantages concise communicators.
  *   **Salvage:** Use a **Binary Threshold** + **Human Spot Check**.
      *   *Metric:* "Did you post at least 3 times?" (Yes/No).
      *   *Check:* TA spot-checks 10% of students. If the posts are spam, they fail the whole participation component.
      *   *Why this works:* It removes the incentive to maximize *beyond* the threshold. Once I have 3 posts, writing more gains me nothing, so I stop gaming.

  ---

  ### Part 3: What The Audit Cannot Catch (Blind Spots)

  Even if a metric passes the audit, these systemic issues can still cause failure. No per-metric audit sees these:

  1.  **Metric Interaction Effects:**
      *   Metric A (Forum Posts) + Metric B (Speed of Submission) might incentivize students to post "I'm starting now!" on the forum to prove they started early, clogging the forum *and* rushing code. You audit metrics in isolation, but students optimize the *sum* of all grades.
  2.  **Distributional Bias (Fairness):**
      *   A metric might be "fair" on average but systematically disadvantage a subgroup (e.g., students with jobs can't post on the forum during the day; students with different cultural norms on asking for help). The 15-minute audit rarely catches demographic skew without data.
  3.  **The "Campbell's Law" of the Instructor:**
      *   This is pressure on *you*. If the University demands high pass rates, and you create a metric that makes passing easier (but learning lower), you might subconsciously design metrics that are too lenient. The audit checks student gaming, not instructor gaming.
  4.  **Psychological Safety:**
      *   A metric might be "robust" but create a toxic environment. For example, a leaderboard for "Most Help Given" might make students feel guilty for needing help, reducing actual help-seeking behavior.
  5.  **Implementation Drift:**
      *   You design the metric perfectly. The LMS implements it slightly differently. Or a new TA interprets the "Human Review" step differently than you. The metric degrades over time not because of theory, but because of operations.

  ### Recommendation for your Redesign

  Given the `assert add(1,1)==2` trauma, you need to move away from **Output Metrics** (LOC, Word Count, Tests Passed) and toward **Outcome Metrics** (Rubrics, Spot Checks).

  1.  **For Labs:** Use auto-grading for *correctness* (does it work on hidden tests?), but cap the points. The remaining points come from a **code review rubric** (readability, modularity) sampled by TAs. You cannot auto-grade quality at scale without inviting adversarial attacks.
  2.  **For Participation:** Use the **Binary Threshold + Spot Check** model derived above. Do not scale by volume.
  3.  **The "Escape Hatch":** Build a formal process where a student can appeal a grade by demonstrating competence in a different way (e.g., an oral exam). This acknowledges that *all* metrics are flawed proxies.

  **Final Advice:** If you must choose between the two candidates you listed, **keep neither as a scoring scale.** Use LOC for integrity monitoring and Forum Words for a binary check. If you try to grade on them directly, you will recreate the `assert add(1,1)==2` incident, just with text and whitespace.
