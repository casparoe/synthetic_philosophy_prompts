answer: |-
  You have put your finger on something pervasive yet strangely invisible. We walk through these constraints daily, obeying them without ever having read the statute, because the statute is made of steel, concrete, or plastic.

  To answer your first question: there is no single, universally established term that captures this precisely in the way you describe. There are cousins, certainly. In law and technology studies, Lawrence Lessig's maxim "Code is Law" argues that software architecture regulates behaviour just as legal code does, but that is usually digital. In engineering, a "forcing function" prevents a specific action (like a car that won't shift out of park unless the brake is pressed), but that is technical, not civic. In sociology, Bruno Latour speaks of the "script" of an object, but that is academic jargon.

  "Hostile architecture" is indeed too narrow, as you noted; it describes a specific *intent* (exclusion) rather than the *mechanism* (physical enforcement).

  So, let us coin a term. Given that these are rules (mandates) translated into physical substance (material), I propose we call this **Material Mandate**.

  A Material Mandate occurs when a normative rule is delegated to an object, such that the object enforces the rule through physics rather than through human authority.

  ### Carving the Concept

  To make this useful, we must distinguish it from its neighbours. Here is how we carve the boundaries of a Material Mandate.

  **1. Mandate vs. Ergonomics**
  You asked where the boundary lies with ordinary ergonomics. A handle shaped to be pulled is an *affordance*; it suggests the correct use for efficiency or ease. It becomes a Material Mandate only when there is a *normative rule* behind it that you are being prevented from breaking.
  *   **Ergonomics:** A kettle handle is placed away from the spout so you don't burn your hand. This is safety and ease. You *could* hold it near the spout if you were foolish.
  *   **Material Mandate:** The supermarket trolley lock. The rule is "you must return the trolley to get your coin back." The object makes the alternative (keeping the trolley) physically costly or impossible.
  *   **The Test:** If the design exists to make the task easier, it is ergonomics. If it exists to make a specific behaviour *unavailable* or *penalised* to enforce a social order, it is a Material Mandate.

  **2. Hostile Architecture as a Subset**
  Hostile architecture is a Material Mandate with a specific, exclusionary political aim. The bench armrests are a Mandate: the rule is "no lying down." However, because the rule targets a specific vulnerable class (the homeless) rather than a general user (like the trolley user), it earns the "hostile" qualifier.
  *   **General Material Mandate:** The spring-loaded gate. It applies to everyone equally (residents, delivery drivers, movers).
  *   **Hostile Material Mandate:** The anti-skater studs on a pavement.
  Both are Mandates, but only the latter is hostile. Your observation is correct: the Mandate is the genus; hostile architecture is a species.

  **3. Hard vs. Soft Mandates**
  You asked about the difference between making a rule impossible to break versus merely costly. This is a distinction in *severity*, not kind.
  *   **Hard Mandate:** The coin lock. It is binary. Without the pound, the wheel will not turn. Physics has vetoed your choice.
  *   **Soft Mandate:** The traffic chicane. You *could* drive through it at 30 mph, but you risk damaging your suspension or losing control. The rule "drive 20 mph" is enforced by the threat of physical consequence rather than a physical block.
  Both count as Material Mandates because in both cases, the enforcement mechanism is the environment itself, not a police officer or a sign. The chicane does not have a "slow day"; it is an unblinking enforcer.

  ### The Politics of the Object

  You mentioned philosophers who argue that machines embody politics. The short answer is: yes, they would say this phenomenon is their smoking gun.

  The political philosopher Langdon Winner, in his seminal 1980 essay *Do Artifacts Have Politics?*, used the exact example of traffic calming. He argued that when a speed bump is installed, a political decision (that safety is more important than speed) is hardened into concrete. It removes the possibility of negotiation. A police officer might let you off with a warning; a speed bump does not care about your emergency.

  Winner would argue that Material Mandates are actually *more* political than laws, because they are harder to repeal. A law can be debated in council; a concrete chicane requires a jackhammer to remove. By moving the rule from the rulebook to the pavement, the authority makes the rule permanent and invisible. It stops looking like a choice and starts looking like nature.

  ### Why the Name Matters

  Calling this a **Material Mandate** helps us spot when we are being governed without our consent. When a rule is written down, we know we are being regulated. We can choose to obey or break it and accept the penalty. We can argue for the law to be changed.

  But when the rule is embedded in the gate or the bench, the regulation disappears from sight. We don't feel governed; we feel that we are simply navigating the world. The argument about the gate being left open is settled not because anyone agreed, but because the spring won the argument for us.

  There is efficiency here, certainly. We save on policing costs and social friction. But the cost is discretion. The Material Mandate assumes the rule is always correct, because it allows for no exceptions. It does not know that you are struggling with a sofa. It does not know that the street is empty at 3 a.m. and the chicane is unnecessary.

  So, the next time you fish for a pound coin or navigate a zig-zag in the road, you are not just using a facility. You are complying with a **Material Mandate**, a silent law written in steel and stone, enforced by the physics of the pavement itself.
