      *   Ensure the "Test Cases" include a mechanism for who wins the point. (e.g., "If evidence shows X, User concedes point Y").
      *   *Crucial:* The prompt asks for the document to be something they can *sign*. It needs to sound like a contract or a joint memorandum.

  6.  **Writing the Document (incorporating the "Think Silently" logic):**

