      *(Self-Correction during drafting Section 4)*: The prompt asks for "predictions about what that case shows, recorded now." I need to make sure these aren't just "I think I'm right." They need to be "We agree to look for Evidence X. User thinks Evidence X will look like A. BIL thinks Evidence X will look like B."

      *(Final check on "Plain Language")*: Ensure terms like "determinism" are explained or avoided. Use "deep forces" and "channels."

      *(Final check on "No Caricatures")*: Ensure BIL isn't described as believing humans are robots. Ensure User isn't described as believing history is random chaos.

