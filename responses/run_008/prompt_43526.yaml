      *   *Mackie's Argument from Queerness:* Too metaphysical. Requires commitment to moral properties. Distracts from the anthropological/psychological focus.
      *   *Self-Refutation of Relativism:* ("Is it relatively true that relativism is true?"). Too logic-choppy. Students love it, but it shuts down inquiry rather than deepening it. It makes them feel smart for dismissing relativism without grappling with the cultural data.
