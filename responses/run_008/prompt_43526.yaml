      *   *Goal:* Distinguish diagnosing (why do we disagree?) from resolving (who is right?).
      *   *Draft 1:* "Can you explain why they do it without saying they are wrong?" (Too vague).
      *   *Draft 2:* "What fact would change their mind?" (Good, but focuses on resolution).
      *   *Draft 3:* "Does understanding the reason for their action tell you whether their action is permissible?"
      *   *Refinement:* Needs to be one sentence. "Can you state the metaphysical belief driving their practice without endorsing the moral conclusion it supports?"
      *   *Better:* "If we agreed on all the non-moral facts about the case, would we still have a moral argument left?" (This is the standard Brandt/Wong test).
      *   *Prompt requirement:* "answerable in one sentence."
      *   *Selection:* "If we both accepted the same facts about the world, would we still disagree about what to do?"

