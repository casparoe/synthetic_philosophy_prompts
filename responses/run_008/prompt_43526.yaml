answer: |-
  Here is a design for the discussion section, structured to dismantle the "Disagreement $\rightarrow$ No Fact" syllogism while preserving the complexity of the WEIRD critique.

  ### 1. The Sequence

  **Phase 1: Explicitize the Syllogism (10 mins)**
  Do not start with the WEIRD point. Start with the students' intuition. Write their half-formed syllogism on the board explicitly:
  1.  Cultures fundamentally disagree about right and wrong.
  2.  Where there is fundamental disagreement, there is no fact of the matter.
  3.  Therefore, there are no moral facts.
  Ask the class to identify which premise feels most vulnerable. Most will attack Premise 2 (the inference). This gives them agency; they are testing the logic, not defending their culture.

  **Phase 2: The Carrying Case & The Value/Belief Distinction (20 mins)**
  Introduce the funerary case *now*. You cannot evaluate the anthropological record (Premise 1) until you know what kind of disagreement is being recorded. Use the case to drive a wedge between Premise 1 and Premise 2. Show that a clash of *actions* does not guarantee a clash of *values*.

  **Phase 3: The Astronomy Analogy Interception (15 mins)**
  Students will naturally try to save Objectivism by comparing morality to science (the Astronomy Analogy). Intercept this here. If you wait until the end, they will have cemented the idea that moral progress is identical to scientific progress. Use this moment to show where the analogy breaks down (the role of empirical verification).

  **Phase 4: The WEIRD Reflexive Turn (10 mins)**
  Place the WEIRD point at the **end**. If you place it at the start, it functions as a disclaimer that paralyzes analysis ("Our tools are biased, so why analyze?"). At the end, it functions as a philosophical horizon. Once they have used the Value/Belief distinction to analyze the case, ask: *Is the demand to separate values from beliefs itself a WEIRD preference?* This prevents them from settling into a comfortable Objectivism. It leaves them with the task of the section: they can't state the syllogism without wondering if Premise 2 fails because of *logic* or because of *culture*.

  **Phase 5: The Diagnostic Question (5 mins)**
  Exit ticket.

  ### 2. The Carrying Case: Constraints

  You are correct to consider funerary endocannibalism (e.g., the Wari' or Fore peoples), but it must be staged carefully to avoid the "cognitive error" trap.

  **What the Case Must Contain:**
  *   **Shared Normative Ground:** It must be clear that both the practitioners and the observers share a high-order value (e.g., "We must treat the dead with maximum respect" or "We must ensure the safety of the living").
  *   **Divergent Metaphysics:** The divergence must stem from a non-moral belief about the mechanism of that value (e.g., "Respect requires releasing the spirit via consumption" vs. "Respect requires preserving the vessel via burial").
  *   **Internal Rationality:** The practitioners must not appear confused or cruel; their action must be the *only* rational choice given their metaphysical beliefs.

  **What the Case Must Not Contain:**
  *   **Total Dissolution:** The case must *not* suggest that *all* moral disagreement is soluble via factual clarification. If the case implies that once we agree on the facts the moral argument vanishes, you teach them that ethics is just applied anthropology.
  *   **The "Residue":** You must explicitly prompt the class: *"Even if we proved to them that consumption does not help the soul, would they still do it?"* If the answer is "No," morality is reduced to instrumental rationality. You need them to see that sometimes, even with agreed facts, the "Residue" of disagreement remains (e.g., "Even if the soul isn't helped, the body is sacred"). This preserves the possibility of fundamental moral disagreement without conceding to Relativism.

  ### 3. Misconceptions and Interception Points

  **1. The Inference from Disagreement to No-Fact (Premise 2)**
  *   **When it surfaces:** Phase 1 (The Syllogism).
  *   **Interception:** Do not argue against it abstractly. Use the Carrying Case. Show that two doctors might disagree on a treatment (Action) because one believes the patient has Virus A and the other believes Virus B (Belief), even if they share the value "Save the Patient." Disagreement exists; facts exist; the link is broken.

  **2. The Astronomy Analogy ("People disagreed about the earth's shape too")**
  *   **When it surfaces:** Phase 3 (After the Value/Belief distinction is made). Students will say, "So morality is just like astronomy; we just need better instruments."
  *   **Interception:** Challenge the *method of resolution*. In astronomy, we resolve disagreement by looking at the earth. In the funerary case, if we "look at the soul" and find nothing, does that settle the moral question? No, because the moral question might shift to "What is the symbolic meaning of the body?" This stops them from treating moral facts as empirical objects waiting to be found.

  **3. Relativism as the Only Alternative**
  *   **When it surfaces:** Phase 4 (The WEIRD Turn). Once they realize their "Value/Belief" distinction might be culturally specific, they will slide into "So everything is relative."
  *   **Interception:** Distinguish *Metaethical Relativism* (truth is relative) from *Descriptive Relativism* (beliefs differ). Remind them that acknowledging our instruments are calibrated by our culture does not mean there is nothing to measure. It just means the measurement is harder. This keeps Objectivism on the table as a difficult project rather than a default assumption.

  ### 4. The Diagnostic Question

  To test if a student distinguishes *diagnosing* a disagreement (identifying the source) from *resolving* it (determining who is right), ask:

  > **"If we confirmed their metaphysical beliefs were true, would you necessarily share their moral conclusion?"**

  *   **Why this works:**
      *   If they answer **"Yes,"** they conflate diagnosis with resolution. They believe that identifying the factual belief *settles* the moral truth (the "cognitive error" trap).
      *   If they answer **"No,"** they understand that explaining the *cause* of the disagreement (diagnosis) does not tell us which side is *justified* (resolution). They recognize the normative residue.

  ### 5. What to Explicitly Refuse to Cover

  You are correct to exclude both **Mackie's Argument from Queerness** and the **Self-Refutation Objection to Relativism**.

  *   **Exclude Mackie:** His argument relies on a specific metaphysical commitment to what moral properties *would have to be* (queer, non-natural) to exist. This discussion is about *anthropological disagreement* and *epistemology*. Introducing Mackie shifts the debate from "How do we interpret cultural data?" to "What is the ontology of value?" This will derail the section into metaphysics and lose the thread of the WEIRD critique.
  *   **Exclude Self-Refutation:** The argument ("If relativism is true, is it relatively true?") is a logic trap. It allows students to feel they have "defeated" relativism with a clever syllogism without engaging with the cultural data that motivated it. It produces confidence without understanding. You want them unsettled and nuanced, not victorious and dogmatic.

  **Instructional Note:** If a student raises either of these, acknowledge the argument's existence in the literature but bracket it: *"That is a metaphysical/logical objection, but today we are asking an epistemological question: What does the existence of disagreement actually tell us about our access to moral truth?"*
