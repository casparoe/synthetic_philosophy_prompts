      *   *Misconception 3: Relativism is the only alternative.*
          *   *Intercept:* Late. After the WEIRD point. Show that Objectivism doesn't require universal agreement, just universal *applicability*.
      *   *Wait, the prompt asks for the order they will surface.*
          1.  Syllogism (Start).
          2.  Astronomy Analogy (When trying to save objectivity).
          3.  Relativism as default (When Astronomy fails).
      *   *Placement:*
          1.  Syllogism: Board work at start.
