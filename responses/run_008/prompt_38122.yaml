answer: |-
  This is a great prompt. You are right to be skeptical. A lot of analytic philosophy of action from the mid-20th century *was* effectively doing behavioral economics without the calculus, often getting tangled in semantics because they lacked the formal machinery to describe dynamic inconsistency.

  However, the "extra steps" you suspect aren't always wasted motion. Sometimes they are trying to solve a welfare problem your framework tends to hand-wave: *Which self gets to vote?*

  Here is the translation job, followed by the residue report you asked for.

  ---

  ### Part 1: The Translations

  #### (a) Socratic Intellectualism
  **The Philosophical Claim:** Akrasia is impossible. If an agent chooses $B$ over $A$, they must believe $B$ is better *at that moment*. Evil is ignorance (mismeasurement of pleasure/pain), not volitional weakness.
  **The BE Translation:** **Revealed Preference with No Intrapersonal Conflict.**
  At time $t$, the agent maximizes $U_t$. If the agent chooses $B$, then $U_t(B) > U_t(A)$. There is no "true" preference being overridden. What looks like akrasia is simply a shift in the valuation parameters or the discount function between $t_0$ (planning) and $t_1$ (action).
  *   **Formalization:** The agent is a sequence of temporal selves. Self-$t_1$ is not "weak"; Self-$t_1$ is simply maximizing its own utility function. The error is purely epistemic (misestimating the magnitude of future utilities) or structural (the discount curve is non-exponential), but at the moment of choice, the agent is locally rational.

  #### (b) Davidson's Puzzle
  **The Philosophical Claim:** An agent can make an *all-things-considered* (ATC) judgment that $A$ is better, yet intentionally do $B$. Davidson argues this requires distinguishing between a *conditional* judgment ("$A$ is better if we consider only health") and an *unconditional* judgment ("$A$ is better, period"). Akrasia is acting against the unconditional judgment.
  **The BE Translation:** **Dynamic Inconsistency Between Utility Functions.**
  The ATC judgment is the utility function of the "planner" self (Time 0), $U_0$. The action is the utility function of the "doer" self (Time $t$), $U_t$.
  *   **Formalization:** $U_0(A) > U_0(B)$, but due to hyperbolic discounting, $U_t(B) > U_t(A)$.
  *   **The "Unconditional" Distinction:** In BE terms, Davidson's "unconditional judgment" is the attempt to impose $U_0$ as the global welfare criterion. The "puzzle" is simply the observation that the agent is dynamically inconsistent. Davidson wants to say the agent is violating a principle of continence; you would say the agent is violating time-consistency.

  #### (c) Frankfurt's Hierarchical Model
  **The Philosophical Claim:** Freedom of will requires alignment between first-order desires (wanting to do $X$) and second-order volitions (wanting to *want* to do $X$). Akrasia is a failure of authority: the desire you *identify* with loses to the desire you merely *have*.
  **The BE Translation:** **Meta-Preferences Over Discount Parameters.**
  The first-order desire is the immediate utility function $U_t$. The second-order volition is a meta-utility function $M$ that ranks different versions of $U_t$.
  *   **Formalization:** The agent has a preference over which discount rate $\delta$ governs their behavior. They prefer $\delta_{high}$ (patient) but are governed by $\delta_{low}$ (impulsive).
  *   **The Mechanism:** Akrasia occurs when the meta-preference fails to constrain the first-order preference. In BE terms, this is a failure of internal commitment technology. The "self" is the meta-preference; the "impulse" is the current discount function.

  #### (d) Holton's Intention-Based View
  **The Philosophical Claim:** Akrasia isn't acting against judgment; it's failing to stick to a prior intention without sufficient reason to revise. Willpower is the capacity to resist *reconsidering* an intention.
  **The BE Translation:** **Costly Re-optimization of Commitment Devices.**
  An intention is a Ulysses contract (a commitment device). Holton's "willpower" is the cost parameter $\kappa$ associated with unbinding that contract.
  *   **Formalization:** At $t_0$, the agent sets a constraint: "Do $A$." At $t_1$, the agent faces a temptation to switch to $B$. A standard optimizer switches if $U_t(B) - U_t(A) > 0$. Holton's agent switches only if $U_t(B) - U_t(A) > \kappa$ (the cost of breaking the intention).
  *   **The Akratic:** The akratic agent sets $\kappa = 0$ or revises the intention when the "sufficient reason" condition isn't met. They are engaging in premature re-optimization.

  ---

  ### Part 2: The Residue Report

  Here is where the translation breaks down. You asked for honesty about the fudging.

  #### (a) Socrates
  *   **Clean Translation:** The idea that choice reveals current preference is pure Revealed Preference Theory.
  *   **Distortion:** Socrates thinks the error is *cognitive* (you got the math wrong). BE knows the error is often *structural* (you know the math, but your $\delta$ drops anyway). Socrates implies that perfect information cures akrasia. BE knows information often doesn't cure present bias.
  *   **Residue:** **Moral Responsibility.** If Socrates is right, nobody is truly blameworthy (it's just ignorance). BE is agnostic on blame, but if you treat bias as a structural feature of the brain, blame gets tricky. Socrates wants to exonerate; you might want to treat.

  #### (b) Davidson
  *   **Clean Translation:** The conflict between $U_0$ and $U_t$.
  *   **Distortion:** Davidson is obsessed with the *logic* of the judgment. He wants to know how it is *rational* to hold the judgment and do the act. BE just says it's *common*. You describe the mechanism of the crash; Davidson is asking why the driver thinks they can drive through the wall.
  *   **Residue:** **The Normative Authority of $U_0$.** Davidson assumes the ATC judgment *should* rule. BE often assumes this too (the "planner" is the welfare standard), but you have no theoretical justification for why $U_0$ trumps $U_t$. Davidson tries to build that justification (the principle of continence); you just posit it as the objective function.

  #### (c) Frankfurt
  *   **Clean Translation:** Meta-preferences.
  *   **Distortion:** **Infinite Regress.** In BE, a second-order preference is just another preference to be satisfied. If I want to want $X$, that's just $Y$. Do I need a third-order preference to validate $Y$? Frankfurt says no: the second-order volition *constitutes* the person. In BE, there is no "person," only a stack of utility functions.
  *   **Residue:** **Identity.** Frankfurt is trying to define which utility function represents the *Agent*. BE treats all selves as equally real stakeholders. If the "impulsive self" wins, Frankfurt says the *person* was overridden. You would say the *person* (the aggregate of all temporal selves) just revealed a high discount rate. You lack a criterion for **Selfhood**.

  #### (d) Holton
  *   **Clean Translation:** Commitment devices and the cost of breaking them.
  *   **Distortion:** **Deontology vs. Consequentialism.** Holton argues you shouldn't reconsider even if the local math says you should (unless there's a *new reason*). BE says you should reconsider if the net benefit exceeds the transaction cost. Holton puts a deontological constraint on optimization ("Do not reconsider"); BE treats "not reconsidering" as just another constraint to be optimized away if profitable.
  *   **Residue:** **The Norm of Stability.** Holton thinks stability of intention is a virtue in itself. BE thinks stability is only instrumentally valuable. If untying yourself from the mast saves you money, BE says "untie." Holton says "only if you have a new reason, not just a new temptation."

  ---

  ### Part 3: The "Irrational" Gap

  You hit the nail on the head: *"His discount curve is non-exponential" isn't an accusation.*

  In BE, "irrationality" is a technical term meaning **violating axioms of consistency** (transitivity, time-consistency, independence of irrelevant alternatives). It is a positive claim about the structure of the choice function.

  In Philosophy, "irrationality" is a **normative failure of agency**. It implies the agent failed to govern themselves according to reasons they acknowledge.

  **Is the gap real?**
  Yes. Your framework cannot carry the normative weight without smuggling in a philosophical assumption.
  *   **The Smuggle:** When you label hyperbolic discounting a "bias" and propose welfare interventions (like nudges), you are implicitly asserting that the **Long-Run Self ($t_0$) has moral authority over the Short-Run Self ($t_t$).**
  *   **The Problem:** Why? From a purely descriptive BE standpoint, the $t_t$ self is just as real as the $t_0$ self. Why is the $t_0$ preference the "true" one?
      *   Philosophers argue about this (Frankfurt says it's the one we identify with; Davidson says it's the one consistent with ATC judgment).
      *   Behavioral Economists usually just assume it because it makes the welfare calculus tractable.

  **Verdict:** The philosophers' "irrational" is not clearer than yours; it's often fuzzier. *However*, they are asking a question you are ignoring: **Whose utility counts?** Your framework describes the war between selves perfectly. It has no internal resources to declare a winner without importing a normative premise from outside (usually a tacit Kantian or Utilitarian view that "planning" is superior to "impulse").

  ### Part 4: The "Rediscovering Present Bias" Hunch

  **Is your hunch right?**
  **Mostly Yes.**
  A huge amount of the 20th-century philosophy of action (Davidson, Watson, early Frankfurt) was essentially struggling to formalize what Ainslie and Thaler later put into equations. They were describing **preference reversal** without realizing that's what it was. They treated it as a logical puzzle because they assumed agents were expected utility maximizers, so inconsistency looked like a paradox rather than a parameter shift.

  **Where it is Backwards:**
  Philosophy isn't just trying to explain *why* the reversal happens (mechanism). They are trying to explain **what it means for responsibility.**
  *   If BE is right, the addict is a machine with a broken discount function.
  *   If Philosophy has a point, the addict is an agent who failed to uphold a normative standard they endorse.

  If you want to design a commitment device, BE is superior. If you want to know if we should *blame* the addict for untying the rope, BE runs out of vocabulary, and Philosophy (annoyingly) takes over.

  **Summary:** You can translate 80% of the literature into discount functions. The remaining 20% is the normative claim that the discount function *ought* to be exponential, and that the self who wants that is the "real" self. That 20% isn't science; it's ethics. Don't let them pretend it's mechanics, but don't pretend your mechanics solve the ethics.
