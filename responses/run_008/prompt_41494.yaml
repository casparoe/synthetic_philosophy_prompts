      *   *Selected:* **Socrates and the Singleton.** It's the cleanest case of symmetrical necessitation where intuition strongly favors one direction. Or **The color Scarlet and the property Red.** (If something is Scarlet, it is Red. If something is Red, is it Scarlet? No.)
      *   *Wait, the prompt asks for:* "a pair of facts that necessitate each other perfectly symmetrically."
