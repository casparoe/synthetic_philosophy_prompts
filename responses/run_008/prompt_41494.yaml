      *   *Strict Symmetrical Necessitation:* $A \leftrightarrow B$.
      *   *Example:* "The ball is red all over" vs "The ball is colored all over." (No).
      *   *Example:* "Socrates exists" vs "{Socrates} exists". (Yes).
      *   *Example:* "The event is a killing" vs "The event is a causing of death". (Maybe too causal).
      *   *Decision:* Stick with Socrates/Singleton but frame it carefully so it doesn't feel like math class. Or use **The Truthbearer and the Truthmaker**. (The sentence "Snow is white" is true $\leftrightarrow$ Snow is white). But that drags in language.
      *   *Best Bet:* **Socrates and {Socrates}.** It's the canonical example for a reason. I will justify this choice in the plan.

