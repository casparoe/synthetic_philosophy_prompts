  **Verdict:** The nearby concept that does the most work is **Operationalism** (specifically, *behaviorist operationalism*), because it explains the philosophical permission structure: economists define "wellbeing" *as* choice satisfaction, so measuring choice *is* measuring wellbeing by definition. However, Operationalism does not capture the *statistical sin* you identified—reusing the same data points to both fit the parameters and validate the welfare claim. That is a methodological error within the operationalist framework, not the framework itself.

  Since nothing fits exactly, I will coin a term for this specific move.

  ### Coined Term: **Evidential Closure**

  **Definition:**
  **Evidential Closure** occurs when a model's normative output (e.g., welfare loss) is mathematically derived from parameters estimated exclusively on the same behavioral data that the output is claimed to evaluate, without independent validation or external normative input. It is a form of circular analysis where the evidence is used to construct the metric and then reused to certify the metric's finding, creating a closed loop that precludes the possibility of the data contradicting the welfare claim.

  **How it differs from nearby concepts:**

  1.  **Vs. Plain Unfalsifiability:**
      *   **Unfalsifiability** means no observation could *ever* prove the theory wrong (e.g., "invisible dragons exist").
      *   **Evidential Closure** allows the *descriptive* model to be falsified (e.g., if households violate the axioms of demand, the fit fails). However, the *normative* claim (the welfare number) remains insulated. If the model fits, the welfare number is mathematically guaranteed to follow from the choices. The closure protects the *interpretation* of the data, not the data fit itself.

  2.  **Vs. Interpersonal Comparability:**
      *   **Comparability complaints** argue we cannot sum utility across people because utility is ordinal or subjective.
      *   **Evidential Closure** grants the economists their cardinal utility function for the sake of argument. The critique is not that the units are wrong, but that the *source* of the units is tautological. Even if interpersonal comparison were solved, Evidential Closure would still render the welfare estimate empty because it adds no new information beyond the observed choices.

  3.  **Vs. Overfitting (Statistical):**
      *   **Overfitting** means the model captures noise and fails to predict *new* data.
      *   **Evidential Closure** can occur even with a perfectly generalizable model. The issue is not predictive failure on hold-out data, but the philosophical claim that the model's internal parameters represent "wellbeing" rather than just "choice patterns."

  **Edge Cases:**

  *   **Valid Calibration (Not Evidential Closure):** If economists estimate the demand system on Dataset A, but validate the welfare implications against independent subjective wellbeing surveys (Dataset B), the loop is broken. This is not Evidential Closure because the evidence for the *welfare claim* is distinct from the evidence for the *choice fit*.
  *   **Explicit Stipulation (Not Evidential Closure):** If an economist states, "We define welfare strictly as expenditure capacity," and reports cost-of-living changes, this is transparent operationalism. Evidential Closure specifically refers to cases where the model presents the output as an *empirical discovery* about wellbeing ("lost wellbeing") rather than a definitional restatement of costs.
  *   **Structural Identification (Not Evidential Closure):** In some structural models, parameters are identified by theoretical restrictions (e.g., curvature constraints) rather than just data fit. If the welfare measure relies heavily on these theoretical priors rather than the data alone, it is not fully closed, though it may suffer from prior-dependence.

  **Why this term works:**
  It shifts the critique from "your utility function is fake" (which economists expect) to "your evidence loop is closed." It highlights that the policy recommendation is not supported by an independent measure of welfare, but is merely a re-encoding of the behavior the policy aims to regulate.
