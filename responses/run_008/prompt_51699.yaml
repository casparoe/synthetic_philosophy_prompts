answer: |-
  **JOINT STATEMENT ON THE NORMATIVITY OF ASSERTION**

  **Parties:** Proponent of the Knowledge Norm (KN) and Proponent of the Belief Norm (BN).
  **Date:** October 26, 2023
  **Purpose:** To map the terrain of agreement and disagreement regarding the norms governing assertion, following an adversarial collaboration.

  ### I. Agreed Claims

  Both parties endorse the following propositions as starting points for further inquiry:

  1.  **Moorean Defectiveness:** Assertions of the form "$p$, but I do not believe that $p$" are inherently defective. Both parties agree this defectiveness exists, though they disagree on its source (violation of a knowledge rule vs. expression of insincerity).
  2.  **Truth Independence:** The violation of an assertion norm does not entail that the content asserted is false. One can violate the norm of assertion while speaking the truth (e.g., a lucky guess).
  3.  **Sincerity without Knowledge:** There are conversational contexts in which a speaker may assert $p$, sincerely believe $p$, explicitly admit they do not *know* $p$, and yet not be subject to moral criticism or accusations of deception. (Note: KN interprets this as "improper but excusable"; BN interprets this as "proper").
  4.  **Challenge Practices:** In ordinary discourse, hearers frequently challenge assertions by asking "How do you know?" rather than "Do you believe this?" Both parties agree this linguistic data requires explanation.
  5.  **Retraction Phenomena:** Speakers often voluntarily retract assertions upon learning they lacked knowledge, even if the assertion turned out to be true.

  ### II. Areas of Disagreement

  The following table outlines the specific divergences in interpretation regarding the agreed claims and specific test cases.

  | Issue | Knowledge Norm (KN) Position | Belief Norm (BN) Position |
  | :--- | :--- | :--- |
  | **The Core Norm** | Assertion is constitutively governed by the rule: *Assert $p$ only if you know $p$.* | Assertion is governed by the standard: *Assert $p$ only if you believe $p$* (where belief aims at truth). |
  | **Pre-Draw Lottery** | Asserting "Ticket $n$ will lose" before the draw is **improper**. Statistical probability does not yield knowledge; thus, the constitutive rule is violated. | Asserting "Ticket $n$ will lose" before the draw is **proper**. The speaker holds a justified true belief (or high-probability belief); the norm of belief is satisfied. |
  | **Retraction Cases** | When a speaker says, "Hang on, I might be wrong," they are acknowledging they lacked the requisite knowledge to assert in the first place. | When a speaker says, "Hang on, I might be wrong," they are acknowledging a risk that their belief is false, not that they violated a knowledge rule. |
  | **Nature of Norm** | The norm is a **constitutive rule**. Violating it means you aren't playing the "game" of assertion correctly, regardless of consequences. | The norm is an **evaluative standard**. It guides critics and speakers but functions more like a rule of thumb than a constitutive boundary. |
  | **Retraction Tax** | The "retraction tax" (the social cost incurred when taking back a claim after a challenge) is paid because the speaker was *already* in violation when they first asserted. | The "retraction tax" is paid because the speaker's initial assertion created an expectation of reliability that the new information undermines. |

  ### III. Cruxes and Pre-Registered Test Cases

  The parties identify two theoretical cruxes where their views generate different empirical or intuitive predictions. They agree to treat the following cases as adjudicators.

  **Crux 1: The Source of Moorean Absurdity**
  *Question:* Does the defectiveness of Moorean sentences ("$p$, but I don't believe/know $p$") arise from a specific norm of assertion, or from general facts about belief and knowledge?
  *Test Case:* **The Unknowable Truth.** A speaker asserts a proposition that is true and believed, but which is metaphysically impossible to *know* (e.g., a specific quantum state prior to measurement, or a logical truth too complex for human verification).
  *   **KN Prediction:** The assertion is improper. Since knowledge is impossible, the constitutive rule cannot be satisfied. The Moorean absurdity arises because the speaker claims a status (assertion) that implies knowledge is possible.
  *   **BN Prediction:** The assertion is proper (provided the speaker believes it). The Moorean absurdity arises only if the speaker disclaims *belief*. If the speaker says, "I believe $p$, though $p$ is unknowable," there should be no defect.

  **Crux 2: The Hearer's Challenge**
  *Question:* Can the Belief Norm explain why hearers reach for *knowledge* ("How do you know?") rather than *belief* ("Do you believe that?") when challenging assertions, without adding ad-hoc pragmatic clauses?
  *Test Case:* **The Low-Stakes Guess.** In a casual setting, Speaker asserts $p$ based on a hunch (belief without knowledge). Hearer challenges: "You don't know that."
  *   **KN Prediction:** The hearer is identifying a constitutive violation. The challenge is invariant across stakes because the rule of assertion is invariant.
  *   **BN Prediction:** The hearer is invoking a pragmatic implicature. In low stakes, belief is sufficient; the hearer is signaling that the stakes are effectively higher than the speaker treats them. If stakes remain truly low, the challenge "You don't know that" should feel pedantic or misplaced.

  ### IV. Note on Potential Verbal Dispute

  Upon review, the collaboration identifies a likely verbal dispute regarding the definition of **"Norm."**

  *   **The Issue:** The KN proponent tends to use "norm" to mean a **constitutive rule** (like the rules of chess: a move that violates the rule is not a chess move). The BN proponent tends to use "norm" to mean a **regulative standard** (like a rule of etiquette: a violation is still an assertion, just a bad one).
  *   **Why this matters:** If KN means "Assertion *is* knowledge" and BN means "Assertion *ought to track* belief," they may agree on all the behavioral data (when people criticize, when people retract) but disagree on the label.
  *   **Resolution Path:** Both parties agree that future arguments must specify whether they are discussing the *conditions for the existence of an act* (constitutive) or the *conditions for the evaluation of an act* (regulative). If the dispute reduces to "Is assertion defined by knowledge or evaluated by belief?", it is partially verbal. However, if the dispute entails different predictions about the "Retraction Tax" or Lottery cases (as outlined in Section II), the dispute is substantive.

  ***

  **Signed,**

  _____________________ (Knowledge Norm Proponent)

  _____________________ (Belief Norm Proponent)
