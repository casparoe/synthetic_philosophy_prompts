  ### JOINT STATEMENT ON THE TRANSITIVITY OF "BETTER THAN"

  **I. Agreed Claims**
  1.  **Spectrum Intuitions:** In spectrum cases (e.g., Torture → Mild Discomfort), pairwise judgments typically favor each item over its immediate neighbor ($A_i \succ A_{i+1}$), while endpoint intuitions favor the original torture being worse than the final discomfort ($A_1 \prec A_n$).
  2.  **Decision Theory Axioms:** Standard Decision Theory (SDT) requires transitive preference relations to construct utility functions and guarantee consistent choice.
  3.  **Money Pump Mechanics:** Agents with cyclic preferences ($A \succ B \succ C \succ A$) are susceptible to money pumps (sequential trades resulting in guaranteed net loss) *if* they lack commitment mechanisms.
  4.  **Normative Stakes:** Both camps agree that if "better than" is intransitive, standard utility maximization cannot model all-things-considered value.
  5.  **Vagueness Role:** Both camps agree that vagueness or multidimensionality plays a role in generating the spectrum intuitions, but disagree on whether this resolves the logical tension.

  **II. Note on Verbal Ambiguity**
  *   **Flag:** The term "Rational Preference."
  *   **Why:** Transitivists often define "rational preference" *as* a transitive ordering (conceptual truth). Non-transitivists define it as "responsiveness to normative reasons" (substantive claim). We agree this terminological overlap obscures the substantive dispute about whether *value itself* constrains rationality to be transitive. This verbal layer is set aside for the table below.

  **III. Residual Substantive Disagreements**

  | # | Disagreement Claim (Neutral Phrasing) | Crux | Agreed Test Case / Argument | Transitivist Prediction | Non-Transitivist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Ontology of Value:** Whether the spectrum case reveals a genuine intransitivity in the normative relation vs. a cognitive/semantic error in pairwise comparison. | Does value structure permit cycles? | **The Forced Sequence:** Subjects forced to choose sequentially between spectrum neighbors without memory of prior choices. | Subjects will exhibit cyclic choice patterns only due to error/noise; corrected agents will converge on transitivity. | Subjects will exhibit stable cyclic patterns reflecting the actual intransitive structure of value. |
  | **2** | **Normative Force of Pragmatics:** Whether susceptibility to money pumps constitutes a decisive refutation of intransitive value theories. | Does pragmatic consistency constrain normative truth? | **The Policy Commitment:** An agent adopts a policy to reject trades that lead to pumps, despite having intransitive pairwise values. | This concedes rationality requires transitivity at the policy level, saving the axiom. | This shows money pumps constrain *choice strategies*, not the underlying *value relation* itself. |

