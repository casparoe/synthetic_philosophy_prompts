answer: |-
  Based on the verdicts you have provided, treating them as fixed data points, I have extracted the underlying logic of your classification system. Your tentative principle ("involuntary loss of social complexity that goes unabsorbed") is close, but it is currently too focused on *complexity* as the metric. Your Harappan verdict proves that complexity can be lost without you classifying it as collapse, provided the transition lacks trauma. Your Rome verdict proves that complexity can be lost (the Imperial apparatus) without collapse, provided the functions are absorbed.

  Here is the repaired principle, the analysis of your outliers, the predictions for new cases, and the resolution of the threshold/degree problem.

  ### I. The Derived Principle: Traumatic Institutional Vacuum

  Your verdicts are best captured not by a single clause, but by a conjunctive definition. A society undergoes **Collapse** if and only if it meets three conditions simultaneously:

  1.  **Termination of Core Political Technology:** The specific mechanism of centralization (e.g., Divine Kingship, Palatial Redistribution, Imperial Bureaucracy) ceases to function and is not merely renamed.
  2.  **Evidence of Systemic Trauma:** The transition is marked by archaeological signatures of stress (rapid abandonment, malnutrition, fortification, demographic contraction) rather than gradual decomposition or strategic dispersal.
  3.  **Failure of Immediate Absorption:** The organizational capacity is not inherited by a successor polity or institution within a timeframe that maintains continuity of social memory (approx. 1–2 generations).

  **Motivation by Case:**
  *   **Clause 1 (Political Technology)** explains **Rome**. The Emperor fell, but the *administrative technology* (tax, law, bureaucracy) was absorbed by the Church and Germanic kingdoms. The "software" ran on new "hardware."
  *   **Clause 2 (Systemic Trauma)** explains **Harappan**. Urban complexity ended (Clause 1 met), and there was no successor state (Clause 3 met), but you exclude it because the dispersal lacks signatures of famine or warfare. It was decomplexification, not collapse.
  *   **Clause 3 (Absorption)** explains **Maya vs. LBA**. Both meet Clauses 1 and 2. However, this clause helps distinguish the *depth* of the collapse (see Section III). In the LBA, Egypt absorbed refugees and trade; in the Southern Maya lowlands, the vacuum was absolute.
  *   **Norse Greenland** meets all three: Kingship/Church structure ended, evidence of starvation/cold stress exists, and no successor absorbed the population (extinction).

  ### II. Repairs and Recommendations

  Your tentative principle forced the Harappan verdict the wrong way because it weighted "loss of complexity" too heavily. The repaired principle weights "trauma" and "absorption" equally. Here is where your current verdicts conflict with the principle and my recommendation on which should give.

  **1. The Harappan Verdict (Consistent)**
  *   **Analysis:** Your principle ("loss of complexity") predicts Collapse. Your verdict is Not Collapse.
  *   **Repair:** The repaired principle saves your verdict by prioritizing **Clause 2 (Trauma)**. If the population disperses without evidence of coercion or starvation, it is an adaptive strategy, not a systemic failure.
  *   **Recommendation:** Hold this verdict. It anchors the distinction between *decentralization* and *collapse*.

  **2. The Rapa Nui Verdict (Inconsistent)**
  *   **Analysis:** You waver. Your gut says Collapse (deforestation/statues end); your head says Transformation (population crash is post-contact).
  *   **Principle Prediction:** If the demographic crash and systemic trauma are post-contact, then the pre-contact episode fails **Clause 2**. The end of statue production is a change in *political technology*, but if the population remained stable and fed, it is a transformation of ideology, not a collapse of society.
  *   **Recommendation:** **Change the verdict to Not Collapse.** Your "head" is correct. Deforestation without demographic catastrophe is resource management (however severe), not societal collapse. To call it collapse conflates ecological change with social failure.

  **3. The Maya vs. LBA Intuition (The "More Collapse" Problem)**
  *   **Analysis:** You feel the Maya collapse is "more" of a collapse than the LBA. Both meet the three criteria.
  *   **Resolution:** This is not a threshold problem but a **Spatial/Systemic Vacuum** metric.
      *   **LBA:** The "System" was the Eastern Mediterranean network. When the Levantine nodes failed, the Egyptian node survived and absorbed shock. The *network* collapsed, but the *system* persisted.
      *   **Maya:** The "System" was the Southern Lowlands. When the nodes failed, *no* node survived. The vacuum was total within the defined region.
      *   **Refinement:** Collapse severity is proportional to the **percentage of the system's carrying capacity that enters a vacuum state.** The Maya South approached 100%; the LBA East was perhaps 60%.

  ### III. Predictions for Unmentioned Cases

  Applying the **Traumatic Institutional Vacuum** principle to your requested cases:

  **1. Angkor (14th–15th Century)**
  *   **Verdict:** **Transformation (Not Collapse).**
  *   **Reasoning:** While the civic center was abandoned (Clause 1), the Theravada Buddhist monastic network absorbed the administrative and social functions (Failure of Clause 3). The population shifted to wet-rice zones south of the temple complex, but the state structure persisted under the same dynasty (just moved).
  *   **Prediction:** You should classify this as a strategic relocation, similar to your Rome verdict.

  **2. Chaco Canyon (12th Century)**
  *   **Verdict:** **Collapse (Regional).**
  *   **Reasoning:** The Great Houses were abandoned rapidly (Clause 1). There is evidence of social stress/violence (Clause 2). The specific Chacoan religious/political hierarchy was not absorbed by the successor Pueblo groups, who explicitly rejected the Chacoan model (Clause 3).
  *   **Prediction:** Like the Maya, the *people* persisted, but the *system* died unabsorbed.

  **3. Cahokia (14th Century)**
  *   **Verdict:** **Collapse.**
  *   **Reasoning:** Rapid depopulation of the mound center. Evidence of palisades/violence (Clause 2). No successor polity in the American Bottom absorbed the Mississippian political technology immediately; it fragmented (Clause 3).
  *   **Prediction:** Fits the Maya/Norse model.

  **4. Western Zhou (771 BCE)**
  *   **Verdict:** **Transformation (Not Collapse).**
  *   **Reasoning:** The capital was sacked and the king killed (Clause 1 & 2 met). However, the dynasty relocated east and continued for 500 years. The ritual/administrative system was absorbed by the Eastern Zhou.
  *   **Prediction:** Fits the Rome model. Regime change, not systemic collapse.

  **5. Third-Century Crisis (Roman Empire)**
  *   **Verdict:** **Transformation (Not Collapse).**
  *   **Reasoning:** Massive trauma (Clause 2). Many emperors fell (Clause 1). *However*, the Diocletian/Constantinian reforms successfully absorbed the shock and rebuilt the administrative capacity (Failure of Clause 3). The system proved resilient enough to self-correct.
  *   **Prediction:** If the empire had fractured permanently in 284 CE, it would be collapse. Because it reconstituted, it is a crisis.

  ### IV. Threshold vs. Degree

  You asked whether collapse is a threshold concept or a matter of degree. Your intuition that Maya is "more" of a collapse than LBA suggests you are treating it as a **Threshold Concept with a Severity Gradient.**

  *   **The Threshold:** The threshold is **Clause 3 (Absorption).** If a successor system inherits the complexity within a generation, the threshold is not crossed (Rome, Zhou, Angkor). If the complexity vanishes into a vacuum, the threshold is crossed (Maya, Norse, Chaco).
  *   **The Gradient:** Once the threshold is crossed, the *degree* of collapse is determined by **Demographic Persistence.**
      *   **High Severity:** Norse Greenland (Population extinct).
      *   **Medium Severity:** Terminal Classic Maya (Population persists, but political technology extinct and region depopulated).
      *   **Low Severity:** Late Bronze Age (Population persists, political technology lost in some nodes but recovered in others, network damaged but not annihilated).

  This accounts for your gut feeling. The Maya episode feels "worse" than the LBA because the *regional* vacuum was deeper, even if the *global* (hemispheric) impact of the LBA was larger. You are measuring the local intensity of the vacuum, not the total area affected.

  ### V. Summary of Structural Logic

  Your verdicts are not pattern-matching to narratives; they are consistently applying a **Functionalist-Trauma Model.**

  1.  **Continuity of Function > Continuity of Form:** Rome survives because the *function* of the state (tax/law) continues, even if the *form* (Emperor) changes.
  2.  **Trauma > Complexity Loss:** Harappan survives classification because the *process* was adaptive, not traumatic, even if *complexity* decreased.
  3.  **Vacuum > Change:** Maya collapses because the *ideological vacuum* was not filled, distinguishing it from cases where new elites simply co-opted old structures.

  **Final Recommendation:** Adopt the **Traumatic Institutional Vacuum** principle. It saves your Harappan and Rome verdicts while forcing you to correct Rapa Nui (which aligns with current archaeological consensus). It allows you to maintain that Maya is a "genuine" collapse without denying the persistence of Maya people, by locating the collapse in the *political technology* and the *demographic concentration*, not the ethnicity or culture.
