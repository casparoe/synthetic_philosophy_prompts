      *   *Claim 4: Electrons don't have intrinsic nature; they just are their relations.*
          *   **Fact Check:** This moves from *Epistemic* Structural Realism (we can't *know* the intrinsic nature) to *Ontic* Structural Realism (there *is* no intrinsic nature). The summary conflates these. This is a crucial distinction.
