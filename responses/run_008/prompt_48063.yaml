prompt: |-
  So I'm in a phil of mind course this semester and we just finished the unit on Frank Jackson's knowledge argument (the 1982 paper with Mary in the black and white room). Our final assignment is to construct our own thought experiment instead of just summarizing existing ones, and my TA explicitly warned that a lazy mirror-image case gets docked points because it can just beg the question. I've got an idea but I want you to actually build the thing properly.

  Here's the setup I want. Construct a thought experiment about a character I'll call Mario: he's had normal color vision his whole life, ordinary guy, no confinement chamber, no sci-fi gadgets — he can literally be someone you'd meet at a bus stop. But he has never learned a single physical fact about color or vision: no physics of light, no neuroscience, doesn't know wavelengths exist, nothing. The case should be built so that when Mario eventually studies up and learns ALL the physical facts about color vision, we can ask: does he gain the same kind of thing Mary gained when she walked out of her room, or something importantly different, or nothing at all? Constraints: keep the scenario itself to one paragraph, keep it fully realistic (no perfect memory stipulations, no demons), and — this is the big one — the case must not stipulate any verdict. The verdicts have to fall out of what the theories themselves say, not be baked into the story.

  After the scenario, walk through the following:

  1. What the ability hypothesis says Mario gains when he studies up (remember he ALREADY has whatever abilities come with seeing red, so think carefully about whether that view even has anything interesting to say here).
  2. What the old-fact-new-concept move (the phenomenal concept strategy) says about what Mario gains.
  3. What someone who sides with Jackson's original conclusion — that Mary gains genuinely new knowledge of nonphysical facts — should say about Mario. This is where I want the real work done: is the knowledge argument supposed to run symmetrically in reverse? If you accept that Mary gains new facts, are you committed to saying Mario gains new facts too when he learns neuroscience? And if the reverse case doesn't deliver that parallel, is that an objection to the original argument, or is there some principled reason the direction matters?

  Then tell me honestly which feature of the case is doing the work — is it just the reversal of which direction the information travels, or something else entirely? Also say what happens if you strip that feature out. And finally, sketch how a defender of Jackson's original conclusion would try to attack the case rather than accept its lesson, so I know what the strongest counter is.

  One more thing: please tell me how confident you are in the various claims you make (especially the bits about what each theory implies for the reverse direction, since that part isn't exactly standard textbook material), and single out the one point you're least sure about. My TA grades hard on people being overconfident about contested interpretive stuff, so flag where you're extrapolating beyond the standard presentations. thx!!
