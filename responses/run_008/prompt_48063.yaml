      *   **5. Jacksonian Counter-Attack:**
          *   Jackson might say this case is irrelevant to physicalism. Physicalism claims the *physical* story is the *whole* story. Mary tests if Physical $\to$ Total. Mario tests if Phenomenal $\to$ Total. Physicalism isn't threatened if Phenomenal $\nrightarrow$ Total.
          *   So, Mario learning physics and feeling "wow, that's what causes this" doesn't threaten physicalism. Mary learning physics and feeling "wow, there's more than this" *does*.

  4.  **Confidence Calibration (Crucial Step):**
      *   I need to be honest. Philosophical interpretation is contested.
      *   *High Confidence:* Ability Hypothesis & PCS applications (these are mechanical applications of the theories).
      *   *Medium Confidence:* The Jacksonian symmetry argument. While logical, some dualists might spin it differently.
