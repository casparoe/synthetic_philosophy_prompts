      *   *Refining for Constraints:* Ensure no "he realizes X" language. Keep it descriptive.
      *   *Final Polish:* Mario is a commercial painter who has distinguished shades of crimson and scarlet effortlessly since childhood, yet he believes colors are intrinsic properties of objects like weight or texture. He possesses no knowledge of wavelengths, cone cells, or neural processing. Over a year, he diligently studies optics and neurophysiology until he masters every physical fact regarding how light interacts with surfaces and how the human visual system processes that information. He now holds a complete physical theory of color vision in his head. When he next dips his brush into a pot of red paint, he possesses both his lifelong perceptual acquaintance with red and his newly acquired exhaustive physical knowledge. The question remains whether his understanding of the experience itself has changed.

  3.  **Analyzing the Theories (The "Meat"):**

      *   **1. The Ability Hypothesis (Lewis/Nemirow):**
          *   *Standard Mary Case:* Mary gains abilities (imagine, recognize).
          *   *Mario Case:* Mario *already* has the abilities (he sees red). He gains physical knowledge.
          *   *Implication:* The Ability Hypothesis says knowing *what it's like* is just having abilities. Mario already has them. So, when he learns physics, he gains *propositional* knowledge (physical facts), but he doesn't gain "phenomenal knowledge" because he already had the abilities.
          *   *Twist:* Does he gain a *new* ability? Maybe the ability to correlate physics with experience? But the core claim is that "knowing what it's like" = abilities. Since he had the experience, he had the knowledge. Learning physics adds physical info, not phenomenal info.
          *   *Confidence:* High. This is a standard application, but the reverse angle is slightly less discussed.

      *   **2. Phenomenal Concept Strategy (Old Fact/New Concept):**
          *   *Standard Mary Case:* Mary learns to deploy a new concept (phenomenal) for an old physical fact.
          *   *Mario Case:* Mario has the phenomenal concept (from experience). He learns the physical concept.
          *   *Implication:* He realizes the referent of his phenomenal concept *is* the referent of his physical concept. He gains a "mode of presentation" link. He doesn't learn a new fact about the world, but he learns a new identity statement (Experience Red = Neural State X).
          *   *Confidence:* High. This is the standard PCS move applied in reverse.

      *   **3. Jacksonian/Dualist Perspective (The Hard Part):**
          *   *Standard Mary Case:* Mary learns a new non-physical fact. Physicalism is false.
          *   *Mario Case:* If Mary learns a new fact coming *out* of the room, does Mario learn a new fact going *into* the physics?
          *   *Symmetry:* If physicalism is false because Mary learns something new, then Mario (who has the experience) learning physics shouldn't exhaust the truth about color. But Mario is learning the *physical* facts.
          *   *The Crucial Point:* Jackson argues Mary learns a *non-physical* fact. Mario already knows the non-physical fact (by experiencing it). When he learns physics, he learns *physical* facts.
          *   *Does he gain new knowledge?* He gains physical knowledge. Does he learn something about the *experience*? A Jacksonian might say: Mario already knew the phenomenal fact. Learning physics tells him about the *cause* of the fact, not the fact itself.
          *   *Asymmetry:* The Knowledge Argument relies on the claim that Physical Knowledge $\neq$ Total Knowledge. Mary has Physical, lacks Phenomenal. Mario has Phenomenal, lacks Physical.
          *   *Verdict:* A Jacksonian should say Mario *does not* learn a new fact about *what it is like* (he knew that). He learns facts about the *mechanism*. This highlights the asymmetry: Mary's gap shows physical info is incomplete. Mario's gap shows phenomenal info is incomplete (regarding mechanism).
          *   *Confidence:* Medium-High. This requires careful distinction between "facts about experience" and "facts about the brain."

      *   **4. Meta-Analysis (What feature is doing the work?):**
          *   It's not just direction. It's the *epistemic baseline*. Mary lacks the *phenomenal* baseline. Mario lacks the *physical* baseline.
