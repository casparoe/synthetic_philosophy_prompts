  5.  **Review against Constraints:**
      *   One paragraph scenario? Yes.
      *   Realistic? Yes.
      *   No stipulated verdict? Yes.
      *   Addressed all 3 theoretical points? Yes.
      *   Meta-analysis included? Yes.
      *   Confidence levels flagged? Yes.
      *   Least sure point identified? Yes.

  6.  **Final Polish:** Check tone (academic but accessible), ensure the "TA warning" about lazy mirror images is respected (by focusing on the epistemic asymmetry rather than just swapping room for bus stop). *Self-Correction:* Make sure I don't accidentally imply Mario learns something new in the scenario description. Keep it neutral.

      *Refining the Jacksonian section:* I need to be careful. If Jackson says "Physicalism is false because Mary learns a new fact," does he have to say Mario learns a new fact? No, because Mario is learning physical facts. The threat to physicalism comes from *exhaustiveness*. Mary shows Physical $\neq$ All. Mario shows Phenomenal $\neq$ All. Physicalism only cares about the first inequality. This is the key distinction. I will emphasize this.

      *Confidence Check:* I am least sure about how a *strict* Jacksonian (1982 version) vs. a *modern* Dualist would parse the "new fact" terminology in Mario's case. 1982 Jackson was a physicalist later, but the argument is used by dualists. I will frame it around the "Knowledge Argument" proponents generally.

      *Wait, one more check:* The prompt asks: "If you accept that Mary gains new facts, are you committed to saying Mario gains new facts too when he learns neuroscience?"
      *Answer:* No. Mary gains a *phenomenal* fact (which physicalism says shouldn't exist/is physical). Mario gains a *physical* fact (which everyone agrees exists). The commitment is only to the existence of the fact type, not the symmetry of acquisition. I need to make this very clear.

