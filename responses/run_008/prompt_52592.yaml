          3.  Analyze Helly R.'s resistance (Class struggle vs. ontological revolt).
          4.  Analyze Lumon's culture (religion, perks) vs. Marx's critique of ideology/compensation.
          5.  **Conclusion:** Judgment on whether *Severance* exposes a blind spot in Marx or if Marx explains the show completely. Evidence for each.
      *   **Tone:** Academic but accessible, critical, nuanced. Aimed at an essay on contemporary sci-fi and philosophy of labor.

  2.  **Deconstruct Task 1: The Four Species of Alienation:**
      *   *Marx:* 1. Product (worker doesn't own it), 2. Process (work is external/coercive), 3. Species-being (work isn't creative/human), 4. Other workers (competition/isolation).
      *   *Severance:*
          *   Product: Literally unknown. "Macrodata Refinement." It's not just that they don't own it; they don't *know* it. This radicalizes alienation from the product.
          *   Process: Highly controlled, surveillance, bells, perks. It's the ultimate externalization.
          *   Species-being: Innies have no life outside work. They *are* their labor. This inverts Marx. Marx says we lose our humanity *in* work because we have a life outside. Innies have *no* outside.
          *   Other Workers: They are isolated by the procedure (can't meet outside), but bonded by shared imprisonment.
      *   *Twist:* The show doesn't just illustrate alienation; it *ontologizes* it. It makes alienation a state of being, not just a relation to activity.

  3.  **Deconstruct Task 2: The Split & Voluntariness:**
      *   *Marx:* Alienation happens to a unified subject. The worker feels the pain.
      *   *Severance:* The "Outie" consents. The "Innie" suffers but didn't consent. The Outie sells the Innie's time.
      *   *Key Insight:* This looks like a hyper-commodification of the self. The self is split to manage pain (Mark's grief). Alienation becomes a *therapy*.
      *   *Consumer Product:* You buy severance to escape life. Marx thought we'd want to reclaim labor. Here, we want to escape consciousness. This suggests late-capitalist subjectivity is too painful to inhabit wholly.
      *   *Failure of Mapping:* Marx assumes the worker wants to reclaim their labor. The Outie wants to *disown* it. The Innie wants to reclaim a life they never had.

  4.  **Deconstruct Task 3: Helly R. and Resistance:**
      *   *Marx:* Proletariat revolts to reclaim means of production and their humanity.
      *   *Helly:* She is a "worker" created by the "means of production" (the chip). She has no "outside" to return to.
      *   *Key Insight:* Her revolt isn't for leisure; it's for *existence*. She demands recognition as a person, not just a worker.
      *   *Class Struggle?* It's more like a slave revolt or a civil rights struggle within a single body. It breaks the class analogy because the "capitalist" (Outie) and "worker" (Innie) share a biological substrate but distinct legal/phenomenological identities.
      *   *What is she fighting for?* Not the end of work, but the end of the *partition*.

  5.  **Deconstruct Task 4: Lumon Culture (Ideology):**
      *   *Marx:* Religion is the opium of the people. Ideology masks exploitation.
      *   *Lumon:* Kier Eagan is a literal deity. Perks (waffle party) are infantilizing.
      *   *Nuance:* It's not just masking; it's *constructing* reality. The innies have no context to compare against. It's not false consciousness; it's *no* consciousness of the alternative.
      *   *Satire:* It pushes Marx's critique to absurdity. If you strip meaning, you must manufacture liturgy to prevent insanity.

  6.  **Drafting - Section by Section (incorporating the "Resist the Obvious" constraint):**

      *   *Introduction:* Acknowledge the obvious fit (it looks like Marx), but state the thesis: *Severance* pushes alienation past an economic condition into an ontological one, revealing limits in Marx's humanism.
      *   *Section 1 (Four Species):* Go through them. Highlight the "Species-being" inversion. For Marx, work should express humanity. For Innies, work *is* their humanity. This dissolves the distinction between labor and life.
      *   *Section 2 (The Split/Consent):* Focus on the Outie/Innie contract. The Outie is the capitalist selling the Innie's labor. This turns alienation into a service. Marx couldn't foresee the self as a site of internal exploitation.
      *   *Section 3 (Helly/Resistance):* Helly isn't just a worker; she's a homunculus of capital. Her resistance is existential. It challenges the definition of "worker."
      *   *Section 4 (Lumon/Ideology):* Kier as God. The perks as pacification. It illustrates Marx but adds the dimension of *corporate theocracy* replacing civil society.
      *   *Conclusion:* The Judgment. Does it expose a blind spot? Yes. Marx assumes a unified subject seeking wholeness. *Severance* presents a fragmented subject seeking separation. The blind spot is the *desire for alienation*.

  7.  **Refining and Polishing:**
      *   *Check Tone:* Ensure it sounds like a philosophical inquiry, not a recap. Use terms like "ontological," "phenomenological," "reification."
      *   *Check Constraints:* Did I resist the obvious mapping? Yes, by emphasizing where the show diverges (the voluntary nature, the split self).
