  Arthur, a mediocre executive, uses the ring to invisibly sabotage rivals, manipulate market algorithms, and subtly coerce his partner's affection, thereby securing the CEO title, billions in assets, and a devoted marriage without detection or moral qualm. He achieves every external metric Glaucon prizes, yet he is worse off by his own pre-ring standards because the specific goods he sought—professional *authority*, romantic *love*, and personal *status*—are constitutively dependent on the independent agency of others, which his invisible interventions bypass. Arthur possesses the compliance of subordinates and the presence of a spouse, but because he knows these outcomes were manufactured rather than elicited through competence or mutual attraction, he cannot interpret them as evidence of his own worth, leaving him with the hollow shell of success that fails to satisfy the very desire for recognition that motivated his injustice.

  **Demonstration of Specification**
  The cost arises step-by-step from the mechanics of the scenario: (1) Arthur's goal is not merely material wealth but *status* and *power*, which are social goods; (2) social goods derive their value from the fact that they are granted by other free agents; (3) the ring removes the freedom of those agents by invisibly coercing their compliance; (4) therefore, the resulting compliance is not a grant of status but a physical inevitability, like a rock falling; (5) Arthur, knowing this, recognizes that he has not achieved *status* but only its simulation. The single feature doing the work is **the constitutive dependency of social goods on resistance**. Social power is defined as the ability to overcome the wills of others; if the will is bypassed rather than overcome, the good "power" is not instantiated, only the good "control." If this feature is removed—i.e., if Arthur achieves his position through open competition where rivals *could* have defeated him—then the resulting status is real, and he is better off. The cost is not moral guilt (which is stipulated away) but a prudential failure to secure the actual object of desire due to the method of acquisition.

  **Glaucon's Objection and Assessment**
  Glaucon's strongest objection is that the case builds in a cost the ring-bearer never agreed to count: "Arthur claims he wanted *power*, but what any rational agent actually wants are the *benefits* power brings (security, luxury, sex). If he has the benefits, he has the good, and defining 'power' as requiring resistance is merely a moralistic fetish for 'fair play' that a true hedonist would discard."

  This objection succeeds only if one accepts a purely instrumental view of social goods. However, it fails if human satisfaction is reflexive—that is, if the enjoyment of a good depends on believing one *deserves* or *earned* it. Since Arthur knows he did not earn it, the psychological benefit (pride, security in one's own competence) is nullified. Glaucon assumes the "goods" are external objects to be consumed; the counterexample shows that for a modern agent, the "goods" are often relational states that dissolve when the relation is rigged. Thus, the ring-bearer is worse off not because he is punished, but because the ring renders the prize he sought logically impossible to win.
