  ### The Triage Threshold

  **Scenario**
  A field hospital following an earthquake holds ten patients and a fixed stock of 100mg morphine equivalents. One patient (Severe) has crush injuries yielding a baseline pain score of 10/10; nine patients (Moderate) have fractures yielding a baseline of 4/10. Clinical data establishes a linear dose-response: 1mg reduces pain by 0.1 points for any patient. A "Functional Threshold" exists at pain level 6/10; above this, pain precludes sleep, appetite, or positive experience (zero pleasure capacity), while below it, patients regain capacity for enjoyment proportional to relief. You must choose between two protocols: **Plan A** concentrates the entire stock on the nine Moderate patients, leaving the Severe patient untreated; **Plan B** administers just enough to the Severe patient to drop them to 5.9/10, distributing the remainder among the Moderate patients.

  ***

  ### Theoretical Verdicts

  **1. Classical Hedonic Utilitarianism (CHU): Prefers Plan A**
  CHU sums net welfare (Pleasure minus Pain). Because the total morphine stock and baseline pain scores are fixed, and efficacy is linear, the **aggregate suffering is identical** in both plans (Total Pain = Total Baseline − Total Relief). The verdict therefore rests entirely on the pleasure calculus. In Plan A, the Severe patient remains at 10/10 (zero pleasure), but the nine Moderate patients drop to 3/10, maximizing their capacity for sleep and conversation. In Plan B, the Severe patient rises to 5.9/10 (gaining some pleasure), but the nine Moderate patients remain at higher pain levels (approx. 3.4/10), significantly dampening their recovery enjoyment. CHU calculates that the aggregate pleasure gain of the nine outweighs the pleasure gain of the one, endorsing the plan that leaves one person in agony.

  **2. Aggregative Negative Utilitarianism (ANU): Indifferent**
  ANU sums suffering only, ignoring pleasure. As established, the structural constraints (fixed resource, linear efficacy, fixed baselines) ensure that the sum of suffering is mathematically invariant across distributions.
  *Arithmetic:* $\sum \text{Pain} = \sum (\text{Baseline} - \text{Relief}) = \sum \text{Baseline} - \sum \text{Relief}$.
  Since $\sum \text{Baseline}$ (46 points) and $\sum \text{Relief}$ (100mg $\times$ efficacy) are constant regardless of allocation, $\sum \text{Pain}$ is constant (36 points). ANU has no grounds to prefer one distribution over the other; the tie is a necessary consequence of the linearity assumption.

  **3. Lexical Threshold Negative Utilitarianism (LTNU): Prefers Plan B**
  LTNU posits that suffering above the Functional Threshold (6/10) is lexically worse than any amount of suffering below it. In Plan A, the Severe patient suffers at 10/10, crossing the lexical threshold. In Plan B, all ten patients remain below 6/10. Even though aggregate suffering is identical, LTNU forbids the trade-off that pushes one individual into the "forbidden zone" of agony, regardless of the pleasure benefits to the majority. The threshold acts as a side-constraint on aggregation, prioritizing the severity of the worst-off over the sum of the rest.

  ***

  ### Structural Analysis and Sensitivity Checks

  **Structural Features**
  The case works by decoupling *aggregate* metrics from *distributional* metrics. The ANU tie relies on the **linearity of relief**; if relief were non-linear, the sum would change. The CHU verdict relies on the **non-linearity of pleasure** (the threshold effect on capacity). The LTNU verdict relies on the **lexical priority of the threshold**. The conflict arises because CHU aggregates pleasure across the threshold, while LTNU treats the threshold as a moral cliff.

  **Sensitivity Checks**
  *   **(a) Majority Nudged Above Threshold:** If the Moderate patients' untreated pain were 7/10, Plan A would push all ten patients above the threshold. LTNU would still prefer Plan B (fewer people above threshold, or lower peak severity), but the "lexical" distinction might blur if both plans violate the threshold for everyone. If Plan B can bring *everyone* below while Plan A cannot, LTNU's verdict strengthens.
  *   **(b) Non-Linear Efficacy:** If morphine has diminishing returns (e.g., the first 10mg helps more than the last), the total suffering would no longer be tied. Plan B (concentrating on the Severe patient) might yield less total relief than Plan A. ANU would then prefer Plan A (less total pain), aligning with CHU against LTNU. This shows LTNU is robust only when the cost of avoiding the threshold is not an increase in total suffering.
  *   **(c) The Classical Reductio:** If the Severe minority is reduced to one person and their untreated suffering is made catastrophic (e.g., torture-level), while the Moderate majority is expanded to a million, Plan A (violating the threshold) might prevent mild headaches for a million people. LTNU still forbids Plan A. This replicates the "world-destruction" objection at a clinical scale: LTNU prioritizes the one person's threshold violation over the aggregate welfare of the many, which critics argue is counterintuitive in ordinary triage.

  ***

  ### Counterattacks and Conclusion

  **The Utilitarian Counterattack**
  The Classical Utilitarian argues the threshold is **arbitrary**. Why is pain at 6.0 lexically different from 5.9? Biologically, capacity for pleasure degrades continuously, not in a step-function. Drawing a bright line creates a "cliff-edge" effect where a microscopic increase in pain justifies sacrificing massive amounts of welfare, which seems irrational in resource allocation.

  **The Aggregative NU Counterattack**
  The Plain Negative Utilitarian argues the **tie is artificial**. In reality, suffering is likely convex (marginal disutility increases with intensity). If so, concentrating relief on the worst-off (Plan B) usually reduces *total* suffering more than spreading it. By forcing a tie via linearity, the thought experiment hides the fact that LTNU and ANU often agree in practice.

  **The Threshold Theorist's Reply**
  The LTNU proponent replies that the threshold is not arbitrary but **phenomenologically real**. The shift from "painful but manageable" to "pain that destroys the self" is a phase shift in moral status, akin to the difference between injury and death. They argue that allowing the threshold to be traded away for aggregate gain treats persons as mere containers for utility rather than beings with a right to a minimum functional integrity.

  **Conclusion**
  This case demonstrates that the lexical threshold **does genuine moral work** in ordinary distributive choice, not just apocalyptic cases. It flips the verdict against both CHU and ANU in a realistic triage scenario. However, this work comes at a high cost: it requires accepting that preventing one person from crossing a severity line is more important than maximizing the recovery of nine others, even when total suffering is unchanged. The threshold saves the view from the "pinprick" reductio by grounding it in clinical reality, but it inherits the "fanaticism" objection: it demands we prioritize the severity of the worst-off even when the aggregate cost to the majority is significant. The threshold is not an artifact of the setup, but it functions as a rigid constraint that may be too inflexible for practical medical ethics.
