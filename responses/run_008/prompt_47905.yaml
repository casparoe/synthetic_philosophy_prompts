          *   (4) Theo: "Experience prior to report" is an inaccessible posit/Cartesian Theater; his view is the only empirically respectable one.
      *   **Task:** Go through the four moves in order, evaluate who is right at *each step* (not just overall), and identify what *both* are missing.
      *   **Constraint:** The user wants a referee judgment. I need to be precise about Dennett's actual position and the philosophical implications.

  2.  **Deconstruct the Moves:**

