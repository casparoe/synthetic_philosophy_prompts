  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Participants:** Two philosophers of mind.
          *   Philosopher A: Higher-Order Theorist (HOT/HOP) in the Rosenthal/Lycan tradition. (Consciousness requires a higher-order representation of the state).
          *   Philosopher B: First-Order Representationalist (FOR) in the Tye/Dretske tradition. (Consciousness requires poised/available content, no monitoring needed).
      *   **History:** Argued for a decade, trading counterexamples neither accepts.
      *   **Task:** Write a *joint statement* produced after a year-long good-faith adversarial collaboration.
      *   **Required Components:**
          1.  Numbered section of agreed claims (explananda, reading of dissociations, confused objections).
          2.  Table of residual disagreements (faithfully phrased).
          3.  Cruxes (subquestions where settling one moves a side). Must include: Metacognition literature interpretation & Misrepresentation worry.
          4.  For each crux: A concrete experiment/argument bearing on it, with pre-registered predictions from both sides.
          5.  Verbal dispute check: Identify if any portion is merely verbal.
      *   **Constraint:** Do not adjudicate who is right. The goal is precision in disagreement, not resolution.

  2.  **Deconstruct the Philosophical Positions:**
      *   **HOT (Rosenthal/Lycan):** Consciousness is extrinsic to the mental state. A state is conscious *because* it is targeted by a HOT. Without the HOT, the state is unconscious (mental but not conscious). Key issue: Misrepresentation (targetless HOTs, wrong content HOTs). Key issue: Distinction between consciousness and *awareness of* consciousness (metacognition).
      *   **FOR (Tye/Dretske):** Consciousness is intrinsic to the representational state (given functional role/poisedness). A state is conscious if it represents the world and is available for reasoning/report. Key issue: Unconscious perception (does it have content? is it poised?). Key issue: Over-intellectualization (does a baby/cat need a concept of mental states to have a conscious pain?).

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Explananda:* Both agree we are explaining "phenomenal consciousness" (what it's like), not just access or report. Both agree representation is key (it's not qualia realism in the non-representational sense).
      *   *Dissociations:* Blindsight, masking, etc. Both agree these show a dissociation between sensory processing and *something else*. They disagree on what that "something else" is (HOT vs. Poisedness), but agree the data is real.
      *   *Confused Objections:* "Homunculus" objections (both deny a little man inside). "Infinite Regress" (both have standard replies they accept as sufficient for now). "Zombie" arguments (both are naturalists/physicalists, so they bracket metaphysical possibility claims that violate physicalism).

  4.  **Drafting Section 2: Residual Disagreements (Table):**
      *   Need to phrase these neutrally but accurately.
      *   *Core Disagreement:* Is the higher-order state *constitutive* of consciousness or merely *evidential*?
      *   *Creature Consciousness:* Do animals/infants have HOTs?
      *   *Transitivity:* Is consciousness essentially transitive (conscious *of* the state)?

  5.  **Drafting Section 3 & 4: Cruxes and Experiments:**
      *   *Crux 1: Metacognition.* Does Type-2 SDT measure the HOT itself or just a downstream report?
          *   *HOT View:* It measures the mechanism that *makes* consciousness possible (or is identical to it).
          *   *FOR View:* It measures a separate monitoring system that operates *on* conscious states.
          *   *Experiment:* Subliminal priming with confidence ratings.
      *   *Crux 2: Misrepresentation.* The "Targetless HOT" or "Wrong Content HOT" case.
          *   *HOT View:* If HOT says "Red" but V1 says "Orange", experience is Red (phenomenology follows HOT).
          *   *FOR View:* Experience is Orange (phenomenology follows First-Order content).
          *   *Experiment/Case:* Induced hallucination or change blindness where first-order content and metacognitive report diverge.
      *   *Crux 3 (Optional but good):* The "Hard" Dissociation. Is there unconscious perception that is *qualitatively identical* to conscious perception except for the HOT?
          *   *Experiment:* Masking thresholds vs. confidence thresholds.

  6.  **Drafting Section 5: Verbal Dispute Check:**
      *   Is "Conscious" used differently?
      *   HOT defines "Conscious State" = State + HOT.
      *   FOR defines "Conscious State" = State + Poisedness.
      *   They might agree on the *phenomenology* but disagree on the *ontology*.
      *   *Verbal Element:* The term "Conscious Perception." FOR calls blindsight "unconscious perception." HOT calls normal perception "conscious" only when monitored. But is there a deeper disagreement? Yes, about the *nature* of the phenomenology itself. It's not *merely* verbal, but there is a terminological overlap that obscures the ontological split.

  7.  **Refining the Tone:**
      *   Must sound like a collaborative academic document.
      *   Respectful, precise, acknowledging the decade of stalemate.
      *   Avoid "we concluded X is true." Use "we agree that..." or "we disagree on..."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the misrepresentation crux specifically regarding Orange/Red? *Adjustment:* Ensure Crux 2 explicitly mentions the content mismatch scenario.
      *   *Check:* Did I include the metacognition crux? *Adjustment:* Ensure Crux 1 focuses on whether metacognitive tasks measure the constitutive mechanism.
      *   *Check:* Is the "Verbal Dispute" section nuanced? *Adjustment:* Don't dismiss the whole thing as verbal. Acknowledge that while definitions differ, they map onto different ontological commitments.
      *   *Check:* Are the predictions specific? *Adjustment:* Make sure the "Pre-registered Predictions" are distinct for HOT and FOR.

  9.  **Final Polish:** Check formatting (numbered lists, tables, clear headings). Ensure the voices sound like analytic philosophers (precise, careful distinctions). (Self-correction: Ensure Rosenthal/Lycan specifics are honored—e.g., non-inferential HOTs—and Tye/Dretske specifics—e.g., PANIC theory or poisedness).

  10. **Final Output Generation** (Proceeding to generate the response based on these steps).
answer: |-
  # Joint Statement of Adversarial Collaboration on the Representational Structure of Consciousness

  **Participants:**
  *   **Dr. H. (Higher-Order Theorist):** Advocating the view that a mental state is conscious only if it is the object of a suitable higher-order representation (HOR), following the tradition of Rosenthal and Lycan.
  *   **Dr. F. (First-Order Representationalist):** Advocating the view that a perceptual state is conscious in virtue of its first-order representational content playing a specific functional role (poisedness/availability), following the tradition of Tye and Dretske.

  **Date:** October 24, 2023
  **Duration of Collaboration:** 12 Months

  ## Preamble
  For a decade, our respective positions have been defined by a stalemate of intuitions. Dr. H. has argued that without a higher-order awareness, a state is merely mental, not conscious. Dr. F. has argued that requiring such awareness over-intellectualizes consciousness and misidentifies the phenomenology. We have convened this working group to move beyond trading counterexamples that each side dismisses as question-begging. This document does not resolve our dispute. Rather, it isolates the precise points of divergence, distinguishes substantive disagreements from verbal confusion, and identifies empirical or argumentative cruxes that could theoretically shift the dialectic.

  ---

  ## 1. Areas of Agreement

  We affirm the following claims as a shared foundation for our ongoing debate:

  1.  **The Explanandum:** We agree that the primary target of explanation is *phenomenal consciousness* (what it is like for the subject), not merely *access consciousness* (availability for report/reasoning), though we disagree on the dependency relation between the two. We both reject non-naturalistic qualia realism; phenomenology must be explained in terms of representational or functional properties.
  2.  **Naturalism:** We both assume a physicalist framework. Consciousness is a natural phenomenon supervenient on neural processes. Appeals to metaphysical zombies are treated as heuristic devices, not proof of non-physicalism.
  3.  **Interpretation of Dissociations (Blindsight, Masking, Inattentional Blindness):** We agree that these phenomena demonstrate a dissociation between *sensory processing* and *conscious awareness*.
      *   We agree that in blindsight, there is visual processing without conscious vision.
      *   We agree that in normal vision, there is conscious vision.
      *   *Disagreement Note:* We disagree on what is missing in blindsight (a HOR vs. functional poisedness), but we agree the behavioral and neural dissociation is real and must be accommodated.
  4.  **Rejected Objections:** We agree that the following standard objections are confused or insufficient to refute either view in isolation:
      *   **The Homunculus Objection:** Neither view posits a "little man" inside the head viewing the representations. The "scanning" or "monitoring" is sub-personal.
      *   **The Infinite Regress:** We agree that standard replies (the HOR need not be conscious) suffice to block the regress objection for the purposes of this dialectic.
      *   **The "Richness" Objection:** The claim that phenomenology is too rich for conceptual HOTs is noted, but we agree it relies on contested assumptions about the granularity of non-conceptual content in HORs.

  ---

  ## 2. Table of Residual Disagreements

  The following table outlines the core ontological and structural disagreements. Each statement is phrased to be acceptable to the proponent of that view as a faithful characterization of their position.

  | Feature of the Dispute | Dr. H. (Higher-Order) Position | Dr. F. (First-Order) Position |
  | :--- | :--- | :--- |
  | **Constitutive Mechanism** | A state's being conscious is *constituted* by the subject's awareness of that state. No awareness of the state, no consciousness. | A state's being conscious is *constituted* by the state's content being poised for global control. Awareness of the state is a consequence, not a cause. |
  | **Transitivity** | Consciousness is essentially transitive: To be in a conscious state is to be conscious *of* being in that state. | Consciousness is not essentially transitive: One can be in a conscious state of red without being conscious *of the experience* of red. |
  | **Animal/Infant Consciousness** | Creatures lacking the cognitive capacity for higher-order representation (e.g., certain mammals, infants) likely have unconscious mental states, or a primitive form of HOR. | Creatures capable of guided behavior via perceptual content possess conscious states, regardless of metacognitive capacity. |
  | **The "Gap"** | There is a possible gap between having a sensory state and its being conscious. This gap is bridged by the HOR. | There is no gap. If the sensory state is sufficiently poised, it is *ipso facto* conscious. |
  | **Metacognition** | Metacognitive tasks (confidence ratings) probe the very mechanism that renders states conscious. | Metacognitive tasks probe a separate monitoring system that operates *downstream* of consciousness. |

  ---

  ## 3. Cruxes and Pre-Registered Predictions

  We have identified three specific cruxes. Settling these would not necessarily prove one theory true, but would force a significant revision or concession from one side. For each crux, we propose a specific test case (empirical or thought experiment) and record our divergent predictions.

  ### Crux 1: The Metacognitive Measure
  **Question:** Does the literature on metacognition (Type-2 Signal Detection, confidence ratings) measure the *constitutive mechanism* of consciousness (HOR) or a *downstream monitor*?

  *   **The Issue:** Dr. H. argues that the neural correlates of confidence ratings are the best candidates for the HOR that makes perception conscious. Dr. F. argues these are distinct systems; one can have confidence about a conscious state, but the confidence is not what makes it conscious.
  *   **Test Case:** **Subliminal Confidence Priming.**
      *   *Setup:* Subjects perform a visual discrimination task at threshold. We manipulate "metacognitive noise" independently of "sensory noise" using TMS over prefrontal cortex (PFC) vs. occipital cortex.
      *   *Measure:* We look for trials where sensory performance (d') is held constant, but metacognitive efficiency (meta-d') is disrupted.
  *   **Pre-Registered Predictions:**
      *   **Dr. H. Prediction:** Disrupting PFC (metacognition) will reduce *phenomenal consciousness* reports (e.g., PAS scores) even if d' remains stable. If the HOR is disrupted, the state ceases to be conscious, even if first-order processing remains intact.
      *   **Dr. F. Prediction:** Disrupting PFC will reduce confidence accuracy but leave *phenomenal consciousness* reports (PAS) intact. The subject will report "seeing clearly" but be unable to accurately judge their accuracy. Consciousness (poised first-order content) remains; the monitor is broken.

  ### Crux 2: The Misrepresentation Worry (Content Mismatch)
  **Question:** In cases where the Higher-Order Representation misrepresents the First-Order State, which content determines the phenomenology?

  *   **The Issue:** Dr. H. accepts that if a HOT represents a state as "Red" when the First-Order state is "Orange," the subject experiences Red (phenomenology follows the HOR). Dr. F. argues this is implausible; phenomenology must follow the First-Order content. Dr. F. worries their own view faces an analogous problem regarding "poisedness" (can a state feel conscious if it isn't actually poised?), but believes it is less severe.
  *   **Test Case:** **Induced Content Dissociation (Thought Experiment/Empirical Proxy).**
      *   *Setup:* A scenario (or neural intervention) where V1 activity encodes specific feature X (e.g., motion), but higher-order areas are causally manipulated to represent feature Y (e.g., color) as the object of awareness, without the subject inferring this.
      *   *Measure:* Subjective report of "What is it like?"
  *   **Pre-Registered Predictions:**
      *   **Dr. H. Prediction:** The subject will report phenomenology corresponding to Y (the HOR content). If the brain represents the state as "seeing color," the subject experiences color, even if the sensory input was motion. The HOR determines the "what it is like."
      *   **Dr. F. Prediction:** The subject will report phenomenology corresponding to X (the First-Order content) or report confusion/noise. If the First-Order system does not represent color, there is no color phenomenology, regardless of what the monitoring system "says."
      *   *Note on F's Analogous Worry:* Dr. F admits that if "poisedness" comes apart from "felt consciousness," their view is in trouble. Dr. F predicts these will never come apart empirically. Dr. H. predicts they can.

  ### Crux 3: The "Targetless" State
  **Question:** Can a Higher-Order Representation exist without a target First-Order state, and if so, is there consciousness?

  *   **The Issue:** Rosenthal admits "targetless HOTs" yield a state of *seeming* to be conscious without actually being in the mental state (e.g., thinking one is in pain when one is not). Dr. F. argues this collapses the distinction between being conscious and thinking one is conscious, rendering the theory unstable.
  *   **Test Case:** **Phantom Limb / Hallucination Analysis.**
      *   *Setup:* Analysis of reports in phantom limb pain or drug-induced hallucinations where peripheral input is absent.
      *   *Measure:* Whether the subject distinguishes between "I am feeling pain" and "It seems I am feeling pain."
  *   **Pre-Registered Predictions:**
      *   **Dr. H. Prediction:** In targetless cases, the subject cannot distinguish the state from a veridical conscious state from the inside. The phenomenology is identical. This confirms that consciousness is a property of the HOR, not the relation to the target.
      *   **Dr. F. Prediction:** Subjects can often distinguish these cases (e.g., "this pain feels unreal" or "ghostly"). This suggests that without a proper First-Order representational anchor, the "poisedness" is defective, and the phenomenology is qualitatively different.

  ---

  ## 4. Assessment of Verbal Dispute

  We have analyzed whether our disagreement is merely verbal. We conclude the following:

  1.  **Terminological Overlap:** There is a verbal component regarding the phrase **"Conscious Perception."**
      *   **Dr. F.** uses this to mean "First-order representational state that is poised."
      *   **Dr. H.** uses this to mean "First-order state + Higher-Order Awareness."
      *   *Resolution:* We agree to use **"Phenomenal State"** to refer to the *what-it-is-likeness* itself, and reserve **"Conscious"** for the property being theorized.

  2.  **Substantive Core:** The dispute is **not merely verbal**. Even if we standardize terminology, we disagree on the *ontology* of the phenomenal state.
      *   If Dr. H. is right, a creature with perfect poisedness but no HOR is a "philosophical zombie" regarding perception (it acts awake but experiences nothing).
      *   If Dr. F. is right, a creature with HOR but no poisedness (e.g., a targetless HOT) has a deluded phenomenology, not a genuine perceptual consciousness.
      *   *Why it matters:* This dictates where we look for the Neural Correlates of Consciousness (NCC). Dr. H. looks posterior-anterior (monitoring networks); Dr. F. looks posterior (sensory networks).

  3.  **The "Awareness" Ambiguity:** We identified a source of confusion in the term **"Awareness."**
      *   Dr. H. treats awareness of the state as *constitutive* of the state's consciousness.
      *   Dr. F. treats awareness of the state as *evidential* of the state's consciousness.
      *   *Agreement:* We acknowledge that much of our past decade of arguing past each other stemmed from Dr. H. interpreting Dr. F.'s "availability for report" as a higher-order monitoring state, while Dr. F. interpreted Dr. H.'s "HOT" as a mere introspective judgment. We now agree these are distinct constructs, but we still disagree on which one maps onto phenomenology.

  ## 5. Conclusion

  We sign this statement acknowledging that our theories are empirically distinguishable in principle, though current data remains ambiguous due to the reliance on self-report. We commit to designing future experiments based on the pre-registered predictions in Section 3, accepting that a robust confirmation of the **Metacognitive Measure** predictions (Crux 1) would be the most decisive factor in moving the dialectic forward.

  **Signed,**

  _________________________
  **Dr. H.** (Higher-Order Theorist)

  _________________________
  **Dr. F.** (First-Order Representationalist)
