  **City's Entire Dining Scene Collapses Into Four-Hour Queue Outside Mediocre Taco Truck**

  MIDDLETON—The once-diverse Restaurant Row has been reduced to a single, serpentine queue outside "Tacos El Probable," where locals wait up to four hours for lukewarm al pastor based entirely on the congested sinuses of one early patron.

  The cascade began last Tuesday when local accountant Dave Miller, suffering from a severe head cold that obliterated his sense of taste, entered the truck simply because it was open. When the second arrival, Sarah Jenkins, saw Miller eating there, she suppressed her own private signal—that the truck looked sketchy—and inferred Miller possessed superior information. She joined the line. By noon, the third diner faced a choice: trust his own skepticism or trust the aggregated choice of two predecessors. Rational calculation dictated that the probability of two people being wrong was lower than the probability of his own hunch being right. He joined.

  By Friday, the line wrapped around the block. No new information regarding food quality had been added since Miller's cold-induced lunch, yet every subsequent diner acted as if the queue itself was proof of excellence.

  "It's mindless conformity," said Dr. Elena Rosetti, a behavioral economist observing the crowd. "People are ignoring their own senses to mimic others. It's a classic failure of individual judgment."

  Prof. Alan Sterling, a game theorist, scoffed while adjusting his tie. "There is no irrationality here. Each person is performing a flawless cost-benefit analysis. They know their private signal is noisy. The public history of choices looks like hard data. They are valuing the crowd's revealed preference over their own intuition. Every single person in that line is behaving exactly as a rational agent should."

  The fragility of the equilibrium was exposed at 6:00 PM when renowned food critic Julian Prufrock arrived. Prufrock, possessing a high-precision private signal, glanced at the hundred-person queue, sniffed the air, and walked directly into the empty sushi restaurant next door.

  The crowd watched. For the diners still waiting, Prufrock's action carried more weight than the previous six hours of line-building. If an expert ignored the queue, the queue's value as an information signal dropped to zero. Realizing that everyone ahead of them was also acting on obsolete data, the line evaporated instantly. Twenty people left immediately; the rest fled upon seeing others leave.

  By Saturday morning, the taco truck was empty. No one had learned anything about the tacos. The city's collective knowledge had not been updated, merely overwritten.

  "I still don't know if they're good," said Miller, who had started it all. "But I hear the sushi next door is great."
