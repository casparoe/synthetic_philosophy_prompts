answer: |-
  - "The verdict"
  Your friend got the big historical beats and the independence result correct, but he tripped over the technical definitions and the sociology of the math community. He mixed up "well-ordered" with "countable," misunderstood why Banach-Tarski isn't a contradiction, and vastly overstated how many mathematicians reject the axiom.

  - "Claim by claim"

  **"The axiom of choice says that if you have any collection of sets, you can always pick one element out of each one."**
  *Verdict: Close, but missing a crucial condition.*
  Technically, the collection must be a collection of **non-empty** sets. If one of the sets is empty, you can't pick an element from it, so the statement would be false. Also, to be precise, the axiom guarantees the existence of a "choice function" that makes all these selections simultaneously. For a finite number of sets, you can prove this using standard logic induction, but for infinite collections, you need the axiom to assert that the function exists even if you can't describe *how* to pick the elements.

  **"For a finite collection that's obvious, and it's basically uncontroversial for countably infinite collections too — the axiom is really only about the weird uncountable ones."**
  *Verdict: Technically wrong, though socially understandable.*
  This is a very common misconception. In strict set theory (ZF without Choice), you cannot prove you can make choices for a countably infinite collection of arbitrary sets. That requires the "Axiom of Countable Choice," which is weaker than the full Axiom of Choice but still independent of the standard axioms. However, your friend is reflecting a common sentiment: many mathematicians who hesitate to use the full Axiom of Choice will still happily use Countable Choice because it feels more constructive. So, while it's not provable without an axiom, it is less "controversial" in practice than the uncountable version.

  **"It's equivalent to the well-ordering theorem, which says any set can be written out as a list, first element, second element, and so on, even if the set is bigger than the naturals."**
  *Verdict: Half right, half wrong.*
  It is true that the Axiom of Choice is equivalent to the Well-Ordering Theorem. However, his description of well-ordering is wrong. A well-ordering means every subset has a "least" element, not that you can list them $1, 2, 3 \dots$ like the naturals. You cannot list an uncountable set using natural numbers; that's the definition of uncountable. Instead, a well-ordering on an uncountable set uses "ordinal numbers" that go far beyond infinity. You can imagine it as a list that is so long it never ends, but even after you finish all the natural numbers, the list keeps going with new kinds of indices. You can't write it down sequentially in time, but the structure exists.

  **"In 1924 Banach and Tarski used the axiom to prove you can cut a ball into five pieces and rearrange them into two balls each the same size as the original, which is basically a proof that the axiom contradicts the laws of volume."**
  *Verdict: Right result, wrong conclusion.*
  The historical fact is correct: Banach-Tarski uses the Axiom of Choice and involves a finite decomposition (5 pieces is the minimum for the paradoxical part). However, it does not contradict the laws of volume. It proves that you cannot define "volume" for every possible subset of 3D space. The pieces created in the proof are "non-measurable," meaning the concept of volume simply does not apply to them. It's not that volume is broken; it's that those specific shapes don't have a volume to begin with.

  **"Later Gödel and Cohen proved the axiom can't be shown true or false from the other axioms, so at this point it's basically a religion — you just take it on faith."**
  *Verdict: Correct.*
  Kurt Gödel proved in 1938 that the Axiom of Choice is consistent with the other axioms (you can't prove it false), and Paul Cohen proved in 1963 that it is independent (you can't prove it true). Calling it a "religion" is dramatic flair, but logically accurate: within standard set theory, you must choose whether to include it or not. Neither choice leads to a contradiction.

  **"Most working mathematicians refuse to assume it because of Banach-Tarski."**
  *Verdict: False.*
  This is the biggest error in his summary. The vast majority of working mathematicians operate in ZFC (Zermelo-Fraenkel set theory **with** Choice). It is the standard foundation for analysis, topology, and algebra. Banach-Tarski is viewed as a curious consequence of dealing with infinite, non-constructive objects, not a reason to discard the axiom. There is a minority school called "constructivism" that rejects it, but they are the exception, not the rule.

  - "Banach-Tarski, fixed"

  To understand why Banach-Tarski isn't a contradiction, you need to separate "shape" from "measure." In calculus, you integrate over intervals or regions that are "nice." We assume every shape has a volume, but set theory reveals that if you accept the Axiom of Choice, you can construct sets that are too jagged, too scattered, and too wild to have a volume assigned to them consistently.

  Think of volume as a function that assigns a number to a set. We want this function to satisfy certain rules: if you move a set, its volume doesn't change; if you combine disjoint sets, their volumes add up. Banach-Tarski shows that if you want to keep the Axiom of Choice, you cannot have a volume function that works for **every** subset of space. The pieces used in the paradox are non-measurable sets. They are mathematical ghosts—they exist as collections of points, but they don't have a size. So when you rearrange them, you aren't doubling the volume; you are rearranging pieces that never had a volume to begin with. It's a proof that "volume" has limits, not that space is broken.

  - "What would change my mind"

  My judgment on the claim that "most working mathematicians refuse to assume it" is the least certain, solely because it depends on how you define "working mathematician." I am evaluating this based on mainstream fields like analysis, topology, and algebra, where ZFC is the default. However, if your friend was specifically referring to fields like constructive analysis, computer science verification, or certain branches of logic, the sentiment might be more accurate. If you showed me data that a majority of published papers in specific subfields explicitly avoid AC due to philosophical objections regarding Banach-Tarski, I would adjust the verdict on that specific claim. But in the broad context of general mathematics, the consensus is firmly pro-Choice.
