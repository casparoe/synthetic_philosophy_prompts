prompt: |-
  So I'm writing a dissertaion prospectus and want a second pair of eyes on the framing before I commit a year to this thing. My half-formed idea: everyone agrees the meta-problem of consciousness (roughly: explain, in third-person terms, why we make the reports and judgements about consciousness that we do) is interesting, but people disagree wildly about what a solution would actually *do*. Some people hint it would dissolve the hard problem's motivation, the illusionists think it's basically the whole game, and some dualists seem to think its just cognitive science with no philosophical payoff either way. My suspicion is that all of this quietly turns on a prior question that nobody in that literature states out loud: when does giving the etiology of an intuition debunk it, rather than merely explain it? We have genealogies for mathematical intuitions, moral intuitions, religious experience, and so on, and we don't usually think that explaining where they come from defeats them. So the prospectus question would be something like: under what conditions does an etiological explanation of a seeming undermine its evidential status, and do the intuitions that generate the hard problem meet those conditions?

  Turn this into an actual prospectus for me. State the question precisely enough that it has a determinate answer, explain why the existing positions (on the meta-problem, and on debunking arguments generally) leave it open, lay out the method — what I'd actually do, chapter by chapter or quarter by quarter — and say what the possible conclusions are and which considerations would decide between them. Also be honest about what would count as the project failing, including the real risk that the debunking question is too big on its own and I end up writing about consciousness only as a test case. Don't bother with citations, I'll add those myself. And if you think the framing has a hole in it — say, that the conditions for debunking are already settled somewhere and I just havent come across it — tell me that at the end instead of politely working around it.
