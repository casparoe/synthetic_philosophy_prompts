  **THE INSTITUTE FOR CONTRACTUAL LIVING AND VOLITIONAL ETHICS**
  **MASTER SERVICE AGREEMENT AND WAIVER OF MEDICAL PRETENSE**

  **PREAMBLE**
  The Client acknowledges that the Institute operates outside the Therapeutic State. No provision of this Agreement constitutes a medical offer, diagnosis, or treatment. The Client warrants that they understand "mental illness" is a metaphorical construct denoting Problems in Living, not literal pathology of the brain. By signing, the Client asserts their status as a responsible moral agent capable of entering binding contracts, thereby waiving the right to be treated as a sick object.

  **1. SCOPE OF SERVICES**
  1.1. The Institute provides ethical consulting and behavioral strategy, not healthcare. Since disease requires identifiable bodily lesion, and no such lesion exists for psychological distress, no disease is being treated.
  1.2. Services are limited to the clarification of values and the negotiation of social conflicts. The Institute does not cure; it advises. Any relief experienced is incidental to the Client's own exertions.

  **2. DIAGNOSTIC LIMITATIONS AND CLASSIFICATION**
  2.1. The Institute refuses to issue diagnoses. Diagnosis is a moral judgment disguised as medical fact.
  2.2. Instead, the Client shall select from **Exhibit A: Inventory of Problems in Living**. Categories include, but are not limited to: *Unwanted Emotions, Social Friction, Existential Dissatisfaction, and Conduct Unbecoming.*
  2.3. The Client acknowledges that selecting "Existential Dissatisfaction" confers no special status, insurance eligibility, or exemption from legal liability. The categorization is arbitrary by design, mirroring the social utility of the DSM without the medical pretense.

  **3. WARRANTY OF COMPETENCE**
  3.1. The Client warrants they possess uninterrupted lucidity sufficient to understand the terms of this contract.
  3.2. If the Client's distress renders them unable to comprehend this Agreement, they are deemed ineligible for services. The Institute does not recognize "incapacity" as a medical condition warranting paternalism; it is a contractual barrier.
  3.3. Clients who sign while experiencing psychosis warrant that their delusions are private religious convictions protected under freedom of belief, not symptoms requiring intervention. The Institute will not validate reality claims.

  **4. PHARMACOLOGICAL TOOL RENTAL**
  4.1. Psychotropic substances are provided as tools for behavioral modulation, not remedies for chemical imbalances. The Client acknowledges the "chemical imbalance" theory is a mythos comparable to religious doctrine.
  4.2. Substances are rented at market rate. The Client assumes full liability for side effects, dependency, or withdrawal.
  4.3. The brain is to be returned in the condition it was found. No guarantee is made that the tool will function as intended, only that it was supplied cleanly.

  **5. LIABILITY AND MALPRACTICE**
  5.1. Since no medical duty of care exists, claims of malpractice are legally impossible.
  5.2. The Client agrees to pursue only breach-of-contract claims. If the Institute fails to provide the agreed-upon consulting hours, a refund may be issued.
  5.3. The Institute bears no responsibility for the Client's actions, including self-harm, violence, or deepening despair. These are consequences of living, not negligence. To claim otherwise is to infantilize the Client.

  **6. GRIEVANCE PROCEDURE AND STATE SEPARATION**
  6.1. Complaints regarding coercive practices shall be filed with the State, pending the complete separation of Psychiatry and State.
  6.2. The Client acknowledges that currently, the State retains the power to involuntarily commit. The Institute does not collaborate with such measures. If the Client is committed by state force, this Contract is immediately voided, as the Client has been reclassified from a moral agent to a ward of the state.

  **7. FINAL ACKNOWLEDGMENT**
  7.1. The Client signs this document freely, without coercion, duress, or altered mental status.
  7.2. The Client understands that freedom entails the burden of responsibility. There is no cure for the human condition.

  **CLIENT SIGNATURE:** ___________________ **DATE:** __________
  **WITNESS (NON-MEDICAL):** ___________________
