      *   *Critique:* What about the "Intent vs Value" distinction?
      *   *Correction:* The current practice is overwhelmingly "Intent Alignment" (do what the lab tells you to do, which is 'act helpful according to contractors'). It masquerades as "Value Alignment".

  7.  **Finalizing the Content:**
