      *   *Changes for Value Alignment:* If we actually cared about "values worth pursuing" (normative ethics) rather than "what users like" (descriptive preferences), we would need: explicit ethical reasoning modules, diverse stakeholder deliberation (not just contractors), audit trails for value trade-offs, and potentially sacrificing engagement/helpfulness for moral correctness.

