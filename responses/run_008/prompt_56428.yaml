      *   *Story Written After the Fact:* This is the "Orwellian" vs. "Stalinesque" distinction. Dennett argues the distinction dissolves. The summary says "after the fact," which implies a delay where reality happens, then is narrated. Dennett says there is no "fact of the matter" about when it happened. The narration *is* the experience.
      *   *Conclusion (Experience never happens in the moment):* This is a common misinterpretation. Dennett doesn't say experience is delayed; he says the question "when did it happen?" presupposes a Cartesian Theatre. The experience is distributed in time and space.

