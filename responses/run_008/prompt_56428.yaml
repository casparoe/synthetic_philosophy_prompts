      *   *Illusion:* Need to be careful here. Dennett titled a book *Consciousness Explained*, but often says "qualia are an illusion." He doesn't deny we have experiences; he denies the *properties* we attribute to them (ineffability, intrinsicness, etc.). The summary says "consciousness as we think we know it is an illusion." That's actually pretty close to Dennett, but popularisers often turn this into "consciousness doesn't exist." I need to clarify that distinction.
