  "I know [Brother-in-Law] is turning 40, but I want to talk about something he said recently that I found deeply romantic. He once told me the highest praise he could give his marriage is that it's 'stable.'

  And look, in most relationships, that's a bit cold. But for [Brother-in-Law], that is high strategy. Because in Schelling terms, a stable marriage is perfect **deterrence**. It's saying, 'Honey, if you leave the socks on the floor, there will be consequences.' The status quo is preserved.

  But we all know **compellence** is much harder. Compellence is when the socks are *already* on the floor, and you have to threaten punishment until they are picked up. It requires the adversary to make a visible concession, and the credibility is always lower.

  And then there's **brinkmanship**. Which is telling her, 'I am so tired I might just sleep on the couch tonight,' and realizing you've created a risk of escalation you can't fully control.

  So, happy birthday. May your deterrence remain credible, may you never need compellence to get the kids to clean their rooms, and may your marriage stay forever stable."
