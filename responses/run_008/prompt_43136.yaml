      *   *Suspicion:* Closure denial is an artifact of isolating single beliefs. Novelists manage POV *holistically*. The grandmother isn't failing to know a disjunction; she is an unreliable informant about a *class of worlds* (the worlds where the family lies).
      *   *Analysis:* This is sharp. In fiction, we judge a character's epistemic state by their *overall* reliability, not proposition-by-proposition. If a character is easily lied to, we mark them as "trusting" or "naive." We don't say "They know X but not Y." We say "Their access to truth is blocked by Channel L (Letters)."
      *   *The Residue:* Epistemology treats knowledge as a binary status attached to specific propositions ($Kp$). Narratology treats knowledge as a function of *access* and *perspective*.
      *   *Judgment:* The epistemological distinction is likely less clear/useful than the narrative one. Narrative craft reveals that "knowledge" is structural, not atomic.

