          *   Map Sensitivity to Draft Variants (The "What If" Test).
          *   Map Adherence to Character Consistency.
      *   **Section 2: The Closure Problem (The Zebra in the Room):**
          *   Translate the Zebra/Mule case.
          *   Translate the Grandmother case.
          *   Introduce the Reader/Implied Author distinction (The "Holistic View").
      *   **Section 3: The Residue Report:**
          *   *Clean Translations:* Sensitivity/Reliability, Possible Worlds/Draft Variants.
          *   *Distorted Translations:* Closure (Atomic vs. Holistic), Adherence (Psychological vs. Logical).
          *   *No Counterpart:* The binary "Know/Don't Know" switch. Narrative deals in gradients of reliability.
      *   **Section 4: Addressing the Suspicion (The Verdict):**
          *   Analyze the "Single Belief vs. Holistic POV" claim.
          *   Argue that Narratology exposes the atomic nature of epistemological propositions as a limitation of the philosophical model, not the narrative one.
