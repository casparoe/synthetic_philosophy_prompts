answer: |-
  This is a high-stakes, high-velocity environment. You do not have time for doctoral seminars on federal theory. You need a heuristic that minimizes legal risk (courts) and political risk (upper house vetoes) while maximizing policy effectiveness.

  Below is the brainstorming foundation, the decision procedure, the application to your three bills, and an audit of the system's weaknesses.

  ### Part 1: Brainstorming Subsidiarity for a Mid-Sized Federation

  To build a robust test, we synthesize the four models you mentioned into operational criteria:

  1.  **The EU "Efficiency & Added Value" Test:** Does the Federation achieve the objective *better* than the states? Not just "as well," but *better* due to scale or scope.
  2.  **The German "Essential Matters" (Wesentlichkeitstheorie):** Decisions affecting fundamental rights or requiring democratic legitimacy must be made at the higher level. However, administration usually remains local (Cooperative Federalism).
  3.  **The Swiss "Cantonal Default":** Unless the constitution explicitly grants power to the center, it stays local. This protects against competence creep.
  4.  **The US "Externality & Commerce" Logic:** If State A's action harms State B (pollution, economic barriers), the Federation must intervene.

  **Synthesis for your Ministry:**
  We cannot rely on a constitutional text I haven't seen. We must rely on *functional necessity*. The presumption must always be **State Competence**. The burden of proof lies on the Federal level to justify intervention.

  **The Three Justifications for Federal Action:**
  1.  **Spillover:** One state's inaction harms another (e.g., pollution, infectious disease).
  2.  **Fragmentation Costs:** Divergent rules make national markets or rights impossible to exercise (e.g., product standards, civil rights).
  3.  **Race to the Bottom:** Competition between states leads to unacceptable degradation of standards (e.g., labor rights, environmental protection).

  ---

  ### Part 2: The "48-Hour Competence Procedure"

  This is designed to be run in one working day. If you cannot answer a question with evidence in 2 hours, move to the next step or escalate.

  #### Step 1: The Constitutional & Precedent Check (Stop/Go)
  *   **Question:** Does the Constitution explicitly grant or forbid this power? Is there a binding Supreme/Federal Court precedent on this specific topic?
  *   **Sufficient Answer:** "Yes, Article X grants this" OR "Yes, Case Y struck this down."
  *   **Decision:**
      *   If Explicit Grant → **Federal**.
      *   If Explicit Forbidden → **State**.
      *   If Ambiguous/No Precedent → **Proceed to Step 2.**

  #### Step 2: The Cross-Border Externality Test
  *   **Question:** If State A regulates this and State B does not, does State A suffer tangible harm (economic, physical, legal)?
  *   **Sufficient Answer:** Evidence of spillover (e.g., pollution flows downstream, citizens flee to lower-standard states).
  *   **Decision:**
      *   If Yes (Significant Harm) → **Federal**.
      *   If No (Harm contained within borders) → **Proceed to Step 3.**

  #### Step 3: The Market & Rights Fragmentation Test
  *   **Question:** Does a patchwork of 10 state laws create prohibitive compliance costs for national actors OR deny citizens equal rights across the federation?
  *   **Sufficient Answer:** Industry impact assessment OR Civil rights audit.
  *   **Decision:**
      *   If Yes (Market Breakdown or Rights Violation) → **Federal Minimum Standards** (Cooperative).
      *   If No (Local variation is manageable) → **Proceed to Step 4.**

  #### Step 4: The Capacity & Accountability Test
  *   **Question:** Who is best positioned to enforce this, and who pays for it?
  *   **Sufficient Answer:** Budget analysis and administrative chain of command.
  *   **Decision:**
      *   If Federal Funding/Enforcement required → **Federal**.
      *   If Local Enforcement/Implementation required → **State** or **Cooperative**.

  #### Step 5: The Political Value Escalation (The "Minister's Call")
  *   **Condition:** If Steps 1-4 yield mixed results (e.g., No externality, but high desire for uniformity), or if the issue touches on "Essential Matters" (human dignity, core democracy) without clear legal text.
  *   **Action:** Do not recommend a legal path. Recommend a **Political Decision**.
  *   **Memo Language:** *"Legal competence is ambiguous. Federal intervention risks court challenge but satisfies national equity concerns. State competence is legally safer but risks political backlash. Recommendation: Minister to decide based on policy priority vs. legal risk."*

  ---

  ### Part 3: Running the Procedure on Your Three Bills

  #### Bill 1: National Noise Limit for Heat Pumps
  *   **Context:** Patchwork exists; industry lobbying for uniformity.
  *   **Step 1 (Constitution):** Likely concurrent power. No explicit ban. → *Proceed.*
  *   **Step 2 (Externality):** Noise is hyper-local. A loud pump in State A does not physically harm State B. → *Fail.* (Points to State).
  *   **Step 3 (Fragmentation):** Industry argues manufacturing 10 different models is cost-prohibitive. This is a "Market Fragmentation" argument.
      *   *Analysis:* Is this a trade barrier or just annoyance? If states use noise to ban out-of-state units, it's a trade barrier. If they just set decibel limits, it's product regulation.
      *   *Finding:* High compliance costs for national manufacturers constitute a market fragmentation risk.
  *   **Step 4 (Capacity):** States enforce building codes; Federation sets product standards.
  *   **Procedure Verdict:** **Cooperative Federalism (Federal Standards, State Implementation).**
      *   *Reasoning:* The Federation sets the maximum decibel level for *manufacture* (to satisfy the market test), but States determine *installation* zones (to satisfy local land-use autonomy).
      *   *Risk:* Low. Courts usually accept federal product standards even if effects are local.

  #### Bill 2: E-Scooter Parking Rules
  *   **Context:** City streets problem; 3 states asked for intervention.
  *   **Step 1 (Constitution):** Local infrastructure is almost always State/Municipal. → *Lean State.*
  *   **Step 2 (Externality):** A scooter parked badly in State A does not harm State B. → *Fail.*
  *   **Step 3 (Fragmentation):** Do scooter companies need uniform parking rules nationally? Unlikely. Operations are city-specific. → *Fail.*
  *   **Step 4 (Capacity):** Who cleans the sidewalks? Municipalities. Who owns the street? States/Cities. Federal enforcement is impossible.
  *   **Step 5 (The "3 States" Trap):** Three states asking for help usually means they are facing political heat and want cover. It does not create federal competence.
  *   **Procedure Verdict:** **State/Local.**
      *   *Reasoning:* This fails every test for federal intervention. If the Federation legislates sidewalk usage, the Upper House (representing states) will likely block it as overreach, or Courts will strike it down as infringing on local autonomy.
      *   *Recommendation:* Reject federal legislation. Offer a "Best Practice Guideline" instead (non-binding).

  #### Bill 3: Minimum Staffing Ratios in Nursing Homes
  *   **Context:** You want Federal; you suspect procedure says no.
  *   **Step 1 (Constitution):** Health is often concurrent, but "welfare" is often State. Ambiguous. → *Proceed.*
  *   **Step 2 (Externality):** Poor care in State A doesn't physically harm State B, *unless* citizens move to avoid it (welfare migration). Weak argument. → *Fail.*
  *   **Step 3 (Fragmentation & Rights):**
      *   *Market:* Providers might flock to states with lower ratios (lower costs), creating a "Race to the Bottom."
      *   *Rights:* Is care a fundamental right? Under the "Essential Matters" doctrine, human dignity and physical integrity are core. Unequal care based on zip code violates "Equality of Living Conditions" (a common federal principle).
  *   **Step 4 (Capacity):** States license homes; Federation funds health.
  *   **Procedure Verdict:** **Federal Minimum Standards (Cooperative).**
      *   *Honesty Check:* You suspected the procedure would say "State." A strict "Externality" test *would* say State. However, the **"Essential Matters/Rights" override** in Step 3 shifts this.
      *   *Nuance:* You cannot mandate *funding* federally (that's State budget). You can mandate *ratios* as a condition of licensure or federal funding.
      *   *Recommendation:* Federal legislation setting a floor (minimum ratio), allowing States to exceed it. This mitigates the "Race to the Bottom" without commandeering State budgets entirely.
      *   *Risk:* Moderate. States will complain about unfunded mandates. You need a funding hook.

  ---

  ### Part 4: Systematic Failure Modes (Where this breaks)

  1.  **The "Crisis" Bias:** In emergencies (pandemics, disasters), Step 2 (Externality) is always interpreted broadly. This procedure will almost always recommend Federal action during crises. *Mitigation:* Add a "Sunset Clause" check to Step 1 (Is this power temporary?).
  2.  **The "Camouflage" Problem:** Lobbyists will frame local issues as national market issues (see Heat Pump Bill). If you rely solely on industry impact statements, you will over-centralize. *Mitigation:* Require an independent "Small Business/Local Govt Impact" statement for Step 3.
  3.  **Judicial Drift:** This procedure assumes a stable court. If the Court swings towards "States' Rights," Step 1 becomes a minefield. *Mitigation:* Maintain a "Risk Register" of current judicial sentiment.
  4.  **The "Three States" Trap:** As seen in the E-Scooter bill, a minority of states asking for help can trick you into thinking there is a demand for federalization. Often, they just want to blame you for unpopular local rules. *Mitigation:* Require a formal request from the Council of States (Upper House), not individual states.

  ---

  ### Part 5: Confidence & Uncertainty Assessment

  **Overall Confidence: 80%**
  This procedure is robust for 80% of technical legislation. It successfully filters out clear overreach (E-Scooters) and identifies clear national needs (Product Standards).

  **Least Certain Component: Step 3 (The Rights/Equality Threshold)**
  This is the weakest link. Determining when a policy issue becomes a "Fundamental Right" or an "Essential Matter" is not a legal test; it is a philosophical one.
  *   *Why:* In the Nursing Home bill, I had to invoke "Human Dignity" to justify Federal involvement. A different analyst could argue "Resource Allocation" is a State matter.
  *   *Risk:* This is where the Minister *must* take ownership. If you classify something as a "Right" to force Federal action, and the Court disagrees, you lose.
  *   *Advice:* Whenever Step 3 relies on "Equality of Living Conditions" rather than "Market Fragmentation," flag it for the Minister as a **Political Value Decision**, not a legal certainty.

  **Final Advice for your Desk:**
  Keep a "Precedent Log." Every time a bill is challenged in court or blocked in the Upper House, record *why*. After 40 bills (one year), you will have a customized "Case Law" for your specific federation that will make Step 1 much faster and more accurate than any theoretical procedure I can give you.
