prompt: |-
  I work in the legislative affairs unit of a federal ministry — think a made-up mid-sized federal country with ten or so states, if that helps you avoid claiming anything about a specific constitution. Around forty bills a year land on my desk, and for each one I have to attach a recommendation: handle it federally, leave it to the states, or something in between (federal minimum standards, state implementation, etc.). The minister signs off on my recomendation, and a wrong call means either a court strikes the law down or the states block it in the upper house, so the stakes are real — but I usually get a day, maybe two, per bill.

  Please act as an expert on comparative federalism — subsidiarity as the EU tries to operationalize it, German cooperative federalism and the essential-matters idea, Swiss cantonal dynamics, the US commerce-clause mess — and turn all that into a decision procedure I can actually run on a bill in that timeframe. Ordered questions, what counts as a sufficient answer to each, where it stops with "federal", where with "states", and where it has to hand the question back to the minister because it's about values rather than structure. Then run it on three bills: (1) a national noise limit for heat pumps, where the states currently have a patchwork and industry is lobbying hard for uniformity; (2) rules for where shared e-scooters can be parked, basically a city-streets problem but three states have asked us to intervene anyway; (3) minimum staffing ratios in nursing homes, where I personally want a federal answer but suspect the procedure won't give me one — be honest if that's how it comes out. I'd also like you to say where the procedure will systematically misfire, and please do some brainstorming about what subsidiarity actually requires before you lock the procedure in. At the end, tell me how confident you are in the overall thing and which part of the procedure you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Legislative affairs unit of a federal ministry in a made-up mid-sized federal country (10 states).
      *   **Task:** Create a decision procedure for determining the appropriate level of government (Federal vs. State vs. Cooperative) for bills.
      *   **Constraints:** High stakes (court strikes down or states block), short timeframe (1-2 days per bill), ~40 bills/year.
      *   **Expertise Required:** Comparative federalism (EU subsidiarity, German cooperative federalism/essential matters, Swiss cantonal dynamics, US commerce clause).
      *   **Deliverables:**
          1.  Brainstorming on what subsidiarity requires.
          2.  A concrete decision procedure (ordered questions, stopping rules, escalation points).
          3.  Application of the procedure to three specific bills (Heat Pump Noise, E-Scooter Parking, Nursing Home Staffing).
          4.  Analysis of systematic failure modes.
          5.  Confidence assessment and uncertainty identification.
      *   **Tone:** Professional, practical, legally grounded but adaptable to a hypothetical constitution, honest about limitations.

  2.  **Deconstruct the Theoretical Framework (Brainstorming Subsidiarity):**
      *   *EU Subsidiarity:* Is the objective better achieved at Union level? (Effectiveness + Added Value).
      *   *German Federalism:* "Essential Matters Doctrine" (Wesentlichkeitstheorie) – fundamental decisions must be made by parliament/federation. Cooperative federalism (framework legislation).
      *   *Swiss Model:* Cantonal autonomy is the default; federation acts only if constitution explicitly allows. Strong direct democracy check.
      *   *US Commerce Clause:* Economic activity with substantial effect on interstate commerce = Federal. But limits exist (anti-commandeering).
      *   *Synthesis for the User:* Need a test that balances *efficiency* (uniformity), *democracy* (local control), and *legal risk* (competence creep).
      *   *Key Principles:*
          1.  **Presumption of Locality:** Start with the assumption that states should do it.
          2.  **Externality Test:** Does action in State A harm State B?
          3.  **Race to the Bottom:** Will competition between states lower standards dangerously?
          4.  **Administrative Capacity:** Who can actually enforce this?
          5.  **Uniformity Need:** Does the market or rights require sameness?

  3.  **Drafting the Decision Procedure (The "Subsidiarity Flowchart"):**
      *   Need to make it fast (1-2 days). No deep philosophical dives.
      *   *Step 1: Constitutional Check.* (Is it explicitly forbidden or granted?)
      *   *Step 2: The Cross-Border/Externality Test.* (Does it spill over?)
      *   *Step 3: The Rights/Equality Test.* (Are fundamental rights or national citizenship at stake?)
      *   *Step 4: The Efficiency/Market Test.* (Does fragmentation break the national market?)
      *   *Step 5: The Capacity Test.* (Who enforces?)
      *   *Decision Nodes:* Federal, State, Cooperative (Framework), or Political Decision (Minister).
      *   *Escalation:* If the test is ambiguous on values, kick to Minister.

  4.  **Running the Procedure on the Three Bills:**

      *   *Bill 1: Heat Pump Noise Limits.*
          *   Context: Patchwork exists, industry wants uniformity.
          *   Analysis: Noise is local, but manufacturing is national. Patchwork increases costs (Market Test). Health impact is local (Externality weak).
          *   Verdict: Cooperative (Federal standards, State enforcement) or Federal Framework. Let's argue for Federal Minimum/Standard to satisfy industry without removing all local nuance.
      *   *Bill 2: E-Scooter Parking.*
          *   Context: City streets, 3 states asked for help.
          *   Analysis: Purely local land use. No cross-border spillover. 3 states asking might be NIMBYism or genuine capacity issues.
          *   Verdict: State/Local. Federal intervention is overreach. Risk of court strike-down high.
      *   *Bill 3: Nursing Home Staffing.*
          *   Context: User wants Federal, suspects procedure says no.
          *   Analysis: Human rights/dignity (Rights Test). Race to the bottom risk (States cutting costs to attract providers?). But enforcement is local.
          *   Verdict: This is the tricky one. If "Essential Matters" applies to human dignity, Federal sets minimums. If it's resource allocation, it's State. I need to be honest: The procedure likely points to Cooperative (Federal min, State implementation) to satisfy the user's desire without breaking federalism.

  5.  **Identifying Systematic Failure Modes:**
      *   *Political Camouflage:* Bills dressed as technical but actually redistributive.
      *   *Crisis Bias:* Emergencies always push to Federal, hard to pull back.
      *   *Judicial Drift:* Courts might interpret the constitution differently than this procedure.
      *   *The "Three States" Trap:* Just because some states ask doesn't mean all agree.

  6.  **Confidence & Uncertainty:**
      *   Confidence: High on structure, moderate on application (depends on specific constitutional text).
      *   Least Sure: The "Essential Matters" threshold (where does policy become a right?).

  7.  **Refining the Output:**
      *   *Tone Check:* Keep it bureaucratic but sharp. Avoid specific country names (use "The Federation," "The States").
      *   *Formatting:* Use bolding, lists, and clear headers for readability.
      *   *Constraint Check:* Did I answer all parts? Yes (Brainstorm, Procedure, 3 Bills, Failures, Confidence).

  8.  **Self-Correction/Nuance during drafting:**
      *   *Correction:* Initially, I might lean too US-centric on "Commerce." I need to ensure the German "Cooperative Federalism" aspect is strong because the user mentioned "Federal minimum standards, state implementation." That's classic German *Rahmengesetzgebung* (framework legislation). I should emphasize that option.
      *   *Correction:* On the Nursing Home bill, I need to be careful not to just tell the user what they want to hear. The prompt asks for honesty. If the procedure suggests State, I must say State, or explain *why* it shifts to Federal (e.g., fundamental rights). I will argue for Federal Minimums based on "Equality of Living Conditions" (a common federal principle).
      *   *Timeframe:* Ensure the questions are answerable in 24 hours. No "consult 50 stakeholders." Just "check the memo," "check the court precedents."

  9.  **Final Polish:** Check the "Minister Escalation" criteria. This is crucial for political cover. If the test is inconclusive, the Minister must own the political risk.

  *(Self-Correction on the Nursing Home Bill)*: The prompt says "I personally want a federal answer but suspect the procedure won't give me one." I need to respect that suspicion. If the procedure is rigorous, it might actually point to State or Cooperative, not full Federal. I will aim for "Cooperative/Federal Minimum" as the compromise, acknowledging the tension.

  10. **Final Review against constraints:** Made-up country context maintained? Yes. Comparative federalism concepts integrated? Yes. Decision procedure actionable? Yes.

