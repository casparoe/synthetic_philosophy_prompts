  10. (Final Polish of the text to ensure clarity and empathy for the business owner's position.) *Self-correction: Ensure the distinction between "headline forecast" and "ensemble spread" is clear in the procedure.*

  11. *Final check on the "Local Knowledge" constraint:* The prompt asks for a step deciding when local knowledge stops counting. I need to make sure that's a distinct step or criteria, not just buried. I will add a specific "Intuition Cap" rule.

