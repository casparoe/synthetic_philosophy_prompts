      *   *Variable Reliability:* Pressure/Temp are thermodynamic (easier). Wind/Fog/Convection are dynamic/micro-scale (harder).
      *   *Local Knowledge:* Valuable for climatology (what *usually* happens) but dangerous for specific synoptic events (what *will* happen).
      *   *The Brother's Argument:* This is the classic Laplace's Demon vs. Epistemic Uncertainty debate. The weather *is* determined (mostly), but our *knowledge* of the initial state is imperfect, making prediction probabilistic.

  3.  **Drafting the Decision Procedure (The "Coastal Call Checklist"):**

      *   *Goal:* 10 minutes max.
