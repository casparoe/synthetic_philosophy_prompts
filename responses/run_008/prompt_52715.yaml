answer: |-
  There is no single, universally settled term in philosophy, law, or AI policy that captures this exact configuration. However, your description maps precisely onto a cluster of concepts across three fields: **legal theory** (overinclusive regulation), **public health ethics** (primary prevention), and **moral philosophy** (rule utilitarianism).

  If you need a specific label to use in internal policy debates, the most precise existing term is **"Overinclusive Regulation,"** but the most evocative ethical label is **"Statistical Paternalism."**

  Below is the breakdown of the established concepts, the recommended terminology, and the boundary analysis you requested.

  ### 1. Established Concepts and Their Limitations

  You are correct to reject classic "paternalism" and "statistical discrimination." Here are the concepts that come closest, along with why they might not fully stick:

  *   **Overinclusive Regulation (Legal Theory):**
      *   **Definition:** A rule is "overinclusive" when it restricts conduct that is harmless in some instances to prevent harm in others, usually because distinguishing between the two is too costly or difficult.
      *   **Fit:** This describes the *mechanism* perfectly. A ban on providing synthesis instructions for a chemical is overinclusive because it stops hobbyists (harmless) to stop bad actors (harmful).
      *   **Limitation:** This is a descriptive legal critique, not a normative justification. It tells you *what* the rule is, not *why* it is morally permissible to impose it on the innocent hobbyist.

  *   **Primary Prevention (Public Health Ethics):**
      *   **Definition:** Interventions that prevent harm before it occurs by targeting the entire population rather than high-risk individuals (e.g., fluoridating water, limiting acetaminophen pack sizes).
      *   **Fit:** This captures the "population-level" logic. The intervention is applied to the whole pool to protect the vulnerable tail of the distribution.
      *   **Limitation:** Public health usually assumes a government mandate. In a private company context, this feels more like a corporate governance choice than a public health mandate.

  *   **Rule Utilitarianism (Moral Philosophy):**
      *   **Definition:** The ethical stance that we should follow rules that generally maximize well-being, even if breaking the rule in a specific case would yield a better outcome.
      *   **Fit:** This justifies the refusal. The rule "never answer drug interaction questions" maximizes safety overall, even if it frustrates a responsible user.
      *   **Limitation:** This is a broad ethical framework, not a specific policy term. It doesn't capture the *statistical* nature of the risk assessment.

  ### 2. Recommended Terminology: "Statistical Paternalism"

  Since no single term dominates the literature, I recommend adopting **"Statistical Paternalism"** for your internal taxonomy. While it appears sporadically in bioethics and data privacy literature, it is not yet "claimed" by a conflicting definition, making it available for your specific use case.

  **Definition:**
  > **Statistical Paternalism** is a safety intervention where access to information or capability is restricted for an entire population based on the estimated risk profile of a subset, rather than the assessed intent or competence of the individual requester.

  **Why this fits your configuration:**
  1.  **Statistical:** It explicitly acknowledges that the decision is driven by distributional data (the "fraction of askers"), not individual assessment.
  2.  **Paternalism:** It acknowledges that the system is overriding the user's immediate will for a perceived good (safety), even if that good primarily protects a hypothetical third party or a hypothetical version of the user.
  3.  **Distinction:** It differentiates from *Individual Paternalism* (stopping *you* from hurting *you* because *you* are confused) and *Harm Principle* interventions (stopping *you* from hurting *me* because *you* are threatening).

  **Alternative:** If your legal team finds "Paternalism" too loaded (as it implies condescension), use **"Categorical Risk Restriction."** This is more neutral but less ethically descriptive.

  ### 3. Boundary Cases and Carving

  To help you defend this terminology, here is how the concept applies to the edge cases you described.

  **Case A: The Screening Question (The "Liar" Problem)**
  *   *Scenario:* The assistant asks, "Are you a licensed chemist?" before answering. Dangerous users lie; honest users answer truthfully.
  *   *Analysis:* If the system grants access based on the answer, it is **no longer Statistical Paternalism**; it has shifted to **Credential-Based Access**. However, if the company knows the screening question is easily bypassed (i.e., the "lie rate" is high) and keeps the restriction anyway, the underlying logic remains Statistical Paternalism. The screening question becomes "security theater" unless it is cryptographically or legally verifiable.
  *   *Verdict:* If the screen is soft (honor system), the refusal is still Statistical Paternalism because the *effective* filter is the population risk, not the individual answer.

  **Case B: Minor Harm vs. Major Benefit (The "Utility" Problem)**
  *   *Scenario:* 1 in 10,000 users might get a mild rash (minor harm), but 9,999 get significant educational benefit.
  *   *Analysis:* Statistical Paternalism relies on a threshold of **Severity**. It is generally only justifiable when the tail-risk involves catastrophic or irreversible harm (death, weaponization, severe addiction). If the harm is minor, the "overinclusiveness" becomes an unacceptable burden on utility.
  *   *Verdict:* Statistical Paternalism **does not apply** (or is ethically indefensible) when the harm is de minimis. The concept requires a "high-severity tail."

  **Case C: Unavailability vs. Refusal (The "Design" Problem)**
  *   *Scenario:* The assistant doesn't say "I refuse"; it simply lacks the capability to answer the topic at all (e.g., the knowledge is not in the training set, or a hard-coded filter blocks the output silently).
  *   *Analysis:* This is **Structural Paternalism** (a subset of Statistical Paternalism). The outcome is identical (no access), but the user experience differs. A refusal acknowledges the user's agency and denies it; unavailability removes the agency entirely.
  *   *Verdict:* The concept **still applies**. The justification (population risk) is the same, even if the mechanism (capability vs. policy) differs. However, "unavailability" is harder to audit and may create "security through obscurity" risks.

  ### 4. Confidence Statement

  **Confidence Level:** **Moderate-High (75%)**

  I am highly confident that **"Overinclusive Regulation"** is the correct legal descriptor and that **"Statistical Paternalism"** is the most accurate ethical label for the logic you are describing. There is no single "gravity-like" term in AI safety that universally governs this specific dynamic yet; the field is currently borrowing from law and public health.

  **Point of Least Certainty:**
  I am least certain about the **normative weight of the term "Paternalism"** in your specific legal context. In some jurisdictions, "paternalism" implies a fiduciary duty that a private tech company may not want to legally admit to. If your legal team is concerned about liability, they may prefer the more neutral **"Categorical Risk Mitigation."** "Statistical Paternalism" is the philosophically precise term, but "Categorical Risk Mitigation" is the safer corporate euphemism.

  ### Summary for Your Policy Team

  When debating these cases, you can frame the argument like this:

  > "We are employing **Statistical Paternalism**. We are accepting **overinclusiveness** (blocking safe users) as the cost of **primary prevention** (stopping catastrophic harm in the tail). This is only justified if the potential harm is severe and the cost of individual assessment is prohibitively high. If we can verify intent cheaply (e.g., verified credentials), we should move away from Statistical Paternalism toward **Credential-Based Access**."
