              2.  *Serious:* Loss of explanatory power (restrictions make the theory trivial).
              3.  *Awkward:* Counterintuitive consequences (past truth gaps).
          *   *Is Realism Insulated?* Yes. Realism posits "recognition-transcendent truth." How do you falsify that? Any failure to know is just "we haven't looked yet." Realism is arguably *more* insulated because it posits entities (truths) that are by definition beyond detection.
          *   *Nature of the Dispute:* It's largely conceptual/metaphysical, not empirical. It's about the *norms* of discourse, not the *facts* of the world.
          *   *Making it Settleable:* Dummett's Logic Revision is the key. If Anti-Realism is just a semantic thesis, it's insulated. If it's a *logical* thesis, it makes predictions about valid inference. We can test logical systems against mathematical practice.

  4.  **Refining and Polishing:**
