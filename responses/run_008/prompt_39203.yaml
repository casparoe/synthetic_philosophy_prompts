  **Rule A: The Active Deprivation Rule (Commission)**
  Famine is a political crime if the state *actively disrupts* existing entitlements or prevents relief within its jurisdiction. This covers exporting food during shortage, seizing grain, imposing trade barriers, suppressing information, or cutting relief based on doctrine.
  *   *Fits:* Bengal (procurement/barriers), Ireland (exports/relief cuts), Great Leap Forward (seizures/suppression).
  *   *Fits Natural Disaster Exception:* No. The state did not seize, export, or block relief; it was simply empty-handed.
  *   *Application to New Case:* **Not a Crime.** The state exports nothing, seizes nothing, hoards nothing, and distributes the domestic harvest with scrupulous equality. It does not actively disrupt internal entitlements.

  **Rule B: The Sovereign Capacity Rule (Omission)**
  Famine is a political crime if the state possesses the *sovereign means* (reserves, credit, border control) to prevent mass death but prioritizes other values (ideology, reserves, doctrine) over life. The "Natural Disaster" exception is not about fairness, but about *exhaustion* ("spent reserves, exhausted credit").
  *   *Fits:* Bengal, Ireland, GLF (all had means or created the deficit).
  *   *Fits Natural Disaster Exception:* No. The state had no means left.
  *   *Application to New Case:* **Political Crime.** The state has hard-currency reserves, markets are open, and the failure is a choice of ideology over survival.

  **The Divergence:**
  Your case is designed to split these rules. Under Rule A (Active Deprivation), the state is innocent; it behaved with internal rectitude. Under Rule B (Sovereign Capacity), the state is guilty; it refused to use available tools to save lives. The crux is whether her maxim ("who was allowed to eat") applies only to internal distribution or extends to the border control that determines the total pool.

  ### 2. Predicting Her Verdict

  **Verdict: Political Crime.**

  **Reasons:**
  1.  **The "Natural Disaster" Precedent:** Her only exception hinged on *incapacity* ("exhausted credit," "imported everything its ports could land"). Your case explicitly stipulates *capacity* ("substantial hard-currency reserves," "prices are ordinary"). To you, the distinction is between *taking* food and *not buying* food. To her, following her exception's logic, the distinction is between *cannot save* and *will not save*.
  2.  **The Irish Parallel:** She condemns the Irish famine partly due to "doctrinal commitments about the moral hazard of assistance." Your case features "doctrinal commitments... that large-scale food imports breed dependency." She has already established that ideological rigidity in the face of preventable death constitutes a political crime, regardless of whether the mechanism is exporting food (Ireland) or refusing to import it (Your Case).
  3.  **The Maxim's Scope:** You worry her maxim ("who was allowed to eat") might not reach across the border. However, in Sen's entitlement approach, the state defines the legal and economic framework of entitlement. By controlling the border, the state decides the aggregate entitlement bundle. In your case, the state decided the population was *not allowed* to eat the food available on the world market. The "scrupulous equality" inside the border is irrelevant if the total bundle is lethally small by choice. The maxim is not just about relative shares (who eats *more*), but about absolute permission (who is *permitted* to survive).

  **Which features will move her:**
  She will be unmoved by the internal equality. She will be moved decisively by the **unused reserves** and the **ideological refusal to trade**. The former distinguishes it from her natural disaster exception; the latter distinguishes it from a mere policy error, marking it as a doctrinal choice akin to the Irish "moral hazard" rationale she already condemns.

  ### 3. Proposing a Further Discriminating Case

  Your candidate (policy causes shortage, but timely relief means nobody dies) is philosophically interesting but procedurally weak for this specific seminar.

  **Critique of Your Candidate:**
  It relocates the question from "What constitutes a political crime of famine?" to "What constitutes a famine?" Sen defines famine by excess mortality. If nobody dies, your colleague can simply rule that *no famine occurred*, and thus the seminar's criteria for "political crime" never trigger. It tests the *outcome threshold* rather than the *attribution of blame*. It allows her to say, "They were reckless, but since no one died, it wasn't a famine-crime," which settles nothing about the duty to import or distribute.

  **My Proposal: The "Market Entitlement" Case**
  To discriminate between Rule A (Active Deprivation) and Rule B (Sovereign Capacity), and to test the limits of her maxim, propose this:

  > **The Case:** A mid-sized country with substantial reserves faces a drought. The government *imports sufficient food* to feed everyone (satisfying Rule B/Capacity). It does not seize or hoard (satisfying Rule A/Non-Interference). However, it distributes the food through a **market mechanism** without price controls or safety nets. Prices spike due to scarcity. The rich eat; the poor, priced out, starve. The statistics are honest; the corruption is minimal. The failure lies at the *cash register* rather than the border or the granary.

  **Why This Discriminates:**
  This case isolates **Distribution** from **Capacity**.
  *   **New Case:** Capacity Unused, Distribution Equal.
  *   **Market Case:** Capacity Used, Distribution Unequal.

  **The Test:**
  1.  **If she calls the New Case a Crime (Capacity trumps Fairness) AND the Market Case a Crime (Outcome trumps Procedure):** She is a strict Consequentialist regarding State Duty. The state is responsible for all preventable death, regardless of mechanism.
  2.  **If she calls the New Case a Tragedy (Fairness trumps Capacity) AND the Market Case a Crime:** She follows her Maxim strictly. "Who was allowed to eat" refers to *relative entitlement*. In the New Case, everyone was equally allowed (innocent). In the Market Case, the poor were disallowed by price (guilty). *This would contradict my prediction above, making it a powerful test.*
  3.  **If she calls the New Case a Crime (Capacity) AND the Market Case a Tragedy (Market is neutral):** She believes the State's duty is to *provide access* (imports), not to *guarantee outcomes* (price controls).

  **Recommendation:**
  Lead with the **New Case** to challenge the boundary of her "Natural Disaster" exception. If she rules it a Political Crime (as I predict), follow up with the **Market Case**. If she calls the Market Case a crime as well, press her on whether the state is responsible for *market outcomes* or only *state actions*. This will force her to clarify whether her Sen-inspired maxim is about **justice** (equality of access) or **survival** (prevention of death).
