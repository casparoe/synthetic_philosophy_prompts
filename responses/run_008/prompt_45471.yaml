  Hey, this is fascinating stuff and I love the bug triage metaphor because it really highlights how Dave is running a specific heuristic rather than just vibes. Based on the log you have collected, I am pretty confident I can predict his ruling on the mixed-strain infection scenario and reverse-engineer the logic he is using to get there. When you hit him with the case of the vicious virus in co-infected villages versus the mild virus in single-strain villages, Dave is almost certainly going to rule this as individual-level selection, or possibly gene-level if he wants to be pedantic about the viral genome, but he will firmly reject the group-selection label. He will argue that the virus strain is the entity reproducing and that the presence of a competitor strain is merely an environmental variable that changes the fitness payoff for the individual strain, much like how the presence of predators changes the fitness payoff for a gazelle without implying group selection among gazelles.

  The rule Dave is running appears to be a strict version of the replicator-vehicle distinction, likely influenced by Dawkins or George Williams, where selection is only acknowledged at a level if that level functions as a genuine unit of reproduction with heredity. In his log, he accepts gene-level selection because genes replicate. He accepts individual-level selection because organisms replicate. He rejects group selection in the wild, like with the myxomatosis or the squirrels, because groups of viruses or squirrels do not typically reproduce as a single bundled unit with inheritance. The only exception he made was the hen cages, and that exception proves the rule because he explicitly noted that the experimenter made the group the thing that reproduces. So his algorithm is basically checking for a bottleneck where the higher-level entity copies itself. In your virus case, the groups of viruses inside a host do not bundle up and fly off to infect new hosts together as a unit; rather, individual viral particles transmit, so Dave will say the group is not a replicator and therefore cannot be the unit of selection.

  However, there is an alternative rule that fits all his previous rulings just as well but would give you the opposite verdict on this new case, and identifying this is key to your next move. This alternative rule is based on the Price Equation or Multilevel Selection theory, which posits that selection acts at any level where there is heritable variation in fitness, regardless of whether there is a clean physical bottleneck. Under this rule, you can interpret his past data by saying that in the hen cages, the between-group variance was artificially maximized, while in the myxomatosis case, the between-group variance was too low to matter compared to within-group variance. This rule fits the log because it allows him to dismiss the myxomatosis group selection as negligible without denying the principle, and it allows him to accept the hen cages because the variance was forced. But on your new virus case, this rule would force a admission of group selection because there is now a clear conflict between within-host selection favoring virulence and between-host selection favoring mildness, creating a genuine multilevel dynamic that the Price Equation would partition into group and individual components.

  To distinguish between Dave's strict replication rule and this variance-based rule, you need a reserve case where groups reproduce naturally without an experimenter forcing it, but without being a single organism like a bee colony which he might just call an individual. I would suggest keeping a case about bacterial biofilms ready for the round after next. Specifically, you should look for a scenario where a biofilm grows to a certain size and then physically fragments, with each fragment dispersing to found a new biofilm colony. If Dave sticks to his current rule, he should accept this as group selection because the group is now physically reproducing with heredity, similar to the hen cages but in the wild. If he rejects it and calls it individual selection because the bacteria are the ones dividing, he reveals that his rule is actually even stricter than I thought and requires the group to be the sole reproductive unit, not just a reproducing vehicle. If he accepts it, then you know his boundary is purely about physical group reproduction, and you can trap him on why viral transmission clusters don't count if they show similar fidelity. This should help you isolate whether he is a strict replicationist or just someone who denies group selection unless it is impossible to deny.
