prompt: |-
  I've got two friends who've been arguing for like two years about accuracy-first epistemology and I want them to finally produce something together instead of just re-litigating at the pub. One is a strict veritist/accuracy-monist about credences: she thinks the ONLY final epistemic value a credence function has is its accuracy, and every other legitimate epistemic norm — probabilism, updating by conditionalization, the Principal Principle, the Principle of Indifference — has to fall out of accuracy plus decision theory, basically the Pettigrew program. The other is an epistemic-value pluralist: he thinks accuracy is a big part of the story but not the whole of it, and that things like respecting your evidence in the right way, or avoiding epistemic akrasia, can have final epistemic value of their own rather than being valuable just because they tend to make you more accurate in the long run.

  Write the joint statement they'd produce after a genuine adversarial collaboration, the kind they could both actually put their names to. Specifically I want:

  1) The agreed claims, stated plainly and without weasel hedges — stuff like: proper scoring rules are the right way to measure accuracy, incoherent credences are in some sense dominated, there's a real distinction between pragmatic and epistemic justification for a credence, and so on. Don't let the agreed section be vacuous either — if they only agree on trivialities that's a finding, but write the non-trivial ones.

  2) The remaining disagreements, each phrased so the person who holds the view would accept the wording. I'm going to show this to them, so if you slant it, it gets sent back.

  3) The cruxes — the sub-questions where settling them would actually move one side or the other. I suspect one crux is whether the accuracy-first derivations of things like the Principal Principle genuinely vindicate the norm or just smuggle it in, e.g., by redefining accuracy relative to a proposition's chance of being true rather than plain truth. Another might be whether the choice among proper scoring rules (Brier vs. log score vs whatever) has real normative consequences or is basically convention — like whether it matters that different proper scoring rules disagree about which non-probabilistic credence assignments are worst. And maybe whether cases of "useful falsehoods" or self-fulfilling credences (think of someone whose confidence in their own success is itself part of what makes them succeed) are counterexamples to accuracy-monism or just show pragmatic and epistemic norms coming apart harmlessly.

  4) For each crux, some concrete case, theorem, or thought experiment that both sides would agree bears on it, plus each side's prediction written down in advance so they can't retro-fit later. Also, if any part of their dispute turns out to be verbal — like maybe they secretly mean different things by "epistemic value" or by "final" in "final epistemic value" — flag which part and explain why you think it's verbal.

  Format it as a numbered agreed-claims section followed by a disagreements table with a row per crux, columns for the monist's line, the pluralist's line, and the test case with each side's prediction. Keep it fair — neither friend is dumb, and they've both read the actual literature, so don't hand either of them an obvious strawman.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** Two friends arguing for two years about accuracy-first epistemology (Veritism/Accuracy-Monism vs. Epistemic-Value Pluralism).
      *   **Goal:** A joint statement resulting from genuine adversarial collaboration.
      *   **Requirements:**
          1.  Agreed claims (plain, non-vacuous, non-weaselly).
          2.  Remaining disagreements (phrased fairly for each side).
          3.  Cruxes (sub-questions that would move the needle).
          4.  Test cases/theorems/thought experiments for each crux with pre-registered predictions.
          5.  Flag potential verbal disputes.
      *   **Tone:** Professional, philosophical, precise, fair to both sides (Pettigrew-style Monist vs. Pluralist like Dunn, Easwaran, or perhaps a more moderate Leitgewer-style view).
      *   **Format:** Numbered agreed claims followed by a disagreements table.

  2.  **Deconstruct the Positions:**
      *   **Friend A (Monist/Veritist):** Accuracy is the *sole* final epistemic value. Norms (Probabilism, Conditionalization, PP) must be derived from accuracy + decision theory (e.g., Dominance Arguments). Key literature: Pettigrew, Joyce, Greaves.
      *   **Friend B (Pluralist):** Accuracy is *a* final value, but not the *only* one. Other values (e.g., evidential fit, avoiding akrasia, coherence for its own sake) have independent weight. Key literature: Dunn, Easwaran (sometimes), Carr, perhaps aspects of Kelly.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to avoid trivialities ("logic is good").
      *   Need to avoid hedging ("some might say").
      *   *Candidate 1:* Proper scoring rules are the correct formal measure of gradational accuracy. (Both accept this as the standard framework, even if they disagree on its exclusivity).
      *   *Candidate 2:* Incoherent credences are epistemically defective. (Monist says because inaccurate/dominated; Pluralist says because inaccurate + other reasons. Both agree they are defective).
      *   *Candidate 3:* There is a distinction between pragmatic and epistemic justification. (Crucial against pragmatic encroachment).
      *   *Candidate 4:* Accuracy is *a* fundamental epistemic good. (Pluralist accepts this, Monist insists it's the *only* one).
      *   *Candidate 5:* Norms like Conditionalization are binding. (Both agree they are binding, disagree on *why*).
      *   *Refinement:* Make sure "dominated" is used carefully. Monists love dominance arguments. Pluralists accept them but don't think they exhaust the normative landscape.
      *   *Selection:*
          1.  Accuracy is measured by strictly proper scoring rules.
          2.  Probabilistic coherence is an epistemic requirement.
          3.  Pragmatic utility does not constitute epistemic justification.
          4.  Accuracy is at least one source of final epistemic value.

  4.  **Drafting Section 2 & 3: Disagreements and Cruxes:**
      *   *Crux 1: The Derivation of Norms (The "Smuggling" Charge).*
          *   Monist: PP/Indifference derived from accuracy.
          *   Pluralist: Derivations sneak in the norm via the definition of accuracy (e.g., measuring distance to *chance* rather than *truth*).
          *   *Test Case:* The Principal Principle in a world with known chances but unknown truths.
      *   *Crux 2: The Choice of Scoring Rule.*
          *   Monist: Needs a unique rule or a class that yields same norms. If different rules yield different norms, accuracy monism is underdetermined.
          *   Pluralist: The choice of rule reflects extra-accuracy values (risk aversion, etc.).
          *   *Test Case:* Comparing Brier vs. Log loss on specific non-probabilistic credences or specific updating scenarios.
      *   *Crux 3: Epistemic Akrasia/Useful Falsehoods.*
          *   Monist: If believing $P$ makes $P$ true (self-fulfilling), accuracy says believe $P$. If epistemic norms say "don't believe without evidence," accuracy monism conflicts with evidence norms.
          *   Pluralist: This shows evidence has value independent of truth.
          *   *Test Case:* The "Therapeutic Belief" or "Self-Fulfilling Confidence" case.

  5.  **Drafting Section 4: Verbal Disputes:**
      *   "Final Value": Does the Monist mean "the only thing that matters" vs. Pluralist "one of the things that matters intrinsically"?
      *   "Epistemic": Does the Pluralist define "epistemic" broader than "truth-conducive"?
      *   *Analysis:* The core dispute is likely substantive, not merely verbal, regarding the *structure* of normativity (monistic vs. pluralistic), but the definition of "accuracy" in the context of chance (PP) is a flashpoint.

  6.  **Refining the Content (Self-Correction/Polishing):**
      *   *Check:* Did I make the Monist look like a crude pragmatist? *Correction:* Ensure the Monist relies on *epistemic* utility theorems (Joyce/Pettigrew), not pragmatic money pumps.
      *   *Check:* Did I make the Pluralist look like an anti-realist? *Correction:* Pluralists are usually realists about truth, they just think evidence has independent weight.
      *   *Check:* Are the predictions specific? *Correction:* Instead of "Side A wins," use "Side A predicts the norm holds/fails in scenario X."
      *   *Tone Check:* Ensure it sounds like a collaborative paper preamble or a manifesto.

  7.  **Finalizing the Text:**
      *   *Title:* Joint Statement on the Structure of Epistemic Normativity.
      *   *Signatories:* [Friend A] & [Friend B].
      *   *Section 1:* 5-6 strong claims.
      *   *Section 2:* Table format.
      *   *Crux 1 (PP):* Focus on "Accuracy to Truth" vs. "Accuracy to Chance."
      *   *Crux 2 (Scoring Rules):* Focus on "Underdetermination" vs. "Value-Laden Choice."
      *   *Crux 3 (Akrasia/Self-Fulfilling):* Focus on "Evidence vs. Truth."
      *   *Verbal Dispute Note:* Add a specific section at the end regarding "Final Value."

  8.  **Review against Constraints:**
      *   No weasel hedges? (Check: "We agree that..." not "It seems that...")
      *   Non-trivial agreements? (Check: Proper scoring rules, distinction from pragmatic.)
      *   Fair disagreement phrasing? (Check: Use internal logic of both views.)
      *   Concrete test cases? (Check: Specific thought experiments included.)

  9.  **Final Polish:** Ensure the distinction between *gradational* accuracy (credences) and *binary* accuracy (belief) is clear, as the prompt specifies credences. Ensure the Pettigrew program is referenced correctly (accuracy + decision theory).

  *(Self-Correction during drafting)*: I need to be careful with the Principal Principle. The Monist derives it by defining accuracy relative to *chances* if chances are known, or by arguing that matching chances minimizes expected inaccuracy relative to truth. The Pluralist argues this definition *is* the smuggling. I need to make sure the test case highlights this.
  *Test Case:* A proposition with known chance 0.5 but we know for a fact it is True (perhaps via time travel or omniscient hint). Does accuracy demand credence 1 or 0.5?
  *Monist:* If accuracy is distance from Truth, credence 1. If accuracy is distance from Chance (as per some derivations), credence 0.5. Actually, standard accuracy-first derives PP by arguing that *given* you don't know the truth, matching chance minimizes *expected* inaccuracy.
  *Better Test Case:* The "Known Chance, Known Truth" case. If I know $Ch(P)=0.5$ and I know $P$ is True.
  *Monist:* Credence 1 is more accurate. PP doesn't apply when you know the truth.
  *Pluralist:* PP might still exert a pull, or the derivation of PP relied on ignoring the truth.
  *Actually, let's stick to the standard "Underdetermination of Scoring Rules" crux, it's more technical and less prone to confusion.*
  *Let's go with the "Epistemic Risk" crux.* Different scoring rules encode different attitudes toward error. Monists need to say one is *the* measure. Pluralists say the choice is normative.

  *Revised Plan for Crux 2:* The "Legislation of Risk" crux.
  *Revised Plan for Crux 1:* The "Principal Principle Derivation" crux (Smuggling charge).
  *Revised Plan for Crux 3:* The "Epistemic Akrasia" crux (Final value of coherence).

  Let's write it.
answer: |-
  # Joint Statement on the Structure of Epistemic Normativity

  **Signatories:** [Friend A] (Accuracy Monist) & [Friend B] (Epistemic Pluralist)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Accuracy-First Epistemology

  Following two years of dialectical exchange, we submit this statement to clarify the common ground, isolate the substantive disagreements, and identify the specific theoretical cruxes that remain unresolved. We intend this document to serve as a baseline for future formal work, preventing the re-litigation of settled premises.

  ### 1. Agreed Claims

  We affirm the following propositions as true. These claims are substantive and reject skeptical or deflationary alternatives common in the broader literature.

  1.  **The Primacy of Accuracy:** Accuracy (closeness of credence to truth) is at least one source of *final* epistemic value. It is not merely instrumentally valuable for action; it is good for a believer to be accurate even if the belief never guides action.
  2.  **Formal Measurement:** The accuracy of a credence function is correctly measured by **strictly proper scoring rules**. We reject ad-hoc measures that permit agents to maximize expected accuracy by adopting incoherent credences.
  3.  **The Defectiveness of Incoherence:** Holding a probabilistically incoherent credence function is always an epistemic defect. There is no possible situation in which an incoherent agent is epistemically preferable to a coherent one.
  4.  **Dominance Arguments:** Incoherent credence functions are *accuracy-dominated* by coherent alternatives. That is, for any incoherent credence function, there exists a coherent function that is guaranteed to be more accurate regardless of how the world turns out.
  5.  **Epistemic/Pragmatic Distinction:** There is a genuine distinction between epistemic justification and pragmatic justification. A credence can be pragmatically useful (e.g., increasing confidence to improve performance) while being epistemically unjustified, and vice versa. Epistemic norms are not reducible to norms of practical rationality.
  6.  **Binding Norms:** Norms such as Probabilism, Conditionalization, and (in appropriate contexts) the Principal Principle are binding epistemic norms. We disagree on the *explanation* for their bindingness, but not on their status as norms.

  ---

  ### 2. Remaining Disagreements and Cruxes

  The table below isolates the three primary cruxes where our views diverge. For each crux, we have identified a specific test case or theoretical result that bears on the dispute. We have pre-registered our predictions regarding how these cases should be evaluated.

  | Crux | The Monist Line ([Friend A]) | The Pluralist Line ([Friend B]) | Test Case & Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. The Derivation of the Principal Principle**<br>*(Is the norm smuggled?)* | The Principal Principle (PP) can be derived from accuracy-maximization alone. By defining accuracy as distance from *truth*, and acknowledging chance as the best guide to truth, minimizing expected inaccuracy *entails* matching credence to chance. No extra norm is needed. | The derivation smuggles the norm in. To derive PP from accuracy, one must define the "target" of accuracy as *chance* rather than *truth* in cases where truth is unknown. This tacitly assumes that respecting chance is a fundamental epistemic goal, not just a heuristic for truth. | **Case:** *The Omniscient Hint.*<br>An agent knows $Ch(P) = 0.5$. A reliable oracle whispers that $P$ is **True**. <br><br>**Monist Prediction:** The rational credence is 1.0. Accuracy targets truth; since truth is known, chance is irrelevant. PP is suspended by knowledge.<br>**Pluralist Prediction:** There is a residual epistemic tension. Even knowing $P$ is true, the agent feels a normative pull to respect the chance (0.5). If PP were purely derivative of truth-seeking, this pull would vanish completely. The persistence of the pull indicates PP has independent value. |
  | **2. The Choice of Scoring Rule**<br>*(Underdetermination vs. Value)* | There exists a unique (or functionally equivalent class of) proper scoring rule(s) that represents *the* epistemic value of accuracy. If different rules recommend different norms, accuracy monism is false. We must find the one true measure of distance from truth. | The choice among proper scoring rules (e.g., Brier vs. Log) is not determined by accuracy alone. Different rules encode different attitudes toward *epistemic risk* (e.g., how bad is it to be confidently wrong?). This risk-attitude is a separate epistemic value, not a fact about accuracy. | **Case:** *The Risky Update.*<br>Compare two updating rules in a scenario where one maximizes expected Brier score and the other maximizes expected Log score, but they diverge on a specific non-probabilistic input.<br><br>**Monist Prediction:** One rule is objectively correct. If Brier and Log diverge, one fails to capture the true "distance from truth." We predict the Log Score (or specific variant) will be vindicated as the true measure.<br>**Pluralist Prediction:** Both rules are legitimate measures of *different* epistemic virtues. The choice between them is a normative choice about how much to penalize extreme error, not a discovery of a metaphysical fact about accuracy. |
  | **3. Epistemic Akrasia & Coherence**<br>*(Final Value of Structure)* | Epistemic akrasia (e.g., believing $P$ while believing one's evidence doesn't support $P$) is bad *only* because it leads to inaccuracy or incoherence. If an akratic state were more accurate, it would be epistemically permitted. | Epistemic akrasia is a fundamental epistemic vice, independent of accuracy. A credence function that violates higher-order coherence is defective *even if* it happens to be more accurate than the coherent alternative. | **Case:** *The Lucky Incoherent.*<br>An agent holds incoherent credences that, by luck, match the truth perfectly (Accuracy = Max). A coherent agent holds credences that are slightly less accurate due to uncertainty.<br><br>**Monist Prediction:** The Lucky Incoherent is epistemically better *qua* accuracy, though perhaps pragmatically defective. If accuracy is the *only* final value, the Lucky Incoherent wins on the only metric that matters.<br>**Pluralist Prediction:** The Lucky Incoherent is epistemically worse. The coherent agent possesses a structural virtue (responsiveness to evidence/coherence) that has final value, outweighing the slight accuracy deficit. |

  ---

  ### 3. Note on Potential Verbal Disputes

  We have identified one area where our disagreement may be partially verbal, specifically concerning the definition of **"Final Epistemic Value."**

  *   **The Issue:** [Friend A] tends to define "Epistemic Value" *as* "Closeness to Truth." Under this definition, it is analytic that accuracy is the only final epistemic value. [Friend B] defines "Epistemic Value" as "Whatever is valued specifically in the capacity of a believer/inquirer," which allows for values like coherence or evidential fit to be included in the set even if they are not strictly truth-conducive.
  *   **Resolution:** We agree that this is not *merely* verbal. Even if we align definitions, the substantive question remains: **Are norms like coherence and evidential fit valuable *because* they track truth, or are they valuable *in addition* to tracking truth?**
  *   **Flag:** If [Friend A] argues that "evidential fit is valuable because it tracks truth," and [Friend B] argues "evidential fit is valuable even when it doesn't track truth (e.g., in the Lucky Incoherent case)," the dispute is substantive. If [Friend A] argues "evidential fit is valuable, therefore it is a type of accuracy," the dispute is verbal. We commit to avoiding the latter move.

  ### 4. Commitment to Future Work

  We agree to treat the **Test Cases** listed above as binding constraints on our future models. If the *Omniscient Hint* case intuitively supports the Pluralist prediction, the Monist must either accept a pluralist amendment or provide a non-question-begging explanation for why the intuition is mistaken. Conversely, if the *Risky Update* case reveals a unique mathematical justification for one scoring rule, the Pluralist must concede that accuracy may be more determinate than assumed.

  **Signed,**

  [Friend A]
  [Friend B]
