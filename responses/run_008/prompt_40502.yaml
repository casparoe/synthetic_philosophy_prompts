answer: |-
  ### Scorecard

  **Move 1 (Ravi): Mostly Mistaken.**
  Ravi's arithmetic is impeccable, but his application is naive. He treats the observed amount $X$ as a fixed constant while simultaneously treating it as a variable dependent on which envelope was selected. By assigning a probability of one-half to the other envelope containing $2X$ or $X/2$ regardless of the value of $X$, he implicitly assumes a uniform prior distribution over all positive real numbers. Since no such proper probability distribution exists, his premise is impossible in any real-world scenario involving finite sums. He has calculated a conditional expectation correctly based on an impossible condition.

  **Move 2 (Marta): Clearly Right.**
  Marta correctly identifies the *reductio ad absurdum* at the heart of the paradox. If the reasoning in Move 1 were universally valid, one would be compelled to swap indefinitely without ever opening the envelopes, which violates the principle of indifference that applies *ex ante*. Her appeal to symmetry is the intuitive anchor that signals a flaw in Ravi's calculation. While symmetry arguments can sometimes be subtle when conditioning on information, in this specific context, her intuition that the *ex ante* expected value of both envelopes must be identical is sound.

  **Move 3 (Ravi): Technically Correct.**
  Ravi is right to point out that *ex ante* symmetry does not guarantee *ex post* symmetry. Once you observe a specific value $X$, you have gained information that could theoretically break the symmetry between the envelopes. For instance, if you knew the maximum possible prize was £100 and you opened an envelope containing £80, you would know you hold the larger amount. Therefore, appealing to symmetry to forbid swapping after observing $X$ is not a rigorous proof on its own; it requires the probabilistic backing Marta provides in Move 4.

  **Move 4 (Marta): Clearly Right.**
  This is the standard resolution to the paradox for any realistic scenario. Marta correctly diagnoses that the "half-and-half" assumption is only valid if the prior distribution of money in the envelopes is scale-invariant (improper). For any proper probability distribution with a finite mean, the probability that the other envelope contains $2X$ must decrease as $X$ increases. When one integrates over the entire prior distribution, the expected gain from swapping vanishes. This move successfully grounds the problem in Bayesian probability theory.

  **Move 5 (Ravi): Mathematically Right.**
  Ravi is correct that there exist specific, albeit pathological, probability distributions where the expected value of switching is indeed positive for every observed $X$. These are cases where the expected value of the money in the envelopes is infinite (such as certain geometric distributions over powers of two). In these specific mathematical constructions, the "paradox" is not a logical error but a genuine feature of infinite expectation. He successfully demonstrates that Move 1 is not *logically* invalid, only practically inapplicable to finite cases.

  **Move 6 (Marta): Pragmatically Decisive.**
  Marta wins the practical argument here. While Ravi's infinite expectation case is mathematically coherent, it renders standard decision theory inert because comparing two infinite quantities is undefined without further constraints. In any "ordinary" context involving finite currency, the expectations are finite, and her objection holds. By categorising Ravi's example as a curiosity rather than a vindication of the original argument, she correctly relegates the infinite case to a boundary condition that does not rescue Ravi's initial claim about standard envelopes.

  ### The real error

  The original switching argument goes wrong in Move 1, specifically in the treatment of the variable $X$. The error is one of **aliasing**. In the calculation $0.5(2X) + 0.5(X/2)$, the symbol $X$ is doing double duty. In the first term ($2X$), $X$ represents the smaller amount (so the other is double); in the second term ($X/2$), $X$ represents the larger amount (so the other is half). However, these are two different states of the world with potentially different probabilities.

  To calculate the expected value correctly, one must fix the total amount in play (say, $A$ and $2A$) and average over the choice of envelope, rather than fixing the observed envelope ($X$) and averaging over the possible total amounts. When you formalise this using a prior distribution $P(A)$, you find that $P(\text{other is } 2X | X) \neq P(\text{other is } X/2 | X)$ generally.

  Marta's diagnosis in Move 4 captures the essence of this error perfectly. By insisting on a "proper distribution over sums of money," she forces the probabilities to sum to one, which mathematically necessitates that the probability of the other envelope being larger must drop as $X$ grows. If the probabilities remained 50/50 for all $X$, the sum of probabilities over all possible values would diverge, violating the axioms of probability. Thus, Move 4 correctly identifies that the "cheat" is the assumption of a flat prior over an unbounded range.

  ### What both miss

  While Marta and Ravi cover the probabilistic and game-theoretic bases well, they both overlook the role of **utility functions**. The entire debate rests on maximising Expected Monetary Value (EMV). However, rational agents maximise Expected Utility, and utility is rarely linear with respect to money.

  If we apply a concave utility function, such as logarithmic utility $U(x) = \log(x)$, the paradox dissolves even in some cases where the monetary expectation is infinite. The utility gain from doubling your money is less than the utility loss from halving it. For example, $\log(2X) - \log(X) = \log(2)$, whereas $\log(X) - \log(X/2) = \log(2)$. Wait, actually, with log utility, the gain and loss are symmetric in utility space. However, with a bounded utility function (e.g., there is a maximum amount of good money can do for you), the incentive to swap vanishes entirely for large $X$.

  Furthermore, neither friend explicitly discusses the **decision-theoretic framework** regarding infinite expectations. Move 6 dismisses infinite expectations as "meaningless," but some schools of thought (such as those dealing with the St. Petersburg paradox) suggest that rational agents should have a finite "cash value" for such games based on their personal wealth. By ignoring utility, they treat money as an abstract score rather than a resource with diminishing marginal returns, which is the ultimate reason why no sensible person would swap indefinitely in the real world.

  ### Where I could be wrong

  My adjudication rests most fragility on the rating of **Move 6**. I have sided with Marta's view that infinite expectations render the comparison "meaningless" in a way that vindicates her overall position. However, there is a rigorous branch of decision theory that argues if the expected value is truly infinite, and one envelope stochastically dominates the other (as in Ravi's Move 5 case), then swapping *is* the rational choice, even if the values are infinite.

  If one accepts that rational agents can and should act on infinite expectations (using tools like relative expectation or finite truncation), then Ravi's Move 5 is not merely a "curiosity" but a genuine counterexample to Marta's claim that the switching argument is always flawed. In that specific mathematical universe, Ravi is right that the 25% gain is a "true fact." My verdict assumes the context is "ordinary pairs of envelopes" with finite means, as implied by the dispute's origin. If the reading group considers abstract decision theory with infinite utilities as fair game, Ravi's defence in Move 5 is stronger than I have credited, and Marta's dismissal in Move 6 might be too hasty.
