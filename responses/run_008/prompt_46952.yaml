      *   **Section 5: Where this leaves functionalism (~100 words)**
          *   *Goal:* Conclusion.
          *   *Content:* Functionalism survives but changed. It's about organizational invariance. It accepts dilution. It's robust because it doesn't rely on physical similarity.
          *   *Drafting:* Functionalism emerges not as a theory of hidden physical essences, but as a theory of organizational invariance. By accepting causal dilution, it avoids the trap of searching for a "pain particle" across species. The theory stands firm on the claim that what matters for mind is the logic of processing, not the physics of implementation. This secures the autonomy of psychology from neuroscience without denying physicalism. The mental state is real because the organizational constraint is real, even if its causal muscle is borrowed. Functionalism survives by admitting it describes the software of the mind, not the hardware.

