  ### Nearest concepts

  The closest established concept is **The Democratic Boundary Problem**, articulated by Frederick Whelan and Robert Dahl. It posits that before a demos can decide rules, the membership of the demos must be decided, yet deciding membership requires a demos, creating a circular regress. Similarly, **Constitutional Regress** in social choice theory examines the infinite chain of rules required to validate preceding rules, asking who designs the constitution. Both highlight that procedural authority lacks a self-justifying foundation. Additionally, **Second-Order Preferences** (Harry Frankfurt) describe agents having preferences about their own preferences, mirroring the shift from outcomes to decision-processes. The classical question **Quis custodiet ipsos custodes?** (Who guards the guardians?) also touches on this oversight hierarchy. These frameworks collectively identify the structural vulnerability of proceduralism: any rule-governed process presupposes a prior rule selecting that process, threatening an infinite backward chain of justification regarding who holds the authority to define the collective will. This connects directly to critiques of the neutral state, where procedural neutrality itself encodes substantive values, yet lacks a term for the sequential escalation you observe. These concepts generally describe static structural paradoxes rather than the dynamic, sequential escalation of disagreement you observe in real-time negotiation. They identify the logical possibility of regress but do not name the pragmatic tactic of using meta-levels to defer substantive conflict indefinitely within a living discourse.

  ### Why each is not quite it

  However, the Boundary Problem is limited to membership eligibility, not the broader substitution of substance with procedure. Constitutional Regress typically addresses historical founding moments rather than an ongoing argumentative tactic used to dissolve live ethical disputes. Second-Order Preferences are intrapersonal psychological states, not interpersonal strategic maneuvers. Crucially, none of these capture the specific *failure mode* you describe: the replication of substantive conflict at every meta-level. Existing terms describe the structural possibility of regress, not the pragmatic phenomenon of stakeholders weaponizing meta-level escalation to avoid substantive commitment while believing they are making progress. They miss how each escalation feels like progress because concrete value judgments are replaced by processes, even though the process itself becomes contested on the same grounds.

  ### Verdict

  Consequently, no single existing label suffices. The phenomenon is not merely a structural paradox but a specific dialectical behavior within normative negotiation. It requires a term that captures the strategic displacement of value conflicts into procedural design, where the conflict persists rather than resolves. In the context of AI alignment and public surveying, precision is vital to distinguish between legitimate meta-governance and unproductive escalation. I propose coining a term to isolate this specific dynamic from general foundational problems, enabling teams to identify when procedural refinement has ceased to be productive.

  ### Definition and boundary cases

  **Term:** Procedural Displacement Regress.
  **Definition:** A pattern where substantive normative disagreements are deferred to procedural mechanisms, but value conflicts re-emerge as disputes over the procedure's parameters, prompting indefinite escalation to higher meta-levels without resolution.
  **Boundary Cases:** This excludes ordinary delegation, where authority is transferred without contest over the transfer mechanism itself. It also excludes standard meta-rule agreements, where parties successfully settle on a process. The regress occurs only when the procedural level reproduces the original substantive contestability. It differs from buck-passing because each meta-level introduces genuine normative complexity; participants are not merely avoiding work but engaging with higher-order norms. It differs from logical infinite regress because it is driven by strategic avoidance of substantive commitment rather than pure logical necessity. The boundary is drawn where procedural design ceases to be a means of resolution and becomes the site of the original conflict. For example, arguing endlessly about who selects the voting method because the method favors certain values constitutes the regress.
