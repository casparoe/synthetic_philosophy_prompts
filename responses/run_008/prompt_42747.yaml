  I work on a team that surveys the public about what AI systems should and shouldn't be allowed to do, and I've started noticing a recurring move in the arguments that follow once the results come in. Whenever we hit a substantive disagreement — should the system track the median respondent or give each subculture a veto over its own domain; how much weight, if any, do future people get — someone proposes to dissolve the disagreement by going up a level: don't decide the question, decide who decides it. Then the same fight immediately resumes at the new level, over who counts as a participant in the deciding-who-decides procedure, over whether the procedure may correct the participants' raw preferences, and so on. Each escalation feels like progress, because a concrete value judgment gets replaced by a process, but I have never seen the process terminate in agreement; it just spawns a more abstract version of the original dispute. It's not simple buck-passing, since the higher level genuinely adds new content, and it's not just the observation that procedures themselves embed values, though that seems related — I gather some political philosophers have said roughly that about the ideal of the neutral state. What I'm after is the specific regress: disagreement → procedure → disagreement about the procedure → procedure-over-the-procedure, indefinitely, with the choice at each level looking about as contestable as the one it was meant to settle. Does this configuration have an established name, whether in political philosophy, social choice, or the philosophy of rules? I'm not looking for a bare label: I want the nearest well-formed concepts, how each differs from what I've described, and which one fits best. If nothing fits, please coin a term, define it so that it's clearly distinct from ordinary delegation and from run-of-the-mill disagreement about meta-rules, and say where you would draw its boundary cases.

  Please structure your answer with the following sections, in this order: "Nearest concepts" (roughly 250 words), "Why each is not quite it" (roughly 150 words), "Verdict" (roughly 100 words), and "Definition and boundary cases" (roughly 200 words).
