answer: |-
  This specification outlines the desiderata for a theory of harm aggregation. It is structured to distinguish between formal constraints required for coherence, substantive moral intuitions that drive the debate, and practical constraints from ordinary judgment. Crucially, it marks where the philosophical literature is settled (mostly on the existence of the problem) and where it is deeply divided (on the solution).

  ### I. Desiderata for an Adequate Theory of Harm Aggregation

  #### A. Case Coverage (The Phenomenology of Harm)
  A theory must deliver verdicts on the following stylized cases without resorting to *ad hoc* exceptions.

  1.  **The Absurd Conclusion (Torture vs. Specks)**
      *   **Case:** A single person suffering 50 years of torture versus $N$ people suffering a dust speck in the eye, where $N$ is sufficiently large.
      *   **Motivation:** This is the engine of the debate. A theory must explicitly validate or invalidate the claim that the specks can sum to outweigh the torture.
      *   **Status:** *Contested.* Aggregators accept the sum; Non-Aggregators reject it.

  2.  **The Sorites Sequence (No Visible Threshold)**
      *   **Case:** A spectrum of harms ranging from a dust speck to torture, where each step is imperceptibly worse than the last (e.g., adding 1 millisecond of pain or increasing intensity by 0.0001%).
      *   **Motivation:** If harm is a continuous magnitude, there should be no "magic point" where moral weight suddenly spikes. A theory must explain why a threshold exists (if it does) without violating the intuition that small differences shouldn't create massive moral chasms.
      *   **Status:** *Contested.* Lexical views accept the spike; Continuity views reject it.

  3.  **Concentrated vs. Dispersed Harm**
      *   **Case:** 1,000 hours of pain borne by one person versus 1,000 hours of pain borne by 1,000 different people (1 hour each).
      *   **Motivation:** Tests the "Separateness of Persons." Does the distribution of harm matter, or only the total sum? Ordinary practice often treats concentrated harm as worse (prioritizing the torture victim over the crowd with headaches).
      *   **Status:** *Contested.* Utilitarianism treats them as equal; Prioritarianism/Contractualism treat concentrated harm as worse.

  4.  **Within-Life vs. Across-Life Aggregation**
      *   **Case:** One person enduring 1,000 minor annoyances over a lifetime versus 1,000 people enduring one minor annoyance each.
      *   **Motivation:** We readily aggregate harms within a single life (I will endure the dentist drill to avoid a toothache later). It is less clear we aggregate across lives. A theory must specify if the unit of aggregation is the "person-moment" or the "life."
      *   **Status:** *Contested.* This is the crux of the "Separateness of Persons" objection (Rawls/Scanlon).

  #### B. Structural Commitments (Formal Properties)
  A theory must declare its stance on these logical properties of the "better-than" or "worse-than" relation.

  5.  **Transitivity**
      *   **Requirement:** If Harm A is worse than Harm B, and Harm B is worse than Harm C, then Harm A is worse than Harm C.
      *   **Motivation:** Required for rational choice and action-guidance. If intransitive, a agent could be money-pumped or paralyzed in decision-making.
      *   **Status:** *Deeply Contested.* Standard in economics and classical ethics; explicitly rejected by some (e.g., Temkin, Rachels) to avoid the Absurd Conclusion.

  6.  **Continuity (Archimedean Property)**
      *   **Requirement:** For any two harms, there is some number of the lesser harm that outweighs the greater harm. There are no lexical gaps.
      *   **Motivation:** Prevents "lexical dictatorships" where a specific type of harm always trumps any quantity of another. Aligns with the view that value is a single continuous scale.
      *   **Status:** *Contested.* Rejected by lexical prioritarians and rights-based views.

  7.  **Additivity (Independence)**
      *   **Requirement:** The badness of a combined state is the sum of the badness of its parts. The value of a harm does not change based on what other harms exist elsewhere.
      *   **Motivation:** Simplifies calculation; aligns with the intuition that "pain is bad" regardless of context.
      *   **Status:** *Contested.* Rejected by views that hold the *distribution* of pain matters (e.g., egalitarianism) or that severity changes the weight (prioritarianism).

  #### C. Distinctions to Maintain (Conceptual Clarity)
  A theory must not collapse these distinct moral quantities.

  8.  **Intensity vs. Duration**
      *   **Requirement:** The theory must distinguish between a very intense, short pain and a mild, long pain, allowing for trade-offs but not treating them as identical.
      *   **Motivation:** Phenomenologically distinct. A theory that equates 1 second of torture with 1,000 years of irritation solely based on a "pain-unit" product fails to capture the qualitative difference.
      *   **Status:** *Broadly Accepted.* Most theories distinguish these, though they disagree on how to weigh them.

  9.  **Number of Sufferers as Moral vs. Arithmetical**
      *   **Requirement:** The theory must specify whether adding a sufferer increases badness *because* there is more pain (arithmetical) or *because* another person is wronged (moral).
      *   **Motivation:** Contractualists argue that harming two people is not just "double the bad" but involves a distinct violation of a second person's standing.
      *   **Status:** *Contested.* Central divide between Consequentialism and Contractualism.

  #### D. Constraints from Ordinary Practice (Reflective Equilibrium)
  A theory must either match or explain away these common judgments.

  10. **Bounded Resource Allocation**
      *   **Requirement:** The theory must not imply we are obligated to eliminate every trivial harm if it diverts resources from preventing grave harms.
      *   **Motivation:** If every dust speck counts equally in the sum, we should spend all GDP preventing minor irritations before funding cancer research. We do not do this.
      *   **Status:** *Pragmatic Constraint.* Often handled by "satisficing" or threshold deontology, but strict maximization struggles here.

  11. **The Mosquito Intuition**
      *   **Requirement:** Explain why we might treat 1,000 bites on one person differently than 1 bite on 1,000 people (if we do).
      *   **Motivation:** We often rush to help the person being swarmed, but we don't treat a global pandemic of single bites as equally urgent.
      *   **Status:** *Empirically Mixed.* People's intuitions vary here; a theory must predict the variance or argue one intuition is mistaken.

  ---

  ### II. Classification of Requirements

  **Non-Negotiable (Formal Coherence):**
  *   **Transitivity:** *With a major caveat.* While some philosophers reject it, a theory that abandons transitivity ceases to be a standard ordering of value and becomes a description of cycles. For a theory to be action-guiding (prescriptive), transitivity is effectively non-negotiable. If you drop it, you must explain how decisions are made without it.
  *   **Logical Consistency:** The theory cannot contradict itself.

  **Contested / Camp-Specific:**
  *   **Additivity:** Demanded by Total Utilitarianism; rejected by Prioritarianism and Contractualism.
  *   **Continuity:** Demanded by Welfarists; rejected by Lexical Views (e.g., Griffin, Raz).
  *   **Person-Neutrality (Arithmetical Counting):** Demanded by Impartial Consequentialists; rejected by those who emphasize the "Separateness of Persons."
  *   **The Absurd Conclusion Verdict:** There is no consensus on whether Torture > Specks. This is the *explanandum*, not a constraint.

  **Consensus in the Field:**
  *   **The Existence of the Problem:** There is consensus that these tensions exist.
  *   **The Impossibility Result:** There is a growing consensus (following Arrhenius, Temkin, Parfit) that *no* theory satisfies all intuitive desiderata simultaneously.

  ---

  ### III. The Impossibility Theorem (The Trilemma)

  You suspected the list itself forms a theorem. You are correct. In population ethics and aggregation literature, this is often formalized as an impossibility result (e.g., Arrhenius's Impossibility Theorems). While a rigorous proof requires formal axioms, the structural tension can be stated as a Trilemma.

  **The Aggregation Trilemma:**
  No theory can simultaneously satisfy the following three conditions:
  1.  **Unrestricted Continuity:** There are no lexical gaps between levels of harm (small changes in intensity do not create infinite jumps in disvalue).
  2.  **Unrestricted Aggregation (Additivity):** Sufficiently many small harms can outweigh a single large harm.
  3.  **The Severity Intuition (Non-Absurdity):** A single instance of extreme torture is worse than any number of dust specks.

  **The Proof Sketch:**
  *   If you accept (1) Continuity and (2) Aggregation, you mathematically necessitate that for any harm $H_{torture}$, there exists an $N$ such that $N \times H_{speck} > H_{torture}$. This violates (3).
  *   If you accept (1) Continuity and (3) Severity, you must reject (2) Aggregation. But if you reject Aggregation, you struggle to explain why we aggregate within lives or why we care about numbers at all (violating Person-Neutrality).
  *   If you accept (2) Aggregation and (3) Severity, you must reject (1) Continuity. You must posit a "lexical threshold" where a tiny increase in pain intensity suddenly makes the harm infinitely (or disproportionately) worse. This violates the Sorites intuition (Case 2).

  **Conclusion:** An adequate theory must explicitly sacrifice one of these three. There is no "cost-free" solution.

  ---

  ### IV. Evaluation of Contenders

  Here is how three natural contenders fare against the specification, highlighting where they break.

  #### 1. The Straightforward Additive View (Classical Utilitarianism)
  *   **Mechanism:** Sum total pain units. $N \times \epsilon$ can exceed $M$.
  *   **Performance:**
      *   *Satisfies:* Additivity, Continuity, Transitivity, Person-Neutrality.
      *   *Fails:* **The Severity Intuition (Non-Absurdity).** It entails the Absurd Conclusion (Torture < Specks if $N$ is high enough).
      *   *Fails:* **Bounded Resource Allocation.** Implies we should prioritize preventing massive quantities of trivial harms over grave harms if the numbers are high enough.
  *   **Verdict:** Formally robust, morally counter-intuitive on the core case.

  #### 2. The Threshold / Lexical View (Prioritarianism / Rights-Based)
  *   **Mechanism:** Harms below a certain intensity threshold cannot aggregate across persons to outweigh harms above the threshold.
  *   **Performance:**
      *   *Satisfies:* The Severity Intuition (Non-Absurdity), Bounded Resource Allocation.
      *   *Fails:* **Continuity.** Requires a "magic point" where a microscopic increase in pain creates a discontinuous jump in moral weight (violates Sorites Case).
      *   *Fails:* **Additivity.** Violates the intuition that two headaches are worse than one, if both are below the threshold.
  *   **Verdict:** Morally intuitive on the core case, formally "jumpy" and vulnerable to Sorites objections.

  #### 3. The Non-Transitive View (Temkin / Rachels)
  *   **Mechanism:** "Better than" is not transitive. Torture is worse than Specks, Specks is worse than Nothing, but Torture is not necessarily worse than Nothing in a summed context (or chains of comparison break).
  *   **Performance:**
      *   *Satisfies:* The Severity Intuition, Continuity (can allow smooth transitions without forcing a sum).
      *   *Fails:* **Transitivity.** This is the explicit cost.
      *   *Fails:* **Action-Guidance.** Makes rational choice difficult (how to choose between intransitive options?).
  *   **Verdict:** Saves the intuitions by breaking the logic of choice. High theoretical cost.

  ---

  ### V. The Single Requirement That Does the Most Work

  The requirement that excludes the most candidates and drives the entire debate is **Continuity (The Rejection of Lexical Thresholds).**

  *   **Why:** If you insist on Continuity, you are forced into either the Absurd Conclusion (Additive View) or Intransitivity (Temkin's View). You cannot have Continuity *and* the Severity Intuition *and* Aggregation.
  *   **Exclusionary Power:**
      *   It excludes most deontological and contractualist views (which rely on thresholds/rights).
      *   It excludes "Common Sense" morality (which believes torture is qualitatively different).
      *   It is the only constraint that, if relaxed (by allowing lexicality), allows a theory to save both Transitivity and the Severity Intuition (at the cost of the Sorites intuition).

  **Final Note on Consensus:**
  Do not write your paper assuming there is a solution. The settled view among experts is that **all** existing theories violate at least one robust intuition. The contribution of your paper should not be to solve the trilemma, but to argue which horn of the trilemma is the least costly to accept. Most contemporary work (e.g., by Arrhenius, Budolfson, Spears) treats the Impossibility Result as a given and focuses on which axiom to drop.
