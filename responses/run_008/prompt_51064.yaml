answer: |-
  **Joint Statement on the Logic of Historical Explanation**
  **Workshop on Interdisciplinary Methodology**
  **Date:** [Insert Date]
  **Signatories:** [Philosopher of Science] & [Historian]

  ### Preamble: Context and Definitions

  This statement concludes a year of structured adversarial collaboration between two longstanding interlocutors regarding the nature of historical explanation. Our debate has often centered on the outbreak of the First World War: whether explaining it requires subsuming events under general regularities or tracing a contingent narrative sequence.

  To ensure this document is accessible to all workshop participants, including graduate students new to this literature, we define the core terms of our disagreement as follows:

  *   **The Covering-Law Model:** The view that to explain an event is to show that it was to be expected (deductively or probabilistically) given certain initial conditions and general laws.
  *   **Narrative Explanation:** The view that explaining an event consists in constructing a coherent story that traces the contingent steps leading from a beginning to an end, where the *connection* of the steps provides the understanding.
  *   **Explanation Sketch:** A term coined by Carl Hempel. It refers to a historical account that omits explicit statement of general laws, relying on the reader to fill them in. The Covering-Law theorist views actual historical writing as consisting mostly of these sketches; the Narrativist views this term as a way to dismiss the actual work historians do.

  We offer this statement not as a resolution of our fifteen-year debate, but as a map of where we stand, what we share, and where we intend to keep fighting.

  ***

  ### Part I: Agreed Claims

  We affirm the following propositions as common ground. Both signatories accept these claims as accurate descriptions of historical practice and methodological norms.

  1.  **On Professional Practice:** Working historians almost never explicitly cite universal laws (e.g., "Whenever nations feel humiliated, they go to war") in their monographs. Any theory of historical explanation must account for the actual text of historical writing, not just an idealized reconstruction of it.
  2.  **On Causal Claims:** The "because" claims historians make are predominantly singular-causal (e.g., "The Kaiser resigned because he lost the support of the generals") rather than law-citing. Both sides agree that identifying specific causal mechanisms is a necessary condition for a successful historical explanation.
  3.  **On Rationality:** A good narrative explanation is retrospective without being irrational. Tracing how a contingent outcome emerged from prior steps is a rational cognitive procedure, not merely an aesthetic arrangement of facts. Conversely, invoking probabilistic regularities does not require historians to produce mathematical predictions akin to physics.
  4.  **On the WWI Case:** Regarding the outbreak of the First World War, both sides agree that an adequate account requires both (a) specific details about decisions made in July 1914 and (b) acknowledgment of broader structural pressures (alliance systems, militarism). Disagreement exists only on how these elements combine to produce *explanation*.
  5.  **On "Mere Description":** Narrative is not "mere description." A chronicle of events is distinct from an explanation. Both signatories agree that a list of events is insufficient; there must be a connective tissue that renders the outcome intelligible.
  6.  **On Tacit Generalizations:** Historical explanations rely on shared assumptions about human behavior (e.g., "actors generally seek to preserve status"). Both sides agree these assumptions are present, though they disagree on whether calling them "laws" clarifies or obscures their function.

  ***

  ### Part II: Residual Disagreements

  While we agree on the features of historical *practice*, we maintain distinct positions on the *logic* that underpins that practice. Each signatory endorses the statement in their respective column as their own position, without necessarily endorsing the other's.

  | **The Covering-Law Position** | **The Narrative Position** |
  | :--- | :--- |
  | **Conceptual Dependence:** Explanation is *conceptually* law-involving. Even when a law is trivial, tacit, or probabilistic, the logical force of "X explains Y" relies on an implicit claim that *if* X occurs, Y is to be expected (with some probability). Without this nomological connection, the explanation is incomplete. | **Configurational Work:** Narrative structure does explanatory work that no mere concatenation of singular causal claims adds up to. The *plot* (the arrangement of beginning, middle, and end) creates the causal significance of the parts. |
  | **The "Sketch" Defense:** Calling historical accounts "explanation sketches" is not an insult to historians. It is a logical observation that the full argument is elided for brevity. The historian's job is to fill in the causal details; the philosopher's job is to note that those details gain explanatory power only by implying generalizations. | **The "Contingency" Defense:** The "contingency-talk" historians use is not an admission of missing laws. It is the substance of the explanation. Showing that things could have gone otherwise *at the time* is how we explain why they went as they did *in retrospect*. |
  | **On Triviality:** The fact that the relevant generalizations are often banal (e.g., "people resent humiliation") does not negate their logical role. A bridge does not cease to be a bridge because it is short. | **On Triviality:** If the generalizations are banal enough to be universally accepted, they do no explanatory work. If they are specific enough to do work, they are no longer laws. Therefore, the "law" model is vacuous in history. |

  ***

  ### Part III: Cruxes and Recorded Predictions

  To prevent retrospective retrofitting of our positions, we record the following specific cruxes. We have committed to revisiting these predictions in five years to determine which view better accommodates new developments in historiography and philosophy of science.

  | **The Crux** | **Covering-Law Prediction (Philosopher)** | **Narrative Prediction (Historian)** |
  | :--- | :--- | :--- |
  | **1. The Completeness Test**<br>If a historian provides a fully spelled-out causal chain of singular events *plus* all relevant trivial generalizations (e.g., "empires overextend"), is the explanation complete? | **Yes.** Once the causal chain and the (even trivial) regularities are made explicit, nothing explanatory is left out. Any remaining "gap" is psychological, not logical. | **No.** This leaves out the *significance* of the outcome. A list of causes plus banalities does not explain why *this* outcome matters or how the specific configuration produced *this* specific historical moment. |
  | **2. The Boundary Problem**<br>Does changing the narrative's starting point or ending point (e.g., ending the story in 1914 vs. 1918) fundamentally change the *explanation* of the war's outbreak? | **No.** The causal facts regarding the outbreak are objective. Changing the narrative endpoint changes the *story*, but not the underlying explanatory relations of the outbreak itself. | **Yes.** The explanation is relative to the narrative structure. If you change the ending, the causal relevance of the beginning changes. The explanation is constituted by the narrative arc, not just the facts. |
  | **3. The Hindsight Objection**<br>Does the historian's knowledge of the outcome illegitimately bias the selection of causes (the "fallacy of hindsight")? | **Yes, potentially.** This is a risk to be managed. The goal is to approximate the probabilistic expectations available to the actors, minimizing the distortion of knowing the result. | **No, necessarily.** Hindsight is the *tool* of explanation. We explain from the end point backward. This is not a bias; it is the structural condition of historical knowledge. |

  ***

  ### Concluding Remark

  We sign this statement acknowledging that we have not converted one another. However, we agree that the friction between these two views produces better history and better philosophy than either would produce in isolation. The historian is reminded to check her implicit generalizations; the philosopher is reminded that the "logic" of explanation must not strangle the practice it seeks to describe.

  **Signed,**

  _________________________  
  [Philosopher of Science]

  _________________________  
  [Historian]
