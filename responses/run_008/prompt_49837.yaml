answer: |-
  # JOINT STATEMENT ON RAWLS, PUBLIC REASON, AND RELIGION
  **An Adversarial Collaboration**

  **Signatories:** The Exclusivist & The Inclusivist
  **Date:** October 26, 2023
  **Subject:** The Role of Comprehensive Doctrines in Political Justification

  We, the undersigned, have spent the past year examining John Rawls's corpus, specifically *A Theory of Justice* (1971), *Political Liberalism* (1993/2005), and the essay "The Idea of Public Reason Revisited" (1997). While we disagree on the normative implications of Rawls's later refinements regarding religion, we affirm the following common understanding of his project.

  ### I. AGREED CLAIMS

  1.  **The Fact of Reasonable Pluralism:** We agree that for Rawls, the "fact of reasonable pluralism" is not a historical accident or a disaster to be overcome, but the natural outcome of the work of human reason under free institutions. Political liberalism takes this fact as the permanent condition of a democratic society, not a temporary failure of consensus.
  2.  **The Historical Problem:** We agree that Rawls's central historical problem is the legacy of the Reformation and the Wars of Religion. The aim is to find a basis for social unity and stability in a society divided by irreconcilable comprehensive doctrines (religious, philosophical, and moral) without requiring citizens to abandon their faith.
  3.  **Liberty of Conscience:** We agree that on Rawls's account, equal liberty of conscience is not a mere *modus vivendi* (a pragmatic compromise between conflicting faiths). It is a requirement of the First Principle of Justice. It is stable because it is morally justified within an overlapping consensus, not merely tolerated due to a balance of power.
  4.  **Public vs. Non-Public Reason:** We agree on the definition of the terms. **Public reasons** appeal to political values (e.g., freedom, equality, fairness) that all citizens, as free and equal, can reasonably be expected to endorse. **Non-public reasons** appeal to the internal truths of comprehensive doctrines (e.g., scriptural authority, specific metaphysical claims) that are not shared by all.
  5.  **Non-Skepticism:** We agree that Rawls explicitly insists political liberalism presupposes no skepticism or indifference toward religious truth. As Rawls states, political liberalism does not assert that religious claims are false; it brackets the question of ultimate truth to answer the political question of legitimacy. The question political liberalism answers is not "What is true?" but "What is justifiable to free and equal citizens?"

  ***

  ### II. AREAS OF DISAGREEMENT

  While we agree on the framework above, we diverge on the application of the **Duty of Civility** and the scope of the **Proviso** introduced in Rawls's later work. The Exclusivist relies primarily on the core formulation in *Political Liberalism* (Lecture VI), while the Inclusivist relies primarily on the refinements in "The Idea of Public Reason Revisited" (1997).

  | Issue | The Exclusivist Position | The Inclusivist Position |
  | :--- | :--- | :--- |
  | **1. Scope of the Duty of Civility** | The duty of civility requires that when citizens vote on or advocate for **constitutional essentials and matters of basic justice**, they must *only* offer public reasons. Religious convictions cannot serve as the *justificatory ground* for coercion in these domains. | The duty of civility allows citizens to introduce comprehensive doctrines (including religious ones) into public political discussion **whenever they wish**, provided they satisfy the proviso. The restriction applies to the *final justification*, not the *initial introduction*. |
  | **2. Sincerity and Integrity** | If a citizen's *real* reason for a political stance is theological, offering a secular public reason is insincere or alienating. It forces a split between the citizen's moral identity and their political voice. To demand public reasons is to demand that theological grounds be left at the door of the voting booth. | The proviso preserves integrity. A citizen can say, "My faith compels me to support X, and here is a public reason why X is just." This allows religious citizens to speak in their own voice while still honoring the requirement of reciprocity. The public reason need not be the *motivating* reason, only the *justifying* reason. |
  | **3. The "In Due Course" Proviso** | The temporal qualifier ("in due course") is decorative or dangerously weak. If religious reasons are permitted in the heat of political debate, they will dominate the discourse, rendering the subsequent offering of public reasons an afterthought or a sham. | The proviso has real bite. It requires that for a law to be legitimate, public reasons must be *sufficient* to support it independently. If no public reason can be found "in due course," the religious ground fails to legitimize the coercion. This filters out sectarian impositions without silencing religious voices. |
  | **4. Textual Authority** | The 1997 essay is a concession that weakens the rigorous standard of *Political Liberalism* (1993). The core argument requires exclusion to ensure the "freestanding" nature of the political conception is not compromised by comprehensive doctrines. | The 1997 essay is a necessary clarification that Rawls always intended. The "wide view" is the mature statement of his theory, correcting the overly restrictive "exclusive view" which risked making political liberalism sectarian against religious citizens. |

  ***

  ### III. CRUXES AND PREDICTIONS

  To move beyond textual exegesis, we identify three sub-questions (cruxes) where empirical or logical resolution would shift our positions. We agree on the following thought experiments to test these cruxes.

  #### Crux 1: Stability and Alienation
  *   **The Experiment:** Compare two idealized societies over a generation.
      *   *Society A (Strict):* Norms enforce strict exclusion of religious language in debates regarding basic justice.
      *   *Society B (Wide):* Norms enforce the Wide View (religious language allowed, proviso honored).
  *   **The Question:** Which society maintains a more stable overlapping consensus among religious citizens?
  *   **Exclusivist Prediction:** Society A will be more stable. Society B will degrade into sectarian conflict because religious reasons are not mutually accessible, eroding trust. The "proviso" will be ignored in practice.
  *   **Inclusivist Prediction:** Society B will be more stable. Society A will produce alienated religious citizens who view the state as hostile to their identity, turning the overlapping consensus into a fragile *modus vivendi*.

  #### Crux 2: The Untranslatable Case
  *   **The Experiment:** A proposed law is supported by a religious group for strictly theological reasons (e.g., the sanctity of a specific biological threshold). No sufficient public reason exists to support this specific threshold, though public reasons exist for related concerns.
  *   **The Question:** Can the law be legitimately enacted under the Wide View?
  *   **Exclusivist Prediction:** No. If public reasons are insufficient, the law is illegitimate. The Wide View obscures this failure by allowing the theological debate to proceed as if it were decisive.
  *   **Inclusivist Prediction:** No. This is where the proviso does its work. If public reasons cannot be supplied "in due course," the Wide View *also* forbids the law. The difference is only in the *process* of discovery, not the *outcome*.

  #### Crux 3: Officials vs. Citizens
  *   **The Experiment:** A Supreme Court Justice writes an opinion upholding a law.
  *   **The Question:** Does the distinction between "citizens" and "government officials" hold?
  *   **Exclusivist Prediction:** The distinction is vital. Officials *must* be exclusive. If citizens are allowed to be inclusive, the pressure on officials to follow suit will become irresistible, collapsing the distinction.
  *   **Inclusivist Prediction:** The distinction is sustainable. Citizens operate in the "background culture" which permeates politics; officials operate in the "public political forum." The proviso binds citizens to translate before the law is finalized, preserving the official sphere's purity.

  ***

  ### IV. ANALYSIS OF VERBAL DISPUTE

  Upon review, we identify a portion of our dispute that appears to be **merely verbal**, specifically concerning the definition of **"Justification"** in the public sphere.

  *   **The Verbal Node:** When the Exclusivist says religious reasons cannot be used for "justification," they mean *legitimating the coercive power of the state*. When the Inclusivist says religious reasons can be used for "introduction," they mean *persuading fellow citizens in the public square*.
  *   **Why it is Verbal:** Rawls sometimes conflates the *context of voting* (where legitimacy is paramount) with the *context of campaigning* (where persuasion is paramount). If we agree that "justification" refers strictly to the final legitimating account of a law (the domain of officials and the final vote), while "advocacy" refers to the broader public discourse (the domain of citizens and campaigning), our positions converge significantly.
  *   **Textual Flag:** This verbal ambiguity stems from Rawls's own shifting definitions between *Political Liberalism* (1993), which emphasizes the duty of citizens *when they vote*, and the 1997 Essay, which emphasizes the "background culture."
  *   **Resolution:** We agree that if the Exclusivist accepts the Inclusivist's "Wide View" applies only to *advocacy* and not *final legitimacy*, and the Inclusivist accepts that the Proviso requires *public sufficiency* for legitimacy, the practical gap narrows. However, a substantive normative disagreement remains regarding whether allowing religious *advocacy* inevitably corrupts the *legitimacy* process (Exclusivist) or strengthens the *stability* of the consensus (Inclusivist).

  **Signed,**

  *The Exclusivist*
  *The Inclusivist*
