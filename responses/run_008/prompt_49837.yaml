      *   Table of disagreements? Yes.
      *   Cruxes with predictions? Yes.
      *   Short section on verbal dispute? Yes.
      *   Grounded in Rawls texts? Yes.
      *   Flag text differences? Yes.

  **(Self-Correction Note):** Make sure to emphasize that Rawls distinguishes between the *background culture* (where anything goes) and *public political culture* (where public reason applies). Both agree on this distinction, but disagree on the permeability.

