  Based on the track record you have provided, your friend is not inconsistent; she is operating under a sophisticated, unified framework that prioritizes **evolutionary independence** over strict reproductive compatibility or morphological difference.

  Here is the analysis of her principle, the predictions for your dinner test, and the specific case that will reveal the limits of her taxonomy.

  ### 1. The Underlying Principle: The Evolutionary Species Concept (ESC)

  The single principle that best reproduces her track record is the **Evolutionary Species Concept** (closely related to the **General Lineage Concept**).

  *   **The Principle:** A species is a single lineage of ancestor-descendant populations that maintains its identity from other such lineages and has its own evolutionary tendencies and historical fate.
  *   **Why it fits her record:**
      *   **Crows (Split):** Despite hybridization, the Carrion and Hooded crows maintain distinct phenotypic identities and evolutionary trajectories across Europe. The hybrid zone is a "tension zone" that does not merge the lineages.
      *   **Mosquitoes (Split):** Though morphologically identical, the chromosomal differences indicate they are on separate evolutionary trajectories with restricted gene flow.
      *   **Rotifers (Split):** Since they are asexual, the Biological Species Concept (BSC) fails. However, under the ESC, distinct clonal lineages evolving independently qualify as species. Her comment that "breeding is beside the point" is a direct endorsement of lineage over reproduction.
      *   **Dog/Wolf (Lump):** Despite massive morphological difference, domestic dogs do not constitute a separate evolutionary lineage from wolves; they are a sub-population nested within wolf genetic diversity (*Canis lupus*) that relies on humans for maintenance. They share the same "historical fate."

  Her comment about "gene pools having fuzzy edges" was likely a layperson's shorthand for **lineage connectivity**. She is not a strict Biological Species Concept theorist (who would lump the crows and struggle with the rotifers) nor a strict Morphological theorist (who would split the dogs). She is a **Lineage Theorist**.

  ### 2. Predictions for Your Test Cases

  Based on the Evolutionary Species Concept, here is how she should verdict your two cases:

  **Case 1: The Ensatina Salamanders (Ring Species)**
  *   **Verdict:** **One Species.**
  *   **Analysis:** In a ring species, gene flow connects the entire chain of populations. While the terminal ends do not interbreed, they are connected via the intermediate populations. Under the ESC, this represents a single, continuous evolutionary lineage that has not yet fully severed its ties. To split them would be to arbitrarily cut a continuous lineage. She lumps Dogs and Wolves because they are one lineage; she should lump the Salamanders for the same reason.

  **Case 2: Polar Bears and Brown Bears**
  *   **Verdict:** **Two Species.**
  *   **Analysis:** Like the Crows, these bears hybridize, but they maintain distinct evolutionary trajectories, ecological niches (ice vs. land), and morphological identities. The hybridization is recent and driven by environmental change, not a merging of lineages. They have separate "historical fates." She split the Crows despite gene flow; she must split the Bears for consistency.

  ### 3. Rival Principles and Where They Diverge

  While the ESC fits best, two rival principles fit most of her record and create ambiguity on your test cases.

  **Rival A: The Cohesion Species Concept (CSC)**
  *   **The Principle:** A species is the most inclusive group of organisms having the potential for genetic and/or demographic exchangeability.
  *   **Fit:** This aligns with her "gene pool" comment. It handles the Crows (low exchangeability despite hybridization), Mosquitoes (blocked exchangeability), and Dogs (high exchangeability). It can handle Rotifers by focusing on *demographic* (ecological) cohesion rather than genetic.
  *   **Agreement:** Like the ESC, the CSC predicts **One Species** for Salamanders (connected by gene flow) and **Two Species** for Bears (distinct ecological niches limit cohesion).
  *   **Disagreement:** The CSC and ESC diverge on **allopatric populations** (see Tie-Breaker below).

  **Rival B: The Phylogenetic Species Concept (PSC)**
  *   **The Principle:** A species is the smallest diagnosable monophyletic group of populations.
  *   **Fit:** Fits Crows, Mosquitoes, and Rotifers perfectly.
  *   **Disagreement:** The PSC often struggles with the Dog/Wolf case (dogs are diagnosable) but can lump them if viewed as nested within wolves. However, the PSC almost invariably **Splits Ring Species** (Case 1) because the terminal populations are diagnosably distinct.
  *   **Prediction:** If she is a PSC theorist, she will call the Salamanders **Several Species**. If she is an ESC/CSC theorist, she will call them **One Species**.

  ### 4. The Tie-Breaker Case

  If she agrees with your predictions (Salamanders = One, Bears = Two), the ESC and CSC remain tied. Both prioritize lineage/ecological distinctness over strict reproductive isolation. To distinguish whether she prioritizes **Lineage History (ESC)** or **Potential Gene Pool Connectivity (CSC)**, pose this realistic case at the table:

  **The Case of the Island Mice:**
  > "Imagine two populations of mice on separate islands. They have been isolated for 10,000 years. They look quite different (distinct fur color and size), but if you bring them to the lab, they mate freely and produce fertile offspring. Are they one species or two?"

  *   **If she says "Two Species" (ESC):** She prioritizes **separate evolutionary fate**. The populations are on independent trajectories, regardless of whether they *could* breed. This is consistent with her Crow verdict (distinctness trumps gene flow).
  *   **If she says "One Species" (CSC/BSC):** She prioritizes **genetic exchangeability**. Because the "gene pool" is theoretically connectable, they remain one cohesive unit. This aligns with her "fuzzy edges" comment but contradicts her Crow verdict (where actual gene flow didn't prevent splitting).

  **Recommendation:**
  Given her history of splitting Crows (actual gene flow) but lumping Dogs (potential gene flow), she values **actual evolutionary independence** over **potential connectivity**. She will likely say **Two Species** for the Island Mice. This confirms she is an **Evolutionary Species Concept** theorist who uses "gene pool" language loosely, rather than a strict Cohesion theorist.

  ### 5. Contingency: If No Single Principle Fits

  If she hedges on the Salamanders or the Island Mice, you may conclude she is a **Concept Pluralist**. This is the view that "species" is a real thing (a lineage), but the *criteria* for identifying them change depending on the organism (reproduction for birds, ecology for bears, clonal stability for rotifers).

  *   **What she would need to add:** She would need to explicitly admit that she switches definitions based on the taxon.
  *   **What she would need to give up:** She would have to abandon the claim that there is one "truth" about species boundaries applicable to all life.
  *   **Why this matters:** Pluralism is scientifically honest but philosophically messy. If she is a Pluralist, your Salamander question might elicit a "It depends on whether you ask a geneticist or an ecologist" answer. If she gives that answer, the dinner conversation shifts from taxonomy to the philosophy of science.

  **Summary for Dinner:**
  1.  **Ask about the Salamanders.** If she says "One," she is a Lineage thinker (ESC/CSC). If "Several," she is a Phylogenetic thinker (PSC).
  2.  **Ask about the Island Mice.** If she says "Two," she is an Evolutionary thinker (ESC). If "One," she is a Cohesion thinker (CSC).
  3.  **Listen for Pluralism.** If she says "It depends," she has outgrown the need for a single principle.
