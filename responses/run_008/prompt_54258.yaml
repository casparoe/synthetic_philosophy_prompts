answer: |-
  This is a profound conceptual challenge that strikes at the heart of what it means to "understand" a neural network. You have correctly identified that the ambition of mechanistic anomaly detection rests on a definition of "mechanism" that is currently philosophically unstable.

  Here is an explanation of the three components you requested, working from your setup and general principles of computation and philosophy of science.

  ---

  ### (a) The Spectrum of Criteria: Why the Middle Ground is Necessary

  To understand why the interventionist criterion is the only viable candidate, we must look closely at why the two extremes fail to capture the specific intuition behind "mechanistic anomaly detection."

  **1. The Failure of the Extensional Criterion (Input–Output)**
  The extensional criterion defines mechanism identity by function: Mechanism $M_1$ is the same as $M_2$ if they compute the same mapping $f: X \rightarrow Y$.
  *   **Why it fails:** As you noted, this conflates *what* is computed with *how* it is computed. In the context of anomaly detection, the fear is not that the model produces a wrong answer (which extensional metrics catch), but that it produces a *right* answer for the *wrong reason*.
  *   **Example:** Consider a model trained to detect spam. On in-distribution data, it might analyze semantic meaning. On an out-of-distribution (OOD) input, it might notice a specific byte sequence that correlates with spam in the training set but is semantically irrelevant. Both produce the label "Spam." Extensionally, the mechanism is identical. Mechanistically, the model has degraded from a semantic analyzer to a pattern matcher. If we only check input–output behavior, we miss the "mechanism switch" entirely, rendering the concept of mechanistic anomaly detection vacuous.

  **2. The Failure of the Token-Physical Criterion (Exact Activations)**
  The token-physical criterion defines mechanism identity by physical state: $M_1$ is the same as $M_2$ if the activation vectors are numerically identical (or isomorphic in a strict linear algebraic sense).
  *   **Why it fails:** Neural networks are continuous function approximators. No two distinct inputs, even from the same distribution, produce identical activation vectors. If mechanism identity requires numerical identity of intermediates, then every forward pass is a unique mechanism.
  *   **Consequence:** This makes comparison impossible. We cannot say a model is "using the same mechanism" on two different pictures of cats if the pixel values differ. We need a notion of mechanism that is invariant to the specific data values but sensitive to the computational structure.

  **3. The Promise of the Interventionist Criterion**
  The interventionist criterion defines mechanism identity by **causal structure**. Two contexts involve the same mechanism if the *dependency relations* between intermediates and outputs are preserved.
  *   **How it works:** This relies on the logic of *causal mediation*. We do not ask "Are the activation values the same?" We ask, "If I force the activation of Unit $A$ to take the value it had in Context 1, does the output in Context 2 change in the predicted way?"
  *   **Carving at the Joint:** This distinguishes between a lookup table and an algorithm. In a lookup table, intervening on a "feature" (e.g., a specific memory address) affects only one specific input. In an algorithm (e.g., addition), intervening on a "carry bit" affects a whole class of inputs structurally.
  *   **Evidence without Collapse:** The evidence here is not the *accuracy* of the output (behavioral), but the **sensitivity profile** of the output.
      *   *Behavioral measure:* "Did the accuracy drop?"
      *   *Mechanistic measure:* "Did the gradient of the output with respect to this specific latent variable remain constant?"
      *   If I ablate a neuron and the output shifts by $+0.5$ in Context A, and I ablate the corresponding neuron in Context B and the output shifts by $+0.5$, they share a mechanism—even if the final predictions differ. This captures the *process* without collapsing into the *result*.

  ---

  ### (b) The Correspondence Problem and Functional Individuation

  You ask whether the requirement to match intermediate variables across contexts leads to a vicious regress, and whether mechanism identity is a "natural kind" or a convention. This maps directly onto the philosophical debate between **Type Identity Theory** and **Functionalism**.

  **1. The Multiple Realizability Challenge**
  In philosophy of mind, Functionalism argues that mental states are defined by their causal roles, not their physical substrate. A "pain" state is the same in a human and an octopus not because their neurons fire identically, but because the state plays the same role (caused by damage, causes avoidance).
  *   **In Neural Networks:** A "feature" (e.g., "detecting a curve") might be realized by a single neuron in Context A, but by a linear subspace of 10 neurons in Context B (a phenomenon known in interpretability as *superposition* or *polysemanticity*).
  *   **The Regress:** To say the mechanisms are the same, we must match the "curve detector" in A to the "curve subspace" in B. But how do we identify the subspace in B? By its functional role. But the role is defined by its connections to other parts... which must also be matched. This looks like a regress: to match the whole, we must match the parts; to match the parts, we must match their roles within the whole.

  **2. Is the Regress Vicious?**
  In strict metaphysics, this can be vicious. In engineering and science, it is usually **benign** because it terminates at the level of **optimization pressure**.
  *   **The Stopping Point:** The "fact of the matter" about which variables correspond is not found in the static weights alone, but in the **loss landscape** that created them. The training process pressures the network to find efficient solutions. If a feature splits from one unit into a subspace, it is because the optimization dynamics found that configuration more robust for the task.
  *   **Natural Kind vs. Convenience:** Mechanism identity is not a "natural kind" in the sense of particle physics (like an electron). It is more like a "biological species" or a "software design pattern."
      *   It is **not arbitrary convention**: You cannot simply *declare* two circuits are the same; the causal structure must support the claim.
      *   It is **level-dependent**: The identity holds relative to a specific granularity of description (e.g., "attention heads" vs. "individual neurons").
  *   **Conclusion for the Researcher:** Mechanism identity is **objectively real relative to a functional specification**. There is a fact of the matter about whether a circuit is implementing "addition" or "memorization," but identifying it requires choosing a vocabulary (a basis of features) that aligns with the model's own internal ontology. The correspondence problem is solved not by finding a perfect mathematical isomorphism, but by finding the **minimal description length** that explains the causal behavior in both contexts. If describing Context B requires positing that Feature X from Context A has split into $X_1$ and $X_2$, that is a factual claim about the mechanism's evolution, not a convention.

  ---

  ### (c) Graded vs. Binary Mechanism Identity

  Finally, should "same mechanism" be a binary switch or a continuous spectrum?

  **1. The Case for Graded Identity**
  Neural networks are smooth, high-dimensional manifolds. Mechanisms rarely "switch" in a discrete, digital sense.
  *   **Gain:** A graded metric captures **partial degradation**. An OOD input might use 80% of the standard circuit and 20% of a heuristic hack. A binary classifier would force a "different mechanism" verdict, potentially triggering a false alarm. A graded score allows for risk assessment: "The model is 90% mechanistically aligned; proceed with caution."
  *   **Loss:** Actionability. Safety systems often require thresholds. If "mechanism switch" implies "unpredictable behavior," a graded score complicates the decision to abort. It shifts the burden from "Is it safe?" to "How much divergence is acceptable?"

  **2. Avoiding Collapse into Behavioral Similarity**
  The risk in making the criterion graded is that it quietly becomes a measure of output similarity. If I define "mechanism similarity" as "correlation of output changes under intervention," I risk measuring how similarly the model *behaves*, not how similarly it *computes*.
  *   **How to Prevent Collapse:** To remain mechanistic, the similarity metric must compare **internal causal graphs**, not just input–output sensitivities.
      *   *Behavioral Similarity:* Correlation between Output($x_1$) and Output($x_2$).
      *   *Mechanistic Similarity:* Correlation between the **Jacobian matrices** of the internal layers.
      *   Specifically, we compare the *direction* of influence. If intervening on Latent $L$ moves the Output Vector in Direction $D_1$ for Input $A$, and in Direction $D_2$ for Input $B$, the mechanism similarity is the cosine similarity of $D_1$ and $D_2$.
  *   **Why this matters:** Two mechanisms could produce identical output changes (behaviorally identical) but via different internal cancellations (mechanistically distinct). A graded mechanistic metric must penalize this. It must measure the alignment of the **mediation paths**.

  **3. Recommendation**
  The interventionist criterion should be treated as **graded**.
  *   **Reasoning:** The "binary" view assumes mechanisms are modular and discrete (like logic gates). Evidence suggests neural representations are distributed and overlapping. A "mechanism switch" is likely a drift in the activation subspace rather than a hard toggle.
  *   **Implementation:** An anomaly detector should report a **Mechanistic Divergence Score**. This score is the distance between the causal influence maps of the in-distribution and the fresh input.
  *   **Caveat:** To avoid collapsing into behavior, the score must be normalized by the magnitude of the intervention. We are measuring the *stability of the causal structure*, not the *stability of the prediction*.

  ### Summary

  1.  **Criteria:** Extensional criteria miss the "how"; Token-physical criteria miss the "generalization." The Interventionist criterion succeeds by isolating the **causal structure** (dependency relations) from the specific data values.
  2.  **Correspondence:** The problem of matching variables is an instance of **Multiple Realizability**. It is not a vicious regress but a search for the **functional basis** that minimizes description length. Mechanism identity is objective relative to the functional roles enforced by training dynamics.
  3.  **Granularity:** Mechanism identity is **graded**. A binary view is incompatible with the continuous geometry of neural networks. However, to remain mechanistic, the grading must measure the alignment of **internal causal pathways**, not just the correlation of output errors.

  The conceptual problem you face is not a bug in the theory, but a feature of the object of study. Neural networks are not digital computers with discrete states; they are dynamical systems. "Mechanism" in this context is a useful abstraction we impose on a continuous flow of information to make it intelligible. The goal of interpretability is not to find the *one true mechanism*, but to find the *most stable functional description* that holds across contexts.
