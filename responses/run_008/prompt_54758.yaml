answer: |-
  Here is the translation of the historiographical debate into your complex systems vocabulary, followed by the residue report and the verdict you asked for.

  ### 1. The Translation

  **The Contingency Thesis (The "Chaos" Claim)**
  In dynamical systems terms, the contingency historians are claiming that the historical trajectory $\vec{x}(t)$ operates in a regime with **positive Lyapunov exponents**. They argue that the distance between two trajectories starting at $\vec{x}_0$ and $\vec{x}_0 + \delta$ (where $\delta$ is a "small accident" like a messenger getting lost) diverges exponentially over time:
  $$ ||\delta(t)|| \approx ||\delta(0)|| e^{\lambda t}, \quad \lambda > 0 $$
  They view history as a high-dimensional, non-linear system often operating near **bifurcation points**, where small fluctuations determine which branch the system selects. In this view, the "state space" is rugged, and the system does not settle quickly into a global attractor; instead, it gets locked into local minima based on early path dependence (increasing returns, network effects).

  **The Deep Causes Thesis (The "Attractor" Claim)**
  The structuralist historians are claiming that the historical vector field $\vec{F}(\vec{x})$ is dominated by **slow variables** and deep potential wells. They argue that while micro-states fluctuate, the macro-state is constrained to a **slow manifold**.
  *   **Geography/Institutions:** These are not state variables; they are *parameters* ($\vec{\mu}$) that define the shape of the potential landscape $V(\vec{x}; \vec{\mu})$.
  *   **Overdetermination:** This is a claim that the basin of attraction for the observed outcome (e.g., "Industrialization") is so wide that almost any initial condition within the relevant region of phase space ends up there.
  *   **Malthusian Pressure:** This is a **limit cycle** or a hard constraint boundary that the system cannot cross until a parameter shift (technology) changes the boundary conditions.

  **The Debate Summarized:**
  The fight is over whether the system is **ergodic** within the relevant timeframe.
  *   **Contingency:** No. The system is non-ergodic; history is a single, non-repeatable trajectory where path matters more than the landscape.
  *   **Deep Causes:** Yes (effectively). If you ran the simulation 1,000 times with varied micro-initial conditions but fixed parameters (geography, tech), the distribution of macro-outcomes clusters tightly. The variance is low; the mean is predictable.

  ---

  ### 2. The Residue Report

  **What Translates Cleanly:**
  *   **Basins of Attraction $\leftrightarrow$ Civilizational Equilibria:** The idea that societies get "stuck" in high-pressure equilibrium traps (Malthus) or liberal democratic stable states maps perfectly to potential wells.
  *   **Phase Transitions $\leftrightarrow$ Revolutions:** Sudden shifts in macro-state driven by the accumulation of stress (pressure) until a critical threshold is breached.
  *   **Reference Class Forecasting $\leftrightarrow$ Ensemble Averaging:** The rationalist "outside view" is mathematically equivalent to assuming the Deep Causes thesis. It assumes you are sampling from a stable distribution defined by the system's parameters, ignoring the specific trajectory sensitivity of your current instance.

  **What Gets Distorted:**
  *   **"Contingency" conflates Chaos with Bifurcation:** Historians use "contingency" to mean two different things.
      1.  *Sensitivity:* The system is chaotic (high $\lambda$).
      2.  *Leverage:* The system was at a critical point (bifurcation) where a small push selected a branch.
      A system can be stable (negative $\lambda$) everywhere *except* at a rare bifurcation point. Contingency historians treat all of history as if it's always near a bifurcation. Structuralists treat it as if it's never near one. The truth is likely intermittent.
  *   **Noise vs. Signal:** In your vocabulary, "noise" is usually uncorrelated Gaussian noise. In history, "accidents" (the nail, the nose) are often **correlated shocks** or **endogenous fluctuations** masquerading as exogenous noise. A king dying is a biological inevitability; *when* he dies is the noise, but the *fact* of succession is structural.

  **What Has No Counterpart:**
  *   **Semantic Content:** Complex systems don't care about *meaning*. A "nail" is just an energy perturbation. To a historian, the nail matters because it carries *information* (a message wasn't delivered). Your vocabulary handles information flow, but standard dynamical systems theory doesn't distinguish between a perturbation that changes the *rules* of the system vs. one that just changes the *state*.
  *   **Counterfactual Validity:** You can simulate counterfactuals in a model. Historians argue about counterfactuals in reality. There is no metric in your vocabulary for "how plausible is this unobserved trajectory" other than model dependence.

  ---

  ### 3. The Two Sticking Points

  **1. The State Space Problem (The Industrial Revolution)**
  You are right to trip over this. This is the fatal flaw in the historians' debate.
  *   **The Issue:** If "Industrial Revolution" is a post-hoc cluster label (a human categorization of a bunch of correlated variables like coal use, urbanization, patents), it is not a coordinate in the state space. It is a **coarse-graining**.
  *   **The Systems Consequence:** You cannot calculate Lyapunov exponents or basin stability on a variable that doesn't exist in the underlying dynamics.
      *   If the state space is *energy capture per capita*, then Industrialization is a phase transition. Deep Causes wins (thermodynamics is inevitable).
      *   If the state space is *specific technological implementation (steam engine + UK law)*, then it is a specific trajectory. Contingency wins (could have been wind/water + Dutch law).
  *   **The Distortion:** When historians argue, the Contingency side defines the state space finely (specific events), and the Deep Causes side defines it coarsely (macro outcomes). They are calculating stability on different manifolds. **Half your vocabulary stops applying because the observation function $O(\vec{x})$ is undefined.**

  **2. The "Narrative Nail" vs. Exogenous Shock**
  *   **The Issue:** Why does a lost message matter more than a flood?
  *   **The Systems View:** In a standard dynamical system, a perturbation is defined by its magnitude and direction in state space. It doesn't matter if it came from a horse or a hurricane.
  *   **The Missing Piece:** **Control Authority.** The "nail" examples are almost always cases where a small input hits a **high-gain control node** in a network (a king, a general, a signaling hub). A flood is a broad-spectrum shock; a lost message is a targeted perturbation of the *information flow* that governs the system's feedback loops.
  *   **Rationalist Connection:** You suspected Reference Class Forecasting is Deep Causes smuggled in. You are correct. Reference Class Forecasting assumes the system is **mixing** enough that your specific trajectory doesn't matter, only the ensemble statistics. It assumes you are deep inside a basin, not near a separatrix. If you are near a bifurcation point, the Outside View fails because the "reference class" splits into two distinct modes.

  ---

  ### 4. The Verdict

  You asked for a definite answer: **The historians' disagreement is less well-posed than it looks.**

  It is not that your systems vocabulary is missing something fundamental about reality; it is that the historians are arguing about **model specification** while pretending to argue about **dynamics**.

  1.  **Undefined Observables:** As you noted with the Industrial Revolution, they cannot agree on the state space. You cannot have a substantive debate about trajectory sensitivity if you haven't defined the dimensions of the space the trajectory moves through. One side is measuring position, the other is measuring momentum, and they're arguing about where the ball will land.
  2.  **Category Error:** The "Narrative Nail" distinction reveals that historians care about *semantics* (agency, intention, meaning), which are emergent properties not easily reduced to state variables. Your vocabulary can model the *effect* of the nail (perturbation at a control node), but it cannot model the *historical weight* assigned to it without importing external value judgments.
  3.  **Intermittency:** The reality is almost certainly that history is **intermittently chaotic**. It spends long periods in structural basins (Deep Causes rules) punctuated by brief windows of bifurcation sensitivity (Contingency rules). The debate persists because each side cherry-picks the time horizon that favors their model.

  **Conclusion:**
  Stop trying to resolve their debate with your vocabulary. Use your vocabulary to **dissolve** it. The question isn't "Is history contingent or determined?" The question is "At what resolution and on what time-scale does the system exhibit positive Lyapunov exponents?"

  If a historian cannot specify the state variables and the time-scale of the attractor, they are not making a falsifiable claim about dynamics; they are telling a story. Your vocabulary is sufficient to see this; the historians' debate is the one that is leaking.
