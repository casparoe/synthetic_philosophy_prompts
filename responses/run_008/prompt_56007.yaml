  # Seminar Plan: The Allais Paradox & Market Discipline

  **Course:** Upper-Level Rational Choice Seminar
  **Class Size:** 14 Students
  **Time:** 90 Minutes
  **Stakes:** "Seminar Bucks" (SB). 10 SB = 1 Extra Credit Point (capped at 2 pts) OR $10 Coffee Voucher. (Pre-announce conversion rate).

  ## 1. Game Rules & Payoffs

  **The Assets:**
  There are two lottery types, scaled down for classroom payouts (multiply Allais millions by $10 for SB).
  *   **Safe (S):** High probability of moderate payout.
  *   **Risky (R):** Lower probability of high payout.

  **Payoff Structure (in Seminar Bucks):**
  *   **Problem 1 (Certainty Frame):**
      *   **1A (Safe):** 100% chance of **10 SB**.
      *   **1B (Risky):** 89% chance of **10 SB**, 10% chance of **50 SB**, 1% chance of **0 SB**.
  *   **Problem 2 (Risk Frame):**
      *   **2A (Safe):** 11% chance of **10 SB**, 89% chance of **0 SB**.
      *   **2B (Risky):** 10% chance of **50 SB**, 90% chance of **0 SB**.

  **The Trading Currency:**
  Every student receives an endowment of **5 SB** cash at the start of Stage 3 to facilitate liquidity.

  ---

  ## 2. Timeline (90 Minutes)

  ### **Stage 1: The Trap (20 Minutes)**
  *   **Action:** All 14 students receive a sealed envelope containing **Problem 1** and **Problem 2**.
  *   **Task:** Privately circle choice 1A or 1B, and 2A or 2B. Sign and submit.
  *   **Instructor Note:** Do not discuss. Collect immediately. Tell them one question will be selected for payout later.
  *   **Goal:** Establish baseline Allais violation rates (typically 1A + 2B).

  ### **Stage 2: The Reframe (25 Minutes)**
  *   **Split:** Divide class into **Group Red (7 students)** and **Group Blue (7 students)**. Seat them apart.
  *   **Group Red (Control):** Receives **Problem 2** again (11% vs 10%).
      *   *Instruction:* "Choose between Lottery X and Lottery Y."
  *   **Group Blue (Treatment):** Receives the **"Common Consequence Resolved"** frame.
      *   *Instruction:* "You are playing Problem 1. However, the 89% common outcome has **already been resolved** in your favor. You are guaranteed the 89% chunk (10 SB) regardless of your choice. You are now choosing only for the remaining 11% probability space."
      *   *The Choice:*
          *   **Option X:** 100% of the remaining 11% yields **10 SB**. (Mathematically 11% total).
          *   **Option Y:** 10/11 of the remaining 11% yields **50 SB**; 1/11 yields **0**. (Mathematically 10% total).
      *   *Engineering Note:* In this frame, the **Expected Value (EV)** of Option Y (4.55 SB) dominates Option X (1.0 SB) within the sub-game, highlighting that if they chose Safe in Stage 1, they are now rejecting EV dominance in the marginal decision.
  *   **Task:** Make the choice. Submit. Do not talk to the other group.

  ### **Stage 3: The Market (20 Minutes)**
  *   **Endowment:** Based on their Stage 2 choice, students receive a **Ticket** corresponding to their chosen lottery (Red or Blue tickets look identical to prevent signaling).
  *   **Rule:** "You hold a ticket. You may keep it or sell it to a classmate for SB cash (from your 5 SB endowment). Prices are negotiated bilaterally."
  *   **Action:** 15 minutes of open trading. Instructor records final transactions and prices.
  *   **Goal:** Test if market pressure forces consistency or if the Allais preference survives contact with trade.

  ### **Stage 4: Debrief & Theory (25 Minutes)**
  *   **Reveal:** Project Stage 1 and Stage 2 results side-by-side.
  *   **Discussion:** See "Debrief Mapping" below.

  ---

  ## 3. Debrief Mapping

  **1. The Violation (Independence Axiom)**
  *   **Map:** Compare Stage 1 choices.
  *   **Theory:** Expected Utility Theory (EUT) requires that if you prefer 1A over 1B, you must prefer 2A over 2B. The 89% common consequence should cancel out.
  *   **Class Data:** Highlight students who chose **1A (Certainty)** and **2B (Risk)**.
  *   **Takeaway:** This is the Allais Paradox. You violated the Independence Axiom.

  **2. The Frame (Common Consequence Effect)**
  *   **Map:** Compare Group Red vs. Group Blue in Stage 2.
  *   **Theory:** Group Red saw raw probabilities. Group Blue saw the "residual" of the Certainty problem. Mathematically, they are identical decisions.
  *   **Class Data:** If Group Blue (who felt they "lost" the certainty safety net) shifted toward Risk more than Group Red, it proves the **Certainty Effect** is psychological, not mathematical.
  *   **Takeaway:** Preferences are constructed by the frame, not just revealed.

  **3. The Market (Stability of Preference)**
  *   **Map:** Analyze trading prices.
  *   **Theory:** If Allais preferences are "true," Safe tickets should trade at a premium. If they are "errors," arbitrage should correct prices toward EV.
  *   **Class Data:** Did Safe tickets trade higher than their EV (1.1 SB) due to the certainty premium? Did anyone arbitrage the difference?
  *   **Takeaway:** If prices remained distorted, the "irrationality" is robust enough to survive market discipline in thin markets.

  ---

  ## 4. Honest Caveats (What this game can't do)

  1.  **Wealth Effects:** 10 SB is trivial compared to lifetime wealth. Real Allais violations often diminish with higher stakes (though not always).
  2.  **Learning:** This is a one-shot game. In repeated markets, subjects often learn to maximize EV, causing the paradox to "evaporate" over time. This session captures the *initial* intuition, not the *learned* behavior.
  3.  **Probability Weighting:** We assume students understand 11% vs 10%. If they don't grasp the odds, the violation is cognitive, not preferential.

  ---

  ## 5. Predictable Failure Mode

  **The "Market Freeze"**
  Because the class is small (14 students) and the Allais preference creates a strong endowment effect (everyone thinks their ticket is special), **liquidity will dry up.** Students who hold "Safe" tickets will demand a certainty premium that "Risky" ticket holders won't pay, resulting in zero trades.
  *   **Mitigation:** As the instructor, act as the "Central Bank." If no trades occur by minute 10, announce you will buy any ticket for its Expected Value in cash. This forces a price anchor and usually jumpstarts trading.

  ---

  Bottom line: Real stakes and market pressure expose the Allais paradox not as a calculation error, but as a fundamental instability in how humans value certainty versus risk.
