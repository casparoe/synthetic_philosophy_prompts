      *   **Task 4 (Well-posedness):** If the broad problem is ill-posed, propose a concrete well-posed replacement.

  2.  **Analyze the "Frame Problem" Landscape:**

      *   **The Narrow (Logical) Frame Problem:** McCarthy & Hayes (1969). How to represent change without enumerating non-changes. *Status:* Largely solved in AI (Successor State Axioms, Circumscription, etc.). The user is right here.
      *   **The Broad (Philosophical/Cognitive) Frame Problem:** Dennett (1984), Fodor (1987, 2000). How does a mind determine *relevant* consequences of an action/belief without combinatorial explosion? It's about *heuristic relevance*, not just logical inertia.
      *   **The Connection:** The term "Frame Problem" is used for both, causing confusion. But is it *just* equivocation?
      *   **The Core Tension:** KR says "We handled inertia." Philosophy says "Inertia isn't the hard part; knowing *which* inertia matters for *this* goal is the hard part."

  3.  **Diagnose the Disagreement (Task 1):**

      *   *Is it verbal?* Partially. They use the same label for different constraints. But calling it *merely* verbal dismisses the substantive link. The logical problem was a proxy for the cognitive one.
      *   *Is it empirical?* Not directly. It's architectural.
      *   *Is it about theory obligations?* **Yes.** This is the strongest diagnosis. The KR camp thinks a theory of cognition needs to show *computational tractability of representation*. The Philosophy camp thinks a theory of cognition needs to show *semantic grounding of relevance*.
      *   *Incommensurable Success Criteria:* KR succeeds when the axiomatization is compact and inference is sound/complete. Philosophy succeeds when the system exhibits "common sense" without brute-force lookup.
      *   *Diagnosis:* It is a **category mismatch between formal sufficiency and cognitive necessity.** The KR camp solved the *representational* constraint (how to write it down). The Philosophy camp is pointing out the *search* constraint (how to find what to write down/read). It's not just verbal; it's a disagreement about the *locus of intelligence*. Is intelligence in the representation (KR) or in the control/selection mechanism (Philosophy)?

  4.  **Define Progress (Task 2):**

      *   If the diagnosis is "locus of intelligence," progress isn't solving the "Broad Frame Problem" as a monolith.
      *   *Decomposition:* We need to separate "Relevance" into:
          1.  *Contextual Salience:* What stands out?
          2.  *Goal-Relativity:* What serves the plan?
          3.  *Abductive Plausibility:* What explains the data?
      *   *Formal Result:* We need a formalism that integrates *cost* into inference, not just truth. (e.g., Bounded Rationality, Resource-Bounded Logic).
      *   *System Class:* Hybrid systems (Neuro-symbolic) where the neural net handles salience/relevance and the symbol system handles inertia/logic.

  5.  **Adjudicate the LLM Claim (Task 3):**

      *   *Claim:* LLMs solve FP via statistical regularities.
      *   *Counter:* LLMs predict tokens, not truths. They hallucinate (fail inertia). They lack explicit world models.
      *   *Verdict:* It's a **red herring that changes the subject from rational relevance to statistical salience.**
      *   *Nuance:* LLMs *do* solve a version of the relevance problem (what word comes next is highly constrained by context), but they do it via correlation, not causal understanding. They bypass the *logical* frame problem by not doing logic, but they inherit a *semantic* frame problem (why is this correlation relevant to reality?).
      *   *Key distinction:* Statistical salience $\neq$ Rational relevance. Salience is "what usually co-occurs." Relevance is "what matters for this goal." LLMs have the former, struggle with the latter (planning tasks).

  6.  **Propose a Well-Posed Replacement (Task 4):**

      *   If "How do we know what's relevant?" is too vague...
      *   *Replacement:* **The Problem of Adaptive Heuristic Search under Resource Constraints.**
