answer: |-
  This is a sharp dissection of the machinery of conscience in American law. You are asking for the political philosophy hidden inside the paperwork of the Selective Service System. To reconstruct the implicit view, we have to look at the draft not as a moral tribunal, but as an administrative state trying to manage a specific risk: the risk of granting exemptions to people who might be lying, or who might be unstable.

  Here is the reconstruction of the theory of conscience presupposed by the original setup, working through your four constraints.

  ### 1. Strict Presuppositions vs. Compatible Theories

  You suspect the real presupposition is thin—about verifiability rather than the moral superiority of religion. I agree, but we need to be precise about *what* is being verified.

  **The Strict Presupposition:**
  The original practice (pre-*Seeger*) strictly presupposes that **conscience requires an external anchor to be legally cognizable.** The state does not need to believe that religious conscience is *truer* than secular conscience; it only needs to believe that religious conscience is *structurally distinct* from mere preference or policy disagreement.

  The mechanism requires a source of authority *outside the self*. By demanding "religious training and belief" (statutorily defined as relation to a Supreme Being), the law presupposes that a valid conscientious objection must be experienced by the claimant as a *command received*, not a *conclusion reached*.

  **Where it is Underdetermined:**
  Several theories of moral conscience fit this practice without being strictly required by it:
  *   **The Stability Theory:** Religious believers are less likely to flip-flop than secular ethicists. (Fits the practice, but the law doesn't prove it).
  *   **The Epistemic Theory:** God is a better ground for morality than human reason. (Fits the rhetoric of some legislators, but not required for the bureaucracy to function).
  *   **The Administrative Theory:** Churches keep records; personal ethics do not. (Fits the practice perfectly).

  **The Counterfactual Test:**
  You asked: *If the real presupposition was just verifiability, would the system have exempted anyone with documented pacifist activism?*
  **No.** And this tells us the presupposition was thicker than mere verifiability.
  If the state only wanted proof of sincerity, a five-year paper trail of pacifist organizing would be *better* evidence than a Sunday school attendance record. Activism demonstrates cost-bearing; church membership demonstrates only affiliation.
  The fact that activism *didn't* count reveals that the state wasn't just looking for **sincerity**; it was looking for **submission**. The original setup presupposes that valid conscience is heteronomous (law comes from outside) rather than autonomous (law comes from within). A secular activist generates their own moral law; a religious objector submits to a higher law. The state trusts the submitter more than the generator.

  ### 2. The Tension: Privilege vs. Neutrality

  You note the tension: The state refuses religious tests for office (Article VI, First Amendment) but effectively requires a religious test to avoid killing. Is this inconsistent?

  **The Resolution:**
  It is not an epistemic inconsistency; it is a jurisdictional one.
  *   **In Access to Power (Office):** The state must be neutral because it is distributing a *good*. To privilege religion here would be to establish a hierarchy of citizenship.
  *   **In Imposition of Burden (Draft):** The state is inflicting a *harm* (forced violence/death). Here, the state is admitting a limit to its sovereignty.

  **The Two-Level Defense:**
  The original arrangement is defensible *if* you view the exemption not as a privilege for religious people, but as a recognition of the state's inability to coerce the "God relationship."
  In the 1940s/50s legal view, the state could compel your body, but it could not compel your soul's relation to the Divine. If God says "No," the State literally *cannot* make you do it without breaking the citizen's fundamental ontological structure.
  Secular morality, in this view, was seen as negotiable. You can reason a man out of a secular position; you cannot reason a man out of a divine command.
  So, the tension resolves like this: Religion isn't epistemically privileged as *truth*, but it is pragmatically privileged as a **limit on state power**. The state says, "We don't care if your God is real, but if you believe He is, we acknowledge we cannot override Him." Secular conscience was viewed as internal to the state's rationality, and therefore overrideable.

  **Is it inconsistent?**
  Yes, insofar as it treats secular moral conviction as "opinion" and religious conviction as "fact of being." But it is a consistent application of a specific political theology: The State is Sovereign over Reason, but not over Revelation.

  ### 3. The Post-*Seeger/Welsh* Picture: Religion as Technology

  *Seeger* (1965) and *Welsh* (1970) secularized the standard. *Welsh* explicitly held that a belief could qualify even if the applicant disclaimed "religious" labels, provided the beliefs occupied a "place parallel to that filled by the God of those admittedly qualified."

  **Does this prove religion is just a delivery mechanism?**
  Yes. This is the critical insight. The shift from "Supreme Being" to "Ultimate Concern" (borrowing from theologian Paul Tillich) reveals that the state was never betting on God. It was betting on **centrality**.

  The post-*Seeger* practice presupposes that conscience is a **functional slot** in human psychology.
  *   **Pre-*Seeger*:** The slot must be filled by "Religion."
  *   **Post-*Seeger*:** The slot must be filled by "Something that functions like Religion."

  **What this tells us about Moral Technology:**
  This suggests the state views religion not as a unique source of moral truth, but as a **technology of commitment**. Religion is a historically proven method for generating beliefs that are:
  1.  Non-negotiable.
  2.  Central to identity.
  3.  Costly to maintain.

  When the Court allowed secular ethics to count, they acknowledged that secularism can deploy the same technology. A deeply held humanist ethic can be just as "ultimate" as a divine command.
  **The Implication:** The original restriction wasn't about the *source* of the morality (God vs. Man); it was about the *structure* of the commitment (Ultimate vs. Provisional). The original lawmakers failed to realize secularism could produce Ultimate commitments. They assumed only Theism could produce that level of friction. *Seeger* corrected the empirical error, not the philosophical framework. The framework remained: *We exempt beliefs that function as absolute constraints.*

  ### 4. The State's Bet: Formation and Behavior

  You ask what view of religious formation the exemption presupposes. By granting the exemption, the state is making a risk assessment.

  **The Bet:**
  The state bets that a religiously formed pacifist is **safe to release.**
  Why? Because religious communities provide **accountability and habit.**
  *   **The Quaker:** Is embedded in a meeting. If he lies to get out of the draft, he risks spiritual standing and community ostracization. His pacifism is reinforced weekly.
  *   **The Secular Loner:** Is accountable only to himself. If he lies, who knows? If he gets out of the draft, does he remain a pacifist, or was this just a survival tactic?

  **Belief vs. Behavior:**
  The original setup presupposes that **belief shapes behavior through community discipline.** It is not just that the belief exists; it is that the belief is *sustained* by an institution the state can indirectly rely on.
  This explains why "documented activism" (your counterfactual) wasn't a substitute. Activism is often *political*. Political commitments change with administrations, strategies, and moods. Religious commitments are framed as *eternal*.
  The state prefers the Quaker because the Quaker's refusal is framed as **incapacity** ("I cannot kill"), whereas the activist's refusal is framed as **choice** ("I will not kill").
  *   **Incapacity** is a medical/legal fact.
  *   **Choice** is a political stance.
  The state can imprison a chooser; it struggles to imprison someone who claims they literally *cannot* perform the act without spiritual death.

  **What if we swapped the view?**
  If the state believed that **autonomous moral reasoning** was equally reliable, the exemption system would have looked like a **moral examination** rather than a **credential check.**
  *   *Current System:* Show us your church letter. (Proxy for stability).
  *   *Alternative System:* Show us your ethical framework and history of consistency. (Direct assessment of conscience).
  The fact that they didn't do the latter proves they did not trust the individual's moral reasoning apparatus. They trusted the *institution* that formed the reasoning.

  ### The Verdict: Prejudice with Paperwork?

  You asked for a considered verdict on whether the original arrangement was defensible or just prejudice.

  **It was administratively rational but morally indefensible.**

  **The Defense (Administrative Rationality):**
  In the context of the 1940s and 50s, the "Supreme Being" requirement was a heuristic for **sincerity and stability.** Local draft boards were composed of laymen, not moral philosophers. Asking them to evaluate the depth of a secular ethical framework would have invited chaos, favoritism, and fraud. Asking them to verify church membership was cheap, fast, and reasonably correlated with stable pacifism.
  From a purely bureaucratic standpoint, it was "epistemics on the cheap." It minimized transaction costs for the state.

  **The Indictment (Moral Indefensibility):**
  However, it fails the test of liberal neutrality. By requiring a "Supreme Being," the state effectively established a theological orthodoxy for the purpose of conscience. It declared that **theistic conscience is real, while secular conscience is suspect.**
  This is prejudice with paperwork because it misidentifies the nature of conscience. Conscience is the capacity to judge right from wrong and act on it. That capacity exists regardless of the metaphysical grounding.
  By privileging the "received command" model over the "reasoned conclusion" model, the state was not just saving money on verification; it was endorsing a specific anthropology: *Man is not moral unless he is answering to a Master.*

  **Final Conclusion:**
  The original setup presupposed that conscience is a **sociological fact** (membership in a pacifist sect) rather than a **human capacity** (moral reasoning).
  *Seeger* and *Welsh* corrected this by recognizing that the *function* of the belief (its hold on the individual) matters more than the *source* (God vs. Ethics).
  The tension you identified is real: The state wants citizens who can reason morally (for democracy) but doesn't trust those same citizens to reason morally about killing (for the draft).
  The original system was defensible only if you view the draft exemption as a **courtesy to powerful institutions** (Churches) rather than a **right of individuals.** Once you view it as a right of individuals, the "Supreme Being" requirement collapses into unconstitutional discrimination. The paperwork wasn't just bureaucracy; it was a gatekeeping mechanism designed to keep the "unanchored" individual out of the exemption zone.

  The state wasn't betting on God. It was betting on **authority.** It trusted the citizen who obeyed a higher authority more than the citizen who obeyed only themselves. That is a coherent political stance, but it is not a neutral one.
