answer: |-
  Here is a complete lesson plan designed to meet your constraints. It uses a "Policy Audit" simulation to isolate the variables of well-being without triggering immediate defensiveness about the Experience Machine.

  # Activity: The Ministry of Well-Being Audit

  **Time:** 75 Minutes
  **Class Size:** 16 Students (4 groups of 4, or work individually then compare)
  **Materials:** Index cards, manila envelopes, pens, projector (optional for timers).

  ## Part 1: The Setup (5 Minutes)
  **The Frame:** Tell the class they are consultants for a futuristic "Ministry of Well-Being." Their job is to audit three candidate lives to determine which citizen had the *highest well-being*.
  **The Rule:** They must allocate **100 "Well-Being Points" (WBPs)** across the three lives. They can give all 100 to one life, or split them. There is no "correct" distribution yet; they must follow their intuition.
  **The Constraint:** They cannot discuss with neighbors until the end of Round 2.

  ## Part 2: The Data Leak (30 Minutes)
  *Prepare 3 Life Profiles (A, B, C). Each profile consists of two index cards inside a sealed envelope.*
  *   **Card 1 (Surface):** The Phenomenological Report (What the life *felt* like from the inside).
  *   **Card 2 (Deep):** The Reality Report (Desires, facts, and external truth).

  **Distribute Envelopes.** Instruct them to open **Card 1 only**.

  ### The Lives (Card 1: Surface/Experience)
  *   **Life A:** "The Golden Haze." Subject reports constant feelings of warmth, accomplishment, and deep connection. They feel deeply loved by their community and believe their life's work is changing the world for the better. Anxiety is near zero.
  *   **Life B:** "The Hard Climb." Subject reports frequent anxiety, physical exhaustion, and periods of doubt. They often feel isolated and worry their efforts are futile. However, they report moments of intense, sharp clarity and 'flow' during work.
  *   **Life C:** "The Quiet Contentment." Subject reports steady, moderate satisfaction. No great highs, no crushing lows. They feel generally safe and comfortable, though they sometimes wonder if there is 'more' to life.

  **Task 1:** Allocate 100 WBPs based *only* on Card 1. (5 mins)

  **Instruct them to open Card 2.**

  ### The Lives (Card 2: Deep/Reality)
  *   **Life A (The Deception):** The subject's desires were for *actual* impact and *genuine* love. **Reality:** Their community is paid actors; their life's work was sabotaged by rivals who let them believe they succeeded. Their desires for truth and real connection were **not satisfied**, though they believe they were.
  *   **Life B (The Real Struggle):** The subject's desire was for *truth* and *actual contribution*, regardless of feelings. **Reality:** Their work did save thousands of lives, though they never received credit and died believing they failed. Their desires for reality and contribution **were satisfied**, though they never knew it.
  *   **Life C (The Unwitting Success):** The subject desired *safety* above all. **Reality:** They were in constant objective danger (financial ruin, health risks) that they were unaware of, but luck protected them. Their desire for safety was **not satisfied** (the risk was real), but their experience remained calm.

  **Task 2:** You may now adjust your WBP allocation based on the full file. (10 mins)
  *(Note: This is where the split happens. Hedonists won't move. Desire theorists will boost Life B. Objective theorists might boost B or penalize A/C heavily.)*

  **Collection:** Have students write their Final WBP scores on the board anonymously (e.g., Student 1: A=80, B=10, C=10). (5 mins)

  ## Part 3: The Scoring Keys (15 Minutes)
  Hand out a **"Valuation Protocol"** sheet. Tell them: *"In policy, you need a formula. Here are three defensible formulas used by different Ministries. Calculate the 'Official Score' for each Life using these three keys."*

  *   **Key H (The Mood Meter):** Score = Intensity of Positive Experience. (Ignore Card 2).
      *   *Result:* Life A wins decisively.
  *   **Key D (The Desire Match):** Score = % of Subject's Major Desires that actually obtained in the world. (Ignore whether they knew it).
      *   *Result:* Life B wins (Desires for truth/impact met). Life A loses (Desires for love/impact fake).
  *   **Key O (The Objective List):** Score = Presence of Objective Goods (Truth, Virtue, Real Friendship).
      *   *Result:* Life B wins (Truth/Virtue present). Life A loses (Falsehood). Life C is mixed (Safety objective failed, but contentment present).

  **Task:** Ask students to look at their *own* Task 2 scores. Which Key (H, D, or O) matches their intuition most closely? Raise hands.

  ## Part 4: The Debrief & Nozick (25 Minutes)

  **1. Map the Intuitions (10 mins)**
  *   "If you kept Life A as the winner after reading Card 2, you are arguing for **Hedonism**. Why did the deception not matter to you?" (Expected answer: "It didn't feel like deception to them.")
  *   "If you switched points to Life B, you are leaning toward **Desire-Satisfaction** or **Objective List**. What was the tipping point? Was it that they *wanted* truth (Desire), or that truth is *good* (Objective)?"
  *   "Did anyone penalize Life C? Why? They felt fine, but the danger was real." (Tests the 'Objective Risk' intuition).

  **2. Reveal the Machine (10 mins)**
  *   Now introduce Nozick. "Life A is a biological version of the Experience Machine. Nozick argues that if Hedonism is true, Life A *must* be better than Life B. Most of you just voted against that."
  *   "Why did the 'facts leaking out' change the value of the life for you, even though the *experience* didn't change?"
  *   Drive home the point: We care about *contact with reality*, not just the *sensation of reality*.

  **3. The Limits of the Game (5 mins)**
  *   Be honest: "In this game, you are auditors. You are safe. Nozick's question is: *Would you plug in?* That involves fear, loss of agency, and the end of your current self. This game isolates the *theory*, but it cannot simulate the *existential weight* of the choice. That's why the machine feels staler in discussion than in your gut."

  ---

  # Instructor Notes & Troubleshooting

  ### What Will Go Sideways (Predictable Failure Points)
  1.  **The "It Depends" Student:** Some students will refuse to allocate points, arguing "Well-being is subjective."
      *   *Fix:* Tell them, "For the sake of the audit, you are the Minister. You must sign the check. Force a decision."
  2.  **The "Life B is Tragic" Objection:** Students might argue Life B is *worse* because the subject died unhappy, even if they did good.
      *   *Philosophical Hook:* This is gold. This is the clash between **Desire Satisfaction** (I got what I wanted) and **Mental State** (I felt terrible). Use this to show why Desire Theory isn't just Hedonism in disguise.
  3.  **Time Creep:** The Card 2 discussion can eat 20 minutes.
      *   *Fix:* Use a visible timer. When Card 2 opens, they have 10 minutes silent to adjust scores. Discussion happens *after* scores are on the board.

  ### What The Game Cannot Reproduce
  *   **The First-Person Stakes:** As you noted, evaluating a third party is cognitively different than choosing for oneself. In the game, they are judging *value*. In Nozick's thought experiment, they are choosing *existence*.
  *   **The "Plug-In" Moment:** The game reveals their theory of value, but it doesn't force them to confront the *irreversibility* of the Machine.
  *   **Honesty about this:** In the debrief, explicitly state: *"This game shows that your theory of well-being isn't purely hedonic. But it doesn't prove you wouldn't plug in if the fear was removed. Nozick knows you'd say 'No,' but he wants to know if you can explain 'Why' without contradicting your own theory of value."*

  ### Materials Prep Checklist
  *   **16 Envelopes:** Labeled A, B, C (mix them up so groups don't all start with the same life, or just give every student all 3 lives to rank). *Recommendation: Give every student all 3 lives to avoid logistics of passing envelopes around.*
  *   **Index Cards:** Print the Life Profiles. Card 1 goes in the envelope. Card 2 goes in the same envelope, folded behind Card 1.
  *   **Score Sheet:** A simple slip of paper with "Life A: ___ pts, Life B: ___ pts, Life C: ___ pts (Total 100)."
  *   **Protocol Sheet:** The H/D/O Keys for the end.

  ### Why This Works for Mid-Level Students
  *   It avoids the "Gotcha!" of the Experience Machine by letting them build the intuition themselves.
  *   It separates **Experience**, **Desire**, and **Objective Fact** into distinct data layers, which is often muddy in verbal discussion.
  *   The "Scoring Key" reveal validates their intuition (whatever it was) as a coherent philosophical stance, rather than telling them they are "wrong" for liking Life A.
