answer: |-
  You have stumbled, quite by accident, into one of the most difficult and active areas of modern moral philosophy: **population ethics**. The disagreement between you and your husband maps almost perfectly onto a debate that has occupied philosophers since the 1970s, most notably Derek Parfit.

  Your friend at dinner was partially right about the stakes, but she may have misidentified which view leads to the troubling conclusion. It is actually your husband's "ledger" (Total Utilitarianism) that logically leads to the idea that we should populate the world with as many "barely worth living" lives as possible (the **Repugnant Conclusion**). Your intuition (the **Asymmetry**) is widely considered the primary philosophical *defense* against that result.

  Here is a breakdown of the two positions, designed to help you answer your two specific questions.

  ### 1. Defending Your Asymmetry
  **Question:** *Is there a principled way to hold that creating a happy life differs in kind from improving an unhappy one... without collapsing under the pressure my friend applied?*

  Yes. Your intuition aligns with what is known as the **Person-Affecting Restriction** (or Person-Affecting View). The core principle is: *An outcome can only be better or worse than another if it is better or worse for some particular person.*

  **The Principled Distinction:**
  *   **Improving an existing life:** If you give your current children better education or healthcare, there is a specific subject (Child A) who is better off than they otherwise would have been. You have benefited *someone*.
  *   **Creating a new life:** If you conceive Child C, there is no subject who exists *prior* to the decision who is benefited by being brought into existence. If you had not conceived her, she would not exist to be deprived of life. Therefore, while her life is *good*, you have not made the world better *for her*.

  **Why This Does Not Collapse:**
  Your friend suggested that your asymmetry leads to the conclusion that we owe the world infinite children. This is incorrect. In fact, the asymmetry is the specific tool philosophers use to *avoid* that conclusion.
  *   If you accept the husband's ledger (Total View), you are forced to agree that a world with 1 billion people living barely tolerable lives is "better" than a world with 10 million people living blissfully, because the *sum total* of happiness is higher. This is the **Repugnant Conclusion**.
  *   Your asymmetry blocks this. Since creating a "barely worth living" life does not benefit anyone (there was no one waiting to be born), you are not morally required to create it. You are only required to avoid creating lives that are *not* worth living (lives of net suffering).

  **Refining the View (Critical-Level Utilitarianism):**
  To make your view robust, you can adopt a **Critical-Level View**. This posits that a new life only adds moral value if its quality of life exceeds a certain threshold (not just "better than nothing," but "positively flourishing").
  *   **The Principle:** We have a strong duty not to create miserable children. We have a weak or non-existent duty to create happy children. We have a discretionary permission to create children if their lives will be *sufficiently* good, but this is not a moral imperative that competes with duties to existing people.
  *   **The Stopper:** This view holds that resources directed toward existing children (or existing needy people) carry more moral weight because those subjects *already exist* to be helped. Redirecting resources to create a new subject is a different category of action entirely.

  ### 2. Steelmanning Your Husband's View
  **Question:** *What is the strongest version of my husband's view... and where, if anywhere, does it stop?*

  Your husband's view is a form of **Total Utilitarianism**. The strongest version of this argument does not rely on vague notions of "goodness" but on the maximization of aggregate well-being.

  **The Strongest Argument:**
  1.  **Impartiality:** From a cosmic perspective, my children's happiness counts no more than any other child's happiness.
  2.  **Additivity:** Goodness is additive. If Life A has 10 units of happiness and Life B has 10 units, a world with both has 20 units.
  3.  **Existence as Benefit:** While the child doesn't exist *before* conception, once conceived, she possesses a life worth living. A world containing her is objectively better than a world without her. To choose a world with less total good (two children) over a world with more total good (three children), when the cost is manageable, is to choose a suboptimal outcome.
  4.  **Charity vs. Procreation:** He argues that saving an existing needy child prevents suffering (negative utility), while creating a new child adds happiness (positive utility). If the new child's life is happy, you are adding to the "light" in the world, not just reducing the "dark."

  **Where Does It Stop?**
  Even on his own terms, the "ledger" does not necessarily demand you have 20 children. A sophisticated Total Utilitarian stops at the point of **Marginal Utility**.
  *   **Diminishing Returns on Siblings:** Adding a third child reduces the resources (time, money, attention) available to the first two. If the third child adds 10 units of happiness, but her presence reduces the first two children's happiness by 6 units each (net loss of 2), the ledger says *stop*. The husband must argue that a third child can be added *without* significantly detracting from the flourishing of the first two.
  *   **Opportunity Cost:** This is the hardest pill for his view. If the cost of raising a third child is $300,000, and that money could save the lives of two children in extreme poverty (who would otherwise die), Total Utilitarianism often suggests you should save the existing children rather than create a new one. (Preventing death is usually weighted higher than adding life).
      *   *His Counter:* He might argue that you are not obligated to give *all* surplus to charity, so you are permitted to spend surplus on your own family expansion. But if he insists the ledger is absolute, he must admit that charity is often a "better buy" for total global utility than procreation.
  *   **The Repugnant Conclusion:** He must accept that, theoretically, if the only way to maximize total good was to have many children with "lives barely worth living," the ledger would demand it. To avoid this, he might adopt **Critical-Level Total Utilitarianism** (agreeing with you that only lives *above* a certain quality threshold count toward the sum).

  ### Synthesis for Your Decision

  You are not arguing about facts (money, space, sleep); you are arguing about **moral ontology**.

  *   **You** view parenting as a **relational duty**. Morality is about how we treat subjects who exist. Creating a child is a permission, not an obligation, because there is no subject to whom the obligation is owed.
  *   **He** views parenting as **cosmic production**. Morality is about the state of the universe. A universe with more happy beings is a better universe, full stop.

  **The Resolution:**
  Most people find the Pure Total View (your husband's strict ledger) too demanding because it turns parents into factories for utility. Most people also find the Pure Person-Affecting View (your strict asymmetry) slightly unsatisfying because it implies a happy child's existence is morally neutral.

  A workable middle ground is often this:
  **Creating a happy life is a "supererogatory" good.** It is a gift to the universe, but not a debt you owe it.
  *   If you *want* a third child, and can raise her well, you are doing a good thing (validating his desire).
  *   If you *do not want* a third child, you are not doing a bad thing (validating your asymmetry).

  The disagreement may not be about the ledger at all, but about **desire**. He may be using the ledger to justify a desire for a larger family; you may be using the asymmetry to justify a desire for closure. The philosophy provides the language, but the decision usually rests on whether you both *want* to undertake the project of a third life, not whether the universe *needs* it.

  If the ledger were truly the deciding factor, you would have to calculate the utility of every dollar spent on your existing children versus donating it to save lives abroad. The fact that you don't live by that ledger in other areas suggests you both intuitively accept that family life operates on special permissions, not just cosmic sums.
