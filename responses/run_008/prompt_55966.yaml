answer: |-
  # Q&A Prep Sheet: Internal Decision Market Pilot
  **Audience:** Architecture Council (12 pax)
  **Goal:** Secure approval for a 3-month pilot on low-stakes prioritization.
  **Tone:** Pragmatic, data-backed, low-theory, high-accountability.

  ---

  ### 1. The VP's Authority (Lethal)
  **Who asks:** VP of Engineering
  **The Question:** "I appreciate the data, but I was hired to make prioritization calls. Are you proposing I outsource my judgment to a betting pool? If this market picks a direction that contradicts my strategic view, am I overruled?"

  **The Reply:**
  "No, and I want to be clear: this is not about replacing leadership judgment; it's about stress-testing it. Right now, when we debate Option A vs. Option B, the loudest voice or the highest rank usually wins. This tool aggregates the private information of the 350 engineers who actually know where the bodies are buried.
  Think of it as a 'confidence vote' with skin in the game. If the market strongly disagrees with your strategic view, that's a massive red flag you should know *before* we commit resources. For this pilot, I propose the market's choice is a *recommendation* with a required written justification if leadership overrides it. We aren't removing your veto; we're making the cost of ignoring the crowd visible."

  **The Soft Spot:**
  *   **Concede:** You cannot bind the VP. If you insist on a binding mechanism, she will kill the project.
  *   **Pivot:** Frame it as "Decision Support" not "Decision Market" for the pilot. The "commitment" is to *consider* the price seriously, not to obey it blindly.

  ### 2. Accountability & Blame (Lethal)
  **Who asks:** The Director (bruised from past fight)
  **The Question:** "Last year we picked a technology that failed. If we use this system and it picks the wrong path, who owns that failure? Do we blame the traders? Do we blame the mechanism? I don't want a system where nobody is responsible for the outcome."

  **The Reply:**
  "Accountability stays exactly where it is now: with the leaders who authorize the work. The market doesn't build the software; the engineering team does. If the market predicts a migration will land in Q3 and it slips, the market was wrong, but the engineering lead is still accountable for the delivery.
  Actually, this *improves* accountability. Currently, if a project fails, we argue about whether the risk was known. With this system, we have a recorded, calibrated probability of success at the time of decision. We stop pretending we knew the future, and start measuring how well we assess risk. It protects leaders from hindsight bias."

  **The Soft Spot:**
  *   **Real Force:** This is a genuine cultural risk. If the market fails publicly, the Director will use it to prove "process fads" don't work.
  *   **Mitigation:** Propose the pilot only on decisions where the "cost of being wrong" is low (e.g., library selection, not architecture overhaul).

  ### 3. Market Manipulation (High Damage)
  **Who asks:** Data Scientists (2 of them)
  **The Question:** "We've seen internal markets before. If a Staff Engineer has a vested interest in a specific technology, they can create multiple accounts or coordinate a 'pump and dump' to skew the price. How do you prevent a coalition from gaming the subsidy to force a bad technical decision?"

  **The Reply:**
  "That's the primary reason we're starting with a pilot and using the existing forecasting platform's identity layer. We limit one account per engineer, and we cap the subsidy payout. More importantly, we aren't using a continuous market; we're using a closed session with audit logs.
  If we see coordinated trading patterns—like five accounts moving the same way in the same minute—we flag it. But honestly, manipulation is expensive even with fake money because it burns reputation. If someone is caught gaming the system to push a pet project, they lose credibility with the Council. We rely on social cost + audit trails, not just math."

  **The Soft Spot:**
  *   **Concede:** You cannot mathematically prevent collusion in a small market (12-50 traders).
  *   **Pivot:** Acknowledge this is why the pilot is *non-binding*. If manipulation is detected, the Council invalidates the round. The threat of invalidation is the deterrent.

  ### 4. Goodhart's Law / Metric Gaming (High Damage)
  **Who asks:** Data Scientists / Staff Engineers
  **The Question:** "You're pricing options based on a metric, say 'incident count' or 'velocity.' As soon as we bet on it, we'll optimize for that metric, not the actual health of the system. We'll game the metric to win the bet, not to help the company."

  **The Reply:**
  "I agree completely. That's why the Council, not the traders, defines the metric *before* the market opens. We pick metrics that are hard to game and aligned with business value, like 'time to first customer ticket' rather than 'lines of code.'
  Also, because this is a conditional market—'What happens if we do A' vs 'What happens if we do B'—you only win if your chosen path *actually outperforms* the alternative in production. You can't just game the number; you have to make sure the option you bet on actually works better than the one you didn't pick. It aligns the bet with the outcome."

  **The Soft Spot:**
  *   **Real Force:** This is the strongest technical objection. Any metric can be gamed.
  *   **Mitigation:** Admit you need a "Metric Veto." If the Council sees the metric being gamed, the market results are voided.

  ### 5. Liquidity & Subsidy Cost (Medium-High Damage)
  **Who asks:** Finance / VP
  **The Question:** "Thin markets are noisy. If only ten people trade, the price is meaningless. To get participation, you're asking for subsidies. How much real money are we burning to buy this data, and is it worth it?"

  **The Reply:**
  "We're not burning cash; we're using reputation points tied to our existing platform, with a small quarterly bonus pool for top performers (e.g., $5k total). The cost isn't the subsidy; it's the engineering time spent trading.
  To solve thin markets, we restrict participation to engineers with domain knowledge. Ten informed traders are better than a hundred random ones. We've seen in our forecasting platform that even small groups (N=20) can outperform individual experts if the incentives are right. We'll track 'cost per decision' and kill the pilot if it exceeds the cost of a single delayed sprint."

  **The Soft Spot:**
  *   **Concede:** If participation is low, the data *is* noise.
  *   **Pivot:** Commit to a minimum participation threshold (e.g., 10% of eligible engineers) or the market result is discarded.

  ### 6. Speed & Overhead (Medium Damage)
  **Who asks:** Staff Engineers (Allergic to process)
  **The Question:** "We move fast. Setting up a market, defining metrics, waiting for trading to close—that sounds like weeks of ceremony. I'd rather just build the spike and see what happens."

  **The Reply:**
  "I hear you. This isn't for every decision. It's for the 'expensive mistakes'—the migrations or re-architecting projects where being wrong costs us a quarter. For those, spending three days to de-risk a three-month project is a good trade.
  We're building templates. Defining the market takes 30 minutes. Trading runs for 48 hours. If the decision is urgent or reversible, we don't use the market. We only use this when the cost of being wrong is high enough to justify the overhead."

  **The Soft Spot:**
  *   **Real Force:** Process drag is a killer.
  *   **Mitigation:** Strictly limit the pilot to *one* decision per quarter. Prove value before scaling.

  ### 7. Reflexivity / Self-Fulfilling Prophecy (Medium Damage)
  **Who asks:** Data Scientists / Skeptics
  **The Question:** "If the market says Option A will succeed, and we choose Option A because the market said so, of course it will succeed—we'll pour all our resources into it. The market isn't predicting the future; it's creating it."

  **The Reply:**
  "That's a valid concern, which is why we price *conditional* outcomes. The market doesn't just say 'A will succeed.' It says 'If we do A, metric X will be Y.'
  We also run markets on both options simultaneously. If the market says 'A will succeed' but also 'B would have succeeded more,' we catch that. The value isn't in the prophecy; it's in the *comparison*. We are trying to find the delta between the two paths, not the absolute outcome."

  **The Soft Spot:**
  *   **Concede:** You cannot fully separate the prediction from the execution in a corporate setting.
  *   **Pivot:** Acknowledge this limits the pilot to decisions where execution effort is roughly equal between options.

  ### 8. Insider Silence (Medium Damage)
  **Who asks:** Staff Engineers
  **The Question:** "The people who actually know the answer are the seniors. They're busy. They won't bother trading fake money. They'll just tell their friends what to bet, or ignore it. So you're just aggregating the opinions of people with too much time."

  **The Reply:**
  "That's why we tie this to calibration scores on the platform people already use. High-calibration traders get more visibility and influence in the system. We're not asking for time; we're asking for a judgment call.
  But you're right: if the seniors don't participate, the market fails. That's why I'm asking the Council to mandate that for this pilot, all Staff Engineers in the relevant domain *must* place at least one trade. We treat it like code review: a required duty for the level."

  **The Soft Spot:**
  *   **Real Force:** Mandating participation can lead to random noise trading.
  *   **Mitigation:** Keep the barrier to entry low (one click) but require a comment justification for large trades.

  ---

  ### The One Question You Hope Nobody Asks
  **The Question:** **"Doesn't this incentivize engineers to sabotage the projects they bet against?"**
  *(Why this is the killer: It turns a theoretical market risk into a direct HR/Security threat. If I bet 'Red Team' will fail, do I stop answering their Slack messages to ensure I win my points?)*

  **The Least-Bad Answer:**
  "That is the single biggest ethical risk, and it's why this pilot must remain non-binding and low-stakes. If real career outcomes or significant bonuses depend on market performance, you create a moral hazard where failure becomes profitable.
  For this pilot, rewards are based on *calibration accuracy* (how close your probability was to reality), not on *which outcome happened*. You win points for correctly predicting a failure, not for causing it. However, I acknowledge this is a cultural boundary. If we see any evidence of collaboration breakdown or sabotage, we terminate the pilot immediately. We are testing information aggregation, not creating a derivative market on our own productivity."

  **Prep Note:**
  *   **Do not bluff here.** If you say "No, that won't happen," you lose credibility.
  *   **Emphasize:** Scoring rules reward *accuracy*, not *optimism*. Being right about a disaster is worth the same as being right about a success.
  *   **Concession:** Be prepared to drop the "real reward" aspect entirely if this question is pressed hard. Make it purely reputation-based for the pilot.

  ---

  ### Strategic Summary for the User
  1.  **Acknowledge Force:** Objections #1 (Authority), #2 (Accountability), and #4 (Goodhart) have real force. Do not try to "win" these arguments. Concede the risk and offer *process controls* (vetoes, audits, metric reviews) instead of theoretical guarantees.
  2.  **Pilot Scope:** Your safety valve is the scope. Repeatedly emphasize: **"One decision. Three months. Non-binding."** If they feel trapped, they will vote no.
  3.  **Leverage Your Asset:** You have 2 years of forecasting data. When challenged on "will this work?", point to the existing platform's calibration scores. "We already know this group can predict; we're just testing if we can listen."
  4.  **The VP:** She is the only veto that matters. Ensure your opening statement frames this as *her* tool for risk management, not a democratization experiment.
