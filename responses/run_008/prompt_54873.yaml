      *   **Task:** Review records for a breeding bird atlas. The specific verification problem is framed as Hempel's Raven Paradox ("Every bird of species S breeding in the county this decade showed trait T").
      *   **Constraint:** Reviewers are volunteers, no stats/philosophy background, high volume (30 records/week, 10 mins/record). Contested cases go to the chair.
