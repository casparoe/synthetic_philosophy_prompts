      Iterative proxy refinement strictly presupposes ontological realism—that a fixed, measure-independent value exists waiting to be approximated. Without a stable latent quantity (genuine health improvement) distinct from its indicators, adding components is not error-correction but arbitrary boundary-policing.

      Your committee's practice reconstructs a theory of measurement as *discovery*. It assumes health outcomes exist prior to measurement, that metrics are noisy signals of this pre-existing truth, and that the measurer and measured are sufficiently independent that observation does not fundamentally alter the target's nature. This theory treats gaming as external noise obscuring the signal, solvable by filtering (adding components). It strictly requires that the target remains stable despite the measurement pressure. It fits well with the view that agents are rational optimizers, but it does not require them to be adversarial—only responsive.

