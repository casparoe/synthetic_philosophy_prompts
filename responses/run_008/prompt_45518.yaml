answer: |-
  You are absolutely right to be suspicious. In formal epistemology, the slogan "Evidence of Evidence is Evidence" (EEE) is notorious for being ambiguous. It sounds like a slam-dunk principle, but depending on how you formalize it, it ranges from a trivial Bayesian truth to a highly controversial claim that violates how rational agents ought to process information.

  Your intuition is correct: the harmless versions don't get your roommate the conclusion she wants (that you must substantially conciliate), and the versions that *do* get her that conclusion are philosophically dubious and risk epistemic akrasia.

  Here is a breakdown of the three distinct claims her slogan could be making, ranked from weakest to strongest. You can use this list to force her to pick which one she is actually defending.

  ### 1. The "Existence Nudge" (Weak Reading)
  *   **The Claim:** The fact that a peer disagrees with me is evidence that *there exists* some line of reasoning or data that supports their conclusion. Therefore, the probability that I am wrong increases slightly (non-zero).
  *   **Plausibility:** **High.** This is almost tautologically true in a Bayesian framework. If a smart person disagrees, it's unlikely they are guessing; they probably have *something* in mind.
  *   **Does it win her argument?** **No.** This reading only justifies a tiny "nudge" in confidence. It acknowledges you might have missed a typo or a subtle step. It does *not* justify dropping your confidence to 50/50 or deferring to her judgment. It treats her disagreement as a signal to double-check, not a signal to surrender.
  *   **Akrasia Risk:** **None.** It is perfectly coherent to think, "I am likely right, but there is a small chance I missed something."

  ### 2. The "Total Evidence" Additive (Moderate Reading)
  *   **The Claim:** The fact of disagreement is a distinct piece of evidence that must be added to the "scale" alongside my first-order evidence (the math I checked). I must weigh my direct calculation against her testimony.
  *   **Plausibility:** **Moderate/High.** This is the standard rational approach. You treat her disagreement as testimony. However, testimony has weight, and direct verification has weight. In math, direct verification usually outweighs testimony.
  *   **Does it win her argument?** **Probably Not.** This reading actually supports *your* position. If you have checked the proof twice, your first-order evidence is extremely heavy. Her disagreement is second-order testimony. Unless she is significantly *more* reliable than you (which you stipulated she isn't; you are peers), the "Total Evidence" view suggests you should remain confident. To get her conclusion, she would have to argue that her testimony weighs *as much as* your direct calculation, which is counter-intuitive in deductive fields.
  *   **Akrasia Risk:** **Low.** You are simply weighing two inputs. If the math wins, you believe the math.

  ### 3. The "Screening-Off" Override (Strong Reading)
  *   **The Claim:** Higher-order evidence (the fact that she disagrees) *screens off* or overrides first-order evidence (the math you saw). Once I know a peer disagrees, I am no longer entitled to rely on my own reasoning because the disagreement proves my reasoning is unreliable in this instance.
  *   **Plausibility:** **Low/Controversial.** This is the "Conciliationist" view. Many philosophers reject this because it severs the link between truth and reasoning. If I *see* the proof, why should I ignore it just because someone else didn't see it? This reading assumes that the *fact of disagreement* is more reliable than the *content of the proof*.
  *   **Does it win her argument?** **Yes.** This is the only reading that forces the substantial conciliation she wants. It demands you split the difference or defer to her, regardless of what your own calculation says.
  *   **Akrasia Risk:** **High.** This is where the incoherence you suspected lives. If you follow this rule, you end up believing: *"My friend is right (I am wrong), even though my direct assessment of the evidence says I am right."* You are believing a conclusion that your own cognitive faculties tell you is false. This is **epistemic akrasia**: believing $P$ while believing that your evidence supports $\neg P$.

  ---

  ### Crucial Caveat: The "Math" Factor
  You need to point out that EEE is typically discussed regarding **empirical** claims (e.g., "Did it rain?" "Is this medicine safe?"). Math is **deductive**.

  *   **In Empirical Science:** Evidence is fallible and probabilistic. Peer disagreement suggests I might have interpreted the data wrong. EEE has more bite here.
  *   **In Math:** If the proof is valid, the conclusion is necessarily true. Disagreement doesn't mean the theorem is "probably false"; it means one of us made a processing error.
  *   **The Knockout Point:** If you have checked the math *twice*, the probability of a processing error is low. Her disagreement is evidence of *her* processing error, not necessarily yours. Applying the "Screening-Off" view to math implies that if enough people disagree with a proof, the Pythagorean theorem could become false. That is absurd.

  ### Strategy for Round Two
  Don't let her hide behind the slogan. Ask her these three questions:

  1.  **"Are you claiming I should just nudge my confidence, or abandon my calculation?"** If she says nudge, you win (that's your position). If she says abandon, she is committed to the **Screening-Off** view.
  2.  **"Does your rule apply to math the same way it applies to guessing the weight of a pumpkin?"** If she says yes, press her on whether 1,000 people disagreeing with a simple addition problem makes $2+2=5$ probable.
  3.  **"If I follow your rule, don't I have to believe I'm wrong while simultaneously seeing that I'm right?"** Call this out as **epistemic akrasia**. Ask her if she thinks it's rational to hold beliefs that contradict your own assessment of the evidence.

  **Summary for your notes:**
  *   **Weak Reading:** True, but useless for her.
  *   **Moderate Reading:** Plausible, but likely supports *you* (your evidence is heavier).
  *   **Strong Reading:** Useful for her, but dubious and leads to incoherence (akrasia).

  If she insists on the Strong Reading, the burden of proof is on her to explain why your direct access to the proof counts for *nothing* once she opens her mouth.
