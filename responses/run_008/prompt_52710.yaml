  1.  **The $20 Bill vs. The Big Dipper:** Rule 2 struggles here. The Big Dipper is physically "out there" in the sky, yet she calls it unreal because it lacks causal bonds. The $20 Bill is socially constructed, yet she calls it real. The differentiator is not "independence from observers" (since the bill depends on observers), but **independence from *mere* description**. The bill *does* something; the Dipper does not.
  2.  **The Average American:** This is the smoking gun. The "Average American" is a robust statistical fact (Rule 2 might call it real). She calls it *not* real because it is "just a summary." It lacks *leverage*. It doesn't help you predict anything the raw data didn't already say.
  3.  **Dennettian Orthodoxy:** Dennett explicitly argues that reality is a matter of pattern recognition that saves on computational cost (compression). He is a pragmatist, not a realist. Your sister's verdict on Sherlock Holmes ("no fact of the matter") is pure pragmatism; a realist would say Holmes is simply *false*, not that truth values vanish.

  ***

  ### Part 4: The Crucial Experiment

  To cleanly separate **Predictive Pragmatism** (Rule 1) from **Observer Robustness** (Rule 2), you need a case that is **highly predictive** but **highly vantage-dependent**.

  **The Case: The "Median Voter"**
  Present her with this scenario:
  > "In political science, the 'Median Voter' is the theoretical person exactly in the middle of the political spectrum. Candidates design their entire campaigns to appeal to this person. Elections are predicted with high accuracy based on where this voter stands. However, no such person actually exists; it is a statistical coordinate, like the Average American."

  **Why this separates the rules:**
  *   **Rule 1 (Predictive Pragmatism) predicts: REAL.**
      *   *Reasoning:* Treating the "Median Voter" as an agent with desires allows campaigns to predict election outcomes and allocate resources successfully. The physical stance (counting individual ballots) is too computationally expensive to guide strategy. The pattern buys leverage.
  *   **Rule 2 (Observer Robustness) predicts: NOT REAL.**
      *   *Reasoning:* There is nobody to point to. If you change the voting system or the demographic sample, the "Median Voter" moves or vanishes. It is an artifact of the modeler's vantage, much like the Average American.

  **Interpretation:**
  *   If she says the Median Voter is **Real** (unlike the Average American), she confirms that **Causal Leverage/Predictive Utility** is her true rule. She distinguishes the two because the Median Voter *drives behavior* (candidates move), whereas the Average American is just a *record of behavior*.
  *   If she says the Median Voter is **Not Real** (like the Average American), she is prioritizing **Ontological Robustness**. She would argue that because the Median Voter cannot act (only candidates act *on behalf* of it), it is a mere fiction.

  Given her verdict on the $20 Bill (which acts only because people act on it), I predict she will call the Median Voter **Real**, cementing Rule 1 as her operating system.
