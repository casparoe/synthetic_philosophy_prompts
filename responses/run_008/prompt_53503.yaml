answer: |-
  Hi everyone, I hope you are all managing the reading load okay. I have been thinking a lot about our recent discussions on cognitive penetration and specifically about the analogy our instructor keeps using, the one that likens perception to a scientist forming hypotheses. It is a vivid picture, and I agree that it deserves some pressure testing before we rely on it for our term papers, especially since so much hinges on whether it successfully distinguishes cognitive penetration from neighboring phenomena like attention or perceptual learning. I wanted to share an audit of how the mapping works, where it breaks, and whether those breaks actually matter for the specific claims our instructor is drawing from it.

  To start with the mapping itself, we need to be precise about what corresponds to what in this picture. In the analogy, the brain or the visual system plays the role of the scientist. The hypotheses that the scientist entertains correspond to the perceptual representations or generative models that the brain constructs to make sense of the world. The data or evidence collected by the scientist maps onto the sensory input or retinal stimulation that arrives from the environment. The priors held by the scientist correspond to the background beliefs or expectations that the subject brings to the perceptual situation. The process of experimentation maps onto the cycle of prediction and error correction where the system tests its model against incoming signals. The revision of the theory corresponds to the updating of the perceptual experience when prediction errors are minimized. Finally, the scientist herself, as the agent of inquiry, is supposed to be the subject whose conscious experience is constituted by the winning hypothesis.

  Once we lay out these correspondences, however, several disanalogies become apparent. Some of these are clearly superficial. For instance, actual scientists publish their methods, risk their reputations, and work within social institutions, whereas the brain does none of these things. These breaks do not matter for our purposes because they do not close off the channel by which belief content could influence perceptual content. Whether the brain seeks tenure or not has no bearing on whether a prior belief can alter the semantic content of a visual experience. We can safely ignore these social and institutional differences because they are irrelevant to the internal mechanics of inference and penetration.

  However, there are deeper disanalogies that seem potentially fatal, and these are the ones we need to filter through the test you proposed. The test is that a disanalogy matters only if it closes off a channel by which the content of beliefs, as opposed to mere causal traffic, could rationally influence perceptual content. The most significant break here is the distinction between personal-level reasoning and subpersonal processing. A human scientist consciously entertains hypotheses, can articulate reasons for accepting them, and can be argued out of them by counter-evidence or logical critique. In contrast, the visual system's hypotheses are subpersonal states that the subject cannot entertain, reject, or justify. You cannot argue yourself out of a visual illusion simply by believing it is an illusion, as seen in cases like the Müller-Lyer lines where knowledge fails to change appearance. This disanalogy matters profoundly because it suggests that the influence of priors on perception might not be rational in the epistemic sense required for cognitive penetration. If the visual system updates based on statistical weights and causal history rather than reasoned belief revision, then what is happening looks more like perceptual learning or sensory adaptation than genuine cognitive penetration. In perceptual learning, repeated exposure changes sensitivity, but that is a causal change in the hardware, not a semantic influence of a current belief. If the brain is a scientist that refuses to listen to argument, it is not functioning as a rational agent, and thus the channel for rational influence of belief content is closed.

  Another relevant disanalogy concerns the nature of the content involved. Scientific hypotheses are typically propositional and conceptual, structured like sentences in a language of thought. Perceptual content, however, is often argued to be analog, non-conceptual, or iconographic. If the winning hypothesis is a non-conceptual map of spatial frequencies rather than a proposition like there is a bird, then the mapping between belief content and perceptual content is not direct. This matters for the test because if the formats do not match, beliefs cannot directly constitute perceptual content without a translation layer that might strip away the specific semantic value of the belief. This raises the possibility that what looks like penetration is actually a shift in response criterion, where the subject decides to report seeing a bird based on belief, even though the visual appearance remains indistinct. The analogy risks conflating a change in what we judge we see with a change in what we actually see, and since the visual system does not output truth-apt sentences, the mechanism for semantic penetration is obscure.

  Given these surviving disanalogies, we need to evaluate the instructor's two conclusions. The first conclusion is that perception is cognitively penetrable because beliefs function as priors. If we accept the disanalogy regarding rational access and the stubbornness of illusions, this conclusion is significantly weakened. The predictive processing model does show that top-down flow exists, but it does not guarantee that this flow is driven by the subject's current beliefs in a way that alters the content of experience rather than just the weighting of evidence. If the priors are encapsulated statistical regularities learned over a lifetime rather than the ornithologist's current belief about sparrows, then we have secured perceptual learning but not cognitive penetration. The analogy supports the idea that perception is influenced by the past, but not necessarily that it is penetrated by the present content of belief in a rational manner. Therefore, the first conclusion survives only in a weakened form where penetration is redefined as any top-down causal influence, stripping it of the semantic and rational force that makes it philosophically controversial.

  The second conclusion is more ambitious, claiming that this undermines any hope of a theory-neutral observational vocabulary because there is no stage of processing beliefs leave untouched. This conclusion is even more vulnerable to the disanalogies. The worry about theory-ladenness usually presumes that the theories contaminating observation are the scientist's own conceptual frameworks. But if the hypotheses generating perception are subpersonal and non-conceptual, they are not theories in the epistemic sense. They are functional mechanisms. Even if every stage of processing is influenced by these subpersonal priors, it does not follow that the subject's observational vocabulary is theory-laden in a way that undermines justification. The subject might still have access to a level of appearance that is distinct from their conceptual commitments, even if the brain is busy predicting behind the scenes. The disanalogy regarding the level of access matters here because if the subject cannot access the hypotheses, she can still treat her experience as a given relative to her theories. Thus, the argument that predictive processing eliminates the given relies on conflating subpersonal prediction with personal-level theorizing. Consequently, the second conclusion does not survive the audit intact, as the lack of rational access to the visual hypotheses means they do not function as theories that could bias observation in the epistemically damaging way the instructor suggests.

  That said, a weakened version of the scientist picture might still carry the penetration claim if we adjust our expectations. If we view the brain as a blind scientist, one that operates automatically without conscious rational control, we can maintain that perception is constructed and influenced by prior states. This supports a causal version of penetration where expectations shape experience, but it abandons the claim that this process is responsive to reason or that it dissolves the distinction between observation and theory at the personal level. This weakened view distinguishes itself from attention because attention selects which data is processed, whereas this blind scientific process determines how the data is interpreted. It distinguishes itself from response criterion because the change is in the perceptual representation itself, not just the decision to report it. However, it concedes that this influence is not a rational dialogue between belief and sight, but rather a functional optimization by a subpersonal system.

  In sum, while the analogy is heuristically powerful for explaining predictive processing, it overextends when used to secure strong claims about cognitive penetration and the death of the given. The disanalogies regarding conscious access, rational defeasibility, and content format close off the channels for rational influence that are essential for the strong philosophical claims our instructor is making. We can likely use the analogy to argue that perception is active and constructive, but we should be cautious about using it to argue that our beliefs rationally determine what we see or that we lack any neutral ground for observation. I think there is enough here for a nuanced paper that accepts the predictive framework but rejects the stronger epistemic conclusions drawn from it. I would love to hear what you all think about this distinction between the subpersonal mechanism and the personal-level epistemic status, especially regarding how we define the content of the priors. Let me know if this aligns with your reading of the seminar texts. Best of luck with the drafting.
