answer: |-
  **The Lakatos Lab: Research Programme Race**

  **Setup & Materials**
  Divide 18 students into 3 rival "Research Programmes" (6 per group). Each group receives a whiteboard divided into **Hard Core** (3 immutable axioms) and **Protective Belt** (adjustable auxiliary hypotheses). You need a deck of 4 "Data Cards" (empirical findings) and a hidden "Degeneration Log" for your records.

  **Rules & Scoring**
  Run 4 Rounds. Each round, hold up a Data Card face down. Groups confer and submit one move:
  1.  **Stand Firm:** Claim current Belt covers the data. (Reveal Card: If consistent, +10 pts. If inconsistent, -10 pts & forced adjustment).
  2.  **Adjust Belt:** Modify auxiliaries to absorb the data. (Guaranteed +10 pts. Mark 'Ad-Hoc' on your hidden Log).
  3.  **Novel Prediction:** Stake a specific claim *before* revealing the Card. (If match: +25 pts. If miss: 0 pts).

  **Crucial Mechanic:** Design Data Cards so Novel Predictions are risky (specific values) while Adjustments are easy (broad parameters). This allows a group that always Adjusts (degenerating) to accumulate steady points (40 pts), while a group attempting Novelty (progressive) might miss repeatedly (0–25 pts). The degenerating group can win on points despite accumulating 'Ad-Hoc' marks.

  **Timeline (90 mins)**
  *   **Intro (10 mins):** Explain Hard Core/Belt. Groups write axioms.
  *   **Simulation (40 mins):** 4 Rounds (10 mins each). Reveal data, score moves, update boards.
  *   **Debrief (40 mins):** Reveal hidden Log. Discuss results.

  **Debrief Guide**
  1.  **Map Concepts:** Ask winners to identify their Hard Core (unchanged) vs. Belt (changed). Ask who attempted Novel Predictions.
  2.  **The Degeneration Paradox:** If the winning group has the most 'Ad-Hoc' marks, ask: "You won the game. Did you feel rational?" (Yes: we survived/scored). "Was your science progressive?" (No: post-hoc fixes).
  3.  **Internal vs. External:** Use this to distinguish the scientist's perspective (maximize points/survival now) from the historian's (identify degeneration later).
  4.  **The Comeback Case:** Pose: "Suppose next semester, this 'degenerating' programme predicts a massive anomaly rivals can't absorb. Is past degeneration a reason to defect now, or does Lakatos's 'rational reconstruction' accommodate late recoveries?" This probes whether MSRP is a decision procedure or a historical tool.

  **Predictable Pitfalls & Fixes**
  1.  **Hard Core Drift:** Students will subtly tweak axioms to save points. **Fix:** Act as strict referee; veto any change to the original 3 axioms.
  2.  **Gamification:** Students may treat it as trivia, not theory. **Fix:** Require verbal justification for adjustments using their specific theoretical terms.
  3.  **Time Creep:** Rounds often overrun. **Fix:** Use a visible timer; force submission at 8 minutes.

  **Simulation Limitation**
  This simulation cannot reproduce **scientific consensus**. In reality, a degenerating programme loses funding and prestige even if logically consistent. Here, points are objective. You must supply this social pressure by fiat during the debrief: "In reality, your rivals would have stopped citing you after Round 2, regardless of your score." This highlights that Lakatos's methodology describes logical reconstruction, not necessarily the sociological reality of funding and peer review.
