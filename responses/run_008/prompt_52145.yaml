      *   *Input Channel:* When RGB is unmasked, is it inference time or fine-tuning? The prompt says "unmasked... last month." Implies fine-tuning or adapter training. I should assume the weights update to accommodate the new stream.
      *   *The "New Thing":* If the weights update, the model *has* changed. But is it new *knowledge*? It's new *capacity*. I need to distinguish between *information content* and *representational format*.

  11. **Final Polish:** Ensure the distinction between *weights* (long-term memory/physics) and *activations* (experience) is clear. This is the strongest ML parallel to the philosophical distinction.

  *(Self-Correction during final review)*: Make sure I answer the specific prompt: "is the residue evidence that my vocabulary is missing something real, or evidence that the knowledge argument was never as clear as it looked?" I need to pick a side or synthesize. I will argue it shows the Knowledge Argument conflates *representation* with *reality*.

  12. **Drafting the Content:** (Mental outline of the specific sections to ensure all constraints are met).
