answer: |-
  You have accurately identified a real, well-studied phenomenon, and your intuition that existing terms like "Goodhart's Law" or "Observer Effect" are *close but not quite it* is correct. You are describing a structural property of systems where the abstraction layer becomes a causal dependency of the implementation layer.

  There are three names for this, depending on which field you ask. For your context (backend/ML/systems), the most precise umbrella term is **Reflexivity**, the specific mechanism is **Performativity**, and the ML-specific version is **Performative Prediction**.

  Here is the carving you asked for: the definition, the distinctions, and the boundary cases.

  ### 1. The Names

  **A. Reflexivity (Systems & Finance)**
  Popularized by George Soros in finance and rooted in sociology. It describes a feedback loop where the participants' *view* of the system changes the *fundamentals* of the system.
  *   *Why it fits:* It covers your dashboard example. The team's view of the metrics (the representation) changed their behavior (the system), which changed the metrics.
  *   *Why it might feel off:* It's often used in social contexts, not technical docs.

  **B. Performativity (Sociology of Science)**
  Specifically **Barnesian Performativity** (named after sociologist Barry Barnes). This is the claim that a representation of reality doesn't just describe the world, but *enacts* it. The theory makes itself true by being used.
  *   *Why it fits:* This is the exact philosophical "carving" you want. It explains why the dashboard isn't just measuring bugs, it's *creating* the bug classification behavior.
  *   *Key distinction:* In a normal model, Truth $\rightarrow$ Model. In a performative model, Model $\rightarrow$ Truth.

  **C. Performative Prediction (Machine Learning)**
  This is a recent formalization (Perdomo et al., 2020) that matches your Example 2 exactly. It occurs when the predictions of a model influence the data distribution on which the model is evaluated.
  *   *Why it fits:* It treats the phenomenon as an engineering constraint. You cannot assume i.i.d. (independent and identically distributed) data because the model's output shifts the input distribution.

  ### 2. The Carving: A Definition for Engineers

  If you want a term to use in meetings that captures the mechanism without the philosophical baggage, I suggest **Constitutive Representation** or **Representational Coupling**.

  **Definition:**
  > A system exhibits **Representational Coupling** when its internal or external representation (model, metric, doc) becomes a writable dependency in the system's causal graph. The representation ceases to be a read-only snapshot and becomes an active component that alters the state it claims to describe.

  **The Mechanism (Downward Causation):**
  In a standard system, causality flows "up": Low-level events (code execution, user clicks) generate High-level data (logs, metrics).
  In your pattern, causality flows "down": High-level data (docs, dashboards, predictions) constrains or directs Low-level events.
  Philosophers call this **Downward Causation**. The abstraction layer exerts force on the implementation layer.

  ### 3. Why Your Rejections Were Correct

  You were right to discard the other terms. Here is the precise boundary:

  | Concept | Mechanism | Why it's not your pattern |
  | :--- | :--- | :--- |
  | **Observer Effect** | **Physical Interference.** The act of measuring consumes energy/resources, altering the state *during* measurement (e.g., a profiler using CPU). | Your pattern persists *after* measurement. The dashboard changes behavior even when no one is actively looking at it, because the *existence* of the metric changes incentives/understanding. |
  | **Goodhart's Law** | **Adversarial Optimization.** "When a measure becomes a target, it ceases to be a good measure." Requires an agent actively gaming the metric. | Your Example 3 (docs) has no target and no gaming. Engineers aren't trying to trick the docs; they are just aligning code to the spec, and the spec aligns to the code. It's a drift, not a game. |
  | **Self-Fulfilling Prophecy** | **Belief-Driven.** A specific prediction is believed, causing behavior that makes it true. | Your pattern doesn't require belief in a specific future outcome. It requires reliance on a *structure*. The recommendation model doesn't need users to "believe" it; it just needs to occupy screen real estate. |

  ### 4. The Consciousness Memory

  You are remembering **Douglas Hofstadter**, specifically from *Gödel, Escher, Bach* or his later book *I Am a Strange Loop*.

  The concept is the **Strange Loop**. Hofstadter argues that consciousness arises when a symbolic system (the mind) becomes complex enough to represent itself, and that representation gains causal power over the hardware (neurons) that implements it.
  *   **The connection:** You described "symbols in a brain pushing around the actual components." Hofstadter calls this **Downward Causation within a Strange Loop**.
  *   **Is it the same phenomenon?** Yes. Your documentation loop is a "Strange Loop" at the organizational level. The docs represent the code, the code implements the docs, and the "truth" lives in the loop, not in either artifact alone.

  ### 5. Boundary Cases: Recipes and Laws

  You asked if a recipe or a law counts. This is where the philosophy of **John Searle** (Constitutive vs. Regulative Rules) helps draw the line.

  *   **Regulative Rules (Not your pattern):** "Drive on the right side of the road." The activity (driving) exists independently of the rule. The rule just regulates it.
  *   **Constitutive Rules (Your pattern):** "Checkmate ends the game." The concept of "checkmate" *only exists* because of the rules. The representation *constitutes* the reality.

  **Is a recipe this?**
  *   **No.** A recipe describes a cake. If you write the recipe wrong, the cake fails, but the cake doesn't change the recipe. The causality is one-way (Recipe $\rightarrow$ Cake).
  *   **Unless:** You have an automated kitchen where the recipe is code that controls the mixer, and the mixer has sensors that update the recipe in real-time for the next batch. Then it becomes **Representational Coupling**.

  **Is a law this?**
  *   **Yes.** This is the classic example of Performativity. A law says "X is illegal." By writing that representation, the state creates a new reality where X is now a category of action that triggers police response. The law *makes* the crime exist.

  ### Summary for Your Meetings

  When you need to explain this to your team, you can say:

  > "We are dealing with **Reflexivity** (or **Performative Prediction**). Our dashboard/docs aren't just passive mirrors; they are **constitutive dependencies**. By publishing this representation, we have inserted it into the causal loop of the system. The model is now predicting its own inputs, and the docs are now part of the spec they describe. We need to treat the representation as a writable state, not a read-only log."

  You have identified **Downward Causation via Representational Coupling**. It is a real, named, and critical systems property.
