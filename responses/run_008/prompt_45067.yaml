answer: |-
  (1) The case
  Alex is renovating his kitchen. He qualifies for a manufacturer's rebate program.
  **Act One:** Alex must choose a rebate structure. Option Sure offers a guaranteed $100 refund credited immediately. Option Mix offers an 89% chance of $100, a 10% chance of $500, and a 1% chance of $0 (due to processing errors). Alex chooses Option Sure.
  **Act Two:** Later, Alex encounters a second program for a different appliance. Option Low offers an 11% chance of $100 and an 89% chance of $0. Option High offers a 10% chance of $500 and a 90% chance of $0. Alex chooses Option High.
  Alex is wealthy; $500 is negligible relative to his assets. He is not gambling emotionally; these are administrative choices made quietly online. He makes no other inconsistent choices regarding risk. The choices are presented sequentially, not side-by-side, preventing direct comparison.

  (2) The tie in act one
  In Act One, Alex prefers a sure $100 over a risky prospect with higher expected value ($139). Expected Utility Theory (EUT) rationalizes this via a concave utility function $u$, implying diminishing marginal utility of money. Risk-Weighted Expected Utility Theory (REUT) rationalizes this with linear utility ($u(x)=x$) and a risk function $r(p)$ that underweights high probabilities of gain. Both theories accommodate this caution naturally. EUT attributes it to the value of the money itself; REUT attributes it to the psychological weight of certainty. Neither theory is strained by Act One alone. Both can fit the data with standard parameter settings: mild concavity for EUT, moderate risk-aversion for REUT. The tie holds because a single choice cannot distinguish the source of risk aversion.

  (3) The wedge in act two
  Act Two creates the wedge. EUT requires the Independence Axiom: if Alex prefers Sure over Mix in Act One, he must prefer Low over High in Act Two. Mathematically, canceling the common 89% chance of $100 from Act One reveals the exact inequality governing Act Two. Alex's preference for High over Low violates this. No utility function $u$, concave or convex, can permit both choices. REUT, however, permits this pattern. Because REUT weights probabilities non-linearly, the 89% common consequence is not canceled out; the risk function transforms the probabilities differently in certain vs. uncertain contexts. REUT accommodates both choices with a single fixed risk function.
  For EUT, the 89% chance of $100 in Option Mix is mathematically equivalent to adding that outcome to both Option Low and Option High. If Alex prefers Sure to Mix, he implicitly values the extra 1% safety more than the 10% upside. When that safety is removed in Act Two, EUT demands consistency. Alex's reversal implies his preference depends on whether the common outcome is certain or probabilistic. EUT cannot model this without changing the utility function. REUT models it structurally: the weighting function is sensitive to the probability range, treating certainty differently than high probability.

  (4) Which feature does the work
  The working feature is the **Common Consequence Effect** (the Allais Paradox structure). Specifically, the treatment of the 89% probability of $100. In Act One, it contributes to a "certainty" (when combined with the 11% sure thing in Option Sure). In Act Two, it is pure risk. EUT treats probabilities linearly, so the 89% component cancels out. REUT treats probabilities non-linearly, so the context changes the weight. If you delete the common consequence, the wedge vanishes; both theories align.
  This case does not lean on the Rabin calibration critique for its logical force; the Independence violation holds regardless of stake size. However, the small stakes ($100/$500) make the concave utility required for Act One implausibly steep if taken seriously across all wealth levels, adding psychological pressure to the EUT view even before Act Two.

  (5) The expected utility theorist's strongest reply
  The strongest EUT reply is **Outcome Individuation**. The theorist argues Alex does not value money alone, but "money plus certainty." Thus, the outcome in Option Sure is not "$100" but "$100-Certain," while Option Mix offers "$100-Risky." These are distinct goods with distinct utilities. By re-describing the outcomes, the Independence Axiom is restored: Alex isn't violating logic; he is maximizing utility over a richer outcome space that includes peace of mind.
  This renders the theory nearly unfalsifiable; if every preference reversal implies a new outcome dimension, EUT loses its constraint on rationality. REUT offers greater parsimony: it explains the pattern by modifying how probabilities are processed, not by multiplying outcome descriptions ad hoc. Furthermore, if "certainty" is a separate good, EUT predicts specific trade-offs that often fail empirically. REUT captures the structural pattern of the violation itself without needing to stipulate why certainty is special in each specific case.
  REUT maintains a fixed structure (linear utility over money) and explains the variation through a single risk-attitude parameter. Additionally, the 'utility for certainty' reply struggles to explain why the certainty effect disappears when stakes are trivial or probabilities are described differently (e.g., frequency formats). REUT predicts these framing effects based on how probabilities are weighted. While the EUT theorist can always retreat to richer outcomes, she pays with theoretical flexibility. She must explain why 'certainty' is valued here but not in other logically equivalent contexts. REUT handles this via the risk function's sensitivity to probability scales, offering a unified explanation for the cluster of Allais-style violations without bespoke outcome descriptions for each case.

  (6) Where this leaves my argument with my friend
  This leaves your argument at the level of theoretical virtue rather than logical impossibility. You cannot prove EUT false, because it can always absorb anomalies into outcome descriptions. However, you can argue REUT is superior because it explains the *pattern* of caution (the wedge) with a single structural constraint, whereas EUT requires ad hoc adjustments for each case. The dispute shifts from "Is this rational?" to "Which theory is more parsimonious?" Your friend must defend the cost of saving EUT.
