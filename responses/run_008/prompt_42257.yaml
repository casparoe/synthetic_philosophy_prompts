answer: |-
  # Specification for a Theory of Moral Dilemmas

  To be trusted for practical guidance in high-stakes environments (clinical ethics, triage, command), a theory of moral dilemmas must satisfy the following desiderata. These are divided into phenomenological coverage, conceptual distinctions, and formal constraints. Each requirement is marked as **Non-negotiable** (required for the theory to function as a practical guide for agents who must answer for their actions) or **Prejudice** (a substantive commitment that excludes otherwise coherent theoretical camps).

  ## I. Case Coverage (Phenomenology)

  **1. The Persistence of Bindingness [Non-negotiable]**
  *   **Requirement:** The theory must account for cases where an agent faces two obligations, $A$ and $B$, cannot do both, chooses $A$, and yet $B$ remains *binding* post-choice. The unfulfilled duty is not merely outweighed or cancelled (as in Ross); it generates a continuing claim on the agent.
  *   **Consideration:** In practice, agents feel they owe restitution to the party associated with $B$ even after choosing $A$ for good reason. A theory that says $B$ vanished upon choice fails to explain the rationality of apology or compensation.

  **2. Origin Sensitivity [Prejudice]**
  *   **Requirement:** The theory must specify whether a dilemma entered through earlier innocent choices (e.g., promising two people at different times) differs in deontic status from one imposed by external forces (e.g., natural disaster).
  *   **Consideration:** Some theories hold that self-induced constraints tighten obligations; others hold that the current option set is all that matters. A trustworthy theory cannot remain silent here, but demanding a specific answer excludes "state-based" moral theories.

  **3. Symmetrical Choice-Worthiness [Non-negotiable]**
  *   **Requirement:** The theory must handle cases where $A$ and $B$ are of exactly equal moral weight without reducing the choice to an arbitrary pick between morally indifferent options.
  *   **Consideration:** If the theory treats symmetrical dilemmas as ties between permissible options, it dissolves the tragedy of the choice. The agent in a symmetrical dilemma still experiences moral residue; the theory must explain why this isn't just indecision between equivalents.

  ## II. Conceptual Distinctions

  **4. Residue vs. Regret [Non-negotiable]**
  *   **Requirement:** The theory must distinguish *moral residue* (a normative status requiring apology, penance, or compensation) from *psychological regret* (an emotional state).
  *   **Consideration:** An agent can feel no regret but still owe compensation, or feel deep regret for a choice that incurred no debt. Conflating these prevents the theory from guiding post-action repair.

  **5. Ontological vs. Epistemic Difficulty [Non-negotiable]**
  *   **Requirement:** The theory must distinguish a *genuine dilemma* (no uniquely permissible option exists) from a *hard case* (one option is objectively better, but the agent lacks knowledge).
  *   **Consideration:** Practical guidance differs radically: in a hard case, the goal is better information; in a genuine dilemma, the goal is damage mitigation. Collapsing these renders the theory useless for triage.

  **6. The Deontic Pattern [Non-negotiable]**
  *   **Requirement:** The theory must explicitly state the deontic status of the options in a dilemma. Are both forbidden? Both permissible? One obligatory and one forbidden? It must explain how this pattern avoids dooming the agent to inevitable wrongdoing *or* dissolving the dilemma into a free choice.
  *   **Consideration:** If both are forbidden, the agent is condemned. If both are permissible, the dilemma vanishes. The theory must navigate the "wrong whatever you do" paradox without trivializing the conflict.

  ## III. Formal Constraints (The Logical Trilemma)

  **7. The Consistency Trilemma [Non-negotiable]**
  *   **Requirement:** The theory must explicitly resolve the inconsistency between the following three propositions. It cannot hold all three simultaneously:
      1.  **Aggregation (AG):** If $O(A)$ and $O(B)$, then $O(A \land B)$.
      2.  **Ought Implies Can (OIC):** If $O(A)$, then $\Diamond A$ (it is possible to do $A$).
      3.  **Genuine Dilemmas (GD):** There are cases where $O(A)$, $O(B)$, and $\neg \Diamond (A \land B)$.
  *   **Consideration:** $(AG) + (GD) \rightarrow O(A \land B)$. But $(GD)$ says $\neg \Diamond (A \land B)$. If we keep $(OIC)$, we have a contradiction ($O(Impossible)$).
  *   **Cost Disclosure:**
      *   If you keep **AG + OIC**, you must deny **GD** (Rossianism).
      *   If you keep **AG + GD**, you must deny **OIC**. *Cost:* The theory commands agents to do the impossible, risking practical paralysis or absurdity.
      *   If you keep **OIC + GD**, you must deny **AG**. *Cost:* Failures of aggregation leak into innocent cases. If $O(A)$ and $O(B)$ do not imply $O(A \land B)$, then in non-conflict cases, two jointly satisfiable duties may fail to aggregate into a single conjunctive obligation, weakening the structure of moral reasoning generally.

  ## IV. Incompatibility and Exclusion

  **Joint Unsatisfiability:**
  Desiderata **1 (Persistence of Bindingness)** and **7 (The Consistency Trilemma)** create a tension with standard deontic logic. To satisfy **1**, you generally need **GD** (Genuine Dilemmas). To satisfy **GD** within classical logic, you must sacrifice either **OIC** or **AG**. There is no logically consistent system that satisfies **1**, **OIC**, **AG**, and Classical Logic simultaneously. A theory must own the break.

  **The Single Most Exclusionary Requirement:**
  **Desideratum 1 (The Persistence of Bindingness).**
  This requirement excludes the largest number of otherwise-plausible theories.
  *   It excludes **Rossianism** (duties are overridden, not binding).
  *   It excludes **Utilitarianism** (only the maximizing act is obligatory; others are wrong).
  *   It excludes **Standard Kantianism** (conflicts of duties are impossible; one duty is illusory).
  *   It forces the theory into paraconsistent logic or the rejection of OIC.
  While the Formal Trilemma is the logical bottleneck, the demand that the *unfulfilled duty remains binding* is the substantive filter that rules out the majority of normative ethics.

  ## V. Scorecard of Standard Positions

  **1. The Rossian View (Prima Facie Duties)**
  *   **Verdict:** **Fail.**
  *   **Reasoning:** Satisfies **AG** and **OIC** by denying **GD**. Fails **Desideratum 1** (Persistence of Bindingness). It treats the unchosen duty as overridden, not binding, failing to account for moral residue as a normative requirement. It classifies genuine dilemmas as epistemic errors (**Desideratum 5**).

  **2. The Deny-OIC View (Ought does not imply Can)**
  *   **Verdict:** **Pass (with high cost).**
  *   **Reasoning:** Satisfies **GD**, **AG**, and **Desideratum 1**. Fails **OIC**.
  *   **Cost:** Violates practical guidance constraints. Telling a triage officer they *ought* to save both patients when they physically cannot risks commanding the impossible, potentially inducing paralysis rather than guiding action.

  **3. The Reject-Aggregation View (Non-Adjunctive Obligations)**
  *   **Verdict:** **Pass (with logical cost).**
  *   **Reasoning:** Satisfies **GD**, **OIC**, and **Desideratum 1**. Rejects **AG**.
  *   **Cost:** Violates logical standardness. As noted in **Desideratum 7**, this leaks into innocent cases: if obligations don't aggregate in dilemmas, the logic for why they *do* aggregate in normal cases becomes ad hoc. It complicates the derivation of complex duties from simple ones.
