      *   *Gedoogbeleid:* Rule exists (Strong Norm signal) + No Enforcement (Low Punishment signal).
      *   *The Twist:* It's not "we don't care about this rule" (Loose). It's "we care enough to keep it, but pragmatically choose not to use it *yet*" (Pragmatic Tightness?).
      *   *Etymology:* "Gedoog" = to endure/suffer. This implies the act is still seen as negative/deviant, just tolerated for utility. This aligns more with *Tight* moral judgment but *Loose* enforcement mechanics.

  3.  **Address Question (1): Does the framework have room?**
