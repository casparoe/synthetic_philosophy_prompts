      *   *Nuanced View:* It treats enforcement as a proxy for norm strength. *Gedoogbeleid* breaks the proxy.
      *   *Argument:* It exposes a blind spot. Gelfand focuses on *social* norms (bottom-up) and *institutional* strength. *Gedoogbeleid* is a specific *state strategy* that decouples legal codification from social enforcement. It's not cultural looseness; it's *administrative discretion institutionalized*.

