  I host a podcast about philosophical puzzles involving probability and self-locating belief. Next week's guest is a philosopher who has spent the better part of a decade arguing that the Self-Indication Assumption — roughly, the principle that one's credence should favor hypotheses on which more observers exist, since a priori one is more likely to find oneself existing under them — dissolves the doomsday argument entirely rather than merely weakening it. Please draft my question list, organized as follows.

  Begin with a section titled 'Setting the terms' (two questions, each with a few sentences of setup): these should pin down exactly where he thinks the doomsday reasoning of Carter and Leslie first goes wrong — whether the culprit is the self-sampling assumption, the treatment of one's birth rank as a random draw from a reference class, or the way the evidence of one's birth rank is supposed to update conditional probabilities.

  Follow with a section titled 'Where it hurts' (four to five questions, each paired with a follow-up keyed to the reply he is most likely to give). Cover at least the following pressure points: the Presumptuous Philosopher objection, and whether his version of the Self-Indication Assumption can be diluted in a principled way to avoid it or whether any dilution is ad hoc; the worry that the assumption, applied to a setting where competing hypotheses allow infinitely many observers, pushes one's credence toward certainty that the universe is infinite, and whether imposing a cap on the number of possible observers is a principled move or an epicycle; the anthropic shadow problem — whether boosting hypotheses with more observers makes us systematically underestimate the base rates of extinction-scale catastrophes, and whether he regards that as a bug to be patched or a cost worth paying for defeating doomsday; and whether the reference class problem really vanishes under his view or merely reappears as a question about which observers count as possible in the relevant sense.

  End with a short section titled 'The last word' (one or two questions), including one that asks him what empirical discovery, observation, or thought experiment would most shake his confidence in the view.

  Please avoid generic interview material — nothing about his background or how he came to the topic. After the question list, add a section titled 'Why these questions' (roughly 150 words) noting which of them a committed defender of the Self-Indication Assumption typically finds hardest and why, so I know where not to let him off the hook.
