answer: |-
  1. **The mapping**

  To audit the analogy, we must first formalise the correspondence between the source (the equine economy) and the target (the AI economy). In the proponents' telling, the **horse** corresponds to the **human worker**, specifically those performing routine cognitive or physical labour. The **tractor or lorry** maps to **AI-driven automation**, the substitute technology. The **farmer** represents the **capital owner or employer**, who decides which input to utilise based on cost and efficiency. The **breeder**, who determines the herd size, corresponds to **human parents or society**, controlling the supply of new workers. Finally, the **horse's fixed skills** (pulling, carrying) map to **human cognitive and physical capacities**.

  However, several elements of the source case lack obvious counterparts. Horses were capital assets owned by the farmer; humans are legally free agents who own their own labour power. Horses were not consumers of the goods they helped produce; humans are the primary demand side of the economy. Furthermore, horses possessed no political agency, whereas workers vote and organise. The analogy implicitly treats humans as purely productive units, stripping away their role as consumers and citizens, which creates a structural gap before the argument even begins. The mapping holds only if one accepts a radically reduced definition of what a human being is within an economic system.

  2. **Load-bearing disanalogies**

  The analogy's conclusion rests on specific hinges, primarily the fixed nature of the horse's competence and its status as property. If these break, the prediction of human obsolescence collapses.

  First, consider the **biology hinge**. A horse's cognitive ceiling was absolute; it could not learn to drive a tractor. The analogy assumes AI closes the human learning gap similarly. While AI challenges general-purpose competence, humans retain adaptability that horses lacked. We shift tasks rather than ceasing function entirely. The historical claim that horses were simply 'liquidated' is sound, but humans cannot be liquidated; they must consume. This introduces the **consumption hinge**. Horses did not need wages to buy oats; their upkeep was a cost centre. Humans are both supply (labour) and demand (consumption). If AI displaces labour entirely, aggregate demand may collapse unless income is redistributed—a problem non-existent for horses. The economic system requires consumers with purchasing power; a herd of obsolete horses does not.

  Second, the **political hinge** is critical. Horses had no vote; they could not lobby for tariffs on tractors or subsidies for hay. Humans possess political standing. If automation threatens mass destitution, the political response (taxation, regulation, welfare) alters the outcome. The horse analogy assumes a laissez-faire environment where efficiency is the sole metric. Human societies often prioritise stability over pure efficiency.

  Finally, the historical soundness is nuanced. The horse population collapsed not just because tractors were better, but because horses were expensive to maintain when idle. Humans subsidise their own maintenance through savings, family networks, and state support. The analogy fails to account for the friction and political resistance inherent in human labour markets. It treats labour as a pure input cost rather than a socio-political contract. Consequently, the inference that humans will face the same abrupt cessation as horses ignores the institutional buffers unique to human economies.

  3. **Incidental breaks**

  Several disanalogies exist but do not materially affect the economic conclusion. For instance, horses have shorter lifespans than humans. While this affects the speed of adjustment, it does not change the structural possibility of obsolescence. Similarly, horses lack emotional complexity or moral standing in human law. While morally significant, this is incidental to the economic argument about employability. A being can be emotionally rich yet economically redundant.

  Another incidental break is the biological requirement for rest. Horses needed sleep and fodder; humans need sleep and wages. While the specifics differ, both require maintenance inputs. This does not weaken the analogy regarding displacement. These features are excusable because the analogy concerns *economic substitutability*, not biological equivalence. As long as the input provides utility that can be mechanised, the specific biological substrate matters less than the cost-benefit analysis performed by the 'farmer'. These breaks are surface-level and do not undermine the core warning about technological substitution.

  4. **A better analogy, if there is one**

  A more precise comparison is the displacement of **human 'computers'** (mostly women) by electronic mainframes in the mid-20th century. Like the horse analogy, this addresses cognitive labour rather than mere muscle. These workers performed complex calculations manually. When machines arrived, the specific job vanished. However, unlike horses, many humans retrained as programmers or analysts, moving up the value chain, while others left the workforce.

  This analogy fits the target case more closely because it involves general-purpose intelligence being mechanised. It licenses the expectation that specific *tasks* will vanish and that retraining is difficult but not impossible. It does not, however, license the stronger claim that *all* labour will vanish. The human computer era shows displacement is real and painful, but total obsolescence did not occur. It suggests a future of polarisation rather than extinction. It captures the nuance that while the *method* of work changes, the human role in supervising or utilising the machine often persists, unlike the horse which was removed from the field entirely.

  5. **Verdict**

  The proponents' conclusion does not survive the audit in its strong form. The claim that humans will resemble horses—ceasing to be bred due to economic redundancy—fails because it ignores the circular flow of income and human political agency. Humans are not merely capital goods; they are the market itself. To treat them as horses is to assume a breakdown of the consumer economy that would likely trigger political intervention long before demographic collapse.

  However, the analogy survives in a weakened, distributional form. It correctly highlights that technological substitution can be absolute for specific *tasks*, and that historical reassurance ('new jobs always appear') is not a law of nature but a contingent outcome. The valid warning is not that work will end, but that the *share* of income going to labour may fall precipitously, resembling the horse's decline in national income share. We should plan not for the end of work, but for a decoupling of productivity from wages. The horse analogy is a useful shock to complacency, but a poor blueprint for forecasting.
