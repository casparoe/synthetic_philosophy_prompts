          *   Let's go with **Human Calculators (pre-1950s)**. They performed cognitive labour. Machines took over. Some became programmers, some left. It tests the "judgement" claim better than horses.
          *   *Check word count:* Aim for ~200.

      *   **5. Verdict (approx. 200 words):**
