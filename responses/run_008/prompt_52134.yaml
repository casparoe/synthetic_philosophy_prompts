      *   **Opponents' View:** Textbook economics (lump of labour fallacy, historical adaptation, new jobs created).
      *   **Constraints:**
          *   British English spelling and usage.
          *   Specific structure with 5 headings.
          *   Specific word counts for each section (approximate).
          *   Avoid standard talking points/lump-of-labour recitation; focus on the analogy's structural integrity.

  2.  **Deconstruct the Analogy:**
      *   **Source Case:** Horses in agriculture/transport (1910s-1950s).
      *   **Target Case:** Human workers in the age of AI.
      *   **Key Claim:** Humans will become economically obsolete like horses, not just displaced like farmers.

  3.  **Drafting - Section by Section:**

      *   **1. The mapping (approx. 250 words):**
          *   Need to explicitly map roles.
          *   Horses -> Human workers (specifically labourers).
          *   Tractor/ICE -> AI/Automation.
          *   Farmer -> Capital owners/Employers.
          *   Breeder -> Parents/Humanity (deciding reproduction rates).
          *   Horse's skills -> Biological/Physical limits (muscle, stamina).
          *   Missing counterparts: Horses didn't consume goods they produced; humans do. Horses didn't vote; humans do.
          *   *Check word count:* Aim for ~250.

      *   **2. Load-bearing disanalogies (approx. 450 words):**
          *   Where does the mapping break in ways that matter?
          *   *Biology vs. Adaptability:* Horses had fixed cognitive ceilings. Humans learn new tasks (general-purpose competence). AI challenges this, but humans are still consumers and owners.
          *   *Economic Role:* Horses were capital goods (owned). Humans are labour suppliers *and* consumers. If humans earn nothing, who buys the output? Horses didn't need to buy oats; humans need wages to sustain demand.
          *   *Political Standing:* Horses had no vote. Humans can regulate AI, tax robots, implement UBI. The "cessation of breeding" implies a demographic collapse humans would politically resist.
          *   *Historical Soundness:* Was it purely mechanisation? Yes, mostly, but horses weren't "unemployed"; they were liquidated. Humans can't be liquidated easily.
