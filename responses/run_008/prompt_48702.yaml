answer: |-
  Here is the spec.

  ### The Desiderata: Requirements for a Psychiatric Taxonomy

  A functional taxonomy must satisfy these seven constraints. Failure on any of these renders the system a filing cabinet, not a medical tool.

  **1. Inter-Rater Reliability (The Floor)**
  *   **Requirement:** Two clinicians assessing the same patient at the same time must assign the same label with high probability (κ > 0.8).
  *   **Phenomenon:** Currently, a patient can be "Bipolar II" in Boston and "Borderline Personality Disorder" in New York. If the label depends on the doctor, it cannot be the unit of analysis for research or the trigger for insurance.
  *   **Why it's a requirement:** Without agreement, you cannot measure prevalence, funding, or outcomes. It is the entry fee.

  **2. Construct Validity (The Ceiling)**
  *   **Requirement:** The category must map to a distinct underlying causal mechanism (neural, genetic, or psychological), not just a cluster of surface behaviors.
  *   **Phenomenon:** "Depression" currently captures grief, melanoma-induced fatigue, dopamine transporter defects, and existential dread. They look the same (sad, slow) but have different causes.
  *   **Why it's a requirement:** If the category doesn't carve nature at a joint, you cannot generalize findings. A drug that fixes dopamine-transporter-depression will fail on grief-depression, diluting effect sizes and killing drug development.

  **3. Prescriptive Utility (The Point)**
  *   **Requirement:** The label must differentially predict response to intervention.
  *   **Phenomenon:** SSRIs work for some with MDD, worsen others, and do nothing for the rest. Meanwhile, ketamine works on a subset of the "SSRI-resistant" group. If Diagnosis A and Diagnosis B get the same first-line treatment, they should be the same diagnosis.
  *   **Why it's a requirement:** Medicine is an engineering discipline. A classification that doesn't guide the lever-pull is taxonomy for taxonomy's sake.

  **4. Comorbidity Resolution (The Structure)**
  *   **Requirement:** The system must explain why disorders co-occur, rather than treating co-occurrence as coincidence.
  *   **Phenomenon:** Anxiety and Depression co-occur in ~60% of cases. ADHD and ODD overlap massively. If you roll two dice and they always land on the same numbers, you don't have two dice; you have one weighted object.
  *   **Why it's a requirement:** High comorbidity indicates the boundaries are drawn wrong. A valid taxonomy should reduce "comorbidity" to shared underlying factors (e.g., a "Distress" factor), not list them as separate illnesses.

  **5. Heterogeneity Tolerance (The Granularity)**
  *   **Requirement:** The system must account for patients sharing a label but having disjoint symptom sets.
  *   **Phenomenon:** Under DSM-5, two patients can both qualify for Major Depressive Disorder while sharing zero overlapping symptoms (due to polythetic criteria).
  *   **Why it's a requirement:** If the label allows for total symptom disjointedness, the label is empty. The taxonomy must either split these into subtypes or admit the label is a "wastebasket" and label it as such.

  **6. Prognostic Prediction (The Trajectory)**
  *   **Requirement:** The label must inform the likely course of the condition without intervention.
  *   **Phenomenon:** A diagnosis of "Schizophrenia" in 1950 implied permanent institutionalization; today it implies a manageable chronic condition. The label didn't change, the reality did. Currently, a diagnosis often tells you nothing about whether you will recover in three months or thirty years.
  *   **Why it's a requirement:** Triage depends on this. If you can't distinguish transient distress from degenerative pathology, you will over-treat the former and under-treat the latter.

  **7. Looping Accommodation (The Hacking Constraint)**
  *   **Requirement:** The taxonomy must account for the fact that publishing the taxonomy changes the prevalence and presentation of the disorder.
  *   **Phenomenon:** Once "ADHD" became a known category, adults began self-identifying, symptom checklists became common knowledge, and the behavioral phenotype shifted to match the cultural script of ADHD. Autism rates didn't just rise due to better detection; the *concept* of autism changed how parents behaved and how autistics performed their identity.
  *   **Why it's a requirement:** Unlike minerals, psychiatric patients read the manual. A taxonomy that ignores this treats a dynamic system as static. It will be falsified by its own success.

  ***

  ### Requirements vs. Camp Preferences

  We argue past each other because we disguise preferences as requirements.

  *   **Biological Validity is a Preference (for now).** The biologically-minded treat "external validator" (biomarker) as a hard requirement. It is not. It is a *method* to achieve Construct Validity. If a purely behavioral cluster predicts treatment response perfectly (Prescriptive Utility), it is valid *as a medical category* even without a known gene. Demanding a biomarker before clinical utility halts progress.
  *   **Clinical Utility is a Requirement.** The pragmatists claim they don't care about "truth," only "what works." This is partially a preference, but Prescriptive Utility (above) makes it a requirement. However, "ease of use" is a preference. A complex taxonomy that works is better than a simple one that doesn't.
  *   **Stability is a Preference.** Researchers want categories to stay fixed for longitudinal studies. Clinicians want them to stay fixed for records. But if the phenomenon changes (via Looping or scientific discovery), stability becomes a lie. Stability is desirable, not mandatory.

  ***

  ### The Impossible Triangle

  Here is the conflict you suspected. You cannot maximize **Reliability**, **Validity**, and **Stability** simultaneously in a system subject to **Looping Effects**.

  1.  **Reliability requires crisp thresholds.** (e.g., "5 of 9 symptoms").
  2.  **Looping Effects exploit crisp thresholds.** Patients learn the checklist. They optimize their behavior to meet the threshold (conscious or unconscious). This degrades **Validity** because the population behind the label shifts to match the criteria, not the underlying pathology.
  3.  **Correcting Validity requires changing thresholds.** To restore validity, you must update the criteria. This destroys **Stability**.
  4.  **Destroying Stability breaks Research.** Longitudinal studies become impossible if "Depression" in 2020 is not "Depression" in 2030.

  **The Verdict:** The demand for **Stability** is the constraint that must break.

  If you enforce stability in a looping system, you are measuring a moving target with a fixed ruler. The ruler becomes wrong. The data becomes garbage. It is better to have a taxonomy that admits it is a snapshot and updates every decade, breaking longitudinal continuity, than to pretend the category is static while the population evolves around it.

  ***

  ### The Commitment

  **1. Which requirement do I drop?**
  **Stability.**
  I would explicitly build a taxonomy with an expiration date. Version 1.0 is valid for 10 years. Version 2.0 *will* redefine the boundaries. This accepts the cost of broken longitudinal datasets to preserve Construct and Prescriptive Validity. If the category doesn't evolve, the Looping Effect ensures it will rot.

  **2. Which requirement does the most work?**
  **Prescriptive Utility.**
  This is the filter that excludes the most real contenders. RDoC (Research Domain Criteria) fails here currently; it maps circuits to behaviors but offers no treatment algorithms. HiTOP (Hierarchical Taxonomy of Psychopathology) is better on structure but lags on specific intervention mapping. If a taxonomy cannot tell me whether to prescribe a mood stabilizer or a trauma protocol, it is philosophy, not psychiatry. This requirement forces the system to be actionable, preventing it from retreating into pure neuroscience or pure phenomenology.

  **3. Natural Kinds or Treatment Clusters?**
  **Treatment-Relevance Clusters (Instrumentalism).**
  I reject the "Natural Kind" premise for the immediate future. Psychiatry is not mineralogy. Minerals do not read the geology textbook.
  Until we have biomarkers that cleanly separate the heterogeneity (which we don't), chasing "real" categories is a trap. It leads to endless waits for a biological validation that may not exist in a discrete form (mental states may be continuous, not categorical).
  Build the taxonomy around **intervention clusters**. If Group A responds to CBT and Group B responds to Antipsychotics, they are different disorders, even if they look identical and share the same genetics. We can refine the "why" later. The "what to do" is the priority.

  **4. On Looping Effects**
  They are not overrated; they are the defining feature of the domain.
  Any taxonomy that does not include a feedback loop mechanism is fundamentally broken. The classification system must monitor not just the *prevalence* of the disorder, but the *correlation between publication and symptom presentation*. If a diagnosis spikes immediately following a public health campaign, the taxonomy must flag that diagnosis as "High Looping Risk" and lower its evidentiary weight for biological research.
  We are not classifying rocks. We are classifying stories people tell about themselves, mediated by biology. The taxonomy must be a version control system for those stories, not a map of a static territory.

  **Summary:**
  Drop Stability. Prioritize Prescriptive Utility. Build Clusters, not Kinds. Treat the taxonomy as software, not scripture—it must be patched, or it will be hacked by the users.
