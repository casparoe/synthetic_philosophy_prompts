          3.  *Predictive Utility:* (Prognosis).
          4.  *Prescriptive Utility:* (Treatment).
          5.  *Comorbidity Resolution:* (The "Factor Structure" problem).
          6.  *Heterogeneity Tolerance:* (The "Same Label, Different Symptoms" problem).
          7.  *Looping Resistance/Accommodation:* (The Hacking constraint).
      *   **Distinguishing Requirements from Preferences:**
          *   Biological validity is a *hope*, not a requirement (yet).
          *   Clinical utility is the *floor*.
      *   **The Conflict (The "Impossible Triangle"):**
          *   Reliability (Crisp boundaries) vs. Validity (Fuzzy reality) vs. Stability (Time invariance).
