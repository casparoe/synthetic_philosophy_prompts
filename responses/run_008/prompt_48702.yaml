          *   **Tone:** Direct, analytical, no hedging, accept minor typos.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   *Reliability:* Clinicians must agree on the label. (Phenomenon: Two doctors giving different diagnoses for the same patient).
      *   *Validity (Construct):* The label must map to a real underlying mechanism/entity. (Phenomenon: "Depression" might be 50 different things biologically).
      *   *Predictive Validity (Course/Prognosis):* The label must predict future trajectory. (Phenomenon: Diagnosis doesn't tell you if you'll recover in 2 weeks or 2 years).
      *   *Treatment Utility:* The label must guide intervention. (Phenomenon: Same diagnosis, different meds work; different diagnoses, same meds work).
      *   *Comorbidity Handling:* The system must explain why disorders cluster. (Phenomenon: Anxiety + Depression is the rule, not exception).
      *   *Heterogeneity Handling:* The system must account for symptom variation within a label. (Phenomenon: Two MDD patients sharing zero symptoms).
      *   *Stability vs. Adaptability:* The system needs to be stable enough for research/records but adaptable to new knowledge.
      *   *Looping Effects (Hacking):* The classification changes the classified. (Phenomenon: Autism identity, ADHD accommodations, symptom mimicry).

  3.  **Analyze Conflicts (The "Unsatisfiable Subset"):**
      *   *Reliability vs. Validity:* Crisp checklists (high reliability) often cut nature at joints that don't exist (low validity). Thresholds are arbitrary.
