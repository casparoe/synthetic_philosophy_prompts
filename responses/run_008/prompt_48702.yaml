      *   *Which to drop?* **Stability.** (Or "Fixed Ontology"). Mental health is too dynamic.
      *   *Which does the most work?* **Treatment Utility.** If it doesn't help the patient, it's philosophy, not medicine.
      *   *Natural Kinds vs. Clusters?* **Treatment-Relevance Clusters.** Acknowledge looping effects mean "natural kinds" are currently impossible or category errors for *many* psychiatric conditions.
      *   *Looping Effects:* They are *not* overrated. They are central.

