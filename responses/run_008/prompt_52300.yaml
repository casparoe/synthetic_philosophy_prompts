prompt: |-
  Quick background so you know where I'm coming from: my psych 101 professor drilled into us that "the eye is not a camera" — no picture lands on some inner screen, the brain has to build the scene from scraps. Fine, sounded reasonable. But since then I keep hearing the exact same sentence used for totally different jobs. A friend who does vision research used it to argue that the way the Müller-Lyer lines still look unequal even when you know they're equal shows early vision is insulated from what you know — the "camera" part is exactly what cognition can't touch, which is why illusions persist. Meanwhile a guy in my phil of science class used it to argue the opposite direction: that scientists holding different theories literally see different things in the same cloud chamber photo, so there's no neutral perceptual starting point for settling empirical disputes. And my therapist threw it out about how she and a client can "perceive" the same interaction completely differently.

  I'd like you to take on the role of a philosopher of perception who also knows the vision science well, and think carefully before answering — maybe start with some quick brainstorming about what job each of those three speakers needed the sentence to do, since I suspect they can't all be right. Then give me the menu: the distinct precise claims "the eye is not a camera" could be expressing, ordered from weakest to strongest. For each one, tell me whether its true, whether its actually established or still fought over, and crucially whether it supports the use it was put to. I have a feeling the therapist only needs a claim about judgment or attention that even my vision-scientist friend could happily accept, while the phil of science guy needs something way stronger about perceptual content itself being shaped by beliefs and expertise. If some readings are basically platitudes dressed up as profundity, say so. Also say which reading people who repeat the slogan casually probably have in mind, and whether that reading survives the illusion case my friend raised. Please no citations or reading lists — I want just your thinking, laid out as a list I can actually use.
