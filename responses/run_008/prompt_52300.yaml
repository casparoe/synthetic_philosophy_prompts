      *Self-Correction on the Vision Scientist's Logic:* I need to be careful. The prompt says the friend used "The eye is not a camera" to argue for *insulation*. This is slightly counter-intuitive because usually "not a camera" implies "mind-dependent." However, the friend's logic is likely: "A camera records what is there. The eye constructs what is useful. Because it constructs based on evolutionary heuristics (not truth), it ignores your current knowledge." So the slogan denies *veridicality* to support *encapsulation*. I need to make sure I capture that nuance.

      *Refining the Menu Order:*
      1.  **Anti-Pictorialism:** No picture in the head. (Weakest).
