prompt: |-
  I've pretty much committed to the evolutionary debunking view of moral realism: our moral beliefs got their shape from selection pressures that cared about fitness and nothing else, so if there were mind-independent moral facts out there, it would be a massive coincidence if our beliefs tracked them rather than just tracking whatever kept our ancestors alive. What I want to know is what would actually count against this view. Not the standard realist grumbling — I want the defeaters ranked from fatal to merely awkward, and I especially want to know which of them a committed debunker would themselves concede as counting against them versus which they'd just shrug off. Two things I keep chewing on: (a) the third-factor reply, where survival is supposed to be both fitness-enhancing and genuinely good, so we track the good by tracking the useful — is that a rescue or is it smuggling realism back in through a side door? and (b) what happens if we discovered that fully informed, impartial, idealized agents across wildly different cultures converge on the same moral code — does that rescue realism, or does it just push the coincidence back a level (why would *idealized* humans track truth any better than evolved ones)? Also, I worry the argument has been qualified and requalified — "it only debunks *these* moral beliefs, not *those*" — until there's barely anything left it actually debunks, and I want an honest verdict on whether that insulation is fatal for a view of this kind or just the normal way a research programme matures.

  Please answer in British English, with these sections in this order: "The view, stated plainly" (one short paragraph), "What would be decisive against it" (two to three paragraphs), "What would merely be awkward" (two paragraphs), "What debunkers concede vs. shrug off" (two paragraphs), and "Verdict on the insulation worry" (one paragraph). Keep the ranking of defeaters visible througout — I want to be able to see at a glance what's fatal, what's serious, and what's noise.
