  The view, stated plainly

  The evolutionary debunking argument posits that our moral faculties were shaped by natural selection solely to enhance reproductive fitness, not to perceive mind-independent moral truths. Consequently, if such objective moral facts existed, the alignment between our evolved beliefs and those facts would be entirely coincidental. Since we cannot rationally rely on beliefs formed by processes insensitive to truth, moral realism is rendered unjustified.

  What would be decisive against it

  The most fatal blow would be demonstrating that the argument is self-defeating. If evolutionary pressures shape all our cognitive faculties, including those responsible for mathematics, logic, and the theory of evolution itself, then the debunking argument undermines its own premises. A realist could argue that unless the debunker can exempt their own reasoning from evolutionary influence without special pleading, the argument collapses into global scepticism, destroying the very platform from which it is launched.

  Secondly, a decisive defeater would be empirical evidence that moral beliefs are not primarily driven by fitness pressures. If neuroscience or anthropology revealed that moral reasoning operates independently of survival mechanisms—perhaps tracking truth via a distinct cognitive module—the foundational premise of the debunking argument would crumble. This would remove the 'coincidence' charge at its source, showing that the genealogy of our beliefs is not purely adaptive in the way the debunker assumes.

  What would merely be awkward

  It is merely awkward, rather than fatal, that realists can construct plausible third-factor explanations linking fitness to truth. While this does not prove realism, it forces the debunker into a defensive position where they must argue that survival is not objectively valuable. This creates a theoretical burden, requiring the debunker to maintain a hardline stance against common intuitions about the goodness of survival, which is philosophically costly even if logically tenable.

  Equally awkward is the persistent phenomenological experience of moral objectivity. Most people feel they are discovering truths rather than projecting preferences. While an error theory can explain this as an illusion, the sheer ubiquity and intensity of this experience require a complex error theory to dismantle. It does not refute debunking, but it makes the view psychologically unpalatable and demands significant explanatory work to account for why the illusion is so convincing.

  What debunkers concede vs. shrug off

  Regarding your specific worry (a), committed debunkers like Sharon Street concede that the third-factor reply rescues *naturalist* realism but shrug off its application to *non-naturalist* realism. They admit that if survival is objectively good, the coincidence vanishes, but they argue this simply smuggles in a realist premise that begs the question against the debunking argument. Thus, they concede it works internally for realists but shrug it off as failing to engage with the core evolutionary challenge.

  On point (b), debunkers largely shrug off the convergence of idealized agents. They concede that convergence occurs but deny it tracks mind-independent truth, arguing instead that idealization merely refines our shared evolved psychology. They maintain that pushing the coincidence back a level does not eliminate it; if all idealized agents share the same cognitive ancestry, their agreement is still explained by common descent rather than access to objective facts.

  Verdict on the insulation worry

  Your worry about insulation is astute, but it signals normal maturation rather than fatal erosion. As the debate has progressed, the argument has rightly retreated from debunking all morality to targeting only non-naturalist realism, leaving naturalist accounts intact. This narrowing is not a failure but a clarification of scope; the argument succeeds if it eliminates the most metaphysically costly versions of realism, even if it leaves cheaper versions standing.
