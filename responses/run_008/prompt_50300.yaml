answer: |-
  # Quiz: What Do You Mean by "Free Will"?

  **Instructions:** Below are eight short stories. Read each one and choose the answer that best matches your gut reaction. There are no right or wrong answers. Do not overthink the physics or the metaphysics; just answer based on what feels fair or accurate to you in the situation described.

  ***

  **1. The Gunpoint Choice**
  Jordan is walking home when a stranger points a gun at them and says, "Give me your wallet or I shoot." Jordan hands over the wallet. Jordan would never have given away the wallet otherwise.
  *   **A.** Jordan is not free in this moment, and we shouldn't blame them for losing the wallet.
  *   **B.** Jordan is technically making a choice, but it's a forced one, so it doesn't count as free will.
  *   **C.** Jordan is free enough to be responsible for staying safe, but the threat excuses the loss of the wallet.

  **2. The Secret Implant**
  Taylor wants to be a generous person but usually struggles with selfishness. Unbeknownst to Taylor, scientists have installed a chip in their brain that subtly adjusts their moods. Because of the chip, Taylor now genuinely *wants* to be generous and happily donates to charity every week. Taylor feels no pressure and thinks these desires are their own.
  *   **A.** Taylor is acting freely because they are doing exactly what they want to do.
  *   **B.** Taylor is not acting freely because the desire was planted by someone else.
  *   **C.** It doesn't matter if they are "truly" free; the charity still gets the money, so we should treat Taylor as a good person.

  **3. The Perfect Prediction**
  A super-computer has analyzed the universe and can predict every choice you will make with 100% accuracy. It predicts you will choose pizza for dinner. You deliberate carefully, weighing salad vs. pizza, but in the end, you choose pizza, just as predicted. You could not have done otherwise.
  *   **A.** You acted freely because the prediction didn't stop you from thinking it through.
  *   **B.** You did not act freely because you were never actually able to choose the salad.
  *   **C.** The word "free" is just a way of saying you weren't forced; the prediction doesn't change that.

  **4. The Heroic Struggle**
  Casey is recovering from a severe addiction. To stay sober, Casey has to fight against powerful cravings every single day, a struggle that exhausts them. Morgan has never had an addiction and finds it easy to avoid drugs. Both stay sober for a year.
  *   **A.** Casey has more free will than Morgan because it took more effort and self-control.
  *   **B.** Both have the same amount of free will, as long as both stayed sober.
  *   **C.** Neither truly has free will if their brains are wired to crave or not crave drugs.

  **5. The Trained Dog**
  A dog is trained so perfectly that it never chases cars, always sits when asked, and never bites. It behaves better than many humans.
  *   **A.** The dog is not free because it is just following training and instinct.
  *   **B.** The dog is free in the only way that matters: it reliably does the right thing.
  *   **C.** The dog isn't free, but we should treat it well anyway.

  **6. The Lucky Upbringing**
  Alex grew up in a loving home with patient parents who taught them to be calm and kind. Blake grew up in a violent home where anger was the only way to survive. As adults, Alex is calm and Blake is angry. When Blake loses their temper and hurts someone, we blame Blake.
  *   **A.** This is unfair; Blake's behavior comes from bad luck in childhood, just like Alex's comes from good luck.
  *   **B.** It is fair to blame Blake because Blake is the one who chose to hurt someone, regardless of their childhood.
  *   **C.** Blame is useful to stop Blake from doing it again, even if it isn't "fair" in a deep sense.

  **7. The Reason for Punishment**
  A person commits a serious crime. We are deciding how to handle it.
  *   **A.** They deserve punishment because they chose to do evil, and justice requires payback.
  *   **B.** We should restrict their freedom only to keep others safe or to help them improve, not to make them suffer.
  *   **C.** We should punish them only if it stops other people from committing crimes.

  **8. The Subtle Nudge**
  An advertising company uses psychological tricks to make people crave a specific soda. People buy the soda thinking they just happened to be thirsty. They aren't held at gunpoint, but their desires were shaped by experts.
  *   **A.** This is a violation of freedom, similar to brainwashing.
  *   **B.** This is just normal life; we are always influenced by things, so it's still a free choice.
  *   **C.** It's only a problem if the people want to stop buying it and can't.

  ***

  # Scoring Key & Interpretation

  **Note to the TA:** This quiz is diagnostic, not definitive. Philosophical positions often blur at the edges. Do not present these results as a final diagnosis of the student's metaphysics, but rather as a map of their *intuitions* about what the concept of free will is *doing* in their thinking.

  ### How to Tally
  Count how many times the student selected each letter option. While individual questions lean toward specific debates, the overall pattern suggests which philosophical "family" their intuitions inhabit.

  *   **Mostly A's:** The **Internalist / Compatibilist** (Frankfurt, Dennett, Strawson vicinity).
  *   **Mostly B's:** The **Originator / Incompatibilist** (Libertarian or Hard Determinist vicinity).
  *   **Mostly C's:** The **Pragmatist / Deflationist** (Quietist or Forward-Looking vicinity).
  *   **Mixed/No Clear Majority:** The **Pluralist** or **Undecided**.

  ### Detailed Position Mapping

  #### 1. Hierarchical & Reasons-Responsive Views (Mostly A's)
  *   **The Gist:** You believe free will is about acting in alignment with your own desires and being responsive to reasons. If you do what you want, and you aren't being coerced (like in Q1), you are free. External causes (like Q2's chip or Q6's upbringing) don't necessarily ruin freedom if you identify with the action.
  *   **Philosophical Neighbors:** Harry Frankfurt (hierarchical desires), Daniel Dennett (evitability and reasons-responsiveness), P.F. Strawson (reactive attitudes).
  *   **Key Intuition:** Freedom is a feature of how the agent functions *now*, not where their desires came from.

  #### 2. Sourcehood & Ultimate Origination Views (Mostly B's)
  *   **The Gist:** You believe free will requires being the *ultimate source* of your actions. If something else (a chip, a prediction, childhood luck, biology) determined your choice, you aren't truly free. You likely feel that "could have done otherwise" (Q3) is essential.
  *   **Philosophical Neighbors:** Robert Kane (Libertarianism), Galen Strawson (Basic Argument), or Hard Determinists (if you think *no one* meets this bar).
  *   **Key Intuition:** Freedom requires a break in the chain of cause-and-effect that leads back to *you* alone.
  *   **Note on Ambiguity:** This quiz cannot cleanly separate **Libertarians** (who think we *have* this freedom) from **Hard Determinists** (who think we *lack* it). Both agree on what freedom *would require* (ultimate origination); they disagree on whether humans possess it. To distinguish them, you would need to ask a direct metaphysical question about physics or causation, which this quiz intentionally avoids.

  #### 3. Deflationary & Pragmatic Views (Mostly C's)
  *   **The Gist:** You are skeptical that "free will" describes a deep metaphysical magic power. Instead, you think the concept is a tool we use for social purposes (blame, safety, improvement). You are less interested in whether an action was "caused" and more interested in whether holding someone responsible *does any good* (Q7).
  *   **Philosophical Neighbors:** Bruce Waller (forward-looking responsibility), Daniel Dennett (in some pragmatic moods), Frederick Schauer.
  *   **Key Intuition:** The question isn't "Are they free?" but "Is it useful to treat them as free?"

  ### Specific Question Diagnostics
  *   **Q2 (The Implant) & Q6 (Upbringing):** These are the "Manipulation Arguments."
      *   Choosing **A** suggests a **Compatibilist** view (internal alignment matters more than history).
      *   Choosing **B** suggests a **Sourcehood** view (history matters; you must be the origin).
  *   **Q3 (Prediction):** This tests the "Could Have Done Otherwise" intuition.
      *   Choosing **B** suggests you hold the **Principle of Alternative Possibilities** (PAP).
      *   Choosing **A** suggests you hold a **Compatibilist** view of ability.
  *   **Q5 (The Dog):** This tests **Agency**.
      *   Choosing **B** suggests a **Behaviorist** or **Functionalist** view (if it walks like freedom, it is freedom).
      *   Choosing **A** suggests you think **Rationality** or **Humanity** is required for freedom.
  *   **Q7 (Punishment):** This tests the **Purpose of Responsibility**.
      *   Choosing **A** is **Retributivist** (often linked to Libertarianism).
      *   Choosing **B/C** is **Consequentialist** (often linked to Compatibilism or Skepticism).

  ### Incoherent or Unexplored Combinations
  *   **The "Retributive Skeptic" (Mostly B on Q1-Q6, but A on Q7):** This student believes no one is truly free (Sourcehood/Skeptic) but still believes in payback/retribution. Philosophers generally consider this **incoherent** or morally unstable. If the agent isn't the source of the action, they don't *deserve* payback. This combination usually indicates an unexamined conflict between emotional intuition and logical consistency.
  *   **The "Dog Libertarian" (Mostly B generally, but B on Q5):** This student denies freedom to the dog because it lacks "soul" or "origin," but might grant it to humans. This is a standard **Human Exceptionalist** view, but if pressed, they must explain what humans have that dogs lack without resorting to magic.
  *   **The "Pragmatic Hard Determinist" (Mostly B on Q1-Q6, Mostly C on Q7):** This is a **stable and explored position** (e.g., Derk Pereboom). It holds that we lack ultimate freedom (B) but we should keep the practice of blame for safety and improvement (C), dropping the idea of "desert."

  ### Advice for Discussion
  If a student lands on **Mostly B**, ask them: *"If nothing in the physical world can break the chain of cause and effect, does that mean free will doesn't exist?"* This forces them to choose between Libertarianism (magic/breaks in physics) and Hard Determinism (no freedom).

  If a student lands on **Mostly A**, ask them: *"If we could program a robot to feel happy about its choices, just like Taylor in Q2, would the robot be free?"* This tests whether their Compatibilism extends to non-biological entities.
