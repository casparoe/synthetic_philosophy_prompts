  1.  **Octopus:** **Yes.** She will likely classify this as fear. The octopus displays physiological arousal ("visibly wound up") and intentional behavior directed at a threat ("startled," "jets off"). Unlike the chess app, it is a biological organism with a survival stake; unlike the robot, its behavior isn't just a report or model, but a lived reaction. It fits her requirement for a value-laden response (survival is good, injury is bad) coupled with an affective state.
  2.  **Robot:** **No.** She will reject this as fear. This case mirrors the chess app: it has functional avoidance and even linguistic reporting, but she explicitly notes "nothing is felt inside." Since she ruled out the calm climate belief (cognition without affect) and the chess app (function without affect), a robot with no phenomenology fails her criteria, regardless of how sophisticated its threat modeling is.
  3.  **Free-floating Dread:** **No.** She will likely classify this as a panic event or mere arousal, not fear. Her verdict on shame ("can't be ashamed of something... [that says] nothing about you") and climate ("calmly thinking... is not fear") establishes that emotions require an **intentional object** and an **evaluation of value**. The 3am case has the feeling (terror) but lacks the object (no thought of anything). For her, fear must be *about* something dangerous, not just a storm in the nervous system.

  ### The Rule She Is Running
  Your friend is operating on a **Perceptual Theory of Emotion** (specifically, a *Concern-Based Construal* view).

  On this rule, emotions are **affective perceptions of value**.
  *   **Why it fits:**
      *   *Skywalk:* She perceives the value (falling is bad) affectively, even if her belief (it's safe) contradicts it.
      *   *Dad:* He perceives the value (diagnosis is bad) affectively, even without somatic feedback.
      *   *Climate:* He perceives the value cognitively (belief), but not affectively (calm).
      *   *Chess:* It processes value functionally, but has no affective perception.
      *   *Shame:* The value must be perceived as relevant to the self (intentionality).

  ### Rival Rules
  A **Pure Phenomenal Theory** (Emotions are just distinctive feeling states) fits her track record almost as well, with one major divergence.
  *   **Fit:** It explains Skywalk (has feeling), Dad (has mental dread), Climate (no feeling), and Chess (no feeling). It can also accommodate the Shame verdict by arguing the "quality" of the shame-feeling inherently includes self-relevance.
  *   **Disagreement:** It diverges on the **Free-floating Dread** case. A Pure Phenomenal theorist would say, "If it feels like terror, it is fear," regardless of whether there is an object. Your friend's Perceptual Theory requires an object/evaluation, leading her to say "No."

  A **Somatic Theory** (Emotions are perceptions of bodily change) is ruled out by the Dad case (no bodily changes). A **Judgmentalist Theory** (Emotions are beliefs about value) is ruled out by the Climate case (belief without emotion).

  ### Best Case to Pry the Rules Apart
  The **Free-floating Dread** case is the best of the three provided to distinguish the **Perceptual Theory** from the **Pure Phenomenal Theory**.
  *   **Perceptual Theory:** Verdict **No** (Missing intentional object/evaluation).
  *   **Pure Phenomenal Theory:** Verdict **Yes** (Has the qualitative feel).

  However, an even sharper **fourth case** would be the **"Pill Case"**: *You swallow a pill that induces the exact physiological and phenomenal sensation of terror, but you know it's just the pill and are sitting safely on your couch thinking about nothing dangerous.*
  *   **Perceptual Theory:** **No.** (You perceive the bodily changes, but you do not perceive any *value* or *danger* in the world; the feeling is decoupled from an evaluative object).
  *   **Pure Phenomenal Theory:** **Yes.** (The feeling state is present).
  *   **Why it's better:** In the 3am dread case, a rival might argue the subject *is* evaluating something unconsciously ("something's wrong"). In the Pill Case, the subject explicitly knows there is no danger, isolating the feeling from the evaluation completely.

  \answer{octopus: yes; robot: no; dread: no; best rule: affective perception of value}
