      *(Refining Multiple Realizability)*: Philosophers use MR to block reduction. In ML, MR blocks *interpretability* via weight inspection, but not *functional* reduction. I need to make this distinction clear.

      *(Final check on constraints)*: No citations. No padding. Honest verdict.

