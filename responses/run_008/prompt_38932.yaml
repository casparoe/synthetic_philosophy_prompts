answer: |-
  Dear Colleague,

  I share your unease, and I think you have put your finger on one of the most enduring anxieties in the philosophy of international law. It is a discomfort that arises whenever we stare too long at the gap between the normative aspirations of our discipline and the gritty mechanics of its operation. You ask whether the practice of recognizing governments presupposes Pascal's resigned identification of justice with force, or whether it is philosophically underdetermined, capable of resting on lighter, more pragmatic foundations. To answer this, I think we must first distinguish between what recognition asserts about the moral worth of a regime and what it asserts about the functional capacity of that regime. When a state extends recognition to a new government, particularly one that has seized power through extra-constitutional means, it is rarely issuing a moral certificate of good conduct. Rather, it is making a factual determination about who holds the reins of authority such that international obligations can be discharged. In this light, the practice does not necessarily require the strong Pascalian claim that force constitutes justice. Instead, it operates on a more modest, perhaps Hobbesian, premise: that law requires a sovereign capable of enforcing it, and without effective control, there is no interlocutor with whom to maintain legal relations.

  If we look at the historical evolution of this practice, we see a deliberate move toward this kind of agnosticism. In the nineteenth and early twentieth centuries, states were more willing to condition recognition on legitimacy, often refusing to acknowledge governments that came to power through coups. However, this led to confusion and diplomatic friction, as states disagreed on what constituted legitimate authority. The resulting trend, exemplified by the Estrada Doctrine adopted by Mexico and later influential in many other jurisdictions, was to cease issuing formal declarations of recognition altogether. Instead, states simply determine whether or not to maintain diplomatic relations based on the factual reality of control. This shift suggests that the practice is not committed to the view that might makes right in a moral sense, but rather that might makes possible in a legal sense. It is a bookkeeping rule designed to ensure that there is always someone responsible for the territory and population in question. If we treat recognition as a mechanism for attributing responsibility rather than conferring legitimacy, the Pascalian critique loses some of its sting. The law is not saying the junta is just; it is saying the junta is the entity that must answer for the state's treaties.

  However, your intuition that this still feels like a concession to power is not easily dismissed. Even if recognition is technically agnostic, the effect is to stabilize unjust regimes by granting them the benefits of international personality. This brings us to your question about whether the practice is philosophically underdetermined. I believe it is. The current system is compatible with a variety of political theories because it prioritizes order over justice, a priority that can be justified from multiple angles. A utilitarian might argue that recognizing effective governments minimizes conflict and facilitates trade, thereby maximizing welfare. A Hobbesian would argue that without a sovereign power to keep them in awe, states remain in a condition of war, so recognizing whoever holds the sword is the only way to escape the state of nature. Even a liberal theorist might accept the practice as a tragic necessity, acknowledging that while consent is the ideal basis for legitimacy, insisting on it universally would lead to perpetual interventionism and instability. The practice does not deny the value of consent; it merely suspends the requirement of consent as a condition for basic legal interaction. It is a modus vivendi rather than a moral triumph.

  Yet, let us entertain your thought experiment of rebuilding the practice on a consent-based theory of legitimacy. If international law required that a government demonstrate the genuine consent of the governed before receiving recognition, the consequences would be profound and likely destabilizing. We would see a sharp increase in non-recognition of authoritarian regimes, effectively rendering them outlaws in the international system. While this might sound morally satisfying, it would likely sever the very channels of communication and obligation that international law seeks to maintain. If we refuse to recognize a regime because it lacks democratic consent, we lose the ability to hold it accountable for human rights violations or environmental treaties, because it is no longer a subject of the law. Furthermore, who decides whether consent exists? Such a criterion would invite powerful states to impose their own ideological standards on weaker ones, turning recognition into a tool of hegemony rather than a neutral rule of coexistence. The current effectiveness criterion, for all its cynicism, acts as a shield against this kind of moral imperialism. It says that regardless of your internal politics, if you control the territory, you bear the responsibilities.

  This brings us back to Pascal and whether his distinction between the order of force and the order of justice offers a vocabulary for critique or vindication. Pascal argues that because we could not make what is just strong, we made what is strong just. He suggests that our established orders are essentially power wearing respectable clothes. If we take this seriously, one could argue that the practice of recognition vindicates Pascal by admitting its own limitation. It does not claim to establish justice; it claims to manage force. It acknowledges that without effective power, justice is impotent. In this sense, the practice is honest. It does not pretend that the junta is morally legitimate; it pretends only that the junta is the relevant actor. However, Pascal's insight also gives us the vocabulary to critique the practice when it oversteps. The danger arises not when we recognize a powerful regime for the sake of order, but when we begin to believe that this recognition confers moral validity. When states begin to treat effective control as synonymous with rightful authority, ignoring gross violations of human rights or self-determination under the guise of non-interference, they fall into the trap Pascal described. They begin to believe the respectable clothes are the body beneath.

  So, where does this leave us? I am inclined to think that the practice of recognition is best understood as a tragic compromise rather than a philosophical commitment to the supremacy of force. It presupposes that international law is a system for coordinating behavior among distinct political communities, not a global government tasked with enforcing a single theory of justice. It requires that there be a sovereign to coordinate with, and effectiveness is the only reliable proxy for sovereignty we have. This does not mean we must accept Pascal's resignation as the final word. We can maintain the effectiveness criterion for recognition while using other mechanisms, such as sanctions, conditional aid, or international criminal law, to press for legitimacy and justice. The practice of recognition keeps the seat at the table occupied; it does not dictate how the occupant must behave once seated. If we were to demand consent as a precondition for sitting at the table, we might find ourselves with an empty chair and no one to hold accountable for the crimes committed in the room.

  Ultimately, I think your unease stems from the hope that law should be more than a mirror of power relations, and you are right to hold that hope. But the practice of recognition suggests that law is also a tool for managing the reality of power relations so that they do not consume us entirely. It is not that the practice presupposes might makes right in a moral sense, but that it accepts might makes possible in a legal sense. Pascal's distinction helps us see that this is a limitation of the human condition, not a virtue of the legal system. We make the strong just because we cannot do otherwise, but we should not confuse this necessity with virtue. The practice is vindicated only insofar as it prevents greater chaos, but it remains open to critique whenever it is used to shield tyranny from scrutiny. We must walk the line between acknowledging the reality of power and refusing to sanctify it, and that is perhaps the most difficult task in international law. I hope these thoughts offer some clarity, or at least a companionable sense of shared perplexity, as you continue your studies.

  Warmly,

  Your Colleague
