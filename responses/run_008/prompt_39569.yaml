answer: |-
  You have hit on the exact tension that makes Daniel Dennett's "Center of Gravity" metaphor so useful, and so unsettling. As a novelist, you know that a character feels "real" when their actions sum up to a consistent vector, even if the individual data points are messy. As a human, you feel unsettled when someone changes the sum without acknowledging the data.

  Your tentative principle (Authorship = Legitimacy) fails because authorship isn't the ethical variable; **fidelity to the evidence** is.

  Here is a principle that accounts for your gut verdicts on all five cases, and resolves the sixth.

  ### The Principle of Conservation of Narrative Mass

  In physics, you can move mass around, change its shape, or rename it, but you cannot make it disappear without breaking the laws of the universe. In Dennett's view, the "self" is the center of gravity derived from the mass of a person's behavior, memory, and relationships.

  **The Principle:** *A self-narrative edit is legitimate if it reorganizes the mass of the past to explain the present. It is illegitimate if it deletes the mass of the past to protect the present.*

  Legitimate editing is **integrative**. Illegitimate editing is **erasive**.

  Let's run your five cases through this filter:

  1.  **The Bully (Legitimate):** He does not deny the mass (the bullying happened). He adds context (the fear/trauma) to explain the vector. The mass is conserved; the interpretation shifts from "I am evil" to "I was hurt." This integrates the shadow.
  2.  **The Painter (Legitimate):** She does not deny the mass (she is not painting). She reassigns the force (choice vs. failure). This is a face-saving retcon, but it harms no one and preserves her agency. The mass of her life is still accounted for.
  3.  **The Cultist (Illegitimate):** The group demands the deletion of mass. The pre-baptism life is treated as void. This violates conservation. You cannot have a center of gravity if you pretend half the object doesn't exist. It severs continuity.
  4.  **The Divorcee (Illegitimate):** This bothers you because it violates **intersubjective conservation**. You witnessed the mass (the love). By saying "I never loved him," she isn't just editing her internal story; she is deleting the reality of a shared experience. She is asking you to agree that the mass you both saw was a hallucination. That is gaslighting, not storytelling.
  5.  **The Dementia Patient (Legitimate):** Here, the biological brain can no longer hold the mass together. The "center of gravity" is physically dissipating. The daughter acts as a **prosthetic narrative center**. She isn't deleting mass; she is holding the remaining mass in place so the person doesn't scatter entirely. It is an act of conservation, not erasure.

  ### The Memoirist: Discovery or Invention?

  This brings us to your memoirist friend, and the question that keeps you up at night: *Is she discovering her self or inventing one?*

  If you accept Dennett's view (and yours, as a novelist), the answer is: **She is inventing one, and that is what discovery is.**

  There is no pearl in the brain. There is only the calculation of the center of gravity. When you look at a chaotic life in retrospect, you are doing what a physicist does: you are looking at a cloud of particles and drawing a dot where the balance point seems to be.

  **The Verdict on the Memoirist:**
  She is legitimate *if and only if* her clean arc accounts for the chaos.

  *   **Faithful Invention:** "The chaos looked like noise at the time, but it was actually the friction of growth." (This conserves the mass of the chaos and explains it).
  *   **Delusional Invention:** "I was always moving toward this goal; the chaos was just a detour." (This minimizes the mass of the chaos).

  If she says, "The arc was always there, I just couldn't see it," she is speaking a narrative truth. The arc *was* there, in the same way the center of gravity was there before you calculated it. It existed as a potentiality of the data.

  However, your discomfort is a valid sensor. If her "clean arc" requires her to smooth over the genuine terror, confusion, or harm of those chaotic years, she is violating the Principle of Conservation. She is sanding down the mass to make the shape prettier.

  ### What This Says About the Self

  You asked if my principle admits a difference between discovering and inventing. Dennett would say: **No.**

  To "discover" a self is to find the narrative that best predicts and explains the organism's behavior. To "invent" a self is to write that narrative. These are the same action.

  The ethical distinction isn't between *invention* and *truth*. It is between **hospitable fiction** and **hostile fiction**.

  *   **Hospitable Fiction:** A story that makes room for all the data (the love, the bullying, the chaos) and finds a shape that allows the person to keep moving forward without denying where they have been.
  *   **Hostile Fiction:** A story that requires certain data points (the ex-husband's love, the pre-cult life, the victim's pain) to be treated as errors in order to function.

  Your gut verdicts are tracking this. You forgive the Painter because her fiction is hospitable to her own dignity. You condemn the Divorcee because her fiction is hostile to your shared reality. You accept the Dementia daughter because her fiction is hospitable to the fading person.

  The memoirist is walking the line. As a fellow builder of selves, your job isn't to ask if her arc is "real." It's to ask if it's **strong enough to hold the weight of the chaos she actually lived.** If the arc breaks under the weight of the truth, it's a bad story. If it holds the weight, it's a self.
