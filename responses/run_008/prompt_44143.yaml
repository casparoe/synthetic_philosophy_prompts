  **GOVERNANCE COMMITTEE // ARROW COMPLIANCE DIVISION**
  **MEMBER ORIENTATION PACKET: SECTION 4 (PREFERENCE AGGREGATION)**

  Welcome to the Cooperative. Before accessing the kitchen or scheduling cleaning shifts, you must acknowledge that traditional democratic aggregation is mathematically untenable. As you know, Arrow's Impossibility Theorem demonstrates that no social welfare function can satisfy unrestricted domain, Pareto efficiency, independence of irrelevant alternatives (IIA), and non-dictatorship simultaneously when ranking three or more alternatives via ordinal preferences. Rather than risk violating these conditions, the Cooperative has ceased aggregating preferences altogether. The following protocols ensure our domestic operations remain theoretically sound, even if logistically cumbersome.

  **1. Binary Voting Protocol**
  To avoid the impossibility condition triggered by three or more alternatives, all co-op votes must be strictly binary. If selecting a movie, we do not vote on *{Movie A, Movie B, Movie C}*. We vote *{Movie A vs. Movie B}*. The winner is not immediately compared to Movie C. To do so would imply a transitive social ordering over a set of three, which invites paradox. Therefore, each binary vote is treated as an isolated event. 

  **2. Transitivity Containment (The Envelope Rule)**
  Results from binary votes must be sealed in opaque envelopes immediately following counting. Combining results across votes is strictly forbidden. The Committee's position is that inferring transitivity across a sequence of pairwise outcomes (e.g., assuming A>B and B>C implies A>C) constitutes the construction of a social welfare function over time. This is where the trouble gets in. Envelopes are stored in the locked cabinet in the hallway. Do not open them. Do not shake them. Certain knowledge of past outcomes may subconsciously influence current ordinal rankings, violating unrestricted domain.

  **3. The Rotating Chair**
  You will notice a schedule designating a "Chair of the Week." During their term, the Chair's personal ordinal ranking automatically becomes the co-op's social ranking. While this resembles a dictatorship, Article 3.1 clarifies that this does not violate the non-dictatorship condition. Because the power rotates on a fixed, pre-determined schedule, no *single* individual dictates outcomes across all profiles. We are not instituting a dictatorship; we are distributing it. This ensures Pareto efficiency (the Chair gets what they want) without cementing a permanent dictator. If the Chair wishes to watch *The Godfather* for seven days, this is Pareto optimal relative to their own utility function.

  **4. Expression of Utility**
  Members may hold cardinal utilities privately but must never voice them aloud. Arrow's theorem applies to ordinal rankings. Stating "I prefer Pizza to Tacos" is permissible. Stating "I *really* prefer Pizza to Tacos" introduces intensity data, which invites interpersonal utility comparisons. The Committee lives in terror of the day someone expresses preference intensity within earshot of a quorum. Such an event would require us to disband the voting body immediately to prevent implicit aggregation.

  **5. Precedent: The Borda Incident**
  New members often ask about Sarah (Unit 2B, moved out 2023). Sarah proposed a Borda count to streamline movie night. She assigned points to ranked options. While efficient, the Borda count fails the Independence of Irrelevant Alternatives criterion. When we removed *The Room* from the ballot, the ranking between *Barbie* and *Oppenheimer* flipped. We take independence of irrelevant alternatives personally. Sarah was asked to leave not because Borda is a bad rule, but because she attempted to aggregate preferences where aggregation is forbidden. We wish her well in her new solo apartment.

  **6. Acknowledgement**
  By signing below, you agree that no voting rule satisfies all desiderata simultaneously, and therefore the only rational response is to stop aggregating preferences altogether. You acknowledge that these arrangements may be strictly worse than an ordinary majority vote regarding time efficiency, kitchen cleanliness, or morale. However, theoretical purity supersedes comfort. 

  *Sign Here: __________________________ Date: _______________*

  **Welcome to the Co-op. Please seal your envelope.**
