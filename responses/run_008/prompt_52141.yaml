      *   **Tone/Style:** Sharp, not a caricature, distinguishes parity from ties, explains why parity isn't just a rough tie, bites bullets, makes small concessions only when costless. Stay in character. Speak as her (first person), not about her.
      *   **Constraint:** Keep each reply to a single paragraph.
