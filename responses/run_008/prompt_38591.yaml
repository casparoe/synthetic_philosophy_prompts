answer: |-
  Here are the desiderata for a rigorous theory of signal honesty, structured to accommodate the biological cases you know intimately while testing the extensions proposed by economics and philosophy.

  ### Desiderata for a Theory of Signal Honesty

  **1. Specification of the Stabilizing Mechanism**
  *   **Case:** Peacock trains vs. Index signals.
  *   **Requirement:** The theory must explicitly identify the barrier to deception. Is it a physiological constraint (index), a differential marginal cost (handicap), or a threat of future retaliation (enforcement)?
  *   **Status:** **Non-negotiable.** A theory that invokes "honesty" without specifying the constraint on lying is merely a just-so story.
  *   **Bias:** None. This is the baseline for any causal explanation.

  **2. The Differential Cost Condition (Marginal, not Average)**
  *   **Case:** Peacock trains and Academic Credentials.
  *   **Requirement:** If cost is the stabilizer, it cannot simply be high; it must be *differentially* burdensome. A low-quality sender must pay a higher marginal fitness (or currency) cost for the same signal increment than a high-quality sender.
  *   **Status:** **Non-negotiable** for Costly Signaling Theory (CST); **Biological Bias** if applied to all signaling.
  *   **Bias Note:** Economists often treat cost as a fixed entry fee. Biology demands condition-dependence. If the theory demands this for *all* signals, it excludes indices.

  **3. Compatibility with Physical/Developmental Constraints (Indices)**
  *   **Case:** Roar depth in red deer, aposematic coloration (once learned).
  *   **Requirement:** The theory must accommodate signals where faking is physically impossible or developmentally canalized, requiring no ongoing fitness expenditure to maintain honesty.
  *   **Status:** **Non-negotiable.** Excluding indices renders the theory empirically false for many biological systems.
  *   **Bias:** **Anti-Economic.** Economists prefer choice-based models; indices remove choice.

  **4. Temporal Locus of Cost (Ex-Ante vs. Ex-Post)**
  *   **Case:** Threats/Promises (deferred) vs. Peacock trains (upfront).
  *   **Requirement:** The theory must distinguish between costs paid to *produce* the signal (handicap) and costs paid *if caught lying* (punishment/retaliation).
  *   **Status:** **Non-negotiable.**
  *   **Bias:** **Biological.** CST traditionally focuses on ex-ante production costs. Game theory focuses more on ex-post equilibrium payoffs.

  **5. The Conflict Gradient (Partial vs. Total)**
  *   **Case:** Nestling begging (partial conflict) vs. Predator-Prey (total conflict).
  *   **Requirement:** The theory must quantify the degree of interest divergence. Honesty mechanisms valid for parent-offspring (high alignment) may fail for predator-prey (low alignment) unless coupled with indices or pursuit-deterrence logic.
  *   **Status:** **Non-negotiable.**
  *   **Bias:** None. This is standard game-theoretic rigor often missing in verbal biological arguments.

  **6. Currency Generality (Fitness vs. Fiat)**
  *   **Case:** Luxury goods/Degrees vs. Ornaments.
  *   **Requirement:** The theory must allow the "cost" currency to be translatable. Money/Time must map to Fitness/Opportunity for the logic to hold across domains.
  *   **Status:** **Bias (Economic).**
  *   **Bias Note:** Biologists assume fitness is the ultimate currency. Economists assume utility/money. A unified theory requires a mapping function, which is often assumed rather than proven.

  ***

  ### The Impossible Subset

  You asked whether demanding that the theory cover cost-free honest systems while retaining the core insight that "honesty is purchased" is a contradiction. **Yes, it is.**

  If you define the theory's core axiom as the **Handicap Principle** (honesty is guaranteed by wasteful expenditure), you logically exclude **Index Signals** (honesty guaranteed by physical impossibility) and **Common Interest Signals** (honesty guaranteed by aligned goals). You cannot satisfy Desideratum 2 (Differential Cost) and Desideratum 3 (Constraint Compatibility) simultaneously if you insist that *all* honest signals must be costly. To cover the full range of cases (Peacocks *and* Aposematism *and* Indices), you must abandon the Zahavian slogan that "honesty is purchased" and replace it with the broader condition that "honesty is constrained." The cost is one type of constraint, not the definition of the phenomenon.

  ***

  ### Scorecard

  **Zahavi's Handicap Principle** satisfies the peacock case and the differential cost desideratum intuitively but fails the index and aposematism criteria by treating cost as necessary rather than sufficient; it is verbally powerful but mechanistically loose. **Grafen's Formalization** secures the differential cost condition mathematically (separating equilibria) and handles the conflict gradient well, but it rigidly assumes cost is the only stabilizer, failing to accommodate cost-free indices or ex-post punishment without significant modification. **The Index-Signal View** perfectly satisfies the constraint compatibility and cost-free criteria but offers no explanation for wasteful ornaments where physical constraints are absent, rendering it incomplete for sexual selection. **Receiver Retaliation Accounts** excel at the temporal locus (ex-post costs) and nestling begging cases but struggle to explain pre-commitment signals where the receiver cannot verify quality until after the cost is sunk. No single model scores perfectly; a complete theory requires a mosaic of these mechanisms rather than a universal principle.
