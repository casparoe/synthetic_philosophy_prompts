prompt: |-
  I just got out of a two-hour arguement with my Dutch friend that ended with her half-jokingly saying Americans have no idea what "liberal" means. It started because I described myself as a liberal — I'm for abortion rights, a bigger welfare state, higher taxes on the rich. She said that in the Netherlands "liberal" means roughly her own party — the one English-language news always describes as the Dutch liberals — free markets, lower taxes, smaller government, and that by her lights my politics are social-democratic, not liberal at all. Then it got messy: we checked that her party sits in the same European Parliament group as the German free-market FDP, while in America "liberal" basically means the left wing of the Democratic party. But when we asked each other what the word USED to mean, we gave the same answer: individual rights, toleration, constitutional government, free trade. So the weird part is that the old core seems intact everywhere, and yet in Europe the word lands center-right and in America center-left. She ended up saying the two uses are just homonyms that happen to share a history, like "pole" the rod and "pole" the Polish person, and I ended up saying that can't be right because both of us could still recognize a third country's liberal party as liberal on sight. Don't just tell me the word is ambiguous and leave it there — take a definite side: is there one principled meaning under which both her usage and mine fit, and if so, what exactly flipped between Europe and America to move the same tradition to opposite sides? And if you can, untangle the bonus round that broke our arguement: why does "neoliberal" get used as an insult by the left even though it has "liberal" right in it, when "liberal" itself is, in America, a word the left uses about itself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A two-hour argument with a Dutch friend about the meaning of "liberal."
      *   **The Conflict:**
          *   User (American): "Liberal" = Left-wing (abortion rights, welfare state, higher taxes).
          *   Friend (Dutch): "Liberal" = Right-wing/Center-Right (free markets, lower taxes, smaller government).
          *   Shared Historical Understanding: Both agree "classical liberalism" = individual rights, toleration, constitutional gov, free trade.
          *   Friend's Claim: The two usages are homonyms (like "pole" vs. "Pole").
          *   User's Claim: There's a underlying unity (both recognize a third country's liberal party).
      *   **The Task:**
          *   Take a *definite side* (don't just say "it's ambiguous").
          *   Identify if there is *one principled meaning* fitting both usages.
          *   Explain *what flipped* between Europe and America to move the tradition to opposite sides.
          *   **Bonus Round:** Explain why "neoliberal" is a left-wing insult despite containing "liberal," when American leftists call themselves "liberals."

  2.  **Determine the Stance:**
      *   The user wants a definite side. The friend says "homonyms" (no connection). The user says "underlying unity."
      *   *Political Science/Historical Consensus:* The friend is partially right about current usage, but the user is right about the underlying lineage. They aren't homonyms; they are divergent branches of the same tree.
      *   *Decision:* I will side with the **User** (there is a unified core), but acknowledge the friend's observation about current positioning is accurate. The core concept is *individual autonomy*, but the *threat to autonomy* changed, causing the political alignment to flip.

  3.  **Drafting the Core Argument (The "One Principled Meaning"):**
      *   What is the common thread? It's not "free markets" (Dutch) or "welfare" (US). It's **emancipation of the individual from arbitrary authority.**
      *   *Classical Liberalism (19th Century):* The enemy was the State/Monarchy/Church. Solution: Limit state, free markets, individual rights. (Matches Dutch friend's view).
      *   *Modern Liberalism (20th Century US):* The enemy became Industrial Capitalism/Economic Inequality/Social Oppression. Solution: Use state to protect individual capacity to act. (Matches User's view).
      *   *Conclusion:* They share the *goal* (individual freedom), but disagree on the *means* and the *primary obstacle*.

  4.  **Explaining the "Flip" (Europe vs. America):**
      *   *Why did Europe stay "Classical"?* Europe had strong existing Socialist/Social Democratic parties (Labour, SPD, PvdA). The "Liberal" parties kept their 19th-century free-market identity to distinguish themselves from the Socialists.
      *   *Why did America flip?* The US never had a viable Socialist party. The "Left" had to form within the Liberal tradition. During the New Deal (FDR), "Liberalism" was redefined to mean using government to secure "freedom from want." The label "Liberal" stuck to the coalition that embraced the welfare state, while "Conservative" took the mantle of limited government/free markets.
      *   *Key Distinction:* In Europe, "Liberal" vs. "Socialist" is a clear split. In the US, "Liberal" absorbed the "Socialist" policy agenda because there was no separate Socialist party to claim it.

  5.  **Tackling the Bonus Round ("Neoliberal"):**
      *   *Definition:* Neoliberalism refers to the 1970s/80s revival of *classical* economic liberalism (free markets, deregulation, privatization) – think Reagan, Thatcher, Washington Consensus.
      *   *Why the insult?* American "Liberals" (Modern Liberals) see the state as a protector. "Neoliberals" want to shrink the state for market efficiency. To an American Liberal, "Neoliberalism" looks like handing power to corporations and gutting the safety net.
      *   *The Irony:* "Neoliberal" is essentially what the Dutch friend calls "Liberal." So, American Liberals insult "Neoliberals" for being too close to European "Liberals."
      *   *Why keep the name?* The intellectuals (Hayek, Friedman) saw themselves as restoring *true* liberalism against the "distorted" New Deal liberalism.

  6.  **Refining the Tone:**
