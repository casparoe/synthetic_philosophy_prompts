answer: |-
  You win the argument. Your friend is right about the *map*, but you are right about the *territory*. They are not homonyms like "pole" and "Pole"; they are estranged cousins who grew up in different houses.

  Here is the definite side: **There is one principled meaning under which both usages fit.** That meaning is **individual autonomy.** The split happened because you and your friend disagree on what currently *threatens* that autonomy.

  Here is exactly what flipped, why it flipped differently in the US versus Europe, and the answer to your bonus round.

  ### 1. The One Principled Meaning: "Freedom From What?"
  The core of liberalism, from John Locke to you to your Dutch friend, is the emancipation of the individual from arbitrary authority. The disagreement is not about the *goal* (a free individual); it is about the *obstacle*.

  *   **19th Century (The Root):** The obstacle was the **State** (Monarchs, Church, Aristocracy). To free the individual, you had to chain the government. This meant free markets (to break guilds/mercantilism), free speech, and low taxes. This is your friend's definition.
  *   **20th Century (The American Shift):** The obstacle became **Private Power** (Industrial monopolies, poverty, systemic discrimination). A starving worker or a segregated citizen isn't "free," even if the government leaves them alone. To free the individual, you had to *use* the government to break up private power and guarantee a baseline of security. This is your definition.

  Philosophers call this the shift from **Negative Liberty** (freedom *from* interference) to **Positive Liberty** (freedom *to* act). Both are "liberal" because both prioritize the individual's capacity to live their own life.

  ### 2. What Flipped? (The Transatlantic Divergence)
  If the logic is the same, why is the Dutch *VVD* center-right and the US *Democrats* center-left? Two specific historical accidents caused the flip.

  **A. The Presence of a Socialist Party**
  *   **In Europe:** Strong Socialist and Social Democratic parties emerged early (Labour in UK, SPD in Germany, PvdA in Netherlands). They claimed the mantle of "workers' rights," "welfare," and "state intervention." This forced the "Liberal" parties to distinguish themselves by sticking to their 19th-century roots: free markets and limited government. In Europe, "Liberal" vs. "Socialist" is a clear battle line.
  *   **In America:** The US never developed a viable Socialist party. During the Great Depression, the Left had nowhere to go but into the existing liberal coalition. When FDR launched the New Deal, he didn't call it "Socialism"; he called it "Liberalism." He redefined the word to mean "using the state to secure economic freedom." Because there was no competing party to claim the "welfare state" label, American Liberalism absorbed the European Social Democratic agenda.

  **B. The Definition of "Conservatism"**
  *   **In Europe:** Conservatives were often traditionalists, monarchists, or Christian Democrats who were skeptical of *both* free markets and radical individualism.
  *   **In America:** Because "Liberal" moved left to embrace the welfare state, the opposition (Conservatives) moved right to embrace the 19th-century free-market view.

  **The Result:** In the US, "Liberal" means "New Deal/Great Society" (Center-Left). In Europe, "Liberal" means "Classical/Free Market" (Center-Right). But both claim to be protecting the individual.

  ### 3. The Bonus Round: The "Neoliberal" Insult
  This is where the terminology gets truly messy, but it follows the logic above.

  **What is Neoliberalism?**
  "Neoliberalism" is an intellectual movement from the 1970s (Hayek, Friedman) that argued Modern Liberalism (the US version) had gone too far. They believed the welfare state had become the *new* threat to individual autonomy. They wanted to return to the 19th-century "Classical" model: deregulation, privatization, and free trade.

  **Why is it an insult from the American Left?**
  To an American "Liberal" (you), the state is a tool for protection. To a "Neoliberal," the state is a distortion of the market.
  *   When an American leftist calls someone a "Neoliberal," they are accusing them of **abandoning the Modern Liberal project** (protecting people from market forces) and **returning to the Classical Liberal project** (letting market forces rule).
  *   Essentially, an American Liberal is calling a Neoliberal a "European Liberal."

  **The Irony:**
  *   **You (US Liberal):** "I am a Liberal." (Meaning: I support the welfare state.)
  *   **Your Friend (Dutch Liberal):** "I am a Liberal." (Meaning: I support free markets.)
  *   **The Insult:** "He's a Neoliberal!" (Meaning: He acts like a Dutch Liberal, not an American Liberal.)

  "Neoliberal" is an insult because it implies a betrayal of the 20th-century redefinition of the word. It suggests the person is prioritizing *market efficiency* (Classical liberty) over *social equity* (Modern liberty).

  ### The Verdict
  Tell your friend this:
  If the words were truly homonyms, you wouldn't be able to trace the family tree. You can. You both value the individual. She believes the government is the biggest threat to that individual; you believe unchecked inequality is the biggest threat to that individual.

  The word didn't break; the world changed. In Europe, the "Liberal" party stayed in the 19th century because the Socialists took the 20th. In America, the "Liberal" coalition dragged the word into the 20th century because there were no Socialists to stop them.

  You are both liberals. You're just fighting different dragons.
