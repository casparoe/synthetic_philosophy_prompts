      *   *Claim 2: Early movers dictate; later movers copy.*
          *   **Verdict:** Mostly accurate, but needs qualification. It's not just "early movers," it's when the *weight* of public history outweighs private signal precision.

      *   *Claim 3: People discard private information ("throw out").*
          *   **Verdict:** Technically true *in the model*, but the user's intuition about "smart updating" is also right. This is the key tension. In a cascade, the public signal is so strong that the private signal becomes *statistically irrelevant* for the decision, even though Bayesian updating is happening. It's rational ignorance, not stupidity.
          *   *Nuance:* They don't "ignore" it in the sense of being irrational; they rationally infer that the crowd knows more. But yes, their private info isn't *revealed* in their action.

      *   *Claim 4: Explains fads, bank runs, bubbles.*
          *   **Verdict:** Overstated. Cascades explain *some* aspects, but bank runs are often better modeled by coordination games (Diamond-Dybvig) rather than pure information cascades. Bubbles often involve heterogeneous beliefs or agency problems. It's a "one size fits all" pop-sci overreach.

      *   *Claim 5: Conformity is a failure of independent thinking ("sheep").*
          *   **Verdict:** Wrong/Misleading. This is the "rationality" vs. "behavioral" confusion. In the standard model, agents are *perfectly rational Bayesians*. They aren't sheep; they are optimal processors of information. The *outcome* is inefficient, but the *behavior* is rational.

      *   *Claim 6: Cascades are unstoppable/only broken by shocks.*
          *   **Verdict:** Mixed. In the basic model, yes, they are absorbing states. But in extended models (with public news, price adjustments, or endogenous timing), they are fragile. The "fragility" literature (e.g., BHW 1998) is important here. Small public signals can break them.

