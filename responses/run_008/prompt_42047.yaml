      *   **Target Audience:** Someone interested in economics, likely familiar with basic concepts but wants expert nuance (economist who works on herding).

  2.  **Deconstruct the Claims & Compare with Economic Theory:**

      *   *Claim 1: Observation leads to cascades.*
