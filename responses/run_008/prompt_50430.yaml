prompt: |-
  I work as a patient-safety investigator for a large hospital trust, and one of the recurring problems in our serious-incident reviews is deciding when a failure to act gets written up as a causal contributing factor and when it just goes into the background narrative. A patient deteriorates overnight and nobody escalates to the on-call doctor; a scan result sits unactioned because the ordering doctor went on leave and handed nothing over; a locum doesn't read the notes that were available. Everyone on the review panel agrees these omissions "mattered," but we have no shared rule for when an omission is a cause of the harm versus context, and the disagreement always gets resolved by whoever is loudest in the room. I've been reading a bit of philosophy on this and the problem seems to be structural: absences are everywhere, so if we use the ordinary counterfactual test — the harm wouldn't have occurred had someone done the thing they didn't do — almost any non-event qualifies, from the nurse who didn't recheck the patient to the nurse who happened to be on a different ward. What appears to do the real work is some notion of an expectation of intervention: an omission counts as causal only against a background of who was supposed to do what, which is partly a fact about rosters and protocols but partly a judgment about what counts as normal in the first place — and I can see that normality judgments are exactly where hindsight bias sneaks in, since after a death everything a reasonable person failed to anticipate looks like an obvious omission.

  Please build us a decision procedure we can actually run inside a forty-five-minute review meeting with clinicians who have no patience for philosophy. It should take the panel through the questions in order: how to identify candidate omissions without the list exploding into every conceivable non-event; how to test whether the omission made a difference to the outcome in the relevant sense; how to weigh duty or protocol against reasonable departures from both; how to keep what people could have known at the time separate from what we know now; and where the procedure should stop with "background factor, no formal finding." It should end in one of three dispositions on our incident form — causal contributing factor, contextual note, or no finding — with a named senior clinician signing off, and it must be honest about which steps are judgment calls wearing procedure clothes. Please also flag explicitly what the procedure cannot do: I don't expect it to settle legal liability or individual blame, and it should say so rather than pretending otherwise.

  Then run it on three cases from our recent files. First: a night nurse who didn't escalate a deteriorating patient, where the escalation criteria in the protocol were genuinely ambiguous and several experienced nurses have said they would have read them the same way. Second: a patient who died because the on-call doctor was never informed of a critical result, but no individual was assigned to inform anyone — the handover system simply had no owner for that step. Third, and I want you to include this even though I dislike where I suspect it lands: an experienced nurse who checked the patient only once during a night on which the rosters were so thin that checking more often was not physically possible for anyone on shift. If your procedure classifies that third case as a systemic factor rather than a causal finding about the nurse, fine — but I want to see whether the procedure says so for principled reasons or just because the facts make us uncomfortable, and what the panel is supposed to do when the procedure's answer and the family's expectation of a named cause come apart.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analyses:

  1.  **Deconstruct the Request:**

      *   **User Role:** Patient-safety investigator for a large hospital trust.
      *   **Problem:** Inconsistent classification of omissions (failures to act) in serious incident reviews. Is it a *causal contributing factor* or just *background narrative*?
      *   **Core Issue:** The counterfactual test ("would harm have happened if they acted?") is too broad (absences are everywhere). The real differentiator is *expectation of intervention* (norms, duties, protocols), which is vulnerable to hindsight bias.
      *   **Requirements:**
          *   Build a decision procedure usable in a 45-minute meeting.
          *   Audience: Clinicians with no patience for philosophy.
          *   Steps needed: Identify candidate omissions (prevent explosion), test causal difference, weigh duty/protocol vs. reasonable departure, separate ex-ante knowledge from hindsight, define stopping point ("background").
          *   Output: Three dispositions (Causal Contributing Factor, Contextual Note, No Finding).
          *   Sign-off: Named senior clinician.
          *   Honesty: Acknowledge judgment calls and limitations (not for legal liability/blame).
          *   Application: Run the procedure on three specific cases provided by the user.
          *   Specific Constraint: Case 3 (understaffing) must be analyzed honestly, even if it conflicts with family expectations.

  2.  **Philosophical & Practical Foundation:**

      *   *The Philosophical Bit:* The user correctly identifies the problem as the "omission vs. background" problem in causation (Hart & Honoré, etc.). The solution lies in distinguishing "abnormal conditions" from "mere conditions." In safety science, this maps to "Local Rationality" (why did it make sense to them at the time?) and "System vs. Individual" (Just Culture).
      *   *The Practical Bit:* Needs to be a checklist or flowchart style. Needs to be fast. Needs to force explicit conversation about *norms* without getting bogged down in abstract ethics.
      *   *The "Honesty" Bit:* Must explicitly state that this is a safety tool, not a legal tribunal. It cannot resolve the tension between systemic causes and the human need for a named responsible party.

  3.  **Drafting the Decision Procedure (The "Omission Triage Tool"):**

      *   *Name:* Needs to sound clinical/operational, not philosophical. "Omission Causality Triage (OCT)" or "Failure-to-Act Assessment." Let's go with **Omission Causality Assessment (OCA)**.
      *   *Timebox:* 45 minutes total. Each step needs a time limit.
      *   *Step 1: Candidate Selection (The "Floodgate" Check).* How to stop "the nurse on the other ward" from being listed? Focus on *proximity* and *role*.
      *   *Step 2: The Counterfactual (The "But-For" Test).* Keep it simple. If they acted, would the outcome likely change?
      *   *Step 3: The Normative Expectation (The "Should" Test).* This is the crux. Was there a duty? Was it reasonable? This is where hindsight bias lives. Need a specific question to counter it (e.g., "What would a peer have done *before* knowing the outcome?").
      *   *Step 4: Ex-Ante Knowledge (The "Fog of War" Check).* What did they know *then*?
      *   *Step 5: Disposition.* Map answers to the three outcomes.
      *   *Disclaimer:* Essential preamble.

  4.  **Refining the Steps (Self-Correction during drafting):**

      *   *Critique:* Is Step 3 too vague?
      *   *Fix:* Add a "Peer Consensus" prompt. Ask the panel: "If we polled 100 similar clinicians *before* this incident, how many would say this action was required?"
      *   *Critique:* How to handle the "System vs. Individual" tension in Case 3?
      *   *Fix:* Ensure Step 3 explicitly asks if the omission was *forced* by system constraints. If yes, it shifts the causal weight to the system, not the individual omission.

  5.  **Running the Cases:**

      *   *Case 1: Ambiguous Protocol (Night Nurse).*
          *   *Analysis:* Counterfactual yes (escalation might have saved them). Normative expectation? Low/Ambiguous. If experienced peers agree the protocol was unclear, it's not a *culpable* omission, but the *ambiguity* is a causal factor.
          *   *Disposition:* Contextual Note (for the nurse), Causal Factor (for the protocol). Wait, the prompt asks about the *omission* specifically. If the omission wasn't a breach of reasonable expectation, it's Background/Context. The *protocol* is the cause.
      *   *Case 2: No Owner (Handover).*
          *   *Analysis:* Counterfactual yes. Normative expectation? No individual duty existed because the system didn't assign it. This is a "System Induced Omission."
          *   *Disposition:* No Finding (for individual), Causal Factor (for the system design).
      *   *Case 3: Understaffing (Experienced Nurse).*
          *   *Analysis:* Counterfactual yes (more checks might have caught it). Normative expectation? Physically impossible. The "ought implies can" principle.
          *   *Disposition:* No Finding (for the nurse). Causal Factor (for staffing levels).
          *   *Addressing the Family Expectation:* This needs a specific section in the analysis. The procedure protects the nurse, but the report must explain *why* to the family without sounding like bureaucratic shielding.

  6.  **Addressing the "Honesty" Requirement:**

      *   Need a "Limitations" section. It doesn't assign blame. It doesn't satisfy tort law. It doesn't fix the grief of the family who wants a name.

  7.  **Final Review against Constraints:**

      *   45-minute feasible? Yes, if timed.
      *   Three dispositions included? Yes.
      *   Senior sign-off? Included.
      *   Philosophical honesty? Included.
      *   Case 3 handled principledly? Yes, focusing on "Ought Implies Can."

  8.  **Tone and Style:**

      *   Professional, direct, empathetic but rigorous. Avoid jargon where possible, but use safety science terms correctly (Just Culture, Local Rationality).
      *   Structure: Introduction -> The Procedure -> The Limitations -> The Case Applications.

  9.  *(Self-Correction on Case 1)*: The prompt asks about the *omission* being a causal factor. If the protocol is ambiguous, is the *nurse's failure to escalate* a cause? Technically, yes, physically. But normatively, no. The procedure needs to distinguish between *Physical Causation* and *Attributable Causation*. I will build this distinction into Step 3.

  10. *(Self-Correction on Case 3)*: The user worries the procedure will just say "systemic" to make us comfortable. I need to ensure the logic is explicit: If the action was *physically impossible*, the omission cannot be a *deviant* cause. It is a *normal* condition of that work environment. Therefore, it is background context for the individual, but a causal factor for the trust.

  11. *Final Polish:* Ensure the distinction between "Causal Contributing Factor" (needs action plan) and "Contextual Note" (understanding only) is clear.

  *(Drafting the response based on these thoughts...)*
answer: |-
  Here is a decision procedure designed for your constraints, followed by the application to your three cases.

  ### The Omission Causality Assessment (OCA) Procedure

  **Purpose:** To standardize how review panels classify failures to act (omissions) in serious incident reviews.
  **Time:** 45 Minutes maximum.
  **Sign-off:** Requires signature of the Senior Clinician on the panel (Consultant level or equivalent).
  **Disclaimer:** *This procedure determines safety learning and system improvement. It does not determine legal liability, professional misconduct, or individual blame. It cannot resolve the moral distress of families seeking a named responsible party.*

  ---

  #### Phase 1: The Floodgate Check (5 Minutes)
  *Goal: Prevent the list of omissions from exploding into "everything that didn't happen."*

  **Question 1: Proximity & Role.**
  Did the individual have **physical proximity** to the patient/task AND a **role-based relationship** to the task at the specific time?
  *   *Yes:* Proceed to Phase 2.
  *   *No:* **Stop.** Classify as **No Finding**. (Example: The nurse on the next ward).

  **Question 2: The Physical Counterfactual.**
  If the action *had* been taken, is it more likely than not (>50%) that the harm would have been prevented or mitigated?
  *   *Yes:* Proceed to Phase 3.
  *   *No:* **Stop.** Classify as **Contextual Note**. (The omission didn't change the outcome).

  ---

  #### Phase 2: The Normative Expectation Test (20 Minutes)
  *Goal: Distinguish between a "cause" and a "condition" by testing expectation without hindsight bias.*

  **Question 3: The "Ex-Ante" Peer Standard.**
  Ignore the outcome. Based *only* on what was known at the time: Would a reasonable peer group (100 similar clinicians) agree this action was **required**, **optional**, or **impossible**?
  *   *Required:* Proceed to Question 4.
  *   *Optional:* **Stop.** Classify as **Contextual Note**. (Variation in practice is not a causal failure).
  *   *Impossible:* **Stop.** Classify as **No Finding** (for the individual). See Phase 3 for System classification.

  **Question 4: The Hindsight Brake.**
  Is the judgment that this was "required" dependent on knowing the bad outcome? (i.e., Does it look obvious only because we know the patient died?)
  *   *Yes:* **Stop.** Classify as **Contextual Note**. (This is hindsight bias).
  *   *No:* Proceed to Question 5.

  **Question 5: Capacity & Constraint.**
  Did the individual have the **resources, time, and authority** to act without violating a higher-priority safety constraint?
  *   *Yes:* Proceed to Disposition.
  *   *No:* **Stop.** Classify individual omission as **No Finding**. Flag the *constraint* (e.g., staffing, equipment) for System Causal Factor classification.

  ---

  #### Phase 3: Disposition & Sign-off (15 Minutes)
  *Goal: Assign the formal label and identify the learning.*

  **Select One Disposition:**

  1.  **Causal Contributing Factor:**
      *   *Criteria:* Passed Phase 1 & 2. Action was required, possible, and known ex-ante. Failure to act directly enabled harm.
      *   *Action:* Requires a specific remedial action plan (training, protocol change, disciplinary review if gross negligence).
  2.  **Contextual Note:**
      *   *Criteria:* Action mattered physically (Phase 1), but expectation was ambiguous, optional, or tainted by hindsight.
      *   *Action:* Recorded in narrative for understanding. No specific action plan against the individual.
  3.  **No Finding:**
      *   *Criteria:* Action was impossible, outside role, or would not have changed outcome.
      *   *Action:* Not recorded as a failure. If system constraints caused this, the *system* is recorded as the Causal Factor instead.

  **Senior Clinician Sign-off:**
  *I certify that the panel has applied the Hindsight Brake (Q4) and Capacity Check (Q5) in good faith. I accept that this classification prioritizes system safety over individual attribution.*
  [Signature/Date]

  ---

  ### What This Procedure Cannot Do (Explicit Limitations)

  1.  **It cannot satisfy the need for blame.** Families often seek a named human cause to make sense of grief. This procedure may conclude that "no one person failed," which can feel like evasion to outsiders. The report must explain this distinction clearly.
  2.  **It cannot settle legal negligence.** The "reasonable peer" test (Q3) is a safety standard, not a tort law standard. A court may find liability where this procedure finds "Contextual Note."
  3.  **It cannot fix resource constraints.** If Phase 2, Q5 flags understaffing as the cause, this procedure identifies it but cannot fund the extra nurses. It pushes the conflict to the Trust Board.

  ---

  ### Application to Recent Files

  Here is the OCA procedure applied to your three cases.

  #### Case 1: The Ambiguous Protocol (Night Nurse)
  *Scenario: Nurse didn't escalate deteriorating patient. Protocol criteria were ambiguous. Peers agree they would have read it the same way.*

  *   **Phase 1:**
      *   Q1 (Proximity/Role): **Yes.** Night nurse on duty.
      *   Q2 (Counterfactual): **Yes.** Escalation likely leads to intervention.
  *   **Phase 2:**
      *   Q3 (Ex-Ante Peer Standard): **Optional/Ambiguous.** Panel confirms experienced peers interpret the protocol variably. It was not clearly "required."
      *   Q4 (Hindsight Brake): **N/A** (Stopped at Q3).
  *   **Disposition:** **Contextual Note.**
  *   **Rationale:** The omission is physically causal, but normatively neutral. The nurse acted within the range of reasonable interpretation *at the time*. To classify this as a Causal Factor would be to punish the nurse for a protocol defect.
  *   **System Action:** The *Protocol Ambiguity* is classified as a **Causal Contributing Factor**. The learning is to rewrite the criteria, not to retrain the nurse.

  #### Case 2: The Ownerless Handover (Critical Result)
  *Scenario: Patient died because on-call doctor never informed. No individual assigned to inform anyone. System had no owner for this step.*

  *   **Phase 1:**
      *   Q1 (Proximity/Role): **Yes.** (Assuming we are testing the specific clinician who received the result).
      *   Q2 (Counterfactual): **Yes.** Informing the doctor would likely have saved the patient.
  *   **Phase 2:**
      *   Q3 (Ex-Ante Peer Standard): **Optional/Undefined.** If the system has no owner, no individual has a clear duty. A peer would say, "I didn't know it was my job."
      *   Q5 (Capacity/Constraint): **System Constraint.** The workflow design made the action invisible.
  *   **Disposition:** **No Finding** (for the individual clinician).
  *   **Rationale:** An omission cannot be causal *against the individual* if the system did not create the expectation of action. This is a "System-Induced Omission."
  *   **System Action:** The *Handover Design* is classified as a **Causal Contributing Factor**. The report must state: "The failure was not the person's inaction; the failure was the system's silence."

  #### Case 3: The Impossible Shift (Understaffing)
  *Scenario: Experienced nurse checked patient once. Rosters so thin checking more was physically impossible. Patient deteriorated between checks.*

  *   **Phase 1:**
      *   Q1 (Proximity/Role): **Yes.**
      *   Q2 (Counterfactual): **Yes.** More frequent checks likely would have caught the deterioration.
  *   **Phase 2:**
      *   Q3 (Ex-Ante Peer Standard): **Impossible.** Peers confirm that given the patient load and shift length, more checks were physically unachievable.
      *   Q5 (Capacity/Constraint): **Failed.** The nurse lacked the *time* resource. "Ought implies can."
  *   **Disposition:** **No Finding** (for the nurse). **Causal Contributing Factor** (for the Trust Staffing Model).
  *   **Rationale:** This is the hardest case. The procedure classifies the nurse's omission as "Background Context" because it was a *normal condition* of that work environment, not a *deviation*.
  *   **Addressing the Family Expectation:**
      *   *The Conflict:* The family expects a named cause (the nurse). The procedure says the cause is the Trust.
      *   *The Procedure's Instruction:* The panel must not cave to pressure to label the nurse to "close the file."
      *   *Communication Strategy:* The report must explicitly state: *"We investigated whether the nurse failed to do their job. We found they did everything physically possible within the roster provided. The failure was not in the nursing care, but in the resourcing of the shift."*
      *   *Why this is principled, not comfortable:* If you classify this as a nurse failure, you normalize understaffing. You tell the system, "It is acceptable to expect humans to do the impossible." By classifying it as a System Causal Factor, you force the risk to sit with the budget holders, where it belongs. The discomfort the family feels is the friction of truth-telling in a resource-constrained system.

  ### Final Note to the Panel

  When you sign off on Case 3, you are acknowledging that the "cause" of the death is a budget decision made months prior by people not in the room. This procedure protects the nurse not out of kindness, but out of accuracy. If you classify the nurse's omission as a **Causal Contributing Factor**, you are scientifically lying about the conditions of work. Use the **No Finding / System Factor** disposition to tell the truth, even if it makes the meeting harder.
