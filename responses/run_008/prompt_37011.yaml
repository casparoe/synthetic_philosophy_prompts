  6.  **Refining the Logic (Self-Correction during drafting):**
      *   *Critique:* Is there a contradiction between (2) and (5)? (2) says protect citizen jobs over foreigners. (5) says don't deport undocumented workers.
      *   *Resolution:* (2) is about *hiring* (entry/access). (5) is about *removal* (after establishment). M is okay with walls, but once you're in and paying, you're in.
      *   *Application to Vaccines:* The vaccines are *surplus*. This is key. It's not about taking jobs (scarcity of employment), it's about waste management vs. humanitarian need.
      *   *M's View on Waste:* In (3), she wants dollars to do the most good. Wasting vaccines is inefficient.
      *   *M's View on Claims:* Expats have the "Magical Line" of citizenship. Undocumented have the "Shared Scheme" of taxes.
      *   *Decision:* The "Shared Scheme" (Cooperative) argument is stronger for *local* distribution. The "Citizenship" argument is stronger for *national* protection. Since this is a City Council vote on local surplus, the Cooperative argument wins.
      *   *Confidence:* High on the framework, Medium-High on the vote (could go split, but "undocumented" fits the deportation precedent better).
      *   *Flag:* The tension between (2) and (4) is the weak point. (4) says "stranger is a stranger," but (2) says "our workers." I need to explain how she reconciles this. (Reconciliation: Institutional vs. Personal).

  7.  **Final Polish:**
