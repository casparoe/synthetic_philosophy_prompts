          *   *The Pivot:* The vaccine is a public health resource allocated to the *city*. The undocumented residents are *in the city*, paying city taxes. The expats are citizens, but are they residents? The prompt says "recently returned expat citizens."
          *   *Prediction:* M would likely prioritize the **Undocumented/Clinic** group, or split heavily in their favor, *but* her reasoning will be specific. She won't argue "borders don't matter." She will argue "these people are de facto members of the cooperative scheme (taxes/work), whereas citizenship alone without current contribution is a weaker claim on *local* resources."
          *   *Wait, check (2):* She supports protecting citizen jobs. Does a vaccine count as a "job"? No, it's health/safety.
          *   *Check (5):* She protected the undocumented woman from deportation. This is a strong precedent for "presence + contribution = rights."
          *   *Check (1):* She saves her own kid. Who is "her own kid" in a political sense? The community that functions together.
          *   *Refined Prediction:* She votes for the **Clinic (Undocumented)**. Why? Because in her framework, the *State* owes citizens specific diplomatic/protectionist aid (Embassy/Jobs), but *Local Resources* (like surplus vaccines in a city) belong to the people currently sustaining the local system (taxes/presence). The expats have the Embassy for protection; the undocumented have only the city.
          *   *Alternative:* She splits it. But M seems decisive (Item 1: "didn't think this needed defending"). Splitting feels like vagueness, which the user wants to avoid.
          *   *Best Fit:* She gives the vaccines to the clinic. Reasoning: Citizenship grants a claim on the *Nation* (Embassy/Federal Jobs), but Residence + Contribution grants a claim on the *City* (Vaccines/Schools). The expats are citizens of the Nation, but the undocumented are members of the City.

  5.  **Drafting the Response:**
      *   *Structure:*
          1.  Confidence Disclaimer (as requested).
          2.  Deconstruction of M's Moral Algorithm (The Rules).
