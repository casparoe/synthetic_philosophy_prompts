      *   *(5) Embassy vs. Deportation:* Embassy *must* save citizens (even tax-dodging expats). Undocumented residents (30 years, tax-paying) *should NOT* be deported for paperwork errors. *Implication:* Citizenship triggers specific state obligations (embassy). Long-term residence + contribution (taxes/work) triggers a right to stay/humanitarian protection, even without papers.

  3.  **Synthesize the Moral Framework:**
      *   *Observation:* M is not a standard Cosmopolitan (open borders, no national preference) nor a standard Nationalist (citizens first, always).
      *   *Key Distinction:* **Institutional Role vs. Personal Morality.**
          *   *State/Government:* Has a specific duty to citizens (embassy, jobs protection). This is the "contract."
