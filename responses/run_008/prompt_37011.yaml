answer: |-
  Here is a reconstruction of M's moral framework, applied to your scene, with confidence levels and stress tests attached.

  ### 1. The Confidence Disclaimer
  I am working with five data points to model a complex human psychology. Humans are often inconsistent, and people frequently hold contradictory values that they reconcile only in the moment.
  *   **High Confidence (85%+):** I am confident M distinguishes sharply between *personal morality* (where borders don't matter) and *state function* (where borders create specific duties).
  *   **Medium Confidence (70%):** I am confident she prioritizes "contribution to the scheme" (taxes/work) over "abstract legal status" when dealing with local resources.
  *   **The Bet-Against Zone:** I would bet against M being a consistent philosophical nationalist. If you write her as someone who believes citizens are inherently *morally superior* to foreigners, you will break her character. She views citizenship as a *contractual status*, not a measure of human worth.

  ### 2. Reverse-Engineering the Rules
  Based on your five points, M does not operate on a single spectrum of "Open Borders" vs. "America First." She operates on a **Dual-Track System**:

  **Track A: The State (The Club)**
  *   **Rule:** The government is a mutual aid society for members.
  *   **Evidence:** Point 2 (protect citizen jobs), Point 5 (embassy evacuates citizens).
  *   **Nuance:** Membership isn't just blood or passport; it's participation. In Point 5, she defends the tax-dodging expats' right to evacuation (because they are members) *but* she also defends the undocumented woman's right to stay (because she participated via taxes/work for 30 years).
  *   **Conclusion:** For M, the State owes protection to Citizens *and* De Facto Members (long-term contributors).

  **Track B: The Individual (The Human)**
  *   **Rule:** My personal charity and moral regard have no borders.
  *   **Evidence:** Point 3 (donations go where most effective), Point 4 (stranger is a stranger).
  *   **Nuance:** She gets annoyed when people confuse Track A with Track B. She thinks it's virtuous to give globally (Track B) but realistic to vote for local protectionism (Track A).

  **The Friction Point:**
  The tension between Point 2 (protect our jobs) and Point 5 (don't deport undocumented workers) is resolved by **Time and Contribution**. Point 2 is about *entry/access* (keeping outsiders out to protect insiders). Point 5 is about *removal* (once you are inside and contributing, you cannot be cast out on a technicality).

  ### 3. The Vote: What Petra Says
  **The Prediction:** Petra votes to allocate the surplus vaccines to the **clinic serving the undocumented residents.**

  **The Reasoning:**
  This is a City Council vote, not a Federal foreign policy decision. In M's framework, the City is a "shared cooperative scheme."
  1.  **Efficiency (Track B):** Wasting vaccines is immoral. If the expats have other options (citizenship gives them mobility/access elsewhere) and the undocumented do not, the dollar (or dose) does more good at the clinic.
  2.  **Contribution (Track A):** The undocumented residents have paid taxes and worked for 30 years (per Point 5 precedent). They are *de facto* members of the city. The "recently returned expats" are citizens, but if they just returned, they haven't necessarily re-entered the cooperative scheme (paying local taxes, sustaining the local economy) yet.
  3.  **The "Magical Line" Limit:** M believes borders are magical lines for *governments*, not for *humanity*. The embassy (federal) must save citizens abroad (Point 5). But a city council (local) dealing with surplus health supplies should act on human need and local contribution.

  **Sample Dialogue/Interiority for Petra:**
  > "Look, if this were a federal evacuation, I'd say citizens first. That's the contract. But this isn't about sovereignty; it's about surplus. We have doses sitting in a freezer expiring while people in this zip code—who pay our property taxes through their rent and work our service jobs—are exposed.
  >
  > "The expats have a passport. That's a safety net. The people at that clinic don't have a net; they have us. I didn't vote to protect jobs just to let our neighbors die because of a paperwork error. Give the doses to the clinic. Wasting them because of a border line is exactly the kind of magical thinking I hate."

  ### 4. Why This Fits (and Where It Risks Breaking)
  **Why it fits:**
  *   It honors Point 5 (protecting long-term undocumented residents from bureaucratic cruelty).
  *   It honors Point 3 (utilitarian efficiency: don't let doses expire/waste).
  *   It honors Point 1 (priority to "kin"): In this context, the "kin" are the people sustaining the local economy, not just abstract citizens.

  **The Risk (The Bet-Against Zone):**
  The biggest risk here is Point 2. If M believes the government's primary job is to protect citizens *even when foreigners lose out*, would she view giving vaccines to non-citizens as a betrayal of that duty?
  *   *Mitigation:* The vaccines are **surplus**. There is no zero-sum loss for the citizens here. The citizens aren't losing doses; they just aren't getting *extra* ones. M is ruthless, but she isn't cruel without cause. If citizens were dying for lack of vaccines, she might vote differently. But with surplus, her "Effective Altruism" (Point 3) bleeds into her governance.

  ### 5. The Stress Test: A Future Chapter
  To truly test if this reconstruction holds, you need a scene where **Citizenship** and **Contribution** are in direct conflict, and **Scarcity** is real.

  **The Scenario:**
  A state-level grant for housing assistance. There is enough money for 50 families.
  *   **Group A:** 50 Citizen families who are currently unemployed and have not paid income tax in two years (perhaps due to economic downturn).
  *   **Group B:** 50 Undocumented families who are employed, pay payroll taxes, but live in substandard housing.

  **Why this forces the rules apart:**
  *   **Track A (State/Club):** Favors Group A (Citizens). The state exists to catch its own when they fall.
  *   **Track B (Contribution/Cooperative):** Favors Group B (Taxpayers). They are funding the grant; denying them feels like theft.
  *   **Track C (Efficiency):** Might favor Group B (Employed people staying housed keeps them employed; unemployed people might need more than just housing).

  **What M would likely do (The Prediction):**
  This is where she might surprise you. I suspect she would **split the grant**, but her reasoning would be volatile. She would argue that the State *must* catch its citizens (Point 2), *but* that it is immoral to tax workers without protecting them (Point 5).
  *   *The Conflict:* If you force her to choose only one group, this is the scenario where she might actually choose the **Citizens**, marking a hard limit on her cosmopolitanism. She accepts the "Magical Line" when it comes to the safety net for her own "tribe," even if they aren't contributing.
  *   *Why:* Point 1 (save your own kid) is the trump card. When resources are truly scarce (housing vs. nothing), the "kinship" of citizenship overrides the "contract" of taxation.

  **Writer's Note:**
  If you use the Vaccine scene, keep the emphasis on **surplus**. If you make the vaccines scarce, M's Point 1 (save your own kid) might override Point 5 (don't deport), and she would vote for the citizens. The surplus is the loophole that allows her Effective Altruism (Point 3) to win.
