answer: |-
  You have a very sharp intuition, and you're right to be skeptical of the "paradox" label if the problem is presented loosely. However, there are two specific technical reasons why the Absent-Minded Driver (AMD) is considered a big deal in decision theory, and one likely mix-up in the numbers you were given.

  Let's tackle the numbers first, because they determine whether the problem exists at all.

  ### 1. A Quick Correction on the Payoffs
  You mentioned: *"Exiting at the first gives him 0, exiting at the second gives 1, and continuing through both gets him home for 4."*

  If those are the payoffs, **there is no paradox and no mixed strategy.** If getting home (4) is better than exiting at the second intersection (1), the rational driver should simply continue with probability $p=1$ every time. The expected payoff would be 4.

  For the solution to be $p=2/3$, the payoffs must be reversed for the last two outcomes (this is the standard Piccione & Rubinstein 1997 setup):
  *   Exit 1st: **0**
  *   Exit 2nd: **4** (The sweet spot)
  *   Go Home (pass both): **1** (Overshot)

  With *these* numbers, you face a tension: you want to pass the first one to get to the second, but if you pass the second, you ruin everything. This tension creates the interior solution of $p=2/3$ (yielding an expected payoff of $4/3$).

  I'll assume this is the setup you meant, because otherwise, the driver just drives home.

  ### 2. Why is this a "Paradox"? (It's not just Matching Pennies)
  You asked: *"Why do people treat it like an attack on rational choice itself instead of just one more case where a mixed strategy happens to be optimal?"*

  In **Matching Pennies**, you randomize to prevent your *opponent* from predicting you. In the **Absent-Minded Driver**, you randomize to prevent *yourself* from predicting yourself.

  The "paradox" isn't about mixing; it's about **Imperfect Recall breaking Kuhn's Theorem.**

  In standard game theory, **Kuhn's Theorem** states that a **Mixed Strategy** (choosing a full plan at the start) is equivalent to a **Behavioral Strategy** (choosing an action at each decision point).
  *   **Mixed:** "At home, I pick a plan. Either 'Always Continue' or 'Always Exit'."
  *   **Behavioral:** "At every intersection, I flip a coin to decide."

  With **perfect recall** (you remember where you've been), these two are mathematically identical. You can't gain anything by waiting to flip the coin until you get there.

  **The AMD problem is the canonical counter-example where Kuhn's Theorem fails.**
  Because the driver cannot distinguish Intersection 1 from Intersection 2, he cannot adopt a pure plan like "Continue at 1, Exit at 2." He is forced into "Continue at Both" or "Exit at Both."
  *   If he randomizes over **plans** at home (Mixed Strategy), he is choosing between $p=0$ and $p=1$. The best he can do is $p=1$ (Payoff 1).
  *   If he randomizes at **each intersection** (Behavioral Strategy), he can achieve $p=2/3$. The payoff is $4/3$.

  **The Decision Theory Threat:** This implies that **planning at home is strictly worse than deciding in the moment.** Standard rational choice theory usually assumes that if you are rational, your optimal plan at time $T_0$ should be executable and optimal at time $T_1$. AMD suggests that with imperfect memory, "rational planning" and "rational acting" can diverge. That is why it keeps theorists up at night.

  ### 3. The "Flip at Home" Question
  You asked: *"Couldn't he just flip once before he starts driving... and precommit to 'if heads, I go straight through everything'?"*

  This is exactly the distinction between Mixed and Behavioral strategies I mentioned above.

  **Option A: Flip at Home (Mixed Strategy over Pure Plans)**
  You flip a coin.
  *   Heads: "I will Continue at every intersection." ($p=1$)
  *   Tails: "I will Exit at every intersection." ($p=0$)
  *(Note: You cannot precommit to "Exit at the 2nd" because you can't count to 2 without memory.)*
  *   Expected Payoff: A weighted average of 1 and 0. **Max payoff = 1.**

  **Option B: Flip at Intersection (Behavioral Strategy)**
  You carry a biased coin ($p=2/3$). At *every* intersection, you flip.
  *   This allows you to Continue at the 1st AND Exit at the 2nd with probability $p(1-p)$.
  *   Expected Payoff: **$4/3$ (approx 1.33).**

  **Option C: Flip at Home to choose $p$ (The "Precommitment" loophole)**
  You could flip at home to decide "I will use $p=2/3$." Then you carry that bias with you.
  *   Mathematically, this yields the same result as Option B.
  *   **However:** This requires you to have the *capacity* to implement a probabilistic rule at the intersection. If you have the capacity to implement $p=2/3$ at the intersection, you might as well just flip there.
  *   The philosophical bite is: If you *could* just precommit to the optimal plan at home, why can't you precommit to "Exit at the 2nd"? The answer is: **Because you are absent-minded.** You literally cannot execute that plan. You are forced to use a rule that depends only on your current local information (which is identical at both nodes).

  ### Summary
  1.  **Math Check:** Ensure the "Home" payoff is lower than the "Exit 2nd" payoff, or the problem vanishes.
  2.  **Not Matching Pennies:** You aren't randomizing to fool an opponent; you are randomizing because your memory loss prevents you from executing a deterministic optimal plan.
  3.  **The Real Paradox:** It proves that with imperfect recall, **deciding in the moment (Behavioral)** is strictly more powerful than **planning in advance (Mixed)**. This violates a foundational theorem of standard game theory (Kuhn's Theorem).
  4.  **Precommitment:** Flipping once at home to choose a *pure plan* (Always Continue vs Always Exit) yields a lower payoff than flipping at every intersection. You need the fresh randomness at each node to "dither" between the two indistinguishable locations.

  So, it's not just homework dressing. It's a rare case where "just decide ahead of time" is actually mathematically inferior to "decide when you get there," which forces us to rethink how we define rational agency over time.
