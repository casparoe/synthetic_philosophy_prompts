  ok so I found these puzzles online called Bongard problems, where you get a handful of little pictures sorted into two groups and you have to figure out the rule that separates them, like "everything on the left has a circle in it" or "the right side is the side where the number of shapes is odd". My question: there are literally infinitely many rules that fit the examples you're given, so how does anyone solve these at all? I get that we go for the "simplest" rule but that just pushes it back — simplest by what measure? something like "the pictures my friend Joe would like" fits the data too and it's a pretty short sentence. Same with gerrymandered stuff like "box 1, box 3, or anything with both an odd shape-count and a big triangle" — it fits but feels wrong. Can you explain what's actually going on when a person (or a computer, idk if that matters) picks one rule out of the infinite pile, and where the sense of some properties being "natural" enough to extend to new examples comes from? I want intuition more than math, a little math is ok. also: is this basically the same problem as why all the ravens I've seen being black makes me expect the next one to be black? and if so, what does the puzzle version add that the raven version doesnt?
