answer: |-
  Here is a lesson plan designed for a 75-minute whiteboard session, tailored to mathematically competent undergraduates with no prior exposure to philosophical methodology.

  ### 1. Sequence and the Principle of Indifference (PoI)

  To ensure the students experience this as a *paradox* (a contradiction arising from valid reasoning) rather than a *puzzle* (three answers to three different questions), you must establish the normative status of the Principle of Indifference before introducing the geometry. If you present the chord constructions first, students will treat them as distinct physical experiments. If you present the PoI first, they must treat them as distinct applications of the *same* rule of reasoning.

  **The Order of Operations:**
  1.  **Frame Probability as Logic (0–10 mins):** Briefly distinguish the *frequentist* view (probability = long-run frequency) from the *logical/epistemic* view (probability = degree of rational belief given evidence). Tell them: "For the next hour, we are not calculating frequencies. We are calculating what a rational agent *ought* to believe given limited information."
  2.  **State the Principle of Indifference (10–20 mins):** Write this precise formulation on the board and do not erase it:
      > *"If there is no known reason for predicating of our knowledge one rather than another of several alternatives, then relative to such knowledge, the assertions of each of these alternatives have an equal probability."* (Keynes/Keynesian formulation).
      *   **Crucial Constraint:** Emphasize that the principle applies to the **state of knowledge**, not the physical object. The "alternatives" are determined by how we *describe* our ignorance.
  3.  **Present the Paradox (20–50 mins):** Now introduce the examples. Because the PoI is already established as a rule for *ignorance*, any variation in the result implies the rule is broken, not that the question changed.
  4.  **Analyze the Conflict (50–65 mins):** Discuss why the results differ despite the knowledge state remaining constant.
  5.  **Assessment (65–75 mins):** The final task.

  **Why this order matters:** If you draw the circle first, students will ask, "How is the chord chosen?" If you define the PoI first, the question becomes, "How do we represent *ignorance*?" This shifts the burden from physics to epistemology.

  ### 2. The Carrying Example: Cube Factory vs. Random Chord

  **Recommendation:** Let the **Cube Factory** carry the conceptual load, and use **Bertrand's Chord** as the historical illustration.

  **Why the Cube Factory?**
  For students with probability training but no philosophy, the Random Chord problem invites a specific distraction: the "physical process" objection. They will argue that Method 1 (random endpoints) implies a different physical throwing mechanism than Method 2 (random radius). They will conclude the problem is just ambiguous physics.
  The Cube Factory (Van Fraassen's variant) blocks this escape route. There is no "throwing." There is only a description: *"A cube exists, and its side length is between 0 and 1."*
  *   **What it must have:** It must rely entirely on variable transformation ($L$ vs. $L^3$). Your students know Jacobians; use that. Show that $P(L < 0.5) = 0.5$ implies $P(V < 0.125) = 0.5$, but if you assume indifference on Volume, $P(V < 0.125) = 0.125$.
  *   **What it must lack:** Do not introduce a "machine" that makes the cubes. The moment you introduce a manufacturing process, students will revert to frequentism. The ignorance must be purely epistemic.

  **Role of the Random Chord:**
  Use the Chord problem *after* the Cube. Once they accept the Cube creates a contradiction in logic, show them the Chord. Say: "This is the original 1889 version. It looks geometric, but it is the same logical problem."
  *   **Time Allocation:** Spend 25 minutes on the Cube (algebraic derivation is fast for them) and 15 minutes on the Chord (visual verification).
  *   **If you must choose only one:** Choose the **Cube**. It isolates the *Principle of Indifference* failure more cleanly than the Chord, which conflates PoI with geometric measure theory.

  ### 3. The Misconception Map

  Students will attempt to resolve the tension to restore their comfort with math. You must anticipate and head off these moves in sequence.

  **Misconception 1: "The Math is Wrong" (Minute 25)**
  *   **The Objection:** "One of these integrals must be set up incorrectly."
  *   **The Head-Off:** Pre-empt this. When deriving the Cube or Chord solutions, ask *them* to verify the calculus on the board. Once they confirm the math is valid, the contradiction becomes philosophical, not computational.
  *   **Script:** "The calculus is correct. The logic is valid. The premises are identical. Therefore, the principle linking logic to probability is the variable that is breaking."

  **Misconception 2: "It's Just Different Experiments" (Minute 40)**
  *   **The Objection:** "Method 1 is throwing a stick, Method 2 is spinning a spinner. They are different random variables."
  *   **The Head-Off:** This is the most dangerous objection. You must relentlessly return to the **Statement of Ignorance**.
  *   **Script:** "I did not tell you how the chord was generated. I told you what you *know*. You know nothing about the generation. If probability measures ignorance, the method of generation is irrelevant. If the answer changes based on a method I didn't describe, then probability is not measuring *only* ignorance."

  **Misconception 3: "The Problem is Ill-Posed" (Minute 55)**
  *   **The Objection:** "So the answer is just 'undefined'. Case closed."
  *   **The Head-Off:** Acknowledge this is a valid mathematical response, but a scientific dead-end.
  *   **Script:** "In pure math, 'undefined' is fine. In science, we often *must* act on incomplete data. If a climate model or a medical trial requires a prior distribution and we only have 'ignorance,' saying 'undefined' stops the science. We need to know *why* indifference fails so we can fix it."

  **Misconception 4: "Symmetry Fixes It" (Minute 60)**
  *   **The Objection:** "We just need to find the 'true' symmetry (e.g., Jaynes' maximum entropy)."
  *   **The Head-Off:** Do not solve this. Flag it as "advanced material."
  *   **Script:** "There are sophisticated ways to try to rescue uniqueness, like Maximum Entropy. But those require adding *more* assumptions (like 'invariance under scaling'). That proves my point: Ignorance alone wasn't enough. You needed extra assumptions."

  ### 4. The Final Assessment Task (Last 10 Minutes)

  Do not ask them to calculate a probability. Ask them to diagnose the epistemic situation. This reveals if they understand that the threat is to *justification*, not computation.

  **The Task:**
  > "Imagine you are a consultant for the Cube Factory. The owner says: 'I have no data on my production line. Just use the Principle of Indifference to set my warranty reserves.'
  >
  > Write a 3-sentence memo to the owner explaining why you cannot fulfill this request without asking for more information. Do not mention 'math errors.' Mention 'description' or 'language'."

  **What to look for:**
  *   **Failure:** Students who say "The answer is ambiguous" (misses the point).
  *   **Success:** Students who say "The probability depends on whether we describe the product by length or volume, and your instructions don't specify which description represents your ignorance."
  *   **Why this works:** It forces them to articulate that probability assignments are sensitive to the *parameterization of the description*, not just the physical state.

  ### 5. Scope Exclusions and Framing

  You must explicitly exclude resolution strategies to prevent the session from turning into a lecture on Bayesian priors or measure theory.

  **What to Refuse:**
  1.  **Measure-Theoretic Resolutions:** Do not discuss sigma-algebras or Borel sets.
  2.  **Maximum Entropy (MaxEnt):** Do not derive the unique solution using invariance groups.
  3.  **Subjective Bayesianism:** Do not pivot to "probability is just betting."

  **How to Frame the Exclusion:**
  Be honest that this is a diagnostic session, not a prescriptive one. Use the "Medical Analogy."

  **Script for Exclusion:**
  > "Today is not about curing the disease; it's about diagnosing it. There are sophisticated treatments for this paradox—Maximum Entropy methods, invariant priors, measure-theoretic reforms. But if we jump to the cure, you will miss the pathology. The pathology is that 'ignorance' is not a mathematical object until you choose a language to describe it. Next week, we can discuss how scientists choose that language. Today, we just need to agree that the choice exists."

  **Why this works:** It validates their desire for a solution ("Yes, there are cures") while enforcing the pedagogical boundary ("But not today, or you'll miss the point"). It frames the ambiguity not as a failure of the students, but as a fundamental feature of inductive reasoning they are now sophisticated enough to see.
