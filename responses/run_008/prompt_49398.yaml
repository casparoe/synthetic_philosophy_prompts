  Next autumn I'll be starting a PhD, and I've got about three years of funding to work with. My background is machine learning — a decent grip on information theory and compression, but only coursework-level philosophy of mind. The area I keep getting pulled back to is Dennett's picture of the mind: the three stances (physical, design, intentional), plus the claim that things like beliefs, desires, and maybe selves are real only insofar as they're real patterns — patterns that buy you predictive compression over the physical description. My problem is that the cluster of open questions in that neighbourhood is huge and I honestly can't tell which bits are load-bearing and which are academic chin-stroking. The candidates I've jotted down so far: (a) whether the pattern ontology can actually settle the marginal-agent cases — animals, infants, severely brain-damaged patients, maybe future AI systems — or whether it just decorates whatever intuitions we brought in; (b) whether the design stance is even stable, given that evolution isn't a designer in the way an engineer is — does it split into two different stances, or collapse into one of the others; (c) whether firms, institutions, and markets earn intentional-stance reality the way individual agents do, and what that does to questions about whether the economy or a bureaucracy is a proper object of psychological explanation; (d) whether real patterns, cashed out, is basically just a claim about compressibility, and if so whether that quietly deflates the consciousness debates or leaves them completely untouched; and (e) whether the three stances are meant to be exhaustive and exclusive or just a rough sketch that shouldn't carry this much weight in the first place.

  So what I'm after is a defended agenda, not a survey. Rank these (or argue that something I haven't listed belongs near the top instead), and defend the ordering with explicit criteria — how much downstream work in philosophy of mind and cognitive science hangs on the answer, how tractable it is for someone with my background rather than for a classically trained metaphysician, how neglected it is versus how much it's already been chewed over, and which of the five is genuinely upstream of the others. I'd also like to know which you'd tell me to drop because settling it wouldn't change much either way — I've recieved conflicting advice on (e) specifically, with one person saying the exhaustiveness question is the whole ballgame and another saying it's a distraction Dennett himself never took that seriously. And since I'll have ML resources available, tell me where a computational angle (formalising the compression/prediction trade-off, for instance) would be a real contribution versus gimmicky.

  Could you structure the reply as follows: a section called Bottom line first (~150 words) stating your ranking up front; then The five candidates (~400 words) characterising each question precisely enough that I know what would count as progress on it; then Ranking and reasoning (~400 words) walking through the criteria and trade-offs, including anything you'd drop or demote; and finally What would change the ranking (~150 words) — what developments over the next couple of years, in philosophy or in ML, would reshuffle the order. Don't bother with reading recommendations, I've got those coming out of my ears.
