          *   *Perceptual Learning:* Long-term changes in sensitivity/discrimination (e.g., chicken sexers, radiologists). Generally accepted as real.
          *   *Cognitive Penetration:* The idea that high-level cognitive states (beliefs, desires) directly alter early perceptual processing (e.g., seeing a hill as steeper when tired, or seeing a color differently based on expectation). This is highly controversial.
          *   *Verdict:* It's a real distinction in the literature, not just a dodge. Josh is technically correct on the taxonomy, but Maya is right that the *phenomenological result* feels the same.
