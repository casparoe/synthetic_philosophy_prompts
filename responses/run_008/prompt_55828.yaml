prompt: |-
  Me and a friend argued about money pumps for like two hours last night, and I want to double-check her summary of the argument before I concede. She put it like this: "The money pump shows that if your preferences form a cycle — you prefer A to B, B to C, and C back to A — then a trader can exploit you: he offers you a chain of swaps where each one looks good to you, but attaches a small fee every time, until you've been cycled back to where you started and lost everything. Since this is a theorem and not an empirical claim, anyone with cyclic preferences is just irrational, full stop — there's no possible comeback. And in practice nobody has them anyway, because anyone with cycles would have been pumped into the poorhouse ages ago."

  She's usually sharp on this stuff, so I'm inclined to believe her, but a couple of things felt off to me — like the "lost everything" bit, and the "no possible comeback" bit. I'm probaly overthinking it though. Can you tell me what she got right, where it's subtly wrong, and whether her bottom line (cyclic preferences just refute themselves) survives once you fix the summary?

  Please structure the answer like this: (1) "What she got right" — 2 or 3 sentences; (2) "Where it goes wrong" — the main part, a couple of paragraphs, one per thing she got subtly off; (3) "The upshot" — around 3 sentences on whether her conclusion still stands.
