      *   *Revision:* Drop the "exceptionless/non-scalar" language in (5). Replace with a "sliding scale of protection" that correlates with (2). This fixes (2) vs (5), helps (5) internal conflict (farming becomes a trade-off, not a violation), and eases (3) vs (4) (if bee interests are tiny, they sum slowly).

