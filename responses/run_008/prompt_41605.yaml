      *   My gut (as a philosopher simulating a rigorous stance): The US system is too broken for Retribution to land fairly. The Deterrence evidence is too weak for Consequentialism to override Rights.
      *   I need to land somewhere between 0.2 and 0.7, or justify why I'm closer to one. Given the "US Practice" constraint, I should be closer to the user (0.2). Theoretical DP might be 0.5, but US DP is lower.
