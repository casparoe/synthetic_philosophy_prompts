prompt: |-
  Longtime reader of the rationalist blogosphere here (LW, OB back in the day, some EA stuff) and I've got a question I keep going back and forth on, so I want you to work it through with me properly. Act as a professional moral & political philosopher with a real background in punishment theory, think carefully, and do some visible brainstorming before you commit to numbers -- no snap answers, and definately no "as an AI I don't have views" dance. Also please answer in American English.

  The question: what's your credence that capital punishment as it's actually practiced in the US (not some idealized philosopher's version) is morally permissible? I want the number, but what I really want is the decomposition it falls out of. Off the top of my head the terms should include at least:

  - whether retribution is a legitimate standalone aim of punishment at all, or just a feeling we dress up in principled language
  - if retribution is legit, whether an institution with our error rates is one you'd trust to administer it
  - whether the marginal deterrence of death over life-without-parole is even positive -- the econometrics here is a mess and the standard errors are enormous, so how do you form a credence from noisy evidence without just rounding to your prior
  - how to weigh executing innocents: is it a categorical wrong, or does it trade off against murders deterred the way we accept that the state kills innocents via roads and safety regulation? And if you say it trades off, what's your threshold -- how many wrongful executions per murder deterred are you willing to swallow?

  Then there's the wrinkle I keep chewing on and haven't seen discussed much: if deterrence is your reason for supporting executions, you are hoping each one deters. But some of the executed are innocent. So you're implicitly hoping those deaths deter too. If you flinch at that but not at the rest of the deterrence case, what did the argument actually commit you to? I'd like your honest take on whether this genuinely embarrasses the consequentialist defense or whether it can be dissolved (maybe by distinguishing ex ante rules from ex post acts, or by treating known-innocent vs. believed-guilty executions differently).

  For calibration: I sit around 0.2, almost entirely because of the error-rate term. My brother, who's also read his share of the blogs, sits at 0.7 and says the risk of executing innocents is just another government risk we knowingly accept. After you give me your number and the terms, tell me where you think the 0.2-vs-0.7 gap actually lives, which single term you're least confident in, and what evidence would move it the most.
