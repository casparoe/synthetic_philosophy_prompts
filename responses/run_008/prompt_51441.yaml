prompt: |-
  I run the disability services office at a mid-sized community college, and every exam season my staff and I make something like thirty decisions about what a student may keep with them in a proctored exam: a paper notebook the student carries everywhere, a phone full of notes, a human note-taker, a smartwatch that prompts them through steps. Our official standard -- accommodations that are reasonable and don't fundamentally alter what the exam measures -- gives us almost nothing to work with, and instructors appeal half of what we approve, which puts my staff in the position of defending gut calls to a Dean who wants reasons.

  Some years ago I read a popular piece about a philosopher who argued that if a patient with memory damage wrote everything in a notebook and always had it with him, the notebook was doing the same job his brain used to do, so calling it "not really his memory" was arbitrary. I have no philosophy training, but this struck me as the only principled handle we have: for some students, the object they're asking to bring in is genuinely part of how they think, and taking it away isn't removing a crutch, it's removing part of the mind doing the exam. For other students it's plainly a shortcut around what the exam is supposed to measure. My staff can't tell which is which by intuition, and neither can the instructors, and I'd like to stop pretending we can.

  Please turn that idea into a procedure my staff can actually run, in about fifteen minutes per request: an ordered list of questions, what counts as a sufficient answer to each, where the procedure stops with a firm no (the aid is clearly not part of the student's thinking), where it stops with a firm yes (the aid clearly is, so banning it changes what the exam measures rather than preserving it), and where it must hand the decision to the accommodations committee because the remaining question is about what the course is for rather than about the student. Ground it in whatever the philosophy of mind actually says about when an external thing becomes part of someone's cognition, but keep the questions plain enough for a staff member without any theory.

  Then run it on four requests from last spring: (1) a student with a brain injury who carries a paper memory notebook everywhere, relies on it completely, and wants it in a closed-book history exam; (2) the same student in a math exam where the instructor insists the course goal is performing without reference material; (3) a student with severe ADHD whose phone holds notes she wrote herself but half-trusts, asking to keep the phone during a paper exam; (4) a student asking to use an AI assistant during a closed-book philosophy exam because, he says, it is now simply how he thinks. Flag which of these the procedure settles and which it can't, and be blunt about where you think the verdict will be one I won't like.

  Finally, tell me where the procedure is most likely to misfire, and what would have to be true -- about the philosophy, or about our students, or about what exams are for -- for the verdicts to come out the other way. If the underlying idea about minds and their tools is less settled than the popular version I read, I would rather know that than have a procedure that pretends otherwise.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Director of Disability Services at a mid-sized community college.
      *   **Problem:** High volume of exam accommodation decisions (approx. 30/season), vague standard ("reasonable," "no fundamental alteration"), high instructor appeal rate, staff relying on "gut calls," Dean wants justification.
      *   **Core Idea:** The user likes the "extended mind" thesis (Clark & Chalmers) – if an external tool functions like internal cognition, it *is* part of the mind. Removing it alters the cognitive agent taking the test.
      *   **Task 1:** Create a 15-minute decision procedure based on this philosophy, accessible to non-philosophers. Needs clear Yes/No/Committee paths.
      *   **Task 2:** Apply the procedure to four specific cases (Brain Injury/History, Brain Injury/Math, ADHD/Phone, AI/Philosophy).
      *   **Task 3:** Critique the procedure. Where does it fail? What assumptions are shaky? Be blunt about unpopular verdicts.

  2.  **Deconstruct the Philosophy (Extended Mind Thesis - EMT):**
      *   *Source:* Andy Clark and David Chalmers, "The Extended Mind" (1998).
      *   *Key Criteria (The Parity Principle):* If a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (for that time) part of the cognitive process.
      *   *Specific Criteria (Otto's Notebook):*
          1.  **Constant Availability:** Is the tool reliably there when needed?
          2.  **Direct Accessibility:** Is the information easily retrieved without significant friction?
          3.  **Endorsement/Trust:** Does the user automatically trust the information (like biological memory)?
          4.  **Past Endorsement:** Was the information consciously entered/verified by the user previously?

  3.  **Drafting the Procedure (Task 1):**
      *   *Goal:* 15 minutes, plain language, actionable.
      *   *Structure:* Intake -> The 4 EMT Questions -> Decision Matrix.
      *   *Tone:* Professional, empathetic, but rigorous.
      *   *Drafting the Questions:*
          1.  *Availability:* Do you have this *always*? (Not just for tests).
          2.  *Access:* Is it fast? (Like recalling a thought).
          3.  *Trust:* Do you believe it without double-checking?
          4.  *Origin:* Did you put it there/verify it?
      *   *Decision Rules:*
          *   All 4 Yes = **Approve** (It's part of the mind).
          *   2+ No = **Deny** (It's an external aid/crutch).
          *   Mixed/Disputed = **Committee** (Fundamental alteration question).

  4.  **Applying the Procedure (Task 2):**
      *   *Case 1: Brain Injury/History Notebook.*
          *   Availability: Yes (carries everywhere).
          *   Access: Yes (paper, immediate).
          *   Trust: Yes (relies completely).
          *   Origin: Yes (presumably his notes).
          *   *Verdict:* **Approve.** (Classic Otto case).
      *   *Case 2: Brain Injury/Math.*
          *   EMT criteria met? Yes.
          *   *Conflict:* Instructor says course goal is "unassisted calculation."
          *   *Verdict:* **Committee.** This isn't about the *student's mind*; it's about the *course's purpose*. The tool is part of the mind, but does the course measure *math ability* or *problem-solving with tools*?
      *   *Case 3: ADHD/Phone Notes.*
          *   Availability: Maybe (phones are common, but is it *the* memory source?).
          *   Access: Yes.
          *   Trust: **No** ("half-trusts"). This is the killer. Biological memory is usually trusted implicitly. If she double-checks, it's not functioning as memory.
          *   Origin: Yes.
          *   *Verdict:* **Deny.** (Fails the Trust criterion).
      *   *Case 4: AI/Philosophy.*
          *   Availability: Yes (internet).
          *   Access: Yes.
          *   Trust: **No/Debatable.** AI hallucinates. Can you "endorse" AI output instantly?
          *   Origin: **No.** The student didn't generate the thought; the model did.
          *   *Verdict:* **Deny.** (Fails Origin and Trust).
      *   *Blunt Truth:* Case 2 is the hard one. The Dean might hate approving the notebook in History but denying it in Math for the *same student*. Case 4 is a hard no, but the student will argue hardest.

  5.  **Critiquing the Procedure (Task 3):**
      *   *Philosophical Weakness:* EMT is controversial. Not all philosophers accept it. It blurs the line between *ability* and *tool*.
      *   *Institutional Weakness:* Colleges measure *individual* competence, not *coupled* competence. If we accept EMT, we change accreditation standards.
      *   *Student Reality:* Students might lie about "trust" or "availability" to get an edge.
      *   *The "Fundamental Alteration" Trap:* The procedure identifies *what the student is*, but not *what the course is*. That's why Case 2 goes to Committee.
      *   *Unpopular Verdicts:* Denying the phone for ADHD might feel ableist even if it fits the theory. Approving the notebook for History but not Math looks inconsistent to the student.

  6.  **Refining and Polishing:**
      *   *Tone Check:* Needs to be respectful of the staff's burden and the Dean's need for defensibility.
      *   *Clarity:* Ensure the "Stop" points are clear.
      *   *Philosophy Check:* Ensure I'm accurately representing Clark & Chalmers without getting bogged down in jargon. (Focus on *Parity*, *Trust*, *Availability*, *Past Endorsement*).
      *   *Case 2 Nuance:* This is the crux. If the course is "Mental Arithmetic," the notebook *is* a fundamental alteration. If the course is "History Analysis," the notebook is just memory. The procedure needs to highlight this distinction.

  7.  **Final Review against Constraints:**
      *   15-minute procedure? Yes, 4 questions + rubric.
      *   Run on 4 cases? Yes.
      *   Flag settled vs. unsettled? Yes.
      *   Blunt about unpopular verdicts? Yes.
      *   Critique of the philosophy? Yes.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Committee" path is clearly defined as a "Course Integrity" question, not a "Student Mind" question.
      *   *Correction:* In Case 3, emphasize the "half-trust" aspect. That's the specific EMT failure point.
      *   *Correction:* In Case 4, emphasize the "Origin" aspect. AI generates, human selects. That's not memory.

  9.  **Final Polish:** Check voice. Empathetic but authoritative. (Proceed to generate response).

  *(Self-Correction Note on Case 2)*: Wait, if the EMT says the notebook *is* the memory, then banning it in Math *does* alter what is measured (it measures "memory + math" vs "math"). However, if the course objective is explicitly "unassisted recall," then the accommodation *is* a fundamental alteration. The procedure needs to separate "Is this part of the mind?" (EMT question) from "Does this course allow externalized mind parts?" (Curriculum question). I will structure the procedure to answer the first, and punt the second to the Committee.

  *(Self-Correction Note on Case 3)*: ADHD students often use phones as external working memory. If she "half-trusts," does that mean she verifies? If she verifies, it's not transparent cognition. I need to be careful not to penalize the disability, but the *mechanism*. If the mechanism fails the EMT test, it's an aid, not a prosthetic.

  *(Self-Correction Note on Case 4)*: AI is the hardest. It's definitely not "past endorsement." It's outsourcing. Hard no under EMT.

  Okay, ready to write.s
answer: |-
  This is a heavy lift, but you are right to look for a principled handle. The intuition you described comes from the **Extended Mind Thesis (EMT)**, proposed by philosophers Andy Clark and David Chalmers in 1998. Their argument is that if an external tool functions in a way that is functionally equivalent to an internal biological process, it should be treated as part of the cognitive system.

  However, EMT is not a magic wand. It distinguishes between *coupling* (using a tool) and *integration* (the tool becoming part of the self). Your staff needs to test for integration.

  Below is a 15-minute decision procedure based on the four standard criteria of EMT. Following that, I have run your four cases through it, and then I will tell you where this philosophy breaks down in a community college context.

  ***

  ### Part 1: The "Cognitive Integration" Procedure

  **Time:** 15 Minutes
  **Interviewer:** Disability Services Staff
  **Subject:** Student requesting exam aid
  **Goal:** Determine if the aid is a *prosthetic* (part of the mind) or a *tool* (external advantage).

  **Instructions:** Ask the student the following four questions. Record the answers. Do not ask "Is this fair?" Ask "How does this work?"

  #### The Four Questions (The "Otto Criteria")

  1.  **Availability:** "Do you have this item with you essentially all the time in your daily life, not just for studying or exams?"
      *   *Yes:* It is a constant companion.
      *   *No:* It is brought out specifically for academic tasks.
  2.  **Accessibility:** "When you need information from this, how long does it take to retrieve? Is it instant, or do you have to search/filter?"
      *   *Yes:* Retrieval is automatic/fast (like recalling a memory).
      *   *No:* Retrieval requires significant effort or navigation.
  3.  **Trust (Endorsement):** "When you retrieve information from this, do you accept it as true immediately, or do you have to double-check it against your own knowledge?"
      *   *Yes:* You trust it implicitly (like your own biological memory).
      *   *No:* You treat it as a suggestion or a draft you must verify.
  4.  **Origin (Past Endorsement):** "Did you personally create or verify this content *before* the exam moment?"
      *   *Yes:* The content is your own past cognition stored externally.
      *   *No:* The content is generated by someone/something else in the moment.

  #### The Decision Matrix

  *   **Firm Yes (Approve):** All four answers are **Yes**.
      *   *Reasoning:* The object is functionally identical to biological memory. Removing it disables the cognitive agent.
  *   **Firm No (Deny):** Two or more answers are **No**.
      *   *Reasoning:* The object is an external aid. It provides a shortcut, not a restoration of function.
  *   **Committee Review (Escalate):** Mixed results (e.g., 3 Yes, 1 No) OR All Yes but Instructor objects on "Course Integrity."
      *   *Reasoning:* The object *is* part of the student's mind, but the course may explicitly measure the ability to function *without* that type of mind. This is a curriculum question, not a disability question.

  ***

  ### Part 2: Running the Cases

  Here is how the procedure applies to your four requests from last spring.

  #### Case 1: Brain Injury / History Exam / Paper Notebook
  *   **Availability:** Yes (Carries everywhere).
  *   **Accessibility:** Yes (Paper, immediate open).
  *   **Trust:** Yes (Relies completely).
  *   **Origin:** Yes (His notes).
  *   **Verdict:** **Firm Yes (Approve).**
  *   **Rationale:** This is the exact example Clark and Chalmers used (Otto's Notebook). For this student, the notebook *is* his hippocampus. Banning it does not make the exam "harder"; it makes it impossible for *him* to take it, because "he" includes the notebook.
  *   **Staff Script:** "This aid meets the criteria for cognitive integration. It functions as biological memory. Denying it would measure his injury, not his history knowledge."

  #### Case 2: Brain Injury / Math Exam / Paper Notebook
  *   **Availability:** Yes.
  *   **Accessibility:** Yes.
  *   **Trust:** Yes.
  *   **Origin:** Yes.
  *   **Verdict:** **Committee Review.**
  *   **Rationale:** The student passes the EMT test. The notebook *is* part of his mind. However, the instructor claims the course goal is "performing without reference material."
  *   **The Conflict:** This is no longer about the student's mind; it is about the course's definition of competence. If the course is "Mental Arithmetic," the notebook is a fundamental alteration. If the course is "Applied Problem Solving," the notebook is a reasonable prosthetic.
  *   **Blunt Truth:** Your staff cannot decide this. You must convene the Dean, the Math Chair, and Disability Services. If the Math Chair insists the goal is unassisted calculation, you must deny the accommodation, but you must document that you are denying a *cognitive prosthetic*, not a cheat sheet. This will be an ugly meeting.

  #### Case 3: ADHD / Paper Exam / Phone Notes
  *   **Availability:** Yes (Students always have phones).
  *   **Accessibility:** Yes.
  *   **Trust:** **No** ("Half-trusts").
  *   **Origin:** Yes.
  *   **Verdict:** **Firm No (Deny).**
  *   **Rationale:** This is the failure point. Biological memory is trusted implicitly. If she has to "half-trust" or verify the notes, the phone is acting as a library, not a memory center. It is a resource, not a prosthetic. Furthermore, phones introduce friction (unlocking, scrolling) that biological memory does not have.
  *   **Blunt Truth:** The student will feel punished for her ADHD. You must explain that because she does not trust the notes implicitly, they function as an external aid, which gives her an advantage over students relying on internal memory. Offer a paper notebook alternative (which she can trust more if she writes it herself) but keep the phone out.

  #### Case 4: Philosophy Exam / AI Assistant
  *   **Availability:** Yes (Internet).
  *   **Accessibility:** Yes.
  *   **Trust:** **No** (AI hallucinates; requires verification).
  *   **Origin:** **No** (AI generates the text).
  *   **Verdict:** **Firm No (Deny).**
  *   **Rationale:** This fails two critical criteria. First, the student did not generate the content (Origin), so it is not *his* cognition extended; it is *someone else's* cognition accessed. Second, AI requires verification (Trust), making it a resource, not a memory prosthesis.
  *   **Blunt Truth:** The student's argument ("it is how I think") is philosophically incoherent under EMT. Using AI is outsourcing cognition, not extending it. This is a clear denial, but expect an appeal based on "future of work" arguments. Stick to the Origin criterion.

  ***

  ### Part 3: Where the Procedure Misfires

  You asked for bluntness about where this idea is less settled than the popular version you read. Here is the risk assessment.

  **1. The "Course Integrity" Trap (Case 2)**
  The Extended Mind Thesis solves the question "Is this part of the student?" It does *not* solve the question "Is this what we are testing?"
  *   **The Risk:** In Case 2, the procedure tells you the notebook is part of the student's mind. But if the Math Department certifies that students must be able to calculate without external memory aids (a common accreditation requirement for developmental math), you are forced to deny a cognitive prosthetic.
  *   **The Unpopular Verdict:** You will have to tell a brain-injured student: "We agree this is part of your brain, but our math class requires you to leave part of your brain at the door." That is ethically fraught and legally vulnerable. The procedure identifies the conflict, but it doesn't resolve it.

  **2. The "Trust" Subjectivity (Case 3)**
  The "Trust" criterion is the weakest link. How do you measure "implicit trust" in a 15-minute interview?
  *   **The Risk:** A savvy student can lie. "Yes, I trust my notes completely." Conversely, a student with severe anxiety (common with ADHD) might say "I don't trust them" even if they functionally rely on them.
  *   **The Reality:** You are relying on self-reporting for a psychological state. If you deny Case 3 based on "lack of trust," the student may argue that their *disability* causes the lack of trust, so you are penalizing them for the symptom.
  *   **What would have to be true:** For this verdict to hold, you need objective evidence of how they use the tool in non-exam settings. Do they check the phone 5 times before acting? Or do they act on it? Without observation, "Trust" is just a guess.

  **3. The Philosophy Itself is Contested**
  You are building policy on a philosophical theory that is 25 years old and still debated.
  *   **The Risk:** Many cognitive scientists argue that *coupling* is not *constitution*. Just because I use a calculator doesn't mean the calculator is my brain. If the Department of Education or a court decides that "memory" must be biological, your entire justification collapses.
  *   **The Fix:** Do not cite Clark and Chalmers in your official memos to the Dean. Use their logic, but use regulatory language. Instead of "Extended Mind," write: "The aid functions as a direct substitute for internal cognitive processing without providing external content advantage."

  **4. The "Fundamental Alteration" Loophole**
  The law (ADA/504) allows you to deny accommodations that fundamentally alter the nature of the program.
  *   **The Risk:** Instructors are increasingly defining "critical thinking" as "unassisted recall." If every instructor claims their exam measures "internal processing," *no* external aid is ever permissible.
  *   **The Verdict:** Your procedure protects the student's definition of their mind, but it does not protect the course's definition of learning. You will need a higher-level policy that defines which courses *allow* for extended cognition (e.g., History, Philosophy) and which *require* isolated cognition (e.g., Foreign Language, Developmental Math).

  ### Summary Recommendation

  Adopt the procedure for its **clarity**, not its **philosophical truth**. It forces staff to stop guessing and start documenting specific functional criteria.

  *   **Use it** to approve the History Notebook (Case 1).
  *   **Use it** to deny the AI and Phone (Cases 3 & 4).
  *   **Use it** to force the Math Department into a conversation about whether they are teaching math or teaching memory (Case 2).

  If the Dean asks for your philosophical basis, tell him: "We are assessing whether the aid restores function or enhances capability. If it restores function to a baseline level of cognitive agency, it is a accommodation. If it enhances capability beyond baseline, it is an advantage." That is the EMT argument translated into compliance language.
