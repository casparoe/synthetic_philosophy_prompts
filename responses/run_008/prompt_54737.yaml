answer: |-
  Pull up a chair. And put that drink down; if we're going to talk about the Sorites, I need my coffee black and my distinctions sharp. Though, ironically, that's exactly what we're arguing about.

  Your friend hasn't invented a new trick; he's reconstructed Timothy Williamson's *Epistemicism* in a nutshell. It's a serious position, held by serious people, but it is not a *proof*. It is a forced choice among bad options. The argument feels like a proof because it hides a massive philosophical tax bill inside a modal equivocation.

  You asked me to sketch diagnoses before committing. Let's look at the three main ways to block this, because every single one of them costs you something you probably want to keep.

  ### Diagnosis 1: Attack Step (1) — The Supervaluationist Move
  Your friend argues: "If there's no fact of the matter... then things could have gone either way." He is equating **semantic indeterminacy** with **metaphysical contingency**.

  This is the standard move. We say: "No, it's not that the world could have been different while the grains stayed the same. It's that our language hasn't decided." On this view, 'heap' is like a contract with a gap in it. The grains are fixed, but the meaning of 'heap' hasn't been precisified enough to cover this specific case.

  *   **The Cost:** You lose Bivalence. You have to say sentences like "n grains make a heap" are neither true nor false. This forces you to revise classical logic (or play games with 'supertruth').
  *   **The Higher-Order Problem:** Your friend is right to press you here. If you say "It's indeterminate," you must ask: "Is it *determinately* indeterminate?" If you draw a sharp line between 'determinately a heap' and 'indeterminate', you've just recreated the sharp boundary you tried to avoid, just one level up. Supervaluationists sweat blood over this.

  ### Diagnosis 2: Attack Step (2) — The Ontic Vagueness Move
  Your friend argues: "Whether n grains make a heap depends only on the grains themselves." This is the Supervenience Claim. It assumes the world is precise and only our words are fuzzy.

  The Ontic Vagueness theorist says: "No. The world itself can be fuzzy." Maybe objects don't have precise spatial boundaries. Maybe composition is indeterminate.

  *   **The Cost:** You lose (2), which you said you'd hate to lose. And rightly so. This is metaphysically expensive. It threatens classical logic (Leibniz's Law gets shaky if identity is vague) and makes reality sound like a watercolor painting left in the rain. Most of us keep (2) because we think physics is precise, even if language isn't.

  ### Diagnosis 3: Accept (1) and (2) — The Epistemicist Move (Your Friend)
  Your friend keeps the logic and the metaphysics, but he posits a miracle: there *is* a sharp boundary, but it is *in principle unknowable*.

  *   **The Cost:** Plausibility. You have to believe that there is a specific number of grains $n$ where adding one more turns a non-heap into a heap, and that this fact is fixed by usage but hidden from us by a "margin for error" principle. It makes semantic facts look like hidden variables in quantum mechanics. It's coherent, but it smells like desperation.

  ---

  ### The Verdict: Which Step to Reject?

  If I have to tell you where the argument slips, it is **Step (1)**.

  Your friend is trading on an ambiguity in "could have gone either way."
  1.  **Metaphysical Possibility:** The physical grains could have been arranged differently. (Everyone agrees).
  2.  **Semantic Possibility:** The word 'heap' could have meant something slightly different. (Everyone agrees).
  3.  **The Equivocation:** He infers from "The word 'heap' could have meant something different" (which is true) to "In the *actual* world, with the *actual* meaning, the truth value is unsettled *as if* it were contingent."

  When we say "there is no fact of the matter," we usually mean **semantic indecision**, not **worldly contingency**. We mean our linguistic practices haven't ruled out precisifications where it's true and precisifications where it's false. We do *not* mean that there is a hidden fact waiting to be discovered (Epistemicism) nor that the world is fuzzy (Ontic).

  **So, reject (1).** "No fact of the matter" does not imply "Metaphysically contingent truth value." It implies "Truth value gaps relative to the actual meaning."

  ### What Are You Paying For It?

  You asked what rejecting (1) costs. Since you want to keep (2) (Supervenience), rejecting (1) commits you to **Supervaluationism**. Here is your bill:

  1.  **Logical Revisionism:** You cannot maintain that "Either $n$ grains make a heap or they don't" is a logical truth in the standard sense. You have to distinguish between *logical validity* (preservation of supertruth) and *classical tautologies*. This annoys logicians.
  2.  **The Higher-Order Revenge:** Your friend's "one level up" argument is the Supervaluationist's nightmare. If 'definitely' is defined as "true on all precisifications," then there must be a sharp cut-off between the precisifications that count and those that don't.
      *   *The Friend's Point:* He says this proves him right.
      *   *The Reality:* It proves that Supervaluationism pushes the sharpness back one step. We admit there is a sharp boundary between 'admissible precisifications' and 'inadmissible ones'. We just claim that boundary is *semantic*, not *ontic*.
      *   *The Cost:* You have to explain why *that* boundary doesn't generate a new Sorites. Usually, we just say "Admissibility is itself vague," but then your friend runs the argument again on 'admissible'. You end up with an infinite regress of 'definitely' operators unless you eventually accept a sharp cut-off somewhere.

  ### Why Your Friend's "Proof" Fails

  Your friend claims his argument rules out Supervaluationism and Ontic Vagueness at once. He is wrong.

  *   **Against Ontic Vagueness:** He is right that his argument assumes (2). If an Ontic Vagueness theorist rejects (2), the argument doesn't touch them. They pay the metaphysical cost, but they aren't logically refuted by this specific syllogism.
  *   **Against Supervaluationism:** He claims Step (3) refutes Supervaluationism ("If both were genuinely possible, heap-hood would depend on something beyond the grains"). But the Supervaluationist says: "Heap-hood depends on the grains *plus the meaning of the word*." The meaning is fixed, but the meaning *is* a set of precisifications. The truth value isn't contingent; it's **undefined**. Step (1) falsely assumes that if it's not settled, it must be contingent. It could just be gappy.

  ### The "One Level Up" Problem

  Your friend admits the higher-order iteration "feels like proving too much." He should feel more than that; he should feel embarrassed.

  If he is an Epistemicist (accepting 1-6), he must accept that there is a sharp boundary between 'Definitely a Heap' and 'Not Definitely a Heap'.
  *   Imagine 100 grains is the cutoff for 'heap'.
  *   Epistemicism says there is a number $k$ such that $k$ is definitely a heap, but $k+1$ is *not definitely* a heap (perhaps it's borderline, perhaps it's false).
  *   This implies a sharp transition in our *knowledge status* or *semantic status*.

  This is the "Cost of Epistemicism." It implies that for every vague predicate $F$, and every iteration of 'Definitely', there is a sharp cut-off. The world of meanings is incredibly jagged. It saves classical logic, but it makes the semantics of natural language look like a digital watch in an analog world.

  ### Final Advice

  Don't let your friend treat this as a knockdown proof. It's a *reductio* of the conjunction of his premises. Since the conclusion (Sharp Boundaries for Everything) is wildly implausible to most competent speakers, we should reject the premise that drives it.

  **Reject (1).** Insist that "indeterminate" means "semantically underdetermined," not "metaphysically contingent."

  **Your Bill:** You pay with logical complexity (Supervaluationism) and you have to wrestle with higher-order vagueness without a clean solution.
  **His Bill:** He pays with plausibility. He has to convince me that there is a fact of the matter about whether 4,328 grains make a heap, and that God knows it but we can't.

  I'll take the logical complexity. It's cheaper than believing in semantic miracles. Now, if you'll excuse me, I have to go grade papers on the Liar Paradox. Try not to let him talk you into believing the world is crisp; it's messy enough as it is.
