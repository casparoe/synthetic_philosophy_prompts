prompt: |-
  I'm a PhD student in political science, working mostly on comparative electoral systems, and I'm drafting the intro chapter for my dissertation on electoral reform debates. The more I read, the more I notice that people arguing for proportional representation over first-past-the-post (or the other way around) basically never state what an electoral system is even supposed to *do* — they just pick their favorite property, proportionality or constituency service or whatever, and run with it. So before I wade into the empirical literature I want the full spec written down: what would an electoral system for a national legislature actually have to get right to count as adequate? I'm thinking things like translating votes into seats in a way voters can recognize, not punishing people for voting sincerely, keeping a workable link between citizens and individual representatives, not handing disproportional power to tiny kingmaker parties, keeping the barrier to entry for new parties from ossifying the party system, producing governments that can actually govern — but I'm sure I'm missing some and I suspect some of the ones I listed are just camp prejudices dressed up as requirements (like, is "stable single-party majorities" a genuine desideratum or is that just what people who grew up under Westminster systems assume?).

  So give me the requirements list, with the motivating case behind each one — a concrete scenario where a system violating that criterion does something clearly bad, not just an abstract statement. For each, tell me whether it's non-negotiable or whether reasonable people weigh it differently, and, crucially, flag any subsets that are jointly unsatisfiable — e.g. stuff coming out of Arrow's theorem, Gibbard-Satterthwaite, or just the plain tension between strict proportionality and having locally accountable individual MPs. That last part is what I most want to see, since if some of the desiderata can't all be met at once, then the whole FPTP-vs-PR debate is really a disagreement about which criterion to sacrifice, and I want to frame my chapter around that.

  Then, briefly, run first-past-the-post, a party-list PR system, and mixed-member proportional against the list — I'll extend it to STV and other variants myself later, so don't worry about being exhaustive there. Also feel free to tell me if you think one of my proposed criteria above is bogus or needs splitting into two, I've been going back and forth on the kingmaker party thing especially.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in Political Science (Comparative Electoral Systems).
      *   **Task:** Drafting the intro chapter of a dissertation on electoral reform debates.
      *   **Problem:** Notices that proponents of different systems (FPTP vs. PR) rarely define the *purpose* or *normative criteria* of an electoral system explicitly. They assume their preferred property is the goal.
      *   **Goal:** A comprehensive "specification" list of what an electoral system needs to do to be "adequate."
      *   **Requirements for the Output:**
          *   List of criteria with motivating cases (concrete scenarios of failure).
          *   Classification: Non-negotiable vs. Contested/Weighted.
          *   **Crucial:** Identification of jointly unsatisfiable subsets (impossibility theorems, trade-offs).
          *   Application: Briefly evaluate FPTP, List-PR, and MMP against the list.
          *   Critique: Feedback on the user's proposed criteria (e.g., "kingmaker parties").
      *   **Tone:** Academic, rigorous, nuanced, avoiding partisan bias, acknowledging trade-offs.

  2.  **Deconstruct the User's Proposed Criteria:**
      *   *Translating votes into seats recognizably:* (Proportionality/Transparency).
      *   *Not punishing sincere voting:* (Strategy-proofness).
      *   *Link between citizens and reps:* (Constituency Service/Accountability).
      *   *No tiny kingmaker parties:* (Governability/Extremism check).
      *   *Barrier to entry not ossifying:* (Competitiveness/Entry).
      *   *Governments that can govern:* (Efficiency/Stability).
      *   *Critique:* The "kingmaker" point is indeed often a normative preference for majoritarianism disguised as a functional requirement. "Stable single-party majorities" is definitely a Westminster bias.

  3.  **Drafting the Criteria List (The "Spec"):**
      *   Need to categorize these. Common categories in lit: Representativeness, Governability, Accountability, Integrity.
      *   *Criterion 1: Preference Aggregation (Proportionality).* Motivating case: 51% gets 100% power.
      *   *Criterion 2: Government Stability/Effectiveness.* Motivating case: Coalition collapses after 6 months, no legislation passes.
      *   *Criterion 3: Constituency Accountability.* Motivating case: MP ignores local disaster because they answer only to party list.
      *   *Criterion 4: Strategic Vulnerability (Sincerity).* Motivating case: Voting for a lesser evil because favorite has no chance.
      *   *Criterion 5: Party System Fluidity (Entry).* Motivating case: New movement gets 10% but 0 seats due to threshold.
      *   *Criterion 6: Transparency/Simplicity.* Motivating case: Voters don't understand how their vote helped form the government.

  4.  **Identifying Trade-offs and Impossibilities (The Core Insight):**
      *   *Arrow's/Gibbard-Satterthwaite:* No system is perfectly strategy-proof and non-dictatorial.
      *   *The Fundamental Trilemma (Lijphart/others):* Proportionality vs. Single-Party Government vs. Constituency Representation. You can pick two.
      *   *Duverger's Law:* Mechanical and psychological effects link rules to party systems.
      *   *The "Kingmaker" issue:* Proportionality *creates* kingmakers. Preventing them requires disproportionality.

  5.  **Evaluating the Systems (FPTP, List-PR, MMP):**
      *   *FPTP:* Good on stability (usually), good on constituency link. Bad on proportionality, bad on sincerity (wasted votes).
      *   *List-PR:* Good on proportionality, good on entry. Bad on constituency link, bad on stability (coalitions), potential for extremist kingmakers.
      *   *MMP:* Attempts to bridge. Good on proportionality, keeps constituency link. Complexity, two classes of MPs.

  6.  **Refining the User's Specific Points:**
      *   *Kingmaker Parties:* This isn't a system failure per se; it's a feature of coalition politics. The real criterion is "Coalition Manageability" or "Extremist Veto Power."
      *   *Stable Single-Party Majorities:* Explicitly flag this as a contested normative goal, not a functional necessity.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the question. Validate the observation (the "criterion blindness" in reform debates).
      *   **Part 1: The Specification (Criteria):** Group them logically. Provide the concrete failure scenario. Mark as Non-negotiable vs. Contested.
      *   **Part 2: The Impossibility Theorems & Trade-offs:** This is the meat. Discuss the Trilemma, Strategy-proofness, and the Kingmaker paradox.
      *   **Part 3: System Evaluation:** FPTP, List-PR, MMP.
      *   **Part 4: Critique of User's Draft:** Address the "kingmaker" and "stability" points specifically.
      *   **Conclusion:** Framing advice for the dissertation.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I explain *why* "kingmaker" is tricky? Yes, need to distinguish between "holding balance of power" (normal) and "extremist veto" (problematic).
      *   *Check:* Is the tone right? Avoid saying "PR is better." Say "PR optimizes X at cost of Y."
      *   *Check:* Did I mention Arrow? Yes, but keep it relevant to elections (social choice theory).
      *   *Check:* Make sure to distinguish between *electoral* system and *party* system, though they are linked (Duverger).
      *   *Refinement:* Ensure the distinction between *government stability* (duration) and *policy stability* is clear.

  9.  **Final Polish:** Check against the prompt's specific constraints (concrete scenarios, non-negotiable flags, joint unsatisfiability). (Self-correction: Ensure I explicitly state which criteria are jointly unsatisfiable).

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is an exceptionally sharp observation for a dissertation introduction. You have identified the central normative vacuum in the electoral reform literature: participants argue from *conclusions* (e.g., "PR is fairer") without agreeing on the *premises* (e.g., "Fairness requires seat share to match vote share").

  Below is a draft specification of electoral system criteria, structured for a political science dissertation. It distinguishes between functional necessities and normative preferences, highlights the impossibility theorems, and applies the framework to your three target systems.

  ### Part 1: The Specification List (Desiderata)

  I have grouped these into three clusters: **Representativeness**, **Governability**, and **Accountability**.

  #### 1. Preference Aggregation (Proportionality)
  *   **Definition:** The share of seats a party receives should approximate its share of the vote.
  *   **Motivating Failure Scenario:** A party receives 40% of the national vote but secures 55% of the seats, allowing it to pass constitutional amendments without broad consensus. Conversely, a party receives 15% of the vote (representing a significant minority viewpoint) but secures 0% of the seats, rendering that segment of the electorate unrepresented in legislative debate.
  *   **Status:** **Contested.** High priority for pluralist/democratic theory; low priority for majoritarian/efficiency theory.

  #### 2. Strategic Robustness (Sincerity)
  *   **Definition:** Voters should be able to vote for their most preferred option without fear that doing so will help their *least* preferred option win (i.e., minimizing the "wasted vote" dilemma).
  *   **Motivating Failure Scenario:** A voter prefers a Green party but votes for a Centrist party because polls show the Green party cannot win the district. The Centrist party loses anyway, and the voter's least preferred (Authoritarian) party wins. The voter was punished for sincerity.
  *   **Status:** **Non-negotiable (in principle),** though technically impossible to perfect (see Gibbard-Satterthwaite).

  #### 3. Constituency Linkage (Local Accountability)
  *   **Definition:** Citizens should have a specific, identifiable representative responsible for their geographic area whom they can reward or punish.
  *   **Motivating Failure Scenario:** A local bridge collapses. Citizens complain to their MP, who replies, "I am elected from a national party list; I have no mandate to intervene in local infrastructure, and I cannot be voted out individually, only as part of my party."
  *   **Status:** **Contested.** Essential in clientelistic or federal systems; less critical in highly centralized, programmatic party systems.

  #### 4. Government Durability (Stability)
  *   **Definition:** The electoral outcome should produce an executive capable of surviving a full term to implement a platform.
  *   **Motivating Failure Scenario:** An election produces a fragmented parliament. A coalition is formed but collapses after eight months due to a dispute over the budget between three junior partners. New elections are held, producing the same result. No major legislation is passed for two years.
  *   **Status:** **Contested.** Often conflated with "Single-Party Majority," which is a specific *type* of stability, not the only kind.

  #### 5. System Fluidity (Entry)
  *   **Definition:** New political movements should be able to enter the legislature if they garner significant support, preventing cartelization of established parties.
  *   **Motivating Failure Scenario:** A new anti-corruption movement gains 12% support nationally. Due to high legal thresholds and district magnitude rules favoring incumbents, they win 0 seats. The established parties ignore the issue, and the movement radicalizes outside the legislature.
  *   **Status:** **Non-negotiable (for democracy),** though the *threshold* for entry is debated.

  #### 6. Transparency (Cognizability)
  *   **Definition:** Voters should be able to understand how their vote translates into government formation.
  *   **Motivating Failure Scenario:** A voter votes for Party A. Party A loses seats but ends up in government via a post-election coalition with Party B, whom the voter explicitly rejected. The voter cannot trace the causal link between ballot and outcome.
  *   **Status:** **Non-negotiable.** If voters cannot understand the mechanism, legitimacy erodes.

  ---

  ### Part 2: The Impossibility Theorems and Trade-offs

  This is the core of your chapter. You must establish that these criteria are not a menu where you can order everything; they are a budget constraint.

  #### 1. The Fundamental Trilemma (Lijphart's Modification)
  You cannot simultaneously maximize **Proportionality**, **Single-Party Government**, and **Constituency Representation**.
  *   **Proportionality + Constituency:** Requires large districts or complex compensation (e.g., MMP/STV), which usually leads to coalition government (sacrificing Single-Party Gov).
  *   **Single-Party Gov + Constituency:** Requires small districts (e.g., FPTP), which destroys Proportionality.
  *   **Single-Party Gov + Proportionality:** Theoretically impossible in a diverse society without gerrymandering or manufactured majorities.

  #### 2. Gibbard-Satterthwaite Theorem (Applied)
  No ranked-choice electoral system can be entirely **Strategy-Proof** (Criterion 2) if there are more than two outcomes, unless it is dictatorial.
  *   **Implication:** Every system will, in some scenarios, punish sincere voting. The debate is not *whether* to sacrifice sincerity, but *how much* and *where*. FPTP sacrifices it for third parties; PR sacrifices it regarding coalition preferences (you vote for a party, not a government).

  #### 3. The "Kingmaker" Paradox (Your specific concern)
  You flagged "not handing disproportional power to tiny kingmaker parties." This is mathematically linked to **Proportionality**.
  *   **The Trade-off:** If you satisfy Criterion 1 (Proportionality) in a multi-party system, you *guarantee* coalition governments. In a coalition government, small parties holding the median seat *necessarily* have disproportionate bargaining power (the "kingmaker" phenomenon).
  *   **The Fix:** To eliminate kingmakers, you must violate Criterion 1 (Proportionality) by manufacturing a majority for a large party (e.g., FPTP bonus).
  *   **Verdict:** You cannot have strict proportionality and no kingmakers. You must choose between *representative fragmentation* or *manufactured majorities*.

  #### 4. Duverger's Law (Mechanical vs. Psychological)
  Electoral rules shape the party system, which feeds back into the criteria.
  *   **The Trade-off:** If you prioritize **System Fluidity** (low barriers), you increase fragmentation, which threatens **Government Durability**. If you prioritize **Durability** (high barriers/small districts), you ossify the party system (violating Fluidity).

  ---

  ### Part 3: System Evaluation Against the Spec

  Here is how the three major families perform against the criteria above.

  | Criterion | First-Past-The-Post (FPTP) | Party-List PR (Closed List) | Mixed-Member Proportional (MMP) |
  | :--- | :--- | :--- | :--- |
  | **1. Proportionality** | **Fail.** High deviation between vote share and seat share. | **Pass.** High accuracy, depending on threshold. | **Pass.** Corrects local disproportionality via top-up seats. |
  | **2. Strategic Robustness** | **Fail.** High incentive for tactical voting (Duverger's Law). | **Pass.** Low incentive for tactical voting at ballot stage. | **Mixed.** Sincere voting for party, tactical voting often occurs for local candidate. |
  | **3. Constituency Link** | **Pass.** Strong single-member district link. | **Fail.** MPs accountable to party leadership, not geography. | **Pass.** Retains local MPs, though "two-class MP" issue arises. |
  | **4. Gov Durability** | **Pass.** Usually produces single-party majorities. | **Mixed.** Depends on fragmentation; coalitions can be stable or volatile. | **Mixed.** Similar to PR; coalitions required but often stable (e.g., Germany). |
  | **5. System Fluidity** | **Fail.** High barrier to entry for new parties. | **Pass.** Low barrier (unless legal threshold is high). | **Pass.** Top-up seats allow new party entry even if locals are lost. |
  | **6. Transparency** | **Pass.** Simple: most votes in district wins. Gov formation is pre-electoral. | **Mixed.** Vote is simple, but coalition formation is post-electoral and opaque. | **Fail.** Complex ballot and seat calculation; hard for voters to trace outcome. |

  ---

  ### Part 4: Critique of Your Proposed Criteria

  You asked for feedback on your draft list. Here are the specific adjustments I recommend for the dissertation:

  **1. "Stable Single-Party Majorities" is a Camp Prejudice.**
  You suspected this, and you are right. In comparative politics, "stability" refers to the duration of the cabinet, not its composition. Coalition governments in Scandinavia often last longer than single-party governments in the UK or Canada.
  *   *Correction:* Rename this **Executive Durability**. Do not specify *single-party*. Framing it as "single-party" biases the spec toward Westminster systems before the analysis begins.

  **2. The "Kingmaker" Criterion needs splitting.**
  "Not handing disproportional power to tiny kingmaker parties" conflates two distinct problems:
  *   **A. Extremist Veto Power:** A small anti-system party holds the balance of power and extracts radical policy concessions (e.g., 1930s Europe). This is a genuine risk.
  *   **B. Bargaining Leverage:** A small moderate party extracts policy concessions disproportionate to their vote share (e.g., Liberal Democrats in UK 2010, Greens in Germany). This is a *feature* of coalition compromise, not necessarily a bug.
  *   *Correction:* Split this into **Extremist Containment** (non-negotiable) and **Bargaining Proportionality** (contested). If you ban all kingmakers, you ban coalition politics.

  **3. "Translating votes into seats... voters can recognize."**
  This is good, but be careful. In PR systems, voters often recognize that *votes translate to seats*, but not that *seats translate to government*.
  *   *Correction:* Refine this to **Cognizability of Outcome**. In FPTP, I know my MP. In PR, I know my Party. In both, I might not know my Prime Minister until coalition talks end. This is a specific vulnerability of PR that needs to be in the spec.

  **4. Missing Criterion: Geographic Equity.**
  You have "Constituency Link," but not **Geographic Equity**.
  *   *Scenario:* A party's support is efficiently distributed (FPTP) vs. inefficiently concentrated. A system should ideally not systematically penalize a party simply because its voters live in the wrong places (e.g., urban concentration). This is distinct from proportionality; it's about the *geometry* of representation.

  ### Framing Advice for the Chapter

  Your dissertation's intervention should be this: **Electoral reform debates are not empirical disagreements; they are prioritization disagreements.**

  When a Westminster proponent says "PR leads to instability," they are prioritizing *Executive Durability* over *Preference Aggregation*. When a PR proponent says "FPTP disenfranchises minorities," they are prioritizing *Preference Aggregation* over *Constituency Linkage*.

  Most literature treats these trade-offs as bugs to be solved by "better design" (e.g., "MMP solves everything"). Your intro should argue that **no design solves the trade-offs; it only moves the pain point.**

  By establishing the "Spec" first, you force the subsequent empirical chapters to answer: *Given that we must sacrifice something, which sacrifice is most legitimate in this specific context?* That moves the debate from "Which system is best?" (unanswerable) to "Which trade-off is most acceptable for this polity?" (answerable).
