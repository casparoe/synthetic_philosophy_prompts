  so there's this thing I keep noticing and I don't know if anyone has studied it. take two situations:

  1. my neighbor tells me the water in our building is safe to drink. I believe him, I drink it, done. I now know something I didn't know, purely on his say-so.

  2. my friend whose taste I really resepct tells me some film is the most beautiful thing she's watched in ten years. and something wierd happens with that one. on one hand I sort of believe her — the film goes to the top of my list. but if you asked me "is the film beautiful?" before I'd seen it, I'd feel like a fraud saying yes. and here's the part I really can't untangle: after I watch it and feel basically nothing, I don't conclude the film isn't beautiful. I say "it didn't work for me" and I half suspect she's still right and I'm missing something. with the water it's the opposite — if I tested the water myself and found lead in it, his say-so would be gone, full stop.

  so it's like her testimony about the film does something (moves it up my list) but not the thing testimony usually does (it doesn't hand me knowledge I can use). it's more like a tip, a pointer, a "go look for yourself." and there's a second wrinkle: when I try to argue someone into seeing that something is beautiful — reasons, comparisons, whatever — I can sometimes get them to say "ok fine, it's beautiful," but it feels like they got talked into it without the thing actually happening to them, and everyone kind of knows the difference.

  is there an actual name or established discussion for this exact asymmetry — the thing where aesthetic stuff can be told but not, like, given? if there's a name, I want to know where my description fits it and where it doesn't, because I suspect my version has extra bits (the part where my own non-reaction doesn't overturn the testimony — is that just me being a pushover, or is that part of the phenomenon?). if nothing established fits, then coin a term: define it, give the boundary cases, and say what it is NOT — for instance how it differs from plain "some things you have to experience for yourself," which is true of rollercoasters too, but with rollercoasters nobody thinks the friend is right and I'm missing something if I don't get scared.

  don't give me citations or a reading list btw, I can't look anything up — just work from what you know. take your time, this is the kind of question where I want to see the reasoning.
