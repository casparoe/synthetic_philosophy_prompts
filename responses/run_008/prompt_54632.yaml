prompt: |-
  I'm reading the Wealth of Nations, Book IV, Chapter VII, the long chapter on colonies, and I've got stuck on the section where Smith explains why Rome founded colonies. I can follow the individual sentences, but I don't think I'm following the argumentative point, so I'd like someone to walk me through it. Here is the passage:

  "Rome, like most of the other ancient republics, was originally founded upon an Agrarian law which divided the public territory in a certain proportion among the different citizens who composed the state. The course of human affairs by marriage, by succession, and by alienation, necessarily deranged this original division, and frequently threw the lands, which had been allotted for the maintenance of many different families, into the possession of a single person. To remedy this disorder, for such it was supposed to be, a law was made restricting the quantity of land which any citizen could possess to five hundred jugera, about three hundred and fifty English acres. This law, however, though we read of its having been executed upon one or two occasions, was either neglected or evaded, and the inequality of fortunes went on continually increasing. The greater part of the citizens had no land, and without it the manners and customs of those times rendered it difficult for a freeman to maintain his independency. In the present time, though a poor man has no land of his own, if he has a little stock he may either farm the lands of another, or he may carry on some little retail trade; and if he has no stock, he may find employment either as a country labourer or as an artificer. But among the ancient Romans the lands of the rich were all cultivated by slaves, who wrought under an overseer who was likewise a slave; so that a poor freeman had little chance of being employed either as a farmer or as a labourer. All trades and manufactures too, even the retail trade, were carried on by the slaves of the rich for the benefit of their masters, whose wealth, authority, and protection made it difficult for a poor freeman to maintain the competition against them. The citizens, therefore, who had no land, had scarce any other means of subsistence but the bounties of the candidates at the annual elections. The tribunes, when they had a mind to animate the people against the rich and the great, put them in mind of the ancient division of lands, and represented that law which restricted this sort of private property as the fundamental law of the republic. The people became clamorous to get land, and the rich and the great, we may believe, were perfectly determined not to give them any part of theirs. To satisfy them in some measure therefore, they frequently proposed to send out a new colony."

  What I want explained is not the plot of the paragraph but its logic. First, why does Smith spend so much time on why a landless Roman citizen could not simply get a job? The detour through farming for another, retail trade, and artisan work seems to be doing real work, but I can't tell exactly what. Is he saying that in a slave economy the free poor are structurally unemployable, so that landlessness meant something much graver in antiquity than it would in his own time, and that this is what made the land question politically explosive enough to require colonies as a safety valve? Second, what do I make of the small authorial signals: the parenthesis "for such it was supposed to be," which seems to distance Smith from the judgment that concentration of land was a disorder, and the dry "we may believe" attached to the rich refusing to part with their land? Do these add up to a stance of detached skepticism about the agrarian law tradition, and if so, what is he skeptical of exactly, the diagnosis or the remedy? Third, I want to understand where this paragraph sits in the chapter's larger purpose. The chapter is supposedly about the motives for establishing new colonies, and Smith has just contrasted the clear motives of Greek colonization with something murkier in the European case; where does the Roman story fall between those poles, and is the distinction he is drawing that Greek colonies were founded by surplus people while Roman colonies were founded to keep surplus people from becoming a political problem at home? Finally, how much of this should I read as eighteenth-century commonplace about antiquity, of the kind Smith would have absorbed from authors like Machiavelli and Montesquieu and the Roman historians themselves, rather than as a claim he is putting his own weight on? Please answer in continuous prose only, without headings, bullet points, bold text, or tables, and don't just paraphrase the paragraph back to me; I've read it several times and want the connective tissue between its claims brought out.
