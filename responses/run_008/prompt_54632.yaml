      Move to the rhetorical signals.
      Place it in the chapter's taxonomy of colonies.
      End with the historiographical weight.

      *Wait, one more check on the "disorder" phrase:* "for such it was supposed to be." Smith is noting that the *Romans* thought it was a disorder. Smith himself might view land concentration as a natural outcome of commerce, but acknowledges it was destabilizing for a *military republic* where citizenship was tied to land. This nuance is important.

      *Check on "we may believe":* It implies universal rationality of self-interest. The rich protecting property is a constant of human nature, unlike the specific Roman laws.

      *Check on Chapter Context:* Book IV, Ch VII is "Of Colonies." Part I is "Of the Motives for establishing new Colonies." He discusses Greeks, then Romans, then Modern Europeans. The progression is important. Greeks: surplus population + political freedom. Romans: political stability + military security. Moderns: trade monopoly. Smith is showing that colonies are not a monolithic phenomenon; their function depends on the mother country's political economy.

