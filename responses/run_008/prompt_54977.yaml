answer: |-
  1. **Davidson and the All-Things-Considered Judgment**
  Donald Davidson characterizes akrasia as acting against one's own all-things-considered judgment. On your constitutional model, the "breakfast self" judges abstention best, while the "dinner self" judges consumption best. When the cake is eaten, is it accurate to say the agent acted against their all-things-considered judgment, or have you simply redefined that judgment as whatever the currently dominant temporal party prefers?

  *Follow-up:* You will likely say that there is no trans-temporal "own" to hold a judgment. But if the all-things-considered judgment is just the verdict of the winning coalition, doesn't normativity collapse into power dynamics? How do you preserve the intuition that the dinner self *ought* to have deferred, even if they had the power to do otherwise?

  2. **The Metaphysics of Temporal Parts**
  Your model relies on modeling the person as a succession of parties with misaligned interests. How finely grained are these parties? Are we talking about distinct selves at breakfast and dinner, or is there a continuous sliding scale of preference shift? If it's the latter, at what point does a shift in preference become a shift in *agent*?

  *Follow-up:* I suspect you'll argue that the boundaries are pragmatic rather than metaphysical. However, if the boundaries are fuzzy, doesn't that undermine the "bargaining" metaphor? You can't negotiate a contract with a counterpart whose identity is indeterminate; how do the selves signal commitment to one another without clear individuation?

  3. **Precommitment and Self-Paternalism**
  Critics often argue that precommitment devices, like Ulysses binding himself to the mast, amount to self-paternalism where a past self tyrannizes a future self that never consented to the restriction. If we treat the person as a crowd to be institutionally managed, doesn't this get the ethics of self-binding backwards by privileging the past self's authority over the future self's liberty?

  *Follow-up:* You will likely respond that the constitution is mutually beneficial, like a social contract. But what about cases where the future self's preferences change due to genuine moral growth rather than mere weakness? If the "constitution" locks in past values, aren't you risking the stagnation of the agent's moral development?

  4. **Stability vs. Goodness**
  You define continent behavior as what the succession of selves achieves when it builds internal institutions. But a stable institution isn't necessarily a good one; a dictatorship can be perfectly stable. What distinguishes a "good" intrapersonal constitution from a "bad" one that successfully suppresses a future self's legitimate interests for the sake of stability?

  *Follow-up:* I imagine you'll appeal to the long-term welfare of the succession as a whole. Yet, if the metric is just aggregate satisfaction across time, doesn't that return you to a form of exponential discounting? How do you evaluate the constitution without smuggling in a trans-temporal standard you claim doesn't exist?

  5. **Responsibility and Coordination Failure**
  If relapse is merely a coordination failure among selves, akin to a failed treaty between nations, it becomes difficult to locate blame. Is the smoker who sincerely resolved to quit still blameworthy for relapsing, and if so, whom exactly do we blame: the self that smoked, the self that failed to bind, or the succession as a collective entity?

  *Follow-up:* You will likely suggest that blame is a forward-looking tool to enforce future compliance. But does this fully capture our backward-looking reactive attitudes? If the relapsing self was determined by the breakdown of the bargain, do they truly deserve the resentment we typically feel toward the weak-willed?

  6. **The Phenomenology of Agency**
  Most people report a phenomenology of unity; I feel like *I* am the one struggling, not a committee. Does your intrapersonal constitutionalism require us to treat this sense of unity as a systematic illusion, or is there room for the experience of unity within a fragmented metaphysics?

  *Follow-up:* If you say it's a useful fiction, I'd ask: does relying on that fiction undermine your theory? If the agent must *believe* they are unified to maintain the constitution, doesn't the truth of your view threaten the stability it seeks to explain?

  7. **Comparison to Dual-Process Theory**
  Psychologists often distinguish between System 1 (fast, impulsive) and System 2 (slow, deliberative) processing. How does your temporal parts view improve upon or differ from a standard dual-process explanation of weakness of will? Is "breakfast self vs. dinner self" just a rebranding of "System 2 vs. System 1"?

  *Follow-up:* You will likely argue that dual-process is synchronic while your view is diachronic. But if the conflict is often experienced in the very moment of action (synchronically), does your diachronic model miss the immediate struggle where the will actually gives way?

  8. **Empirical Robustness of Hyperbolic Discounting**
  Your view leans heavily on the claim that we discount hyperbolically rather than exponentially. However, measured discount curves vary with amounts, delays, domains, and individuals; some people, some of the time, fit an exponential model quite well. How much of your normative story survives if hyperbolic discounting turns out to be partly a laboratory artifact?

  *Follow-up:* I expect you'll say the structural conflict exists regardless of the precise curve. But if a person *does* discount exponentially, does your theory imply they are a single agent incapable of akrasia? That seems counterintuitive; surely a consistent discounter can still act against their better judgment.

  9. **Distinguishing Weakness from Change**
  One challenge for any multi-self view is distinguishing weakness of will from reasonable change of mind. If I quit my diet because I've decided health isn't my top priority anymore, that's a value change, not akrasia. How does your constitutional model differentiate a bargaining failure from a legitimate renegotiation of the terms?

  *Follow-up:* You will probably point to the presence of regret or the violation of prior binding arrangements. But what about the agent who feels no regret because the new self has fully overwritten the old? Is it possible to be weak-willed without feeling bad about it, or does your view make regret a necessary condition?

  10. **Practical Advice for the Agent**
  Finally, for the listener currently struggling with their own resolve: if they accept your view that they are a succession of parties rather than a unified commander, how should that change their strategy? Does acknowledging the fragmentation help them build better institutions, or does it provide a convenient excuse for the next self to defect?

  *Follow-up:* If you suggest it helps by reducing shame, I'd ask: isn't there a risk that reducing shame reduces the motivational force needed to keep the bargain? Does the constitutionalist approach demand a level of self-surveillance that is itself exhausting or unsustainable?
