          *   "Interval or ratio scale validity for 1–10 ITN scores to justify multiplication."
          *   "Comparativism: the claim that any two options can be ranked as better, worse, or equal."
      *   *underdetermined_components*:
          *   "Specific discount rates applied to future value."
          *   "The precise metric of welfare (hedonic vs. preference-based)."
          *   "The empirical model of diminishing returns underlying neglectedness."
      *   *internal_tensions*:
          *   Conflict: Multiplicative ITN math vs. Ordinal 1-10 scoring. Severity: Severe. Fix: Use weighted additive models or explicit uncertainty ranges.
          *   Conflict: Universal moral weights vs. Exemption of rights/dignity. Severity: Severe. Fix: Explicitly categorize rights as side-constraints outside the rubric.
          *   Conflict: Objective cause ranking vs. Subjective career fit. Severity: Moderate. Fit: Separate rubrics for cause vs. agent-relative factors.
      *   *changes_under_incommensurability*: "The fund would abandon single-number rankings for a partial order or 'satisficing' set. Moral weights would become qualitative constraints rather than conversion rates. Selection would rely on reasoned commitment among incomparable options rather than maximization, potentially resulting in multiple funded causes without a strict priority hierarchy."

