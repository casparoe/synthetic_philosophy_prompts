      *   **Context:** They use a standard cause-prioritization rubric (Importance × Tractability × Neglectedness = Priority Score). They use moral weights to convert diverse outcomes into a cardinal unit (e.g., dollars per unit of value).
      *   **Problem:** They notice tensions between this quantifiable, objective framework and other claims made by the movement/committee (e.g., career choice is personal fit, some values like rights/dignity are exempt from trade-offs, neglectedness assumes specific economic curves).
      *   **Task:** Audit the practice. Identify the implicit theory of value, what's strictly presupposed, what's underdetermined, internal tensions, and what changes under a rival theory (incommensurability).
      *   **Format:** JSON object with specific fields (`implicit_theory_of_value`, `strictly_presupposed`, `underdetermined_components`, `internal_tensions`, `changes_under_incommensurability`) followed by no more than two paragraphs of prose.
