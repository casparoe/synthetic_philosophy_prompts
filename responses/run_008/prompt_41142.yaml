      *   **Moral Weights:** Converts diverse outcomes (death, suffering, institutional quality) into a single unit. Assumes full cardinal commensurability (utilitarian/consequentialist monism).
      *   **Tensions:** Claims objectivity/quantifiability for causes but subjectivity/fit for careers. Claims some values (rights) are side-constraints (deontological) but uses a framework that trades everything off (consequentialist). Neglectedness assumes smooth diminishing returns (economic assumption).

