prompt: |-
  Me and my desk partner D. had a massive argument last night and it's still bugging me, so I'm hoping you can settle it by turning it into something usable.

  Context: we're a two-person forecasting desk at a mid-size consultancy. Between us we put out maybe thirty probability calls a week — will this supplier miss the Q3 delivery, will that client's product launch slip, will the merger clear regulators — and each call has to end in an actual number. We get scored on calibration, so we know each other's track records by category. When our numbers are more than about 0.2 apart, our team lead makes us reconcile or at least write up why we didn't, so this comes up constantly.

  The argument: D. says he'll listen to my number but almost never move, because he trusts his own reasoning. Updating toward someone just because they also have a number is, in his words, letting other people do your thinking — and anyway half the time we've already talked through the evidence before giving numbers, so my opinion isn't independent information, it's just a reflection of stuff he already knows. I kept saying that if we're roughly as good as each other and we still disagree, surely the fair thing is meeting somewhere in the middle — assuming I'm the one who's right feels arrogant. He said meeting in the middle is also arrogant, its just arrogant toward both of us at once. We got nowhere and went to bed annoyed.

  So: can you take whatever the philosophy of disagreement literature actually says about peers who disagree and turn it into a procedure I can run in about ten minutes with no stats software? I want the questions in order — is he genuinely a peer on *this kind* of call or just on average; did we form our numbers before or after trading evidence; is his confidence itself evidence of something I'm missing; that sort of thing — with some idea of what counts as a good enough answer to each, when the procedure should spit out "split the difference," when it should say "hold your number," and when it has to hand the decision back to me because it's a value judgment no checklist can settle.

  Then run it on three cases:

  1. Supplier misses a Q3 delivery: I'm 0.7, he's 0.35. Our scored history says I'm slightly better calibrated on logistics generally, but he's clearly better on this supplier's home region.
  2. Client merges with its parent company by year-end: I'm 0.5, he's 0.25 — but we both read the same two analyst reports before giving numbers, so whatever "independence" we had is already compromised.
  3. One where the answer will probably annoy me: on hiring-market calls he's newer and worse calibrated, but he's far more confident, and I can never tell whether his certainty means he knows something I don't. If your procedure tells me to basically ignore him there, I want to hear why that isn't just me being smug.

  And please be honest about the weak links — like whether "checking peerhood" with track records is itself a judgment call dressed up as arithmetic, or wherever else you think it misfires.

  Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Users:** Two-person forecasting desk (User & D.).
      *   **Task:** Create a 10-minute, no-software procedure to resolve probability disagreements based on the philosophy of disagreement (epistemology).
      *   **Context:** 30 calls/week, scored on calibration, reconciliation required if >0.2 apart.
      *   **The Conflict:** D. thinks updating is "letting others do your thinking" and claims non-independence due to prior discussion. User thinks sticking to one's gun is arrogant and splitting the difference is fair. D. counters that splitting is "arrogant toward both."
      *   **Requirements:**
          *   Turn philosophy of disagreement (Peer Disagreement) into a step-by-step procedure.
          *   Include specific questions (peerhood, independence, confidence, etc.).
          *   Define thresholds for "split," "hold," or "judgment call."
          *   Apply the procedure to three specific cases.
          *   Critique the procedure's weak links (honesty about limitations).
          *   **Tone/Style:** British English.

  2.  **Theoretical Foundation (Philosophy of Disagreement):**
      *   *Key Concept:* The "Equal Weight View" (Elga, Christensen) vs. "Right Reasons View" (Kelly, Sosa).
      *   *Equal Weight:* If you regard someone as an epistemic peer (same evidence, same ability), you should split the difference (conciliate).
      *   *Right Reasons:* If you have good reason to think you're right (e.g., you spotted a flaw in their reasoning), you don't have to move much.
      *   *Independence:* Crucial. If you influenced each other *before* stating numbers, the "peer disagreement" force weakens.
      *   *Peerhood:* Is D. a peer *on this specific question*? Global track record vs. local expertise.
      *   *Higher-Order Evidence:* Does D.'s confidence signal hidden evidence?

  3.  **Drafting the Procedure (The "Reconciliation Protocol"):**
      *   Needs to be quick (10 mins).
      *   Needs to be actionable.
      *   *Step 1: Independence Check.* Did we talk *before* locking numbers?
      *   *Step 2: Specific Peerhood.* Is D. a peer *here*? (Track records).
      *   *Step 3: Reasoning Audit.* Why the gap? (Hidden info vs. interpretation).
      *   *Step 4: The Calculation.* How to aggregate.
      *   *Decision Rules:*
          *   Independent + Peer = Split (Conciliate).
          *   Dependent (shared evidence) + Peer = Stick to reasoning (Right Reasons).
          *   Non-Peer (User better) = Weight towards User.
          *   Non-Peer (D. better) = Weight towards D.

  4.  **Refining the Procedure for the User's Context:**
      *   D.'s argument ("we already talked") attacks independence. This is a strong point in the literature. If evidence is shared, disagreement is about *interpretation*, not new data.
      *   User's argument ("splitting is fair") aligns with Equal Weight View *if* independent.
      *   *Adjustment:* The procedure needs to weigh "Shared Evidence" heavily. If you discussed the evidence *before* numbering, the "magic of aggregation" is reduced.
      *   *Calibration:* Use their scored history.
      *   *Confidence:* Treat confidence as a signal only if backed by track record.

  5.  **Developing the Three Cases:**
      *   *Case 1 (Supplier Delivery):* User 0.7, D. 0.35. Gap 0.35 (needs reconciliation). User better on logistics, D. better on region. *Verdict:* Weighted average based on specific domain expertise, not simple split.
      *   *Case 2 (Merger):* User 0.5, D. 0.25. Gap 0.25. Shared evidence (2 reports). *Verdict:* D. is right about independence. Don't split mechanically. Re-evaluate reasoning. Likely stick closer to the stronger argument, not the middle.
      *   *Case 3 (Hiring Market):* User better calibrated, D. newer/worse but confident. *Verdict:* Ignore confidence if track record doesn't support it. "Smugness" is actually rational Bayesian updating based on reliability.

  6.  **Addressing the Weak Links (Critique):**
      *   *Peerhood is fuzzy:* Is "slightly better calibrated" enough to override D.?
      *   *Independence is binary in theory but continuous in practice:* How much talk is too much?
      *   *The "Right Reasons" trap:* It's easy to convince yourself you're the one with the right reasons.
      *   *Morale:* Purely algorithmic approaches can damage partnership dynamics.

  7.  **Drafting the Content (incorporating British English):**
      *   *Spelling:* Calibre, programme (if used), centre, analyse.
      *   *Tone:* Professional, slightly dry, pragmatic, empathetic but firm.
      *   *Structure:*
          1.  Introduction (acknowledging the stalemate).
          2.  The Protocol (The 10-minute checklist).
          3.  The Decision Matrix (When to split/hold).
          4.  Application to Cases.
          5.  The Weak Links (Honest critique).

  8.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I address D.'s point about "letting others do your thinking"?
      *   *Fix:* Yes, in the Independence Check. If evidence is shared, updating blindly *is* lazy.
      *   *Check:* Did I address the "arrogance" point?
      *   *Fix:* Frame the procedure as removing ego. It's not about who is arrogant, it's about the math of reliability.
      *   *Check:* Is the math simple?
      *   *Fix:* Use weighted averages based on calibration scores, not complex Bayesian formulas.
      *   *Check:* British English?
      *   *Fix:* Ensure "analyse," "calibre," "modelling," "programme" (if applicable), "whilst," "amongst" (maybe too much, keep it natural), "maths" vs "math". Let's stick to standard UK professional spelling.

  9.  **Final Review against constraints:**
      *   10 minutes? Yes, checklist is short.
      *   No stats software? Yes, simple arithmetic.
      *   Three cases run? Yes.
      *   Weak links highlighted? Yes.
      *   British English? Yes.

  10. **Final Polish:** Ensure the distinction between "Equal Weight View" and "Total Evidence View" is clear but not overly academic. Focus on the *procedure*. (Self-correction: Keep the philosophy implicit in the steps rather than lecturing on Elga vs. Kelly, but reference it in the critique).

  *(Self-Correction on Case 3)*: The user worries about being smug. I need to validate that ignoring a less calibrated colleague's confidence is *not* smugness, it's respecting the scoring system they both work under.

  *(Self-Correction on Case 2)*: D.'s argument is strongest here. If they read the same reports *before* numbering, the disagreement is purely interpretive. Splitting the difference assumes independent errors, but if the input is identical, the errors might be correlated. I need to make sure the procedure reflects this.

