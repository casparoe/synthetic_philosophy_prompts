answer: |-
  You have done your homework. Your summary of the natural law tradition, the positivist counter-claim, and the post-WWII German informer cases is accurate. You have correctly identified that the slogan *lex iniusta non est lex* ("an unjust law is no law at all") is not a single claim but a pivot point between competing theories of what law *is*.

  Your brother used the slogan to settle two questions: (1) Is the official bound to obey? and (2) Is the official to blame (i.e., is "following the law" a valid excuse)?

  Below is the menu of distinct claims the slogan could be making, evaluated for truth and relevance to your brother's argument, followed by the test of the German informer cases and the "private judgment" worry.

  ### Part I: The Menu of Interpretations

  Here are six distinct ways to parse the sentence.

  #### 1. The Metaphorical Reading
  *   **The Claim:** The sentence is not a technical legal claim but a moral metaphor. It means: "This directive is so morally repugnant that it *ought not to be treated* as law, even if it technically is."
  *   **Verdict:** **Trivially True (as rhetoric), Substantively Empty.** It expresses strong disapproval without making a claim about legal validity.
  *   **Does it help your brother?** **No.** If it is just a metaphor, it doesn't actually remove the legal obligation. It tells us the official *should* feel bad, but not that he is legally or morally free to disobey. It settles nothing about blame.

  #### 2. The Validity Reading (Ontological)
  *   **The Claim:** Moral justice is a necessary condition for legal validity. If a rule is sufficiently unjust, it fails to achieve the status of "law." It is legally void *ab initio* (from the start).
  *   **Verdict:** **Substantive and Defensible (within Natural Law), Substantive and False (within Legal Positivism).** This is the core Natural Law position (Aquinas, Fuller). Positivists (Hart, Kelsen) argue law is a matter of social fact (enactment), not moral merit.
  *   **Does it help your brother?** **Yes, but dangerously.** If the policy is "no law," the official has no legal duty to obey it. However, this raises the question: Who decides when it crosses the threshold? If the official decides unilaterally, he risks insubordination based on personal opinion.

  #### 3. The Obligation Defeater Reading
  *   **The Claim:** An unjust rule remains "law" in a sociological sense (it is enacted, enforced, and recognized by courts), but it creates no *moral obligation* to obey. One may comply out of prudence (to avoid punishment), but not out of duty.
  *   **Verdict:** **Substantive and Defensible.** This is arguably Aquinas's actual view. He distinguishes between laws that bind in conscience and laws that are merely acts of violence.
  *   **Does it help your brother?** **Partially.** It answers the obligation question (the official is not morally bound). It does *not* automatically answer the blame question. The official might still be blamed for complying if the injustice was grave enough, but the mere fact that it was "law" ceases to be a shield.

  #### 4. The Judicial Nullification Reading
  *   **The Claim:** This is a directive to judges and officials. It means: "Courts and administrators are required to refuse to apply this directive."
  *   **Verdict:** **Substantive but Context-Dependent.** In some systems (like modern constitutional review), this is true. In others (strict parliamentary sovereignty), judges may be bound to apply unjust laws.
  *   **Does it help your brother?** **Yes, if the official is a judge.** If the official is an executive agent (carrying out policy), this reading is murkier. Executive officials generally do not have the power to nullify statutes; they execute them. If he nullifies it unilaterally, he may be violating the rule of law even if the specific law is unjust.

  #### 5. The Excuse Negator Reading
  *   **The Claim:** This addresses criminal or moral liability. It means: "The fact that a directive was labeled 'law' provides no defense for actions that violate fundamental morality."
  *   **Verdict:** **Substantive and Defensible.** This is the specific reading required for war crimes trials. It separates *legality* from *justification*.
  *   **Does it help your brother?** **Yes.** This directly supports the claim that the official is to blame. It asserts that "I was following the law" is not a valid excuse for grave injustice.

  #### 6. The Systemic Corrosion Reading
  *   **The Claim:** Habitually labeling unjust commands as "law" degrades the concept of law itself, turning it into mere force.
  *   **Verdict:** **Substantive and Defensible (Sociologically).** This is a warning about language and culture.
  *   **Does it help your brother?** **No.** This is a long-term cultural claim, not a guide for individual action in the moment. It doesn't tell the official what to do today.

  ---

  ### Part II: The Test of the German Informer Cases

  You mentioned the post-WWII cases. This is the crucial stress test.

  **The Situation:** After the war, German courts prosecuted citizens who had informed on neighbors under Nazi statutes. The informers argued: "My actions were legal at the time. I cannot be punished for following the law."

  **The Court's Solution (The Radbruch Formula):** Gustav Radbruch, a pre-war legal positivist, argued that while law generally must be obeyed, there is a threshold. When a statute contradicts justice to an **"intolerable level,"** it is not merely "unjust law," it lacks the very nature of law.

  **Which Reading Did They Use?**
  The courts relied on a combination of **Reading 2 (Validity)** and **Reading 5 (Excuse Negator)**.
  1.  **Validity:** They declared the Nazi statutes underlying the denunciations to be void *ab initio* because they violated fundamental principles of humanity. Therefore, the informers had no legal protection.
  2.  **Excuse Negator:** Even if the statutes were technically valid enactments, they provided no moral shield against prosecution for crimes against humanity.

  **Does the Reading Survive the Test?**
  *   **Success:** It allowed the courts to punish gross moral evils without admitting they were applying *ex post facto* laws (retroactive punishment). It saved the legal system from having to say, "What the Nazis did was legal, but we are punishing you anyway."
  *   **Flaw/limit:** The threshold was set extremely high ("intolerable injustice"). The courts did not use this slogan to overturn tax laws or traffic regulations they disliked. It was reserved for statutes that denied human equality or basic rights.
  *   **Relevance to your brother:** If your brother uses this reading, he must prove the policy is not just "wrong" or "unwise," but **intolerably unjust** (e.g., violating basic human rights). If the policy is merely a bad economic policy or a misguided foreign intervention, the Radbruch Formula would likely not classify it as "no law." Your brother's usage assumes the threshold is met; your job is to ask if it actually is.

  ---

  ### Part III: The Private Judgment Worry

  You asked: *Does this slogan mean each person decides for himself which laws bind him? Is that fatal?*

  This is the standard Positivist critique of Natural Law. If "unjust law is no law" is the rule, and I am the judge of injustice, then the rule of law collapses into the rule of men.

  **Is this fatal?**
  It is fatal **if** the slogan is interpreted as granting a license for subjective whim.
  *   **Example:** If I refuse to pay taxes because I think the war is unjust, and you refuse to stop at red lights because you think traffic laws infringe on liberty, society dissolves.

  **Can it be rescued?**
  Yes, but only by adding constraints that your brother likely omitted in a dinner-table argument. The Natural Law tradition does not advocate for *private* judgment in the sense of *personal preference*. It advocates for *public reason*.

  1.  **Objective Standard:** The injustice must be demonstrable by reason, not just felt. It usually requires a violation of basic human goods (life, liberty, due process), not just policy disagreements.
  2.  **Institutional Channels:** In a functioning democracy, the "judgment" that a law is unjust is ideally reserved for courts (Constitutional Review), not individual officials. An executive official refusing to enforce a statute because *he* deems it unjust is arguably undermining the democratic process more than the statute itself.
  3.  **The "Last Resort" Clause:** Most serious natural law theorists (like Martin Luther King Jr. in *Letter from Birmingham Jail*) argue that disobedience is only permissible after legal remedies are exhausted, and one must be willing to accept the penalty to show fidelity to the rule of law generally.

  **Verdict on the Worry:**
  The slogan is **dangerous** if treated as a first-resort principle for individual officials. It is **defensible** only as a last-resort principle for extreme cases, grounded in objective moral reasoning, not private sentiment.

  ### Part IV: Conclusion and Honest Verdict

  You asked for an honest answer rather than a flattering one.

  **Is the slogan mostly rhetoric?**
  In the context of your brother's argument: **Yes.**
  He used a profound, technical legal-philosophical maxim to shut down a complex debate about bureaucratic responsibility. He treated a "limit case" principle (for tyrannical regimes) as if it were a "routine case" principle (for policy disagreements within a functioning government).

  **What is worth rescuing?**
  The core insight worth rescuing is **Reading 5 (The Excuse Negator)**.
  *   **The Truth:** "Following the law" is not an absolute moral shield. There comes a point where human morality overrides positive enactment.
  *   **The Caveat:** Determining that point is not the sole prerogative of the individual official, especially in a democracy.

  **Final Advice for Your Argument:**
  Do not tell your brother he is "wrong" about the quote. Tell him he is **overextending** it.
  1.  Acknowledge that *lex iniusta non est lex* is a real principle used to condemn things like the Nuremberg Laws.
  2.  Point out that in the German cases, the injustice was *extreme* (deprivation of life/liberty based on race), not just "deeply wrong" policy.
  3.  Ask him: "Does this slogan give every official the right to veto any law they privately dislike? If not, what is the objective standard, and who applies it?"

  If he cannot answer that without saying "my conscience," then he has indeed reduced a legal theory to private sentiment, which is the very danger the Positivists warn against. The slogan is a shield against tyranny, not a sword for insubordination.
