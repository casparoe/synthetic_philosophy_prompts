          *   *Claim 2:* Artifact intentionality is grounded in the designer's intent, which is grounded in evolution.
          *   *Claim 3:* Evolution provides a naturalistic basis for content without needing a "homunculus" designer.
          *   *Philosophical Allies:* Fred Dretske, Ruth Millikan, David Papineau (Teleosemantics).
