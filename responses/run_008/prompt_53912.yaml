answer: |-
  Brainstorming out loud: This feels like a classic case of two disciplines talking past each other, but with higher stakes because the ethical theory's viability is on the line. The situationists are operating like naturalists—they want to know if the posited entities (virtues) exist in the causal fabric of the world as described by psychology. The virtue ethicists are operating like normativists—they want to know if the posited entities (virtues) serve as valid ideals for evaluation and cultivation. The stalemate happens because virtue ethicists often want to be naturalists when it suits them (appealing to human flourishing, biology, psychology) but retreat to normativism when the data gets ugly. If I had to bet, I'd say your friend is closer to the truth than you are, but the core issue isn't just indecision; it's a conflation of two distinct projects under one label. The situationists are attacking a descriptive psychological claim that virtue ethicists only implicitly endorse, while virtue ethicists are defending a normative claim that situationists think requires the descriptive backing to be useful. It's not merely verbal because both sides care about the reality of the world, but it's not purely empirical because the data isn't the bottleneck—the interpretation of what the theory *requires* is.

  ***

  This debate is best diagnosed as a **substantive-conceptual ambiguity regarding the empirical commitments of normative theory**. It is not merely verbal, because both sides care about whether human beings can actually be good in the real world; nor is it purely substantive-empirical, because no new dataset will resolve the conflict while the theoretical commitments remain blurred. The stalemate persists because Virtue Ethics (VE) is attempting to function simultaneously as a descriptive psychology of moral agents and a normative guide for moral cultivation, without specifying which role takes precedence when the two come into conflict.

  The situationists (Doris, Harman) treat VE as making a descriptive claim: that robust, cross-situational character traits are the primary explanatory causes of moral behavior. Their evidence (Milgram, Hartshorne & May) targets this specific claim, showing that situational variables often outweigh dispositional ones in predicting behavior. When defenders respond by saying virtues are "rare" (the Aristotelian ideal defense) or that virtues involve "practical wisdom" rather than blind consistency (the nuance defense), they are effectively shifting VE from a descriptive theory to a normative one. They are saying, "You are measuring the wrong thing because virtues are ideals, not common facts." However, when those same defenders argue that situationism undermines moral responsibility or the possibility of improvement, they slide back into treating virtues as psychologically real capacities that ordinary people must possess. This equivocation allows the debate to cycle: the situationist attacks the descriptive claim, the defender retreats to the normative claim, and then the defender complains that the situationist has made ethics impossible, implicitly relying on the descriptive claim again.

  Your friend's hypothesis is closer to the mark than yours, though the issue is deeper than mere indecision. It is not just that the ethics side "hasn't decided" what the theory is for; it is that the theory was historically constructed to bridge the is-ought gap in a way that modern empirical scrutiny has exposed as fragile. Aristotle's biology is not our biology, and modern VE inherits the ambition to be grounded in human nature without accepting the constraints of modern psychology. Your hypothesis—that this is a methodological disagreement about operationalization—captures why the arguments talk past each other, but it misses why the stakes feel so high. If it were purely verbal, we could simply agree to define "virtue" as "normative ideal" and "trait" as "psychological consistency" and move on. But we can't, because VE claims that the normative ideal *must be realizable* in human psychology to be valid. The disagreement is substantive because it concerns the viability of the ethical system itself, but it is conceptual because the blockage lies in defining the relationship between the ethical concept and the psychological reality.

  Progress would not come from a better study, as the situationist data is robust enough for its purpose (showing low consistency in ordinary populations), nor from purely conceptual analysis that ignores the data. Progress requires a **theoretical bifurcation**. Virtue ethicists must explicitly choose between two distinct projects:
  1.  **Idealized Normative VE:** Admit that virtues are rare ideals that most people lack, conceding the situationist's descriptive point. This saves the normative theory but sacrifices its claim to be a "common sense" ethics or a robust explanation of ordinary behavior. It becomes more Kantian (law-based) or perfectionist (elite-based).
  2.  **Naturalistic Psychological VE:** Update the psychological model to match modern interactionism (e.g., adopting "if-then" profiles or social-cognitive personality systems rather than global traits). This accepts the situationist critique of global traits but rebuilds virtue on a more nuanced psychological foundation (as some like Christian Miller have attempted with "mixed traits").

  Until VE proponents specify whether their theory is vulnerable to empirical falsification, the debate will remain frozen. If they claim immunity from psychology, they must stop using psychological terms like "character" and "disposition" to describe their ideals. If they claim grounding in psychology, they must accept the constraints of contemporary personality science.

  Diagnosis: Substantive-conceptual ambiguity concerning whether virtue ethics asserts claims about actual psychology or idealized potential.
