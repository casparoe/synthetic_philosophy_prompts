answer: |-
  **Grade: B (84%)**

  **Marginal Comments:**

  *   **"Gongsun Long's argument has two parts."**
      *   *Good start.* Clear organizational signal.
  *   **"First, the term 'horse' marks out shape/form, while 'white' marks out color."**
      *   *Correct.* Accurate reference to the *xing* (form) vs. *se* (color) distinction in the text.
  *   **"So the compound 'white horse' marks out both shape and color at once, and what marks out two features can't be identical to what marks out only one of them."**
      *   *Strong.* This captures the first half of the *Baima Lun* reconstruction well.
  *   **"Second, if you ask for a horse, a yellow or black horse will satisfy you, but if you ask for a white horse they won't."**
      *   *Correct.* Accurate summary of the "seeking horse" (*qiu ma*) argument.
  *   **"So the two requests pick out different things, and the terms name different kinds."**
      *   *Acceptable.* "Kinds" is a bit vague, but acceptable for a survey level.
  *   **"Hui Shi's paradoxes (like 'the greatest has nothing beyond it') were meant to show that all things form a single unity, so our distinctions are superficial."**
      *   *Mostly Right.* Good grasp of Hui Shi's "Ten Theses" general intent (unity/relativity).
  *   **"Gongsun Long is the opposite: he uses paradox to pull apart things we normally lump together, like shape and color in one object — that's the point of the hard-and-white argument, which Hui Shi also relied on."**
      *   **Error.** The *Jianbai Lun* ("Hard and White") is Gongsun Long's signature text, not Hui Shi's. While both are "School of Names," attributing GL's specific argument to HS blurs the contrast the question asked for. HS is associated with the "Ten Theses" (e.g., "Heaven and Earth are one"). This is a factual conflation. (-5 pts)
  *   **"Both belong to the School of Names, which the Later Mohists attacked for corrupting language."**
      *   *Okay.* "Corrupting language" is more Xunzi's critique, but Mohists did critique their logic. Acceptable shorthand.
  *   **"I read the white horse argument as a semantic thesis: a name's meaning is fixed by exactly what it marks out, so a compound name refers to a narrower class than its parts."**
      *   *Excellent.* This is the correct philosophical "save." You correctly identify it as semantic/intensional rather than purely ontological.
  *   **"Gongsun Long has therefore shown that the class of white horses and the class of horses are distinct classes, so no white horse is a member of the class of horses."**
      *   **Major Logical Error.** You conflate class *identity* with class *inclusion*. Two classes can be distinct (non-identical) without being disjoint (mutually exclusive). {White Horses} $\neq$ {Horses}, but {White Horses} $\subset$ {Horses}. GL argues the *name* "White Horse" is not the *name* "Horse," not that the animal isn't a horse. Your conclusion ("no white horse is a member") contradicts the basic reality GL accepts (that a white horse is still a horse, just not *named* simply "horse"). This undermines your assessment. (-8 pts)
  *   **"That's a real insight about how compound terms work... and it anticipates later debates about whether general terms name classes or properties."**
      *   *Good conclusion.* Despite the error above, your intuition about the semantic nature of the debate is correct.

  **Grading Breakdown & Justification:**

  *   **Reconstruction (40%): 38/40.** Your summary of the *Baima Lun* dialogue (Sentences 2–5) is excellent. You clearly read the text and identified the two main argumentative moves (Form/Color and Seeking Horse). This saved the answer from a lower grade.
  *   **Contrast with Hui Shi (30%): 20/30.** You understood the general vibe of Hui Shi (unity vs. distinction), but you committed a significant textual error by attributing the "Hard and White" argument to Hui Shi (Sentence 8). In a unit specifically distinguishing the "Disputers," conflating GL's signature argument with HS is a substantive mistake.
  *   **Assessment/Analysis (30%): 22/30.** You correctly identified the argument as semantic rather than mere wordplay (Sentence 10), which shows good philosophical instinct. However, Sentence 11 contains a critical logical failure regarding class membership vs. identity. This is the exact trap the *Baima Lun* is designed to expose, and falling into it suggests you didn't fully grasp the logical nuance of *fei* ("is not") in this context.

  **TA Note:** You have a strong grasp of the text's surface structure, but you need to be more careful with the specific attribution of arguments between the Sophists (GL vs. HS) and tighter on your logical terminology (identity vs. inclusion). The reconstruction was A-work; the analysis was C+/B-work.
