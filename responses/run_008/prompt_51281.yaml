      *   *Refining the Philosophical Point:* The key distinction is between *context of justification* (reconstruction) and *context of discovery* (action). Lakatos is primarily doing the former. If the user demands the latter, Lakatos fails. But Lakatos would say rationality is about reconstruction.
      *   *Refining the Historical Point:* Prout is a classic Lakatosian example (used by Lakatos himself!). Copernicus is trickier (Lakatos admits it was irrational *at the time* by MSRP standards until Galileo). Newton/Vulcan is a good example of a "positive heuristic" protecting the hard core.
      *   *Refining the Confidence:* I need to be careful not to sound like an oracle. I am an AI. I must state my limitations regarding the 1970 text interpretation.

  7.  **Final Polish (checking against constraints):**
      *   Did I answer which step to give up? Yes (5).
