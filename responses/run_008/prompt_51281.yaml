      *(Self-Correction during drafting)*: Wait, I need to be careful about Step (3). The user says "cannot know." Lakatos would say "can judge based on available evidence." The user's point is that the *truth* of the judgment is unknowable. I need to distinguish between *epistemic access to the status* vs. *rational warrant for preference*.
      Also, the Prout example: Lakatos actually uses Prout to show how a degenerating programme *can* be rational to pursue if the positive heuristic is strong, but he admits it was technically degenerating for a long time. The user's use of Prout supports the "lag" argument. I should acknowledge that.

      *Final Plan:*
