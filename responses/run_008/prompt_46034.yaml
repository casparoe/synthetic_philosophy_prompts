answer: |-
  You have hit on exactly the right nerve. Textual criticism (TC) is often presented as a dry, mechanical process of sorting manuscripts, but at its core, it is a psychological and probabilistic model of human behavior. It is a forensic reconstruction of the past based on a specific theory of how information degrades over time.

  Here is a breakdown of the underlying assumptions, how they fit together, where they conflict, and where the whole method risks collapsing.

  ### 1. The Theory of the Scribe (Psychological Assumptions)
  The entire discipline rests on a specific profile of the ancient scribe. It assumes the scribe is **conservative but fallible.**

  *   **The Principle of Clarification:** The assumption is that scribes viewed themselves as servants of the text, not co-authors. If they encountered something confusing, ungrammatical, or theologically awkward, their instinct was to "fix" it for the next reader. They smooth out grammar, harmonize parallel passages (especially in the Gospels), and replace rare words with common ones. This is the basis for *lectio difficilior potior* (the harder reading is stronger). It assumes entropy in transmission goes from complex/obscure to simple/clear, not the reverse.
  *   **The Principle of Expansion:** The assumption is that scribes are more likely to add than subtract. This happens intentionally (marginal notes or glosses getting copied into the main text) or unintentionally (repeating a phrase because their eye drifted back). This supports *lectio brevior potior* (the shorter reading is stronger).
  *   **The Principle of Consistency:** It assumes the original author was generally consistent with themselves. If a passage in Virgil suddenly uses a grammatical construction he never uses elsewhere, TC assumes that is likely a scribal intrusion, not the author having a bad day.

  **Is this true?** Statistically, yes. Experimental paleography and the comparison of known drafts show that scribes do tend to normalize spelling and grammar. However, it is not a law of physics. A scribe *can* make a text harder by making a mistake that creates nonsense. So, the rule isn't actually "prefer the hardest reading," it is "prefer the hardest reading that still makes sense." If a reading is *too* hard (i.e., gibberish), it's likely just an error, not the original.

  ### 2. The Conflict of Rules (Internal Inconsistency?)
  You asked what happens when the rules point in opposite directions (e.g., the harder reading is also the longer one). This is the daily bread of textual critics, and it reveals that TC is not an algorithm; it is a **weighing of probabilities.**

  There is no rigid hierarchy where Rule A always beats Rule B. Instead, critics use "Intrinsic Probability" (what would the author likely write?) vs. "Transcriptional Probability" (what would the scribe likely do?).

  *   **Example:** If the "harder" reading is also "longer," the critic has to decide: Did the author write something complex and verbose (intrinsic), or did a scribe try to explain a hard phrase by adding words (transcriptional)?
  *   **Resolution:** Usually, *lectio difficilior* is given more weight than *lectio brevior*. Why? Because accidental omission (making a text shorter) is very common (e.g., *homoioteleuton*, where a scribe's eye skips from one word to a similar ending word further down). Therefore, a shorter reading might just be a damaged text, whereas a harder reading is rarely created by accident.

  The method isn't inconsistent; it's just **abductive**. It infers the best explanation. Sometimes the evidence is balanced, and scholars simply have to admit *non liquet* (it is not clear).

  ### 3. The Charge of Circularity
  Your feeling about circularity is astute. It is a version of the **Hermeneutic Circle**.

  *   **The Circle:** To know what the scribe did, we need to know what the original text looked like. To know what the original text looked like, we need to know what the scribe did.
  *   **The Defense:** It is not a *vicious* circle, but a **spiral**. You start with a provisional text. You analyze the variants to build a theory of scribal habits. You use that theory to refine the text. You check the refined text against the habits again.
  *   **Convergence:** The goal isn't to prove the text with 100% certainty (which is impossible), but to reach a point where the reconstructed text offers the most coherent explanation for *all* the existing variants. If your reconstructed text requires you to believe that five different scribes independently decided to make the grammar worse, your theory is probably wrong. If your reconstructed text explains why Variant A, B, and C all emerged naturally from it, your theory is robust.

  ### 4. Where the Method Breaks Down
  The assumptions of textual criticism are robust for classical texts like Virgil or the New Testament, but they fail under specific conditions.

  **A. Contamination (The Family Tree Breaks)**
  TC often relies on building a *stemma codicum* (a family tree of manuscripts). This assumes Manuscript B was copied from Manuscript A. But scribes were resourceful. If a scribe had two damaged copies of Virgil, they might stitch them together, copying from Copy A for page 1 and Copy B for page 2. This "contamination" destroys the clean genealogical lines. If scribes are eclectics rather than photocopiers, the mathematical models of TC break down.

  **B. The "Harder Reading" Trap (Authorial Obscurity)**
  The *lectio difficilior* rule assumes the author was generally clear and scribes made it easier. But what if the author was *intentionally* obscure?
  *   **Virgil:** He was a polished poet. If a reading is metrically clunky, it's likely scribal error.
  *   **Paul (New Testament):** He wrote rushed, emotional letters with broken grammar. If a reading is grammatically rough, it might actually be Paul. If a scribe "fixed" his grammar, the "smoother" reading is the fake one.
  *   **Breakdown:** If you apply the standard "scribes smooth things" rule to an author who was naturally rough, you will reconstruct a fake, polished version of the text. You need a prior theory of the *author's* style to apply the rules of the *scribe's* behavior correctly.

  **C. The Limit of Survival**
  You noted that no originals survive. TC can only reconstruct the **archetype** (the earliest recoverable ancestor of the existing manuscripts), not necessarily the **autograph** (the actual paper the author wrote on).
  If the first 200 years of transmission involved a bottleneck where *all* copies descended from a single, already-corrupted copy, TC cannot recover what was lost before that bottleneck. The method assumes enough diversity survived to triangulate the original. If the corruption happened before the diversification, the error becomes the "original" for the purposes of criticism.

  ### Summary
  Textual criticism presupposes that:
  1.  **Human nature is constant:** Ancient scribes made mistakes for the same psychological reasons humans do today (boredom, desire to clarify, eye-skip).
  2.  **Entropy is directional:** Texts tend to degrade from difficult to easy, and from shorter to longer (with exceptions).
  3.  **Coherence is recoverable:** The variants are not random noise; they are fossils that allow us to reconstruct the organism.

  It fits together as a **probabilistic framework**, not a logical proof. It breaks down when scribes act creatively rather than conservatively, when the author's style contradicts the assumed norm, or when the manuscript evidence is too contaminated to form a genealogy.

  Your skepticism is healthy. The "original text" is often less a discovered object and more a scholarly consensus on the most plausible version of events. But given that we have zero originals, it is the best forensic tool we have.
