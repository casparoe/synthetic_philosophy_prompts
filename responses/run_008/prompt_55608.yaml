      *(Self-Correction on Movement)*: If everyone moves at once, it's a crash. Let's use a "Turn" system. Whistle blows = Move one step.
      *(Better)*: Continuous slow movement is more "careenium-like." Let's try continuous but slow. "Turtle speed."

      *(Final Decision on Mechanics)*:
      1.  **Simm State:** Held card (Red/Blue).
      2.  **Simm Action:** Move toward same color, away from opposite.
      3.  **Simm Interaction:** If touch, swap cards? No, that's mixing. If touch, they become a "cluster."
      4.  **Whiteboard:** Facilitator draws the clusters.

