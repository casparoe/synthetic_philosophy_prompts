      *   *Check:* Is the limitation section honest?
      *   *Fix:* Emphasize that *I* (the facilitator) am the "self" that doesn't exist in the careenium.
      *   *Check:* Is the timing realistic?
      *   *Fix:* 60 mins is tight. Keep instructions crisp. Use a whistle.

  11. **Final Polish:** Ensure the tone is encouraging but rigorous. Make sure the distinction between "Simm" (student) and "Simmball" (cluster) is clear throughout. (Wait, if students are simms, they can't *be* the simmballs. They form them. Okay.)

      *   *Wait, one nuance:* Hofstadter's simms are tiny. 16 students is a small number. I need to acknowledge this scaling issue in the limitations section.
      *   *Materials:* Colored cards are good. Let's use Red and Blue.
