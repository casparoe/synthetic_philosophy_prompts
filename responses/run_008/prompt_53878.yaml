  *   **Kept *Upamāna*:** This rules out Buddhist/Sāṃkhya reductionism. Nyāya argues that knowing the relation between a name and an object via similarity (the *gavaya* case) has a unique causal structure not reducible to inference.
  *   **Reduced *Arthāpatti*:** This rules out Mīmāṃsā. The "fat guy" case is the classic example Kumārila Bhaṭṭa uses to defend *arthāpatti* as distinct. By reducing it to inference, your teacher adopts the Nyāya view that postulation is just inference from circumstance (*sāmānyato dṛṣṭa*).
  *   **Reduced *Anupalabdhi*:** This confirms Nyāya over Bhāṭṭa Mīmāṃsā. Nyāya argues that knowing an absence ("pot is not here") is simply an inference based on the non-perception of a seeable object (*yogyānupalabdhi*), not a separate means.
  *   **Strict *Śabda*:** Her acceptance of the Vedas implies she holds the orthodox definition of *śabda* as *āptavākya* (the statement of a trustworthy person).

  ### 2. Predictions for Your Cases

  **(a) The Thermometer (21 Degrees)**
  *   **Verdict:** **Inference (*Anumāna*).**
  *   **The Reasoning:** In Nyāya epistemology, perception (*pratyakṣa*) requires direct sense-contact (*sannikarṣa*) with the object. Your eyes contact the number "21" or the height of the mercury (Perception). However, the knowledge *"the temperature is 21 degrees"* relies on a previously established invariable connection (*vyāpti*) between the display and the thermal state, guaranteed by the manufacturer's design.
  *   **Why not Perception?** You do not sense "temperature" directly; you sense a symbol.
  *   **Why not Testimony (*Śabda*)?** The instrument is not a person (*puruṣa*).
  *   **Her Logic:** Since she reduced *arthāpatti* (unobserved cause) to inference, she will treat the unobserved thermal state inferred from a visible sign as *anumāna*. It is a *liṅga-parāmarśa* (consideration of the mark).

  **(b) The Chatbot**
  *   **Verdict:** **Inference (*Anumāna*).** (Or potentially *not a pramāṇa* if she deems it unreliable, but structurally it fits Inference).
  *   **The Reasoning:** Nyāya defines *śabda* strictly as the statement of a trustworthy *person* (*āpta*) who has **communicative intent** (*tātparya*).
      *   **No *Āpta*:** A chatbot is not a conscious agent; it is a tool.
      *   **No *Tātparya*:** The model has no intent to convey truth to you; it predicts tokens based on weights.
  *   **Her Logic:** Trusting a chatbot is trusting a reliable instrument. Just as you infer fire from smoke, you infer truth from the chatbot's output based on its past reliability (inductive generalization). This falls under inference, not testimony. She will likely argue that *śabda* requires a moral agent capable of truthfulness (*ṛjuvatā*), which a machine lacks.

  ### 3. The "Killer Case" to Split the Rules

  You want a case that distinguishes between **Orthodox Nyāya** (Intent is required for *Śabda*) and a **Liberal/Modern Epistemology** (Reliability is sufficient for *Śabda*). The Chatbot case conflates "Personhood" and "Intent." To isolate the rule, you need a case with a **Person** but **No Intent to Communicate to You.**

  **Bring this case:**
  > **"The Overheard Conversation."**
  > You are sitting in a café. Two strangers at the next table, whom you know to be experts in the field, are discussing a fact you don't know. They are talking to *each other*, not to you. You listen in and gain true knowledge.

  **Why this splits the rules:**
  *   **Orthodox Nyāya (Her likely stance):** This is **Inference (*Anumāna*)**.
      *   *Reason:* *Śabda* requires *tātparya* (the speaker's intent to communicate knowledge *to the listener*). Since they did not intend to teach you, their words function merely as a sign (*liṅga*) from which you infer the truth.
  *   **Liberal *Śabda* (The alternative):** This is **Testimony (*Śabda*)**.
      *   *Reason:* The source is trustworthy (*āpta*) and the statement is true. The specific direction of intent shouldn't matter; the transmission of knowledge from a reliable source is what defines testimony.

  **If she rules "Overheard Conversation" = *Śabda*:**
  She is secretly liberalizing the definition of *āpta* (perhaps allowing "deferred intent"). This would mean your Chatbot case *might* have a chance if you argue the developers intended the tool to communicate.

  **If she rules "Overheard Conversation" = *Anumāna*:**
  She is a strict Nyāya orthodoxy. The Chatbot is definitely Inference, because it lacks both personhood *and* intent.

  ### Summary for your Seminar Prep
  *   **Her School:** Classical Nyāya (*Catuṣpramāṇavāda*).
  *   **Her Heuristic:** Distinctness is granted only if the causal mechanism of knowledge generation (*utpatti*) cannot be explained by sense-contact (Perception) or sign-reasoning (Inference). *Upamāna* survives because the name-object link is unique. *Arthāpatti* fails because it's just reasoning from circumstance.
  *   **Your Strategy:** Present the Thermometer and Chatbot as **Inference**. Acknowledge the perceptual component but emphasize the *vyāpti* (connection) required to make sense of the data. Then, drop the **Overheard Conversation** case to see if she breaks on the requirement of *tātparya* (intent).
