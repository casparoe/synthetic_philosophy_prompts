answer: |-
  # INTERGENERATIONAL WELFARE: A DECISION TREE
  **Seminar Handout | Philosophy & Economics**

  **ROOT COMMITMENT:** *The welfare of people who will exist later counts for something (whether intrinsically or instrumentally).*

  │
  **Q1: BASIS OF CLAIM**
  Does future welfare generate moral claims *independently* of its effects on currently living people?
  │
  ├── **No** (It counts only because it affects us now).
  │   └── **LEAF: PRESENTISM**
  │       *Awkward Commitment:* Must deny obligations to prevent existential catastrophes that leave no current survivors to mourn.
  │
  └── **Yes** (Future people have independent moral standing).
      │
      **Q2: PURE TIME PREFERENCE (PTP)**
      Is the *temporal location* of a benefit itself a moral reason to value it less (distinct from risk or utility)?
      │
      ├── **Yes** (Temporal distance intrinsically reduces value).
      │   └── **LEAF: ETHICAL EXPONENTIAL DISCOUNTER**
      │       *Awkward Commitment:* Implies an identical life is morally less valuable simply because it is lived later.
      │
      └── **No** (Time is morally neutral; only probability or magnitude matters).
          │
          **Q3: MARKET RATE**
          Should the social discount rate be set by observed returns on private capital?
          │
          ├── **Yes** (Use opportunity cost to weigh future consumption).
          │   └── **LEAF: MARKET INSTRUMENTALIST**
          │       *Awkward Commitment:* Makes intergenerational justice hostage to current market inefficiencies and irrationalities.
          │
          └── **No** (Use ethical parameters regarding risk and utility).
              │
              **Q4: FAR FUTURE STATUS**
              Does the far future differ from the near future in *kind* (epistemic break) rather than *degree*?
              │
              ├── **Yes** (Institutional decay or knowledge limits create a discontinuity).
              │   └── **LEAF: EPISTEMIC DISCOUNTER**
              │       *Awkward Commitment:* Requires drawing an arbitrary temporal line where moral reasoning changes type.
              │
              └── **No** (Continuity; time is analogous to space).
                  │
                  **Q5: UNCERTAINTY**
                  Do we discount expected welfare due to the probability of beneficiaries existing?
                  │
                  ├── **Yes** (Weight by probability of existence).
                  │   └── **LEAF: PROBABILITY DISCOUNTER**
                  │       *Awkward Commitment:* May justify neglecting low-probability, high-stakes existential risks.
                  │
                  └── **No** (Weight welfare regardless of temporal distance, akin to spatial distance).
                      └── **LEAF: PARFIT-STYLE NEUTRAL UTILITARIAN**
                          *Awkward Commitment:* Requires accepting the 'Repugnant Conclusion' or managing infinite utility sums.

  ***

  ## NOTES ON LOGICAL SPACE & BLIND SPOTS

  **1. Mapping Positions to Logic**
  The tree is built from logical distinctions, not names. Famous positions map as follows:
  *   **Ramsey (1928):** Q2=No (called PTP "ethically indefensible"), Q3=No, Q5=Yes (discounts for growth/probability). Falls near *Probability Discounter*.
  *   **Nordhaus/DICE:** Q2=Yes (implicitly), Q3=Yes. Falls near *Market Instrumentalist* or *Ethical Exponential*.
  *   **Stern Review:** Q2=No, Q3=No, Q5=Yes (low discount). Falls near *Probability Discounter*.
  *   **Parfit (1984):** Q2=No, Q4=No, Q5=No. Falls at *Parfit-Style*.

  **2. Unoccupied or Unstable Combinations**
  *   **Q2=Yes & Q3=No:** (Ethical PTP but reject market rates). *Occupied.* This is the standard "Ethical Exponential" leaf.
  *   **Q2=No & Q3=Yes:** (No PTP but use market rates). *Likely Incoherent.* Market rates typically embed positive time preference; using them while denying PTP creates a contradiction between ethical theory and empirical input.
  *   **Q4=Yes & Q5=No:** (Epistemic break but no probability discount). *Unexplored.* If the future is different in *kind*, why wouldn't that affect existence probability or weighting?

  **3. Blind Spots (Where the Tree Cannot Separate)**
  *   **Growth vs. Probability (Q5):** The tree separates "Probability of Existence" from "Neutral Weighting," but it does not cleanly separate discounting for **existence risk** from discounting for **diminishing marginal utility** (expected growth). Both reduce the present value of future consumption mathematically ($r = \delta + \eta g$ vs. $r = \text{hazard rate}$). A student may answer "Yes" to Q5 meaning "They might not exist" while another means "They will be richer so money matters less." The tree groups these because both reject Pure Time Preference (Q2=No) but accept discounting.
  *   **Market vs. PTP (Q2/Q3):** Some Market Instrumentalists justify using market rates *because* they reveal society's implicit PTP. Others use them purely for efficiency regardless of ethics. The tree separates them by question, but in practice, the leaves may look identical in policy output.
  *   **Parfit vs. Probability (Q5):** A Parfit-style view might accept probability discounting for *specific projects* while maintaining temporal neutrality for *persons*. The binary leaf forces a choice that some hybrid views reject.

  **4. Instruction for Seminar**
  Use this tree to diagnose your own position. If you find your view splits a leaf, identify which logical node needs subdividing. If you find a leaf "awkward," consider whether you are willing to accept that commitment or must backtrack to an earlier node.
