  **RAPPORTEUR'S MEMORANDUM: THE GREAT DIVERGENCE**
  **TO:** Seminar Participants
  **FROM:** Rapporteur
  **SUBJECT:** Joint Statement on Needham Question and Divergence Timing

  **I. ANALYSIS OF CRUXES**
  The collaboration identifies three genuine cruxes. First, *Contrast Class*: The standard question bundles two contrasts: Britain vs. Continental Europe (institutional nuance) and Europe vs. China (macro trajectory). Late-divergence proponents argue "Europe" is too heterogeneous, favoring England vs. Yangzi. Early-divergence proponents argue isolating England ignores shared European institutional drift. Second, *Timing*: Whether parity held until 1750 or eroded centuries prior. Third, *Metric*: Whether divergence is defined by realized welfare (wages/heights) or latent capacity (science/institutions).

  **II. AGREED CLAIMS**
  Both parties sign the following:
  1.  **Technological Trajectory:** China maintained global technological leadership until approximately 1500; Europe subsequently accelerated.
  2.  **Industrialization:** Mechanized industrial production began in Britain between 1760 and 1830, marking a sharp break in energy usage.
  3.  **Data Availability:** Quantitative series for real wages, anthropometrics, and prices exist for both the Yangzi Delta and Northwest Europe covering 1700–1850.
  4.  **Resource Access:** Europe accessed New World resources and domestic coal deposits unavailable to China during the 18th century.
  5.  **Institutional Variation:** Significant institutional differences (property rights, state capacity) existed between Europe and China by 1800, though their economic impact is disputed.

  **III. RESIDUAL DISAGREEMENTS**

  | Issue | Late-Divergence Position | Early-Divergence Position |
  | :--- | :--- | :--- |
  | **Timing of Decisive Split** | Economic welfare remained comparable until c. 1750; divergence was sudden. | Capabilities and institutions diverged centuries before 1750; welfare lagged but followed. |
  | **Primary Driver** | Conjunctural factors (coal proximity, New World land) relieved ecological constraints. | Endogenous institutional evolution (science, law) created sustained innovation capacity. |
  | **Valid Contrast** | Yangzi Delta vs. England is the correct unit; "Europe" is too heterogeneous. | Europe vs. China is the correct unit; England is an outlier of a broader European trend. |

  **IV. ADJUDICATING EVIDENCE & PREDICTIONS**
  For each crux, we identify evidence bearing on the dispute and register pre-commitments.

  1.  **Crux: Timing/Welfare (1700–1800)**
      *   *Evidence:* New real-wage ratios (wheat/wages) and male height data for Yangzi vs. England.
      *   *Late Prediction:* Ratios will show statistical parity until 1750, widening sharply thereafter.
      *   *Early Prediction:* Ratios will show a persistent, significant European advantage even in 1700.

  2.  **Crux: Capabilities (1600–1750)**
      *   *Evidence:* Per capita rates of scientific society membership and patent filings.
      *   *Late Prediction:* Rates will be low and comparable; innovation was rare everywhere before 1750.
      *   *Early Prediction:* Rates will show a significant European lead, indicating prior institutional divergence.

  3.  **Crux: Contrast Class**
      *   *Evidence:* Variance decomposition of intra-European vs. Europe-China wage data.
      *   *Late Prediction:* Intra-European variance exceeds Europe-China variance in 1750.
      *   *Early Prediction:* Europe-China variance exceeds intra-European variance in 1750.

  **V. NOTE ON VERBAL DISPUTE**
  A portion of the disagreement is verbal regarding the term "divergence." The Late side defines it as *realized living standards*; the Early side defines it as *structural capacity to innovate*. If Europe had higher capacity but similar wages due to demographic pressures (Malthusian checks), both empirical claims could be true. The substantive dispute remains whether higher capacity inevitably produces higher wages absent exogenous shocks (coal/colonies). Resolving this requires distinguishing between *potential* output and *actual* welfare in the models used.

  **VI. CONCLUSION**
  This statement isolates factual agreements from theoretical interpretations. Future work must test the predictions in Section IV using consistent purchasing-power adjustments.
