prompt: |-
  My partner and I have been going round and round about Toby Ord's hinge of history idea and I want a second opinion with actual numbers attached. The way he states it (I'm going off what my partner says, so forgive me if I mangle it), a hinge of history is a period when humanity's actions have much more influence, in expectation, over the long-term future than actions in other periods — and my partner thinks we're living in one, because of existential risks from advanced technology and because values or institutions we lock in now might persist for a very long time. His credence is around 0.8, and it basically determines his career and where we're willing to live, which is honestly why I want to slow this down a bit. I'm at maybe 0.2, mostly on a gut feeling that every generation thinks it's the decisive one and they can't all be right — though I admit that arguement proves less than it seems, since most generations didn't have our tech.

  So that we're not talking past each other, here's how I want it operationalized: I'm asking about the proposition that the century from roughly now to 2100 has more expected influence over the long-term future of Earth-originating civilization than the median later century between 2100 and the year 10,000. Not that this is the single most important century ever, and not that people alive now will be able to tell from the inside — just that comparison.

  Give me your credence on that, with the decomposition. How much turns on the concept even being coherent, whether influence over the long-term future is distributed unevenly enough across time for a hinge to carve out anything at all? How much on the distribution, if there is one, being peaked near us rather than flat or heavy-tailed? How much on the peak, if there is one, being there for the reasons my partner gives — tech-driven existential risk, lock-in — rather than for something neither of us has thought of? And whatever other terms you think belong, I'm sure I've missed some. One number and a line of reasoning for each, then how they combine into your final answer. After that, tell me which term you're least confident in, what evidence or argument would move it the most, and which of our two credences — his 0.8, my 0.2 — is more likely to be wrong for a fixable reason, like one of us mispricing a sub-question rather than genuinely weighing something differently. He's better at this stuff than me, so if the answer is that my 0.2 is the fixable one, I can live with that, I just want to know.

  Please write it as continuous prose, no bullet points or headings or bold text, like a long email to a friend. I know a numbered decomposition sounds like it wants a list, but I'd rather read it as flowing text, the way you'd actually explain it out loud over coffee.
