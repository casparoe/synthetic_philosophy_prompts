answer: |-
  Here is a structured plan for your ninety-minute session, designed to leverage your scientific authority while rigorously bracketing it to serve the philosophical argument.

  ### 1. The Sequence: Modal Machinery Before Biological Matter
  You are correct: the modal machinery must precede the genetics. If you begin with gametes, DNA, or conception, the audience will immediately default to empirical contingency (e.g., "But what if the sperm swam faster?" or "What about epigenetics?"). You must first establish that you are discussing the *conditions of identity*, not the *causes of traits*.

  **Minutes 0–20: The Metaphysical Frame**
  *   **The Hook:** Acknowledge your background. State clearly: "As a geneticist, I can tell you how you *did* develop. As a philosopher today, I am asking what *must* be true for it to be *you* developing."
  *   **The Modal Shift:** Introduce the distinction between **Qualitative Similarity** (sharing properties) and **Numerical Identity** (being the very same object).
      *   *Analogy:* Use a non-biological example first to bypass biological intuition. A specific wooden table made from a specific block of wood. If you make a molecule-perfect duplicate from different wood, it is a *duplicate*, not *the table*.
  *   **The Claim:** Define Origin Essentialism not as "Your origin made you who you are" (causal/deterministic), but "Your origin is *who* you are" (constitutive).
  *   **Head Off Misconception #1 (Personality):** Explicitly state: "We are not talking about your memories, personality, or soul. We are talking about the biological organism's identity conditions. If we wiped your memory, you would still be you. If we swap your origin, you cease to exist."

  **Minutes 20–50: The Carrying Example**
  **Minutes 50–70: Misconception Surgery (Genetics & Similarity)**
  **Minutes 70–85: Objections & Nuance**
  **Minutes 85–90: Closing Assessment**

  ### 2. The Carrying Example: "The Sibling Counterfactual"
  Do not use identical twins. Do not use adoption (same gametes, different parents). Do not use cloning.

  **The Example:**
  Ask the group to imagine their own parents at the moment of their conception. Now, imagine a scenario where the *same* parents conceive a child six months later (or earlier), using a *different* sperm and a *different* egg.
  *   **Why this works:** It holds "parents" constant (avoiding the intuition that 'parents' are the essence) and isolates the specific gametic pair. It forces the audience to confront the individual who is genetically related but distinct (a sibling).
  *   **What it must have:** It must emphasize that this sibling could, in theory, be raised in your exact house, given your exact name, and develop your exact personality.
  *   **What it must lack:** It must lack any discussion of genetic *similarity*. Do not let them calculate the 50% shared DNA. The point is not that the sibling is different, but that even if the sibling were *identical* in traits, they would not be *you*.

  **Instruction:** "I want you to imagine that this other zygote develops into a person who looks like you, thinks like you, and has your life story. The question is not whether they are *like* you. The question is: Are they *you*?"

  ### 3. Misconception Management
  You anticipated three specific misconceptions. Here is where and how to neutralize them.

  **A. "This is genetic determinism in fancy dress."**
  *   **When:** Minutes 10–15 (During the Metaphysical Frame).
  *   **How:** Pre-empt it. "Origin Essentialism is not claiming your genes determine your fate. It is claiming that *you* are the organism that originated from *this* specific cell. A different cell is a different organism, regardless of what genes it carries. This is not about destiny; it is about individuation."

  **B. "The other individual would have been so similar to me as to count as nearly me."**
  *   **When:** Minutes 50–60 (Immediately after the Sibling Counterfactual).
  *   **How:** This is the confusion of Quality with Number. Use the "Perfect Duplicate" move. "If I have a perfect duplicate of this room made of new atoms, I have two rooms, not one room that is in two places. Similarity is not Identity. Kripke's claim is that 'nearly you' is a category error. You are either that organism or you are not."

  **C. "The question is about personality rather than identity."**
  *   **When:** Minutes 0–10 (The very start).
  *   **How:** Define 'You' as the biological organism, not the psychological subject. "If you lost all your memories in an accident, we would not say 'you died and a new person appeared.' We say 'you survived with amnesia.' Therefore, psychology is not the seat of your identity in this context. We are tracking the organism."

  ### 4. The Closing Question
  To distinguish genuine understanding from polite agreement, you need a question that prevents them from retreating into empirical biology.

  **The Question:**
  *"Imagine future technology allows us to synthesize a human being atom-for-atom who is physically indistinguishable from you, but who was assembled from raw materials without a sperm or egg. According to Origin Essentialism, is that individual you?"*

  *   **The "Nodder" Answer:** "Well, if they're exactly the same, does it matter?" (This misses the point; they are focusing on similarity).
  *   **The "Understanding" Answer:** "No. Because they lack the necessary origin. They are a duplicate, not me." (This grasps the modal claim).

  ### 5. The Honest Omission
  You cannot cover the ethical implications of this view in a single session, specifically the **Non-Identity Problem** (associated with Derek Parfit). This is the ethical puzzle that arises if origin is essential: if your parents had waited to conceive, *you* would not exist, so you cannot claim you were harmed by their decision to conceive you "too early" or in "difficult circumstances," because the alternative was non-existence, not a better life for you.

  **How to name it:**
  "I am explicitly excluding the **Ethics of Procreation** and the **Non-Identity Problem**. Today we are asking what makes you *you*. We are not asking whether your parents had a moral obligation to ensure your origin. Mixing the metaphysics of identity with the ethics of harm will confuse both issues. We must settle what 'you' means before we can discuss what is 'good for you'."

  ### Summary of Tactics for a Geneticist
  *   **Bracket your expertise:** Use your authority to validate the science ("Biologically, the sibling is distinct"), then pivot ("Metaphysically, we ask if that distinction is necessary").
  *   **Police the language:** If anyone says "That person would be *basically* me," correct them gently: "Basically is not identity. We are looking for strict identity."
  *   **Hold the line on Modality:** If they argue "But scientifically, that sperm could have produced me," remind them: "Science tells us what is possible in nature. Philosophy asks what is possible for *identity*."

  This structure respects the audience's intelligence, utilizes your background without being dominated by it, and keeps the session focused on the metaphysical claim rather than biological contingency.
