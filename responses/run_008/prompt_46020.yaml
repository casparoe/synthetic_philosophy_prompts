prompt: |-
  I run a film night at my local community centre and we're doing Braveheart next month, followed by a discussion about Scottish independance and whether national identity is ancient or manufactured. I've been reading around the invention of tradition stuff (Hobsbawm's edited book, Benedict Anderson on imagined communities) and it struck me that Braveheart might be a perfect double case: a film about a medieval national hero that's itself stuffed with invented traditions. Gibson's Wallace wears a belted plaid that's centuries out of period, fights in woad, and the whole plot turns on primae noctis, which historians basically treat as a myth. And then there's the statue they put up at the Wallace Monument in the 90s modelled on Mel Gibson's face, which people mocked and vandalised until it was eventualy carted off. So the film isn't just depicting tradition, it's manufacturing new ones.

  I want to write a short intro for the discussion, and I'd love a reading of Braveheart through this lens. A few things I'm wrestling with: does the film work as a clean illustration of Hobsbawm and Anderson, or does it complicate them? Scotland is an awkward case for the "nations are modern" story -- it was a kingdom with real medieval institutions, and the Declaration of Arbroath (1320) sounds pretty national centuries before print capitalism. So when Anderson says nations only really exist once you have mass vernacular print, is Wallace's Scotland an imagined community or a counterexample? And where does the film resist the reading -- is there anything in it doing the work of a genuinely old identity rather than a 19th-century costume drama, and is the "Braveheart effect" on modern Scottish nationalism (people kept quoting it around the 2014 referendum) invention all the way down or not? Be honest about where the theory strains rather than forcing everything to fit.

  Please write it in British English, and keep it accessible -- half the group haven't read any theory, so explain what you need as you go.
reasoning: |-
  Here's a thinking process that leads to the suggested introduction:

  1.  **Analyze the Request:**
      *   **Context:** Community centre film night, showing *Braveheart*, followed by a discussion on Scottish independence and national identity (ancient vs. manufactured).
      *   **User's Knowledge:** Well-read on Hobsbawm (*The Invention of Tradition*) and Anderson (*Imagined Communities*). Aware of historical inaccuracies in the film (plaid, woad, *jus primae noctis*, Gibson statue).
      *   **Task:** Write a short intro for the discussion + a reading of *Braveheart* through the theoretical lens.
      *   **Key Questions to Address:**
          *   Does the film fit Hobsbawm/Anderson cleanly or complicate them?
          *   Scotland as an awkward case (medieval kingdom, Declaration of Arbroath vs. print capitalism).
          *   Does the film resist the "invented tradition" reading?
          *   The "Braveheart effect" on modern nationalism (2014 referendum) – invention or something deeper?
          *   Be honest about where the theory strains.
      *   **Tone/Style:** British English, accessible (explain theory as you go), honest/nuanced (don't force fit).

  2.  **Deconstruct the Theory (for the audience):**
      *   *Benedict Anderson:* Nations are "imagined communities." You can't know everyone in your nation, but you feel a bond. Crucially, he links this to "print capitalism" (novels, newspapers) in the 18th/19th centuries.
      *   *Eric Hobsbawm:* "Invention of Tradition." Many things we think are ancient (kilts, ceremonies) were actually made up recently to create social cohesion or legitimacy.
      *   *The Tension:* Scotland feels old (Kingdom, 1320 Declaration), but the *symbols* of it (like in *Braveheart*) are often modern inventions.

  3.  **Analyze *Braveheart* in this context:**
      *   *As Invention:* The film is a 1990s Hollywood product. The costumes (tartan/plaid), the face paint (woad/Picts), the plot device (*prima noctis*) are historically wrong. They are 19th-century romantic ideas projected onto the 13th century.
      *   *As Complication:* The *sentiment* of the Declaration of Arbroath is genuine medieval political thought. Scotland *was* a state. So Anderson's "print capitalism" start date feels late for Scotland.
      *   *The Gibson Statue:* A literal example of art imitating life imitating art. The statue looked like Mel Gibson, not a medieval Scot. It was rejected. This shows the limit of invention – people know when it feels fake.
      *   *The 2014 Referendum:* People quoted *Braveheart*. Was this shallow? Or did the film tap into a dormant feeling?

  4.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone, acknowledge the film's spectacle, pivot to the discussion topic.
      *   **Explaining the Theory (Gently):** Introduce Hobsbawm and Anderson without jargon. Use the "kilt" example (very Scottish, but relatively recent standardisation).
      *   **Applying to *Braveheart*:**
          *   Point out the anachronisms (tartan, woad).
          *   Discuss the *prima noctis* myth (justifies rebellion through personal violation rather than complex feudal politics).
          *   Mention the Gibson statue (the feedback loop).
      *   **The Nuance/Complication (The "Hard Bit"):**
          *   Scotland isn't a typical "modern nation." It had borders and kings early.
          *   The Declaration of Arbroath *does* sound like nationalism before newspapers existed.
          *   So, is Anderson wrong? Or is Scotland just special?
          *   Does the film tap into something real, or just create a fantasy?
      *   **Closing:** Invite discussion.

  5.  **Refining the Tone (British English & Accessibility):**
      *   Use "centre" not "center", "realise" not "realize".
      *   Avoid dense academic prose. Instead of "ontological security," use "feeling of belonging."
      *   Ensure the critique of the film doesn't sound like snobbery; acknowledge why people *love* it despite the errors.
      *   *Self-Correction on Theory:* Make sure not to say Anderson is "wrong," but that Scotland tests his limits. Hobsbawm is easier to apply to the *film*, Anderson harder to apply to the *history*.

  6.  **Addressing Specific User Prompts:**
      *   *Gibson Statue:* Include this as a key example of "invention failing."
      *   *2014 Referendum:* Mention how the film was used politically.
      *   *Theory Strain:* Explicitly state where the "modern nation" theory wobbles regarding medieval Scotland.

  7.  **Final Polish:** Check word count (keep it "short intro" but substantial enough to spark talk). Ensure the transition from film to theory is smooth. (Drafting mental check: Make sure I don't sound like I'm saying Scottish independence is *just* a movie fantasy, that's too dismissive. Focus on the *symbols* used.)

  8.  **Final Review against constraints:** British English? Yes. Accessible? Yes. Addresses Hobsbawm/Anderson nuances? Yes. Includes specific film details? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't lecture *at* them. It's an intro to a discussion, so it should end with questions. I should frame the theory as "lenses" rather than "truths."

