answer: |-
  **Welcome and Introduction**

  Good evening, everyone. I hope you enjoyed *Braveheart*. It is a magnificent piece of cinema—sweeping, emotional, and undeniably powerful. But as we settle in for our discussion, I want to suggest that the film offers us something more than just a story about William Wallace. It offers a perfect case study for a debate that historians and sociologists have been having for decades: is national identity something ancient and blood-deep, or is it something we construct, like a costume?

  To frame this, I want to briefly mention two ideas you might have heard of. The first comes from the historian Eric Hobsbawm, who wrote about the 'Invention of Tradition'. He argued that many things we think of as ancient national customs were actually made up quite recently to give people a sense of continuity. The second idea is from Benedict Anderson, who described nations as 'Imagined Communities'. He didn't mean 'imaginary' in the sense of being fake, but rather that you will never meet most of your fellow countrymen, yet you hold a picture of them in your head as your 'people'. Anderson argued this really only became possible with the rise of mass printing and newspapers in the 18th and 19th centuries.

  **Braveheart as an Invented Tradition**

  If we look at *Braveheart* through Hobsbawm's lens, the film is practically a textbook example of invention. As many of you spotted, Wallace is wearing a belted plaid and tartan patterns that wouldn't exist for centuries. He's painted with woad, a practice associated with the Picts long before his time. The plot hinges on *jus primae noctis* (the right of the first night), which historians regard as a myth.

  In a sense, Mel Gibson isn't making a 13th-century film; he is making a 19th-century Romantic painting come to life. He is using the visual language of Scottishness that was codified by Victorians and Hollywood, not by medieval Scots.

  There is a brilliant, almost comical example of this feedback loop right here in Stirling. In the 1990s, when a new statue of Wallace was commissioned for the Wallace Monument, the sculptor modelled the face on Mel Gibson. It was a literal instance of a movie character becoming the historical hero. The public mocked it, it was vandalised, and eventually removed. It suggests there is a limit to invention; when the 'tradition' feels too obviously manufactured, people reject it.

  **Where the Theory Strains**

  However, I don't want us to simply dismiss Scottish identity as a Hollywood fabrication. This is where the theory gets complicated, and where I'd love your thoughts.

  Scotland is an awkward case for the idea that nations are purely modern inventions. Unlike many nations that formed in the 19th century, Scotland was a sovereign kingdom with defined borders and institutions in Wallace's time. The Declaration of Arbroath (1320) asserts a concept of the 'community of the realm' that sounds remarkably like nationalism, centuries before Anderson's 'print capitalism' existed.

  So, we have a tension. The *symbols* in the film (the kilts, the blue paint) are invented traditions. But the *sentiment*—the idea that Scotland is a distinct political community with a right to self-determination—has medieval roots.

  This brings us to the 'Braveheart effect' on modern politics. During the 2014 independence referendum, the film was constantly referenced. Was this just people quoting a Hollywood script? Or did the film tap into a dormant, genuine historical memory that the dry facts of constitutional law couldn't reach?

  **Questions for Discussion**

  I'd like to open the floor with these questions:

  1.  Does the historical inaccuracy of the film matter? Can a 'made-up' tradition still inspire real political change?
  2.  Is Scottish identity different from other national identities because it has such old state institutions, or is that just another story we tell ourselves?
  3.  Finally, looking at the Gibson statue fiasco: who gets to decide which traditions stick and which ones get carted off? Is national identity something imposed from above, or something negotiated by the people?

  Let's get stuck in.
