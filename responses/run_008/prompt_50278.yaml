prompt: |-
  Two friends of mine have been arguing about the death penalty for literally years and I want to force them to do the adversarial-collaboration exercise they keep promising each other. One is a retributivist retentionist -- he thinks some crimes just deserve death, and that the state expressing society's condemnation at its maximum intensity is part of what justice requires. The other is an abolitionist whose center of gravity is epistemic: any system run by fallible humans will eventually execute innocent people, and no amount of retributive value can outweigh that. She's also honestly kind of skeptical of retribution as a justification at all, though she's never fully cashed that out.

  Write the joint statement the two of them should be able to sign. I want the following pieces:

  1. A numbered section of claims both accept. Please make these non-vacuous -- not "murder is bad" but things like what the deterrence evidence can and cannot currently show (both agree the empirical literature is too noisy to hang your hat on either way, or if they can't even agree on that, say so in the disagreements section instead), and that no appeals process can drive the probability of executing an innocent to literal zero.

  2. A disagreements table. Each row should state one residual disagreement, phrased so that the side holding that view would actually sign off on the wording. If you find any part of their fight is verbal -- I suspect "dignity" is doing double duty, since he says execution affirms the victim's dignity and she says it degrades the state's -- flag which rows are that and why.

  3. The cruxes: the sub-questions such that settling one would move at least one of them. I have a suspicion one crux is what happens in the "slam-dunk" subset of cases -- imagine a defendant on uninterrupted 4K video, with DNA, who confessed with counsel present and re-confesses knowing exactly what awaits him. At that point her fallibility argument has almost no purchase, so does her position collapse into pure anti-retributivism, or does she have residual grounds (irreversibility as a categorical property of the punishment itself, the state's standing to kill)? And correspondingly: if he's right that desert can ground execution in slam-dunk cases, is his view hostage to the claim that desert verdicts can be distributed as reliably as slam-dunk evidence? Whether real capital systems contain any slam-dunk cases is itself a sub-question worth putting in the table.

  4. For each crux, one concrete case, argument, or thought experiment both would agree bears on it -- and here's the part they never actually do: write down each side's prediction in advance, before running the case. E.g. if the crux is whether retributive intuitions survive being made to actually specify execution criteria (aggravators, ages of defendants, the video case above), what does each predict they'd feel after working through it.

  Don't try to adjudicate who's right -- I've had enough of that from them. The deliverable is the document they could both put their name on, with the leftover disagreement made exact enough that a reader could tell what measurement or argument would move one of them.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Goal:** Create a joint statement for two friends arguing about the death penalty (DP) to sign, facilitating adversarial collaboration.
      *   **Participants:**
          *   *Friend A (Retentionist/Retributivist):* Believes some crimes deserve death; state condemnation is necessary for justice.
          *   *Friend B (Abolitionist/Epistemic/Skeptic):* Believes human fallibility makes executing innocents inevitable; skeptical of retribution generally.
      *   **Required Components:**
          1.  Numbered section of shared claims (non-vacuous, specific on evidence/epistemology).
          2.  Disagreements table (phrased neutrally, flagging verbal disputes like "dignity").
          3.  Cruxes (sub-questions where settlement moves a position, focusing on "slam-dunk" cases vs. systemic reality).
          4.  Predictions/Tests (concrete cases/thought experiments with pre-registered predictions for each side).
      *   **Tone:** Neutral, precise, collaborative, philosophical but grounded. No adjudication.

  2.  **Drafting Section 1: Shared Claims (Common Ground):**
      *   *Constraint:* Must be non-vacuous. Avoid "murder is bad."
      *   *Topic:* Deterrence. Both usually agree it's inconclusive. Let's codify that.
      *   *Topic:* Innocence. Both must agree risk > 0. Even the retentionist admits humans are fallible, even if they think the risk is acceptable. The abolitionist thinks it's unacceptable. The *fact* of risk is shared.
      *   *Topic:* Cost/Process. Both likely agree DP cases cost more/take longer due to appeals (necessary for safety).
      *   *Topic:* Moral Gravity. Both agree killing is a unique moral act for the state.
      *   *Drafting points:*
          1.  Deterrence evidence is statistically inconclusive.
          2.  No procedural safeguard reduces error risk to absolute zero.
          3.  Current administration involves significant delays/costs compared to life without parole (LWOP).
          4.  The moral weight of state killing is distinct from other punishments.

  3.  **Drafting Section 2: Disagreements Table:**
      *   *Constraint:* Phrased so each side signs off. Flag verbal disputes.
      *   *Issue 1: Risk Tolerance.* Retentionist: Risk is acceptable given justice. Abolitionist: Risk is unacceptable regardless of justice.
      *   *Issue 2: Retributive Value.* Retentionist: Positive moral good. Abolitionist: Negligible or negative (vengeance).
      *   *Issue 3: Systemic Reality.* Retentionist: System *can* be fair enough. Abolitionist: System *is* inherently biased/flawed.
      *   *Issue 4: Dignity (Verbal Dispute).* Retentionist: Affirms victim/community dignity. Abolitionist: Degrades state/society dignity. Need to flag this as terminological.
      *   *Drafting rows:* Ensure the wording doesn't bias one side. Use "The moral benefit..." vs "The moral cost..."

  4.  **Drafting Section 3: The Cruxes:**
      *   *Focus:* The prompt specifically highlights the "slam-dunk" case (4K video, DNA, confession).
      *   *Crux 1: The Innocence Threshold.* Is there a level of certainty where the epistemic objection vanishes?
          *   *Abolitionist:* If certainty is 99.9999%, does the objection shift purely to anti-retributivism?
          *   *Retentionist:* If certainty is lower (95%), does the retributive justification hold?
      *   *Crux 2: Retribution vs. Administration.* Is the objection to *death* or to *our system*?
          *   *Retentionist:* Believes ideal theory justifies it, non-ideal theory requires fixing system.
          *   *Abolitionist:* Believes non-ideal theory (reality) vetoes ideal theory.
      *   *Crux 3: State Standing.* Does the state have the moral standing to kill, even if deserved?
      *   *Refining based on prompt:* The prompt asks about the "slam-dunk" subset.
          *   *Crux A:* In a "perfect evidence" case, does the risk of innocence vanish sufficiently to satisfy the Epistemic Abolitionist, leaving only the Retributive Skepticism?
          *   *Crux B:* Does the Retentionist's justification depend on the *frequency* of slam-dunk cases actually occurring in the real world? (i.e., If only 1% of cases are slam-dunk, is a DP system worth it?)

  5.  **Drafting Section 4: Predictions/Tests:**
      *   *Constraint:* Pre-registered predictions.
      *   *Test 1: The Video Case.*
          *   *Scenario:* The 4K video/DNA/confession case.
          *   *Retentionist Prediction:* Abolitionist will still oppose, revealing their core objection is anti-retributive, not epistemic.
          *   *Abolitionist Prediction:* Retentionist will hesitate to apply it broadly, revealing their core objection is actually about systemic fairness, not just desert in the abstract.
      *   *Test 2: The Error Rate Trade-off.*
          *   *Scenario:* Hypothetical system with 1 execution of innocent per 10,000 guilty.
          *   *Retentionist Prediction:* Abolitionist will still reject (zero tolerance).
          *   *Abolitionist Prediction:* Retentionist will reject (too high).
          *   *Wait, better Test:* Let's look at the "Systemic Viability" crux.
          *   *Test:* Reviewing a dataset of exonerations.
          *   *Retentionist Prediction:* Seeing the specific causes of error (bad counsel, junk science) will make us agree these are fixable.
          *   *Abolitionist Prediction:* Seeing the specific causes will confirm they are structural/inevitable.
      *   *Let's align with the "Slam Dunk" crux.*
      *   *Test:* Constructing a "Safe Execution Protocol."
      *   *Retentionist Prediction:* We can agree on a protocol that satisfies epistemic concerns for the top 1% of cases.
      *   *Abolitionist Prediction:* Defining that 1% will prove impossible without arbitrary lines, or we will agree that even that 1% shouldn't be executed due to state standing.

  6.  **Review and Refine:**
      *   *Check Tone:* Is it neutral? Yes.
      *   *Check Constraints:* Did I include the dignity flag? Yes. Did I include the slam-dunk analysis? Yes. Are predictions specific? Yes.
      *   *Refining the "Dignity" Flag:* Make sure it's clear *why* it's verbal (same word, different referent).
      *   *Refining the Cruxes:* Ensure they identify *what would change a mind*.
          *   If Abolitionist admits retribution has *some* value, does she accept DP in slam-dunk cases?
          *   If Retentionist admits slam-dunk cases are <0.1% of docket, does he accept abolition for practical purposes?
      *   *Formatting:* Use clear headers, tables, and distinct sections.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Shared Claims" aren't just "we disagree." They need to be positive assertions both accept.
      *   *Correction:* Ensure the "Predictions" aren't just "I think I'm right." They need to be about *how their view will evolve* or *what they will find* during the exercise.
      *   *Correction:* The prompt asks for "what measurement or argument would move one of them." I need to make sure the Cruxes section explicitly states the condition for movement.

  8.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  # JOINT STATEMENT ON CAPITAL PUNISHMENT
  **Parties:** [Retentionist Name] & [Abolitionist Name]
  **Date:** [Date]
  **Purpose:** To define the precise boundaries of agreement and disagreement regarding the death penalty, isolate the cruxes of the dispute, and establish pre-registered tests for adjudicating residual differences.

  ---

  ## 1. SHARED CLAIMS (COMMON GROUND)
  *Both parties affirm the following propositions as factually or conceptually accurate. Disagreement lies in the weight assigned to these claims, not their validity.*

  1.  **Epistemic Fallibility:** No human administrative system, regardless of procedural safeguards, appeals processes, or evidentiary standards, can reduce the probability of executing a factually innocent person to literal zero.
  2.  **Deterrence Uncertainty:** Current econometric literature regarding the death penalty's deterrent effect is statistically noisy, inconsistent across methodologies, and insufficient to serve as the primary justification for either retention or abolition.
  3.  **Irreversibility:** Execution is uniquely distinct from incarceration because it is biologically irreversible. Post-conviction exoneration cannot provide full restitution to an executed defendant.
  4.  **Resource Intensity:** Due to the necessity of heightened scrutiny (as acknowledged in Claim #1), capital cases currently consume significantly more state resources and time than cases resulting in Life Without Parole (LWOP).
  5.  **Moral Gravity:** The intentional taking of life by the state is a morally distinct act from other forms of punishment and requires a higher burden of justification than imprisonment.

  ---

  ## 2. DISAGREEMENTS TABLE
  *Residual disagreements are listed below. Wording has been negotiated to ensure neither party feels straw-manned.*

  | ID | Disagreement Statement | Retentionist Position | Abolitionist Position | Notes / Flags |
  | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **Risk Tolerance:** Given Claim #1 (non-zero innocence risk), is there a threshold of procedural certainty where the risk becomes morally acceptable? | **Yes.** If procedural certainty exceeds a high threshold (e.g., >99.9%), the residual risk is an acceptable tragic cost of justice. | **No.** Because the harm (death of innocent) is infinite/lexical, no finite probability is acceptable, regardless of procedural rigor. | |
  | **D2** | **Retributive Value:** Does the state infliction of death on a guilty perpetrator constitute a distinct moral good (justice served) beyond incapacitation? | **Yes.** It is a necessary expression of societal condemnation proportional to certain heinous crimes. | **No.** Retribution is either morally neutral (vengeance) or negative. LWOP satisfies the need for incapacitation and condemnation. | |
  | **D3** | **Systemic Viability:** Can a capital system be administered without arbitrary application regarding race, class, or geography? | **Yes.** Current disparities are flaws of *implementation*, not *principle*, and are theoretically fixable. | **No.** Disparities are inherent to discretionary human systems and cannot be engineered away without abolishing the penalty. | |
  | **D4** | **Dignity:** Does execution affirm or degrade human dignity? | **Affirms.** It affirms the dignity of the victim and the moral agency of the perpetrator (holding them fully responsible). | **Degrades.** It degrades the moral standing of the state and coarsens society's respect for life. | **VERBAL DISPUTE.** Both use "dignity" to refer to different subjects (Victim/Perpetrator vs. State/Society). |

  ---

  ## 3. THE CRUXES
  *These are the specific sub-questions where a shift in view would materially alter one party's overall stance. Settling these is the goal of the collaboration.*

  ### Crux A: The "Slam-Dunk" Threshold
  **Question:** In a hypothetical case with perfect evidence (e.g., uninterrupted 4K video, DNA match, voluntary confession with counsel, psychological evaluation confirming competence), does the Epistemic Abolitionist's objection collapse entirely into Retributive Skepticism?
  *   **Why it moves the needle:**
      *   If the Abolitionist concedes that *in this specific subset* the epistemic objection vanishes, the debate narrows strictly to the morality of retribution (D2).
      *   If the Retentionist concedes that such cases are statistically nonexistent in reality, their position shifts from "Principle" to "Pragmatics" (i.e., they must argue for a system that executes *only* these rare cases, or admit the current system is unjust).

  ### Crux B: The Frequency/Trade-off Ratio
  **Question:** Is the Retentionist's support for the death penalty hostage to the *frequency* of "Slam-Dunk" cases relative to error cases?
  *   **Why it moves the needle:**
      *   If the Retentionist admits that if only 1 in 1,000 capital cases qualifies as "Slam-Dunk," the system is net-unjust due to collateral damage to the other 999, then the debate becomes empirical (how many slam-dunks exist?).
      *   If the Abolitionist admits that if 999 in 1,000 were "Slam-Dunk," the system would be acceptable, then the debate is purely about current error rates.

  ### Crux C: State Standing vs. Desert
  **Question:** Even if a defendant *deserves* death (Retribution granted) and is *guilty* (Epistemology granted), does the State lack the *standing* to kill?
  *   **Why it moves the needle:**
      *   This isolates whether the Abolitionist's view is contingent on human error or categorical (the state simply cannot do this). If categorical, no amount of procedural reform satisfies her.

  ---

  ## 4. PRE-REGISTERED PREDICTIONS & TESTS
  *For each Crux, we agree to examine the specified material. Before reviewing, we record our predictions about how the evidence will affect our own and our partner's convictions.*

  ### Test 1: The "Perfect Case" Protocol (Addresses Crux A & C)
  **Material:** We will jointly draft a hypothetical "Capital Protocol" that defines the evidentiary standards for a "Slam-Dunk" case (e.g., video + DNA + confession). We will then attempt to identify 5 historical cases that meet this standard.

  *   **Retentionist Prediction:**
      1.  We will be able to identify at least 3 historical cases meeting this standard.
      2.  The Abolitionist will admit that *if* the system were restricted only to these cases, her epistemic objection would be neutralized, forcing her to argue solely on anti-retributive grounds.
  *   **Abolitionist Prediction:**
      1.  We will fail to agree on any historical cases meeting the standard due to hidden variables (e.g., potential evidence tampering, coercion nuances).
      2.  Even if we agree on the facts, the Retentionist will be unwilling to abolish the death penalty for the *non*-Slam-Dunk cases, revealing that "Desert" is being used to justify a broader, riskier system.

  ### Test 2: The Exoneration Audit (Addresses Crux B & D3)
  **Material:** We will review the top 10 causes of exoneration in death row cases (per the Innocence Project) and categorize them as "Fixable" (e.g., specific forensic tech upgrade) or "Structural" (e.g., witness memory, systemic bias).

  *   **Retentionist Prediction:**
      1.  At least 60% of causes will be categorized as "Fixable."
      2.  Reviewing this will increase the Abolitionist's confidence that a safer system is possible, moving her toward accepting a reformed protocol.
  *   **Abolitionist Prediction:**
      1.  At least 60% of causes will be categorized as "Structural" (inherent to adversarial human systems).
      2.  Reviewing this will increase the Retentionist's concern that "Fixable" solutions require resources politically impossible to sustain, moving him toward accepting LWOP as the pragmatic maximum.

  ### Test 3: The "Dignity" Translation (Addresses D4)
  **Material:** We will rewrite our respective arguments without using the word "dignity," replacing it with the specific mechanism we mean (e.g., "Victim's Moral Status" vs. "State's Monopoly on Violence").

  *   **Retentionist Prediction:**
      1.  Once translated, the Abolitionist will acknowledge that "Victim's Moral Status" is a valid value, even if she weighs it differently.
  *   **Abolitionist Prediction:**
      1.  Once translated, the Retentionist will acknowledge that "State's Monopoly on Violence" carries a moral cost he has been underweighting as merely "administrative."

