      *   *Results:*
          *   Round 1: Peltola ~40%, Palin ~31%, Begich ~28%, Gross ~1%.
          *   Elimination: Begich eliminated (lowest first preferences).
          *   Round 2: Peltola vs. Palin. Peltola won ~51.5% to 48.5%.
      *   *Condorcet Claim:* The user mentions polling suggesting Begich might have beaten either head-to-head.
      *   *Verification:* There was a poll (e.g., by Fabrizio, Ward, and Research Co. or similar post-election analysis) suggesting Begich was a Condorcet winner. Many political scientists (e.g., from FairVote or critical analysts) debated this. It's a plausible claim for the seminar, even if contested. It illustrates the "Condorcet Loser/Winner" paradox in IRV.
      *   *Correction/Nuance:* The user says "Begich was eliminated and Peltola edged Palin." This is correct. The user says "two Republicans together had a clear majority." Correct (31+28 = 59%).

  3.  **Mapping to Gibbard-Satterthwaite (G-S):**
      *   *Theorem Statement:* For any social choice function with 3+ alternatives, if it is surjective (onto) and strategy-proof, it must be dictatorial. Conversely, any non-dictatorial rule with 3+ alternatives is manipulable.
      *   *Conditions:*
          *   3+ candidates? Yes (Peltola, Palin, Begich).
          *   No dictator? Yes.
          *   Unrestricted Domain? Technically, voters *can* rank any way, though political reality constrains preferences (single-peakedness often assumed in politics, but G-S assumes *any* ordering is possible).
          *   Deterministic? Yes.
          *   Surjective? Yes (any candidate *could* win).
      *   *Conclusion:* The system is manipulable.
      *   *The Manipulation:* In IRV, "compromising" or "burial."
          *   *Begich Voters:* If they rank Begich 1st (sincere), he might get eliminated early. If they rank Palin 1st (insincere), Palin might survive to beat Peltola.
          *   *Palin Voters:* If they think Begich is stronger against Peltola, they might rank Begich 1st to save him from elimination.
      *   *Information Problem:* G-S says a strategy *exists*. It doesn't say voters *know* it. In Alaska, Begich voters didn't know he would be eliminated until it happened. Polling was uncertain.

  4.  **Reverse Direction (Election $\to$ Theorem):**
      *   Does the election prove G-S? No, G-S is a mathematical truth.
      *   Does it illustrate "Strategy-Proofness" as a political reality? Yes, it shows the *risk* of manipulation.
