      *   Turnout/Beliefs: G-S assumes fixed preferences. It ignores *why* people vote (expressive vs. instrumental) or how campaigns shape beliefs.

  5.  **Addressing Limitations:**
      *   G-S is about the *aggregation rule*, not the *primary*. The Top-Four Primary is a separate mechanism (filtering candidates). G-S applies to the General Election rule.
      *   Candidate Entry: G-S assumes fixed set of alternatives. It doesn't model strategic entry (Begich entering splitting the vote).
