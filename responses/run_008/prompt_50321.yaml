  6.  **The "Approval Voting" Student:**
      *   Does Approval Voting escape G-S?
      *   *Technicality:* G-S assumes *ordinal* preferences (rankings). Approval voting asks for *cardinal* (dichotomous) preferences (approve/disapprove).
      *   *Result:* Approval voting is *not* covered by the standard G-S theorem because the domain of inputs is different.
