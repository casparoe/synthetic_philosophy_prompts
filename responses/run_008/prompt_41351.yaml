answer: |-
  **The Scenario**
  Arthur, a ruthless corporate negotiator, personally signs a binding agreement to ruin a competitor's livelihood, securing a massive bonus for himself. Six months later, a rare viral encephalitis damages his frontal lobes; while his memory remains intact, his temperament transforms completely—he becomes gentle, altruistic, and deeply ashamed of his former aggression, viewing his past self's values as alien. The competitor sues for restitution, arguing Arthur's current assets (derived from that bonus) should repay the harm. The court must decide if the current, gentle Arthur is liable for the debts and harms incurred by the ruthless Arthur, given that the biological organism and memory stream are continuous but the character and volitional dispositions are radically discontinuous.

  **The Verdicts**
  **Common Sense** (Confidence: High) holds that Arthur is one and the same human being; identity is all-or-nothing. Because the organism persisted, the person persisted. The change in character is irrelevant to liability; the debtor and the defendant are identical. Arthur pays.

  **Parfitian Reductionism** (Confidence: Medium-High) argues that what matters is not identity but *Relation R* (psychological connectedness). Since Arthur's current psychological states (values, character, intentions) are weakly connected to those of the past agent who signed the deal, the normative force of that past commitment is attenuated. Parfit suggests rational concern and responsibility track the degree of connectedness; thus, the current Arthur has diminished reason to accept the burdens of a self he no longer psychologically resembles. Arthur pays less, or nothing.

  **Buddhist No-Self** (Confidence: Medium) denies a substantial self but affirms the causal continuity of the *santana* (stream of aggregates). Conventional personhood and karmic liability are imputed upon this causal stream, regardless of psychological similarity. Because the causal chain from the act to the current state is unbroken, the conventional truth dictates that the fruit of the action (the debt/harm) must be borne by the stream that produced it. To deny liability would be to deny cause and effect (*karma*). Arthur pays.

  **The Divergence Feature**
  The divergence turns on **psychological similarity versus causal continuity**. Parfit weights *similarity* (connectedness); if the inner life changes, the normative claim weakens. The Buddhist weights *continuity* (causal link); if the stream is unbroken, the conventional claim holds. If we remove the psychological change (Arthur remains ruthless), Parfit and Buddhist converge on full liability. If we weaken the causal continuity (e.g., Arthur dies and the debt is passed to an unrelated heir), the Buddhist might still see karmic resonance but legally the obligation ends, whereas Parfit would see zero connection. The specific friction point is *high causal continuity + low psychological connectedness*.

  **Counter-Argument and Two Truths**
  The strongest counter targets the Buddhist verdict. A critic might argue that by insisting Arthur pays based on conventional liability, the Buddhist is quietly reinstating the "self" they denied. If the conventional truth operates exactly like the Common Sense view (Arthur pays because he is Arthur), the reductionism is practically inert. The Buddhist might invoke the **Two Truths doctrine**: ultimately there is no debtor, but conventionally the debt exists to prevent suffering and maintain social order. However, this maneuver risks inconsistency. If the conventional truth is merely a useful fiction, why does it track *causal continuity* so rigidly rather than *psychological welfare*? If the Buddhist says "pay to reduce suffering," they edge toward Parfit (who cares about the quality of the mental states). If they say "pay because the stream carried the cause," they risk reifying the stream into a self-substitute. The Buddhist must walk a tightrope: acknowledging the debt without acknowledging a *bearer* of the debt.

  **Least Sure Claim**
  I am least sure of the attribution to **Parfitian Reductionism regarding *past* responsibility**. Parfit explicitly grounds his reductionism in *future-directed prudential concern* (why should I care about my future self?). Extending this symmetry to *moral responsibility for past actions* is a common philosophical extrapolation, but Parfit himself is less explicit that blame or debt should diminish proportionally with connectedness. It is possible a consistent Parfitian could argue that while *concern* diminishes, *responsibility* remains tied to the causal origin of the act regardless of current psychology, which would collapse the divergence with the Buddhist view.
