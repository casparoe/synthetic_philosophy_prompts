answer: |-
  You have identified one of the most persistent and difficult problems in legal philosophy and bioethics. Your observation is sharp: the law does not operate on a single, consistent theory of the self. Instead, it employs a **pragmatic hybrid** that shifts depending on the stakes (money vs. liberty vs. life) and the presumed state of mind (sober vs. intoxicated vs. demented).

  Philosophers and legal scholars call this the problem of **Diachronic Autonomy** (autonomy across time) versus **Synchronic Autonomy** (autonomy in the moment).

  Here is a reconstruction of the implicit theory your examples reveal, followed by an analysis of what is settled law versus what is genuinely contested among specialists.

  ### 1. The Implicit Theory: "Competence-Weighted Continuity"

  The legal system does not strictly adopt the view that you are one continuous agent, nor does it treat you as a series of separate momentary selves. Instead, it operates on a theory of **Psychological Continuity with a Hierarchy of Capacity.**

  **A. The Default: One Continuous Legal Person**
  For most purposes (debt, property, marriage), the law assumes you are the *same person* over time. This is why you cannot escape a loan by claiming, "The person who signed that contract ten years ago is not the person standing here today." If the law treated every moment as a new self, contract law would collapse. Therefore, the baseline theory is that **past commitments bind future selves.**

  **B. The Exception: The "Authentic" Self Hierarchy**
  However, in the cases you listed (psychiatry, addiction, medical directives), the law introduces a hierarchy. It assumes that not all "selves" are equal. It privileges the **competent, lucid, or "authentic" self** over the **impaired, distressed, or "inauthentic" self.**

  *   **Psychiatric Directives & Ignition Locks:** The law assumes the "sober/lucid self" is the *true* agent and the "intoxicated/psychotic self" is a temporary distortion of that agent. Binding the future self here is not seen as restricting freedom, but as *protecting* the true self's freedom from a temporary hijacking.
  *   **The Sober Gambler:** This is the hardest case for the theory. If a gambler is sober and remorseful but still barred, the law is treating the *addiction itself* as a continuing disability, not just the momentary intoxication. It assumes the "addicted self" has a compromised capacity that persists even during moments of sobriety, justifying the continued ban to protect the "long-term self's" interests.

  **C. The Limit: Inalienable Liberty**
  The law draws the line at "slavery contracts" or irrevocable wills because it presumes a **core of revocable agency.** You can bind your future property (wills, contracts), but you cannot bind your future *bodily liberty* or *fundamental right to change your mind* indefinitely. This suggests the law views the *capacity to choose* as an inalienable right that cannot be signed away, even by a past competent self.

  ### 2. Settled Consensus vs. Genuine Contention

  It is vital to distinguish between how the law *works* (which is relatively settled) and how philosophers justify it (which is highly contested).

  #### What is Settled (Descriptive)
  *   **The Law is Inconsistent:** Legal scholars agree that the law applies different standards of personal identity depending on the context. Contract law requires strong continuity; medical law allows for fluctuating capacity.
  *   **Pre-commitment is Enforceable only with Limits:** It is settled that you can make a Ulysses pact (pre-commitment), but courts will generally not enforce it if the current self objects vigorously and appears competent *at the time of objection*, unless there is a specific statutory framework (like mental health holds) that overrides it.
  *   **Wills are Revocable:** It is a settled principle of probate law that a will is "ambulatory"—it walks with you until death. You cannot make a binding contract to leave your money to X if you change your mind later. This contrasts with medical directives, which are often binding even if the demented patient seems happy.

  #### What is Contested (Normative)
  This is where the specialists fight. There is no consensus on *why* the past self should ever bind the future self.

  **A. The Dworkin vs. Dresser Debate (Medical Directives)**
  *   **Ronald Dworkin (Precedent Autonomy):** Argued that the "critical interests" of the competent past self outweigh the "experiential interests" of the demented present self. If you wrote a directive saying "no treatment if demented," honoring that respects your dignity as a whole person. To ignore it is to treat you like a child.
  *   **Rebecca Dresser (The Current Self View):** Argues that the demented patient is effectively a new person with new interests. If the demented patient is content and wants to live, honoring the past directive harms *this* existing being. She argues the past self has no right to dictate the death of the future self who enjoys life.
  *   **Status:** This is unresolved. Bioethics committees struggle with this daily.

  **B. Addiction and Authenticity**
  *   **The Disease Model:** Justifies self-exclusion lists by viewing addiction as a pathology that compromises competence. The "sober self" is the competent one; the "urges" are symptoms.
  *   **The Choice Model:** Some libertarians and philosophers argue that if the gambler is sober *now*, they are competent *now*. Barring them violates their current autonomy based on a prediction of future failure.
  *   **Status:** Contested. This is why self-exclusion laws vary wildly by jurisdiction. Some allow you to revoke the ban after a cooling-off period; others make it permanent.

  **C. The Paradox of Autonomy**
  *   **Enhancement View:** Philosophers like Jon Elster and Thomas Schelling argue pre-commitment *enhances* autonomy. It allows you to achieve long-term goals you actually value (sobriety, health) against short-term impulses.
  *   **Violation View:** Others argue that autonomy is the right to change your mind. If you cannot change your mind, you are not free. Therefore, binding the future self is inherently anti-autonomous, justified only by paternalism (protecting you from harm).

  ### 3. What Would Change Under a "Present Self Sovereignty" Theory?

  You asked what would happen if we replaced the current hybrid view with the strict idea that **only the person existing right now has any claim to decide for themselves.**

  If we adopted this theory rigorously, our institutions would collapse or require radical reconstruction:

  1.  **Contract Law Would Vanish:** A contract is a promise to bind a future self. If only the present self matters, I could buy a car today and return it tomorrow with no penalty, claiming, "The present me no longer wants to pay." To save commerce, we would have to treat contracts not as binding promises, but as simultaneous exchanges only. Credit, mortgages, and employment would become impossible.
  2.  **Advance Directives Would Become Mere Suggestions:** A living will would have no legal force. If a demented patient opens their mouth for a spoon, doctors would have to feed them, even if their past self wrote "starve me if demented." The current desire overrides the past instruction.
  3.  **Self-Exclusion and Ignition Locks Would Be Unconstitutional:** A sober gambler walking past a casino could not be stopped. A driver with a past DUI who is currently sober could not be forced to use an interlock. The state would have to prove *current* impairment, not *risk* of future impairment.
  4.  **Criminal Punishment Would Be Harder to Justify:** If the "self" changes significantly over time, punishing a 50-year-old for a crime committed by the 20-year-old version becomes philosophically shaky (a view explored by Derek Parfit). Rehabilitation would replace retribution entirely.

  ### 4. Summary of the Implicit Theory

  The legal system quietly assumes a **Narrative Theory of the Person with Safety Valves.**

  1.  **Narrative:** You are the author of a life story. Your past chapters (contracts, directives) set the plot for future chapters. This allows for planning and stability.
  2.  **Safety Valves:** However, if the plot turns toward self-destruction (suicide, slavery, irreversible harm) or if the "author" loses their mind (dementia, psychosis), the system allows the current character to rewrite the script.
  3.  **The Inconsistency:** The inconsistency you noticed (binding the gambler but not the testator) exists because the law values **Property Rights** differently than **Bodily Liberty.**
      *   You can change your will because disposing of property after death doesn't harm your living body.
      *   You cannot easily change a psychiatric directive because the law prioritizes *life and safety* over *liberty* in moments of presumed incapacity.
      *   You cannot revoke a self-exclusion list easily because the law treats addiction as a *status* that persists, not just a momentary choice.

  ### Conclusion

  You have correctly identified that there is no single metaphysical theory of the person underlying the law. There is instead a **functional patchwork.**

  *   **Where the theory is underdetermined:** In cases like the "sober gambler" or the "happy dementia patient." Here, the law could logically go either way (honor the past or honor the present) without contradicting itself. The choice it makes is political and ethical, not logical.
  *   **Where the theory is strict:** In contract law (past binds future) and slavery bans (future cannot be bound).
  *   **The Specialist Consensus:** Scholars agree the tension is real and unavoidable. They disagree on whether the current system strikes the right balance between respecting the "past authentic self" and protecting the "present vulnerable self."

  If you were to argue for the "Present Self Sovereignty" view, you would not just be changing a law; you would be arguing that **promises are morally void** and that **planning for the future is an act of tyranny against who you will become.** That is a coherent philosophical position, but it is one our society has explicitly rejected in favor of stability and long-term agency.
