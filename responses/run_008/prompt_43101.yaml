answer: |-
  An adequate theory must distinguish harm-based prohibitions from meaning-based prohibitions, isolate third-party repugnance from participant welfare, and separate transactional wrongs from background injustice.

  1.  **Source Differentiation [Non-negotiable]:** Must specify whether the objection targets *effects* (exploitation in commercial surrogacy, desperation in kidney sales) or *essence* (vote selling corrupts democracy, dwarf tossing violates dignity). Conflating these fails the Iran kidney case, where regulation mitigates exploitation but not necessarily commodification concerns, and the vote selling case, where the exchange itself undermines the good regardless of participant welfare.
  2.  **Background Justice Separation [Non-negotiable]:** Must determine if the prohibition targets the *sale* or the *inequality* enabling it. Banning surrogacy due to wealth gaps treats the symptom, not the cause; paying kids to read incentivizes behavior without necessarily exploiting desperation. Failure here collapses market regulation into wealth redistribution.
  3.  **Commodification Validity [Prejudice of Moralists]:** Must accept that selling can alter the good's value. Economists often reject this; moralists require it. Without this, surge pricing is merely efficiency; with it, surge pricing becomes profiting from misery.
  4.  **Consent Sufficiency [Prejudice of Libertarians]:** Must decide if consent overrides dignity concerns. Florida's dwarf-tossing ban fails this if consent is supreme; it passes if dignity is objective. A theory must pick a side on whether adults can consent to degradation.
  5.  **Third-Party Repugnance Accounting [Non-negotiable]:** Must explain Roth's repugnant transactions where no participant is harmed. If the theory relies solely on harm, it cannot explain objections to certain bio-markets or vote selling where the buyer/seller might benefit.

  **Incompatible Pairs:**
  *   **Autonomy vs. Objective Dignity:** You cannot simultaneously hold that consenting adults may do anything they wish (libertarian axiom) and that some acts are inherently degrading regardless of consent (dwarf-tossing axiom).
  *   **Welfare Maximization vs. Equality of Status:** Surge pricing clears markets (efficiency) but treats necessities as luxury goods (equality). Maximizing supply (kidneys) often relies on the desperation of the poor (equality). A theory cannot maximize both welfare output and protect the vulnerable from becoming means to ends without restricting the market.
