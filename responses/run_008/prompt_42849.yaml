prompt: |-
  I volunteer as a moderator on a large community wiki about military history, and one of my jobs is closing arguments about whether a claim counts as a live debate or as fringe — I get maybe ten of these a week, always with a backlog, so I need something I can run in ten minutes per case. Someone told me that Wittgenstein's On Certainty has this idea of "hinge" propositions — claims that stay fixed not because anyone checked them but because all the checking of other things depends on them — and that there's a whole subfield now called hinge epistemology built on that. You're a professional epistemologist: please turn that into a decision procedure I can actually use. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a "this isn't a real dispute, close the thread," and where it hands the case to a person because what's left is a question of community values, not epistemology. Then run it on three cases from my queue: an editor claiming a famous battle's casualty figures are inflated tenfold, where the alleged sourcing problems mostly turn out to be normal source noise; an editor whose position ends up committed to all documents of that period being forgeries; and a long-standing article "fact" — the attribution of a famous remark — that a newcomer shows was invented by a 19th-century biographer. Please be honest about where the procedure will misfire, especially the worry that "that's a hinge" just becomes a fancy way of saying "shut up." Think carefully first — maybe start with a quick brainstorm about which distinctions from the theory actually need to survive the translation into a wiki procedure and which I can drop.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Professional Epistemologist.
      *   **Task:** Create a 10-minute decision procedure based on Wittgenstein's *On Certainty* (Hinge Epistemology) for a military history wiki moderator to distinguish "live debate" from "fringe/dogmatic" claims.
      *   **Constraints:** Must be practical (10 mins/case), actionable (specific questions), and include a hand-off point for community values vs. epistemology.
      *   **Deliverables:**
          1.  Brainstorming/Filtering of theory (what to keep/drop).
          2.  The Decision Procedure (Questions, Sufficiency Criteria, Stop/Hand-off points).
          3.  Application to three specific cases (Casualty inflation, Universal forgery, Invented remark).
          4.  Honest assessment of limitations/misfires (the "shut up" worry).
      *   **Tone:** Professional, practical, empathetic to the moderator's workload, philosophically rigorous but accessible.

  2.  **Deconstruct Hinge Epistemology for this Context:**
      *   *Core Idea:* Some propositions (hinges) are exempt from doubt because doubting them undermines the entire language game or inquiry system. They aren't "known" in the standard sense; they are the scaffolding.
      *   *Wiki Context:* A wiki relies on consensus, sourcing, and established historiography. "Fringe" often means claims that require dismantling the scaffolding of historical method to accept.
      *   *What to Keep:* The distinction between *internal* doubt (within the system) and *systemic* doubt (attacking the system itself). The idea of "cost of doubt" (what else falls if this falls?). The distinction between empirical uncertainty and grammatical/methodological necessity.
      *   *What to Drop:* Deep metaphysical skepticism. Wittgenstein's specific examples (mooreanism, hands, earth existing). The idea that hinges are *true* (they are *acted upon* as certain). We need to avoid making the moderator an arbiter of Truth, but rather an arbiter of *Methodological Viability*.
      *   *Crucial Adjustment:* Hinges aren't just "things we believe." They are "rules of the game." In history, the "game" is evidence-based reconstruction. If a claim requires breaking the rules of evidence to sustain, it's attacking a hinge.

  3.  **Drafting the Decision Procedure (The "Hinge Test"):**
      *   *Goal:* Fast, binary(ish) outputs.
      *   *Step 1: The Empirical Check.* Is this just a disagreement about data? (If yes, keep open).
      *   *Step 2: The Cost of Doubt.* If this claim is true, what else must be false? (If it requires rejecting *all* sources of a type, it's likely a hinge attack).
      *   *Step 3: The Methodological Check.* Does this claim rely on a method the community has agreed is invalid (e.g., conspiracy, supernatural)?
      *   *Step 4: The Hand-off.* If it passes the epistemological filters but still feels wrong, it's a values/policy call, not epistemology.

  4.  **Refining the Questions (Iterative Process):**
      *   *Draft 1:* "Is this a hinge?" (Too vague).
      *   *Draft 2:* "Does doubting this break history?" (Too dramatic).
      *   *Draft 3:* "To accept this claim, must you reject the standard criteria for evidence in this field without providing new criteria?" (Better).
      *   *Structure:* Need a flowchart style. Q1 -> If Yes, Stop. If No, Q2...
      *   *Time Limit:* 10 minutes means skimming sources, not reading them. The questions must focus on the *structure of the argument*, not the content.

  5.  **Developing the Three Cases:**
      *   *Case 1 (Casualty Inflation):* Claim: 10x inflation. Reality: Source noise.
          *   *Analysis:* This is internal debate. Sources exist, interpretation varies. Not a hinge attack.
          *   *Verdict:* Live Debate.
      *   *Case 2 (Universal Forgery):* Claim: All docs forged.
          *   *Analysis:* To accept this, you must reject the entire archival basis of the period. No new method offered. High cost of doubt.
          *   *Verdict:* Fringe/Close.
      *   *Case 3 (Invented Remark):* Claim: Famous quote is fake (19th C invention).
          *   *Analysis:* This challenges a specific fact, but uses standard historical method (provenance). It doesn't break the system; it fixes it.
          *   *Verdict:* Live Debate (Correction).

  6.  **Addressing the "Shut Up" Worry (Critical Reflection):**
      *   *Risk:* Calling something a "hinge" can just mean "we don't want to discuss this."
      *   *Mitigation:* The procedure must require showing *why* the doubt is costly. It's not "we believe X," it's "believing not-X requires abandoning the tool we use to check anything."
      *   *Honesty:* Acknowledge that hinges shift over time. What was fringe yesterday (e.g., women fought in combat) might be standard today. The procedure protects *method*, not *conclusions*.

  7.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the role and the theory.
      *   **Part 1: Theoretical Triage:** What we keep/drop from Wittgenstein.
      *   **Part 2: The 10-Minute Hinge Protocol:** The actual steps/questions.
      *   **Part 3: Case Studies:** Applying the protocol.
      *   **Part 4: Failure Modes:** The "Shut Up" problem and other risks.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I make it too academic? *Fix:* Simplify language. Use "Methodological Scaffolding" instead of "Grammatical Propositions."
      *   *Check:* Is the hand-off clear? *Fix:* Explicitly state when the moderator becomes a policy enforcer rather than an epistemic judge.
      *   *Check:* Is the distinction between Case 2 and Case 3 clear? *Fix:* Emphasize that Case 3 uses standard tools to correct a fact, whereas Case 2 discards the tools.

  9.  **Final Polish:** Ensure tone is supportive but rigorous. (Proceed to generate response).

  *(Self-Correction Note during drafting the response)*: I need to make sure I don't validate the "Universal Forgery" claim as *false* per se, but as *methodologically untenable* within the wiki's framework. The distinction is crucial for a neutral moderator. The wiki isn't deciding truth; it's deciding if the argument is playable within the established language game of history.

  10. **Final Review against constraints:** 10 mins? Yes. 3 cases? Yes. Honest about misfires? Yes. Hinge epistemology grounded? Yes.

  (Ready to write.)
answer: |-
  ### Part 1: Theoretical Triage (What to Keep, What to Drop)

  Before we get to the procedure, we need to strip Wittgenstein's *On Certainty* down to tools you can actually use. Wittgenstein wasn't writing a rulebook for moderators; he was investigating skepticism. If you try to apply his metaphysics directly, you will fail. Here is the translation layer:

  **Keep:**
  1.  **The Cost of Doubt:** Some claims are "hinges" not because they are proven true, but because doubting them paralyzes the entire inquiry. If accepting a claim requires you to discard the tools used to verify *any* claim, it is attacking a hinge.
  2.  **The Language Game:** Your wiki operates on a specific "game": academic historiography. Moves that violate the rules of that game (e.g., "all evidence is a lie") aren't counter-moves; they are refusals to play.
  3.  **Fluidity:** Hinges can change. What was a hinge in 1950 (e.g., "only officers wrote diaries") might not be one today. The procedure must protect *method*, not specific *conclusions*.

  **Drop:**
  1.  **Truth Claims:** Do not ask, "Is this proposition true?" Ask, "Is this proposition *methodologically viable* within our framework?"
  2.  **Universal Skepticism:** Do not worry about whether *anything* can be known. Worry about whether *this specific argument* allows for verification.
  3.  **Psychological Certainty:** It doesn't matter if the editor *feels* certain. It matters if their argument relies on assumptions that make evidence impossible.

  ***

  ### Part 2: The 10-Minute Hinge Protocol

  This procedure is designed to be run by skimming the thread summary and the primary sources cited by the challenger. It has four steps. If you reach a **STOP** command, you act immediately.

  **Step 1: The Empirical Check (2 Minutes)**
  *Question:* Does the challenger acknowledge the standard body of evidence but interpret it differently, or do they claim the evidence itself is fundamentally compromised?
  *   **Standard Interpretation:** "This source says X, but this other source says Y, so the average is Z."
  *   **Fundamental Compromise:** "These sources are lies/forgeries/misleading by design."
  *   **Sufficient Answer:** If they are interpreting standard evidence, **STOP. This is a Live Debate.** Keep the thread open. This is normal historiography.
  *   **If Compromised:** Move to Step 2.

  **Step 2: The Cost of Doubt (3 Minutes)**
  *Question:* If we accept the challenger's premise (that the evidence is compromised), what *else* must be false to make that consistent?
  *   **Look for:** Does their claim require rejecting a whole class of sources (e.g., "All government records from 1940 are fake") without providing a new, verifiable method to distinguish truth from falsehood?
  *   **Sufficient Answer:** If accepting their claim requires discarding the entire archival basis of the period without a replacement method, **STOP. This is Fringe/Dogmatic.** Close the thread. This attacks the hinge of historical method (that evidence generally correlates to reality).
  *   **If Localized:** If they identify a specific subset of documents with specific provenance issues, move to Step 3.

  **Step 3: The Methodological Mirror (3 Minutes)**
  *Question:* Is the challenger using the tools of history to correct history, or are they using conspiracy to bypass history?
  *   **Look for:** Do they offer primary source counter-evidence, paleographic analysis, or anachronism detection? Or do they rely on "it doesn't make sense" or "they would have lied"?
  *   **Sufficient Answer:** If they are using standard historical tools (provenance, cross-referencing) to challenge a specific fact, **STOP. This is a Live Debate.** (Even if they are challenging a "fact" long held to be true).
  *   **If Bypassing:** If they rely on motive-mongering or universal skepticism, move to Step 4.

  **Step 4: The Value Hand-Off (2 Minutes)**
  *Question:* The claim is methodologically disruptive, but the editor is persistent and has a small following. Is this now a policy issue?
  *   **Analysis:** Sometimes a claim isn't strictly "fringe" in a philosophical sense, but it violates the wiki's "Verifiability" or "No Original Research" policies because the consensus of reliable sources hasn't shifted yet.
  *   **Action:** **HAND-OFF.** This is no longer an epistemological question. It is a policy enforcement question. Tag the thread for Administrator Review regarding "Consensus vs. Innovation." Do not close it yourself; escalate it.

  ***

  ### Part 3: Running the Cases

  Here is how the protocol applies to your current queue.

  **Case 1: The Casualty Inflation**
  *   **Claim:** A famous battle's casualty figures are inflated tenfold.
  *   **Evidence:** The editor points to discrepancies between unit logs and after-action reports.
  *   **Protocol Run:**
      *   *Step 1 (Empirical):* They are acknowledging the sources exist but arguing the *numbers* are wrong due to "source noise" (confusion, double counting). They are not claiming the logs are forgeries.
      *   **Result:** **STOP. Live Debate.**
      *   **Moderator Action:** Keep thread open. This is standard historical revisionism. It operates *within* the hinge that "records are generally reliable but contain errors."

  **Case 2: The Universal Forgery**
  *   **Claim:** All official documents from the 1942 Campaign are forgeries created post-war.
  *   **Evidence:** The editor argues that "the narrative is too clean" and "no one would have kept records under fire."
  *   **Protocol Run:**
      *   *Step 1 (Empirical):* Fundamental Compromise. They are rejecting the documents themselves.
      *   *Step 2 (Cost of Doubt):* To accept this, we must reject *all* documents from that period across multiple nations (since enemy records align). There is no new method offered to determine what *is* real, only that this is fake.
      *   **Result:** **STOP. Fringe/Dogmatic.**
      *   **Moderator Action:** Close thread. Reason: "Argument requires abandoning the methodological basis of historical verification without providing an alternative framework." This is a hinge attack.

  **Case 3: The Invented Remark**
  *   **Claim:** A famous general's quote ("We fight on the beaches...") was invented by a 19th-century biographer.
  *   **Evidence:** The newcomer shows the quote does not appear in contemporary letters or diaries, only in a biography written 40 years later.
  *   **Protocol Run:**
      *   *Step 1 (Empirical):* Fundamental Compromise (The quote is fake).
      *   *Step 2 (Cost of Doubt):* Does this break the system? No. It only removes one data point.
      *   *Step 3 (Methodological Mirror):* Are they using historical tools? Yes. They are using provenance and absence of evidence in contemporary records. They are playing the history game better than the previous editors.
      *   **Result:** **STOP. Live Debate.**
      *   **Moderator Action:** Keep thread open. This looks like "fringe" because it challenges a beloved fact, but epistemologically, it is a *correction* using standard hinges.

  ***

  ### Part 4: Honest Assessment of Failure Modes

  You asked me to be honest about where this misfires. The biggest risk is the **"Shut Up" Worry.**

  **1. The Conservative Bias (The "Old Hinge" Problem)**
  *   **Risk:** Hinge epistemology protects the *current* scaffolding. If your wiki's current scaffolding is outdated (e.g., "Women did not serve in combat roles"), this procedure will initially classify challenges to that as "Fringe" because they require dismantling the existing consensus.
  *   **Misfire:** Case 3 (The Invented Remark) could have been misclassified as Fringe 50 years ago because the "established fact" was a hinge of the community's identity.
  *   **Mitigation:** Step 3 is your safety valve. If the challenger uses *better* standard methods than the defenders, it's a Live Debate, even if it breaks a comfortable narrative. You must ensure you are protecting *method*, not *conclusions*.

  **2. The "Gatekeeper" Trap**
  *   **Risk:** You become the arbiter of what counts as a "valid method." If an editor comes from a different tradition (e.g., oral history vs. archival history), Step 3 might unfairly penalize them.
  *   **Mitigation:** If the editor cites a *different but recognized* academic methodology (e.g., oral tradition in indigenous military history), that triggers the **Hand-Off (Step 4)**. That is a community values discussion about which sources count, not an epistemological slam-dunk.

  **3. The "Hinge" as a Rhetorical Weapon**
  *   **Risk:** Editors will learn this language. They will start saying, "You are attacking a hinge!" to shut down valid criticism.
  *   **Mitigation:** Your closure reason must be specific. Never write "This attacks a hinge." Write: "This claim requires rejecting [Specific Class of Evidence] without providing [Specific Alternative Verification]." Force them to show the *cost*, not just name the concept.

  **4. The 10-Minute Limit**
  *   **Risk:** Complex epistemic disputes take time. You might miss a nuance in Step 2 that makes a "conspiracy" actually a "valid critique of propaganda."
  *   **Mitigation:** When in doubt, use the **Hand-Off (Step 4)**. It is better to escalate a policy question than to epistemologically close a valid debate. The procedure is designed to filter out the *obvious* noise, not to solve the hard cases. The hard cases belong to the community, not you.

  ### Summary for your Workflow
  1.  **Interpretation vs. Rejection:** Are they reading the map differently, or burning the map? (Burn = Fringe).
  2.  **Systemic Cost:** Does this claim break the tools we use to check *other* claims? (Yes = Fringe).
  3.  **Method:** Are they using history to fix history, or rhetoric to bypass it? (Rhetoric = Fringe).
  4.  **Policy:** If it's methodologically sound but consensus-breaking, pass it to the admins.

  This keeps you from doing the history for them. You are judging the *viability of the argument structure*, not the truth of the history. That is the only way to survive ten of these a week.
