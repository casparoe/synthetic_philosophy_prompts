prompt: |-
  I'm a second-year PhD student in comparative politics trying to find my dissertation topic, and I keep circling the debate on performance legitimacy — the idea, usually applied to China and Singapore, that authoritarian regimes can be durable because they deliver growth, order, and improving material conditions, not because citizens endorse the regime's right to rule. You're a political theorist who's spent a career on legitimacy and comparative politics — please think carefully before answering, brainstorm the open questions first, and then give me a prioritized research agenda with the ordering defended.

  Here are the candidate questions I've collected so far, though add others if I'm missing something:

  1. The measurement circularity problem: if the regime claiming performance legitimacy also controls the statistics that measure performance (GDP data, protest reporting), is the claim even testable? And do we have any independent handle on what citizens actually believe, given preference falsification — people telling survey researchers what's safe to say?

  2. Delivering *what*, exactly? If it's raw growth that generates deference, a slowdown should erode it. But maybe what matters is predictability and the sense that things are getting better for you specifically. If so, a regime that successfully manages expectations downward during a slowdown might preserve exactly the deference that growth previously bought — which would suggest the real variable is expectation management, not performance, and the concept sort of dissolves under you.

  3. Whether performance legitimacy does any work that a simpler coercion-plus-apathy story wouldn't. Maybe citizens just stay quiet because dissent is costly and politics feels personally irrelevant to them. If repression and indifference predict stability about as well, the whole concept might be redundant.

  4. Singapore vs. China as a natural contrast: Singapore delivers performance through rule-of-law institutions that partly constrain the rulers themselves; China delivers it through discretionary interventions the rulers can revoke at any moment. Does the legitimation mechanism differ in kind or only in degree, and does that tell us anything about which system survives an actual crisis (a big recession, a war gone badly)?

  5. Whether performance legitimacy is self-undermining: growth produces a middle class, urbanization, education — things modernization theory says should eventually create demands for participation. So is performance legitimacy a loan that comes due, or does that effect just not show up empirically?

  Rank these (and anything you add) for someone with my constraints: three years, quant plus archival methods, and no Mandarin, so original survey experiments on Chinese respondents are realistically out. For each question, tell me what makes it worth the years or not — how upstream it is of the others, whether it's answerable by a grad student without impossible data access, and what kind of evidence would actually move it. And be blunt if you think one of these is overrated or rests on a conceptual confusion — I'd much rather hear that now than in year two.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year PhD student in Comparative Politics.
      *   **Goal:** Find a dissertation topic.
      *   **Topic Area:** Performance Legitimacy (specifically regarding authoritarian durability, China/Singapore focus).
      *   **Constraints:** 3 years remaining, mixed methods (quant + archival), *no Mandarin* (crucial constraint), cannot do original survey experiments on Chinese respondents.
      *   **Role:** Political Theorist/Comparativist with career experience on legitimacy.
      *   **Task:** Brainstorm open questions, prioritize a research agenda (ranking), defend the ordering, evaluate feasibility/worth, and be blunt about conceptual issues.
      *   **Input:** 5 candidate questions provided by the user.

  2.  **Initial Assessment of the Topic (Performance Legitimacy):**
      *   *Status:* It's a classic debate (Zhao, Nathan, Gilley, etc.). It's somewhat "played out" in its original form ("Does growth buy support?"). The literature has moved towards *how* it works, *for whom*, and *under what conditions*.
      *   *Constraint Check:* The "No Mandarin" constraint is a massive bottleneck for China-specific work involving archival or survey data. It limits the student to secondary data, cross-national datasets, or non-Chinese archival sources (e.g., US diplomatic cables, international org reports).
      *   *Conceptual Critique:* "Performance Legitimacy" is often used as a catch-all. It conflates *satisfaction* with *legitimacy* (Beetham's distinction). It often ignores the counterfactual (would they support a democracy more?). It assumes a monolithic "regime."

  3.  **Evaluate the User's 5 Questions:**

      *   *Q1 (Measurement/Preference Falsification):* Classic problem. Hard to solve without independent data. Surveys (like WVS or Asian Barometer) exist but have limitations. Archival work (diplomatic cables) could help. *Verdict:* High conceptual importance, but methodologically treacherous for a PhD without language skills.
      *   *Q2 (Delivering What/Expectations):* This is the most theoretically fertile. It moves from "growth" to "psychological contract." *Verdict:* Strong candidate. Can use existing survey data (ASBS, WVS) + economic data.
      *   *Q3 (Redundancy/Coercion):* Important, but often a strawman. Most scholars admit coercion plays a role. Distinguishing the *margin* where legitimacy kicks in is key. *Verdict:* A bit derivative unless framed carefully.
      *   *Q4 (Singapore vs. China/Institutions):* Comparative case study. *Problem:* No Mandarin makes deep China archival work hard. Singapore is English-friendly. *Verdict:* Risky due to language constraint, but theoretically rich.
      *   *Q5 (Self-Undermining/Modernization):* The "Authoritarian Resilience" vs. "Modernization Theory" debate. *Verdict:* A bit old-school (2000s debate). Might be hard to say something new in 3 years.

  4.  **Brainstorming Additional Questions (Addressing Gaps & Constraints):**
      *   *Q6 (Distributional Performance):* It's not aggregate GDP, it's *who* gets the growth. Inequality might mediate performance legitimacy. (Data available: Gini, survey data).
      *   *Q7 (Attribution Problem):* Do citizens credit the *regime* or *global trends/luck*? If growth is global, does the regime get credit? (Natural experiments: commodity shocks).
      *   *Q8 (Legitimacy Spillover):* Does performance in one domain (economy) spill over to others (foreign policy, social morality)?
      *   *Q9 (The "Crisis" Test):* Legitimacy is latent until tested. How do regimes use performance narratives *during* failure? (Discourse analysis of state media - possible with translation tools?).

  5.  **Developing the Prioritized Agenda (Filtering for Feasibility & Impact):**

      *   *Constraint Filter:* No Mandarin rules out deep qualitative China work (local archives, interviews). Must rely on cross-national data, translated official documents, or third-party archives (US/UK).
      *   *Theoretical Filter:* Needs to move beyond "Does growth matter?" to "How does the *claim* of performance function?"
      *   *Ranking Logic:*
          1.  **Feasibility:** Can it be done in 3 years without Mandarin?
          2.  **Theoretical Payoff:** Does it advance the field or just rehash it?
          3.  **Methodological Rigor:** Can we actually identify causality or mechanism?

      *   *Top Pick:* Q2 (Expectations/Relative Performance) + Q6 (Distribution). Why? Data exists (Asian Barometer, WVS), quant methods work well, theory is current (reference dependence).
      *   *Second Pick:* Q7 (Attribution). Why? Natural experiments (commodity prices, global shocks) solve endogeneity.
      *   *Third Pick:* Q1 (Measurement). Why? Crucial, but hard. Needs creative proxy data (night lights, diplomatic cables).
      *   *Lower Priority:* Q4 (Sing/China comparison). Too much language dependency for deep institutional analysis. Q5 (Modernization). Too broad/long-term for a dissertation. Q3 (Coercion). Hard to measure coercion variation precisely.

  6.  **Drafting the Response (incorporating the Persona):**
      *   *Tone:* Mentor-like, rigorous, blunt but encouraging.
      *   *Structure:*
          1.  Conceptual Diagnosis (The "Blunt" Truth).
          2.  Brainstorming Additions.
          3.  Prioritized Agenda (The Ranking).
          4.  Detailed Defense of Each (Feasibility, Evidence, Worth).
          5.  Final Advice on the "No Mandarin" constraint.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I initially thought about suggesting discourse analysis of Chinese media. *Correction:* Without Mandarin, this is risky. Google Translate is okay for gist, not nuance. Better to stick to quant or English-language archives.
      *   *Correction:* On Q1 (Measurement), suggest using "Night Lights" data as an independent measure of economic performance. That's a solid quant fix.
      *   *Correction:* On Q4 (Singapore/China), advise against a direct comparison if language is a barrier. Suggest comparing *within* authoritarian types using cross-national data instead.
      *   *Emphasis:* Make sure to distinguish *Legitimacy* (normative right to rule) from *Support* (satisfaction). This is the biggest theoretical pitfall.

  8.  **Final Polish:** Check against the prompt requirements (think carefully, brainstorm first, prioritize, defend ordering, be blunt). Ensure the "Political Theorist" voice comes through (concerned with concepts, not just variables).

  *(Self-Correction Note on "Political Theorist" Persona)*: The prompt asks me to act as a political theorist *who's spent a career on legitimacy and comparative politics*. This means I need to bridge the gap between normative theory (what legitimacy *is*) and empirical comp politics (how we *measure* it). I need to call out the conflation of support and legitimacy.

  9.  **Finalizing the Agenda:**
      1.  **The Attribution Problem (New):** Do they credit the regime? (Most causal leverage).
      2.  **Expectations & Reference Points (Q2 refined):** It's not growth, it's *met expectations*.
      3.  **The Measurement/Validity Check (Q1 refined):** Using proxies.
      4.  **Institutional Mediation (Q4 refined):** Not Sing vs. China, but Institutionalized vs. Personalist autocracies.
      5.  **Discard/Lower:** Modernization (Q5) and Coercion Redundancy (Q3).

      *Wait, let's re-evaluate Q1.* Measurement is foundational. If the concept is invalid, the rest doesn't matter. But it's methodologically a nightmare. Maybe rank it high for *theoretical* importance but warn about feasibility. Actually, for a PhD, *feasibility* is king. I will rank the "Attribution" question highest because it offers the cleanest identification strategy for a dissertation.

      *Let's adjust the ranking for a 3-year PhD:*
      1.  **Attribution (New):** Causal identification is possible.
      2.  **Expectations (Q2):** Data available, theory strong.
      3.  **Measurement (Q1):** Doable with proxies (Night lights), high stakes.
      4.  **Institutional Type (Q4 modified):** Cross-national instead of case study.
      5.  **Coercion (Q3):** Too hard to disentangle.
      6.  **Modernization (Q5):** Too long-term.

      *Wait, I need to address the "No Mandarin" constraint heavily.* This kills deep China archival work. I must steer them toward cross-national authoritarian data or English-language proxies.

      *Okay, let's write.*
answer: |-
  Let's begin with the blunt truth you asked for, before we get to the agenda.

  **The Conceptual Diagnosis**
  "Performance legitimacy" is one of the most overworked concepts in comparative politics. It is often used as a theoretical solvent to dissolve the distinction between *legitimacy* (a normative belief in the right to rule) and *support* (satisfaction with outputs). As a theorist, I worry that much of the empirical literature measures "satisfaction with the economy" and labels it "legitimacy." If citizens support the regime only because the economy is good, that is a transactional exchange, not legitimacy in the Weberian or Beethamian sense. If the economy turns, support vanishes. That makes the regime fragile, not legitimate.

  Your constraint—**no Mandarin**—is the defining feature of your dissertation design. It precludes deep archival work in Chinese provincial records, local ethnography, or nuanced discourse analysis of party documents. You cannot compete with the Sinologists on their turf. You must compete on **theory and research design**. You need questions where the *logic* does the heavy lifting, and the data is either cross-national, observational, or available in English (e.g., diplomatic cables, international organization reports, satellite data).

  Here is the brainstorming of open questions, including your five plus three I believe are missing, followed by the prioritized agenda.

  ### Brainstorming the Open Questions

  **Your Candidates:**
  1.  **Measurement Circularity:** Can we test the claim if the regime controls the data and the speech?
  2.  **Delivering What?:** Is it growth, or is it expectation management/reference dependence?
  3.  **Redundancy:** Is it just coercion/apathy disguised as legitimacy?
  4.  **Institutional Contrast (Sing vs. China):** Does rule-of-law vs. discretionary performance change the *type* of legitimacy?
  5.  **Self-Undermining:** Does performance create the social forces (middle class) that destroy authoritarianism?

  **My Additions:**
  6.  **The Attribution Problem:** When things go well, do citizens credit the *regime* or *external luck* (e.g., global commodity prices, post-war recovery)? Performance only buys legitimacy if the regime gets credit.
  7.  **Distributional Performance:** Does aggregate growth matter, or does legitimacy depend on *who* benefits? (Inequality as a mediator).
  8.  **The Crisis Narrative:** How do regimes maintain legitimacy claims *after* performance fails? (Shift from "we delivered growth" to "we protected you from chaos").

  ---

  ### The Prioritized Research Agenda

  I have ranked these based on three criteria: **Theoretical Leverage** (does it advance the concept?), **Identification** (can you causally identify the mechanism?), and **Feasibility** (can you do this in 3 years without Mandarin?).

  #### 1. The Attribution Problem (New Question #6)
  **Rank:** **First**
  **Why:** This is the most "dissertation-ready" question. It solves the endogeneity problem that plagues the rest of the field.
  **The Logic:** Most studies regress support on GDP. But GDP is endogenous to policy. A better test is exogenous shocks. If a country is a net oil importer, an oil price drop helps the economy. If citizens increase support for the regime when the economy improves due to *global* prices (which the regime didn't cause), they are engaging in a "rational ignorance" or "retrospective voting" heuristic that benefits the autocrat. If they *don't* increase support, performance legitimacy is weaker than we think.
  **Feasibility:** High. You can use cross-national data (V-Dem, WVS, Asian Barometer) merged with commodity price shocks or global economic trends. No language skills needed.
  **Evidence Needed:** Interaction models between exogenous economic shocks and regime support surveys.
  **Verdict:** **Do this.** It allows for clean quantitative identification, addresses a major theoretical gap (attribution), and bypasses the language barrier.

  #### 2. Expectations and Reference Points (Refining Your Q2)
  **Rank:** **Second**
  **Why:** It moves the field from "GDP = Legitimacy" to "Psychology = Legitimacy."
  **The Logic:** As you noted, a slowdown doesn't always trigger unrest. This question posits that legitimacy is tied to *reference dependence* (prospect theory). A regime that lowers expectations (e.g., "We are entering a 'New Normal' of slower growth") can maintain legitimacy even with lower performance.
  **Feasibility:** Medium-High. You need survey data that asks about *expectations* (e.g., "Will your life be better in 5 years?") not just retrospective evaluations. Asian Barometer has some of this. You can also use text analysis of English-translated state media (People's Daily translations exist) to code "expectation management" rhetoric and match it to survey waves.
  **Evidence Needed:** Time-series cross-sectional data linking state rhetoric on growth targets to shifts in public satisfaction, controlling for actual growth.
  **Verdict:** **Strong contender.** It saves the concept of performance legitimacy from being falsified by every recession. It requires sophisticated quant work but no field access.

  #### 3. The Measurement/Validity Check (Refining Your Q1)
  **Rank:** **Third**
  **Why:** It is the most upstream conceptual problem, but methodologically dangerous for a PhD.
  **The Logic:** If we can't trust GDP or surveys, what can we trust?
  **Feasibility:** Medium. You cannot fix preference falsification entirely. However, you can use **proxy measures**.
  *   *Performance:* Use satellite night-light data (Henderson et al.) instead of official GDP.
  *   *Support:* Use "revealed preference" data (e.g., emigration applications, capital flight) or indirect survey questions (list experiments), though the latter is hard without running your own survey.
  *   *Alternative:* Use US/UK diplomatic cables (Wikileaks) as an external auditor of regime stability vs. reported stats.
  **Evidence Needed:** A divergence analysis. When do night lights and official GDP diverge? Does support drop when night lights stagnate, even if official GDP grows?
  **Verdict:** **High risk, high reward.** If you pull this off, it's a job-market paper. If you fail, you're stuck arguing about data quality for three years. Given your constraints, I suggest making this a *chapter* rather than the whole dissertation.

  #### 4. Institutional Mediation (Refining Your Q4)
  **Rank:** **Fourth**
  **Why:** Theoretically rich, but your language constraint makes the "China" half weak.
  **The Logic:** Compare *types* of authoritarianism rather than *countries*. Compare "Institutionalized Autocracies" (single-party, like China/Vietnam/Singapore) vs. "Personalist Autocracies." Do single-party regimes get more legitimacy bang for their economic buck because they can credibly commit to long-term performance?
  **Feasibility:** Medium. You can do this cross-nationally using V-Dem institutional data. However, avoiding the specific China/Singapore case study might feel like you are dodging the literature's core examples.
  **Evidence Needed:** Interaction effects between regime type, economic performance, and survival/support.
  **Verdict:** **Safe but less novel.** This is a standard comparative politics design. It's doable, but it might feel like you are avoiding the hard cases (China) rather than solving them.

  #### 5. The Redundancy Challenge (Your Q3)
  **Rank:** **Fifth**
  **Why:** It is a "zombie" debate.
  **The Logic:** Is it legitimacy or fear?
  **Feasibility:** Low. Measuring "latent fear" vs. "latent approval" is incredibly difficult without survey experiments (which you can't run in China) or ethnography. Most proxies for repression (political prisoners, censorship events) are noisy.
  **Verdict:** **Avoid as a core topic.** You will spend three years trying to disentangle two variables that are empirically collinear in authoritarian settings. Acknowledge coercion as a control variable, but don't make it the puzzle.

  #### 6. Modernization/Self-Undermining (Your Q5)
  **Rank:** **Sixth**
  **Why:** It is a long-term historical question, not a dissertation question.
  **The Logic:** Does growth kill authoritarianism?
  **Feasibility:** Low. The time horizon is decades. You cannot observe the "end" of the process in a 3-year PhD.
  **Verdict:** **Too big.** This is a book project for a senior scholar, not a dissertation.

  ---

  ### Strategic Advice for the "No Mandarin" Constraint

  You are worried that not having Mandarin limits you. In some ways, it liberates you. It forces you to avoid the trap of "area studies particularism" where you get lost in the weeds of Chinese bureaucratic minutiae and lose the theoretical thread.

  **Your Comparative Advantage:**
  1.  **Theoretical Rigor:** Because you cannot go deep on the *context*, you must go deep on the *causal logic*. Your contribution should be to the theory of legitimacy, using China/Singapore as empirical sites, not a contribution to Sinology.
  2.  **Cross-National Leverage:** Use the "Authoritarian Politics" datasets (V-Dem, Autocracies of the World). Test the performance legitimacy hypothesis across 50 autocracies. If it holds there, it likely holds in China. This bypasses the data censorship issue by averaging it out.
  3.  **Third-Party Archives:** You mentioned archival methods. Without Mandarin, look at **US State Department cables, World Bank reports, or IMF assessments**. These are English-language archives that contain external assessments of regime stability and economic performance. They are an "outside view" that bypasses the regime's own propaganda.

  ### The Recommended Dissertation Structure

  If I were advising you, I would structure the dissertation around **Question #1 (Attribution)** and **Question #2 (Expectations)**, with **Question #3 (Measurement)** as a robustness chapter.

  *   **Chapter 1:** The Theory of Attribution. Why performance only matters if credited.
  *   **Chapter 2:** Quantitative test using cross-national authoritarian data + commodity shocks (The Attribution Test).
  *   **Chapter 3:** Case focus (China/Singapore) using English-language data (World Bank, Diplomatic Cables, Night Lights) to test the Expectations mechanism.
  *   **Chapter 4:** The Measurement Robustness. Showing results hold even when using satellite data instead of official GDP.

  **Final Blunt Assessment:**
  Do not try to "solve" the preference falsification problem (Q1) as your main contribution. You will not succeed. Instead, **design around it**. Assume falsification exists and use methods (list experiments, indirect proxies, external data) that are robust to it.

  Do not try to prove "Legitimacy" exists. Prove that **performance claims** function as a stabilizing mechanism regardless of whether the underlying belief is normative or transactional. That is a more defensible social science claim.

  You have three years. Pick the question where the data exists *now*, the identification strategy is clear, and the theoretical payoff challenges the existing consensus. That is the Attribution question. Start there.
