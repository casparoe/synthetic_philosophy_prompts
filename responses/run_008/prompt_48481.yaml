  Based on her track record, your sister-in-law is operating on a version of **Daniel Dennett's "Real Patterns" doctrine** (you were right about the philosopher). Her criterion isn't about physical substance ("stuff"), but about **predictive utility and robustness**.

  Here is the breakdown of her likely verdicts, the rule she's running, the rival rules, and how to test them.

  ### 1. Her Verdicts on the Four New Cases

  1.  **Sherlock Holmes:** **Real (as a cultural abstractum).**
      *   *Why:* She already grants reality to "the" (a linguistic type) and Money (a social construct). Holmes is a stable, public node in a cultural network with defined properties. He isn't a *person*, but he is a *real something* (a character pattern) that supports inference and discussion.
  2.  **The Light on the Counter:** **Real.**
      *   *Why:* This is the critical one. The face in the stain was rejected because it "does no work." The light *does* work (it tells time). The fact that it is private ("never mentioned to a soul") mirrors the face, but the *utility* mirrors the spam filter. Utility trumps privacy.
  3.  **Sun Signs (Zodiac):** **Not Real.**
      *   *Why:* Despite high intersubjective agreement ("half the planet projects it"), it fails the "cash value" test. It "predicts basically nothing." For her, a pattern that doesn't latch onto reality successfully is just noise, regardless of how many people believe in it.
  4.  **ML Weather Pattern:** **Real.**
      *   *Why:* This is the spam filter case scaled up. The spam filter's "belief" is real because it successfully sorts mail. The ML pattern successfully forecasts weather. Human intelligibility ("no human can state or picture" it) is irrelevant; the system's predictive success makes the pattern real.

  ### 2. The Rule She Is Actually Running

  **The Instrumentalist/Real Patterns Rule:**
  > *$X$ is real if and only if $X$ constitutes a pattern that affords successful prediction, compression, or intervention within a system, regardless of whether $X$ is concrete, abstract, public, or intelligible.*

  Key components:
  *   **Function:** It must "do work" (predict, explain, enable action).
  *   **Robustness:** It must hold up under use (unlike the face in the stain).
  *   **Ontological Flexibility:** It can be physical (CoG), abstract ("the"), institutional (Money), or computational (Spam).

  ### 3. Rival Rules That Fit Her Old Record

  Two other rules fit her past "Yes/No" list perfectly but diverge on your new cases:

  *   **Rival A: The Intersubjectivity Rule.**
      *   *Definition:* $X$ is real iff multiple independent observers can verify $X$.
      *   *Fits Old Data:* Money, "the", Equator, Chess, Spam (engineers agree), CoG (physicists agree) are all public. The Face is private, so it's Not Real.
      *   *Diverges On:* **The Light on the Counter.** (Private but useful).
  *   **Rival B: The Human Intelligibility Rule.**
      *   *Definition:* $X$ is real iff a human mind can comprehend/state the pattern.
      *   *Fits Old Data:* Money, "the", Equator, Chess, Face, Spam (we know what spam is) are all human-graspable.
      *   *Diverges On:* **The ML Weather Pattern.** (Useful but opaque).

  *(Note: A "Physicalism" rule is already dead because she calls "the" and the Equator real.)*

  ### 4. The Best Case to Distinguish the Rules

  **The Light on the Kitchen Counter.**

  This is the decisive test because it isolates the **Privacy** variable from the **Utility** variable.
  *   In the **Face** case, Privacy and Uselessness were confounded (It was private *and* useless). We didn't know which one drove the "Not Real" verdict.
  *   In the **Light** case, you keep the Privacy (only she sees it) but fix the Uselessness (it works as a clock).

  *   **If she says "Real":** She is running the **Instrumentalist Rule** (Utility wins). Privacy doesn't matter.
  *   **If she says "Not Real":** She is running the **Intersubjectivity Rule** (Consensus wins). It doesn't matter if it works; if others can't check it, it's not real.

  ### 5. The Tie-Breaker Case

  If her verdict on the Light is ambiguous (e.g., *"Well, it's real for you, but not Real real"*), you need to test whether **Robustness/Compression** matters more than **Raw Prediction**. Dennett's view requires that a real pattern offer *compression* (a simple rule explaining complex data), not just a lucky lookup table.

  **The Tie-Breaker:**
  > "Imagine a book that lists the exact outcome of every coin flip for the next year. It is 100% accurate. But there is no formula, just a list. Is the book's content *real*?"

  *   **If she says "Real":** She is a crude **Predictionist** (If it works, it's real).
  *   **If she says "Not Real":** She is a true **Real Patterns** theorist (It must be a *pattern*, i.e., compressible information, not just a random list of facts). A list offers no explanatory power, only data storage.

  **Summary for the Holiday:**
  Press her on the **Light**. If she grants it reality despite its privacy, she's a functionalist. If she denies it, she's a verificationist. If she waffles, hit her with the **Book of Coin Flips**.
