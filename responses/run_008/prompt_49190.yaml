answer: |-
  Your friend is pressing a classic problem in social choice theory known as the **Discursive Dilemma** (or the Doctrinal Paradox). The tension you feel is real: it arises because you are intuitively switching between two different goals of collective decision-making: **epistemic correctness** (getting the right answer based on reasons) and **procedural legitimacy** (respecting the equal voice of the members).

  There *is* a principle that captures three of your four verdicts and provides a clear answer for the tenure case, but your friend is partially right: it cannot accommodate all four of your intuitions without modification. Specifically, one of your verdicts conflicts with a core commitment you stated in your prompt.

  ### The Principle: The Principle of Normative Bindingness

  The unifying principle is this: **The method of aggregation must match the source of the decision's validity.**

  *   **Rule-Bound Contexts (Premise-Based):** When a decision is valid *only if* it can be logically derived from accepted premises (because the premises *are* the law, the criteria, or the constraint), the group must aggregate on the **premises**. The integrity of the reasoning is the primary good.
  *   **Discretionary Contexts (Conclusion-Based):** When a decision is valid based on the overall judgment of the members, and the premises are merely advisory heuristics, the group may aggregate on the **conclusion**. The acceptability of the outcome is the primary good.
  *   **Constraint Contexts (Consistency-Based):** When a set of premise-majorities creates a logical impossibility with a higher-order rule, the **constraint** trumps the premises to preserve systemic validity.

  ### How the Principle Maps Your Cases

  **1. The Three-Judge Court (Rule-Bound)**
  *   **Verdict:** Premise-Based (Find for Plaintiff).
  *   **Why:** In law, the *reasoning* constitutes the ruling. A judgment that contradicts the accepted legal premises (even if supported by a headcount on the verdict) is legally incoherent. The validity of the decision is bound to the logical application of the premises.
  *   **Fits Principle:** Yes.

  **2. The Hiring Committee (Discretionary)**
  *   **Verdict:** Conclusion-Based (Overall Recommendation).
  *   **Why:** Hiring is holistic. Scores on research or teaching are proxies, not binding logical premises. A candidate might have low research scores but be a "genius hire" for other reasons. The validity of the hire depends on the committee's overall will, not a formula.
  *   **Fits Principle:** Yes.

  **3. The Legislative Budget (Constraint)**
  *   **Verdict:** Constraint-Overriding (No Deficit).
  *   **Why:** The Constitution is a higher-order premise. A set of line-item votes that violates it is logically invalid. To maintain the validity of the budget (a coherent plan), the constraint must override the inconsistent majority preferences.
  *   **Fits Principle:** Yes.

  **4. The Weighted Chair (The Conflict)**
  *   **Verdict:** Weighted Premise-Based.
  *   **Why:** Here is where your intuitions collide. You said: *"I also think collective judgments should track the group's reasons rather than anyone's authority."*
  *   **The Conflict:** If the Court's validity comes from the *group's* application of the law (Case 1), giving the Chair double weight undermines the "group" nature of the reasoning. It shifts the source of validity from **Collective Reason** to **Epistemic Authority**.
  *   **Fits Principle?** Only if you prioritize *Truth* over *Collective Reasoning*. If the goal is "Correct Legal Outcome," the Chair's expertise helps. If the goal is "Legitimate Collective Judgment," the Chair's weight harms it. You cannot hold both that "groups should track group reasons" (your stated value) and "the Chair should count double" (your gut verdict) without contradiction.

  ### The Tenure Case

  **The Scenario:** A faculty committee votes on research, teaching, and service. The final decision must be defensible in writing *as following from those votes*.

  **The Application:**
  The requirement to "defend in writing as following from those votes" explicitly transforms this from a **Discretionary Context** (like Hiring) into a **Rule-Bound Context** (like the Court). You have artificially imposed a logical constraint on the decision: *Verdict = Function(Premises).*

  **The Verdict:**
  You must use **Premise-Based Aggregation**.
  If the majority votes "Yes" on Research, "Yes" on Teaching, and "Yes" on Service, but the committee votes "No" on Tenure, they cannot write the defense required. They would be lying about the decision following from the votes. To satisfy the constraint of public justification, the outcome must be determined by the aggregation of the criteria votes (unless there is a pre-agreed rule that one criterion is a veto, which would then become a constraint like the Budget case).

  ### The Honest Sacrifice

  Your friend is right that one intuition must go. Based on the **Principle of Normative Bindingness** and your own stated commitment to "group reasons," **Case 3 (The Weighted Chair) is the one you must sacrifice.**

  Here is why:
  1.  **Cases 1, 2, and 4** are distinguished by the *nature of the task* (Law vs. Preference vs. Constraint). This is a stable, principled distinction.
  2.  **Case 3** conflicts with your explicit philosophical commitment. If you believe collective judgments should track the *group's* reasons, you cannot accept a procedure that structurally privileges one member's reasoning over the others, even if that member is an expert. To accept Case 3, you must abandon the idea that the *collective* reasoning matters, and instead admit that only the *correct* reasoning matters.

  **Recommendation:**
  Keep your verdicts on the Court (1), Hiring (2), and Budget (4). They form a coherent system based on whether the group is bound by reasons or free to choose. Apply that same system to Tenure: because the written defense binds you to the reasons, you must vote on the premises.

  But regarding the Weighted Chair (3): You must choose. Either the Court is a **democratic body** (in which case the Chair gets one vote, preserving the "group reasons" ideal), or it is an **epistemic tribunal** (in which case the Chair gets more weight, but you must admit you value accuracy over collective agency). You cannot have it both ways. Given your strong reaction to Case 1 ("deciding... by majority on the conclusion alone feels like it gets the law wrong"), your priority seems to be the **integrity of the law**, not necessarily the equality of the judges. If so, Case 3 *might* be saved, but only by rephrasing your commitment: *"Collective judgments should track the truth of the reasons, even if that requires weighting expertise."*

  If you are unwilling to make that rephrasing, Case 3 is the casualty.
