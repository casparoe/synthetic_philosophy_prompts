  I arrive at this number not by intuition, but by decomposing the proposition into five necessary conditions. For the hole argument to be *decisive* against *any* substantivalism, each of the following terms must hold. I have assigned a probability to each term representing the likelihood that it obtains in a way that supports the anti-substantivalist conclusion.

  ### Decomposition of Credence

  **1. The Normativity of Leibniz Equivalence (LE)**
  *   **Probability:** 0.90
  *   **Justification:** It is highly probable that LE (diffeomorphic models represent the same physical state) is a mandatory constraint on interpretation, grounded in the objectivity of the theory's own gauge resources rather than mere empiricist scruples; to deny it is to posit unobservable structure that plays no dynamical role.

  **2. The Haecceitist Burden**
  *   **Probability:** 0.30
  *   **Justification:** It is unlikely that substantivalism *must* commit to objectionable haecceitism (primitive thisness of points), because the sophisticated substantivalist can plausibly argue that points are individuated by their relational properties without ceasing to be ontological constituents.

  **3. The Collapse of Sophisticated Substantivalism (SS)**
  *   **Probability:** 0.50
  *   **Justification:** It is an open question whether SS is a genuine third way or a capitulation to structural realism; I assign 0.5 because while SS is logically coherent, it struggles to articulate an ontological difference between "points bearing structure" and "structure simpliciter" without smuggling in primitive identity.

  **4. The Fatality of Determinism Loss**
  *   **Probability:** 0.20
  *   **Justification:** It is unlikely that the loss of determinism is a fatal metaphysical flaw rather than a dramatization of representational redundancy, as modern consensus treats the indeterminism as a gauge artifact rather than a physical possibility.

  **5. Ontological vs. Formal Import**
  *   **Probability:** 0.70
  *   **Justification:** It is moderately probable that the argument targets spacetime ontology specifically, though the fact that it reconstructs in Newtonian gravitation suggests it may be a general lesson about gauge formulations, which dilutes its force as a specific argument against spacetime substance.

  ### Combination Logic

  To calculate the final credence, I treat the proposition as a conjunction of the strongest paths to the anti-substantivalist conclusion. The argument succeeds if LE is mandatory (Term 1) AND the argument has ontological import (Term 5) AND the substantivalist has no viable escape.

  The "Viable Escape" is primarily Sophisticated Substantivalism. If SS survives (Term 3 is false), the proposition fails. Therefore, the probability of the proposition is bounded by the probability that SS fails. The Determinism (Term 4) and Haecceitism (Term 2) horns are alternative routes to the same conclusion; if either is fatal to substantivalism, the argument works.

