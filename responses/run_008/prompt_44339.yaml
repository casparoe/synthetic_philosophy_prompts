  $$P(\text{Prop}) = P(T1) \times P(T5) \times [1 - (P(\text{SS Survives}) \times (1 - P(T2)) \times (1 - P(T4)))]$$

  Where $P(\text{SS Survives}) = 1 - P(T3) = 0.5$.
  The term in the brackets represents the probability that *all* escape routes are closed.
