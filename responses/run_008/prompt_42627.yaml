answer: |-
  **Objection Sheet: Futarchy Trial Workshop**

  **Audience:** Public Policy Faculty & Doctoral Cohort
  **Context:** Narrow trial proposal (single agency, pre-fixed metric, conditional markets)
  **Tone:** Pragmatic, institutional, avoiding rationalist jargon

  ---

  ### 1. The Legitimacy Deficit (Deliberative Democracy Theorist)
  **Objection:** "You argue that legitimacy derives from the political process scoping the trial, analogous to a Randomised Controlled Trial (RCT). But an RCT assigns subjects randomly; it does not outsource the *decision rule* to a financial mechanism. In a democracy, a binding decision requires public justification—reasons that citizens can accept. A market price is not a reason; it is an aggregation of private incentives. If you bind the agency to the market spread, you are replacing public reason with opaque price signals. How do you justify this to the citizens bound by the decision?"

  **Reply:** "The market does not provide the *justification*; the pre-committed decision rule does. We are not saying 'the market is wise'; we are saying 'we have agreed to use this information-gathering tool to reduce uncertainty,' much as we agree to use cost-benefit analysis or environmental impact assessments. The legitimacy lies in the transparency of the protocol: the metric, the horizon, and the conversion rule are all subject to standard democratic scrutiny *before* trading opens. The market is merely the counter, not the judge."

  **Soft Spot:** This relies on the audience accepting that 'procedure' equals 'legitimacy'. If they view the market mechanism itself as inherently corrosive to democratic deliberation (by crowding out normative debate), the procedural defence will not satisfy them.

  ### 2. Metric Gaming and Perverse Incentives (Statistician)
  **Objection:** "Goodhart's Law states that when a measure becomes a target, it ceases to be a good measure. In your scheme, you are not just measuring the metric; you are attaching substantial financial payouts to it. This creates a powerful incentive for the agency implementing the policy—and the traders betting on it—to collaborate in gaming the metric rather than achieving the underlying welfare goal. You are effectively subsidising the optimization of a proxy, not the outcome."

  **Reply:** "This is a risk inherent in *any* performance-based management, which is the current status quo. Futarchy does not introduce the incentive to game; it introduces a counter-incentive: the bounty for evidence of manipulation. Furthermore, because the metric is fixed *ex ante* by a separate political process, the agency cannot change the goalposts mid-stream. The market actually *penalises* gaming if the manipulation is detectable before the horizon closes, as traders will short the inflated metric."

  **Soft Spot:** The 'bounty' relies on manipulation being detectable. Sophisticated gaming (e.g., shifting costs off-budget or to the future) may not be visible within the five-year horizon. You have no defence against 'legal' gaming that satisfies the letter of the metric but violates its spirit.

  ### 3. The Principal-Agent Problem in Design (Public-Choice Economist)
  **Objection:** "I agree markets can aggregate information, but you have mis-specified the incentives of the *designers*. Who chooses the metric? Who sets the position limits? Who adjudicates the manipulation bounties? You are assuming a benevolent social planner sets the rules. In reality, the actors setting up this market will choose a metric and ruleset that favours their preferred policy outcome before a single share is traded. They are rigging the scoreboard to ensure the market 'discovers' the price they wanted all along."

  **Reply:** "That is precisely why the proposal insists the metric and horizon are fixed by the *ordinary political process*, not the market designers. The market operators are contractually blinded to the policy preferences of the agency. Moreover, by publishing the rulebook openly before capital is committed, we allow external watchdogs—including your own department—to audit the rules for bias. The market structure actually makes the rigging more visible than in closed-door committee votes."

  **Soft Spot:** This is the strongest objection from your ally. Your reply assumes the 'ordinary political process' is capable of fixing a neutral metric. If the political process is itself captured, the market merely launder that capture through a veneer of objectivity.

  ### 4. Noise Trading in Thin Markets (Behavioural Economist A)
  **Objection:** "Your trial involves a single agency and a specific policy choice. This is not a liquid asset like a currency or a stock index. It is a thin, bespoke market. In such environments, we know from experimental finance that prices are driven by noise traders, sentiment, and herd behaviour, not fundamental information. You will not get a 'wisdom of crowds' signal; you will get a volatility spike driven by the first few deep-pocketed entrants."

  **Reply:** "We acknowledge the liquidity risk. That is why the design includes subsidized market-makers and position limits to prevent dominance by a single actor. We are not looking for a precise price; we are looking for a *spread* between Option A and Option B. Even noisy markets often directionally correct better than expert committees. We treat the price as a noisy signal, not a gospel truth, and the decision rule can incorporate a confidence threshold—if the spread is within the noise margin, the default status quo prevails."

  **Soft Spot:** If the noise is correlated (e.g., ideological bias across all traders), the spread will be systematically biased, not just noisy. Your confidence threshold might simply result in paralysis.

  ### 5. The Manipulation Bounty Feasibility (Behavioural Economist B)
  **Objection:** "You propose a standing bounty for evidence of manipulation. This assumes manipulation is observable and provable. But the most effective manipulation—spreading disinformation or trading on non-public information—is notoriously difficult to prove in court or arbitration. You are creating a system where bad actors can profit from distortion, and the 'bounty' mechanism will be too slow or too legally cumbersome to claw back the losses before the policy is enacted."

  **Reply:** "We are not relying on criminal prosecution. The bounty is administrative. If a trader can demonstrate that another trader possessed non-public information or engaged in wash-trading, the exchange clears the position and awards the bond. We are building this into the exchange's terms of service, not the penal code. It is a civil matter of contract violation, which is much faster to adjudicate."

  **Soft Spot:** This shifts the problem to the adjudicator of the bounty. Who decides what counts as 'non-public information' in a policy context? This creates a new locus of corruption.

  ### 6. Temporal Mismatch (Statistician / Public Choice)
  **Objection:** "You have set a five-year horizon. Many policy failures—particularly in infrastructure or education—only manifest after ten or fifteen years. Traders will discount the long-term tail risks heavily. You will select policies that look good at year five but collapse at year ten. You are incentivizing short-termism."

  **Reply:** "This is a limitation of any fixed-term evaluation, including current budget cycles. However, prediction markets allow for *conditional* contracts. We can structure payouts that vest at year five but are clawed back if specific leading indicators of long-term failure emerge. Additionally, the trial is narrow; we are testing whether this mechanism improves on the *current* five-year political horizon, which currently has *no* financial accountability at all."

  **Soft Spot:** Claw-backs are legally difficult and discourage participation. Traders may simply avoid the market if they fear liability beyond the horizon.

  ### 7. Implementation Fidelity (Doctoral Student / Statistician)
  **Objection:** "The market prices the *policy*, but the agency implements the *programme*. If the market predicts Policy A will work, but the agency implements it poorly, the metric fails. The traders lose money, not because their prediction was wrong, but because the execution was botched. This decouples the signal from the reality, teaching traders to bet on agency competence rather than policy efficacy."

  **Reply:** "We mitigate this by defining the metric on *outcomes*, not *outputs*, and by ensuring the agency is legally bound to implement the winning policy with best effort. If the agency sabotages the implementation, that is a separate governance failure. The market at least reveals that the policy *could* have worked, providing data for future trials, whereas the current system obscures whether failure was due to policy or execution."

  **Soft Spot:** In practice, it is almost impossible to disentangle policy failure from execution failure. This noise could render the market signal useless for learning.

  ### 8. The Precedent Risk (Deliberative Theorist)
  **Objection:** "Even as a trial, this normalizes the idea that financial markets should have a say in governance. If this trial runs, even unsuccessfully, it creates a rhetorical tool for those who wish to expand futarchy beyond its safeguards. You are opening a door that cannot be closed."

  **Reply:** "We normalize evidence-based policy every day. This is simply a more rigorous form of evidence generation. We do not ban clinical trials in medicine for fear that pharmaceutical companies might later misuse the concept of 'testing'. We regulate the trial. We should do the same here."

  **Soft Spot:** The analogy to medicine is imperfect. Medical trials test biological facts; policy trials test social values. The normative leap is larger than you admit.

  ---

  ### Strategic Advice

  **Concessions to Make Up Front:**
  1.  **Concede on Goodhart's Law:** Admit freely that *any* metric will be gamed. Do not claim futarchy solves this. Claim only that it makes the gaming *more expensive* and *more visible* than the current system of lobbying and committee bargaining.
  2.  **Concede on Liquidity:** Acknowledge that for very niche policies, the market may be too thin to yield a signal. State that the trial includes a 'liquidity kill-switch'—if trading volume doesn't meet a threshold, the market is voided.

  **The Single Reply That Must Land:**
  You must land the **RCT Analogy** (Reply to Objection 1).
  If the Deliberative Theorist convinces the room that using a market price is *inherently* undemocratic, the proposal dies on principle. You must successfully frame the market not as a *voting mechanism*, but as an *informational technology*—no different than a survey or a cost-benefit model, merely one with better incentive compatibility. If the room accepts it as a 'measurement tool' rather than a 'decision maker', you survive.

  **The Objection from the Ally (Public-Choice Economist):**
  Be prepared for Objection 3 to be the most detailed. This person understands your model best and sees the institutional weak points. They will not attack the market; they will attack the *governance of the market*. Do not get drawn into defending the market's efficiency; defend the *transparency of the rule-setting*.

  **The Question You Hope Nobody Asks:**
  *"If the market price decisively favours Policy A, but the political leadership strongly prefers Policy B, do you actually bind them to follow the market? If yes, is that not technocratic tyranny? If no, why are we spending public money on a market that can be ignored?"*

  **Why this is fatal:**
  *   If you say **Yes** (Binding): You confirm the Deliberative Theorist's fear that you are bypassing democratic accountability.
  *   If you say **No** (Advisory): You confirm the Behavioural Economists' fear that the market is just expensive opinion polling, and the Public-Choice economist's fear that the signal will be ignored whenever it is inconvenient.
  *   **Preparation:** You must thread the needle: "The trial is binding *for the duration of the trial* to ensure data integrity. If we allow overrides, we cannot measure the mechanism's efficacy. However, the *decision to run the trial* and the *selection of the metric* remain fully democratic."
