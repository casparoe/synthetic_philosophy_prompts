answer: |-
  The fire had burned down to a bed of sullen, glowing coals. Outside, the wind was still hammering the eaves, a relentless, muffled roar that made the silence inside the cabin feel heavy.

  Alan poked a log with the iron grate. Sparks spiraled up the chimney.

  "It's a category error, Sarah. That's all it is. You're reifying a shadow."

  Sarah didn't look up from her book, though she hadn't turned a page in twenty minutes. She sat in the wingback chair, knees pulled up, a tumbler of bourbon balanced on the armrest. "A shadow that casts other shadows? A shadow that can reach out and move the objects blocking the light?"

  "A shadow that *looks* like it moves objects." Alan dropped the poker. It clanged against the stone hearth. "In your little Careenium, you've got the simmballs—the big ones—and the sea of little ones. When the little ones cluster, you call it a symbol. You say the symbol *pushes* the simmball. But who is pushing whom? It's the little balls hitting the big one. Always. It's conservation of momentum. There is no budget left for the 'symbol' to spend."

  "You're confusing substrate with cause," Sarah said. She finally looked at him. Her eyes were tired, red-rimmed. "If I write a check, what causes the money to move? The ink on the paper? The cellulose fibers?"

  "The banking system," Alan said immediately. "A set of physical rules and human agreements."

  "Exactly. A higher-level structure. You can't find the 'payment' in the ink. But if you deny the payment is real because it's just ink, try buying a house with a blank sheet."

  "That's human convention. Social ontology. I'm talking about physics. I'm talking about a closed system of colliding spheres." Alan leaned forward, elbows on knees. "In your system, the little balls are swapping in and out of the 'symbol' cluster every microsecond. So the symbol isn't a thing. It's a process. And even then, it's just a summary. Saying 'the cluster pushed the simmball' is just shorthand for 'a statistically improbable number of micro-collisions occurred in this vector.' You're treating the summary like it's the mechanic."

  "So?" Sarah took a sip. "If the summary is reliable, if it's predictive, if it has boundaries that hold... in what meaningful sense is it *not* real? You sound like a man who thinks a whirlpool isn't real because it's just water."

  "A whirlpool doesn't have agency. It doesn't 'want' to stay a whirlpool."

  "The pattern does," she snapped. "That's the whole point of the Careenium. Stable patterns persist. Unstable ones dissipate. The patterns that are good at marshaling the little balls to maintain their own structure survive. That is a form of selection. That is causal work. The pattern constrains the behavior of the constituent balls. If a ball tries to leave the cluster, the pressure of the surrounding pattern—other balls, the geometry of the constraint—pushes it back in. The whole constrains the part."

  "Downward causation," Alan scoffed. He stood up and walked to the sideboard to pour more whiskey. His shoulder popped. "It's magic. You're saying the arrangement of the bricks decides where the mortar goes. But the mortar holds the bricks. The micro-dynamics determine the macro-state. Always. The macro-state is just... exhaust."

  "Exhaust doesn't steer the car."

  "Metaphors," Alan muttered, returning to his chair. "You philosophers live on metaphors. I live on equations. Show me the term in the Hamiltonian for 'symbol.' Show me the force carrier for 'meaning.'"

  "You can't derive the rules of chess from the physics of the wood the pieces are carved from, Alan."

  "I can derive the motion of the pieces."

  "But not the *game*," Sarah said, her voice dropping, sharper now. "If you only track the microstates, you lose the information. You lose the *why*. Why did the knight move to F3? Not because of the friction of the wood. Because of the threat to the king. The threat is real. It causes physical movement."

  "The threat is in the player's head. In the Careenium, there is no head. There is just the table."

  "There is the system itself acting as its own observer," Sarah insisted. "The patterns interact. Pattern A triggers Pattern B. If Pattern A didn't exist as a distinct causal unit, Pattern B wouldn't trigger. You're saying Pattern B was triggered by a million random collisions. I'm saying the collisions were organized *by* Pattern A."

  "Organized by who? By what force?" Alan rubbed his face. "It's causal overdetermination. If the little balls did the work, the symbol didn't need to. If the symbol did the work, the little balls didn't matter. You can't have both."

  "Why not? It's not 'either/or.' It's 'by means of.'" Sarah shifted, wincing as her leg cramped. She stretched it out. "Look, I grant you the energy comes from the bottom up. The kinetic energy is in the balls. Fine. But the *information*, the direction, the constraint... that flows from the pattern. The pattern is the channel. Without the channel, the water just spreads. With the channel, it cuts a canyon. Is the canyon cutter the water or the channel?"

  "The water," Alan said. "The channel is just where the water already went."

  "The channel *keeps* the water going." Sarah set her glass down hard. "You're terrified of it. Admit it. If the symbols are real, if they have causal power, then physics isn't the only game in town. You lose the monopoly on truth."

  Alan laughed, a dry, barking sound. "I don't care about truth monopolies. I care about not lying to myself. If I say 'the symbol pushed the ball,' I am lying. The symbol is a ghost. It's a pattern we impose on the noise because our brains are too slow to track the noise."

  "Our brains are part of the universe too," Sarah said softly. "If our brains are Careeniums—and you agree they're made of neurons firing like little balls—then when we perceive a symbol, that's the system recognizing itself. If the symbol wasn't real, the recognition wouldn't happen. We wouldn't be having this argument. We'd just be vibrating."

  "We are vibrating."

  "We're *meaning*."

  Alan stared into the fire. A log collapsed, sending up a fresh flare of orange light that illuminated the deep lines around his mouth. He was quiet for a long time. The wind howled, rattling the windowpane.

  "Suppose," Alan said, his voice lower, rougher. "Suppose I grant you... predictive utility. I grant that tracking the symbols is the only way to guess where the system goes next. Because the math is too hard. Does that make the symbol *ontologically* real? Or just epistemologically necessary?"

  "Does it matter?" Sarah asked. "If you can't predict the storm without the barometer, is the pressure real? Or is it just a number on a dial?"

  "The pressure is a physical state."

  "The 'symbol' is a physical state of the system. A distributed state." She leaned forward, mirroring him. "You keep saying the little balls are the only reality. But a single ball has no memory. No history. The pattern has history. The pattern carries the past into the future. That persistence... that's the closest thing to 'self' we have. If you strip that away, you don't have physics. You have billiards."

  Alan picked up his glass. He swirled the amber liquid, watching the vortex form and dissolve. A tiny, temporary whirlpool.

  "The problem," Alan said, not looking up, "is that if the pattern is the thing, then the individual balls don't matter. Swap them all out. It's the same symbol. So the matter is irrelevant. That smells like dualism. It smells like you're trying to sneak a soul into the machinery."

  "And you're trying to reduce love to electrochemistry," Sarah shot back. "Just because you can describe the substrate doesn't mean you've described the phenomenon."

  "I haven't said love isn't real. I've said your simmballs are a category mistake." Alan took a drink. He winced as the whiskey hit. "But... I will concede. Tracking the microstates. In a system that complex. It's not just hard. It's computationally irreversible. You can't run it back."

  "Because the information is in the correlations," Sarah said. "In the pattern."

  "In the correlations," Alan repeated. He looked at her, and for a second, the combativeness drained out of his face, leaving just an old man tired of the cold. "So you're saying the reality is in the relationship, not the relata."

  "I'm saying the relationship *constrains* the relata."

  Alan grunted. He looked back at the fire. "It's still ghosts. But... useful ghosts."

  "And you," Sarah said, settling back into her chair, pulling her blanket up higher. "You still think the balls are the only truth. But you know you can't find the story in the collision."

  "No," Alan said. "You can't find the story in the collision."

  He reached for the poker again, but didn't use it. Just held the iron shaft, feeling the heat radiating up from the coals.

  "Pass the bottle," he said.

  Sarah slid it across the table. It stopped right in the center, between them. Neither of them reached for it immediately. They just watched the fire burn down, listening to the wind, knowing the snow would be deep in the morning, and the road would still be closed, and the argument would be waiting for them when they woke up.
