          *   *Critique:* This looks like standard international trade deals with ethical clauses. Is it moral trade? The WC isn't necessarily making a *moral* sacrifice; they might benefit economically from exports. The DC might view animal welfare as imperialist. If framed as "We value animals more than you value this specific economic margin," it works.
