          *   *Distinctive Work:* This is the *purest* form of Bostrom/Ord's original idea. It's not about self-interest; it's about maximizing *expected moral value* under uncertainty. There is no self-interest to fall back on. It is purely moral weighting.
          *   *Critique:* It's intrapersonal. The prompt asks for "parties." But Bostrom/Ord explicitly discuss this as the paradigm case (the "Parliamentary Model").
