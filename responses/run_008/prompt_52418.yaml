answer: |-
  The concept you are describing has a name, and it is one of the most significant contributions to the philosophy of psychiatry and social science in the last forty years. The term you are looking for is **"The Looping Effect"** (sometimes called **"Interactive Kinds"**), developed primarily by the philosopher of science **Ian Hacking**.

  Hacking articulated this most famously in his essay *"Making Up People"* (1986) and his book *The Social Construction of What?* (1999).

  Here is a breakdown of the concept, how it differs from the ideas you already know, where it applies, and where it stops.

  ### 1. The Core Concept: Looping Effects and Interactive Kinds
  Hacking distinguishes between two types of classifications:
  *   **Indifferent Kinds:** Classifications that do not interact with the things classified. If you classify a star as a "Red Giant," the star does not read the classification and change its behavior. The classification tracks a static reality.
  *   **Interactive Kinds:** Classifications of people. When you classify a person (e.g., "autistic," "hyperactive," "refugee"), the classification interacts with the person. The person becomes aware of the label, and that awareness changes their self-concept and behavior.

  **The Loop:**
  1.  **Classification:** Experts create a category (e.g., "Attention Deficit Disorder").
  2.  **Adoption:** People are diagnosed and begin to understand themselves through this category. They may join support groups, read literature, or adopt coping strategies specific to the label.
  3.  **Modification:** As people live into the label, the manifestation of the condition in the population shifts. (e.g., patients might report symptoms differently because they know what "counts" as a symptom).
  4.  **Revision:** Experts observe the shift in the population and update the diagnostic criteria (e.g., DSM-IV to DSM-5).
  5.  **Repeat:** The new criteria select a slightly different group of people, who then adapt to the new criteria.

  This matches your description exactly. It is not a one-way street (like a self-fulfilling prophecy); it is a co-evolution of the knowledge system and the people within it.

  ### 2. How It Differs from "Self-Fulfilling Prophecy"
  You correctly noted that "self-fulfilling prophecy" feels insufficient. Here is the technical distinction:
  *   **Self-Fulfilling Prophecy (Merton):** A *false* belief or prediction leads to behavior that makes the belief *true*. (e.g., "This bank is insolvent" $\rightarrow$ everyone withdraws money $\rightarrow$ bank becomes insolvent). Once the event happens, the loop often terminates or results in a crash.
  *   **Looping Effect (Hacking):** The classification is not necessarily false. Rather, the classification changes the *kind of person* who exists. It creates a new way of being human. The loop is continuous and evolutionary, not just a mechanism of verification. It explains why the *definition* of a disorder changes over decades, not just why a specific patient gets worse.

  ### 3. Does It Apply to Non-Medical Labels?
  **Yes.** Hacking and subsequent sociologists explicitly apply this to non-medical categories. The requirement is not that the label is medical, but that it is **human-kind** and **known to the classified.**

  *   **Criminal Profiles:** The category "juvenile delinquent" changes the behavior of youth labeled as such. They may adopt the aesthetics, social circles, and behaviors associated with the label. Criminologists then observe this new behavior and update their theories on delinquency, which changes policing, which changes the label again.
  *   **Personality Types:** Systems like MBTI or the Enneagram are prime examples. People take a test, get a type (e.g., "INFJ"), and then begin to curate their habits to align with the description of an INFJ. Over time, the cultural understanding of what an INFJ "looks like" shifts, and the test questions or interpretations may be tweaked to match the modern archetype.
  *   **Sexual Identity:** Hacking often cited the category "the homosexual." In the 19th century, this became a specific type of person (a species), rather than just someone who committed specific acts. This classification allowed people to organize politically and socially around the identity, which fundamentally changed the demographics and culture of the group, leading to further revisions in how sexuality is understood scientifically.

  ### 4. Where Does It Stop? (The Boundaries)
  The Looping Effect has specific boundaries. It does not apply everywhere.

  *   **It stops at "Indifferent Kinds":** It does not apply to viruses, tectonic plates, or chemical elements. These things do not have agency or self-awareness. A virus does not mutate *because* it read a paper about its own genetic structure (though it mutates due to selection pressure, that is biological evolution, not sociological looping).
  *   **It stops where awareness is blocked:** If a classification is kept secret from the people classified, looping cannot occur. For example, if a government secretly categorizes a group of citizens as "high risk" for surveillance but never lets them know, they cannot adapt their behavior to the category itself (though they may adapt to the surveillance).
  *   **It varies in intensity:** Some labels "loop" harder than others. A diagnosis of "broken leg" has low looping potential (you don't become a "broken leg person" and change your personality). A diagnosis of "Schizophrenia" or "Borderline Personality Disorder" has high looping potential because it touches on identity, morality, and social interaction.

  ### 5. Adjacent Concepts (and what they lack)
  If you find Hacking's "Looping Effects" too philosophical, there are sociological terms that cover parts of the phenomenon, though they miss the specific feedback mechanism you described.

  **A. Labeling Theory (Becker, Scheff)**
  *   **What it is:** Focuses on how societal reaction to deviance creates a "master status" that pushes the person further into deviance (Secondary Deviance).
  *   **What it lacks:** It is largely unidirectional (Society $\rightarrow$ Individual). It focuses on stigma and social control rather than the *evolution of the diagnostic category itself*. It doesn't fully explain why the *doctors* change the manual, only why the *patient* gets worse.

  **B. Medicalization (Conrad, Zola)**
  *   **What it is:** The process by which non-medical problems (drunkenness, childbirth, sadness) become defined and treated as medical issues.
  *   **What it lacks:** It describes the *expansion* of medicine, but not necessarily the *feedback loop*. It explains how a behavior becomes a diagnosis, but not how the diagnosis subsequently reshapes the behavior and forces the diagnosis to change.

  **C. Performativity (Judith Butler, J.L. Austin)**
  *   **What it is:** The idea that language and discourse bring reality into being (e.g., gender is performed).
  *   **What it lacks:** While very similar, performativity is often focused on identity and linguistics. Hacking's Looping Effect is more institutional; it specifically accounts for the role of **bureaucracies** (hospitals, insurance, DSM committees) in the feedback loop, not just individual identity performance.

  **D. Enactment (Annemarie Mol)**
  *   **What it is:** In Science and Technology Studies (STS), this suggests that reality is "enacted" through practices. A disease is different in the lab than it is in the clinic.
  *   **What it lacks:** This is perhaps the closest rival to Hacking. However, Mol focuses more on how the *object* (the disease) changes across different sites of practice. Hacking focuses more on how the *people* change in response to the knowledge of the classification.

  ### Summary
  The term you want is **Ian Hacking's "Looping Effects" of "Interactive Kinds."**

  *   **It covers:** The bidirectional feedback loop between human classification and human behavior, resulting in the historical evolution of both the people and the categories.
  *   **It applies to:** Any classification of humans that the humans are aware of (psychiatry, criminology, sociology, personality typing).
  *   **It excludes:** Natural sciences (physics, chemistry) and classifications hidden from the subjects.
  *   **Why it fits:** It specifically addresses your observation that the "population carrying the label looks different from the population the label was originally written for." Hacking argues that there is no static "real" version of these conditions waiting to be discovered; the "real" version is moving because we are looking at it.
