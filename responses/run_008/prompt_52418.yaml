      *   **User's Current Understanding:** Knows about "self-fulfilling prophecies" but finds them too one-directional/static.
      *   **Questions:**
          1.  Is there an established concept for this in philosophy/history of psychiatry?
          2.  What exactly does it cover/where does it stop?
