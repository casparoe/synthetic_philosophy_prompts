answer: |-
  You are not being inconsistent. Your roommate is relying on a naive view of knowledge (often called *psychologism* or simple *reliabilism*), which assumes "knowing" is just a mental state of high confidence. Your intuitions, however, align with some of the most sophisticated work in contemporary epistemology (the study of knowledge).

  You have stumbled onto a hybrid of two major philosophical theories: **Contextualism** and **Pragmatic Encroachment**.

  Here is the principle that unifies your verdicts, explains the asymmetries, and predicts the outcome of your court case.

  ### The Principle: Relevant Alternatives & Stakes-Sensitive Justification

  To truthfully say "S knows P," two conditions must be met:
  1.  **Elimination of Relevant Alternatives:** S must have evidence that rules out all error possibilities that are *relevant* in the current context.
  2.  **Stakes-Sensitive Threshold:** The *quality* of evidence required to rule out those alternatives rises as the practical stakes of being wrong increase.

  This explains why "know" feels messy. It isn't a fixed switch; it's a sliding scale that moves based on **what is at risk** and **what possibilities are being talked about.**

  ### How This Principle Explains Your Cases

  **1. Donut (Low Stakes) vs. Cake (High Stakes)**
  *   **The Evidence:** Identical (habitual observation).
  *   **The Shift:** In the Donut case, the possibility that "the shop changed hours yesterday" is not a *relevant alternative*. It's too remote to worry about for a casual breakfast. Your habit is enough evidence.
  *   **The Cake:** Now the stakes are high (Mom's birthday). The possibility that "they might be closed" becomes *relevant*. Because the cost of error is high, your habitual evidence is no longer strong enough to rule out that relevant alternative. You need stronger evidence (a phone call).
  *   **Verdict:** Consistent. Stakes raised the bar for evidence.

  **2. The Lottery (Low Stakes, No Knowledge)**
  *   **The Puzzle:** If low stakes make knowledge *easier*, why don't you know you lost?
  *   **The Explanation:** This is the classic **Lottery Paradox**. Philosophical consensus generally holds that *statistical probability alone* is never enough for knowledge, regardless of stakes. You need a causal connection or direct verification. Even if it doesn't matter if you're wrong, the *type* of evidence (odds vs. checking) is insufficient to rule out the alternative "I won."
  *   **Verdict:** Consistent. Some evidence types (statistics) are structurally incapable of yielding knowledge, stakes notwithstanding.

  **3. The Surgery (High Stakes, Knowledge Holds)**
  *   **The Puzzle:** High stakes usually block knowledge (like the Cake). Why not here?
  *   **The Explanation:** Look at the **Quality of Evidence**. In the Cake case, your evidence was "I've seen them open before." In the Surgery case, the anesthesiologist's evidence is "I have a medical degree, I have checked the patient's weight, I have followed hospital protocol, and I have double-checked the vial."
  *   **The Asymmetry:** The doctor's justification is objectively stronger than yours about the donuts. Her evidence is robust enough to clear the high bar set by the life-or-death stakes. Your donut evidence was not robust enough to clear the high bar set by the birthday stakes.
  *   **Verdict:** Consistent. High stakes require high-quality evidence. The doctor has it; you (about the cake) do not.

  **4. Grandma's Flight (Conversational Context)**
  *   **The Shift:** Your sister didn't change the facts; she changed the **Conversational Context**. By asking "Do you *KNOW* know?", she made the possibility of error *salient*.
  *   **The Mechanism:** In Contextualism, when an error possibility is explicitly mentioned, it becomes "relevant." Once it is relevant, you must rule it out to claim knowledge. Since you can't rule out a flight delay with 100% certainty, you retreat to "pretty sure."
  *   **Verdict:** Consistent. Salience of error raises the standards for attribution.

  ---

  ### The Test Case: Small Claims Court

  Now, let's apply this principle to your upcoming court date.
  **The Claim:** "I knew he agreed to finish by the 1st."
  **The Evidence:** He told me on the phone; I wrote it down.
  **The Context:** Small Claims Court (Adversarial, Legal, High Stakes).

  **The Prediction:**
  Your pattern of verdicts suggests that **your claim to knowledge will be undercut in this setting.**

  Here is why, based on your own intuitions:

  1.  **Stakes are High:** Unlike the donut, money and legal judgment are on the line. Like the Cake case, high stakes raise the threshold for what counts as "knowing."
  2.  **Relevant Alternatives are Salient:** In a court context, the alternative "You misheard him," "He was speaking hypothetically," or "You wrote it down incorrectly" are not just possible; they are the *default assumptions* of the defense. The contractor's denial makes these alternatives explicitly relevant (just like your sister did with the flight).
  3.  **Evidence Quality:** Compare your evidence to the Anesthesiologist. She had protocols and credentials. You have a memory and a personal note. In the "Surgery" case, we accepted knowledge because the evidence was institutional and verified. In your case, the evidence is private and unverified.

  **Verdict:** In the context of the courtroom, you likely do not meet the standard to say "I know." You can truthfully say, "I firmly believe," or "I recall," but claiming *knowledge* invites the judge to apply the high-stakes standard, which your note cannot satisfy.

  ### Details That Matter (And Why)

  If you want to salvage the "I know" claim in court, you need to upgrade your evidence to meet the high-stakes threshold (mimicking the Anesthesiologist case). The following details would matter:

  1.  **Contemporaneity:** Did you write the note *during* the call or three days later? (Affects reliability).
  2.  **Corroboration:** Did you text him afterwards saying, "Just to confirm, we agreed on the 1st," and did he reply? (This creates a causal link similar to checking the lottery ticket).
  3.  **Prior Conduct:** Has he finished work by agreed dates before? (This strengthens the inductive habit, moving it closer to the "Donut" case, but stakes might still override this).
  4.  **Recording:** Is the call recorded? (This removes the "misheard" alternative entirely).

  ### Summary for Your Roommate

  Tell your roommate this:
  If "know" just meant confidence, you would be equally confident about the donuts and the cake. But you aren't willing to act on the cake knowledge without calling. That proves "know" isn't about what's in your head; it's about **whether your evidence is good enough to act on given the risks.**

  You aren't inconsistent. You are correctly sensing that "knowledge" is a tool we use to signal that it is **safe to rely on this information.** Sometimes (Donuts), low evidence is safe. Sometimes (Cake/Court), it isn't. And sometimes (Surgery), high evidence makes it safe even when the risk is massive.
