prompt: |-
  My workplace's union branch has voted to strike, and I have to decide by Friday whether to join the picket line. The dispute is over the closure of the final-salary pension scheme to newer staff — a change that was already imposed on those of us hired within the last five years, so the strike, even if it succeeds, would preserve the scheme only for colleagues hired before the cut-off. My own terms would not improve by a penny. I benefit from the union in other ways (last year's pay rise came from its bargaining), and I know that if everyone in my position stayed out, the action would probably fail. On the other hand, I pay my dues, I voted against the strike, and the immediate stakes don't touch me. Some of my newer colleagues say joining would be pure sentiment; some of the older ones say that if we let the scheme close for new entrants, the same logic will eventually be turned on every benefit, and that this strike is really about what happens once we're the senior staff. Which of these considerations actually bears on what I should do, and which are just pressure dressed up as principle?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Workplace union branch voted to strike.
      *   **Decision Deadline:** Friday.
      *   **Core Issue:** Closure of final-salary pension scheme to newer staff (hired within last 5 years).
      *   **User's Status:** Hired within the last 5 years (newer staff).
      *   **Direct Impact:** None. The strike won't change the user's pension terms even if successful.
      *   **Union Relationship:** Pays dues, benefited from union bargaining previously (last year's pay rise), voted *against* the strike.
      *   **Social Pressure/Arguments:**
          *   *Newer Colleagues:* Joining is "pure sentiment" (pointless sacrifice).
          *   *Older Colleagues:* It's about precedent ("slippery slope" – if they do this to new staff, they'll do it to senior staff later).
      *   **Collective Action Problem:** If everyone in the user's position stays out, the strike likely fails.
      *   **Goal:** Distinguish between valid ethical/practical considerations and "pressure dressed up as principle."

  2.  **Deconstruct the Arguments:**

      *   **Argument A: Direct Self-Interest (The "Sentiment" View)**
          *   *Claim:* You gain nothing financially.
          *   *Validity:* Factually true regarding the pension.
          *   *Counter:* Unionism isn't always about immediate individual gain.
          *   *Verdict:* Valid consideration, but incomplete. Dismissing it as *just* sentiment ignores the collective nature of unions.

      *   **Argument B: The Precedent/Slippery Slope (The "Solidarity" View)**
          *   *Claim:* Allowing two-tier structures weakens everyone's long-term security.
          *   *Validity:* Strong historical precedent. Two-tier workforces often lead to erosion of conditions for senior staff eventually (divide and conquer).
          *   *Verdict:* This is a substantive principle, not just pressure. It addresses long-term self-interest and collective health.

      *   **Argument C: Collective Efficacy (The "Free Rider" Problem)**
          *   *Claim:* If people like you don't join, the strike fails.
          *   *Validity:* Crucial. Strikes rely on numbers.
          *   *Ethical Angle:* You benefited from the union (pay rise). Is there an obligation to support the union when it fights for others, given they fought for you?
          *   *Verdict:* Strong ethical consideration.

      *   **Argument D: Democratic Mandate (The Vote)**
          *   *Claim:* You voted against the strike.
          *   *Validity:* You exercised your democratic right. The majority ruled.
          *   *Tension:* Does voting "no" absolve you of participating? In union democracy, usually, once a vote is passed, members are expected to respect the decision, even if they disagreed.
          *   *Verdict:* Nuanced. You aren't bound to strike if you disagreed, but undermining the democratic outcome you are part of has consequences.

      *   **Argument E: Social Pressure (Peers)**
          *   *Claim:* Newer vs. Older colleagues' opinions.
          *   *Validity:* This is the "pressure dressed up as principle" part.
          *   *Verdict:* Be wary of guilt-tripping from either side. Focus on the structural arguments, not the emotional ones.

  3.  **Evaluate "Pressure vs. Principle":**

      *   *Pressure:* "Everyone is doing it," "You're letting us down," "You're scabbing," "It's pointless."
      *   *Principle:* Solidarity, long-term collective bargaining power, fairness, reciprocity (benefits received vs. contributions made).

  4.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the complexity. It's a classic collective action problem with an ethical dimension.
      *   **Categorize Considerations:** Break down the factors into "Substantive Principles" and "Social Pressure/Noise."
      *   **Analyze the "Slippery Slope" (Older Colleagues):** Validate this. Two-tier workforces are toxic to union strength. This is a long-term self-interest argument.
      *   **Analyze the "Sentiment" (Newer Colleagues):** Validate the short-term logic but challenge the long-term view. It's not *just* sentiment; it's investment.
      *   **Analyze the "Reciprocity" (Union Benefits):** You took the pay rise. Union strength is a common pool resource.
      *   **Analyze the "Vote":** You voted no. That matters. But does it override the mandate?
      *   **Decision Framework:** Offer questions to help the user decide (Risk tolerance, belief in the precedent argument, relationship with the union).
      *   **Conclusion:** Summarize the core distinction.

  5.  **Refining the Tone:**
      *   Needs to be neutral, analytical, and empathetic.
      *   Avoid telling them *what* to do, but *how* to think about it.
      *   Ensure the distinction between "pressure" and "principle" is clear.

  6.  **Self-Correction/Edge Case Check:**
      *   *Legal/Contractual:* In some jurisdictions, striking has legal protections; in others, it might breach contract. (Assume UK/context based on "final-salary pension" and "picket line" terminology, likely UK. Keep advice general enough but acknowledge the commitment aspect).
      *   *Financial Hardship:* Striking usually means loss of pay. I need to mention the cost of striking.
      *   *The "Voted No" aspect:* This is crucial. It shows they aren't just wavering; they actively opposed the tactic. This needs careful handling. It's not just apathy; it's dissent.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Pressure vs. Principle" question is directly answered. (The prompt asks "Which of these considerations actually bears on what I should do, and which are just pressure dressed up as principle?")

      *   *Principle:* Solidarity/Precedent, Reciprocity, Collective Efficacy.
      *   *Pressure:* Guilt from older staff, Dismissal from newer staff, Fear of social ostracization.

      *(Self-Correction during drafting)*: Make sure to emphasize that "Solidarity" isn't just a buzzword; it has a mechanical function in labor relations.

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a classic ethical and strategic dilemma in labor relations: the tension between **immediate individual interest** and **long-term collective interest**. To separate principle from pressure, you need to evaluate which arguments address the *mechanics* of your workplace power and which address *social cohesion* or guilt.

  Here is a breakdown of which considerations bear on the decision substantively and which are largely noise.

  ### 1. Substantive Principles (These bear on the decision)

  **The "Precedent" Argument (The Older Colleagues)**
  *   **Verdict:** **Principle.**
  *   **Why:** This is not merely a slippery-slope fallacy; it is a documented dynamic in labor relations. When management successfully imposes two-tier workforces (different terms for different cohorts), it structurally weakens the union. It creates a divide where the interests of senior and junior staff diverge, making it harder to present a united front in future negotiations.
  *   **The Stake:** Even if your pension is safe *now*, the erosion of the principle that "all staff share the same conditions" makes your own future benefits more vulnerable when *you* become the senior staff. Protecting the scheme for new entrants is an investment in the integrity of the bargaining unit you will eventually rely on.

  **The "Reciprocity" Argument (The Union Benefits)**
  *   **Verdict:** **Principle.**
  *   **Why:** You acknowledged that the union secured your pay rise last year. Union power is a "common pool resource." It functions like an insurance policy: you pay in (dues and participation) so that it is there when needed. If members only participate when the immediate issue directly benefits them, the union's credibility and leverage collapse.
  *   **The Stake:** By withdrawing labor now, you are drawing on the collective strength you benefited from previously. Refusing to contribute to that strength when the cost shifts to you (in the form of lost pay/strike effort) risks degrading the tool that protects you.

  **The "Collective Efficacy" Argument (The Critical Mass)**
  *   **Verdict:** **Principle.**
  *   **Why:** You noted that if everyone in your position stayed out, the action would fail. This is a factual assessment of leverage. A strike that fails due to lack of participation emboldens management and weakens the union's position for *all* future disputes, including those that will affect you directly.
  *   **The Stake:** Your participation is mathematically relevant to the success of the action. This moves the decision from "symbolic gesture" to "tactical necessity."

  ### 2. Pressure Dressed Up as Principle (These are less relevant)

  **The "Sentiment" Argument (The Newer Colleagues)**
  *   **Verdict:** **Pressure/Short-termism.**
  *   **Why:** Dismissing the strike as "pure sentiment" assumes that the only valid labor action is one with immediate ROI. This ignores the strategic nature of unionism. While their concern for your immediate financial loss (strike pay is usually less than normal pay) is valid care, framing solidarity as "sentiment" undermines the mechanical reality of how bargaining power is built.
  *   **The Noise:** They are asking you to prioritize short-term individual gain over long-term collective security. That is a rational economic choice for an individual, but it is not a principled argument against striking.

  **The "Democratic Mandate" Argument (Your "No" Vote)**
  *   **Verdict:** **Mixed (Mostly Pressure).**
  *   **Why:** You voted against the strike. In a democracy, you are not obligated to support a measure you opposed. However, once a vote is passed, the union operates as a bloc.
  *   **The Pressure:** If you use your vote as a shield to justify undermining the outcome, you are prioritizing your individual dissent over the collective decision. Conversely, if you feel *forced* to strike solely because "the vote passed," that is coercion. The principle here is **respect for the collective decision vs. individual conscience.** Neither side is purely "pressure," but be wary of feeling *guilty* for voting no, or feeling *righteous* for sticking to your vote. The question is: has anything changed since the vote that makes the strike more necessary now?

  **The Social Ostracization Fear**
  *   **Verdict:** **Pressure.**
  *   **Why:** Worrying about being called a "scab" by older staff or "naive" by newer staff is social pressure. It does not change the ethics or the strategy.
  *   **The Noise:** Do not decide based on who will buy you a drink or give you the cold shoulder. Decide based on the structural arguments above.

  ### 3. The Deciding Factors

  To make your decision by Friday, ask yourself these three questions. They cut through the noise:

  1.  **Do I believe the "Two-Tier" Threat?**
      If you believe that allowing this closure sets a precedent that will eventually harm you when you are senior staff, then you have a direct self-interest in striking. It is not altruism; it is long-term self-defense.
  2.  **Can I Afford the Cost?**
      Striking usually involves loss of pay. If joining the picket line causes you genuine financial hardship, that is a valid practical constraint, not a lack of principle. Unions generally do not expect members to impoverish themselves for the cause.
  3.  **What is the Value of My Membership?**
      If you view the union as a service provider (I pay dues, I get pay rises), you might stay out. If you view the union as a collective voice (I am part of the body that negotiates), you likely need to be on the line. You cannot consistently benefit from the "collective voice" while opting out when the voice speaks for someone else.

  ### Summary

  *   **Bear on the decision:** The risk of two-tier workforce precedents, the need for critical mass to make the strike effective, and the reciprocity of having benefited from union bargaining previously.
  *   **Ignore:** The accusation that solidarity is "sentiment," the fear of social judgment from either camp, and the guilt regarding your "No" vote (though you should respect the outcome).

  If you accept that the erosion of conditions for new staff eventually weakens the protections for senior staff, **the strike is in your long-term interest.** If you view the pension scheme as a closed door that truly does not affect the broader culture of negotiation at your workplace, then **staying out is a consistent individual choice.**

  The most principled path usually lies in recognizing that **solidarity is not charity; it is strategy.**
