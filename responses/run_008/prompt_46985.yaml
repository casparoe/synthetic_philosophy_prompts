answer: |-
  **Museum Confirms Centerpiece Is Forgery, Refuses To Change Label Beyond Two Words**

  OAKHAVEN — The Oakhaven Regional Museum confirmed Tuesday that *Sunset over the Quarry*, its centerpiece since 1994, was actually painted in 1954 by a local sign painter who then donated the money to buy it. Despite the revelation, Museum Director Arthur Penhaligon announced no changes to the display, admission, or audio guide, arguing that since the visual data remains identical, the artistic value remains unchanged. The only modification to the placard will be the insertion of the words "Attributed To."

  "The light hitting the canvas is the same light that hit it yesterday," Penhaligon said. "If a visitor feels moved by the brushwork, that emotion is real. To claim the experience is diminished is to claim your appreciation relies on paperwork rather than perception. If knowing the provenance changes your experience, that is a fact about your head, not about the paint. For sixty years, this object did the work of art. It moved visitors, inspired a poet, and got a school named after the artist. That impact is historical fact, regardless of who held the brush."

  Penhaligon insisted the docent scripts require only a pronoun edit. However, when asked if the museum would now lend the piece to the National Gallery, Penhaligon balked. "We cannot send a known forgery on tour," he said. He cancelled an exhibit of related drawings and expressed horror when a board member suggested commissioning the forger's estate to restore the varnish. "That would be legitimizing a deception," Penhaligon said. "We must protect the integrity of the collection."

  Dr. Elena Rosales, a visiting ethicist, noted the disconnect. "A painting isn't just an image; it's a receipt for a human achievement," she said. "Here, the achievement was trickery, not vision. You can't separate the record from the object."

  Meanwhile, visitor Mark Davids, 42, said the news changed nothing for him. "I come here to get out of the rain," Davids said. "Honestly, I'm mostly worried the director seems really stressed about this. The colors are still nice."

  Penhaligon continues to stand guard, ensuring no one touches the canvas. When asked if he would hang the original canvas in his own home, he hesitated. "It belongs here," he said. "It's part of our history. Even if that history is fake." He then adjusted the lighting to ensure the glaze caught the eye exactly as it had for six decades, preserving the illusion perfectly.
