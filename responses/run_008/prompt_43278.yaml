answer: |-
  This is a remarkably sophisticated diagnosis of a stalemate that plagues the entire field, not just your reading group. You have essentially rediscovered the "equilibrium of misery" that characterizes contemporary philosophy of vagueness. Every major position solves the Sorites paradox by accepting a "bullet" that feels intuitively wrong, and the debate has calcified around which bullet is least painful.

  Here is the diagnosis you asked for, based on the specific friction points you described.

  ### 1. Diagnosis: Different Research Programs, Not Verbal Disagreement

  Your hypothesis is **mostly correct, but needs a slight adjustment.** It is not merely a disagreement about whether semantics is "descriptive" vs. "normative." Rather, it is a disagreement about **theoretical priority**.

  *   **The Epistemicists** are prioritizing **Logic and Metaphysics.** They are unwilling to revise classical logic (bivalence, excluded middle) or standard model theory. To save classical logic, they relocate the problem from semantics to epistemology. For them, a semantic theory *must* preserve the law of non-contradiction at all costs.
  *   **The Supervaluationists** are prioritizing **Semantic Intuitions.** They are unwilling to accept that there is a fact of the matter about the 500th grain. To save the intuition that "there is no sharp boundary," they revise the logic of truth (introducing supertruth) and the logic of quantification.
  *   **The Degree Theorist** is prioritizing **Phenomenology/Gradability.** They prioritize the intuition that confidence/truth slides gradually.

  **Is it verbal?** No. If it were merely verbal, you could translate one view into the other without loss. You cannot. They make different predictions about validity (e.g., does the Sorites argument have a false premise or is it invalid?) and different predictions about the behavior of the "Definitely" operator.

  **Is it substantive?** Yes, but only relative to a shared goal. If the goal is "Preserve Classical Logic," Epistemicism wins. If the goal is "Match Intuitions about Indeterminacy," Supervaluationism wins. Since you haven't agreed on the goal, you are talking past each other.

  **The Verdict:** You are running **incompatible research programs under one heading.** The Epistemicist is doing metaphysics of language; the Supervaluationist is doing rational reconstruction of semantic competence.

  ### 2. The Fault Lines: Forced-March and Penumbral Connections

  You identified the exact spots where the conversation breaks down. Here is why those specific data points fuel the stalemate rather than resolving it.

  #### The Forced-March Data
  You noted that everyone drew a line, but inconsistently, and unpredictably.
  *   **Epistemicist Interpretation:** "The fact that you *must* draw a line proves there *is* a line. The inconsistency proves you are *ignorant* of where it is. The cognitive mechanism for applying 'heap' is sensitive to grain count, but noise prevents you from accessing the threshold reliably."
  *   **Supervaluationist Interpretation:** "The fact that the line moves proves there *isn't* a fixed line. You were forced to precisify for the sake of the task. The inconsistency shows that the precisification is context-dependent, not discovery of a pre-existing fact."
  *   **The Impasse:** The Epistemicist sees the *necessity* of drawing a line as evidence of bivalence. The Supervaluationist sees the *variability* of the line as evidence of indeterminacy. You are looking at the same graph and seeing different shapes because your theories dictate what counts as signal vs. noise.

  #### Penumbral Connections
  This is where Supervaluationism usually claims a knockout, but Epistemicists dig in.
  *   **The Data:** It seems true that "If $a$ is a borderline heap, then $a$ is not a borderline non-heap." (You can't be borderline $F$ and borderline $\neg F$ in the same respect).
  *   **Supervaluationist Strength:** They can validate these connections logically. On all precisifications, the connection holds.
  *   **Epistemicist Weakness:** They must say these connections are *true*, but we can't know them. But why can't we know them? If they are logical truths derived from the meaning of 'borderline', Epistemicists owe an explanation of why competent speakers are ignorant of the logic of their own language.
  *   **The Fight:** Your group fights here because the Supervaluationist feels the Epistemicist is missing the *logical structure* of vagueness, while the Epistemicist feels the Supervaluationist is inventing a "truth" (supertruth) that doesn't govern assertion. (We don't assert what is supertrue; we assert what is true. If supertruth $\neq$ truth, what is it?)

  ### 3. Prospects for Progress: What Would Actually Move the Needle?

  You asked for honesty. **Do not expect a knockout argument.** The literature is 50 years deep; if there were a logical proof that killed one view, it would be known. However, progress is possible if you change the metric of success.

  **A. Conceptual Distinction: Truth vs. Assertibility**
  Most of your fighting is likely about when it is *appropriate to say* something.
  *   **Progress:** Adopt a norm of assertion distinction. Epistemicists can argue that we *know* the cutoff exists but cannot *assert* where it is (Williamson's margin-for-error principle). Supervaluationists can argue we cannot assert borderline cases because they lack truth, even if they are "acceptable."
  *   **Test:** Stop asking "Is this sentence true?" Ask "Would you bet on this sentence?" Betting behavior often diverges from truth-value judgments and might reveal whether speakers treat borderline cases as risky (Epistemic) or void (Supervaluation).

  **B. Experimental Work (X-Phi)**
  You asked about experimental work. **Yes, this is the most viable path, but it must be specific.**
  *   **The Test:** Do not test whether people see a cutoff (they always will under pressure). Test **higher-order ignorance.**
  *   **The Question:** Ask speakers: "Is it possible that there is a specific number of grains that makes a heap, but humans can never know it?" vs. "Is there no specific number, even in principle?"
  *   **The Data:** Existing work (e.g., by Alxatib, Pelletier, and Raffman) suggests speakers are **inconsistent.** They accept contradictions ("This is a heap and not a heap") in borderline cases more often than classical logic allows.
  *   **Implication:** This hurts *both* Epistemicism and Supervaluationism (both are classical at the core). It might push you toward **Contextualism** (Raffman) or **Paraconsistency** (Hyde), or suggest that "truth" isn't the right tool at all.

  **C. Formal Results on Higher-Order Vagueness**
  This is the technical bottleneck.
  *   **The Problem:** Supervaluationism struggles to define "Definitely" without collapsing (if "Definitely $P$" is true, is "Definitely Definitely $P$" true?). Epistemicism struggles to explain why the "margin for error" doesn't itself have a sharp boundary.
  *   **Progress:** If your group contains formal logicians, try to model **dynamic context shift.** The most promising modern view (Fara, Raffman) is that the boundary *moves* as you approach it. This explains the forced-march data (the line moves as you judge) without requiring ignorance of a static fact. This is a substantive shift away from all three of your current positions.

  ### 4. The Hidden Empirical Assumption

  You asked me to identify if one position rests on a testable empirical assumption. **Yes. The Epistemicist position.**

  **The Assumption:** **The Supervenience of Semantics on Use.**
  Epistemicism (specifically Williamson's version) relies on the claim that meaning is determined by use, and since use is finite and complex, it *does* determine a sharp boundary, even if we can't calculate it. It assumes that there is a **fact of the matter about reference** fixed by causal/social history.

  **Why this is empirical:** It is a claim about the relationship between human behavior (use) and semantic content (reference). It is possible that use *underdetermines* reference. If use underdetermines reference, then there is **no** sharp cutoff, not even an unknowable one. There is simply no fact of the matter.

  **How to Test It:**
  This is difficult, but you can probe it via **translation and learning.**
  *   If Epistemicism is right, a child learning the word "heap" is implicitly learning a rule with a sharp cutoff, even if they can't articulate it.
  *   **Experiment:** Train subjects on a novel predicate with a clear gradient. See if their internal generalization behaves like a sharp threshold function (sigmoid with high slope) or a truly fuzzy function.
  *   **The Kicker:** If cognitive science shows that human categorization is fundamentally probabilistic or prototype-based (which it largely does), the Epistemicist claim that there is a "sharp cutoff in the extension" becomes a metaphysical posit detached from cognitive reality. It renders "semantics" something that no longer connects to how speakers actually process language.

  ### Recommendation for the Group

  You have stalled because you are trying to solve the Sorites Paradox. **Stop trying to solve it.**

  1.  **Acknowledge Pluralism:** Accept that Epistemicism is the best theory for *logic*, Supervaluationism is the best theory for *semantic relations*, and Degree Theory is the best theory for *psychological confidence*. They are tools for different jobs.
  2.  **Shift to Contextualism:** The forced-march data (lines moving) strongly supports **Contextualism** (the meaning of 'heap' shifts slightly with each judgment to maintain coherence). This dissolves the paradox without requiring ignorance or truth-value gaps. It treats the stall not as a failure of theory, but as a feature of language dynamics.
  3.  **The "So What?" Test:** Ask each member: "If your theory is right, what practice changes?"
      *   If the Epistemicist is right, we should stop teaching classical logic? No.
      *   If the Supervaluationist is right, we should change how we draft laws? Maybe.
      *   If you can't find a practical consequence, the disagreement is likely metametaphysical.

  **Final Verdict:** Your hypothesis is correct. You are not disagreeing about English; you are disagreeing about what a semantic theory is *for*. The stall is a feature, not a bug. It indicates you have reached the limit of what pure armchair philosophy can decide on this topic. To break it, you must either embrace formal modeling of context-shift or go empirical on speaker psychology. Otherwise, you are simply choosing your preferred flavor of bullet.
