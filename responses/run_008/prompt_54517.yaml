  The mist rolls in from north,
  Where life draws its first birth.
  They slide on wettest skin,
  Recognizing distinct kin.

  They mingle with their kin,
  And breathe through porous skin.
  They move through coastal rain,
  Across the flat green plain.

  They drink the heavy rain,
  And leave the open plain.
  The sun dips low to west,
  Where shadows bring them rest.

  They climb the granite crest,
  And find a stony rest.
  The air becomes more cold,
  The patterns turn to gold.

  They bear the biting cold,
  In patches bright and gold.
  They shift the color back,
  Along the mountain track.

  They lose the white upon the back,
  And follow down the track.
  They reach the southern shore,
  Where heat demands much more.

  They search for something more,
  Upon the sandy shore.
  The patterns catch the light,
  Distinct within the night.

  They hunt by faintest light,
  And vanish in the night.
  The season turns to June,
  They hum a silent tune.

  The heat of late June,
  Changes the silent tune.
  They touch the heated ground,
  Where barriers are found.

  They stand upon the ground,
  Where northern types are bound.
  They turn into the dark,
  Leaving no genetic mark.
