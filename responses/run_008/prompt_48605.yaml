          3.  Core Question: Can INE vocabulary distinguish between "Inertial frame is real" vs. "Inertial frame is bookkeeping/relative to distant matter"? Is the difference empty or is the vocabulary missing something?
          4.  Constraint: No reading lists/citations. Keep it hardware-grounded.

  2.  **Deconstruct the Philosophical Debate (Mental Sandbox):**
      *   *Newton (Substantivalism):* Space is a container. Acceleration is absolute. The bucket experiment proves rotation is absolute because water climbs walls even when stationary relative to the bucket, provided it's rotating relative to Space.
      *   *Leibniz (Relationism):* Space is just relations between objects. No objects = no space. Newton's "Absolute Space" is an unobservable ghost. Indiscernibles argument (shifting the universe 5 feet left makes no observable difference, so it's meaningless).
      *   *Mach:* Inertia isn't intrinsic; it's caused by interaction with distant mass (fixed stars). If the universe were empty, a spinning bucket wouldn't have concave water.
      *   *Einstein (GR):* Spacetime is dynamic. Inertial frames are local free-fall frames. Mach's principle influenced him but GR isn't fully Machian (vacuum solutions exist).

  3.  **Translate to INE Vocabulary:**
      *   *Absolute Space:* The "Perfect Inertial Frame" (PIF). The reference against which specific force is integrated to get velocity/position.
      *   *The Bucket:* A rotating IMU or a centrifuge test.
      *   *Water Climbing:* The specific force measured by accelerometers (centrifugal term).
      *   *Gyros:* Devices that measure angular rate *relative to the PIF*.
      *   *Leibniz's Ghost:* The PIF itself. Does it exist physically, or is it just the sum of all other masses?
      *   *Alignment:* The process of finding the PIF (using GNSS or star trackers).
      *   *Drift:* The slow divergence of the computed frame from the PIF.

  4.  **Drafting the Translation (Section by Section):**

      *   *Newton's Bucket:* Imagine a strapdown IMU sitting on a turntable. Accelerometers read $g$ plus centrifugal. Gyros read rate. Newton says: The gyros are measuring rotation relative to *Space itself*. That's why the accelerometers see the centrifugal pseudo-force.
      *   *Two-Globes:* Two IMUs connected by a tether in deep space, spinning. Tension in the tether = acceleration. Newton: Rotation relative to Space.
      *   *Leibniz:* Where is this "Space" you're integrating against? If I shift the whole universe (all reference stars) 5 meters, your Kalman filter doesn't change. If I rotate the whole universe, your gyro output doesn't change. So "Space" is redundant. It's just the relationship between the IMU and the mass distribution of the universe.
      *   *Mach:* The "Inertial Frame" isn't a background grid. It's defined by the "Fixed Stars" (distant quasars used for star tracker alignment). If you removed the stars, the gyros would read zero even if spinning. The inertia comes from the mass of the universe.
      *   *Einstein:* The "Inertial Frame" is local. Gravity bends the path. An IMU in freefall reads zero specific force. Spacetime tells matter how to move.

  5.  **Addressing the Core Question (The "Residue"):**
      *   *Clean Translation:* The bucket argument *is* the detection of non-zero specific force on accelerometers when angular rate is non-zero on gyros, without external reference.
      *   *Distortion:* Philosophers talk about "meaning." Engineers talk about "error budgets."
      *   *The Missing Piece:* The *Ontological Status*. Engineers treat the Inertial Frame as a *boundary condition*. Philosophers ask *what enforces* that boundary condition.
      *   *Can INE distinguish?* No. An IMU cannot distinguish between "Space is a substance" and "Space is the average of distant mass." Both yield the same gyro output.
      *   *Why?* Because the IMU measures *kinematics*, not *causation*.

  6.  **Refining the "Gyro" Explanation:**
      *   Crucial point: What does a Ring Laser Gyro (RLG) or FOG actually measure? It measures the Sagnac effect. This is a phase shift of light. It measures rotation relative to the propagation of light.
      *   In SR/GR, light propagation defines the local causal structure.
      *   So, the gyro measures rotation relative to the local spacetime metric.
      *   Newton says Metric = Absolute Space.
