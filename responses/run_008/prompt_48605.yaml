answer: |-
  You have hit the nail on the head. Your intuition is correct: Inertial Navigation Engineering is essentially applied metaphysics. You are building hardware that assumes an answer to the Newton/Leibniz debate to function, and your error budget is the tax you pay for that assumption.

  Here is the translation of the Substantivalism vs. Relationism debate into your vocabulary, followed by the residue report on what your instruments can and cannot tell you.

  ### Part 1: The Translation

  **1. Newton's Bucket → The Stationary Turntable Test**
  *   **Philosophy:** Newton fills a bucket with water, spins it, and notes the water climbs the walls. He argues this proves rotation is absolute, not relative to the bucket, because when the water is stationary relative to the bucket but spinning relative to the ground, the surface is flat. When it spins relative to the bucket, it's concave.
  *   **INE Translation:** You strap an IMU to a precision turntable. You lock the case (the bucket). You spin the turntable.
      *   **Accelerometers:** Read a specific force vector pointing outward (centrifugal).
      *   **Gyros:** Read a constant angular rate about the vertical axis.
      *   **Newton's Claim:** The gyros are measuring rotation relative to **Absolute Space**. The accelerometers are detecting the pseudo-force generated because your body frame is rotating relative to that Absolute Space. The "concave water" is the specific force bias you see in the accelerometer data when you integrate without correcting for the Coriolis and Centrifugal terms derived from the gyro output.
      *   **The Point:** Newton says the "Inertial Frame" (ECI) is a physical substrate. Your gyros are tapping into it.

  **2. The Two-Globes Thought Experiment → The Tethered IMU Pair**
  *   **Philosophy:** Newton imagines two globes connected by a cord in an empty universe. If they rotate, the cord tightens. This tension proves absolute rotation even without external reference points.
  *   **INE Translation:** Imagine two IMUs connected by a rigid bar in deep space, far from any gravity source. You spin the assembly.
      *   **Observation:** The strain gauges on the bar read tension. The IMU accelerometers read outward specific force. The gyros read rate.
      *   **Newton's Claim:** Even if you delete every star in the sky (delete the external aiding), the gyros still read rate. Therefore, the reference frame exists independently of the "distant matter." The Inertial Frame is a container that persists even if empty.

  **3. Leibniz's Objection → The Indiscernibles / The Kalman Filter Argument**
  *   **Philosophy:** Leibniz argues Absolute Space is a "ghost." If you shift the entire universe 5 feet to the left, nothing observable changes. Therefore, "position in absolute space" is meaningless. Space is just the set of relations between objects.
  *   **INE Translation:** Leibniz looks at your Navigation Solution (the Kalman Filter state vector).
      *   **The Argument:** Your filter estimates position, velocity, and attitude relative to a defined frame (e.g., ECEF or ECI). If you mathematically rotate the entire mass distribution of the universe (all the stars you use for star-tracker aiding) by 5 degrees, but you *also* rotate your initial alignment conditions by 5 degrees, your residual errors are identical.
      *   **The Claim:** The "Inertial Frame" is not a physical thing; it is a **coordinate convention**. It is a bookkeeping device to keep the math linear. To say the IMU rotates relative to "Space" is redundant; it only rotates relative to the *average mass distribution of the universe* which defines that frame. If there were no other mass, the concept of "rotation" would have no input variable for your filter.

  **4. Mach's Principle → The "Fixed Stars" Alignment**
  *   **Philosophy:** Mach argues inertia is not intrinsic. The water climbs the bucket walls *because* it is rotating relative to the fixed stars (distant mass). If the universe were empty, the water would stay flat even if spinning.
  *   **INE Translation:** You perform a **Stationary Alignment**. You assume the Earth is rotating at $\Omega_{ie}$ relative to the Inertial Frame. You measure this rotation with your gyros to find North.
      *   **Mach's Claim:** The gyros don't measure rotation against "Space." They measure rotation against the **gravitational potential of the distant universe**. The "Inertial Frame" is physically dragged or defined by the bulk mass of the cosmos.
      *   **Hardware implication:** If you could somehow shield the IMU from the gravitational influence of distant matter (impossible, but hypothetically), the gyros would read zero, and the accelerometers would read zero specific force, even if you spun the case. The "stiffness" of the inertial frame comes from the mass of the universe.

  **5. Einstein (General Relativity) → Local Free-Fall Frames**
  *   **Philosophy:** Spacetime is dynamic. Inertial frames are local and free-falling. Gravity is curvature.
  *   **INE Translation:** You know that accelerometers measure **Specific Force** ($f = a - g$), not coordinate acceleration.
      *   **The Shift:** An IMU in free-fall (orbit) reads zero specific force on the accelerometers (ignoring tidal gradients). This is a "Local Inertial Frame."
      *   **The Gyro:** A Ring Laser Gyro (RLG) or Fiber-Optic Gyro (FOG) measures the Sagnac effect. It measures rotation relative to the **propagation of light** in the local vacuum.
      *   **Einstein's Verdict:** The "Inertial Frame" is the local tangent space of the spacetime metric. It is real, but it is not a rigid grid (Newton); it is a dynamic field that curves near mass. Your navigation equations (Schuler tuning, etc.) are approximations of moving through this curved metric.

  ---

  ### Part 2: The Residue Report

  Here is the honest accounting of what translates, what distorts, and what vanishes.

  **1. What Translates Cleanly**
  *   **The Bucket Argument:** Yes, this is literally the detection of centrifugal specific force in a rotating body frame. The "concave surface" is the uncorrected accelerometer bias that appears when you fail to account for angular rate in the navigation equation ($\dot{v} = f + g - (2\omega \times v)$).
  *   **Absolute Space vs. Inertial Frame:** In your work, "Absolute Space" is the **ECI (Earth-Centered Inertial) Frame**. It is the non-rotating frame in which you integrate specific force to get velocity.
  *   **Leibniz's Ghost:** This translates to the **Unobservable States** in your Kalman Filter. If a state (like absolute position in a void) has no measurement update to constrain it, it is unobservable. Leibniz is arguing that "Absolute Space" is an unobservable state with no measurement update, so it should be pruned from the model.

  **2. What Translates with Distortion**
  *   **"Real" vs. "Bookkeeping":** In engineering, "real" means "has a signal-to-noise ratio > 1." In philosophy, "real" means "ontologically independent."
      *   *Distortion:* You treat the Inertial Frame as real because your gyros output a voltage proportional to rotation against it. A philosopher says the voltage is real, but the *thing* it references might just be a relational average. You conflate *measurement* with *existence*.
  *   **Mach's Principle:** In engineering, we treat the "Fixed Stars" as a boundary condition for alignment. Mach treats them as the *cause* of inertia.
      *   *Distortion:* Your hardware works regardless of the cause. You assume the frame is stable (Newton) to build the filter. Mach says the frame is stable *because* of the mass. Your error budget doesn't care *why* the frame is stable, only *that* it is stable.

  **3. What Has No Counterpart (The Loss)**
  *   **The "Why" of Inertia:** Your vocabulary describes *how* to navigate, not *why* resistance to acceleration exists. You model mass as a scalar parameter ($m$) in $F=ma$. You do not model *why* $m$ couples to the inertial frame. The philosophical debate is about the coupling mechanism. Your vocabulary assumes the coupling is fundamental; their debate is whether the coupling is derived.
  *   **Counterfactuals:** Engineers deal with actual data. Philosophers deal with possible worlds (e.g., "What if the universe were empty?"). Your IMU cannot output data for an empty universe. This creates a blind spot where your vocabulary goes silent.

  ---

  ### Part 3: The Core Question

  **Can your vocabulary distinguish between "The inertial frame is a real thing" and "The inertial frame is a bookkeeping device relative to distant matter"?**

  **The Answer:** **No.**

  **Why:**
  Your IMU measures the **Sagnac Effect** (gyros) and **Proper Acceleration** (accelerometers).
  1.  **The Gyro:** An RLG/FOG measures the phase shift of counter-propagating light beams. This measures rotation relative to the local causal structure of spacetime (the path of light).
  2.  **The Accelerometer:** Measures the deviation from a geodesic (free-fall).

  Both Newton (Substantivalism) and Mach (Relationism) predict the **exact same voltage output** from your sensors in every conceivable test you can perform within this universe.

  *   **Newton says:** The light beams are rotating relative to the Spacetime Container.
  *   **Mach says:** The light beams are rotating relative to the Distant Mass which defines the Spacetime Metric.

  Since the Distant Mass *defines* the Spacetime Metric in our universe, the two models are empirically equivalent for navigation purposes. Your vocabulary cannot distinguish them because your instruments measure **kinematics** (motion), not **ontology** (existence).

  **Is the difference empty?**
  *   **Operationally (For you):** Yes. It is empty. Whether the frame is a "ghost" or a "mass average," your drift rates, Schuler loops, and alignment procedures remain identical. Treating it as a "real thing" (Newton) is a better engineering heuristic because it simplifies the math (you don't have to integrate over the mass of the universe to compute Coriolis).
  *   **Physically (For GR):** No, it is not empty. General Relativity allows for **Vacuum Solutions** (like the Gödel metric or gravitational waves in an empty universe). In GR, spacetime can have structure (curvature, waves) even without matter. This supports Newton more than Mach. If you could detect a gravitational wave passing through your IMU in a totally empty universe, your gyros would jitter. That jitter is "Space" moving, not "Matter" moving.
      *   *Hardware Check:* Your high-end tactical grade IMUs can detect Earth tides and potentially strong gravitational gradients. This suggests the "frame" has independent dynamics (spacetime curvature) not strictly locked to local matter. This leans toward Substantivalism (Space is a thing that can ripple), but it doesn't fully kill Relationism.

  ### The Verdict for the Engineer

  Your friend is arguing about the **source code** of the universe. You are arguing about the **user interface**.

  *   **Newton:** The OS is running on a physical machine called Space.
  *   **Leibniz:** There is no machine, only the network of processes (matter).
  *   **You:** The API returns `angular_rate` and `specific_force`.

  **The "Ghost" is the Boundary Condition.**
  When you align your INS, you force your computed frame to match an external truth (GNSS or Star Tracker).
  *   If you believe Newton, you are aligning to the **Grid**.
  *   If you believe Mach, you are aligning to the **Mass**.

  Your vocabulary cannot express the difference because **alignment is a constraint equation, not a physical measurement of substance.** You force the error to zero. The philosophy asks what you are forcing it to zero *against*.

  **Final Translation:**
  The "Inertial Frame" in your error budget is the **Null Hypothesis**.
  *   **Newton:** The Null Hypothesis is a physical vacuum.
  *   **Leibniz:** The Null Hypothesis is the absence of relative motion between all objects.

  Your hardware validates the Null Hypothesis (it works), but it cannot validate the *nature* of the Null Hypothesis. The difference is not empty, but it is **out-of-band** for your sensors. It resides in the gravitational field equations (Einstein), not the navigation equations (Coriolis).

  If you want to settle the bet with your friend: Tell them your gyros measure rotation relative to the **local metric field**. Ask them if the metric field requires matter to exist. If they say yes, they're Machian. If they say no (citing gravitational waves), they're Substantivalists. Your IMU measures the field; it doesn't care what sources it.
