      *   **Task:** Restate the Substantivalism vs. Relationism debate (Newton, Leibniz, Mach, Einstein) in INE (Inertial Navigation Engineering) vocabulary.
      *   **Specific Deliverables:**
          1.  Translation of the arguments (Bucket, Two-Globes, Leibniz's objections, Mach, Einstein).
