answer: |-
  This is a remarkably sharp observation. You have identified the three primary modes of modern welfare states without realizing you're describing a debate that has occupied political philosophers for forty years.

  The short answer is: **The system is not incoherent, but it is hybrid.** It does not commit to a single definition of equality. Instead, it pragmatically switches between three competing theories of justice depending on which one is cheapest, most politically palatable, or most effective for the specific problem at hand.

  However, if we treat the three ways as a single system, we can reverse-engineer the implicit theory of fairness it relies on. Here is an analysis of what your city's "mess" presupposes, where the contradictions lie, and what would happen if it picked a lane.

  ### 1. The Three Theories Hiding in Your Examples

  To understand what the system assumes, we have to name the three philosophical frameworks you've spotted.

  *   **Way 1 (Cash/Food Stamps) assumes "Resource Egalitarianism."**
      *   **Theory:** Fairness means everyone has a similar bundle of resources.
      *   **Logic:** The government doesn't know what makes you happy or what you need better than you do. If you lack money, the injustice is a lack of *purchasing power*. Fix the wallet, and the person fixes the life.
      *   **Presupposition:** The market is functional. If you have cash, you can buy what you need.

  *   **Way 2 (Libraries/Schools) assumes "Democratic Equality" (or Merit Goods).**
      *   **Theory:** Fairness means everyone participates in the same civic infrastructure.
      *   **Logic:** Some things are too important to be left to individual choice or market quality. If schools were cash vouchers, rich kids would go to good schools and poor kids to bad ones, creating caste separation. By giving the *thing* (the school building, the library book), the state ensures a shared standard of citizenship.
      *   **Presupposition:** Certain capabilities (reading, learning, moving) must be guaranteed directly, not mediated by money.

  *   **Way 3 (Ramps vs. Checks) assumes "The Capability Approach."**
      *   **Theory:** Fairness means everyone can actually *do* the same things.
      *   **Logic:** This comes from economist Amartya Sen. He argued that giving a disabled person the same *resources* as an able-bodied person isn't fair, because they need more resources to achieve the same *functioning*.
      *   **Presupposition:** The barrier is sometimes the environment, not the person. Equality is about "access to function," not "access to cash."

  ### 2. What the Combination Assumes About Equality

  If we take all three ways as one system, the government is operating on a theory of **"Threshold Sufficiency of Functioning."**

  The system does not actually care if everyone is *equal*. It cares if everyone is *above a line*.
  *   **Way 1** ensures you don't fall below the biological line (starvation).
  *   **Way 2** ensures you don't fall below the civic line (illiteracy/isolation).
  *   **Way 3** ensures you don't fall below the physical access line (exclusion).

  **The Implicit Contract:** The government assumes that **agency is good, but outcomes are mandatory.**
  It prefers to give you cash (Way 1) because that respects your agency. But the moment your agency might fail to produce the "correct" outcome (you might not buy food; you might not educate your kids; you might not be able to enter a workplace), it switches to giving you the *thing* or changing the *world* (Ways 2 & 3).

  So, the system presupposes that **equality is the ability to function as a normal citizen, but the method of getting there depends on how much the government trusts you to choose.**

  ### 3. The Inconsistency: The Disability Paradox

  You hit on the biggest crack in the system: **Wheelchairs get ramps; blind people sometimes get checks.**

  Is this inconsistent? Under the **Resource** view, yes. Under the **Capability** view, it depends on the "Conversion Factor."

  *   **The Wheelchair Case:** No amount of cash allows a wheelchair user to enter a building with stairs. The market cannot solve this individually. The *environment* is the bottleneck. Therefore, the system *must* change the world (the ramp) to equalize capability.
  *   **The Blindness Case:** A blind person can often navigate a standard building with tools (canes, guide dogs, screen readers). These are purchasable goods. Therefore, the system treats it as a resource deficit and hands over cash (or tax breaks) to buy the tools.

  **The Real Inconsistency:**
  The inconsistency isn't about the disability; it's about **who pays for the fix.**
  *   **Ramps:** The cost is socialized. The employer/building owner (society) pays to change the environment.
  *   **Blindness Aids:** The cost is often privatized. The individual gets a check to manage the problem themselves.

  This reveals a hidden bias in the system: **It prefers to change the environment only when the individual literally cannot fix it themselves.** If there is a market solution (buy a guide dog), the government prefers to give cash and keep the burden of management on the individual. If there is no market solution (fly up to the second floor), the government mandates structural change.

  ### 4. The Thought Experiment: Committing to One Idea

  If the government stopped hedging and committed to one theory of equality, the "mess" would resolve, but radical changes would be required.

  #### Scenario A: Pure Resource Egalitarianism (Equality of Money)
  *The belief: "Fairness is equal purchasing power. You know best what you need."*
  *   **Way 1 (Cash):** Expanded. Food stamps become Universal Basic Income. No restrictions on spending.
  *   **Way 2 (Libraries/Schools):** **Abolished or Privatized.** Why fund a public library? Give people cash to buy books or join private clubs. Why public schools? Give vouchers; let parents choose.
  *   **Way 3 (Ramps):** **Abolished.** Employers give disabled employees a "disability allowance." If the building has stairs, the employee uses the cash to hire a porter or move to a different building. The environment stays static; the wallet adjusts.
  *   **Result:** Maximum individual freedom, but high risk of segregation and exclusion. If the cash isn't enough to buy access, you're out of luck.

  #### Scenario B: Pure Capability Approach (Equality of Functioning)
  *The belief: "Fairness is everyone being able to do the same things, regardless of cost."*
  *   **Way 1 (Cash):** **Restricted or Abolished.** Food stamps become universal free meals. Housing becomes guaranteed public housing. Cash is inefficient because you might spend it on the wrong thing. The state guarantees the *outcome* (you are fed), not the *means*.
  *   **Way 2 (Libraries/Schools):** **Expanded.** Everything becomes a public service. Internet, transit, childcare. All free at the point of use to ensure capability isn't tied to income.
  *   **Way 3 (Ramps):** **Universalized.** Every disability gets environmental fixes. Blind people don't get checks; streets get audio signals, documents get braille by default. The world bends to the person, always.
  *   **Result:** High security and access, but high paternalism. The state decides what "functioning" looks like and builds the world to match, leaving less room for individual preference.

  #### Scenario C: Pure Welfarism (Equality of Happiness)
  *The belief: "Fairness is everyone feeling equally satisfied."*
  *   **Way 1, 2, & 3:** All become **Means-Tested for Happiness.**
  *   If you love books but hate transit, the library stays but transit fares go up. If you are disabled but say you don't mind stairs, no ramp is built.
  *   **Result:** Administrative nightmare. The government would have to constantly survey your emotional state. This is why no government actually does this.

  ### 5. Conclusion: What the "Mess" Actually Is

  Your city's system isn't random. It is a **pragmatic layering of theories based on risk management.**

  1.  **For basic survival (Food):** It fears you might starve, but it also fears controlling you too much. So it gives **restricted cash** (food stamps). It's a compromise between Resource and Capability.
  2.  **For civic foundation (Schools/Libraries):** It fears class segregation more than it fears inefficiency. So it gives **universal goods**. This is pure Democratic Equality.
  3.  **for access (Disability):** It follows the path of least resistance. If the market can fix it (blindness aids), it gives **cash**. If the market fails (stairs), it mandates **structure**.

  **The Verdict:**
  The system presupposes that **equality is about maintaining a minimum floor of civic participation.**
  *   It uses **Cash** when the market is efficient and diverse needs exist.
  *   It uses **Public Goods** when social cohesion is at risk.
  *   It uses **Structural Change** when the market physically cannot solve the problem.

  The inconsistency you feel (cash for blindness, ramps for wheels) is the friction between **trusting the market** vs. **acknowledging market failure.** The system is trying to spend the least amount of political capital possible. It gives cash when it hopes you'll fix yourself, and it builds ramps only when it realizes you can't.

  If you wanted to make it consistent, you'd have to decide: **Do we trust people to navigate an unequal world with extra money, or do we owe everyone a world that is already navigable?** Currently, the answer is "It depends on how expensive the ramp is."
