  The most severe tension exists between (4) and (5). This is a logical contradiction. (4) defines privacy as control, preserved when you decide who receives information. (5) asserts that privacy norms remain in force even after you voluntarily decide to hand information over (e.g., the therapist). You cannot claim privacy is solely contingent on individual control while admitting that social norms override consent.

  *Resolution:* To keep (5), you must drop (4). **Cost:** You lose the libertarian "data ownership" framework; privacy becomes a social obligation rather than individual power. To keep (4), you must drop (5). **Cost:** The therapist case becomes indefensible; privacy becomes fully commodifiable, undermining the protective intent of (1).

  The second tier of tension involves (2) conflicting with both (5) and (6). (2) reduces privacy to property and liberty. (6) posits a violation without trespass (property) or impeded choice (liberty). Similarly, (5) suggests norms override contractual liberty (the signed form). If (2) holds, (5) and (6) are impossible.

  *Resolution:* To keep (5) and (6), drop (2). **Cost:** You must argue for a distinct right to privacy, complicating legal theory and losing reductionist parsimony. To keep (2), drop (5) and (6). **Cost:** You must deny the telescope violation and allow therapists to sell data, contradicting strong moral intuitions.

  (1) and (3) present an apparent tension that dissolves. (1) claims instrumental value (autonomy). (3) rejects "nothing to hide." Surveillance can chill autonomy (instrumental harm) without data misuse. Thus, (1) accommodates (3) if the "instrument" is understood broadly enough to include the psychological effects of observation. However, this relies on proving surveillance always harms autonomy, which is empirically fragile.

  **Single Revision:** Abandon (4).

  (4) is the linchpin of instability. It directly negates (5) and fits poorly with (6), where control isn't "taken" but expectations are breached. Dropping (4) in favor of a normative expectation view (aligned with 5) resolves the definitional contradiction. It also eases pressure on (2); while contextual norms still challenge reductionism, they are less easily dismissed than "control" claims when no property right exists. By replacing "control" with "normative integrity," you preserve the core intuitions of (3), (5), and (6) while maintaining the instrumental justification of (1). You will still need to soften (2) to accommodate (5) and (6), but removing (4) eliminates the immediate logical incoherence.
