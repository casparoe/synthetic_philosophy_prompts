answer: |-
  This scenario forces your brother's evolution-based definition to bend or break, as it must either exclude a self-sustaining, dying entity that behaves like a cell or stretch the concept of heredity beyond recognition.

  Imagine a **Synthetic Autopoietic Vesicle (SAV)** constructed in a standard biochemistry lab. It is a lipid bubble enclosing a specific network of organic catalysts. These catalysts consume a supplied chemical fuel to repair the lipid membrane and regenerate the catalysts themselves, maintaining a specific internal chemical gradient. If you cut off the fuel, the membrane degrades, the gradient collapses, and the vesicle dissolves—it dies. It grows until physical shear forces split it into two smaller vesicles. However, the SAV lacks any genetic polymer (DNA/RNA). Its "organization" is stored entirely in the analog concentrations and spatial arrangement of the catalysts. When it splits, these concentrations are partitioned randomly; there is no template mechanism to reconstruct the specific catalytic network in the daughters. Most daughters fail to sustain the cycle and dissolve; those that do survive possess a random soup of chemicals, not a copied "instruction set." Because the specific organization cannot be faithfully transmitted, there is no heredity, no accumulation of variation, and no Darwinian evolution. The incapacity is mechanical: analog chemical states degrade upon division without digital templating.

  Your metabolism picture classifies the SAV as alive without hesitation. It maintains a boundary, fights entropy using energy, and ceases to function when energy is removed. It fits the "working to keep itself going" criterion perfectly. Your brother's evolution picture classifies it as not alive. Despite its metabolic autonomy and death, it cannot undergo replication with heritable variation. It is a chemical process, not a lineage. The feature doing the real work here is the **absence of a discrete information carrier**, which decouples self-maintenance from lineage continuity.

  Your brother might try to rescue his definition by arguing that the SAV participates in a form of "compositional inheritance," where stable catalysts persist in daughters often enough to allow weak selection. But if you stipulate the chemistry ensures rapid degradation of specific ratios (making inheritance statistically impossible), he must resort to a patch: claiming the SAV is a "living process" even if not a "living thing," or that life is a continuum and the SAV is just "very alive-ish." This weakens the principled sharpness of his Darwinian threshold, effectively admitting that metabolism matters even without evolution. Alternatively, he might argue the *lab environment* acts as the replicator, making the SAV a phenotype of the scientists, but this shifts the locus of life away from the entity itself, which feels like moving the goalposts.

  The strongest complaint against your metabolism picture here is the **Flame Problem**. A flame consumes fuel, maintains a structure, grows, and dies if fuel is cut, yet we intuitively reject it as alive. The SAV is chemically sophisticated, but without reproduction, the distinction between a self-maintaining chemical dissipative structure (like a complex flame) and a living organism becomes blurry. Your definition risks over-inclusion, classifying any stable, energy-consuming vortex as alive unless you smuggle in a requirement for complexity that looks suspiciously like reproduction.

  If you modify the SAV to include an RNA strand that templates its own replication during division, the asymmetry of your disagreement becomes stark. Your brother's definition flips instantly: the entity is now alive because the switch for heritable variation has been toggled. Your definition barely registers the difference; the entity was already alive because it was already self-maintaining, and the RNA just makes it more robust. The case demonstrates that your brother's definition is binary and dependent on lineage potential, while yours is continuous and dependent on present-state autonomy.
