answer: |-
  **St. Cerebrum Regional Hospital**
  **Department of Interdependent Care | Patient Intake FAQ**
  **Ward 4B: Sustained Harmony Unit**

  **1. How long will the attachment last?**
  Standard recovery protocols require a nine-month integration period. While some cases extend longer, the Society of Music Lovers generally schedules disconnection procedures at term. Please note that duration estimates are contingent on the Violinist's renal recovery rate, not your personal convenience.

  **2. Am I permitted to disconnect before the term ends?**
  Patients retain bodily autonomy at all times. You may request disconnection via the bedside terminal. Please be advised that disconnecting is classified administratively as "Withdrawing Life Support" rather than "Active Termination." Consequently, the Violinist's death certificate will list "Renal Failure" as the cause of death. However, your insurance provider may flag the account for review. We distinguish sharply between killing a person and refusing to let them use your kidneys; billing codes reflect this distinction.

  **3. I didn't sign up for this. Did I consent?**
  Consent is evaluated on a case-by-case basis. Please review Section 14, Paragraph C of your General Admission Forms regarding "Biological Contingencies." Some legal precedents suggest that by residing within the hospital catchment area, you accept certain communal risks. However, mere presence does not constitute a contract for nine months of bodily service. If you signed a specific waiver, that is binding. If you did not, you are generally within your rights to decline, though our Ethics Committee encourages patience.

  **4. What if I was attached without my knowledge (e.g., by a burglar)?**
  This falls under "Criminal Attachment Protocol." If a third party surgically connected you to a Violinist without your consent, you are not obligated to remain attached. The hospital does not enforce Samaritanism where criminal violation has occurred. You may disconnect immediately without penalty. We do not require victims of burglary to sustain the lives of those placed upon them by criminals.

  **5. What is the hospital's stance on Samaritanism?**
  St. Cerebrum adheres to a Tiered Samaritan Policy.
  *   **Level 1: Minimally Decent Samaritan (Mandatory).** This involves basic non-interference with others' rights. You are not required to sacrifice your bodily integrity to save another.
  *   **Level 2: Good Samaritan (Voluntary).** This involves significant personal sacrifice for another's benefit. We applaud Level 2 behavior and offer parking vouchers and cafeteria discounts for participants, but we cannot mandate it. No patient is compelled to be a Good Samaritan against their will.

  **6. What about airborne spores or people-seeds?**
  These cases are handled in Annex C. If you installed window screens to prevent spore drift, you have taken reasonable precautions. If a spore enters due to screen malfunction and takes root, liability is nuanced. However, if you knowingly left windows open in a spore-heavy zone, you may be deemed to have assumed the risk. We recommend high-quality filtration for all residents near the Conservatory.

  ***

  **WARD 4B POLICY SUMMARY**

  | Policy | Status | Notes |
  | :--- | :--- | :--- |
  | **Right to Life** | Recognized | Does not include right to use another's body. |
  | **Disconnection** | Permitted | Classified as letting die, not killing. |
  | **Consent** | Verified | Fine print may apply; criminal attachment voids consent. |
  | **Samaritanism** | Tiered | Level 1 required; Level 2 rewarded but optional. |
  | **Spore Liability** | Conditional | Dependent on filtration maintenance records. |

  *For further clarification, please consult the Ethics Liaison. Do not attempt to separate tubing manually.*
