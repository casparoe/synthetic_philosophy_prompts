      *   *Section 3: The Dissertation Pivot.* Don't write a thesis *about* DH theory. Write a history thesis *using* DH that exposes these tensions. Case study is key.
      *   *Section 4: Timeline/Risk.* What changes the ranking? (e.g., LLMs making preprocessing opaque).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just tell them to write a methods critique. History departments often hate pure methodology dissertations. The user needs a *historical* question that *requires* this methodological scrutiny to answer.
      *   *Adjustment:* Emphasize that the "Question" the advisor wants is likely a historical one, where the *method* is the intervention.
      *   *Specific Advice:* Suggest a "Controlled Experiment" approach. Run the model, change the cleaning, show the history changes. That proves the Carr point empirically.

  7.  **Final Polish:** Check against the prompt requirements.
