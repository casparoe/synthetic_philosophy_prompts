      Dear Colleague,
      It is a pleasure to assist you in constructing this final examination question. Below I have drafted the question itself, followed by a model answer that demonstrates the depth of analysis required, and concluded with a marking scheme that delineates the specific philosophical moves distinguishing excellent work from superficial recitation.

      Question 1. Consider the following case. A provincial government must choose between two flood-defense programs. The Rapid Program is completed in three years through round-the-clock shifts; the disruption of daily life changes which conceptions occur when, though not how many children are eventually born, and the defenses it builds prove underbuilt, so that a century later the people alive — all of whom owe their existence to that choice, since their parents would never have met on the other timeline — live cramped, anxious lives that are nonetheless worth living. The Phased Program takes twenty years, and its labor-migration and deferred-marriage side effects change which conceptions occur and also shrink the total number of children born; the smaller later population lives long, comfortable lives behind strong defenses. No one exists under both programs. Evaluate the moral significance of this choice. Specifically, explain why the variation in population size prevents the person-affecting view from relying on the same-number quality claim, and determine whether this compound difficulty renders the person-affecting restriction untenable.

      Model Answer. This case presents a compounded challenge to person-affecting views that exceeds the standard nonidentity problem found in Parfit's work. In the standard nonidentity problem, a choice affects who comes into existence but not how many people exist. Here, the Rapid Program results in a larger population with lower quality of life, while the Phased Program results in a smaller population with higher quality of life. Crucially, because the specific individuals in the future differ between outcomes due to the timing of conceptions, no individual is harmed by the choice of the Rapid Program in the comparative sense required by person-affecting views. The people living cramped lives in the Rapid scenario would not have existed at all had the government chosen the Phased Program. Since their lives are worth living, they are not worse off than they would otherwise have been. Therefore, a strict person-affecting view must conclude that choosing Rapid is not worse than choosing Phased, because there is no particular person for whom Rapid is worse.

      However, the variation in population size blocks the standard escape route available to person-affecting theorists in same-number cases. Parfit's Same Number Quality Claim suggests that if the same number of people would exist in two outcomes, it is worse if those people have a lower quality of life, even if they are different people. This claim allows theorists to bypass the nonidentity issue while maintaining some person-affecting intuitions. In this flood-defense case, that claim is inapplicable because the numbers differ. The Phased Program creates fewer people. Consequently, the theorist cannot simply argue that the larger group is worse off than the smaller group would have been, because they are not the same group, nor is it the same number of people.

      This forces the person-affecting view into a dilemma. If it maintains that an outcome can only be worse if it is worse for particular people, it must declare the Rapid Program permissible, or at least not worse than the Phased Program, despite the intuitive judgment that a world of cramped, anxious lives is inferior to a world of comfortable lives, even if the latter contains fewer people. This implies that adding more people with lives worth living but lower quality is not worse than having fewer people with higher quality, which risks collapsing into a form of total utilitarianism that ignores quality, or else it implies an absurd neutrality where adding miserable people (provided lives are worth living) is not bad. Conversely, if the theorist admits that the Phased Program is better, they must appeal to an impersonal principle, such as average utility or a principle of beneficence that does not require a specific beneficiary. This admission conceded that the person-affecting restriction is untenable when identity and number both vary. The case demonstrates that the nonidentity problem is not merely about identity dependence but about the inability of person-affecting views to handle variable population counts without contradicting strong moral intuitions about quality of life. Thus, the flood-defense case shows that solving the nonidentity problem requires more than adjusting for identity; it requires abandoning the restriction that moral value must be anchored to specific subjects.

      Marking Scheme. To secure an A grade, the student must explicitly identify that this is not a standard nonidentity case because the population size varies between the two options. They must explain that the Person-Affecting View typically relies on the claim that an act is wrong only if it makes someone worse off, and show why this claim yields the counterintuitive result that the Rapid Program is not wrong. Crucially, an A answer must articulate why Parfit's Same Number Quality Claim cannot rescue the person-affecting view here, noting that the claim requires equal population sizes. They should conclude that the variation in number forces a choice between accepting counterintuitive results or adopting an impersonal view. A B-grade answer will correctly identify the nonidentity problem and explain that the future people owe their existence to the choice, noting that they are not harmed. However, a B answer will likely treat the case as a standard nonidentity problem, failing to emphasize the significance of the shrinking population in the Phased Program. They may mention Parfit but will not explain why the variable number blocks the Same Number Quality Claim, instead relying on general objections to person-affecting views that apply to same-number cases. The memorized-label answer, which deserves a failing grade, will simply recite the definition of the nonidentity problem and Parfit's Repugnant Conclusion without applying them to the specific details of the flood-defense case. Such a student will argue that the Rapid Program is wrong because it harms future people, failing to notice the identity dependence, or they will discuss the Repugnant Conclusion despite the fact that the populations here are not vast enough to trigger that specific paradox. They will treat the case as if the same people exist in both outcomes, missing the core philosophical constraint provided in the prompt.

      Best wishes for the seminar.

