answer: |-
  ### Seminar Design: The Absent-Minded Driver

  **Class Profile:** 14 students, 75 minutes, upper-level seminar.
  **Goal:** Empirical discovery of the optimal mixed strategy ($p=2/3$) and the intuition behind ex-ante commitment.

  ---

  ### 1. Grouping Scheme
  **Seven Pairs (Driver & Environment).**
  Divide the class into 7 pairs. In each pair, designate one student as the **Driver** and the other as the **Environment (Env)**.
  *   **Rationale:** Pairs are small enough to ensure active participation but large enough to enforce the information constraint (one person knows the state, the other must not).
  *   **Rotation:** Halfway through the session (after the tournament), partners swap roles. This ensures everyone experiences the "absent-minded" constraint personally.

  ### 2. Physical Procedure: The "Interference Protocol"
  The partner/counting method you proposed is vulnerable to covert signaling. To rigorously enforce the information set constraint, use the **Interference Protocol**.

  **Materials per Pair:**
  *   Two identical index cards, both labeled **"INTERSECTION"** (bold, centered, no other marks).
  *   One six-sided die (d6).
  *   One "Policy Sheet" for the Driver.
  *   One "Score Sheet" for the Env.

  **The Procedure:**
  1.  **Commitment:** Before the trip begins, the Driver writes a **Policy** on the Policy Sheet. This must be a rule based on the die (e.g., "On 1–4 Continue, on 5–6 Exit"). They cannot change this during the trip.
  2.  **Intersection 1:** The Env places Card 1 face up. The Driver looks at it. The Driver rolls the die (hidden from Env to prevent bias, or openly if trust is high) and announces "Continue" or "Exit" based on their Policy.
      *   *If Exit:* Trip ends. Score recorded (0 points).
      *   *If Continue:* Env removes Card 1.
  3.  **Interference:** The Driver must turn their chair away from the table and recite the **months of the year backwards** ("December, November, October...") aloud. This wipes working memory of the previous action and prevents counting time elapsed.
  4.  **Intersection 2:** While the Driver is reciting, the Env places Card 2 face up. The Driver turns back. The card looks identical to Card 1. The Driver rolls the die and applies the *same* Policy.
      *   *If Exit:* Score recorded (4 points).
      *   *If Continue:* Score recorded (1 point).

  **Why this improves on your idea:** The verbal interference task is cognitively demanding enough to prevent covert counting ("I've been sitting here 10 seconds, so this must be the second one") and the identical cards prevent visual cueing.

  ### 3. Points-Based Scoring System
  **Currency:** "Utility Points" (UPs).
  **Payoff Structure:**
  *   Exit at Intersection 1: **0 UP**
  *   Exit at Intersection 2: **4 UP**
  *   Pass Both Intersections: **1 UP**

  **Incentive:** No money is exchanged. Instead, maintain a **Leaderboard** on the whiteboard.
  *   **Round Winner:** The pair with the highest average UPs per trip in a round gets a checkmark next to their names.
  *   **Seminar Prize:** The pair with the most checkmarks at the end chooses the "Warm-up Puzzle" for the next seminar session (a low-cost, high-prestige reward).

  ### 4. Tournament Structure
  The tournament runs for three rounds (approx. 25 minutes total).

  **Round 1: The Naive Plan (5 mins)**
  *   **Instruction:** "Plan the route that maximizes points."
  *   **Expected Outcome:** Drivers will write "Exit at Second."
  *   **The Crash:** When they run the protocol, they will inevitably exit at the first (because they can't distinguish) or pass both (because they guess wrong).
  *   **Debrief Moment:** Ask, "Why did your plan fail?" Elicit that the plan required information they didn't have.

  **Round 2: The Deterministic Constraint (5 mins)**
  *   **Instruction:** "You must choose one action for *both* intersections. Either Always Exit or Always Continue."
  *   **Expected Outcome:**
      *   Always Exit ($p=0$): Score 0.
      *   Always Continue ($p=1$): Score 1.
  *   **Realization:** Both are suboptimal compared to the theoretical max of 4.

  **Round 3: The Mixed Strategy Market (15 mins)**
  *   **Instruction:** "You may now use the die to randomize. Submit a policy (e.g., Continue on 1–X). You have 3 trips to test and adjust. On the 4th trip, you submit your **Final Policy** for grading."
  *   **Process:** Pairs tinker. Some will try $p=1/2$. Some will try $p=5/6$.
  *   **Empirical Discovery:** The pairs that hover near **Continue on 1–4** ($p=2/3$) will consistently top the leaderboard.
  *   **Data Collection:** Write the top 3 policies and their scores on the board.

  ### 5. Debrief: Mapping Activity to Theory
  Gather the class. Use the whiteboard to formalize what they just lived. (20 mins)

  **A. The Payoff Function**
  Ask a student to derive the expected value based on the tournament data.
  *   Let $p$ = Probability of **Continuing**.
  *   Prob(Exit 1) = $(1-p)$. Payoff = 0.
  *   Prob(Exit 2) = $p(1-p)$. Payoff = 4.
  *   Prob(Pass Both) = $p^2$. Payoff = 1.
  *   **Expected Utility:** $E[U] = 0 + 4(p - p^2) + 1(p^2) = 4p - 3p^2$.

  **B. The Optimum**
  *   Maximize $4p - 3p^2$.
  *   Derivative: $4 - 6p = 0 \Rightarrow p = 2/3$.
  *   Compare this to the tournament winners. They should match.

  **C. The Counterintuitive Result**
  *   Highlight the prompt's specific point: "Voluntarily throwing away trips."
  *   At $p=2/3$, the probability of exiting at Intersection 1 is $1/3$.
  *   **Discussion:** "Why is it rational to exit at the first intersection 33% of the time, knowing the payoff is 0?"
  *   **Answer:** You aren't paying a cost to exit; you are buying *insurance* against blowing past the second intersection. If you never exit early ($p=1$), you guarantee the low payoff of 1. By accepting a 33% risk of the 0-payoff, you position yourself to capture the 4-payoff more often than you overshoot. It is a **hedging strategy** necessitated by the information constraint.

  **D. Ex Ante vs. Ex Interim**
  *   **Ex Ante (Home):** You commit to $p=2/3$. This maximizes expected utility.
  *   **Ex Interim (At the Node):** If you ask, "I am at an intersection; should I continue?" the calculation gets murky (introduce the Piccione/Rubinstein time-inconsistency briefly). If you believe you are likely at the second intersection, you might want to exit. But your policy must be fixed *ex ante*. The activity forces the *ex ante* view because you wrote the Policy Sheet before moving.

  ### 6. Predictable Failure Modes & Limitations

  **A. Cheating and Covert Counting**
  *   **Risk:** Drivers tapping feet, timing the interval, or Env coughing on the second card.
  *   **Mitigation:** The "Months Backwards" interference task is loud and cognitive; it makes timing impossible. Instruct Env that if they signal, their team is disqualified.
  *   **Prediction:** On the first run, 1 or 2 pairs will try to "game" the memory constraint. Call this out during the debrief as "breaking the information set," which violates the problem statement.

  **B. The "Real Driver" Objection**
  *   **Objection:** "No real driver is this stupid. I would just pay attention."
  *   **Your Answer:** "This is not a model of psychology; it is a model of **information sets**. Imagine an automated trading algorithm that receives identical data signals at two different times. It cannot distinguish the signals because they are bitwise identical. The 'absent-mindedness' is a structural feature of the decision node, not a lack of effort. If you could 'pay attention,' you would be solving a different game where the information sets are distinct."

  **C. The Unreproducible Feature**
  *   **Honesty:** You must stipulate one thing the activity cannot reproduce: **Belief Updating.**
  *   **Explanation:** In the formal Piccione/Rubinstein paradox, there is a tension about what probability the driver should assign to *being* at Intersection 1 vs. Intersection 2 given that they have arrived at *an* intersection. This depends on their own strategy $p$.
  *   **Limitation:** In our activity, students simply maximize ex-ante payoff. They do not experience the cognitive dissonance of updating beliefs at the node ("If I'm here, does that mean I'm likely at the first one because I usually exit?"). This epistemic loop is too subtle for a 75-minute physical simulation. You must state: "We have simulated the *constraint*, but we are stipulating the *epistemology*. We assume you optimize from home, not from the driver's seat."

  ### 7. Closing Question
  **"If you could install a device in your car that physically prevented you from exiting at the first intersection, would you pay to install it?"**

  **Justification:**
  *   **Surface Level:** Students might say "Yes, to avoid the 0 payoff."
  *   **Deep Level:** The optimal strategy ($p=2/3$) *requires* exiting at the first intersection 1/3 of the time. A device that *prevents* exiting at the first forces $p=1$, which yields an expected payoff of 1. The optimal mixed strategy yields 1.33.
  *   **The Trap:** Pre-committing to *never* exit early is actually **worse** than pre-committing to a randomized device that *allows* early exit.
  *   **The Lesson:** This cements the idea that rationality under information constraints sometimes requires **retaining the option to make a 'mistake'**. It challenges the intuition that more control (the device) is always better than less control (the die). It leaves them questioning the value of flexibility versus the value of binding constraints.
