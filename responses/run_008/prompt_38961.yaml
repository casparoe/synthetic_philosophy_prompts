  ### The Separating Pair

  To cleanly separate these three rules, you need a pair that isolates the **discontinuity at probability 1** (Certainty Effect), the **discontinuity at probability 0** (CPT), and the **endogenous reference point** (DA).

  **The Pair:**
  *   **Option G:** $\$100$ for sure.
