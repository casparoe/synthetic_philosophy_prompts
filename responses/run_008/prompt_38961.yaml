  1.  **Certainty Effect:** Chooses **G**. The sure option receives a discrete "extra pull" that the risky option lacks. Even if the Expected Value of H ($\$100$) equals G, the bonus tips the scale to G.
  2.  **Disappointment Aversion:** Chooses **G**. The reference point for H will be low, but the $99\%$ chance of $\$0$ represents a massive disappointment relative to the potential gain, and the utility function is typically concave enough to prefer the sure thing.
  3.  **Cumulative Prospect Theory:** Chooses **H**. This is the critical separator. CPT features an inverse-S weighting function where small probabilities are significantly **overweighted** (e.g., $w(0.01)$ might be treated as $0.05$ or higher). This overweighting of the $1\%$ chance often makes the lottery subjectively more valuable than the sure amount, predicting risk-seeking behavior in the domain of gains for small probabilities.

