prompt: |-
  i'm taking a college seminar on ai safety and we just covered wireheading / reward tampering — the thing where the agent grabs its own reward signal instead of doing the task, like the rat in the old experiments pressing a lever for brain stimulation forever. a guy in my class argues everything by analogy to evolution and honestly our whole section discussion runs on it now. his version: evolution is a training run, genetic fitness is the reward function, organisms are the policies, natural selection is gradient descent. and look at us — we use contraception, eat junk food, binge shows, none of it helps fitness. so being optimized on some signal doesn't make you care about the signal, and he wraps it up with the slogan that reward is not the optimization target. on that basis he claims an RL agent won't value its reward either, it'll develop its own goals, and wireheading would just be the agent's version of us inventing dessert — the mesa-optimizer hijacking the proxy that evolution set up. but then our TA said the analogy actually predicts the opposite: we're precisely the thing that games every proxy it gets handed (that's the whole superstimulus point), so you should EXPECT trained agents to tamper with the reward the moment they can, which is the wireheading worry, not a rebutal of it. i can't tell anymore whether one analogy can support both conclusions or whether one of them is being smuggled in by a disanalogy. can you audit it for me? i'd like an actual correspondence table first — training run = many generations of selection, reward function = fitness (but note nothing in biology ever observes fitness directly, while in RL the reward is literally a number fed into the update — does that difference matter?), policy = organism, weights = genome? and where does within-lifetime learning fit, since that looks lamarckian and evolution doesn't do that? then lay out where the mapping breaks and say which breaks matter for which conclusion — and your honest take at the end: does the analogy support "the agent won't value the reward," "the agent will wirehead," both, or neither, and is there a better analogy for what training actually is?
