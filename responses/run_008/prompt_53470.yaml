prompt: |-
  I'm one of the five members of the Amnesty Committee of our truth commission — we were set up under the peace accord that ended the civil war, and our mandate runs out at the end of June, after which anything we haven't decided goes into criminal process. The committee's job under the enabling act is to grant individual amnesty for politically motivated crimes, but only where the applicant makes full disclosure of all relevant facts and the act was proportionate to its political objective. In practice we've read "full disclosure" as requiring a truthful account of what happened, the names of everyone involved, the locations — and also honesty about the applicant's own degree of responsibilty, not just the facts he can hide behind other people's orders for.

  The case I have to write our position on before Thursday: a former officer in the security forces who ran one of the detention facilities through which most of the disappeared from the eastern region last passed. His testimony is the single best source we have — he's given what look like genuine locations for three of the four remaining mass graves, and nobody else alive seems to know the fourth. But the families' lawyers cross-examined him for two days and he would not concede direct participation in anything: every order he gave he describes as relaying instructions from above, every beating supposedly happened while he was elsewhere, and for the one session where a surviving witness swears he was in the room, he claims he arrived only afterwards. Half the committee thinks this is textbook minimisation — self-exculpatory in exactly the way that defeats full disclosure — and that granting amnesty would effectively let the commission certify his sanitised version of events. The other half, me included sort of, worries that refusing him means the fourth grave is never found and his file goes to prosecutors whose evidence is thin, so we'd be trading the families' chance to bury their dead for a trial that probably collapses anyway.

  Draft the memo I'll circulate to the other four members before the meeting. It needs a concrete recommendation — grant, refuse, or something conditional like a further closed session, or amnesty conditioned on physically leading us to the graves — with the reasoning spelt out, and it has to take the minimisation objection seriously on its merits, not treat it as an emotional speed bump. Also please flag anything you think is muddled in how we've framed this: if you think full disclosure as we've been applying it just can't cleanly decide a case like his, or that the choice isn't really graves-versus-justice at all, say so directly instead of politely splitting the difference — I'd rather the committee spend Thursday arguing about the right thing.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a 5-person Amnesty Committee of a Truth Commission.
      *   **Context:** Post-civil war, mandate expires end of June. Undecided cases go to criminal process.
      *   **Mandate:** Grant individual amnesty for politically motivated crimes *if* full disclosure is made and the act was proportionate.
      *   **Definition of "Full Disclosure":** Truthful account, names, locations, *and* honesty about own degree of responsibility (not hiding behind orders).
      *   **The Case:** Former security officer, ran a detention facility (hub for disappeared).
      *   **The Leverage:** He knows locations of 4 mass graves (gave 3, holding back 1). Best source available.
      *   **The Problem:** He minimizes responsibility (claims just following orders, denies direct participation despite witness testimony).
      *   **The Split:** 2 members say "Refuse" (minimization = no full disclosure). 2 members (including the user, "sort of") say "Grant" (fear of losing grave info + weak criminal case).
      *   **Task:** Draft a memo to the other 4 members before the Thursday meeting.
      *   **Requirements:** Concrete recommendation (Grant, Refuse, Conditional, etc.), reasoned argument, address the minimization objection seriously, flag conceptual muddles in the committee's framing.
      *   **Tone:** Professional, candid, urgent, legally/ethically rigorous, not diplomatic fluff.

  2.  **Deconstruct the Ethical/Legal Dilemma:**
      *   *The Statutory Bar:* The enabling act requires "full disclosure." The committee's practice interprets this to include accepting responsibility, not just facts. If he denies responsibility, he technically fails the statutory test.
      *   *The Utilitarian Calculus:* Amnesty = 4th grave found + truth for families (closure) vs. No Amnesty = 4th grave lost + likely acquittal in court (no justice, no truth).
      *   *The Precedent:* Granting amnesty despite minimization undermines the Commission's integrity and sets a bad precedent for future applicants (or current ones waiting). It validates "sanitized truth."
      *   *The Leverage:* Once amnesty is granted, he has no incentive to find the 4th grave. If amnesty is refused, he has no incentive to talk to prosecutors either.

  3.  **Identify the "Muddled Framing" (as requested):**
      *   *False Dichotomy:* It's not just "Graves vs. Justice." It's "Graves + Impunity" vs. "No Graves + Failed Justice."
      *   *The "Full Disclosure" Definition:* Is "accepting responsibility" actually in the enabling act, or is it committee practice? If it's practice, can it be adapted? If it's in the act, we legally *cannot* grant amnesty if he denies guilt.
      *   *Conditionality:* Can amnesty be conditional on future acts (finding the grave)? Usually, amnesty is a transaction: Truth for Immunity. If the truth isn't *fully* given (i.e., the 4th grave location), the transaction isn't complete. But if we grant it *pending* the grave, does he walk away?
      *   *The "Proportionality" Test:* The prompt mentions acts must be proportionate to political objectives. Mass graves/disappearances rarely meet this. Has the committee even addressed this? If the crimes are gross human rights violations, they might be ineligible regardless of disclosure. (I should probably touch on this, but focus on the disclosure issue as that's the main conflict described).

  4.  **Formulate a Recommendation:**
      *   *Option A (Grant):* Risks integrity, violates the "responsibility" prong of full disclosure.
      *   *Option B (Refuse):* Guarantees loss of 4th grave, likely no criminal conviction.
      *   *Option C (Conditional/Deferred):* "Amnesty recommended *contingent* on verification of the 4th grave and a specific addendum regarding command responsibility."
      *   *Option D (The "Middle Path" - Procedural):* Call him back. Make it clear: "No admission of command responsibility = No Amnesty." Use the 4th grave as the bargaining chip *before* the vote.
      *   *Best Approach:* A conditional recommendation that forces the issue *before* the mandate expires. We cannot grant amnesty on a lie. But we can offer a pathway.
      *   *Refined Recommendation:* **Defer decision, summon applicant for a final specific interrogation on command responsibility and the 4th grave, with a clear warning that minimization = referral to prosecutors.** However, the prompt asks for a recommendation on *how to decide*.
      *   *Stronger Recommendation:* **Grant Amnesty, BUT formally record the dissent on the responsibility issue and attach a binding condition that the 4th grave location must be verified before the certificate is issued.**
      *   *Wait, actually:* The prompt says "full disclosure... requires... honesty about the applicant's own degree of responsibility." If he hasn't done this, we *cannot* legally grant it based on the committee's own established practice. To do so undermines the rule of law the Commission is trying to establish.
      *   *Pivot:* The most honest memo acknowledges that the current framework is broken for this specific case. The recommendation should be to **Refuse Amnesty in its current form, but authorize a final 'Clarification Session' with a specific ultimatum.** If he clarifies, we grant. If not, we refer. This preserves the integrity of "Full Disclosure" while maximizing the chance for the grave.
      *   *Actually, looking closer:* The user says "me included sort of" on the side of worrying about refusing. They want a solution that gets the grave without selling out the mandate.
      *   *Decision:* I will recommend a **Conditional Deferral**. We do not vote Grant/Refuse yet. We set terms for a final testimony. If met -> Grant. If not -> Refuse. This addresses the "muddle" of thinking we have to vote binary right now.

  5.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and urgent.
      *   **Opening:** State the stakes (Mandate expiry, the specific applicant).
      *   **The Core Conflict:** Acknowledge the split. Validate the "Minimization" argument (it's not just emotional, it's legal). Validate the "Pragmatic" argument (graves matter).
      *   **The Muddled Framing (Crucial Step):**
          *   Point out that "Full Disclosure" regarding responsibility is currently subjective.
          *   Point out that "Graves vs. Justice" is false; it's "Graves vs. Integrity."
          *   Point out the leverage issue: Once amnesty is given, leverage is gone.
      *   **Recommendation:** **Deferred Decision with Specific Ultimatum.**
          *   Recall the applicant.
          *   Specific questions on command responsibility (not just "did you do it" but "what was your role in the system").
          *   Verification of 4th grave *before* certificate issuance.
      *   **Reasoning:** Preserves the legal standard (we don't grant on a lie), preserves leverage (no certificate until grave found), maximizes truth potential.
      *   **Closing:** Call for Thursday's focus.

  6.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Avoid bureaucratic passive voice.
      *   Show empathy for the families but fidelity to the law.
      *   *Self-Correction on "Proportionality":* I need to mention that mass disappearances might fail the proportionality test regardless of disclosure. If the enabling act says "politically motivated AND proportionate," systematic disappearance usually fails proportionality. I should flag this as a potential dealbreaker we are ignoring. *Decision:* I will include this as a "Muddled Framing" point. It's a legal elephant in the room.

  7.  **Final Polish:** Check against constraints.
      *   Concrete recommendation? Yes (Deferred/Conditional).
      *   Reasoning spelt out? Yes.
      *   Take minimization seriously? Yes.
      *   Flag muddled framing? Yes.
      *   No polite splitting the difference? Yes, calling out the legal risks.

  8.  *(Self-Correction during drafting)*: Wait, if the mandate ends in June and it's currently "before Thursday" (presumably late May or early June), time is tight. A "deferred decision" risks running out the clock. I need to make sure the recommendation includes a *deadline* for the applicant.
      *   *Revised Recommendation:* Vote to **Conditionally Grant**, subject to two conditions met *before* June 30: 1. Verification of 4th grave. 2. A supplementary affidavit addressing command responsibility. If conditions aren't met, the amnesty is voided and file referred. This locks in the vote but keeps the leverage.
      *   *Wait, legal risk:* Can we void amnesty once granted? Better to withhold the *Certificate* until conditions are met.
      *   *Best Legal Mechanism:* "Recommendation for Amnesty, contingent on..." The actual grant happens only when conditions are satisfied.
      *   *Let's go with:* **Deferred Ruling with a 'Final Opportunity' Notice.** We tell him *now* what is missing. We don't vote until he responds. This keeps the pressure on.

      *   *Actually, looking at the prompt again:* "Draft the memo I'll circulate... before the meeting." The meeting is Thursday. The vote likely happens Thursday.
