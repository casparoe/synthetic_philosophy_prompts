      *   **Tone:** Experienced, practical, committed to one design (no "here are three options").

  2.  **Brainstorming Activity Designs:**

      *   *Idea 1: The Veil of Ignorance Lottery.* Students choose policies behind a veil.
          *   *Critique:* Too Rawlsian. Doesn't capture the pairwise "reasonable rejection" mechanic of Scanlon. Doesn't force the specific aggregation tension step-by-step.

      *   *Idea 2: The Committee Vote.* Students act as a committee deciding on resource allocation cases.
          *   *Critique:* Good, but needs to be structured so they don't just vote utilitarian immediately. Needs a "veto" mechanic to simulate reasonable rejection.

      *   *Idea 3: The "Chain of Cases" Simulation.* This is the strongest candidate. Present a series of cases (A vs. B, B vs. C, C vs. D...) where each step seems intuitively correct, but the end point contradicts the start. This creates the "money pump" or "slippery slope" effect the user wants.
          *   *Mechanic:* Students represent specific "claimants" in a scenario. They must negotiate/validate rules.
          *   *Refinement:* To make it Scanlonian, we need the "No one could reasonably reject" standard. But since we want them to *fall* into aggregation, we need to let them use a principle that *allows* aggregation without realizing it, or force them to make pairwise judgments that imply aggregation.
          *   *Better Refinement:* Let's use a "Legislative Chamber" model. They are drafting a principle to govern a specific type of conflict. We run through a sequence of scenarios. In each scenario, they must decide if a proposed principle is *rejected*.
          *   *Wait, simpler is better for 12 students.* Let's make them the *arbiters*. They are the "Court of Reasonable Rejection." They hear pairs of complaints.
          *   *The Twist:* The "Transitivity Trap." We present Case 1 (Save 1 Life vs. Save 100 from Headaches). Most say Save 1 Life. Case 2 (Save 1 Life vs. Save 100 from Broken Arms). Most say Save 1 Life. ... Case N (Save 1 Life vs. Save 100 from Death). Wait, that's not the aggregation problem.
          *   *The Aggregation Problem:* Save 1 from Death vs. Save N from Minor Injury.
          *   *Sequence:*
              1.  1 Death vs. 1 Headache. (Save 1 from Death).
              2.  1 Death vs. 10 Headaches. (Save 1 from Death).
              3.  1 Death vs. 100 Headaches. (Maybe switch? Or keep going?)
              4.  1 Death vs. 1 Broken Arm.
              5.  1 Death vs. 10 Broken Arms.
              ...
              6.  1 Death vs. 1000 Broken Arms.
          *   *The Trap:* If they say "Save the 1 from Death" in every pairwise comparison of *individual complaints* (1 person dying vs 1 person with headache), they must save the 1 from Death even against 1 million headaches. But intuitively, 1 million headaches might outweigh 1 death.
          *   *Wait, Scanlon's view:* Scanlon actually *denies* aggregation in the strong sense. He says you compare the strongest individual complaint on each side. So 1 Death > 1 Headache, regardless of how many headaches.
          *   *The Pedagogical Target:* The user wants them to feel the tension. They should walk into endorsing aggregation (Utilitarianism) and then realize Contractualism blocks it. OR, they should try to be Contractualists, realize it leads to "absurd" results (never saving the many from small harms to save the one from death), and feel the pull of aggregation.
          *   *Correction:* The prompt says: "they've walked themselves into endorsing aggregation, and then they have to figure out which step they want to take back." Okay, so the game mechanics should lead them to aggregate, then the debrief reveals Contractualism says "No."
          *   *Actually, re-reading:* "What I'd love is for them to hit this themselves... they've walked themselves into endorsing aggregation, and then they have to figure out which step they want to take back."
          *   *Okay, the goal is to show why Aggregation is tempting (the slippery slope) but also why Contractualism resists it.*
          *   *Design:* "The Principle Drafting Game." They must agree on a rule. We test the rule against cases. If the rule fails a case they intuitively agree on, they must revise the rule. The revision process leads them to aggregation. Then we reveal Scanlon's rule blocks the revision.

      *   *Idea 4 (Selected): "The Complaint Tribunal."*
          *   Students are judges.
          *   There are two parties in each case: "The One" (facing severe harm) and "The Many" (facing lesser harm).
          *   They don't vote on the outcome directly. They vote on whether "The Many" can *reasonably reject* a policy that saves "The One."
          *   We ramp up the number of "The Many."
          *   Round 1: 1 Death vs. 1 Headache. (Many cannot reject saving the One).
          *   Round 2: 1 Death vs. 10 Headaches.
          *   Round 3: 1 Death vs. 100 Headaches.
          *   Round 4: 1 Death vs. 1,000 Headaches.
          *   Round 5: 1 Death vs. 1,000,000 Headaches.
          *   *The Trap:* At some point, students will say "Okay, the Many can reject saving the One."
          *   *The Catch:* If they say "Yes, they can reject" at Round 5, but "No, they can't" at Round 1, *why*? What changed? The *individual* complaint didn't change (still a headache). Only the *number* changed.
          *   *The Realization:* To justify the switch, they had to aggregate.
          *   *The Contractualist Check:* Scanlon says you can't aggregate. So if you are a strict contractualist, you must save the One even against 1 million headaches.
          *   *This fits the prompt perfectly.* It forces them to use aggregation to get the intuitive result, then exposes the conflict with the theory they just read.

  3.  **Fleshing out the Mechanics:**
      *   **Roles:** 12 Students. Split into 3 groups of 4? Or keep as one plenary? Plenary is better for shared pressure, but small groups ensure everyone talks. Let's do one plenary "Tribunal" to maximize the public commitment effect.
      *   **Materials:** Case Cards. A "Verdict Sheet."
      *   **Procedure:**
          1.  Explain the role: You are arbiters of "Reasonable Rejection."
          2.  Explain the standard: A policy is rejected if *someone* has a complaint that no one could reasonably reject.
          3.  Run 5 Rounds.
          4.  In each round, ask: "Can the Many reasonably reject the policy 'Save the One'?"
          5.  Record the vote.
          6.  If they switch from No to Yes, pin down *why*.
      *   **Stakes:** Use "Social Points" or just the intrinsic stakes of the cases. Let's keep it abstract but vivid.
      *   **Time:** 50 mins for game, 40 for debrief.

  4.  **Refining the "Trap":**
      *   If they stick to Contractualism strictly, they never switch.
      *   If they switch, they admit aggregation.
      *   I need to make sure they *want* to switch. The cases need to be extreme enough. 1 Death vs 1,000,000 Migraines. Most people feel the migraines win.
      *   But I also need to show *why* someone would accept aggregation. The debrief needs to validate the aggregation intuition (it's not stupid) while showing why Scanlon blocks it (fairness to the individual).

  5.  **Drafting the Content:**

      *   *Title:* "The Tribunal of Reasonable Rejection."
      *   *Setup:* Clear instructions. No mention of "aggregation" or "utilitarianism."
      *   *Rounds:* Carefully calibrated.
          *   Case A: 1 Death vs. 1 Headache.
          *   Case B: 1 Death vs. 10 Headaches.
          *   Case C: 1 Death vs. 100 Headaches.
          *   Case D: 1 Death vs. 10,000 Headaches.
          *   Case E: 1 Death vs. 1,000,000 Headaches.
      *   *The Pivot:* When they flip the verdict, ask them to write down the *principle* they used.
      *   *Debrief:* Connect the flip to "Summing." Connect the initial stance to "Individual Comparison."
      *   *Failure Modes:*
          *   *Stubborn Contractualists:* They never flip. *Fix:* Ask "Are you sure? Even if the headaches cause suicide? Even if it's the whole world?" Push the intuition.
          *   *Utilitarians:* They flip immediately. *Fix:* Ask "What about the person dying? Is their complaint worth nothing?"
          *   *Gaming:* Students treating it as a logic puzzle. *Fix:* Emphasize the moral weight.
      *   *Limitations:* Can't simulate the *normative force* of "Reasonable." Can only simulate the *structure*.

  6.  **Review against Constraints:**
      *   12 students? Yes, plenary works.
      *   90 mins? Yes (50/40 split).
      *   No lecture up front? Yes.
      *   Commit to one design? Yes.
      *   Address failure modes? Yes.
      *   Address limitations? Yes.
      *   Show *why* aggregation is tempting? Yes, by making the "Many" case overwhelming.

  7.  **Final Polish:**
      *   Make the instructions teacher-ready.
      *   Ensure the "Debrief" section explicitly maps to Scanlon's terminology (Generic Reasons, Individualist Restriction).
      *   Add a specific "Meta-Rule" reveal at the end to crystallize the lesson.

      *(Self-Correction during drafting)*: I need to be careful not to make Scanlon look *too* absurd. Scanlon allows some aggregation (in later work/clarifications) or at least acknowledges the tension. But for a 2nd-year course on *What We Owe*, the strict "Individualist Restriction" is the key teaching point. I will stick to the strict interpretation for clarity, but note in the limitations that Scanlon's view is nuanced.
      *Actually, the prompt asks to show why someone would accept aggregation.* I need to make sure the debrief validates the aggregation intuition as "concern for the greater good" or "minimizing total suffering," not just "you made a mistake."

      *Revised Plan for the "Flip":* Instead of just voting, ask them to draft the *Principle* that justifies their vote.
      Round 1-3: Principle = "Severity of harm trumps number."
      Round 4-5: Principle = "Total burden matters."
      This makes the contradiction explicit in their own writing.

      *Wait, one more thing:* The prompt says "they make a series of pairwise choices... and only at the end do they notice where they've arrived."
      So, I shouldn't ask them to draft principles *during* the rounds. I should just get verdicts. Then, in the debrief, ask them to reconstruct the principle that justifies the *set* of verdicts. That's where the contradiction hits. "You said No in Round 1, but Yes in Round 5. The individual harm didn't change. What changed? The Number. So you aggregated."

      *Okay, ready to write.*

  8.  **Final check on tone:** Professional, experienced, practical. "Here is exactly how to run it."

      *(One last thought on Failure Modes)*: What if they say "The headaches become severe when there are enough of them?" No, keep the harm constant per person. "Each person has a migraine." Not "A collective migraine." I need to specify this in the rules to prevent cheating.

