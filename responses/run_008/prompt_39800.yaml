      *   *Entry:* Baptism/Registration.
      *   *Exit:* Formal civil act (*Kirchenaustritt*) at a court/registry.
      *   *Consequence:* Civil (no tax) + Religious (sacramental exclusion).
      *   *Constitutional Basis:* Basic Law (*Grundgesetz*) Art. 140 + Weimar Constitution Art. 137. State neutrality but cooperation (*hinkende Trennung* - limping separation).
      *   *History:* Secularisation of 1803 (*Reichsdeputationshauptschluss*). Church lost land, state promised compensation. Tax replaced endowment income.

  3.  **Evaluate the "Theory of Religion":**
      *   *User's Hypothesis:* Religion as "club membership" (voluntary association).
      *   *Church's View:* Religion as "ontological status/belief" (sacramental character).
      *   *State's Role:* Neutral administrator vs. Certifier of spiritual status.
      *   *The Tension:* The state treats it as a civil contract (you can quit), but the church treats the civil quit as a spiritual sin (apostasy). The state facilitates the collection based on membership, but the membership is defined by the church's theology.

  4.  **Formulate a Position:**
      *   *Is it stable?* No, it's not theoretically stable, but it is *functionally* stable.
      *   *What does it presuppose?* It presupposes religion as a **public-law corporation** (*Körperschaft des öffentlichen Rechts*). This is a specific legal category, not purely a "club" and not purely a "belief system." It's a hybrid.
      *   *The Incoherence:* The state claims neutrality but enforces a specific ecclesiology (that membership is binary and administrable). It effectively secularises the boundary of the church. By making the *civil* act the trigger for the *religious* penalty, the state intervenes in doctrine.
      *   *Verdict:* The system presupposes that religion is a **public utility** or a **state-delegated welfare provider** that happens to have a theological cover. The "belief" part is secondary to the "institutional continuity" part.
      *   *Coherence:* It is incoherent with strict neutrality (as understood in France or the US), but coherent with the German concept of "cooperative separation." However, the user asks about the theory of *religion*. The theory is that religion is an *objective social fact* rather than a *subjective conviction*.
      *   *The Fix:* If I must propose a change: Decouple the civil registry from the religious consequence. Or, more radically, end state collection.
      *   *Best "Cleanest Change":* End state collection. Move to direct donation.
      *   *Cost:* Financial collapse of the churches, loss of social welfare infrastructure (Kitas, hospitals, Caritas/Diakonie).

  5.  **Drafting the Argument (incorporating British English):**
      *   *Introduction:* Acknowledge the tension. State the thesis: The system presupposes religion as a public-law corporation, not a belief system or a simple club.
