      *   *The State's Complicity:* By managing the exit, the state defines the boundary of the church. This violates neutrality because it forces the church to accept a civil definition of membership.
      *   *The Verdict:* The theory is incoherent regarding *belief*, but coherent regarding *institutional power*. It treats religion as a branch of the welfare state.
      *   *The Recommendation:* Abolish state collection.
