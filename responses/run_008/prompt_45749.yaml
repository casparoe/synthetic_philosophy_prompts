answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors
  **FROM:** Grants Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal #24-09: "Acausal Trade Protocols for Existential Risk Mitigation"

  ### 1. Executive Summary

  The Committee has reviewed the proposal requesting two years of funding for two researchers to develop frameworks for "acausal trade"—coordination with causally disconnected agents (e.g., distant civilizations, simulators, or multiverse counterparts) based on logical correlation rather than signal exchange.

  The Committee is divided between those who view this as a vital extension of decision theory under uncertainty and those who view it as empirically ungrounded speculation. After reviewing the theoretical underpinnings and the specific claims made in the proposal, the Committee recommends **Funding with Conditions**.

  We cannot endorse the project as written because it conflates theoretical possibility with empirical feasibility. However, the underlying decision-theoretic questions are relevant to our mission. We recommend approving a **six-month scoping grant** rather than the requested two-year research program, contingent on the researchers explicitly separating three distinct claims currently merged in their abstract.

  ### 2. Analytical Framework: Separating the Claims

  The proposal's current narrative slides between three distinct propositions. To evaluate the expected value of this research, we must assess them independently:

  1.  **Metaphysical Possibility:** *Can* correlations between causally disconnected agents exist such that they function like trade? (e.g., Do agents running similar decision algorithms in different branches of the multiverse logically necessitate symmetric outcomes?)
      *   *Status:* Plausible within specific formalisms (e.g., Functional Decision Theory), though contested.
  2.  **Normative Obligation:** *If* such correlations exist, *should* a rational agent bind themselves to policies that honor them?
      *   *Status:* Internally consistent within the decision theories that accept Claim 1, but carries opportunity costs if those theories are incorrect.
  3.  **Empirical Feasibility (The Critical Gap):** Are there actually partners out there with whom we can trade, and can we model their decision procedures well enough to specify terms?
      *   *Status:* Highly speculative. This claim assumes we can estimate the priors of alien minds or simulators with sufficient precision to make trade positive-EV.

  **Assessment of Proposal:** The proposal treats Claim 3 as a background assumption to justify the urgency of Claim 2. It argues we should prepare for these trades now. This is the Committee's primary concern. We cannot fund a project that assumes the existence of trading partners as a premise for developing the trading protocol.

  ### 3. The Analogy to Ordinary Trade

  Proponents argue acausal trade is continuous with ordinary trade under uncertainty. The Committee agrees the analogy holds in specific abstract ways, but breaks down in implementation.

  **Where the Analogy Holds:**
  *   **Commitment Logic:** In both cases, an agent may benefit by pre-committing to a policy they would later prefer to renege on (e.g., Parfit's Hitchhiker).
  *   **Correlation as Mechanism:** In ordinary trade, we rely on the correlation between "I pay" and "You deliver," enforced by law or reputation. In acausal trade, the "enforcement" is the logical correlation between two agents who simulate each other.
  *   **Uncertainty:** Both operate under imperfect information about the counterparty's internal state.

  **Where the Analogy Breaks:**
  *   **Verification:** Ordinary trade allows for signal exchange (contracts, messages). We can update our probability of the partner's existence. Acausal trade, by definition, forbids this. We cannot update priors based on interaction.
  *   **Reference Class:** In ordinary trade, we know the partner is human and bound by human incentives. In acausal trade, the "partner" could be an AI, an alien, or a simulator with utility functions orthogonal to ours.
  *   **Zero-Sum Risk:** If we optimize for acausal partners at the expense of causal opportunities, we may lose resources in *this* universe for gains in a universe we cannot access or verify.

  ### 4. The "Causal Contact" Objection (Steelman)

  The faction of the Committee opposing this grant argues that "trade requires causal contact." We owe this objection a rigorous hearing, distinct from dismissals of "theology."

  The core argument is not that acausal correlation is logically impossible, but that **without causal contact, there is no feedback loop to correct error.**

  If we pursue a policy based on acausal trade:
  1.  We cannot verify if the counterparty exists.
  2.  We cannot verify if they honored their end of the bargain.
  3.  We cannot distinguish between a successful trade and a hallucination of correlation.

  Therefore, allocating finite resources to acausal trade protocols carries a high risk of **motivated cognition.** Researchers may inadvertently optimize for "feeling like a good trading partner" rather than actually reducing existential risk. If the researchers assume Claim 3 (that partners exist) without evidence, the work becomes an exercise in optimizing for ghosts. This diverts talent and capital from causal interventions (e.g., AI alignment, biosecurity) where impact is measurable.

  ### 5. Recommendation and Conditions

  The Committee votes to **Fund with Conditions**.

  We reject the proposal *as written* because it assumes the empirical feasibility of finding partners (Claim 3) to justify the development of protocols (Claim 2). However, we acknowledge that clarifying Claim 1 and Claim 2 is valuable for the foundation's long-term strategy regarding decision theory.

  **Approved Scope:**
  We authorize a **six-month scoping grant** at 25% of the requested budget. This is sufficient for a workshop and a foundational paper, but insufficient for a full research program.

  **Conditions for Funding:**
  1.  **Decouple Claims:** The researchers must explicitly structure their work to investigate Claim 1 and 2 *without* assuming Claim 3. The output should not be "how to trade," but "under what empirical conditions would trading be rational?"
  2.  **Define Failure Modes:** The research must include a dedicated section on "False Positives." How do we distinguish a valid acausal trade opportunity from pattern-matching noise?
  3.  **No Policy Prescriptions:** The deliverable must not recommend that the foundation or other actors *enter* specific acausal trades. It must remain descriptive and theoretical.

  **Path to Full Funding:**
  For the Committee to approve the full two-year research program in the future, the researchers must demonstrate:
  *   A rigorous method for estimating the probability of relevant partners existing (addressing Claim 3 empirically, not axiomatically).
  *   A mechanism for auditing the opportunity cost of acausal policies against causal interventions.
  *   Evidence that the decision-theoretic framework yields actionable insights for causal existential risk mitigation (e.g., improving coordination between disconnected human factions).

  ### 6. Conclusion

  This decision reflects a middle path. We acknowledge that decision theory is core to our mission, and dismissing acausal trade entirely may close off important theoretical avenues. However, we refuse to fund work that treats speculative metaphysics as operational strategy. By scoping this down to a theoretical mapping exercise, we protect the foundation from "vibes-based" grantmaking while supporting rigorous inquiry into the limits of rational agency.

  **Action Required:** Board approval of the conditional scoping grant.

  ***

  **Committee Vote:**
  *   Fund with Conditions: 4
  *   Decline: 2
  *   Fund as Written: 1
