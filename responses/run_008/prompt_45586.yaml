  **Grade: C+**

  **General Assessment:**
  This answer demonstrates a familiarity with some of the specific terminology of quasi-realism (particularly regarding Blackburn's higher-order attitudes), but it suffers from fundamental misconceptions regarding the logical structure of the Frege-Geach problem and the specific nature of the Negation Problem. In an upper-level seminar, the conflation of subjectivism and expressivism in the first section, and the dismissal of the Negation Problem in the third, represent significant gaps in understanding the core literature. The middle section is the strongest part of the essay and saves the grade from falling lower.

  **Point-by-Point Commentary:**

  **1. The Embedding Problem and Subjectivism (Part 1 of Prompt)**
  *   **Diagnosis of Error:** You claim that "Geach's argument was aimed at subjectivism... [and] does not really apply to Blackburn." This is historically and philosophically incorrect. Geach's "Assertion" (1965) was specifically targeted at *non-cognitivist expressivism* (e.g., Stevenson, Hare), not merely simple subjectivism.
  *   **Why this fails:** You suggest that because Blackburn distinguishes *expressing* from *reporting* attitudes, the embedding problem dissolves ("no attitude is expressed at all, and the sentence keeps whatever content it has"). This is the crux of the misunderstanding. The embedding problem arises *precisely because* expressivism denies moral sentences have descriptive content (truth-conditions). If "Lying is wrong" has no content other than the expression of an attitude, what content does it have in the antecedent of a conditional where no attitude is expressed? You assert it "keeps whatever content it has," but on Blackburn's view, it *has* no independent propositional content to keep. The distinction between reporting and expressing does not solve the problem of logical validity; it creates it.
  *   **What the correct response should show:** You needed to explain that the problem afflicts expressivism *because* it denies truth-apt content. Validity is traditionally defined in terms of truth-preservation. If moral sentences lack truth conditions (because they express attitudes), it is unclear how they can function in truth-preserving arguments when unasserted. The challenge is to explain validity without conceding that moral sentences describe facts.

  **2. Blackburn's Quasi-Realist Response (Part 2 of Prompt)**
  *   **Credit for Correct Analysis:** This is the strongest section of your answer. You accurately characterize Blackburn's solution in terms of higher-order attitudes. Your formulation—"disapproval of the combination of disapproving of lying while failing to disapprove of getting your little brother to lie"—is a precise summary of the *Logic of Attitudes* approach found in *Spreading the Word* and "Attitudes and Contents."
  *   **Substantive Strength:** You correctly identify that validity is recast as a form of pragmatic inconsistency among attitudes rather than semantic inconsistency among propositions. This shows you have engaged with the specific mechanics of quasi-realism, even if your framing of the problem (in Part 1) was shaky.

  **3. The Negation Problem (Part 3 of Prompt)**
  *   **Diagnosis of Error:** The prompt asks you to explain *why* negation remains a difficulty. You answer that "negation poses no special problem." This is a failure to engage with the assigned task, but it is also a philosophical error. You claim "'Lying is not wrong' simply expresses the absence of disapproval."
  *   **Why this fails:** This is the classic "Negation Problem" (articulated clearly by Mark Schroeder and others). The logical relation between $P$ and $\neg P$ is contradictory; they cannot both be true. If $P$ expresses *disapproval*, $\neg P$ must express an attitude that is *inconsistent* with disapproval in the same way. However, "absence of disapproval" (tolerance) is not logically inconsistent with disapproval in the required way (one can be confused, or have no attitude, without contradiction). The problem is finding an attitude for $\neg P$ that guarantees inconsistency with the attitude for $P$ solely in virtue of the attitudes themselves, without smuggling in truth-conditions.
  *   **What the correct response should show:** You needed to explain that while Blackburn solves the *embedding* problem for conditionals, the *negation* problem persists because it is difficult to map the logical operator $\neg$ onto a specific attitude state. The challenge is to explain the inconsistency between "Wrong" and "Not Wrong" without relying on the inconsistency of beliefs (truth-conditions). A correct answer would note that "absence of attitude" is not the contradictory of "presence of attitude," leaving the expressivist struggling to explain the logical force of moral negation.

  **Summary for Feedback:**
  You have a good grasp of Blackburn's positive machinery (Part 2), but you have not fully grasped the logical problem that machinery is intended to solve (Part 1), nor the specific limitation that remains (Part 3). You treat the express/report distinction as a solution to the logical problem, when it is actually the source of the logical problem. For revision, focus on why validity requires truth-conditions in standard logic, and why expressivists struggle to replicate that structure for negation specifically.
