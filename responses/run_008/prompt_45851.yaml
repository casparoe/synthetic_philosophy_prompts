answer: |-
  (1) **In Between.** Nadia accurately states the skeptic's conditional, but her premise assumes incompatibilism is true, which is the core dispute.
  (2) **Clearly Right.** Pure consequentialism logically permits punishing the innocent if net utility increases; rights constraints are necessary to block this.
  (3) **In Between.** Her rule-consequentialist defense is plausible but relies on empirical claims about secrecy and institutional stability that are not guaranteed.
  (4) **Clearly Right.** Consequentialism lacks internal resources to limit severity strictly to culpability; proportionality requires non-consequentialist constraints.
  (5) **In Between.** Compatibilist "earned desert" is metaphysically coherent to some, but skeptics rightly argue it doesn't ground the specific harshness retributivism demands.
  (6) **Clearly Right.** Concepts function socially, not just philosophically; "earned desert" frequently licenses retributive excess in public discourse despite philosophical fine-tuning.

  **Overall Verdict:** Paul wins on logical consistency and pragmatic risk assessment. He successfully demonstrates that forward-looking theories fail to protect rights and proportionality (2, 4), and that compatibilist desert often functions identically to retributivism in practice (6). Nadia's position is unstable because she shifts from skepticism (1) to compatibilism (5) when pressed, effectively conceding that pure forward-looking views are insufficient. However, Nadia is correct that skepticism need not imply "anything goes," even if her proposed solution falters.

  **What They Are Missing:** Much of this dispute is verbal, hinging on equivocations over "desert." They conflate *ultimate* desert (metaphysical) with *conventional* desert (social practice). Additionally, both overlook hybrid theories: a forward-looking *justification* for the institution of punishment (deterrence) constrained by backward-looking *rights* (proportionality), without invoking desert at all. Finally, they confuse the justification of state punishment with the psychology of blame; one can reject ultimate desert while retaining reactive attitudes as social tools, provided those attitudes don't license harsh treatment. The debate isn't just about metaphysics, but about which concepts best serve human flourishing without invoking illusory guilt.
