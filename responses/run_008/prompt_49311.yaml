prompt: |-
  I'm a backend engineer, never took a philosophy class in my life, but a coworker and I keep arguing about when you're allowed to trust your own reasoning vs. when you have to discount it, so I just wrote down my gut calls on a bunch of cases and now I want to know if there's an actual rule behind them.

  Case: a senior engineer I respect about as much as myself reviews my design doc and says the caching scheme has a race condition. I go back through my reasoning step by step and it still looks airtight to me. Gut call: I should back off to something like 50/50 anyway. Saying "I've re-checked and I'm just right" at full confidence feels wrong.

  Case: I read that engineers systematically overrate their own hotfixes. I'm an engineer, so statistically I probably overrate mine. But when I look at my last hotfix it still just... looks correct, the reasoning is right there. Gut call: I think that's fine? I can't exactly un-see the argument, so I keep believing it even while knowing my self-assessment is the kind of thing that's usually inflated. My coworker says this is incoherent of me.

  Case: same setup as the last one, except this time I didn't just review it myself — the integration tests pass and a static analysis tool verified the actual invariant. Now "people overrate their own code" does basically nothing to me. Hold firm.

  Case: I'm drunk at a party and I'm completely sure I left my keys on the kitchen counter. That's what a memory feels like from the inside, vivid and confident. But drunk me is wrong about exactly this kind of thing basically every time. Gut call: don't trust the memory, act like you're probably wrong, go check.

  Case: a very smart new hire, first week, zero context on the system, tells me after five minutes that my design is broken. Gut call: barely move at all.

  Case, the one we actually fight about: an internal tool tells me that of my last ten "I'm sure it's fine" calls on this class of bug, seven were wrong. Today's call still seems fine to me from the inside. I genuinely don't know what my gut says here.

  So: is there one principle that captures all of these? My attempt was something like "verified first-order evidence beats higher-order doubt, but unverified first-order confidence has to yield when the higher-order info says people like you blow it" — but my coworker pointed out this seems to smuggle my own judgment back in, since who decides that the tool's seven-out-of-ten applies to *this* call? Me. The same biased me. Which feels like a program trying to patch itself using a patch produced by the same buggy compiler.

  What I want from you: state the principle (or two competing ones) as precisely as you can, tell me what it says about the automated-tool case and about a case or two I haven't listed, and be honest about which of my gut calls have to go to make it work. I suspect the drunk-keys case and the "I can keep believing while knowing my self-assessment is inflated" case can't both survive, but I can't articulate why, and it bugs me.
