answer: |-
  ### Part 1: The Historical Audit Protocol (HAP)

  You are describing the **Preface Paradox** (Makinson, 1965). It is rational to believe each proposition $P_1...P_n$ individually while believing the conjunction $(P_1 \land ... \land P_n)$ is false. In historical fiction, you are not asserting knowledge in the philosophical sense; you are asserting **warranted acceptability**.

  You cannot re-research 600 claims. You need a triage system. This procedure is designed to be run in 3–5 minutes per claim. It does not verify truth; it verifies **risk exposure**.

  **The Protocol:**

  For each factual claim, ask these four questions in order. Stop at the first "Stop" command.

  1.  **The Source Trace Test:**
      *   *Question:* Can I locate the specific source for this claim within 10 minutes *right now*?
      *   *If Yes:* Proceed to Q2.
      *   *If No:* **STOP.** Mark as [UNVERIFIED].
      *   *Rationale:* If you can't find it now, a reader can't either, *unless* it's a common fact. But if you can't find it, your 97% confidence is actually hindsight bias.

  2.  **The Pedant Probability Score (PPS):**
      *   *Question:* Is this a detail that attracts specialist scrutiny? (e.g., train timetables, military ranks, currency, specific dates vs. atmospheric details like "the fog was thick").
      *   *Scale:* 1 (Atmosphere) to 5 (Hard Data).
      *   *If PPS is 4 or 5 AND Source Trace was [UNVERIFIED]:* **STOP.** Mark as [HIGH RISK].
      *   *Rationale:* Train enthusiasts and economic historians exist. They will find you.

  3.  **The Narrative Load Test:**
      *   *Question:* If this fact is wrong, does the plot collapse, or does only the immersion suffer?
      *   *If Plot-Critical:* You must verify (pause manuscript, find source).
      *   *If Immersion-Only:* Proceed to Q4.
      *   *Rationale:* Don't sink the ship for a speck of dust, but don't paint the hull with lies.

  4.  **The Specificity Trap:**
      *   *Question:* Does the claim rely on a specific number, name, or date that adds realism but no plot value?
      *   *If Yes:* **Generalize.** (e.g., change "4 hours 12 minutes" to "four hours and a bit"; change "34 kreuzer" to "a handful of coins").
      *   *If No:* Assert flat-out.

  **Decision Matrix:**
  *   **[VERIFIED] + [LOW PPS]:** Assert flat-out.
  *   **[UNVERIFIED] + [LOW PPS]:** Assert flat-out (Calculated risk).
  *   **[UNVERIFIED] + [HIGH PPS]:** **Hedge or Obfuscate.** (Do not assert specific data).
  *   **[INVENTED]:** **Cut Specificity.** (Never invent hard data).

  ---

  ### Part 2: The Audit (Applied to Your Draft)

  Here is the protocol running on your three specific claims.

  #### (a) The Morning Express (Vienna to Prague, 1893)
  *   **Source Trace:** You cannot find the schedule. Result: **[UNVERIFIED]**.
  *   **Pedant Probability:** Train schedules are high-visibility data for railway historians. Result: **PPS 5**.
  *   **Narrative Load:** Likely sets pacing/mood, not plot-critical.
  *   **Specificity Trap:** You likely have a specific minute count written down.
  *   **Protocol Verdict:** **[HIGH RISK] -> HEDGE.**
  *   **Action:** You cannot assert a specific time without the source. A specific wrong number looks like incompetence; a vague right number looks like literature.
  *   **Revision:** Change "The express took four hours and twelve minutes" to "The express ate up the better part of a morning" or "just over four hours."
  *   **Pain Level:** Low. It costs you nothing but precision you can't back up.

  #### (b) The Battle of Wagram (Father's Death)
  *   **Source Trace:** You picked it to fit a birthdate. Result: **[CALCULATED]**.
  *   **Pedant Probability:** Military history is the most litigious corner of historical fiction. Result: **PPS 5**.
  *   **Narrative Load:** Character backstory. High emotional weight, low plot mechanics.
  *   **Specificity Trap:** "Wagram" is a specific date (July 5–6, 1809).
  *   **Protocol Check:** *Wait.* The Battle of Wagram was 1809. Your book is 1890s. That is an 80+ year gap. If your protagonist is an adult in the 1890s (say, 30 years old, born 1860), and his father died *at* Wagram (1809), the father died 51 years before the son was born.
      *   *Scenario A:* The father was a very old man when he sired the son? Impossible if he died in 1809.
      *   *Scenario B:* It's a step-father?
      *   *Scenario C:* You meant a different battle?
  *   **Protocol Verdict:** **[LOGIC ERROR DETECTED].**
  *   **Action:** You must check the math. If the father died *at* Wagram, he cannot be the biological father of a main character active in the 1890s unless the character is 80+ years old.
  *   **Revision:** Change the battle to one in the 1850s or 60s (e.g., Königgrätz 1866, or the Italian campaigns of 1859) to make the biology work, *or* clarify it is a grandfather.
  *   **Pain Level:** Moderate. Requires a rewrite of backstory logic.

  #### (c) The Coffee Prices
  *   **Source Trace:** You admit you "half-invented" them. Result: **[INVENTED]**.
  *   **Pedant Probability:** Economic data is specific and checkable. Result: **PPS 4**.
  *   **Narrative Load:** Atmosphere.
  *   **Specificity Trap:** You have specific numbers written down.
  *   **Protocol Verdict:** **[INVENTED] + [HIGH PPS] -> CUT SPECIFICITY.**
  *   **Action:** This is the hard stop. You cannot invent economic data in historical fiction. It breaks the implicit contract. If a reader checks the price of a *Melange* in 1893 and finds your number is impossible, they will distrust every other fact in the book.
  *   **Revision:** Delete the specific currency amount. Describe the *value* relative to the character. "He paid for his coffee with a coin that stung more than he liked," or "the price had crept up again."
  *   **Pain Level:** **High.** You lose the texture of the specific number. You wanted the concrete detail to ground the scene. The procedure forces you to sacrifice realism for accuracy. **This is the change you would rather not make.**

  ---

  ### Part 3: The Acknowledgements & The Philosophical Verdict

  **Is the sentence coherent?**
  Yes. It is not a lie; it is an instance of **fallibilism**.

  In epistemology, the norm of assertion is debated.
  *   **The Knowledge Norm:** You should only assert $P$ if you *know* $P$. (If you hold this, your acknowledgements are an admission that you violated the norm).
  *   **The Justified Belief Norm:** You should assert $P$ if you have sufficient justification for $P$. (This is your position).

  When you write "Any remaining errors are mine," you are not asserting "There are errors." You are asserting "I am human, and the probability of error in a set of 600 claims is non-zero." This is logically consistent with asserting each individual claim based on the best available evidence. You are distinguishing between **confidence in the method** and **infallibility of the outcome**.

  **Should the procedure change how you write it?**
  Yes, slightly. The standard phrasing ("Any errors are mine") implies you expect mistakes. Given your 97% confidence and the Audit Protocol, you should shift the framing from *apology* to *interpretation*.

  Historical fiction is not a textbook; it is a reconstruction. The "errors" readers find are often matters of conflicting historical records, not just your mistakes.

  **Recommended Wording:**
  > *"While I have strived for accuracy in the details of 1890s Vienna, history is often a matter of conflicting records. Where I have had to choose between sources, or where the record is silent, I have made choices in service of the story. Any discrepancies are my own."*

  **Why this is better:**
  1.  **It protects you:** It acknowledges that "truth" in history is sometimes debated (e.g., coffee prices varied by shop, not just year).
  2.  **It maintains authority:** It doesn't sound like you're expecting to be wrong; it sounds like you're owning your artistic license.
  3.  **It solves the Paradox:** It asserts that the book is a *coherent whole* (the story) rather than a *conjunctive list of facts*.

  **Final Instruction:**
  Run the Audit Protocol on the Coffee Prices immediately. Generalize the cost. It hurts, but a pedant correcting your price in a review will hurt more. The Wagram claim needs a math check today. The Train time needs hedging. Do this before copyedit, or the copyeditor will query these exact points, and you'll be forced to do it under greater time pressure.
