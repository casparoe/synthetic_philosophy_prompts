prompt: |-
  Quick context: I'm a mid-level researcher at an AI lab, and next week I'm pitching to our whole research group (~25 people) a proposal to adopt what I'm calling a "surprise norm": before anyone unilaterally ships or publishes something that could noticeably lower the barrier to dangerous capabilities — a model weight release, an agent scaffold, a writeup that makes some risky research much cheaper to do, whatever — they need a green light from at least two teammates, even if they personally judge the risk acceptable. My argument runs through the unilateralist's curse: when several people each have only marginally-favorable evidence about whether a risky act is okay, and each of them can act alone the moment their own evidence tips that way, the act ends up happening far more often than the pooled evidence warrants — the individual errors all point in the same direction instead of cancelling. The room is mostly ML researchers, zero philosophers, and the people I'm bracing for are: (a) three or four hard open-source-everything folks who will say restraint on our side is pointless when others won't restrain, and that any gate just degrades into an informal veto for whoever happens to be most risk-averse; (b) a handful who'll claim this is just groupthink with extra steps and will rot our research culture; (c) our two safety people who actually know the decision theory and might point out that our judgments are hardly independent since we talk all day, and that my proposal quietly leans on the errors still not washing out. So: draft my prep sheet. List the objections I'll actually get, in rough order of how likely and how damaging, each phrased the way people in this room would phrase it (researcher vocabulary, not whatever philosophers say about this stuff), with a reply I can deliver in under a minute, a note on what I should concede up front rather than fight, where each reply is soft, and the one question I'm quietly hoping nobody asks. And since you're predicting a room you've never seen and advice I haven't tested: tell me how confident you are in each of your predictions, and single out the piece of advice you're least sure of — I'd rather know your weak spot going in than find out about it mid-Q&A.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **User:** Mid-level researcher at an AI lab.
      *   **Task:** Draft a prep sheet for a pitch to a research group (~25 people).
      *   **Proposal:** A "surprise norm" (two-person green light before shipping/publishing potentially dangerous capabilities).
      *   **Core Argument:** Unilateralist's Curse (individual errors correlate/accumulate, leading to over-release of risky tech).
      *   **Audience:** ML researchers (no philosophers).
      *   **Specific Antagonists:**
          *   (a) Hard open-source advocates (restraint is futile, gates become vetoes).
          *   (b) Culture critics (groupthink, slows down research).
          *   (c) Safety experts (know decision theory, will challenge independence assumptions).
      *   **Deliverables:**
          *   List of objections (likely/damaging order).
          *   Phrasing (researcher vocabulary).
          *   Replies (< 1 minute, soft tone).
          *   Concessions (what to admit up front).
          *   The "One Question" hoped not to be asked.
          *   Confidence ratings on predictions.
          *   Identification of the weakest advice piece.

  2.  **Deconstruct the Audience & Context:**
      *   *ML Researchers:* Pragmatic, value speed/iteration, skeptical of bureaucracy, care about impact (both positive and negative), familiar with "deployment" and "release" cycles.
      *   *Tone:* Needs to be collaborative, not preachy. "Safety" can be a trigger word; frame it as "responsible scaling" or "coordination."
      *   *The "Surprise Norm":* It's a lightweight governance mechanism. It's not a full red-teaming board, just a "buddy check."

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Open Source Argument):* "If we don't do it, someone else will." This is the classic "p(doom) vs. p(success)" or "race dynamics" argument.
          *   *Phrasing:* "Signal vs. Noise," "First-mover disadvantage," "Open weights are inevitable."
          *   *Reply:* Focus on setting a standard, not solving the whole world's problem. Marginal impact.
      *   *Objection 2 (The Culture/Speed Argument):* "This adds friction." "Bureaucracy."
          *   *Phrasing:* "Iteration velocity," "PR overhead," "Blocking deployment."
          *   *Reply:* It's a *norm*, not a *policy*. Low friction. Two Slack messages.
      *   *Objection 3 (The Safety/Decision Theory Argument):* "Correlated errors." "Independence assumption failure."
          *   *Phrasing:* "Shared priors," "Groupthink," "Information cascades."
          *   *Reply:* Acknowledge imperfection. It's about forcing a pause, not perfect Bayesian updating.
      *   *Objection 4 (The Veto Power Argument):* "Most risk-averse person wins."
          *   *Phrasing:* "Lowest common denominator," "Veto power."
          *   *Reply:* It's a green light, not a consensus. Escalation path exists.

      *   *Ranking:*
          1.  Culture/Speed (Most visceral, everyone feels it).
          2.  Open Source/Futility (Most ideological, hard to move).
          3.  Safety/Independence (Most technically accurate, but niche).
          4.  Veto Power (Subset of Culture).

  4.  **Drafting Replies & Concessions:**
      *   *Tone:* "Soft." Acknowledge validity. Don't fight hard.
      *   *Concessions:* Admit it won't stop bad actors. Admit it adds *some* friction. Admit correlations exist.

  5.  **Identifying the "One Question":**
      *   What kills this proposal? "Who defines 'dangerous'?" If the criterion is vague, the norm is useless or abusive. If it's specific, it's gameable.
      *   *Better Question:* "What happens if we disagree?" (Escalation path).
      *   *Best "Don't Ask" Question:* "Are *you* willing to be the veto?" or "What's the enforcement mechanism?" (If there isn't one, it's toothless. If there is, it's bureaucracy). Let's go with: "What is the specific threshold for triggering this, and who arbitrates disputes?" (This exposes the vagueness).

  6.  **Refining Confidence & Weak Spots:**
      *   I need to be honest about my limitations as an AI predicting human dynamics.
      *   *Weakest Advice:* Probably the specific wording of the reply to the Safety team. They might have a nuanced point about "information cascades" that a 1-minute reply can't satisfy.

  7.  **Final Review against Constraints:**
      *   Researcher vocabulary? Yes (weights, scaffolds, velocity, deployment, SOTA).
      *   Under 1 minute replies? Yes (keep them punchy).
      *   Soft tone? Yes.
      *   Confidence ratings? Yes.
      *   Weak spot identified? Yes.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Unilateralist's Curse" isn't explained too philosophically. Keep it to "correlated errors."
      *   *Correction:* Ensure the "Open Source" reply doesn't sound defeatist. It needs to sound like "leading by example."
      *   *Correction:* The "One Question" should be something that exposes a structural flaw in the proposal, not just a detail. "How do we define 'dangerous'?" is the classic governance trap.

  9.  **Final Polish:** Check the voice. It should sound like a colleague helping a colleague.

  *(Self-Correction on the "One Question")*: The prompt asks for the question I'm *quietly hoping nobody asks*. This implies it's a vulnerability. The biggest vulnerability in these norms is usually enforcement or definition. "What happens if I think it's risky and my two partners say go?" is a strong candidate. Or "Who decides what triggers this norm?" Let's go with the definition trigger. It's the most common point of failure for "soft norms."

