      *   *Wait, is there a deeper issue?* The "Cluelessness" objection usually argues that the *range* of possible long-term values is so vast that it renders the short-term negligible *even if* the expectation is zero. (i.e., Risk). But the argument presented here relies on *Expected Value* (premise 3).
