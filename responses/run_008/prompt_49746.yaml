      *   *Refinement:* If we are talking about *Expected* Consequentialism (which premise 3 implies), the math still holds. $E(A) \neq E(B)$ if the known parts differ.
      *   **Addressing the "Swamping" Objection:** The friend might say the variance of the tail is so high it swamps the mean of the head. But Premise (3) specifically concludes the *expected difference* is zero, not that the *risk* is too high. I must stick to refuting the text provided. The text claims EV = 0. That is mathematically false given additive knowns.

