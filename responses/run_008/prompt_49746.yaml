answer: |-
  The argument fails at **Premise (3)**.

  ### The Diagnosis
  Premise (3) is false. It commits a fallacy of composition by inferring a property of the *total* act from a property of the *distant future* segment of that act. Specifically, it equivocates on the scope of "consequences."

  Premise (2) establishes that our evidence is symmetric only regarding the **long-term tail** of consequences (the "arbitrarily large goods and harms" beyond a few years). It explicitly admits that for the **short-term head** (the "few years" where effects are discernible), our evidence is *not* symmetric. We can see that donating to malaria relief saves lives now, while keeping the money buys a dinner.

  Premise (3) then claims: "When our evidence about the value of two acts' consequences is symmetric **in this way**, the expected difference in value between them is zero."

  The phrase "in this way" refers to the symmetry described in (2)—symmetry regarding the *tail*. But the conclusion of (3) asserts that the expected difference between the *acts* (the total consequences) is zero. This inference is mathematically and philosophically invalid. Expected value is additive. If $E(Total) = E(Head) + E(Tail)$, and we know $E(Head_A) \neq E(Head_B)$ (because the short-term effects are discernible and different), then $E(Total_A) \neq E(Total_B)$ even if $E(Tail_A) = E(Tail_B)$.

  Premise (3) treats epistemic symmetry in the unknown sector as a solvent that dissolves value differences in the known sector. It converts "we don't know the difference in the future" into "there is no expected difference in the present," which is a non sequitur.

  ### Defense Against the Strongest Version
  Your friend's strongest counter-argument will likely rely on the **variance** of the tail rather than the mean. They might argue: "The range of possible long-term outcomes is so vast (infinite variance) that it 'swamps' the finite short-term differences. Even if the expected value of the tail is zero, the uncertainty is so radical that it renders the short-term signal noise."

  This is the "Cluelessness" objection in its most robust form. However, this does not save Premise (3) as written. Premise (3) does not claim the decision is *too risky*; it claims the **expected difference is zero**.

  To defend my rejection against this swamping objection:
  1.  **Mathematical Precision:** If the long-term distribution is symmetric (as (2) and (3) assume to get a zero mean), the expectation is zero (provided it converges). If it does not converge (e.g., a Cauchy distribution), the expectation is *undefined*, not zero. Premise (3) asserts it is *zero*. If the friend retreats to "undefined," they have abandoned (3) and must rebuild the argument on decision-theoretic paralysis rather than zero expected value.
  2.  **Discounting:** Even without formal discounting, causal influence typically attenuates over time. The "butterfly effect" cuts both ways; while small causes can have large effects, the *probability* of a specific act being the pivot point for a specific large future good/harm diminishes as causal chains branch and interact with other agents. There is no evidential basis for assigning the tail *more* weight than the head simply because it is larger in potential magnitude.
  3.  **The Burden of Proof:** The argument asks us to accept that total ignorance about the tail nullifies partial knowledge about the head. But in every other domain of decision-making (finance, medicine, engineering), we act on known near-term probabilities despite unknown long-term risks. To claim ethics is unique in requiring certainty about the infinite future is to beg the question against practical reasoning itself.

  ### The Price
  If the consequentialist blocks the argument here, what is she giving up, and is it still consequentialism?

  **What she gives up:**
  She must concede **Epistemic Humility regarding the Far Future.** She admits that for any ordinary act, she is "clueless" about whether it ultimately leads to a utopia or a catastrophe 500 years hence. She abandons the claim that we can *calculate* the total utility of an act.

  **What remains:**
  She retains **Expectable Consequentialism.** The theory remains that an act is right if it maximizes *expected* value. By rejecting (3), she maintains that the expected value of the "clueless" tail is neutral (or equal across acts), leaving the *discernible* short-term consequences to determine the rightness of the act.

  **Is it still Consequentialism?**
  Yes. The *criterion* of rightness remains the production of good consequences. The *epistemic access* to that criterion is limited to the foreseeable horizon. This is not a retreat to deontology or virtue ethics; it is a refinement of how consequentialists handle uncertainty. She argues that the best *proxy* for maximizing total consequences is maximizing foreseeable consequences, precisely because the unforeseeable consequences cancel out in expectation.

  If you accept this diagnosis, you preserve the viability of consequentialism for everyday choices (donating, truth-telling) while acknowledging that we cannot claim moral certainty about the historical legacy of those acts. The theory guides action without claiming omniscience.
