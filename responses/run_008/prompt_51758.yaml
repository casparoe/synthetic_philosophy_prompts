answer: |-
  You are not patching together verdicts at random. You are intuitively applying a specific epistemic filter, but you have been misidentifying it as a rule about *time* or *medium* (oral vs. written, old vs. new).

  Here is the precise principle that unifies your verdicts.

  ### The Principle of Hard Constraints

  **Belief is warranted only when the evidence is anchored by systems that resist human manipulation or narrative distortion (physics, chemistry, linguistics, logistics, immediate bureaucracy), rather than by the age, medium, or multiplicity of the testimony itself.**

  In simpler terms: You trust **involuntary traces** (things that leave a mark regardless of what the author wanted) over **voluntary assertions** (things the author intended to claim).

  #### How this principle explains your verdicts:

  1.  **Babylonian Diary vs. Greek Historian:** The diary is an administrative/bureaucratic trace (Hard Constraint: immediate record-keeping). The Greek history is a narrative constructed for rhetorical effect (Voluntary Assertion). **Verdict: Diary.**
  2.  **Herodotus' Numbers:** Logistics and supply chains are Hard Constraints (physics/biology). "Millions of men" is a rhetorical trope (Voluntary Assertion). **Verdict: Moderns.**
  3.  **Phoenician Sail (Sun on Right):** This is the clearest example. The detail is an *involuntary trace* of geography/astronomy. Herodotus didn't understand it (he doubted the story), so he couldn't have invented it to serve the narrative. It is a fossil of truth inside a lie. **Verdict: True.**
  4.  **Anglo-Saxon Eclipse:** Astronomy is a Hard Constraint. The battle/omen is narrative. You correctly split the verdict: the eclipse happened (physics), the battle is unproven (narrative). **Verdict: Split.**
  5.  **Medieval Marvels:** "Multiple attestation" fails here because the source is shared legend (Voluntary Assertion). Biology/Physics acts as the Hard Constraint against monsters. **Verdict: False.**
  6.  **Aboriginal Oral Tradition:** *Crucial Point:* You do not trust this because it is oral or old. You trust it because **geology** (Hard Constraint) confirms the sea-level change. Without the geological match, your principle would demand you reject it as legend. **Verdict: True (conditionally).**
  7.  **Vinland Map:** Chemistry (ink pigment) is a Hard Constraint. Parchment age is just substrate. **Verdict: Fake.**
  8.  **James Ossuary:** Epigraphy/Chemistry (inscription) is a Hard Constraint. The box is just substrate. **Verdict: Mixed (Real box, fake claim).**

  ---

  ### The Verdict You Must Overturn

  There is one tension in your list that the principle exposes. You stated: *"Contemporary beats later, pretty much always."*

  **The Principle of Hard Constraints overturns this.**
  Contemporaneity is only a proxy for reliability because contemporary records are *often* bureaucratic traces (like the Babylonian diary). However, a contemporary piece of propaganda is less reliable than a later, geologically verified oral tradition.
  *   **Correction:** Do not trust "Contemporary." Trust "Constrained." If a contemporary poet writes a myth about a king, and a modern geologist finds evidence of the flood the myth describes, the geologist wins. Time is not the metric; resistance to fabrication is.

  ---

  ### Application: The Kensington Runestone

  **The Evidence:**
  1.  **Linguistic:** The runes and language contain anachronisms consistent with 19th-century understanding of Old Swedish, not 14th-century reality. (Hard Constraint: Linguistics/Philology).
  2.  **Geological:** The weathering on the carved surfaces suggests great age. (Hard Constraint: Geology/Chemistry).

  **The Analysis:**
  This is a conflict between two Hard Constraints. We must weigh their fidelity.
  *   **Geology (Weathering):** Weathering rates are variable. They depend on microclimate, stone composition, burial history, and chemical exposure. A stone can be buried to accelerate aging, or found old and carved later (the "James Ossuary" scenario). The constraint is "fuzzy."
  *   **Linguistics:** Language evolution is highly structured. A 14th-century Norseman could not accidentally use a 19th-century grammatical form any more than Shakespeare could accidentally use text-speak. For the runes to look 19th-century, the carver must have been thinking in 19th-century patterns.

  **The Precedent:**
  Look at your **Vinland Map** and **James Ossuary** verdicts. In both cases, the *content* (ink, inscription) overruled the *container* (parchment, stone box).
  *   Vinland: Modern ink on old paper = Fake.
  *   Ossuary: Modern inscription on old box = Fake Claim.
  *   Kensington: Modern language on old stone = **Fake Claim.**

  **The Verdict:**
  **The Runestone is a 19th-century creation.**
  The linguistic anachronism is a "positive identification of error" (like the modern pigment), whereas the weathering is merely an "absence of evidence of newness." The linguistic constraint is higher fidelity. You should treat the stone like the Ossuary box: the rock is old, the message is not.

  ---

  ### A New Test Case: The "Constantine Vision" Tablet

  **The Scenario:**
  Archaeologists discover a gold tablet in a Roman context.
  *   **Material Analysis:** The gold alloy and metallurgy are consistent with 4th-century Roman minting techniques. The patina suggests burial since late antiquity.
  *   **The Inscription:** It describes Emperor Constantine's vision of the Cross before the Battle of the Milvian Bridge (312 AD).
  *   **The Textual Anomaly:** The Latin inscription uses the title *Pontifex Maximus* in a grammatical construction that epigraphers date exclusively to the reign of Theodosius II (408–450 AD), nearly a century later. Furthermore, the iconography depicts the Cross with a *crucifix* (Jesus on the cross), a symbol historically attested only after the 5th century; 4th-century Christians used the Chi-Rho or empty cross.

  **Applying the Principle of Hard Constraints:**
  1.  **Metallurgy/Patina:** Hard Constraints, but susceptible to the "Ossuary" problem (old material reused).
  2.  **Linguistics/Iconography:** Hard Constraints. A 4th-century smith cannot invent a 5th-century grammatical structure or a 5th-century religious symbol. These are involuntary traces of the *time of manufacture*, not the *time of the event described*.

  **The Verdict:**
  **The tablet is a 5th-century pious forgery.**
  The material (gold) is ancient, but the *information* (inscription/iconography) is anachronistic. Just as you rejected the Vinland Map's content despite the old parchment, and just as you rejected the Ossuary's claim despite the old box, you must reject this tablet's claim of 4th-century origin. The linguistic and iconographic constraints are higher fidelity than the metallurgical ones. The tablet tells you about 5th-century devotion, not 4th-century history.
