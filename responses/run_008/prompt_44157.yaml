answer: |-
  A strict Bayesian decision theorist walks into a clinic with a persistent cough.

  The doctor examines him and says, "I'm 95% sure it's bacterial. I'd like to run a diagnostic scan to confirm."

  The theorist asks, "Is the scan cost-free?"

  "Technically, yes," says the doctor. "Insurance covers it entirely."

  "And will the result change the prescribed treatment?"

  "Honestly? No," the doctor admits. "If it's bacterial, I prescribe antibiotics. If the scan somehow says it's viral despite my exam, I'd trust my prior and prescribe antibiotics anyway. The treatment threshold is far behind us."

  The theorist shakes his head. "Then I refuse. By Good's Theorem, the expected value of information is only positive if there is a non-zero probability that the signal will change the optimal action. Since my action is invariant to the signal, the value of the information is zero. Observing it would just be a waste of time."

  The doctor sighs, picks up a pen, and says, "Okay. I'll note in your permanent record that you refused a confirmatory scan for a respiratory infection."

  The theorist pales. "Wait. If you do that, my future insurance premiums might go up, and you might treat me with more defensive caution later."

  "Precisely," says the doctor.

  "So... that changes my utility function regarding the scan," the theorist stammers. "The 'cost-free' assumption no longer holds because of the reputational cost."

  "No," the doctor corrects, handing him the requisition form. "The utility function changed, which means the optimal action *is* now contingent on the signal. If the scan says 'Viral,' you can use it to contest my note. So now, Good's Theorem applies."

  The theorist grabs the pen. "You manipulated my priors!"

  "I updated your incentives," the doctor says. "Now, hold still. This part isn't free."
