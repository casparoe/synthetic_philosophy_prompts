prompt: |-
  hey, quick context: i'm in a social choice theory course (cross-listed phil/econ, 14 students, mostly 3rd years) and next week it's my turn to run the 50-minute discussion section on Sen's impossibility of the Paretian liberal. the prof wants us to actually run something in section rather than just summarize the paper, which i love in theory but am struggling to pull off. design it for me?

  heres what i had in mind so far: everyone gets one "personal" issue that only they get to decide (like, whether person X reads the dull 2-page handout before class or watches a short video instead), and the class as a whole also has to collectively pick some social outcome (like what we do with the last 10 minutes of section, or something). the catch is the personal issues are rigged so that what's best for the decider is bad for at least one other person — i want them to literally run into the cycle where you can't both respect everyone's personal sphere and move to a Pareto-improvement, without me tipping them off that thats where we're headed.

  concrete things i need from you:

  - runnable rules for 14 people in 50 minutes, materials limited to paper/slides/maybe candy, and a payoff scheme with no real money but where people actually care (e.g., points that excuse you from the weekly reading quiz — prof already ok'd that)
  - the preference structure rigged in advance: what's on everyone's little score card, who gains and loses from what, so the cycle is guaranteed to show up instead of being a maybe
  - a second stage i want but don't know how to build: after they hit the cycle, someone (me, or a chosen "chair") gets to set the order in which pairwise votes happen, and the group should see that when you're stuck in a cycle, whoever controls the agenda basically picks the winner. that part really interests me, so make it meaty
  - an optional third stage if time allows: let them try to "fix" the constitution — amend the rules, e.g. abolish personal spheres, or narrow what counts as a social vs. a personal issue — and map each attempted fix onto an escape route from the theorem (drop minimal liberalism, drop pareto, restrict the domain, redefine the sphere, etc.)
  - a debrief that maps specific moments in the game onto the formal conditions (minimal liberalism, the pareto condition, acyclicity, unrestricted domain and so on) in fairly plain language, since the econ people have never read sen and the phil people have never seen a social welfare function written down
  - an honest section on what will predictably go wrong when i run it the first time (people not caring about the stakes, someone trying to be clever and trade votes — although honestly maybe vote trading is a feature not a bug? you tell me how to handle it) and which part of the theorem the game just cannot reproduce no matter how i run it. like, it's one rigged preference profile, not a proof over all profiles satisfying the conditions — i think that distinction matters but you tell me

  end your whole answer with a line that reads "Bottom line:" followed by exactly one sentence on the single most important thing for me to keep in mind while running this.
