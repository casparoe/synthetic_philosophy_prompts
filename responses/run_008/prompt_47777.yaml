answer: |-
  Here is a complete lesson plan designed for 14 students in 50 minutes. It balances the formal logic of Sen's theorem with the practical constraints of a discussion section.

  ### 1. The Setup: Rules & Payoffs
  **Materials:**
  *   **Slides:** Displaying the 3 Social States ($X, Y, Z$).
  *   **14 Preference Cards:** Envelopes handed out secretly. 2 are "Rights Holder" cards, 12 are "Citizen" cards.
  *   **Whiteboard:** To track social preferences and the cycle.
  *   **Stakes:** 5 "Quiz Skip" tokens. At the end of class, the 5 students with the highest personal payoff scores hand in a token to excuse themselves from next week's reading quiz.

  **The Social States (Projected on Screen):**
  *   **Outcome $X$:** Class watches a 10-min video. (RH1 wears socks).
  *   **Outcome $Y$:** Class reads a 10-min handout. (RH2 sits in front).
  *   **Outcome $Z$:** Class plays a 10-min game. (Neutral attire/seating).

  **The Rules:**
  1.  **Rights:** Two students (RH1 and RH2) have "Personal Spheres." For specific pairs of outcomes, only their vote counts.
  2.  **Pareto:** For any pair not covered by a Personal Sphere, if *everyone* prefers one outcome, society adopts it.
  3.  **Voting:** For all other comparisons, we use majority rule (though in this rigged profile, Pareto will dominate the non-rights pairs).
  4.  **Payoffs:** You get 3 points if your 1st choice wins, 2 points for 2nd, 1 point for 3rd. Top 5 scores get the Quiz Skip token.

  ### 2. The Rigged Preference Structure
  *Hand these out in envelopes. Tell students: "Your card dictates your true preferences. To earn points, you must advocate for these rankings."*

  **Student 1 (Rights Holder A):**
  *   **Your Right:** You are decisive over **$X$ vs. $Y$**. (Whatever you prefer, society prefers).
  *   **Your Preferences:** $Z \succ X \succ Y$
  *   *Logic:* You exercise your right to make $X \succ Y$. You prefer $Z$ most, but Pareto requires everyone to agree on that.

  **Student 2 (Rights Holder B):**
  *   **Your Right:** You are decisive over **$Y$ vs. $Z$**.
  *   **Your Preferences:** $Y \succ Z \succ X$
  *   *Logic:* You exercise your right to make $Y \succ Z$. You prefer $Y$ most.

  **Students 3–14 (The Citizens):**
  *   **Your Right:** None.
  *   **Your Preferences:** $Z \succ X \succ Y$
  *   *Logic:* You strongly prefer the Game ($Z$). You all agree $Z \succ X$.

  **Why this guarantees a cycle:**
  1.  **Liberalism 1:** RH1 prefers $X \succ Y$, so Society says **$X \succ Y$**.
  2.  **Liberalism 2:** RH2 prefers $Y \succ Z$, so Society says **$Y \succ Z$**.
  3.  **Pareto:** Everyone (including RH1 & RH2) prefers $Z \succ X$, so Society says **$Z \succ X$**.
  4.  **Result:** $X \succ Y \succ Z \succ X$. (Intransitive Cycle).

  ### 3. Stage 1: Hitting the Wall (15 Minutes)
  1.  **Assign Roles:** Hand out the cards. Ask RH1 and RH2 to stand. Announce their "Personal Spheres" publicly.
  2.  **Establish Rights:** Ask RH1: "Between $X$ and $Y$, what is the social choice?" They pick $X$. Write **$X \succ Y$** on the board. Ask RH2: "Between $Y$ and $Z$?" They pick $Y$. Write **$Y \succ Z$** on the board.
  3.  **Establish Pareto:** Ask the whole class: "Between $Z$ and $X$?" Everyone raises hands for $Z$. Write **$Z \succ X$** on the board.
  4.  **The Reveal:** Draw the circle on the board. Ask: "Okay, based on our rules, what are we doing for the last 10 minutes?"
  5.  **The Frustration:** Let them sit in the silence of the contradiction. They cannot select a winner without violating one of the rules they just enacted.

  ### 4. Stage 2: Agenda Control (15 Minutes)
  *This addresses your interest in how order dictates outcomes.*

  1.  **Appoint a Chair:** Pick a neutral Citizen (Student 3) to be the "Chair." Give them the marker.
  2.  **The Power:** Explain that when there is a cycle, the Chair decides the **order of pairwise voting**. The winner of the first vote faces the third option.
  3.  **Scenario A:** Chair votes $X$ vs. $Y$ first ($X$ wins by Right). Then $X$ vs. $Z$ ($Z$ wins by Pareto). **Winner: $Z$**.
  4.  **Scenario B:** Chair votes $Y$ vs. $Z$ first ($Y$ wins by Right). Then $Y$ vs. $X$ ($X$ wins by Right). **Winner: $X$**.
  5.  **Scenario C:** Chair votes $Z$ vs. $X$ first ($Z$ wins by Pareto). Then $Z$ vs. $Y$ ($Y$ wins by Right). **Winner: $Y$**.
  6.  **Discussion:** Ask the Chair: "How does it feel to know that you didn't pick the policy, you just picked the math?" Ask the class: "Is this democracy or dictatorship?"

  ### 5. Stage 3: Constitutional Convention (Optional, 10 Minutes)
  *If time allows, move to solutions.*

  1.  **The Task:** "You are stuck. You need a decision. Amend the constitution."
  2.  **Brainstorm:** Let them propose rule changes. Write them on the board.
  3.  **Map to Theory:** As they suggest fixes, label them with Sen's conditions:
      *   "Take away RH1's right." $\rightarrow$ **Drop Minimal Liberalism.**
      *   "Ignore the vote on $Z$ vs $X$ even if everyone agrees." $\rightarrow$ **Drop Pareto Principle.**
      *   "Only allow preferences that don't create cycles." $\rightarrow$ **Restrict Domain (Single-Peakedness).**
      *   "Let RH1 trade their right for something else." $\rightarrow$ **Logrolling (violates Independence of Irrelevant Alternatives).**

  ### 6. The Debrief (5 Minutes)
  *Connect the game to the formal theorem in plain language.*

  *   **Minimal Liberalism:** "We gave two people a private sphere. Sen says even this tiny bit of freedom is too much."
  *   **Pareto Condition:** "We agreed that if everyone wants $Z$ over $X$, we should do $Z$. Seems harmless, right?"
  *   **Unrestricted Domain:** "You all had different preference cards. Sen says *any* logical set of preferences like this is possible."
  *   **Acyclicity:** "We ended up with $X \succ Y \succ Z \succ X$. A society that cycles like this has no 'will'. It can't choose."
  *   **The Takeaway:** "Sen proved you can't have all four. You must sacrifice either efficiency (Pareto), freedom (Liberalism), or consistency (Acyclicity)."

  ### 7. Honest Section: What Will Go Wrong & Limitations
  **Predictable Failures:**
  *   **Vote Trading:** Students might try to trade ("I'll vote $X$ if you give me your quiz token"). **Handle:** Forbid explicit trading during Stage 1 to preserve the logic. In the debrief, acknowledge that logrolling is a real-world "fix" but note it introduces instability and inequality.
  *   **Apathy:** If the quiz skip doesn't matter, they won't care. **Handle:** Emphasize the tokens immediately. If possible, bring actual physical tokens (cards) to make it tangible.
  *   **Confusion on Rights:** Students might think "Decisive" means "Veto." **Handle:** Clarify that "Decisive" means "My preference *becomes* the social preference, regardless of others."

  **Theoretical Limitations (Crucial for Phil/Econ Mix):**
  *   **One Profile vs. All Profiles:** This game shows *one* rigged preference profile that breaks the system. Sen's theorem is stronger: it proves that *for any* decision rule, there *exists* at least one profile like this. You are showing an existence proof example, not the proof itself.
  *   **Voting Rule vs. Social Welfare Function:** We used pairwise voting with rights. Sen's theorem applies to *any* Social Decision Function. We showed one specific function fails; Sen proves *all* must fail under these conditions.
  *   **Sincere vs. Strategic:** The game assumes students vote their cards. In reality, strategic voting might break the cycle, but Sen's theorem holds even when accounting for strategy (in most formulations).

  Bottom line: Your primary goal is not to prove the math but to make them feel the visceral frustration of a system that is simultaneously fair, efficient, and broken.
