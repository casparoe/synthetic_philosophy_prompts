answer: |-
  This is one of the most common and understandable sticking points in *Naming and Necessity*. Your intuition that the modal status of "Water is H2O" seems to shift over time is shared by many students (and philosophers) upon first encountering Kripke. It feels like the world was "open" until Lavoisier closed it.

  However, on the Kripkean view, your reasoning contains a category error regarding *what* is changing over time. To answer your questions directly: **The truth did not change from contingent to necessary.** It was always necessary. What changed was our *epistemic access* to that necessity.

  Here is a breakdown of where the reasoning goes wrong, what the chemists were actually doing, and the distinction your professor was hinting at.

  ### 1. The Temporal Shift: Metaphysics vs. Epistemology

  Your first question asks: *At what point does a truth change from contingent to necessary?*

  **The Kripkean Answer:** Never.

  Kripke draws a sharp distinction between **metaphysical modality** (how the world is) and **epistemic modality** (what we know about the world).
  *   **Metaphysical Necessity:** A proposition is necessary if it is true in all possible worlds.
  *   **Epistemic Possibility:** A proposition is possible if it is compatible with everything we currently know.

  Before the 1780s, it was *epistemically possible* that water was not H2O. Given what people knew, there was no contradiction in believing water was an element, or earth, or XYZ. However, it was never *metaphysically possible* for water to be something other than H2O (assuming "water" rigidly designates the substance with that molecular structure).

  The mistake is to think that because our *knowledge state* changed (from ignorance to discovery), the *modal status of the proposition* changed. Consider the proposition "The Morning Star is the Evening Star." Before astronomers realized both were Venus, it was an open empirical question. But was it *contingent* before the discovery and *necessary* after? No. The identity of the planet Venus was fixed regardless of human observation. We simply didn't know it.

  Similarly, the essence of water was fixed before the 1780s. The chemists did not *make* it true that water is H2O; they *found out* that it was.

  ### 2. Why do Experiments if the Truth is Necessary?

  Your second worry is: *If "Water is H2O" is necessary, no experiment could have come out otherwise. So why do the experiment? Did we get lucky?*

  This relies on conflating **the outcome of the world** with **the outcome of our investigation.**

  Imagine you are digging a hole to find a buried pipe.
  *   **Metaphysical Fact:** The pipe is either there or it isn't. That fact is fixed.
  *   **Epistemic Process:** You have to dig to find out which fixed fact obtains.

  If the pipe is there, it was *necessary* (given the past construction work) that it was there. But you still had to dig. If you dug and didn't find it, you wouldn't say, "The pipe mysteriously vanished." You would say, "My belief that the pipe was here was false."

  Applied to chemistry:
  1.  **The Setup:** We point to a liquid and say, "This stuff is 'water'." By using the term as a **rigid designator**, we are saying, "Whatever stuff *this* turns out to be, in every possible world, 'water' refers to stuff of that kind."
  2.  **The Investigation:** We analyze the microstructure.
  3.  **The Result:** We find it is H2O.

  **Could the experiment have shown XYZ?**
  In a sense, yes. The *reading on the dial* could have indicated XYZ. But if the reading indicated XYZ, Kripke argues we would not conclude "Water is XYZ." We would conclude one of two things:
  *   "The stuff in the lakes is not water."
  *   "Our theory of what constitutes 'the same substance' is wrong."

  If we discovered that the liquid in the oceans had the molecular structure XYZ, Kripke's view implies that **we would discover that there is no water on Earth.** We would be on Twin Earth. We wouldn't say "Water turned out to be XYZ." We would say "What we *called* water is actually XYZ."

  So, we didn't "get lucky" that the necessary truth coincided with the lab results. Rather, the lab results told us **which** necessary truth was the case. There are many necessary truths (Water is H2O, Water is not XYZ, Water is not Gold). We needed empirical work to rule out the false necessary truths and identify the true one.

  ### 3. What Were the Chemists Doing? (Discovering vs. Making)

  You asked: *Were they discovering a necessary truth, or making one true?*

  On the Kripkean view, they were **discovering** a necessary truth.

  This is the heart of Kripke's attack on descriptivism. If the meaning of "water" were "the clear, drinkable liquid in the lakes," then the chemists would be analyzing a concept. If they found XYZ, the statement "Water is XYZ" would be true by definition.

  But Kripke argues "water" is not a description; it is a name for a natural kind. The "nature" of that kind is determined by the world, not by our definitions.
  *   **Reference Fixing:** Happened long ago, by ostension ("Let's call *this* liquid 'water'").
  *   **Theoretical Identification:** Happened in the 1780s. This is the discovery of the essential property that makes something belong to the kind referred to by the name.

  The chemists were acting like explorers mapping a continent. The borders of the continent (the modal status of the substance) existed before the map was drawn. Drawing the map didn't create the borders; it revealed them.

  ### 4. The Professor's Hint: Two Senses of "Possibility"

  Your professor hinted that you are running together two senses of "necessity" (or more accurately, modality). This is the key to unlocking the puzzle.

  1.  **Epistemic Modality (A Priori/A Posteriori):** Concerns what is knowable independent of experience.
      *   *Question:* "Could we know this without testing?"
      *   *Answer:* No. "Water is H2O" is **a posteriori**. It required testing. Before testing, it was epistemically contingent (compatible with our knowledge that it might be false).
  2.  **Metaphysical Modality (Necessary/Contingent):** Concerns how the world could have been.
      *   *Question:* "Could the world have been such that water exists but is not H2O?"
      *   *Answer:* No. "Water is H2O" is **metaphysically necessary**. Given that water is H2O in the actual world, there is no possible world where water exists and is not H2O.

  **The Error:** You are treating *Epistemic Contingency* (we didn't know it yet) as if it were *Metaphysical Contingency* (the world could have been otherwise).

  When you say, "Before the 1780s... surely it was an open question what water turned out to be — a contingent matter," you are correct that it was an *open question* (epistemic), but incorrect that it was a *contingent matter* (metaphysical).

  ### Summary of the Kripkean Commitment

  To answer your specific questions directly:

  *   **When did the truth become necessary?** It didn't. It was always necessary. The *discovery* is in time; the *truth* is outside of time.
  *   **Did we get lucky?** No. We investigated to see which necessary identity obtained. If the labs had found XYZ, we would have discovered that the stuff we were calling "water" was not water (or that water does not exist here).
  *   **What were the chemists doing?** They were discovering the essential structure of a substance that had already been named. They were not fixing the reference (that was done by speakers pointing to lakes); they were identifying the essence of the referent.

  The "oddness" you feel comes from the fact that human language feels like a human construct. We feel like *we* decide what words mean. Kripke's radical move is to say that for natural kind terms, the world decides what the word refers to, and our job is just to catch up. The necessity comes from the world, not from our definitions.
