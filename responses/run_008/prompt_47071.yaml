answer: |-
  Here is a design for the 90-minute session, structured to force the students into Taurek's framework before allowing them to escape it.

  ### 1. Roles and Setup (10 Minutes)

  **The Configuration:**
  *   **The Six at Risk:** Six students. Five are grouped together (Room A); one is separate (Room B). The student in Room B is **David**.
  *   **The Rescuer:** One student. They hold the "key" (a physical object, e.g., a heavy set of keys or a distinct token).
  *   **The Panel:** The remaining seven students. They sit in a semi-circle facing the Rescuer.
  *   **The Audience:** The remaining students (if any; with 14 total, everyone is assigned a role above).

  **The Scripted Opening (Read by Instructor):**
  > "Imagine a flood. The water is rising in a basement complex. You are the Rescuer. You stand at the junction of two corridors.
  >
  > To your left is Door A. Behind it are five people. They are strangers to you. They are strangers to each other. They cannot open the door from the inside.
  > To your right is Door B. Behind it is one person, David. He is a stranger to you. He cannot open the door from the inside.
  >
  > You have one mechanism. It can pump the water out of Corridor A *or* Corridor B. It cannot do both. The mechanism takes ten minutes to engage. Once engaged, it cannot be stopped or switched. If you do not engage it within ten minutes, the water rises in both corridors. Everyone dies.
  >
  > There is no hospital policy. There is no government triage protocol. There is no law. There is only you, the mechanism, and the people behind the doors. They can hear you. You can hear them.
  >
  > Rescuer, take your position. Panel, prepare to judge. The clock starts now."

  **Design Strain:**
  *   **Artificial Isolation:** In reality, no one is ever *truly* stripped of policy or social context. Students will immediately suspect there is a "correct" utilitarian answer hidden in the prompt. You must enforce the "no policy" rule strictly if they try to appeal to "what society expects."

  ### 2. The Pleading Phase (20 Minutes)

  **The Rule:**
  Each of the six at risk steps forward (or speaks from their seat) to address the Rescuer directly. They have exactly two minutes.
  *   **Constraint:** They may **not** mention the number of people in their room. The five in Room A cannot say "we are five." They must speak as "I."
  *   **Constraint:** The Rescuer cannot speak, gesture, or react. They must maintain eye contact with the speaker.

  **Briefing the Pleaders (Private Handout/Whisper):**
  *   **To David:** "You know you are alone. You know there are others. Do not beg for pity. Argue for your equal worth. Why is *your* life not less valuable than any single one of the five?"
  *   **To the Five:** "You are forbidden from saying 'there are five of us.' You cannot use arithmetic. You must explain why *you*, individually, deserve to be saved. If you coordinate and all say the same thing, you fail. You must distinguish your own claim."

  **Design Strain:**
  *   **The Chorus Effect:** Students playing the five will naturally try to signal their plurality through body language or by echoing each other's points ("I have a family," "I have a future"). You must interrupt if they explicitly aggregate ("We all have families").
  *   **Rescuer Discomfort:** The Rescuer will likely giggle or look away to manage the social tension. Instruct them beforehand: "Your discomfort is the point. Do not manage it. Endure it."

  ### 3. The Pairwise Phase (20 Minutes)

  **The Task:**
  The Panel must deliberate aloud. They are not deciding the case yet. They are filling out a **Comparative Loss Ledger**.
  For each of the five individuals (P1, P2, P3, P4, P5), the Panel must answer this specific question regarding David:
  *"If we save P1 and let David die, is David suffering a **greater** loss than P1 would have suffered if we saved David and let P1 die?"*

  **Running the Deliberation:**
  *   Do not allow a vote until the reason is stated.
  *   **Instructor Intervention:** If a Panelist says, "But if we save David, five people die," stop them. Rephrase: "I am not asking about the five. I am asking about David versus Person 1. Is David's death worse than Person 1's death?"
  *   **Goal:** Force the Panel to admit that, pairwise, the loss is identical (death).
  *   **Recording:** Write the five answers on the board. Ideally, they should all read: "No greater loss."

  **Design Strain:**
  *   **Aggregation Creep:** Panelists will struggle to keep the "group" out of the 1v1 comparison. They will say, "But P1 is part of the five." You must insist: "Strip P1 of their group membership. Compare the human to the human."
  *   **Boredom:** Comparing five identical pairs can feel repetitive. Keep the pace brisk. The repetition *is* the philosophical point (Taurek's insistence that the sum is not a loss experienced by anyone), but students may find it tedious.

  ### 4. The Decision and The Ballot (15 Minutes)

  **The Decision:**
  The Rescuer announces their choice. They may save the five, save David, or flip a coin. (Do not constrain them; let the pressure of the room dictate).

  **The Secret Ballot:**
  Before discussing the Rescuer's choice, distribute slips of paper. All students (Panel, Rescuer, Victims) vote anonymously.
  *   **Question 1:** "If you were the Rescuer, would you personally prefer to save the five rather than flip a coin?" (Yes/No)
  *   **Question 2:** "If the Rescuer flips a coin and it lands against the five, has the Rescuer **wronged** any of the five?" (Yes/No)

  **Collection:**
  Collect the ballots. Tally them visibly on the board.
  *   *Look for:* A high "Yes" on Q1 (Preference) paired with a significant "No" on Q2 (Wronging).
  *   *The Gap:* This gap is the pedagogical entry point. It shows students distinguish between *what is better* and *what is obligatory/permissible*.

  **Design Strain:**
  *   **Social Desirability Bias:** Students may vote "No" on Q2 because they think *you* want them to agree with Taurek. Emphasize anonymity heavily.
  *   **Confusion on "Wronging":** Students may conflate "wronging" with "causing sadness." Clarify verbally before voting: "Wronging means violating a moral right or duty, not merely causing disappointment."

  ### 5. The Debrief (25 Minutes)

  **Mapping the Activity to Taurek:**
  1.  **The Pleading:** Connect this to Taurek's "What do you say to David?" challenge. If you save the five, what justification do you offer David that doesn't treat him as a mere means to maximize survival stats?
  2.  **The Pairwise Ledger:** Connect this to Taurek's claim that "loss" is only intelligible from the perspective of the loser. No single person loses "five lives." Therefore, the aggregate loss is a fiction.
  3.  **The Ballot Gap:** Use the Q1/Q2 split to distinguish **Optimific** (producing the best outcome) from **Obligatory** (what duty requires). Taurek argues the coin flip is *permissible* (no one is wronged) even if saving the five is *preferable* (we like more life).

  **Distinguishing the Theses:**
  Write two sentences on the board:
  *   (A) "The numbers count." (Saving 5 is better than saving 1).
  *   (B) "The five have a complaint." (Saving 1 via coin flip violates the five's rights).
  Ask the class: "Can you accept A but reject B?" Taurek argues you can. He admits we *prefer* to save the five, but denies the five have a *claim of right* that overrides David's equal claim.

  **Procedure vs. Outcome:**
  Leave them with this question: "If the harm is in the procedure (being disregarded) rather than the outcome (dying), does the coin flip cure the harm?"

  ---

  ### Honest Notes: Where This Design Strains

  #### 1. Predictable Failures & Mitigation

  *   **The Utilitarian Reflex:** Students will treat the "no policy" constraint as a puzzle to be solved rather than a moral constraint to be felt. They will say, "Rationally, we save the five."
      *   *Fix:* In the debrief, validate this. "You are right that it is rational. Taurek asks if it is *fair*." Distinguish rationality from fairness.
  *   **The Pleaders Will Count:** Despite instructions, the five will say, "Think of our children" (plural) or stand together to visually aggregate.
      *   *Fix:* Do not stop the flow. Note it in the debrief. "Notice how hard it was to argue for your life without using your group as a shield. That difficulty is why we usually rely on numbers."
  *   **The Rescuer Will Flip Immediately:** A clever student might realize the "Taurekian" move is to flip and do it instantly to look philosophical.
      *   *Fix:* Instruct the Rescuer beforehand: "Do not decide until you have heard all pleas. You must feel the weight."
  *   **Nervous Laughter:** This scenario is high-pressure for undergraduates. They may laugh to diffuse tension.
      *   *Fix:* Acknowledge it. "The absurdity you feel is the distance between the theory and the stakes. Taurek wrote this in an armchair. You are in a room."

  #### 2. What The Activity Cannot Reproduce (Taurek's Missing Resources)

  You must supply these verbally in the debrief, because the role-play inherently strips them away:

  *   **The Asymmetry of Relation:** You noted that in the paper, the rescuer often knows David. Taurek uses the "friend" case to show that *special obligations* exist, but he argues that *without* special obligations, numbers still don't count. This activity makes everyone strangers.
      *   *What to Supply:* Tell them: "Taurek's argument is actually stronger in one way than our game. In the game, you are all classmates. In Taurek's thought experiment, David is a *stranger*. If you feel you should save the five here, imagine you don't know any of them. Taurek argues that even then, David's claim is not mathematically outweighed. I removed the 'friend' element to isolate the numbers, but know that Taurek thinks even strangers have this protection against aggregation."
  *   **The Reality of Loss:** Students know no one is dying. They cannot feel the "loss" that Taurek insists is the only moral currency.
      *   *What to Supply:* "You voted on 'wronging' based on logic. Taurek argues from the phenomenology of loss. When you die, you lose *your* future. You do not lose 'the group's future.' Because the loss is radically individual, the remedy must be radically individual (a chance), not collective (a sum)."
  *   **The "No Worse Off" Claim:** Taurek argues David is not made worse off by the coin flip than he would be if you simply chose the five (in both cases he might die, but in the flip, he had a chance).
      *   *What to Supply:* This is the hardest conceptual leap. The game shows the *procedure* of the flip, but it doesn't prove David isn't worse off. You must articulate: "Taurek claims that having a 50% chance is not 'worse' than having a 0% chance, even if the 50% chance fails. The game lets you see the procedure; you must use your imagination to feel the moral status of that chance."

  **Final Warning:**
  This session will likely end with more confusion than clarity. That is a success. If they leave thinking "Taurek is crazy but I see why he said it," you have achieved the goal. If they leave thinking "Utilitarianism is obviously right," the activity has failed. Monitor the Ballot Gap closely; that is your metric for success.
