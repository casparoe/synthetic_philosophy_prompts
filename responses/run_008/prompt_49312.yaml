  7.  **Address Specific User Questions:**
      *   *2018 Study Critique:* Yes, Richardson et al. (2020) and others challenged the scoring. Relative vs. Absolute matters. If you look at absolute numbers of women in STEM, equality often correlates positively. The paradox often disappears or reverses depending on the metric (share of degrees vs. raw numbers vs. performance).
      *   *Causal Story:* Researchers generally warn against causal claims from this data. The "biology" claim is definitely not the standard interpretation in the broader field, though it is the implication often drawn by popularizers.
      *   *Policy Move:* Does not follow. Discrimination can exist even with preference differences (e.g., in hiring, pay, retention).

