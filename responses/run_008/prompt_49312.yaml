  3.  **Evaluate Claim 1 & 2 (The Finding):**
      *   *Study:* Stoet & Geary (2018).
      *   *Finding:* Negative correlation between Gender Equality Index (GEI) and percentage of women in STEM.
      *   *Critique:* Yes, there were significant critiques. Falk & Hermle (2018) used different data. Richardson et al. (2020) challenged the statistical methods and the specific indices used.
      *   *Relative vs. Absolute:* This is crucial. Stoet & Geary looked at the *proportion* of STEM grads who are women. Critics argue looking at *absolute* numbers or controlling for academic strength changes the picture. Also, the "gender equality" index (WEF GGGI) includes economic participation, which might confound the result (i.e., countries with low female labor participation might have high STEM % because only the most driven women work).
      *   *Verdict:* The finding exists but is highly contested and sensitive to measurement choices. It's not a "settled fact."

  4.  **Evaluate Claim 3 (The Explanation):**
      *   *Hypothesis:* Economic security allows pursuit of intrinsic interests (which differ by sex).
      *   *Status:* This is *a* hypothesis proposed by the authors. It is not the *only* explanation. Other explanations include: stereotype threat varies by culture, the definition of "equality" in the index, or that STEM is more competitive/risky in wealthy nations.
      *   *Verdict:* Plausible hypothesis, but presented by the buddy as *the* explanation.

  5.  **Evaluate Claim 4 (The Biological Inference):**
      *   *Claim:* Gap = Biological baseline.
      *   *Status:* This is a massive leap. Cross-sectional correlational data cannot establish causality, let alone biological causality. "Innate preferences" are not proven to be biological; they could be socialized differently in different cultures (even egalitarian ones).
