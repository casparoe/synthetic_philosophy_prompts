  *(Refining the "Biology" point)*: The buddy says "innate preferences... real biological one." The study authors (Stoet & Geary) suggest "intrinsic interests" but are often more cautious than the buddy. The leap to "biological" is largely an interpretation by commentators, not necessarily the paper's definitive conclusion, though the paper invites it. I should clarify that distinction.

  *(Refining the "Policy" point)*: Even if preferences differ, discrimination can exist in *which* jobs men/women get within fields, or pay gaps. Quotas often target representation, which could be argued against if preferences are fixed, but the leap from "study choices" to "hiring discrimination" is also a gap. I will focus on the fact that the study measures *graduation choices*, not *hiring discrimination*.

