      *   Ensure "settled" and "contested" reflect the nuance (e.g., settled that the correlation is sensitive to metrics).

  10. **Review against Constraints:**
      *   *Check:* Did I distinguish settled vs. contested? Yes.
      *   *Check:* Did I address the 2018 study critiques? Yes (Richardson et al., Falk & Hermle).
      *   *Check:* Did I address the biology claim? Yes (overreach).
