  6.  **Evaluate Claim 5 (The Policy Conclusion):**
      *   *Claim:* Quotas fight nature.
      *   *Status:* Non-sequitur. Even if preferences differ, quotas might address discrimination in hiring/promotion, not just pipeline issues. Also, "nature" isn't proven.
