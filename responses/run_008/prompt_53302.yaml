  # Joint Statement on Compatriot Partiality and Global Justice

  **Introduction**
  After six years of debate, we acknowledge that our disagreement regarding compatriot partiality is not merely verbal, yet significant portions of our past conflict stemmed from divergent definitions of key moral terms. This document represents an adversarial collaboration. We do not claim consensus on the substantive moral questions, but we commit to the following framework to isolate our remaining differences.

  **I. Agreed Claims**
  1.  **The Moral Status of Borders:** National boundaries are coercive institutional facts, not natural kinds. They possess no intrinsic moral magic, but they create distinct schemes of cooperation and coercion that generate specific moral hazards and opportunities.
  2.  **Rejection of Extremes:** We both reject ethno-nationalist exclusion (which denies basic rights to outsiders based on identity) and radical open-border cosmopolitanism (which dissolves political community regardless of stability). Some restriction is permissible; some obligation to outsiders is mandatory.
  3.  **The Non-Participant Problem:** Both the institutional view (grounding duties in cooperation) and the relational view (grounding duties in shared nationality) owe an explanation for individuals who fall outside the core definition but remain subject to state power (e.g., long-term residents without citizenship, or citizens living abroad).
  4.  **Instrumental Value:** We agree that national institutions are instrumentally valuable for delivering justice. The disagreement is whether they are *constitutively* valuable for generating special obligations.

  **II. Residual Disagreements**
  | Topic | Nationalist Wording (D.) | Cosmopolitan Wording (User) |
  | :--- | :--- | :--- |
  | **Source of Special Duties** | Special duties arise from co-authorship of a shared political life and common institutions. | Special duties are instrumental shortcuts; the fundamental duty is owed to persons regardless of scheme. |
  | **Priority of Claims** | It is permissible to prioritize compatriot claims over outsider claims of similar moral intensity. | Outsider claims trump compatriot claims when the outsider is significantly worse off. |

  **III. Cruxes and Test Cases**
  To move forward, we identify specific empirical or conceptual claims where changing our mind would shift our position.

  1.  **Institutions vs. Formal Membership:** Do special claims flow through actual institutional cooperation or through formal legal status?
      *   *Test Case:* A citizenship-by-investment passport holder who has never entered the country vs. a citizen abroad subject to citizenship-based taxation.
      *   *Nationalist Prediction:* The investor acquires claims (legal membership suffices); the tax-bound non-resident lacks claims on domestic welfare (no participation in shared life).
      *   *Cosmopolitan Prediction:* The investor lacks special claims (no relational depth); the tax-bound non-resident retains claims (subject to coercive jurisdiction).

  2.  **Scope of Impartiality:** Does "impartiality" require equal concern for all persons or only for all claimants within a cooperative scheme?
      *   *Test Case:* Defining the boundary of the moral community for distributive justice.
      *   *Nationalist Prediction:* Impartiality is internal to the scheme; outsiders are owed humanitarian aid, not equal concern.
      *   *Cosmopolitan Prediction:* Impartiality is global; scheme boundaries are morally arbitrary for weighting interests.

  3.  **Distributive Metric (Editor's Addition):** We suspect a third crux exists regarding the metric of distribution, which we had not explicitly nailed down. Is the goal a sufficiency floor for outsiders or global prioritarianism?
      *   *Test Case:* Allocating resources between a moderately poor compatriot and a destitute outsider.
      *   *Nationalist Prediction:* Compatriot priority holds until the outsider falls below a basic sufficiency threshold.
      *   *Cosmopolitan Prediction:* Resources must follow the prioritarian weighting globally, regardless of the threshold.

  **Conclusion**
  We sign this not as evidence of resolution, but as a map of the remaining terrain. We commit to testing these predictions against future cases rather than retreating to abstract principle.

  **Signature:**
  "We remain unconvinced by each other's core premises, but we agree that this document accurately locates the source of our disagreement and commit to resolving it through these specific test cases."

