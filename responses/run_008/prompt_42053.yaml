      *   *Q2: Uniqueness/Indeterminacy.*
          *   Compiler: Principal Type Property (usually unique).
          *   Davidson: Indeterminacy of Translation (Quine/Davidson). Multiple theories fit the data.
          *   *Programming Analog:* Overloading, structural typing ambiguities, or simply under-constrained inference (where `a` could be `int` or `float` without more info).
          *   *Residue:* Davidson thinks indeterminacy is *ontological* (no fact of the matter), not just epistemic (we don't know yet). Compilers treat ambiguity as an error to be resolved.

  6.  **Developing the Residue Report:**
      *   *Clean Map:* Holism (dependencies), Constraint Propagation (contextual meaning), Charity as a Solver Heuristic.
      *   *Distorted Map:* Truth vs. Type Safety. Normativity (ought vs. is).
      *   *Unmappable:* The ontological status of meaning. The role of the "world" vs. the "runtime environment."

  7.  **Final Verdict on "Compiler assumes I'm competent":**
      *   It's a good heuristic analogy, but technically inverted.
      *   Compiler: "I will assume this is valid until proven otherwise (to give helpful errors)" OR "I will enforce rules to ensure validity."
      *   Davidson: "I must assume you are valid (true) to even start parsing."
      *   *Correction:* It's closer to "Dependency Injection" or "Mocking." You assume the dependencies work to test the module. Or better: *Gradual Typing* migration.

  8.  **Refining the Tone and Jargon:**
      *   Ensure terms like "Truth Conditions," "Holism," "Normativity," and "Ontology" are explained simply.
      *   Keep the programming terms precise (HM inference, unification, constraints).
      *   Maintain the "Philosopher-Engineer" persona.

  9.  **Self-Correction/Review during drafting:**
