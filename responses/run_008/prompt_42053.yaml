      *   *Check:* Did I address Indeterminacy? (Yes, distinguish between "under-constrained" and "fundamentally multiple solutions").
      *   *Check:* Is the verdict honest? (Yes, point out the normative gap).

  10. **Final Polish:** Organize into clear sections: Setup, Translation, Residue Report, Specific Questions, Verdict. (Proceed to generate output based on this structure).

  *(Self-Correction Note during drafting the response)*: I need to be careful not to equate "Type" directly with "Meaning" too simplistically. In Davidson, meaning is *truth conditions*. In programming, a type is a *set of values/behaviors*. The closer analog might be an *Interface* or a *Contract*. I will use "Type/Contract" to be precise. Also, need to emphasize that Davidson's Charity is constitutive, not just methodological. It's not just a trick; it's what *makes* interpretation possible. The compiler's type check is verification, not constitution. This is a major point for the "Residue."

  Let's refine the "Spec" analogy. If I'm inferring types for a Python script, there is no spec. But there *is* a runtime behavior. Davidson doesn't even have the runtime behavior as a hard spec, because "holding true" is already interpreted behavior. The closest编程 analogy is **Program Synthesis** or **Inverse Type Inference** where you only have I/O traces.

