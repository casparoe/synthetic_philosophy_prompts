answer: |-
  **To:** The Board of Trustees  
  **From:** [Your Name]  
  **Subject:** Practical Implications of the 'Pasadena' Analysis for Grant Making  

  Dear Colleagues,  

  It is understandable that the analyst's report has caused some concern. To put it plainly: if the analyst is correct that certain grant applications exhibit 'Pasadena-style' properties, it means the expected value (EV) figures currently sitting in your spreadsheet are fundamentally unstable.  

  In ordinary decision-making, we assume that if you add up all the possible outcomes weighted by their probability, you get a single, solid number. The Pasadena paradox demonstrates that for certain risky distributions, this sum does not settle on a single value. Instead, the result depends entirely on the order in which you add the numbers up.  

  While true mathematical infinity does not exist in the real world (you cannot save more people than exist, nor lose more money than you have), the analyst is warning you that your *model* is extremely sensitive to assumptions about rare, extreme events.  

  Here are the practical implications for the boardroom, specifically addressing your question about repeated annual cycles.  

  ### 1. The Ranking List is Misleading  
  If the expected value is conditionally convergent (the technical term for the Pasadena problem), the specific EV number generated by the spreadsheet is arbitrary. Changing the sorting order or the precision of the calculation could flip a grant from 'high priority' to 'high risk' without any change to the actual project.  

  **Action:** Do not use the raw EV figure as the primary ranking metric for these specific applications. Treat the EV number as 'undefined' or 'highly sensitive' rather than a precise score.  

  ### 2. The Trap of Repetition (Annual Cycles)  
  You asked whether making these decisions annually changes the situation. In standard finance, the answer is usually 'yes': if you make a positive EV bet enough times, the Law of Large Numbers suggests you will eventually profit.  

  However, the Pasadena paradox breaks this rule. If the expected value is undefined, the Law of Large Numbers does not apply. This means that even if you make the same grant every year for a decade, the average outcome **will not necessarily stabilise**. You could theoretically face a run of catastrophic outcomes that never 'average out' in the way normal risks do.  

  **Action:** Do not assume that spreading these grants over multiple years reduces the risk. In this specific mathematical context, repetition does not guarantee safety. It may actually expose the foundation to compounding instability.  

  ### 3. Focus on 'Ruins' rather than 'Averages'  
  The paradox arises because the model allows for extreme downsides that outweigh the frequent small upsides. For a charitable foundation, the priority is usually sustainability and impact, not maximising a theoretical average that might never materialise.  

  **Action:** Shift the discussion from 'What is the average return?' to 'What is the worst plausible outcome?'. If a grant carries a non-zero probability of catastrophic failure (e.g., reputational damage, legal liability, or total loss of capital with no benefit), it should be evaluated on that downside risk, regardless of the theoretical upside.  

  ### 4. Practical Steps for the Next Meeting  
  To move forward without getting bogged down in abstract theory, I recommend the board adopts the following protocols for any grant flagged as 'high uncertainty' by the analyst:  

  *   **Truncate the Tails:** Instruct the analyst to cap the extreme values in their model. In reality, outcomes are finite. Ask them to model the 'best plausible case' and 'worst plausible case' based on real-world limits, rather than allowing the mathematics to drift towards infinity.  
  *   **Use the Median, Not the Mean:** The median outcome (the 50th percentile) is not affected by the Pasadena problem. Ask the analyst to provide the median expected impact. This tells you what is *most likely* to happen, rather than what happens on average including impossible extremes.  
  *   **Qualitative Oversight:** For these specific applications, override the spreadsheet. Require a qualitative assessment from the board regarding risk tolerance. If the downside keeps you awake at night, the EV is irrelevant.  
  *   **Diversification:** If you proceed with such grants, ensure they constitute a small minority of the portfolio. Do not allow 'Pasadena-style' risks to dominate the annual budget.  

  ### Summary  
  The analyst has identified a limitation in the modelling tool, not necessarily a flaw in reality. The spreadsheet is trying to calculate a number that does not robustly exist.  

  For the board, the rule of thumb should be: **If the expected value depends on how you count it, you cannot rely on it.** Prioritise median outcomes, cap the extreme assumptions, and do not rely on repeated annual grants to smooth out the risk.  

  Yours sincerely,  

  [Your Name]  
  Board Member
