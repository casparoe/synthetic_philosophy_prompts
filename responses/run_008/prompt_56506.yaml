          *   Remainder: The violation cost isn't just a number; it's a persistent flag. Even in the optimal solution, the violation count for $C_A$ (if $B$ chosen) is $>0$.
          *   Key distinction: In OR, if we relax $C_A$ to Soft, it's no longer a "Hard" obligation. Williams says it *remains* an obligation even if violated.
