      *   *Check:* The "Ought Implies Can" premise. In OR, this is the definition of a valid model. If it's not satisfiable, the model is broken. In Ethics, Anti-Dilemma says the *theory* is broken. Pro-Dilemma says the *world* is broken (or morality is tragic).

