answer: |-
  # Diagnostic Decision Tree: The Peer Disagreement Policy Sorter

  **Instructions:** Begin at **Node 1**. Answer based on your immediate intuition about the case described, not on the theory you think you *should* hold. Follow the branches until you reach a leaf.

  ### The Tree

  **Node 1: The Mental Math Baseline**
  You and a peer calculate a restaurant bill. You conclude $50 each; they conclude $45 each. You recheck your reasoning carefully and find no flaw, nor can you find one in theirs. Do you reduce your confidence to roughly 50% (agnosticism)?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 6.

  **Node 2: The Degree of Revision**
  In the bill case, must you become completely agnostic (split the difference), or is it sufficient to significantly lower confidence while still favoring your answer?
  *   **Split Difference/Agnostic:** Go to Node 3.
  *   **Lower Confidence/Stay Favoring:** Go to Node 4.

  **Node 3: The Self-Undermining Check**
  A peer disagrees with your *policy* on disagreement (they say you shouldn't split the difference). Do you split the difference on *this* question too?
  *   **Yes:** **Leaf A (Equal-Weight View)**
  *   **No:** **Leaf B (Self-Excepting Conciliationism)**

  **Node 4: Domain Specificity (Moral/Religious)**
  In a moral or religious disagreement with a peer, do you reduce confidence exactly as much as in the mental math case?
  *   **Yes (Same Reduction):** Go to Node 5.
  *   **No (Less/No Reduction):** **Leaf C (Domain-Specific Conciliationism)**

  **Node 5: IQ Sensitivity**
  If you discovered the peer has a significantly higher IQ than you, would you reduce your confidence *more* than if IQs were equal?
  *   **Yes:** **Leaf D (Moderate Conciliationism)**
  *   **No:** **Leaf A (Equal-Weight View)** *(Note: Convergence)*

  **Node 6: The Bootstrapping Question**
  Since you held firm in Node 1, did you rely on the very reasoning that produced your belief to judge that your peer is likely mistaken?
  *   **Yes (I used my reasoning to assess them):** Go to Node 7.
  *   **No (I had to set my reasoning aside to assess them):** **Leaf E (Skeptical Steadfastness)**

  **Node 7: The Evidence Subset**
  You learn your peer's evidence was a strict subset of yours (they missed a receipt you saw). Does your confidence rebound to its pre-disagreement level?
  *   **Yes (Full Rebound):** Go to Node 8.
  *   **No (Still Some Doubt):** **Leaf F (Total-Evidence View)**

  **Node 8: The Flawless Reasoning Check**
  If you are certain you made no reasoning errors (not just that you found none), does the peer's view have *any* negative weight on your belief?
  *   **No (Zero Weight):** **Leaf G (Right-Reasons View)**
  *   **Yes (Some Weight):** **Leaf F (Total-Evidence View)** *(Note: Convergence)*

  **Node 9: Domain Specificity (Moral/Religious)**
  (For those who held firm in Node 1). Is "peerhood" possible in religious/moral domains given private experience, or do different rules apply there?
  *   **Same Rules Apply:** Go to Node 10.
  *   **Different Rules Apply:** **Leaf H (Domain-Specific Steadfastness)**

  **Node 10: IQ Sensitivity**
  (For those who held firm). If the peer has a significantly higher IQ, does this force you to revise, or does your first-order evidence trump their intelligence?
  *   **Force Revision:** **Leaf F (Total-Evidence View)**
  *   **Trump Intelligence:** **Leaf G (Right-Reasons View)**

  **Node 11: The Policy Disagreement (Steadfast)**
  A peer disagrees with your steadfast policy on disagreement. Do you revise your policy?
  *   **Yes:** **Leaf F (Total-Evidence View)**
  *   **No:** **Leaf I (Dogmatic Steadfastness)**

  **Node 12: The Track Record**
  If you know you have a better track record than the peer in this domain, can you dismiss their view entirely without revision?
  *   **Yes:** **Leaf G (Right-Reasons View)**
  *   **No:** **Leaf F (Total-Evidence View)**

  ***

  ### The Leaves: Positions and Awkward Commitments

  *   **Leaf A: Equal-Weight View.**
      *   *Awkward Commitment:* Requires you to become agnostic about peer disagreement itself if a peer disagrees with you, potentially undermining the justification for the view.
  *   **Leaf B: Self-Excepting Conciliationism.**
      *   *Awkward Commitment:* Posits a unique epistemic privilege for your own view on disagreement that you deny yourself in all other cases.
  *   **Leaf C: Domain-Specific Conciliationism.**
      *   *Awkward Commitment:* Must explain why the epistemic significance of a peer's mind changes depending on whether the proposition is mathematical or moral.
  *   **Leaf D: Moderate Conciliationism.**
      *   *Awkward Commitment:* Lacks a principled formula for *how much* to revise, risking arbitrariness in confidence adjustment.
  *   **Leaf E: Skeptical Steadfastness.**
      *   *Awkward Commitment:* Accepts that you can hold firm while admitting you have no independent way to verify your peer is less reliable than you.
  *   **Leaf F: Total-Evidence View.**
      *   *Awkward Commitment:* Often yields the same practical advice as Moderate Conciliationism, making the theoretical distinction difficult to operationalize.
  *   **Leaf G: Right-Reasons View.**
      *   *Awkward Commitment:* Risks licensing dogmatism, as anyone convinced of their own correctness can dismiss disagreement as peer error.
  *   **Leaf H: Domain-Specific Steadfastness.**
      *   *Awkward Commitment:* Implies that rational resolution of disagreement is possible in science but inherently blocked in religion or ethics.
  *   **Leaf I: Dogmatic Steadfastness.**
      *   *Awkward Commitment:* Immune to higher-order evidence, rendering the agent unresponsive to systematic feedback about their own reliability.

  ***

  ### Indistinguishable Leaves & Further Questions

  **The Blur: Moderate Conciliationism (Leaf D) vs. Total-Evidence View (Leaf F)**
  This tree cannot cleanly separate these two positions because they often converge on the same practical output (a significant but non-agnostic reduction in confidence). Both views agree that first-order evidence matters and that peer disagreement matters; they disagree on the *mechanism* (defeater vs. counter-evidence).

  **Prising Them Apart:**
  To distinguish them, you must ask a question about the *source* of the revision, not the *degree*:
  > *"If you discovered the peer's belief was caused by a subtle cognitive bias you do not share, but you cannot identify the specific error in their argument, does their belief still lower your justification?"*

  *   **Total-Evidence:** Yes, because the bias is evidence they are likely wrong.
  *   **Moderate Conciliation:** Maybe not, if the first-order arguments still look sound to you (depending on the specific hybrid).
  *   *Better Discriminator:* **"Does the peer's disagreement *neutralize* your first-order evidence (making you rely solely on the fact of disagreement), or is it *added* to the scale against your first-order evidence?"** The former is Conciliationist; the latter is Total-Evidence.
