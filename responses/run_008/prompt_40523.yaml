answer: |-
  Your practice presupposes **Diagnostic Restorationism**: an intervention is therapeutic iff it treats a diagnosed pathology using standard protocols, restoring the individual to a medically defined normal, irrespective of comparative performance effects.

  This theory survives the first tension by prioritizing **indication over outcome**. The moral permission derives from the physician's intent to treat pathology, not the physiological delta. However, it falters on the second tension. If the sport itself causes the pathology (e.g., exercise-induced asthma), "restoring health" subsidizes sport-specific damage. The treated athlete may regain function exceeding that of resilient rivals who suffered no damage. Here, the diagnosis functions as a license to neutralize a disadvantage that becomes an advantage relative to the unmedicated healthy peer. The theory survives only by ignoring etiology.

  The practice is **underdetermined**. Three rival views—individual normal functioning, species-typical functioning, and mere medical authorization—typically converge on standard cases (e.g., congenital asthma). Standard doses for genuine pathologies usually align with species-typical needs, and physicians rarely authorize non-therapeutic use. However, they diverge on sport-induced conditions. A strict species-typical view might deny exemptions where treatment restores function above the species mean (or healthy peer mean). A procedural view (mere authorization) matches your current practice but offers no normative grounding.

  Adopting a **strict individual-baseline rule** would require significant changes. Currently, you assume the diagnosed state is the baseline deviation. A strict individual rule would require establishing the athlete's **pre-morbid physiological baseline** to ensure treatment restores *their* normal, not a new enhanced state. This would necessitate:

  1.  **Longitudinal Biometric Passports:** Pre-participation profiling to distinguish congenital conditions from sport-induced damage.
  2.  **Etology-Based Denials:** Potential rejection of TUEs for conditions caused by non-compliant training practices or where restoration exceeds the function of healthy peers.
  3.  **Dose Individualization:** Moving beyond "standard therapeutic doses" to doses calibrated strictly to the individual's pre-morbid data, preventing overshoot.

  Without these, your practice remains a pragmatic compromise that prioritizes medical autonomy over strict physiological equality, masking enhancement as restoration.
