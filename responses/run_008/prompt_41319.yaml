answer: |-
  Here is a precise account that refines your intuitions into a coherent framework, applies it to your cases (including the undecided one), predicts new ones, and identifies where your verdicts must be corrected to maintain conceptual integrity.

  ### The Account: Structural Dependency and Agential Fragmentation

  To save most of your verdicts while retaining Marxist rigor, we must move away from the strict Labor Theory of Value (which requires a wage contract) and toward a **Relational Power** account.

  **1. Exploitation = Value Extraction via Asymmetric Exit Costs**
  Exploitation occurs when Agent A captures value produced by Agent B, sustained not merely by the exchange itself, but by a structural asymmetry in **exit costs** (vulnerability).
  *   **Criterion:** Does B have a realistic, low-cost option to withdraw their labor or take their value elsewhere?
  *   **Why this fits:** It captures the seamstress (high cost of leaving) and the open-source maintainer (high cost of forking/maintaining alone vs. corporate capture) without requiring a formal wage. It excludes the professor (tenure = low exit cost) and the illustrator (market demand = low exit cost).

  **2. Alienation = Agential Fragmentation**
  Alienation occurs when the worker is severed from the **unity of agency** over their labor. This is not just repetitiveness; it is the fragmentation of *purpose* (why am I doing this?), *process* (how do I do this?), and *product* (who owns/uses this?).
  *   **Criterion:** Does the worker retain meaningful authority over the intention, execution, and social destination of the work?
  *   **Why this fits:** It captures the seamstress (no control) and the coop worker (control over management, but not the technical division of labor). It excludes the illustrator (full unity).

  ---

  ### Application to Your Cases

  1.  **Fast-Fashion Seamstress:** **Exploited & Alienated.**
      *   *Exploitation:* High exit costs (need wage for survival); value extracted by brand.
      *   *Alienation:* Fragmented agency (no control over design, pace, or product destination).
  2.  **Freelance Illustrator:** **Neither.**
      *   *Exploitation:* Symmetric exchange; low exit costs (can find other clients).
      *   *Alienation:* High agency over purpose, process, and product.
  3.  **Tenured Professor:** **Not Exploited (but Systemically Free-Ridden).**
      *   *Exploitation:* Low exit costs (tenure + prestige). She *chooses* the lower wage. The institution benefits, but does not *coerce* the surplus via vulnerability.
      *   *Alienation:* High agency over research/teaching.
  4.  **Worker-Coop Assembly:** **Not Exploited, But Alienated.**
      *   *Exploitation:* No value extraction by external capital; surplus is shared. Exit costs are shared among owners.
      *   *Alienation:* **Agential Fragmentation remains.** Even if they vote on the boss, the *task* is Taylorist. They control the *firm*, but not the *motion*. The technical division of labor fragments their agency.
  5.  **Open-Source Maintainer:** **(See Overturn Below).**
  6.  **Craftsperson on Platform:** **Exploited & Alienated.**
      *   *Exploitation:* She owns the tools, but the platform owns the **market access**. Her exit cost is high (leaving the platform means losing customers). The platform extracts rent via algorithmic control.
      *   *Alienation:* The algorithm dictates visibility and ranking (process) and often pricing (purpose). She is disconnected from the social valuation of her work, which is mediated by a "black box."

  ---

  ### Predictions for New Cases

  **1. The "Gig" Driver (e.g., Uber)**
  *   **Verdict:** **Exploited and Alienated.**
  *   **Reasoning:** Though they own the car (means of production), they do not own the *dispatch mechanism*. Exit costs are high (no alternative market access). The algorithm dictates the route and price (fragmented agency). This fits your "asymmetric vulnerability" principle perfectly.

  **2. The Adjunct Professor**
  *   **Verdict:** **Exploited and Alienated.**
  *   **Reasoning:** Unlike the tenured professor, the adjunct has high exit costs (precarious contract, need the job for career continuity) and low agency (cannot set curriculum, no research time). This highlights why your unease about the tenured professor was distinct: tenure changes the power relation.

  ---

  ### The Necessary Overturn

  To make this account philosophically defensible, I must overturn one of your verdicts.

  **Overturn: The Open-Source Maintainer**
  *   **Your Verdict:** Exploited.
  *   **My Verdict:** **Not Exploited (but Expropriated).**
  *   **Why:** Under the **Asymmetric Exit Cost** definition, exploitation requires a *compulsory* relation where the worker is vulnerable to the loss of livelihood or essential resources if they withdraw labor.
      *   The maintainer works *unpaid* and *freely*. He can stop coding tomorrow with no material penalty. He is not vulnerable to the corporation; the corporation is vulnerable to *him* (security risks, maintenance burden).
      *   What is happening is **Expropriation of the Commons**. The corporation is privatizing the gains of public labor, which is unjust, but it is not *exploitation* of the worker because the worker is not being coerced by economic necessity.
      *   **Why this matters:** If we call this exploitation, the concept loses its bite. Exploitation must describe a power relation that *forces* the transfer of value. Calling voluntary gift-giving "exploitation" conflates bad corporate citizenship with structural coercion.

  ### Summary of Changes
  *   **Saved:** Seamstress, Illustrator, Professor, Coop, Craftsperson (Resolved as Exploited/Alienated).
  *   **Overturned:** Open-Source Maintainer (Reclassified as Expropriation, not Exploitation).
  *   **Refined:** Your principle of "Asymmetric Vulnerability" is excellent, but it must require **material dependency** to count as exploitation. The maintainer lacks dependency; the seamstress and gig worker have it.

  This account preserves your core insight—that power and control matter more than wages and ownership—while sharpening the definition of exploitation so it doesn't apply to every instance of unfair value capture.
