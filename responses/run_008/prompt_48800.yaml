answer: |-
  **The Scenario**
  Art and Bo share a driveway and a snowblower. Art starts the machine at 6 AM to clear the snow but stops halfway to take a phone call, leaving the engine idling in the middle of the path (Omission 1: failing to finish the job). Bo comes out at 6:15, sees the idling machine and Art on the phone, reasonably infers that Art is managing the task and merely pausing, so Bo leaves for work without shoveling the remainder (Omission 2: failing to intervene). By noon, the snow has packed, and the driveway remains impassable. Art's initial action of starting the machine establishes his primacy, and his decision to pause actively signals to Bo that intervention is unnecessary, thereby preempting Bo's potential contribution without Bo's omission being a mere redundant absence.

  **Analysis**
  **Counterfactual Test:** If Art had not omitted (had finished the job), the driveway would be clear. If Bo had not omitted (had shoveled the rest), the driveway would also be clear. Superficially, this looks like overdetermination: both omissions are sufficient for the outcome, and neither appears strictly necessary given the other's availability. However, the preemption structure emerges when we hold fixed the *context* Art created. If Art had finished, Bo's omission would not have occurred (Bo wouldn't have needed to act). If Bo had acted, it would have been *despite* Art's signal, not because of the situation itself.

  **The Contrastive Move:** To isolate Art as the cause, we contrast his actual omission (stopping while the engine runs) with the alternative of *continuing*. This contrast changes the context for Bo. For Bo, we contrast his omission (leaving) with the alternative of *shoveling despite the signal*. Because Bo's alternative action was ruled out by reasonable reliance on Art's signal, Bo's omission is not a cause relative to the normative context. Art's omission is the cause because it altered the situation such that Bo's causal potential was neutralized. The outcome depends on Art's omission *rather than* his completion, whereas Bo's omission is dependent on Art's.

  **Swapping the Order:** If Bo arrives first and sees no machine running, Bo's omission (not shoveling) cannot preempt Art. Art arrives, sees no machine, and must decide whether to start. If Art omits, Art is the cause. There is no symmetry. In the original case, Art's *action* (starting the engine) earned the priority that allowed his subsequent omission to preempt Bo's. If Bo goes first, he lacks that signal-generating action, so his omission remains a simple failure, not a preemptor. This asymmetry confirms preemption rather than overdetermination.

  **The Skeptic's Reply:** A skeptic who denies that absences are causes will argue that Art didn't *cause* the blocked driveway; the snow did. Art merely failed to prevent it. They will claim that treating Art's pause as a "signal" smuggles in positive events (the idling engine, the phone call) to do the causal work, while the omission itself remains inert. They will insist that Bo's failure is equally an absence, and multiplying absences doesn't create causation.

  **Evaluation:** This case troubles the skeptic more than the "12 bystanders" overdetermination case. In the bystander case, the skeptic can dismiss all absences as a uniform "nothing happened." Here, the skeptic must explain why Art's *idling engine* (a positive event) combined with his *failure to finish* creates a normative trap for Bo that distinguishes Art from Bo. The skeptic is forced to admit that omissions can have *active* properties (signaling, misleading) that positive causation theories struggle to map without admitting that the absence itself carries causal weight. It forces the debate from "can nothing cause something?" to "can some nothings cause more than other nothings?", which is a harder position to maintain without conceding the point.
