      *   *Deny:* "No upper limit." This is huge. Retributivism is arguably *the* theory of limits (lex talionis, proportionality). "No room for mercy." Mercy is supererogatory, not unjust.
      *   *Key Insight:* Retributivism is often a *limiting* principle, not just a driving one. It says "no more than X," not necessarily "exactly X."

  4.  **Evaluate Consequentialism (The Nuance):**
