          *   *The Real Conflict:* It's not Retributivism vs. Consequentialism. It's likely *Retributivism vs. Retributivism* (proportionality vs. statutory duty) or *Law vs. Conscience*. Or perhaps *Negative Retributivism* (don't punish innocent/disproportionate) vs. *Positive Retributivism* (must punish guilty).
