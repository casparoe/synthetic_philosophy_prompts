answer: |-
  You have hit on the single most persistent and damaging objection to supervaluationism, often called the "problem of the boundary of admissibility." Your intuition that the supervaluationist's "admissible precisifications" might just be an epistemicist's "sharp boundary" in disguise is shared by many professional metaphysicians.

  However, to see where the views actually come apart, we need to look past the formal machinery and focus on **what kind of fact** each view thinks is doing the work.

  Here is the conceptual breakdown of where they agree, where they diverge, and why supervaluationists believe they escape the "costume" objection.

  ### 1. The Location of the Sharpness
  The fundamental disagreement is not about whether *something* is sharp; it is about **where** the sharpness resides and **what it is about**.

  *   **The Epistemicist** claims the sharpness is in the **extension of the predicate**. There is a specific number of hairs, $k$, such that a person with $k$ hairs is bald and a person with $k-1$ is not. This is a fact about the property *baldness* itself. The meaning of the word is fixed, and the world is such that the property cuts reality at a specific joint.
  *   **The Supervaluationist** claims the sharpness (if it exists at all) is in the **space of interpretations**. They argue that the meaning of "bald" is *underdetermined*. It doesn't pick out one specific set of people; it picks out a range of candidate sets (precisifications).

  **The Crucial Distinction:**
  When you press the supervaluationist on the boundary between "admissible" and "inadmissible" precisifications, they concede there is a constraint there. But they argue this constraint is **semantic**, not **ontological**.

  *   **Epistemicist:** "There is a fact of the matter about whether John is bald."
  *   **Supervaluationist:** "There is no fact of the matter about whether John is bald, because 'bald' doesn't mean enough to settle it."

  If the supervaluationist admits a sharp boundary between admissible and inadmissible precisifications, they are admitting a sharp boundary about *which meanings are allowed by our linguistic usage*. They are **not** admitting a sharp boundary about *where baldness stops in the world*.

  **Why this matters:**
  Imagine a legal contract that uses the word "reasonable."
  *   **Epistemicism:** There is a specific dollar amount that is the cutoff for "reasonable," written into the fabric of legal reality, but the judge can't find it.
  *   **Supervaluationism:** The contract allows for a range of interpretations. Any interpretation within that range is valid. There is no single dollar amount that *the contract* dictates, even if there is a sharp line between "interpretations consistent with the contract" and "interpretations that violate it."

  The supervaluationist argues that having a sharp line on *valid interpretations* does not entail a sharp line on *the world*.

  ### 2. Higher-Order Vagueness (HOV): The "Fuzzy Set" Move
  This is where your worry about the "costume" is strongest. If the set of admissible precisifications is a crisp set (sharp boundary), then haven't we just moved the vagueness up a level without solving it?

  Supervaluationists have a specific maneuver here that epistemicists reject.

  **The Epistemicist on HOV:**
  They bite the bullet. There is a sharp line between "Definitely Bald" and "Not Definitely Bald." We can't know it, but it exists. If you iterate this, there is a sharp line for every order of vagueness. Reality is infinitely precise; our knowledge is just limited.

  **The Supervaluationist on HOV:**
  They try to model the intuition that the boundary itself is fuzzy. They do this by making the **set of admissible precisifications itself vague**.
  *   **Level 1:** We have a set of precisifications. Some are clearly admissible, some are clearly inadmissible, and some are borderline admissible.
  *   **Level 2:** To handle the borderline admissible ones, we introduce a "super-precisification" which selects among the borderline admissible sets.

  **The Gain:**
  This allows the supervaluationist to say: "It is not just that we don't know where the boundary is; it is that **there is no fact of the matter about where the boundary of admissibility is either.**"

  *   **Epistemicist:** "There is a sharp boundary of admissibility, we just don't know it."
  *   **Supervaluationist:** "The collection of admissible meanings is itself a vague collection."

  If the supervaluationist succeeds here, they avoid the "costume" charge. The epistemicist says the meta-boundary is sharp (but unknown). The supervaluationist says the meta-boundary is *indeterminate*. This preserves the core intuition of vagueness (lack of factuality) all the way up the hierarchy, whereas the epistemicist forces factuality at every level.

  ### 3. The Tolerance Premise and the Sorites
  This is the most concrete place to see the difference in action. Consider the Sorites premise:
  > "For any $n$, if a person with $n$ hairs is bald, then a person with $n+1$ hairs is bald."

  **How the Epistemicist kills it:**
  They say this premise is **False**. Why? Because there is a specific $n$ (the cutoff) where the antecedent is True and the consequent is False. The conditional fails at exactly one point.
  *   *Commitment:* There is a specific hair that makes the difference.

  **How the Supervaluationist kills it:**
  They also say the premise is **False** (it is not supertrue). Why? Because for the premise to be supertrue, it must be true on *all* admissible precisifications. But on *every* admissible precisification, there is *some* cutoff. Since different precisifications have different cutoffs, there is no single $n$ where the conditional holds across the board?
  *   *Correction:* Actually, on any *single* precisification, the conditional fails at that precisification's cutoff. Since every precisification has a cutoff, the universal generalization is false on every precisification. Therefore, it is superfalse.

  **The Difference in "Flavor":**
  *   **Epistemicist:** "The premise is false because there is **one specific hair** that breaks it."
  *   **Supervaluationist:** "The premise is false because **any specific way of making the word precise** requires a break somewhere, but **no specific hair** is the break across all ways of making it precise."

  The supervaluationist captures the feeling that *no single hair matters* without committing to the claim that *some single hair matters*. They can say: "For any hair you pick, there is an admissible precisification where adding that hair doesn't change the truth value." The epistemicist cannot say this; for the epistemicist, there is one hair where adding it *always* changes the truth value, regardless of our perspective.

  ### 4. Denying Existence vs. Refusing to Assert
  You mentioned a distinction in the neighborhood of "denying that a sharp boundary exists" versus "refusing to assert that one exists." This is the heart of the matter.

  *   **Epistemicism** asserts: $\exists n (B(n) \land \neg B(n+1))$. (There is a cutoff).
      *   They add: We cannot know $n$.
  *   **Supervaluationism** asserts: $\neg \exists n (\text{SuperTrue}(B(n) \land \neg B(n+1)))$. (There is no cutoff that is true across all meanings).
      *   Crucially, they can also assert: "It is indeterminate whether there is a cutoff."

  **The "Gain" of Supervaluationism:**
  The gain is the ability to make the sentence **"There is no sharp boundary"** come out **True**.
  *   For the Epistemicist, the sentence "There is no sharp boundary" is **False**. (Because there is one, we just can't find it).
  *   For the Supervaluationist, the sentence "There is no sharp boundary" can be **SuperTrue**. (Because no specific $n$ serves as a boundary across all admissible precisifications).

  If your intuition is that "It is simply not the case that reality is sharp here," supervaluationism validates that intuition as a true statement. Epistemicism tells you that your intuition is false; reality *is* sharp, you are just ignorant.

  ### 5. Where They Secretly Agree (and why you feel stuck)
  You feel stuck because at the level of **classical logic**, they often produce the same results. Both views typically want to preserve the Law of Excluded Middle ($P \lor \neg P$).
  *   **Epistemicist:** $P \lor \neg P$ is true because one of them is the fact.
  *   **Supervaluationist:** $P \lor \neg P$ is supertrue because on every precisification, either $P$ is true or $\neg P$ is true (even if different precisifications pick different sides).

  This is why the "admissibility boundary" feels like an epistemic boundary. Both views end up positing a structure that validates classical logic.
  *   The Epistemicist posits **Sharp Facts + Ignorance**.
  *   The Supervaluationist posits **Sharp Constraints on Meaning + Indeterminacy**.

  The "costume" objection works if you think "Sharp Constraints on Meaning" *entail* "Sharp Facts." The supervaluationist's last line of defense is to insist that **semantic constraints are not worldly facts.** They are rules of the game, not moves in the game.

  ### Summary: The One Distinction to Hold Onto
  If you take away one thing, let it be this:

  **Epistemicism locates the precision in the WORLD (the extension).**
  **Supervaluationism locates the precision in the LANGUAGE (the interpretation).**

  When you push on Higher-Order Vagueness:
  *   The **Epistemicist** says the boundary of the boundary is also in the world (and sharp).
  *   The **Supervaluationist** says the boundary of the boundary is in the language (and can be vague/fuzzy).

  The "gain" is that Supervaluationism allows you to truthfully say, "There is no fact of the matter," whereas Epistemicism forces you to say, "There is a fact of the matter, but it is hidden." If your primary philosophical urge is to respect the intuition that vagueness is a feature of reality/meaning and not just our ignorance, Supervaluationism is the only view that lets you keep that sentence true. If your primary urge is to keep logic classical without "truth gaps," Epistemicism is the cleaner route, but it costs you the "no fact of the matter" intuition.

  Your feeling that the admissibility boundary looks like an epistemic cliff is the price Supervaluationism pays to keep "There is no fact of the matter" true. They accept a sharp(ish) meta-semantic boundary to avoid a sharp object-level boundary. Whether that is a "costume" or a genuine distinction depends on whether you think semantic rules are the kind of thing that can be vague without being unknowable facts. Supervaluationists say yes; Epistemicists say no.
