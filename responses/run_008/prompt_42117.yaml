  Despite the colleague's clean history ("never gossiped maliciously in her life"), the fact that she has **scheduled** a vicious email makes her, in your friend's eyes, functionally identical to the flatmate who leaves the kitchen mess. She is currently in a state of violating the norm she is enforcing, even if the physical act (the email sending) is pending. The decision has been made; the moral alignment is broken.

  ### The Two Competing Rules
  Your friend's past rulings are consistent enough to support two different philosophical principles. Both explain every past case perfectly, but they diverge on this new one.

  **Rule 1: The "Current Alignment" Principle (State of Mind)**
  *   **The Rule:** You lose standing if you are *currently committed* to violating the norm you are criticizing. This includes ongoing habits, active excuses, or **firm intentions/plans** to break the rule. Past violations do not count if you have stopped.
  *   **Logic:** Hypocrisy is about the current relationship between your values and your actions. If you currently intend to do the bad thing, you are a hypocrite.
  *   **Fits Past Cases:**
      *   *Flatmate/Mate/Speeder:* All currently committed to the bad behavior. (No Standing).
      *   *Dad/Cousin:* Both currently committed to *not* doing the behavior (even if they did it before). (Standing).
  *   **Prediction for Colleague:** **No Standing.** She has scheduled the email; her current commitment is to gossip.

  **Rule 2: The "Consummated Act" Principle (Track Record)**
  *   **The Rule:** You lose standing only if you have **physically completed** the transgression recently. Planning or intending doesn't count until the deed is done. Past transgressions are forgiven once the action stops.
  *   **Logic:** Hypocrisy requires actual double standards in practice, not just in thought. Until the email sends, she is technically innocent of the charge she is leveling.
  *   **Fits Past Cases:**
      *   *Flatmate/Mate/Speeder:* All had recently completed the bad act (mess left, smoking done, speed recorded). (No Standing).
      *   *Dad/Cousin:* Their bad acts were in the distant past. (Standing).
  *   **Prediction for Colleague:** **Has Standing.** The email has not sent. Her track record is currently pristine.

  ### Why Rule 1 is Likely the Real Rule
  Your friend's ruling on the **Flatmate** is the tell. The flatmate "leaves exactly the kitchen mess she nags me about." This implies a *state of being* (the mess exists because of her) rather than just the moment of making it. Similarly, the **Speeding Friend** claims an exception ("I'm a better driver"), which is a *mindset* of hypocrisy, not just the act of speeding.

  Your friend seems to judge **active alignment with the norm**. A scheduled email is an active alignment *against* the norm. Therefore, she will likely treat the scheduled email the same as the kitchen mess: a current violation that strips you of the right to judge.

  ### The Separator Case
  To definitively prove which rule your friend is using, you would need to present her with a case where **Intent** and **Action** are split in time.

  **The Case:**
  > "Imagine a guy who sped to work **yesterday** but has sold his car today and taken a vow never to drive again. He sees someone speeding and calls them out.
  >
  > Now imagine a guy who has never sped in his life, but has **planned a route** to speed on tomorrow morning and has set his cruise control to do it. He sees someone speeding today and calls them out."

  *   **If she follows Rule 1 (Current Alignment):**
      *   Yesterday's Speeder: **Has Standing** (He is currently aligned with the rule).
      *   Tomorrow's Speeder: **No Standing** (He is currently aligned against the rule).
  *   **If she follows Rule 2 (Consummated Act):**
      *   Yesterday's Speeder: **No Standing** (He recently committed the act).
      *   Tomorrow's Speeder: **Has Standing** (He has not yet committed the act).

  If she says the "Tomorrow's Speeder" has no standing, she is running the **Current Alignment** rule, and her verdict on the gossiping colleague is definitely **No Standing**.
