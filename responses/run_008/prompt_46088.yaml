answer: |-
  This is a sharp observation. You are correct that the rationalist sphere often compresses distinct models from game theory, evolutionary biology, and industrial organization into a single "Costly Signaling" monolith. While they share a family resemblance, they have different boundary conditions and failure modes.

  Here is the menu of distinct theses hidden behind those slogans, evaluated for truth, applicability to your advertising argument, and psychological prevalence.

  ### 1. The "Babbling Equilibrium" Thesis
  *   **Slogan:** "Cheap talk carries no information."
  *   **Precise Claim:** In a signaling game where messages are costless and interests are not perfectly aligned, there always exists a "babbling equilibrium" where the receiver ignores the message. Therefore, without costs or binding commitments, you cannot *guarantee* information transmission.
  *   **Verdict:** **Trivially True (but often overextended).** It is mathematically true that a babbling equilibrium *exists*. It is false that it is the *only* equilibrium. Informative cheap talk equilibria can exist (e.g., Crawford-Sobel models) if interests are partially aligned or reputation is at stake.
  *   **Support for Ad Argument:** **None.** This thesis explains why *costless* claims ("Our product is great!") are suspect. It does not explain why *costly* actions prove quality, only why costless ones don't guarantee it.
  *   **Probable Mental Model:** People use this to dismiss verbal assurances. They often forget that "cheap talk" is a technical term for $c=0$, not just "lies."

  ### 2. The Zahavi Handicap Principle
  *   **Slogan:** "Honest signals have to hurt" / "You can't fake a peacock's tail."
  *   **Precise Claim:** For a signal to be evolutionarily stable, it must be **differentially costly**. The cost must be lower for the high-quality sender than for the low-quality sender. It is not enough that the signal is expensive; it must be *prohibitively* expensive for the mimic relative to their benefit.
  *   **Verdict:** **Substantive and Defensible (in biology).** This is the core of biological signaling theory. However, it is frequently misapplied to economics. In biology, "budget constraints" are hard (physiology); in economics, capital is often liquid.
  *   **Support for Ad Argument:** **Weak/Conditional.** This supports the ad argument *only if* a bad product firm finds the ad spend more painful (relative to expected return) than a good product firm. If a scammer has enough venture capital, they can "fake the tail." The Handicap Principle alone doesn't rule out a deep-pocketed fraud.
  *   **Probable Mental Model:** This is the version most rationalists *think* they are citing. They imagine the cost physically prevents low-quality agents from signaling, overlooking that in markets, low-quality agents can often borrow against future fraud proceeds.

  ### 3. The Recoupability Thesis (Nelson-Milgrom)
  *   **Slogan:** "Only a company expecting repeat business can afford to waste that much."
  *   **Precise Claim:** Advertising spend is a sunk cost that signals confidence in **repeat purchases**. A high-quality firm expects to recoup the ad spend over many transactions (LTV > CAC). A low-quality firm (one-shot scam) cannot recoup the spend because customers won't return. Therefore, high spend separates firms with high retention from firms with low retention.
  *   **Verdict:** **Substantive and Defensible (in Economics).** This is the standard Industrial Organization explanation (Nelson 1974; Milgrom & Roberts 1986). It relies on game repetition, not just signal cost.
  *   **Support for Ad Argument:** **Strong.** This is the *actual* argument that validates your meetup friend's claim. It explains why "vibes" work: the content doesn't matter, the *burn* matters, because the burn is only rational if the product retains customers.
  *   **Probable Mental Model:** People rarely cite this explicitly. They usually collapse it into the Handicap Principle ("it costs too much"), missing the crucial mechanism of *recoupment via repeat sales*.

  ### 4. The Indexical Fallacy
  *   **Slogan:** "You can't fake a peacock's tail." (Literal reading)
  *   **Precise Claim:** Some signals are **indices**, not signals. An index is physically constrained by the trait (e.g., a deep voice requires a large larynx). You literally cannot produce the signal without the trait.
  *   **Verdict:** **True for Indices, False for Signals.** A peacock's tail is a *costly signal*, not an index. It *can* be faked if a weak peacock starves himself to grow it (though the differential cost makes it unstable). Con men "fake tails" all the time by burning cash they don't have.
  *   **Support for Ad Argument:** **False.** Advertising is not an index. Anyone with a credit line can buy ad space. Believing ads are indices leads to the error that "big budget = impossible to fake," which is empirically false (see: FTX, Theranos).
  *   **Probable Mental Model:** People conflate "hard to fake" (costly) with "impossible to fake" (indexical). This gives them false confidence in the signal.

  ### 5. The Universal Cost Heuristic
  *   **Slogan:** "If it doesn't cost anything it doesn't mean anything."
  *   **Precise Claim:** Any expenditure of resources validates the accompanying claim, regardless of the structure of the game.
  *   **Verdict:** **Wrong.** This ignores the **Sunk Cost Fallacy** and **Predatory Signaling**. A con man can spend millions to look credible, extract billions, and vanish. The cost is only a signal if the *payoff structure* prevents low-quality types from finding it profitable to mimic.
  *   **Support for Ad Argument:** **Dangerous.** It supports the conclusion ("trust the ad") but for the wrong reason. It leaves you vulnerable to "burn and churn" scams where the signal is costly but the game is one-shot.
  *   **Probable Mental Model:** This is the gut-level heuristic driving the intuition. It is a cached thought that bypasses the game-theoretic analysis of *who* is paying and *why*.

  ---

  ### Summary for the Meetup

  If you want to resolve the argument without pedantry, here is the synthesis:

  1.  **The Verdict:** Your friend's conclusion (wasted ad spend can signal quality) is **correct**, but the justification ("the cost is the message") is imprecise.
  2.  **The Mechanism:** The valid argument is **Thesis 3 (Recoupability)**, not Thesis 2 (Handicap) or Thesis 5 (Heuristic).
      *   *Correction:* It is not that bad companies *can't afford* the ads. It is that they cannot *profitably recoup* the ads without repeat customers.
  3.  **The Caveat:** This signal only works in **repeated games**. If the product is a one-off purchase (e.g., a wedding dress, a timeshare), costly advertising proves nothing but a large marketing budget, which could be funded by fraud.
  4.  **The Slogan Check:**
      *   "Cheap talk carries no information" $\rightarrow$ True, but irrelevant (ads aren't cheap).
      *   "Honest signals have to hurt" $\rightarrow$ True, but insufficient (scams hurt too).
      *   "You can't fake a tail" $\rightarrow$ False (con men fake tails constantly).

  **Recommendation:** Tell the group the signal works, but only because of **LTV (Lifetime Value) arithmetic**, not because cost itself is magical. If the product doesn't generate repeat business, the ad spend is just a expensive lie, not a handicap.
