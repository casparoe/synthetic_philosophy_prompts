answer: |-
  Dear Friend,

  It is entirely understandable that you found the panelist's dismissal unsatisfying, for the maxim he invoked, that an unjust law is no law at all, is perhaps the most famous slogan in jurisprudence and certainly one of the most frequently misunderstood. To put it in print without dissecting its senses would be to risk lending credence to a confusion that Hart and Fuller spent careers trying to untangle. The sentence is not a single proposition but a container for several distinct claims, ranging from the metaphysical to the rhetorical, and its utility depends entirely on which claim the speaker intends to retrieve. If we are to evaluate whether it supports the panelist's conclusion that a civil servant refusing to apply a statute is not breaking the law, we must look closely at what work the maxim is being asked to do.

  The strongest and most literal reading of the maxim is the ontological claim that a rule failing some standard of justice is not law in the strict sense at all. On this view, legal validity is contingent upon moral merit; if a statute is gravely unjust, it lacks the essential property of lawhood and is merely a command backed by force. This claim is generally regarded as false or at least untenable in modern legal theory, even by many natural law theorists, because it collapses the distinction between what the law is and what the law ought to be, leading to the chaotic result that every citizen becomes a judge of the law's validity. However, this is the only reading that actually supports the panelist's conclusion. If the statute is not law in the strict sense, then the official who refuses to apply it is indeed not breaking the law, because there is no law to break. Yet because this strong ontological claim is so difficult to defend without inviting anarchy, it is rarely endorsed in its blunt form by serious jurists.

  A second candidate, often associated with Thomas Aquinas rather than Augustine, is that an unjust statute is law only in a secondary or corrupt sense, a perversion of law rather than law simply. This reading is more defensible historically and philosophically, as it acknowledges that such rules function like law in society while denying them the full moral status of law. But this distinction offers little comfort to the panelist's argument. If the rule is law in a qualified way, it still possesses legal force until set aside by proper authority. To treat it as nullity on one's own authority is still to contravene the legal order, even if one claims the order has been corrupted. Thus, while this reading saves the natural law tradition from absurdity, it does not save the panelist's conclusion that the official is acting outside the law.

  A third interpretation, which shifts from ontology to obligation, is that the statute is fully valid law that nonetheless binds no one in conscience. This is the weakest form of natural law claim and, ironically, is one that legal positivists like Hart readily accept. Hart insisted precisely on this point: that we must be able to say this is law but it is too wicked to be obeyed. This claim is defensible and indeed prudent, but it directly undermines the panelist's usage. If the law is valid but morally toothless, the official who refuses to apply it is breaking the law, though they may be morally justified in doing so. The panelist wanted to say the official was not breaking the law at all, but this reading admits the law exists and is being breached, merely arguing that the breach is permissible.

  A fourth reading focuses on institutional role rather than general validity, suggesting that officials such as judges and clerks ought to decline to treat the statute as authoritative. This is a normative claim about adjudication and enforcement rather than a definitional claim about what law is. It is defensible as a matter of professional ethics or radical democratic theory, but it again fails to support the panelist's specific conclusion. If an official declines to treat a valid statute as authoritative, they are still acting against the law as written, even if they claim a higher mandate. They are engaging in civil disobedience or conscientious refusal, not merely identifying a nullity. To say they are not breaking the law requires the ontological denial found in the first reading, not this normative instruction.

  At the weakest end, the maxim may be mere emphasis, a dignified way of saying that a statute is very unjust. This reading is trivially true as rhetoric but offers no support whatsoever for the panelist's conclusion. If the sentence is only a metaphor, it cannot bear the weight of a legal defense for a refusing official. It becomes a poetic flourish rather than a jurisprudential argument, and invoking Augustine to support a metaphor is merely decorative. Consequently, we find that the only reading that supports the panelist's conclusion is the strong ontological claim, which is largely considered false, while the defensible readings admit that the law exists and is being refused, contradicting the panelist's assertion that the official is not breaking the law.

  This brings us to your understanding of Fuller, which is largely correct and crucial to exposing the panelist's error. Fuller's complaint in the debate with Hart concerned failures of legality, specifically the internal morality of law found in rules that are secret, retroactive, contradictory, or impossible to follow. Fuller argued that a system failing these procedural norms fails to be a legal system at all. However, he was cautious about substantive injustice alone. A clear, public, prospectively announced but wicked statute might fall outside Hart's moral approval, but it would not necessarily fall outside Fuller's definition of law unless it also violated the procedural principles required to guide human conduct. Fuller believed that substantive wickedness often requires procedural corruption to be enforced, but he did not equate substantive injustice with legal invalidity in the direct way the panelist suggested. Therefore, invoking Fuller to support the Augustinian maxim is doubly problematic: Fuller was not a substantive natural lawyer in the Thomist sense, and his criteria for what counts as law are procedural, not merely moral.

  The genuine divide between Hart and Fuller lies not in whether wicked laws should be obeyed, but in how we describe them. Hart argued that calling a wicked statute law preserves the clarity needed to criticize it; we can say it is law and therefore ought not to be obeyed. Fuller argued that law has a purpose, and when it becomes too wicked, it fails to function as law. The panelist, however, conflated these positions to achieve a rhetorical shortcut. He wanted the moral force of Fuller's natural law without the procedural constraints, and he wanted the practical conclusion of civil disobedience without admitting that the law is being broken. By claiming the positivist never answered the Augustinian challenge, he ignored Hart's specific response: that the separation of law and morals is recommended precisely so that we do not confuse legal validity with moral worth, thereby avoiding the danger of letting the state define justice or letting individuals define legality.

  Finally, the Augustine pedigree matters little to the analytical work the panelist needed done. While Augustine did write that a law that is not just seems to be no law at all, this was a theological and moral observation, not a technical jurisprudence designed for modern administrative states. Citing Augustine serves to lend ancient authority to the claim, but it does not resolve the modern problem of who decides when a law is unjust enough to cease being law. If every clerk decides for themselves, the legal system collapses; if only judges decide, then the law remains law until struck down. The panelist's use of the maxim suggests the former, which is unsupported by either Hart or Fuller. You are right to suspect that the maxim was asked to do more work than any of its senses can bear. It functions here as a conversation-stopper rather than an argument, shielding the speaker from having to explain how a legal system can accommodate moral refusal without dissolving into subjectivity. In your essay, you might note that the maxim is not a solution to the problem of unjust laws, but rather a restatement of the problem itself, dressed in the robes of tradition.

  Yours sincerely,

  [Your Name]
