  Dear Colleague,

  I have spent the last week turning over the files you sent, tracing the lines of our past four decisions to see if they form a pattern or merely a scatter plot. It is understandable that you feel the committee is speaking in different tongues, because our record thus far contains a tension that we have not yet been forced to resolve. On the one hand, we have removed names when the honorand was directly implicated in systemic harm, as with the Collier family's convict-lease profits and Dean Averill's segregationist enforcement. On the other hand, we have retained visual artifacts that depict that same harm, provided we contextualize them, as with the WPA mural and the Confederate window. The distinction seems to be between honorific naming, which implies ongoing institutional veneration, and historical artifacts, which imply documentation. If we hold to that distinction, the vote on Meridian Hall is straightforward, yet the scholarship endowment introduces a variable we have never faced: the possibility of retrospective redemption.

  To be consistent with the committee's own record regarding naming, you should vote to rename Meridian Hall. The closest analog is the Dean Averill Medal. In that case, we removed an honorific because the individual used their administrative power to enforce segregation, regardless of their other contributions to the university. Governor Calloway's political enforcement of segregation mirrors Averill's administrative enforcement. While the Collier case also involved money, it was tainted money that built the campus, whereas Calloway's money is reparative. However, the Collier precedent established that financial utility does not protect a name from moral scrutiny. If the utility of the Collier endowment could not save the residential college name, the utility of the Calloway scholarship should not save the lecture hall name. The committee has consistently treated building and award names as honors that require moral clearance, distinct from the historical preservation of art. Therefore, removing the name maintains the principle that the university does not permanently honor those who actively fought against the enrollment of the very students who now benefit from their charity.

  However, I must be frank that the record genuinely underdetermines this case because the scholarship element is novel. Our previous cases involved either pure harm or tainted benefit. Calloway presents a mix of harm and benefit that forces us to choose a new principle. If you vote to rename, you commit the committee to the principle that honorifics reflect the whole moral ledger of a life, and that later beneficence cannot cleanse earlier systemic oppression. This aligns with a German-style reckoning where the integrity of the public honor is paramount. If you vote to keep the name, you commit the committee to the principle of utilitarian redemption, where the net positive outcome of a donor's legacy can outweigh their moral failings. This leans toward a Lost Cause remembering in reverse, where we keep the honors but rewrite the story to emphasize the good, potentially muting the severity of the segregationist history. Neither principle is currently codified in our precedents, so your vote will not just follow a rule but write one.

  Since you have the opportunity to propose next semester's docket, I suggest we bring forward a case that tests the boundary between our art preservation policy and our naming policy to reveal which rule we are actually running. We should consider a freestanding Confederate monument in the university quad. We have kept wall-mounted art like murals and windows with interpretive panels, following a Japanese-style quietism. A statue, however, is often treated differently in memory politics because it is three-dimensional and occupies public space as an honorific rather than merely decorating a building. If the committee votes to keep the statue with a panel, we confirm we are practicing Japanese-style quietism for all non-naming heritage. If we vote to remove it, we confirm we are practicing German-style reckoning for all honorific objects, regardless of whether they are buildings or art. This case would force the senior members to clarify whether our retention of the mural and window was due to their medium or due to a broader reluctance to remove Confederate symbols, finally telling us which style of memory politics governs this university.
