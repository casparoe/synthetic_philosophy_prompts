prompt: |-
  I teach modern European history at a big public high school, and every unit ends with a "why did X happen" essay where I get ninety-odd answers arguing things like "the printing press caused the Reformation" or "the Depression caused the rise of the Nazis." When I grade these I find myself making the same calls over and over by gut: is a trigger a cause? Does it count if the student names something that was necessary but obviously not enough on its own (Luther without printing, printing without Luther)? What about kids who argue some version of "someone else would've done it anyway" -- which I think is the overdetermination thing from philosophy of causation, or maybe it's the preempting thing, honestly I get those confused. I've read a bit about this stuff (INUS conditions, but-for tests, necessary vs sufficient) but never enough to turn it into anything I actually use on a Sunday night with a stack of essays.

  What I want is a grading procedure I can run on a single causal claim in about three minutes, on paper, no philosophy training required -- me and the other teacher on the course both have to be able to apply it the same way, since we split the sections and the students compare grades. So it has to say: what questions to ask about a claim in order, what counts as an adequate answer at each step, at what point a claim gets full credit even if it's framed in naive language ("Princip shot the archduke so the war started" -- a 16-year-old isn't going to say 'but-for condition'), and where the procedure has to give up and just flag it as my judgment call, because I suspect a lot of causal-historiography grading is values dressed up as rubric. It should also tell me what to do with the "it would've happened anyway" move, both when the student uses it to knock down someone else's cause and when they use it to excuse one (the south would've seceded eventually, so was Lincoln's election really the cause?).

  Then run it on three real claims from last year's stack: "the assassination of Franz Ferdinand caused WWI," "the invention of the printing press caused the Reformation," and "the humiliation at Versailles caused WWII." Include at least one case where the procedure gives full or near-full credit to an answer I instinctively want to mark down (I'm pretty sure Princip as cause is one of these), and one where it marks down an answer I like -- and be honest about where the three-minute limit makes the procedure dumber than the philosophy it's based on.
reasoning: |-
  Here's a thinking process that leads to the suggested grading procedure:

  1.  **Analyze the Request:**
      *   **User:** High school Modern European History teacher.
      *   **Problem:** Grading 90+ "Why did X happen?" essays. Struggles with consistency on causal claims (trigger vs. cause, necessary vs. sufficient, overdetermination/preemption).
      *   **Goal:** A 3-minute grading procedure for a single causal claim. Needs to be usable by two teachers without philosophy training. Needs to handle naive language ("Princip caused WWI"). Needs to address the "it would've happened anyway" argument.
      *   **Requirements:**
          *   Step-by-step questions.
          *   Criteria for adequate answers at each step.
          *   Clear point where judgment call takes over.
          *   Test run on three specific claims: Princip/WWI, Printing Press/Reformation, Versailles/WWII.
          *   Must include a case where the procedure contradicts the teacher's instinct (giving credit where they want to deduct, or vice versa).
          *   Honest admission of limitations (where the 3-minute limit makes it "dumber" than the philosophy).

  2.  **Deconstruct Causal Theory for High School History:**
      *   *Philosophy:* INUS conditions (Insufficient but Necessary part of an Unnecessary but Sufficient condition), But-For test, Overdetermination, Preemption.
      *   *History Pedagogy:* Long-term vs. Short-term causes, Structural vs. Agency, Necessary vs. Sufficient, Catalyst/Trigger.
      *   *Constraint:* 3 minutes per essay claim. No jargon.
      *   *Solution:* A simplified "Causal Chain Checklist." It needs to move from "Did it happen?" to "Did it matter?" to "Was it the whole story?"

  3.  **Drafting the Procedure (The "3-Minute Causal Audit"):**
      *   *Step 1: The But-For Test (Necessity).* If this didn't happen, would the outcome still happen *at that time/in that way*?
      *   *Step 2: The Mechanism (Connection).* Did the student explain *how* A led to B? (Not just correlation).
      *   *Step 3: The Context (Sufficiency/INUS).* Did the student acknowledge other factors? (Avoiding monocausality).
      *   *Handling "It would've happened anyway":* This is the counterfactual. If they argue this, they are arguing against Necessity.
      *   *Scoring:* Simple rubric (0-3 scale per step?). Let's keep it binary/pass-fail per step for speed, with a holistic override.
      *   *Refinement:* Let's make it a flow chart style decision tree.
      *   *Key Distinction:* Trigger vs. Cause. A trigger *is* a cause, just a proximate one. The procedure needs to validate triggers *if* linked to underlying conditions.

  4.  **Developing the "It Would've Happened Anyway" Rule:**
      *   This is the trickiest part.
      *   *Scenario A:* Student says "Lincoln's election caused secession." Counter: "South would've seceded anyway."
      *   *Grading Rule:* If the student acknowledges the underlying tension but argues the specific event *timed* or *shaped* the outcome, credit. If they treat the event as the *only* possible spark without acknowledging the tinder, deduct.
      *   *Simplification:* "The Tinder Test." Is there dry wood (structural causes)? If yes, the spark (agency) counts. If no wood, no fire.

  5.  **Running the Test Cases:**

      *   *Case 1: "The assassination of Franz Ferdinand caused WWI."*
          *   *Instinct:* Teacher wants to mark down (too simple/trigger).
          *   *Procedure:* Does it pass But-For? Yes (no war *then*). Mechanism? Alliances activated. Context? Needs to mention alliances/imperialism.
          *   *Outcome:* If student implies the alliances existed, procedure gives credit. This challenges the teacher's instinct that "trigger ≠ cause."

      *   *Case 2: "The invention of the printing press caused the Reformation."*
          *   *Instinct:* Teacher likes this (structural).
          *   *Procedure:* But-For? Maybe (ideas spread slower). Mechanism? Yes (dissemination). Context? Needs Luther/Corruption.
          *   *Outcome:* If student ignores Luther, procedure marks down (monocausal). This challenges the teacher's instinct that structural factors are inherently "deeper."

      *   *Case 3: "The humiliation at Versailles caused WWII."*
          *   *Instinct:* Teacher likes this (classic narrative).
          *   *Procedure:* But-For? Debatable (Hitler might have risen anyway). Mechanism? Resentment -> Voting. Context? Depression/Weakness of League.
          *   *Outcome:* Procedure might flag this as "Incomplete" if Depression isn't mentioned, forcing nuance.

  6.  **Refining the Procedure for Speed & Consistency:**
      *   Need a physical checklist.
      *   Need a specific way to handle the "Two Teachers" consistency issue.
      *   Need to define the "Judgment Call Zone."

  7.  **Addressing the Specific Constraints:**
      *   *3 Minutes:* Keep steps minimal.
      *   *No Philosophy:* Translate INUS to "Spark vs. Tinder."
      *   *Contradiction:* Ensure one case shows the procedure is more forgiving of "trigger" history than the teacher, and one is stricter on "structural" history.
      *   *Honesty:* Acknowledge that history isn't logic puzzles.

  8.  **Final Polish of the Procedure (The "Tinder & Spark" Protocol):**
      *   *Step 1: The Counterfactual (But-For).* Without X, does Y happen *when/how* it did?
      *   *Step 2: The Mechanism.* How did X physically/politically lead to Y?
      *   *Step 3: The Ecosystem (INUS).* Did X work alone or with other factors?
      *   *The "Happened Anyway" Clause:* Distinguish between "Inevitable eventually" vs. "Inevitable then."

  9.  **Writing the Response:**
      *   Intro: Acknowledge the pain point.
      *   The Protocol: Clear steps.
      *   The "Happened Anyway" Rule.
      *   The Test Runs (Princip, Press, Versailles).
      *   The Limitations (Where it fails).

      *(Self-Correction during drafting)*: Make sure I explicitly address the "Princip" case where the teacher wants to mark down but the procedure says pass. This is crucial for the prompt's requirement. The procedure must validate *proximate* causes if the *structural* causes are implied or present in the unit context. Actually, better: The procedure should demand the student acknowledge the *alliances* to get full credit on Princip. If they *only* say "Princip shot Archduke = War," that fails Step 3. If they say "Princip shot Archduke, triggering alliances," that passes. I need to make sure the "Instinct vs. Procedure" conflict is clear.
      *   *Idea:* Teacher instinct: "Princip is just a trigger, not a real cause." Procedure: "If it satisfies But-For and Mechanism, it's a cause."
      *   *Idea:* Teacher instinct: "Versailles is a good deep cause." Procedure: "Without the Depression, Versailles doesn't kill the Weimar Republic." (Strictness on structural).

      *Let's finalize the "Princip" conflict.* Teacher says: "Don't give full credit for just the assassination." Procedure says: "If they explain the alliance system activation, give full credit." This aligns.
      *Wait, I need a case where the procedure gives credit when the teacher wants to deduct.*
      *   *Scenario:* Student writes: "Princip caused the war." (Period).
      *   *Teacher:* Fails (too simple).
      *   *Procedure:* Fails Step 3 (No ecosystem).
      *   *Okay, let's flip it.* Student writes: "Princip caused the war because it triggered the alliance system."
      *   *Teacher:* "I still feel like that's shallow. I want them to talk about Imperialism."
      *   *Procedure:* Passes. (This is the conflict).
      *   *Okay, let's look at Versailles.* Student: "Versailles caused WWII."
      *   *Teacher:* "Yes, good structural cause."
      *   *Procedure:* "Wait, did they mention the Great Depression? Without the Depression, does Hitler win? If not mentioned, deduct." (This is the conflict: Procedure is stricter on structural claims).

      *Let's refine the "Happened Anyway" rule.*
      *   If student says "X caused Y," and grader thinks "Y was inevitable."
      *   Rule: Grade the *timing* and *form*. X caused Y *in 1914*. X caused Y *as a World War*.

      *Okay, ready to write.*

  10. **Final Review against constraints:**
      *   3 minutes? Yes, checklist is short.
      *   Two teachers? Yes, objective criteria.
      *   Naive language? Yes, translated.
      *   "Happened Anyway"? Addressed specifically.
      *   Test runs included? Yes.
      *   Contradictions highlighted? Yes.
      *   Limitations admitted? Yes.

      *(Self-Correction on "Princip"):* The prompt asks for "at least one case where the procedure gives full or near-full credit to an answer I instinctively want to mark down."
      *   *Teacher Instinct:* "Princip is just a spark, not the fire." (Wants to mark down).
      *   *Procedure:* "If the student explains the spark lit the fire (alliances), it is a valid cause." (Gives credit).
      *   *Perfect.*

      *(Self-Correction on "Versailles"):* "One where it marks down an answer I like."
      *   *Teacher Instinct:* "Versailles is a profound, deep cause." (Wants to give credit).
      *   *Procedure:* "Versailles alone is insufficient without the Depression (INUS condition). If student doesn't mention the economic context, it's monocausal." (Marks down).
      *   *Perfect.*

      *Let's build the "Tinder & Spark" Rubric.*

      *(Wait, one more check on the "Happened Anyway" logic).*
      *   If a student argues "Lincoln's election didn't cause secession because the South would have seceded anyway."
      *   Procedure: Does this deny the *timing*? If they argue secession was inevitable *eventually*, but Lincoln made it happen *in 1861*, they still get credit for Lincoln as a causal factor for the *war's timing*.
      *   Okay, I will codify this as the "Specifics Clause."

      *Ready.*
answer: |-
  Here is a grading procedure designed for speed, consistency, and historical nuance without requiring a degree in philosophy. It translates concepts like INUS conditions and counterfactuals into a "Tinder and Spark" framework.

  ### The "Tinder & Spark" Protocol (3-Minute Audit)

  **Goal:** Determine if a student's causal claim is *historically valid*, not if it is the *only* truth.
  **Time:** 3 minutes per essay/claim.
  **Tools:** A highlighter and this checklist.

  #### Step 1: The "But-For" Check (Necessity/Timing)
  **Question:** Does the student argue that without this specific factor, the event would not have happened *at that time* or *in that way*?
  *   **Pass:** The student implies or states that this factor changed the timeline or the specific nature of the outcome. (e.g., "Without the assassination, the war might not have started *in 1914*.")
  *   **Fail:** The student treats the factor as magic, ignoring that the outcome might have been inevitable regardless.
  *   **Naive Language Translation:** "X made Y happen" counts as Pass *unless* the rest of the essay proves the student thinks Y was impossible without X.

  #### Step 2: The Mechanism Check (Connection)
  **Question:** Did the student explain *how* the cause led to the effect?
  *   **Pass:** There is a verb of action connecting them (mobilized, radicalized, bankrupted, triggered).
  *   **Fail:** The claim is a bare assertion ("X caused Y") with no bridge.

  #### Step 3: The Ecosystem Check (Sufficiency/INUS)
  **Question:** Does the student acknowledge that this cause needed help? (The "Tinder" Test)
  *   **Pass:** The student identifies the "Spark" (agency/event) *and* implies or states the "Tinder" (structural conditions), OR identifies the "Tinder" and acknowledges it needed a "Spark."
  *   **Fail:** Monocausality. The student argues this *one* thing was enough on its own to guarantee the outcome.

  ---

  ### Handling the "It Would've Happened Anyway" Argument

  Students often use this to dismiss a cause (e.g., "Lincoln didn't cause secession; the South was always going to leave").

  **The Rule of Specificity:**
  1.  **If the student argues inevitability to dismiss a trigger:** They must explain *why* the trigger mattered for the **timing** or **scale**.
      *   *Credit:* "The South would have seceded eventually, but Lincoln's election made it happen *immediately*."
      *   *No Credit:* "The South would have seceded anyway, so Lincoln doesn't matter." (This denies historical agency).
  2.  **If the student argues inevitability to defend a structural cause:** They must acknowledge the **contingency**.
      *   *Credit:* "War was likely due to alliances, but the Assassination determined *who* fought *when*."
      *   *No Credit:* "War was inevitable, so the Assassination is the only cause we need to study."

  **Grader Instruction:** If a student makes the "Happened Anyway" move, check if they preserve the *significance* of the event regarding timing or form. If they erase the event's significance entirely, mark down Step 1.

  ---

  ### The Judgment Call Zone (Stop the Clock)
  If you hit this, stop the 3-minute timer. Discuss with your co-teacher.
  *   **The "Values" Trap:** The claim is historically accurate, but you dislike the moral implication (e.g., "German humiliation caused WWII" feels like excusing Hitler). *Protocol:* Grade the history, not the morality. If the causal link is supported, give credit.
  *   **The "Deep Time" Conflict:** One teacher values long-term structural causes (Marxist/Annales) and the other values agency (Great Man/Political). *Protocol:* Step 3 (Ecosystem) resolves this. If they acknowledge the other side exists, both interpretations pass.

  ---

  ### Test Run: Three Claims from Last Year

  Here is how the protocol applies to your specific examples, including where it will fight your instincts.

  #### Case 1: "The assassination of Franz Ferdinand caused WWI."
  *   **Student Essay Gist:** Princip shot the Archduke. Austria blamed Serbia. Alliances kicked in. War started.
  *   **Teacher Instinct:** "This is shallow. It's just a trigger. I want them to talk about Imperialism and Militarism. I want to mark this down to a B."
  *   **Protocol Application:**
      *   *Step 1 (But-For):* **Pass.** (No war *in August 1914* without the shot).
      *   *Step 2 (Mechanism):* **Pass.** (Shot -> Blame -> Alliances -> War).
      *   *Step 3 (Ecosystem):* **Pass.** (Student mentions "Alliances kicked in." This acknowledges the structural tinder).
  *   **Result:** **Full Credit.**
  *   **Why this hurts:** You feel "Trigger" isn't "Cause." The protocol insists that a trigger *is* a cause if it activates the structure. Unless the student claims the war would *never* have happened without Princip (denying structural tension), they pass. This forces you to accept proximate causes as valid history.

  #### Case 2: "The invention of the printing press caused the Reformation."
  *   **Student Essay Gist:** Gutenberg invented the press. Luther's 95 Theses were printed. Everyone read them. The Church couldn't stop the ideas. Reformation happened.
  *   **Teacher Instinct:** "I like this. It's a deep, technological shift. It feels more 'real' than the Princip essay. I want to give this an A."
  *   **Protocol Application:**
      *   *Step 1 (But-For):* **Pass.** (Ideas spread too slowly otherwise).
      *   *Step 2 (Mechanism):* **Pass.** (Printing -> Dissemination -> Church inability to censor).
      *   *Step 3 (Ecosystem):* **Fail.** (Did the student mention *why* people wanted to read it? Corruption? Indulgences? Luther? If the essay implies the Press *alone* created the religious dissent without the pre-existing theological anger, it is monocausal).
  *   **Result:** **Near-Full Credit (deduct for Step 3).**
  *   **Why this hurts:** You prefer structural causes. The protocol flags this as "Technological Determinism." A printing press in a vacuum prints nonsense. It needed the "Tinder" of religious corruption. If the student ignores the corruption, the protocol forces you to mark it down, even if you love the "tech changes history" narrative.

  #### Case 3: "The humiliation at Versailles caused WWII."
  *   **Student Essay Gist:** The Treaty was too harsh. Germany was humiliated and broke. Hitler promised to fix it. Germans voted for him. War started.
  *   **Teacher Instinct:** "This is the classic narrative. It's solid. I want to give this an A."
  *   **Protocol Application:**
      *   *Step 1 (But-For):* **Pass.** (Without Versailles, no Nazi platform).
      *   *Step 2 (Mechanism):* **Pass.** (Humiliation -> Resentment -> Voting).
      *   *Step 3 (Ecosystem):* **Fail/Borderline.** (Here is the rub. Versailles existed since 1919. WWII started in 1939. What changed in the middle? If the student does not mention the **Great Depression**, they fail the Ecosystem check. Versailles was the Tinder, but the Depression was the Wind. Without the Depression, Weimar might have survived the humiliation).
  *   **Result:** **Marked Down (Missing the Depression).**
  *   **Why this hurts:** You like the Versailles narrative. The protocol demands the *conjuncture*. Versailles + Depression = War. Versailles alone = Grumbling. The procedure forces you to penalize the "Versailles alone" argument even if it's a standard high school history trope.

  ---

  ### Where the Procedure is "Dumber" Than the Philosophy

  You asked for honesty about the limitations. Here is where the 3-minute limit makes this tool blunt:

  1.  **It Flattens "Overdetermination":** In philosophy, if two sufficient causes exist (e.g., Assassin A and Assassin B both shoot at the same time), the "But-For" test breaks. In history, this is rare, but the protocol can't handle it. If a student argues "War was overdetermined by alliances *and* imperialism," the protocol might flag it as "Vague" in Step 2 because the mechanism is muddy. You will have to use a Judgment Call to reward sophisticated uncertainty.
  2.  **It Punishes "Deep Structure":** The protocol favors mechanisms that can be traced in 3 minutes. Long-term, slow-burn causes (like "the rise of individualism") often fail Step 2 (Mechanism) because the link is abstract. A student writing about "centuries of religious skepticism" might get marked down against a student writing about "Luther posted a letter," simply because the latter is easier to audit quickly.
  3.  **The "Happened Anyway" Nuance:** The protocol treats "Timing" as the saving grace for inevitability arguments. But sometimes the *fact* of the event matters more than the *time*. (e.g., "The Holocaust was inevitable under Nazism" vs. "It happened in 1942"). The protocol isn't smart enough to grade the moral weight of inevitability arguments; it only checks if the student acknowledged the timing.

  ### Implementation for Two Teachers

  To ensure you and your co-teacher grade the same way:
  1.  **Calibration Hour:** Before grading, take 5 essays you *both* graded last year. Run them through this protocol. If you disagree on a Step 3 (Ecosystem) pass/fail, write down the rule you agreed on (e.g., "Mentioning 'alliances' counts as Tinder for WWI").
  2.  **The "Highlight" Rule:** To pass Step 3, the student must **highlight or underline** the secondary factor (the Tinder or the Spark they aren't focusing on). If it's not on the page, it doesn't exist. This removes the "I implied it" argument from students and the "I think they know it" bias from teachers.

  This system won't make you a philosopher, but it will stop you from arguing with yourself about whether a spark is a fire.
