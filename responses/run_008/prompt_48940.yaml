  **CIVSWAP PLATFORM USER AGREEMENT**

  **1. Acceptance of Terms**
  By accessing the CivSwap platform ("Services"), you acknowledge that civic participation is an underutilized asset class. Continued use of the Services constitutes consent to the monetization of your civic rights, biological assets, and emergency consumption needs. CivSwap is committed to democratizing value previously locked up in non-transferable regulatory frameworks.

  **2. Definition of Civic Assets**
  Users grant CivSwap a non-exclusive license to list, market, and facilitate the transfer of one (1) Vote per election cycle. Users warrant that they hold clear title to their Vote, free of liens or moral encumbrances. CivSwap treats Votes as fungible units of political influence. While traditional theory suggests Votes possess inalienable expressive value, Users agree that for the purposes of this transaction, a Vote is functionally equivalent to a commodity futures contract.

  **3. Dynamic Pricing & Emergency Protocols**
  To ensure efficient allocation of resources, CivSwap utilizes algorithmic surge pricing. During declared states of emergency (including but not limited to hurricanes, pandemics, or supply chain disruptions), the price of essential goods (water, generators, shelter) and Votes may fluctuate based on real-time demand. Users acknowledge that higher prices during disasters incentivize supply retention and reflect the true scarcity value of survival assets. CivSwap bears no liability for price spikes coinciding with meteorological events.

  **4. Voluntariness & Financial Hardship**
  Users certify that any sale of Assets is voluntary. CivSwap acknowledges that Sellers may experience financial distress, liquidity shortages, or coercive economic pressure. However, the Platform defines "coercion" strictly as physical force. Economic necessity is categorized as a "market incentive." By listing an Asset, Seller confirms that the opportunity to monetize desperation constitutes an expansion of autonomy, not a reduction of options. CivSwap is not responsible for the structural conditions that make selling necessary, only for facilitating the transaction frictionlessly.

  **5. Semantic Integrity Disclaimer**
  Users acknowledge that market transactions may alter the social meaning of the traded good. Specifically, a Vote sold via CivSwap may carry different expressive weight than a Vote retained by the citizen. Users agree that CivSwap is not liable for any degradation of civic culture, erosion of democratic norms, or corruption of the public sphere resulting from this semantic shift. If the existence of a market in Votes causes non-selling citizens to view voting as less meaningful, this is considered an externalities cost borne by the community, not a product defect.

  **6. Biological Matching Tier**
  In the Organ Vertical, Users may list renewable and non-renewable biological assets. Matches are prioritized by ability to pay rather than medical urgency to ensure platform sustainability. Users waive rights to claim that bodily integrity is distinct from property rights. In the event of organ rejection or civic disqualification, liability is limited to the transaction fee.

  **7. Dispute Resolution & Remorse**
  All disputes shall be resolved through binding mandatory arbitration. Buyer's remorse regarding the ethical implications of purchasing a Vote is not grounds for refund. If a Seller experiences dignity harm post-transaction, this shall be treated as a quality assurance issue rather than a violation of rights. Users waive the right to class-action lawsuits regarding the commodification of citizenship.

  **8. Civic Literacy Initiative (ESG)**
  CivSwap donates 0.5% of transaction fees from kidney matches to elementary civics education programs. This partnership ensures future generations understand the market mechanisms governing their rights. This donation is contingent on quarterly liquidity events and may be paused during fiscal downturns.

  **9. Guardian-Enabled Liquidity (Future Rights)**
  To maximize intergenerational efficiency, Guardians may list the future Voting Rights of dependents (minors or unborn children) as pre-IPO assets. Guardians warrant that they act in the financial best interest of the dependent, recognizing that early liquidation of civic rights provides immediate household stability. Dependents inherit the financial proceeds but not the associated voting capacity. This clause extends logically from the principle that assets should be tradable at the point of maximum utility.

  **10. Modifications to Agreement**
  CivSwap reserves the right to modify these Terms at any time. Continued participation in the democracy following changes constitutes acceptance. If you do not agree to the new terms, your only remedy is to exit the jurisdiction.

  **Contact:**
  For inquiries regarding ethical overrides, please email: *liability@civswap.io*
