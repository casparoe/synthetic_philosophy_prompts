answer: |-
  I reject step (4), because the inference that all thresholds on continuous variables are morally arbitrary commits the Sorites fallacy by confusing metaphysical precision with normative justification.

  The move from (3) to (4) assumes that because a trait like cognition varies continuously, any line drawn to separate "moral status" from "no moral status" must be groundless. This is false; we draw non-arbitrary lines on continua constantly based on functional significance rather than metaphysical sharpness. For example, the transition from liquid to gas is continuous at the molecular level, yet we non-arbitrarily designate a boiling point for practical purposes, and legally we set age thresholds for voting or driving despite maturity being a gradient. A threshold is non-arbitrary if there is a morally relevant reason to pick that zone, such as the capacity to suffer or to plan for the future, even if the exact boundary involves some vagueness. By rejecting (4), you block the slide to (6) and (8), allowing you to maintain binary moral status based on capacities without resorting to speciesism or nihilism.

  The cost of this rejection is that you must accept vagueness into the foundation of your ethics. You cannot point to an exact micro-second or neural configuration where moral status begins, which means borderline cases (like late-term fetuses or severely cognitively impaired humans) will remain genuinely difficult to adjudicate rather than having a hidden, precise answer. You trade the comfort of metaphysical certainty for a pragmatic justification that requires defending a specific functional threshold against marginal cases, acknowledging that while the line is justified, it is not perfectly sharp.
