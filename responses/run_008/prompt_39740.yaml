      *   **Goal:** Create a standing decision procedure for handling these complaints.
      *   **Theoretical Grounding:** Epistemic Injustice (Fricker), specifically *Testimonial Injustice* (credibility deficit due to prejudice) and *Hermeneutical Injustice* (gap in shared interpretive concepts).
      *   **Constraints:**
          *   Usable by a single editor in < 30 minutes.
          *   Materials available: Manuscript, Reviews, Author Rebuttal.
          *   Must specify questions, sufficient answers, failure points, remediation points (redo/replace), and *explicitly flagged hand-off points* for human judgment.
          *   Must address: Double-blind leaks (cues in text) and the "Hard Case" (unfamiliarity vs. actual weakness).
          *   Must run the procedure on three specific cases (Non-native English/qualitative, National tradition concepts, Famous institution/harsh critique).
          *   One outcome must be unpopular/uncomfortable.
          *   Must conclude with limitations (where the procedure misfires).

  2.  **Deconstruct the Theory (Epistemic Injustice):**
      *   *Testimonial Injustice:* The reviewer gives less credibility to the claim because of who the author is (identity prejudice). In peer review, this looks like dismissing evidence without engagement, attributing errors to incompetence rather than honest mistake, or using coded language about "rigor" that maps onto identity markers.
      *   *Hermeneutical Injustice:* The reviewer lacks the concepts to understand the author's framework. This looks like labeling concepts "incoherent" or "undefined" when they are defined within a specific tradition the reviewer doesn't know.
      *   *Constraint:* The editor cannot interview the reviewer. They only have text. They must look for *traces* of injustice in the review text relative to the manuscript.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Time Limit:* Needs to be streamlined. No long checklists.
      *   *Structure:* Sequential filtering. If a step fails, stop and decide.
