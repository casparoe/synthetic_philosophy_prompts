answer: |-
  # Editorial Protocol: Assessment of Alleged Epistemic Injustice in Peer Review

  **Purpose:** To provide a consistent, time-bound method for evaluating author complaints regarding reviewer bias, grounded in the framework of epistemic injustice (testimonial and hermeneutical).
  **Time Limit:** 30 Minutes.
  **Materials:** Manuscript, Reviewer Report(s), Author Rebuttal/Complaint.
  **Operator:** Single Handling Editor.

  ---

  ## The Procedure

  ### Step 1: Triage and Specificity (5 Minutes)
  **Question:** Does the author's complaint identify specific passages in the review that allege bias, or is it a general expression of dissatisfaction?
  *   **Sufficient Answer:** The author quotes specific lines (e.g., "Reviewer calls my method 'anecdotal' without engaging the coding scheme") and links them to an identity marker or tradition (e.g., "This dismisses qualitative work common in my region").
  *   **Failure Condition:** If the complaint is general (e.g., "The reviewer was mean" or "They didn't like my paper"), the complaint fails. **Original Decision Stands.**
  *   **Pass Condition:** Specific textual evidence is provided. Proceed to Step 2.

  ### Step 2: Testimonial Injustice Scan (7 Minutes)
  **Question:** Does the review assign a credibility deficit to the author that is not supported by the evidence in the manuscript?
  *   **Search For:** Language that attributes error to *incompetence* rather than *mistake*; dismissal of data without analysis; or tone that implies the author is not a "serious" researcher.
  *   **Sufficient Answer:** The review contains assertions of fact about the author's capability (e.g., "The authors clearly do not understand the literature") that are contradicted by the bibliography or text.
  *   **Failure Condition:** The criticism addresses the *work* (e.g., "Sample size is too small for the claim") rather than the *worker*. **Original Decision Stands.**
  *   **Pass Condition:** Evidence of credibility deficit found. Proceed to Step 3.
  *   **[HUMAN JUDGMENT REQUIRED]:** *Distinguishing between harsh rigor and ad hominem implication.* There is no algorithm for tone. You must decide if the skepticism is proportional to the error. If you are unsure, flag for **Reviewer Replacement**.

  ### Step 3: Hermeneutical Injustice Scan (7 Minutes)
  **Question:** Does the reviewer reject a concept or method because it is unfamiliar, without attempting to interpret it within its stated tradition?
  *   **Search For:** Labels like "incoherent," "undefined," or "non-standard" applied to terms that *are* defined in the manuscript or cited literature from that tradition.
  *   **Sufficient Answer:** The reviewer states they cannot understand a concept and recommends rejection on that basis, rather than requesting clarification or acknowledging the tradition.
  *   **Failure Condition:** The reviewer notes the concept is unfamiliar but engages with it on its own terms, or the manuscript genuinely fails to define its terms. **Original Decision Stands.**
  *   **Pass Condition:** The reviewer treats unfamiliarity as fatal flaw. Proceed to Step 4.
  *   **Remediation:** If this is the *only* issue, the review should be **Redone** by the same reviewer (with editor instruction to engage the tradition) or **Replaced** if the reviewer indicates inability to learn the framework.

  ### Step 4: The Double-Blind Leak Check (5 Minutes)
  **Question:** Does the review demonstrate knowledge of the author's identity that should have been masked, and is that knowledge used negatively?
  *   **Search For:** References to specific self-citations ("The authors cite themselves too much"), local context ("This approach is common in [Country] but..."), or prose style ("The English is...").
  *   **Sufficient Answer:** The reviewer uses identity cues to lower the threshold for acceptance (e.g., "Given the institution, the data is surprisingly good") or raises it (e.g., "This school of thought is known for laxity").
  *   **Failure Condition:** No identity cues are referenced, or cues are referenced neutrally. **Original Decision Stands.**
  *   **Pass Condition:** Identity cues are weaponized. **Reviewer Replacement Required.**

  ### Step 5: The "Hard Case" Separation (6 Minutes)
  **Question:** If the manuscript were written by a native speaker at a top Western institution, would the specific methodological criticisms still hold?
  *   **Search For:** The core methodological flaw cited by the reviewer. Is it objective (e.g., missing control variable, logical contradiction) or subjective (e.g., "lacks rigor," "unconvincing")?
  *   **Sufficient Answer:** The flaw is objective and actionable by any researcher.
  *   **Failure Condition:** The flaw is objective. The complaint fails. **Original Decision Stands.**
  *   **Pass Condition:** The flaw is subjective or relies on the "unfamiliarity" identified in Step 3.
  *   **[HUMAN JUDGMENT REQUIRED]:** *The Unseparable Mixture.* You must decide if the unfamiliarity is *causing* the perception of weakness, or if the weakness exists *independently* of unfamiliarity. You cannot know this with certainty.
      *   If you suspect the weakness is real but exacerbated by bias: **Redo Review** (with new reviewer expert in that tradition).
      *   If you suspect the weakness is entirely a product of bias: **Reviewer Replacement**.
      *   If you suspect the weakness is objective despite the bias: **Original Decision Stands**.

  ---

  ## Application of Procedure to Three Cases

  ### Case 1: The Non-Native Qualitative Author
  **Context:** Author from low-income country. English is visibly non-native. Reviewer dismisses qualitative interview findings in one line as "merely anecdotal." Author complains of bias against their region and method.
  **Procedure Run:**
  1.  **Triage:** Specific complaint regarding the "anecdotal" comment. (Pass)
  2.  **Testimonial Scan:** "Anecdotal" implies a lack of scientific rigor without engaging the coding method described in the manuscript. This is a credibility deficit. (Pass)
  3.  **Hermeneutical Scan:** The reviewer does not engage with the qualitative tradition cited. (Pass)
  4.  **Blind Leak:** Reviewer mentions "The English makes the coding unclear." (Pass - Leak detected).
  5.  **Hard Case Separation:** *Is the data actually anecdotal?* The manuscript uses a standard grounded theory approach, but the sample size is small (N=15). A Western author with N=15 might be criticized for generalizability, but not dismissed as "anecdotal." However, the small sample *is* a limitation.
      *   **[HUMAN JUDGMENT REQUIRED]:** The editor determines that while the sample size is a legitimate weakness, the dismissal as "anecdotal" conflates sample size with methodological validity, likely exacerbated by the language barrier.
  **Decision:** **Reviewer Replacement.** The review is contaminated by linguistic prejudice and a failure to engage the qualitative tradition.
  **Outcome:** *Editorially Favorable.*

  ### Case 2: The National Tradition Author
  **Context:** Author uses concepts from a specific national scholarly tradition (e.g., a specific school of French sociology or Japanese management theory). Reviewer labels core concepts "incoherent" and "undefined," recommending rejection.
  **Procedure Run:**
  1.  **Triage:** Specific complaint regarding "incoherent" label. (Pass)
  2.  **Testimonial Scan:** No direct attack on competence, but implies intellectual failure. (Borderline)
  3.  **Hermeneutical Scan:** The concepts *are* defined in the text, but the reviewer claims they do not map onto standard Anglophone equivalents. The reviewer does not ask for clarification; they reject. This is classic Hermeneutical Injustice. (Pass)
  4.  **Blind Leak:** None detected.
  5.  **Hard Case Separation:** *Are the concepts actually incoherent?* They are coherent within their tradition but unfamiliar to the reviewer.
      *   **[HUMAN JUDGMENT REQUIRED]:** The editor must decide if the journal's scope includes this tradition. Assuming it does, the failure is the reviewer's lack of hermeneutical resources, not the author's clarity.
  **Decision:** **Review Redone.** The same reviewer may be used *only if* the editor provides literature to bridge the hermeneutical gap. Otherwise, **Reviewer Replacement** with someone familiar with the tradition.
  **Outcome:** *Editorially Favorable.*

  ### Case 3: The Famous Institution Author
  **Context:** Well-cited author from a top US university. Reviewer critiques the paper harshly, point-by-point (methodology, stats, lit review). Author complains of "unfair treatment" and "dismissiveness," citing the same epistemic injustice language as the other authors.
  **Procedure Run:**
  1.  **Triage:** Complaint is general ("unfair treatment") but points to the harsh tone. (Pass)
  2.  **Testimonial Scan:** Reviewer critiques the *work* ("The regression model omits variable X"), not the *worker*. No credibility deficit based on identity is evident; the author has high pre-existing credibility. (Fail)
  3.  **Hermeneutical Scan:** Concepts are standard in the field. Reviewer engages with them technically. (Fail)
  4.  **Blind Leak:** None.
  5.  **Hard Case Separation:** The criticisms are specific and actionable.
      *   **[HUMAN JUDGMENT REQUIRED]:** The editor must determine if the harshness constitutes bias. Since the criticisms are technical and specific, they count as legitimate skepticism.
  **Decision:** **Original Decision Stands.** The complaint fails. The review is rigorous, not unjust.
  **Outcome:** *Editorially Uncomfortable.* (See Limitations).

  ---

  ## Limitations and Misfire Points

  As Managing Editor, you must acknowledge where this procedure will fail you. It is a tool for consistency, not a truth machine.

  **1. The "Competent Bias" Misfire**
  The procedure relies on textual evidence. A reviewer aware of bias norms may write a "clean" review that is still motivated by prejudice. They may nitpick a marginalized author's methodology with a rigor they would not apply to a star author (Case 3), but because the nitpicking is *technically valid*, Step 5 forces you to uphold the rejection.
  *   **Result:** You will occasionally reject marginalized authors for reasons that are *true* but *selectively applied*. The procedure cannot detect selective rigor.

  **2. The Editor's Own Hermeneutical Gap**
  This procedure places the final judgment in *your* hands (Step 5). If you, the editor, lack the hermeneutical resources to understand the author's tradition (e.g., you do not know qualitative methods or the specific national theory), you will default to the reviewer's interpretation.
  *   **Result:** The procedure replicates your own biases. It cannot correct for editorial epistemic injustice.

  **3. The "Hard Case" Indeterminacy**
  In Case 1, I ruled for the author. In a slightly different version of Case 1, where the methodology *was* genuinely flawed, the procedure forces you to uphold the rejection (Step 5 Failure Condition).
  *   **Result:** You will have to reject vulnerable authors knowing that a more generous reader *might* have seen potential. The procedure prioritizes methodological soundness over equity when the two are entangled. This is the "decision you will not like." You cannot save a weak manuscript without damaging the journal's epistemic integrity, but you cannot know for sure if the weakness is real or perceived.

  **4. The Double-Blind Illusion**
  Step 4 checks for leaks, but as noted, style and citation patterns leak identity constantly. If a reviewer recognizes a "local research program" (as you noted) but does not name it, Step 4 will pass.
  *   **Result:** Prejudice operating through recognized "styles" of argumentation will pass undetected.

  **Final Note:** This procedure protects the journal from *egregious* procedural injustice. It does not guarantee *substantive* equity. It makes the judgment calls explicit rather than hidden, which is the only honesty available to us.
