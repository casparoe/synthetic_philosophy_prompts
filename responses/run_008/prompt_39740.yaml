      *   *Case 2 (National Tradition):* Concepts called "incoherent." This is pure Hermeneutical Injustice.
      *   *Case 3 (Famous Institution):* Harsh critique. This tests the procedure's neutrality. If the procedure works, it should treat this the same as the others. If the critique is substantive, the complaint fails. *Constraint:* One outcome must be one the editor "will not like." I should make Case 3 result in a decision *against* the famous author (upholding the harsh review), which might be uncomfortable if the editor suspects bias but the text doesn't show it. OR, I could make Case 1 fail (upholding the review) which is ethically uncomfortable. Let's aim for Case 3 to uphold the review (showing the procedure protects rigor over prestige) OR Case 1 to uphold the review (showing the procedure admits some "anecdotal" claims are actually weak).
      *   *Decision:* Let's make Case 1 result in a *re-review* (favorable to author), Case 2 result in *re-review* (favorable), and Case 3 result in *original decision stands* (unfavorable to the complainer). This shows the procedure isn't just an "author protection" tool; it upholds rigorous reviews even against famous people. Wait, the prompt says "At least one of the three should come out with a decision I will not like." As an editor concerned about equity, I might not like upholding a review against a marginalized author. Or, I might not like rejecting a complaint from a star because it looks like I'm bowing to rigor over "bias." Let's make Case 1 (the marginalized author) result in *Original Decision Stands* because the manuscript *is* actually weak, despite the reviewer's tone. This highlights the "Hard Case" limitation. This is the most honest application of the "Hard Case" constraint.

  5.  **Refining the Procedure Steps (incorporating Epistemic Injustice):**

      *   *Step 1: Specificity.* Does the author point to specific lines?
      *   *Step 2: Testimonial Indicators.* Look for credibility deficits. Does the reviewer question competence without evidence?
      *   *Step 3: Hermeneutical Indicators.* Does the reviewer demand translation of concepts without engaging the literature provided?
