      *   *Refined View:* We should penalize **trace-output decoupling**. If the trace says X and the output relies on X, X must be true. If the trace says X and the output ignores X, X can be anything. In this new case, the output *relied* on the trace (confidence level). Therefore, it matters.

  8.  **Drafting the Response:**
      *   **Structure:**
          1.  Analyze the Precedents (Map the landscape).
          2.  Analyze the New Case (Identify the conflict).
          3.  The Ruling & Principles (Acknowledge underdetermination, define the two paths).
          4.  The Revealing Test Case (How to find the real rule later).
          5.  The Deep Question (My actual view on Trace Policing).
