      *   *Option 2 (Decide for them)* is paternalistic. Why does a US university board know better than Nigerian stakeholders about Nigerian cultural governance?
      *   *Option 1 (Transfer to legal sovereign/Oba)* is the strongest philosophically. It respects Nigerian sovereignty and legal self-determination, even if that sovereignty is currently contested internally. It treats Nigeria as a moral agent capable of resolving its own disputes.
      *   *Decision:* Recommend Option 1 (Unconditional transfer to the legally recognized custodian under Nigerian law).

  3.  **Develop the Underlying Principle:**
      *   Needs to fit "Corrective Justice."
      *   Core idea: *Restitution as Restoration of Agency.* The wrong of colonialism was not just theft of objects, but theft of political and cultural self-determination.
      *   Principle: "Sovereign Deference." When returning stolen property, the returning party must defer to the legal and political structures of the source community as they currently exist, rather than imposing conditions based on the returner's preferences for governance.
