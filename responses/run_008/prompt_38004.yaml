answer: |-
  **MEMORANDUM**

  **TO:** Provenance & Restitution Advisory Board
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Six Benin Bronzes

  **Recommendation**
  I recommend the Board adopt **Option 1**: Unconditional transfer of title and physical custody to the legally recognized custodians under current Nigerian law (currently the Federal Republic/Oba of Benin structure), without stipulations regarding internal distribution.

  **The Guiding Principle: Restorative Sovereignty**
  Our corrective justice framework typically focuses on the transaction: *Object was stolen → Object must be returned.* However, colonial looting was not merely a property crime; it was an assault on political standing. The British punitive expedition sought to dismantle the Kingdom of Benin's sovereignty. Therefore, true restitution must restore not only the property but also the *agency* of the wronged party.

  This generates a principle of **Sovereign Deference**: When the source community constitutes a recognized sovereign entity, the returning institution must defer to that entity's domestic legal and political processes regarding custody. To do otherwise—to condition return on our preference for which Nigerian institution (the Oba, the State, or the Museum) is most "appropriate"—is to replicate the colonial dynamic of guardianship. We are not equipped to adjudicate Nigerian cultural governance, and attempting to do so perpetuates the epistemic violence of the original theft.

  **Addressing the "Outsourcing" Objection**
  A legitimate concern arises: Does deferring to Nigerian law simply "outsource" the hard moral work to the claimants? There is a distinction here between *abandonment* and *recognition of standing*. Outsourcing implies we are washing our hands of responsibility. Recognition of standing implies we acknowledge that the right to determine custody belongs to the victim, not the thief. 

  If we withhold transfer because Nigerians disagree on the recipient, we effectively rule that they are not yet "ready" for self-governance—a paternalistic standard we would not apply to domestic property disputes. Corrective justice requires we restore their standing as moral agents capable of resolving their own internal conflicts. If the Oba and the Federal Commission dispute custody, that is a matter for Nigerian courts and diplomacy, not a US university board.

  **The Strongest Counter-Argument**
  The Director argues that Option 1 is itself paternalistic because it validates a specific, contested political authority (the Oba vs. the State) during a volatile transition. The concern is that by following the 2023 gazette, we intervene in a live political dispute.

  While this risk is real, the alternative is worse. Holding the objects while Nigeria sorts its politics (Option 4) or deciding for them (Option 2) maintains our control over their heritage indefinitely. We cannot wait for a "perfect" political consensus in the source country, as political contestation is permanent. The least paternalistic path is to follow the *de jure* legal framework of the sovereign nation, even if that framework is in flux. We return the object to the *state*, and let the state's internal mechanisms determine the final resting place.

  **Why Not Option 3 (Loan-Back)?**
  We must also reject the "transfer title, keep physical custody" model. As noted in our discussions, this resembles leasing back a stolen car. It secures the moral credit of restitution for us while retaining the material benefit (access, tourism, research centrality). If the goal is corrective justice, the physical displacement caused by the theft must be reversed. A loan-back privileges our visitors' access over the source community's reconnection with their heritage.

  **Implications for Future Cases**
  This principle applies to our broader collection. Where provenance indicates colonial dispossession, the burden is on us to return. Where the "successor" is contested, we defer to the current domestic law of the source nation rather than imposing our own curatorial preferences. This creates a consistent, defensible standard: we correct the injustice of taking, without compounding it with the injustice of managing the return.

  **Next Steps**
  I move we authorize the Director to initiate transfer procedures under Option 1 immediately.

  ***

  **Private Note on the "Outsourcing" Distinction (For your consideration)**
  You mentioned your view flip-flops on whether leaving the recipient question to Nigerians is coherent. Philosophically, the distinction holds up if you view *political legitimacy* as internal to a community. If you believe legitimacy comes from external validation (i.e., "they are a valid recipient only if they meet our democratic standards"), then outsourcing is incoherent—you're just ignoring the problem. But if you believe legitimacy is self-determined, then "outsourcing" is actually *respect*. The incoherence only arises if you want the moral credit of restitution without the risk of the recipient doing something you dislike. If you can accept that they might "misuse" the object (by your lights) without invalidating the return, the distinction is solid.
