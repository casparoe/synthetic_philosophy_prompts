          2.  Transfer to Benin City Museum (board decides custodian).
          3.  Transfer ownership, loan back (stay in situ).
          4.  Hold off, digitize, revisit later.
      *   **Key Philosophical Tension:** Corrective justice demands returning to the "successor," but the "successor" is contested locally. Choosing feels paternalistic; not choosing feels like outsourcing moral responsibility.
      *   **Task:** Draft a pre-vote memo.
      *   **Requirements:**
          *   (a) Recommend one concrete course of action.
          *   (b) State the underlying principle (applicable to murkier cases too).
