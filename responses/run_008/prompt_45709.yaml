          *   *Revisionist/Continuity View:* Keynes never fully accepted Ramsey's subjective turn. The *Treatise* already had room for non-numerical probabilities. The later "uncertainty" isn't a retreat but an application of the *Treatise*'s insights to economics where logical relations are too weak to calculate. Ramsey addressed consistency of belief; Keynes cared about the *warrant* for belief.
