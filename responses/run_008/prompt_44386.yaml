      *   *Wait, 12 students.* If I split them, markets are too thin (6 people).
      *   *Alternative:* Run the game *once* with Heterogeneous priors. Then, *announce* that the "House Priors" were actually a mistake and everyone shares the true prior (Common). Ask them if they would trade *now*.
      *   *Better Alternative (per prompt):* The prompt asks for two configurations. I need to make this fit.
      *   *Solution:* Simplify the trading. No bilateral negotiation. Just a "Market Price" discovery. Or, make the "Rounds" the configurations.
      *   *Refined Plan:*
