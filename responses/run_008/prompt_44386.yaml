      *   **Goal:** Design an in-class trading game using index cards, play money, whiteboard.
      *   **Key Mechanism:** Two configurations.
          1.  *Heterogeneous Priors:* Some students have "house priors" different from the rest.
          2.  *Common Prior:* Everyone shares the same prior.
      *   **Desired Outcome:** Students should *feel* the difference. In the Common Prior case, speculative trade should vanish (or be recognized as irrational). In the Heterogeneous Prior case, trade persists due to fundamental disagreement.
      *   **Deliverables:** Rules, materials, payoff scheme, sequence, debrief (mapping to formal machinery), limitations (what the game can't simulate), and troubleshooting (what goes wrong).
      *   **Tone:** American English, professional, pedagogical, candid.

  2.  **Deconstruct the Theoretical Core:**
      *   *Common Prior Assumption (CPA):* All agents start with the same probability distribution over states of the world. Differences in posterior beliefs arise *only* from differences in information partitions.
      *   *Aumann's Agreement Theorem:* If agents share a common prior and their posteriors are common knowledge, they cannot agree to disagree.
      *   *No-Trade Theorem (Milgrom-Stokey):* If agents share a common prior and are rational (expected utility maximizers), they will not engage in speculative trade (zero-sum betting) just because they have different private information. Trade only happens if there are gains from trade (e.g., hedging, liquidity needs), not just differences of opinion.
      *   *The Hook:* If trade *does* happen in a zero-sum setting with common priors, someone is making a mistake (or violating rationality). If priors differ, trade is rational because the "world" looks different to them fundamentally.

  3.  **Game Design Challenges:**
      *   *Complexity vs. Time:* 80 minutes is tight. 12 students is a good number for a market, but too many for complex bilateral negotiation. A market mechanism is needed.
      *   *Incentives:* Needs to feel real without real money. Points toward participation grade or "epistemic currency" (bragging rights).
      *   *The "Prior" Manipulation:* How to encode a prior on a card? A card usually gives *information* (signal). To encode a *prior*, the instructions on the card must tell them the base rate *before* they see the signal, or the signal interpretation must be biased.
      *   *The "Event":* Needs to be binary or simple. A coin flip? A die roll? Let's go with a bag of colored chips or a specific card draw from a deck. Let's use a hidden "State of the World" card drawn by the instructor at the very end.
