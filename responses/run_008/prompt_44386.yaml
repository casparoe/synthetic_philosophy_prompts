      *   **Debrief:** Connecting game moves to Aumann/Milgrom-Stokey.
      *   **Limitations:** What the game abstracts away.
      *   **Troubleshooting:** Predictable failures and fixes.

  10. **Refining the Payoff/Incentives:**
      *   Real money is unethical/against policy usually.
      *   "Course Credit Points" is the standard.
      *   Let's say: Top 3 portfolios get 5 bonus points on the final seminar paper (or equivalent).
      *   This makes them care but keeps it academic.

  11. **Refining the "Prior" Card:**
