      *   *Crucial Detail:* To make the No-Trade theorem pop, in Round 2, they must realize that if they know everyone is rational and shares the prior, trading is a sucker's bet. This is hard to enforce in a game.
      *   *Workaround:* In Round 2, I (the instructor) act as the "Market." I offer to buy/sell at the consensus price. If they trade with *each other*, it's speculative.
