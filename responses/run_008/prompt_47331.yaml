answer: |-
  This is a sharp diagnosis. You're right: the literature often proceeds as if the *job description* of chance is settled, when in fact the disagreement about the job description is often what drives the disagreement about the metaphysics. If you write a dissertation on this, clarifying the functional role of chance is a viable and valuable project in itself.

  Below is a specification of desiderata for a theory of objective chance. I have structured them to highlight the tensions you suspect, particularly regarding admissibility, determinism, and the normative link.

  ### Desiderata for a Theory of Objective Chance

  #### 1. The Normative Link (Non-Circular Deference)
  *   **The Case:** The primary philosophical utility of "objective chance" is to constrain rational belief. If an agent knows the chance of $p$ is $x$, their credence in $p$ should be $x$. This is the Principal Principle (PP).
  *   **The Constraint:** The theory must define **admissibility** non-circularly. You cannot define inadmissible evidence as "evidence that overrides chance." You must provide a structural or metaphysical criterion (e.g., evidence about the past vs. future, or evidence about laws vs. particular facts) that explains *why* some evidence trumps chance and some doesn't, without presupposing the PP.
  *   **Status:** **Non-Negotiable.** Without this, "chance" collapses into "unknown frequency" or loses its distinctive normative force.
  *   **Tension Flag:** This is the primary locus of the **Undermining Problem**. If chances supervene on the total history of the world (Humeanism), then facts about the future are relevant to what the current chances *are*. But if you have evidence about the future, the PP says you should defer to the *current* chance, while your evidence says the chance must be different. Reconciling Supervenience + PP + Non-Circular Admissibility is notoriously difficult.

  #### 2. The Empirical Link (Frequency Stability)
  *   **The Case:** We epistemically access chances almost exclusively through frequencies (insurance tables, coin flips, decay rates). A theory of chance cannot make it a cosmic accident that frequencies track chances in large samples.
  *   **The Constraint:** The theory must entail (or make highly probable) the **Law of Large Numbers**. It is not enough to say frequencies *might* match chances; the theory must explain why we are justified in inferring chances from frequencies.
  *   **Status:** **Non-Negotiable.** A theory of chance that allows frequencies to diverge wildly from chances without explanation is empirically idle.
  *   **Tension Flag:** **Single-Case vs. Long-Run.** Propensity theories often struggle here: if a chance is a property of a single trial, why must it manifest in a long run? Humean theories handle this well (chance *is* a summary of the run) but risk reducing chance to mere frequency, losing the single-case intuition (e.g., the chance of a unique historical event).

  #### 3. The Physics Compatibility Constraint (Determinism)
  *   **The Case:** Classical Statistical Mechanics (SM) uses probability densities that function exactly like chances (guiding credence, explaining thermodynamic behavior), yet the underlying dynamics are often deterministic. Similarly, Bohmian QM is deterministic but probabilistic in practice.
  *   **The Constraint:** The theory must account for **non-trivial probabilities in deterministic settings**. It must explain how a probability can be objectively $0 < p < 1$ even if the physical state at $t_1$ necessitates the outcome at $t_2$.
  *   **Status:** **Contested / Field-Dependent.** Traditional metaphysicians often treat this as optional (claiming SM probabilities are merely epistemic). However, for a dissertation engaging with physics, this should be treated as **Non-Negotiable**. If your theory of chance declares the probabilities in SM to be "not real," your theory is useless for philosophy of physics.
  *   **Tension Flag:** **Incompatibilism.** Traditional Propensity views define chance as a manifestation of indeterministic causal powers. They *must* fail this desideratum. Humean views pass easily (chances are just best summaries, regardless of underlying modality), but then face the challenge of Desideratum 4 (why care about the summary?).

  #### 4. The Explanatory Link (Why Deference?)
  *   **The Case:** Merely stating the Principal Principle (Desideratum 1) is not enough. We need to know *in virtue of what* chance commands rational credence. Is it because chance is a causal power? Because it is a law? Because it is a logical relation?
  *   **The Constraint:** The theory must provide a **metaphysical ground** for the Normative Link. It cannot treat the connection between chance and credence as a brute, unexplainable axiom.
  *   **Status:** **High Bar / Preference.** Many major accounts (including Lewis's) treat the PP as a platitudinous constraint rather than something derived. However, taking this seriously is the mark of a robust metaphysical account.
  *   **Tension Flag:** **The Gap.** If chance is Humean (a summary of patterns), it is unclear why it should normatively bind an agent *now*. If chance is a causal power (Propensity), the link is clearer (causes constrain expectations), but you lose Determinism Compatibility (Desideratum 3).

  #### 5. Temporal Asymmetry (The Arrow of Chance)
  *   **The Case:** Chances evolve. Before a coin toss, the chance of Heads is 0.5. After it lands, the chance is 1 or 0. Crucially, we generally do not assign non-trivial chances to *past* events (once known), but we do to *future* events.
  *   **The Constraint:** The theory must accommodate the **time-asymmetry of chance** without relying solely on the asymmetry of knowledge. Even in time-symmetric physical laws (like classical mechanics), the *chances* we assign are time-asymmetric.
  *   **Status:** **Non-Negotiable for Physics.** Any account that cannot distinguish the chance of a past event from a future event (given the same physical state) fails to capture how probability is used in thermodynamics and quantum mechanics.
  *   **Tension Flag:** **Humean Symmetry.** If chances supervene on the whole mosaic (past and future), and the laws are time-symmetric, it is difficult to explain why the "Best System" yields time-asymmetric chances without building the asymmetry in by hand.

  ---

  ### The Incompatibility Cluster

  You suspected there is a subset of requirements that cannot be jointly satisfied. You are correct. There is a trilemma involving **Humean Supervenience**, **Non-Triviality**, and **Deference**.

  1.  **Humean Supervenience:** Chances supervene on the total distribution of categorical properties across all of spacetime (the "Mosaic").
  2.  **Non-Triviality:** There are genuine chances between 0 and 1 (even in principle).
  3.  **Unrestricted Deference:** Rational agents must defer to current chances even when they have "inadmissible" evidence about the future structure of the Mosaic.

  **The Conflict:** If (1) is true, then the total future history of the world determines what the current chances are. If I have evidence about the future history (e.g., I see a prophecy, or I simply consider the logical possibility of an "undermining future" where frequencies diverge from current chances), then by (1), I have evidence about what the current chances *are*.
  *   If I update my credence about the chances based on this future evidence, I violate (3) (Deference to the *current* chance function).
  *   If I ignore the future evidence to defer to the current chance, I am ignoring evidence about what the chances *actually are* (given 1), which seems irrational.

  **Result:** You cannot have a Humean theory that satisfies Non-Circular Admissibility (Desideratum 1) and Non-Triviality (Desideratum 3) without modifying the Principal Principle (e.g., Lewis's "New Principle" or Thau's "Revised Principle"). If you insist on the original PP, Humeanism is untenable.

  ---

  ### The Knockout Requirement

  You asked which single requirement knocks out the most contenders if taken seriously.

  **Your hunch is correct: Desideratum 4 (The Explanation of Deference).**

  Here is the argument:

  1.  **Humeans (Best System):** They typically posit the Principal Principle as a constraint on what counts as a "chance." They do not explain *why* the best summary of the mosaic should guide rational belief. It is a brute normative posit. If you demand an explanation (e.g., "Show me the mechanism by which a pattern in the mosaic binds my mind"), they have nothing but pragmatism.
  2.  **Frequentists:** They reduce chance to actual frequency. They fail Desideratum 1 (Single-Case Deference) and Desideratum 3 (Determinism/SM compatibility in a robust sense).
  3.  **Propensities:** They do better here. If chance is a causal power, it makes sense that knowing the power guides expectation. *However*, they are knocked out by Desideratum 3 (Determinism/Stat Mech).
  4.  **Deterministic Compatibilists (e.g., Methodological Probabilists):** They save Stat Mech but often reduce chance to "epistemic convenience," failing the "Objective" part of Objective Chance, and thus failing to explain why *objective* deference is required rather than just subjective convenience.

  **Why Desideratum 4 is the killer:**
  Most theories treat the link between chance and credence as a **bridge principle**—a rule you add to the theory to make it work. Very few theories derive that link from the metaphysical nature of chance itself.
  *   If you demand the link be **derived** (e.g., "Credence tracks chance *because* chance is X"), you eliminate Humeanism (where chance is just a summary) and Frequentism (where chance is just a ratio).
  *   You are left mostly with causal/propensity accounts, which then immediately crash into Desideratum 3 (Stat Mech/Determinism).

  **Recommendation for your Dissertation:**
  If you want to work on Stat Mech and QM, you cannot afford to fail Desideratum 3. This means you likely have to accept a Humean or Compatibilist framework. But if you accept that, you must confront Desideratum 4.

  The most fertile ground for a dissertation here is not choosing a side, but attacking **Desideratum 4**. Can a Humean/Compatibilist theory *earn* the Principal Principle without positing it as brute? Some recent work suggests grounding chance in **typicality** or **explanatory power** rather than lawhood. If you can show that rational agents *must* defer to Humean chances because those chances are the only things that support counterfactuals or explanations, you solve the "Explanation of Deference" problem without sacrificing Stat Mech.

  That is where the gap is. The literature assumes we know what chance *does*; your project could show that what chance *does* (guides credence in deterministic physics) forces us to change what chance *is*.
