answer: |-
  There is no single, canonical term that precisely captures the *evidential asymmetry* you are describing—specifically, the move of treating inarticulacy as *positive Bayesian evidence* of hidden function in evolved institutions.

  However, you are standing on very solid ground. This insight is the convergence of three distinct intellectual traditions, each of which has a name for a piece of the puzzle, but none of which name the specific inferential rule you've isolated.

  ### The Existing Neighbors

  1.  **Causal Opacity (Cultural Evolution):**
      The anthropologist Joseph Henrich (e.g., in *The Secret of Our Success*) explicitly describes the phenomenon you note. He argues that many adaptive cultural practices are **causally opaque**: practitioners follow the rule without understanding *why* it works. Henrich argues this opacity is a feature, not a bug; it prevents individuals from using flawed individual reasoning to "optimize" away crucial steps.
      *   *Gap:* This names the *property* of the practice, not the *argumentative move* of using that property as evidence of fitness.

  2.  **Latent Function (Sociology):**
      Robert Merton distinguished between *manifest functions* (intended and recognized) and **latent functions** (unintended and unrecognized). A functionalist analysis assumes a practice persists because it serves a latent function.
      *   *Gap:* Functionalism is often criticized for assuming a function exists just because the practice persists (a tautology). Your point is more specific: that the *inability to articulate* the function is itself the signal that distinguishes a latent evolutionary adaptation from a designed rule.

  3.  **Chesterton's Fence (Conservative Heuristic):**
      As you noted, this is the popular maxim. It is normative ("Don't remove it") rather than evidential ("Silence implies function").

  ### The Coinage: **The Evolutionary Silence Inference**

  Since the specific evidential rule lacks a name, I propose calling it **The Evolutionary Silence Inference**.

  **Definition:**
  The *Evolutionary Silence Inference* is the argument that in systems formed primarily by selection pressures rather than conscious design (e.g., common law, cultural norms, biological traits), the inability of stakeholders to articulate a function for a persistent practice should update an observer's probability *upward* regarding the practice's hidden utility.

  **The Logic of the Asymmetry:**
  *   **Designed Systems:** If a rule is designed, the designer should be able to explain it. Silence suggests non-function.
  *   **Evolved Systems:** If a rule is evolved, it survives via differential retention, not explicit intent. Complex, rare, or tail-risk mitigations are often impossible to articulate because the causal chain is too complex for individual cognition. Therefore, silence is the expected signal of high-complexity utility.

  ### Where It Breaks Down (The Failure Modes)

  You asked where this survives the fact that lots of old rules are dead. The *Evolutionary Silence Inference* is vulnerable to three specific confounders. If these are present, the inference fails:

  1.  **Path Dependence (The "Zombie" Rule):**
      A practice may persist not because it is currently adaptive, but because the cost of coordination to remove it is too high. It is locked in by history, not selected for by fitness.
      *   *Test:* Can you find a similar group/environment that *lacks* the rule and performs better? (Comparative institutional analysis).

  2.  **Power Obfuscation (The "Rent-Seeking" Rule):**
      Silence may not indicate evolutionary wisdom, but strategic hiding. A rule may benefit a specific subgroup who actively suppress the explanation to prevent reform. Here, silence signals *predation*, not *function*.
      *   *Test:* Who benefits? If the benefit is concentrated and the cost diffuse, suspect power, not evolution.

  3.  **Environmental Lag (The "Maladaptive" Rule):**
      Evolutionary selection has a lag time. A rule may have been load-bearing in the past environment but is now neutral or harmful. The "silence" is just the lag before selection purges it.
      *   *Test:* Has the underlying environment (technology, demographics, resources) shifted faster than the cultural generation time?

  ### Confidence Assessment

  **Confidence in Claims:** **High (85%)**
  I am highly confident that there is no standard lexical item for this specific *evidential asymmetry*. I am also highly confident that "Causal Opacity" (Henrich) and "Latent Function" (Merton) are the correct technical ancestors for this concept. The logic you have derived is consistent with modern Cultural Evolutionary Theory.

  **Point of Least Certainty:**
  I am least certain about whether a niche term exists within **philosophy of biology** or **systems theory** (e.g., "teleological opacity" or "functional inscrutability"). There is a possibility that a specific paper in the last 20 years has named this exact Bayesian update rule, but it has not entered general discourse. If such a term exists, it would likely be found in the literature surrounding "error management theory" or "adaptive irrationality," but even there, the focus is usually on the *psychology* of the believer, not the *evidential status* of the silence itself.

  ### Summary
  You have correctly identified a gap in the standard "Chesterton's Fence" formulation. The maxim tells you *what to do* (wait), but your insight explains *why the silence is informative*. Until a standard term emerges, **The Evolutionary Silence Inference** accurately captures the move: treating inarticulacy in evolved systems as a signal of complexity rather than emptiness.
