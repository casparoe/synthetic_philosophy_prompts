      *   Be honest about tensions? Check.

  *(Self-Correction on Schlick's Suicide View)*: I need to be careful. Schlick argues that the *fear* of death makes us ask about meaning. If life is meaningful (full of play), death is irrelevant. He doesn't necessarily say suicide is compatible with meaning. Usually, suicide is seen as the ultimate negation of the "will to live" which is tied to the "play" impulse. I will frame it as: Schlick thinks a meaningful life renders death harmless; John's suicide proves his life became unendurable, thus meaningless by Schlick's standards, even if it was full of striving.

