answer: |-
  Summary
  The set is jointly tenable but precarious. It relies on a sharp distinction between humanitarian interventions (where UNSC authorization is secondary to atrocity prevention) and wars of choice (where UNSC authorization is primary). The greatest friction lies between your consequentialist bar for success (Commitment 7) and your defense of Libya (Commitment 5), alongside the tension between demanding non-selectivity (Commitment 6) while accepting interest-driven action. With careful temporal distinctions—separating *jus ad bellum* from *jus post bellum*—the framework holds, but it demands you concede that Libya, by your own consequentialist metric, cannot be defended as a net positive.

  Apparent tensions
  **Kosovo (1) vs. Iraq (2) on UNSC Authorization:** This dissolves if you distinguish *humanitarian intervention* from *war of choice*. Commitment 4 exempts humanitarian crises from strict UNSC requirements due to veto paralysis (validating Kosovo). Iraq was not a clear humanitarian catastrophe (failing Commitment 3), so it falls under standard international law where UNSC authorization is mandatory. Thus, the absence of UNSC approval is essential to condemning Iraq but not Kosovo.

  **UNSC Veto (4) vs. Iraq Case (2):** Commitment 4 argues the veto undermines the Council's moral authority, yet Commitment 2 relies on the Council's absence to condemn Iraq. This is consistent if you argue that while the Council isn't a *strict* requirement for legitimacy, its authorization provides a crucial legal safeguard against wars of choice. Iraq lacked both legitimacy (humanitarian cause) and legality (UNSC), whereas Kosovo had legitimacy but lacked legality.

  Genuine tensions, ranked
  1.  **Libya Outcome (5) vs. Consequentialist Bar (7):** Commitment 5 claims Libya was "justified at the outset," while Commitment 7 states an intervention leaving a country "worse off... is unjustified." If Libya collapsed into chaos (widely accepted), Commitment 7 renders it unjustified *all things considered*. Commitment 5's hedge ("at the outset") creates a temporal split that risks looking like special pleading.
      *   *Cost to resolve:* You must explicitly concede that while the *decision* to intervene was correct *ex ante*, the intervention *itself* fails your *ex post* justification test.

  2.  **Selectivity Principle (6) vs. Specific Cases (1 & 5):** Commitment 6 demands interventions be "non-selective in principle" to be legitimate, yet admits states act on interests. Kosovo and Libya aligned with Western interests (proximity, migration, oil). If legitimacy requires non-selectivity, but practice is inherently selective, the legitimacy of your defended cases is undermined.
      *   *Cost to resolve:* You must acknowledge these interventions were morally compromised by selectivity, reducing their normative weight as precedents.

  3.  **UNSC Authority (4) vs. Iraq Condemnation (2):** Commitment 4 dismisses the UNSC as hostage to vetoes, yet Commitment 2 treats its absence as "essential" to the case against Iraq. If the Council is structurally flawed (4), relying on its authorization as a key moral boundary (2) risks validating the very veto power you critique.
      *   *Cost to resolve:* You must clarify that UNSC authorization matters for *legality* and *multilateral burden-sharing*, not as the sole source of *moral legitimacy*.

  The cheapest revision
  Modify **Commitment 7** to distinguish between *moral justification for action* and *strategic success*. Change the final clause to: "...and an intervention that leaves a country worse off than non-intervention would have is **a tragic failure, even if the initial decision to act was sound.**"

  *   **What you lose:** You lose the hard normative bite that prevents reckless interventions based on good intentions. By separating the decision from the outcome, you protect your past support for Libya from being labeled "unjustified," but you weaken the warning to future interveners that bad outcomes invalidate the mission. It shifts the blame from the *act* of intervention to the *planning* of the aftermath.

  What my essay can still claim
  Your essay can defend a "burden of proof" model of intervention. You argue that sovereignty is conditional on protecting civilians, creating a narrow exception to the UN Charter when atrocities occur. However, you must concede that legality (UNSC resolution) remains the default requirement for non-humanitarian wars, explaining the Iraq/Kosovo divergence. Your position rests on the claim that while states act selectively, the *principle* of protection must remain universal. Crucially, you must separate the morality of initiation from the judgment of outcome: stopping a massacre is necessary but insufficient. The defensible core is humility: force is a tool for halting killing, not building states. You can claim consistency only if you admit that Libya's collapse complicates its justification, framing it as a valid decision with a catastrophic execution rather than an unqualified success.
