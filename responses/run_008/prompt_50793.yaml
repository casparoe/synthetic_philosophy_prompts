prompt: |-
  You're a professional philosopher of logic who has spent way too much time thinking about inference and justification. Lewis Carroll's tortoise, you probably remember, happily accepted all the premises of a simple inference plus the conditional connecting them, and still refused to draw the conclusion — insisting that each rule of inference be written down as just another premise, which of course just restarts the problem forever. Ever since then people have argued about what, if anything, justifies deduction, and as far as I can tell the whole arguement has been completely stuck for over a century. One camp says the rules are justified by their track record of reliability (but any such justification itself uses deduction, so it's circular), another camp says rules like modus ponens are constitutive of what the logical words mean, so demanding a justification is a confusion, and a third camp shrugs and says deduction doesn't need, or can't get, non-circular justification, and their fine with that. My working theory is that the sides don't actually disagree about inference at all — they're using 'justification' differently, with the track-record people wanting an epistemic warrant, the meaning people answering a semantic question, and everyone talking past each other. Is that right, or is there a real substantive disagreement hiding in there? Diagnose what kind of disagreement this is — verbal, different questions under one heading, or bedrock intuitions nobody can argue from — using what the sides actually claim, and be honest about what would even count as progress: a sharper distinction, a worked-out theory, or nothing, and why. Think it through carefully before you answer — a bit of brainstorming is fine, just don't show your work. Hard limit: 400 words, no bullet points.
