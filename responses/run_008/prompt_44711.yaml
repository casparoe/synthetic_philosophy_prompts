  2. Use the oil drilling scenario but insist the survey is free and non-intrusive, ensuring the only variable is whether the information changes the drill/no-drill choice. It must lack any strategic element where the act of surveying signals intent to competitors, as Good's theorem applies to single-agent decision problems against nature.

  3. Head off the 'cost of information' objection immediately by defining the signal as free, and tackle the 'strategic leakage' argument during the example by distinguishing between decisions against nature and games against opponents. Expect the 'analysis paralysis' crowd to argue psychological burden, which you must bracket as outside the mathematical claim.

  4. Ask them to describe a scenario where receiving the report would actively reduce their expected profit, forcing them to realise they are inadvertently introducing costs or strategic risks not in the model. If they cannot construct such a case without adding external costs, they have grasped that the value lies in the optionality to ignore.

  5. Openly refuse to derive the probabilistic proof or discuss negotiation dynamics, stating clearly that this session covers single-agent decision theory under uncertainty, not game theory or behavioural psychology. Tell them you will not entertain arguments about the time cost of reading the signal, as the theorem assumes the information is already in hand.
