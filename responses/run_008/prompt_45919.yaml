answer: |-
  That resistance is real knowledge when it stems from the character's established history, but it becomes a hiding place when you use it to avoid the difficulty of writing the ending that history actually demands.

  You have spent two hundred pages building a specific human psychology, and when a constructed psyche rejects an action, it is usually because the action violates the internal logic you have painstakingly assembled. Your agent is operating under the assumption that plot is a skeleton upon which flesh is hung, but in character-driven fiction, the psychology is the skeleton; if you force the bone to bend where it cannot, the body breaks. Readers will forgive a plot hole far more readily than they will forgive a character assassination, because a plot hole is a mistake, whereas a character breaking faith with the reader is a betrayal. However, your suspicion that this resistance is convenient is also vital, because writers often idealize their protagonists, granting them a moral purity that serves the writer's ego rather than the story's truth.

  To distinguish between honoring her integrity and hiding behind her virtue, you must perform a diagnostic test: write the scene where she tells the truth. Do not write it as a draft, write it as the final ending. If the scene feels safe, moralistic, or boring, you are likely hiding behind her goodness to avoid the messiness of conflict, and you may need to find a different source of tension that doesn't require deception. If the scene feels devastating, complex, and inevitable—if telling the truth destroys the family she is trying to hold together—then you have your answer. The plot must change, not the character. The conflict should not come from her lying to her sister, but from the truth itself being unbearable.

  Taking the ending back means accepting authorial responsibility for the thematic weight of the book. If you force the lie, you are admitting that this is a book about plot mechanics, where people are puppets moved to create suspense. If you change the plot to accommodate her honesty, you are admitting this is a book about character, where suspense arises from the consequences of truth. There is a third option: you can make her lie, but only if you go back and earn it. This means revising the earlier two hundred pages to show the cracks in her integrity, the moments where she chose convenience over honesty, so that the final lie is not a break in character but a culmination of it.

  Ultimately, the question is not whether she *can* lie, but what the lie *costs*. If the cost is her identity, do not make her pay it unless you are willing to rewrite the person who owes the debt. If you choose to let her tell the truth, you must accept that the ending you imagined is gone, and you must have the courage to write the one that remains. This is not surrendering to the character; it is recognizing that the character is the only vehicle through which the story can truthfully be told. Your job is not to make her do what you want, but to find out what she does and ensure the plot is sturdy enough to survive it.
