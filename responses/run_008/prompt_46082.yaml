traint is known broken. Then the residue, in three parts. First: my systems quarantine, roll back, or partition around inconsistency; they never knowingly keep and act on a constraint-violating state. The dialetheist's claim, as far as I can tell, is not that inconsistent states should be contained but that some are correct — that the violation is in my model of the world, not in the world. Is there any counterpart of that distinction between a representation's bug and a reality's genuine conflict in my vocabulary, where inconsistency is always and only a property of my data? Second: is there anything I handle routinely — eventual consistency, tolerated stale reads, an application that behaves sensibly while its replicas disagree — that the philosophers' truth-valued framing cannot express, or does it all reduce to epistemic humility they already had? Third, the verdict I want: is the residue a sign that my engineering vocabulary is missing a concept, or that the dialetheists are making a category mistake by treating a property of representations as a property of the world? Answer as if I will build something depending on your answer, because I might.
