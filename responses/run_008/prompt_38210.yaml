      *   This aligns perfectly with Room (omission) vs. Cult (undermining).
      *   Make sure to emphasize that "Ventilation" (exposure) is the *solution* for the Room but the *trigger* for the Cult.

  8.  **Final Polish:** Check against the prompt requirements.
