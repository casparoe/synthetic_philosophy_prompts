answer: |-
  Here is a requirements list designed to force your students out of tribalism and into functional evaluation. Following the list is the critical analysis you requested for grading.

  ### The Functional Requirements for an Account of Probability

  **1. Single-Case Applicability**
  *   **The Case:** A doctor must decide whether to operate on *this* patient, not a reference class of patients. A physicist predicts the decay of *this* uranium atom, not the ensemble. We bet on *this* coin toss.
  *   **Requirement:** The account must allow for meaningful probability assignments to individual, non-repeatable events.
  *   **Status:** **Non-Negotiable.** (If an account cannot handle the single case, it cannot guide action in real time.)

  **2. Empirical Anchoring (The Frequency Constraint)**
  *   **The Case:** If a coin lands heads 900 times out of 1,000, we reject the hypothesis that it is a fair coin (p=0.5). Observed long-run frequencies clearly constrain our probability judgments.
  *   **Requirement:** The account must explain why and how observed relative frequencies in the world constrain rational probability assignments without begging the question.
  *   **Status:** **Non-Negotiable.** (If an account cannot explain why data matters, it is disconnected from science.)

  **3. Mind-Independence (Objectivity)**
  *   **The Case:** The half-life of Carbon-14 is 5,730 years regardless of whether any human knows it, believes it, or exists. In quantum mechanics, probabilities appear in the fundamental laws, not just in our ignorance.
  *   **Requirement:** The account must accommodate the intuition that some probabilities are features of the world, not merely features of our evidence or psychology.
  *   **Status:** **Non-Negotiable.** (For scientific realism; negotiable only for strict instrumentalists.)

  **4. Normative Force (Action Guidance)**
  *   **The Case:** If the probability of a bridge collapse is high, you ought not to cross it. If it is low, you may. Probabilities are not just descriptions; they are instructions for decision theory.
  *   **Requirement:** The account must explain why knowing a probability creates a rational obligation to act in specific ways (e.g., maximizing expected utility).
  *   **Status:** **Non-Negotiable.** (Probability without decision-theoretic import is mathematically idle.)

  **5. Reference Class Resolution**
  *   **The Case:** John Smith is a smoker, a 50-year-old male, and a marathon runner. He belongs to classes with different mortality rates. Which class determines his probability of death?
  *   **Requirement:** The account must provide a principled method for selecting the relevant population for a probability assignment, or explain why the problem is ill-posed.
  *   **Status:** **Negotiable/Desirable.** (Many accounts struggle here; an account gets points for acknowledging the tension even if it doesn't fully solve it.)

  ***

  ### Critical Analysis for Grading

  **The Impossible Subset**
  There is a subset of three requirements that no standard interpretation (Frequentist, Subjective, or Propensity) can satisfy jointly without significant philosophical cost:
  1.  **Single-Case Applicability**
  2.  **Mind-Independence**
  3.  **Empirical Anchoring**

  *   **Frequentism** satisfies *Mind-Independence* and *Empirical Anchoring* (by definition) but fails **Single-Case Applicability**. (A single coin toss has no frequency; it is either 0 or 1.)
  *   **Subjectivism (Bayesianism)** satisfies *Single-Case Applicability* and *Empirical Anchoring* (via updating/conditioning) but fails **Mind-Independence**. (Probabilities are degrees of belief, not world-features.)
  *   **Propensity Theory** satisfies *Single-Case Applicability* and *Mind-Independence* but struggles catastrophically with **Empirical Anchoring**. (If a propensity is a single-case disposition, how do we measure it? We only ever observe frequencies. If we define propensity by the frequency it produces, we risk circularity or collapse into frequentism.)

  **The Knockout Requirement**
  The single requirement that does the most work to knock out contenders is **Empirical Anchoring (specifically, the demand for Non-Circular Epistemic Access).**

  *   **Why it knocks out Frequentism:** While Frequentism *looks* like it satisfies this, it fails the *Single-Case* requirement which is necessary for the anchoring to be useful in practice. More damningly, it cannot explain why *finite* frequencies constrain belief about the *limit* without assuming what it tries to prove (the Law of Large Numbers requires probability to prove probability).
  *   **Why it knocks out Subjectivism:** It forces the Subjectivist to explain why the world is "cooperative." If probability is just belief, why does nature consistently allow those beliefs to be calibrated by frequencies? The Subjectivist must treat the stability of the world as a massive, happy coincidence or a pragmatic postulate, which weakens their claim to scientific adequacy.
  *   **Why it knocks out Propensity:** This is the hardest hit. The Propensity theorist posits a real, single-case chance to save Objectivity and Single-Case Applicability. But when asked, "How do you know the propensity is 0.5?", they must answer, "Because the long-run frequency is 0.5." This makes the propensity metaphysically redundant (an idle wheel) or epistemically inaccessible (we can never know the chance, only the frequency).

  **Grading Instruction:**
  Students who identify **Empirical Anchoring** as the pressure point demonstrate they understand that the core problem of probability is not metaphysical (what *is* it?) but epistemological (how do we *know* it, and why does that knowledge bind us?). Students who pick "Single-Case" or "Objectivity" as the knockout requirement have merely chosen a side in the metaphysical debate; students who pick "Empirical Anchoring" have identified the structural weakness shared by all sides.
