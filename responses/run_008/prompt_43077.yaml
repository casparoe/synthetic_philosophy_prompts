answer: |-
  ### Desiderata for a Theory of Moral Learning from Lives

  Below are the requirements any adequate theory must meet to justify a seminar of this kind. I have marked each as **Non-Negotiable** (essential for the pedagogical context you described) or **Controversial** (reflecting a specific philosophical or historiographical commitment that a viable theory might reasonably reject).

  **1. The Mixed-Character Requirement**
  *   **Requirement:** The theory must explain how moral knowledge is extracted from subjects who possess significant vices alongside virtues, or whose virtues are inextricably bound to their vices.
  *   **Motivation:** Plutarch explicitly pairs Alexander (magnanimity) with Caesar (ambition) despite their tyrannical tendencies. A student who reads Alcibiades must learn *from* his brilliance without endorsing his treachery. If the theory requires a morally pure subject to transmit moral truth, it cannot handle the core texts of your syllabus (Plutarch, many modern political bios).
  *   **Status:** **Non-Negotiable.**

  **2. The Critical Agency Requirement**
  *   **Requirement:** The theory must account for the learner's active judgment in evaluating the life, rather than treating the biographical narrative as a direct imperative. The learner must be able to say, "This person is admirable in way X, but I should not do Y."
  *   **Motivation:** A student who imitates Alexander's drinking because they admire his conquest has failed the seminar. The theory must distinguish between *admiring* the capacity for leadership and *imitating* the specific habits. It must explain how the student filters the life through their own moral framework.
  *   **Status:** **Non-Negotiable.**

  **3. The Transferability Requirement**
  *   **Requirement:** The theory must explain how a lesson learned from a specific, historically situated life generalizes to the learner's different context without collapsing into an empty abstraction.
  *   **Motivation:** Learning from a medieval saint requires translating "asceticism in the desert" to "integrity in the suburbs." If the lesson stays stuck at the level of the particular episode (e.g., "fast for forty days"), it is antiquarianism, not moral education. If it generalizes too far (e.g., "be good"), it loses the biographical anchor.
  *   **Status:** **Non-Negotiable.**

  **4. The Historicity Requirement**
  *   **Requirement:** The theory must demand that the events described actually occurred in something like the way narrated for the moral lesson to hold.
  *   **Motivation:** If a student discovers the "cherry tree" story about Washington is apocryphal, does the lesson about honesty vanish? Hagiography often invents miracles to edify. Plutarch prioritizes the "phrase or jest" over the "battle where thousands fall," admitting he is not writing history. A theory that demands strict historicity excludes the hagiographic tradition and Plutarch's own methodological claims.
  *   **Status:** **Controversial.** (A robust theory should likely explain why *narrative truth* can sustain moral learning even when *factual truth* is compromised, rather than demanding strict historicity.)

  **5. The Selection Transparency Requirement**
  *   **Requirement:** The theory must account for the biographer's shaping hand without treating that shaping as mere manipulation that invalidates the lesson.
  *   **Motivation:** Plutarch selects anecdotes to reveal character; hagiographers delete sins to reveal sanctity. If the theory treats all selection as distortion, no biography can teach. If it treats all selection as neutral, the student cannot critique the bias. The theory must explain how to learn *from* the selection, not just *despite* it.
  *   **Status:** **Non-Negotiable.**

  **6. The Affective Engagement Requirement**
  *   **Requirement:** The theory must explain the role of emotion (admiration, repulsion, pity) in moral learning, rather than treating the biography as a data set for cold rational analysis.
  *   **Motivation:** Plutarch writes to provoke *philotimia* (love of honor). We learn from lives because we *care* about them. A theory that reduces the biography to a set of propositional maxims ("Do not invade Greece") misses the motivational engine of the genre.
  *   **Status:** **Non-Negotiable.**

  ***

  ### Tensions and Design Space

  **The Edification vs. Agency Tension**
  *   **Conflict:** *Desideratum 5 (Selection Transparency)* clashes with the hagiographic impulse to *edify* by removing obstacles to imitation. If a life is shaped perfectly to edify (the Hagiographic template), it risks violating *Desideratum 2 (Critical Agency)* because there is nothing for the student to judge or filter. The "perfect example" demands replication, not evaluation.
  *   **Verdict:** **Design Space, not Fatal.** The tension sets the parameters for your syllabus design. You cannot use hagiography *as* hagiography (i.e., as devotional literature); you must teach it *as* biography, framing the omissions as part of the moral problem. The theory must allow that a "shaped" life can still trigger critical agency if the shaping is made visible or if the context creates distance.

  **The Particularity vs. Generalization Tension**
  *   **Conflict:** *Desideratum 3 (Transferability)* fights against the grain of *Desideratum 1 (Mixed-Character)*. The more mixed and historically specific the character (e.g., a slave-owning Founding Father), the harder it is to extract a generalizable norm without whitewashing the vice.
  *   **Verdict:** **Design Space.** The theory must posit that what generalizes is not the *action* but the *structure of the dilemma* or the *quality of attention*.

  ***

  ### The Most Exclusionary Requirement

  **The Critical Agency Requirement (Desideratum 2)** does the most work to exclude candidates.

  Many traditional theories of moral learning from lives rely on **mimetic absorption**: the idea that exposure to virtue automatically cultivates virtue (the "osmosis" model). This requirement kills that model. It demands a theory that explains how a student can hold two contradictory thoughts simultaneously: "This person is my teacher" and "This person is morally flawed."
  *   **Why it decides your framing:** If you adopt a theory that fails this, your seminar becomes a hall of mirrors where students simply emulate whatever they read. By making this non-negotiable, you force the syllabus to treat biographies not as *authorities* but as *cases*. This justifies pairing Plutarch (who invites comparison) with Saints (who demand critique).

  ***

  ### Scorecard of Three Approaches

  Here is how three candidate theories score against the desiderata.

  | Desideratum | **1. Plutarchan Practice** (Parallel Lives) | **2. Hagiographic Template** (Athanasius' *Antony*) | **3. Modern Exemplarism** (Zagzebski) |
  | :--- | :--- | :--- | :--- |
  | **1. Mixed-Character** | **PASS.** Explicitly designed for this. Vices are diagnostic tools. | **FAIL.** Flaws are edited out or reinterpreted as virtues. Internal to approach; cannot be patched without ceasing to be hagiography. | **PARTIAL.** Admiration is the filter; if you can't admire the vice, it drops out. Risks ignoring the structural link between vice and virtue. |
  | **2. Critical Agency** | **PASS.** The "Comparison" forces judgment. The reader must weigh Greek vs. Roman. | **FAIL.** The text demands emulation, not judgment. Internal to approach; requires external framing (your seminar) to patch. | **PASS.** Admiration is a emotion that can be反思 (reflected upon), but relies on the reliability of the emotion. |
  | **3. Transferability** | **PASS.** "Parallel" implies the lessons apply to the reader's life (Roman/Greek statesman -> Reader). | **PARTIAL.** Transfer is spiritual, not civic. Hard to generalize "desert asceticism" without allegorizing. | **PASS.** Exemplars define the concepts, so transfer is built-in by definition. |
  | **4. Historicity** | **CONTROVERSIAL.** Plutarch prioritizes character-truth over fact. Theory matches practice. | **FAIL.** Often invents miracles. If theory demands facts, this fails. If theory allows narrative truth, it passes. | **PASS.** Zagzebski argues the *concept* of the exemplar matters more than historical existence. |
  | **5. Selection Transparency** | **PASS.** Plutarch announces his method in prefaces. | **FAIL.** Selection is hidden to preserve the illusion of sanctity. | **PASS.** Acknowledges exemplars are constructed by the admirer's perspective. |
  | **6. Affective Engagement** | **PASS.** Relies on *philotimia* (love of honor). | **PASS.** Relies on *zeal* for holiness. | **PASS.** Admiration is the foundational concept. |

  **Summary of Failures:**
  *   **Hagiography** fails primarily on **Critical Agency** and **Mixed-Character**. This is internal to the genre; it can only be "patched" by treating the text ironically or critically (which changes how it is read).
  *   **Plutarch** struggles with **Historicity** only if the theory demands modern empirical standards. His practice is consistent with a "narrative truth" theory.
  *   **Zagzebski** struggles with **Mixed-Character** if the exemplar's vice is hidden by the admiration. It risks circularity: "I admire them because they are good; they are good because I admire them."

  ***

  ### The Limit Case

  There is one case your best-supported reading of these desiderata (likely a Plutarchan-Exemplarist hybrid) cannot fully handle:

  **The Case of the Disillusioned Imitator.**
  A student reads a biography, exercises critical agency, identifies a virtue (e.g., "unwavering conviction"), and structures their own self-narrative around it. Mid-semester, they encounter historical evidence that the biographer suppressed (e.g., the "conviction" was actually fanaticism that led to preventable deaths, or the figure is a composite fiction).

  **Why the theory fails:**
  The desiderata demand **Critical Agency** (judge the life) and **Transferability** (apply the lesson). But they assume the *moral truth* survives the factual correction. In this case, the student feels a *betrayal* that is not just factual but moral. The theory explains how to learn from a mixed life, but it does not explain how to *unlearn* a virtue that was built on a falsehood.
  *   **The Pedagogical Gap:** The theory explains how to extract gold from ore. It does not explain what to do when the student has already minted the coin, spent it, and is then told the gold was fool's pyrite.
  *   **Classroom Discussion:** This is the case you want to discuss. It moves the seminar from "How do we read lives?" to "What is the risk of building a self on a story?" It forces the students to confront the **Historicity Requirement** not as a philosophical puzzle, but as an existential vulnerability. It justifies the syllabus not because biographies *give* answers, but because they expose the fragility of the answers we build from them.
