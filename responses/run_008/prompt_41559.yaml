answer: |-
  Your intuition is correct: Expected Value (EV) alone is insufficient, and your tentative principle creates seams because it tries to patch EV theory rather than replacing the metric of evaluation. Your five verdicts are actually remarkably consistent with a specific, well-established framework in modern decision theory, provided we sharpen the definitions.

  You do not need to overturn any of your five verdicts. However, you must shift from evaluating **Expected Money** to evaluating **Expected Utility**, subject to a **Lexicographic Ruin Constraint**.

  Here is the precise principle that unifies your judgments.

  ### The Principle: Constrained Bounded Utility

  An agent should accept a gamble if and only if it satisfies three conditions, checked in this order:

  1.  **The Ruin Constraint (Lexicographic Priority):** Reject the gamble immediately if any possible outcome results in wealth falling below a critical solvency threshold ($W_{min}$), unless the probability of that outcome is physically negligible (e.g., $< 10^{-50}$). "Crushing" losses are defined relative to this threshold.
  2.  **The Convergence Condition:** The Expected *Utility* ($E[U]$), not Expected *Value*, must converge absolutely. If the series of utilities oscillates or depends on the order of summation (conditional convergence), the gamble is undefined and must be rejected.
  3.  **The Utility Maximization:** If (1) and (2) are passed, calculate the Certainty Equivalent ($CE$) using a bounded, concave utility function $U(W)$. Accept if the cost to play is less than $CE$.

  **Why this works:**
  *   **Bounded Utility** resolves the St. Petersburg paradox (infinite money $\neq$ infinite utility).
  *   **The Ruin Constraint** resolves the Pasadena and Heavy-Tail cases (undefined or positive EV doesn't matter if you go bust).
  *   **Absolute Convergence** distinguishes the Pasadena game from the Capped Pasadena game.

  ---

  ### Application to Your Five Verdicts

  **1. The Double-or-Half Coin Flip**
  *   **Analysis:** Halving your wealth is painful but (presumably) does not breach $W_{min}$. The series converges trivially.
  *   **Clause:** **Utility Maximization.** With a concave utility function (like Log Wealth), the geometric mean growth rate is positive.
  *   **Verdict:** **Play.** (Matches your gut).

  **2. The St. Petersburg Game**
  *   **Analysis:** No negative outcomes, so the Ruin Constraint is not triggered. However, money grows exponentially.
  *   **Clause:** **Utility Maximization (Bounded).** Because $U(W)$ is bounded (diminishing marginal returns), the infinite sum of money transforms into a finite sum of utility. For a typical agent, the $CE$ of this utility is indeed low (often calculated between $2 and $100 depending on initial wealth).
  *   **Verdict:** **Play only for a modest fee (~$50).** (Matches your verdict; the "infinite EV" is ignored in favor of finite EU).

  **3. The Pasadena Game**
  *   **Analysis:** The payouts alternate between large gains and large *losses*. The losses grow without bound.
  *   **Clause:** **The Ruin Constraint.** Eventually, a negative term in the sequence exceeds your total wealth, breaching $W_{min}$. Even if you argue you won't hit that term, the *existence* of the possibility violates the constraint. Furthermore, the **Convergence Condition** fails because the sum of utilities oscillates.
  *   **Verdict:** **Decline even for free.** (Matches your verdict. The "undefined EV" is a symptom of the deeper problem: unbounded downside risk).

  **4. The Capped Pasadena Game**
  *   **Analysis:** Negative outcomes are capped at -$100. Positive outcomes are St. Petersburg-like.
  *   **Clause:** **The Ruin Constraint** is satisfied (assuming you have >$100). **The Convergence Condition** is satisfied because $U(W)$ is bounded; even if the monetary EV diverges, the *Utility* EV converges because the utility of infinite money is finite.
  *   **Verdict:** **Play for a modest fee.** (Matches your verdict. This explains the "seam": Case 3 fails on downside risk/convergence; Case 4 passes because the downside is tamed).

  **5. The Heavy-Tailed Negative Game**
  *   **Analysis:** Defined positive EV, but a small chance of a "crushing loss."
  *   **Clause:** **The Ruin Constraint.** You defined the loss as "crushing." If this means it breaches $W_{min}$ (ruin, insolvency, life-altering harm), the positive EV is irrelevant.
  *   **Verdict:** **Reluctant/Decline.** (Matches your verdict. This is not standard risk aversion; it is ruin avoidance).

  ---

  ### The New Case: "Rare Crushing Negatives"

  **The Setup:** A Pasadena-style game where negative outcomes are vanishingly rare but enormous, such that the mathematical series converges to a large positive EV, and the *modal* (most likely) outcome is a comfortable win.

  **The Principle's Recommendation:**
  **Decline.**

  **Reasoning:**
  This case passes the **Convergence Condition** (the math works out) and passes **Utility Maximization** (the average utility is high). However, it fails the **Ruin Constraint**.
  You specified the negative outcomes are "enormous" and "crushing." In decision theory, if an outcome drops you below $W_{min}$ (where you cannot recover, operate, or survive), the probability magnitude matters less than the existence of the risk. If the probability is non-zero (and physically possible), the Lexicographic Ruin Constraint vetoes the gamble regardless of how attractive the modal outcome is.

  **Is this a *Reductio*?**
  It feels like one, because it implies turning down a "free lunch" that pays 99.99% of the time. However, it is **not** a *reductio* of the account; it is a feature of **non-ergodic** decision making.

  1.  **Survival Bias:** If you play this game repeatedly (or if "crushing" means you can't play *any* future games), you *will* eventually hit the tail. The time-average growth rate of your wealth is negative, even if the ensemble-average (EV) is positive.
  2.  **The "One-Shot" Defense:** If this is truly a one-off lifetime opportunity and "crushing" means "lose your savings" but not "die or go to prison," many philosophers would argue you *should* take it. However, your Case 5 verdict ("reluctant to play") suggests you already prioritize safety over optimized EV in heavy-tailed scenarios. To remain consistent with your Case 5 intuition, you must also reject this New Case.
  3.  **Model Risk:** In the real world, a probability described as "vanishingly rare" for a "correspondingly enormous" payout is usually a signal of model error. If the payout is truly enormous, the mechanism guaranteeing it is likely fragile. The Ruin Constraint acts as a hedge against model uncertainty.

  **Conclusion on the New Case:**
  The recommendation to **Decline** is the rational one for an agent who intends to remain in the game long-term. It only seems like a *reductio* if you assume decision theory is about maximizing single-shot monetary yield rather than sustaining agency over time. Given your verdict on Case 5, you are implicitly an agent who values sustainability over single-shot optimization.

  ### Summary of the "Seams"

  You worried that "undefinedness" couldn't explain both the rejection of Pasadena and the acceptance of Capped Pasadena. You were right. Undefinedness wasn't the cause; **unbounded downside** was.

  *   **Pasadena:** Unbounded downside $\rightarrow$ Ruin Risk $\rightarrow$ **Reject.**
  *   **Capped Pasadena:** Bounded downside $\rightarrow$ No Ruin Risk $\rightarrow$ **Accept.**
  *   **St. Petersburg:** No downside $\rightarrow$ No Ruin Risk $\rightarrow$ **Accept (at low price).**
  *   **Heavy Tail:** Unbounded downside $\rightarrow$ Ruin Risk $\rightarrow$ **Reject.**

  Your verdicts are consistent. You are not an Expected Value maximizer; you are a **Survival-Constrained Expected Utility maximizer.** This is a coherent, defensible, and robust position.
