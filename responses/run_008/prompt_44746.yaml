answer: |-
  Here is a lesson plan designed for a 50-minute peer review session. It respects your professor's framing while directly targeting the specific misconceptions your classmates are holding.

  ### 1. The Prerequisites (What must be in place first)
  Before the analogy can work, you must establish a shared definition of **"ontological status."** Your classmates are operating with a binary ontology: something is either a **Concrete Object** (like a brain or a chair) or it is **Nothing/Fake** (like a hallucination).

  You need to explicitly introduce a third category in the first five minutes: **The Abstract Posit.**
  *   **The Rule:** An abstract posit is not physically locatable, but it is indispensable for prediction and explanation.
  *   **The Check:** Ask the room: *"Does the center of mass move when I tip the chair?"* If they say "no," they aren't ready. They need to agree that the CoM *does* move (mathematically/physically) even though no *particle* moved. Once they agree that something can have causal power without being a "thing," the analogy can land.

  ### 2. The Single Carrying Example
  **Use the Center of Mass (CoM) of the Chair.**
  Do not switch to the "Fictional Character" example as your primary driver, and absolutely do not contrast the Self with the Brain.

  *   **Why CoM?** It is the only example in your professor's triad that is scientifically rigorous. It neutralizes the "arbitrary" objection because the CoM is constrained by physical facts. You cannot decide your chair's CoM is in the armrest if the mass is in the seat. This directly counters the classmate who thinks we can "rewrite ourselves at will."
  *   **Why NOT the Brain?** Contrasting Self vs. Brain invites a category error. It forces a competition between an *abstract posit* (Self) and a *concrete object* (Brain). Your classmates will lose because they can point to the brain and not the self. By contrasting Self vs. CoM, you keep the comparison within the same category (Abstract Posit vs. Abstract Posit). The question shifts from *"Where is it?"* to *"What work does it do?"*

  ### 3. Session Sequence (50 Minutes)

  **0:00–0:05: Framing the Ontology**
  *   State the goal: "We aren't asking if the self exists. We are asking *how* it exists."
  *   Establish the "Abstract Posit" category using the CoM prerequisite check above.

  **0:05–0:20: The Analogy Deep Dive (CoM = Self)**
  *   Draw the chair on the board. Mark the CoM.
  *   **Map the features:**
      *   *CoM:* No atom exists at the center of gravity. **Self:** No neuron exists at the "I."
      *   *CoM:* If you remove the legs, the CoM shifts. **Self:** If you lose memories or social roles, the self shifts.
      *   *CoM:* It predicts if the chair will tip. **Self:** It predicts how the person will act.
  *   **Crucial Move:** Emphasize that the CoM is **real** because physics breaks without it. Similarly, social prediction breaks without the Self.

  **0:20–0:35: Addressing the "Arbitrary/Rewrite" Objection**
  *   This is where you handle the classmate who argues we can rewrite ourselves at will.
  *   **The Intervention:** Return to the Chair. Ask: *"Can I decide the CoM is in the armrest just by telling a story about it?"*
  *   **The Point:** No. The CoM is constrained by the distribution of mass. The Self is constrained by the distribution of **facts, actions, and social accountability.**
  *   Explain that "Narrative" does not mean "Fiction." It means "Organization of Data." You cannot write a coherent narrative that contradicts all your past actions and expect to function in society. The "gravity" pulls the narrative toward the facts of your behavior.

  **0:35–0:45: Open Discussion/Troubleshooting**
  *   Invite questions, but steer them back to the CoM analogy. If they ask about qualia or feelings, remind them: "We are discussing the *locus of attribution*, not the *feeling of experience*."

  **0:45–0:50: The Assessment Question**
  *   Pose the final question (see below).

  ### 4. Misconceptions & Interventions (In Order of Surface)

  **Misconception 1: "If it's a construct, it isn't real."**
  *   *When it surfaces:* Early, when you introduce the term "narrative."
  *   *Where to head it off:* **Minute 10.** During the CoM mapping.
  *   *The Fix:* "Is the Center of Mass fake? If I calculate it wrong, the chair falls. It has causal power. Dennett is saying the Self has causal power in social physics, not that it is a ghost."

  **Misconception 2: "The view makes the self arbitrary."**
  *   *When it surfaces:* Mid-session, when discussing "narrative."
  *   *Where to head it off:* **Minute 25.** Immediately after mapping CoM to Self.
  *   *The Fix:* "Arbitrary means 'unconstrained.' The CoM is constrained by mass. The Self is constrained by history and behavior. You are not the author of the narrative; you are the *editor* working with existing footage."

  **Misconception 3: "We can rewrite ourselves at will." (The Specific Classmate)**
  *   *When it surfaces:* During discussion.
  *   *Where to head it off:* **Minute 30.** Use the "Chair Tip" test.
  *   *The Fix:* "If you rewrite your narrative to say you are a pacifist, but you keep getting into fights, your 'Center of Narrative Gravity' hasn't moved. The prediction fails. The self is where the behavioral vectors average out, not where you say they do."

  ### 5. What to Refuse to Cover
  You must openly state at the beginning: **"We are not discussing the Multiple Drafts Model today."**

  *   **Why:** The Multiple Drafts Model is Dennett's cognitive science theory of *consciousness* (how the brain processes information over time). The Center of Narrative Gravity is his philosophical theory of *personal identity* (what the self is).
  *   **The Risk:** If you drift into Multiple Drafts, you will start talking about neural latency, temporal gaps, and homunculi. This will confuse the metaphysical point about the *status* of the self. It gives the "Brain vs. Self" crowd ammunition to reduce the self to neural firing, which undermines the "Abstract Posit" lesson. Keep the focus on the *ontology of the self*, not the *mechanics of the mind*.

  ### 6. The Final Assessment Question
  Do not ask them to define the view. Ask them to apply the logic of the analogy to a new scenario.

  **The Question:**
  *"If Dennett is right, and the Self is like a Center of Mass, what happens to a person's Self if they suffer total retrograde amnesia but retain all their personality traits and skills? Does the Center of Narrative Gravity disappear, shift, or stay the same? Explain your answer using the constraints of the CoM analogy."*

  **What to listen for:**
  *   **Memorization:** They say "It disappears because there is no story." (Wrong: The behavior/mass is still there).
  *   **Understanding:** They argue that the CoM *shifts* or becomes *indeterminate* because the "mass" (behavioral history) is disconnected from the "narrative access," OR they argue it stays the same because the "mass" (personality/skills) remains distributed in the same way, regardless of the story.
  *   **The Key:** You want them to recognize that the Self (CoM) depends on the *distribution of traits/actions* (Mass), not just the *conscious story* (Calculation). If they grasp that the Self is grounded in the "mass" of behavior, not just the "story" told, they understand Dennett.
