prompt: |-
  I'm a third-year undergraduate in an upper-level philosophy of mind course, and our professor has asked me to run next week's fifty-minute review session for about fifteen classmates ahead of the midterm. The topic is Dennett's account of the self as a center of narrative gravity. Don't explain the view to me — plan how I should teach it. Our professor organized the lectures around a comparison class of posits: the center of mass of a chair, a fictional character, and a person's self, insisting throughout that the self belongs with the first two rather than with the brain or the soul. But several classmates left those lectures convinced the view makes the self arbitrary or "just made up," and one keeps arguing that if the self is a narrative construct, we could rewrite ourselves at will, so any autobiography is as good as any other. Plan the sequence for me: what has to be in place before the analogy can do any work, which single example should carry the whole session (and why the obvious move of contrasting the self with the brain is the wrong carrier here), the misconceptions I should expect in roughly the order they'll surface, exactly where in the sequence to head each one off, and one question I can pose at the end that would reveal whether they've understood the view rather than memorized the phrase. Please also tell me what I should openly refuse to cover at this level — I'm worried about drifting into the multiple drafts material and losing the hour.
