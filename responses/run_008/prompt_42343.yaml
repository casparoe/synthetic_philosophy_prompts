  - the slow transporter, where your neurons are swapped for functionally identical silicon one at a time over six months while you stay awake and gossip the whole way through: survived, obviously
  - brain transplant into a cloned body: survived, and she gets annoyed when people pretend this one is hard
  - fission, where your two hemispheres go into two different bodies and both wake up psychologically continuous with you: you died, there are two new people now, and she denies there's any further fact about which one is "really" you
  - the dementia case, someone who loses basically all memory and personality over a decade while their body and brain just keep going: they survived the whole time, it was still them in there till the end

  She also insists she's talking about survival itself, not the "what matters" stuff our Parfit guy keeps trying to redirect to, and she says she'd treat stepping into the teletransporter exactly like a terminal diagnosis, not like a rough flight.

  Now we've got a new case to run past her and I want to go in with a prediction instead of just arguing. Setup: you start the slow transporter, but halfway through, while you're a fifty-fifty brain/silicon hybrid, the clinic also snapshots your current hybrid state and prints a second body running that halfway-you, without touching you at all. Your own replacement then continues to completion as normal. So what does she say — did you survive as the one who kept going, and is the printed halfway-you also you, partially you, or a stranger? And crucially, does the mere existence of the branch change her verdict about the original line the way it did in the fission case, or not?

