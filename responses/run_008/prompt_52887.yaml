answer: |-
  Here is a complete design for the 90-minute seminar session. It leverages your "fabricated report" twist to dramatize the core tension of heterophenomenology: the gap between the *text* of experience and the *reality* of the brain, and the methodological necessity of bracketing that gap.

  ### 1. The Staged Experience: "The Kitchen Scene"
  **Recommendation:** Do not use an abstract illusion or a memory test. Use a **mundane, narrative video clip**.
  *   **Material:** A 45-second silent video clip of a person making tea in a kitchen. (You can film this yourself or find stock footage).
  *   **Key Details:** Ensure there are 5-6 specific, verifiable details (e.g., the kettle is blue, the spoon is left in the cup, the person looks at a clock, a cat walks by).
  *   **Why:** Mundane events invite narrative filling-in. Students will unconsciously "smooth" the story. This allows your fabricated reports to look authentic (they will contain plausible errors or embellishments) without being obviously fake. It mirrors how we narrativize our own qualia.

  ### 2. Class Split & Roles
  *   **Total Students:** 15
  *   **Subjects (Volunteers):** 3 Students. (They leave the room).
  *   **Interpreters:** 12 Students. (Remaining in the room, divided into 3 groups of 4).
  *   **The Instructor (You):** The "Heterophenomenologist." You control the data stream and hold the "ground truth."

  ### 3. Materials Required
  1.  **The Video:** Loaded on your laptop, ready to play instantly.
  2.  **Subject Packets:** 3 sheets of paper for the volunteers (prompt: "Describe exactly what you saw in as much detail as possible. Do not worry about grammar.").
  3.  **Interpreter Packets:** 3 identical sets of transcripts. Each set contains **5 Transcripts** (labeled Subject A, B, C, D, E).
      *   Transcripts A, B, C are from the real volunteers.
      *   Transcripts D, E are **fabricated by you** in advance.
      *   *Crucial Detail:* Mimic student handwriting/typing style. Include a typo or two. Make the content plausible but divergent on key details (e.g., Subject D claims the kettle was red; Subject E claims no cat appeared).
  4.  **Prediction Sheets:** One per Interpreter Group. Lists 5 specific questions (e.g., "What color was the kettle?", "Did the subject drink the tea?").
  5.  **Timer:** Visible to you.

  ### 4. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10 | Introduction & Framing**
  *   Tell the class: "Today we are practicing a method for studying consciousness. We are not discussing theories yet. We are doing data science."
  *   Select 3 Volunteers. Send them to a pre-arranged waiting area (or hallway).
  *   **Instruction to Volunteers:** "Watch the video. Write a report. Do not talk to each other."

  **00:10 – 00:25 | Stage 1: Data Generation**
  *   **In Room:** Brief the Interpreters. "You are a research team. You will receive transcripts from subjects who viewed a stimulus. Your goal is to build a **Predictive Model** of each subject."
  *   **The Rule:** "You must treat every transcript as valid data. You are forbidden from speculating on whether the subject is lying or mistaken. You must assume the text is the only reality you have access to."
  *   **Out of Room:** You join the volunteers. Play the video once. Collect reports.
  *   **The Swap:** While collecting real reports, slip in your 2 fabricated reports (D & E). Shuffle them.

  **00:25 – 00:30 | Data Prep (The Black Box)**
  *   Return to the classroom. Volunteers remain outside.
  *   Distribute Interpreter Packets (5 transcripts each).
  *   *Note:* This 5-minute buffer allows you to compose yourself and ensure the "God's eye view" is maintained.

  **00:30 – 01:00 | Stage 2: Interpretation & Modeling**
  *   **Task:** Groups analyze the 5 texts. They must fill out the Prediction Sheet.
  *   **Requirement:** For each of the 5 questions, they must record:
      1.  The Predicted Answer for Subject A, B, C, D, E.
      2.  A "Confidence Score" (1-5).
      3.  A "Coherence Note" (e.g., "Subject D's claim about the kettle contradicts their claim about the stove, so confidence is low").
  *   **Instructor Role:** Circulate. If a group asks, "Did the cat actually walk by?" you must answer: "I cannot answer that. You only have the texts." (This enforces the heterophenomenological bracket).

  **01:00 – 01:15 | Feedback & The Reveal**
  *   Collect Prediction Sheets.
  *   **Phase 1 (Real Subjects):** Bring Volunteers A, B, C back in. Ask them the 5 questions live. Compare their answers to the Interpreters' predictions.
      *   *Result:* Interpreters will see their models worked reasonably well for A, B, C.
  *   **Phase 2 (The Twist):** Ask the class: "What about Subjects D and E? What will they say?"
  *   Let them speculate. Then reveal: **"Subjects D and E do not exist. I wrote those reports."**
  *   *Crucial Moment:* Acknowledge the discomfort. "You built a model of a mind for D and E. You reasoned about their beliefs, their attention, their errors. But there was no mind."

  **01:15 – 01:30 | Debrief & Theory Mapping**
  *   Transition to Dennett. (See Section 6 below).

  ---

  ### 5. Concrete Feedback Mechanism
  The feedback is built into the **Reveal**.
  *   **Success Condition:** If interpreters successfully predicted the *textual consistency* of D and E (e.g., "Subject D will say the kettle is red because they wrote it"), they succeeded at *heterophenomenology*, even though the subject was fake.
  *   **Failure Condition:** If interpreters say, "We knew D was fake because no one would miss the cat," they have failed the methodological constraint (they appealed to outside truth).
  *   **Scoring:** Do not grade this. The "score" is the collective realization that they reasoned successfully about a non-existent phenomenology.

  ---

  ### 6. The Debrief: Mapping Activity to Theory
  Use the following script structure to move from the activity to Dennett's *Heterophenomenology*.

  **1. Texts vs. Windows (The Bracketing)**
  *   *Ask:* "When you analyzed Transcript D, did you treat it differently than Transcript A?"
  *   *Point:* "If you did your job right, you didn't. You treated A as a text and D as a text. Dennett argues *all* first-person reports are texts. We never have direct access to the 'window' into the brain. We only have the output. By forcing you to ignore the reality of the video, I forced you into the **heterophenomenological bracket**. You studied the *phenomenal world* of the subject, not the *real world*."

  **2. The Fictional World (Intentional Stance)**
  *   *Ask:* "Did Subject D have beliefs? Did they believe the kettle was red?"
  *   *Point:* "You attributed beliefs to D to make sense of the text. D is like a character in a novel. You can reason about Hamlet's depression without Hamlet having a brain. Dennett says subjects are the *authors* of their own fictional worlds. Your job as scientists is to interpret the fiction, not to police its truth."

  **3. Privileged Authority (The Demotion)**
  *   *Ask:* "Why did the reveal feel like a trick? Because you assumed A, B, and C had 'authority' over their experience."
  *   *Point:* "Heterophenomenology neutralizes first-person authority. The subject is the best source of data, but not the final arbiter of truth. If Subject A had said 'I saw a dragon,' you would have recorded 'Subject believes they saw a dragon,' not 'A dragon appeared.' Today, I took that neutrality to the extreme by removing the subject entirely. The method remained the same."

  ---

  ### 7. Honest Assessment: What This Activity Cannot Reproduce
  You must explicitly address this in the debrief to prevent cynicism.

  **The Limitation: The Archimedean Point**
  *   **The Issue:** In this activity, *you* (the instructor) knew which reports were fake. You held the "God's eye view" of the ground truth. In real heterophenomenology, the scientist *never* knows for sure if a report is confabulation, error, or truth. There is no reveal at the end of a real study.
  *   **Why It Matters:** Dennett's method is a *discipline of ignorance*. We act *as if* we don't know the truth, permanently. In this class, you knew the truth at the end.
  *   **How to Supply It:** Tell them: "In real science, I never get to bring the subjects back and reveal the trick. I have to live with the uncertainty forever. That is why the method is necessary. If we waited for truth, we'd never start. Today, I gave you the reveal to show you the gap exists. In the real world, you must act as if the reveal never comes."

  ---

  ### 8. Predictable Failure Modes & Mitigation

  **Failure 1: The "Parlor Trick" Reaction**
  *   *Risk:* Students feel manipulated and dismiss the philosophy as a game. "You lied to us, so this method is about lying."
  *   *Mitigation:* Own the deception immediately in the debrief. "I deceived you to simulate the epistemic position of the scientist. The deception was not the point; the *uncertainty* was the point. If you feel tricked, good. That is how it feels to realize first-person authority is not absolute."

  **Failure 2: Interpreters Spot the Fakes Early**
  *   *Risk:* If your fabricated reports are too polished or too weird, groups will whisper "D and E are fake" and stop modeling them seriously.
  *   *Mitigation:* **Mimic imperfection.** If the real students write in all lowercase, you do too. If they hesitate ("um, I think..."), you hesitate.
  *   *Contingency:* If a group raises their hand and says "These two are fake," do not confirm. Say: "Treat them as real for the purpose of the model. Can you model a mind that sees a red kettle? Do that work."

  **Failure 3: Volunteers Leak the Twist**
  *   *Risk:* Volunteers return, hear the reveal, and say "Wait, there were only 3 of us?" before you control the narrative.
  *   *Mitigation:* Instruct volunteers *before* they re-enter: "When you come back, do not discuss your experience until I ask you specific questions." Seat them apart from the interpreter groups.

  ---

  ### 9. Redesign Criteria: When to Abandon This Design
  You asked what outcome would tell you the activity is teaching the *wrong lesson*.

  **Criterion 1: If Interpreters Reliably Spot the Confabulations**
  *   *Outcome:* If 2 out of 3 groups correctly identify D and E as fake based *only* on the text (e.g., "No human would describe it this way").
  *   *Diagnosis:* The activity teaches that reports have "truth markers." This contradicts Dennett. Dennett argues we cannot distinguish the "texture" of truth from the "texture" of confabulation from the outside.
  *   *Redesign:* You must make the fake reports more "noisy." They need to sound more human, more uncertain. The lesson fails if the text betrays the lie.

  **Criterion 2: If Genuine Reports are No More Predictive Than Fake Ones**
  *   *Outcome:* If the predictions for A, B, C are just as wrong as D, E.
  *   *Diagnosis:* This suggests the task (predicting answers from text) is impossible, leading students to conclude heterophenomenology is useless.
  *   *Redesign:* Simplify the prediction task. Ask them to predict *consistency* (e.g., "Will they stick to this story?") rather than *truth* (e.g., "Was the kettle red?"). Heterophenomenology is about mapping the *structure* of the belief, not guessing the world.

  **Criterion 3: If the Debrief Collapses into Skepticism**
  *   *Outcome:* If students conclude "Therefore, we can know nothing about consciousness."
  *   *Diagnosis:* You've taught solipsism, not heterophenomenology. Dennett is a realist about science, just anti-realist about *qualia* as private objects.
  *   *Redesign:* You must pivot harder to the **Third-Person Success**. Emphasize: "Even though D didn't exist, your model of D was coherent. That means we can have a science of the *appearance* of consciousness without solving the *hard problem* of whether it's real."

  ### Final Advice for the Instructor
  Your role in Stage 2 is critical. You must play the "Hard-Nosed Scientist." When a student asks, "But what *really* happened?" you must gently but firmly reply, "That question is outside the method. What does the text say?" This performative restraint is what teaches the method better than any lecture could. The fabrication is the shock; your refusal to validate their reality is the lesson.
