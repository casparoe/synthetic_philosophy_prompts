  10. **Final Polish:** Check against the prompt requirements one last time.
      *   Lay out comparison? Yes.
      *   Show where it breaks? Yes.
      *   Which breakages matter? Yes (Interference + Bell/PBR).
      *   Does it assume definite reality? Yes.
      *   Can it hold that + interference? No.
      *   What must a surviving version concede? That reality isn't "classical/definite" in the way the friend thinks.

