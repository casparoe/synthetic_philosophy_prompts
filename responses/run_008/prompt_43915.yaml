answer: |-
  **Project Title:** The Structure of Suffering: Commensurability vs. Magnitude in Lexical Negative Utilitarianism

  **Project Description**

  Standard utilitarian frameworks treat value as a single cardinal scale. Pain and pleasure are assigned magnitudes, summed, and compared. This works cleanly until severity spikes. My dissertation argues that this cardinal model fails to capture the phenomenology of severe suffering, leading to formal errors in negative utilitarian axiology. Specifically, I challenge the standard formalization of the lexical threshold. Current lexical views treat the threshold as a point of infinite disvalue on a cardinal scale. This invites standard aggregation objections: if the disvalue is infinite, any threshold pain outweighs any amount of pleasure, leading to counterintuitive results regarding trivial pains or the "benevolent world-exploder" objection (where painless annihilation is mandated to prevent future suffering).

  I propose an alternative: the lexical threshold is not a claim about magnitude, but about commensurability. On this reading, severe pain and pleasure do not share a value structure that allows for trade-offs. They are ordinally comparable (one is worse than the other) but not compensatorily comparable (one cannot cancel out the other). This distinguishes the view from both total utilitarianism (which allows all trade-offs) and standard lexical negative utilitarianism (which relies on infinite magnitudes). If successful, this structural account preserves the intuition that some suffering cannot be "worth it" without requiring infinite disvalues that break the calculus. It also offers a potential path to defusing the benevolent world-exploder objection: if badness is not a magnitude to be zeroed out, removing the subject does not necessarily maximize value in the way standard negative utilitarianism implies.

  **Methodology and First-Person Data**

  The hypothesis arises from a phenomenological discrepancy observed during six years of chronic migraine. Cardinal pain ratings (e.g., 3/10 vs. 7/10) prove unstable week-to-week; the intervals feel arbitrary. However, the lexical judgment—that no amount of ordinary pleasure compensates for a severe flare—remains stable across mood states and pain levels. The dissertation uses this discrepancy as a case study for the structure of value judgment.

  I acknowledge the methodological risks of auto-phenomenology. To avoid mere anecdote, I will treat my pain diary not as evidence for the metaphysics of pain, but as data regarding the stability of comparative judgments. The process will be disciplined via pre-registered judgment prompts. During flare and non-flare states, I will record responses to structured comparison tasks (e.g., "Would you accept this current state in exchange for [specific duration/intensity of pleasure]?"). The goal is not to prove the pain is real, but to test whether lexical refusals to trade persist even when cardinal estimations fluctuate. If lexical judgments remain stable while cardinal ratings drift, this supports the commensurability model over the magnitude model. I will supplement this with a analysis of existing philosophical arguments regarding lexicality to ensure the phenomenological data constrains the theory rather than driving it unchecked.

  **Timeline**

  *   **Months 1–3:** Finalize literature review on lexical utilitarianism and incommensurability. Draft and pre-register the structured judgment prompts for the pain diary. Establish baseline data collection protocols.
  *   **Months 4–8:** Active data collection phase. Record pain states and complete structured comparison prompts weekly. Begin drafting the core argument distinguishing magnitude thresholds from structural incommensurability.
  *   **Months 9–10:** Analyze judgment stability. Test the commensurability model against standard objections (aggregation, benevolent world-exploder). Determine if the structural view collapses back into a magnitude view under pressure.
  *   **Months 11–12:** Finalize dissertation chapters. Integrate the healthcare allocation implications. Prepare for defense.

  **Success and Failure Conditions**

  A successful outcome establishes that a commensurability-based lexical threshold avoids the aggregation objections that sink magnitude-based views. It would demonstrate that severe pain occupies a different normative category than pleasure, making trade-offs category errors rather than calculation errors.

  However, I must account for failure. It is possible that the commensurability reading collapses back into a magnitude claim upon formalization (i.e., treating "different structures" simply reintroduces infinite weights). If this happens, the project still yields a result: a proof that lexical negative utilitarianism cannot escape cardinal formalization without losing its normative force. Another risk is that the first-person data shows lexical judgments are actually unstable under reflection. If my own willingness to trade fluctuates significantly when prompted rigorously, the phenomenological foundation weakens. In that case, the dissertation would pivot to arguing why lexical intuitions are unreliable, still contributing to the debate by undermining the motivation for lexical views.

  **Broader Significance**

  This is not purely abstract axiology. The structure of value determines how we prioritize resource allocation. If suffering and pleasure are cardinally commensurable, healthcare budgets should maximize aggregate well-being, potentially trading severe pain relief for many minor benefits. If they are incommensurable, severe pain relief deserves lexical priority, similar to arguments for catastrophic risk mitigation. Clarifying whether the threshold is about magnitude or structure directly informs policy debates on pain management funding and triage protocols. A structural account justifies prioritizing severe suffering without requiring the claim that such suffering is infinitely bad, offering a more defensible foundation for healthcare ethics.
