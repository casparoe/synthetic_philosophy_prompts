  ok so I'm applying for a year-long dissertation fellowship and I need a two-page-ish proposal written from my mess of notes. quick background so this makes sense: I've had chronic migraines for about six years now, I'm a philosophy grad student, and I've noticed something that I think is actually philosophically interesting and not just me being gloomy on flare days. when I rate my pain 3/10 vs 7/10 the numbers feel basically made up — I couldn't defend those cardinal comparisons week to week. but the claim that no pleasure I've ever had could "make up for" a certain kind of headache-day feels completely stable, even on good days, even when I'm basically happy. so I keep gravitating toward lexical threshold negative utilitarianism (the view that some pains can't be outweighed by any amount of pleasure, only relieved or traded off against worse pains), but I think everyone formalizes the threshold wrong. they treat it as a point on a cardinal scale, which makes it look arbitrary and instantly exposes it to the "one second of threshold-level pain vs a billion blissful lives?" objection and the continuous-improvement argument. my half-formed thought: maybe the right way to read "no amount of pleasure compensates" is not as a claim about infinite disvalue but as a claim about ordering — compensatory tradeoffs only make sense between values that share a structure, and pleasure and severe pain don't, sort of like you can't add a distance to a temperature even though both are numbers. the threshold would then be about which comparisons are even available, not about how big one side is. if that works it might also let me answer the benevolent world-exploder objection (the classic reductio where negative utilitarianism endorses painlessly annihilating everyone) without bolting on an ad hoc extra rule — maybe non-existence can be non-bad in a way that's compatible with severe pain being non-compensable, since if the badness isn't a magnitude there's nothing that needs to be