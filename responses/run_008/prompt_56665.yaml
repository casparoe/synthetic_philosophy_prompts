answer: |-
  Dear friend,

  You have hit on something that keeps a lot of us up at night, and I want to validate your intuition right out of the gate because it is far more insightful than the standard textbook summaries give it credit for. The feeling that everyone is talking past each other is not just a symptom of your fatigue; it is a genuine feature of the landscape. However, while your diagnosis that one side is doing metaphysics and the other methodology is a very useful heuristic for navigating the literature, I think if we press on it, we find that the dispute is slightly more tangled than a simple category error. It is not merely a verbal dispute, but it is also not a straightforward substantive fight about the same single object. Instead, what is happening is a clash over what work the concept of causation is supposed to do for us, and that functional disagreement masquerades as a metaphysical one.

  To take your theory apart gently, we have to look closer at what the interventionists, particularly Woodward, actually claim. You suggest they are doing methodology, building a toolkit for scientists, and while Pearl certainly fits that description comfortably, Woodward explicitly resists the idea that he is only offering an epistemic guide. He argues that the meaning of causal claims is inherently tied to manipulation. When he says X causes Y, he is not just saying we can find this out by wiggling X; he is saying that what it *is* for X to cause Y is for there to be an invariant relationship under intervention. That is a metaphysical claim, or at least a semantic one, not merely a methodological tip. He is trying to tell you what truth conditions a causal statement must satisfy, and he insists those conditions involve hypothetical manipulations. So, if both Lewis and Woodward are offering truth conditions for causal claims, they are technically playing the same game, which suggests the disagreement is substantive. They are both trying to define the extension of the word cause, and they are drawing the boundaries in different places.

  However, this is where your intuition about them doing different jobs starts to look very strong again. The reason Woodward leans so hard into manipulation is that he thinks the metaphysical project Lewis was engaged in is a dead end. Lewis was trying to reduce causation to something more fundamental, usually counterfactual dependence grounded in similarity between possible worlds. Woodward and the interventionists argue that you cannot analyze causation without already presupposing causal notions, because to evaluate a counterfactual like if A had not happened, you already need to know which other things stay fixed and which change, and that requires causal knowledge. So the interventionists are not just doing methodology; they are doing what some call a metaphysics of science, which is distinct from the armchair metaphysics Lewis was doing. They are saying the concept of causation is only intelligible within the context of agents who can manipulate variables. If you accept that, then the Lewisian project isn't just wrong; it is asking a question that doesn't make sense outside of a specific human perspective. This shifts the debate from who has the right definition to who has the right purpose for the definition.

  The overlap you noticed regarding counterfactuals is the crux of the confusion. It is not actually Counterfactual Theory versus Interventionist Theory. It is Similarity-Based Counterfactuals versus Interventionist Counterfactuals. The interventionists agree that causation involves counterfactuals, but they argue that the only counterfactuals that matter are those defined by structural equations representing interventions. When Lewis talks about possible worlds, he is asking which world is most similar to ours. When Woodward talks about interventions, he is asking which variables are held fixed by the structure of the system. This is why they talk past each other. When a Lewisian brings up a preemption case to wreck the counterfactual account, the interventionist says that is because you are using the wrong counterfactuals, the ones based on similarity rather than structural independence. When a Lewisian brings up the gravitational constant to wreck the interventionist account, the interventionist says we can still model that structurally even if we cannot physically wiggle gravity, or they concede that causation might not apply there in the same way. They are optimizing for different things: Lewis wants a unified theory of dependence that covers everything from bills breaking windows to laws of nature, while Woodward wants a theory that aligns with how scientists actually explain and control phenomena.

  So, is it a verbal dispute? I think the most accurate diagnosis is that it is a dispute about conceptual engineering rather than conceptual analysis. They are not digging for the same hidden essence. Lewis is trying to capture our folk intuitions about dependence and fit them into a Humean worldview where there are no necessary connections. Woodward is trying to refine the concept of causation so it becomes a useful tool for scientific explanation, even if that means sacrificing some folk intuitions about cases like preemption or overdetermination. If you view it this way, the stalemate makes perfect sense. Neither side can convert the other because they are not trying to solve the same puzzle. The Lewisian wants to know what causation is in a world without agents. The Interventionist wants to know what causation is for agents in a world with structure. When they argue, the Lewisian says you are changing the subject, and the Interventionist says you are studying a ghost.

  However, I must be upfront about where my own diagnosis here might be wrong, because I am privileging the pragmatic reading perhaps too much. There is a genuine substantive fight remaining if we look at specific cases where both theories claim to apply but yield different verdicts. If Lewis and Woodward both agree that a specific scenario involves agents, variables, and standard physical interactions, but Lewis says there is causation while Woodward says there is not, or vice versa, then they are not just doing different projects. They are making incompatible claims about the world. For example, in cases of late preemption, Lewis adjusted his theory to handle them, but interventionists claim their handle is cleaner. If it turns out that one of these accounts consistently aligns with scientific practice while the other consistently diverges, then the interventionist claim that their theory is the correct one for science becomes a substantive empirical claim about how science works, not just a methodological preference. If Woodward is right that scientists only care about invariant relationships, then Lewis is substantively wrong about what scientists mean when they say cause.

  What would change my mind about the verbal dispute diagnosis is if one side successfully reduces the other. If the interventionists can show that Lewisian similarity counterfactuals are just a special, messy case of structural interventions, then the debate collapses into the interventionist favor substantively. Conversely, if a Lewisian can show that interventionist structures presuppose a prior notion of causation that can only be grounded in similarity counterfactuals, then the interventionists are just doing applied Lewisian metaphysics. Until one side achieves that reduction, we are left with pluralism. But here is the specific case that keeps me up: the unmanipulable variables you mentioned, like sex or the gravitational constant. If Woodward insists these can be causal only insofar as we can model them as if they were manipulable, he is making a metaphysical claim that causation is essentially tied to hypothetical manipulation. If Lewis says causation exists there regardless of hypothetical agents, he is making a metaphysical claim that causation is mind-independent. That is not a verbal dispute. That is a clash over whether the universe contains causal powers that exist independently of any possible experimenter. If you can find a case where the interventionist says there is no causation because no intervention is possible even in principle, and the counterfactualist says there is causation because the dependence holds, then you have a real, substantive disagreement about the fabric of reality, not just vocabulary.

  Ultimately, I think you are right that the stamina of the debate comes from the fact that they are serving different masters. Lewis serves the metaphysician who wants a tidy ontology. Woodward serves the scientist who wants a reliable explanation. But do not let that convince you the fight is entirely verbal. At the boundaries, where science meets ontology, they make conflicting claims about whether causation is a feature of the world or a feature of our interaction with the world. My diagnosis might be wrong if it turns out that the interventionists are willing to retreat to pure instrumentalism, admitting they don't care what causation is, only how to find it. If Woodward conceded that, your theory would be perfectly correct. But as long as he insists that manipulability is what causation *is*, the fight remains real, even if the combatants are standing on different sides of a fence they refuse to acknowledge. I hope this helps untangle the knot somewhat, or at least gives you a better map of where the traps are buried.
