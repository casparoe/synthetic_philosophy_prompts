          *   `out_of_scope`: Array of strings.
      *   **Constraints:** No literature citations, no readings, stand on phenomena alone.

  2.  **Drafting Desiderata:**
      *   Need to cover the Browning-Goldhagen terrain but generalize it.
      *   Need to address the forensic requirement (duress vs. conviction).
      *   Need to address comparative requirement (Holocaust vs. Rwanda vs. USSR etc.).
      *   Need a non-standard desideratum (e.g., explaining the *mode* of participation or post-war reintegration).
      *   *Idea 1: Cross-Case Portability.* Theory must explain participation in both industrialized secrecy (Holocaust) and public communal violence (Rwanda). Status: Non-negotiable (given the prompt's purpose).
      *   *Idea 2: Within-Unit Variation.* Theory must explain why some participated eagerly, some reluctantly, and some refused (e.g., Battalion 101 at Józefów). Status: Non-negotiable (essential for forensic distinction).
      *   *Idea 3: Role Differentiation.* Theory must explain not just *that* someone killed, but *how* (shooter vs. bureaucrat vs. informant). Status: Non-negotiable (forensic/historical precision).
      *   *Idea 4: Ideological Specificity.* Theory must account for the specific content of hatred (e.g., antisemitism vs. Hutu Power). Status: Camp-preference (Goldhagen camp insists, Browning camp downplays).
      *   *Idea 5: Post-War Normalcy.* Theory must be consistent with perpetrators returning to ordinary life without permanent psychological breakdown or continued violence. Status: Non-negotiable (phenomenological fact often ignored).
      *   *Idea 6: Temporal Dynamics.* Theory must explain escalation or desistance over time (e.g., sobering up vs. hardening). Status: Negotiable.

