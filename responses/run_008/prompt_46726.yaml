  ### Position Table

  | Leaf Name | One-Line Statement | Representative Philosopher | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **Global Reductionism** | Justification comes from induction that testimony *in general* is reliable. | David Hume | Hard to justify belief in specialized fields (e.g., history, science) where you can't check general reliability yourself. |
  | **Personal Reductionism** | Justification requires positive evidence about *this specific speaker's* honesty. | Various (Strict Empiricists) | Leads to skepticism; we rarely have time to background-check every stranger before believing them. |
  | **Local Reductionism** | Justification requires only that there are no *defeaters* (signs of deceit) in this context. | Elizabeth Fricker | Still places a burden on the listener to monitor for lies; implies we are justified in ignoring testimony if we're too tired to monitor. |
  | **Acceptance Principle** | We have an *a priori* default right to believe others unless proven wrong. | Tyler Burge | Makes us epistemically vulnerable; implies a gullible toddler and a careful scientist have the same default warrant. |
  | **Assurance View** | Justification comes from the speaker *taking responsibility* (giving an assurance) to the listener. | Richard Moran | Struggles to explain how we learn from speakers who can't take responsibility (e.g., children, animals, or unintentional informants). |

  ### Logical Space Analysis (Instructor Notes)

  **1. Unoccupied/Unattractive Spaces:**
  *   **Assurance for Toddlers:** The path leading to *Assurance View* but answering "Yes" to the Toddler question (that they *do* give knowledge) is theoretically unstable. Assurance requires normative agency (the ability to promise/owe truth). If a student lands here, they hold a view that requires children to undertake commitments they are cognitively incapable of making.
  *   **Global Reductionism + No General Evidence:** If a student selects *Global Reductionism* but admits they have no evidence that testimony is generally reliable, they occupy a skeptical gap. Humeans must explain where the inductive base comes from without circularity.

  **2. Potential Overlaps (Flagged for Discussion):**
  *   **Global vs. Personal:** In practice, these often blur. Hume (Global) is sometimes read as requiring personal monitoring. The tree separates them by *scope* of evidence (general practice vs. specific person), but students may feel these are the same view.
  *   **Local vs. Acceptance:** Local Reductionism (no defeaters) and Acceptance (default right unless defeaters) produce the same *results* in most cases. The difference is purely theoretical: is the warrant *earned* by the absence of red flags (Local), or *given* by default and only lost by red flags (Acceptance)? The Toddler case is the best wedge to separate them.

  **3. Formatting Note:**
  *   This JSON structure is designed to be parsed by a simple script or read linearly. The `null` question values indicate terminal leaves.
  *   The table is designed to fit the bottom half of a double-sided page when printed with standard margins.

  ### Decision Tree Logic (Text Version for Handout)

  1.  **Start:** Stranger at Bus Stop. Need independent reasons to believe?
      *   **YES** → Go to **Historian Case**.
          *   Evidence that *testimony generally* works? → **Global Reductionism**.
          *   Evidence about *this case*? → Go to **Specific Evidence**.
              *   Need positive proof of honesty? → **Personal Reductionism**.
              *   Just need no signs of lying? → **Local Reductionism**.
      *   **NO** → Go to **Toddler Case**.
          *   Can believe even if they can't promise truth? → **Acceptance Principle**.
          *   Must be able to take responsibility? → **Assurance View**.

