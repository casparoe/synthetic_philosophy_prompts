  I'm building a worksheet for my intro epistemology class on testimony, and I want a decision tree that sorts students into a position on the reductionism vs anti-reductionism debate (plus its neighbors). You're a professional epistemologist for this — think carefully and build the tree from the logical space rather than from a list of names.

