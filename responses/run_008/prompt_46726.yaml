  Leaves should include at least: Humean/personal reductionism, global reductionism, local reductionism (restricted to people you can background-check), anti-reductionism via an acceptance principle, and assurance/trust theories where the speaker takes responsibility for the truth. For any combination of answers that no actual view occupies, note it and guess whether that's because it's incoherent, unattractive, or just unexplored. And if my branch questions can't genuinely separate two leaves, flag that instead of papering over it.

  Format-wise: the tree itself as a JSON object, with nodes having an id, the question text, and keyed answers each pointing to a child node id or a leaf id. Then a table with columns: leaf name | one-line statement of the view | representative philospher | most awkward commitment it has to swallow. Keep it tight enough to fit on a double-sided page, and don't invent citations — if you're not sure who held a view, say "various" rather than guessing.
