answer: |-
  1. Advance directives retain binding authority because they serve as anchor points for the patient's narrative gravity, ensuring that the abstract self constructed over a lifetime is not retroactively dissolved by later cognitive decline.
  2. The committee must adopt narrative continuity rather than biological continuity as the primary marker of identity, meaning the directive applies unless the patient's story has fractured so completely that a new, incompatible center of gravity has emerged.
  3. Because narrative centers generate normative interests unlike mathematical centers of mass, the committee cannot simply weigh current happiness but must honor the past self's values as constitutive elements of the person's moral existence.
  4. The daughter's claim that the patient is a stranger recognizes a genuine narrative break, but it fails ethically because our duty is to the integrity of the extended life story rather than the comfort of the current conscious episode.
  5. We must reject the colleague's claim that identity talk is void, since treating the patient as a single narrating center is precisely what makes behavior intelligible and prevents the self from becoming morally disposable when circumstances change.
