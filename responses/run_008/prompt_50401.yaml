  My credence that a visitor who can comply at negligible cost to themselves has a genuine pro tanto moral obligation to comply with local conventions of this kind is about 0.75. My partner's is about 0.25; he thinks violations are at most a etiquette failure — impolite, perhaps mildly uncooperative, but not the kind of thing one has an obligation to avoid. Give me your own number, but what I really want is the decomposition. At minimum I'd expect terms for: (a) the probability that conventions of this kind generate moral obligations even for full participants, rather than being merely conventional in the pejorative sense; (b) if they do, which ground carries the weight — the Lewis-style idea that a convention is a solution to a coordination problem and defection imposes costs on everyone, or a reliance-based idea that locals have organized their lives around the expectation (servers accepting low base wages on the expectation of tips), or a fairness-based prohibition on free-riding on everyone else's compliance; (c) the probability that visitors fall inside whatever generates the obligation at all, given that they didn't participate in creating the convention and won't be part of sustaining it; (d) whether the three cases come apart — whether the tipping case, where the convention props up an entire wage structure, is morally different from the queueing case, where the visitor's noncompliance is partly involuntary and partly invisible to them; and (e) whether there is a ceiling on convention-dependent obligations when complying means participating in something that looks wrong by your own home lights — say a queueing norm that systematically privileges certain groups, or a gratuity custom tied to a status hierarchy you reject. Add or restructure terms as you see fit, but give each one a rough probability and a one-line justification, show how they combine to your bottom line, and identify the single term your number is most sensitive to. Finally, tell me whether my