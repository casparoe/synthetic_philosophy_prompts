          *   B: Mentions dissenters existed but doesn't explain why that breaks the defence logically.
          *   Fumble: Just listing historical facts without logical impact.
      *   *Point 3: The Principled Criterion (The Key Constraint).*
          *   A: Articulates a specific condition (e.g., "epistemic accessibility of dissent" or "reasonable availability of counter-arguments").
