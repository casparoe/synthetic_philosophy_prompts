      *   *Requirements:* Explicitly list the three required elements (a, b, c) from the prompt to ensure students address them.
      *   *Tone:* Academic, clear, directive.

  3.  **Drafting the Model Answer:**

      *   *Stance:* Needs to be decisive. I'll argue that the "man of his time" defence fails because it conflates explanation with justification, and specifically fails the "dissent availability" test.
      *   *Structure:*
          1.  Intro: Define the defence and state the thesis (it fails).
          2.  Point 1 (Explanation vs. Justification): Context explains *why* he thought it, not *that* it was right.
          3.  Point 2 (The Dissent Test): Address the "too much/too little" problem. If shared belief excuses, then dissenters are irrelevant. But dissenters *were* there (anti-eugenics). Therefore, the norm wasn't inescapable.
          4.  Point 3 (Future/Consistency): Apply to future judging us (animal farming). If we claim we couldn't know better, we are lying. We have dissenters now (vegans/animal rights). Consistency demands we accept future blame if we ignore them.
          5.  Conclusion: Grant's name should come down (or at least the defence rejected) because moral negligence is still negligence.
      *   *Word Count Check:* Keep it tight. ~650 words.
      *   *Philosophical Depth:* Ensure the "principled criterion" (availability of moral knowledge) is clear.

  4.  **Drafting the Marking Scheme:**

      *   *Total:* 20 marks (5 criteria x 4 marks).
