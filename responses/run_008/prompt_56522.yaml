answer: |-
  ### 1. Exam Question

  **Question 4: Moral Judgment and Historical Context (75 Minutes)**

  **Scenario:**
  In 1915, the philanthropist Havelock Grant donated the funds to build the university's main hall. Grant was a complex figure: he campaigned vigorously for old-age pensions, prison reform, and women's suffrage. However, he also publicly endorsed the compulsory sterilisation of those he termed 'feeble-minded' and lobbied for strict exclusionary laws against non-white immigrants. Today, a committee is deciding whether to remove Grant's name from the building. A committee member argues that Grant should be judged as a 'man of his time,' noting that eugenics and racial exclusionism were widely accepted by elites in the 1910s.

  **Task:**
  Write an essay evaluating the 'man of his time' defence in this case. Your answer must address the following three points:

  1.  **Explanation vs. Justification:** Distinguish between using historical context to *explain* Grant's beliefs and using it to *excuse* or *justify* them. Does the prevalence of a belief in 1910s society convert an explanation into a justification?
  2.  **The Dissent Problem:** Confront the 'too much/too little' objection. If shared prevailing norms excuse moral failure, does the existence of contemporaneous dissenters (e.g., anti-eugenics activists in 1915) negate that excuse? Why exactly does the presence of dissent matter for the validity of the defence?
  3.  **Future Consistency:** Apply your verdict to a forward-looking case. Assume our grandchildren judge us for participating in industrial animal farming, a practice currently mainstream but opposed by a vocal minority. If you accept the 'man of his time' defence for Grant, are you logically committed to accepting a 'woman of her time' defence for yourself? Construct a principled criterion for when prevailing norms mitigate blame, and test whether you meet it.

  ***

  ### 2. Model Answer

  The 'man of his time' defence fails in the case of Havelock Grant because it conflates sociological explanation with moral justification. To understand why Grant supported eugenics is to understand the scientific and social prejudices of the 1910s; this is an explanatory project. To argue he is therefore *blameless* is a justificatory project. Context explains the causal origin of a belief, but it does not determine its moral truth. If the prevalence of a belief justified it, morality would be merely democratic, and moral progress would be impossible by definition. Therefore, the fact that elites shared Grant's views explains his error but does not excuse it.

  This conflation leads to the 'too much/too little' dilemma. The defence argues Grant is excused because his views were standard. However, if standard views excuse, then the existence of dissenters is irrelevant. Yet, we intuitively feel that the existence of 1910s anti-eugenics activists *does* matter. Why? Because their existence proves that the moral truth was epistemically accessible. If a moral argument was available to Grant's contemporaries, Grant's failure to engage with it constitutes negligence, not inevitability. The defence proves 'too little' because it cannot account for why we praise the dissenters; if the norm excuses everyone, the dissenters were merely eccentric, not courageous. It proves 'too much' because it would excuse any atrocity provided the perpetrator was sufficiently conformist.

  Therefore, a valid defence requires a principled criterion: **the reasonable availability of counter-arguments.** Prevailing norms mitigate blame only when the moral error was inescapable due to a lack of accessible evidence or argumentation. In Grant's case, this criterion is not met. Anti-eugenics arguments and anti-racist perspectives existed in 1915. Grant selectively adopted progressive norms for suffrage while ignoring them for race and ability. This selectivity demonstrates that he was capable of moral reasoning but chose to limit its scope. He is culpable for moral negligence.

  Applying this to the future case of industrial animal farming reveals the stakes of consistency. Today, factory farming is mainstream, yet arguments regarding animal sentience and environmental cost are widely available. If I claim future generations should excuse me because 'everyone did it,' I am claiming the moral truth was inaccessible. But it is not. Vegan and animal welfare arguments are as accessible to me as anti-eugenics arguments were to Grant.

  If I accept the defence for Grant, I must accept it for myself only if I can show that the counter-arguments were unavailable to me. They are not. Therefore, consistency demands I reject the defence for Grant to maintain the integrity of my own moral standing. To excuse Grant is to surrender the right to claim moral progress for myself. We must judge Grant harshly not to indulge in self-righteousness, but to acknowledge that moral responsibility survives social pressure. The building's name should be removed, not to erase history, but to affirm that the 'man of his time' defence is a surrender of moral agency. We are all, ultimately, people of our own time, and we are all responsible for listening to the dissenters among us.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks (5 Criteria x 4 Marks)**

  | Criterion | A Range (3.5–4 marks) | B Range (2.5–3 marks) | Typical Fumble |
  | :--- | :--- | :--- | :--- |
  | **1. Explanation vs. Justification** | Clearly distinguishes causal explanation (why he thought it) from moral justification (why it was right). Explicitly denies that prevalence equals truth. | Identifies the difference but wavers on whether prevalence offers *some* justification. | Equates understanding the context with forgiving the action. |
  | **2. The Dissent Problem** | Explains *why* dissenters break the defence: they make the moral truth accessible, turning error into negligence. | Notes dissenters existed but treats it as a historical fact rather than a logical defeater for the excuse. | Lists historical dissenters without explaining their philosophical relevance to blame. |
  | **3. Principled Criterion (Key Discriminator)** | **Constructs a specific test** (e.g., 'epistemic accessibility of counter-arguments') to determine when norms mitigate blame. | Appeals vaguely to 'fairness' or 'limited knowledge' without defining the limit of 'could have known.' | Says "context matters" without defining *how much* context is required to excuse. |
  | **4. Forward-Looking Application** | Applies the *specific criterion* from Point 3 to the animal farming case. Shows logical consistency between verdicts on Grant and self. | Makes the comparison to animal farming but fails to apply the specific epistemic criterion derived earlier. | Treats the future case as a separate topic rather than a consistency check on the Grant verdict. |
  | **5. Resolution/Verdict** | Offers a committed conclusion on the building name based on the argument (e.g., remove name/defence fails). | Hedges or concludes that "both sides have merit" despite the argument built. | Fails to offer a concrete verdict on the scenario provided. |
