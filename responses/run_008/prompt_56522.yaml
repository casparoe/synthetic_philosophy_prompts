              *   Crucial Constraint: The A/B distinction must turn on articulating a *principled criterion* for when prevailing norms mitigate blame (e.g., visibility/availability of moral argument), not just saying "context matters."
              *   Include a note on typical student fumbles for each point.

  2.  **Drafting the Exam Question:**

      *   *Scenario:* Needs to be concise but detailed enough to support the arguments. Havelock Grant, 1910s. Good: pensions, prisons, suffrage. Bad: eugenics, racial exclusion.
