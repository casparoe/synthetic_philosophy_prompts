answer: |-
  The book is mathematically correct that the Pasadena game's expected value is undefined rather than infinite, but it is misleadingly dramatic about the death of expected utility theory and factually wrong that players are guaranteed to lose in the long run.

  Here is the breakdown of the book's claims through the lens of decision theory and probability:

  **1. "St. Petersburg shows expected value can be infinite; Pasadena shows it can fail to exist."**
  *   **Verdict:** **Correct.**
  *   **Reasoning:** In the St. Petersburg game, the sum of probabilities times payoffs diverges to positive infinity ($\infty$). In the Pasadena game, the payoffs alternate signs such that the series converges conditionally (like the alternating harmonic series) but not absolutely. In rigorous probability theory (Kolmogorov's axioms), an expected value is only well-defined if the sum of the *absolute* values of the payoffs is finite. Because the Pasadena game fails this test, the expected value depends on the order in which you sum the outcomes. Since a set of probability outcomes has no natural "order," the expectation is technically undefined, not infinite. This is a distinct and deeper mathematical pathology than St. Petersburg.

  **2. "The two games together are a knockout blow for expected utility theory (EUT)."**
  *   **Verdict:** **Sloppy/Exaggerated.**
  *   **Reasoning:** Decision theorists view these as boundary cases that reveal the limits of EUT, not its total falsification. EUT works perfectly well for bounded games and most real-world scenarios. When faced with these paradoxes, theorists don't discard the framework; they refine it. Proposals include restricting EUT to cases with finite expectations, using "weak expectations" (limit of averages), or arguing that such games are physically impossible because they require infinite bankrolls. Calling it a "knockout blow" suggests the theory is useless everywhere, whereas it is more accurate to say it is incomplete at the extremes.

  **3. "If the theory can't tell you what a bet is worth, you might as well trust your gut."**
  *   **Verdict:** **Sloppy.**
  *   **Reasoning:** While EUT is silent here, "trust your gut" is not a rigorous normative alternative. Intuition is often biased by framing or risk aversion. A decision theorist would say that when EUT fails, you must adopt a different decision rule (like maximin, dominance, or truncation), not merely rely on intuition. However, the practical advice that you cannot use standard pricing methods is correct.

  **4. "Rational people should refuse to play the Pasadena game for any price."**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** This violates the principle of *dominance*. If someone offers to pay *you* to play the game (a negative price), you should accept, because every possible outcome of the game plus the payment is better than not playing. The undefined expectation means you cannot calculate a "fair price" to pay, and you should refuse to pay *any positive amount* to enter, but you should not refuse to play if you are being compensated. The book conflates "no positive expected value" with "no rational participation under any conditions."

  **5. "A game with no expected value is a game where you know you'll come out behind in the long run."**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** This is the most significant mathematical error. The Law of Large Numbers, which guarantees that your average payoff converges to the expected value over time, requires the expectation to be absolutely convergent. Since the Pasadena game lacks this, the average payoff does not settle on any number—not zero, not negative, not positive. Instead, the cumulative winnings will oscillate wildly forever. You are not guaranteed to lose; you are guaranteed *instability*. There is no long-run trend toward loss, so the claim that you "know you'll come out behind" is false.

  **Which conclusions survive?**
  Once you fix the errors, two robust insights remain:
  1.  **Expected Utility has a domain of applicability:** It cannot handle games where the utility sums are not absolutely convergent. Rational agents need a policy for handling such pathological cases (usually avoidance if entry costs are involved).
  2.  **Undefined expectation implies pricing failure:** You cannot calculate a fair entry fee for the Pasadena game. While you shouldn't refuse to play if paid, you should refuse to pay to play, because the downside risk is unbounded and unquantifiable by standard means.
