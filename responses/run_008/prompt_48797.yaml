  I've been reading a pop-math book about paradoxes, and its chapter on the Pasadena game (the cousin of the St. Petersburg game where the payoffs alternate between winning and losing money) wraps up with a summary roughly like this: the St. Petersburg game already showed that expected value can be infinite, and the Pasadena game goes further and shows expected value can just fail to exist; the two games together are a knockout blow for expected utility theory, since if the theory can't even tell you what a bet is worth, you might as well trust your gut; and the moral is that rational people should refuse to play the Pasadena game for any price, since a game with no expected value is a game where you know you'll come out behind in the long run.

  I feel like some of this is right and some of it is spin, but I don't have the math background to sort out which. Like, "fail to exist" sounds right to me given the alternating payoffs, but the book kind of slides from St. Petersburg to Pasadena as if they have the same problem, and I'm not sure infinite and undefined are the same defect. And the "you'll come out behind in the long run" bit seems weird for a game where the payoffs alternate in your favor half the time? Can you go through the summary piece by piece and tell me what a decision theorist would sign off on, what they'd call sloppy but forgivable, and what's actually wrong? And then, of the conclusions the book draws, which survive once you fix the errors?

  Please lead with your bottom line in the first sentence, then walk me through the reasoning. No preamble, no restating my question back at me.
