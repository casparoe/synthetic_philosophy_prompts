          *   *Contextualism:* "Knows" is indexical. Standards shift based on the *speaker's* context (e.g., a skeptic raises the bar). Two speakers can disagree without contradiction.
          *   *Encroachment:* "Knows" is invariant (semantically), but the *facts* that determine truth conditions include the *subject's* practical situation. If the subject's stakes change, the truth value of "S knows p" changes, regardless of who says it.
          *   *Key Difference:* Who/What drives the shift? (Attributor's conversation vs. Subject's practical environment).

      *   **Part 2: Credence vs. Knowledge (The Double-Counting Worry):**
          *   This is the crux.
          *   *Standard Bayesian View:* Credence ($P$) tracks evidence. Utility ($U$) tracks stakes. Action depends on Expected Utility ($P \times U$).
          *   *If PE affects Credence:* You lower $P$ because $U$ (cost of error) is high. Then you calculate $P \times U$. You've penalized the cost twice. This *does* violate rationality constraints (Dutch Book, Proper Scoring Rules). A proper scoring rule rewards accuracy, not caution. Moving credence based on stakes reduces expected accuracy.
          *   *The Consensus:* Almost no proponent of PE argues that stakes change *credence*. They argue stakes change the *threshold* for knowledge.
          *   *Knowledge-Credence Gap:* PE proponents usually accept that you can have high credence (0.99) but lack knowledge because the threshold for knowledge has risen to 0.999 due to stakes.
          *   *Answer:* PE is a thesis about the *knowledge relation*, not the *credal state*.

      *   **Part 3: Are They Competing or Compatible?**
          *   They are competing explanations for the same data (bank cases, etc.).
