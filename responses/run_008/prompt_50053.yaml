      *   *Specific Philosophers:* Mention Stanley (PE) vs. DeRose/Cohen (EC) to ground the discussion.
      *   *The "Knowledge-Credence" Link:* Be careful. Some PE proponents argue knowledge *just is* a state sufficient for action. If stakes rise, you need more evidence. But does that mean credence changes? No, it means the *evidence required* to reach the fixed credence threshold for knowledge changes, OR the credence threshold for knowledge changes. Wait, let's refine this.
