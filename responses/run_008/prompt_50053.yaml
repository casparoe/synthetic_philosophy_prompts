answer: |-
  This is an exceptionally sharp set of questions. You have correctly identified the tension that keeps epistemologists up at night, and your friend's distinction is actually the standard philosophical carve-up, not just half-remembered course material.

  Here is the breakdown of the difference between Pragmatic Encroachment and Contextualism, how they relate to Bayesian credence, and why your "double-counting" worry is the main reason Encroachment theorists insist credences *don't* move with stakes.

  ### 1. Contextualism vs. Encroachment: Is it just PR?

  Your friend is right. The distinction is semantic and structural, not just sociological.

  **Epistemic Contextualism (EC)**
  *   **The Claim:** The word "knows" is indexical (like "I," "here," or "tall"). Its semantic content shifts depending on the **attributor's context** (the speaker).
  *   **The Mechanism:** In a casual conversation, the standards for "knows" are low. In a philosophy seminar discussing skepticism, the standards are high.
  *   **The Implication:** Two speakers can contradict each other ("He knows" vs. "He doesn't know") without actually disagreeing, because they are using different concepts.
  *   **The Driver:** Conversational context / Salience of error possibilities.

  **Pragmatic Encroachment (PE) / Interest-Relative Invariantism (IRI)**
  *   **The Claim:** The word "knows" is **invariant** (it means the same thing regardless of who says it). However, the *truth conditions* of knowledge include the **subject's practical stakes**.
  *   **The Mechanism:** Whether *you* know something depends on *your* situation. If you have low stakes, your evidence suffices for knowledge. If you have high stakes, that same evidence no longer suffices.
  *   **The Implication:** If I say "You know the bank is open" and you say "I don't know," one of us is objectively wrong. Usually, the subject (you) is the authority on your own stakes, so your denial trumps my attribution.
  *   **The Driver:** The subject's practical environment (cost of being wrong).

  **Are they compatible?**
  Technically, yes (a hybrid view is possible), but they are **competing explanations for the same data**. Both try to explain why "I know the bank is open" seems true on Friday morning (low stakes) but false on Friday afternoon (high stakes).
  *   **Contextualists** say: The *speaker's* standards shifted.
  *   **Encroachers** say: The *subject's* stakes shifted.
  Most philosophers choose one to avoid redundancy. If PE is true, you don't need EC to explain the bank cases, and vice versa.

  ### 2. The Double-Counting Worry: Credence vs. Knowledge

  This is the crux of your confusion. You asked: *If I'm a well-calibrated Bayesian, should my credence in "the Ford thing" literally go down when the stakes go up?*

  **The Short Answer:** **No.** Almost no proponent of Pragmatic Encroachment argues that stakes should alter your *credence* (degree of belief).

  **The Standard Encroachment View:**
  1.  **Credence ($P$)** is determined solely by **Evidence**. (Evidentialism about credence).
  2.  **Knowledge ($K$)** is determined by **Evidence + Stakes**.
  3.  **The Gap:** Knowledge requires a credence threshold. In low-stakes environments, the threshold is lower (e.g., $P > 0.9$). In high-stakes environments, the threshold is higher (e.g., $P > 0.999$).

  **How this avoids double-counting:**
  Imagine you have evidence $E$ regarding the Ford.
  *   **Low Stakes:** $P(\text{Ford} | E) = 0.95$. Threshold for $K = 0.9$. Result: **You Know.**
  *   **High Stakes:** $P(\text{Ford} | E) = 0.95$. Threshold for $K = 0.99$. Result: **You Don't Know.**

  Notice that $P$ stayed fixed at 0.95. The *practical stakes* did not change your estimate of reality; they changed the **normative status** of that estimate.

  If Encroachment theorists claimed that stakes lower your *credence* (e.g., to 0.8 because it's important), they would indeed be vulnerable to your Dutch Book/Scoring Rule objection. That view is sometimes called "Pragmatic Encroachment on Credence," and it is widely rejected by Bayesians and Encroachers alike.

  ### 3. Rationality Constraints: Would stakes-sensitive credence get you Dutch-Booked?

  You asked for bonus points on whether an agent whose credences move with stakes violates rationality constraints.

  **Yes, it violates standard Bayesian rationality.**

  **1. Proper Scoring Rules:**
  A proper scoring rule (like the Brier Score or Log Score) is designed to be minimized (or maximized) only when the agent reports their true subjective probability.
  *   If your true evidence supports $P=0.9$, but you report $P=0.8$ because the stakes are high, your expected score will be **worse** than if you reported 0.9.
  *   An agent who adjusts credence for stakes is effectively lying to the scoring rule to feel safer, but they are objectively less accurate.

  **2. Dutch Books:**
  While a single shift doesn't guarantee a Dutch Book, systematic stakes-sensitivity violates **Conditionalization**.
  *   Bayesian updating requires $P_{new}(H) = P_{old}(H | E)$.
  *   If $P_{new}(H)$ changes because *Utility* changed, not because *Evidence* changed, you have updated on something that isn't evidence.
  *   **The Pump:** Suppose you have a ticket worth \$100 if $p$ is true.
      *   **Scenario A (Low Stakes):** You assign $P(p) = 0.9$. You sell the ticket for \$89.
      *   **Scenario B (High Stakes):** The *only* difference is that you now care more about the money. If this lowers your credence to $0.8$, you might buy the ticket back for \$85 (since $0.8 \times 100 = 80$, wait, let's reverse).
      *   Better example: If stakes make you *cautious*, you might refuse a bet at $P=0.9$ that you accepted earlier at $P=0.9$. If your *credence* actually dropped, you should be willing to bet at odds reflecting the new credence. If your *action* changes but *credence* stays fixed, that's standard Decision Theory. If *credence* changes, you become vulnerable to money pumps where a bookie manipulates your stakes to make you buy/sell the same proposition at different prices without new information.

  **3. Calibration:**
  As you noted, calibration is about $P(\text{True} | \text{Assigned } P) \approx P$. If you assign $P=0.8$ to high-stakes claims that are actually true 95% of the time (because your evidence was good), you are **miscalibrated**. You are underconfident. A well-calibrated Bayesian *must* keep credence tethered to evidence frequencies, regardless of how much it hurts to be wrong.

  ### 4. So what is Encroachment actually claiming?

  If credence doesn't change, what work is Encroachment doing? It is a thesis about the **Knowledge-Action Principle**.

  Many Encroachers (like Fantl & McGrath) argue:
  > **S knows that p only if S is rational to act as if p.**

  *   **Low Stakes:** It is rational to act as if the bank is open on a small bet. Therefore, you can know it.
  *   **High Stakes:** It is *not* rational to act as if the bank is open when betting your life (you should go check again). Therefore, you cannot know it.

  The "Encroachment" is that practical rationality (stakes) encroaches on the epistemic status (knowledge). It does **not** mean practical rationality encroaches on the doxastic state (credence).

  ### Summary Checklist

  1.  **Is Encroachment about credence?** No. Standard PE keeps credence evidential. It makes *knowledge* stakes-sensitive.
  2.  **Does moving credence with stakes violate rationality?** Yes. It violates Proper Scoring Rules (reduces expected accuracy) and Conditionalization (updates on non-evidence).
  3.  **Is your friend right?** Yes. Contextualism = "Knows" changes meaning based on *speaker*. Encroachment = "Knows" keeps meaning but truth depends on *subject's stakes*.
  4.  **Is it just Contextualism with different PR?** No. They make different predictions about disagreement. In Contextualism, two speakers can both be right. In Encroachment, if the subject's stakes are high, "S knows" is false for *everyone* who says it.

  **The Bottom Line:**
  Your Bayesian instincts are correct. An ideal agent keeps credence fixed to evidence and handles stakes in the Utility function. Pragmatic Encroachment is not a challenge to Bayesian epistemology; it is a challenge to **Traditional Epistemology's** definition of Knowledge. It argues that "Knowledge" is not a pure epistemic state, but a hybrid state that serves as a bridge to action. It explains why we hesitate to attribute knowledge in high-stakes cases without forcing the agent to become irrational (miscalibrated) in their probability estimates.
