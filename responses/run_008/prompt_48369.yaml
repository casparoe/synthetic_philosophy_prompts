answer: |-
  **Joint Statement on the Possibility of Genuine Moral Dilemmas**

  **1. Grounds of agreement**

  1.  We agree that agents frequently encounter situations where moral demands appear to clash, creating significant practical uncertainty and psychological distress for the decision-maker.
  2.  We accept that distinguishing between not knowing which duty applies (epistemic uncertainty) and there being no single right action available (ontological impossibility) is conceptually coherent and vital for clear analysis.
  3.  We acknowledge that moral residue, such as guilt or remorse, is a genuine psychological phenomenon and not merely irrational self-indulgence or cognitive confusion on the part of the agent.
  4.  We concede that pro tanto duties often conflict without implying a genuine dilemma, as one duty may override the other in the final all-things-considered assessment.
  5.  We accept the principle that 'ought implies can' is plausible, though we disagree on its application to conflicting duties individually versus jointly.
  6.  We agree that agents are not always blameworthy for finding themselves in conflicted situations, particularly when the predicament is not self-inflicted through prior negligence.
  7.  We recognise that the language of obligation is used consistently in these cases by ordinary speakers, even if its metaphysical status is disputed between us.
  8.  We commit to analysing cases based on shared intuitions about fitting emotional responses rather than relying solely on abstract logical principles.

  **2. The disagreement, stated**

  | The question at issue | The impossibilist's formulation | The dilemmist's formulation |
  | :--- | :--- | :--- |
  | **Does 'ought implies can' apply to individual requirements?** | Yes. If an agent cannot do both A and B, it is false that they ought to do both; one requirement must cease to be an 'ought'. | Yes. An agent can ought to do A and ought to do B individually, even if they cannot do the conjunction of both acts. |
  | **Does agglomeration hold for all-things-considered oughts?** | Yes. If you ought to do A and ought to do B, logic dictates you ought to do (A and B); if you cannot, one premise is false. | No. In tragic cases, agglomeration fails; you ought to do A and ought to do B, but it is false that you ought to do (A and B). |
  | **Does doing wrong in a dilemma mean violating an obligation simpliciter?** | No. You violate a pro tanto obligation, but since you did the best available option, you did not violate an obligation simpliciter. | Yes. You violate an obligation simpliciter regarding the foregone option, which is why guilt is fitting despite choosing the best option. |

  **3. Cruxes**

  **The target of residue:** We must determine whether the guilt that survives doing the best one can is directed at the act itself (guilt proper) or merely at the circumstances (grief or agent-regret). If the emotion is strictly regret that the world is such that one could not save both, the impossibilist view stands. If the emotion includes a sense of personal transgression regarding the unchosen act, the dilemmist view is strengthened. Both parties accept that detailed phenomenological analysis of lorry driver cases, where an agent kills someone through no fault of their own, bears on this. If the driver feels guilt rather than mere regret, this suggests obligations were violated despite lack of blame.

  **The permissibility of randomisation:** We must ask whether the permissibility of flipping a coin in symmetric cases shows that both options were in fact permitted. If randomisation is rational, it suggests neither option is forbidden, supporting the impossibilist. If randomisation feels like abdicating responsibility because both options are required yet incompatible, this supports the dilemmist. Both parties agree to examine symmetric tragedy cases where outcomes are identical. If agents report feeling they did wrong regardless of the coin's outcome, this suggests residual obligation.

  **Consequentialist dilemmas:** We must establish whether genuine dilemmas can arise for a purely consequentialist agent, or only for agents with deontological constraints and role-based obligations. If a maximiser faces incommensurable outcomes where no single option produces the best state of affairs, a dilemma might exist without conflicting rules. Both parties accept that cases involving incommensurable values, such as choosing between saving a masterpiece or a person, bear on this. If no maximizing function can resolve the choice, the impossibilist must explain what makes one option obligatory.

  **4. Test cases and predictions**

  **Symmetric case (two drowning swimmers, single rope):**
  *Impossibilist:* No wrong is done; residue is regret, not guilt. 'I did wrong' is false. A coin flip is permissible and should be residue-free.
  *Dilemmist:* Wrong is done to the unsaved swimmer; guilt is fitting. 'I did wrong' is true regarding the unsaved. A coin flip is permissible but remains residue-laden.

  **Asymmetric case (promise kept versus life saved):**
  *Impossibilist:* Saving the life is the only obligation; the promise is overridden. 'I did wrong' is false. No residue regarding the promise is fitting.
  *Dilemmist:* Saving the life is required, but the promise remains binding. 'I did wrong' is true regarding the promise. Residue regarding the broken promise is fitting.

  **Self-imposed case (rescuer whose earlier negligence created the conflict):**
  *Impossibilist:* Residue is fitting but targets the past negligence, not the current choice. 'I did wrong' is true only of the past. A coin flip now does not absolve past guilt.
  *Dilemmist:* Residue targets both the past negligence and the current unavoidable violation. 'I did wrong' is true of both past and present. A coin flip does not absolve current guilt.

  **5. Verbal or genuine**

  Part of our dispute is verbal, centreing on the definition of 'ought'. If 'ought' implies all-things-considered permissibility, the impossibilist is correct by definition. If 'ought' tracks independent moral demands, the dilemmist is correct. However, the dispute is also substantive. We disagree on the rationality of guilt. If guilt is fitting in cases where the agent did the best they could, this implies a substantive fact about moral violations that logic alone cannot dissolve. We agree that settling the phenomenology of residue will determine whether this is merely a linguistic disagreement or a deep ethical divergence.

  **Signed:**

  ____________________ (The Impossibilist)

  ____________________ (The Dilemmist)
