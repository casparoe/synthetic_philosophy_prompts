      *   **Goal:** An in-class activity that creates an *experiential confrontation* with introspective failure. Students must generate data, mis-explain it, and discover the manipulation themselves.
      *   **Mechanics:** Roles (Subject, Auditor, Press Secretary), point-based payoff, hidden audit trail.
