      *   **Additional Ask 2:** Blunt assessment of what the activity *cannot* do (causes vs. phenomenology) and how to handle that objection in the debrief.

  2.  **Deconstruct the Philosophical Challenge:**
      *   Illusionism claims: Phenomenal properties (qualia) are introspective illusions. We think we have rich, ineffable, intrinsic experiences, but we don't. We have a "user interface" that *says* we do.
      *   Standard Psych Experiments (Choice Blindness, Nisbett & Wilson): Show we don't know *why* we chose X.
      *   The Gap: Not knowing *why* I chose the red jam is different from being wrong about *what it felt like* to see the red jam. Students will latch onto this. The activity needs to bridge this gap or at least set the stage for the argument that if the "why" is confabulated, the "what" might be too.
      *   Constraint: 15 students, 90 minutes. Needs to be tight.

  3.  **Designing the Activity: "The Press Secretary Protocol"**
      *   *Concept:* Adapt the "Choice Blindness" paradigm (Johansson et al.) but gamify it with a "Press Secretary" role to emphasize the *narrative construction* aspect of introspection.
      *   *Structure:*
          *   Phase 1: Decision Task (Subjects make quick aesthetic judgments).
          *   Phase 2: The Swap (Facilitator manipulates the outcome).
          *   Phase 3: The Briefing (Subjects justify the outcome as if it were their choice).
          *   Phase 4: The Audit (Class compares justification to original intent).
      *   *Roles:*
          *   Subjects (5 students): Make choices, get swapped, justify.
          *   Press Secretaries (5 students): Help Subjects craft the justification (simulating the subconscious narrative generator).
          *   Auditors (5 students): Track the original choice vs. stated reason, bet points on "Confabulation."
      *   *Payoff:* Points for Auditors who catch confabulation, points for Subjects/Secretaries who sound convincing (even if wrong). This creates an incentive to *believe* the lie.

  4.  **Refining the Mechanics for 90 Minutes:**
      *   15 students is small enough for everyone to have a role, but big enough that 5/5/5 split works.
      *   Need a task that is subjective but trackable. Face preferences or abstract art work best for choice blindness. Let's use abstract art pairs (easier to manipulate digitally or with cards).
      *   *The Twist:* To hit the "phenomenology" angle, ask them to describe the *experience* of the choice, not just the reason. "It felt resonant," "It popped out."
      *   *The Reveal:* Must happen *after* the justification to maximize the shock.

  5.  **Drafting the Timeline:**
      *   0-10: Setup & Theory Primer (brief).
      *   10-30: The Task (Choices + Swaps).
      *   30-50: The Briefing (Justifications).
      *   50-70: The Audit & Reveal.
      *   70-90: Debrief & Philosophical Mapping.

  6.  **Addressing the "Predictable Failures":**
      *   *Guessing the trick:* Philosophy students are paranoid. Need a cover story (e.g., "Testing aesthetic consistency").
      *   *Digging in:* If a student realizes they were swapped but insists they meant the second one (confabulation succeeds too well). Need to record the *initial* choice secretly.
      *   *Weak effects:* Some people notice swaps. Need a "detection check" before the reveal.

  7.  **Addressing the "Hard Problem" Objection (Causes vs. Qualia):**
      *   This is the crucial philosophical pivot. The activity shows *causal* ignorance (I don't know why I picked A). Illusionism claims *phenomenal* error (I don't actually feel 'redness').
