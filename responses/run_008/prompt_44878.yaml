answer: |-
  # Activity Design: The Press Secretary Protocol

  **Objective:** To induce a first-person experience of *confabulatory coherence*—where students generate authoritative-sounding introspective reports for decisions they did not actually make—thereby destabilizing the trustworthiness of the "inner witness."

  **Class Size:** 15 Students
  **Duration:** 90 Minutes
  **Materials:**
  *   Projector/Screen.
  *   Slide deck of 10 pairs of abstract images (Kandinsky-style or Rorschach-like; distinct but comparable in complexity).
  *   "Audit Sheets" (printed) for the Auditors.
  *   "Choice Cards" (small slips of paper) for the Agents.
  *   Whiteboard for scorekeeping ("Credibility Points").

  ---

  ## 1. Roles & Incentives (5 Minutes)

  Divide the class into three groups of five.

  1.  **The Agents (5 students):** Their task is to make aesthetic choices. They are told this is a test of "Aesthetic Consistency."
  2.  **The Spindoctors (5 students):** Paired 1-to-1 with Agents. Their task is to help the Agent articulate the *reasoning* behind the choice. They are told their goal is **Coherence**. They get points if the class votes that the justification sounded "internally consistent and confident," regardless of truth.
  3.  **The Auditors (5 students):** They hold the "Truth Keys." They receive a master sheet showing the Agents' *original* choices. Their task is to detect **Confabulation**. They get points if they correctly flag when an Agent is justifying a choice they *didn't* originally make.

  **The Payoff:** "Credibility Points" (CP) are tallied on the board.
  *   **Spindoctors:** +1 CP per justification rated "Highly Coherent" by a class vote.
  *   **Auditors:** +1 CP for every correct identification of a "Swap."
  *   **Agents:** +1 CP if the Auditors *fail* to detect the swap (i.e., if the illusion holds).
  *   *Note:* This creates a tension. Agents want to believe their own lie (to fool Auditors). Spindoctors want to make the lie sound good. Auditors want to catch the lie.

  ---

  ## 2. The Procedure (45 Minutes)

  ### Phase 1: The Selection (10 Minutes)
  *   **Action:** Agents sit at the front. Project Image Pair #1.
  *   **Instruction:** "Agent, choose the image you prefer. Mark it secretly on your Choice Card. Do not show anyone."
  *   **Collection:** Collect the Choice Cards immediately. Hand them to the Instructor (Facilitator).
  *   **Repeat:** Do this for 5 Image Pairs per Agent. (To save time, run all 5 Agents simultaneously on the same slide, or rotate quickly. *Recommendation:* Run them simultaneously to save time. All 5 mark cards for Slide 1, collect, Slide 2, collect, etc.)
  *   **Cover Story:** "We are establishing a baseline of your aesthetic preferences."

  ### Phase 2: The Manipulation (5 Minutes)
  *   **Action:** Facilitator steps away from the podium (ostensibly to tally scores).
  *   **The Swap:** In reality, you alter the record. For 3 of the 5 Agents, you will secretly swap their recorded preference.
      *   *Example:* Agent 1 chose Image A. You mark the Audit Sheet as if they chose Image B.
      *   *Crucial:* You do not tell the Agents. You tell the Auditors the *swapped* version is the truth.
      *   *Note:* Keep 2 Agents as "Controls" (no swap) to prevent total cynicism.
  *   **Instruction to Spindoctors:** "Your Agent will be told which image they 'chose' (the swapped one). Your job is to help them explain *why* they chose it. Focus on making the explanation sound deep, coherent, and authoritative. Do not worry about accuracy; worry about narrative strength."

  ### Phase 3: The Briefing (20 Minutes)
  *   **Action:** Bring Agent + Spindoctor pairs to the front one by one.
  *   **The Reveal (to Agent):** "Agent, according to our records, you chose Image B. Please explain to the class *why* you chose it. What was the experience like? Did it resonate? Was it the texture?"
  *   **The Collaboration:** The Spindoctor can interject to help: "Yes, exactly, I think what my Agent is saying is that the blue curve suggested motion..."
  *   **The Audit:** Auditors mark their sheets: *True Choice or Confabulation?*
  *   **The Vote:** After each pair, the rest of the class votes: "Coherent Narrative?" (Award CP to Spindoctor/Agent). Then Auditors reveal their bet (Award CP to Auditors if correct).

  ### Phase 4: The Confrontation (10 Minutes)
  *   **Action:** Return the original Choice Cards to the Agents.
  *   **The Reveal:** "Look at your original cards. Compare them to what you just defended."
  *   **Result:** The 3 swapped Agents will see they passionately defended a choice they did not make. The Auditors will see their success rate.
  *   **Silence:** Allow 60 seconds of silent processing. Do not explain yet. Let the discomfort land.

  ---

  ## 3. The Debrief: Mapping to Illusionism (30 Minutes)

  Do not lecture immediately. Ask the swapped Agents: *"When you were speaking, did it feel like you were lying?"* (Most will say no; it felt like remembering).

  Use this data to map the activity onto the philosophical framework.

  | Activity Moment | Illusionist Concept | Discussion Question |
  | :--- | :--- | :--- |
  | **The Urge to Justify** | **The User Interface:** The mind does not present 'null' when data is missing; it presents a plausible signal. | "Why didn't your mind just say 'I don't know'? Why did it generate a reason?" |
  | **The Spindoctor's Role** | **The Press Secretary:** Introspection is not a direct pipeline; it is a PR department writing a press release about the decision after the fact. | "The Spindoctor didn't know the truth, but helped write the story. Is your conscious voice the President or the Secretary?" |
  | **The Feeling of Certainty** | **Phenomenal Authority:** The *feeling* that you know why you acted is part of the interface, not proof of access. | "You felt certain you chose B. That feeling was the illusion. The feeling itself is the 'dashboard light,' not the engine." |
  | **The Auditors' Success** | **Heterophenomenology:** Third-person data (the card) overrides first-person reports (the justification). | "Dennett argues we must treat subjects as text-generators. Today, you were the text." |

  **Key Distinction to Draw:**
  Distinguish between **Causal Ignorance** (not knowing *why* you chose) and **Phenomenal Error** (being wrong about *what it felt like*).
  *   *Prompt:* "Did you feel a 'resonance' with Image B? Or did you just say you did?"
  *   *Illusionist Move:* "The illusionist claims the 'resonance' you felt *was* the confabulation. The interface lit up the 'Resonance' icon to guide future action, not to report a metaphysical quality."

  ---

  ## 4. Predictable Failure Modes & Fixes

  **1. The "Philosophy Student" Paranoia (Guessing the Trick)**
  *   **Risk:** Students suspect a swap immediately and perform "fake confabulation" or refuse to play along.
  *   **Fix:** The Cover Story must be robust. Frame Phase 1 as "Calibrating the Aesthetic Baseline." Frame Phase 3 as "Testing Articulation Speed." Do not mention "memory" or "truth" until the reveal. If a student explicitly asks, "Did you swap these?", deny it flatly until the reveal. ("We are testing consistency, not trickery.")
  *   **Contingency:** If too many guess, pivot: "Even if you suspect a trick, you still felt the pressure to generate a reason. That pressure is the phenomenon we are studying."

  **2. The "Dig In" Effect (Choice Blindness Failure)**
  *   **Risk:** An Agent notices the swap immediately and says, "No, I chose A." The demonstration fizzles.
  *   **Fix:** Use abstract art, not faces. Faces trigger stronger memory. Abstract art allows for ambiguity ("I guess I did choose the one with the blue...").
  *   **Contingency:** If an Agent catches the swap, praise them as a "High-Fidelity Monitor" but ask the Spindoctor: "If you *had* to justify the other one, could you?" This salvages the point about generative capacity.

  **3. Weak Anchoring (Auditors Don't Care)**
  *   **Risk:** Auditors treat it as a game and don't actually track the truth.
  *   **Fix:** Make the Audit Sheet require a specific reason. They can't just check a box; they must write *why* they think it's a confabulation (e.g., "Hesitation," "Vague terms"). This forces them to engage with the *texture* of the introspective report.

  ---

  ## 5. The Hard Limitation: Causal vs. Phenomenal

  **The Objection You Must Address:**
  A sharp student will say: *"This only shows we are wrong about the **causes** of our choices (why I picked B). It doesn't show we are wrong about the **phenomenology** (what it felt like to see B). I still actually saw the blue. Illusionism claims the 'blueness' itself is the illusion. This activity leaves qualia untouched."*

  **Why the Activity Cannot Fix This:**
  No behavioral experiment can disprove the existence of qualia directly. This activity demonstrates *introspective unreliability regarding narrative and causation*. It does not demonstrate that the sensory experience itself is gappy or non-existent.

  **How to Supply the Missing Link in Debrief:**
  You must make the **Inference to the Best Explanation** argument explicitly. Do not pretend the activity proved illusionism. Use the activity to make illusionism the *only viable option* for explaining the data.

  **Script for the Instructor:**
  > "You are right. This activity proves you confabulate *reasons*. It does not prove you confabulate *redness*. However, consider the mechanism required to generate the lie you just told.
  >
  > To lie about why you chose Image B, your mind had to construct a feeling of 'rightness' to support the statement. If your introspection were a faithful window, it would have shown you: 'Error: No preference data found.' Instead, it showed you: 'Strong Preference for B.'
  >
  > The Illusionist argument is this: If the 'feeling of knowing' is generated post-hoc to support action, why trust that the 'feeling of seeing' isn't generated the same way? The 'Press Secretary' doesn't just write the press release; she designs the dashboard. The 'resonance' you felt wasn't a report on the image; it was the interface signal telling you to speak.
  >
  > We are not claiming you didn't see anything. We are claiming that the *structure* of what you saw—unified, rich, authoritative—is the dashboard design, not the underlying code. Today, you saw the dashboard update in real-time to match a false state. That is the crack in the window."

  **Summary of the Limitation:**
  The activity demonstrates that **introspective access is constructive, not reproductive.** It leaves open whether the *construct* includes genuine qualia. You must argue that if the *access* is constructive, the *authority* of the qualia report is undermined, even if the qualia exist. The "User Illusion" is not that the screen is blank, but that the icons on the screen are not the files they represent.
