          *   **Auditors (5):** Hold the truth sheet.
      *   *Incentive:* Agents/Spindoctors get points for coherence ratings (by class vote). Auditors get points for predicting "Confabulation."

  9.  **Writing the Plan:**
      *   *Title:* The Press Secretary Protocol.
      *   *Materials:* Projector, slides of abstract images, score sheets.
      *   *Timeline:* Strict minute-by-minute.
