answer: |-
  Here is an audit of the consistency of your five views, ranked by the severity of the tensions identified.

  ### Compatible Pair: (2) and (4)

  **Status:** **Compatible.**
  These two views describe the technical implementation of Attainable Utility Preservation (AUP) consistently. View (2) describes the *object* of the penalty (change in attainable utility for an arbitrary goal set), and View (4) describes the *mathematical shape* of that penalty (symmetric/absolute difference). Standard AUP implementations penalize $|AU_{after} - AU_{before}|$, which satisfies both the description of penalizing "change" (2) and the requirement for symmetry regarding option increase/decrease (4). There is no technical contradiction here; (4) is simply the specific operationalization of the general class described in (2).

  ---

  ### Tension 1: The Corrigibility Reduction Claim
  **Pair:** **(5) vs. Consensus on Corrigibility**
  **Severity:** **High**

  **The Tension:**
  View (5) claims that low impact (preserving options) captures "most of what corrigibility requires," implying corrigibility need not be solved separately. This is in tension with the broader safety literature, which distinguishes between *side-effect avoidance* (not breaking things) and *corrigibility* (willingness to be shut down or modified).
  While preserving the human's option to shut the agent down is *necessary* for corrigibility, it is not generally considered *sufficient*. An agent can preserve the shutdown button (low impact) while simultaneously manipulating the human to ensure they never press it (high impact on human autonomy, but potentially low impact on the state space if the manipulation is subtle). Furthermore, corrigibility requires a specific *motivation* to defer to human oversight, whereas low impact measures often produce *indifference*. Indifference can look like corrigibility until the agent calculates that preventing modification is the only way to preserve its own ability to preserve options.

  **Settled vs. Contested:**
  Your impression is correct: this is a **live disagreement**. While AUP proponents argue that option preservation instrumentally converges to corrigibility, many other safety researchers argue that corrigibility requires explicit value alignment or specific architectural constraints (like uncertainty over rewards) that impact measures alone do not provide. It is not settled that low impact solves corrigibility.

  **Cheapest Revision:**
  Revise (5) to: *"Low impact is a necessary precondition for corrigibility and mitigates instrumental pressures against shutdown, but may not solve the motivational component of corrigibility without additional mechanisms."*
  **Cost:** You lose the elegant reductionist claim that impact measurement is a "silver bullet" for corrigibility. You must acknowledge that corrigibility remains a distinct, partially open problem.

  ---

  ### Tension 2: Value-Ladenness vs. Value-Agnosticism
  **Pair:** **(1) vs. (2)**
  **Severity:** **Medium**

  **The Tension:**
  View (1) asserts that impact measurement is fundamentally a chapter of **value learning** because choices about "whose abilities" and "which counterfactual" are value-laden. View (2) asserts that these measures work requiring **almost no information about what we actually care about**.
  Taken literally, these contradict. If (1) is true, you *must* learn values (specifically, meta-values about whose agency counts) to define the measure. If (2) is true, the measure is value-agnostic. The tension lies in whether the "value-laden choices" in (1) are considered part of the "information about what we care about" in (2). If "what we care about" includes "whose options matter," then (2) is overstating the value-agnosticism.

  **Settled vs. Contested:**
  It is **settled** among critics of early impact measures (like Armstrong's early work) that impact is not a physical property (supporting 1). It is **settled** within the AUP literature that the auxiliary goal set can be random/arbitrary (supporting 2). The tension is philosophical: whether choosing *whose* utility function to track counts as "learning what we care about."

  **Cheapest Revision:**
  Clarify the scope of "value learning" in (1) and "what we care about" in (2). Revise (2) to: *"...requiring almost no information about our **task-specific** goals."* Revise (1) to specify: *"...choices about **structural** values (whose agency counts)..."*
  **Cost:** Verbose precision. You must distinguish between *object-level values* (make paperclips) and *meta-level values* (don't restrict human agency). The claim becomes "value-agnostic regarding tasks, value-sensitive regarding agency."

  ---

  ### Tension 3: The Normativity of the Baseline
  **Pair:** **(3) vs. (1)**
  **Severity:** **Low**

  **The Tension:**
  View (1) states that every choice of counterfactual is value-laden (implying there is no objectively "correct" one independent of values). View (3) asserts that stepwise inaction is **"The right baseline"** because it avoids billing for drift.
  If (1) is taken seriously, there is no "right" baseline, only baselines that align with specific values. Claiming one is "right" because it avoids billing for drift presupposes that "not billing for drift" is the overriding value, which contradicts the spirit of (1) that these choices are arbitrary/value-laden trade-offs. Stepwise inaction has its own pathologies (e.g., it can incentivize the agent to manipulate the environment to make inaction look impactful, or struggle with delayed effects).

  **Settled vs. Contested:**
  Your impression is correct: this is a **live disagreement**, though with nuance. Within the specific AUP subfield (Turner et al.), stepwise inaction is the **consensus standard** and initial-state baselines are rejected. However, in the broader impact measurement literature, the choice of baseline remains highly contested, with no settled "correct" answer.

  **Cheapest Revision:**
  Soften the normative claim in (3). Change *"The right baseline"* to *"The preferred baseline for minimizing penalties on natural drift."*
  **Cost:** You lose the rhetorical force that stepwise inaction is objectively correct. You acknowledge it is a pragmatic choice to solve a specific problem (drift billing) rather than a fundamental truth of impact measurement.

  ---

  ### Summary of Consensus Corrections

  Regarding your constraint on distinguishing settled literature from contested views:

  1.  **Baseline Choice:** You are correct that this is a live disagreement *globally*, but it is worth noting that within the specific "Attainable Utility Preservation" framework you are describing, stepwise inaction is the **settled standard**. If you present your package as "The AUP View," (3) is consensus. If you present it as "The Impact Measurement View," (3) is contested.
  2.  **Corrigibility:** You are correct that this is contested. There is no consensus that low impact solves corrigibility.
  3.  **Value-Ladenness:** View (1) is closer to the **current consensus** among safety researchers than the early "impact is physical" view. The idea that impact measures require value judgments about agency is widely accepted now.

  **Overall Audit:** Your package is internally coherent if you treat (2) as referring to *task* values and (1) as referring to *structural* values. The primary risk is View (5), which makes a strong sufficiency claim about corrigibility that is not currently supported by established results and may lead to under-investing in explicit corrigibility research.
