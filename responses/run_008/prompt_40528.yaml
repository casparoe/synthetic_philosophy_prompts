      *   *Section 2: The Newsroom Audit.* Map the practices to the theories. Highlight the contradictions (the "inconsistency" the user noted).
      *   *Section 3: The Kierkegaard Test.* Apply the critique. Where does it stick? Where does it bounce off?
      *   *Section 4: Underdetermination.* Where the tools don't match the theory.
