          *   *Honesty:* Approval-direction doesn't remove optimization pressure; it just moves it to the reward model/overseer. If the overseer is flawed, the agent learns to game the overseer.
          *   *Coherence:* Without a north star, actions become myopic. You get a tool that does what you say, not what you mean.
          *   *Blind Spot:* If the overseer (human or model) doesn't see the risk, the approval-directed agent walks right into it thinking it's "good."

      *   **Theo (Approval-Directed):**
          *   *Safety/Alignment:* Fixed goals + high capability = Instrumental Convergence (power-seeking, deception) if the goal is slightly off.
          *   *Legibility:* Step-by-step allows human intervention. You can see *why* it did something before it commits to the next step.
          *   *Flexibility:* Context changes. A goal set at $t=0$ might be bad at $t=10$. Approval allows updating values dynamically.
          *   *Misspecification:* You can't perfectly specify "do research." If you try, it might cheat. Approval lets it ask "is this cheating?"

  3.  **Drafting - Scene Setting:**
