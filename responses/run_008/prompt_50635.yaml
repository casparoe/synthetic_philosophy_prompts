answer: |-
  ### Part I: The Translation

  You asked for the $\psi$-ontic versus $\psi$-epistemic dispute to be restated in the vocabulary of the scattering bench: preparation procedures, ensembles, detector counts, and the distinction between a fitted model and the physical system being modeled.

  **The Common Ground**
  In your work, you have a **preparation procedure**. This is the set of control parameters on the instrument: monochromator angle, collimation settings, sample temperature, magnetic field. Let's call this set of settings $P$. When you run the experiment, you generate an **ensemble** of detection events (counts) over time. You analyze these counts to extract a **scattering function** or cross-section, which depends on a mathematical object we will call $\psi$.

  The dispute is about the status of $\psi$ relative to the **physical state of the system** (the latent variables, $\lambda$) during a single run of the experiment. $\lambda$ represents the actual, microscopic configuration of the neutrons and sample nuclei in the beam path at the moment of scattering, independent of what you calculate.

  **The $\psi$-Epistemic Position (The "Fitted Line" View)**
  In your terms, the $\psi$-epistemic view treats $\psi$ as a **statistical model parameter** derived from the preparation procedure $P$.
  *   **Analogy:** $\psi$ is like the Gaussian function you fit to a Bragg peak. The Gaussian is not the peak itself; it is a compact summary of the count distribution.
  *   **The Claim:** Distinct preparation procedures ($P_1$ and $P_2$) can yield distinct $\psi$'s ($\psi_1$ and $\psi_2$) while still allowing for overlap in the underlying physical states ($\lambda$).
  *   **Mechanism:** If you prepare a neutron using $P_1$, it produces a probability distribution over the latent variables $\lambda$. If you prepare using $P_2$, it produces a different distribution. However, a specific physical microstate $\lambda_{specific}$ could be consistent with *either* preparation, just with different likelihoods.
  *   **Conclusion:** $\psi$ is a compression of the preparation history used to predict detector counts. It is not a physical property of the individual neutron in the beam. If you stop collecting data, $\psi$ loses its meaning, just as a fitted line loses meaning without data points.

  **The $\psi$-Ontic Position (The "Prepared Sample" View)**
  In your terms, the $\psi$-ontic view treats $\psi$ as a **physical property of the system**, akin to the crystal structure of your sample.
  *   **Analogy:** $\psi$ is like the lattice spacing $d$ in your sample. Whether or not you fit a model to the data, the lattice spacing is physically there. If you change the temperature, you physically change $d$.
  *   **The Claim:** Distinct preparation procedures ($P_1$ and $P_2$) yielding distinct $\psi$'s ($\psi_1$ and $\psi_2$) imply mutually exclusive physical states ($\lambda$).
  *   **Mechanism:** If $\psi_1 \neq \psi_2$, then the set of possible physical microstates $\lambda$ accessible via $P_1$ is disjoint from the set accessible via $P_2$. There is no overlap. A neutron prepared with $P_1$ is physically distinct in its intrinsic nature from a neutron prepared with $P_2$, not just statistically different.
  *   **Conclusion:** $\psi$ corresponds 1-to-1 with the physical reality of the system. It exists in the apparatus regardless of whether you perform a fit or collect counts.

  ---

  ### Part II: The Residue Report

  Here is the accounting of what survives the translation and what gets lost or distorted.

  **1. Clean Mappings**
  *   **Model vs. Reality:** The core of the dispute maps cleanly onto the distinction between a *fitted model* (epistemic) and the *physical system* (ontic). You are intimately familiar with the error of confusing a peak shape function with the physical scattering potential. The $\psi$-epistemic view warns against making this category error with the wavefunction.
  *   **Ensemble Statistics:** The $\psi$-epistemic view aligns perfectly with the run-to-run statistics of a scattering experiment. You never measure $\psi$ in a single shot; you infer it from an ensemble of counts. This makes the statistical interpretation natural to your experience.
  *   **Preparation Independence:** The PBR theorem's key assumption translates directly to the experimental practice of using separate, shielded apparatuses.

  **2. Distortions**
  *   **"Information" vs. "Calibration":** In the literature, "epistemic" is often couched in terms of an observer's *knowledge*. In your vocabulary, this distorts into *calibration*. It is not about what a human knows; it is about whether the control parameters ($P$) fully specify the physical state ($\lambda$) or merely the statistical distribution of $\lambda$. The translation removes the subjective "observer" and replaces it with the objective "preparation device," which is a clarification, not a loss.
  *   **"Reality" vs. "Latent Variables":** The ontic camp speaks of "reality." In your terms, this is "latent variables." However, in scattering, latent variables (nuclear positions, spin orientations) are usually assumed to exist even if not directly measured. The ontic view assumes $\psi$ is among these variables. The epistemic view assumes $\psi$ is a function *of* these variables.

  **3. No Counterpart (The Silence)**
  *   **Single-System State:** Your vocabulary is inherently statistical (ensembles, counts, background subtraction). Neutron scattering rarely, if ever, addresses the state of a *single* neutron in isolation. The philosophical debate often hinges on what $\psi$ means for a single system. Your vocabulary has no direct handle on "single-shot ontology" because your detectors integrate over time and flux. This silence reflects a limitation in your experimental vocabulary (which is designed for fluxes), but it also highlights an unclarity in the dispute: much of the $\psi$-ontic/epistemic debate is driven by single-particle interference thought experiments that do not map neatly onto bulk scattering.

  **4. The PBR Theorem in Experimental Terms**
  The Pusey-Barrett-Rudolph (2012) result addresses whether the "Fitted Line" view can survive.
  *   **The Assumption (Preparation Independence):** In your terms, this assumes that if you prepare neutron A in box 1 using $P_1$ and neutron B in box 2 using $P_2$, the joint physical state $(\lambda_A, \lambda_B)$ is simply the product of the individual states. There are no hidden correlations between the boxes that are not accounted for by the control parameters.
  *   **Is it a natural constraint?** Yes. In a national lab setting, if two beamlines are shielded and operated independently, you assume the physical states of the samples are independent. To assume otherwise would require a "common cause" or a hidden channel between the boxes.
  *   **The Conclusion:** PBR shows that if Preparation Independence holds, the "Fitted Line" view (overlap in $\lambda$) leads to a contradiction with the predicted detector counts. Therefore, $\psi$ must be "Prepared Sample" (ontic).
  *   **The Catch:** The theorem does not prove $\psi$ is a physical field; it proves that the probability distributions over $\lambda$ for distinct $\psi$'s cannot overlap. This forces the $\lambda$ space to be at least as large as the $\psi$ space.

  ---

  ### Part III: The Verdict

  You asked for a commitment, not a survey. Based on the translation above, I judge the **$\psi$-epistemic (Statistical/Model-based)** position to be the correct one, provided we refine the definition of "model" to mean "relational property of the preparation."

  **The Defense**
  The primary reason is the **Model-Reality Distinction** inherent in experimental practice. In neutron scattering, you distinguish between the *structure factor* (physical) and the *resolution function* (instrumental/statistical). The wavefunction $\psi$ behaves more like a resolution function or a boundary condition than a material object.
  1.  **Predictive Utility:** $\psi$ is exclusively used to calculate cross-sections (probabilities of counts). It is never measured directly. In your work, quantities that are never measured directly but only inferred to predict statistics are treated as model parameters, not physical substances.
  2.  **The PBR Weak Link:** The PBR theorem relies on **Preparation Independence**. While this is methodologically natural for an experimentalist (separate boxes), it is a substantive *physical* claim about hidden variables ($\lambda$). It assumes that the hidden variables do not exhibit holistic correlations that the control parameters ($P$) fail to capture. Given that quantum mechanics is fundamentally non-local and contextual, assuming that hidden variables respect classical independence across separate preparations is the very assumption that should be questioned. To accept PBR's conclusion, you must grant that the "hidden reality" behaves classically with respect to separation, even if the observable statistics do not. This is an unjustified concession.
  3.  **Parsimony:** The $\psi$-ontic view requires you to treat the wavefunction as a physical field existing in a high-dimensional configuration space. For a many-body system, this space is astronomically larger than physical 3D space. The $\psi$-epistemic view treats $\psi$ as a tool for managing the complexity of the preparation, avoiding the need to reify a field in $3N$ dimensions.

  **The Strongest Objection (The Weak Spot)**
  The strongest objection to this verdict is **Interference**.
  In your experiments, you observe interference patterns (Bragg peaks, spin echoes). These patterns depend on the phase of $\psi$. If $\psi$ is merely a statistical summary of information (like a fitted line), it is difficult to explain how "information" interferes with itself physically to modulate detector counts. A fitted line does not cast a shadow; a wavefunction does.
  To maintain the $\psi$-epistemic view, you must argue that the *physical mechanism* of interference lies in the latent variables $\lambda$ and the interaction with the apparatus, while $\psi$ merely tracks the coherence properties of the preparation. This requires a hidden-variable model (like Bohmian mechanics or stochastic electrodynamics) that can reproduce interference without making $\psi$ ontic. While possible, these models are often more cumbersome than standard quantum mechanics.

  **Conclusion**
  Treat $\psi$ as you would a **calibration file** or a **resolution function**. It is a real feature of the experimental setup, not just a subjective belief, but it is not the *stuff* of the system itself. The PBR theorem forces you to admit that your "calibration" specifies the physical state more tightly than classical statistics would suggest, but it does not force you to reify the calibration file into a physical object. The silence in your vocabulary regarding single-system ontology is not a deficit; it is a reminder that physics is about what can be measured in an ensemble, and in the ensemble, $\psi$ acts as a governor of statistics, not a constituent of matter.
