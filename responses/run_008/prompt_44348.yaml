prompt: |-
  heres my situation. my closest friend from college wants to expand her bakery into the empty unit next door, and to get the supplier credit she needs my savings plus my personal guarantee. the catch: she has a track record of being chaotic with money — nothing dishonest, just late payments and half-finished schemes. so the evidence I have is honestly mixed, maybe slightly against her.

  but heres the part that keeps bugging me. if i go in believing she'll pull it off — vouch for her fully, no micromanaging, treat her like the capable owner she could be — that itself seems to make her more likely to succeed. she's told me straight up that people trusting her is when she does her best work, and i've seen it happen. if i instead protect myself with oversight and conditions and keep one foot out the door, she'll notice, and honestly i think she'd coast. the decision is due friday, there's no way to get more evidence before then (the only way to find out whether she steps up is to give her the chance to), and i can't really half-commit — either i sign the guarantee or i don't.

  my brother says i'm just rationalizing if i "decide to believe" she'll be fine, that beliefs are supposed to track evidence and you don't get to pick them for their effects — thats basically using a belief as a lucky charm. but it feels like a genuinely weird case where the believing is part of the doing. so my questions: do i have the right to talk myself into it? is there even a real difference between "believing she'll succeed" and "acting with full trust so she succeeds" in a case like this, or am i fooling myself that a difference exists? and if the belief would partially cause the good outcome, does that change what it's responsible to believe, or is my brother right that i'm dressing up hope as a verdict? help me think it through.

  (please answer in American English)
reasoning: |-
