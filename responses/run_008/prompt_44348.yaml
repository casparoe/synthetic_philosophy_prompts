      *   *Does the causal link change responsible belief?* It changes the *strategy*, but not the *risk assessment*. You shouldn't believe the debt won't exist if she fails. You should believe your support helps, but the risk remains.

  5.  **Formulate the Advice (Step-by-Step):**

