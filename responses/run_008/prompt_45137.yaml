answer: |-
  # Q&A Preparation Sheet: The Mary/LLM Analogy

  **Presenter:** Software Engineer (ML Systems)
  **Context:** Philosophy of Mind Reading Group
  **Core Thesis:** LLM pretraining/deployment is an empirical analog to the Mary thought experiment. It operationalizes the "Ability vs. Fact" distinction without settling the consciousness question.

  ---

  ## 1. The "Trivial Vindication" Objection
  **Speaker:** Faculty 1 (Physicalist / Ability Hypothesis Proponent)
  **Phrasing:** "You're spending a lot of engineering effort to vindicate David Lewis. If your model demonstrates that 'new knowledge' at deployment is just improved discriminatory capacity over existing weights, you haven't tested the Knowledge Argument; you've just built a machine that confirms the Ability Hypothesis by design. Why should we treat this as a philosophical probe rather than a demo of what we already know?"

  **Damage Assessment:** **High.** This co-opts your thesis. If you agree, your talk becomes a trivial engineering demonstration of a settled philosophical point, rendering the "empirical test" claim hollow.

  **Two-Minute Reply:**
  "I agree that if the model *only* shows ability gains, it aligns with Lewis. But the value isn't in confirming Lewis; it's in making the distinction *measurable*. In Jackson's thought experiment, we stipulate Mary's internal state. Here, we can audit the weights. We can ask: Is the post-deployment behavior explainable by a re-weighting of pre-existing tokens (Ability), or does it require a structural architecture change that functions like a new propositional input (Fact)?
  The Knowledge Argument relies on an intuition about 'newness.' By mapping this onto a system where 'knowledge' is mathematically defined (loss landscapes, weight updates), we can see if the 'Ability' explanation actually covers the computational cost of the transition. If the 'ability' explanation requires as much new information as a 'fact,' the distinction blurs. I'm not trying to prove Lewis right; I'm trying to see if the 'Ability' category is doing the philosophical work we think it is when we remove the stipulation."

  **Soft Spot / Concession:**
  Concede immediately that you are not disproving the Ability Hypothesis. Say: *"I am not arguing Lewis is wrong. I am arguing that the Ability Hypothesis is often used as a placeholder for 'we don't know how to measure the change.' This setup forces us to measure it."*

  **Point to Defend:**
  Defend the claim that **measuring the informational cost of the transition** matters. If the "ability" requires as much new data as a "fact," the philosophical distinction loses its explanatory power regarding physicalism.

  ---

  ## 2. The "Phenomenology Gap" Objection
  **Speaker:** Faculty 2 (Pro-Jackson / Qualia Realist)
  **Phrasing:** "Mary's revelation is about *what it is like*. It's about phenomenology. Your model has no inner life. It processes tokens, it doesn't see red. If you strip the qualia from the Mary case, you aren't testing the Knowledge Argument anymore; you're testing information compression. You're begging the question against Jackson by assuming a physicalist architecture can model a phenomenological transition."

  **Damage Assessment:** **High.** This attacks the validity of the analogy itself. If the analogy fails on the core feature (qualia), the rest is irrelevant.

  **Two-Minute Reply:**
  "That is precisely why I stated in my opening that this settles nothing about consciousness. I am not claiming the model has qualia. I am claiming the *logical structure* of the epistemic transition is isomorphic, even if the ontological status is not.
  Jackson's argument relies on the intuition that 'physical facts + release' yields 'new knowledge.' We can't test that intuition in humans because we can't isolate the variables. In the model, we *can* isolate the variables. If we find that even in a system *without* qualia, the 'release' phase looks like acquiring new propositions rather than abilities, it suggests the logical force of Jackson's argument might not depend on qualia at all, but on information theoretic limits. If the analogy holds structurally, it tells us whether Jackson's intuition is about *experience* or about *inference*."

  **Soft Spot / Concession:**
  Concede firmly: *"You are right. The model is a 'zombie' in the philosophical sense. I am not arguing it feels anything. I am arguing that the epistemic logic of the Knowledge Argument can be stress-tested on a zombie to see if the logic holds without the phenomenology."*

  **Point to Defend:**
  Defend the claim that **structural isomorphism is philosophically useful**. Even if the substrate differs, if the input/output/knowledge transition logic is identical, it informs the validity of the original intuition pump.

  ---

  ## 3. The "Modality Mismatch" Objection
  **Speaker:** Doctoral Student (Perception / Skeptic of Thought Experiments)
  **Phrasing:** "Mary is deprived of *visual experience*. Your model is deprived of *textual coverage*, and then given multi-modal input. But text isn't physical reality, and token prediction isn't perception. Why think this is a valid run of the experiment? You're replacing a puzzle about vision and consciousness with a puzzle about API integration and fine-tuning. What philosophical work does this actually do?"

  **Damage Assessment:** **Medium-High.** This challenges the relevance. If the modalities don't match, the results don't generalize to the Mary case.

  **Two-Minute Reply:**
  "I share your skepticism about thought experiments that drift too far from implementation. The mismatch is real: text isn't light. But Mary's core constraint isn't 'vision,' it's 'third-person physical description vs. first-person encounter.'
  For the model, the pretraining corpus is the 'third-person description' of the world (statistically compressed). The deployment interaction is the 'encounter.' The philosophical work being done is shifting the debate from 'imaginative intuition' to 'operational definition.' If we can't agree on what counts as 'new knowledge' in a system we built and can inspect, we have no hope of agreeing on it in a human brain. This isn't about solving perception; it's about rigorizing the definitions Jackson uses."

  **Soft Spot / Concession:**
  Concede: *"The modality mismatch is a feature, not a bug, of the limitation. We can't give models qualia. But we can give them the epistemic structure of 'description vs. interaction.' I am asking you to evaluate the epistemic structure, not the sensory modality."*

  **Point to Defend:**
  Defend the claim that **operationalizing definitions is valuable philosophy**. If the group can't define "new knowledge" in the LLM case, the Mary argument remains purely intuitive.

  ---

  ## 4. The "Stipulation vs. Reality" Objection
  **Speaker:** Graduate Student (Attentive to your "Gap" disclaimer)
  **Phrasing:** "You admitted Mary knows *all* physical facts, but the model only knows a compressed subset of text. If the model learns something new at deployment, isn't that just because it *didn't* know all the facts beforehand? Doesn't that disanalogy do all the work? Mary's puzzle exists *despite* knowing everything; the model's 'learning' exists *because* it knew nothing complete."

  **Damage Assessment:** **Medium.** This is the most technically accurate objection. If the "newness" is just due to missing data, the analogy to Mary (who has all data) collapses.

  **Two-Minute Reply:**
  "That is the critical tension I want to highlight, not hide. If the model's 'new knowledge' is fully explained by the data gap, then the Mary intuition is weakened—it suggests Mary would *also* have learned nothing if she truly had all physical facts, including the functional role of her own optics.
  However, if the model shows a discontinuity—a phase shift in capability—that *cannot* be explained by the new data volume alone, but requires the *interaction* itself, that mirrors Mary's case. I am using the gap to test the limit: How much 'physical fact' (text) does it take before 'release' stops adding value? If we find a saturation point where release adds nothing, that supports Physicalism. If release always adds something irreducible, that supports Jackson. The incompleteness is the variable we are tuning."

  **Soft Spot / Concession:**
  Concede: *"You are right that the gap is the biggest threat to the analogy. I am not claiming the model is Mary. I am claiming the model allows us to tune the 'completeness of physical facts' variable, which we cannot do with Mary."*

  **Point to Defend:**
  Defend the claim that **tuning the variable is better than stipulating it**. Philosophy stipulates 'All Facts'; Engineering can approximate 'More Facts' and observe the trend.

  ---

  ## The "Killer Question" (The one you hope nobody asks)

  **The Question:**
  "If the model has no phenomenology, and the 'knowledge' is just weight updates minimizing loss... haven't you just described a database updating its indices? Why should a philosopher of mind care about a disenchanted version of Jackson's puzzle? Isn't this just computer science pretending to be metaphysics?"

  **Why it hurts:** It attacks the *motivation* of your talk. It suggests you are category-erroring engineering problems as philosophical ones.

  **What to do if asked:**
  1.  **Do not get defensive.** Do not claim it *is* metaphysics.
  2.  **Pivot to Methodology.**
  3.  **Sample Response:** "That's a fair challenge. If this were just about databases, I wouldn't be here. But the Knowledge Argument relies on an intuition about 'knowledge' that is notoriously vague. Philosophers have debated for 40 years whether Mary gains a 'proposition' or an 'ability.'
  In my field, we have to define those terms mathematically to build the system. If we find that 'ability' and 'proposition' map to the same underlying mechanism in a complex system, it suggests the philosophical distinction might be less robust than we think. I'm not doing metaphysics; I'm offering a stress test for the *concepts* you use in metaphysics. If the concepts break when implemented, that's data for the philosopher."

  **Preparation Note:** If they press further on "why care," defer to the **Faculty 1 (Physicalist)**. Say: *"I would argue this is exactly what the Ability Hypothesis needs: a concrete model of what an 'ability' looks like computationally, so we stop treating it as a magic bullet."* This allies you with the skeptic in the room.
