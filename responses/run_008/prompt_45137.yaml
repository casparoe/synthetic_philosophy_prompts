      *(Refining the "Killer Question")*: The most dangerous question is one that forces the user to admit the analogy is trivial. "If the model has no qualia, haven't you just built a giant lookup table that updates? Why is this philosophy?" I need to frame the answer around *operationalizing epistemic concepts*.

