      The fundamental distinction is that tragedies of the commons degrade absolute welfare through the depletion of a shared stock and can be mitigated by abundance, whereas positional races drive escalating costs merely to maintain relative rank, rendering overall economic growth irrelevant to the competitive pressure. In a tragedy of the commons, such as antibiotic overuse, individual actors exploit a finite resource until its value collapses for everyone; the problem is scarcity, meaning that if technology or growth creates substitutes or expands the resource base, the incentive to overconsume diminishes. Conversely, in a positional race like doping or AI deployment, utility is derived from standing relative to competitors rather than absolute output, creating a zero-sum dynamic where universal improvement changes nothing because everyone running faster leaves the finishing order unchanged. This is why a rising tide dissolves commons failures by alleviating the scarcity that drives them, but leaves positional races fully intact since status is inherently scarce regardless of total wealth. Consequently, simply improving outcomes for all participants, such as making doping safer or AI development more profitable, fails to stop the second kind of failure because the incentive structure rewards beating rivals, not achieving a threshold of safety or profit. Effective interventions must therefore match the structure of the failure: commons problems require pricing mechanisms or caps to internalize the cost of depletion, while positional races demand cooperative agreements or regulatory restructuring that decouples rewards from rank, such as banning performance-enhancing drugs or establishing international safety standards that penalize speed over caution.

