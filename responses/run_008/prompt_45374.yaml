          *   The "Remorse Discount" assumes guilt leads to reform (moral agency).
          *   The "Shaming Sanction" often assumes shame leads to deterrence (social control).
          *   *Critique of User's Hypothesis:* The user thinks they are incompatible. I need to show where they *might* be compatible (Communicative) and where they definitely clash (Dignity/Reintegration).
      *   **Part 2: Can a Single Theory License Both? (Communicative Theory):**
          *   Focus on R.A. Duff's *Punishment, Communication, and Community*.
          *   Argument: Punishment is a dialogue.
          *   *Guilt:* The successful conclusion of the dialogue (repentance).
          *   *Shame:* Can be part of the "hard treatment" meant to provoke the dialogue.
          *   *The Catch:* Communicative theory usually demands *reintegrative* shaming, not *stigmatizing* shaming. Public signs often cross into stigmatization. So, a *pure* communicative theory might actually reject current shaming sanctions while keeping the remorse discount.
          *   *Alternative:* Expressive Theory (Feinberg/Feinberg-ish). The state expresses condemnation. Guilt shows the offender hears it. Shame shows the community hears it.
      *   **Part 3: Where is the Practice Underdetermined?**
          *   The underdetermination lies in the *purpose* of the emotion.
          *   Is the emotion a *sign* of reform (epistemic) or the *mechanism* of reform (causal)?
          *   Current practice treats Guilt as Epistemic (proof of reform) and Shame as Causal (tool to deter).
          *   If both were treated as Causal (both aim to reform), the tension increases.
      *   **Part 4: The "Shame-Cultivating" Jurisdiction:**
          *   Hypothetical: What if we want *Shame* (I am bad) instead of *Guilt* (I did bad)?
          *   *Change Required:* Shift from act-focused to character-focused.
          *   *Which half changes easier?*
              *   *Shaming Sanctions:* Easy to expand. Just make them more pervasive/deeply identity-focused.
              *   *Remorse Discount:* Harder. Currently rewards *acceptance of responsibility* (guilt). To reward shame, you'd need to reward public self-abasement or identity renunciation, not just admitting the act.
              *   *Actually:* It might be easier to keep the Shaming Sanctions and *abolish* the Remorse Discount. Why? Because shame is often involuntary or defensive. Rewarding it is tricky. But if the goal is to cultivate shame, the shaming sanctions are the direct tool. The remorse discount is the outlier because it relies on *voluntary* moral insight. Shame is often *inflicted*.
              *   *Refinement:* If the goal is to cultivate shame as a *virtue* (Confucian style?), then the Remorse Discount needs to change to reward displays of shame, not just guilt. But American law is liberal/individualist; shame is communitarian. This is a deep structural clash.
      *   **Part 5: Synthesis/Conclusion:**
          *   The current practice is theoretically messy (hybrid).
