answer: |-
  This is a sharp observation that cuts to the heart of the theoretical incoherence in modern American penal practice. You have identified a genuine friction between a **liberal-retributive** model (which privileges the autonomous moral agent) and a **norm-enforcement** model (which privileges social compliance and deterrence).

  Your working hypothesis is largely correct: the remorse discount treats the offender as a moral agent capable of self-correction, while shaming sanctions often treat the offender as a vector of social risk to be managed through stigma. However, to answer your specific questions about whether a single theory can license both, and how a "shame-cultivating" jurisdiction would look, we need to drill down into the moral psychology of guilt versus shame and the specific aims of punishment.

  Here is an analysis of the theoretical presuppositions, the potential for unification, and the implications of a shift toward shame.

  ### 1. The Moral Psychology of the Asymmetry

  To evaluate the theory, we must first distinguish the emotions as the law implicitly understands them.

  *   **Guilt (The Remorse Discount):** In legal psychology and philosophy (e.g., *United States v. Gray*, 1998), remorse is treated as **act-focused**. It implies: "I did a bad thing." It presupposes moral agency, rationality, and the capacity for repair. When the Federal Sentencing Guidelines (USSG §3E1.1) grant a reduction for "Acceptance of Responsibility," they are rewarding a cognitive and moral acknowledgment of the *act*. This aligns with a **retributive** logic (you deserve less punishment if you have already punished yourself morally) and a **utilitarian** logic (you are less likely to recidivate).
  *   **Shame (The Shaming Sanction):** Shaming penalties (public signs, newspaper apologies) are **self-focused**. They imply: "I am a bad person." As Martha Nussbaum argues in *Hiding from Humanity*, shame is about a loss of status and standing in the community. When courts impose this, they are often relying on a **deterrence** or **social norm** theory (e.g., Dan Kahan's work on social influence). The goal is not necessarily the offender's internal moral insight, but the reinforcement of community boundaries and the infliction of a cost (loss of reputation) that outweighs the benefit of the crime.

  **The Tension:** You are right that these rest on different views of the person. The remorse discount respects the "inner forum" of conscience. The shaming sanction invades the "outer forum" of reputation. One invites the offender into a moral dialogue; the other exiles them from the moral community, even if temporarily.

  ### 2. Can a Single Theory License Both?

  You ask if a **communicative conception of punishment** (most notably associated with R.A. Duff) could license both halves.

  **The Argument for Compatibility:**
  A communicative theory views punishment as a secular penance intended to persuade the offender to recognize the wrongfulness of their conduct and repent.
  *   **Guilt:** On this view, the remorse discount is the *successful conclusion* of the communicative process. The offender has received the message, internalized it, and repented.
  *   **Shame:** On this view, shaming sanctions could theoretically be justified as the "hard treatment" necessary to force the offender to attend to the message. If the offender is morally deaf, the state may need to use stigma to grab their attention. Furthermore, if the shaming is **reintegrative** (John Braithwaite's *Crime, Shame and Reintegration*), the shame is not meant to degrade permanently but to signal the gravity of the breach so that the offender can be welcomed back *after* expressing shame.

  **The Point of Failure:**
  However, current American shaming sanctions often fail the communicative test because they are **stigmatizing** rather than **reintegrative**.
  *   A bumper sticker saying "I am a Drunk Driver" does not invite dialogue; it brands the offender. It bypasses conscience in favor of public humiliation.
  *   Duff argues that punishment must respect the offender as a rational agent. Stigmatizing shame treats them as an object to be manipulated by social pressure.
  *   **Verdict:** A *pure* communicative theory would likely **keep the remorse discount** but **abolish most current shaming sanctions**, replacing them with sanctions that demand reparative action rather than public self-abasement. Therefore, the current practice is not fully licensed by a single coherent theory; it is a pragmatic hybrid of communicative ideals (for the guilty) and norm-enforcement realism (for the shamed).

  **Where is the practice underdetermined?**
  The underdetermination lies in the **voluntariness** of the emotion.
  *   The system rewards *voluntary* guilt (I choose to feel bad).
  *   The system imposes *involuntary* shame (You *will* feel bad because the public sees this).
  *   **The Theoretical Gap:** The practice presupposes that guilt is a reliable *epistemic indicator* of reform, while shame is a reliable *causal mechanism* of deterrence. It does not have a unified theory of whether emotions are evidence of change or tools to cause change.

  ### 3. The "Shame-Cultivating" Jurisdiction

  Suppose a jurisdiction concluded that **shame** (not guilt) is the superior moral emotion to cultivate. This would be a shift from a Liberal-Individualist framework to a Communitarian-Perfectionist framework.

  **What would have to change?**
  In a guilt-based system (Liberal), the state cares about the *act* and the *choice*. In a shame-based system (Communitarian/Confucian), the state cares about the *character* and the *relationship to the community*.

  1.  **From Act to Character:** Sentencing would shift from "What did you do?" to "Who are you?" A shame-cultivating system would be less interested in whether you admit the act (guilt) and more interested in whether you demonstrate a proper regard for your social standing and honor.
  2.  **From Privacy to Publicity:** Guilt can be private; shame requires an audience. The proceedings would likely become more public, and the "Acceptance of Responsibility" reduction would be contingent on public acts of contrition, not private allocutions to a judge.

  **Which half is easier to revise?**

  *   **Easier: The Shaming Sanctions.**
      Expanding shaming sanctions is the path of least resistance for a shame-cultivating jurisdiction. It requires no change to the underlying logic of the sanctions, only an expansion of their scope and intensity. You would simply increase the frequency of public apologies, community notification, and status-reduction penalties. This aligns naturally with the goal of cultivating shame.

  *   **Harder: The Remorse Discount (Sentencing Guidelines).**
      This is where the revolution would have to happen. Currently, §3E1.1 rewards *acceptance of responsibility* (a cognitive/guilt-based act). To reward *shame*, the guidelines would need to reward **demonstrations of lowered status** or **honor-restoration**.
      *   *The Problem:* In a liberal legal system, we hesitate to punish (or reward) based on emotional states that are not fully voluntary. Shame is often visceral and defensive.
      *   *The Revision:* The jurisdiction would have to change the discount from "Did you admit the crime?" to "Did you demonstrate proper reverence for the community norms you violated?" This risks punishing those who are stoic or internally remorseful but not outwardly shameful.
      *   *Structural Clash:* It is harder to revise the Guidelines because they are built on the premise of individual autonomy. Cultivating shame requires a theory of the self that is constituted by social relations. You cannot easily graft a communitarian emotion (shame) onto a liberal procedural framework (the Guidelines) without creating a "loyalty oath" dynamic that raises First Amendment and self-incrimination issues.

  ### 4. Conclusion: The Theoretical Cost

  Your intuition that the two halves rest on incompatible theories is correct. The American system is currently **schizophrenic**:
  1.  **In the courtroom (Sentencing):** It acts like a **Kantian** institution, demanding autonomous moral acknowledgment (Guilt).
  2.  **In the public square (Sanctions):** It acts like a **Foucaultdian** or **Behaviorist** institution, manipulating social visibility to condition behavior (Shame).

  If you were to write on this, I suggest focusing on the **voluntariness constraint**.
  *   A unified **Communicative Theory** is possible *only if* shaming sanctions are reformed to be **reintegrative** (Braithwaite). In that scenario, shame is not the end goal but the painful medium through which guilt is reached. The state imposes shame *to provoke* guilt.
  *   However, if the jurisdiction truly wants to **cultivate shame** as the terminal virtue, it must abandon the Liberal premise that the law addresses the individual conscience. It would have to accept that the law addresses the social self. In that scenario, the **Remorse Discount** is the element that must be discarded or radically transformed, because "accepting responsibility" is a guilt-concept. A shame-concept would require "restoring honor" or "submitting to community judgment."

  The practice is underdetermined because it tries to have the moral satisfaction of guilt (the offender *chooses* to be good) with the social utility of shame (the community *forces* them to be good). A coherent theory must choose one: either the offender is a moral agent to be persuaded (Guilt/Communicative) or a social subject to be conditioned (Shame/Deterrence). Currently, the law pretends it is doing the former while secretly relying on the latter.
