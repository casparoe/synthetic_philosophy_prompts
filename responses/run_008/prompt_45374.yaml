      *   Did I answer the "Shame Jurisdiction" question? Yes (Structural shift needed).

  *(Self-Correction)*: Wait, I should check if there's a specific legal scholar who addresses this exact asymmetry. Claudia Card? Martha Nussbaum (Hiding from Humanity)? Nussbaum argues against shame in law. Kahan argues for it. The user is asking about the *presupposed* theory of the *current mixed practice*, not necessarily what *should* be. The current practice is theoretically inconsistent. I need to highlight that inconsistency rather than smooth it over too much. The "single theory" attempt might reveal the practice is *incoherent* rather than underdetermined. I will argue it is largely incoherent but *could* be salvaged by a specific version of Communicative Theory (Reintegrative).

  Let's structure the response:
  1.  Validate the tension (Guilt = Internal/Agency vs. Shame = External/Status).
  2.  Analyze the "Single Theory" possibility (Communicative/Reintegrative).
