prompt: |-
  I'm a PhD student in law and philosophy, writing on moral emotions, and I've become puzzled by an asymmetry in how American criminal sentencing treats guilt and shame. On one side, the system systematically rewards expressions of guilt: the federal sentencing guidelines contain an explicit reduction for offenders who accept responsibility, and demonstrations of remorse move sentencing outcomes across jurisdictions generally. On the other side, some courts deliberately impose shame: offenders ordered to stand in public wearing signs describing their crime, to publish apologies in newspapers, or to display bumper stickers about their drunk driving. What theory of the moral emotions does this combined practice presuppose? My working guess is that the remorse discount presupposes that felt guilt is evidence of moral insight and future reform — something to be encouraged — while the shaming sanction presupposes that shame is at best a deterrent and at worst a form of degradation, something to be inflicted. But I'm not sure the two halves rest on compatible theories: the first seems to treat the offender as a moral agent whose conscience is the point of contact with the law, while the second seems to bypass conscience in favor of public exposure. Where is the practice actually underdetermined here — could a single theory, say a communicative conception of punishment on which the state's message is addressed to the offender, license both halves? And suppose a jurisdiction concluded that shame, not guilt, is the better moral emotion to cultivate in offenders: what in the practice would have to change, and which of the two halves would the revision come easier to?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **User Identity:** PhD student in law and philosophy.
      *   **Topic:** Moral emotions in American criminal sentencing (Guilt vs. Shame).
      *   **Observation:** An asymmetry exists.
          *   *Side A:* System rewards *guilt/remorse* (acceptance of responsibility reductions, leniency for showing remorse).
          *   *Side B:* System sometimes imposes *shame* (public signs, newspaper apologies, bumper stickers).
      *   **User's Working Hypothesis:**
          *   Remorse discount = Guilt is evidence of moral insight/reform (internal, conscience-based).
          *   Shaming sanction = Shame is deterrent/degradation (external, public exposure).
          *   *Conflict:* Side A treats offender as moral agent (conscience); Side B bypasses conscience (public exposure).
      *   **Core Questions:**
          1.  Where is the practice underdetermined?
          2.  Can a single theory (e.g., communicative punishment) license both halves?
          3.  If a jurisdiction wanted to cultivate *shame* instead of *guilt*, what would change, and which half is easier to revise?

  2.  **Initial Analysis & Theoretical Mapping:**

      *   *Guilt vs. Shame:* In psychology and moral philosophy, guilt is typically "I did something bad" (behavior-focused, reparable), while shame is "I am bad" (self-focused, hiding/defensive).
      *   *Sentencing Guidelines (Side A):* Acceptance of Responsibility (USSG §3E1.1). This aligns with retributive (desert reduced by remorse) and utilitarian (lower risk of recidivism) theories. It assumes internal moral reckoning.
      *   *Shaming Sanctions (Side B):* Often associated with Kahan & Posner (law and economics/social norms). Intended to stigmatize to deter.
      *   *The Tension:* The user sees a conflict between *inviting* an internal state (guilt) and *imposing* an external state (shame).
      *   *Communicative Theory:* R.A. Duff is the big name here. Punishment as a secular penance. Aiming at moral reform through communication. Does this fit both?
          *   *Guilt:* Fits well. The offender accepts the message.
          *   *Shame:* Tricky. Duff usually argues *against* degrading shame. But maybe "reintegrative shaming" (Braithwaite) fits?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the tension.
      *   **Part 1: Analyzing the Asymmetry (Guilt vs. Shame):**
