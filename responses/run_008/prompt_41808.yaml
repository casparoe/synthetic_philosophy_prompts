answer: |-
  You have diagnosed the situation with impressive accuracy. Your reading group's stalemate isn't a failure of comprehension; it is a reflection of the actual state of the literature. You are correct that the two camps are talking past each other, but I would sharpen your hypothesis slightly. It is not merely a disagreement about "what an exorcism owes you." It is a disagreement about **logical priority** disguised as a disagreement about physical mechanism.

  Here is the diagnosis of the disagreement, broken down by your requested criteria.

  ### 1. Is it Substantive, Verbal, or Two Questions?
  It is all three, layered.

  **The Verbal Layer (Definitions of Entropy):**
  When the Bennett/Landauer camp says "entropy," they often mean *information-theoretic entropy* (Shannon/Gibbs) mapped onto physical states. When the Critics (notably John Norton and, earlier, Earman) say "entropy," they mean *thermodynamic entropy* defined by heat and temperature. The "circularity" charge arises because to equate the two (to say erasing a bit *is* dissipating heat), you must assume a bridge principle that effectively presupposes the Second Law. The proponents think the bridge is a derivation; the critics think the bridge is an assumption.

  **The Substantive Layer (Logical Priority):**
  This is the core.
  *   **Camp A (Bennett/Landauer):** Believes information theory is *more fundamental* than thermodynamics. They want to show that the Second Law is a consequence of the logic of information processing.
  *   **Camp B (Norton/Critics):** Believes thermodynamics (or statistical mechanics with thermodynamic assumptions) is *more fundamental*. They argue you cannot derive the Second Law from information theory alone because information theory is abstract. To make it physical, you must import thermodynamic assumptions, rendering the derivation circular.

  **The Two Questions Layer (Engineering vs. Foundations):**
  *   **Question 1 (Operational):** Can we build a device that violates the Second Law?
      *   *Consensus:* No. Both camps agree the demon fails. The experiments (Bérut et al., 2012; Jun et al., 2014) settle this. We know the cost is paid.
  *   **Question 2 (Foundational):** *Why* does the demon fail, and does this explanation ground the Second Law?
      *   *Conflict:* Camp A says the failure is due to the logical necessity of erasure. Camp B says the failure is due to the physical assumptions required to make "erasure" cost energy.

  Your hypothesis that one side wants a theorem and the other wants a "no-go" argument is correct, but the deeper issue is that Camp A believes they have found the *source* of the Second Law (information), while Camp B believes they are merely locating the *tax collection point* (the reset) within a system that already assumes the tax exists.

  ### 2. The Circularity Charge: Why it Sticks
  You mentioned the critics claim Landauer's Principle is derived from the Second Law. To be precise, the charge (championed by John Norton) is that Landauer's Principle relies on **Liouville's Theorem** (phase space volume conservation) plus an assumption that the system thermalizes (couples to a heat bath).

  To claim that compressing phase space (erasure) *must* dissipate heat, you must assume the environment behaves thermodynamically (i.e., obeys the Second Law). If you assume the environment obeys the Second Law to prove the demon obeys the Second Law, you have not exorcised the demon; you have merely moved the miracle from the box to the memory register.

  The proponents argue that Liouville's Theorem is mechanical, not thermodynamic. The critics retort that applying Liouville's Theorem to a "memory" device requires treating that device as a thermodynamic object, which smuggles the conclusion back into the premises.

  ### 3. Why Experiments Don't Settle It
  You asked if an experiment could settle this. The answer is **no**.

  The experiments verify Landauer's Limit as an *empirical regularity*. They show that when you erase a bit in a specific physical setup (colloidal particles, optical tweezers), you dissipate $kT \ln 2$.
  *   **Camp A says:** "See? Information is physical. The principle holds."
  *   **Camp B says:** "Of course it holds. You built the experiment using materials that obey the Second Law. You verified that thermodynamics applies to your memory device. You did not prove that information *grounds* thermodynamics; you proved that thermodynamics applies to information processing."

  An experiment cannot distinguish between a principle that *generates* a law and a principle that *obeys* a law. The dispute is about the direction of implication in the theory, not the numerical value of the heat dissipated.

  ### 4. The Verdict: What Would Settle It?
  You asked for honesty on what would count as settling it.
  **Nothing will settle it.**

  This is not a problem waiting for a cleverer derivation or a more precise calorimeter. It is a **framework dispute** in the philosophy of physics.

  *   **Why no derivation?** Any derivation of macroscopic irreversibility from microscopic reversibility requires a "past hypothesis" or a probabilistic postulate (like equal *a priori* probability). As soon as you introduce that postulate, the critics will argue you have imported the thermodynamic arrow of time you claimed to derive. You cannot get "ought" (irreversibility) from "is" (Hamiltonian mechanics) without a bridge, and the fight is about whether that bridge is made of information or thermodynamics.
  *   **Why no experiment?** As noted, experiments operate within a framework. They cannot validate the framework's logical foundations.
  *   **Why no consensus?** Because the two sides value different theoretical virtues. Camp A values **unification** (reducing thermodynamics to information). Camp B values **rigor** (avoiding circularity in derivation). These are aesthetic and philosophical preferences, not physical facts.

  ### Summary Diagnosis
  Your reading group is stuck because you are trying to solve a philosophical categorization error with physics tools.

  1.  **The Disagreement:** It is substantive regarding the *structure of physical theory*, but verbal regarding the *definition of entropy*. It is fundamentally a dispute over whether Information Theory is a reduction base for Thermodynamics or merely isomorphic to it.
  2.  **The Circularity:** The critics are logically correct that standard derivations of Landauer's Principle assume thermodynamic behavior of the reservoir. The proponents are physically correct that the accounting works out perfectly when you do so.
  3.  **The Resolution:** There is no resolution. The "exorcism" is complete for the engineer (you can't build the engine), but incomplete for the foundationalist (we haven't agreed on *why* without begging the question).

  **Advice for the coffee group:** Stop trying to decide who is right about the physics. The physics is agreed upon (the demon fails, the heat is dissipated). Start debating whether "Information is Physical" is a profound ontological claim or a useful mnemonic for bookkeeping. That is where the actual disagreement lives, and no amount of laser physics or optical tweezers will move that needle.

  You haven't missed a paper that solves this. The literature is stalled because the question has shifted from physics to metaphysics.
