prompt: |-
  So I'm a backend engineer at a small health-tech startup (we do sleep and wellness tracking, not dna tests, but our content team likes to cite genetics stuff because it sounds sciencey). I've somehow become the person who signs off on science claims in our app copy and blog posts, mostly because everyone else is even less qualified than me, and I have zero background in this -- I took one stats course. Lately I keep getting hit with heritability numbers. Like "height is 80% genetic," "sleep duration is 40% heritable," or someone found a study saying some trait is "50% inherited" and wants to build a whole feature or blog post around it. I can tell these numbers get abused constantly but I couldn't tell you exactly where the line is between a legit use and a misuse.

  What I want is a decision procedure I can actually run, in like 15-20 minutes per claim, sitting at my desk before standup. Something like: the questions to ask about the claim in order, what a sufficient answer to each looks like, and where the procedure tells me "no, this claim can't go in the copy" vs where it says "this one's a judgment call, escalate it" (we do have an advisor I can email but she's slow, so I only want to bother her when it matters).

  The kind of thing I suspect matters but want you to make rigorous and usable: heritability being about variance in a population not a blueprint for an individual, the number depending on how much environmental variation there is in that population, whether the claim quietly slides from "individuals differ" to "groups differ," whether it slides from "heritable" to "unchangeable," twin study assumptions, that kind of thing. But figure out what actually matters and what's just noise for my use case.

  Then run the procedure on three real-ish claims I've actually seen lately: (1) a PM wants copy saying "your sleep timing is partly genetic, so if you're a night owl, don't fight it," citing a heritability estimate for chronotype; (2) a blog draft saying "IQ is highly heritable, which tells us education matters less than people think"; (3) marketing wants "sleep duration is 40% heritable" as a fun fact stat in an infographic, nothing more. Be honest about where my 15 minutes runs out and I'm just guessing, and about what the procedure can't settle at all. Also please don't give me a reading list -- our style guide people will just ask me for links I can't evaluate. I need the actual checklist, worked through those three examples.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **Role:** Backend engineer at a small health-tech startup (sleep/wellness tracking).
      *   **Task:** Unofficial gatekeeper for science claims in copy/blog (due to lack of other qualified personnel).
      *   **Background:** One stats course, zero domain expertise in genetics/biology.
      *   **Problem:** Constant influx of heritability claims (e.g., "80% genetic," "40% heritable") that feel misused but hard to pin down.
      *   **Goal:** A rigorous, usable *decision procedure* (checklist) that takes 15-20 minutes per claim.
      *   **Output Requirements:**
          *   The checklist itself (questions, sufficient answers, decision points).
          *   Application of the checklist to three specific scenarios.
          *   Honesty about limitations (where 15 mins isn't enough, what the procedure can't solve).
          *   No reading lists/links (style guide issue).
      *   **Tone:** Practical, skeptical, engineering-minded, actionable.

  2.  **Deconstruct the Core Concept (Heritability):**
      *   What are the common pitfalls?
          *   $h^2$ applies to populations, not individuals.
          *   $h^2$ is context-specific (environment matters).
          *   $h^2 \neq$ immutable/unchangeable.
          *   $h^2$ within groups $\neq$ differences between groups.
          *   Study quality (twins, GWAS, sample size).
          *   Wording drift (genetic $\rightarrow$ determined $\rightarrow$ fatalistic).
      *   Which of these are critical for a *copy review*?
          *   The "Individual vs. Population" distinction is the biggest legal/ethical risk.
          *   The "Unchangeable" implication is the biggest product risk (why use the app if it's genetic?).
          *   The "Study Quality" is the biggest credibility risk.

  3.  **Drafting the Decision Procedure (The "15-Minute Gate"):**
      *   *Constraint:* Must be fast. Can't read full papers. Must rely on abstracts, context, and logical consistency.
      *   *Structure:* Sequential filters. If you fail one, stop or escalate.
      *   *Step 1: The Wording Check (Semantic).* Does the copy imply individual determinism?
      *   *Step 2: The Intervention Check (Product Fit).* Does this claim undermine the product's value prop?
      *   *Step 3: The Source Check (Validity).* Is the number from a reputable context (twin study vs. GWAS vs. pop sci)?
      *   *Step 4: The Environment Check (Context).* Is the environment uniform in the study?
      *   *Decision Nodes:* Pass, Fail, Escalate.

  4.  **Refining the Procedure (Iterative Polish):**
      *   *Critique:* Is "Source Check" too hard for an engineer?
      *   *Fix:* Simplify. Look for sample size and study type keywords (Twins, SNP, N=).
      *   *Critique:* How to handle the "Individual vs. Population" nuance without lecturing?
      *   *Fix:* Make it a red-flag keyword search. If copy says "Your genes determine X," that's a fail.
      *   *Timebox:* Assign minutes to each step.

  5.  **Applying the Procedure to the Three Examples:**

      *   **Case 1: PM Copy ("Sleep timing is partly genetic... don't fight it").**
          *   *Wording:* "Partly genetic" is okay. "Don't fight it" implies immutability.
          *   *Product Fit:* Sleep app wants to improve sleep. Telling users not to try contradicts the app.
          *   *Verdict:* High risk. Needs rewrite or escalation.
          *   *Nuance:* Chronotype *is* genetic, but behavior is modifiable.

      *   **Case 2: Blog Draft ("IQ highly heritable... education matters less").**
          *   *Wording:* "Education matters less" is the classic heritability fallacy (within-group vs. between-group/environmental impact).
          *   *Product Fit:* Irrelevant to sleep, high reputational risk.
          *   *Verdict:* Hard Fail. Do not publish.
          *   *Nuance:* This is the "g-factor" political minefield. Even if $h^2$ is high, environment (education) has massive impact.

      *   **Case 3: Marketing Infographic ("Sleep duration is 40% heritable").**
          *   *Wording:* Just a stat. No causal claim.
          *   *Product Fit:* Neutral/Engagement.
          *   *Source:* Need to verify the 40%. Is it twins? Self-report?
          *   *Verdict:* Pass with citation footnote. Low risk if presented as "population variance."

  6.  **Addressing Limitations (The "Honesty" Section):**
      *   I need to explicitly state where this checklist fails.
      *   It can't detect p-hacking.
      *   It can't verify if the specific study applies to *their* user base (e.g., study on Swedes, users in India).
      *   It can't solve the "Advisor Bottleneck" if everything gets escalated.
      *   It relies on the PM/Marketer not lying about what the study says.

  7.  **Final Review against Constraints:**
      *   15-20 mins? Yes, the checklist is designed for skimming.
      *   No reading list? Yes.
      *   Rigorous but usable? Yes, focuses on logical fallacies rather than deep biology.
      *   Tone? Professional, direct.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Initial thought:* Maybe include a step to check confidence intervals.
      *   *Correction:* No, that takes too long and requires stats knowledge they admitted they lack. Stick to conceptual checks.
      *   *Emphasis:* Make sure the "Escalate" criteria are clear so they don't feel forced to decide on everything.
      *   *Formatting:* Use bolding and boxes to make it look like a tool they can print/save.

  9.  **Final Polish:** Ensure the distinction between $h^2$ (heritability) and "inherited" is clear in the examples. Ensure the "Don't fight it" advice in Case 1 is flagged as behavioral advice, not just statistical claim. (This is crucial because a stat can be true, but the advice derived from it can be wrong).

  *(Self-Correction on Case 2)*: Be very firm here. IQ heritability claims linked to education efficacy are scientifically controversial and often associated with harmful ideologies. As a health app, touching this is brand suicide. The checklist must catch this as a "Reputational Risk" even if the stat is technically from a paper.

  *(Self-Correction on Case 3)*: "40% heritable" is actually a safe stat *if* qualified. But marketing often strips qualifiers. The checklist needs to ensure the qualifier ("in studied populations") is near the stat.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is a decision procedure designed for your constraints. It treats science claims like code reviews: looking for logic errors, edge cases, and deployment risks, rather than trying to re-derive the math.

  ### The 15-Minute Heritability Gatekeeper Protocol

  **Goal:** Filter out dangerous misinterpretations without requiring a PhD.
  **Timebox:** 15 Minutes hard stop. If you haven't decided by minute 15, default to **Escalate**.

  #### Phase 1: The Semantic Scan (3 Minutes)
  *Read the proposed copy only. Do not look at the study yet.*

  **Q1: Does the copy apply the percentage to an individual?**
  *   **Look for:** "You are 40% genetic," "Your sleep is determined by genes," "Inherited trait."
  *   **Pass:** "In populations," "Variation in sleep is partly due to," "Studies suggest a genetic component."
  *   **Fail:** Any phrasing that implies the number explains *why* a specific user sleeps the way they do.
  *   **Action:** If **Fail**, rewrite required. Do not proceed until fixed.

  **Q2: Does the copy imply immutability (unchangeability)?**
  *   **Look for:** "Can't change," "Hardwired," "Don't fight it," "Destiny."
  *   **Pass:** "Influenced by," "Associated with," "Baseline may vary."
  *   **Fail:** Any suggestion that high heritability means intervention is useless.
  *   **Action:** If **Fail**, rewrite required. (High heritability $\neq$ unchangeable. Height is highly heritable, but nutrition changed average height drastically).

  **Q3: Does the claim slide from "Individuals" to "Groups"?**
  *   **Look for:** Comparisons between demographics (e.g., "Group A sleeps less due to genetics").
  *   **Pass:** Talking about humans generally or the user base as one pool.
  *   **Fail:** Any claim using heritability to explain differences between distinct groups (nationalities, genders, races).
  *   **Action:** If **Fail**, **Immediate Reject**. This is scientifically invalid and high reputational risk.

  ---

  #### Phase 2: The Source Sanity Check (7 Minutes)
  *Now look at the citation/study abstract provided by the requester.*

  **Q4: Is the study type appropriate for the claim?**
  *   **Look for:** "Twin Study," "GWAS" (Genome-Wide Association Study), "Family Study."
  *   **Pass:** Large sample size (N > 1,000 for twins, N > 10,000 for GWAS). Peer-reviewed journal.
  *   **Fail:** Press release only, blog post citing another blog, N < 100, "Preliminary findings."
  *   **Action:** If **Fail**, **Reject**. The number is noise.

  **Q5: Does the environment in the study match the claim's context?**
  *   **Logic:** Heritability goes *up* when environments are similar. It goes *down* when environments vary wildly.
  *   **Look for:** Where were the subjects? (e.g., "UK Biobank," "US Veterans," "Children in orphanages").
  *   **Pass:** General population in a developed nation (similar to your user base).
  *   **Fail:** Extreme environments (e.g., malnourished populations, institutionalized children) used to make claims about general wellness.
  *   **Action:** If **Fail**, **Escalate**. The number might be real but not applicable to your users.

  **Q6: Is the confidence interval (CI) or range huge?**
  *   **Look for:** "40% (95% CI: 10%–70%)" or "Estimates range from 20% to 60%."
  *   **Pass:** Tight range, or copy acknowledges the range ("approx. 40%").
  *   **Fail:** Copy cites a single precise number (e.g., "42.3%") when the study shows a wide range.
  *   **Action:** If **Fail**, rewrite to reflect uncertainty (e.g., "roughly 40%").

  ---

  #### Phase 3: The Product & Risk Fit (5 Minutes)
  *Step back from the science. Look at the business impact.*

  **Q7: Does this claim undermine our product value?**
  *   **Logic:** If sleep is 100% genetic, why use a sleep tracker?
  *   **Pass:** "Genetics load the gun, environment pulls the trigger" (implies agency).
  *   **Fail:** "It's mostly genetic" (implies futility).
  *   **Action:** If **Fail**, **Reject** or Rewrite to emphasize modifiable factors.

  **Q8: Is this a "Third Rail" topic?**
  *   **Look for:** IQ, Race, Criminality, Political Leanings, Gender Roles.
  *   **Pass:** Sleep duration, Chronotype, Height, Eye Color.
  *   **Fail:** IQ, Behavioral "Scores," Sensitive demographics.
  *   **Action:** If **Fail**, **Escalate to Advisor** regardless of stats. Not worth the brand risk.

  ---

  ### Decision Matrix

  | Result | Action |
  | :--- | :--- |
  | **All Pass** | **Approve.** Add a footnote linking to the study if possible. |
  | **1-2 Rewrites** | **Conditional Approve.** Send back to requester with specific edits. No need to re-review if edits are semantic only. |
  | **Any "Immediate Reject"** | **Block.** Do not publish. |
  | **Any "Escalate"** | **Email Advisor.** Subject line: "SCIENCE REVIEW: [Claim] - Needs Domain Expert." Paste your findings from Phase 2. |
  | **Time Limit Reached** | **Escalate.** Default to caution. |

  ***

  ### Running the Procedure on Your Three Claims

  Here is how you apply the protocol to the specific scenarios you mentioned.

  #### Case 1: The PM's "Night Owl" Copy
  **Claim:** "Your sleep timing is partly genetic, so if you're a night owl, don't fight it."
  **Source:** Heritability estimate for chronotype.

  *   **Phase 1 (Semantic):**
      *   Q1 (Individual?): Pass ("Partly genetic" is okay).
      *   Q2 (Immutability?): **FAIL.** "Don't fight it" implies you *can't* change it or *shouldn't* try. Chronotype is heritable, but behavior is modifiable (light exposure, routines).
      *   Q3 (Groups?): Pass.
  *   **Phase 2 (Source):**
      *   (Skipped due to Phase 1 Fail, but assuming study is decent).
  *   **Phase 3 (Risk):**
      *   Q7 (Product Fit?): **FAIL.** You sell sleep improvement. Telling users not to fight their timing contradicts the app's utility.
  *   **Verdict:** **Reject / Rewrite Required.**
  *   **Engineer's Note to PM:** "The stat might be true, but the advice is logically invalid. High heritability doesn't mean behavior can't be managed. Also, telling users to give up hurts retention. Change copy to: 'Your timing has a genetic baseline, but you can optimize around it.'"
  *   **Escalate?** No. This is a logic error, not a complex genetics question.

  #### Case 2: The Blog Draft on IQ
  **Claim:** "IQ is highly heritable, which tells us education matters less than people think."
  **Source:** Unspecified heritability study.

  *   **Phase 1 (Semantic):**
      *   Q1 (Individual?): Pass (Talking generally).
      *   Q2 (Immutability?): **FAIL.** "Education matters less" is the classic heritability fallacy. (Height is highly heritable, but average height increased 4 inches in a century due to nutrition/environment).
      *   Q3 (Groups?): **FAIL.** Implicitly comparing educated vs. non-educated groups via genetics.
  *   **Phase 2 (Source):**
      *   (Skipped, claim is logically unsound regardless of source).
  *   **Phase 3 (Risk):**
      *   Q8 (Third Rail?): **FAIL.** IQ + Genetics + Education is a reputational minefield.
  *   **Verdict:** **Immediate Reject.**
  *   **Engineer's Note to Content:** "This is a known statistical fallacy (Heritability $\neq$ Inevitability). Publishing this makes us look scientifically illiterate and invites PR backlash. Kill this angle."
  *   **Escalate?** No. You don't need an advisor to tell you this is a brand risk.

  #### Case 3: The Marketing Infographic
  **Claim:** "Sleep duration is 40% heritable."
  **Source:** Twin study meta-analysis.
  **Context:** Fun fact stat, no advice given.

  *   **Phase 1 (Semantic):**
      *   Q1 (Individual?): **Borderline.** It doesn't say "You are," but infographics often imply personalization.
      *   Q2 (Immutability?): Pass (No advice given).
      *   Q3 (Groups?): Pass.
  *   **Phase 2 (Source):**
      *   Q4 (Study Type): Pass (Assuming it's a standard twin meta-analysis, these usually exist for sleep).
      *   Q5 (Environment): Pass (Assuming general population).
      *   Q6 (Precision): **Check.** Does the infographic say "40%" or "Approx 40%"? If it implies exact precision, ask them to add "Approx."
  *   **Phase 3 (Risk):**
      *   Q7 (Product Fit): Pass. It's a neutral fun fact.
      *   Q8 (Third Rail): Pass. Sleep duration is safe.
  *   **Verdict:** **Conditional Approve.**
  *   **Engineer's Note to Marketing:** "Add 'in studied populations' or 'on average' next to the stat. Don't let it look like a personal score. Ensure the citation is in the footer."
  *   **Escalate?** No. This is a standard use of the statistic.

  ***

  ### Where This Procedure Fails (The "Unknown Unknowns")

  You asked for honesty about where your 15 minutes runs out. Here is where you are still guessing:

  1.  **The "File Drawer" Problem:** You cannot know in 15 minutes if the study provided is the *only* study that found this result while 10 others found nothing. You are trusting that the requester didn't cherry-pick.
      *   *Mitigation:* If the number looks suspiciously clean (e.g., exactly 50%), ask for "Is this a meta-analysis or a single study?" Meta-analysis wins.
  2.  **Population Mismatch:** A study on 60-year-old Swedish men might say sleep is 30% heritable. Your users are 25-year-old Americans. The number might be wrong for your users, but you can't verify that quickly.
      *   *Mitigation:* If the demographic in the abstract looks wildly different from your users, **Escalate**.
  3.  **Causality vs. Correlation:** Some "heritability" estimates in older papers capture shared environment (parents who sleep late also let kids stay up late) and mistake it for genetics. Newer methods (GWAS) are better but harder to read.
      *   *Mitigation:* If the paper is older than 10 years, **Escalate**. Genetics moved fast in the last decade.
  4.  **The Advisor Bottleneck:** If you escalate everything that smells weird, your advisor will hate you.
      *   *Mitigation:* Use the **Phase 1 (Semantic)** filters to kill 80% of the bad stuff before it ever needs scientific validation. Most claims die because the *copy* is wrong, not because the *science* is wrong.

  ### Summary for your Standup
  If anyone asks what you're doing: "I'm implementing a validation gate for science claims to reduce liability and ensure product-market fit. It filters out logical fallacies before we bother the subject matter experts."
