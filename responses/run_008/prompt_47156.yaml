answer: |-
  Hi there,

  It is genuinely refreshing to read a summary of the evolutionary debunking literature that captures the dialectic so accurately without getting bogged down in the usual introductory fluff. You have clearly done the reading, and your hypothesis that this is fundamentally a disagreement about epistemological standards rather than evolutionary science or moral phenomenology is sharp. In fact, I would go so far as to say you have identified the engine of the stalemate, though I think there is a layer beneath that epistemological layer which explains why neither side is willing to blink on those standards. If I were to diagnose the situation in a single sentence, I would say this is a clash of reflective equilibria where the epistemological disagreement is actually a proxy for a deeper disagreement about the ontological cost of moral realism.

  You are absolutely right that the science is not the battleground. Both Sharon Street and David Enoch agree that evolution shaped our moral faculties to promote survival and reproduction. They agree that if moral truths are independent of our attitudes, there is no direct causal link from those truths to our brains. The fight is entirely over what counts as a legitimate explanation for the alignment between those faculties and the truth. When Street says the third-factor reply begs the question, she is enforcing a strict independence requirement on justification. She is effectively saying that if you want to prove your moral faculties are reliable, you cannot use moral premises to do it, because the reliability of those very premises is what is in doubt. To her, using the claim that survival is good to prove that our survival-oriented judgments are true is like using a crystal ball to prove that crystal balls are reliable. It is circular in a vicious way.

  However, when Enoch and other realists push back, they are not just being stubborn about circularity. They are arguing that Street's independence requirement is too strong for any domain of knowledge. This is where your point about epistemic conservatism hits the mark. The realist argues that we never justify our perceptual faculties without relying on perceptual evidence. If you doubt your eyes, you cannot step outside your vision to check them. You have to use vision to check vision. So, if the skeptic demands a non-circular justification for moral faculties that they do not demand for perceptual faculties, they are holding morality to a unique and unfair standard. The disagreement here is indeed about whether moral intuition is relevantly similar to perception. If you think moral properties are natural properties like water or heat, the analogy to perception holds well, and the debunking argument loses force. If you think moral properties are non-natural, Platonic entities that do not interact with the physical world, then the analogy to perception breaks down, because perception works via causal interaction.

  This is where I want to push back slightly on your hypothesis that the disagreement is purely epistemological. I think the reason the epistemological standards are so entrenched is that they are doing heavy lifting for metaphysical commitments. The reason Street insists on such a strict independence requirement is that she views moral truths as attitude-independent in a way that makes them causally inert. If moral facts are out there in a non-natural realm, how could evolution possibly track them without a miracle? The epistemological demand for non-circular justification is a way of highlighting this metaphysical weirdness. Conversely, the reason realists resist that demand is that accepting it would force them into an error theory or antirealism, which they find theoretically costly. They are willing to accept a degree of epistemic circularity because the alternative is abandoning the objective status of morality, which they view as a higher cost. So the stall is not just about what counts as a good argument; it is about which theoretical cost is higher: accepting a potentially circular epistemology or abandoning moral realism.

  You asked whether anything could count as progress here, or if the stall is permanent. I think the stall is permanent in the sense that we will not see a knockdown argument that forces one side to concede defeat. There is no neutral ground from which to judge the dispute because any neutral ground would itself rely on epistemic principles that are contested. However, progress is still possible if we stop looking for a knockout punch and start looking for a better mapping of the theoretical costs. The literature has actually moved in this direction since 2010, even if it feels repetitive. Philosophers like Katia Vavova have refined the debate by asking exactly how much independence is required. She argues that we do not need total independence from our moral beliefs to justify them, but we do need some independent check. The progress lies in specifying what counts as an independent check. For example, if we can show that moral reasoning involves a kind of coherence testing that is distinct from mere evolutionary conditioning, that might satisfy a weakened independence requirement without begging the question.

  Another avenue for progress that has not been fully exhausted is the probabilistic framing of the coincidence objection. Street argues that the alignment between evolution and moral truth is improbable. Realists argue it is not. This looks like a factual disagreement, but it is actually a disagreement about probability distributions over metaphysical spaces. If you think there are many possible moral truths, the chance of hitting the right one by evolution is low. If you think moral truths are constrained by the nature of rational agency or flourishing, the space of possible truths is smaller, and the chance of evolution hitting them is higher. Progress here would require a clearer account of the modal space of moral truths. If realists can show that moral truths are necessary in a way that makes them easy to hit, the coincidence objection weakens. If antirealists can show that the space of possible moral codes is vast and evolution only selected one specific cluster for fitness reasons, the coincidence objection strengthens. This is not empirical progress, but it is conceptual progress that clarifies the stakes.

  There is also the possibility that the debate is conflating two different questions, as you suggested. One question is whether moral facts exist. The other is whether we are justified in believing in them. Evolutionary debunking arguments are often presented as metaphysical arguments that show moral facts do not exist, but they are actually epistemological arguments that show we are not justified in believing in them. If moral facts exist but we cannot know them, realism is still true, but it is idle. Some realists are willing to accept this skeptical realism. Acknowledging this distinction might dissolve some of the heat. If the debate is reframed as "Can we know moral truths?" rather than "Are there moral truths?", the third-factor replies look different. Enoch is arguing we can know them; Street is arguing we cannot. That is a cleaner disagreement than arguing about the existence of the facts themselves.

  Ultimately, I think your hypothesis is largely correct that this is a dispute about epistemic standards, specifically regarding circularity and conservatism. But I would add that these standards are not chosen arbitrarily. They are selected because they protect deeper metaphysical intuitions. The reason the literature feels like it is looping is that both sides have reached a reflective equilibrium where their epistemology, metaphysics, and scientific understanding cohere internally. Street's system is coherent. Enoch's system is coherent. They just start from different foundational priorities. Street prioritizes a naturalistic explanation of knowledge that avoids spooky coincidence. Enoch prioritizes the objective validity of moral claims and is willing to adjust his epistemology to save them.

  So, is the stall permanent? In the sense of a final resolution, yes. We are not going to find a premise that both sides must accept that forces a conclusion. But in the sense of understanding, there is still work to be done. The progress lies in making the trade-offs explicit. Instead of trying to prove the other side wrong, the best work in this area now focuses on showing what you have to give up to hold each position. If you side with Street, you have to explain how you avoid global skepticism about all normative domains, including logic and epistemology itself. If you side with Enoch, you have to explain how your moral epistemology does not allow for obviously false beliefs to be justified by circular reasoning. The debate has shifted from who is right to who has the less costly error theory.

  I think you are right to feel that no new empirical discovery will move the needle. Finding out that evolution influenced us more or less than we thought does not solve the philosophical problem of how to bridge the gap between is and ought. The only thing that could change the dynamic is a breakthrough in meta-epistemology that gives us a new way to understand justification itself, perhaps one that dissolves the distinction between circular and non-circular reasoning in a way that satisfies both sides. Until then, the debate will remain a sophisticated negotiation over theoretical virtues rather than a search for a missing fact. You have diagnosed the situation correctly: it is a clash of epistemic standards driven by metaphysical commitments, and the stagnation is a feature of the problem, not a failure of the philosophers involved. The best thing to do is to recognize that both sides are offering a coherent package deal, and the choice between them is ultimately a matter of which set of costs you are more willing to bear.

  I hope this helps clarify why you are seeing the same moves repeated. It is not that nobody has thought of a new argument; it is that the available logical space has been mapped out, and we are now just weighing the furniture.
