answer: |-
  This is a sharp request. You are asking for the engineering specifications of a philosophical theory, not just a summary of the debate. You want to know what the machine *must do* before you care how the gears look.

  Here is the spec for an adequate account of knowledge-how, derived from your cases and distinctions, with confidence ratings and tension flags.

  ### The Spec: Desiderata for Knowledge-How

  **1. The Possession/Execution Distinction**
  *   **Requirement:** The theory must allow an agent to possess knowledge-how even if they cannot currently execute the action due to external or physical constraints.
  *   **Forcing Case:** **Your Dad.** He has the navigational/strategic map of sailing, but the "engine" (motor control) is broken. If the theory says he *doesn't* know how to sail, it fails our intuitive use of the concept for praising/identity purposes.
  *   **Confidence:** **0.85 (High).** This is a robust intuition in ordinary language ("I know how to swim, I just have a broken leg"). However, it risks conflating *memory of procedure* with *competence*.
  *   **Status:** **Real Constraint.** If a theory collapses this, it cannot handle disability, injury, or temporary impediment.

  **2. The Guidance Constraint (Knowledge vs. Mere Ability)**
  *   **Requirement:** The theory must distinguish between blind causal capacity and guided performance. The agent must be responsive to norms (correcting errors, adapting to goals).
  *   **Forcing Case:** **The Sleepwalker/Drunk Driver.** They have the *ability* to walk/drive, but we deny they *know how* in the relevant sense because the activity is not under cognitive guidance.
  *   **Confidence:** **0.9 (Very High).** This is the bedrock of the distinction between a reflex and a skill.
  *   **Status:** **Real Constraint.** Any theory that makes know-how purely mechanical fails here.

  **3. The Articulation Gap**
  *   **Requirement:** The theory must allow for knowledge-how that exceeds the agent's ability to articulate the rules governing the action.
  *   **Forcing Case:** **The Chicken-Sexer.** She succeeds reliably but lacks the propositional vocabulary to explain *why*.
  *   **Confidence:** **0.75 (Medium-High).** While strong, some Intellectualists argue she *does* have propositional knowledge, it's just non-linguistic or subconscious.
  *   **Status:** **Real Constraint (with caveats).** A theory requiring explicit verbalization is dead on arrival. A theory requiring *implicit* propositional structure is still in the game.

  **4. The Theory/Practice Asymmetry**
  *   **Requirement:** The theory must explain why knowing the rules/propositions is neither necessary nor sufficient for knowing how to do the thing.
  *   **Forcing Case:** **The German Student (Sufficient fail) & The Ski Instructor (Necessary fail).** The student has the rules but no skill; the instructor has the skill (pedagogically) but no physical capacity (in your framing).
  *   **Confidence:** **0.8 (High).** This blocks the reduction of know-how to know-that.
  *   **Status:** **Real Constraint.** This is the primary battleground between Intellectualists and Anti-Intellectualists.

  **5. The Adaptability Condition**
  *   **Requirement:** Knowledge-how must involve a capacity to handle novel situations, not just retrieve cached responses.
  *   **Forcing Case:** **The Improviser.** If know-how were just a lookup table of stimulus-response pairs, improvisation would be impossible.
  *   **Confidence:** **0.7 (Medium).** Some behaviors are rote (tying shoelaces). We need to distinguish *routine* know-how from *expert* know-how.
  *   **Status:** **Camp Flag (Partial).** Demanding *high-level* adaptability for *all* know-how might be too strict. Tying a tie is know-how, even if you can't tie it on a 4D hypercube.

  **6. The Command/Context Distinction**
  *   **Requirement:** The theory must distinguish between "knowing how to do X on demand" vs. "knowing how to do X when the situation arises."
  *   **Forcing Case:** **The Chess App vs. Human Player.** The App can explain on demand (propositional) but fails in context (playing). A human might play well but fail to explain.
  *   **Confidence:** **0.65 (Medium).** This is subtle. Often we treat these as the same thing. Separating them requires a complex architecture of "practical modes of presentation."
  *   **Status:** **Camp Flag.** This might be a distinction in *performance conditions* rather than the nature of the knowledge itself.

  **7. The Normative Attribution Condition**
  *   **Requirement:** The theory must support attributions of praise, blame, and hiring decisions.
  *   **Forcing Case:** **Hiring/Firing.** We hire the Chicken-Sexer, not the German Student. We praise your Dad for his knowledge, not the drunk driver.
  *   **Confidence:** **0.9 (Very High).** This is your stated purpose. If the theory doesn't work for HR or family dynamics, it's useless.
  *   **Status:** **Real Constraint.** Pragmatic adequacy.

  ---

  ### The Tensions: Joint Unsatisfiability

  You asked if any subset of these is jointly unsatisfiable. **Yes.** There is a "Impossible Trinity" here involving **Intellectualism**, **The Chicken-Sexer**, and **The German Student**.

  1.  **If Know-How is Propositional (Intellectualism):** You struggle to explain the **Chicken-Sexer** without positing invisible, subconscious propositions. You also struggle to explain why the **German Student** (who has the propositions) *doesn't* know how.
  2.  **If Know-How is Pure Ability (Anti-Intellectualism):** You struggle to explain **Your Dad**. If the ability is gone, the knowledge is gone. You also struggle to explain the **Ski Instructor** (if she can't ski, does she know how?).
  3.  **If Know-How is a Hybrid:** You risk making the theory so complex it loses explanatory power (the "centaur" problem).

  **Specific Conflict:** **Desideratum 1 (Possession without Execution)** vs. **Desideratum 3 (Articulation Gap)** under a strict **Intellectualist** framework.
  If you demand know-how be fully propositional (to save the German Student case), you make it hard to account for the Chicken-Sexer (who has no propositions). If you demand know-how be non-propositional (to save the Chicken-Sexer), you make it hard to account for Your Dad (who has no ability, so where is the non-propositional state located?).

  **Verdict:** You cannot have a theory that is *reductively* propositional AND handles the Chicken-Sexer AND handles Your Dad without adding significant epicycles (e.g., "practical modes of presentation" that are not linguistic).

  ---

  ### The Exclusionary Requirement

  Which single requirement does the most work excluding candidate theories?

  **Desideratum 1: The Possession/Execution Distinction (Your Dad).**

  *   **Why:** This is the hardest filter. Pure Dispositionalism (Rylean Anti-Intellectualism) defines know-how as a complex of dispositions to act. If the stroke destroyed the physical disposition to act, strict Dispositionalism must say your Dad *lost* the knowledge. To save this, the Anti-Intellectualist must move the disposition from the muscles to the brain, which starts looking suspiciously like a mental state (Intellectualism).
  *   **Impact:** It kills "Hard" Ability theories immediately. It forces "Soft" Ability theories to become hybrid theories. It puts pressure on Intellectualists to explain why the German Student (who has the mental state) fails while Dad (who has the mental state) succeeds.

  ---

  ### Scorecard: The Two Contenders

  **1. Intellectualism (Stanley & Williamson)**
  *   *Thesis:* Knowing how to $\phi$ is knowing a proposition $p$ about the way to $\phi$, under a practical mode of presentation.
  *   **Score:**
      *   **Dad:** **Pass.** He retains the proposition/neural map.
      *   **German Student:** **Fail (needs patch).** Must explain why his "practical mode" is defective despite having the propositions.
      *   **Chicken-Sexer:** **Fail (needs patch).** Must posit unconscious propositions.
      *   **Chess App:** **Pass.** The App lacks the "practical mode of presentation," it only has the proposition.
  *   **Verdict:** Good for your Dad, bad for the Chicken-Sexer without heavy modification.

  **2. Anti-Intellectualism / Ability View (Ryle, Hawley)**
  *   *Thesis:* Knowing how is a complex of dispositions to succeed, guided by norms.
  *   **Score:**
      *   **Dad:** **Fail.** No disposition to succeed = no know-how. (Unless "disposition" is redefined as neural potential, which blurs the line).
      *   **German Student:** **Pass.** No success disposition = no know-how.
      *   **Chicken-Sexer:** **Pass.** Success + Normativity = Know-how.
      *   **Drunk Driver:** **Pass.** Lack of normative guidance = No know-how.
  *   **Verdict:** Good for hiring/assessment, bad for disability/memory cases.

  ---

  ### Confidence & Uncertainty Flag

  **Confidence in Requirements:**
  *   **Guidance & Normative Attribution:** 0.9 (These are functional necessities).
  *   **Possession/Execution:** 0.85 (Strong intuition, but metaphysically tricky).
  *   **Articulation Gap:** 0.75 (Intellectualists fight hard here).
  *   **Command/Context:** 0.65 (This might be a performance variable, not a knowledge variable).

  **Point of Least Certainty:**
  **The Status of the Ski Instructor.**
  I am least sure whether the Ski Instructor *actually* knows how to ski.
  *   **Option A:** She knows how to *teach* skiing, which is a different skill than *skiing*. If so, this case drops out of the spec.
  *   **Option B:** She knows the theory of skiing perfectly, which counts as a form of know-how.
  *   **Why it matters:** If Option A is true, the "Theory/Practice Asymmetry" (Desideratum 4) loses one of its legs. If Option B is true, it puts massive pressure on Anti-Intellectualism.
  *   **Honest Assessment:** This is the weakest link in the spec. It relies on the intuition that pedagogical knowledge is a species of practical knowledge. It might just be theoretical knowledge *about* practice. I rate my confidence that this is a valid constraint at **0.5**.

  **Final Advice for the Argument:**
  Your brother is using the **Chess App** to argue that explanation $\neq$ ability. You are using **Dad** to argue that ability $\neq$ knowledge.
  *   **Winning Move:** Concede that "Know-How" is ambiguous. There is **Know-How$_{internal}$** (the map/competence, which Dad has) and **Know-How$_{external}$** (the successful performance, which Dad lacks).
  *   **Practical Application:** For *praising* Dad, use Know-How$_{internal}$. For *hiring* a skipper, use Know-How$_{external}$.
  *   **Theory Check:** Any theory that cannot distinguish these two is insufficient for your purposes.

  If a theory can't tell the difference between a broken boat and a broken sailor, throw it out.
