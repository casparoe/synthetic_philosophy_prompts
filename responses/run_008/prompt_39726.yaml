answer: |-
  # The "What Counts as Sick?" Quiz

  **Intro:** We all agree that cancer is a disease and having five fingers is normal. But the middle ground is messy. Is aging a disease? What if everyone in your village has the same "symptom"? Is a condition still a disorder if the person living with it is happy?

  This quiz isn't about what you think is *treatable*, but what you think counts as *disease* in the first place. Read the nine cases below and pick the answer that feels most right. Don't overthink it—go with your gut.

  ***

  ### 1. The Universal Decline (Aging)
  Everyone gets wrinkles, slower healing, and weaker muscles eventually. It's universal, it's evolved, and it makes you more likely to die.
  *   **A.** It's the natural lifespan of our species. Calling it a "disease" is a category error.
  *   **B.** It causes suffering and physical failure. If we can treat it, we should call it a medical condition.
  *   **C.** It depends on whether you're trying to cure death or just care for the elderly.

  ### 2. The Village Goiter
  In a remote village, the water lacks iodine. Literally everyone has an enlarged thyroid (goiter). It's statistically normal there, but biologically, thyroids aren't supposed to swell.
  *   **A.** A thyroid has a specific job. If it's swollen, it's malfunctioning, even if everyone has it.
  *   **B.** If it's the standard for that community and doesn't stop them living, calling it "disease" is just medical imperialism.
  *   **C.** It's a biological dysfunction, but it only becomes a "health problem" if the villagers want it fixed.

  ### 3. The Super-Seer (Tetrachromacy)
  A woman has a genetic mutation giving her four color cones instead of three. She sees color distinctions no one else can. It's rare, but it's an advantage.
  *   **A.** It's a statistical deviation from the species-typical design. Technically, it's an abnormality.
  *   **B.** It's a benefit, not a harm. Labeling it a "disorder" would be absurd.
  *   **C.** It's a medical "condition," but we shouldn't use value-loaded words like disease or health.

  ### 4. The Deaf Community Member
  A woman has been profoundly deaf since birth. She doesn't feel "broken," speaks sign language, and is part of a culture that views deafness as an identity, not a loss.
  *   **A.** Her auditory system does not function to the species-typical level. It is a disorder.
  *   **B.** Disease requires harm. If she is flourishing, there is no disease, only difference.
  *   **C.** "Disorder" is a social label used by the hearing majority to enforce normalcy.

  ### 5. The Long Grief
  A woman's husband dies. She is intensely sad, loses weight, and can't work for 8 months. The DSM (psychiatry's rulebook) used to say this is normal bereavement, but now it might count as Major Depression.
  *   **A.** Her brain chemistry and functioning are disrupted beyond normal parameters. It's depression.
  *   **B.** Grief is a natural mechanism. It's only a disorder if it becomes self-sustaining and blocks her future life.
  *   **C.** The line between "sadness" and "depression" is drawn by insurance companies and doctors, not nature.

  ### 6. The Short Kid
  A boy is the shortest in his class. Lab tests show his growth hormone is normal. He is healthy but gets bullied. His parents want growth hormone so he stops getting picked on.
  *   **A.** His growth mechanisms are working as designed. Treating him is enhancement, not medicine.
  *   **B.** He can't achieve his social goals (fitting in). If medicine can fix that barrier, it's a health issue.
  *   **C.** We are medicalizing a social problem (bullying) instead of fixing the school.

  ### 7. The Silent Risk (Hypertension)
  A man has high blood pressure. He feels perfectly fine, has no symptoms, and achieves all his life goals. But statistically, he is at high risk of a stroke in 10 years.
  *   **A.** His cardiovascular system is operating outside safe statistical limits. He is diseased now.
  *   **B.** He isn't harmed yet. He's just "at risk." Disease requires current failure or symptoms.
  *   **C.** We call it a disease to scare him into taking pills. It's a preventive label, not a factual one.

  ### 8. The Childfree Infertility
  A woman has a blocked fallopian tube. Biologically, she cannot conceive. However, she is happily childfree and never wants children.
  *   **A.** Her reproductive system is failing its evolutionary function. It is a dysfunction.
  *   **B.** A dysfunction only matters if it causes harm. Since she doesn't want kids, she isn't sick.
  *   **C.** "Infertility" is only a disease relative to the goal of reproduction. No goal, no disease.

  ### 9. The Successful Psychopath
  A CEO has no empathy and feels no guilt (psychopathic traits). He is incredibly successful, never gets caught breaking laws, and feels no distress.
  *   **A.** The brain mechanisms for social bonding are broken. It's a mental disorder.
  *   **B.** He functions well and isn't harmed. Calling it a disorder is just a moral judgment on his behavior.
  *   **C.** It's a mix: biologically different, but "disorder" is just how we label people who scare us.

  ***

  # Scoring Key

  To get your result, you need to tally your points. Each answer choice awards points to different philosophical "buckets." Don't worry if the math feels fussy; it's designed to catch the nuances.

  **The Buckets:**
  *   **BOORSE (Bio-Stats):** Disease is a biological fact, independent of values.
  *   **WAKEFIELD (Harm + Dysfunction):** Needs a biological glitch PLUS social harm.
  *   **NORDENFELT (Vital Goals):** Health is the ability to achieve *your* specific goals.
  *   **NORMATIVIST (Values):** Disease is purely a label for "bad things."
  *   **PLURALIST (The Mess):** There is no single definition; it depends on context.

  **The Tally:**
  Go through your 9 answers. For each letter you picked, add the points below to your total.

  *   **Q1:** A=+2 Boorse, B=+2 Normativist, C=+2 Pluralist
  *   **Q2:** A=+2 Boorse, B=+2 Normativist, C=+2 Wakefield
  *   **Q3:** A=+1 Boorse, B=+2 Normativist, C=+2 Pluralist
  *   **Q4:** A=+2 Boorse, B=+2 Wakefield, C=+2 Normativist
  *   **Q5:** A=+2 Boorse, B=+2 Wakefield, C=+2 Normativist
  *   **Q6:** A=+2 Boorse, B=+2 Nordenfelt, C=+2 Normativist
  *   **Q7:** A=+2 Boorse, B=+2 Nordenfelt, C=+2 Normativist
  *   **Q8:** A=+2 Boorse, B=+2 Wakefield, C=+2 Nordenfelt
  *   **Q9:** A=+2 Boorse, B=+2 Wakefield, C=+2 Normativist

  *(Note: Some answers award points to multiple buckets in spirit, but for simplicity, we assigned primary weights. If you picked a mix of A's and B's, you're likely a Hybrid.)*

  **Calculate your percentages:**
  Sum your total points (should be roughly 18). Divide each bucket's score by the total to get a percentage.

  **What Your Mix Means:**

  *   **>50% BOORSE:** **The Biological Realist.** You think disease is about broken parts, period. If the biology is off, it's a disease, even if the person is happy (like the childfree infertility case). You worry that letting values in makes medicine political.
  *   **>50% WAKEFIELD:** **The Harmful-Dysfunction Detective.** You want the best of both worlds. You demand a biological mechanism failure *and* proof that it hurts someone. You're the person asking, "Yes, but is he suffering?"
  *   **>50% NORDENFELT:** **The Pragmatic Humanist.** You care about what the patient can *do*. If high blood pressure doesn't stop the guy living his life, you're skeptical of the label. If short stature stops a kid from making friends, you're open to treatment.
  *   **>50% NORMATIVIST:** **The Social Critic.** You think "disease" is a word we use to police normality. You're suspicious of medicalizing grief, aging, or deafness. You see power dynamics where others see biology.
  *   **>50% PLURALIST:** **The "It's Complicated" Club.** You picked option C a lot. You think we use "disease" to mean different things in different contexts. You're comfortable with contradiction.
  *   **MIXED RESULTS (e.g., 40% Boorse, 40% Wakefield):** **The Defensible Hybrid.** This is the most common result for working doctors. You might treat hypertension as a disease (Boorse) because of future risk, but refuse to treat grief as depression (Wakefield) because the mechanism is natural. This isn't confusion; it's practical wisdom.

  ***

  # Editor's Note: Where the Quiz Fails (Meta-Analysis)

  We asked the authors to flag where this quiz can't do the heavy lifting. Here's the honest breakdown:

  **1. The Boorse vs. Wakefield Blind Spot**
  These two positions agree about 85% of the time. Both require a biological dysfunction. They only split when there is **Dysfunction without Harm**.
  *   *The Divider:* **Question 8 (Childfree Infertility)** is the only question that truly separates them.
      *   Boorse says: "Reproductive function failed = Disease."
      *   Wakefield says: "Function failed, but no harm = Not Disease."
  *   If you answered **A** on Q8 but **B** on Q4 (Deafness), your position is theoretically unstable. You're saying biological failure matters more than harm in one case, but harm matters more in the other. That's a defensible *hybrid*, but not a consistent *theory*.

  **2. Incoherent Combinations**
  *   **The "Magic Biology" Combo:** If you scored high on **Boorse** (Biology is king) but also high on **Normativism** (Values are king), you have a problem. You can't claim disease is value-free *and* that it's purely a social label.
      *   *Why it happens:* Usually, readers pick "Bio" on cancer questions and "Social" on grief questions.
      *   *Verdict:* This is actually a **Pluralist** stance disguised as a contradiction. It's not a bug; it's a feature of how we talk.

  **3. Unoccupied Logical Space**
  *   **Harm without Dysfunction:** There is a slot for "This causes suffering but isn't a biological failure." (e.g., Poverty, Heartbreak).
      *   *Literature Status:* Almost no one calls this "disease." If you scored high on **Normativism** here, you might believe society *should* medicalize these problems. This is a radical view (sometimes called "Medical Humanism"), but it's largely unoccupied in standard philosophy of medicine because it risks making *everything* a disease.
  *   **Dysfunction without Reference Class:** Boorse relies heavily on "Reference Classes" (age, sex). If you think a 90-year-old's failing kidneys are just as "diseased" as a 20-year-old's, you've rejected the Reference Class requirement. This view exists but is rare because it makes aging a disease.

  **4. The "Family Resemblance" Leaf**
  If you landed on **Pluralist**, you're in good company. Many philosophers (and clinicians) now argue that "disease" is a "cluster concept." It doesn't have one necessary condition. It's like "game"—some have balls, some have boards, some have winners, but no single rule covers all games. If your results were a mess, congratulations: you might be the most philosophically honest person in the room.
