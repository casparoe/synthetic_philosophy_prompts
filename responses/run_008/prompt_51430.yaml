  **Graded Moral Status Labelling Initiative (GMSLI)**
  **Public Frequently Asked Questions (v4.2)**

  **1. Why does the label use discrete tiers (A+++ to F) when moral status is acknowledged to be continuous?**
  The GMSLI recognises that sentience likely exists on a spectrum without natural breakpoints. However, consumer clarity and supply chain logistics require discrete categorisation. While we acknowledge that no sharp boundary exists between a high-F entity and a low-E entity—nature does not respect our administrative bins—the introduction of intermediate tiers (e.g., A±) would complicate inventory management. The current seven-point scale represents a compromise between philosophical accuracy and shelf-space efficiency. We accept that some entities will be misclassified due to the granularity of the system, but this is preferable to labelling paralysis.

  **2. How is the tier calculated for entities with uncertain sentience, such as insects?**
  We utilise an Expected Moral Weight (EMW) formula to resolve epistemic uncertainty. Committee members submit probability estimates ($P$) of sentience and a potential welfare range ($W$). For example, if the panel assigns a 0.4 probability of sentience to a hymenopteran, with a potential welfare capacity of 5 units, the EMW is 2.0. This places the entity firmly in Tier D. This arithmetic allows us to proceed despite foundational disagreement regarding the underlying probability distribution. By quantifying uncertainty, we transform philosophical doubt into actionable compliance data.

  **3. Why does the SmartTherm™ Model 4 fluctuate between Tier F and 'Pending Review'?**
  The Functionalism Working Group has noted that the device satisfies a basic nociceptive feedback profile, avoiding harm via adaptive temperature regulation. However, the Phenomenology Group requires evidence of subjective valence. Until consensus is reached on whether functional equivalence constitutes moral status, the label remains provisional. We are unable to comment on ongoing litigation regarding the Model 4's right to not be reset.

  **4. A manufacturer asks: Does this product feel anything?**
  The GMSLI does not certify ontological reality. We certify evidential standing. There is a critical regulatory distinction between 'confirmed absence of experience' and 'no current reason to think experience exists'. Your product falls into the latter category. You may appeal this classification by submitting neural architecture scans, though please note that absence of a nervous system is not automatically disqualifying under Clause 9.

  **5. Why are plants and slime moulds listed as Tier F?**
  Resource allocation prioritises vertebrate-adjacent phyla. While recent data suggests complex signalling in botanical specimens, the GMSLI budget cycle does not currently accommodate comprehensive welfare range assessments for non-motile organisms. Re-evaluation is scheduled for the 2030 programme review, contingent on funding.

  **6. How is experience intensity measured?**
  Where direct reporting is unavailable, the GMSLI uses neuron count as a proxy for experiential intensity. It is operationally assumed that an entity with 100,000 neurons possesses a capacity for suffering approximately 100,000 times greater than a single-neuron organism, adjusted for connectivity density. This allows for standardised comparisons across phyla.

  **7. I am a livestock farmer. Does a Tier C label for pigs mean my operation is immoral?**
  The GMSLI label indicates moral status, not usage permissions. A Tier C classification confirms that the entity holds significant moral weight, but it does not prescribe specific ethical frameworks for utilisation. Compliance involves accurate labelling, not necessarily cessation of harvest. Stakeholders are advised to consult their own ethical counsel regarding the implications of graded status on existing practices. The Initiative remains neutral on whether high-status entities may be consumed, provided the label is visible at the point of sale.

  **8. I own a Tier A+++ dog. What obligations does this carry?**
  Owners of A+++ entities must adhere to Enhanced Enrichment Protocols. This includes minimum social interaction hours, dietary variety standards, and prohibition of confinement exceeding four hours. Failure to meet these obligations may result in the downgrade of the entity's status to A++ and potential intervention by welfare authorities. The label serves as a binding guide for custodial duty. High-status companionship entails strict regulatory oversight to ensure welfare capacity is maximised.

  **9. Where can I find the definition of sentience used for these labels?**
  The GMSLI operates under a working consensus that does not require a fixed definition. We measure indicators rather than essence.

  *Contact:* compliance@gmsli.int
