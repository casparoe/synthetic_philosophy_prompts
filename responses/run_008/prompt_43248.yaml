      *   Van Inwagen says artifacts don't exist. I need to explicitly state that the museum *rejects* Van Inwagen's ontology for the sake of function, adopting a "Functional Essentialism" instead. We treat artifacts *as if* they are living organisms (they have a "life" or function).

