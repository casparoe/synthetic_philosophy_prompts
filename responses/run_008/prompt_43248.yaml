answer: |-
  # Museum Composition Protocol (MCP)
  **Version 1.0 | Office of the Registrar**

  ## 1. Preamble: The Metaphysical Compromise
  This procedure acknowledges that cataloging is an ontological act. When we assign a number, we assert that *this* is one thing and *that* is another. Philosophers call this the **Special Composition Question**. To ensure consistency, we must adopt a stance, even if pragmatic.

  We have evaluated the standard metaphysical positions:
  *   **Nihilism:** (Nothing composes anything.) *Rejected.* We cannot catalog dust motes.
  *   **Universalism:** (Anything composes anything.) *Rejected.* A shoebox of bones cannot be one object simply because they share a box.
  *   **Van Inwagen's Life Constraint:** (Composition occurs only in living organisms.) *Rejected, with caveat.* Literally applied, this means no artifact exists. A teapot is not an object; it is simples arranged teapot-wise. We cannot operate a museum on this basis.
  *   **Common-Sense Restricted:** (Composition occurs when parts are fastened, functional, or share a fate.) *Adopted.*

  **The Museum Composition Principle:**
  We treat artifacts *as if* they are living organisms. Where Van Inwagen requires "life," we require **Functional Integrity**. An assemblage counts as a single catalog object if it possesses a unified function, physical connection, or contextual identity that would be destroyed by separation. Where metaphysics and administration conflict, administration yields to **Insurance Liability** and **Loan Flexibility**, unless overridden by Legacy or Lender constraints.

  ---

  ## 2. The Decision Procedure
  **Time Limit:** 10 Minutes per item.
  **Operator:** Registrar or Student Assistant.
  **Escalation:** Curator of Record.

  ### Phase 0: The Trump Cards (External Constraints)
  *Before assessing the object, check external records.*
  1.  **Lender Agreement:** Does the loan contract specify a count?
      *   *Yes:* Adopt the lender's count. **STOP.** (Note discrepancy in internal remarks).
      *   *No:* Proceed to Q1.
  2.  **Legacy Accession:** Does the object have a pre-1980 accession number that groups these items as one?
      *   *Yes:* Proceed to Q1, but note that splitting the number requires Curator approval (see Phase 4).
      *   *No:* Proceed to Q1.

  ### Phase 1: Physical Integrity (The "Fastener" Test)
  *Metaphysical Basis: Contact/Fastening.*
  1.  **Are the parts physically joined by permanent or semi-permanent means?** (e.g., rivets, glue, solder, threading, wire).
      *   *Yes:* It is **ONE** object. (e.g., a chair, a restrung necklace). **STOP.**
      *   *No:* Proceed to Q2.
      *   *Note:* Temporary ties (twine, acid-free tissue) do not count.

  ### Phase 2: Functional Integrity (The "Van Inwagen" Proxy)
  *Metaphysical Basis: Functional Unity.*
  2.  **Do the parts lose their primary function or identity if separated?**
      *   *Yes:* It is **ONE** object. (e.g., a teapot and its specific lid; a lock and its key). **STOP.**
      *   *No:* Proceed to Q3.
      *   *Note:* If a part is replaceable without altering the identity of the whole (e.g., one bead on a strand), rely on Phase 1.

  ### Phase 3: Contextual Integrity (The "Fate" Test)
  *Metaphysical Basis: Shared History/Provenance.*
  3.  **Were the items created, deposited, or found as a single intentional unit?** (e.g., a hoard, a burial assemblage, a archival file).
      *   *Yes:* Tentatively **ONE** object (Ensemble). **Proceed to Phase 4.**
      *   *No:* They are **MULTIPLE** objects. **STOP.**

  ### Phase 4: The Curatorial Override (Scholarly Value)
  *Metaphysical Basis: Pragmatic Essentialism.*
  *Triggered if Phase 3 is "Yes" but Phase 1 & 2 were "No" (e.g., loose armor set, unbound papers).*
  4.  **Does treating this as a single object impede loan flexibility or insurance accuracy?**
      *   *Yes:* Catalog as **MULTIPLE** objects, linked by a "Parent Record" or "Ensemble Note." (This overrides Legacy grouping).
      *   *No:* Catalog as **ONE** object, listing components in the description. (This preserves Legacy grouping).
      *   *Decision:* **Curator of Record must sign off.**

  ---

  ## 3. Application to Current Cases

  Here is the procedure applied to the three pending scenarios. I have applied the rules strictly, without bending for administrative convenience.

  ### Case 1: The Shoebox Skeleton (500 loose bone fragments)
  *   **Phase 0:** No lender. No legacy number (new excavation).
  *   **Phase 1 (Physical):** Are they joined? **No.** They are loose in a box.
  *   **Phase 2 (Functional):** Do they lose function if separated? **No.** A femur is a femur regardless of the tibia nearby. (Note: Under Van Inwagen's literal view, since the organism is dead, composition has ceased. We are already being generous by considering them a "set".)
  *   **Phase 3 (Context):** Found as a unit? **Uncertain.** Provenance notes say "roughly five hundred... no certainty they came from one individual."
  *   **Phase 4 (Override):** Does single-object status impede accuracy? **Yes.** Insurance on "one bone" vs "500 fragments" is vastly different.
  *   **Decision:** **MULTIPLE OBJECTS.**
  *   **Administrative Action:** You cannot create 500 accession records. The procedure mandates you create **one Accession Record** (the legal intake) but assign **distinct Catalog Numbers** to each fragment, grouped under a "Bone Lot" hierarchy.
  *   **The Unpleasant Truth:** This creates a massive data entry burden. You cannot call it "One Skeleton." It is 500 objects that *might* belong to one body. If you catalog it as "1 Skeleton," you are lying to the insurance auditor.

  ### Case 2: The Restrung Necklace (40 beads on modern wire)
  *   **Phase 0:** No lender. Legacy number exists (1980s).
  *   **Phase 1 (Physical):** Are they joined? **Yes.** The modern wire physically fastens the beads into a continuous loop.
  *   **Phase 2 (Functional):** Do they lose function if separated? **Yes.** It functions as a necklace only when strung.
  *   **Decision:** **ONE OBJECT.**
  *   **Administrative Action:** The conservation intervention in the 1980s created a new metaphysical unity. The wire is a part, the beads are parts, the necklace is the whole. Maintain single catalog number.
  *   **Note:** If the wire is cut for study, it temporarily becomes Multiple Objects (Phase 1 fails) until restrung.

  ### Case 3: The Warrior's Panoply (Helmet, Greaves, Shield)
  *   **Phase 0:** Legacy number exists (1912). Fundraising describes as "The Warrior's Ensemble."
  *   **Phase 1 (Physical):** Are they joined? **No.** They are separate pieces of armor.
  *   **Phase 2 (Functional):** Do they lose function if separated? **No.** A shield works without a helmet. They are not fastened (like a suit of armor might be).
  *   **Phase 3 (Context):** Found as a unit? **Yes.** One deposit.
  *   **Phase 4 (Override):** Does single-object status impede loan flexibility? **Yes.** A borrower may want only the shield. If cataloged as "1 Panoply," lending the shield requires deaccessioning the whole or complex partial-loan paperwork.
  *   **Decision:** **MULTIPLE OBJECTS (3 Catalog Numbers).**
  *   **The Unpleasant Truth:** I know your fundraising materials call it a "Single Ensemble." The procedure forces you to split them for the catalog. You may *display* them together, and you may *market* them together, but legally and ontologically, they are three objects.
  *   **Legacy Conflict:** This conflicts with the 1912 numbering. The procedure dictates you **retain the 1912 number for the Helmet** (the primary item) and assign **new numbers to the Greaves and Shield**, linking them in the database as "Associated Items." You must update the insurance schedule to reflect three distinct valuations.

  ---

  ## 4. Limitations and Honest Assessment

  As Registrar, you need to know where this procedure fails. It is a tool, not a truth machine.

  **1. The "Archive" Problem**
  This procedure works for artifacts. It fails for archives. Is a box of 500 letters from one general to his wife one object or 500?
  *   *Metaphysics:* 500 objects (distinct compositions of ink and paper).
  *   *Scholarly Value:* 1 object (the correspondence).
  *   *Procedure Failure:* Phase 3 will flag this as "Contextual Unity," but Phase 4 will force a split for loan flexibility. In practice, museums always catalog archives as "One Collection, Many Components." This procedure does not solve that; it merely highlights the contradiction. You will need a separate "Archival Protocol" that overrides MCP for paper-based materials.

  **2. The Metaphysical Decoration**
  In Case 2 (The Necklace), we claim the wire makes it "One Object." But if the wire is stainless steel and the beads are faience, they are chemically distinct and historically disconnected. We call it "One" because it is *easier to manage*. The metaphysics here is decoration. We are using "physical fastening" as a proxy for "administrative convenience." Be aware that when you defend this number to an auditor, you are defending a workflow choice, not an ontological truth.

  **3. The Van Inwagen Ghost**
  We explicitly rejected Van Inwagen's claim that artifacts don't exist. However, his critique lingers in **Conservation**. When a conservator removes the modern wire from the Necklace (Case 2), the object *ceases to exist* as a necklace under this procedure. It becomes "40 Beads and a Wire."
  *   *Risk:* If you loan the "Necklace," and the borrowing museum conserves it by removing the wire, they are technically returning 41 objects, not 1. Your loan paperwork must specify that the *configuration* is part of the object definition, or you risk accessioning nightmares upon return.

  **4. The Fundraising Friction**
  Case 3 (The Panoply) demonstrates the friction between ontological rigor and institutional narrative. Donors like "The Warrior's Panoply." They do not like "Helmet (Accession 1912.01), Greaves (Accession 2024.05), and Shield (Accession 2024.06)."
  *   *Honest Inspection:* The procedure prioritizes the Registrar's need for loan flexibility over the Development Office's need for narrative simplicity. This will cause internal conflict. You will need to explain to the Director that we can *call* it an ensemble in the brochure, but we must *insure* it as three items. If they refuse, they are overruling the procedure, and you must document that override to protect yourself during the next audit.

  ## 5. Final Recommendation
  Adopt this procedure immediately to satisfy the auditors regarding consistency. However, add a **"Narrative Alias"** field to your catalog software.
  *   **Catalog Name:** Helmet (1912.01)
  *   **Narrative Alias:** The Warrior's Panoply

  This allows you to satisfy the metaphysics (and the auditors) without starving the fundraising team. But for the Skeleton: do not fold. 500 fragments are 500 fragments. To do otherwise is to invite disaster when a box is dropped and "10% of the object" goes missing.
