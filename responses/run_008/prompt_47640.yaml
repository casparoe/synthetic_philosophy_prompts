  So I got into this huge argument with my friend last night about special relativity and time, and I want to turn it into a term paper proposal (philosophy of physics, one semester, ~6000 words) — but I keep going in circles, so help me turn it into an actual proposal.

  The fight was about the Rietdijk–Putnam / Penrose style argument from special relativity: roughly that the relativity of simultaneity, plus some assumptions about what is "real for" an observer at a moment, forces you into the block universe (eternalism). My friend loves this argument. I kept pushing back that at most it shows there's no privileged global "now", and that's not the same as showing future events are real. He said I was just refusing to accept the conclusion by moving the goalposts, and honestly by 2am I wasn't sure he was wrong.

  Here's the half-formed idea. My hunch is that the argument slides between three claims that nobody in that conversation (and maybe not in the literature) separates cleanly: (1) there is no privileged global present; (2) past, present and future events are all equally real — eternalism proper; (3) the future is fixed, so deliberating about it is in some sense confused. My guess is the physics gets you something like (1) at most; that (2) needs an extra, purely philosophical premise — something like: whatever is real relative to someone real is real simpliciter — which is doing all the work; and that (3) is a separate fatalism question that even a full eternalist could deny. If I can formalize the argument as an explicit list of premises and locate exactly where the slide from (1) to (2) happens, and where (2) gets conflated with (3), that's the paper.

  Please take the role of a professional philosopher of time and physics. Think carefully, and maybe do a short brainstorm before writing the actual proposal — I'd rather see the reasoning briefly than get a polished wall of text. The proposal needs: the question stated so it has a determinate answer, why the existing positions leave it open, the method (what I would actually do, month by month), the possible conclusions and what would decide between them, what would count as the project failing, and an honest assessment of whether this is too big for one semester. No bibliography — I'll add citations myself.

  One more thing: end the whole response with a fixed machine-readable line, \answer{...} enclosing a single sentence that states the research question as sharply as possible, since I want to pin it to the top of my draft. Thx!
