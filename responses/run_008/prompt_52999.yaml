answer: |-
  The TRC's design implicitly rests on a conception of justice that prioritizes the restoration of the political community over individual retribution or restitution, treating public testimony as a performative act of democratic founding, although scholars remain divided on whether this approach was driven by an authentic *Ubuntu* philosophy or pragmatic negotiation tactics.

  The insistence on public, in-person hearings supports the view that truth was treated as narrative and recognitive rather than merely evidentiary. By requiring perpetrators to speak before the nation, the design presupposed that the harm of apartheid was not just physical violence but the systematic denial of humanity, which could only be countered by a public acknowledgment that restored the victim's dignity in the eyes of the community. This performative aspect aligns with a relational ontology where identity and moral status are conferred through social recognition, suggesting that secrecy sustained the oppressive regime and only publicity could dismantle it.

  The marginalization of the victim in the amnesty process—specifically the lack of veto power or mandatory restitution—indicates that the primary debt was owed to the constitutional order and the social fabric rather than the individual sufferer. This design choice treats political crimes as offenses against the community's possibility of coexistence, meaning that reconciliation is a collective project managed by the state rather than a private transaction between victim and perpetrator. Consequently, the "repair" is the stabilization of the new democracy, not necessarily the material or emotional satisfaction of the specific victim.

  However, the philosophical foundation of this design is contested. While Archbishop Desmond Tutu and the final TRC report explicitly invoked *Ubuntu*—the idea that personhood is mutually constituted—to justify the restorative approach, legal historians and political scientists argue that the amnesty mechanism was primarily a pragmatic concession extracted by the outgoing National Party to prevent civil war. From this perspective, the relational language was a moral retrofit used to legitimize a hard-nosed political settlement known as the "pact of elites," rather than the driving force behind the legislation. Therefore, the design is not fully explained by a plain rule-of-law story, since ordinary legal principles would demand prosecution, but rather by a transitional justice logic that suspends standard legal norms to secure a political transition, regardless of whether that logic was authentically rooted in *Ubuntu* or strategically framed by it.
