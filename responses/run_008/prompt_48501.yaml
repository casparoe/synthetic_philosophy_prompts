answer: |-
  ### The Logical Space

  Before you begin, here is the map of the territory. When we look at a bunch of distinct items (like the atoms in your hand), there are three main ways to answer whether they add up to one *further* thing (like a hand).

  1.  **Never:** The items never add up to a further thing. There are only the basic bits. (Philosophers call this *Nihilism*.)
  2.  **Always:** Any items you pick, no matter how scattered or unrelated, add up to a further thing. (Philosophers call this *Universalism*.)
  3.  **Sometimes:** The items add up to a further thing only when specific conditions are met. (Philosophers call this *Restrictivism*.)
      *   *Contact:* The bits must be touching or bound together.
      *   *Life:* The bits must be part of a living organism.
      *   *Activity:* The bits must be working together for a purpose.
      *   *Shape/Concept:* The bits must fit a pattern we recognize or name.
      *   *Brute:* There is a fact of the matter, but no deep rule explains why.

  ***

  ### The Quiz

  **1. The Trout and the Turkey**
  Imagine a trout swimming in a pond and a turkey strutting in a farmyard miles away. Is there a single object composed of exactly the trout and the turkey?
  *   A) No, there is just a trout and a turkey.
  *   B) Yes, but only because living things can form objects together.
  *   C) Yes, any two things form a further thing together.

  **2. The Desk Sweep**
  Consider everything currently sitting on your desk: a mug, some papers, a laptop, dust motes. Does "everything on my desk" pick out one single item, or just a way of counting many items?
  *   A) Just a way of counting many items.
  *   B) One single item, because the parts are touching and in one place.
  *   C) One single item, because any collection of items forms a whole.

  **3. You and Your Cells**
  Do you exist as one thing over and above the billions of cells that make up your body?
  *   A) No, there are just cells arranged person-wise.
  *   B) Yes, because living cells bind together to make an organism.
  *   C) Yes, because any parts make a whole, including me.

  **4. The Shoe and the Moon**
  Is there an object made of your left shoe and the northern half of the Moon?
  *   A) No, that's absurd.
  *   B) Yes, but only if we decide to name it.
  *   C) Yes, just as much as there is a shoe or a Moon.

  **5. The Chair**
  Look at a standard wooden chair. Is it one thing, or many things arranged chair-wise?
  *   A) Many things; "chair" is just a label for the arrangement.
  *   B) One thing, because the parts are fastened to function together.
  *   C) One thing, because any arrangement of parts makes an object.

  **6. The Mug Top**
  Consider the top half of your coffee mug (the rim and handle, but not the bottom). Is that a real object, or just a way of talking?
  *   A) Just a way of talking; only the whole mug is real.
  *   B) A real object, because it is a distinct piece of material.
  *   C) A real object, because any portion of matter is an object.

  **7. The Bike Wheel**
  You take the front wheel off your bicycle to fix a flat. While the wheel is in your hand and the frame is on the stand, is there still such a thing as "the bicycle"?
  *   A) No, there are just frame-parts and wheel-parts scattered around.
  *   B) Yes, the bicycle exists but is currently disassembled.
  *   C) Yes, because the parts still exist, so their sum exists.

  **8. The Pile of Sand**
  A gust of wind scatters a pile of sand across the beach. Before the wind, was there a "pile" object? After the wind, is there still a "pile" object?
  *   A) No, there were/are just grains of sand.
  *   B) Yes before, no after; the contact held it together.
  *   C) Yes and yes; the grains always form a whole.

  **9. The Broken Watch**
  A watch is crushed into a pile of gears and glass. Is there still a "watch" there?
  *   A) No, just debris.
  *   B) No, the object ceased to exist when it lost its function.
  *   C) Yes, the parts still sum to a whole regardless of function.

  **10. The Rule**
  If you had to guess, is there a strict rule that determines when parts make a whole, or is it just a brute fact that some collections count and others don't?
  *   A) There is no whole to count in the first place.
  *   B) There is a strict rule (like contact or life).
  *   C) It's either always true, or there is no deep rule.

  ***

  ### Scoring Key

  **Mostly A's: The Nihilist**
  You hold that composition never happens. There are only basic bits (atoms, simples, etc.). When we talk about "chairs" or "people," we are speaking loosely about bits arranged in a certain way.
  *   *Note on Q7:* If you answered A here, you are consistent. You believe the bike never existed as a whole, so naturally, it doesn't exist when taken apart.

  **Mostly C's: The Universalist**
  You hold that composition always happens. Any plurality of things forms a further thing. There is an object made of your nose and the Eiffel Tower.
  *   *Note on Q7:* If you answered C here, you are consistent. The bike exists as long as its parts exist, regardless of arrangement.

  **Mostly B's: The Restrictivist**
  You hold that composition happens sometimes, under specific conditions. To find your specific flavor, look at where you diverged from A or C:
  *   **Organicist:** You said "No" to chairs/desks (Q2, Q5) but "Yes" to people/trout (Q1, Q3). You think only living things are real objects.
  *   **Contactist:** You said "Yes" to chairs/piles (Q5, Q8) but "No" to scattered objects (Q1, Q4). You think parts must touch to form a whole.
  *   **Functionalist:** You said "Yes" to chairs/watches (Q5, Q9) but "No" to piles/scattered bits. You think parts must work together.
  *   **Conceptualist:** You think objects exist when we name or conceive of them (often Q2, Q4 option B).
  *   **Brute Fact:** You answered "Sometimes" but couldn't find a consistent rule (Q10 option C). You think reality just decides which fusions exist without a tidy principle.

  **The "Bike Wheel" Trap (Question 7)**
  This question does **not** sort for composition views; it sorts for **persistence** views.
  *   If you answered **A**, you might be a Nihilist, *or* you might be a Restrictivist who believes composition is temporary (the bike existed, but now it doesn't).
  *   If you answered **B**, you believe objects can survive the loss of parts (Endurantism/Perdurivism). This is compatible with Nihilism, Universalism, or Restrictivism.
  *   If you answered **C**, you are likely a Universalist.
  *   *Warning:* Do not use this question to calculate your main score. It flags whether you are confusing "Do parts make a whole?" (Composition) with "Does the whole survive change?" (Persistence).

  **Incoherent Combos**
  *   **Nihilist + Organism:** Answering "No, just cells" to Q3 (You) but "Yes, living things bind" to Q1 (Trout/Turkey). This is incoherent. If composition never happens, it cannot happen for living things.
  *   **Universalist + Scattered Denial:** Answering "Yes, any parts make a whole" to Q2 (Desk) but "No" to Q4 (Shoe/Moon). This is logically inconsistent. If any parts make a whole, spatial distance doesn't matter.
  *   **The "Nobody's Bothered" Combo:** Answering "Yes" to Artifacts (Chair) but "No" to Organisms (You). This is logically possible (Eliminative Materialism about biology, Realism about artifacts), but historically almost no philosopher has held this view. It's not incoherent, just unmotivated.

  **The Hardest Split**
  This quiz does the worst job of separating **Contactists** from **Functionalists**, because in most concrete cases (like a chair or a bike), the parts are both touching *and* working together.
