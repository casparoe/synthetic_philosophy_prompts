answer: |-
  This is a exceptionally sharp observation. You have identified the central constitutional tension of the post-Cold War European Union: the clash between the **optimism of enlargement** (conversion is permanent) and the **pessimism of maintenance** (backsliding is inevitable).

  You are right that the architecture looks schizophrenic. On one hand, it treats accession as a graduation ceremony into a club of adults who no longer need supervision (the Fukuyaman bet). On the other, it treats membership as a probationary period where the whip must remain visible (the Article 7 bet).

  Here is an analysis of the theories of political development underwriting this machinery, whether they can be reconciled, and what the inconsistency reveals about the EU's actual nature.

  ### 1. The Accession Assumption: "Lock-In" via Entanglement
  You characterize the accession logic as Fukuyaman (liberal democracy is an absorbing state). I would argue it is actually more **Neofunctionalist** and **Liberal Institutionalist**.

  The EU enlargement machinery does not necessarily assume that human nature or political culture has permanently evolved. Instead, it assumes that **structural entanglement makes reversal prohibitively costly.** This is the "Golden Straitjacket" theory.

  *   **The Theory:** Once a country aligns its regulations, integrates its supply chains, binds its judiciary to the ECJ, and embeds its elites in Brussels networks, the *transaction costs* of autocracy become too high. To backslide, a leader wouldn't just have to change the laws; they would have to rip their economy out of the Single Market.
  *   **The Bet:** The "one-way door" isn't based on the idea that history stops; it's based on the idea that *exit* is economically suicidal. Therefore, the system assumes democracy is self-sustaining *because* membership is too valuable to jeopardize.
  *   **Why no expulsion clause?** In this view, expulsion is unnecessary because no rational actor would force you out; you would never dare leave. Furthermore, expulsion creates a hostile neighbor on the border, which violates the EU's founding geopolitical purpose (peace through integration).

  ### 2. The Membership Reality: The Failure of "Soft Power"
  Article 7 and the budget conditionality mechanism admit that the "Lock-In" theory failed. Hungary and Poland demonstrated that a government can calculate that the domestic political gain of illiberalism outweighs the economic cost of EU friction.

  *   **The Theory:** This rests on a **Principal-Agent problem**. The Member States (agents) have information asymmetries and incentives to cheat the Principal (the EU legal order).
  *   **The Shift:** This moves the EU from a *transformative* power (changing who you are) to a *regulatory* power (monitoring what you do). It acknowledges that domestic political coalitions can form (e.g., Fidesz in Hungary) that are willing to absorb the reputational and financial costs of backsliding.
  *   **The Contradiction:** If the Lock-In theory were true, Article 7 would be a dinosaur, never used. The fact that it is the "nuclear option" acknowledges that the economic ratchet is not strong enough to prevent political reversal.

  ### 3. Can One Consistent Theory Underwrite Both?
  Yes, but only if we shift from a theory of *political development* to a theory of **constrained sovereignty.**

  The consistent theory is not "Democracy is inevitable" (Fukuyama), but rather **"Integration creates a threshold of tolerance."**

  *   **Pre-Accession:** The threshold is high (Copenhagen Criteria). You must prove you can play the game.
  *   **Post-Accession:** The threshold is lower (Article 7). You are allowed to stumble, but not to break the game.
  *   **The Consistency:** The "one-way door" is not a claim that you cannot become authoritarian; it is a claim that **you cannot remain authoritarian *and* a member indefinitely without consequence.** The treaties assume that while backsliding is possible, *total exit* from the liberal order is incompatible with membership.

  However, this consistency is strained. The lack of an expulsion mechanism (Article 50 is voluntary withdrawal) is the weak link. If the theory is "backsliding is a live threat," then the logical conclusion is that a state that fully backslides should be removed to protect the integrity of the club. The fact that they cannot be removed suggests the "Lock-In" theory is still partially in force: the EU fears the geopolitical consequences of expulsion more than the ideological consequences of retention.

  ### 4. Is the Setup Philosophically Underdetermined?
  You asked if several theories could license the same design. Yes. This is a feature, not a bug. The EU is a coalition of different political philosophies that agree on the *mechanism* but disagree on the *teleology*.

  1.  **Liberal Institutionalism:** Fits the Accession side. Institutions shape preferences. Once inside, states prefer democracy because the institution rewards it.
  2.  **Realism:** Fits the No-Expulsion side. You don't kick out a neighbor because you don't want a destabilized border or a Russian ally on your flank. Keeping Hungary in, even if illiberal, is safer than kicking it out.
  3.  **Constructivism:** Fits the Monitoring side. Norms must be constantly reiterated and defended. Article 7 is a "naming and shaming" ritual to reinforce the collective identity of the EU against the deviant member.

  The design works because these theories overlap on the *procedure* (screen them, let them in, watch them), even if they disagree on *why* it works.

  ### 5. What Would Make It Consistent?
  If we accept your premise that the current setup is quasi-Fukuyaman (assuming irreversibility) but reality proves it reversible, here is what would be required to make the system philosophically consistent:

  **Option A: The Federal Turn (Accepting Backsliding is Real)**
  If backsliding is a permanent risk, the EU must admit it is a federal polity, not a club of states.
  *   **Change:** Introduce an **expulsion mechanism**. If a state violates Article 2 (values) irredeemably, it is ejected.
  *   **Implication:** This admits the "Lock-In" failed. It treats the EU as a voluntary association of democracies, not a geopolitical anchor.
  *   **Risk:** It creates the "hostile neighbor" problem the founders wanted to avoid.

  **Option B: The Technocratic Turn (Doubling Down on Lock-In)**
  If the goal is to make democracy an absorbing state, the economic costs of backsliding must be made automatic and immediate, removing political discretion.
  *   **Change:** Remove the unanimity requirement in Article 7. Make budget conditionality automatic upon judicial rulings.
  *   **Implication:** This makes the "ratchet" truly bite. It assumes that if the cost is high enough, no rational leader will backslide.
  *   **Risk:** It turns the EU into a debt collector rather than a political union, potentially fueling the very Euroscepticism it tries to suppress.

  **Option C: The "Two-Tier" Europe (Accepting Inconsistency)**
  Acknowledge that the "one-way door" was a myth.
  *   **Change:** Formalize a status of "suspended membership" where a country remains in the Single Market but loses voting rights and funds indefinitely.
  *   **Implication:** This accepts that history *can* go backwards, and creates a waiting room for countries trying to return to the fold.

  ### Conclusion
  The EU enlargement machinery presupposes a **hybrid theory**: it bets on *economic entanglement* to sustain democracy (Institutionalism) while keeping *legal sanctions* in reserve for when domestic politics override economic logic (Realism).

  The inconsistency you spotted is real, but it is **geopolitical**, not just philosophical. The "one-way door" exists not because the EU believes Hungary can't become authoritarian, but because the EU believes kicking Hungary out would be worse than keeping it in.

  So, to answer your final question: The current setup is **not** fine if the goal is ideological purity. But it **is** consistent if the goal is **regional stability**. The EU is not a temple of liberal democracy; it is a peace treaty with a budget. It tolerates backsliding members because the alternative (a fragmented continent with revisionist powers on the border) is the historical nightmare the EU was built to prevent. The "Fukuyaman" mask is worn for the accession candidates; the "Realist" teeth are kept for the members.
