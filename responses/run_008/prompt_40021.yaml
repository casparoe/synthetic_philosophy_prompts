prompt: |-
  As part of my coursework in behavioral genetics this term, I keep running into the same gap between what heritability actually is — a ratio of variances within a particular population, in a particular range of environments — and how the number gets used in public writing. This has become a practical problem: I'm on the editorial board of our university's student-run science magazine, and a fair share of what we publish or reject turns on heritability claims. A piece last term reported an h² of about 0.8 for a cognitive trait from a twin study and concluded that differences in school funding barely matter; another treated a GWAS-derived percentage as if it applied to named individuals; a third quietly carried a figure measured in one national cohort across to a claim about a very different population. My co-editors and I adjudicate these by feel, and I'd like to replace that with something we can actually run.

  Please write a decision procedure for us. The working conditions: a typical claim arrives as a sentence or paragraph inside a draft, we have about twenty minutes per piece, we have the article and at most the study's abstract in hand, and an editor-in-chief signs off on anything we flag as a borderline call. The procedure should pose its questions in a fixed order, state what counts as a sufficient answer to each, and specify the stopping points — where it clears the claim for publication, where it requires a specific revision to the wording, and where it escalates to the editor because the residual problem is one of framing or emphasis rather than fact. It should be honest about which steps are real checks and which are judgment calls dressed up as procedure, and about what the procedure cannot do at all — for instance, it cannot audit the primary study's statistics, and I suspect it also cannot settle how much hedging a readable sentence can bear.

  The conceptual machinery I'd want it to draw on, in whatever distilled form survives twenty minutes: the distinction between what a heritability estimate licenses and what it is constantly taken to license — nothing about individuals, nothing directly about malleability, nothing about causes of differences between populations that differ in environment; high heritability coexisting with decisive environmental intervention (the classical PKU case); heritability shifting when the environmental range shifts, so the same trait can yield different h² in populations where some environmental input is nearly constant versus widely varying; the difference between broad and narrow heritability, and which kinds of claims (about plasticity versus about response to selection) each one bears on; and, where the claim rests on MZ/DZ correlations, the rough checks a reader can run from an abstract alone — the Falconer-style computation of h² from the two correlations, and the signal of shared environment when the DZ correlation comes in well above half the MZ correlation.

  Then run the procedure on three test claims. First, the classic: a columnist writes that since twin studies put the heritability of the trait near 0.8, compensatory programs are a poor investment — I want to see exactly where in the sequence that sentence dies, and which of its two claims (the number, the inference) survives if any. Second, a subtler one I expect we'll actually face: a well-written piece cites a heritability of 0.7 for a trait measured in a single affluent, relatively homogeneous cohort, and generalizes it to justify a claim about a policy affecting a much broader and less homogeneous population — I want to see how the procedure separates a defensible number from an indefensible scope. Third, include a case where the procedure returns a verdict my board won't like: say, a rhetorically convenient claim we're inclined to wave through that the procedure nonetheless flags. Close by telling us what will predictably go wrong the first month we use this — the shortcuts we'll be tempted into, the claim-types it will misfire on — and whether there is any class of heritability claim the procedure should simply refuse to adjudicate.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Student in behavioral genetics, member of an editorial board for a student science magazine.
      *   **Problem:** Gap between technical definition of heritability ($h^2$) and public misuse. Current editorial decisions are based on "feel."
      *   **Goal:** A concrete decision procedure (checklist/flowchart style) to evaluate heritability claims in drafts.
      *   **Constraints:** ~20 minutes per piece, only article + abstract available, Editor-in-Chief (EIC) escalation path needed.
      *   **Required Content:**
          *   Fixed order of questions.
          *   Sufficient answers for each.
          *   Stopping points (Clear, Revise, Escalate).
          *   Honesty about limitations (what's a real check vs. judgment call, what's impossible).
          *   Conceptual machinery: Variance ratios, no individual inference, no malleability inference, no between-population inference, environmental range effects, broad vs. narrow, Falconer's rough check ($2(r_{MZ} - r_{DZ})$).
          *   Three Test Cases:
              1.  Classic misuse ($h^2=0.8 \rightarrow$ funding doesn't matter).
              2.  Scope misuse (Homogeneous cohort $\rightarrow$ Heterogeneous policy).
              3.  Unpopular verdict (Rhetorically convenient but technically flawed).
          *   Post-Mortem: Predicted failure modes, shortcuts, and classes of claims to refuse.

  2.  **Drafting the Decision Procedure (The "Heritability Claim Audit" - HCA):**
      *   *Structure:* Needs to be linear, time-boxed, and actionable.
      *   *Phase 1: Source & Stat Check (5 mins).* Is the number real? Is it $h^2$ or $r$?
      *   *Phase 2: Inference Check (10 mins).* The core conceptual traps (Individual, Malleability, Population).
      *   *Phase 3: Framing & Escalation (5 mins).* When to call the EIC.
      *   *Honesty:* Need to explicitly label steps as "Hard Check" (verifiable from abstract) vs. "Soft Check" (interpretive).
      *   *Outcomes:* Pass, Revise (Specific wording), Escalate (EIC).

  3.  **Refining the Conceptual Machinery:**
      *   *Variance:* Emphasize $V_G / V_P$.
      *   *Individuals:* $h^2$ is about population variance, not individual determination.
      *   *Malleability:* High $h^2$ $\neq$ immutable (PKU example).
      *   *Populations:* $h^2$ is population-specific (environmental variance matters).
      *   *Twin Math:* Falconer's formula ($2(r_{MZ} - r_{DZ})$). If $r_{DZ} > 0.5 r_{MZ}$, shared environment ($c^2$) is significant.

  4.  **Developing the Test Cases:**
      *   *Case 1 (The Classic):* "Heritability 0.8 means funding doesn't matter."
          *   *Failure Point:* Inference Check (Malleability/Policy).
          *   *Verdict:* Revise or Kill. The number might be real, the inference is false.
      *   *Case 2 (The Scope):* "Heritability 0.7 in affluent cohort justifies national policy."
          *   *Failure Point:* Population/Environment Check.
          *   *Verdict:* Revise (Limit scope).
      *   *Case 3 (The Unpopular One):* "Genetic risk scores predict individual outcome." (Or something subtle like ignoring GxE). Let's go with a "High Heritability = Genetic Determinism" narrative that feels empowering but is technically wrong. Or better: A claim that relies on $h^2$ to dismiss environmental intervention in a context where environmental variance is actually low (making $h^2$ high artificially). Let's choose a claim that implies *individual* prediction from a population statistic, which is very common in "personalized medicine" hype.
      *   *Refinement on Case 3:* The prompt asks for a "rhetorically convenient claim we're inclined to wave through." Often, editors like stories about "breaking the genetic mold." Let's try: "Because heritability is only 0.4, environment is the main driver for *this specific child*." This flips the error but is equally wrong. Or, "GWAS hits explain 20% of variance, so we can screen embryos." (Prediction vs. Explanation). Let's stick to the prompt's hint: "rhetorically convenient." Maybe a claim that uses heritability to argue *for* a social program in a way that overstates the certainty. Actually, the prompt suggests a claim the board *wants* to publish but the procedure flags. Let's use the "Individual Prediction" error in a positive light (e.g., "Genetic testing can identify at-risk students").

  5.  **Drafting the Post-Mortem:**
      *   *Shortcuts:* Skipping the abstract math, assuming "peer-reviewed" = "correct."
      *   *Misfires:* GxE interactions, SNP-based vs. Twin-based $h^2$.
      *   *Refusal:* Claims about race/ethnicity differences (too complex/political for this tool).

  6.  **Review and Refine:**
      *   *Tone:* Professional, academic, pragmatic.
      *   *Formatting:* Use bolding, lists, and clear headers to make it usable as a checklist.
      *   *Constraint Check:* Did I include Falconer? Yes. PKU? Yes. Variance definition? Yes. 20-minute limit? Yes.
      *   *Self-Correction during drafting:* Make sure the distinction between Broad ($H^2$) and Narrow ($h^2$) is mentioned but kept simple, as abstracts often don't specify. Focus more on the *inference* errors. Ensure the "Escalation" criteria are clear—when is it a wording fix vs. a fundamental framing error?

  7.  **Final Polish:** Check against the specific request for "honesty about which steps are real checks and which are judgment calls." I will add a "Meta-Commentary" column or section to the procedure.

  *(Self-Correction on Case 3)*: The prompt asks for a case where the procedure returns a verdict the board won't like. A common "good news" story is "Environment matters more than genes!" based on low heritability. This is just as wrong as "Genes matter more." I will use that. It appeals to progressive editors but violates the "no individual inference" rule.

  8.  **Final Output Generation** (incorporating all the above thoughts).
answer: |-
  # The Heritability Claim Audit (HCA)
  **Version 1.0 | For Editorial Use Only | Time Budget: 20 Minutes**

  ## Purpose
  To distinguish between valid statistical reporting and invalid causal inference regarding heritability ($h^2$) in student science writing. This tool does not validate the primary study's statistics; it validates the *text's interpretation* of those statistics.

  ## Limitations & Honesty Statement
  *   **What this IS:** A triage tool for logical consistency between a cited statistic and the claim built upon it.
  *   **What this IS NOT:** A statistical audit. We cannot check the raw data, the model assumptions, or the p-values. We assume the abstract's numbers are real.
  *   **Judgment Calls:** Steps marked **[JUDGMENT]** require editorial discretion on tone and readability. Steps marked **[HARD]** are binary checks based on the text/abstract.
  *   **The "Cannot Do":** This procedure cannot determine the *correct* amount of hedging for readability. It can only flag absolute statements that are technically false.

  ---

  ## Phase 1: Source & Stat Verification (5 Minutes)
  *Goal: Ensure the number exists and is identified correctly.*

  **Q1. Is the specific heritability estimate ($h^2$ or $H^2$) explicitly cited with a source?**
  *   **Sufficient Answer:** Yes, a specific percentage or decimal (e.g., "0.6", "60%") is linked to a specific study in the text or footnotes.
  *   **Insufficient:** Vague references ("Studies show...", "Genetic factors account for most...").
  *   **Action:** If Insufficient $\rightarrow$ **REVISE** (Require citation and number).

  **Q2. Does the text distinguish between Twin/Family $h^2$ and SNP/GWAS $h^2$ (if applicable)?**
  *   **Sufficient Answer:** The text acknowledges the method (e.g., "twin study," "genome-wide analysis").
  *   **Insufficient:** Treating them as interchangeable. (Twin $h^2$ is usually higher; GWAS $h^2$ is usually lower "missing heritability").
  *   **Action:** If Insufficient $\rightarrow$ **REVISE** (Clarify method).

  **Q3. [HARD CHECK] If Twin Data is cited, do the correlations support the claim? (Falconer's Rough Check)**
  *   *Look at the abstract for $r_{MZ}$ and $r_{DZ}$.*
  *   **Calculation:** $h^2 \approx 2(r_{MZ} - r_{DZ})$.
  *   **Shared Environment Signal:** If $r_{DZ} > \frac{1}{2} r_{MZ}$, shared environment ($c^2$) is substantial.
  *   **Sufficient Answer:** The text's $h^2$ claim is roughly consistent with the abstract's correlations, OR the text acknowledges shared environment if $r_{DZ}$ is high.
  *   **Action:** If the text claims "purely genetic" but $r_{DZ}$ is high $\rightarrow$ **ESCALATE** (Fundamental framing error).

  ---

  ## Phase 2: The Inference Traps (10 Minutes)
  *Goal: Catch the three classic category errors. If the text trips any wire, it must be revised.*

  **Q4. The Individual Trap**
  *   **Question:** Does the text apply the population variance ratio to a specific person or individual outcome?
  *   **Forbidden Phrasing:** "This gene determines 80% of *your* risk," "For *an individual*, genetics accounts for..."
  *   **Allowed Phrasing:** "80% of the *variation in the population* is associated with..."
  *   **Action:** If Forbidden $\rightarrow$ **REVISE** (Change to population-level wording).

  **Q5. The Malleability Trap**
  *   **Question:** Does the text imply that high heritability means the trait is immutable or that environmental intervention is futile?
  *   **Forbidden Inference:** $h^2 = 0.8 \rightarrow$ "School funding/therapy/diet won't work."
  *   **Required Concept:** High $h^2$ is compatible with high malleability (e.g., PKU is highly heritable but treatable by diet).
  *   **Action:** If Forbidden $\rightarrow$ **ESCALATE** (This is a framing error, not just wording. The argument's premise is false).

  **Q6. The Population/Environment Trap**
  *   **Question:** Does the text generalize the $h^2$ estimate to a population with a significantly different environmental range than the study cohort?
  *   **Check:** Compare Study Cohort (from abstract) vs. Policy Target (from text).
      *   *Example:* Study = Affluent, Homogeneous. Policy = National, Heterogeneous.
  *   **Logic:** If environmental variance ($V_E$) increases in the target population, $h^2$ ($V_G / V_P$) will likely *decrease*.
  *   **Action:** If Generalized without qualification $\rightarrow$ **REVISE** (Add scope limits: "In this specific cohort...").

  ---

  ## Phase 3: Framing & Escalation (5 Minutes)
  *Goal: Decide the final disposition.*

  **Q7. [JUDGMENT] Is the claim about "Broad" ($H^2$) vs. "Narrow" ($h^2$) heritability relevant to the conclusion?**
  *   **Context:** Broad includes non-additive effects; Narrow is additive (response to selection).
  *   **Check:** If the article discusses breeding/evolution $\rightarrow$ Must be Narrow. If discussing general family resemblance $\rightarrow$ Broad is okay.
  *   **Action:** If mismatched $\rightarrow$ **REVISE**.

  **Q8. Final Disposition**
  *   **CLEAR:** Passed Q1–Q6. Wording is precise.
  *   **REVISE:** Passed Q1–Q3, Failed Q4 or Q6. The facts are okay, the wording is overreaching. *Editorial Note: "Restrict claim to population variance" or "Limit scope to study cohort."*
  *   **ESCALATE:** Failed Q3 (Math mismatch) or Q5 (Malleability error). *Note to EIC: "The core argument relies on a false equivalence between heritability and immutability. Requires rewrite or rejection."*

  ---

  ## Test Runs

  ### Case 1: The Classic Misuse
  **Claim:** "Twin studies put the heritability of cognitive performance near 0.8. Therefore, differences in school funding barely matter."
  **Audit:**
  1.  **Q1 (Source):** Pass (Twin study cited).
  2.  **Q3 (Math):** Pass (Assuming abstract supports 0.8).
  3.  **Q4 (Individual):** Pass (Talks about differences generally).
  4.  **Q5 (Malleability):** **FAIL.**
      *   *Reasoning:* High $h^2$ describes current variance, not future potential. If school funding is currently uniform (low $V_E$), $h^2$ is high. If funding varies wildly (high $V_E$), $h^2$ drops. The claim confuses *explanation of current variance* with *response to intervention*. (PKU analogy applies).
  5.  **Disposition:** **ESCALATE.**
      *   *Why:* This isn't a wording tweak. The sentence argues against policy based on a statistical category error. The inference does not survive. The number (0.8) might be valid for that cohort, but the conclusion is scientifically unsupported.

  ### Case 2: The Scope Creep
  **Claim:** "A recent study of affluent Swedish families found a heritability of 0.7 for educational attainment. This suggests genetic factors dominate in modern society, justifying nationwide aptitude testing."
  **Audit:**
  1.  **Q1 (Source):** Pass.
  2.  **Q3 (Math):** Pass.
  3.  **Q6 (Population/Environment):** **FAIL.**
      *   *Reasoning:* The study cohort (affluent, homogeneous environment) has suppressed environmental variance ($V_E$), inflating $h^2$. The policy target (nationwide) includes high $V_E$ (poverty, underfunded schools). Applying the 0.7 figure to the national population is statistically invalid; $h^2$ will likely be lower nationally.
  4.  **Disposition:** **REVISE.**
      *   *Why:* The number is defensible *for the cohort*, but the scope is indefensible.
      *   *Required Change:* "In *homogeneous, affluent populations*, genetic factors appear to dominate... however, this may not hold across broader socioeconomic strata."

  ### Case 3: The Unpopular Verdict (The "Empowering" Error)
  **Claim:** "Because the heritability of anxiety is only 0.4, environment is the main driver for your child, and parenting changes can prevent the disorder."
  **Audit:**
  1.  **Q1 (Source):** Pass.
  2.  **Q4 (Individual Trap):** **FAIL.**
      *   *Reasoning:* "For your child" applies a population variance ratio to an individual case. A specific child's anxiety could be 100% genetically driven, even if population $h^2$ is 0.4.
  3.  **Q5 (Malleability Trap):** **FAIL.**
      *   *Reasoning:* Low $h^2$ does not guarantee malleability. The environmental variance might be non-modifiable (e.g., prenatal viral exposure, neighborhood violence) or the GxE interaction might be rigid.
  4.  **Disposition:** **ESCALATE.**
      *   *Why:* This is the claim the board will *want* to publish because it empowers parents and reduces stigma. However, it violates the same logical rules as the genetic determinist claim. It promises a level of individual control the statistic cannot license.
      *   *Board Friction:* Editors will argue this is "harmless optimism." The procedure flags it as "scientifically false." EIC must decide if "scientifically false but socially useful" is acceptable (it shouldn't be in a science mag).

  ---

  ## Post-Mortem: Predicted Failure Modes

  **1. The "Peer-Review Halo" Shortcut**
  *   **Risk:** Editors will assume that because the study is published, the *interpretation* in the abstract is safe to copy-paste.
  *   **Reality:** Primary authors often overstate implications in abstracts to sell the paper.
  *   **Mitigation:** Remind editors that the HCA audits *our text*, not the study. If the study abstract overclaims, we must correct it, not replicate it.

  **2. The GxE Blind Spot**
  *   **Risk:** The procedure treats $V_G$ and $V_E$ as additive and separate.
  *   **Reality:** Gene-Environment Interaction (GxE) is ubiquitous. A claim might pass Q5 (Malleability) but fail because the genetic effect *depends* on the environment (e.g., a genetic risk only manifests under stress).
  *   **Limitation:** This procedure cannot detect GxE from a standard abstract. It will misfire on claims that assume additive effects where interaction exists.

  **3. The "Readability" Resistance**
  *   **Risk:** Writers will argue that "80% of the variation in the population" is too clunky for a general audience.
  *   **Reality:** They are right. It is clunky.
  *   **Limitation:** The procedure cannot solve the tension between precision and prose. It will flag the imprecision, but it cannot write the better sentence. This will create friction between the Editorial Board (precision) and the Writing Team (flow).

  **4. Claims to Refuse Adjudication**
  *   **Race/Ancestry Comparisons:** Do not use this procedure for claims comparing heritability estimates *between* racial or ethnic groups.
      *   **Reason:** The confounding between genetic ancestry, socioeconomic status, and environmental stratification is too high for a 20-minute audit. The risk of validating a scientifically dubious premise (that $h^2$ differences between groups are interpretable) is too high.
      *   **Policy:** Any claim comparing $h^2$ across socially defined racial groups automatically **ESCALATES** to the Faculty Advisor/EIC for external review. Do not attempt to adjudicate internally.

  **5. The SNP vs. Twin Confusion**
  *   **Risk:** As GWAS becomes common, writers will cite "SNP heritability" (usually lower) alongside "Twin heritability" (usually higher) as if they are conflicting truths.
  *   **Mitigation:** Q2 attempts to catch this, but editors need training to understand that "Missing Heritability" is a feature of the method, not necessarily a contradiction in nature.

  **Final Note to the Board:**
  This procedure is a filter, not a truth machine. It will catch the egregious errors (Determinism, Individual Prediction, Scope Creep). It will not catch subtle statistical misspecification. If a claim passes the HCA, it is *consistent* with behavioral genetics orthodoxy, not necessarily *true*. Publish accordingly.
