prompt: |-
  I spent thirty-five years in a physiology lab and I've been retired for a while now, but the journal I reviewed for over the years broadened its scope a few years back, and they keep sending me evolutionary psychology manuscripts — four or five a year — apparently on the theory that an old physiologist who knows his statistics is close enough. Since retiring I've gotten deep into philosophy of science, and I keep running into the complaint that a lot of this work is "just-so stories" — the Kipling reference, after the giraffe one. Meanwhile my evolutionary biology friends tell me that's a lazy slur, that there are real tests you can run on adaptationist hypotheses, and that the people making the complaint don't hold papers in other fields to anything like that standard. I don't want to be the referree who either waves everything through because it sounds Darwinian, or rejects everything because the hypotheses are about the past and you can't rerun evolution.

  So here's what I'm asking for: a decision procedure I can actually run when one of these manuscripts lands in my queue. Something I can work through in an afternoon before writing a review that an editor and the authors will actually read. I want the questions in order, what a paper has to show at each step to pass, where the procedure outputs "reject" or "major revisions," and — importantly — where it has to stop and admit the remaining question is a plausibility judgment that no checklist can make for me. The distinction I care most about is whether a trait is an adaptation for the function the authors claim, versus a byproduct of something else, versus an old adaptation co-opted for a new use. If the procedure can't handle that three-way distinction it's useless to me. I'd also like it to say where it will misfire — the kinds of papers it will pass that it shouldn't, or kill unfairly.

  Then run it on three manuscripts so I can see it work:

  (1) A hypothesis paper arguing that morning sickness is an adaptation protecting the embryo from plant toxins during organogenesis. The timing fits, the toxin data is assembled from other literatures, there's no experiment, but there is a testable prediction about miscarraige rates differing across traditional diets.

  (2) An empirical paper with decent sample sizes finding that women's preference for the color pink is somewhat stronger in the luteal phase, and the authors interpret this as a leftover adaptation for tracking ripe fruit. Clean-ish data, wild interpretation. What does the procedure do with a case where the data and the story are doing different amounts of work?

  (3) One where I suspect the procedure will hand me an answer I won't like: an experiment on fear learning showing that people, and lab-raised monkeys, acquire snake and spider aversions from a single pairing with a photo, while flowers and mushrooms need many trials, and the authors read this as evidence of evolved prepared learning. My gut is to be annoyed by anything with "evolved" in the interpretation section, but the design looks clean.

  One request I want respected throughout: separate what's actually settled — among philosophers of biology and evolutionary biologists who know this stuff — from what's genuinely contested. I've been burned by philosophy books that present one side of an argument as if it were the consensus, and at my age I'd rather know when I'm standing on a plank somebody's sawing at from the other end. So wherever the procedure encodes a standard that people in the field actually fight about, flag it rather than baking it in silently.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired physiologist (35 years experience), strong stats background, recently studied philosophy of science. Reviews for a journal that has expanded into evolutionary psychology (EvoPsych).
      *   **Problem:** Receiving EvoPsych manuscripts (4-5/year). Concerned about the "just-so story" critique vs. the "lazy slur" counter-argument. Wants a practical decision procedure for reviewing.
      *   **Specific Needs:**
          *   A step-by-step decision procedure (checklist/flowchart style).
          *   Must handle the Adaptation vs. Byproduct vs. Exaptation distinction.
          *   Must indicate where it outputs "Reject," "Major Revisions," or "Plausibility Judgment."
          *   Must identify limitations (where it misfires).
          *   Must distinguish settled consensus from contested debates in philosophy/biology.
          *   Must apply the procedure to three specific case studies (Morning Sickness, Pink Preference, Snake/Spider Fear).
      *   **Tone:** Professional, respectful of expertise, nuanced, avoiding dogmatism.

  2.  **Deconstruct the Core Scientific/Philosophical Issue:**
      *   The central tension is between *Adaptationism* (traits exist because they were selected for their current function) and *Spandrelism/Constraint* (traits exist due to drift, byproducts, or phylogenetic inertia).
      *   The "Just-So Story" critique (Gould & Lewontin) argues that EvoPsych often assumes adaptation without ruling out alternatives.
      *   The Defense (Tooby, Cosmides, Pinker, etc.) argues that adaptationist hypotheses are testable and necessary heuristics.
      *   *Settled:* Adaptation claims require evidence of design specificity and fitness benefits in the EEA (Environment of Evolutionary Adaptedness), or at least comparative/phylogenetic control. Null hypotheses (byproduct, drift) must be considered.
      *   *Contested:* How much evidence is *enough*? Can we reliably reconstruct the EEA? Is the "cognitive niche" distinct enough to warrant specific modules?

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   Need a logical flow.
      *   *Step 1: Phenomenon Verification.* Is the effect real? (Physiologist's strength).
      *   *Step 2: Design Specificity.* Does the trait look *engineered* for the function? (Crucial for Adaptation vs. Byproduct).
      *   *Step 3: Alternative Hypotheses.* Did they test Byproduct/Exaptation/Drift? (The Gould & Lewontin check).
      *   *Step 4: Phylogenetic/Comparative Context.* Is it unique to humans? Shared with primates? (Helps distinguish old vs. new).
      *   *Step 5: EEA Plausibility.* Is the historical claim consistent with archeology/anthropology?
      *   *Step 6: The "Stop" Point.* Acknowledge where evidence runs out and interpretation begins.

      *Refining the Distinction (Adaptation vs. Byproduct vs. Exaptation):*
      *   *Adaptation:* Trait evolved *for* current function. Evidence: Costly, specific, fits EEA pressure.
      *   *Byproduct (Spandrel):* Trait exists as side-effect of another adaptation. Evidence: Correlates perfectly with the driver trait, no independent fitness value.
      *   *Exaptation:* Trait evolved for X, now used for Y. Evidence: Trait exists before pressure Y, or mechanism is too general.

      *Flagging Contested Areas:*
      *   The reliability of EEA reconstruction.
      *   The modularity of the mind (Massive Modularity vs. General Intelligence).
      *   The definition of "function" (Selected effect vs. Causal role).

  4.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Morning Sickness (Profet's Hypothesis).**
          *   *Phenomenon:* Real.
          *   *Specificity:* Timing matches organogenesis (high vulnerability).
          *   *Alternatives:* Hormonal side-effect? (Need to rule out).
          *   *Prediction:* Miscarriage rates vs. toxin intake. (Testable).
          *   *Verdict:* Strong candidate for Adaptation, but needs the comparative/dietary data to move from "plausible" to "supported."
          *   *Procedure Output:* Major Revisions (Needs the testable prediction addressed or data added).

      *   **Case 2: Pink Preference & Luteal Phase.**
          *   *Phenomenon:* Statistical correlation exists.
          *   *Specificity:* Low. Why pink? Why fruit? Fruit isn't just pink.
          *   *Alternatives:* Cultural conditioning? General arousal?
          *   *EEA:* Did ancestral women forage based on pinkness specifically in luteal phase?
          *   *Verdict:* Classic "Just-So." Data supports correlation, story is weak.
          *   *Procedure Output:* Reject or Major Revisions (tone down claims to "association," drop adaptation claim).

      *   **Case 3: Snake/Spider Fear (Preparedness).**
          *   *Phenomenon:* Robust (Öhman's work).
          *   *Specificity:* High. Selective association.
          *   *Alternatives:* Cultural ubiquity? (Controlled via lab-raised monkeys).
          *   *Phylogeny:* Shared with monkeys (Old adaptation).
          *   *Verdict:* Strong evidence for Adaptation (or Exaptation of general fear system, but specificity suggests selection).
          *   *Procedure Output:* Pass/Accept (with minor tweaks on wording).

  5.  **Review and Refine (Self-Correction against User Constraints):**
      *   *Constraint:* "Separate settled from contested." -> I need explicit callout boxes or bold text indicating where philosophers disagree.
      *   *Constraint:* "Where it misfires." -> Need a section on False Positives/Negatives.
      *   *Constraint:* "Three-way distinction." -> Ensure the procedure explicitly asks about Byproducts and Exaptations, not just Adaptation.
      *   *Tone:* Check against "old physiologist" persona. Respectful, technical but accessible, no fluff.

  6.  **Final Polish:**
      *   Structure the response clearly: Introduction -> The Protocol -> Limitations/Misfires -> Application to Cases -> Conclusion.
      *   Ensure the "Stop" point is clear (where philosophy takes over from data).
      *   Make sure the distinction between *Selected Effect* (history) and *Causal Role* (current utility) is mentioned, as that's a key philosophy of biology distinction.

  7.  *(Self-Correction during drafting)*: I initially thought about suggesting phylogenetic analysis for all. But for human psychology, that's hard. I should frame it as "Comparative Evidence" (primates, cross-cultural).
      *   *Correction on Case 3:* The user mentioned "lab-raised monkeys." This is a strong control for cultural transmission. I need to highlight that.
      *   *Correction on Case 1:* Profet's hypothesis is actually quite famous and debated. I should acknowledge that it's not new, but treat the *manuscript* as if it's new data.
      *   *Correction on Philosophy:* Ensure I mention Gould & Lewontin (1979) as the source of the "just-so" critique, and the "Adaptationist Programme" debate.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a precise request from someone who understands the weight of a review. You are asking for a heuristic that respects the rigor of physiology while navigating the inferential gaps inherent in historical sciences like evolutionary psychology.

  Below is a decision procedure designed for your specific context. It is built on the consensus standards of evolutionary biology (e.g., Williams, 1966; Mayr) and the philosophy of biology (e.g., Godfrey-Smith, Sterelny), while explicitly flagging where the consensus fractures.

  ### The "Adaptationist Audit" Protocol

  **Goal:** To distinguish between **Adaptation** (selected for current function), **Byproduct** (side-effect of another trait), and **Exaptation** (selected for past function, co-opted for current).

  **Pre-Check:** *Is the phenomenon real?*
  Before evolutionary questions, apply physiological scrutiny. Is the effect size robust? Are the measures valid? If the baseline phenomenon is shaky, **Reject** on empirical grounds. Do not proceed to evolutionary audit.

  ---

  #### Step 1: Design Specificity (The "Engineered" Test)
  **Question:** Does the trait exhibit complexity or specificity that matches the proposed problem?
  *   **Pass:** The mechanism is costly, precise, and triggers only under conditions relevant to the proposed fitness problem (e.g., nausea *only* during organogenesis).
  *   **Fail:** The mechanism is general, cheap, or triggers indiscriminately (e.g., general stress response).
  *   **Philosophy Flag:** *Settled.* Complex design is the primary marker of selection (Williams, 1966).
  *   **Output:** If **Fail**, move to Step 2 (Byproduct check). If **Pass**, proceed to Step 3.

  #### Step 2: The Null Hypothesis Check (Byproduct vs. Adaptation)
  **Question:** Did the authors explicitly model and test a non-adaptive null hypothesis?
  *   **Requirement:** They must propose a plausible byproduct explanation (e.g., "Nausea is a side-effect of high hCG, not a toxin defense") and show why the data fits the adaptation model better.
  *   **Philosophy Flag:** *Contested.* Adaptationists argue you need a specific alternative to test; Structuralists argue the null should always be "constraint/drift" until proven otherwise.
  *   **Output:** If **No** (they ignored the null), **Major Revisions** (demand the comparison). If **Yes**, proceed to Step 3.

  #### Step 3: Phylogenetic/Comparative Context (Exaptation vs. Adaptation)
  **Question:** Is the trait unique to the species/context or shared with ancestors?
  *   **Requirement:** Evidence from primates, cross-cultural universality, or developmental timing.
  *   **Logic:**
      *   Shared with distant ancestors + Old pressure = **Adaptation (Old)**.
      *   Shared with distant ancestors + New pressure = **Exaptation**.
      *   Unique to humans + Recent pressure = **Adaptation (New)**.
  *   **Philosophy Flag:** *Contested.* Reconstructing the "Environment of Evolutionary Adaptedness" (EEA) is notoriously difficult. Consensus is that *consistency* with the EEA is required, but *proof* of the EEA is often impossible.
  *   **Output:** If the trait is ancient but the claimed function is modern (e.g., "stone-age brain in modern world"), flag as **Exaptation**. If they claim **Adaptation** without phylogenetic control, **Major Revisions**.

  #### Step 4: The "Stop" Point (Plausibility Judgment)
  **Question:** Have they ruled out "reverse engineering" errors?
  *   **The Limit:** At this point, you are judging historical plausibility, not observing data.
  *   **Instruction:** If Steps 1–3 are passed, you cannot demand "proof" of history. You must judge if the story is *more plausible* than the alternatives.
  *   **Output:** If the story is coherent and fits known constraints, **Accept** (with caveats). If it relies on unverifiable assumptions about ancestral social structure, **Major Revisions** (tone down claims).

  ---

  ### Where This Procedure Misfires

  You asked for honesty about the tool's limitations.

  1.  **False Positives (The "Clever Story" Pass):** A paper can pass Steps 1–3 if the authors are skilled at crafting a narrative that *looks* specific and *looks* like it fits the EEA, even if the history is wrong. This protocol cannot detect a well-written fiction if the empirical design is tight.
  2.  **False Negatives (The "Hard to Measure" Kill):** Some adaptations are old and degraded (vestigial) or rely on subtle neurochemistry that current tech can't isolate. This protocol may reject valid hypotheses simply because the "Design Specificity" is currently invisible to our instruments.
  3.  **The Exaptation Blindspot:** It is often easier to prove a trait *works* than what it was *selected for*. This protocol may force authors to label things "Adaptations" when "Exaptations" is more accurate, simply because the field rewards adaptation claims.

  ---

  ### Application to Your Three Manuscripts

  Here is how the protocol processes your queue.

  #### Manuscript 1: Morning Sickness (The Profet Hypothesis)
  *   **Step 1 (Specificity):** **Pass.** Timing (organogenesis) aligns perfectly with vulnerability window. Mechanism (vomiting) expels toxins.
  *   **Step 2 (Null Hypothesis):** **Check.** The standard physiological null is "hormonal side-effect" (hCG levels peak when nausea peaks). The authors must show that nausea correlates with toxin avoidance *independently* of hormone levels, or that hormone levels themselves are the adaptation trigger.
  *   **Step 3 (Phylogeny):** **Neutral.** Hard to test in other mammals, but cross-cultural data is relevant.
  *   **Step 4 (Plausibility):** The prediction about miscarriage rates across diets is the key.
  *   **Verdict:** **Major Revisions.**
      *   *Reasoning:* The hypothesis is biologically plausible (passes Step 1), but without the miscarriage/diet data, it remains a "just-so" story. They have the prediction; demand they test it or cite existing data that confirms it. If they cannot, they must reframe the claim from "is an adaptation" to "is a candidate adaptation."
      *   *Philosophy Note:* This is a classic *Selected Effect* claim. Ensure they distinguish between "nausea *causes* health" vs. "nausea *indicates* a healthy pregnancy mechanism."

  #### Manuscript 2: Pink Preference & Luteal Phase
  *   **Step 1 (Specificity):** **Fail.** "Preference for pink" is low specificity. Ripe fruit is red, orange, yellow, purple. Pink is a distinct cultural categorization of light red.
  *   **Step 2 (Null Hypothesis):** **Fail.** Likely ignores cultural conditioning (pink = female) or general arousal changes during the luteal phase.
  *   **Step 3 (Phylogeny):** **Fail.** No evidence ancestral primates tracked "pink." They tracked contrast and saturation.
  *   **Verdict:** **Reject** (or **Major Revisions** to strip evolutionary claims).
      *   *Reasoning:* The data (correlation) may be real, but the evolutionary story fails Step 1. It is likely a **Byproduct** of general sensory sensitivity changes during the cycle, co-opted by modern color categories.
      *   *Instruction to Authors:* "The statistical association is interesting, but the leap to 'ripe fruit tracking' violates the Design Specificity criterion. Please reframe as a hormonal modulation of color preference without the adaptationist narrative, or provide evidence that 'pink' specifically (vs. red) offered fitness benefits."

  #### Manuscript 3: Snake/Spider Fear (Preparedness)
  *   **Step 1 (Specificity):** **Pass.** Single-trial learning for snakes/spiders vs. multiple trials for flowers is high specificity. It indicates a "module" or bias.
  *   **Step 2 (Null Hypothesis):** **Pass.** The use of lab-raised monkeys controls for cultural transmission (the main null hypothesis).
  *   **Step 3 (Phylogeny):** **Pass.** Shared with macaques implies an old adaptation (primate ancestor), not a human-specific cultural invention.
  *   **Step 4 (Plausibility):** **Pass.** Predation/venom pressure is consistent across the EEA.
  *   **Verdict:** **Accept** (with minor wording tweaks).
      *   *Reasoning:* This is the gold standard for EvoPsych. It uses comparative data to rule out culture (Step 3) and experimental data to show specificity (Step 1).
      *   *Nuance:* Ask them to clarify if this is an **Adaptation** (fear module selected *for* snakes) or an **Exaptation** (general visual system tuned to curved lines that *happens* to detect snakes). Given the monkey data, it's likely an Adaptation in the primate line, but maybe an Exaptation in humans if we no longer face that pressure.
      *   *Philosophy Note:* This is where your gut ("annoyed by 'evolved'") might conflict with the data. The protocol tells you to trust the design specificity over your heuristic bias. The word "evolved" is justified here because the *capacity* for this learning shows phylogenetic conservation.

  ### Summary of Settled vs. Contested Standards

  To ensure you aren't standing on a sawn plank, here is the breakdown used in the protocol:

  | Standard | Status | Notes |
  | :--- | :--- | :--- |
  | **Adaptation requires Design Specificity** | **Settled** | Consensus among biologists and philosophers (Williams, Dawkins, Godfrey-Smith). Traits must look "engineered." |
  | **Null Hypotheses must be tested** | **Settled** | Gould & Lewontin (1979) established this. You cannot assume adaptation without ruling out drift/byproduct. |
  | **EEA Reconstruction** | **Contested** | Biologists argue we can infer pressures from archeology; Philosophers argue the EEA is a statistical composite, not a specific place/time. *Action: Accept consistency, demand no certainty.* |
  | **Massive Modularity** | **Contested** | EvoPsych assumes many specific modules; Generalists argue for domain-general intelligence. *Action: Do not require modularity, require specificity of response.* |
  | **Function: Selected Effect vs. Causal Role** | **Contested** | Does "function" mean what it was selected for (history) or what it does now (utility)? *Action: Ensure authors specify which they mean.* |

  ### Final Advice for the Reviewer

  When you write the review, use your physiology background as the anchor.
  *   **Bad Review:** "This evolutionary story is unconvincing."
  *   **Good Review:** "The physiological mechanism described is robust, but the link to fitness benefits lacks the specificity required to rule out a byproduct explanation (Step 2 of audit)."

  This allows you to be the rigorous scientist without needing to be an anthropologist or paleontologist. If the paper cannot survive a physiologist's demand for mechanism and specificity, it does not matter how good the evolutionary story is.
