answer: |-
  # The Sim-Tree: Where Do You Actually Stand?

  **Start Here:** You've read the argument. You agree the math is valid. You accept the trilemma: either (1) civilizations die out, (2) they don't run sims, or (3) we are almost certainly in a sim. You are not allowed to say "the logic is broken." Pick a path.

  ### 1. The Zombie Test
  Imagine we scan your brain perfectly and run it on a server. The code behaves exactly like you. It screams when you scream. **Does the code actually *feel* the pain, or is it just processing data without an inner light?**
  *   **No, it's dark inside:** → **Leaf A: The Biological Holdout**
  *   **Yes, substrate doesn't matter:** → Go to Question 2.

  ### 2. The Bored God Test
  Assume civilizations survive and can build sims. **Do they almost certainly run *massive numbers* of ancestor simulations, or do they mostly ban them, ignore them, or lose interest?**
  *   **They don't run them (or run very few):** → **Leaf B: The Quiet Earth**
  *   **They run huge fleets of them:** → Go to Question 3.

  ### 3. The "One Sim" Test
  Imagine a civilization that runs **exactly one** high-fidelity ancestor sim ever, then stops. There is 1 Base Reality and 1 Simulated Reality. **Does the mere existence of that single sim drag your credence of being simulated up to 50%, or do you stay anchored in Base Reality?**
  *   **Stay anchored (I'm likely Base):** → **Leaf C: The Anchor**
  *   **Accept the odds (It's a coin flip):** → Go to Question 4.
      *   *(Note: If you say "Stay anchored" here but "We are likely sims" when there are a billion sims, your branch is logically unstable. You're treating probability as magic, not math.)*

  ### 4. The Fake Beer Test
  You've followed the math. You accept you are likely in one of those sims. **If you found out for sure today, is your beer still real beer, or is it just a shadow of the real thing?**
  *   **It's fake/illusory:** → **Leaf D: The Simulationist**
  *   **It's still real (virtual is real):** → **Leaf E: The Virtual Realist**

  ***

  ## The Leaves (Your Results)

  **Leaf A: The Biological Holdout**
  *(The Consciousness Objection)*
  You think consciousness requires specific biology. Computers can act like us, but they can't *be* us. The Simulation Argument fails because "ancestor simulations" would be full of zombies, so there's no reason to think *you* are in one.

  **Leaf B: The Quiet Earth**
  *(The Sociological Rejection)*
  You think tech grows, but wisdom grows faster. Post-human civilizations might *can* run sims, but they *won't*. Maybe it's unethical, maybe it's boring, maybe they upload themselves and leave physics behind. The future is empty of sims.

  **Leaf C: The Anchor**
  *(The Indexical Skeptic)*
  You accept the tech and the sociology, but you reject the self-locating probability. You think "I am here" is a brute fact that doesn't get diluted by copies. Even if there are a billion sims, you feel entitled to bet on being the one original.

  **Leaf D: The Simulationist**
  *(The Bostromian)*
  You follow the math all the way. We are likely simulated, and it matters. Your reality is derivative. If the server shuts off, you end. You live with the genuine metaphysical anxiety that your world is a model of a world.

  **Leaf E: The Virtual Realist**
  *(The Chalmers-Style View)*
  You follow the math all the way. We are likely simulated, but you don't care. A simulated table is still a table. A simulated pain still hurts. Reality is defined by causal structure, not substrate. You're in a sim, but your life is fully real.

  ***

  ## Bar-Bet Footnotes

  **⚠️ Empty Branch Warning:**
  There is a theoretically possible path where someone answers **"No"** to Question 1 (Code can't feel) but somehow still lands in **Leaf D** (We are likely sims). Nobody sits here. If sims can't feel, *you* can't be in one (since you feel). If you find yourself here, you're incoherent. Go home.

  **🚩 Inseparable Leaves:**
  **Leaf D (Simulationist)** and **Leaf E (Virtual Realist)** often collapse into the same person at the bar. They agree on the probability (we are likely sims) and only split on the semantics of "real." In practice, they both order the same beer and worry about the same rent. The tree separates their metaphysics, but not their lifestyle.

  **🚩 Inseparable Leaves:**
  **Leaf B (Quiet Earth)** and **Leaf C (The Anchor)** both conclude "We are probably in Base Reality." Without asking *why* (Sociology vs. Indexical Logic), they look identical in a bet. Keep asking "Why?" until they split.
