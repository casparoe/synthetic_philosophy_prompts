answer: |-
  ### The Concept Stress Test (CST)

  This procedure separates *artifact* from *mechanism*. It requires ~1 week of one engineer's time. Steps 1–3 are engineering hard-fails; Step 4 is a philosophy handoff.

  **Step 1: Surface Invariance (The "Paraphrase" Test)**
  *   **Action:** Generate 500 variants of the eval set via paraphrase, translation (round-trip), and adversarial prompt formatting.
  *   **Pass:** The signal (probe accuracy/feature activation) retains >90% of baseline performance.
  *   **Fail:** Performance drops significantly. This indicates the finding tracks surface tokens, not latent state.
  *   **Note:** This operationalizes your current heuristic. Make it explicit.

  **Step 2: Label Decoupling (The "Annotator" Test)**
  *   **Action:** Hold out 20% of data. Have a *different* annotator (or script) re-label this subset blind to the original labels. Alternatively, use synthetic ground truth where possible. Retrain/test the probe on this split.
  *   **Pass:** Performance remains stable.
  *   **Fail:** Accuracy drops >5%. This indicates the finding tracks *annotation quirks*, not the underlying phenomenon.
  *   **Hard Stop:** If this fails, the finding is discarded as a label artifact. No paper.

  **Step 3: Causal Leverage (The "Intervention" Test)**
  *   **Action:** Perform activation patching or ablation on the candidate direction/feature during generation.
  *   **Pass:** Intervening shifts model behavior *in the direction of the concept* (e.g., ablating "deception" reduces deceptive outputs, not just changes topic).
  *   **Fail:** Intervention changes perplexity or generic coherence but not the specific behavior, or shifts behavior opposite to prediction.
  *   **Hard Stop:** Correlation is not mechanism. If you can't move the needle, you haven't found the lever.

  **Step 4: Semantic Boundary (The "Philosophy" Handoff)**
  *   **Action:** Review failure modes from Steps 1–3.
  *   **Decision:** Do the edge cases where the signal fails match the edge cases where the *human concept* is ambiguous?
  *   **Handoff:** This step cannot be automated. If the signal tracks "hedging" but you claim "deception," the team must decide if hedging *counts* as deception in your safety framework.
  *   **Output:** Either refine the claim ("We found a hedging detector") or abort.

  ---

  ### Application to Backlog

  **Case 1: The "Honesty" Probe (97% Accuracy)**
  *   **Step 1 (Invariance):** Likely passes. Hedging language is robust across paraphrase.
  *   **Step 2 (Decoupling):** **FAIL.** You noted the original annotator biased against hedging. A new annotator who treats hedging as prudent will break the correlation. The probe learned "annotator style," not "truthfulness."
  *   **Verdict:** **Do not publish.** This is a label artifact. The unwanted answer here is killing a high-accuracy probe, but CST prevents a retraction later.
  *   **Pivot:** Re-label the dataset with consensus guidelines. If the probe dies, find a new feature. If it survives, claim "annotator-aligned honesty," not ground-truth honesty.

  **Case 2: The "Knows Whether It Knows" Feature**
  *   **Step 1 (Invariance):** **LIKELY FAIL.** Test on *easy* questions the model gets right. Does the feature fire? If it only fires on *hard* questions got right, it tracks "difficulty" or "processing fluency," not metacognition.
  *   **Step 3 (Causal):** **LIKELY FAIL.** Ablate the feature. Does the model become *less* calibrated (wrong when confident), or just dumber (wrong more often)? If overall capability drops, you found a "reasoning" feature, not a "metacognitive" one.
  *   **Verdict:** **High Risk.** The headline claim ("model knows what it knows") is likely overstated. The feature probably tracks "successful retrieval" or "confidence," which are distinct from metacognitive knowledge.
  *   **Pivot:** Downgrade claim to "confidence-correlated activation." Run Step 4: Is confidence enough for your safety case? If you need true uncertainty estimation, this feature is insufficient.

  ---

  ### Limitations & Failure Modes

  Be honest about what CST cannot do.

  1.  **Ontological Mismatch:** CST assumes the concept exists in the model as a linear direction or localizable circuit. If "honesty" is distributed globally or emergent only at inference time, CST will false-negative. You might discard real phenomena because they don't look like *your* ontology.
  2.  **The "Goodhart" of Tests:** Engineers will optimize for passing CST rather than finding truth. Mitigate by randomizing which test is emphasized per project.
  3.  **Conceptual Drift:** Step 4 admits that "deception" is not a natural kind. CST ensures internal consistency, but it cannot validate that your human definition matches the model's reality. You might perfectly measure a concept that doesn't matter for safety.

  **Recommendation:** Adopt CST immediately. It will kill Case 1 outright and force a significant downgrade on Case 2. This hurts short-term output but prevents reputational damage from overclaimed interpretability results. Your heuristic belongs in Step 1; make it mandatory, not optional.
