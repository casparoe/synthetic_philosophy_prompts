answer: |-
  The principle that unifies your reactions is the **Communicative Covenant of Candor**.

  This principle holds that every conversation operates under an implicit (or explicit) agreement about how truth will be used, based on the relationship and context. Deception is wrong not because of the literal truth-value of the sentences spoken, but because it violates the listener's **reasonable reliance** on the speaker to uphold the covenant appropriate to that setting.

  Here is how the covenant works:
  1.  **Context Sets the Norm:** A used car lot, a job interview, a family kitchen, and a yard sale all have different default settings for "how much truth is required."
  2.  **Active Speech Raises the Bar:** Choosing to speak triggers an expectation of relevance and candor (Gricean maxims). Silence usually carries a lower burden than speech unless a specific duty to disclose exists.
  3.  **Intent to Exploit Matters:** If you craft a technically true statement specifically to induce a false belief you know the listener will reasonably draw, you have broken the covenant just as surely as if you had lied. The "work" the listener does to deceive themselves does not absolve you if you rigged the puzzle.

  ### Applying the Principle to Your Seven Cases

  *   **(1) Truck/Bodywork:** **Verdict Stands.** The sales context implies a covenant against active concealment of defects. By speaking ("never had bodywork"), you invite reliance. Engineering the sentence to hide the crash violates the covenant of candor, even if literal truth is preserved. It is a "trap," as you noted.
  *   **(2) Job Interview:** **Verdict Stands.** Professional hiring relies on a covenant of accurate history. "Ready for a change" exploits the employer's reasonable assumption that you aren't hiding firing. It violates the norm, hence "Bad."
  *   **(3) Truck/Lie:** **Verdict Stands.** This violates both the covenant of candor *and* the literal truth. It is the baseline violation. Your gut says it's "not by much more" than Case 1 because the *harm* and *intent* are identical; the covenant breach is the primary moral injury, not the syntax.
  *   **(4) Truck/Silence:** **Verdict Stands.** In used car sales (absent specific warranty laws), the covenant is often *caveat emptor* regarding unasked questions. Silence does not trigger the expectation of relevance that speech does. It leaves the false belief alone rather than arming it.
  *   **(5) Hyperbole:** **Verdict Stands.** The social context explicitly suspends the literal truth covenant. Everyone knows "a thousand times" is not a data claim. No reasonable reliance is violated.
  *   **(6) Yard Sale Puffery:** **Verdict Stands.** Haggling has a known "game" norm where claims about offers are treated as negotiation tactics, not facts. The covenant allows for bluffing.
  *   **(7) Grandmother:** **Verdict Stands.** Family trust carries the highest covenant of candor. "Eating fine" is technically true but exploits her concern to hide a crisis. This violates the duty of care inherent in the relationship, making it worse than Yard Sale puffery (Case 6) where no trust is at stake.

  ### Do Any Verdicts Need to Go?

  **All seven verdicts stand.**

  Your intuitions are not inconsistent; they are context-sensitive. You were struggling because you were trying to apply a single rule (e.g., "Lying is always worse than truth") to a multi-variable system. Your gut correctly identified that the *relationship* and the *act of speaking* matter more than the binary of True/False. Case 1 feels like Case 3 because both break the covenant; Case 4 feels better because silence doesn't trigger the covenant in the same way; Case 7 feels worse than Case 6 because the family covenant is stricter than the haggling covenant. You do not need to sacrifice any of these judgments to achieve consistency.

  ### Applying to the New Cases

  **The Nurse Case:**
  *   **Verdict: Not Fine.**
  *   **Reasoning:** The medical context creates a high-stakes covenant of candor regarding *individual* prognosis. While "the majority recover" is statistically true, the nurse knows this patient is in the minority. Offering the statistic without qualification exploits the patient's vulnerability and reasonable reliance on the nurse for *relevant* truth. It is structurally identical to your Grandmother case (Case 7): using a technical truth to comfort while withholding the material reality the listener needs to prepare. It violates the duty of care.

  **The "Ask Me Anything" Seller:**
  *   **Verdict: Not Fine.**
  *   **Reasoning:** This seller has moved beyond the standard used-car covenant to an *explicit* contract ("I answer everything straight"). By using a technically-true dodge (like Case 1) after promising straight answers, they violate both the general norm and their specific promise. This is arguably worse than Case 1, as it adds the breach of an explicit pledge to the breach of the implicit covenant.

  \answer{Communicative Covenant of Candor; all seven verdicts stand; nurse case: not fine}
