answer: |-
  # INVERTEBRATE SENTIENCE & WELFARE DECISION MATRIX (ISW-DM)
  **Purpose:** Operationalize funder mandates for invertebrate welfare.
  **Philosophical Stance:** Sentience is **graded**, not binary. Protection is proportional to the probability of affective experience (suffering), not just biological life. Where evidence conflicts, the **Precautionary Principle** applies: err on the side of welfare if the cost to the animal is high.

  ### I. THE PROCEDURE (Run time: ~15 mins)

  **Step 1: Anatomical Substrate Screen**
  *   **Q1:** Does the species possess a centralized nervous system with recurrent processing loops (feedback between sensory and integrative regions)?
      *   *Yes:* Proceed to Step 2.
      *   *No:* Proceed to Step 3 (Behavioral override possible).
      *   *Unknown:* Treat as "No" but flag for Precautionary Review.

  **Step 2: Behavioral Pain Screen (Nociception vs. Affective State)**
  *   **Q2:** Does the animal exhibit **motivational trade-offs** when injured? (e.g., sacrificing feeding/mating to protect/groom an injured site, or paying a cost to avoid a stimulus associated with injury).
      *   *Yes:* **Presumptive Sentience.**
      *   *No (Reflex only):* **Presumptive Non-Sentience.**
      *   *Mixed/Unknown:* Proceed to Step 3.
  *   **Q3:** Does the animal self-administer analgesia or show long-term behavioral change after noxious stimuli?
      *   *Yes:* **Confirmed Sentience.**

  **Step 3: Conflict Resolution**
  *   If Anatomy = No but Behavior = Yes (e.g., decentralized brain but complex trade-offs): **Classify as Sentient.** (Behavioral evidence of suffering trumps anatomical skepticism).
  *   If Anatomy = Yes but Behavior = No (e.g., paralyzed or simple reflexes): **Classify as Gray Zone.**

  **Step 4: Tier Assignment & Protection Level**
  *   **Tier 1 (High Confidence Sentient):** Mandated vertebrate-equivalent protections. Anesthesia/analgesia required for invasive procedures. Humane endpoint strictures apply.
  *   **Tier 2 (Gray Zone/Precautionary):** Protections required *unless* scientifically waived. Requires Subcommittee Vote. Minimization of noxious stimuli mandatory.
  *   **Tier 3 (Non-Sentient):** No special welfare protections beyond ecological containment.

  **Step 5: The Human Stop**
  *   Any Tier 2 classification goes to a **Committee Vote**. If the vote is split, the Attending Veterinarian has tie-breaking authority based on "reasonable person" standards of cruelty, not scientific utility.

  ---

  ### II. PROTOCOL APPLICATIONS

  **1. Octopus Learning Study (Physiology)**
  *   **Anatomy:** Centralized, large brain, recurrent loops. (Pass)
  *   **Behavior:** Complex avoidance, wound tending, camouflage indicating state. (Pass)
  *   **Result:** **Tier 1.**
  *   **Action:** Full anesthesia for surgery. Enrichment required. Strict humane endpoints. No objection.

  **2. Bumblebee Foraging Experiment (Ecology)**
  *   **Anatomy:** Decentralized ganglia, mushroom bodies (integration debated). (Fail/Gray)
  *   **Behavior:** Demonstrates motivational trade-offs (accepting bitter quinine for high sugar); injured bees alter grooming and foraging priority. (Pass)
  *   **Conflict:** Behavior indicates affective state despite diffuse anatomy.
  *   **Result:** **Tier 2 (Precautionary Sentience).**
  *   **Action:** **VOTE REQUIRED.** Procedure mandates minimizing noxious stimuli (e.g., no wing-clipping without analgesia justification).
  *   **Note:** This classification validates insect sophistication but imposes monitoring costs that may exceed the ecology department's budget, potentially halting high-volume field work.

  **3. High-Throughput Nematode Work (Molecular Bio)**
  *   **Anatomy:** 302 neurons, no recurrent integration loops, fixed connectome. (Fail)
  *   **Behavior:** Nociceptive withdrawal present, but no evidence of motivational trade-off or long-term avoidance learning related to pain. (Fail)
  *   **Result:** **Tier 3.**
  *   **Action:** No welfare protocols. Exempt from pain/analgesia review.
  *   **Note:** Despite high numbers, the probability of sentience is too low to trigger the Precautionary Principle.

  ---

  ### III. LIMITATIONS & DISGUISED JUDGMENTS

  **1. The "Trade-Off" Judgment:** Step 2, Q2 is the critical bottleneck. Distinguishing a complex reflex from a "costly choice" is interpretive. A statistician may see optimization; a vet may see suffering. This is not empirical; it is **anthropomorphic inference**.
  **2. The Graded Trap:** By creating Tier 2, we claim to handle "partial sentience." Philosophically, this is incoherent (you either feel pain or you don't). Practically, it is a **bureaucratic compromise** to allow research to proceed under scrutiny.
  **3. The Vote:** Step 5 admits the procedure fails. When science is ambiguous, we do not vote on truth; we vote on **moral risk tolerance**. This procedure cannot resolve the Hard Problem of Consciousness; it only manages institutional liability and ethical risk.

  **Chair's Directive:** Do not debate philosophy in the meeting. Run the matrix. If the matrix outputs Tier 2, vote. Record the dissent. Proceed.
