      *   *Claim 6:* $h^2$ is higher in advantaged backgrounds (Scarr-Rowe effect). Equalizing environments $\rightarrow$ $h^2$ climbs. This is a success metric. Puzzled how gene influence grows while genes stay same.
          *   *Status:* The Scarr-Rowe effect is debated but plausible. The interpretation ($h^2$ rises as $V_E$ shrinks) is mathematically correct based on Claim 1. The "puzzle" (how can influence grow?) is conceptual: it's not the *influence* growing, it's the *proportion of variance*.

