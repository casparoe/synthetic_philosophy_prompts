  Your friend's verdicts reveal a sophisticated and internally consistent metaphysics of personal identity. She is clearly an **Origin Essentialist** (Cases 1, 5) who also subscribes to a **Non-Branching Constraint** (Cases 3, 4). She rejects psychological continuity (Case 2) and cloning (Case 5), anchoring identity firmly in the biological history of the specific zygote. However, the tension between Case 3 (twins $\rightarrow$ neither) and Case 4 (twin dies early $\rightarrow$ survivor) leaves a crucial ambiguity: *Is identity destroyed by the event of branching itself, or only by the existence of a rival?*

  Here is the reconstruction of the rules, their predictions, and my analysis.

  ### Two Candidate Rules

  Both rules fit Cases 1–5 perfectly but diverge on the nature of the "Non-Branching" constraint.

  **Rule 1: The Historical Non-Branching Principle**
  *   **Core Tenet:** You are the unique continuant of your specific zygote, provided that your developmental history never branches into two *persons*.
  *   **The Constraint:** Branching is a historical event. If the causal chain of your zygote ever produces two distinct persons, identity is irrevocably broken for *both*, regardless of whether one dies later. The existence of a rival person at *any* point extinguishes the original identity.
  *   **Fit:** Explains Case 3 (two persons $\rightarrow$ neither) and Case 4 (only one person ever exists $\rightarrow$ identity holds).

  **Rule 2: The Sole Survivor Principle**
  *   **Core Tenet:** You are the unique continuant of your specific zygote, provided there is no *current* rival continuant.
  *   **The Constraint:** Branching is a relational state. Identity is lost only while a rival exists. If a rival person is created but subsequently dies, the survivor re-establishes uniqueness and inherits the identity.
  *   **Fit:** Explains Case 3 (rival exists $\rightarrow$ not her) and Case 4 (rival never becomes a person $\rightarrow$ is her).

  ### Predictions for the New Cases

  | Case | Description | Rule 1 (Historical) | Rule 2 (Sole Survivor) |
  | :--- | :--- | :--- | :--- |
  | **(a)** | **Chimera:** Embryo fuses with independent embryo. | **Not Her.** (Violates Origin Purity: The resulting person originates from *two* zygotes, not just hers.) | **Is Her.** (Provided her zygote's cells are dominant/continuous, she is the unique survivor of that zygote line.) |
  | **(b)** | **Split & Re-fuse:** 4-cell split, then re-fusion. | **Is Her.** (No *persons* were formed; the biological trajectory remained effectively singular.) | **Is Her.** (Same reasoning; continuity was never permanently rivaled.) |
  | **(c)** | **Twin Death:** Twin dies at 30. | **Not Her.** (Branching into persons occurred; the historical break is permanent.) | **Is Her.** (The rival is gone; the survivor is now the unique continuant.) |

  *Note: Case (b) yields agreement, but Cases (a) and (c) provide clean divergence.*

  ### My Best Guess at Her Verdicts

  I predict your friend will verdict as follows:

  *   **(a) Chimera:** **Not Her.**
  *   **(b) Split & Re-fuse:** **Is Her.**
  *   **(c) Twin Death:** **Not Her.**

  **Reasoning:**
  I favor **Rule 1 (Historical Non-Branching)** over Rule 2. The decisive clue is in her phrasing for Case 3: *"on her telling, she simply would never have existed."*

  If she followed Rule 2 (Sole Survivor), she would likely say of the twins, *"They would both be candidates, but neither is uniquely her."* Instead, she asserts a metaphysical cancellation: the branching event itself negates her existence. This suggests identity is a fragile historical property that shatters upon fission, not a relational status that can be restored by the death of a rival.

  Furthermore, her strictness in Case 1 (different sperm $\rightarrow$ not her) and Case 5 (clone $\rightarrow$ not her) suggests a **Purity of Origin** view. A chimera (Case a) has a "mixed" origin. Even if her zygote is present, the *exclusive* causal link required by Origin Essentialism is contaminated by the second zygote. She will likely view the chimera as a *new* entity, distinct from either original zygote's identity.

  ### The Tie-Breaking Case

  While Case (c) discriminates between Rule 1 and Rule 2, your friend might hedge on the "30 years" detail (arguing that 30 years of shared history creates a special bond). To cleanly discriminate between the **Historical** vs. **Survivor** principles without the noise of adult psychology, I recommend adding this case to a future game:

  **The "One-Day Twin" Case:**
  > "The zygote splits, and identical twins are born. However, one twin suffers a fatal heart defect and dies **24 hours after birth**, while the survivor lives to old age. Is the survivor her?"

  *   **Rule 1 (Historical) predicts:** **Not Her.** (The branching event into two persons occurred; the history is tainted.)
  *   **Rule 2 (Sole Survivor) predicts:** **Is Her.** (The rival existed only briefly; the survivor is the sole continuant for almost the entire life.)

  If she says "Not Her," Rule 1 is confirmed: identity is determined by the *structure of the origin event*, not the duration of the rivalry. If she says "Is Her," Rule 2 is confirmed: identity is determined by the *current uniqueness* of the biological line. Given her "never existed" remark, I suspect she will stick with "Not Her."
