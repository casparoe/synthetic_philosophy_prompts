      *   *Thesis 4 (Opportunity Cost):* Plausible. Lab resources are finite. Supports stopping? Yes, if other projects have higher ROI.
      *   *Thesis 5 (Sunk Cost as Signal):* This is the tricky one the user asked for. Can past cost justify future cost? Yes, if past cost signals "near completion" or "high barrier to entry cleared." In this specific case (80% done), the sunk cost indicates *proximity to completion*. This supports *continuing*.

  5.  **Refining the Argument (Self-Correction/Nuance):**
