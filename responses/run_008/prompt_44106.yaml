      *   *Correction on Thesis 5:* Standard econ says "ignore sunk costs." However, in *signaling* or *real options* theory, past investment can change the probability of success. If I've climbed 80% of the mountain, the cost to get to the top is lower than starting a new mountain. The "sunk cost" isn't a reason in itself, but it changes the *marginal* landscape (completion is closer). I need to be precise: Sunk costs aren't recoverable, but the *state* achieved by those costs (80% complete) is relevant.
      *   *Refining the "Sunk Cost as Reason" point:* The user asks if a sunk cost can be a *legitimate reason*. Strictly, no. But the *progress* purchased by that cost is a legitimate reason. I should distinguish between "money spent" (irrelevant) and "progress made" (relevant). However, sometimes money spent signals quality (e.g., "we've already vetted this heavily"). I will frame this carefully.

