answer: |-
  **The Principle of Reciprocal Normative Competence**

  Resentment is apt if and only if three conditions are jointly satisfied:
  1.  **Competence:** The target possesses the current capacity to recognize and respond to moral reasons (normative competence).
  2.  **Quality of Will:** The target's conduct manifests a disregard for those reasons that is attributable to their agency (ill will or culpable indifference).
  3.  **Reciprocity:** The target and the resenter stand in a relationship of mutual accountability regarding the norm in question (shared subjection).

  **Application to Your Verdicts**

  This principle generates your intuitions in Cases 1 through 6 and 8 by treating responsibility as a function of current participation in a normative community, rather than a metaphysical property of the will's history.

  *   **Cases 1, 3, 4:** These turn on **Competence**. The colleague (1) and the 21-year-old (3) possess the capacity to attend to others; the 7-year-old (3) and the Tourette's sufferer (4) do not (or not fully). The principle predicts the gradient of resentment you describe.
  *   **Case 2:** This turns on **Quality of Will**. The friend's neglect does not manifest ill will or culpable indifference; the emergency overrides the normative demand. The principle explains why the neglect is "real" but resentment is "out of order."
  *   **Case 5:** This turns on **Competence**. The dementia patient has lost the capacity for normative recognition. The principle dictates that resentment is unavailable, validating your feeling that it is an "achievement of understanding" to let it go.
  *   **Case 6:** This turns on **Reciprocity**. The principle distinguishes *Aptness* (Conditions 1 & 2) from *Standing* (Condition 3). When you blame the neighbor, Conditions 1 and 2 are met (he is competent and wrongful), so the blame is *apt*. However, because you violate the same norm, Condition 3 is broken; you have forfeited your standing. This explains why the blame feels "improper" even though "nothing false" is in it.
  *   **Case 8:** The principle treats "agency" functionally. If an institution manifests a quality of will and possesses normative competence (via its decision structures), resentment is apt. The principle validates your intuition that the feeling is not a confusion.

  **The Sacrifice**

  To maintain the coherence of this principle, **Verdict 7 (The Propaganda Case) must be overturned.**

  Your verdict holds that the man brainwashed by propaganda is exempt from resentment, while the man who chose his callousness is not, despite identical current states of will. The Principle of Reciprocal Normative Competence rejects this distinction. If the propaganda victim currently possesses the capacity to recognize moral reasons (Competence) and acts on callous values (Quality of Will), he is a participant in the moral community. His history is irrelevant to the current reciprocal relationship.

  This is the cost: You must resent the propaganda victim. To do otherwise is to step outside the participant stance and adopt the objective stance toward someone who is, by all current functional measures, a moral agent. Strawson's insight was that the "objective attitude" is reserved for those who *cannot* participate, not those whose participation was causally determined. Holding the propaganda man responsible affirms his current capacity to re-evaluate his values, whereas pity denies it.

  **Predictions for New Cases**

  **1. The Depression Case**
  *Scenario:* A friend wrongs you during a depression that dimmed his concern but left his control intact.
  *Prediction:* **Resentment is apt.**
  *Reasoning:* Under the principle, "control intact" satisfies **Competence**. "Dimmed concern" satisfies **Quality of Will** (it is a disregard for reasons, even if motivated by pathology). Unless the depression was so severe as to destroy the capacity for recognition entirely (which you stipulate it did not), the condition of reciprocity holds.
  *Cost:* This feels harsh. It demands that we hold loved ones accountable for the symptomatic behavior of illness, provided agency remains. The principle suggests that withholding resentment here is an act of grace (a suspension of the attitude), not a judgment that the attitude was *inapt*.

  **2. The Newcomer Case**
  *Scenario:* A newcomer to a moral community is subject to its blame but not yet a party to its norms.
  *Prediction:* **The newcomer lacks standing to blame.**
  *Reasoning:* This turns on **Reciprocity**. To properly blame is to demand compliance with a norm to which both parties are mutually subject. If the newcomer is not yet a "party" (has not ratified the norms or is in a probationary status), Condition 3 fails. They may register the wrongness (aptness conditions 1 & 2 may be met regarding the established member), but the reactive attitude of resentment—and the speech act of blame—requires a standing they do not yet possess.
  *Consequence:* This predicts that the newcomer's blame will feel "presumptuous" or "external," distinct from the "internal" blame of established members, even if the accusation is true.
