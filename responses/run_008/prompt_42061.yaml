answer: |-
  This is a classic collision between high-fidelity decision theory and phenomenological philosophy. Since you're coming from the old LessWrong tradition, you're likely treating Expected Utility Theory (EUT) as a normative ideal for how agents *ought* to reason. L.A. Paul is attacking the *preconditions* required to run that algorithm.

  Your friend's summary is about 80% accurate on the core thesis but drifts into caricature on the implications and scope. Here is the breakdown of what Paul actually argues, where your friend is exaggerating, and what ammo you have for the next meetup.

  ### 1. "Can't know what it's like" vs. "Can't know if it's good"
  **Verdict:** Your friend is squishing two distinct claims together, though Paul argues they entail each other.

  Paul distinguishes between **Epistemically Transformative Experiences (ETEs)** and **Personally Transformative Experiences (PTEs)**.

  *   **Epistemic Transformation:** You cannot know the *phenomenology* of the experience without having it. (e.g., You cannot know what it *feels like* to see the color red if you are colorblind, or what it feels like to hold your newborn child.)
  *   **Personal Transformation:** The experience changes your *core preferences* and your conception of your self. (e.g., After having a child, you might no longer value quiet weekends or career ambition in the same way.)

  **The Link:** Paul argues that standard EUT requires you to assign a utility value ($U$) to an outcome. She contends that utility is grounded in phenomenology (how good the experience feels to the subject). Therefore, if you cannot access the phenomenology (Epistemic), you cannot assign the utility. Furthermore, if the choice changes the entity that holds the preferences (Personal), the utility function itself is unstable across the decision boundary.

  **Correction for your friend:** It's not just "I don't have data." It's "I cannot *in principle* have the data required to populate the variables of the equation before I solve it."

  ### 2. The "Imagine Your Future Self" Counter
  **Verdict:** Your friend is correct that Paul rejects this, but the reasoning is specific.

  A standard rationalist move is: "I can't experience it, but I can model it. I'll look at other parents, simulate the state, and assign a probability distribution."

  Paul's specific counter-argument is that **imagination is parasitic on experience.** To imagine being a vampire or a parent, you are merely imagining your *current self* in a vampire/parent situation. You are not imagining the *phenomenological shift* of actually becoming that new self. You are simulating the scenario using your current utility function, but the choice is precisely about adopting a new utility function.

  She calls this the **Problem of Perspective.** You are trying to make a first-person choice using third-person data, but the value of the experience is inherently first-person.

  ### 3. "Every choice changes you a bit"
  **Verdict:** **Straight up wrong.** This is your friend over-extending the concept to the point of uselessness.

  Paul is very careful to demarcate *Transformative* experiences from ordinary learning or preference updates.
  *   **Ordinary Choice:** I try a new food. I like it. I update my preference for "foods like this." My core self remains continuous.
  *   **Transformative Choice:** I become a parent / I convert to a religion / I undergo a major medical procedure. The change is radical enough that there is a discontinuity between the "self before" and the "self after."

  If your friend argues "everything is transformative," they are dissolving the concept. Paul's argument relies on the *special* status of these choices where standard decision procedures break down. If everything is transformative, then EUT never works, which is not her claim. She admits EUT works fine for choosing between cereal brands.

  ### 4. The Big One: Is Decision Theory Inapplicable?
  **Verdict:** Accurate to Paul's text, but your friend's "coin flip" conclusion is an exaggeration.

  Paul does argue that **standard Expected Utility Theory is inapplicable** to these specific choices. You cannot maximize expected utility if you cannot assign utilities.

  **However,** she does **not** conclude that the choice is a "coin flip" or that you should "go with your gut." That is the straw man.

  Her proposed alternative is **Authenticity.** She argues that when you cannot choose based on outcome utility (because you don't know the outcomes), you should choose based on whether the option allows you to authentically discover who you are. You choose the transformative experience *in order to become* the person who can evaluate it.

  **The Rationalist Critique:** From a LW perspective, "Authenticity" looks like a hidden utility function. If you value "becoming who you are meant to be," then you *are* maximizing expected utility, you've just set $U(\text{self-discovery}) > U(\text{current comfort})$. Paul would reject this, arguing that you can't value the discovery until you've experienced the transformation, but this is the main friction point.

  ### Summary for Your Debate
  Here is how you can fairly push back at the meetup:

  1.  **Call out the "Coin Flip" Caricature:** "Paul doesn't say these decisions are arbitrary. She says the *criteria* for rationality shifts from Outcome Maximization to Authenticity. That's not 'gut feeling,' it's a different objective function."
  2.  **Challenge the Scope:** "Paul explicitly distinguishes transformative choices from ordinary ones. If you claim 'every choice is transformative,' you're breaking her model, not using it."
  3.  **The Proxy Data Argument (Your Ammo):** Paul argues testimony from others doesn't work because their phenomenology isn't yours. A rationalist counter is **Bayesian updating on reference classes.** "I don't need to know *my* phenomenology as a parent. I need to know the correlation between 'people like me' and 'reported satisfaction as parents.' I can assign utility to the *statistical outcome* even if I can't simulate the *qualia*." Paul has responses to this (the "what it's like" is irreducible), but it's a valid counter-attack.
  4.  **Revealed Preference:** "People make these decisions all the time. If EUT were truly inapplicable, we would see random noise in the data. Instead, we see patterns. This suggests humans are using a heuristic that approximates EU, or that Paul's bar for 'knowing utility' is impossibly high."
  5.  **The "Revealed Error" Argument:** If Paul is right, rationality has a hard limit. If you're a "shut up and multiply" person, you might argue that Paul has identified a cognitive limitation, not a metaphysical one. The rationalist project is to build tools (like better simulation, better proxy data) to overcome the limitation, not to surrender and say "decision theory doesn't apply."

  **Bottom Line:** Your friend is right that Paul attacks the *inputs* of the Bayesian machine, but wrong that she advocates for *arbitrariness*. She advocates for a different kind of reasoning (authenticity) when the math breaks. Your job is to argue that the math doesn't break if you broaden the definition of "utility" to include the value of information and self-discovery.
