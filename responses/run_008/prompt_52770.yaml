answer: |-
  It is completely understandable that you feel frustrated by that slogan, because while it is one of the most famous lines in the philosophy of biology, it is often tossed around as a conversation stopper when it is actually a dense metaphysical claim that requires unpacking. The phrase species are individuals, not kinds comes from the work of Michael Ghiselin and David Hull in the nineteen seventies, and it was intended to overturn the traditional essentialist view that had dominated biology since Aristotle. When your TA and professor use it to shut down discussion, they are likely relying on the intuition that it solves problems of identity and boundary, but as you have noticed, it does not automatically resolve every case without further premises. To help you navigate this for office hours, I think it is best to treat the slogan not as a single claim but as a cluster of distinct propositions ranging from the uncontroversial to the radical, and to test each one against your mammoth and salamander examples.

  The weakest and most plausible reading of the slogan is simply the claim that species are historical entities rather than timeless abstract objects. On this view, saying species are individuals just means that a species has a birth, a life, and a death in time, much like an organism or a nation, whereas a kind or a class is something like a number or a geometric shape that exists outside of time. If species are historical individuals, then the woolly mammoth species began when the population diverged from its ancestor and ended when the last genuine mammoth died. This reading is largely consensus view in modern philosophy of biology and is not particularly radical. However, while it establishes that the original mammoth species is extinct, it does not strictly settle the de-extinction debate on its own. One could argue that we are simply extending the life of the historical individual by adding new parts to it, much like repairing a ship. To get the result that the revived mammoths are a different species, you need a stronger claim about what counts as continuing the life of that individual. Similarly, for the Ensatina salamanders, this historical reading tells us the ring has a location in time and space, but it does not tell us whether the ring constitutes one historical individual or several overlapping ones. So this reading is true but does too little work to justify shutting down the discussion.

  A much stronger and more substantive reading involves the mereological relationship between the organism and the species, which is where the slogan gets its radical edge. In the traditional kind view, an organism is a member of a species class because it possesses certain properties, like a specific DNA sequence or morphological trait. In the individual view, an organism is a part of the species individual because it is causally and genealogically connected to the rest of the parts. This means the relationship is part-to-whole rather than member-to-set. If you accept this reading, then you cannot create a part of a specific historical individual simply by copying its properties. If you clone a dog, the clone is not a part of the original dog's life history; it is a part of a new historical individual that happens to look identical. Applied to the woolly mammoth, this reading decisively settles the argument against the de-extinctionists. If the original mammoth species is a historical individual bounded by its specific genealogical network in the Pleistocene, then an elephant edited to look like a mammoth in the twenty-first century cannot be a part of that original individual because there is no continuous genealogical connection. It would be a new species individual that mimics the old one. This is a powerful argument, but it relies on accepting that genealogical connectedness is the only glue that holds the species individual together.

  However, when you take this mereological reading to the Ensatina salamanders, the slogan starts to wobble, which suggests your suspicion that it is doing different jobs in different contexts is correct. If a species is a single individual held together by genealogical connections, then the ring species presents a paradox. The neighboring populations interbreed, creating a continuous chain of parts, yet the ends do not interbreed. If the species is one individual, how can two parts of the same individual be incapable of interacting in the way that defines the cohesion of the individual? Some proponents of the individual thesis argue that this shows the ring is actually two species individuals that overlap in space, while others argue it is one individual with a complex shape. The slogan itself does not settle this; it merely shifts the question from do they share enough properties to be the same kind to are they connected enough to be the same whole. Because the connection is continuous around the ring but broken at the meeting point, the individual thesis does not provide a clear cutoff without adding further criteria about what degree of cohesion is required for individuation. So in the salamander case, the slogan sounds like a solution but actually just relocates the ambiguity from properties to relationships.

  There is a third reading that is often bundled into the slogan, which is the claim that species have no essential properties. This is the anti-essentialist thesis. If species are individuals, then there is no set of traits that every member must have, because individuals can change their properties over time without ceasing to be themselves. You can lose a hand and still be you, and a species can change its average morphology and still be the same species individual. This is a very plausible and widely accepted claim in modern biology, given what we know about variation and evolution. In the mammoth case, this supports the idea that even if the revived animals look exactly like the old ones, they might not be the same species, because looking alike is not what makes the species. However, this reading also does not fully settle the Ensatina case. If there are no essential properties, then the fact that the end populations look different or behave differently does not prove they are different species. You are left again relying on the genealogical connection, which returns you to the ambiguity of the ring. So while this reading is likely true, it is not the magic key that unlocks every taxonomic puzzle.

  So what do your professor and TA actually have in mind when they drop this line? I suspect they are primarily invoking the second reading, the mereological one, but they are treating it as if it carries the weight of the first reading. They want you to stop thinking about species as boxes that organisms fit into based on checklists of traits, and start thinking about them as historical lineages. When they say it settles the mammoth case, they are relying on the intuition that you cannot splice a new part onto a dead historical individual. When they say it settles the Ensatina case, they are likely implying that because the gene flow is interrupted at the ends, the causal cohesion required for individuality is broken, meaning there are two species individuals there, not one. But as you have rightly sensed, this requires an extra premise about how much interruption is allowed before an individual splits. The slogan itself does not contain that threshold. It is possible they are using it as a pedagogical shorthand to steer you away from essentialism, but in doing so they are obscuring the fact that the individual thesis creates its own boundary problems, just different ones than the kind thesis.

  If I were to bring this to office hours, I would frame it around the distinction between the historical claim and the mereological claim. You could ask whether the individual thesis requires continuous causal contact to maintain individuality, or if common ancestry is enough. In the mammoth case, there is common ancestry but no continuous contact. In the Ensatina case, there is continuous contact but no common ancestry between the ends that excludes the middle. Asking which of these conditions is necessary for being the same species individual will show your professor that you understand the slogan is not a single claim but a framework that requires specific criteria to be operational. It will demonstrate that you see why the slogan feels like it settles things when it actually just shifts the burden of proof from defining properties to defining relationships. Ultimately, the slogan is a useful correction to essentialism, but it is not a taxonomy machine. It tells you what kind of thing a species is, but it does not always tell you where one stops and another begins, and acknowledging that limitation is probably the most philosophical thing you can do in that course.
