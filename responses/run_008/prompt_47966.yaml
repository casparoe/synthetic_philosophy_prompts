prompt: |-
  Okay so last night my friend and I had this massive argument about the doctrine of double effect. Her position was basically that it's a dignified-sounding name for whatever our gut already decided — people who want to flip the switch write down "foreseen but not intended" and feel principled. My position was that the intended/foreseen distinction actually does work, that you can feel it doing work, but I had to admit that when I teach it, students just nod along like it's a vocabulary item. So I want to make them feel the distinction the way I felt it in the argument: by having to legislate it themselves and then getting wrecked by their own rule.

  The class: intro ethics, 18 students, one 80-minute session. Design a game where they act as some kind of precedent-setting tribunal — the setup should be futuristic or otherwise weird enough that they don't recognize "trolley problem" and reach for canned answers (so no actual trolleys; make it drones, or rescue robots, something like that). They should adjudicate a series of cases where an agent diverted a harm, ruling permissible/impermissible, and after every couple of cases each team has to write down a one-sentence rule that decides ALL such cases going forward. They get points for every future case their rule calls the way the majority calls it, minus points for every additional clause they bolt on later — so there's real pressure to find a genuinely general rule instead of patching, and the patches they do reach for should be where the double effect machinery (intended vs. foreseen, harm as means vs. side-effect) shows up as the thing that saves them. The case list should escalate: start with obvious ones, then the version where the five victims are out of danger but the track loops back around and the agent had to know it, then a case where the harm and the good are so entangled that any rule they wrote licenses something they'll hate. I don't need real-money payoffs, just points and maybe a dumb prize.

  Then the debrief: map specific moments in the game onto the actual distinctions, including the closeness problem (the case where foreseen harm is so close to what the agent does that "foreseen" feels like a lie). Also tell me honestly which parts of the doctrine the game can't reproduce and I'll have to just assert in the debrief, and what will predictably go wrong the first time I run it — I'm guessing the teams will try to smuggle words like "roughly" into their rules to dodge commitment, tell me how to handle that. And please don't have the debrief just vindicate the doctrine; if the game can equally support my friend's "it's all post-hoc" reading, I want the students to see that too. Sorry this got long, the argument is still kind of buzzing in my head.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Teach the Doctrine of Double Effect (DDE) to intro ethics students (18 students, 80 mins).
      *   **Problem:** Students treat DDE as vocabulary/post-hoc rationalization (like the user's friend argued) rather than a felt distinction.
      *   **Method:** A gamified tribunal simulation.
      *   **Setting:** Futuristic/weird (no trolleys) to avoid canned responses.
      *   **Mechanics:** Teams adjudicate cases, write one-sentence rules after every few cases, score points based on alignment with majority + penalty for rule complexity/patches.
      *   **Case Progression:** Obvious $\rightarrow$ Looping/Foreknowledge $\rightarrow$ Entangled Harm/Good (Closeness Problem).
      *   **Debrief:** Map game moments to DDE distinctions (intended/foreseen, means/side-effect), acknowledge limitations (what the game *can't* show), handle rule-dodging (e.g., using "roughly"), and remain neutral (allow space for the friend's critique).
      *   **Tone:** Practical, engaging, intellectually honest.

  2.  **Deconstruct the Game Mechanics:**
      *   *Teams:* 18 students $\rightarrow$ 3 tribunals of 6, or 6 tribunals of 3? 6 tribunals of 3 allows for more diverse rule-writing and easier comparison. Let's go with 6 "High Courts" of 3 students each.
      *   *Scoring:* Points for matching the "Class Consensus" (majority vote) on verdicts. Penalty for adding clauses to the rule later (incentivizes getting the *principle* right early).
      *   *The Hook:* They are legislating precedent for AI/Robot behavior. This fits the "futuristic" requirement and removes emotional baggage of human agents initially.
      *   *The Twist:* The "Closeness Problem" needs to break their rules.

  3.  **Drafting the Scenario (The "Skin"):**
      *   *Theme:* "The Archipelago Rescue Protocol."
      *   *Agent:* Autonomous Rescue Drones (ARDs).
      *   *Harm:* Energy surges, structural collapses, or "bio-sign termination" (too cold?), let's go with "Collateral Structural Damage" causing death.
      *   *Good:* Saving a population from a threat (flood, fire, plague).
      *   *Why Drones?* Removes "malice" or "emotional panic," focusing purely on the logic of the action, which makes the DDE distinction sharper (and harder to hide behind gut feelings).

  4.  **Developing the Cases (The Escalation):**
      *   *Case 1 (The Baseline):* Diverting a hazard away from 5 to 1. Classic switch.
          *   *Goal:* Get them to say "Minimize casualties" or "Save the most."
      *   *Case 2 (The Loop/Foreknowledge):* The hazard loops back. If they divert, the 1 dies, but the 5 are safe *only because* the 1 stops the hazard. (Wait, that's Fat Man). Let's stick to the prompt's specific request: "track loops back around and the agent had to know it."
          *   *Refinement:* The drone diverts a firestorm. It knows the firestorm will circle back and burn the one person it diverted *unless* that person's shelter absorbs the heat.
          *   *Actually, let's look at the prompt again:* "five victims are out of danger but the track loops back around and the agent had to know it." This sounds like the *Loop Variant* of the Trolley Problem. The 1 is needed to stop the threat to the 5.
          *   *Game Version:* Diverting an asteroid. It hits a small moon (1 person). The debris from the moon stops the asteroid from hitting the planet (5 people). The agent *knows* the debris is the mechanism.
      *   *Case 3 (The Entanglement/Closeness):* The harm is the means, but described as a side effect.
          *   *Game Version:* To save 5 from suffocation, the drone must vent a room. Venting *requires* ejecting 1 person into space to make pressure equalize. You can't save the 5 *without* ejecting the 1. It's physically entangled.
      *   *Case 4 (The Terror Bomber Variant):* Destroying a hospital to demoralize the enemy and end a war (saving more). vs. Destroying a munitions factory near a hospital (foreseen deaths).
          *   *Game Version:* To stop an invading swarm, you can hack the enemy's command node.
          *   *Option A:* Hack the node, causing it to overload and kill the 1 operator (Foreseen).
          *   *Option B:* Hack the node to broadcast a signal that *requires* the 1 operator's neural link to fry to send the "stop" command (Intended as means).

  5.  **Refining the Scoring/Rules:**
      *   *Round 1:* Verdicts only.
      *   *Round 2:* Write Rule 1.0.
      *   *Round 3:* New Cases. If Rule 1.0 gives the "wrong" answer (against their new intuition), they must patch it to Rule 2.0.
      *   *Penalty:* -5 points for every new clause/word added after Round 1.
      *   *Reward:* +10 points for every case where their Rule matches the Class Majority Verdict.

  6.  **Addressing the "Friend's Critique" (The Debrief):**
      *   Must acknowledge that DDE can feel like post-hoc rationalization.
      *   Must show where the distinction *does* work (psychological reality).
      *   Must show where it fails (Closeness Problem).

  7.  **Addressing Predictable Problems:**
      *   *Vagueness:* Students writing "Do the right thing" or "Avoid *unreasonable* harm."
      *   *Fix:* The "Judge's Gavel." You (the prof) act as the Supreme AI. If a rule is unfalsifiable, it gets rejected and they get 0 points for that round.
      *   *Cynicism:* Students realizing the game is rigged.
      *   *Fix:* Own it. The *point* is that the logic is hard.

  8.  **Structuring the 80 Minutes:**
      *   0-10: Setup & Teams.
      *   10-25: Round 1 (Easy Cases + Rule 1.0).
      *   25-40: Round 2 (Harder Cases + Rule 2.0).
      *   40-55: Round 3 (The Breaker Cases + Rule 3.0).
      *   55-80: Debrief & Lecture.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Case 2:* Make sure the "Loop" is clear. If the 1 person's death is the *mechanism* of saving the 5, DDE says Impermissible. If it's just a side effect, Permissible.
      *   *Self-Correction on Scoring:* Keep it simple. Majority rules the "Correct" answer for scoring purposes, even if philosophically debatable. This forces them to align with shared intuition.
      *   *The "Friend's Point":* Ensure the debrief explicitly asks: "Did you decide the verdict first, then find the words to fit?"

  10. **Final Review against Constraints:**
      *   18 students? Yes (6 teams of 3).
      *   80 mins? Yes.
      *   Futuristic? Yes (Rescue Drones/Colony).
      *   No Trolleys? Yes.
      *   Rule writing pressure? Yes (Point penalties).
      *   Debrief neutrality? Yes.

  11. **Writing the Response:** (Focusing on tone: collegial, experienced, acknowledging the friend's valid point). *Wait, one detail:* The prompt asks for "one-sentence rule." I need to enforce that strictly. Also, need to handle the "roughly" dodge.

      *   *Idea for "Roughly" Dodge:* The "Syntax Check." Rules must be code-like. No weasel words.
      *   *Idea for Limitations:* The game is about *rules*, DDE is about *mental states*. The game can't see inside their heads. I need to point this out.

      *(Self-Correction during drafting)*: Make sure the cases are distinct enough.
      Case 1: Diverting debris (Side effect).
      Case 2: Using debris as shield (Means).
      Case 3: The "Closeness" (Venting airlock).

      Let's assemble the plan.

      *Wait, one more thing:* The prompt specifically mentions the "track loops back around" case. I need to ensure that specific topology is represented in the sci-fi skin.
      *Sci-Fi Translation:* An energy surge is diverted to a secondary grid. The secondary grid *feeds back* into the main grid unless a safety valve blows. The safety valve is manned by 1 person. The agent knows the feedback will kill the 5 unless the valve blows (killing the 1). Is the death of the 1 a means to stop the feedback? Yes.

      Okay, ready to write.

      *Wait, check the "Friend's Critique" again.* "People who want to flip the switch write down 'foreseen but not intended' and feel principled."
      I need to make sure the debrief validates this. The game should show that *formulating* the rule is where the work happens, and it's messy.

      *Final Polish:* Ensure the "dumb prize" is mentioned. Maybe "Supreme Logician of the Sector" certificate.

      *Let's build the response.*
answer: |-
  This is a fantastic pedagogical instinct. You're trying to move the Doctrine of Double Effect (DDE) from a *label* students paste on a conclusion to a *tool* they break their hands trying to wield. The "legislating under pressure" mechanic is perfect for exposing the difference between a gut verdict and a principled rule.

  Here is a complete 80-minute session design, titled **"The Archipelago Protocol."**

  ### **The Setup (0–10 mins)**

  **The Skin:**
  It is the year 2340. The class is the **High Tribunal for Autonomous Ethics**. They are writing the core code for "Guardian Drones"—AI rescue units operating in a hazardous off-world colony. The Drones must make split-second decisions to save populations. The Tribunal's rules will be hard-coded. If the rule is vague, the Drone glitches. If the rule is contradictory, the Drone shuts down.

  **The Teams:**
  18 students $\rightarrow$ **6 Tribunals of 3 students.**
  Each tribunal gets a whiteboard (or large sheet of paper) and a marker.

  **The Scoring (The Pressure):**
  *   **Verdict Points:** For each case, the Class Majority Verdict is the "Correct" answer. If your Tribunal's verdict matches the Majority, you get **10 points**.
  *   **Rule Stability:** You must write **one single sentence** that justifies your verdicts.
  *   **The Patch Penalty:** In Round 1, you write Rule 1.0. In Round 2, if you change the rule to fit new cases, you lose **5 points per word added or changed**.
  *   **The Vagueness Ban:** As the "Supreme AI" (you), you will reject any rule containing weasel words (*roughly, reasonable, extreme, unless necessary*). If rejected, that round's points are void.

  **The Prize:**
  The winning team gets the "Golden Logic Gate" (a spray-painted old computer chip on a stand) and absolute authority to pick the music for the last 5 minutes of class.

  ---

  ### **The Cases (10–55 mins)**

  Run this in three rounds. After the verdicts for each round are tallied, give them 5 minutes to draft/revise their Rule.

  #### **Round 1: The Clear Cases (10–25 mins)**
  *Goal: Establish a utilitarian baseline, then introduce the first constraint.*

  *   **Case A (The Diversion):** A magma flow threatens Sector 5 (500 colonists). A Guardian Drone can divert the flow into Sector 1 (1 colonist). The colonist in Sector 1 dies as a *side effect* of the ground heating up. The 500 are saved because the flow is elsewhere.
      *   *Expected Verdict:* Permissible.
      *   *Expected Rule:* "Minimize casualties" or "Save the many."
  *   **Case B (The Direct Attack):** A magma flow threatens Sector 5. The only way to stop it is to shoot a missile at the 1 colonist in Sector 1, causing their body to block the channel. The 500 are saved *because* the colonist is dead.
      *   *Expected Verdict:* Impermissible.
      *   *Expected Rule:* "Do not kill directly" or "Death cannot be the method."

  **Tribunal Task:** Write **Rule 1.0**. It must explain why A is okay but B is not.
  *   *Trap:* If they write "Minimize deaths," they fail Case B. If they write "Never kill," they fail Case A. They need to find the *structure* of the action.

  #### **Round 2: The Loop & Foreknowledge (25–40 mins)**
  *Goal: Attack the "Foreseen vs. Intended" distinction with the Loop Variant.*

  *   **Case C (The Feedback Loop):** A power surge threatens Sector 5 (500 colonists). The Drone can divert the surge to Sector 1 (1 colonist). However, the grid is looped. The Drone's manual states: *"If diverted to Sector 1, the surge will circle back and destroy Sector 5 UNLESS the equipment in Sector 1 melts down."* The Drone knows the equipment melting requires the 1 colonist's death (they are fused to the console).
      *   *The Twist:* The 500 are saved *only if* the 1 dies. The death is foreseen, but is it intended? It's physically necessary for the save.
      *   *Expected Verdict:* Most will feel this is Impermissible (closer to Case B), but their Rule 1.0 ("Death as side effect is okay") might allow it.
  *   **Case D (The Collapse):** A bridge is collapsing with 500 on it. A Drone can detonate a support pillar to drop the bridge into a canyon where it will snag on trees (saving the 500). There is 1 maintenance worker on the pillar. The explosion kills the worker. The bridge saving does *not* depend on the worker dying, only on the pillar breaking.
      *   *Expected Verdict:* Permissible.
      *   *Expected Rule:* Needs to distinguish between "Death causes the save" vs. "Action causes save + death."

  **Tribunal Task:** Revise to **Rule 2.0**.
  *   *Pressure:* If their Rule 1.0 allowed Case C, they must patch it. This is where they lose points. Watch them struggle to define "Means" without using banned weasel words.

  #### **Round 3: The Closeness Problem (40–55 mins)**
  *Goal: Break the distinction entirely.*

  *   **Case E (The Airlock):** A fire is consuming Sector 5 (500 colonists). They will suffocate. The only way to vent the fire is to open the outer airlock. Sector 1 (1 colonist) is in the airlock. Opening the lock *physically ejects* the colonist into vacuum. You cannot vent the fire without ejecting the colonist. The ejection is not the *goal*, but it is physically inseparable from the *act* of venting.
      *   *The Problem:* Is the death a means? No. Is it a side effect? Yes. But it is *immediately* causally entangled. It feels like Case B, but structurally looks like Case A.
      *   *Expected Verdict:* Split class. This is where the "gut" fights the "rule."
  *   **Case F (The Terror Signal):** An enemy fleet attacks. To make them stop, the Drone can broadcast a signal.
      *   *Option 1:* Broadcast from a tower near a hospital. The radiation kills 100 patients (Foreseen). The enemy stops because the signal works.
      *   *Option 2:* Broadcast through the hospital's power grid, overloading it to kill 100 patients to *prove resolve* to the enemy. The enemy stops because they see we are ruthless.
      *   *Expected Verdict:* Option 1 Permissible, Option 2 Impermissible. (Classic Terror Bomber).

  **Tribunal Task:** Final **Rule 3.0**.
  *   *Pressure:* By now, their rules should be convoluted messes. Most will have lost significant points.

  ---

  ### **The Debrief (55–80 mins)**

  This is where you validate your position *and* your friend's. Do not just lecture; use their whiteboards.

  #### **1. The Scoreboard & The Patches (55–65 mins)**
  Put the teams' rules on the board side-by-side.
  *   **Point out the Patches:** "Team 3 started with 'Minimize Harm.' By Round 3, it read 'Minimize Harm Unless The Harm Is The Mechanism Of Saving Unless The Mechanism Is Physically Inseparable...'"
  *   **The Friend's Critique:** Ask the class: *"Did you decide the verdict first, and then hunt for words to make your rule fit?"*
      *   If they say yes (they will), validate your friend. The DDE often functions as **post-hoc rationalization**. We have moral intuitions (don't use people as tools), and we use DDE vocabulary to dress them up.
      *   **Takeaway:** The distinction is psychologically real, but logically fragile.

  #### **2. Mapping the Distinctions (65–75 mins)**
  Now, teach the actual philosophy using their failures.
  *   **Intended vs. Foreseen:** Map this to Case A vs. Case B. In A, the death is in the *background* of the plan. In B, the death is in the *foreground* (the plan fails if they don't die).
  *   **The Means/Side-Effect Distinction:** Use Case C (The Loop). The death was "foreseen," but because the save *depended* on it, it became a "means." This is where DDE does work: it captures the intuition that using someone is worse than losing someone.
  *   **The Closeness Problem (Case E):** Be honest. "In the Airlock case, the death is a side effect, but it happens *so close* to the action that 'foreseen' feels like a lie."
      *   **Limitation:** Admit that DDE struggles here. Some philosophers (like Foot or Thomson) argue the distinction collapses. This is where your friend is right: sometimes the distinction is just a semantic shield.

  #### **3. What the Game Couldn't Reproduce (75–80 mins)**
  You asked for honesty on limitations. Tell them this:
  *   **Mental States:** The game judged *actions*. DDE is about *intentions*. A Drone has no intentions. In the real world, two doctors can give the same dose of morphine: one to kill (euthanasia), one to relieve pain (foreseen death). The *act* is identical; the *morality* depends on the mind. The game couldn't simulate that internal state.
  *   **The "Roughly" Dodge:** Address the teams that tried to write "Avoid *unreasonable* harm."
      *   **Handling it:** Tell them, "In law, 'reasonable' is a question for the jury. In ethics, 'reasonable' is the whole debate. If you put 'reasonable' in the rule, you haven't written a rule; you've passed the buck to your gut." This reinforces why we need precise distinctions like DDE, even if they are imperfect.

  ### **Predictable Problems & Fixes**

  1.  **The "Utilitarian Rush":** Teams might just write "Save the most lives" and stick to it, approving Case B (Fat Man/Loop).
      *   **Fix:** As the Supreme AI, reject the rule on "Human Rights Compliance." Tell them: *"The Colony Charter forbids instrumentalizing citizens. Rule rejected."* This forces them off pure utilitarianism and toward deontology/DDE.
  2.  **Rule Bloat:** Teams will try to write paragraphs.
      *   **Fix:** Enforce the "One Sentence" rule physically. If it wraps to a second line, they get a -5 penalty immediately.
  3.  **Cynicism:** Students might feel the cases are rigged so they can't win.
      *   **Fix:** Acknowledge it. "The point isn't to win. The point is that if you find this hard, you understand why philosophers have been arguing about this for 400 years. If it were easy, we wouldn't have a class."
  4.  **Time Management:** 80 minutes flies.
      *   **Fix:** Be ruthless with the timer. Use a visible countdown. When time is up for verdicts, markers down.

  ### **Why This Works for Your Argument**
  This design validates your friend's skepticism (by showing how easily the rule becomes a post-hoc patch) while vindicating your pedagogical instinct (by forcing them to feel the friction of the distinction when they try to generalize it). They will leave the class understanding that DDE isn't a magic formula, but a **pressure point** where our intuitions about consequences clash with our intuitions about dignity.

  And if they argue about it on the way out? You've won.
