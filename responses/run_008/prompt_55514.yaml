answer: |-
  ### Desiderata for a Theory of Interpersonal Aggregation

  To move this from a duel of intuitions to a theory evaluation, we must distinguish between *boundary conditions* (what the theory must accommodate) and *structural requirements* (how the theory must behave). Below is the curated list. I have flagged items as **Genuine** (necessary for any coherent moral arithmetic), **Contested** (philosophically loaded premises often smuggled in as neutral), or **Pragmatic** (necessary for policy application).

  #### 1. Ordinal Plausibility (Anchoring Cases)
  *   **Definition:** The theory must rank fifty years of torture as strictly worse than a single dust speck in a single eye. It must also acknowledge that a single speck is morally negligible in isolation.
  *   **Status:** **Genuine Sanity Check.**
  *   **Note:** This is not a deep metaphysical truth, but a stability requirement. A theory that inverts these rankings is not "counter-intuitive"; it is broken language. However, a theory *is* allowed to argue that $N$ specks *become* torture; it just cannot claim 1 speck = 50 years torture.

  #### 2. Intra/Inter Consistency (Symmetry)
  *   **Definition:** If $N$ trivial harms aggregate to a severe harm when inflicted on one person (intra-personal), the theory must explain why or why not this logic holds when distributed across $N$ people (inter-personal). It cannot simply assert "person-boundaries matter" without defining the moral weight of a boundary.
  *   **Status:** **Genuine Logical Constraint.**
  *   **Note:** This is the strongest theoretical demand. It forces the theory to justify the "Separateness of Persons." If the theory claims boundaries block aggregation, it owes an account of why biology or consciousness creates a moral firewall.

  #### 3. Transition Transparency (Flip Disclosure)
  *   **Definition:** If the verdict flips from "Specks are permissible" to "Specks are impermissible" as the population grows, the theory must identify the threshold mechanism. Is it a hard cliff (at $N=1,000,001$) or a slope? If a hard cliff, it must justify the non-arbitrariness of the number.
  *   **Status:** **Genuine Logical Constraint.**
  *   **Note:** This targets the Sorites Paradox. A theory that relies on vagueness ("it just becomes too much") fails policy analysis because policy requires specific thresholds.

  #### 4. Risk-Harm Equivalence (Lottery Test)
  *   **Definition:** The theory must account for the relationship between ex ante risk and ex post harm. If imposing a 1/$N$ risk of torture on $N$ people is morally equivalent to imposing a certainty of a speck on $N$ people, the theory must treat them consistently. If they are distinct, it must explain why risk dilutes moral weight differently than harm distribution.
  *   **Status:** **Contested.**
  *   **Note:** This smuggles in a specific view of risk (expected utility). Deontologists often argue rights violations (torture) cannot be diluted by probability in the same way harms are. Demanding equivalence biases the field toward consequentialism.

  #### 5. Policy Scalability (Workability)
  *   **Definition:** The theory must yield actionable verdicts at human scales (thousands to billions), not just trans-astronomical numbers. It cannot defer the problem to $3 \uparrow\uparrow\uparrow 3$ if it fails at 10 million commuters.
  *   **Status:** **Pragmatic Necessity.**
  *   **Note:** For a public policy student, this is the most critical. A theory that only works in the limit is useless for cost-benefit analysis.

  #### 6. Continuity of Moral Weight
  *   **Definition:** Small changes in the magnitude of harm or the number of sufferers should not produce discontinuous jumps in moral verdict unless a specific qualitative threshold is crossed.
  *   **Status:** **Genuine Logical Constraint.**
  *   **Note:** Without this, moral math becomes chaotic. However, this conflicts with "Lexical Thresholds" (see below).

  ---

  ### The Incompatibility Theorem

  You asked for the subset of desiderata that cannot be jointly satisfied. The conflict lies here:

  **The Trilemma:** You cannot simultaneously satisfy **Ordinal Plausibility**, **Intra/Inter Consistency**, and **Continuity**.

  1.  **If you satisfy Ordinal Plausibility** (Torture > Specks) and **Continuity** (small additions don't cause sudden jumps), you are forced toward **Linear Summation**. Eventually, the sum of specks must outweigh torture. This violates Ordinal Plausibility at the extreme limit (the "Torture Conclusion").
  2.  **If you satisfy Ordinal Plausibility** (Torture > Specks) and **Intra/Inter Consistency** (aggregation works within a person), you must explain why aggregation stops across persons. If you assert it stops (Lexical Threshold), you violate **Continuity** (there is a hard cliff where one more speck suddenly makes the act impermissible).
  3.  **If you satisfy Intra/Inter Consistency** and **Continuity**, you must accept that enough specks equal torture. This violates **Ordinal Plausibility** regarding the *qualitative* difference between the harms (the intuition that torture is a different *kind* of bad, not just a *amount* of bad).

  **Precise Location of Conflict:** The conflict centers on **Intra/Inter Consistency**.
  *   If you argue aggregation works intra-personally (1,000 specks on one person is bad), logic demands it works inter-personally (1 speck on 1,000 people is bad) *unless* person-boundaries have intrinsic moral weight.
  *   If person-boundaries have intrinsic moral weight, you violate **Continuity** (the moral value changes discontinuously based on who holds the harm).
  *   If person-boundaries have no moral weight, you violate **Ordinal Plausibility** (the qualitative distinction between torture and annoyance dissolves into quantity).

  ---

  ### The Single Most Eliminative Requirement

  **Intra/Inter Consistency (Symmetry)** is the requirement that eliminates the most contenders.

  *   **Why:** It forces a theory to take a stand on the "Separateness of Persons."
  *   **Elimination Power:**
      *   It eliminates naive **Utilitarianism** if the Utilitarian wants to preserve the qualitative horror of torture (they must accept specks sum to torture).
      *   It eliminates naive **Deontology** if the Deontologist cannot explain *why* a boundary stops aggregation when biology/consciousness clearly allows it within a single life.
      *   It eliminates **Vague Intuitionism** because it demands a structural reason for the difference, not just a feeling.

  Most theories fail here because they rely on the "Separateness of Persons" as a brute fact. Intra/Inter Consistency demands that brute fact be derived or defended. If you cannot explain why a brain's unity allows summation but a society's unity does not, the theory collapses.

  ---

  ### Theory Audit

  Here is how the three familiar positions fare against the desiderata.

  #### 1. Strict Lexical Thresholds
  *   *View:* Trivial harms never sum to outweigh severe harms. Torture is lexically superior to annoyance.
  *   **Passes:** Ordinal Plausibility (Torture always wins).
  *   **Passes:** Policy Scalability (Easy rule: don't torture).
  *   **Fails:** Intra/Inter Consistency. It cannot explain why 1,000 specks on *one* person is worse than 1 speck on 1,000 people, given the total pain is identical. It treats person-boundaries as moral forcefields without justification.
  *   **Fails:** Transition Transparency. It posits a hard cliff. At what exact number of specks does the harm become "non-trivial"? If there is no number, it violates Continuity. If there is a number, it is arbitrary.
  *   **Policy Verdict:** **Unusable.** It creates paralysis. If any risk of "severe harm" lexically outweighs any amount of "trivial benefit," you cannot build roads, approve drugs, or run a grid.

  #### 2. Straightforward Linear Summation (Classical Utilitarianism)
  *   *View:* All harms are convertible to a common unit (utility/disutility) and sum across persons.
  *   **Passes:** Intra/Inter Consistency. Aggregation works the same way within and across persons.
  *   **Passes:** Transition Transparency. The verdict changes smoothly as $N$ increases; no arbitrary cliffs.
  *   **Passes:** Risk-Harm Equivalence. Expected utility handles risk and harm identically.
  *   **Fails:** Ordinal Plausibility (at the limit). It implies that enough dust specks *are* morally equivalent to fifty years of torture. This violates the deep intuition that the *nature* of the suffering matters, not just the sum.
  *   **Policy Verdict:** **High Risk.** While workable, it permits "tyranny of the aggregate." It justifies sacrificing a few to severe harm if the distributed benefit to the many is sufficiently large (e.g., sacrificing one innocent to prevent a million headaches).

  #### 3. The Parfitian Middle Path (Contractualist/Reasonable Rejection)
  *   *View:* We do not sum the small harms. Instead, we ask if the principle allowing the action could be "reasonably rejected" by those burdened. Large benefits to many can outweigh harms to a few, but not by summing the small harms to equal the large harm.
  *   **Passes:** Ordinal Plausibility. It preserves the special status of severe harm without summing specks into torture.
  *   **Passes:** Intra/Inter Consistency (Partially). It acknowledges person-boundaries matter for *reasons*, not just sums.
  *   **Fails:** Policy Scalability. "Reasonable rejection" is not a calculable metric. It requires qualitative judgment calls that vary by adjudicator.
  *   **Fails:** Risk-Harm Equivalence. It struggles to compare a high probability of small harm vs. a low probability of large harm when no aggregation is allowed.
  *   **Policy Verdict:** **Indeterminate.** It offers the most morally satisfying answer but the least actionable one. It tells you *how to think* (consider the burdened) but not *how to decide* (no formula).

  ### Summary for the Policy Student

  The tension you are facing is not between "math" and "morality." It is between **Continuity** (math requires smooth functions) and **Qualitative Distinction** (morality recognizes different *kinds* of bad).

  *   If you need a **decision procedure** (to approve a bridge or a drug), you are forced toward **Linear Summation**, but you must apply **capping rules** (policy constraints) to prevent the "Torture Conclusion" in practice.
  *   If you need a **justification procedure** (to explain why a right is inviolable), you are forced toward **Lexical Thresholds**, but you must accept that your theory breaks down when applied to large-scale risk distribution.

  The "correct" theory depends on whether you are building a calculator or a constitution. For cost-benefit analysis, Linear Summation is the only tool that works, provided you legislate lexical protections (rights) as external constraints on the math, rather than trying to solve them within the math itself.
