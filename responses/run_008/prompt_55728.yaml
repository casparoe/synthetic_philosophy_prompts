answer: |-
  Subject: Audit of the Gene–Meme Analogy and the Skeptic's Prior

  It is a pleasure to engage with this. Having lingered in those same digital corridors since the days when *Overcoming Bias* was the watercooler, I appreciate the precision you are bringing to this. Your friend is advocating for a strong version of Universal Darwinism, specifically the Dawkinsian memetic programme. While the intuition is powerful, the structural integrity of the argument depends less on whether culture *is* genetics, and more on whether the *selection dynamics* are sufficiently similar to license the epistemic conclusion.

  Below is the audit you requested, distinguishing between cosmetic disanalogies and those that threaten the core inference.

  ### I. The Correspondence Table

  To treat this as an argument rather than a metaphor, we must map the ontology of the two systems. Here is the standard memetic correspondence:

  | Genetic System | Memetic System (Standard Model) |
  | :--- | :--- |
  | **Gene** | **Meme** (Unit of cultural information) |
  | **Allele** | **Meme-variant** (e.g., specific wording of a rumour) |
  | **Genotype** | **Memory trace** (Neural encoding of the meme) |
  | **Phenotype** | **Behaviour/Artefact** (Speech, writing, ritual, dress) |
  | **Organism** | **Human Host** (The mind/brain harbouring the meme) |
  | **Population** | **Community** (Network of communicating minds) |
  | **Reproduction** | **Imitation/Communication** (Copying from host to host) |
  | **Mutation** | **Innovation/Error** (Misremembering, modification) |
  | **Selection Pressure** | **Attention & Retention** (Psychological salience, social reward) |
  | **Fitness** | **Prevalence** (Frequency in the population over time) |

  Your friend's argument rests on the claim that *Fitness* in the right-hand column is decoupled from *Truth*, just as genetic fitness is decoupled from the host's long-term welfare (e.g., a gene for high sugar craving was fit in the Pleistocene but is harmful now).

  ### II. The Structural Cracks

  You have correctly identified the primary friction points where the mapping frays. Let us catalogue them rigorously.

  1.  **Fidelity of Transmission:** Genetic replication is high-fidelity (error rate $\approx 10^{-8}$ per base). Cultural transmission is low-fidelity; it is reconstructive. As your group member noted, we do not copy; we rebuild from cues.
  2.  **Inheritance of Acquired Characteristics:** Biology forbids this (the Weismann barrier). Culture demands it. If a theologian refines a doctrine at age forty, the refinement is transmitted. This is Lamarckian evolution.
  3.  **Nature of Variation:** Genetic mutation is random with respect to fitness. Cultural variation is often guided, biased, or deliberately designed to *increase* fitness (virality).
  4.  **Particulate vs. Blending:** Genes remain distinct particles (mostly). Memes blend, hybridise, and merge continuously.
  5.  **Vector of Transmission:** Genetics is predominantly vertical (parent to offspring). Culture is predominantly horizontal (peer to peer) and oblique (institution to individual).
  6.  **Substrate Dependence:** Genes require specific biological machinery. Memes can migrate substrate (oral $\to$ text $\to$ digital) without losing identity.

  ### III. The Audit: Do These Cracks Break the Argument?

  The crucial question is whether these disanalogies invalidate your friend's conclusion: *that popularity is weak or negative evidence for truth.*

  Surprisingly, most of these cracks do not weaken the conclusion; several actually strengthen it.

  **1. Fidelity and Reconstruction (The "Attractor" Objection)**
  *   **The Objection:** If transmission is reconstructive, there is no strict "copying," so natural selection cannot act.
  *   **The Audit:** This is the most serious theoretical challenge to memetics, championed by proponents of *Cultural Attractor Theory* (CAT). However, it does not save the truth-value of popular beliefs. If reconstruction pulls ideas toward "natural-feeling endpoints" (cognitive attractors), those endpoints are determined by human psychology, not by external reality.
  *   **Verdict:** **Harmless to the conclusion.** In fact, it may bolster it. Counter-intuitive truths (e.g., quantum mechanics, germ theory) are hard to reconstruct from memory; intuitive falsehoods (e.g., supernatural agency, essentialism) are easy. A system optimised for reconstructive ease selects for *intuitiveness*, which is often orthogonal to truth.

  **2. Lamarckian Inheritance**
  *   **The Objection:** Ideas evolve too fast and via design, not blind variation.
  *   **The Audit:** If agents can deliberately modify ideas to make them spread better, they are explicitly optimising for transmissibility. If the goal of the modifier is virality (clicks, converts, votes), the optimisation pressure away from truth is *intensified*, not removed.
  *   **Verdict:** **Strengthens the conclusion.** Blind mutation might accidentally stumble on truth; designed mutation for virality actively filters it out if truth impedes spread.

  **3. Guided Variation**
  *   **The Objection:** Variation isn't random.
  *   **The Audit:** Darwinian selection only requires variation and differential retention. It does not require randomness. If the variation is biased toward "what sounds plausible" or "what makes people angry," the selection pressure still filters for those traits.
  *   **Verdict:** **Harmless.** The engine of selection runs on differential retention, regardless of how the variation was generated.

  **4. Blending and Horizontal Transfer**
  *   **The Objection:** Lineages are messy; you cannot trace a meme's phylogeny like a gene's.
  *   **The Audit:** This complicates the *history* of an idea, but not the *dynamics* of its spread. Horizontal transfer allows for epidemics (rapid exponential growth), which fits your friend's "epidemic belief" model perfectly.
  *   **Verdict:** **Harmless.** It makes the maths harder, but the qualitative prediction (virality $\neq$ truth) remains.

  **5. The Definition of Fitness**
  *   **The Objection:** In biology, gene fitness is tied to organism survival (mostly). In culture, a meme can kill the host (e.g., martyrdom ideologies) and still win.
  *   **The Audit:** This is the core of your friend's argument. Because the meme's fitness is decoupled from the host's biological welfare, it is also decoupled from the host's epistemic welfare.
  *   **Verdict:** **Fatal to the counter-argument.** This is the feature, not the bug. It confirms that selection tracks *replication*, not *utility* or *veracity*.

  ### IV. Reconstructive Transmission and Truth

  You asked specifically: *Does a Darwinian account still predict survival ideas are fitness-optimized rather than truth-optimized even if transmission is reconstructive?*

  Yes. Consider the concept of **Content Biases**. In reconstructive transmission, some content is simply "stickier" due to cognitive architecture (e.g., minimally counter-intuitive concepts).
  *   **Truth** often requires complex, non-intuitive scaffolding (e.g., "disease is caused by invisible organisms," not "bad air").
  *   **Fitness (Memetic)** requires low cognitive load and high emotional arousal.

  If the reconstruction process is biased toward cognitive ease, then the "survivors" of cultural evolution are those that best exploit human cognitive bugs. Since human cognitive bugs (confirmation bias, agency detection) are well-documented sources of error, a system selecting for cognitive fit is selecting *against* rigorous truth in many domains.

  Therefore, the shift from "copying" to "reconstruction" does not rescue the truth-value of epidemic beliefs. It merely changes the mechanism of selection from "survival of the best copy" to "survival of the best fit for human psychology."

  ### V. Is There a Better Analogy?

  If the gene-meme analogy is too baggage-laden for your group, two alternatives carry the same weight with fewer ontological commitments.

  **1. The Epidemiological Model**
  Instead of evolution, view beliefs as pathogens.
  *   **Correspondence:** Belief = Virus; Mind = Host; Communication = Vector.
  *   **Metric:** $R_0$ (Basic Reproduction Number).
  *   **Implication:** A pathogen with a high $R_0$ is optimised for transmission, not for the health of the host. The common cold is highly successful; Ebola is less so because it kills hosts too quickly.
  *   **Advantage:** It sidesteps the "replication fidelity" debate. A virus doesn't need to be copied perfectly to infect; it just needs to breach the immune system (skepticism).
  *   **Conclusion:** High prevalence indicates high transmissibility, not benignity or truth. This supports your friend's skeptic's prior perfectly.

  **2. Cultural Attractor Theory (CAT)**
  This is the sophisticated successor to memetics.
  *   **Mechanism:** Ideas do not replicate; they migrate. They are transformed by each mind they pass through, pulled toward "attractors" (stable states in concept space).
  *   **Implication:** The distribution of beliefs in a population reflects the shape of the cognitive landscape, not the shape of reality.
  *   **Conclusion:** Popular beliefs tell you more about *human psychology* than about the *world*. If the attractor is "moralising god," beliefs will converge there regardless of theological truth.
  *   **Verdict:** This is likely the most robust framework for your reading group. It accepts the reconstructive nature of transmission while retaining the evolutionary insight that popularity is a function of psychological fit, not veracity.

  ### VI. Final Verdict

  Your friend is using a slightly outdated version of memetics (the Dawkins/Blackmore "virus of the mind" era), which invites the fidelity criticisms you raised. However, his **epistemic conclusion is robust** even if his mechanism is imperfect.

  The disanalogies (Lamarckism, low fidelity, guided variation) generally imply that cultural evolution is *faster* and *more sensitive to psychological biases* than genetic evolution. If anything, this makes popular beliefs *less* likely to be true, not more, because they are more efficiently optimised for psychological salience.

  **Recommendation for the Group:**
  Concede the point on "high-fidelity copying." It is a weak link in the old memetic armour. Pivot the argument to **Cultural Attractor Theory** or **Epidemiology**.
  *   **The Revised Argument:** "Beliefs spread not because they are copied like genes, but because they infect minds like viruses or settle into cognitive attractors. In both cases, the selection pressure is *psychological fit*, not *correspondence with reality*."

  This preserves the Skeptic's Prior without requiring you to defend the claim that a joke on Twitter is ontologically identical to a strand of DNA. The map is not the territory, but in this instance, both maps lead to the same cliff edge.

  Yours,

  A Fellow Traveller
