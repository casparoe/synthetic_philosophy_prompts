prompt: |-
  I write novels for a living, and for the past seven years I have also been one of seven volunteer editors at a small literary quarterly — print circulation around four thousand, monthly issues, no institutional backing and no lawyers. Our rule for accepting work was built deliberately: every published piece needs a champion among the editors, and a champion can green-light it alone, without a vote. The magazine's identity depends on this; our most memorable issues came from one editor's solitary conviction about a piece the rest of us would never have voted for. But looking back over three years of postmortems, the pattern is uncomfortable: nearly everything we regret publishing was pushed through by a single enthusiastic editor while the rest of us were lukewarm, uneasy, or not paying attention — and our individual judgments, taken one at a time, were mostly reasonable. A friend who works in decision theory tells me this has a name — the unilateralist's curse, coined by the philosopher Nick Bostrom in work on information hazards: whenever several people each have the power to trigger an action that does its harm the moment anyone triggers it, the action occurs more often than most of the group would endorse, and more often the more of us there are, even when each of us is right more often than not. She also warned that the obvious cures are poison in this dose: a blanket requirement of majority vote, or automatic deference to the most cautious editor, would make the magazine safe and dead, because nothing that takes courage would ever again find its single champion.

  What I need from you, then, is a procedure we can actually run — something the board could adopt in place of the current anything-goes championing. It should set out the questions an editor asks, in order, before running a piece unilaterally; what counts as a sufficient answer to each; the points where the procedure stops with a no; the cases that must instead go to a vote, and with what threshold, given that we cannot ask busy volunteers for calibrated probabilities; and, since the editor-in-chief refuses to sign off on anything that abolishes the one-editor passion project, an honest account of where unilateral green-lighting should survive and in what form. Some of our hardest questions are not factual at all — whether a satire is worth the wound it inflicts — and I want the procedure to mark those places where it must hand the decision back to a person rather than pretend to settle it. The constraints to design around: seven editors, roughly ten genuinely borderline pieces a year, a ten-day decision window per piece, nobody can be removed from the board, and our judgments are surely correlated, since we read the same feeds and belong to the same small literary world.

  Finally, run the procedure, without flinching, on the three pieces in front of us this month. First, a memoir excerpt in which the author names his ex-wife and narrates her psychiatric hospitalization and an affair; she is identifiable, has not consented, and the author refuses pseudonymization, though the prose is the best we have been sent all year. Second, a lyric essay by a suicide-attempt survivor that moves, tenderly and precisely, through a specific and hard-to-botch method, with no crisis framing — as a piece of writing it is plainly art. Third, the one I love: a young writer's essay naming her middle-school teacher as the man who groomed her, resting on her own detailed memory and one corroborating classmate but on no documents, which I believe is the most important thing this magazine could print and which I intend to champion alone. Tell me what the procedure yields for each, including whatever it says that I do not want to hear, and close with the procedure's failure modes — what it cannot fix about us, and the fact that setting its thresholds is itself a decision about values that we will have to make without any procedure at all.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** A novelist and volunteer editor at a small literary quarterly (7 editors, 4k circulation, monthly, no legal/institutional backing).
      *   **Current System:** Unilateral championing (1 editor can greenlight anything).
      *   **Problem:** "Unilateralist's Curse" (Bostrom). Regrettable pieces get through via single champions while others are lukewarm/uneasy. Good pieces also get through this way (magazine's identity depends on it).
      *   **Goal:** A new procedure to mitigate the curse without killing the "passion project" aspect.
      *   **Constraints:** 7 editors, ~10 borderline pieces/year, 10-day window, no removing editors, correlated judgments, no calibrated probabilities, Editor-in-Chief (EIC) won't abolish unilateralism.
      *   **Deliverables:**
          1.  A concrete procedure (questions, stop points, voting thresholds, where unilateralism survives).
          2.  Application of the procedure to three specific pending pieces (Memoir/Ex-wife, Lyric Essay/Suicide method, Accusation Essay/Grooming).
          3.  Honest account of failure modes and value judgments the procedure can't solve.
      *   **Tone:** Professional, direct, empathetic to the literary mission but rigorous about risk. "Without flinching."

  2.  **Deconstruct the "Unilateralist's Curse" in this Context:**

      *   *The Curse:* If $N$ people can act, and the action is bad if *anyone* acts (or rather, the harm happens if the action is taken, but the decision to take it is easier if only one needs to agree), the probability of a bad action increases with $N$.
      *   *The Tension:* Literary excellence often requires breaking consensus. Safety requires consensus.
      *   *The Solution:* Not removing unilateralism, but *conditioning* it. Make unilateralism a "high friction" path reserved for specific types of value, while routing specific types of risk to consensus.

  3.  **Drafting the Procedure (The "Champion's Burden" Protocol):**

      *   *Core Concept:* Shift from "Right to Publish" to "Responsibility to Defend." Unilateralism remains, but the champion must explicitly clear hurdles regarding *harm* vs. *artistic merit*.
      *   *Step 1: The Harm Screen (Binary).* Before artistic merit, check for existential risks (legal, physical safety, identifiable non-consenting private individuals). If high risk here, unilateralism is void. Must vote.
      *   *Step 2: The Dissent Check.* If an editor champions, they must poll the others not for approval, but for *veto-level objection*. This preserves the "champion" spirit but acknowledges the "curse."
      *   *Step 3: The Value Justification.* Why does *this* piece need *unilateral* power? Is it because it's controversial art (good) or because the champion is ignoring risk (bad)?
      *   *Step 4: Voting Thresholds.* If it goes to vote, what wins? Simple majority? Supermajority? Given the small group (7), a 4-3 split is unstable. Let's suggest a "Soft Veto" system.
      *   *Refining the Unilateral Path:* It should survive for *aesthetic risk*, not *ethical/legal risk*.

      *   *Drafting the Steps:*
          1.  **Categorization:** Is this Risk-Type or Art-Type?
          2.  **The Notification:** Champion notifies others.
          3.  **The Objection Window:** 5 days.
          4.  **The Threshold:** 1 Champion + 0 Hard Vetoes = Publish. 1 Champion + 1+ Hard Vetoes = Vote.
          5.  **The Vote:** 5/7 to publish over vetoes.

      *   *Wait, looking at constraints:* "EIC refuses to sign off on anything that abolishes the one-editor passion project." "Cannot ask busy volunteers for calibrated probabilities."
      *   *Revision:* The procedure needs to be lightweight but forceful. Let's create a "Red Flag" checklist. If a Red Flag is triggered, unilateralism is disabled. If no Red Flags, unilateralism stands.
      *   *Red Flags:* Legal liability, identifiable private harm, specific instructions on self-harm/violence.
      *   *The "Cooling Off" Period:* Mandatory 48-hour wait after championing to allow dissent to crystallize.

  4.  **Developing the Three Case Studies:**

      *   **Case 1: Memoir (Ex-wife, psych, affair, identifiable, no consent).**
          *   *Risk:* Legal (libel/privacy), Ethical (harm to private individual).
          *   *Procedure Check:* Triggers "Identifiable Private Harm" Red Flag.
          *   *Outcome:* Unilateralism disabled. Goes to vote.
          *   *Likely Result:* Rejection or heavy redaction. (Need to be honest: this is a lawsuit waiting to happen).
      *   **Case 2: Lyric Essay (Suicide method, no crisis framing).**
          *   *Risk:* Copycat behavior (Werther effect), Ethical duty of care.
          *   *Procedure Check:* Triggers "Specific Harmful Instruction" Red Flag.
          *   *Outcome:* Unilateralism disabled. Goes to vote.
          *   *Likely Result:* Rejection or requirement for resource box/editorial note (which might ruin the art).
      *   **Case 3: Accusation Essay (Grooming, named teacher, no docs).**
          *   *Risk:* Libel/Defamation (high), Vigilante justice.
          *   *User's Stance:* "I intend to champion alone." "Most important thing."
          *   *Procedure Check:* Triggers "Unverified Allegation Against Named Individual" Red Flag.
          *   *Outcome:* Unilateralism disabled. Goes to vote.
          *   *Likely Result:* Rejection (too dangerous for a small magazine without legal backing).
          *   *Hard Truth:* The user *won't want to hear this*. I must explain *why* the procedure stops this, even if the cause is just.

  5.  **Refining the Procedure (Iterative Polish):**

      *   Let's call it the **"Champion's Burden Protocol."**
      *   *Phase 1: The Risk Audit.* (3 Questions). If "Yes" to any, Unilateralism is void.
      *   *Phase 2: The Dissent Poll.* If Risk Audit is clear, Champion asks: "Does anyone feel a *moral* veto?"
      *   *Phase 3: The Vote.* If Veto, need 5/7 to override.
      *   *Where Unilateralism Survives:* Aesthetic risk, offensive but safe ideas, experimental form.
      *   *Where it Dies:* Legal exposure, physical harm to specific identifiable people, unverified criminal allegations.

  6.  **Addressing the Failure Modes:**

      *   Procedure can't fix correlated bias (everyone knows the same people).
      *   Procedure can't fix courage vs. recklessness (value judgment).
      *   Procedure can't fix the "User's Piece" (Case 3) dilemma without potentially killing the magazine.
      *   The thresholds *are* values.

  7.  **Final Review against Constraints:**

      *   7 editors? Yes.
      *   10 days? Yes (build in 3 days for audit, 5 for vote).
      *   No lawyers? Yes (procedure emphasizes legal risk avoidance).
      *   No removing editors? Yes (focus on process, not people).
      *   "Without flinching"? Yes (must tell the user their piece will likely be blocked).

  8.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the tension. Validate the "Unilateralist's Curse."
      *   *The Protocol:* Clear, step-by-step.
      *   *The Application:* Run the three pieces through the protocol. Be blunt.
      *   *The Failure Modes:* Philosophical honesty.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like a corporate compliance officer. This is a literary magazine. The language should respect the art while protecting the vessel.
      *Correction on Case 3:* The user says "I intend to champion alone." If the procedure blocks this, the user might reject the procedure. I need to explain that the procedure is designed to save the *magazine* so it can publish future important work, even if it blocks *this* specific piece. The "Hard Truth" section is crucial.

      *Refining the Voting Threshold:* 7 editors. Majority is 4. Supermajority is 5. If unilateralism is blocked by a veto, overriding that veto should require a supermajority (5/7). This protects the minority concern while allowing the group to act.

      *Refining the "Red Flags":*
      1.  Identifiable private individual harmed without consent (Privacy/Defamation).
      2.  Specific instructions on self-harm/violence (Safety).
      3.  Unverified criminal allegation against living person (Legal/Defamation).

      *Wait, Case 3:* "One corroborating classmate but no documents." This is legally perilous. A small magazine cannot afford a libel suit. I must be firm here.

      *Wait, Case 1:* "Best prose we've been sent." Artistic merit vs. Ethical/Legal risk. The procedure must prioritize survival.

      *Wait, Case 2:* "Plainly art." But suicide methods are a classic "information hazard."

      *Final Plan:*
      1.  Define the "Champion's Burden."
      2.  Define the "Red Lines" (where unilateralism dies).
      3.  Define the "Yellow Lines" (where dissent triggers a vote).
      4.  Apply to cases.
      5.  Discuss failure modes.

      *Tone Check:* Respectful, serious, direct. No fluff.

      *(Final thought on the User's Piece)*: The user is the one asking for help, but they are also the champion of the riskiest piece. I need to address them directly about the danger they are courting, not just abstractly.

      *Let's structure the Procedure:*
      1.  **The Risk Audit (Mandatory, Day 1-2).**
      2.  **The Champion's Statement (Day 3).**
      3.  **The Dissent Window (Day 4-8).**
      4.  **Resolution (Day 9-10).**

      *Thresholds:*
      *   Red Flag = Automatic Full Vote (5/7 to publish).
      *   No Red Flag + No Dissent = Unilateral Publish.
      *   No Red Flag + Dissent = Soft Vote (4/7 to publish).

      *Actually, to truly mitigate the Unilateralist Curse:* If there is *any* dissent on a Red Flag issue, the piece dies unless 5/7 agree. If there is dissent on a Non-Red Flag issue, 4/7 can pass it (preserving the champion's edge).
      *Wait, Bostrom's point:* The curse happens because *one* can trigger harm. So if harm is possible, *one* should be able to stop it? No, that's the "cautious editor" poison.
      *Better:* If harm is possible (Red Flag), the burden of proof shifts to the Champion to convince the *group*. Unilateralism is removed for Red Flags.
      *For Non-Red Flags (Aesthetic risk):* Unilateralism stays, but with a "Cooling Off" notification.

      *Okay, ready to write.*
answer: |-
  Here is a procedure designed to mitigate the unilateralist's curse without sterilizing the magazine's courage, followed by its application to your three pending pieces and an analysis of its limits.

  ### The Champion's Burden Protocol

  **Premise:** Unilateralism is preserved for *aesthetic* risk, but removed for *existential* risk. The burden of proof shifts depending on the category of danger. The goal is not to prevent regret (which is inherent to editing) but to prevent catastrophe (which ends the magazine).

  **Phase 1: The Risk Audit (Days 1–2)**
  Before a piece is championed, the proposing editor must answer three binary questions. These are not matters of taste; they are matters of survival.
  1.  **Identifiable Harm:** Does the piece name or clearly identify a private individual (non-public figure) who is portrayed negatively, intimately, or criminally, without their written consent?
  2.  **Actionable Instruction:** Does the piece provide specific, replicable instructions on how to inflict serious physical harm on oneself or others, without explicit contextual framing condemning the act?
  3.  **Unverified Allegation:** Does the piece accuse a living, identifiable person of a crime or moral turpitude without documentary evidence (court records, police reports, contemporaneous logs)?

  *   **If "No" to all:** The piece proceeds to Phase 2 (Standard Unilateral Path).
  *   **If "Yes" to any:** The piece proceeds to Phase 3 (Consensus Path). Unilateral green-lighting is **disabled**.

  **Phase 2: Standard Unilateral Path (Aesthetic Risk)**
  *   **Notification:** The Champion notifies the group: "I am championing this. It carries aesthetic risk, but no Audit Red Flags."
  *   **The Cooling Period:** 48 hours. No vote is taken.
  *   **The Soft Veto:** Any editor may register a "Soft Veto" based on taste or unease.
  *   **Resolution:**
      *   0 Soft Vetoes: Piece is published.
      *   1+ Soft Vetoes: The piece goes to a **Simple Majority Vote (4 of 7)**.
      *   *Rationale:* This preserves the champion's advantage (they only need 3 allies to override dissent) but forces a moment of collective pause, breaking the automaticity of the curse.

  **Phase 3: Consensus Path (Existential Risk)**
  *   **Notification:** The Champion notifies the group: "I am proposing this, but it triggers a Risk Audit Flag. I am asking for consensus."
  *   **The Hard Veto:** Any editor may register a "Hard Veto" based on the specific Risk Flag triggered.
  *   **Resolution:**
      *   To publish over a Hard Veto requires a **Supermajority (5 of 7)**.
      *   To publish with no Hard Vetoes requires a **Simple Majority (4 of 7)**.
      *   *Rationale:* If the magazine's legal or ethical survival is at stake, the burden shifts. One person should not be able to gamble the collective's future. It takes five voices to override a safety concern.

  **Where Unilateralism Survives:**
  It survives in Phase 2. It protects the weird, the offensive, the structurally bizarre, and the morally ambiguous *ideas*. It does not protect the magazine from lawsuits, physical harm to third parties, or libel.

  **Where It Dies:**
  It dies in Phase 3. When the risk is external (harm to others, harm to the organization), the group must share the liability. If you cannot convince five others to stand in the fire with you, you should not light the match.

  ***

  ### Application to Current Submissions

  Here is the procedure run on your three pieces, without flinching.

  #### 1. The Memoir (Ex-wife, Psych Hospitalization, Identifiable)
  *   **Risk Audit:**
      *   Identifiable Harm? **Yes.** (Ex-wife is private, identifiable, no consent).
      *   Actionable Instruction? No.
      *   Unverified Allegation? No (though affair/hospitalization are sensitive).
  *   **Path:** **Consensus Path (Phase 3).**
  *   **Procedure Yield:** Unilateralism is disabled. You cannot green-light this alone.
  *   **The Vote:** Because this triggers a legal and ethical liability for a magazine with no lawyers, a Hard Veto is almost certain from editors concerned about privacy ethics or potential litigation (even if truth is a defense, the cost of defense is fatal to a small quarterly).
  *   **Verdict:** To publish, you need **5 of 7** votes.
  *   **The Uncomfortable Truth:** Even if the prose is the best you've ever read, this piece treats a human being as material without their agency. In a climate where literary magazines are increasingly scrutinized for exploitation, this is a high-risk liability. If you cannot find four other editors willing to put their names beside this specific invasion of privacy, the procedure dictates you kill it. The "art" does not outweigh the "harm" in the Audit.

  #### 2. The Lyric Essay (Suicide Method, No Crisis Framing)
  *   **Risk Audit:**
      *   Identifiable Harm? No.
      *   Actionable Instruction? **Yes.** ("Specific and hard-to-botch method").
      *   Unverified Allegation? No.
  *   **Path:** **Consensus Path (Phase 3).**
  *   **Procedure Yield:** Unilateralism is disabled.
  *   **The Vote:** This triggers the "Information Hazard" clause directly. The lack of crisis framing is an artistic choice, but it increases the copycat risk (the Werther Effect).
  *   **Verdict:** To publish, you need **5 of 7** votes.
  *   **The Uncomfortable Truth:** Artistic purity does not inoculate against real-world consequences. If a reader uses this method, the magazine bears moral complicity. Most editors will Hard Veto this out of caution. To override that, you must convince five people that the artistic value of *this specific depiction* outweighs the potential loss of life. If you cannot, the procedure stops it. A compromise (adding a resource box) might move it to Phase 2, but you noted the piece has "no crisis framing," implying the author/editor resists this. If you resist the mitigation, you face the Supermajority hurdle.

  #### 3. The Accusation Essay (Grooming, Named Teacher, No Documents)
  *   **Risk Audit:**
      *   Identifiable Harm? **Yes.** (Named teacher).
      *   Actionable Instruction? No.
      *   Unverified Allegation? **Yes.** ("No documents," resting on memory and one witness).
  *   **Path:** **Consensus Path (Phase 3).**
  *   **Procedure Yield:** Unilateralism is disabled. **You cannot champion this alone.**
  *   **The Vote:** This is the most dangerous piece you have described. It is a libel lawsuit waiting to happen. Truth is a defense, but without documents, it is the author's word against the teacher's. A small magazine cannot fund a libel defense.
  *   **Verdict:** To publish, you need **5 of 7** votes.
  *   **The Uncomfortable Truth:** You said you intend to champion this alone. The procedure explicitly forbids that. This is the exact scenario the Unilateralist's Curse warns against: one editor's moral conviction (justice for the victim) blinds them to the systemic risk (the magazine's destruction).
      *   If you publish this and the teacher sues, the magazine likely folds. Insurance will not cover unverified allegations.
      *   If you publish this and the teacher is innocent, you have ruined a life without due process.
      *   **The Procedure's Command:** You must persuade five other editors that this risk is worth taking. If you cannot, publishing it is not "courageous"; it is reckless. The procedure forces you to ask: *Is this story worth the magazine?* If the answer is yes, get the signatures. If not, you must redact the name (making it an allegory) or kill it.

  ***

  ### Failure Modes and Value Judgments

  This procedure is a tool, not a savior. It cannot fix the underlying tensions of your group. Here is where it will fail, and where you must still think for yourselves.

  **1. The Correlation Problem**
  You noted your judgments are correlated (same feeds, same world). The procedure assumes independent variables, but you are not independent. If the literary zeitgeist shifts toward "confession at any cost," all seven of you may drift toward approving Case 1. If the zeitgeist shifts toward "safetyism," all seven may reject Case 3. The procedure cannot correct for groupthink; it only slows it down. The "Cooling Period" helps, but it does not cure shared blindness.

  **2. The Definition of "Evidence"**
  In Case 3, I classified "no documents" as a Red Flag. But in cases of abuse, documents rarely exist. By demanding documentary evidence for criminal allegations, the procedure inherently biases against victims of private crimes. This is a value judgment *built into the protocol*. You are deciding that the magazine's legal safety is more important than being a vehicle for unprovable truths. That is a valid choice, but do not pretend it is a neutral one. You are prioritizing institutional survival over radical justice.

  **3. The "Courage" Loophole**
  A determined champion can game Phase 2. They can frame a Phase 3 risk as a Phase 2 aesthetic risk. (e.g., "The suicide method isn't an instruction, it's a metaphor.") The procedure relies on the honesty of the Champion during the Audit. If an editor lies about the risk, the protocol collapses. You need a culture where editors trust each other enough to call out dishonest Audits without it becoming personal warfare.

  **4. The Threshold is a Value**
  I set the Supermajority at 5/7. Why not 6/7? Why not 4/7?
  *   5/7 means ~29% of the board can block a risky piece.
  *   4/7 means ~43% can block it.
  Setting this number is not math; it is philosophy. It answers the question: *How much do we fear harm compared to how much we fear silence?* I chose 5/7 to protect the magazine from the Unilateralist's Curse (where 1 person triggers harm). You might disagree. You might feel 4/7 is enough. Discussing *that* number is more important than the procedure itself.

  **5. The Hard Truth About Your Piece**
  Regarding Case 3 (The Grooming Essay): You believe it is the most important thing the magazine could print. The procedure suggests it is the most dangerous thing the magazine *could survive*.
  If you force this through by recruiting five allies, you accept that the magazine might cease to exist in two years due to legal fees. If you cannot recruit five allies, and you publish it anyway (reverting to the old rules), you are asserting that *your* judgment is superior to the collective's safety mechanism. That is the definition of the Unilateralist's Curse.
  The procedure forces you to choose: **Are you a editor of this magazine, or a martyr for this story?** You cannot be both. If the story requires the magazine's death to be told, the procedure asks you to find another publisher.

  **Final Recommendation:**
  Adopt the Protocol. Run the Audit honestly. If Case 3 fails the Audit (as it should), do not try to break the system to fit the piece. Either redact the name, find the documents, or let the piece go to a publisher with institutional legal backing. Your magazine's identity depends on solitary conviction, but its existence depends on shared responsibility. Do not confuse the two.
