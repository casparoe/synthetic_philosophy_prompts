  My roommate's a philosophy major and basically every arguement we get into ends with him dropping esse est percipi -- "to be is to be perceived" -- like it's a mic drop. Latest one was about whether the moon is still there when nobody's looking at it (we'd just watched some youtube video about quantum mechanics so the observer stuff got all mixed in too). When I pushed back, he did this move where he told me to try imagining a tree that no one is perceiving, and obviously I'm perceiving it whenever I imagine it, so he says I've conceded that unperceived objects are literally inconcievable, and inconceivable means impossible, so unperceived objects don't exist, so the moon is only there when someone's looking. Something about that feels like cheating but I can't pin down what.

  Can you lay out the different precise claims "to be is to be perceived" could actually be making -- from the ones that are basically trivial (like anything to do with how we only ever know stuff through perception) to the genuinely radical ones -- and for each say whether it's plausible and whether it would actually get him to "the moon blinks out when unobserved"? I suspect some readings are just obvious and don't give him anything, some are big metaphysical claims that need actual arguing for, and some might just be false. Also can you explain where the imagine-the-tree move goes wrong without just asserting it does? Like, is it trading on a confusion between what I can conceive of and what I can conceive of *while* conceiving it, or between inconceivable and impossible, or something else? And does the quantum mechanics stuff actually matter here or is that a separate conversation about measurement that doesn't need minds at all? Lay it out as a list I can use next time he does this, because right now all I've got is "it feels off".
