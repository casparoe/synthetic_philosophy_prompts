  1. The principle is that citizenship entails an equal obligation to share the physical risks of collective security, provided the service respects individual conscience more than financial duties due to the intrusion on bodily autonomy.
  2. The verdict restricting conscription to national defense fits this worst, because if sharing risk is the core value, limiting it to borders contradicts the moral logic, so you should either support humanitarian drafts or admit your principle is really about nationalism.
  3. Under this principle, the state should not jail the total objector because compelling bodily sacrifice without any conscientious escape valve treats the citizen as a resource rather than a moral agent.
  4. Recruiting foreign volunteers is permissible since it avoids subcontracting risk onto your own disadvantaged citizens, while compulsory civilian service during a crisis is mandatory because it fulfills the duty of shared burden for community survival.
  5. You call it forced labor, but I call it the price of citizenship that prevents us from outsourcing the burden of survival onto those too poor to choose otherwise.
