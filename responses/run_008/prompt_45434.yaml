answer: |-
  # Lesson Plan: The Token Dilemma (Singer's Famine, Affluence, and Morality)

  **Course:** 200-Level Contemporary Moral Problems
  **Class Size:** 19 Students
  **Duration:** 75 Minutes
  **Preparation:** Students must have read Singer's "Famine, Affluence, and Morality" prior to class.

  ---

  ## I. Game Design and Materials

  ### The Core Mechanic
  Students are endowed with **20 Tokens** (printed chits or poker chips). They have a **Private Project** (The "Semester Grant"). To secure the Grant, they must finish the class with at least **10 Tokens**. The Grant is worth 5 bonus points on their final participation grade.

  In four rounds, a "Need" arises. Students decide privately whether to contribute tokens to meet the Need. If the Need is met, the "victim" is saved. If not, the victim suffers (simulated). Contributions are irreversible.

  ### Materials Needed
  1.  **Tokens:** 400 total (20 per student). Poker chips or printed paper chits work best.
  2.  **Decision Slips:** 4 small slips of paper per student (labeled Round 1–4).
  3.  **Project Cards:** 1 card per student stating: *"Semester Grant Requirement: Retain ≥10 Tokens. Reward: 5 Participation Points."*
  4.  **Projector/Board:** To display the Scenario Parameters for each round.
  5.  **Recording Sheet:** A spreadsheet or clipboard for the instructor to log results.

  ### The Four Rounds (Parameters)
  You will project the parameters for each round. Do not explain the *philosophical* reason for the variation yet.

  | Round | Cost to You | Victim Type | Other Rescuers | Singer Variable Tested |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | 2 Tokens | **Identifiable** (Photo/Name) | **None** (You are the only witness) | Baseline (Shallow Pond) |
  | **2** | 12 Tokens | **Identifiable** (Photo/Name) | **None** (You are the only witness) | **Strong Principle** (Comparable Importance) |
  | **3** | 2 Tokens | **Statistical** ("1 of 10,000") | **5 Others** (Equally able to help) | Diffusion & Vividness |
  | **4** | 12 Tokens | **Identifiable** (Photo/Name) | **5 Others** (Equally able to help) | **Fair Shares / Noncompliance** |

  *Note on Round 2:* 12 Tokens reduces the student from 20 to 8. This forfeits the Semester Grant. This forces the choice between the Grant (personal project) and the Victim (moral duty).
  *Note on Rounds 3 & 4:* "5 Others" means the need can be met if *any one* of the 6 people (the student + 5 simulated others) contributes. However, students are told the others are making the same choice simultaneously.

  ### Payoff Scheme (No Real Money)
  *   **Base Participation:** All students get full participation credit for the day simply by submitting decision slips.
  *   **The Grant Bonus:** At the end of class, count your tokens. If you have 10 or more, write your name on a "Claim Sheet" for the 5 bonus points.
  *   **Anonymity:** During the game, decisions are anonymous. I will not know who donated what until the bonus claim (if even then). This reduces social pressure.

  ### Instructor Recording Instructions
  Create a simple grid to fill in immediately after each round collection:
  *   **Round #:**
  *   **Total Contributors:** (e.g., 15/19)
  *   **Total Tokens Donated:**
  *   **Need Met?** (Yes/No)
  *   **Observed Hesitation:** (Note if students looked at neighbors, sighed, etc.)

  ---

  ## II. Minute-by-Minute Timeline (75 Minutes)

  ### 0:00 – 0:10: Setup and Endowment
  *   **0:00–0:05:** Hand out Tokens (20 each) and Project Cards. Explain the Grant Bonus clearly. "This is yours to keep, unless you choose to spend it."
  *   **0:05–0:10:** Explain the Decision Mechanism. "In each round, a scenario will appear. Write 'YES' (and how many tokens) or 'NO' on your slip. Put tokens in the envelope if YES. Keep them in your pocket if NO. Slips are anonymous."

  ### 0:10 – 0:35: The Game (4 Rounds)
  *   **0:10–0:15: Round 1 (Baseline).** Project parameters. Give 2 mins to decide. Collect slips/tokens. Tally quickly. Announce: "The victim was saved."
  *   **0:15–0:20: Round 2 (High Cost).** Project parameters. Emphasize: "This cost comes directly from your Grant threshold." Give 3 mins (hesitation expected). Collect. Tally. Announce result.
  *   **0:20–0:25: Round 3 (Diffusion/Stats).** Project parameters. "There are 5 other witnesses. You don't know what they will do." Give 2 mins. Collect. Tally. Announce result.
  *   **0:25–0:35: Round 4 (High Cost + Diffusion).** Project parameters. "Cost is high. Others are present." Give 4 mins. This is the critical friction point. Collect. Tally.
  *   *Instructor Note:* Keep transitions crisp. Do not comment on morality yet. Act as a neutral game master.

  ### 0:35 – 1:15: The Debrief (40 Minutes)
  *   **0:35–0:45: Data Reveal & Factor Analysis.** (See Debrief Plan Step 1).
  *   **0:45–0:55: The Strong vs. Weak Principle.** (See Debrief Plan Step 2).
  *   **0:55–1:05: Fair Shares and Noncompliance.** (See Debrief Plan Step 3).
  *   **1:05–1:15: Limitations and Closing.** (See Limitations Section).

  ---

  ## III. Debrief Plan

  ### Step 1: Factor Analysis (10 Minutes)
  **Goal:** Show students that their behavior tracked morally irrelevant factors (b and c) rather than moral importance.

  1.  **Project the Data:** Display the contribution rates for all 4 rounds on the board.
      *   *Expected Pattern:* High contribution in R1. Sharp drop in R2. Moderate/High in R3. Very Low in R4.
  2.  **Ask the Diagnostic Questions:**
      *   "Look at Round 1 vs. Round 3. The cost was identical (2 tokens). The victim was saved in both cases (presumably). Why did contribution rates change?"
      *   *Target Answer:* Students will cite the "5 others" or the "statistical victim."
      *   *Singer's Rebuttal:* "Singer argues the number of bystanders is irrelevant to the *need*. If you can save a life for 2 tokens, does it matter if 5 others *could* have but didn't?"
      *   "Look at Round 1 vs. Round 2. The victim is the same. The only change is the cost to you. Did the moral status of the victim change, or just your willingness to pay?"
  3.  **The Takeaway:** Point out that Singer claims (b) and (c) are psychologically powerful but morally irrelevant. If the bad thing is preventable, the presence of others who refuse to act does not make the bad thing less bad.

  ### Step 2: Locating the Principle Threshold (10 Minutes)
  **Goal:** Distinguish between Singer's Strong and Weak Principles based on when students stopped giving.

  1.  **Define the Principles:** Write them on the board.
      *   *Strong:* Prevent bad without sacrificing anything of **comparable moral importance**.
      *   *Weak:* Prevent very bad without sacrificing anything **morally significant**.
  2.  **Analyze Round 2:**
      *   "In Round 2, the cost was 12 tokens. This cost you your Semester Grant (5 points). For many of you, this was the round where you said 'No'."
      *   "Ask yourself: Is 5 participation points of **comparable moral importance** to a stranger's life/suffering?"
      *   "If you said No (it's not comparable), but you still kept the tokens, which principle did you violate?" (Answer: The Strong One).
      *   "If you kept the tokens because 5 points *is* significant to your GPA/Grade, you are operating on the Weak Principle."
  3.  **The Class Line:** "Look at the drop-off. The point where the majority of the class refused to donate is the point where this group defines 'moral significance.' Singer argues we should push that line much further toward the Strong Principle."

  ### Step 3: Fair Shares and Noncompliance (10 Minutes)
  **Goal:** Address the "Why me?" objection using Round 4 data.

  1.  **Focus on Round 4:** High Cost + 5 Others.
      *   "This was the lowest contribution round. Why?"
      *   Students will say: "Someone else should do it," or "It's not fair if I pay 12 and they pay 0."
  2.  **The Fair Share Argument:**
      *   "This is the 'Fair Share' objection. My duty is limited to my share of the collective burden. If others don't pay their share, why should I pay mine?"
  3.  **Singer's Counter:**
      *   "Singer rejects this. If you and I see a child drowning, and I refuse to help, does that mean you shouldn't help? The child still drowns."
      *   "In Round 4, if no one gave, the victim suffered. Did your refusal to pay 12 tokens protect you from moral blame, or did it just ensure the bad outcome happened?"
      *   "Singer argues that until the point where your contribution causes *you* comparable harm, the noncompliance of others is irrelevant. It is better to be a 'sucker' who saved a life than a 'smart' player who let it die."
  4.  **Discussion:** Ask the students who kept their tokens in Round 4: "If you knew for a fact no one else would give, would you have given?" (This isolates the diffusion of responsibility from the cost).

  ---

  ## IV. Troubleshooting: What Will Go Wrong

  **1. The "Gamer" Mindset**
  *   **Problem:** Some students will treat this purely as a points-optimization game, laughing about "hoarding tokens."
  *   **Fix:** Do not scold them during the game. In the debrief, use their choices as data. "Student X optimized for points. Singer asks if that optimization is morally permissible when points map to real-world resources."

  **2. Collusion**
  *   **Problem:** Students might talk and agree "We all give 2 tokens in Round 4" to save the victim without individual high cost.
  *   **Fix:** Emphasize *private* decisions. "Do not discuss your slips. If I hear talking, the round is void." If they do collude, note it in the debrief: "You created a cooperative system. Singer's point is about the real world where no such system exists."

  **3. Resentment at the "Trap"**
  *   **Problem:** Students may feel manipulated when they realize Round 2 cost them their bonus points.
  *   **Fix:** Acknowledge it. "This discomfort is the point. Singer argues our moral life *should* feel demanding. If the game felt unfair, imagine the reality of famine." Ensure the bonus points are small enough not to ruin grades but large enough to matter.

  **4. Time Creep**
  *   **Problem:** The game takes longer than 25 minutes, eating into the debrief.
  *   **Fix:** Be ruthless with the timer. If a round runs long, cut the discussion time for that specific round, but do not cut the final 15 minutes of debrief. The learning happens in the debrief, not the play.

  ---

  ## V. Limitations: What the Game Cannot Simulate

  *Instructor Note: You must explicitly address these gaps in the final 10 minutes, or students will dismiss the analogy.*

  1.  **Scale and Repetition:**
      *   *Game:* One-off decisions. Once the round is over, the need is gone.
      *   *Reality:* Famine is continuous. If you give today, the need returns tomorrow. Singer's argument implies a lifestyle change, not a one-time donation.
      *   *Debrief Script:* "In this game, you could sacrifice your Grant once and be done. In reality, affluence requires constant vigilance. The tokens replenish next class; the need in Bengal did not stop in 1972."

  2.  **Irreversibility:**
      *   *Game:* Tokens are abstract. Losing 5 points is annoying, not life-altering.
      *   *Reality:* Singer asks us to sacrifice things of *comparable moral importance*. For some, giving away disposable income is easy; for others, it threatens their own security.
      *   *Debrief Script:* "You risked 5 participation points. Singer asks if you would risk your retirement fund, your child's education, or your health. The game minimizes the cost to make the logic clear, but do not mistake the logic for the full weight of the sacrifice."

  3.  **Efficacy:**
      *   *Game:* If you pay, the victim is definitely saved (100% efficacy).
      *   *Reality:* Charities have overhead; aid can be misused. Uncertainty is a major reason people don't give.
      *   *Debrief Script:* "In Round 1, your 2 tokens guaranteed a save. In the real world, you don't know if your donation works. Singer argues we must support the most effective agencies, but uncertainty often becomes an excuse for inaction."

  4.  **Proximity:**
      *   *Game:* The victim is on the screen, psychologically "close."
      *   *Reality:* The needy are geographically distant.
      *   *Debrief Script:* "Singer's core argument is that distance is morally irrelevant. The game put the victim on the projector to simulate 'seeing' them. In reality, you must act on information, not sight."

  ---

  ## VI. Instructor Cheat Sheet (Summary of Principles)

  | Concept | Singer's Position | Common Student Objection | Game Round that Exposes It |
  | :--- | :--- | :--- | :--- |
  | **Distance/Proximity** | Irrelevant. | "They are too far away." | (Implicit in all rounds) |
  | **Bystanders** | Irrelevant. | "Someone else will do it." | Round 3 & 4 |
  | **Vividness** | Irrelevant. | "Statistics don't bleed." | Round 1 vs. 3 |
  | **Strong Principle** | Give until marginal utility equals need. | "That's too demanding." | Round 2 (Cost vs. Grant) |
  | **Fair Shares** | Noncompliance of others doesn't reduce my duty. | "Why should I pay if they don't?" | Round 4 |

  **Final Instruction:** End the class by asking students to keep their remaining tokens. Do not let them cash in the bonus points immediately. Tell them: "Think about whether you *deserve* the bonus points based on the discussion we just had." This leaves the moral residue lingering after they leave the room.
