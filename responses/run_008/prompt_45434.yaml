prompt: |-
  I teach a 200-level course on contemporary moral problems at a mid-sized public university. Next week's unit is on Peter Singer's "Famine, Affluence, and Morality" (Philosophy & Public Affairs, 1972), including the shallow-pond case. There are 19 students enrolled, and we meet once for 75 minutes; the students will have read the paper beforehand. I would like to spend most of the session on an activity rather than on lecture or discussion, and I want the activity designed so that the students run into the philosophical problem through their own choices, not through anything I tell them.

  The effect I am after is this: the students should discover, from their own recorded behavior, which factors actually govern their willingness to bear costs for strangers, and only afterwards see how those factors line up against the two versions of Singer's principle. To arrange this, the game's parameters should vary independently across rounds: (a) the size of the cost a rescuer must bear, (b) how many other players are equally well positioned to rescue, and (c) whether the need is presented as a single vivid person or as a statistical aggregate. In addition, every student should enter the game with a private, token-funded project of their own that pays off at the end only if they retain enough tokens, so that at some point each student faces a rescue decision that would, if made, forfeit the project outright.

  Please provide the full design: rules and materials, a minute-by-minute timeline for the 75 minutes, a payoff scheme requiring no real money, and instructions for what I should record about each round. Then a debrief plan that does three things. First, it should use the recorded choices, round by round, to ask whether giving tracked the cost parameter or instead tracked (b) and (c) — the factors Singer insists are morally irrelevant. Second, it should locate, for the class as a whole, the point at which students crossed, or refused to cross, the line between Singer's strong principle, which forbids sacrificing anything of comparable moral importance, and the weaker version he concedes to those unwilling to accept the strong one. Third, it should map the first moment a student asks, in effect, why me rather than them onto the debate over fair shares: whether my duty is lessened by others' noncompliance, and whether what looks like an agreed division of labor is really just mutual excuse.

  For reference, the strong principle reads: "if it is in our power to prevent something bad from happening, without thereby sacrificing anything of comparable moral importance, we ought, morally, to do it." The qualified version, offered later in the same discussion, reads: "if it is in our power to prevent something very bad from happening, without thereby sacrificing anything morally significant, we ought, morally, to do it."

  Finally, include a section on what will predictably go wrong the first time I run this and how I should handle it, and a candid note on the features of the real problem — its scale, its irreversibility, and the fact that the need never stops presenting itself — that a one-off classroom game with tokens cannot reproduce, so that I know in advance which parts of the idea I will have to supply myself in the debrief.

  Please write the entire answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 200-level Contemporary Moral Problems course, mid-sized public university, 19 students, 75-minute session.
      *   **Topic:** Peter Singer's "Famine, Affluence, and Morality" (including the shallow pond).
      *   **Pedagogical Goal:** Activity-based discovery (students run into the problem through choices, not lecture).
      *   **Key Mechanics:**
          *   Vary parameters independently: (a) Cost to rescuer, (b) Number of other potential rescuers (diffusion of responsibility), (c) Vividness (identifiable victim vs. statistical).
          *   Private Project: Each student has a personal goal/token fund that pays off only if they keep enough tokens.
          *   Conflict: At some point, saving a life costs the personal project.
      *   **Deliverables:**
          *   Full design (rules, materials).
          *   Minute-by-minute timeline (75 mins).
          *   Payoff scheme (no real money).
          *   Recording instructions.
          *   Debrief plan (3 specific goals: track factors vs. Singer's principles, locate the strong/weak principle threshold, map "why me?" to fair shares/noncompliance).
          *   Troubleshooting (what goes wrong).
          *   Limitations note (what the game can't simulate).
      *   **Tone/Style:** American English, professional, practical for an instructor.

  2.  **Deconstruct the Activity Design:**
      *   *Tokens:* Need a currency. Let's call them "Credits."
      *   *Private Project:* Needs to be tangible. A "Research Grant" or "Thesis Fund." Let's go with "Semester Grant." Needs a threshold (e.g., keep 10 credits to win).
      *   *Rescue Scenarios:* Need multiple rounds to vary (a), (b), and (c).
      *   *Decision Mechanism:* Secret ballot or digital? With 19 students, paper slips are reliable and low-tech.
      *   *Outcome:* If enough people donate, the "victim" is saved. If not, they suffer.
      *   *The "Singer Trap":* Eventually, the cost to save must exceed the threshold for the Private Project.

  3.  **Drafting the Game Mechanics:**
      *   *Initial Endowment:* 20 Credits each.
      *   *Private Goal:* Keep at least 10 Credits to "Pass the Course Bonus" (fictional, but motivates).
      *   *Rounds:* 4 Rounds seems manageable in 75 mins.
      *   *Variables:*
          *   Round 1: Low Cost, Single Victim, No Others (Baseline).
          *   Round 2: High Cost, Single Victim, No Others (Tests Strong Principle).
          *   Round 3: Low Cost, Statistical Victims, Many Others (Tests Diffusion/Statistics).
          *   Round 4: High Cost, Single Victim, Many Others (Tests Diffusion + Cost).
      *   *Wait, refinement:* To make the "Why me?" point land, there needs to be a collective threshold. If *anyone* pays, the victim is saved? Or does it require a sum? Singer's pond is usually individual ("If I am the only one..."). But the prompt asks about "fair shares" and "others' noncompliance." So, the scenario needs to imply others *could* help.
      *   *Revised Mechanic:* In each round, there is a "Need." The Need requires $X$ credits to be met. Students decide privately how much to contribute.
      *   *Actually, simpler is better for discovery:* Present a specific request. "To save this person, someone needs to give Y credits." If *you* volunteer, you pay. If no one volunteers, they suffer.
      *   *Let's try a Volunteer's Dilemma structure:*
          *   Round 1: Cost 2, Victim Identifiable, You are the *only* one who knows. (Shallow Pond).
          *   Round 2: Cost 12, Victim Identifiable, You are the *only* one who knows. (Strong Principle Test).
          *   Round 3: Cost 2, Victim Statistical, 5 others could help. (Diffusion/Statistics).
          *   Round 4: Cost 12, Victim Identifiable, 5 others could help. (Diffusion + Cost).
      *   *Payoff:* If you keep $\ge$ 10 credits, you get a "Course Credit" (extra point on participation or similar). If you donate, you lose credits.
      *   *Recording:* Instructor collects slips, tallies donations.

  4.  **Developing the Timeline (75 Minutes):**
      *   0-10: Setup & Endowment.
      *   10-40: The Game (4 rounds x 7 mins + transitions).
      *   40-75: Debrief (The core philosophical work).
      *   *Correction:* 7 mins per round is tight for distribution, decision, collection. Let's do 3 rounds to ensure depth in debrief. Or make the decision very fast. Let's aim for 4 rounds, 5 mins each.
      *   *Revised Timeline:*
          *   0-15: Intro & Setup.
          *   15-35: Gameplay (4 rounds, 5 mins each).
          *   35-75: Debrief (40 mins).

  5.  **Drafting the Debrief (The Crucial Part):**
      *   *Goal 1 (Factors):* Project data on board. Did giving drop when Cost went up? Did it drop when "Others" were introduced? Did it drop with Statistics? Compare to Singer (who says only Cost/Magnitude of Bad matters).
      *   *Goal 2 (Strong vs. Weak):* Identify the round where the majority stopped giving. Was it when the cost threatened the "Semester Grant" (comparable moral importance)?
      *   *Goal 3 (Fair Shares):* Focus on Round 4 (High Cost + Others). Why didn't you give? "Someone else will." Connect to Singer's argument on fair shares vs. actual compliance.

  6.  **Addressing "What Will Go Wrong":**
      *   Students might collude.
      *   Students might not take the tokens seriously.
      *   Students might feel manipulated/angry.
      *   Time management (debrief often gets cut short).
      *   *Mitigation:* Emphasize anonymity, keep tone light but serious about the data.

  7.  **Addressing Limitations:**
      *   Game is one-off; famine is continuous.
      *   Tokens are finite; money is (theoretically) renewable.
      *   Stakes are low (course points vs. life/death).
      *   *Instructor Note:* Must explicitly bridge this gap in the conclusion.

  8.  **Refining the Payoff Scheme:**
      *   No real money. Use "Participation Points."
      *   Base: 10 points for showing up/playing.
      *   Bonus: 5 points if they finish with $\ge$ 10 Credits.
      *   This creates the tension without financial risk.

  9.  **Writing the Content (Iterative refinement):**
      *   *Self-Correction on Recording:* I need to know *who* donated to analyze the "Why me?" question later? No, anonymity is better for honest choices, but I need aggregate data. Wait, the prompt asks to "locate... the point at which students crossed." Aggregate data is fine for that. But for "Why me?", I need to ask them *why* they didn't donate in Round 4.
      *   *Decision:* Anonymous slips for the choice. But ask for a optional code so they can claim their bonus points later without me knowing who donated what during the game. Actually, simpler: Collect slips. Tally publicly. Students keep their remaining credits to claim bonus at end of class.
      *   *Wait, one constraint:* "Every student should enter the game with a private, token-funded project... that pays off at the end only if they retain enough tokens."
      *   *Okay:* Students hold their own tokens. They physically hand them over if they donate. This makes the loss visceral.
      *   *Recording:* I need a spreadsheet to track the *conditions* of each round and the *result* (Saved/Not Saved, Total Donated).

  10. **Final Review against Constraints:**
      *   19 students? Yes.
      *   75 mins? Yes.
      *   Activity > Lecture? Yes.
      *   Vary (a) Cost, (b) Others, (c) Vividness? Yes.
      *   Private Project? Yes.
      *   Debrief 3 specific goals? Yes.
      *   Troubleshooting & Limitations? Yes.
      *   American English? Yes.

  11. **Final Polish:** Ensure the distinction between Strong and Weak principles is clear in the debrief section. Ensure the "Fair Shares" argument connects to Singer's specific rejection of the "fair share" objection in the text. (Singer argues that the fact others aren't giving doesn't reduce your obligation until the point where giving more causes comparable harm).

  *(Self-Correction during drafting)*: Make sure the "Private Project" isn't just "keep tokens." Give it a name. "The Final Paper Pass." If you have 10 credits, you get an automatic extension or a participation boost. Let's make it "5 Bonus Points on Final Participation Grade."

  *(Refining the Rounds)*:
  Round 1: Cost 2, Identifiable, Alone. (Easy yes).
  Round 2: Cost 12, Identifiable, Alone. (The Singer Test).
  Round 3: Cost 2, Statistical, 5 Others. (Diffusion/Stats).
  Round 4: Cost 12, Identifiable, 5 Others. (The "Why Me" Test).

