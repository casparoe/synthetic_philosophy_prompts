  ### The Bookkeeping

  We will track entropy in units of $k_B$ (setting $k_B=1$ for cleanliness, restoring $kT \ln 2$ for work).
  We compare **Run A (Noisy, $q=0.8$)** vs. **Run B (Blind, $q=0.5$)**.

  #### 1. Probabilities and Entropies
  *   **System ($X$):** Uniform prior. $H(X) = \ln 2$ (1 bit).
  *   **Memory ($M$):** Since the input $X$ is 50/50 and the error is symmetric, the output $M$ is also 50/50 regardless of $q$.
      *   $P(M=L) = P(M=L|X=L)P(X=L) + P(M=L|X=R)P(X=R)$
      *   $P(M=L) = q(0.5) + (1-q)(0.5) = 0.5$.
      *   Therefore, **$H(M) = \ln 2$ (1 bit)** for *both* Run A and Run B.
  *   **Conditional Entropy ($H(X|M)$):** This is the uncertainty remaining about the gas after looking at the memory.
      *   $H(X|M) = h_b(q) = -[q \ln q + (1-q) \ln (1-q)]$.
      *   For $q=0.8$: $h_b(0.8) \approx 0.72$ bits.
  *   **Mutual Information ($I(X:M)$):** The correlation strength.
      *   $I(X:M) = H(X) - H(X|M) = 1 - h_b(q)$.
      *   For $q=0.8$: $I \approx 1 - 0.72 = 0.28$ bits.
      *   For $q=0.5$: $I = 0$ bits.

  #### 2. Stage-by-Stage Accounting

  **Stage 1: Measurement**
  *   **Physics:** Correlation is established between $X$ and $M$.
  *   **Thermodynamics:** Assumed reversible. $\Delta S_{total} = 0$. Work = 0.
  *   **State:** System and Memory are correlated. $I(X:M) > 0$.

  **Stage 2: Feedback (Work Extraction)**
  *   **Physics:** We use the memory to extract work.
