  Specs for the scenario:
  1. Classical only. One molecule in a box, a partition, the whole Szilard setup. No quantum anything.
  2. The demon's measurement is unreliable: it guesses the right side with probability q, strictly between 1/2 and 1 — set it up with q as a variable, maybe use 0.8 for concreteness. Symmetric errors, i.e. it isn't biased toward either side.
  3. The measurement itself is free. Stipulate an idealized, reversible, frictionless measurement, so nobody gets to say the loss comes from Brillouin-style dissipation in the act of looking. The demon also isn't intelligent — it's a mechanism, whatever that's worth.
  4. The memory is a physical thing, a register with two macrostates, pick your favorite implementation, and the demon acts on its (possibly wrong) reading in the optimal way.

  Then the demonstration, run twice: run A, the demon uses its noisy reading optimally; run B, the control, where it inserts the partition and picks a side at random, ignoring the reading. Extractable work in each run, entropy accounting stage by stage, and the difference between the runs — that difference is the value of the noisy correlation, and I want it as a function of q.

