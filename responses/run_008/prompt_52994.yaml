  - Where exactly does the second law's protection show up? Is the noise deficit paid at extraction, at erasure, or split across both? Show the accounting that says so, and check whether the Landauer story (erasure costs kT ln 2 per bit, full stop) and the correlation story actually agree on the bottom line in this case, or whether one of them needs patching. Related hunch I want checked: it seems like erasing a memory that's only 80% correlated with anything shouldn't cost a full kT ln 2 — but I might be botching the accounting, so set me straight carefully, don't just agree with me.
  - Which feature of the case is doing the work? What happens as q slides down to 1/2 — does it smoothly degenerate into the coin-flip control run — and as q slides up to 1, back into the textbook engine?
  - Finally, how would someone who insists erasure is the whole cost attack your case, and does the attack actually hold up?

  No citations or reading lists, just the physics, worked honestly, with the numbers where they matter. If any part of the spec is secretly unachievable or ambiguous, say so and fix it — don't quietly paper over it.
