  ### Adjudicating the Dispute

  Now, let's hit your payoff questions.

  #### 1. Where does the Second Law's protection live?
  It lives in the **extraction phase**, not the erasure phase.

  Your hunch was: *"Erasing a memory that's only 80% correlated with anything shouldn't cost a full $kT \ln 2$."*
  **Verdict:** This hunch is **incorrect** for the standard engine cycle.
  **Why:** Landauer's cost depends on the physical state of the memory register *at the moment of erasure*. At that moment, the memory is uncorrelated with the gas (because we removed the partition). The memory is physically in a 50/50 mixture of states. To reset it, you must compress that phase space, regardless of what it *used* to mean. The cost is fixed at $kT \ln 2$.

  The "loss" due to noise appears as **reduced revenue**. The noisy demon extracts less work ($0.28$ vs $1.0$) because the correlation is weak. The Second Law is protected because the "fuel" (Mutual Information) is diluted, not because the "tax" (Erasure) is lowered.

  **Do the stories agree?**
  *   **Landauer Story:** "You must pay $kT \ln 2$ to reset the bit." (True, cost is constant).
  *   **Correlation Story:** "You can only extract $kT I$ work." (True, revenue drops with noise).
  *   **Agreement:** Both yield the same Net Work balance. $W_{net} = kT(I - H(M)) = -kT H(X|M)$. Since $H(X|M) > 0$ for noisy measurements, $W_{net}$ is always negative. No perpetual motion.

  #### 2. Which feature is doing the work? (Limits)
  *   **As $q \to 1$:** $h_b(q) \to 0$, $I \to 1$.
      *   Extraction $\to kT \ln 2$. Erasure $\to kT \ln 2$. Net $\to 0$.
