prompt: |-
  I'm a junior and I co-lead the philosophy club at my school, which is a small group of about ten students who meet for half an hour at lunch every other week. For an upcoming session I've been assigned to present the Jain doctrine of anekāntavāda, the view that reality is many-sided and that any single statement about it captures only part of the truth, along with its companion doctrine of sevenfold predication, according to which a claim is to be prefixed with something like "from one standpoint" and can be affirmed, denied, both, or neither in various combinations. Most of the group has never heard of Jainism and none of them has studied Indian philosophy.

  I don't want you to explain the doctrine to me; I've read enough to feel I understand it myself. What I need is a plan for the session. Specifically:

  1. Dependency structure: in what order the pieces must come so that the doctrine feels like a natural response to a real problem rather than a piece of trivia? Does the idea of standpoints have to come before the sevenfold scheme, or the other way around, and what breaks if I get the order wrong? And does anything need to be in place even before that — some prior sense of what it would mean for a description to be incomplete?

  2. The carrying example: the parable of the blind men and the elephant is the obvious one, but I'm suspicious of it, partly because it seems to suggest there is a sighted person who sees the whole elephant and gets it right, which is exactly the kind of privileged standpoint the doctrine seems to deny. Should I use it anyway and repair it, or is there a better case to build the whole session on? Whatever you recommend, tell me what the example must have in it and what it must not smuggle in.

  3. Misconceptions: I can already guess my clubmates will conclude either that the doctrine is just relativism ("everyone's opinion is equally valid"), or that it's self-refuting ("if every statement is partial, so is that one, so why believe it?"), or that it forbids anyone from ever asserting anything flat-out. Are these the right three to expect, in what order will they surface, and at what point in the sequence should each be headed off rather than allowed to derail the session?

  4. A check for understanding: one question or task I could pose in the last five minutes that would show me whether they've actually grasped the doctrine rather than just found it charming, and what a good versus a merely compliant answer would look like.

  5. What to leave out: given the audience and the thirty minutes, what parts of the tradition should I openly decline to cover, and say I'm declining, so the session doesn't bloat?

  Please be concrete about the sequencing and the reasoning behind it; I care less about the content of the doctrine than about the order of ideas, because that's what I keep getting wrong when I try to teach things.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **User:** Junior in high school, co-lead of a philosophy club (10 students, 30 mins, bi-weekly).
      *   **Topic:** Jain *anekāntavāda* (many-sidedness) and *syādvāda* (sevenfold predication).
      *   **Audience:** No prior knowledge of Jainism or Indian philosophy.
      *   **Constraint:** Do *not* explain the doctrine (user knows it). Focus on *pedagogy* (sequencing, examples, misconceptions, assessment, scope).
      *   **Key Needs:** Dependency structure, carrying example (elephant vs. others), misconception management, check for understanding, scope limitation.
      *   **Tone:** Concrete, reasoned, respectful of the user's knowledge level.

  2.  **Deconstruct the Challenge:**
      *   *Time:* 30 minutes is very short. This is the biggest constraint. Deep dives are impossible.
      *   *Complexity:* *Anekāntavāda* is subtle. It's easily confused with relativism or skepticism.
      *   *Goal:* Make it feel like a *solution* to a problem, not just trivia.

  3.  **Drafting Section 1: Dependency Structure (Sequencing):**
      *   *Problem:* If I start with "Reality is many-sided," it sounds like a slogan. If I start with the sevenfold predication, it sounds like logic puzzles.
      *   *Solution:* Start with a conflict. Two true statements that contradict.
      *   *Order:*
          1.  Phenomenon of conflicting truths (The Problem).
          2.  The concept of *Naya* (Standpoint/Perspective) as the resolver.
          3.  *Anekāntavāda* (The Ontological Claim: Reality supports multiple standpoints).
          4.  *Syādvāda* (The Logical Tool: 7-fold predication to formalize this).
      *   *Why:* If you give the 7-fold scheme before they understand *why* we need standpoints, it's just memorization. If you give standpoints without the ontological commitment, it's just "opinions."
      *   *Risk:* If you skip the "conflicting truths" step, *anekāntavāda* looks like indecision.

  4.  **Drafting Section 2: The Carrying Example:**
      *   *Critique of Elephant:* User is right. It implies a "God's eye view."
      *   *Alternative:* Need something where the "whole" is inaccessible or conceptually impossible to grasp in one go.
      *   *Idea 1:* Time (Is the river the same river?). A bit cliché.
      *   *Idea 2:* Identity (Ship of Theseus). Good, but maybe too Western.
      *   *Idea 3:* A complex social object (e.g., "Is this protest violent?"). Risk of getting bogged down in politics.
      *   *Idea 4:* The "Pot" or "Jar" (Classic Indian example). Is it empty or full? Is it earth or shape?
      *   *Selection:* Let's stick close to the Elephant but *modify* it, OR use a "Map vs. Territory" analogy. Actually, the "Blind Men" is so iconic it's hard to discard. Better to *fix* it as the user suggested.
      *   *Fix:* Emphasize that *no one* is sighted. Even the person describing the whole elephant is blind. The "Elephant" is a noumenal reality we access only through touch.
      *   *Better Alternative:* **The "Is it moving?" example.** (Train station scenario). You are on a train. Is the train moving? Yes (relative to ground). No (relative to yourself). Both/Neither depending on frame. This captures the *standpoint* (naya) perfectly without implying a "true" state of the train independent of reference frames.
      *   *Decision:* Recommend the **Train/Reference Frame** example. It's physics-adjacent (familiar) but captures the metaphysical point without the "God's eye" trap.
      *   *Requirements:* Must show contradictory predicates applying to the *same* subject at the *same* time without logical explosion. Must not imply one frame is the "real" one.

  5.  **Drafting Section 3: Misconceptions:**
      *   *The Big Three:* Relativism, Self-Refutation, Paralysis (can't assert anything).
      *   *Order of Appearance:*
          1.  Relativism (Immediate reaction: "So anything goes?").
          2.  Paralysis (During the 7-fold scheme: "So I can't say 'It is'?").
          3.  Self-Refutation (End of session: "But isn't your theory partial too?").
      *   *Pre-emption:*
          *   Relativism: Address early. Distinction between "opinion" and "partial truth grounded in reality."
          *   Paralysis: Address during the 7-fold explanation. "Syāt" means "in some sense," not "maybe."
          *   Self-Refutation: Save for Q&A or final wrap-up. It's a sophisticated objection. Acknowledge it as a feature, not a bug (the doctrine applies to itself).

  6.  **Drafting Section 4: Check for Understanding:**
      *   *Task:* Don't ask "What is anekāntavāda?" (Recall). Ask them to *apply* it.
      *   *Scenario:* Give a binary debate topic. Ask them to formulate a 7-fold style response or simply a "standpoint" response.
      *   *Specific Task:* "Take the statement 'School uniforms are good.' Show how to affirm and deny this without contradicting yourself using the method we learned."
      *   *Good Answer:* Identifies specific standpoints (economic, expressive, disciplinary).
      *   *Compliant Answer:* "Well, it depends on what you mean." (Too vague).
      *   *Bad Answer:* "Both are right." (Relativism).

  7.  **Drafting Section 5: What to Leave Out:**
      *   *Time Limit:* 30 mins is brutal.
      *   *Cut:* History of Mahavira, detailed cosmology (jiva/ajiva), karma theory, strict ascetic practices.
      *   *Cut:* The full technical Sanskrit names of the 7 predicates (too much memory load). Just the logic.
      *   *Cut:* Comparison with Buddhism (Sunyata) or Advaita Vedanta. Too much comparative philosophy.
      *   *Explicitly State:* "We are ignoring the soteriological goal (liberation) to focus on the logic."

  8.  **Review and Refine:**
      *   *Tone Check:* Is it respectful? Yes.
      *   *Constraint Check:* Did I explain the doctrine? No, focused on teaching strategy.
      *   *Sequencing:* Does the logic hold? Yes, Problem -> Tool -> Application -> Limits.
      *   *Example:* Is the Train example better than the Elephant? Yes, because reference frames are standardly taught as equally valid in physics, avoiding the "sighted man" trap.
      *   *Timing:* 30 mins needs a tight schedule. I should add a rough timeline.

  9.  **Final Polish:** Ensure the distinction between *naya* (standpoint) and *anekāntavāda* (ontology) is clear in the sequencing advice. Ensure the "self-refutation" objection is handled delicately (it's actually a strength of the system).

  *(Self-Correction during drafting)*: Wait, the user asked specifically about the order of "standpoints" vs "sevenfold scheme." I need to be explicit there. Standpoints (*naya*) must come first. The sevenfold (*syādvāda*) is the linguistic expression of the standpoint. If you reverse it, the sevenfold looks like arbitrary modal logic.

  *(Refining the Example)*: The Train example is good, but is it "philosophical" enough? Maybe the "Pot" example is more traditional. But the Train is more intuitive for modern students regarding "truth." Let's suggest the Train but warn about reducing it to mere physics. It needs to be about *description*, not just motion. Actually, let's offer the Elephant *with the specific repair* the user hinted at, because it's the standard intro for a reason, but provide the Train as a backup if they want to avoid the "whole" trap entirely. No, better to commit. The Elephant is too hard to fix perfectly in 5 mins. The **Map** analogy is better. A map is true but incomplete. A street map vs. a topographical map. Both true, different purposes. No "God's eye" map exists. Let's go with **Maps**.

  *Re-evaluating the Map vs. Train:*
  Train: "Is it moving?" Yes/No. Good for contradiction.
  Map: "Is this accurate?" Yes (for streets), No (for elevation). Good for utility.
  *Anekāntavāda* is about *being*, not just utility. The Train is better for ontological predicates. Let's stick with the Train/Reference Frame but emphasize that *reality itself* allows both, not just our perception.

  *Wait, one more thought:* The user is a high schooler. 30 minutes. The 7-fold predication is *hard*. Affirm, Deny, Both, Inexpressible... + the 3 time/standpoint modifiers. That's complex.
  *Strategy:* Simplify the 7-fold. Focus on the first 4 (Is, Is Not, Both, Inexpressible) and mention the rest are extensions. Don't try to memorize all 7 in 30 mins. Focus on the *prefix* ("From a certain standpoint...").

  *Okay, let's finalize the plan.*

  *   **Structure:** Conflict -> Standpoint -> Ontology -> Logic.
  *   **Example:** The Train (Motion is relative, no privileged frame).
  *   **Misconceptions:** Relativism (start), Paralysis (middle), Self-Refutation (end).
  *   **Assessment:** Apply to a new binary claim.
  *   **Cuts:** History, Soteriology, Full Sanskrit terminology.

