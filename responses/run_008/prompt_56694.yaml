      *   *Refining the Protocol:* Make sure the "Timing Test" is very clear. "Did the patient have this characteristic *before* they walked through the door?"

  11. **Final Polish:** Check tone. Ensure it sounds like a colleague helping a colleague, not a textbook. Use bolding for readability. Ensure British spelling (standardise, programme, centre, analyse).

