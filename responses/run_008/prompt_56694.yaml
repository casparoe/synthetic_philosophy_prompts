      *   *Better Idea:* In Case 1, the procedure might conclude that *neither* number is safe because of unmeasured confounding, forcing a judgment call that delays the dashboard.
      *   *Best Idea:* Stick to the standard interpretation but frame the *recommendation* aggressively. For Case 1, explicitly state "Do not publish the headline." That annoys the Comms team. For Case 2, state "Roll out," which annoys the Finance team who wanted to cut it. I will aim for Case 1 to be the "Annoying" one where I tell them their favourite unit is actually underperforming clinically.

      *   *Wait, re-reading the prompt's Case 1:* "Unit A has lower mortality overall but higher mortality in both the low-risk and the high-risk patient bands."
      *   If I conclude "Unit A is actually worse," that contradicts the headline "Unit A is better." That annoys Unit A's director.
