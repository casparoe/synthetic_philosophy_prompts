answer: |-
  Right, let's settle this. You are correct: "always disaggregate" is dangerous advice. It invites data dredging and allows unit managers to hide behind small subgroups where confidence intervals are wide enough to claim "no significant difference." But your friend is also half-right: the headline aggregate is often a lie if the case-mix isn't identical.

  The problem isn't the maths; it's the causal structure hidden in the spreadsheet. Since you don't have time to draw Directed Acyclic Graphs (DAGs) with three consultants breathing down your neck, you need a heuristic that approximates causal inference using timing and logic.

  Here is the **Simpson's Protocol**. It is designed to be run in 45–60 minutes per metric. It forces you to distinguish between *noise*, *confounding* (where you must adjust), and *mediation* (where you must not).

  ***

  # The Simpson's Protocol: A Decision Procedure for Health Metrics

  **Prerequisites:** You need the aggregate rates, the subgroup rates, the sample sizes ($N$) for each, and 95% confidence intervals (CIs).

  ### Step 1: The Noise Filter (10 mins)
  Before worrying about paradoxes, check if the flip is statistically real or just small-number volatility.
  *   **Check:** Calculate the 95% Confidence Intervals for the subgroup comparisons.
  *   **Rule:** If the CIs of Unit A and Unit B overlap substantially in *all* subgroups, but the aggregate shows a significant difference, **stop**. This is likely ecological fallacy or noise, not Simpson's Paradox.
  *   **Action:** Mark the metric as "Unreliable for Ranking." Report the aggregate with a large warning flag about sample size. Do not disaggregate to find a "winner."
  *   **Pass Condition:** The subgroup differences are statistically significant (or the sample sizes are >100 per subgroup). Proceed to Step 2.

  ### Step 2: The Timing Test (15 mins)
  This is your proxy for causal direction. You must identify the variable causing the flip (e.g., Patient Severity, Wound Size).
  *   **Question:** Did the patient possess this characteristic *before* the decision was made to assign them to Unit A/B or Treatment X/Y?
      *   **Yes (Pre-existing):** e.g., Age, Comorbidity Score, Wound Size on admission. This is a **Confounder**. It influences both where they go and how they fare.
      *   **No (Post-treatment):** e.g., Length of Stay, Complications, Discharge Destination. This is a **Mediator** or **Collider**. It is a result of the care, not a cause of the assignment.
  *   **Rule:**
      *   If **Pre-existing**: You *must* adjust (disaggregate or standardise). The aggregate is biased.
      *   If **Post-treatment**: You *must not* adjust. Disaggregating creates bias (collider bias). The aggregate is the truth.
  *   **Judgment Call Zone:** If the variable is ambiguous (e.g., "Emergency vs. Elective" – sometimes triage decides this, sometimes the patient's condition does), you must convene the clinicians. Ask: "If we forced a patient to be Elective, would their risk change?" If yes, it's a mediator. If no, it's a confounder.

  ### Step 3: The Imbalance Check (10 mins)
  Simpson's Paradox requires an imbalance in the subgroups to manifest.
  *   **Check:** Compare the distribution of the subgroup variable between Unit A and Unit B.
      *   *Example:* Unit A treats 80% High Risk; Unit B treats 20% High Risk.
  *   **Rule:** If the distributions are roughly similar (within 10%), the aggregate is safe. Simpson's Paradox cannot mathematically sustain itself without significant weighting differences.
  *   **Action:** If balanced, publish the Aggregate. If imbalanced, proceed to Step 4.

  ### Step 4: The Stability Test (15 mins)
  Sometimes disaggregating creates *more* paradoxes (e.g., flipping back when you slice by age).
  *   **Check:** Pick a second potential confounder (e.g., if you sliced by Severity, now check Age).
  *   **Rule:** If the ranking flips again when slicing by a second **Pre-existing** variable, your data is too unstable for a simple ranking.
  *   **Action:** Do not publish a ranked league table. Publish a "Funnel Plot" or range of performance. Acknowledge that unmeasured confounding is likely present.

  ### Step 5: The Final Decision Matrix
  Combine the outputs above to decide what goes in the pack.

  | Timing Test | Imbalance Check | Verdict | What to Publish |
  | :--- | :--- | :--- | :--- |
  | **Pre-existing** (Confounder) | **High Imbalance** | **Aggregate is Lie** | **Risk-Adjusted Rate** (Standardised). Do not show raw aggregate. |
  | **Pre-existing** (Confounder) | **Balanced** | **Aggregate is Safe** | Raw Aggregate (but note case-mix is similar). |
  | **Post-treatment** (Mediator) | **Any** | **Disaggregate is Lie** | **Raw Aggregate Only**. Do not slice by this variable. |
  | **Unclear / Mixed** | **High Imbalance** | **Judgment Call** | Show Both. Add narrative explaining the tension. |

  ***

  # Application to Your Cases

  Here is the protocol run on your two scenarios. I have applied the "Annoyance Test" as requested.

  ## Case 1: The Cardiac Units
  **Scenario:** Unit A has lower mortality overall (looks better). Unit A has *higher* mortality in both Low-Risk and High-Risk bands (looks worse).
  **Context:** Unit A is the Regional Tertiary Centre; Unit B is the District General.

  **1. Noise Filter:**
  Assume $N$ is large (cardiac data usually is). CIs do not overlap. The flip is real. **Pass.**

  **2. Timing Test:**
  Variable: *Patient Severity (Risk Score).*
  Did the patient have this risk score before assignment? **Yes.**
  Is it a Confounder? **Yes.** Sicker patients are referred to the Tertiary Centre (Unit A). Sicker patients are more likely to die regardless of care.
  **Verdict:** This is a Confounder. We *must* adjust.

  **3. Imbalance Check:**
  Unit A (Tertiary) likely takes 70% High Risk. Unit B (District) takes 20% High Risk.
  **Verdict:** High Imbalance.

  **4. Stability Test:**
  If we slice by Age, does it flip back? Unlikely to override the severity risk.
  **Verdict:** Stable confounding.

  **5. Decision:**
  *   **Protocol Output:** **Aggregate is Lie.** Publish Risk-Adjusted Rate.
  *   **The Maths:** The aggregate is being driven by Unit A taking easier cases overall (perhaps they are cream-skimming elective work while sending emergencies elsewhere, or the risk model is under-weighting their specific caseload). However, within every clinical stratum, Unit B is saving more lives.
  *   **The Recommendation:** Do not publish the headline mortality rate. Publish the risk-standardised mortality ratio (SMR).
  *   **Who gets annoyed?** **Unit A's Director and the Board Chair.**
      *   *Why:* The headline dashboard makes Unit A look like the star performer (lower overall mortality). Your procedure proves this is an artefact of case-mix and that clinically, Unit B is outperforming them. Unit A will argue their cases are "more complex than the risk score captures."
      *   *Your Defence:* "The Timing Test confirms Severity is pre-existing. The Imbalance Check confirms Unit A's caseload is skewed. To publish the headline is to incentivise cherry-picking easy patients."

  ## Case 2: The Wound Dressing
  **Scenario:** New Dressing is better for Small Wounds. New Dressing is better for Large Wounds. New Dressing is *worse* Overall.
  **Context:** Deciding whether to roll out the new (more expensive) dressing board-wide.

  **1. Noise Filter:**
  Assume significant $N$. **Pass.**

  **2. Timing Test:**
  Variable: *Wound Size.*
  Did the wound have this size before the dressing was chosen? **Yes.**
  Is it a Confounder? **Yes.** Clinicians are likely choosing the New Dressing for the nasty, large wounds because they hope it works better, and using the Old Dressing for the small, easy grazes.
  **Verdict:** This is a Confounder. We *must* adjust.

  **3. Imbalance Check:**
  New Dressing Group: 80% Large Wounds.
  Old Dressing Group: 80% Small Wounds.
  **Verdict:** High Imbalance. (This is why the overall rate is worse; Large wounds heal worse regardless of dressing).

  **4. Stability Test:**
  Check by Patient Age. If the result holds, we are confident.

  **5. Decision:**
  *   **Protocol Output:** **Aggregate is Lie.** Publish Stratified Rates.
  *   **The Maths:** The aggregate suggests the new dressing is harmful. The stratified data proves it is clinically superior in all contexts. The aggregate is penalising the new dressing for being used on harder cases.
  *   **The Recommendation:** **Roll out the new dressing.**
  *   **Who gets annoyed?** **The Finance Director / Procurement.**
      *   *Why:* The headline number in the pilot report says "New Dressing = Higher Infection Rate / Poorer Healing." They want to cut the cost. Your procedure tells them the headline is statistically invalid and they must spend more money on the new dressing.
      *   *Your Defence:* "The Timing Test confirms Wound Size is pre-existing. Clinicians self-selected the new dressing for worse wounds. Adjusting for this confounder shows the new dressing reduces risk by X%."

  ***

  # Where the Maths Stops and the Judgment Begins

  You asked for the line where you have to own the call. Here it is:

  **1. The "Unmeasured Confounder" Clause**
  The protocol assumes *Severity* or *Wound Size* captures the risk. It might not.
  *   *Judgment:* If Unit A argues, "Our High Risk patients are *older* than Unit B's High Risk patients," and you haven't adjusted for age, your risk-adjustment is still biased.
  *   *Rule:* If clinicians can plausibly name a second pre-existing variable that is imbalanced, you cannot claim the paradox is "solved." You must state: *"Adjusted for Severity, but residual confounding likely."*

  **2. The "Sample Size vs. Granularity" Trade-off**
  Sometimes the only pre-existing variable is "Surgeon."
  *   *Judgment:* If you disaggregate by Surgeon, $N$ drops to 20 per surgeon. CIs become huge.
  *   *Rule:* If disaggregating creates noise (Step 1 fails), you cannot use that variable to correct the paradox. You must revert to the Aggregate with a disclaimer, or combine units to increase $N$.

  **3. The "Policy vs. Clinical" Distinction**
  Sometimes the aggregate *is* the metric that matters for policy, even if it's clinically biased.
  *   *Example:* If Unit A *chooses* to specialise in high-risk patients, that is a system design choice.
  *   *Judgment:* For *clinical quality* dashboards, use Risk-Adjusted (Case 1). For *system capacity* dashboards, Raw Aggregate might be acceptable (because the system *did* fail to save that patient, regardless of risk).
  *   *Rule:* Define the dashboard's purpose in the header. "Clinical Performance" = Adjusted. "System Outcomes" = Raw. Do not mix them.

  # Summary for Your Next Meeting

  When the argument starts again, put this on the screen:

  1.  **Did the characteristic exist before treatment?** If no, stop slicing.
  2.  **Is the mix imbalanced?** If no, the headline is fine.
  3.  **If Yes to both:** The headline is misleading. Show the adjusted number.

  In Case 1, you tell the Board that Unit A's headline success is a statistical artefact of case-mix. In Case 2, you tell Procurement that the pilot failure is a statistical artefact of selection bias.

  Both conclusions contradict the "gut feeling" of the headline number. That is the job. If the dashboard doesn't occasionally make people uncomfortable, it's just a wallpaper chart.
