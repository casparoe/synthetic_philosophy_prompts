      *   **Problem:** Recurring arguments about Simpson's Paradox in quarterly performance dashboards (mortality, readmissions, etc.). Unit rankings flip depending on aggregation/disaggregation.
      *   **Friend's View:** "Always show disaggregated numbers" (User thinks this is flawed because you can slice by anything to game the system).
      *   **Goal:** A practical decision procedure (checklist/flowchart style) to determine when to aggregate vs. disaggregate for a specific metric.
      *   **Constraints:**
          *   Must be runnable in ~1 hour per metric.
          *   No formal causal graphs available (just three consultants and a spreadsheet).
          *   Must distinguish between noise/small numbers and actual paradox.
          *   Must identify where judgment calls are needed.
          *   British English.
          *   Must apply the procedure to two specific cases (Cardiac Units, Wound Dressing).
          *   At least one result must challenge the "gut feeling" (i.e., not just validate the status quo).

  2.  **Deconstruct Simpson's Paradox in this Context:**
      *   Simpson's Paradox occurs when a trend appears in different groups of data but disappears or reverses when these groups are combined.
      *   *Key Cause:* Confounding variables. A third variable influences both the grouping (Unit A vs. Unit B) and the outcome (Mortality).
      *   *The "Causal Direction" Issue:* The user mentioned this. If the subgroup variable is a *confounder* (causes both treatment assignment and outcome), you must adjust (disaggregate/standardise). If it's a *mediator* (treatment causes subgroup which causes outcome) or a *collider* (outcome and treatment both cause subgroup), adjusting creates bias.
      *   *Practical Translation:* In healthcare, "Patient Severity" is usually a confounder (sicker patients go to specialist units *and* die more). "Site" might be a confounder or just a structural label. "Surgeon" might be a mediator (Unit A hires better surgeons).

  3.  **Develop the Decision Procedure (The "Simpson's Protocol"):**
      *   Need a step-by-step guide.
      *   *Step 1: Data Quality & Noise Check.* Before worrying about causality, is the flip real? (Confidence intervals, sample size).
      *   *Step 2: Identify Candidate Variables.* What are we slicing by? (Severity, Age, Site).
      *   *Step 3: The "Timing & Logic" Test (Proxy for Causal Graph).* This is the crucial part for non-statisticians. Did the subgroup characteristic exist *before* the unit assignment/treatment?
          *   If Yes (Pre-existing): Likely a confounder. Disaggregate/Standardise.
          *   If No (Post-treatment): Likely a mediator/collider. Aggregate.
      *   *Step 4: Balance Check.* Is the distribution of the subgroup vastly different between units? (e.g., Unit A takes 90% high risk, Unit B takes 10%). If balanced, aggregation is safer.
      *   *Step 5: The "Actionability" Test.* If we adjust, can we actually do anything about it?
      *   *Step 6: Final Decision Rule.*

  4.  **Drafting the Procedure (Iterative refinement for British English & Tone):**
      *   Tone: Professional, pragmatic, slightly weary of office politics but rigorous.
      *   Terminology: "Units," "Metrics," "Confounding," "Standardisation."
      *   Make sure to highlight the "Judgment Call" zones.

  5.  **Developing Case Study 1: Cardiac Units:**
      *   *Scenario:* Unit A lower overall mortality, but higher in both low/high risk bands.
      *   *Analysis:* This is classic Simpson's. Unit A likely takes much sicker patients (High Risk) who drag down the average, but performs better within groups.
      *   *Application of Protocol:*
          *   Noise? Assume significant.
          *   Variable: Risk Severity. Pre-existing? Yes (patient arrives sick).
          *   Balance? Likely skewed (Tertiary centre vs. District General).
          *   *Verdict:* The aggregate number is misleading. The disaggregated (risk-adjusted) number is the truth.
          *   *Annoyance Factor:* The Board probably likes Unit A's headline number. Telling them Unit A is actually worse (or Unit B is better) might annoy them. Wait, the prompt says Unit A has *lower* mortality overall but *higher* in bands. So Unit A looks good on headline, bad on detail. If the Board loves Unit A, telling them they are actually underperforming relative to case-mix will annoy them.
          *   *Correction:* Actually, usually the Tertiary centre (Unit A) has *higher* overall mortality because they take the worst cases, but *lower* risk-adjusted mortality. Let's stick to the prompt's specific numbers: Unit A lower overall, higher in bands. This implies Unit A takes mostly *low* risk patients (skewing the average), but is clinically worse at treating them.
          *   *Wait, let's re-read the prompt's Case 1:* "Unit A has lower mortality overall but higher mortality in both the low-risk and the high-risk patient bands."
          *   *Math Check:* If $A_{low} > B_{low}$ and $A_{high} > B_{high}$, how can $A_{total} < B_{total}$?
          *   This requires Unit A to have a massive proportion of Low Risk patients (who die rarely) compared to Unit B.
          *   *Interpretation:* Unit A is "cream-skimming" (taking easy cases).
          *   *Verdict:* Disaggregate. Unit A is gaming the system or is a low-acuity centre. The headline is a lie. This will annoy Unit A's champions.

  6.  **Developing Case Study 2: Wound Dressing:**
      *   *Scenario:* New technique better in small wounds, better in large wounds, but worse overall.
      *   *Analysis:* Classic Simpson's. The new technique is likely being applied disproportionately to large wounds (which have worse outcomes generally).
      *   *Application of Protocol:*
          *   Variable: Wound Size. Pre-existing? Yes.
          *   Balance? Skewed. New dressing used on harder cases.
          *   *Verdict:* The aggregate is misleading. The new dressing is actually better.
          *   *Annoyance Factor:* The Committee might be ready to scrap the new dressing based on the headline. Saving it might annoy the cost-cutters. Or, if the prompt wants me to annoy the commissioners, maybe the conclusion is "Don't roll out."
          *   *Wait, let's look at the causal structure.* If the new dressing is *assigned* based on wound size, size is a confounder. We must adjust.
          *   *Result:* Roll it out (it's better).
          *   *Alternative:* What if "Wound Size" is affected by the dressing? No, size is pre-existing.
          *   *Let's make it tricky:* What if the "Wound Size" categorisation happens *after* initial treatment? No, prompt says "small-wounds group".
          *   *Decision:* The procedure should conclude the new dressing is superior. This contradicts the headline "worse overall". This annoys the people looking at the top-line cost/benefit.

  7.  **Refining the "Judgment Call" Section:**
      *   Crucial to admit where maths ends.
      *   Selection bias vs. Confounding.
      *   Sample size thresholds.

  8.  **Review against Constraints:**
      *   British English? (Check: "standardise," "programme," "centre," "maths").
      *   One hour per metric? (Keep steps simple).
      *   No causal graphs? (Use "Timing Test").
      *   Annoy the committee? (Ensure conclusions challenge headline figures).

  9.  **Drafting the Content (Mental Outline):**
      *   **Intro:** Acknowledge the pain. Validate the user's skepticism about "just disaggregate."
      *   **The Protocol (S.O.P. for Simpson's):** 5 Steps.
          1.  Significance (is it noise?).
          2.  The Timing Test (Confounder vs. Mediator).
          3.  The Imbalance Check (is the mix different?).
          4.  The Stability Check (do subgroups flip-flop?).
          5.  The Decision Matrix.
      *   **Case 1 (Cardiac):** Apply protocol. Conclusion: Headline is dangerous. Unit A is cherry-picking.
      *   **Case 2 (Wound):** Apply protocol. Conclusion: Headline is misleading. New dressing is good.
      *   **Closing:** How to present this to the Board without getting fired.

  10. **Self-Correction/Refinement during drafting:**
      *   *Correction on Case 1:* If Unit A has lower overall mortality but higher in *both* bands, Unit A must be treating vastly more low-risk patients. This suggests "Risk Selection." The recommendation must be to use risk-adjusted rates, not raw aggregates. This annoys Unit A who look good on the headline.
      *   *Correction on Case 2:* If New Dressing is better in subgroups but worse overall, it means New Dressing was used on more Large Wounds (high risk). The recommendation is to adopt the new dressing. This annoys the Finance Director who sees the headline "New Dressing = More Infections/Deaths."
