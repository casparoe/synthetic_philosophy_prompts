answer: |-
  Good evening. Thank you all for coming. For those who don't know me, I'm [Name], her niece/nephew.

  Looking out at the room, I realise I have a rather specific tightrope to walk. On one side, I have the family. Many of you think Schopenhauer is a kind of German sausage, or perhaps a gloomy German who hated dogs. On the other side, I have my aunt's colleagues from the Conservatoire. You know the philosophy cold. You know that if I say something metaphysically sloppy, you'll spend the interval correcting me.

  So, I shall try to be precise. She would have demanded nothing less.

  For thirty-five years, this city was her home. She taught here, she lived here, and she argued about the nature of existence here. And she was, as many of you know, a committed Schopenhauerian. Now, usually, at a memorial, the speaker's job is to offer comfort. We are supposed to say things like, 'She lives on in this music,' or, 'Tonight, she is speaking to us through the Bach.'

  But if I said that, I would be lying. And if there was one thing my aunt despised, it was a comforting lie.

  For her, and for Schopenhauer, music is not a medium for individual spirits. It doesn't depict *her*. It doesn't depict *anyone*. In her view, music is the odd one out among the arts. It doesn't copy the world of things we see; it copies the engine underneath the world. It is a direct image of the Will itself. So, to say she is 'speaking' to us tonight would be, strictly speaking, nonsense. The music is not her voice. It is the voice of the thing that churns beneath all of us, the striving that makes us suffer, and the silence that sits behind the striving.

  She would have found it very funny to hear us trying to find her ghost in a C major chord. She'd be sitting up there now, I suspect, rolling her eyes at our sentimental need to keep her alive.

  But—and this is important—Schopenhauer does not leave us with nothing. If the standard comfort is off the table, there is another one available. And this, I think, is the comfort she actually believed in.

  Schopenhauer thought that life is essentially wanting. We want, we strive, we suffer, we want again. It is a endless, grinding cycle. But he argued that when we truly listen to music, the grinding stops. For the duration of the sound, we are granted a holiday from our own willing. We step out of the struggle. We are not individuals anymore; we are just ears, just attention.

  That is the gift she gave us. Not her presence, but her discipline. She spent thirty-five years teaching us how to stop, how to attend, and how to find that brief, quiet respite from the noise of being alive.

  The programme tonight is hers. She chose it before she died, with that characteristic lack of sentimentality. We have the Bach Chaconne. We have the late Schubert. And we have the Beethoven she played at the funeral of her own student, years ago. She knew what that piece cost. She knew that music does not bring the dead back. She knew it does not fix the broken thing.

  But she also knew that for four minutes, or ten minutes, or forty, it can make the brokenness bearable. It clears the air.

  So, I am not going to tell you that she is here. I am not going to tell you that this will make everything feel better. The Will will still be there when the final note fades. The wanting will return. The empty chair will remain empty.

  But for tonight, while the music plays, we can put the wanting down. We can have the holiday she promised us. She was cheerful about the bleakness of it all; she didn't need the universe to be kind to find reasons to be kind herself.

  I think the best way to honour that is to listen. Not to hear her, but to hear the thing she loved more than herself.

  Thank you.
