answer: |-
  # Workshop Prep Sheet: Realism in the Scaling Era

  **Thesis:** Interpretability features (directions, SAE latents) are discovered causal structures, not imposed bookkeeping.
  **Room:** 15 pax. High expertise, mixed disciplines.
  **Tone:** Confident but charitable. You are arguing for a metaphysical stance that supports safety, not just scoring philosophical points.

  ---

  ## The Six Likely Objections

  ### 1. The "Basis Dependence" Objection
  **Voice:** The Senior Person (Superposition Veteran). Leaning back, hands steepled.
  **The Gist:** "You're treating SAE features like atoms. But we know networks operate in superposition. There are more features than dimensions. Any decomposition is a choice of dictionary size and sparsity penalty. If I change the L1 coefficient, your 'French Medical' feature splits or merges. In what sense is *that* decomposition the network's fact of the matter rather than a hyperparameter choice?"

  **Your Response (2 mins):**
  "You're right that the *geometry* is basis-dependent, but that conflates mathematical representation with causal structure. Think of it like a Fourier transform. I can represent a sound wave in time-domain or frequency-domain. Both are valid, but if I want to explain why a glass shattered, the frequency domain captures the *causal mechanism* (resonance) better than the time domain.
  The network's 'fact of the matter' isn't that there is one true orthogonal basis. It's that there are causal levers. If an SAE direction allows me to intervene and toggle French medical generation without breaking grammar or general medical knowledge, that direction tracks a causal joint in the computation. The sparsity penalty just helps us resolve those joints. If changing the penalty splits the feature, that usually means we've resolved a finer-grained causal structure, not that the original was fake. Realism about features is realism about *causal leverage*, not realism about orthogonal vectors."

  ### 2. The "Rotational Invariance" Objection
  **Voice:** Closet Instrumentalist Mech Interp Researcher. Slightly apologetic but persistent.
  **The Gist:** "In an MLP, I can rotate the outgoing weights of one layer and the incoming weights of the next without changing the function. The 'directions' in activation space are mathematically arbitrary. Why privilege the axis-aligned directions your SAE finds over any rotated version that produces the same output?"

  **Your Response (2 mins):**
  "That symmetry holds for *input-output behavior*, but it breaks under *intervention*. If I rotate the basis, I scramble the semantic coherence of the neurons. Yes, the function is preserved, but the *mechanism* is no longer local.
  Realism here claims that the network, during training, broke that symmetry. SGD didn't find a random rotation; it found a specific configuration that minimizes loss under capacity constraints. That configuration tends to cluster semantically related concepts because it's computationally efficient for the next layer to read them out. The 'arbitrary' rotation might compute the same function, but it wouldn't be robust to the same ablations. We are privileging the decomposition that aligns with the model's own computational bottlenecks, not just any mathematically equivalent one."

  ### 3. The "Latitude and Longitude" Objection
  **Voice:** Phil of Science #1. Smiling, reaching for a classic analogy.
  **The Gist:** "This sounds like van Fraassen's 'saving the phenomena.' Lines of latitude are incredibly useful for navigation. I can intervene on them (sail north) and predict outcomes. But no one thinks latitude is 'real' in the ontology of the Earth. It's a grid we impose. Why aren't your features just latitude lines on the activation manifold?"

  **Your Response (2 mins):**
  "That's the strongest analogy for instrumentalism, but it fails on *causal depth*. Latitude lines don't explain *why* the climate changes as you move north; they just index it. The Earth's tilt and curvature explain the climate.
  If features were just latitude, steering them would be correlational. But when we patch a feature, we aren't just re-indexing; we're altering the information flow. A better analogy is a circuit diagram. We can draw the diagram in different colors or layouts (the grid), but the transistor itself is a physical component. If I remove the transistor, the radio stops working. Our interventions show these features act like transistors, not like grid lines. They carry specific information loads that, if removed, degrade specific capabilities while sparing others. That's structural reality, not just coordinate mapping."

  ### 4. The "Garden of Forking Paths" Objection
  **Voice:** Stats Postdoc. Looking at their notebook, frowning.
  **The Gist:** "You showed me three features that converge across methods. But how many did you check before finding those three? If you train enough SAEs with enough seeds, you'll find *some* overlap by chance. What's your correction for multiple comparisons? How do I know this isn't just overfitting to the 'interpretability of the month'?"

  **Your Response (2 mins):**
  "Fair concern, and we should be rigorous about null distributions. But convergence here isn't just 'two SAEs found similar things.' It's that *causal tracing*, *probing*, and *SAE reconstruction* all point to the same subspace despite having different loss functions.
  Probes minimize classification error. SAEs minimize reconstruction error. Causal tracing minimizes intervention residual. For these three distinct objectives to converge on the same subspace by chance requires a conspiracy of overfitting that's statistically implausible. It's like three people using a thermometer, a thermal camera, and a heat-sensitive touch to find the same hot spot on an engine. They might all be wrong, but it's more likely there's actually heat there. We aren't cherry-picking features that look nice; we're selecting features that survive triangulation from independent methods."

  ### 5. The "Fuzziness" Objection
  **Voice:** Closet Instrumentalist Mech Interp Researcher #2.
  **The Gist:** "Okay, say they're real. But they're messy. The 'French' feature also fires on code-switching. The 'Medical' feature fires on legal jargon sometimes. If the boundaries are this fuzzy, does 'realism' do any work? A particle that's sometimes an electron and sometimes a muon isn't a real category."

  **Your Response (2 mins):**
  "I'd push back on the particle analogy. Biological categories are real but fuzzy. The concept of 'heart' is real, even if there are edge cases in embryonic development or evolutionary intermediates.
  Features in high-dimensional space are inherently contextual. They aren't atomic symbols; they're attractors in a dynamic system. The fact that 'Medical' bleeds into 'Legal' (e.g., malpractice law) isn't a bug; it's a feature of the semantic space the model is modeling. Realism doesn't require Platonic purity. It just requires that there is a fact of the matter about whether firing this direction increases the probability of medical tokens more than non-medical tokens, holding context constant. Fuzziness at the boundaries doesn't negate the structure in the core."

  ### 6. The "Consciousness" Objection
  **Voice:** Phil of Mind Grad Student. Eyes bright, leaning forward.
  **The Gist:** "If these representations are real, does the model have intentionality? If it represents 'French,' does it *mean* French in the phenomenological sense? Are we talking about qualia here?"

  **Your Response (The Shutdown Line):**
  "That's the Hard Problem, and it's a separate question from the Structural Problem. We can agree on whether a circuit *computes* a function without agreeing on whether it *feels* like something to compute it. I'm arguing for realism about the mechanism, not the experience. Let's bracket consciousness so we don't confuse the architecture with the ghost."

  ---

  ## The Concession Flag

  **Where to yield:** **Objection #5 (Fuzziness).**
  **Why:** If you dig in on features being crisp, the Senior Person and the Mech Interp folks will eat you alive. They know the latents are polysemantic and messy.
  **How to concede:** "I will concede that features are not atomic. They are context-sensitive and often polysemantic. My realism is about the *causal role* of the direction, not its semantic purity. A feature can be real and still be a messy, overlapping cluster."
  **Strategic Value:** This makes you look reasonable and empirically grounded, distinguishing you from a naive "symbolist" view of neural nets.

  ---

  ## The Dreaded Question

  **The Question:** "If instrumentalism gets you the same steering results, why does the ontology matter?"
  **Who asks it:** Probably the Senior Person or the pragmatic Mech Interp lead.
  **Why it's dreaded:** Because if instrumentalism works for safety (steering, monitoring), arguing for realism can look like metaphysical navel-gazing. If the "fake" feature works just as well as the "real" one, what is the cash value of your thesis?

  **Your Answer:**
  "Because instrumentalism fails when you leave the training distribution. If you think features are just bookkeeping, you assume they'll stay useful as long as the loss stays low. But if they are causal mechanisms, you know they might break under adversarial pressure or distribution shift.
  For safety, we need to know if we're turning off a 'deception module' or just suppressing a correlate of deception. If it's just a correlate (instrumental), the model will route around it. If it's a mechanism (real), disabling it actually changes the capability. Realism isn't comfort; it's the difference between patching a leak and painting over rust. We need to know what we're actually touching."

  ---

  ## Final Advice for the Room
  *   **Don't let the Phil of Mind students hijack the Q&A.** Use the shutdown line early if they start winding up.
  *   **Respect the Stats Postdoc.** If they bring up a specific statistical test you haven't run, don't bluff. Say, "That's a necessary control, I'll run it."
  *   **The Senior Person is your key audience.** If you convince them that "causal leverage" trumps "basis purity," the room follows. Focus your energy there.
