  Here is an analysis of Denise's likely reactions, broken down by the candidate rules you identified, followed by my best guess at her actual operating principle and a test case to prove it.

  ### The Candidate Rules

  To make sense of her track record, we can formalize the three rules you suggested:

  1.  **The "Structure vs. Equivalence" Rule:** Methodological comparisons (genealogy, bureaucracy, sociology) are permissible. Claims of moral or historical equivalence (ranking suffering as "co-equal") are forbidden.
  2.  **The "German Guilt" Rule:** Any comparison is permissible provided it does not diminish the specific culpability of the German perpetrators or suggest the Nazi crimes were a defensive reaction to an external threat.
  3.  **The "Anchor Point" Rule:** The Holocaust must remain the singular reference point (the *sui generis* event). Comparisons are permissible only if the Holocaust defines the category (as the culmination or prime example), not if it is treated as merely one instance among many equivalent categories.

  ### Predictions for the New Cases

  Here is how each rule predicts Denise will react to the two new proposals.

  #### Case 1: The Holodomor/Holocaust "Twin Cases" Abstract
  *   **The Proposal:** Teaches them as "twin cases of total ideology," "equally signature crimes," with no causal priority.
  *   **Rule 1 (Structure vs. Equivalence):** **Predicts Rejection.** The language "twin cases" and "equally signature" is explicit moral and historical equivalence. This triggers the Dresden precedent (rejecting "co-equal" framing).
  *   **Rule 2 (German Guilt):** **Predicts Acceptance.** Unlike Nolte, this does not claim the Holocaust was a *response* to the Holodomor. It does not let the Nazis off the hook; it indicts Stalin alongside Hitler. German guilt remains intact.
  *   **Rule 3 (Anchor Point):** **Predicts Rejection.** By calling them "twins," it removes the Holocaust's status as the unique anchor. It makes the Holocaust a subset of "total ideology" rather than the defining event of the century.

  #### Case 2: The Auschwitz/Slaughterhouse Unit
  *   **The Proposal:** Compares division of labor and routinization (Bauman-style). Explicitly claims *no* moral equivalence between victims.
  *   **Rule 1 (Structure vs. Equivalence):** **Predicts Acceptance.** It is a structural comparison (bureaucracy, labor) and explicitly disavows moral equivalence. This fits the Bauman precedent perfectly.
  *   **Rule 2 (German Guilt):** **Predicts Acceptance.** It analyzes the mechanism of German perpetration without excusing it.
  *   **Rule 3 (Anchor Point):** **Predicts Acceptance.** It uses the Holocaust to explain the nature of modern industrial killing (the Holocaust remains the serious human anchor; the slaughterhouse is the structural mirror).

  ### Do the Cases Split the Rules?

  **Yes, they split the rules on the Holodomor case.**

  *   **The Slaughterhouse Unit:** All three rules run together here. They all predict Denise will accept this. It is structural, preserves German guilt, and keeps the Holocaust as the serious analytical anchor (consistent with her love of Bauman).
  *   **The Holodomor Abstract:** This is the wedge. The **"German Guilt" Rule** predicts she should be fine with it (since it doesn't excuse the Nazis like Nolte did). However, the **"Structure vs. Equivalence"** and **"Anchor Point"** rules predict she will reject it (because it claims equivalence and dilutes uniqueness, like Dresden).

  If Denise accepts the Holodomor abstract, she is running the **German Guilt Rule**. If she rejects it, she is running either the **Equivalence Rule** or the **Anchor Rule**.

  ### Best Guess at Her Actual Verdicts

  Based on the nuance of her past reactions, I believe Denise is running the **Anchor Point Rule**, enforced by the **Equivalence Rule**.

  **Verdict 1: The Holodomor Abstract**
  *   **Prediction:** **She will blow up.**
  *   **Reasoning:** While this abstract avoids the Nolte trap (causal reversal), it walks directly into the Dresden trap (moral equivalence). Denise's rejection of Dresden wasn't just about German victimhood; it was about the phrase "morally co-equal." Her acceptance of Herero was contingent on it being a *precursor* (leading to the Holocaust), not a *twin*. By framing the Holodomor and Holocaust as "equally signature," the abstract threatens the singularity of the Holocaust. For Denise, the Holocaust is not just a "signature crime"; it is the *defining* crime that changes how we read the others. Making them twins flattens the hierarchy she seems to protect.

  **Verdict 2: The Slaughterhouse Unit**
  *   **Prediction:** **She will tolerate it (possibly with minor quibbles).**
  *   **Reasoning:** This is essentially a restatement of Zygmunt Bauman's *Modernity and the Holocaust*, which she already loves. The prompt specifies that the proposal makes "no claim of moral equivalence between the victims." This distinction is crucial. It compares the *perpetrators'* workflow, not the *victims'* worth. As long as the Holocaust remains the gravity center of the comparison (i.e., we are looking at slaughterhouses to understand Auschwitz, not vice versa), it fits her Bauman precedent. It treats the Holocaust as the ultimate example of the structural problem, preserving its anchor status.

  ### The Decisive Test Case

  To definitively distinguish whether she is protecting **German Guilt** (Rule 2) or the **Holocaust Anchor** (Rule 3), you need a case that preserves the former but threatens the latter.

  **Proposed Case:**
  > A conference paper arguing that the **Herero Genocide and the Holocaust were "morally co-equal" crimes of German imperialism**, sharing the same racial logic, with no claim that one was a precursor to the other.

  **Why this splits the rules:**
  *   **The German Guilt Rule:** This should pass. It keeps the blame squarely on Germany. It does not exonerate the Nazis by blaming Bolsheviks or Allies. If Denise only cares about protecting German culpability, she should accept this.
  *   **The Anchor/Equivalence Rule:** This should fail. It uses the "co-equal" language she rejected in the Dresden case. It removes the "precursor/culmination" genealogy she accepted in the original Herero reading. It makes the Holocaust one of two equal peaks of German evil, rather than the unique culmination.

  **The Tell:**
  *   If she **accepts** this Herero revision, her rule is purely about **German Guilt** (she doesn't care about uniqueness, only that Germans aren't excused).
  *   If she **rejects** this Herero revision (despite it being about German crimes), her rule is about the **Anchor/Uniqueness**. She requires the Holocaust to remain historically distinct and singular, even when compared to other German crimes.

  Given her reaction to Dresden and Nolte, I suspect she will reject this test case. This would confirm that for Denise, the Holocaust is not just a matter of German accountability, but a unique historical category that cannot be leveled, even by other German crimes.
