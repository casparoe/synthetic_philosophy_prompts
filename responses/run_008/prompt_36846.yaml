prompt: |-
  My cousin was in a car accident last month and is in this weird in-between state the docs call "minimally conscious" — some days he seems to track you with his eyes, some days nothing at all. It's made a family fight out of a philosophy argument. My sister is an ICU nurse and basically a global workspace person: to her, whether he's "in there" is a question of whether enough of his brain is integrated and broadcasting content, so the imaging and the bedside scales either answer it or they don't. My other cousin is a philosophy grad student who keeps going on about phenomenal consciousness — "something it's like" — and says no report-based or behavior-based measure can ever settle THAT question, so the tests are answering a different question than the one we actually care about. They've been going at it for weeks and its getting heated, and the rest of us just want to know whether the disagreement has any practical upshot, like whether he could be suffering on the days the tests say "no response."

  Write the joint statement they should be able to sign after a good-faith adversarial collaboration. I want: the claims both sides can accept (about what the behavioral scales and brain-imaging results do and don't establish, and about what "report" even means for someone who can't report); the precise disagreement, stated in wording each of them would accept as fair to their own side; the cruxes — I suspect one is whether phenomenal consciousness is a further fact over and above access/global broadcasting, and another is what could even in principle count as detecting it — and for each crux, some finding or argument both would agree bears on it, with each person's prediction written down in advance. If part of their dispute turns out to be verbal, say which part and why. Format it as a numbered agreed-claims section followed by a disagreements table. And please don't invent specific studies or papers — describe kinds of evidence, not citations.
