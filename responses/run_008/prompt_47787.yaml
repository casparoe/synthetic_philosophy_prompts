answer: |-
  The smell of the harbor was pitch, salt, and the sweet rot of seaweed. Eamon ran a hand over the cured oak of the hull, feeling the grain like a scar.

  "Five hundred mackerel," Mara said. She stood on the dock, boots planted wide against the sway of the tide. "And fifty cod. That's the swap."

  Eamon didn't look up. "Yesterday you said four hundred."

  "Yesterday my nets were full. Today the sea's empty. I need the boat more, so the price goes up?" She kicked a pebble. "Or does the boat stay the same, and I just have less to give?"

  "The boat is the same wood," Eamon said. "But the need isn't. If you're starving, my hull is worth nothing. You can't eat oak. If you're fishing, it's worth everything. So which is it? What's the true measure?"

  "There has to be a ratio," Mara insisted. "Tios says so. He says a hull is worth so many pairs of boots, and boots are worth so many fish. It's a chain. If we break the link, the whole town starves."

  Tios the cobbler arrived then, carrying a pair of high-top boots stitched with sealskin. He set them on the gunwale. "These will keep your feet dry for five years," he told Mara. "But I need a hull for my brother. So I need to know: are these boots worth ten fish or twenty? Because if I trade boots to Eamon for a hull, I need to know how many fish Eamon will charge me."

  Eamon laughed, a dry, splintering sound. "There's no hidden number, Tios. Look at us. You make boots. I make hulls. Mara catches fish. If I trade a hull to you, I don't want boots. I want fish. But if I trade to Mara, she doesn't have fish yet. She needs the hull to get them. It's a circle that doesn't close."

  "So we agree on a standard," Mara said. "A hull is worth five thousand units of need. A boot is worth ten."

  "Whose need?" Eamon countered. "Kael would pay six hundred fish for this hull because his son is going out tomorrow. You pay five hundred because you can wait a week. The hull doesn't change. The wood doesn't change. Only the want changes. So there is no equal exchange. There's just whatever we stop arguing about."

  "That's not justice," Mara said. "That's just power. If you're stronger, you take more."

  "If I'm smarter, I take what's offered," Eamon said. "But fine. You want equality? You want to measure my work against your catch against his stitching? We need a middle thing. Something that isn't fish, isn't wood, isn't leather."

  Hesta the potter had been sitting on a stack of crates nearby, firing a small kiln. She stood up, wiping clay from her apron. She held out a small, fired disc. It was hard, baked red, stamped with the mark of the harbor guild.

  "Take this," Hesta said.

  "What is it?" Mara asked.

  "Clay," Hesta said. "Baked hard. It won't rot like fish. It won't crack like wood. It doesn't do anything. But if we all agree that one disc buys a loaf of bread, or an hour of mending, then it holds the 'need' for us."

  Eamon picked up the disc. It was warm from the kiln. "So this measures the value of the hull?"

  "No," Hesta said. "It measures the agreement. You give Mara the hull. She gives you fifty discs. You don't need her fish today. You can give the discs to Tios for boots. Tios can give them to me for pots. We don't have to match the need right now. We match it later."

  "But the discs are worthless," Eamon said. "I can't eat them. I can't sail them."

  "They're not for eating," Hesta said. "They're for remembering. They remember that you did work for the town, and the town owes you back. The fish rots. The memory shouldn't."

  Mara looked at the disc, then at the hull. "So if I give you fifty discs, that's fair?"

  "It's what we agreed," Eamon said. He turned the clay token over in his fingers. It was light, insignificant.

  "And tomorrow?" Mara asked. "If the fish are plentiful, does the disc buy more? If the storm comes, does it buy less?"

  "Probably," Hesta said. "But we won't have to argue about boots versus hulls every time. We just argue about the discs."

  Eamon tossed the disc into his pouch. It clinked against a piece of iron. "So we're lying to ourselves," he said. "We're pretending this clay has weight. It doesn't. It's just a promise."

  "It's a promise that holds," Mara said. She climbed into the hull, testing the bench. "That's enough."

  "Is it?" Eamon looked out at the water. The tide was turning. "You think this makes the exchange just? That now my hull is truly equal to fifty discs?"

  "I think it makes the exchange possible," Mara said. "Without it, I starve while you wait for a bootmaker who needs a boat. With it, I sail."

  Eamon nodded slowly. He picked up his adze. "Fine. Fifty discs. But don't tell me it's because the hull is *worth* that. It's worth whatever I can convince you to carry."

  "Take the tokens, Eamon," Hesta said.

  He took them. They were just baked earth, stamped with a symbol. He knew they had no value in themselves. He knew that if the town vanished tomorrow, they were just shards. But when Tios held out his hand for payment on the boots next week, Eamon would hand them over. Not because they were true, but because Tios would accept them.

  Mara cast off the lines. The hull floated, heavy and real. The discs sat in Eamon's pocket, light and imaginary. He watched her row out toward the deep water, where the fish were, and wondered if the clay would still feel warm when he spent it. He suspected it wouldn't. He suspected nothing would change, except the arguing would be quieter.

  "See you at the market," Eamon called after her.

  "Bring the discs," she called back.

  He touched the pouch. He didn't believe in them. But he kept them anyway.
