  **Parfit's Hitchhiker:** You are stranded; a driver predicts if you'll pay upon arrival. If yes, they drive you. You arrive safely. Principle 1 and 3 say **Pay**. Even though the ride is done and your survival is secured, paying maintains the policy that gets you rescued in the first place. Refusing violates the updateless commitment required to be saved in counterfactual scenarios where the prediction matters. You must pay to be the person who gets saved.

  **Transparent Newcomb (51%):** You see the million, but the predictor is only 51% accurate. Principle 2 overrides Principle 3. **Two-box**. The reliability is too low to justify ignoring the visible £1,000 dominance. The visual evidence combined with low accuracy breaks the subjunctive link, making the extra £1,000 a guaranteed gain rather than a risk.

  **Psychological Newcomb:** A scanner reads your brain state *before* you decide, predicting with 99% accuracy. You know the scan is done. Principle 1 says **One-box**. Even though the physical state is fixed, your decision algorithm is logically linked to the scan's output. This tests whether you treat brain states as causal fixed points (two-box) or logical outputs (one-box). If you one-box here but two-box in Transparent, you distinguish between observed and unobserved fixed states, privileging logical dependence over visual certainty.

  ### Where I must bend

  You must bend on **Transparent Newcomb**. One-boxing when you see the money is incompatible with the causal realism you demand in the Smoking Lesion case. In both, the outcome is physically fixed independent of your current action. To smoke is to say "facts fixed by common causes don't change." To one-box transparently is to say "facts fixed by prediction do change." This is inconsistent. I advise you to overturn the Transparent One-boxing verdict. Accept that once the box is open, the game has changed, and two-boxing is rational. This preserves your causal intuitions while keeping the robust one-boxing in opaque cases where the logical link remains unobserved and actionable. It resolves the tension between ignoring correlation and ignoring evidence.
