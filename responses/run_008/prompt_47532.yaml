answer: |-
  It is deeply understandable that you feel trapped in this cycle, for you are facing not only the grief of losing your parents but also the erosion of the legacy they left behind. To answer your first question directly, your lawyer is not right that continuing is the rational course simply because of what has already been spent. That reasoning is a classic example of the sunk cost fallacy, where past expenditures, which are irrecoverable, are allowed to dictate future decisions. The money already paid to the lawyers is gone, and it should not influence whether you spend the next increment of fees. The only rational calculation is whether the cost of the next step is justified by the likely increase in the final outcome. Since the asset itself is shrinking with every bill paid from its account, continuing the fight mathematically guarantees a smaller inheritance for whoever wins, and potentially a net loss for both of you when legal fees are accounted for. Your lawyer’s argument that the next step costs little compared to what was spent before is misleading because the comparison should be between the cost of the next step and the value it preserves, not the value already destroyed.

  There is indeed something structurally wrong with a situation in which individually sensible advice leads to collective ruin, and you have correctly identified the mechanics of a war of attrition. You and your sister are locked in a prisoner’s dilemma where the dominant strategy for each individual, based on the advice received, is to fight, yet the collective outcome of both fighting is the destruction of the prize. The structural flaw is compounded by the incentive structure of the legal profession involved; your lawyers are paid by the hour or by the step, so their financial interest is aligned with the continuation of the dispute rather than its resolution. They are the only parties whose income is guaranteed regardless of whether the marina survives intact. This creates a feedback loop where each side feels compelled to escalate to avoid losing the ground paid for by previous escalations, even as the ground itself disappears beneath them. You are correct to suspect your sister is hearing the same counsel, and relying on her to run out of cash first is a dangerous gamble that risks leaving you both with nothing but debt and resentment.

  When you weigh your cousin’s arrangement and the mediator’s proposal against pressing on, you should recognize that these alternatives are not naive but are instead sophisticated mechanisms designed precisely for this type of deadlock. Your cousin’s suggestion is known in business law as a Texas Shootout clause, and it is widely regarded as one of the fairest ways to dissolve a partnership. It forces the person who names the price to be honest, because if they name it too low, the other sibling will buy them out cheaply, and if they name it too high, the other sibling will sell their share at that inflated price. The coin toss to decide who names the price adds a layer of randomness that neutralizes any strategic advantage, ensuring neither party feels the process was rigged. The mediator’s proposal to flip for the role and average the appraisals is similarly sound, as it splits the difference on valuation and randomizes the control. Both options dissolve the standoff rather than relocate it because they force a final transaction without requiring further litigation or agreement on value. Your lawyer dismissed them likely because they end the billing cycle, not because they are inherently unfair.

  If you conclude that you should get out of this cycle, you can do so without appearing weak by reframing the decision as a strategic move to preserve the asset rather than a surrender of your claim. Weakness implies you are abandoning your position out of fear or fatigue, whereas strength implies you are taking control of the situation to stop the bleeding. You can propose one of the alternative solutions, such as the cousin’s pricing mechanism, as a final offer to save the marina for the family, making it clear that this is the last attempt to resolve things amicably before you consider other options that might be less favorable to her, such as forcing a sale to a third party to recoup costs. By positioning yourself as the one willing to stop the destruction of your parents’ legacy, you seize the moral high ground. You might write to her or tell her through counsel that you are no longer willing to feed the lawyers at the expense of the inheritance, and that you are ready to implement a binding resolution mechanism immediately. This shifts the burden to her; if she refuses, she becomes the one choosing to destroy the asset, not you.

  Ultimately, you must decide what matters more: being right about the valuation or preserving the value itself. The rational choice is to stop the process that is consuming the equity, regardless of who started it or who is at fault. You can walk away from the legal battle without walking away from the asset by demanding a mechanism that forces a buyout without further litigation. If you present this as a business decision to halt the depreciation of the estate, it reads as stewardship rather than weakness. Your parents left you a marina to sustain you, not a battlefield to drain you, and recognizing that the true enemy is the cost of the dispute rather than your sister is the key to unlocking this stalemate. Trust your instinct that the current path is unsustainable, and have the courage to impose a solution that prioritizes the survival of the inheritance over the victory of the argument.
