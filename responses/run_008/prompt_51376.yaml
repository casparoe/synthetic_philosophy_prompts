prompt: |-
  I'm a software engineer with no formal philosophy background, so please answer in American English and don't assume I know the jargon.

  A friend who took a philosophy course in college insists the ontological argument for God's existence was decisively refuted by Kant, and he explains the refutation with the famous money example: a hundred real dollars and a hundred merely imagined dollars have exactly the same description — same amount, same features — so existence can't be part of the description of a thing. Kant's point, as he tells it, is that existence is not a real predicate: it doesn't add anything to a concept, the way adding a field to a data schema tells you what records look like but not whether any records exist. So defining God as the perfect being and listing existence among the perfections is like padding the schema with a zero. My friend uses this to dismiss the whole family of ontological arguments as a category error — not just Anselm's and Descartes' versions, but everything descended from them.

  Here's what bothers me. I've read that Gödel, the logician, had a version built on modal logic, and as far as I can tell it never adds existence to anyone's definition. Instead — and I may be garbling this — it defines a God-like being in terms of positive properties, defines essence in a specific way, treats necessary existence as a genuine property, and then argues that if such a being possibly exists, it necessarily exists in every possible world. As a programmer, that looks like a completely different exploit: rather than asserting an exists field in the schema, it leans on the fact that necessary existence can be a real property of a thing and on how possibility and necessity interact. It's not obvious to me that the hundred-dollars example touches this version at all.

  So please audit the analogy. Lay out what maps onto what — what plays the role of the hundred dollars, the concept of the dollars, the actual money in a wallet, the allegedly added existence — then show where the mapping breaks, especially when the target is Gödel's version rather than Anselm's or Descartes'. Along the way, separate the disanalogies that matter for my friend's conclusion from the ones that don't. Then tell me whether the conclusion he was using the analogy to support — that the ontological argument is dead because existence isn't a predicate — survives once the disanalogies are on the table, or whether the analogy was carrying the conclusion the whole time. If the money picture genuinely can't reach the modal versions, I'd like a plain-language account of what the actual live objections to Gödel's argument are; I've heard its axioms look suspiciously cooked, and I'd like to know whether that reputation is fair.
