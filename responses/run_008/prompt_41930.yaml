answer: |-
  Dear Members of the Fellowship Committee,

  I am writing to propose a one-year research project entitled The Normative Structure of Omissive Causation, which constitutes the core of my third-year dissertation work in metaphysics. While causation by omission is a standard topic in the literature, existing treatments often stall on the problem of proliferation, wherein any absence seems to qualify as a cause of an outcome unless restricted by pragmatic constraints. My project asks a precise metaphysical question that remains open in the current debate: is the normative dependence evident in omission causation an eliminable feature of our conversational context, or is it an ineliminable constituent of the causal relation itself? To put it another way, does distinguishing between agent-relative omissions and agent-neutral absences dissolve the proliferation problem by carving nature at its joints, or does it reveal that causal claims involving omissions are inherently hybrid claims that track responsibility alongside physical dependency? Answering this question requires determining whether a purely descriptive metaphysics of omission is possible or whether the concept is irreducibly normative.

  The significance of this question lies in the inadequacy of current solutions to simply presuppose the answer rather than arguing for it. Contrastivist accounts resolve proliferation by appealing to contextually selected contrast classes, effectively treating the normative element as external to the causal relation. Quasi-causal views deny that omissions are genuine causes, relegating them to a weaker relation that inherits causal power from nearby positive events. Deflationary views treat the selection of causes as a matter of salience governed by conversational norms. While these positions offer technical solutions, they leave the underlying metaphysical status of the normativity unexamined. They assume that the normative filter is either purely pragmatic or entirely absent from the metaphysics, without testing whether the distinction between omissions proper, where an agent was expected to act, and mere absences, where no such expectation exists, tracks a genuine metaphysical difference. If the distinction holds, the proliferation problem dissolves because mere absences are not candidates for causation. If the distinction fails, then the normative component is ineliminable, implying that causation by omission is never a purely causal claim. Existing literature has not rigorously tested this dichotomy because it often conflates the two types of cases under the single label of omission, thereby obscuring the source of the normative pressure.

  Over the course of the fellowship year, I will employ a method of refined conceptual analysis supported by constructed case studies designed to isolate the variables of agency and expectation. During the first three months, I will finalize the literature review and construct a taxonomy of omission cases that systematically vary the presence of an agent, the presence of an obligation, and the physical nature of the absence. This phase involves drafting detailed vignettes that separate the gardener's failure to water from the absence of rain, ensuring that physical outcomes are held constant while normative expectations vary. In the subsequent four months, I will subject these cases to rigorous scrutiny, testing whether intuitions about causation track the physical absence or the normative breach. I will construct counterexamples to the splitting strategy, looking for cases where an agent has no obligation but their failure still feels causal, or where an obligation exists without agency, to see if the distinction collapses. The seventh through ninth months will be dedicated to analyzing the results of this testing phase. If the intuitions cluster cleanly around the omission-absence divide, I will argue for the dissolution strategy. If they remain entangled, I will develop the argument for ineliminable normative dependence. In the final quarter of the year, I will draft the dissertation chapters that articulate this position and defend it against the strongest objections from contrastivist and deflationary perspectives.

  The possible conclusions of this project are binary but carry divergent metaphysical costs. Success looks like a definitive argument for either the viability of the omission-absence split or the necessity of normative dependence. The decision between these outcomes will be driven by the stability of the distinction under pressure. If I can construct a case where an agent has no obligation yet their failure is intuitively causal, the splitting strategy fails. Conversely, if every case of intuitive omissive causation involves some tacit appeal to expectation or capacity, the ineliminability result stands. I must also provide an honest account of what would constitute failure for this project. The project would fail if the constructed cases yield inconsistent intuitions that resist principled explanation, suggesting that the concept of omissive causation is too fragmented for systematic metaphysics. It would also fail if the distinction between omission and absence proves to be merely verbal, collapsing when analyzed in terms of counterfactual dependencies. In such a scenario, the project would still yield a valuable negative result, demonstrating that the proliferation problem cannot be solved by refining the ontology of absences, but it would not provide the positive metaphysical account I currently anticipate.

  Regarding the application of this work to philosophy of law, I propose to flag legal implications as future work rather than integrating them into the fellowship year. While my side interest in law makes the temptation to include cases of medical negligence or failure to rescue strong, I argue that the metaphysical foundation must be settled before legal applications can be meaningfully pursued. If omissive causation is inherently normative, then legal liability tracks metaphysics directly. If it is purely descriptive with pragmatic filters, then legal liability is a separate normative overlay on top of causal facts. Including legal analysis now risks conflating the metaphysical question with the normative question of liability, potentially biasing the case construction toward legally salient examples rather than metaphysically pure ones. By securing the metaphysical account first, I ensure that any subsequent legal theory rests on a stable ontological base. Therefore, the fellowship year will remain strictly focused on the metaphysics, with the philosophy of law serving as the primary avenue for future publication once the core dissertation is complete.

  This project promises to clarify a persistent ambiguity in the metaphysics of causation that has ripple effects for ethics and legal theory. By determining whether normativity is a bug or a feature of omissive causation, I aim to provide a framework that either cleans up the ontology of causes or forces a revision in how we understand the relationship between causation and responsibility. I am confident that the structured methodology outlined above will allow me to adjudicate between these possibilities within the fellowship year, resulting in a dissertation chapter that makes a decisive contribution to the literature. Thank you for your time and consideration of this proposal.

  Sincerely,

  [Your Name]
