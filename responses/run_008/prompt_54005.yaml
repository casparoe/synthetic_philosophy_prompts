answer: |-
  You have put your finger on the central tension of our trade, one that most practitioners prefer to leave in the realm of instinct rather than examination. Your suspicion is correct: the "unwritten constitution" of historical fiction rests on a philosophical contradiction that the Author's Note attempts, and fails, to resolve.

  To answer your questions, we must dissect the epistemology of the genre. Here is an analysis of the view of history your practice presupposes, the coherence of its distinctions, and what an honest alternative might look like.

  ### 1. The Positivist Phantom and the Romantic Interior
  The current convention presupposes a hybrid view of history that is philosophically unstable. regarding **events** (battles, dates, deaths), the genre assumes a **Positivist** stance: there is an objective, recoverable reality, and to alter it is to lie. Regarding **interiority** (thoughts, motives, private dialogue), it assumes a **Romantic/Skeptical** stance: the inner life is unknowable, inaccessible to the historical record, and therefore a vacuum waiting to be filled by imagination.

  This creates the distinction you identified: the "sacred" external fact versus the "profane" internal invention. But as you note, this does not track anything real about the past; it tracks the **density of the archive**. We know when the Battle of Naseby happened because administrative bureaucracy tracks logistics better than psychology tracks introspection. We treat the battle date as "hard" fact not because it is ontologically more real than Cromwell's doubt, but because it is better documented.

  Therefore, the distinction is not between *truth* and *invention*, but between *falsifiable* and *unfalsifiable* claims. The genre's constitution forbids you from making claims that can be easily disproven by a ledger, but encourages you to make claims that cannot be disproven at all.

  ### 2. The Author's Note as Ritual Absolution
  You ask if the Author's Note presupposes a clean border that the genre renders impossible to draw. The answer is yes. The Note functions as a ritualistic boundary marker, akin to a priest declaring transubstantiation. It says: *Here, the magic stops; this is the real world.*

  But the mechanism of the novel is **immersion**, which is designed to dissolve boundaries. When a reader weeps for your invented version of a real person, they are not engaging with history; they are engaging with memory. Cognitive science suggests that human memory is reconstructive, not reproductive. When a reader finishes your novel, their brain does not file "Cromwell's thoughts" under "Fiction" and "Cromwell's battles" under "History." It files them under "Cromwell."

  By the time they reach the Author's Note at the back, the cognitive work is done. The Note is an attempt to retroactively install a firewall in a building that has already burned down. It presupposes that the reader is capable of compartmentalization that the narrative form actively discourages.

  ### 3. Is "Invented Thought" More Revisable?
  You ask if the commitment that invented thought is more revisable than invented fact is coherent. In terms of **historical consequence**, it is not.

  If you move a battle by a month, a historian can correct you in a footnote. The record self-corrects. But if you invent a motive for Cromwell that is psychologically compelling, you alter the *moral understanding* of the past. You change why we think the Civil War happened. You change the lineage of political thought. This is a far deeper revision than a date.

  The position is only coherent if we accept that history is merely a chronology of events rather than a narrative of meaning. But fiction is inherently a narrative of meaning. Therefore, the historical novelist is in the business of assigning meaning to the past. To claim that assigning false meaning (motive) is less egregious than assigning false chronology (dates) is to privilege the *skeleton* of history over the *flesh*. Yet readers live in the flesh.

  ### 4. The Alternative Practice
  You ask what the practice would look like if it presupposed the opposite: if it took the novelist's power to overwrite the reader's sense of the past as the thing to be disclosed.

  If we abandoned the pretense that we are merely "filling gaps" and admitted that we are **competing with history**, the paratextual apparatus of the novel would change radically.

  **A. The End of the "List of Inventions"**
  The current Author's Note is a ledger of debts paid. An honest alternative would be a **Commentary on Interpretation**. Instead of saying *"I invented this conversation,"* it would say *"Historians disagree on Cromwell's motive here; I have chosen the interpretation that serves the theme of divine providence."* This shifts the note from a disclaimer of fact to an argument of historiography. It admits that the novel is taking a side in a historical debate, not just painting in the margins.

  **B. Textual Polyphony**
  If we admit that we are overwriting the past, the text itself could acknowledge the competition. We might see marginalia that cite conflicting sources at the moment of invention. Or, more radically, the narrative could include "ghosts" of the alternative history—moments where the narrator acknowledges, *"The record says X, but the silence suggests Y."* This breaks the immersion, yes, but it preserves the integrity of the reader's historical consciousness. It treats the reader as a collaborator in judgment rather than a victim of seduction.

  **C. "Based on a Struggle with Truth"**
  The marketing phrase "Based on true events" is, as you note, indistinguishable from revisionist non-fiction. An honest label might be **"A Counter-History."** This signals to the reader that the book is not a window into the past, but a monument built *in the present* using materials from the past. It admits that the novel is an act of memory-making, not memory-retrieval.

  **D. The Forward Note**
  Why is the note always at the back? If the distortion is the point, the note should be at the front. It should frame the reading experience: *"As you read this, know that I am shaping your memory of these people. I am asking you to trust my psychology over their letters."* This transforms the contract from one of **deception managed by disclosure** to one of **collaborative speculation.**

  ### Conclusion
  The unwritten constitution of historical fiction relies on a convenient lie: that the outer world is fixed and the inner world is free. This allows the novelist to claim the authority of the historian (for the setting) and the freedom of the poet (for the character).

  But you are right to suspect this is a confusion. The novel does not just describe the past; it colonizes it. The current practice tries to hide the colonization behind a list of inventions at the back of the book. A practice that acknowledged its true power would stop apologizing for what it invented and start arguing for *why* it invented it. It would treat the Author's Note not as a confession of sins, but as a statement of thesis.

  It would admit that for the thousands of readers who will take your Cromwell as the historical one, you are not a storyteller. You are the historian they will remember. And that is a responsibility no list of dates can absolve.
