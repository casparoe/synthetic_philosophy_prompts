          *   *LBJ/Whiz Boys (McNamara, Rusk, Bundy):* This is the crux. LBJ privately doubted ("For all I know, our navy was shooting at whales"). But publicly, he acted certain. Is this a lie? Yes. Is it Arendt's *modern* lie? Maybe not. It looks more like the *traditional* lie (knowing the uncertainty, hiding it) but masked as modern certainty.
          *   *Conclusion on "Who":* There is no single Arendtian "Image-Maker." There is a collective avoidance of the factual truth.

      *   **Mapping the Lie and the Truth:**
          *   *The Truth:* "We don't know what happened on Aug 4." (Held by Herrick, privately by LBJ, eventually by NSA historians).
          *   *The Lie:* "An unprovoked attack occurred."
          *   *The Mechanism:* It wasn't a replacement of reality with a coherent image *initially*. It was the *premature closure* of ambiguity. The "lie" is the assertion of certainty where none existed.

      *   **Secrecy vs. Lying:**
          *   Secrecy: Keeping the DESOTO patrols secret.
          *   Lying: Asserting the Aug 4 attack was definitive while knowing it was contested.
          *   Arendt's boundary: Secrecy hides facts; lying denies them. Tonkin blurs this because the administration denied the *existence of doubt*, not just the facts of the patrols.

      *   **Illumination (Where Arendt Works):**
          *   *Fragility of Factual Truth:* Arendt is right that factual truth (did the boats attack?) is the first casualty.
          *   *Coherence vs. Reality:* The "attack" narrative was cleaner for Congress than "we might be wrong." The political need for coherence drove the acceptance of the falsehood.
          *   *Self-Consuming:* The lie required more lies (hiding the NSA doubts, hiding the South Vietnamese raids) to sustain itself, leading to the credibility gap.

      *   **Strain/Silence (Where Arendt Fails):**
          *   *The Agent:* Arendt presupposes a subject who *makes* the image. Tonkin shows a system where the image *emerges* from desire. No one sat down and said "Let's invent an attack." They said "Let's assume the attack happened so we can do what we need to do."
          *   *Belief:* Arendt says the liar *comes* to believe the lie. In Tonkin, they *needed* to believe it to act. It's motivation, not just cognitive drift.
          *   *Judgment:* Arendt says the liar loses judgment. LBJ didn't lose judgment on *how to use the lie*; he lost contact with reality. But his political judgment (passing the resolution) was terrifyingly effective.

      *   **The Third Category (Distributed Self-Deception):**
          *   Does Arendt need this? Yes. Her model is too binary (Traditional vs. Modern/Image-Making).
          *   Tonkin represents *Bureaucratic Wish-Fulfillment*.
          *   *Amendment or Concession?* It's a concession that her model was built on Totalitarianism (conscious fabrication) and later the Pentagon Papers (McNamara's systems analysis). Tonkin is messier. It suggests the danger isn't just the "Big Liar" but the "Compliant System."
          *   *Impact on Theory:* It weakens the idea that the *liar* is the primary unit of analysis. The *structure* is the liar.

  5.  **Refining the Argument (Self-Correction during drafting):**

