      *(Refining the "Judgment" point)*: Arendt argues the liar loses the ground under his feet. In Tonkin, they lost the ground of *fact*, but built a new ground of *policy*. The war escalated *because* of the lie, not despite it. This challenges Arendt's idea that the lie is self-defeating *immediately*. It was self-defeating *eventually* (1975), but successful *initially* (1964). I need to highlight this temporal gap.

