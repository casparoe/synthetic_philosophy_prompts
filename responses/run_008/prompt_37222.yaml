prompt: |-
  I run hiring at a mid-size company (~200 people), and I've gotten pretty skeptical of our credential screens. We filter on things like CS degrees, take-home projects, referrals from current employees, stints at certain big-name companies -- but I suspect half of these are things candidates can cheaply acquire to *look* good rather than honest signals of what we actually want. I've been reading a bit about signaling theory, including the handicap principle from biology, and the core idea I want to operationalize is roughly: a signal is only trustworthy when it's costly in a way that's *more* costly for the kind of person we don't want than for the kind we do. That, and maybe the point that if the signal is cheap for everyone it just pools everyone together and tells us nothing.

  Please turn that into a procedure my recruiters and I can actually run on any screen we use or are considering hiring for -- a set of questions to ask in order, what counts as a sufficient answer to each, where it stops with a clear "drop this screen," where it says "keep it but reweight it," and where it admits it can't decide and a human has to make a values call about what we're even trying to hire for. It should also flag the failure modes where the cost structure looks right but the signal still misleads -- like when the signal is costly for everyone but costly in the wrong currency (spare time instead of skill), or when lots of other companies copy the same screen and it stops discriminating between anyone.

  Then run the procedure on three of our current screens: requiring a CS degree, an unpaid take-home project that takes candidates maybe six hours, and referrals from current employees. Run it honestly, including on whichever one is my favorite -- I suspect the referrals one, since everyone here loves referrals. And tell me what the procedure can't do, like whether it can tell us at all whether the trait being signaled is worth signaling in the first place.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Hiring lead at a mid-size company (~200 people).
      *   **Problem:** Skeptical of current credential screens (CS degrees, take-homes, referrals, big-name companies). Suspects they are "cheap talk" or easily gamed.
      *   **Core Concept:** Signaling Theory (specifically the Handicap Principle). A signal is trustworthy if it's costly *differentially* (more costly for low-quality candidates than high-quality ones).
      *   **Task:** Create a procedural checklist/framework for evaluating hiring screens based on this theory.
      *   **Application:** Run the procedure on three specific screens: CS Degree, Unpaid 6-hour Take-home, Employee Referrals.
      *   **Constraints:** Be honest (even about the user's favorite, referrals). Identify failure modes (wrong currency, market saturation). Acknowledge limitations (can't determine *value* of the trait, only validity of the signal).
      *   **Tone:** Professional, analytical, actionable, slightly skeptical (matching the user's mindset).

  2.  **Deconstruct Signaling Theory for Hiring:**
      *   *Separating Equilibrium:* High types signal, low types don't.
      *   *Pooling Equilibrium:* Everyone signals (or no one does), signal becomes useless.
      *   *Cost Differential:* $Cost(High Type) < Benefit$, $Cost(Low Type) > Benefit$.
      *   *Fake Signals:* Cheap to fake (e.g., buying a certificate).
      *   *Wrong Currency:* Cost is time/money, not ability/traits.
      *   *Market Dynamics:* If everyone requires a CS degree, it becomes a baseline filter, not a differentiator.

  3.  **Develop the Procedure (The "Signal Audit Framework"):**
      *   Need a step-by-step process.
      *   *Step 1: Define the Trait.* What are we actually trying to measure?
      *   *Step 2: Analyze the Cost.* What does it cost the candidate? (Time, money, opportunity, social capital).
      *   *Step 3: Analyze the Differential.* Is it harder for "bad" candidates to pay this cost than "good" ones?
      *   *Step 4: Check for Inflation/Pooling.* Is everyone doing this now?
      *   *Step 5: Check for Wrong Currency.* Does the cost correlate with job performance or just privilege/endurance?
      *   *Decision Logic:* Drop, Keep/Reweight, or Human Review.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Make it a checklist.* Recruiters need clear questions.
      *   *Add "Stop" conditions.* If the cost is zero, stop. If the differential is zero, stop.
      *   *Add "Warning" flags.* Privilege bias, market saturation.

  5.  **Running the Procedure on the Three Screens:**

      *   **Screen 1: CS Degree.**
          *   *Trait:* Technical foundation, persistence, ability to navigate systems.
          *   *Cost:* High (4 years, tuition).
          *   *Differential:* Moderate. Smart people find it easier, but wealth plays a huge role.
          *   *Pooling:* High. Many bootcamps/self-taught now.
          *   *Verdict:* Keep but reweight. It signals privilege/persistence more than raw coding ability now.
          *   *Failure Mode:* Excludes high-signal self-taught candidates (false negatives).

      *   **Screen 2: Unpaid 6-Hour Take-Home.**
          *   *Trait:* Coding skill, dedication.
          *   *Cost:* 6 hours unpaid labor.
          *   *Differential:* Low/Negative. High-demand candidates (good devs) have high opportunity cost. Low-demand candidates have time.
          *   *Pooling:* Common, but candidates are getting picky.
          *   *Verdict:* Drop or drastically reduce. It selects for unemployed or desperate, not necessarily best.
          *   *Failure Mode:* Wrong currency (time availability vs. skill).

      *   **Screen 3: Employee Referrals.**
          *   *Trait:* Cultural fit, pre-vetted skill, social capital.
          *   *Cost:* Social risk for the referrer.
          *   *Differential:* High. Employees won't risk reputation on a bad hire.
          *   *Pooling:* Low (not everyone knows an employee).
          *   *Verdict:* Keep, but watch for homogeneity.
          *   *Failure Mode:* Homophily (hiring people who look/think like current staff), excluding outsiders.
          *   *Note:* User suspects this is their favorite. Need to be gentle but firm on the bias risk.

  6.  **Addressing the Limitations:**
      *   The framework validates the *signal*, not the *target*.
      *   Example: You can perfectly signal "willingness to work weekends," but do you *want* that?
      *   It doesn't solve for bias inherent in the cost structure (e.g., wealth).

  7.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? Need to make it practical for recruiters.
      *   *Handicap Principle:* Ensure the distinction between "costly" and "differentially costly" is clear.
      *   *Structure:* Use bolding, lists, and clear headings.
      *   *Self-Correction on Referrals:* I need to make sure I don't just say "Referrals are great." The prompt asks to run it *honestly*. Referrals have a strong signal mechanism (social capital), but they fail on *what* is being signaled (often similarity, not just competence). I need to highlight that distinction.

  8.  **Final Polish:**
      *   Add an executive summary.
      *   Ensure the "Decision Matrix" is clear.
      *   Make sure the "What this can't do" section is prominent.

  **(Self-Correction during drafting):** I initially thought about suggesting paid take-homes. That's a solution, but the prompt asks me to *evaluate* the current screen. I should evaluate the *unpaid* aspect specifically as part of the cost structure. The cost is "unpaid labor," which is the variable to analyze.

  **(Refining the Referrals Analysis):** The user suspects referrals are their favorite. I need to validate *why* it works (social collateral) but also hit hard on the "Homophily" failure mode. That's the specific signaling failure where the signal correlates with "like me" rather than "good at job."

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a robust approach to hiring. You are essentially asking for a **Signaling Audit Framework**.

  In economics and biology, a signal is only useful if it creates a *separating equilibrium*—where high-quality candidates signal and low-quality candidates do not, because the cost of signaling is too high for the latter. If the cost is too low, you get a *pooling equilibrium* (everyone does it, signal is noise). If the cost is high but not differential, you get selection bias (you select for wealth or free time, not skill).

  Below is the **Signal Audit Procedure** for your team, followed by the audit of your three specific screens.

  ---

  # Part 1: The Signal Audit Procedure

  **Who runs this:** Hiring Managers + Lead Recruiters.
  **When:** Before launching a new req, or quarterly for existing pipelines.
  **Goal:** Determine if a screening criterion is a valid signal of job performance or just noise/bias.

  ### Phase 1: Define the Target Trait
  *You cannot evaluate a signal if you don't know what it is signaling.*
  1.  **Question:** What specific trait or capability is this screen intended to predict? (e.g., "Ability to write clean code," "Grit," "Cultural fit").
  2.  **Sufficient Answer:** A concrete, observable behavior or outcome relevant to the job.
  3.  **Fail Condition:** Vague answers like "Smart," "Good vibe," or "Quality." **STOP.** You cannot audit a signal for an undefined trait.

  ### Phase 2: Analyze the Cost Structure
  *Signals must be costly. If they are free, they are cheap talk.*
  1.  **Question:** What is the explicit cost to the candidate? (Time, money, social capital, opportunity cost).
  2.  **Question:** Is this cost *differentially* burdensome? Is it significantly harder for a "low-quality" candidate (by your Phase 1 definition) to pay this cost than a "high-quality" one?
  3.  **Sufficient Answer:** "Yes, because a low-skill candidate would need 20 hours to do this, while a high-skill candidate needs 2."
  4.  **Fail Condition:** "The cost is the same for everyone," or "Low-skill candidates can easily fake this." **DROP THIS SCREEN.**

  ### Phase 3: Check the Currency
  *Costs must be paid in the right currency.*
  1.  **Question:** Does paying this cost require the trait from Phase 1? Or does it require something else (wealth, unemployment, connections)?
  2.  **Sufficient Answer:** "To pay this cost, you must possess the skill."
  3.  **Fail Condition:** "To pay this cost, you must have spare time," or "You must have gone to a wealthy school." **REWEIGHT OR DROP.** This signals privilege, not performance.

  ### Phase 4: Market Saturation (Pooling Check)
  *If everyone signals, no one signals.*
  1.  **Question:** What percentage of the total applicant pool (including those who don't apply to us) has this signal?
  2.  **Question:** Are competitors using this exact same screen as a baseline requirement?
  3.  **Sufficient Answer:** "Less than 40% of the viable labor pool has this."
  4.  **Fail Condition:** "This is now an industry standard baseline." **REWEIGHT.** It is no longer a differentiator; it is a hygiene factor.

  ### Phase 5: The Decision Matrix

  | Result | Action |
  | :--- | :--- |
  | **High Differential Cost + Right Currency + Low Saturation** | **KEEP.** This is a strong signal. |
  | **High Differential Cost + Wrong Currency** | **DROP.** You are selecting for privilege/endurance, not skill. |
  | **Low Cost / Easy to Fake** | **DROP.** This is noise. |
  | **High Saturation (Pooling)** | **REWEIGHT.** Treat as a baseline checkbox, not a scoring factor. |
  | **Trait Definition Vague** | **HUMAN CALL.** Leadership must define what "good" looks like before auditing the screen. |

  ---

  # Part 2: Running the Audit on Your Screens

  Here is the honest application of the procedure to your three current screens.

  ### Screen 1: CS Degree Requirement

  *   **Target Trait:** Technical foundation, ability to complete long-term complex tasks.
  *   **Cost Structure:** High (4 years, tuition, opportunity cost of not working).
  *   **Differential Cost:** **Weak.** A low-ability student can often coast through a CS degree with enough privilege/tutoring, while a high-ability autodidact is excluded entirely. The cost is financial/temporal, not purely cognitive.
  *   **Currency:** **Mixed.** Signals persistence and system navigation. Does *not* strictly signal current coding ability (curricula lag industry).
  *   **Saturation:** **High.** Many competent engineers now come from bootcamps or are self-taught. Requiring a degree filters out a significant portion of the high-signal, non-traditional pool.
  *   **Audit Verdict:** **REWEIGHT.**
      *   **Why:** It has become a pooling equilibrium for "people with middle-class stability." It is no longer a strong separator of engineering talent.
      *   **Action:** Make it "Preferred" not "Required." Use it to break ties, not to open doors.

  ### Screen 2: Unpaid 6-Hour Take-Home Project

  *   **Target Trait:** Practical coding ability, problem-solving.
  *   **Cost Structure:** 6 hours of unpaid labor.
  *   **Differential Cost:** **Negative.** This is the critical failure.
      *   *High-Quality Candidate:* High opportunity cost. They are likely employed. 6 hours unpaid is a massive "tax" on their time. They may drop out.
      *   *Low-Quality Candidate:* Lower opportunity cost. They may be unemployed or underemployed. They have the time to grind.
  *   **Currency:** **Wrong.** It signals "available spare time" and "desperation," not just skill. It also signals "willingness to work for free," which is a negative cultural indicator.
  *   **Saturation:** **Medium/High.** Candidates are increasingly resistant to long unpaid tasks.
  *   **Audit Verdict:** **DROP (in current form).**
      *   **Why:** The cost structure creates an adverse selection model. You are filtering *out* confident, employed engineers.
      *   **Action:** Either pay them for the time (turns cost into a benefit signal) or reduce to a 45-minute paired session during interview hours (cost is shared).

  ### Screen 3: Employee Referrals (Your Favorite)

  *   **Target Trait:** Competence + Cultural Fit + Retention likelihood.
  *   **Cost Structure:** **Social Capital.** This is the key. The referrer puts their reputation on the line.
  *   **Differential Cost:** **High.**
      *   *High-Quality Candidate:* An employee is happy to risk reputation on them.
      *   *Low-Quality Candidate:* An employee will *not* refer them, because if the hire fails, the referrer looks bad or loses a bonus.
  *   **Currency:** **Correct.** The cost is social risk, which correlates strongly with trust in the candidate's ability.
  *   **Saturation:** **Low.** Not every candidate knows an employee. This remains a separating equilibrium.
  *   **Audit Verdict:** **KEEP, BUT FLAG FOR BIAS.**
      *   **Why:** This is your strongest signal mechanically. The "Handicap" is the employee's internal reputation. It is costly to fake.
      *   **The Failure Mode:** **Homophily.** The signal accurately predicts "Person my employee likes." It does *not* accurately predict "Person who adds cognitive diversity." Employees refer people who look, think, and act like them.
      *   **Action:** Keep the referral bonus, but audit the *conversion rate*. If referral hires perform well but all look the same, you are optimizing for cohesion over innovation. You must pair referrals with structured interviews to ensure the "trait" being signaled is actually skill, not just similarity.

  ---

  # Part 3: What This Procedure Cannot Do

  You asked for honesty about the limitations. This framework is a tool for **validity**, not **ethics** or **strategy**.

  **1. It cannot tell you if the trait is worth signaling.**
  You can have a perfect signal for a useless trait.
  *   *Example:* If you decide you want people who "work weekends," an unpaid take-home project on a Saturday is a *perfect* signal. It is costly, differentially so (parents can't do it, single people can), and separates the pool.
  *   *Limitation:* The Audit will tell you this is a **Valid Signal**. It will not tell you that burning out your staff is a **Bad Strategy**. You must define the Target Trait (Phase 1) wisely.

  **2. It cannot solve for historical inequity in cost.**
  Signaling theory assumes a "free market" of costs. It isn't.
  *   *Example:* A CS Degree is a strong signal of persistence. But the cost of that degree is 10x higher for a first-generation student than a legacy student.
  *   *Limitation:* The Audit might flag this as "Wrong Currency," but it can't quantify the social loss of excluding that group. You have to make a values call on how much signal fidelity you are willing to sacrifice for diversity.

  **3. It cannot predict "Gaming" over time.**
  *   *Example:* Referrals are strong now. But if you pay a $10k bonus, employees may start referring "safe" bets rather than "great" bets to secure the bonus without risking reputation on a high-variance genius.
  *   *Limitation:* Signals degrade. You must re-run this audit every 6–12 months.

  ### Summary Recommendation for Your Team
  1.  **Kill the 6-hour unpaid take-home.** It is selecting for unemployment, not ability.
  2.  **Downgrade the CS Degree.** It is a hygiene factor, not a differentiator.
  3.  **Keep Referrals, but blind the source.** When a referred candidate enters the interview loop, do not tell the interviewers they are a referral until after scoring. This preserves the *sourcing* benefit of referrals without contaminating the *evaluation* with bias.

  This moves you from "collecting credentials" to "buying information."
