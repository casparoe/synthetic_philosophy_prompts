answer: |-
  ### Brainstorm: The Tension Map

  *   **Official Doctrine:** Neoclassical. The organization is a capital allocator. The Gate is a market clearing point. $NPV_{future} > 0$ is the only rule.
  *   **Reality (Completion %):** Behavioral/Political. "80% done" is a proxy for "pain of write-off." It's Loss Aversion weaponized. It's also a coordination signal: "We are all in this together."
  *   **Blame/Accountability:** Retrospective. Focuses on *stewardship* of past capital, not *allocation* of future capital. Creates a conflict: To be a good steward (blame-avoidance), you must continue. To be a good allocator (doctrine), you must kill.
  *   **Dollar Auction:** Escalation of Commitment (Staw). The doctrine is a pre-commitment device. But is it a "fiction"? Or is it the *only* truth, just psychologically inaccessible?
  *   **Agency:** Is the decider a time-slice or a narrative? In theory: time-slice. In practice: a link in a chain of reputation.
  *   **Design Fix:** If it's a policy problem, we need to change the payoff matrix for killing, not just the evaluation criteria.

  ---

  ### The Theory of the Time-Slice vs. The Politics of Continuity

  Let's start with the official doctrine. You asked what theory of practical rationality it presupposes. It is explicitly **Neoclassical Expected Utility Theory applied to a Time-Sliced Agent.**

  In this model, the "Organization" at Gate 3 is treated as a distinct entity from the "Organization" at Gate 1. The decision node is ahistorical. It assumes that capital is fungible and that the only constraint is future opportunity cost. This is the "Rational Economic Organization" view: the firm is a nexus of contracts designed to maximize value, and the gate committee acts as a frictionless market mechanism. It presupposes that the *decision* can be decoupled from the *decider's history*.

  Now, regarding the "completion percentage" argument ("we're 80% done"). You suggest this might presuppose a **narrative view of agency**—that the decider is temporally extended and past choices constitute current value. I would push back on that. I don't think middle managers arguing for completion are acting on a sophisticated philosophical theory of narrative identity.

  They are acting on **Reputation Risk and Loss Aversion.**

  When a manager says, "We can't stop now, we've spent $50M," they are rarely arguing that the $50M has magical future value. They are arguing that *admitting* the $50M is gone triggers a penalty function in their career utility curve. The "80% done" framing is a political technology, not a rival rationality. It converts a cold economic calculation (kill the project) into a moral/social failure (waste the team's effort). It works because the committee members are also temporally extended agents who fear being the ones who "pulled the plug" on a near-finished product. So, it's not that one theory licenses both practices; it's that the **official theory governs capital, while the unofficial practice governs careers.**

  ### The Blame Apparatus: Tension or Feature?

  You asked if the blame practice (punishing write-offs) is in tension with the forward-looking doctrine. **Yes, it is a structural contradiction, but it may be a necessary one.**

  Here is the mechanism:
  1.  **Forward-Looking Decision Rule:** Maximizes *Ex-Post* efficiency (don't throw good money after bad).
  2.  **Backward-Looking Blame Rule:** Maximizes *Ex-Ante* diligence (don't start projects you can't finish).

  If you remove the blame for sunk costs (i.e., if writing off a project is career-neutral), you invite moral hazard. Managers will propose risky, ill-conceived projects because the downside is capped (the project just gets killed later). If you remove the forward-looking rule (i.e., if you let sunk costs dictate continuation), you invite escalation of commitment.

  The system is trying to solve two different principal-agent problems simultaneously. The tension you feel is the friction between **incentivizing careful planning** (blame the waste) and **incentivizing rational stopping** (ignore the waste). Currently, organizations try to do both with the same people at the same time, which creates the cognitive dissonance you observed.

  ### The Dollar Auction Hypothesis

  This is your strongest insight. **The sunk-cost doctrine is indeed a policy-level patch, not just a node-level truth.**

  In the Dollar Auction, the rational move at node $N$ (bid $0.95 to win $1.00) is locally optimal but globally disastrous. The "Sunk Cost Rule" in organizations functions as a **Pre-Commitment Device** (à la Schelling). It is an institutional attempt to bind the future self against the local incentive to escalate.

  By declaring "sunk costs are irrelevant," the organization is trying to install a circuit breaker. It is saying: *"We know that at Gate 4, the pressure to finish will be irrational. So we mandate a fiction at Gate 4 that pretends Gate 1-3 never happened."*

  So, is it a "useful fiction"? **It is a useful *heuristic*, but a dangerous *fiction*.** It is mathematically true (sunk costs *are* irrelevant to NPV), but psychologically false (sunk costs *are* relevant to organizational momentum and morale). Treating it as a fiction implies we know it's false but say it anyway. I'd argue we should treat it as a **Counter-Bias Protocol.** It's not that the money doesn't matter; it's that our brains weigh it too heavily, so we must artificially zero it out to find equilibrium.

  ### Design Implications: If We Take the Dollar Auction Seriously

  If we accept that the gate is a trap for escalation, simply repeating "ignore sunk costs" won't work, because the social pressure (the "80% done" argument) overrides the doctrinal rule.

  If we designed for the Dollar Auction dynamic, we would need to change the payoff structure, not just the evaluation criteria:

  1.  **Decouple the Kill Decision from the Blame Assignment:** The committee that decides to kill a project should not be the same body that assigns performance reviews for the project manager. Or, better: **Reward the Kill.** If a project is killed at Gate 3 because the PM identified a show-stopper early, that PM should be bonus-eligible. Currently, killing a project is often career suicide.
  2.  **Evaluate the Policy, Not the Project:** Instead of asking "Is this project viable now?", ask "If we were a new company today, would we enter this market?" This forces the policy-level view.
  3.  **The "Kill Fee":** Budget for write-offs. If every division has a "failure budget" they are *expected* to use, the stigma of the write-off decreases. The Dollar Auction works because bidders fear losing their bid more than spending it. If the bid is expensed as part of R&D overhead, the trap loosens.

  ### Where My Reasoning Might Fail (The Failure Mode)

  You asked me to be specific about where this analysis could break down. Here is the vulnerability in my argument:

  **The "Real Options" Counter-Argument.**
  My analysis assumes that "80% complete" is mostly political signaling or sunk-cost fallacy. I may be underestimating the **informational value of sunk costs.**

  In complex infrastructure or R&D, money spent is often a proxy for **uncertainty reduction.** If we have spent $50M and are "80% done," that $50M bought us engineering data, regulatory approvals, and supplier contracts that a "new" project would not have.
  *   **The Flaw in the Doctrine:** The official doctrine says "ignore money spent." But in reality, money spent often correlates with *barriers to entry created* or *technical risk retired.*
  *   **The Verdict Changer:** If the "80% done" argument is actually a shorthand for "We have retired 80% of the technical risk," then the sunk-cost rule is not just psychologically hard, it's **economically blind.** A strict "ignore sunk costs" rule might lead an organization to kill a project that has actually become *more* valuable precisely because of the investment made (due to learning curves or network effects).

  **What would change my verdict?**
  If you showed me data where projects killed at late stages (due to strict sunk-cost adherence) consistently had higher *ex-post* value than those continued, I would stand by the "Dollar Auction/Pre-commitment" view.

  However, if you showed me that projects killed at late stages often failed because the committee ignored the **switching costs** and **re-acquisition costs** hidden in the "sunk" spend, I would have to concede that the "Completion Percentage" argument is not just political cover, but a rough heuristic for **Real Options Value.** In that case, the official doctrine isn't a policy patch against bias; it's an oversimplification of asset valuation that ignores the *option value* embedded in the partial completion.

  **Final thought:** The doctrine fails not because it's a fiction, but because it treats capital as the only sunk cost. Time, political capital, and organizational learning are also sunk, and unlike dollars, they *do* create future value. Ignoring them is where the "rational" doctrine becomes irrational.
