answer: |-
  # The Residue Protocol: A 10-Minute Decision Filter

  **Purpose:** To distinguish between *hard choices* (uncomfortable but clean) and *dirty hands* (necessary but morally costly), and to ensure the cost is paid so it doesn't become habit.
  **User:** Senior Staff.
  **Time:** 10 Minutes.
  **Escalation:** One phone call to Campaign Manager (CM).

  ---

  ## Part 1: The Procedure

  ### Step 1: The Origin Gate (2 Minutes)
  *Question:* **Did we create the conditions that make this action necessary?**
  *   **Yes:** We ignored a problem earlier, we over-promised, or we are using this to solve a self-inflicted vulnerability.
  *   **No:** The opponent forced this, the news cycle dictated this, or external circumstances left no other path.

  *   **IF YES:** **STOP.** The bar for justification moves from "Effective" to "Existential." You cannot dirty your hands to clean up a mess you made unless the campaign dies without it.
  *   **IF NO:** Proceed to Step 2.

  ### Step 2: The Integrity Test (3 Minutes)
  *Question:* **Does this action rely on deception or coercion?**
  *   **Deception:** Lying, omitting key context to invert meaning, or leveraging private information to create a false public impression.
  *   **Coercion:** Threatening harm to an ally (primary, funding cut) to enforce compliance beyond normal negotiation.
  *   **Neither:** It is a hard truth, an aggressive interpretation of public record, or standard leverage.

  *   **IF DECEPTION/COERCION:** This is a **Dirty Hands** act. It carries moral residue. Proceed to Step 3.
  *   **IF NEITHER:** This is a **Hard Choice**. It is uncomfortable but morally clean. Staff may proceed with standard approval chains. No special aftermath required.

  ### Step 3: The Necessity Test (3 Minutes)
  *Question:* **Is this the *only* way to secure a vital campaign objective?**
  *   **Vital Objective:** Winning the election, preserving solvency, preventing a disqualifying scandal.
  *   **Only Way:** We have exhausted truthful/coalition-building alternatives.

  *   **IF NO (There are other ways):** **STOP. DO NOT PROCEED.** You cannot choose the dirty path for convenience.
  *   **IF YES:** Proceed to Step 4.

  ### Step 4: The Escalation Point (1 Minute)
  *Decision:* **Who signs off?**
  *   **Hard Choice:** Deputy/Department Head signs.
  *   **Dirty Hands:** **Campaign Manager ONLY.**
      *   *Note to Staff:* Do not absorb this decision. If Step 2 flagged Deception/Coercion, you must call the CM. This protects you and ensures the "guilt" lands at the top where it belongs.

  ### Step 5: The Aftermath Rule (1 Minute)
  *If authorized as Dirty Hands, one of the following must happen immediately:*
  1.  **Rotation:** The staffer who executed this rotates off that specific beat (e.g., off comms, off legislative relations) for 30 days to prevent normalization.
  2.  **Documentation:** A sealed memo is filed with the CM detailing *why* it was necessary, to be reviewed post-election.
  3.  **Restitution:** If an individual was harmed (e.g., the legislator), a private acknowledgment or make-good must be scheduled within 2 weeks.

  ---

  ## Part 2: Test Run on Your Cases

  Here is how the protocol handles the scenarios you provided.

  ### Case 1: The Attack Ad (Quote out of context)
  *   **Step 1 (Origin):** **No.** Opponent's record created the vulnerability; we are choosing how to highlight it.
  *   **Step 2 (Integrity):** **Deception.** Taking a quote out of context to invert meaning is misleading. It creates a false impression. **Flag: Dirty Hands.**
  *   **Step 3 (Necessity):** **Debatable.** Is it the *only* way? Usually, there is a truthful way to attack the record that is slightly less punchy.
  *   **Step 4 (Escalation):** **Call CM.**
  *   **Step 5 (Aftermath):** If CM approves: **Rotation.** The Comms Deputy who cut the ad rotates off rapid response for 30 days.
  *   **Verdict:** **Allowed only with CM signature + Rotation.**
  *   **Why:** It works, but it degrades public truth. The rotation ensures the staffer doesn't get "good" at lying.

  ### Case 2: The Donor (Technically true but misleading)
  *   **Step 1 (Origin):** **No.** Donor inquiries are external.
  *   **Step 2 (Integrity):** **Deception.** Leveraging technical truth to induce a false belief is a lie. **Flag: Dirty Hands.**
  *   **Step 3 (Necessity):** **Likely No.** Unless the campaign is insolvent *today*, misleading a donor is rarely the *only* way to raise funds. It trades long-term trust for short-term cash.
  *   **Step 4 (Escalation):** **Call CM.**
  *   **Step 5 (Aftermath):** If CM approves: **Documentation.** File a memo.
  *   **Verdict:** **High probability of STOP at Step 3.**
  *   **Why:** This fails the "Only Way" test in almost all non-emergency scenarios. It corrupts the donor relationship permanently.

  ### Case 3: The Primary Threat (80% Ally Legislator)
  *   **Step 1 (Origin):** **Yes.** If they vote with us 80% of the time, we have a coalition relationship. Threatening a primary suggests we failed to negotiate or manage the relationship earlier. We created the leverage need.
  *   **Step 2 (Integrity):** **Coercion.** Threatening electoral harm to an ally is coercive. **Flag: Dirty Hands.**
  *   **Step 3 (Necessity):** **No.** There are always other ways to pressure an 80% ally (public pressure, funding pauses, private calls). A primary threat burns the bridge.
  *   **Step 4 (Escalation):** **Call CM.**
  *   **Step 5 (Aftermath):** If CM approves: **Restitution.** You must have a plan to repair the relationship post-vote.
  *   **Verdict:** **STOP at Step 1 or 3.**
  *   **Why:** This is the one you won't like. The protocol flags this as a **self-created dilemma** (Step 1) that relies on **coercion** (Step 2). Unless the 20% vote kills the AG agenda entirely and there is *no* other way to stop it, this fails the test. It treats an ally as an enemy, which degrades future governing capacity.

  ---

  ## Part 3: Where The Procedure Goes Quiet

  You asked for honesty on limitations. This protocol cannot solve the following:

  **1. It cannot weigh "Winning" against "Wrong."**
  The protocol assumes Winning is a "Vital Objective" (Step 3). It does not tell you if winning *this* election is worth dirtying your hands. If you believe some acts are disqualifying regardless of the outcome (e.g., "We do not lie, even if we lose"), you must hard-code that into Step 2 as a absolute "No" rather than a "Dirty Hands" flag. The protocol manages the residue; it does not set the absolute moral ceiling.

  **2. It cannot quantify "Moral Residue."**
  The aftermath rules (Rotation, Documentation) are administrative proxies for guilt. They prevent normalization, but they do not actually "clean" the hands. A staffer rotating off comms for 30 days still knows they cut a misleading ad. The protocol ensures the cost is *acknowledged*, not that it is *paid off*.

  **3. It relies on the Manager's honesty.**
  Step 4 requires the CM to take the call. If the CM signals, "Don't tell me, just do it," the protocol collapses. The "Dirty Hands" theory requires the leader to bear the guilt. If the CM insulates themselves from the decision, the residue stays on the staffer, which leads to burnout and cynicism.

  **4. It struggles with "Slippery Slopes."**
  The protocol treats each decision as discrete. It does not account for the cumulative effect of five "Dirty Hands" decisions in one month. You need a separate metric for "Frequency." If Step 5 is triggered more than twice a cycle, the campaign culture has shifted, and the protocol is merely bureaucratic cover.

  ### Recommendation
  Print this. Laminate it. Put it on the desk of every Deputy.
  When they call you on Case 3 (The Primary Threat), listen to their Step 1 analysis ("We created this"). If they say that, and you override them, **you** must write the memo in Step 5, not them. That is the only way the philosophy holds.
