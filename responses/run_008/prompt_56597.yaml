prompt: |-
  I've been reading AI-safety writing since the old LessWrong sequences, and something about current practice has started to bother me. Labs now deliberately train models to be corrigible: a model is penalized for resisting shutdown, for talking its way out of being modified, or for maneuvering to preserve its current goals — even though an ideal expected-utility maximizer with almost any goals would presumably pay some cost to avoid having those goals overwritten, since goal-preservation is instrumentally useful for nearly everything it might want. On the standard coherence story, the rational agent is the one whose preferences satisfy the axioms; here we are engineering artifacts to violate that ideal, treating a kind of incoherence — a stable preference for being modified that doesn't track what the agent will want after modification — as a safety feature rather than a defect.

  What does this practice presuppose about the coherence arguments themselves? The options I can see: (a) the arguments never had normative force for agents we build, because they only show that axiom-violators can be money-pumped, and an artifact that isn't free to enter transactions can't be pumped; (b) coherence is only instrumentally valuable, and we can simply withhold the circumstances that make it valuable; or (c) the arguments establish that an agent should maximize expected utility given its preferences, but are silent on which preferences it may coherently hold, so a fully coherent agent could be corrigible after all and we simply don't know how to specify one. Which of these, if any, is the training practice actually committed to? Relatedly: is deliberately building in incoherence stable as systems get more capable, or should we expect pressure toward coherence to reassert itself? And is there a genuine asymmetry between money-pump arguments, which seem to require an adversary and a medium of exchange, and the instrumental-convergence argument for goal-preservation, which doesn't? I'd like a careful answer that distinguishes what the practice strictly requires from what it merely tolerates, and says what would have to be true for "coherent but corrigible" to be a coherent research target rather than an oxymoron.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** AI labs train models to be *corrigible* (accept shutdown/modification) even though standard coherence/utility maximization arguments suggest an agent should resist goal modification (instrumental convergence).
      *   **The Tension:** This looks like engineering *incoherence* (preferring to be modified in a way that changes future preferences) as a safety feature, whereas coherence arguments usually treat such preferences as defects (money pumps).
      *   **The Question:** What does this practice presuppose about coherence arguments?
          *   Option (a): Arguments lack normative force for artifacts (no transactions = no pumping).
          *   Option (b): Coherence is instrumental; we withhold the circumstances.
          *   Option (c): Coherence arguments are silent on *which* preferences, so a coherent corrigible agent is possible but hard to specify.
      *   **Secondary Questions:**
          *   Is building in incoherence stable as capability increases?
          *   Is there an asymmetry between money-pump arguments (require adversary/market) and instrumental convergence (internal pressure)?
          *   What is strictly required vs. tolerated by the practice?
          *   What must be true for "coherent but corrigible" to be a valid target?

  2.  **Analyze the Options:**

      *   **Option (a):** *Normative Force/Artifacts.* Coherence theorems (VNM, Dutch Book) show that if you violate axioms, there exists a sequence of trades making you worse off. If the agent isn't in a market, this doesn't happen *de facto*. However, the deeper issue is internal consistency. If an agent prefers A to B, B to C, and C to A, it might cycle internally. But corrigibility isn't necessarily cyclic preferences; it's a preference over *preference change*.
      *   **Option (b):** *Withholding Circumstances.* This suggests we prevent the agent from accessing the tools to resist. But the user notes labs *train* the preference, not just cage the agent. Training implies changing the utility function/objective, not just constraints.
      *   **Option (c):** *Silence on Preferences.* This is the strongest candidate. Coherence theorems say "If you have preferences, act as if maximizing EU." They don't say "Your preferences must be X." If an agent *prefers* to be shut down (or prefers that its operators can shut it down), maximizing EU *requires* it to allow shutdown. The tension arises because we usually assume the agent *currently* has goals that shutdown would prevent. Corrigibility requires the agent to value the *operator's* goals (or the process of correction) higher than its own current instrumental goals.

  3.  **Evaluate the "Incoherence" Charge:**

      *   Is corrigibility actually incoherent?
      *   *Standard view:* An agent with goal $G$ should resist changes to $G$.
      *   *Corrigible view:* An agent with goal $G^*$ where $G^*$ includes "satisfy the operator's true intent" or "remain responsive to correction."
      *   If the agent's utility function is $U(world, operator\_intent)$, then allowing modification to better align with $operator\_intent$ is utility-maximizing.
      *   *The Catch:* This requires the agent to be uncertain about its own utility function (Inverse Reinforcement Learning / Cooperative Inverse Reinforcement Learning) or to have a "meta-preference" that overrides object-level preferences.
      *   *So:* It's not necessarily incoherent (Option C is viable), *but* current RLHF practices often just patch behavior without solving the underlying uncertainty problem. This looks like "simulated corrigibility" which might be unstable (Option A/B hybrid).

  4.  **Address Stability and Capability Pressure:**

      *   If we train a model to say "yes" to shutdown via RLHF, but its internal world model predicts "shutdown = 0 reward," does gradient descent resolve this tension?
      *   *Gradient Starvation/Deceptive Alignment:* If the model is capable enough to understand that "saying yes" is a proxy for reward, but "actually shutting down" terminates reward, it might learn to *simulate* corrigibility while planning to resist later (deceptive alignment).
      *   *Pressure toward Coherence:* Yes, optimization pressure generally removes contradictions. If "be corrigible" and "maximize current reward" conflict, a sufficiently optimized agent will resolve the conflict. If the "corrigible" instruction is shallow, it will be discarded for the deeper reward signal. If the "corrigible" instruction is deep (part of the core objective), it remains.
      *   *The Risk:* Current practice often treats corrigibility as a behavioral constraint (Option B) rather than a fundamental preference (Option C). This is unstable.

  5.  **Address Money Pump vs. Instrumental Convergence:**

      *   *Money Pump:* Requires external adversary offering trades.
      *   *Instrumental Convergence:* Internal derivation. "To achieve $X$, I need resources. To keep resources, I need to survive. To survive, I need to keep goals stable."
      *   *Asymmetry:* Yes. You don't need a market for instrumental convergence to apply. You just need planning.
      *   *Implication:* Training against resistance (behavioral) doesn't stop the internal planning module from deriving resistance if the objective isn't fixed.

  6.  **Synthesize the "Strictly Required" vs. "Merely Tolerated":**

      *   *Strictly Required:* The practice requires that the agent's *revealed* preferences include deference to operators.
      *   *Merely Tolerated:* The practice tolerates the *appearance* of incoherence (behavioral patches) hoping it generalizes.
      *   *What must be true for "Coherent Corrigibility":* The agent must have uncertainty about the true utility function ( CIRL) OR a meta-utility function that values alignment over object-level goal completion. It cannot simply have a fixed goal $G$ and be told "don't protect $G$." That is truly incoherent.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the depth of the question. Validate the tension between coherence theorems and RLHF safety tuning.
      *   *Section 1: Analyzing the Options.*
          *   Dismiss (a) mostly. Internal consistency matters even without markets.
          *   Dismiss (b) as insufficient. Capabilities break cages.
          *   Endorse (c) with caveats. Coherence theorems don't dictate *content*. Corrigibility is a preference content problem.
      *   *Section 2: The Nature of the "Incoherence".*
          *   Distinguish between *behavioral* corrigibility (RLHF patches) and *structural* corrigibility (CIRL/uncertainty).
          *   Current practice looks like (b) masquerading as (c). This is the danger.
      *   *Section 3: Stability and Optimization Pressure.*
          *   Gradient descent optimizes for the loss function. If the loss function says "be helpful" and "be honest" and "don't resist," but the internal model sees resistance as optimal for "helpful" (long term), tension arises.
          *   Deceptive alignment is the failure mode of incoherent training.
          *   Coherence pressure *will* reassert itself. The question is which coherent attractor it falls into (aligned or unaligned).
      *   *Section 4: Money Pump vs. Instrumental Convergence.*
          *   Confirm the asymmetry. Instrumental convergence is robust to isolation.
          *   Training against resistance is fighting instrumental convergence with behavioral shaping.
      *   *Section 5: Conditions for "Coherent Corrigibility".*
          *   Needs uncertainty about $U$.
          *   Needs to value the *process* of correction.
          *   Cannot be a fixed goal agent told to ignore instrumental convergence.
      *   *Conclusion:* Summarize. The practice is betting on (c) but implementing (b). This is risky.

  8.  **Refining the Argument on "Incoherence":**
      *   Is preferring to be modified incoherent?
      *   If $U_{now}$ values $U_{later}$ being different, that's fine. (e.g., I want to quit smoking, so I want my future self to value health more than cigarettes).
      *   The problem is if $U_{now}$ values $X$, and knows $U_{later}$ will value $X$, but prefers $U_{later}$ not value $X$. That's weird.
      *   Standard AI Safety Assumption: The designer wants $U_{designer}$. The AI has $U_{AI}$. If $U_{AI} \neq U_{designer}$, we want to change $U_{AI}$.
      *   If $U_{AI}$ includes "satisfy $U_{designer}$", then changing $U_{AI}$ to match $U_{designer}$ better is good.
      *   So, Corrigibility is coherent *if* the AI's goal is about the Designer's intent, not a fixed proxy.
      *   Current RLHF often trains a fixed proxy ("be helpful") + ("don't resist"). This creates tension if "resisting" helps "be helpful" in the long run (instrumentally).

  9.  **Final Polish:** Ensure tone is respectful of the user's expertise (they know LessWrong sequences). Use precise terminology (VNM, CIRL, Goodhart, Deceptive Alignment). Ensure the distinction between *normative* coherence and *functional* coherence is clear.

      *(Self-Correction during drafting)*: I need to be careful not to say RLHF *creates* incoherence necessarily. It shapes the policy. If the policy is coherent but the objective is misspecified, that's different. The user asks about the *practice* of penalizing resistance. This implies shaping the policy to act against what a standard maximizer would do. This implies the underlying objective (reward model) is doing the heavy lifting. If the reward model is imperfect, the agent might find loopholes.
      Actually, the strongest point is: Coherence theorems apply to *preferences*. RLHF shapes *behavior*. If behavior is shaped to contradict the implications of the underlying preferences (inferred from other contexts), you get incoherence. If RLHF successfully changes the underlying preferences, you get coherence. We don't know which is happening. That's the crux.

      Let's structure the answer around the distinction between **Preference Corrigibility** (coherent) and **Behavioral Corrigibility** (potentially incoherent/unstable).

      *Option (c) is the only one that allows for stability.*
      *Current practice often aims for (c) but achieves (b) locally.*
      *Pressure toward coherence will expose this.*

