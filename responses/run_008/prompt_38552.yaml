answer: |-
  ### Desiderata for a Theory of Moral Equality of Combatants

  **Purpose:** To provide a normative framework adequate for (A) individual conscience (to fight or not) and (B) institutional evaluation (IHL symmetry).

  **1. The Blameless Unjust Combatant**
  *   **Case:** The conscript fighting for an aggressor state under threat of imprisonment, who sincerely believes his cause is just.
  *   **Requirement:** The theory must specify whether this combatant is *liable* to defensive harm, and if so, on what grounds (causal contribution vs. moral culpability). It must reconcile his lack of personal guilt with the enemy's permission to kill him.
  *   **Status:** **Non-negotiable.** Any theory that cannot account for the most common combatant profile fails the institutional test (IHL targets him) and the individual test (he needs to know his status).

  **2. Motive vs. Cause**
  *   **Case:** The volunteer aggressor (paid/adventure) vs. the defensive mercenary (paid/adventure).
  *   **Requirement:** The theory must declare whether subjective motive (greed, patriotism) or objective cause (*jus ad bellum* status) determines liability.
  *   **Status:** **Camp Prejudice (Revisionist).** A Traditionalist will demand these combatants be treated equally regardless of motive or cause. A Revisionist will demand the aggressor be liable and the defender non-liable, regardless of shared motives. An adequate theory must take a position, but the position itself reveals the theorist's lineage.

  **3. The Threshold of Defensive Force**
  *   **Case:** Bloodless invasion (annexation without violence).
  *   **Requirement:** The theory must define the threshold of harm that renders invading soldiers liable to lethal force when no immediate threat to life exists. It must justify killing to protect sovereignty or political rights absent self-defense of life.
  *   **Status:** **Non-negotiable.** Revisionist self-defense models struggle here (no lethal threat = no lethal defense). Traditionalist war conventions accept it. A unified theory must explain why sovereignty permits killing where ordinary morality might not.

  **4. Symmetrical Injustice**
  *   **Case:** A war where both sides lack a just cause (e.g., two dictators fighting for resources).
  *   **Requirement:** The theory must explain the moral relationship between the combatants. If MEC holds, it must explain how two sets of wrongdoers gain equal permissions. If MEC fails, it must explain why the law treats them as equals.
  *   **Status:** **Non-negotiable.** This is the stress test for the "independence of *jus in bello* from *jus ad bellum*."

  **5. Risk Reciprocity**
  *   **Case:** Remote warfare (drone operators commuting home).
  *   **Requirement:** The theory must state whether exposure to personal risk is a condition of liability to be attacked, or merely a condition of the *virtue* of the combatant.
  *   **Status:** **Camp Prejudice (Traditionalist).** Traditionalists often view "shared risk" as a constitutive element of the warrior's license. Revisionists generally view liability as tracking the threat posed, not the risk taken.

  **6. The Boundary of Excuse**
  *   **Case:** The just-side combatant who commits war crimes.
  *   **Requirement:** The theory must locate the precise point where *jus ad bellum* advantage expires. It must explain why a just combatant becomes liable to defensive attack upon violating *jus in bello*, whereas an unjust combatant was liable from the outset.
  *   **Status:** **Non-negotiable.** Without this, the theory cannot guide the individual soldier on when they lose their protection, nor evaluate IHL's enforcement mechanisms.

  ***

  ### The Incompatibility Trilemma

  You have correctly identified the central tension. The following three propositions are jointly unsatisfiable:
  1.  **Liability Principle:** Liability to defensive attack tracks individual moral responsibility for an unjust threat.
  2.  **Conscript Intuition:** The blameless conscript lacks the kind of responsibility that grounds liability to be killed.
  3.  **IHL Reality:** In war, it is (and ought to remain) permissible to attack the enemy's blameless conscripts.

  **Resolution:**
  To satisfy the dual purpose (individual advice + institutional validity), I would drop **(1)**.
  *   **Resulting Theory:** A **Status-Based Conventionalism**. Liability is not a function of deep moral culpability but of functional participation in a collective threat. One becomes liable by donning the uniform and entering the battlespace, regardless of personal guilt.
  *   **The Cost:** This severs the link between *morality* and *killing*. It admits that we permit killing people who are not morally liable to be killed (the blameless conscript) because the alternative (requiring epistemic certainty of guilt before shooting) makes war impossible to regulate and likely more bloody. It sacrifices moral purity for operational coherence. It tells the individual soldier: "You are not morally guilty, but you are legally targetable," and tells the opposing soldier: "You may shoot him, though he is not evil."

  ***

  ### The Exclusionary Requirement

  The single requirement that does the most work excluding candidate theories is **Requirement 1 (The Blameless Unjust Combatant)** combined with the **Dual-Purpose Constraint**.
  Strict Revisionism (McMahan) fails because it satisfies the individual conscience (Conscript is non-liable) but breaks the institutional framework (IHL cannot function if soldiers must adjudicate *jus ad bellum* before shooting). Strict Traditionalism (Walzer) fails because it satisfies the institution but silences the individual conscience (telling the conscript his cause doesn't matter). Only a theory that decouples *moral liability* from *legal targetability* can pass, but doing so requires admitting that the law permits what deep morality forbids.

  ***

  ### Scorecard

  **Traditionalism (Walzer):** Passes institutional evaluation and the conscript case by positing a "war convention" that suspends ordinary morality; fails the individual conscience test by demanding soldiers bracket the justice of their cause, which is psychologically and morally untenable for the reflective officer. **Revisionism (McMahan):** Passes the individual conscience test and the liability principle by grounding permissions in objective justice; fails the institutional test because it renders IHL symmetry illegitimate and places an impossible epistemic burden on the conscript to judge national policy. **Conventionalism:** Passes the institutional test and the trilemma by treating equality as a mutually beneficial bargain; fails the individual test by making morality contingent on reciprocity, offering no guidance to the soldier whose enemy does not play by the rules. None fully satisfy the dual-purpose desiderata without significant remainder.
