      *   *Conclusion 2 (Bad ideas are immortal/resistant):* Does the break matter? Yes. Ideas aren't biological entities. They don't have a immune system. They rely on human cognition. If the cognitive environment changes (e.g., education, technology), ideas can die out rapidly (e.g., belief in phlogiston, flat earth in educated circles). They don't "mutate" intentionally to resist; people modify them.

