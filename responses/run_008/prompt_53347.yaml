answer: |-
  Dear friend, it is completely understandable that you feel the weight of your coworker's argument, because the analogy he is drawing from Richard Dawkins is one of the most seductive intellectual tools developed in the last century. When Dawkins coined the term meme in The Selfish Gene, he was inviting us to see culture through the lens of evolutionary biology, and like any powerful metaphor, it illuminates certain corners of reality while casting others into shadow. To address your request, we need to first lay out the mapping exactly as your coworker is using it, then examine where the structural integrity of that bridge fails, and finally decide if the destination he is pointing toward is still reachable once we acknowledge the cracks.

  In the strict memetic analogy, the gene maps onto the meme, which is the unit of cultural transmission, such as a tune, a catchphrase, or a religious doctrine. The organism or host body maps onto the human mind or brain, which serves as the vehicle for the idea. Reproduction maps onto communication, whether that is speaking, writing, or imitating behavior. Fitness, in the genetic sense, is the ability to survive and reproduce, and in the memetic sense, it translates to transmissibility, meaning how likely an idea is to be passed from one mind to another. Adaptation refers to the mutations an idea undergoes to make it more transmissible, such as becoming simpler or more emotionally resonant. Finally, the antibiotic or environmental pressure maps onto skepticism, criticism, or empirical reality, which acts as a selection pressure meant to weed out unfit ideas. Your coworker is arguing that just as a gene does not care about the health of the organism but only its own replication, a meme does not care about the truth or utility for the host, but only its own spread.

  The first place this mapping becomes loose but perhaps harmless is the mode of transmission. You correctly noted that genes move vertically from parent to child, while ideas move horizontally between peers. In biological evolution, this vertical constraint slows down the spread of traits and ties them closely to reproductive success. In cultural evolution, horizontal transmission allows ideas to spread virally across unrelated individuals instantly. While this is a difference in mechanics, it does not necessarily break the core logic of your coworker's argument about fitness. Whether an idea moves vertically or horizontally, the selection pressure remains on its ability to get copied. So, this difference is largely a matter of speed and network structure rather than a fundamental flaw in the logic that popularity might not equal truth. However, the second difference you noted, regarding fitness, is where the analogy begins to strain significantly. In biology, a gene that kills its host too quickly often fails to propagate unless it can jump to a new host. In memetics, an idea can be truly harmful to the holder, such as a belief that leads to self-sacrifice, and still spread wildly if it convinces the holder to proselytize before they perish. This supports your coworker's suspicion that widespread ideas might be harmful, but it ignores the fact that many ideas spread precisely because they are useful to the host. An idea like washing hands to prevent disease spreads because it works, not just because it is catchy. Therefore, while fitness in memetics is decoupled from truth, it is not entirely decoupled from utility, which is a critical distinction your coworker glosses over.

  The most damaging break in the analogy, however, lies in the nature of the host and the fidelity of copying. Genes are copied with high fidelity, and the organism has no conscious say in the replication of its DNA. Human minds, conversely, are active participants in the replication of ideas. We have agency. We can choose to suppress an idea even if it is catchy because we recognize it as false, or we can choose to spread a boring idea because we recognize it as true. This introduces a selection pressure that does not exist in biology: rational evaluation. While humans are certainly susceptible to emotional hijacking, we are not merely passive vessels for viral codes. We have immune systems of logic and evidence that can and do kill off ideas. This breaks your coworker's second conclusion that bad ideas are nearly impossible to kill. In biology, antibiotic resistance arises because bacteria mutate blindly over generations until a resistant strain survives. Ideas do not mutate blindly; people modify them intentionally. Furthermore, ideas can vanish completely within a single generation if the cultural environment shifts, as seen with the rapid decline of beliefs in divine kingship or phlogiston. They do not have an independent life force that makes them resilient; they rely entirely on human cognition, which is mutable.

  So, does the conclusion that widespread beliefs are suspect survive these disanalogies? It survives, but in a weakened form that requires more nuance than your coworker allows. The memetic analogy correctly warns us that popularity is not a proof of truth, because emotional resonance and simplicity often aid transmission more than complexity and accuracy do. This is a vital skepticism to maintain regarding office wisdom or national myths. However, the analogy fails to account for the fact that truth itself can be a viral trait. True ideas often allow for better prediction and control of the environment, which makes them valuable tools that humans actively choose to share. If the analogy held perfectly, science would never have spread, because scientific truths are often difficult, counterintuitive, and require training to transmit. The fact that germ theory replaced miasma theory suggests that there is a selection pressure for accuracy in certain environments, not just for catchiness. Therefore, widespread beliefs should be suspect on arrival, not because they are necessarily false, but because their popularity is an ambiguous signal that could stem from either utility or manipulation. Your coworker treats the signal as noise, but it is actually a mixture of both.

  Regarding the second conclusion, that bad ideas are immortal and resistant to counterarguments, the breakdown of the analogy is fatal to the claim. Ideas are not organisms; they are more like tools or technologies. A bad tool does not evolve resistance to being discarded; it is simply replaced by a better one when the users realize the difference. The reason some bad ideas persist is not because they have evolved biological armor, but because they are often tied to social identity, power structures, or emotional needs that make people unwilling to discard them. This is a sociological phenomenon, not a biological one. When the social cost of holding the idea drops, or the utility of a new idea rises, the old idea can vanish quite rapidly. The antibiotic analogy suggests a war between the idea and the critic, but in reality, the war is between competing ideas within the mind of the host. Once we recognize that humans are not just petri dishes but judges of evidence, the inevitability of bad ideas surviving dissolves.

  If you are looking for a better comparison for what he is trying to say, I would suggest thinking of ideas as technologies rather than genes. Technologies spread based on utility, cost, and marketing. Some technologies spread because they are genuinely useful, like the wheel, while others spread because of good marketing or network effects, like a specific format of video cassette that was technically inferior but more popular. This preserves the skepticism your coworker wants, acknowledging that popularity does not guarantee quality, but it restores the agency of the user. It acknowledges that we can evaluate the tool and choose a better one, and that bad tools do go extinct when better ones become available or when the cost of using them becomes too high. This framing avoids the determinism of the gene analogy, which implies we are helpless victims of our mental parasites, and instead places the responsibility back on us to evaluate the tools we use to think.

  In summary, your coworker is right to be skeptical of popularity, but wrong to assume that the mechanism of spread precludes truth. The mapping breaks down most critically at the point of human agency and the potential for truth to be a fitness advantage. Widespread beliefs deserve scrutiny, not because they are likely false, but because the reasons for their spread are complex and not solely tied to their accuracy. Bad ideas are not immortal bacteria; they are obsolete tools that persist only as long as we refuse to put them down. You can accept his warning without accepting his fatalism, recognizing that while ideas do compete for space in our heads, we are the ones who ultimately decide which ones get to stay.
