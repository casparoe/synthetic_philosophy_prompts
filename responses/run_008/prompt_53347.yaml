      *   *Environment* -> *Cultural landscape/Social network*.

  3.  **Identify Breaks in the Analogy (Disanalogies):**
      *   *Inheritance:* Genes are vertical (parent to child); Memes are horizontal (peer to peer), oblique (teacher to student), and vertical. This increases speed and complexity.
      *   *Fidelity:* Genetic copying is high fidelity (mostly); Memetic copying is low fidelity (reinterpretation, transformation).
      *   *Agency/Intent:* Genes are blind; Humans have agency, critical thinking, and can choose *not* to spread an idea even if it's catchy. We can evaluate truth.
      *   *Fitness Criteria:* Genetic fitness is about survival/reproduction of the host (usually); Memetic fitness is about spread of the idea, which might harm the host (virulent memes).
      *   *Phenotype:* Genes express via proteins/traits; Memes express via behavior/artifacts.
      *   *Death/Elimination:* Genes die when the lineage dies; Ideas can lie dormant and revive. Ideas can be actively suppressed or forgotten faster than genes mutate.
