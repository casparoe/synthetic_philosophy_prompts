answer: |-
  The principle that best captures your specific cluster of intuitions—preserving the obligation to vote, the wrongness of factory farming, the permissibility of heating, and the supererogatory status of blood donation—is not a form of consequentialism, but a hybrid of **Contractualism** (regarding duties to the system) and **Complicity Theory** (regarding participation in harm), bounded by a **Fair Share Entitlement**.

  I call this **The Principle of Complicit Membership and Fair Entitlement.**

  ### The Principle

  **Clause 1 (Complicity in Harmful Practices):** It is morally wrong to voluntarily participate in a collective practice that produces significant harm, even if one's individual causal contribution is negligible, provided that the practice relies on widespread participation to function and the agent identifies with the collective agency.
  *   *Motivating Case:* **Factory-Farmed Chicken** and **The Forty Mill Owners.**
  *   *Explanation:* You are not being judged on your causal leverage (which is slack), but on your *alignment*. By buying the chicken or dumping the effluent, you make yourself a member of a harmful collective agent. You become complicit in the harm, which is a distinct moral wrong from *causing* the harm.

  **Clause 2 (Duty of Civic Legitimacy):** It is morally obligatory to participate in essential collective decision-making procedures that sustain a just political order, regardless of causal decisiveness, because participation confers legitimacy on the outcome.
  *   *Motivating Case:* **Voting in a Safe District.**
  *   *Explanation:* Voting is not an act of causal leverage (selecting the winner); it is an act of *authorization* (accepting the system). Failing to vote is a failure of civic membership (a duty of justice), whereas the outcome of the election is a separate matter. This distinguishes it from blood donation, which is an act of beneficence, not systemic maintenance.

  **Clause 3 (Fair Share Entitlement):** Agents are permitted to consume resources and emit harms up to the threshold required for a "decent life" within their society, provided the global aggregate does not exceed catastrophic thresholds. Consumption beyond this threshold (luxury) requires strict justification or offsetting.
  *   *Motivating Case:* **Heating the House** vs. **The Guilty Flight.**
  *   *Explanation:* Heating is a requirement for a decent life in a cold climate; you are entitled to your fair share of the carbon budget required for survival/comfort. The birthday flight was luxury consumption exceeding your fair share, hence the guilt.

  **Clause 4 (The Limit of Beneficence):** Acts of pure aid that save lives or prevent harm (beneficence) are supererogatory if they require significant sacrifice or disruption, whereas duties of membership (Clause 1 & 2) are obligatory because they are low-cost structural requirements of living in society.
  *   *Motivating Case:* **Blood Donation.**
  *   *Explanation:* Donating blood is high-impact, but it is a Samaritan act. Voting is low-impact, but it is a Civic act. On this view, maintaining the structure of justice (voting) is more strictly required than maximizing good outcomes (blood), provided the cost of voting is low.

  ***

  ### Verdicts on New Cases

  **1. The Town Referendum (4,000 Voters)**
  *   **Verdict:** **Strongly Obligatory.**
  *   **Reasoning:** This falls under **Clause 2 (Civic Legitimacy)**. In a small town, your vote is causally more likely to matter, but even if it weren't, the duty to legitimize the local polity is stronger because the "collective agent" is more immediate and visible. The "safe district" excuse vanishes when the district is small enough that your voice is audibly part of the chorus.

  **2. Farmers' Market Eggs**
  *   **Verdict:** **Permissible (potentially Praiseworthy).**
  *   **Reasoning:** This tests **Clause 1 (Complicity)** vs. **Causal Impact**. Unlike factory farming, where the chain is "slack," you note the purchase "plausibly keeps the farmer afloat." Here, the causal link is tight. If the farming practice is deemed morally permissible (e.g., humane treatment), then you are not participating in a *harmful* collective practice. You are engaging in a direct economic exchange that sustains a livelihood. Unlike the factory farm, you are not complicit in a system of industrialized suffering; you are supporting a specific agent.

  **3. Carbon-Removal Offset**
  *   **Verdict:** **Morally Restorative (Makes the flight permissible ex-post).**
  *   **Reasoning:** This addresses **Clause 3 (Fair Share Entitlement)**. The flight exceeded your fair share. Purchasing removal effectively returns the borrowed carbon to the budget. It does not erase the *act* of luxury consumption, but it neutralizes the *harm* of the excess emission, satisfying the entitlement constraint.

  **4. The Twenty Planning Letters**
  *   **Verdict:** **Obligatory (if you oppose the development).**
  *   **Reasoning:** This is the positive mirror of the **Mill Owners** case (**Clause 1**). You are part of a joint action (blocking the development). If you benefit from the blockade (e.g., you live there and want it blocked) but refuse to send the letter, you are a "free rider" on the collective effort. Unlike the general voting case, this is a specific joint enterprise with a clear goal. Failing to contribute your share of the effort while accepting the benefit is a violation of fair play.

  ***

  ### The Honest Sacrifice

  There is one verdict of yours this principle cannot save without stretching the definition of "decent life" to the breaking point: **The Trivial Errands.**

  You wrote: *"I extend that excuse [necessity] to surprisingly trivial errands, which suggests my necessity exception is really just an excuse generator."*

  **The Principle's Verdict:** Under **Clause 3 (Fair Share Entitlement)**, trivial errands that generate emissions (driving for non-essentials) are *luxury* consumption, not *decent life* consumption. If your heating is permissible because it is necessary for comfort, a trivial drive is not. If the global carbon budget is tight enough that your heating is barely permissible, your trivial errands are mathematically excluded from your "fair share."

  **Why the Verdict Must Go:**
  You have already identified the inconsistency yourself. Your intuition that these errands are "fine" relies on a hidden assumption that *your* convenience is worth more than the diffuse collective harm. The Principle of Fair Entitlement demands that if you accept the logic that saves your heating (a budget constraint), you must accept the logic that condemns your frivolity.
  *   **Heating:** Necessary for well-being $\rightarrow$ Within Fair Share.
  *   **Trivial Errands:** Not necessary for well-being $\rightarrow$ Outside Fair Share.

  To keep the principle coherent, you must admit that the trivial errands are, in fact, mildly wrong (or at least require offsetting), exactly like the flight. You are currently granting yourself a "frivolity exemption" that you deny to the factory-farm consumer (who is denied the "my vote doesn't matter" exemption).

  **A Secondary Tension (Voting vs. Blood):**
  While the principle saves your Voting > Blood intuition via the Justice vs. Beneficence distinction, be aware that this is the most philosophically contentious part of the view. A strict consequentialist (like your partner) will argue that if Blood saves a life and Voting does not, Blood is obligatory. To maintain your view, you must hold that **duties of membership (not breaking the system/keeping it running) trump duties of rescue.** This is a robust Deontological position, but it is not the *only* rational one. If you ever find yourself in a situation where a single blood donation definitely saves a life and a single vote definitely does not, this principle demands you prioritize the vote *if* the civic duty is framed as essential to justice. That is a hard pill to swallow, and if you cannot swallow it, you must concede that Voting is also supererogatory in safe districts.

  **Summary:** Keep the Complicity and Fair Share logic. It explains 90% of your vibes. But you must surrender the moral immunity of your trivial errands. They are the leak in the hull.
