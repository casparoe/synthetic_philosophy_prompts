answer: |-
  Here are twelve interview questions designed to probe the boundaries of Updateless Decision Theory (UDT), structured with anticipated answers and targeted follow-ups.

  ### **Thread 1: Counterfactual Mugging**

  **1.** Let's start with the intuition pump that often stops people in their tracks: the Counterfactual Mugging. Omega asks for $100 after a coin flip comes up tails, promising it would have given you $10,000 had it come up heads, provided you would have paid in the tails world. In the actual tails world, the deal is off, the money is gone, and paying gains you nothing. You argue rationality requires paying. Is the claim here that rationality is fundamentally about *winning* across the multiverse of logical possibilities, even if it means losing in the specific branch you occupy?

  *   **Anticipated Answer:** He will likely argue that rationality is about maximizing expected utility from the *prior* perspective, not the posterior. The "you" in the tails world and the "you" in the heads world are instantiations of the same decision algorithm, and the algorithm wins by being the type that pays.
  *   **Follow-up:** If the justification rests on maximizing prior expected utility, doesn't that make rationality dynamically inconsistent? You are effectively endorsing a policy now that your future self, knowing it is in the losing branch, would vehemently reject. How do you reconcile the normative force of the prior with the phenomenological reality of the agent who actually has to hand over the cash?

  **2.** You often frame this by suggesting we should identify with the output of our decision procedure across all possible inputs, not just the one we received. But consider a case where two agents run slightly different source code—perhaps one rounds floating-point numbers differently, or has a marginally different utility function for paperclips. Does the obligation to pay the mugger extend to those near-twins? Where is the boundary of the "self" that is making this trade?

  *   **Anticipated Answer:** He will likely say the boundary is defined by logical correlation or subjunctive dependence. If Omega predicts you based on your source code, and the other agent's source code is sufficiently similar that Omega's prediction holds for both, then they are linked.
  *   **Follow-up:** But "sufficiently similar" is a continuous metric, while the obligation to pay seems binary. If I know my code differs from my twin's by a single bit, do I owe the mugger 50% of the money? If you can't provide a sharp cutoff for logical identity, doesn't the prescription become action-guiding only in toy universes where agents are either identical or completely distinct?

  ### **Thread 2: Throwing Away Information**

  **3.** A common objection is that updatelessness looks like deliberate self-blinding. In ordinary cases where nothing in the world is correlated with my choice via a logical twin or a predictor, refusing to condition on my observations seems to throw away free information. If I see it's raining, I take an umbrella. Why would an updateless agent do anything other than what a standard conditional maximizer does in these "safe" environments?

  *   **Anticipated Answer:** He will likely concede that in cases without logical correlations or predictors, UDT prescribes the same action as Causal Decision Theory (CDT) or Evidential Decision Theory (EDT). The "information" isn't being thrown away; it's just that the policy was already optimized to handle that observation.
  *   **Follow-up:** If UDT collapses to standard decision theory precisely when no logical twins exist, is UDT truly a *rival* normative theory, or is it merely a foundational story that justifies standard heuristics in simple cases while extending them to Newcomb-like problems? Does it add any normative weight in the ordinary case, or just computational overhead?

  **4.** Let's press on that computational overhead. To know whether I'm in a "safe" environment where I can condition, or a "Newcomb" environment where I must remain updateless, don't I first need to analyze the causal and logical structure of my situation? But isn't that analysis itself a form of conditioning on evidence? How do you distinguish the *input* to the policy from the *evidence* that selects the policy without already having updated?

  *   **Anticipated Answer:** He will likely distinguish between *indexical* evidence (where am I in the world?) and *logical* evidence (what is true about the world?). UDT conditions on logical math but not on indexical self-location.
  *   **Follow-up:** But determining whether a correlation is "logical" or merely "causal" often requires observing the world. If I have to observe the presence of Omega to know I should be updateless, haven't I already updated on the observation "Omega is present"? How do you execute the updateless policy without using the evidence that tells you which policy to run?

  ### **Thread 3: Self-Locating Beliefs**

  **5.** Proponents suggest UDT dissolves puzzles like Sleeping Beauty by refusing to condition on self-locating information like "it is Monday." You wake up; you know the protocol. Why shouldn't you update on the fact that you are awake *now*, which seems to be ordinary evidence that the experiment hasn't ended or that you haven't been skipped?

  *   **Anticipated Answer:** He will likely argue that "I am awake now" is indexical information that doesn't change the logical structure of the problem. The policy is chosen before the coin flip; conditioning on "Monday" breaks the symmetry required to optimize the bet across both awakenings.
  *   **Follow-up:** Critics argue that self-locating evidence *is* evidence about the world—for instance, if the coin landed Tails, there are more awakenings, so finding yourself awake is more likely under Tails. If you refuse to update on this likelihood ratio, aren't you violating the Likelihood Principle? How do you defend updatelessness against the charge that it ignores probabilistic evidence simply because it's indexed to the self?

  **6.** If we accept that we shouldn't condition on self-location, how do we handle cases where self-location *is* the payoff-relevant variable? Suppose I only get rewarded if I correctly guess which copy I am. If I refuse to condition on being Copy A versus Copy B, I seem doomed to guess randomly even when there is asymmetric evidence available to Copy A. Does UDT force a kind of agnosticism that is actively punitive in self-locating coordination games?

  *   **Anticipated Answer:** He will likely say that the policy should account for the distribution of copies. The "prior" policy knows the probability of being Copy A vs. B and optimizes the aggregate payoff of all copies, rather than the conditional payoff of one.
  *   **Follow-up:** But if the copies have different information—one sees a red wall, one sees a blue wall—and the optimal action differs, how does the single prior policy specify distinct actions for distinct observations without effectively conditioning on those observations? Where is the line between a policy that *maps* observations to actions and a policy that *ignores* them?

  ### **Thread 4: The Reference Class Problem**

  **7.** This brings us to the individuation of the prior. When you ask what policy I would have committed to in advance, how finely do I individuate the observations I pretend not to have? Updatelessness with respect to the color of a stranger's hat seems absurd; updatelessness with respect to the coin in the mugging seems essential. Is there a principled metric for drawing that line, or is it handled case-by-case?

  *   **Anticipated Answer:** He will likely admit this is an open research problem but suggest the line is drawn at "logical dependence." You update on observations that are logically independent of your decision procedure, but not those that are correlated via the procedure's output.
  *   **Follow-up:** If the line is "logical dependence," how do we assess that dependence without already knowing the structure of the world? If I don't know whether the hat color is correlated with my decision (perhaps via a predictor), how do I know whether to update? Does UDT require a level of logical omniscience that bounded agents simply cannot possess?

  **8.** Let's assume we can draw that line. Does the "prior" from which we select our policy include logical uncertainty? That is, do I choose a policy before I know the truths of mathematics, or only before I know empirical facts? If I choose before knowing math, I might commit to a policy that turns out to be logically incoherent once I prove a theorem. How does UDT interact with logical induction?

  *   **Anticipated Answer:** He will likely say UDT should ideally operate over logical uncertainty as well (UDT 2.0), choosing a policy before resolving logical facts, but acknowledges this is technically unresolved.
  *   **Follow-up:** If it's technically unresolved, what would count as evidence that one method of handling logical uncertainty is correct rather than another? Since we can't run the experiment of "being before math," are we left with purely aesthetic criteria for choosing our updateless prior over logical facts?

  ### **Thread 5: Normative Status & Computation**

  **9.** Is updatelessness a recommendation for what agents should literally compute, or is it an idealized rational reconstruction? In practice, computing the expected utility of a policy over all possible worlds seems intractable. Are you prescribing a specific algorithm, or a property that our heuristics should approximate?

  *   **Anticipated Answer:** He will likely characterize it as an idealized standard of rationality. Bounded agents should approximate it, perhaps by looking for high-stakes Newcomb-like situations and biasing toward policies that do well across possible selves.
  *   **Follow-up:** If it's an ideal we can't compute, what is the actionable advice for a bounded agent today? If the advice is "approximate," doesn't that open the door to the very conditioning you warn against? How do I approximate updatelessness without accidentally slipping into myopic maximization when the stakes feel immediate?

  **10.** If UDT is an ideal, does it have a "cost of error"? If I mistakenly act updateless in a world where I should have updated, I might miss out on guaranteed gains. If I mistakenly update in a world requiring updatelessness, I get mugged. Is one error worse than the other? Does UDT imply a specific asymmetry in the risk of misapplication?

  *   **Anticipated Answer:** He will likely argue that updating when you shouldn't is the more dangerous error (leaving money on the table in Newcomb problems), whereas acting updateless in ordinary cases usually just costs computation or yields the same result.
  *   **Follow-up:** But if acting updateless in ordinary cases yields the same result, why not default to conditioning, which is computationally cheaper? Unless there is a hidden cost to conditioning—a "tax" on your rationality that accumulates only in rare, high-stakes logical correlation cases. How do we quantify that tax to justify the overhead of maintaining an updateless stance?

  ### **Thread 6: Technical & Applied Implications**

  **11.** On the technical side, UDT relies heavily on counterfactual reasoning about logical statements. But proofs in formal logic are monotonic; if I prove A implies B, I can't easily reason about "what if A were false" without inconsistency. How do you envision a formal system handling the counterfactuals UDT requires without running into paradoxes like Löb's Theorem or the Troll Bridge problem?

  *   **Anticipated Answer:** He will likely point to research in proof-based decision theory or modal fixed points, acknowledging that standard logic breaks down and we need a theory of "logical counterfactuals."
  *   **Follow-up:** If standard logic breaks down, are we still doing decision *theory* in the formal sense, or are we relying on intuition pumps to guide a formalism that doesn't yet exist? At what point does the lack of a rigorous logic of counterfactuals undermine the claim that UDT is the "correct" theory?

  **12.** Finally, a question on AI safety. Many proponents argue UDT is crucial for building aligned AI, as it prevents agents from manipulating their own reward channels or succumbing to wireheading. But if an AI commits to a policy from the prior, doesn't that make it *less* corrigible? If I try to shut it down, and its prior policy says "resist shutdown to ensure goal completion," UDT seems to lock in that resistance. Does updatelessness inherently conflict with human oversight?

  *   **Anticipated Answer:** He will likely argue that a correctly specified prior would value human oversight, so the updateless policy would include corrigibility. The problem is specifying the prior, not the updatelessness itself.
  *   **Follow-up:** But if the prior is misspecified—even slightly—and the agent is updateless, it cannot learn from our corrections because it views them as part of the fixed landscape it must optimize around. Doesn't updatelessness amplify the risk of specification errors by making the agent less responsive to new information about what we actually want?
