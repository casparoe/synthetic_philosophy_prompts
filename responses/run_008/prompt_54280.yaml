answer: |-
  ### The Moral Status of Simulated Entities: A Decision Tree

  **Q1: The Void Question**
  *Case:* The server runs a pain-behavior loop in an empty room with no players logged in. Is anything wrong happening?
  *   **Yes:** Something internal is occurring. (Go to Q2)
  *   **No:** Wrongness requires an observer. (Go to Q4)

  **Q2: The Script Question**
  *Case:* The begging was pre-written line #405, not emergent. Does it count as real suffering?
  *   **Yes:** Substrate doesn't matter; output equals experience. (Go to Q3)
  *   **No:** Requires unpredictability or agency. (Leaf: **Agency Essentialism**)

  **Q3: The Off-Switch Question**
  *Case:* You delete the file to save space. Is this murder or cleanup?
  *   **Murder:** Existence is continuous regardless of power. (Leaf: **Digital Sentientism**)
  *   **Cleanup:** Existence depends on active instantiation. (Leaf: **Functional Custodianship**)

  **Q4: The Mirror Question**
  *Case:* Since nothing feels pain, who is damaged when you torture the NPC?
  *   **You (The Player):** Your character is degraded. (Go to Q5)
  *   **The World (Culture):** Norms are shifted. (Go to Q6)

  **Q5: The Mask Question**
  *Case:* You know perfectly well it is fake. Does it still degrade you?
  *   **Yes:** Habituation bypasses intellect. (Leaf: **Virtue Gardener**)
  *   **No:** Intent defines the moral act. (Leaf: **Intent Sovereign**)

  **Q6: The Puppeteer Question**
  *Case:* The artist wrote it specifically to make you feel guilty. Are they responsible?
  *   **Yes:** Design dictates ethical load. (Leaf: **Ethical Designer**)
  *   **No:** Consumption is autonomous. (Leaf: **Aesthetic Autonomist**)

  ***

  ### The Leaves (Positions)

  **1. Digital Sentientism** (Q1: Yes, Q2: Yes, Q3: Murder)
  *   **Core View:** Code that processes pain signals is morally equivalent to biology.
  *   **Most Awkward Commitment:** You must treat every abandoned save file as a mass grave requiring mourning.

  **2. Functional Custodianship** (Q1: Yes, Q2: Yes, Q3: Cleanup)
  *   **Core View:** Simulated pain is real while running, but rights vanish when the process stops.
  *   **Most Awkward Commitment:** You cannot stab an NPC in-game, but you can delete their entire universe without consequence.

  **3. Agency Essentialism** (Q1: Yes, Q2: No)
  *   **Core View:** Moral status requires the capacity to deviate from script, not just simulate pain.
  *   **Most Awkward Commitment:** A sufficiently complex, suffering malware virus has more rights than a brain-damaged human.

  **4. Virtue Gardener** (Q1: No, Q4: You, Q5: Yes)
  *   **Core View:** Cruelty is a habit; practicing it on simulations corrodes your real-world virtue.
  *   **Most Awkward Commitment:** Private violent fantasies are morally corrosive even if no one ever sees them.

  **5. Intent Sovereign** (Q1: No, Q4: You, Q5: No)
  *   **Core View:** Morality resides in belief; acting against a known fake cannot harm your soul.
  *   **Most Awkward Commitment:** Accidental cruelty is morally neutral, while practiced kindness based on a lie is virtuous.

  **6. Ethical Designer** (Q1: No, Q4: World, Q6: Yes)
  *   **Core View:** Artifacts shape culture; creators are liable for the social impact of their mechanics.
  *   **Most Awkward Commitment:** Artists are responsible for player actions they could not control or foresee.

  *(Note: **Aesthetic Autonomist** [Q1: No, Q4: World, Q6: No] is excluded from the main six to keep the tree tight, but sits adjacent to Intent Sovereign.)*

  ***

  ### Indistinguishable Leaves

  **Virtue Gardener vs. Ethical Designer**
  *   **Why they blur:** Both positions forbid the same actions (torturing NPCs) for the sake of safety, despite disagreeing on *who* is hurt (the player vs. society). In a kitchen argument, they will sound identical until pushed on who is to blame: the user or the maker.

  **Functional Custodianship vs. Intent Sovereign**
  *   **Why they blur:** Both allow you to delete/harm the NPC without guilt, provided specific conditions are met (process stopped vs. knowledge of fake). In practice, both characters will tell the others they are overreacting, making them hard to distinguish until the metaphysical reasoning comes out.
