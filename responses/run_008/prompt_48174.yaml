      *   *Case 3: 100 Flips, 51% Edge, Constant Fraction $f$.*
          *   KB: $f = 2p - 1 = 0.02$ (2%). Maximizes median wealth.
          *   EUT: Depends on $U$. If $U=\log$, $f=2\%$. If $U$ is linear, $f=100\%$. If $U$ is very concave, $f=0\%$.
          *   Divergence: Mean wealth is maximized at $f=100\%$. Median wealth maximized at Kelly.
      *   *Case 4: Securitization.*
          *   Scenario: Selling shares vs. betting own capital.
