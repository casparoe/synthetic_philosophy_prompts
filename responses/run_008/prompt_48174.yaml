answer: |-
  # JOINT STATEMENT ON RATIONAL BETTING AND DECISION UNDER RISK

  **Signatories:**
  **A.** The Professional Bettor (hereinafter "The Kelly Signatory")
  **B.** The Decision Theorist (hereinafter "The EU Signatory")

  **Date:** October 26, 2023

  **Purpose:** To record points of agreement, map the topology of our disagreements, and identify the empirical or theoretical cruxes that sustain our divergent views on bet sizing and rationality.

  ---

  ## 1. AGREED CLAIMS

  We, the undersigned, affirm the following propositions as mathematically correct and mutually accepted premises for this collaboration:

  1.  **Definition of the Kelly Criterion:** The Kelly criterion specifies the fraction of current wealth that maximizes the expected value of the logarithm of wealth, which is mathematically equivalent to maximizing the long-run geometric growth rate of wealth in a repeated, multiplicative betting environment.
  2.  **Divergence of Averages:** In multiplicative processes involving volatility, the arithmetic mean of outcomes (ensemble average) diverges from the geometric mean (time average). Specifically, the geometric mean is always less than or equal to the arithmetic mean, with equality holding only in the absence of variance.
  3.  **Fate of Over-Betting:** An agent who repeatedly wagers a fixed fraction of wealth exceeding the Kelly fraction on a positive-expectation bet will, with probability approaching 1 as the number of trials increases, achieve a lower terminal wealth than an agent betting the Kelly fraction, and will eventually approach ruin if the fraction is sufficiently high (specifically, if the geometric mean of the gross return falls below 1).
  4.  **Equivalence Condition:** An Expected-Utility (EU) maximizer with a utility function $U(W) = \ln(W)$ will choose the exact same bet sizes as a Kelly criterion maximizer. In this specific instance, the two frameworks yield identical prescriptions.
  5.  **Coherence:** Rational choice requires coherence. An agent should not accept a set of bets that guarantees a loss (Dutch Book), and preferences should satisfy transitivity and continuity.
  6.  **Risk of Ruin:** Both parties agree that strategies leading to certain ruin (wealth $\le 0$) in a finite number of steps are generally undesirable, though we differ on whether this is a hard logical constraint or a function of extreme risk aversion.

  ---

  ## 2. DISAGREEMENTS TABLE

  | Topic | The Kelly Signatory's Formulation | The EU Signatory's Formulation | Classification |
  | :--- | :--- | :--- | :--- |
  | **Normative Foundation** | Rationality in multiplicative environments is **objective**. Because time is non-ergodic (the time average $\neq$ the ensemble average), maximizing arithmetic expectation is mathematically flawed for a persistent agent. The logarithm arises from the structure of compounding, not psychology. | Rationality is **axiomatic**. The von Neumann-Morgenstern axioms define rationality. The shape of the utility function is a subjective parameter reflecting the agent's preferences. There is no "objective" growth rate that overrides an agent's stated risk tolerance. | **Substantive** |
  | **Single vs. Repeated Bets** | The logic of compounding applies even to single decisions. A rational agent should act as if they are part of a long sequence (the "time average" perspective), because today's wealth is the principal for all future bets. | A single bet is evaluated on its own merits. While repeated bets converge to expectations, a single bet's value is determined solely by the expected utility of its specific outcomes. Long-run properties do not dictate single-shot rationality. | **Substantive** |
  | **The Logarithm** | The logarithmic utility function is not merely one preference among many; it is the **unique** function that aligns subjective valuation with the objective reality of geometric growth. | Logarithmic utility is a specific case of constant relative risk aversion (CRRA = 1). An agent with CRRA = 0 (risk neutral) or CRRA = 5 is equally rational, provided their choices are consistent. | **Verbal / Substantive** |
  | **Ruin** | Ruin is a **structural boundary**. Once wealth hits zero, the game ends. This absorbing state makes the expected value of wealth irrelevant if the probability of hitting zero is non-zero. | Ruin is a **preference intensity**. It is modeled by setting $U(0) = -\infty$ (Inada conditions). If an agent does not hold this preference, betting through potential ruin can be rational. | **Verbal** |
  | **Scope of Theory** | Decision theory should incorporate **dynamics**. Static models that ignore the path-dependence of wealth accumulation are incomplete descriptions of rational choice under risk. | Decision theory should incorporate **preferences**. Dynamics are constraints, but the objective function is determined by the agent, not the environment. | **Substantive** |

  **Note on Classification:** We identify the disagreement regarding "Ruin" as primarily **Verbal**. The Kelly Signatory treats ruin as a hard mathematical stop; the EU Signatory treats it as a utility cliff. If the EU Signatory posits $U(0) = -\infty$, the prescriptions converge. The disagreement regarding "Normative Foundation" is **Substantive**: it concerns whether rationality is discovered in the physics of compounding or constructed from axioms of choice.

  ---

  ## 3. CRUXES AND CASE STUDIES

  We have selected four specific cases to isolate the practical and theoretical implications of our disagreement. Below we record our respective positions, predictions, and concessions.

  ### Case A: The 50/40 Coin
  **Scenario:** A coin flip offers a gross return of 1.5 ( +50% wealth) on Heads and 0.6 (−40% wealth) on Tails. The agent must invest their entire current wealth ($f=1$) or nothing ($f=0$).
  **Math:** Arithmetic Mean Return = 1.05 (Positive). Geometric Mean Return = $\sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.95$ (Negative).

  | Signatory | Position & Explanation | Concession |
  | :--- | :--- | :--- |
  | **Kelly** | **Reject the bet.** This example demonstrates that positive arithmetic expectation is insufficient for rational investment in multiplicative systems. Volatility drag ensures that full reinvestment leads to almost certain decay of wealth over time. | I concede that an agent with linear utility ($U=W$) *should* take this bet if they truly do not care about the path or future reinvestment (e.g., a one-off charity donation). |
  | **EU** | **Depends on Utility.** If $U(W) = W$, accept (EV is positive). If $U(W) = \ln(W)$, reject (Expected Log-Utility is negative). The example shows that risk aversion matters, not that arithmetic expectation is "wrong." | I concede that for a professional investor reinvesting profits indefinitely, $\ln(W)$ is a highly plausible utility function, making rejection the likely rational choice in practice. |

  ### Case B: Samuelson's Colleague
  **Scenario:** A colleague refuses a single 50-50 bet (Win \$200 / Lose \$100) but agrees to take 100 such bets.
  **Math:** Single Bet EV = +\$50. Sequence EV = +\$5,000. Variance of sequence is higher, but probability of loss drops significantly.

  | Signatory | Position & Explanation | Defensible? |
  | :--- | :--- | :--- |
  | **Kelly** | **Indefensible (Formally), Understandable (Heuristically).** If the single bet threatens ruin (e.g., bankroll < \$100), rejecting it is rational. If bankroll is sufficient, rejecting one but accepting 100 is inconsistent. The colleague likely intuitively grasps that the *sequence* is ergodic (converges to mean) while the *single shot* is not. | **No**, unless ruin constraints bind on the single bet but not the aggregate. |
  | **EU** | **Indefensible.** As proven by Samuelson (1963), if an agent rejects a single bet at all relevant wealth levels, they must reject the sequence. Accepting the sequence while rejecting the single bet violates the independence axiom and expected utility maximization. | **No.** It is a fallacy of large numbers. |

  ### Case C: Precommitment to 100 Flips
  **Scenario:** 100 coin flips, 51% probability of Heads (even money payoff). Agent must precommit to a constant fraction $f$ of current wealth per flip.
  **Math:** Kelly Fraction $f^* = p - q = 0.51 - 0.49 = 0.02$ (2%).

  | Signatory | Recommended $f$ | Predicted Outcome Distribution | What the Divergence Reveals |
  | :--- | :--- | :--- | :--- |
  | **Kelly** | **$f = 2\%$.** This maximizes the median terminal wealth and the geometric growth rate. | The distribution of terminal wealth is log-normal. The *mean* wealth is higher at higher $f$, but the *median* agent is richest at 2%. | It reveals that "Expected Wealth" is a misleading metric for individual experience. Most paths underperform the mean due to volatility drag. |
  | **EU** | **Depends on $U(W)$.** If $U=\ln(W)$, $f=2\%$. If $U=W$, $f=100\%$. If $U$ is highly concave, $f=0\%$. | At $f=100\%$, the mean is maximized, but the probability of ending with $<\$1$ is near 100%. At $f=2\%$, the probability of loss is minimized. | It reveals that without specifying $U(W)$, there is no unique "rational" fraction. The Kelly fraction is only optimal for a specific risk profile. |

  ### Case D: Securitization
  **Scenario:** The bettor from Case C can instead sell shares in the bets to outside investors. They keep a 10% performance fee but do not risk their own principal on the bet outcomes directly (they risk reputation/capital only if they guarantee losses).
  **Math:** The bettor's wealth process changes from multiplicative betting to additive fee income (mostly).

  | Signatory | Does Rational Fraction Change? | Why? |
  | :--- | :--- | :--- |
  | **Kelly** | **Yes.** The agent is no longer compounding their own bankroll on the bet variance. They are compounding their *fee income*. The constraint shifts from "avoiding ruin of bankroll" to "avoiding ruin of reputation/business." | The dynamics of the wealth process have fundamentally changed from multiplicative to largely additive. Ergodicity considerations apply to the new process, not the old one. |
  | **EU** | **Yes.** The payoff function has changed. The agent now holds a call option on the profits rather than the underlying asset. The expected utility of the fee structure must be calculated directly. | This is not a change in decision theory, but a change in the asset being priced. Rationality requires maximizing EU over the new payoff stream. |

  ---

  ## 4. CONCLUSION ON VERBAL DISPUTES

  We explicitly note that one major source of our historical argument dissolves upon precise formulation:

  **The "Log-Utility" Identity:**
  We agree that if an EU maximizer chooses $U(W) = \ln(W)$, they *are* a Kelly bettor.
  *   **The EU Signatory** maintains this is a contingent preference.
  *   **The Kelly Signatory** maintains this is the only preference consistent with long-term survival in multiplicative markets.

  **Resolution:** We acknowledge that this is a **Substantive** disagreement disguised as a mathematical identity. We agree on the math ($EU_{\log} = \text{Kelly}$); we disagree on the meta-ethics of whether the logarithm is *discovered* (Kelly) or *chosen* (EU).

  **Signed,**

  _________________________
  (The Kelly Signatory)

  _________________________
  (The EU Signatory)
