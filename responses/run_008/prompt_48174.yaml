      *   **Kelly Bettor (KB):** Focuses on time averages, ergodicity, survival, and compounding. Believes maximizing $E[\log(W)]$ is objectively rational for repeated multiplicative processes, not just a preference. Views "ruin" as a hard constraint. Often argues that EU is too flexible or ignores the structure of time.
      *   **Expected Utility Theorist (EUT):** Focuses on axioms of choice (von Neumann-Morgenstern), coherence, and one-off decisions. Believes utility functions reflect risk aversion. Maximizing $E[U(W)]$ is the definition of rationality. Log utility is just one specific case. Rejects the idea that long-run growth *dictates* rationality for single shots or finite horizons without specific utility assumptions.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground. Both agree on the math of compounding. Both agree that betting everything leads to ruin in the 50/40 case. Both agree that EU with Log Utility equals Kelly. Both agree that arithmetic mean $\neq$ geometric mean.
      *   *Drafting points:*
          1.  Definition of Kelly (maximizes geometric growth).
          2.  Fate of over-betting (ruin).
          3.  Arithmetic vs. Geometric divergence.
          4.  Equivalence of Log-Utility EU and Kelly.
          5.  Rationality requires consistency (no Dutch books, etc.).

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to contrast the *justification* and *scope*.
      *   *Disagreement 1: Normative Status.* KB: Kelly is objectively rational for multiplicative dynamics. EUT: Kelly is subjective, dependent on $U(w) = \log(w)$.
      *   *Disagreement 2: Single Bet vs. Repeated.* KB: Even single bets should respect long-run survivability logic (ergodicity). EUT: Single bets are evaluated on their own merits via $E[U]$.
      *   *Disagreement 3: Risk of Ruin.* KB: Ruin is a structural boundary (wealth $\le 0$). EUT: Ruin is just very low utility (Inada conditions), not necessarily a hard logical stop unless $U(0) = -\infty$.
      *   *Substantive vs. Verbal:* The Log-Utility equivalence is verbal/semantic. The "Objective Rationality" claim is substantive.

  5.  **Drafting Section 3: Cruxes:**
      *   *Case 1: +50% / -40% Coin.*
          *   Math: $1.5 \times 0.6 = 0.9$. Geometric mean < 1. Arithmetic mean > 1 ($1.05$).
          *   KB: Shows arithmetic expectation is misleading for compounding agents. Don't bet full wealth.
          *   EUT: Shows that for $U(w)=w$, you bet everything. For $U(w)=\log(w)$, you bet nothing (or fractional). Rationality depends on $U$.
      *   *Case 2: Samuelson's Colleague (1 bet vs 100 bets).*
          *   Scenario: Reject 1 bet ($+200/-100$), Accept 100.
          *   KB: Colleague is irrational/inconsistent. If 100 is good, 1 is good (due to CLT/reduced risk of loss). Or, if risk aversion is high, reject both.
