answer: |-
  **The Scenario**

  Morgan and Riley sit on the same community grant panel, possess identical artistic expertise, and derive no personal gain from the outcome. When reviewing two applications of equal technical merit—one from a county resident, one from outside—both vote to fund the local artist and offer the exact same verbal justification: "Rooted art strengthens our specific social fabric, which is the priority here." Neither holds a factual error about the art's quality or the applicants' histories. The difference lies in their counterfactual commitments: if the Fund's charter were amended tomorrow to prioritize "National Innovation" over "Local Sustenance," Morgan would immediately cease weighting locality, viewing their preference as a tool to execute the charter's ends, whereas Riley would continue weighting locality, viewing the charter as a tool to validate their pre-existing ends.

  **The Analysis**

  1.  **The Scrutiny Test (Reflective Stability):** This asks whether the agent would retain the judgment after honest reflection on its source. Morgan passes a *role-based* scrutiny: upon reflection, they acknowledge their judgment is authorized by the institution's current mandate. Riley fails this specific scrutiny: upon reflection, they must admit their judgment persists *despite* the institution's mandate. Morgan's state is stable because it is integrated with their voluntary role; Riley's is stable because it is insulated from the role.
  2.  **The Sensitivity Test (Causal Tracking):** This asks what variable the judgment tracks in the world. Morgan's judgment tracks the *institutional mission*; if the mission variable changes, the judgment changes. Riley's judgment tracks the *artist attribute* (locality); if the mission variable changes, the judgment remains fixed. Bias is characterized by insensitivity to the normative constraints of the role; preference is characterized by sensitivity to them.
  3.  **The Fiduciary Test (The "Real" Criterion):** This asks whether the agent treats their evaluative power as a delegated trust or a personal platform. Morgan treats the power as delegated: "I weigh locality because *we* decided to." Riley treats the power as personal: "I weigh locality because *I* decide to." Bias is the unauthorized privatization of a public (or collective) evaluative function. Preference is the authorized exercise of discretion within that function.

  **The Diagnosis**

  The single feature doing all the work is **Conditional Subordination to the Institutional Mandate.** Morgan's valuation is *conditional* on the Fund's purpose; Riley's is *unconditional*. If you delete this feature—making both agents either fully responsive to the charter or fully resistant to it—the distinction collapses. If both are responsive, both are exercising legitimate preference. If both are resistant, both are biased.

  Your cynical friend would attack this by claiming Morgan is merely "unprincipled" or a "mercenary" who changes values based on convenience, while Riley is "authentic." She would argue that consistency (Riley) is morally superior to compliance (Morgan). This attack does not land because it conflates *personal integrity* with *fiduciary duty*. In a volunteer board context, the moral obligation is not to be authentically oneself, but to be reliably faithful to the collective mission one volunteered to serve. Riley's authenticity is actually a form of corruption: it substitutes the board's purpose with the panelist's own. The distinction matters because institutions cannot function if members treat the mission as optional; "preference" is the term for discretion that serves the mission, while "bias" is the term for discretion that supersedes it. Your friend's slogan fails because it ignores the *relational* nature of the judgment: it's not just about what you value, but *whose values you are authorized to enact.*
