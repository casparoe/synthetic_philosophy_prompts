      *   *Key Distinction:* BVSR (Blind Variation and Selective Retention) is the mechanism. Falsification is the logical norm. They are isomorphic but not identical. The isomorphism breaks at the level of *critical rationality*.
      *   *Decision:* The analogy is useful for *naturalizing epistemology*, but useless for *demarcating biology*. The supervisor is using it to do the latter, which is wrong.

