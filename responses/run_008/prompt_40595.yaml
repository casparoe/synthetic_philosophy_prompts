  3.  **Evaluate Popper's Actual Position (The "Misreading" Check):**
      *   *Early Popper (1950s-70s):* Called NS a "metaphysical research programme." Worry about tautology ("fittest = those who survive").
      *   *Late Popper (1970s-80s):* Embraced Evolutionary Epistemology (Campbell, Lorenz). "All life is problem solving."
      *   *Crucial Nuance:* Popper *never* retracted the claim that NS *as a scientific theory* is hard to falsify in the strict logical sense. He shifted to saying it's a *metaphysical framework* that generates testable theories. The "Evolution = Falsification" analogy is mostly Campbell's (Blind Variation and Selective Retention - BVSR), which Popper adopted enthusiastically *for epistemology*, not necessarily to save the *logical status* of Darwinism in the *Logic of Scientific Discovery* sense.
