      *   **Voice:** Deadpan corporate/bureaucratic. The writers must *not* know they are in a satire. It must sound like sensible HR/Editorial policy.
      *   **Length:** Roughly 700 words.
      *   **Key Concepts to Operationalize:**
          *   *Leveling:* Abolishing distinction between distinguished/ordinary. No one stands out.
