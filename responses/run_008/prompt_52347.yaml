          *   Melancholy note in the appendix about leveling being a collective effort we are grateful for.
      *   **Constraints:**
          *   Jokes must come from accurate Kierkegaardian diagnosis, not cheap zingers.
          *   Don't strawman Kierkegaard as a luddite; target the *spirit* of the age, not the tech.
