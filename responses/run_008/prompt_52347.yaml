          *   *Passionlessness:* Dressed as balance, reflection, chatter. Passion is unprofessional.
          *   *Responsibility:* Distributed until it evaporates (no individual blame).
          *   *Admiration vs. Action:* Covering doers from a safe distance.
      *   **Specific Inclusions:**
          *   Numbered sections with bureaucratic headings.
          *   Quote from a fictional departing columnist (fired for conviction).
