prompt: |-
  I teach philosophy of math but I spent about a decade as a compiler engineer before academia, so those are the two vocabularies rattling around in my head. Restate the philosophical worry that our basic mathematical axioms (say PA or ZFC) might turn out to be inconsistent -- the stuff around Gödel's second incompleteness theorem, the fact that the system can't certify its own consistency, the explosion principle, paraconsistency as a proposed damage-limiting fallback -- in the vocabulary I still think in: trusted computing base, undefined behavior, the way a C compiler assumes signed overflow never happens and will happily delete your null check on the strength of that assumption, sanitizers, fuzzing a legacy codebase. Be faithful to the philosophers' actual positions -- dont smuggle in engineering assumptions and call them translation. Then give me the residue report: which parts of the worry map cleanly, which come over only distorted, and which have no counterpart at all in how we think about software. And in particular I want your verdict on this comparison: mathematicians trusting PA after a century with no derived contradiction seems to me like trusting a giant legacy codebase with no known exploits but no soundness proof either. Is the philosophers' worry that the axioms are inconsistent just the engineers' worry that the trusted computing base has a bug in it, or is there residue there my vocabulary genuinely can't express? I half suspect it's the second but I can't put my finger on what it would be.
