answer: |-
  ### the mapping

  The analogy aligns political participation with sports spectating through specific structural parallels. The **voter** maps onto the **fan**, positioned as an observer rather than a player. The **candidate** maps onto the **team**, competing for victory. The act of **voting** corresponds to **cheering**, framed primarily as an expressive gesture rather than a causal mechanism. The **election outcome** equals the **final score**, determined by aggregate performance rather than individual vocalization. Finally, the **motivation** for both acts is mapped as **identity affirmation**; you vote/cheer to signal tribal belonging and personal values, not to engineer the result. The proponent relies on the statistical near-zero probability of a decisive vote to cement the link between a single cheer and a single vote: both are causally negligible regarding the outcome, rendering the act symbolic rather than instrumental. Even the risk assessment maps: traveling to the polls resembles traveling to the stadium, both carrying mundane risks (like car accidents) that outweigh the microscopic chance of individual impact. This mapping reduces citizenship to fandom, shifting the locus of value from consequence to expression.

  ### where it breaks

  The analogy fractures where consequences and agency diverge. Superficial nitpicks include the physical exertion of cheering versus the passivity of voting, or the fact that stadiums are private while elections are public. These don't touch the core argument. The critical breaks concern stakes, collective agency, and moral responsibility.

  First, **stakes**: A lost game means disappointment; a lost election can mean war, rights erosion, or economic collapse. Because the stakes involve actual harm to others, not just emotional loss, the "bad taste" conclusion fails. Voting isn't just about you; it's about how power is wielded over non-consenting subjects.

  Second, **collective agency**: While one cheer doesn't change the score, votes are not merely atmospheric; they are the *mechanism* of the score. If all fans stayed home, the game cancels. If all voters stay home, the regime loses legitimacy or collapses. The "decisive vote" metric ignores the *marginal contribution* to a coalition that *does* win. It treats voting as a lottery ticket rather than a brick in a wall.

  Third, **moral responsibility**: Wearing an offensive shirt hurts feelings; voting for a harmful candidate enables policy. The causal chain is diffuse but real. If you hire a hitman through a proxy chain, you aren't less guilty because your individual link was small. Complicity in systemic harm differs from aesthetic preference.

  These breaks dismantle the "no duty" and "no wrong" claims. The self-expression conclusion (3) survives only if you accept the expressive theory of voting, but even then, it ignores the expressive harm of endorsing harmful policies. The analogy fails to capture that voting is a delegation of force, not just a signal of preference. The fan is a consumer; the voter is a partial sovereign. This distinction destroys the claim that voting is morally neutral self-expression. The disanalogies regarding harm and complicity directly undermine conclusions (1) and (2), while the sovereignty distinction undermines (3).

  ### what it smuggles in

  The analogy smuggles in a hyper-individualistic, instrumentalist view of morality. By equating voting with cheering, it assumes an act is only meaningful if it individually alters the outcome. This ignores **complicity ethics**: you can be morally implicated in a group action even if your marginal contribution is invisible. It also presupposes **political atomism**, treating citizens as isolated consumers rather than members of a collective body responsible for shared governance.

  Furthermore, it smuggles in **cynicism about legitimacy**. If voting is just cheering, then government legitimacy isn't derived from consent of the governed, but from mere spectacle. This undermines the democratic contract. Finally, it assumes **expressive purity** is possible. Voting for a lesser evil isn't "dirtying" your vote; it's acknowledging the tragic reality of power. The analogy hides the fact that abstaining is also an expressive act with consequences, often benefiting the worse candidate. It frames inaction as neutral, when in a majoritarian system, inaction is a choice with causal weight. It implicitly argues that moral cleanliness matters more than material outcomes, prioritizing the voter's soul over the citizen's responsibility.

  ### my verdict

  The sports-fan picture fails to keep any of the three conclusions. Conclusion (1) collapses because the duty to vote isn't about impacting the score, but about maintaining the legitimacy of the system that protects rights. If everyone followed this advice, democracy would fail; universalizability kills the argument. Conclusion (2) is dangerous nonsense. Enabling harm through collective action is morally distinct from wearing a t-shirt. Voting for a tyrant isn't "bad taste"; it's complicity in oppression. The stakes disanalogy destroys this completely.

  Conclusion (3) is the most seductive but still fails. While self-expression matters, voting is primarily instrumental stewardship of power. If you prefer a third party but know they can't win, voting for them in a swing state isn't purity; it's negligence. You don't get to prioritize your expressive comfort over the material safety of vulnerable people affected by the winner. The analogy tries to privatize a public act. Voting isn't about who you are; it's about what you do to the world. The fan analogy reduces citizenship to consumerism, and once that mask is ripped off, all three conclusions evaporate. You are not a fan; you are a co-owner. Act like it.
