          *   The "Values Drift" case (not just dementia, but radical moral change).
      *   *Closing:* Encouragement but a warning about the "defeasibility" threshold. If it's too easy to override, ADs become worthless.

  6.  **Refining the Tone:**
      *   Keep it peer-to-peer.
      *   Be direct about weaknesses.
