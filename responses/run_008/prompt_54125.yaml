  *(Self-Correction on 1992)*: Be careful not to overstate the 1992 event. It was an admission of error by the tribunal, not necessarily a full theological vindication of Galileo's hermeneutics as official doctrine, though it leaned that way. I will characterise it as a rehabilitation of Galileo's character and intuition, rather than a doctrinal shift.

  *(Self-Correction on NOMA)*: Make sure to emphasise that for Galileo, the Magisteria *do* overlap on facts about the world, whereas for Gould, they do not. This confirms the user's suspicion.

