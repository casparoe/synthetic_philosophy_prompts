  3.  **Identify the Underlying Philosophical/Psychological Conflict:**
      *   This is the "Orwellian vs. Stalinesque" distinction made famous by Daniel Dennett in *Consciousness Explained*.
      *   *Stalinesque:* The show is edited before it reaches the audience (consciousness). (Cases 1 & 2).
      *   *Orwellian:* The show goes out raw, but the records are rewritten later. (Cases 3 & 5).
      *   *The Problem:* From the inside, they are indistinguishable. Dennett argues the distinction is illusory (Multiple Drafts Model).
      *   *The User's Dilemma:* The user feels these *are* distinct experiences and wants a principle to distinguish them validly without abandoning their intuition.

  4.  **Formulate a Principle:**
      *   If I simply say "Dennett says they are the same," I violate the user's request for a principle that *saves their verdicts*. They want to keep the distinction.
      *   I need a principle that distinguishes based on *functional necessity for action* vs. *narrative coherence*.
      *   *Hypothesis:* Cases 1 & 2 involve *sensorimotor continuity* required for immediate tracking of the physical world. Cases 3 & 5 involve *semantic/narrative coherence* where the raw data was insufficient for meaning.
      *   *Refined Principle:* **The Principle of Functional Immediacy.**
          *   If the continuity is required for *tracking an object or event in real-time space*, the brain constructs the experience *before* it enters conscious report (Stalinesque).
          *   If the continuity is required for *semantic meaning or narrative structure* where real-time tracking is not at risk, the brain constructs the experience *after* the fact (Orwellian).
      *   *Wait, does this hold?*
          *   Phi Phenomenon: Tracking motion. (Immediacy).
