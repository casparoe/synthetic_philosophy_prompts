      *   *Critique:* In Phi phenomenon, the data for the *motion* isn't there until the second flash. So the brain *waits*. This leans toward Orwellian. But the *experience* is Stalinesque.
      *   *Okay, let's go with the "Objecthood" argument.* It's more robust for a novelist.
      *   **The Principle of Ontological Priority.**
      *   Does the continuity create the *thing* perceived, or does it create the *story* about the thing?
      *   Cases 1 & 2: The continuity creates the *object* (the moving dot, the continuous scene). Without the smoothing, the object doesn't exist.
      *   Cases 3 & 5: The object exists (the sound, the dream image), but the *story* (the sentence meaning, the plot duration) is added later.

  7.  **Finalizing the Advice:**
