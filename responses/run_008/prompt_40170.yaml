      *   *Address the Argument (Case 7):* Prediction. If I feel I "saw it coming," is it real? Usually, this is hindsight bias (Case 3/5). Unless the concession was logically inevitable and I tracked the logic in real-time. Most likely: Retrospective.
      *   *Address the "Which Verdict to Drop":* The user asks if they must give one up. If the principle holds, they don't have to. But if forced? Trust the "Constitutive" (1 & 2) over the "Corrective" (3 & 5) regarding *what happened in the moment*. But trust the "Corrective" regarding *what it means*.
      *   *Tone Check:* Ensure I sound like I'm talking to a colleague, not a student. Use their metaphors (Soviet, archive, text).

  6.  **Refining the Principle:**
      *   Let's sharpen the distinction. It's about **Availability of Data**.
