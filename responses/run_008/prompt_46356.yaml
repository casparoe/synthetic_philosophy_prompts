answer: |-
  This is a remarkably honest spot to be in, and frankly, your students would benefit more from you modeling this tension than from you presenting a settled dogma. Your intuitions are actually quite standard for a thoughtful non-specialist, but they pull in three different theoretical directions: **Control** (Tumor/Gun), **Character/History** (Upbringing), and **Outcome** (Drunk Driver).

  Here is an analysis of your pattern, a principle that attempts to unify it, the specific sacrifice required to make it consistent, and the application to your new case.

  ### 1. The Principle: Historical Reasons-Responsiveness with Alienation Constraints

  To capture the majority of your verdicts while maintaining theoretical hygiene, the best fit is a **Historical Reasons-Responsiveness** view (akin to Fischer & Ravizza, modified with a Strawsonian "alienation" clause).

  **The Principle:** *An agent is morally responsible for an action if and only if: (1) the action issues from a mechanism that is moderately reasons-responsive; (2) the agent owns that mechanism (it is not alien to their practical identity); and (3) the agent had a fair opportunity to avoid developing or exercising that mechanism.*

  **How it maps to your verdicts:**
  *   **Brain Tumor (Not Responsible):** Fails Clause 1. The mechanism (violent impulse from pathology) is not reasons-responsive. It bypasses agency entirely.
  *   **Gun to Head (Not Responsible):** Fails Clause 3. Even if the choice is reasons-responsive (save life vs. die), the "fair opportunity" condition is obliterated by coercive threat. This explains why "mere choice" isn't enough.
  *   **Horrible Upbringing (Diminished):** Satisfies Clause 1 (they can still respond to reasons, e.g., they didn't kill, just mugged), but partially fails Clause 3. Their "fair opportunity" to develop a non-criminal character was compromised, mitigating blame but not exempting it because some reasons-responsiveness remains.
  *   **Psychopath (Not Responsible):** Fails Clause 1. If they *cannot grasp* suffering as a reason, their mechanism is not reasons-responsive regarding moral reasons. (Your worry about detention is consequentialist, separate from the desert judgment).
  *   **Drunk Driver Pair (The Problem):** This principle **cannot** capture your intuition that the killer is *more culpable* than the lucky driver. On this principle, culpability tracks the quality of the will and the risk imposed, which are identical in both cases.

  ### 2. The Sacrifice: Where You Must Break

  You suspected the drunk-driving pair and the tumor/upbringing pair can't both come out clean. You are correct. To have a consistent theory, **you must give up the Drunk Driver intuition.**

  Here is why: Your verdicts on the Tumor, Gun, and Upbringing cases are all predicated on the idea that responsibility tracks **agential control and capacity**. You exonerate the tumor victim because their control was bypassed; you mitigate the upbringing case because their control was constrained.
  *   **The Conflict:** If responsibility tracks control, then two agents with identical control (the two drunk drivers) must have identical culpability. By insisting the killer is *more* culpable, you are smuggling in a **Result Luck** condition.
  *   **The Cost:** If you keep the Drunk Driver intuition, you have to admit that responsibility is not solely about the agent's state (control/capacity) but also about the world's reaction (consequences). This undermines the logic you use to exonerate the Tumor case. (Why does the tumor excuse? Because he couldn't control it. But the lucky driver couldn't control the pedestrian's presence either. If outcome matters for blame, why doesn't outcome matter for exemption?)
  *   **Recommendation:** For a clean *moral* theory, abandon the Drunk Driver distinction. Treat them as equally blameworthy, even if we punish the killer more for consequentialist reasons (deterrence, restitution). This preserves the Control Principle that does the heavy lifting in your other cases.

  **Refining the Tumor/Upbringing Distinction:**
  You also worried about why Tumor zeroes out while Upbringing only discounts. To make this clean without sacrificing the verdicts, you need the **Alienation Condition** (Clause 2 above).
  *   **Tumor:** The cause is *alien* to the agent's psychology. It is an intruder.
  *   **Upbringing:** The cause is *constitutive*. The values and impulses formed by upbringing, however horrific, are now *theirs*. They are not reasons-responsive *enough* for full blame, but the mechanism belongs to them. This distinguishes "broken machinery" (Tumor) from "damaged but functioning machinery" (Upbringing).

  ### 3. The New Case: Reckless Drug vs. Gradual Creep

  **Case A: Knowingly takes a reckless drug.**
  *   **Verdict:** Responsible for the injury.
  *   **Mechanism:** **Tracing.** The agent was reasons-responsive at the time of taking the drug (Time 1). They foresaw (or should have foreseen) the risk of recklessness. The lack of control at Time 2 (injury) traces back to the culpable exercise of control at Time 1.
  *   **Principle Application:** Clause 3 is satisfied. They had a fair opportunity to avoid the mechanism of recklessness by not taking the pill.

  **Case B: Recklessness creeps in gradually from fully free choices.**
  *   **Verdict:** Responsible, but the line is fuzzier.
  *   **Mechanism:** **Culpable Ignorance / Negligence.**
  *   **Principle Application:** If the gradual choices were "fully his" (reasons-responsive at every step), he is responsible. However, if the gradual process eroded his capacity to *recognize* the erosion (a "slow slide" where reasons-responsiveness degrades), you must locate the **last clear chance**.
  *   **The Distinction:** In the Drug case, the threshold is sharp (swallowing the pill). In the Gradual case, responsibility attaches to the last moment where Clause 1 (reasons-responsiveness) was still intact enough to seek help or stop. If he genuinely loses the capacity to recognize his own recklessness before the injury occurs, and there was no prior "benighting" act (like the drug), responsibility diminishes. But typically, we hold agents responsible for maintaining their own moral competence.

  ### 4. Are You Quietly Compatibilist?

  **Yes, unequivocally.**

  Your pattern of verdicts is the hallmark of **Semicompatibilism** (specifically the Fischer/Ravizza strand) or **Strawsonian Optimism**. Here is how you know:
  1.  **Local vs. Global Exemptions:** You look for local constraints on agency (tumors, guns, psychopathy) to excuse. You do not suggest that *causation itself* (e.g., being a product of the past + laws of nature) is an excusing condition. An incompatibilist would have to say the Upbringing case is fully exempt because that history was determined. You say it is only *diminished*.
  2.  **Capacity-Focus:** Your intuitions track the *quality* of the psychological machinery (can they grasp reasons? are they coerced?), not the *metaphysical origin* of that machinery.
  3.  **The Luck Intuition:** Ironically, your acceptance of Moral Luck (Drunk Driver) is often more compatible with compatibilism than libertarianism. Libertarians often cling to the Control Principle to protect the "true self" from luck. Compatibilists are often more willing to accept that social practices of blame track outcomes, even if control is held constant.

  **Teaching Tip:** When your students ask, tell them this: "My intuitions track whether you had a fair shot and a working brain, not whether the universe was determined. That makes me a compatibilist. But I struggle with moral luck, which suggests my intuitions are also partly consequentialist." That level of transparency will teach them more about philosophical methodology than any textbook chapter.
