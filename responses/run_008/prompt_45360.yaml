answer: |-
  **Setting:** *The Shop of Counterfactual Curiosities. The air smells of dust and old paper. Glass cases line the walls. ANA and BASIL stand before a central pedestal where three distinct objects are displayed.*

  **ANA:** (Tapping the glass of the display case) It really is elegant, isn't it? The Simple Conditional Analysis. "The glass is fragile" just means "If the glass were struck, it would break." No metaphysical ghosts, no hidden powers. Just facts about what happens under certain conditions.

  **BASIL:** It is elegant. Like a house of cards in a wind tunnel. Look at the centerpiece there. The proprietor calls it the "Sorcerer's Vase."

  **ANA:** The blue one? It looks delicate. Thin porcelain.

  **BASIL:** It is. It's genuinely fragile. But look at the plaque. *'Equipped with a molecular scanner and a teleportation swap-device.'* If any object with kinetic energy approaches within an inch of its surface, the device instantly swaps the fragile vase for a perfect, unbreakable steel replica. The swap is instantaneous.

  **ANA:** Okay… so if I were to strike it?

  **BASIL:** The moment your finger moves to strike, *poof*. Steel replica. You tap steel. It does not break.

  **ANA:** Right. So, "If struck, it would break" is false.

  **BASIL:** Exactly. So, according to your Simple Analysis, the Sorcerer's Vase is not fragile.

  **ANA:** But it is fragile. Before the strike, it has the molecular structure of thin porcelain. It *would* break if the sorcerer didn't intervene.

  **BASIL:** But the analysis doesn't care about the sorcerer. It cares about the truth of the conditional. "If struck, it breaks." That statement is false here. So the analysis says the disposition doesn't exist. But your intuition says it does.

  **ANA:** (Frowning) Alright. That's a Finkish disposition. The disposition disappears upon the stimulus. So, we patch it. We don't just say "If struck, it breaks." We say, "If struck, it breaks, *provided its intrinsic structure remains constant during the strike.*" We hold the properties fixed.

  **BASIL:** So you're adding a *ceteris paribus* clause to the antecedent? "If it were struck and remained fragile…"

  **ANA:** Not "remained fragile," that's circular. "If it were struck and retained the intrinsic basis that currently makes it fragile."

  **BASIL:** Better. But now look to the left. The "Automaton Vase."

  **ANA:** The steel one? It looks sturdy.

  **BASIL:** It's solid carbon steel. Indestructible. But, it's wired to a sensor. The moment it detects an impact, a tiny internal hammer smashes the vase from the inside out. It shatters spectacularly.

  **ANA:** So… if struck, it breaks.

  **BASIL:** Yes. The conditional "If struck, it would break" is true.

  **ANA:** But it's not fragile. It's steel.

  **BASIL:** Precisely. This is a Mimic. Your Simple Analysis says it *is* fragile because the conditional holds. Your intuition says it *isn't* because the breaking isn't due to fragility.

  **ANA:** Okay, so my first patch handles this. The Automaton Vase doesn't break because of its intrinsic structure; it breaks because of the hammer inside. So we refine the analysis: "An object is fragile iff it would break if struck, *in virtue of* its intrinsic categorical basis."

  **BASIL:** "In virtue of." That's doing a lot of heavy lifting, Ana.

  **ANA:** It has to. We need to rule out extrinsic causes like hammers or sorcerers.

  **BASIL:** Fine. But now come to the right. The "Swan in the Cocoon."

  **ANA:** (Leaning in) A glass swan. Surrounded by… is that memory foam?

  **BASIL:** Custom-fitted. Permanently encased. The swan is thin glass. Incredibly fragile. But if you strike the package—which is the only way to strike the swan—the foam absorbs the blow. The swan never breaks.

  **ANA:** This is a Mask.

  **BASIL:** It is. So, apply your refined analysis. Is it fragile?

  **ANA:** Yes.

  **BASIL:** But the conditional fails. "If struck, it would break." False. The foam stops it.

  **ANA:** So we need another clause. "If struck, it would break… *in standard testing conditions.*" Or, "absent interfering masks."

  **BASIL:** (Crossing his arms) So, let's tally the score. To save the Conditional Analysis, you've had to add: (1) The intrinsic structure must persist during the stimulus (to stop Finks). (2) The breaking must be caused by that structure, not an external mechanism (to stop Mimics). (3) The conditions must be "standard" or "unmasked" (to stop Masks).

  **ANA:** Yes. Philosophers call this the Reformed Conditional Analysis. It's more complex, but it works.

  **BASIL:** Does it? Or have you just pushed the problem back? You say the vase is fragile because it has an "intrinsic categorical basis." What is that?

  **ANA:** The molecular bonding. The crystalline structure.

  **BASIL:** So, the truthmaker for "This is fragile" is the molecular structure?

  **ANA:** Well, yes. That's what grounds the conditional.

  **BASIL:** Then what work is the conditional doing?

  **ANA:** It defines the concept. Fragility *means* a tendency to break.

  **BASIL:** But you can't state the tendency without referencing the structure, the absence of masks, the absence of finks. You're defining the disposition in terms of a conditional, but the conditional only holds true if you've already presupposed the existence of the disposition's physical basis.

  **ANA:** I wouldn't say presupposed. Just… grounded.

  **BASIL:** Listen to what you're saying. "The vase is fragile iff it has a molecular structure such that, if struck, in standard conditions, without finks, it would break." If I ask, "Why is the conditional true?" you say, "Because of the molecular structure."

  **ANA:** Correct.

  **BASIL:** So if I ask, "What is fragility?" and you say, "It's the molecular structure," I understand you. That's my view. Dispositional Realism. Fragility is a real, irreducible property—perhaps grounded in structure, but distinct from the mere fact of breaking. But if you say, "No, it's the conditional," I have to ask, "Which conditional?" And you have to say, "The one that's true when the object has the property of fragility."

  **ANA:** (Pauses, looking at the Sorcerer's Vase) You're arguing the conditional is epiphenomenal. That it's a symptom, not the disease.

  **BASIL:** I'm arguing that your "patches" are just ways of smuggling the real property back in. When you say "in virtue of its intrinsic basis," you're admitting that the breaking isn't enough. You need a *power* to break. The steel vase lacks the power, even if it breaks. The swan has the power, even if it doesn't break.

  **ANA:** But we can't observe powers directly, Basil. We observe breakings. The conditional analysis keeps us empirically honest. If I say "This has the power of fragility," I'm just saying "It's the kind of thing that breaks."

  **BASIL:** But the Sorcerer's Vase *is* the kind of thing that breaks, yet it won't. The conditional analysis forces you to say it isn't fragile until you add the clause "if the sorcerer doesn't stop it." But how do you know the sorcerer won't stop it without already knowing whether the vase *would have* broken? You need the disposition to evaluate the counterfactual. You can't use the counterfactual to define the disposition.

  **ANA:** (Walks over to the Steel Automaton Vase) I see the redundancy worry. But look at it this way. The "intrinsic basis" clause isn't smuggling in a power. It's just specifying the causal history. We aren't saying "It has a magical fragility." We're saying "It has a structure S, and things with structure S break when struck."

  **BASIL:** And what makes it true that "Things with structure S break when struck"?

  **ANA:** Laws of nature.

  **BASIL:** Ah. So now fragility is reduced to laws of nature plus categorical structure?

  **ANA:** Yes.

  **BASIL:** But laws of nature are often understood dispositionally! "Electrons repel each other." What does that mean? "If you bring them close, they push apart."

  **ANA:** (Sighs) Now you're pushing the regress back to physics.

  **BASIL:** I'm pointing out that you can't scrub dispositions from the world just by analyzing language. You have the Swan. It sits in foam. It never breaks. It never will. On your view, what makes it fragile *now*?

  **ANA:** The fact that *if* the foam were removed, and it *were* struck…

  **BASIL:** …it would break. But why would it break?

  **ANA:** Because of its structure!

  **BASIL:** So the structure is doing the work. The "if/then" is just a way of describing what the structure *does*. But if the structure is the truthmaker, why not just say the property is real? Why insist it's just a conditional fact?

  **ANA:** Because "fragile" isn't the structure itself. Two different structures could both be fragile. Ceramic and glass. So fragility isn't identical to the structure.

  **BASIL:** Agreed. It's a higher-order property. A functional role. But is that role defined by what *does* happen, or what the object is *poised* to do?

  **ANA:** Poised to do.

  **BASIL:** "Poised." That's a dispositional word, Ana. You're using dispositions to explain dispositions.

  **ANA:** (Laughs softly) Touché. But if I accept your view, that dispositions are irreducible properties, I lose the connection to observation. I have to believe in invisible "powers" hovering over the glass.

  **BASIL:** Not hovering. Inherent. Like mass. You can't see mass, but you know it's there because of how the object resists acceleration. Even if you put the object in deep space where nothing accelerates it, it still has mass.

  **ANA:** The Swan in the Cocoon.

  **BASIL:** Exactly. The Swan is fragile even in the foam. The conditional analysis has to twist itself into knots to explain why the conditional is true when the manifestation is impossible. The Realist just says: "It has the property. The mask prevents the manifestation." Simple.

  **ANA:** But your simplicity comes at an ontological cost. You're populating the world with potentialities.

  **BASIL:** And you're populating your analysis with clauses that render the conditional core inert. Look at your definition again. "Fragile iff: Intrinsic Structure S + No Finks + No Masks + Standard Conditions + Laws of Nature → Breaking."

  **ANA:** It's a bit long, yes.

  **BASIL:** If I know S, and I know the Laws, and I know there are no Masks or Finks… do I need the "Breaking" part of the definition to know it's fragile?

  **ANA:** No. You can predict the breaking.

  **BASIL:** So the breaking is a consequence, not the definition. You've turned the Conditional Analysis inside out. You started by saying "Fragility *is* the breaking-conditional." Now you're saying "Fragility is the intrinsic basis that *makes* the breaking-conditional true."

  **ANA:** (Touches the glass of the Sorcerer's Vase case) I suppose… I suppose I have retreated. I can't defend the *Simple* Analysis. And the Reformed Analysis does seem to rely heavily on the "intrinsic basis" clause.

  **BASIL:** So you concede?

  **ANA:** Not fully. I still think the *concept* of fragility is tied to what happens. If a property never made a difference to behavior in any possible world, I wouldn't call it a disposition. I'm not ready to say the property exists independently of all conditional facts.

  **BASIL:** I don't ask you to. I just say the conditional facts depend on the property, not vice versa.

  **ANA:** Then we're stuck on the direction of explanation. I say: Structure + Laws → Conditional Truth → Disposition Ascription. You say: Structure → Disposition Property → Conditional Truth.

  **BASIL:** It seems that way. (He gestures to the shop owner, who is sweeping in the back) Though I suspect the owner of this shop is a Dispositional Realist.

  **ANA:** Why?

  **BASIL:** Because he didn't label these "Conditional Truths." He labeled them "Fink," "Mask," "Mimic." He treats the dispositions as the things being manipulated, not the sentences describing them.

  **ANA:** (Smiling) Or he's just a prankster who knows that metaphysicians will argue over anything. Come on. Let's go look at the "Lucky Coin." I hear it has a propensity to land heads, but only when no one is betting on it.

  **BASIL:** (Groans) A probabilistic fink? Let's not start on chance.

  *They walk toward the back of the shop, the sound of the bell above the door chiming as the wind catches it—a sound that would shatter the Sorcerer's Vase, if the sorcerer weren't watching.*
