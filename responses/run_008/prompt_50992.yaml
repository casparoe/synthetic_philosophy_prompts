  Citing a commitment to maximizing the logarithmic growth rate of his net worth, local backend engineer Mark Davis confirmed he is currently recovering from a preventable spinal injury because health insurance represented a negative expected value bet. Davis, who recently adopted the Kelly Criterion as a holistic life philosophy, remains remarkably calm despite being bedridden, noting that while the immediate utility loss is severe, the strategy remains optimal across an infinite ensemble of parallel universes.

  Davis explains that most people misunderstand risk management by focusing on survival rather than compounding. He applies the formula f* = (bp - q) / b to every decision, from cryptocurrency leverage to selecting appetizers. When ordering dinner, Davis calculates his wager size based on his current bankroll, often resulting in him purchasing only a single fry when drawdowns exceed forty percent. He refuses seatbelts and insurance policies, classifying them as volatility dampeners that suppress long-term geometric returns.

  The strategy relies on the assumption that Davis possesses an accurate estimate of his edge in every scenario. However, critics note that his edge estimates are largely noisy guesses. Sarah Jenkins, a senior actuary who has attempted to intervene, says the growth curve is asymmetric. Betting above Kelly wrecks growth rates while betting below it only slows them down. Jenkins says she has begged Davis to adopt a half-Kelly strategy to reduce variance, but he insists that fractional sizing is suboptimal capital allocation. He views his current hospitalization as a standard drawdown event, cheerfully shrugging off the halving of his net worth as a necessary consequence of volatility drag.

  Discrete reality clashes with the continuous assumptions of the model. Davis cannot infinitely subdivide his bankroll, and he faces hard liquidation thresholds where further betting is impossible. By treating every decision as a repeatable game he will play thousands of times, Davis ignores the ergodicity problem. There is only one Mark Davis, not an infinite ensemble of Marks across parallel realities. When one version dies or goes bankrupt, the average growth rate of the ensemble becomes irrelevant to the single instance remaining.

  Local bookie Tony Russo reports record profits. Russo says Davis is his best customer because he sizes bets based on overconfident edge estimates without regard for ruin. Russo notes that Davis never walks away from a positive expected-value one-off bet, even when it cannot compound, failing to realize that non-repeatable risks should be evaluated using linear utility rather than logarithmic growth. Davis remains unfazed, stating that he is simply waiting for the law of large numbers to converge. When asked if he worries about reaching zero before convergence occurs, Davis smiled and began calculating the optimal wager size for his hospital co-pay.
