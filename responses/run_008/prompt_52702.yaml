answer: |-
  The postgrad has served you a potent cocktail of Sartre, but she has slipped a deterministic premise into an existentialist glass. Her argument is seductive because it correctly identifies Sartre's core anxiety: the temptation to treat ourselves as objects with fixed natures. However, the rot is not in (3) or (4), which are accurate descriptions of *bad faith*, but in **(5)**, which falsely equates *intelligibility* with *determination*.

  Step (5) asserts a false dichotomy: either character causally settles the action (determinism), or the action is a coincidence. Sartre rejects both horns. For Sartre, an action is intelligible not because it was caused by a past essence ("I am vain"), but because it coheres with a *fundamental project* ("I am choosing to value admiration above loyalty"). When you explain Mathilde's betrayal by her vanity, you are not claiming vanity is a force that pushed her; you are claiming betrayal was the *method* she chose to sustain her project of being-vain. This makes the action comprehensible without making it inevitable.

  The postgrad conflates *existential psychoanalysis* (understanding the choice) with *empirical psychoanalysis* (finding the cause). By rejecting (5), you preserve the novelist's gift—making action intelligible—without surrendering the character's freedom. The cost is subtle but vital: you can no longer write character as a noun (a thing they *have*), but must write it as a verb (a thing they *do*). Mathilde isn't vain; she *vanities*. She betrays not because she couldn't help it, but because, in that moment, being faithful was less valuable to her project than being admired. This doesn't stop you from writing; it deepens the stakes. You are not documenting prisoners of nature; you are documenting collaborators in their own destiny.

