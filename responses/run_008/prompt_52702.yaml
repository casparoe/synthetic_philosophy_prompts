    "cost": "You lose the comfort of treating character as a fixed nature, but keep intelligibility; you must depict consistency as an active, sustained choice rather than a passive trait.",
    "sartre_resource": "The Fundamental Project; it allows actions to be understood as coherent choices toward ends without being causally determined by past essence.",
    "can_I_keep_writing": "Yes, provided you treat consistency as a chosen project rather than a fixed essence."
