              2.  **Inequality Aversion ($\eta$):** How much do we care about smoothing consumption across time vs. within time?
              3.  **Risk/Uncertainty:** Stern's 0.1% is extinction risk. That's probability, not time preference.
              4.  **Political Feasibility:** Nordhaus's "consistency" argument is really about political sustainability, which ethics often ignores.

      *   **Part 5: Conclusion/Synthesis:**
