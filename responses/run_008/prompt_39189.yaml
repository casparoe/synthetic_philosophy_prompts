          4.  Consumption growth: Does the "Stern cared, Nordhaus didn't" story ignore the role of future wealth assumptions?
          5.  Theory from Case: What does this episode show about the philosophical debate on PTP?
          6.  Symmetry Argument vs. Nordhaus: Does the philosophical symmetry argument miss Nordhaus's point?
