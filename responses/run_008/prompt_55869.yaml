      *   *Decisive Defeater 2: Gresham's Law.* If money is just a ticket, a debased ticket should work same as a full ticket if the state says so. But people hoard the metal. This implies the material *is* the value store, not just the ticket. *Verdict:* Strong challenge to the metaphysical claim.
