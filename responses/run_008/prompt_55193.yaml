answer: |-
  # JOINT STATEMENT ON MORAL RESPONSIBILITY AND THE REACTIVE ATTITUDES

  **Signatories:**
  **A. (The Strawsonian)**
  **B. (The Free-Will Skeptic)**

  **Date:** October 26, 2023

  ### 1. Substantive Points of Agreement

  We, the undersigned, having debated the nature of moral responsibility for over a decade, affirm the following claims as common ground. These are not merely procedural concessions but substantive philosophical commitments shared by both parties:

  1.  **The Phenomenology of Resentment:** When an agent feels resentment toward a wrongdoer, the experience presents its object as having *violated a legitimate demand* and as being *answerable* for that violation. It is not experienced merely as a dislike of the consequences of the action.
  2.  **Responsiveness to Reasons:** Reactive attitudes are not brute reflexes. In practice, they are modulated by cognitive assessments. Both parties agree that standard excuses (e.g., "I didn't know," "It was an accident") and exemptions (e.g., severe psychosis, coercive brainwashing) naturally and appropriately diminish or suspend resentment without requiring a philosophical theory to justify doing so.
  3.  **The Limits of the Objective Attitude:** We agree that P. F. Strawson's "objective attitude"—viewing another human being as an object to be managed, treated, or cured—cannot serve as the general basis for adult interpersonal relationships. A society that universally adopted the objective stance would lack the intimacy, reciprocity, and mutual recognition that constitute friendship and love.
  4.  **The Value of Moral Community:** Both parties agree that the primary goal of our moral practices should be the sustenance and improvement of interpersonal relationships and social harmony. We disagree on the means, but not on the end.
  5.  **Manipulation Cases:** We agree that in "local" manipulation cases (where an agent is covertly programmed to commit a specific crime), the agent is not morally responsible in the basic desert sense. We disagree only on whether there is a relevant difference between such cases and ordinary deterministic causation.
  6.  **Forward-Looking Functions:** We agree that moral blame and praise serve forward-looking functions: moral formation, protection of the community, and reconciliation. The Skeptic argues these are the *only* legitimate functions; the Strawsonian argues these are *additional* to the backward-looking function of acknowledging moral status.

  ### 2. Table of Residual Disagreements

  | Topic | Formulation A (Strawsonian) | Formulation B (Free-Will Skeptic) |
  | :--- | :--- | :--- |
  | **The Impact of Determinism** | The truth of determinism does not provide a specific excusing condition. Unless determinism renders us globally incapable of understanding or participating in interpersonal relationships (which it does not), it provides no reason to adopt the objective stance universally. | The truth of determinism (or pervasive luck) entails that no agent possesses the kind of sourcehood required for basic desert. Since blame entails a claim to basic desert, determinism renders blame unjustified, regardless of our psychological inclination to practice it. |
  | **The Nature of Blame** | Blame is essentially a modification of goodwill within a relationship. It is the emotional expression of a demand for regard. To ask for a justification of this practice from outside the practice is to misunderstand its constitutive role in human life. | Blame is essentially a sanction that claims the recipient *deserves* suffering or diminished standing in virtue of their past act. Because the recipient lacks ultimate control, this claim is false. We must replace blame with "moral address" that does not entail desert. |
  | **The Possibility of Revision** | To attempt to systematically extirpate reactive attitudes in favor of forward-looking address is psychologically impossible for beings like us. Attempting to do so would result not in enlightenment, but in self-deception or the erosion of the relationships we seek to preserve. | To retain reactive attitudes that entail desert is morally impermissible, akin to retaining belief in witchcraft. While difficult, we can and should cultivate non-retributive moral emotions. The difficulty of revision does not justify the injustice of the status quo. |

  ### 3. Cruxes of the Debate

  We identify three central philosophical cruxes where our disagreement remains intractable.

  **Crux A: The Status of the Strawsonian Case**
  *   **The Issue:** Is the Strawsonian defense of the reactive attitudes a claim about *psychological impossibility* (we cannot give them up), a *normative vindication* (they are inherently reasonable), or a *descriptive plea* (this is what 'responsibility' means)?
  *   **The Conflict:** The Skeptic demands a normative justification for resentment (Why is it *fair*?). The Strawsonian contends that the demand for an external justification is illegitimate because the attitudes themselves constitute the framework within which 'fairness' is intelligible.
  *   **The Stakes:** If the case is merely psychological, the Skeptic can argue "ought implies can" (if we *ought* to drop it, we must try). If it is normative/conceptual, the Skeptic is asking a category mistake.

  **Crux B: Desert vs. Moral Address**
  *   **The Issue:** Can reactive attitudes be reconceived as forms of moral address that are severable from claims of basic desert?
  *   **The Conflict:** The Strawsonian argues that while some attitudes might be purified, the core of resentment intrinsically involves a demand for regard that implies the other *could have done otherwise* in a robust sense. The Skeptic argues that if the desert component is removed, the attitude is no longer blame, but merely a request for behavioral change.
  *   **The Stakes:** Whether a "blame-free" moral community is a coherent concept or an oxymoron.

  **Crux C: Symmetry of Revision (Guilt and Agency)**
  *   **The Issue:** Does the Skeptic's revisionary program apply symmetrically to self-directed attitudes (guilt) as it does to other-directed attitudes (resentment)?
  *   **The Conflict:** The Skeptic argues that guilt, like resentment, relies on false desert claims and should be replaced by remorse (regret + commitment to repair). The Strawsonian argues that guilt is constitutive of acknowledging one's own agency; to remove guilt is to treat oneself as an object, undermining the capacity for moral self-governance.
  *   **The Stakes:** Whether the revision preserves the first-person experience of being an agent.

  ### 4. Scenarios and Divergent Predictions

  For each crux, we stipulate a scenario that both agree is well-formed, but regarding which we make different predictions.

  **Scenario for Crux A (The Justification Demand):**
  *   **Case:** *The Reflective Community.* A community is raised with full knowledge of the Skeptic's arguments. They are taught that no one deserves blame. However, they are also taught to maintain high expectations and to express strong moral disappointment when norms are violated, explicitly decoupling this from "desert."
  *   **Strawsonian Prediction:** This community will fail to sustain the practice. The "moral disappointment" will either covertly reintroduce desert (self-deception) or will fail to carry the normative weight necessary to restrain bad behavior, leading to either cynicism or a collapse into the objective stance.
  *   **Skeptic Prediction:** This community will succeed. The normative weight of moral address comes from the value of the relationship and the harm done, not from metaphysical desert. They will achieve social cohesion without the moral injustice of retributive attitudes.

  **Scenario for Crux B (Desert and Manipulation):**
  *   **Case:** *The Indistinguishable Manipulator.* An agent, Alice, commits a cruel act. It is revealed she was deterministically manipulated by neuroscientists to have exactly the character she has. She is phenomenally and behaviorally indistinguishable from a non-manipulated agent.
  *   **Strawsonian Prediction:** Even knowing the history, the victim's resentment is appropriate *within the relationship*. The manipulation fact is a theoretical overlay that does not change the interpersonal reality that Alice's will was hostile to the victim. The demand for regard stands.
  *   **Skeptic Prediction:** Knowing the history makes resentment inappropriate. Since Alice lacks sourcehood, the demand for regard is misdirected. The victim should feel hurt and seek protection, but resentment implies a falsity about Alice's moral status that should be corrected upon reflection.

  **Scenario for Crux C (Guilt and Reconciliation):**
  *   **Case:** *The Penitent Wrongdoer.* Bob wrongs Carol. He approaches her to reconcile. He expresses deep regret, acknowledges the harm, and commits to change. However, he explicitly states, "I do not feel guilt, because I know I did not ultimately deserve to be the kind of person who did this, but I am sorry you were hurt."
  *   **Strawsonian Prediction:** Carol will find this reconciliation hollow. Without guilt, Bob is treating his own past agency as a mere occurrence, like a natural disaster. He is not owning the act as *his* in the way required to restore the moral equilibrium between them.
  *   **Skeptic Prediction:** Carol should accept this as sufficient. Bob's commitment to repair and moral formation is what matters for the future. Insisting on guilt adds unnecessary suffering to Bob without providing any additional moral benefit to Carol.

  ### 5. Closing Assessment: Verbal and Substantive Remnants

  In reviewing our decade of debate, we identify a significant verbal dispute, though it does not dissolve the substantive disagreement.

  **The Verbal Dispute:**
  Much of our argument turns on the definition of **"Blame."**
  *   **Signatory B (Skeptic)** defines blame essentially as *retributive sanction entailing basic desert*. Under this definition, if basic desert is impossible, blame is impossible.
  *   **Signatory A (Strawsonian)** defines blame essentially as *the suite of reactive attitudes and the modification of goodwill*. Under this definition, blame exists wherever there are interpersonal relationships, regardless of metaphysical desert.

  If we were to stipulate that "Blame*" refers to the Skeptic's definition and "Blame**" refers to the Strawsonian definition, we could agree that "Blame* is unjustified" and "Blame** is unavoidable."

  **The Substantive Remnant:**
  However, tidying away the terminology does not end the dispute. A substantive disagreement remains regarding the **moral permissibility of the phenomenology of resentment.**
  *   Even if we call it "Moral Address**" instead of "Blame," the Strawsonian endorses an emotional stance that *feels* like the other person *owed* us better and is *answerable* in a way that implies a robust capacity to have done otherwise.
  *   The Skeptic contends that cultivating or permitting this feeling is morally akin to permitting a belief in falsehoods (like racial superiority or witchcraft), because it relies on a metaphysical illusion of sourcehood.

  Therefore, while we can clarify our terms, we remain divided on a fundamental question: **Is the human emotional infrastructure of responsibility a feature of the world we must accept to live fully human lives, or is it a cognitive distortion we are morally obligated to correct, regardless of the psychological cost?**

  On this question, we sign this statement not as a resolution, but as a map of the terrain we continue to share.

  **Signed,**

  __________________________
  **A. (The Strawsonian)**

  __________________________
  **B. (The Free-Will Skeptic)**
