      *   **Audience:** Philosophy of Science Department (No Lakatosians).
          *   Historian of Science (Anti-rational reconstruction, pro-contingency).
          *   Committed Bayesian (Credence updating, skeptical of hard-core/belt).
          *   Popperian (Thinks Lakatos weakened falsification, sees timescale relativization as further capitulation).
