answer: |-
  # Seminar Case Study: The Founder and the CTO
  **Topic:** Axiomatic Bargaining Theory (Nash vs. Kalai–Smorodinsky)
  **Focus:** Sensitivity to the Ideal Point (Utopia Point)

  ## 1. The Scenario
  **Parties:** 
  *   **Alice (Founder):** Holds the IP and majority control. 
  *   **Bob (Lead Engineer):** Critical hire needed to launch Version 2.0.

  **The Issues:** 
  Negotiations cover two variables: **Base Salary** ($s$) and **Equity Stake** ($e$). 
  *   **Alice's Interest:** She wants to minimize cash burn (salary) and dilution (equity). Her utility is the *risk-adjusted value of her remaining stake*.
  *   **Bob's Interest:** He wants cash flow (salary) and upside (equity). His utility is *salary plus expected equity value*.

  **The Disagreement Point ($d$):**
  If talks collapse, Bob takes a job at a competitor. Alice keeps the company but cannot launch V2.0.
  *   We normalize the **surplus** of the deal over this walk-away position to zero.
  *   $d_A = 0$ (Alice's gain over status quo).
  *   $d_B = 0$ (Bob's gain over market salary).

  **The Feasible Frontier:**
  The company's CFO has modeled the trade-off. High salaries reduce runway, which non-linearly increases the risk of bankruptcy before exit, reducing the value of *everyone's* equity. This creates a **diminishing returns** effect. The Finance Team presents the Pareto Frontier of possible utility gains $(u_A, u_B)$ as:

  $$ u_B = 60 \left[ 1 - \left( \frac{u_A}{100} \right)^2 \right] $$

  **Visible "Best Cases" (Ideal Points):**
  *   **Alice's Best Day:** Bob accepts the minimum viable package. Alice captures the maximum possible surplus.
      *   Set $u_B = 0 \Rightarrow 1 - (u_A/100)^2 = 0 \Rightarrow \mathbf{u_A^{max} = 100}$.
  *   **Bob's Best Day:** Alice concedes maximum value to secure Bob's loyalty.
      *   Set $u_A = 0 \Rightarrow u_B = 60(1 - 0) \Rightarrow \mathbf{u_B^{max} = 60}$.
  *   **The Ideal Point:** $I = (100, 60)$.

  ---

  ## 2. The Computation

  We calculate the bargaining solution in utility space $(u_A, u_B)$.

  ### A. The Nash Bargaining Solution ($N$)
  **Axiom:** Independence of Irrelevant Alternatives. The solution maximizes the product of the gains over the disagreement point.
  **Objective:** Maximize $P = (u_A - d_A)(u_B - d_B) = u_A \cdot u_B$.

  1.  Substitute the frontier constraint into the objective:
      $$ P(u_A) = u_A \cdot 60 \left[ 1 - \frac{u_A^2}{10000} \right] = 60 \left( u_A - \frac{u_A^3}{10000} \right) $$
  2.  Take the derivative with respect to $u_A$ and set to zero:
      $$ \frac{dP}{du_A} = 60 \left( 1 - \frac{3u_A^2}{10000} \right) = 0 $$
  3.  Solve for $u_A$:
      $$ 3u_A^2 = 10000 \Rightarrow u_A = \frac{100}{\sqrt{3}} \approx \mathbf{57.74} $$
  4.  Solve for $u_B$:
      $$ u_B = 60 \left( 1 - \frac{1}{3} \right) = \mathbf{40.00} $$

  **Nash Outcome:** $N = (57.74, 40.00)$

  ### B. The Kalai–Smorodinsky Solution ($K$)
  **Axiom:** Individual Monotonicity. The solution preserves the ratio of maximum possible gains. Each party makes the same *relative* concession from their ideal point.
  **Objective:** Find the point on the frontier where $\frac{u_A - d_A}{u_A^{max} - d_A} = \frac{u_B - d_B}{u_B^{max} - d_B}$.

  1.  Set up the proportionality line (the "KS Line") connecting $d(0,0)$ to $I(100, 60)$:
      $$ \frac{u_A}{100} = \frac{u_B}{60} \Rightarrow u_B = 0.6 u_A $$
  2.  Intersect this line with the frontier:
      $$ 0.6 u_A = 60 \left[ 1 - \left( \frac{u_A}{100} \right)^2 \right] $$
  3.  Simplify (divide by 60):
      $$ \frac{u_A}{100} = 1 - \left( \frac{u_A}{100} \right)^2 $$
  4.  Let $x = \frac{u_A}{100}$. Solve $x = 1 - x^2 \Rightarrow x^2 + x - 1 = 0$.
      $$ x = \frac{-1 + \sqrt{1 + 4}}{2} = \frac{\sqrt{5} - 1}{2} \approx 0.61803 \quad (\text{The Golden Ratio Conjugate}) $$
  5.  Calculate utilities:
      $$ u_A = 100 \cdot 0.61803 = \mathbf{61.80} $$
      $$ u_B = 60 \cdot 0.61803 = \mathbf{37.08} $$

  **Kalai–Smorodinsky Outcome:** $K = (61.80, 37.08)$

  ---

  ## 3. Verification and Analysis

  ### Verification of the Gap
  *   **Nash Award to Alice:** $57.74$
  *   **KS Award to Alice:** $61.80$
  *   **Difference:** $4.06$ utility units.
  *   **Percentage Margin:** $\frac{61.80 - 57.74}{57.74} \approx \mathbf{7.03\%}$.

  The specification is met: Kalai–Smorodinsky awards Party A strictly more than Nash, by a significant margin (7%), not a rounding error.

  ### What Feature Is Doing the Work?
  The divergence is driven by the **asymmetry of the Ideal Point** combined with the **curvature of the frontier**.

  1.  **Ideal Point Asymmetry:** Alice's maximum possible gain (100) is significantly larger than Bob's (60). The KS solution respects this "potential." It argues that because Alice *could* have gained 100, she deserves a larger share of the actual agreement than if her cap were lower. Nash ignores the "100"; it only sees the local trade-off at the agreement point.
  2.  **Curvature:** If the frontier were a straight line connecting $(100,0)$ and $(0,60)$, Nash and KS would **coincide**. The curvature (diminishing returns) creates a "bulge" in the feasible set. Nash tries to balance the *marginal* rates of substitution (tangent slope = -1 ratio of gains), while KS forces a specific *average* rate of substitution (slope of the line to the ideal). On this specific parabolic curve, the KS line cuts through a region more favorable to the party with the higher ideal point.

  **Minimal Change to Collapse the Solutions:**
  If we change the scenario so that **Alice and Bob have symmetric ideal points** (e.g., both have a max gain of 100), the KS line becomes $u_B = u_A$. On a symmetric frontier (like $u_B = 100 - u_A^2/100$), the Nash product is also maximized at symmetry. The solutions would converge. The divergence *requires* both asymmetry in aspirations and non-linearity in the trade-off.

  ---

  ## 4. The Debate: Bug or Feature?

  **The Nash Defender (Stability & Incentives):**
  "Look at Bob's utility. Under Kalai–Smorodinsky, he drops from 40 to 37. Why? Simply because Alice *claimed* she could get 100. Aspirations are cheap talk. Alice can inflate her 'best case' by imagining a unicorn exit that isn't feasible. Nash ignores this cheap talk. It focuses strictly on the feasible gains *right now*. By maximizing the product of gains, Nash ensures that neither party has an incentive to walk away to seek a better deal on the margin. KS punishes Bob for Alice's higher ceiling. That isn't fairness; it's penalizing the party with lower leverage."

  **The Kalai–Smorodinsky Defender (Fairness & Concession):**
  "Your 'stability' is blind to context. In this startup, Alice owns the IP. Her 'best case' of 100 isn't fantasy; it's the value of the company if she does all the work herself. Bob's 'best case' is capped at 60 because he is an employee; he physically cannot capture more value without breaking the company. KS recognizes this structural asymmetry. It demands that both parties make the **same relative sacrifice**. Alice gives up 38% of her potential (38/100); Bob gives up 38% of his potential (23/60). Nash forces Bob to sacrifice 50% (30/60) while Alice sacrifices only 42% (42/100). KS equalizes the pain of concession; Nash equalizes the marginal utility, which ignores the scale of the stakes."

  ### Instructor's Judgment
  In this specific case, **the Nash solution looks problematic.**

  Why? Because the asymmetry in the Ideal Point (100 vs 60) arises from a **structural power imbalance** (Founder vs. Employee), not from arbitrary demands. Alice *actually* has more to gain because she owns the asset. By ignoring the Ideal Point, Nash effectively treats the "capacity to gain" as irrelevant. This results in Bob subsidizing Alice's ownership advantage—he makes a larger *percentage* concession than she does.

  For a seminar on **equity and power**, Kalai–Smorodinsky provides the more compelling normative argument: fairness should account for what each party *could* have achieved, not just the local slope of the deal. However, warn your class: if Alice's "100" was inflated by bluffing, KS becomes manipulable. Nash is robust to lies; KS is sensitive to truth. In this case, we assumed the Ideal Point was verified by the CFO. If it's just negotiation posturing, Nash wins.
