prompt: |-
  Two members of my experimental philosophy reading group, Marianne and Theo, got stuck on the Knobe effect at the end of last week's session, and their disagreement has continued into our group chat. I'll report it as fairly as I can and would like a verdict, because I can't work out who is right about what.

  For context: the effect involves the familiar case of a chairman of the board who is told that a new programme will increase profits and that it will also harm the environment; he says he doesn't care at all about harming the environment, he just wants to make as much profit as possible, and starts the programme. Most people asked whether he intentionally harmed the environment say yes. In the mirror version, where the programme will also help the environment and he says he doesn't care about helping it, most people asked whether he intentionally helped the environment say no. That's the phenomenon they were arguing about.

  (1) Marianne's opening move: in both versions the chairman knows about the side effect in advance and decides to proceed anyway, so on a purely descriptive concept of acting intentionally — foresight plus a settled decision — the two cases should get the same answer. The only thing that flips between versions is the moral valence of the side effect, and the answers flip with it. So the folk concept of intentional action is partly constituted by moral concerns; the competence itself is moralised, and armchair analyses that treat it as a purely descriptive concept got the folk wrong.

  (2) Theo's reply: the asymmetry shows nothing of the sort, because the survey question doesn't reach the concept cleanly. When you ask whether he intentionally harmed the environment, respondents hear a question about whether he's answerable for it, and answer that question instead; in the help version, saying yes would sound like a compliment he hasn't earned, so people say no. The composite answer differs even though the underlying concept may be untouched. The correct moral for experimental philosophy, he said, is that questionnaires are contaminated by conversational pragmatics, not that the concept has morality built in.

  (3) Marianne's second move: the pragmatic story predicts the asymmetry should disappear wherever blame is off the table, but it leaks everywhere. She claimed the effect has been found in children far too young to be strategic about blame attributions. And she cited a well-known follow-up study about office stationery: in a department where pens keep going missing, two people each take the last pen on the same day — one of whom is permitted to take pens, the other of whom is forbidden — and asked who caused the problem, respondents overwhelmingly name the person who violated the norm, even though both took a pen. A who-caused-it question is not plausibly heard as a covert blame question, yet norms bend the causal judgement all the same.

  (4) Theo's second reply: he was unconvinced that causal talk is the pristine register she needs. Calling the norm-violator the cause of the problem is itself a way of laying the outcome at his door; ordinary people say the driver, not the icy patch, caused the accident precisely when the driver broke a rule, and nobody concludes that the concept of causation is moralised — the moral layer affects what we choose to highlight, not what we represent. As for the children, he said that if the effect is a habit of ordinary conversation, we should expect it early, since children learn the habits of conversation before they learn anything else; the developmental data cuts both ways.

  (5) Marianne's closing move: she said the two views then seem to make the same predictions everywhere. If you build a version where the respondent is told the harmed party had it coming, her view predicts the intentionality judgement should track the respondent's own norms and soften, and she was confident Theo's view predicts the same, since on his story the respondent hears the question through those same norms. She pressed him: if no possible observation could separate the two accounts, his position isn't a rival hypothesis, just a refusal to accept hers.

  (6) Theo's closing reply: he said she had it backwards. If the folk practice is pragmatic through and through, there is no further fact about whether the concept is really moralised — the question is ill-formed, not undecidable, and his account is more parsimonious because it keeps one neutral concept plus an explanation of the enrichment, whereas she multiplies moralised concepts for every norm-sensitive judgement we make.

  That's where they left it. Please adjudicate move by move: say who is right about which specific point, not just who wins overall; treat any empirical claims they made as their claims, and note where the verdict would have to be qualified if a claim turns out not to hold. Then say what, if anything, both of them are missing. Finally, tell me where your adjudication is most likely to go wrong, and what argument or finding would change your verdict. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a debate between two experimental philosophy reading group members (Marianne and Theo) regarding the Knobe Effect (Side-Effect Effect).
      *   **Format:** Move-by-move analysis (who is right on specific points), identify what both are missing, identify potential errors in my own adjudication (limitations/defeaters).
      *   **Language:** British English.
      *   **Constraint:** Treat empirical claims as *their* claims (note qualifications if they are false), do not simply declare an overall winner without nuance.

  2.  **Deconstruct the Debate:**

      *   **Context:** The Knobe Effect (Chairman case). Harm version (Intentional = Yes), Help version (Intentional = No).
      *   **Marianne's Position (The Moral Constitution View):** The folk concept of *intentional action* itself is partly constituted by moral considerations. It's not purely descriptive.
      *   **Theo's Position (The Pragmatic/Performance View):** The underlying concept is descriptive/neutral. The asymmetry arises from conversational pragmatics (blame/praise attribution) contaminating the survey response.

      *   **Move 1 (Marianne):** Descriptive concept (foresight + decision) predicts symmetry. Data shows asymmetry based on moral valence. Therefore, the concept is moralised.
      *   **Move 2 (Theo):** Survey questions trigger pragmatic implicatures (blame/praise). Respondents answer "Is he blameworthy?" not "Did he do it intentionally?" Concept remains untouched; performance is skewed.
      *   **Move 3 (Marianne):** Pragmatic story predicts asymmetry disappears when blame is off. But it persists in children (no strategic blame) and non-blame contexts (Pen Case/causation). Therefore, it's not just pragmatics.
      *   **Move 4 (Theo):** Causal talk is also pragmatic/highlighting (selecting the norm-violator as cause doesn't mean causation is moralised). Children learn conversational habits early. Developmental data is ambiguous.
      *   **Move 5 (Marianne):** If both views predict the same outcomes (e.g., in "had it coming" variations), Theo's view isn't a rival hypothesis, just a refusal to accept hers. (Challenge to falsifiability).
      *   **Move 6 (Theo):** The question "is the concept moralised?" is ill-formed if practice is pragmatic. His view is more parsimonious (one neutral concept + enrichment vs. many moralised concepts).

  3.  **Evaluate Move by Move (Drafting the Adjudication):**

      *   *Move 1 (Marianne):* She correctly identifies the core puzzle. If intentionality were purely psychological (belief/desire), the cases are identical. The data *does* show asymmetry. *Verdict:* She is right about the data pattern and the challenge to traditional descriptivism. However, her inference (therefore the *concept* is moralised) is the contested leap.
      *   *Move 2 (Theo):* He offers a standard pragmatic explanation (conversational implicature). This is a viable alternative explanation. *Verdict:* He is right that survey responses can be contaminated by pragmatics. However, claiming this *explains away* the effect entirely is the contested leap.
      *   *Move 3 (Marianne):* She cites the Pen Case (Knobe 2007?) and children. This is strong evidence against a simple "blame avoidance" pragmatic story. If causation judgments shift, it suggests deeper cognitive processing than just "answering a different question." *Verdict:* She is right that the effect is robust across contexts where simple blame-pragmatics seem less relevant. The empirical claim about children needs qualification (some studies show the effect emerges later), but assuming her claim holds, it weakens Theo's specific pragmatic story.
      *   *Move 4 (Theo):* He counters the Pen Case by appealing to causal selection (Hart & Honoré style). We pick the abnormal/norm-violating cause. This doesn't mean *causation* is moralised, just *selection*. Regarding children: learning habits early is plausible. *Verdict:* He is right that causal selection is distinct from causal metaphysics. His point about children is reasonable but speculative.
      *   *Move 5 (Marianne):* She challenges falsifiability. If both predict the same data, is the distinction real? *Verdict:* She has a strong methodological point. If the pragmatic mechanism is tuned to mimic the moral constitution mechanism perfectly, it risks being unfalsifiable.
      *   *Move 6 (Theo):* He appeals to parsimony (Occam's Razor). Keep the concept simple, add pragmatic rules. *Verdict:* He is right about theoretical parsimony being a virtue. However, declaring the question "ill-formed" is a philosophical dodge if the cognitive architecture actually differs.

  4.  **Identify What Both Are Missing:**
      *   **The "Deep Structure" vs. "Surface Grammar" distinction:** They are arguing about whether the *concept* is moralised. Modern cognitive science might suggest it's neither. It might be about *attention* or *weighting* of mental states.
      *   **The Specific Mechanism:** Neither specifies *how* morality influences the judgment. Is it early (perception) or late (judgment)?
      *   **Alternative Theories:** They ignore the "Trade-Off Hypothesis" or "Cognitive Architecture" views (e.g., Pettit & Knobe, or later work by Guglielmo & Malle).
      *   **The Definition of "Concept":** They treat "concept" as a monolithic thing. It might be a prototype, a theory, or a capacity.

  5.  **Identify Limitations of My Adjudication:**
      *   **Empirical Flux:** Experimental philosophy data is notoriously sensitive to framing, culture, and replication crises. If the child data is wrong, Marianne weakens.
      *   **Philosophical Stakes:** The definition of "concept" is itself disputed.
      *   **My Bias:** I need to ensure I don't favour the "moralised" view just because it's more exciting, or the "pragmatic" view because it's conservative.

  6.  **Drafting the Response (incorporating British English and specific constraints):**

      *   *Tone:* Academic, fair, adjudicatory.
      *   *Structure:*
          1.  Introduction.
          2.  Move-by-Move Adjudication (1-6).
          3.  What Both Are Missing.
          4.  Limitations/Defeaters.
      *   *Key Check:* Ensure I explicitly state where empirical claims need qualification. Ensure I use British spelling (moralised, programme, etc.).

      *(Self-Correction during drafting)*: I need to be careful with the Pen Case. Marianne calls it "office stationery." This is likely the Knobe (2007) "Pen Case." I should treat her empirical claim as given but note the replication context.
      *   *Move 3:* Marianne claims children are "too young to be strategic." Some studies suggest the effect appears around age 4-5, which *is* when theory of mind develops. I must note this qualification.
      *   *Move 6:* Theo's claim about parsimony is strong, but Marianne's point about "rival hypothesis" is methodologically crucial. I need to balance this.

  7.  **Final Polish:** Check against the prompt requirements.
      *   British English? Yes.
      *   Move by move verdict? Yes.
      *   What both missing? Yes.
      *   Where my adjudication might go wrong? Yes.

      *(Refining the "Who is Right" aspect)*: It's rarely 100% one side. I should say "Marianne is right to press X, but Theo is right that Y follows."
      *   Move 1: Marianne is right about the data challenging descriptivism.
      *   Move 2: Theo is right that pragmatics *can* influence surveys, but wrong to assume it *must* explain this.
      *   Move 3: Marianne is right that the effect is robust, but her empirical claim about children needs qualification.
      *   Move 4: Theo is right about causal selection, but this concedes that norms influence judgment, which is close to Marianne's point.
      *   Move 5: Marianne is right about the risk of unfalsifiability.
      *   Move 6: Theo is right about parsimony, but wrong to dismiss the metaphysical question as ill-formed.

      *Wait, I need to be decisive.* "Say who is right about which specific point."
      Okay, I will assign points based on logical strength and empirical support *as presented*.

      *Re-evaluating Move 4:* Theo says "nobody concludes that the concept of causation is moralised." Actually, some experimental philosophers *do* argue exactly that (Alicke, etc.). So Theo is making a contestable claim there. I should note that.

      *Re-evaluating Move 6:* Theo says "there is no further fact." This is a quasi-Wittgensteinian move. It's philosophically defensible but shuts down inquiry. Marianne's challenge is better for science.

      *Okay, let's write.*
answer: |-
  Here is an adjudication of the debate between Marianne and Theo, assessed move by move, followed by an analysis of their shared blind spots and the limitations of this verdict.

  ### Move-by-Move Adjudication

  **(1) Marianne's opening move**
  **Verdict:** Marianne is right about the data, but her inference is premature.
  She correctly identifies that standard descriptivist accounts (relying solely on belief, desire, and awareness) predict symmetry between the Harm and Help cases. The empirical data clearly shows asymmetry. Therefore, she is correct that traditional armchair analysis fails to capture the folk competence. However, her leap to the conclusion that the *concept itself* is moralised is not the only available inference. The data proves the *judgement* is sensitive to morality, but not necessarily that the semantic content of 'intentional' includes moral value. Theo's alternative (that the judgement is influenced by external factors) remains live at this stage.

  **(2) Theo's reply**
  **Verdict:** Theo is right about the mechanism, but wrong about the implication.
  He is correct that survey responses are vulnerable to conversational pragmatics. In ordinary language, asking if someone 'intentionally' did something often functions as a proxy for holding them responsible. Respondents may indeed be answering a question about blameworthiness rather than mental states. However, he is wrong to suggest this *dissolves* the philosophical problem. Even if the survey question is pragmatically enriched, the fact that the enrichment occurs so systematically and immediately suggests the interface between the concept and moral evaluation is intrinsic to how the concept is deployed, not merely a superficial contamination.

  **(3) Marianne's second move**
  **Verdict:** Marianne is right on the robustness, qualified on the developmental claim.
  Her appeal to the 'Pen Case' (causal attribution) is strong evidence against a simple blame-avoidance pragmatic story. Causal attribution is theoretically distinct from moral praise/blame, yet it shows similar asymmetries. This suggests the moral influence penetrates deeper than just survey pragmatics. However, her empirical claim regarding children requires qualification. Some developmental studies suggest the Knobe effect emerges around age four or five, coinciding with the development of Theory of Mind and normative understanding. If children *are* capable of strategic normative alignment by that age, the claim that they are 'too young to be strategic' may be factually incorrect. If the effect appears earlier than normative competence, her case strengthens; if they appear together, Theo's 'habit of conversation' story gains ground.

  **(4) Theo's second reply**
  **Verdict:** Theo is right about causal selection, but conflates selection with representation.
  He correctly notes that identifying the norm-violator as 'the cause' is a matter of causal selection (highlighting the abnormal), not necessarily a change in the metaphysical concept of causation. We do not think the driver *physically* caused the accident differently than the ice; we simply select the driver for explanation. However, he is too dismissive in claiming 'nobody concludes that the concept of causation is moralised'. A significant strand of experimental philosophy argues exactly that. Furthermore, his defence regarding children ('habits of conversation') is speculative. If the effect is a deep cognitive habit, it supports Marianne's view that the competence is moralised, merely shifting the location of the moralisation from 'semantics' to 'cognitive architecture'.

  **(5) Marianne's closing move**
  **Verdict:** Marianne is right on methodology.
  She identifies a crucial risk in Theo's position: unfalsifiability. If the pragmatic mechanisms are allowed to be as flexible as the moral constitution mechanisms in predicting outcomes, Theo's hypothesis becomes a 'just-so' story. For his view to be a genuine rival, he must specify *independent* constraints on the pragmatic enrichment that could, in principle, diverge from the moral constitution predictions. If every time the moral judgement shifts the intentionality judgement shifts, positing a neutral concept underneath adds no explanatory power.

  **(6) Theo's closing reply**
  **Verdict:** Theo is right on parsimony, but wrong on dismissal.
  He is correct that positing a single neutral concept plus pragmatic rules is theoretically more parsimonious than multiplying moralised concepts for every norm-sensitive judgement. This is a standard virtue in theory selection. However, he is wrong to declare the question 'ill-formed'. Whether the moral sensitivity is located in the semantics (Marianne) or the pragmatics (Theo) is a substantive empirical question about cognitive processing (early vs. late), not a linguistic confusion. Declaring it ill-formed protects his parsimony from empirical refutation, which circles back to Marianne's methodological objection in Move 5.

  ### What Both Are Missing

  Both Marianne and Theo are operating within a binary framework that may be outdated. They assume the debate is between 'The Concept Is Moralised' (Marianne) and 'The Concept Is Neutral + Pragmatics' (Theo). They are missing several nuanced possibilities currently discussed in the literature:

  1.  **The Weighting Hypothesis:** It is possible that the concept of intentional action is neither moralised nor neutral, but involves a weighting of mental states. Morality might affect how much evidence of 'intent' is required. In the Harm case, less evidence of desire is needed to trigger the label; in the Help case, more is needed. This preserves a single concept but allows moral valence to tune the threshold.
  2.  **Cognitive Architecture vs. Semantics:** They argue about the 'concept', but the disagreement might be about processing stages. Marianne assumes moral influence implies semantic constitution. Theo assumes it implies post-semantic pragmatics. Both could be wrong if the moral influence occurs during the *perception* of the action itself, prior to conceptual application.
  3.  **The Nature of 'Folk' Competence:** Neither questions whether there is a unified 'folk concept'. It is increasingly likely that ordinary people do not possess a single, coherent concept of intentional action that philosophers can analyse. They may possess a cluster of heuristics that yield different results in different contexts. If there is no single concept, Marianne's claim that it is 'moralised' and Theo's claim that it is 'neutral' are both category errors.

  ### Limitations and Defeaters

  My adjudication is most likely to go wrong in the assessment of **Move 3 (Developmental Data)** and **Move 6 (Parsimony)**.

  1.  **Empirical Instability:** My verdict leans slightly towards Marianne on the robustness of the effect (Move 3). However, if future replication studies show that the Knobe effect is significantly weaker or more culturally specific than initially thought (as some replication crises in social psychology suggest), Theo's pragmatic explanation becomes much more viable. If the effect disappears in certain non-WEIRD (Western, Educated, Industrialised, Rich, Democratic) populations, it supports Theo's view that this is a local conversational habit rather than a universal moralised competence.
  2.  **The Definition of 'Concept':** My adjudication assumes a relatively standard cognitive-science view of concepts. If one adopts a Wittgensteinian or use-theory of meaning (as Theo hints in Move 6), the distinction between 'semantic content' and 'pragmatic use' collapses. In that framework, Theo would be decisively right: if meaning *is* use, and the use is moralised, then asking if the *concept* is moralised apart from the use is indeed ill-formed. A shift in philosophical methodology regarding meaning would overturn my preference for Marianne's methodological challenge in Move 5.
  3.  **Mechanism Specificity:** If neuroscientific evidence were to locate the asymmetry in late-stage decision-making processes (supporting Theo) rather than early-stage action perception (supporting Marianne), my verdict on the 'deep structure' of the judgement would need to be reversed. Currently, the behavioural data is compatible with both, which is why the debate persists.

  In summary, Marianne wins on the methodological necessity of falsifiability and the depth of the moral influence, while Theo wins on theoretical parsimony. However, the debate itself may rest on a false dichotomy regarding the nature of concepts.
