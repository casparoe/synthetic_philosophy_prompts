answer: |-
  The wind eats at the dry grass,
  I count the flock, just one
  extra lamb to feed, and more
  than the neighbors bear. I walk free
  across the ridge, what's mine
  is safe, though half the valley's gone.

  Summer heat, the water gone,
  roots clutching at the grass,
  each man claims his share is mine,
  while I slip another one
  into the herd. The gate stands free,
  profit grows, we take more.

  Nobody wants to pay more
  for dirt where green is gone.
  We let the gates swing free,
  trampling down the grass,
  each herder adds just one
  more beast to say the land is mine.

  The old book says the ridge is mine,
  but spring meetings fixed allotments, asked for more
  restraint. We counted one
  too many years until the feed was gone.
  Now wind owns the grass,
  and I still ride the range free.

  I ride the range free,
  knowing what is mine
  depends on eating up the grass.
  Tomorrow brings us more
  dust, yesterday's water gone,
  but I'll keep adding one.

  Just one
  more year to run free,
  before the soil is gone,
  then I'll claim what's mine
  and sell the rest for more
  than barren ground and grass.

  Gate swings free, water gone,
  I eat grass, call it mine, just one
  season left to take more.
