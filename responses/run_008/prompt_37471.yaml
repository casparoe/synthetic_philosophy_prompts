answer: |-
  Your hypothesis is not daft. In fact, it is arguably more insightful than half the literature produced on this topic in the last forty years. You have identified the structural reason for the stalemate: the debate is not actually about the history of science or the nature of theories, but about **the normative status of Inference to the Best Explanation (IBE).**

  As an immunologist, you are trained to treat a model that consistently predicts experimental outcomes as a map of the territory. If blocking IL-6 reduces inflammation, you infer IL-6 exists and plays that role. To you, denying that inference requires a special philosophical justification. To the anti-realist (specifically the constructive empiricist like van Fraassen), *accepting* that inference requires a special philosophical justification.

  Here is the diagnosis of why the debate is stationary, why "approximate truth" is the bottleneck, and whether there is any path forward.

  ### 1. The Diagnosis: A Clash of Modalities, Not Evidence
  You suggested the sides reason according to their training. This is correct, but it runs deeper than sociology. It is a clash between **abductive pragmatism** (Realism) and **deductive caution** (Anti-Realism).

  *   **The Realist Move:** Realists rely on the "No Miracles Argument" (NMA). They claim that the predictive success of science is a *phenomenon* that needs explaining. The best explanation for why our interventions work is that our theories latch onto reality. This is IBE.
  *   **The Anti-Realist Move:** Anti-realists rely on the "Pessimistic Meta-Induction" (PMI). They argue that because past successful theories (phlogiston, ether) were ontologically wrong, current successful theories are likely ontologically wrong too.

  **Why it's stationary:**
  The stalemate exists because **IBE is not a rule of logic; it is a rule of practice.**
  *   To a scientist (you), IBE is how discovery works. You don't separate "empirical adequacy" from "truth." If the antibody binds, the epitope is there.
  *   To a rigorous empiricist philosopher, IBE is question-begging. It assumes that "truth" is the only possible explanation for "success." The anti-realist says: "No, survival bias, mathematical flexibility, and phenomenological modeling can also explain success without ontology."

  Neither side can move because the Realist is arguing from *utility* (it works, so it's real) and the Anti-Realist is arguing from *possibility* (it could work even if it's not real). You cannot defeat a possibility argument with a utility argument.

  ### 2. The "Approximate Truth" Trap
  You hit the exact nerve that keeps the debate from resolving: *"Nobody has told me what 'approximately true' is supposed to mean for a theory that's wrong about the fundamental entities but right about the maths."*

  This is the semantic bottleneck. Truth is traditionally binary (a proposition is true or false). If the ether does not exist, the statement "light propagates through the ether" is false, not "approximately true."

  *   **Realists** try to salvage this with **Verisimilitude** (truth-likeness). But as you suspect, no one has successfully defined a metric for this. How do you measure the "distance" between a false theory and the truth?
  *   **Structural Realists (Worrall)** try to bypass this by saying: "The *objects* (ether) were wrong, but the *relations* (Maxwell's equations) were right."

  **Why Structural Realism didn't help:**
  It feels like "another layer of the same fight" because it inherits the same problem. If the equations work but the ontology is wrong, *what is doing the work?* A structure cannot float free of *something* structured. If you say "the structure is real," you are just a realist about structures. If you say "the structure is just a tool," you are an instrumentalist. Worrall's move splits the difference, but it doesn't solve the metaphysical anxiety of what the math is *about*.

  ### 3. Is the Question Ill-Posed?
  Yes and no.

  **Yes,** in the **Global** sense.
  The question "Is Science (as a whole) approximately true?" is too blunt. It treats physics, biology, and sociology as a monolith. It asks for a verdict on the relationship between *Mind* and *World* based on case studies that are too messy. This is why the debate has been stationary since Putnam and van Fraassen in the 70s and 80s. They defined the terms of the fight in a way that made it unwinnable.

  **No,** in the **Local** sense.
  Progress *has* happened, but it happened by dissolving the global question into specific ones. The debate shifted from "Is Science Real?" to "Under what conditions do we commit to an entity?"

  This is where your background matters. In immunology, you likely didn't worry about whether the *theory* of cytokines was "approximately true" in a philosophical sense. You worried about whether you could isolate them, block them, and measure them.

  This aligns with **Entity Realism** (associated with Ian Hacking and Nancy Cartwright). Hacking's maxim was: *"If you can spray them, they are real."*
  *   **The Shift:** Stop asking if theories are true. Ask if the *causal agents* posited by the theories can be used to intervene on other things.
  *   **The Progress:** This bypasses the "approximate truth" vagueness. We don't need to know if the *theory* of the electron is finally true. We know electrons are real because we can use them to build a microscope that images proteins. The realism is grounded in **experimental manipulation**, not predictive success.

  ### 4. Honest Verdict: Should you stay or go?
  If you are looking for a resolution to the **Global Realism vs. Anti-Realism** debate (the Putnam/van Fraassen era stuff), you should conclude that the question is exhausted. It is a philosophical zombie. The arguments are fully enumerated, the counter-arguments are fully enumerated, and the stalemate is structural. Reading more on "structural realism" or "selective realism" will likely yield diminishing returns.

  **However,** do not go back to causation just yet (that is a different minefield). Instead, pivot to **Scientific Pragmatism** or **Local Realism**.

  Given your hypothesis that this is a disagreement about "what counts as evidence," you would find fertile ground in the work of **Arthur Fine**. In 1984, he published *"The Natural Ontological Attitude" (NOA)*.
  *   **Fine's Argument:** He argued exactly what you are thinking. The Realist adds "And it's TRUE!" to scientific claims. The Anti-Realist adds "But it's ONLY EMPIRICALLY ADEQUATE!" Fine says: **Just accept the scientific claims as they are.**
  *   Scientists accept the existence of T-cells. They don't add a philosophical suffix. Fine argues the philosophical debate adds a layer of "metaphysical anxiety" that science doesn't need and can't resolve.

  ### Recommendation
  1.  **Accept your hypothesis:** The debate is stationary because it is a clash of normative standards (IBE vs. Empirical Caution) disguised as a debate about history.
  2.  **Abandon Global Realism:** Stop asking if "Science" is true. It's a category error.
  3.  **Read Ian Hacking (*Representing and Intervening*)**: This will resonate with your lab experience. It shifts the criterion of reality from "predictive success" (which allows for the Pessimistic Meta-Induction) to "causal intervention" (which is harder to dismiss as luck).
  4.  **Read Arthur Fine (*The Shaky Game*)**: It validates your suspicion that the debate itself is the problem, not the science.

  **Conclusion:**
  You haven't hit a wall because you're missing something; you've hit a wall because the corridor ends there. The "Realism Debate" in its traditional form is a philosophical artifact. The progress lies in ignoring the global question and asking local ones: *In this specific domain, with this level of instrumental control, are we justified in treating these entities as causal agents?*

  That is a question a retired immunologist is better equipped to answer than a philosopher.
