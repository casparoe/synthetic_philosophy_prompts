prompt: |-
  my study group (we've been reading population ethics + animal welfare stuff all semester) has an argument that ends somewhere we can't accept, and we can't find where it breaks. you're a professional philosopher who works on population ethics and animal welfare, so please think carefully and maybe do a little brainstorming before committing to a diagnosis. here's the argument:

  (1) suffering is bad and wellbeing is good, no matter whose it is -- human, chimp, insect.
  (2) in nature, r-selection means most animals born die very young, and even those that survive face constant hunger, fear, parasitism, and disease. on any plausible weighting, the average wild animal's life contains more suffering than wellbeing.
  (3) so the average wild animal life is not worth living.
  (4) habitat destruction -- burning a forest for pasture, draining a wetland -- prevents huge numbers of wild animals from ever existing.
  (5) preventing a life not worth living is good, so habitat destruction is pro tanto good: not just excusable as a side effect of things we want anyway, but a positive moral reason to do it.
  (6) nothing in the reasoning limits this to habitat we'd destroy anyway, so paving over the last unbroken wilderness for no human benefit at all would also be good, provided the paving itself is quick.
  (7) that's monstrous, so something up there is wrong.

  the person who brought it says the argument just refacts hedonic utilitarianism and we should accept (7) minus the moralizing -- call it a refutation of the total view. i suspect something slid between (5) and (6), because "pro tanto" and "all things considered" are doing a lot of quiet work, but i also can't dismiss the feeling that the slide from (3) to (5) is where the cheat is -- "a life not worth living" seems to mean two different things, one about the ledger and one about the animal. tell me which step to reject, why it looked fine, and what rejecting it costs. i'll tell you now that i want to keep (1) and i want to keep thinking wild animal suffering is a real and huge problem, so if your diagnosis makes me give up one of those, be honest about the price.
