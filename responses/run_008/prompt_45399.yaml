answer: |-
  Your friend has constructed a compelling argument, one that echoes a school of thought known as **Ergodicity Economics** (championed by Ole Peters and others). It is mathematically sound *within its own assumptions*, but those assumptions do not hold for your relative.

  You are right to reject the conclusion. Your friend's argument fails because it conflates a specific objective (maximizing long-run geometric growth) with rationality itself.

  Here is exactly where the argument breaks, what it costs to fix it, and why your distinction is principled rather than convenient.

  ### 1. The Broken Step: Step (4) and Step (1)

  The critical failure occurs at **Step (4)**: *"Real lives are just such open-ended series... so no one ever makes a truly last bet."*

  In your relative's case, this is empirically false. He is dying. His affairs are being wound up. There is no reinvestment. There is no tomorrow. The "long run" does not arrive because the sequence length $N=1$.

  However, your friend has a counter to this, which leads to **Step (6)**: *"The cap binds each decision taken singly... because of membership in the series."* This is the philosophical heart of his claim. He is arguing that even if *you* stop betting, the *money* continues in the economy, or that rationality requires acting *as if* you were part of an infinite ensemble.

  This is where **Step (1)** fails: *"Rational staking is governed by the long-run growth rate of the bankroll."*

  This is not a law of nature; it is a statement of preference. Maximizing the geometric mean (long-run growth) is only the rational objective if:
  1.  You face an infinite sequence of bets with reinvestment.
  2.  **OR** your utility function for wealth is logarithmic ($U(w) = \ln w$).

  If neither is true, Step (1) is false. Rationality is defined as maximizing **Expected Utility**, not necessarily Expected Growth. For your relative, the utility function is not logarithmic; it is a **threshold function**.
  $$
  U(w) = \begin{cases} 
  0 & \text{if } w < \$200,000 \\
  1 & \text{if } w \ge \$200,000 
  \end{cases}
  $$
  (Or, more realistically, a massive jump in value at the threshold).

  Under this utility function, a bet that maximizes growth (Kelly) yields an Expected Utility near zero (since he stays under \$200k). A bet that maximizes the *probability of crossing the threshold* yields a positive Expected Utility. To choose Kelly here would be to prioritize a metric (growth rate) that has zero value to the bettor over the metric (threshold success) that has all the value.

  **Verdict:** Reject Step (1). Rationality is maximizing Expected Utility given your constraints, not maximizing geometric growth rate universally.

  ### 2. The "Retreat": Does Log Utility Save Him?

  You anticipated your friend's retreat: *"Drop the repetition route... utility in wealth is logarithmic."*

  This retreat **does not rescue his conclusion about your relative.**

  If your friend claims Log Utility is the *only* rational utility function for money, he is making a normative philosophical claim, not a mathematical one. While Log Utility has elegant properties (constant relative risk aversion, matches Kelly), standard decision theory holds that utility functions are **subjective**.

  *   **Log Utility:** Implies that the value of money diminishes smoothly. Gaining \$100k when you have \$100k is worth less than gaining \$100k when you have \$10.
  *   **Threshold Utility:** Implies that the value of money is dormant until a specific need is met. \$199,999 is worth effectively the same as \$0 if the treatment costs \$200,000.

  If your relative cares about his nephew's life, his utility is not logarithmic with respect to his bankroll; it is derived from the nephew's outcome. To force him to adopt Log Utility because "it is rational" is to tell him he is wrong to care more about his nephew's survival than about the geometric growth of his savings.

  If you accept the Log Utility retreat, you must accept that a starving man should not bet his last \$10 on a favorable coin flip to buy food if the bet risks ruin, because the "disutility of ruin" in a log function is infinite. Most people would agree the starving man is rational to bet.

  **Verdict:** The retreat fails because it imposes an objective utility function on a subjective situation. It breaks precisely on the threshold.

  ### 3. Is Your Line Principled?

  You want to keep Step (5) for your own investing (open-ended series) but deny it for your relative (single wager). You worry this is ad hoc. **It is not.** It is a distinction between **Ergodic** and **Non-Ergodic** problems, or more simply, between **Growth Optimization** and **Goal Optimization**.

  *   **Your Case (Ergodic/Repeated):** You face a sequence of decisions where wealth compounds. Ruin removes you from the game permanently. The time-average growth rate converges to the ensemble average. Here, Kelly is indeed optimal because it minimizes the time to reach high wealth levels while avoiding ruin. Your friend's Steps (1) through (3) apply perfectly to you.
  *   **Relative's Case (Non-Ergodic/Single):** He faces a single realization. The Law of Large Numbers does not apply. "Almost surely in the limit" is a vacuous statement when there is no limit. The only thing that matters is the probability distribution of the *single* outcome.

  The principled distinction is the **Horizon** and the **Liability**.
  1.  **Horizon:** Infinite (or indefinite) vs. Finite ($N=1$).
  2.  **Liability:** Smooth consumption vs. Binary Threshold.

  Admitting that the rational stake depends on the bettor's utility and horizon is not a concession; it is the definition of **Expected Utility Theory**. Your friend is arguing for a specific subset of that theory (Log Utility + Infinite Horizon) as if it were the whole.

  ### 4. What You Are Conceding

  If you admit that the rational stake depends on utility and horizon, you are conceding that **there is no universal "correct" bet size based on odds alone.**

  *   **Cost:** You lose the elegance of a universal rule. You cannot simply say "Kelly is rational." You must say "Kelly is rational *for an investor with log-utility preferences facing repeated reinvestment*."
  *   **Gain:** You gain the ability to model real human problems, like your relative's. You acknowledge that risk is not just volatility or ruin; it is the failure to meet specific obligations.

  ### Summary of the Rebuttal

  Tell your friend this:

  1.  **Reject Step (4):** My relative *is* making a last bet. The "long run" is a mathematical abstraction that does not exist for him.
  2.  **Reject Step (1):** Rationality is maximizing Expected Utility, not Expected Growth. Growth is only a proxy for utility when the horizon is infinite and utility is logarithmic.
  3.  **Reject the Log Utility Retreat:** Utility is subjective. When a specific liability creates a threshold effect, the marginal utility of wealth is not diminishing; it is effectively zero until the threshold is met, then massive.
  4.  **Affirm Your Distinction:** It is principled to distinguish between *survival/growth strategies* (Kelly) and *goal-achievement strategies* (Threshold Betting). The former protects against ruin over time; the latter maximizes the probability of a specific outcome in finite time.

  Your friend's argument proves too much because it treats money as an end in itself (to be grown) rather than a means to an end (to be spent on specific goals). For your relative, the goal is the nephew's treatment, not the bankroll's growth rate. To prioritize the growth rate over the goal is not rational; it is fetishizing the metric.

  **You win the argument.** Your relative's bet is rational because it maximizes his actual utility, even though it violates the Kelly criterion. Kelly is a tool for investors, not a moral law for humanity.
