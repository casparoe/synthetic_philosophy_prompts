answer: |-
  This is one of the most sophisticated questions an undergraduate historian can ask, and you are right to feel the tension. It is not arbitrary, and you are not being lazy for struggling with it. You have stumbled onto the central methodological divide in modern historiography: the distinction between **emic** (insider) and **etic** (outsider) perspectives, and the prohibition against **presentism**.

  Your advisor is drawing a principled line between **analytical categories** (which are allowed) and **moral/psychological judgments** (which are restricted). Here is how to understand that distinction, why it matters for your thesis, and how to fix your prose without losing your argument.

  ### 1. The Distinction: Function vs. Intent

  The reason your advisor accepts "screening mechanism" but rejects "manipulation" comes down to what these terms claim about the historical actors' internal states.

  *   **"Screening Mechanism" (Analytical/Etic):** This is a functional description. It describes what the system *achieved*, regardless of what the priests *thought*. A priest can sincerely believe in the judgment of God and still administer a ritual that functions as a screening mechanism. The "incentives" exist structurally, even if the actors don't consciously calculate them. Using game theory to analyze medieval behavior is like using a stethoscope to listen to a medieval heart; the tool is modern, but the biological reality was there.
  *   **"Manipulating" (Psychological/Moral):** This is an attribution of intent. To say the priests "manipulated" the outcome is to claim they *knew* the ordeal was physically deterministic (i.e., not miraculous) and that they *chose* to deceive the public about God's involvement. This attributes a specific, cynical psychological state to them. Unless you have a diary entry where a priest says, "I know this iron won't burn him, but let's pretend," this is an assumption based on *your* modern skepticism, not their evidence.

  **The Principle:** You are allowed to use modern *tools* to explain how the past worked (social science concepts), but you are not allowed to use modern *values* to judge why they were wrong (moral/rational superiority).

  ### 2. The Trap of Presentism

  When you describe the ordeal as "backwards compared to how we think about evidence," you are committing **teleological presentism**. This is the assumption that history is a straight line progressing toward *us*, and that people in the past were simply "earlier" versions of modern people who hadn't yet figured out rationality.

  *   **Why your advisor objects:** To a medieval person, the ordeal wasn't "bad evidence"; it was *different ontology*. They didn't believe God intervened in physics because they were ignorant of thermodynamics; they believed physics was subordinate to theology. Calling it "backwards" implies they *should* have thought like us.
  *   **The fix:** Instead of "backwards," describe it as "divergent." Instead of "irrational," describe it as "theologically coherent."

  ### 3. The "Leeson" Paper and the Clerical Role

  The paper you read is almost certainly Peter Leeson's *"Ordeals"* (2012), which applies economic theory to this exact topic. Leeson argues that the ordeal was a "rational" institution.

  However, even Leeson is careful. He suggests that priests *could* have manipulated outcomes to maintain the system's credibility, but he frames it as a structural necessity for the institution's survival, not necessarily as individual moral failing.

  Your advisor wants you to stick to the **structural analysis** (the system screened people) rather than the **conspiracy theory** (the priests were faking it).
  *   **Allowed:** "The clerical administration of the ordeal created conditions where confession was incentivized prior to the event."
  *   **Not Allowed:** "The priests tricked people into confessing so they wouldn't have to heat the iron."

  The first describes the *effect* of the ritual. The second describes the *motives* of the men.

  ### 4. How to Rewrite Without Losing the Insight

  You can keep your argument intact by shifting from **accusation** to **observation**. You don't need to claim the priests were liars to show the system was managed.

  **Example 1:**
  *   *Current:* "Priests manipulated the temperature of the iron to ensure innocent verdicts."
  *   *Revision:* "Clerical control over the preparation of the iron allowed for discretion in the administration of the ordeal."
      *   *Why:* "Discretion" is neutral. "Manipulated" implies deceit.

  **Example 2:**
  *   *Current:* "The system was backwards because they relied on superstition rather than evidence."
  *   *Revision:* "The system prioritized divine testimony over human witness, reflecting a hierarchy of truth distinct from modern evidentiary standards."
      *   *Why:* This acknowledges the difference without ranking them.

  **Example 3:**
  *   *Current:* "Guilty people were manipulated into confessing by the threat of the ordeal."
  *   *Revision:* "The threat of the ordeal functioned as a screening mechanism, inducing confessions from those who feared divine judgment."
      *   *Why:* This credits the *believers'* sincerity (they feared God) rather than the *priests'* deceit.

  ### 5. Why the Thread Doesn't Unravel

  You asked: *"If I have to drop the modern judgments... why don't I also have to drop the modern concepts?"*

  The answer is that **concepts are tools, judgments are verdicts.**
  *   If a biologist studies a beaver dam, they might use terms like "hydraulic pressure" and "structural integrity." The beaver doesn't know those terms. That is fine. The concepts explain the *reality* of the dam.
  *   However, if the biologist writes, "The beaver's dam is inefficient compared to a concrete levee," they have stopped doing biology and started doing engineering criticism.

  You are the historian (the biologist). The priests are the actors (the beavers). You can use "screening mechanisms" (hydraulic pressure) to explain how their society held together. You cannot use "manipulation/backwards" (inefficient concrete) to judge their moral or intellectual failure.

  ### Summary Advice for Your Thesis

  1.  **Trust the Advisor:** She is protecting you from a common undergrad pitfall. Historians who accuse the past of being "stupid" or "crooked" without ironclad proof lose credibility.
  2.  **Sincerity is a Variable:** Assume the priests *might* have believed. If the system worked *even if they believed*, your argument is stronger. If the system *only* works if they were lying, your argument is fragile.
  3.  **Use "Etic" Language:** It is perfectly acceptable to use vocabulary the actors wouldn't recognize (incentives, selection bias, social cohesion) as long as you are using them to **explain**, not to **condemn**.

  You are asking the right questions. The tension you feel is the friction of doing real history. Keep the modern tools, drop the modern gavel.
