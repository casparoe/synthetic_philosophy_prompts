  ### Notebook Entry: Protocol for Theoretical Surrender
  **Subject:** Necessary Conditions for Abandoning Illusionism
  **Status:** Draft Specification v.4

  To concede that phenomenal consciousness (P-consciousness) is ontologically real rather than a user-illusion generated by cognitive architecture, a competing theory $T$ must satisfy the following constraints. Failure on any single point retains the null hypothesis (Illusionism).

  #### I. Empirical Adequacy (The Negative Constraints)
  $T$ must not contradict established neuroscientific data.
  1.  **Dissociation Data:** $T$ must accommodate cases where reportability/access diverges from apparent phenomenality.
      *   *Case:* **Blindsight.** Subjects deny seeing stimuli but guess correctly. $T$ must explain why access without phenomenality is possible (supporting the distinction) or why the phenomenality was merely inaccessible (supporting the unity).
      *   *Case:* **Dreaming.** High phenomenality with low sensory input and often no memory/reportability upon waking. $T$ cannot tie phenomenality strictly to real-time sensory binding or post-hoc report.
      *   *Case:* **Pain Asymbolia.** Subjects report pain intensity ("it is sharp") without negative affect ("it doesn't bother me"). $T$ must distinguish the sensory qualia from the affective valence without reducing one to the other.
  2.  **Neural Correlates:** $T$ must be compatible with NCC research. It cannot posit phenomenality in regions shown to be inactive during reported experience, nor deny it in regions where stimulation induces experience (e.g., V1 stimulation causing phosphenes).

  #### II. Explanatory Scope (The Positive Constraints)
  $T$ must explain the specific features of the "hard problem" data set, not merely predict behavior.
  3.  **The Explanatory Gap:** $T$ must bridge the logical gap between physical/functional description and subjective appearance. It is insufficient to map functions; $T$ must derive *why* those functions are accompanied by felt quality.
      *   *Consideration:* **Zombie Intuition.** If $T$ allows for a logically coherent zombie (functionally identical but dark inside), $T$ has failed to explain the necessity of the phenomenon.
  4.  **The Knowledge Argument:** $T$ must resolve the case of **Mary the Color Scientist**. If Mary knows all physical facts but learns something new upon seeing red, $T$ must identify the ontological status of that new knowledge. Is it a new fact about the world, or a new mode of presentation? If the latter, $T$ must explain why this mode constitutes a *real property* rather than a representational format.
  5.  **The First/Third-Person Asymmetry:** $T$ must explain why my access to my own pain is immediate and incorrigible (seemingly), while your access to my pain is inferential. $T$ cannot simply assert this asymmetry; it must derive it from the theory's mechanics.

  #### III. Conceptual Hygiene (Distinctions to Maintain)
  $T$ must not dissolve the target phenomenon by redefining terms.
  6.  **Phenomenal vs. Access Consciousness:** $T$ must not collapse P-consciousness (what it is like) into A-consciousness (availability for report/reasoning).
      *   *Consideration:* **Subliminal Perception.** Information can be accessed/primed without phenomenality. If $T$ defines consciousness as access, it fails to capture the "light" that illuminates the access.
  7.  **Eliminativism vs. Reduction:** $T$ must not claim to "reduce" qualia to functions if the reduction eliminates the normative force of the experience.
      *   *Consideration:* **Pain.** To say pain *is* C-fiber firing (or global broadcasting) is acceptable only if the *hurtfulness* is preserved in the reduction. If the reduction explains the behavior but leaves the "hurt" as an optional extra, it is eliminativism in disguise.
  8.  **Illusion of Experience vs. Experience of Illusion:** $T$ must distinguish between a system falsely reporting it has experience (illusion of experience) and a system accurately reporting a misleading stimulus (experience of illusion, e.g., Müller-Lyer).
      *   *Consideration:* **The Meta-Problem.** $T$ must explain why we *judge* ourselves to be conscious. If $T$ explains this judgment solely via unconscious mechanisms, it validates Illusionism. To defeat Illusionism, $T$ must show the judgment is veridical.

  #### IV. The Meta-Constraint (The Closure Condition)
  9.  **No Unexplained Seemings:** In explaining why it seems there is something it is like to be me, $T$ must not help itself to unexplained seemings as primitive premises.
      *   *Consideration:* **Circularity.** You cannot explain the appearance of consciousness by positing a little man inside who sees the show (homunculus). The explanation must bottom out in non-phenomenal mechanics that necessitate the phenomenon.
  10. **Veridicality Condition:** To convince me the phenomenon is *real*, $T$ must demonstrate that the "seeming" is a veridical perception of a property, not a constructive error.
      *   *Consideration:* **The Hard Problem.** If the "seeming" is all there is (as I currently hold), $T$ must show what the seeming is *of*.

  ***

  ### Analysis of the Specification

  Here is the breakdown of your character's draft, distinguishing rigorous standards from philosophical baggage, followed by an evaluation of the tension you suspected.

  #### 1. Genuine Desiderata vs. Camp Prejudices
  *   **Genuine Desiderata:**
      *   **Empirical Adequacy (I.1 & I.2):** Any scientific theory must fit the data (blindsight, lesions, dreaming). This is non-negotiable.
      *   **Conceptual Hygiene (III.8):** Distinguishing the *illusion of experience* from the *experience of illusion* is a crucial logical distinction. Confusing them leads to category errors.
      *   **No Unexplained Seemings (IV.9):** This is a standard requirement for reductive explanation. You cannot explain $X$ by positing $X$ as a brute fact.
  *   **Prejudices Smuggled as Standards:**
      *   **The Zombie Intuition (II.3):** Demanding that a theory rule out philosophical zombies is begging the question against physicalism. Many physicalists argue zombies are *not* logically coherent, only *conceivable*. Requiring a theory to close the "logical gap" assumes the gap is ontological rather than epistemic.
      *   **Incorrigibility (II.5):** Demanding an explanation for why access seems "incorrigible" assumes it *is* incorrigible (or that the seeming requires a special property). Illusionists argue the seeming of incorrigibility is itself part of the illusion (a lack of access to the error-checking processes).
      *   **Veridicality Condition (IV.10):** This is the core prejudice. She demands the theory prove the seeming is *veridical*. But if Illusionism is true, the seeming is *non-veridical* by definition. She is setting a condition that requires her opponent to prove her wrong by assuming she is right about what "real" means (i.e., matching the intuition).

  #### 2. Joint Unsatisfiability: The Tension
  Your suspicion is correct. There is a genuine tension, arguably a contradiction, between **Constraint IV.9 (No Unexplained Seemings)** and **Constraint IV.10 (Veridicality Condition)**, given the current state of physics.

  *   **The Tension:** To satisfy **IV.10** (prove the seeming is real/veridical), the theory must posit phenomenal properties as real constituents of the world. However, since physical science currently has no place for phenomenal properties, positing them looks like positing a "brute fact" or a magic ingredient. This violates **IV.9** (No Unexplained Seemings), because you are using the phenomenon to explain the appearance of the phenomenon without explaining *how* the physical generates it.
  *   **The Illusionist Escape:** Illusionism satisfies **IV.9** easily (it explains the seeming using only unconscious mechanisms) but fails **IV.10** by definition (it denies veridicality).
  *   **The Realist Trap:** Realist theories (like Panpsychism or Dualism) satisfy **IV.10** but often violate **IV.9** (they posit consciousness as fundamental/unexplained). Physicalist Realists (like Identity Theorists) try to satisfy both but often stumble on the **Explanatory Gap (II.3)**, leaving the "why it feels like" question unanswered.
  *   **Verdict:** The subset is jointly unsatisfiable *for a reductive physicalist*. You cannot currently explain *why* physical processes feel like something (IV.10) without either leaving the feeling unexplained (violating IV.9) or explaining it away (violating IV.10). This is the Hard Problem. Your character has correctly identified the deadlock.

  #### 3. Theory Scoring
  **Illusionism** passes the empirical and conceptual hygiene tests with flying colors and solves the Meta-Constraint (IV.9) by denying the Veridicality Condition (IV.10). It is the only theory that doesn't posit magic, but it fails the character's ultimate goal: it cannot make her concede the phenomenon is *real*, only that the *belief* is real. **Global Workspace Theory (GWT)** scores high on Empirical Adequacy and Access distinctions but collapses Phenomenal into Access Consciousness (violating III.6), effectively functioning as a "soft" illusionism that pretends to be realism; it explains broadcasting, not the "light" of the broadcast. **Higher-Order Thought (HOT)** handles the asymmetry and dissociations well (distinguishing state from awareness of state) but struggles with targetless states (free-floating anxiety) and risks an infinite regress (violating IV.9); it explains the *awareness* of experience, but critics argue it leaves the *quality* of the first-order state unexplained. None of the three satisfy the full specification; GWT and HOT fail on the "Hard Problem" constraints, while Illusionism fails on the "Veridicality" constraint. Your character remains undefeated because the specification demands a physicalist theory perform dualist magic.
