answer: |-
  Marcus stands in Elena's kitchen and says, "I promise to return your book tomorrow." In their linguistic community, uttering the phrase "I promise to X" under standard conditions creates an institutional fact known as "having promised," and the constitutive rules of this institution specify that the speaker performs X. Marcus is physically capable of returning the book. The book belongs to Elena. Marcus concludes from these facts alone that he is morally obligated to return the book, arguing that the institutional fact of the promise logically entails the moral obligation without needing any extra moral premise.

  **Audit**

  **Premises:**
  1.  Marcus uttered the sounds "I promise to return the book." (Descriptive)
  2.  In this community, uttering those sounds creates the status "having promised." (Descriptive/Sociological)
  3.  The constitutive rules of "having promised" specify that the speaker performs the act. (Descriptive/Institutional)
  4.  Marcus is capable of performing the act. (Descriptive)
  **Conclusion:**
  5.  Marcus morally ought to return the book. (Normative)

  **Covertly Normative Premises:**
  Premise 3 is the breaking point. While framed as a description of "rules," the move from "the rules specify performance" to "the speaker is *morally obligated* to perform" requires a hidden bridge premise: "One ought to follow the constitutive rules of this institution." Without that bridge, the rules are merely descriptions of social pressure, not moral binds.

  **The Humean Block:**
  A Humean would stop the inference at the conclusion. They would argue that no amount of descriptive facts about utterances, social statuses, or institutional rules can logically generate a moral "ought" without at least one normative premise (e.g., "You ought to keep your promises" or "You ought to follow institutional rules"). The derivation is deductively invalid as stated because the conclusion contains a predicate ("morally obligated") that does not appear in the purely descriptive premises.

  **Moore's Open Question Test:**
  Moore's test adds a semantic layer to Hume's logical point. Even if we grant the institutional facts, it remains meaningful to ask: "I know Marcus promised (institutional fact), but *ought* he to keep it?" If "ought" were fully contained within the descriptive facts of promising, this question would be self-contradictory (like asking "Is a bachelor unmarried?"). Because the question remains open and intelligible, "ought" cannot be reduced to the descriptive properties of the promise. Moore shows that the *meaning* of the moral term isn't captured by the description, whereas Hume shows the *logic* of the argument is incomplete.

  **The Smuggling Word:**
  The word is **"promise."** In Premise 1 and 2, it appears to be a descriptive label for a speech act, but it carries the normative weight of "undertaking an obligation." If we are banned from using "promise" and must replace it with a purely physical description (e.g., "Marcus uttered sounds X which cause expectation Y"), the derivation collapses. The conclusion no longer follows because "causing expectation" does not logically entail "moral obligation" without the smuggled normative assumption that disappointing expectations is wrong.

  Verdict: gap holds
