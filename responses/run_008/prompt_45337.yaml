answer: |-
  **Project Title:** Operationalizing Representational Novelty in Few-Shot Concept Induction

  **Abstract**
  This project investigates the empirical tractability of the distinction between feature selection and feature invention in artificial vision systems. Using Bongard-style problems as a controlled testbed, I will probe pre-trained models to determine whether "novel" concept acquisition leaves a distinguishable signature in representational geometry or learning dynamics compared to the selection of pre-existing features. The goal is not to solve concept induction, but to determine whether the theoretical distinction central to classical cognitive science survives contact with modern mechanistic interpretability.

  **Research Question**
  In the literature on concept acquisition, a standard distinction is drawn between (a) systems that select a relevant feature from a pre-existing repertoire and (b) systems that construct a new descriptor to solve a task. Classical arguments (e.g., Bongard, Hofstadter) assume this distinction is real and crucial for explaining human-like flexibility. Modern ML benchmarks often assume the opposite: that sufficient scaling renders the distinction moot. However, both sides rely on a circular criterion: to identify "invention," one must already know the system's representational base.

  This project asks: **Is there an operational, non-circular criterion for representational novelty observable in the learning dynamics or internal states of neural networks?** If the distinction is real, systems solving problems requiring "invention" should exhibit different probing signatures or data-efficiency profiles than those merely "selecting" features. If no such signature exists, the distinction may be a folk-psychological artifact unfit for mechanistic explanation.

  **Background and Significance**
  Bongard problems require identifying a rule distinguishing two sets of figures based on few examples. Recent synthetic benchmarks (e.g., Bongard-LOGO) allow for programmatic control over rule complexity. While current vision models perform above chance, the mechanism remains opaque. Standard accounts treat the network as a black box that either generalizes or memorizes. This ignores the intermediate possibility: that the network possesses a fixed basis set of features and merely reweights them.

  Philosophically, this mirrors Fodor's critique of concept learning: you cannot learn a concept unless you already have the representation for it. ML practitioners often dismiss this as irrelevant to engineering, but for cognitive science, the difference between *accessing* a representation and *constructing* one is the difference between association and reasoning. This project bridges that gap by treating the neural network not as a model of mind, but as a test case for whether the selection/invention distinction is empirically decidable.

  **Methodology and Work Plan**
  I will utilize existing pre-trained vision models (e.g., CLIP, ViT) and established Bongard-style benchmarks. I will not train models from scratch; instead, I will use linear probing and fine-tuning to assess representational content. The core experimental manipulation involves comparing tasks designed to be solvable via feature selection versus tasks requiring compositional generalization beyond the pre-training distribution.

  *   **Months 1–3: Benchmarking and Baseline Probing.**
      *   Select a subset of Bongard-LOGO problems categorized by rule complexity (primitive features vs. relational combinations).
      *   Establish baseline performance on frozen pre-trained models using linear probes on layer activations.
      *   Identify which problems are solvable via linear separation (suggesting feature selection) versus those requiring non-linear fine-tuning.

  *   **Months 4–6: Constructing the "Novelty" Test.**
      *   Generate out-of-distribution (OOD) test cases where surface features change but deep structural rules remain constant.
      *   If a model solves these OOD cases without retraining, it suggests the abstract rule was already represented (selection). If it requires fine-tuning but learns quickly, it suggests adaptation (potential invention).
      *   Apply representational similarity analysis (RSA) to compare activation patterns during "selection" vs. "adaptation" tasks.

  *   **Months 7–9: Learning Dynamics Analysis.**
      *   Measure the "cost" of acquisition (gradient steps required to reach threshold performance) for selection vs. adaptation tasks.
      *   Hypothesis: If "invention" is distinct, it should incur a higher computational cost or show distinct trajectory patterns in loss landscapes compared to selection.
      *   Draft initial findings for conference submission (e.g., CogSci, NeurIPS workshops).

  *   **Months 10–12: Synthesis and Philosophical Analysis.**
      *   Evaluate whether the observed differences support a categorical distinction or a continuum.
      *   Write final fellowship paper: *Is Representational Novelty Detectable?*
      *   Prepare manuscript for journal submission (e.g., *Philosophy of Science*, *Cognitive Science*).

  **Expected Outcomes and Decision Criteria**
  1.  **Positive Result:** Distinct representational signatures (e.g., specific layer involvement, distinct learning curves) are found for "novel" vs. "selected" concepts. This would validate the classical distinction as empirically tractable in artificial systems.
  2.  **Null Result (Empirical):** Performance and internal dynamics are indistinguishable across task types. This suggests the distinction does not map onto mechanistic reality in neural networks, supporting a behaviorist or connectionist monism.
  3.  **Null Result (Conceptual):** The operational definitions required to run the experiment inevitably presuppose the very distinction being tested. This would support the claim that "representational novelty" is not a natural kind.

  **Failure Conditions and Risks**
  The primary risk is that the project concludes the distinction is unfalsifiable. While philosophically interesting, this would count as a failure of the *experimental* aim to operationalize the concept. Specifically, if probing techniques prove too coarse to distinguish reweighting from construction, or if the "out-of-distribution" tasks inevitably leak statistical cues available in pre-training, the project cannot adjudicate the debate.

  Additionally, there is a risk of triviality: if "novelty" simply reduces to "distance in embedding space," the project may confirm what ML engineers already assume without advancing the philosophical debate. I will mitigate this by pre-registering the criteria for what would count as a qualitative vs. quantitative difference in learning dynamics. If the project fails to find a criterion that isn't merely behavioral or circular, the final output will explicitly argue for dissolving the distinction rather than preserving it.
