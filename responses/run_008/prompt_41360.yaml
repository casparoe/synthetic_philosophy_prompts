  | **Causation** | "Mental states cause behavior." | "Mental states are not epiphenomenal; they figure in causal explanations." | Identity theorists worry functional properties are causally inert shadows; Functionalists worry identity collapses the mental into the neural. Both want causal efficacy preserved. |
