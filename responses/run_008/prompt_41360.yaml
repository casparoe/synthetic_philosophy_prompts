  # JOINT STATEMENT ON THE METAPHYSICS OF MENTAL STATES
  **An Adversarial Collaboration between Functionalism and Type-Identity Theory**

  **Date:** October 26, 2023
  **Signatories:** [Functionalist Representative], [Type-Identity Theorist Representative]
  **Facilitated By:** [Philosopher of Mind]

  ## Preamble
  We, the undersigned, acknowledge that while we share a commitment to a naturalistic understanding of the mind, we diverge on the metaphysical status of mental state types. This document codifies our common ground, specifies the exact locus of our disagreement, and identifies the empirical and theoretical cruxes that would adjudicate between our positions. We agree that this dispute is substantive, not merely terminological, though verbal imprecision has historically obscured the core issues.

  ## 1. Shared Commitments
  *We jointly affirm the following claims. These are intended to be non-vacuous and neutral regarding the specific resolution of the MR vs. Identity debate.*

  1.  **Rejection of Substance Dualism:** We agree that mental states are not properties of a non-physical substance. Mental phenomena depend entirely on physical systems. Any viable theory must be compatible with the causal closure of the physical domain.
  2.  **Causal Efficacy:** We agree that mental states are causally relevant to behavior and other mental states. We jointly reject epiphenomenalism. Any theory that renders mental properties causally inert is prima facie deficient.
  3.  **Empirical Dependence:** We agree that philosophical speculation regarding the mind is constrained by empirical data from neuroscience, psychology, and evolutionary biology. Neither armchair analysis nor raw data alone is sufficient; interpretation of data requires theoretical frameworks.
  4.  **Provisional Taxonomy:** We agree that current folk-psychological categories (e.g., "pain," "belief") and current neuroscientific categories (e.g., "C-fiber firing," "NMDA receptor activation") are provisional. Neither side claims that current vocabulary perfectly maps onto the ultimate "joints of nature."
  5.  **The "Mature Neuroscience" Standard:** We agree that a "mature" neuroscience is one that maximizes predictive accuracy and explanatory depth. We disagree on what this looks like (see Section 2), but agree that the ideal science must account for both structural mechanisms and behavioral capacities.
  6.  **Acknowledgement of Verbal Elements:** We acknowledge that a portion of our historical debate stems from differing criteria for *individuating* types. We agree to distinguish between disputes about the *words* we use (e.g., whether to call two distinct neural states by the same mental name) and disputes about the *world* (e.g., whether those two states share a genuine higher-order property).

  ## 2. Table of Residual Disagreements
  *The following table outlines the substantive disagreements remaining after accepting Section 1. Each position is phrased to be endorseable by its proponent without concession.*

  | Domain of Dispute | Functionalist Position | Type-Identity Theorist Position |
  | :--- | :--- | :--- |
  | **Metaphysical Status of MR** | Multiple realizability is a **metaphysical feature** of mental kinds. Mental state types are abstractable from their physical realizers because their identity is constituted by their causal role, not their constituent material. | Multiple realizability is an **epistemic artifact** of coarse-grained classification. As science matures, apparent MR will dissolve into specific type-identities relative to specific structural contexts (e.g., "human-pain" vs. "octopus-pain"). |
  | **Grain-Level Refinement** | Refining neural descriptions to eliminate MR is **ad hoc retreat**. It sacrifices the generality required for psychological explanation. If we split types every time the substrate changes, we lose the ability to generalize across organisms. | Refining neural descriptions to eliminate MR is **progressive scientific carving**. It aligns our taxonomy with the actual causal mechanisms. Generality bought at the cost of ignoring mechanistic differences is illusory. |
  | **Nature of Psychophysical Laws** | Psychophysical bridge principles will be **many-to-one** (multiple physical types map to one functional type). The special sciences (psychology) are autonomous from fundamental physics. | Psychophysical bridge principles will be **one-to-one** (relative to a specified domain). Psychology will ultimately be integrated into a unified neuroscience without remainder. |
  | **Individuation Criteria** | Mental states are individuated by **relational properties** (inputs, outputs, relations to other states). Two systems share a mental state if they share the relevant causal topology, regardless of internal constitution. | Mental states are individuated by **intrinsic physical properties**. Two systems share a mental state only if they share the relevant physical constitution (or sufficiently isomorphic physical structure). |

  ## 3. Cruxes: Adjudicating the Dispute
  *We identify the following two cruxes as the primary drivers of our disagreement. For each, we specify the kind of evidence that bears on the issue and record our divergent predictions.*

  ### Crux A: The Precision of Functional Individuation
  **The Issue:** Whether causal-role individuation can be made precise without collapsing into either wildly disjunctive types (e.g., "State X OR State Y OR State Z...") or triviality (e.g., "whatever causes behavior"). The Functionalist must show that functional roles are natural kinds; the Identity Theorist must show that functional descriptions inevitably mask mechanistic differences that matter for causation.

  *   **Relevant Evidence:** Comparative neuroscience and computational modeling. Specifically, investigations into whether systems with radically different physical architectures (e.g., biological vs. silicon, or phylogenetically distant species) can sustain identical input-output mappings *and* internal processing dynamics without divergence in performance or learning trajectories.
  *   **The "Lookup Table" Test:** If a system behaves identically to a human but relies on a brute-force lookup table rather than distributed processing, does it instantiate the same mental states?

  | Party | Prediction |
  | :--- | :--- |
  | **Functionalist** | **Prediction:** We will find **convergent computational architectures** across diverse substrates. Even if molecular details differ, the *algorithmic level* will remain invariant. A lookup table would fail to sustain the *counterfactual* robustness of a mental state (it couldn't handle novel inputs), thus preserving the functional type as distinct from mere behavior. |
  | **Identity Theorist** | **Prediction:** We will find that **substrate details constrain computation**. "Identical" algorithms implemented on different substrates will inevitably diverge in latency, energy cost, or failure modes, meaning they are not truly the same type. The lookup table case proves that physical constitution *does* matter for type individuation, as we intuitively deny it has "mind." |

  ### Crux B: Causal Exclusion and the Psychophysical Bridge
  **The Issue:** Whether the causal exclusion worry gives the Functionalist a reason to envy the Identity Theorist's tighter psychophysical bridge. If neural states fully cause behavior, do functional states do any additional work? The Identity Theorist argues identity solves exclusion (mental cause = neural cause). The Functionalist argues realization allows for distinct causal explanations without overdetermination.

  *   **Relevant Evidence:** Intervention studies (e.g., optogenetics, TMS, lesion studies) that target specific neural mechanisms versus those that target functional network dynamics.
  *   **The "Conservation" Test:** What happens if we discover deep conservation or deep variation at the molecular level across species?

  | Party | Prediction |
  | :--- | :--- |
  | **Functionalist** | **Prediction:** **Deep Variation.** Neuroscience will reveal that molecular mechanisms for the same capacity (e.g., memory) vary wildly even between closely related species, while the functional capacity remains stable. This supports the claim that the *functional property* is the causally relevant variable, not the specific molecular realization. Exclusion is avoided because functional properties are realized *by* neural properties, not competitors to them. |
  | **Identity Theorist** | **Prediction:** **Deep Conservation.** Neuroscience will reveal that apparent cross-species realizability persists only until we look closely; at the level of ion-channel mechanisms or specific circuit motifs, we will find **unified neural types**. If "memory" turns out to be identical to "LTP in circuit C" across all instances, the Identity Theory is vindicated, and the Functionalist's "autonomous property" is revealed as a dispensable abstraction. |

  ## 4. Commitment to Revision
  We agree that should empirical findings strongly favor one set of predictions over the other, we are committed to revising our metaphysical commitments accordingly. We acknowledge that if Functional roles cannot be precisely defined without disjunction, Functionalism risks emptiness. We acknowledge that if neural types prove too fragmented to support psychological generalization, Identity Theory risks fragmentation.

  **Signed,**

  _________________________
  (Functionalist Representative)

