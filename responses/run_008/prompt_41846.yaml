  9.  **Self-Correction during drafting:** I initially thought about telling them to give 5% to insects. But if the EV is actually that skewed, 5% might be too little. However, given the uncertainty, a "significant reallocation" is the honest advice. I will argue that (6) is untenable. I need to make sure I don't sound like a zealot but like a logic checker. The user asked for a stress test, not a conversion, but they also asked for a verdict on consistency. The verdict is "Inconsistent."

      *Wait, one nuance:* The user says "I don't accept that a tiny probability of huge stakes should dominate." 5% is not "tiny" in the Pascal's Mugging sense. It's a standard risk. I need to hammer this point. Pascal's Mugging is $10^{-100}$. 5% is $5 \times 10^{-2}$. That's a difference of 98 orders of magnitude. Using (5) to block (6) given (3) is the crack.

      *Another nuance:* (2) Functionalism. If pain is functional, then the "tiny ganglia" objection in (3) is weak. A simple circuit can implement a feedback loop. This suggests (3) is the second biggest crack.

