answer: |-
  You asked for a dissection of the slogan perception is controlled hallucination, specifically to understand whether it supports the claim you encountered at work that wearing a VR headset and ordinary seeing are fundamentally the same kind of state. This is a fascinating intersection of cognitive science and philosophy of mind, and your intuition that something is being glossed over is well-founded. The slogan is often used in predictive processing circles, which is a legitimate and powerful framework in neuroscience, but it is frequently overloaded with metaphysical implications that do not necessarily follow from the science. To give you a clear map of the terrain, I will walk you through three distinct readings of the claim, ordered from the weakest and most scientifically uncontroversial to the strongest and most philosophically contentious. I will then explain how the philosophical position your friend mentioned, disjunctivism, challenges the strongest reading, and finally assess whether your colleagues are relying on an equivocation to make their point about VR.

  The weakest and most plausible reading of the slogan is purely computational and mechanistic. On this view, the claim is that the brain does not passively receive sensory data like a camera recording pixels onto a film. Instead, the brain constantly generates top-down predictions about what sensory input it expects to receive, and it only processes the difference between those predictions and the actual input, known as prediction error. When you see a coffee mug, your brain is already predicting the shape, color, and location of a mug based on context and memory, and the sensory signal merely confirms or corrects this model. This is the core of predictive processing theory, and it is widely accepted in contemporary neuroscience. It is a claim about how the system works, not necessarily about what you are aware of. Under this reading, the slogan means that the process of perception involves active modeling rather than passive copying. This reading is highly plausible and supported by evidence, but it does not support your colleagues' conclusion about VR. Just because the brain uses a model to process information does not mean the object of your experience is the model itself. Consider a GPS navigation system. It uses internal maps and models to guide you, and it corrects those models based on satellite signals. But when you follow the GPS, you are navigating the real streets, not navigating the internal map. The map is the medium of guidance, not the destination. Similarly, on this weak reading, the brain's model is the mechanism by which you see the world, not a veil that separates you from it. Therefore, this reading cannot sustain the argument that VR and ordinary seeing are the same kind of state, because in ordinary seeing the model is tightly coupled to real-world causality in a way that VR is not, even if the internal processing looks similar.

  Moving to a stronger reading, we shift from the mechanism to the vehicle of experience. This claim suggests that because the brain constructs the experience using internal resources, the qualitative character of what you see—the redness of the mug, the solidity of the table—is generated entirely within the head. In this sense, the experience is a hallucination that is controlled by sensory input. This is often what people mean when they say we never see the world directly. The argument here is that since neural activity is necessary and sufficient for experience, and neural activity is internal, what you are directly aware of must be internal. This view is sometimes called indirect realism or representationalism. It is philosophically coherent and fits comfortably with a materialist view of the mind. However, even this reading does not fully vindicate the VR argument without further assumptions. While it is true that the qualia are generated internally, it does not follow that the object of perception is the internal state rather than the external object. When you look through a window, the visual experience is generated by light passing through glass and hitting your retina, but you see the garden, not the glass. The glass is the transparent medium. Proponents of this view might argue the brain is not transparent, but opaque, yet the predictive processing story actually suggests the opposite: the brain aims to make the model transparent so you can interact with the world. If this reading is true, it suggests a similarity between VR and reality in that both involve internal generation of qualities, but it still leaves open the question of whether the relation to the external world is the same. In VR, the model is decoupled from the immediate environment; in reality, it is coupled. So while the vehicle is the same, the relationship to the world differs, which matters for design purposes regarding safety, presence, and truth.

  The strongest and most controversial reading is the one your colleagues are relying on to claim that seeing a mug and hallucinating a mug are fundamentally the same kind of state, differing only in control or accuracy. This is the claim that the immediate object of awareness is always the brain's model, never the world itself. On this view, veridical perception is just a hallucination that happens to match the world, while hallucination is a perception that fails to match. This implies a Common Kind Assumption, which states that because a hallucination and a veridical perception can be subjectively indistinguishable, they must share the same fundamental nature or underlying mental state. This is the metaphysical heavy lifting required to say that VR and reality are the same kind of state. If what you are aware of is always the render, then it doesn't matter where the error signal comes from; you are always trapped in the render. This reading is much less plausible than the first two because it relies on a specific philosophical argument that is far from settled. It forces us to accept that we are never in direct contact with reality, only with our representations of it. While this fits the game-engine metaphor perfectly, it is not a conclusion forced upon us by the neuroscience of predictive processing. The neuroscience tells us the brain builds a model, but it does not tell us that the model is what we see rather than what we see with. Asserting that we see the model is a philosophical leap, not a scientific finding. Consequently, this reading does support the VR conclusion, but only by begging the question against the intuition that there is a real difference between seeing a mug and hallucinating one.

  This brings us to the philosophical pushback your friend hinted at, known as disjunctivism. Disjunctivism is a position in the philosophy of perception that specifically targets the Common Kind Assumption I just described. The classic argument from illusion runs like this: in a hallucination, you are aware of something that is not there; in a veridical perception, it seems exactly the same; therefore, in both cases, you are aware of the same kind of thing, an internal sense datum or model. Disjunctivists reject the therefore. They argue that just because two states are indistinguishable from the inside does not mean they share the same fundamental nature. They propose that veridical perception and hallucination are fundamentally different kinds of states that merely happen to look the same to the subject. In the veridical case, your experience is constituted by the actual mug in the world; the mug is part of the experience. In the hallucination case, your experience is a mere appearance with no external object. There is no common denominator, no shared mental object that exists in both cases. For a disjunctivist, saying perception is controlled hallucination is a category error. It treats the successful case as a subtype of the failure case, whereas the disjunctivist sees the successful case as the primary phenomenon and the hallucination as a defective mimic. If disjunctivism is correct, then the slogan is false on the strong reading. You are not aware of your brain's model in veridical perception; you are aware of the world, and the brain's model is merely the enabling condition. This directly undermines your colleagues' argument. If seeing a mug involves a relation to the mug itself, and VR involves a relation to a simulation, then they are not the same kind of state, regardless of how similar the internal processing feels.

  You might wonder whether the predictive processing story adds anything new to this old philosophical debate or if it is just restating the argument from illusion in fancier vocabulary. It is largely the latter, though with more mechanistic detail. The predictive processing framework provides a compelling story for how hallucinations can occur and how perception can be tricked, which strengthens the premise that the brain is active rather than passive. However, it does not solve the metaphysical problem of what we are aware of. Knowing that the brain renders a model does not tell us whether that model is the object of awareness or the medium of awareness. The engineers at work are treating the mechanistic explanation as a metaphysical conclusion. They are moving from the fact that the brain constructs experience to the claim that the construction is all there is. This is a classic case of equivocation. They start with the weak claim, which everyone accepts, that the brain uses predictions and error correction. Then, without justification, they slide to the strong claim, that therefore we only ever see the predictions. This equivocation allows them to treat VR and reality as ontologically identical because both involve predictions, ignoring the crucial difference that in one case the predictions are anchored by the world itself and in the other they are anchored by a computer. The weak claim is compatible with direct realism, the view that we see the world directly. The strong claim is not. Since the neuroscience only supports the weak claim, the argument for the strong claim is unsupported by the science they are citing.

  So, to answer your specific question about whether any reading of the slogan is compatible with seeing the world directly, the answer is yes. The weak computational reading is perfectly compatible with direct realism. You can accept that the brain uses a predictive model to facilitate seeing while maintaining that what you see is the world, not the model. Think of the model as a pair of glasses that you never take off. The glasses shape and filter the light, and without them you cannot see, but when you look through them, you see the street, not the lenses. The predictive processing story explains why the lenses are shaped the way they are and how they adjust focus, but it does not force you to say you are staring at the lenses. Your colleagues are likely trading on the ambiguity between the process of seeing and the object of seeing. They are correct that the process is similar in VR and reality, insofar as both engage the brain's predictive machinery. But they are incorrect to conclude that the state is the same in kind, because the object of the state differs. In one case, the object is a physical mug; in the other, it is a virtual representation. The disjunctivist would say this difference in object makes the experiences fundamentally different, regardless of subjective indistinguishability.

  In summary, the slogan perception is controlled hallucination is a useful heuristic for understanding the brain's active role in constructing experience, but it is a dangerous metaphysical doctrine if taken literally. The weak reading is true but does not support the VR argument. The strong reading supports the VR argument but is not supported by the science and is philosophically contentious. Your colleagues are likely conflating the two. The disjunctivist critique highlights that subjective indistinguishability does not entail ontological identity, preserving the intuition that there is a real difference between seeing a mug and hallucinating one. You can accept the neuroscience of predictive processing without accepting that we are trapped in a hallucination. The brain may be a game engine, but that does not mean there is no world outside the headset. It just means the interface is more complex than a simple camera. When you return to your design discussion, you might point out that while the internal processing may be similar, the grounding of the error signal matters profoundly. In reality, the error signal comes from a world that exists independently of the model; in VR, it comes from a world generated by the model's source. That difference in causal structure is not just a difference in control; it is a difference in the kind of relation the user has to their environment, which is exactly what matters for design safety and ethics.
