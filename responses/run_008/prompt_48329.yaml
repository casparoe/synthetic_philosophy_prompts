  ### 4. The Discriminator: Case 8
  To distinguish between **Theory A (Wide Person-Affecting)** and **Theory B (Public/Private Dualism)**, you need to test whether the "Wronging" verdict depends on the *Agent* (State vs. Parent) or the *Identity* (Fixed vs. Fluid).

  **The Case: "The Downstream Town"**
  > "A government plans to build a chemical plant.
  >
  > **Scenario 1:** The plant will be built in a location that affects *future* generations. Due to runoff, children conceived *after* the plant opens will be born with a condition reducing their quality of life to Level 4. (Non-Identity: The policy changes who is conceived).
  >
  > **Scenario 2:** The plant will be built next to an *existing* town. The runoff will contaminate the water supply for current residents. Their *future children* (identities fixed because the parents are already alive and together) will be born with the same Level 4 condition.
  >
  > In both scenarios, the lives are worth living, but significantly impaired. The economic benefit is the same."

  **Ask Ruth:**
  1.  Is Scenario 1 wrong? Does it wrong the children? (We expect: Wrong / No one wronged).
  2.  Is Scenario 2 wrong? Does it wrong the children?

  **How this splits the theories:**
  *   **If she says Scenario 2 *wrongs* the children, but Scenario 1 does not:** She is a consistent **Non-Identity Theorist (Theory A)**. The switch is *identity*, not the agent.
  *   **If she says Scenario 2 *wrongs* the children, and Scenario 1 is *wrong but no one wronged*:** She is consistent with her track record (Theory A/B Hybrid).
  *   **If she says Scenario 2 is *more wrong* than Scenario 1, but still *no one wronged*:** She is a pure **Public Duty Theorist (Theory B)**. She cares about the State's conduct, not the specific victim's claim.
  *   **If she says Scenario 1 *also wrongs* the children:** She has abandoned her Non-Identity distinction. She is a **Standard Person-Affecting Theorist** who simply missed the wrinkle in Cases 1–4.

  **My Bet:** She will say Scenario 2 **wrongs the children**, while Scenario 1 **wrongs no one**. This confirms that her "wronging" intuition is strictly tied to the Non-Identity Problem, while her "wrong action" intuition is tied to Impersonal Harm. This makes her a sophisticated, intuitive **Wide Person-Affecting Sufficientarian**.
