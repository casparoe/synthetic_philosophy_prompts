  There is no single, canonical term in aesthetics or psychology that isolates this specific phenomenon to the degree you require. While the components are well-documented, they are usually discussed separately: **memory reconsolidation** in neuroscience, **psychological essentialism** in cognitive anthropology, and **cognitive dissonance** in social psychology. In art history, the devaluation is often called **The Authenticity Effect**, but that typically refers to current valuation, not the rewriting of past experience.

  However, the phenomenon you are describing is real, robust, and distinct. It is not merely changing one's mind; it is a **phenomenological overwrite**.

  Here is the breakdown of the existing concepts that converge to create this effect, followed by a proposed coinage that fits your constraints.

  ### 1. The Existing Landscape
  To understand why there isn't a single word yet, we have to look at the three mechanisms working in tandem:

  *   **Memory Reconsolidation (Neuroscience):** When a memory is recalled, it becomes labile (unstable) before being stored again. If new information (e.g., "this is a forgery") is present during recall, the memory is re-saved with that new information embedded in the *past* tense. The brain does not tag the new info as "added later"; it integrates it into the original trace.
  *   **Psychological Essentialism (Cognitive Science):** Humans are intuitive essentialists. We believe objects have an underlying "essence" (authenticity) that causes their observable properties. If the essence changes (from Real to Fake), our brain assumes the observable properties *must have always been* different, even if our senses didn't register it at the time.
  *   **Cognitive Dissonance (Psychology):** Loving a forgery induces ego-threat ("I was fooled"). To reduce this dissonance, the mind unconsciously alters the memory of the experience to align with the new truth ("I didn't love it; I was just pretending" or "It always felt off").

  ### 2. The Coinage: **Retroactive Aesthetic Coherence**

  I propose **Retroactive Aesthetic Coherence** (or **RAC**) as the formal term.

  **Definition:** The unconscious revision of a subject's past aesthetic experience (qualia, emotional response, or perceptual detail) to align with new ontological information about the object's status (authenticity, attribution, or provenance).

  **Why this term works:**
  *   **Retroactive:** It captures the time-travel aspect. The change happens *now*, but it is experienced as having *always been true*.
  *   **Aesthetic:** It specifies the domain (brushwork, feeling, connection) distinct from financial value or historical fact.
  *   **Coherence:** It identifies the *drive*. The brain is not trying to lie; it is trying to make the internal narrative coherent. The past experience must match the present truth.

  **How it rules on your edge cases:**
  *   **The Lover (Fake Reveal):** "I always felt it was stiff." The memory is rewritten to create coherence between the object's status (Fake) and the subject's taste (Discerning).
  *   **The Expert (The "I Knew It" Claim):** "I smelled a rat immediately." This is also RAC. The expert's memory is rewritten to create coherence between their identity (Expert) and the outcome (Fake). It is the same mechanism, just in the service of ego rather than taste.
  *   **The Reverse (Fake to Genuine):** "I always felt the power." When the status elevates, the memory elevates to match. Coherence is restored in the opposite direction.

  ### 3. An Alternative Eponym: **The Van Meegeren Revision**

  If you prefer a term that carries historical weight (similar to "The Streisand Effect" or "The Mandela Effect"), you could coin **The Van Meegeren Revision**.

  *   **Usage:** "He's suffering from a Van Meegeren Revision; he claims he hated the piece in 1945, but the letters prove he championed it."
  *   **Distinction:** This distinguishes the *memory* effect from the *economic* effect (The Authenticity Effect).
  *   **Scope:** It covers both the devaluation of the forgery and the re-evaluation of the rediscovered masterpiece, as both involve the revision of the viewer's history to match the object's ontology.

  ### 4. Why it is not Hindsight Bias
  You are correct to reject **Hindsight Bias**. Hindsight bias ("I knew it all along") is primarily about *probability and prediction*. It is cognitive.
  **Retroactive Aesthetic Coherence** is about *sensation and qualia*. It is phenomenological.
  *   **Hindsight Bias:** "I knew the stock would crash." (Judgment of likelihood)
  *   **RAC:** "I remember the brushstrokes looking hesitant." (Judgment of sensory experience)

  ### Summary
  While you may encounter references to **constructive memory** or **essentialist contagion** in academic literature, neither captures the specific aesthetic/temporal loop you described.

  **Retroactive Aesthetic Coherence** is the precise technical descriptor.
  **The Van Meegeren Revision** is the evocative cultural label.

  Both capture the sincerity of the error: the subject is not lying. Their past has genuinely been edited to ensure their present makes sense.
