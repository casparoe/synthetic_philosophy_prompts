      *   *Anchoring:* In the 1950 paper, he discusses "initiative" as critical. If the tool does the thinking, initiative is lost. If the tool extends thinking, initiative is preserved.
      *   *Parallel:* He viewed the untrained mind and untrained machine as parallel. Using a machine to augment the mind fits his functionalist view, *provided* the human remains the "learner" in the loop.
      *   *Distinction:* He might argue the definition of "education" needs to shift, just as the machine's curriculum shifts.

