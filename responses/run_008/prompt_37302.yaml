answer: |-
  You are quite right to suspect that "Whiggish" has become a bit of a catch-all term, often wielded more as a pejorative than a precise analytical tool. However, your intuitions are not random; they cluster around a coherent set of historiographical sins. The term originates from Herbert Butterfield's *The Whig Interpretation of History* (1931), and while it is often conflated with "presentism," they are not identical.

  To stabilise your verdicts, you need to separate **Whiggism** from **Retrospection** and **Pedagogical Presentism**. Whiggism is not merely looking back from the present (which is inevitable); it is distorting the past to validate the present.

  Here are the three precise principles that constitute Whiggish history, followed by an analysis of your specific cases.

  ### The Three Principles of Whiggism

  **1. Teleological Inevitability**
  This principle posits that the past was moving *towards* us. It treats the present not as one contingent outcome among many, but as the *telos* (end goal) of history.
  *   **The Test:** Does the narrative imply that the outcome was destined or necessary? Does it treat historical actors who opposed the "winning" side as obstructing the natural flow of time?

  **2. Epistemic Moralising**
  This principle judges past actors by the standards of current knowledge or morality, rather than by the standards available to them. It divides historical figures into "heroes" (those who accidentally anticipated the present) and "villains" (those who held views we now reject).
  *   **The Test:** Does the historian describe a past belief as "irrational" or "embarrassing" simply because it is currently false, rather than analysing why it was rational *then*?

  **3. Selection by Survival**
  This principle constructs a lineage that includes only the ancestors of current ideas or institutions, pruning away "dead ends" that were equally plausible at the time.
  *   **The Test:** Are the "losers" of history treated as non-entities? Is the complexity of the past reduced to a straight line leading to the present?

  ### Distinguishing Whiggism from Presentism

  Your confusion regarding the Holy Roman Empire (HRE) map highlights a crucial distinction. Using modern country names on a map of 1648 is **Pedagogical Presentism**. It is a heuristic tool to help the reader orient themselves. It does not claim the HRE was *trying* to become France or Germany, nor does it judge the HRE as a failed attempt at being a modern nation-state.

  **Whiggism requires a value judgement on the *process* of history, not just the *tools* of description.** Therefore, your verdict on the HRE map is correct: it is presentist, but not Whiggish. You should keep this verdict.

  ### The Franchise Case: A Precise Diagnosis

  This is the case causing you the most trouble, and rightly so. It sits on the boundary. Here is how to apply the principles:

  If a history states, *"The franchise expanded from 1832 to 1928,"* this is a demographic fact. Narrating a fact is not Whiggish.
  If a history states, *"The franchise expanded as society inevitably matured towards democracy,"* this **is Whiggish**.

  **The Principle:** You must distinguish between the *trajectory* and the *narrative arc*.
  *   **Not Whiggish:** Acknowledging that the franchise expanded, whilst highlighting the contingencies, the reversals, the violent suppression, and the fact that many contemporaries believed universal suffrage would lead to ruin.
  *   **Whiggish:** Describing the expansion as a "steady" march (ignoring stagnation or regression), implying that the opponents of suffrage were on the "wrong side of history," and treating universal suffrage as the pre-ordained climax of the story.

  **Verdict:** If the tone suggests moral progress or inevitability, your gut is right: it is Whiggish. If it merely reports the statistical widening of the vote without imbuing it with moral necessity, it is not. You should not give up this verdict, but you must refine the criterion: **It is the *inevitability* and *moral tone*, not the *outcome*, that makes it Whiggish.**

  ### Which Verdicts to Keep and Which to Drop

  Based on the three principles above, here is how you should adjust your scoring:

  **1. Chemistry (Phlogiston as embarrassment): KEEP (Whiggish)**
  This violates **Epistemic Moralising**. Phlogiston was a robust working hypothesis. Calling it an embarrassment judges Lavoisier's predecessors by Lavoisier's standards.

  **2. Astronomy (Geocentrism as reasonable): KEEP (Not Whiggish)**
  This correctly avoids Epistemic Moralising. It contextualises the evidence.

  **3. Medicine (Bloodletting irrational vs. Miasma respectable): KEEP**
  Your distinction here is excellent. Bloodletting persisted long after evidence mounted against it (often dogmatic), whereas Miasma theory was a rational inference from available data. Judging bloodletting as simply "irrational" is Whiggish; treating Miasma as a "respectable failure" is sound history.

  **4. Holy Roman Empire (Modern Maps): KEEP (Not Whiggish)**
  As established, this is pedagogical, not teleological.

  **5. Science (Only winners mentioned): CHANGE TO WHIGGISH**
  You mentioned you flip-flop on this. You should settle on **Whiggish**. This is the definition of **Selection by Survival**. Butterfield's primary complaint was exactly this: the history of science that draws a straight line from proto-science to current science, ignoring the cul-de-sacs. If a historian ignores the losers, they are implicitly arguing that the winners were the only viable options. That is Whiggism.

  ### Summary of Principles

  To answer your question directly: "Whiggish" is indeed a bundle, but the threads are tied together by a single error: **the confusion of the present's success with the past's intention.**

  *   **If the narrative suggests the past knew where it was going:** Whiggish.
  *   **If the narrative suggests the past is only valuable insofar as it produced the present:** Whiggish.
  *   **If the narrative uses modern concepts merely to explain the past (without judging it):** Not Whiggish (Presentist).

  **Your Action Plan:**
  1.  **Stop worrying about the HRE maps.** That is not Whiggism.
  2.  **Solidify the "Winners Only" verdict.** That is Whiggism. Ignoring the losers creates a false sense of inevitability.
  3.  **Refine the Franchise verdict.** Do not object to the *fact* of expansion. Object to the *tone* of inevitability. If the historian writes as though universal suffrage was the destiny of mankind rather than a contested political outcome, call it Whiggish. If they simply chart the legislation, let it pass.

  You are not merely waving a word around; you are detecting a specific form of narrative distortion. You simply need to ensure you are attacking the *teleology*, not the *retrospection*.
