answer: |-
  This is a healthy de-caching. The move from "SR proves Eternalism" to "SR constrains the metaphysics of time" is the difference between reading the Sequences as dogma and reading them as a map. The Rietdijk-Putnam argument is valid, but validity doesn't guarantee soundness if the premises smuggle in metaphysical commitments disguised as physical ones.

  You asked for a specification sheet. Below are the five core desiderata any theory of time must satisfy to be taken seriously in a post-relativistic, post-quantum context. Following that, I have outlined the **Incompatibility Results**—the specific clusters of claims that cannot be jointly held. This is where the "pick your poison" lives.

  ### Part I: The Desiderata

  #### 1. Lorentz Invariance of Ontological Status
  *   **The Requirement:** If the fundamental laws of physics are Lorentz invariant (i.e., no experiment can detect absolute motion), the theory must explain why ontological status (what *exists*) does not vary in a way that contradicts this invariance, or explicitly justify why ontology is exempt from physical symmetry.
  *   **Motivation:** This is the core of Rietdijk-Putnam. If Observer A says Event X is "now" (real) and Observer B says Event X is "future" (unreal), and both are equally valid physically, you have a contradiction unless "real" is frame-independent.
  *   **Negotiability:** **High.** This is the primary battleground. A theory can reject this by positing a "hidden" preferred frame (Lorentzian Poincaré interpretation) that is empirically inaccessible but ontologically privileged.
  *   **Eternalist Bias Check:** **Severe.** Eternalists often conflate *epistemic* equivalence (we can't measure the difference) with *ontological* identity (there is no difference). You may be overweighting the idea that physics describes *all* of reality, rather than just the measurable regularities.

  #### 2. Empirical Adequacy vs. Ontological Excess (The Reichenbach Constraint)
  *   **The Requirement:** The theory must account for the fact that simultaneity conventions (Reichenbach's $\epsilon$) are empirically underdetermined in SR, while acknowledging that General Relativity (GR) and Cosmology (FLRW metric) provide a *de facto* preferred foliation (Cosmic Time).
  *   **Motivation:** Special Relativity (SR) is local; Cosmology is global. In our actual universe, there *is* a frame where the CMB is isotropic. A theory of time must decide if this cosmic coincidence is metaphysically significant or just a convenient boundary condition.
  *   **Negotiability:** **Medium.** It is non-negotiable that the theory matches the math of FLRW. It is negotiable whether "Cosmic Time" counts as "The Present" for metaphysical purposes.
  *   **Eternalist Bias Check:** **Moderate.** Eternalists tend to dismiss Cosmic Time as "accidental" because it doesn't exist in all possible GR solutions. However, if we are doing metaphysics of *our* universe, not *all possible* universes, dismissing the actual global structure of spacetime is a form of modal overreach.

  #### 3. Phenomenological Accountability (The Flow Constraint)
  *   **The Requirement:** The theory must provide a truth-maker for the robust subjective experience of temporal passage (the "moving now"). It must explain *why* the experience exists, and *whether* the experience is veridical (tracking reality) or non-veridical (a systematic illusion).
  *   **Motivation:** The "specious present" is the most direct data point we have. A theory that says "time doesn't pass" owes an error theory as rigorous as its ontology.
  *   **Negotiability:** **Low.** You cannot simply deny the experience exists. You can only deny its *accuracy*.
  *   **Eternalist Bias Check:** **High.** Eternalists often treat the "illusion of flow" as a solved problem ("it's just memory + anticipation"). This is often a placeholder for ignorance. If flow is an illusion, what is the cognitive mechanism, and why did evolution select for a model of reality that contradicts the fundamental ontology? A theory that explains the illusion away too easily is suspicious.

  #### 4. Modal Asymmetry (The Open Future Constraint)
  *   **The Requirement:** The theory must account for the radical asymmetry between past and future regarding modality (the past seems fixed/necessary; the future seems open/contingent) without rendering deliberation incoherent.
  *   **Motivation:** Planning, regret, and causation rely on the future being ontologically or epistemically different from the past. If the future is "already there" (tenselessly), the sense of "could have done otherwise" requires a compatibilist overhaul.
  *   **Negotiability:** **Medium.** You can redefine "open" (e.g., "open" means "epistemically unknown to me" rather than "ontologically indeterminate"). But the redefinition must preserve the functional role of agency.
  *   **Eternalist Bias Check:** **Moderate.** Eternalists often redefine "determinism" to mean "fixed in the block" rather than "causally necessitated." This can smuggle in fatalism if not carefully distinguished from causal determinism.

  #### 5. Causal Completeness (The Timeless Physics Constraint)
  *   **The Requirement:** The theory must be compatible with the possibility that time is not fundamental (e.g., Wheeler-DeWitt equation, AdS/CFT, thermal time hypothesis). If time is emergent from causal structure or entanglement, the theory of time must reduce to a theory of correlations.
  *   **Motivation:** Quantum Gravity research suggests the "time" variable drops out of fundamental equations. A robust metaphysics shouldn't break if the fundamental physics turns out to be timeless.
  *   **Negotiability:** **High (currently).** This is speculative physics. However, a theory of time that *requires* a fundamental time parameter is risking obsolescence.
  *   **Eternalist Bias Check:** **Low/Neutral.** Eternalists are actually well-positioned here, as the Block Universe is easily compatible with "time is a spatial-like dimension." However, the bias is to assume the Block *is* the fundamental reality, rather than an emergent approximation.

  ---

  ### Part II: The Incompatibility Results (The "No-Go" Theorems)

  You asked which subsets are jointly unsatisfiable. These are the hard constraints where you cannot keep all the variables constant. You must break at least one link in each chain.

  #### Incompatibility Set A: The Relativity Trilemma
  You cannot simultaneously hold the following three claims:
  1.  **Presentism/Growing Block:** Only the present (or present+past) exists; the future does not.
  2.  **Strict Lorentz Invariance:** There is no physically or ontologically preferred foliation of spacetime; all inertial frames are equal.
  3.  **No Ontological Excess:** There are no "hidden" facts about simultaneity that are empirically undetectable.

  *   **The Conflict:** Rietdijk-Putnam shows that if (2) and (3) are true, then simultaneity is relative, which means "what exists" is relative. If existence is relative, Presentism (1) collapses into Eternalism (everything exists relative to some frame).
  *   **The Resolution:** To save Presentism, you must drop (2) or (3).
      *   *Drop (2):* Posit a preferred frame (e.g., Cosmic Time). This saves Presentism but makes it physically undetectable locally.
      *   *Drop (3):* Accept "Hidden Variable" time. There is a true "now," but physics cannot find it. This saves Presentism but violates the spirit of Ockham's Razor regarding physical ontology.
  *   **The Eternalist Trap:** You are likely assuming (2) and (3) are non-negotiable because they are "physics." But they are interpretations of physics. If you treat them as absolute, Eternalism becomes a tautology.

  #### Incompatibility Set B: The Phenomenology Trilemma
  You cannot simultaneously hold the following three claims:
  1.  **Block Ontology:** All times exist tenselessly; there is no objective passage.
  2.  **Veridicality of Experience:** Our experience of time passing is a truthful representation of reality.
  3.  **No Error Theory:** We do not need to posit a systematic cognitive illusion to explain the experience.

  *   **The Conflict:** If (1) is true, there is no objective passage. If (2) is true, there is objective passage. Contradiction.
  *   **The Resolution:** You must drop (2) or (3).
      *   *Drop (2):* Accept that the feeling of flow is an illusion (like the feeling that the sun moves around the earth).
      *   *Drop (3):* Develop a complex error theory explaining *why* the brain generates a false model of passage.
  *   **The Eternalist Trap:** You might be assuming (3) is easy ("it's just entropy!"). But explaining why a brain *inside* a static block generates a *dynamic* model is a hard problem in cognitive science. If you claim Eternalism explains experience, you owe the mechanism. If you claim experience is irrelevant, you violate Desideratum 3.

  #### Incompatibility Set C: The Cosmological Tension
  You cannot simultaneously hold the following three claims:
  1.  **Local Metaphysics:** The metaphysics of time is determined by local Special Relativistic physics (Minkowski space).
  2.  **Global Realism:** The metaphysics of time must respect the actual global structure of our universe (FLRW metric with Cosmic Time).
  3.  **Universal Foliation:** There is only one correct way to slice spacetime into "moments."

  *   **The Conflict:** Local SR says no unique foliation exists. Global Cosmology says a unique foliation (orthogonal to the CMB) *does* exist naturally.
  *   **The Resolution:**
      *   *Drop (1):* Admit that SR is a local approximation and Cosmic Time is the metaphysically real "now." (Rescues Presentism, but makes it contingent on the expansion of the universe).
      *   *Drop (2):* Insist that Cosmic Time is just a coordinate convenience and Local SR dictates the metaphysics. (Saves Eternalism, but ignores the actual geometry of our universe).
      *   *Drop (3):* Accept a hybrid view where "time" is locally relative but globally aligned. (Messy, but perhaps accurate).
  *   **The Eternalist Trap:** You are likely holding (1) as settled. But if our universe has a preferred frame *de facto*, insisting on (1) is prioritizing a local symmetry over global structure.

  ### Part III: The Specification Summary

  To update your cache without simply swapping dogmas, your new "spec" for a theory of time should look like this:

  1.  **Must reconcile Local SR with Global FLRW:** It cannot simply cite Minkowski space; it must address why the universe looks like it has a clock if time is relative.
  2.  **Must distinguish Epistemic from Ontological:** It must explicitly state whether "undetectable preferred frames" are ruled out by *logic* or by *methodology*. (SR rules out detecting the frame; it does not logically rule out the frame's existence).
  3.  **Must provide an Error Theory or a Truth-Maker for Flow:** It cannot ignore the phenomenology. It must either say "Flow is real, here is where it lives in the math" or "Flow is fake, here is the neural algorithm."
  4.  **Must preserve Agency:** It must explain how "deliberation" functions if the future is ontologically fixed (or explain why it isn't fixed).

  **The Hard Trade-off:**
  The only consistent package that satisfies *all* intuitive desiderata is **empty**.
  *   If you want **SR at face value** + **No Hidden Variables**, you get **Eternalism** but lose **Flow** and **Open Future**.
  *   If you want **Flow** + **Open Future**, you get **Presentism/Growing Block** but must accept **Hidden Variables/Preferred Frame** (violating the spirit of SR).
  *   If you want **Timeless Physics**, you get **Causal Structure** but must treat **Time** as emergent (making all the above debates approximate).

  Your loss of smugness is warranted. The Rietdijk-Putnam argument proves that *if* you assume ontology tracks relativistic simultaneity, *then* Eternalism follows. But the "if" is the entire philosophical battlefield. The physics constrains the metaphysics; it does not dictate it.
