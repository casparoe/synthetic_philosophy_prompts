      *   **Limitations:** The source of $P'(E)$.

      *   *Wait, one last check on the "Strictly Dominated" claim.*
      *   Is Naive updating *strictly dominated*?
      *   If the world is such that signals are always fuzzy, yes.
      *   If signals are sometimes clear, Naive works well then.
      *   I must ensure the game *only* presents fuzzy signals.
      *   I will specify: "All flashes are 100ms. None are clear."

      *   *Ready to write.*
