  # The Candlelight Wager: A Jeffrey Conditioning Game

  **Time:** 90 Minutes
  **Attendees:** ~12 (Split into 3 tables of 4)
  **Goal:** Demonstrate that treating uncertain observations as certain evidence ($P'(E)=1$) leads to exploitable overconfidence, and that Jeffrey updates are path-dependent when perceptual confidence is subjective.

  ## Part 1: Materials & Setup

  **You need:**
  1.  **Two Decks of Cards:**
      *   **Deck A (The "Red" Deck):** 9 Red cards, 1 Blue card.
      *   **Deck B (The "Blue" Deck):** 1 Red card, 9 Blue cards.
  2.  **Tachistoscope (Low-Tech Version):** A laptop with a simple script (or PowerPoint) that flashes an image for **100 milliseconds**, followed immediately by a mask (static noise) for 500ms.
      *   *Images:* High-res scans of the Red and Blue cards.
      *   *Calibration:* Test this beforehand. 100ms should be long enough to see color but short enough that participants are rarely 100% certain. Target accuracy: ~70%.
  3.  **Currency:** "Rationality Dollars" (RD). Start each player with $1,000.
  4.  **Betting Sheets:** Columns for: *Round, Perceived Color, Confidence in Perception ($q$), Belief in Deck A ($P(H)$), Wager, Outcome, P/L.*
  5.  **Timer.**

  ## Part 2: Round 1 — The Trap (45 Minutes)

  **The Scenario:**
  "One of two decks has been chosen (50/50). We will draw a card from it. You will see the card for a split second in dim light. You must bet on which Deck we are drawing from."

  **The Rules:**
  1.  **The Flash:** A card is drawn from the hidden Deck and flashed (100ms).
  2.  **The Report:** Players privately record:
      *   $q$: How confident are you that the card was **Red**? (0.0 to 1.0).
      *   $P(H)$: What is your probability that the Deck is **Deck A**?
  3.  **The Bet:** Players wager RD on "Deck A" at **fixed odds**.
      *   **The House Odds:** The Facilitator acts as the Bookie. The House offers to buy/sell shares of "Deck A" at **$0.80**.
      *   *Why $0.80?* This is the **Naive Posterior**. If you saw a Red card for sure, Bayes says $P(A|\text{Red}) = 0.9$. If you saw Blue for sure, $P(A|\text{Blue}) = 0.1$. The House sets the price at $0.80$ to tempt Naive agents who think they saw Red clearly.
      *   *Wait, to make the math work for Jeffrey:* The House Price should be the **Jeffrey Correct Price** based on the *average* reliability of the flash.
      *   **Revised House Odds:** The House posts a price *after* the flash but *before* bets? No, that reveals info.
      *   **Better Mechanism:** **Proper Scoring Rule.** It is mathematically cleaner for teaching.
      *   **Payoff Scheme:** You invest $X$ RD. Your payout is $X \times \text{Score}$.
      *   **Score:** Logarithmic Scoring Rule. $S = 100 \times \ln(P_{\text{reported}})$ if Correct, $100 \times \ln(1 - P_{\text{reported}})$ if Incorrect.
      *   **The Trap:** The Naive agent reports $P(H) = 0.9$ (treating signal as certain). The Jeffrey agent reports $P(H) = 0.66$ (accounting for $q=0.7$).
      *   **Why Naive Loses:** Over 15 rounds, the Naive agent will be systematically overconfident. When the flash was misleading (30% of the time), they assigned 90% probability to the wrong answer. The Log penalty for 90% wrong is massive ($\ln(0.1)$). The Jeffrey agent assigned 66% to the wrong answer ($\ln(0.34)$). The Jeffrey agent bleeds less.

  **Facilitator Script (Round 1):**
  > "You will see a card. It will be fast. Record your confidence in what you saw ($q$). Then record your belief in the Deck ($P(H)$). You are scored on $P(H)$.
  >
  > **Warning:** Many of you know Bayes' Rule. You know if you see Red, Deck A is 90% likely. But you didn't *see* Red. You saw a blur that *might* be Red. If you update as if you saw Red, you are lying to your scoring rule."

  **Tuning the Reliability:**
  *   **Flash Duration:** 100ms.
  *   **Target $q$:** Participants should average $q \approx 0.7$ when the card matches their perception, and $q \approx 0.4$ when it doesn't.
  *   **The Math of the Loss:**
      *   True State: Deck A (Prior 0.5).
      *   Card Drawn: Red (Prob 0.9).
      *   **Naive Agent:** Perceives "Red". Assumes $P(\text{Card=Red}) = 1$. Updates $P(H) = 0.9$.
      *   **Jeffrey Agent:** Perceives "Red-ish". Assigns $q = P(\text{Card=Red}) = 0.7$.
          *   $P'(H) = P(H|\text{Red}) \cdot q + P(H|\text{Blue}) \cdot (1-q)$
          *   $P'(H) = 0.9(0.7) + 0.1(0.3) = 0.63 + 0.03 = 0.66$.
      *   **Outcome:**
          *   If Card was actually Red (70% of percepts): Naive gets $\ln(0.9)$, Jeffrey gets $\ln(0.66)$. Naive wins slightly more.
          *   If Card was actually Blue (30% of percepts): Naive gets $\ln(0.1)$, Jeffrey gets $\ln(0.34)$. **Naive loses massively.**
          *   **Expected Score:** Jeffrey dominates Naive because the penalty for overconfidence is convex.

  **Running the Round:**
  1.  Run 15 flashes.
  2.  Collect sheets. Calculate scores live (use a spreadsheet projected on screen).
  3.  **The Reveal:** Show the cumulative scores. The "Bayesians" who updated hard should be in the red. The "Skeptics" who hedged should be up.

  ## Part 3: Round 2 — Non-Commutativity (30 Minutes)

  **Concept:** Jeffrey conditioning is not commutative if the *confidence* in the second signal depends on the belief state formed by the first.

  **Setup:**
  *   Split the room: **Group 1** and **Group 2**.
  *   Both groups get two flashes.
  *   **Group 1 Order:** Flash A (Red-ish) $\to$ Flash B (Red-ish).
  *   **Group 2 Order:** Flash B (Red-ish) $\to$ Flash A (Red-ish).
  *   **The Twist:** The "Fuzziness" of the second flash is **Primed**.
      *   Tell Group 1: "The second signal is harder to read if you are already confident." (Artificial constraint).
      *   Tell Group 2: "The second signal is clearer if you are uncertain."
      *   *Actually, simpler:* Just assign fixed $q$ values by fiat for this round to prove the math point, rather than relying on perception.
      *   **Revised Rule:** "For this round, we tell you the reliability of the flash."
      *   **Group 1:** Flash 1 ($q=0.7$ Red), then Flash 2 ($q=0.6$ Red).
      *   **Group 2:** Flash 1 ($q=0.6$ Red), then Flash 2 ($q=0.7$ Red).
      *   **Task:** Calculate final $P(H)$.
      *   **Wait:** If the partitions are the same and $q$ is fixed, Jeffrey updates **do** commute. (Diaconis & Zabell).
      *   **To Force Non-Commutativity:** The second update must be on a **different partition** or the $q$ must be **path-dependent**.
      *   **Let's use Path-Dependence:** "Your confidence in the second signal depends on your current belief."
      *   **Instruction:** "If your current belief in Deck A is > 50%, you feel more confident in Red signals ($q=0.8$). If < 50%, you feel less confident ($q=0.6$)."
      *   **Result:**
          *   Group 1 (Strong then Weak): Update 1 pushes belief high. Update 2 is high confidence ($0.8$). Final belief very high.
          *   Group 2 (Weak then Strong): Update 1 pushes belief slightly high. Update 2 is high confidence ($0.8$).
          *   *Wait, this might still commute if the threshold is crossed in both.*
      *   **Better Instruction:** "Confidence in Signal 2 depends on Signal 1's *perceived color*."
      *   **Scenario:**
          *   Signal 1: "Red-ish".
          *   Signal 2: "Red-ish".
          *   **Rule:** "If you thought Signal 1 was Red, Signal 2 looks *clearer* ($q=0.8$). If you thought Signal 1 was Blue, Signal 2 looks *fuzzier* ($q=0.5$)."
          *   Since everyone thinks Signal 1 was Red-ish, this doesn't split the group.
      *   **Okay, the most robust way to show non-commutativity in a meetup:**
          *   Use **Different Partitions**.
          *   **Signal 1:** "Is the card Red or Blue?" (Partition: Color).
          *   **Signal 2:** "Is the card a Face Card or Number?" (Partition: Rank).
          *   **Deck A:** 9 Red Numbers, 1 Blue Face.
          *   **Deck B:** 1 Red Number, 9 Blue Face.
          *   **Group 1:** Update on Color ($q=0.7$ Red), then Rank ($q=0.7$ Number).
          *   **Group 2:** Update on Rank ($q=0.7$ Number), then Color ($q=0.7$ Red).
          *   **Why it fails to commute:** Because $P(\text{Rank}|\text{Color})$ is not independent in the posterior.
          *   **Actually, this is too complex for 30 mins.**
      *   **Pivot:** Acknowledge the math nuance. Teach that **Subjective** Jeffrey updates (where *you* choose $q$) are path-dependent because *you* change.
      *   **Activity:** "The Confidence Drift."
      *   Group 1 sees 5 flashes. Group 2 sees the *same* 5 flashes in reverse order.
      *   They record their $q$ for each.
      *   **Debrief:** Compare final $P(H)$. They will differ because fatigue/priming changed their $q$ values.
      *   **Lesson:** Jeffrey conditioning requires $P'(E)$ to be exogenous. If your brain generates $P'(E)$ endogenously, order matters.

  ## Part 4: Debrief & Formal Mapping (15 Minutes)

  **1. The Formula on the Board:**
  $$P'(H) = P(H|E) \cdot P'(E) + P(H|\neg E) \cdot P'( \neg E)$$

  **2. Map the Game:**
  *   $H$: Deck A.
  *   $E$: Card is Red.
  *   $P(H|E)$: 0.9 (The "Hard Bayes" number you all know).
  *   $P'(E)$: Your reported confidence $q$ (e.g., 0.7).
  *   **The Naive Error:** You set $P'(E) = 1$.
      *   Your calculation: $0.9 \times 1 + 0.1 \times 0 = 0.9$.
      *   Reality: $0.9 \times 0.7 + 0.1 \times 0.3 = 0.66$.
  *   **The Loss:** You bet 90 cents on a 66 cent asset. The Log Scoring Rule bankrupted you because $\ln(0.1)$ is a bigger hole than $\ln(0.34)$ is a hill.

  **3. Discussion Questions:**
  *   "Where did $P'(E)$ come from?" (It came from your intuition/visual cortex, not the math).
  *   "In Round 2, why did orders differ?" (Because $P'(E)$ was generated by a brain that had already updated).
  *   "Should this disturb us?" (Yes. It means 'rational' updating is vulnerable to presentation order if evidence is uncertain).

  ## Part 5: Post-Mortem — What Will Go Wrong

  **1. The "Calibration" Excuse:**
  *   **Failure:** Participants will argue, "I *was* 90% sure I saw Red."
  *   **Fix:** Show them the aggregate data. "Collectively, when you said 90%, you were only right 65% of the time. Your $q$ was a lie."
  *   **Lesson:** Jeffrey conditioning requires *calibrated* $P'(E)$. If you can't calibrate your uncertainty, the rule is garbage in, garbage out.

  **2. The "Just Use Bayes" Objection:**
  *   **Failure:** A sharp attendee will say, "Why not just model the fuzziness as a noisy channel and use standard Bayes?"
  *   **Response:** "You can, if you know the noise structure. Jeffrey conditioning is for when you *don't* know the noise structure, you just know your new distribution over the evidence. In this game, the 'noise' was your own retina. You can't Bayes your own retina without infinite regress."

  **3. The Limitation You Must Supply:**
  *   **The Missing Piece:** No betting game can reproduce **The Partition Problem**.
  *   **Explanation:** Jeffrey conditioning assumes you know *what* you are uncertain about ($E$ vs $\neg E$). In real life, the hardest part isn't weighting the evidence; it's realizing *which* evidence space you are in.
  *   **Example:** You hear a noise. Is it "Wind ($E_1$)" vs "Intruder ($E_2$)"? Or is it "House Settling ($E_3$)" vs "Intruder ($E_2$)"?
  *   **Takeaway:** The game teaches you how to update once you've defined the uncertainty. It cannot teach you how to define the uncertainty. That requires **frame awareness**, not just probability calculus.

  ## Facilitator Cheat Sheet (The Math)

  *   **Prior:** 0.5
  *   **Likelihood Ratio:** 9:1 (Deck A vs B given Red Card)
  *   **Naive Posterior (Certainty):** 0.90
  *   **Jeffrey Posterior (70% Confidence):** 0.66
  *   **Jeffrey Posterior (60% Confidence):** 0.56
  *   **Log Score Penalty (Wrong @ 90%):** -2.30
  *   **Log Score Penalty (Wrong @ 66%):** -1.02
  *   **Break-even:** Naive needs to be right ~90% of the time to match Jeffrey's growth rate in this setup. They will only be right ~70%. They will lose.

  ## Final Advice
  Be ruthless with the scoring. If they complain the flash was too fast, say: "That's the point. The world is too fast. Update on the blur, not the story you tell yourself about the blur."
