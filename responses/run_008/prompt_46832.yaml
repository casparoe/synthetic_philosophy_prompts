answer: |-
  **Essay Question**

  Consider experimental research in which participants are randomly assigned to different situational conditions and their behaviour is observed in a single encounter, without their knowing that their character is being assessed. Situationists argue that significant behavioural variance across conditions demonstrates the scarcity of robust character traits. Explain why this inference relies on a specific assumption about the capacity of such experimental designs to detect traits. Specify what pattern of results within this design would have counted as evidence for robust traits, and assess whether the design is capable of producing such evidence. If it is not, describe the kind of empirical evidence required to genuinely discriminate between the situationist hypothesis and the virtue ethical hypothesis.

  ***

  **Model Answer**

  The situationist challenge is often treated as a substantive dispute about human psychology, but it is fundamentally an epistemological dispute about the conditions under which character traits can be empirically verified. To argue that robust traits are scarce because behaviour varies across situations is to assume that the experimental methodology used is sensitive enough to detect those traits had they been present. However, a close analysis of the design reveals that these experiments are structurally incapable of confirming the existence of robust traits, even if those traits were ubiquitous.

  A robust character trait is defined by cross-situational consistency in behaviour stemming from a stable underlying disposition. To empirically verify such a trait, one must demonstrate that individual agents behave consistently across varying contexts. This requires within-subject data: multiple observations of the same individuals in different situations. The standard situationist design, however, is single-shot and between-subjects. Each participant provides only one data point in one context. Consequently, the experiment measures aggregate susceptibility to situational pressure, not individual consistency. It compares the mean behaviour of Group A against Group B, rather than tracking whether Individual X behaves consistently across Condition A and Condition B.

  For such a design to count in favour of virtue ethics, the observed pattern would need to show no statistically significant difference in behaviour between the situational conditions. If help-giving rates were identical regardless of hurry or authority, this would suggest situational variables are irrelevant, leaving room for traits as the primary explanatory variable. However, even this null result would be insufficient to positively confirm robust traits, as it could merely indicate a ceiling effect or a situation too weak to trigger any variance. More critically, because the design is single-shot, it cannot measure the consistency required by the definition of a trait. Therefore, the experiments as run are incapable of producing evidence that confirms virtue ethics; they can only produce evidence that appears to falsify it.

  This methodological limitation means the experiments threaten only a specific, naive version of virtue ethics: the claim that most people possess robust traits that are automatically activated regardless of context. The data successfully show that situational factors often override default behavioural tendencies. However, this leaves untouched the Aristotelian claim that full virtue is rare, acquired through long habituation, and sensitive to practical wisdom. If virtue is rare, a random sample of unselected subjects is unlikely to contain many virtuous agents. Finding that the average subject fails to act virtuously under pressure does not prove virtues do not exist; it proves they are not common properties of the general population. The experiment confuses the scarcity of a trait with its non-existence.

  To genuinely discriminate between the situationist hypothesis (that robust traits are non-existent or psychologically impossible) and the virtue ethical hypothesis (that they are real but rare), the evidence must change. We require longitudinal, within-subject designs that track individuals across multiple distinct situations over time. Only by establishing that certain individuals maintain consistent behavioural patterns despite situational variance can we isolate person-variance from situation-variance. Until such evidence is gathered, the situationist inference remains unwarranted. The current experiments demonstrate the power of situations, but they do not, and cannot, demonstrate the absence of character.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **1. Identification of the logical requirement for trait evidence (4 marks)**
  The candidate must state that verifying robust traits requires demonstrating cross-situational consistency within individuals (within-subject variance), not just aggregate group means.
  *Typical miss:* Candidates define traits normatively rather than empirically, or focus on moral worth rather than behavioural consistency.

  **2. Analysis of the methodological limitation (4 marks)**
  The candidate must explain that single-shot, between-subjects designs provide only one data point per person, making within-subject consistency logically impossible to measure.
  *Typical miss:* Candidates critique the ethics of deception or the artificiality of the lab, rather than the statistical design.

  **3. Specification of the supportive pattern and its insufficiency (4 marks)**
  The candidate must identify that only a null situational effect would support virtue ethics in this design, but must also note that this is insufficient to prove traits (could be ceiling effects) and that the design remains incapable of positive confirmation.
  *Typical miss:* Candidates claim that a null result would prove virtues exist, failing to see the evidential gap.

  **4. Distinction between versions of virtue ethics (4 marks)**
  The candidate must distinguish between the claim that virtues are common/automatic (which is threatened) and the claim that virtues are rare/acquired (which is untouched by random sampling).
  *Typical miss:* Candidates treat 'virtue ethics' as a monolith, failing to separate empirical claims about frequency from normative claims about value.

  **5. Proposal of adequate discriminating evidence (4 marks)**
  The candidate must describe the need for longitudinal or within-subject methodologies that track individuals across multiple contexts to isolate person-variance.
  *Typical miss:* Candidates suggest qualitative interviews or philosophical argumentation rather than improved empirical design.

  **Distinction:** An A answer treats the experiments as data-generating mechanisms with specific sensitivity limits, whereas a B answer treats them as authoritative verdicts to be accepted or rejected based on philosophical preference.
