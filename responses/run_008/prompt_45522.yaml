answer: |-
  1. Germany bears the highest blame because its civilian and military elite actively sought a preventive war to secure hegemony, issuing the blank check to push Vienna toward escalation. This responsibility rests squarely on a handful of decision-makers rather than the German nation, as public opinion was not initially war-hungry.
  2. Austria-Hungary lands here because the Foreign Ministry and military command wanted a localized war to crush Serbia and were willing to risk a continental conflict to achieve it. Like Germany, this tier indicts specific imperial elites who manipulated the crisis rather than the multinational empire's populace.
  3. Russia is ranked third because the Tsarist regime chose early general mobilization, transforming a Balkan dispute into a European war by being willing to risk a general conflict to protect Serbian sovereignty. This responsibility lies with the autocratic decision-makers in St. Petersburg who prioritized prestige over peace.
  4. Serbia takes this spot because the government failed to stop nationalist terrorists who assassinated the Archduke and later rejected enough of the ultimatum to ensure conflict, showing a willingness to risk war for national unity. Blame here targets the state apparatus for tolerating subversion rather than the Serbian people themselves.
  5. France and Britain occupy the final tier because Paris firmly backed Russia without urging restraint, while London failed to clearly signal intervention early enough to deter Berlin, meaning both primarily failed to stop a war others were willing to risk. This assigns responsibility to diplomatic leaderships for miscalculation rather than active aggression.
