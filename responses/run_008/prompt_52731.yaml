prompt: |-
  Quick background: I'm doing a PhD in law, and you'd think all the contract stuff would've given me tools for this, but it turns out contract law just politely dodges the actual question. So here goes. When I was 17, my grandmother made me promise I'd never sell the small cottage by the lake that's been in our family for three generations. I said yes, obviously, it clearly meant the world to her. Now I'm a broke PhD student, and the cottage is worth enough to basically erase my student debt and give me a real shot at staying in academia instead of bailing for a firm job. My mom (her daughter) genuinely doesn't care what I do with it, my brother feels the same, and there are no other claimants. So as far as I can tell, no living person is affected one way or the other if I sell. And yet I can't shake the feeling that breaking the promise would be actually wrong — not just "I'd feel bad about it" wrong, but wrong wrong.

  I brought this up with a friend in my program and she said what I'm feeling is just sentimentality dressed up as ethics. Her view is that the promise can't bind me anymore because the person it was made to doesn't exist anymore, and obligations are things you owe to people who exist. That sounded clean for about five minutes, until I tried to figure out why I'd feel totally released if grandma were alive and said "honey, sell it, I don't mind at all." So maybe it's the releasing that matters — her releasing me. Except she can't release me now, which is sort of the whole problem, and my friend has no answer for why I can't just decide I'm released.

  This is keeping me up more than is probably healthy. Is there a principled account of where the "force" of a promise even comes from, such that it can survive the promisee dying, or my friend right that it's all just an emotional artifact? And if it does still bind somehow, is it the kind of thing that can be outweighed by stuff like my debt and career, or is it more like a hard constraint? Be brutal if you think I'm just being sentimental — I can take it, I just want to know whether to call the realtor.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Problem:**
      *   **User:** PhD candidate in Law. This is crucial. They understand legal concepts (consideration, privity, enforceability) but explicitly state contract law "dodges the actual question." They are looking for *moral/philosophical* reasoning, not legal advice. They want a "principled account." They ask to be "brutal" if they are just being sentimental.
      *   **The Dilemma:** A promise made at 17 to a deceased grandmother never to sell a family cottage.
      *   **Current Situation:** Broke PhD student, selling would erase debt and secure an academic career.
      *   **Stakeholders:** User, Mom (indifferent), Brother (indifferent), No other claimants. Grandmother (deceased).
      *   **The Conflict:** Moral obligation (promise) vs. Prudential necessity (debt/career).
      *   **The Friend's Argument:** Promises bind only to living people (interest theory). If the promisee is dead, the obligation vanishes.
      *   **The User's Counter-Intuition:** If Grandma were alive and released me, I'd feel fine. Since she can't, I feel stuck. Is this sentimentality or ethics?
      *   **The Core Question:** Do promises survive the death of the promisee? If so, is the obligation absolute or defeasible (can be outweighed)?

  2.  **Deconstruct the Ethical/Legal Philosophy:**
      *   *Legal Perspective (Briefly, since they know it):* Contracts generally die with parties unless specific provisions exist. But this isn't a contract; it's a gratuitous promise (no consideration). It's a moral promise.
      *   *Moral Philosophy Perspectives:*
          *   **Will Theory vs. Interest Theory:**
              *   *Interest Theory:* Obligations exist to protect the interests of the promisee. If the promisee is dead, they have no interests. (Friend's view).
              *   *Will Theory:* Obligations exist to respect the autonomy/will of the promisee. The promisee's past will still matters.
          *   **Reliance/Expectation:** Did Grandma rely on this? She likely died peaceful thinking the cottage was safe.
          *   **Virtue Ethics:** What kind of person do I want to be? A person who keeps word, or one who prioritizes self-interest when inconvenient?
          *   **Narrative/Identity:** The cottage is part of the family narrative. Selling it breaks the story.
          *   **The "Release" Paradox:** Why does release matter? Because a promise is a bilateral normative transaction, not just a unilateral constraint.

  3.  **Evaluate the "Force" of the Promise:**
      *   *Does it survive death?* Many philosophers argue yes. (e.g., Posthumous rights, executor duties). We honor wills. Why not promises?
      *   *Why?* It's about *trust* and *integrity* across time. If promises died with people, deathbed promises would be meaningless.
      *   *Is it absolute?* Almost no moral obligation is absolute (except maybe "don't commit genocide"). Most are *prima facie* duties (Ross). They can be outweighed by stronger duties (e.g., self-preservation, caring for dependents).

  4.  **Address the Specific Arguments:**
      *   *Friend's View (Interest Theory):* Clean, but fails the "release" test. If it were just about her interest, her saying "sell it" wouldn't change the objective fact of the interest, but it changes the *normative status*. This suggests the obligation is about *authority*, not just interest.
      *   *The "Release" Issue:* The user is right to spot this. A promise gives the promisee a right to waive the obligation. If they die, who holds that right? Usually, it passes to next of kin or the "spirit" of the relationship. Mom (the daughter) is indifferent. This is key. The "authority" to release has arguably passed to the mother, who says "do what you want."
      *   *The "Sentimentality" Charge:* Is it just guilt? Guilt is a signal, not a verdict. But the feeling of "wrong wrong" suggests a perceived violation of integrity.

  5.  **Formulate the Advice/Analysis:**
      *   **Acknowledge the Legal Background:** Validate that contract law is the wrong tool. This is jurisprudence/moral philosophy.
      *   **Tackle the "Survival" Question:** Yes, promises can survive death. Reference the "Will Theory" and the social practice of promising. If they didn't, deathbed promises would be void.
      *   **Tackle the "Release" Question:** This is the strongest argument for the user. The power to release likely devolved to the mother (heir/daughter). She released it.
      *   **Tackle the "Weight" Question:** Even if binding, is it defeasible? Yes. Compare the value of the promise (sentimental/family continuity) vs. the value of the breach (financial freedom, career viability).
      *   **The "Integrity" Angle:** Keeping a promise is about *your* integrity, not just *her* rights. But integrity also involves practical wisdom (*phronesis*).
      *   **The "Family Consensus" Angle:** Mom and Brother don't care. The "family interest" isn't being violated.
      *   **Conclusion:** It's not *just* sentimentality, but the obligation is likely defeasible and arguably already waived by the relevant successors.

  6.  **Refine the Tone:**
      *   Respectful, intellectual, rigorous (matching a PhD candidate).
      *   Avoid legal advice.
      *   Be "brutal" where requested but nuanced.
      *   Structure: Philosophical frameworks -> Application to the case -> Practical resolution.

  7.  **Self-Correction/Nuance Check:**
      *   *Wait, did the mom actually release the promise?* The prompt says Mom "doesn't care what I do." That's not an explicit release of *Grandma's* promise, but it indicates no family objection.
      *   *Is the "Will Theory" robust?* Some argue the dead have no will. Counter: We respect wills. Why not promises?
      *   *The "17 years old" factor:* Promises made by minors are often viewed as less binding due to lack of capacity. This is a strong point to raise. A 17-year-old's understanding of "forever" is different from an adult's.
      *   *The "Broke PhD" factor:* This is a significant hardship. Moral obligations usually yield to significant self-harm.

  8.  **Drafting the Response (Iterative):**
      *   *Intro:* Validate the frustration. Contract law is about enforcement, not morality.
      *   *Section 1: The Metaphysics of the Promise.* Does it survive death? Discuss Interest vs. Will Theory. Conclude it *can* survive, but not infinitely.
      *   *Section 2: The Release Problem.* Why does release matter? It's about authority. Who inherits that authority? The estate/heirs. Mom is the heir. She's indifferent.
      *   *Section 3: The Capacity Issue.* You were 17. This matters morally, even if not legally.
      *   *Section 4: Defeasibility.* Even if binding, is it absolute? No. Weigh the goods.
      *   *Section 5: The Verdict.* It's likely not "wrong wrong" to sell. It's a tragic choice, but not a moral violation.
      *   *Closing:* Call the realtor, but honor the memory another way.

  9.  **Final Polish:** Ensure the distinction between "legal enforceability" and "moral bindingness" is clear. Make sure to address the "sentimentality" accusation directly. (It's not *just* sentiment, but sentiment is data).

  *(Self-Correction during drafting)*: I need to be careful not to just tell them what to do. They asked for a "principled account." I need to give them the framework to decide, while leaning towards the conclusion that selling is permissible.

  *Key Philosophical References to keep in mind (implicitly or explicitly):*
  *   T.M. Scanlon (Principle of Fidelity).
  *   W.D. Ross (Prima Facie Duties).
  *   H.L.A. Hart (Choice Theory vs. Interest Theory of Rights).
  *   The concept of "Posthumous Interests."

  *Let's structure the argument:*
  1.  **The Ontology of the Promise:** Does it exist after death? (Yes, but changed).
  2.  **The Authority to Waive:** Who holds the keys now? (Mom/Heirs).
  3.  **The Weight of the Obligation:** Is it absolute? (No, prima facie).
  4.  **The Capacity Constraint:** You were a child.
  5.  **Synthesis:** Selling is permissible.

  *Final check on tone:* Empathetic but analytical. "Brutal" means don't coddle the guilt, but don't dismiss the ethics either.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a classic problem in jurisprudence and moral philosophy, not contract law. Contract law asks, "Can we enforce this?" Moral philosophy asks, "Does this bind me?" Your friend is arguing from a specific theoretical standpoint (Interest Theory of Rights), but it's not the only one, and as you noticed, it fails to explain the intuition about release.

  Since you asked for a principled account and invited brutality, I will skip the "it's complicated" hedging. Here is the breakdown of the normative force you are feeling, where it comes from, and whether it survives the facts of your case.

  ### 1. The Ontology of the Promise: Does it survive death?
  Your friend is relying on the **Interest Theory of Rights**. This view holds that obligations exist to protect the interests of the promisee. Since the dead have no interests (they cannot suffer, feel betrayed, or lose utility), the obligation evaporates.

  However, this theory fails to account for **testamentary freedom**. We legally and morally recognize that a person's will regarding their property survives their death. If the Interest Theory were absolute, wills would be meaningless the moment the testator dies.

  The stronger framework here is the **Will Theory (or Choice Theory)**. This posits that a promise creates a normative relationship where the promisee has *authority* over the promisor's action regarding a specific subject. When you promised, you transferred a slice of your autonomy to her. She held the right to demand performance or waive it.

  Does that authority vanish at death? Not necessarily. It becomes part of her "moral estate." Just as her property rights passed to her heirs, her right to enforce or waive the promise likely passed to them. This explains your intuition about release: if she were alive, she holds the key. Since she is dead, the key doesn't vanish; it transfers.

  **Verdict:** The promise *can* survive death, but its nature changes from a direct interpersonal bond to a stewardship obligation.

  ### 2. The Question of Waiver: Who holds the key?
  You hit the nail on the head regarding the release. If the obligation were purely about the *act* (keeping the cottage), her saying "sell it" wouldn't change the morality of the sale. But promises are about *authority*. She had the right to release you.

  Since she is deceased, who inherits that authority? In the absence of a designated executor for this specific moral contract, the authority defaults to the next of kin or those whose interests the promise was intended to protect.
  *   **The Intent:** The promise was likely about keeping the cottage in the *family*, not just pleasing Grandma as an individual.
  *   **The Heirs:** Your mother (her daughter) and you (her grandchild) are the stakeholders.
  *   **The Waiver:** Your mother is indifferent. She is the primary heir to Grandma's moral authority regarding the family assets. If she says she doesn't care, she is effectively waiving the family's claim on the promise.

  **Verdict:** The authority to release the promise has devolved to your mother. Her indifference functions as a constructive waiver. You are not acting unilaterally; you are acting with the tacit consent of the surviving moral stakeholders.

  ### 3. The Capacity Constraint: You were 17.
  This is the brutal part. In law, a 17-year-old lacks full contractual capacity because we presume they lack the foresight to understand long-term consequences. In morality, we apply a similar, if softer, standard.

  A promise made at 17 to an elder is inherently coercive, even if no force is used. It relies on a power dynamic (grandchild/grandparent) and a developmental stage where "forever" is an abstract concept. To hold a 30-year-old PhD candidate to the specific financial constraints accepted by a 17-year-old high schooler is to ignore the development of your own moral agency.

  You are not the same moral agent who made the promise. That boy promised based on a limited understanding of his future life. The man you are now is facing a trade-off that boy could not comprehend. To demand the adult suffer for the child's vow is a form of moral hostage-taking.

  **Verdict:** The binding force of the promise is weakened by the disparity in capacity between the promisor-then and the promisor-now.

  ### 4. Defeasibility: Is it a hard constraint?
  Even if we grant the promise is valid, survives death, and hasn't been waived, almost no moral obligation is absolute (except perhaps prohibitions against atrocities). W.D. Ross called these *prima facie* duties. They are binding *unless* they conflict with a stronger duty.

  You have a conflict of duties:
  1.  **Fidelity:** Keep the promise to Grandma.
  2.  **Self-Preservation/Care:** Secure your financial future and career viability.
  3.  **Family Welfare:** Your mother and brother are indifferent, implying no harm to them, but your own instability could eventually become a burden on them.

  The "good" protected by the promise is **sentimental continuity** (a cottage stays in the family).
  The "good" protected by selling is **life trajectory** (freedom from debt, ability to remain in academia).

  Unless the cottage is the *only* thing keeping the family identity alive (which your mother's indifference suggests it isn't), the material necessity of your career and financial solvency outweighs the sentimental value of the asset. Morality does not require self-sacrifice to the point of crippling your own life, especially when the sacrifice benefits no living person.

  **Verdict:** The duty of fidelity is outweighed by the duty of self-preservation and practical necessity.

  ### 5. The "Sentimentality" Charge
  Your friend says you are confusing sentimentality with ethics. She is half-right.
  *   **She is right** that the *pain* you feel is emotional. It is grief and guilt.
  *   **She is wrong** that the *obligation* is therefore fake.

  However, the "wrong wrong" feeling you have is likely **integrity anxiety**, not objective moral violation. You view yourself as a person who keeps promises. Selling makes you a person who broke a promise to a dying relative. That is a hit to your narrative identity.

  But integrity also requires **practical wisdom (*phronesis*)**. A rigid adherence to a vow made in childhood, which now harms the vow-maker and benefits no one, is not integrity; it is fetishism of the past.

  ### The Principled Conclusion
  You are not morally prohibited from selling the cottage.
  1.  **Normative Authority:** The right to enforce/waive the promise has passed to your mother, who has waived it via indifference.
  2.  **Capacity:** The promise was made by a minor with limited foresight.
  3.  **Weighing of Goods:** Your financial and career survival outweighs the sentimental value of the property, particularly given the lack of objection from other family members.
  4.  **Harm Principle:** No living person is harmed by the sale.

  **The Brutal Truth:**
  If you keep the cottage, you are not honoring your grandmother; you are honoring your own fear of being the kind of person who sells a cottage. You are prioritizing your self-image over your actual life. Grandparents generally want their grandchildren to thrive, not to be debt-ridden martyrs to a piece of real estate.

  **Recommendation:**
  Sell the house. But do not treat it as a mere liquidation.
  1.  **Acknowledge the Loss:** Admit that you are breaking the letter of the promise to keep the spirit of the family (which is you) alive.
  2.  **Ritualize the Transition:** Take photos, keep a brick, write down the history. Transfer the *memory* even if you transfer the *title*.
  3.  **Compensate the Moral Debt:** If the sale frees up significant capital, consider setting aside a small portion for something that honors her memory (a donation, a family trip, preserving specific heirlooms).

  Call the realtor. The promise was for a life you didn't know you'd have; don't let a ghost bankrupt the living one.
