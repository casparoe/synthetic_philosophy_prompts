          *   *Critique:* Distinguish between Computability and Complexity.

      *   **Claim 4:** *Nature solves NP-hard problems (protein folding, etc.), so complexity classes are artifacts, not physical facts.*
          *   *Analysis:* This is a category error. Nature doesn't solve the *worst-case* instances. It finds local minima or "good enough" solutions for specific distributions. Complexity theory is about worst-case asymptotics. Just because nature handles *instances* doesn't mean the *class* is physically irrelevant.
