          *   *Analysis:* This is the core of "Algorithmic Epistemology" or "Computational Rationality" (e.g., Chernozhukov, or philosophical work by Simon, more recently by computational social choice theorists). Classical Bayesianism is uncomputable. This is a very strong, defensible philosophical position.
          *   *Philosophical Stake:* Normativity of rationality.
          *   *Rating:* Very High. 9.
          *   *Critique:* It's the most robust philosophical takeaway from CS.

      *   **Claim 6:** *Cryptography shows epistemic asymmetry is a mathematical fact, making privacy a theorem.*
