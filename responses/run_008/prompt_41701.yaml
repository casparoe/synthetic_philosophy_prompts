answer: |-
  ### The guilty step

  Step (4). The slide is an **illicit counterfactual**: it treats a logical impossibility (under the premises) as an informative signal. Under Common Knowledge of Rationality (CKR), Player 1 passing at node 1 is not just unlikely; it is inconsistent with the axioms you started with. You cannot condition on an impossible event without specifying how beliefs revise when the world breaks your rules. The argument silently assumes Player 2 revises beliefs to "Player 1 is cooperative," but CKR dictates Player 2 should view the pass as a breakdown of rationality, which offers no guarantee Player 1 will cooperate again at node 3. Step (4) assumes the very coordination it needs to prove, without a mechanism to sustain it once CKR is shattered.

  ### Why it looked fine

  It mimics **Forward Induction**, which is intuitively compelling: if a player sacrifices immediate gain, they likely have a plan to make it up later, so you should cooperate. This feels like "smart" play compared to rigid Backward Induction, masking the fact that "smart" play requires assuming Player 1 has a specific *type* (cooperative) that CKR explicitly rules out. Because the Centipede Game payoffs are so stark, the cooperative outcome looks like the only "sensible" one, making the logical gap feel like a practical insight rather than a formal error.

  ### The price

  Rejecting Step (4) saves Backward Induction but admits its fragility: it works only as long as no one ever makes a mistake. It costs us the ability to explain what rational players *should* do if someone actually deviates, because strict CKR provides no tools for updating on impossible events. To make sense of off-path cooperation, you must relax CKR and allow for a small probability of irrationality or different types, meaning strict Common Knowledge of Rationality is too brittle to describe interaction where errors or experiments happen.

  ### Seminar notes

  "You are trying to have it both ways: you use Common Knowledge of Rationality to prove passing is impossible, then pretend passing happens to prove the theory wrong. If Player 1 passes, the Common Knowledge is broken, so you cannot assume Player 1 will continue to cooperate later without adding new assumptions about their type. Either Backward Induction holds, or Common Knowledge of Rationality was never true to begin with."
