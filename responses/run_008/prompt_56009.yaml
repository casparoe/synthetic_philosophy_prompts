prompt: |-
  My brother and I have been arguing about quantum immortality for like three months and before we do another round I want us to at least agree on what would count as settling it. So write me the spec: the list of things any adequate treatment of the quantum suicide argument has to deliver, with the case behind each, and mark which are non-negotiable versus just what one camp wants.

  Some things I think belong on the list but I might be wrong, you tell me. It has to say what happens to probability when every branch contains a live observer -- does it go to zero, become self-locating, just become undefined? It has to respect the Born rule somehow: the branches where the bullet grazes you instead of going through your head have vanishing measure, so does "you will find yourself alive" carry any weight at all when the total measure of the survival branches tends to zero? That one feels load-bearing but I can't tell if it's fatal or just a technicality. It has to distinguish the metaphysical reading from the decision-theoretic one (a claim about what will happen vs a claim about what you should expect or choose), because my brother keeps sliding between them mid-argument. It has to deal with the fact that dying is rarely instant -- the branch where you linger badly injured for two weeks counts as "surviving" in the naive world-counting sense, which seems to break whatever intuition the argument was riding on. And here's one I suspect people skip: the argument, even if it works, seems to give you immunity to sudden death, not immortality -- aging is a slow leak, not a coin flip, so the measure of functional-you can decay continuously instead of branching cleanly. Does any version of the argument actually address that, or is "quantum immortality" just false advertising for "quantum no-sudden-death"?

  Also, if you think some subset of the desiderata is jointly unsatisfiable, say so and say which -- that's the part I most want. My brother claims the Born-rule requirement and the guaranteed-survival intuition can't both be satisfied, I'm not sure he's right, and I'd rather have the tension located precisely than argued about over dinner again.

  Skip scoring actual interpretations or named positions against the list, we'll do that ourselves. Just make sure the last line is machine-readable: \answer{...} naming the single requirement from your list that does the most to exclude bad treatments of the argument.
