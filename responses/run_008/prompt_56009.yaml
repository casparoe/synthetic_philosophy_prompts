answer: |-
  Here is the specification for an adequate treatment of the Quantum Immortality/Suicide (QI/QS) argument. This list is designed to force clarity on physics, logic, and semantics before any claims about truth are evaluated.

  ### Specification for Adequate Treatment of Quantum Immortality

  #### 1. Ontological Framework Declaration
  *   **The Requirement:** The treatment must explicitly state the interpretation of quantum mechanics being assumed (e.g., Everettian Many-Worlds, Bohmian, Copenhagen). It must justify why QI follows from *that* specific ontology and not others.
  *   **The Case:** QI is not interpretation-neutral. In collapse theories, the wavefunction reduces to a single outcome (death or life), making QI false. In MWI, all outcomes occur. Arguing QI without specifying MWI is category confusion.
  *   **Status:** **Non-Negotiable** (Physics).

  #### 2. Measure vs. Branch Counting
  *   **The Requirement:** The treatment must define what constitutes "probability" in a deterministic multiverse. It must specify whether "existence" is determined by counting branches (each outcome = 1 world) or by Hilbert space measure (amplitude squared).
  *   **The Case:** If probability is branch-counting, survival is guaranteed if *any* branch survives. If probability is measure-theoretic, survival branches can have measure approaching zero. Most modern MWI proponents reject branch-counting as physically unjustified.
  *   **Status:** **Non-Negotiable** (Mathematical Consistency).

  #### 3. Born Rule and Measure Consistency
  *   **The Requirement:** The treatment must explain how the argument aligns with the Born Rule. If the measure of survival branches tends to zero (e.g., repeated 1% survival chances), the treatment must explain whether the observer's subjective expectation should also tend to zero, or why it remains 1 despite the vanishing measure.
  *   **The Case:** This is the "load-bearing" wall. Standard quantum mechanics predicts frequencies matching the Born Rule. If QI claims you *will* experience the low-measure outcome, it must explain why the Born Rule (which governs all other quantum predictions) does not apply to first-person expectation.
  *   **Status:** **Non-Negotiable** (Physical Consistency).

  #### 4. Metaphysical vs. Decision-Theoretic Distinction
  *   **The Requirement:** The treatment must distinguish between the claim "I *will* survive" (Metaphysical/Phenomenological) and "I should *act as if* I will survive" (Decision-Theoretic). It cannot slide between these two mid-argument.
  *   **The Case:** You can consistently hold that you will die (metaphysically, in most branches) but should bet on living (decision-theoretically, if utility is weighted by existence). Conflating "what happens" with "how to bet" creates the illusion of a paradox where there is only a definition mismatch.
  *   **Status:** **Non-Negotiable** (Logical Clarity).

  #### 5. Phenomenological Threshold of Death
  *   **The Requirement:** The treatment must define the criteria for "observer cessation." It must address whether branches where the observer survives but is severely injured, comatose, or suffering count as "survival" for the sake of the argument.
  *   **The Case:** The naive intuition is "I live happily." The physical reality is "A version of you exists in a state of high entropy." If the argument relies on the *value* of immortality, it must account for the quality of the surviving branches.
  *   **Status:** **Camp-Specific** (Proponents prefer a low threshold; Critics prefer a high threshold).

  #### 6. Continuous Degradation (The Aging Problem)
  *   **The Requirement:** The treatment must address entropy and biological aging. It must explain how the argument handles non-binary death events (e.g., gradual organ failure) where there is no clean "dead/alive" branching event to select from.
  *   **The Case:** QI relies on binary quantum events to filter worlds. Aging is a continuous thermodynamic process. If there is no branch where you are perfectly healthy, only branches where you are *less* unhealthy, "immortality" degrades into "prolonged decay."
  *   **Status:** **Non-Negotiable** (Semantic Precision).

  ---

  ### Joint Unsatisfiability Analysis

  You asked specifically about the tension your brother identified. He is correct: there is a trilemma here. The following three propositions are jointly unsatisfiable within standard physics and decision theory:

  1.  **Born Rule Validity:** Subjective expectation should track Hilbert space measure (amplitude squared).
  2.  **Guaranteed Survival:** The first-person subjective probability of survival is 1 (you never experience death).
  3.  **Vanishing Measure:** In a repeated quantum suicide setup, the total measure of branches containing a live observer tends toward zero.

  **The Conflict:**
  *   If you accept **(1)** and **(3)**, you must reject **(2)**. (You should expect to die, because the "you" that dies has almost all the measure).
  *   If you accept **(2)** and **(3)**, you must reject **(1)**. (You expect to live despite having almost no measure; this requires a non-standard decision theory, often called "branch-counting" or "self-locating uncertainty without measure").
  *   If you accept **(1)** and **(2)**, you must reject **(3)**. (This implies physics prevents the measure from vanishing, which contradicts standard QM).

  Most QI proponents resolve this by rejecting **(1)**. They argue that measure does not dictate subjective probability for the surviving observer. Most critics resolve this by rejecting **(2)**. They argue that "you" are more likely to be the successor in the high-measure branch (i.e., the dead one, or rather, your successors are the ones in the high-measure branches).

  An adequate treatment *must* declare which of these three it is sacrificing. Treatments that claim to keep all three are logically incoherent.

  ---

  ### Recommendation for Settlement

  To settle your argument, do not ask "Is QI true?" Ask: "Which of the three propositions in the Unsatisfiability Analysis are you willing to drop?"

  If your brother insists on the Born Rule (1) and standard QM (3), he must concede that subjective survival (2) is not guaranteed. If you insist on subjective survival (2) and standard QM (3), you must concede that the Born Rule (1) does not govern first-person expectation.

  \answer{Born Rule and Measure Consistency}
