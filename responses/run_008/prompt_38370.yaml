prompt: |-
  I direct the individual-engagement program at a mid-sized environmental nonprofit with roughly 40,000 supporters. The program consists of voluntary personal pledges: each quarter we decide which new pledges to add to the campaign — skip one discretionary flight per year, drop beef, vote in the off-year local election. Two recurring problems. First, every proposal gets challenged with the inefficacy objection: your one flight doesn't cause fewer flights to be scheduled, one burger doesn't change herd sizes, one vote almost never turns an election — so why ask anyone to do it? Second, my program officers answer these challenges ad hoc and inconsistently: one week they say "every little bit helps," the next that "it's about sending a signal," and neither answer survives contact with a skeptical supporter.

  Write a decision procedure my officers can actually run on a proposed pledge, with the following requirements.

  The form: numbered steps, in order. For each step, say what question it asks, what counts as a sufficient answer, where the procedure stops with a "no," and where it explicitly hands the decision back to a human because the remaining question is one of values — how much we may ask of volunteers, whether a pledge is required or merely admirable — that the procedure cannot settle. Officers with no philosophy training will run this in under thirty minutes per proposal on about a dozen proposals a quarter, so it must be usable without the theory behind it; be honest about which steps are judgment calls dressed up as procedure.

  The causal core: the procedure needs a committed position on the inefficacy objection. Please don't give me a menu of options (threshold or conjunctive-act views, straightforward expected value, expected value with thresholds, integrity-based reasons) and leave the choice to me. Pick one as the procedure's official test, defend the choice in a short preamble, and then apply it consistently throughout — even where it bites. If the test you pick sometimes makes the procedure pass a pledge for the "wrong" reason, or reject one my officers wanted, that is a feature, not a bug.

  The procedure must handle three hard kinds of case without collapsing: (1) threshold cases, where the effect materializes only once some fixed number of people change, so the marginal individual act seems to change nothing; (2) pivotality cases, such as elections, where a single act has a very small probability of a very large effect; and (3) coordination cases, where the point of the pledge is partly to make other people act. For the worked cases, stipulate whatever numbers you need — recount thresholds, batch sizes, uptake rates — rather than reaching for real-world statistics; the logic of the procedure is what I need, not empirical grounding we don't have.

  Then run the procedure on three proposals: (a) skip one discretionary flight per year; (b) drop beef entirely; (c) vote in your next off-year local election. For (b) I'll be candid about my priors: I want it to pass, and I do not want the procedure telling supporters that no single purchase matters. If the test you committed to yields that result anyway, say so plainly rather than rigging the case to please me.

  Close with a section on what the procedure cannot do: the questions about individual pledges it leaves open, and the situations in which it will predictably misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Director of individual-engagement program at a mid-sized environmental nonprofit (40k supporters).
      *   **Problem:** Two recurring issues: (1) The "inefficacy objection" (my action doesn't change outcomes), and (2) Inconsistent/weak responses from program officers ("every bit helps," "sending a signal").
      *   **Task:** Write a decision procedure for program officers to evaluate new pledge proposals.
      *   **Constraints:**
          *   **Form:** Numbered steps, specific questions, sufficient answers, stop conditions ("no"), hand-off points for value judgments. Usable by non-philosophers in <30 mins.
          *   **Causal Core:** Must pick *one* philosophical position on the inefficacy objection (no menus). Defend it in a preamble. Apply it consistently, even if it yields counter-intuitive results.
          *   **Hard Cases:** Must handle (1) Thresholds (batching), (2) Pivotality (voting), (3) Coordination (social signaling). Use stipulated numbers, not real stats.
          *   **Worked Examples:** Run the procedure on (a) Skip one flight, (b) Drop beef (User wants this to pass, but don't rig it), (c) Vote in off-year election.
          *   **Limitations:** Close with a section on what the procedure *cannot* do.

  2.  **Select the Causal Core (The Philosophical Engine):**

      *   *Option A: Straightforward Expected Value (EV).* Problem: In voting and threshold cases, the probability of being pivotal is often so low that EV calculates to near zero, making the action irrational unless the benefit is infinite. This fuels the inefficacy objection.
      *   *Option B: Integrity/Virtue Ethics.* Problem: Too subjective. Hard to operationalize into a checklist for officers. "Is this virtuous?" is hard to score.
      *   *Option C: The "Expected Value with Complicity/Participation" View.* (Often associated with Nefsky or Lawford-Smith). Focuses on whether the act *could* help or is part of a sufficient set.
      *   *Option D: The "Collective Impact" / "Triggering" View (Kagan/Norcross).* This is the most robust for nonprofit logic. It treats individual actions as contributions to a collective threshold. Even if *my* burger doesn't stop a cow, *our* 10,000 burgers do. The individual act is rational because it is a necessary part of the sufficient set, or because it has a non-zero probability of triggering the threshold.
      *   *Decision:* I will choose **Expected Value with Threshold Triggering (The "Probabilistic Threshold" View)**.
      *   *Why:* It directly addresses the "one burger doesn't matter" objection by acknowledging that while one burger rarely triggers a change, it has a *probability* of being the trigger (or part of the trigger batch). It allows for mathematical stipulation in the procedure. It handles voting (pivotality) and beef (supply chain thresholds) consistently. It avoids the vagueness of "signaling."
      *   *Defense:* It respects the skeptic's demand for causal leverage while acknowledging the reality of aggregate systems. It avoids the "magic" of signaling and the paralysis of pure individual EV.

  3.  **Drafting the Preamble:**

      *   Need to state the chosen view clearly.
      *   Defend it against the "inefficacy objection."
      *   Acknowledge the trade-off (it might reject some intuitively good things if the math doesn't hold).

  4.  **Developing the Decision Procedure (The Steps):**

      *   *Goal:* 30 minutes, non-philosophers.
      *   *Step 1: Definition.* Is the action clear? (Stop if no).
      *   *Step 2: The Causal Mechanism.* How does this aggregate? (Threshold vs. Continuous).
      *   *Step 3: The Probability Calculation.* What is the chance this specific act triggers a benefit? (This is the hard part, need to simplify).
      *   *Step 4: The Magnitude.* If triggered, how big is the good?
      *   *Step 5: The Cost.* Is the burden on the volunteer reasonable? (Value judgment hand-off).
      *   *Step 6: The Coordination/Signal Check.* (Addressing the third hard case).
      *   *Refinement:* I need to make sure the "inefficacy" test is the core. Let's structure it around the "Expected Benefit > Cost" framework, but specifically tailored to the Threshold View.
      *   *Revised Steps:*
          1.  Define the Unit of Impact.
          2.  Estimate the Threshold (Batch Size).
          3.  Estimate the Probability of Influence (Being the trigger).
          4.  Calculate Expected Impact.
          5.  Assess Volunteer Burden (Value Judgment).
          6.  Final Authorization.

      *   *Wait, I need to handle the "Coordination" case specifically.* The prompt asks for coordination cases where the point is to make *others* act. The Threshold View handles the *impact* of the act, but the *recruitment* aspect is separate. I should add a step for "Multiplier Effect."
      *   *Actually, let's stick closer to the Causal Core.* If the core is Expected Value with Thresholds, coordination is just another source of expected value (my act -> others act -> threshold met).
      *   *Let's simplify for the officers.*
          1.  **Causal Pathway:** Does a mechanism exist?
          2.  **Threshold Estimation:** What is the batch size?
          3.  **Pivotal Probability:** What are the odds we hit the threshold *including* this pledge?
          4.  **Burden Check:** (Value judgment).
          5.  **Signaling/Coordination Override:** (Specific handling for the 3rd hard case).

      *   *Correction:* The prompt asks to pick *one* test and apply it consistently. If I add a "Signaling Override," I'm weakening the core. I need to integrate signaling into the EV calculation or admit it's outside the causal core. The prompt says "handle three hard kinds of case... coordination cases, where the point of the pledge is partly to make other people act."
      *   *Solution:* I will treat "making other people act" as a causal multiplier in the Expected Value calculation. My pledge -> I influence 2 friends -> Their pledges count toward the threshold.

  5.  **Drafting the Steps (Iterative refinement for usability):**

      *   *Step 1: Mechanism.* (Stop if magical thinking).
      *   *Step 2: Threshold/Batch.* (Stipulate numbers).
      *   *Step 3: Probability of Trigger.* (The math part).
      *   *Step 4: Burden.* (Human judgment).
      *   *Step 5: Coordination Multiplier.* (How many others will this move?).

      *   *Wait, the prompt requires specific "Stop with No" and "Hand-off to Human" markers.* I need to be explicit about that.

  6.  **Developing the Worked Cases:**

      *   *(a) Skip one flight:* High carbon savings per act. Low threshold (one flight cancelled = immediate savings? Or does it depend on airline scheduling?). Actually, flights are continuous, not threshold-based usually. But airlines cancel routes based on demand. Let's treat it as a threshold of "route cancellation" or just direct emissions. Direct emissions is easier for EV.
      *   *(b) Drop beef:* User wants it to pass. But the "one burger" objection is strong. I need to use the Threshold View. If 1,000 people drop beef, a farmer switches crops. What is the probability *our* 40k supporters hit that 1,000? High. What is the probability *my* specific pledge is the one that tips us over 1,000? Low (1/1000). But the EV is (Benefit of farmer switching) * (1/1000). If the benefit is huge, EV is positive. *Crucial:* I must not rig this. If the math says no, I say no. But I can stipulate numbers that make it pass realistically (e.g., high probability of collective success).
      *   *(c) Vote:* Classic pivotality. Probability is 1 in millions. Benefit is huge (policy change). EV = Tiny * Huge. Usually comes out positive in philosophy lit, but skeptics hate it. I need to be consistent with the Threshold View.

  7.  **Refining the Causal Core Defense:**

      *   I need to be firm. The view is **"Complicity in Sufficient Sets" (or Expected Value over Thresholds).**
      *   *Argument:* Individual acts are not isolated; they are tickets in a lottery for a threshold outcome. The objection "my vote doesn't matter" is false because *someone's* vote matters, and you don't know if it's yours. Therefore, the expected value is non-zero.
      *   *Honesty:* I must admit this relies on stipulated probabilities, not empirical certainties.

  8.  **Drafting the Content - Section by Section:**

      *   **Preamble:** Define the "Threshold Expected Value" (TEV) view. Defend it.
      *   **The Procedure:** 5-6 steps. Clear stop/hand-off points.
      *   **Worked Cases:** Apply the steps rigorously.
      *   **Limitations:** What does this miss? (Integrity, long-term culture shift not captured by thresholds).

  9.  **Self-Correction/Review against Constraints:**

      *   *Constraint:* "Officers with no philosophy training will run this in under thirty minutes." -> Keep the math simple. Use "Order of Magnitude" estimation, not calculus.
      *   *Constraint:* "Be honest about which steps are judgment calls dressed up as procedure." -> I will label these explicitly.
      *   *Constraint:* "If the test you committed to yields that result anyway [rejecting beef], say so plainly." -> I will ensure the beef case passes *if* the numbers support it, but acknowledge if the TEV view makes it fragile. Actually, the TEV view is usually *better* for beef than pure EV because supply chains operate on batches (containers, pallets). I can use that.
      *   *Constraint:* "Handle coordination cases." -> Step 4 of the procedure will address the "Multiplier."

  10. **Final Polish:** Check tone. Professional, directive, philosophical but practical. Ensure the "No" stops are clear.

      *(Self-Correction on the Beef Case)*: The user says "I do not want the procedure telling supporters that no single purchase matters." The TEV view *does* imply a single purchase rarely matters *on its own*, but it matters as part of the probability of the threshold. I need to phrase the output carefully: "Your purchase matters because it contributes to the probability of the threshold being met," not "Your purchase directly stops a cow." This distinction is crucial.

      *(Self-Correction on Voting)*: Voting is the hardest for TEV because the threshold is usually "majority," and the probability of being pivotal is infinitesimal. However, if we treat it as "contributing to a mandate" (a softer threshold), it works better. I will stick to the hard "pivotal" math to be consistent, even if it makes voting look weak, OR I will argue that local elections have smaller denominators. Let's go with Local Election = smaller denominator = higher probability.

      *(Final Plan for Procedure Steps)*:
      1.  Causal Mechanism (Stop if magical).
      2.  Threshold Definition (What is the 'batch'?).
      3.  Probability of Trigger (Are we near the batch limit?).
      4.  Coordination Multiplier (Will this recruit others?).
      5.  Burden Assessment (Human Judgment Hand-off).
      6.  Final Go/No-Go.

      Let's write it.

      *Wait, one more check on the "Causal Core".* The prompt asks me to *pick one* and *defend it*. I will choose **"Expected Value with Threshold Triggering."** This is the standard analytic philosophy response to the "inefficacy objection" (associated with Alastair Norcross, Shelly Kagan, etc.). It argues that while one act rarely *guarantees* a result, it has a *probability* of being the trigger (e.g., the 10,000th burger that causes the order for 1,000 more).
      *Why this one?* It's the only one that respects the skeptic's demand for causal linkage without retreating into vague "signaling." It forces the officers to do the math (or estimates) rather than hand-waving.

      *Wait, the prompt asks for "where the procedure stops with a 'no,' and where it explicitly hands the decision back to a human."* I need to make sure I mark these clearly.

      *Let's refine the "Coordination" handling.* If the pledge is *about* coordination (e.g., "post about this on social media"), the impact *is* the coordination. If the pledge is "drop beef," coordination is a secondary benefit. I will add a step for "Secondary Multiplier."

      *Okay, ready to draft.*
answer: |-
  ## Preamble: The Causal Core

  **Official Test: Expected Value with Threshold Triggering (EV-TT)**

  We reject the "inefficacy objection" not by denying its premise (that one act rarely guarantees an outcome) but by denying its conclusion (that one act therefore has no value). We adopt the **Expected Value with Threshold Triggering** view.

  **The Logic:** Most environmental and political harms operate on thresholds (batch sizes, election majorities, policy tipping points). While your single burger does not *guarantee* a cow is spared, supply chains order in batches (e.g., pallets of 1,000 units). If demand drops by one pallet, production adjusts. Your purchase has a small probability (1 in 1,000) of being the specific unit that triggers the reduction of that entire batch. Therefore, the expected value of your act is: *(Benefit of the Batch) × (Probability of Triggering the Batch)*.

  **Why This View:**
  1.  **It respects the skeptic:** It admits you are not a magic wand. It does not claim "every bit helps" in a continuous sense; it claims "every bit holds a lottery ticket for a big change."
  2.  **It is consistent:** It applies the same math to beef (supply batches), flights (route viability thresholds), and voting (majority thresholds).
  3.  **It bites:** If the probability of triggering a threshold is effectively zero (e.g., a national election with 100 million voters), this procedure will rate the pledge as causally weak, regardless of how "virtuous" it feels. We accept this risk. It is better to reject a popular pledge honestly than to defend a false causal claim.

  **Note on Signaling:** This procedure treats "signaling" or "coordination" not as a mystical aura, but as a **causal multiplier**. If your act causes two others to act, your expected value includes their contribution. If you cannot demonstrate that link, signaling counts for zero.

  ***

  ## The Decision Procedure: Pledge Viability Assessment (PVA)

  **Time Limit:** 30 Minutes
  **Operator:** Program Officer
  **Inputs:** Proposal Draft, Internal Data on Supporter Base

  ### Step 1: The Causal Mechanism Check
  **Question:** What is the specific physical or institutional mechanism by which this action, if aggregated, reduces harm or advances the goal?
  **Instruction:** Describe the chain. (e.g., "Reduced beef demand → Retailer orders fewer pallets → Farmer raises fewer cattle.")
  **Sufficient Answer:** A clear link between the action and a measurable outcome (carbon tons, animals spared, policy seats).
  **Stop Condition (NO):** If the answer relies on "raising awareness," "setting an example," or "spiritual alignment" *without* a subsequent step that converts that awareness into a threshold-triggering action by others.
  *   *Example Failure:* "People will see me not flying and feel inspired." (Stop: How does their feeling become a threshold trigger? If you cannot answer, Stop.)
  *   *Example Pass:* "People will see me not flying and book their own ticket cancellation." (Pass to Step 2.)

  ### Step 2: Threshold Identification
  **Question:** What is the "Batch Size" or "Threshold Number" for this mechanism?
  **Instruction:** Stipulate the number of individual acts required to produce one unit of measurable impact. Do not search for perfect data; use conservative estimates.
  **Sufficient Answer:** A specific number (N).
  **Judgment Call Warning:** This is an estimate dressed as math. If the mechanism is continuous (e.g., carbon emissions), set N = 1 (each act has direct value). If the mechanism is batched (e.g., supply chains, elections), set N = the batch size.
  **Stop Condition (NO):** If the Officer determines N is effectively infinite (e.g., "One vote in a US Presidential election").
  *   *Note:* For local elections, N is the margin of victory. For beef, N is the number of burgers in a wholesale order.

  ### Step 3: Probability of Trigger Estimation
  **Question:** Given our 40,000 supporters, what is the probability that *this specific cohort* will reach the Threshold (N) within the pledge period?
  **Instruction:** Estimate the uptake rate.
  *   Formula: *Expected Participants = 40,000 × Estimated Uptime %.*
  *   If *Expected Participants* < N, the probability of triggering the batch is low.
  *   If *Expected Participants* ≥ N, the probability is high.
  **Sufficient Answer:** A qualitative rating: **High** (We will definitely hit the threshold), **Medium** (We might hit it), **Low** (We will not hit it).
  **Stop Condition (NO):** If Rating is **Low**. (If we cannot reach the threshold collectively, individual acts have no trigger value.)

  ### Step 4: The Coordination Multiplier (Handling Coordination Cases)
  **Question:** Does this pledge include a specific mechanism to recruit *non-supporters*?
  **Instruction:** If the pledge is purely private (e.g., "vote secretly"), Multiplier = 1. If the pledge requires public commitment or social sharing (e.g., "post your meatless meal"), estimate how many new actors each supporter brings in.
  **Sufficient Answer:** A multiplier number (M). Default is 1.
  **Judgment Call Warning:** This is speculative. Do not inflate M to save a failing proposal.
  **Calculation:** Adjust Step 3 Rating. If *Expected Participants × M* ≥ N, upgrade Rating to **Medium** or **High**.

  ### Step 5: The Burden Hand-Off (Value Judgment)
  **Question:** Is the cost to the volunteer proportionate to the Expected Impact?
  **Instruction:** This step is **NOT** causal. It is ethical. The math above tells us if the act *works*. This step asks if we *may ask it*.
  **Sufficient Answer:** Director Approval.
  **Procedure:** The Officer cannot decide this alone.
  *   **Low Burden** (e.g., voting, one flight): Officer may approve if Steps 1-4 pass.
  *   **High Burden** (e.g., lifestyle overhaul, significant cost): Officer must flag for Director review.
  **Hand-Off Point:** If the pledge requires significant financial sacrifice, time, or social risk, stop and escalate. The procedure cannot determine "how much we may ask."

  ### Step 6: Final Authorization
  **Question:** Does the Expected Value (Benefit × Probability) justify the program resources required to market this pledge?
  **Instruction:** Compare the result of Steps 1-4 against the marketing budget.
  **Sufficient Answer:** Go / No-Go.
  **Stop Condition (NO):** If the causal probability (Step 3/4) is Low, the pledge is rejected regardless of Burden (Step 5). We do not ask volunteers to act ineffectively.

  ***

  ## Worked Cases

  ### Case A: Skip One Discretionary Flight Per Year
  **Step 1 (Mechanism):** Direct carbon reduction. Airlines adjust capacity based on aggregate demand.
  **Step 2 (Threshold):** Continuous mechanism. N = 1. (Each flight skipped saves carbon immediately).
  **Step 3 (Probability):** High. Every participant definitely skips carbon.
  **Step 4 (Multiplier):** M = 1 (Private action).
  **Step 5 (Burden):** Low/Medium. (Financial savings for some, inconvenience for others). Officer can approve.
  **Step 6 (Decision):** **PASS.**
  **Reasoning:** This bypasses the threshold problem because carbon is continuous. The inefficacy objection fails here: one less passenger *does* reduce expected emissions (airlines fly smaller planes or cancel routes over time based on load factors).
  **Officer Script:** "Your flight doesn't cancel the plane today, but it lowers the load factor that determines next season's schedule. You are directly reducing demand."

  ### Case B: Drop Beef Entirely
  **Step 1 (Mechanism):** Reduced demand → Retailer reduces orders → Farmer reduces herd.
  **Step 2 (Threshold):** Batched. Supply chains move in pallets/containers. Stipulated N = 1,000 burgers to trigger one reduced wholesale order.
  **Step 3 (Probability):**
  *   Supporters: 40,000.
  *   Estimated Uptake: 5% (2,000 people).
  *   2,000 people > 1,000 threshold.
  *   Rating: **High** (Collectively we hit the threshold).
  *   *Individual Trigger Probability:* 1 in 1,000 (Your burger is the one that tips the order).
  *   *Expected Value:* (1 Cow Saved per 1,000 burgers) × (1/1,000 chance you trigger it) = 0.001 Cows per burger. This is non-zero.
  **Step 4 (Multiplier):** M = 1.5 (Meat reduction is socially visible). Adjusted Participants = 3,000. Rating remains **High**.
  **Step 5 (Burden):** High. (Dietary change is difficult). **HAND-OFF TO DIRECTOR.**
  **Step 6 (Decision):** **PASS (Conditional).**
  **Reasoning:** The procedure validates the causal link. It does *not* tell supporters "your single burger saves a cow." It tells them: "Our group will definitely save cows; your pledge ensures we hit the number required to trigger the supply chain adjustment. Without you, we might miss the threshold."
  **Constraint Check:** You wanted this to pass without lying. The EV-TT view allows this. It admits the individual act is probabilistic but the collective act is deterministic.
  **Officer Script:** "One burger doesn't stop a slaughterhouse. But 2,000 of us skipping beef forces retailers to cancel orders. We need every pledge to ensure we cross that cancellation threshold."

  ### Case C: Vote in Next Off-Year Local Election
  **Step 1 (Mechanism):** Policy change via elected official.
  **Step 2 (Threshold):** Pivotality. N = Margin of Victory. Stipulated N = 50 votes (Small local district).
  **Step 3 (Probability):**
  *   Supporters: 40,000 (Geographically dispersed).
  *   Relevant District: 1,000 supporters live in the target district.
  *   Estimated Uptake: 50% (500 voters).
  *   500 voters > 50 vote threshold.
  *   Rating: **High** (Collectively we are a bloc).
  *   *Individual Pivotality:* Low (1 in 500 chance of being the tie-breaker). But under EV-TT, we care about the *collective* threshold being met.
  **Step 4 (Multiplier):** M = 1 (Secret ballot).
  **Step 5 (Burden):** Low. Officer can approve.
  **Step 6 (Decision):** **PASS.**
  **Reasoning:** Unlike national elections, local off-year elections have small denominators. The probability of the *group* impacting the outcome is high. The individual's contribution is necessary to maintain the group's block.
  **Officer Script:** "In a national election, your vote is a drop in the ocean. In this local race, 500 of us can decide the seat. We need you to be one of the 500."

  ***

  ## Limitations: What This Procedure Cannot Do

  **1. It Cannot Validate "Pure Signaling"**
  If a pledge has no causal pathway to a threshold (e.g., "Wear a green ribbon to show you care"), Step 1 will kill it. If your strategy relies on vague cultural shifts without a mechanism to convert culture into policy or consumption thresholds, this procedure will reject your pledges. This is a feature. It forces you to build the conversion mechanism (e.g., "Wear the ribbon AND sign this petition") or admit the pledge is cosmetic.

  **2. It Misfires on "Integrity" Arguments**
  Some supporters act because "it is who I am," regardless of impact. This procedure treats that as irrelevant. If the causal math (Steps 2-4) fails, the pledge is rejected, even if it would bring personal meaning to the volunteer. We prioritize efficacy over expression.

  **3. It Relies on Stipulated Numbers**
  Step 2 and 3 require officers to invent numbers (Batch sizes, uptake rates). Two officers might estimate the "beef pallet size" differently. This introduces variance. We accept this because the alternative (waiting for perfect data) paralyzes the program. The discipline is in *making* the estimate, not its precision.

  **4. It Cannot Set the "Burden" Limit**
  Step 5 is a hard hand-off. The procedure can tell you if a pledge *works*, but it cannot tell you if it is *fair* to ask a single mother to stop flying or a low-income supporter to buy organic. That is a political and ethical judgment reserved for leadership. The procedure prevents officers from hiding behind "efficacy" to justify unreasonable demands.

  **5. It Is Vulnerable to "Threshold Gaming"**
  Officers might be tempted to shrink the Threshold (N) artificially to make a pledge pass (e.g., claiming 10 burgers trigger a change instead of 1,000). This violates the honesty requirement of Step 2. Audits should check that stipulated thresholds are conservative, not optimistic.

  **Final Note to Officers:**
  If a supporter asks, "Does my one act really matter?" do not say "Yes, it saves the world." Say: "Alone, no. Together, we hit the switch. Your pledge is the insurance that we don't fall one vote short." That is the only truth this procedure allows you to tell.
