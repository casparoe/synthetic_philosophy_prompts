answer: |-
  Your intuition is correct: your colleague's argument is elegant but ultimately self-defeating. It proves too much because it dismantles the very possibility of statistical inference, including the Bayesian variety she champions. The flaw lies in **Premise (5)**.

  ### The Premise to Reject

  **Premise (5):** *"Since a procedure can be arranged under which significance arrives almost regardless of whether the hypothesis is true, procedure-level guarantees cannot be evidential properties at all."*

  This is the linchpin of the argument. It moves from the observation that *some* procedures (specifically, optional stopping) can be gamed to the conclusion that *all* procedure-level guarantees are devoid of evidential value. This is a hasty generalisation that creates a false dichotomy between 'procedure' and 'evidence'.

  ### Why It Looked Unassailable

  This premise exerts a strong philosophical pull for two reasons. Firstly, it appeals to the **Likelihood Principle**, which suggests that all evidence contained in data is captured by the likelihood function, rendering the sampling plan (the procedure) irrelevant to the *strength* of the evidence. To a Bayesian, the idea that the 'mind of the researcher' (i.e., when they intended to stop) could alter the evidence seems absurd.

  Secondly, it aligns with a naive realist intuition about measurement. We want our instruments to tell us about the world, not about our own patience. If a scale can be made to read '10 stone' simply by pressing down on it, we lose faith in the scale. Your colleague argues that because the p-value 'scale' can be pressed down on (via optional stopping), it measures nothing but pressure. This feels decisive because it frames the replication crisis as a mathematical inevitability rather than a sociological failure.

  ### Why It Must Be Rejected

  You must reject (5) because it conflates the **misuse** of a procedure with the **invalidity** of the procedure itself.

  Consider a physical balance scale. If I am allowed to add weights to the pan until the scale tips, I can make it tip regardless of the object's mass. Does this prove that 'tipping' is not a property of mass, or that procedure-level guarantees (like 'do not touch the weights') measure nothing? No. It proves that the measurement is only valid under specific procedural constraints.

  Premise (5) claims that because a procedure *can* be arranged to fail (optional stopping), procedure-level guarantees *cannot* be evidential. But pre-registration, fixed sample sizes, and power analysis are also procedure-level guarantees. If (5) were true, these reforms would be futile, as your own objection noted. The truth is that procedure-level guarantees are the *only* things that make data evidential. Without a protocol that restricts 'patience', no statistic—p-value or Bayes factor—can reliably track truth.

  ### The Cost of Rejection

  Rejecting Premise (5) restores the possibility of valid inference, but it extracts a price from both sides of the debate.

  **The Price for You (The Frequentist Defence)**
  You must concede that a p-value is not an intrinsic measure of evidence residing in the data. It is a property of the *test*, contingent on the design. You cannot look at a significant result in a published paper and interpret it as 'strong evidence' without knowing the procedure that generated it. A $p < .05$ from a pre-registered study and a $p < .05$ from a 'peeked' study are numerically identical but evidentially distinct. You must accept that the p-value is a decision rule, not a truth meter, and its validity is entirely parasitic on procedural integrity.

  **The Price for Your Colleague (The Bayesian Concession)**
  This is the heavier cost. Your colleague claims in Premise (4) that Bayesian analysis is "untouched by the stopping rule." While mathematically true regarding the *calculation* of the Bayes factor (adhering to the Likelihood Principle), rejecting (5) forces her to admit that **calibration matters for truth-tracking**.

  If a researcher computes Bayes factors continuously and stops only when $BF > 10$, they *will* inflate the rate of false positives in the long run, even if the BF calculation itself is 'coherent'. By rejecting (5), your colleague must admit that:
  1.  **Bayesian methods are not immune to 'patience'.** While the *number* doesn't change, the *frequency* with which that number misleads does. If the goal of science is to populate the literature with true claims (as Premise 6 suggests), then the stopping rule *does* matter for the reliability of the literature.
  2.  **'Prior Hacking' is analogous to P-Hacking.** If procedure-level guarantees are necessary (as rejecting (5) implies), then the Bayesian's choice of prior is a procedural vulnerability. A researcher can try different priors until the Bayes factor favours their hypothesis. To claim immunity here is to claim that priors are not subjective procedural choices.
  3.  **Pre-registration is required for Bayes too.** She cannot consistently argue that p-values require pre-registration to be trustworthy while Bayes factors do not. If the literature tracks 'patience' (Premise 6), it will track Bayesian patience just as readily as frequentist patience unless procedural constraints are applied to both.

  ### Conclusion

  The replication crisis is not a failure of significance testing *per se*; it is a failure of **protocol enforcement**. Your colleague's argument identifies a vulnerability in frequentist testing (optional stopping) but incorrectly diagnoses it as a fatal flaw in the concept of procedural evidence.

  By rejecting Premise (5), you preserve the utility of pre-registration and power analysis. However, you force your colleague to abandon the comforting notion that Bayesian methods are a 'free lunch' immune to researcher degrees of freedom. Both camps must agree that without strict procedural discipline, no statistic can distinguish truth from patience.
