      *   *Wait, P1 (Confederate):* Direct victims of slavery were long dead. But the *community* was harmed. So Principle 2 needs to be careful about "Direct Victims." P2 explicitly says "no one harmed by him is alive." P1 implies the harm continues through systemic racism/community standing.
      *   *Better Distinction:*
