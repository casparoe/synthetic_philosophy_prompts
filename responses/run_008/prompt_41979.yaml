      *   *Actually, stick to the current tension:* The tension is "Direct Victims Dead" vs "Descendants Local."
      *   Future Case: A statue of a 1920s eugenicist (like Corwin) but *no* local descendants remain, yet a national group petitions. OR, a statue of a slaveholder where the *direct* slaves' descendants are gone (migration), but the current Black community objects.
      *   Let's go with: A statue of a 19th-century industrialist. He paid starvation wages (harm to workers). Direct workers dead. No descendants locally (workers moved). But a Labor Union petitions.
