          *   **Principle B (Historical Specificity & Survivorship):** The moral standing of a monument depends on whether the *direct victims* are alive and whether the monument specifically honors the *harmful acts* versus other achievements. (Supports P2, P4).

      *   *Applying to Corwin:*
