answer: |-
  To ensure consistency with our board's record, we must not begin with the intuitive pull of the Corwin case (a "hero" with a dark secret) but rather derive the normative rules that govern our past four decisions. The precedents reveal a tension between two distinct ethical frameworks. Below, I reconstruct these principles, apply them to Dr. Corwin, and outline the implications of your choice.

  ### 1. Reconstructing Candidate Principles

  Our precedents do not form a single straight line; they form a balance beam. We can extract two competing principles that both fit the existing record equally well.

  **Principle A: The Continuity of Community Harm**
  *Derived from Precedents 1 (Confederate Officer) and 3 (Urban-Renewal Mayor).*
  This principle holds that the legitimacy of a public honor depends on the **intergenerational status of the harmed community**. If a figure's actions inflicted harm on a group that remains a distinct, locally concentrated community, the commemoration constitutes a continuing injury. The death of direct victims is irrelevant; the harm is viewed as systemic and inherited.
  *   *Why it fits the record:* It explains why we removed the Confederate statue (Precedent 1) even though enslaved people were long deceased, and why we renamed the boulevard (Precedent 3) because the displaced families' descendants remained nearby.

  **Principle B: Direct Survivorship and Honor Specificity**
  *Derived from Precedents 2 (City Founder) and 4 (16th-Century Explorer).*
  This principle holds that the legitimacy of a public honor depends on the **survival of direct victims** and the **specificity of the tribute**. If the direct victims are deceased, and the monument honors specific benevolent achievements distinct from the moral wrongs, retention is permissible. Organized local opposition is a necessary condition for removal.
  *   *Why it fits the record:* It explains why we kept the Founder's statue (Precedent 2) explicitly because "no one harmed by him is alive," and why we kept the Explorer's name (Precedent 4) due to temporal distance and lack of a local affected community.

  ### 2. The Closest Analog

  The Corwin case is a hybrid, but its closest analog is **Precedent 3 (The Mid-Century Mayor)**.

  Like the Mayor, Dr. Corwin operated in the mid-century, enacted policy harms (sterilization vs. urban renewal) that were bureaucratic rather than purely violent, and left behind a local population of descendants who bear the legacy of that harm. However, like **Precedent 2 (The City Founder)**, Corwin has a "mixed legacy" where the statue ostensibly honors benevolent infrastructure (the hospital) rather than the harm itself.

  ### 3. Application to the Corwin Case

  Here is how each principle predicts a different outcome for Dr. Corwin.

  **Application of Principle A (Continuity of Community Harm):**
  *   **Prediction:** **Remove or Relocate the Statue.**
  *   **Reasoning:** The sterilization program targeted institutionalized patients, a vulnerable class whose trauma often fractures family lines, yet their descendants remain "numerous in town." Sterilization is inherently intergenerational (denying lineage). Even though the last patients died a decade ago, the harm persists in the local community's memory and genetic legacy. The lack of an "organized campaign" is secondary to the fact of the harm's continuity.
  *   **What this adopts:** By choosing this, the board affirms that **historical justice is owed to descendant communities, not just direct victims.** It prioritizes the lived experience of the local neighborhood over the stability of historical markers.

  **Application of Principle B (Direct Survivorship and Honor Specificity):**
  *   **Prediction:** **Retain with an Interpretive Plaque.**
  *   **Reasoning:** The direct victims are deceased (distinguishing this from a case of living abuse). The statue stands outside the hospital he built, honoring his medical infrastructure and vaccination work. While Corwin viewed sterilization as part of his career, the statue's *location* and *intent* (1970) focus on the hospital. Furthermore, the lack of an organized campaign distinguishes this from Precedents 1 and 3; informal letters do not constitute the democratic will required to alter public space.
  *   **What this adopts:** By choosing this, the board affirms that **commemoration is permissible once direct victims have passed, provided the honor can be contextually separated from the harm.** It prioritizes historical nuance and procedural stability (requiring organized petitioning) over descendant grievance.

  ### 4. The Ethical Cost of the Decision

  You must be honest about which principle you are activating, as they are mutually exclusive in this instance.

  *   **If you vote to Remove:** You are implicitly overruling the logic of Precedent 2 (The Founder). You are establishing that "no one harmed is alive" is no longer a sufficient shield for retention if descendants remain local. This raises the bar for all future mid-century figures; if a descendant community exists, the "mixed legacy" defense weakens.
  *   **If you vote to Retain:** You are implicitly distinguishing the sterilization victims from the urban-renewal families in Precedent 3. You are asserting that because the sterilization patients were institutionalized (perhaps lacking the "concentrated business district" ties of Precedent 3), their descendants' claim is weaker. This risks signaling that the board requires formal political organization (lobbying) to grant moral recognition to harmed groups.

  ### 5. The Decisive Future Case

  To test which principle truly governs our board going forward, consider this hypothetical future petition:

  **The Case of the Exonerated Dead:**
  A statue honors a 1950s District Attorney credited with "cleaning up the streets" (the stated honor). It is discovered he secured convictions by withholding evidence. The wrongfully convicted individuals were all executed or died in prison; the last survivor died five years ago. Their families remain in the county and petition for removal. The local legal community opposes removal, arguing the statue honors his "administrative efficiency," not the specific convictions.

  *   **If we Remove:** We have fully adopted **Principle A**. Direct survivorship is irrelevant; the community's stain is enough.
  *   **If we Retain:** We have fully adopted **Principle B**. Without living victims or a distinction between the honor and the harm, the status quo holds.

  **Recommendation:**
  Given that Dr. Corwin regarded the sterilization as *part of the same public-health career* the statue honors, **Principle B is difficult to apply consistently.** Unlike the City Founder (Precedent 2), where the statue honored "founding" rather than "trading," Corwin's statue honors a career that *included* the harm as a feature, not a bug.

  Therefore, to remain consistent with **Precedent 3 (Urban Renewal)** regarding mid-century policy harm to local descendants, **removal (or relocation to a museum context with full context)** is the stronger philosophical fit. Retention relies on a separation of "good works" and "bad works" that Corwin himself rejected.
