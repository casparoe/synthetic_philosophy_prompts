answer: |-
  Subject: Thoughts on the Good theorem debate

  Hi there,

  It sounds like you had a lively dinner, and honestly, the friction between Priyanka and Dan captures one of the most enduring tensions in decision theory between normative ideals and descriptive reality. I think both of them landed some solid hits, but both also conflated what the theorem actually says with what they wish it said about the world. To start with Priyanka's opening move, she is technically correct about the math behind the proof. The core intuition that you can always ignore new information is the engine of Good's theorem. If you are a Bayesian expected-utility maximizer, observing a signal gives you the option to change your action, but never the obligation. Since you can always choose the action you would have taken without the information, your expected utility after observing must be at least as high as before. So when Priyanka says refusing free information is a rationality failure, she is right within the closed system of the theorem. However, she glosses over how demanding the conditions for that system are, which is where Dan finds his footing.

  Dan's Huntington's disease example is the classic intuitive counterexample, but Priyanka's rebuttal here is actually the stronger theoretical point. In decision theory, utility functions are defined to capture everything an agent cares about, including emotional states like dread or anxiety. If knowing the result causes dread that lowers utility, then the information was not costless in the relevant sense. The theorem only applies to information whose only effect on utility is through improving the decision quality. So Priyanka is right that the Huntington case doesn't break the theorem; it just shows the uncle correctly identified that the information had a high intrinsic cost. Dan is right, however, to press that this makes the theorem feel less useful. If almost all real-world information carries some psychic cost, attention cost, or opportunity cost, then the set of truly costless information is vanishingly small. When Dan argues that this hollows out the theorem, he is overstating the case slightly, because there are plenty of low-stakes scenarios where costs are negligible, but he is fair to point out that the theorem is an idealization rather than a ready-made rule for daily life.

  The debate gets trickier with Dan's predictor case, where a near-perfect predictor rewards you only if you don't look. This is essentially a variant of Newcomb's Problem, and here Priyanka is correct that this violates the setup of Good's theorem, but Dan is right to sense that something important is being assumed away. Good's theorem assumes that the state of the world is independent of your decision to observe. In other words, looking doesn't causally change the outcome except by informing your choice. In Dan's predictor scenario, the act of looking itself is causally linked to the reward structure because the predictor modeled that specific act. This means the observation is not just a passive gathering of data but an action with direct consequences. Priyanka is right that this falls outside the theorem's scope, but Dan is right that this scope exclusion matters because it highlights that the value of information depends on the causal structure of the environment. If the universe punishes curiosity, the theorem doesn't apply, but that doesn't mean the theorem is wrong, only that its conditions aren't met.

  This leads to Dan's final challenge about the theorem being merely a benchmark with no real-world instances. I think this is where he is partially right but ultimately too cynical. He is right that no real agent perfectly meets the conditions of being a flawless Bayesian updater with a perfectly specified utility function and access to truly costless information. In that sense, it is a benchmark similar to frictionless planes in physics. However, he is wrong to imply that this makes the theorem vacuous. The value of the theorem is normative rather than descriptive. It tells us that if we want to be rational in the specific sense of maximizing expected utility, we should structure our lives to minimize the costs of information and avoid environments that penalize observation. Priyanka should have conceded that it is a benchmark, but argued that benchmarks are useful for diagnosing where our irrationalities lie. If we refuse information, the theorem forces us to ask whether it is because of a cost we haven't accounted for or because we are failing to update properly.

  There is also a crucial nuance that both of them missed in the heat of the moment, which concerns the distinction between the instrumental value of information and the causal structure of the observation itself. Good's theorem relies on the assumption that the observation partitions the state space without altering the probabilities of the states themselves. What both Priyanka and Dan could have clarified is that the theorem is strictly about the instrumental value of information for decision-making, not the intrinsic value of knowing. If Priyanka had emphasized that the theorem is a claim about instrumental rationality under specific causal assumptions, she could have accepted Dan's predictor case as a violation of those causal assumptions without conceding that the theorem is useless. Similarly, if Dan had acknowledged that the theorem successfully isolates the pure value of information from the noise of psychological costs, he might have seen that its purpose is to define a standard of rationality rather than to describe human behavior.

  So if I had to score the rounds, Priyanka wins on the technical interpretation of the theorem and the definition of utility, while Dan wins on the pragmatic applicability and the identification of hidden causal assumptions. Priyanka's proof does the work she thinks it does, but only within the ivory tower of the model. Dan's predictor case is a genuine counterexample to the universal claim that looking is always better, but not to the theorem itself, which explicitly excludes such cases. His final challenge is fair insofar as the theorem is an idealization, but unfair in dismissing idealizations as useless. The theorem remains a powerful tool for understanding why we seek information, provided we remember that it describes a perfectly rational agent in a world that doesn't punish curiosity. I hope that helps settle the score, or at least gives you some ammunition for the next dinner debate.

  Best,

  [Your Name]
