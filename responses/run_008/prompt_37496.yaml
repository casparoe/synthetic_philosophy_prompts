      *(Self-Correction during drafting)*: I initially thought about calling the "Standing" view false. But in contemporary ethics (e.g., Bell, Fritz), the idea that hypocrisy undermines standing is a serious view. I should label it "Contested/Plausible" rather than false. However, I must emphasize that lacking standing doesn't make the *act* permissible.

      *(Refining the "Outcome" check)*: The user said the result was "criticism was dropped, the plagiarist kept his seat." This implies the accusation was treated as illegitimate *and* the underlying act was ignored. I need to point out that *none* of the interpretations justify ignoring the plagiarism itself, only the *source* of the accusation. This is the "smuggled" move the user sensed.

