answer: |-
  You are absolutely right to feel that something was smuggled in. Your intuition is spot-on: the proverb was used to conflate **the legitimacy of the critic** with **the legitimacy of the criticism**.

  In your group, the move was:
  1.  **Premise:** The critic is a hypocrite (tax fudger).
  2.  **Proverb:** Hypocrites shouldn't criticize.
  3.  **Conclusion:** Therefore, the criticism is void *and* the accused (plagiarist) is effectively exonerated (kept his seat, treated as wronged).

  Step 3 is the non-sequitur. Even if the critic lacks the *standing* to blame, the plagiarism remains plagiarism. Below is a menu of interpretations of the proverb, analyzed for plausibility and whether they actually support the outcome your group reached.

  ### The Menu of Interpretations

  #### 1. The Prudential Reading (Self-Preservation)
  *   **The Claim:** If you criticize others while being vulnerable to the same criticism, you invite retaliation. You should stay silent to protect yourself from exposure.
  *   **(a) Plausibility:** **High.** This is the literal meaning of the metaphor. Glass houses break when stones are thrown back. It is a pragmatic warning, not a moral one.
  *   **(b) Does it support the group's outcome?** **No.** This explains why the tax fudger should be *quiet*, but it says nothing about whether the plagiarism is acceptable. It supports "she should keep quiet," but definitely not "he is innocent." Using this to let the plagiarist keep his seat is a category error.

  #### 2. The Evidential Reading (Reliability)
  *   **The Claim:** A hypocrite is an unreliable judge of moral facts. Their criticism is likely motivated by deflection or bad faith, so we should discount their testimony.
  *   **(a) Plausibility:** **Low/False.** This is a version of the *ad hominem* fallacy. A clock that is broken twice a day is still right twice a day. A tax cheat can correctly identify plagiarism. Hypocrisy affects the *motive*, not the *truth value* of the claim.
  *   **(b) Does it support the group's outcome?** **No.** Even if we discount her testimony, the group still has an independent obligation to investigate the plagiarism. Dropping the issue entirely based on her lack of reliability is intellectual laziness, not ethics.

  #### 3. The Standing Reading (Forfeiture of Authority)
  *   **The Claim:** By violating the norm herself, the critic forfeits the *moral standing* to hold others accountable. She has no right to blame, even if the blame is accurate.
  *   **(a) Plausibility:** **Contested/Plausible.** This is a serious position in contemporary moral philosophy (e.g., the work of Macalester Bell or Christopher Fritz). Hypocrisy can undermine the *authority* to blame, though not the *truth* of the blame.
  *   **(b) Does it support the group's outcome?** **Partially, but dangerously.** It supports "she should not be the one to call him out." However, it does **not** support "no one can call him out" or "he did nothing wrong." If the group used this to say "we cannot punish him because *she* was the accuser," they confused *who* can punish with *whether* punishment is due. The plagiarism still needs addressing by someone with standing.

  #### 4. The Fairness Reading (Selective Enforcement)
  *   **The Claim:** It is unjust to punish Person B for a fault that Person A possesses and is not punished for. Blame must be distributed consistently.
  *   **(a) Plausibility:** **High.** This appeals to principles of justice and equality. It feels unfair to scapegoat the plagiarist while letting the tax fudger slide.
  *   **(b) Does it support the group's outcome?** **No, it contradicts it.** The Fairness Reading implies you have two options: (1) Punish both, or (2) Punish neither *for now* until you can punish both. It does **not** justify punishing neither while pretending the offense didn't happen. The group chose "ignore the plagiarism," which is not fairness; it's negligence. To be fair, they would have had to turn their attention to the tax fudger next.

  #### 5. The Global Skeptic Reading (Universal Sin)
  *   **The Claim:** Everyone is in a glass house. No one is innocent enough to blame anyone. Therefore, blame itself is illegitimate.
  *   **(a) Plausibility:** **False/Paralyzing.** If accepted, this dissolves all moral community. If no one can blame anyone, ethics reading groups cannot function (since they discuss normative claims).
  *   **(b) Does it support the group's outcome?** **Yes, but at too high a cost.** This would justify dropping the criticism and keeping the plagiarist. However, it also means the group cannot criticize *anything* ever again. If they use this logic, they must also admit they cannot criticize the tax fudger, the plagiarist, or anyone else. It renders the group ethically mute.

  #### 6. The Social Harmony Reading (Disruption)
  *   **The Claim:** Hypocritical criticism causes more social damage (resentment, division) than the original fault. Preserving the group's cohesion is more important than correcting the specific fault.
  *   **(a) Plausibility:** **Plausible (in specific contexts).** In some communal settings, peace is prioritized over punitive justice.
  *   **(b) Does it support the group's outcome?** **Yes.** This is likely what actually happened. The older member prioritized the group's peace over the ethical violation. However, this is a pragmatic trade-off, not a moral vindication. It admits the plagiarism is bad but decides it's too costly to address. This should have been stated openly rather than hidden behind a proverb.

  ---

  ### The "Self-Undermining" Objection

  You asked: *The proverb itself is a criticism of the person throwing stones, so is there a reading where it undermines itself? Whoever says it is throwing a stone from their own glass house, no?*

  This is not you being cute; this is a recognized philosophical problem often called **The Paradox of the Preacher** or a performative contradiction.

  *   **The Problem:** If the proverb means "No one with faults should criticize," then the older member (who presumably has faults) is violating the rule by criticizing the tax fudger for criticizing.
  *   **Is it a fatal flaw?** Not necessarily, but it limits the scope.
      *   **Defense 1:** The older member is not throwing a "stone" (a moral condemnation of a specific act) but rather pointing out a rule of engagement. They are acting as a moderator, not a moral accuser.
      *   **Defense 2:** The older member claims immunity (e.g., "I have never fudged taxes nor plagiarized"). If they are innocent of the relevant faults, their house isn't glass.
      *   **The Real Issue:** If the older member used the proverb to *shut down debate*, they are exercising authority. If their authority rests on the claim that "hypocrites shouldn't speak," but they are speaking to enforce that claim, they are engaging in the very behavior they forbade.

  **Verdict for your group:** You can point out that by invoking the proverb to silence the tax fudger, the older member assumed a moral standing they just argued the tax fudger didn't have. If the tax fudger lacks standing due to faults, why does the older member have standing to adjudicate? Unless the older member claims perfection, they are indeed throwing a stone from a glass house.

  ### Summary for the Group

  When you bring this back, here is the core distinction you sensed was "smuggled":

  1.  **Silencing the Critic:** Most interpretations of the proverb (Prudential, Standing, Fairness) might suggest the tax fudger shouldn't be the *one* to raise the issue.
  2.  **Exonerating the Accused:** None of the interpretations suggest the plagiarism is *okay*.

  Your group used the proverb to achieve #2 by pretending it was about #1. That is the sleight of hand. The proverb might mean "She shouldn't have said it," but it never means "He didn't do it."
