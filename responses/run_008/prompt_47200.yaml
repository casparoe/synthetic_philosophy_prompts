answer: |-
  **Excerpt from Chapter 6: *The Ledger***

  The van smells like wet cardboard and cypermethrin. It's a smell that sticks to the back of your throat, sweet and chemical. I'm sitting in the driver's seat, engine off, writing up the invoice for the Brownsville job. Unit 4B. German cockroaches. Bad infestation.

  I write down the square footage. I write down the milliliters of suspension concentrate. Then I do the multiplication.

  *Estimated population density: 150 per square meter in the kitchen void.*
  *Kill rate of product: 94% within four hours.*
  *Total bodies: roughly 12,000.*

  Maya is in the passenger seat, scrolling through her phone. She's home from grad school for the weekend. She knows I do this. She knows I count.

  "You're doing the faces again," she says. She doesn't look up.

  "Not faces. Numbers."

  "Same thing with you. You're trying to balance the book."

  "I am balancing the book," I say. I tap the pen against the clipboard. "Twelve thousand units. Let's say the odds are one in fifty that they have a subjective experience of the neurotoxin. Let's say the moral weight of that experience is one percent of a mouse. You'd think that wipes the slate clean. A fiftieth of a hundredth is nothing. It's noise."

  " Dad," she says. She puts the phone down. "We talked about this. That's the discounting move. You're reducing the value of the individual to account for your uncertainty."

  "It's honest accounting. I don't know if they feel it. So I mark the asset down."

  "But then you multiply," she says. She turns in the seat to face me. This is her seminar voice. Calm, precise. "You take that tiny, discounted fraction and you multiply it by twelve thousand. And then you do that for every apartment in the complex, every complex in the city. You're saying the sum of the tiny nothings becomes a something. A big something. Bigger than the dog I know feels pain. Bigger than the cow."

  "The math says yes."

  "The math assumes the units are additive," she says. "That's the leap. If I'm unsure whether a single insect matters, why am I allowed to stack them up like poker chips? If the value of one is uncertain, the value of the pile is just a bigger uncertainty. You're treating the aggregation as solid ground when the foundation is mud."

  She's got me there. Logically. If the premise is shaky, building a skyscraper on it doesn't make it stable. It just makes a bigger collapse.

  I look at the invoice. 12,000.

  "It's not the value that adds up, May," I say. "It's the event."

  "Explain."

  "Take radiation. You stand next to a Geiger counter. One click. Maybe it's background. Maybe it's nothing. You don't worry. You get a thousand clicks a second, the needle pins. You run. You don't say, 'Well, I'm unsure if each individual photon causes cellular damage, so I'm unsure if the sum of them does.' The physical impact stacks. The exposure stacks."

  "Insects aren't radiation."

  "No. But they're physical. They exist. I spray the poison. The poison enters the nervous system. The system shuts down. That happens twelve thousand times. That is a fact. The only variable is the light inside the box. Whether someone is home to watch the lights go out."

  I cap the pen.

  "Here's the thing," I say. "You say I shouldn't add them up because I'm unsure about the individual. But I'm not unsure about the *risk*. I know there is a non-zero chance they suffer. If I have a one percent chance of crashing this van, I wear a seatbelt. I don't say, 'Well, since it's only one percent, I won't bother calculating the impact of hitting a wall.' The probability applies to the instance. But the consequence... the consequence is real if it triggers."

  "So you're maximizing expected value," she says. "Standard utilitarian calculus."

  "I'm a pest guy. I deal in infestations. An infestation isn't one bug. It's a system. If I leave a crack in the seal, they don't send one scout. They send a stream. The damage isn't in the single bite; it's in the colony."

  I lean forward, resting my elbows on my knees.

  "Look. You want me to discount the sum because the unit is uncertain. That implies the uncertainty is in the *counting*. But I counted them. They're dead. The uncertainty is in the *weight*. And weight is linear. If a feather weighs one percent of a brick, I need a hundred feathers to match the brick. I don't say, 'Feathers are too light to weigh, so a pillow weighs nothing.' At some point, the volume of the doubt gets crushed by the volume of the bodies."

  Maya sighs. She looks out the window at the complex. It's a big one. Four stories. Forty units.

  "But Dad," she says softly. "That logic has no stop. If you apply that to bacteria, you can't move. You can't breathe. You paralyze yourself. If the scale always wins, the tiny probability always wins against the certain suffering of the things we know love us. It makes you a monster to the dog to save the ghosts of the roaches."

  "I know," I say.

  "It makes your ethics fanatical."

  "I know."

  "So how do you live with it? How do you spray tomorrow?"

  I pick up the clipboard. I look at the total at the bottom of the page.

  "I don't solve it," I say. "I just carry the number. You want me to stop adding them up because the individual value is fuzzy. But if I stop adding, I'm pretending they aren't there. I'm pretending the pile doesn't exist just because I can't see the faces."

  I start the engine. The van shudders.

  "You say I'm wrong to sum the uncertainty. Maybe I am. Maybe the math breaks down at that scale. But if I'm wrong, and they do feel it... then the pile is a mountain of pain, and I'm the one with the shovel. I'd rather be the guy who counted too high than the guy who didn't count at all."

  Maya doesn't answer. She just buckles her seatbelt.

  "Next stop?" she asks.

  "Queens," I say. "Termites."

  "Do termites count?"

  I put the van in gear. I think about the colony structure. The queen. The workers. The sheer biomass.

  "Let's hope they don't," I say. "But I'll run the numbers on the way."
