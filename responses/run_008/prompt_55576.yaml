answer: |-
  ### Quiet Brainstorming

  Maya's data set is fascinating precisely because it is *not* theoretically contaminated. She isn't reciting Van Inwagen or Lewis; she is reporting ontological commitments derived from lived experience. As a nurse, she deals with bodies (organisms) and equipment (artifacts) daily. This professional background likely primes her to recognize "functional wholes."

  The central tension in her verdicts lies between the **Cairn** (Yes) and the **Pile of Leaves** (No). Mereologically, these are similar: discrete parts arranged in a heap via gravity and friction. The differentiating factors are *intentionality* (hikers stacked the rocks) and *material stability* (rocks don't rot or scatter as easily as dry leaves).

  Then we have the **Coral** (Yes). This is the outlier that breaks a pure "Human Artifact" rule. Coral is natural, yet she grants it objecthood. Why? Likely because it presents as a single rigid structure (the skeleton) supporting a biological function. This aligns with the **Car** (rigid, functional) and **Body** (rigid-ish, functional).

  The **Murmuration** (No) and **Car + Driver** (No) verdicts tell us that *coordination* and *temporary contact* are insufficient. There must be a deeper bond.

  So, is she a **Cohesion Theorist** (things compose when physically locked) or a **Kind Theorist** (things compose when they fall under a recognized category like "Organism" or "Tool")? The Coral verdict suggests Kind (it's a "head"), but the Cairn verdict suggests Cohesion (stacked rocks). The Leaves verdict suggests both matter: leaves lack the Kind (not alive, not a tool) and lack the Cohesion (too loose).

  To predict the River and Fire, I need to weigh whether she prioritizes *persistence* (stability over time) or *function*. Rivers and Fires are processes, not substances. They are defined by change, not stability. Given she rejected the Murmuration (dynamic) and Leaves (transient), I suspect she will reject processes.

  ### Candidate Rules

  Based on her track record, I have isolated two competing hypotheses that fit the data with high fidelity.

  **Rule 1: The "Teleological Substance" Rule (Ontological Kind)**
  *   **Definition:** Composition occurs if and only if the collection constitutes either a **living organism** (or colonial unit) or a **human-intended artifact** designed for a function.
  *   **Rationale:** This captures the Body, Coral, Car, and Cairn. It excludes the Leaves (no function/intent), Strewn Pebbles (no function), Murmuration (not a single organism), and Body+Chair (two substances, not one).
  *   **Strain Point:** The **Coral**. Biologically, it is a colony of distinct polyps. If Maya is strict about "organism," she should treat it like the Murmuration (a collection of animals). Her "Yes" verdict implies she accepts *functional biological unities* even if colonial, provided they act as a single unit.

  **Rule 2: The "Structural Integrity" Rule (Physical Cohesion)**
  *   **Definition:** Composition occurs if and only if the parts are **physically locked** or bonded in a way that resists immediate dispersal and maintains relative position without external intervention.
  *   **Rationale:** This captures the Body (flesh/bone), Car (bolted), Cairn (gravity stack), and Coral (calcium skeleton). It excludes the Murmuration (no contact), Strewn Pebbles (no contact), and Leaves (loose packing).
