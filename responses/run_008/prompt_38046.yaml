answer: |-
  1. "The episode, in brief"

  In 1912, Alfred Wegener proposed that continents move. He cited coastline fits and fossil matches across oceans. Established geologists rejected this, notably at a brutal 1926 American Association of Petroleum Geologists symposium, citing no plausible mechanism and methodological impropriety. Wegener died in 1930, his theory largely buried. In the 1950s and 60s, oceanographic surveys revealed magnetic striping on the seafloor and evidence of seafloor spreading. By 1968, the theory of plate tectonics unified these findings. The geological community rapidly accepted that continents drift, not by ploughing through crust, but by riding on moving plates. The field transformed from fixism to mobilism almost overnight.

  2. "Mapping it onto Kuhn"

  For Kuhn, science operates within a paradigm—a shared set of assumptions guiding normal science. Here, the relevant community was land-based geologists, primarily in Europe and America. Their paradigm was 'fixism': continents and oceans were permanent features fixed since the Earth's crust cooled. Mountain building was explained by crustal contraction, a puzzle-solving exercise that kept normal science busy for decades. Wegener's data were anomalies, but easily dismissed as coincidences or explained via ad hoc land bridges. There was no genuine crisis within normal science because the paradigm could absorb the noise without breaking; the anomalies weren't pressing enough to halt the daily work of mapping strata. The 'crisis' only emerged when oceanographers, operating outside this paradigm, produced data that fixism couldn't digest.

  The conversion fits Kuhn's generational model perfectly: older geologists resisted until retirement or death, while younger scientists, unburdened by fixist training, adopted plate tectonics. The shift wasn't just additive; it redefined what counted as relevant evidence, moving from fieldwork on land to geophysics at sea. It looks like a classic revolution: resistance, crisis, and a rapid flip where the new paradigm renders the old one obsolete. The community structure changed, but the psychological resistance Kuhn describes was palpable. The old guard didn't just disagree; they felt the new ideas violated the rules of the game. Yet, once the magnetic evidence arrived, the resistance collapsed swiftly, suggesting that while the crisis was external, the conversion mechanism was internal to the scientific psyche. Crucially, the new paradigm didn't just explain the old data; it made new predictions. It allowed geologists to see the ocean floor not as a static dump for sediment, but as a dynamic conveyor belt. This aligns with Kuhn's view that a successful revolution must promise to solve the problems that led to the crisis. However, the promise was kept by a different group of people than those who faced the crisis. The land geologists were the ones who needed converting, but the oceanographers were the ones who provided the salvation. This split dynamic is where the mapping gets interesting, because the 'scientific community' wasn't a monolith experiencing a shared crisis, but two overlapping circles where one held the keys to the other's lock.

  3. "Where the mapping strains"

  But the fit isn't perfect, and the cracks reveal something vital about how science actually works. First, the establishment wasn't defending a rival theory so much as a methodology. Their objection was procedural: 'we do fieldwork, not global speculation'. Kuhn's framework usually treats paradigms as theoretical models, but here the paradigm included rules about which questions were legitimate. To be a geologist was to be a local empiricist; global mechanics were for physicists. This suggests a paradigm can be a disciplinary boundary as much as a conceptual framework.

  Second, there was deep incommensurability before the shift. When geologists heard 'drift' in the 1920s, they imagined continents ploughing through solid rock—physically absurd. In the 1960s, 'drift' meant plates riding on a mobile mantle. They weren't arguing about the same proposition; the terms had shifted meaning beneath them. This is incommensurability in miniature, decades before anyone had a reason to notice it. The rejection wasn't just stubbornness; it was a category error.

  Finally, the revolution didn't come from internal crisis. Kuhn suggests normal science fails until it breaks. Here, land geologists were comfortable until outsiders—meteorologists and oceanographers—forced the change. The pressure wasn't internal accumulation of anomalies, but an invasion from a neighbouring discipline bringing new tools. The crisis was imported, not grown. This challenges the notion that a community must feel the pain of anomaly before accepting a revolution. Sometimes, the pain is felt by outsiders, who then bring the cure to a patient who didn't know they were sick.

  4. "What it says back"

  So, is this a confirmation or an anomaly for Kuhn? It's best viewed as a necessary modification. It confirms the sociological reality of resistance and the generational nature of acceptance; the old guard did dig in, and the young did convert. However, it challenges the idea that revolutions are born solely from internal cognitive crisis. The continental drift affair suggests paradigms are also territorial defences. The 'scientific community' wasn't a unified whole but fragmented guilds protecting their turf. The revolution occurred because the boundaries of the community shifted to include the oceanographers, not because the geologists suddenly couldn't explain mountains.

  It shows that incommensurability can act as a barrier to entry decades before a shift occurs, not just as a post-shift cleanup. The words were the same, but the concepts were worlds apart, preventing dialogue long before the data arrived. Kuhn anticipated resistance, but perhaps underestimated how much methodological tribalism can delay a revolution independent of theoretical merit. The drift affair tells us that a paradigm shift isn't just a change of mind; it's a change of membership. It confirms Kuhn's psychology but complicates his sociology. The engine of revolution wasn't just the failure of normal science, but the success of outsiders.

  5. "What I'd tell my editor"

  The upshot is simple. The drift affair validates Kuhn's view of scientists as human beings resistant to change, but complicates his model of where change originates. It wasn't a puzzle solved; it was a guild opened up. The paradigm didn't just shift; it migrated from land to sea. For your readers, the lesson is that scientific revolutions aren't just about better data. They are about who gets to hold the microscope. The continental drift story proves that sometimes the people who change the world aren't the ones guarding the door.
