          *   *Verdict:* Direct contradiction. This is the "Swamping Problem" territory. If accuracy is the *only* intrinsic good, and knowledge = true belief + X, then unless X contributes to accuracy, it adds no value. If it adds non-instrumental value, Veritism (as stated in 1) is false.
          *   *Severity:* Critical.

      *   **(1) vs. (3): Compatibility?**
          *   Veritism motivates EUT (Joyce). EUT uses accuracy (Brier score, etc.) as the utility.
          *   *Verdict:* Highly compatible. (3) is usually the formal implementation of (1).

      *   **(2) vs. (3): Tension?**
          *   (3) reduces rationality to accuracy maximization. (2) says knowledge has value beyond accuracy.
          *   If EUT is the *whole story* about epistemic rationality, where does the extra value of knowledge fit?
