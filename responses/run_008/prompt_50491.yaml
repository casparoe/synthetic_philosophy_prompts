          *   Fixing (1) is the "keystone." If the professor adopts **Epistemic Value Pluralism** (modifying 1), it opens the door to keeping (2). It might also help with (4) (if peer respect is a distinct value) and (5) (if belief has a distinct normative role).
          *   *Alternative:* Drop (2). If they are a formal epistemologist, Veritism + EUT is the standard package. (2) is the outlier. Dropping (2) makes the profile much more coherent (Joyce/Pettigrew style).
