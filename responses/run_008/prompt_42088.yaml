answer: |-
  This is a classic instantiation of the "boundary problem" in democratic theory, and honestly, your classmates have stumbled into a debate that has kept political philosophers busy for the last fifty years. They are reenacting the tension between the *All-Affected Principle* (Maya) and the *All-Subjected Principle* or *Membership Principle* (Dan).

  Here is the adjudication of the exchange, move by move, followed by the verdict on your suspicion.

  ### Move-by-Move Adjudication

  **Move 1: Maya's Opening (All-Affected Interests)**
  Maya argues that anyone whose interests are affected by a decision gets a vote. She applies this to tourists (taxes, police, water).
  *   **Verdict:** **Maya wins on moral consistency, Dan wins on feasibility.**
      Maya's principle is morally robust. If democracy is about legitimacy, and legitimacy comes from consent, then those impacted without consent are being dominated. However, as Dan intuitively senses, this principle is infinitely expandable. A zoning law in Austin affects housing supply in San Francisco, which affects tech workers, which affects global markets. If "affected" means "causally influenced," the electorate becomes everyone. Maya is theoretically cleaner here, but her principle threatens to make the concept of a local election meaningless.

  **Move 2: The Brexit Move**
  Maya argues that the whole world should have voted on Brexit and calls this a "feature, not a bug."
  *   **Verdict:** **Maya is logically consistent, but she changes the subject.**
      This move works *if* your goal is global justice. It fails *if* your goal is explaining how a specific city or nation-state functions. By accepting the global electorate, Maya admits that her principle is not a theory of *democratic boundaries* but a theory of *cosmopolitanism*. She is right that if we take "affected interests" seriously, national borders are arbitrary. But in the context of a *city referendum*, her argument proves too much. It doesn't solve the boundary problem; it dissolves the boundary entirely. So, while logically sound within her own framework, it doesn't help decide who votes in Chicago or London today.

  **Move 3: Dan's Coercion Principle & Maya's Rebuttal**
  Dan shifts to "subjected to coercion." Maya counters that this privileges those who can escape (tourists) over those who can't (undocumented residents), and that we are subjected to laws unevenly (zoning vs. drugs).
  *   **Verdict:** **Maya wins this exchange decisively.**
      Dan's "coercion" argument is notoriously slippery. As Maya points out, "subjection" often tracks privilege. A wealthy tourist can leave the jurisdiction; a poor permanent resident cannot. If the right to vote is based on being "stuck" with the laws, the permanent resident has a stronger claim than the tourist. Furthermore, Maya's point about "partial votes" is a knockout punch. In no existing democracy do we give people votes only on the laws that apply to them (e.g., single people vote on family law, the healthy vote on healthcare). We give them a general share of power. Dan's principle cannot account for the general nature of the franchise without collapsing back into membership.

  **Move 4: Dan's Retreat (Ongoing Project) & Maya's Circularity Charge**
  Dan argues the demos is an ongoing project of self-government over time. Maya calls this circular: you need members to define the project, but you need the project to define the members.
  *   **Verdict:** **Maya is right that it is circular, but wrong that it is fatal.**
      Maya correctly identifies that Dan's second principle is circular. You cannot define "the people" by "the people's project" without already knowing who the people are. However, Maya's own principle suffers from the same disease. Who decides which interests count as "affected"? Does a slight economic ripple count? Does a moral objection count? Someone has to draw that line, and that "someone" must already be a demos.
      *   **Why Dan's circularity is more useful:** In political theory, this is known as the "constitutive paradox." Every democracy begins with an undemocratic act of drawing a border. Dan's "ongoing project" acknowledges that the boundary is historical and political, not just philosophical. Maya wants a philosophical formula to solve a political problem. Dan is admitting there is no formula, only a continuing practice.

  ### Who Is More Right Overall?

  **Dan is more right about politics; Maya is more right about morality.**

  Maya wins the argument on pure logic. She successfully exposes that any attempt to define the boundary using neutral principles (affectedness, coercion) either explodes the demos (Brexit) or relies on arbitrary distinctions (who can escape coercion). She shows that there is no pre-political, philosophical way to solve the boundary problem.

  However, Dan's final position ("ongoing project") is the only one that actually describes how democracies survive. Democracies are not formed by calculating affected interests every morning; they are formed by shared history, institutions, and a sense of "us." While Maya is right to call it circular, that circularity is a feature of reality, not a bug in Dan's logic. You cannot have democracy without first having a "people," and the "people" is created by the very act of claiming to be one.

  If forced to choose a winner based on who made the fewer logical errors: **Maya.** She successfully dismantled Dan's attempts to find a clean, principled boundary.
  If forced to choose a winner based on who has a workable theory of government: **Dan.** His retreat to "membership over time" is the standard liberal-democratic solution (citizenship), even if it rests on a foundational myth.

  ### What They Are Missing (And Your Suspicion)

  You asked if you are wrong to suspect they are treating "demos" like a natural kind with a fixed boundary. **You are absolutely not wrong. In fact, you have identified the exact reason they are stuck.**

  Both Maya and Dan are operating under the assumption that there is a "correct" answer to the boundary problem waiting to be discovered by reason. They think "the people" is like a mountain: it's either there or it isn't, and if they measure the elevation (affectedness) or the rock composition (coercion) correctly, they will find the edge.

  **Here is what they are missing:**
  The boundary of the demos is not a natural fact; it is a **political decision**.

  1.  **The Paradox of Founding:** As Maya sensed with her circularity charge, you cannot use democracy to decide the boundaries of democracy. The boundary is always drawn by power, history, war, treaty, or exclusion *before* the voting starts.
  2.  **Function over Form:** We don't define the demos based on who is *affected* (Maya) or *subjected* (Dan). We define it based on who is capable of sustaining the institutions. A demos needs a level of trust, communication, and solidarity to function. Tourists generally lack the stake in the long-term maintenance of the city's infrastructure to participate meaningfully in its governance, regardless of whether they drink the tap water.
  3.  **The "Why" Matters:** The boundary depends on *why* you want democracy.
      *   If democracy is about **protecting rights**, Maya is right (everyone affected needs protection).
      *   If democracy is about **collective self-determination**, Dan is right (only the group defining itself counts).
      *   If democracy is about **stability**, the boundary must be rigid (citizenship).
      *   If democracy is about **justice**, the boundary must be fluid (residency/affectedness).

  **Conclusion**
  Maya is the better debater; she spotted the contradictions in Dan's principles immediately. But Dan is the better institutionalist; his final retreat acknowledges that the demos is a construct, not a discovery.

  You are correct: the trouble is that they are looking for a philosophical boundary where there is only a political one. The "people" is not something you find; it is something you build, and the edges are drawn by the very conflicts they are having right now. The fact that they can't agree on the boundary *is* the boundary problem in action.
