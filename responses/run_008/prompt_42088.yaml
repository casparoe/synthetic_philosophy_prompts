prompt: |-
  Two people from my democratic theory seminar (I'm a third-year poli sci major taking it as an elective) got into it after section and now they've each texted me their side of the arguement and honestly I can't tell who's winning. The professor had brought up the boundary problem -- before you can say "the people should decide" you have to say who the people even are -- and used it to ask whether tourists should get to vote in a city referendum while they're visiting.

  Maya said yes, basically. Her principle: anyone whose interests are affected by a decision deserves a say in it. Tourists are policed by the same cops, pay the same sales tax, drink the same tap water -- affected, so enfranchised. She even pointed out that on her principle much of the world should have gotten to vote on Brexit, and she said that like it was a feature and not a bug.

  Dan said that's insane, because it makes the demos explode into everything: every tariff, every climate law, and you end up with a world electorate for basically every decision, which just isn't what democracy is. His principle: only people actually subjected to the coercion get a vote. Tourists are there voluntarily and leaving soon.

  Maya came back that "subjected" doesn't do any better. Whether you count as subjected ends up tracking how easily you can escape the law's reach, so the tourist who flies home tomorrow is in while the permanent resident who's lived in the town thirty years but can't naturalize is out -- unless Dan is suddenly fine with resident noncitizens voting, which he wasn't five minutes earlier. She also said people are subjected to some laws and not others (zoning vs drug laws vs traffic rules), so his principle gives everyone partial votes, which is silly.

  Dan then retreated (his own word) to a third idea: a demos isn't defined by any single decision at all, it's an ongoing project of people governing themselves together over time -- membership means being part of the ongoing scheme, not being affected by or subjected to any one output.

  Maya said that's circular: which people are part of the people's ongoing project? The project can't pick its members without already having them, so it explains nothing.

  Can you go through the exchange move by move and tell me who's right at each step -- including whether Maya's "Brexit as a feature" move actually works and whether her circularity charge lands on Dan or equally on her own principle. Then say who's more right overall, and whether there's something both of them are missing entirely. Also, am I wrong to suspect that part of the trouble is that they both keep using "demos" like it's a natural kind with a fixed boundary, when maybe it's more like something we draw for reasons we have to defend seperately? Please answer in American English, and don't recommend readings -- I can find the literature myself, I want the actual adjudication of the arguments.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Third-year poli sci major, democratic theory seminar.
      *   **Scenario:** Two classmates (Maya and Dan) argued about the "boundary problem" in democracy (who constitutes "the people"?), specifically regarding tourists voting in a city referendum.
      *   **Task:**
          1.  Go through the exchange move-by-move and adjudicate who is right at each step.
          2.  Evaluate specific claims: Maya's "Brexit as a feature" move, Maya's circularity charge against Dan (and if it applies to her).
          3.  Determine who is more right overall.
          4.  Identify if they are missing something fundamental.
          5.  Address the user's suspicion about "demos" as a natural kind vs. a constructed boundary.
      *   **Constraints:** American English, no reading recommendations (adjudicate the arguments directly).

  2.  **Deconstruct the Arguments:**

      *   **The Core Issue:** The Boundary Problem (Whitaker/Whelan/Dahl territory). Who constitutes the *demos*?
      *   **Maya's Principle:** All Affected Interests (AAI).
          *   *Argument:* Tourists are affected (police, tax, water) $\rightarrow$ Tourists vote.
          *   *Extension:* Brexit affected the world $\rightarrow$ World should have voted. (Feature, not bug).
          *   *Counter to Dan:* "Subjected to coercion" is arbitrary (escape ability) and leads to partial voting (affected by some laws, not others).
          *   *Counter to Dan's Retreat:* "Ongoing project" is circular (you need members to define the project, but need the project to define members).
      *   **Dan's Principle 1:** All Subjected to Coercion (ASC).
          *   *Argument:* Democracy is about self-government under law. Tourists are voluntary/transient.
          *   *Problem:* Maya points out the "escape" loophole (rich/temporary vs. stuck permanent residents) and the "partial vote" problem (subjected to some laws, not all).
      *   **Dan's Principle 2 (Retreat):** Democratic Membership as Ongoing Project (Constitutive/Political Community).
          *   *Argument:* Demos is defined by shared membership over time, not specific decisions.
          *   *Problem:* Maya calls it circular.

  3.  **Step-by-Step Adjudication:**

      *   *Move 1: Maya (AAI) vs. Dan (ASC - Initial).*
          *   Maya: Tourists affected $\rightarrow$ vote.
          *   Dan: Insane, demos explodes.
          *   *Analysis:* AAI is theoretically robust but practically unmanageable. ASC is more bounded but has definition problems.
          *   *Verdict:* Maya wins on moral consistency; Dan wins on institutional feasibility. But strictly logically? AAI is harder to refute on principle.
      *   *Move 2: Maya's Brexit Move.*
          *   *Claim:* World should vote on Brexit. Feature, not bug.
          *   *Analysis:* This is the reductio ad absurdum of AAI. If democracy is about legitimacy derived from consent of affected parties, then yes. But it destroys the concept of a nation-state democracy.
          *   *Verdict:* Logically consistent with her premise, but politically destructive. It works *if* you accept global democracy as the goal.
      *   *Move 3: Dan's ASC & Maya's Rebuttal (Escape/Partial).*
          *   Dan: Subjected to coercion.
          *   Maya: Escape ability biases it (rich leave, poor stay). Also, partial subjection = partial votes?
          *   *Analysis:* Maya hits a nerve here. ASC often relies on jurisdiction, which relies on borders, which relies on... the demos. The "partial vote" point is strong. We don't give people votes on only the laws that apply to them (e.g., childless people vote on school funding).
          *   *Verdict:* Maya wins this exchange. Dan's definition of "subjected" is too slippery.
      *   *Move 4: Dan's Retreat (Ongoing Project) & Maya's Circularity Charge.*
          *   Dan: Membership = ongoing project.
          *   Maya: Circular. Who defines the project?
          *   *Analysis:* This is the classic "Whelan" critique. You need a demos to decide the demos. But *someone* has to start the project. However, Maya's AAI suffers from the same issue: Who decides which interests count as "affected"?
          *   *Verdict:* Maya is right that it's circular, but wrong that it's uniquely fatal. All boundary principles face a regress problem.

  4.  **Overall Assessment:**
      *   **Who is more right?** Neither is fully right. Maya has the better moral intuition (inclusion), Dan has the better institutional intuition (stability). But Dan's second principle (ongoing project) is actually the standard liberal-democratic answer, even if circular. Maya's AAI is the standard cosmopolitan critique.
      *   **Missing Element:** They are treating the boundary as a *pre-political* fact discoverable by theory. It's actually a *political* decision. The boundary is constituted by power and history, not just logic.
      *   **User's Suspicion:** The user suspects they treat "demos" as a natural kind. The user is **correct**. This is the crux of the theoretical impasse.

  5.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Academic but accessible (Poli Sci major level). American English.
      *   *Structure:*
          1.  Move-by-Move Adjudication.
          2.  Specific Analysis (Brexit, Circularity).
          3.  Overall Winner.
          4.  The Missing Piece (The User's Insight).
      *   *Content Check:* Ensure I don't just say "read Whelan." I need to explain *why* the arguments work or fail.

      *(Self-Correction during drafting)*: I need to be careful not to simply say "Maya is right." In democratic theory, AAI is often seen as *too* expansive to be useful for a specific polity. Dan's "ongoing project" is basically the "constituted people" argument. I should highlight that Dan's retreat is actually the strongest position theoretically, despite the circularity, because it acknowledges the political nature of the boundary. Maya's circularity charge is valid but applies to her too (who defines "affected"?).

      *Refining the "Brexit" point:* Does it work? It works logically for AAI, but it reveals AAI isn't a theory of *state* democracy, it's a theory of *global* justice. So in the context of a *city referendum*, it's a category error. I should point that out.

      *Refining the "Circularity" point:* Maya says Dan is circular. Is she? Yes. "Affected" requires a counterfactual: affected compared to what? By whom? The definition of the affected group requires a prior boundary. So both are circular.

      *Refining the User's Insight:* This is the most important part. Validate the user. The "Boundary Problem" is arguably unsolvable by philosophy alone because it is a political question.

  6.  **Final Polish:** Check American spelling (enfranchised vs enfranchised, etc. - actually both fine, stick to standard US). Ensure no reading list. Keep it punchy.

      *Plan:*
      1.  Intro: Acknowledge the classic nature of the debate.
      2.  Round 1 (AAI vs. ASC): Maya wins on logic, Dan on practice.
      3.  Round 2 (Brexit): Maya is consistent but changes the subject to global democracy.
      4.  Round 3 (Coercion/Escape): Maya wins decisively.
      5.  Round 4 (Ongoing Project/Circularity): Draw, but Dan's position is more stable.
      6.  Overall Verdict: Dan's retreat is the standard solution, but Maya exposes its fragility.
      7.  The Missing Piece/User's Suspicion: Validate strongly. The boundary is political, not natural.

  7.  **Final Review against constraints:** American English? Yes. No readings? Yes. Adjudicate arguments? Yes.

      *(Self-Correction on "Who's Right")*: I shouldn't declare a absolute winner like a judge, but evaluate the strength of the reasoning. Maya is logically sharper; Dan is institutionally more realistic. But on *theory*, Maya exposes the contradictions better. However, Dan's final position is the one actually used in practice (citizenship). I will nuance this.

