      *   *Claim 4:* "Since Browning's book was written as a direct response to Goldhagen..."
          *   **Fact Check:** **False/Chronological Error.** Browning's *Ordinary Men* (1992) predates Goldhagen's *Hitler's Willing Executioners* (1996). Browning couldn't have written it as a response. Goldhagen responded to Browning.
      *   *Claim 5:* "...his explanation is basically the Milgram obedience experiment: a legitimate authority tells you to shoot and you do, which is why his conclusions about conformity transfer straight over from the lab."
          *   **Fact Check:** **Partial Truth/Reductionist.** Browning does cite social psychology (Milgram, Zimbardo), but he emphasizes *group conformity* and *bureaucratic routine* more than just blind obedience to authority. He argues they became accustomed to killing. It's not *just* Milgram.
      *   *Claim 6:* "Goldhagen's counter is that German antisemitism was universal, so ordinary Germans were indistinguishable from Nazi Party members..."
