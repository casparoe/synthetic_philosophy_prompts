answer: |-
  **Handout: Game Rules**
  **Game A:** Flip a coin until it lands Heads (trial $n$).
  Payoff: $+2^n/n$ if $n$ is odd; $-2^n/n$ if $n$ is even.
  **Game B:** Same as Game A, plus 1 point.
  **Tools:** Use random digit sheets (0=Heads, 1–9=Tails). Record $n$ and payoff for each trial. No calculators.

  **Timeline**
  **0–25 min (Simulation):** Students generate 5 trials each. Pool all data on the board.
  **25–45 min (Market I):** Instructor acts as dealer. Students submit secret bids to buy/sell bundles of 10 plays of Game A. Instructor finds a clearing price where supply meets demand. Record it. Repeat twice. Observe price drift.
  **45–65 min (Market II & Dominance):** Introduce Game B. Vote: "Who strictly prefers B over A?" (Expect unanimity). "Who prices B exactly 10 points higher than A?" (Expect disagreement). Run market for B. Compare clearing prices to Game A.
  **65–90 min (Debrief):** Connect experience to theory.

  **Aggregation**
  **Board Graph:** Y-axis = Cumulative Average Payoff, X-axis = Total Trials. Update live after every 10 trials.
  **Visual Goal:** The line should wander erratically, never settling. When large outcomes occur, the line spikes. This visualizes the lack of convergence.

  **Debrief Mapping**
  1.  **Wandering Mean:** Explain that the series $\sum p_n x_n$ is **conditionally convergent**. The sample average does not converge to a constant; the Law of Large Numbers fails.
  2.  **Price Instability:** Because the **expectation** is **undefined**, no fair price exists. Different valuation methods (or moments in time) yield different results.
  3.  **Dominance Failure:** Normally $X > Y \implies E[X] > E[Y]$. Here, $B > A$ outcome-wise, but pricing incoherence arises because neither has a defined expectation.
  4.  **Naming:** Reveal "**Pasadena Game**."

  **Honest Notes**
  1.  **Predictable Failure (Tame Data):** In 60 trials, max $n$ will likely be $<10$. Payoffs stay small ($\pm 100$). The graph looks stable. Students will think it prices normally.
      *Mitigation:* Do not rely solely on student flips. Pre-generate 3 "outlier" trials ($n=15, 18, 20$) on cards. Deal them into the pool at minutes 30 and 50. This forces the running average to swing wildly, simulating the heavy tail.
  2.  **Activity Limitations (Rearrangement):** Students sum chronologically. They cannot physically "rearrange" the series to prove different sums. They see noise, not mathematical indeterminacy.
      *Mitigation:* In debrief, take the *actual* class data written on the board. Show that summing positive terms first, then negative, yields $+\infty$, while alternating yields something else. You must supply the **Riemann Rearrangement Theorem** on authority; the activity only supplies the instability intuition.
