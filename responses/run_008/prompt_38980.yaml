answer: |-
  You are right to feel that the seminar ends in a circle. The stagnation you perceive is not a failure of imagination on the part of your students or the literature; it is a structural feature of the debate as currently constituted. Your working hypothesis is correct, but it can be sharpened. The stalemate is not merely about scientific realism in the generic sense; it is a clash between **representationalism** and **pragmatism** regarding the function of physical theory, masked as a dispute about the ontology of a specific mathematical object.

  Here is a diagnosis of the disagreement, broken down by its verbal, substantive, and methodological components, followed by an honest assessment of what progress would look like.

  ### 1. The Diagnosis: A Category Error
  The psi-ontic/psi-epistemic debate is stalled because it is attempting to adjudicate a metaphysical question using a framework (the Ontological Models Framework, or OMF) that one side rejects as question-begging.

  *   **The Psi-Ontic Position:** Operates within **Representational Realism**. A physical theory is a map of observer-independent territory. If $\psi$ plays an indispensable role in the theory's predictive success, and the theory is true, then $\psi$ (or what it represents) must correspond to territory. The OMF is the natural language for this view: there is a "real state" $\lambda$, and we are asking how $\psi$ relates to $\lambda$.
  *   **The Psi-Epistemic (QBist) Position:** Operates within **Neo-Pragmatism**. A physical theory is a user's manual for agents navigating the world. $\psi$ is not a map of territory; it is a coordinate in the agent's decision-making calculus. To ask if $\psi$ is "real" in the OMF sense is to commit a category error, like asking if the number zero is "made of wood."

  The disagreement is **substantive**, but not about quantum mechanics. It is about the **norms of theory acceptance**. The psi-ontologist demands that a fundamental theory provide an inventory of beings. The QBist demands that a fundamental theory provide a normative calculus for expectation. When they argue about $\psi$, they are actually arguing about whether physics *should* provide an inventory of beings.

  ### 2. Verbal vs. Substantive
  **The Verbal Component:**
  The word "real" is doing too much work.
  *   For the psi-ontologist, "real" means "appears in the inventory of the OMF."
  *   For the QBist, "real" means "that which constrains experience" (the outcome), whereas $\psi$ is "real" only in the sense that a betting odd is real (it has normative force, not ontological weight).
  When a psi-ontologist asks, "Is the wavefunction real?" and a QBist says "No," they are often agreeing that $\psi$ is not a material field, but disagreeing on whether "material field" is the only category of existence that matters.

  **The Substantive Component:**
  The substantive core is the **Ontological Models Framework itself**.
  Harrigan and Spekkens defined the terms of the debate, but in doing so, they codified a specific metaphysical prejudice: that there *is* an underlying state $\lambda$ distinct from the quantum state, and that the job of foundations is to relate the two.
  *   **Psi-ontologists** accept this prejudice.
  *   **QBists** reject it.
  Therefore, the PBR theorem does not settle the debate; it only settles it *conditional on accepting the OMF*. The QBist response is not to tweak the model to satisfy PBR, but to reject the premise that $\psi$ must be modeled as a distribution over $\lambda$. This is not evasion; it is a denial of the jurisdiction of the court.

  ### 3. The QBist Refusal: Evasion or Revolution?
  You ask where the QBist refusal sits. It is a **meta-methodological claim with metaphysical consequences.**

  It is not an evasion because it offers a positive alternative account of what $\psi$ does (it organizes subjective credences regarding future experiences). However, it is often perceived as evasion by realists because it refuses to answer the specific question "What is $\psi$ made of?" by replying "Nothing; it's a tool."

  This refusal is substantive because it denies the **God's Eye View**. The OMF assumes a perspective from outside the universe where one can compare $\psi$ to $\lambda$. QBism asserts that physics is inherently situated; there is no "view from nowhere." Consequently, the PBR theorem's assumption of Preparation Independence (PI) is rejected not because QBists believe in superdeterministic conspiracies, but because they believe the notion of "independent preparation" implies a separation of systems that ignores the agent's role in defining the context.

  To classify it: It is a **Kantian turn** in foundations. It argues that we cannot know the noumenal state $\lambda$, so we should stop trying to model $\psi$ as a phenomenological access to $\lambda$ and start modeling it as a condition of the possibility of experience.

  ### 4. Pricing the Assumptions (PI vs. Superdeterminism)
  You suggest the stall might reflect the difficulty of pricing assumptions like Preparation Independence. This is accurate, but the "price" is not epistemic; it is **ideological**.

  *   **Preparation Independence (PI):** This assumes that distinct laboratories can isolate systems such that their hidden variables are uncorrelated. This is a commitment to **separability** and **locality** in the hidden sector.
  *   **Rejecting PI:** To save the epistemic view within OMF by rejecting PI requires accepting that independently prepared systems share hidden correlations. This looks like superdeterminism.

  The stalemate exists because there is no neutral currency to weigh "ontological separability" against "epistemic holism."
  *   The psi-ontologist says: "Rejecting PI is too expensive; it undermines the scientific method's assumption that we can isolate variables."
  *   The psi-epistemist (non-QBist) says: "Accepting psi-ontology is too expensive; it requires a many-worlds ontology or collapse dynamics that violate relativity."
  *   The QBist says: "Both are too expensive; the OMF is the error."

  Progress is stalled because each side views the other's "cheap" assumption as a "fatal" concession. There is no agreed-upon metric for theoretical virtue here (e.g., is it worse to have a bloated ontology or a restricted methodology?).

  ### 5. What Would Count as Progress?
  Given this diagnosis, more $\psi$-ontology theorems with weaker assumptions will not break the stalemate. They will only push the disagreement back to the next auxiliary assumption. If you want to move your seminar beyond the 2012 plateau, you must change the question.

  **Honest Progress would look like one of the following:**

  1.  **Framework Neutralism:** A reformulation of the debate that does not presuppose the OMF. We need a way to characterize the difference between ontic and epistemic without assuming there is a $\lambda$ to begin with. This might involve shifting from "What is $\psi$?" to "What are the *invariance properties* of $\psi$?" If $\psi$ transforms in a way that suggests it is a coordinate system rather than an object, that supports the epistemic view without needing PBR.
  2.  **Functionalism:** Instead of asking if $\psi$ is real, ask what role it plays. If $\psi$ plays a causal role in dynamics (e.g., in Bohmian mechanics), it is ontic. If it plays a normative role in updating probabilities (e.g., in QBism), it is epistemic. Progress here means agreeing that "$\psi$ is ontic" is shorthand for "$\psi$ appears in the dynamical laws," and "$\psi$ is epistemic" is shorthand for "$\psi$ appears in the updating rules." This dissolves the metaphysical mystery into a classification of mathematical roles.
  3.  **Admitting Ill-Posedness:** The most honest progress might be the argument that the question is ill-posed. Just as "What is the color of an electron?" is a category error, "Is the wavefunction real?" may be a category error resulting from reifying a mathematical tool. A rigorous argument demonstrating that the OMF imposes constraints that no physical theory is required to satisfy would be a major philosophical advance, even if it leaves physics unchanged.
  4.  **Meta-Empirical Criteria:** We need a principled way to compare the "cost" of assumptions. Why is Preparation Independence more sacred than Statistical Independence (in Bell's theorem)? If we can develop a **virtue epistemology for foundations**—a rigorous way to weigh ontological parsimony against methodological freedom—we could break the tie. Currently, each side simply asserts their preferred virtue is paramount.

  ### Recommendation for the Seminar
  If I were teaching this seminar, I would frame the PBR theorem not as a result about quantum mechanics, but as a result about the **Ontological Models Framework**.

  I would ask the students: *PBR proves that $\psi$-epistemic models are incompatible with QM + PI. But PI is an assumption about the hidden variable $\lambda$, which we have never observed. Why are we willing to constrain the unobserved $\lambda$ more strictly than we constrain the observed $\psi$?*

  The goal should be to reveal that the "stalemate" is actually a **selection effect**. We only have this debate because we insist on the OMF. If you drop the OMF (as QBism does), the PBR theorem is irrelevant. If you keep the OMF (as Realists do), you must accept psi-ontology or superdeterminism.

  The progress you are looking for will not come from physics. It will come from philosophy of science recognizing that the demand for an "inventory of existence" is itself a theoretical commitment, not a neutral prerequisite for doing physics. The debate is stationary because it is waiting for a physical resolution to a philosophical impasse. The only way forward is to admit that the question "Is $\psi$ real?" is not a question nature can answer, but a question about how we choose to speak about nature.
