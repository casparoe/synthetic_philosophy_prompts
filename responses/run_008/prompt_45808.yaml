answer: |-
  This is a remarkably clean reconstruction of a live metaethical debate. Your friends have effectively recapitulated the core literature on Evolutionary Debunking Arguments (EDAs), trading blows that mirror the exchanges between Sharon Street, Richard Joyce, David Enoch, and various naturalist realists.

  Here is the referee's report on the six moves, the shared blind spots, and the final verdict.

  ### Move-by-Move Analysis

  **(1) Maya: The Core Debunking Argument**
  *   **The Move:** Maya articulates the standard EDA (akin to Sharon Street's "Darwinian Dilemma"). If moral facts are mind-independent (Realism) and causally inert, evolution couldn't have selected for them. Therefore, the correlation between our moral beliefs and moral truth is coincidental.
  *   **Assessment:** **Solid.** This is the correct formulation of the challenge for *Non-Naturalist* Realists.
  *   **Critique:** It assumes moral facts *must* be causally inert. If moral facts are natural kinds (e.g., "suffering is bad"), evolution could track them. But as a setup for the specific problem of Non-Naturalism, Maya is on firm ground.

  **(2) Jules: The Self-Defeat (Global Skepticism) Objection**
  *   **The Move:** If evolution selects for fitness rather than truth, this applies to *all* cognitive faculties, not just morality. Therefore, the argument undermines the logic used to construct the argument.
  *   **Assessment:** **Strong Intuition, Slightly Overreaching.** This is the "companions in guilt" objection. It's the most common pragmatic counter to EDAs. However, it's not a knockout punch yet. It assumes all cognitive faculties have the *same* relationship to truth. A calculator selected for fitness might still output true sums if true sums aid survival. Jules is right to raise the alarm, but hasn't yet proven the mechanisms are identical.
  *   **What Jules gets:** The stakes. If Maya is right, we lose logic too.
  *   **What Maya won't concede:** That morality is epistemically analogous to logic or perception.

  **(3) Maya: The Asymmetry (Tracking) Response**
  *   **The Move:** Maya distinguishes between beliefs that *track* facts (perception) and those that don't (morality). Perception has a causal link (tiger exists -> eye sees tiger -> belief). Morality (on her view) does not (kin selection -> belief in obligation, regardless of whether obligation exists).
  *   **Assessment:** **Very Solid.** This is the standard Realist defense against Move 2. It relies on the idea of "counterfactual sensitivity." If the tiger weren't there, you wouldn't see it. If the moral fact weren't true, you'd still have the intuition (because fitness remains the same).
  *   **What Maya gets:** She saves perception and logic from the debunking while keeping morality targeted.
  *   **What Jules won't concede:** That morality is uniquely disconnected from fitness-tracking in this way (see Move 4).

  **(4) Jules: The Math Objection & The Naturalist Reply**
  *   **The Move:** (A) Math is useful even if false (fictionalism), so it fails the tracking test too. (B) Moral facts *are* facts about flourishing/suffering, which evolution *does* track.
  *   **Assessment:** **Mixed Bag.**
      *   *Part A (Math):* **Strong.** This is the Benacerraf-Field challenge. If Maya debunks morality, she risks debunking math. Many philosophers find math harder to debunk than morality.
      *   *Part B (Naturalism):* **Strategic Shift.** Jules switches the definition of Realism. Maya is arguing against *Non-Naturalist* Realism (facts exist outside spacetime). Jules is defending *Naturalist* Realism (facts are about biological states).
  *   **Critique:** Jules is right that Naturalism escapes the EDA. But if Maya is a Non-Naturalist (which Move 1 implies), Jules' Part B changes the subject. Part A is the heavier hitter.

  **(5) Maya: Coincidence & The Nature of Math**
  *   **The Move:** (A) Defining moral facts to match evolution is ad hoc ("rescue by coincidence"). (B) Math works because reality is consistent; morality lacks this external constraint.
  *   **Assessment:** **Partially Sloppy.**
      *   *Part A (Coincidence):* **Solid.** This is the "pre-established harmony" objection. If evolution and moral truth align, it's a miraculous coincidence unless one explains *why*.
      *   *Part B (Math):* **Weak.** Maya claims math works because "reality is consistent." This treats math as empirical induction. Most philosophers view math as necessary truth, not empirical regularity. A brain could evolve to believe 2+2=5 if it aided survival, even in a consistent universe. Maya is leaning on an empiricist view of math that many reject.
  *   **What Maya gets:** She highlights the explanatory gap in Naturalism.
  *   **What Jules won't concede:** That the math analogy holds or that Naturalism is merely coincidental.

  **(6) Jules: Scope Limit & Reflection vs. Maya: The Regress**
  *   **The Move:** Jules argues debunking only applies to raw intuitions, not reflective judgments (e.g., factory farming). Maya argues the *method* of reflection is also evolved and tainted.
  *   **Assessment:** **Maya wins the logic; Jules wins the pragmatism.**
      *   *Jules:* Is right that we distinguish between System 1 (intuition) and System 2 (reflection). We trust reflection to correct optical illusions; why not moral illusions?
      *   *Maya:* Is right that the *criteria* used in reflection (consistency, impartiality, etc.) are themselves evolved intuitions. If the source is tainted, the filter is tainted. This is the "bootstrapping" problem.
  *   **Critique:** Maya's point here is philosophically deeper. If evolution shaped the *standards* of reasoning, you can't use those standards to vindicate themselves without circularity.

  ### Shared Sloppiness

  Both friends are tripping over the same two wires throughout the debate:

  1.  **Non-Naturalism vs. Naturalism:** They slide between definitions of "Moral Realism."
      *   Maya assumes **Non-Naturalism** (moral facts are spooky, non-causal entities). The EDA is deadly against this.
      *   Jules defends **Naturalism** (moral facts are facts about well-being/biology). The EDA barely touches this, because evolution *would* select for tracking biological well-being.
      *   *The Fix:* They need to agree on what kind of "truth" is being debated. If Maya is a Non-Naturalist, Jules' Move 4B is irrelevant. If she's a Naturalist, Move 1 is false.

  2.  **Truth vs. Justification:**
      *   Maya says beliefs are "probably mostly false" (Ontological claim).
      *   The EDA is actually an **Epistemic** argument: it claims our beliefs are *unjustified*, not necessarily false. They could be true by luck, but we wouldn't *know* they are true.
      *   *The Fix:* The debate is about whether we have *knowledge*, not whether moral facts exist.

  3.  **The "Fitness" Monolith:**
      *   Both treat "evolutionary selection" as a single process that optimizes for "fitness." In reality, evolution is messy. Some traits are spandrels (byproducts), some are exaptations (co-opted), and some are direct adaptations. A belief could be a byproduct of a truth-tracking mechanism (e.g., general intelligence) rather than directly selected for. Neither explores this nuance.

  ### Overall Verdict

  **Who is more right?**
  **Jules takes the strategic win, but Maya wins the technical round.**

  *   **Maya** is more precise about the philosophical stakes. Her Move 3 (Asymmetry) and Move 6 (Regress) identify the genuine hard problems for the Realist. If one accepts her premise (Non-Naturalist Realism), her conclusion (skepticism) follows logically. She correctly identifies that you cannot use evolved reasoning to vindicate evolved reasoning without circularity.
  *   **Jules** is more pragmatic and identifies the *reductio ad absurdum*. If Maya's argument is accepted, it destroys too much (logic, math, perception). In philosophy, an argument that leads to global skepticism is usually treated as self-defeating (Move 2). Furthermore, Jules correctly identifies that Naturalism (Move 4B) dissolves the problem entirely, even if Maya finds it unsatisfying.

  **The Referee's Ruling:**
  The debate ends in a **draw**, but only because they are debating two different theories.
  *   Against **Non-Naturalist Realism**, **Maya wins.** The evolutionary debunking argument is widely considered the strongest threat to this view.
  *   Against **Naturalist Realism**, **Jules wins.** If moral facts are natural facts about flourishing, evolution likely *did* track them, and the asymmetry Maya relies on collapses.

  **Advice for the Dinner Party:**
  Tell them to pause and define "Moral Fact."
  *   If Maya means "A command written into the fabric of the universe," she is right that evolution couldn't track it, but she has to accept she can't know it exists.
  *   If Jules means "Facts about what causes suffering," he is right that evolution tracks it, but he has to accept morality is relative to biological creatures like us.

  If they can't agree on that, Move 1 through 6 are just two people playing chess with different rules.
