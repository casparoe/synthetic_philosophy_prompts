prompt: |-
  hey so quick context: I'm on the exec of my university's effective altruism chapter, and I'm also taking a consequentialism seminar this semester where we just did the cluelessness stuff (Lenman, Greaves) and it kind of wrecked me. Our chapter gives out maybe £3k a year — each term we pick one charity to fundraise for, plus occasional one-off donations. The problem is our exec meetings have become pure vibes. Someone quotes a cost-per-life-saved figure like it's the whole story, someone else says "but knock-on effects, who even knows" and everyone shrugs, and then we pick whatever we picked last year anyway. After the seminar I realized our arguments are literally the cluelessness debate being reenacted badly by people who don't know it's a known problem.

  So: write me an actual decision procedure the exec can run once a term, in one 90-minute meeting, that's grounded in whatever the philosophy of cluelessness actually supports. I'm not asking it to *solve* cluelessness — just to be honest about when it bites and when it doesn't. Things I want in it:

  - the questions to ask in order, and what counts as a sufficient answer at each step (we are not going to commission research, and nobody on exec except me has read any decision theory)
  - where the procedure should stop and hand things to an explicit values vote, instead of pretending the next factual question will settle it
  - the places it will predictably misfire — e.g. cases where it's so conservative we never fund anything unusual, or where "we're clueless about ripple effects" gets used as a blank check to keep the default forever
  - how to treat the default option itself, since our default (a big global health charity) was chosen three years ago under the same cluelessness, so it doesn't obviously deserve the benefit of the doubt

  Then run it on two choices we actually face: (a) fundraising for malaria nets vs. an org doing pandemic preparedness work, where the second plausibly has astronomically larger but way fuzzier effects, and (b) a small local homelessness charity that members personally volunteer at vs. the global health default that wins on any cost-effectiveness estimate we can produce. I want at least one of these to come out a way I won't like — I suspect a good procedure will tell us to stop agonizing over (a) and just default on it, and if that's the answer I want to see why it isn't just intellectual laziness dressed up as epistemic humility. Also flag whatever the procedure genuinely cannot settle, since the treasurer has to sign off on anything that changes our default and she will absolutely ask.

  No reading list please, I get enough of that in the seminar. End with a final line beginning "Verdict:" plus one sentence stating the core rule of the procedure, so I can paste it straight into the minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Exec member of a university Effective Altruism (EA) chapter.
      *   **Context:** Taking a consequentialism seminar, just studied "cluelessness" (Lenman, Greaves). Realized current chapter decision-making is flawed ("pure vibes," misusing cost-per-life figures vs. infinite regress of knock-on effects).
      *   **Task:** Create a concrete 90-minute decision procedure for the exec to use once a term.
      *   **Constraints:**
          *   Grounded in the philosophy of cluelessness (acknowledge it, don't try to solve it).
          *   No new research commissioning.
          *   No prior decision theory knowledge for other exec members.
          *   Must specify where to stop analysis and vote on values.
          *   Must identify predictable failure modes (conservatism bias, status quo bias).
          *   Must address the status quo default (chosen 3 years ago, potentially arbitrary).
          *   Must apply the procedure to two specific cases: (a) Malaria Nets vs. Pandemic Preparedness, (b) Local Homelessness vs. Global Health Default.
          *   One outcome should be potentially unpopular (likely the "stop agonizing" one).
          *   Explain why that outcome isn't just laziness.
          *   Flag what the procedure *cannot* settle (for the Treasurer).
          *   **No reading list.**
          *   **Ending:** A specific format: "Verdict:" + one sentence core rule.

  2.  **Deconstruct "Cluelessness" for this Context:**
      *   *Simple Cluelessness:* We don't know the consequences of action A vs. B, but we have no reason to think one is better than the other in the unknown respects. (Greaves).
      *   *Complex Cluelessness:* We have reasons to think A might be better in some unknown respects and B in others, but can't weigh them.
      *   *The Problem for EA:* Long-termism often runs into complex cluelessness (ripple effects). Short-termist global health (e.g., AMF) runs into simple cluelessness (we save lives now, but what about overpopulation/geopolitics?).
      *   *The Practical Upshot:* You can't calculate everything. You need a stopping rule. Expected Value (EV) maximization is the goal, but *estimated* EV is what we have. Cluelessness suggests we should discount uncertain future benefits heavily or treat them as noise that cancels out, *unless* there's a strong theoretical reason otherwise.
      *   *Key Insight for the Procedure:* Distinguish between *measurable direct effects* and *speculative indirect effects*. Don't let speculative effects veto measurable ones without strong justification. Address status quo bias by treating the default as just another option, not a focal point, *unless* uncertainty is symmetric.

  3.  **Drafting the Procedure (The "Cluelessness-Aware Voting Protocol"):**
      *   *Time:* 90 mins.
      *   *Step 1: Define Options & Default.* (10 mins). Crucial: The current default is *not* sacred. It's Option A.
      *   *Step 2: Direct Impact Comparison.* (30 mins). Focus on what is known/estimated (e.g., GiveWell estimates). Ignore ripple effects here.
      *   *Step 3: The Cluelessness Check.* (20 mins). Ask: "Is there a specific, plausible mechanism where the loser of Step 2 beats the winner?" If yes, is it measurable? If no, it's "clueless noise."
      *   *Step 4: The Risk/Value Vote.* (20 mins). If Step 3 yields genuine uncertainty, vote on risk tolerance/values, not facts.
      *   *Step 5: Decision & Review.* (10 mins).

      *Refining the Philosophy:*
      *   Greaves suggests that under simple cluelessness, you can ignore the unknown factors if they are symmetric.
      *   Lenman highlights the problem of not knowing *what* we don't know.
      *   *Application:* If the "ripple effects" of Malaria Nets are unknowable, and the "ripple effects" of Pandemic Prep are *also* unknowable (but potentially larger), we shouldn't let the *potential* size of the unknown swamp the *known* good. We need a "Discount Rate on Speculation."
      *   *Status Quo:* The default should only win if it beats alternatives on *known* metrics, or if uncertainty is truly symmetric. If the default was chosen arbitrarily 3 years ago, it has no epistemic privilege.

  4.  **Developing the Failure Modes:**
      *   *Conservatism:* If we discount speculation too much, we never fund high-risk/high-reward (long-termist) stuff.
      *   *Status Quo Bias:* If we treat "changing the default" as requiring higher certainty than "keeping it."
      *   *Solution:* Explicitly state that the Default gets no bonus points for being the Default.

  5.  **Running the Cases:**

      *   *Case A: Malaria Nets (AMF) vs. Pandemic Preparedness.*
          *   Direct Impact: AMF wins hands down (known lives saved vs. reduced probability of unknown pandemic).
          *   Cluelessness Check: Pandemic prep has huge upside (preventing extinction) but huge uncertainty (did we actually reduce risk?). AMF has unknown long-term effects (population, economy) but they likely cancel out (simple cluelessness).
          *   Procedure Outcome: Stick with AMF. Why? Because the pandemic prep upside is too speculative (complex cluelessness) to override the known good of AMF without strong evidence.
          *   *User Constraint:* "I want at least one of these to come out a way I won't like." This fits. The user might want to support pandemic prep, but the procedure says "no." I need to explain why this isn't laziness (it's avoiding the "Pascal's Mugging" of vague long-termism).

      *   *Case B: Local Homelessness vs. Global Health Default.*
          *   Direct Impact: Global Health wins on cost-per-life.
          *   Cluelessness Check: Local charity has "community building" effects (members volunteering). This is a *known* secondary effect (movement building), not just a ripple.
          *   Procedure Outcome: This is tricky. If we count "member engagement" as a direct benefit of the chapter's existence, Local might win. If we count only "beneficiaries," Global wins.
          *   *Decision:* Let's make the procedure favor the Global Health default here to show consistency, OR favor Local to show where values come in. Actually, the prompt asks for *one* outcome they won't like. If Case A was the "boring" one, maybe Case B should be the "counter-intuitive" one.
          *   *Wait, re-reading:* "I want at least one of these to come out a way I won't like." Usually, EAs struggle with the Local vs. Global tension. If the procedure says "Go Local because of engagement," that might annoy a hardline globalist. If it says "Go Global because Local is inefficient," that annoys the community builder.
          *   *Better approach for the prompt:* The prompt suspects the procedure will say "stop agonizing over (a) and just default." So (a) = Malaria (Default) vs. Pandemic. The procedure should say "Keep Malaria." The user might find this frustrating if they want to explore pandemic prep.
          *   For (b), let's make it clear. Local vs Global. The procedure should likely say "Global" based on direct impact, *unless* the local work is framed as "capacity building for the chapter." Let's stick to the prompt's hint: "stop agonizing over (a) and just default." So (a) results in Default. (b) needs to be distinct. Let's make (b) result in a Values Vote, showing where the procedure stops.

      *   *Refining Case A (Malaria vs Pandemic):*
          *   Direct: Malaria wins.
          *   Speculation: Pandemic has higher ceiling.
          *   Cluelessness: We are clueless about the *magnitude* of risk reduction for Pandemic. We are less clueless about Malaria.
          *   Result: Malaria. Explanation: Avoiding "complex cluelessness" traps where vague huge numbers trump concrete small numbers.

      *   *Refining Case B (Local vs Global):*
          *   Direct: Global wins.
          *   Speculation: Local builds community (EA movement growth).
          *   Cluelessness: Is movement growth real? Hard to measure.
          *   Result: This triggers the "Values Vote." Because the "community benefit" is a value judgment on the chapter's purpose (is it a grantmaker or a community hub?).

  6.  **Addressing the Treasurer/Implementation:**
      *   The Treasurer needs to know *why* the decision was made. The procedure generates a "Decision Memo" with specific checkboxes.
      *   What can't be settled? The ultimate trade-off between "known good now" vs. "speculative good later." The procedure forces a vote on this, it doesn't calculate it.

  7.  **Drafting the Content - Section by Section:**
      *   *Intro:* Acknowledge the vibe shift.
      *   *The Procedure:* 4 Steps. (Direct Estimate, Cluelessness Audit, Symmetry Check, Values Vote).
      *   *Status Quo:* Explicitly deprioritize it.
      *   *Failure Modes:* Status quo creep, paralysis.
      *   *Case Studies:* Apply the steps.
      *   *Treasurer Note:* What is unresolved.
      *   *Verdict:* The one-liner.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is the procedure too complex for 90 mins?
      *   *Fix:* Simplify the language. Use "Known Impact" vs. "Storytelling Impact."
      *   *Critique:* Did I address the "Default chosen 3 years ago" issue?
      *   *Fix:* Add a "Reset Clause." The default is just the option that won last time, not a baseline that must be beaten by a margin.
      *   *Critique:* Ensure the "Cluelessness" philosophy is accurate. Greaves argues that if reasons for/against are symmetric, they cancel. Lenman argues we can't know if they are symmetric.
      *   *Application:* The procedure should treat asymmetric speculation (Pandemic prep) as high-risk, not necessarily higher EV, unless there's a specific mechanism. It should treat symmetric ignorance (Malaria long-term ripple) as canceling out.
      *   *Tone:* Pragmatic, slightly academic but actionable, empathetic to the "wrecked me" feeling.

  9.  **Final Polish:** Check constraints.
      *   90 mins? Yes.
      *   No reading list? Yes.
      *   Verdict line format? Yes.
      *   One outcome they won't like? Yes (likely the Pandemic one).
      *   Treasurer sign-off? Yes.

      *(Self-Correction on Case A)*: The prompt says "I suspect a good procedure will tell us to stop agonizing over (a) and just default on it." So I must ensure the procedure outputs "Keep Malaria Nets."
      *(Self-Correction on Case B)*: Make sure this one highlights the "Values Vote" aspect.

      *(Refining the "Why it's not laziness" argument)*: It's not laziness because it's applying a discount rate to uncertainty. It's an epistemic tax on vagueness.

      *(Refining the Status Quo)*: The procedure must explicitly state: "The current default enters the comparison with zero bonus points."

      *(Final check on Verdict)*: Must start with "Verdict:" and be one sentence.

  10. **Writing the response.** (Proceeding to generate output based on these thoughts).
answer: |-
  Here is a decision procedure designed for your specific constraints. It translates the "cluelessness" literature (specifically Greaves' distinction between simple and complex cluelessness) into a practical filter for a student exec. It does not solve the philosophical problem; it manages the risk of it paralyzing you.

  ### The "Cluelessness-Aware" Decision Protocol (90 Minutes)

  **Pre-Meeting:** The Secretary must circulate a one-pager for each option (including the current default) containing only *direct* impact estimates (e.g., GiveWell figures, audited outcomes). No "vision statements" or "ripple effect" narratives allowed in the pre-read.

  **Step 1: The Direct Impact Comparison (30 mins)**
  *   **Question:** "Ignoring all long-term ripple effects, which option produces the most verifiable good per pound *right now*?"
  *   **Action:** Compare the pre-read figures.
  *   **Sufficient Answer:** A clear winner emerges based on direct metrics (e.g., cost per life saved vs. cost per policy change).
  *   **Cluelessness Rule:** If Option A wins here, Option B must clear a "Speculation Hurdle" to overturn this. The burden of proof is on the *uncertain* option, not the *known* option.
  *   **Status Quo Check:** The current default is treated as Option A or B. It gets no bonus points for being the default. If it loses Step 1, it is eliminated unless it clears the Hurdle.

  **Step 2: The Cluelessness Audit (20 mins)**
  *   **Question:** "Why might the Step 1 loser actually be better?"
  *   **Action:** List the mechanisms where the loser outperforms (e.g., "Pandemic prep prevents extinction," "Local charity builds community").
  *   **Classification:** Label each mechanism as **Simple Cluelessness** (we know effects exist but can't predict direction, e.g., "saving lives changes population dynamics") or **Complex Cluelessness** (we know effects exist but can't weigh them against each other, e.g., "preventing a pandemic is huge but we don't know if this specific work reduces risk").
  *   **Sufficient Answer:**
      *   If the advantage relies on *Simple Cluelessness* (symmetric ignorance): **Discard it.** (Greaves' insight: if we have no reason to think the unknown effects favor B over A, assume they cancel out).
      *   If the advantage relies on *Complex Cluelessness* (asymmetric speculation): **Proceed to Step 3.**

  **Step 3: The Speculation Hurdle (20 mins)**
  *   **Question:** "Is the speculative upside of the Step 1 loser large enough to justify a 90% discount rate?"
  *   **Action:** Apply a "Vagueness Tax." If the impact relies on a chain of events longer than three steps (e.g., "We fund research → scientists learn something → policy changes → pandemic averted"), reduce its estimated value by 90%.
  *   **Sufficient Answer:** Does the discounted value of the speculative option still beat the direct value of the Step 1 winner?
      *   **Yes:** Proceed to Step 4.
      *   **No:** The Step 1 winner is selected automatically. Stop here.

  **Step 4: The Values Vote (20 mins)**
  *   **Question:** "Given the remaining uncertainty, what kind of risk profile do we want as a chapter?"
  *   **Action:** This is no longer a factual debate. It is a vote on values.
  *   **Options:**
      1.  **Robustness:** Prefer known, verifiable good (favoring Step 1 winner).
      2.  **Optionality:** Prefer high-upside, high-uncertainty work (favoring Step 1 loser).
  *   **Sufficient Answer:** Simple majority vote. This decision is explicitly recorded as a *value judgment*, not a *discovery of truth*.

  **Step 5: Ratification & Memo (10 mins)**
  *   **Action:** The Treasurer signs off based on the "Decision Memo" generated by these steps.
  *   **Constraint:** If Step 3 resulted in an automatic selection, the Treasurer cannot veto based on "potential." If Step 4 was reached, the Treasurer signs off on the *process*, not the outcome.

  ---

  ### Predictable Failure Modes

  1.  **The Conservatism Trap:** By applying the "Vagueness Tax" in Step 3, you will systematically underfund long-termist or systemic work. This is a feature, not a bug, given your budget size (£3k). You cannot afford to be a venture capitalist for existential risk; you are a grantmaker for verifiable good.
  2.  **Status Quo Creep:** Even with the "Status Quo Check" in Step 1, humans treat the current default as a focal point.
      *   *Mitigation:* In Step 1, physically swap the seating arrangement or slide order so the default isn't visually first.
  3.  **The "Blank Check" of Cluelessness:** Members may try to use Step 2 to say "We are clueless about everything, so we can't choose."
      *   *Mitigation:* The Chair must enforce the distinction. Simple cluelessness (unknown ripples of saving a life) cancels out. It does not justify inaction.

  ---

  ### Running the Procedure on Your Cases

  #### Case A: Malaria Nets (Default) vs. Pandemic Preparedness
  *   **Step 1 (Direct):** Malaria Nets win decisively. We have concrete cost-per-life figures. Pandemic prep has no verifiable "lives saved" metric for a £3k donation.
  *   **Step 2 (Audit):** Pandemic prep advantage relies on preventing a low-probability, high-impact event. This is **Complex Cluelessness**. We don't know the baseline risk, nor the marginal impact of your specific donation on that risk. Malaria Nets' long-term effects (population, economy) are **Simple Cluelessness** (likely symmetric).
  *   **Step 3 (Hurdle):** Apply the 90% Vagueness Tax to the pandemic prevention estimate. Even with astronomical stakes, the probability of *your* £3k changing the outcome is so small and fuzzy that the discounted value drops below the certain lives saved by nets.
  *   **Result:** **Stop at Step 3.** Select Malaria Nets.
  *   **Why this isn't laziness:** It is an application of *epistemic humility*. Choosing pandemic prep here would be pretending you have knowledge you don't (that this specific donation reduces risk). Sticking with nets acknowledges that while we are clueless about the *future*, we are not clueless about the *present*. The procedure forces you to admit that "maybe it helps" is not a sufficient reason to override "definitely helps."

  #### Case B: Local Homelessness (Volunteer) vs. Global Health Default
  *   **Step 1 (Direct):** Global Health wins on cost-effectiveness metrics.
  *   **Step 2 (Audit):** Local charity advantage is "community building" and "member engagement." This is **not** Simple Cluelessness; it is a *direct* benefit to the chapter's sustainability. However, it is hard to quantify in "lives saved."
  *   **Step 3 (Hurdle):** Can we value "member retention" highly enough to beat the global health metrics? This is not a factual question. It fails the Hurdle because there is no common currency.
  *   **Result:** **Proceed to Step 4 (Values Vote).**
  *   **The Vote:** The exec must vote on: "Are we primarily a funding vehicle for the world, or a community hub for students?"
      *   If Funding Vehicle: Global Health.
      *   If Community Hub: Local Homelessness.
  *   **Treasurer Note:** This outcome cannot be settled by facts. The Treasurer must accept that the decision rests on the chapter's self-definition, not on moral truth.

  ---

  ### What This Procedure Cannot Settle

  You need to tell your Treasurer that this procedure **cannot resolve the conflict between "Doing Good" and "Building the Movement."**
  In Case B, if the vote is split, there is no philosophical tie-breaker. The procedure exposes that the disagreement is not about *effectiveness* (which we measured in Step 1) but about *purpose*. If the Treasurer requires a single metric for audit purposes, you must assign a fixed "engagement value" (e.g., "1 hour of member volunteering = £X") before the meeting, or the vote will remain ambiguous.

  Additionally, the procedure cannot protect you from **moral uncertainty**. If half the exec are deontologists who hate the "numbers game," this consequentialist protocol will feel alienating. It assumes everyone agrees that "more good is better," only disagreeing on how to measure it.

  ### Final Advice for the Meeting
  When someone says "But what about the ripple effects?" in Step 2, your response is: *"We are acknowledging those exist, but under Greaves' condition of simple cluelessness, we have no reason to think they favor Option B over Option A. So we treat them as zero."*

  This shuts down the infinite regress without claiming to know the future.

  Verdict: Treat symmetric ignorance as neutral noise, tax asymmetric speculation heavily, and vote explicitly on values only when the math runs out.
