  The silence in the Archive was not the silence of emptiness, but of held breath. Elias worked at Station 4, a hooded desk lit by the cool glow of spectral lamps. Before him lay a reel of nitrate film from 1938. It was brittle, smelling of vinegar and decay, a physical object that had already outlived its creators by nearly a century.

  His task was specific: stabilize the emulsion. He was using a chemical binder developed only five years ago, meant to preserve the images for another five hundred. He dipped the brush. He held his hand steady.

  Outside the thick glass of the Archive, the city continued. There were no riots when the Data came out. There had been a week of strange quiet, a collective pause like a stumble on a staircase, and then life had resumed. But the texture of life had changed. The schools were closed, not because of danger, but because there was no one to fill them. The toy stores sold vintage stock to collectors. The construction crews weren't building new housing developments; they were reinforcing the old ones, patching leaks, weatherproofing.

  Elias knew the math. He knew the demographic curves. The youngest person on earth was six years old. Even if she lived to be one hundred and ten, the human story would conclude thirty years after her heart stopped. There was a hard horizon. No one knew why fertility had vanished globally, nor why the planetary stability models predicted a cascade failure exactly three decades after the last biological human died. It was just physics and biology agreeing on a deadline.

  He applied the binder. The scratch on the frame vanished. In 1938, the people on the screen were laughing at a joke he would never hear. They were building lives that assumed a tomorrow. He was preserving the assumption.

  Sometimes, his hand would hover. He would look at the chemical bottle, labeled *PermaBind 500*, and wonder about the arrogance of the number. Who would read the label in year 2100? There would be no one. The label would be accurate, the preservation successful, and the audience would be zero.

  He didn't stop. He dipped the brush again.

  ***

  Mara was in the garden when he got home. She wasn't gardening, not really. She was sitting on the edge of the raised beds, eating a peach. Juice ran down her wrist, sticky and sweet. She didn't use a napkin. She licked it off.

  "You're late," she said.

  "Complex emulsion on the '38 reel," Elias said, hanging his coat on the rack. He noticed the roof gutter was sagging again. It had been sagging for six months. Before the Data, Julian would have fixed it in a weekend. Now, he let it hang. If it broke, it broke. They would be dead before the rot reached the beams.

  "Did you fix it?"

  "Yes."

  "Good." She dropped the peach pit on the grass. It would compost. Nothing mattered enough to sweep up.

  They ate dinner on the patio. The sky was a bruised purple, the air cooling. Mara had opened a bottle of wine that they had been saving for a tenth anniversary that had passed quietly. It was a heavy red, meant to soften over decades. She poured it generously.

  "There's a sale at the hardware store," Mara said, cutting her steak. "Twenty percent off power tools. No one is buying them."

  "What are you going to do with a drill?"

  "I don't know. Hold it. Feel the weight." She smiled, but it didn't reach her eyes. "I thought about going to the coast. Next week. Just driving. Sleeping in the car."

  "We have a bed," Elias said.

  "I know. But the bed is here. The coast is there."

  This was the divergence. Elias moved toward permanence; Mara moved toward intensity. Neither accused the other of waste. They had tried arguing once, months ago. Elias had said that maintaining standards was a form of dignity. Mara had said that dignity was a luxury for people who expected an audience. They hadn't resolved it. They had just stopped talking about it.

  Elias looked at the corner of the yard. There was a patch of bare earth where the old dogwood had died last winter. He had been carrying something in his pocket all day. A small container.

  "I bought something," Elias said.

  Mara stopped chewing. "What?"

  He reached into his pocket and set the container on the table. It was a seedling tube. Inside, a tiny shoot curled upward, two leaves unfurled. "American Chestnut. Blight-resistant variety."

  Mara looked at the sapling, then at Elias. "Elias."

  "It grows slow," he said. "Strong wood. Resistant to rot."

  "It takes forty years to fruit," she said. Her voice was flat, not angry. Just stating a coordinate.

  "I know."

  "The last person to eat a chestnut from this tree..." She trailed off. She didn't need to finish the sentence. The last person would be old, gray, living in a world that was already shutting down. They would eat the nut, and then the line would end. There would be no one to plant the next tree.

  "It's a nice tree," Elias said.

  "It's a monument to nothing."

  "It's not a monument. It's a tree."

  Mara pushed her plate away. She looked at the sapling with a kind of weary pity, the way one looks at a child trying to build a sandcastle before the tide comes in. But there was no malice in it. She understood the impulse even if she couldn't share it.

  "You know the soil here is clay," she said finally. "You'll need to amend it. Mix in sand. Otherwise, the roots will choke."

  Elias felt a sudden, sharp relief. He hadn't realized he was holding his breath. "I have sand in the shed."

  "It's going to rain tonight," Mara said. "You should plant it now. Let the water settle it."

  Elias stood up. He took the tube and a trowel from the bench. He walked to the bare patch of earth. He knelt. The soil was cool and damp. He dug a hole, careful not to damage the root ball. He placed the sapling in the ground. He packed the earth around the base.

  For a moment, he just stayed there, kneeling in the dirt. He looked at the tiny stem. It was so fragile. It relied on sun, on water, on time. It assumed a future.

  He knew, scientifically, that the tree would likely survive. It would grow. It would weather the storms of the next century. It would stand tall long after the Archive had crumbled, long after the city was overgrown. It would be the last living thing of its kind, standing in a silent world, dropping nuts onto grass that no one mowed.

  Was it madness? To care for a thing that would outlive the concept of care?

  He looked back at the house. Mara was watching him from the patio. She hadn't gone inside. She was holding her wine glass with both hands, warming them against the glass. She wasn't smiling, but she wasn't looking away.

  Elias reached out and touched one of the small leaves. It was firm. It was alive. It didn't know about the Data. It didn't know about the horizon. It just reached for the light.

  He stood up, wiping his hands on his trousers. The gutter sagged overhead. The wine waited on the table. The tree stood in the darkening yard, a small, green vertical line against the coming night.

  "Come inside," Mara said softly. "It's getting cold."

  "In a minute," Elias said.

  He stayed until the first drop of rain hit his cheek. He wanted to feel it land. He wanted to be there when the tree took the water. It wasn't for the future. It wasn't for the past. It was just for now, because now was the only place where the planting happened.

  He turned and walked back to the light of the house.
