      *   **Move 3 (Philosopher):** ATLAS/CMS not truly independent (same accelerator, community). BICEP2 example (systematic error). Norm should be *Justified/Responsible Belief*, not Knowledge, because systematic errors undermine knowledge claims even with high sigma.
