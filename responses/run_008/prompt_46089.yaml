          *   *Analysis:* Philosophically strong on the Williamson norm. Practically, "knowledge" in science is often provisional. Is it *knowledge* if it might be overturned? Williamson says knowledge is factive (if you know $p$, $p$ is true). If the Higgs wasn't real, they didn't *know* it. But they claimed they did.
