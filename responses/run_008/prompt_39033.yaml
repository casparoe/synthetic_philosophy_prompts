      *(Self-Correction during drafting)*: Make sure I don't just agree with the user. I need to critique. The critique should be that their view is internally inconsistent. If the loop closes, the org throttle *should* break. Holding both implies a stopping point for automation that is arbitrary.

      *(Final check on tone)*: The user is a writer asking for an editorial critique. I should sound like a sharp editor or a peer reviewer. Direct, analytical, no fluff.

