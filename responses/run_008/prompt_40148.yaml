  10. **Refining the Voice:** Ensure it sounds like a colleague speaking to a colleague. Avoid introductory fluff. Get straight to the theoretical meat. Use terms like "constitutive," "instrumental," "legitimation," "interiority."

  11. **Self-Correction during drafting:** I initially thought about calling it "Ritual." That might be too anthropological. Let's stick to "Constitutive Proceduralism." Wait, is "Proceduralism" too dry? Let's focus on **Legitimation through Universality**. The state wants to be sure it represents the *whole*, not the *active*. The blank vote is part of the "whole."

      *Wait, one nuance:* The prompt asks if the duty-reading and expression-reading can both license it. I need to answer that directly.
      *My answer:* No, they are in tension. The design resolves the tension by separating the *external act* (duty) from the *internal act* (expression). It privileges the Duty of Presence over the Duty of Choice.

