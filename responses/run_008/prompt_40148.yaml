      *   *If* you could opt out easily -> Then it's not a duty, just a nudge.

  7.  **Finalizing the Position:**
      *   I will argue that the Australian model presupposes voting is a **duty of civic auditability**. The state requires you to account for your status as a citizen periodically. The secret ballot ensures this accounting doesn't become inquisition.
      *   This rules out:
          1.  **Strong Republicanism:** (Which would demand virtuous choice).
          2.  **Pure Liberalism:** (Which would forbid the compulsion).
          3.  **Compelled Speech:** (Because the content is protected).
      *   This supports: **Constitutive Proceduralism.** The act constitutes the demos.

  8.  **Review against Constraints:**
      *   PhD level tone? Yes.
