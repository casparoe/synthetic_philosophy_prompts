      *   Address the "blank ballot" wrinkle? Yes.

  9.  **Drafting the Content (Mental Outline):**
      *   **Thesis:** The design presupposes voting is a *duty of presence* (constitutive), not a *duty of preference* (instrumental).
      *   **Argument 1: The Firewall Against Compelled Speech.** The secret ballot + informal vote option means the state compels the *channel*, not the *message*. Distinguish from *Wooley v. Maynard* (license plates).
      *   **Argument 2: Ruling Out Strong Republicanism.** If it were about virtue/deliberation, blank ballots would be pathologized. They aren't. They are accepted "taxes."
