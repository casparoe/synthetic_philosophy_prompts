answer: |-
  The Australian design—compulsory attendance, secret ballot, permissible informality—presupposes a specific and often overlooked theory of citizenship: **voting is a duty of civic auditability, not a duty of preference aggregation.**

  This is not a compromise between liberal and republican views, nor is it underdetermined. The specific architecture of the law actively *excludes* the strong Civic Republican reading (which would demand virtuous choice) and the pure Liberal-Expressive reading (which would forbid compulsion). Instead, it operationalizes a **Constitutive Universalist** view. On this view, the legitimacy of the state derives from the physical assembly of the *demos* as a whole, not from the sum of their choices. The state requires your body to establish the boundary of the political community; it explicitly disclaims interest in your mind to preserve the boundary of individual sovereignty.

  Here is the defense of that stand, addressing the specific tensions you raised.

  ### 1. Resolving the Compelled Speech Objection
  You note the inconsistency: liberal democracies treat compelled expression as anathema, yet this law drags citizens to the polls. The resolution lies in how the law categorizes the act.

  If voting were legally defined as *speech*, compulsory attendance would be unconstitutional coercion (akin to *Wooley v. Maynard* regarding license plates). However, the Australian design structurally defines voting as an **administrative function of status**. By guaranteeing the secret ballot and legally protecting the right to submit an informal (blank/spoiled) vote, the state severs the link between *attendance* and *endorsement*.

  The law presupposes that the act of showing up is **pre-political**. It is the administrative verification that you remain a member of the corpus. Once you are inside the booth, the state's jurisdiction ends. The "compelled speech" objection fails because the state compels the *channel* of communication while rigorously protecting the *content* (including the content of "no message"). If the practice presupposed voting as expression, the secrecy would be a loophole; in this design, secrecy is the *condition* that makes the compulsion permissible. It transforms the act from "forced declaration" to "mandatory registration."

  ### 2. Ruling Out Strong Civic Republicanism
  A strong Civic Republican view holds that voting is a duty to deliberate and choose the common good. If this design presupposed that view, informal voting would be treated as a dereliction of duty, akin to a juror refusing to return a verdict.

  But the system tolerates, and indeed structurally accommodates, the blank ballot. The fine is levied for *non-attendance*, not for *non-choice*. This rules out the reading that the state values your *judgment*. It values your *presence*.

  This distinguishes the duty from jury service more sharply than is usually admitted. In jury duty, you are compelled to listen and deliberate to reach a verdict (even if hung). In compulsory voting, you are compelled to present yourself, but you are explicitly permitted to withhold judgment. Therefore, the practice cannot presuppose that voting is a work-product owed to the state. It presupposes voting is a **ritual of membership**. The "work" is not choosing the government; the work is legitimizing the process by which the government is chosen by demonstrating that the process encompasses everyone.

  ### 3. The Core Presupposition: Legitimacy through Universality
  So, what does the practice presuppose? It presupposes that **political legitimacy is a function of the scope of participation, not the intensity of preference.**

  In optional voting systems, the government claims legitimacy from the *will* of the people (aggregated preferences). In the Australian system, the government claims legitimacy from the *existence* of the people (universal presence). A blank ballot is not "noise" in this system; it is data. It signals, "I am a member of this polity, I acknowledge this authority, but I withhold consent from these options."

  This is why the fine is tiny (a parking ticket). It is not a punitive sanction for moral failure; it is an administrative fee for non-compliance with a regulatory requirement. The state is saying: "We do not care if you vote for us, against us, or for no one. We care that we can account for you." This is a **constitutive** theory of voting. The election does not just select leaders; it constitutes the citizenry as a visible, auditable whole.

  ### 4. Counterfactuals: How to Settle the Interpretation
  You asked what feature, if changed, would settle the interpretation if one believes it is underdetermined. I argue it is determined by the current features, but we can prove this by seeing what would break the **Constitutive Universalist** reading.

  *   **If blank ballots were fined:** This would shift the presupposition to **Instrumental Aggregation**. It would mean the state values the *output* (a decision) over the *input* (presence). It would align with a Utilitarian view where the goal is maximizing preference data, and "null" data is a loss.
  *   **If attendance were optional but voting compulsory:** This is logically incoherent, but if the law allowed you to skip the booth but fined you for not mailing in a ballot, it would presuppose voting is a **remote transaction** (like taxes). The current requirement for physical presence (or specific in-person discharge) presupposes that the *ritual of assembly* has intrinsic value.
  *   **If "None of the Above" was a binding option:** If a majority voting "informal" could trigger a new election or void the result, the system would presuppose a **Mandate Theory** (the government needs active consent). Currently, informal votes are counted but do not invalidate the result. This confirms the **Audit Theory**: the state needs to know you were there, not that you agreed.

  ### Conclusion
  The Australian design is not a muddled compromise. It is a coherent implementation of a specific normative claim: **Citizenship entails an obligation of visibility.**

  It rules out the Liberal-Individualist view that political engagement must be purely voluntary to be free. It rules out the Civic Republican view that engagement must be virtuous to be valuable. It occupies a third position: **Procedural Constitutionalism**. The duty is to sustain the procedure itself. By compelling the body and freeing the mind, the law asserts that the stability of the regime depends on the universal physical participation of the citizenry, while the liberty of the regime depends on the insulation of the citizen's will from the state's gaze.

  The inconsistency you perceive regarding compelled speech dissolves once you accept that the law treats voting not as political expression, but as **civic census**. You are not being forced to speak; you are being forced to be counted.
