  ### 4. The Best "Splitter" Case

  To truly break Dana's system, you need a case where the **Subjective Counterfactual** (Rule A) clashes with the **Objective Materiality** (Rule B). The PhD case protected Rule A, and the Vasectomy case protected Rule B, but they haven't fought each other directly yet.

  **Invented Case: "The Post-Menopausal Vasectomy"**
  > A man lies about having a vasectomy. The woman is post-menopausal (pregnancy is biologically impossible) and explicitly states, *"I don't care about fidelity or pregnancy risks. I know he lied, but I would have slept with him anyway."*

  *   **Rule A (Counterfactual/PhD Precedent) predicts: VALID.** (She would have said yes anyway; the lie didn't change the decision).
  *   **Rule B (Materiality/Vasectomy Precedent) predicts: INVALID.** (Lies about fertility/commitment are inherently voiding, regardless of risk).
  *   **Why it splits them:** This forces Dana to choose between her intuition that "lies about sex terms are bad" (Vasectomy) vs. "consent is about what the victim actually wanted" (PhD). If she calls it Valid, she admits the Vasectomy verdict was only about pregnancy risk, not the lie itself. If she calls it Invalid, she admits the PhD verdict was only about "trivial" attributes, not the Counterfactual.

