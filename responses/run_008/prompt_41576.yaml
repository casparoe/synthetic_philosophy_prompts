  Based on Dana's track record, she isn't operating on a single principle (like "autonomy" or "harm"), but rather a **hybrid intuitionist framework** that weighs *materiality*, *counterfactuals*, *coercion baselines*, and *symmetry of capacity*. She claims to have no theory, but her verdicts reveal a consistent, if sometimes tense, set of heuristics.

  Here is the breakdown of her likely calls, the rules driving them, where they break, and the case that exposes the fault lines.

  ### 1. Predictions on Your New Cases

  **Case 1: The Faith Lie (Invalid)**
  *   **Verdict:** **Invalid Consent.**
  *   **Reasoning:** This aligns with the **Married** case, not the PhD case. Dana treats lies about *commitment structures* or *core identity conditions* (marriage, religion) as inherently material, regardless of the lie's "size." Like marital status, strict religious observance is a governing rule for the relationship/act. Even if she didn't explicitly say "I would have said no," Dana likely assumes a "strict rule" implies a dealbreaker, making this fraud in the *terms* of the relationship.

  **Case 2: The Age Lie (Valid)**
  *   **Verdict:** **Valid Consent.**
  *   **Reasoning:** This aligns with the **PhD** case. The deciding factor here is the victim's *stated preference* ("genuinely doesn't care"). Dana's PhD verdict explicitly hinged on the woman saying the lie "wouldn't have changed her answer." Dana prioritizes the *victim's subjective dealbreakers* over the *liar's intent* (he was convinced it mattered). If the victim says the fact is immaterial, the lie doesn't vitiate consent.

  **Case 3: The Dropout Threat (Invalid)**
  *   **Verdict:** **Invalid Consent.**
  *   **Reasoning:** This aligns with **"Sleep or Fired."** Dana distinguishes sharply between *threats* (conditional worsening of a baseline) and *offers* (conditional improvement). It does not matter if the threatened act (telling parents, firing an employee) is something he is "allowed" to do. In the "Fired" case, an employer is generally allowed to fire at-will employees, yet she called it invalid. The coercive *structure* (do X or I harm you) invalidates consent, regardless of the legitimacy of the harm.

  **Case 4: The Anxiety Meds (Valid)**
  *   **Verdict:** **Valid Consent.**
  *   **Reasoning:** This aligns with the **Both Blackout Drunk** case. Dana's intoxication rule isn't strictly about *capacity* (otherwise blackout drunk would be invalid); it is about *exploitation* and *regret*. Since the partner isn't sober/predatory (implied mutual context or lack of exploitation) and the agent is "genuinely happy" the next morning, Dana treats the *retrospective endorsement* as curing the *contemporaneous impairment*.

  ---

  ### 2. The "Dana System": Competing Rules

  Dana is juggling three distinct rules that usually overlap but sometimes conflict.

  **Rule A: The Subjective Counterfactual (The "Dealbreaker" Test)**
  *   *Definition:* Consent is invalid only if the deception or pressure changed the specific victim's decision.
  *   *Evidence:* **PhD Case** (Valid because she didn't care), **Fake Name** (Valid because it didn't affect the act), **Age Case** (Predicted Valid).
  *   *Weakness:* It struggles to explain why **Married** or **Vasectomy** lies are invalid *automatically*. Does Dana assume everyone cares about these? Or is there a second rule?

  **Rule B: The Objective Materiality (The "Risk" Test)**
  *   *Definition:* Consent is invalid if the lie concerns inherent risks or fundamental terms of the act (pregnancy, disease, monogamy), regardless of stated preference.
  *   *Evidence:* **Vasectomy** (Invalid), **On the Pill** (Invalid), **Married** (Invalid).
  *   *Weakness:* It conflicts with Rule A. If a woman said, "I don't care if he's married," would Dana still call it invalid? Rule B says yes; Rule A says no.

  **Rule C: The Symmetry/Exploitation Baseline**
  *   *Definition:* Consent is invalid if there is an asymmetry of power, capacity, or information that one party exploits to worsen the other's baseline.
  *   *Evidence:* **Sober/Drunk** (Invalid = Exploitation), **Sleep/Fired** (Invalid = Coercion), **Both Blackout** (Valid = Mutual/Symmetrical), **Rich Guy Offer** (Valid = No baseline harm).
  *   *Weakness:* It relies heavily on *retrospective* feelings (happy next morning) to validate *contemporaneous* incapacity.

