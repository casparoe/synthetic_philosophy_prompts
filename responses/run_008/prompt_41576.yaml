  ### 5. Unreconcilable Verdicts: The Intoxication Pair

  You are right to flag the **Sober/Drunk** vs. **Both Blackout** verdicts. While they *can* be reconciled under a specific "Exploitation" theory, they are unreconcilable with standard bioethical definitions of consent, and they create a logical tension in her own system.

  *   **The Conflict:** "Blackout drunk" medically implies anterograde amnesia and significantly impaired judgment. In bioethics, this is often treated as **incapacity**.
  *   **The Tension:**
      *   If Blackout = Incapacity: Then **Both Blackout** should be **Invalid** (two incapacitated people cannot consent to each other). Dana calls it **Valid**.
      *   If Blackout ≠ Incapacity (Behavioral Consent is enough): Then **Sober/Drunk** *could* be **Valid** if the drunk person was enthusiastic. Dana calls it **Invalid**.
  *   **Dana's Fix (and why it's fragile):** Dana reconciles this using **Rule C (Symmetry)**.
      *   *Sober/Drunk:* Invalid because the sober person *knows* and *exploits* the incapacity (Predation).
      *   *Both Blackout:* Valid because neither knows, neither exploits, and both endorse it later (Mutual Mistake + No Regret).
  *   **Why it's still unreconcilable:** This makes consent contingent on **regret** rather than **autonomy**. If the "Both Blackout" couple wakes up horrified and regretful, does her verdict change? If yes, consent is retrospective (unstable). If no, then "enthusiasm" didn't matter.
  *   **The Fatal Flaw:** Her system allows that you can validly consent to sex you were cognitively incapable of understanding, provided your partner is *equally* incapable. This contradicts the **Sober/Drunk** logic that incapacity *is* the problem. If incapacity is the problem, mutuality shouldn't fix it. If exploitation is the problem, she isn't judging *consent*, she's judging *morality*.

  **Recommendation:** Hit her with the **Post-Menopausal Vasectomy** case first. It's the cleanest way to show that her "Would you have said yes?" rule (PhD) and her "Some lies are just off-limits" rule (Vasectomy) are on a collision course.
