  Based on Dana's track record, she is not operating on standard intuition; she is applying a rigorous framework of decision theory, likely influenced by the "rationalist" community (think LessWrong, MIRI, or academic game theory). Her rulings distinguish sharply between situations where her choice *influences* the outcome (causally or logically) and situations where it merely *reacts* to a fixed reality.

  Here are the predictions, the underlying rules, and the test to prove which one she actually uses.

  ### Part 1: Predictions for the New Hypotheticals

  **1. The Predictive Vandal**
  *   **Prediction:** **She pays the fee.**
  *   **Reasoning:** This is structurally identical to her Kidnapper ruling (Case 1), but with the incentive inverted. In Case 1, being the "type who pays" got you kidnapped, so she chose to be the "type who doesn't." Here, being the "type who pays" keeps you safe. Since the vandal's prediction is based on her decision algorithm, she must output "Pay" to ensure the prediction was "Payer," thereby ensuring she was never targeted.

  **2. The Surrogate Goal**
  *   **Prediction:** **She signs up.**
  *   **Reasoning:** This is a classic pre-commitment strategy. By making her decision algorithm "stubborn" across all values (real and surrogate), she removes the leverage advantage from any potential adversary. Even though she incurs a causal cost (defending porcelain from non-threats), she optimizes the global output of her decision function to prevent high-stakes blackmail scenarios from ever becoming profitable.

  ---

  ### Part 2: The Two Candidate Rules

  You noted that at least two rules fit her past four rulings. Here they are. Both explain the past perfectly but diverge on the new cases.

  #### Rule A: Functional Decision Theory (FDT) / "The Algorithm Rule"
  *   **The Principle:** You should act as if you are choosing the output of your decision algorithm, not just a single physical action. Your decision is logically correlated with any system that predicts you (Case 1), simulates you (Case 2), or relies on your type (Case 4). However, if a past event is causally disconnected from your algorithm's output (Case 3), you treat it as fixed.
  *   **Fit with Past Rulings:**
      *   *Case 1 (Kidnapper):* Algorithm "Pay" → Predicted "Pay" → Kidnapped. **Don't Pay.**
      *   *Case 2 (Nuclear):* Algorithm "Bluff" → Predicted "Bluff" → Attacked. **Retaliate.**
      *   *Case 3 (Blackmailer):* Theft is past/causal. Algorithm "Pay" → Data Safe. **Pay.**
      *   *Case 4 (Ransom):* Algorithm "Pay" → Market Incentivized. **Don't Pay.**
  *   **Predictions for New Cases:**
      *   *Vandal:* Algorithm "Pay" → Predicted "Pay" → Safe. **Pay.**
      *   *Surrogate:* Algorithm "Stubborn" → Threats Unprofitable. **Sign Up.**

  #### Rule B: Causal Decision Theory with Systemic Constraints (CDT+R) / "The Incentive & Isolation Rule"
  *   **The Principle:** Maximize causal good *unless* doing so creates negative systemic incentives or reputational signals. If a situation is truly sealed (no reputation, no market feedback), minimize immediate causal loss. If a situation affects future incentives (market, deterrence, type-selection), prioritize the long-term equilibrium.
  *   **Fit with Past Rulings:**
      *   *Case 1 (Kidnapper):* Paying incentivizes kidnappers to target your "type." **Don't Pay.**
      *   *Case 2 (Nuclear):* Bluffing destroys deterrence credibility. **Retaliate.**
      *   *Case 3 (Blackmailer):* Sealed/Isolated. No systemic harm. Minimize loss. **Pay.**
      *   *Case 4 (Ransom):* Paying funds the market. **Don't Pay.**
  *   **Predictions for New Cases:**
      *   *Vandal:* **Don't Pay.** The prediction is a *past fact*. In a sealed world, paying now cannot change the vandal's prior selection. Paying is throwing good money after bad (causal loss) with no reputational gain.
      *   *Surrogate:* **Don't Sign.** The cost (defending porcelain) is causal and real. The benefit (deterrence) is hypothetical and sends no signal yet (no adversary exists). A causal agent crosses bridges when they come to them.

  ---

  ### Part 3: Best Guess & Reasons

  **Dana follows Rule A (Functional Decision Theory).**

  **Reasons:**
  1.  **The "Surrogate Goal" Tell:** This is the smoking gun. "Surrogate Goals" are a niche concept specifically developed within Functional Decision Theory literature (notably by Levinstein and Soares) to solve blackmail problems. A standard Game Theorist (Rule B) would likely view voluntarily incurring costs against non-threats as irrational "sunk cost" behavior. Only an FDT agent views it as optimizing the *policy*.
  2.  **Consistency on Case 1:** While Rule B can explain Case 1 via "market incentives," Dana's reasoning ("if you're the kind of person who doesn't pay, this simply never happens") is explicitly about *logical correlation* (your type determines the prediction), not just market economics.
  3.  **The Sealed Distinction:** Dana pays the Blackmailer (Case 3) but not the Real-World Ransom (Case 4). This shows she isn't a deontologist ("Never pay extortion"). She is a consequentialist who weighs *logical* consequences (FDT) heavily.

