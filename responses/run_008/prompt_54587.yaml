      *   *Conclusion:* The practice operates on a **Noisy Realist** view. It assumes a stable, latent, internal state (preference/reward) exists independently of the interaction, and behavior is an imperfect measurement of it. It rejects strict revealed preference (because of the noise model) but also rejects strong constructivism (because it assumes the preference exists *before* the measurement).

  3.  **Evaluate Candidate Theories:**

      *   **Strict Revealed Preference:** Incompatible. If choice *is* preference, you can't call a choice "noisy" or "irrational." You can't have dark patterns "corrupting" preference; the click *is* the preference at that moment. The math (IRL/RLHF) explicitly models a gap between choice and value.
