  2. This implies a person-affecting framework where new citizens are valued instrumentally to secure the economic welfare of the existing population rather than as intrinsic goods.
  3. The restriction of immigration despite labor shortages reveals a communitarian premise that the cultural identity of the population matters more than aggregate headcount or efficiency.
  4. The non-identity problem is rendered moot by assuming that benefit consists in inheriting a stable nation, regardless of whether specific individuals would otherwise have existed.
  5. Consequently, the package presupposes a nationalist contract where population ethics are subordinate to the preservation of a specific political community rather than universal welfare maximization.
