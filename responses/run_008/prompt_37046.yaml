answer: |-
  Here is the session plan. It is designed to be rigid in structure but flexible in delivery, prioritizing conceptual clarity over methodological detail.

  ### 1. The Order of Ideas
  **Decision:** You will **raise the misconceptions as intuitive claims first**, then introduce the formal definition, then use the definition to dismantle the claims. Do not start with the formula $h^2 = V_G / V_P$.

  **Reasoning:**
  If you begin with the technical definition (variance ratios, population specificity), the audience will file it under "abstract math" and immediately overlay their existing intuition (that heritability means "genetic destiny") onto the new term. They will hear "variance due to genes" and translate it as "caused by genes."

  By starting with the **Intervention Paradox** (the claim your friend made: "High heritability means interventions won't work"), you activate their existing intuition. You let them sit with the tension of that claim. *Then*, when you introduce the definition, it arrives as the *solution* to the puzzle, not as a dry prerequisite. The definition becomes the tool that resolves the cognitive dissonance, which significantly increases retention.

  **Sequence:**
  1.  **The Hook (0–10 mins):** Present the "Friend's Claim" (High $h^2$ $\rightarrow$ No room for schools to improve IQ). Ask for a show of hands: Who thinks this is logically sound?
  2.  **The Definition (10–25 mins):** Introduce heritability strictly as a ratio of *variances* in a *specific population* at a *specific time*.
  3.  **The Resolution (25–40 mins):** Apply the definition to the Hook. Show why the Friend's Claim is a category error (Means vs. Variance).
  4.  **The Extension (40–45 mins):** Briefly address the Group Difference fallacy.
  5.  **The Check (45–50 mins):** The final comprehension question.

  ### 2. The Carrying Example
  **Decision:** Your single worked example is **The Secular Trend in Human Height**.

  **What it must contain:**
  *   Data showing that the heritability of height in developed nations is high (approx. 0.8).
  *   Data showing that average height in those same nations increased by 4–5 inches over the 20th century.
  *   An explicit attribution of that increase to nutrition and health (environment), not gene frequency changes.

  **What it must avoid:**
  *   Do not discuss *which* genes control height.
  *   Do not discuss individual variation (e.g., "Why is John taller than Jane?"). Keep the focus on the population mean shifting over time.

  **Why this example:**
  Height is the "perfect storm" for this lesson. Like IQ, it is highly polygenic and has high heritability estimates in adults. Unlike IQ, the environmental malleability is politically neutral and historically undeniable (the "secular trend"). It forces the audience to accept two facts simultaneously: (1) Differences between individuals are mostly genetic, and (2) Differences between generations are mostly environmental. This breaks the "Heritable = Fixed" link immediately.

  **Examples to Refuse:**
  *   **IQ:** **Do not use IQ as the teaching example.** It is the *subject* of the controversy, not the *tool* for resolving it. Using IQ triggers defensive motivated reasoning in a mixed audience. Use Height to teach the logic; only mention IQ at the very end as an application of that logic.
  *   **Twin Studies:** **Do not explain how heritability is estimated.** Do not discuss monozygotic vs. dizygotic correlations. This is a session on *interpretation*, not *estimation*. Explaining twin methods invites debates about the "Equal Environments Assumption," which is a methodological rabbit hole that will consume your 50 minutes and obscure the conceptual point.
  *   **PKU (Phenylketonuria):** **Avoid this.** While logically clean (100% genetic, 100% treatable), it is a monogenic disorder. Critics will dismiss it as "not a normal trait." Height is a normal, polygenic distribution, making the analogy to IQ much stronger.

  ### 3. The Misconception Map
  Here are the four specific misconceptions you must target, where to place them, and the exact formulation to use.

  **1. The Intervention Fallacy ("Heritable means unchangeable")**
  *   **When:** Address this during **The Resolution (25–40 mins)** using the Height example.
  *   **Formulation:** "Heritability describes the *variation* around the mean, not the *level* of the mean. You can shift the entire curve environmentally without changing the ratio of variance within the curve."
  *   **Why:** This directly answers your friend's claim about schools. Schools change the mean (achievement levels); heritability describes the spread (why students differ from each other).

  **2. The Individual Determinism Fallacy ("Heritability tells me how much of *my* trait is genetic")**
  *   **When:** Address this during **The Definition (10–25 mins)**.
  *   **Formulation:** "Heritability is a population statistic, not an individual score. It is meaningless to say '60% of John's height is genetic.' It means '60% of the *differences* between people in this room are associated with genetic differences.'"
  *   **Why:** Journalists and policy staffers consistently make this error. You must kill the idea that $h^2$ applies to a single person.

  **3. The Stability Fallacy ("Heritability is a constant property of the trait")**
  *   **When:** Address this during **The Definition (10–25 mins)** alongside the population caveat.
  *   **Formulation:** "Heritability is a property of a *population in an environment*, not a property of the *trait*. If you change the environment, you change the heritability."
  *   **Why:** This prevents them from citing a heritability estimate from 1990 as truth for 2024, or from one country as truth for another.

  **4. The Between-Group Fallacy ("High within-group heritability explains between-group differences")**
  *   **When:** Address this during **The Extension (40–45 mins)**.
  *   **Formulation:** "Knowing the variance *within* two fields of corn tells you nothing about why the average yield of Field A is higher than Field B. That could be entirely due to soil quality (environment), even if heritability within each field is 1.0."
  *   **Why:** This is the subtler, more dangerous inference (often used in racial/SES arguments). Use the "Two Fields" analogy here even if you used Height earlier; it's the clearest visual for group means.

  ### 4. The Boundary of the Session
  **Decision:** You must openly refuse to cover **Estimation Methods** and **Specific IQ Estimates**.

  **Statement to make out loud:**
  "In the next fifty minutes, we will not discuss *how* to calculate heritability (twin studies, GWAS, etc.), nor will we debate the specific heritability coefficient of IQ. Those are empirical questions for data. Today is about logic. Even if IQ heritability were 0.9 or 0.1, the logical relationship between heritability and intervention remains the same. We are fixing the lens, not measuring the object."

  **Reasoning:**
  If you allow the conversation to drift into "But what is the *real* heritability of IQ?", you lose the room. The rationalist friend's error is logical, not empirical. By bracketing the empirical number, you force the discussion onto the conceptual terrain where the error actually lives.

  ### 5. One Check
  **Decision:** Pose the **"Uniform Environment" Question**.

  **The Question:**
  "Imagine a trait with a heritability of 0.60 in a population. If we implement a policy that makes the environment perfectly identical for every single person in that population (eliminating all environmental variance), what happens to the heritability coefficient?"

  **The Answers:**
  *   **Shows Understanding:** "It goes to 1.0 (or 100%)."
      *   *Why:* This shows they understand heritability is a ratio of variances ($V_G / (V_G + V_E)$). If $V_E$ becomes 0, the ratio becomes 1. It proves they grasp that heritability depends on environmental variance.
  *   **Shows Misunderstanding:** "It stays 0.60" or "It goes to 0."
      *   *Why:* "Stays 0.60" means they think heritability is a stable property of the trait (Misconception 3). "Goes to 0" means they think heritability measures genetic *determination* rather than variance (Misconception 1 & 2).

  **Instruction:** Do not move on until at least 70% of the room gets this right. If they don't, you have not successfully taught the definition of variance components.
