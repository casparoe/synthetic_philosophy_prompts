  7.  **Final Polish:** Ensure tone is academic but accessible for a professor planning a unit. Highlight specific scenes (The Exochron demo, the Blue Gamma bankruptcy, the restore incident). Make sure to answer the prompt's specific question: "Where does it vindicate, where does it resist, and does it add anything new?"

      *   *Vindicates:* Substrate independence (robots, servers).
