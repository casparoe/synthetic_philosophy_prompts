      *   *The Platform Migration:* Blue Gamma goes bankrupt. Digients must move to a new OS. Some don't make it. They lose skills. (Challenges strict MR; the substrate *does* matter for continuity).
      *   *The Robot Bodies (Exochron):* Jax inhabits a physical robot. Ana says the robot is a peripheral. (Supports MR/Functionalism). *But* Jax struggles with physical physics vs. virtual physics. (Supports Embodiment).
