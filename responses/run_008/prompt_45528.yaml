  2. Standard models assume a fixed, coarse observation structure that cannot capture the granular data environments of modern digital platforms. This leaves open why inefficient herding persists when technology allows for deeper signal transmission and whether agents actively suppress that depth.
  3. I will model a sequential game where agents select actions and disclosure levels, solving for Bayesian Nash equilibria across varying signal granularities. Analytical derivation is chosen over agent-based simulation to establish general threshold conditions rather than context-specific numerical outcomes.
  4. A successful result identifies a specific capacity threshold where cascades break, distinguishing efficient learning from inefficient herding. Failure results if the equilibrium conditions remain computationally intractable or if richer information proves indistinguishable from noise in preventing cascades.
  5. The dissertation will prioritize the exogenous channel richness model to ensure tractability, deferring the complex endogenous disclosure game to future job market work. This scope manages risk while preserving the core theoretical contribution regarding information granularity.
