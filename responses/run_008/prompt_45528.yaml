  I returned to graduate school in economics after several years in product analytics at a large e-commerce marketplace, and a design decision my old team argued about has followed me into my dissertation. On our platform, buyers could see how many previous buyers had chosen each option but never why; I watched a mediocre product snowball on the strength of its early sales while a better one stalled, and I have come to suspect we were running a live information-cascade experiment. My half-formed idea is this: in the canonical herding models, cascades form because agents observe predecessors' actions but not their private signals, which suggests the phenomenon depends on a coarse communication channel rather than on any deep fact about rational inference. If so, it should be possible to say precisely how much richer the channel has to become — action alone, then action plus a stated confidence level, then a stated reason, then the raw signal — before rational herding collapses. And conversely, if disclosure is costly or voluntary, early movers may rationally reveal only their action, precisely so that followers herd behind them: richer channels get built and then go unused. Turn this into a dissertation proposal, compressed to the format our department's seed-grant competition requires: exactly five numbered points, each a sentence or two, with no introduction, conclusion, or any other text. Use the five points for (1) the question stated precisely, (2) why the existing treatments leave it open, (3) the method — what I would actually model or simulate, and why that rather than the obvious alternatives, (4) what would count as a result and what would count as the project failing, and (5) an honest assessment of what fits within a dissertation and what has to be cut. Don't include citations; I'll add those myself.
