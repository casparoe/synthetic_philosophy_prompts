  ### Scorecard

  | Candidate | Empirical Grounding | Compositionality | Belief/Meaning | Normativity | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Tarski-Style Truth Theory** | **Fail.** Assumes truth values are given; provides no method for deriving them from behavior. | **Pass.** Explicitly designed for this. | **Pass.** Distinguishes truth conditions from holding true. | **Pass.** Truth is normative. | **Formal tool, not an interpretation theory.** |
  | **Field-Linguist (Ideal)** | **Pass.** Defined by this constraint. | **Pass.** Assumes human cognitive capacity for structure. | **Pass.** Built into the "hold true" methodology. | **Pass.** Assumes rational agency. | **The Goal, not a specification.** |
  | **Distributional Learner (LLM)** | **Partial.** Trained on text (traces), not world-involving assent/dissent. | **Debatable.** Shows systematicity, but structural depth is contested. | **Fail.** Optimizes prediction (what is likely), conflating belief patterns with meaning. | **Fail.** Models statistical regularity, not correctness conditions. | **Simulacrum of an interpreter.** |

  ---

  ### Conclusion

  The dispute between your colleagues hinges on whether statistical coherence over a corpus counts as "interpretation." The engineers focus on **Empirical Grounding** (text is evidence) and **Charity** (coherence is optimization). The philosophers focus on **Normativity** and the **Belief/Meaning Distinction**.

  The requirement that does the most work excluding candidates—specifically excluding the distributional learner while preserving the core philosophical intuition of meaning—is the one that demands the theory account for *correctness* independent of *probability*. A model can predict the next token perfectly without understanding the conditions under which that token would be *wrong* in a normative sense, only that it is *unlikely*. This is the category error your philosopher friends are gesturing at.

  \answer{The Normativity Constraint}
