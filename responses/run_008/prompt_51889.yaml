answer: |-
  Here is a specification of the desiderata for a theory of meaning adequate for radical interpretation, analyzed through the lens of your dispute.

  ### Desiderata for a Theory of Meaning Adequate for Radical Interpretation

  1.  **Empirical Grounding (The Radical Constraint)**
      *   **Requirement:** The theory must be constructible and verifiable solely from non-semantic evidence (observable behavior in observable circumstances) without presupposing a shared language, dictionary, or prior semantic knowledge.
      *   **Motivation:** This defines the "radical" in radical interpretation. If the interpreter needs a dictionary or a prior grasp of the speaker's concepts, the regress of interpretation never bottoms out. It forces semantics to be naturalized.

  2.  **Compositionality (The Productivity Constraint)**
      *   **Requirement:** The meaning of complex expressions must be derived from the meanings of their parts and their mode of combination.
      *   **Motivation:** Finite evidence, infinite potential. An interpreter encounters novel sentences constantly. A lookup table of stimulus-meaning pairs cannot account for the ability to understand or produce sentences never before uttered.

  3.  **The Belief/Meaning Distinction (The Error Constraint)**
      *   **Requirement:** The theory must allow for the possibility that a speaker holds a sentence true while the sentence is false (or vice versa), without collapsing the meaning of the sentence into the speaker's current belief state.
      *   **Motivation:** Without this, interpretation is trivialized. If meaning *is* what the speaker holds true, speakers are infallible, and disagreement is impossible. Interpretation requires disentangling *what they mean* from *what they think is the case*.

  4.  **Publicity (The Intersubjectivity Constraint)**
      *   **Requirement:** The facts that determine meaning must be accessible to any suitably placed observer. There can be no essential reference to private mental states inaccessible to the interpreter.
      *   **Motivation:** Prevents the retreat into a private language. If meaning depended on private qualia or inaccessible intentions, radical interpretation would be impossible in principle, as the interpreter could never verify the theory.

  5.  **Context Sensitivity (The Indexical Constraint)**
      *   **Requirement:** The theory must account for expressions whose truth conditions vary with the context of utterance (e.g., "I," "here," "now") without treating them as ambiguous.
      *   **Motivation:** A significant portion of observable speech is indexical. A theory that treats "I am here" as a fixed proposition fails to capture its truth conditions across different speakers and times, grounding the language in the world.

  6.  **Dynamic Adaptability (The Passing Theory Constraint)**
      *   **Requirement:** The theory must allow for successful communication even when the speaker deviates from established conventions (malapropisms, slips, neologisms), provided the interpreter can adjust "on the fly."
      *   **Motivation:** Drawn from *A Nice Derangement of Epitaphs*. Speakers communicate successfully despite violating standing conventions. If meaning were rigidly tied to prior conventions, malapropisms would be unintelligible. The theory must distinguish between the *Prior Theory* (expectations) and the *Passing Theory* (actual interpretation).

  7.  **The Normativity Constraint**
      *   **Requirement:** The theory must specify conditions under which an utterance is *correct* or *incorrect*, not merely conditions under which it is *likely* or *expected*.
      *   **Motivation:** Meaning involves rules, not just regularities. A parrot or a thermostat exhibits regular behavior, but not meaningful speech. To interpret is to grasp the conditions under which a speaker *ought* to use a word, distinct from when they *do*.

  ---

  ### Non-Negotiable vs. Tarskian Prejudices

  **Non-Negotiable:**
  *   **Empirical Grounding:** Without this, it is not a theory of *interpretation*, but of grammar.
  *   **Belief/Meaning Distinction:** Without this, there is no content to interpret, only causal reflexes.
  *   **Normativity:** Without this, you have behavior, not meaning.

  **Tarskian Prejudices:**
  *   **Truth-Conditional Form:** Davidson argued meaning *is* truth conditions, but this is a theoretical choice. One could imagine a theory of meaning based on use-conditions or justification conditions that still satisfies Empirical Grounding and Publicity.
  *   **Logical Form Mirroring Surface Grammar:** The assumption that the theory must assign quantifiers and variables to natural language in a way that mirrors first-order logic is a methodological convenience, not a requirement of interpretation itself.

  ---

  ### Inconsistent Subsets (The Impossibility Results)

  There are two critical tensions where the desiderata may pull apart, suggesting that a perfect specification is impossible.

  1.  **Determinacy vs. Empirical Grounding (The Quinean Problem):**
      You want a theory that yields *the* meaning (Determinacy). However, given the **Empirical Grounding** constraint (finite behavioral evidence), multiple incompatible theories can fit the data equally well (Indeterminacy of Translation). If you insist on Determinacy, you violate Empirical Grounding (by smuggling in analytic hypotheses). If you insist on Empirical Grounding, you must accept that meaning is indeterminate.
  2.  **Compositionality vs. Dynamic Adaptability (The Convention Problem):**
      **Compositionality** relies on stable conventions (Prior Theory) to generate meaning from structure. **Dynamic Adaptability** (from the malapropism case) suggests that successful communication relies on the *Passing Theory*, which can override conventions. If the Passing Theory is what determines meaning, then Compositionality is merely a heuristic, not a constitutive rule. If Compositionality is constitutive, malapropisms should fail. Davidson's distinction attempts to patch this, but it leaves the status of "convention" unstable.

  **Regarding your hypothesis:** You are correct that **Charity** and **Evidence** are in tension. Charity is required to solve the Belief/Meaning distinction (you must assume they are mostly right to figure out what they mean), but if Charity is too strong, it violates Empirical Grounding by imposing the interpreter's ontology on the speaker. It risks making interpretation a projection rather than a discovery.

