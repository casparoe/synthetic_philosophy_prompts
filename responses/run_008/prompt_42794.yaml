answer: |-
  **Project Title:** The Social Geometry of Supererogation: A Contrastivist Account of Moral Status

  **Principal Investigator:** [Your Name]
  **Department:** Philosophy
  **Request Amount:** $3,000 (Summer Stipend)
  **Duration:** 3 Months (June – August 2024)

  **1. Research Question and Project Summary**
  Standard deontic logic treats moral categories as intrinsic to the act-type or relative to the individual agent's capabilities. An act is obligatory, permissible, or supererogatory based on the cost to the agent and the benefit to the recipient, independent of the behavioral baseline of the surrounding community. This project challenges that assumption. I propose to investigate the **Contrastivist Hypothesis**: the claim that supererogatory status is not a fixed property of an act-agent pair, but a contrastive status dependent on the prevalence of that act within a relevant reference group.

  Just as "tall" is a relative predicate (one is tall *relative to a population*), I argue that "supererogatory" may function similarly. If this hypothesis holds, it resolves a persistent tension in normative ethics: the conflict between high-demandingness theories (e.g., Singer-style utilitarianism) which classify high-cost beneficence as obligatory, and common-sense morality which classifies it as heroic. If moral status migrates based on community baseline, an act can be obligatory in a high-compliance world and supererogatory in a low-compliance world without the act itself changing. This project will rigorously test this hypothesis through constructed case comparisons and analyze its implications for the mirror category of "suberogation" (permissible but blameworthy acts).

  **2. Motivation and Theoretical Gap**
  The impetus for this inquiry arises from the phenomenological dissonance experienced in high-cost beneficence cases (e.g., living organ donation). Agents in these positions are frequently labeled "heroic" by institutions and peers, implying the act is beyond duty. However, when subjected to standard "drowning child" reasoning, the same acts appear obligatory to many students and theorists. Standard accounts of supererogation (e.g., Heyd, supererogation as optional + morally good) fail to explain why the *same* act attracts different deontic labels in different contexts.

  Current literature treats supererogation as agent-relative (based on sacrifice thresholds) but socially invariant. This leaves open the possibility that our intuitions are tracking a variable the literature ignores: the behavioral distribution of the peer group. If supererogation is contrastive, the standard "saints and heroes" framing is category-mistaken. It treats a relational property as an intrinsic one. This project aims to move the debate from "What is the cost threshold for duty?" to "How does the social baseline constitute the threshold?"

  **3. Methodology and Work Plan**
  Over the three-month summer period, I will construct a series of matched philosophical vignettes and analyze the intuitive judgments they provoke. The core method is *ceteris paribus* variation of social prevalence.

  *   **Month 1: Case Construction.** I will develop pairs of scenarios where the cost to the agent and the benefit to the recipient remain identical, but the prevalence of the act differs.
      *   *Example:* Agent X donates a kidney in World A (where <0.1% of eligible people donate) vs. World B (where 90% of eligible people donate due to a cultural shift, not coercion).
      *   *Variable:* Does the deontic status (Obligatory vs. Supererogatory) shift between World A and World B?
      *   *Extension:* I will apply the same logic to suberogation (e.g., refusing to donate blood in a crisis vs. in normal times).
  *   **Month 2: Objection Testing.** I will stress-test the Contrastivist Hypothesis against two primary objections:
      1.  *The Expectation Objection:* Is the shift in judgment merely about social praise/blame rather than genuine moral obligation? I will distinguish between *status* (what is owed) and *reaction* (what is praised).
      2.  *The "Ought Implies Can" Objection:* Does high prevalence simply lower the perceived cost (making it easier), thereby changing the obligation via standard agent-relative metrics? I will design cases where prevalence is high but individual cost remains objectively high to isolate the variable.
  *   **Month 3: Drafting.** I will synthesize the findings into a draft paper suitable for submission to a journal such as *Ethics* or *Philosophical Studies*. The goal is a precise argument defining the conditions under which moral categories are contrastive.

  **4. Significance**
  If successful, this project offers a dissolution to the demandingness objection. It suggests that utilitarian obligations and common-sense supererogation are not contradictory but describe the same act-types at different points on a social distribution curve. Furthermore, it provides a new framework for understanding moral progress: moral change may not just be getting people to do the "right" thing, but shifting the deontic status of the act itself from supererogatory to obligatory.

  **5. Risk Assessment and Failure Conditions**
  This is a high-risk conceptual project. I anticipate three specific failure modes:
  1.  **Collapse into Predictability:** It may turn out that intuitions shift not because moral *status* changes, but because prevalence acts as an epistemic cue for *difficulty*. If World B cases are intuitively read as "easier" simply because they are common, the contrastivist claim reduces to standard cost-benefit analysis. I will count this as a failure of the strong contrastivist thesis.
  2.  **Praise vs. Duty:** The investigation may reveal that prevalence only affects *praise-worthiness* (aesthetic/social) while *obligation* remains fixed. If the act is obligatory in both World A and World B, but only praised in World A, the contrastivist hypothesis regarding deontic status is false.
  3.  **Incoherence:** It is possible that "contrastive obligation" is conceptually incoherent (i.e., obligation must be universalizable in a way that precludes population dependence). If I cannot formulate a coherent logic for contrastive duty, the project will conclude with a negative result defending the invariance of supererogation.

  Any of these outcomes would be philosophically valuable, as they would clarify the boundaries of supererogation. However, for the purposes of the grant, a "successful" outcome requires establishing that prevalence *can* shift deontic category, not just social reaction.

  **6. Budget Justification**
  The requested $3,000 will serve as a summer stipend to allow for full-time research without teaching obligations. This buy-out time is essential for the intensive case-construction and objection-testing phase. No travel or equipment costs are anticipated.

  **7. Conclusion**
  This project leverages a specific gap in the taxonomy of moral action. By treating supererogation as a potentially contrastive predicate, we can better understand the relationship between individual duty and collective behavior. The summer funding will allow me to move this from a half-formed suspicion to a rigorous argument.
