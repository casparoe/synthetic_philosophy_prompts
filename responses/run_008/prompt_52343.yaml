      *   *Wait, a better analogy:* In neuro, we have the hardware but not the schematic. In MI, we have the schematic but not the *ontology*.

  9.  **Refining the "Representation" point:**
      *   The user notes neuroscientists never pinned down "representation."
      *   MI folks often assume a linear probe *finds* a representation. But linear probes find *linearly decodable information*. Is that a representation?
      *   *Key insight:* Superposition suggests representations are not local. They are distributed across subspaces. This challenges the "grandmother cell" realism even harder than biology did.

