prompt: |-
  I'm a TA for a big intro ethics course and next week I have to run one fifty-minute section on Taurek's "should the numbers count" argument — the one where he asks whether five people in danger have a stronger claim on your help than one person, just because there are five. My section is mostly second-years, a lot of them pre-med, and they're going to walk in thinking this is trivial: it's triage, you save the five, anyone who hesitates is just bad at counting. We did trolley cases two weeks ago so their intuitions are already trolley-shaped. I don't want you to explain Taurek to me — I want a plan for the section itself.

  Here's what I want you to work out. First, the order: my instinct is that the separateness-of-persons idea — that there's no single big pot of "goodness" that suffering gets poured into, each person's loss is had by that person and nobody else — has to be on the table before the question even sounds like a question, but maybe it lands better coming out of the discussion instead of going into it, and I can't tell. Second, the carrying example: I'm tempted to use Taurek's own setup (the one person he cares about on one side, the five strangers on the other) but I worry it's too flat — students will just file it under "obviously you're allowed to save your friend" and miss the part where the argument is supposed to work even when it's five strangers vs. one stranger. Should I keep his case and fix the reading of it, or build a fresh one (my co-TA keeps pushing a hospital triage scenario, I worry it just re-imports the "save the five" answer by framing). Third, the misconceptions, and I'd like to be told the order students will actually hit them in: that Taurek is just saying friendship licenses partiality, that the coin flip is a general principle about lotteries so he'd be fine giving five people each a one-in-five chance instead of saving one for sure, that the whole thing is really about doing vs. allowing or about who's causally responsible for deaths, and that agreeing with Taurek commits you to saying numbers never matter in any tradeoff, even risk-vs-certainty ones in ordinary rescues.

  Also tell me exactly where in the sequence each of those needs to be headed off rather than just listed, one question I can end on that would show me whether they actually got the core claim (something about whether the view survives transplanting from the named-friend case to the stranger case, I think, but I'm not sure how to phrase it so it doesn't give away the answer), and what I should openly refuse to get into at this level — I'm guessing anything Kamm-flavored about procedures and chances, and definitely population ethics — so it doesn't eat the last fifteen minutes. If it matters, I've got a whiteboard and no slides.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for an intro ethics course.
      *   **Topic:** John Taurek's "Should the Numbers Count?" (specifically the argument against aggregating claims).
      *   **Audience:** Sophomores (2nd years), many pre-med.
      *   **Context:** 50-minute section. Previous exposure to Trolley cases (utilitarian intuitions are strong/settled).
      *   **Goal:** A concrete lesson plan (order, examples, misconception management, closing question, scope boundaries).
      *   **Constraints:** No slides, whiteboard only. Do *not* explain Taurek to the TA (assume knowledge). Focus on pedagogy and flow.
      *   **Specific Concerns:**
          *   Order of "Separateness of Persons" (intro vs. conclusion).
          *   The Example (Taurek's friend vs. strangers vs. hospital triage).
          *   Misconceptions (friendship partiality, coin flip mechanics, doing/allowing, numbers *never* matter).
          *   Closing Question (tests understanding without giving it away).
          *   Scope Boundaries (what to avoid: Kamm, population ethics).

  2.  **Deconstruct the Challenges:**
      *   *Pre-med Intuition:* Triage logic is deeply ingrained. "Save the most lives" is a professional norm. Taurek challenges the *moral foundation* of that norm, not just the application.
      *   *Trolley Fatigue:* They've done trolleys. They think they know the answer (utilitarianism wins). Taurek is supposed to unsettle this.
      *   *Separateness of Persons:* This is the philosophical heavy lifter. If introduced too early as a lecture, it's abstract. If introduced too late, it feels like an excuse. It needs to emerge from the tension of the case.
      *   *The Friend Case:* Taurek uses a friend to motivate the "no aggregation" idea, but the core argument applies to strangers. Students often dismiss the whole thing as "special obligations."
      *   *The Coin Flip:* Students often misunderstand the probabilistic solution (1/6 chance for each vs. 1/2 chance for each side).

  3.  **Drafting the Plan - Section by Section:**

      *   **Timing:** 50 minutes is tight.
          *   Intro/Warm-up: 5 mins.
          *   The Case (The Hook): 10 mins.
          *   The Argument/Objections (The Meat): 20 mins.
          *   Separateness of Persons (The Theory): 10 mins.
          *   Wrap-up/Exit Ticket: 5 mins.

      *   **Decision 1: Order of "Separateness of Persons"**
          *   *TA's Instinct:* Put it early.
          *   *My Recommendation:* Put it *after* the intuition pump fails. If you tell them "people are separate" first, they nod and forget. If they struggle to explain *why* saving 5 isn't obviously better, then you give them the tool ("Separateness of Persons") to articulate that struggle. It functions as the *explanation* for their discomfort, not the premise.

      *   **Decision 2: The Example**
          *   *Option A (Taurek's Friend):* Risk: Students say "Of course save David, he's your friend." Misses the point.
          *   *Option B (Hospital Triage):* Risk: Pre-meds will default to protocol/utilitarianism immediately. "Save the 5" becomes a professional duty, obscuring the moral question.
          *   *Option C (Modified Taurek/Strangers):* Best path. Start with the Friend case to get the "partiality" intuition out of the way, then *immediately* pivot to the Stranger case to show the argument holds.
          *   *Strategy:* Use Taurek's "David" case to break the utilitarian ice, then strip away David to reveal the structural claim.

      *   **Decision 3: Misconceptions & Order of Appearance**
          *   1. *Friendship/Partiality:* Will come up immediately in the David case. Needs to be acknowledged then bracketed.
          *   2. *Coin Flip/Probability:* Will come up when discussing the "fairness" solution. Needs clarification (equal chance per *person*, not per *group*).
          *   3. *Doing/Allowing:* Might come up if they try to distinguish action vs. inaction. Needs to be shut down (Taurek's point is about claims, not causation).
          *   4. *Numbers Never Matter:* The "reductio" worry. Needs to be addressed near the end (risk vs. certainty).

      *   **Decision 4: Closing Question**
          *   Needs to test if they see the link between the Friend case and the Stranger case.
          *   Draft: "If you save David because he's David, is that the same reason you'd save 1 stranger over 5?" -> Too leading.
          *   Better: "If we remove David from the story, what exactly is lost that made saving the one permissible?"

      *   **Decision 5: Scope Boundaries**
          *   Avoid Kamm (Doctrine of Relevant Parts, etc.) - too technical.
          *   Avoid Population Ethics (Non-Identity Problem) - too big.
          *   Avoid Rule Utilitarianism - distracts from the core aggregation claim.

  4.  **Refining the Flow (Whiteboard Strategy):**
      *   Need visual anchors.
      *   Left side: The Cases (David vs. 5, 1 Stranger vs. 5 Strangers).
      *   Middle: The Arguments (Aggregation vs. No Aggregation).
      *   Right side: Misconceptions/Parking Lot.

  5.  **Addressing the Pre-Med Factor:**
      *   Acknowledge their professional intuition (triage is practical/protocol), but distinguish *moral philosophy* from *medical protocol*. This validates them without letting protocol answer the哲学 question.

  6.  **Developing the Specific Steps (Iterative refinement):**
      *   *Intro:* Don't lecture. Ask a question. "Who saves the 5?" Show of hands.
      *   *The Pivot:* Introduce David. "Now who saves the 5?" Hands drop.
      *   *The Bridge:* Why did the hand drop? Is it *just* friendship? Taurek says no.
      *   *The Core:* The "Loss" argument. Each of the 5 loses a life. The 1 loses a life. No one loses "5 lives."
      *   *The Coin:* How to decide? Equal chance per person.
      *   *The Theory:* Separateness of Persons.
      *   *The Check:* Closing question.

  7.  **Final Review against Constraints:**
      *   50 mins? Yes, tight but doable.
      *   Whiteboard only? Yes, plan relies on board work.
      *   Misconceptions ordered? Yes, mapped to the flow.
      *   Scope boundaries defined? Yes.

  8.  **Writing the Response:** (Focusing on tone: professional, peer-to-peer, actionable). *Self-Correction during drafting:* Make sure I explicitly tell the TA *when* to head off the misconceptions, not just *what* they are. The prompt asks for "exactly where in the sequence each of those needs to be headed off."

      *   *Refining the "Separateness" timing:* I need to be firm here. If they teach it first, it's dogma. If they teach it last, it's the key. I'll argue for "Mid-to-Late," emerging from the difficulty of the argument.
      *   *Refining the Example:* I'll suggest a two-stage case. Start with David (to validate intuition), then strip David (to test the principle). This solves the "flatness" worry.
      *   *Refining the Misconceptions:* I will map them to specific minutes in the plan.

  9.  **Final Polish:** Check the closing question. It needs to be sharp. "If the single person is a stranger, does the 'separateness' reason still hold, or did it rely on your special tie to David?" -> Actually, better: "Taurek says the reason you save David isn't friendship, but that no one has a stronger claim. If it's 1 stranger vs 5 strangers, does the 'no stronger claim' logic survive without the friendship hook?"

      *Wait, let's make it more Socratic.* "If you agree you can save David, but you also agree you must save the 5 strangers, what principle distinguishes these two choices?" (Forces them to articulate aggregation).
      *Actually, the prompt asks for a question to see if they got the core claim.*
      *Core Claim:* Numbers don't aggregate claims.
      *Question:* "If Taurek is right that we shouldn't aggregate claims, how do we decide between 1 stranger and 5 strangers, and why is that different from standard triage?"
      *Let's go with the prompt's suggestion:* "Whether the view survives transplanting from the named-friend case to the stranger case."
      *Draft:* "Taurek argues you can save David not because he's your friend, but because the five don't have a stronger claim. If you remove the friendship, does the 'no stronger claim' argument stand on its own, or did it need the friendship to work?"

      *Okay, ready to write.*
answer: |-
  Here is a 50-minute section plan designed to disrupt the "pre-med triage intuition" without getting bogged down in technical meta-ethics. It uses the whiteboard to track the shift from intuition to principle.

  ### **The Whiteboard Setup**
  Divide the board into three columns. Do not write on them yet.
  1.  **Left:** The Cases (David vs. 5 / Stranger vs. 5)
  2.  **Middle:** The Logic (Aggregation vs. Individual Loss)
  3.  **Right:** Parking Lot (Misconceptions/Off-Topic)

  ---

  ### **0:00–0:05 | The Hook: Break the Triage Reflex**
  **Goal:** Expose the utilitarian default and introduce the friction.
  **Action:** Do not lecture. Ask for a show of hands.

  1.  **Write on Left:** "Scenario A: 5 Strangers (dying) vs. 1 Stranger (dying). You can save one group."
  2.  **Ask:** "How many save the 5?" (Expect nearly 100%).
  3.  **Ask:** "Why?" (Expect: "More lives," "Greater good," "Triage.")
  4.  **Write on Left:** "Scenario B: David (your best friend, dying) vs. 5 Strangers (dying). You can save one group."
  5.  **Ask:** "How many save the 5 now?" (Hands will drop).
  6.  **Ask:** "What changed? The numbers didn't change. The deaths didn't change. What changed?"

  **Pedagogical Note:** You are validating their intuition about friendship to get them in the door, but you are isolating the *variable*. The numbers are constant; the relationship changed. This sets up Taurek's surprise.

  ---

  ### **0:05–0:15 | The Pivot: Stripping the Friendship**
  **Goal:** Move from "Special Obligations" to "Claims."
  **Action:** Challenge the assumption that Scenario B is *only* about friendship.

  1.  **The Taurek Claim:** Tell them: "Taurek argues that even in Scenario B, you don't save David *because* he's your friend. You save him because the five strangers **do not have a stronger moral claim** on you than David does."
  2.  **The Pivot:** "Now, imagine Scenario C: 1 Stranger vs. 5 Strangers. But you accept Taurek's logic from Scenario B. Do the 5 have a stronger claim?"
  3.  **Discussion:** Let them wrestle. The pre-meds will fight hard here.
      *   *Student:* "But 5 deaths is worse."
      *   *TA Response:* "Worse for whom? Is there a 'world' that feels pain? Or is it 5 individuals feeling their own pain?"

  **Where to head off Misconception #1 (Friendship Partiality):**
  *   **When:** Right now (0:10 mark).
  *   **How:** If a student says, "Obviously you save David because he's your friend, but you save the 5 in Scenario A," stop them.
  *   **Say:** "Taurek agrees you *can* save David. But he says the *reason* isn't friendship. He says the reason is that aggregation is false. If aggregation is false in the David case, why is it true in the Stranger case? We need to find a principle that covers both, or admit they are different."
  *   **Board:** Write "Friendship?" in the Parking Lot. Circle it. Tell them you will return to it only to dismiss it as the *core* argument.

  ---

  ### **0:15–0:30 | The Core Argument: Loss and Claims**
  **Goal:** Articulate the "Separateness of Persons" without using the jargon yet.
  **Action:** Use the Middle Column.

  1.  **The Aggregation View (Utilitarian):** Write "5 Losses > 1 Loss." Explain that this treats suffering like a liquid poured into a bucket. The bucket is fuller with 5.
  2.  **The Taurek View:** Write "1 Loss vs. 1 Loss vs. 1 Loss..."
      *   **Key Phrase:** "To each of the five, the loss is their own life. To the one, the loss is his life. No one loses 'five lives'."
  3.  **The Mechanism:** If no one has a stronger claim, how do you decide?
      *   **Introduce the Coin Flip:** Taurek suggests giving each *person* an equal chance.
      *   **Math:** 1 person = 1/2 chance (if groups are treated as units). Taurek says 1 person = 1/6 chance (if individuals are units).
      *   **Wait, correction:** In the 1 vs 5 case, Taurek argues for a coin flip between the *sides* (1/2 chance for the one, 1/2 chance for the group of five) OR giving each individual an equal chance (1/6 each). *Clarification for TA:* Taurek actually suggests tossing a coin to decide between the groups (1/2 chance for the one, 1/2 for the five) because he rejects the idea that the five have more weight. He does *not* necessarily advocate for a 1/6 lottery in the final text, but rather that the one person's claim is not outweighed. However, the "equal chance per person" interpretation is the common pedagogical tool to show the math of non-aggregation.
      *   **Simplify for Section:** "If claims don't aggregate, the single person's claim is equal to *each* of the five. So why does the group win? Taurek says: Flip a coin between the two options. Give the one person a 50% chance."

  **Where to head off Misconception #2 (Coin Flip Mechanics):**
  *   **When:** 0:25 mark, when discussing the decision procedure.
  *   **How:** Students will think Taurek wants a 1-in-6 lottery for everyone.
  *   **Say:** "Taurek isn't trying to maximize fairness across the population. He's saying the single person shouldn't be *outvoted*. A coin flip gives the one person a 50% chance of survival. Saving the five gives the one person a 0% chance. The coin flip respects the single person's equal claim."

  **Where to head off Misconception #3 (Doing/Allowing):**
  *   **When:** If a student says, "But if you walk away from the five, you're letting them die."
  *   **How:** Shut this down quickly.
  *   **Say:** "Taurek's argument works even if you are causally responsible for both groups. This isn't about action vs. inaction. It's about whose claim is stronger. Focus on the *claim*, not the *cause*."
  *   **Board:** Write "Causation?" in Parking Lot. Cross it out.

  ---

  ### **0:30–0:40 | The Theory: Separateness of Persons**
  **Goal:** Name the philosophical engine.
  **Action:** Now you introduce the jargon, because they feel the need for it.

  1.  **Write on Middle:** "The Separateness of Persons."
  2.  **Explain:** "Utilitarianism treats society as a super-person. It sums up gains and losses. Taurek says: There is no super-person. There are only individuals. You cannot sacrifice One for Five just because the math works, because the One does not experience the Five's survival."
  3.  **Why this order?** If you started with this, it's abstract dogma. Now, it's the solution to the puzzle they just struggled with.

  **Where to head off Misconception #4 (Numbers Never Matter):**
  *   **When:** 0:35 mark. A student will ask: "So if 1,000 people need a aspirin and 1 person needs a life-saving drug, we flip a coin?"
  *   **How:** Distinguish *claims* from *interests*.
  *   **Say:** "Taurek is talking about life-and-death claims of equal magnitude. If the stakes are different (aspirin vs. life), the claims are different. Also, Taurek allows that numbers might matter for *risk* assessment or resource allocation, but not for overriding a fundamental right to a chance of survival. Don't let the reductio ad absurdum distract you from the core case: equal stakes, life or death."
  *   **Board:** Write "Different Stakes?" in Parking Lot. Note: "Out of scope for today."

  ---

  ### **0:40–0:45 | Scope Boundaries (What to Refuse)**
  **Goal:** Protect the clock.
  **Action:** Be explicit about what you are *not* doing.

  1.  **Kamm/Procedure:** If they ask about "Doctrine of Relevant Parts" or complex procedural justice, say: "That's Frances Kamm's response to Taurek. It's brilliant, but it's next-level meta-ethics. Today is just about whether the numbers count in the first place."
  2.  **Population Ethics:** If they ask about future generations or creating people, say: "That changes the 'separateness' premise. We are dealing with existing claimants today."
  3.  **Medical Protocol:** If pre-meds say, "But hospital policy says save the five," say: "Policy is about liability and public trust. Ethics is about moral truth. They might diverge. We are doing ethics."

  ---

  ### **0:45–0:50 | The Closing Question**
  **Goal:** Test if they understand the *source* of the permission to save the one.
  **Action:** Write this on the board. Give them 2 minutes to think/write, then ask for 2-3 responses.

  **The Question:**
  > "Taurek says you can save David (your friend) not because of friendship, but because the five strangers lack a stronger claim. If we replace David with a **Stranger**, does Taurek's argument collapse, or does it hold? **What specific premise makes the Stranger case work if the Friendship premise is removed?**"

  **What you are looking for:**
  *   **Bad Answer:** "It collapses because you don't care about strangers." (Misses the point).
  *   **Bad Answer:** "It holds because numbers never matter." (Too vague).
  *   **Good Answer:** "It holds because the *separateness of persons* still applies. The 5 strangers still don't share a collective loss. The single stranger still loses 100% of their life. The lack of friendship doesn't change the structure of the loss."

  ---

  ### **Summary of Misconception Management**

  | Misconception | When it hits | How to head it off |
  | :--- | :--- | :--- |
  | **1. Friendship Partiality** | **0:10** (Scenario B) | Acknowledge it, then bracket it. "Taurek says friendship isn't the *reason*, it's just where we notice the intuition." |
  | **2. Coin Flip Mechanics** | **0:25** (Decision Procedure) | Clarify: It's about giving the one person a 50% chance, not maximizing individual probability across the group. |
  | **3. Doing vs. Allowing** | **0:30** (Objections) | Explicitly state: "This applies even if you caused the danger. It's about claims, not causation." Put in Parking Lot. |
  | **4. Numbers Never Matter** | **0:35** (Reductio) | Limit scope: "Equal stakes, life/death only. Don't extend to aspirin vs. life yet." Put in Parking Lot. |

  ### **Final Advice for the TA**
  *   **Watch the Pre-Meds:** They will try to turn this into a policy debate ("But in the ER..."). Gently remind them: "In the ER, you are an agent of the hospital. In this thought experiment, you are a moral agent. What does morality require, distinct from protocol?"
  *   **Silence is Okay:** When you ask "What changed?" between Scenario A and B, let the silence sit. They need to feel the tension before you give them Taurek's resolution.
  *   **The Board is Your Script:** If you feel lost, look at the columns. Left = Cases, Middle = Arguments, Right = Distractions. If the discussion goes to the Right, point to the board and bring it back to the Middle.
