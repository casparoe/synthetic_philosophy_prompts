      *   *Ill-posed:* Maybe "ontological structure" is nonsense (Carnapian external questions).
      *   *Hard:* Maybe it's a fundamental clash of philosophical temperaments (naturalist metaphysics vs. conceptual/pragmatic analysis).
      *   *Diagnosis:* It's likely a clash of *starting points* (frameworks) rather than a solvable puzzle within a shared framework. This makes it "hard" in a way that resembles paradigm shifts rather than puzzle-solving.

