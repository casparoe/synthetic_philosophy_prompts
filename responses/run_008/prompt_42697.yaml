      *   **Specific Questions:**
          1.  Is the meta-dispute verbal (as hypothesized) or substantive (about eligibility constraints)?
          2.  Is Sider's appeal to theoretical virtues (joint-carving) doing real work or just criteria deflationists accept?
          3.  Does the stalemate imply the question is ill-posed or just hard?
          4.  What counts as progress?
