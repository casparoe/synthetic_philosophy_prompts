      *   *Weaknesses:* Sider explicitly argues against this. He claims the deflationist *must* engage with the notion of structure to make their point about eligibility. If the deflationist says "all meanings are eligible," they are making a claim about the *structure of semantic space*, which Sider argues is constrained by the *structure of reality*.
      *   *Nuance:* The hypothesis is a version of the "different projects" objection (e.g., Chalmers' verbal disputes). But Sider's *Writing the Book of the World* is specifically designed to block this move by arguing that *structure* is the prerequisite for *meaning*.
      *   *Verdict:* The hypothesis is plausible but likely too charitable to the deflationist. It assumes the deflationist can talk about "eligibility" without committing to "structure." Sider says you can't. The real fight is about whether "structure" is a coherent/indispensable notion.

  3.  **Analyze the Role of Theoretical Virtues (Joint-Carving):**
      *   *Sider's View:* Joint-carving isn't just simplicity; it's about *reference magnetism*. It's not just that a theory is nicer; it's that the world *makes* certain terms refer.
      *   *Deflationist View:* Theoretical virtues are pragmatic. We choose languages that work. There is no "worldly structure" backing them up.
      *   *Diagnosis:* This is the crux. Is "joint-carving" a substantive metaphysical posit or a methodological heuristic? If the former, it's substantive. If the latter, deflationists can co-opt it. Sider insists it's the former. The stalemate exists because they disagree on the *status* of the virtues, not just the virtues themselves.

