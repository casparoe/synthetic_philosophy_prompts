answer: |-
  Here is a complete lesson plan designed for your 75-minute session. It is built to generate the friction you need without requiring you to lecture until the very end.

  # Lesson Plan: The Token Referendum
  **Topic:** The Ethics of Vote-Selling (Consequentialism vs. Corruption/Semiotic Objections)
  **Time:** 75 Minutes
  **Class Size:** 25 Students
  **Materials:** 50 small slips of paper ("Vote Cards"), 100 paper slips ("Tokens"), a box for ballots.

  ---

  ## Part 1: Setup & Phase 1 (25 Minutes)

  ### 1. The Stakes (5 mins)
  Tell the class you are going to distribute 100 "Class Tokens." These tokens have no grade value (to avoid academic integrity issues), but at the end of class, they can be redeemed for a trivial prize (e.g., first choice of seating next week, a piece of candy, or simply "bragging rights" for the syllabus).
  *   **The Proposal:** "The Inequality Measure."
      *   If passed: 5 students (randomly selected by lot *after* the vote) get 15 tokens each. The remaining 20 students get 0 tokens.
      *   If failed: Everyone gets 2 tokens.
  *   **The Norm:** "Civic Duty." Explain that in this phase, voting is a civic act. You are asked to vote for what you believe is *best for the class community*, not just for yourself.

  ### 2. Phase 1 Execution (10 mins)
  *   Hand out one **Vote Card** to each student.
  *   Ask them to write "Yes" or "No" secretly.
  *   Collect ballots in the box. Count them publicly.
  *   **Predictable Outcome:** The measure will almost certainly fail (20 people vs. 5).
  *   **Announce Result:** "The measure failed. Everyone gets 2 tokens." Distribute the 2 tokens.

  ### 3. Phase 1 Micro-Debrief (10 mins)
  Ask: *Why did it fail?*
  Students will say: "It's unfair," "Most people lose," "It's better if we all get something."
  *Instructor Note:* Do not label these arguments yet. Just write key phrases on the left side of the board (e.g., "Unfair," "Majority loses," "Better outcome").

  ---

  ## Part 2: Phase 2 – The Market (25 Minutes)

  ### 1. The Rule Change (5 mins)
  Tell the class you are resetting the game. The same "Inequality Measure" is on the table. The pot is the same (75 tokens for winners, 0 for losers).
  *   **The New Norm:** "Property Rights." Tell them: "Your vote is now your private property. You own it. You may cast it, or you may sell it."
  *   **The Mechanism:** Designate 5 students as "The Bloc" (the potential winners). Give them a budget of 40 tokens (taken from the instructor, not the class pot).
  *   **The Rule:** The Bloc can offer tokens to other students in exchange for their Vote Card. If a student sells their vote, they must hand their Vote Card to the Bloc member, who then casts it as "Yes."
  *   **Constraint:** Transactions must be public (to increase the "yuck" factor). A seller must stand up and say, "I am selling my vote to [Name] for [X] tokens."

  ### 2. Phase 2 Execution (15 mins)
  *   Allow 5 minutes for trading/negotiation.
  *   **Predictable Outcome:** The Bloc will easily buy enough votes to pass the measure. They only need 8 votes (to make 13 total). They have 40 tokens; offering 5 tokens per vote is a no-brainer for students who otherwise get 0.
  *   **The Vote:** The Bloc casts the purchased votes. The measure passes.
  *   **Distribution:** The 5 winners get 15 tokens. The vote-sellers keep their payment. The "holdouts" (those who refused to sell and didn't win) get 0.

  ### 3. Phase 2 Micro-Debrief (5 mins)
  Ask: *How did that feel?*
  Expect heat. Some will feel clever (sellers/winners). Many will feel angry (holdouts).
  Write their reactions on the **right side** of the board. Do not organize them yet. Just capture the raw quotes.

  ---

  ## Part 3: The Grand Debrief (25 Minutes)

  ### 1. Sorting the Complaints (15 mins)
  Draw a line down the center of the board. Label the left column **"Outcomes & Fairness"** and the right column **"Meaning & Integrity."**

  Ask the students to look at the quotes generated in Phase 2. Ask them to sort their own complaints into the two columns. Guide them with questions:

  *   **Prompt for Column 1 (Consequentialist):** "Did anyone complain that the *result* was worse? That the wrong people won? That the tokens ended up in the wrong hands?"
      *   *Target concepts:* Inequality, efficiency, aggregate welfare, skewing power.
      *   *Philosophical Label:* **Consequentialist/Instrumental Objection.** (It's wrong because of what it *causes*).

  *   **Prompt for Column 2 (Corruption/Semiotic):** "Did anyone feel uncomfortable even if they got paid? Did anyone feel the *act* of voting changed? Did it feel like bribery, even though it was allowed? Does a bought vote 'count' the same as an earned vote?"
      *   *Target concepts:* Degradation, commodification, civic duty, "it feels sleazy," "voting isn't a product."
      *   *Philosophical Label:* **Deontological/Semiotic Objection.** (It's wrong because of what it *is*).

  ### 2. Synthesizing the Distinction (10 mins)
  Explain that this is the exact deadlock in the vote-selling debate.
  *   **Your Friend's View:** If we could guarantee that selling votes led to *better* policies (e.g., only informed people sell to experts), the Consequentialist objection vanishes.
  *   **Your View:** Even if the policies are perfect, the Semiotic objection remains. Voting is a civic ritual; putting a price tag on it corrupts the meaning of the ritual, regardless of the policy outcome.

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. Market Failure (No one sells).**
  *   *Why:* Students are too shy or suspicious of the "trivial prize."
  *   *Fix:* Pre-game the market. Before Phase 2 starts, whisper to two outgoing students: "If you sell your vote, I'll make sure you get a good deal." Or, increase the "Bloc's" budget significantly so the offer is irresistible (e.g., 10 tokens per vote).
  *   *Backup:* If no one sells, *you* (the instructor) act as the buyer. "I will pay 10 tokens for any vote." This shifts the dynamic from peer-to-peer to Authority-to-Student, which often triggers *more* ethical discomfort.

  **2. The "It's Just a Game" Cynicism.**
  *   *Why:* Students dismiss the tokens as meaningless, so they feel no moral weight.
  *   *Fix:* Frame the tokens seriously at the start. "Treat these as if they were real influence." During the debrief, ask: "If these tokens were actual political power, would your discomfort be higher or lower?" This bridges the simulation to reality.

  **3. Only Consequentialist Complaints Arise.**
  *   *Why:* Students focus on "I lost tokens" rather than "Voting is sacred."
  *   *Fix:* You must prompt the semiotic angle directly. Ask the vote-sellers: "Did you feel like a citizen when you sold, or like a vendor?" Ask the buyers: "Does your victory feel legitimate, or does it feel tainted?" If they say "tainted," press: "Why? You followed the rules." This forces them to articulate the norm violation.

  **4. Time Overrun.**
  *   *Why:* Trading takes longer than expected.
  *   *Fix:* Hard cap the trading at 5 minutes. Use a visible timer. If trading isn't happening, cut it early and move to debrief. The *attempt* to marketize is enough to spark the conversation.

  ---

  ## The Limitations Note (For Your Lecture)

  **What this game cannot teach:**
  This simulation captures the *immediate* moral intuition, but it cannot reproduce the **Long-Run Cultural Crowding-Out Effect**.

  In the game, the norm of "civic duty" existed in Phase 1, was suspended in Phase 2, and you (the instructor) can restore it in the debrief. In the real world, introducing markets is often irreversible.

  **The Lecture Supplement:**
  You must explain that the danger of vote-selling isn't just the single transaction (which the game simulates), but the **habituation**.
  *   *Reference:* Michael Sandel's *What Money Can't Buy*.
  *   *Point:* If we habituate citizens to view votes as assets, we erode the civic virtue required for democracy to function *even when markets aren't active*. The game shows the *shock* of the market; the lecture must explain the *erosion* of the norm over time. The game shows the wound; the lecture explains the infection.

  **Closing Thought for Students:**
  "The game showed you how you feel when the norm is broken. The philosophy asks: Can we afford to break the norm even once?"
