      *Wait, one nuance:* If the plan passes in Phase 2, the "buyers" benefit. The "sellers" benefit (they got tokens). The "losers" (who didn't sell and didn't win) are angry.
      *   Losers complain about outcomes (Consequentialist).
      *   Sellers (maybe) feel cheap? Or observers feel the *process* is tainted.
      *   I need to ensure the "corruption" complaint arises. Often, even winners feel the "taint." I should prompt for that.

  8.  **Finalizing the Plan Structure:**
      *   **Title:** The Token Referendum.
      *   **Time:** 75 mins (15 intro, 20 Phase 1, 20 Phase 2, 20 Debrief).
      *   **Materials:** Vote cards, Tokens (paper slips).
      *   **Step-by-Step:** Clear instructions.
      *   **Debrief:** The "Two Columns" technique.
      *   **Troubleshooting:** Market failure, cynicism, confusion.
      *   **Limitations:** The "Crowding Out" thesis (Sandel).

  9.  **Review against constraints:**
      *   25 students? Yes.
      *   75 mins? Yes.
      *   Two phases? Yes.
      *   Discover distinction? Yes.
      *   Predict failures? Yes.
