      *   **Topic:** Vote-selling (specifically the distinction between consequentialist objections [bad outcomes] and deontological/semiotic objections [corruption of the practice]).
      *   **Target Audience:** Intro ethics students (25 students, 75-minute session).
      *   **Goal:** Design an in-class game where students *discover* the distinction themselves before the instructor names it.
      *   **Structure:**
          *   Phase 1: Cooperative/civic task under a norm of unpaid contribution.
          *   Phase 2: Introduce a price/market into the *same* setting.
          *   Outcome: Students voice both types of complaints (efficiency/fairness vs. degradation/meaning).
          *   Debrief: Map remarks to Consequentialism vs. Corruption/Semiotic objections.
          *   Troubleshooting: Predict what goes wrong and how to handle it.
          *   Limitations: Acknowledge what the game *can't* teach (long-run cultural effects) and needs lecture for.

  2.  **Deconstruct the Core Philosophical Distinction:**
      *   *Consequentialist/Instrumental Objection:* Selling votes is bad because it leads to bad results (wealthy buy power, policies favor the rich, instability, etc.). If the outcomes were good, maybe it would be okay.
      *   *Deontological/Semiotic/Corruption Objection:* Selling votes is bad *in itself* because it changes the meaning of voting. Voting is a civic duty/expression of judgment, not a commodity. Putting a price on it degrades the institution, regardless of the outcome. (Sandel's "What Money Can't Buy" argument).

  3.  **Brainstorming the Game Mechanism:**
      *   *Constraint:* Cannot use real money. Must use points/tokens.
      *   *Constraint:* Needs to feel "civic" or "cooperative" in Phase 1, then "marketized" in Phase 2.
      *   *Idea 1: Voting on a class grade bonus.* (Too high stakes, ethical risk).
      *   *Idea 2: Allocating a scarce resource (e.g., extra credit tokens).* (Good, but might just feel like an auction).
      *   *Idea 3: Peer Grading.* (A bit tedious for a game).
      *   *Idea 4: The "Class Decision" Game.* The class must decide on something trivial but collective (e.g., how to spend 5 minutes of class time, or allocating a small pool of "bonus points" to the class).
      *   *Selected Concept:* **The "Public Good" Allocation.**
      *   *Why:* It mimics voting (collective decision) but allows for a "market" twist. Let's refine it.
      *   *Refined Concept:* **The "Community Fund" Vote.**
      *   *Setup:* The class has a pool of points (e.g., 100 points) that can be distributed to everyone equally *if* they agree on a distribution method.
      *   *Phase 1:* Democratic deliberation/voting on how to distribute. Norm: One person, one vote. Duty to the group.
      *   *Phase 2:* Votes can be traded for personal points.
      *   *Critique:* This might get too complex to explain quickly.
      *   *Alternative:* **The "Queue" or "Duty" Roster.**
      *   *Setup:* A necessary but boring task needs doing (e.g., summarizing the reading for next class, or cleaning the board, or organizing a file). Let's make it abstract: "The Class Burden."
      *   *Better Alternative:* **The "Token Vote" on a Shared Reward.**
      *   *Scenario:* There is a pot of 50 "Bonus Points" available for the whole class *if* they pass a measure.
      *   *Phase 1:* Standard voting. Everyone gets 1 vote. Majority rules. If passed, everyone gets points.
      *   *Phase 2:* Votes are tradable commodities. You can sell your vote to a "candidate" (the instructor or a student leader) for personal points.
      *   *Problem:* Hard to simulate "buying votes" without a buyer.
      *   *Best Fit:* **The "Charity vs. Cash" Dilemma (adapted from Sandel/Experimental Econ).**
      *   *Let's try a specific mechanism:* **The "Class Decision" on a Shared Good.**
      *   *Task:* Decide between Option A (Equal distribution of points) and Option B (Unequal, but higher total).
      *   *Phase 1:* Vote. Norm: Civic duty.
      *   *Phase 2:* You can sell your vote to the Instructor for a small personal fee.
      *   *Wait, simpler:* **The "Duty Roster" Game.**
      *   *Phase 1:* We need 5 volunteers to stay 2 mins late to tidy up. Norm: Civic duty.
      *   *Phase 2:* We need 5 people. We will pay 10 points. If not enough volunteers, we auction the *obligation* (negative payment).
      *   *Actually, the prompt asks for "Vote-Selling" specifically.* I should stick closer to voting.
      *   *Revised Plan:* **The "Policy Vote" Simulation.**
      *   *Context:* The class decides how to allocate a surplus of 100 "Participation Points."
      *   *Option X:* Everyone gets 4 points.
      *   *Option Y:* A random 5 students get 20 points each (others get 0).
      *   *Phase 1:* Secret ballot. Norm: Vote for what's best for the class.
      *   *Phase 2:* Before voting, students can trade their vote. (Hard to enforce).
      *   *Let's go with the "Market for Votes" simulation used in econ/ethics classes.*
      *   *Setup:* 25 students. 3 Groups (A, B, C).
      *   *Issue:* A policy that benefits Group A heavily, hurts B slightly, hurts C moderately.
      *   *Phase 1:* One person, one vote. (Majority will likely reject A's policy).
      *   *Phase 2:* Votes are property. Group A can "pay" Group B members to vote for the policy using class points.
      *   *This works.* It creates the tension. Group B members who sell feel the "corruption," Group C members who lose feel the "unfair outcome."

  4.  **Developing the Game Steps:**
      *   **Title:** The "Participation Point" Referendum.
      *   **Currency:** Hypothetical Participation Points (affects nothing real, but students care).
      *   **Phase 1 (Civic Norm):** Vote on a distribution scheme.
      *   **Phase 2 (Market Norm):** Votes are tradable assets.
      *   **Debrief:** Categorize complaints.

