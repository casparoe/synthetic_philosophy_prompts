      *   *Risk 1:* Students treat Phase 1 as a joke.
      *   *Risk 2:* No one trades in Phase 2 (market failure).
      *   *Risk 3:* Students get too angry/competitive.
      *   *Risk 4:* They don't articulate the "corruption" argument, only the "unfairness" argument.
      *   *Mitigation:* Instructor needs to prime the pump during debrief without leading too early.

  6.  **Addressing the "Limitations" Section:**
      *   *What's missing?* The long-term cultural shift. A one-off game doesn't show how markets *crowd out* norms over time. It also doesn't capture the secret ballot issue (coercion).

