      *   *Phase 1:* Altruistic voting.
      *   *Phase 2:* Vote market.
      *   *Debrief:* Board work (Two Columns).
      *   *Troubleshooting:* Specific tactics.
      *   *Limitations:* The "Crowding Out" effect.

      *(Self-Correction during drafting)*: Make sure the "price" isn't real money. Use "Course Points" but clarify they are symbolic to avoid academic integrity issues. Better yet, use "Chocolate/Candy" or just "Bragging Rights/Tokens." Let's use "Tokens" redeemable for a trivial prize (e.g., leaving 2 mins early or a piece of candy) to keep stakes low but non-zero. Actually, the prompt says "points or tokens instead." I will use "Class Tokens."

      *Refining the Distinction:*
      *   Complaint Type 1: "The rich won!" "It's unfair." (Consequentialist/Fairness).
      *   Complaint Type 2: "Voting isn't supposed to be for sale." "It feels sleazy." (Semiotic/Corruption).

      *Game Mechanics:*
      *   Give everyone 1 Vote Card.
      *   Proposal: "The Elite Plan" (Gives 10 tokens to 5 people, 0 to others).
      *   Phase 1: Vote. (Will fail).
      *   Phase 2: The 5 potential winners can offer 2 tokens to others to buy their vote.
      *   Result: Plan passes.
