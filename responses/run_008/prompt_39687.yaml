  *(Final thought on the "Corruption" complaint)*: In a quick game, students often focus only on fairness. To ensure the "corruption" argument surfaces, I need to make the "selling" explicit and public, or at least acknowledged. I will add a "Contract" element in Phase 2 to make it feel more transactional.

