answer: |-
  Here are the drafted questions for the Q&A session, structured to systematically interrogate the speaker's defense against triviality arguments.

  ### 1. Warm-up
  *Goal: Lock down the definition of 'computation' to prevent conceptual sliding later.*

  **Question 1:** To begin, I'd like to pin down your ontology of computation. When you say the brain implements a computation, are you claiming it instantiates a syntactic formalism independent of content, or is the computation individuated by the semantic content of the states?
  *   **Likely Answer:** He will likely say "syntactic" or "formal structure," as computationalism usually relies on syntax to naturalize semantics.
  *   **Follow-up:** If it is purely syntactic, by what physical fact does the brain distinguish a '0' from a '1' without an interpreter assigning those values? Is the syntax intrinsic to the physics, or does it require an external mapping?

  **Question 2:** Second, is the computation you are attributing to the brain defined primarily by its input-output function, or by the specific step-by-step state transitions involved in the process?
  *   **Likely Answer:** He will likely say "state transitions," as this is required to block triviality arguments (which often focus only on I/O).
  *   **Follow-up:** If it relies on specific state transitions, does that mean two systems producing the same behavior but via different physical causal chains are implementing *different* computations?

  ***

  ### 2. The Triviality Gauntlet
  *Goal: Press the mapping problem past the simple "mapping" stage to the stage of physical individuation.*

  **Question 3:** You've argued that Putnam's triviality argument fails because it relies on arbitrary mappings, whereas genuine implementation requires a specific causal organization. But to find that causal organization in a physical system, don't we first have to decide which physical properties count as the relevant "states"?
  *   **Likely Answer:** He will likely agree that we must individuate physical states but insist there is an objective, natural way to do so (e.g., via microphysics).
  *   **Follow-up:** If the individuation depends on the level of microphysics, doesn't a rock contain enough micro-causal complexity to map onto *any* finite state automaton, provided we group the micro-states disjunctively?

  **Question 4:** Consider a wall. You say a wall doesn't implement a mind because it lacks the right counterfactual-supporting causal structure. But if we accept standard physicalism, every physical state of the wall has causal powers and supports *some* counterfactuals. What principled criterion distinguishes the "right" causal structure from the "wrong" one, other than that the right one looks like a computer we already recognize?
  *   **Likely Answer:** He will likely argue that the causal structure must be *isomorphic* to the formal automaton in a non-disjunctive way.
  *   **Follow-up:** But isn't the judgment of isomorphism itself a mapping relation? If the isomorphism holds between the physical states and the formal states, haven't we just pushed the triviality from the mapping of states to the mapping of causal relations?

  **Question 5:** Let's press the objectivity point. If a Martian physicist analyzed a human brain without knowing anything about human behavior or evolution, would they objectively identify the *same* computational structure you do, or would they carve the causal joints differently?
  *   **Likely Answer:** He will likely insist the structure is objective and the Martian would find it (perhaps after enough study).
  *   **Follow-up:** If the Martian could carve the joints differently and find a *different* valid computational structure in the same physics, doesn't that imply the computation is underdetermined by the physical facts?

  **Question 6:** Finally on this point: If triviality is avoided by requiring robust causal connections, does this mean that a system that is physically identical to a brain but lacks those specific causal dispositions (a "blockhead" scenario) is not computing, even if it behaves identically?
  *   **Likely Answer:** He should say "yes," as causal disposition is his defense.
  *   **Follow-up:** If so, doesn't this make the attribution of computation opaque to empirical observation, since we can only observe actual behavior, not the full space of counterfactual causal dispositions?

  ***

  ### 3. The Counterfactual Reply and Its Costs
  *Goal: Argue that invoking counterfactuals smuggles in semantics or observer-relativity.*

  **Question 7:** You rely heavily on counterfactuals to secure implementation. But counterfactuals are notoriously context-sensitive; their truth values often depend on which similarities between possible worlds we prioritize. Whose perspective determines the relevant similarity metric for the brain's counterfactuals: the system's or the observer's?
  *   **Likely Answer:** He will likely say it is determined by the system's intrinsic physical laws, not the observer.
  *   **Follow-up:** But physical laws alone don't dictate which deviations are "relevant" for a specific computation. If we don't appeal to the *function* of the system to select the counterfactuals, aren't we importing a teleological or semantic notion to save the syntactic one?

  **Question 8:** At what grain of physical description must these counterfactuals hold? If a neuron fires slightly differently but the computational state remains the same, is that a failure of implementation or just noise?
  *   **Likely Answer:** He will likely say it is "noise" and the computation is realized at a higher, abstract grain.
  *   **Follow-up:** If the grain is chosen to preserve the computational description despite physical variance, doesn't that mean the physical facts alone do not determine the computation, but rather the computation determines how we group the physical facts?

  ***

  ### 4. Spillover
  *Goal: Show how this defense impacts the scientific tractability of neuroscience.*

  **Question 9:** If genuine implementation requires this strict counterfactual-supporting causal structure, does it follow that most current neuroscientific models, which are often statistical or probabilistic rather than strictly deterministic, fail to describe genuine computation?
  *   **Likely Answer:** He will likely say no, that probabilistic computation is still computation.
  *   **Follow-up:** But if the implementation relation is loosened to accommodate probability and noise, doesn't that reopen the door to triviality, where any noisy system can be described as implementing a probabilistic automaton?

  **Question 10:** Neuroscientists often claim neurons "encode" specific features, like edge orientation. On your view, is this encoding relation objective, or is it only real relative to the computational interpretation we impose on the neural tissue?
  *   **Likely Answer:** He will likely want to say it is objective to preserve scientific realism.
  *   **Follow-up:** If it is objective, there must be a fact of the matter independent of us. But if the triviality argument shows that multiple incompatible computational descriptions fit the same physical facts, how can the encoding claim be uniquely objective?

  ***

  ### 5. The Question He Cannot Deflect
  *Goal: Force a statement on falsifiability.*

  **Question 11:** To close: Computationalism is often presented as a scientific hypothesis. If it is scientific, there must be a possible physical discovery that would prove it false. What specific empirical finding about the brain would convince you that it is *not* implementing a computation?
  *   **Likely Answer:** He might struggle here, perhaps suggesting "non-computable functions" (like Penrose) or "magic."
  *   **Follow-up:** If the answer is that no physical structure could rule it out—that any physical causal structure can be described computationally given the right abstraction—then isn't computationalism a metaphysical stance on how we describe the world, rather than a tractable scientific theory about what the world *is*?
