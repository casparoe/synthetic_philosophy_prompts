  My friend and I got into a massive argument at like 1am over whether someone who cares about animals but isn't ready to go vegetarian should eat MORE beef or MORE chicken, and now I'm trying to write it up before I forget how the whole thing went. Could you read my draft below and tell me if the argument actually hangs together? I'm especially unsure about step 3, and also please flag anything factually off, like the feed conversion numbers, which I'm half-remembering.

  Draft: "The standard welfare case against chicken goes: to produce the same amount of meat you need hundreds of chickens rather than one cow, and broiler chickens are kept in worse conditions and each one plausibly suffers alot. So the 'conscientious omnivore' who won't go vegetarian should at least switch from chicken to beef.

  But this ignores what the animals themselves eat. Broilers are efficient converters, maybe 2 kg of feed per kg of meat, while beef needs something like 8-10 kg. So per calorie of meat, chicken demands much more cropland, and crop cultivation is brutal for wild animals: tilling, harvesting, pesticides. If pasture is comparatively benign for wild animals — fewer of them, or lives not worse than neutral — then beef, much of which comes from grazing land that would never be cropland anyway, might come out ahead in total suffering terms even though each cow suffers more than the chickens it replaces. The conscientious omnivore should eat chicken, not beef.

  And if crop cultivation is really that bad, the reductio is obvious: an all-beef diet might cause less total suffering than a fully vegetarian grain-and-legume diet, since the vegetarian just outsources her killing to combines instead of slaughterhouses."

  So yeah that's where my friend basically threw her hands up and said the whole thing is broken because you just can't add up mouse deaths by combine against the lifetime misery of a broiler chicken, they're not comparable units, and any argument that concludes 'eat more beef to help animals' has obviously gone wrong somewhere even if she can't say where. My comeback was that this is a vibes objection — if the numbers work out, they work out, intuitions about 'obviously wrong' conclusions are exactly the thing the argument is testing. But maybe she's right that there's a real problem in there, I just can't tell if it's in step 2 (pasture vs cropland for wild animals), step 3 (cross-species welfare comparisons), or somewhere I haven't even noticed. Which premise is genuinely the weakest, and is there any way to patch it, or does the argument need to be abandoned for something more modest?
