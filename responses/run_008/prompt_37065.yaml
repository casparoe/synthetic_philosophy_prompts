answer: |-
  This is an exceptionally sharp observation. You have correctly identified the central tension in International Humanitarian Law (IHL): the **Separation Thesis**. This is the doctrine that *jus ad bellum* (justice of going to war) and *jus in bello* (justice in fighting) are logically independent.

  Your professor is teaching a standard interpretation: that the law *embodies* Michael Walzer's "Moral Equality of Combatants" (MEC). Walzer argues that soldiers on both sides have an equal right to kill one another, provided they follow the rules of war, because they are coerced agents of the state.

  However, your suspicion is well-founded. The law is not a moral treatise; it is a regulatory regime. It does not necessarily *presuppose* Walzer's strong moral claim (that unjust combatants do *no wrong*). Instead, it presupposes a functionalist theory of responsibility that is compatible with Walzer, but also compatible with several other theories that Walzer would reject.

  Here is a reconstruction of the implicit theory of responsibility in IHL, the rival theories that fit, and what would actually happen if the Revisionists (McMahan et al.) won the philosophical argument.

  ### 1. The Implicit Theory: Institutional Role Morality + Pragmatic Excuse

  The current legal architecture does not require the belief that fighting for an unjust cause is *morally permissible*. It only requires the belief that it is **non-culpable for the individual soldier.**

  To make sense of the law, you need a theory of responsibility that distinguishes between **Institutional Agency** and **Personal Agency**.

  *   **Ad Bellum (The Cause):** The soldier is viewed as an *instrument* of the state. The state possesses the monopoly on the decision to use force. Therefore, moral responsibility for the *cause* attaches to the leadership (the "brain"), not the soldier (the "hand"). The soldier is granted an **excuse**, not a **justification**.
      *   *Justification:* "What I did was right."
      *   *Excuse:* "What I did was wrong, but I am not blameworthy."
      *   The law treats the aggressor soldier as *excused* due to duress, ignorance, or civic obligation. This is why they get POW status (humanitarian protection) but not immunity from moral scrutiny.
  *   **In Bello (The Conduct):** The soldier is viewed as a *moral agent*. The law assumes that while a soldier cannot judge grand strategy, they can recognize "manifest illegality" (e.g., shooting a prisoner). Here, the excuse of "following orders" is revoked because the law posits a **moral minimum** that transcends state command.

  **Does this presuppose Walzer?**
  No. Walzer argues for *moral symmetry* (the unjust soldier does no wrong). The law only requires *legal symmetry* (the unjust soldier is not prosecuted). The law is compatible with the Revisionist view that the unjust soldier *does* wrong, provided the legal system treats that wrong as **excused** rather than **criminalized**.

  ### 2. Rival Theories That Fit the Law

  You asked if the system could be just reciprocity or epistemic skepticism. The answer is yes. The law is "underdetermined" by moral theory, meaning multiple moral theories can justify the same legal rules.

  **A. Pure Reciprocity (The Hobbesian View)**
  *   **Theory:** There is no moral equality. Aggressors are murderers. However, if we tell aggressor soldiers they will be hanged for fighting, they will never surrender. They will fight to the last man, increasing carnage.
  *   **Fit:** This fits the law perfectly. We give them POW status not because they deserve it, but to buy their surrender. We punish war crimes not because of abstract morality, but to maintain a reciprocal equilibrium where our soldiers aren't tortured.
  *   **Implication:** This view admits the law is a lie we tell to save lives. It requires no moral claim about the soldiers' innocence.

  **B. Epistemic Humility (The Skeptical View)**
  *   **Theory:** It is often impossible to know *ex ante* which side is truly just. Wars are foggy. If we condition POW status on *jus ad bellum*, we need a court to decide who is the aggressor before we treat prisoners. That takes too long.
  *   **Fit:** This justifies the "uniform/open carry" requirement. We can verify *how* you fight instantly. We cannot verify *why* you fight instantly.
  *   **Implication:** This supports the "following orders" distinction. A soldier can know a prisoner is a prisoner (epistemically easy). A soldier cannot easily know if their President's intelligence on WMDs is false (epistemically hard).

  **C. The "Clean Hands" Theory (Institutional Integrity)**
  *   **Theory:** The state must maintain its own moral integrity. If a state allows its soldiers to commit atrocities, the state becomes criminal. Therefore, the state must police *in bello* conduct to preserve its own legitimacy, even if the war itself is questionable.
  *   **Fit:** This explains why states court-martial their own soldiers for war crimes even when winning. It is about the state's soul, not just the enemy's rights.

  ### 3. Where the Pieces Don't Fit (The Incoherence)

  You asked if this is just "historical accretion." There is one genuine tension that the law struggles to resolve: **The Liability Gap.**

  *   **The Tension:** If "following orders" is no defense for war crimes, why is it a defense for aggression?
  *   **The Law's Answer:** It relies on the **Manifest Illegality Doctrine**. The law assumes there is a bright line between "invading a country" (complex, political, potentially excusable) and "killing a civilian" (simple, moral, inexcusable).
  *   **The Weakness:** Modern warfare blurs this. Drone operators sitting in Nevada killing "militants" in Yemen face the same epistemic opacity as the infantryman in 1940 wondering if the war is just. If a soldier can be expected to know a war is illegal (as Nuremberg implied for leaders), why can't a specialized soldier know a specific strike is illegal?
  *   **Underdetermination:** The law doesn't care if you think the soldier is *innocent* (Walzer) or *excused* (Revisionist). It only cares about **enforceability**. This is where the philosophy is irrelevant to the practice. The law is designed for compliance, not moral truth.

  ### 4. The Revisionist Counterfactual: What if McMahan is Right?

  This is the most critical part of your query. If the Revisionists are right—that unjust combatants lack the right to fight and are morally liable to be killed—what changes in the law?

  Surprisingly, **very little.** Most sophisticated Revisionists (including McMahan) argue that the *law* should remain largely as it is, even if the *morality* changes. Here is why:

  **A. Criminal Prosecution for Mere Participation?**
  *   **Revisionist Moral View:** Unjust combatants are liable to defensive killing.
  *   **Legal Reality:** We do not prosecute soldiers for mere participation (Nuremberg precedent holds).
  *   **Why it wouldn't change:** Even if unjust fighting is wrong, prosecuting every soldier on the losing side is logistically impossible and politically destabilizing. It prevents peace treaties.
  *   **Concrete Change:** None. We would still grant POW status. The Revisionist would argue this is a **pragmatic concession**, not a moral endorsement.

  **B. Liability to Attack (The Big One)**
  *   **Current Law:** You cannot target a soldier who is *hors de combat* (surrendering, wounded), regardless of their cause.
  *   **Revisionist View:** If a soldier is fighting unjustly, they are morally liable to be killed. If they surrender, they might lose that liability, *but* Revisionists argue that in the "fog of war," just combatants cannot be expected to distinguish who is truly liable in real-time.
  *   **Concrete Change:** Ideally, Revisionists would say unjust combatants have fewer rights. But practically, IHL would likely keep the symmetry because requiring soldiers to make moral judgments about the enemy's cause *while shooting* leads to more atrocities, not fewer.

  **C. Reparations from Conscripts?**
  *   **Revisionist View:** Unjust combatants commit a rights violation.
  *   **Legal Reality:** States pay reparations, not individuals.
  *   **Concrete Change:** None. Holding individuals financially liable would violate human rights norms regarding poverty and duress. The Revisionist view collapses into state responsibility here.

  **D. The "Excuse" Concession**
  *   Most Revisionists accept that while unjust combatants act *wrongly*, they are often **excused** due to ignorance or duress.
  *   **Concrete Change:** If the law adopted this, it would explicitly frame POW status as an **amnesty** rather than a **right**. Currently, POW status is a right. Under a strict Revisionist legal code, it might be framed as "we *could* prosecute you for aggression, but we choose to excuse you." (In fact, this is closer to how "amnesties" work in civil war transitions).

  ### 5. Summary: Reconstructing the Architecture

  To answer your core question: **What theory of moral responsibility does this arrangement presuppose?**

  It presupposes a **Hybrid Theory of Institutional Excuse.**

  1.  **Strict Liability for Conduct:** Soldiers are moral agents regarding *means*. They have a duty to disobey manifestly illegal orders. (This rejects pure "following orders" determinism).
  2.  **Vicarious Liability for Cause:** The State is the moral agent regarding *ends*. The soldier is an extension of the State's will. Therefore, the soldier is **excused** for the cause due to **epistemic limitation** (they don't know the full picture) and **coercion** (conscription/career pressure).
  3.  **Pragmatic Symmetry:** The law treats both sides equally not because they are morally equal, but because **asymmetry creates perverse incentives.**

  **Is your professor right?**
  Your professor is simplifying. The law *looks* like Walzer's MEC, but it is actually agnostic. It works *as if* Walzer is right, but it could function *as if* McMahan is right (by treating unjust fighting as a non-prosecutable wrong).

  **Is it coherent?**
  It is functionally coherent but morally messy. It relies on the distinction between "Manifest Illegality" (easy to see) and "Aggressive War" (hard to see). As warfare becomes more remote and intelligence-driven, that distinction is eroding, which is why you feel the "something is off" sensation. The epistemic gap is closing, but the legal architecture hasn't caught up.

  **The Verdict:**
  The law is not a reflection of moral truth; it is a technology for violence containment. It sacrifices moral precision (holding unjust soldiers accountable) for humanitarian utility (getting them to surrender and obey rules). If Revisionism takes hold, it will likely change the *philosophy textbooks*, but the *Geneva Conventions* will remain, re-interpreted not as recognizing rights, but as granting privileges for the sake of peace.
