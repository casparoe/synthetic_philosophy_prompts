      *   *MEC in Law:* IHL *does* embody a form of MEC (symmetry of rights/obligations), but it's a *legal* symmetry, not necessarily a *moral* one.
      *   *Nuremberg:* Correct. Leaders charged with Crimes Against Peace; soldiers generally not for mere participation.
      *   *Superior Orders:* Correct. Manifest illegality standard.
