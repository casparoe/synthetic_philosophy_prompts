answer: |-
  1. **Agreed Claims**
  We, the undersigned, agree that both guilt and shame are cognitive-evaluative emotions essential to moral life, each registering distinct objects and motivating distinct responses. We agree that guilt registers a specific violation of a rule or harm inflicted upon another; it moves the agent toward confession, reparation, and the discharge of obligation. We agree that shame registers a failure of the self relative to an ideal or an internalized audience; it moves the agent toward hiding, withdrawal, or fundamental transformation of character. We acknowledge that guilt predictably misfires when the wrongdoing is systemic rather than individual, leading to a false sense of clearance after minor repair, and when the community required to witness confession is absent. We acknowledge that shame predictably misfires when the internalized audience is corrupt or abusive, leading to defensiveness, paralysis, or the masking of wrongdoing rather than its repair. We agree that neither emotion is morally inert; both can motivate restraint before the fact and repair after the fact, but neither guarantees moral correctness without the support of accurate moral norms.

  2. **Disagreements**
  We record our remaining disagreements on the primary questions of this collaboration, phrased in wording each camp accepts as accurate to its position.
  Regarding question (a), *which emotion is better for moral life*: The Guilt camp maintains that guilt is superior because it isolates the act from the agent, allowing for precise repair and the possibility of forgiveness without requiring the death of the old self. The Shame camp maintains that shame is superior because it binds the agent to the community and the ideal, preventing cruelty before the fact by threatening identity rather than merely imposing a debt.
  Regarding question (b), *whether a culture can deliberately choose its dominant moral emotion*: The Guilt camp maintains that cultures can engineer guilt-dominance through legalistic institutions, education focused on rule-violation, and practices of explicit apology. The Shame camp maintains that shame cannot be engineered deliberately because it relies on an organic, pre-reflective sense of belonging; attempts to manufacture shame produce only humiliation or stigma, not ethical shame.

  3. **Cruxes**
  We identify two theoretical cruxes where our disagreements rest on unresolved empirical and conceptual claims.
  Crux 1: The Scope of Evaluation. The Guilt camp contends that shame is inherently global and self-condemning, inevitably collapsing into a judgment of the whole person rather than the act. The Shame camp contends that shame can be as act-specific as guilt, provided the internalized audience is nuanced, allowing for a judgment of "I am one who did this" without necessitating "I am wholly bad."
  Crux 2: The Dependency on Community. The Guilt camp contends that an emotion embedded in an audience cannot survive a community's disintegration; when the witnesses vanish, shame must decay into guilt or depression. The Shame camp contends that the internalized audience becomes autonomous once formed, allowing shame to sustain moral weight even in isolation or diaspora, provided the ideal remains vivid.

  4. **Evidence and Predictions**
  For each crux, we specify the argument or evidence both sides accept as bearing on the question, along with our divergent predictions.
  Regarding Crux 1 (Scope): Both sides accept that longitudinal observation of agents undergoing moral repair can reveal whether self-evaluation remains tied to specific acts or generalizes to the whole self. The Guilt camp predicts that in cases where agents report shame without global self-condemnation, further analysis will show they are actually experiencing guilt labeled as shame. The Shame camp predicts that observation will reveal agents who maintain a stable sense of worth while simultaneously experiencing acute shame regarding a specific failure, proving shame's specificity.
  Regarding Crux 2 (Community): Both sides accept that tracking moral sentiment in individuals severed from their originating communities (e.g., exiles, estranged siblings, survivors of dispersed groups) provides evidence of the emotion's durability. The Guilt camp predicts that without external reinforcement, shame-based agents will either reconstruct a community or convert their moral distress into guilt-based narratives of personal responsibility. The Shame camp predicts that shame-based agents will maintain the internalized gaze of the lost community indefinitely, sustaining moral distress even when no external judgment is possible.

  5. **Closing Statements**
  **Guilt-Defender:** In drafting this document, I found the disagreement on cultural engineering to be largely verbal; we both agree institutions shape emotion, but we differ on whether that shaping counts as "choice." However, the crux regarding community disintegration strikes me as genuinely substantive. If shame cannot survive the scattering of the witnesses, then it is too fragile for the modern condition, where communities are fluid and often broken. I concede that shame offers a depth of motivation guilt lacks, but I remain convinced that without the ability to discharge the debt through specific acts, shame risks becoming a permanent state of being rather than a tool for repair.

  **Shame-Defender:** In drafting this document, I found the disagreement on which emotion is "better" to be productively narrowed; we agree both are necessary, but differ on which should carry the weight of prevention. However, the crux regarding the globality of shame strikes me as genuinely substantive. If shame is inherently totalizing, then it is indeed dangerous, as it threatens the agent's capacity to function. I concede that guilt offers a clearer path to reintegration, but I remain convinced that without the tether to an internalized other, guilt becomes a transaction that leaves the character unchanged. The moral life requires not just fixing what was broken, but becoming someone who would not break it again.
