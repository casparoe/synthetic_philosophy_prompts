prompt: |-
  I'm on the academic integrity council at a mid-size state university, and we're revisiting our policy on how we handle confirmed cases of cheating. Quick background: right now everything is confidential. Student gets found responsible, gets a grade penalty, maybe a suspension, does an online ethics module, and that's it. No one else ever knows. Some of our council members think this is a disaster -- they say we've built a guilt-based system where the only thing that matters is whether you personally feel bad and jump through the repair hoops, and that cheating here is rampant precisely because there's no social cost at all. Their proposal is to publish names (or at least anonymized case descriptions that identifying details would make obvious) in a monthly community bulletin, on the theory that shame is a social emotion, it's what a community is for, and the fear of being seen is the only deterrent that actually works. The other faction says shame is a terrible moral emotion -- it attaches to the whole person rather than the act, it produces hiding and denial instead of repair, and we'd just be teaching students to get better at not getting caught.

  One wrinkle I want the memo to actually deal with: someone in our last meeting brought up that old anthropology distinction between "guilt cultures" and "shame cultures" -- the idea that some societies run on internalized conscience and others on external reputation, and there was a whole mid-century thing about guilt cultures being supposedly more "developed." She wants us to say our policy choice is really a choice about what kind of campus culture we're deliberately building, i.e., that cultures can choose. I half buy it but I also suspect the dichotomy itself is kind of cooked (plenty of shame in supposedly guilt-based institutions, plenty of internalized conscience in supposedly shame-based ones, and a lot of the fieldwork behind it got picked apart later). The memo shouldn't just take either the dichotomy or her voluntarism about culture for granted.

  So: draft the council's decision memo. Recommend a concrete policy (keep confidentiality, adopt publication, or something in between with actual specifics -- what gets published, to whom, when, and what the removal path looks like), and give the reasoning. It should treat the pro-publication side's deterrence and community-accountability argument at full strength, not as a strawman, and it should say honestly what's lost on whichever side loses. It should also engage whether shame in a bounded community like a campus can be the "reintegrative" kind (where you're marked as having done wrong but the door back is clearly open) rather than the stigmatizing kind, and what institutional design details actually make the difference between the two -- because if it comes down to details like timing, wording, and whether there's a re-entry ritual, the memo should name them. Keep it to something I can circulate before the meeting, so roughly a page and a half, with a clear bottom line the council can vote on.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Academic Integrity Council at a mid-size state university.
      *   **Task:** Draft a decision memo for the council to circulate before a meeting.
      *   **Topic:** Revisiting policy on handling confirmed cheating cases (Confidentiality vs. Publication/Shame).
      *   **Key Conflict:**
          *   *Current Policy:* Confidential (grade penalty, suspension, ethics module). Critique: Guilt-based, no social cost, rampant cheating.
          *   *Proposal:* Publish names/case descriptions in a bulletin. Argument: Shame is a social emotion, fear of being seen is a deterrent, builds community accountability.
          *   *Counter-Argument:* Shame attaches to the person, not the act; leads to hiding/denial; teaches evasion.
      *   **Specific Nuance to Address:** The "Guilt Culture vs. Shame Culture" anthropological distinction (Benedict et al.). The memo shouldn't accept this dichotomy as absolute or the idea that culture is purely voluntary, but must engage with the intent behind using it (deliberate culture building).
      *   **Key Concept to Explore:** Reintegrative Shame (Braithwaite) vs. Stigmatizing Shame. How institutional design (timing, wording, re-entry) makes the difference.
      *   **Format:** Decision Memo, approx. 1.5 pages.
      *   **Tone:** Professional, nuanced, decisive, acknowledging trade-offs.
      *   **Goal:** Recommend a concrete policy (Keep, Change, or Hybrid) with specific details on implementation.

  2.  **Determine the Recommendation:**
      *   *Option A (Status Quo):* Too easy, ignores the valid critique about lack of deterrence.
      *   *Option B (Full Publication):* Too risky legally (FERPA in the US context, though not explicitly stated, is implied by "state university"), ethically fraught (stigmatization), and likely counterproductive (drives behavior underground).
      *   *Option C (Hybrid/Reintegrative):* This allows for the "social cost" argument without the permanent stigma. It acknowledges the "culture building" aspect without relying on the outdated guilt/shame dichotomy.
      *   *Decision:* Recommend a **Modified Transparency Policy** focused on *aggregate data* and *reintegrative rituals* rather than public shaming of individuals. However, to address the "social cost" concern, I need to introduce a mechanism where the *community* knows cheating is policed, without necessarily doxxing every student.
      *   *Refinement:* Actually, the prompt asks to engage with the "shame" argument seriously. A pure aggregate data approach might feel like dodging the "shame" proposal. A better middle ground is **Limited Disclosure with Reintegrative Pathways**.
      *   *Wait, legal/ethical constraint:* In the US, FERPA strictly prohibits releasing personally identifiable information from education records without consent. A state university cannot legally publish names of students disciplined for cheating in a bulletin. I must address this.
      *   *Pivot:* The recommendation must be legally viable. So, no names. But can we do anonymized cases? Yes, if truly anonymized. Can we do community accountability? Yes, through restorative justice panels.
      *   *Final Decision:* Recommend **Anonymized Case Summaries + Restorative Justice Conferencing**. This addresses the "social" aspect (community learns from cases, student faces peers) without the "stigmatizing" aspect (permanent public record of names). It engages the "culture" argument by actively designing for reintegration.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose. Acknowledge the tension.
      *   **The Anthropological Context:** Address the "Guilt vs. Shame" culture argument. Acknowledge its limitations (it's not binary, culture isn't purely voluntary) but validate the core insight: *norms are socially enforced.* We aren't choosing between "guilt culture" and "shame culture," but between *stigmatizing* and *reintegrative* accountability.
      *   **Evaluating the Proposal (Publication):**
          *   *Strengths:* Deterrence, communal norm-setting.
          *   *Risks:* Legal (FERPA), Stigmatization (drives behavior underground), Equity (disproportionate impact on vulnerable students).
      *   **The Concept of Reintegrative Shame:** Cite Braithwaite implicitly or explicitly. Distinguish between "you are bad" (stigma) and "you did bad, fix it" (reintegration).
      *   **Recommendation:**
          1.  Maintain confidentiality of names (Legal/ethical floor).
          2.  Publish *anonymized* case narratives (Educational/Deterrent value).
          3.  Implement Restorative Justice Conferencing for eligible cases (Social cost without permanent stigma).
          4.  Clear path to expungement (Reintegration).
      *   **Closing:** Call to vote.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the "Guilt/Shame" section too academic?
      *   *Fix:* Keep it grounded. Use it to explain *why* the proposal is tempting but why the dichotomy is flawed. Focus on the *function* of shame, not the label.
      *   *Critique:* Is the recommendation specific enough?
      *   *Fix:* Add details on the "Bulletin" (what goes in it), the "Conference" (who attends), and the "Expungement" (timeline).
      *   *Critique:* Did I address the "culture is chosen" point?
      *   *Fix:* Explicitly state that while we can't flip a switch on culture, policy *signals* values.

  5.  **Drafting the Content (incorporating the constraints):**
      *   *Length:* Needs to be around 1.5 pages single-spaced (approx. 750-900 words).
      *   *Tone:* Balanced but decisive.
      *   *Key Phrase:* "Reintegrative Shaming" vs. "Stigmatizing Shaming."
      *   *Legal Check:* Must mention FERPA/privacy laws as a hard constraint on naming names.

  6.  **Final Review against Prompt:**
      *   Treat pro-publication at full strength? Yes (acknowledge deterrence).
      *   Say what is lost? Yes (transparency vs. privacy).
      *   Engage guilt/shame dichotomy? Yes (nuanced critique).
      *   Reintegrative vs. Stigmatizing? Yes (central to recommendation).
      *   Concrete policy details? Yes (anonymized summaries, restorative panels, expungement).
      *   Clear bottom line? Yes.

  7.  **Final Polish:** Check flow and ensure the "culture" argument doesn't get bogged down in anthropology jargon. Keep it actionable for a university council. (Self-correction: Ensure I don't sound like I'm dismissing the "shame culture" proponent entirely, but rather channeling their energy into a more effective mechanism.)

  *(Self-Correction on "State University" context):* Since it's a US state university, FERPA is non-negotiable. I cannot recommend publishing names. I must frame the recommendation as "How do we achieve the *goals* of the publication proposal without violating the law or ethical standards?" This strengthens the memo by showing practical leadership.

  *(Final Plan):*
  1. Header.
  2. Executive Summary/Recommendation.
  3. Analysis of the "Culture" Argument (Guilt/Shame).
  4. Analysis of Publication Proposal (Pros/Cons).
  5. Proposed Policy (The "Reintegrative" Model).
  6. Implementation Details.
  7. Conclusion.

