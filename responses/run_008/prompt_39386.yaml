answer: |-
  # JOINT STATEMENT ON THE COMMON PRIOR ASSUMPTION
  **Date:** October 14, 2023
  **Parties:** The Harsanyian Cohort (HC) and the Epistemic Pluralist Coalition (EPC)
  **Subject:** The Status, Utility, and Normativity of the Common Prior Assumption (CPA) in Bayesian Modeling

  ### PREAMBLE
  After ten years of adversarial collaboration, the undersigned parties acknowledge that while we share a commitment to formal rigor and Bayesian coherence, we diverge on the interpretation and application of the Common Prior Assumption. This document records our convergence on technical and methodological baseline claims, delineates our residual disagreements with precision, and identifies the specific empirical and theoretical cruxes that must be resolved to advance the field. We sign this not to declare victory, but to define the battlefield.

  ---

  ### 1. AGREED CLAIMS
  *Both parties affirm the following propositions as true or methodologically binding.*

  1.  **Mathematical Validity:** We agree that Aumann's Agreement Theorem and related no-trade theorems are mathematically valid deductions from their premises. Specifically, if agents share a common prior, have common knowledge of their posteriors, and are Bayesian rational, they cannot agree to disagree.
  2.  **The Role of the State Space:** We agree that the specification of the state space ($\Omega$) is non-trivial and determinative. Whether a difference in belief is classified as a "difference in information" or a "difference in prior" depends logically on what variables are included in $\Omega$.
  3.  **Descriptive vs. Normative Distinction:** We agree that the claim "agents *do* share a common prior" (descriptive) is distinct from the claim "agents *should act as if* they share a common prior" (normative/methodological). Disagreement on one does not logically entail disagreement on the other.
  4.  **Updating Protocol:** We agree that conditional on a specified prior and likelihood function, Bayes' Rule is the unique coherent method for updating beliefs in light of new evidence. Disagreements regarding final posteriors must stem from differences in priors, differences in information (likelihoods), or violations of coherence.
  5.  **Modeler Commitment:** We agree that any model implies commitments by the modeler. Whether one imposes a CPA or allows heterogeneous priors, the modeler makes a choice that influences the model's output and policy implications.
  6.  **Criteria for Progress:** We agree that progress in this debate requires moving beyond verbal disputes regarding the definition of "information." Progress will be measured by (a) formal results clarifying the complexity costs of state-space expansion, and (b) empirical data on how prior aggregation affects predictive accuracy in controlled settings.

  ---

  ### 2. AREAS OF RESIDUAL DISAGREEMENT
  *The following table summarizes the substantive disagreements that remain. Each statement is phrased such that the respective party endorses it as an accurate representation of their position.*

  | Topic | The Harsanyian Cohort (HC) Asserts | The Epistemic Pluralist Coalition (EPC) Asserts |
  | :--- | :--- | :--- |
  | **Ontology of Priors** | Persistent prior differences between rational agents with shared evidence are either a sign of irrationality or a modeling error (omitted variables in the state space). | Persistent prior differences can encode legitimate structural commitments, inductive biases, or value-laden error weightings that remain distinct even under full transparency. |
  | **The Expansion Move** | Representing heterogeneous priors as a common prior over an expanded state space (including "type" or "model" as random variables) demonstrates that the CPA is universally applicable and methodologically required. | Representing heterogeneous priors as a common prior over an expanded state space renders the CPA tautological; it preserves the math but strips the assumption of its explanatory power regarding agent similarity. |
  | **Normative Target** | The CPA serves as a regulative ideal. Institutions and epistemic communities should design protocols (arbitration, disclosure) to approximate common priors and eliminate "agreeing to disagree." | The CPA is a frictionless-plane idealization useful for specific theoretical bounds but misleading as a practical target. Communities should coordinate *around* prior diversity, not attempt to eliminate it. |
  | **Market Evidence** | High volumes of speculative trade in liquid markets are evidence against common priors *or* common knowledge of rationality; one of these assumptions must be dropped to explain the data. | High volumes of trade are consistent with heterogeneous priors that reflect legitimate differences in risk tolerance or structural worldviews, not necessarily irrationality or private information. |

  ---

  ### 3. CRUXES AND EMPIRICAL TESTS
  *We have identified four sub-questions ("cruxes") where resolution would significantly shift the weight of evidence. For each, we specify a concrete case or protocol to adjudicate the matter.*

  #### Crux 1: The Expansion Move (Substantive vs. Verbal)
  *Question:* Is the mathematical ability to expand the state space to accommodate any prior difference a proof of the CPA's universality, or a trivialization that hides computational/complexity costs?
  *   **HC Position:** It is universal. If you can't expand the space to find the common cause, you haven't looked hard enough.
  *   **EPC Position:** It is trivial. If the expanded space requires infinite dimensions or unobservable variables, the CPA loses its constraint on theory.
  *   **Test Case:** **The Complexity Bound Protocol.** We will jointly commission a proof attempting to construct a common-prior expansion for a specific class of agents with known, divergent inductive biases (e.g., Solomonoff inducers with different universal Turing machine priors).
      *   *HC Success Condition:* The expansion is constructed with polynomial complexity relative to the original models.
      *   *EPC Success Condition:* The expansion requires exponential blowup or non-computable variables, demonstrating the CPA is theoretically possible but practically vacuous.

  #### Crux 2: The Audit Question (Bookkeeping vs. Reality)
  *Question:* When two agents disagree after exchanging full belief states, is the residue best labeled "private information" or "prior difference"?
  *   **HC Position:** It is private information (the state space was misspecified).
  *   **EPC Position:** It is a prior difference (the bookkeeping boundary is real, not arbitrary).
  *   **Test Case:** **The Transparent Box Experiment.** Two agents are placed in an environment where all physical data streams are recorded and shared. They still disagree on a future outcome.
      *   *HC Prediction:* Analysis of the logs will reveal asymmetric processing or latent variables not captured in the shared stream (hidden information).
      *   *EPC Prediction:* Analysis will confirm identical data streams and processing rules, leaving the divergence attributable to fundamental inductive bias (hidden prior).

  #### Crux 3: The Normative Force (Ideal vs. Artifact)
  *Question:* Should institutions aim to converge priors or manage divergence?
  *   **HC Position:** Convergence is the goal of rational discourse.
  *   **EPC Position:** Diversity is a resource; convergence risks groupthink and model collapse.
  *   **Test Case:** **The Prior-Merger Experiment.** (See Section 4 below).

  #### Crux 4: The No-Trade Test (Market Interpretation)
  *Question:* Does speculative trade volume refute the CPA?
  *   **HC Position:** Yes, unless explained by liquidity needs or risk-sharing. Pure speculation implies inconsistent priors or irrationality.
  *   **EPC Position:** No, speculation is the market mechanism for aggregating heterogeneous priors.
  *   **Test Case:** **The Liquidity-Controlled Market.** A controlled prediction market where liquidity needs are neutralized (agents are paid on proper scoring rules, not trade profit).
      *   *HC Prediction:* Trade volume will drop to near-zero as agents realize they cannot beat the market (common prior logic).
      *   *EPC Prediction:* Trade volume will persist because agents maintain heterogeneous priors regarding the asset's fundamental value generation.

  ---

  ### 4. THE PRIOR-MERGER EXPERIMENT (PROTOCOL & PREDICTIONS)
  *Both parties agree to treat the results of this specific protocol as high-value evidence regarding Crux 3 (Normative Force) and the Ontology of Priors.*

  **Protocol:**
  1.  **Selection:** Identify 50 pairs of expert forecasters who have demonstrated persistent, calibrated disagreement on a specific class of events (e.g., geopolitical outcomes) over a 24-month baseline period.
  2.  **Intervention:** For a 12-month treatment period, each pair is required to adopt a single "merged prior." This prior is a convex combination of their individual baseline priors ($P_{merged} = \alpha P_1 + (1-\alpha) P_2$), where $\alpha$ is randomly assigned per pair.
  3.  **Updating:** After merging priors, forecasters update separately on their own private information streams using standard Bayesian updating.
  4.  **Measurement:** Compare the Brier scores and calibration of the treatment group against a control group (who retain their original priors) and against their own baseline performance.

  **Predictions:**

  *   **The Harsanyian Cohort Prediction:**
      *   *Outcome:* The treatment group will show **improved** aggregate calibration and lower Brier scores compared to the control group.
      *   *Rationale:* Prior differences largely represent noise, redundant private information, or irrational deviations from a truth-tracking standard. Merging priors acts as a variance-reduction technique (similar to averaging noisy signals). Forcing a common prior removes the "irrational" component of the disagreement, allowing the shared information to drive convergence toward truth.

  *   **The Epistemic Pluralist Coalition Prediction:**
      *   *Outcome:* The treatment group will show **degraded** performance compared to the control group.
      *   *Rationale:* Prior differences encode diverse structural models and inductive biases that are complementary. Forcing a convex combination creates a "model mismatch" where the prior no longer fits the likelihood functions either agent actually uses. This destroys the "wisdom of crowds" effect derived from cognitive diversity, effectively blinding agents to patterns their specific priors were tuned to detect.

  ---

  ### 5. JOINT NOTE ON PATH FORWARD
  We acknowledge that this document does not resolve the debate. However, we agree on the conditions under which the debate would be considered settled, or at least significantly advanced.

  If the **Prior-Merger Experiment** yields a statistically significant result favoring the Harsanyian prediction, the Pluralists agree this constitutes strong evidence that prior diversity functions largely as noise in forecasting contexts, undermining the claim that priors encode indispensable structural commitments.

  Conversely, if the **Prior-Merger Experiment** favors the Pluralist prediction, the Harsanyians agree this constitutes strong evidence that the Common Prior Assumption is not a safe regulative ideal for epistemic communities, as enforcing it actively degrades truth-tracking performance.

  Should the results be null or ambiguous, we agree that the dispute likely rests on non-empirical metaphysical commitments regarding the nature of rationality, at which point we will cease adversarial collaboration and publish our divergent interpretations side-by-side.

  Until such data is available, we commit to citing this statement in future work to ensure our respective positions are not misrepresented.

  **Signed,**

  *Dr. Elena Vance (Lead, Harsanyian Cohort)*
  *Dr. Marcus Thorne (Lead, Epistemic Pluralist Coalition)*
