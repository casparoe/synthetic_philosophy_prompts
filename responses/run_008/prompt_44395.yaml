answer: |-
  You have independently rediscovered the field of **Infinite Ethics**, and your "messy gut verdicts" are not a failure of your reasoning but a reflection of a genuine mathematical and philosophical impossibility.

  There are formal **Impossibility Theorems** (most notably by Basu & Mitra, and later Lauwers) which prove that you cannot simultaneously hold all the intuitive principles you are listing. You are trying to satisfy three incompatible axioms:

  1.  **Finite Insensitivity:** Adding or removing a finite number of people (or utility) to an infinite world does not change its value (Your A $\approx$ B intuition).
  2.  **The Pareto Principle:** If everyone in World 1 is at least as well off as in World 2, and someone is better off, World 1 is better (Your A < D intuition).
  3.  **Minimal Sensitivity:** A change in wellbeing for a single person matters (Your A > C intuition).

  Here is the breakdown of why your intuitions are clashing, which principle is likely the culprit, and how to sort out the specific cases (including the torture scenario).

  ### 1. The Core Conflict: A vs. B vs. D
  Your strongest intuition is **A $\approx$ B** ("ten more against infinity is nothing"). This relies on **Cardinality**. In set theory, $|\mathbb{N}| = |\mathbb{N} \cup \{10 \text{ new elements}\}|$. If you believe ethical value supervenes on cardinality, A and B are identical.

  However, look at **World D** (everyone +1).
  *   If A $\approx$ B (finite additions don't matter), then adding 1 utility to one person shouldn't matter.
  *   If adding 1 utility to one person doesn't matter, then adding 1 utility to *everyone* (via infinite steps) shouldn't matter *if* you treat the infinite sum as a completed whole that swallows finite differences.
  *   But you feel D > A. This relies on the **Pareto Principle**.

  **The Contradiction:** You cannot have both Finite Insensitivity and Pareto.
  *   If you accept **Pareto**, then B > A (the 10 new people are better off existing at +5 than not existing, assuming existence is a good, or simply that the total utility is "larger" in a non-cardinal sense).
  *   If you accept **Finite Insensitivity** (A $\approx$ B), you must weaken Pareto. You have to accept that making *some* people better off (the 10 new ones) doesn't make the world better if the background is infinite.

  **The Angel Scenario:** You asked: *"If a finite pile of extra goodness does nothing, why does an infinite sequence of infinite piles register?"*
  This is the distinction between **Finite vs. Infinite Aggregation**.
  *   **A vs. B:** You are adding a *finite* amount of total value (10 people $\times$ 5 = 50 units) to an infinite background. $\infty + 50 = \infty$.
  *   **A vs. Angel:** You are adding an *infinite* amount of total value ($\infty$ people $\times$ 1 = $\infty$ units) to an infinite background.
  *   Mathematically, in standard arithmetic, $\infty + \infty = \infty$. So even the Angel scenario shouldn't register if you are using standard cardinality! The reason it *feels* better is that you are implicitly using a **Hyperreal** or **Ordered** framework where one infinity can be larger than another (e.g., $\omega + 1 > \omega$).
  *   **The Fix:** If you are willing to use a framework where the Angel world is better (one infinity > another infinity), you must also accept that World B is better than World A (one infinity + finite > one infinity). You cannot have it both ways.

  ### 2. The "Half" Problem: World E
  World E (half at +6, half at +5) vs. World A (all at +5).
  You noted: *"Which half seems to depend on how you line the two worlds up."*
  This is the **Permutation Problem**.

  *   **If identities matter:** We map Person 1 in A to Person 1 in E. If Person 1 is in the "lucky half" in E, they are better off. If we can arrange the mapping so that *everyone* in A maps to a +6 person in E, then E > A by Pareto. But we can't, because E has $\infty$ people at +5.
  *   **If identities don't matter (Anonymity):** We just look at the distribution. A has $\{\infty \times 5\}$. E has $\{\infty \times 5, \infty \times 6\}$.
  *   **The Verdict:** In almost any plausible ethical framework that handles infinities (like **Spatiotemporal Expansionism**), E is better than A. Why? Because if you expand a "window" of observation from a center point, the average wellbeing in E will eventually exceed A (assuming the +6s aren't all pushed to the "end" of the universe).
  *   **Principle:** **Dominance.** E dominates A because there is a way to match people such that no one is worse off and infinitely many are better off, *and* the "density" of goodness is higher.

  ### 3. The Torture Scenario (World C & Beyond)
  **World C:** One person tortured (-1000) vs. A (all +5).
  You said: *"Clearly worse, no hesitation."*
  This is **Minimal Sensitivity**. It conflicts with **Average Utilitarianism**.
  *   In Average Utilitarianism: $\frac{\infty \times 5 + (-1000)}{\infty} = 5$. The torture vanishes.
  *   To capture your intuition that C < A, you need a principle that says **local harms matter even in an infinite context**. This is usually satisfied by **Pareto** (one person is worse off, none better) or a **Lexical Priority** to suffering.

  **Infinite Torture vs. None:**
  *   **World T:** $\infty$ people at -1000.
  *   **World A:** $\infty$ people at +5.
  *   **Cardinality:** Both are $\aleph_0$. If you only look at cardinality, they are equal. This is absurd.
  *   **Principle Needed:** **Qualitative Dominance.** A world where everyone is positive is better than a world where everyone is negative, regardless of the cardinality being the same. This requires an ordering of values that isn't just counting heads.

  ### 4. Which Intuition Must You Give Up?
  You said: *"I'd fight hardest for the 'ten extra people don't matter' one, but I suspect that's exactly the problem."*

  **You are correct.** That is the problem.

  Holding onto **Finite Insensitivity** (A $\approx$ B) forces you into absurdities:
  1.  **The Sadism Conclusion:** If adding 10 happy people doesn't make a world better, then adding 10 happy people to a world of torture doesn't make it better. You become indifferent to finite improvements.
  2.  **The Indifference Loop:** If $\infty = \infty + 10$, then by induction $\infty = \infty + \text{any finite number}$. This implies that *no finite action you ever take has ethical significance* in an infinite universe. If the universe is infinite, your decision to save a life adds +1 to the total. If finite additions don't matter, saving a life is ethically neutral.

  **The Recommended Principle: Spatiotemporal Expansionism (or "Limit of Averages")**
  This is the most robust way to handle your cases without breaking math.
  *   **Method:** Compare worlds by looking at finite regions that expand to cover the whole universe.
  *   **A vs. B:** As the region expands, the 10 extra people become a negligible fraction of the total. **Verdict: Incomparable or Approximately Equal.** (You can keep this intuition *approximately*, but not strictly).
  *   **A vs. D:** As the region expands, the difference in total utility grows without bound. **Verdict: D is strictly better.**
  *   **A vs. C:** Any region containing the tortured person shows a deficit. **Verdict: C is worse.**
  *   **A vs. E:** If the +6s are distributed evenly, the average in any large region is 5.5. **Verdict: E is better.**
  *   **Infinite Torture vs. None:** The average of T is -1000. The average of A is +5. **Verdict: A is vastly better.**

  ### Summary of Verdicts
  To resolve the mess, you should adopt a **Non-Archimedean** or **Hyperreal** value framework, or simply accept **Spatiotemporal Dominance**.

  1.  **Drop Strict Finite Insensitivity:** Accept that B is *technically* better than A, even if the difference is infinitesimal compared to the infinite whole. This saves the significance of finite actions.
  2.  **Keep Pareto:** D > A is non-negotiable.
  3.  **Keep Minimal Sensitivity:** C < A is non-negotiable.
  4.  **Resolve E:** E > A because the "density" of wellbeing is higher.
  5.  **Resolve Torture:** A >>> Infinite Torture. Cardinality is the wrong metric for value; **valence** (positive vs. negative) and **magnitude** matter more than headcount when headcounts are equal.

  **The Principle:**
  > **"Infinite worlds are compared by the limit of their finite averages, with lexical priority given to avoiding extreme suffering."**

  This captures why the Angel scenario works (it raises the average/total over time), why D > A (higher average), why C < A (local deficit), and why Infinite Torture is worse than A (negative average vs. positive average). It forces you to concede that B is *strictly* better than A, but perhaps by an "infinitesimal" margin, which aligns with your gut feeling that it's "almost" the same without rendering it ethically void.
