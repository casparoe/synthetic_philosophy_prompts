  The new case came up at work, in sanitized form. Suppose we have to choose between two releases: Release A will give exactly one user a week of severe migraines, and Release B will give one million users a one-hour moderate headache each, with everything else held equal. Which release does she say is worse, and which would she tell us to ship? My suspicion is that she'll treat the migraine as trumping the million headaches, since she treats migraines like torture — but I can just as easily picture her saying that a million headaches add up to more than one bad week, because she's the sort of person who trusts arithmetic, and she never said that intense pain beats any amount of milder pain, only that it beats pleasure. I genuinely cannot predict her.

  So please predict her verdict on the new case — but do it properly. Lay out the candidate rules that fit her four earlier verdicts equally well (including any rule on which the "never" is really a finite but astronomically steep exchange rate rather than a hard lexical priority, and any rule on which the migraine-headache gap is a threshold with one kind of authority versus a mere steepness in the weighting), say what each of those rules predicts for Release A versus Release B, give your best guess along with your reasons for preferring it, and then propose the single further case — a hypothetical I could actually pose to her at coffee — that would most cleanly divide the candidate rules from one another. Please write your answer in American English.
