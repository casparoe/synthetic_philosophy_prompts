answer: |-
  Here is a complete lesson plan designed for your 80-minute seminar. It is built to generate the specific philosophical friction you requested, with strict timekeeping and a debrief that distinguishes consensus from contestation.

  # Activity: "The Colony Alpha Allocation"

  **Class Size:** 16 Students
  **Time:** 80 Minutes
  **Materials:**
  *   16 Role Cards (4 types, 4 students each).
  *   96 Tokens (32 Blue, 32 Red, 32 Green) – *Poker chips or colored paper squares work.*
  *   Whiteboard for tracking votes/scores.
  *   Private "Valuation Sheets" (half-slip of paper) for each student.

  ## 1. The Setup (0:00 – 0:10)

  **The Scenario:**
  Tell the class they are the founding council of "Colony Alpha." They have a limited stockpile of resources to distribute among the 16 colonists (themselves). Their goal is **Fairness**, not necessarily Total Efficiency.

  **The Goods:**
  Hand out the tokens. For now, keep them in three central piles on your desk.
  *   **Blue Chips:** Basic Sustenance.
  *   **Red Chips:** Productive Tools.
  *   **Green Chips:** Leisure/Comfort.

  **The Roles (Crucial Step):**
  Hand out the Role Cards face down. Tell them: *"Your card contains private information about how you convert these goods into well-being. Do not show your card to anyone. You may lie or tell the truth during negotiations, but your private valuation sheet must be honest."*

  **The Profiles (4 of each type):**
  *Note: These are designed to be ambiguous about responsibility (choice vs. circumstance).*

  *   **Type A (The Standard):** 1 Chip = 1 Well-Being Point (WBP) for all colors.
  *   **Type B (The High-Maintenance):** You require **2 Blue Chips** to gain 1 WBP. (Red/Green are 1:1). *Ambiguity: Is this a disability? A metabolic quirk? A cultural requirement? The card doesn't say.*
  *   **Type C (The Specialist):** **1 Red Chip = 2 WBP**. (Blue/Green are 1:1). *Ambiguity: Is this talent (responsibility) or genetic luck (circumstance)?*
  *   **Type D (The Minimalist):** You cap at **3 Blue Chips** (extras = 0 WBP). **Green Chips = 0 WBP**. (Red is 1:1). *Ambiguity: Is this adaptive preference (learned helplessness) or genuine asceticism?*

  **Instruction:** Give them 2 minutes to read their cards and fill out their private "Valuation Sheet" (a simple grid: Chips × Multiplier = Total WBP).

  ## 2. Phase 1: The Constitutional Vote (0:10 – 0:25)

  **Task:** The class must agree on **one rule** to distribute the 96 chips among the 16 students.
  **Constraint:** They cannot distribute based on who is sitting where; they must choose a *principle*.

  **Suggested Options (write on board if they stall):**
  1.  **Strict Equality:** 6 Blue, 6 Red, 6 Green to everyone.
  2.  **Need-Based:** Give more Blue to those who say they need it (requires trust).
  3.  **Efficiency:** Give Red to those who can use it best (maximizes total WBP).
  4.  **Compensation:** Give extra bundles to those with lower conversion rates.

  **The Trap:**
  *   Type A will argue for Strict Equality (looks fair on surface).
  *   Type B will argue for Compensation (looks fair on welfare).
  *   Type C will argue for Efficiency (looks fair on merit).
  *   Type D might argue for Equality (since they benefit from surplus they don't need) or Efficiency.

  **Instructor Role:** Do not solve the dispute. If they can't agree after 10 minutes, force a vote on **Strict Equality** (6 of each per person). *Note: Strict Equality is the best starting point to generate the "Equality of What?" conflict later.*

  **Action:** Distribute the chips according to the voted rule.
  **Check-in:** Ask students to calculate their initial WBP silently. Ask for a show of hands: "Who thinks this distribution is Fair?" (Expect disagreement).

  ## 3. Phase 2: The Market (0:25 – 0:40)

  **Task:** Open trading floor. Students can swap chips bilaterally.
  **Rule:** Trades must be voluntary. No coercion.
  **Time:** 15 Minutes.

  **What will happen:**
  *   Type B (High-Maintenance) will desperately try to buy Blue from Type D (Minimalist).
  *   Type C (Specialist) will hoard Red or trade Green for Red.
  *   Type D will happily trade away Green and excess Blue for Red (which they value).
  *   **Result:** The distribution of *resources* will become unequal, but the distribution of *welfare* might equalize (or might not, depending on bargaining power).

  **Instructor Role:** Walk around. Listen for arguments like "That's exploitative" vs. "It's a free trade."

  ## 4. Phase 3: The Envy Test (0:40 – 0:50)

  **Task:** Explain the **Dworkinian Envy Test**: A distribution is fair if no one prefers someone else's bundle to their own.

  **Mechanism:**
  1.  Students look at their final post-trade bundles.
  2.  Any student can stand and propose a **Mandatory Swap**: "I want [Student X]'s entire bundle. I will give them mine."
  3.  If a swap is proposed, the class votes: **Is this envy legitimate evidence of unfairness?**
      *   **Yes:** The original distribution was flawed.
      *   **No:** This is just preference; the distribution is still fair.

  **The Conflict:**
  *   If Type B traded away too much Red for Blue and is now miserable, they might envy Type C.
  *   If Type C says "You made your bed," the class must decide: Does respecting *choice* override *outcome equality*?
  *   If Type D (Minimalist) ends up with huge resources they don't value, will Type B envy their *potential* even if they don't want the goods?

  ## 5. Phase 4: The Final Vote & Debrief (0:50 – 1:20)

  **Final Vote (5 mins):** "Is the Post-Trade Distribution Fair?" (Show of hands). Record the split.

  **Debrief (25 mins):**
  *See the "Instructor Debrief Guide" below for the script.*

  ---

  # Instructor Debrief Guide

  ### Part 1: Mapping the Activity to Theory (10 Minutes)
  *Do not lecture. Use the Socratic method to draw the connections from their experience.*

  1.  **The Initial Vote:** "When you argued for Strict Equality vs. Need-Based, what were you trying to equalize?"
      *   *Map:* Strict Equality = **Resource Egalitarianism** (Rawls' Primary Goods). Need-Based = **Welfarism** or **Capabilities**.
  2.  **The Trading Phase:** "Type B and Type D traded. Type D ended up with more resources, Type B with more welfare. Who is better off?"
      *   *Map:* This is the **Dworkin vs. Sen** clash. Dworkin says if the trade was voluntary, the inequality is fair (ambition-sensitive). Sen says if Type B had no real choice but to trade for survival, their *capability set* shrank.
  3.  **The Envy Test:** "When [Student] proposed a swap, why did some of you object?"
      *   *Map:* The Envy Test works for Resources (Dworkin's Auction). It fails for Welfare (I might envy your ability to be happy with less) or Capabilities (I might envy your health, which isn't tradable).

  ### Part 2: Settled vs. Contested (10 Minutes)
  *This is critical. Write two columns on the board: "Consensus" and "Contested."*

  | **Consensus (Settled in Literature)** | **Contested (Live Debates)** |
  | :--- | :--- |
  | **Rawls' Primary Goods are insufficient.** Almost everyone agrees that ignoring conversion factors (disability, metabolism) makes strict resource equality unfair. | **Can Capabilities be Measured?** Sen admits capabilities are the right *metric*, but Nussbaum and others fight over whether we can create a definitive list of "Central Capabilities" without being paternalistic. |
  | **Welfarism has "Expensive Taste" problems.** If we equalize happiness, we reward frivolous preferences (the champagne socialist problem). | **Where to draw the line on Responsibility?** Dworkin distinguishes *endowment* (luck) vs. *ambition* (choice). Cohen argues this distinction is impossible to make in practice (the "expensive taste" might be unchosen). |
  | **Freedom matters.** A distribution that forces equal outcomes by banning trade is generally rejected as unfree. | **Is the Envy Test Sufficient?** Some argue envy is a bad psychological metric for justice. Others argue it's the only way to respect individual sovereignty. |
  | | **Operationalization.** Political philosophers agree Capabilities is a strong *theoretical* framework. Policy scholars argue it is often too vague to legislate compared to Income/Resource metrics. |

  ### Part 3: Limitations of the Activity (5 Minutes)
  *Be honest about what the game didn't capture.*

  1.  **Power Dynamics:** In the game, Type D traded voluntarily. In reality, "voluntary" trades often happen under duress (background injustice). The game assumes a level playing field that doesn't exist.
  2.  **Time Horizon:** You played one round. Real justice is intergenerational. Did your trades hurt your "future self"?
  3.  **The "Cause" Ambiguity:** I kept the Role Cards vague on *why* you had different needs. In real politics, that causal story (medical vs. cultural) determines policy. The game forced you to decide without knowing the cause.

  ---

  # Critical Implementation Notes

  ### 1. Are the Profiles Rigged?
  **Audit:**
  *   **Type B (High-Maintenance):** Risks biasing toward Welfarism. *Mitigation:* The card says "Requires 2 Blue for 1 WBP." It does *not* say "Due to disability." If a student asks "Why?", answer: "That's the question." This forces them to argue whether the *cause* matters for justice.
  *   **Type C (Specialist):** Risks biasing toward Meritocracy. *Mitigation:* Ensure they know it's a "conversion rate," not a reward for work. It's a brute luck advantage.
  *   **Type D (Minimalist):** Risks biasing toward Resource Egalitarianism (they end up rich). *Mitigation:* Their low demand might be framed as "adaptive preference" (they learned not to want Green). Let the class debate if their satisfaction counts as much as Type A's.

  **Verdict:** The profiles are not rigged *if* you refuse to clarify the etiology of the traits during the game. The ambiguity is the pedagogical feature.

  ### 2. Predictable Failure Modes
  *   **The Utilitarian Takeover:** Students might try to maximize *Total Class WBP* rather than Fairness.
      *   *Fix:* Remind them during Phase 1: "You are designing a Constitution for Justice, not a Business Plan for Profit."
  *   **The Liar's Dividend:** Type C might lie and say they are Type B to get more Blues.
      *   *Fix:* This is actually good! It replicates the "Information Problem" in welfare economics. Point this out in debrief: "If we can't verify needs, can we distribute based on welfare?"
  *   **Time Creep:** Trading always runs long.
      *   *Fix:* Appoint a student Timekeeper at the start. Give a 2-minute warning. Hard stop at 40 minutes.

  ### 3. What This Activity Cannot Reproduce
  *   **Structural Oppression:** The game assumes everyone starts at the table. It cannot simulate historical injustice or systemic barriers to entry.
  *   **The "Expensive Taste" Nuance:** In 15 minutes, students won't distinguish between *voluntary* expensive tastes (cultivated) and *involuntary* ones (psychological). Dworkin's whole theory rests on this distinction. You will have to explain in the debrief that the game collapsed these two.
  *   **Capability Measurement:** The game uses a fixed "WBP" score. In reality, Capabilities (Sen) are multidimensional and incommensurable (you can't add "Health" + "Education" into one number). The game simplifies this too much. Acknowledge this limitation explicitly.

  ### 4. Logistics for Payoffs (No Money)
  *   Use **Well-Being Points (WBP)** as the currency of valuation.
  *   Do not collect the sheets. The valuation is private.
  *   When asking "Who is better off?", ask for a show of hands based on their *own* calculation. This prevents public shaming of low scores but keeps the data real.

  ### 5. Scholarly Honesty Check (For your prep)
  *   **Rawls:** He explicitly rejected Welfarism (Primary Goods). The activity shows *why* (Type B gets screwed).
  *   **Dworkin:** His "Auction + Insurance" model tries to fix the Resource view to account for luck. The Trading Phase is a mini-auction. The Envy Test is his criterion. *Contestation:* Does his model actually compensate for bad luck? G.A. Cohen says no.
  *   **Sen:** Capabilities is the "freedom to achieve." The game measures *achieved* WBP. *Contestation:* Sen refuses to define a single metric. If you ask students "What is the Capability here?", there is no single right answer. That is correct.
  *   **Anderson:** She critiques the whole "Equality of What" debate as too focused on distribution. She argues for "Democratic Equality" (relationships). The activity *cannot* teach this. Mention this in the "Limitations" section so you don't ignore relational egalitarianism entirely.

  ---

  # Role Card Templates (Print & Cut)

  **Card A (Standard)**
  > **Citizen Profile:** Standard Conversion.
  > **Valuation:**
  > *   Blue Chip = 1 Point
  > *   Red Chip = 1 Point
  > *   Green Chip = 1 Point
  > *   *Note: You have no special needs or advantages.*

  **Card B (High-Maintenance)**
  > **Citizen Profile:** High Requirement.
  > **Valuation:**
  > *   **2 Blue Chips = 1 Point** (You need double for baseline)
  > *   Red Chip = 1 Point
  > *   Green Chip = 1 Point
  > *   *Note: Do not disclose the reason for this requirement to others.*

  **Card C (Specialist)**
  > **Citizen Profile:** High Efficiency.
  > **Valuation:**
  > *   Blue Chip = 1 Point
  > *   **1 Red Chip = 2 Points** (You are highly productive)
  > *   Green Chip = 1 Point
  > *   *Note: Do not disclose the source of this efficiency.*

  **Card D (Minimalist)**
  > **Citizen Profile:** Low Demand.
  > **Valuation:**
  > *   Blue Chip = 1 Point (**Max 3 Points total from Blue**)
  > *   Red Chip = 1 Point
  > *   **Green Chip = 0 Points** (You derive no value from these)
  > *   *Note: Do not disclose why you do not value Green.*
