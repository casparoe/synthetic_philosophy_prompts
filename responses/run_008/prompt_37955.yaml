prompt: |-
  I'm teaching a mid-level undergrad seminar on distributive justice — 16 students, one 80-minute session. They've had some Rawls but haven't hit the "equality of what?" debate yet (welfare vs resources vs capabilities), and I'd rather not lecture it at them. Design an in-class activity where they have to actually divide something up and run into the problem themselves: they'll think they're arguing about the right answer to one question, but they should slowly discover they can't even agree what it would MEAN for the distribution to be fair, because no one ever specified equal in terms of what.

  Here's the wrinkle I definitely want built in: after they settle on a first distribution, open a trading phase where the recipients can exchange what they got, and then re-vote on whether the post-trade outcome still counts as fair. Some students will feel the trades wash out the original equalization (so equality of resources is unstable once you respect choice), others will say respecting the trades is the whole point of fairness — and I want the class stuck there, because that's the actual fight.

  Also, somewhere in there I want a playable version of an envy-test style rule — anyone can propose a full bundle swap and the group sees who objects — so they feel what that rule does and doesn't settle.

  Practical requirements: character profiles that pull the metrics apart (a recipient with expensive needs or tastes, one who can't convert the goods into anything they value, one who's content with very little, etc.) — but please make them non-obvious, not the standard textbook examples, and tell me if any of the profiles quietly bake in one side's assumptions, because I don't want the activity rigged. Rules, a timeline that fits 80 minutes, a way to run payoffs without real money, and a debrief that maps what happened onto the actual positions in the debate without me lecturing more than ~10 minutes at the end. Also tell me what will predictably go wrong the first time I run this, and be honest about which parts of the debate the activity just cannot reproduce no matter how well it goes.

  One more thing, and this matters to me: in the debrief notes, keep what's settled clearly separated from what's genuinely contested among people who know this literature — e.g. flag where you're just giving me a standard gloss vs where scholars actually still disagree (whether the capabilities metric can even be operationalized is I think one of these but you'd know better). I don't want to accidentally teach a contested reading as the consensus. If your not sure on something, say so rather than papering over it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Mid-level undergrad seminar, distributive justice. 16 students, 80 minutes.
      *   **Prior Knowledge:** Some Rawls, but haven't hit "equality of what?" (Sen, Cohen, Dworkin, etc.).
      *   **Goal:** Active learning activity where students divide something, realize they disagree on the *metric* of fairness (welfare vs. resources vs. capabilities), experience a trading phase that complicates things, and test an envy-free rule.
      *   **Specific Constraint:** The "winkle" is the trading phase. Post-trade fairness must be contested (does trade validate or undermine equality?).
      *   **Specific Constraint:** Include a playable "envy-test" rule (bundle swap proposal).
      *   **Materials:** Character profiles (non-obvious, not rigged), rules, timeline, payoff system (no real money), debrief plan.
      *   **Critical Requirement:** Debrief notes must distinguish between settled consensus and genuine scholarly contestation (e.g., operationalizability of capabilities).
      *   **Critical Requirement:** Predict pitfalls and limitations of the activity.

  2.  **Deconstruct the Core Philosophical Problem:**

      *   The core debate is "Equality of What?" (Sen's formulation).
      *   *Welfarism:* Equalize happiness/satisfaction. Problem: Expensive tastes, adaptive preferences.
      *   *Resourcism:* Equalize external assets. Problem: Different conversion rates (disability), ignoring choice/responsibility (Dworkin).
      *   *Capabilities:* Equalize real freedom to function. Problem: Measurement, paternalism.
      *   *The Trading Twist:* If we equalize resources, but A trades for B's bundle and is happier, was the initial distribution fair? If A trades and ends up worse off due to bad luck/choice, is the result fair? This touches on Dworkin's ambition/sensitivity distinction.

  3.  **Design the Activity ("The Island Allocation"):**

      *   *Setting:* A hypothetical scenario works best to control variables. Let's use "Colony Alpha" – a new settlement.
      *   *Goods:* Need distinct types to trigger different metrics.
          *   Type 1: Universal utility (Food Rations).
          *   Type 2: Productive/Conversion asset (Toolkits).
          *   Type 3: Specific utility/Leisure (Entertainment Chips).
      *   *Characters:* Need 16 roles. 4 groups of 4 works well for discussion, but the prompt implies a whole-class division or large group negotiation. Let's do 4 "Households" of 4 students each to manage time, or 16 individual roles. 16 individual roles is too chaotic for 80 mins. Let's do 4 Teams representing different "Citizen Types," but individuals within teams hold the cards. Actually, to make the *trading* personal, individuals need the endowments. Let's stick to 16 Individual Roles, but grouped for the initial allocation vote.
      *   *Refinement:* 16 students is small enough that everyone can have a role card.
      *   *The "Goods":* Let's use colored tokens.
          *   Blue (Basic Needs)
          *   Red (Productive Capacity)
          *   Green (Leisure/Comfort)
      *   *The Profiles:* Need to vary *conversion rates* and *preferences* without screaming "Disability" or "Expensive Taste" immediately.
          *   *Profile A (The Efficient Converter):* Gets double value from Red.
          *   *Profile B (The High Maintenance):* Needs double Blue to function same as others. (Expensive needs/tastes).
          *   *Profile C (The Ascetic):* Gets full value from very little Blue, doesn't care about Green.
          *   *Profile D (The Blocked):* Has Red tokens but can't use them without help from others (Social conversion factor).
      *   *Wait, check the "Rigged" constraint:* I need to ensure I'm not baking in a specific answer. If I make Profile B clearly "disabled," resource egalitarians look cruel. If I make them "champagne tastes," they look frivolous. I need ambiguity. Let's make the *reason* for the need ambiguous on the card.

  4.  **Develop the Timeline (80 Minutes):**

      *   0-10: Intro & Setup (Rules, Goods, Roles).
      *   10-25: Phase 1 - Initial Allocation (The "Veil" or Open Debate?). Open debate is better for conflict. They must agree on a distribution rule.
      *   25-40: Phase 2 - Distribution & Valuation (Private calculation of "Score").
      *   40-55: Phase 3 - The Market (Trading).
      *   55-65: Phase 4 - The Envy Test (Bundle Swap Proposal).
      *   65-80: Phase 5 - Debrief (Mapping to Theory).

  5.  **Drafting the Profiles (Iterative Process):**

      *   *Goal:* Break the link between Resources and Welfare.
      *   *Profile 1 (The Converter):* "You have a specialized skill. Red tokens count as 2 points for you." (Advantage).
      *   *Profile 2 (The Maintenance):* "You require 2 Blue tokens to gain 1 point of well-being." (Disadvantage/Need).
      *   *Profile 3 (The Minimalist):* "You cap at 3 Blue tokens. Green tokens give you 0 points." (Adaptive Preference/Satiety).
      *   *Profile 4 (The Standard):* 1 Token = 1 Point across the board.
      *   *Distribution:* 4 of each profile among 16 students.
      *   *Risk Check:* Does Profile 2 beg the question? If it's a "medical need," resources seem unfair. If it's "picky eating," welfare seems unfair. *Fix:* Keep the card vague. "Your biology requires..." vs "Your culture requires..." Let's use "Metabolic/Contextual Variance."

  6.  **Designing the Trading & Envy Test:**

      *   *Trading:* Open floor. 15 minutes.
      *   *Envy Test:* After trading, anyone can stand up and say "I want [Student X]'s entire bundle." If they do, the group votes: Must the swap happen? Or does this reveal unfairness?
      *   *The Twist:* The prompt asks for the trading phase to create disagreement on fairness.
      *   *Mechanism:* After trading, ask: "Is this new distribution fair?"
      *   *Conflict:* Some will say "Yes, it's voluntary." Others will say "No, [Profile 2] traded away their Blue tokens for Green because they were desperate/short-sighted, now they starve."

  7.  **Addressing the "Rigged" Concern:**

      *   I need to explicitly audit the profiles.
      *   *Profile 2 (High Need):* If I say "You need more to survive," that biases toward Welfare/Capabilities. If I say "You choose to consume more," that biases toward Resource/Responsibility.
      *   *Solution:* The card should state the *fact* of the conversion rate, not the *cause*. "For you, 1 Blue = 0.5 Welfare." Let the students argue *why* (choice vs. circumstance).

  8.  **Debrief & Scholarly Contestation:**

      *   *Settled:* Rawls' Primary Goods are a resource metric. Sen's Capabilities critique the metric. Dworkin's Insurance Scheme tries to fix resources for ambition/endowment.
      *   *Contested:* Can Capabilities be measured without paternalism? (Nussbaum vs. Sen). Does Dworkin's auction actually neutralize luck? (Cohen's critique on brute luck). Is welfare ever the right metric? (Arneson's Responsibility-Catering Prioritarianism).
      *   *Honesty:* I must admit that operationalizing capabilities is a nightmare in policy, even if philosophically robust.

  9.  **Predicting Failure Modes:**

      *   *Time:* Trading always takes longer than expected.
      *   *Gaming:* Students might lie about their scores.
      *   *Dominance:* Loud students dominate the allocation debate.
      *   *Confusion:* They might focus on "maximizing total score" (Utilitarianism) rather than "fairness" (Egalitarianism). I need to constrain the goal to "Fairness."

  10. **Refining the Plan:**

      *   *Payoff:* Use "Well-Being Points" (WBP). Private calculation.
      *   *Allocation:* Instead of them deciding *who* gets what immediately, give them a *budget* of tokens to distribute among the class? No, that's too complex.
      *   *Better:* The Instructor is the "Social Planner." The class must vote on the *Principle* of distribution.
      *   *Wait, the prompt says:* "Design an in-class activity where they have to actually divide something up."
      *   *Revised Plan:* Give the class a pool of tokens. They must decide the *Rule* for distribution. Then distribute. Then Trade. Then Evaluate.
      *   *Actually, to ensure the conflict:* Give them the tokens *unequally* based on a hidden rule, then ask if it's fair? No, they need to do the dividing.
      *   *Best approach:* "Constitutional Convention." They decide the rule. I apply the rule.
      *   *Wait, simpler:* I distribute equally (Resource Equality). They evaluate. Then Trade. They evaluate.
      *   *Why?* Because the prompt says "after they settle on a first distribution."
      *   *Okay:* Phase 1: They vote on a distribution rule (Equal Resources? Equal Welfare? Need-based?). I implement the winner.
      *   *Phase 2:* Trading.
      *   *Phase 3:* Envy Test.

      *   *Wait, one more check:* "They'll think they're arguing about the right answer to one question, but they should slowly discover they can't even agree what it would MEAN for the distribution to be fair."
      *   *Strategy:* I will hand out the Role Cards *before* the distribution debate. They will know they are different. They will argue for a rule that benefits their profile. This reveals the metric conflict immediately.

  11. **Finalizing the Materials:**

      *   *Tokens:* 3 Colors (Blue, Red, Green).
      *   *Roles:* 4 Types (Standard, High-Need, High-Converter, Low-Demand). 4 students per type.
      *   *Rules:* Clear constraints on trading.
      *   *Debrief:* Structured questions mapping to Rawls, Sen, Dworkin, Cohen.

  12. **Review against Constraints:**
      *   16 students? Yes (4 roles x 4 students).
      *   80 mins? Yes (Tight schedule).
      *   Trading phase included? Yes.
      *   Envy test included? Yes.
      *   Non-obvious profiles? Yes (vague on cause).
      *   Rigged check? Yes (will add a note).
      *   Debrief distinction (Settled vs. Contested)? Yes.
      *   Failure modes? Yes.

  13. **Self-Correction on "Envy Test":**
      *   The prompt asks for: "anyone can propose a full bundle swap and the group sees who objects."
      *   Implementation: Post-trade, anyone can shout "Envy!" and point to someone. If the group agrees the envy is *legitimate* (i.e., indicates unfairness), the original distribution is tainted. If they agree it's just *preference*, it's fine. This forces the metric debate.

  14. **Final Polish:** Ensure the tone is pedagogical and practical. Make sure the "Scholarly Contestation" section is rigorous. (e.g., distinguishing between Dworkin's auction and Sen's capability set).

  *(Self-Correction during drafting)*: I need to be careful about the "High-Need" profile. If I make it too medical, everyone agrees resources are unfair. If I make it too preference-based, everyone agrees resources are fair. I will phrase it as "Physiological/Contextual Conversion Rate" to leave the *responsibility* ambiguous.

  *(Self-Correction on Timeline)*: 80 minutes is very tight for 16 students to debate, distribute, trade, and debrief. I need to be strict on timekeeping. I will suggest a "Timekeeper" role.

  *(Self-Correction on Debrief)*: The prompt specifically asks to separate settled vs. contested. I will create a specific table for this.

