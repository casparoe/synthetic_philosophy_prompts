answer: |-
  **Setting:** *A small conference room off the main hospital atrium. Early morning. Coffee cups are scattered on the table. Elena (Luck Egalitarian) and Marcus (Relational Egalitarian) are reviewing the agenda for the Clinical Ethics Committee meeting.*

  **Elena:** Thanks for meeting early, Marcus. I know the triage protocol is the flashpoint today. I've read your memo. You argue that introducing responsibility-sensitivity violates the normative basis of the doctor-patient relationship.

  **Marcus:** And I've read yours. You argue that ignoring responsibility violates the normative basis of fairness among patients. We're at an impasse, Elena. If we walk into that room shouting past each other, the administration will just impose a utilitarian cost-benefit analysis, and neither of us wants that.

  **Elena:** Agreed. Let's start with the clearest divergence. The rock climber. Mr. Henderson. Third fracture, same ankle. First two surgeries were fully covered. Now he's back, and the queue is long. My position is straightforward: this is paradigmatic option luck. He engaged in a voluntary, high-risk activity. He knew the odds. To prioritize him over a patient with a degenerative condition they did nothing to invite is to subsidize his hobby at the expense of their health.

  **Marcus:** I understand the logic. But ask yourself what the hospital *says* when it acts on that logic. If we deprioritize Mr. Henderson, we aren't just managing a queue; we are expressing a judgment. We are telling him that his standing as a claimant on our shared institutions is diminished because of how he chooses to live. Elizabeth Anderson's point is that equality isn't about distributing goods based on moral worthiness; it's about relating to one another as equals.

  **Elena:** But isn't it unequal to force the prudent to wait longer for the imprudent? That's the Dworkin point. If we treat all bad health outcomes as morally equivalent, we ignore the distinction between circumstance and choice. We treat patients like passive vessels of misfortune rather than agents. I'm not saying we deny him care. I'm saying his place in the queue should reflect that he assumed this risk voluntarily.

  **Marcus:** Here is where I have to concede a theoretical difficulty, and I want to be honest about it with you. If I stick strictly to relational equality—if I say "Mr. Henderson is our equal, therefore he stands in the same line"—I don't actually have a metric to tell the committee who goes *first* when resources are scarce. If need is the only metric, and both he and the degenerative patient have equal need, relational equality alone doesn't break the tie. I struggle to give you a determinate verdict on the climbing case without smuggling in some notion of desert, which I reject.

  **Elena:** That's a significant concession, Marcus.

  **Marcus:** It is. But my reluctance to use desert doesn't validate your solution. Even if I can't solve the queue mathematically, I know that investigating Mr. Henderson's lifestyle to determine his "responsibility score" creates a hierarchy of citizenship. It turns the clinic into a courtroom. You say queue position isn't a judgment of character. But in practice, patients experience it exactly that way.

  **Elena:** Let's move to the case where that distinction matters more. The smoker. Ms. Gable. Needs a lung resection. Thirty-year habit. Five documented attempts to quit. This is where your view risks collapsing into "healthcare no matter what," and mine gets nuanced. You assume I want to penalize her for "choosing" to smoke. I don't. Following Roemer, we have to look at whether her smoking is a matter of effort or circumstance.

  **Marcus:** And how do you measure that without humiliating her?

  **Elena:** We group her by "type." We look at the population of long-term smokers. We ask: what is the average quitting success rate for someone with her demographic and history? If most people in her reference group fail to quit, then her failure is largely brute luck—genetics, addiction physiology, environment. We compensate for that. If she were in a group where quitting is common and she didn't, *then* it's option luck. I'm not asking if she's a bad person. I'm asking about the causal weight of her addiction versus her agency.

  **Marcus:** But the inquiry *is* the harm. To implement your policy, I, as a clinician, have to sit across from Ms. Gable and effectively audit her willpower. I have to decide if her addiction is "real enough" to count as brute luck. That interaction itself establishes a relationship of superiority and inferiority. I am the judge; she is the supplicant. Anderson argues that luck egalitarianism abandons the imprudent to the consequences of their choices, but in your version, you're not abandoning her, you're interrogating her.

  **Elena:** I'd rather interrogate her than abandon the non-smoker with lung cancer from radon exposure. If we don't make this distinction, we are effectively taxing the non-smoker to pay for the smoker's preference. You call it a relationship of superiority. I call it a recognition of agency. If we treat her addiction purely as a misfortune, we deny her capacity to have influenced her life. We infantilize her.

  **Marcus:** There is a difference between recognizing agency and making that recognition the condition of medical care. But let's look at the third case. The construction worker. Mr. Ruiz. Genetic predisposition to hypertension, works two jobs, no time for exercise, untreated for ten years. Now he needs elective cardiac intervention.

  **Elena:** This is the easiest case for me. This is pure brute luck. Genetics are obvious. Poverty and time scarcity are circumstances beyond his control. Under my framework, Mr. Ruiz gets high priority. He is a victim of misfortune, not risk-taking.

  **Marcus:** And I agree he gets high priority. But notice what happened there. You prioritized him because he *isn't* responsible. I prioritize him because he is a fellow citizen whose health is necessary for him to function as an equal in society. We get the same result, but for different reasons. However, your framework creates a problem here. To justify helping Mr. Ruiz, you have to implicitly judge him as "not responsible." You have to verify his poverty, verify his genetics, to ensure he isn't secretly "choosing" this.

  **Elena:** Verification is administrative, not moral.

  **Marcus:** It's moral because it defines the terms of his inclusion. He is welcomed in only if he is blameless. What about the person who *did* make bad choices but is now desperate? Your theory leaves them on the edge. If a patient *was* negligent, truly option luck, your theory says we owe them less.

  **Elena:** It says we owe them *emergency* care, absolutely. We don't let them die. But for *elective* procedures—quality of life improvements—fairness dictates that those who preserved their health for the sake of others, or simply through caution, shouldn't be behind those who didn't. This addresses the "harshness objection." We aren't letting them suffer catastrophically; we are asking for a contribution in the form of patience.

  **Marcus:** But that patience is a cost. And it's a cost levied disproportionately against people whose "choices" are often shaped by the very structural inequalities you identified in Mr. Ruiz's case. The smoker, Ms. Gable? She grew up in a food desert, targeted by advertising, stressed by precarious work. You draw a line between brute and option luck. I see a continuum where "option luck" is just privilege in disguise.

  **Elena:** That's why the Roemer "types" approach is crucial. If her environment made quitting statistically improbable, I classify it as brute luck. I am not blind to structural oppression, Marcus. My theory demands we compensate for it. Your theory demands we ignore the distinction.

  **Marcus:** I demand we treat the distinction as irrelevant to *standing*. If I accept your triage protocol, I institutionalize the idea that some people are less deserving of care. Even if you calculate it kindly, the message is: "We help you because you couldn't help yourself, not because you belong here."

  **Elena:** And if I accept your protocol, I institutionalize the idea that the prudent are suckers. "Your caution doesn't count; your health is a common pool to be drawn down by anyone."

  **Marcus:** So here we are. On the climber, I admit my theory doesn't give me a clean algorithm for the queue, though I know investigating him damages our relationship. On the smoker, you admit you must audit her agency to determine her luck, which I say is inherently shaming. On the worker, we agree on the outcome but disagree on whether his blamelessness is the ticket to entry.

  **Elena:** Precisely. We aren't arguing about the patients. We're arguing about the point of the hospital.

  **Marcus:** Is the hospital an instrument of distributive justice, meant to correct for the unfairness of the natural and social lottery?

  **Elena:** Yes. To the extent that health is a primary good, its distribution should reflect choice, not chance.

  **Marcus:** Or is the hospital a civic institution, meant to guarantee that all citizens can stand face-to-face without shame or deference?

  **Elena:** If standing face-to-face means the careful wait longer so the reckless don't feel judged, then that standing is built on a lie.

  **Marcus:** And if correcting the lottery means we must scrutinize every patient's life history to see if they are "worthy" of the queue, then the standing is already broken.

  **Elena:** So we can't recommend a unified policy.

  **Marcus:** No. The stalemate is on the moral premise of entitlement. You believe entitlement is sensitive to individual responsibility. I believe entitlement is sensitive only to membership in the community.

  **Elena:** Then we present both reports. I will recommend a responsibility-sensitive queue with robust protections for addiction and structural disadvantage, using the "types" model to minimize stigma.

  **Marcus:** And I will recommend a needs-based queue, arguing that any inquiry into lifestyle for triage purposes chills the doctor-patient relationship and undermines the expressive function of public health.

  **Elena:** It's a clean divergence. The committee will have to choose: do they want fairness as neutrality, or fairness as social relations?

  **Marcus:** And whichever they choose, someone loses. Either the prudent lose their priority, or the imprudent lose their dignity.

  **Elena:** Then let's make sure the arguments are clear enough that they know exactly what they're trading away.

  **Marcus:** Agreed. Coffee?

  **Elena:** Please. Black. No sugar. I prefer to control my own luck.

  **Marcus:** *(Smiles faintly)* I'll buy. That's one risk I'm willing to share.
