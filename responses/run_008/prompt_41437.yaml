          *   *Relational Egalitarian (RE):* Committed to Elizabeth Anderson's critique (Equality as social relations, not distribution). Believes LE humiliates the unfortunate and mistakes the point of equality (standing as equals).
      *   **Context:** Hospital Clinical Ethics Committee. Meeting *before* the formal session to discuss responsibility-sensitive triage for elective procedures.
