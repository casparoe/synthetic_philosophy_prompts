answer: |-
  # Facilitator's Plan: The Dual-Ledger Tournament

  ## 1. Mechanic Brainstorming & Selection

  **Candidate 1: The Elimination Bracket.** Groups compete; losing groups are eliminated, and winning groups split into new groups.
  *Critique:* Too binary. Elimination removes the "within-group" pressure in later rounds because the losers vanish. It also makes the "re-scoring" difficult because the population size shrinks, obscuring frequency changes.

  **Candidate 2: The Token Market.** Students trade "cooperation tokens" for "fitness points." A central bank adjusts exchange rates based on global supply.
  *Critique:* Too abstract. It simulates market dynamics better than evolutionary selection. It distances the student from the visceral tension of "my gain vs. our gain."

  **Candidate 3: The Fixed-Group Pot (Selected).** Students are in fixed groups for multiple rounds. They contribute to a group pot (Cooperate) or keep resources (Defect). Payoffs are calculated such that Defectors always beat Cooperators *within* a group, but Groups with more Cooperators outscore Groups with more Defectors.
  *Rationale:* This creates the exact mathematical structure required for the Units of Selection debate (Price Equation intuition). It keeps the history of play constant (same cards, same points) while allowing us to aggregate the data differently in the debrief to show the "Ledger Line" problem. It is logistically simple enough for 80 minutes.

  ---

  ## 2. Game Specification: "The Dual-Ledger Tournament"

  **Logistics**
  *   **Time:** 80 Minutes (30 min Play, 50 min Debrief).
  *   **Students:** 16 (4 Groups of 4).
  *   **Room:** Flat classroom. Move desks into 4 clusters of 4.
  *   **Materials:**
      *   64 Index Cards (32 marked **C**, 32 marked **D**). *Note: Each player gets one C and one D card to hold.*
      *   Poker chips or paper slips ("Fitness Points").
      *   Whiteboard & Markers (3 colors: Black, Red, Blue).
      *   4 "Group Score Sheets" (paper).
      *   1 "Master Ledger" (drawn on board).
      *   Small prize (candy or "homework pass") for the **Top Individual Scorer**. *Crucial for motivation.*

  **The Payoff Structure (The Engine)**
  This is designed to guarantee the **Averaging Fallacy** condition (Selfish wins locally) while allowing **Group Selection** (Cooperators win globally).
  *   **Endowment:** Every player starts each round with **10 Points**.
  *   **Action:** Simultaneously play **C** or **D**.
  *   **Cost/Benefit:**
      *   **Play C:** You pay **5 points**. The Group Pot gains **8 points**.
      *   **Play D:** You pay **0 points**. The Group Pot gains **0 points**.
  *   **Distribution:** The Group Pot is divided equally among all 4 members, regardless of contribution.
  *   **Round Score:** $10 - (\text{Cost}) + (\text{Share of Pot})$.

  *Why this works:*
  *   **Within-Group:** In a mixed group, a D player saves the 5-point cost but gets the same share of the pot as a C player. D always scores higher than C *in the same group*.
  *   **Between-Group:** A group of 4 Cs generates 32 points for the pot (8 each). Share = 8. Net Score = $10 - 5 + 8 = 13$. A group of 4 Ds generates 0. Net Score = 10. Cooperative groups outperform selfish groups.

  **Procedure**

  **Phase 1: Setup (5 mins)**
  1.  Seat students in 4 groups (Alpha, Beta, Gamma, Delta).
  2.  Distribute cards (each student holds one C, one D).
  3.  Distribute 10 chips to each student.
  4.  **Motivation Speech:** "At the end, the student with the highest *individual* total score wins the prize. However, I will also announce which *Group* had the highest collective score. Play for yourself."

  **Phase 2: The Rounds (20 mins)**
  *   **Round 1:**
      1.  Students choose C or D secretly.
      2.  Reveal simultaneously.
      3.  Group Recorder calculates the Pot and individual scores.
      4.  Pay out chips. (Students keep a running tally on paper).
      5.  *Facilitator Note:* Walk around. If a group is all-C, whisper to one player: "Remember, the prize is individual." Encourage defection.
  *   **Round 2 & 3:**
      1.  Repeat.
      2.  **Do not reshuffle groups.** Keep them fixed. This preserves the "Group" as a unit of variance.
      3.  After Round 3, collect all Score Sheets.

  **Phase 3: The Data Freeze (5 mins)**
  1.  Tell students: "The game is over. Do not change your tallies."
  2.  On the Whiteboard, draw the **Master Ledger**.
  3.  Ask Group Recorders to read out:
      *   Number of Cs played in Round 3.
      *   Total Group Score in Round 3.
      *   Individual Scores of each player in Round 3.
  4.  Fill the board. (See Debrief section for how to use this).

  ---

  ## 3. The Debrief: The Two-Ledger Demonstration (50 mins)

  This is the core philosophical work. You are not just discussing the game; you are re-describing the *same numbers* to show the Units of Selection debate is often about bookkeeping.

  ### Step 1: Elicit the Intuition (10 mins)
  Ask the class: "Look at the Round 3 data. Did Cooperation (C) or Defection (D) perform better?"
  *   **Expected Response:** "D performed better. In every mixed group, the D player has more chips than the C players."
  *   **The Trap:** Ask, "So, if we played a 4th round, should the frequency of C go up or down?"
  *   **Most Students:** "Down. D wins."
  *   **The Reveal:** Calculate the *Global* Average Score of C players vs. D players across the whole room.
      *   *Setup Check:* Ensure your facilitation during the game resulted in at least one "All C" or "Mostly C" group and one "Mostly D" group.
      *   If Group Alpha (4 Cs) averaged 13 pts, and Group Beta (4 Ds) averaged 10 pts, the *Global Average* for C might be higher than D, even if D beat C locally.
      *   **Point:** "Locally, D wins. Globally, C might win. How is that possible?"

  ### Step 2: The Averaging Fallacy (10 mins)
  A student will inevitably say: *"But look at Group Beta. The Defector got 16 points and the Cooperator got 11. You can't say Cooperation is better when it loses head-to-head."*
  *   **Validate:** "This is the **Averaging Fallacy**. It assumes that because the trait loses within every subgroup, it must lose in the total population. It ignores that the subgroups themselves are growing/shrinking at different rates."
  *   **Visual:** Draw two buckets. Bucket A (Coop Group) has 4 people with 13 chips each. Bucket B (Selfish Group) has 4 people with 10 chips each.
  *   "If 'fitness' means 'chips determine how many copies of you exist next round', Bucket A contributes 52 chips to the next gen. Bucket B contributes 40. The *Cooperative Strategy* is carried by the higher-scoring bucket."

  ### Step 3: The Two-Ledger Re-Scoring (20 mins)
  *This is the prompt's core requirement.* You will now show that the dispute is about where we draw the ledger lines.

  **Ledger 1: The Group-Selection Account (Use Red Marker)**
  *   Draw a table on the left.
  *   **Rows:** Groups (Alpha, Beta, Gamma, Delta).
  *   **Cols:** % Cooperation, Group Mean Fitness.
  *   **Narrative:** "Here, the unit of selection is the **Group**. We ask: Do groups with more Cooperation have higher Fitness?"
  *   **Plot the data:** You will likely see a positive correlation. High %C $\rightarrow$ High Group Score.
  *   **Conclusion:** "Cooperation spread because Cooperative groups out-reproduced Selfish groups."

  **Ledger 2: The Gene's-Eye Account (Use Blue Marker)**
  *   Draw a table on the right.
  *   **Rows:** Individuals (1 to 16).
  *   **Cols:** Strategy (C or D), Individual Fitness.
  *   **Narrative:** "Here, the unit of selection is the **Gene (Strategy)**. We ask: Does the C card have higher fitness than the D card?"
  *   **The Trick:** Calculate the *Global Average Fitness* of C vs D.
      *   Avg Fitness (C) = (Total Score of all C players) / (Total # of C players).
      *   Avg Fitness (D) = (Total Score of all D players) / (Total # of D players).
  *   **Plot the data:** If your game ran correctly, Avg Fitness (C) > Avg Fitness (D).
  *   **Conclusion:** "Cooperation spread because the C strategy had higher average fitness than the D strategy."

  **The Synthesis (Black Marker)**
  *   Draw an arrow between the two ledgers.
  *   **Say:** "Look at the numbers. They are identical. I did not change a single chip count. I only changed how I summed them."
  *   **Ledger 1** sums *within* groups first, then compares groups.
  *   **Ledger 2** sums *across* all individuals of a type, ignoring group borders.
  *   **The Philosophical Point:** "The debate isn't about *what happened*. It's about which description is more useful. The Group account highlights the *structure* (variance between groups). The Gene account highlights the *net result* (frequency change). Both are true descriptions of the same causal process."

  ### Step 4: Closing the Loop (10 mins)
  *   Ask: "Why did I offer a prize for Individual Score?"
  *   Answer: "To simulate the 'Within-Group' pressure. You felt the temptation to Defect even if you knew it hurt the group. That tension is real selection pressure, not just a game rule."
  *   Final takeaway: "Units of selection are not mutually exclusive realities. They are analytical lenses. The Price Equation (which we will read next week) is just the math that proves these two ledgers must always balance."

  ---

  ## 4. Honest Assessment: Pitfalls & Limitations

  ### What Will Predictably Go Wrong (and How to Handle It)

  1.  **The "All-Defect" Collapse:**
      *   *Risk:* Students are too cynical. All 4 groups play All-D. Global C frequency drops to zero. The "Group Selection" effect vanishes because there is no variance between groups (all groups scored 10).
      *   *Fix:* **Facilitator Intervention.** Between Round 1 and 2, announce: "I notice some groups are scoring 10 and some 13. Just a reminder, the Group Prize goes to the highest *total* score." This nudges one group to try Cooperation without forcing it. You need *variance* between groups for the game to work.
  2.  **Math Anxiety/Slowness:**
      *   *Risk:* Calculating pots and shares eats 20 minutes.
      *   *Fix:* Pre-print "Payoff Tables" for each group.
          *   *Table:* "If 1 person plays C, C gets X, D gets Y."
          *   Students just look up their score instead of calculating.
  3.  **The "Moralizing" Trap:**
      *   *Risk:* Students argue Cooperation is "morally better" and ignore the fitness math.
      *   *Fix:* Ruthlessly steer back to *frequency*. "I don't care if it's nice. I care if the number of C cards increases. In this game, 'Good' means 'More Copies'."

  ### What The Game Cannot Reproduce (Verbal Supply Required)

  1.  **Agency vs. Blind Variation:**
      *   *Limitation:* Students *choose* C or D based on reasoning. Genes do not choose; they are replicated or lost.
      *   *Verbal Supply:* In the debrief, explicitly state: "You played with foresight. In evolution, the 'C' card doesn't know it's in a high-scoring group. It just gets copied more often. The *outcome* is the same, but the *mechanism* is blind."
  2.  **Equivalence vs. Analogy:**
      *   *Limitation:* The two-ledger demo shows that the *data* supports both narratives. It does not prove the *causal mechanisms* are identical. In biology, group selection requires specific structures (limited migration, etc.) that the Gene's Eye view abstracts away.
      *   *Verbal Supply:* "The ledgers show mathematical equivalence (the Price Equation). They do not show causal equivalence. When we say 'Gene's Eye View,' we are using a bookkeeping trick to predict outcomes without modeling every group interaction. It's a tool, not necessarily a metaphysical truth about what the organism 'wants'."
  3.  **The "Replicator" Concept:**
      *   *Limitation:* Students remain the same people throughout. They don't die or get born.
      *   *Verbal Supply:* "When we calculated 'Next Generation' on the board, we simulated replication. In the game, you kept your chips. In evolution, high chips = more offspring carrying the card. Keep that translation in mind."

  ### Final Facilitator Note
  The success of this session hinges on the **Re-Scoring**. Do not rush it. If you run out of time, cut a round of play, not the debrief. The game is not the lesson; the *re-description of the game* is the lesson. Ensure the whiteboard clearly shows the **same numbers** organized in **two ways**. That visual identity is what breaks the Averaging Fallacy.
