answer: |-
  Your instinct is correct: your friend is proving too much, but not because the Pasadena Game isn't a problem. It *is* a problem, but it's a problem for a specific *formulation* of Expected Value (EV) theory, not for the framework as a whole. The argument contains a technical conflation in steps (1)–(3) and a philosophical overreach in step (6).

  Here is the breakdown of where the argument goes wrong, why it looked plausible, and what the "patch" actually costs you.

  ### 1. The Technical Error: Steps (1) through (5)

  The rot starts in **(1)** and is exploited in **(3)**.

  **The Mistake:** Your friend is treating the expected value as a *series summation* dependent on the indexing of outcomes, rather than as a *Lebesgue integral* defined over a measure space.

  In rigorous probability theory (the Kolmogorov axiomatization), the expectation $E[X]$ of a random variable $X$ is defined as the Lebesgue integral $\int X \, dP$. A fundamental property of the Lebesgue integral is that it is **order-independent**. However, for the integral to be well-defined, the random variable must be **absolutely integrable**. That is, we require:
  $$ \sum |p_i \cdot v_i| < \infty $$
  If this condition holds, the series converges absolutely, and rearrangement is impossible (the sum stays the same). If the series is only *conditionally* convergent (like the Pasadena Game), the Lebesgue integral **does not exist**.

  **Why it looked fine:** In introductory decision theory, EV is often introduced as $\sum p_i v_i$ without stressing the absolute convergence requirement. This allows the Riemann Rearrangement Theorem (which applies to conditionally convergent *series*) to be smuggled in.

  **The Correction:** Step (3) is misleading. Rearranging the outcomes doesn't give the gamble "every expected value simultaneously." Rather, the fact that rearrangement *changes* the sum proves that **the expectation is undefined.**

  So, Step (5) is actually correct, but not for the reason your friend thinks. It's not that "mere convergence isn't enough"; it's that **absolute convergence is the definition of having an expectation.** The Pasadena Game does not have an expected value. It is not $\ln 2$, and it is not "all numbers." It is null.

  **The Cost of this Patch:**
  You must accept that **some gambles literally have no expected value.** This creates "gaps" in the rational preference ordering. If you offer me the Pasadena Game vs. receiving $\$1$, EV theory cannot tell me which to choose, because the Pasadena side of the equation is blank. You lose the completeness of the preference relation for infinite gambles.

  ### 2. The Philosophical Overreach: Step (6)

  This is where your friend's "death of EV" claim falls apart. The move from "Infinite pathological games have no EV" to "Real-world EV reasoning is dead" is a category error.

  **The "Altitude" Argument:** Your friend cites Hájek's claim that we can construct "altitude" cases where real-world decisions mimic Pasadena. The argument is: *For any bound $B$, there is a possible outcome with utility $> B$.* Therefore, real-world utility is unbounded, and fat tails exist.

  **Why this is weak:**
  1.  **Bounded Utility:** Most decision theorists (following Daniel Bernoulli and Karl Menger) argue that rational utility *must* be bounded. There is a physical limit to how much good can be done or how much pleasure can be experienced. If utility is bounded (say, capped at some huge number $U_{max}$), then $|p_i \cdot v_i|$ is always bounded by $p_i \cdot U_{max}$. Since $\sum p_i = 1$, the sum converges absolutely. **If utility is bounded, the Pasadena Game cannot exist.**
  2.  **Physical vs. Mathematical Possibility:** Just because you can *write down* a payoff function that grows like $2^n/n$ doesn't mean the universe can *instantiate* it. Real-world distributions (climate outcomes, insurance risks) generally have exponential or faster decay in probability that outpaces the polynomial growth of payoff. The "fat tails" in real life are rarely fat enough to break absolute convergence unless you assume unbounded utility.
  3.  **Truncation:** Even if tails are fat, for any *practical* decision, the probability of the "Pasadena-like" outcomes occurring is below the threshold of physical possibility (e.g., probability less than $10^{-100}$). Truncating the distribution at a reasonable point restores absolute convergence with negligible error.

  **The Cost of this Patch:**
  To save EV for real decisions, you must commit to **Bounded Utility**. This is a substantive philosophical claim. It means you must deny that, for example, saving an infinite number of souls (theological cases) or preventing an infinite disutility is a coherent concept. It forces you to say that there is *some* amount of good such that adding more good makes no difference to the value of the outcome. Many find this counterintuitive, but it is the standard price of admission for coherent EV theory.

  ### 3. Summary: How to Reply to Your Friend

  You can tell your friend that his argument is a valid *reductio ad absurdum*, but it kills a straw man, not Expected Value theory itself.

  1.  **Reject (1):** Update the definition of EV to require **Absolute Convergence** (standard Measure Theory).
  2.  **Reject (4):** The game doesn't have "every value"; it has **no value**.
  3.  **Reject (6):** Real-world decisions do not instantiate the Pasadena structure because **Utility is Bounded** (or probabilities decay fast enough).

  **The Defensible Conclusion:**
  Expected Value theory is not dead, but its domain is restricted.
  *   **For finite gambles:** EV works perfectly.
  *   **For infinite gambles:** EV works *if and only if* the utility function is bounded or the probability decay is sufficiently fast to ensure absolute convergence.
  *   **For Pasadena-style cases:** EV is silent. You need a different decision rule (e.g., Relative Expectation Theory, or simply acknowledging rational indeterminacy).

  **Is the patch ad hoc?**
  No. Requiring absolute convergence isn't a "shut up and compute" rule; it's the standard mathematical requirement for integration. Rejecting unbounded utility isn't ad hoc either; it's a solution to the St. Petersburg Paradox that has been standard since Menger (1934).

  **The Real Bullet to Bite:**
  If you want to keep EV theory, you must bite the bullet that **there is a maximum possible value to any outcome.** If your friend insists that utility *must* be unbounded (e.g., "I can always imagine a world twice as good"), then yes, EV theory *in its standard form* breaks down. But that is a failure of the *utility model*, not the *expectation operator*. In that case, the solution is to fix the utility function, not abandon the decision theory.

  ### Recommendation for Seminar
  Suggest looking into **Arntzenius, Elga, and Hawthorne (2004), "Infinity and Decision Theory."** They discuss exactly this distinction. They argue that if you allow unbounded utility, you *do* get paradoxes, but that should be taken as an argument *against* unbounded utility, not against Expectation.

  Your friend has correctly identified that **Unbounded Utility + Expectation Maximization = Incoherence.** But since we can drop Unbounded Utility much more easily than we can drop Expectation Maximization, the rational choice is to bound utility. EV survives.
