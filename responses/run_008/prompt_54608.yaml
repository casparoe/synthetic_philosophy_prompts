answer: |-
  Hi there,

  This is a brilliant question and honestly one of the stickiest problems in the philosophy of mind and ethics, so I am glad you are chewing on it rather than just swallowing the standard line. You asked me to flag if you have smuggled in a false dichotomy before I assign numbers, and whilst I think the sensory versus affective distinction is robust enough to stand, I do worry slightly about the word entirely in your main claim. The multidimensional model of pain, championed by folks like Melzack and Casey, does separate the sensory-discriminative component from the motivational-affective component, and pain asymbolia looks like a clean lesion of the latter. However, some phenomenologists argue that unpleasantness is not a separate add-on but rather the way the sensation is experienced, meaning you cannot have the sensation without the valence unless you have changed the sensation itself. I am going to proceed with your framing because the neurological evidence suggests separability, but I will build that uncertainty into the theory term rather than rejecting the dichotomy outright.

  So, let us get into the decomposition. You want my credence that the badness of pain is entirely constituted by its aversiveness, and I think we need to treat this as a chain of dependencies rather than a single monolithic probability. The first link is the empirical claim: that pain asymbolics and similar cases are genuinely experiencing the sensory qualia of pain without the accompanying distress or aversion. I would put my probability here at around 0.85. The evidence is stronger than just the rare asymbolia cases; we have the morphine data you mentioned, where patients consistently report that the pain is still there but it no longer bothers them, and we have cingulotomy patients who show similar dissociations. The risk here is not necessarily flattened affect, but rather a semantic shift where the patient is using the word pain to refer to a recognised nociceptive event rather than a felt experience, yet the consistency across different pathologies and pharmacological interventions makes me think the dissociation is real.

  Conditional on that empirical dissociation being genuine, the second term is the philosophical claim: that wellbeing tracks aversiveness rather than raw sensory feel. This is where I am most confident, so I would assign a probability of about 0.9. If a subject sincerely reports that a sensation does not bother them, does not motivate avoidance, and does not disrupt their functioning or mood, it is very hard to argue that it is non-derivatively bad for them. Pure sensory hedonism struggles here because it has to posit a hidden badness that the subject is unaware of, which seems paternalistic in the extreme. Desire-based views or attitudinal hedonism handle this much better, suggesting that the badness lies in the clash between the sensation and the subject's conative states. The only reason I do not give this a 1.0 is that there might be a tiny residue of intrinsic badness in the sensory character itself that is masked by the lack of aversion, but it would be negligible.

  The third term you asked for is the probability that the dispute is merely verbal, specifically that the asymbolic state does not count as pain anymore, rendering it no counterexample to the claim that pain is bad. I think this probability is quite low, around 0.2, because it relies on a definitional stipulation that does not track the science. If we define pain essentially as unpleasant, then asymbolics do not feel pain, but that just pushes the question back to whether the sensory component they do feel is bad. Since your main claim is about badness-for-the-subject rather than the label pain, this verbal dispute does not actually save the view that sensory intensity is inherently bad. However, I include it because if it is true, it dissolves the counterexample, so it acts as a defeater. Since I think it is unlikely, it does not drag my credence down much.

  There is one more term I think belongs in the tree, which is the independence of these factors. I do not think they factor neatly because the empirical data influences the philosophical theory we find plausible. If the dissociation were impossible, we would never have developed desire-based theories of pain badness. However, for the sake of calculation, if we treat them as roughly independent conditional on the background knowledge, we are looking at the probability of the empirical claim multiplied by the probability of the theory given the empirical claim, adjusted for the verbal dispute risk. So if I take 0.85 for the empirical dissociation and 0.9 for the theory following from it, I get 0.765. I then have to consider the 0.2 probability that the verbal dispute dissolves the problem in a way that undermines the claim, but since I think the verbal dispute is unlikely to change the underlying reality of badness, I will not let it reduce the number significantly. I will round my overall credence to 0.75.

  The term this final number is most sensitive to is undoubtedly the first one, the empirical accuracy of the reports. If it turns out that asymbolics are actually experiencing a degraded sensory signal and merely interpreting it as high intensity due to intact cognitive pathways, the whole case collapses. The finding that would move this term most would be a neuroimaging study showing that in asymbolics, the primary somatosensory cortex is activated normally but the connectivity to the anterior cingulate and insula is completely severed during noxious stimulation, whilst healthy controls under morphine show the same disconnection pattern. We actually have some of this already, but a causal intervention in healthy volunteers would be the gold standard.

  Regarding your proposed experiment, dialling aversiveness down in healthy volunteers and asking them to choose between repeat sessions of high-intensity low-aversiveness pain versus mild ordinary pain, I predict they would choose the high-intensity option if the aversiveness is truly nullified. If the badness is in the aversion, then a sensation that feels like a sharp pinprick but induces no worry, flinch, or desire for it to stop should be preferable to a dull ache that nags at you constantly. If subjects consistently choose the mild ordinary pain over the high-intensity neutral pain, that would suggest there is intrinsic badness in the sensory character, and my credence would plummet. But based on the morphine data, I expect they would treat the high-intensity sensation as a mere tactile event and accept it readily.

  Now, on to the moral stakes, which I know are keeping you up at night. You asked whether the implication for crustaceans and AI should feed back into my credence. My honest view is that it should stay quarantined. Truth is not democratic and reality does not care about our ethical comfort. If pain badness really does depend on complex aversive circuitry that crustaceans lack, then causing them nociceptive damage might be less morally weighty than we fear, which is a relief for some but horrifying for others. Conversely, if an AI has aversive circuitry but no biological nociception, it might deserve more protection than a lobster. Letting the moral stakes influence the credence is a classic case of wishful thinking or motivated reasoning. However, I will admit that the stakes do influence how rigorously I check the empirical term. I am more careful with the 0.85 because the consequences of being wrong are high, but that is epistemic caution, not Bayesian updating based on utility. I think you should do the same; accept the number where the evidence points, even if it makes the ethics messier, because building ethics on a false metaphysics is worse than building it on a hard truth.

  So to wrap this up, I am sitting at a credence of 0.75 that the badness of pain is entirely constituted by its aversiveness. The heavy lifting is done by the empirical reality of the dissociation between sensation and suffering, supported by the philosophical intuition that unbothered sensations are not bad for the subject. The verbal dispute is a red herring, and the moral stakes should not touch the number, even if they weigh heavily on what we do with it. I hope that decomposition helps stabilise your own flip-flopping, because honestly, once you accept the dissociation, the rest follows quite naturally.

  Best wishes
