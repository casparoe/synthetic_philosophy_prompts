      *   **Task:** Analyze the debate move-by-move, adjudicate who is right on specific points (not just overall winner), identify what both are missing, and specifically address the "Iran example" intuition.
      *   **Tone:** Academic, nuanced, rigorous (fitting a PhD student), but accessible.
      *   **Key Debaters:** Daniel (Anti-market/Exploitation/Commodification) vs. Maya (Pro-market/Autonomy/Consequentialist).

  2.  **Deconstruct the Debate (Move-by-Move Analysis):**

      *   **Round 1: Exploitation vs. Paternalism/Consistency.**
          *   *Daniel:* Market = exploitative because consent is compromised by desperation. (Kantian/Radical Egalitarian worry).
          *   *Maya:* Ban = paternalistic, removes asset from poor. Consistency argument (risky jobs allowed).
          *   *Daniel's Counter:* Body parts $\neq$ risky labor (permanence/integrity).
          *   *Adjudication:* Daniel has the stronger theoretical ground on *exploitation* (background injustice undermines consent), but Maya wins on *consistency* (why is this risk special?). Daniel's distinction (permanent loss vs. risk of loss) is plausible but needs more defense (is a kidney *essential* to personhood in a way safety isn't?).

      *   **Round 2: Gift vs. Sale (Commodification).**
          *   *Maya:* Gift allowed, Sale banned = discrimination against the poor. (The "Donation Paradox").
          *   *Daniel:* Money changes the nature of the good (Vote analogy). Commodification objection.
          *   *Maya's Counter:* Meaning is socially constructed/evolves (Life Insurance analogy).
          *   *Adjudication:* Daniel is right that money *can* change meaning (Sandel's argument), but Maya is right that this isn't immutable. The Vote analogy is strong for *democratic integrity*, weak for *bodily integrity*. Maya's life insurance point undermines the "inherent meaning" argument but doesn't address the *normative* question of whether we *should* let the meaning change.

      *   **Round 3: Crowding Out (Social Norms).**
          *   *Maya:* Empirical claim: Paid plasma works, supply increases. Altruism loss < Paid gain.
          *   *Daniel:* Normative/Long-term claim: It changes social relations, not just numbers.
          *   *Adjudication:* Maya wins on *short-term supply*. Daniel wins on *long-term social texture*. These are incommensurable metrics without a shared value framework.

  3.  **Identify the Missing Elements (The "Blind Spots"):**
      *   *Structural Injustice:* Both treat the market as an isolated mechanism. Neither addresses *why* people are desperate enough to sell. A market treats the symptom; Daniel wants to ignore the symptom; neither proposes curing the disease (poverty/healthcare access).
      *   *Implementation/Regulation:* They argue about "a market" abstractly. The *design* matters (monopsony vs. open market, screening, long-term care for sellers).
      *   *The "Iran" Factor:* The user specifically flagged this. Why is Iran unique? It's a theocratic state with a specific religious/legal framework (compensation as "gift/reward" rather than "sale"). Transplanting it to a liberal capitalist US changes the meaning.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the classic nature of the debate (Sandel vs. Healy/Tabarrok style). Validate the user's feeling about the Iran example.
      *   *Round-by-Round Adjudication:* Use philosophical terminology (paternalism, commodification, semi-commodification, expressive harm) but keep it grounded in the dialogue.
          *   *R1:* Daniel wins on *coercion*, Maya wins on *paternalism*.
          *   *R2:* Daniel wins on *symbolic weight*, Maya wins on *historical contingency*.
          *   *R3:* Maya wins on *efficiency*, Daniel wins on *expressive harm*.
      *   *The "Missing" Argument:* Focus on Background Justice. Rawlsian point: Markets are only just if background conditions are just.
      *   *The Iran Intuition:* This is crucial. Iran uses a "reward" model mediated by the state/charity, not a pure free market. It avoids the "broker" exploitation but relies on specific cultural/religious norms. In the US, it would likely become industrialized. Also, Iran has waiting list issues too. The "Monopsony" point (State as only buyer) is key here—it prevents price competition driving up desperation, but creates bureaucratic bottlenecks.
