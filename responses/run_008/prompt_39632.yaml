          *   **Happiness Doctrine:** She does emphasize internal state, but acknowledging external circumstances (health, wealth, status) is part of her Epicurean leaning, not pure Stoicism.
          *   **Passions:** She is *not* Stoic in the sense of suppressing passions. She is more Epicurean/Libertine. She believes passions are necessary for happiness. Reason guides them, but doesn't necessarily crush them.
          *   **Illusions:** This is a famous part of the text. She *does* argue illusions are necessary. However, it's not exactly "self-deception" in a delusional sense, but rather an aesthetic/psychological buffering against the harshness of truth.
          *   **Gambling:** She *does* discuss gambling. She does *not* recommend it above all for old age. In fact, she often notes the dangers of gambling (financial ruin, emotional volatility). She lists it as *a* passion, but the summary's claim that she recommends it "above all" for old age contentment is suspect.
          *   **Biography:** Gambling, love, and study were indeed her passions.
