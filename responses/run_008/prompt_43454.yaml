answer: |-
  Case 3 resolves most cleanly because the accuser actively created the conditions for the violation, making blame functionally incoherent. The procedure is a four-step funnel: verify the facts, confirm role responsibility, check for current hypocrisy, and assess contribution to the harm. It prioritizes community trust over punitive consistency, meaning it will sometimes block true accusations if airing them publicly would damage the coalition's integrity more than the original offense. You should expect Case 1 to challenge your intuition; the procedure will likely grant standing there, arguing that reformed past behavior plus current role responsibility outweighs prior sins committed elsewhere.

  ***

  ### The Standing Check (Volunteer Prep Tool)

  **Purpose:** To decide if a formal complaint should proceed, be handled privately, or be stopped, based on who is making the accusation. This does not decide if the accusation is true; it decides if *this person* is the right one to make it formally.

  **Time:** 20 Minutes max.

  **Step 1: The Fact Check**
  *   **Question:** Is the core accusation factually true, based on evidence we have right now?
  *   **Pass:** Yes, there is evidence.
  *   **Fail:** No, or we don't know yet.
  *   **Action:** If Fail, stop. Do not proceed to standing questions. Investigate facts first.

  **Step 2: The Role Check**
  *   **Question:** Is it part of the accuser's job or agreed-upon role to enforce this specific rule? (e.g., Treasurer enforcing finance policy, President enforcing conduct).
  *   **Yes:** They have "Role Standing." Proceed to Step 3.
  *   **No:** They are a peer. Proceed to Step 3, but note that peer complaints require higher scrutiny on Step 4.

  **Step 3: The Mirror Check (Hypocrisy)**
  *   **Question:** Has the accuser violated this same norm *within this organization* recently enough that members would see it as unfair?
  *   **Yes:** They are currently breaking the rule they are enforcing.
      *   **Action:** **NO STANDING.** Do not let this proceed as a formal blame session. Redirect to a private conversation about mutual accountability.
  *   **No:** They are not currently violating it.
      *   **Nuance:** Did they violate it *elsewhere* or *long ago*? If they have reformed and are not hiding it, this does not block standing.
      *   **Action:** Proceed to Step 4.

  **Step 4: The Setup Check (Complicity)**
  *   **Question:** Did the accuser help create the situation that made the violation likely or inevitable? (e.g., gave bad instructions, voted against safety measures, withheld resources).
  *   **Yes:** They share responsibility for the harm.
      *   **Action:** **SHIFT.** Do not proceed as "Person A vs. Person B." Reframe as "System Failure." The accuser must acknowledge their part before any blame is assigned to the accused.
  *   **No:** The accuser did not contribute to the conditions.
      *   **Action:** **PROCEED.** Formal process can continue.

  **Decision Branches**
  1.  **Stop (No Standing):** Failed Step 3 (Current Hypocrisy). The accuser loses the right to formally blame.
  2.  **Shift (Shared Responsibility):** Passed Step 3, Failed Step 4 (Complicity). The complaint becomes a joint review of systems, not a censure of the accused.
  3.  **Proceed (Clear Standing):** Passed all steps. Formal process continues as normal.

  ***

  ### Case Workups

  #### Case 1: The President and the Expense Reports
  *   **Procedure Output:** **PROCEED.**
  *   **Reasoning:**
      *   Step 1 (Fact): True.
      *   Step 2 (Role): Yes, President enforces conduct.
      *   Step 3 (Mirror): No current hypocrisy. The past violation was at a *previous* employer, stopped on their own, and not hidden. This counts as reform, not active hypocrisy.
      *   Step 4 (Setup): No indication the President forced the member to pad expenses.
  *   **Counterfactual:** If the President padded expenses *at this organization* last year and hid it until now, the output flips to **STOP**. This matters because current hidden hypocrisy destroys trust in the enforcement itself.
  *   **Judgment Call:** Determining if past behavior is "resolved" vs. "hidden." The procedure relies on the volunteer panel knowing the President hasn't claimed to be squeaky clean.
  *   **Intuition Check:** You noted your gut says hypocrisy should knock them out. The procedure disagrees.
      *   *Verdict:* Your intuition is protecting the community from hypocrisy, but the procedure is protecting the community from *impunity*. If reformed leaders cannot enforce rules because of past sins elsewhere, the organization loses the people best equipped to enforce them. The distinction here is between *being a hypocrite* (claiming virtue you lack) and *being a reformed human*. The procedure treats reform as a asset, not a liability. If this feels wrong, it is because you are weighting moral purity over functional governance. In a nonprofit coalition, functional governance usually wins.

  #### Case 2: The Member and the Treasurer
  *   **Procedure Output:** **SHIFT.**
  *   **Reasoning:**
      *   Step 1 (Fact): True (controls were lax).
      *   Step 2 (Role): No, member is a peer. (Raises scrutiny).
      *   Step 3 (Mirror): No hypocrisy (member didn't misappropriate).
      *   Step 4 (Setup): Yes. Member voted against the audit that would have prevented this.
  *   **Counterfactual:** If the audit was mandatory by law and the member voted against it anyway, the output remains **SHIFT**. If the audit was optional and the Treasurer actively lobbied the member to vote no, the output moves closer to **PROCEED** (shared blame), but still likely **SHIFT** because the member held the vote.
  *   **Judgment Call:** How much does a single vote count as "creating the situation"? The procedure assumes a vote against controls is a direct contribution to laxity.
  *   **Analysis:** This is the cleanest application of "Complicity." You cannot formally blame someone for a risk you voted to keep open. The outcome isn't to punish the accuser, but to change the frame from "Tresurer failed" to "We failed to fund safety."

  #### Case 3: The Senior and the Newcomer
  *   **Procedure Output:** **STOP.**
  *   **Reasoning:**
      *   Step 1 (Fact): True (breach occurred).
      *   Step 2 (Role): Yes, Senior member has mentorship role.
      *   Step 3 (Mirror): No hypocrisy (Senior didn't breach confidentiality).
      *   Step 4 (Setup): Yes. Senior gave contradictory instructions and knew it was a trap.
  *   **Counterfactual:** If the Senior member gave clear instructions and the Newcomer ignored them, the output flips to **PROCEED**. This matters because it distinguishes between *setting someone up to fail* vs. *someone failing*.
  *   **Judgment Call:** Determining if the instructions were truly "contradictory" or just "complex." The procedure requires the panel to verify the ambiguity was genuine.
  *   **Analysis:** This is a hard stop. Blaming the newcomer here is not justice; it is scapegoating. The Senior member absorbs the blame because they held the power and the knowledge.

  ***

  ### Limitations and Lost Terrain

  **1. Proportionality (The "Worse Sin" Problem)**
  The procedure does not handle cases where the accuser's past sin is vastly worse than the accused's current sin (e.g., embezzler accusing someone of being late).
  *   *Why it's lost:* In a 20-minute meeting, weighing the "weight" of sins is subjective and explosive. The procedure sidesteps this by focusing on *current* hypocrisy (Step 3) rather than *past severity*.
  *   *Risk:* A reformed embezzler can technically proceed against a late member. This feels unjust.
  *   *Mitigation:* Rely on Step 4 (Setup). If the embezzler created a culture of financial laxity, they fail the Setup Check. If not, you must accept that reformed people are allowed to enforce minor norms.

  **2. Narrowing Options (Structural Coercion)**
  The procedure handles direct complicity (Step 4), but not structural coercion. Example: A manager blames an employee for missing a deadline, but the manager understaffed the team so severely the deadline was impossible.
  *   *Why it's lost:* This requires analyzing power dynamics and resource allocation, which often exceeds the panel's mandate or information access.
  *   *Risk:* It treats systemic coercion as individual "Setup."
  *   *Mitigation:* If the panel knows the options were narrowed, treat it as a Step 4 Fail (Setup). If they don't know, the procedure cannot catch it.

  **3. The "Private vs. Public" Nuance**
  The procedure branches to "Stop," "Shift," or "Proceed." It does not have a granular "Proceed but privately" branch for every case.
  *   *Why it's lost:* Complexity. Volunteers will confuse "Private Proceed" with "Secret Punishment."
  *   *Risk:* Some cases deserve public acknowledgment but private resolution.
  *   *Mitigation:** The "Shift" outcome covers most of this. It moves the focus from blaming a person to fixing a system, which is usually done in working sessions, not public censures.

  **Final Note on Case 1:**
  If you reject the procedure's output on Case 1 (allowing the President to proceed), you are prioritizing *moral symmetry* over *organizational health*. In restorative work, we often accept that the person facilitating healing carries scars. If the President is honest about their past and strict on their present, blocking them punishes the community by removing a capable enforcer. The procedure assumes trust is built on transparency and current conduct, not immaculate history. If your community disagrees, you must adjust Step 3, but know that doing so raises the barrier for leadership significantly.
