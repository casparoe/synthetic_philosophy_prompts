answer: |-
  The phenomenon you have identified is the central problem of **social ontology**. You have described it with exceptional clarity, particularly the asymmetry between *collective constitution* (we make it) and *individual inescapability* (it binds me).

  There is an established term that fits the bulk of your description, though it often requires supplementation to capture the specific "trap-like" quality you emphasize.

  ### 1. The Established Term: Institutional Facts
  The standard philosophical label for this category is **Institutional Fact**, a term most rigorously developed by **John Searle** (in *The Construction of Social Reality* and *Making the Social World*).

  Searle distinguishes between **Brute Facts** (existing independently of human opinion, e.g., gravity, rocks) and **Institutional Facts** (existing only within human institutions, e.g., money, marriage, borders).

  **How it fits your criteria:**
  *   **Constituted by Attitude:** Searle's formula is "$X$ counts as $Y$ in context $C$." A piece of paper ($X$) counts as money ($Y$) in a specific economy ($C$) only because of **Collective Intentionality** (we all accept it).
  *   **Constraint:** Searle argues that Institutional Facts create **Deontic Power**. This is the precise term for the binding force you noticed. Deontic power creates rights, duties, obligations, and entitlements. If you hold money, you have a *right* to goods; if you cross a border, you have a *duty* to show papers.
  *   **Unilateral Inescapability:** Because the power is deontic (normative) rather than just physical, it persists even if you dissent. As Searle notes, you can deny the status of money, but you cannot deny the *consequences* of that status while remaining in the system.

  **The Complement: Social Facts**
  To capture the *coercive* element you emphasized ("the lone person... is arrested"), you should pair Searle with **Émile Durkheim**. Durkheim coined the term **Social Fact**.
  *   **Durkheim's Definition:** "Ways of acting, thinking, and feeling... endowed with a power of coercion, by reason of which they impose themselves upon the individual."
  *   **Why you need both:** Searle explains *how* the thing is built (logic of construction); Durkheim explains *how it feels* to the individual (external coercion).

  ### 2. The Precise Carving (Necessary & Sufficient Conditions)
  To distinguish this family from other social phenomena, we can define your category using four specific criteria. If an entity lacks one, it falls outside your pattern.

  1.  **Ontological Subjectivity:** The entity ceases to exist if *all* human minds cease to exist (unlike a rock).
  2.  **Collective Constitution:** It requires a critical mass of acceptance to *initiate* and *sustain* (unlike a personal promise, which might bind just two people).
  3.  **Deontic Force:** It creates normative constraints (oughts/shouldnts), not just practical difficulties (unlike a convention like driving on the left, where the penalty is a crash, not necessarily a sanction).
  4.  **Asymmetric Dissolution:** An individual can reject the *validity* of the entity, but cannot reject the *consequences* of the entity without exiting the community.

  ### 3. Near-Miss Concepts (And Why They Fail)
  To sharpen the boundaries, here is why related concepts do not quite fit your specific pattern.

  **A. Conventions (David Lewis)**
  *   *The Concept:* Coordination equilibria, like which side of the road to drive on or what words to use for "cat."
  *   *Why it's a near-miss:* Conventions are often **opt-outable** with mere inconvenience. If I decide to drive on the wrong side, I risk death, but the *road system* doesn't punish me normatively; physics does. If I decide to use a private language, I am just misunderstood.
  *   *The Boundary:* Your examples (money, borders) carry **sanctions** (prison, hunger), not just coordination failures. Conventions lack the *deontic power* (rights/duties) that Institutional Facts possess.

  **B. Reification (Marx/Lukács)**
  *   *The Concept:* Social relations appearing as relations between things (e.g., the market acting like a force of nature).
  *   *Why it's a near-miss:* Reification implies a **false consciousness**. It suggests the entity is an *illusion* or a *mistake* that should be dispelled.
  *   *The Boundary:* Your observation is neutral. Money *really is* money, not a fake thing pretending to be real. It has real causal power. Reification is a critique of the phenomenon; you are describing the phenomenon itself.

  **C. Performative Utterances (J.L. Austin)**
  *   *The Concept:* Speech that does something (e.g., "I name this ship...").
  *   *Why it's a near-miss:* This explains the *birth* of the entity, not its *sustained existence*.
  *   *The Boundary:* A performative creates an Institutional Fact, but the Fact persists long after the utterance. Your pattern concerns the *enduring object*, not the *moment of creation*.

  ### 4. A Proposed Refinement: "Deontic Artifacts"
  While "Institutional Fact" is the academic standard, it can feel dry and fails to emphasize the "trap" aspect you identified (that we build it, but it masters us). If you wish to coin a term that captures the specific *dynamic* of the constraint, I propose:

  **Term:** **Deontic Artifact**
  **Definition:** A socially constructed entity that derives its existence from collective acceptance but exerts normative coercion (duties/rights) upon its creators that cannot be unilaterally revoked.

  This term highlights two things:
  1.  **Artifact:** It is made by us (not brute nature).
  2.  **Deontic:** It binds us via rules/norms (not just physical force).

  ### 5. Testing the Edge Cases
  Using the four criteria above (Subjectivity, Collective Constitution, Deontic Force, Asymmetric Dissolution), let's test your specific edge cases.

  **1. Language**
  *   *Verdict:* **Borderline / Hybrid.**
  *   *Analysis:* Language is ontologically subjective and collectively constituted. However, it lacks strong *deontic force*. If I invent a new word, I am not *sanctioned*; I am just ignored. There is no "Language Police" (unless we are talking about official state languages). It functions more like a **Convention** than an Institutional Fact.
  *   *Exception:* Legal or liturgical language (e.g., Latin in Mass, legalese in contracts) *is* a Deontic Artifact because using the wrong terms voids the institutional act.

  **2. Marriage**
  *   *Verdict:* **Yes.**
  *   *Analysis:* It exists only via collective/legal recognition. It creates specific rights/duties (tax, inheritance, fidelity). One spouse cannot unilaterally dissolve the institution while remaining within the legal system (divorce requires state sanction). It fits perfectly.

  **3. A Person's Reputation**
  *   *Verdict:* **No (It is a Property, not an Entity).**
  *   *Analysis:* Reputation is constituted by collective belief, and it constrains the individual. However, it is not a freestanding *object* or *institution*. It is an **attributive social fact**. It attaches to a brute fact (the person). You cannot "hold" a reputation in your hand like money. It lacks the *status function* ($X$ counts as $Y$); it is more like a collective measurement of $X$.

  **4. A Law on the Books but Never Enforced (Zombie Law)**
  *   *Verdict:* **Defective Deontic Artifact.**
  *   *Analysis:* This tests your threshold observation. It has the *status* (written down) but lacks the *collective acceptance* required for the function.
  *   *Nuance:* It remains a Deontic Artifact because it *can* be enforced at any moment by the state. The *potential* for coercion maintains the status. However, if *everyone* (including police/judges) stops believing in it, it ceases to be law and becomes mere text. This matches your hyperinflation example: the structure remains, the function erodes.

  **5. A Title (e.g., "Doctor" or "Duke")**
  *   *Verdict:* **Yes.**
  *   *Analysis:* Purely institutional. If everyone stops recognizing your title, you lose the privileges associated with it. Yet, you cannot claim the title unilaterally without sanction (fraud).

  **6. A Promise**
  *   *Verdict:* **Micro-Deontic Artifact.**
  *   *Analysis:* A promise creates a duty. However, it usually lacks the *community* scale. A promise between two people is a "mini-institution." If the community doesn't recognize the validity of promises generally, the specific promise fails. So, a promise is an instance of the broader Institutional Fact of "Promising."

  ### Summary of the Carving
  You have identified **Institutional Facts** (Searle) that exert **Deontic Power** (Searle) and function as **Social Facts** (Durkheim).

  The specific "trap" you noticed is the **Asymmetry of Ontological Dependence**:
  *   **Collective Dependence:** The entity depends on the *group* for its existence.
  *   **Individual Independence:** The entity does *not* depend on the *individual* for its existence (relative to that individual).

  This asymmetry is what makes the artifact feel "objective" to the individual. You cannot carve it out of reality by thinking differently, because reality, in this specific domain, is defined by *other* people's thinking.

  If you need a label for your writing, **"Institutional Fact"** is the term that will allow you to converse with philosophers. If you want to emphasize the binding nature, **"Deontic Artifact"** is a precise and defensible coinage that captures the "made-by-us but-master-of-us" dynamic you described.
