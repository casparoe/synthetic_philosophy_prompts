answer: |-
  Your hypothesis is sharp, and you are right to suspect that the stalemate is fueled by an equivocation on "translation." However, diagnosing this as *only* a verbal dispute with a substantive residue about clustering underestimates the normative stake both sides are fighting over. The debate isn't just about whether we can translate; it's about whether we can **judge**.

  Here is a diagnosis of the impasse, an evaluation of your hypothesis, and a roadmap for whether progress is actually possible.

  ### 1. The Verbal Core: Two Definitions of "Translation"
  You are correct that the two factions are operating with incompatible operational definitions of translation, which allows them to talk past each other.

  *   **The Philosophers of Language (PoL)** are working with a **logical-semantic** definition. For them, successful translation requires the preservation of truth conditions and inferential roles across the boundary. If I can map Term A in Theory 1 to Term B in Theory 2 such that the propositions remain truth-apt and the logic holds, translation has succeeded. Since we *can* write textbooks comparing Newton and Einstein, they argue translation succeeds. For them, "incommensurability" implies a breakdown of logic, which is demonstrably false because we are having this conversation.
  *   **The Historians** are working with a **cognitive-pragmatic** definition. For them, translation requires "cognitive transparency"—the ability of a practitioner to inhabit the other conceptual scheme without distortion. When they say "mass" doesn't translate, they mean a Newtonian cannot *think* "mass" the way an Einsteinian does, even if they can map the equations. The "loss" isn't just dictionary imperfection; it's a gestalt shift in how the world is carved up.

  **Verdict on your hypothesis:** You are right that this verbal mismatch drives the heat. The PoL prove communication is possible; the Historians prove *neutrality* is impossible. Both are true, but they answer different questions.

  ### 2. The Substantive Residue: It's Not Just Clustering
  Where your hypothesis needs tightening is on the "substantive residue." You suggest the real question is whether translation failures "cluster in ways that matter" or are just "noise" (like contract law subspecialties).

  This misses the specific claim Kuhn made about **taxonomic structure**. The Historians aren't just saying "translation is hard in science." They are claiming that scientific kind-terms (natural kinds) function differently than legal or everyday terms.
  *   **Contract Law:** Terms are stipulative. If two subspecialties use "consideration" differently, it's a definitional conflict that can be resolved by agreeing on a new definition. The ontology (contracts) is social and flexible.
  *   **Science:** Terms are tied to ostensive definitions and causal structures. If "element" changes from Boyle to Lavoisier, it's not just a definition change; it's a change in what counts as *real* in the world.

  The substantive disagreement is not about the *rate* of translation failure, but about **reference and rationality**.
  *   **PoL Claim:** Reference is stable enough (via causal chains or charity) that we can say Lavoisier was *right* and Priestley was *wrong* about the same object. Therefore, theory choice is rational and cumulative.
  *   **Historians Claim:** Reference is mediated by the lexical structure. If the structure changes, the reference shifts. Therefore, we cannot say Lavoisier solved Priestley's problem; he dissolved it and asked a new one. Theory choice is not algorithmic; it's persuasive.

  **Correction:** The debate isn't about whether translation failures cluster (they do in law too); it's about whether those failures block **neutral comparison**. The PoL believe we can stand outside both paradigms to judge them. The Historians believe we are always inside one. That is a genuine metaphysical/epistemological disagreement, not just a verbal one.

  ### 3. The "Local" Retreat and Why It Failed
  You noted that Kuhn's retreat to *local* incommensurability gave both sides new ammunition. Here is why that happened, which explains your group's stuckness.

  Kuhn moved from "whole theories are incommensurable" to "specific subsets of kind-terms are incommensurable." He tried to ground this in cognitive science (how the brain categorizes).
  *   **Why Historians like it:** It lets them point to specific lexical gaps (e.g., the lack of a "chemical element" category in alchemy) without claiming scientists are mute before each other.
  *   **Why PoL hate it:** If incommensurability is local, it can be bridged by context. If I can explain the context in which "mass" is used, I have translated it. By making it local, Kuhn admitted that *most* of the language *is* commensurable. The PoL argue that if the bridgehead is secure (logic, math, observation reports), the "local" gaps are just semantic quirks, not barriers to rational choice.

  The retreat failed to resolve the dispute because it shifted the battleground from **logic** to **cognitive psychology**. The PoL don't accept the cognitive premises (that concepts are stored in taxonomic trees that forbid overlap), and the Historians don't accept the logical premises (that meaning is determined by reference alone).

  ### 4. Can Progress Be Made?
  Your group is stuck because you are fighting a 1970s battle with 1970s weapons. Here is the honest assessment of whether progress is possible.

  **A. Disaggregation is Necessary (The "Grab-Bag" Conclusion)**
  You should conclude that "incommensurability" was always a grab-bag. To move forward, you must separate three distinct claims that Kuhn ran together:
  1.  **Semantic Incommensurability:** Terms lack exact synonyms. (True, but trivial, as PoL say).
  2.  **Methodological Incommensurability:** Standards of proof change (e.g., what counts as a "solution" to a problem). (Substantive, Historians' strong point).
  3.  **Perceptual Incommensurability:** Scientists literally see different things when looking at the same data. (Controversial, but empirically testable).

  If your group treats these as one thesis, you will loop forever. If you vote on them separately, you might find the PoL concede (2) and the Historians concede (1).

  **B. The "Contract Law" Test (Empirical Resolution)**
  Your analogy about contract law is actually a testable empirical hypothesis.
  *   **The Test:** Take a specific historical transition (e.g., phlogiston to oxygen). Map the translation failures. Then take a specific legal transition (e.g., the shift in "property" rights during the Enclosure Acts). Map those failures.
  *   **The Criterion:** Are the scientific failures *structurally different*? In science, the failure usually involves **ostensive definitions** (pointing at the world). In law, it involves **normative stipulations**.
  *   **Progress:** If you can show that scientific translation failures involve a breakdown in *pointing* (reference) while legal ones involve a breakdown in *rules*, you vindicate the Historians' claim that science is special. If both turn out to be purely stipulative, the PoL win. This requires a micro-history case study done *collaboratively*, not adversarially.

  **C. Formal Accounts (The Cognitive Turn)**
  The most productive path forward isn't traditional philosophy of language, but **cognitive history of science** (work by Nancy Nersessian, Hanne Andersen, or Peter Barker). They model concepts as "frames" or "schemas."
  *   **The Move:** Stop asking "Can we translate?" and start asking "What cognitive operations are required to move from Schema A to Schema B?"
  *   **Why it helps:** It bypasses the PoL's logical objection. It doesn't matter if translation is logically possible; if the cognitive load requires a restructuring of memory and categorization, the *process* of theory change is non-algorithmic. This saves the Kuhnian insight without requiring the PoL to admit that communication is impossible.

  ### 5. Final Diagnosis
  Your hypothesis is 80% correct. It is a verbal dispute about "translation" masking a substantive dispute about **rationality**.
  *   The PoL are defending the **Rationality of Science** (we can compare theories logically).
  *   The Historians are defending the **Historicity of Science** (we are bound by our conceptual schemes).

  **Recommendation for your group:**
  Stop asking "Is incommensurability true?" That question is dead.
  Start asking: **"Does the change in lexical structure during a paradigm shift alter the standards of rational justification, or just the vocabulary?"**

  If the standards of justification change (e.g., what counts as a valid explanation), then Kuhn wins on the substantive point that matters (theory choice isn't purely logical), even if the PoL win on the semantic point (we can still talk to each other). If you can get your group to agree that *communication is possible but neutrality is not*, you have dissolved the fight and saved the insight.

  If they refuse that distinction, then yes, the concept is a grab-bag that should have been separated out from the start. The "local" retreat was an attempt to do that, but it failed because it didn't explicitly separate *semantics* from *epistemology*. Your group should do that explicitly now.
