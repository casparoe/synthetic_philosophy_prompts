answer: |-
  - "The real question"
  Underneath the specifics of pistols and mustaches, this debate is about the mechanism of moral change. Maya is arguing for a version of moral psychology where shifts in *social emotion* (shame and honor) drive behavior independently of pure reason or pure material gain. Devon is arguing for a materialist or structuralist view: that behavior changes only when the external costs and benefits (laws, career prospects, physical safety) shift. The core philosophical tension is whether "honor" is a distinct motivator from "interest," or if caring about your reputation is just a complicated way of calculating self-interest.

  - "Move by move"
  (1) Maya's opening claim—that dueling ended because people finally heard moral arguments and realized it was wrong—is historically weak but philosophically common. She is right that moral arguments existed, but wrong that they were the catalyst. As Devon points out, clergy and kings condemned dueling for centuries while gentlemen kept shooting each other. If moral reasoning alone killed dueling, it would have died in the 1600s. Maya is describing how we *like* to think progress happens, not how it actually happened in this case.

  (2) Devon's structural argument is historically stronger here. He correctly identifies that dueling didn't vanish until the state began enforcing laws more consistently and, crucially, until the center of power shifted from land-owning aristocrats (who valued bravery) to professionals and bureaucrats (who valued stability). However, he risks oversimplifying by implying people only care about tangible punishment. Many duelists knew they might die or go to jail and did it anyway because the social cost of *not* dueling (being labeled a coward) was higher than the legal cost.

  (3) This is Maya's strongest move and the one that actually aligns with Appiah's thesis. She correctly distinguishes between "moral arguments" (logic) and "honor codes" (social identity). She is right that shame is a moral emotion even if it isn't a logical argument. When dueling shifted from being a sign of nobility to a sign of vulgarity, the behavior stopped even among people who weren't afraid of the law. This captures the internal shift that Devon's external focus misses: the duelists stopped because they wanted to be seen as good men, not just safe men.

  (4) Devon's counter—that reputation is just another form of interest—is a classic philosophical reductionism. It is half-right in that social capital *functions* like currency, but it is wrong to say it is the *same* thing. If reputation were just interest, people would duel whenever the payoff was high enough. But honor codes often compel people to act *against* their safety and financial interest (e.g., duelists who apologize to avoid fighting are sometimes ostracized even if they stay alive). Devon is conflating "what benefits me" with "what fits my identity," which are psychologically distinct drivers.

  - "What they're both missing"
  There is a historical nuance here that both of you are glossing over, which is the class dimension. Dueling was primarily an aristocratic practice. Its decline correlates heavily with the rise of the middle class and industrial capitalism. The "interests" Devon talks about weren't just generic; they were specific to a new class of people who made money through contracts and cooperation, not land and martial prowess. Meanwhile, Maya is relying on Appiah's specific interpretation, which is a philosophical theory, not undisputed historical fact. Historians debate whether the honor code changed *because* the laws changed (Devon's view) or if the laws only became enforceable *because* the honor code changed (Maya's view). It is likely a feedback loop: as the middle class gained power, their anti-dueling norms became the dominant "honor" code, which then allowed the state to punish duelists without public backlash.

  Furthermore, you are both treating "morality" and "interest" as rigid opposites. In reality, honor sits exactly in the middle. It is external (like interest) because it depends on what others think, but it is internal (like morality) because it feels like a duty. By arguing over which box it fits into, you miss that it is the bridge between the two. The duel didn't end because people became smarter (Maya 1) or just because they got scared (Devon 2); it ended because the definition of a "gentleman" was rewritten by a changing society, making the duel a liability to status rather than an asset.

  - "Final score and my confidence"
  **Winner:** Maya takes the round, but narrowly. While Devon has a better grasp on the material conditions (laws, careers), Maya correctly identifies the specific mechanism Appiah is famous for: the shift in *honor* is distinct from a shift in *interest*. Devon's attempt to reduce honor to interest collapses a useful distinction, making his theory less explanatory.

  **Confidence Levels:**
  *   **Move 1 (Maya):** 90% sure she is wrong. Historical consensus is that moral arguments alone did not stop dueling.
  *   **Move 2 (Devon):** 75% sure he is partially right. Structural changes were necessary, but not sufficient on their own.
  *   **Move 3 (Maya):** 85% sure she is right. This is the core of the Appiah argument and fits the sociological data on norm shifts.
  *   **Move 4 (Devon):** 60% sure he is wrong. This is a conceptual debate about human motivation that is harder to settle.

  **Least Certain Verdict:** I would bet the least on my judgment of **Move 4**. The question of whether "social reputation" counts as "self-interest" is a deep rabbit hole in philosophy and economics. Some theorists argue that *all* human motivation is self-interest (psychological egoism), which would make Devon technically correct by definition. However, that definition makes the word "interest" so broad it loses meaning. I'm confident it's not a *helpful* way to talk, but I can't prove he's philosophically wrong in the same way I can prove Maya's Move 1 is historically inaccurate.
