prompt: |-
  I have to write a character reference for my friend Elena's custody hearing next month, and a psych-major friend of mine has me half convinced I'd basically be writing fiction. Over beers he laid this out:

  (1) Having a character trait — honesty, kindness, reliability — means being disposed to act that way consistently across situations, so the trait should be the best predictor of your behavior.
  (2) In the classic studies, it isn't: Milgram's subjects kept shocking people when told to, Darley and Batson's seminarians stepped around a slumped victim mostly depending on whether they were in a hurry, and Hartshorne and May found that kids who cheated on one test mostly didn't cheat on the next.
  (3) If situational variables predict behavior better than any trait does, there's no evidence the trait exists.
  (4) So global character traits basically don't exist, and nobody is "a caring person" in the sense virtue ethics needs — he says this is what kills virtue ethics as a moral theory, not just letter-writing.
  (5) So my letter would assert an empirically refuted psychology to a judge.

  Then I went home and noticed the argument seems to prove way too much. Beliefs are also supposed to be stable dispositions — if you believe smoking causes cancer, you judge that way across contexts. But framing studies show people's judgments flip with irrelevant wording, and order effects change what people conclude from the same evidence. Run steps (1)-(3) on beliefs instead of traits and you get that nobody beleives anything — including my friend's belief in the studies he just cited me. I texted him this and he didn't have an answer.

  So which step is the bad one? Or is the argument okay and something else has to give — maybe the letter only needs a weaker claim than step (4) ever touches? I'd like to keep enough to honestly tell the judge that Elena is reliable, since five years of her showing up says she is. And if I've mangled what the studies actually show, or the philosophy, just tell me that straight — don't be polite about it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Task:** Evaluate a philosophical/psychological argument presented by the user's friend regarding character traits and situationism. Determine which step is flawed or if the conclusion holds.
      *   **Context:** The user needs to write a character reference for a custody hearing. The friend argues that writing such a letter is asserting "empirically refuted psychology" because global character traits don't exist (Situationism).
      *   **User's Counter-argument:** The user notices the argument proves too much (applies to beliefs as well, leading to skepticism about belief itself, including the friend's belief in the studies).
      *   **Constraint:** "Don't be polite about it." (Direct, honest feedback is preferred over sugar-coating).
      *   **Goal:** Validate the user's intuition, identify the specific philosophical error, and provide guidance on how to write the letter without making false metaphysical claims.

  2.  **Deconstruct the Friend's Argument (The Situationist Challenge):**
      *   *Premise 1:* Traits are defined as consistent behavioral dispositions across diverse situations.
      *   *Premise 2:* Empirical studies (Milgram, Darley & Batson, Hartshorne & May) show behavior varies wildly based on situation, not trait.
      *   *Premise 3:* If situation predicts better than trait, the trait doesn't exist.
      *   *Conclusion:* Global character traits don't exist; virtue ethics is dead; writing a character reference is lying/pseudoscience.

  3.  **Evaluate the Steps (Philosophical & Psychological Critique):**
      *   *Step 1 (Definition of Trait):* This is the weakest link. It assumes a *Aristotelian/Robust* view of traits (perfect consistency) that most modern trait psychologists and even many virtue ethicists don't hold. It sets up a straw man.
      *   *Step 2 (The Studies):* The interpretation is classic Situationism (Doris, Harman), but these studies have been re-analyzed. Milgram had dissenters. Darley & Batson had variance. Hartshorne & May found *some* consistency (honesty wasn't zero correlation). The "power of the situation" is real, but it doesn't reduce trait predictive power to *zero*.
      *   *Step 3 (The Inference):* "If situation predicts *better*, trait doesn't exist." This is a false dichotomy. Behavior is an interaction of Person x Situation. Just because situation is a strong predictor doesn't mean person variables are non-existent.
      *   *Step 4 (The Conclusion):* "Traits basically don't exist." This is too strong. Most psychologists agree on the "Big Five." Traits exist as probabilistic tendencies, not deterministic laws.
      *   *Step 5 (The Application):* "Letter asserts refuted psychology." False. The letter asserts observed patterns of behavior, not metaphysical essences.

  4.  **Evaluate the User's Counter-Argument (The Belief Analogy):**
      *   The user argues: If framing effects undermine beliefs like situations undermine traits, then beliefs don't exist either.
      *   *Assessment:* This is a strong *reductio ad absurdum*. It highlights that the friend's criteria for "existence" is too strict for *any* mental state. If we require perfect stability for a mental state to exist, nothing exists. This confirms Step 1 is the problem (the definition of existence/stability).

  5.  **Synthesize the Verdict:**
      *   The friend is reciting a specific philosophical position (Global Situationism) popularized in the late 90s/early 00s (Doris, Harman).
      *   It is *not* the consensus view in psychology or philosophy today.
      *   Step 1 is the primary error (Straw Man definition of traits).
      *   Step 3 is the secondary error (False dichotomy between person and situation).
      *   The user's intuition is correct: The argument proves too much.

  6.  **Drafting the Response (adhering to "Don't be polite"):**
