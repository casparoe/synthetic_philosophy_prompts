answer: |-
  You have correctly identified one of the most frustrating and structurally significant features of modern physics. Your "test suite" analogy is excellent: the experiments pass all tests, but the "source code" (ontology) is hidden, and every developer insists on a different architecture that produces the same binary.

  Here are the specific terms and concepts you are looking for.

  ### 1. The General Structure: Metaphysical Underdetermination

  You were half-right with **Underdetermination**. In philosophy of science, the **Underdetermination of Theory by Data** is the general principle that available evidence is insufficient to determine which belief or theory we should hold.

  However, you sensed a nuance missing from the standard definition. Standard underdetermination often refers to two mathematically distinct formulations that are empirically identical (like Heisenberg's Matrix Mechanics vs. Schrödinger's Wave Mechanics, which were later proven mathematically equivalent).

  What you are describing is stronger. It is **Metaphysical (or Ontological) Underdetermination**. This occurs when:
  1.  Multiple theories are **empirically equivalent** (they predict the exact same data).
  2.  They are **ontologically incompatible** (they make contradictory claims about what exists, e.g., "there are many worlds" vs. "there is only one world but it is nonlocal").
  3.  No possible experiment can distinguish them.

  The structural engine driving this in quantum mechanics is a **No-Go Theorem**. Bell's Theorem is a No-Go Theorem. It proves that a specific set of assumptions (Locality, Realism, and Measurement Independence) cannot all be true simultaneously.

  Because it is a logical impossibility to satisfy all constraints, you are forced to drop one. Since the experiment only tells you *that* the constraints are violated, not *which* one is the culprit, you end up with **Metaphysical Underdetermination**.

  There is also a relevant concept called the **Duhem-Quine Thesis**. This states that you cannot test a scientific hypothesis in isolation. You always test a bundle of hypotheses (the theory + auxiliary assumptions + instrument calibration). When the test fails, logic dictates that *something* in the bundle is false, but it does not tell you *what*. In the Bell test scenario, the "bundle" is {Locality, Realism, Free Choice}. The experiment breaks the bundle, but the Duhem-Quine thesis explains why you can't use data to isolate the broken component.

  **Verdict:** You haven't reinvented the wheel, but your intuition is sharper than the standard textbook definition. You are looking at **Metaphysical Underdetermination driven by a No-Go Theorem.**

  ### 2. The Specific Escape Hatch: Superdeterminism

  The specific loophole where the detector settings and the particle source are correlated from the start is called **Superdeterminism**.

  In the formal derivation of Bell's Inequalities, there is an assumption called **Statistical Independence** (sometimes called "Measurement Independence" or the "Free Choice Assumption"). Mathematically, it looks like this:

  $$ P(\lambda | \vec{a}, \vec{b}) = P(\lambda) $$

  Where $\lambda$ represents the hidden variables of the particle, and $\vec{a}, \vec{b}$ represent the detector settings. This equation says: *The state of the particle is independent of how we choose to set the detectors.*

  **Superdeterminism** is the claim that this equation is false. The particle "knows" what settings you will choose because both the particle's state and your decision to set the detectors that way share a common cause in the past (typically traced back to the Big Bang).

  **Is it considered serious?**
  *   **Historically:** No. It was largely dismissed as a "conspiracy theory." John Bell himself disliked it, famously remarking that if this were true, it would imply the universe is conspiring to prevent us from discovering the truth, making science impossible.
  *   **Currently:** It has seen a minor resurgence. Physicists like Gerard 't Hooft (Nobel laureate) and Sabine Hossenfelder advocate for it. They argue that dismissing it out of hand is dogmatic. If the universe is fully deterministic, why *shouldn't* the detector settings be correlated with the source?
  *   **The Standard Objection:** The "Conspiracy" objection. If Superdeterminism is true, it undermines the scientific method itself. If every experiment you run is pre-correlated with the system you are testing, you can never establish causality. You could "prove" that taking aspirin cures headaches if the universe conspired to make only people who took aspirin have headaches that would go away anyway. It saves Locality and Realism at the cost of **Induction**.

  **Note on Retrocausality:** You mentioned "causes running backwards." This is a cousin of Superdeterminism called **Retrocausality**. It also violates Statistical Independence, but instead of a common past cause, it suggests the future detector setting influences the past particle emission. It is distinct from Superdeterminism but lands in the same "violation of Measurement Independence" bucket.

  ### 3. Synthesizing the Structure (The "Engineer's Spec")

  Since you asked for clarity on the structure, here is how a philosopher of physics would map your "test suite" analogy to the literature.

  You are describing the **Bell Trilemma**.
  A No-Go theorem proves that the following three propositions form an inconsistent triad (you can have any two, but not all three):
  1.  **Locality:** No influence travels faster than light.
  2.  **Realism:** Physical properties exist independent of measurement (no "spooky" wavefunction collapse).
  3.  **Measurement Independence:** Experimenters are free to choose settings independent of the system history.

  **The Situation:**
  *   **The Test Suite:** Bell Inequality Experiments (Delft, etc.).
  *   **The Result:** `FAIL`. The inequalities are violated.
  *   **The Debug:** The code (Nature) cannot support all three features. One must be commented out.
  *   **The Problem:** The error log does not specify which line caused the crash.

  **The "Interpretations" are just patches:**
  *   **Copenhagen:** Drops **Realism**. (Properties don't exist until measured).
  *   **Many Worlds:** Drops **Locality** (in a specific sense) or redefines it. (Everything happens, so no signal needs to travel). *Note: MWI proponents argue they keep Locality and Realism but drop "Uniqueness of Outcome."*
  *   **Bohmian Mechanics:** Drops **Locality**. (Particles have real positions, guided by a non-local wave).
  *   **Superdeterminism:** Drops **Measurement Independence**. (Settings and particles are correlated).
  *   **Retrocausality:** Drops **Measurement Independence** (via future influence).

  **Why your friends miss it:**
  They are likely **Scientific Realists** who assume there is a single "True Spec." But a large camp of philosophers are **Instrumentalists** (or Anti-Realists). They would argue your premise "Exactly one picture of the world is right" is false. They argue the wavefunction is just a tool for calculating probabilities, not a description of reality. For them, the "spec" is the math, and the "implementation details" (ontology) are irrelevant.

  ### Summary for your next argument

  1.  **The General Phenomenon:** **Metaphysical Underdetermination** arising from a **No-Go Theorem**.
  2.  **The Specific Loophole:** **Superdeterminism** (violation of **Statistical Independence**).
  3.  **The Structural Constraint:** The **Bell Trilemma** (Locality, Realism, Measurement Independence -> Pick two).
  4.  **The Engineering Analogy:** You are correct. It is a system where the API is fully documented and tested, but the backend architecture is fundamentally opaque, and every proposed architecture requires accepting a "breaking change" to common sense (non-locality, many worlds, or no free will).

  You haven't missed anything. The reason it feels unresolved is that it *is* unresolved, and by the current rules of the game, it is likely **unresolvable**. That is the definition of Metaphysical Underdetermination.
