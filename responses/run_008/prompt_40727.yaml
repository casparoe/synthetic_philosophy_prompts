answer: |-
  Hey Marcus, I went through your practice answer and overall you have a really strong grasp of the basic definitions and the logic behind common-pool resources. You nailed the distinction between rivalry and excludability in the first paragraph, and your explanation of why fisheries get overused is spot on. You correctly identified that individual incentives drive people to take more than their share because the cost is spread out, which is exactly what Hardin described. That first half is solid and shows you understand the core economic concepts well.

  There are just a couple of nuances in the second half that you might want to tweak before the test. When you talk about public goods, you mentioned that people overconsume them which leads to underproduction. Since public goods are non-rival, one person using them does not reduce availability for others, so overconsumption is not really the issue in the same way it is for fisheries. The underproduction happens primarily because private companies cannot charge people due to the free rider problem, so they lack the incentive to produce it at all, rather than people using it up. It is a small distinction but worth clarifying so you do not confuse non-rivalry with depletion.

  The biggest thing to adjust is the section on Elinor Ostrom. You wrote that she showed the tragedy of the commons is basically never a real thing, but her argument was actually more nuanced than that. She did not prove Hardin wrong so much as she showed that tragedy is not inevitable. She found that communities can manage resources successfully without government or privatization, but only under specific conditions like clear boundaries and monitoring systems, not just whenever they want to. Saying it never happens in practice is a bit too strong since tragedies do occur when those conditions are not met. Her work was about identifying the principles that allow people to avoid the tragedy, not denying that the tragedy exists.

  Taking all of that into account, I think this answer deserves a B. You got the definitions and the common-pool logic completely right, which is the hardest part, but the inaccuracies regarding public goods consumption and Ostrom's specific conclusions keep it from being an A. If you adjust those points to reflect that public goods underproduction is about supply incentives rather than overconsumption, and that Ostrom showed tragedy is avoidable rather than impossible, you will be in great shape for the unit test. Let me know if you want to review those concepts together before next week.

  Best,

  [Your Name]
