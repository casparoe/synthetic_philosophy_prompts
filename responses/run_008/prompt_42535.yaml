answer: |-
  You have correctly identified a frustration that plagues many people moving from data science into philosophy of science: the term "underdetermination" is often used sloppily to cover two very different problems.

  To answer your specific question: The state of affairs you are describing in Cases 2 and 3 is technically called **Empirical Equivalence**. The epistemic situation resulting from it is **Strong Underdetermination** (sometimes called *radical* or *permanent* underdetermination).

  However, simply giving you those terms would be a disservice, because your intuition that there is a deep structural link between your three cases—and a murky line between "different theories" and "different notation"—is exactly where the most interesting philosophy happens.

  Here is the breakdown of whether your three cases are one phenomenon, how the strong version relates to the weak one you found online, and where the principled line lies.

  ### 1. Weak vs. Strong Underdetermination

  You found definitions of underdetermination focusing on "bundles of hypotheses" (the Duhem-Quine thesis). That is **Holism**, which is related to but distinct from what you are looking for.

  *   **Weak Underdetermination (Your Case 1):** This is the curve-fitting problem. At time *t*, the data is insufficient to distinguish between Theory A and Theory B. However, it is *possible in principle* that future data at time *t+1* could break the tie. This is a practical, transient epistemic limitation.
  *   **Strong Underdetermination (Your Cases 2 & 3):** This occurs when Theory A and Theory B are **Empirically Equivalent**. They predict the exact same observational outcomes for *all possible* experiments, across all time. No amount of data, even in principle, can distinguish them.

  So, to answer your first question: **Cases 2 and 3 are the same phenomenon (Strong Underdetermination via Empirical Equivalence). Case 1 is a different, weaker phenomenon.**

  ### 2. Analyzing Your Three Cases

  **Case 1: Curve Fitting (Weak)**
  This is an inductive problem. You have finite points; infinite functions fit. But as you noted, more points constrain the space. In philosophy, this is often associated with Hume's problem of induction. It's not a problem about the *structure* of the theories, but about the *scarcity* of data.

  **Case 2: Lorentz Ether Theory (LET) vs. Special Relativity (SR) (Strong)**
  This is the canonical example of Empirical Equivalence.
  *   **SR:** Says there is no ether; spacetime geometry is Minkowskian.
  *   **LET:** Says there is an ether; rods contract and clocks dilate dynamically due to motion through the ether in such a perfect way that you can never detect the ether.
  *   **The Verdict:** They are mathematically isomorphic regarding predictions. The difference is purely **ontological** (what exists). SR says "no ether." LET says "undetectable ether."
  *   **Philosophical Status:** Most physicists treat this as Case 3 (notation/interpretation), but philosophers of physics treat it as Case 2 (strong underdetermination). It forces you to ask: *If the ether makes no difference to measurement, does it exist?*

  **Case 3: Quantum Interpretations (The Messy Strong)**
  This is more complex than Case 2.
  *   **Copenhagen vs. Many Worlds (Everett):** These are often claimed to be empirically equivalent. If so, this is Strong Underdetermination.
  *   **However:** Some interpretations *are* testably different. **Objective Collapse theories** (like GRW) predict slight deviations from standard quantum mechanics that could, in principle, be measured. **Bohmian Mechanics** is non-local in a way that standard QM handles differently.
  *   **The Verdict:** If two interpretations are truly empirically equivalent (like Copenhagen vs. Many Worlds is often argued to be), they fall into the same bucket as LET vs. SR. If they make different predictions, they are just rival theories awaiting data (Case 1).

  ### 3. The Principled Line: Theory vs. Notation

  You asked: *"Is there a principled line between 'two theories that happen to agree on all possible evidence' and 'one theory with two notations'?"*

  This is the million-dollar question in the philosophy of science. There are three main positions on where that line is drawn:

  **A. Logical Positivism / Verificationism (No Line)**
  *   **Argument:** The meaning of a statement is its method of verification. If two theories yield identical verification conditions (measurements), they have identical meaning.
  *   **Conclusion:** LET and SR are not two theories; they are one theory with different psychological packaging. The "ether" in LET is cognitively meaningless because it refers to nothing observable.
  *   **Pros:** Clean, solves the underdetermination problem by dissolving it.
  *   **Cons:** Most philosophers rejected this in the late 20th century because it rules out talk of unobservables (electrons, quarks, black hole interiors) which science relies on.

  **B. Scientific Realism (There Is a Line)**
  *   **Argument:** Science aims to tell the truth about the world, not just save the phenomena. One of the theories is *true* and the other is *false*, even if we can never know which.
  *   **Conclusion:** There really is either an ether or there isn't. The fact that we can't measure it doesn't make the difference semantic; it makes it metaphysical.
  *   **Pros:** Respects the intuition that the world is a certain way independent of us.
  *   **Cons:** It renders science partially irrational. If evidence can never decide between A and B, why believe A over B? It leads to skepticism.

  **C. Structural Realism / Constructive Empiricism (The Middle Ground)**
  *   **Structural Realism:** We can only know the mathematical *structure* of the world, not the *nature* of the entities. SR and LET share the same structure; therefore, they are the same theory regarding what we can know. The "ether" is surplus structure.
  *   **Constructive Empiricism (Bas van Fraassen):** Science aims for *empirical adequacy* (saving the phenomena), not truth. Whether the ether exists is irrelevant. We accept the theory as "empirically adequate," not "true."
  *   **Conclusion:** The line is drawn at the observable. Differences beyond the observable are not "scientific" disagreements.

  ### 4. Why Your Data Background Makes This Tricky

  In data science, **Occam's Razor** is usually a heuristic for generalization error. You pick the simpler curve to avoid overfitting.

  In philosophy of science, **Occam's Razor** becomes a metaphysical claim.
  *   In Case 1 (Curve Fitting), simplicity is pragmatic (easier to compute, less likely to overfit noise).
  *   In Case 2 (LET vs. SR), simplicity is the *only* tiebreaker. SR is preferred over LET not because it fits data better (they fit equally), but because LET posits an entity (the ether) that does no work.

  This is called **parsimony of ontology**. If you are a Realist, you believe nature prefers simplicity. If you are an Empiricist, you believe we should just stop talking about the ether because it's useless.

  ### 5. Summary and Recommendations

  To answer your core questions directly:

  1.  **Is there a name?** Yes. The relationship between the theories is **Empirical Equivalence**. The epistemic problem is **Strong Underdetermination**.
  2.  **Are the three cases one phenomenon?** Cases 2 and 3 are the same phenomenon (Strong). Case 1 is distinct (Weak/Transient).
  3.  **Is there a principled line between theory and notation?** Only if you adopt a specific philosophical stance.
      *   If you are a **Verificationist**: No line. They are the same.
      *   If you are a **Realist**: Yes, the line is ontology (truth vs. falsehood).
      *   If you are a **Structural Realist**: The line is the mathematical structure; everything else is "surplus."

  **Recommended Reading:**
  If you want to dig into the "Strong" version specifically, look for these specific arguments rather than general "underdetermination" overviews:

  *   **Bas van Fraassen, *The Scientific Image*:** This is the definitive text for **Constructive Empiricism**. He argues that when faced with empirically equivalent theories (like LET and SR), we should not believe either is "true," but only that they are "empirically adequate." This directly addresses your Case 2.
  *   **Larry Laudan, "Demystifying Underdetermination":** Laudan argues that Strong Underdetermination is actually rare in the history of science and that philosophers worry about it too much. He distinguishes the "transient" (your Case 1) from the "permanent" (your Case 2) very clearly.
  *   **W.W. Bartley or Reichenbach on "Coordinative Definitions":** This deals with your Case 3. It explores whether changing the interpretation of geometry or quantum mechanics is a change in fact or a change in convention.

  **The "One Word" You Wanted:**
  If you must have a single term to search for that captures the "no possible evidence could split them" constraint, search for **"Empirical Equivalence."** That is the technical condition that generates Strong Underdetermination.
