prompt: |-
  I'm a PhD student in theoretical physics — my day job is gauge theories and their symmetries — and after a seminar disagreement about what it means to "quotient by the symmetry group," I've been reading into the metaphysics literature on the identity of indiscernibles, starting with Max Black's two-sphere universe. The physicist's instinct, that symmetry-related configurations are one physical situation described twice, keeps colliding with my gut verdicts about how many objects are in these worlds. I've now written down six cases with my verdicts on each, and I cannot find a single principle behind my own answers. I'd like you to tell me whether my verdicts are capturable at all, and if so by what principle, where a "principle" may be a single criterion or a principled package.

  The cases:

  A. Black's universe: nothing but two qualitatively identical iron spheres, one mile apart, exchanged by a reflection. My verdict: two spheres. The swap changes nothing qualitative, yet there are two of them.

  B. An infinite universe periodic in space with period L: every L-sized cell contains exactly what every other contains. My verdict: there are infinitely many distinct planets, not one cell of content "repeated"; the translational symmetry does not collapse the count. This feels like A with more symmetry and more stuff.

  C. The helium ground state: two electrons in the same spatial orbital with the spins in the singlet, so that the total state is fixed by exchange up to an overall sign, which fixes the ray. My verdict: two electrons. The permutation is as close to a gauge symmetry of the formalism as physics offers, and yet I count two particles. I'm aware this verdict is hostage to a particle ontology; in the field picture, where electrons are excitations, my confidence wobbles.

  D. Two assignments of metric and matter fields to the points of a manifold, related by a diffeomorphism that is the identity outside some bounded region and nontrivial inside it. My verdict: one physical situation, not two — the standard line in the foundations of general relativity, and I hold it. Gauge-related multiplicity is not real multiplicity.

  E. A classical world containing two fluids, each filling all of space, with identical density and velocity at every point — every property of the one, including location, is a property of the other. My verdict: torn, but I lean toward there being one thing there, or at least toward positing two doing no work. This sits very badly next to C.

  F. A single perfectly featureless homogeneous sphere alone in space. I can carve it into two hemispheres related by a symmetry, but I don't think the hemispheres are objects on a par with Black's spheres — they are arbitrary carve-outs, artifacts of my description. Yet I have met the argument that Black's two spheres are exactly like this: the pair is one symmetric object, and the two spheres are its arbitrary maximal symmetric parts. The argument leaves me unmoved, and I cannot say why.

  So A, B, and C say that symmetry-related multiplicity is real multiplicity; D says gauge-related multiplicity is not; F pressures A through a mereological analogy; and E pulls against C. I have skimmed enough of the literature to recognize the labels — weak and strong versions of the principle, haecceitism, structuralism, spacetime individuation — so a bare name will not help me; what I need is the carving. Specifically: which way of dividing "symmetry-related" from "genuinely plural," if any, delivers all six verdicts, and what does it commit me to beyond the cases? Is the relevant difference between A and D that the diffeomorphism in D moves the manifold points themselves, or something about the objects rather than the transformations? And is my E-versus-C tension resolvable, or must one of those verdicts go?

  Please respond with a single JSON object of exactly this shape, and nothing outside it except a final field for prose commentary:

  {
    "case_review": [
      {"case": "A", "verdict_given": "string, one clause", "status": "kept" or "overturned", "note": "one sentence on why, under your recommended principle"}
    ],
    "candidate_principles": [
      {"name": "string", "statement": "one or two sentences", "cases_saved": ["A"], "cases_overturned": ["A"], "cost": "one sentence on what this principle commits me to beyond the six cases"}
    ],
    "recommended_principle": {
      "name": "string",
      "statement": "one or two sentences",
      "novel_cases": [
        {"situation": "string", "predicted_verdict": "string", "reasoning": "two or three sentences"}
      ],
      "unaccommodated_verdicts": ["strings, possibly empty; each with a one-line diagnosis of what breaks"]
    },
    "commentary": "up to 200 words for anything the schema cannot hold"
  }

  Constraints: case_review must contain exactly one entry for each of A through F. candidate_principles must contain at least two and at most three, each implicitly checked against all six cases, and at least one of them must accommodate your recommendation about the tension between E and C. novel_cases must contain at least two entries, one of which must be the case I cannot settle: a world like A except that the reflection exchanging the spheres is stipulated to be a gauge symmetry of the theory in the same sense as in D — does that world then contain one object with two aspects, two objects, or does the question misfire? At least one further entry should be a case of your own devising, chosen to stress the boundary of your recommended principle. If no principle or package captures all six verdicts, say so plainly in the commentary, and make the recommended_principle field the best available approximation, with unaccommodated_verdicts doing the honest work.
