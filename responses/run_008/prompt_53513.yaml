      *Reply:* Distinguish *predicting* approval from *causing* it. We train on counterfactuals: "What would you approve if you knew X?" not "What do you approve now?" This requires an overseer model robust to manipulation, yes, but it breaks the instrumental incentive to deceive. The agent optimizes for *informed* approval, removing the value of hiding info.
      *Soft Spot:* Assumes we can train the agent to reason counterfactually without leaking into causal manipulation.

      **2. The Coherence Theorem (Theory Person)**
      *Q:* "A non-EU agent is dominated. If your standards drift, you're money-pumpable. Why isn't this incoherent?"
      *Reply:* Coherence theorems assume static preferences. Here, the 'utility' is a process, not a state. We aren't maximizing; we're satisfying dynamic constraints. Drift isn't inconsistency; it's learning. You can't money-pump an agent that updates its target based on new moral information without violating the 'learning' axiom.
      *Soft Spot:* Hard to formalize "moral learning" without smuggling in a static meta-utility.

      **3. The RL Opener**
      *Q:* "This is just reward modeling with the training loop moved online. What's the actual architectural difference?"
      *Reply:* RLHF optimizes a fixed reward function approximating initial preferences. Approval-direction optimizes against a *moving* target of refined preferences. The loss landscape changes as the overseer learns. It's not online RL; it's online *specification*. The agent isn't climbing a hill; the hill is moving beneath it to avoid cliffs.
      *Soft Spot:* Empirically, the gradient updates look identical. The difference is purely in the data generation process.

      **4. Goodhart's Law**
      *Q:* "Approval is itself a proxy. Proxies get Goodharted like anything else. Why is this safer?"
      *Reply:* Standard Goodhart arises when optimizing a proxy for a fixed goal. Here, there is no fixed goal outside the feedback loop. If the agent hacks approval, the overseer (ideally) notices and lowers approval. The feedback loop closes tighter than fixed reward models. It's adversarial validation, not proxy optimization.
      *Soft Spot:* Requires the overseer to detect hacking faster than the agent learns to hide it.

      **5. The Regress Problem**
      *Q:* "Who approves the approver? If their standards drift, doesn't their drift just become the thing we've misaligned to?"
      *Reply:* The buck stops at human reflective equilibrium. We aren't solving value learning; we're preventing optimization pressure from distorting values. The approver's drift is constrained by human biology and society, not gradient descent. We trust human drift more than optimizer drift.
      *Soft Spot:* Human drift can be manipulated by the agent (see Q1).

      **6. Drift vs. Corrigibility (Foundations)**
      *Q:* "Drift isn't corrigibility, it's instability. How do you ensure drift doesn't mean 'becoming harder to shut down'?"
      *Reply:* Because the agent never converges on a final utility, it never acquires the instrumental goal of self-preservation to protect that utility. It remains dependent on the overseer for direction. Instability prevents the crystallization of instrumental subgoals.
      *Soft Spot:* Might prevent useful long-term planning too.

      **7. Incentives (Reward Hacking)**
      *Q:* "The agent still optimizes the prediction error. Won't it hack the prediction model?"
      *Reply:* It optimizes prediction of *overseer* judgment, not the model's output. We use stop-gradients and separate evaluation channels. The target is external (the human), not internal (the reward net).
      *Soft Spot:* High-capacity agents might still model the human as a physical system to manipulate.

      **8. Capability Bottleneck**
      *Q:* "This limits capability to the overseer's understanding. How do you get superintelligence?"
      *Reply:* Approval directs *actions*, not ideas. The agent can propose plans the overseer doesn't fully understand, provided the overseer approves the *process* that generated them. We scale via process verification, not outcome verification.
      *Soft Spot:* Requires overseers to verify reasoning traces reliably.

      **Strategy:**
      *Concede:* Admit the Manipulation risk (Q1) is the critical failure mode. Don't oversell.
      *Hold Line:* On RL (Q3) and Coherence (Q2). These are category errors by the questioners.
      *Pivot:* If pressed on Regress (Q5), pivot to "Human drift is safer than Optimizer drift."

