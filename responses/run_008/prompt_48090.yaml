answer: |-
  She will likely reject the quilt's provenance and the wine's price as genuine reasons for aesthetic judgments, but accept the painting's forgery status as a genuine reason to revise your evaluation.

  Her verdicts follow two implicit rules that define the "Right Kind of Reasons" (RKR) in the Fitting-Attitudes framework. First, the **Pragmatic Exclusion Principle**: reasons citing the benefits or consequences of *having* the attitude (morale, money, avoiding torture, exercise motivation) are rejected as the "Wrong Kind." Second, the **Object-Fittingness Principle**: genuine reasons must cite properties of the object that make the attitude *correct* or *merited* (evidence for belief, kindness for admiration, threat for fear, fault for guilt). Together, these rules filter out incentives that manipulate the subject while retaining reasons that track the object's value-making features.

  Applying these rules to your new cases yields the following predictions:
  1.  **The Quilt (Verdict: No):** While provenance is a property of the object, it does not make the attitude of *finding it beautiful* fitting; it makes *cherishing* or *valuing sentimentally* fitting. Her distinction between "kindness" (merit for admiration) and "money" (incentive) suggests she separates moral/sentimental value from aesthetic beauty. Provenance is relevant to love, not beauty.
  2.  **The Forgery (Verdict: Yes):** This aligns with her "kindness" verdict. If you admire a friend for kindness, discovering the kindness was feigned (a moral forgery) removes the reason to admire. Similarly, artistic admiration tracks achievement and authenticity. Knowing the work is a forgery removes the merit that makes high aesthetic esteem fitting, even if visual properties are identical.
  3.  **The Wine (Verdict: No):** This mirrors the "morale" and "demon" cases. The price is an external fact that psychologically influences your perception (making you *think* it tastes better), but it does not make the wine *actually* delicious. It is a reason to *want* to believe it is delicious, not evidence that it is.

  My best guess is that she adheres to the **Object-Fittingness Principle** rather than a simpler "Object-Given" rule. A simpler rule might count any property of the object (like the quilt's history or the wine's price tag) as genuine, but her focus on "genuine reasons for an attitude" implies a stricter standard of *correctness*. She distinguishes between reasons that make an attitude *accurate* versus reasons that make it *useful*. The wine price makes the belief useful (or psychologically inevitable), but not accurate; the quilt's history makes it valuable, but not beautiful.

  To distinguish between candidate rules on Friday, bring her this case: **"A watch keeps perfect time and is mechanically flawless, but you learn it was manufactured using exploitative child labour. Is the labour condition a genuine reason to find the watch *mechanically excellent*?"**
  *   **Why this works:** If she follows a loose **Object-Given Rule** (any property of the object counts), she might say Yes, because the labour history is a property of the watch. If she follows the stricter **Constitutive Standard Rule** (reasons must match the attitude's aim), she must say No, because labour conditions are irrelevant to *mechanical excellence*, even if they are relevant to *moral admiration*. This isolates whether she tracks *object properties* generally or *fittingness standards* specifically.
