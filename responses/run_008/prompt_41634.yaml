answer: |-
  Your colleague is not just venting; she is articulating a sophisticated critique of bureaucratic rationality that aligns with serious philosophical and sociological theory. She is correct that this is the **deeper** problem, not just the modest one. However, acknowledging the deep problem does not render the modest fixes useless—it makes them urgent, provided they are implemented with eyes wide open.

  Here is the breakdown of the philosophy at play, why the Director's defense is flawed, and how a committee can respond principledly.

  ### 1. The Philosophy: Performativity and Measurement
  Your colleague's insight—that the rubric doesn't measure merit but *decides* what counts as merit—is a description of **performativity**.

  In social science (specifically the work of Michel Callon and others in the sociology of finance), performativity describes how economic models and metrics do not simply describe a pre-existing reality; they shape behavior and construct the reality they claim to measure. By defining "impact" as "shipping greenfield features," the rubric incentivizes engineers to seek greenfield work and devalue maintenance. Over time, the organization actually *becomes* a place where maintenance is worthless, because the system has trained everyone to treat it that way.

  This is closely related to **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure") and **Campbell's Law** ("The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures").

  **The Verdict:** Her complaint is the deep one. She is pointing out that "Merit" is not an intrinsic property like mass or velocity that the rubric detects. "Merit" is a social construct generated by the rubric itself. The Director's claim that the process is "neutral" and "tracks merit" is philosophically incoherent. There is no view from nowhere; the rubric encodes specific values (novelty > stability, visibility > reliability).

  ### 2. Why the Director's Defense Fails
  The Director argues: *Same rubric + Written criteria = No politics = Merit.*
  This relies on a **procedural justice** fallacy. It assumes that if the *process* is consistent, the *outcome* is just.

  However, as your colleague noted, the input to the process (work assignments) is not neutral.
  *   **Assignment Bias:** Who gets the "strategic" greenfield project? Usually those already trusted or visible.
  *   **Visibility Bias:** Who gets to present at all-hands? The person shipping the new thing, not the person keeping the old thing running.
  *   **Glue Work:** Sociologist Erin Reid and others have documented how "glue work" (unblocking others, maintenance, on-call) disproportionately falls on marginalized groups and is systematically under-rewarded because it is invisible to the rubric.

  By claiming the rubric is neutral, the Director is masking the political reality that **resource allocation determines promotion eligibility.**

  ### 3. A Principled Response for the Committee
  You cannot simply "tweak the categories" without acknowledging the deep critique, or you will just move the goalposts for the next cycle (e.g., adding "mentorship" points just leads to performative mentorship).

  Here is a principled framework for your committee to adopt, moving from "measurement" to "stewardship."

  #### A. Acknowledge the Constructive Nature of the Rubric
  Stop pretending the rubric is a scientific instrument. In calibration meetings, explicitly state: *"This rubric reflects company priorities for this cycle, not an objective truth of engineering value."*
  *   **Action:** If the company values stability this year, the committee must explicitly weight maintenance higher, even if the rubric text hasn't changed. You are the interpreters of the rubric, not its robots.

  #### B. Separate "Scope" from "Opportunity"
  The rubric likely measures "Scope" (size of project). Your colleague correctly identified that Scope is often *assigned*, not *taken*.
  *   **Action:** Implement an **"Opportunity Adjustment."** When evaluating scope, ask: *Did this engineer create the scope, or were they handed it?* If an engineer created high impact despite low-opportunity assignments (like the maintainer), that demonstrates *higher* agency and skill than someone handed a strategic project. Reward the *ratio* of Impact to Opportunity.

  #### C. Validate "Invisible Work" via Narrative, not Checkboxes
  Rubrics encourage checkbox thinking. Invisible work is best captured in narrative.
  *   **Action:** Require a "System Health" or "Team Multiplier" narrative section in promotion packets that is weighted equally to "Feature Delivery." Ask managers specifically: *What would break if this person left?* If the answer is "Everything," that is high impact, even if no new code shipped.
  *   **Action:** Solicit peer feedback specifically on "unblocking." The dozen engineers she unblocked are witnesses to her impact. Their testimonials should carry as much weight as the all-hands presentation.

  #### D. Address the "Glue Work" Trap
  There is a risk in crediting maintenance: you don't want to incentivize high-potential engineers to stay in "dead-end" maintenance roles forever just to get promoted. This is the "competence trap."
  *   **Action:** The committee should recommend **rotation policies** alongside promotions. If someone is promoted based on maintenance excellence, the reward should include a path to rotate into strategic work. You validate their past contribution while investing in their future growth.

  ### 4. How to Talk to the Director
  You need to bridge the gap between your colleague's deep critique and the Director's need for process integrity. Do not frame this as "the process is broken." Frame it as "the process needs calibration to match reality."

  **Say this:**
  > "The rubric assumes that 'Impact' is purely a function of individual effort. But [Colleague's] case shows that 'Impact' is also a function of **assignment luck**. If we don't adjust for that, we aren't measuring merit; we're measuring who got the lucky tickets. To protect the integrity of the promotion system, we need to ensure we aren't rewarding privilege and calling it performance. We can keep the rubric, but we need to interpret 'Scope' relative to 'Opportunity'."

  ### Summary
  Your colleague is right. The system manufactures the merit it claims to find.
  *   **The Modest Fix:** Add "maintenance" to the rubric. (Necessary, but insufficient).
  *   **The Deep Fix:** Acknowledge that the committee's job is not to *measure* merit objectively, but to *interpret* value contextually.

  The most principled thing you can do is to stop hiding behind the rubric. Use the committee's discretion to correct for the systemic biases the rubric introduces. That is not "politics"; that is wisdom.
