      *   *Philosophy Check:* The colleague is channeling **Performativity** (Michel Callon/Economics) and **Campbell's/Goodhart's Law**. She's right: metrics create reality.
      *   *The "Which is it?" Answer:* It is the deeper one. But acknowledging the deeper one makes the modest fix *more* important, not less. If you think the rubric is neutral, you just tweak it. If you know it's constructive, you have to manage the construction consciously.
      *   *Principled Response:*
          1.  **Admit the Construct:** The committee should explicitly state: "This rubric reflects company priorities, not universal truth."
          2.  **Narrative over Checkboxes:** Shift from "did you hit X?" to "tell us the story of your impact."
