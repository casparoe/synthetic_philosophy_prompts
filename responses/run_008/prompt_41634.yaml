  1.  **Analyze the User and the Situation:**
      *   **User:** Software engineer, member of promotion committee.
      *   **Context:** Recent promotion cycle caused moral discomfort.
      *   **Case A (Promoted):** Led greenfield, strategic project, shipped, presented at all-hands. Fits rubric ("scope", "impact").
      *   **Case B (Not Promoted):** Maintained critical legacy system, high on-call load, unblocked others. Invisible work. Doesn't fit rubric well.
      *   **Director's Defense:** Process is neutral, rubric is objective, outcomes = merit.
      *   **Colleague's Rebuttal:** The rubric *defines* merit rather than measuring it. "Impact" is a function of assignment/visibility, not just effort/skill.
      *   **User's Question:** Is the colleague's complaint modest (fix the rubric) or deep (rubrics can't capture true merit)? Is there a *principled* way to respond/act beyond tweaking categories?
      *   **Constraint:** User has no philosophy background but is asking a philosophical/sociological question about bureaucracy, measurement, and value.

  2.  **Deconstruct the Colleague's Argument:**
      *   *Claim 1:* The rubric doesn't measure contribution; it decides what counts.
      *   *Claim 2:* "Impact" is contingent on assignment/visibility (luck/privilege), not just individual agency.
      *   *Implication:* The system claims objectivity but actually constructs a specific type of value (new > old, visible > invisible).

  3.  **Identify the Philosophical/Sociological Concepts:**
      *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." (Relevant, but maybe too simplistic).
      *   **Performativity:** (Judith Butler, but applied to economics/sociology). The theory describes how economic models shape the reality they claim to describe. Michel Callon's "performativity of economics."
      *   **Bureaucratic Rationality:** (Max Weber). Rules create efficiency but can lead to irrational outcomes (the "iron cage").
      *   **Epistemic Injustice:** (Miranda Fricker). Testimonial injustice (not believing her) or Hermeneutical injustice (lacking the concepts to understand her experience).
      *   **The "Map is not the Territory":** (Alfred Korzybski). The rubric is a map; the work is the territory.
      *   **Power/Knowledge:** (Foucault). Systems of classification create power dynamics.

  4.  **Evaluate the "Modest vs. Deep" Dichotomy:**
      *   *Modest:* We just need better metrics (e.g., add "reliability" or "mentorship" to the rubric).
      *   *Deep:* Any metric will suffer from this because value is contextual and political, not intrinsic.
      *   *Verdict:* It's *both*, but the deep critique validates the modest fix. If you don't acknowledge the deep critique, the modest fix will just shift the problem elsewhere (e.g., now people "game" mentorship).

  5.  **Formulate the Response Strategy:**
      *   **Validate:** Acknowledge the colleague is philosophically astute. She has identified a real phenomenon.
      *   **Name the Phenomenon:** Give the user the vocabulary (Performativity, Goodhart's Law, Campbell's Law). This empowers them.
      *   **Address the "Modest vs. Deep" Question:** It's not binary. The deep insight *necessitates* a different approach to the modest fix.
      *   **Provide Principled Actions:** Move beyond "tweaking categories." How does a committee operate with this knowledge?
          *   Acknowledge the constructiveness of the rubric.
          *   Introduce qualitative judgment/narrative.
          *   Calibrate for "invisible work."
          *   Separate "reward" from "promotion" (maybe).
      *   **Tone:** Empathetic, intellectual but accessible, actionable.

  6.  **Drafting the Content (Iterative refinement):**

