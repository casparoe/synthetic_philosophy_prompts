answer: |-
  This is a high-stakes internal pitch. You are effectively arguing for a "structural/systemic" allocation within a "direct intervention" framework. Your committee is not hostile to EA principles; they are hostile to *unquantified risk*.

  Here is the diagnosis of your strategy, the correction on funging, and the Q&A prep sheet you requested.

  ### Part 1: Critique of Your "Map" Argument
  **Verdict:** It is rhetorically strong for the Donors, but technically weak for the Analysts.
  **Why:** The Health Economist and ex-GiveWell analysts know that maps *should* only show paved roads. In their view, driving off-road isn't "exploration," it's "inefficient resource allocation." If you frame this as "measurement is flawed," they will hear "I want to ignore data."
  **The Fix:** Reframe this not as a critique of measurement, but as **Portfolio Theory** and **Model Uncertainty**.
  *   **Donors:** Use the "Map" analogy (Legibility vs. Reality).
  *   **Analysts:** Use "Exploration vs. Exploitation." You are allocating 10% to *information value* and *tail-risk hedging*. If the bednet model breaks (e.g., insecticide resistance, supply chain collapse), you have zero optionality. The institutional grants are an option on a different cost-function.

  ### Part 2: Straightening Out "Funging"
  You are half-right, which is dangerous in that room.
  1.  **Donor Funging (The Counterfactual):** You are correct. If you skip bednets, another donor (AMF, government) likely fills the gap. If you skip the tenant union, the funding likely vanishes. **Your marginal dollar has higher counterfactual impact on the union.**
  2.  **The Trap:** The EA counter-argument is that the *absolute* impact of the bednet is so massive that even if 50% of it is funged, it still outperforms the union.
  3.  **Government Funging (The Risk):** If the tenant union wins higher wages, the government might cut welfare subsidies. If you fund deworming, the government might integrate it into public health and reduce their own spend. Both have funging risks, but the political one is harder to model.
  4.  **Your Line:** "Bednets are highly *crowded*; Organizing is highly *neglected*. We are adjusting for neglectedness, not ignoring cost-effectiveness."

  ---

  ### Part 3: Q&A Prep Sheet
  **Order:** Highest Damage Potential → Lowest.
  **Format:** Objection (in their voice) | 2-Minute Reply | The Soft Spot.

  #### 1. The "Knowingly Doing Less Good" Objection (Comparative Cost-Effectiveness)
  **Who:** Health Economist / Ex-GiveWell Analyst
  **The Question:** "Let's look at the spreadsheet. Even with a 50% uncertainty discount on deworming, the cost-per-DALY is an order of magnitude better than your best-case scenario for a tenant union. By allocating 10% here, aren't you explicitly asking us to burn money to save fewer lives? How is that consistent with our mandate?"
  **The Reply:** "It's consistent if we treat our cost-effectiveness estimates as *probabilistic inputs*, not fixed constants. The deworming number is precise, but it relies on external validity assumptions that are fragile (e.g., compliance, resistance). The organizing number is imprecise, but it targets *systemic parameters* rather than *symptomatic outcomes*.
  This isn't burning money; it's paying an 'uncertainty premium.' If our model of direct delivery is wrong—or if the political environment shifts and makes direct delivery impossible—we have zero hedging. This 10% is an allocation to **robustness**, not just raw expected value. We are buying optionality on a different causal pathway."
  **The Soft Spot:** You don't actually have an EV number for the organizing. You are asking them to trust a qualitative argument over a quantitative one. If they press for *any* number, you have to admit it's a guess.

  #### 2. The Funging/Counterfactual Objection
  **Who:** Philosophy PhD (Person-Affecting) / Tech Donor
  **The Question:** "I'm worried about the counterfactual. If we don't fund bednets, another donor likely will. If we don't fund this union, would anyone else? If the answer is 'no,' that helps your case. But if the union succeeds, won't the government just capture the win and reallocate their budget elsewhere, neutralizing the welfare gain?"
  **The Reply:** "On the donor side: You're right. Bednet funding is crowded. Our marginal dollar on deworming has a high probability of being replaced by another funder. Our marginal dollar on organizing is in a neglected space; it is almost certainly counterfactual.
  On the government side: That is a risk, but it's a risk of *success*. Even if the government captures the win, the capacity remains. A union that forces a government response is a union that has built power. That power persists even if the specific policy win is funged. We are funding *capacity*, not just policy outcomes. Capacity is less fungible than policy."
  **The Soft Spot:** "Capacity" is hard to measure. If the union wins and then dissolves, did you buy capacity or just a one-off win? It's hard to prove the capacity persists.

  #### 3. The Measurability/Legibility Objection
  **Who:** Ex-GiveWell Analyst / Tech Donor
  **The Question:** "We fund what we can count. Bednets are distributed, DALYs are saved. With a tenant union, what is the denominator? Is it 'number of meetings held'? That's activity, not impact. If we can't measure the outcome, how do we know when to pull the plug?"
  **The Reply:** "We need to distinguish between *monitoring* and *evaluation*. We can monitor proxies: membership growth, retention, specific wage settlements. But you're right, we can't evaluate this with an RCT.
  However, legibility bias is a risk. If we only fund what is easily legible, we optimize for interventions that are easy to measure, not necessarily those that are most impactful. We should treat this 10% as a **learning portfolio**. We set clear 'kill criteria' (e.g., if membership drops 20% YoY, we exit), but we accept that the ultimate metric is long-term welfare, which lags by years."
  **The Soft Spot:** You are admitting you can't track the ultimate goal (welfare). You are asking them to fund a "black box" for 3-5 years.

  #### 4. The Accountability/Politics Objection
  **Who:** Tech Donor / Philosophy PhD
  **The Question:** "Bednets are apolitical. Organizing is inherently political. We are private donors, not an electorate. By funding tenant unions, aren't we taking sides in local political disputes without any mandate? What if they organize against a government we need to work with on vaccine distribution?"
  **The Reply:** "Two points. First, 'apolitical' is an illusion. Distributing bednets requires government permission, which is a political act. We are already embedded in local politics.
  Second, we aren't funding a *platform*; we are funding *agency*. We aren't telling them what to demand; we are funding their capacity to negotiate. Our accountability mechanism is the grantee's accountability to their members. If the union members fire the leadership, we follow their lead. We are subordinate to the local stakeholders, not imposing a worldview."
  **The Soft Spot:** You *do* have veto power. If they organize in a way that threatens your other grantees, you will pull funding. You are not truly subordinate; you just claim to be.

  #### 5. The "Boredom" Objection (The One You Fear)
  **Who:** Senior Analyst (who knows you well)
  **The Question:** "You've been doing bednet analysis for two years. This proposal looks a lot like 'intellectual novelty.' Are you sure this isn't just career capital building or boredom with the core portfolio disguised as strategic innovation?"
  **The Reply:** "That's a fair check. If this were 50% of the portfolio, I'd agree. But at 10%, it's portfolio diversification.
  My personal motivation is secondary to the risk profile. If I'm wrong, we lose 10% of the portfolio's potential efficiency. If I'm right, we uncover a high-leverage pathway that the field is currently ignoring because it's 'too hard to measure.' I'm willing to stake my internal reputation on the tracking of this pilot. If the proxies don't move in 18 months, I will recommend cutting it myself."
  **The Soft Spot:** It's hard to prove you aren't bored. Offering to cut it in 18 months is a strong commitment, but they might worry you'll spin the metrics to keep it alive.

  ---

  ### Strategic Advice for the Meeting

  1.  **Don't Fight the DALY:** Do not try to argue that organizing saves more DALYs than bednets. You will lose. Argue that DALYs are an *incomplete* metric for welfare (e.g., they miss agency, coercion, dignity) and that the committee has a mandate to maximize *welfare*, not just minimize *mortality*.
  2.  **Use Their Language:** When talking to the GiveWell types, use "Counterfactual Impact" and "Neglectedness." When talking to the Donors, use "Option Value" and "Tail Risk."
  3.  **The "10%" Anchor:** Keep emphasizing that this is a *cap*, not a target. You are asking for permission to explore, not a mandate to pivot. This lowers the temperature.
  4.  **Pre-empt the "Politics" Charge:** Acknowledge the risk explicitly. "I know this introduces political risk. That is exactly why it is only 10%."

  **Final thought:** Your sketch isn't weak, but it's too poetic. Translate "Map vs. Territory" into "Model Uncertainty vs. Parameter Precision." Good luck.
