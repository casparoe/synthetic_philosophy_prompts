      *Wait, better angle:* The "Hidden Conceptual Question" the user mentioned is the winner. What *is* degradation? If the Anti-side can't define it beyond "I feel it," the Pro-side wins. If the Pro-side can't show regulation prevents it, the Anti-side wins. The stalemate is because neither side is forced to operationalize their core concept.

      *Okay, final plan:*
