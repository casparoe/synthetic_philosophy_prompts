  4.  **Synthesize a Diagnosis:**
      *   The User's baseline hypothesis is correct *as far as it goes*, but it's a symptom, not the root cause. The baseline disagreement exists because the two sides operate with different *moral ontologies* regarding the body and consent.
      *   *Pro-Market:* Utilitarian/Consequentialist leanings + Liberal Autonomy. Body as property/resource. Consent is procedural (did you sign?).
      *   *Anti-Commodification:* Deontological/Virtue Ethics leanings + Relational Autonomy. Body as constitutive of self. Consent is substantive (was the choice truly free?).
