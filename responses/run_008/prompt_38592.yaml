          *   *What counts as progress?* Not conversion, but **precision**.
          *   *Suggestion 1: Reframing the Question.* Move from "Is it permissible?" to "Under what specific institutional conditions does the expressive harm outweigh the welfare gain?" (Marginal analysis).
          *   *Suggestion 2: The "Degradation" Mechanism.* Force the Anti side to specify *who* is degraded and *how*. Is it the seller? The buyer? Society? If it's society, is that aggregation of individual harms or a holistic entity?
