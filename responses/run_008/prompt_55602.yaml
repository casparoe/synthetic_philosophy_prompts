answer: |-
  **The Algorithmic Egg Counter**

  You are shopping at a large supermarket known to source its eggs from "Factory Farm Z," a facility documented to maintain severe animal welfare violations. You intend to buy a carton of eggs. The store uses an automated inventory system to order from Factory Farm Z. Every Monday, the farm delivers a fixed shipment of 1,000 cartons. Every Sunday night, the store's system calculates next week's order based on two metrics: (1) total sales and (2) total waste (unsold cartons destroyed). The farm's production schedule is sensitive to "Net Demand," defined as Sales minus Waste. If Net Demand rises above a specific threshold, the farm increases production for the following cycle (increasing animal suffering). If Net Demand stays below the threshold, production remains stable. However, the store has a secondary policy: any eggs unsold by Sunday night are incinerated, generating significant carbon emissions and local pollution.

  It is Sunday afternoon. You observe that exactly 500 cartons have been sold this week. You do not know how many cartons remain on the shelf, nor do you know the specific threshold for production increases, only that historical data suggests a 50% probability that current Net Demand is just below the threshold and a 50% probability it is already above it. If you buy a carton now, one of two things will happen. In the first scenario (50% likelihood), your purchase converts a unit of potential waste into a sale. This lowers the reported waste figure, keeping Net Demand below the production threshold. The immediate result is that one carton is saved from incineration (reducing environmental harm), and no additional eggs are produced next week. In the second scenario (50% likelihood), your purchase pushes the Sales metric high enough to trigger the production threshold regardless of waste. The immediate result is that the farm schedules an additional batch of eggs for next week (increasing animal welfare harm), and the carton you bought would have been sold anyway by another customer. You have no way of knowing which scenario obtains, nor will you ever find out.

  **Verdicts**

  (i) Pure difference-making consequentialism verdict: The act is permissible, provided the agent turns out to be in the first scenario where no additional production is triggered.
  (ii) Expected-consequence view verdict: The act is permissible because the expected negative impact is cancelled out by the expected positive impact of waste reduction.
  (iii) Complicity or participation view verdict: The act is wrong because it constitutes voluntary participation in a practice known to be exploitative, regardless of marginal causal leverage.

  **Defense of Verdicts**

  (i) **Pure Difference-Making Consequentialism:** This view holds that an act is wrong only if it actually makes the world worse than it would have been otherwise. In the first scenario, the agent's purchase prevents incineration without triggering new production, making the world slightly better. In the second scenario, the purchase triggers new production, making the world worse. Since the agent cannot know which outcome obtains, the theory cannot condemn the act *ex-ante*; it must wait for the counterfactual truth. If the agent is in the first scenario (which is equally likely), the act is not wrong. Therefore, based on the available evidence that the act might be beneficial, the theory cannot classify the act as clearly wrong.

  (ii) **Expected-Consequence View:** This view judges acts by the weighted sum of their possible outcomes. Here, the probability of reducing harm (preventing incineration without triggering production) is roughly equal to the probability of increasing harm (triggering additional production). Assuming the moral weight of preventing waste is comparable to the moral weight of the marginal production signal (as stipulated by the "slightly reduce/increase" constraint), the expected utility of buying is approximately zero. Since the act is not expected to cause net harm, the expected-consequence view renders it permissible, or at least morally neutral.

  (iii) **Complicity/Participation View:** This view argues that individuals can be morally tainted by joining in a collective enterprise that is wrongful in the aggregate, even if their specific contribution is causally negligible or ambiguous. By purchasing eggs from Factory Farm Z, the agent intentionally integrates themselves into the supply chain of a known violator of welfare standards. The wrongness stems from the relationship established between the agent and the harmful practice—supporting the farm's economic viability and treating its products as acceptable commodities—rather than the precise marginal outcome of that specific transaction. Thus, the act is wrong because it is an act of participation in injustice.

  **The Feature Doing the Work**

  The single feature driving the divergence in verdicts is **the agent's intentional integration into a harmful supply chain despite causal ambiguity.** The case isolates the *participatory* element from the *causal* element. By constructing a scenario where the causal impact is epistemically opaque and expected to be neutral, the case forces a choice between judging the act by its consequences (which are uncertain/neutral) or by its nature as support for a harmful institution. The complicity view latches onto the intentional support; the consequentialist views latch onto the uncertain impact.

  **Removing the Feature**

  If we remove the feature of **intentional integration into a harmful supply chain**—for example, if the eggs were sourced from a verified ethical farm—the complicity verdict disappears immediately. Without the background injustice of Factory Farm Z, there is no wrongful practice to participate in. The consequentialist verdicts would remain largely unchanged (the act is still permissible due to neutral expected impact), but the intuitive force of the case collapses; no one would feel a strong intuition that buying ethical eggs is wrong even if the impact is uncertain. This shows that the "wrongness" in the original case is derived entirely from the moral status of the practice being joined, not the mechanics of the purchase itself.

  **The Difference-Making Theorist's Best Attack**

  The difference-making theorist's best attack relies on the **redundant-participant analogy**. They will argue that in the 50% of cases where the agent's purchase does not trigger the production threshold (either because they prevented waste or because sales were already high enough), the agent is merely a redundant participant. In standard inefficacy cases (like voting or boycott), we intuitively feel that the redundant voter is not responsible for the outcome. The theorist will claim that this case hurts the complicity view because it asks us to condemn an agent who, in half the possible worlds, literally made the world better (by saving waste) and in the other half, was merely one of many causing harm. They will argue that if we condemn the agent here, we are punishing them for luck (whether they happened to be the threshold trigger) or for guilt by association, which violates the principle that moral responsibility requires control over outcomes. They will contend that the "clear instance of wrongfulness" is an illusion created by focusing on the harmful industry rather than the specific act's causal profile; if the act doesn't make things worse, it cannot be wrong, regardless of how unsavory the supply chain is.
