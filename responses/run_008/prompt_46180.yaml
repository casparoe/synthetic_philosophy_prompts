answer: |-
  Assumptions I'm making
  We process 300M larvae/month. I'm setting the sentience probability threshold ($P$) at 5%. This isn't arbitrary; it's the lower bound of credible scientific consensus on insect nociception (e.g., Birch et al.). Below 5%, we treat them as biological machinery; above it, they enter the moral calculus. I'm rejecting the Science Guy's pure cost-effectiveness model because we have a specific duty of care to *our* animals, not just global utility maximization. I'm rejecting the Board's hard cap as a decision rule because it ignores the magnitude of harm; a 0.1% cap is a budget constraint, not an ethical boundary. All cost data comes from farm managers, adjusted +20% for implementation friction.

  The Procedure
  1.  **Identify the Harm:** Define the stressor (e.g., heat, hunger, crushing). Assign an Intensity Score (1–10) based on vertebrate analogues, discounted by 50% for phylogenetic distance.
  2.  **Check the Probability:** Is there credible evidence of nociception or avoidance learning for this stressor? If no, stop (no spend). If yes, proceed.
  3.  **Apply the Threshold:** Is the estimated probability of sentience ($P$) ≥ 5%? If no, stop (no spend). This number comes from the lower bound of peer-reviewed insect welfare literature; anything lower is speculation, not risk management.
  4.  **Calculate Expected Suffering Units (ESU):** $ESU = \text{Population} \times P \times \text{Intensity} \times \text{Duration}$.
  5.  **Cost-Benefit Test:** Calculate the cost to mitigate ($C$). If $C > (\text{ESU} \times \$10)$, reject the intervention. The $10 multiplier is our precautionary buffer against being wrong about $P$.
  6.  **Budget Cap Check:** Does total annual welfare spend exceed 0.1% of revenue? If yes, prioritize interventions with the highest ESU/$ ratio until cap is met.
  7.  **Decision:** Implement if steps 3–6 pass. If step 3 fails but public reputational risk is high, escalate to Board for a values call.

  The Three Cases
  **(a) Kill Method:** Live grinding scores high on Intensity (8/10) and affects 100% of the batch. However, freezing bulk lines triples processing costs. At $P=5\%$, the Expected Suffering is significant, but the Cost-Benefit Test fails. The cost per unit of suffering prevented exceeds our $10 multiplier. **Verdict:** Continue live grinding for bulk lines. This is the answer I won't like: the arithmetic says the financial burden outweighs the expected moral gain at our current probability threshold. We stick to freezing only for premium pet-food lines where margins absorb the cost.

  **(b) Pre-harvest Fast:** Hunger intensity is low (3/10) but duration is 24 hours. Population is 300M. ESU is moderate. Mitigation (processing full guts) causes machinery clogging, costing significant downtime ($C$ is high). The Cost-Benefit Test fails. **Verdict:** Continue fasting. The procedure indicates that while hunger is theoretically negative, the operational cost of preventing it is disproportionate to the low-intensity suffering expected at $P=5\%$. This is efficient, but feels callous.

  **(c) Breeding Adults:** Adults lack functional mouthparts but show stress behaviors without water. Intensity is moderate (5/10), Duration is 7 days. Cost of water provision is negligible (plumbing exists). ESU is high relative to near-zero $C$. **Verdict:** Maintain water provision. This passes easily. The procedure confirms this isn't theater; even at low $P$, the low cost makes it a dominant strategy. It validates current practice as welfare-positive, not just marketing.

  Where it Breaks
  The procedure misfires when managers inflate mitigation costs to avoid operational changes; I need an independent audit mechanism for step 5. It also fails if scientific consensus shifts $P$ above 20% overnight—the $10 multiplier won't save us then, and we'll face a Board-level crisis. Finally, it cannot handle "unknown unknowns" (suffering modes we haven't conceived of). In those cases, the checklist forces a "values call" because the arithmetic returns null.

  What Would Change My Mind
  If new peer-reviewed findings demonstrate insects possess central integration comparable to vertebrates (not just nociception), I would raise the $P$ threshold to 50%. This would flip the Kill Method ruling immediately, making grinding indefensible regardless of cost. The likeliest point of failure is Step 1 (Intensity Score); we are guessing vertebrate analogues for invertebrate experiences. If we find larval behavior indicates "pain" is qualitatively different (worse or better) than our 50% discount assumes, the whole arithmetic collapses.
