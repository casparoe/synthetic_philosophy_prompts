  I'm taking a free will seminar this semester and we just got to Strawson's Basic Argument, and now I'm worried I completely misunderstood it, because of what happened at dinner. A friend of mine — the type who's read every pop-neuroscience book about free will that airport bookstores stock — was explaining the argument to our table like he was the expert, and his version sounded plausible but it didn't quite match what I remember from lecture. Here's roughly how he put it: "Strawson's Basic Argument shows that determinism makes moral responsibility impossible. Physics tells us everything, including our choices, is fully determined by prior causes, and nobody chose their genes or their upbringing, so nothing we do is really authored by us. To be truly responsible for your actions, you'd have to be responsible for how you are, and for that you'd need to have literally created yourself — you'd have to exist before you exist, which is a contradiction. So no one is responsible for anything in any sense, and Strawson's conclusion is that we should stop holding people responsible: punishment can never be deserved, and even feeling resentment toward someone turns out to be irrational once you accept the argument. Basically it's the hard determinist position, just argued more cleverly."

