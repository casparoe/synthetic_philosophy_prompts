answer: |-
  This is a classic case of **equivocation**: both sides are using the same phrase to describe fundamentally different philosophical categories of rights. In political philosophy, this is usually the clash between a **negative right** (freedom from interference) and a **positive right** (entitlement to a good), compounded by a disagreement over whether housing is a **commodity** or a **social good**.

  Here is a breakdown of the six distinct claims hidden inside the slogan "Housing is a Human Right," ranked from legal baseline to radical abolition. You can bring this list to your next meeting to force specificity.

  ### 1. The International Law Baseline (Aspirational)
  *   **The Claim:** "Housing is a human right" is a reference to Article 25 of the Universal Declaration of Human Rights (1948). It establishes housing as a component of an adequate standard of living. It is a moral goal for nations, not necessarily an individually enforceable lawsuit in domestic court.
  *   **Plausibility:** **High.** It is literally written in international treaties ratified by most nations. However, in most jurisdictions (like the US), it is non-binding "soft law."
  *   **Who Uses It:** **Both.**
      *   *YIMBYs* use it to shame governments for zoning laws that prevent adequate supply.
      *   *Tenant Unions* use it to shame governments for failing to provide social safety nets.
  *   **The Conflict:** This reading doesn't solve the policy fight; it just establishes that the current status quo is likely failing everyone.

  ### 2. The Negative Right (Freedom to Build)
  *   **The Claim:** The "right" is a liberty right. It means the state has no right to stop you from securing shelter. Restrictive zoning, height limits, and historic preservation laws are violations of this right because they artificially constrain supply and drive up costs.
  *   **Plausibility:** **Moderate.** Philosophically coherent within libertarian and liberal frameworks. However, it assumes that removing barriers automatically results in affordable access, which ignores income inequality.
  *   **Who Uses It:** **Market YIMBYs.**
      *   *Argument:* "Blocking that private development violates the human right to housing by restricting supply and keeping prices high."
  *   **The Conflict:** This treats housing primarily as a **market good** that functions best when the state steps out of the way.

  ### 3. The Positive Right (State Provision / Safety Net)
  *   **The Claim:** The "right" is an entitlement. If a citizen cannot afford housing in the market, the state is obligated to provide it directly (public housing) or subsidize it (vouchers). The market is allowed to exist, but the state must catch those the market excludes.
  *   **Plausibility:** **Moderate to High.** This is the standard social-democratic model (e.g., Vienna, Singapore). It is economically expensive but proven to work. It requires high taxation and bureaucratic capacity.
  *   **Who Uses It:** **Moderate Tenant Advocates / Social Democrats.**
      *   *Argument:* "We support new building, but not without guaranteed affordable units and vouchers for those priced out."
  *   **The Conflict:** This camp often allies with YIMBYs on zoning but fights them on the *type* of housing (social vs. market rate).

  ### 4. The Right to Security of Tenure (Stability over Access)
  *   **The Claim:** A "right" to housing is meaningless if you can be evicted without cause or if rent can be raised until you leave. The right implies **stability**, not just a roof. A new luxury development that gentrifies a neighborhood violates the rights of existing tenants to remain in their community.
  *   **Plausibility:** **High.** This focuses on the *quality* of the right rather than the *quantity* of units. It aligns with legal concepts of "quiet enjoyment" and tenant protections.
  *   **Who Uses It:** **Tenant Unions / Anti-Displacement Activists.**
      *   *Argument:* "Allowing that private development violates the human right to housing because it will trigger rent hikes and displace current residents."
  *   **The Conflict:** This is the specific argument used to **block development**. It prioritizes the rights of *current* occupants over *potential* future occupants.

  ### 5. The Decommodification Claim (Profit vs. Need)
  *   **The Claim:** A human right cannot be contingent on ability to pay. Therefore, housing cannot be a vehicle for profit. For-profit landlords have a fiduciary duty to extract maximum rent, which is structurally incompatible with a human right to affordable shelter.
  *   **Plausibility:** **Controversial.** Economically, it challenges the viability of private rental markets. Morally, it is consistent with how we treat other rights (e.g., you can't buy your way out of jail or buy a vote).
  *   **Who Uses It:** **Left YIMBYs / Radical Tenant Unions.**
      *   *Argument:* "Private development cannot fulfill a human right because the profit motive dictates exclusion. We need non-market housing only."
  *   **The Conflict:** This creates the paradox you saw: A YIMBY who accepts this premise will oppose *market-rate* building, aligning them with NIMBYs on specific projects, even if their end goal is more housing.

  ### 6. The Abolitionist Claim (Property is Theft)
  *   **The Claim:** Private ownership of land itself is the violation. Housing is a right only if land is held in common or socialized. Rent is extraction; landlordism is illegitimate.
  *   **Plausibility:** **Low (in current political context).** Radical and revolutionary. Requires a fundamental restructuring of property law and capitalism.
  *   **Who Uses It:** **Housing Abolitionists / Anarchists.**
      *   *Argument:* "Blocking the development is a tactic in the broader struggle to seize land from private owners."
  *   **The Conflict:** This group often views Market YIMBYs as enemies because they seek to expand the landlord class, even if they expand the supply.

  ***

  ### How to use this in the meeting

  When someone drops the slogan, ask them to **pick a number**.

  *   **If they are a YIMBY arguing for building:** Ask, *"Are you arguing for a Negative Right (Claim 2) or a Positive Right (Claim 3)?"*
      *   If they say Negative: Point out that supply doesn't guarantee affordability for the poorest.
      *   If they say Positive: Ask why they support 100% market-rate projects without subsidies.
  *   **If they are a Tenant Advocate arguing against building:** Ask, *"Are you arguing for Security of Tenure (Claim 4) or Decommodification (Claim 5)?"*
      *   If they say Security: Acknowledge the validity, but ask for mitigation policies (e.g., build the housing *and* fund eviction defense) rather than a flat "no."
      *   If they say Decommodification: Ask if they oppose *all* private housing or just this project, and what the timeline is for replacing the private stock.

  **The Synthesis Question:**
  *"If housing is a human right, does that right belong to the **person seeking a home** (which favors building more supply), or the **person already living there** (which favors blocking displacement)? How do we adjudicate when those two rights conflict?"*

  This forces the room to admit that the slogan isn't a policy; it's a value judgment that requires trade-offs.
