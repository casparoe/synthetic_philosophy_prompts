prompt: |-
  I keep running into the slogan 'housing is a human right' from two camps that can't stand each other: tenant union types who want rent control and mass social housing, and YIMBYs who think restrictive zoning is itself the rights violation and just want building legalised everywhere. At a meeting a few weeks ago one speaker used the slogan to argue we should block a new private development (for-profit housing apparently can't fulfil a right), and then someone else used the exact same sentence a week later to argue blocking the thing is the actual rights violation. Can you unpack the distinct precise claims the slogan could be making — everything from the near-trivial (the Universal Declaration says something along these lines) up to the radical (private landlordism is illegitimate full stop) — and for each one say whether it's plausible, and crucially which readings support which camp? Ideally give me a list I can bring next time people quote the same sentence at each other from opposite directions.
