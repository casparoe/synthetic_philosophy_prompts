  Thinking Process:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergraduate seminar on ethics and the market.
      *   **Topic:** Commodification.
      *   **Session:** 75 minutes, in-class activity (no lecture).
      *   **Class Size:** 14 students.
      *   **Constraints:** No lectern, movable desks, whiteboard. No real money. Nothing graded. Self-contained (no pre-reading).
      *   **Instructor's Stake:** Former ops manager at plasma-collection company. Wants students to make real rulings, discover principles fail, avoid safe assigned positions.
      *   **Scenario:** Students = internal ethics board of a startup accelerator. Small teams pitch new markets. Board approves/rejects with one-sentence general rules. Rotating "red team" tries to break the rule (approve rejected market or reject approved market based on the rule).
      *   **Pressure Mechanism:** Accelerator loses licensing fee for every rejection (needs gamification without real money).
      *   **Candidate Markets:** Compensated kidney donation, vote markets, price gouging, queue standing, apology services, pharma trials, etc.
      *   **Debrief:** Map actions to philosophical distinctions (harm vs. inherent objection, repugnance vs. articulated reasons, inequality/consent). Must emerge from activity, not lecture.
      *   **Failure Points:** Predict what goes wrong (e.g., "dignity" smuggling, "informed consent" magic wand).
      *   **Limitation:** Honest note on what a one-shot exercise *cannot* reproduce.
      *   **Format:** Facilitator's plan (readable night before). Pitch script, rules/timeline, market list, debrief questions, failure points, honest note.
      *   **Word Count:** Under 900 words. Tight. Prioritize debrief over scenario detail.

  2.  **Drafting - Section by Section:**

      *   **Title:** Facilitator's Plan: The Ethics Board.
      *   **Pitch Script:** Needs to be punchy, set the stakes, explain the roles.
      *   **Rules & Timeline:** 75 mins total. Need to divide time for setup, pitching, ruling, red-teaming, debrief.
          *   Setup: 5 min.
          *   Rounds (Pitch + Rule + Red Team): Need enough time for multiple cases. Maybe 3 rounds of 15 mins? Or 2 large rounds? Let's aim for 3 cases to get variety. 15 mins per case = 45 mins.
          *   Debrief: 20 mins.
          *   Buffer: 5 mins.
          *   Total: 75 mins.
          *   Pressure Mechanism: "Equity Points." If they reject, the company loses value. If they approve a bad one (caught by Red Team), they lose reputation/value. Goal: Maximize value.
      *   **Candidate Markets:** Need to list them and their philosophical function.
      *   **Debrief:** Ordered questions. Connect specific rulings to philosophical concepts (Sandel/Anderson/etc. without naming them necessarily, but mapping the logic).
      *   **Failure Points:** Anticipate student moves.
      *   **Honest Note:** What's missing? (Real consequence, lived experience of commodification).

  3.  **Refining and Editing (Word Count Management):**

      *   *Constraint Check:* Under 900 words. This is tight. I need to be concise.
      *   *Pitch:* Keep it direct.
      *   *Timeline:* Use bullet points.
      *   *Markets:* One sentence each.
      *   *Debrief:* Crucial. Needs depth but brevity.
      *   *Failures/Note:* Concise diagnosis.

      *Drafting content:*

      **Facilitator's Plan: The Ethics Board**

      **The Pitch (Read Aloud):**
      "You are the Ethics Board of 'VentureEthics,' an accelerator licensing new market platforms. Your goal: maximize licensing revenue by approving markets. Constraint: Every approval requires a one-sentence general rule justifying it. Every rejection requires a one-sentence general rule prohibiting it. There is no 'case-by-case' exception. A Red Team will attempt to break your rules by finding a market your rule accidentally licenses or prohibits. If the Red Team breaks your rule, you lose 'Equity Points.' If you reject a viable market, you lose 'Revenue Points.' Survive with the highest score."

      **Timeline & Mechanics (75 Minutes)**
      *   **0-5 min:** Setup. Divide class: 10 Board Members, 4 Red Team (rotate roles every round). Write score on whiteboard.
      *   **5-20 min (Round 1):** Board reviews Case A. Vote. State Rule. Red Team (5 mins) attempts to break rule. Scoring.
      *   **20-35 min (Round 2):** Rotate Red Team. Case B. Repeat.
      *   **35-50 min (Round 3):** Rotate Red Team. Case C. Repeat.
      *   **50-75 min:** Debrief.

      **Pressure Mechanism:**
      Start with 100 Equity Points.
      - Rejecting a pitch: -10 Points (Lost Revenue).
      - Red Team breaks rule (proves rule is inconsistent/too broad/narrow): -20 Points (Reputation Hit).
      - Goal: End with positive points. This forces approval bias unless rules are tight.

      **Candidate Markets (Select 3)**
      1.  **Compensated Kidney Donation:** Tests limits of bodily integrity vs. altruism. Forces distinction between harm to donor vs. corruption of the gift.
      2.  **Vote Markets:** Tests democratic equality. Is the transaction harmful, or does it destroy the meaning of the vote regardless of consent?
      3.  **Post-Disaster Generator Pricing:** Tests harm vs. fairness. Is the objection exploitation (inequality) or efficiency (harm to none)?

      **Debrief Sequence (25 Minutes)**
      *Do not lecture. Ask these questions in order based on their whiteboard rules.*
      1.  **The Magic Wand:** "Look at the rules that approved risky trials or queues. How many relied on 'informed consent'? When did consent stop doing work?" (Target: Consent doesn't solve inequality or meaning corruption).
      2.  **The Smuggled Premise:** "Look at the rejection rules. Did anyone use words like 'dignity' or 'decency'? What specific harm does that word prevent?" (Target: Repugnance as unarticulated reason vs. substantive claim).
      3.  **The Red Team Victory:** "When the Red Team broke your rule, did they find a harmful market you accidentally licensed, or a harmless one you accidentally banned?" (Target: Distinguish harm-based objections from status-based objections).
      4.  **The Cost of Consistency:** "You lost points for rejecting markets. Did financial pressure change your definition of 'harm'?" (Target: How market logic colonizes ethical logic).
      5.  **The Missing Variable:** "Which rulings felt different when you imagined the seller was desperate vs. wealthy?" (Target: Background inequality as the hidden variable in 'voluntary' exchange).

      **Predictable Failure Points**
      *   **The "Dignity" Loophole:** Students will ban things via "violates human dignity." The Red Team must challenge this: "Define dignity operationally." If they can't, the rule is void.
      *   **Consent as Panacea:** Students will approve everything via "if consensual." Red Team must propose: "Consensual slavery" or "Consensual vote selling." Force them to refine consent conditions.
      *   **Rule Drift:** Students will change the rule mid-round to save points. Freeze rules immediately after voting.

      **Honest Note: The Missing Feature**
      This exercise reproduces the *logic* of commodification but not the *phenomenology*. Students rule on abstract cases; they do not feel the social shift of a norm changing. You cannot simulate how a market *creates* preferences rather than satisfying them (the endogenous preference problem). You must supply the lived reality: describe how plasma donors stopped seeing themselves as "patients" and started seeing themselves as "suppliers," and how that shifted their relationship to their own bodies. The exercise shows the contradiction; only your testimony shows the cost.

