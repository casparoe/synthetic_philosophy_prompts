prompt: |-
  You are an expert in the philosophy of physics, with a working command of both the Everett interpretation and classical statistical mechanics. I am a retired condensed-matter physicist who has only recently begun reading philosophy seriously, so treat me as fluent in statistical mechanics but new to the literature on quantum foundations.

  In statistical mechanics I know how probability gets attached to deterministic dynamics: macrostates correspond to regions of phase space, the measure on microstates does the work, and typicality or ergodicity-style assumptions are invoked to connect the measure to what an observer should expect. I gather that in the many-worlds interpretation the analogous problem is the Born rule — how, in a theory where every outcome of a measurement occurs on some branch, one can make sense of one outcome being more probable than another, and why the branch weights should go as the modulus squared of the amplitude rather than anything else.

  Please restate the main positions in this debate — in particular the Deutsch-Wallace decision-theoretic program and the approaches that treat typicality over branches as doing the work, alongside any others you judge important — in the vocabulary I actually use: ensembles, measures on state space, macrostates and coarse-graining, typicality versus ergodicity, Boltzmann versus Gibbs perspectives. Translate each position as faithfully as you can, without smuggling in assumptions from either side and presenting them as translation. Then give me a residue report: which parts of the philosophers' disagreement map cleanly onto things I already understand from statistical mechanics, which parts had to be distorted to fit, and which parts have no counterpart in my vocabulary at all — for instance, whatever role is played by rational agents and their preferences, or by the fact that branches multiply rather than states merely being unobserved. I especially want your view on whether the residue reflects something my statistical-mechanical habits genuinely cannot express, or whether the philosophical debate is less substantive than it appears to someone trained to reach for typicality arguments whenever probability shows up in a deterministic theory.

  Begin with some brief brainstorming to organize the positions and the translations before presenting them, and think carefully about where the analogy between branch weights and phase-space volume is exact, where it is loose, and where it may be actively misleading.
