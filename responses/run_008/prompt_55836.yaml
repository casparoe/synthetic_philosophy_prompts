answer: |-
  **Subject: The Swamp, The Stalemate, and The Quiz**

  **From:** The Reading Group Secretary
  **To:** Formal Epistemology Reading List

  Dear All,

  Following last month's session, it has become painfully clear that whilst we can all recite the Judy Benjamin problem in our sleep, none of us can agree on why we believe the answer we believe. Half the room argued for one "obvious" update, the other half for a contradictory "obvious" update, and our maths postdoc merely lurked more intensely than usual. We realised we were not disagreeing about the maths, but about the rule we were silently applying to generate it.

  To that end, this issue contains no papers. Instead, it contains a diagnostic. Below are eight scenarios. There is no calculation required; the numbers are merely there to make the intuition vivid. Please answer them on your phone over coffee, tally your score using the key at the bottom, and discover which update rule you are actually following (or whether you are secretly a deflationist in denial).

  ***

  ### The "Which Update Rule Do You Actually Follow?" Quiz

  **1. The Standard Swamp**
  You are dropped in a swamp. Prior credence: 50% North Territory, 50% South. A radio operator tells you: "If you are in the North, the odds are 3:1 that you are near Headquarters." She says nothing about the South. What happens to your credence that you are in the North?
  *   A) It stays at 50%. The info is only about *where* in the North, not *whether* North.
  *   B) It shifts. To satisfy the constraint with minimal fuss, the probability of North must change.
  *   C) It depends on why she told me this.
  *   D) The question is nonsense; I can't update on a conditional.

  **2. The Asymmetric Swamp**
  Same scenario, but the North Territory is vast (90% of the map) and the South is tiny (10%). The radio operator gives the same conditional info: "If North, 3:1 odds for HQ." Does the size difference change how you update your credence in being in the North?
  *   A) No. The conditional constraint is local; the prior size of the territory shouldn't distort the update rule.
  *   B) Yes. A rule that minimises global information gain will treat the large territory differently than the small one.
  *   C) Yes, because a large territory makes it less likely she'd find me to speak in the first place.
  *   D) The size of the territory is irrelevant because the conditional has no truth value.

  **3. The Chatty Operator**
  You know this specific radio operator only ever calls soldiers she has successfully located. She calls you and gives the conditional info from Q1. Do you update merely on the content of her message?
  *   A) Yes. The protocol is irrelevant to the logic of the conditional.
  *   B) No. The fact she called is evidence that I am located, which screens off the conditional content.
  *   C) No. I must model her reasoning: why did she choose to report *this* conditional now?
  *   D) Irrelevant. I cannot update on the call because the message is not a proposition.

  **4. The Dean's Promise**
  A colleague says: "If the Dean approves the budget, I'm 90% confident we get the seminar room." You have no new info on the Dean. Does your credence that the Dean will approve the budget change?
  *   A) No. Mere conditional probabilities shouldn't shift the antecedent.
  *   B) Yes, it goes up. Why mention it unless the approval is likely or desirable?
  *   C) Yes, it goes down. If we were getting the room anyway, she wouldn't condition on the Dean.
  *   D) My credence in the Dean is untouched, but my credence in the room changes.

  **5. The Material Intuition**
  When you hear "If A, then probably B", do you treat this as learning that the world is not one where A is true and B is false (or unlikely)?
  *   A) Essentially, yes. It rules out the $\neg(A \to B)$ worlds.
  *   B) No. It constrains the ratio of probabilities within the A-worlds, not the A-worlds themselves.
  *   C) No. It tells me about the speaker's state of mind, not the world.
  *   D) No. There are no "A-worlds" to constrain in that way.

  **6. The Unconstrained Partition**
  You learn $P(B|A) = x$. This constraint underdetermines your new probability function. How do you fill the gap?
  *   A) Pick the posterior that is closest to the prior (minimise distance/entropy).
  *   B) Pick the posterior that preserves the odds ratios of the partition not mentioned (nearest prior).
  *   C) Look for an explanation of why the constraint holds; the explanation dictates the fill.
  *   D) Don't fill it. The posterior is undefined until you get categorical info.

  **7. Truth and Conditions**
  Can the statement "If A, then probably B" be strictly true or false?
  *   A) Yes, it corresponds to a fact about conditional chances.
  *   B) Yes, it is equivalent to a material conditional with a probability attached.
  *   C) No, it is a prescription for updating, not a description of the world.
  *   D) No, conditionals are not the sort of thing that bear truth values.

  **8. The Meta-Question**
  Reflecting on the reading group stalemate: is there a single rational credence Judy should have after the radio message?
  *   A) Yes, we just haven't found the right derivation yet.
  *   B) There is one for each rational update rule; we are debating the rule, not the answer.
  *   C) No. The input is insufficient to determine a unique output.
  *   D) No. The input is of the wrong category to determine an output.

  ***

  ### Scoring Key & Diagnostic

  Tally your answers. The following profiles indicate your philosophical commitments. Note that some positions overlap in standard cases but diverge in edge cases.

  **Mostly A: The Material Conditionalist**
  You treat conditionals as disguised disjunctions ($\neg A \lor B$). You likely believe learning a conditional increases the probability of the antecedent if the consequent is surprising.
  *   *Commitment:* Updating on the material conditional.
  *   *Vulnerability:* Struggles with Q4 (The Dean). If you treat "If Dean, then Room" as $\neg \text{Dean} \lor \text{Room}$, learning it should raise your credence in $\neg \text{Dean}$ if you were sure about the Room. Most people find this counter-intuitive in ordinary conversation.

  **Mostly B (specifically Q1-A, Q2-B, Q6-A): The Minimum Entropy Advocate**
  You believe that when constraints underdetermine the posterior, rationality requires minimising the information gain (relative entropy) from the prior.
  *   *Commitment:* Minimum Relative Entropy (MinXEnt).
  *   *Note:* In Q1 (Symmetric), you likely answered that credence stays at 50% (matching Van Fraassen). However, in Q2 (Asymmetric), you acknowledged that the size of the territory matters for the global minimisation. This is the key separator between you and the Van Fraassenian.
  *   *Vulnerability:* Requires accepting that "minimal change" is a normative principle distinct from "preserving ratios".

  **Mostly B (specifically Q1-A, Q2-A, Q6-B): The Van Fraassenian**
  You believe in preserving the odds of the partition wherever the evidence does not explicitly constrain them. You treat the conditional as a constraint on the ratio within $A$, leaving $P(A)$ untouched.
  *   *Commitment:* Van Fraassen-style Nearest Prior / Antecedent Invariance.
  *   *Note:* You likely answered that the Territory size (Q2) does *not* affect the update of $P(\text{Territory})$. You prioritise preserving the prior odds of the territories over global entropy minimisation.
  *   *Indistinguishability Warning:* In the symmetric Judy case (Q1), your position yields the exact same numerical answer as the MinEnt advocate. You are only distinguishable by the asymmetric case (Q2) or your justification in Q6. If you found Q2 difficult to distinguish from MinEnt, your position may be unstable.

  **Mostly C: The Pragmatist / Explanation-Based Updater**
  You do not treat the utterance as a bare logical constraint. You model the speaker. If the operator spoke, there is a reason; if the colleague mentioned the Dean, there is a Gricean implication.
  *   *Commitment:* Explanation-based updating.
  *   *Vulnerability:* You conflate the *logic* of the conditional with the *evidence of the utterance*. In Q3, you treat the protocol as part of the update. This is often the most robust position in real life (Q4), but formalists may accuse you of changing the subject from "updating on a conditional" to "updating on speaker reliability".

  **Mostly D: The Deflationist / Skeptic**
  You reject the premise that conditionals are propositions with truth values that can be conditioned upon in the standard Bayesian way.
  *   *Commitment:* Deflationary / Ill-posed.
  *   *Vulnerability:* You may struggle to participate in the reading group, as you believe the central problem is a category error. However, you are likely the only one not losing sleep over Judy Benjamin.
  *   *Note:* If you answered D on Q7 but A/B on Q1, you are likely a "Fictionalist"—you use the rules as a useful calculational fiction whilst denying their metaphysical grounding.

  ***

  ### A Health Warning (Please Read)

  Before you circulate your results in the group chat, two caveats from the quiz designer:

  **1. The Indistinguishability Problem**
  You may have noticed that for the standard Judy Benjamin problem (Q1), the **Minimum Entropy** and **Van Fraassen** positions often yield the same numerical result (Antecedent Invariance). The quiz attempts to separate them using the Asymmetric Swamp (Q2). However, be aware that in the literature, these two leaves are notoriously close. If you found yourself answering identically for both, it is not necessarily a failure of your intuition; it may be that the logical space between "minimising global entropy" and "preserving local prior ratios" is too narrow to be felt without a calculator. The quiz flags this divergence, but it cannot force you to feel it.

  **2. The Confused Premise**
  Finally, a confession. This quiz rests on the premise that there is a fact of the matter about "which rule you follow." In formal epistemology, update rules are normative, not descriptive. There is no psychological fact about whether you *are* a MinEnt updater; there is only a philosophical claim about whether you *ought* to be.
  Furthermore, a strong deflationary view suggests there is **no unique rational answer** to the Judy Benjamin problem because the input (a conditional probability report) is not a proposition that licenses a unique Bayesian update. If this is true, the quiz does not sort you by "correct rule" but by "aesthetic preference for underdetermined constraints."
  If you scored heavily on **Deflationist** or **Pragmatist**, you may have implicitly rejected the quiz's premise entirely. If so, you are in good company: that is likely the only way to actually leave the swamp.

  See you next term. Please try not to get dropped in a swamp.

  Yours,
  The Secretary
