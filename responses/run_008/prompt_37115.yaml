      *   Objection 2: Postdoc. "Costs are physiological trade-offs, not signaling waste." Reply: Exactly, that supports differential cost. Soft spot: Might undermine the "handicap" label entirely.
      *   Objection 3: Emeritus. "Zahavi didn't say waste, he said reliability." Reply: Acknowledge the history, focus on the textbook distortion. Soft spot: You are still correcting them.
      *   Objection 4: Empiricist. "How do I measure differential cost?" Reply: Reaction norms. Soft spot: Hard to do.
      *   Objection 5: "If cost is near zero for high quality, why isn't it invaded?" Reply: Marginal cost still higher for low quality. Soft spot: Stability conditions.
      *   Objection 6: "Is this just indexing?" Reply: Yes, but indexing is often conflated with handicap. Soft spot: Terminological fight.
      *   Objection 7 (Dreaded): "What new prediction does this make?" Reply: Look for low-cost honest signals. Soft spot: Might be hard to distinguish from index.
