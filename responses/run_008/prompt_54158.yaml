prompt: |-
  At my company (mid-size, we build developer tooling) we changed how we hire a few years back, and something about it has been bugging me. It used to be unstructured chats: someone senior would talk to a candidate for an hour and go yeah, sharp guy, good energy, hell fit in, and that was bascially it. Now it's a fixed script — everyone gets the same questions and exercises, scored against anchored rubrics, and we deliberately shuffle who meets whom, because we noticed the individual interviewers' gut read on a candidate predicted almost nothing about how they actually did the job once here.

  But then look at everything else we do. People still get let go for "bad attitude" or "not a culture fit", and the writeups talk like there's a stable thing called his character that came out. Promotions go to people managers describe as having grit or being self-driven. Every offsite we run some strengths-finder workshop that assumes people have durable traits you can coach around.

  So here's my question: what view of people do each of these practices presuppose? Does the hiring side quietly assume the behaviour-is-mostly-situational crowd are right — that there's no reliable character to read off an interview, so we control the situation instead of trying to spot virtue? And if that's the presupposition, is it actually consistent with still firing and promoting on character grounds, or is one half of how we run the company just philosophically confused? Please take a definite position — tell me which practice is wrong and what it would have to change if we took the presupposed view seriously. Don't give me a menu of "it depends which theory you prefer", I'd rather flat-out disagree with you than have to pick. Keep it under 350 words, firm limit, and don't hedge in the last paragraph either.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Context:** Mid-size developer tooling company.
      *   **Change:** Hiring moved from unstructured chats (gut feel) to structured scripts/rubrics (situational control) because gut feel didn't predict job performance.
      *   **Contrast:** Other HR practices (firings, promotions, offsites) still rely on "character," "attitude," "grit," "durable traits."
      *   **Question:** What view of people do each practice presuppose? Is there a philosophical inconsistency?
      *   **Constraint 1:** Take a definite position (tell me which practice is wrong).
      *   **Constraint 2:** Don't give a menu/"it depends".
      *   **Constraint 3:** Keep it under 350 words (firm limit).
      *   **Constraint 4:** Don't hedge in the last paragraph.

  2.  **Deconstruct the Philosophical Underpinnings:**
      *   **Hiring (Structured):** Presupposes situationism. Behavior is context-dependent. Gut reads of "character" are unreliable biases. Control the input (questions) to measure specific outputs (skills).
      *   **Management/Firing/Promotion (Unstructured/Trait-based):** Presupposes dispositionalism (trait theory). People have stable internal qualities (grit, attitude, character) that drive behavior across contexts.
      *   **Conflict:** You can't claim character is illusory/unreadable in hiring but real/actionable in performance management.

  3.  **Formulate a Position:**
      *   The hiring process is likely more empirically grounded (structured interviews predict performance better than unstructured ones).
      *   The management/firing/promotion practices are likely the "wrong" ones because they rely on the fundamental attribution error (attributing behavior to character rather than situation).
      *   *Alternative Position:* The hiring process is too rigid, and character does matter.
      *   *Decision:* The prompt hints that the hiring change was made because data showed gut reads didn't predict job performance. This suggests the situationist view is more accurate *for this company*. Therefore, the management practices are the inconsistent/wrong ones. They are hallucinating stability where there is none.
      *   *Argument:* If character isn't readable in an interview, it's not a stable entity you can fire someone for. The management side is engaging in myth-making.

  4.  **Drafting the Response (Iterative Process):**

      *   *Draft 1 (Mental Outline):* Your hiring process assumes situationism: behavior depends on context, not inner virtue. Your management assumes dispositionalism: people have fixed traits like grit. These are incompatible. Since your data showed gut feelings don't predict performance, the trait view is empirically wrong for you. You need to stop firing for "attitude" and start fixing environments. The management side is confused. Change promotions to reward specific behaviors in specific contexts, not "grit."

      *   *Draft 2 (Writing & Refining for Word Count):*
          Your hiring reform presupposes **situationism**: behavior is context-dependent, and "character" is too noisy to measure reliably. You standardized the environment because you admitted individual judgment fails. Conversely, your promotions and firings presuppose **dispositionalism**: that stable traits like "grit" or "bad attitude" exist internally and drive performance across contexts.

          These are mutually exclusive. You cannot claim character is unreadable noise in hour one and actionable fact in year two. Given your own data—that gut reads predicted nothing—the management side is philosophically confused and empirically wrong. They are committing the fundamental attribution error, mistaking systemic friction for individual moral failure.

          The hiring practice is right; the management practice is wrong. "Culture fit" and "attitude" are lazy explanations for environmental mismatches. If you took the situationist view seriously, you would stop firing people for "character." Instead, you would audit the specific situations where they struggled. Did they fail because they lacked "grit," or because the project requirements were ambiguous? Did they succeed because they are "self-driven," or because the team structure supported autonomy?

          You must abolish trait-based language in performance reviews immediately. Stop coaching "character" and start designing contexts. If someone fails, do not ask what is wrong with them; ask what is wrong with the workflow you placed them in. Promotions should reward demonstrated output in specific systems, not mythical internal virtues. Your hiring process admits people are complex variables; your management treats them like fixed objects. Align your management with your hiring data, or admit your hiring reform was just theater.

      *   *Word Count Check:* 205 words. Well under the 350 limit.
      *   *Constraint Check:*
          *   Definite position? Yes (Management is wrong).
          *   No hedging in last paragraph? Yes ("You must abolish...", "Align your management...").
          *   Under 350 words? Yes.
          *   No menu/"it depends"? Yes.

  5.  **Final Polish:** Ensure the tone is firm and direct as requested. The draft looks good. It directly answers the philosophical conflict and prescribes a specific change.

      *   *Refining the last paragraph to ensure no hedge:* "You must abolish trait-based language..." is imperative. "Align your management..." is imperative. Good.

      *   *Checking the "view of people" part:* I explicitly named situationism vs dispositionalism.

      *   *Final Word Count Check:* 205 words. Safe.

  6.  **Final Review against constraints:**
      *   Definite position: Yes (Management practices are wrong).
      *   Under 350 words: Yes.
      *   No hedging in last paragraph: Yes.
      *   No "it depends": Yes.

      Let's assemble.

      (Self-Correction during assembly): Make sure I don't sound *too* academic, but keep the philosophical terms clear. The draft uses "situationism" and "dispositionalism" which is good.

      Final check of the last paragraph: "You must abolish trait-based language in performance reviews immediately. Stop coaching "character" and start designing contexts. If someone fails, do not ask what is wrong with them; ask what is wrong with the workflow you placed them in. Promotions should reward demonstrated output in specific systems, not mythical internal virtues. Your hiring process admits people are complex variables; your management treats them like fixed objects. Align your management with your hiring data, or admit your hiring reform was just theater." -> No hedging. Very firm.

