  2. The internalist concludes Elena had no reason to report the hazard because her subjective motivational set contained no desire or value that sound deliberation could link to that action.
  3. The externalist concludes Elena had a decisive reason to report the hazard because the objective importance of public safety provides a normative reason regardless of her indifference.
  4. The work is done by the gap between the objective value of public safety and Elena's complete lack of subjective motivation toward it, and if that gap were closed the disagreement would vanish.
  5. The internalist might reply that a reason must be capable of motivating, so without that link the externalist is merely criticizing Elena's character rather than identifying a genuine rational requirement.
