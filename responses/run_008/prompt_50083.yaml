      *   **Topic:** Internal vs. External Reasons dispute (Philosophy of Action).
      *   **Task:** Construct a thought experiment where the two sides deliver different verdicts.
      *   **Constraints:**
          *   Agent fully informed, free of irrationality/compulsion, reflectively stable (blocks Internalist escape routes about deliberative flaws).
          *   Ordinary life setting (workplace/family, no sci-fi).
          *   Agent feels no regret afterward (blocks Externalist appeal to prudence/regret).
