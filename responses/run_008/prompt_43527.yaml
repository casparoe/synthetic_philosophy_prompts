answer: |-
  **JOINT STATEMENT OF THE ADVERSARIAL COLLABORATION ON THE METAPHYSICS OF PROBABILITY**

  **Date:** 24 May 2024
  **Group:** Graduate Reading Group on Probability and Metaphysics
  **Signatories:** The Humean Faction; The Propensity Realist Faction

  ### Preamble

  Over the preceding academic year, the undersigned factions have engaged in a structured adversarial collaboration regarding the metaphysics of objective chance. Our objective was not to force a premature consensus, but to isolate the precise locus of our disagreements, distinguish substantive metaphysical disputes from verbal misunderstandings, and identify the argumentative conditions under which one view might rationally compel the other. We accept that while we share a commitment to the formalism of probability theory and the normative force of the Principal Principle, our ontological commitments regarding the nature of chance remain divergent. This document records our points of consensus, the precise geometry of our remaining disagreements, and the cruxes upon which the resolution of the debate turns.

  ---

  ### I. Points of Consensus

  We jointly affirm the following claims. These premises form the common ground upon which our specific disagreements are constructed.

  1.  **The Centrality of the Principal Principle:** Any viable account of objective chance must vindicate a principle linking objective chance to rational credence. Specifically, where $C$ is a rational credence function, $E$ is admissible evidence, and $X$ is the proposition that the chance of event $A$ is $x$, then $C(A | X \& E) = x$. We agree that an account of chance that cannot support this link fails to capture the concept of *objective* chance.
  2.  **The Failure of Simple Frequentism:** We agree that finite frequentism (the identification of chance with actual relative frequency in a finite reference class) is untenable. It fails to account for single-case probabilities, violates the requirement that probabilities remain stable under counterfactual perturbations, and cannot distinguish between nomological chance and accidental regularity.
  3.  **The Role of Fit:** We agree that a theory of chance must explain why observed frequencies tend to align with assigned chances in long runs of independent trials (the "fit" between chance and frequency). While we disagree on whether fit *constitutes* chance or is *explained by* chance, we agree that a theory yielding systematic divergence between chance and long-run frequency is defective.
  4.  **Formal Constraints:** We agree that objective chances, whatever their metaphysical status, must obey the axioms of the probability calculus. We further agree that chance assignments are sensitive to the physical description of the setup (e.g., symmetry properties, dynamical laws).
  5.  **The Undermining Intuition:** We agree that there is a tension between the supervenience of chances on the total distribution of events and the stability of present chance assignments. We agree that any solution to the "undermining future" problem must preserve the rationality of deferring to present chance assignments even when the total history of the world is not yet fixed.

  ---

  ### II. Map of Remaining Disagreements

  The following table isolates the specific propositions upon which we disagree. The phrasing has been negotiated to ensure that each formulation is acceptable to the side endorsing it, avoiding pejorative or loaded terminology from the opposing view.

  | Domain | Humean Faction Formulation | Propensity Realist Formulation |
  | :--- | :--- | :--- |
  | **Ontological Status** | Chance is a theoretical term defined by its role in the Best Systematization of the Humean mosaic. It is not an additional ontological category over and above particular matters of fact. | Chance is a dispositional property inherent in physical setups. It is a robust, irreducible feature of reality that exists independently of any descriptive systematization. |
  | **Status of Principal Principle** | The Principal Principle is partially constitutive of the concept of chance. To deny it is to change the subject regarding what "chance" means. | The Principal Principle is a substantive bridge principle connecting a metaphysical property (propensity) to epistemic norms (credence). It could have been otherwise, but is not. |
  | **Single-Case Chance** | Single-case chance is meaningful only insofar as the single case falls under a general pattern that contributes to the Best System. | Single-case chance is meaningful in virtue of the specific dispositional properties of the setup at that time, regardless of patterns elsewhere. |
  | **Admissibility** | Admissible information is information that does not provide "crystal ball" access to the outcome, defined functionally to preserve the Principal Principle. | Admissible information is information causally independent of the chance process generating the event. |
  | **Undermining Futures** | The possibility of undermining futures requires a refinement of the Best System analysis (e.g., restricting the supervenience base) to prevent present chances from being invalidated by future events. | Underminating is not a metaphysical threat; future events do not alter present propensities. Apparent undermining is merely Bayesian updating on evidence regarding the fixed propensity. |

  ---

  ### III. Cruxes and Adjudicative Commitments

  We identify three specific cruxes. For each, we have agreed upon a class of cases or argumentative standard that bears on the issue. At the outset of this collaboration, each side recorded a "commitment statement" regarding how the resolution of that crux would impact their view.

  #### Crux 1: The Analyticity of the Principal Principle
  *   **The Issue:** Is the Principal Principle (PP) a conceptual truth that defines 'chance', or a substantive law linking distinct domains (metaphysics and epistemology)?
  *   **Adjudicative Test:** The "Oracle Case." Consider a world where agents know a physical parameter $P$ behaves exactly like a propensity (explains frequencies, stable under intervention) but rational credence does *not* align with $P$ without further inductive justification.
  *   **Humean Commitment:** If it is coherent to describe such a world, then 'chance' is not defined by PP alone. However, the Humean faction maintains that in such a world, $P$ would not deserve the name 'objective chance'. *Condition for concession:* If it is demonstrated that PP requires robust modal realism to avoid circularity, the Humean faction will accept that BSA requires modification to include modal primitives.
  *   **Propensity Commitment:** If PP is merely analytic, it cannot do the explanatory work required of a bridge principle. *Condition for concession:* If it is demonstrated that PP can be fully derived from the conceptual role of chance without positing irreducible dispositions, the Propensity faction will accept a deflationary account of chance ontology.

  #### Crux 2: Non-Circular Characterization of Admissibility
  *   **The Issue:** Can "admissible information" be defined without implicitly appealing to chance or causal notions that presuppose the Propensity view?
  *   **Adjudicative Test:** The "Undermining Future" Scenario. Can the Humean specify which future histories are admissible without saying "those that don't change the chances"?
  *   **Humean Commitment:** We maintain admissibility can be characterized via temporal indexicality or causal neutrality defined within the Best System. *Condition for concession:* If every proposed definition of admissibility implicitly presupposes the very chance facts it is meant to constrain, the Humean faction will accept that the BSA is circular.
  *   **Propensity Commitment:** We maintain admissibility is grounded in causal independence. *Condition for concession:* If causal independence cannot be distinguished from probabilistic independence without circularity, the Propensity faction will accept that their view offers no advantage over Humeanism regarding admissibility.

  #### Crux 3: Explanatory Direction of Fit
  *   **The Issue:** Do chances explain frequencies, or do frequencies (systematized) fix chances?
  *   **Adjudicative Test:** The "Empty World" Thought Experiment. In a world with a single probabilistic event and no long run, is there a fact of the matter about the chance?
  *   **Humean Commitment:** In a world with insufficient pattern, chance attributions are indeterminate or meaningless. *Condition for concession:* If strong intuitions persist that single-case chances are determinate in such worlds, the Humean faction will acknowledge a cost in counterintuitive verdicts.
  *   **Propensity Commitment:** The chance is determinate based on the setup's dispositions. *Condition for concession:* If it is shown that positing a determinate chance in the absence of any frequency data adds no explanatory power, the Propensity faction will acknowledge a violation of parsimony.

  ---

  ### IV. Analysis of Verbal vs. Substantive Disagreement

  After a year of collaboration, we conclude that our disagreement is **partially verbal but fundamentally substantive.**

  **1. The Verbal Component:**
  A portion of our dispute concerns the labeling of theoretical terms. The Humean faction uses "chance" to denote *the variable that occupies the chance-role in our best scientific theories*. The Propensity faction uses "chance" to denote *the metaphysical ground that makes those theories true*.
  *   **Resolution:** We agree that if the Humean says "Chance is the Best System summary" and the Propensity says "Chance is the disposition that *makes* the Best System summary accurate," they may be talking past one another regarding the word "chance." We recommend distinguishing **Chance$_{role}$** (functional definition) from **Chance$_{ground}$** (ontological realization). Both sides agree on the existence and utility of Chance$_{role}$.

  **2. The Substantive Core:**
  Once terminology is disambiguated, a substantive metaphysical disagreement remains regarding **Irreducible Modality**.
  *   **The Dispute:** The Propensity faction asserts that the world contains irreducible dispositional properties that are not reducible to categorical facts plus laws. The Humean faction asserts that the world contains only the categorical mosaic and that "dispositions" are useful fictions or summaries.
  *   **Why it is Substantive:** This is not merely a linguistic dispute. It is a disagreement about the furniture of the universe. If the Propensity faction is correct, there are facts about the world (specifically, about powers) that do not supervene on the distribution of local qualitative properties. If the Humean faction is correct, such facts do not exist.
  *   **Joint Conclusion:** No amount of conceptual analysis can resolve this substantive core. It turns on broader metaphysical commitments regarding parsimony, modal realism, and the nature of scientific explanation. However, we agree that the *burden of proof* lies in demonstrating whether the Positing of Irreducible Modality yields explanatory gains (e.g., regarding single-case PP adherence) that outweigh the ontological cost.

  ### V. Closing Declaration

  We conclude this collaboration without a unified metaphysics of probability. However, we have successfully transformed a diffuse argument into a structured disagreement. We have isolated the substantive core (Irreducible Modality) from the verbal confusion (Role vs. Ground), and we have established clear conditions under which specific arguments would compel one side to revise their position. We recommend that future work focus not on re-defining chance, but on the specific adjudicative tests outlined in Section III.

  **Signed,**

  *The Humean Faction*
  [Representative Names]

  *The Propensity Realist Faction*
  [Representative Names]
