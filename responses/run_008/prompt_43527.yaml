  2.  **Deconstruct the Philosophical Positions:**
      *   *Humean (Best System Analysis - BSA):* Chances are summaries of the Humean mosaic (particular facts). They earn their place via simplicity, strength, and fit. No modal glue. PP is a constraint on *our* usage of the term, or derived from the role of chance in theory. Undermining futures are a technical problem to be solved (e.g., by restricting admissibility or modifying BSA).
      *   *Propensity Realist:* Chances are real physical properties/dispositions. They explain frequencies but aren't defined by them. PP is substantive because it links a physical property to rational belief. Single-case propensities are real. Undermining is less problematic because chances are fixed by the setup, not the total history, though learning outcomes updates evidence about the setup.

  3.  **Drafting Section (i): Accepted Claims:**
      *   Need to find common ground.
