      *   *Crux 3: Single Case.*
          *   *Test:* A single, non-repeatable quantum event (or analogous).
          *   *Prediction:* Humeans struggle to assign chance without a pattern. Propensity say the setup suffices.
      *   *Refinement:* Since this is metaphysics, "resolvable" means "one side concedes the argumentative burden," not "experiment." I need to frame the *argumentative conditions* for resolution.

  6.  **Drafting Section (v): Verbal vs. Substantive:**
