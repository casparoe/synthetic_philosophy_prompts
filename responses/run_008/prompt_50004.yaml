answer: |-
  It is a pleasure to engage with a mind that has been turning over these questions independently, for your intuitions are sharper than the documentary you watched would give you credit for. You are right to feel that the television programme flattened a complex philosophical history into a neat narrative arc, and your three nagging points identify precisely where the distortion occurred. To answer your request for an audit, I shall walk through the claims as they were presented to you, distinguishing between what a philosopher of science would accept, what is a misleading simplification, and what is simply incorrect, all while keeping to the spirit of your own inquiries.

  Your first instinct regarding the phrase metaphysical research programme is entirely correct and touches on a common misunderstanding of Popper's vocabulary. For Popper, describing something as metaphysical was not a slur in the way a logical positivist might have used it, nor was it equivalent to calling something nonsense. He held that all science emerges from metaphysical ideas, and while metaphysical statements are not empirically testable in themselves, they can be immensely fertile guides for research. By contrast, when Popper dismissed astrology or Freudian psychoanalysis, he was categorising them as pseudoscience, implying they were structured in a way that immunised them against criticism entirely. To place Darwinism in the same bucket as astrology, as the documentary did, is therefore a significant error. Popper regarded Darwinism as a metaphysical research programme because he felt the core idea was so flexible it could accommodate any observation, but he explicitly distinguished this from the dogmatic immunity of pseudoscience. The programme's suggestion that Popper viewed them as identical misdescribes his view twice over, as you suspected, because it ignores the positive role he assigned to metaphysics in the growth of knowledge.

  Moving to your second point about the circularity of the term fittest, you have identified the exact logical hinge upon which the debate turns. The documentary presented the tautology objection as if it were a settled matter of fact, whereas it is actually a matter of definition. If fitness is defined solely by survival, then the statement the fittest survive is indeed empty, for it merely says those who survive, survive. Popper was targeting this specific logical formulation, which was prevalent in popular expositions of the theory at the time. However, if fitness is defined independently of survival, perhaps by reference to specific physiological traits or genetic markers, then the theory makes genuine predictions that could conceivably be false. Popper was not necessarily denying the biological reality of evolution, but rather critiquing the logical structure of the way it was often articulated. He worried that without an independent measure of fitness, the theory could not be falsified. Your intuition that the second reading looks like a prediction that could come out wrong is precisely what saves the theory, and it is likely that Popper was targeting the first reading while remaining open to the second, provided it was formulated with sufficient rigour.

  Your third thought, which you wondered might be naive, is actually the most philosophically robust of the three. It is a standard view in the philosophy of science that abstract principles rarely generate testable claims in isolation. A theory usually requires what are known as auxiliary hypotheses or initial conditions to yield a specific prediction. As you noted, the statement nature obeys laws is empty until you name a law, and similarly, natural selection is hard to test until you specify the environment, the traits, and the inheritance mechanisms. Popper would not reply that you have merely moved the emptiness elsewhere; rather, he would agree that this is how science functions. A theory becomes scientific when it is embedded in a specific model that exposes it to potential refutation. By adding specifics, such as the claim that slow seed-eaters will be punished in a particular environment, you transform the metaphysical programme into a testable scientific hypothesis. This does not rescue the theory by changing the subject, but by doing the actual work of science, which is to make the theory precise enough to be vulnerable.

  Regarding the documentary's closing verdict, the claim that Popper retracted his view and conceded it was all a single embarrassing blunder is a simplification that borders on the misleading. It is true that late in life, particularly in a lecture given in 1978, Popper acknowledged that natural selection could be formulated as a testable theory. However, characterising this as a retraction of a blunder suggests he had been foolish earlier, whereas a more accurate reading is that he had refined his understanding of how evolutionary biologists actually worked. He came to see that the community did indeed formulate testable models, even if the general slogan remained metaphysical. The narrative of the great philosopher's error is a satisfying story for television, but it obscures the reality that his earlier critique helped sharpen the way biologists defined fitness and constructed their models. The tautology objection did not die with his retraction so much as it was absorbed into the methodology of the field, forcing greater precision.

  In sum, your inclination to think Popper was onto something real about the familiar slogan is well founded, and you should not hold your view on the strength of a programme that flattened him. The documentary was correct that Popper raised the falsifiability objection, and correct that he later softened his stance, but it was wrong to equate his view of Darwinism with his view of astrology, and it was too hasty to dismiss his earlier critique as a mere blunder. Your own reasoning regarding the need for specific auxiliary claims aligns with the professional consensus, and your distinction regarding the definition of fitness shows a clear grasp of the logical problem. You have effectively audited the audit yourself, and where you felt the narrative did not quite hold, your instincts were serving you well. It is a testament to your year of reflection that you spotted the nuances which a polished television production chose to gloss over.
