answer: |-
  Here is the spec sheet you asked for. No history, no camp loyalty, just the functional requirements any theory of truth has to meet to be taken seriously.

  ### 1. The Job Description (Functional Desiderata)
  A theory of truth isn't just defining a word; it's explaining a tool. If the tool doesn't work, the theory fails.

  *   **The Generalization Job (Logical Utility):**
      *   *The Requirement:* The theory must explain how we use "is true" to quantify over statements we can't list.
      *   *The Case:* You can't say, "If snow is white, then snow is white, and if grass is green, then grass is green..." forever. You need to say, "Every instance of the schema 'if p then p' is true."
      *   *Why it matters:* This is the deflationist's strongest point. If your theory makes "truth" a heavy metaphysical property (like a glowing aura around facts), it becomes hard to explain this simple logical function.

  *   **The Endorsement Job (Normative Force):**
      *   *The Requirement:* The theory must explain why asserting "It is true that p" feels different from just asserting "p."
      *   *The Case:* When a fact-checker labels a claim "True," they aren't just repeating the claim; they are certifying it. They are signaling that the claim has survived scrutiny.
      *   *Why it matters:* This is where your philosopher source waved you off. They called this "pragmatics" (how we use language) rather than "semantics" (what language means). But an adequate theory must explain *why* we have this pragmatic tool. If "truth" is just a grammatical trick, why does calling something "false" carry a penalty (loss of credibility) that "not asserting" does not?

  *   **The Norm of Belief (The Aim):**
      *   *The Requirement:* The theory must explain why truth is the *goal* of inquiry.
      *   *The Case:* We try to believe what is true. We feel we *ought* not believe what is false.
      *   *Why it matters:* If truth is just "what works" (Pragmatism) or "what we agree on" (Coherence), it's hard to explain why we should keep searching when a belief already works or is already agreed upon. Truth needs to be distinct from *satisfaction*.

  ### 2. The Test Cases (Boundary Conditions)
  A theory breaks if it can't handle the edge cases.

  *   **Negation and Denial:**
      *   *The Requirement:* "That's not true" must function as a rejection, not just a failure to speak.
      *   *The Case:* If I say, "The sky is green," and you say, "That's not true," you aren't just remaining silent. You are actively opposing my claim. A theory that makes truth too mysterious makes denial impossible.

  *   **The Liar and Self-Reference:**
      *   *The Requirement:* The theory must handle sentences that refer to their own truth value without crashing.
      *   *The Case:* "This sentence is not true." If it's true, it's not. If it's not, it is.
      *   *Why it matters:* This is the stress test. Naive theories explode here.

  *   **Non-Factual Discourse (Fiction and Taste):**
      *   *The Requirement:* The theory must decide if statements like "Sherlock Holmes lived on Baker Street" or "Vanilla is better than chocolate" are truth-apt (capable of being true/false).
      *   *The Case:* The first seems true within a context; the second seems subjective.
      *   *Why it matters:* If your theory says *everything* is truth-apt, you lose the distinction between fact and opinion. If it says *nothing* is truth-apt except physics, you lose history and ethics.

  ### 3. The Distinctions It Can't Collapse
  This is the most critical section for your beat. A theory fails if it erases necessary lines.

  *   **Truth vs. Warrant (The Fact-Checker's Line):**
      *   *The Distinction:* A statement can be true even if we have no evidence for it (e.g., "There was an even number of stars in the universe at the moment of the Big Bang"). Conversely, we can have perfect evidence for something that turns out false (e.g., Newtonian physics before Einstein).
      *   *The Failure:* Any theory that defines truth as "what is verified" or "what is useful" collapses this distinction. For a fact-checker, this is fatal. Your job exists *because* truth and evidence are different.

  *   **Truth vs. Existence:**
      *   *The Distinction:* "It is true that unicorns do not exist."
      *   *The Failure:* If truth requires a "truth-maker" (a fact in the world that makes the sentence true), what is the fact that makes a negative existential true? There is no "unicorn-less-ness" floating around. Theories of correspondence struggle here.

  ### 4. Non-Negotiable vs. Camp Preferences
  Here is how to separate the hard constraints from the philosophical sales pitch.

  **Non-Negotiable (If a theory misses these, it's broken):**
  1.  **Consistency:** The theory cannot allow you to prove contradictions (like the Liar sentence being both true and false) without modifying logic.
  2.  **Generalization:** It must account for the logical utility of the word "true" (the "everything he said is true" test).
  3.  **The Truth-Warrant Gap:** It must allow for the possibility that a claim is true but unproven, or proven but false.

  **Camp Preferences (Where the philosophers fight, but the theory can survive either way):**
  1.  **Truth-Makers:** Does truth require a physical reality to "match" (Correspondence), or just logical consistency (Coherence)? You can have a working theory of truth either way.
  2.  **Bivalence:** Must every statement be strictly True or False? Some theories allow a third value (Indeterminate) for future contingents or fiction. This is a technical choice, not a dealbreaker.
  3.  **Metaphysical Weight:** Is truth a deep property of the universe or a light linguistic tool? As long as it does the jobs in Section 1, it doesn't matter.

  ### 5. The Joint Unsatisfiability (The Squeeze)
  You heard correctly. There is a trilemma that squeezes deflationists and realists alike. You cannot hold all three of these simultaneously:

  1.  **Classical Logic:** The standard rules (a statement is either true or false; no contradictions).
  2.  **Unrestricted Transparency (T-Schema):** The rule that " 'p' is true" means exactly the same as "p". (This is the deflationist's core claim).
  3.  **Self-Reference:** The ability of language to talk about itself (e.g., "This sentence is false").

  **The Problem:** If you have Self-Reference and Unrestricted Transparency, Classical Logic explodes (the Liar Paradox proves a contradiction).
  **The Cost:** To save the theory, you must drop one.
  *   Drop Classical Logic? (Paraconsistent logic).
  *   Drop Self-Reference? (Ban certain sentences as meaningless).
  *   Drop Transparency? (Say " 'p' is true" means *more* than just "p").

  This is where your philosopher friend was being slightly disingenuous. They sold you "Unrestricted Transparency" (truth is just a grammatical device) as the whole story. But to keep that story consistent, they have to accept weird logical costs elsewhere. It's not a scam, but it is a trade-off they didn't mention.

  ### 6. The Killer Constraint
  If you want to hold your own in the next interview, focus on this single requirement:

  **The Truth-Warrant Distinction.**

  This is the requirement that knocks out the most theories *relevant to your work*.
  *   **Why:** It kills Pragmatist theories (Truth = What works), Coherence theories (Truth = What fits our beliefs), and Verificationist theories (Truth = What we can prove).
  *   **The Test:** Ask the philosopher: *"Can a statement be true even if no human being ever has the evidence to verify it?"*
  *   **The Trap:** If they say **No**, their theory cannot support fact-checking. It reduces truth to *current human consensus*. If they say **Yes**, they are admitting truth is something distinct from our ability to certify it—which validates your intuition that "vouching" is doing real work, not just grammatical work.

  The Liar Paradox is the logical grenade that keeps philosophers up at night, but the **Truth-Warrant Distinction** is the practical grenade that determines whether a theory of truth is useful for a journalist. If a theory can't explain the difference between "It is true" and "We know it," it has nothing to say about disinformation.
