answer: |-
  This is a sharp intuition, and you are not the first to have it. Philosophers of physics like Simon Saunders, David Wallace, and Hilary Greaves have spent considerable energy mapping exactly this terrain. Your feeling that you "already have his ontology in your pocket" is structurally correct, but metaphysically loaded.

  Here is the translation of Lewis's Modal Realism (MR) into Everettian Quantum Mechanics (EQM), followed by the friction points, and finally my verdict on the contingency residue.

  ### The Translation

  **1. Plurality of Worlds $\rightarrow$ The Decoherent Branching Structure**
  *   **Lewis:** Reality is a mereological sum of concrete, spatiotemporally isolated "worlds." All are equally real.
  *   **Everett:** Reality is the universal wavefunction $|\Psi\rangle$. Via decoherence, this decomposes (approximately) into orthogonal components (branches) in the preferred basis. All branches are equally real components of the state vector.
  *   **Mapping:** Clean. Both reject the "one true world" actualism. For Lewis, the "plurality" is the ontology; for you, the "branching structure" is the emergent ontology.

  **2. Indexical Actuality $\rightarrow$ Branch Indexicality**
  *   **Lewis:** "Actual" is indexical, like "here" or "now." It refers to the world containing the speaker. No world is privileged in the God's-eye view.
  *   **Everett:** "Actual" refers to the branch containing the observer's current memory state. The wavefunction is the "God's-eye" reality; the branch is the "indexical" reality.
  *   **Mapping:** Very Clean. This is the strongest link. Both views explain why we experience a single outcome despite the ontology containing many: we are self-located within one component.

  **3. Counterpart Theory $\rightarrow$ Successor/Person-Stage Theory**
  *   **Lewis:** You are world-bound. You do not exist in other worlds. When we say "You could have won," we refer to a *counterpart* (similar causal/historical origin) in another world who won.
  *   **Everett:** Pre-branching, there is one observer state. Post-branching, there are multiple successor states. Strict trans-temporal identity across a branch point is problematic (one becomes many). Most Everettians adopt a Parfitian view: identity isn't what matters; psychological continuity is. The "other branch you" is your successor, functioning exactly like a Lewisian counterpart.
  *   **Mapping:** Clean, provided you accept that personal identity does not survive branching in a strict numerical sense. If you insist "I" am the unique pre-branch entity that splits, you violate Lewis's world-bound constraint. If you treat "I" as a momentary person-stage, the mapping holds.

  **4. Recombination Principle $\rightarrow$ Hilbert Space Dynamics**
  *   **Lewis:** Anything can coexist with anything else, provided they fit spatiotemporally. This principle generates the space of possible worlds.
  *   **Everett:** The space of branches is generated by the Hamiltonian acting on the initial state within Hilbert space.
  *   **Mapping:** Distorted. Lewis's recombination is logical/conceptual; Everett's is dynamical/physical. Lewis allows worlds with magic or different laws (if one accepts Humean supervenience broadly); Everett only allows branches consistent with the universal Hamiltonian. Everett's "modal space" is a subset of Lewis's.

  ### The Friction Points (Where the Translation Breaks)

  **1. Isolation vs. Entanglement**
  Lewisian worlds are *causally and spatiotemporally isolated*. There is no interaction between them. Everettian branches are *orthogonal components of a single entangled state*. While decoherence suppresses interference effectively to zero, it is not fundamental isolation. The branches are parts of a whole, not atoms of a plurality.
  *   **Consequence:** In Lewis, the plurality is a set of disjoint universes. In Everett, the plurality is a decomposition of one universe. This matters for conservation laws and global symmetries which apply to $|\Psi\rangle$ but not to individual branches.

  **2. The Status of the Plurality (Contingent vs. Necessary)**
  For Lewis, the *existence* of the plurality of worlds is a necessary truth (he argues for it), but the *content* of any specific world is contingent. However, the *space* of worlds represents *possibility*.
  For Everett, given the initial state and Hamiltonian, the branching structure is *deterministic*. The "plurality" of branches is not a space of possibilities; it is a space of *actualities*.
  *   **Consequence:** Lewis uses worlds to analyze modality (Possibility = Existence of a world). Everett uses branches to analyze probability (Probability = Measure over existing branches).

  ### The Verdict on Contingency

  You asked me to commit: **Does anything survive of the contingency claim beyond "there's a branch where it went otherwise"?**

  **My Verdict: No.**

  And that is not a defect of your vocabulary; it is a clarification of Lewis's.

  Here is the hard truth: Lewis's Modal Realism attempts to have its cake and eat it too. He wants worlds to be concrete (to ground truth conditions) but *isolated* (to preserve the intuition that they are "alternatives"). He wants to say "It could have been otherwise" to mean "There is a real world where it is otherwise," while maintaining the feeling that *this* world is the only *actual* one.

  Everettianism exposes this as a distinction without a difference. If all worlds are equally real (as Lewis says), then the distinction between "actual" and "merely possible" is purely indexical (as Lewis says). But if the distinction is purely indexical, then **all possibilities are actualized from the God's-eye view.**

  In Everett, the "could have been otherwise" is reduced entirely to **self-locating uncertainty**.
  *   **Lewisian Contingency:** "The world could have been different" means "There exists a concrete world $W_2$ distinct from $W_1$."
  *   **Everettian Contingency:** "The world could have been different" is false. The wavefunction is what it is. "My experience could have been different" is true. It means "There exists a branch $B_2$ orthogonal to my current branch $B_1$."

  **The Residue:**
  The only thing lost in the translation is **Global Contingency**.
  *   In Lewis's view, the *plurality itself* allows for the thought: "The set of all worlds could have been different." (Though Lewis struggles to make sense of this).
  *   In Everett's view, given $|\Psi(t_0)\rangle$ and $\hat{H}$, the set of all branches is fixed. There is no sense in which the universal wavefunction "could have been" different (unless you invoke a multiverse of wavefunctions, which is a level up).

  **Is this a defect?**
  If you think physics should account for the intuition that "the universe itself might not have existed," then Everett fails where Lewis succeeds (by positing a modal space broader than physical law).
  But if you think that intuition is a cognitive illusion stemming from our inability to see the whole state vector, then Everett is the *superior* ontology. It removes the "modal gap." Lewis posits a realm of Possibilia that are *not* Actual. Everett posits that **Actuality is sufficient to ground Modality.**

  ### Conclusion

  You are right that you have Lewis's ontology in your pocket, but you have the **Necessitarian** version of it.

  Lewis: $Reality = \sum \text{Possible Worlds}$ (where "Possible" implies "Not necessarily Actual").
  Everett: $Reality = \sum \text{Actual Branches}$ (where "Actual" implies "Necessarily Existing given laws").

  The translation works perfectly for the **agent's perspective** (which is all physics ever tests). From inside the branch, the uncertainty, the indexicality, and the counterpart relations are isomorphic to Lewis's picture.

  But from the **God's-eye perspective**, you have stripped Lewis's ontology of its "modal humility." Lewis wanted other worlds to be *alternatives* to this one. Everett forces you to accept they are *parts* of this one.

  **Final Commitment:** The "contingency" that survives is purely indexical self-location. The metaphysical claim that "things could have been globally otherwise" does not survive the translation. But you should not view this as a loss. It is a gain in parsimony. Lewis's "modal realism" was always a halfway house. Everett completes the project: **Modality is just Actuality viewed from a specific branch.** The residue you feel is the ghost of the Copenhagen collapse, not a genuine metaphysical remainder.
