  i'm a physics phd student working on decoherence, so i live in the Everettian literature (branching, self-locating uncertainty, the decision-theoretic defence of the Born rule, all that). i've read enough Lewis to know the shape of his modal realism but i keep having this feeling that i already have his ontology in my pocket -- like the plurality of worlds is just the branching structure of the universal wavefunction with different labels. so here's what i want: restate Lewis's modal realism -- the plurality of equal-reality worlds, the indexical analysis of actuality, counterpart theory, the recombination principle -- in the vocabulary i actually use. branches, decohered histories, amplitude measure, self-locating uncertainty. and be honest about the translation: tell me which parts map cleanly, which parts only map if you distort one side or the other, and which parts have no expression at all in Everett talk. the obvious worry is contingency -- on my picture all the outcomes happen somewhere, and branches share common structure and history in a way Lewis's worlds emphatically don't, so i suspect "could have been otherwise" doesn't come out the other side. but don't just lay out the options for me: give me your actual verdict on where the residue lives, whether it's a defect of my vocabulary or a sign Lewis was less clear than he looked, and commit to whether anything survives of the contingency claim beyond "there's a branch where it went otherwise". if you think the translation basically works and i'm right that i already have his ontology, say so and defend it.
