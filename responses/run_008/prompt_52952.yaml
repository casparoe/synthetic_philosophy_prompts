      *   *The Materialist/Marxist Position:* Ideas are superstructure. You can't explain the base (economy) with the superstructure (religion). If asceticism emerged, it's because emerging capitalist relations *needed* it or *produced* it. To say "values caused behavior" ignores that "values" are epiphenomenal to material conditions.
      *   *The User's Epidemiological Analogy:* Exposure (Protestantism), Outcome (Capitalism), Confounders (Commercial regions). Epidemiologists accept "Diet $\rightarrow$ Disease" without needing to explain "Why Diet?" immediately. Materialists demand "Why Diet?" before accepting "Diet $\rightarrow$ Disease."

