answer: |-
  This is a remarkably sharp diagnosis from someone looking at social theory through the lens of causal inference. You have correctly identified that the friction is not merely about the coefficient of a specific historical variable, but about the *admissibility* of that variable in the structural equation of history.

  Here is the diagnosis of the disagreement, an evaluation of your hypothesis, and a proposal for what progress might look like.

  ### I. Diagnosis: Ontological Endogeneity vs. Causal Autonomy

  Your hypothesis—that this is a disagreement about "what a completed explanation looks like"—is correct, but it can be sharpened using your own epidemiological vocabulary. The disagreement is not verbal, nor is it purely empirical. It is a dispute over **ontological endogeneity**.

  In observational epidemiology, you operate under a methodological assumption: the exposure ($X$) and the outcome ($Y$) are distinct entities. Even if they are correlated due to confounding ($Z$), $X$ is not *constituted* by $Y$. Diet is not constituted by heart disease, even if heart disease changes future diet.

  The Materialist critique of Weber is not simply that there are confounders (commercial regions). It is that the "exposure" (the Protestant Ethic) is **ontologically endogenous** to the "outcome" (Capitalism).
  *   **The Materialist Claim:** The "Spirit of Capitalism" is not an independent variable that can be lagged against economic behavior. It is a *rationalization* or *superstructural reflection* of material practices that already exist. To claim the ethic caused the behavior is to mistake the label for the substance. In your terms, they argue that $X$ is a measurement error of $Y$, or that $Y \rightarrow X$ is the true structural direction, making any regression of $Y$ on $X$ spurious.
  *   **The Weberian Claim:** Ideas possess **relative autonomy**. While they arise in context, once codified (e.g., in catechisms, sermons, pastoral care), they exert a constraint on action that is not reducible to the material conditions that birthed them. In your terms, they argue for a valid instrumental variable: Religious Doctrine $\rightarrow$ Ethic $\rightarrow$ Economic Behavior, where the first arrow is distinct enough from the economic base to allow identification.

  Therefore, the sides are not answering different questions; they are disagreeing on whether the proposed exposure *exists as a separable cause*.

  ### II. Support from the Arguments Themselves

  You asked to avoid a literature survey and focus on what the sides *say*. The logical structure of their retorts reveals this ontological clash.

  **1. The Materialist "Epiphenomenal" Charge**
  Critics (from Fanfani to Marxist historians) consistently argue that capitalist accounting, banking, and long-distance trade predated the Reformation (e.g., in Northern Italy or Flanders).
  *   *The Logic:* If $Y$ (capitalist practice) exists at $T_1$, and $X$ (Protestant ethic) appears at $T_2$, $X$ cannot cause $Y$.
  *   *The Deeper Point:* When Weberians point to Protestant merchants working harder, Materialists reply that these merchants were working harder *because* market competition compelled them to, and they adopted Protestantism because it justified that compulsion.
  *   *The Causal Implication:* This is a claim of **perfect collinearity** driven by structural necessity. They argue that in a competitive market, *any* culture that survives will look like the "Protestant Ethic." Therefore, isolating Protestantism as a cause is selecting on the dependent variable. The "values" are not an exposure; they are a symptom.

  **2. The Weberian "Elective Affinity" Defense**
  Weber himself anticipated this in his "Anti-Critical Last Word" (1908). He explicitly denied he was arguing for a mono-causal historical law.
  *   *The Logic:* Weber argues that traditionalism (the desire to work only enough to meet needs) was the barrier to modern capitalism. Material incentives alone did not break this barrier.
  *   *The Deeper Point:* Weber posits a **mechanism of sanction**. The unique contribution of ascetic Protestantism was not "working hard" (which exists everywhere) but the *psychological sanction* that made accumulation a moral duty rather than avarice.
  *   *The Causal Implication:* This is a claim of **effect modification**. Material conditions ($Z$) were present elsewhere, but without the specific cultural schema ($X$), the outcome ($Y$) did not manifest in its *rational* form. Weberians argue that without the specific religious anxiety regarding salvation, the material incentives would have resulted in feudal rent-seeking or political capitalism, not rational bourgeois capitalism.

  **3. Why Your Epidemiological Analogy Hits a Wall**
  You noted that epidemiologists don't confuse "Diet $\rightarrow$ Disease" with "What causes Diet."
  *   *The Disanalogy:* In biology, the mechanism linking diet to disease (e.g., lipid metabolism) is distinct from the mechanism linking socioeconomic status to diet (e.g., food deserts).
  *   *In Social Theory:* The mechanism linking "Ethic" to "Action" is *meaning*. The mechanism linking "Material Conditions" to "Ethic" is also *meaning* (rationalization). Because both arrows flow through the same medium (human consciousness/meaning), Materialists argue you cannot sever the chain. They claim the "Ethic" is just the conscious experience of material constraint. Weberians claim the "Ethic" acts as a filter that transforms material constraint into specific behavioral outputs.

  ### III. What Counts as Progress?

  The impasse persists because both sides are partially right about different phases of the causal loop. Progress requires abandoning the "Which one caused it?" framework for a **mechanism-based institutionalism**.

  **1. Reformulate the Question: From Cause to Condition**
  Stop asking "Did Protestantism cause Capitalism?" Ask: **"Under what institutional conditions do cultural schemas become causally efficacious?"**
  *   Sometimes culture is a thermostat (endogenous, resetting to material conditions).
  *   Sometimes culture is a lever (exogenous, shifting the equilibrium).
  *   *Progress:* Research should focus on identifying the *switch*. For example, Richard Biernacki's work suggests that the *form* of labor commodification differed in Germany vs. Britain due to cultural conceptions of labor, independent of market pressure. This moves the debate from "Did it happen?" to "Here is the specific micro-mechanism where meaning altered the price of labor."

  **2. Temporal Granularity and Counterfactuals**
  Historical evidence *can* settle this, but only if we stop treating "Capitalism" and "Protestantism" as monoliths.
  *   *Research Design:* We need high-frequency historical data on **time preference** and **trust**. If the Protestant Ethic thesis holds, we should see a shift in discount rates or contract enforcement *prior* to the explosion of trade in specific Protestant regions, controlling for security of property rights.
  *   *The Counterfactual:* The strongest Weberian evidence is the comparison of Protestant vs. Catholic regions *within* the same political/legal structures (e.g., within the Holy Roman Empire). If Protestant regions developed rational capitalist accounting faster than Catholic neighbors with identical legal codes, the Materialist "background conditions" argument weakens. (Some economic historians, like Sascha Becker and Ludger Woessmann, have attempted this with Prussian data, finding literacy and human capital effects, though the link to "spirit" remains debated).

  **3. Acknowledge the Feedback Loop (The Thermostat)**
  Your intuition about the thermostat is the most promising path. The relationship is almost certainly recursive:
  $$ \text{Material Conditions} \rightleftharpoons \text{Cultural Schema} \rightarrow \text{Economic Action} $$
  *   *Progress:* Admit that the *origin* of the ethic may be materially conditioned (Materialists win round 1), but argue that once institutionalized, the ethic acquires **path dependence** that constrains future material development (Weberians win round 2).
  *   This resolves the "completed explanation" dispute. The Materialist gets the genealogy of the variable; the Weberian gets the causal power of the variable once it exists.

  ### IV. Conclusion: Will the Impasse Persist?

  The impasse will persist **if** the debate remains framed as a contest for historical primacy (i.e., "Who is the real father of capitalism?"). This is a theological question disguised as history.

  However, the impasse dissolves if we treat it as a problem of **causal heterogeneity**.
  *   In some contexts (e.g., early modern Europe), cultural schemas may have been the binding constraint on economic rationalization (Weber is right).
  *   In other contexts, material constraints determine the cultural schema (Marx is right).

  As an epidemiologist, you know that smoking causes cancer, but not in every smoker, and lung cancer can occur without smoking. The question is about the **Average Treatment Effect** of the "Protestant Ethic" on "Capitalist Development."

  **Final Verdict:**
  The disagreement is **conceptual** (regarding the autonomy of ideas) masquerading as **empirical**.
  *   **Materialists** demand a closed system (no unexplained exogenous variables).
  *   **Weberians** demand an open system (human agency introduces noise/autonomy).

  **Progress** lies in specifying the **mechanism of transmission**. If Weberians can show exactly *how* a sermon changes a specific economic calculation (e.g., lowering the discount rate, increasing trust among strangers) in a way that material incentives alone do not, they win. If Materialists can show that those calculations were forced by market competition regardless of the sermon, they win. Until the mechanism is specified rather than asserted, the debate remains a philosophical stalemate.
