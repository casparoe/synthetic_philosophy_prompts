      *   This is a known trope in legal theory (e.g., Stanley Fish, some critical legal studies folks, or just pop-philosophy). It's often called "Gödel-bashing" or misapplying logic to social systems.
      *   *Core Error:* Equating "formal system" (in the mathematical logic sense) with "rule-governed practice" (in the sociological/legal sense).
      *   *Core Error 2:* Equating "undecidable proposition" with "hard case requiring discretion."
