      *   **The "Consistency" Confusion.** GIT2 says a system can't prove its own consistency *within its own language*. It doesn't mean the system is inconsistent, nor does it mean we can't know it's consistent from the outside. Law doesn't need to prove its consistency mathematically; it needs social acceptance.

