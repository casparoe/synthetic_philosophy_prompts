answer: |-
  To allocate six researcher-years effectively, we must treat this not as a menu of independent topics, but as a dependency graph. Superrationality is currently a cluster of intuitions (Hofstadter's) searching for a formalism (Decision Theory). Funding should flow from the mathematical prerequisites to the game-theoretic consequences, and finally to the population dynamics.

  Here are the explicit criteria governing this ordering:

  1.  **Foundational Dependency:** If Problem A must be solved to rigorously state Problem B, A is upstream.
  2.  **Formal Tractability:** Given this is a grant for *formal* decision theory, priority goes to problems solvable via logic, probability, and computation theory, rather than those requiring behavioral data or empirical sociology.
  3.  **Leverage:** Solving the problem should unlock progress on multiple downstream candidates.

  ### 1. The New Nomination: The Semantics of Logical Counterfactuals
  **Priority:** First (Upstream of all others)
  **Reasoning:** You asked for a problem not listed that belongs ahead of yours. This is it. Superrationality relies on the claim: "If I choose to cooperate, that logically implies you will cooperate." This is a counterfactual about a logical fact (the output of a reasoning process). Standard causal decision theory (CDT) handles physical counterfactuals; evidential (EDT) handles correlations; but neither handles *logical* counterfactuals rigorously. Functional Decision Theory (FDT) attempts this, but the underlying mathematics (logical induction, proof-based counterfactuals) remains incomplete.
  **Tractability:** High for theorists. This is a problem of semantics and proof theory. It does not require human subjects.
  **Why Upstream:** You cannot resolve **(i) Formal Status** without a coherent semantics for the counterfactuals the theory employs. If we cannot define what "If I were to choose X..." means when the "I" is an algorithm, we cannot axiomatize the theory.
  **Shifters:** If a breakthrough occurs here (e.g., a stable semantics for logical counterfactuals is published), **(i)** becomes immediately tractable. If this stalls, **(i)** remains philosophical hand-waving.

  ### 2. Candidate (i): The Formal Status of Superrationality
  **Priority:** Second
  **Reasoning:** Once the semantic engine (Logical Counterfactuals) is provisionally settled, we must determine the vehicle. Is superrationality a distinct decision theory, or merely FDT/UDT with a specific "common prior" assumption? We need a representation theorem: under exactly what axioms does superrational cooperation emerge as the unique rational solution?
  **Tractability:** High. This is axiomatic decision theory. It involves proving equivalence or divergence between existing frameworks (CDT, EDT, FDT) and Hofstadter's intuition.
  **Why Upstream:** You cannot test the **Robustness (iv)** or **Similarity (iii)** of a strategy if you cannot formally define the strategy. Is the agent maximizing expected utility over logical implications? Or is it following a heuristic? This item fixes the object of study.
  **Shifters:** If the conclusion is "Superrationality is simply FDT with a symmetry prior," funding should pivot immediately to **(iii)** to test the limits of that prior. If it is distinct, funding stays here to flesh out the axioms.

  ### 3. Candidate (iii): The Similarity Problem (Algorithmic Distance)
  **Priority:** Third
  **Reasoning:** Perfect symmetry is a toy model. In reality, agents are never identical. They have different code, different hardware, or different training data. We need a metric for *algorithmic similarity* that dictates how much superrational correlation degrades as agents diverge. Does cooperation decay linearly with code distance? Is there a threshold?
  **Tractability:** Medium-High. This requires information theory and complexity theory applied to decision algorithms. It is theoretical, not empirical.
  **Why Upstream:** This is the bridge between the ideal theory **(i)** and the real world. Without a theory of partial similarity, **(iv) Robustness** cannot be modeled (since a population is never homogeneous). It also informs **(ii) Randomization**, as correlation strength dictates mixing probabilities.
  **Shifters:** If we find that correlation decays exponentially with even minor code differences, superrationality becomes a niche curiosity, and funding should shift to **(iv)** to see if it can survive at all. If it degrades gracefully, it becomes a viable general theory.

  ### 4. Candidate (ii): The Randomization Problem
  **Priority:** Fourth
  **Reasoning:** Hofstadter's "Platonia" and "Luring Lottery" require mixed strategies. In standard game theory, mixed strategies are often interpreted as beliefs about the other's uncertainty. In superrationality, the randomization must be *logically correlated* without a shared random number generator. How do two isolated agents correlate their coin flips via reasoning alone?
  **Tractability:** Medium. This is technical game theory. It is downstream because the prescription for randomization depends on the decision rule **(i)** and the degree of symmetry **(iii)**.
  **Why Upstream:** It is a specific implementation detail. While crucial for the specific puzzles Hofstadter posed, it is less fundamental than the decision rule itself. However, it is upstream of **(v)** because you cannot model AI races or bidding without knowing how agents randomize.
  **Shifters:** If it is proven that uncorrelated private randomization is the only stable equilibrium in asymmetric cases, the "superrational" solution to the Luring Lottery collapses, lowering the importance of this item.

  ### 5. Candidate (iv): Robustness and Evolutionary Stability
  **Priority:** Fifth
  **Reasoning:** Even if superrationality is formally coherent, does it survive contact with defectors? If a population of superrationalists is invaded by CDT maximizers, are they exploited? This is an evolutionary game theory question.
  **Tractability:** High. Standard evolutionary dynamics modeling.
  **Why Downstream:** You cannot model the selection pressure on a strategy until you have defined the strategy **(i)** and its behavior under asymmetry **(iii)**.
  **Shifters:** If **(iii)** shows that similarity requirements are too strict for natural populations, this item becomes a post-mortem on why the theory fails in nature. If the theory is robust, this becomes the primary argument for its normative force.

  ### 6. Candidate (v): External Payoffs (Applications)
  **Priority:** Deprioritized (Sixth)
  **Reasoning:** I recommend explicitly excluding this from the formal theory grants.
  **Justification:**
  1.  **Category Error:** This is an empirical/behavioral question, not a formal one. Testing voter turnout or AI bidding requires data collection, not proof.
  2.  **Downstream Risk:** Applying a theory before it is formalized leads to the "overselling" you noted. If **(i)** reveals superrationality to be a fragment of FDT, the "novel applications" may already be covered by existing literature.
  3.  **Tractability:** Three years is insufficient to gather conclusive empirical evidence on voter turnout or AI training dynamics, whereas it is sufficient to resolve the axiomatic status.
  **Exception:** This should only be funded if **(i)** through **(iv)** are successfully resolved, serving as a validation phase in a subsequent grant cycle.

  ### Summary of the 3-Year Agenda

  **Year 1: The Foundation.**
  Focus 4 researchers on **(New) Logical Counterfactuals** and **(i) Formal Status**. The goal is a working semantics and a representation theorem. We must know *what* we are studying before we study its properties.
  *Deliverable:* A formal definition of the "Superrational Agent" that distinguishes it from or reduces it to FDT/UDT.

  **Year 2: The Continuity.**
  Focus 2 researchers on **(iii) Similarity**. Develop a metric for algorithmic distance and model how decision correlation decays across that distance.
  *Deliverable:* A function mapping "degree of similarity" to "probability of cooperative equilibrium."

  **Year 3: The Stress Test.**
  Focus 2 researchers on **(ii) Randomization** and **(iv) Robustness**. Apply the Year 1 definition and Year 2 similarity metrics to the specific Hofstadter games and simple evolutionary models.
  *Deliverable:* Proof of stability (or instability) of superrational strategies in heterogeneous populations.

  **Why this order?**
  It respects the logical dependency of mathematics. We cannot measure the degradation of symmetry **(iii)** if we haven't defined the symmetry **(i)**. We cannot test evolutionary stability **(iv)** if we don't know the strategy's move set **(ii)**. And we should not claim real-world relevance **(v)** until the math holds up. This agenda maximizes the probability of a definitive theoretical result, rather than producing three years of speculative application.
