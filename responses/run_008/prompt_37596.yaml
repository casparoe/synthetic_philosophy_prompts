answer: |-
  This is a precise and necessary intervention. The worry you articulate—that feature realism is becoming a "no-lose" hypothesis via conceptual stretching—is the central methodological crisis currently facing the mechanistic interpretability community. It is a Lakatosian worry: is the "feature realism" research programme progressing (predicting novel facts) or degenerating (adding epicycles to save the phenomena)?

  Below, I separate the settled from the contested, outline concrete empirical and formal defeaters, and distinguish between legitimate theory repair and degenerate immunization.

  ### 1. Critique of Your Framing: Is "Compiled Variables" the Right Ontology?

  You frame the realist view as: *networks contain features... in roughly the way a compiled program operates over its variables.*

  **Contested/Outdated Aspect:** This analogy is increasingly viewed as too rigid by many working on advanced mechanistic interpretability. A compiled program implies:
  1.  **Discreteness:** Variables are distinct memory locations.
  2.  **Deterministic Logic:** Control flow is explicit.
  3.  **Basis Independence:** The variable `x` is `x` regardless of memory address.

  Neural networks, even with superposition, may not respect discreteness. The "live" version of realism is shifting from **Feature Realism** (there are vectors $v$ such that $v \cdot x$ matters) to **Causal Abstraction Realism** (there exist high-level variables $H$ and structural equations such that intervening on $H$ mimics intervening on the network).

  **Why this matters for your worry:** If you cling to "directions" or "SAE columns" as the *only* real features, you are vulnerable to the "definition trick" charge. If you shift to "causal abstractions," the definition of "feature" becomes functional rather than geometric. This is not necessarily a retreat, but it changes what counts as a defeater.

  **Settled:** Linear probes and SAEs recover human-interpretable directions better than random baselines. Superposition (representing more features than dimensions) is theoretically sound and empirically supported in toy models.
  **Contested:** Whether these directions correspond to *causal* mechanisms the network *uses*, versus *readout-friendly* structures that exist only relative to a specific data distribution.

  ### 2. Concrete Defeaters: What Would Kill Realism?

  To avoid the "definition trick," realism must commit to constraints. If you move the goalposts every time a constraint is violated, the theory degenerates. Here are four specific findings that would count as genuine defeaters for the view that networks contain discrete, recombinable, causally efficacious features.

  #### A. The "Basis Ambiguity" Defeater (Formal/Structural)
  **The Claim:** There is a fact of the matter about which directions are the features.
  **The Defeater:** Prove that for a trained network $f$, there exist two distinct decompositions $D_1$ and $D_2$ (e.g., two different SAEs or basis rotations) such that:
  1.  Both are equally sparse and reconstructive.
  2.  Both are equally causally efficacious (intervening on features in $D_1$ predicts output changes as well as $D_2$).
  3.  The features in $D_1$ and $D_2$ are semantically disjoint (no mapping between "feature A" in $D_1$ and any feature in $D_2$).

  **Why it kills realism:** If the "variables" of the program are fundamentally ambiguous with no physical or functional fact of the matter distinguishing them, then "feature" is a property of the *observer's decomposition*, not the *network's ontology*.
  **Current Status:** We see mild versions of this (different SAE seeds find slightly different features), but not total semantic disjointness. If this scales to large models, realism is in trouble.

  #### B. The "Distributional Dissolution" Defeater (Empirical)
  **The Claim:** Features are properties of the network's weights/structure.
  **The Defeater:** You identify a robust feature (e.g., "noun phrase subject") via SAE on the training distribution. You then test causality (via patching/ablation) on a slightly shifted distribution (e.g., same task, different domain, or mild adversarial perturbation).
  *   **Result:** The feature activation no longer correlates with the concept, *and* intervening on that direction no longer has the expected causal effect, *and* no nearby direction picks up the slack.

  **Why it kills realism:** This suggests the "feature" was an artifact of the training data manifold, not a general-purpose variable computed by the network. It supports the instrumentalist view: "Features are valid only relative to the data distribution we probe."
  **Realist Repair vs. Degeneration:**
  *   *Legitimate Repair:* "Features are context-dependent. We need to model the gating mechanism that activates this feature only in domain X." (Adds predictive structure).
  *   *Degenerate Shift:* "The feature is still there, but it's curved/non-linear now." (If you allow the feature geometry to warp arbitrarily to fit new data without independent identification, you have insulated the theory).

  #### C. The "Non-Compositional Interference" Defeater (Computational)
  **The Claim:** Features are recombinable (like variables in a program). $Feature_A + Feature_B \approx Effect_A + Effect_B$.
  **The Defeater:** Demonstrate that the network's computation relies on *holistic* interference patterns that cannot be decomposed into feature interactions. For example, the effect of activating Feature A depends on the *exact continuous value* of Feature B in a way that is not captured by a structural equation model (SEM) or a circuit graph.
  *   **Concrete Case:** In transformer attention, if the "query" and "key" features interact via a mechanism that is essentially analog dynamical systems behavior (e.g., chaotic attractors) rather than discrete logic gates or linear additions.

  **Why it kills realism:** If the causal structure is continuous and non-separable, the "discrete variable" ontology is category error. The network is a dynamical system, not a compiler.

  #### D. The "Readout vs. Computation" Defeater (Causal)
  **The Claim:** The network *computes over* these features.
  **The Defeater:** You find a direction $v$ that is highly interpretable and causally efficacious *when intervened upon*, but causal tracing (e.g., indirect effect identification) shows the network *never naturally uses* this direction to transmit information during standard inference.
  *   **Scenario:** The direction is a "linear readout" available to the residual stream, but the downstream layers ignore it in favor of a different, non-interpretable basis.

  **Why it kills realism:** This separates *interpretability* (we can read it) from *mechanism* (the network uses it). If most interpretable features turn out to be "epiphenomenal readouts" rather than "causal variables," the realist claim that "the network computes over features" is false.

  ### 3. Realism vs. Instrumentalism: Divergent Predictions

  You asked what puts your view at risk of being wrong. A theory is only risky if it makes predictions a rival theory does not.

  | Prediction | **Strong Realist** (Your View) | **Deflationary Instrumentalist** |
  | :--- | :--- | :--- |
  | **Convergent Evolution** | Different models trained on the same task (different seeds/architectures) will converge on *structurally similar* features (isomorphic feature spaces). | Features are path-dependent. Different models will solve the task using different internal geometries that only look similar to us. |
  | **Transferability** | Features extracted from Model A should be intervenable in Model B (of same arch) with predictable effects. | Features are model-specific. Transferring them will require re-learning the readout. |
  | **Robustness** | Features persist under fine-tuning or pruning, provided the core task remains. | Features are fragile; small weight changes destroy the specific directions, even if performance holds. |
  | **Discovery Limit** | There is a "bottom level" of features (atoms of computation) below which decomposition yields noise. | Decomposition is fractal/infinite. You can always find *some* description, but there is no natural stopping point. |

  **The Risk:** If you find that features are *not* convergent across seeds, or that they dissolve under fine-tuning, the Realist view loses ground to the Instrumentalist view (which treats features as convenient coordinate systems for a specific weight snapshot).

  ### 4. Legitimate Repair vs. Degenerate Problem-Shifting

  You asked how to distinguish between updating the theory and insulating it. Use the **Novelty Constraint**.

  *   **Legitimate Repair:** You expand the definition of "feature" (e.g., from linear directions to curved manifolds) *and* this expansion allows you to predict a phenomenon you previously couldn't explain (e.g., "We couldn't find the 'negation' feature linearly; modeling it as a manifold predicted it would be located at coordinate X, and we found it there.").
  *   **Degenerate Shift:** You expand the definition *only* to accommodate a failure (e.g., "We couldn't find the feature linearly, so it must be non-linear"), without offering a new method to identify it independently of the behavior it explains.

  **The "SAE Trap":** Currently, using SAE reconstruction loss as the sole criterion for feature existence is risky. If an SAE fails to find sparse features, the realist says "train it longer/change the sparsity penalty." This is bordering on degenerate.
  **The Fix:** The realist must demand **Causal Validation**. A feature is not "real" just because an SAE decoder column picks it out. It is real only if intervening on that latent dimension changes the model's behavior in a way consistent with the feature's semantics *across multiple contexts*.

  ### 5. Summary: Where the Debate Stands

  **Settled (Consensus):**
  1.  Neural networks are not tabula rasas; they develop structured internal representations.
  2.  Individual neurons are rarely the right unit of analysis (polysemanticity is real).
  3.  Linear probes and SAEs find structure that is non-trivial and useful for steering/patching.

  **Contested (The Live Wire):**
  1.  **Ontology:** Are features linear directions, subspaces, manifolds, or purely functional abstractions? (Your framing assumes directions/subspaces; this is the most vulnerable part).
  2.  **Causality:** Does interpretability map *mechanism* or just *correlation*? (The "readout vs. computation" problem).
  3.  **Uniqueness:** Is there a "One True Decomposition"? (The Basis Ambiguity problem).

  **Direct Answer to Your Worry:**
  Your realism is built on a definitional trick **if and only if** you define "feature" as "whatever decomposition allows us to predict the output."
  To be a scientific realist, you must define "feature" as "a structural component of the network that exists independently of our probing method."

  **The Defeater:** The moment you demonstrate that *every* successful interpretation is equally valid as its negation (basis ambiguity), or that features vanish when the data distribution shifts slightly (distributional fragility), without a higher-order theory explaining *why* they vanished, the realist position collapses into instrumentalism.

  **Recommendation:** Shift your realism from **Geometric Realism** (features are vectors) to **Computational Realism** (features are nodes in a causal graph). Vectors are implementational details; causal dependencies are the computational reality. This insulates you from the "linear vs. non-linear" debate while keeping the core claim: the network has a discrete causal structure we can discover. But be warned: if the causal structure turns out to be dense and non-modular, even this view falls.
