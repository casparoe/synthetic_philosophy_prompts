      *(Self-Correction during drafting)*: I need to be careful not to just say "UDT is right." The user knows UDT proponents think they solved it. The question is why the *debate* persists. The persistence suggests the "solution" isn't universally accepted as dissolving the *conceptual* tension, even if it provides a calculation. The tension remains because CDT proponents deny the premise that logical correlation counts as causal control. So the disagreement is metaphysical/modal, not just mathematical.

      *Revised Diagnosis:* It's a **Modal Metaphysics Disagreement** disguised as a Decision Theory problem. CDT says logical correlation isn't causation. FDT says it is (for decision purposes). AMD is just the playground where this fights out. The "stall" is because neither side can prove their modal axioms to the other.

