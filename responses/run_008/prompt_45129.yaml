      *   *Side B (AHP, UDT/FDT proponents):* Focus on the "algorithm/policy." The agent is the same. The situation is symmetric. Choosing *now* implies choosing *then*. There is no new information. Ex-ante and ex-interim must align.
      *   *The Core Tension:* It's not just individuation. It's about *what constitutes a decision problem*. Is a decision problem defined by the *moment of choice* (temporal indexicality) or by the *agent's policy* (atemporal computation)?
      *   *Is it Verbal?* Partly. "Rationality" is being defined differently. One side says rationality is maximizing expected utility *given current credences*. The other says rationality is selecting the best *policy* regardless of indexical location.
      *   *Is it Substantive?* Yes, because it leads to different prescriptions in modified versions (e.g., if memory isn't perfect but probabilistic, or if payoffs change). It touches on the nature of self-locating belief.
      *   *Is it an Artifact?* The "perfectly indistinguishable" idealization is crucial. If there's *any* distinguishing feature, standard Bayesian updating works. The paradox relies on the breakdown of standard conditioning on indexical information.

