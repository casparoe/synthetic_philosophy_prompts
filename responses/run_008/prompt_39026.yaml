  # The Fermi Taxonomy: A Decision Tree for the Silent Sky

  This is not a menu. It is a diagnostic flowchart. The goal is not to list every idea ever had, but to carve the logical space such that every leaf is mutually exclusive and collectively exhaustive (within reason). 

  Start at the root. Answer the questions based on your priors about physics, biology, and game theory. Do not peek at the leaves.

  ```text
  ROOT: We look up and the sky is silent.
  │
  ├── Q1: Is the silence a feature of the DATA or the UNIVERSE?
  │   │
  │   ├── Data is compromised (Rendered/Low-Res) 
  │   │   └── LEAF 1: SIMULATION HYPOTHESIS
  │   │
  │   └── Data is trustworthy (Real Universe) 
  │       │
  │       ├── Q2: If a civ survives, does it visibly EXPAND across the stars?
  │       │   │
  │       │   ├── No (It goes inward/virtual) 
  │       │   │   └── LEAF 2: TRANSCENSION HYPOTHESIS
  │       │   │
  │       │   └── Yes (It builds Dyson swarms/colonies) 
  │       │       │
  │       │       ├── Q3: Are there other civilizations currently ACTIVE?
  │       │       │   │
  │       │       │   ├── No (We are effectively alone) 
  │       │       │   │   │
  │       │       │   │   ├── Q4: Is the bottleneck BEHIND us or AHEAD of us?
  │       │       │   │   │   │
  │       │       │   │   │   ├── Behind (Biology is hard) 
  │       │       │   │   │   │   ├── Q4a: Is it Life or Minds?
  │       │       │   │   │   │   │   ├── Life (Abiogenesis) → LEAF 3: RARE EARTH
  │       │       │   │   │   │   │   └── Minds (Intelligence) → LEAF 4: EARLY FILTER
  │       │       │   │   │   │   │
  │       │       │   │   │   └── Ahead (Sociology is hard) 
  │       │       │   │   │       │
  │       │       │   │   │       └── Q5: ANTHROPICS BRANCH (See below)
  │       │       │   │   │           ├── SSA (We are early → Few total observers) 
  │       │       │   │   │           │   └── LEAF 5: LATE FILTER (Great Filter Ahead)
  │       │       │   │   │           └── SIA (We are early → Many future observers) 
  │       │       │   │   │               └── LEAF 6: GRABBY ALIENS (They haven't arrived)
  │       │       │   │   │
  │       │       │   └── Yes (They exist right now) 
  │       │       │       │
  │       │       │       ├── Q6: Do they suppress their visibility INTENTIONALLY?
  │       │       │       │   │
  │       │       │       │   ├── No (They are open, but we don't see them) 
  │       │       │       │   │   │
  │       │       │       │   │   ├── Q7: Is the universe structurally "patchy"?
  │       │       │       │   │   │   ├── Yes (Voids exist) → LEAF 7: PERCOLATION / VOID
  │       │       │       │   │   │   └── No (Should be uniform) → (Incoherent: Return to Q5)
  │       │       │       │   │   │
  │       │       │       │   └── Yes (They are hiding) 
  │       │       │       │       │
  │       │       │       │       └── Q8: What is the MOTIVATION for hiding?
  │       │       │       │           ├── Survival (Predators/Conflict) → LEAF 8: DARK FOREST
  │       │       │       │           └── Ethics (Non-Interference) → LEAF 9: ZOO HYPOTHESIS
  │       │       │       │
  │       │       │       └── (Meta-Objection) 
  │       │       │           └── LEAF 10: ANTHROPIC SHADOW (We can't observe the silence that killed others)
  │       │       │
  │       │       └── (Unoccupied: See Notes)
  │       │
  │       └── (Unoccupied: See Notes)
  │
  └── (Unoccupied: See Notes)
  ```

  ## Node Commentary: Why These Questions?

  **Q1 (Data vs. Universe):** Separates epistemic problems from ontological ones. If the sky is silent because the rendering engine didn't bother drawing aliens, physics doesn't matter.
  **Q2 (Expand vs. Inward):** Carves off the "they are here but we can't see their megastructures" crowd. If they don't expand physically, the Fermi Paradox dissolves into a definition problem.
  **Q3 (Active Now):** Distinguishes between "nobody is home" (Filters) and "nobody is talking" (Stealth).
  **Q4 (Behind vs. Ahead):** The classic Filter split. Behind = we are lucky. Ahead = we are doomed.
  **Q5 (Anthropics Branch):** *Required by prompt.* 
  *   **SSA (Self-Sampling Assumption):** You are a random sample from all observers. If most observers exist in a crowded future, you shouldn't be early. Being early implies the future is empty. → **Late Filter.**
  *   **SIA (Self-Indication Assumption):** You should reason as if you are more likely to exist in a universe with many observers. Being early is compatible with a huge future population. → **Grabby Aliens.**
  **Q6 (Intentional):** Separates *capability* from *motivation*.
  **Q7 (Patchy):** This is the only valid version of "they're too far away." It's not just distance; it's causal structure (percolation theory). We are in a void between expansion bubbles.
  **Q8 (Motivation):** The only gut-checkable distinction between Dark Forest and Zoo. Do you trust the universe?

  ## The Leaves (Definitions)

  1.  **Simulation:** The silence is an optimization choice by the simulator.
  2.  **Transcension:** Civilizations migrate to inner space (M-branes, virtual) rather than outer space.
  3.  **Rare Earth:** Abiogenesis is the hard step. Multicellular life is vanishingly rare.
  4.  **Early Filter:** Life is common, but technological intelligence (or the drive to expand) is the fluke.
  5.  **Late Filter:** Civilizations routinely reach our stage and then destroy themselves (nuclear, bio, AI).
  6.  **Grabby Aliens:** Civs expand at $v < c$. We are in the quiet time before the first wave arrives. (Hanson et al.)
  7.  **Percolation / Void:** Civs expand, but the universe is large enough that uncolonized voids persist indefinitely.
  8.  **Dark Forest:** Visibility = Death. Civs preemptively silence competitors to survive. (Liu Cixin)
  9.  **Zoo:** Visibility = Contamination. Civs silence themselves to allow our natural development. (Ball)
  10. **Anthropic Shadow:** We cannot observe the filter that kills civilizations, because we are survivors. The silence is a selection effect on *observation*, not just existence.

  ## Unoccupied Combinations (The "Empty" Leaves)

  A taxonomy is defined by what it excludes. These combinations are logically incoherent or redundant:

  *   **Rare Earth + Dark Forest:** Incoherent. If we are the only civilization (Rare Earth), there is no one to hide from.
  *   **Transcension + Grabby Aliens:** Contradictory. One posits civilizations leave the physical universe; the other posits they fill it.
  *   **Simulation + Late Filter:** Redundant. If the universe is a simulation, the "filter" is just a script parameter. The Simulation hypothesis swallows the Filter hypothesis.
  *   **Zoo + Dark Forest:** Inseparable without mind-reading. Both result in "They are hiding." I separated them via Q8 (Motivation), but empirically, they are observationally identical. If you meet an alien, you still won't know if they spared you out of pity (Zoo) or because you aren't worth the ammo (Forest).
  *   **"Too Far Away" (Standalone):** Rejected. Distance alone is not an explanation unless coupled with a speed limit and a start time (Grabby) or a structural void (Percolation). "They are far" is a parameter, not a mechanism.

  ## A Note on Anthropics as a "Leaf"

  You asked if Anthropics is a standing objection rather than a leaf. 
  **Verdict:** It is primarily a *modifier* (as seen in Q5), but **Leaf 10 (Anthropic Shadow)** is necessary. 
  Why? Because SIA/SSA (Q5) updates your credence on *when* filters happen. Anthropic Shadow argues that the silence *itself* is unobservable evidence. We cannot see the civilizations that were wiped out before becoming visible. This is distinct from SIA/SSA; it claims the data sample is biased regardless of your reference class. It earns its leaf by claiming the silence proves nothing, whereas the other leaves claim the silence proves *something* (e.g., danger, rarity, distance).

  ## Handout Instructions for Meetup
  1.  **Print on one page.** If it spills, cut the "Unoccupied" section and host it online.
  2.  **Don't argue the leaves.** Argue the *nodes*. If two people end up at "Dark Forest" but took different paths (one thought civs are aggressive, one thought civs are paranoid), they actually disagree on the physics of conflict, not the Fermi Paradox.
  3.  **The "Gut Check" Rule:** If a participant says "I don't know" to a node, they must assign a probability split (e.g., "60% Expand, 40% Transcend"). This forces them to realize where their uncertainty actually lives.
