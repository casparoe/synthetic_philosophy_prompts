prompt: |-
  So, two people in my department have been going at each other for literal years about how old nations are, and I've finally bullied them into an adversarial collaboration. I need the joint statement they should produce.

  One of them is a modernist — the Hobsbawm/Anderson type: nations are basically a product of the late 18th century onward, assembled out of invented traditions, print capitalism, mass literacy, state schooling, censuses, conscription. Before that, "the nation" in anything like our sense just wasn't there, and calling medieval kingdoms "nations" is back-projection. The other is an ethnosymbolist, closer to Anthony Smith: yes, modern nationalism is new, but it isn't built out of nothing — it grafts onto older ethnie (shared myths of descent, sacred homelands, golden ages, symbols), so national identity has real premodern roots, and the modern period is a transformation of that material rather than a creation from scratch.

  What I want, in this order:

  1. A numbered section of claims both of them could actually put their names to — not vacuous ones. They should be able to agree on things like: the world of nation-states as a normative order is recent; premodern polities had collective identities of some kind; and whether a given population counts as a "nation" can't be settled without first fixing what "nation" means. But push past the obvious — I want agreements that would actually surprise people who've watched them argue.

  2. A table of the exact disagreements, each phrased so that the side holding it accepts the wording of its own view. My modernist friend will veto anything that smuggles in "real old nations," and the ethnosymbolist will veto anything that makes ethnie sound like mere raw material the modern state could take or leave.

  3. The cruxes — the sub-questions such that settling one would actually move at least one of them. I have guesses but I want theirs: one is probably whether mass national identity (as opposed to elite self-understanding) is even possible without print, literacy, and mass politics; another is whether continuity from an old ethnie to a modern nation makes the nation itself "old," or just makes it "rooted in something old" — that last one smells partly verbal to me. Somewhere in the document I want them to say which part of the whole arguement is verbal and why, because I suspect a chunk of it is two people using "nation" differently.

  4. For each crux: a concrete kind of evidence or case both would agree bears on it, plus each side's prediction written down in advance so nobody can retro-fit later. Nothing exotic — think ordinary people's letters, diaries, court and inquisition records from before print, showing whether or how far down society any national self-label reached; or pairs of cases where the same kind of invented tradition took root in one country and flopped in the neigboring one, and what predicts which happens.

  Don't give me a reading list — they've both read everything. And don't adjudicate who's right; the point is a document both could sign, with the residual disagreement made exact.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** Two colleagues (Modernist vs. Ethnosymbolist) have been arguing for years about the origins of nations. The user has forced them into an adversarial collaboration.
      *   **Task:** Create a joint statement document.
      *   **Tone:** Academic, precise, collaborative but acknowledging deep disagreement. No adjudication.
      *   **Structure:**
          1.  Numbered section of substantive agreed claims (surprising, not vacuous).
          2.  Table of exact disagreements (phrased neutrally but acceptably to both sides).
          3.  The Cruxes (sub-questions that matter, including identification of verbal disputes).
          4.  Evidence/Predictions (concrete tests for each crux).
      *   **Constraints:** No reading lists. Don't decide who is right. Ensure specific theoretical sensitivities (Hobsbawm/Anderson vs. Anthony Smith) are respected in the wording.

  2.  **Deconstruct the Positions:**
      *   **Modernist (Hobsbawm/Anderson/Gellner):** Nations are modern (late 18th C+). Driven by industrialization, print capitalism, state bureaucracy. Pre-modern identities were religious, dynastic, or local. Calling medieval France a "nation" is anachronistic.
      *   **Ethnosymbolist (Smith/Hastings):** Nationalism is modern, but *nations* (as communities of sentiment) have pre-modern roots (*ethnie*). Myths, symbols, and memories persist. Modern nations are transformations of these older cores, not ex nihilo creations.
      *   **Common Ground:** Both agree nationalism is a dominant modern ideology. Both agree pre-modern people had *some* identity. Both agree definitions matter.
      *   **Friction Points:** Continuity vs. Rupture. The definition of "nation" (subjective feeling vs. objective structure). The role of elites vs. masses.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Substantive agreement, not just "we agree to disagree."
      *   *Idea 1:* The *normative* claim. Both agree the world is now organized by nation-states, regardless of origin.
      *   *Idea 2:* The role of war/state-making. Both agree state coercion matters (Tilly-esque middle ground).
      *   *Idea 3:* The "sleeping beauty" problem. Both agree you can't just wake up a random group and make them a nation; there are constraints.
      *   *Idea 4:* Elite vs. Mass. Both agree early modern elites had different identity markers than peasants, but the *link* is the puzzle.
      *   *Refinement:* Make them sound like joint findings. "The institutionalization of nationalism is irreversible," "Pre-modern identities were not blank slates," "The definition of 'nation' determines the date of origin."

  4.  **Drafting Section 2: Table of Disagreements:**
      *   *Goal:* Precise phrasing that neither will veto.
      *   *Modernist Sensitivity:* Avoid implying "France existed in 1200." Use "precursors" or "cultural material."
      *   *Ethnosymbolist Sensitivity:* Avoid implying "invented out of thin air." Use "constructed" but acknowledge "constraints."
      *   *Key Disagreements:*
          *   Continuity (Rupture vs. Evolution).
          *   Depth (Elite vs. Mass penetration pre-1800).
          *   Necessity (Are pre-modern ethnic ties *necessary* for a nation to form?).
          *   Agency (Engineers vs. Gardeners).

  5.  **Drafting Section 3: The Cruxes:**
      *   *Goal:* Identify the pivot points.
      *   *Crux 1 (Verbal):* Definition of "Nation." Is it a political fact (Modernist) or a cultural sentiment (Ethnosymbolist)? This needs to be explicitly flagged as partly verbal.
      *   *Crux 2 (Empirical):* Mass penetration. Can you have national consciousness without print/mass literacy?
      *   *Crux 3 (Causal):* Necessity of *Ethnie*. Can a nation form without a pre-existing ethnic core (e.g., USA, Brazil vs. Germany, Japan)?
      *   *Requirement:* Explicitly state which part is verbal.

  6.  **Drafting Section 4: Evidence & Predictions:**
      *   *Goal:* Falsifiable tests.
      *   *Test 1 (Mass Penetration):* Inquisition records/peasant diaries.
          *   Modernist Prediction: Language will be local/religious, not national.
          *   Ethnosymbolist Prediction: Language will reference shared destiny/enemies recognizable as national.
      *   *Test 2 (Necessity of Ethnie):* Failed states vs. Successful states.
          *   Modernist Prediction: State institutions alone can forge nationhood (e.g., post-colonial states).
          *   Ethnosymbolist Prediction: Without pre-existing myths, state-building remains fragile/elite-only.
      *   *Test 3 (Invented Tradition):* Comparative cases (e.g., Scotland vs. Ireland, or specific regional movements).
          *   Modernist: Success depends on institutional reach.
          *   Ethnosymbolist: Success depends on resonance with older myths.

  7.  **Review and Refine:**
      *   *Check Tone:* Is it dry enough? Yes.
      *   *Check Constraints:* Did I avoid reading lists? Yes. Did I pick a winner? No.
      *   *Check Specifics:* Did I mention Hobsbawm/Anderson/Smith concepts without name-dropping unnecessarily? (Better to use the concepts).
      *   *Self-Correction on Section 1:* Make sure the agreements aren't too weak. Instead of "Definitions matter," say "The dating of the nation is a function of the definition employed." Instead of "War matters," say "Geopolitical competition acted as a crucible for both models."
      *   *Self-Correction on Section 3:* Ensure the "verbal dispute" is clearly highlighted as requested.
      *   *Self-Correction on Section 4:* Ensure predictions are specific enough to be proven wrong.

  8.  **Final Polish:** Organize with clear headings. Ensure the "Joint Statement" format looks official. (Proceed to generate output based on these thoughts).

  *(Self-Correction during drafting)*: I need to be careful with the "verbal dispute" part. The prompt asks them to say *which part* is verbal. I should make sure that distinction is sharp. The Modernist defines Nation = Political Sovereignty + Mass Culture. The Ethnosymbolist defines Nation = Community of History + Destiny. This is the root verbal clash.

  *(Refining the Disagreement Table)*: Make sure the Modernist doesn't feel like the Ethnosymbolist is sneaking in "primordialism." Use words like "cultural repertoire" instead of "blood." Make sure the Ethnosymbolist doesn't feel like the Modernist is calling it "fake." Use "constructed" carefully.

  *(Refining Evidence)*: The prompt suggests "ordinary people's letters." I should incorporate that specific suggestion into the evidence section to show I listened.

