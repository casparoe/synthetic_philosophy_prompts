prompt: |-
  I'm a graduate TA running discussion sections for a second-year course on rational choice theory. Next week's fifty-minute section covers Newcomb's problem. The students have already worked through expected utility maximization and dominance reasoning, but they have not formally encountered causal versus evidential decision theory, and I want to keep it that way for now — the goal is for them to feel the genuine pull of both the one-boxing and two-boxing arguments before they have labels that let them file the disagreement away. Please don't explain the problem to me; plan how I should teach it.

  Specifically, I'd like the following:

  1. The order the pieces must go in. Which features of the setup — the predictor's accuracy, the timing of the prediction, the fact that box contents are already fixed at choice time, the fact that the students know all of this — have to be nailed down before the dilemma actually bites, and which parts of the standard presentation are load-bearing rather than decoration? Where should I put the moment where the students are asked to commit to what "the predictor is almost never wrong about people like you" obliges them to accept about their own choice?

  2. The carrying example. I'm torn between building the session around the standard black-box version and a variant in which the predictor is explicitly described as something the students might actually face — a copy of the agent that has already deliberated, or a process that observes the agent's earlier behaviour. What must the carrying case have, and lack, for students to be unable to dismiss the dilemma as an artifact of an impossible omniscient predictor? Which variant best serves a section whose real aim is the tension between dominance and expected-payoff reasoning, and why?

  3. The misconception map. My predictions are: (a) that students will reason as if their choice causally determines the already-fixed contents of box B, (b) that students who one-box will treat the payoff structure as a rigged intuition pump and the two-boxers as simply correct, and (c) that many will conclude the case has no bearing on any real decision and stop caring. In roughly what order will these arise, where in the sequence should each be headed off rather than left to fester, and which misconceptions am I missing?

  4. One question I can pose in the final five minutes whose answer would show me whether a student has understood the dilemma rather than merely picked a team — ideally something that separates 'got it' from 'memorized which answer the course prefers'.

  5. What to openly refuse to cover at this level — I'm inclined to keep free will, and the question of what an agent should do upon learning it has been predicted, out of the room entirely — and how to fence those off gracefully without seeming to dodge.

  Constraint: no readings, and please treat the section as self-contained; the students will not have looked at anything beforehand.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** Graduate TA for a 2nd-year Rational Choice Theory course.
      *   **Topic:** Newcomb's Problem.
      *   **Duration:** 50 minutes.
      *   **Student Background:** Know Expected Utility (EU) and Dominance Reasoning. Do *not* know Causal (CDT) vs. Evidential (EDT) Decision Theory labels yet.
      *   **Goal:** Make them *feel* the tension between the two arguments before giving them theoretical labels.
      *   **Constraints:** No readings, self-contained section. Do not explain the problem to the TA (assume knowledge).
      *   **Specific Deliverables:**
          1.  Order of operations (setup features).
          2.  Carrying example (Standard vs. Variant).
          3.  Misconception map (timing and handling).
          4.  Final assessment question.
          5.  Topics to explicitly exclude (fencing off).

  2.  **Deconstruct the Deliverables:**

      *   **1. Order of Operations:**
          *   Need to establish the payoff matrix first (Dominance).
          *   Need to establish the Predictor's reliability (EU).
          *   Crucial tension point: The contents are *fixed* before the choice. This is the load-bearing wall. If students think the choice changes the box, it's magic, not Newcomb.
          *   Commitment point: Ask them to choose *before* explaining why it's hard.
          *   *Sequence:* Payoffs -> Predictor Reliability -> Fixed Contents -> Commitment -> Argument Clash.

      *   **2. Carrying Example:**
          *   *Standard (Omega/Boxes):* Abstract, sci-fi. Easy to dismiss as "magic."
          *   *Variant (Copy/Simulation):* More grounded in computational theory, but might confuse them with identity issues.
          *   *Variant (Behavioral/Psychological):* "We know you so well." Weakens the "fixed" aspect (sounds like correlation, not prediction).
          *   *Decision:* The prompt asks what the case *must have and lack*. It needs to feel *physically impossible to change the past* but *epistemically certain about the future*.
          *   *Recommendation:* Stick close to the standard but ground the predictor. A "perfect simulation" or "neural scan" works better than a magical demon for modern students. It removes "magic" but keeps "causal isolation." Let's suggest a specific framing: The "Neural Scan" variant. It feels scientific enough to be taken seriously but preserves the causal structure.
          *   *Why:* It prevents the "magic" dismissal while keeping the causal structure clean (scan happens *before*, choice happens *now*).

      *   **3. Misconception Map:**
          *   (a) Backward Causation: "My choice changes the box." (Needs immediate correction).
          *   (b) Rigged Game: "Two-boxing is obviously right, this is a trick." (Needs to be validated then challenged).
          *   (c) Irrelevance: "This never happens." (Needs to be saved for the end/reflection).
          *   *Missing:* "The Predictor predicts *because* I choose" (confusing prediction with causation). "I can outsmart the predictor" (free will objection).
          *   *Timing:* Address (a) immediately after setup. Address (b) during the dominance argument. Address (c) during the wrap-up.

      *   **4. Final Question:**
          *   Needs to test understanding of the *structure*, not the *choice*.
          *   Good candidate: A modification of the parameters (e.g., predictor accuracy drops to 60%) or a structural isomorph (Prisoner's Dilemma link?).
          *   Better candidate: Ask them to articulate the *opposing* view's strongest point. "What is the strongest argument for the choice you *didn't* make?"
          *   Best candidate (for Rational Choice context): A parameter tweak that flips the dominance/EU alignment. If accuracy is 51%, EU says one-box, Dominance says two-box. If accuracy is 100%, EU says one-box. If accuracy is 0%...
          *   *Selection:* Ask them to identify the threshold where the arguments diverge. Or, ask them to explain why the Two-Boxer *cannot* accept the One-Boxer's premise without contradiction.
          *   *Refinement:* "If you are a Two-Boxer, what specific claim about the Predictor would force you to switch? If you are a One-Boxer, what claim about Causality would force you to switch?" This tests if they know *why* they chose.

      *   **5. Fencing Off:**
          *   Free Will/Determinism: "We are assuming the choice is yours to make."
          *   Learning the Prediction: "You don't know what's in the box."
          *   How to fence: "Bracketing." Explicitly state these are interesting but outside the scope of *decision rules*.

  3.  **Drafting the Plan (Iterative refinement):**

      *   *Intro (5 mins):* Hook them. Don't define Newcomb yet. Give the scenario.
      *   *The Setup (10 mins):* Careful wording on the Predictor. Use the "Neural Scan" variant. Emphasize *timing*.
      *   *The Vote (5 mins):* Get skin in the game.
      *   *The Clash (20 mins):* Develop the Dominance Argument (Two-Box) then the Expected Utility Argument (One-Box).
      *   *Misconception Management:* Weave this into the Clash.
      *   *Fencing (5 mins):* Explicitly state what we aren't doing.
      *   *Exit Ticket (5 mins):* The diagnostic question.

      *   *Refining the "Order":* The prompt asks specifically about the order of features.
          *   1. Payoffs (make the stakes clear).
          *   2. Predictor Accuracy (make the correlation clear).
          *   3. Causal Isolation (the "fixed" nature).
          *   *Crucial:* If you reveal "Fixed" before "Accuracy," they two-box immediately. If you reveal "Accuracy" before "Fixed," they might think they can influence it.
          *   *Strategy:* Reveal Payoffs -> Reveal Predictor -> Reveal Timing/Fixed Nature -> Ask for Choice.

      *   *Refining the "Example":* The prompt asks what the case must *have and lack*.
          *   *Must Have:* High correlation, causal isolation (choice doesn't affect prediction), common knowledge (everyone knows the rules).
          *   *Must Lack:* Backward causation, ability to inspect the box, ambiguity about prediction timing.
          *   *Recommendation:* Use the "Neural Scan" but keep it abstract enough. Actually, the prompt asks me to choose. I will recommend the **Standard Box** but with a **Scientific Predictor** description. Why? Because "Copy of the agent" introduces identity metaphysics that distracts from decision theory. "Behavioral observation" feels too weak (correlation vs. prediction). The "Neural Scan" implies physical determination without magic.

      *   *Refining Misconceptions:*
          *   (a) Backward Causation: Head off *immediately* after setup.
          *   (b) Rigged/Obvious: Address during the Dominance phase. Validate their intuition, then show the cost.
          *   (c) Irrelevance: Address at the very end.
          *   *Missing:* "The Predictor predicts *based on* my reasoning process" (This is actually true in the problem, but students think this means they can reason differently to trick it). Need to clarify that the prediction is based on the *state* prior to reasoning completion.

      *   *Refining Final Question:*
          *   "Imagine the Predictor is only 60% accurate. Do you switch? Why?"
          *   This forces them to calculate the break-even point. If they understand EU, they know the threshold. If they understand Dominance, they know accuracy doesn't matter.
          *   *Better:* "State the premise your opponent accepts that you reject."

      *   *Refencing Off:*
          *   Free Will: "We are evaluating the decision rule, not the metaphysics."
          *   Opening the Box: "Rule is you must choose without looking."

  4.  **Final Polish:**
      *   Ensure tone is appropriate for a TA (pedagogical, structured, aware of time).
      *   Check against constraints (no readings, 50 mins, no CDT/EDT labels).
      *   Make sure the "Order" section is distinct and clear.
      *   Ensure the "Example" justification is robust.

  5.  **Self-Correction during drafting:**
      *   *Wait,* if I tell them the contents are fixed *before* they vote, they might all two-box immediately because it feels like "the past is done."
      *   *Correction:* I need to present the *reliability* first to build the EU intuition, *then* reveal the *fixed* nature to trigger the Dominance intuition. The tension comes from holding both truths simultaneously.
      *   *Revised Order:* Payoffs -> Predictor Reliability (builds EU case) -> Causal Isolation/Fixed (builds Dominance case) -> Vote.
      *   *Wait, actually:* If I emphasize Reliability first, they One-Box. If I emphasize Fixed first, they Two-Box. The art is presenting them as equally true facts.
      *   *Best Pedagogical Move:* Present the scenario fully. Then ask for the vote. Then unpack the arguments. The "Order" question in the prompt asks about the *setup features*. I need to specify which features must be understood *before* the dilemma bites.
      *   *Key Insight:* The dilemma bites only when they accept *both* that the money is fixed *and* that the prediction is reliable. If they doubt reliability, it's trivial (Two-Box). If they doubt fixedness, it's trivial (One-Box).
      *   *Commitment Point:* Ask them to commit *after* the full setup but *before* the arguments are named.

      *   *Example Choice:* I'll argue for the **Standard Box with a "Neural Scan" Predictor**. The "Copy" variant risks getting bogged down in "Is the copy me?" which is a metaphysical rabbit hole. The "Behavioral" variant risks "Maybe I can act crazy to trick it." The Neural Scan implies the state is determined physically, preserving the causal structure without magic.

      *   *Misconception (a):* Backward causation. This is the biggest killer. Must kill it early.
      *   *Misconception (d) [Missing]:* "I can decide to be the type of person who one-boxes, but then two-box." (The "Cheating" objection). This needs to be addressed as part of the "Fixed" constraint.

      *   *Final Question:* "At what accuracy rate does the Expected Utility argument lose to the Dominance argument?" (Answer: It never does for Dominance, but it does for EU). Actually, better: "What single fact would a Two-Boxer need to deny to become a One-Boxer?" (Answer: That the choice provides evidence about the content).

      *   *Fencing:* Keep it brief. "We are not asking if the prediction is possible. We are asking what to do given it is."

  6.  **Final Review against constraints:**
      *   50 mins? Yes, timing included.
      *   No CDT/EDT labels? Yes, focus on "Dominance" vs "Expected Payoff."
      *   No readings? Yes.
      *   TA tone? Yes.

      *(Self-Correction on Final Question)*: The prompt asks for a question whose answer shows they understood the *dilemma*, not just picked a team.
      *   Option A: "What is the break-even probability?" (Too mathy).
      *   Option B: "Explain the other side." (Good, but standard).
      *   Option C: "If you could pay $1 to know the contents before choosing, would you?" (This tests the value of information vs. causal influence).
      *   *Decision:* The "Value of Information" question is excellent. A Two-Boxer should pay $0 (contents fixed, info doesn't change choice). A One-Boxer might pay (info confirms correlation). Wait, actually, if contents are fixed, info doesn't change the *contents*, but it changes the *choice* for an EU maximizer? No, if contents are fixed, knowing the content makes the decision trivial.
      *   *Better:* "If the Predictor's accuracy dropped to 60%, does your answer change? Why?" This tests if they are relying on the *strength* of the correlation (EU) or the *structure* of the choice (Dominance).

      *   *Let's go with the "Premise Check":* "State the one sentence that your opponent would agree is true, but which you believe does not guide action." This forces them to articulate the conflict.

      *   *Actually, looking at the prompt again:* "Separates 'got it' from 'memorized'."
      *   Let's use a structural variant. "Suppose you choose *before* the Predictor predicts. Does the problem change?" (Yes, becomes trivial). "Suppose the box is transparent?" (Yes, becomes trivial).
      *   *Best:* "Why can't you use Dominance Reasoning if the Predictor is only 51% accurate?" (Because Dominance doesn't care about probability). "Why can't you use Expected Utility if the Predictor is 100% accurate?" (You can, that's the problem).
      *   *Okay, I'll stick with the "Threshold" question.* It forces them to quantify their commitment.

      *(Final Polish on Misconceptions)*: I need to make sure I identify the "Missing" misconception.
      *   Missing: "The Newcomb Problem is just a Prisoner's Dilemma with yourself." (Common confusion).
      *   Missing: "I can signal to the predictor." (Impossible due to timing).

      *   *Okay, ready to write.*
answer: |-
  Here is a lesson plan designed to maximize the tension between the two reasoning styles without invoking the theoretical labels that resolve it.

  ### 1. The Order of Operations
  The dilemma only "bites" when students hold two contradictory intuitions as simultaneously true. If you reveal the features in the wrong order, one intuition will crush the other before the conflict arises.

  **The Critical Sequence:**
  1.  **The Payoffs (Establish Stakes):** Present the matrix first. \$1M vs. \$1K. Make sure they see that Two-Boxing *always* yields +\$1K relative to One-Boxing *given a fixed state of the boxes*.
  2.  **The Predictor's Reliability (Establish Correlation):** Before mentioning *when* the prediction happens, establish that the Predictor is right 99.9% of the time. This primes the Expected Utility intuition (One-Boxing looks like the winning move).
  3.  **The Timing/Causal Isolation (Establish Fixedness):** *This is the load-bearing wall.* Only after they see the value of One-Boxing do you reveal: "The prediction was made yesterday. The money is already in the box or not. Your choice cannot physically move the money." This primes the Dominance intuition (Two-Boxing looks like the rational move).
  4.  **The Commitment:** Ask them to commit to a choice **immediately after Step 3**, before you facilitate the debate. If you wait until after the debate, they will argue for the side that "won" the discussion rather than revealing their pre-theoretical intuition.

  **Why this order?**
  If you emphasize **Fixedness** before **Reliability**, students dismiss the predictor as irrelevant history and Two-Box immediately. If you emphasize **Reliability** before **Fixedness**, students assume their choice influences the prediction (magical thinking) and One-Box without feeling the tension. The dilemma exists only in the gap between "The money is already there" and "Choosing Box B is almost always correlated with \$1M."

  ### 2. The Carrying Example
  **Recommendation:** Use the **Standard Box Setup**, but describe the Predictor as a **"Neural Scan Simulation."**

  **Why not the "Copy" variant?**
  Describing the predictor as a "copy of the agent that has already deliberated" invites metaphysical debates about personal identity ("Is the copy me?") and simulation theory. This distracts from the decision-theoretic structure. Students will get stuck on whether harming the copy harms them, rather than focusing on the payoff matrix.

  **Why not pure "Behavioral Observation"?**
  Describing the predictor as someone who "knows you well" feels too weak. Students will think, "I can act crazy to trick them." This undermines the 99.9% accuracy constraint.

  **Why the "Neural Scan"?**
  *   **What it must have:** It must imply **physical determination without backward causation.** The scan reads the physical state of the brain *prior* to the final volition. It feels scientific enough to be plausible (avoiding the "magic demon" dismissal) but rigid enough to enforce the "fixed contents" constraint.
  *   **What it must lack:** It must lack any mechanism for the agent to **signal** or **inspect**. No talking to the predictor, no looking in the opaque box.
  *   **Pedagogical Value:** This variant best serves the tension because it makes the correlation feel *law-like* (supporting Expected Utility) while making the causal isolation feel *physical* (supporting Dominance). It prevents students from dismissing the predictor as "magic" (which lets them ignore the EU argument) while preventing them from thinking they can "outsmart" the predictor (which lets them ignore the Dominance argument).

  ### 3. The Misconception Map
  Here is the predicted timeline of errors and how to intervene.

  | Time | Misconception | Diagnosis | Intervention Strategy |
  | :--- | :--- | :--- | :--- |
  | **Min 10** | **Backward Causation** (Your #a) | "If I choose One Box, that *makes* the money appear." | **Head off immediately.** When revealing the Timing (Step 3 above), use explicit physical language: "The money was placed yesterday. It is sitting in a vault. Your hand moving now does not send a signal back in time." Write "CAUSAL ISOLATION" on the board. |
  | **Min 20** | **The "Rigged Game"** (Your #b) | "Two-boxing is obviously right; the One-Box argument is just a trick." | **Validate, then isolate.** When the Two-Boxers speak, affirm their logic: "You are correct that given the money is fixed, taking both is always +\$1K." Then ask: "If everyone who reasoned like you ends up with \$1K, and everyone who reasoned like the One-Boxers ends up with \$1M, is your reasoning successful?" Force them to confront the *success rate* of their rule. |
  | **Min 30** | **The "Outsmart" Objection** (Missing) | "I'll decide to One-Box to trick the predictor, then switch to Two-Box at the last second." | **Address during the Setup.** Clarify that the prediction captures the *disposition* to choose. The "choice" in the problem is the final output of that disposition. You cannot change your mind after the scan because the scan predicted the mind-change. |
  | **Min 40** | **Irrelevance** (Your #c) | "This never happens in real life, so it doesn't matter." | **Save for the Wrap-up.** Do not fight this during the debate. Acknowledge it, then pivot: "We aren't studying boxes; we are studying whether *correlation* without *causation* should guide choice. That happens in medicine, economics, and voting." |

  **Missing Misconception to Watch For:**
  *   **The "Common Cause" Confusion:** Students may think the Predictor causes the choice. Clarify that the *prior state of the agent* causes both the Prediction and the Choice. The Prediction does not cause the Choice; they are common effects of the prior state.

  ### 4. The Final Five-Minute Question
  Do not ask them "Which is correct?" Do not ask them "What would you do?" (They can guess what you want to hear).

  **Ask this:**
  > "Imagine the Predictor's accuracy drops from 99.9% to **60%**.
  >
  > 1.  Does the **Dominance Argument** change its recommendation?
  > 2.  Does the **Expected Payoff Argument** change its recommendation?
  > 3.  If your answer to (1) and (2) differs, at what accuracy percentage do *you* personally switch your choice, and **which argument did you abandon to do it?**"

  **Why this works:**
  *   **Memorized/Team-Picker:** Will say "I still Two-Box" or "I still One-Box" without realizing the math has shifted.
  *   **Understands the Dilemma:** Will recognize that Dominance is *independent* of probability (so its recommendation never changes), while Expected Payoff is *dependent* on probability (so its recommendation flips at a specific threshold).
  *   **The "Got It" Marker:** The student who admits, "Dominance still says Two-Box, but EU now says Two-Box, so the conflict disappears," demonstrates they understand the *structure* of the conflict, not just the stakes.

  ### 5. What to Openly Refuse (Fencing Off)
  You must explicitly bracket two topics to keep the section within 50 minutes and on topic. Write these on the side of the board under "Out of Bounds."

  1.  **Free Will / Determinism:**
      *   *The Dodge:* Students will ask, "If the predictor is accurate, do I have a choice?"
      *   *The Fence:* "We are assuming for the sake of this problem that you *can* choose either box. We are analyzing the *rule* you use to choose, not whether the choice is metaphysically free. Assume you have control."
  2.  **Learning the Prediction:**
      *   *The Dodge:* Students will ask, "What if I ask the Predictor what they predicted?"
      *   *The Fence:* "The rules of the game forbid knowing the content or the prediction before you choose. This is a decision problem under uncertainty, not a game of perfect information."

  **Graceful Exit Line:**
  "These are fascinating questions, but they belong to metaphysics and epistemology. Today, we are doing *decision theory*. We are asking: Given these constraints, which calculation method yields the better outcome? Let's keep the focus on the calculation."

  ### Summary Timeline (50 Minutes)
  *   **00-05:** Intro & Payoffs (The Matrix).
  *   **05-10:** The Predictor (Reliability + Neural Scan).
  *   **10-15:** The Constraint (Fixed Contents + Causal Isolation). **Commitment Vote.**
  *   **15-25:** Develop the Two-Box Argument (Dominance). Address "Backward Causation" misconception here.
  *   **25-35:** Develop the One-Box Argument (Expected Payoff). Address "Rigged Game" misconception here.
  *   **35-40:** Synthesis. Why can't we just combine them? (The clash).
  *   **40-45:** Fencing Off (Free Will/Info) & Real World Relevance (Address "Irrelevance").
  *   **45-50:** Final Diagnostic Question & Dismissal.
