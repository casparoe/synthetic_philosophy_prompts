answer: |-
  The practice you describe reveals a methodology that might be termed **Structural Instrumentalism** or **Policy-Dependent Realism**. It is a hybrid stance that navigates between Friedman's "F-twist" (assumptions need not be true, only predictions accurate) and Scientific Realism (assumptions must correspond to reality).

  Here is a reconstruction of the implicit methodology, an assessment of its coherence, an analysis of its philosophical underdetermination, and a contrast with the rival views it excludes.

  ### 1. The Implicit Methodology: Structural Sufficiency
  The practice presupposes that assumptions function not merely as computational shortcuts (as in strict instrumentalism) but as **causal placeholders**. The implicit view is that a model's assumptions must be *structurally sufficient* to capture the transmission mechanisms relevant to the specific policy question at hand.

  In normal times, the falsity of the "representative agent" assumption is treated as a harmless idealization because the aggregate dynamics it produces approximate reality well enough for standard interest-rate smoothing. However, the 2008 crisis revealed that the omitted heterogeneity (financial frictions, balance sheet constraints) was not harmless; it was the very mechanism through which the shock propagated.

  Therefore, the methodology operates on a **threshold of relevance**:
  1.  **General Defense:** Assumptions can be false if they do not alter the *structural invariance* of the model under standard policy perturbations.
  2.  **Specific Repair:** When a prediction failure indicates a broken transmission mechanism (the crisis), the falsity of the assumption is no longer harmless. The assumption must be made more realistic to restore the model's capacity to simulate counterfactuals involving that mechanism.

  This is not a demand that assumptions be *true* in a literal ontological sense, but that they be **credible enough to support counterfactual reasoning**.

  ### 2. Coherence of the Two Halves
  Is this position coherent? **Yes, but only if interpreted through the lens of the Lucas Critique.**

  *   **The Tension:** On the surface, defending false assumptions while simultaneously repairing them for realism looks like hypocrisy. If truth doesn't matter (F-twist), why fix the assumptions? If truth matters (Realism), why admit they are false to begin with?
  *   **The Resolution:** The coherence lies in the distinction between *prediction* and *policy evaluation*.
      *   Pure prediction (forecasting inflation next quarter) can tolerate false assumptions if the statistical correlation holds.
      *   Policy evaluation (what happens if we raise rates during a credit crunch?) requires **structural invariance**. If the assumptions about agent behavior are too false, the model's parameters will shift when policy shifts (the Lucas Critique).
      *   Therefore, the practice is consistent: Institutions defend the falsity of assumptions *instrumentally* (they work for standard forecasting) but repair them *structurally* (to ensure the model remains invariant under non-standard policy stress).

  The "middle position" is thus: **Idealizations are permissible only when their falsity does not compromise the model's causal topology regarding the decision variable.**

  ### 3. Philosophical Underdetermination
  The practice is underdetermined because several distinct philosophies of science could license this exact behavior without agreeing on *why* it is justified.

  *   **Mäki's "Isolation" View:** Uskali Mäki argues models isolate causal factors via unrealistic assumptions. The post-2008 repair isn't about "truth" but about **relevance**. Finance was previously isolated out; the crisis showed it was a relevant factor that needed to be de-isolated. This fits the practice without requiring a commitment to realism.
  *   **Cartwright's "Capacities":** Nancy Cartwright suggests models identify "capacities" of nature. The pre-2008 model failed to identify the capacity of financial sectors to amplify shocks. Adding frictions restores the capacity, not necessarily the "truth" of the representative agent.
  *   **Bayesian Model Updating:** A strict Bayesian need not care about "realism." If the posterior probability of the model structure drops to near zero after 2008, one updates the prior to favor models with financial sectors. The "realism" is merely a heuristic for selecting the new prior; the justification remains purely probabilistic fit.
  *   **Robustness Analysis:** The practice could be justified by Levins' notion of robustness. If multiple models with *different* unrealistic assumptions yield the same result, we trust the result. 2008 showed the result was not robust to the removal of financial frictions, necessitating their inclusion to re-establish robustness.

  ### 4. Rival Views Ruled Out
  By engaging in this specific hybrid practice, central banks quietly rule out two extreme positions:

  *   **Strict Scientific Realism:** A strict realist would demand that the "representative household" be abandoned entirely in favor of Agent-Based Modeling (ABM) with fully heterogeneous agents, regardless of computational cost or forecasting track record. The fact that institutions keep DSGE cores and merely patch them indicates they do not believe literal truth is required, only *sufficient* structural fidelity.
  *   **Pure Curve-Fitting Pragmatism (Radical Instrumentalism):** A pure Friedmanian or empiricist would respond to the 2008 failure by discarding the theoretical structure entirely. They would switch to Vector Autoregressions (VARs) or Machine Learning algorithms that minimize forecast error without regard for "frictions" or "microfoundations." The fact that policymakers insist on adding *theoretically motivated* frictions (e.g., Bernanke-Gertler-Gilchrist financial accelerators) rather than just adding lagged variables to fit the data shows they believe **theoretical assumptions play a justificatory role**. They need to know *why* the model works to trust it under novel policy regimes.

  ### 5. What Full F-Twist Practice Would Look Like
  If central banks adopted Milton Friedman's "The Methodology of Positive Economics" in full consistency, macroeconomic practice would look radically different:

  1.  **Abandonment of Microfoundations:** There would be no need for "representative agents" or "intertemporal optimization." These are assumptions about reality. A pure instrumentalist would not care if agents optimize; they would only care if the equation $Inflation_t = f(Rate_{t-1})$ holds.
  2.  **Model Selection by RMSE Only:** Models would be judged solely on Root Mean Square Error out-of-sample. If a simple Phillips Curve outperforms a complex DSGE model, the DSGE model is discarded. There would be no "repairing" of the DSGE model to make it "more realistic"; if it fails, it dies.
  3.  **No "Financial Frictions" for Realism's Sake:** Frictions would only be added if they statistically improved the fit. There would be no discourse about whether the friction "makes sense" theoretically. If a "sunspot variable" improved inflation forecasting, it would be included without apology.
  4.  **Policy Invariance Ignored:** The Lucas Critique would be treated as a theoretical nuisance rather than a fatal flaw. A pure instrumentalist might argue that even if parameters shift, as long as the model predicts the shift correctly (via reduced-form correlations), the internal structure doesn't matter.

  ### Conclusion
  The current practice of macroeconomic institutions is a **pragmatic structuralism**. It accepts the F-twist as a default license to use simplified models but invokes a realist constraint when the simplification threatens the causal validity of policy counterfactuals. It is a coherent stance if one views the goal of macroeconomics not as *prediction* (where F-twist reigns) but as *policy engineering* (where structural realism is required). However, it remains philosophically unstable, constantly oscillating between claiming the model is "just a tool" and treating its components as "levers of the economy" that must be accurately mapped.
