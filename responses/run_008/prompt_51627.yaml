  *   **Plants/Bacteria:** Generally No (No neurons, no evidence of information integration related to valence).
  *   **AI:** This is a separate bucket. If digital sentience is possible, the numbers could be astronomical, but that relies on "substrate independence" (mind != brain), which is a specific philosophical stance.

  **The "Fanaticism" Objection:** Some philosophers (e.g., William MacAskill) worry that taking these calculations too seriously leads to "fanaticism," where we ignore certain human suffering to chase low-probability, high-scale insect interventions.
  *   **Where they draw the line:** Many who take insect welfare seriously still prioritize humans and vertebrates because the *probability* of their sentience is near 100%, whereas insects are <10%. They use a "threshold" view: act on high-probability suffering first.

  **Settled vs. Contested:**
  *   **Settled:** There is no consensus on a "cutoff" for moral consideration.
  *   **Contested:** Whether the presence of a nervous system is the necessary condition for sentience. Whether we should prioritize high-probability/low-scale (humans) over low-probability/high-scale (insects).

  ### 4. Practical Upshots: What does this actually tell us to do?

  This is the most important section for your readers. There is a massive gap between "insects matter morally" and "stop swatting mosquitoes."

  **Individual Action (Swatting/Bug Spray):**
  *   **Consensus:** Almost no one argues you should let malaria-carrying mosquitoes bite you or let termites eat your house. The "self-defense" and "property" exceptions usually swallow the individual rule.
  *   **Nuance:** Some argue for "humane killing" (freezing vs. smashing) if you must kill, but this is fringe.

  **Systemic Action (Agriculture/Pesticides):**
  *   **The Big One:** This is where the numbers actually bite. Industrial agriculture kills orders of magnitude more insects than livestock farming or backyard swatting.
  *   **The Dilemma:** If insects matter, **crop farming is potentially more harmful than animal farming** in terms of raw death counts (field mice + insects vs. cows). This complicates the "eat plants to save animals" narrative.
  *   **Recommendation:** The most common policy recommendation from this crowd is not "stop eating," but "fund research into pest reduction" (e.g., gene drives to reduce pest populations without suffering, or better barriers to keep insects out of fields).

  **Research:**
  *   **Consensus:** The single most agreed-upon action is **fund more research**. We are making moral decisions in the dark. Knowing if insects feel pain is a high-value scientific question regardless of the ethical outcome.

  **Settled vs. Contested:**
  *   **Settled:** Agriculture kills more insects than livestock production.
  *   **Contested:** Whether crop deaths count as "moral harms" (is it suffering if they are killed instantly by a harvester?) vs. pesticide suffering (slow death). Whether we should prioritize reducing insect populations vs. improving their welfare.

  ### Summary Checklist for your Fact-Checkers

  To keep your editors happy, here is a cheat sheet for flagging claims in your draft:

  | Claim | Status | Why? |
  | :--- | :--- | :--- |
  | "There are 10 quintillion insects." | **Settled Estimate** | Based on peer-reviewed biomass studies (e.g., Bar-On et al.), though margins of error exist. |
  | "Insects feel pain." | **Contested** | Evidence is mixed. Nociception is proven; subjective suffering is inferred. |
  | "We should use Expected Value." | **Philosophical Choice** | This is a Utilitarian/Consequentialist framework, not a scientific fact. |
  | "Insect suffering outweighs human suffering." | **Contested Conclusion** | Depends on accepting EV, the population numbers, *and* the sentience probability. |
  | "Veganism kills more insects." | **Empirically True / Ethically Complex** | Crop production kills more bugs, but livestock eats crops too. Net impact is debated. |
  | "We should stop swatting flies." | **Not Recommended** | Even proponents usually allow for hygiene/self-defense exceptions. |

  ### One Framing Warning

  Be careful not to frame this as "Scientists say insects feel pain."
  **Better framing:** "Scientists say we don't know if insects feel pain, but philosophers say the risk is too big to ignore given the numbers."

  Keep the agency on the *ethicists* for the moral weight, and on the *biologists* for the uncertainty. If you merge those, you will get pushback from both sides.

  Good luck with the piece. It's a strong angle.
