      *   *Machine Advantage:* In the machine case, the two histories are *decoupled* and *observable*. We can see the engineers selecting for X, and the device adapting to Y. In biology, we infer the history. In machines, we *know* the history, which makes the philosophical ambiguity more stark. It isolates the variables.
      *   *Argument:* The machine case isn't just an illustration; it's a *controlled experiment* in teleology. It separates the "designer's intent" (often smuggled in as 'function') from the "causal history." It forces the philosopher to choose: is content fixed at manufacture (design) or at runtime (adaptation)? Biology blurs this; machines sharpen it.
