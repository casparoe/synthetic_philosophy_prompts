answer: |-
  This is a classic debate in meta-ethics (the "problem of moral testimony"), and your roommate is channeling a position often associated with philosophers like Sarah McGrath or Richard Moran. Her argument is intuitive, but your hesitation is philosophically warranted.

  The medical analogy is seductive because it treats morality like a **technical problem** rather than a **practical agency problem**.

  Here is the audit of her analogy, the breakdown of where it fractures, and a better model you can use on Friday.

  ### 1. The Map: How the Analogy is Supposed to Work
  Your roommate is arguing for an **Isomorphism** (a one-to-one correspondence) between Medical Deference and Moral Deference. Here is the mapping she is relying on:

  | Medical Domain | Moral Domain (Her View) |
  | :--- | :--- |
  | **The Patient** | The Moral Agent (You) |
  | **The Doctor** | The Professional Ethicist |
  | **The Illness** | The Moral Dilemma (e.g., Is euthanasia permissible?) |
  | **The Diagnosis** | The Moral Verdict (Right vs. Wrong) |
  | **The Prescription** | The Action/Policy to undertake |
  | **Health Outcome** | Moral Goodness / Right Action |
  | **Malpractice** | Moral Harm / Blameworthiness |
  | **Blind Deference** | Rational Humility |

  **Her Logic:** Just as you lack the biological knowledge to prescribe statins, you lack the philosophical training to resolve the trolley problem. Therefore, taking the ethicist's word is the only rational move.

  ### 2. The Break: Where the Mapping Collapses
  You suspected **feedback loops** and **expert agreement** were the weak points. You are right. Here are the three critical disanalogies that break the analogy.

  #### A. The Verification Gap (The Feedback Loop)
  *   **Medicine:** There is a mind-independent reality. If the doctor prescribes statins, we can run blood work in three months. If your LDL goes down, the doctor was right. If it goes up, they were wrong. There is an external feedback loop that verifies expertise.
  *   **Ethics:** There is no "moral blood test." If an ethicist says "euthanasia is permissible," and you do it, there is no meter that beeps to confirm you achieved "moral health."
  *   **The Break:** In medicine, deference works because the *outcome* is separable from the *advice*. In ethics, the "truth" is often constitutive of the reasoning process itself. You cannot verify the expert is right without doing the reasoning yourself, which defeats the purpose of deference.

  #### B. The Consensus Gap (Expert Agreement)
  *   **Medicine:** If you go to five cardiologists about high cholesterol, four will prescribe statins and lifestyle changes. There is a high degree of convergence on *instrumental* goals (health).
  *   **Ethics:** If you go to five bioethicists about euthanasia, you will get five different answers based on their normative framework (Utilitarian, Kantian, Virtue Ethics, Religious, Libertarian).
  *   **The Break:** Deference requires a unified "expert class." Since ethicists disagree fundamentally on first principles, "deferring to an ethicist" just means "deferring to *my favorite* ethicist." That isn't expertise; that's cherry-picking.

  #### C. The Agency Gap (Moral Worth)
  *   **Medicine:** The goal is *health*. It does not matter if you understand *why* the pill works, only that you swallow it. The value is in the biological outcome.
  *   **Ethics:** The goal is *living well* or *acting rightly*. Most philosophical traditions argue that moral worth requires **understanding**. If you don't kill someone only because a professor told you not to, you aren't "virtuous"; you're just obedient.
  *   **The Break:** In medicine, blind compliance is a virtue (patient compliance). In ethics, blind compliance is a vice (heteronomy). You cannot outsource your conscience because the *reason* you act is part of the moral act itself.

  ### 3. Verdict: Does the Conclusion Survive?
  **No.** The conclusion ("we should defer to professional ethicists") is entirely dependent on the analogy holding.

  Once you introduce the disanalogies:
  1.  We can't verify they are right (Feedback Loop).
  2.  They don't agree with each other (Consensus).
  3.  Blindly following them strips the action of moral worth (Agency).

  ...the imperative to defer collapses. It shifts from **"Deference"** to **"Consultation."** You should listen to ethicists to understand the arguments, spot fallacies, and learn the history of the debate, but you must render the verdict yourself.

  **The "Winning" Line for Friday:**
  > "If I take your statin analogy seriously, it proves too much. If I should defer on euthanasia because I'm not an expert, I should also defer on voting, charity, and war. But morality isn't a technical skill like surgery; it's a capacity for reasoning. Treating it like surgery turns me into a robot, not a moral agent."

  ### 4. A Better Analogy: The "Logic Coach" or "Writing Tutor"
  If the Doctor analogy is the wrong tool, what is the right one? You want an analogy that preserves **expertise** without demanding **deference**.

  **The Better Comparison: A Writing Coach or Logic Tutor.**

  *   **How it works:** You hire a writing coach to help you write your novel.
  *   **The Expertise:** They know grammar, structure, pacing, and tropes better than you. They can spot a plot hole you missed.
  *   **The Limit:** They cannot *write the novel for you*. If they do, it's not your novel. Furthermore, they can't tell you what the story *should be about*. That is your creative agency.
  *   **The Application:** Ethicists are **Moral Coaches**. They can tell you, "Hey, that argument you made is inconsistent," or "Have you considered this counter-example?" They improve the *quality* of your reasoning. But they cannot hand you the conclusion and say, "Sign here."

  **Why this wins:**
  It acknowledges their expertise (you *should* listen to them) without surrendering your autonomy (you *must* decide). It frames the ethicist as someone who sharpens your sword, not someone who fights the battle for you.

  ### Summary Strategy for Friday
  1.  **Validate:** Start by admitting the doctor analogy is strong on *complexity*. (Yes, ethics is hard, just like medicine).
  2.  **Pivot:** Hit the **Consensus** point hard. "If I ask three doctors about statins, I get one answer. If I ask three ethicists about euthanasia, I get four. Who do I defer to?"
  3.  **Reframe:** Introduce the **Writing Coach** analogy. "I don't hire a coach to write my book for me; I hire them so *I* can write it better. Ethicists are there to help me think, not to think for me."
  4.  **Close:** "Blindly following a doctor saves my life. Blindly following an ethicist saves me the trouble of thinking, but kills my moral agency."

  Good luck. You've got the stronger philosophical position here.
