      *   **The Big Tension:** (1) & (3) vs. (2), (4), & (5).
          *   If groups are just individuals (1), and only individuals are agents (3), how can the *club* owe an apology (4) distinct from members? How can the *committee* reject someone distinct from members voting (5)? How can "we" intend (2) if there's no group mind (1)?
      *   **The Nuance:** Reductionism doesn't necessarily eliminate collective predicates, but it restricts *what* can bear them. The user seems to want to have their reductionist cake and eat their collectivist pudding.

  4.  **Pairwise Analysis (Drafting the Tensions):**

