answer: |-
  Here is a specification document designed for your students, followed by an instructor's commentary that addresses the tensions, the "killer" criterion, and the scorecard you requested.

  ***

  # Module Specification: Criteria for Adequacy in Two-Envelope Resolutions

  **Objective:** To evaluate proposed resolutions of the Two-Envelope Paradox not by their popularity, but by their ability to satisfy a rigorous set of philosophical and mathematical desiderata.

  **Instruction:** A resolution is not adequate merely if it tells you what to do. It must explain *why* the naive reasoning fails, *when* it fails, and *what* implies the failure. Use the following criteria to assess any account of the paradox.

  ## Part I: Non-Negotiable Desiderata
  *Any resolution failing these conditions is incomplete.*

  **D1. Diagnostic Precision (The Fallacy Location)**
  The resolution must identify the specific step in the $5/4$ expected-value derivation that is invalid in the standard case.
  *   *Requirement:* It is insufficient to say "the conclusion is false." The resolution must isolate whether the error lies in the algebra, the treatment of random variables, the assumption of independence, or the probabilistic priors.
  *   *Rationale:* A resolution that denies the conclusion without locating the fallacious step has not earned its keep; it merely asserts dogma.

  **D2. Ex-Ante / Ex-Post Consistency**
  The resolution must reconcile the symmetry of the setup with the conditional recommendation (if any).
  *   *Requirement:* If the envelopes are indistinguishable before opening (ex-ante), the expected value of switching must be zero *unless* the resolution explains why opening the envelope breaks the symmetry (ex-post).
  *   *Rationale:* We cannot simultaneously hold that the envelopes are symmetric (so switching is neutral) and that switching is strictly dominant conditional on any observation (so switching is positive), without explaining the mechanism of the break.

  **D3. The Sealed vs. Opened Distinction**
  The resolution must explicitly state whether the paradox persists if the envelope remains sealed.
  *   *Requirement:* It must clarify if the error depends on conditioning on a specific value $x$ (opened) or if it infects the unconditional expectation (sealed).
  *   *Rationale:* Many resolutions dissolve the opened case but leave the sealed case paradoxical, or vice versa. An adequate theory must cover the decision problem in both states.

  **D4. Handling of Infinite Expectations**
  The resolution must state its stance on cases where the expected value of the envelopes is undefined or infinite.
  *   *Requirement:* It must address whether standard Expected Utility (EU) theory applies when integrals/sums diverge, and if not, what decision rule replaces it.
  *   *Rationale:* Hard cases (see Part III) often rely on infinite expectations to generate contradictions between ex-ante symmetry and ex-post preference. Ignoring this renders the resolution fragile.

  ## Part II: Camp Preferences (Negotiable)
  *These distinguish families of solutions. A resolution need not satisfy all, but must declare which it prioritizes.*

  **P1. Normative Aim (Action vs. Theory)**
  *   *Option A (Action Guidance):* The primary goal is to tell the agent what to do (Switch, Stick, or Indifferent).
  *   *Option B (Theoretical Consistency):* The primary goal is to save Expected Utility theory from contradiction, even if action guidance remains indeterminate in edge cases.
  *   *Option C (Psychological Diagnosis):* The primary goal is to explain why human intuition finds the $5/4$ argument compelling, regardless of the mathematical formalism.

  **P2. The Status of Improper Priors**
  *   *Option A (Strict Bayesianism):* Only normalisable (proper) probability distributions are admissible. Improper priors are mathematical fictions.
  *   *Option B (Permissive Bayesianism):* Improper priors are admissible representations of ignorance. If the math works, the recommendation stands.

  ## Part III: Hard Case Stress Tests
  *A resolution must explicitly state its verdict on the following two scenarios.*

  **Case A: The "Always Stick" Distribution (Proper Prior)**
  *Setup:* A proper probability distribution over pairs $(2^n, 2^{n+1})$ such that conditional on seeing any amount $x$, the other envelope has expected value $< x$ (e.g., $7/8 x$).
  *   *Test:* Does the resolution explain how ex-ante indifference (symmetry) is compatible with ex-post strict preference for sticking?
  *   *Pass Condition:* Must identify if this is a genuine counterexample to dominance reasoning or an artifact of infinite expectations violating the Law of Total Expectation.

  **Case B: The "Always Switch" Distribution (Improper Prior)**
  *Setup:* A uniform distribution over powers of two (improper prior) such that conditional on any $x$, the other envelope has expected value $> x$ (the $5/4$ argument holds).
  *   *Test:* Does the resolution declare the $5/4$ argument valid here?
  *   *Pass Condition:* If it declares it valid, it must explain why this does not contradict D2 (Ex-Ante Consistency). If it declares it invalid, it must explain why the math fails despite the prior being defined to make it work.

  ***

  # Instructor's Commentary & Analysis

  ### 1. Flagged Tensions and Incompatibilities
  You suspected a tension between locating a fallacy and endorsing switching in the improper-prior case. You are correct. This is the central philosophical fault line.

  *   **Tension:** **D1 (Diagnostic Precision)** vs. **Case B (Improper Prior)**.
      *   If a resolution claims the $5/4$ argument contains a *logical* fallacy (e.g., "you cannot treat $A$ as constant and variable"), it should be invalid in Case B as well.
      *   However, in Case B (improper prior), the conditional probability $P(\text{Other}=2A | A=x) = 0.5$ is *true by definition* of the prior. The arithmetic $0.5(2x) + 0.5(x/2) = 1.25x$ is correct.
      *   **Conflict:** A resolution cannot simultaneously claim "The $5/4$ step is logically invalid" and "Switching is rational in Case B."
      *   **Resolution:** Adequate accounts must shift the blame from *logic* to *domain*. The fallacy is not in the algebra, but in assuming a proper prior exists that satisfies the $5/4$ condition everywhere. In Case B, no proper prior exists. Thus, the "fallacy" is the implicit assumption of a proper prior in the standard paradox statement.

  ### 2. The "Killer" Criterion
  The single requirement that eliminates the most standard resolutions is **D2 (Ex-Ante / Ex-Post Consistency)**, specifically when combined with **D4 (Infinite Expectations)**.

  *   **Why it kills standard fixes:**
      *   *The "Variable Confusion" Fix:* (Claiming $A$ is used as a constant and a variable). This fails D2 because it doesn't explain why the symmetry breaks in Case A (Always Stick). If it's just a variable error, why does the distribution change the recommendation?
      *   *The "Bounded Utility" Fix:* (Claiming utility is bounded, so large amounts don't matter). This solves the infinite expectation issue but fails D1. It doesn't locate the fallacy in the *probability* reasoning; it changes the *value* function. It solves the paradox by changing the problem.
      *   *The "Simple Bayesian" Fix:* (Claiming you need a prior). This handles Case A well but often struggles with Case B without invoking P2 (Status of Improper Priors). If they reject improper priors, they must explain why the agent in Case B is irrational to switch, despite the math holding.

  **D2 forces the student to confront the fact that in Case A (Proper Prior, Infinite Mean), Ex-Ante Symmetry ($E[Switch]=0$) and Ex-Post Asymmetry ($E[Switch|X] < 0$) can coexist *only* because the Law of Total Expectation fails for infinite sums.** Most second-year students assume $E[E[Y|X]] = E[Y]$ is a logical truth; this criterion forces them to see it as a theorem with convergence conditions.

  ### 3. Scorecard of Familiar Fixes

  | Resolution Strategy | D1 (Fallacy) | D2 (Consistency) | D3 (Sealed/Open) | D4 (Infinite) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **"Variable Confusion"**<br>*(A is fixed vs. random)* | **Pass**<br>(Identifies equivocation) | **Fail**<br>(Doesn't explain distributional sensitivity) | **Fail**<br>(Often ignores sealed case) | **Fail**<br>(Ignores convergence) | **Superficial.** Good for intro, fails hard cases. |
  | **"Bounded Utility"**<br>*(Marginal utility decreases)* | **Fail**<br>(Changes utility, not logic) | **Pass**<br>(Symmetry restored via bounds) | **Pass** | **Pass**<br>(Eliminates infinity) | **Evasion.** Solves paradox by forbidding the setup. |
  | **"Bayesian Prior"**<br>*(No prior supports 5/4 everywhere)* | **Pass**<br>(Identifies impossible prior) | **Pass**<br>(Explains symmetry break via posterior) | **Pass** | **Mixed**<br>(Depends on P2 stance) | **Strong.** Best for standard decision theory. |
  | **"Decision Theory Limit"**<br>*(EU undefined for infinite mean)* | **Pass**<br>(Identifies domain error) | **Pass**<br>(No EU means no preference) | **Pass** | **Pass**<br>(Central focus) | **Robust.** Handles Case A & B by suspending judgment. |
  | **"Improper Prior Validity"**<br>*(Case B is real)* | **Fail**<br>(Claims 5/4 is valid there) | **Fail**<br>(Accepts ex-ante/ex-post conflict) | **Pass** | **Pass** | **Radical.** Accepts paradox as feature, not bug. |

  ### 4. Note on Case A (The "Always Stick" Distribution)
  *Instructor Note:* You should verify the mathematics of Case A with your students. The distribution provided in the prompt ($P \propto (1/3)^n$) actually yields a *finite* expectation ($E=2$). If the expectation is finite, Ex-Ante Symmetry and Ex-Post "Always Stick" are mathematically contradictory (via Law of Total Expectation).
  *   **Pedagogical Opportunity:** Use this. Ask the students to calculate the mean. When they find it is finite, ask them how "Always Stick" is possible.
  *   **Correction:** To make Case A work as a paradox, the tail must be heavier (e.g., $P \propto (1/2)^n$), rendering the expectation *infinite*.
  *   **Specification Adjustment:** If you use the prompt's numbers, the "Pass Condition" for Case A in the specification should be: *"Must identify that the provided distribution yields a finite expectation and therefore the 'Always Stick' conclusion is mathematically impossible under symmetry, OR adjust the distribution to show how infinite expectation permits the contradiction."* This turns a potential error into a rigorous test of their calculus.

  ### 5. Summary for the Tutorial
  The goal of this specification is to move students from "Which answer is right?" to "What constraints must a right answer satisfy?"
  *   If they choose **Bayesian Prior**, they must defend **P2** (why improper priors are banned).
  *   If they choose **Decision Theory Limit**, they must accept that rational agents sometimes have no defined preference.
  *   If they choose **Variable Confusion**, they must explain why the paradox survives in the sealed envelope case (where $A$ is clearly a random variable).

  By forcing them to score the resolutions against **D2 (Consistency)** and **D4 (Infinity)**, you prevent them from hiding behind semantic tricks.
