  # JOINT STATEMENT ON THE DIACHRONIC IDENTITY OF THE REVISED DETECTIVE

  **Issued by:** The Continuity Camp & The Conventionalist Camp  
  **Subject:** Ontological Status of the Ghostwritten Series  
  **Date:** October 26, 2023

  Following a year of adversarial collaboration regarding the proposed continuation of the Detective Series by a new author, the undersigned camps submit this joint statement. We acknowledge that while our metaphysical commitments differ, we share a commitment to clarity regarding the nature of fictional artifacts. We agree on the structural parameters of the problem but diverge on the conditions required for identity preservation.

  ### I. AGREED CLAIMS

  Both camps endorse the following five propositions as the baseline for further discourse:

  1.  **Abstract Artifact Status:** The Detective is an abstract artifact created by human intention, not a concrete physical object nor a Platonic form existing independent of creation.
  2.  **Validity of the Analogy:** The "Ship of Theseus" paradox provides a structurally valid model for analyzing the revision history of the Detective, wherein traits (planks) have been replaced incrementally over time (voyages).
  3.  **The Limit Case:** The current manuscript shares zero semantic or syntactic identity with the first draft; therefore, qualitative similarity alone cannot ground the claim that the character remains the "same."
  4.  **Distinction of Authority:** The Publisher's legal right to commission new work is distinct from the ontological question of whether that new work features the *same* character.
  5.  **Rejection of Essentialism:** Neither camp argues that the Detective possesses a magical, immutable "soul" or essence that survives revision independent of textual or historical relations.

  ### II. POINTS OF RESIDUAL DISAGREEMENT

  The following table outlines the precise points of divergence. Each position is phrased to be endorsable by its respective camp without concession. The "Test Case" describes a concrete scenario both sides agree is decisive for the crux, with "Advance Predictions" recording how each camp interprets the outcome.

  | Crux | Continuity Camp Position | Conventionalist Camp Position | Test Case & Advance Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. The "Keel" of Origin**<br>*(Does identity require a persistent causal anchor?)* | Identity is preserved by an unbroken causal chain of revision originating in the first draft, even if no original traits survive. The unpublished first draft acts as the "keel" that grounds the ship, regardless of visibility. | Identity is not anchored by a hidden historical origin but by the continuity of recognized conventions. If the causal chain produces a result indistinguishable from a new creation, the origin is irrelevant. | **Case: The Lost Manuscript.**<br>The original author dies. A twin, who never saw the drafts but intuitively writes a sequel identical in style to the *current* version, claims authorship. The original drafts are lost forever.<br><br>**Continuity Prediction:** The twin's work is a *new* character; the original chain is broken.<br>**Conventionalist Prediction:** The twin's work is the *same* character; reader recognition sustains the convention. |
  | **2. The Role of Uptake**<br>*(Does reader acceptance constitute identity?)* | Reader uptake *tracks* identity but does not *constitute* it. Readers can be mistaken about whether a character is the same; their rejection does not ontologically sever the causal chain. | Reader uptake *constitutes* identity within the practice of fiction. If the community of readers rejects the ghostwriter as "not the real Detective," then, for the purposes of the series, the character has ceased to exist. | **Case: The Boycott.**<br>The Publisher authorizes the ghostwriter. The text is causally linked to the original drafts. However, 95% of readers reject the new books as "fan fiction" and refuse to canonize them.<br><br>**Continuity Prediction:** The character is the *same*, but the series is commercially failed.<br>**Conventionalist Prediction:** The character is *different* (or dead); the practice has split into two distinct conventions. |

  ### III. CONCLUSION ON VERBAL DISPUTE

  We conclude that a portion of this dispute is **merely verbal**, specifically regarding the definition of the predicate "is the same character."

  *   **Why it is verbal:** When the Continuity Camp says "same," they refer to *historical causal continuity* (genealogy). When the Conventionalist Camp says "same," they refer to *functional equivalence within a social practice* (taxonomy). Both sides agree on all the physical and historical facts (the drafts were revised, the publisher authorized a new author, readers may object). They disagree only on which of these facts licenses the label "same."
  *   **Why it is substantive:** Despite the verbal nature of the label, the disagreement has non-verbal consequences. It determines how we assign moral rights (who deserves credit), economic rights (royalty structures for "original" vs. "derivative" work), and archival practices (how libraries catalogue the texts).

  Therefore, while we cannot agree on a single definition of identity, we agree that the Publisher's decision should explicitly state which criterion (genealogy or convention) they are privileging for the purpose of marketing and canon, thereby resolving the practical ambiguity even if the metaphysical one remains.

  ***

  **Signed,**  
  *The Continuity Camp*  
  *The Conventionalist Camp*
