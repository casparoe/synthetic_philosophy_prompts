answer: |-
  # Specification of Fairness Desiderata for Nurse-Visit Allocation Model

  ## 1. Desiderata Specification

  The following requirements define the adequacy of the model. They are distinguished by whether they constrain the **scores** (the probability outputs) or the **decisions** (the allocation thresholds/ranking).

  | ID | Requirement | Type | Status | Rationale |
  | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **Within-Group Calibration** | Score | **Non-negotiable** | Clinical staff interpret a score of $p$ as a probability $p$. If $P(Y=1 \mid S=p, \text{Group}=A) \neq P(Y=1 \mid S=p, \text{Group}=B)$, clinicians will lose trust or inadvertently prioritize one group over another based on mistrust of the number. |
  | **D2** | **Equality of False Negative Rates** | Decision | **Preference** | The primary harm is a missed visit for a deteriorating patient (False Negative). We prefer $P(\text{Flag}=0 \mid Y=1, A) = P(\text{Flag}=0 \mid Y=1, B)$. However, this is mathematically incompatible with D1 if base rates differ (see Tensions). |
  | **D3** | **Construct Validity (Label Correction)** | Data/Target | **Non-negotiable** | Thirty-day readmission is a proxy for health deterioration that is confounded by access to care. A model calibrated to readmission may systematically under-prioritize groups with barriers to hospital access. The target must be adjusted to reflect *need*, not just *utilization*. |
  | **D4** | **Selection Bias Correction** | Data/Training | **Non-negotiable** | Outcomes ($Y$) are only observed for patients flagged by the legacy program. Training on observed $Y$ learns the legacy program's biases, not patient risk. The model must account for Missing Not At Random (MNAR) outcomes. |
  | **D5** | **Causal Targeting (Benefit Estimation)** | Objective | **Non-negotiable** | The intervention (nurse visit) reduces readmission risk. A "high risk" score should identify patients who will deteriorate *without* the visit ($Y(0)$), not those who will deteriorate *with* it. We must target heterogeneous treatment effects, not just raw risk. |

  ## 2. Incompatibility Analysis

  You requested an identification of jointly unsatisfiable subsets. We must confront the mathematical limits imposed by base rate differences, compounded by the data and causal realities of this setting.

  ### The Classic Tension: Calibration vs. Error Rates (D1 vs. D2)
  **The Conflict:** If Group A and Group B have different base rates of the target outcome (e.g., Group A has higher underlying health deterioration), you cannot simultaneously satisfy **Within-Group Calibration (D1)** and **Equality of False Negative Rates (D2)**.
  **In This Setting:**
  *   Assume the model is perfectly calibrated. For a given risk threshold $t$, we flag all patients with Score $> t$.
  *   If Group A has a higher base rate of deterioration, the density of scores for Group A is shifted right relative to Group B.
  *   At threshold $t$, Group A will have a higher True Positive Rate (lower False Negative Rate) than Group B.
  *   To equalize the False Negative Rates (D2), you must lower the threshold for Group B.
  *   Once you lower the threshold for Group B, the average risk of the flagged Group B patients drops below the average risk of the flagged Group A patients. The scores are no longer calibrated to the same decision risk across groups.
  *   **Verdict:** You must trade D2 to keep D1. Since clinical trust (D1) is the prerequisite for deployment, D2 becomes a preference to be monitored, not a hard constraint.

  ### The Proxy Layer: Calibration to What? (D1 vs. D3)
  **The Conflict:** D1 requires calibration to the outcome. D3 states the observed outcome (readmission) is a biased proxy for the true outcome (deterioration).
  **In This Setting:**
  *   If you satisfy D1 against *observed readmissions*, you satisfy "Calibration to Bias." Groups with poor access to care will appear lower risk.
  *   If you satisfy D1 against *true deterioration* (per D3), you cannot verify it using historical data without strong assumptions.
  *   **Verdict:** D3 overrides D1's definition of $Y$. We must calibrate to an *adjusted* label. This does not resolve the D1/D2 tension, but it shifts the "Base Rate" to the *corrected* base rate of need. If corrected need still differs by group, the D1/D2 impossibility remains.

  ### The Selective Layer: The Visibility Problem (D1/D2 vs. D4)
  **The Conflict:** D1 and D2 require calculating error rates and calibration statistics. D4 states outcomes are missing for the majority of patients (those not flagged by the legacy system).
  **In This Setting:**
  *   You cannot empirically verify D1 or D2 on the full population. You can only verify them on the subset previously visited.
  *   If the legacy program was biased (e.g., under-visited Group B), your verification data for Group B is sparse and non-representative.
  *   **Verdict:** D4 makes D1 and D2 *unverifiable* without causal assumptions (e.g., inverse propensity weighting). This increases the variance of your fairness metrics, making strict enforcement of D2 statistically unsafe.

  ### The Causal Layer: The Intervention Paradox (D1 vs. D5)
  **The Conflict:** D1 requires the score to predict the outcome. D5 states the intervention changes the outcome.
  **In This Setting:**
  *   If a patient receives a visit (because of a high score), their readmission risk drops.
  *   If you check calibration on *observed* readmissions for flagged patients, high scores will look *miscalibrated* (predicted 30%, observed 10%) because the intervention worked.
  *   **Verdict:** D1 must be defined as calibration to **$P(Y(1)=0 \mid X)$** (risk *without* intervention). You cannot use observed outcomes of treated patients to validate D1. You must rely on control group data or causal estimation, which again reduces the effective sample size for validation.

  ## 3. The Verdict: The Single Eliminating Requirement

  The single requirement that eliminates the most candidate criteria is **D1: Within-Group Calibration**.

  **Why:**
  1.  **Mathematical Exclusion:** Insisting on D1, given different base rates of need (which will persist even after D3 correction), mathematically eliminates **D2 (Equality of Error Rates)**. You cannot have both. By marking D1 non-negotiable, D2 is automatically demoted. This eliminates all fairness criteria relying on Equalized Odds or Demographic Parity that do not allow for calibration trade-offs.
  2.  **Operational Exclusion:** Insisting on D1 in a causal setting (D5) eliminates all standard supervised learning loss functions. You cannot simply minimize log-loss on observed $Y$. You must minimize loss on estimated counterfactuals $Y(0)$. This eliminates off-the-shelf classifiers and requires causal inference machinery (e.g., T-learners, propensity weighting).
  3.  **Verification Exclusion:** Combined with D4 (Selective Labels), insisting on D1 eliminates any validation strategy that relies on simple hold-out sets of observed data.

  **What Remains:**
  If we insist on **Within-Group Calibration (to Counterfactual Risk)**:
  *   **We accept:** Disparate False Negative Rates across groups as a mathematical necessity of differing base rates of need.
  *   **We deploy:** A ranking model where the score represents "Probability of Deterioration Without Visit."
  *   **We mitigate:** Fairness is managed not by constraining the *scores* (which must remain truthful), but by adjusting the *allocation policy*. For example, if Group B has lower base risk but we wish to prioritize them for equity, we apply a group-specific threshold or weight to the ranking, explicitly acknowledging we are trading pure efficiency for equity, rather than hiding it inside a miscalibrated model.
  *   **We validate:** Using causal validation techniques (e.g., checking calibration on the unvisited control population only), accepting higher uncertainty in the fairness metrics due to D4.

  **Final Instruction:** Do not attempt to force Error Rate Parity (D2) by distorting the scores. It will break clinical trust (D1) and hide the true base rate differences. Optimize for D1, D3, D4, and D5. Monitor D2. If D2 disparities are deemed ethically unacceptable, adjust the **decision threshold** per group, but document that this constitutes a policy override of the risk score, not a property of the risk score itself.
