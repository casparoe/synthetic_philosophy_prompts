prompt: |-
  I am a high school senior in a philosophy elective, and I have been assigned to run our class's next seminar session. The topic I drew is the compatibilist idea that free will is not about whether our actions are caused, but about a certain structure among our desires — specifically the "hierarchy" view associated with the philosopher Harry Frankfurt, built on second-order desires (desires about which of our desires we act on). I have to present for about twenty-five minutes to a class of students who mostly arrived at the course thinking the free will debate is just "science says the brain is atoms, so free will is an illusion, end of story."

  Please do not write the explanation itself. What I need is a teaching plan, and you should prepare it carefully as an experienced philosophy teacher who has taught this material many times and knows exactly where it goes wrong. Before you draft anything, take a moment to reason through the dependency structure of the ideas — what has to be established first for later steps to make sense — and brainstorm what could go off the rails, then organize that into the plan.

  Here is the content I am supposed to cover, so we are on the same page about it. Frankfurt's basic apparatus distinguishes first-order desires (a desire to take some action) from second-order desires (a desire about one's own desires — for example, wishing I did not want to smoke, or wanting my desire to finish the paper to be the one that moves me). The special case he cares about is the second-order volition: wanting a particular first-order desire to be the one that effectively leads to action — to be one's "will." He illustrates with three characters. The unwilling addict takes the drug because his desire for it is strongest, but he wants that desire not to be effective — he wishes it were not the one that moved him. The willing addict also cannot resist, but he has no conflict: he endorses his desire, he wants it to be what drives him. And the wanton is a creature with no second-order desires at all — he just acts on whatever first-order desire is strongest, and it never occurs to him to have attitudes about which desire wins; importantly, a wanton is not necessarily a wild hedonist, just someone for whom the question of endorsement never arises. Frankfurt's line is roughly that the unwilling addict lacks freedom of the will, the willing addict has it but got it by luck, and the wanton isn't even a candidate for freedom of will — though all three may equally lack freedom of action, since none of them could have done otherwise at the moment of acting.

  The plan should tell me: (1) the order in which the pieces must be introduced and why — in particular, whether second-order desires or the distinction between freedom of action and freedom of will should come first, and what breaks if I choose wrongly; (2) which single example should carry the whole explanation and what properties it must have and must lack to do that job — is the addiction case the right carrier, or does its messiness (physical dependence, relapse, moralized ideas about "real" addiction my classmates will have) get in the way of the structure Frankfurt is trying to display, and if so, what should replace or bracket it; (3) the misconceptions my classmates will predictably bring or form, in the order they will actually arise — I anticipate at least these candidates: that free will means you could have done otherwise, so the whole hierarchy is beside the point; that a second-order desire is just a stronger or more long-term version of a first-order desire; that the wanton is a strawman because everyone obviously has attitudes about their desires; and that Frankfurt has thereby defined away the problem rather than answered it — plus where in the sequence each should be headed off rather than left to fester; (4) one check question I can ask at the end that would distinguish students who have actually grasped the structure from those who have merely memorized the vocabulary; and (5) what I should explicitly decline to cover in twenty-five minutes and openly say I am setting aside — I assume the deep question of whether endorsing a desire does any real work if the endorsement was itself caused, but tell me if there are other omissions I should announce rather than let students discover and use to derail the session.

  Please be concrete about placement — e.g., "introduce X only after Y, because otherwise students will read X as Z" — rather than giving general teaching advice. The quality of the plan should live in the dependency ordering and the misconception map.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Role:** Experienced philosophy teacher (mentor to a high school senior).
      *   **Task:** Create a 25-minute teaching plan for a seminar on Harry Frankfurt's Compatibilism (Hierarchy of Desires).
      *   **Audience:** High school seniors, mostly hard determinists ("brain is atoms, free will is illusion").
      *   **Constraint:** Do *not* write the explanation itself. Write the *plan*.
      *   **Key Requirements:**
          1.  Reason through dependency structure (what comes first and why).
          2.  Select the best illustrative example (addiction vs. something else).
          3.  Map misconceptions and when to head them off.
          4.  Provide one specific "check question."
          5.  Define explicit scope limitations (what to exclude).
      *   **Tone:** Concrete, strategic, aware of pedagogical pitfalls.

  2.  **Deconstruct the Content & Dependencies (Requirement 1):**
      *   *Core Concept:* Free Will = Structure of Desires (Second-Order Volitions), not Ability to Do Otherwise.
      *   *Prerequisites:* Students need to understand "First-Order Desire" (FOD) vs. "Second-Order Desire" (SOD) vs. "Second-Order Volition" (SOV).
      *   *The Pivot:* The distinction between "Freedom of Action" (could do what you want) and "Freedom of Will" (could want what you want).
      *   *Dependency:* You can't explain Freedom of Will without explaining the Hierarchy. You can't explain the Hierarchy without clear examples of FOD/SOD.
      *   *Critical Decision:* Does the "Freedom of Action vs. Will" distinction come *before* or *after* the Hierarchy?
          *   *Option A (Distinction First):* If I start by saying "Forget 'could have done otherwise'," they might tune out because that's their definition of free will. They need to see *why* we need a new definition.
          *   *Option B (Hierarchy First):* If I build the hierarchy first, they see the machinery. Then I show how this machinery solves the "could have done otherwise" problem (the Addict cases).
          *   *Best Path:* Start with the intuition pump (the example) to generate the hierarchy *from* the case, then formalize the distinction. Actually, better yet: Establish the *problem* with the standard definition (Principle of Alternate Possibilities - PAP) using the Addict cases immediately. This forces them to abandon "could have done otherwise" *before* they get attached to it.
          *   *Refined Dependency:*
              1.  Challenge the "Could Have Done Otherwise" (PAP) intuition immediately using the Addicts.
              2.  Introduce FOD/SOD to explain *why* the Addicts differ.
              3.  Define Freedom of Will via SOV.
              4.  Address the "Wanton" to show necessity of SODs.
              5.  Address Determinism/Compatibilism last (as the payoff).
      *   *Risk:* If I define FOD/SOD abstractly first, it's boring and feels like logic puzzles. If I start with the Addicts, it's engaging but risks the "addiction is a disease" distraction.

  3.  **Select the Example (Requirement 2):**
      *   *Candidate:* Frankfurt's Addicts (Unwilling vs. Willing).
      *   *Pros:* It's the classic case. It directly targets the "could have done otherwise" intuition (both take the drug, only one is unfree).
      *   *Cons:* High schoolers have baggage about addiction (disease model, morality, physical compulsion). They might think the Unwilling Addict is physically coerced, which muddies "will."
      *   *Alternative:* Procrastination? Dieting?
      *   *Decision:* Stick with the Addict but *sanitize* it. Call it "The Drug Case" but emphasize the *psychological* compulsion, not the chemical. Or, use a "Reluctant Smoker" vs. "Happy Smoker" analogy to reduce the stakes.
      *   *Better Decision:* Use the Addict case but *bracket* the physical dependency. Explicitly stipulate: "Imagine the physical urge is identical in both. The only difference is their attitude toward the urge." This prevents the "but he's sick!" objection.
      *   *Why:* The Addict case is the only one that cleanly separates Freedom of Action (both act) from Freedom of Will (only one endorses). A dieting example often implies the person *could* have eaten the cake but didn't, which brings PAP back in. The Addict *cannot* do otherwise. This is crucial.

  4.  **Map Misconceptions (Requirement 3):**
      *   *Misconception 1: "Free Will = Could Have Done Otherwise" (PAP).*
          *   *Timing:* Immediate. Must be shattered in the first 5 minutes using the Addict cases.
          *   *Fix:* Show two people who *couldn't* do otherwise, but we judge them differently.
      *   *Misconception 2: "Second-Order Desire = Stronger First-Order Desire."*
          *   *Timing:* When defining SOD/SOV.
          *   *Fix:* Use a counter-example (e.g., wanting to want to smoke, but still hating smoking). Strength $\neq$ Order.
      *   *Misconception 3: "The Wanton is a Strawman."*
          *   *Timing:* After explaining the Hierarchy.
          *   *Fix:* Clarify it's a structural limit, not an insult. Babies/Animals are wantons. It's about capacity for reflection, not intelligence.
      *   *Misconception 4: "This defines away the problem (Determinism)."*
          *   *Timing:* End of session.
          *   *Fix:* Acknowledge it. That's the "Scope Limitation."

  5.  **Design the Check Question (Requirement 4):**
      *   *Goal:* Distinguish memorization from structural understanding.
      *   *Bad Question:* "What is a second-order volition?" (Vocab recall).
      *   *Good Question:* A novel case where FOD and SOD conflict, but the outcome is ambiguous. Or, ask them to classify a specific scenario.
      *   *Idea:* The "Brainwashed Cultist." They *want* to serve the cult (FOD), they *want* to want to serve the cult (SOD/SOV)... but the SOD was implanted.
      *   *Wait, that's too advanced (Manipulation Argument).*
      *   *Simpler Idea:* A case of "Akasia" (Weakness of Will) vs. "Compulsion."
      *   *Best Idea:* A scenario where someone has a Second-Order Desire but *not* a Second-Order Volition. (e.g., "I wish I didn't want to smoke, but I don't care enough to make my desire to quit the one that moves me.") This tests the SOD vs. SOV distinction, which is the crux of Frankfurt.

  6.  **Define Scope Limitations (Requirement 5):**
      *   *Must Exclude:* The "Regress Problem" (what about third-order desires?).
      *   *Must Exclude:* The "Manipulation Argument" (what if the second-order desire was brainwashed?). This is the biggest derailment risk.
      *   *Must Exclude:* Deep neuroscience of addiction.
      *   *Why:* These are valid but kill the 25-minute flow. They belong in a "Objections" seminar, not the "Exposition" seminar.

  7.  **Drafting the Plan (Iterative refinement):**
      *   *Structure:*
          1.  **Prep/Reasoning:** Explain the logic behind the order.
          2.  **The Plan:** Minute-by-minute breakdown.
          3.  **Misconception Map:** Specific interventions.
          4.  **Check Question:** The specific scenario.
          5.  **Scope:** What to cut.
      *   *Refining the "Order":* I need to make sure the student presenter knows *not* to define terms before using them. Use the cases to *generate* the terms.
      *   *Refining the "Addict" issue:* I will advise them to use the "Unwilling vs. Willing" contrast immediately to break PAP, but add a specific script instruction to neutralize the "disease" objection.
      *   *Refining the "Wanton":* Make sure to emphasize that Wantons aren't "stupid," they just lack the *structure*.
      *   *Refining the Check Question:* It needs to test the SOV (Volition) vs SOD (Desire) distinction. That's the subtlest point.

  8.  **Final Review against Constraints:**
      *   Did I write the explanation? No.
      *   Is it 25 minutes? Yes, the pacing reflects that.
      *   Is it concrete? Yes, specific timestamps and scripts.
      *   Did I address the "brain is atoms" crowd? Yes, by framing Compatibilism as the solution to their specific worry.

  9.  **Final Polish:** Ensure the tone is supportive but authoritative (mentor to student). (Self-Correction: Make sure to emphasize *why* the order matters in the reasoning section, as requested).

  *(Self-Correction during drafting)*: I initially thought about putting the Freedom of Action/Will distinction at the end. But actually, it's better to introduce it right after the Addict cases to label what they just saw. So: Addicts -> PAP broken -> Action vs. Will -> Hierarchy explains Will. This flows better.

  *(Self-Correction on Check Question)*: The SOD vs SOV distinction is the hardest part. The check question must target that. I'll create a scenario where a person has a preference about their desires but doesn't identify with it.

  Let's assemble the response.cw
answer: |-
  ### Reasoning Through the Dependency Structure

  Before looking at the schedule, you need to understand *why* the pieces are ordered this way. If you present them in the order they appear in a textbook (Definitions -> Cases -> Conclusion), you will lose the class. Here is the logical dependency chain you must respect:

  1.  **The Intuition Pump must precede the Vocabulary.** If you define "first-order desire" and "second-order volition" on the board before giving them a case to apply it to, it will sound like abstract logic puzzles. Students will tune out. You must present the **Unwilling vs. Willing Addict** cases *first* to generate a puzzle they feel the need to solve.
  2.  **Breaking "Could Have Done Otherwise" (PAP) must precede the Hierarchy.** Your classmates are hard determinists. They believe Free Will = Ability to Do Otherwise. If you try to build the Hierarchy of Desires without first showing them that "Ability to Do Otherwise" is insufficient, they will reject the Hierarchy as irrelevant. You must use the Addict cases to prove that two people can have the *same* ability to do otherwise (zero) but *different* levels of freedom. This creates the vacuum that the Hierarchy fills.
  3.  **Second-Order Desire (SOD) must precede Second-Order Volition (SOV).** This is the most common technical failure point. Students will think "wanting to want X" is the same as "wanting X to be my will." It isn't. You must establish that I can wish I didn't smoke (SOD) without necessarily committing to making my desire to quit the one that wins (SOV). The distinction is between *evaluating* a desire and *identifying* with it.
  4.  **The "Wanton" must come last.** If you introduce the Wanton too early, students will get stuck arguing about whether babies or animals have free will. The Wanton is a boundary case to test the limits of the theory, not the core of it. Introduce it only after they understand the Hierarchy, to show what happens when the Hierarchy is missing.

  ---

  ### The 25-Minute Teaching Plan

  **0:00 – 5:00: The Trap (Breaking the "Could Have Done Otherwise" Intuition)**
  *   **Action:** Do not start with definitions. Start with the **Unwilling Addict** and the **Willing Addict**.
  *   **Script Strategy:** Describe both characters. Emphasize heavily: *"In this scenario, both addicts are physically and psychologically incapable of resisting the drug at the moment of action. Neither could have done otherwise."*
  *   **The Pivot:** Ask the class: *"Given that neither could have done otherwise, is there a moral or freedom-related difference between them?"*
  *   **Goal:** Elicit the intuition that the Unwilling Addict is unfree (a prisoner of his body), but the Willing Addict is free (he is doing what he really wants).
  *   **Why:** This forces the class to abandon the "Free Will = Could Have Done Otherwise" definition immediately. It creates a need for a new definition.

  **5:00 – 12:00: The Machinery (First-Order vs. Second-Order)**
  *   **Action:** Now introduce the vocabulary to explain *why* they judged the addicts differently.
  *   **Step 1 (FOD):** Define First-Order Desire (desire to act). Note that both addicts have the same FOD (take the drug).
  *   **Step 2 (SOD):** Define Second-Order Desire (desire about a desire).
      *   *Crucial Distinction:* Explain that the Unwilling Addict has a SOD ("I wish I didn't want this"), but it conflicts with his FOD.
      *   *The Willing Addict:* He has a SOD that aligns with his FOD ("I want to want this").
  *   **Step 3 (SOV):** Introduce the **Second-Order Volition**. This is the specific SOD that says, "I want *this* desire to be the one that moves me to action."
  *   **Why:** This explains the difference between the addicts without referencing "could have done otherwise." Freedom is now defined as **alignment between FOD and SOV**.

  **12:00 – 17:00: Freedom of Action vs. Freedom of Will**
  *   **Action:** Formalize the distinction hinted at in the first 5 minutes.
  *   **Concept:**
      *   **Freedom of Action:** Doing what you have a First-Order Desire to do. (Both addicts have this, ironically, because they get the drug).
      *   **Freedom of Will:** Having the First-Order Desire that you *want* to have (via SOV).
  *   **Application:** The Unwilling Addict has Freedom of Action (he takes the drug he wants to take in the moment) but lacks Freedom of Will (he doesn't want to be the kind of person who wants the drug). The Willing Addict has both.
  *   **Why:** This gives them the terminology to articulate the compatibilist position. It allows them to say "Determinism might remove Freedom of Action (maybe), but it doesn't necessarily remove Freedom of Will."

  **17:00 – 20:00: The Boundary Case (The Wanton)**
  *   **Action:** Introduce the **Wanton**.
  *   **Clarification:** Explicitly state: *"A Wanton is not necessarily a wild party animal. A Wanton is anything that acts on desires without reflecting on them."*
  *   **Examples:** Mention animals or small children. This prevents the "strawman" objection that no humans are wantons.
  *   **Point:** The Wanton lacks Freedom of Will not because they are coerced, but because the *question* of freedom doesn't apply to them. They lack the structural capacity for SOVs.
  *   **Why:** This solidifies the definition. If you don't have second-order capacities, you aren't even in the game of Free Will.

  **20:00 – 25:00: The Payoff and The Check**
  *   **Action:** Connect back to the "Brain is Atoms" crowd.
  *   **Argument:** "If Free Will is about the structure of your desires, then the fact that your brain is made of atoms (causality) doesn't automatically destroy Free Will. As long as your desires are structured hierarchically (SOV aligns with FOD), you are free, even if that structure was caused."
  *   **Activity:** Pose the Check Question (see below).
  *   **Closing:** State the Scope Limitations (see below).

  ---

  ### Misconception Map & Intervention Points

  Do not wait for these to arise. Pre-empt them at these specific timestamps.

  | Misconception | When it arises | How to head it off (Script Cue) |
  | :--- | :--- | :--- |
  | **"Free Will means I could have done otherwise."** | **0:00–5:00** | **Intervention:** When describing the Addicts, repeat twice: *"Assume for this thought experiment that neither of them could possibly have resisted."* If a student objects, say: *"Grant me that for a moment. Even if they couldn't resist, do you still judge them differently?"* |
  | **"Second-Order Desire is just a stronger desire."** | **5:00–12:00** | **Intervention:** When defining SOD, use a counter-example. *"I might have a very weak desire to want to exercise, and a very strong desire to eat cake. The strength doesn't matter; the order matters. One is about the cake, one is about me."* |
  | **"The Wanton is a strawman; everyone reflects."** | **17:00–20:00** | **Intervention:** Don't argue that adult humans are wantons. Say: *"Frankfurt uses the Wanton to show us what capacity is required. Even if all adults have it, babies don't. The point is that without this capacity, 'freedom' is a category error."* |
  | **"This just defines away the problem (Determinism)."** | **20:00–25:00** | **Intervention:** Acknowledge this explicitly in the Scope Limitations. Do not let them feel they are being tricked. Admit that Frankfurt changes the definition of Free Will to make it compatible with causality. |

  ---

  ### The Check Question

  Do not ask: *"What is a second-order volition?"* (This tests memory).
  Do not ask: *"Is the unwilling addict free?"* (This is too easy).

  **Ask this scenario:**
  > "Imagine a student, Sarah. She has a First-Order Desire to procrastinate. She also has a Second-Order Desire that she *wished* she didn't want to procrastinate (she feels guilty about it). However, she does not actively try to make her desire to work win; she just lets the procrastination happen and shrugs.
  >
  > **Question:** Does Sarah have a Second-Order *Volition*? And according to Frankfurt, is she acting with Freedom of the Will?"

  **Correct Answer:**
  *   She has a Second-Order *Desire* (she wishes she didn't want to procrastinate).
  *   She does **not** have a Second-Order *Volition* (she isn't endorsing a specific desire to be her *will*; she isn't identifying with the desire to work).
  *   Therefore, she lacks Freedom of the Will (she is closer to the Unwilling Addict or even the Wanton in that moment).

  **Why this works:** It forces them to distinguish between *wishing* your desires were different (SOD) and *endorsing* a specific desire to drive the car (SOV). That is the precise mechanical hinge of Frankfurt's theory.

  ---

  ### Scope Limitations (What to Explicitly Exclude)

  You have 25 minutes. If you do not draw a boundary, the "brain is atoms" students will derail you with objections that Frankfurt addresses in later papers, not this one. At the 20-minute mark, explicitly say:

  *"I am setting aside two major objections today, not because they aren't important, but because they require more time than we have:"*

  1.  **The Regress Problem:** *"What if I have a third-order desire about my second-order desire? Do I need an infinite hierarchy to be free?"* (Acknowledge this exists, but say Frankfurt argues the buck stops at identification).
  2.  **The Manipulation Argument:** *"What if my Second-Order Volition was brainwashed into me? If my endorsement was caused by a cult or neurosurgeon, am I really free?"*
      *   **Crucial Instruction:** Tell the class: *"This is the strongest objection to Frankfurt. It asks whether the *history* of the desire matters, not just the structure. Today we are only looking at the **structure**. If we bring in the history of the desire, we leave Compatibilism and enter a different debate. Please hold that objection for the next seminar."*

  By announcing this, you validate the smartest students in the room (who will likely think of this objection) without letting them dismantle the lesson before you finish it.
