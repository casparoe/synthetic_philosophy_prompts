answer: |-
  ### Brainstorm: Candidate Interpretations

  Before reconstructing the implicit theory of meaning, I must weigh several competing philosophical characterizations of the BLEU-era evaluation regime:

  1.  **Radical Behaviorism:** The practice treats meaning as identical to observable input-output dispositions. If the machine produces the "correct" physical marks (tokens) associated with the input, it has "translated." Internal states (intent, understanding) are irrelevant.
  2.  **Distributional Essentialism:** Meaning is exhaustively determined by co-occurrence statistics. If an output shares n-grams with a human reference, it occupies the same semantic space. Meaning *is* proximity in vector space or string space.
  3.  **Operationalist Instrumentalism:** The metric presupposes no ontology of meaning. It is merely a tool (like a thermometer) correlated with a latent quality ("translation goodness"). The practice is agnostic on *what* meaning is, caring only about *measurement*.
  4.  **Type-Identity Supervenience:** Semantic equivalence strictly supervenes on surface syntactic/lexical overlap. Two translations cannot mean the same thing if they do not share sufficient surface structure, implying a tight, perhaps isomorphic, link between form and content.
  5.  **Institutional Reification:** The practice presupposes nothing about language, but everything about optimization. It assumes translation quality is a single, scalar, differentiable quantity to allow for gradient descent and leaderboard ranking, regardless of linguistic reality.

  *Decision:* I will reject the "Instrumentalist/Thermometer" view as insufficient because using a thermometer *does* presuppose a physical correlation between expansion and heat; similarly, BLEU presupposes a correlation between n-gram overlap and semantic equivalence. I will argue the practice implicitly commits to a hybrid of **Operationalist Verificationism** and **Formal Isomorphism**, reinforced by an institutional metaphysics of **Commensurability**.

  ***

  ### Reconstruction: The Implicit Theory of Meaning

  The two-decade dominance of automatic metrics like BLEU presupposes a theory of meaning I shall call **Extensional Verificationism with Isomorphic Constraints**.

  This view holds that the meaning of a translation is exhausted by its extensional overlap with a canonical reference set. It is *verificationist* because it defines the "success" of the translation entirely by the method of its verification (string matching); if you cannot measure it via n-gram overlap, it does not count toward the score. It is *extensional* because it ignores intensional states (the translator's intent, the reader's affect, the poem's aesthetic function) in favor of external reference matching.

  Crucially, this practice relies on the assumption of **Surface Supervenience**: the belief that semantic equivalence supervenes tightly on surface-form similarity. While practitioners might verbally acknowledge that paraphrase is possible, the *mathematical structure of the loss function* dictates that meaning is lost when surface form diverges from the reference. By penalizing valid paraphrases that lack n-gram overlap, the metric ontologically demotes them to "errors." Thus, the practice does not merely measure translation; it constructs a specific ontology where translation is a constraint-satisfaction problem on token sequences, not a communicative act.

  This is not merely behaviorism, which would allow any output that functions equivalently. BLEU is stricter: it demands the output function matches the reference *specifically*. It is closer to a **Type-Identity Theory** of translation: the "correct" translation is not just any token that preserves truth conditions, but one that belongs to the same type-class as the human reference.

  ### Presupposition vs. Compatibility: Truth, Use, and Instruments

  We must distinguish what the practice *strictly presupposes* from what it is merely *compatible with*.

  1.  **Truth-Conditional Semantics:** A truth-conditional stance is **compatible but not required**. One could argue the reference translation represents the "true" conditions. However, strict truth-conditionalism would allow any output that preserves truth conditions (e.g., a paraphrase). Since BLEU penalizes accurate paraphrases, the practice actually *violates* a pure truth-conditional view. It presupposes that the *specific wording* carries truth-conditional weight that alternative wordings lack, which is a contentious semantic claim.
  2.  **Use-Theoretic Semantics (Wittgensteinian):** This stance is **incompatible**. If meaning is use, then a translation that achieves the same pragmatic effect (e.g., making the reader laugh, or conveying a specific register) is successful even if word choice differs. BLEU's failure to capture idioms, register, or poetic effect demonstrates a fundamental rejection of use-theory. The metric assumes meaning is context-invariant and detachable from the "form of life" in which the sentence is uttered.
  3.  **Pure Instrumentalism:** The "thermometer" defense is **philosophically unstable**. A thermometer works because we have a theory linking thermal expansion to kinetic energy. BLEU works (or is used) based on a theory linking n-gram overlap to semantic fidelity. If the field claimed "we have no theory, it just correlates," they would have to abandon the metric when the correlation breaks (e.g., in poetry or high-stakes legal translation). They did not. Therefore, the practice presupposes that the correlation is *nomological* (law-like) rather than accidental. It assumes surface form is a reliable proxy for deep structure across *all* domains, which is a substantive theoretical claim about the uniformity of language.

  ### The Institutional Tension: Scalar Quality vs. Commensurability

  The field acknowledged the metric's divergence from human judgment at the margins (idioms, gender, poetry) yet drove hiring and funding with it. Does this presuppose a dominant scalar component of quality, or something about institutions?

  It presupposes both, but the institutional drive relies on a metaphysical claim I call **Universal Commensurability**.

  If practitioners believed translation quality was multidimensional (e.g., accuracy vs. fluency vs. style vs. ethical alignment), a single scalar metric would be category error. By using a single number (BLEU score) to rank systems, the field presupposes that all these dimensions can be collapsed into one without significant loss of information. This is not just an institutional convenience; it is a claim that "translation quality" is a natural kind with a single magnitude.

  However, the persistence of the metric despite known failures suggests **Institutional Realism**: the metric became real because the institutions (conferences, grants, hiring committees) required a mechanism for comparison that was cheap and reproducible. The tension reveals that the field prioritized **optimizability** over **validity**. In philosophical terms, they conflated the *map* (the score) with the *territory* (the communicative act). The pattern presupposes that what cannot be measured (poetic essence, ethical nuance) is secondary to what can be measured (n-gram overlap). This is a form of **methodological positivism**: if it isn't computable, it isn't science.

  ### The Requirement of Understanding and Recent Shifts

  If the field committed to the view that **understanding is required for genuine translation**, evaluation practice would have to undergo a paradigm shift from **Output Matching** to **Goal Achievement**.

  1.  **Change in Practice:** Evaluation would no longer compare System Output to Reference Output. Instead, it would compare **Source Intent** to **Target Effect**.
      *   *Task-Based Evaluation:* Did the reader of the translation perform the intended action? (e.g., if the text is a warning, did the user act cautiously?)
      *   *Pragmatic Fidelity:* Does the translation preserve the speech act (promise, threat, joke) rather than the propositional content alone?
      *   *Explainability:* Systems might be required to justify translation choices in cases of ambiguity (e.g., gendered pronouns), demonstrating a model of the world rather than just a mapping of tokens.

  2.  **The Shift to Human Preference and LLM-as-Judge:**
      *   *Human Preference:* This is a step toward use-theory, as it captures "which one feels better." However, it often remains a pairwise comparison of surface quality without probing *why*. It mitigates the scalar problem but often retains the focus on fluency/adequacy binaries rather than deep intent.
      *   *LLM-as-Judge:* This is **not** a fundamental change; it is a relocation of the proxy problem. Using an LLM to judge translation replaces n-gram overlap with **latent space overlap**. The judge-LLM is still matching the candidate translation against its own internal distributional expectations of what a "good translation" looks like.
      *   *Critique:* Unless the LLM-as-Judge is explicitly prompted to evaluate *pragmatic success* or *intent preservation* (and verified against ground-truth intent, not just ground-truth text), it remains an **Extensional Verificationist** system, merely operating in a higher-dimensional vector space. It simulates understanding without requiring the translating system to possess it. It risks creating a closed loop where models are optimized to please other models, drifting further from human communicative needs.

  ### Conclusion

  The BLEU era presupposed that meaning is a static object recoverable through surface isomorphism. It treated translation as a decoding problem rather than a re-encoding of intent. The institutional reliance on this flawed metric reveals a commitment to the commensurability of all linguistic acts. Moving forward, unless evaluation shifts from "does this look like a reference?" to "does this achieve the communicative goal?", the introduction of LLM judges will merely automate the same philosophical error with more sophisticated mathematics. True understanding requires evaluating the *effect* of the translation in the world, not just its shadow on a reference page.
