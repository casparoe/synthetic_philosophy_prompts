  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe I should argue the Middle Ground is best.
      *   *Correction:* No, the prompt explicitly says "don't just pick one theory and defend it." I need to show where each struggles.
      *   *Nuance:* Make sure to distinguish between *guilt* (culpability) and *responsibility* (forward-looking duties). The Fischer controversy blurred these, which is philosophically interesting.
      *   *Identity:* Emphasize the regime change problem. Imperial Germany $\to$ Weimar $\to$ Third Reich $\to$ FRG. How does the Collectivist handle this discontinuity?

