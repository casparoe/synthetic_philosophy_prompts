prompt: |-
  I'm a journalist who covers science and ideas for a general-interest magazine, and I'm working on an explainer about whether the present owes anything to future people — prompted by all the coverage of climate policy and longtermist arguments that treats "future generations" as obvious beneficiaries of our restraint. Before I build my framing, I want to check a summary of the philosophical background that I got from a well-reviewed popular philosophy book. The book devotes a page to Derek Parfit's nonidentity problem, and the page reads roughly like this:

  "Here is the puzzle Parfit put his finger on. Most of our major collective decisions don't just make future people better or worse off — they determine which future people exist at all. Delay a conception by a month and a different child is born. So when a nation adopts a policy of depleting its resources, the people alive centuries later, under depletion, are different people from those who would have lived under conservation. And here is the twist: provided those future lives are worth living, none of those people has been harmed by the depletion, because for the particular person who exists, the alternative was not a better life under a different policy but no life at all, and a life worth living beats no life. The wrongness we instinctively feel in depletion thus dissolves on analysis. This was Parfit's own conclusion: as long as future people are not worse off than non-existence, we cannot have wronged them. And since morality, on his slogan, is about making people happy rather than about making happy people, our duties to future generations turn out to be much weaker than we assumed. Philosophers call this the nonidentity problem, though it is essentially the same difficulty Parfit later pressed in his repugnant conclusion."

  I want to use this background correctly, so please give me a careful audit rather than a verdict I have to take on faith. Go claim by claim through the book's paragraph and sort what you find into three buckets: what a philosopher working on population ethics would accept as stated, what they would accept only as a simplification (and what the simplification hides), and what they would say is simply wrong or misattributed. In particular, I want to know whether the paragraph correctly represents what Parfit himself concluded — the book presents a strong conclusion under his name, and I have a suspicion that a writer for a popular audience may have converted Parfit's problem into Parfit's solution, but I don't know the literature well enough to say. I'd also like you to explain how the nonidentity problem actually relates, if at all, to the repugnant conclusion, since the book treats them as one difficulty and I need to know whether that's a harmless simplification or a conflation that would embarrass me in print. Finally, tell me whether my planned framing survives the audit: I intend to say that the nonidentity problem shows climate policy can't be justified by appeal to identifiable victims in the future, and must instead rest on impersonal or collective-value considerations — does that follow from the accurate parts of the book's summary, or does it inherit one of the errors?

  After the prose audit, please give me a machine-readable digest as a single JSON object with the following schema: a top-level field "overall_verdict" taking one of the values "fair", "mostly_fair_with_caveats", or "unfair"; an array "claims" where each element has the fields "claim" (a short paraphrase of one claim from the book's paragraph), "status" (one of "accurate", "simplification", "misrepresentation", "false"), and "explanation" (one or two sentences on why); a boolean field "framing_survives" for whether my intended framing follows from the accurate claims alone; and two string fields, "safe_framing" and "unsafe_framing", each a single sentence stating, respectively, the closest thing to my framing that a population ethicist would endorse and the sentence I should most avoid putting in print.
