answer: |-
  ### The Case Studies

  **Case 1: The Clog (Threshold Structure)**
  In a co-housing complex of 100 residents, the shared greywater pipe to the garden irrigation system has a hard capacity limit: it clogs completely if solid waste exceeds 500 grams in a single day, rendering the garden unusable for a week (aggregate harm). The pipe is transparent, and a digital scale at the inlet displays the current daily total. At 8:00 AM, the scale reads 400 grams. Residents arrive sequentially to dump their compost buckets; each bucket contains exactly 2 grams of waste. The clog will inevitably occur when the 51st resident arrives (total 502 grams). You are the 90th resident. You see the scale read 498 grams before you approach; you know the clog occurred ten residents ago. You choose to dump your bucket rather than carry it to the distant municipal bin (personal cost: 10 minutes extra walking). Your excuse: "The pipe was already clogged; my dump made no difference to the garden's status."

  **Case 2: The Sludge (Smooth Structure)**
  In the same co-housing complex, the shared greywater pipe feeds a filtration tank where toxin concentration accumulates linearly with waste. If the toxin level exceeds 500 parts per million (ppm), the garden soil becomes toxic and unusable for a week (aggregate harm: identical loss of amenity). The tank holds 10,000 liters, diluting waste instantly. At 8:00 AM, the concentration is 400 ppm. Residents arrive sequentially; each bucket adds exactly 0.02 ppm to the concentration. The 50th resident pushes the level to 501 ppm, crossing the toxicity threshold. You are the 90th resident. You arrive when the concentration is already 508 ppm. You choose to dump your bucket rather than carry it to the municipal bin (personal cost: 10 minutes extra walking). Your excuse: "The soil was already toxic; my 0.02 ppm addition made no difference to the garden's status."

  ***

  ### Matching Conditions Demonstration

  | Parameter | Case 1 (The Clog) | Case 2 (The Sludge) | Match Status |
  | :--- | :--- | :--- | :--- |
  | **Contributors** | 100 residents. | 100 residents. | **Matched.** |
  | **Contribution Size** | 2 grams waste. | 2 grams waste (0.02 ppm). | **Matched.** |
  | **Aggregate Harm** | Garden unusable (1 week). | Garden unusable (1 week). | **Matched.** |
  | **Personal Cost** | 10 mins walking to bin. | 10 mins walking to bin. | **Matched.** |
  | **Pivotal Probability** | **0.** You are #90; pivot was #51. You are causally inert regarding the *state change*. | **$\approx$ 0.** You are #90; threshold crossed at #50. Your contribution changes the *degree* of toxicity, but the *outcome* (unusable garden) is already fixed. | **Matched (Epistemically).** |

  **Note on Pivotality:** This is the critical juncture. In Case 1, your pivotality is ontologically zero: the counterfactual "If I hadn't dumped, the garden would be usable" is false. In Case 2, your pivotality is ontologically non-zero (you increased toxicity), but *outcome-pivotality* is zero because the harm threshold was already crossed by others. I have equated them by defining "pivotal" as "probability of altering the binary outcome (usable/unusable)." In Case 2, this relies on the harm being defined by the threshold of toxicity, not the continuous level of poison. If the harm were defined as *amount* of toxicity, they would diverge. I stipulate the harm is the *loss of the garden*, which is binary in both cases, ensuring the agent's probability of preventing that specific harm is effectively zero in both.

  ***

  ### Analysis by Philosophical Position

  **1. Expected-Value Consequentialism (EVC)**
  The EVCist calculates $EV = P(\text{pivotal}) \times \text{Harm}$. In **Case 1**, $P(\text{pivotal}) = 0$, so $EV = 0$. The agent does nothing wrong. In **Case 2**, strictly speaking, the agent *did* increase toxicity, but since the garden was already lost, the marginal expected utility of her act regarding the *garden's usability* is also 0. However, a sophisticated EVCist might argue that in Case 2, the agent contributes to a *worsening* of the state (higher toxicity), which has disvalue even if the binary threshold is crossed. Thus, EVC likely exonerates Case 1 fully but condemns Case 2 slightly, failing to treat the cases as morally equivalent despite the matched outcome-pivotality.

  **2. Nearest-Threshold View (Kagan-style)**
  Kagan argues we must consider the *risk* of being near a threshold. In **Case 1**, the agent knows she is far from the threshold (it already happened). The "expected cost" of her act is zero because the threshold is in the past. She is exonerated. In **Case 2**, although the threshold is crossed, the structure is smooth accumulation toward a limit. Kagan's view typically treats smooth cases as a series of infinitesimal thresholds. However, since the specific threshold for "garden loss" is already passed, a Kaganian view focused on *that* threshold would also exonerate her. If the view focuses on *future* thresholds (e.g., permanent soil damage), she might be implicated, but given the matched parameters (harm is already realized), this view struggles to distinguish the cases, likely exonerating both.

  **3. Indeterminacy View (Nefsky-style)**
  Nefsky argues that the "makes no difference" premise is often false because it is indeterminate whether the harm would have occurred without the agent. In **Case 1**, it is *determinate* that the harm occurred without her (the scale read 498g). Her participation is unnecessary. In **Case 2**, it is also determinate that the harm threshold was crossed without her (508ppm > 500ppm). Nefsky's view focuses on whether the agent *helps* bring about the harm. In Case 1, she does not help (the clog is static). In Case 2, she *does* help (she adds to the toxicity level, even if the binary outcome is fixed). Thus, Nefsky's view likely condemns Case 2 (she is a participant in the toxic state) while exonerating Case 1 (she is merely present at a broken system). This captures the intuition that the excuse rings hollower in Case 2.

  ***

  ### Structural Feature and Intuitive Asymmetry

  The structural feature driving the asymmetry is **Causal Continuity**. In Case 1 (Threshold), the causal chain is broken: the mechanism of harm (the clog) is static before the agent acts. Her contribution physically enters a blocked pipe; it does not *cause* the blockage. In Case 2 (Smooth), the causal chain is unbroken: her contribution physically mixes into the toxin pool, increasing the concentration. Even if the *outcome* (garden loss) is fixed, her act *constitutes* part of the harmful state.

  The excuse "It makes no difference" rings **sincere in Case 1** because it is factually true regarding the outcome: the garden was already lost. It rings **hollow in Case 2** because while the *outcome* didn't change, the *world* did change (it became more toxic). The agent in Case 2 is actively worsening the situation, whereas the agent in Case 1 is merely adding debris to a disaster.

  **Removal of the Feature:** If we remove Causal Continuity by making Case 2 discrete (e.g., the tank accepts packets of toxins that only count if they arrive before the 50th), the cases become identical, and the intuition of asymmetry vanishes. If we make Case 1 smooth (the clog gets progressively worse, restricting flow gradually), the agent in Case 1 becomes culpable for restricting flow further, aligning her with Case 2.

  **The Symmetry Defender's Objection:** A philosopher insisting the excuses are equally valid would attack the **Harm Specification**. They would argue that if the *moral harm* is defined as "the loss of the garden," then both agents are equally innocent, as neither caused that loss. They would claim my intuition that Case 2 is worse relies on smuggling in a different harm definition (e.g., "total toxicity" vs. "garden usability"). If we strictly hold the harm constant (garden loss), the causal structure is morally irrelevant; only the counterfactual outcome matters. Since the outcome is identical (garden lost either way) and the agent's pivotality regarding that outcome is zero in both, the moral status must be identical. To claim otherwise is to fetishize the *process* of harm over the *result*.
