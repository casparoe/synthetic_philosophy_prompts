prompt: |-
  I referee a lot for a mid-tier cognitive science journal — probably fifteen manuscripts a year, and realistically I can spend two or three hours per manuscript, tops, before the editor needs a recommendation (reject / major revisions / minor revisions / accept) plus some indication of how confident I am. Here's what's been eating at me, and I want you to actually operationalize it rather than give me a philosophy lecture.

  At the last editors' meeting the EiC shared some numbers: across the journal, two referees for the same manuscript agree on the basic accept-or-reject call only slightly more often than chance (around 60%), and when referees disagree, the editor basically flips a coin. I also did a little audit of my own track record: out of my last twenty-ish recommendations where I was confident enough to argue hard in my report, roughly a third got overruled by the editor or torn apart by the other referee in a way I had to concede was fair. So now I'm sitting on evidence about the reliability of my own evidence, which I gather the philosophers call higher-order evidence. The way I see it I've got two moves: either I move my opinion toward the other referee's before I even see it (some kind of averaging thing), or I trust my first-order read of the paper and just slap a discount on when I report confidence to the editor. But I suspect both of those are wrong in different ways, and I've heard there's a whole debate about epistemic akrasia — whether you're allowed to believe P with full strength while also believing your belief in P is unreliable — that's relevant here.

  Act as a professional epistemologist who has also served as an associate editor, so you know both literatures. Please turn whatever the epistemology of higher-order evidence and disagreement actually says into a procedure I can run while refereeing. Concretely:

  - Start with a short brainstorm: list the candidate principles people have proposed for handling higher-order evidence and peer disagreement, and say which ones survive my constraints and which die there.
  - Then give me the procedure: the questions I ask myself, in order, while reading a manuscript; what counts as a sufficient answer to each; where the procedure forces me to lower the confidence I report vs. where it leaves my actual belief alone; and the points where nothing principled decides it and you're just handing the judgment back to me — flag those honestly, don't dress up my judgment calls as procedure.
  - It has to fit on one page and run in about ten minutes at the end of a review. It may never output "withhold judgment" — the editor needs a call and a number.
  - Then run it on three manuscripts I've actually had recently (details as I remember them): (1) a competent but boring study in an area I know cold, where I'm probably the right referee; (2) a flashy result that directly challenges my own theoretical paradigm, and I could feel my blood pressure rising while I read it; (3) a paper whose methods I genuinely don't understand, but by a famous group whose previous work I've always found rock solid, so my instinct was to trust it. 
  - For each, tell me what the procedure outputs, and make sure at least one of them is a case where the procedure makes me do something I won't like. Also tell me where you think the procedure will misfire — what kinds of referees or situations it's just wrong for.

  Think carefully and go step by step, don't just pattern-match to "be calibrated." If a step of the procedure rests on a contested philosophical point, say which one and which way you resolved it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A frequent referee for a mid-tier cognitive science journal (15 manuscripts/year, 2-3 hours/manuscript).
      *   **Problem:** Low inter-rater reliability (60% agreement, effectively chance). Personal audit shows ~33% of confident recommendations get overruled/challenged fairly. This is "higher-order evidence" (HOE) about their own reliability.
      *   **Goal:** Operationalize epistemological theories on HOE and peer disagreement into a concrete, 1-page, 10-minute procedure for making review recommendations (Reject/Major/Minor/Accept + Confidence Score).
      *   **Constraints:**
          *   Act as a professional epistemologist + former associate editor.
          *   No philosophy lectures; practical operationalization.
          *   Must fit on one page (conceptually) and take ~10 mins.
          *   Cannot output "withhold judgment" (must give a call + number).
          *   Must include a brainstorm of principles (survivors vs. casualties).
          *   Must include the step-by-step procedure.
          *   Must apply the procedure to three specific case studies (Boring/Competent, Challenging/Flashy, Unfamiliar Methods/Famous Authors).
          *   Must identify where the procedure forces an unwanted outcome.
          *   Must identify where the procedure misfires.
          *   Acknowledge contested philosophical points.

  2.  **Deconstruct the Epistemology (Brainstorming Phase):**
      *   *Conciliationism (Elga, Christensen):* Upon discovering peer disagreement, significantly reduce confidence or split the difference.
          *   *Verdict:* Dies. The user needs a recommendation *before* seeing the other report. Also, total conciliation leads to paralysis or generic "major revision" sludge.
      *   *Steadfastness (Kelly, van Inwagen):* Stick to your guns if you think you reasoned correctly, treating the disagreement as just more evidence you might be right.
          *   *Verdict:* Dies. Ignores the 60% agreement statistic and the user's own 33% error rate. Dangerous for journal quality.
      *   *Total Evidence View (Kelly):* Weigh first-order evidence (the paper) against higher-order evidence (reliability stats).
          *   *Verdict:* Survives. This is the core. You don't discard the first-order read, but you discount it based on reliability.
      *   *Calibration/Confidence Scoring:* Report belief strength separately from the binary choice.
          *   *Verdict:* Survives. This addresses the "discount on confidence" idea the user mentioned.
      *   *Pre-commitment/Algorithmic:* Use a checklist to reduce noise.
          *   *Verdict:* Survives. Helps standardize the "first-order" assessment so HOE can be applied consistently.

  3.  **Develop the Procedure (The "One-Page" Protocol):**
      *   *Time:* 10 minutes at the end.
      *   *Input:* First-order assessment (Quality/Validity) + HOE (Reliability stats).
      *   *Output:* Decision + Confidence (0-100%).
      *   *Philosophical Stance:* "Weighted Total Evidence." I need to resolve the "akrasia" tension. The solution: *Separate the Recommendation from the Confidence.* The recommendation is the best guess of truth (First Order), the confidence is the probability that the recommendation survives the editorial process (Higher Order). This avoids epistemic akrasia by compartmentalizing the doxastic attitude from the meta-cognitive assessment.
      *   *Steps:*
          1.  First-Order Score (Validity/Novelty).
          2.  Reliability Discount (Area expertise, emotional state, method familiarity).
          3.  Base Rate Adjustment (The 60% agreement / 33% overrule stat).
          4.  Final Calculation.

  4.  **Drafting the Procedure (Iterative Refinement):**
      *   Need to make sure it's actionable.
      *   *Step 1: The Raw Call.* What would I say if I were omniscient?
      *   *Step 2: The Reliability Check.* Am I the right expert? Am I biased?
      *   *Step 3: The Statistical Discount.* Apply the journal's base rates.
      *   *Step 4: The Confidence Number.* Convert to a percentage.
      *   *Constraint Check:* Must not say "withhold." Must force a decision.
      *   *Philosophical Note:* I am resolving the "akrasia" debate by adopting a *functionalist* view: The report is a speech act to the editor, not just a mirror of the soul.

  5.  **Applying to Case Studies:**
      *   *Case 1 (Boring/Competent/Expert):* High first-order confidence. High reliability (expert). Discount is low. Output: Accept/Minor + High Confidence.
      *   *Case 2 (Flashy/Challenging/Biased):* High first-order *reaction* (negative). Low reliability (emotional interference). Discount is high. Output: Major Revision (safer than Reject) + Low Confidence. *This will be the "unwanted" one.* The user wants to reject, but the procedure says "chill out."
      *   *Case 3 (Unfamiliar Methods/Famous):* Low first-order understanding. High reliability (trust in brand). Discount is mixed. Output: Major Revision (needs verification) + Medium Confidence.

  6.  **Refining the Output:**
      *   Tone: Professional, direct, slightly academic but practical.
      *   Formatting: Clear headings, bullet points for the procedure.
      *   Check against constraints: Did I explain the philosophical resolution? Yes (Total Evidence + Functionalist). Did I flag misfires? Yes (systemic bias, outlier papers).

  7.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the procedure too mathematical?
      *   *Fix:* Keep the math heuristic. No formulas, just "adjust up/down."
      *   *Critique:* Did I address the "averaging before seeing the report" vs "discounting confidence" dilemma?
      *   *Fix:* Explicitly choose "discounting confidence" but adjust the *recommendation* if confidence drops below a threshold (e.g., if I'm not sure it's a Reject, it becomes a Major Revision). This bridges the two moves.
      *   *Critique:* The user mentioned "epistemic akrasia."
      *   *Fix:* Address this in the preamble. The procedure allows "P is true, but I'm not sure I'm right about P" by mapping it to "Recommendation = P, Confidence = Low."

  8.  **Final Review against constraints:**
      *   Brainstorm principles? Yes.
      *   Procedure (questions, order, confidence vs belief)? Yes.
      *   Flag indeterminate points? Yes.
      *   One page/10 mins? Yes (in spirit).
      *   No "withhold"? Yes.
      *   Three cases (including one unwanted)? Yes.
      *   Misfire analysis? Yes.
      *   Contested philosophy noted? Yes.

  9.  **Final Polish:** Ensure the voice sounds like an AE who reads epistemology. (e.g., using terms like "first-order evidence," "defeaters," "calibration").

  *(Self-Correction on Case 2)*: Make sure the "unwanted" outcome is clear. The user *feels* the paper is wrong. The procedure forces them to admit they might be the problem. That's the friction point.

  *(Self-Correction on Procedure)*: Ensure the distinction between *Decision* and *Confidence* is sharp. The Decision is the actionable item. The Confidence is the HOE metric.

  Let's write it.cw
answer: |-
  ### Part 1: Principle Brainstorm & Selection

  You are facing the **Peer Disagreement** problem compounded by **Higher-Order Evidence (HOE)**. Here is the landscape of candidate principles, filtered by your constraints (must produce a decision, must account for 60% agreement rates, must fit a 10-minute window).

  *   **Strict Conciliationism (Elga/Christensen):** *Principle:* Upon learning of peer disagreement (or statistical unreliability), split the difference or suspend judgment.
      *   *Verdict:* **DIES.** You cannot suspend judgment (editor needs a call). Splitting the difference *before* seeing the other report is irrational averaging; you don't know their evidence yet.
  *   **Steadfastness (Kelly/van Inwagen):** *Principle:* Stick to your first-order evidence. The fact that others disagree is just more evidence you are right.
      *   *Verdict:* **DIES.** Ignores the base rate (60% agreement) and your personal audit (33% overrule rate). This maximizes variance, not accuracy.
  *   **Total Evidence View (Kelly):** *Principle:* Weigh first-order evidence (the paper) against higher-order evidence (your reliability stats).
      *   *Verdict:* **SURVIVES.** This is the core engine. You don't discard your read, but you discount its weight based on reliability conditions.
  *   **Epistemic Akrasia (Horowitz/Smith):** *Principle:* Is it rational to believe *P* while believing your belief in *P* is unreliable?
      *   *Resolution:* **FUNCTIONALIST COMPROMISE.** We resolve this by separating the *Recommendation* (action based on best current evidence) from the *Confidence Score* (meta-assessment of reliability). You are not "believing P while doubting P"; you are asserting "P is the best call, but the probability of P surviving review is X."

  ### Part 2: The HOE-Adjusted Review Protocol (10-Minute Endgame)

  **Philosophical Stance:** *Weighted Total Evidence.* Your first-order read determines the *direction* of the recommendation; your higher-order evidence determines the *magnitude* of the confidence score and potential softening of the decision.

  **Step 1: The Raw Call (First-Order Evidence)**
  *   **Question:** Ignoring who wrote this, my own mood, and the journal's stats: Is the central claim supported by the methods presented?
  *   **Sufficient Answer:** A binary decision (Accept / Minor / Major / Reject).
  *   **Constraint:** Do not adjust for confidence yet. If the methods are sound, do not mark "Major" just because you are tired.
  *   **Output:** `Raw_Decision`

  **Step 2: The Reliability Audit (Higher-Order Evidence)**
  *   **Question:** What defeaters exist for *my* assessment of this specific manuscript?
  *   **Checklist (Check all that apply):**
      *   [ ] **Expertise Mismatch:** Methods/Theory outside my core competency? (Discount: -20%)
      *   [ ] **Affective Interference:** Did the paper trigger anger/defensiveness (e.g., challenges my paradigm)? (Discount: -30%)
      *   [ ] **Halo Effect:** Am I trusting/distrusting based on author reputation rather than text? (Discount: -20%)
      *   [ ] **Fatigue:** Am I in the last hour of a 3-hour block? (Discount: -10%)
  *   **Output:** `Reliability_Discount` (Sum of percentages, cap at 50%).

  **Step 3: The Base Rate Calibration (Statistical HOE)**
  *   **Question:** What is the prior probability of agreement?
  *   **Rule:** The journal agreement rate is 60%. Your personal overrule rate is 33%.
  *   **Adjustment:** If `Raw_Decision` is **Reject** or **Accept** (extremes), reduce Confidence by 10% (extremes disagree most). If `Raw_Decision` is **Major/Minor** (moderate), keep Confidence stable.
  *   **Output:** `Base_Rate_Adjustment`

  **Step 4: Final Calculation & Decision Lock**
  *   **Confidence Score:** Start at 100%. Subtract `Reliability_Discount`. Subtract `Base_Rate_Adjustment`.
      *   *Floor:* Do not report below 40% (looks unprofessional).
      *   *Ceiling:* Do not report above 95% (arrogant/naive).
  *   **Decision Lock (The Akrasia Fix):**
      *   If `Raw_Decision` is **Reject** BUT `Confidence` is < 60%: **Change Decision to Major Revisions.**
      *   *Reasoning:* If you aren't confident enough to bet against the other referee, you cannot ethically recommend death for the manuscript. You kick it to the authors to fix the ambiguity.
      *   *All other cases:* `Raw_Decision` stands.
  *   **Output:** `Final_Decision` + `Final_Confidence`

  **Indeterminate Zones (Honest Flag):**
  *   **Systemic Bias:** This procedure cannot detect if *you* are systematically biased against a specific methodology (e.g., qualitative vs. computational). It only detects *acute* interference.
  *   **The "Outlier" Paper:** If a paper is genuinely revolutionary, it *should* be rejected by 60% of referees initially. This procedure penalizes novelty. You must manually override Step 4 if you genuinely believe the paper is paradigm-shifting, accepting the risk of overrule.

  ***

  ### Part 3: Protocol Simulation

  Here is the protocol run on your three recent manuscripts.

  #### Case 1: Competent, Boring, Area Expert
  *   **Raw Call:** The study is sound but incremental. `Minor Revisions`.
  *   **Reliability Audit:** Expertise match (0%). No emotional trigger (0%). No halo (0%). Fresh mind (0%). `Discount = 0%`.
  *   **Base Rate:** Decision is moderate (Minor). `Adjustment = 0%`.
  *   **Calculation:** Confidence = 100% → Capped at 95%.
  *   **Decision Lock:** Confidence > 60%. Decision stands.
  *   **Output:** **Minor Revisions (95% Confidence).**
  *   **Comment:** The procedure validates your expertise. High confidence is warranted because HOE defeaters are absent.

  #### Case 2: Flashy, Challenges Your Paradigm (The Unwanted Outcome)
  *   **Raw Call:** Theoretically flawed, methods suspicious. `Reject`.
  *   **Reliability Audit:** Affective Interference (Blood pressure rising). `Discount = 30%`.
  *   **Base Rate:** Decision is extreme (Reject). `Adjustment = 10%`.
  *   **Calculation:** Confidence = 100% - 30% - 10% = 60%.
  *   **Decision Lock:** Confidence is exactly 60%. *Borderline.* To be safe, apply the lock. **Change Decision to Major Revisions.**
  *   **Output:** **Major Revisions (60% Confidence).**
  *   **Comment:** **This is the friction point.** Your first-order evidence screams "Reject." The HOE protocol forces you to admit your physiological reaction compromises your reliability. You cannot kill the paper when you admit a 40% chance you are biased. You must let the authors defend it. *You will hate this.* It feels like cowardice, but it is epistemic hygiene.

  #### Case 3: Unfamiliar Methods, Famous Authors
  *   **Raw Call:** Results look good, but I can't verify the math. `Accept`.
  *   **Reliability Audit:** Expertise Mismatch (Methods). `Discount = 20%`. Halo Effect (Famous Group). `Discount = 20%`. `Total = 40%`.
  *   **Base Rate:** Decision is extreme (Accept). `Adjustment = 10%`.
  *   **Calculation:** Confidence = 100% - 40% - 10% = 50%.
  *   **Decision Lock:** Confidence < 60%. **Change Decision to Major Revisions.**
  *   **Output:** **Major Revisions (50% Confidence).**
  *   **Comment:** Your instinct was to trust the brand. The procedure flags that "trust" is not "verification." By downgrading to Major Revisions, you force the authors to clarify the methods for a referee who *does* understand them, without you having to pretend you validated the math.

  ### Part 4: Where This Procedure Misfires

  1.  **The "Conservative Sludge" Problem:** By forcing Rejects with <60% confidence to become Major Revisions, you systematically bias the journal toward *more* revisions and fewer rejections. Over time, this increases the load on editors and authors. It prioritizes *fairness* over *efficiency*.
  2.  **The "Competent Bigot" Loophole:** If you are systematically biased against a certain methodology (e.g., Bayesian models) but feel no *acute* "blood pressure" rise (Step 2), the procedure registers 0% discount. You will output high-confidence Rejections for valid papers in that subfield. The procedure detects *acute* akrasia, not *chronic* bias.
  3.  **Philosophical Contention:** I resolved the akrasia debate by functionalizing the report (Recommendation ≠ Belief). A strict evidentialist would argue this is dishonest. You are telling the editor "I recommend Major Revision" when your brain says "This should be Rejected." You are essentially lying to optimize the system's error rate. I argue this is permissible for a social institution like a journal, but it is philosophically "impure."

  **Final Instruction:** Print the Protocol. Keep it next to your keyboard. When you finish the report, spend the 10 minutes. If Case 2 happens, submit the Major Revision. Let the editor flip the coin with the other referee's report; you have ensured your side of the coin isn't weighted by your blood pressure.
