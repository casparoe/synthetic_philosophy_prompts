answer: |-
  This is a sophisticated position, and your worry is the correct one to have. When a normative theory accumulates enough *ceteris paribus* clauses to survive empirical counterexamples, it risks becoming a "no-true-Scotsman" of decision theory: *Rational agents maximize geometric growth, except when they don't, in which case they weren't really in a multiplicative context.*

  You are asking for the **stress test** of Geometric Rationality (or Ergodicity Economics). You want to know if the qualified version still has teeth, or if it has retreated into a tautology ("maximize growth, unless you can't, then do something else").

  Here is the ranking of defeaters, the concessions serious defenders make, and the verdict on falsifiability.

  ---

  ### Part 1: The Defeaters (Ranked Fatal to Awkward)

  I have ranked these based on whether they undermine the *mathematical validity* of the claim, the *practical applicability*, or merely the *comfort* of the theorist.

  #### 1. Parameter Uncertainty & Estimation Error (Fatal in Practice)
  **The Argument:** Kelly optimization assumes you know the true probability distribution ($p$) and payoff structure ($b$). In reality, these are estimates. If you overestimate your edge even slightly, full Kelly betting increases the probability of ruin drastically. The "growth optimal" portfolio based on noisy data is often growth *disastrous*.
  **The Concession:** Serious defenders (Thorp, Ziemba, MacLean) concede this universally. This is why "Fractional Kelly" (betting 1/2 or 1/4 of the recommended size) is the industry standard among professionals.
  **Why it's Fatal to the *Strong* View:** If your rationality criterion requires knowledge you cannot have, it cannot guide action in the real world without an ad-hoc "safety factor." If the safety factor is arbitrary (why 1/2 and not 1/3?), the derivation from "pure growth maximization" is compromised by pragmatic risk management.

  #### 2. The Ontology of the "One-Shot" (Fatal in Principle)
  **The Argument:** The ergodicity argument rests on the equivalence of time averages and ensemble averages *in the limit*. If a decision is truly non-repeatable (e.g., a unique existential risk, a once-in-a-lifetime opportunity with no portfolio context), the time-average growth rate is undefined. You cannot invoke the Law of Large Numbers on a sample size of one.
  **The Concession:** Ole Peters and other ergodicity economists concede that their framework applies to *ergodic processes*. If the process is non-ergodic (a true singleton), the mathematical derivation of log-utility from growth rates dissolves. You are left with standard Expected Utility Theory (EUT) and must choose a utility function axiomatically.
  **Why it's Fatal to the *Strong* View:** It limits the scope of "Geometric Rationality" to repeated games. It cannot claim to be a *universal* theory of rational choice, only a theory of *sequential investment*.

  #### 3. Non-Proportionality of Real Wealth (Awkward)
  **The Argument:** Kelly assumes wealth is fully reinvestable and divisible. Real life is not like this. You have fixed consumption needs, indivisible assets (a house), and liabilities that are not proportional to wealth (you can't pay 50% of your rent if your portfolio drops 50%).
  **The Concession:** Defenders concede you should only Kelly-bet on *surplus* risk capital, not total net worth.
  **Why it's Awkward:** It requires a subjective boundary between "wealth" (multiplicative) and "consumption/liabilities" (additive). Where that line is drawn determines the bet size more than the Kelly formula itself.

  #### 4. Alternative Objective Functions (Merely Philosophical)
  **The Argument:** Why maximize wealth growth? Maybe I want to maximize impact, happiness, or the probability of reaching a specific threshold (e.g., "enough to retire by 40"). For threshold problems, bold play (EV maximization) often beats Kelly.
  **The Concession:** Defenders admit Kelly maximizes the *asymptotic growth rate*, not the probability of reaching a specific finite goal in a finite time.
  **Why it's Awkward:** It forces you to defend the axiom that "more wealth is always better at a diminishing marginal rate" as the *only* rational goal, rather than deriving it.

  ---

  ### Part 2: Does the Qualified View Make Distinct Predictions?

  You asked: *Has this view been insulated into unfalsifiability? Does it still tell me what to do differently than EV maximization?*

  **The Verdict: Yes, it makes distinct predictions, but only within its domain.**

  It is not a platitude. A platitude would be "maximize value without going broke." Kelly is specific.
  1.  **Leverage Cap:** In a positive EV bet with high variance, EV maximization (with linear utility) says **bet everything**. Kelly says **bet a specific fraction < 100%**. This is a hard, falsifiable divergence.
  2.  **Diversification:** EV maximization can justify concentrating 100% of capital in the single asset with the highest expected return. Kelly *forces* diversification if assets are uncorrelated, because concentration increases volatility drag.
  3.  **Rejection of Infinite EV:** Kelly rejects the St. Petersburg gamble (or any gamble where the entry cost is a significant fraction of wealth, even if EV is infinite) because the geometric mean is low or negative.

  **The "Insulation" Charge:**
  You worry that by saying "this only applies to repeated multiplicative bets," you are making the theory unfalsifiable.
  *   **Counter-argument:** This is not insulation; it is **domain specification**. Newtonian mechanics is not "unfalsifiable" because it doesn't apply at relativistic speeds. It has a domain of validity.
  *   **The Risk:** The risk is **Imperialism**. If you claim Geometric Rationality is the *only* rationality, you are falsified by the "One-Shot" case. If you claim it is the *appropriate* rationality for *wealth dynamics*, you are safe, but you must admit that not all life decisions are wealth dynamics.

  **Where it bites:**
  It bites hardest in **fat-tailed positive EV situations**.
  *   *Scenario:* A bet costs 10% of your bankroll. 99% chance it goes to zero. 1% chance it pays 1000x.
  *   *EV:* Massive positive. EV Max says **take it** (repeatedly, if possible).
  *   *Kelly:* Calculates the geometric expectation. If the probability of ruin is too high relative to the payoff, Kelly says **pass** or **bet tiny**.
  *   *Prediction:* Kelly agents survive; EV agents go broke almost surely in repeated play. This is a real, observable divergence.

  ---

  ### Part 3: Honest Verdict on "Triviality"

  You asked: *Is this just a platitude about liking money and not going broke? If so, is that fatal?*

  **1. Is it a platitude?**
  No. "Don't go broke" is vague. Kelly tells you *exactly* how close to the brink you can stand. It quantifies the trade-off between growth and volatility. It turns the intuition "don't bet the farm" into a differential equation. That is not trivial.

  **2. Is the narrowing of scope fatal?**
  No, but it requires a shift in how you market the theory.
  *   **Fatal:** Claiming Kelly is the universal normative standard for all rational choice (replacing Savage/EUT).
  *   **Viable:** Claiming Kelly is the normative standard for **capital allocation under uncertainty over time**.

  **3. The "Edge Case" Problem:**
  You wrote: *"A view of rationality that never bites in the hard cases feels like it's been insulated into unfalsifiability."*
  Actually, the "hard cases" (one-shot, ruin-adjacent) are exactly where Kelly bites hardest *against* EV maximization.
  *   In the "safe" cases (low variance, small bets), Kelly and EV converge (bet small amounts).
  *   In the "hard" cases (high variance, ruin risk), Kelly diverges sharply from EV.
  *   **Your worry is backwards:** You are worried the theory doesn't apply to the hard cases. But the theory is *designed* for the hard cases. The problem is that in the *hardest* cases (true one-shot singularity), the *mathematical justification* (ergodicity) fails, even if the *heuristic* (don't bet the farm) remains good advice.

  ### Summary Advice for Your Position

  To hold this view without falling into dogmatism or triviality:

  1.  **Drop the claim to Universality.** Admit that Geometric Rationality is the rationality of **survival and growth in dynamic systems**. It is not the rationality of **moral choice** or **singleton decisions**.
  2.  **Embrace Fractional Kelly as the Robust Version.** Acknowledge that because parameters are unknown, "Full Kelly" is theoretically optimal but practically irrational. "Half-Kelly" is the rational response to parameter uncertainty. This absorbs the "Estimation Error" defeater.
  3.  **Reframe the "One-Shot" Objection.** Argue that truly one-shot decisions are vanishingly rare. Most "one-shot" bets are part of a larger life portfolio. If you treat your life wealth as a multiplicative process, Kelly applies to the *marginal* decision even if the decision itself isn't repeated. (This is the "Portfolio Theory" defense).
  4.  **Accept the "So What?"** If a critic says, "But I want to maximize the chance of buying a house in 5 years, not terminal wealth in 50," concede they are right. Kelly optimizes for $T \to \infty$. For finite $T$ with specific goals, dynamic programming with a specific utility function is superior.

  **Final Verdict:** Your view is not unfalsifiable, but it is **domain-restricted**. It is not a platitude; it is a specific optimization criterion for a specific class of problems. The only fatal flaw is claiming it solves problems outside that class. If you accept that it is the physics of *compounding* rather than the metaphysics of *choice*, it remains one of the most powerful tools in decision theory.
