answer: |-
  ### What you're describing

  You are describing a process where an arbitrary or contingent technical configuration hardens into a normative baseline, creating an asymmetric burden of proof. In this state, the status quo is granted an unearned "presumption of innocence" (framed as neutral, technical, or inevitable), while any proposal to alter it is framed as an active, political intervention. The core mechanism is not just that the technology is sticky, but that the *justification* for keeping it vanishes while the *justification* for changing it becomes mandatory.

  ### The nearest concepts

  This phenomenon sits at the intersection of Science and Technology Studies (STS), political philosophy, and behavioral economics. No single term captures the exact "two-step" you identified, but several concepts map onto specific parts of the geometry.

  **1. The Politics of Artifacts (Langdon Winner)**
  *   **What it captures:** This is the direct lineage of your Robert Moses example. In his seminal 1980 essay *Do Artifacts Have Politics?*, Winner argues that technologies can embody specific forms of power and authority. He distinguishes between artifacts that require specific political relationships to function (e.g., nuclear power requiring hierarchy) and artifacts that are deliberately designed to enforce social outcomes (e.g., the low bridges).
  *   **Where it misses:** Winner's framework often emphasizes *intentionality*. He focuses on engineers or planners who *deliberately* encode bias. Your examples (the intern's weights, the forgotten default setting) are often accidental or banal. Winner explains how tech *can* be political, but less so how accidental tech *becomes* political through neglect and time.

  **2. Black Boxing (Bruno Latour)**
  *   **What it captures:** Latour describes how scientific facts or technical systems become "black boxed" when their internal complexities and contingencies are hidden from view. Once a system works, nobody looks inside; it becomes an input/output machine. This explains why the original choice is forgotten (the box is sealed) and why the system feels like "landscape" rather than "choice."
  *   **Where it misses:** Black boxing explains the *epistemic* invisibility (we don't see the choice), but it doesn't fully account for the *moral* asymmetry you're highlighting. A black box can be questioned without being accused of politics. Your example involves a specific rhetorical move: labeling the *questioning* as political while labeling the *box* as neutral.

  **3. Infrastructure and Obduracy (Susan Leigh Star)**
  *   **What it captures:** Star defined infrastructure not just as hardware, but as a set of standards and relationships that become invisible when they work. She coined the term "obduracy" to describe how infrastructure resists change. She also described "informational inversion," where you only see the infrastructure when it breaks. This matches your "hardening into the landscape" observation.
  *   **Where it misses:** Star focuses heavily on the experience of the marginalized user who doesn't fit the standard. While she acknowledges the power dynamics, her work is more descriptive of the *experience* of friction than the *rhetorical defense* of the status quo as neutral.

  **4. Naturalization (Social Theory/STS)**
  *   **What it captures:** This is the term you mentioned half-understanding. In critical theory, naturalization is the process by which historical or social constructs are made to appear natural, inevitable, or biological. When a technical default is naturalized, it is no longer seen as a decision but as a law of nature.
  *   **Where it misses:** It is indeed broad. It applies to gender roles, economic systems, and racial hierarchies. It lacks the specific *technical* granularity you need. It tells you *that* the social has become natural, but not *how* the technical configuration specifically shields itself from critique via the "neutrality" claim.

  **5. The Default Effect (Behavioral Economics)**
  *   **What it captures:** Thaler and Sunstein's *Nudge* theory documents that people overwhelmingly stick with pre-set options. This explains the *mechanism* of the lock-in (cognitive inertia).
  *   **Where it misses:** It is purely descriptive of behavior, not normative. It explains why people *don't change* the setting, but it doesn't explain why changing it is subsequently framed as a *political act* rather than just an administrative one. It lacks the moral dimension.

  ### A term, if you're coining one

  Given the gaps above, the specific rhetorical and structural move you are identifying is best termed **The Presumption of Technical Innocence**.

  **Definition:**
  A socio-technical state in which a contingent configuration (code, policy, or design) acquires the status of a neutral baseline through the passage of time and the obscuring of its origin. This status imposes an asymmetric burden of justification: maintaining the configuration requires no argument (it is "innocent" until proven guilty), while altering it is treated as an active intervention that requires positive moral or technical justification.

  **Stress-testing the edges:**

  *   **Does it apply when the original choice was deliberate and political?**
      *   *Yes, provided the intent is successfully obscured.* If the Moses bridges were defended today by saying, "We can't change the height because of structural integrity standards," rather than "to keep buses out," the Presumption of Technical Innocence is in effect. The original politics don't matter; what matters is whether the current defense relies on "technical necessity" vs. "social choice." If the original politics are *known and admitted*, the presumption collapses; it becomes "Legacy Oppression" rather than "Technical Innocence."
  *   **Does it apply to legal defaults (age of majority, driving side)?**
      *   *Yes, but with a caveat.* These are "Constitutionalized Defaults." The Presumption of Technical Innocence applies strongly here (changing the driving side is seen as chaotic/dangerous, keeping it is "safety"). However, because these are explicitly legal/social contracts rather than hidden technical configs, the "technical" part of the term strains. You might call this **The Presumption of Institutional Innocence**. The mechanism is identical: the burden of proof is on the changer, not the keeper.
  *   **Does it stop applying once people remember the history behind the choice?**
      *   *It weakens significantly.* The power of the Presumption relies on the "black box" being closed. Once the history is opened (e.g., "We know this algorithm weight was set by an intern to solve a temporary problem in 2021"), the configuration shifts from "Neutral Default" to "Legacy Debt." However, defenders may still attempt to *re-seal* the box by arguing, "Regardless of origin, changing it now is too risky." If they succeed, the Presumption survives despite the historical knowledge.

  ### Settled vs. contested

  **Settled (Consensus in STS and related fields):**
  *   **Technology is not neutral:** It is a consensus among scholars of technology that artifacts embed values, biases, and political structures, whether intentionally or accidentally.
  *   **Defaults drive outcomes:** It is empirically established that default settings determine the vast majority of user behaviors and organizational outcomes.
  *   **Infrastructure creates friction:** It is agreed that existing technical landscapes impose higher costs on change than on maintenance (obduracy).

  **Contested (Live disagreements):**
  *   **The role of intentionality:** There is ongoing debate about whether accidental bias (the intern's weights) carries the same moral weight as deliberate bias (Moses' bridges). Some argue the outcome is all that matters; others argue intent is required for political critique.
  *   **Remediability:** There is disagreement on whether "neutrality" is a achievable goal for system design. Some argue we should aim for "fair defaults"; others argue that since all design is political, we should abandon the pretense of neutrality entirely and openly argue for the values embedded in the code.
  *   **Responsibility:** It is contested how far forward a designer's responsibility extends. If an intern sets a weight that causes harm three years later, is that a failure of the intern, the governance structure, or the inevitable entropy of complex systems? Your committee's friction suggests you are living inside this specific disagreement.
