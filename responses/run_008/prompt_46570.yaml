      *   **Case 2: Universal Basic Income (UBI)**
          *   *View:* Skeptical of the *mechanism* if it disconnects income from contribution entirely, but sympathetic to the *goal* (freedom from economic necessity). However, he preferred full employment and wage income as a social organizing principle.
          *   *Basis:* *Economic Possibilities* implies a post-scarcity world where "economic necessity" is solved. But in *General Theory*, he focuses on effective demand and employment. He viewed work as a social duty in the transition period.
