          *   *Refinement:* Keynes likely prefers a Job Guarantee or high wage economy over UBI. He saw work as a bridge to the good life, not just a means to income. UBI might look like "doles" which he generally disliked compared to employment.

      *   **Case 3: The Attention Economy (Digital Leisure)**
          *   *View:* Horror. He would see streaming/algorithms as the "degraded substitute."
          *   *Basis:* *My Early Beliefs*. Moorean states of mind require active engagement, conversation, art. "The enjoyment of beautiful objects." Passive consumption is the opposite of the "art of life."
          *   *Tension:* Democratization. Keynes was an elitist but wanted the good life for *everyone*. If Netflix is the only way the working class gets access to culture (even passively), is it better than Victorian drudgery? He might concede it's better than starvation, but lament the quality.
