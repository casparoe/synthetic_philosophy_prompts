      *   *Most Dangerous Anachronism:* Quiet Quitting (Case 4). The modern concept relies on a specific psychological contract of the corporate firm and a mental health discourse Keynes didn't have. "Unemployment" meant something different to him (involuntary loss of income) than "quiet quitting" (psychological withdrawal while employed).

