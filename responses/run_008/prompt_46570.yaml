          *   *Basis:* *Economic Possibilities*. The assumption that productivity gains *must* translate to leisure, not just consumption. "We are suffering just now from a bad attack of economic pessimism."
          *   *Tension:* Keynes believed in the *capacity* to work less, but also worried about the "nervous overstrain" of sudden change. He might worry that without the "habit" of leisure, people just fill the time with mindless activity. Also, he was a pragmatist; in a slump, he might prefer job creation over hour reduction (General Theory context).
