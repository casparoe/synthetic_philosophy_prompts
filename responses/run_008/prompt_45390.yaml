      *   Is the distinction between the *Groundwork* CI and the 1797 argument clear? Yes, this is crucial for a Kant marker.

      *(Self-Correction during drafting)*: I should emphasize that while the CI is the *foundation* of Kant's ethics, the 1797 essay specifically argues from the standpoint of *Right* and the definition of a lie, rather than running the universalisation test explicitly. The student conflates the two. This is a key learning point.

      *Mark Decision:* I will stick with 64. It's a strong 2:1. It's not a 70 because the textual accuracy on the specific essay is slightly off (conflating Groundwork method with the 1797 argument) and the assessment is underdeveloped. It's not a 2:2 because the writing and grasp of the responsibility argument are very good.

