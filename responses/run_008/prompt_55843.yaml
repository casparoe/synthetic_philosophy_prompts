answer: |-
  This is an excellent exercise in close reading. Your skepticism is well-founded. As someone with a background in math and engineering, you are primed to spot category errors and unwarranted assumptions of linearity—both of which are present in this paragraph.

  The author of the history book is doing what popularizers often do: smoothing out the jagged edges of a philosophical system to make it fit a narrative (in this case, the narrative of the Bloomsbury Group's lifestyle).

  Here is an audit of the paragraph, claim by claim.

  ### 1. The Definition of "Good"
  **The Book's Claim:** Moore argued "good" is a simple, indefinable, non-natural property; utilitarians equating good with pleasure committed a definitional blunder.
  **Verdict:** **Accurate.**

  *   **The Scholar's View:** This is the core of *Principia Ethica*. Moore argues that "good" is a **primitive term**. In your terminology, it is an axiom or a base type that cannot be reduced to other types. Just as you cannot define "yellow" to someone who has never seen it (you can only point to yellow things), you cannot define "good" using natural properties like "pleasure," "evolutionary fitness," or "desire."
  *   **The Nuance:** When Moore says "non-natural," he does not mean "supernatural" or "magical." He means it is not a property that can be measured or verified by empirical science. It is a normative property, not a descriptive one.
  *   **The Blunder:** Moore calls the attempt to define "good" as "pleasure" the **Naturalistic Fallacy**. It is a category error. You can ask, "Is pleasure good?" and it makes sense. If "good" just *meant* "pleasure," the question would be tautological ("Is pleasure pleasure?"). Since the question is open, the definitions are not identical.

  ### 2. "Quietly Reinstalled Pleasure"
  **The Book's Claim:** Moore exposed the hedonist blunder but quietly reinstalled pleasure at the top of his own system (refined hedonism).
  **Verdict:** **Misleading / Technically False.**

  *   **The Scholar's View:** Moore is explicitly **anti-hedonist**. He does not believe pleasure is the *sole* good. He believes pleasure is a *component* of the good, but only when attached to the right objects.
  *   **The Distinction:** For a hedonist (like Bentham), pleasure is the *container* of value; anything inside it is good. For Moore, pleasure is the *light* that illuminates value; but what is being illuminated matters.
  *   **Why the Book Says This:** Moore does conclude that the best things in life involve pleasure. However, he argues that a world where everyone felt intense pleasure while being deceived (the "Experience Machine" argument, though Nozick coined that later) would be *less* good than a world where people felt slightly less pleasure but were in contact with truth and beauty. The book glosses over this to make Moore sound more like the utilitarians he criticized.

  ### 3. The Quote and "States of Consciousness"
  **The Book's Claim:** Moore's recipe is "certain states of consciousness... pleasures of human intercourse and the enjoyment of beautiful objects."
  **Verdict:** **Accurate Quotation, Dangerous Simplification.**

  *   **The Scholar's View:** Moore does identify these as the greatest goods. However, the structure of these states is crucial. For Moore, a valuable state of consciousness is a **compound**: it requires (1) an appropriate object (e.g., a beautiful painting, a truthful conversation) and (2) an appropriate emotional response (e.g., admiration, enjoyment).
  *   **The Error:** If you have the emotional response without the appropriate object (e.g., enjoying a fake painting you *think* is real, or enjoying cruel conversation), the value drops significantly or becomes negative. The book implies the *feeling* is the sole carrier of value. Moore insists the *object* of the feeling is part of the value equation.

  ### 4. "The More Intense the Feeling, the Better"
  **The Book's Claim:** "What matters is the feeling... and the more intense the feeling, the better."
  **Verdict:** **Explicitly Denied by Moore.**

  *   **The Scholar's View:** This is the most significant distortion in the paragraph. Moore argues that intensity is not the sole metric of value.
  *   **The Logic:** If intensity were the only metric, then a sadist deriving intense pleasure from cruelty would be generating "good." Moore explicitly rejects this. The quality of the object matters. Admiring a great work of art is better than admiring a trivial one, even if the emotional intensity is the same.
  *   **Math Analogy:** Think of value not as a scalar (magnitude of feeling) but as a vector. The magnitude (intensity) matters, but so does the direction (the object). A high-magnitude vector pointing in the wrong direction (cruelty, delusion) has negative or zero value. The book treats it as a scalar.

  ### 5. Additivity ("Sum of the Values")
  **The Book's Claim:** "The value of an evening among friends is simply the sum of the values of the individual feelings it contains."
  **Verdict:** **Contradicts Moore's Principle of Organic Unities.**

  *   **The Scholar's View:** This is a specific technical point where the book fails. One of Moore's most famous doctrines is the **Principle of Organic Unities**.
  *   **The Doctrine:** Moore states that the value of a whole is *not* necessarily proportional to the sum of the values of its parts.
  *   **Example:** A feeling of pity (painful in itself) combined with the knowledge of someone else's suffering (bad in itself) can create a whole (compassion) that is *positively* valuable. The sum of the parts is negative; the value of the whole is positive.
  *   **Why It Matters:** By saying the evening is "simply the sum," the author imposes a linear model on Moore's ethics. Moore would argue that the *context* of the conversation changes the value of the individual feelings. The whole has emergent value. This should resonate with you: it's the difference between a linear system and a non-linear one.

  ### 6. The Bloomsbury Connection
  **The Book's Claim:** Keynes and Strachey took the book as a charter for putting art and friendship above Victorian convention.
  **Verdict:** **Historically Accurate, Philosophically Ironical.**

  *   **The Scholar's View:** It is historically true that the Bloomsbury Group adopted Moore as their patron saint. They loved the idea that "states of consciousness" were the ultimate value, which justified their focus on art, sex, and conversation over religion, duty, and commerce.
  *   **The Irony:** Moore was a buttoned-up, conventional Cambridge don who wore high collars and lived modestly. He was often dismayed by how the Bloomsbury Group interpreted him. They took his meta-ethical framework (value lies in consciousness) and stripped away his rigorous constraints (the object must be true/beautiful, organic unities matter).
  *   **Verdict:** The book is right that they *used* him as a charter, but wrong to imply that their lifestyle was the logical outcome of his philosophy. It was a selective reading. They took the "pleasure" parts and ignored the "non-natural property" and "organic unity" parts.

  ### Summary Audit

  | Claim in Book | Status | Notes for a Technical Mind |
  | :--- | :--- | :--- |
  | **"Good" is indefinable/non-natural** | **Accept** | "Good" is a primitive type; defining it via natural properties is a type error (Naturalistic Fallacy). |
  | **Moore "reinstalled" hedonism** | **Reject** | Moore is not a hedonist. Pleasure is a necessary component of the highest goods, but not the definition of Good. |
  | **"Pleasures of human intercourse"** | **Accept (with caveats)** | Accurate quote, but implies the *feeling* is the value, whereas Moore requires the *object* to be worthy. |
  | **"More intense feeling = better"** | **Reject** | Moore explicitly denies this. Direction matters, not just magnitude. |
  | **Value is additive (sum of feelings)** | **Reject** | Violates Moore's Principle of Organic Unities (non-linearity). |
  | **Bloomsbury used Moore as a charter** | **Accept** | Historically true, though they misinterpreted the rigor of his system. |

  ### Conclusion for Your Reading

  The paragraph you read is a **sociological summary**, not a philosophical one. It is describing how the Bloomsbury Group *felt* about Moore, rather than what Moore actually *wrote*.

  For your purposes, you can trust the book's account of the *history* (Moore influenced Bloomsbury to value art/friendship), but you should not trust its account of the *ethics*. The author treats Moore's system as linear and hedonistic because that makes for a smoother story about bohemians rejecting Victorian norms. In reality, Moore's system was non-linear, rigid, and obsessed with the objective quality of the things being enjoyed, not just the subjective intensity of the enjoyment.

  If you carry away one correction, let it be this: Moore did not say "Follow your feelings." He said "Follow your feelings *only when* they are directed at truth and beauty, and recognize that the value of the whole experience is not just the sum of its parts."
