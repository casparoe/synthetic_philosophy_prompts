      *   *Claim 2 (Reinstalling Pleasure):* **Misleading/Inaccurate.** Moore is *not* a hedonist. He argues pleasure is *part* of the good, but not *the* good. He explicitly argues against Hedonism. However, he does value pleasure *in conjunction* with other things (like appreciation of beauty). The book makes it sound like he smuggled hedonism back in. He didn't; he expanded the ontology of value.
