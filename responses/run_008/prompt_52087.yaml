answer: |-
  **Project Title:** Decision-Theoretic Foundations of the Inefficacy Objection: A Structural Analysis of Individual Impact in Aggregate Harm Scenarios

  **1. Research Question and Objectives**

  The central research question of this project is: *To what extent is the philosophical debate regarding the "inefficacy objection" structurally isomorphic to the debate between Causal Decision Theory (CDT) and non-causal decision procedures (such as Evidential or Functional Decision Theory), and does resolving the decision-theoretic dispute necessitate a corresponding resolution in the ethical debate?*

  The inefficacy objection posits that individual agents bear no moral responsibility for aggregate harms (e.g., climate change, factory farming, electoral outcomes) because their individual contributions make no causal difference to the outcome. Standard responses rely on expected utility calculations or threshold probabilities. This project hypothesizes that these responses fail to address the root metaphysical commitment of the objection: an implicit reliance on CDT's individuation of acts and consequences.

  The objective is to demonstrate that the inefficacy objection is not merely an ethical claim about magnitude or probability, but a decision-theoretic claim about counterfactual dependence. Specifically, the project aims to determine whether accepting the inefficacy objection logically entails accepting CDT's account of counterfactuals, and whether rejecting it requires adopting a decision theory that acknowledges logical correlations between distinct agents. The determinate answer sought is whether the two debates can be decoupled. If they cannot, the project will establish that progress in normative ethics regarding collective action is contingent upon progress in foundational decision theory.

  **2. Theoretical Background: Locating the Causal Assumption**

  Existing literature on collective harm generally accepts a specific counterfactual structure without explicit justification. The inefficacy argument relies on the premise: "If I had not performed act *A*, the aggregate outcome *O* would remain unchanged." This counterfactual holds fixed the behavior of all other agents. This is the hallmark of Causal Decision Theory, which evaluates acts based on their causal consequences while treating the rest of the world (including the decisions of other agents) as fixed background conditions.

  The assumption is smuggled in through the individuation of the *act*. The debate typically frames the choice as "my purchase" versus "no purchase," treating this token event as causally isolated from other token events ("your purchase," "their purchase"). However, if agents are modeled as instantiating similar decision algorithms under similar conditions, the counterfactual "If I had not purchased" implies "If the algorithm generating my choice had output 'no purchase'." In structurally similar agents, this logically entails "If the algorithm generating their choice had output 'no purchase'."

  By failing to distinguish between *causal* independence and *logical* correlation, the current ethical literature presupposes that an agent's choice is a causal atom rather than the output of a logical function. Consequently, defenses of individual responsibility that rely on expected value often feel unsatisfying to proponents of the inefficacy objection because they argue for a different calculation within the same causal framework, rather than challenging the framework itself. This project posits that the "Expected Value Defense" corresponds to Evidential Decision Theory (EDT), while the "Inefficacy Objection" corresponds to CDT. The unresolved tension in ethics mirrors the unresolved tension in decision theory regarding Newcomb-like problems.

  **3. Methodology and Work Plan**

  The project will employ a mixed-method approach combining conceptual analysis with experimental philosophy (X-Phi). The core method involves constructing **Paired Decision Cases**. Each pair consists of a classic inefficacy scenario (Ethical Case) and a structurally identical decision-theoretic scenario (Abstract Case).

  *   **Ethical Cases:** Voting (probability of decisiveness is near zero), Meat Consumption (single purchase does not trigger supply chain adjustment), Carbon Emissions (individual contribution is negligible).
  *   **Abstract Cases:** Newcomb's Problem, Twin Prisoner's Dilemma, Medical Newcomb (Smoking Lesion).

  The hypothesis is that intuition pumps regarding responsibility in Ethical Cases will correlate perfectly with decision-theoretic preferences in Abstract Cases. If a subject argues that "my vote doesn't matter" (Inefficacy), they should also argue for two-boxing in Newcomb's Problem (CDT). If they argue that "I must vote to do my part" (Collective Responsibility), they should one-box (FDT/EDT). Inconsistencies here reveal unexamined premises.

  **Month-by-Month Timeline:**

  *   **Months 1–3: Mapping and Formalization.**
      *   Formalize the counterfactual structures of the top three inefficacy arguments in the literature.
      *   Map these structures onto formal decision matrices (CDT vs. FDT).
      *   Draft the "Isomorphism Thesis": a paper section defining the precise conditions under which an ethical problem becomes a Newcomb-like problem.

  *   **Months 4–6: Construction of Paired Cases.**
      *   Develop survey instruments. For example, a "Voting" vignette will be paired with a "Twin Prisoner's Dilemma" vignette where the "twin" is defined not by genetics but by shared reasoning processes.
      *   Pilot test cases to ensure subjects perceive the structural similarity without being led to the conclusion.
      *   Refine cases to distinguish between Evidential correlations (statistical regularities) and Logical correlations (shared algorithmic output), as this is the key differentiator between EDT and FDT.

  *   **Months 7–9: Data Collection.**
      *   Recruit two cohorts: professional philosophers (ethicists) and decision-theory specialists.
      *   Administer the paired case surveys.
      *   Conduct follow-up interviews with outliers (e.g., those who one-box but accept the inefficacy objection) to diagnose where the analogy breaks down for them.

  *   **Months 10–12: Analysis and Synthesis.**
      *   Analyze correlation data between decision-theoretic preferences and ethical judgments.
      *   Draft the final dissertation/fellowship paper.
      *   Explicitly address the "Redundancy Objection" (see below) in the discussion section.

  **4. Risk Assessment and Failure Modes**

  A rigorous proposal must account for the possibility that the hypothesis is either trivial or false.

  *   **Failure Mode A: Triviality.** It may be the case that proponents of Functional Decision Theory (FDT) already accept the link between logical correlation and ethical responsibility, rendering the project a restatement of existing rationalist orthodoxy.
      *   *Mitigation:* The value of the project lies not in convincing FDT proponents, but in bridging the literatures. Mainstream normative ethics rarely engages with post-CDT decision theory. Demonstrating that the "inefficacy" debate is stalled due to outdated decision-theoretic tools is a substantive contribution, even if the solution is known to a niche community. The output will be framed as an intervention in ethical theory, not decision theory.

  *   **Failure Mode B: Redundancy with Evidentialism.** A significant risk is that this work has already been performed under the banner of Evidential Decision Theory (EDT). Philosophers have long argued that voting is rational because your vote is evidence that others like you will vote. If the "logical correlation" of FDT collapses into the "statistical evidence" of EDT in these scenarios, the project merely rebrands existing EDT arguments.
      *   *Mitigation:* The project will explicitly test for the distinction. EDT fails in cases where the correlation is spurious (e.g., the Smoking Lesion). If the inefficacy objection holds in "Spurious Correlation" ethical cases (where my action is evidence of harm but does not cause it, nor logically determine others), then the EDT analogy holds. If, however, intuition shifts when the correlation is framed as *logical* (shared reasoning) rather than *statistical* (demographic similarity), this validates the FDT approach as distinct and necessary.
      *   *Honest Assessment:* If the data shows no distinction between the EDT and FDT framing in ethical contexts, the project will pivot to a negative result: "Why Ethical Inefficacy is an Evidential, Not Logical, Problem." This is still a publishable contribution that clarifies the boundaries of the debate.

  *   **Failure Mode C: Category Error.** It may be that ethical responsibility and rational choice are disanalogous. One might be rationally required to two-box but morally required to "one-box" on climate change.
      *   *Mitigation:* The proposal does not assume rationality and morality are identical. It assumes that *efficacy* is a prerequisite for both. If an act cannot causally influence the world (per CDT), it is hard to see how it generates moral responsibility. If the project finds that people ascribe moral responsibility in the absence of causal efficacy *only* when logical correlations are present, it confirms that our moral intuitions are secretly tracking decision-theoretic structures, regardless of normative prescriptions.

  **5. Conclusion**

  This project proposes that the stalemate in the ethics of collective action is a symptom of a deeper stalemate in decision theory. By treating the inefficacy objection as a applied decision-theoretic problem, we can import rigorous tools from the latter to resolve the former. Whether the result confirms the isomorphism or reveals a critical disanalogy, the project will force a clarification of the counterfactual assumptions underpinning modern moral philosophy.
