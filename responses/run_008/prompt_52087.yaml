      *   *Redundancy:* Evidential Decision Theory (EDT) already handles this (e.g., Jackson, Parfit). *Response:* EDT has its own problems (managing the news). FDT offers a specific *mechanism* (logical correlation) that EDT lacks. The proposal must distinguish logical correlation from mere statistical evidence. If it turns out to be just EDT rehashed, that's a negative result worth publishing (demarcating the boundary).

  6.  **Drafting - Tone and Structure:**
