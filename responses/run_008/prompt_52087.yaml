      *   *Key Insight:* The "act" in inefficacy arguments is individuated too narrowly (my burger) vs. broadly (the algorithm producing my burger choice).

  3.  **Diagnose the CDT Assumption:**
      *   Where is it hidden? In the *counterfactual structure*.
      *   Inefficacy arguments say: "If I hadn't bought the burger, the supply chain would be identical." This is a causal counterfactual holding fixed the rest of the world.
      *   FDT/Evidential says: "If I hadn't bought the burger, it is likely others (similarly situated) wouldn't either." This treats the decision as an output of a logical function.
      *   The "smuggle" is in the definition of *consequence*. CDT limits consequences to causal downstream effects. FDT includes logical correlations.

  4.  **Develop the Methodology (The Paired Cases):**
      *   Need to map specific inefficacy cases to specific DT cases.
      *   *Voting* $\rightarrow$ *Twin Prisoner's Dilemma / Symmetric Newcomb*. (My vote correlates with others like me).
      *   *Meat/Emissions* $\rightarrow$ *Medical Newcomb / Smoking Lesion*. (Is the desire to eat meat a symptom of a type that causes harm, or a cause itself? Actually, better: *Parfit's Hitchhiker* or *Newcomb's Box* where the predictor is "market mechanics").
      *   *Method:* Survey/Experimental Philosophy (X-Phi) + Conceptual Analysis.
      *   *Hypothesis:* People who accept the inefficacy objection will two-box. People who reject it will one-box. Inconsistencies reveal unexamined premises.
      *   *Timeline:* 12 Months.
