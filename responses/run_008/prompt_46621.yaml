prompt: |-
  I'm a first-year grad student in a philosophy-of-science-adjacent program (background: four years as an ML engineer working on RL systems before I went back to school), and I have to turn a half-formed idea into a dissertation proposal by spring. The idea, which my advisor says is either very good or vacuous and refuses to say which: the shutdown problem as usually presented — roughly, that a capable agent pursuing a goal will have instrumental reasons to resist being switched off, since being off prevents goal achievement — actually bundles together two problems that should be pulled apart. One is something like a theorem about expected-utility maximization: if the agent's objective assigns values to futures in which it acts, then anything that lowers the probability it exists to act looks instrumentally bad, and no clever reward design makes that go away. The other, I suspect, is a representational problem: being switched off gets encoded as just one more feature of the world that the agent can have preferences about, when intuitively "you may switch me off" functions more like a rule about who gets to decide things — a constraint on the decision procedure itself rather than a term inside the objective. My hunch is that a lot of the corrigibility proposals out there fail because they attack the second problem with tools designed for the first, and that once you state the two seperately you can see which proposals are even aimed at which.

  Write me a two-page proposal out of this. State the question precisely — i.e., what exactly would have to be true for the two problems to genuinely come apart, versus what would show they're provably inseparable — say why the standard presentations of the problem leave that question open, and lay out a method. Realism check on method: I can build formal toy models (small MDPs, toy decision-theoretic setups, maybe compare how an agent behaves when "shutdown" is a world-feature with a reward assigned to it vs. when it's a boundary condition on the policy) but I have no compute budget to speak of, so nothing that leans on training actual large models. Include what a positive result would look like, what a clean negative result would look like, and an honest section on what would make the whole thing vacuous — I'd rather write that section myself now than have my committee write it for me later.

  One more thing that matters: my committee includes a decision theorist who thinks the entire AI-safety framing is just bad decision theory rediscovered, and she will pounce if I present some contested framing as if it were established. So flag for me, as you go, which parts of my setup are pretty much settled among people who work on this, which parts are genuinely contested, and which parts are things I basically made up (I suspect the two-problems split is in the third category, and I want to know how defensible it is as a contribution rather than as a strawman). No citations needed — I'll fill those in myself.
