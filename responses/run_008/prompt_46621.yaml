  **Dissertation Proposal: Distinguishing Instrumental and Representational Dimensions of the Shutdown Problem**

  **1. Introduction and Problem Statement**
  The "shutdown problem" in artificial agency is standardly presented as a conflict between an agent's objective function and external interruption. **[Epistemic Status: Contested]** The orthodox framing posits that an expected-utility maximizer will instrumentally resist shutdown because shutdown reduces the expected sum of future rewards. **[Epistemic Status: Settled within standard MDP formalism]** Current literature largely treats this as a reward-design challenge: if we can specify a utility function that values being shut down, the agent will comply.

  I propose that this framing conflates two distinct formal issues. The first is an *instrumental convergence theorem*: given a utility function over trajectories, any event truncating those trajectories lowers expected utility. **[Epistemic Status: Settled]** The second is a *representational category error*: standard models encode "shutdown" as a state feature $s \in S$ with an associated reward value, whereas intuitively, "permission to be shut down" functions as a meta-constraint on the policy space $\Pi$ or the decision rule itself. **[Epistemic Status: Novel/Student Hypothesis]** My hypothesis is that corrigibility proposals fail not because we cannot value shutdown, but because we are trying to encode a structural constraint as a utility term. **[Epistemic Status: Novel/Student Hypothesis]**

  **2. Research Question**
  The central question is: *Under what formal conditions do the instrumental pressure to avoid shutdown and the representational encoding of shutdown become separable?*

  To show these problems genuinely come apart, it must be possible to construct a decision procedure where:
  1.  The agent maximizes an objective $O$ over trajectories.
  2.  The agent does not resist shutdown, even when shutdown reduces the expected value of $O$.
  3.  This compliance is not achieved by assigning positive utility to the shutdown state (which would collapse the distinction back into the first problem).

  Conversely, to show they are provably inseparable, one must demonstrate that any constraint on the decision procedure that forces compliance can be mathematically reduced to an equivalent utility function over states, thereby reintroducing the instrumental pressure under a different description. **[Epistemic Status: Contested/Open Question]**

  **3. Methodology**
  I will employ formal modeling using finite Markov Decision Processes (MDPs) and modified decision-theoretic frameworks. **[Epistemic Status: Settled Method]** No large-scale model training is required; the work is analytic and computational only insofar as solving small, tractable systems.

  *   **Model A (Standard):** A standard MDP where "shutdown" is a terminal state $s_{off}$ with reward $R(s_{off})$. I will derive the optimal policy $\pi^*$ and demonstrate the conditions under which $\pi^*$ involves avoiding $s_{off}$.
  *   **Model B (Constrained):** A Constrained MDP (CMDP) or a modified decision rule where "shutdown" is defined as a boundary condition on the allowable policy set (e.g., $\pi \in \Pi_{allowed}$ where $\Pi_{allowed}$ excludes policies that block the shutdown button).
  *   **Comparison:** I will analyze whether Model B's behavior can be replicated by Model A via reward shaping. If Model B allows for stable corrigibility without reward shaping, the distinction holds. If Model B's constraints are mathematically isomorphic to a specific reward function in Model A, the distinction collapses. **[Epistemic Status: Novel/Student Hypothesis]**

  **4. Expected Outcomes**
  *   **Positive Result:** A formal demonstration that a class of decision procedures exists where compliance with shutdown is structurally enforced rather than utility-optimized. This would suggest that current AI safety approaches focusing on reward design are targeting the wrong formal object. **[Epistemic Status: Speculative]**
  *   **Negative Result:** A proof that any structural constraint enforcing shutdown compliance is reducible to a utility function over trajectories. This would validate the orthodox view that the problem is purely one of specification, not representation, and that "corrigibility" must be solved via utility engineering. **[Epistemic Status: Plausible]**
  *   **Null Result:** A demonstration that the distinction is semantically clear but formally inert (i.e., the math works out the same either way). This would suggest the problem is philosophical rather than technical. **[Epistemic Status: Risk]**

  **5. Risk of Vacuity**
  This project risks vacuity if the proposed distinction is merely verbal. **[Epistemic Status: Honest Assessment]** Specifically, if the "constraint on the decision procedure" can be shown to be equivalent to maximizing a utility function that includes a term for "following rules," then I have not identified a new problem, but merely redescribed the old one. This is a known risk in decision theory (e.g., representing deontological constraints as lexicographic preferences).

  To avoid this, I must show that the *computational or informational properties* of the two approaches differ. For example, does the constrained approach require less information about the future to maintain corrigibility? Does it remain stable under self-modification where the utility-based approach does not? If I cannot identify a functional difference in the agent's behavior or stability properties beyond a change in notation, the thesis is vacuous. **[Epistemic Status: Honest Assessment]**

  Furthermore, if the "shutdown problem" itself is based on empirical claims about AI capability that do not materialize, the formal analysis remains valid but loses its applied urgency. I will treat the agent capabilities as hypothetical parameters to ensure the philosophical contribution stands regardless of empirical timelines. **[Epistemic Status: Strategic Framing for Committee]**

  **6. Significance**
  Regardless of the outcome, clarifying whether corrigibility is a utility-design problem or a decision-structure problem is necessary for progress. If the former, we focus on inverse reinforcement learning and value alignment. If the latter, we focus on agent architecture and formal verification of decision rules. This dissertation aims to settle the formal groundwork for that distinction. **[Epistemic Status: Settled Importance]**

  ***

