answer: |-
  Prioritize establishing whether the ethical prohibition on pure time preference binds individual prudence or only social evaluation, because this distinction determines whether your programme changes behavior or merely adjusts technocratic parameters.

  **1. The Scope of Bindingness (Individual vs. Impartial)**
  This is the critical bottleneck. If the Ramsey-Sidgwick argument only binds an impartial spectator sizing up social states, it leaves individual savings and consumption choices untouched, rendering the ethical case inert for the behavioral changes climate policy requires. If it binds individual deliberation, it demands a radical restructuring of rational choice theory.
  *   **Upstream of:** Justifications for mandatory savings, carbon taxation levels, and the moral weight of personal sacrifice versus state redistribution.
  *   **Recognizing Progress:** Look for a unified account of temporal neutrality that survives the "separateness of persons" objection without collapsing into demandingness objections. Progress is not consensus, but a mapped landscape of where the trade-offs lie (e.g., accepting a specific theory of personal identity over time).
  *   **Reordering Trigger:** A formal result proving that individual temporal neutrality is incompatible with rational agency would drop this to zero and shift focus entirely to institutional bypasses.

  **2. Population Ethics Compatibility**
  You asked if the debate survives unsettled population ethics; the answer is likely no, not in its current aggregative form. If the far future cannot be comparably aggregated with the present due to non-identity or variable population size, discounting welfare becomes a category error.
  *   **Upstream of:** The validity of long-termism, existential risk prioritization, and the mathematical coherence of intergenerational cost-benefit analysis.
  *   **Recognizing Progress:** A worked-out axiology that handles variable population size without the Repugnant Conclusion or Absurd Conclusion, integrated with a temporal discounting framework. If your philosophers produce a model that allows comparison without fixed population assumptions, you have bought the programme another decade.
  *   **Reordering Trigger:** A breakthrough in critical-level utilitarianism or person-affecting views that stabilizes comparability would lower this priority; conversely, a proof of impossibility for intergenerational comparison makes the rest of the agenda obsolete.

  **3. Coherence of Declining Discount Rates (DDRs)**
  This is currently a political compromise dressed as mathematics, often justified by uncertainty rather than ethics. It needs to be grounded in ethical principles (e.g., uncertainty about future values or rights) rather than calibrated to market yields.
  *   **Upstream of:** Infrastructure project appraisal, Treasury guidance (e.g., the Green Book), and the practical implementation of intergenerational equity.
  *   **Recognizing Progress:** A derivation of DDRs from normative first principles rather than statistical fitting of historical interest rates. Success looks like a formula policymakers can use that survives philosophical scrutiny.
  *   **Reordering Trigger:** A major policy moment, such as the IMF or OECD mandating DDRs for climate accounting, would instantly elevate this to Rank 1 for immediate impact.

  **Cut These "Clever" Threads**
  *   **Pure vs. Effective Rate Semantics:** Debating the label when extinction risk is already modeled explicitly adds no normative value.
  *   **Rate Calibration Wars:** Arguing over 0.1% versus 0.5% without resolving the justification for any non-zero rate is precision without accuracy.
  *   **Historical Exegesis:** Unless reading Ramsey or Sidgwick reveals a forgotten argument that solves the Individual vs. Social bind, treat it as history, not ethics.

  **Measuring Progress Without Data**
  Since you have no empirical stream, progress must be measured by **reflective equilibrium** and **policy uptake**. If your workshops produce a framework that economists can implement without violating their models and philosophers can endorse without violating their principles, you have succeeded. If the output remains a set of mutually incompatible normative claims that policymakers ignore, you have merely funded a seminar series.
