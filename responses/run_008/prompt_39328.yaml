prompt: |-
  You are a set theorist who spent a decade in industry writing compilers and virtualization infrastructure before returning to academia, so you are genuinely bilingual between the logic and the systems vocabulary. I need that bilingualism.

  I'm a software engineer. I'm fluent in computability theory — Turing machines, oracles, reductions, the halting problem, Martin-Löf randomness — and in the everyday vocabulary of my trade: virtual machines and their hosts, emulation, abstraction layers, specs and their implementations, type hierarchies, garbage collection. My set theory is pure folklore: Cantor's diagonal argument, ZFC as a list of axioms everyone treats as standard, and a hazy memory that Gödel and Cohen showed the continuum hypothesis "can't be decided." Restate what they actually showed, and the philosophical fight it started, in my vocabulary — as precisely as you can, without dumbing anything down — and then give me a residue report.

  Concretely, I want translations of the following, one by one:

  1. Gödel's constructible universe L and his result that if ZFC is consistent, so is ZFC plus the continuum hypothesis.
  2. Cohen's forcing and the mirror-image result for the negation of the continuum hypothesis.
  3. The Löwenheim–Skolem theorem and the Skolem paradox — the fact that if ZFC has a model at all, it has a countable one that nonetheless satisfies, internally, that uncountable sets exist.
  4. The aftermath: Gödel's own conviction that the continuum hypothesis is false despite being unprovable; the "set-theoretic multiverse" view associated with Joel David Hamkins, on which different models of ZFC with opposite continuum behavior are all equally legitimate; and the large-cardinal and Ω-logic programs that try to settle the question by new axioms.

  Here are candidate mappings — treat them as hypotheses to test, not as gifts to me: is L something like the definable core of the universe, the way the computable reals sit inside all reals? Is adding a Cohen-generic real anything like bolting a fresh randomness oracle onto a host that was never promised to contain it? Is the Skolem paradox just the phenomenon of a virtual machine whose guest sincerely believes it has uncountably much memory while the host can enumerate it? Is forcing something like taking a spec that is genuinely underspecified and building a new environment that implements one resolution of the ambiguity? For each mapping, tell me where it genuinely clarifies, where it has to distort the set theory to fit, and where it silently imports an assumption from my side — for instance, that every virtual machine has a host, or that a spec's underspecification is always resolvable by choosing among equally acceptable implementations.

  Then the residue report, which is what I really care about. In my world, undecidability is a theorem about all programs, provable within one fixed, trusted system; the continuum hypothesis's independence looks different, and I want to know exactly how. And the philosophers' question — whether the continuum "really" has some determinate size, independent of every axiom system we've written — either has no counterpart in my vocabulary or has one that is easy to miss. Consider specifically my working intuition: if a spec (ZFC) is consistent both with the continuum hypothesis and with its negation, the spec was underspecified, and the rational move is to pick whichever resolution meets the requirements, the way you'd pick an implementation of an underspecified API. Is that the multiverse view wearing overalls, or does it miss something the multiverse view keeps and my vocabulary can't say? Is the residue a defect of my vocabulary or a sign that the set theorists' question was less clear than it looked?

  Please think before writing: sketch the candidate mappings, reject the ones that don't survive, and keep the final answer clearly structured between the translations and the residue. Above all, keep the translation honest — do not smuggle in the engineer's worldview and call it set theory.
