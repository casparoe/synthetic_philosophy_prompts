  **Proposed Experiment:**
  **Single-Trial Ramp Detection via Machine Learning.**
  Instead of averaging EEG traces across hundreds of trials (which creates the smooth RP ramp), train a classifier on high-density EEG to detect pre-movement neural ramps in *single, unaveraged* trials.
  *   **Direction of Change:** If the classifier can reliably predict movement onset time from single-trial neural data significantly earlier than the stochastic model predicts (and consistent across trials), this would suggest the RP is a genuine physiological signal rather than statistical noise, moving **Term 1 upward** (e.g., from 0.35 to 0.60) and consequently raising the final credence.
