      Retrospective timing reports are known to be reconstructive and subject to post-action bias, making it unclear if 'W' marks the true onset of conscious intention.
  3.  **$P(\text{Prior Decision Objection Fails}) = 0.55$**
      Subjects consciously decide to adopt a "move soon" policy before the trial begins, suggesting the specific movement executes a prior conscious plan rather than a novel unconscious initiation.
  4.  **$P(\text{Veto Does Not Restore Causal Efficacy}) = 0.70$**
      Even if initiation is unconscious, the proven ability to veto implies consciousness performs causal work, mitigating the claim that it does "no causal work" in a meaningful sense.

