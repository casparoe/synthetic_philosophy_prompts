prompt: |-
  I'm talking to my department's psych reading group next month about the free energy principle — thirty minutes, whiteboard, audience is social psych grad students, so they're comfortable with stats and standard cognitive science vocabulary but have never actually read Friston, most of them just know his name gets thrown around. Plan the session for me; don't just explain the principle, I need the plan.

  Main things I want sorted: the ordering. I keep flip-floping between starting with Helmholtz-style perception-as-inference (so the brain-as-scientist image is in place first) and starting with prediction error minimization directly. My worry is one of these makes the "free energy" concept feel like a tacked-on gimmick rather than the natural next step, but I can't tell which. Then the carrying example — I've been using the Necker cube but I suspect it's too cute, and more importantly it's passive, it does nothing to set up action. Is there one example that can carry perception AND action, or should I switch examples partway through, and if so where?

  Misconceptions: I know three are coming. "Free energy IS prediction error" (which is close enough to right in one special case that a flat denial will lose them), "the whole thing just says the brain is lazy and economizes effort," and "it's unfalsifiable, so why does anyone care." For each, tell me where in the sequence it needs to be headed off and whether it's better to defuse it preemptively or let someone raise it. And is there a fourth misconception, worse than these, that I'm not anticipating?

  Also: what should I openly refuse to cover in thirty minutes — the variational math, active inference in full, the extension to self-organization in cells and literally everything alive — and how do I declare something off-limits without it sounding like a dodge?

  End with a final line in exactly this form, one short phrase, no sentence around it:

  \final{...}

  ...giving the single misconception most likely to sink the whole session if it isn't headed off.
