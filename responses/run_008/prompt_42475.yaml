answer: |-
  ### Session Plan: The Free Energy Principle in 30 Minutes

  **Audience:** Social Psych Grad Students (Stats-literate, CogSci familiar, Friston-naive).
  **Goal:** Intuition over derivation; Function over physics.
  **Whiteboard Strategy:** Divide board into three vertical sections. Left: Perception. Center: The Problem (Intractability). Right: Action.

  #### 1. Ordering: Helmholtz First, Free Energy Second
  **Decision:** Start with **Helmholtz (Perception as Inference)**.
  **Why:** If you start with Prediction Error Minimization (PEM), you have a mechanism but no *reason*. If you start with Free Energy, you have math but no *meaning*.
  **The Flow:**
  1.  **Helmholtz (5 mins):** Establish the "Brain as Scientist." The brain holds a generative model ($P(world, sensation)$). Perception is inferring causes from sensations.
  2.  **PEM (5 mins):** How does it update? By minimizing the gap between prediction and input.
  3.  **The Pivot (5 mins):** Exact Bayesian inference is computationally intractable (the "integration problem"). You can't calculate the true posterior.
  4.  **Free Energy (10 mins):** Free Energy is not a new goal; it is an **upper bound** on surprise that *is* tractable. Minimizing Free Energy minimizes Prediction Error *approximately*. This prevents FEP from feeling like a gimmick; it becomes the mathematical workaround that makes Helmholtz possible.

  #### 2. The Carrying Example: The Coffee Cup (Perception + Action)
  **Decision:** Ditch the Necker Cube. It is passive and fails to motivate action. Use **Reaching for a Coffee Cup**.
  **Why:** It unifies perception and action in one narrative, crucial for social psych (agents interacting with environments).
  **Execution:**
  *   **Perception (Left Board):** You see a blurry shape. Your model predicts "Cup at location X." Visual input says "Cup at location X + noise." You update the internal model to minimize prediction error.
  *   **Action (Right Board):** You want to grasp the cup. You have a prior preference ("Hand touches Cup"). Your proprioception says "Hand is far from Cup."
  *   **The Switch:** You can minimize this error two ways: (1) Change your mind (hallucinate touching the cup) or (2) Move your hand.
  *   **Active Inference:** The brain minimizes Free Energy by acting on the world to make sensations match predictions. This sets up the transition to Active Inference naturally without switching examples.

  #### 3. Misconception Management

  **1. "Free Energy IS Prediction Error"**
  *   **Status:** Technical confusion.
  *   **Timing:** **Preemptive** (Minute 15, during the "Pivot").
  *   **Strategy:** Draw the inequality on the board: $Free Energy \geq Surprise$. Explain that Prediction Error is a component of Free Energy, but Free Energy includes a complexity term (divergence from the prior). If you don't show the bound, they will assume equivalence.
  *   **Verdict:** Defuse preemptively. If you wait, the math won't make sense.

  **2. "The brain is lazy / economizes effort"**
  *   **Status:** Folk psychology error.
  *   **Timing:** **Reactive** (Q&A).
  *   **Strategy:** Let someone raise it. It's a common intuition. Correct it by distinguishing *metabolic* effort from *informational* surprise. FEP doesn't say "do less work"; it says "avoid states you can't model." Sometimes that requires huge effort.
  *   **Verdict:** Let them raise it. It validates their intuition before you refine it.

  **3. "It's unfalsifiable / explains everything"**
  *   **Status:** Philosophical critique.
  *   **Timing:** **Reactive** (Q&A/Close).
  *   **Strategy:** Acknowledge this is the standard critique. Frame FEP like Natural Selection: it's a principle, not a specific model. You falsify specific *instantiations* (e.g., "Does this specific neural circuit minimize FE?"), not the principle itself.
  *   **Verdict:** Let them raise it. It shows you're aware of the field's limits.

  **4. The Fourth (Deadliest) Misconception: "The Dark Room Problem"**
  *   **Status:** Empirical absurdity.
  *   **The Claim:** "If organisms minimize surprise, why don't we just sit in a dark, silent room forever? That's the most predictable state."
  *   **Why it sinks the session:** It makes the theory sound empirically false immediately.
  *   **Timing:** **Preemptive** (Minute 20, during Action).
  *   **Strategy:** Raise it yourself before they do. "Now, you might ask: why don't we just hide in a dark room?" Explain **Prior Preferences**. We have built-in priors that expect "being fed," "being social," "being alive." Violating *those* priors generates massive surprise. We act to fulfill complex preferences, not just minimize sensory input.
  *   **Verdict:** Defuse preemptively. This is the "gotcha" that ends credibility if left unanswered.

  #### 4. Scope Management: What to Exclude
  You cannot cover variational calculus, Markov Blankets in depth, or biological self-organization in 30 minutes.
  **How to declare it off-limits:**
  Do not apologize. Frame it as a **feature of the session design**, not a limitation of your knowledge.
  **Script:** "FEP derives from statistical physics and applies to cells and ecosystems. Today, we are treating the math as a black box to focus on its utility as a **functional framework for cognitive science**. We're looking at the 'what' and 'why' for behavior, not the thermodynamic derivation."
  **Specific Exclusions:**
  *   **Variational Math:** No integrals. Use the inequality bound instead.
  *   **Markov Blankets:** Mention the term as "the boundary between self and world," but do not draw the graph.
  *   **Universal Life:** Explicitly state, "We are focusing on the cognitive agent today."

  #### 5. Whiteboard Layout Summary
  *   **Left:** Generative Model ($World \to Sensation$) + Prediction Error Loop.
  *   **Center:** The Inequality ($F \geq -\ln P(o)$) + "Complexity vs. Accuracy" trade-off.
  *   **Right:** Active Inference Loop (Action changes World to match Prediction) + "Prior Preferences" (to solve Dark Room).

  \final{The dark room problem}
