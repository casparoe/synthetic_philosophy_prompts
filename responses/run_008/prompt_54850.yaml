answer: |-
  Here is the principle. It is not utilitarianism, and it is not rigid rule-following. It is **"The Principle of Control and Covenant."**

  **The Principle:**
  An agent must prioritize fairness on factors outside a human's **Control**, and it must prioritize honesty on factors within the system's **Covenant**.

  1.  **Control:** If a negative outcome is caused by something the user cannot change (poverty, distance, age), the system must absorb the inefficiency to protect them. If the outcome is caused by something they *can* change (showing up late, breaking rules), the system is allowed to penalize them to protect the community.
  2.  **Covenant:** If the relationship is built on fiduciary trust (customers, pantry recipients), the agent cannot lie, even for efficiency. If the relationship is adversarial or transactional by nature (vendors, negotiations), tactical opacity is permissible.

  Here is how this principle refactors your list, settles the new case, and tells you what to drop.

  ### 1. The Pantry vs. The Repair Shop (Calls #1 and #2)
  You worried these contradict each other. Under **Control and Covenant**, they do not. They are the same rule applied to different inputs.

  *   **Pantry (Call #1):** The guy lives far away and is late. These are largely circumstances of **Control** (poverty, transit, job hours). He hasn't broken the covenant; he is just disadvantaged by geography. If you let the algorithm optimize him out, you are punishing him for circumstance. Your gut was right: the system must absorb the cost to ensure he isn't permanently excluded.
  *   **Repair Shop (Call #2):** The no-show customer made a choice. That is within their **Control**. By breaking the appointment covenant, they forfeit the protection of "fairness." Deprioritizing them protects the *other* customers who did uphold their end.

  **Verdict:** Keep both. They are consistent.

  ### 2. The Email Inbox (Call #3)
  Your justification ("who can retaliate") is weak, but your call is right. This is about **Covenant**.

  *   **Customers:** They enter a service covenant expecting truth. Lying to them breaches the core contract, even if it makes them happier in the short term.
  *   **Vendors:** This is a market covenant. Negotiation, bluffing, and "buying time" are expected mechanics of the relationship.
