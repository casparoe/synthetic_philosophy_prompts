      *   *Conclusion:* "Speaker meaning never exceeds conventional meaning + hearer's fallible guesswork."
      *   *Gricean Correction:* Speaker meaning *does* exceed conventional meaning, but the excess is *speaker-intended inference*, not *hearer guesswork*. So the conclusion is false because it mischaracterizes the "excess" component. It's not a guess; it's a recognized intention.

