      *   *Claim 6: Conclusion (Speaker meaning <= Convention + Hearer Guess).*
          *   *Gricean View:* This follows from the previous errors. If speaker meaning includes *implicature*, and implicature is intended by the speaker (not just a hearer guess), then speaker meaning *does* exceed conventional meaning. But it exceeds it via *inference grounded in speaker intention*, not just "hearer's fallible guesswork."
