answer: |-
  The actuary's logic is internally consistent but morally insufficient because it relies on a "person-affecting" view of harm that implies we cannot wrong anyone by creating them into a miserable world, a conclusion most philosophers reject.

  What you are encountering is a classic formulation of Derek Parfit's Non-Identity Problem, introduced in his 1984 book *Reasons and Persons*. The actuary is correct that if we accept the "Person-Affecting Principle"—the idea that an act is wrong only if it makes some particular person worse off than they would otherwise have been—then Plan A cannot be said to harm the residents of 2095. Their alternative under Plan B is non-existence, and assuming their lives under Plan A are still worth living (even if difficult), they are not worse off than never having been born. However, the flaw lies not in the deduction, but in the premise. Most contemporary ethicists argue that the Person-Affecting Principle is inadequate for intergenerational justice because it ignores impersonal badness and rights violations.

  First, consider the impersonal comparison. We can judge states of affairs as better or worse without referencing specific individuals. A world where the aquifer collapses and farming is impossible is objectively worse than a world where the aquifer is sustainable, regardless of who inhabits either timeline. By choosing Plan A, you are bringing about a worse state of affairs. If morality is about making the world better rather than just avoiding harm to specific identifiable subjects, Plan A is wrong because it degrades the world's condition for whoever ends up living in it.

  Second, consider a rights-based objection. You can argue that future people have a right to certain baseline conditions—such as access to water or a viable economy—regardless of whether they would have existed otherwise. If you knowingly create a person into a situation where their rights are violated, you have wronged them, even if their alternative was non-existence. Think of it like a medical analogy: if a couple knows that conceiving now will result in a child with a painful, chronic condition, but waiting two months will result in a different, healthy child, most people agree they have a moral obligation to wait. The child born with the condition cannot say "I'm worse off than I would have been," because otherwise they wouldn't exist. Yet, the parents still acted wrongly by creating a child into suffering when they could have created a different child into health.

  Finally, the actuary's argument creates a perverse incentive structure that undermines stewardship. If his logic holds, then any long-term damage is permissible as long as the policy changes the timing of conception enough to alter the identity of future victims. This renders the concept of sustainability meaningless. As a hydrologist, you know that aquifer collapse is a systemic failure, not just a sum of individual hardships. The moral weight lies in the preservation of the system itself, which holds value independent of the specific identities of the people who rely on it. Plan A is wrong not because it hurts specific future individuals compared to their alternative, but because it violates a duty to maintain a viable world for whoever comes next.
