answer: |-
  1. A national health ministry must fund exactly one of three settlement projects that bring additional citizens into existence: Project Alpha creates 1,000 flourishing lives, Project Beta creates 100,000 barely tolerable lives, and Project Gamma creates 5,000 lives of net suffering.
  2. The asymmetry rules out Project Gamma as pro tanto wrong but generates no positive reason to prefer Alpha or Beta, leaving the choice between the two good-life options entirely unranked.
  3. Completing the view with total utilitarianism mandates Project Beta, importing the Repugnant Conclusion, while average utilitarianism mandates Project Alpha, importing the verdict that a small flourishing elite outweighs a vast multitude of decent existences.
  4. The forced choice between two permissible populations forces the asymmetry to borrow a ranking principle, whereas allowing inaction would let the asymmetry simply veto Gamma without needing to compare Alpha and Beta.
  5. The defender may argue that silence does not imply arbitrariness, contending that ordinary non-population-specific moral reasons can decide between Alpha and Beta without committing to a comprehensive axiology like total or average utilitarianism.
