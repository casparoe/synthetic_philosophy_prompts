answer: |-
  ### Preliminary Brainstorming: Mapping the Terrain

  Before establishing an agenda, we must disentangle two distinct activities often conflated in public discourse: **comparison** (identifying structural or moral analogies to gain understanding) and **ranking** (establishing a hierarchy of severity or moral worth).

  *   **Comparison** is epistemologically necessary. We cannot understand the Holocaust without comparing it to other colonial exterminations, nor can we prosecute war crimes without comparing acts to legal precedents.
  *   **Ranking** is often politically toxic but institutionally unavoidable. Courts must sentence; museums must curate (which implies selection and prioritization); reparations committees must allocate funds.

  The central tension of your book is not whether comparison is *possible* (we do it constantly), but whether *ranking* is *legitimate*, and under what constraints.

  Many debates in this field stall because participants are arguing past one another regarding the **function** of the comparison. A lawyer comparing atrocities to establish precedent is playing a different language game than a mourner comparing grief to find solidarity, or a politician comparing crimes to deflect blame.

  Therefore, the most productive philosophical work here is not metaphysical (are they *really* comparable?) but **functional and normative** (what work is this comparison doing, and is it just?).

  ***

  ### Prioritized Conceptual Agenda

  Here is my proposed ordering of conceptual questions for a three-year philosophical project. I have reordered your candidates and introduced two new ones that I believe are more upstream.

  #### 1. The Teleological Question: "Comparison for What Purpose?"
  **Status:** *Highest Priority (Upstream)*

  **The Question:** Does the legitimacy of comparing or ranking atrocities depend entirely on the institutional or moral goal of the comparison (e.g., legal sentencing, historical explanation, communal mourning, political prevention)?

  **Why it is Upstream:**
  You cannot determine if an axis of comparison is "arbitrary" (your candidate #2) until you know what the comparison is *for*.
  *   If the goal is **legal sentencing**, ranking by *intent* and *scale* is necessary and non-arbitrary.
  *   If the goal is **commemoration**, ranking by *scale* might be obscene; uniqueness or specific cultural impact might matter more.
  *   If the goal is **prevention**, ranking by *structural replicability* is key, regardless of death toll.
  Without settling the teleology, debates about incommensurability or axes are category errors. A comparison that is valid in a courtroom may be invalid in a memorial service.

  **Why it is Tractable for a Philosopher:**
  This requires conceptual analysis and normative ethics, not archival discovery. You are analyzing the *norms of practices* (legal, commemorative, pedagogical). You can draw on speech act theory and institutional ethics rather than needing to resolve historical disputes about specific death tolls.

  **What Would Move It Down:**
  If you discover that all contexts inevitably collapse into a single metric (e.g., "suffering") regardless of stated intent, the teleological distinction dissolves. However, current scholarship suggests these contexts are distinct.
  **What Would Move It Up:**
  If you find that "memory politics" (your candidate #3) is entirely driven by conflicting teleologies (e.g., victims want mourning, states want closure), this becomes the master key to the whole book.

  #### 2. The Ontological Question: "What is the Unit of Comparison?"
  **Status:** *High Priority (Foundational)*

  **The Question:** When we say Atrocity A is "worse" or "similar" to Atrocity B, what are the relata? Are we comparing *events* (bounded in time), *structures* (colonialism, totalitarianism), *intentions* (genocidal will), or *outcomes* (suffering, death counts, intergenerational trauma)?

  **Why it is Upstream:**
  Claims of "incommensurability" (your candidate #1) often stem from comparing different units. If Group X compares *intent* (we meant to destroy them) and Group Y compares *outcome* (more people died here), they will talk past each other forever. Clarifying the unit of analysis is a prerequisite for defending axes of comparison against charges of arbitrariness.

  **Why it is Tractable for a Philosopher:**
  This is a metaphysical and semantic problem. Historians describe the events; philosophers analyze the categories we use to bucket those events. You can engage with literature on "kind-making" and moral ontology without needing to verify historical data yourself.

  **What Would Move It Down:**
  If you conclude that the "unit" is always inevitably hybrid or fuzzy, you may need to pivot to a pragmatist approach (it doesn't matter what the unit *is*, only what the comparison *does*).
  **What Would Move It Up:**
  If you find that the "Oppression Olympics" (your candidate #4) is primarily caused by unit-confusion (e.g., comparing my *pain* to your *death*), this becomes the primary diagnostic tool for the book.

  #### 3. The Ethical Question of Positionality: "Who is Comparing Whom, and To Whom?"
  **Status:** *High Priority (Normative Core)*

  **The Question:** Is the moral hazard of ranking intrinsic to the act, or does it depend on the power dynamics between the comparator, the victims, and the audience? (e.g., Is it different when a perpetrator state compares its crimes to others vs. when a victim group does so?)

  **Why it is Upstream:**
  This addresses the "obscene exercise" charge directly. A comparison made by a descendant of victims to find solidarity functions differently than a comparison made by a bystander to minimize guilt. The "harm" is not in the math; it is in the speech act's context. This refines your candidate #4 (harms of comparison).

  **Why it is Tractable for a Philosopher:**
  This draws on ethics of care, testimonial justice (Fricker), and speech act theory. It requires analyzing power structures and moral standing, which is core philosophical training, rather than historical reconstruction.

  **What Would Move It Down:**
  If you determine that *all* ranking is inherently objectifying regardless of who does it (a strict deontological view), then positionality matters less.
  **What Would Move It Up:**
  If case studies show that "good" comparisons (those that aid justice) are distinguished solely by the authority of the speaker, this becomes the central ethical criterion of the book.

  #### 4. The Metaphysical Question: "Incommensurability vs. Difficulty"
  **Status:** *Medium Priority (Constraint)*

  **The Question:** Are atrocities incommensurable in principle (no common measure exists), or is this merely an epistemic limitation (we lack the data or moral language)?

  **Why it is Lower Priority:**
  This is often a "dead end" in isolation. Philosophers like Ruth Chang have done extensive work on "hard cases" and comparability. Staking a book on proving commensurability is metaphysically risky and often irrelevant to practice. Courts *must* act as if things are commensurable. It is more productive to treat incommensurability as a *pragmatic warning sign* rather than a metaphysical truth.

  **Why it is Tractable:**
  It is pure analytic philosophy. However, it risks becoming abstract and disconnected from the "history of ideas" aspect of your expertise.

  **What Would Move It Up:**
  If you find that the *belief* in incommensurability is the primary driver of memory conflicts (i.e., people fight because they think their pain *cannot* be compared), then analyzing this belief becomes crucial, even if the belief is metaphysically false.

  #### 5. The Rhetorical Question: "Uniqueness as Description vs. Positioning"
  **Status:** *Lowest Priority (Derivative)*

  **The Question:** Do claims of uniqueness function as defensible description or as rhetorical positioning?

  **Why it is Lowest Priority:**
  This is downstream of the previous four. Uniqueness claims are usually tools used to secure specific teleologies (Q1) regarding specific units (Q2) by specific actors (Q3). Treating "uniqueness" as a standalone metaphysical category often leads to definitional stalemates (e.g., "Is the Holocaust unique?"). It is better analyzed as a *move* in a memory political game.

  **Why it is Tractable:**
  It is rhetorical analysis. But focusing too much here risks getting bogged down in specific historical case studies (Holocaust, Armenia, Rwanda) rather than the conceptual framework.

  **What Would Move It Up:**
  If you argue that "uniqueness" is the primary linguistic mechanism by which incommensurability is enforced, it becomes a key case study for the metaphysical question.

  ***

  ### Overrated Topics and Dead Ends

  To protect your three-year timeline, I advise treating the following with caution:

  1.  **Definitionalism (The "G-Word" Debate):**
      *   *The Trap:* Spending years arguing about the precise legal definition of genocide (UN Convention vs. scholarly definitions).
      *   *Why Avoid:* This is largely settled in legal philosophy and is a historical/legal minefield. As a philosopher, you should take the definitions as *given contexts* and analyze the moral implications of applying them, rather than fighting over the boundary lines themselves.
      *   *Pivot:* Instead of "Is X genocide?", ask "What moral work does labeling X genocide perform?"

  2.  **Abstract Calculus of Suffering:**
      *   *The Trap:* Trying to create a universal formula for weighing pain (e.g., is 10,000 sudden deaths worse than 10,000 prolonged tortures?).
      *   *Why Avoid:* This leads to the "moral bookkeeping" charge you wish to avoid. It is philosophically fraught and practically useless.
      *   *Pivot:* Focus on *contextual weighting*. How do courts weigh this? How do mourners weigh this? Descriptive ethics of valuation is better than prescriptive moral math.

  3.  **The "First" Genocide:**
      *   *The Trap:* Historical priority contests.
      *   *Why Avoid:* This is purely historical/archival. It adds little to the *ethics* of memory.
      *   *Pivot:* Analyze why the claim to "firstness" matters morally (usually to establish precedent or primacy of victimhood).

  ### Strategic Advice for the Project

  **The "Philosopher Alone" Constraint:**
  You cannot out-historian the historians. If your argument relies on proving that Atrocity A had a higher death toll than Atrocity B, you are vulnerable. If your argument relies on showing that *using* death tolls as the primary metric in a commemorative context is *category error*, you are on solid philosophical ground.
  *   *Stay Normative:* Focus on the *ought* and the *meaning*, not the *is*.
  *   *Stay Structural:* Analyze the logic of the arguments used in memory politics, not the historical accuracy of the claims.

  **The Three-Year Arc:**
  *   **Year 1 (Foundations):** Tackle Q1 (Teleology) and Q2 (Ontology). Establish the framework that comparison is context-dependent.
  *   **Year 2 (Ethics):** Tackle Q3 (Positionality) and the "Harm" question. Develop the ethical guidelines for when comparison becomes obscene.
  *   **Year 3 (Application):** Apply the framework to specific "hard cases" (e.g., Holocaust uniqueness, colonial genocide comparisons, competitive victimhood in the Balkans) not to solve the history, but to show how your framework clarifies the debate.

  **Final Thought:**
  The most defensible position for a philosopher in this field is **Contextual Pluralism**. Argue that there is no "View from Nowhere" for ranking atrocities. There is only the view from the courtroom, the view from the memorial, and the view from the classroom. Each has its own internal logic, and the moral sin occurs when we apply the logic of one (e.g., legal ranking) to the domain of another (e.g., communal grief). This avoids the charge of "moral bookkeeping" while acknowledging the "practical necessity" of comparison in specific institutions.
