answer: |-
  Your tentative principle—responsibility weighted by available action and personal cost—is a strong foundation. It aligns with the philosophical concept that "ought implies can." However, as you have correctly identified, it fails to account for **structural authority**, **professional norms**, and the **moral necessity of a remedy** when harm occurs without a specific negligent actor. It is too focused on the *moment of failure* (ex post) and ignores the *moment of deployment* (ex ante) and the *distribution of benefit*.

  To resolve the conflicts in your cases (specifically the Lawyer vs. Doctor asymmetry and the "Drifting AI" dilemma), I propose replacing your tentative principle with **The Principle of Custodial Accountability**.

  ### The Principle of Custodial Accountability

  **Statement:**
  Responsibility for harm caused by a semi-autonomous system is assigned based on **Custodial Authority**, defined by three tiers:

  1.  **Individual Custody (The Operator):** A human operator bears responsibility only if their reliance on the system violated **Professional Norms of Verification** *and* was not negated by **Structural Coercion**.
      *   *Verification:* Could the error be detected by a reasonable check standard for that profession?
      *   *Coercion:* Did institutional incentives or constraints make intervention prohibitively costly to the operator's livelihood or safety?
  2.  **Organizational Custody (The Deployer):** If Individual Custody is negated (by lack of control, coercion, or reasonable reliance), responsibility defaults to the **Deploying Entity** (vendor or institution). This entity bears **Residual Liability** for harms arising from the system's operation, regardless of negligence, because they captured the efficiency benefits and defined the risk envelope.
  3.  **The Accountability Gap:** If the Deploying Entity no longer exists or cannot be held to account, the moral burden falls on the **Regulatory Body** that certified the system. A harm cannot morally vanish; it must rest somewhere in the chain of authority.

  ---

  ### Application to Your Six Cases

  Here is how this principle repairs the inconsistencies in your verdicts:

  **1. The Known Defect (Vendor ships despite docs)**
  *   **Verdict:** Company fully culpable; individuals innocent.
  *   **Analysis:** **Organizational Custody.** The decision to ship was an organizational risk calculation, not an individual engineering error. The individuals lacked the *Authority* to stop the release (Structural Coercion). The Company captured the benefit of early release and thus bears the liability.
  *   **Fit:** Matches your verdict perfectly.

  **2. The Undiscoverable Defect (Lightning strike)**
  *   **Verdict:** No individual blame; Company bears Residual Liability.
  *   **Analysis:** **Organizational Custody.** Individual Custody is zero (no available action). However, under your tentative principle, responsibility vanishes. Under Custodial Accountability, the Vendor introduced the risk into the public sphere for profit. They bear the cost of "unknown unknowns" as the price of doing business.
  *   **Fit:** Resolves your discomfort. The family has someone to hold accountable (the Vendor), satisfying the moral need for restitution without requiring individual malice.

  **3. The Automated Ship (Officer slow to react)**
  *   **Verdict:** Split blame.
  *   **Analysis:** **Shared Custody.** The Officer had *Individual Custody* (duty to monitor), but the cost of vigilance was high (cognitive load), reducing their share. The Vendor shares *Organizational Custody* for designing an interface that induced complacency.
  *   **Fit:** Matches your verdict.

  **4. The Lawyer (Fake citations)**
  *   **Verdict:** Full blame on lawyer.
  *   **Analysis:** **Individual Custody.**
      *   *Verification:* High. Checking a citation is a core, low-cost professional norm.
      *   *Coercion:* Low. No structural penalty for taking time to verify.
      *   *Reliance:* Unreasonable. A lawyer is an officer of the court; the tool is a servant, not a partner.
  *   **Fit:** Matches your verdict.

  **5. The Hospital Triage (Algorithm flags low priority)**
  *   **Verdict:** Split blame (Principled).
  *   **Analysis:** **Shared Custody.**
      *   *Verification:* Low/Moderate. A manual exam is possible but costly in time and resources, and medical diagnosis is inherently probabilistic (unlike legal citations).
      *   *Coercion:* High. The tool was likely imposed by hospital administration to manage flow.
      *   *Distinction from Case 4:* The lawyer delegated *judgment* (which is non-delegable). The doctor delegated *data processing* (which is delegable, but retains final oversight). The doctor's reliance was *partially reasonable* given the opacity of the tool's calibration, but their professional duty prevents total exoneration.
  *   **Fit:** Explains the split you felt was unprincipled. The split exists because the Doctor retains *Individual Custody* of the patient's life, but the Hospital/Vendor shares *Organizational Custody* for the tool's reliability.

  **6. The Penalized Operator (Override hurts rating)**
  *   **Verdict:** Blame designer/incentive setter.
  *   **Analysis:** **Individual Custody Negated.** The operator had an available action, but the *Cost* was structural coercion (career damage). Responsibility shifts up the chain to the Designer who set the incentive structure.
  *   **Fit:** Matches your verdict.

  ---

  ### The Drifting AI Case

  **The Scenario:** A system certified safe at deployment drifts over months into lethal behavior. No human could have anticipated or prevented the specific drift at any moment.

  **The Verdict:**
  Under **The Principle of Custodial Accountability**, the **Vendor (Deployer) is fully responsible.**

  **The Reasoning:**
  Your tentative principle exonerates everyone because no *preventive action* was available at the moment of failure. This treats the death as a "natural disaster." Custodial Accountability treats it as a **Product Liability** issue.
  1.  **Benefit-Burden Alignment:** The vendor sold a system that learns. The efficiency gains from "learning" belong to the vendor (or the buyer). Therefore, the risks of "drifting" must also belong to them.
  2.  **Residual Liability:** By deploying a system whose future states are not fully determined at launch, the vendor accepts **Strict Liability** for those states. They are the "Guarantor of Safety." If the guarantee fails, they pay, even if they were not negligent.
  3.  **Moral Necessity:** As you noted, a death cannot belong to no one. If we cannot blame a person, we must blame a Role. The Role of "Vendor" includes the obligation to make the victim whole.

  **What This Costs You:**
  To accept this verdict, you must surrender the idea that **Responsibility requires Fault.**
  *   In the Drifting AI case, the engineers did nothing *wrong*. They were not negligent.
  *   This principle imposes liability without moral culpability (negligence). It shifts the framework from **Retributive Justice** (punishing the wicked) to **Restorative Justice** (compensating the harmed).
  *   You must accept that the Vendor is being used as a "deep pocket" not because they sinned, but because they are the only agent capable of absorbing the loss and insuring against future risk.

  ---

  ### New Test Cases

  To further stress-test this principle, consider these three scenarios:

  **Case A: The Open Source Model**
  A developer releases a powerful open-source model for free, with a disclaimer: "For research only." A bad actor fine-tunes it to create a bioweapon.
  *   **Verdict:** No responsibility for the developer.
  *   **Reasoning:** **Organizational Custody** requires a deployment relationship. By releasing it open-source without a commercial contract or specific integration, the developer relinquished *Custodial Authority*. They did not capture the benefit of the specific use case. The *Bad Actor* assumes full **Individual Custody**.

  **Case B: The Jailbroken Kiosk**
  A bank uses a verified AI kiosk. A customer physically tampers with the sensor and tricks the kiosk into opening the vault. The system logs the tampering but fails to lock down.
  *   **Verdict:** Split blame, mostly on the Bank (Deployer).
  *   **Reasoning:** The Customer has **Individual Custody** for the crime. However, the Bank has **Organizational Custody** for the physical security design. If the system was easily jailbroken, the Vendor shares liability for poor hardening. The Bank is responsible for placing a fragile system in a hostile environment.

  **Case C: The Legacy Update**
  A vendor sells a system. Five years later, they push a software update that inadvertently breaks a safety feature. The customer refuses the update due to cost. The old system fails safely. Two years after that, the customer finally updates, and the system fails lethally due to the old bug.
  *   **Verdict:** Vendor bears Residual Liability.
  *   **Reasoning:** **Organizational Custody** persists through the lifecycle. The Vendor introduced the latent defect. While the Customer had *Individual Custody* to delay the update, the defect originated in the Vendor's code. The Vendor's responsibility decays over time but does not vanish for latent defects they introduced.

  ---

  ### Honest Accounting: Where This Principle Fails Your Intuitions

  No principle captures every nuance of moral intuition without cost. Here is where **Custodial Accountability** will conflict with your gut feelings:

  1.  **The "Innocent" Engineer:** In Case 1 (Known Defect), you felt no impulse to name an individual engineer. This principle agrees. However, if an engineer *whistleblew* and was ignored, your gut might demand they be *praised*, not just exonerated. This principle focuses on blame, not virtue. It treats the engineer as a neutral component, which might feel cold.
  2.  **The Punitive Desire:** In the Drifting AI case, this principle makes the Company pay. It does not necessarily demand the Company *suffer* (e.g., bankruptcy or criminal charges). If your gut says "Someone should go to jail," this principle cannot satisfy you. It offers financial liability, not carceral retribution, when negligence is absent.
  3.  **The Small Vendor:** If the Drifting AI was made by a three-person startup, "Residual Liability" might bankrupt them, effectively punishing the individual founders for a no-fault error. Your principle might demand they pay, but your gut might recoil at ruining lives for an unanticipatable error. You may need a threshold for "Enterprise Liability" (e.g., only applies above a certain revenue size).
  4.  **Case 4 vs. 5 Nuance:** This principle relies on "Professional Norms." If norms shift (e.g., lawyers start using AI without checking because everyone does), the verdict changes. You might feel the *moral* blame should remain constant even if the *professional* standard slides. This principle is sociological; your intuition might be deontological.

  ### Summary

  Your tentative principle failed because it looked for a **guilty hand** at the moment of impact. The **Principle of Custodial Accountability** looks for the **authorized beneficiary** of the risk.

  *   **Case 4 (Lawyer):** You benefited from the tool's speed without doing the work. You pay.
  *   **Case 5 (Doctor):** The Hospital benefited from the triage efficiency; you shared the risk. You split the pay.
  *   **Drifting AI:** The Vendor benefited from the "Learning" feature. They pay for the drift.

  This saves your verdict on the Drifting AI by reclassifying the harm from a **Tragedy** (no blame) to a **Cost of Business** (strict liability). The price you pay is accepting that entities can be morally responsible for harms they did not negligently cause, simply because they profited from the system that caused them.
