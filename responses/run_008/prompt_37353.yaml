  Use "Will Candidate X win the upcoming election?" It must be a single, non-repeatable event (ruling out simple frequency), yet have physical grounds (polls, economy -> propensity) and betting markets (predictit -> subjectivism). Avoid weather (too many historical analogues). The scenario needs explicit odds (e.g., "Forecast says 70%"). It must invite the question: "If we reran history, would she win 7 out of 10 times?" (No, history happens once). This forces the distinction between long-run frequency and single-case confidence/physical chance. It grounds the abstract debate in a concrete stake everyone understands. The example must be high-stakes enough to matter, but dry enough to avoid partisan deadlock. An election forecast works because everyone knows the outcome is binary (win/lose) but the prediction is probabilistic. This tension drives the interpretive debate naturally.

  (3) "Misconception map"
  1. *Subjectivism = Vibes:* Defuse during the Subjectivism section. Explicitly contrast "arbitrary feeling" with "coherent betting odds." Mention calibration: if you say 70% often, you should be right 70% of the time. Emphasize that rational subjectivism is constrained by evidence, not free-floating.
  2. *Frequentism = Only Objective Science:* Defuse during the Frequentism limitation phase. Show that science often deals with single cases (climate models, cosmology) where frequency fails. This protects subjectivism from being dismissed as unscientific.
  3. *Propensity = Secret Frequency:* Defuse during Propensity intro. Clarify that a biased coin has a propensity even if never tossed. It's a cause, not an average. This distinguishes it from frequentism clearly. Many will think propensity is just long-run frequency disguised. You must stress that propensity exists in a single trial, whereas frequency requires an infinite sequence. This distinction is vital for physics-adjacent attendees.
  4. *Math Disagreement:* State this upfront in the intro and reaffirm in synthesis. The axioms are the shared language; interpretations are the semantics. This prevents them from thinking Bayesians use different algebra. Addressing these *in situ* prevents compounding confusion later. When switching lenses, explicitly state: "The math stays the same, but what the number *refers to* changes." This mantra helps anchor them when the definitions shift. Don't wait for Q&A to fix these; preempt them during the transition points between interpretations. This is crucial for the software engineers who might assume different interpretations imply different algorithms. Reiterate that you can derive Bayes' Theorem under all three interpretations. The disagreement is ontological (what exists), not computational.

  (4) "What to leave out"
  Exclude measure-theoretic foundations (sigma-algebras); it's scaffolding, not the building. Skip formal Dutch Book arguments; describe the *implication* (money pump) without the proof. Avoid quantum mechanics when discussing propensity; it introduces unnecessary metaphysical baggage. Finally, bypass the Reference Class Problem deeply; acknowledge it exists but don't solve it. Frame these exclusions as "advanced modules for follow-up" rather than "too complex," validating the depth without drowning the session. This keeps the focus on semantic interpretation rather than mathematical rigor.

  (5) "The exit check"
  Ask: "If the forecast says 70% chance of winning, but the candidate loses, was the forecast wrong?" A frequentist must say 'yes' (or undefined); a subjectivist says 'no' (it was a state of belief); a propensity theorist says 'maybe' (chance didn't actualize). Their answers reveal which lens they default to.
