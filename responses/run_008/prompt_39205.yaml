          2.  Nothing in a sleeping brain is properly an "experience" (requires environmental contact/responsiveness).
          3.  The felt certainty of dreaming is a grammatical artifact, not a datum.
      *   **Task:** Construct a map of the view's exposure (not a defense). Identify defeaters, sort them by kind, assess severity, predict defender response, and calculate the cost of that response.
