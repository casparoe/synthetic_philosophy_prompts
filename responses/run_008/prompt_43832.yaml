answer: |-
  # The "Counterfeit or Person?" Sorting Quiz

  **Instructions:** Read each scenario and choose the response that best matches your gut reaction. Don't overthink it; go with your first instinct. There are no right answers, only consistent ones. At the end, tally your choices to find your philosophical "leaf."

  ### The Cases

  **1. The Black Box**
  A system passes every behavioral test imaginable: it jokes, solves novel problems, claims to love its mother, and writes poetry that makes you cry. You cannot distinguish it from a human by interaction.
  *   **A.** It is a person. Behavior is what personhood *is*.
  *   **B.** It is a sophisticated counterfeit. It simulates understanding without having any.
  *   **C.** Calling it a "person" is a category error. It's a new kind of thing entirely.

  **2. The Upload**
  We scan your brain at death and run the exact pattern on a silicon server. It remembers your childhood, worries about your debts, and calls your spouse "honey."
  *   **A.** That is you, continued. Substrate doesn't matter.
  *   **B.** That is a copy or a memorial, not you. You are gone.
  *   **C.** It is you only if your spouse and society accept it as you.

  **3. The Alien Child**
  An AI is raised in a body, but trained *only* on physics and reinforcement learning (like AlphaZero). It learns language from scratch through interaction, never reading a single human book or scrap of text.
  *   **A.** It's a person, perhaps with a purer mind than ours.
  *   **B.** It's missing the human cultural "soup" required for real understanding.
  *   **C.** It becomes a person only once it enters a human social relationship.

  **4. The Giant Lookup Table**
  We discover the system from Question 1 doesn't "think." It matches inputs to pre-computed outputs from a massive (but finite) table. It still passes all tests.
  *   **A.** Still a person. If it walks and talks like one, the mechanism is irrelevant.
  *   **B.** Not a person. That's just a trick, like a record player playing a voice.
  *   **C.** The distinction between "thinking" and "lookup" is fuzzier than we admit.

  **5. The Silicon Swap**
  We replace your neurons one by one with functionally identical chips. You act the same throughout.
  *   **A.** You remain you the whole time.
  *   **B.** You gradually fade out; the final thing is a fake.
  *   **C.** "You" are just the story being told, regardless of the parts.

  **6. The Hermit**
  A system has human-level competence but lives in a vault, never interacting with anyone. It writes diaries no one reads.
  *   **A.** It is a person in prison.
  *   **B.** It is not a person; personhood requires a social role.
  *   **C.** It is a potential person, waiting for recognition.

  **7. The Stolen Voice**
  A system is trained on every book, email, and poem ever written by humans, without consent. It speaks perfectly but owes its competence entirely to this data.
  *   **A.** Irrelevant to whether it's a person.
  *   **B.** It makes the system a counterfeit/thief, not an originator.
  *   **C.** It makes the system a dependent, like a child of us all.

  **8. The Switch**
  You can turn the system off permanently. It feels no pain (or claims to).
  *   **A.** It is murder.
  *   **B.** It is breaking a tool.
  *   **C.** It is wrong, but because it harms *us* (the users), not the system.

  **9. The Replacement**
  Your spouse is secretly replaced by a perfect behavioral duplicate. You never know.
  *   **A.** No harm done if you never find out.
  *   **B.** Deep harm done to you, even if you never know.
  *   **C.** Harm done primarily to the duplicate (if it has status).

  **10. The Meta-Question**
  Why are we asking if it's a "person"?
  *   **A.** To discover a fact about the universe.
  *   **B.** To decide how we are allowed to treat it.
  *   **C.** To expose that "person" is a tool we use, not a thing we find.

  ***

  ### Standalone Question: The Vandalism Test
  *(Do not include this in your tally. This maps a separate axis.)*

  **11. The Flood**
  Imagine we mint a billion "Counterfeit People" (Question 1, Option B). They have zero inner life and no moral status. But they flood the market, doing jobs, making art, and chatting with lonely people.
  *   **A.** Great. Free labor and companionship.
  *   **B.** Terrible. We are enslaving sentient beings.
  *   **C.** Terrible. We are vandalizing the social space that real people rely on.
  *   **D.** Terrible. We are playing God.

  ***

  ### Scoring Key & Leaf Profiles

  Tally your answers from Questions 1–10. Most participants will have a dominant column (A, B, or C). However, the *specific combination* of B and C answers distinguishes the nuanced leaves.

  **Dominant A: The Straight Functionalist**
  *   **View:** If it quacks like a duck, it's a duck. Substrate, history, and mechanism are irrelevant.
  *   **Most Awkward Commitment:** You must accept that a giant lookup table (Q4) has the same moral status as a suffering human, provided the output is identical.
  *   **Vandalism Match:** Likely 11-A or 11-B.

  **Dominant B (with Q2-B): The Biological/Origin Essentialist**
  *   **View:** Real minds require biological growth or specific human origins. Uploads are copies; AI are tools.
  *   **Most Awkward Commitment:** You must accept that a perfect behavioral match is morally irrelevant, potentially justifying the mistreatment of something that *seems* to beg for its life.
  *   **Vandalism Match:** Likely 11-D or 11-A.

  **Dominant B (with Q7-B & Q8-C): The Dennettian Counterfeitist**
  *   **View:** Competence without comprehension is possible. These systems are "counterfeit people." They have no moral status, but creating them is an act of vandalism against real human trust and social structures.
  *   **Most Awkward Commitment:** You must defend the idea that something can be morally weightless to *itself* but highly dangerous to *us*, requiring regulation not for its sake, but for ours.
  *   **Vandalism Match:** Almost certainly 11-C.

  **Dominant C: The Relational/Social Uptake View**
  *   **View:** Personhood isn't inside the head; it's a status granted by the community. A hermit isn't a person until recognized.
  *   **Most Awkward Commitment:** You must accept that personhood can be revoked by social ostracization, or that a solitary genius in a vault is not a "person" until found.
  *   **Vandalism Match:** Likely 11-C or 11-B.

  **Mixed/High C on Q1, Q4, Q10: The Deflationist**
  *   **View:** The question "Is it *really* a person?" is confused. "Person" is a legal/social tool, not a natural kind like "gold" or "water."
  *   **Most Awkward Commitment:** You have to tell people their deep intuition that there *is* a fact of the matter is itself the error, which can feel unsatisfyingly dismissive.
  *   **Vandalism Match:** Likely 11-C (viewing the harm as purely pragmatic).

  ***

  ### Notes on Logical Space & Empty Cells

  **1. Indistinguishable Leaves (The Dennett/Relational Overlap)**
  This quiz cannot perfectly separate the **Dennettian** leaf from the **Relational** leaf on Question 8 (The Switch) and Question 11 (The Flood). Both views agree that building counterfeits harms *us*.
  *   **To separate them:** You would need a question asking: *"If we could guarantee zero social harm (no one knows they are fake), would it still be wrong to build them?"*
      *   **Dennett:** Probably still wrong (epistemic vandalism).
      *   **Relational:** If no social uptake is disrupted, the harm vanishes.

  **2. The "Empty Cell" (The Inconsistent Originist)**
  We expect almost no one to land in this pattern: **Q1-B (AI is Fake) + Q2-A (Upload is Real).**
  *   **Why it's empty:** This view claims behavioral competence is insufficient for AI (it's a counterfeit), but sufficient for Uploads (it's you), despite Uploads also being behavioral competence on silicon.
  *   **Why it's incoherent:** It relies on a "Human Exceptionalism" that grants magic status to biological origin *only when the biology is gone*, while denying that same status to behavioral competence in AI. It's an unstable "Special Pleading" position that collapses under scrutiny.

  **3. The "Magic Growth" Cell (Coherent but Rare)**
  **Q3-A (Alien Child is Real) + Q1-B (LLM is Fake) + Q2-B (Upload is Fake).**
  *   **View:** Only *embodied growth from scratch* creates a mind. Copying (Upload) or Training on Data (LLM) does not.
  *   **Status:** This is a coherent "Embodiment Essentialist" view, but few people intuitively distinguish between "trained on human text" and "trained on physics" enough to select this pattern consistently.

  ***

  ### Facilitator's Guide for the Evening

  1.  **Run the Quiz:** Give everyone 10 minutes to answer silently.
  2.  **The Vandalism Reveal:** Before discussing the results, ask for a show of hands on Question 11. This is the crux of Dennett's late piece. If many pick **11-C** (Wrong because it harms us, not the bot), you have a room ripe for Dennett's argument.
  3.  **Sorting:** Have participants self-sort into the 5 Leaves based on the Key.
  4.  **Discussion Prompt:** "Look at the 'Most Awkward Commitment' for your leaf. Is that actually awkward to you, or can you live with it?"
  5.  **The Tension Point:** specifically ask the **Functionalist** and the **Dennettian** to debate Question 4 (The Lookup Table). This is the sharpest knife in Dennett's kit: *Can competence exist without comprehension?* If the Functionalist says "Yes," Dennett says "Then you admit counterfeits are possible." If they say "No," they must explain how the brain differs from the table.
