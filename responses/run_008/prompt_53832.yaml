  # Lesson Plan: The Epistemic Wager
  **Course:** Intro to Epistemology (Discussion Section)  
  **Topic:** Pre-Gettier Intuitions & The JTB Analysis  
  **Time:** 75 Minutes  
  **Students:** ~20 (4 Groups of 5)  

  ## 1. Pedagogical Overview & Design Choices
  This activity is designed to induce **Gettier-style intuitions** without using the label or the canonical texts. Students will form beliefs through perception, testimony, and inference, then wager "Epistemic Credits" on whether those beliefs constitute *knowledge*. 

  **Design Choice on "Knowledge":** The payout scheme does not define knowledge in the rules. It relies on the students' collective intuition during the "Repair Round." This is deliberate: if you define knowledge as JTB beforehand, the Gettier cases payout and the lesson fails. If you define it as JTB+No-Luck, the activity is trivial. The tension must arise from the conflict between **Truth + Justification** and the **Intuition of Luck**.

  **Design Choice on Stakes:** We use a fictional currency ("Epistemic Credits" or EC). This avoids ethical issues with gambling/grades while simulating the "value" of knowledge. Winning EC represents successfully identifying knowledge; losing EC represents misidentifying luck as knowledge.

  ---

  ## 2. Materials List
  *   **Tokens:** 400 poker chips or printed paper slips (100 per group).
  *   **Station 1 (Time):** One analog wristwatch (stopped), one smartphone (for TA only), a card reading "Official Class Timekeeper."
  *   **Station 2 (Testimony):** One envelope sealed with wax or tape. Inside: A note from a "Former TA." A prop thermometer (broken/stuck).
  *   **Station 3 (Inference):** Two small boxes (labeled A and B), three slips of paper marked "PRIZE," one envelope with premises.
  *   **Worksheets:** One "Wager Sheet" per group (columns for Station, Belief, Justification, Stake, Payout).
  *   **Whiteboard/Projector:** For tracking group scores and drafting rules.

  ---

  ## 3. The Token Economy
  *   **Endowment:** Each group starts with **100 EC**.
  *   **The Wager:** At each station, the group forms a belief (e.g., "It is 2:15 PM"). They must decide: *Is this Knowledge?*
      *   If they stake **0 EC**: They abstain. No gain, no loss.
      *   If they stake **>0 EC**: They claim this is Knowledge.
  *   **The Payout:** Determined *after* the Repair Round. 
      *   If the belief is **True + Justified + Meets the Group's Final Rule**: They win 2x their stake.
      *   If the belief is **False OR Unjustified OR Violates the Final Rule**: They lose their stake.
  *   **Winning:** The group with the most EC at the end gets "Epistemic Bragging Rights" (no grade impact).

  ---

  ## 4. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Explain rules, distribute tokens, form 4 groups. Emphasize: "Trust your instincts, not Google." |
  | **05-26** | **Stations** | Groups rotate through 3 Stations (7 mins each + 1 min transition). Form beliefs, record justification, place stakes. |
  | **26-36** | **Reveal** | TA discloses the hidden facts (Truth values and Formation Methods). Groups calculate raw T/J status. |
  | **36-51** | **Repair** | Groups draft a "Payout Rule" (Analysis of Knowledge) that saves their winning stakes and rejects the lucky ones. |
  | **51-61** | **The Break** | TA introduces "Breaker Facts" that invalidate each group's rule. |
  | **61-75** | **Debrief** | Connect activity to Gettier, discuss literature status, handle Q&A. |

  ---

  ## 5. Station Instructions (The Cases)
  *TA Note: Set these up before class. Ensure the "Luck" is physically hidden.*

  ### Station 1: The Official Timekeeper
  *   **Setup:** An analog watch sits on the desk. It reads **2:15**. A card next to it says: *"This watch is verified accurate. Check the time."* (Class is actually meeting at 2:15 PM).
  *   **Hidden Fact:** The watch stopped exactly 24 hours ago. It reads 2:15 only by coincidence.
  *   **Target Intuition:** True Belief (It is 2:15). Justified (TA vouches, watch looks normal). **Not Knowledge** (Luck).
  *   **Instruction to Students:** "Determine the current time using the provided instrument. Record your belief and justification. Stake EC on whether this counts as Knowledge."

  ### Station 2: The Environmental Read
  *   **Setup:** A digital thermometer on the wall reads **72°F**. A note from a "Facilities Manager" says: *"Sensors calibrated this morning. Trust the display."* The room actually feels comfortable.
  *   **Hidden Fact:** The sensor is broken and stuck on 72°F. However, the HVAC system *actually* failed in a way that left the room at exactly 72°F by coincidence (e.g., outside temp matches inside temp perfectly today).
  *   **Target Intuition:** True Belief (It is 72°F). Justified (Instrument + Authority). **Not Knowledge** (Fake Barn/Environment structure).
  *   **Instruction to Students:** "Determine the room temperature. Record your belief and justification. Stake EC on whether this counts as Knowledge."

  ### Station 3: The Logical Guarantee
  *   **Setup:** A sealed envelope contains two premises. Two boxes (A and B) sit on the table.
      *   Premise 1: "A prize slip is in Box A or Box B." (True: There are slips in *both*).
      *   Premise 2: "Box A is empty." (False: Box A has a slip).
  *   **Task:** Students deduce the location of a prize.
  *   **Logic:** (A or B) + (Not A) → Therefore B.
  *   **Hidden Fact:** Box B *does* contain a prize slip. But Premise 2 was false.
  *   **Target Intuition:** True Belief (Prize in B). Justified (Valid Deduction from provided premises). **Not Knowledge** (False Lemma).
  *   **Instruction to Students:** "Deduce where the prize is using the envelope. Open Box B to verify truth. Stake EC on whether this counts as Knowledge."

  ---

  ## 6. Facilitator Script: The Reveal & The Break

  ### The Reveal (Minutes 26-36)
  **TA:** "Stop wagering. Bring your sheets to the center. We are going to reveal the facts of the matter. I am not going to tell you if you knew. I am going to tell you what *happened*."

  **Station 1 (Time):** "Your belief was **True**. It is 2:15. Your justification was **Reasonable**; the watch looked functional and I vouched for it. **However**, the watch stopped 24 hours ago. It matched by chance."
  *(Ask groups: Did you lose your stake? Most will say yes.)*

  **Station 2 (Temp):** "Your belief was **True**. It is 72°F. Your justification was **Reasonable**; the sensor is usually reliable. **However**, the sensor was broken. The temperature was right by environmental coincidence."
  *(Ask groups: Did you lose your stake? Most will say yes.)*

  **Station 3 (Logic):** "Your belief was **True**. Box B has the prize. Your justification was **Logical**; you followed valid deduction. **However**, Premise 2 was false. Box A was not empty."
  *(Ask groups: Did you lose your stake? Most will say yes.)*

  **TA:** "Look at your sheets. In all three cases, you had **True Belief**. In all three cases, you had **Justification** (reliance on instruments, authority, or logic). Yet, almost everyone wants to forfeit the payout. Why?"
  *(Elicit: "Luck," "Accident," "Could have been wrong.")*

  ### The Repair Round (Minutes 36-51)
  **TA:** "You are now the Epistemic Council. You must write a **Payout Rule**. This rule must allow payout for 'Normal Knowledge' (e.g., looking out a window to see rain) but deny payout for these three stations. Write your rule on the board."

  *Expected Student Rules:*
  1.  "No False Premises."
  2.  "The evidence must cause the truth."
  3.  "No luck allowed."

  ### The Break (Minutes 51-61)
  **TA:** "I will now introduce complications. If your rule cannot handle these, your rule leaks."

  *   **Counter to "No False Premises":** "Imagine Station 1 (The Watch). I didn't give you a premise. You just *looked* at it. There were no false sentences in your head. Just a broken watch. Does your rule save you?"
      *   *Goal:* Show that perceptual Gettier cases exist without explicit inference.
  *   **Counter to "No Luck":** "What counts as luck? If you buy a lottery ticket and win, that's luck. If you look out the window and see rain, is it luck the photons hit your eye? Where is the line?"
      *   *Goal:* Show that 'luck' is vague without a theory (modal safety, virtue, etc.).
  *   **Counter to "Causal Connection":** "Imagine you see a barn. It is a real barn. But unbeknownst to you, the county is full of fake barn facades. You happened to look at the only real one. Your belief is caused by the barn. Is it knowledge?"
      *   *Goal:* Introduce the Fake Barn problem (Reliabilism challenge).

  ---

  ## 7. Debrief Guide (Minutes 61-75)

  ### Mapping to the Literature
  1.  **Name the Problem:** "What you just articulated—the gap between Justified True Belief and Knowledge due to epistemic luck—is exactly what Edmund Gettier demonstrated in a 3-page paper in 1963."
  2.  **Map the Stations:**
      *   Station 1 & 2 ≈ **Perceptual Luck / Fake Barns**.
      *   Station 3 ≈ **False Lemma / Deductive Closure**.
  3.  **Discuss Repairs (Contested Territory):**
      *   *No False Lemmas:* "Some philosophers say knowledge is JTB + No False Premises. But Station 1 had no premises. So that fails."
      *   *Reliabilism:* "Others say knowledge is belief from a *reliable process*. But the watch is usually reliable. Was the *token* event reliable or the *type*?"
      *   *Virtue Epistemology:* "Others say knowledge is true belief arising from *intellectual virtue*. Did you exercise virtue at Station 2? Or did the environment trick you?"
  4.  **Settled vs. Contested (Crucial Note):**
      *   **Settled:** JTB is *insufficient* for knowledge. (This is the consensus since 1963).
      *   **Contested:** What is the *fourth condition*? There is no consensus. Some think we should abandon the analysis project entirely (Pragmatic Encroachment, Knowledge-First).
      *   **Contested:** Do non-philosophers share these intuitions? (Experimental Philosophy suggests cultural variance in Gettier intuitions).

  ### Closing
  "You will read Gettier for next class. You now have the intuition before you have the text. Your job is to see if his examples trigger the same feeling of 'epistemic cheating' that the broken watch did."

  ---

  ## 8. Troubleshooting & Facilitator Notes

  ### Predictable Issue 1: The "Read-Ahead" Student
  **Scenario:** A student raises their hand at Station 1 and says, "This is a Gettier case! We shouldn't bet!"
  **Response:** "I appreciate your enthusiasm. However, this section is designed to test *pre-theoretical intuition*. If you use the terminology, you spoil the data for your peers. I need you to act as a 'Silent Consultant.' You can guide your group's reasoning, but you cannot use the words 'Gettier,' 'Lemma,' or 'JTB.' Can you agree to that?"
  *   *Why:* This validates their knowledge without letting them dominate the discovery process of others.

  ### Predictable Issue 2: Collapsing Justification into Probability
  **Scenario:** Students argue, "But the watch was 99% likely to be right. That *is* justification."
  **Response:** "Distinguish between *having a reason* and *the likelihood of truth*. In these cases, you had strong reasons (the watch looked real). The probability was high. But the *connection* between the reason and the truth was broken. We are testing the connection, not the probability."
  *   *Why:* This prevents the conversation from sliding into Bayesian epistemology prematurely.

  ### Predictable Issue 3: The "Who Cares?" Reaction
  **Scenario:** Students argue, "It's true, I'm justified, who cares if it's luck? I'd still bet on it."
  **Response:** "That is a valid pragmatic stance. But in philosophy, 'Knowledge' is a specific technical term, like 'Force' in physics. If we call lucky guesses 'Knowledge,' the term loses its power to distinguish safe belief from accidental truth. The payout game is just a proxy for that distinction."

  ---

  ## 9. Limitations & Meta-Notes for the TA

  ### What This Activity Cannot Reproduce
  1.  **The Salience of Deception:** In the classroom, the deception is *staged by the teacher*. In the real world, Gettier luck is usually invisible. Students might feel "tricked by the TA" rather than "tricked by the world."
      *   *Mitigation:* In the debrief, explicitly acknowledge: "In real life, no one hands you an envelope with a false premise. The environment just *is* misleading. Today we accelerated that process."
  2.  **Pragmatic Encroachment:** The token economy introduces stakes. Some contemporary epistemologists argue stakes *change* whether you know (Pragmatic Encroachment).
      *   *Mitigation:* Acknowledge this in the debrief. "Did you demand higher standards because tokens were on the line? That's a live debate in the literature."

  ### Settled vs. Contested (For Your Preparation)
  *   **Settled:** The JTB analysis is formally insufficient. Gettier cases are counterexamples. (Do not entertain students who try to argue JTB is fine without modification; they are historically behind).
  *   **Contested:**
      *   **The Fix:** There is no agreed-upon "JTB+X." Reliabilism, Virtue Epistemology, and Contextualism all have detractors.
      *   **The Intuition:** Experimental philosophers (e.g., Weinberg, Nichols, Stich) have challenged whether the "Gettier Intuition" is universal across cultures and socioeconomic backgrounds. Treat the students' intuition as *data*, not *proof*.
      *   **Knowledge-First:** Some (e.g., Timothy Williamson) argue we shouldn't analyze knowledge at all; it's a primitive state.

  ### Design Choice Transparency
  *   **Why "Payout" instead of "Truth"?** If you simply ask "Is this true?", they will say Yes. If you ask "Is this Knowledge?", they hesitate. The payout forces them to commit to the *normative* status of the belief, not just the descriptive status.
  *   **Why not use the Sheep/Dog?** The prompt requested fresh cases. The "Stopped Watch" and "Broken Thermometer" are structurally identical to the canonical cases but feel more immediate in a classroom setting.

  ### Final Advice
  You are not teaching them the *solution* to Gettier. You are teaching them the *problem*. If they leave the room feeling that JTB is broken but unsure how to fix it, you have succeeded. Do not try to resolve the Repair Round; the failure of their rules is the lesson.
