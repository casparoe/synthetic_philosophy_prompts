answer: |-
  1. In the opening scene where Galileo scrubs the floor and teaches Andrea, he declares that the aim of science is to make life easier, not to worship authority. This sidesteps the historical Galileo's theological nuance to frame knowledge as purely material progress rather than a second book of God.

  2. When Cardinal Bellarmine acknowledges Galileo's proofs but insists on maintaining the Aristotelian status quo, the play depicts the Church as knowingly suppressing truth for social stability. This ignores the historical reality that the Church genuinely feared theological error, reducing a doctrinal conflict to simple class oppression.

  3. During the public abjuration, Brecht stages Galileo as breaking under physical threat rather than strategically accepting the Church's authority over scripture. This transforms a domain-specific compromise into a moral collapse that betrays humanity's right to know.

  4. In the monologue after the recantation, Galileo admits he recanted out of fear of pain, rejecting the idea that he respected the Church's institutional authority over spiritual matters. Brecht uses this to argue that scientists owe truth to the people above all institutions, even legitimate religious ones.

  5. When Galileo secretly hands the *Discorsi* to Andrea at the end, he calls himself a traitor to his craft. This cements Brecht's argument that withholding truth is a social crime, dismissing the historical Galileo's view that protecting oneself to continue working was a valid strategy.
