      *   *Upshot:* The conclusion (aim at capabilities) follows from Sen, but not necessarily from the misrepresentation of Rawls and Dworkin. If Rawls is about primary goods (resources/opportunities) and Dworkin is about resources + insurance for handicaps, the move to capabilities is a specific Sen/Nussbaum move, not a consensus outcome of the whole debate.

