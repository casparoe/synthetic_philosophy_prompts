      *   **Requirements:**
          1.  Agreed claims (precise, acceptable to both).
          2.  Exact disagreements (phrased so each side accepts their formulation).
          3.  Cruxes (underlying theoretical分歧).
          4.  Arguments/Cases bearing on cruxes (with predictions).
          5.  Handle two hard cases: (a) Coerced conscript in unjust war, (b) Volunteer remote drone operator in unjust war.
          6.  Address verbal disputes vs. substantive disputes.
          7.  Format: Numbered agreed claims, Disagreements Table, Cruxes/Arguments, Final Sentence in `\jointstatement{...}`.

  2.  **Deconstruct the Theoretical Landscape:**
      *   **Orthodox (Walzer):** *Jus ad bellum* (justice of war) and *jus in bello* (conduct in war) are logically independent. Combatants on both sides have equal right to kill each other (MEC), provided they follow *in bello* rules. Civilians are immune. Liability stems from being a "dangerous agent" in a state of war.
      *   **Revisionist (McMahan):** *Jus ad bellum* and *jus in bello* are linked. Only those fighting for a just cause have the right to kill. Unjust combatants are not morally permitted to fight and are liable to be killed; just combatants are not liable. Liability stems from moral responsibility for an unjust threat.
      *   **Common Ground:** Civilians are generally immune (unless directly participating). Some wars are clearly aggressive/unjust. Some conduct is clearly prohibited (torture, targeting civilians). There is a distinction between *legal* and *moral* status (though they weigh it differently).

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to be careful not to smuggle in contested premises.
      *   *Claim 1 (Distinction):* Acknowledge the conceptual distinction between *ad bellum* and *in bello*, even if they disagree on independence.
      *   *Claim 2 (Civilians):* Non-combatant immunity is robust. Both agree civilians shouldn't be targeted.
      *   *Claim 3 (Liability Basis):* Both agree liability to attack isn't random; it's tied to posing a threat, though they disagree on *why* that threat creates liability (moral responsibility vs. functional role).
      *   *Claim 4 (Legal vs. Moral):* Acknowledge the difference between international law (which assumes MEC) and moral philosophy (where the dispute lies).
      *   *Claim 5 (Hard Cases):* Acknowledge that coercion and remoteness affect moral assessment, even if they disagree on the *degree*.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to capture the core conflict without caricature.
      *   *Orthodox:* Focus on the "war convention," the fog of war, and the symmetry of danger.
      *   *Revisionist:* Focus on individual moral responsibility and the asymmetry of justification.
      *   *Crux:* The source of liability (status vs. action/responsibility).

  5.  **Drafting Section 3: Cruxes and Arguments:**
      *   *Crux 1: Moral Responsibility.* How much does a soldier need to know/be responsible for the war's justice to be liable?
      *   *Crux 2: The Function of War Rules.* Are rules for regulating violence (Orthodox) or tracking moral truth (Revisionist)?
      *   *Crux 3: Permissibility vs. Liability.* Can you be permitted to kill but still liable to be killed? (Or vice versa).
      *   *Hard Cases:*
          *   (a) Conscript: Orthodox says "excused/protected by convention." Revisionist says "less liable than leaders, but still objectively unjust threat."
          *   (b) Drone Operator: Orthodox says "combatant status applies." Revisionist says "high responsibility, high liability."

  6.  **Drafting Section 4: Verbal vs. Substantive:**
      *   Is "Equality" the issue? Yes. Orthodox means "equal rights/immunities." Revisionist means "moral symmetry."
      *   Need to clarify that the substantive dispute is about *liability conditions*.

  7.  **Refining the Tone:**
      *   Must sound like professional philosophy. Precise, nuanced, avoiding colloquialisms.
      *   Must avoid bias.
      *   Must satisfy the "neither would complain" constraint. This is the hardest part. The Orthodox shouldn't feel the Revisionist is calling them immoral; the Revisionist shouldn't feel the Orthodox is ignoring basic morality.

  8.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Check:* Did I clearly separate *ad bellum* and *in bello* in the agreed section? *Correction:* Yes, but ensure I don't say they are *independent* in the agreed section, just that they are distinct categories.
      *   *Check:* Are the hard cases specific enough? *Correction:* Ensure the conscript case mentions "duress" and the drone case mentions "risk asymmetry."
      *   *Check:* Is the final sentence truly neutral? *Correction:* It needs to affirm the value of the debate itself.

  9.  **Final Review against Constraints:**
      *   Numbered agreed claims? Yes.
      *   Disagreements table? Yes.
      *   Cruxes + Arguments + Predictions? Yes.
      *   Hard cases (a) & (b)? Yes.
      *   Verbal vs. Substantive? Yes.
      *   Final `\jointstatement{...}`? Yes.

  10. **Final Polish:** Ensure the philosophical terminology (liability, justification, excuse, symmetry) is used correctly according to both traditions. (e.g., Revisionists distinguish between *justification* and *excuse* more sharply than Orthodox, who often blend them in the "war convention".)

  *(Self-Correction on the "Agreed Claims"):* I need to be careful not to assert MEC as fact in the agreed claims. I must assert that *International Humanitarian Law (IHL)* assumes MEC, which both agree on as a sociological/legal fact, even if they disagree on its moral validity.

  *(Self-Correction on Hard Cases):* For the conscript, the Orthodox will say they retain combatant privilege. The Revisionist will say they are less liable than leaders but still liable. I need to phrase the *disagreement* about them, not the *agreement*. The prompt asks for the statement to *handle* them. I will put the specific analysis in the Cruxes/Arguments section.

  *(Final Sentence):* Needs to be something like "The question of when killing in war is permissible remains central to the ethics of armed conflict."

