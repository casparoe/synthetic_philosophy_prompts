answer: |-
  **JOINT STATEMENT ON THE MORAL STATUS OF COMBATANTS**

  **I. Agreed Claims**

  1.  **Conceptual Distinction:** *Jus ad bellum* (the justice of resorting to war) and *jus in bello* (the justice of conduct within war) are distinct categories of moral and legal evaluation, even if their moral relationship is contested.
  2.  **Non-Combatant Immunity:** Persons who are not directly participating in hostilities (civilians) possess a strong presumptive immunity from intentional attack. This immunity is not absolute but is significantly more robust than the immunity of combatants.
  3.  **Liability Requires Threat:** Combatant liability to lethal attack is not arbitrary; it is grounded in the capacity and willingness to inflict harm, though the parties disagree on whether this threat must be *unjust* to generate liability.
  4.  **Legal vs. Moral Status:** Current International Humanitarian Law (IHL) operates on the assumption of the Moral Equality of Combatants (MEC). The parties disagree on whether IHL accurately tracks moral reality or serves a distinct regulatory function.
  5.  **Duress and Responsibility:** An individual's moral responsibility for participating in an unjust war is mitigated by coercion, epistemic limitations, and institutional pressure, though the parties disagree on whether such mitigation removes liability to attack or merely provides an excuse.
  6.  **Verbal Clarification:** The parties agree that the term "equality" is a locus of ambiguity. The Orthodox side uses "equality" to denote symmetrical *rights and immunities under the conventions of war*. The Revisionist side uses "equality" to denote symmetrical *moral justification and liability*. The substantive dispute remains after this distinction is acknowledged.

  **II. Disagreements Table**

  | Claim Topic | Orthodox Formulation (Walzerian) | Revisionist Formulation (McMahan-style) | Crux |
  | :--- | :--- | :--- | :--- |
  | **Source of Liability** | Combatants are liable to attack because they are *dangerous agents* operating within a state of war, regardless of the justice of their cause. | Combatants are liable to attack only if they are *morally responsible for an unjust threat*. | The relationship between moral responsibility and liability to defensive harm. |
  | **Symmetry of Permission** | Unjust combatants are morally permitted to attack just combatants, provided they adhere to *in bello* constraints, because the war convention creates a symmetrical liberty. | Unjust combatants are not morally permitted to attack just combatants, as they lack a just cause; doing so constitutes wrongful aggression. | Whether institutional conventions can generate moral permissions that override baseline moral prohibitions. |
  | **Independence of *Jus*** | *Jus ad bellum* and *jus in bello* are logically independent; a soldier can fight honorably in an unjust war. | *Jus in bello* is dependent on *jus ad bellum*; one cannot fight "honorably" (permissibly) for an unjust cause. | The extent to which macro-level justice constrains micro-level permissions. |
  | **Hard Case (a): Coerced Conscript** | The conscript retains full combatant status and immunity; duress makes their participation excusable, and they remain a legitimate target only by virtue of their role. | The conscript is less liable than voluntary aggressors due to diminished responsibility, but remains objectively liable as an unjust threat, albeit with mitigated blame. | Whether diminished responsibility negates liability or merely mitigates blameworthiness. |
  | **Hard Case (b): Remote Drone Operator** | The operator is a combatant like any other; physical risk to the agent is not a condition for combatant status or liability. | The operator bears high moral responsibility due to voluntary participation and epistemic clarity; their safety makes their liability *more* intuitive, not less. | Whether personal risk is a constitutive element of the combatant's moral bargain. |

  **III. Cruxes, Arguments, and Predictions**

  **Crux 1: The Function of War Rules**
  *   **Issue:** Do the rules of war exist to regulate a tragic practice (Orthodox) or to track antecedent moral truths (Revisionist)?
  *   **Agreed Test Case:** A scenario where following the "rules of war" leads to a clearly unjust outcome (e.g., symmetrical rules preventing intervention to stop a genocide).
  *   **Orthodox Prediction:** Adhering to the convention is preferable to allow for negotiated settlement and limit total violence, even if it creates moral asymmetry.
  *   **Revisionist Prediction:** Adhering to the convention is morally impermissible if it protects unjust aggressors; moral truth must override convention.

  **Crux 2: Permissibility vs. Liability**
  *   **Issue:** Can an agent be morally permitted to kill (due to convention/epistemic limits) while simultaneously being liable to be killed (due to objective unjust threat)?
  *   **Agreed Test Case:** The "Invincible Aggressor": An unjust combatant who cannot possibly win but continues to fight.
  *   **Orthodox Prediction:** The aggressor remains a legitimate target until surrender; their subjective permission is irrelevant to their objective status as a threat.
  *   **Revisionist Prediction:** The aggressor is liable because they are an unjust threat; their subjective permission is an illusion created by ignorance or bad faith.

  **Crux 3: Epistemic Burden**
  *   **Issue:** How much knowledge of *jus ad bellum* is required for a combatant to be liable?
  *   **Agreed Test Case:** A soldier in a closed society with state-controlled media fighting a secretly aggressive war.
  *   **Orthodox Prediction:** The soldier is not blameworthy and retains equal status; we cannot expect individual soldiers to adjudicate national policy.
  *   **Revisionist Prediction:** The soldier is still an unjust threat and technically liable, though their lack of knowledge may make attacking them pragmatically or all-things-considered wrong, despite their objective liability.

  **IV. Hard Case Resolutions (Procedural)**

  Regarding **(a) the Conscript** and **(b) the Drone Operator**, the parties agree that these cases reveal the tension between *individual moral responsibility* and *collective institutional status*.
  *   **Orthodox Stance:** Both are combatants. The conscript is excused by duress; the drone operator is bound by role. Both are legitimate targets.
  *   **Revisionist Stance:** Both are potentially liable unjust threats. The conscript's liability is attenuated by coercion; the drone operator's liability is heightened by voluntariness and safety.
  *   **Joint Acknowledgement:** Any complete theory must account for why the drone operator feels morally distinct from the conscript, and why the law treats them identically.

  \jointstatement{We agree that the morality of killing in war cannot be settled by appeal to convention alone, nor by appeal to individual morality alone, but requires a sustained inquiry into how institutional roles mediate individual responsibility.}
