  9.  **Final Review of the "Bonus" Logic:**
      *   User says: "Ive been jaywalking freely here since locals seem to ignore the law too."
      *   User asks: "under which of the readings, if any, am I in the wrong there but not for tipping, or vice versa?"
      *   *Scenario A (Normative Custom):* Romans jaywalk. Romans tip. User jaywalks (Correct). User doesn't tip (Incorrect). -> Friend wins on tipping, User wins on jaywalking.
      *   *Scenario B (Legal/Strict Rule):* Romans have laws against jaywalking. Romans have contracts expecting tips. User jaywalks (Incorrect). User doesn't tip (Correct/Neutral). -> User wins on tipping, Friend wins on jaywalking.
      *   *Scenario C (Prudential):* Romans don't get caught jaywalking. Romans get angry if you don't tip. User jaywalks (Safe). User doesn't tip (Risky). -> Friend wins on tipping, User wins on jaywalking.
      *   *Synthesis:* The proverb generally favors following *observed behavior*. Since locals jaywalk, you are "doing as the Romans do." Since locals tip, you are *not* "doing as the Romans do" by withholding tips. So the proverb actually indicts your tipping stance more than your jaywalking. I need to make sure this distinction is clear.

