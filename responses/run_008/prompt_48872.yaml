prompt: |-
  my friend keeps pulling out "when in Rome, do as the Romans do" whenever I balk at local customs, most recently over tipping. Context: im from a country where tipping basically doesnt exist, im visiting the US for a few weeks, and my position is that the whole system is bad — servers should just be paid a real wage — so I'd rather not participate in propping it up. He says the proverb settles it: visitors are bound by local conventions, period. Another friend in the convo said no, it's just practical advice, like "don't get arrested jaywalking". It struck me that the line gets used to do very different jobs, and I want to know which job, if any, it can actually do.

  Can you separate the distinct precise claims that could be packed into "when in Rome"? Off the top of my head: (i) prudential advice — don't stand out, avoid hassle or punishment; (ii) a claim about conventions as solutions to coordination problems, such that conforming is the rational move even for a one-off visitor since the convention's whole point is everyone following it; (iii) a genuine moral claim that local conventions bind visitors qua visitors, maybe out of respect or because conventions are how the community has chosen to handle some shared problem; (iv) full-blown relativism — what's right in a place is just whatever's done there; maybe (v) something about not being arrogant, i.e. it's about attitude not action. For each, say whether its plausible, and whether it actually gets my friend his conclusion that I must tip 20% even though I think the custom is unjust. And tell me which reading people probably have in mind when they deploy the line to end an arguement rather than to give travel tips. Bonus question: Ive been jaywalking freely here since locals seem to ignore the law too — under which of the readings, if any, am I in the wrong there but not for tipping, or vice versa? Lay it out as a list, one reading per bullet, that I can just forward him.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is visiting the US from a no-tipping country. They believe the US tipping system is unjust (servers should be paid wages) and refuse to tip. A friend cites "When in Rome, do as the Romans do" to argue they *must* tip. Another friend argues it's just practical advice (like jaywalking).
      *   **Goal:** The user wants to understand the distinct philosophical/practical claims packed into the proverb "When in Rome..." to see if any actually support the friend's conclusion (that they are *obligated* to tip).
      *   **Specific Tasks:**
          1.  Separate distinct precise claims (readings) of the proverb.
          2.  Evaluate plausibility for each.
          3.  Evaluate whether each reading supports the friend's conclusion (must tip 20%).
          4.  Identify which reading people usually mean when ending an argument.
          5.  Answer the bonus question about jaywalking (why it might be okay there but not tipping, or vice versa).
          6.  Format: A list, one reading per bullet, suitable for forwarding to the friend.

  2.  **Deconstruct the Proverb ("When in Rome..."):**
      *   *Origin:* St. Ambrose advising St. Augustine. Context: Fasting practices on Saturdays. Ambrose said: "When I am at Rome, I fast on a Saturday; when I am at Milan, I do not. Follow the custom of the church where you are."
      *   *Core Tension:* Is it about *prudence* (avoiding trouble), *politeness* (respecting hosts), or *morality* (local rules define right/wrong)?

  3.  **Drafting the Readings (based on user's suggestions + refinement):**

      *   *Reading 1: Prudential/Self-Interest.* (Don't get in trouble/awkward).
      *   *Reading 2: Coordination/Convention.* (Conventions only work if everyone follows them).
      *   *Reading 3: Respect/Reciprocity.* (Guests owe hosts deference).
      *   *Reading 4: Moral Relativism.* (Rightness is defined by location).
      *   *Reading 5: Epistemic Humility.* (Maybe they know something you don't).

      *Refining for the User's specific list:* The user proposed (i) prudential, (ii) coordination, (iii) moral binding/respect, (iv) relativism, (v) attitude/arrogance. I should stick close to these but sharpen them.

  4.  **Evaluating Each Reading against the Tipping Scenario:**

      *   *(i) Prudential:* Will I get arrested or shamed? Tipping isn't illegal. You might get a dirty look or a confrontation, but rarely "punishment." *Verdict:* Weak support for "must."
      *   *(ii) Coordination:* Does my non-tipping break the system? Individually, no. It's not a traffic rule where one person jaywalking causes a crash. It's a distributed economic subsidy. *Verdict:* Weak support for individual obligation.
      *   *(iii) Respect/Contract:* As a guest, do I owe it to the host culture? This is the strongest social argument. But does it extend to *unjust* systems? *Verdict:* Moderate support, but contestable on justice grounds.
      *   *(iv) Relativism:* Is tipping "right" just because Americans do it? Most people reject hard relativism. *Verdict:* Philosophically weak, rarely genuinely believed.
      *   *(v) Attitude:* Is it about being humble? Maybe. But action still matters. *Verdict:* Doesn't force action.

  5.  **Addressing the "Argument Ender" Aspect:**
      *   When people use this to shut down debate, they usually mean a mix of Prudential (don't be awkward) and Respect (don't insult us). It's a social norm enforcement tool, not a deep moral claim.

  6.  **Addressing the Bonus (Jaywalking):**
      *   *Jaywalking:* Law exists, but enforcement/norm is "ignore it." Following the *norm* means jaywalking. Following the *law* means waiting.
      *   *Tipping:* Norm exists (tip 20%). Law (minimum wage) is different (tipped wage).
      *   *Comparison:* If "When in Rome" means "follow local *norms*," you should tip and jaywalk. If it means "follow local *laws*," you should tip (contractual) and not jaywalk.
      *   *The Twist:* The user is jaywalking (following local *behavior*) but not tipping (rejecting local *behavior*).
      *   *Analysis:* Under Prudential reading: Jaywalking is fine (no cops), Tipping is "fine" to skip (no cops) but socially costly. Under Moral reading: Jaywalking is victimless, Tipping supports low wages.
      *   *Conclusion:* You are consistent if you follow *observed behavior* (jaywalk + don't tip). You are inconsistent if you follow *rules* selectively. But the friend's argument usually targets the *social cost*, not consistency.

  7.  **Drafting the Content (Iterative refinement for tone and clarity):**
      *   *Tone:* Analytical, philosophical, slightly witty (matching the user's prompt), clear enough to forward.
      *   *Structure:* Bullet points as requested.
      *   *Key Distinction:* Differentiate between "Is this advice true?" and "Does this prove I *must* tip?"

      *(Self-Correction during drafting)*: Make sure to explicitly answer "Does this get your friend his conclusion?" for each bullet. That's a specific constraint.
      *(Self-Correction on Bonus)*: Be careful with the jaywalking logic. In the US, jaywalking is illegal but often unenforced. Tipping is socially mandatory but legally voluntary (though wages are legally lower). The parallel is tricky. I need to clarify that "When in Rome" usually refers to *customs*, not *laws*. So jaywalking *is* "doing as the Romans do" if Romans jaywalk. Not tipping is *not* "doing as the Romans do." So under the proverb, the user is wrong about tipping, but right about jaywalking. Wait, that supports the friend. I need to nuance this. The user asks: "under which readings am I in the wrong there [jaywalking] but not for tipping, or vice versa?"
      *   *Reading:* If the proverb means "Follow local *norms*": You are right to jaywalk (locals do), wrong to not tip (locals don't).
      *   *Reading:* If the proverb means "Follow local *laws*": You are wrong to jaywalk, right to not tip (no law requiring 20%).
      *   *Reading:* If the proverb means "Prudential": You are right to jaywalk (no tickets), wrong to not tip (social hassle).
      *   *Okay, the insight:* The proverb supports the friend on tipping (social norm) but supports *you* on jaywalking (observed behavior).

  8.  **Final Polish:** Check against constraints.
      *   List format? Yes.
      *   One reading per bullet? Yes.
      *   Plausibility? Yes.
      *   Does it support friend's conclusion? Yes.
