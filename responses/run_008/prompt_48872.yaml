answer: |-
  Here is a breakdown of the distinct claims hidden inside "When in Rome," evaluated for plausibility and whether they actually force you to tip. You can forward this directly to your friend.

  *   **The Prudential Reading (Don't get punished)**
      *   **The Claim:** This is purely risk management. Local conventions are enforced by social sanction or legal penalty. If you violate them, you suffer hassle, shame, or arrest.
      *   **Plausibility:** High. This is the most common practical use of the phrase.
      *   **Does it prove you must tip?** **No.** Not tipping is not illegal. While a server might glare at you or chase you out, you won't be arrested. However, if you view social awkwardness as a "punishment," it suggests you *should* tip to avoid the scene.
      *   **Verdict on Jaywalking:** Under this reading, you are **right to jaywalk** (if locals do it and don't get tickets) and **pragmatically wrong to skip tipping** (if locals will give you a hard time). The proverb supports your jaywalking but advises you to tip to avoid conflict.

  *   **The Coordination Reading (Solve the collective action problem)**
      *   **The Claim:** Conventions exist to solve coordination problems (like which side of the road to drive on). The system only works if everyone follows it, so you are obligated to conform to maintain the equilibrium, even temporarily.
      *   **Plausibility:** Medium. Works for traffic, less so for distributed economic systems.
      *   **Does it prove you must tip?** **No.** Your individual refusal to tip for a few weeks will not collapse the US wage system. You are not "breaking" the coordination in a way that causes immediate failure, unlike driving on the wrong side of the road.
      *   **Verdict on Jaywalking:** Under this reading, you are **wrong to jaywalk** if it disrupts traffic flow, but **right to skip tipping** because your individual non-contribution doesn't break the coordination. This is the only reading where the proverb might side with you on tipping.

  *   **The Hospitality Reading (Respect the Host)**
      *   **The Claim:** As a guest, you owe deference to the host community. Imposing your home standards implies your way is superior, which is disrespectful. It's a duty of reciprocity: they host you, you follow their house rules.
      *   **Plausibility:** High. This is the moral core of the original St. Ambrose quote regarding religious fasting.
      *   **Does it prove you must tip?** **Maybe.** If you view the tip as part of the "house rule" of the transaction, violating it is rude. However, most moral frameworks allow guests to withhold cooperation from practices they deem *unjust* (e.g., you wouldn't follow a custom of segregation). If tipping is unjust, respect doesn't mandate complicity.
      *   **Verdict on Jaywalking:** Under this reading, you are **wrong to jaywalk** if it violates the host's laws (even if they break them), because you are disrespecting their sovereignty. You are **wrong to skip tipping** because you are disrespecting their economic customs. This reading indicts you on both counts.

  *   **The Relativist Reading (Right is defined by Location)**
      *   **The Claim:** Morality is local. An action isn't inherently right or wrong; it becomes right *because* the locals do it. There is no external standard to judge the custom by.
      *   **Plausibility:** Low. Most people use the proverb without actually believing hard moral relativism.
      *   **Does it prove you must tip?** **Yes, but at a high cost.** If you accept this, you must admit tipping is morally good *because* Americans do it. But you also have to admit that if you were in a country where bribery was customary, bribery would be morally good.
      *   **Verdict on Jaywalking:** Under this reading, if locals jaywalk, jaywalking is "right." If locals tip, tipping is "right." You are inconsistent. You must either tip and jaywalk, or neither.

  *   **The Epistemic Humility Reading (Assume they know something you don't)**
      *   **The Claim:** Locals have information you lack. Their customs evolved for reasons you might not see. Arrogance makes you assume your way is better; humility suggests you should follow their lead until you understand why.
      *   **Plausibility:** Medium. Good for food safety or traffic, less good for labor economics.
      *   **Does it prove you must tip?** **No.** You already understand *why* they tip (subsidized wages) and have rejected the premise. You aren't ignoring the reason; you disagree with it.
      *   **Verdict on Jaywalking:** Under this reading, if locals jaywalk, perhaps they know the cops don't care. You are **right to jaywalk**. If locals tip, perhaps they know servers need it. You are **wrong to skip tipping**.

  ***

  **Which reading is your friend using?**
  When people deploy this line to **end an argument**, they are almost always using a mix of **Prudential** ("Stop making it awkward for us") and **Hospitality** ("Stop acting like you're better than us"). They are rarely making a philosophical claim about moral relativism or coordination problems. They are enforcing a social norm.

  **The Bonus: Jaywalking vs. Tipping**
  You asked under which readings you are in the wrong for one but not the other.
  *   **You are consistent (Right on both):** Under the **Prudential** and **Relativist** readings, if "doing as the Romans do" means copying *observed behavior*, you should jaywalk (because they do) and tip (because they do). By jaywalking but not tipping, you are cherry-picking.
  *   **You are consistent (Wrong on both):** Under the **Hospitality** reading (following *laws/rules*), you should not jaywalk (it's illegal) and you should tip (it's a contractual norm).
  *   **You are inconsistent (Right on Jaywalking, Wrong on Tipping):** This is the **Prudential** reading. Locals jaywalk without consequence (so you are safe doing it), but locals do not tip-fish without consequence (so you are risking social penalty).
  *   **You are inconsistent (Wrong on Jaywalking, Right on Tipping):** This is the **Coordination** reading. Jaywalking risks a crash (system failure); not tipping does not risk economic collapse (no system failure).

  **Summary for your friend:**
  If "When in Rome" means "Copy observed behavior," I should jaywalk (check) but also tip (fail). If it means "Follow the law," I shouldn't jaywalk (fail) and don't legally have to tip (check). If it means "Don't be rude," it depends on whether supporting an unjust wage system is ruder than being a cheap guest. The proverb doesn't settle that; it just hides the question.
