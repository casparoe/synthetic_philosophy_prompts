          *Analysis:* If every counterexample is met with "that person wasn't reasonable," it's insulated. If the fallback baseline is adjusted to fit desired outcomes, it's unfalsifiable.
          *Verdict:* It risks being a regulative ideal rather than an operational algorithm. If "reasonable" is defined by the output we want, it's circular. But if "reasonable" is fixed independently, it's vulnerable.
          *Draft:* The position risks insulation if "reasonable" becomes a catch-all for "those who agree with the system." If every veto is dismissed by reclassifying the objector as unreasonable, the test is unfalsifiable. Similarly, if the fallback baseline is adjusted ad hoc to ensure functionality, the claim of neutrality dissolves. However, this insulation may be the ordinary discipline of a regulative ideal rather than a disqualifying flaw. Political liberalism often functions as a norm for justification rather than a decision procedure. The danger arises if the AI system claims operational neutrality while relying on hidden substantive parameters to function. If the "thin" values are too thin to decide, the system is useless; if thick enough to decide, it is not neutral. The position is stable only if it accepts being under-determinate, leaving some conflicts unresolved rather than forcing a pseudo-neutral solution.

      *   **What I would find most persuasive:**
