      *   **Constraint:** Do not resolve the dispute. Do not favor one side. Do not include a bibliography. Focus on interpretive methodology and textual analysis, not historical truth of the claim itself.
      *   **Structure:**
          1.  Agreed Claims (numbered).
          2.  Disagreements Table (statement, type, key term meanings).
          3.  Cruxes (specific interpretive pivots).
          4.  Arguments/Tests for Cruxes (predictions from both sides).
