answer: |-
  Your instinct that the argument proves too much is correct, and your suspicion of step (4) is scientifically sound: in spectroscopy, parsimony is a tie-breaker only when explanatory power is equal, not a truth-maker itself. However, rejecting (4) alone does not save your son's work. If step (3) holds—that the sources cannot distinguish between agency and structure—then under your definition of knowledge (1), neither explanation qualifies as knowledge, regardless of which one parsimony prefers. The argument would simply leave us in agnosticism rather than validating structural history over diplomatic history.

  To salvage the possibility of historical knowledge regarding individual agency, you must reject **step (3)**.

  Step (3) claims that sources cannot distinguish between agency and material determinism because both stories are "consistent with every sentence the sources contain." This conflates logical consistency with evidentiary support. In science, two models may both be consistent with the data (neither is falsified), yet one fits the data significantly better (higher likelihood). Diplomatic sources often contain records of failed plans, debated alternatives, and counterfactual reasoning ("We chose X because Y was too risky"). If material processes determined the outcome, these records of contingency would be anomalous noise; if agency determined the outcome, they are signal. The sources do not merely permit both stories; they often make the structural story highly improbable by revealing that the outcome was not inevitable but contested.

  **The Cost:**
  Rejecting (3) costs you epistemic humility. It requires accepting that human intent leaves a recoverable trace distinct from structural noise, and that elites sometimes recorded their motives accurately enough for inference. It opens the door to the "intentional fallacy," where historians might mistake self-justification for causation. You must accept that historical knowledge is probabilistic and hermeneutic, not merely deductive from the text.

  **Regarding Step (6):**
  You are right that (6) is a non sequitur. Even if history from above were unknowable, it does not follow that history from below is secure. Parish registers and wage series are also interpreted through background knowledge and suffer from their own underdetermination (e.g., did wages fall or did record-keeping change?). Rejecting (6) limits the damage of the argument but does not save your son's specific field.

  **Fragility of this Diagnosis:**
  The consideration that would most plausibly change my verdict is evidence that diplomatic sources are systematically performative rather than descriptive—that is, if ministers *always* wrote to create a legacy rather than record a decision, rendering the "signal" of agency indistinguishable from the "noise" of posture. In that specific domain, step (3) might hold true despite my general objection. I am most likely to have gone wrong in assuming historical texts function like spectral data; spectra are physical effects not designed to deceive, whereas diplomatic correspondence is often crafted to obscure intent. If the medium itself is fundamentally opaque, my demand for distinguishability is misplaced.

  Verdict: reject step 3
