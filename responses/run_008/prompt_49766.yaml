answer: |-
  It is a pleasure to engage with a colleague who bridges the empirical and the ontological so adeptly. Your observation is astute: biology often operates with a pragmatic ontological pluralism that metaphysicians spend careers trying to resolve into a single consistent system. As a metaphysician with a background in the philosophy of biology, I will attempt to meet you on this ground, respecting both the rigour of the metaphysical literature and the empirical constraints of your former profession.

  Per your instructions, I will begin by outlining the metaphysical landscape regarding the Special Composition Question (SCQ) and commit to a position, before turning to the biological practices you described.

  ### 1. The Metaphysical Landscape and a Commitment

  The SCQ asks: *Under what conditions do some things (the xs) compose a further thing (the y)?* There are three primary families of answer in the contemporary literature:

  1.  **Mereological Nihilism (Eliminativism):** This view holds that composition *never* occurs. There are no composite objects, only simples (fundamental particles). Talk of "organisms" or "colonies" is merely a *façon de parler*. While ontologically parsimonious, this view is radically revisionary. It denies the existence of the very entities biology studies.
  2.  **Mereological Universalism:** This view holds that composition *always* occurs. For any collection of things (e.g., a bee, a stone, and a star), there exists a further object composed of them. This preserves the existence of organisms but at the cost of populating the world with arbitrary "scattered objects" that have no biological significance.
  3.  **Restrictivism:** Composition occurs only under specific conditions.
      *   **Van Inwagen's Life Criterion:** A prominent version of restrictivism. Van Inwagen argues that composition occurs only when the activity of the parts constitutes a *life*. For him, the only composite material objects are living organisms.
      *   **Functional/Structural Restrictivism:** Composition occurs when parts are bonded or functionally integrated to a high degree.
  4.  **Deflationism (or Metaontological Conceptualism):** This view suggests there is no mind-independent fact of the matter regarding composition. Whether the xs compose a y depends on our conceptual schemes, linguistic practices, or explanatory interests. Composition is not a discovery of fundamental ontology but a tool of description.

  **My Commitment:**
  Given the biological data you have presented—specifically the legitimate oscillation between counting methods depending on explanatory context—I commit to **Deflationism (specifically, a form of Metaontological Pluralism)**.

  While Van Inwagen's Life Criterion is the most robust *realist* attempt to capture biological intuition, it struggles with the boundary cases you cite (lichens, superorganisms). Nihilism is too eliminative to be useful. Deflationism best explains why biologists can consistently switch between "colony as organism" and "colony as population" without committing a logical error: they are shifting conceptual frameworks to track different causal patterns, not discovering different fundamental substances.

  ### 2. Reconstructing the Implicit Theory in Biological Practice

  You ask what these practices presuppose. If we look at the cases of the honeybee colony, *Physarum*, Pando, and the lichen, biology does not appear to presuppose a single metaphysical criterion for composition (such as strict spatial continuity or genetic identity). Instead, the practice presupposes **Explanatory Indispensability grounded in Causal Integration.**

  *   **Functional Integration:** When biologists treat the hive as a superorganism (thermoregulation, division of labour), they are tracking *systemic causal powers*. The colony does things the individual cannot. The "composition" is posited because the collective exhibits homeostasis.
  *   **Shared Ancestry/Genetics:** When treating Pando as one tree, the criterion is genotypic identity. When treating it as many stems, the criterion is modular independence.
  *   **Level of Selection:** This is the crucial metaphysical pivot. When applying inclusive fitness theory, the "individual" is the vehicle for the gene. When studying swarm intelligence, the "individual" is the colony.

  **Reconstruction:** Biological practice does not presuppose that composition is fixed by a mind-independent relation (like "bonding" or "life" in a metaphysical sense). Rather, it presupposes that **composition is interest-relative.** The "object" is defined by the level at which the biologist is attempting to model information flow, energy transfer, or replication. The ontology is subservient to the model.

  ### 3. Consistency of Counting Practices

  Are the two counting practices (superorganism vs. gene's-eye) consistent?

  *   **From a Realist Perspective (e.g., Van Inwagen):** They are **incompatible**. If the colony is a composite object (an organism), then the workers are parts. If the workers are the primary organisms (as inclusive fitness often implies to calculate relatedness), then the colony is a mere collection. A realist must choose one as the *true* ontology.
  *   **From a Deflationary Perspective:** They are **consistent**. They are different maps for different territories. The "gene's-eye view" is a heuristic for tracking allele frequency changes; the "superorganism view" is a heuristic for tracking physiological regulation.

  Since biology tolerates this oscillation without crisis, it suggests the discipline implicitly rejects the Realist demand for a single true count. The practices are consistent *pragmatically*, even if they are inconsistent *ontologically*. The fact that no entomologist loses sleep over this suggests that the "inconsistency" is a feature of our descriptive language, not a bug in the world.

  ### 4. Van Inwagen's Life Criterion and Nested Lives

  This is the sharpest metaphysical knife in your query. Van Inwagen's criterion states: *The xs compose a y if and only if the activity of the xs constitutes a life.*

  *   **The Problem:** In a honeybee colony, the workers are themselves living things. Their activity constitutes *their* lives. Does their joint activity constitute a *further* life?
  *   **Van Inwagen's Adjudication:** Van Inwagen is aware of this. In *Material Beings*, he is skeptical that social insects compose a further organism. He tends to view a "life" as a single, continuous metabolic event. While a colony exhibits homeostasis, Van Inwagen would likely argue that the metabolic events are distinct for each bee. The colony is a *society* of organisms, not an *organism* itself. He would deny composition at the colony level.
  *   **The Indeterminacy:** However, Van Inwagen's criterion relies on a pre-theoretic notion of "life." If "life" is defined functionally (homeostasis, reproduction, response to stimuli), the colony *does* have a life. If "life" is defined physiologically (a single circulatory/metabolic boundary), it does not.
  *   **Conclusion on Van Inwagen:** His criterion leaves these cases **indeterminate** unless one stipulates a very narrow definition of "life" that excludes superorganisms. If he admits the colony has a "life," he must accept nested composition (lives made of lives), which complicates his ontology significantly (what happens to the parts? Are they still organisms?). If he denies the colony has a "life," his criterion conflicts with the biological utility of the superorganism concept. Thus, his criterion fails to capture the nuance of biological practice here.

  ### 5. Presupposition vs. Comfort and the Deflationary Implications

  Finally, we must distinguish what biology *needs* to be true versus what it *hopes* is true.

  **Presupposition vs. Comfort:**
  *   **Strict Presupposition:** Biological practice strictly presupposes **Causal Realism**. It requires that the entities posited (genes, workers, colonies) have causal powers that affect survival and reproduction. It does *not* strictly presuppose **Mereological Realism** (that there is a fact of the matter about whether the colony is an "object").
  *   **Sits Comfortably With:** The practice sits comfortably with Common-Sense Realism (there really are bees and hives). It creates tension only when pressed by metaphysical questions like the SCQ. The underdetermination you suspect is real: the data supports multiple ontological interpretations equally well.

  **Implications of Adopting Deflationism Seriously:**
  If biology explicitly adopted the Deflationary view (that composition is a conceptual tool, not a discovery of natural joints), what would change?

  1.  **Taxonomy and Nomenclature:** We would see more explicit qualifiers. A lichen species name might be formally annotated as denoting a "symbiotic functional unit" rather than a "biological individual." The naming of Pando might distinguish between "genet" (the genetic individual) and "ramet" (the physical stem) more rigorously in general literature, not just technical ecology.
  2.  **Field Guides:** Guides might shift from depicting "organisms" to depicting "observable units." A guide might note: "This grove acts as a single genetic unit but functions as distinct trees for fire resistance."
  3.  **Theoretical Biology:** It would validate the oscillation you described. Currently, there is often a quiet embarrassment or heated debate about "what is the individual?" (e.g., in holobiont theory). Deflationism would dissolve this tension. It would allow theorists to say: "For the purpose of this model of immune response, the holobiont is the individual; for this model of vertical transmission, the host is the individual."
  4.  **No Loss of Predictive Power:** Crucially, adopting Deflationism would not change the *math* of inclusive fitness or the *measurements* of thermoregulation. It would only change the *interpretation* of what exists. We would stop asking "Is the colony *really* an organism?" and start asking "Does treating the colony as an organism yield better predictions in this context?"

  **Summary:**
  Your intuition is correct. Biology has been operating as a quiet deflationist for a century. It treats composition as a variable dependent on the scale of inquiry. Van Inwagen's Life Criterion is too rigid to capture this, forcing a binary choice where biology sees a spectrum. By acknowledging that "composition" is a bookkeeping device for tracking causal processes, we preserve the utility of both the gene's-eye view and the superorganism view without requiring the world to be one or the other. The "odd angle" you approached from is, I suspect, the only angle that resolves the tension without doing violence to either the metaphysics or the science.
