answer: |-
  **MEMORANDUM**

  **TO:** Academic Conduct Committee
  **FROM:** [Your Name/Chair]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Recommendation: Case J. (Unauthorized Materials vs. Disability Accommodation)

  **Case Summary**
  Student J. was observed querying a smartphone app containing recorded lectures and notes during a closed-book, on-paper exam. J. holds a documented disability accommodation permitting lecture recording due to a memory-related impairment. J. contends the app functions as prosthetic memory, constituting internal knowledge. The instructor filed a charge of unauthorized materials. The committee is divided on whether this constitutes academic dishonesty or a protected accommodation usage.

  **Committee Division and Analysis**
  This case hinges on the definition of "knowledge" within our assessment framework and the scope of "reasonable accommodation."

  *The Argument for Upholding the Cheating Finding*
  Those favoring a finding of misconduct argue that closed-book exams measure specific cognitive learning outcomes: internalization, recall, and synthesis under constraint. Allowing external query tools fundamentally alters the construct being measured. If J. can access the "answer key" of recorded lectures during the test, the assessment no longer verifies her mastery of the material any more than a calculator verifies mastery of arithmetic for a student without a calculation disability accommodation. Furthermore, fairness dictates that all students are subject to the same constraints unless a specific exemption is granted *before* the assessment. Permitting this retroactively undermines the integrity of the grading curve and the value of the credential for students who adhered to the closed-book constraint.

  *The Argument for Accommodation*
  Those favoring dismissal argue that memory is not exclusively biological. For students with specific cognitive disabilities, external aids function as necessary prosthetics, analogous to a screen reader for a blind student or a wheelchair for a mobility-impaired student. To demand biological recall is to discriminate based on neurology. The disability office confirmed the accommodation was intended to mitigate memory loss; restricting *how* that mitigation is achieved (i.e., forbidding the app during exams) renders the accommodation useless. The intent was not to deceive, but to access course material on equal footing.

  **Recommendation**
  We must balance academic integrity with legal and ethical obligations to accommodate disabilities. Punishing J. ignores the ambiguities in how the accommodation was communicated to the instructor. However, allowing unrestricted use undermines the course's learning objectives. Therefore, we cannot simply overturn the finding without safeguards, nor can we uphold it without violating accommodation standards.

  I recommend we **allow the use of the aid with strict conditions** for future assessments, and vacate the cheating finding for the current case based on lack of clear prior prohibition regarding the *method* of accommodation.

  **Implementable Conditions**
  To preserve academic standards while honoring the accommodation, the following protocols are effective immediately for J. and similar cases:

  1.  **Device Isolation:** The device used must be dedicated solely to the accommodation app. It must be placed in "kiosk mode" or equivalent lockdown preventing internet access, messaging, or other storage during the exam.
  2.  **Assessment Redesign:** The instructor is not required to administer a standard closed-book exam to J. If the learning outcome is "recall," the accommodation may require a fundamental alteration of the course, which is not required. However, if the outcome is "application," the exam questions for J. must be designed to test synthesis and application of the material, ensuring the app provides data but not answers. The Disability Office must facilitate a meeting between J. and the instructor to align exam design with accommodation *before* the next assessment.
  3.  **Proctoring Verification:** A proctor must verify the device's content and lockdown status prior to the exam start.
  4.  **Current Case Resolution:** The cheating finding is vacated. J. retains the grade on the current exam *only if* the instructor confirms the exam questions required application beyond simple lookup. If the instructor contends the exam was purely recall-based and thus compromised, J. will be offered a separate, alternative assessment covering the same material under the new conditions.

  **Communication Plan**
  *   **To the Instructor:** Acknowledge the validity of their concern regarding exam integrity. Clarify that the committee is not ruling that "anything goes," but that the accommodation scope was undefined. Emphasize that future exams will be adjusted to test competency rather than raw recall to mitigate the advantage of the aid.
  *   **To the Disability Office:** Confirm that we support the accommodation but require specific boundaries on *implementation* during high-stakes assessment to ensure the aid does not become an unfair advantage unrelated to the disability.

  This path avoids setting a precedent that external aids are universally permissible in closed-book settings while ensuring J. is not penalized for a systemic communication failure.

  Verdict: allow with conditions
