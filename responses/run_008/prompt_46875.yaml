  *(Self-Correction Note)*: I need to make sure I don't accidentally validate consequentialism too hard. The user is asking about *moral worth* (the agent's character/motive), not just outcomes. Stick to the "credit" aspect.

  Let's build the "Security Snob" case.

  *   **Agent:** Sam.
  *   **Act:** Refusing to deploy user data collection that is legally grey but profitable.
  *   **Motive:** Sam hates "script kiddies" and "corp sellouts." Sam feels intellectually superior.
