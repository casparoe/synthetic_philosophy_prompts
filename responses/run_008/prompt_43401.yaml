answer: |-
  ### Brainstorming & Conceptual Mapping

  Before settling on a definitive reconstruction, I need to lay out the conflicting theoretical currents running through the Health Technology Assessment (HTA) practice you describe. The tension you identify is the "index number problem" of welfare economics resurfacing in clinical guise.

  1.  **The Measurement Layer (vNM vs. QALY):**
      *   *vNM Theory:* Establishes cardinal utility for a *single* agent under risk. $U(p) = \sum \pi_i u(x_i)$. Unique up to positive affine transformation ($u' = au + b$).
      *   *QALY Practice:* Fixes $u(\text{death}) = 0$ and $u(\text{perfect health}) = 1$ for *all* agents. This eliminates the $a$ and $b$ indeterminacy interpersonally.
      *   *The Gap:* vNM does not justify setting $a=1, b=0$ across persons. It assumes "Perfect Health" is the same distance from "Death" for a 20-year-old and an 80-year-old. This is an ethical calibration, not a psychometric fact.
      *   *Risk Neutrality:* QALYs usually assume linearity in life years (10 years at utility 0.5 = 5 QALYs). vNM does not require risk neutrality over time. This is a hidden simplification.

  2.  **The Aggregation Layer (Summation):**
      *   *The Math:* Summing QALYs ($\sum \Delta Q_i$) implies a Social Welfare Function (SWF) that is additive.
      *   *The Ethics:* This is Classical Utilitarianism. It treats the society as a single super-agent.
      *   *The "Equal Value" Principle:* This asserts the marginal social value of health is constant. $\frac{\partial W}{\partial Q_i} = k$.
      *   *Severity Weighting:* If we weight the severely ill more heavily, we change the SWF to Prioritarianism (concave transformation of utility) or Sufficientarianism. This contradicts the "equal value" principle.

  3.  **The Ontological Layer (What is being measured?):**
      *   *Hedonism:* Is it pleasure/pain? (Unlikely in modern HTA).
      *   *Preference Satisfaction:* Is it getting what you want? (vNM aligns here).
      *   *Objective List/Capabilities:* Is it functioning? (Sen/Nussbaum). QALYs look like this but are elicited via preference.
      *   *Ordinalism:* If utility is just ranking, summation is category error. Can we reconstruct QALYs as a "resource metric" (like money) rather than utility? If so, we need a theory of "health need" independent of utility.

  4.  **The Political Layer (Oregon & Legitimacy):**
      *   Oregon's failure suggests the implicit SWF (Utilitarian) conflicts with public morality (which often prioritizes the "rescue principle" or "identifiable lives").
      *   HTA agencies operate on a "technocratic veil." They assume the numbers speak, but the numbers are laden with ethical choices (the anchoring of 0 and 1).

  5.  **Possible Reconstructions:**
      *   *Harsanyi's Veil:* Rational agents behind a veil of ignorance, satisfying vNM axioms, would choose to maximize average utility. This bridges individual vNM to social summation. *Problem:* Requires assuming everyone has the same utility function for health behind the veil.
      *   *Impartial Observer:* Adam Smith's spectator. The weights are what a benevolent planner *would* use, not necessarily what the math says.
      *   *Pragmatic Convention:* The numbers aren't "true" utilities but a common currency for trade-offs, justified by budget constraints rather than moral truth.

  **Decision for Analysis:** I will argue that the practice *strictly presupposes* cardinal, interpersonally comparable welfarism (Utilitarianism), which is theoretically unsupported by the vNM elicitation method alone. However, it can be *charitably reconstructed* via a Harsanyi-style social contract argument, though this reconstruction breaks down when severity weighting is introduced. An ordinalist cannot sign off on the arithmetic without abandoning ordinalism. The practice is internally inconsistent regarding distributive justice when it flirts with severity weighting while maintaining the "QALY is a QALY" slogan.

  ---

  ### Formal Analysis: The Implicit Theory of QALY Maximization

  You have put your finger on the central scandal of modern welfare economics: the illicit slide from individual preference ordering to interpersonal aggregation. As a physicist, you recognize this as a dimensional analysis error; as a philosopher, I recognize it as a category mistake regarding the ontology of value.

  Here is the reconstruction of the implicit theory, its rivals, and a judgment on its consistency.

  #### 1. The Ontological Commitment: Cardinal Welfarism
  Routine QALY-based prioritization strictly presupposes **Cardinal Welfarism with Full Interpersonal Comparability.**

  *   **Cardinality:** The arithmetic of cost-effectiveness analysis (CEA)—specifically the addition and subtraction of QALY gains—requires that the intervals between utility points are meaningful. If utility were merely ordinal, we could say Patient A prefers State X to State Y, but we could not say the *difference* between X and Y is equivalent to the difference between P and Q for Patient B. The vNM elicitation (standard gamble) does provide cardinality *within* an individual, but only relative to that individual's risk attitude.
  *   **Interpersonal Comparability:** By anchoring "Death" at 0 and "Perfect Health" at 1 for *every* respondent, the HTA apparatus imposes an interpersonal calibration. It assumes that the "distance" from death to perfect health is invariant across persons. This is not a finding of decision theory; it is an ethical stipulation. It asserts that a year of life in a specific health state has an objective value independent of the person inhabiting it.
  *   **Welfarism:** The framework assumes that the only relevant information for social choice is the utility (health welfare) of individuals. Non-welfarist concerns (rights, processes, fairness of access) are excluded unless they can be translated into QALY losses.

  **Can an Ordinalist Sign Off?**
  Strictly, **no**. An ordinalist holds that utility functions are unique only up to monotonic transformation. Summing ordinal ranks is mathematically nonsensical (the "condorcet" problem).
  *   *The Exception:* An ordinalist could only accept the practice if they reinterpret QALYs not as *utilities* but as a **resource metric** (e.g., "health capital" or "functioning"). If health states are objectively ranked by a social consensus (e.g., via a panel rather than individual elicitation) and treated as a distributable good like money, the summation becomes a calculation of total resource allocation, not total utility. However, current HTA practice relies on individual preference elicitation (vNM), which ties the metric to subjective welfare, forcing the ordinalist to reject the foundation.

  #### 2. The Normative Commitment: Classical Utilitarianism
  The aggregation rule $\text{Maximize } \sum \text{QALYs}$ is the mathematical signature of **Classical Utilitarianism**.

  *   **The Impartial Observer:** The principle that "a QALY is a QALY" regardless of recipient identity implies a Social Welfare Function (SWF) of the form $W = \sum U_i$. This treats the society as a single container of health-value.
  *   **Harsanyi's Reconstruction:** The most defensible philosophical reconstruction of this practice is John Harsanyi's **Veil of Ignorance** argument. Harsanyi showed that if rational agents (satisfying vNM axioms) choose social rules behind a veil of ignorance (not knowing who they will be), they will maximize average utility.
      *   *How it saves QALYs:* It bridges the gap between individual vNM utility and social summation. It justifies treating the "0 to 1" scale as common because, behind the veil, everyone has the same probability of being anyone.
      *   *The Catch:* This requires the assumption that everyone has the *same* utility function for health states once behind the veil. In practice, HTA agencies assume this by averaging survey responses, effectively positing a "representative agent."

  #### 3. The Distributive Tension: Utilitarianism vs. Prioritarianism
  You noted the agency flirts with giving extra weight to the severely ill. This is the point where the implicit theory fractures.

  *   **"A QALY is a QALY":** This is a commitment to **Utilitarian Equality**. It means the marginal moral value of health is constant. It does not mean everyone gets equal health; it means everyone's health counts equally in the sum.
  *   **Severity Weighting:** Giving extra weight to the severely ill (e.g., end-of-life premiums) implies a **Prioritarian** SWF (Parfit), where $W = \sum f(U_i)$ and $f$ is concave. Here, a QALY gained by someone at a low baseline counts *more* than a QALY gained by someone at a high baseline.
  *   **The Inconsistency:** You cannot consistently hold both that "every QALY counts the same" and "severity warrants extra weight."
      *   If you weight for severity, you are admitting that the *identity* of the recipient matters (specifically, their baseline welfare).
      *   If you maintain "equal value," you must reject severity weighting, even if it feels unjust (the "repugnant conclusion" of utilitarianism: preferring many small benefits to few large rescues).
      *   *Current Practice:* HTA agencies often try to have it both ways: using the QALY sum for efficiency but applying "modifiers" for severity. Philosophically, this is incoherent. It is an admission that the QALY metric fails to capture the full moral value of health intervention, requiring a non-welfarist correction.

  #### 4. The Oregon Lesson: The Social Welfare Function Mismatch
  The Oregon Medicaid controversy of the 1990s serves as an empirical test of the implicit SWF. Oregon attempted to rank services strictly by cost-benefit (QALY-like) metrics. The public outrage arose because the implicit Utilitarian SWF conflicted with the public's **Lexicographic Priorities**.

  *   **The Rescue Principle:** Public morality often prioritizes saving identifiable lives (urgent, severe needs) over aggregate statistical gains (preventative, minor improvements).
  *   **The Mismatch:** A Utilitarian SWF allows trading a life for enough minor benefits (tooth cappings). A Prioritarian or Sufficientarian SWF would not.
  *   **Implication:** The practice presupposes a Utilitarian SWF, but its political legitimacy requires a Prioritarian one. The "technocratic" use of QALYs hides this ethical conflict under the guise of measurement.

  #### 5. What Would an Ordinalist/Non-Welfarist Practice Look Like?
  If we took the ordinalist critique seriously, or if we abandoned welfarism for a "needs-based" approach, the practice would change fundamentally:

  1.  **No Summation:** We would not sum benefits across persons. We would evaluate treatments based on whether they meet a threshold of need for specific individuals.
  2.  **Categorical Prioritization:** Services would be ranked in tiers (e.g., "Life-saving," "Palliative," "Enhancement") rather than on a continuous cost-per-unit scale.
  3.  **Deliberative Valuation:** Instead of eliciting utilities from surveys (aggregating preferences), values would be set by democratic deliberation (aggregating judgments). The "0" and "1" would be political settlements, not psychometric anchors.
  4.  **Explicit Equity Weights:** The SWF would be explicit. Instead of saying "a QALY is a QALY," the agency would publish an equity weight function $w(baseline\_health)$ and maximize $\sum w_i \cdot Q_i$.

  ### Judgment on Consistency

  Is the current practice consistent?

  1.  **Mathematically:** **No.** It uses vNM tools (which forbid interpersonal comparison) to perform interpersonal summation. It assumes linearity in time (risk neutrality) without testing it.
  2.  **Theoretically:** **No.** It claims Utilitarian neutrality ("a QALY is a QALY") while applying Prioritarian modifiers (severity weighting).
  3.  **Pragmatically:** **Stable, but fragile.** The practice works because the "0 to 1" calibration is treated as a *convention* rather than a *truth*. It functions as a common currency, much like money, allowing trade-offs that would otherwise be incommensurable.

  **Conclusion:**
  The routine QALY-based prioritization presupposes a **Cardinal, Interpersonally Comparable Utilitarianism** that the underlying decision theory (vNM) cannot support on its own. It relies on a hidden ethical calibration (the anchoring of scales) to bridge the gap. While a Harsanyi-style social contract offers a defensible reconstruction, the agency's flirtation with severity weighting reveals that the Utilitarian foundation is insufficient for public legitimacy. The practice is a hybrid: Utilitarian arithmetic draped over Prioritarian intuitions, held together by the pragmatic necessity of rationing. To be consistent, the agency must either abandon severity weighting (embracing hard Utilitarianism) or explicitly adopt a Prioritarian Social Welfare Function and adjust the arithmetic accordingly (e.g., using Quality-Adjusted Life *Years* weighted by baseline health). Continuing to sum unweighted QALYs while claiming to prioritize the severely ill is theoretically incoherent.
