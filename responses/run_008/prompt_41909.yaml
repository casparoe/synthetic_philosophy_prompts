prompt: |-
  My mate and I keep arguing about my indie game and I want an outside opinion. I've spent two years on it, I know the core mechanic is genuinely novel, and I have a pretty detailed model of why it will sell — the niche is underserved, my playtesters were obsessed, etc. My mate just keeps pointing at the stat that something like 90% of indie games never recoupe their costs, and says I should "update on the base rate" like I'm some random sample. My gut says the base rate is mostly made up of games by people who were way less careful than me, but I honestly can't tell if that's a real point or just my ego talking, especially since presumably everyone thinks they're the exception.

  Pretend you're a philosopher who works on epistemology and rationality. Take the question seriously rather than just telling me to follow my dreams or whatever. Maybe start by brainstorming both sides a bit — what each of us is getting right and where each of us might be going wrong — and then tell me whose reasoning you'd actually side with and why, including what evidence should move me one way or the other. Write the answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Indie game developer (2 years work, believes in novel mechanic, detailed market model, positive playtests).
      *   **Conflict:** Friend argues using base rate neglect (90% of indie games fail). User argues they are a special case (more careful, novel, etc.).
      *   **Role:** Philosopher specializing in epistemology and rationality.
      *   **Tone:** Serious, analytical, not motivational fluff ("follow your dreams").
      *   **Task:** Brainstorm both sides (strengths/weaknesses), pick a side (with justification), and specify what evidence should update beliefs.
      *   **Language:** American English.

  2.  **Deconstruct the Epistemological Problem:**
      *   This is a classic "Inside View vs. Outside View" debate (Kahneman & Lovallo).
      *   *Outside View (Friend):* Reference class forecasting. Look at the statistical distribution of outcomes for similar projects. Ignore specific details of the case.
      *   *Inside View (User):* Focus on the specific details, plans, and unique attributes of *this* project.
      *   *The Tension:* How much weight do we give the prior probability (base rate) vs. the likelihood ratio (specific evidence)?
      *   *Bias Check:* User suspects ego (optimism bias, planning fallacy). Friend might be guilty of reference class misuse (is the reference class actually appropriate?).

  3.  **Brainstorming Sides:**

      *   **The Friend (Base Rate/Outside View):**
          *   *Right about:* The sheer gravitational pull of statistics. Most things fail. Optimism bias is rampant in creative fields. "I'm the exception" is the most common sentence spoken by failures.
          *   *Wrong about:* Treating all indie games as a homogeneous reference class. A polished game with a novel mechanic and validated playtesting isn't the same as a Steam asset flip or a weekend jam game. Ignoring specific evidence (playtester obsession) is irrational Bayesian updating.

      *   **The User (Inside View/Specific Evidence):**
          *   *Right about:* Specific evidence *should* update the prior. If playtesters are obsessed, that increases the probability of success compared to a random game. Novelty matters in an oversaturated market.
          *   *Wrong about:* Overweighting the specific evidence. "Detailed model" might be just-so storytelling. Playtesters are a biased sample (friends? free users?). Two years of sunk cost makes quitting psychologically painful, leading to motivated reasoning.

  4.  **Developing the Philosophical Stance:**
      *   I need to synthesize. Pure base rate neglect is irrational. But blind adherence to base rates without updating on evidence is also irrational.
      *   *Bayesian Framework:* Start with the base rate (Prior). Update based on specific evidence (Likelihood).
      *   *The Crucial Question:* Is the user's evidence *strong enough* to overcome the 90% failure prior?
      *   *Reference Class Problem:* The friend's reference class ("indie games") is too broad. The user's reference class ("my game") is too narrow (N=1). We need a middle ground ("polished indie games with novel mechanics and validated playtesting").

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the question. It's not about art; it's about probability and belief formation.
      *   *Section 1: The Friend's Case (The Outside View).* Validate the base rate. Explain *why* it exists (market saturation, visibility algorithms). Point out the "Planning Fallacy."
      *   *Section 2: The User's Case (The Inside View).* Validate the specific evidence. Playtesting is data. Novelty is a multiplier. Explain why the broad base rate might be the wrong reference class.
      *   *Section 3: The Synthesis/Verdict.* Who is more rational?
          *   *Decision:* The friend is methodologically correct but practically imprecise. The user is practically hopeful but methodologically vulnerable.
          *   *Nuance:* The user is likely suffering from "Overconfidence Effect," but the friend is committing "Reference Class Neglect."
          *   *My Stance:* I side with the *method* of the friend, but applied to a *better reference class* defined by the user's evidence. The base rate *must* anchor you, but evidence moves you.
      *   *Section 4: Actionable Epistemology (What evidence matters?).*
          *   Need "Pre-commitment" metrics.
          *   Need "Blind" playtesting (not friends).
          *   Need "Skin in the game" (wishlists, pre-orders).
