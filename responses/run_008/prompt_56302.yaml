      *   **Addressing the Border Cases:** Directly tackle the brain injury, religion, and adaptive preferences examples.
      *   **Comparison with Rivals:** What does LE do that Rawls/Sufficientarianism doesn't? (Focus on the *reason* for redistribution).
      *   **The "Unfalsifiable" Charge:** Has it been qualified to death? (Roemer's "Types" approach).
      *   **Final Call:** Honest assessment of the view's viability.

  6.  **Drafting the Content - Section by Section:**

      *   *Intro:* Set the stage. LE is attractive because it respects agency, but the devil is in the taxonomy.
