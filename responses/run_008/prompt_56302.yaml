      *   *Tier 2 (Normative): The Harshness & Humiliation.* Elizabeth Anderson's critique. LE turns the state into an insurance adjuster investigating your soul. It denies aid to the "reckless," which violates solidarity. *User note:* They found this troubling, so emphasize the *humiliation* aspect, not just the starvation aspect.
