  | **Religious Doctrine** (Predestination, *Beruf*) | **Treatment (T):** Exposure to specific theological information or socialization into a sect. | Distorted | Violates SUTVA (Stable Unit Treatment Value Assumption). The "treatment" isn't the doctrine itself, but the *interpretation* of the doctrine, which varies by agent. |
  | **Inner-Worldly Asceticism** | **Mediator (M):** Behavioral mechanism (frugality, reinvestment, labor discipline) linking T to Y. | Clean | This maps well. It is the channel through which the treatment operates. However, Weber sees this as constitutive of Y, not just a path to it. |
  | **Elective Affinity** (*Wahlverwandtschaft*) | **Interaction Effect / Effect Modification:** The causal effect of economic conditions on behavior depends on the religious context (and vice versa). | Distorted | "Affinity" implies a mutual selection process over time, not just a static interaction term $\beta_3 T \times X$. It suggests co-evolution, not单向 causation. |
  | **Verstehen** (Interpretive Understanding) | **Mechanism Validation / First Stage:** Establishing that agents actually hold the beliefs hypothesized in the causal chain. | Untranslatable | *Verstehen* is epistemological (how we *know* the cause), not ontological. Econometrics assumes the mechanism exists if the math holds; Weber requires the meaning be intelligible to the observer. |
  | **Historical Individual** (The specific configuration of Western Capitalism) | **Local Average Treatment Effect (LATE):** The effect is specific to a particular context (Western Europe, 16th-17th century), not a universal structural parameter. | Clean | Weber is explicit that this is not a universal law. This aligns with external validity concerns in causal inference. |
  | **Materialist Factors** (Trade routes, technology) | **Confounders (U):** Pre-existing economic conditions that could cause both religious change and capitalist development. | Clean | Weber explicitly controls for these via comparative cases (e.g., comparing Catholic vs. Protestant regions with similar economic bases). |
  | **Meaningful Action** (*Sinnhaftes Handeln*) | **Structural Parameter:** The utility function itself is altered by the treatment, not just the constraints. | Untranslatable | Standard models treat preferences as fixed. Weber argues the treatment changes the *utility function* (what is valued), which looks like endogeneity in a standard model. |

