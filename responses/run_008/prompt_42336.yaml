answer: |-
  Verdict
  The book is reliable on the basic history and technical mechanisms but dangerously misleading on the philosophical outcome. You should trust its summary of what Tarski and Kripke *did*, but ignore its claim that they *finished* the job.

  What the book gets right
  The paragraph accurately captures the broad strokes of the technical history. Tarski did prove that a formal language containing its own truth predicate and classical logic leads to contradiction, and he did propose a hierarchy of languages to avoid it. Kripke did subsequently develop a model using truth-value gaps (where sentences can be neither true nor false) to allow a language to contain its own truth predicate without collapsing into inconsistency in the way Tarski feared. As a timeline of major technical milestones, the book is standard.

  Where it misrepresents Tarski
  Philosophers would wince at the implication that Tarski's verdict on natural language is the final word. While Tarski did claim natural languages are "semantically closed" and therefore inconsistent under classical logic, many philosophers argue this shows classical logic is the wrong tool for English, not that English is incoherent. Furthermore, the book presents Tarski's hierarchy as a viable solution for natural language, but most find it linguistically implausible; we don't actually speak in distinct levels where "true" means something different every time we use it. Treating Tarski's diagnosis as a settled fact about English, rather than a constraint on formalizing English, is a significant oversimplification.

  Where it misrepresents Kripke and the current state of things
  The claim that the paradox "dissolves" because Liar sentences are "neither true nor false" is the critical error. This ignores the "Revenge" problem, which is why your lecturer mentioned the issue is still open. If you say the Liar sentence is neither true nor false, consider a new sentence: "This sentence is not true." If the original Liar is neither, then it is indeed "not true." But if the new sentence says it is "not true," and it really is "not true," then the new sentence appears to be true. Yet if it is true, then what it says is the case, so it is "not true." You end up with a contradiction again. Simply adding a third value doesn't stop the paradox; it just pushes it into a new formulation using predicates like "is untrue" or "is false or gappy." Because any logic used to describe the "gaps" can itself be targeted by a new paradox, the problem is not solved but merely displaced.

  Does the conclusion follow
  Absolutely not. The framing of the Liar as a "solved problem of mainly historical interest" is false according to contemporary research. Because every proposed solution (including Kripke's) faces some version of the Revenge problem, there is no consensus on how to resolve the paradox without losing something important, like expressive power or classical logic. Philosophers working on truth are not padding their careers; they are grappling with a fundamental problem that remains technically and philosophically alive.

  A question for your friend
  "If Kripke showed the Liar is neither true nor false, what is the truth value of the sentence 'This sentence is not true'?" If he says it's neither, you can point out that being "neither" makes it "not true," which seems to make the sentence true, restarting the paradox.
