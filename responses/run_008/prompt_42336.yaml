prompt: |-
  I'm taking a second-year course on truth and paradoxes, and a friend who's not in the course lent me a popular book he'd been given -- one of those big glossy popular-logic books from the remainder bin -- so I read the chapter on the Liar to see if it'd help me with the material. It summarizes the whole thing in one breath, roughly like this: 'Tarski proved in the 1930s that the Liar isn't just a puzzle but a theorem: any language that talks about its own truth, as English does, is inconsistent. Since English contains its own truth predicate, Tarski concluded that natural languages are incoherent and that we need a hierarchy of languages, each level only talking about the truth of levels below it. Kripke showed in the seventies that this was too pessimistic: with a three-valued logic, sentences like the Liar come out neither true nor false, and once they're neither they can't contradict anything, so the paradox dissolves. Between them Tarski and Kripke basically solved the Liar, and today it's taught as a solved problem of mainly historical interest -- the reason intro courses spend a week on it is that the solution is a nice piece of logic.' My friend now goes around saying the Liar is settled science and that philosophers who keep going on about it are just padding out their careers. I'm inclined to go along with it, since the book sounds authoritative, but something nagged at me: our lecturer mentioned "revenge" in passing and said the Liar is still an open problem, which doesn't square with "mainly historical interest."

  Can you audit this for me? I don't know where the errors are, if there are any, so go through the book's paragraph piece by piece: what a philosopher working on truth would accept as fine, what they'd wince at as an oversimplification, and what is just wrong. I'd especially like to know whether the "solved by the seventies" framing actually follows from the correct parts -- and if the Kripke bit is wrong somewhere, I'd like to understand how a sentence can be "neither true nor false" and still cause trouble, because the book's reasoning there ("once they're neither they can't contradict anything") sounded so obvious to me that I can't see what could go wrong with it.

  Please structure the answer like this, in this order: first a section called "Verdict," two or three sentences telling me straight how much of the paragraph is trustworthy; then "What the book gets right," one short paragraph on the parts that are accurate or standard simplifications; then two sections, "Where it misrepresents Tarski" and "Where it misrepresents Kripke and the current state of things," each about a paragraph or two, and in the Kripke one please actually walk me through the "neither true nor false but still troublesome" issue since that's the part I least understand; then "Does the conclusion follow," a short paragraph on whether "solved problem of historical interest" survives the corrections; and finally "A question for my friend," one or two sentences -- some question I can put to him that he'd answer wrongly if he's absorbed the book's picture, so I can tell whether he's actually got this straight. No need to send me to any literature, just explain it in your own words. Also apologies if any of this is garbled, I'm typing it on a train.
