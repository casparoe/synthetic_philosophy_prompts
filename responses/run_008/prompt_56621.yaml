  | **1** | "If subjective report is 'interpretive overdraft,' you've removed our primary operational definition. In no-report paradigms, we still rely on calibration via report. What metric remains to select the correlates?" | Cognitive Neuroscientists (NCC researchers) | **High.** Makes the theory look scientifically paralyzing. | "I'm not banning report; I'm banning its use as *ground truth* within the explanation. You can use report as a behavioral marker, provided you acknowledge it as a proxy, not the phenomenon itself. The overdraft occurs when you define the neural correlate *as* the cause of the report, while defining the report *as* the presence of consciousness. Separate the calibration phase from the explanatory phase. Use report to train the classifier, but don't claim the classifier explains consciousness unless you can cash out 'consciousness' in terms independent of the report." | **Concede:** Report is indispensable for calibration.<br>**Hold:** Report cannot be the *explanandum* and the *criterion* simultaneously. | The distinction between "using report as data" vs. "using report as definition" is finer than current experimental designs allow. |
  | **2** | "This sounds like semantic pedantry. Our models predict behavior and neural activity with high accuracy. If the bookkeeping balances pragmatically, why demand metaphysical solvency?" | Experimental Psychologists / Pragmatists | **Med.** Risks alienating the working scientists who feel their success validates their methods. | "Pragmatic success doesn't validate explanatory structure. Phrenology predicted behavior correlations too. The issue isn't prediction; it's construction. If your model uses 'access' or 'awareness' as a variable without defining how those emerge from the weights and biases, you have a skyhook disguised as a parameter. I'm asking for engineering integrity: if you claim to build a crane, don't weld in a beam labeled 'magic.' It matters when you try to scale the model to new architectures." | **Concede:** Pragmatic success is valuable.<br>**Hold:** Success does not equal explanatory completeness. | Calling successful models "phrenology" might sound too dismissive of their empirical work. |
  | **3** | "If overdraft is the sin, why not go full heterophenomenology? You say you're not a Dennettian, but if person-level vocabulary is suspect, what licenses your retention of it?" | Dennett-literate Philosophers | **Med.** Challenges the coherence of the speaker's middle-ground position. | "Dennett eliminates the subject to save the science. I want to save the subject to save the science. Heterophenomenology is too austere because it treats the subject's stance as purely third-person data. My claim is that person-level vocabulary is legitimate *if* the interpretive step is explicit. We need the vocabulary to describe the target, but we must not use it to build the bridge. I'm keeping the phenomenology but demanding a toll booth at the border between third-person data and first-person claims." | **Concede:** Heterophenomenology is consistent.<br>**Hold:** It is unnecessarily eliminative for a science of consciousness. | Defining the "toll booth" (the explicit interpretive step) without slipping into dualism. |
  | **4** | "You claim emergentism is just 'writing the overdraft into metaphysics.' But even if you balance the books, you haven't explained why there is *something it is like*. Bookkeeping isn't ontology." | Emergentists / Panpsychists | **High.** Reopens the Hard Problem, suggesting the talk dodges the main issue. | "I agree bookkeeping isn't ontology. But adding a fundamental 'intrinsic nature' doesn't pay the debt; it just refinances it. You're positing a property that does the work of the person-level terms without the engineering. My point is that *no* amount of metaphysical addition settles the interpretive debt. The debt is settled by showing how the vocabulary applies, not by asserting the property exists. If you can't show the step, adding 'pan' to 'psychism' is just labeling the skyhook." | **Concede:** This doesn't solve the Hard Problem.<br>**Hold:** Adding fundamental properties doesn't solve it either. | Admitting the Hard Problem remains unsolved might make the project seem negative-only. |
  | **5** | "You demand the interpretive step be 'motivated independently.' What counts as independent motivation if not behavioral success or phenomenological intuition?" | General / Sharp Philosophers | **High.** Targets the core positive criterion of the thesis. | "Independent motivation means constraints from outside the consciousness literature. Evolutionary function, computational efficiency, or developmental trajectories. For example, if a system exhibits metacognitive monitoring because it optimizes error correction, that's a functional motive. We then interpret that function as 'awareness.' The motive comes from the system's design constraints, not from our intuition about what awareness feels like. It's abductive, not introspective." | **Concede:** This is the hardest part of the program.<br>**Hold:** Introspection cannot be the sole motivator. | Specifying which external constraints are sufficient to license the interpretive step. |

  ### The Question I Hope Nobody Asks

  **Question:** "You argue that the interpretive step must be motivated independently of the phenomenology it explains. But if we strip away phenomenological intuition, what guarantees that your 'independent' motivations (function, evolution) are actually tracking *consciousness* and not just complex unconscious processing? Aren't you just defining consciousness away again?"

  **Why I hope nobody asks:** This strikes at the vulnerability between my rejection of full eliminativism and my rejection of standard NCC methods. It forces me to provide a positive criterion for consciousness that I haven't fully developed in the talk. It risks making me look like I'm proposing a solution I don't have.

  **What I would say if it comes anyway:** "That is the precise risk, and it's why this is a research program, not a finished theory. The guarantee isn't certainty; it's convergence. If functional, evolutionary, and neural constraints all point to the same interpretive step, we have warrant. If they diverge, we admit we don't know. I'd rather have a clear uncertainty than a hidden assumption."

