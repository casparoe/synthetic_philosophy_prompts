answer: |-
  The concept you are looking for is **Contextual Integrity**, specifically the mechanism within that framework known as **Transmission Principles**.

  This theory, developed by philosopher Helen Nissenbaum, was built to solve exactly the problem you are describing: the intuition that privacy is not about *secrecy* (hiding information) but about *appropriate flow* (how information moves).

  Most people think of privacy as "sensitive data + bad people = violation." Your observation correctly identifies that this model is broken. You are comfortable with sensitive data (pregnancy) reaching "risky" people (a stranger on a train) if the *flow* is right, and uncomfortable with benign data reaching "safe" people (your manager) if the *flow* is wrong.

  Here is the proper breakdown of the concept, how it applies to your specific cases, and why the "route" is the actual privacy violation.

  ### 1. The Core Concept: Contextual Integrity
  In this framework, privacy is maintained when information flows according to the norms of a specific **context** (e.g., healthcare, friendship, employment). A violation occurs not when information is revealed, but when the flow violates the **Transmission Principle** governing that context.

  A flow of information is defined by five parameters:
  1.  **Subject:** Who the info is about (You).
  2.  **Sender:** Who is sharing it (You, your sister, a colleague).
  3.  **Recipient:** Who is receiving it (Doctor, Manager, Stranger).
  4.  **Attribute:** The information itself (Pregnancy status).
  5.  **Transmission Principle:** The constraint under which the info moves (Consent, Confidentiality, Necessity, Rumor).

  **The "Charge" You Feel:**
  The violation you feel in the grapevine and gossip scenarios is a breach of the **Transmission Principle**, even if the Recipient is benign. You are not objecting to *who* knows; you are objecting to the *rules under which they came to know it.*

  ### 2. Applying the Framework to Your Cases

  **The Doctor (Fine)**
  *   **Context:** Healthcare.
  *   **Transmission Principle:** *Necessity & Consent.*
  *   **Analysis:** You authorized the flow for a specific purpose. The norm dictates the doctor *should* know this to treat you. The pathway is direct and sanctioned.

  **The Sister (Fine)**
  *   **Context:** Family.
  *   **Transmission Principle:** *Inference.*
  *   **Analysis:** Crucially, no "Sender" other than you initiated a transfer. She deduced it. In privacy literature, inference is often treated differently than disclosure because you retained **Source Control**. You didn't send it; she intercepted/decoded it. Because she didn't violate a confidence to get it, the Transmission Principle remains intact.

  **The Stranger on the Train (Fine)**
  *   **Context:** Anonymous Public / Confessional.
  *   **Transmission Principle:** *Voluntary Discard.*
  *   **Analysis:** You were the Sender. You chose a Recipient who had no social leverage over you. Because you controlled the Transmission Principle (you chose to speak), you retained **Agency**. The lack of future consequence (you'll never see them) creates a "privacy vacuum" that feels safe.

  **The Manager's Manager (Violation)**
  *   **Context:** Professional Employment.
  *   **Transmission Principle:** *Protocol / Direct Disclosure.*
  *   **Analysis:** This is the **Grapevine Violation**. In a professional context, the norm dictates that personal information affecting work status flows from Employee -> HR/Direct Manager via official channels.
  *   **Why it stings:** Even if the manager is kind, the *pathway* bypassed your agency. It moved via *Rumor*, not *Protocol*. This strips you of the ability to frame the narrative (e.g., "I am pregnant and here is my plan" vs. "Did you hear she's pregnant?"). The harm is the loss of **Narrative Control**, which is a function of the Transmission Principle.

  **The Close Friend (Violation)**
  *   **Context:** Intimate Friendship.
  *   **Transmission Principle:** *Confidentiality.*
  *   **Analysis:** This is the **Gossip Violation**. When you tell a friend a secret, the implicit Transmission Principle is "For your ears only" (or "Ask me before sharing").
  *   **Why it stings:** When they tell another friend, they change the Transmission Principle from *Confidentiality* to *Social Currency*. Even if the new recipient is safe, the *act of transfer* was unauthorized. In privacy literature, this is often called **Secondary Disclosure**. The betrayal isn't that the second friend knows; it's that the first friend assumed **Co-Ownership** of the data without your permission.

  ### 3. The Interpersonal Nuance: Communication Privacy Management (CPM)
  While Contextual Integrity covers the structural norms, there is a complementary theory in communication studies called **Communication Privacy Management (CPM)** that explains the *emotional sting* of the friend scenario specifically.

  CPM posits that when you tell a secret, you create a **Privacy Boundary**. The other person becomes a **Co-Owner** of that information.
  *   **Rule-Based Management:** You and the friend have implicit rules about how that info is handled.
  *   **Boundary Turbulence:** When the friend tells someone else, they cause "turbulence."
  *   **The Violation:** It is a violation of **Boundary Coordination**. You lost your status as the sole "Owner" of the information.

  ### Summary of the Concept
  The word you are looking for is **Transmission Principle** (within the framework of **Contextual Integrity**).

  *   **Definition:** The specific norm or condition that legitimizes the flow of information from a Sender to a Recipient.
  *   **The Insight:** Privacy harm is generated when the Transmission Principle shifts without the Subject's consent (e.g., from *Confidential* to *Gossip*, or from *Direct* to *Grapevine*), regardless of the Recipient's identity or intent.
  *   **Edge Case (Inference):** If information is inferred (Sister) rather than transmitted, the Transmission Principle is not triggered, so no violation occurs.
  *   **Edge Case (Anonymous Stranger):** If the Subject controls the Transmission Principle (Voluntary Discard), the lack of social consequence neutralizes the risk, even if the Recipient is "unsafe."

  You are not experiencing inconsistency; you are experiencing a highly sophisticated detection system for **Normative Flow Violations**. You are protecting your **Informational Self-Determination**—not by hiding the fact, but by governing the trajectory of the fact.
