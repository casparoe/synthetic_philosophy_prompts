      *   *Caution:* Don't say Whitehead is "wrong." Say his framework is *different* (structural vs. existential).
      *   *Tone:* Keep it conversational but intellectually rigorous. Match the user's level of engagement.

  9.  **Final Polish:** Check against specific constraints (Todd scene, peer group, don't flatten). *Self-correction: Make sure to explicitly mention that Welton isn't actually doing "Precision" correctly either, according to Whitehead. It's just drill without purpose.*

  10. (Final Review of the Todd section): Todd is the most complex part. If he can't write, he lacks Precision. Keating makes him improvise. This bypasses Precision. Whitehead would worry this creates a habit of superficial expression. But for Todd, it's about finding a voice *before* craft. I need to articulate that distinction.

