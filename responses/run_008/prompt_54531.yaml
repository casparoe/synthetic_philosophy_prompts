answer: |-
  Here is the systematic translation of the free will debate into control-theoretic vocabulary, followed by the Residue Report.

  ### 1. Van Inwagen's Consequence Argument
  **Philosophical Claim:** If determinism is true, our actions are consequences of the laws of nature and events of the remote past. We have no control over the past or the laws. Therefore, we have no control over our actions.

  **Control-Theoretic Translation:**
  Consider the closed-loop system dynamics:
  $$ \dot{\mathbf{x}} = f(\mathbf{x}, \mathbf{u}, t) $$
  $$ \mathbf{u} = \pi(\mathbf{x}, t) $$
  where $\mathbf{x}$ is the state vector (including the agent's neural/physical state) and $\mathbf{u}$ is the control input (action).
  Van Inwagen's argument asserts that if the system is deterministic, the trajectory $\mathbf{x}(t)$ is uniquely determined by the initial condition $\mathbf{x}(t_0)$ and the dynamics $f$.
  The "Controller" $\pi$ is a subsystem embedded within $\mathbf{x}$. The argument claims that for "control" (in the agential sense) to exist, $\mathbf{u}$ must not be a function solely of $\mathbf{x}(t_0)$ and $f$. Since $\mathbf{u}$ *is* determined by $\mathbf{x}(t_0)$ and $f$, the subsystem $\pi$ has no **actuation authority** independent of the plant's history.

  **Assessment:**
  In control vocabulary, this argument is **stronger** but relies on a category error regarding the definition of "control."
  *   **Strength:** It correctly identifies that in a deterministic closed loop, the control signal is a dependent variable of the initial state. There is no "exogenous reference" entering the system from outside the causal chain.
  *   **Weakness:** It conflates *causal origin* with *regulatory function*. In engineering, a controller "controls" the plant if it minimizes tracking error $\mathbf{e} = \mathbf{r} - \mathbf{y}$ and rejects disturbances $\mathbf{d}$, regardless of whether the controller's gains were determined by $\mathbf{x}(t_0)$. Van Inwagen requires the controller to be *outside* the state-space model to count as "free." Control theory says a controller inside the loop still performs regulation. The argument reduces to: "If the reference signal $\mathbf{r}$ is internal to the state vector, it doesn't count as a command."

  ### 2. Alternative Possibilities (AP)
  **Philosophical Claim:** Incompatibilists argue that if determinism holds, you could not have done otherwise. Compatibilists argue you could have, *if* you had chosen otherwise.

  **Control-Theoretic Translation:**
  This is a dispute over the definition of the **Reachable Set** $\mathcal{R}(\mathbf{x}_0, T)$.
  *   **Incompatibilist:** Holds $\mathbf{x}_0$ (the complete past) and $f$ (laws) fixed. Under deterministic dynamics, the reachable set at time $T$ is a singleton: $\mathcal{R} = \{ \mathbf{x}(T) \}$. The counterfactual "could have done otherwise" implies $\exists \mathbf{u}' \neq \mathbf{u}$ such that $\mathbf{x}'(T) \neq \mathbf{x}(T)$. This is false given fixed $\mathbf{x}_0$.
  *   **Compatibilist:** Relaxes the constraint on $\mathbf{x}_0$. They perform a sensitivity analysis on the controller's internal state (desires/beliefs). They ask: "Is the mapping $\pi$ sensitive to variations in internal reference signals?" If the controller architecture allows $\mathbf{u}$ to vary given different internal states $\mathbf{x}_{internal}$, then the system has **control authority** relative to those internal states.

  **Assessment:**
  The disagreement is **verbal**, specifically about which variables constitute the "fixed background" for counterfactual analysis.
  *   Incompatibilists treat the *entire state vector* as fixed history.
  *   Compatibilists treat the *controller's internal setpoints* as variable inputs for the sake of the counterfactual.
  In control terms, the Compatibilist is describing **local controllability** with respect to internal reference signals, while the Incompatibilist is describing **global open-loop trajectory uniqueness**. They are calculating reachability on different manifolds.

  ### 3. Frankfurt-Style Hierarchical Compatibilism
  **Philosophical Claim:** An agent is free if their first-order desires (to do X) align with their second-order volitions (to want to do X).

  **Control-Theoretic Translation:**
  This is a **Cascaded Control Architecture**.
  *   **Inner Loop:** Fast dynamics, actuation, first-order desires. State $\mathbf{x}_1$, Input $\mathbf{u}$.
  *   **Outer Loop:** Slower dynamics, planning, second-order volitions. State $\mathbf{x}_2$, Output $\mathbf{r}_1$ (setpoint for inner loop).
  *   **Identification:** Stability of the error dynamics between the outer loop's reference $\mathbf{r}_{outer}$ and the inner loop's actual setpoint $\mathbf{r}_{inner}$.
  *   **Freedom:** The closed-loop system is Lyapunov stable, and the inner loop successfully tracks the outer loop's setpoint without saturation or high-frequency oscillation.

  **Assessment:**
  Control theory captures the structure perfectly but misses the **normative weight**.
  *   **Suppression vs. Governance:** You asked about the distinction. In control terms, **Suppression** is high-gain feedback where the outer loop forces the inner loop state to zero (inhibition), potentially destabilizing inner dynamics or causing integrator windup. **Governance** is model-matching, where the outer loop generates feasible setpoints $\mathbf{r}_1$ that lie within the inner loop's bandwidth and constraints.
  *   **What Philosophers Add:** They care about the *provenance* of the outer loop's setpoints. Control theory treats the outer loop's reference as exogenous or state-dependent. Philosophy asks: "Who set the outer loop's gains?" If the outer loop was tuned by addiction (disturbance) vs. reason (nominal model), control theory sees the same trajectory; philosophy sees different moral status.

  ### 4. Pereboom's Manipulation Argument
  **Philosophical Claim:** If neuroscientists program you to kill (deterministic manipulation), you aren't responsible. If ordinary causation programs you to kill (deterministic nature), you aren't responsible. There is no relevant difference.

  **Control-Theoretic Translation:**
  This compares two methods of **System Identification and Gain Tuning**:
  1.  **Designer Tuning:** Gains $K$ and internal model $\hat{P}$ are written by an external agent (neuroscientists).
  2.  **Adaptive Tuning:** Gains $K$ and internal model $\hat{P}$ are acquired via reinforcement learning or system ID over time $t$ interacting with environment $E$.

  **Assessment:**
  Control vocabulary marks **no difference** in the resulting system behavior or authority.
  *   Once the parameters are set, the state-space equations are identical: $\dot{\mathbf{x}} = (A - BK)\mathbf{x}$.
  *   The trajectory $\mathbf{x}(t)$ is indistinguishable.
  *   **Defect or Finding?** This is a finding about the argument. The philosophical intuition relies on a "history variable" that does not appear in the state vector. If the current state $\mathbf{x}(t)$ and dynamics $f$ are identical, control theory asserts the system's properties (stability, performance) are identical. Pereboom is correct from a state-space perspective: the *origin* of the parameters is orthogonal to the *function* of the controller.

  ### 5. Reactive Attitudes (Strawson)
  **Philosophical Claim:** Resentment and gratitude are responses to the quality of will of other agents. Withholding these attitudes (taking the "objective stance") treats them as broken or determined objects.

  **Control-Theoretic Translation:**
  This describes **Multi-Agent Coupled Dynamics with Model Updating**.
  *   **Agent A** maintains an internal model of **Agent B**.
  *   **Resentment:** A detects a deviation in B's behavior that implies a malicious cost function $J_B$. A updates their model of B to include a bias term or adversarial intent. A's control policy $u_A$ shifts to minimize $J_A$ subject to $u_B$ being adversarial (Game Theoretic / Robust Control).
  *   **Objective Stance:** A classifies B as a **Disturbance** $\mathbf{d}$ or a **Faulty Plant** rather than a Controller. A switches from a cooperative tracking protocol to a disturbance rejection protocol ($H_\infty$ control).
  *   **Function:** These attitudes are not metaphysical verdicts; they are **switching conditions** for A's control architecture. They optimize A's performance by correctly classifying whether B is a co-controller or a noise source.

  ***

  # Residue Report

  This is the deliverable you requested. It analyzes the fidelity of the translation and isolates the concepts that do not map.

  ### 1. Translation Fidelity

  | Concept | Translation Fidelity | Notes |
  | :--- | :--- | :--- |
  | **Hierarchical Will** | **High** | Cascaded loops map cleanly to Frankfurt's orders of desire. Bandwidth separation explains the "depth" of reflection. |
  | **Alternative Possibilities** | **Medium** | Maps to Reachability, but requires agreement on which initial conditions are held fixed. |
  | **Manipulation** | **High** | Parameter tuning (external vs. adaptive) captures the structural equivalence Pereboom argues for. |
  | **Reactive Attitudes** | **High** | Maps to coupled agent modeling and switching between cooperative vs. robust control modes. |
  | **Control / Agency** | **Low** | **Critical Distortion.** Engineering "control" = Error Minimization. Philosophical "control" = Causal Origination. |
  | **Ultimate Sourcehood** | **None** | No expression in state-space formalism. |

  ### 2. The "Ultimate Sourcehood" Residue
  You asked if "ultimate sourcehood" is just a disagreement about where we draw the boundary between controller and plant.

  **Verdict: Yes.**
  In control theory, the boundary between "Controller" and "Plant" is a **modeling choice**, not a metaphysical fact. We draw the line around the actuator.
  *   **Compatibilism** draws the boundary around the agent's skin. Everything inside is "me" (the controller). If the internal loops are stable and tracking, I am in control.
  *   **Incompatibilism** draws the boundary around the *universe*. Since the agent is inside the universal state vector $\mathbf{x}_{uni}$, the agent is part of the Plant. There is no external Controller.

  Incompatibilism is the claim that **any boundary drawn internal to a closed causal chain is arbitrary.** They demand a Controller that is exogenous to the state-space model of the universe. Control theory tells you this is impossible for a closed system. Therefore, "Ultimate Sourcehood" is a request for an **exogenous reference signal** in a system defined as closed. It is a request for a "God input" $u_{ext}$ that does not exist in the model.

  ### 3. "Ought-Implies-Can" Residue
  You asked if this maps to stability or feasibility.

  **Verdict: It maps to Feasibility in Optimization (MPC).**
  In Model Predictive Control, the solver minimizes a cost function $J$ subject to constraints $\mathbf{x} \in \mathcal{X}, \mathbf{u} \in \mathcal{U}$.
  *   **"Can":** The existence of a feasible trajectory within the constraint set over the prediction horizon.
  *   **"Ought":** The optimal trajectory $\mathbf{u}^*$ derived from the cost function.
  *   **Implication:** If the constraint set is empty (uncontrollable region), the optimization problem is **infeasible**. There is no solution. You cannot generate an "ought" (optimal command) if the "can" (feasible set) is empty.

  However, moral "ought" often implies a **normative constraint** that physical "can" does not capture. Control theory can tell you if a state is reachable; it cannot tell you if the state is *valuable*. The "Ought" in philosophy contains a cost function $J$ that control theory assumes is given. If the debate is about the *source* of $J$ (see Manipulation Argument), control theory has no purchase.

  ### 4. Final Verdict: Missing Concepts or Ill-Posed Questions?

  Here is the honest assessment you asked for:

  **The philosophical debate is largely ill-posed relative to the physical description of the system.**

  1.  **Bookkeeping Boundaries:** The Incompatibilist/Compatibilist dispute reduces to a bookkeeping choice about loop boundaries. The Incompatibilist refuses to acknowledge the "Controller" subsystem as distinct from the "Plant" subsystem because they share the same causal substrate. The Compatibilist acknowledges the subsystem distinction because it is functionally relevant for prediction and regulation. **Neither is physically wrong; they are optimizing for different objectives.** The Incompatibilist optimizes for *Causal Purity*; the Compatibilist optimizes for *Functional Prediction*.
  2.  **The "Magic" Input:** The intuition behind "Libertarian Free Will" corresponds to a control system that can generate inputs $\mathbf{u}$ that are **uncorrelated with the state history** $\mathbf{x}(t_0 \dots t)$. In information-theoretic control terms, this requires a source of entropy internal to the controller that is not derived from the plant's past. While stochastic control allows for noise, "Free Will" requires the noise to be *authored*, not just random. Control theory has no concept for "authored noise." It is either deterministic or stochastic. The philosophical desire for a third category (Agent-Causal) is a request for a mathematical object that violates the Markov property without being random.
  3.  **Utility of the Vocabulary:** Your control vocabulary is **superior for prediction and intervention**. It tells you *how* an agent works, *where* they will fail (saturation, instability), and *how* to couple with them (reactive attitudes). The philosophical vocabulary attempts to assign a **scalar value of "Responsibility"** to the system. This value does not appear in the state equations.

  **Conclusion:**
  The debate does not reveal a missing concept in control theory. It reveals that the philosophers are trying to solve a **normative assignment problem** (who gets the credit/blame?) using **causal description tools** (determinism vs. indeterminism).
  In control theory, we assign credit/blame based on **architecture** (who designed the gains?) and **performance** (did it track?). We do not ask if the controller "could have done otherwise" given fixed initial conditions, because that question is equivalent to asking "Is the simulation reproducible?"
  If the simulation is reproducible (deterministic), the Incompatibilist says "No Freedom." The Control Engineer says "Good, the system is verified."

  The residue is not a metaphysical mystery; it is the difference between **analyzing the system** (Control) and **assigning liability for the system's output** (Philosophy/Law). Your vocabulary solves the former. The latter is a social coordination protocol (see Reactive Attitudes) that pretends to be metaphysics.
