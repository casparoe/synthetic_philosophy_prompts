      *   **Constraint:** Everyone agrees on *discrimination* as a principle (no one thinks killing civilians is fine *as such*). Objections will come from *inside* the framework.
      *   **Deliverables:**
          *   Q&A Prep Sheet.
          *   ~8 Objections (ordered by damage potential).
