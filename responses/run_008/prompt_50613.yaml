      *(Self-Correction on Objection 8 - The "Clean Hands" objection):* Is moral purity worth the cost?

      *Let's refine the "Hope nobody asks" section.* The hint is about Britain. Anscombe opposed the war against Hitler initially (or rather, the *way* it was fought/conscription). Actually, she famously opposed Oxford giving the degree, but she also signed a pamphlet against the war *before* it started? No, she was a pacifist in the 30s but supported the war against Hitler *except* for area bombing. Wait, checking facts: Anscombe was not a pacifist during WWII, but she opposed conscription and the "unjust peace" terms. She did think Britain's cause was just, but the *means* were often not. However, she did sign a petition in 1939 urging a negotiated peace? No, that's Bertrand Russell. Anscombe's consistency is usually attacked on her view of *contraception* vs *war*, but here it's war specific.
