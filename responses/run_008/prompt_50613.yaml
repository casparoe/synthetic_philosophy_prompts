      *Actually, the specific "trap" is usually this:* Anscombe argued Truman was a murderer. But she also argued that *British* area bombing (which she participated in the protest against in 1939/1940 context?) was murder. If she admits British bombing was murder, does that mean Britain fought unjustly? If she says Britain fought justly despite the bombing, is she inconsistent regarding Truman?
      *Better Trap:* "Anscombe conceded that Nazi victory would have been catastrophic. If the stakes were that high for Britain, why weren't they that high for the US in the Pacific? Why does the 'Supreme Emergency' apply to London but not Tokyo?"
      *Okay, I will stick to the Hint:* Her views on Britain's war aims/conscription.
      *Is there a worse one?* Maybe: "If killing innocents is always murder, does that delegitimize the entire Allied victory?" That's the nuclear option. I'll assess that in the final section.

  6.  **Writing the Replies:**
