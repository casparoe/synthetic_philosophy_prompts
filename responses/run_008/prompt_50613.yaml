  8.  **Final Polish:** Ensure the distinction between "innocent" (non-combatant) and "morally innocent" is clear, as the prompt specified Anscombe's usage. Ensure the Double Effect reply is technically accurate (intention vs foresight).

  *(Self-Correction during drafting)*: Make sure the "Double Effect" objection isn't just "you got the doctrine wrong." It needs to be "You are defining intention too narrowly to be plausible."
