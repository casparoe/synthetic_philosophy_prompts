answer: |-
  # Q&A Prep Sheet: Defending Anscombe on Truman
  **Workshop:** Ethics and War
  **Position:** Anscombe's Absolutism (Hiroshima/Nagasaki = Murder)
  **Audience:** Walzerians, DDE Experts, Utilitarians, Historians

  ## Pre-Emptive Concessions
  *Do not wait to be cornered on these. Weave them into your opening or early responses to build credibility.*

  1.  **Concede the "Clean Hands" Problem:** Acknowledge that Anscombe's position leaves the agent with "dirty hands" in the sense that following her rule might lead to worse overall outcomes (e.g., a prolonged war). Her point is precisely that morality is not about optimizing outcomes.
  2.  **Concede the Historical Fog:** Admit you are not a historian. You are analyzing the *moral justification offered at the time* and the *structure of the act*, not debating the exact casualty figures of Operation Downfall. If the justification relied on "military necessity," the moral evaluation holds regardless of whether the necessity was empirically accurate, provided the *intent* was to kill innocents.
  3.  **Concede Anscombe's Difficulty:** Acknowledge that Anscombe's view is "hard." It is meant to be. If it were easy, we wouldn't need the prohibition.

  ---

  ## The 8 Objections (Ordered by Damage)

  ### 1. The Utilitarian Hammer (The Invasion Alternative)
  **Who:** The straight utilitarians.
  **The Question:** "Anscombe treats the prohibition on killing innocents as absolute. But if the alternative was Operation Downfall, which conservative estimates suggest would have killed a million Allied soldiers and several million Japanese civilians, isn't refusing the bomb morally irresponsible? Does your defense of Anscombe imply we should have chosen the body count that was five times higher?"

  **The Reply (2 mins):**
  "The utilitarian calculation assumes we can know the future with precision, which we couldn't in 1945. But more importantly, you are begging the question against Anscombe's core thesis. She argues that certain actions are *intrinsic evils*—they are forbidden regardless of the consequences. If killing the innocent as a means is murder, then doing it to save lives is still murder, just as killing one healthy patient to harvest organs for five sick ones is murder, even if the arithmetic works.
  Anscombe's point isn't that consequences don't matter; it's that they don't *justify* the unjustifiable. If the only way to win a war is to commit murder, then the war cannot be won justly. To say 'necessity' overrides the prohibition is to say there is no prohibition at all, only a price list. I concede this leads to hard outcomes. But if morality is to mean anything, it must bind us precisely when it is costly."

  **Soft Spot:** This sounds rigid to the point of irresponsibility. You have no answer for the "harvesting organs" counter-counter-argument other than restating the axiom. It relies entirely on the audience accepting deontology over consequentialism, which half the room doesn't.

  ### 2. The Double Effect Technicality (Intentionality)
  **Who:** The DDE expert (20 years pub history).
  **The Question:** "Anscombe claims the death of civilians was the *means*, not a side effect. But the stated aim was ending the war by destroying morale and industrial capacity. Civilian death was foreseen, certainly, but was it strictly intended? If I bomb a munitions factory knowing workers will die, is that murder? If not, why is Hiroshima different? Aren't you collapsing the distinction between foresight and intention to make the doctrine work?"

  **The Reply (2 mins):**
  "This is the crux. Anscombe argues that when the destruction of civilian life is the *mechanism* by which the objective is achieved, it is intended. In Hiroshima, the target *was* the city. The shock value relied on the indiscriminate nature of the death. If you bomb a factory, the death is incidental to destroying the machine. If you bomb a city to break a will, the death is the tool.
  Anscombe would say that if your plan requires the civilians to be dead (or terrified by the prospect of death) to succeed, you have willed their death. Collapsing the distinction? No. I'm arguing that 'breaking morale through mass death' makes the death a means. If the civilians had survived but the buildings were destroyed, the objective fails. Therefore, their death was the means."

  **Soft Spot:** This is the most philosophically vulnerable point. Modern DDE scholars (like Quinn or Kamm) have nuanced accounts of "direct harm" that might let Truman off the hook. You are relying on a specific, thick description of "intention" that the expert will try to thin out.

  ### 3. The Walzerian "Supreme Emergency"
  **Who:** The Walzerians.
  **The Question:** "Walzer argues that in 'supreme emergencies,' where the threat is existential and imminent, leaders may override the rules of war. Given Japanese militarism, the atrocities in China, and the refusal to surrender, wasn't the Pacific theater a supreme emergency? Doesn't Anscombe's absolutism leave us powerless against an enemy that recognizes no limits?"

  **The Reply (2 mins):**
  "Anscombe would reject the 'supreme emergency' exemption because it turns rights into utilitarian calculations. If the prohibition on killing innocents can be suspended when things get bad enough, then the innocent have no rights, only privileges that last until the situation gets dire.
  Furthermore, was it a supreme emergency in August 1945? Japan's navy was destroyed, their cities were burning from conventional raids. The 'existential threat' to the US was nonexistent; the threat to the Japanese populace was the one being maximized. Even if we grant a supreme emergency, Anscombe argues you cannot do *evil* that good may come. If the act is intrinsically murderous, the emergency doesn't cleanse it. It just makes the tragedy deeper."

  **Soft Spot:** Walzer is very popular in this room. Dismissing "supreme emergency" sounds like you haven't grappled with the reality of totalitarian threats. You risk looking naive about the stakes of WWII.

  ### 4. The Historical Counterfactual (The Soviet Factor)
  **Who:** The Historian.
  **The Question:** "Recent historiography suggests Japan was already seeking terms via Moscow, and the Soviet entry on August 8th was the real catalyst for surrender. If the bomb wasn't militarily necessary to end the war, doesn't that make Truman's act not just murder, but *gratuitous* murder? But if you defend Anscombe, are you defending a view that relies on disputed history? If the bomb *was* necessary to prevent Soviet expansion, does that change the moral calculus?"

  **The Reply (2 mins):**
  "I want to bracket the historical debate because Anscombe's argument holds even if the bomb *was* militarily necessary. Her point is about the *kind* of act, not the efficiency of it. Even if the bomb was the only way to stop the Soviets, if that way involved the intentional killing of innocents as a means, it remains forbidden on her view.
  However, you're right that if it wasn't necessary, it compounds the guilt. But I'm defending the principle: that the *type* of action (targeting civilians to force surrender) is the moral boundary. Whether it was redundant or essential, the moral structure of the act remains the same. We shouldn't let historical 'what-ifs' obscure the moral 'what-is'."

  **Soft Spot:** You are sidestepping the historical necessity claim. If the audience believes the bomb saved more lives than it took, your refusal to engage the arithmetic looks like dogmatism.

  ### 5. The "Total War" Complicity Objection
  **Who:** A Walzerian/Hybrid.
  **The Question:** "Anscombe defines 'innocent' as 'not fighting.' But in a total war economy, civilians produce the munitions, grow the food, and sustain the morale that keeps the army fighting. At what point does material support erode immunity? If the distinction between soldier and civilian is blurred by the enemy, does the obligation to discriminate remain absolute?"

  **The Reply (2 mins):**
  "Anscombe is explicit: 'Innocent' means 'not engaged in hostilities.' It is a functional category, not a moral one. A munitions worker is not a combatant. If we erode that distinction, we license the killing of anyone who pays taxes or grows food. That leads to total war, which is exactly what the principle of discrimination is meant to prevent.
  The Japanese state blurred the lines; the US military chose to exploit that blur rather than challenge it. Anscombe's point is that we must hold the line on the definition of 'combatant' precisely when the enemy refuses to. To do otherwise is to let the enemy set the moral rules of the war."

  **Soft Spot:** This is hard to maintain in the context of industrial warfare. The audience may feel this definition is too legalistic for the reality of 1945 Japan.

  ### 6. The "Lesser Evil" regarding Asia
  **Who:** A Walzerian/Historian.
  **The Question:** "Japan was actively massacring civilians in China and Indonesia. Every day the war continued, more Asians died. By prolonging the war (via refusing the bomb), aren't you complicit in the continued Japanese atrocities? Does Anscombe's view account for the victims of Japanese imperialism, or only the victims of American bombing?"

  **The Reply (2 mins):**
  "This is the 'dirty hands' problem again. Anscombe would say we are responsible for our own actions, not the actions of our enemies. We cannot commit murder to stop a murderer. If the only way to stop the Japanese massacres was to massacre Japanese civilians, then the situation is tragic, but the moral prohibition stands.
  It sounds cold to the victims in China, I know. But the alternative is to say that the ends justify the means. If we accept that, we lose the ability to condemn the Japanese atrocities on moral grounds, only on practical ones. We must maintain that some things are not to be done, even to stop evil."

  **Soft Spot:** This is emotionally very difficult to sell. It risks making you appear indifferent to Asian suffering compared to Japanese suffering.

  ### 7. The "Political Responsibility" Objection
  **Who:** A moderate in the room.
  **The Question:** "Truman was a statesman responsible for millions of lives, not a moral philosopher in an Oxford common room. Doesn't Anscombe's protest ignore the specific burden of political office? Is it fair to judge a leader's emergency decisions by the standards of private morality?"

  **The Reply (2 mins):**
  "Anscombe's pamphlet is precisely about rejecting that dichotomy. She argues that political leaders are not exempt from the moral law. In fact, because they wield power, their adherence to it is more critical. To say 'statesmanship' requires murder is to say politics is an amoral sphere.
  The protest wasn't about ignoring his burden; it was about refusing to honor him for shouldering it in that way. We can acknowledge his difficulty without praising the act. The degree was an honor, and Anscombe argued you do not honor murder."

  **Soft Spot:** It doesn't fully answer the "burden" charge. It feels like you are holding the politician to a standard that makes governance impossible.

  ### 8. The "Shared Guilt" Reductio
  **Who:** A skeptic.
  **The Question:** "Anscombe argues praising a bad action makes you share in the guilt. By that logic, doesn't paying taxes make us complicit in all state violence? Isn't this standard of complicity so high it renders the concept of guilt meaningless? Where does the chain of responsibility stop?"

  **The Reply (2 mins):**
  "Anscombe distinguishes between formal cooperation and material cooperation. Paying taxes is general material support; protesting an honorary degree is a specific public endorsement. One is passive participation in a system; the other is an active affirmation of a specific act.
  She isn't saying everyone is equally guilty. She's saying that *honor* implies *approval*. If you give a degree to someone for an act you believe is murder, you are publicly stating that act was worthy of reward. That is a specific moral act of endorsement, distinct from general citizenship."

  **Soft Spot:** The line between "material cooperation" and "formal cooperation" is notoriously fuzzy. A clever interlocutor can blur this quickly.

  ---

  ## The Question You Hope Nobody Asks

  **The Question:** "Anscombe argued Truman was a murderer for killing Japanese civilians. But she also opposed British conscription and criticized the Allied bombing of Germany. Did she believe Britain fought an unjust war? If she admits Britain's cause was just despite the bombing, isn't she inconsistent? And if she admits it was unjust, isn't she delegitimizing the victory over Nazism?"

  **Why this is the worst one:**
  This attacks Anscombe's coherence and political standing simultaneously. It forces you to either admit she was a crank who opposed the fight against Hitler (alienating the room) or admit she held a double standard (destroying her philosophical credibility).

  **Is there a worse one?**
  Yes. **"If the prohibition is absolute, does it apply to terrorism today?"**
  If you say "Yes," you equate Truman with Al-Qaeda (which might be her view, but will torpedo your talk). If you say "No," you admit the principle isn't absolute.
  *However,* the Britain/Consistency question is more damaging *historically* because it suggests Anscombe's protest was less about principle and more about anti-Americanism or Catholic sectarianism.

  **How to handle the "Britain" Question if asked:**
  *Do not dodge.*
  "Anscombe believed the *cause* against Hitler was just, but the *means* of area bombing were not. She distinguished between the justice of the war (*jus ad bellum*) and the justice of the conduct (*jus in bello*). She argued Britain fought a just war *unjustly*. This is consistent: one can fight for a righteous cause using forbidden weapons. Her protest against Truman was about the weapon and the intent, not the necessity of defeating Japan. She would say we could have defeated Japan without murdering civilians, just as we could have defeated Germany without area bombing. The consistency lies in the prohibition on the means, not the judgment of the enemy."
  *(Soft spot: This admits the Allied victory was morally tainted, which some in the room may find unacceptable.)*
