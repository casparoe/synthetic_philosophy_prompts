      8.  *The "Shared Guilt" Extension:* If praising is guilt, what about funding the university? (Reductio ad absurdum of her pamphlet's specific claim).

      *Refining the Order:* The "Consistency Trap" is actually the most embarrassing personally for the speaker defending *Anscombe*, but the "Utilitarian/Invasion" argument is the most damaging to the *conclusion* (that Truman was wrong). The prompt asks for damage to the *talk/defense*. The Consistency Trap undermines the *messenger* (Anscombe), which might actually be more damaging in a workshop setting where her authority matters. Let's put the Invasion Argument first (substantive) and the Consistency Argument as the "Hope nobody asks" or near the top. Actually, the prompt asks for the "Question I'm hoping nobody asks" separately. So I will keep that separate.
      *Revised Order:*
      1. Utilitarian (Invasion Arithmetic).
