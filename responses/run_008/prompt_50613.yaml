      3.  *The Walzerian "Supreme Emergency":* Existential threat overrides rules. (High damage because it offers a competing framework everyone knows).
      4.  *The Historical Counterfactual:* Japan was already surrendering (Soviet Factor). (Damages the *necessity* claim).
      5.  *The "Responsibility" Push:* Total War Economy. (Attacks the "innocent" definition subtly).
      6.  *The Consistency Trap (The Hint):* Anscombe on Britain/Hitler. (Damages her authority/coherence).
