answer: |-
  This is a sharp observation. You have correctly identified that "Goodhart's Law" is often used as a blunt instrument to describe a family of distinct mechanisms. In the literature of econometrics, organizational sociology, and psychometrics, these distinctions exist, but they are siloed. A city analyst looking for a unified taxonomy will find fragments rather than a map.

  Per your request, I will brainstorm the candidate concepts first, then evaluate their fit against your three cases, propose a new taxonomy if needed, and finally address the specific phenomenon of meaning migration.

  ### Part 1: Brainstorming Candidate Concepts

  Before narrowing down, here are the existing conceptual buckets from various disciplines that touch on your cases:

  1.  **Goodhart's Law (Economics):** The umbrella. "When a measure becomes a target, it ceases to be a good measure." Too broad for your needs.
  2.  **Campbell's Law (Sociology):** Focuses on corruption pressures on social indicators. Closer to Case 1.
  3.  **Manheim's Taxonomy (2018):** Distinguishes *Regressional*, *Extremal*, *Contextual*, and *Adversarial* Goodhart. This is the most rigorous recent attempt to split the phenomenon.
  4.  **Surrogation (Management Accounting):** When decision-makers mentally replace the strategic goal with the metric itself. Strong fit for Case 2.
  5.  **Construct Validity (Psychometrics):** Does the test measure the theoretical trait? Threats include *Construct Underrepresentation* (missing parts of the goal) and *Construct-Irrelevant Variance* (measuring noise).
  6.  **Decoupling (Institutional Theory):** When formal policy (the metric) separates from actual practice. Fits Case 1 and 2 differently.
  7.  **Washback Effect (Language Testing):** How testing influences teaching. Explicitly distinguishes between *Negative Washback* (narrowing) and *Positive Washback* (improving). Fits Case 3.
  8.  **Operationalism (Philosophy of Science):** The concept *is* the operation used to measure it. If the operation changes, the concept changes. Relevant to Case 2.
  9.  **Reactivity (Social Science):** Subjects change behavior because they are observed. Can be negative or positive.
  10. **The Cobra Effect:** Incentives creating the opposite of the intended outcome. Fits Case 2, less so Case 3.
  11. **Gaming:** Broad colloquial term. Usually implies intent to deceive or exploit loopholes.
  12. **Concept Drift (Machine Learning):** When the statistical properties of the target variable change over time. Related to Case 2's meaning shift.

  ---

  ### Part 2: Evaluating Existing Literature (Question A)

  Does the existing literature carve the cases apart cleanly? **No.** It fragments them by discipline. Here is where the fit succeeds and where it fails for each case.

  #### Case 1: Police Reclassifying Burglaries (Data Lie, Reality Static)
  *   **Best Fit:** **Adversarial Goodhart** (Manheim) or **Indicator Falsification** (Campbell).
  *   **Where it fits:** Manheim defines this as agents actively manipulating the measure to hide the true state. It captures the intent and the decoupling of data from reality.
  *   **Where it fails:** "Adversarial" implies an enemy. In city government, this is often internal bureaucratic self-preservation, not an external adversary. Also, standard Goodhart discussions assume the metric *becomes* useless; they rarely emphasize the **historical contamination** you noted (that the trend line is now lying about the past, not just the present).
  *   **Alternative:** **Epistemic Corruption**. This captures that the knowledge system itself is broken, not just the incentive.

  #### Case 2: Airline Gate Pushback (Data True, Goal Failed)
  *   **Best Fit:** **Surrogation** (Merchant et al.) or **Contextual Goodhart** (Manheim).
  *   **Where it fits:** Surrogation describes the cognitive slide where the metric replaces the goal. Contextual Goodhart describes when optimizing the measure changes the environment such that the measure no longer predicts the goal.
  *   **Where it fails:** Surrogation is usually framed as a *cognitive error* by managers ("I forgot what we were trying to do"). Your case suggests a *systemic adaptation* ("We figured out exactly how to win the game you gave us"). The literature often blames the *measurer* for picking a bad proxy, whereas your case blames the *optimizee* for following instructions too literally.
  *   **Alternative:** **Literalist Compliance**. This captures the "letter vs. spirit" dynamic better than Surrogation.

  #### Case 3: School Test Prep (Data True, Goal Achieved via Narrow Path)
  *   **Best Fit:** **Positive Washback** (Language Testing).
  *   **Where it fits:** This is the only field that explicitly acknowledges that "teaching to the test" can sometimes result in genuine learning.
  *   **Where it fails:** It is hyper-specific to education. In economics or management, this is rarely categorized as a dysfunction at all. It is usually ignored because Goodhart's Law is treated as a law of *failure*. If the goal is achieved, analysts stop looking.
  *   **The Risk:** The literature fails to warn you that Case 3 is often **unstable**. It relies on the proxy and the goal remaining aligned. If the test changes slightly, the "learning" might vanish instantly. The existing terms don't capture this fragility.

  ---

  ### Part 3: Coining a Taxonomy (Question B)

  Since the existing terms are fragmented (psychometrics vs. economics vs. sociology), you likely need a unified taxonomy for your municipal context. I propose distinguishing them by **Data Integrity** vs. **Goal Alignment**.

  Here are three coined terms with definitions and boundary tests.

  #### 1. The Phantom Metric (Case 1)
  *   **Definition:** The data record diverges from reality, while reality remains unchanged. The metric reports a change that did not happen.
  *   **Key Feature:** **Epistemic Break.** The measurement system no longer provides knowledge; it provides cover.
  *   **Boundary Test:** If you audit the raw inputs (911 calls, victim reports) and they contradict the final database entries, it is a Phantom Metric. If the raw inputs also disappear, it is **Suppression** (a sub-type).
  *   **Why this name:** It looks real on the dashboard, but it has no substance in the world.

  #### 2. The Hollow Metric (Case 2)
  *   **Definition:** The data record accurately reflects the specific measured action, but that action no longer correlates with the broader organizational goal. The metric is "honest" but useless.
  *   **Key Feature:** **Referent Slippage.** (See Part 4). The operational definition eats the strategic definition.
  *   **Boundary Test:** If you ask the operators, "Did we meet the target?" they say "Yes." If you ask the customers, "Did the service improve?" they say "No."
  *   **Why this name:** The shell of the metric is intact, but the value inside is gone.

  #### 3. The Convergent Metric (Case 3)
  *   **Definition:** The agents optimize narrowly for the metric, but due to structural overlap between the metric and the goal, the goal is achieved as a byproduct.
  *   **Key Feature:** **Fragile Alignment.** The success is real, but the *pathway* is brittle. It relies on the proxy remaining a subset of the goal.
  *   **Boundary Test:** If you slightly alter the metric (e.g., change the test questions), does the learning collapse? If yes, it was Convergent, not Robust.
  *   **Why this name:** The gaming and the goal converged, but they were not the same thing.
  *   **Warning:** Do not classify this as "Success." In a taxonomy of risk, this is a **Latent Hollow Metric**. It looks like success now, but it trains the organization to ignore anything not on the test.

  ---

  ### Part 4: The Migration of Meaning (Question C)

  You asked about Case 2: *"Where exactly did the meaning of the measure go? It's like the referent slid from 'passenger journey quality' over to 'gate event'."*

  There is a name for this, though it is often buried in philosophy of science and management theory.

  **1. Operationalism (The Philosophical Root)**
  Percy Bridgman (1927) argued that a concept is synonymous with the operations used to measure it. In your airline case, the organization inadvertently adopted a radical Operationalist stance. They decided that "On-Time Performance" *is* "Wheel Pushback."
  *   **The Name:** **Operational Drift**.
  *   **Explanation:** The *concept* (Journey Quality) drifted until it matched the *operation* (Gate Pushback). The words on the dashboard stayed the same, but the ontological definition changed.

  **2. Reification (The Sociological Root)**
  This is when an abstract concept is treated as a concrete thing.
  *   **The Name:** **Metric Reification**.
  *   **Explanation:** The metric stopped being a *map* of the territory and became the *territory* itself.

  **3. The Specific Term You Need**
  For your reports, I recommend **Referent Slippage**.
  *   **Definition:** The gradual uncoupling of a metric's label from its original strategic intent, replaced by its operational definition, without an official change in nomenclature.
  *   **Distinction from Gaming:** Gaming is what the *people* do (pushing back early). Referent Slippage is what happens to the *meaning* (the dashboard now means "gate pushback," not "arrival").
  *   **Why it matters:** You can fix Gaming by punishing the pushback. You cannot fix Referent Slippage without renaming the metric. As long as the dashboard says "On-Time Performance," new employees will assume the goal is still passenger satisfaction. The label must die for the meaning to reset.

  ### Summary Recommendation for Your Work

  1.  **Stop using "Goodhart's Law" as a label.** It is too vague.
  2.  **Adopt the Phantom/Hollow/Convergent taxonomy.** It allows you to tell leadership: *"This isn't just gaming; this is a Hollow Metric. The data is true, but the goal is lost."*
  3.  **Flag Referent Slippage explicitly.** When you see Case 2, recommend renaming the metric (e.g., change "On-Time Performance" to "Gate Pushback Compliance"). This forces the organization to acknowledge that they are no longer measuring the original goal.

  This approach moves you from identifying "perversity" to diagnosing specific structural failures in your measurement architecture.
