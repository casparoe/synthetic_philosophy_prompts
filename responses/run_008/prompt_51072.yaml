      *   **Constraint 2:** Don't just give the first label (e.g., "Goodhart's Law").
      *   **Constraint 3:** Address three specific sub-questions: (a) Existing literature fit (with edge cases), (b) Coin new terms if needed (with definitions/boundary tests), (c) Specific phenomenon of meaning migration in Case 2.
      *   **Tone:** Intellectual, precise, acknowledging complexity, avoiding generic lectures on perverse incentives.

  2.  **Deconstruct the Three Cases:**
      *   *Case 1 (Police):* Data falsification/reclassification. Reality unchanged, data corrupted. *Key feature:* Deception regarding the measurement process itself.
      *   *Case 2 (Airline):* Process optimization against the letter, not the spirit. Reality changed (worse for user), data accurate (technically). *Key feature:* Substitution of proxy for goal, technically compliant but functionally useless.
      *   *Case 3 (School):* Teaching to the test, but learning happens anyway. Data improved, goal achieved, but mechanism was narrow/gamed. *Key feature:* Accidental alignment of proxy and goal despite gaming.

  3.  **Brainstorming Candidate Concepts (Step 1 of Prompt):**
      *   *Goodhart's Law:* The umbrella. "When a measure becomes a target, it ceases to be a good measure." Too broad.
      *   *Campbell's Law:* Similar to Goodhart, focuses on social indicators. "The more any quantitative social indicator is used... the more subject it will be to corruption pressures."
      *   *The Cobra Effect:* Perverse incentive leading to opposite outcome. Doesn't quite fit Case 3.
      *   *Surrogation:* (Management accounting) When the measure replaces the construct in the minds of decision-makers. Fits Case 2 well.
      *   *Gaming:* Broad term. Usually implies Case 1 or 2.
      *   *Cream Skimming/Cherry Picking:* Selecting easy cases. Not quite these cases.
      *   *Ratchet Effect:* Targets keep rising. Not relevant here.
      *   *Measurement Drift/Concept Drift:* Statistical terms, usually about data distribution changing over time. Might fit Case 2's meaning migration.
      *   *Construct Validity:* Psychometrics. Does the test measure what it claims? Case 1 breaks validity, Case 2 breaks validity, Case 3 retains validity despite intent.
      *   *Decoupling:* (Institutional theory) Policy vs. Practice. Case 1 is decoupling. Case 2 is ritualistic compliance.
      *   *McNamara Fallacy:* Ignoring what can't be measured. Related, but not specific to the *reaction* to measurement.
      *   *Proxy War:* Fighting the proxy instead of the enemy.
      *   *Specifying the "Type" of Goodhart:* Manheim (2018) distinguishes types. This is crucial.
      *   *Reactivity:* (Social science) Subjects change behavior because they are being studied.
      *   *Performativity:* (Economics/Sociology) Theory makes reality true. Case 3 feels like positive performativity.

  4.  **Addressing Question (a): Existing Literature Fit:**
      *   *Goodhart's Law:* Too blunt.
      *   *Manheim's Taxonomy (2018):* This is the strongest existing lead. He distinguishes *Regressional*, *Extremal*, *Contextual*, and *Adversarial* Goodhart.
          *   Case 1 fits *Adversarial Goodhart* (active manipulation).
          *   Case 2 fits *Contextual* or *Extremal* (optimization changes the relationship).
          *   Case 3 is the outlier. It's a "Happy Accident" or *Positive Reactivity*.
      *   *Surrogation (Business/Accounting):* Fits Case 2 perfectly. The measure *becomes* the goal.
      *   *Construct Validity (Psychometrics):*
          *   Case 1: *Falsification* (threat to validity).
          *   Case 2: *Construct Underrepresentation* (measure misses the breadth of the goal).
          *   Case 3: *Construct-Irrelevant Variance* (usually bad, but here it helped?). Or maybe *Positive Washback* (Language testing term!).
      *   *Washback Effect:* Specifically in education. Can be negative (narrowing) or positive (improving learning). Case 3 is *Positive Washback*.
      *   *Decoupling (Institutional Sociology):* Case 1 is *Symbolic Compliance* (fake). Case 2 is *Operational Compliance* (real but hollow).

      *Critique of Fit:*
      *   Manheim is great for 1 & 2, but 3 is usually treated as a failure in his framework.
      *   "Washback" is specific to education, needs generalizing for Case 3.
      *   "Surrogation" explains the *mindset* of Case 2, but not necessarily the *outcome* distinction from Case 1.

  5.  **Addressing Question (b): Coining Terms (If needed):**
      *   The existing terms are fragmented across disciplines (econ, psych, sociology). A unified taxonomy for a city analyst would be useful.
      *   Need to distinguish based on: *Truthfulness of Data* vs. *Alignment of Outcome*.
      *   *Case 1:* Data Lie, Goal Fail. -> **Corrupt Surrogacy** or **Indicator Falsification**. Let's try **Phantom Optimization**.
      *   *Case 2:* Data True, Goal Fail. -> **Hollow Compliance** or **Literalist Drift**. Let's try **Procedural Substitution**.
      *   *Case 3:* Data True (mostly), Goal Success (via narrow path). -> **Accidental Alignment** or **Convergent Gaming**. Let's try **Serendipitous Coupling**.
      *   *Refining the coinage:* Let's look for terms that describe the *relationship between the Metric (M), the Goal (G), and the Reality (R)*.
      *   Case 1: M diverges from R. (Decoupling)
      *   Case 2: M aligns with R, but R diverges from G. (Surrogation)
      *   Case 3: M aligns with R, R aligns with G, but path was narrow. (Positive Washback)
      *   *Proposed Taxonomy:*
          1.  **Metric Corruption** (Case 1)
          2.  **Goal Displacement** (Case 2)
          3.  **Constructive Gaming** (Case 3)

  6.  **Addressing Question (c): The Meaning Migration (Case 2):**
      *   The user asks: "Where exactly did the meaning of the measure go?"
      *   Concept: **Ontological Drift** or **Semantic Hollowing**.
      *   In Philosophy of Science: **Operationalism**. Bridgman. The concept *is* the operation. If the operation changes (gate pushback), the concept changes.
      *   In Sociology: **Reification**. The abstract measure becomes the concrete reality.
      *   In Management: **Surrogation**.
      *   Best fit: **Operational Drift** or **Referent Slippage**.
      *   Wait, there's a specific term in metrics literature: **Metric Fixation** leads to **Tunnel Vision**.
      *   But the specific sliding of meaning... **Concept Drift** is the ML term. **Construct Drift** is the psych term.
      *   Let's suggest **Referent Displacement**.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Intro:* Acknowledge the sophistication of the question. Validate that Goodhart is too blunt.
      *   *Brainstorm List:* List the concepts identified in step 3 (Manheim, Surrogation, Washback, Decoupling, Operationalism, etc.).
      *   *Section (a) Existing Lit:*
          *   Case 1: *Adversarial Goodhart* (Manheim) / *Data Falsification*. Limit: Doesn't capture the "history is lying" aspect fully.
          *   Case 2: *Surrogation* (Merchant et al.) / *Contextual Goodhart*. Limit: Surrogation is cognitive; this is systemic.
          *   Case 3: *Positive Washback* (Language Testing). Limit: Too niche to education. *Positive Reactivity* (Social Science). Limit: Rarely discussed as a "problem."
      *   *Section (b) New Taxonomy:*
          *   Need to distinguish by *Data Integrity* and *Goal Alignment*.
          *   Type 1: **Epistemic Corruption** (Data lies).
          *   Type 2: **Teleological Displacement** (Goal slides).
          *   Type 3: **Convergent Distortion** (Goal hit, but path weird).
          *   *Refining names:* Make them punchier for a city analyst.
          *   1. **The Phantom Metric** (Data false, Reality static).
          *   2. **The Hollow Metric** (Data true, Reality diverges from Goal).
          *   3. **The Lucky Metric** (Data true, Reality hits Goal via narrow path).
      *   *Section (c) Meaning Migration:*
          *   This is **Operationalism** gone wrong.
          *   Term: **Referent Slippage**.
          *   Also **Semantic Decoupling**.
          *   Explain that the dashboard word stays the same ("On-Time"), but the *operational definition* becomes the *ontological reality*.

  8.  **Review against Constraints:**
      *   Did I brainstorm first? Yes.
      *   Did I avoid generic Goodhart lecture? Yes.
      *   Did I address all 3 sub-questions? Yes.
      *   Is the tone appropriate? Yes, professional and analytical.

  9.  **Final Polish:**
