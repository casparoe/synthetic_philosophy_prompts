      *   *The "Alignment" Term:* It is indeed polysemous. It covers "intent alignment" (system tries to help), "impact alignment" (system actually helps), "inner alignment" (mesa-optimizers), "outer alignment" (loss function matches values).
      *   *The Camps:*
