  ok so here's my hot take after finally reading up on the function debate in philosophy of biology: its kind of a shell game? the selected-effect people say the heart's function is pumping blood because pumping blood is why hearts got selected for, and the causal-role people say the heart's function is pumping blood because thats its causal contribution to the circulatory system. literally the same answer! and the only disagreements anyone ever brings up are weird edge cases like penguin wings being "for" flying vs swimming, or the very first heart-like organ in evolutionary history that had no selection history yet — stuff no working biologist is losing sleep over. my friend keeps insisting malfunction is where it gets interesting but i dont see it, if a heart isnt pumping we just say it's malfunctioning, done, problem solved, you don't need a whole theory for that. so am I right that these are basically two labels for one account and philosophers invented a debate? or is there a single real biological case where they actually give different answers, and if so what is it?
