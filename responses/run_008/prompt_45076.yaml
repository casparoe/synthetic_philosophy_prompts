      *   **Challenge:** Gently push back on the "shell game" assertion. Explain *why* the distinction matters (normativity vs. description).
      *   **Address Malfunction:** This is the strongest point of divergence. Explain why "just saying it's malfunctioning" begs the question (what counts as a malfunction?).
