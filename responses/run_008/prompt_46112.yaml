  ### 4. What to Ask Her Next (The Diagnostics)

  To distinguish between **Probability Weighting (CPT)** and **Reference Dependence (Loss Aversion)**, and to probe that **Scratch Ticket** anomaly, you need two specific gambles. Do not use jargon. Read them as stories.

  **Test 1: The "Zero-Risk" Bias (Tests the Certainty Effect vs. Weighting)**
  *Goal:* See if she pays a premium specifically to eliminate risk entirely, which CPT predicts but standard Loss Aversion doesn't always capture as strongly.*
  > "Imagine you have a ticket for a prize.
  > **Option A:** We roll a 100-sided die. If it lands on 1, you lose $1,000. If it lands on 2-100, you lose nothing.
  > **Option B:** We roll a 100-sided die. If it lands on 1 or 2, you lose $1,000. If it lands on 3-100, you lose nothing.
  >
  > Now, imagine a different scenario.
  > **Option C:** We roll a 100-sided die. If it lands on 1 to 5, you lose $1,000. If it lands on 6-100, you lose nothing.
  > **Option D:** We roll a 100-sided die. If it lands on 1 to 6, you lose $1,000. If it lands on 7-100, you lose nothing.
  >
  > In the first pair (A vs B), would you pay money to switch from B to A (removing the risk entirely)?
  > In the second pair (C vs D), would you pay the *same* amount of money to switch from D to C (reducing risk by the same amount, but not to zero)?"

  *   *Interpretation:* If she pays much more to go from 2% risk to 0% risk (A vs B) than from 6% to 5% risk (C vs D), she has a **Zero-Risk Bias**. This supports the psychological weight of "Certainty" specifically, distinct from general loss aversion.

  **Test 2: The "Endowment" Test (Tests Reference Point)**
  *Goal:* Directly test if receiving money changes her risk tolerance, isolating the mechanism behind the Decoupled Allais.*
  > "I'm going to give you $1,000 in cash right now. It's yours.
  > Now, I have a coin. If it comes up heads, I take the $1,000 back. If it comes up tails, you keep the $1,000 AND I give you another $1,000.
  > Alternatively, you can just keep the $1,000 and we don't flip the coin.
  > Do you want to flip the coin?"

  *   *Interpretation:*
      *   Mathematically, this is a 50% chance at $2,000 vs 100% chance at $1,000.
      *   If she treats the $1,000 as "hers" (Reference Point = $1,000), the coin flip looks like a 50% chance to *lose* $1,000 vs 50% chance to *gain* $1,000. Loss aversion says she should **reject** the flip.
      *   If she treats it as a fresh gamble (Reference Point = $0), it's a 50% chance at $2k vs 50% at $1k. She might accept.
      *   *Connection:* If she rejects the flip here, it confirms she integrates endowments into her reference point. This confirms why she chose "Sure $1M" in Decoupled Setup 1 (the 89% spinner made her feel endowed).

