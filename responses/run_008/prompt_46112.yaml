  Alright, let's get into the weeds. You've got a fascinating subject here. Your sister is what we in the trade call a "robust violator." She's not confused, she's not noisy, and she's not swayed by axiomatic scolding. She has a stable preference structure that simply doesn't live in Expected Utility (EU) space.

  The fact that she rejects a massively positive EV scratch ticket ($5 cost for 1/2000 chance at $20k, EV = $10) is the critical clue that most students miss. It tells us her behavior isn't just about "risk aversion" or "probability weighting" in a vacuum; it's about **frames, reference points, and thresholds.**

  Here is the breakdown of the theoretical landscape, my prediction for your decoupled experiment, and how to pin her down next.

  ### 1. Candidate Decision Rules & Predictions

  We need to look at how different models handle the "decoupling" of the common consequence. In the standard Allais paradox, the 89% chance of $1M is baked into the option description. In your decoupled version, it's a background event (a spinner) that happens *before* the choice is effectively resolved.

  Here is how the major contenders predict she will behave in the **Decoupled Setup**:

  *   **Expected Utility (EU):**
      *   *Mechanism:* Linear weighting of probabilities.
      *   *Prediction:* **Consistency.** Since the final probability distributions are mathematically identical to the standard Allais, EU demands she make the same choice pattern as before (which is inconsistent). Wait, no—EU demands she *not* show the Allais pattern at all. If she were an EU maximizer, she wouldn't have shown the Allais pattern in month 1. Since she did, EU is dead. But if we ask what EU predicts for the decoupled version: it predicts she should treat the sub-choice identically in both setups.
      *   *Verdict:* Discard. She already falsified this.

  *   **Cumulative Prospect Theory (CPT):**
      *   *Mechanism:* Non-linear probability weighting (overweighting small probs, underweighting moderate/high) + Value function.
      *   *Prediction:* **Likely Inconsistency (Allais Pattern Persists).** CPT explains the standard Allais paradox via the weighting function $\pi(p)$. The jump from 100% to 89% is weighted much more heavily than 11% to 0%.
      *   *The Decoupling Nuance:* If she **integrates** the spinner into the final outcome (calculates the total probability), CPT predicts the same violation as before. If she **segregates** (mentally accounts for the 89% as a separate "sunk" event and only evaluates the 11% sub-choice), the options in the sub-choice are identical in both setups ($1M sure vs. 10/11 $5M). If she segregates, she must choose the same option in both setups, resolving the inconsistency.
      *   *Verdict:* Depends on her editing phase. Most people integrate, so the violation persists.

  *   **Regret Theory (Loomes & Sugden):**
      *   *Mechanism:* You anticipate the regret of choosing B and getting $0 when A would have given you $1M.
