answer: |-
  This is a strong, sophisticated profile. It signals that you're familiar with the standard rationality toolkit (Kahneman, Tetlock, Aumann, etc.) without just reciting dogma. It hangs together *mostly*, but your nagging feeling is correct: there is a structural vulnerability in how (2) and (5) interact.

  Here is the coherence check, the tension ranking, and the cheapest revision.

  ### 1. The "Collision" between (2) and (4)
  **Verdict:** This is not a logical contradiction; it is a **defeasible rule**.
  *   (2) is your default policy (prior).
  *   (4) is your exception handler (likelihood ratio).
  *   **The Risk:** The tension isn't logical, it's *psychological*. The danger is that you use (4) as a "Get Out of Modesty Free" card whenever you feel strongly about something. If you can too easily convince yourself that "experts are systematically biased here," (2) becomes toothless.
  *   **Coherence:** High, provided the trigger for (4) is strict.

  ### 2. The "Nagging Feeling" between (2) and (5)
  **Verdict:** This is the **critical vulnerability** (often called "Reference Class Tennis").
  *   (2) relies on the output of an aggregate.
  *   (5) admits that *defining* the aggregate is an inside-view operation.
  *   **The Conflict:** If the most important step (selecting the reference class) is done via inside view, you can game the system. An optimist picks the reference class of "highly motivated teams" (fast completion); a pessimist picks "average software projects" (slow completion). Both claim they are using the Outside View (1), but both are actually indulging in Inside View (5).
  *   **Coherence:** Low. This undermines the reliability of (2). If the foundation (5) is immodest, the house (2) cannot be modest.

  ### 3. Tension between (3) and (4)
  **Verdict:** **Practical application risk.**
  *   (3) says contrarians are usually wrong.
  *   (4) says contrarians are sometimes right (when experts are biased).
  *   **The Conflict:** How do you know you are in the scenario described in (4) and not the graveyard described in (3)?
  *   **Coherence:** Medium. This is resolved only if the evidence for the "systematic bias" in (4) is robust enough to overcome the prior in (3).

  ---

  ### Ranking Tensions by Severity

  1.  **Severity High: (2) vs. (5).** This is foundational. If reference class selection is purely inside-view, epistemic modesty is an illusion. You can always find a reference class that agrees with you.
  2.  **Severity Medium: (3) vs. (4).** This is the "Am I the Chosen One?" problem. Without a strict criterion for what counts as "known systematic bias," you risk becoming the very survivorship bias victim you describe in (3).
  3.  **Severity Low: (2) vs. (4).** As noted, this is just a rule/exception structure. It works logically, even if it's hard to implement.

  ---

  ### The Cheapest Revision

  Do not give up any of the points; they are all valuable. Instead, **tighten the interface between (4) and (5).**

  The problem is that (5) leaves the door open for motivated reasoning, which allows you to trigger (4) too easily, which violates (2).

  **Recommended Revision:**
  Modify **(4)** to specify that the *detection of the bias* must also be an outside-view claim, not an inside-view intuition.

  > **Current (4):** "...when a reference class is populated by people with a known systematic bias... the outside view can tell me to trust my own model..."
  >
  > **Revised (4):** "...when **historical data (an outside view)** shows that a specific reference class has a known systematic bias... I can trust my own model..."

  **Why this is the cheapest fix:**
  1.  It preserves your commitment to modesty (2).
  2.  It acknowledges the reality of expert bias (4).
  3.  It closes the loophole in (5). You can no longer say "I feel these experts are biased" (inside view); you must say "The literature shows experts are biased at this specific task" (outside view).

  **If you were forced to give one up:**
  Give up the **strength** of **(2)**. Change "shift *most* of the way" to "shift *significantly* toward them."
  *   **Why:** "Most" implies you trust the aggregate more than your own reasoning process, including your reference class selection. Since (5) admits your selection process is inside-view, you cannot trust the aggregate *more* than your own judgment on the *selection* of that aggregate. Reducing the shift amount accounts for the uncertainty introduced by (5).

  ### Summary for the Meetup
  Your profile is meetup-ready, but expect someone to play "Reference Class Tennis" with you. They will ask: *"How do you know you picked the right reference class in (5) and didn't just cherry-pick one that supports your inside view?"*

  With the revision to (4) (requiring the bias detection to be data-driven/outside-view), you have a ready answer: *"I only override the aggregate when the bias itself is established by an outside view."* This makes your epistemic profile recursively consistent.
