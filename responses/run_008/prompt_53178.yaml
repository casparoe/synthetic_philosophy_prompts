  No iron binds my wrist, no bar denies,
  The gate stands open to the morning light.
  He offers bread with gentle, smiling eyes,
  And never bids me labor through the night.

  I walk the fields without a guard behind,
  He asks no reason for the paths I take.
  No harsh command resides within his mind,
  No threat hangs heavy on the steps I make.

  But kindness is a choice he makes each day,
  Not debt he owes to me by right or law.
  He stands prepared to sweep my joy away,
  At whim alone, needing no other cause.

  I am not mine while one may still command,
  Though he refrain from lifting up his hand.
