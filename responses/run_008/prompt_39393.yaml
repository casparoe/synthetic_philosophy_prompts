      *Another nuance:* "Feel pain at all." This is the biggest empirical/conceptual slip. They feel *touch* or *nociceptive input*, but deny it is *painful*.
      *Hedonism:* If hedonism is "Pleasure is good, Pain is bad," and asymbolia patients have "Pain without Badness," then either Pain isn't essentially bad, or it isn't Pain. The standard philosophical move is the latter.

