answer: |-
  # JOINT STATEMENT ON THE METAPHYSICS OF TIME
  **Signatories:** Dr. A. N. Te (Eternalist) & Dr. I. S. Tence (Presentist)
  **Date:** October 24, 2023
  **Subject:** Findings following one year of adversarial collaboration regarding the ontology of temporal entities.

  ## 1. Agreed Claims

  The undersigned parties, having engaged in sustained dialectical exchange, affirm the following points of consensus. These claims establish the boundary conditions of our dispute and isolate the specific ontological commitments under contention.

  1.  **Semantic Data of Tense:** We agree that tensed sentences (e.g., "The meeting is now") convey cognitive information that is not trivially recovered from their tenseless paraphrases (e.g., "The meeting is simultaneous with this utterance"). Both parties accept that tensed language is indispensable for agency, planning, and historical record. We disagree only on whether this indispensability reflects the fundamental structure of reality or the perspectival nature of temporally embedded agents.
  2.  **Constraints on Causal Interaction:** Neither party asserts that present agents can causally interact with non-present entities. We agree that we cannot telephone Julius Caesar, alter past events, or receive signals from the future (barring speculative physics models which neither of us currently endorses). The dispute concerns ontology, not causal accessibility.
  3.  **Historical Reality:** The Presentist does not deny the historical reality of past figures. We agree that the proposition "Julius Caesar existed" is true. The Presentist glosses this as "It *was* the case that Caesar exists"; the Eternalist glosses this as "Caesar exists at a time $t$ prior to this utterance." Neither party claims Caesar is a fiction or that the past is unreal in the sense of being illusory.
  4.  **Phenomenology of Passage:** We agree on the phenomenological data: agents experience time as passing, the present as phenomenologically privileged, and the future as open.
      *   *[Presentist Gloss: This phenomenology veridically tracks a mind-independent metaphysical feature (the moving now).]*
      *   *[Eternalist Gloss: This phenomenology tracks the cognitive processing of a world-tube by an agent located at a specific temporal coordinate.]*
  5.  **Rejection of Nearby Positions:** To prevent conflation, we explicitly disavow the following intermediate positions:
      *   **The Growing Block Theory:** We reject the view that the past and present exist while the future does not.
      *   **The Moving Spotlight Theory:** We reject the view that all times exist eternally but one time is objectively privileged as "the present."
      *   **Temporal Nihilism:** We reject the view that time or temporal objects are wholly illusory.

  ## 2. Disagreements

  The following table isolates the residual ontological disagreements. Where possible, we provide a neutral formulation, alongside the specific phrasing each party accepts as an accurate characterization of their own view.

  | Topic | Presentist Formulation (Dr. Tence) | Eternalist Formulation (Dr. Te) | Neutral/Shared Formulation |
  | :--- | :--- | :--- | :--- |
  | **Ontological Status of Non-Present Entities** | Entities located in the past or future do not **exist** (simpliciter). They *did* exist or *will* exist. Existence is a monadic property possessed only by present entities. | Entities located in the past or future **exist** tenselessly. Existence is not restricted to the present coordinate. "Now" is an indexical, not an ontological filter. | The domain of the unrestricted quantifier $\exists x$ either ranges over present entities only (P) or over entities at all temporal locations (E). |
  | **Cross-Time Relations** | Relations involving non-present relata (e.g., "I admire Marcus Aurelius") are grounded in present properties of the admirer and the *past existence* of the admired. They do not require the current existence of both relata. | Relations involving non-present relata require the existence of both relata. "I admire Marcus Aurelius" is a relation between me (at $t_1$) and Marcus (at $t_2$). Both terms must denote existing entities. | True relational statements involving terms for non-present entities require ontological grounding. The dispute is whether the relata must currently exist. |
  | **The Passage of Time** | Temporal passage is an objective feature of the world. It consists in the coming into and going out of existence of events and entities. | Temporal passage is a feature of temporally embedded observers. It consists in the variation of experiences along an agent's world-line. The world itself does not "pass." | The phenomenon of temporal passage is real. The dispute is whether it is a feature of the **world** (P) or a feature of **observers in the world** (E). |

  ## 3. Cruxes

  We identify four specific sub-questions ("cruxes") where further theoretical development or empirical data would likely shift the credence of at least one signatory. For each, we state the agreed-upon bearing of the argument and record our current predictions.

  ### 3.1 The Truthmaker Crux
  *   **The Issue:** What makes past-tense truths (e.g., "There were dinosaurs") true?
  *   **Agreed Bearing:** If Presentism can identify truthmakers for past-tense propositions that are (a) wholly present and (b) do not implicitly presuppose the existence of past entities, Presentism gains significant plausibility. If all candidate truthmakers (e.g., Lucretian properties like *having-contained-dinosaurs*) covertly rely on the reality of the past, Eternalism is favored.
  *   **Presentist Prediction:** We predict that a robust theory of *tensed properties* or *temporal distributions of qualities* can serve as sufficient truthmakers without ontological commitment to dinosaurs.
  *   **Eternalist Prediction:** We predict that any truthmaker sufficient to ground specific historical truths will entail the existence of the past entities, effectively collapsing Presentism into a notational variant of Eternalism.

  ### 3.2 The Triviality Crux
  *   **The Issue:** Is Presentism a substantive metaphysical thesis or a trivial semantic claim?
  *   **Agreed Bearing:** If Presentism can be formulated in a way that the Eternalist must deny *without* merely stipulating a restriction on the quantifier 'exists', the dispute is substantive. If the Eternalist can accept the Presentist's core formula by adjusting their ideology of tense, the dispute is verbal.
  *   **Presentist Prediction:** The dispute is substantive. Eternalists must deny that *fundamental reality* is tensed. We assert primitive tense operators; they assert primitive tenseless dates. This is a clash of fundamental ideology.
  *   **Eternalist Prediction:** The dispute is partially verbal. Once we distinguish the "ontological exists" from the "present-tensed exists," the Eternalist can accept everything the Presentist says, rendering the ontological disagreement a choice of logical framework rather than a fact of the world.

  ### 3.3 The Special Relativity Crux
  *   **The Issue:** Does the denial of absolute simultaneity in Special Relativity (SR) undercut the notion of a global present required by Presentism?
  *   **Agreed Bearing:** If a Lorentzian interpretation of SR (positing a preferred but empirically undetectable frame) is deemed philosophically and scientifically permissible, Presentism remains viable. If such a frame is deemed inadmissible *ad hoc* rescue, Presentism is empirically disconfirmed.
  *   **Presentist Prediction:** Metaphysics can legitimately guide the interpretation of physics. A hidden preferred frame is ontologically parsimonious compared to the cost of abandoning the manifest image of time. It is a viable response.
  *   **Eternalist Prediction:** Positing an undetectable preferred frame violates methodological naturalism and parsimony. Eternalism fits the Minkowski manifold naturally; Presentism requires fighting the physics. This is an ad hoc rescue.

  ### 3.4 Prior's Relief Crux
  *   **The Issue:** A. N. Prior's observation that we feel relief *that an ordeal is over*, not merely that it ends earlier than this utterance.
  *   **Agreed Bearing:** If the affective state of relief can be fully analyzed in terms of tenseless facts about the temporal ordering of events and desire satisfaction, Eternalism stands. If relief essentially targets the *tensed fact* of the ordeal's cessation (its passing into non-existence), Presentism is favored.
  *   **Presentist Prediction:** Relief is irrational on Eternalism. If the pain exists eternally at $t_1$, why be relieved at $t_2$? The relief tracks the objective change in the *status* of the pain (from real to unreal).
  *   **Eternalist Prediction:** Relief is explained by indexical self-location. I am relieved that my current location ($t_2$) is later than the pain's location ($t_1$). The affect tracks the satisfaction of the desire "I am not currently in pain," which is a tenseless fact about my current state.

  ## 4. A Verbal/Substantive Split

  After extensive analysis, we conclude that the dispute contains both verbal and substantive components.

  **The Verbal Component:**
  We agree that a portion of the disagreement stems from the semantics of the unrestricted quantifier **"exists."**
  *   If "exists" means "is in the domain of the fundamental theory," the Eternalist wins by stipulation (as their theory includes past/future coordinates).
  *   If "exists" means "is causally active/present now," the Presentist wins by stipulation.
  *   **Diagnosis:** To the extent that we are arguing over which English word maps to the domain of quantification in a formal model, the dispute is verbal. We acknowledge that we can translate each other's claims into a shared neutral language (e.g., "There is an $x$ at $t$" vs. "At $t$, there is an $x$") without loss of predictive power.

  **The Substantive Component:**
  However, we maintain that a core substantive disagreement remains regarding **Fundamental Ideology.**
  *   The Presentist claims that **tense** (past, present, future) is a primitive, unanalyzable feature of fundamental reality.
  *   The Eternalist claims that **temporal location** (dates/coordinates) is fundamental, and tense is derivative/indexical.
  *   **Why this is not merely verbal:** This is not a dispute over words, but over which concepts are needed to fully describe the world without remainder. If the Presentist is right, a complete description of the universe requires tense operators. If the Eternalist is right, a complete description requires only tenseless relations. This is a disagreement about the *structure* of fundamental reality, not merely the labeling of it.

  **Signed,**

  *Dr. I. S. Tence (Presentist)*
  *Dr. A. N. Te (Eternalist)*
