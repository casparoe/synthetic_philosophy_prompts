  Here is a brainstorming outline to structure the analysis, followed by the detailed mapping and evaluation you requested.

  ### Brainstorm: Mapping Kant to the League

  **The Preliminary Articles (Conditions for stopping the current war)**
  *   *No secret reservations:* Versailles War Guilt Clause and reparations look like a hidden reservation for future conflict.
  *   *No standing armies:* League had no army (matches), but member states kept theirs (neutral).
  *   *No national debt for war:* Reparations created crushing debt dynamics (violates).
  *   *No interference:* Mandates system looks like structural interference in internal constitutions (violates).
  *   *No assassinations/terror:* Not a primary feature of the League era.

  **The Definitive Articles (Conditions for establishing permanent peace)**
  *   *Republican Civil Constitution:* Mixed membership. US (major republic) absent. Germany (potential republic) excluded initially.
  *   *Federation of Free States:* The League exists, but is it voluntary? US says no. Is it a state or a federation? It tried to be a state without power.
  *   *Cosmopolitan Right:* Migration restrictions tightened post-war. Mandates restrict self-determination of colonized peoples.

  **The Structural Flaws**
  *   Unanimity rule vs. Kant's moral necessity.
  *   Lack of enforcement vs. Kant's reliance on public reason and shame.
  *   The US absence vs. Kant's assumption that republics naturally seek peace.

  ***

  ### Analysis: The League of Nations through the Lens of Perpetual Peace

  You are right to be suspicious of the standard narrative. Calling the League a Kantian experiment is often a shorthand for calling it a liberal internationalist one, but the philosophical specificities matter. When we map the actual text of Kant's essay to the actual history of the League and the Versailles settlement, the fit is far less snug than the textbooks suggest. In many crucial places, the League violated Kant's specific prohibitions, while in others, it tried to institutionalize what Kant intended as a moral disposition.

  Here is the article-by-article mapping.

  #### The Preliminary Articles: The Poisoned Chalice of Versailles

  Kant begins with negative conditions—things you must stop doing to end a state of war. The Versailles Treaty, which birthed the League, fails several of these tests spectacularly.

  **1. No peace treaty shall be considered valid if it secretly reserves material for a future war.**
  This is the most damning indictment of the Versailles settlement. Kant argues that a peace treaty must end the state of war definitively, not merely pause it. The War Guilt Clause and the reparations regime functioned exactly as the kind of reservation Kant warned against. By imposing crippling economic penalties and national humiliation on Germany, the victors created a material incentive for the defeated to seek revision through force. The League was built on top of a treaty that, in Kantian terms, was not a peace at all, but a truce with a timer on it.

  **2. No independent state shall be acquired by another through inheritance, exchange, purchase, or donation.**
  The Mandates System is the critical test case here. The former colonies of the defeated empires were not annexed outright, which superficially respects this article. However, they were placed under the supervision of the victors. Kant views states as moral persons, not property. While the Mandates were technically not owned, the administration of these territories by foreign powers treated the populations as means to an end rather than ends in themselves. This violates the spirit of the article, even if it adheres to the letter.

  **3. Standing armies shall gradually be abolished.**
  The League itself had no standing army, which aligns with Kant. However, Kant's argument is that standing armies threaten other states by signaling constant readiness for war, provoking an arms race. The major League members (France, UK, Japan, Italy) maintained large standing armies. The League did not attempt to abolish them; it merely lacked one of its own. This is a neutral point—the League didn't violate the rule, but it didn't fulfill the positive duty to reduce military posturing among members.

  **4. No national debt shall be contracted with a view to external conflict.**
  The reparations imposed on Germany created a web of international debt specifically tied to the consequences of the past war. This financial structure destabilized the European economy and created the exact conditions of resentment and resource scarcity that Kant argues lead to conflict. The League had no mechanism to resolve this debt dynamic in a way that secured the rights of the debtor state.

  **5. No state shall forcibly interfere in the constitution and government of another.**
  This is where the Mandates System and the initial exclusion of Germany become problematic. Kant argues that a state is like a tree; you cannot graft a branch onto it from the outside. It must grow from its own roots. By excluding Germany from the League until 1926, the victors were effectively dictating the terms of its re-entry into the community of nations based on the victors' timeline, not Germany's internal constitutional development. Furthermore, the Mandates system was explicitly framed as tutelage—guiding these territories toward self-government. While Kant does allow for a concept of guardianship in some contexts, he is deeply skeptical of foreign powers imposing political forms. The Mandates look less like protection and more like the interference Kant forbids, dressed up in the language of civilization.

  #### The Definitive Articles: The Structure of the Federation

  **1. The Civil Constitution of Every State Shall Be Republican.**
  Kant defines a republic not simply by the absence of a monarch, but by the separation of the executive power from the legislative, and the requirement that citizens consent to war through representatives.
  *   **The Match:** France and the UK were constitutional systems where the legislature had to approve war. In theory, this should make them cautious.
  *   **The Mismatch:** The United States, the archetypal republic of the age, refused to join. This is a massive hole in the Kantian expectation. Kant assumes that because republics bear the cost of war, they will naturally seek a federation. The US Senate's rejection suggests that domestic sovereignty was valued higher than cosmopolitan obligation.
  *   **The Exclusion:** Germany was not admitted until 1926. For its first seven years, the League was a club of victors, not a federation of free states. A federation that excludes major powers based on the outcome of a war is not a true federation of equals; it is an alliance of convenience.

  **2. The Law of Nations Shall Be Founded on a Federation of Free States.**
  Kant is very specific here: he rejects a world state (which he fears would become a soulless despotism) in favor of a voluntary league.
  *   **The Match:** The League was not a world government. It had no sovereignty over its members. This aligns with Kant's rejection of a global super-state.
  *   **The Mismatch:** The League tried to act like a state without having the power of one. Kant's federation relies on the moral force of public agreement and the shame of violation. The League, however, created a bureaucratic structure (Council, Assembly, Secretariat) that implied legal authority it did not possess.
  *   **The Unanimity Rule:** Decisions required unanimity. Kant does not specify a voting rule, but his system relies on the public use of reason. The unanimity rule allowed aggressors (like Japan in Manchuria) to shield themselves from condemnation by their own vote or the vote of sympathetic allies. This turned the federation into a shield for sovereignty rather than a constraint on it.

  **3. Cosmopolitan Right Shall Be Limited to Conditions of Universal Hospitality.**
  This article concerns the right of a foreigner not to be treated with hostility upon arrival in another land.
  *   **The Mismatch:** The post-WWI era saw a tightening of borders, passports, and migration controls. The League did little to expand the right of visitation.
  *   **The Mandates Again:** The peoples under the Mandates were denied the right to determine their own associations. They were not treated as hosts in their own land but as wards. This violates the core of cosmopolitan right, which grants all humans a claim to community based on shared possession of the earth.

  #### Where Kant Breaks as an Explanatory Model

  This is the critical section for your piece. There are points where applying Kant to the League stops illuminating and starts distorting.

  **1. Institution vs. Disposition**
  Kant's federation is primarily a moral disposition, a standing agreement to resolve disputes through dialogue rather than force. He does not envision a headquarters in Geneva with a Secretariat and a Covenant. The League tried to institutionalize the moral disposition. By turning a moral commitment into a bureaucratic procedure, the League created the illusion of enforcement without the reality. When Japan invaded Manchuria, the League followed its procedures (investigations, reports, votes) while Japan simply walked away. Kant's theory relies on the idea that violating the public agreement brings such shame and isolation that no state would do it. The League proved that in the absence of physical enforcement or deep economic interdependence, shame is insufficient. The theory breaks because it overestimates the power of public reason against national interest in a crisis.

  **2. The Republican Peace Anomaly**
  Kant argues that republics are naturally more peaceful because the citizens who fight and pay must consent to the war. The League's history challenges this. France was a republic; Germany became a republic (Weimar); the US was a republic. Yet the settlement was harsh, and the US stayed out.
  This suggests Kant's empirical claim about republics might be distinct from his normative claim. Just because a state *is* a republic doesn't mean it will act *Kantianly*. The US Senate was acting democratically (representing the will of the American people) by rejecting the League. This creates a paradox: a republic fulfilling its domestic democratic duty by violating its cosmopolitan duty. Kant does not fully resolve the tension between domestic representation and international obligation.

  **3. The Nature of the Federation**
  Kant's federation is loose. The League was tight in ambition but loose in power. Kant warns against a federation that becomes a state. The League didn't become a state, but it pretended to have the authority of one. When it failed to stop Italy in Abyssinia, it wasn't just a military failure; it was a failure of the specific mechanism Kant proposed. Kant expects the federation to grow gradually as states see the benefit. The League tried to start at the finish line, demanding collective security immediately without the gradual build-up of trust or the integration of the defeated powers.

  #### Verdict: Confirmation, Anomaly, or Exceedance?

  Is the collapse of the League a refutation of Kant? No. It is arguably a confirmation of his warnings about the *preliminary* conditions.

  **The Confirmation:**
  Kant argues that you cannot build a lasting peace on a vindictive treaty. The Versailles settlement violated the preliminary articles (no secret reservations for future war, no crushing debt, no interference). Therefore, any federation built on top of it was doomed. The League did not fail because Kant was wrong about the federation; it failed because the ground it was built on was poisoned. The seeds of the next war were planted in 1919, exactly as Kant's logic would predict.

  **The Exceedance:**
  However, the episode reveals something Kant did not anticipate: the problem of the "free rider" in a voluntary federation. Kant assumes rational states will see that joining the federation is in their interest. He did not account for a powerful republic (the US) calculating that it could benefit from global stability without joining the structure. This is a gap in his theory of motivation. He assumes moral rationality aligns with political rationality. The US Senate proved they can diverge.

  **Democratic Peace Theory vs. Kant:**
  You asked to separate the empirical finding from the theory. The empirical democratic-peace finding states that democracies rarely fight each other. This is a statistical observation. Kant's theory is normative: he argues republics *ought* to be peaceful and *ought* to federate.
  The League episode supports the empirical finding only weakly. France and Britain (democracies) did not fight each other, but they did not cooperate effectively to stop aggressors. The US (democracy) stayed out. The empirical finding explains why the great democracies didn't fight *each other*, but it does not explain why they failed to secure peace *globally*. Kant's framework explains the failure better than the empirical finding does, because Kant focuses on the structure of the peace treaty and the nature of the federation, not just the regime types of the members. The empirical finding is a data point; Kant provides the structural diagnosis.

  #### Conclusion for Your Piece

  The standard story is that the League was a Kantian project that failed because the world wasn't ready for Kant. The more precise philosophical reading is that the League was a Wilsonian project that wore Kantian clothing. It adopted the language of the federation but violated the conditions of the peace treaty that Kant deemed essential.

  If you want to save Kant from the failure of the League, you argue that a true Kantian peace was never attempted. The treaty was unjust, the federation excluded the defeated, and the greatest republic opted out. The League was not a failed Kantian experiment; it was a non-Kantian arrangement that collapsed under the weight of its own contradictions. The tragedy is not that Kant's ideas were tried and failed, but that they were cited while being systematically ignored in the hard decisions of 1919.
