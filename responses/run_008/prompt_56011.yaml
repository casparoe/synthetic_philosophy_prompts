answer: |-
  # The Consent Theory Quiz: What's Your Actual Position?

  **Instructions:** Read each case carefully. Select the single answer option that best reflects your judgment about the *validity of the consent* or the *moral significance of the agreement*. Do not overthink; go with your immediate philosophical instinct.

  ***

  **1. The Surgeon Swap**
  A patient consents to a complex surgery after being accurately told all risks and benefits. She specifically asks if Dr. Famous will perform it. She is told "yes," but on the day of surgery, a resident performs the procedure while Dr. Famous supervises from the control room. The surgery is successful.
  *   **A.** The consent is valid; she agreed to the procedure, and the identity of the hands was not material to the medical outcome.
  *   **B.** The consent is invalid; deception regarding a material fact (who is cutting) vitiates the agreement, regardless of the outcome.
  *   **C.** The consent is invalid; any intentional deception undermines the autonomy required for valid consent, even if the patient wouldn't have changed her mind.

  **2. The Landlord's Offer**
  In a severe housing shortage, a landlord tells a tenant he will keep her rent flat if she enters a "personal relationship" with him. She calculates her options, finds no better housing, and agrees.
  *   **A.** Valid consent; he made an offer, not a threat, and she chose the best available option.
  *   **B.** Invalid consent; the background pressure is so coercive that her choice is not truly voluntary.
  *   **C.** Valid consent, but the contract is unenforceable because the exchange is morally exploitative.

  **3. The Morning After**
  Two people drink heavily. One is intoxicated but coherent, initiates sex, and expresses willingness throughout. The next morning, while sober, they confirm they enjoyed it and have no regrets.
  *   **A.** Valid consent; their internal willingness was present at the time and ratified later.
  *   **B.** Invalid consent; intoxication negates the capacity to grant permission at the time, and later endorsement cannot retroactively fix it.
  *   **C.** Valid consent; so long as they could communicate willingness in the moment, the internal state of sobriety is secondary.

  **4. The Loaded Glove**
  A boxer consents to a match under standard rules. Between rounds, his opponent secretly tapes a hard object to his knuckles and punches him, causing injury.
  *   **A.** The boxer consented to being hit; the fraud concerns the conditions, not the act of hitting itself.
  *   **B.** The boxer did not consent to *this* act; consent is specific to the rules agreed upon, and breaking them changes the nature of the act.
  *   **C.** The question of consent is secondary; the opponent violated the regulatory framework that makes the sport permissible.

  **5. The Unconscious Patient**
  An unconscious patient arrives in the ER with a life-threatening condition. No surrogate is available. The procedure is obviously beneficial and one any reasonable person would want.
  *   **A.** Permissible based on hypothetical consent; we act as the patient would have if they could speak.
  *   **B.** Permissible based on necessity or best interests; consent is irrelevant in true emergencies.
  *   **C.** Impermissible; without actual authorization, touching the patient is a battery, regardless of benefit.

  **6. The Consensual Maiming**
  A fully informed, uncoerced adult consents to have a healthy limb amputated for another person's sexual gratification. The surgeon performs the act exactly as agreed.
  *   **A.** Invalid consent; one cannot morally waive the right against grievous bodily harm.
  *   **B.** Valid consent, but the act remains impermissible; consent is not sufficient to make the act right.
  *   **C.** Valid and sufficient; if the agent owns their body, they may dispose of it as they wish.

  **7. The Misunderstood Prescription**
  A patient mistakenly believes a prescribed medication is a vitamin. The doctor knows this but does not correct the misunderstanding, believing the patient would refuse if told the truth. The patient takes it and benefits.
  *   **A.** Valid consent; the doctor did not lie, and the patient agreed to take the pill.
  *   **B.** Invalid consent; the doctor had a duty to correct the negligent misunderstanding to ensure authorization was informed.
  *   **C.** Valid consent, but the doctor acted negligently; the validity of the agreement is separate from professional duty.

  **8. The Retroactive Approval**
  A doctor performs a non-emergency procedure without asking for consent, believing it was too minor to warrant discussion. The patient later learns of this but says, "I'm glad you did it; I needed that."
  *   **A.** The later approval validates the act; consent can be ratified after the fact.
  *   **B.** The act was a battery at the time; later happiness does not erase the initial rights violation.
  *   **C.** The act was justified by the outcome; consent is just one factor in determining permissibility.

  **9. The Desperate Sale**
  A parent in extreme poverty consents to sell a kidney to a broker to feed their children. The medical risks are fully understood.
  *   **A.** Valid consent; economic desperation does not negate autonomy.
  *   **B.** Invalid consent; severe background inequality renders the choice involuntary.
  *   **C.** Valid consent, but the transaction should be banned to prevent exploitation; validity and regulation are separate issues.

  ***

  # Scoring Key & Theoretical Profiles

  There is no simple point tally. Consent theory is not a spectrum but a cluster of commitments. To find your position, identify which **Load-Bearing Questions** drove your answers. Your profile is determined by how you resolved the tensions in those specific cases.

  ### 1. The Attitudinal Theorist (Consent as Mental State)
  *   **Core View:** Consent is an internal psychological state of acceptance. External words are merely evidence of this state.
  *   **Your Pattern:** You likely chose **A** in **Question 1** (Surgeon), **A** in **Question 3** (Intoxication), and **A** in **Question 7** (Misunderstanding).
  *   **Why:** You prioritize the agent's actual will over the communicative signal. If the patient *wanted* the surgery (Q1) or *wanted* the sex (Q3), consent exists, even if information was flawed or capacity was borderline.
  *   **Load-Bearing Question:** **Question 3.** If you believe later sober endorsement validates the intoxicated act because the *will* was ultimately aligned, you lean attitudinal.

  ### 2. The Performative Theorist (Consent as Speech Act)
  *   **Core View:** Consent is a public, communicative act that changes the normative landscape. Internal states matter less than the external signal given to others.
  *   **Your Pattern:** You likely chose **A** in **Question 1** (Surgeon), **C** in **Question 3** (Intoxication), and **B** in **Question 8** (Retroactive).
  *   **Why:** You focus on what was signaled at the time. In Q3, if they signaled willingness, it counts (C), or if they lacked capacity to signal, it doesn't (B). In Q8, you reject retroactive approval because no performance occurred at the time of the act.
  *   **Load-Bearing Question:** **Question 8.** If you insist that later approval cannot fix the lack of a prior performative act, you are likely a performative theorist.

  ### 3. The Normative-Power Theorist (Consent as Hohfeldian Power)
  *   **Core View:** Consent is the exercise of a normative power to waive a right or alter a duty. The focus is on authority and jurisdiction.
  *   **Your Pattern:** You likely chose **B** in **Question 4** (Boxer), **C** in **Question 6** (Maiming), and **B** in **Question 3** (Intoxication).
  *   **Why:** You view consent as a mechanism of rights-transfer. In Q4, the opponent exceeded the scope of the power granted. In Q3, intoxication removes the legal/moral authority to exercise the power. In Q6, you believe the agent *has* the power to waive bodily rights (C).
  *   **Load-Bearing Question:** **Question 6.** If you believe a competent adult *can* validly waive the right against maiming (C), you hold a robust view of normative power.

  ### 4. The Moralized Theorist (Validity Tracks Permissibility)
  *   **Core View:** Whether consent is "valid" depends on the moral quality of the act consented to. One cannot validly consent to wrongdoing.
  *   **Your Pattern:** You likely chose **B** in **Question 2** (Landlord), **A** in **Question 6** (Maiming), and **B** in **Question 9** (Desperate Sale).
  *   **Why:** You link validity to morality. If the deal is exploitative (Q2, Q9) or the act is harmful (Q6), the consent is deemed invalid *because* the act is wrong.
  *   **Load-Bearing Question:** **Question 6.** If you chose **A** (Invalid because one cannot consent to harm), you hold a moralized view. This distinguishes you from the Normative-Power theorist who might say the consent is valid but the act is still regulated.

  ### 5. The Hypothetical-Consent Theorist
  *   **Core View:** Actual consent is not always required; what matters is what a reasonable agent *would* have agreed to.
  *   **Your Pattern:** You likely chose **A** in **Question 5** (ER).
  *   **Why:** This is the defining question for this view. If you believe the ER doctor acts on *hypothetical* consent rather than necessity or best interests, you occupy this distinct leaf.
  *   **Load-Bearing Question:** **Question 5.** This is the primary diagnostic. If you chose **B** (Necessity), you are likely Deflationary. If you chose **A** (Hypothetical), you are here.

  ### 6. The Deflationary Theorist (Consent as Secondary)
  *   **Core View:** Consent talk does less moral work than we think. Other factors (harm, welfare, necessity) do the heavy lifting.
  *   **Your Pattern:** You likely chose **B** in **Question 5** (ER), **C** in **Question 8** (Retroactive), and **C** in **Question 6** (Maiming) or **B** (Maiming).
  *   **Why:** In Q5, you rely on necessity, not consent. In Q8, you rely on the outcome/welfare rather than the history of authorization. You see consent as a heuristic for welfare, not a fundamental switch.
  *   **Load-Bearing Question:** **Question 5 & 8.** If you bypass consent in favor of "necessity" (Q5) or "outcome" (Q8), you are deflationary.

  ***

  # Logical Space & Limitations

  ### Unoccupied or Incoherent Patterns
  If your answers suggest you are a **Performative Theorist** (consent requires public signaling) but you also answered **A** in **Question 1** (Surgeon) on the grounds that the patient's *secret mental state* was unchanged, you hold a logically tense position.
  *   **Why:** Pure performative theories argue that secret mental states do not constitute consent. If you rely on the patient's internal acceptance to validate the consent despite the deceptive performance, you are drifting toward Attitudinalism.
  *   **Status:** This combination is rarely held consistently. It usually indicates a hybrid view where performance is the default, but internal states act as a tie-breaker.

  Another rare pattern is answering **A** in **Question 5** (Hypothetical Consent validates ER treatment) but **B** in **Question 8** (Retroactive approval does *not* validate non-emergency treatment).
  *   **Why:** Both rely on consent that was not present at the time of the act. If hypothetical consent works in emergencies, it is difficult to explain why retrospective ratification never works in non-emergencies without appealing to a different principle (like urgency).
  *   **Status:** Unexplored by most, but potentially defensible if one argues hypothetical consent is a proxy for necessity, while retrospective endorsement is merely forgiveness.

  ### Indistinguishable Positions
  This quiz cannot cleanly separate **Normative-Power Theories** from **Performative Theories**.
  *   **The Overlap:** Both views typically require an external act to exercise the power or perform the speech act. They will agree on almost all nine cases (e.g., intoxication negates both the power and the performance; deception vitiates both).
  *   **The Difference:** The difference is ontological (what consent *is*), not practical (what consent *does*). A Normative-Power theorist sees consent as changing rights; a Performative theorist sees it as changing obligations via communication.
  *   **The Tenth Question:** To separate these, you would need a case involving **silent authority**. *Example:* "A manager silently allows an employee to use a company car for years without objection. Is this consent?" A Performative theorist might say no (no speech act); a Normative-Power theorist might say yes (power exercised via conduct).

  This quiz also struggles to separate **Moralized Theories** from **Deflationary Theories** in **Question 6** (Maiming).
  *   **The Overlap:** Both may conclude the act is impermissible.
  *   **The Difference:** The Moralized theorist says the *consent is invalid*. The Deflationary theorist might say the *consent is valid but irrelevant* because harm prohibitions override it.
  *   **The Tenth Question:** You would need to ask: "If the state bans the act, is it because the consent was void, or because the state overrides valid consent?" The former is Moralized; the latter is Deflationary (or Paternalist).

  ### Handling Mixed Profiles
  Most respondents will not fit one box perfectly.
  *   **If you split between Attitudinal and Performative:** You likely hold a **Hybrid View**. You require communication, but you allow evidence of internal states to correct communicative errors.
  *   **If you split between Moralized and Normative-Power:** You likely believe there are **Limits to Authority**. You think people have the power to consent, but that power does not extend to certain grave harms (a "jurisdictional" limit).
  *   **If you split between Hypothetical and Deflationary:** You likely view hypothetical consent as a **Legal Fiction** for Necessity. You don't believe the patient actually consented, but you use the language of consent to justify the necessity intervention.

  *Note: There is no "correct" score. The purpose of this quiz is to reveal where your intuitions cluster, not to grade your moral reasoning.*
