answer: |-
  # METAPHYSICS 202: THE VAGUENESS DECISION TREE

  **Instructions:** Do not look at the theory names at the end until you have answered the questions. Start at **Node 1**. Follow the arrows based on your intuitive commitment to the case described. If you find yourself saying "It depends," answer for the case *as described*.

  ---

  ### THE ROOT: The Sorites Series
  Imagine a row of 10,000 patches. Patch #1 is clearly red. Patch #10,000 is clearly orange. Each patch is imperceptibly different from its neighbor.
  *   **Premise 1:** Patch #1 is Red.
  *   **Premise 2:** If Patch #*n* is Red, Patch #*n+1* is Red.
  *   **Conclusion:** Patch #10,000 is Red.

  ### NODE 1: The Conclusion
  **Question:** Look at Patch #10,000 (the clear orange one). Is the statement "This patch is Red" **True**?
  *   **YES:** Go to **Leaf A**.
  *   **NO:** Go to **Node 2**.

  ### NODE 2: The Starting Point
  **Question:** Look at Patch #1 (the clear red one). Is the statement "This patch is Red" **True**?
  *   **NO:** Go to **Leaf B**.
  *   **YES:** Go to **Node 3**.

  ### NODE 3: The Step (Tolerance)
  **Question:** You accept #1 is Red and #10,000 is not. There must be a *first* non-red patch in the series. Is there a specific number *n* such that Patch *n* is Red and Patch *n+1* is **not** Red?
  *   **NO (No such pair exists):** Go to **Node 4**.
  *   **YES (Such a pair exists):** Go to **Node 5**.

  ### NODE 4: The Logic
  **Question:** If there is no specific pair where the change happens, yet the start is Red and the end is not, what has failed?
  *   **The Concept:** The word "Red" is logically inconsistent; no object can satisfy it. Go to **Leaf C**.
  *   **The Inference:** The logic (Modus Ponens or Transitivity) fails when applied to vague terms. Go to **Leaf D**.

  ### NODE 5: The Boundary (Metaphysics)
  **Question:** You believe there is a specific cutoff number *n*. Is there a **fact of the matter** about which number it is, independent of what humans think or say?
  *   **NO:** (There is no fact, only our usage). Go to **Node 6**.
  *   **YES:** (There is a fact, even if we can't see it). Go to **Node 7**.

  ### NODE 6: The Boundary (Semantics)
  **Question:** Consider a patch exactly in the middle (the borderline case). Is "This is Red" True, False, or Neither?
  *   **True or False (but it shifts):** In one context it's true, in another it's false. Go to **Leaf E**.
  *   **Neither:** It is genuinely indeterminate. Go to **Node 8**.

  ### NODE 7: The Boundary (Epistemology)
  **Question:** **The God Whisper Case:** If God whispered the exact cutoff number *n* into your ear, would He be telling the truth?
  *   **YES:** Go to **Leaf F**.
  *   **NO:** (It makes no sense even for God). *Return to Node 6.* (You do not believe there is a fact of the matter).

  ### NODE 8: The Structure of Indeterminacy
  **Question:** **The Degree Case:** Is the borderline patch "half-Red" (True to degree 0.5), or is it simply "without a truth value" (Gap)?
  *   **Degree (0 to 1):** Go to **Leaf G**.
  *   **Gap (True / False / Neither):** Go to **Node 9**.

  ### NODE 9: Higher-Order Vagueness
  **Question:** **The Borderline of Borderlines:** Is the boundary between "Red" and "Borderline" itself vague? (i.e., Is "borderline" a borderline predicate?)
  *   **YES:** Go to **Leaf G** (Note: You are treating degrees as the only way to model this).
  *   **NO:** (We can draw a sharp line around the vague zone). Go to **Leaf H**.

  ---

  ### THE LEAVES (Your Position)

  *   **Leaf A: Universalism.** Everything is Red. (The Sorites Conclusion is accepted).
  *   **Leaf B: Nihilism.** Nothing is Red. (The Sorites Starting Point is rejected).
  *   **Leaf C: Incoherentism.** The concept "Red" is inconsistent; it has no extension.
  *   **Leaf D: Non-Classical Logic.** Vague predicates break standard inference rules (e.g., Modus Ponens fails).
  *   **Leaf E: Contextualism.** Truth values are stable within a context but shift during a "forced march" to avoid contradiction.
  *   **Leaf F: Naive Realism.** There is a sharp cutoff, and it is knowable (or at least not inherently hidden).
  *   **Leaf G: Degree Theory.** Truth comes in degrees; "Red" is a function from objects to values between 0 and 1.
  *   **Leaf H: Supervaluationism.** Borderline cases lack a truth value (gaps), but logical truths remain valid across all "precisifications."
  *   **Leaf I: Epistemicism.** There is a sharp cutoff (Fact of the Matter), but it is inherently unknowable to humans. (Reached via Node 5 -> Node 7).

  ---

  ### MAP OF LOGICAL SPACE (Unoccupied Cells)

  You may find your answers point to a combination not listed above. Here is the status of those empty cells:

  1.  **Sharp Cutoff + No Fact of the Matter:** **Incoherent.** You cannot claim there is a specific number *n* where the change happens while simultaneously claiming there is no fact about which number it is.
  2.  **Gap + Knowable Boundary of the Gap:** **Unattractive.** If you claim there is a sharp line between "Red" and "Borderline," but "Borderline" is vague, you have merely pushed the vagueness back one step (Higher-Order Vagueness). If you deny Higher-Order Vagueness, you are effectively a Supervaluationist (Leaf H).
  3.  **Degree Theory + Classical Bivalence:** **Incoherent.** If truth comes in degrees, the principle "Every sentence is either True or False" is false. You must adopt a many-valued logic.
  4.  **Naive Realism + Ignorance:** **Unexplored.** The view that there is a cutoff, we don't know it, but *could* know it with better instruments. Most reject this because vagueness seems semantic/conceptual, not empirical.

  ---

  ### THE HONESTY BOX (Indistinguishable Pairs)

  This tree cannot separate the following positions based on your answers alone. If you land here, you must do further reading to distinguish your view.

  **1. Epistemicism (Leaf I) vs. Naive Realism (Leaf F)**
  *   **The Problem:** Metaphysically, these views are identical (both assert sharp boundaries). They differ only on human cognitive access.
  *   **The Blind Spot:** If you answered "YES" to Node 7 (God Whisper), you are a Realist. Whether you are an *Epistemicist* depends on whether you think the ignorance is *permanent* (Epistemicism) or *contingent* (Naive). The tree groups these because the metaphysical commitment is the same.

  **2. Supervaluationism (Leaf H) vs. Degree Theory (Leaf G)**
  *   **The Problem:** Both reject sharp boundaries and classical bivalence for borderline cases.
  *   **The Blind Spot:** At Node 9, if you answer "YES" (Higher-Order Vagueness exists), Supervaluationists often have to adopt complex machinery that looks suspiciously like Degree Theory to explain it. If your primary commitment is "No sharp lines" and "Logic mostly works," you may oscillate between these two. The tree forces a choice at Node 8 (Gap vs. Degree), but in practice, these theories often offer similar advice on how to reason.

  **3. Contextualism (Leaf E) vs. Epistemicism (Leaf I)**
  *   **The Problem:** In a "Forced March" (asking about patches one by one), the Epistemicist says your *judgment* shifts (psychological noise), while the Contextualist says the *meaning* shifts (semantic shift).
  *   **The Blind Spot:** Phenomenologically, these feel the same. If you feel the standard moving, you might be describing the psychological mechanism Epistemicism relies on, or the semantic mechanism Contextualism relies on. The tree separates them at Node 6, but your introspection may not be fine-grained enough to tell the difference.

  ---

  **Instructor Note:** If you end up at **Leaf D (Non-Classical Logic)**, be prepared to defend why Modus Ponens should fail. If you end up at **Leaf I (Epistemicism)**, be prepared to explain *why* the cutoff is unknowable without appealing to magic. If you end up at **Leaf H (Supervaluationism)**, be prepared to explain why "This is Red or This is Not Red" is True even when neither disjunct is True.
