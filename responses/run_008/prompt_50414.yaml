          *   Yes -> Epistemicism (or Naive).
          *   No -> Go to Semantic/Logic branch.
      *   *Q3 (Semantic):* In a borderline case, is the sentence "This is a heap" strictly True or False?
          *   Yes (but context dependent) -> Contextualism.
