prompt: |-
  I teach a second-year metaphysics course, and every year the unit on vagueness goes the same way: students choose whichever label sounds least ridiculous — sharp boundaries they can't find, truth to degree 0.62, the word "supervaluation" — and then defend the label rather than the commitments. For next year I want a decision-tree handout that starts from the sorites argument itself and forces them through cases before any position is named.

  The tree should begin at the argument, not at a question about words: a clear case of a heap, the premise that removing a single grain never turns a heap into a non-heap, the downward march to one grain. The first branching should be over which limb the student abandons — the major premise, the starting point, the inference pattern, or the falsity of the conclusion — and every subsequent node should be a concrete case or question they can answer without knowing where it leads. Please build in, at minimum, the following diagnostics: whether a student accepts that some single removal makes a difference even if no possible evidence could tell them which one (the "God whispers the cutoff number" case); what to say about a borderline case when asked point-blank whether "that is a heap" is true, false, both, neither, or true only to a degree; whether the felt moment of flipping from "heap" to "no heap" during a forced march through the series reflects a shifting standard, a genuinely defective concept, or mere psychological noise; and whether "borderline" is itself a borderline predicate, and whether that embarrasses them.

  The leaves must include epistemicism, supervaluationism, a degree-theoretic treatment, contextualism about shifting standards, the nihilist conclusion that nothing is a heap, and an incoherentist option on which the concept is simply inconsistent, plus any unnamed cells the logical space requires — and please say for each unoccupied combination whether nobody holds it because it is incoherent, unattractive, or merely unexplored. Finally, flag honestly which pairs of leaves the tree cannot actually separate: if a student's answers to all the diagnostic questions leave supervaluationism and degree theory indistinguishable, or epistemicism and the naive view that some step must matter "because logic," say so rather than inventing a question that decides it. Ten to twelve leaves is about the most the handout can carry.
reasoning: |-
  Here's a thinking process that leads to the suggested decision tree handout:

  1.  **Analyze the Request:**
      *   **Target Audience:** Second-year metaphysics students.
      *   **Problem:** Students pick labels (Epistemicism, Supervaluationism, etc.) based on sound rather than commitment, then defend the label.
      *   **Goal:** A decision-tree handout that starts from the *Sorites Argument* itself, not from theory names.
      *   **Structure:**
          *   Start: The Sorites Argument (Clear heap + Tolerance Premise + Induction -> Absurd Conclusion).
          *   First Branch: Which limb to abandon (Major Premise, Starting Point, Inference, Conclusion).
          *   Subsequent Nodes: Concrete cases/questions (no theory jargon).
          *   Required Diagnostics:
              *   "God whispers the cutoff" (Sharp boundary without knowability).
              *   Truth value of borderline cases (T/F/Both/Neither/Degree).
              *   Forced March experience (Shifting standard/Defective concept/Psych noise).
              *   Higher-order vagueness (Is "borderline" borderline?).
          *   Leaves (Outcomes): Epistemicism, Supervaluationism, Degree Theory, Contextualism, Nihilism, Incoherentism, + logical space fillers.
          *   Constraint: 10-12 leaves max.
          *   Honesty Clause: Flag where the tree *cannot* distinguish between theories (e.g., Supervaluationism vs. Degree Theory on certain answers, or Epistemicism vs. Naive Sharpness).
          *   Logical Space Analysis: Note if certain combinations are incoherent, unattractive, or unexplored.

  2.  **Deconstruct the Sorites Argument:**
      *   P1: $n$ grains is a heap (Clear case).
      *   P2: If $n$ grains is a heap, $n-1$ grains is a heap (Tolerance/Inductive Step).
      *   C: 1 grain is a heap (Absurd).
      *   *Standard Move:* Deny C (1 grain is not a heap). This forces a denial of P1 or P2 or the logic connecting them.

  3.  **Drafting the Branches (Iterative Process):**

      *   *Root:* The Sorites Paradox.
      *   *Branch 1 (The Logical Limb):* Where does it break?
          *   Option A: The Conclusion is True (Nihilism/Universalism).
          *   Option B: The Starting Point is False (Nihilism/Error Theory).
          *   Option C: The Inductive Step (Tolerance) is False (Sharp Boundaries).
          *   Option D: The Logic/Inference is Invalid (Non-classical logic).

      *   *Refining Branch 1:* Let's stick closer to the prompt's request: "Major premise, starting point, inference pattern, or falsity of the conclusion."
          *   Actually, usually, we accept the Conclusion is *False* (1 grain is not a heap). So the real fight is *why* the argument fails.
          *   Let's structure it by *commitment* rather than just "which premise you deny."
          *   *Revised Root:* You agree 10,000 grains is a heap. You agree 1 grain is *not* a heap. The argument says you can't hold both without accepting the Tolerance Principle.
          *   *Node 1:* How do you block the slide from 10,000 to 1?
              *   Path 1: There is a specific cut-off point (Sharp Boundary).
              *   Path 2: There is no specific cut-off point (No Sharp Boundary).
              *   Path 3: The concept "heap" doesn't apply to anything (Nihilism).
              *   Path 4: The logic of "if...then" or "and" breaks down (Non-classical).

      *   *Developing Path 1 (Sharp Boundary):*
          *   Question: Can you know where the cut-off is?
          *   Yes -> Naive Realism (Rare/Unattractive).
          *   No -> Epistemicism.
          *   Diagnostic: "God whispers the cutoff." If you say "Yes, there is a number, but we can't know it," you are an Epistemicist.

      *   *Developing Path 2 (No Sharp Boundary):*
          *   Question: What is the truth value of "This is a heap" for a borderline case?
          *   Option A: It's neither True nor False (Gap). -> Supervaluationism (usually).
          *   Option B: It's True to a degree (0.5). -> Degree Theory.
          *   Option C: It depends on context/conversation. -> Contextualism.
          *   Diagnostic: "Forced March." Does your standard shift?
          *   Diagnostic: "Higher Order." Is "borderline" vague?

      *   *Developing Path 3 (Nihilism):*
          *   "Heap" is inconsistent. Nothing is a heap.
          *   Leaf: Nihilism / Error Theory.

      *   *Developing Path 4 (Logic/Incoherence):*
          *   Logic fails (Many-valued logic without degrees? Substructural?).
          *   Concept is inconsistent (Incoherentism).

  4.  **Mapping the Diagnostics to the Tree:**

      *   *God Whispers:* Distinguishes Epistemicism from Naive Sharpness.
      *   *Borderline Truth Value:* Distinguishes Supervaluationism (Gap) from Degree Theory (Degrees) from Contextualism (Variable).
      *   *Forced March:* Distinguishes Contextualism (Shifting) from others.
      *   *Higher-Order Vagueness:* Crucial for Supervaluationism (often struggles here) vs. Degree Theory (handles it smoothly) vs. Epistemicism (it's just ignorance all the way up).

  5.  **Addressing the "Unoccupied/Incoherent" Constraint:**
      *   *Naive Sharpness:* Someone who thinks there's a cutoff *and* we can know it. (Unattractive/Empirically false).
      *   *Gap + Knowable Cutoff:* Incoherent.
      *   *Degree + Sharp Cutoff:* Incoherent (unless degrees snap to 0/1, which is just Epistemicism).
      *   *Nihilism + Tolerance:* If nothing is a heap, tolerance is vacuously true? Need to be careful.

