      *   *Q4 (Indeterminacy):* Is "indeterminate" a precise state or a matter of degree?
          *   Degree -> Degree Theory.
          *   Precise Gap -> Supervaluationism.
      *   *Q5 (Higher Order):* Is the boundary of the "indeterminate" zone itself vague?
          *   Yes -> (Refines Degree/Supervaluation).
          *   No -> (Refines Supervaluation).

      *Wait, I need to ensure the "Leaves" match the requested theories.*
