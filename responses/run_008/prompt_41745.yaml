      *   *Check:* Did I answer the biomarker question? *Correction:* Be explicit. Biomarkers settle etiology, not normativity.
      *   *Check:* Is the distinction between "Semantic" and "Normative" clear? *Correction:* Use the "Is/Ought" framework but applied to medical concepts (Boorse vs. Normativists).
      *   *Key Insight to Add:* The debate recurs because the *stakes* recur. Every time the DSM expands, the boundary of state power expands. The debate is a proxy war for liberty vs. care.

  8.  **Final Polish:** Ensure the voice sounds like a senior scholar talking to a grad student. (e.g., "You have put your finger on the pulse," "Here is where I diverge," "Let me be blunt.")

  **(Self-Correction Note):** I need to make sure I don't just say "You're right." I need to add value. The user says they equivocate. I should argue that the *concept itself* invites equivocation. It's a "essentially contested concept" (Gallie). That's a stronger philosophical diagnosis.

  9.  **Final Plan:**
      *   Validate the "bundled disputes" hypothesis.
      *   Upgrade it to "Essentially Contested Concept."
      *   Explain why biomarkers fail (Naturalistic Fallacy in reverse).
      *   Define progress as "decoupling" rather than "solving."

