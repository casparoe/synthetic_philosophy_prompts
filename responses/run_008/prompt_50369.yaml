      *   **Situation:** Mother on ventilator for 14 months. Requires *manual* squeezing of a bellows every few seconds. If squeezing stops, she dies in a minute. Ethics committee says futile.
      *   **Core Conflict:** Is stopping the squeezing an act of killing (doing) or allowing to die (allowing)?
      *   **Requirements:** Engage with arguments (no talking past each other), no strawmen, realize the deeper disagreement is about the moral weight of the distinction itself.

  2.  **Deconstruct the Philosophical/Medical Conflict:**
      *   *The Mechanism:* This is crucial. It's not a machine that can be turned off. It's human labor. Every squeeze is an intervention. Stopping is a cessation of labor.
      *   *The Philosopher's Angle:* Continuous intervention creates a new causal chain. Interrupting that chain is an act. The baseline is "alive with help." Removing help actively changes the state.
      *   *The Doctor's Angle:* The underlying pathology is fatal. The squeezing is an artificial barrier. Removing the barrier isn't causing death; the disease is. Intent and outcome matter more than the metaphysics of motion.
      *   *The Convergence:* Both care about the mother. Both are suffering. The philosophical debate is a proxy for grief and guilt.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the scene. The sound of the bellows. The exhaustion.
      *   **Round 1: The Core Disagreement.**
          *   Philosopher: Stopping is an act. You are choosing to end the flow of air.
          *   Doctor: Stopping is ceasing to fight the inevitable. The disease kills, not the lack of air.
      *   **Round 2: Digging Deeper (The "Superstition" Claim).**
          *   Doctor: Why does physics matter more than outcome? Dead is dead.
          *   Philosopher: It matters for moral agency. Guilt. Responsibility.
      *   **Round 3: The Personal Stake.**
          *   Doctor: I've been doing the work. I know the cost.
          *   Philosopher: I know the theory, but you know the practice.
      *   **Round 4: The Realization.**
          *   They realize they agree on the *outcome* (it's time) but disagree on the *label* (killing vs. letting die).
          *   They question if the label actually changes the morality.
      *   **Ending:** Ambiguous but reconciled. A shared decision.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Make sure the Philosopher doesn't sound like they want the mother to suffer. They are worried about the *moral status* of the sibling.
      *   *Critique:* Make sure the Doctor doesn't sound cold. She's exhausted. Her consequentialism is born of triage and reality, not just theory.
      *   *Specific Detail:* The bellows. It needs to be visceral. *Squeak. Hiss. Squeak. Hiss.*
      *   *The "Doing/Allowing" Nuance:* The Philosopher needs to admit the distinction is shaky (as per prompt). The Doctor needs to admit why she cares about the distinction (legal/professional norms) even if she thinks it's nonsense.

  5.  **Drafting the Dialogue (Iterative Process):**

      *   *Scene:* The rhythm of the bagging needs to be present.
      *   *Philosopher's opening:* Focus on the causal chain. "We are the cause of breath."
      *   *Doctor's rebuttal:* "We are the obstacle to death."
      *   *Key moment:* The Philosopher admits the distinction might not hold moral weight. The Doctor admits she uses it for protection.
      *   *Climax:* The shared exhaustion. The realization that the debate is about who carries the guilt.

  6.  **Polishing:**
