answer: |-
  The rhythm was the only thing keeping time in the room. *Squeak. Hiss. Squeak. Hiss.*

  My sister's arms were trembling. She was sitting on the stool beside the bed, her gloved hands encasing the self-inflating bag valve. Every three seconds, she compressed the bellows. Every three seconds, our mother's chest rose. If she stopped, the chest would not fall again.

  It had been fourteen months. The ethics committee had called it "medically inappropriate" three weeks ago. I was the one who had brought the paperwork, but I was the one hesitating now.

  "You're gripping the bag too hard," I said softly.

  Sarah didn't look up. "If I grip it soft, the seal leaks. If I grip it soft, she doesn't get the tidal volume."

  *Hiss.*

  "Sarah," I said. "If you put the bag down... you are intervening in a causal chain that is currently sustaining life. You are introducing a new variable: zero pressure."

  Sarah's eyes flicked to me, red-rimmed and hard. "Here we go. The ontology of the squeeze."

  "I'm serious. We aren't turning off a machine. There is no switch. There is only your labor. Your labor is the engine. Stopping the engine isn't 'letting it fail.' It's removing the force that opposes gravity and pathology."

  "Phil," she said, her voice flat. "Mom has end-stage pulmonary fibrosis complicated by irreversible brainstem injury. Her lungs are stone. Her brain forgot how to tell them to move. The disease is the engine. My hands are just a temporary dam holding back a flood that broke fourteen months ago."

  *Hiss.*

  "But the dam is active," I insisted, stepping closer to the bed. "In standard life-support cases, the machine does the work. You turn a dial. The cessation is passive. Here, the *status quo* is active intervention. Every breath she takes for the last year is something we *did* to her. To stop is to choose the end of that doing. That makes it a killing, not a letting die."

  Sarah stopped squeezing.

  The silence rushed in, heavy and sudden. Our mother's chest stayed still.

  "Watch," Sarah said.

  "Sarah, don't—"

  "Watch the color. Watch the monitor."

  She didn't let go of the bag. She just held it still. "I am not killing her right now. I am standing still. The hypoxia is doing the work. The fibrosis is doing the work. If I were poisoning her, that would be a doing. If I were smothering her, that would be a doing. But I am just... not being a god anymore."

  "She dies in sixty seconds if you don't move," I said, my voice tight. "You know the timeline. You have the power to prevent the death. Withholding the prevention when you have the capacity to act is morally equivalent to the act itself in this specific context. The distinction collapses when the 'allowing' requires continuous, conscious effort."

  Sarah started squeezing again. *Squeak. Hiss.* The color returned to the monitor's waveform. She let out a breath she'd been holding.

  "You think I don't know the literature?" she asked. "I read the papers you sent. I know the Doctrine of Doing and Allowing. I know you think the causal proximity matters."

  "It does matter. It matters for *you*."

  "Why? Because I need to feel clean?" She looked at me, and for the first time, the exhaustion broke through the physician's armor. "Phil, I'm a consequentialist. I triage in the ER. I decide who gets the last ICU bed based on who has the highest probability of survival. If I pull a plug on a brain-dead patient to give their lungs to a trauma victim, the outcome is one life saved versus one body buried. Whether I pulled the plug or unplugged the tube or stopped squeezing the bag... the math is identical. One person is dead. One person is alive."

  "The math isn't the only thing that exists," I said. "Moral agency exists. How we arrive at the outcome defines who we are. If I push a fat man off a bridge to stop a trolley, five people live. If I pull a switch to divert the trolley, five people live. Consequentially identical. Morally distinct. One uses the man as a means. The other alters the path."

  "Superstition," she snapped. "That's the trolley problem. This is a bed. This is Mom."

  "It's the same structure! If the distinction is real, then stopping your hands makes you an agent of death. If the distinction is nonsense, then you're just a witness to a disease process."

  Sarah adjusted her grip. *Squeak.* "Okay. Let's grant you the distinction. Let's say you're right. Let's say stopping my hands is a 'doing.' Let's say it's killing."

  I blinked. "I... I don't want to say it's murder. I'm saying it's an act."

  "An act that ends suffering," she said. "An act that ends fourteen months of me sitting on this stool until my tendons scream. An act that respects the ethics committee's ruling that this is futile."

  "Futility is a medical judgment, not a moral one."

  "It's a moral one because resources are finite and dignity is finite!" She leaned forward, the bag compressing harder than necessary. "Phil, you're defending the distinction because you're afraid of the guilt. You think if we categorize this as 'allowing,' you can walk away clean. You think if it's 'doing,' you're complicit."

  "And you?" I countered. "You reject the distinction because you want to be able to stop without feeling like you murdered her. You're a consequentialist because it lets you sleep at night. You tell yourself the outcome justifies the means, so the means don't need to be examined."

  She went quiet. The *hiss* of the bag seemed louder.

  "Maybe," she admitted. "Maybe I am. But look at the alternative. If we accept your view—that stopping is a 'doing'—what changes? Does it make it wrong? Does it make it right?"

  "That's the question," I said. "If it's a doing, it requires higher justification. It requires us to accept that we are ending a life, not just stepping aside. It demands more of us."

  "Or it demands nothing of us because the result is the same," she said. "I've been squeezing this bag for fourteen months. Do you know what that feels like? It feels like I'm keeping her in a purgatory. Every squeeze is a decision to keep her here, in this broken body. Every squeeze is a 'doing.' Every single breath I give her is an intervention."

  She looked at our mother's face. It was gaunt, the skin translucent.

  "If every breath is a doing," Sarah continued, "then stopping is just stopping the doing. Why is the last non-squeeze different from the first three hundred thousand non-squeezes I didn't have to do before she got sick?"

  "Because the baseline shifted," I said, though my voice lacked its earlier conviction. "The baseline is now 'ventilated.' To return to 'unventilated' is an active reversal."

  "The baseline is 'human,' Phil. Humans don't breathe via bellows." She stopped again. Just for five seconds. *Five... four... three...* She squeezed. "I'm tired of the metaphysics. I'm tired of worrying about whether my hands are 'agents' or 'obstacles.' I care about whether she is in pain. The monitors say she isn't. I care about whether there is hope. The scans say there isn't."

  I looked at my sister. I saw the tremor in her deltoids. I saw the way she held her breath before each squeeze, bracing for the resistance.

  "Sarah," I said. "If we stop... and I believe it's a 'doing'..."

  "Then you think I'm killing her."

  "I think... I think I would have to carry the weight of an action, not just an omission."

  "And if you carry that weight," she said, "does it change the outcome? Does she come back?"

  "No."

  "Does it make her suffering less real?"

  "No."

  "Then the distinction has no moral weight," she said. "It's just emotional bookkeeping. It's about how we label the guilt, not whether the guilt is warranted."

  I looked at the bellows. It was a simple piece of plastic. It had no morality. It only had physics.

  "Maybe," I said. "Maybe the distinction doesn't change the *rightness* of the act. Maybe it only changes the *agent*."

  "How?"

  "If it's an allowing, the disease is the killer. If it's a doing, we are the killers. Even if killing is justified... it's a heavier thing to be."

  Sarah nodded slowly. She reached out with her left hand and covered my hand, which was resting on the bedrail. Her right hand kept squeezing. *Squeak. Hiss.*

  "I've been the killer for fourteen months, Phil," she whispered. "Every time I squeezed, I chose to bring her back from the edge. I owned that. I own the stopping too. I don't need the 'allowing' distinction to protect me. I just need you to know that I'm not afraid of the label."

  I looked at her. I realized then that my defense of the distinction wasn't about protecting the truth. It was about protecting *her*. I wanted there to be a category where she didn't have to be the one who ended it. I wanted the universe to absolve her through semantics.

  But she didn't want absolution. She wanted resolution.

  "You're not doing it alone," I said.

  Sarah stopped squeezing.

  This time, she didn't start again.

  She placed the bag on the mattress. She took our mother's hand in hers. I took the other.

  "The air is gone," Sarah said. "The disease is taking over."

  "We are allowing it," I said.

  "We are allowing it," she agreed.

  We stood there as the monitor's rhythm slowed. The numbers dropped. The silence returned, but it wasn't heavy anymore. It was just silence.

  "Phil?"

  "Yeah?"

  "If we ever write a paper on this," she said, her voice cracking, "don't call it a doing."

  "I won't," I said. "I'll call it mercy."

  "Close enough."

  We stood together until the line went flat, neither of us sure if we had acted or waited, but both of us sure that we were there.
