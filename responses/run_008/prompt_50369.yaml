      *   Check the medical accuracy (manual ventilation for 14 months is extreme, almost unprecedented, but that's the prompt's premise—treat it as the reality).
      *   Ensure the "consequentialist" label shines through without being a buzzword dump.
      *   Ensure the "philosophy lecturer" sounds like someone who teaches this but is struggling to apply it to family.

  7.  **Final Review against Prompt:**
      *   ICU Physician sister? Yes.
      *   Philosophy Lecturer narrator? Yes.
      *   Consequentialist vs. DAD defender? Yes.
      *   Manual bellows specific? Yes.
