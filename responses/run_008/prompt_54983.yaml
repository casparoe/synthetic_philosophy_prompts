  I work part-time as an animal care tech at my uni's research facility, and I'm taking a philosophy of mind course this semester, so naturally my supervisor dumped a weird job on me: she wants a short proposal for which invertebrate species in our colony get the full welfare protocol (anesthesia for any procedures, enrichment, humane-killing rules with sign-off) versus which just get basic husbandry. Right now everything that isn't a mouse is treated the same, and the vet wants a principled cutoff instead of vibes.

