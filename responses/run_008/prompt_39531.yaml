  ### Structural Brainstorming & Philosophical Sketch

  **The End-Words (The Terms of the Series):**
  To mirror the conditionally convergent series of the Pasadena game, I have selected six words that function as the invariant "terms" of the poem. Like the terms $\frac{(-1)^{n-1}}{n}$, they remain lexically identical but change value based on their position (context) in the stanza.
  1.  **face** (The outcome: heads/tails)
  2.  **sign** (The valuation: positive/negative)
  3.  **step** (The iteration: $n$-th toss)
  4.  **order** (The arrangement: sequence of summation)
  5.  **sum** (The aggregate: total expected value)
  6.  **worth** (The decision: price of entry)

  **The Sestina Permutation as Riemann Rearrangement:**
  The standard sestina permutation (*retrogradatio cruciata*) ensures that every word occupies every position exactly once across the six stanzas. This structurally enacts the Riemann rearrangement theorem: the same elements (words), rearranged by a fixed rule (the form), produce different semantic "sums" (stanza meanings).

  **Stanza-by-Stanza Semantic Drift (The "Running Total"):**
  *   **Stanza 1 (1-2-3-4-5-6):** *face, sign, step, order, sum, worth.*
      *   *Drift:* Stable. Establishes the natural order of the game. The "sum" feels convergent, the "worth" calculable.
  *   **Stanza 2 (6-1-5-2-4-3):** *worth, face, sum, sign, order, step.*
      *   *Drift:* Displaced. "Worth" leads prematurely. "Step" ends unfinished. The logic begins to decouple from the physical toss.
  *   **Stanza 3 (3-6-4-1-2-5):** *step, worth, order, face, sign, sum.*
      *   *Drift:* Oscillating. "Sum" is delayed until the end. The "sign" fluctuates near the close, suggesting instability.
  *   **Stanza 4 (5-3-2-6-1-4):** *sum, step, sign, worth, face, order.*
      *   *Drift:* Divergent. Starts with "Sum" but ends with "Order," implying the total is dictated by arrangement, not outcome.
  *   **Stanza 5 (4-5-1-3-6-2):** *order, sum, face, step, worth, sign.*
      *   *Drift:* Arbitrary. "Sign" ends the stanza—ambiguity dominates. The "worth" is buried mid-line.
  *   **Stanza 6 (2-4-6-5-3-1):** *sign, order, worth, sum, step, face.*
      *   *Drift:* Collapse. Ends on "face," but the "sign" has already corrupted it. The coin lands, but the value is gone.

