  ok so in maths we did expected value and I get it for normal bets, but I've been going through wierd bets and I can't work out what rule I'm actually following, my gut calls all feel right but they don't seem to fit together. here they are. If you flip a coin until it lands heads and pay me £2 for every flip it took (£2 if heads comes up straight away, £4 if it's the second flip, £8 for the third, doubling forever), the expected value is apparently infinite, but I wouldn't pay more than a tenner to play, maybe £20 at a push. If someone sells me a ticket for £1 with a one in 10^30 chance of paying out 10^32 pounds, that's an expected value of like £100, and I still wouldn't touch it. My mate offers 50p a round on heads he gives me a fiver, tails I give him four quid — I'm in all evening. But if he offers heads £20,000 tails I pay him £15,000, no chance, even though that's plus £2,500 in expectation, because I cannot actually absorb losing £15,000. And the one that really bugs me: a game where with probability a half I win £1, with probability a quarter I lose £2, with probability an eighth I win about £2.67, with probability a sixteenth I lose £4, and so on forever, halving the chance and alternating win/lose with the size growing, so the expected contributions go 1 − 1/2 + 1/3 − 1/4 + ..., which supposedly adds up to about 0.69, except my teacher said you can reshuffle a series like that to make it add up to whatever you want. My gut says that game is worth nothing, and also that I wouldn't pay anything to get OUT of playing it. But if you take only the winning rounds of that game and delete the losing ones, I'd happily pay to play that, and I'd pay to avoid the losing-rounds-only version. And those two are literally just the original game stacked back together, which I said was worth nothing. So I'm contradicting myself somewhere and I can't see where.

  my tentative rule is that I don't value money in a straight line — £20,000 isn't that much better than £15,000 for me, and there's basically a cap on how good any amount of money can be for me, so no payoff, however big, is more than some fixed amount of good. Does that rule rescue all my verdicts or do I have to throw one out, and if so which? And what does it say about a case I haven't listed: same infinite-flip game but you can't collect until the flipping's done, and the flipping's expected to take so long I'd be long dead before it finishes — does your rule say that's worth loads, or the same as the normal one, or nothing, and why doesn't that answer feel obviously right to me?
