answer: |-
  Here is the diagnosis: **This is a verbal dispute rooted in a category error about the theoretical role of 'pleasure'.**

  You are correct in your hunch, but we need to sharpen it. It is not merely that you are using words differently; it is that the Phenomenalist is treating 'pleasure' as a **natural kind** (like 'water' or 'red'), while the Attitudinalist is treating it as a **functional/normative kind** (like 'tool' or 'valuable'). The Disjunctivist is the only one seeing the crack in the foundation, but they treat it as a bullet to bite rather than a signal to rebuild.

  The impasse persists because the Phenomenalist believes they are reporting on a *discovery* (introspecting a glow), whereas they are actually making a *theoretical commitment* (stipulating that value must be felt). Because they think they are arguing about facts of experience, they talk past the Attitudinalist, who is arguing about the structure of valuation.

  ### The Argument Against the "Hidden Empirical Question"

  The strongest rival to my diagnosis is the Phenomenalist's claim: that there is a **hidden empirical question** that introspection could settle. They insist that if you attend carefully enough, you *will* find the common "glow." This is the view that keeps the argument alive, because it suggests the dispute is factual, not conceptual. If there is a glow, the Phenomenalist wins. If there isn't, the Attitudinalist wins.

  This is false. The "Thirst Case" you mentioned destroys the empirical claim. When you drink water while parched, the sensation is pleasant. When you drink the same water while sated, the sensation is neutral or even cloying. The sensory input (the taste, the temperature, the texture) remains constant. The *pleasantness* varies.

  If pleasantness were a phenomenological quality intrinsic to the sensation (the "glow"), it would have to travel with the sensation. It does not. Therefore, pleasantness cannot be a simple sensory property. The Phenomenalist's insistence that it *is* a sensory property is not a report of data; it is a refusal to accept the data. They are conflating the *object* of the experience (the taste) with the *valuation* of the experience (the relief).

  The Masochism case reinforces this. In masochism, the subject enjoys pain. The Phenomenalist must argue either that the pain sensation itself changes its qualitative character (which is implausible; a slap hurts regardless of context) or that there is a second, distinct "pleasure sensation" riding alongside the pain. This leads to an absurd proliferation of invisible feelings. The Attitudinalist explains this effortlessly: the sensation is painful, but the *attitude* toward the sensation is one of enjoyment.

  The fact that these cases push so decisively toward the Attitudinal view, yet the Phenomenalist remains unconvinced, proves this is not an empirical disagreement. You cannot introspect your way out of a category error. The Phenomenalist isn't failing to see the glow; they are insisting that 'pleasure' *must* mean 'sensation' for their theory to work. They are defending a definition, not a datum.

  ### Why the Disjunctivist is Half-Right but Defeated

  The third member of your group, the Disjunctivist, sees that the "glow" is missing. They are right that there is no single phenomenological thread. However, by saying hedonists should "bite the bullet" and accept a list of pleasant-making properties, they are effectively abandoning hedonism.

  Hedonism's selling point is its unity: *one* thing (pleasure) makes *all* good things good. If you reduce pleasure to a disjunctive list (the taste of water OR the feeling of solving a proof OR the attitude of enjoyment), you no longer have a unified theory of value. You have a "List Theory" with a historical name. The Disjunctivist saves the theory from falsification by draining it of its explanatory power. They are correct that there is no common *feeling*, but wrong to think this is a survivable blow to classical hedonism. It forces a transformation into Attitudinal Hedonism.

  ### What Follows: The Prescription

  So, what should your reading group do? Stop trying to solve the heterogeneity problem as if it were a puzzle about the mind. It is a puzzle about **conceptual engineering**.

  1.  **Acknowledge the Stipulation:** You must explicitly agree that 'pleasure' in the context of well-being theory is not a pre-theoretical sensation waiting to be found. It is a technical term for "that which constitutes well-being." Once you admit this, the Phenomenalist's claim ("I feel a glow") becomes irrelevant. The question is no longer "What does pleasure feel like?" but "What theoretical role does 'pleasure' need to play to make this theory work?"
  2.  **Adopt the Attitudinal Framework:** The group should collectively migrate to **Attitudinal Hedonism**. This view preserves the core hedonist intuition (well-being is about how things feel *to the subject*) without lying about phenomenology. It accounts for the Thirst Case (attitude changes, sensation doesn't) and Masochism (attitude toward pain is positive).
  3.  **Reinterpret Mill:** Your group is confused by Mill's "competent judges." Stop treating it as an analysis of quality. Treat it as a stability test for attitudes. A "higher" pleasure is one that a competent judge would maintain a positive attitude toward even when aware of the "lower" alternative. This isn't about a special *feeling* of dignity; it's about the robustness of the *preference*.
  4.  **Change the Question:** Next meeting, ban the phrase "What does it feel like?" Replace it with "What makes this state count as good *for the subject*?" If the Phenomenalist says "The glow," ask: "If the glow were present but the subject hated it (e.g., via neural manipulation), would it still be good for them?" If they say no, they have conceded that the glow isn't the value-maker. If they say yes, they have severed well-being from the subject's perspective entirely.

  ### Conclusion

  The argument never resolves because you are trying to find a factual answer to a definitional problem. The Phenomenalist is fighting for the *name* 'pleasure' to remain tied to sensation. The Attitudinalist is fighting for the *theory* to remain viable.

  There is no hidden empirical fact to discover. Introspection will not save you. The progress you are looking for comes from admitting that 'pleasure' is doing too much work. Drop the requirement that it be a sensation. Embrace the Attitudinal view not because it describes the "true" nature of pleasure, but because it is the only version of hedonism that survives contact with the actual texture of human experience. The dispute is verbal, but the consequence is substantive: you must choose between a false phenomenology and a viable theory of value. Choose the theory.
