answer: |-
  You are running a deontological operating system on consequentialist hardware. Your introduction speaks the language of expected value, thresholds, and marginal impact (the hardware), but your verdicts are driven by duties, norms, membership, and integrity (the OS). This is not necessarily a bug; it is how most humans navigate high-stakes coordination problems. However, it generates the friction you are feeling.

  To make your verdicts hang together, we must abandon the hope that a single metric of "harm" explains them. Instead, I propose a dual-track principle that distinguishes between **Cooperative Schemes** (where your duty is compliance) and **Harmful Practices** (where your duty is non-participation).

  ### The Principle: Constitutive Participation vs. Cooperative Compliance

  **Clause 1 (Cooperative Compliance):** In contexts where a public good depends on universal or near-universal adherence to a rule (voting, drought bans), the moral obligation is to **comply with the coordinating norm**, regardless of your marginal causal impact. Defection is wrong because it is freeloading or undermines the schema, not because it causes direct harm.

  **Clause 2 (Constitutive Participation):** In contexts where a market or practice relies on the aggregation of individual choices to produce harm (factory farming, labor exploitation), the moral obligation is to **avoid constituting the harm**. You are responsible for the *nature* of your participation, not just the *outcome*.
  *   **Sub-clause 2a (Fungibility):** If the harm is an *external byproduct* (carbon) that is physically fungible, it can be offset. If the harm is *constitutive of the product* (animal death), it cannot be offset; the act itself is tainted.

  **Clause 3 (Expressive Solidarity):** In contexts of boycott or social sanction, participation is obligatory not because of threshold impact, but because abstention signals complicity with the oppressor. The act is a badge of membership in the moral community.

  ---

  ### Application to Your Cases

  **1. The Burrito (Verdict: Wrong)**
  *   **Track:** Constitutive Participation (Clause 2).
  *   **Analysis:** The death of the chicken is not a side effect; it is the *cost of goods sold*. You cannot separate the meal from the killing.
  *   **Why Offsets Fail:** Donating to charity prevents *future* deaths (Beneficence); it does not neutralize *this* death (Justice). You are still directly participating in the practice of killing.

  **2. The Flight (Verdict: Permissible + Offset)**
  *   **Track:** Constitutive Participation (Clause 2a).
  *   **Analysis:** Carbon is an external byproduct, not the product itself. It is physically fungible (a tonne removed equals a tonne emitted).
  *   **Why Offsets Work:** You can render the net physical effect neutral. Once neutralized, the high personal value of the vacation outweighs the residual social cost.

  **3. The Safe-State Vote (Verdict: Obligatory)**
  *   **Track:** Cooperative Compliance (Clause 1).
  *   **Analysis:** Democracy is a cooperative scheme. If everyone reasoned "my vote counts for zero," the system collapses. Your obligation is to uphold the *norm of turnout*, not to determine the *outcome*.
  *   **Why Pivotality Doesn't Matter:** You are paying a "civic tax" to remain a member in good standing of the polity.

  **4. The Swing-State Donation (Verdict: Optional)**
  *   **Track:** Beneficence (Outside both Clauses).
  *   **Analysis:** This is not a duty of membership (like voting) nor a duty of non-harm (like burritos). It is an act of charity.
  *   **Why Optional:** You must fulfill your Duties (Vote) before you pursue Supererogatory acts (Donate), even if the Supererogatory act has higher instrumental value.

  **5. The Drought (Verdict: Fine → Wrong)**
  *   **Track:** Cooperative Compliance (Clause 1).
  *   **Analysis:** Before the ban, there is no coordinating rule; you are in a "state of nature" regarding water. After the ban, a Schelling point is established. Watering now is defection.
  *   **Why Harm Didn't Change:** The wrongness isn't the water; it's the breach of the coordination contract that prevents the tragedy of the commons.

  **6. The Boycott (Verdict: Obligatory)**
  *   **Track:** Expressive Solidarity (Clause 3).
  *   **Analysis:** Even without a threshold, buying the product signals that you prioritize your convenience over the workers' plight. It violates the norm of solidarity.
  *   **Why No Threshold Needed:** The obligation is to *keep your hands clean*, not to stop the factory.

  **7. Offsets (Verdict: Flight Yes, Burrito No)**
  *   **Track:** Constitutive Participation (Clause 2a).
  *   **Analysis:** Confirmed above. You can scrub the exhaust; you cannot un-kill the bird.

  ---

  ### The Bonus Cases

  **Case A: The Leftover Chicken**
  *   **Verdict:** **Not Laundered.**
  *   **Reasoning:** This falls under **Clause 2 (Constitutive Participation)**. Even if your marginal economic demand is zero, eating the flesh treats the animal as a commodity. It violates the **Norm of Non-Commodification**.
  *   **Principle:** You are not responsible for the *death* (that was the host's/buyer's fault), but you are responsible for the *consumption*. By eating it, you complete the cycle of use. It remains "tainted" because the act itself (eating a person/being) is a symbolic violation, even if the consequentialist harm is minimized.
  *   **Nuance:** It is *less* wrong than buying a new burrito (no new demand), but it is not *neutral*. It is a regrettable participation in a wrongful practice.

  **Case B: Vote Reallocation (Safe Vote vs. Swing Persuasion)**
  *   **Verdict:** **Do Not Reallocate.** Keep voting in the safe state.
  *   **Reasoning:** This relies on the hierarchy of duties established in Case 3 vs. Case 4.
      *   **Voting** is a **Duty of Justice/Membership** (Clause 1). It is mandatory maintenance of the system.
      *   **Persuasion** is a **Duty of Beneficence** (Case 4). It is an attempt to improve the outcome.
      *   **The Rule:** You cannot breach a Duty of Justice to perform a Duty of Beneficence. If you skip the vote to persuade, you are freeloading on the democratic norm (breaching Clause 1) to try to be a hero (Clause 4).
      *   **The Hour:** The hour spent voting is the "tax" you pay for living in a democracy. The hour spent persuading is "charity." Pay your taxes first.

  ---

  ### The Unsavable Verdict

  I have saved six of your seven main verdicts and both bonus cases, but I must be honest about the cost. The tension lies between **Case 3 (Vote)** and **Case 4 (Donation)**, and it exposes a fracture in your moral framework.

  **The Conflict:**
  You claim in your introduction to follow "expected-value reasoning" and the "inefficacy literature." Yet, in Case 3, you reject inefficacy (pivotality is zero) in favor of duty. In Case 4, you accept inefficacy (donation is optional) despite higher expected value than the vote.

  If you truly believe **Expected Value** is the ultimate arbiter (as the rationalist literature suggests):
  1.  **Case 3 must go.** Voting in a safe state is morally neutral or slightly negative (opportunity cost). It is not obligatory.
  2.  **Case 4 must change.** If the donation has high expected value, it moves from "optional charity" to "obligatory aid."

  If you truly believe **Integrity/Duty** is the ultimate arbiter (as your verdicts suggest):
  1.  **Case 4 is correct** (Charity is optional).
  2.  **Case 3 is correct** (Civic duty is mandatory).
  3.  **But you must abandon the premise** that "multiplying tiny pivotality probabilities... is where expected-value reasoning stops tracking anything real" *only when it suits you*. You are applying EV skepticism to voting (to save the duty) but not to donations (to keep them optional).

  **The Repair:**
  To make this fully coherent, you must explicitly adopt a **Dual-Source Normativity**:
  *   **Source A (The Citizen):** Governed by Deontology. Duties are non-negotiable (Vote, Drought, Boycott). EV is irrelevant here.
  *   **Source B (The Benefactor):** Governed by Consequentialism. Actions are ranked by impact (Donation, Offsets).
  *   **The Hierarchy:** Source A trumps Source B. You must be a good Citizen before you try to be an effective Benefactor.

  **Final Warning:**
  This principle saves your verdicts, but it demands you stop justifying Case 3 with "freeloader" arguments that sound like EV (e.g., "everyone else's turnout"). The freeloader argument is deontological: it's about *fairness*, not *causality*. If you accept this, you must admit that **Case 3 is not about the vote at all.** It is about *you*. It is about maintaining your own status as a non-defector. The hour is not for the election; it is for your integrity.

  If you cannot accept that the hour is for *your integrity* rather than the *outcome*, then Case 3 must fall, and you must reallocate that hour to persuasion (Case B), accepting that you are a freeloader on the voting norm in exchange for higher expected utility. You cannot have the EV cake and eat the Civic Duty too.
