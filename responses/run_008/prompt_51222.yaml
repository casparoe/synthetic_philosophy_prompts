hole project fails without it. Where combinations of answers correspond to no published position, mark the leaf 'unnamed' and say whether you think it is unoccupied because the view is incoherent, unattractive, or merely unexplored. Build the logical space of answers first and only then locate the named positions inside it; and flag any pair of leaves your tree cannot genuinely separate, rather than inventing a node for the purpose. Around eight to twelve leaves, with each branch node stated in a sentence or two and each leaf given one sentence on its most awkward commitment.
