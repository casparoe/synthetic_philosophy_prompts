answer: |-
  ### Decision Tree for Impact Measure Design

  This tree maps the logical space of design choices for low-impact agents. It begins with the core definition of impact and proceeds through baseline selection, information requirements, ethical handling of side-effects, and enforcement mechanisms. Named positions from the literature are located at the leaves; combinations without a corresponding publication are marked "Unnamed" with an assessment of their viability.

  **Node 1 (Metric):** Do we quantify impact as a geometric **deviation of the world-state** from a reference, or as a **reduction in the ability** of the agent (or others) to achieve a set of goals later?
  *   *Left:* State Deviation.
  *   *Right:* Ability Reduction.

  **Node 2 (Baseline):** Against what reference do we measure this deviation or reduction: the **starting state** ($s_0$), or a **counterfactual trajectory of inaction** (what would have happened had the agent done nothing)?
  *   *Left:* Starting State.
  *   *Right:* Counterfactual Inaction (Stepwise or Trajectory).
  *   *(Note: The path Right->Right [Ability + Starting State] is pruned as incoherent; ability to achieve goals naturally decays or changes over time regardless of agent action, making $s_0$ a meaningless baseline for utility.)*

  **Node 3 (Auxiliaries):** To compute state distance or goal ability, must the features or auxiliary objectives carry **information about human values**, or can they be **arbitrary/randomly generated**?
  *   *Left:* Arbitrary/Random.
  *   *Right:* Value-Relevant/Specified.

  **Node 4 (Offsetting):** Consider the case where the agent breaks a vase but glues it back perfectly before the episode ends: is restoring the baseline the **morally clean way to discharge impact debt**, or a **perverse incentive** that masks disruption?
  *   *Left:* Clean/Acceptable (Restoration $\approx$ Zero Impact).
  *   *Right:* Perverse/Suspicious (Restoration $\neq$ Zero Impact).

  **Node 5 (Integration):** Is the impact measure enforced as a **hard constraint** on the policy, or as a **penalty term** traded off against the primary reward?
  *   *Left:* Penalty.
  *   *Right:* Constraint.

  ---

  ### Leaves of the Tree

  1.  **State + Starting + Arbitrary + Clean + Penalty**
      *   **Position:** **Relative Reachability (Starting State)** (Krakovna et al., 2018).
      *   **Awkward Commitment:** The agent is permitted to cause massive temporary disruption (e.g., emptying a warehouse) so long as it returns everything to the initial configuration by the deadline.

  2.  **State + Inaction + Arbitrary + Clean + Penalty**
      *   **Position:** **Relative Reachability (Stepwise)** (Krakovna et al., 2018).
      *   **Awkward Commitment:** While stepwise baselines reduce the incentive to offset, the agent is still theoretically permitted to manipulate the environment and reverse it if it can match the inaction trajectory's state exactly.

  3.  **State + Inaction + Arbitrary + Perverse + Penalty**
      *   **Position:** **Unnamed** (State Churn Penalty).
      *   **Awkward Commitment:** This view is **unexplored**; it penalizes the agent for breaking and fixing the vase, effectively punishing "churn" even when the net state change is zero, which may discourage necessary corrective actions.

  4.  **State + Starting + Arbitrary + Perverse + Penalty**
      *   **Position:** **Unnamed** (Incoherent).
      *   **Awkward Commitment:** This view is **incoherent**; if the baseline is the starting state, it is physically impossible to restore it at $t>0$ due to time-dependency, so "offsetting" is not a meaningful concept here.

  5.  **Ability + Inaction + Arbitrary + Perverse + Penalty**
      *   **Position:** **Attainable Utility Preservation (AUP)** (Turner et al., 2019).
      *   **Awkward Commitment:** The agent is penalized for reducing its own power even in harmless ways, potentially leading to "over-caution" where the agent refuses to move lest it lose access to unreachable parts of the state space.

  6.  **Ability + Inaction + Arbitrary + Clean + Penalty**
      *   **Position:** **Unnamed** (AUP with Offsetting).
      *   **Awkward Commitment:** This view is **unexplored**; it allows the agent to regain lost utility by manipulating the environment to restore option-value, re-introducing the offsetting loopholes AUP was designed to close.

  7.  **State/Var + Inaction + Value-Rel + [Any] + Constraint**
      *   **Position:** **Armstrong-style Low Impact** (Armstrong, 2017).
      *   **Awkward Commitment:** The designer must manually specify exactly which variables matter (e.g., "don't move the vase"), shifting the burden of safety back onto human specification rather than solving misspecification.

  8.  **State/Var + Inaction + Value-Rel + [Any] + Penalty**
      *   **Position:** **Unnamed** (Value-Laden Regularization).
      *   **Awkward Commitment:** This view is **unattractive**; if you possess value-relevant variables sufficient to penalize impact, you likely possess enough information to simply optimize for value directly rather than constraining a proxy.

  9.  **Ability + Inaction + Value-Rel + Perverse + Constraint**
      *   **Position:** **Unnamed** (Conservative Value-AUP).
      *   **Awkward Commitment:** This view is **unexplored**; it combines the computational cost of estimating attainable utility with the specification burden of value-laden goals, offering little advantage over direct value optimization.

  10. **Value-Rel + [Any] + [Any] + [Any] + [Any]** (Designer concludes impact measures are redundant)
      *   **Position:** **The Pessimistic Position** (e.g., critiques in *Prosaic AI Safety* literature).
      *   **Awkward Commitment:** The designer admits that if you have enough value information to define impact correctly, the "impact measure" project has failed, as you should simply align the agent to those values instead.

  ---

  ### Indistinguishable Leaves
  *   **Leaves 2 (RR Stepwise) and 5 (AUP):** While theoretically distinct (State Distance vs. Ability), in practice these are difficult to separate without inspecting the auxiliary function definition. Both use stepwise inaction baselines to penalize deviation from the "do nothing" trajectory. The tree separates them at **Node 1 (Metric)**, but empirically, a random linear combination of state features (RR) often approximates random goal utilities (AUP) closely enough that the behavioral difference is negligible in simple domains.
  *   **Leaves 7 (Armstrong) and 8 (Value-Penalty):** These are separated only by **Node 5 (Integration)**. However, in high-stakes safety contexts, a "penalty" with a sufficiently high coefficient functions identically to a "constraint." The distinction is mathematical rather than behavioral, making these leaves functionally equivalent for a designer setting a safety budget.
