answer: |-
  This is one of the deepest questions in graphic design, cognitive science, and semiotics. You have stumbled onto a problem that Douglas Hofstadter (the driving force behind the "Letter Spirit" project) spent decades trying to solve. Your intuition that a letter is defined by "roles" rather than "strokes" is the leading edge of current theory, but as you suspect, making that precise is incredibly difficult.

  To build a term paper that stands up to scrutiny, you need to treat this like an engineering specification. If a theory of letterform categorization is a machine, these are the tests it must pass.

  Here is the requirements list for an adequate theory of letterform identity, followed by an analysis of your intuitions, the tensions within the list, and the specific requirement that breaks the competing theories.

  ### The Requirements List

  **1. Geometric Invariance with Directional Exception**
  The theory must allow a letterform to undergo significant geometric transformation without losing its identity. It must accept scaling, rotation (within reading orientation), slanting (italicization), and weight changes (bold/thin). However, it must strictly reject mirroring. A mirrored 'a' is not an 'a', even though the topological relationships between lines remain identical. The theory must explain why directionality is intrinsic to the letter, not just the page.

  **2. System Relativity (Context Dependence)**
  The theory cannot define a letter in a vacuum. A shape that functions as an 'a' in the Latin alphabet might function as a different letter (or no letter) in the Greek or Cyrillic systems. The theory must account for the fact that letter identity is relative to the specific set of contrasts available in that writing system. Identity is determined by *difference from neighbors* within the system, not just by intrinsic shape.

  **3. Style-Identity Separation**
  The theory must distinguish between *what* a letter is and *how* it is styled. You must be able to recognize that a Garamond 'a' and a Helvetica 'a' are the same letter despite sharing almost no specific geometric coordinates. Conversely, you must be able to recognize that a Garamond 'a' and a Garamond 'o' are different letters despite sharing the same style. The "style" parameters must be mathematically or conceptually separable from the "identity" parameters.

  **4. Robustness to Degradation (The Scrawl Test)**
  The theory must account for low-fidelity tokens. A chalkboard 'a' drawn with a broken piece of chalk may lack a closed bowl, a distinct stem, or a proper crossbar. It may be little more than a gesture. The theory must explain how a shape can fulfill the role of an 'a' even when the physical features required to define that role are missing or ambiguous.

  **5. Graded Membership (The Boundary Problem)**
  The theory cannot be purely binary (is/is not). It must account for marginal cases. There are shapes that are "mostly 'a'" but could be read as 'o' or 'u' depending on context. The theory needs to explain why some tokens are "better" examples of the category than others, without relying on a simple "average shape" (prototype) model.

  ### Critique of Your Candidate Requirements

  You asked which of your intuitions are genuine and which might be prejudices.

  *   **Genuine:** Your suspicion about **System Relativity** is correct. The idea that a shape's identity depends on the alphabet it sits in is a fundamental truth of semiotics. A theory that claims an 'a' has an eternal, universal essence is wrong.
  *   **Genuine:** The **Mirroring Asymmetry** is a critical constraint. It proves that letterforms are not just topological objects (shapes defined by connectivity); they are directional vectors.
  *   **Potential Prejudice:** You worry about the distinction between **Letter vs. Style**. Some theorists argue this is a false dichotomy—that style *constitutes* the letter. However, for a functional theory of reading, your distinction is genuine. Readers strip style away to access meaning. If a theory cannot separate them, it cannot explain how we read new fonts instantly.
  *   **Potential Prejudice:** The idea of **Roles** (bowl, stem). This is the "Letter Spirit" view. The prejudice here is assuming these roles are universal. In some scripts or extreme abstractions, the "roles" themselves dissolve. A theory too reliant on specific roles (like "must have a bowl") will fail the Scrawl Test.

  ### The Incompatible Pair: Structural Integrity vs. Robustness

  You asked to flag requirements that might not be jointly satisfiable. The most significant tension exists between **Requirement 4 (Robustness to Degradation)** and a strict interpretation of **Structural/Role-Based Views**.

  If you define an 'a' by a specific arrangement of roles (e.g., "a vertical stem attached to a closed bowl"), you fail the Scrawl Test. A badly scrawled 'a' often lacks a closed bowl or a distinct stem. If the theory says "no bowl, no 'a'," it contradicts human perception, which sees the 'a' anyway.

  However, if you make the roles too abstract to accommodate the scrawl (e.g., "a gesture of closure"), you risk making the definition so vague that it no longer distinguishes an 'a' from a 'd' or an 'o'.

  **The Tension:** To handle the scrawl, the theory must be flexible. To handle the definition, the theory must be rigid. Reconciling how a letter can lose its physical parts but keep its structural "soul" is the hardest problem in the field. This is where "Letter Spirit" attempts to intervene by suggesting the roles are *functional* (what the part does) rather than *geometric* (what the part looks like), but even that struggles with extreme degradation.

  ### The "Killer" Requirement

  You asked which single requirement does the most damage to the obvious candidate theories. That requirement is **Requirement 2: System Relativity.**

  Here is how System Relativity dismantles the competition:

  1.  **Feature Lists (The "Checklist" Theory):** This theory says an 'a' is a list of features (e.g., +vertical, +curved, +closed).
      *   *Why it fails:* Feature lists assume features are intrinsic to the shape. System Relativity shows that the *value* of a feature depends on the system. A circular shape is an 'o' in Latin but could be a different letter in another script. A feature list cannot account for the fact that the *same* shape changes identity when the surrounding alphabet changes. It treats the letter as an island, not a node in a network.

  2.  **Prototype/Average Views:** This theory says an 'a' is anything close to the average 'a' you've seen before.
      *   *Why it fails:* Prototypes are built on visual statistics. They cannot handle the "alphabet context" switch. If you show a prototype model a shape that is statistically halfway between a Latin 'a' and a Cyrillic 'в', it will just say "it's ambiguous." It cannot say "In this context, it is definitely 'в'." It lacks the systemic logic to override visual similarity.

  3.  **Modern Neural Networks:** These are the current state-of-the-art for recognition.
      *   *Why it fails:* While they pass the *performance* test (they can identify the letter), they fail the *theoretical* test. They are black boxes. They do not "know" why something is an 'a'; they just correlate pixels to labels. More importantly, they typically conflate **Style and Identity** (Requirement 3). A neural net trained on Times New Roman often struggles to generalize to handwritten script without retraining, because it hasn't learned the abstract "a-ness," it has learned the texture of the font. They struggle to separate the system rules from the visual data.

  4.  **Structural/Role-Based Views (Letter Spirit):**
      *   *Survival Status:* This is the only candidate that survives, but it is wounded. It survives because it defines letters by their *relationships* (roles) rather than their pixels, which aligns with System Relativity. However, it is wounded by the **Robustness** tension mentioned above. If the roles are too structural, it fails the scrawl. If they are too abstract, it loses predictive power.

  ### Conclusion for Your Paper

  The tension you suspected—between **alphabet-dependent categories** and **recognition based on shape**—is real. It is the central conflict of typography.

  If you want a strong thesis for your term paper, argue that an adequate theory cannot be purely visual. It must be **linguistic**. A letterform is not just a picture; it is a signifier within a code. The reason a mirrored 'a' is not an 'a' is not geometric; it is because the code of Latin script runs left-to-right and assigns meaning to specific directional gestures. The reason a scrawl is still an 'a' is not because it has the right parts, but because the reader's brain projects the *system* onto the noise.

  The "Letter Spirit" project is right that roles matter, but they are not just visual roles; they are functional roles within a system of differences. The requirement that breaks the other theories is **System Relativity**, because it forces us to admit that an 'a' does not exist on the page. It exists in the relationship between the page, the reader, and the alphabet they know.

  This distinction elevates your paper from a discussion of shapes to a discussion of meaning, which is exactly where graphic design theory should live.
