      *   Conclusion: Definitive verdict.

  10. (Final Review against Prompt): "Don't be wishy-washy." -> Take a stand. "Map the episode onto the theory with some discipline." -> Use headers/bullet points for the mapping. "Honest about where the theory is just silent." -> Explicitly state limitations.

  *(Self-Correction on "Fitness"):* In biology, fitness = reproductive success. In nations, it's regime survival or geopolitical dominance. Need to make that translation clear.

  *(Self-Correction on "Waste"):* Zahavi insists on waste. If Apollo had utility, is it still a handicap? Yes, if the *signaling component* is wasteful. E.g., landing humans is less efficient than robots for science, but more impressive for signaling. I should highlight the *human* element as the specific handicap.

  *(Self-Correction on "Audience Exit"):* Biological signals don't stop because a rival dies; they stop because the season ends. The geopolitical "season" ended when the USSR conceded. This is a strategic game, not an evolutionary stable strategy (ESS) in the same sense.

