          *   **CRITICAL ERROR HERE.** The hallmark of the Etiological account (Millikan, Neander, etc.) is that it *can* account for malfunction. A token trait can fail to perform its function but still *have* the function because of its history/lineage. The student claims "there is no function left to ascribe." This is the opposite of the standard etiological view on malfunction.
      *   *Sentence 9:* "Here the causal-role account does better: since function on that account is fixed by the trait's history, the deformed tail still has the function of gliding and simply fails to perform it, which is what we ordinarily mean by a part's malfunctioning."
          *   **CRITICAL ERROR HERE (Double Reversal).** The student has swapped the accounts' abilities to handle malfunction.
