prompt: |-
  I'm a retired neuroscientist (30 years of single-unit recordings and lesion studies) who fell hard into philosophy of mind after retiring, and I now run a small podcast on mind-science stuff. Next week's guest is a philosopher who defends non-reductive physicalism — she thinks mental properties are genuinely higher-level, multiply realizable, and still causally efficacious. Here's my problem: I finally sat down with Kim's causal exclusion argument and it genuinely bugs me. Closure of physics plus no systematic overdetermination plus the sufficiency of the physical realizer seems to leave her only two options: reduce the mental to the physical or admit it's epiphenomenal, and she's going to tell me it's a false dilemma. I want to press her in a way that goes deeper than anything I could've come up with myself.

  Draft me interview questions that actually bite. Specifically: at least one question on the overdetermination escape route (she'll likely say this isn't like a firing squad, two bullets independently sufficient, since the mental and physical causes aren't independent — press her on what "not independent" amounts to if the properties are really distinct), one on whether she can even state mental-to-mental causation (say, a belief causing an intention) without smuggling in a reduction, and one on the interventionist response — the idea that mental variables earn their causal keep by supporting counterfactuals and answering what-if-things-had-been-different questions, screening off worries about the lower-level story. For each main question, add a follow-up keyed to the reply she's most likely to give, so I'm not stuck nodding along when she deflects. And flag which of my proposed questions risk just inviting her to restate multiple realizability — I've heard that a hundred times and my listeners will too.

  Structure your response like this: first a section called "Setting up the trap" (~150 words, my-voice summary of the exclusion argument I can read on air so listeners are on the same page), then "Questions and follow-ups" (9-12 questions, each with its follow-up, grouped into rough themes like overdetermination, downward causation, and what her view would actually predict in an experiment), and finally one "Hail Mary" question I can deploy if she's been too smooth all hour.
