answer: |-
  ### Specification of Desiderata for Moral Uncertainty Decision Theory

  The following five desiderata specify the functional requirements for a theory of decision-making under moral uncertainty (MUDT). They are ordered from structural prerequisites to dynamic constraints.

  **1. Intertheoretic Comparability (The Scale Problem)**
  *   **Motivation:** An agent holds credences in Utilitarianism (cardinal welfare scale) and Deontology (binary constraints). To aggregate these into a single decision, the theory must translate "violating a right" and "losing 10 units of welfare" into a common currency of *choiceworthiness*. Without this, credences cannot weight outcomes.
  *   **Status:** **Non-negotiable** for any theory claiming to integrate uncertainty (i.e., any theory other than "My Favourite Theory").
  *   **Tension Flag:** This presupposes that all candidate moral theories *admit* of comparison. If one candidate theory claims moral values are incommensurable, the MUDT violates that theory's content by forcing comparison.

  **2. Meta-Ethical Accommodation (The Objectivism Problem)**
  *   **Motivation:** The agent has non-zero credence in Moral Objectivism (only the *true* morality generates reasons; uncertainty is irrelevant) or Error Theory (no moral facts exist). A MUDT must specify how to treat credences in theories that deny the normative significance of having credences. Ignoring them violates the agent's uncertainty; respecting them may violate the object of the uncertainty.
  *   **Status:** **Camp-specific** (Internalists require it; Externalists may reject it), but **Non-negotiable** for a *general* MUDT intended to guide agents who are not meta-ethically certain.
  *   **Tension Flag:** See "Jointly Unsatisfiable Subset" below.

  **3. Value of Moral Inquiry (The Deliberation Constraint)**
  *   **Motivation:** Agents can spend resources to reduce moral uncertainty (e.g., studying ethics) before acting. A MUDT must explain when this is rational, particularly in "self-undermining" cases where no first-order moral theory endorses the cost of inquiry (e.g., if all theories say "act now," but uncertainty suggests waiting might reveal a better act).
  *   **Status:** **Non-negotiable** for a dynamic theory of rationality. A theory that forbids inquiry despite high uncertainty is pragmatically self-defeating.
  *   **Tension Flag:** Conflicts with **Desideratum 4** if the "certain limit" theory forbids inquiry costs, creating a discontinuity between the uncertain and certain states.

  **4. Moral Certainty Limit (The Continuity Constraint)**
  *   **Motivation:** As credence in one moral theory approaches 100%, the MUDT's prescriptions must converge to that theory's prescriptions. If an agent becomes certain of Utilitarianism, the MUDT must not prescribe Deontological acts due to residual structural inertia.
  *   **Status:** **Non-negotiable.** This is a basic consistency requirement linking MUDT to ordinary decision theory.
  *   **Tension Flag:** Threatened by **Desideratum 3** (Inquiry) if the path to certainty involves steps the certain theory would forbid.

  **5. Diachronic Stability (The Precommitment Problem)**
  *   **Motivation:** In cases where an agent must precommit before moral uncertainty is resolved (e.g., signing a treaty that binds future moral agents), the theory must specify whether to bind oneself to current credences or anticipated future credences. It must avoid dynamic inconsistency where the agent plans to do X at *t1* but rationally abandons X at *t2* without new information.
  *   **Status:** **Camp-specific** (Time-slice vs. Diachronic rationality), but **Non-negotiable** for strategic decision-making.
  *   **Tension Flag:** Conflicts with **Desideratum 1** if intertheoretic scales shift over time as the agent's understanding of the theories evolves.

  ***

  ### Jointly Unsatisfiable Subset

  I flag **(1) Intertheoretic Comparability** and **(2) Meta-Ethical Accommodation** as jointly unsatisfiable for a unified aggregation theory.

  *   **The Conflict:** To satisfy (1), the MUDT must impose a common metric (e.g., expected choiceworthiness) across all theories. To satisfy (2), the MUDT must respect theories that deny such a metric is possible (e.g., a Deontology that claims rights are side-constraints, not tradeable goods) or deny that uncertainty generates reasons (Objectivism).
  *   **The Impossibility:** If you assign credence to a theory that says "Uncertainty provides no reasons," and you use that credence to weight its verdict within an expected-utility framework, you are treating uncertainty as reason-generating, thereby violating the content of that theory. If you exclude that theory from the calculation to respect its content, you violate the agent's credence distribution. You cannot simultaneously aggregate *all* credences (1) and fully respect credences that deny the legitimacy of aggregation (2).

  ***

  ### Candidate Scorecard

  **1. Maximize Expected Choiceworthiness (MEC)**
  *   **Performance:** High on (1), (3), (4). Low on (2), (5).
  *   **Analysis:** MEC is the gold standard for handling inquiry (3) and continuity (4) because it treats moral uncertainty exactly like empirical uncertainty. However, it fails (2) because it forces objectivist theories into a probabilistic framework they reject. It also struggles with (5) because as credences update, the "expected best" action can shift, leading to dynamic inconsistency (time-inconsistency) unless sophisticated precommitment devices are assumed.
  *   **Fatal Flaw:** Fails Meta-Ethical Accommodation (2) without ad-hoc modifications.

  **2. My Favourite Theory (MFT)**
  *   **Performance:** High on (2), (4). Low on (1), (3), (5).
  *   **Analysis:** MFT simply follows the theory with the highest credence. It easily satisfies (2) because it obeys the favourite theory's meta-ethics. It satisfies (4) by definition. However, it utterly fails (1) because it ignores trade-offs between the favourite and the runner-up (wasting the information in the credence distribution). It fails (3) because inquiry is only valuable if it changes which theory is the "favourite," ignoring the *value of information* regarding the magnitude of choiceworthiness.
  *   **Fatal Flaw:** Fails Intertheoretic Comparability (1) by refusing to engage with it, rendering it insensitive to the *degree* of uncertainty.

  **3. Moral Parliament (MP)**
  *   **Performance:** Moderate on (1), (2), (5). Low on (3), (4).
  *   **Analysis:** MP models theories as delegates bargaining. It handles (1) better than MFT by allowing trade, and (5) better than MEC by allowing binding deals between time-slices. However, it is underspecified regarding (3) (when should delegates spend resources on inquiry?) and (4) (as one delegate gains majority, does the parliament dissolve smoothly into that theory's rule, or does bargaining inertia persist?).
  *   **Fatal Flaw:** Fails Continuity (4) and Value of Inquiry (3) due to structural vagueness; often collapses into MEC or MFT depending on delegation rules.

  ***

  ### Conclusion

  While Meta-Ethical Accommodation presents the deepest philosophical puzzle, it is the requirement for Intertheoretic Comparability that acts as the primary filter for formal decision theories. Without a solution to (1), the project of *integrating* moral uncertainty collapses into My Favourite Theory, which most proponents of MUDT reject as insufficiently sensitive to uncertainty. However, since (1) and (2) appear jointly unsatisfiable, any theory satisfying (1) inevitably violates (2).

  Verdict: Intertheoretic Comparability
