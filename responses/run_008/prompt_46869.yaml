prompt: |-
  I do volunteer work at a tiny local history museum in an old mill town, and we've got a dilemma about our main exhibit. The story everyone in town grew up with is that the mill workers went out on strike in 1907 and, through sheer solidarity, forced the owner to grant the eight-hour day -- it's basically the town's founding myth, there's a mural of it, the high school teams are named after it. But I've been going through the company's actual records and the local newspaper archive, and it's pretty clear the strike failed. The owner brought in replacement workers, the strikers went back on his terms, and the eight-hour day came two years later because the owner wanted to switch to a new shift system and figured shorter shifts suited the machinery better. So the treasured memory is just wrong about the central facts.

  Some of the other volunteers say the exhibit should tell the story the way the town remembers it, because that version is what actually made the town what it is -- people organizing around that memory for decades is arguably more historically real than what happened in 1907. Others say we'd basically be lying on a wall label if we don't present the archival record front and center. Is there some principled way through this, or even just a good compromise for the exhibit? Which should give, the community's story or the paper trail, and why? I keep going back and forth so any help untangling it is appreciated.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Volunteer at a tiny local history museum in an old mill town.
      *   **The Conflict:** The town's "founding myth" (1907 strike succeeded, won 8-hour day) contradicts the archival evidence (strike failed, 8-hour day came later for efficiency reasons).
      *   **Stakeholders:**
          *   *Community/Other Volunteers:* Want to keep the myth because it shaped the town's identity and solidarity ("social truth").
          *   *User (and presumably some others):* Want to present the archival truth because museums have a duty to accuracy ("factual truth").
      *   **The Question:** Is there a principled way through this? A compromise? Which should give, and why?

  2.  **Identify the Core Ethical/Historical Tension:**
      *   This is a classic museology and public history dilemma: *Accuracy vs. Identity.*
      *   It's not just about "truth vs. lie." It's about *event history* (what happened on the ground in 1907) vs. *memory history* (how the event was remembered and used subsequently).
      *   Both sides have valid points. Ignoring the archives undermines the museum's credibility as an educational institution. Ignoring the memory undermines the museum's role as a community hub and guardian of local identity.

  3.  **Evaluate the Options:**
      *   *Option A: Stick to the Myth.* Pros: Community harmony, preserves identity. Cons: Dishonest, academically indefensible, risks credibility if/when truth comes out (it will).
      *   *Option B: Hard Correction.* Pros: Accurate. Cons: Alienates community, feels like an attack on identity, might reduce engagement.
      *   *Option C: Integrated Approach (The "Third Way").* Acknowledge both. Explain *why* the memory exists and *what* the records show. This treats the memory itself as a historical artifact.

  4.  **Develop the "Principled Way Through" (Museology Best Practices):**
      *   Modern public history doesn't see these as mutually exclusive. The *memory* of the strike is historically significant regardless of the strike's outcome.
      *   *Key Concept:* "Social Memory" or "Collective Memory." The fact that people *believed* they won is historically impactful. It fueled labor organizing for decades.
      *   *Key Concept:* "Interpretive Nuance." Don't just say "You're wrong." Say "Here's what happened, and here's why we remember it this way."

  5.  **Drafting the Advice - Section by Section:**

      *   **Validation:** Acknowledge the difficulty. This is a high-stakes ethical problem for a small museum. Validate both sides' intentions.
      *   **The Core Principle:** Museums have a dual mandate: Stewardship of Truth (archives) AND Stewardship of Community (identity). Neither can be discarded.
      *   **The Solution (The "Both/And" Approach):**
          *   Don't hide the archives.
          *   Don't erase the myth.
          *   *Reframe the exhibit:* Make the *evolution of the story* part of the story.
      *   **Specific Exhibit Strategies:**
          *   *Panel 1: The Event.* What the records say (strike failed, 8-hour day came later for efficiency).
          *   *Panel 2: The Memory.* How the story changed (the mural, the school teams, the oral history).
          *   *Panel 3: The Impact.* Why the memory matters (solidarity, labor rights culture).
          *   *Interactive Element:* Let visitors weigh in. "What does this story mean to you?"
      *   **Addressing the "Which Should Give?" Question:**
          *   Neither should "give" completely.
          *   Factual accuracy is non-negotiable for a museum (credibility).
          *   Community narrative is non-negotiable for relevance (engagement).
          *   The *interpretation* must bridge them.
      *   **Risk Management:** How to break the news gently. Community meetings, previews, framing it as "deepening" the story rather than "correcting" it.
      *   **Precedents:** Mention that other museums face this (e.g., Paul Revere's ride, George Washington's cherry tree, labor myths elsewhere).

  6.  **Refining the Tone:**
