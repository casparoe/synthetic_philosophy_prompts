answer: |-
  This is one of the most classic and difficult dilemmas in public history. You are standing right at the intersection of **event history** (what actually happened) and **memory history** (how people remember and use the past).

  The good news is that you do not have to choose between "lying on a wall label" and "alienating the community." In modern museology, those are seen as a false dichotomy. You can honor the archival record *and* honor the community's identity, but it requires reframing the exhibit's purpose.

  Here is a principled way through this, along with specific strategies for the exhibit.

  ### 1. The Core Principle: Memory is Also History
  The volunteers who want to keep the myth are right about one thing: **The story the town tells itself is historically significant.** Even if the strike failed in 1907, the *belief* that it succeeded shaped the town's politics, labor relations, and identity for the next century. That belief is a historical fact in its own right.

  The museum's job is not just to record events, but to interpret how those events live in the present. If you erase the myth, you erase a huge part of the town's social fabric. If you cement the myth as fact, you erase the museum's credibility.

  **The Solution:** Make the *evolution of the story* part of the exhibit. Do not present the myth as the event; present the myth as the *legacy* of the event.

  ### 2. Practical Exhibit Strategies
  You can structure the narrative to validate both the archives and the community without contradicting either. Here is a three-part framework:

  **Panel A: The Strike of 1907 (The Event)**
  *   **Content:** Present the archival findings clearly but neutrally. "Company records indicate the strike ended without a formal agreement. Replacement workers were hired. The eight-hour day was implemented in 1909, coinciding with new machinery."
  *   **Tone:** Factual, not accusatory. Use phrases like "Payroll records show..." or "Editorials from the time suggest..." rather than "The town was wrong."

  **Panel B: The Story We Tell (The Memory)**
  *   **Content:** Display the mural, the high school yearbooks, the oral histories. "For generations, residents have remembered 1907 as a victory for solidarity. This story became a cornerstone of local identity."
  *   **Tone:** Respectful. Acknowledge that this narrative empowered workers and built community cohesion.

  **Panel C: Why It Matters (The Synthesis)**
  *   **Content:** Connect the two. "Whether the victory was immediate or gradual, the *belief* in solidarity changed this town. The memory of the strike inspired decades of organizing that did win tangible improvements."
  *   **Tone:** Unifying. This validates the community's pride without validating the factual error.

  ### 3. Which Should Give?
  To answer your specific question: **Neither should give completely, but the *presentation* must yield to accuracy.**

  *   **Why Accuracy Must Hold:** A museum that knowingly displays factual falsehoods loses its authority. If a visitor checks the archives later (and they will), the museum looks incompetent or dishonest. You cannot label a falsehood as fact.
  *   **Why Community Must Hold:** A local museum that alienates its neighbors becomes a mausoleum, not a community resource. If the town feels attacked, they will stop coming, stop donating, and stop supporting you.

  **The Compromise:** The *facts* on the label must be accurate. The *interpretation* of those facts must be generous. You are not saying, "Your grandparents lied." You are saying, "Your grandparents found power in this story, and that power was real, even if the details shifted over time."

  ### 4. Implementation: How to Break the News
  Since you are a volunteer among volunteers, you cannot dictate this. You need to build consensus.

  *   **Host a "History Night":** Before changing the exhibit, host a community discussion. Frame it as "Uncovering New Layers of Our Story." Show the documents. Ask the older residents, "Why do you think this story became so important?" This turns the correction into a conversation rather than a correction.
  *   **Use "Interpretive Labels":** Instead of one definitive text, use labels that show the tension.
      *   *Label:* "The Legend vs. The Ledger."
      *   *Text:* "Oral history tells us X. Company ledgers show Y. Historians believe the truth lies in how the town used X to achieve Y later."
  *   **Invite Contribution:** Put up a board where visitors can write down what the strike means to them. This acknowledges that the *meaning* is more important to them than the *date*.

  ### 5. Precedents
  You are not alone. Many institutions face this.
  *   **The Paul Revere Ride:** Historians know it was a team effort and Revere was captured before Concord, but the "one man rode" myth is central to American identity. Museums present the ride *and* the myth.
  *   **Labor Museums in the UK/US:** Many have found that acknowledging failed strikes is actually *more* powerful than pretending they won. It highlights the resilience of workers who kept organizing despite defeat.

  ### Summary Recommendation
  Do not hide the archives. That is malpractice. But do not present the archives as a "gotcha" moment that humiliates the town.

  **The exhibit should argue that the town's solidarity was real, even if the specific victory story was embellished.**

  If you frame it as "The Strike That Built a Town" rather than "The Strike That Won the Day," you keep the pride intact while correcting the record. The workers *did* build the town. Their solidarity *did* matter. The eight-hour day *did* come. The only thing that changes is the timeline and the mechanism.

  That is a nuance a community can accept, and it allows you to sleep at night knowing you haven't lied on a wall label.
