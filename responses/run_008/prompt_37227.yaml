prompt: |-
  Quick backstory: I'm a journalist, I write mostly about science and ideas for a general audience, and my undergrad degree is actually in math — which I basically never use except to annoy editors. Anyway, an old friend of mine teaches intro abstract algebra at a small college near me, and she's been drowning this semester (medical leave for a colleague, long story), so she talked me into grading a stack of her problem sets. I figured it'd be a fun way to dust things off. Most of the grading has gone fine, but one writeup on a Zorn's lemma problem has me second-guessing myself on how harsh to be — some of it looks solid to me and some of it I can't quite put my finger on, and I don't want to ask her since she'd just say "use your judgement." She grades on a 0–10 scale. Could you give me a grade for this student and, more importantly, the specific comments that would justify it? I want the point-by-point version, not a vibes-based impression — especially anything a rusty non-expert grader like me might have let slide.

  Here was the question:

  (a) State Zorn's lemma precisely, including all of its hypotheses.
  (b) Using Zorn's lemma, prove that every nonzero commutative ring with 1 has a maximal (proper) ideal.
  (c) A classmate claims that in your proof from part (b), the fact that you're taking unions of chains of ideals — totally ordered by inclusion — doesn't really do any work, since "a union of ideals is an ideal either way." Briefly explain whether the classmate is right, and if not, exactly where the total ordering matters.

  And here's what the student wrote:

  (a) Zorn's lemma: if a partially ordered set P has the property that every chain (totally ordered subset) in P has a least upper bound in P, then P contains a maximal element. It is equivalent to the axiom of choice.

  (b) Let R be a nonzero commutative ring with 1, and let S be the set of proper ideals of R, ordered by inclusion. S is nonempty because (0) is a proper ideal (since R is nonzero, 1 ≠ 0, so (0) ≠ R). Now let C be a chain in S and let U be the union of all ideals in C. Since a union of ideals is an ideal, U is an ideal, and U is proper since no ideal in C is all of R. So U is an upper bound for C in S, and Zorn's lemma applies, so S has a maximal element M. Since S is the set of all proper ideals of R, M is a maximal ideal of R. Hence every nonzero commutative ring with 1 has a maximal ideal.

  (c) The classmate is right that the union is an ideal either way — ideals are closed under addition and additive inverses, and so is their union. Where the total ordering actually matters is the properness claim: if the ideals in C weren't totally ordered, the union could pick up the identity from somewhere and end up being the whole ring. So the ordering does do work, just not the work the classmate thinks.

  One more thing — if it helps, comment on how the errors (if you find any) stack up in terms of seriousness, because I honestly can't tell wether any of these are cosmetic or the kind of thing that means the student doesn't really get the proof.
