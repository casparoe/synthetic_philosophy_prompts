answer: |-
  1. Distribute 20 poker chips per student as endowment redeemable for candy and prepare a visible House Bank capped at $2^{10}$ chips, plus a large coin and a projected spreadsheet to track payouts and bids for independent and correlated paired plays.
  2. Students pay 1 chip to flip; heads doubles the pot and continues, tails cashes out, but the House stops paying once the Bank is exhausted, forcing early termination at the cap; for correlated plays, pairs share one flip sequence.
  3. In pairs, students auction the right to play one free lottery using their chips via second-price sealed bids, recording the clearing price to reveal actual willingness-to-pay rather than hypothetical assent.
  4. Map the bidding cap to bounded utility and the house bank limit to real-world finitude, then challenge whether low bids stem from risk aversion or stake indifference by observing if bids remain negligible despite exponentially increasing potential payouts.
  5. Expect students to misunderstand the cap as a win condition rather than a hard stop, so clarify verbally before Phase 1, and prevent auction collusion by randomizing pairs and enforcing sealed bids.
