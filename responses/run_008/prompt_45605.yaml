answer: |-
  This is a profound identification, and you are standing on ground that was surveyed extensively in the late 80s and early 90s by Joseph Halpern, Yoram Moses, and Neiger, though that work often sits in the footnotes of practical engineering. Your intuition is correct: **Common Knowledge is the epistemic fixed point that Consensus protocols attempt to approximate.**

  However, the mapping is not an isomorphism. It is a projection that loses information depending on the fault model and timing assumptions. The "infinite nesting" of epistemic logic hits the "finite rounds" of distributed protocols, and the "truthfulness" of epistemic logic hits the "Byzantine" reality of systems engineering.

  Here is the translation of epistemic game theory into your vocabulary, followed by the residue report and answers to your three specific questions.

  ---

  ### Part 1: Epistemic Game Theory in Protocol Vocabulary

  #### 1. Common Knowledge & Iterated Elimination
  *   **Epistemic Definition:** $C(\phi)$ holds if everyone knows $\phi$, everyone knows everyone knows $\phi$, ad infinitum. Iterated elimination of dominated strategies requires $C(\text{Rationality})$.
  *   **DS Translation:** This is **Global Predicate Detection** or **Simultaneous Consensus**.
      *   In a synchronous system with reliable links, a broadcast followed by $D$ rounds of acknowledgment (where $D$ is the diameter) establishes $C(\phi)$.
      *   In an asynchronous system, $C(\phi)$ is **unattainable** (Halpern & Moses, 1990). You cannot distinguish a slow node from a crashed node.
      *   **Iterated Elimination:** In protocol terms, this is **Safety Proof by Induction**. If I know you follow the protocol (Rationality), and I know you know I follow the protocol, I can prune the state space of invalid messages. If I suspect you are Byzantine (irrational/malicious), I cannot eliminate strategies; I must assume worst-case behavior (BFT).

  #### 2. Backward Induction
  *   **Epistemic Definition:** Solving a game from the last move to the first, requiring agents to know the rationality of others at future nodes.
  *   **DS Translation:** This is **Termination Detection** and **Round Complexity Bounds**.
      *   To backward induct, you need to know the "end of the protocol." In asynchronous consensus (FLP), there is no deterministic bound on when the protocol ends.
      *   Therefore, backward induction fails in asynchronous consensus. You cannot reason about "the last round" because the system cannot detect the last round. This is why Paxos uses indefinite rounds (ballots) rather than a fixed game tree.

  #### 3. Aumann's Agreement Theorem
  *   **Epistemic Definition:** Agents with common priors cannot agree to disagree on posteriors.
  *   **DS Translation:** **State Convergence under Reliable Broadcast.**
      *   **Common Prior:** The **Genesis State** + **Protocol Code**. If all nodes start with the same binary and config, they share a prior.
      *   **Posteriors:** The **Local Log/State**.
      *   **The Theorem:** If nodes exchange their full local states (posteriors) over reliable links until no new information is transmitted, their states must converge. If they output different decision values, either the links lied (Byzantine) or the initial code differed (forked prior).
      *   **Constraint:** This assumes the exchange completes. In asynchronous systems, "completion" is undecidable.

  #### 4. Rubinstein's Email Game
  *   **Epistemic Definition:** Two agents coordinate an attack only if they have common knowledge of the state. Finite confirmation messages create $k$-level knowledge, not common knowledge. Equilibrium unravels backward from the last possible message.
  *   **DS Translation:** This is the **Two Generals Problem** with a **Payoff Matrix**.
      *   **Messages:** `PREPARE`, `PROMISE`, `ACCEPT`.
      *   **Loss:** Packet drop.
      *   **The Unraveling:** If the protocol requires $N$ acks, and the $N$-th ack is lost, the sender doesn't commit. If the sender doesn't commit, the $(N-1)$-th ack was useless.
      *   **DS View:** We solve this by accepting **Eventual Consistency** or **Probabilistic Termination**. We don't solve the Email Game; we change the payoff structure so that "acting on 99% certainty" is better than "never acting."

  ---

  ### Part 2: The Three Questions

  #### 1. Is Common Knowledge the same fixed point as Consensus?
  **Verdict:** No. Consensus is a *weaker* approximation of Common Knowledge in asynchronous environments.

  *   **The Distinction:** Common Knowledge ($C(\phi)$) implies **simultaneity**. For $C(\phi)$ to hold, there must be a moment where everyone knows $\phi$ simultaneously.
  *   **The DS Reality:** In asynchronous systems, there is no global clock. You can have **Eventual Common Knowledge** (everyone will eventually know $\phi$), but not **Simultaneous Common Knowledge**.
  *   **The Fixed Point:** Consensus protocols (like Paxos) achieve a state where all *correct* nodes decide $v$. This looks like $C(\text{decided}=v)$. However, because of asynchrony, a node can never *know* that everyone else knows. It only knows that a quorum knows.
  *   **Illegitimate Work:** The identification fails when you assume the protocol *knows* it has reached consensus. In DS, the protocol reaches consensus; the *agents* often remain uncertain about whether the consensus is global until they see subsequent traffic. Epistemic logic demands the agent *knows* $C(\phi)$; DS only guarantees $\phi$ is true on all up nodes.

  #### 2. Is Aumann's Theorem about converged communication? What is the Common Prior?
  **Verdict:** Yes, it is about converged communication. The Common Prior is the **Trusted Computing Base (TCB)**.

  *   **Convergence:** Aumann's theorem assumes the agents have exchanged posteriors until the exchange is common knowledge. In DS, this is the **Termination Property**. If the network partitions, the "exchange" hasn't converged, and Aumann doesn't apply (nodes can "disagree" by living in different partitions).
  *   **Common Prior:** In DS, this is the **Initial Configuration**.
      *   If nodes run different versions of the protocol (different priors), they may interpret messages differently (e.g., v1 vs v2 serialization).
      *   If nodes have different trust assumptions (e.g., different checkpoint hashes), they have different priors.
      *   **Protocol Analogue:** Aumann's theorem breaks in DS if you have a **Chain Split** (fork). This is effectively a divergence of priors mid-execution. The theorem holds only within a single consistent fork.

  #### 3. Is the Email Game just Two Generals with Payoffs?
  **Verdict:** It is Two Generals with **Risk Analysis**, and it yields a stronger collapse.

  *   **Two Generals:** Says "You cannot guarantee coordination."
  *   **Email Game:** Says "You cannot guarantee coordination *even if the probability of loss is arbitrarily small*."
  *   **The Stronger Collapse:** In DS, we often say, "Loss is rare, so we retry until it works." Rubinstein shows that if the equilibrium *depends* on Common Knowledge, **no finite number of retries suffices**, regardless of reliability.
  *   **DS Implication:** This justifies why we move from "Coordinated Commit" (2PC) to "Uncoordinated/Optimistic Commit" (3PC, Paxos, Raft). 2PC tries to solve the Email Game and blocks. Paxos accepts that you can't solve the Email Game, so it allows leaders to change (epochs) to break the dependency on infinite acks. The payoff structure forces you to abandon the goal of Common Knowledge in favor of **Leader-Based Authority**.

  ---

  ### Part 3: The Residue Report

  Here is where the mapping leaks.

  #### 1. What Epistemic Game Theory (EGT) has that Distributed Systems (DS) lacks:
  **Strategic Rationality vs. Correctness.**
  *   **DS Assumption:** Nodes are either **Correct** (follow protocol) or **Faulty** (crash or arbitrary Byzantine).
  *   **EGT Assumption:** Agents are **Rational** (maximize utility). They will follow the protocol *only if* it is a Nash Equilibrium to do so.
  *   **The Residue:** DS protocols often assume honest majority. If a node can gain utility by deviating (e.g., withholding shares to learn the secret first, or double-signing to earn fees), standard BFT proofs don't catch it. This is the domain of **Rational Cryptography** and **Mechanism Design in Consensus** (e.g., Slasher in PoS). EGT provides the vocabulary to prove a protocol is *incentive-compatible*, not just *safe*. DS treats deviation as a fault; EGT treats it as an optimization.

  #### 2. What Distributed Systems has that Epistemic Game Theory lacks:
  **Verifiability and False Knowledge.**
  *   **EGT Assumption:** The Knowledge Axiom ($K_i \phi \implies \phi$). If an agent knows $\phi$, $\phi$ is true. Agents cannot "know" falsehoods.
  *   **DS Reality:** **Byzantine Faults.** A node can claim $K_i(\text{block}=A)$ while the truth is $B$.
  *   **The Residue:** DS has developed **Cryptographic Evidence** (signatures, Merkle proofs, SNARKs) to verify knowledge claims. Standard epistemic logic assumes veridical knowledge. To model DS, you need a logic of **Belief** ($B_i \phi$) rather than Knowledge, augmented with **Verification Primitives**.
  *   **Equivocation:** DS handles **Equivocation** (sending different values to different nodes). Standard EGT models usually assume public announcements or pairwise communication without the ability to lie about *what* was said to a third party (unless modeling cheap talk). DS uses **Quorums** specifically to intersect lies and reveal equivocation.

  #### 3. The Fundamental Tension: Synchrony vs. Asynchrony
  *   **EGT:** Often assumes a logical timeline where "everyone knows" can be evaluated.
  *   **DS:** The **FLP Impossibility** result is the hard boundary. True Common Knowledge requires a form of synchrony (bounded latency).
  *   **Residue:** DS engineers live in the land of **Eventual Consistency** and **Lease-based Locks**. We trade the purity of Common Knowledge for liveness. We use **Timeouts** to simulate synchrony. When a timeout fires, we *act as if* we have Common Knowledge (the leader is dead), even though we don't know it. This is **Pragmatic Common Knowledge**, which EGT often dismisses as irrational, but DS treats as engineering necessity.

  ### Summary Recommendation

  Your identification is valid but requires a **modality shift**.
  *   **Common Knowledge** is the **Ideal Consensus** (Synchronous, Fault-Free).
  *   **Replicated State Machines** are **Approximate Consensus** (Asynchronous, Fault-Tolerant).

  When you read rationalist invokes of Aumann, translate "Common Knowledge" to "Quorum Intersection." When they say "cannot agree to disagree," read "Safety Violation."

  The residue you should care about most is the **Rational vs. Byzantine** gap. Your field assumes nodes lie arbitrarily; their field assumes nodes lie strategically. The intersection is **Accountable State Machines**, where deviations are not just detected but cryptographically attributed and penalized. That is where your consensus protocols and their game theory actually merge into a single object.
