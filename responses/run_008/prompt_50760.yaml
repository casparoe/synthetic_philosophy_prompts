      *   Support Camp 2 as the best *operational* definition for this specific legal context ("heritage organism" implies age/continuity).
      *   Address the graft: It creates a "partial individual" or a "chimeric individual." Don't let it paralyze the decision.
      *   Advice on the vote: Vote for Camp 2's *framing* (protect the genetic/physiological system) but acknowledge Camp 3's *caveat* (boundaries are functional, not absolute).

