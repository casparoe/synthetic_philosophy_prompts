answer: |-
  Your unease is well-founded. The argument your friend has constructed is elegant, but it relies on a subtle equivocation between **logical dependence** and **evidential correlation**. To preserve the Platonia result (3) without accepting the sweeping moral obligations of (6), you must reject the inference from (3) to (5), specifically at step (4).

  Here is the diagnosis of the false step, the vindication of your suspicion regarding randomisation, and an account of the price you must pay to hold this line.

  ### The False Step: Step (4)

  The error lies in the transition from the perfect mirror of the Platonia dilemma to the partial resemblance of the stranger in the Prisoner's Dilemma. Your friend treats the connection between agents as a continuous variable of evidential support that degrades smoothly from 100% to 0%. This is incorrect.

  In the Platonia dilemma, the link between you and the other nineteen players is not merely evidential; it is **constitutive**. Hofstadter's superrationality assumes that you are not just similar to the other players, but that you are instantiating the *same decision procedure*. If the reasoning is identical and the information is identical, the conclusion is not just *likely* to be the same; it is *logically necessitated* to be the same. There is no possible world in which you, reasoning perfectly on this data, conclude $A$, while your identical twin, reasoning perfectly on the same data, concludes $B$.

  Step (4) conflates this logical necessity with statistical correlation. It suggests that if a stranger is 95% likely to reason as you do, you have 95% of the logical leverage you have in Platonia. But logical leverage is binary. Either you are running the same algorithm, or you are not. If you are running different algorithms, even if they usually agree, your output does not *fix* theirs. It merely predicts it.

  By sliding from logical identity to statistical resemblance, your friend collapses Superrationality into standard Evidential Decision Theory (EDT). EDT says, "Act so that the news of your act is good." Superrationality says, "Act so that the *logical output of your decision function* yields the best result." These coincide in Platonia, but they diverge in the case of the stranger.

  ### The Role of Randomisation

  Your suspicion regarding randomisation in (3) is astute and points directly to the distinction between **policy** and **act**.

  In the Platonia dilemma, the shared reasoning does not prescribe a specific token act (e.g., "Send the telegram"). It prescribes a **mixed strategy** or a policy: "Randomise with probability $p=1/20$." Because the reasoners are identical, they all select the same probability $p$. However, unless they share a random seed (which they do not), their *token acts* will not be perfectly correlated. One may send while another does not.

  The superrational calculation works because the agents correlate on the *selection of the policy*, not necessarily on the *execution of the act*. The expected utility is calculated over the distribution defined by the shared policy.

  In your friend's Step (5), regarding the Prisoner's Dilemma, the argument shifts. It assumes that your settling on cooperation is evidence that the stranger settles on cooperation. This treats the *act* itself as the locus of correlation. But if the connection is merely evidential (95% similarity), your act is a *symptom* of your algorithm, not a *determination* of theirs. In Platonia, your choice of policy *is* their choice of policy, because it is the same choice. In the stranger case, your choice is merely a reliable indicator.

  Therefore, the randomisation matters because it highlights that superrationality is about coordinating on the **decision function**, not merely trading evidence about outcomes.

  ### The Gerrymandering Worry

  You worry that drawing a line between the perfect mirror and the 95% mirror looks gerrymandered. It is not, provided you understand what is being measured.

  If you are measuring **statistical correlation**, then yes, a sharp boundary is arbitrary. Correlation comes in degrees. However, Superrationality is not based on statistical correlation; it is based on **algorithmic identity**.

  *   **Case A (Platonia):** We run the same source code. My decision logically fixes yours.
  *   **Case B (Stranger):** We run different source code that happens to produce similar outputs. My decision does not fix yours; it only suggests what yours might be.

  The boundary is not drawn where the payoff is computed; it is drawn at the metaphysical distinction between *identity* and *similarity*. To claim that 99.9% similarity grants you logical leverage is to confuse a very strong prediction with a logical constraint. If the stranger's algorithm differs from yours by even a single bit, your decision no longer subjunctively determines theirs. Thus, the drop-off from 100% to 99% is indeed a cliff, not a slope, because logical dependence is an all-or-nothing affair.

  ### The Price of This Diagnosis

  If you reject (4) to save (3) from (6), you are effectively adopting a position akin to **Functional Decision Theory (FDT)** or **Logical Decision Theory**, rather than Evidential Decision Theory. This comes with costs you must accept.

  1.  **Limited Scope:** You must concede that superrationality is a much rarer phenomenon than your friend claims. It applies only when you have good reason to believe you are facing an agent running the *same* decision algorithm. This might apply to clones, sophisticated AI copies of yourself, or perhaps members of your specific reading group who have explicitly adopted the same reasoning framework. It does not apply to "humans in general" merely because they resemble you.
  2.  **No Moral Bonanza:** You lose the comforting implication of (6). You are not obliged to give to charity merely because your giving is evidence that others will give. You are only obliged to do so if your giving logically determines theirs. This restores the standard separation between prudence and morality that your friend's argument dissolved.
  3.  **Epistemic Burden:** You bear the burden of proving the algorithmic identity. In Platonia, it is stipulated by the thought experiment. In the real world, establishing that a stranger runs your exact decision function is difficult. You cannot simply assume it based on general resemblance.

  ### Conclusion

  Your friend's argument is valid only if one accepts that evidential correlation is sufficient for rational coordination. If you wish to maintain that the Platonia solution is correct *because* of the logical link, but that the Charity conclusion is incorrect *because* the link is merely evidential, you must reject Step (4).

  The cost is that superrationality ceases to be a general theory of ethics or broad social cooperation. It becomes a precise tool for specific instances of logical entanglement. This is less glamorous than your friend's vision, but it avoids the absurdity of making your character a public good managed for evidential purposes. You keep the nineteen million dollars in the thought experiment, but you are not forced to empty your wallet for every stranger who looks like they might reason as you do.
