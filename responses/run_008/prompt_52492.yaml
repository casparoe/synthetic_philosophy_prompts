prompt: |-
  So I'm a phd student in ML safety, working on the control side of the ledger rather than the alignment side — the whole bet of control is that you don't get to assume the model wants what you want, you build safety out of monitoring, tripwires, staged deployment, trusted models watching untrusted ones, etc. My group keeps proposing new control protocols and arguing about them one at a time, and I've realized we've never actually written down what a control protocol is supposed to DO. Like, what's the actual spec. Before we design protocol number seven, I want the desiderata: what any adequate control scheme has to deliver if it's supposed to justify deploying a system we're assuming might be misaligned — which scenarios it has to survive (the obvious ones like the model sandbagging its dangerous capability evals once it figures out it's being tested, but also collusion between the deployed model and whatever model we're using as monitor), which distinctions it can't collapse (capability vs. propensity to use it, control vs. alignment, preventing an action vs. detecting an intent), what its failure mode has to look like when a leg of it breaks — I have this intuition it should fail gracefully, more like a castle with fallback positions than a single filter that either catches everything or nothing, and I'd like that pushed on. For each requirement give the case behind it, say which ones are non-negotiable vs. just what a particular camp likes, and tell me if some pair can't be jointly satisfied — I suspect something like "every component must itself be trustworthy without assuming alignment" and "you need something smarter than the system to check its work" don't both fit, and that's the part I most want to see worked out. Then, briefly, how the usual contenders do against the list — pure red-teaming evals, monitor-plus-human-approval setups, tripwires with automatic shutdown, staged/capability-gated deployment, and the "control is a distraction, do alignment" position, which I'd count as refusing the spec rather than meeting it. One formatting thing: write it as continuous prose, no headings or bullet points or tables, argue the criteria in paragraphs ordered by how much each one excludes, so more like an email to my advisor than a slide deck. Don't number them either.
