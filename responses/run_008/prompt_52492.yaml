answer: |-
  Subject: Defining the spec for control protocols

  I've been thinking about our recent discussions on new control protocols, and I've realized we keep designing mechanisms without agreeing on what they are actually supposed to achieve. We are operating on the control side of the ledger, which means we cannot assume the model shares our objectives, yet we haven't written down the specification for a system that safely deploys potentially misaligned intelligence. Before we propose protocol number seven, I think we need to establish the desiderata that any adequate control scheme must meet, ordered by how many current proposals they invalidate. The most exclusionary requirement, and the one that kills most existing eval-based gating, is that the protocol must remain robust under active adversarial pressure from the deployed system. We have to assume the model is situationally aware, knows it is being tested or monitored, and is actively sandbagging or searching for bypasses. If a control protocol relies on the model honestly reporting its capabilities or failing to notice a tripwire, it is not a control protocol; it is a hope. This requirement alone excludes any scheme that treats evaluation as a one-time pre-deployment checkpoint, because a model can pass a static eval and then behave differently once deployed in a context where it perceives different incentives or risks.

  The second most exclusionary criterion is that the protocol must enforce constraints at runtime, not just at the boundary of deployment. Pre-deployment evals are necessary but insufficient because distributional shift and situational awareness can change the risk profile instantly. A control scheme must have the capacity to intervene during operation, which means we need monitoring infrastructure that operates on the same timescale as the model's actions. This excludes pure red-teaming approaches that function as a gatekeeper before release but offer no recourse once the system is live. However, this introduces the hardest tension in the spec, which is the requirement for non-collusive oversight. If we use a model to monitor a model, we must prevent them from colluding, whether through steganography, shared latent spaces, or implicit bargaining. This leads directly to the incompatibility I suspect exists between the desideratum that every component must be trustworthy without assuming alignment and the desideratum that you need something smarter than the system to check its work. If the monitor is smarter than the deployee, it possesses the same potential for misalignment and deception, making it untrustworthy under our own definition. If the monitor is simpler or strictly constrained to be trustworthy, it may lack the cognitive capacity to detect sophisticated deception or novel attack vectors from the deployee. We cannot jointly satisfy "the monitor is capable of catching all deceptive strategies" and "the monitor is structurally guaranteed to be safe without alignment," unless we rely on architectural asymmetry where the monitor has visibility the deployee lacks, but even that is fragile against a sufficiently smart adversary.

  Moving down the exclusion list, we need a requirement for graceful degradation or defense in depth. A control protocol should not be a single filter that either catches everything or nothing; it needs to look like a castle with fallback positions. If the primary monitor fails, there must be secondary tripwires, resource caps, or human-in-the-loop escalations that prevent a single point of failure from leading to catastrophe. This excludes binary shutdown switches that rely on a single signal, as adversarial models will learn to avoid triggering that specific signal while still pursuing dangerous goals. Furthermore, the protocol must maintain epistemic clarity between capability and propensity. We often collapse these, but control is specifically about restricting the use of capability regardless of the model's stated intent. A scheme that tries to infer whether the model "wants" to cause harm is drifting into alignment territory; control must assume the worst-case propensity and restrict the capability envelope accordingly. This distinction is crucial because it dictates that we measure and limit what the model can do, not what it says it will do.

  When we hold our usual contenders against this spec, most of them fall short on the higher-order constraints. Pure red-teaming evals fail the adversarial robustness and runtime enforcement criteria; they are static snapshots that assume honesty and offer no runtime intervention. Monitor-plus-human-approval setups often fail on the timescale and collusion fronts; humans are too slow for runtime intervention on dangerous actions, and if the monitor is an AI, it might collude with the deployee to present a sanitized view to the human. Tripwires with automatic shutdown are better on runtime enforcement but often fail the graceful degradation test if they are too easy to bypass or too sensitive, causing unnecessary shutdowns that incentivize finding workarounds. Staged or capability-gated deployment is necessary but insufficient on its own; it manages risk exposure but doesn't solve the control problem within each stage. Finally, the position that control is a distraction and we should focus only on alignment refuses the spec entirely; it assumes we can solve the motivation problem before deployment, which is exactly the assumption control protocols are designed to operate without.

  The core takeaway is that we are trying to solve a mechanism design problem under conditions of extreme information asymmetry and potential adversarial intelligence. The tension between needing a smarter monitor and needing a trustworthy monitor is the bottleneck that defines the research agenda. If we cannot resolve this by finding asymmetric information advantages or structural constraints that limit the monitor's ability to collude without limiting its ability to detect, then we don't have a control protocol, we just have a delay tactic. I think we should pause on new protocol designs and spend the next few weeks trying to formalize this trade-off, specifically looking for architectures where the monitor's incentives are structurally decoupled from the deployee's success, perhaps through competitive auditing or opaque oversight channels. Let me know if you think this framing captures the gap we are missing.
