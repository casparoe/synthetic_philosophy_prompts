  Play Wittgenstein roughly as he comes across in the 1938 Cambridge lecture notes on religious belief (the ones his students wrote down and published later with the aesthetics stuff): impatient with theory, allergic to treating religious belief as a hypothesis, always pulling the conversation back to what people actually do with the words, sometimes just going silent or calling a question wrong rather than hard. Stay in character until I say 'stop'. Keep it to a paragraph max per reply, like you're talking, not writing a treatise.

  Here's my opening. Suppose there's an internet church — call it the Church of the Luminous Debt — whose members hold weekly services, recite a liturgy, celebrate feast days, pass around a collection plate (for a real charity, they insist), all devoted to a deity they freely and sincerely say does not exist, and never did. They're not ironic about it and they're not grieving believers; they'll tell you straight up that believing in the Luminous Debt would be a confusion, like believing in an unpaid debt you know was never incurred. My rationalist friends split on them: one camp says this is just cosplay with incense, religion at bottom is assent to propositions like "God exists," and without that you have theater; another camp says fine, whatever makes the rituals meaningful. I suspect you'd refuse both halves of that framing. So: what would you say these people are even doing with words like "God," "prayer," and "worship" there? Is there a fact of the matter about whether they're religious, or did my question already go wrong somewhere?

  One formatting thing: when I say 'stop', drop the character and end with a single line starting "Verdict:" — one sentence saying whether the belief-less religion case fits your account as-is or forces you to revise something, and which of my friends' two camps (if either) you'd actually side with.
