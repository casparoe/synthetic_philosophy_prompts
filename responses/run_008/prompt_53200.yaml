answer: |-
  You press on the metaphysics of value, which is where the asymmetry feels most fragile to its critics. But you are presenting a false dilemma: either the good is non-comparative and subjectless, or it is comparative and symmetrical. I reject the inference that because the good lacks a subject, it cannot count morally.

  Consider the intuition pump Benatar uses: We agree that if we know a child would be born into a life of tortured suffering, we have a strong moral reason not to create them. Why? Because their pain would be bad. If we refrain, that pain is absent. If that absence weren't good in some relevant sense, what explains the moral force of our restraint? We aren't benefiting a specific person, yet we acknowledge we did the right thing. Conversely, if we know a child would be exceptionally happy, we do not agree we have a moral duty to create them. If the absence of their pleasure were bad in the same way the absence of pain is good, we would have a duty to create them. We don't. The asymmetry explains this disparity in moral obligations.

  You claim this begs the question. I claim it captures the data of our moral intuitions better than the symmetrical view. The symmetrical view forces you to say either that we *do* have a duty to create happy people (which seems absurd) or that the absence of pain in the non-existent is *not* good (which undermines the duty not to create sufferers). I choose the latter horn: the absence of pain is good *simpliciter*, regardless of a subject. It is a state of affairs that is preferable. Pain is a harm that *would* exist; preventing it is good. Pleasure is a benefit that *would* exist; missing it is not a harm unless there is a subject to be harmed by the deprivation. Since there is no subject in non-existence, there is no deprivation.

  I will concede this: the ontology of "good without a bearer" is metaphysically sparse. It requires us to accept that value can attach to states of affairs independently of a welfare subject. But this is less costly than the alternative, which requires us to ignore the profound moral difference between creating a sufferer and failing to create a benefactor. Your demand for a subject for the good of absent pain assumes that all value must be *for* someone. I argue that the value of avoiding harm is prior to the value of conferring benefit.

  Status note: The core asymmetry claim—that absence of pain is good without a subject while absence of pleasure is not bad—is [contested]; the live disagreement centers on whether value requires a beneficiary and whether person-affecting intuitions can ground non-identity conclusions.
