prompt: |-
  I'm preparing to write a paper on self-deception, but before I commit to defending or attacking any particular account, I want to be clear about what I should be demanding of one. Too much of the literature consists of people proposing a theory and then testing it against their two favorite cases, and I suspect the interesting disagreements are really disagreements about which requirements are genuine and which are parochial. So I'd like you to write the full specification.

  Act as a professional philosopher of mind who has watched this debate for decades and has no horse in it. Think carefully, and before committing to the list, brainstorm what different camps have implicitly treated as non-negotiable: the intentionality theorists, the deflationists, the divided-mind people — and ask of each of their demands whether it tracks the phenomenon or just their theory of it. Then give me the desiderata.

  Specifically, what must an adequate theory of self-deception deliver?

  - The extension: which cases it must count in (the spouse who "doesn't notice" the obvious, the terminally ill patient, the academic convinced her paper was rejected for political reasons) and which it must count out (lying to another person, ordinary wishful thinking, self-serving memory, akratic belief, or simply being wrong about oneself for unmotivated reasons). For each case, say what hangs on getting it right.
  - The puzzles: the static puzzle (how can one and the same mind intend to get itself to believe p's falsity without that intention defeating itself) and the dynamic puzzle (how the belief is actually acquired — why doesn't the motivated person see through the process?). A theory must solve these, explain them away, or explain why they never really arise — say which you'd accept.
  - The distinctions it cannot collapse: self-deception versus other-deception, believing p while also believing not-p versus ambivalence versus mere credence-shifts, the hot process a theorist of intention describes versus the cold biased evidence-gathering the psychology literature describes.
  - The motivational constraint: why some desires and fears generate self-deception while equally strong ones don't — a theory that makes every motivated belief self-deception explains too much.
  - The empirical constraint: it can't contradict what's actually known about confirmation bias, selective evidence-gathering, and confabulation, but it also can't be so absorbent that "self-deception" just becomes a label for all of it.
  - The normative question: whether a theory owes us an account of when the self-deceived person is responsible or blameworthy for the belief, or whether that's somebody else's job.

  Mark each desideratum as non-negotiable or as a camp prejudice. And most importantly — this is the part I most want to see — flag any pair of desiderata you suspect cannot be jointly satisfied. For instance, if we demand that self-deception be intentional in a full-blooded way and also that it not require an absurd doxastic architecture, is anything left standing? If some subset is jointly unsatisfiable, say so plainly; that would itself be a result worth writing down.

  Then, briefly, run three contenders against the list: a deflationary view on which self-deception is just motivationally biased evidence-gathering (Alfred Mele's sort of picture), Davidson's divided-mind account, and a view on which the self-deceiver deliberately avoids registering what he is up to rather than believing its negation. Keep the scorecard short — the thinking is in the criteria, not the scoring. A table is fine if you want one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher of mind (neutral, experienced, no horse in the race).
      *   **Task:** Write a full specification (desiderata) for a theory of self-deception.
      *   **Key Components:**
          *   Extension (In/Out cases).
          *   Puzzles (Static/Dynamic).
          *   Distinctions (Self vs. Other, Belief states, Hot vs. Cold).
          *   Motivational Constraint (Specificity of desire).
          *   Empirical Constraint (Psychology compatibility).
          *   Normative Question (Responsibility).
          *   **Crucial:** Mark desiderata as Non-Negotiable vs. Camp Prejudice.
          *   **Crucial:** Flag jointly unsatisfiable pairs (trade-offs).
          *   **Evaluation:** Briefly test three contenders (Mele/Deflationary, Davidson/Divided-Mind, Avoidance/Non-Belief) against the list.
      *   **Tone:** Rigorous, analytical, slightly weary of the literature's excesses, precise.

  2.  **Deconstruct the Literature (Mental Brainstorming):**
      *   *Intentionalists (Davidson, Pears):* Demand intentionality. Solve static puzzle via partitioning. Risk: Homuncularism, over-intellectualization.
      *   *Deflationists (Mele):* Deny intention. Focus on bias. Solve static puzzle by denying the paradox. Risk: Collapses into ordinary error/wishful thinking, loses the "deception" aspect.
      *   *Non-Belief/Avoidance (Bach, others):* Self-deceiver doesn't fully believe $p$, just avoids thinking about $\neg p$. Risk: Doesn't capture the conviction often present.
      *   *The Paradox:* How can I intend to believe $p$ when I know $\neg p$? If I know $\neg p$, I don't believe $p$. If I succeed, I didn't know $\neg p$ to start.
      *   *Empirical Reality:* People aren't perfectly rational agents. Biases are subconscious.
      *   *Normativity:* We blame self-deceivers. If it's just a bias, is blame appropriate?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Extension:* Need to capture the "stubborn denial" cases (spouse, patient) but exclude mere lying or simple mistakes. *Status:* Non-negotiable (must match intuition).
      *   *Puzzles:* Static (logic) and Dynamic (process). *Status:* Non-negotiable (must address them, even if by dissolving).
      *   *Distinctions:* Self vs. Other deception is key. Belief vs. Pretense. *Status:* Non-negotiable.
      *   *Motivation:* Not all wishes lead to self-deception. *Status:* Non-negotiable (specificity).
      *   *Empirical:* Must fit cognitive science. *Status:* Non-negotiable.
      *   *Normative:* Responsibility. *Status:* Camp Prejudice (some think it's essential, others think it's downstream). *Correction:* Actually, a theory *should* explain the conditions for responsibility, even if it doesn't prescribe a verdict. Let's make "accounting for blame practices" non-negotiable, but the specific verdict prejudicial.
      *   *Trade-offs:* This is the meat. Intentionality vs. Psychological Plausibility. Distinct Beliefs vs. Unity of Mind.

  4.  **Refining the "Jointly Unsatisfiable" Section:**
      *   This is the most important part of the prompt. I need to identify the "Impossible Trinity" of self-deception theories.
      *   Candidate 1: Strong Intentionality + Unified Mind + Full Belief. (Impossible).
      *   Candidate 2: Empirical Plausibility + Normative Blameworthiness + Deflationary Mechanism. (Hard to blame someone for subconscious bias).
      *   Candidate 3: Solving the Static Puzzle + Preserving the "Deception" Analogy. (If you solve the puzzle by removing intention, is it still deception?).

  5.  **Developing the Scorecard:**
      *   *Mele (Deflationary):* Great on empirical, fails on "deception" intuition (no intention).
      *   *Davidson (Partitioning):* Great on intention/puzzle, fails on empirical plausibility (homunculus).
      *   *Avoidance (Bach/etc.):* Great on puzzle, fails on extension (sometimes they *do* believe).

  6.  **Writing the Response (incorporating the persona):**
      *   *Voice:* Academic, precise, slightly critical of the field's history.
      *   *Structure:* Introduction -> Desiderata (categorized) -> The Impossible Trade-offs -> The Scorecard.
      *   *Formatting:* Use bolding, lists, and a table for clarity.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I mark Non-Negotiable vs. Prejudice? Yes.
      *   *Check:* Did I flag the incompatible pairs? Yes, this needs a dedicated section.
      *   *Check:* Is the evaluation brief? Yes, keep it to a table or tight summary.
      *   *Refinement on Normativity:* Make sure to distinguish between "explaining blame" and "entailing blame."
      *   *Refinement on Extension:* Ensure the "academic rejected for political reasons" case is handled (that's often self-deception, but borders on rationalization).

  8.  **Final Polish:** Check tone. Ensure it sounds like a seasoned philosopher talking to a colleague. (e.g., "Let's be honest," "The literature is littered with...")

  *(Self-Correction Note)*: I need to make sure I don't just list the desiderata but explicitly analyze *why* some are prejudices. For example, the demand for "Intentionality" is often a prejudice of the Traditionalist camp, not a feature of the phenomenon itself. I need to be sharp on that.

  *(Final Plan)*:
  1. Intro: Set the stage, acknowledge the mess.
  2. The Specification (Desiderata): Grouped by category, tagged (NN/CP).
  3. The Incompatibility Matrix: The core philosophical insight.
  4. The Scorecard: Mele, Davidson, Avoidance.
  5. Closing thought.

  Let's write it.cw
answer: |-
  **To:** Prospective Author
  **From:** Senior Colleague (Philosophy of Mind)
  **Re:** Specification for a Theory of Self-Deception

  You are right to be suspicious. The literature on self-deception is a graveyard of theories that solved a logical puzzle by annihilating the phenomenon, or preserved the phenomenon by positing psychological impossibilities. The debate has stagnated because participants treat their theoretical commitments as data.

  Below is the specification you asked for. I have distilled this from thirty years of watching intentionalists, deflationists, and divisionists talk past one another. I have marked each desideratum as **Non-Negotiable (NN)** (if a theory fails this, it misses the phenomenon) or **Camp Prejudice (CP)** (if a theory fails this, it merely offends a specific theoretical tribe).

  Most importantly, I have identified the **Incompatibility Clusters**. If you do not address these trade-offs, your paper will just be another entry in the graveyard.

  ***

  ### I. The Specification

  #### 1. Extension (The Data Set)
  *   **Must Include (NN):**
      *   *The Stubborn Spouse:* Believes fidelity despite overwhelming evidence. (Hangs on: Capturing the resistance to evidence).
      *   *The Terminal Patient:* Maintains hope of recovery against medical consensus. (Hangs on: Distinguishing hope from belief).
      *   *The Rationalizing Academic:* Believes rejection was political, not qualitative. (Hangs on: Capturing the distortion of reasoning, not just perception).
  *   **Must Exclude (NN):**
      *   *Other-Deception:* Lying to someone else. (Hangs on: Preserving the *self* aspect).
      *   *Unmotivated Error:* Simply being wrong due to lack of data. (Hangs on: The motivational constraint).
      *   *Fantasy/Pretense:* Knowing it isn't true but imagining it is. (Hangs on: The doxastic constraint).
      *   *Akrasia:* Believing you should stop smoking but lighting up. (Hangs on: Distinguishing belief from action).

  #### 2. The Puzzles (The Logical Constraints)
  *   **The Static Puzzle (NN):** How can one simultaneously hold $p$ and $\neg p$ (or intend to induce $p$ while knowing $\neg p$) without logical contradiction?
      *   *Requirement:* The theory must either solve this (show how the states coexist), dissolve this (show one state isn't what it seems), or deny the premise (show the contradiction is illusory).
  *   **The Dynamic Puzzle (NN):** How is the belief acquired without the agent recognizing the manipulation? If I know I'm biasing my evidence, the bias fails.
      *   *Requirement:* An account of the mechanism that bypasses conscious monitoring.

  #### 3. Distinctions (The Boundaries)
  *   **Self vs. Other Deception (NN):** Must explain why the "deceiver" and "deceived" are the same agent without requiring them to be distinct sub-agents (unless justified).
  *   **Belief vs. Credence/Avowal (NN):** Must distinguish actually believing $p$ from merely saying $p$ or assigning it high probability while acting on $\neg p$.
  *   **Hot vs. Cold Bias (CP):** *Intentionalists* demand a "hot" motivated push; *Psychologists* often describe "cold" cognitive glitches.
      *   *Verdict:* A theory must accommodate motivation, but demanding a *conscious* hot intention is a **Camp Prejudice**.

  #### 4. The Motivational Constraint (NN)
  *   Not every desire produces self-deception. I desire to be rich, but I don't necessarily deceive myself that I am.
  *   *Requirement:* The theory must explain why *specific* threats or desires trigger the mechanism (usually those touching on self-concept or existential anxiety) while others do not.

  #### 5. The Empirical Constraint (NN)
  *   Must be compatible with cognitive science (confirmation bias, selective attention, confabulation).
  *   *Requirement:* Cannot posit a homunculus or a mental architecture that contradicts known modularity or processing limits.

  #### 6. The Normative Question (CP/NN Hybrid)
  *   **Accountability (NN):** The theory must explain *why* we hold self-deceivers responsible (or why we don't).
  *   **Blameworthiness (CP):** Whether the theory must conclude the agent *is* blameworthy is a prejudice. Some theories (deflationary) suggest we aren't; others (intentionalist) suggest we are. The theory must simply make the practice of blaming intelligible.

  ***

  ### II. The Incompatibility Clusters (The "Impossible Trinity")

  Here is the value I can add that most papers miss. You cannot satisfy all the Non-Negotiables simultaneously without making a trade-off. You must choose which bullet to bite.

  **Cluster A: The Intentionality vs. Empirical Plausibility Trade-off**
  *   **Desideratum 1:** Self-deception is intentional (like other-deception).
  *   **Desideratum 2:** The mind is a unified, empirically plausible system (no homunculi).
  *   **Desideratum 3:** The agent actually believes the falsehood (not just pretends).
  *   **The Conflict:** You cannot have all three.
      *   If it's **Intentional** and **Belief**, you need **Partitioning** (violates Empirical Plausibility/Unity).
      *   If it's **Intentional** and **Unified**, you usually lose **Belief** (becomes avoidance/pretense).
      *   If it's **Unified** and **Belief**, you usually lose **Intention** (becomes bias).
  *   *Advice:* Pick one to relax. Most modern theories relax Intention.

  **Cluster B: The Normative vs. Deflationary Trade-off**
  *   **Desideratum 1:** Self-deception is just motivated bias (Deflationary/Empirically sound).
  *   **Desideratum 2:** Self-deceivers are morally blameworthy for their beliefs.
  *   **The Conflict:** If self-deception is merely a subconscious cognitive glitch (like a visual illusion caused by desire), blame seems inappropriate. If we want to preserve blame, we need some element of agency or responsibility that pure deflationism struggles to locate.
  *   *Advice:* If you go deflationary, you must reconstruct responsibility carefully (e.g., responsibility for prior habits).

  **Cluster C: The Static Puzzle vs. The "Deception" Label**
  *   **Desideratum 1:** Solve the Static Puzzle (no contradiction in mind).
  *   **Desideratum 2:** Preserve the analogy to Interpersonal Deception.
  *   **The Conflict:** Interpersonal deception requires the deceiver to know the truth. If you solve the Static Puzzle by saying the self-deceiver *doesn't* know the truth (they just biased the evidence), you have solved the logic but killed the analogy. It's no longer "deception"; it's "error."
  *   *Advice:* Be honest if your theory eliminates deception to save the mind.

  ***

  ### III. Scorecard: Three Contenders

  Here is how the major contenders fare against the specification.

  | Desideratum | **Deflationary (Mele)** | **Divided-Mind (Davidson)** | **Avoidance/Non-Belief (Bach)** |
  | :--- | :--- | :--- | :--- |
  | **Extension** | **Pass.** Captures spouse/patient cases well. | **Pass.** Captures the stubbornness well. | **Mixed.** Struggles with cases where agent acts fully on the false belief. |
  | **Static Puzzle** | **Dissolves.** Denies intention, so no paradox. | **Solves.** Partitioning allows $p$ and $\neg p$ in separate "modules." | **Dissolves.** Agent doesn't believe $p$, just avoids $\neg p$. |
  | **Dynamic Puzzle** | **Pass.** Bias operates subconsciously. | **Mixed.** How does the partition stay stable? | **Pass.** Attention is redirected, not fought. |
  | **Distinctions** | **Fail.** Collapses Self/Other deception (no intention in either). | **Pass.** Preserves Self/Other analogy via partitioning. | **Fail.** Collapses Self-Deception into Ignorance/Avoidance. |
  | **Empirical** | **Strong.** Fits psych literature on bias perfectly. | **Weak.** Partitioning is metaphysically heavy/empirically dubious. | **Strong.** Fits attentional models. |
  | **Normative** | **Weak.** Hard to blame for subconscious bias. | **Strong.** Intentionality preserves blame. | **Mixed.** Blame for avoidance is possible but nuanced. |
  | **Primary Cost** | **Loss of "Deception".** It's just motivated error. | **Loss of Plausibility.** Posits mysterious mental walls. | **Loss of Conviction.** Denies the agent actually believes the lie. |

  ### IV. Final Recommendation

  If you want to write a paper that actually moves the needle, do not try to prove one of these is "correct." They are all engineering compromises.

  Instead, use the **Incompatibility Clusters**. Argue that the field has been chasing a coherent definition of self-deception that satisfies *all* Non-Negotiables, and demonstrate that this is a category error. The most fruitful paper would argue that "Self-Deception" is not a natural kind, but a cluster concept where different cases satisfy different subsets of the desiderata.

  Or, if you must defend a theory:
  1.  **Accept the Deflationary cost:** Admit it isn't "deception" in the strict sense, but argue the *harm* is identical to deception, preserving the normative weight.
  2.  **Accept the Partitioning cost:** Argue that modular mind theories (evolutionary psychology) make Davidson's "partitions" empirically respectable after all.

  Don't hide the trade-off. That is where the philosophy lives.
