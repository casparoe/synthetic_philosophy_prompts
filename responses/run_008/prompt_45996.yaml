  Here is the principle that best organizes your intuitions while resolving their internal tensions.

  ### The Principle of Specific Dissolution

  **Genocide is the specific intent to terminate the intergenerational continuity of a stable, identity-based group (national, ethnic, racial, or religious), achieved through either the physical elimination of members or the irreversible severing of the cultural mechanisms required for the group's reproduction.**

  This principle synthesizes Lemkin's sociological insight (groups are more than the sum of their living members) with the Convention's legal safeguards (intent and protected categories act as firewalls against over-expansion). Here is how the clauses map to your verdicts:

  1.  **"Specific Intent":** This clause does the heavy lifting for your **Climate Change** verdict. Without a perpetrator possessing the *aim* of group termination, catastrophic outcome alone is insufficient. It also secures your **Partition** verdict: the intent was territorial removal (ethnic cleansing), not the total dissolution of the group's continuity, as Muslims and Hindus persisted in the newly formed states.
  2.  **"Intergenerational Continuity... [or] Severing of Cultural Mechanisms":** This saves your **Boarding Schools** verdict. It acknowledges that killing the "group" does not require killing every body; it requires killing the future of the group by destroying language, kinship, and transmission. It also rescues the **Holodomor**: even if the stated goal was grain requisition, the *weaponization* of famine against a national subset demonstrates an intent to break the group's cohesion and continuity, satisfying the "specific intent" requirement through inferred teleology.
  3.  **"Stable, Identity-Based Group (national, ethnic, racial, religious)":** This maintains your **Pol Pot** verdict. By adhering to the Convention's protected categories, you exclude political and class groups, preserving the legal utility of the term even if it creates moral resentment.
  4.  **"Physical Elimination... [or]... Cultural Mechanisms":** This secures the **Herero and Nama** verdict as the paradigmatic case where both physical and cultural destruction align.

  ### The Verdict You Must Give Up

  This principle cannot save your gut verdict on the **Atlantic Slave Trade**. You stated your gut says "not genocide" because the aim was exploitation, not destruction, yet you admitted this disturbs you. Under the Principle of Specific Dissolution, the Slave Trade **is** genocide.

  Here is why you must revise this verdict: The distinction between "exploitation" and "destruction" collapses when the *method* of exploitation requires the *destruction* of the group's continuity. Chattel slavery was not merely labor extraction; it was a system that structurally required the severing of kinship lines, the erasure of language, and the prohibition of cultural reproduction to function. You cannot maintain a system of heritable chattel status without intending to destroy the slave's status as a member of a continuing people. The destruction of the group's social fabric was not a side effect; it was a necessary condition of the profit motive. To call this "exploitation" but not "genocide" privileges the economic *goal* over the sociological *reality*, which contradicts your reliance on Lemkin for the Boarding Schools case. If cultural dismantling counts there, it must count here.

  ### Prediction: The Counterinsurgency Case

  **Verdict: Not Genocide.**

