  Subject: Written Opinion regarding the Graphing Calculator Committee Vote

  Dear Principal Evans and Members of the Shared Resources Committee,

  I am writing to submit my recommendation regarding the future of the graphing calculator lending program. Before proposing a solution, I want to start by validating the librarian's position to kill the program. She is not being difficult; she is responding to empirical evidence. Last year, the loss rate was fifty percent within one semester, and the remaining inventory is degraded. In any resource management context, a fifty percent shrinkage rate is unsustainable, and her instinct to stop the bleeding is rational. However, canceling the program entirely sacrifices the equity goal we established, which was to ensure students who cannot afford a hundred-dollar device can still complete their math homework. My recommendation is to keep the program but restructure it using a hybrid model that balances accountability with access, specifically by implementing a mandatory sign-out log combined with a refundable deposit that can be waived for students with documented financial need.

  To explain why this mix is necessary, I think we need to be more precise about how we are using the tragedy of the commons framework, because I believe we have been stretching the analogy to fit too many situations. The classic theory, proposed by Garrett Hardin, applies to resources that are rivalrous, meaning my use diminishes your ability to use it, and non-excludable, meaning it is hard to stop people from using it. The calculator cart fits this perfectly. There are only sixty units, so if I keep one in my backpack, you cannot use it, and previously, there were no barriers to me taking one. This is distinct from the school wifi or the tutoring center, which committee members have also labeled as commons. Wifi is largely non-rivalrous; my connection does not meaningfully slow yours unless the network reaches total capacity, so the incentive to overgraze is much lower. Tutoring is rivalrous in terms of time, but it is inherently excludable because you must book an appointment. By conflating these different types of resources, we risk applying the wrong fixes. The calculator problem is a classic common-pool resource issue, which means Hardin's warning about depletion is relevant here in a way it might not be for wifi.

  However, while Hardin's diagnosis of the problem is widely accepted in economics, his conclusion that resources must be either privatized or strictly regulated by central authority is where the academic consensus becomes contested. This is where the work of Elinor Ostrom becomes relevant. Ostrom, who won the Nobel Prize for this research, demonstrated that communities are often capable of self-governing shared resources without top-down rules or privatization, provided certain conditions are met. These conditions include clear boundaries, monitoring of use, and graduated sanctions for rule-breakers. I bring this up to address the student representative's proposal to publish a list of students who fail to return calculators. While Ostrom's work supports the idea of community monitoring and sanctions, it also emphasizes that sanctions should be graduated and intended to restore cooperation rather than punish. Public shaming is a very severe sanction that risks destroying the social trust required for self-governance. It might work in the short term through fear, but it contradicts the collaborative spirit Ostrom found necessary for long-term sustainability. Therefore, while I appreciate the intent to use social pressure, I cannot support public shaming as a primary strategy.

  On the other side, we have the math teacher's proposal for a twenty-dollar deposit. This addresses the accountability gap, but it introduces a new risk that was mentioned in our last meeting regarding the anticommons. While the term anticommons is technically used in property law to describe fragmented ownership rights, the spirit of the argument here is about barriers to entry. If the cost to borrow the calculator is too high, it excludes the very population the program was designed to help. A twenty-dollar deposit is a significant barrier for a family that cannot afford the hundred-dollar purchase price. If we make access too difficult, we create a situation where the resource exists but goes unused by those in need, which defeats the purpose of the program. This is not a theoretical risk; it is a direct conflict with our equity goals.

  Considering all these factors, my concrete recommendation is to adopt a modified sign-out system that incorporates Ostrom's principles of monitoring and graduated sanctions without relying on public shaming or prohibitive costs. We should require a student ID hold or a nominal refundable deposit, such as five dollars, with a clear waiver process for students on free or reduced lunch plans. This lowers the barrier to entry while still creating a tangible stake in the return of the item. We must maintain a strict sign-out sheet to satisfy the librarian's need for monitoring, which was absent last year. Finally, instead of publishing a list of names, we should implement a private notification system where students are contacted after three days, followed by a meeting with a counselor or administrator if the item is not returned after two weeks. This aligns with Ostrom's finding that sanctions should be graduated. This approach acknowledges the librarian's valid concern about loss, respects the economic reality that calculators are a rivalrous common pool resource, and avoids the pitfalls of both excessive shaming and excessive pricing. I believe this is a defensible middle ground that allows us to vote yes on continuing the program without ignoring the lessons of last year's failure. I am happy to discuss the specifics of the waiver process or the monitoring log in our next session.

  Sincerely,

  [Your Name]
  Junior Class Representative, Shared Resources Committee
