      *   **Recommendation:** Needs to be a mix. Killing it fails equity. Pure shaming is risky/unethical. Pure deposit hurts equity. Pure quota is bureaucratic. A hybrid based on Ostrom's principles (clear check-out, accountability, but low barrier) is best. Maybe a lower deposit or ID hold + clear borrowing limits + community accountability (not public shaming).

