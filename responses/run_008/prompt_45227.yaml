      *   **Tutoring:** Rivalrous (tutor's time) but excludable (appointments).
      *   **Ostrom:** Critiqued Hardin. Showed communities *can* manage commons without privatization or top-down regulation *if* certain design principles are met (clear boundaries, monitoring, graduated sanctions, conflict resolution, etc.).
      *   **Shaming List:** Does this fit Ostrom? Ostrom talks about "graduated sanctions" and monitoring within the community. Public shaming *could* be a sanction, but it risks exclusion and resentment rather than cooperation. It's a strong interpretation.
