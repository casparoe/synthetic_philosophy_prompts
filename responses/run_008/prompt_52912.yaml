answer: |-
  ### Preamble: Mapping the Logical Space

  Before we establish the specifications, we must clear the conceptual underbrush. The frustration you encounter stems from a category error common in comparative historical sociology. The question "Why Britain and not China?" is not a single causal query; it is a *schema* for a family of contrastive explanations.

  In the philosophy of science, a contrastive explanation ("Why P rather than Q?") requires that the explanans (the cause) be present in the fact (P) and absent in the foil (Q), or vice versa. The methodological chaos in your field arises because scholars treat the foil (Q) as stable when it is not. Sometimes Q is "China as a whole," sometimes "The Yangzi Delta," sometimes "A hypothetical China without coal," and sometimes "France."

  Furthermore, there is a tension between *causal sufficiency* (what guaranteed the outcome?) and *causal necessity* (what was required for the outcome?). Most monographs conflate these. A factor can be necessary for Britain's industrialization without being sufficient, and its absence in China might be necessary for China's non-industrialization without being sufficient to explain it. When scholars demand a "prime mover," they are demanding a factor that is both necessary and sufficient across both cases. This is a logical demand that historical reality rarely satisfies.

  Finally, there is the metaphysical divide between *covering law* models (history obeys generalizable rules where X always leads to Y) and *narrative/conjunctural* models (history is a unique concatenation of events where X led to Y only because Z was also present). Your field's "fight" is often a proxy war between these two metaphysics, disguised as an empirical dispute over coal or institutions.

  With this map in hand, here are the methodological desiderata for an adequate answer.

  ***

  ### Desiderata for Adequate Contrastive Causal Explanation

  | Desideratum | Specification & Motivation | Status |
  | :--- | :--- | :--- |
  | **1. Contrast-Class Discipline** | **Specification:** The answer must explicitly define the *foil*. Is the comparison Britain vs. China (national), Britain vs. Yangzi Delta (regional), or Northwest Europe vs. East Asia (systemic)? <br>**Motivation:** An explanation citing "national unity" fails if the foil is the Yangzi Delta (which was economically integrated) but succeeds if the foil is "China as a fragmented empire." Silent swapping of foils allows scholars to claim refutation where there is only misalignment. | **Non-Negotiable** |
  | **2. Logical Symmetry (Contrast-Stability)** | **Specification:** The *causal logic* must apply consistently across adjacent contrasts, even if the *variables* differ. If "high wages caused mechanization" in Britain, the model must account for why high wages in the Yangzi Delta (if present) did not, or why wages were not high there. It need not explain Britain vs. France using the *same* variables, but the *mechanism* linking variables to outcomes must be stable. <br>**Motivation:** Prevents *ad hoc* storytelling. If the mechanism is "resource scarcity drives innovation," it must explain why resource scarcity in other regions did not drive the same innovation. | **Non-Negotiable** (with nuance) |
  | **3. Counterfactual Load** | **Specification:** The answer must specify the minimal change required to flip the outcome. Does the claim imply that inserting Factor X into China yields industrialization? Or merely that removing Factor X from Britain prevents it? <br>**Motivation:** Distinguishes between *trigger* causes and *background* conditions. Deep factors (geography, culture) often fail this test because they cannot be counterfactually varied without changing the identity of the case. If an answer relies on them, it must admit they are boundary conditions, not triggers. | **Non-Negotiable** |
  | **4. Ex-Ante Salience (Well-Posedness)** | **Specification:** The comparison must be justifiable based on conditions prior to the divergence (e.g., c. 1700), not solely on the outcome. <br>**Motivation:** Avoids selection bias. If Britain and China are compared only because Britain won, the sample is rigged. An adequate answer must show why a contemporary observer in 1700 would have viewed these two as the relevant competitors, or admit the comparison is retrospective heuristic only. | **Non-Negotiable** |
  | **5. Mechanism Transparency** | **Specification:** The answer must describe the transmission belt between the cause and the effect. It is insufficient to correlate "property rights" with "growth." One must show how property rights altered incentives, reduced transaction costs, or redirected capital *in that specific context*. <br>**Motivation:** Prevents "black box" explanations where a label (e.g., "culture") is pasted over a gap in the causal chain. | **Non-Negotiable** |
  | **6. Parsimony vs. Conjuncture** | **Specification:** The answer must declare whether it seeks a single sufficient cause (Parsimony) or a necessary concatenation of factors (Conjuncture). <br>**Motivation:** A single-cause explanation is falsifiable by the presence of the cause without the effect. A conjunctural explanation is robust but risks being unfalsifiable ("it was the unique mix"). <br>**Camp Preference:** **Positivist/Neoclassical** camps demand Parsimony (one prime mover). **Institutionalist/Complexity** camps demand Conjuncture (multiple interacting causes). | **Camp Preference** |
  | **7. Temporal Stability** | **Specification:** The explanatory factor must exist *before* the divergence and persist *through* the critical juncture. <br>**Motivation:** Prevents reverse causality. If "industrial culture" is the cause, but that culture emerged *during* industrialization, it is an effect, not a cause. | **Non-Negotiable** |

  ***

  ### Analysis of Methodological Tensions

  You asked for the logical friction points. There are three specific tensions where these desiderata pull against one another, creating the "fight" you observe in the literature.

  #### 1. The Joint Unsatisfiability of Parsimony and Contrast-Class Discipline
  This is the most significant structural flaw in the debate.
  *   **The Tension:** *Parsimony* (Desideratum 6, Positivist preference) demands a single variable (e.g., "coal," "institutions," "culture") that explains the divergence. *Contrast-Class Discipline* (Desideratum 1) demands we specify exactly what we are comparing.
  *   **The Conflict:** If you compare Britain to the *whole* of China, a single variable like "political fragmentation" might work. If you compare Britain to the *Yangzi Delta*, that variable vanishes (the Yangzi was integrated), forcing you to add a second variable (e.g., "coal location"). If you compare Britain to *France*, the "coal" variable weakens, and you need a third (e.g., "state capacity").
  *   **The Result:** You cannot satisfy the demand for a single prime mover *and* maintain rigorous contrast-class discipline across different foils. A single-cause explanation is almost guaranteed to violate Contrast-Class Discipline when the foil shifts slightly. Conversely, a rigorous contrastive analysis almost always yields a conjunctural (multi-causal) result, which violates the Positivist demand for Parsimony. **These two requirements are jointly unsatisfiable for a complex historical event.** One must be sacrificed.

  #### 2. Deep Roots vs. Counterfactual Load
  *   **The Tension:** *Counterfactual Load* (Desideratum 3) requires us to imagine the cause absent to see if the effect disappears. *Deep Roots* explanations (geography, long-term cultural inheritances) posit factors that are effectively immutable.
  *   **The Conflict:** You cannot counterfactually remove Britain's island status or its Carboniferous geology without creating a world that is no longer Britain. Therefore, deep-root explanations technically fail the counterfactual test of "variation." They function as boundary conditions, not causal triggers.
  *   **The Result:** Scholars who insist on strict counterfactuals must reject deep-root explanations as non-causal. Scholars who insist deep roots matter must weaken the definition of "cause" to include "enabling conditions." This is often a source of unacknowledged talking-past-each-other.

  #### 3. Symmetry vs. Historical Specificity
  *   **The Tension:** *Logical Symmetry* (Desideratum 2) demands the causal logic hold across cases. *Historical Specificity* acknowledges that contexts are unique.
  *   **The Conflict:** If you argue "high wages caused mechanization," symmetry demands this hold in the Yangzi Delta. If wages were high there and no mechanization occurred, the theory fails. To save the theory, proponents often add caveats ("yes, but Chinese wages were high *in silver terms* but not *in grain terms*").
  *   **The Result:** Excessive adherence to Symmetry can lead to conceptual gerrymandering, where variables are redefined solely to make the logic fit the specific case, violating Mechanism Transparency.

  #### The Most Exclusionary Requirement
  If I must identify the single requirement that does the most work in excluding familiar styles of answer, it is **Contrast-Class Discipline (Desideratum 1)**.

  *   **Why:** Most monographs survive by sliding between foils. They argue against "China" generally when discussing culture, but switch to "Yangzi Delta" when discussing wages, and switch to "Europe" when discussing states.
  *   **Exclusionary Power:** If you enforce strict Contrast-Class Discipline, **single-cause explanations collapse.** You cannot find one variable that distinguishes Britain from the Yangzi Delta, Britain from France, *and* Britain from the Chinese interior simultaneously. Enforcing this requirement forces the field to admit there is no "The Needham Question," but rather "The Needham Questions" (plural). It excludes the "prime mover" style of historiography entirely, forcing scholars to admit they are explaining a specific regional divergence at a specific time, not a civilizational destiny.

  #### The "Book vs. Sentence" Problem and the Existence of the Question
  You asked whether an adequate answer must be a book rather than a sentence, and what that implies for the "Needham Question."

  **Yes, an adequate answer must be a book (or more).**
  A sentence implies a proposition of the form "X caused Y." This satisfies the Positivist desire for Parsimony but violates Mechanism Transparency and Contrast-Class Discipline. A complex historical divergence involves a chain of mechanisms, boundary conditions, and conjunctural factors. To specify the contrast class, the counterfactuals, the temporal stability, and the transmission mechanisms requires a narrative model, not a variable coefficient.

  **What this implies for the "Needham Question":**
  This fact dissolves the "Needham Question" as a puzzle waiting for a solution key. It reclassifies it as a **research program**.
  *   If the answer were a sentence ("Coal"), the debate would be settled by data.
  *   Since the answer is a book (a model of interaction), the debate is about the *utility* of the model, not its truth value in a binary sense.

  The methodological fight persists because one side treats the question as a lock waiting for a key (Positivist/Parsimony camp), while the other treats it as a tapestry waiting for description (Narrative/Conjuncture camp). As long as the field demands a "solution" (a sentence) to a problem that requires a "specification" (a book), the fight will continue. The specification I have provided above suggests that the only way to settle the debate is to stop asking "Why Britain and not China?" and start asking "Under what specific contrast conditions does factor X discriminate between outcome Y and Z?"

  Until that shift occurs, you are not reading competing answers to one question. You are reading answers to different questions that share the same title.
