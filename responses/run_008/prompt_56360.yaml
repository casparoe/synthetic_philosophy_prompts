answer: |-
  **TO:** City Council
  **FROM:** Climate Advisory Commission
  **DATE:** October 1, 2024
  **SUBJECT:** Recommendation for 2030 Emissions Target Compliance

  **Recommendation**
  The Commission recommends a hybrid policy package to meet the 2030 emissions target: (1) a municipal carbon fee on natural gas and gasoline with revenue returned as a per-household dividend, and (2) an immediate moratorium on permits expanding high-carbon infrastructure (airport capacity, sprawl zoning). This "Price Plus" approach leverages market efficiency while establishing hard physical limits on emissions growth.

  **Rationale**
  A carbon fee is the most administratively feasible tool to signal scarcity across millions of household decisions. By returning revenue as a flat dividend, the policy remains progressive: low-income households, who typically consume less carbon, receive net financial gain. This secures political durability and protects vulnerable residents from energy cost shocks.

  However, price signals alone cannot guarantee the quantity reductions required by physics. Wealthy households can absorb fees without changing behavior, effectively purchasing the right to pollute. To address this, the fee must be paired with structural caps. Halting infrastructure expansion ensures that efficiency gains are not swallowed by population or throughput growth. This satisfies the economic need for flexibility while respecting the ecological need for limits.

  **Addressing Objections**
  We anticipate two primary objections regarding the moral and practical efficacy of pricing.

  *The Moral Status of Pricing:* Some argue that pricing carbon treats the atmosphere as a commodity, allowing the wealthy to buy permission to emit. Others argue a fee is merely a fine for harmful behavior, akin to a speeding ticket. Both insights are partially correct. A low fee is a price; a prohibitive fee is a fine. Our recommendation sets a pre-announced rising schedule designed to exceed the cost of abatement, functioning as a economic prohibition. However, we acknowledge the Cap camp's critique: without a hard quantity limit, wealth inequality can undermine moral intent. Hence the infrastructure moratorium. We cannot price our way out of physical constraints; we must also build less of what causes the problem.

  *The Growth Constraint:* A minority view holds that any growth-compatible instrument fails because the 2030 target is unreachable under current expansion trends. They argue for deliberate demand reduction. We agree that efficiency alone is insufficient if consumption grows unchecked. This is why the fee is paired with a moratorium on expansion. We reject the notion that the Commission should recommend only what is immediately popular; a memo ignored is useless, but a memo that lies about feasibility is worse. However, recommending immediate contraction of existing services risks total political rejection, yielding zero emissions impact. The hybrid approach secures immediate structural limits (ending sprawl/airport growth) while using price signals to manage existing demand. This balances moral truth with political agency.

  **Implementation Timeline**
  To finalize this recommendation for November:

  *   **Oct 10:** Commission legal counsel to verify municipal authority for fuel fees vs. utility franchise fees.
  *   **Oct 20:** Draft specific fee schedule models (starting $X/ton, rising to $Y/ton) and dividend distribution mechanics.
  *   **Oct 25:** Public hearing to gauge resident response to the infrastructure moratorium specifically.
  *   **Nov 1:** Final vote on memo text.

  **Conclusion**
  This package accepts that prices are necessary but insufficient. It treats carbon not merely as an externality to be priced, but as a physical limit to be respected. We ask the Council to adopt both the fee and the moratorium. One without the other fails either the economy or the atmosphere. Together, they offer a path to 2030 that is just, effective, and honest.
