      Price Camp: Tax = Fine (deterrence).
      Cap Camp: Tax = Price (permission).
      My synthesis: A sufficiently high tax functions as a fine, but without a hard cap, it remains a price for the wealthy. Therefore, we need both price signals and physical limits on infrastructure.

      *Okay, let's write.*

