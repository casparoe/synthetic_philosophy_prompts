answer: |-
  The coffee in the department lounge had gone cold, but neither Alex nor Jordan had moved from the table. The manuscript between them, titled *The Iron Law of Fiscal-Military Stability*, claimed to have identified a universal constraint on state formation.

  "Reject," Alex said, tapping the page. "Straight up. Popper settled this seventy years ago. The 'Poverty of Historicism' isn't a suggestion; it's a demolition."

  Jordan stirred their coffee. "Popper demolished *prophetic* historicism. Hegel, Marx, the idea that history marches inevitably toward a specific stage. I'm not predicting the future. I'm modeling structural constraints. This claim—that no agrarian state maintains a standing army without a hereditary tax bureaucracy—isn't a prophecy. It's a bottleneck. Like saying 'no engine runs without fuel.'"

  "If it's just 'you need fuel,' it's trivial logistics, not history," Alex countered. "But if the claim is 'states always develop this bureaucracy within three generations,' then it's a trend. And Popper's first move is simple: trends are not laws. Birth rates fall, then they rise. Complexity increases, then collapses. A trend can reverse. A law can't. You're mistaking a contingent pattern for a necessary connection."

  "This isn't a trend line," Jordan insisted. "It's an impossibility claim. It says what *can't* happen. Ecology works this way. Carrying capacity isn't a prophecy of population size; it's a limit on what's possible. We're treating the state as a thermodynamic system. Energy in, energy out. If you extract surplus via coercion, you need agents to coerce. Those agents become elites. That's not knowledge-dependent; it's agency-dependent."

  Alex leaned forward. "Here's Popper's second move, the one people forget: the unpredictability of future knowledge. We cannot predict what we will know tomorrow. But what we know tomorrow changes how society functions. If this 'law' holds today, it's because they haven't invented double-entry bookkeeping yet. Once they do, the constraint vanishes. So you haven't found a law of history; you've found a temporary gap in their technology. The long-run course of history is closed to us because the future of science is closed to us."

  "I concede the long-run course is open," Jordan said. "I'm not predicting the year 3000. I'm modeling the state within specific parameters. Look, in epidemiology, we say 'smoking causes cancer.' We don't say 'unless you have rare gene X.' We know confounding variables exist. A single counterexample doesn't kill a probabilistic law. If Rome fits, and Han China fits, and the Ottomans fit, we have a regularity. If one outlier appears, we check the boundary conditions. We don't burn the model."

  "But in physics, you know when the clause applies," Alex pressed. "In history, the 'boundary conditions' are the entire context of human action. If you have to say 'except when humans act creatively,' you've surrendered the ground. You're left with 'states behave regularly until they don't.' What work is the *ceteris paribus* clause doing if no one can say when it fails to apply?"

  "It defines the scope," Jordan said. "Just like fluid dynamics assumes a continuous medium. If you hit the molecular scale, the law breaks. That doesn't make fluid dynamics unscientific. It makes it scoped. I'm operating at the macro scale. You're demanding quantum precision from climate modeling."

  "Climate modeling predicts weather patterns, not the evolution of the atmosphere," Alex said. "There's a difference between predicting the path of a storm and predicting the history of the planet. This manuscript claims to explain state evolution. That's historicism. If your laws are transient because knowledge changes the system, they aren't laws of history. They're laws of current configurations. Which makes this manuscript a case study, not a grand theory."

  Jordan paused, looking at the title page. "Maybe we're fighting over the word 'law.' You want necessity and universality. I want robust generalizations that guide policy. If I call it a 'structural constraint' instead of a 'law,' does the epistemology change?"

  "If you drop 'law,' you admit it's not scientific in the strict sense," Alex said. "You're doing descriptive sociology. Which is fine! But don't claim you've found the gravity of society."

  "But gravity has exceptions too, once you hit the event horizon," Jordan replied. "Is physics unscientific because Newton breaks down? I'm telling you history is like ecology. You can have laws of ecology without predicting the exact number of deer in 2050. The substance is the same: identifying invariant relationships within a system."

  "The substance isn't the same because the system learns," Alex said. "Deer don't read ecology papers and change their breeding habits. States do. That reflexivity breaks the invariance."

  "Then it's a useful law until it's not," Jordan said. "Like antibiotics. Bacteria evolve resistance. Does that mean microbiology is pseudoscience? We use the laws until the system adapts."

  Alex sighed, rubbing their temples. "So you're admitting the laws are transient."

  "I'm admitting the systems are adaptive. That's what living systems do. You want history to be like billiards. I'm telling you it's like ecology. You can have laws of ecology without predicting the exact number of deer in 2050."

  "Fine," Alex said, picking up a pen. "Recommend revision. But the title goes. No 'Iron Laws.' And the discussion section needs to acknowledge that this constraint holds only until the next technological rupture. You have to admit the openness of the future."

  "Deal," Jordan said. "But I'm keeping the cliodynamic model. It works, even if you hate the philosophy."

  "It works until it doesn't," Alex muttered. "That's my point."

  "That's science," Jordan replied, closing the folder.
