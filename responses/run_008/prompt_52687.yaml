prompt: |-
  I teach intro ethics at a community college — 18ish students, one 75-minute session — and I've hit the point where they've all internalized "utilitarianism = add up the welfare and pick the biggest number," and I want to complicate that before we touch any readings on equality. Design an in-class game with welfare points where the round structure itself does the work of separating an egalitarian intuition (equality is a good thing in itself) from a prioritarian one (the worse off count for more), and also from plain sum-ranking — including at least one round where equality improves while the worst-off student is made strictly worse off, one where inequality grows but literally everyone gains, and a final twist round that isn't just leveling down versus Pareto improvement (say, everyone gains but the gains go disproportionately to the already better off — I want to see if their complaints track the worst-off student's level or the gap). They should get real choices with consequences for their point totals, and no lecture up front — they shouldn't hear the terms "leveling down" or "prioritarianism" until the debrief maps each round onto one of the views. Give me exactly five numbered items — the setup and rules, the rounds in order with the point allocations, how to score it without real money, the debrief mapping, and one thing that predictably goes wrong the first time I run it. Each item a sentence or two, and no intro or wrap-up, just the list.
