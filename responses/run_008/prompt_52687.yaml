  2. Start with an unequal baseline (10, 20, 30 points) and conduct four votes where the class chooses between policy options relative to the current distribution: Round 1 maximizes total points maintaining inequality, Round 2 equalizes everyone at a level causing the lowest to lose, Round 3 increases everyone's total but widens the gap, and Round 4 increases everyone but allocates 90% of the surplus to the highest scorers.
  3. Tally votes after each scenario, apply the winning policy to the public leaderboard immediately, and announce that final point totals convert to extra credit to ensure stakes feel real without using cash.
  4. Reveal that Round 1 tracked utilitarian sum-ranking, Round 2 tested the leveling down objection to strict egalitarianism, Round 3 isolated Pareto improvements from equality concerns, and Round 4 distinguished prioritarianism from simple gap-aversion based on where students voiced complaints.
  5. Students will inevitably vote strategically to benefit their own current score rather than expressing an ethical preference, so you must remind them mid-game that the goal is to choose the *just* policy, not the personally profitable one.
