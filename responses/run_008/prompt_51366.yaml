prompt: |-
  So a mate of mine dropped the line "you did the right thing for the wrong reasons" on me last week and it's been rattling round my head since. Context: I organised a fundraiser at work for a colleague whose house flooded, raised a decent chunk of money, got a lovely email from her and everything. But if I'm honest with myself, a big part of why I did it was that a manager I'm desperate to impress had remarked that nobody was stepping up. So: right thing, wrong reasons, apparently. He said it like it settles whether I'm a good person — as if the motive cancels out the act. But I genuinely can't work out what claim that one sentence is actually making. Is it saying the act is less right? That it's just as right but I get less credit? That I get no credit, or even that I'm a bit of a fraud? Can a dodgy motive dilute moral worth, or does it only ever destroy it? And does it matter whether the wrong reason is selfish (impressing the boss) versus something like guilt, which at least tracks the right thing? Also, do I need to have consciously thought "this is what I should do" for it to count, or is just being pulled the right way by the situation enough — my mate seems to assume the reasons you tell yourself are what matter, and I'm not sure that's right. Lay out the different precise things "the right thing for the wrong reasons" could mean, from the trivial reading to the harsh ones, and tell me which of them would actually back up his "so it doesn't really count" — because I want to know whether he's got a point or just a nice-sounding line, becuase it's bugging me.
