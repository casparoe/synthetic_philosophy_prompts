answer: |-
  This is a classic ethical puzzle, and it's no wonder it's rattling around your head. Your friend has handed you a phrase that sounds profound but is actually philosophically messy. He is conflating the **value of the act** with the **quality of your character**.

  To figure out if he has a point or just a catchy line, we need to dissect exactly what "right thing, wrong reasons" can claim. Here are the four precise interpretations of that sentence, ranging from trivial to harsh, followed by an analysis of your specific questions.

  ### 1. The Four Interpretations

  **Level 1: The Descriptive (Trivial)**
  *   **Claim:** "The outcome was good, but your internal narrative wasn't purely altruistic."
  *   **Implication:** This is just a statement of fact. It doesn't judge the act or you. It acknowledges that human motivation is complex.
  *   **Does it support "it doesn't count"?** No. This level admits you did the right thing. Full stop.

  **Level 2: The Predictive (Cautionary)**
  *   **Claim:** "You did the right thing *this time*, but if the selfish incentive (impressing the boss) were removed, you might not do it next time."
  *   **Implication:** Your moral reliability is contingent on external rewards. You are not yet "trustworthy" in a moral sense because your compass is calibrated to status, not need.
  *   **Does it support "it doesn't count"?** Partially. It suggests the act doesn't count as *evidence* of your future goodness.

  **Level 3: The Moral Worth (Kantian)**
  *   **Claim:** "An act only has true moral worth if done *from* duty, not just *in accordance* with duty."
  *   **Implication:** Because you wanted the boss's approval, the act lacks "moral beauty." It's like a painting that looks beautiful but was made by a machine. The result is nice, but it doesn't make you a "good person."
  *   **Does it support "it doesn't count"?** Yes, regarding your character. It says this specific act cannot be used to build your moral credit score.

  **Level 4: The Cynical (Harsh)**
  *   **Claim:** "The selfish motive contaminates the act so thoroughly that the act itself is morally suspect."
  *   **Implication:** You instrumentalized the colleague's suffering to get ahead. You used their tragedy as a ladder.
  *   **Does it support "it doesn't count"?** Yes, aggressively. It suggests you are arguably worse than someone who did nothing, because you profited (socially) from a tragedy.

  ### 2. Addressing Your Specific Questions

  **Does a dodgy motive dilute moral worth, or destroy it?**
  This depends on which ethical framework you use, and your friend is implicitly using a **Virtue Ethics** or **Deontological** framework, while you are likely feeling like a **Consequentialist**.
  *   **Consequentialism (The Result):** The house got fixed, the colleague was helped. The motive is irrelevant to the *goodness of the outcome*. The moral worth is high.
  *   **Virtue Ethics (The Person):** The goal is to be a person who does good *because* it is good. If you do it for status, you haven't practiced the virtue of charity; you've practiced the virtue of ambition.
  *   **The Verdict:** A dodgy motive rarely *destroys* the worth of the act (the money still helped), but it does *dilute* the evidence that you are a virtuous person. However, "dilute" is not "zero." Your friend is treating it as a zero-sum game (either pure or worthless), which is false.

  **Does it matter if the reason is selfish (boss) vs. guilt?**
  Yes, significantly.
  *   **Selfishness (Impressing the boss):** This is "instrumental." The colleague is a means to your end (promotion/status). This is the "wrongest" of the wrong reasons.
  *   **Guilt/Discomfort:** If you did it because seeing her suffer made you feel bad and you wanted to relieve your own pain, that is still self-referential. *However*, it shows your empathy is functional. You are emotionally tethered to her suffering.
  *   **Comparison:** Guilt is a "warm" motive (connected to care); ambition is a "cold" motive (connected to hierarchy). Doing it for guilt suggests you have a conscience; doing it for ambition suggests you have a career plan. Your friend would likely say both are "wrong reasons," but ambition is morally thinner than guilt.

  **Do I need to have consciously thought "this is what I should do"?**
  No. This is a common misconception.
  *   **Moral Intuition:** Many philosophers argue that if you have to stop and calculate "is this right?", you are already one step removed from true virtue. The "good person" often acts instinctively.
  *   **The Friend's Error:** Your friend assumes that because you *noticed* your selfish motive, that motive is the *only* motive. But you likely also felt genuine sympathy. Human motivation is almost always a cocktail. If we required pure altruism for an act to count, almost no good deeds would count.

  ### 3. So, is your friend right?

  **He has a point, but he is drawing the wrong conclusion.**

  **Where he is right:**
  He is right that this specific act is not proof of *selfless* character. If the manager hadn't made that comment, and you are honest that you wouldn't have organized it, then your moral engine is currently running on fuel that isn't entirely reliable. He is warning you that you are one step away from being a "fair-weather friend."

  **Where he is wrong:**
  He is wrong to imply the act "doesn't count."
  1.  **Mixed Motives are Normal:** If we wait for pure motives, we never act. The fact that your ambition was channeled into a helpful act is a net positive for the world.
  2.  **Habit Formation:** Even if you started for the wrong reason, doing the right thing reinforces the behavior. You might start doing it for the boss, but eventually, you become the kind of person who organizes fundraisers. The action shapes the character, not just the other way around.
  3.  **The "Fraud" Accusation:** You are not a fraud. A fraud pretends to care when they don't. You *did* care enough to act, even if you *also* wanted a promotion. Caring about your career doesn't negate caring about your colleague.

  ### The Bottom Line

  Your friend is making a **Level 3 (Moral Worth)** claim to justify a **Level 4 (Cynical)** conclusion.

  He is saying: *"Because your motive wasn't pure, you don't get to claim this as evidence that you are Good."*

  **Is that true?** Yes, strictly speaking. You can't hang this on your wall as proof of your sainthood.
  **Does it mean you did the wrong thing?** Absolutely not.
  **Does it mean you are a bad person?** No. It means you are a complex person who managed to align your self-interest with someone else's need.

  **Advice:**
  Don't let the phrase paralyze you. The "right thing for the wrong reasons" is still the **right thing**. The world is full of people doing the wrong thing for the right reasons (e.g., enabling an addict out of love). You did the opposite.

  Tell your mate: *"Maybe the reasons weren't pure. But the colleague got paid. I'll take the ambiguity if it means she gets to stay in her house."* That shuts down the philosophical nitpicking and centers the actual human value of what you achieved.
