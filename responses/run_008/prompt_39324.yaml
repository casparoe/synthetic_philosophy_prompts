answer: |-
  The pattern of practice across the UK, Canada, and Spain does not presuppose any of the three pure philosophical candidates (Primary Right, Remedial Right, or Constitutional Amendment). Instead, it presupposes a hybrid implicit theory I will call **"Sovereign Discretion with a Duty to Negotiate."**

  ### 1. The Implicit Theory: Sovereign Discretion with a Duty to Negotiate

  This theory holds that secession is neither an inherent right of the subgroup nor strictly contingent on oppression. Rather, it is a **constitutional rupture** that the existing sovereign order has the authority to manage. However, in a liberal democracy, if a subgroup demonstrates a clear, democratic will to leave, the sovereign center incurs a *political* (if not strictly legal) obligation to negotiate the terms of dissolution.

  *   **Core Tenet:** The Center holds the keys (Sovereign Discretion), but the Subgroup holds the match (Democratic Legitimacy).
  *   **Mechanism:** Secession is treated as a "political question" rather than a justiciable right. It requires a bilateral process: the region must demonstrate a mandate, and the center must agree to the process and threshold.

  **Accommodation and Exclusion of State Practices:**
  *   **Accommodates Canada:** This is the textbook case. The Supreme Court ruled there is no unilateral right (Sovereign Discretion), but a clear majority on a clear question creates an obligation to negotiate (Duty to Negotiate).
  *   **Accommodates the UK:** Westminster retained Sovereign Discretion (granting the Section 30 order) but honored the Duty to Negotiate by agreeing to be bound by the result.
  *   **Quietly Rules Out Spain:** Spain's practice violates the "Duty to Negotiate" limb of the theory. By declaring the referendum unconstitutional *ex ante* and prosecuting organizers, Spain asserts Sovereign Discretion but refuses to acknowledge that a democratic mandate creates any obligation to even discuss constitutional change. In the logic of liberal democratic practice established by London and Ottawa, Madrid's rigidity is an outlier that treats the constitution as a cage rather than a contract.

  *Note:* The theory also quietly critiques the **UK's threshold**. While it accommodates the UK's *process*, the "Clarity" norm suggests a bare 50%+1 majority is insufficient for a one-way constitutional door. The UK practice is accommodated only because the Sovereign (Westminster) *waived* the higher threshold, not because 50%+1 is theoretically sufficient.

  ### 2. The Clarity Act and the Rationalist Puzzle

  The Clarity Act's deliberate vagueness regarding numerical thresholds is not merely an unprincipled fudge; it encodes a **coherent version of the "one-way door" heuristic**, though it inevitably functions as a political tool.

  *   **The Coherent Heuristic:** Rationalists argue irreversible decisions require higher evidential thresholds. However, in politics, "evidence" of will is not just arithmetic; it is *legitimacy*. A fixed numerical threshold (e.g., 60%) is arbitrary—why 60 and not 55? The Clarity Act recognizes that the "cost of error" varies by context. A 50%+1 vote on a vague question ("Do you want sovereignty?") is low-evidence for an irreversible rupture. A 55% vote on a specific question ("Do you agree to leave Canada under terms X, Y, Z?") might be high-evidence. The vagueness allows the federal government to assess the *quality* of the mandate, not just the count. It treats the threshold as a variable function of question clarity and turnout, which is theoretically superior to a fixed constant.
  *   **The Fudge:** It is simultaneously a fudge because it centralizes the interpretive power in the very body whose existence is at stake. It allows the federal parliament to reject a result it dislikes by retroactively declaring the question "unclear" or the majority "insufficient."
  *   **Verdict:** It is a **principled fudge**. It correctly identifies that existential political changes cannot be reduced to simple arithmetic, but it solves the epistemic problem by granting the status quo the benefit of the doubt.

  ### 3. Counterfactuals: Committing to Rival Views

  If we committed to one of the three pure theoretical candidates, the current arrangements would require significant, often destabilizing, changes.

  **A. If we committed to Primary Right (Any cohesive people may secede):**
  *   **Change Required:** All three states are currently non-compliant. A Primary Right theorist would argue that Scotland, Quebec, and Catalonia do not need Westminster, Ottawa, or Madrid to *grant* a referendum. The right to vote is inherent.
  *   **Scotland 2014:** A Primary Right theorist would view the Section 30 order as an illegitimate veto. Scotland should have been able to hold the vote unilaterally.
  *   **Threshold:** A Primary Right theorist has **no principled basis for demanding more than 50%+1**. If self-determination is a right, it is exercised like any other democratic choice. Demanding a supermajority effectively grants a minority veto over the right, nullifying it.

  **B. If we committed to Remedial Right (Secession only for oppression):**
  *   **Change Required:** This view would render most Western secessionist movements illegitimate.
  *   **Scotland 2014:** A Remedial Right theorist should be **deeply uncomfortable** with Scotland's vote. Scotland suffers no systemic human rights abuses, economic strangulation, or cultural erasure by the UK. Allowing a referendum here sets a dangerous precedent that secession is a policy preference rather than a last resort against tyranny.
  *   **Quebec/Catalonia:** Quebec's cultural protections are robust; Catalonia has grievances but falls short of "remedial" thresholds in international law. Committing to this view would require closing the door on all three cases unless evidence of persecution was proven.

  **C. If we committed to Constitutional Amendment (Secession is structural change):**
  *   **Change Required:** This view aligns best with the status quo bias of liberal states but demands higher procedural bars.
  *   **Scotland 2014:** This view **rules out the 50%+1 threshold**. If secession is akin to amending the constitution (dissolving the sovereign), it requires a supermajority (e.g., 60% or 2/3) or concurrent majorities (national and regional). The UK's agreement to a simple majority was a political concession, not a constitutional principle.
  *   **Spain:** This view accommodates Spain's rigidity (the Constitution requires a national amendment to allow secession) but would ideally demand a pathway for that amendment to be proposed, rather than a total ban.
  *   **Canada:** This view supports the Clarity Act's implication that the "majority" must be substantial, but would likely demand the threshold be specified in advance to ensure fairness.

  ### Summary
  The actual practice of liberal democracies presupposes **Sovereign Discretion with a Duty to Negotiate**. It accommodates the **Canadian** model perfectly, tolerates the **UK** model (while privately preferring a higher bar), and excludes the **Spanish** model (as illiberal). The Clarity Act's vagueness is a coherent attempt to match evidential thresholds to the gravity of the decision, even if it advantages the status quo. To adopt a **Primary Right** view would dismantle the Center's veto; to adopt a **Remedial Right** view would cancel the Scottish vote; to adopt a **Constitutional Amendment** view would invalidate the 50%+1 threshold. The current inconsistency is the price of balancing democratic legitimacy against constitutional integrity.
