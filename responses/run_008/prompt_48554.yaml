answer: |-
  Dear Student

  Your choice of topic is exceptionally astute, and your working hypothesis demonstrates a sophisticated grasp of the underlying epistemological tensions at play in the Theory of Knowledge. You are largely correct that the stalemate between evolutionary psychologists and their critics is not primarily a lack of empirical data, but rather a fundamental disagreement about what constitutes an acceptable explanation in historical sciences. When critics like Stephen Jay Gould dismiss adaptationist claims as just-so stories, they are invoking a standard of falsifiability and independent verification that they feel is not being met, whereas defenders argue that inference to the best explanation is the only tool available for reconstructing the past, whether in geology, cosmology, or psychology. This suggests that the controversy is substantive rather than merely verbal, because it concerns the actual methods by which we justify knowledge claims about unobservable entities and events. It is not simply that the two sides are using words differently, though there is certainly semantic friction around terms like adaptation or function, but rather that they hold incompatible views on the burden of proof required to move a hypothesis from speculation to accepted theory.

  If you look closely at the structure of the debate, you will see that it also bears the marks of two disciplines attempting to answer different questions under the same banner. Evolutionary biology is traditionally concerned with genetic fitness and reproductive success over deep time, while psychology is concerned with immediate cognitive mechanisms and behavior. When evolutionary psychology attempts to bridge these, it often satisfies the criteria of one field while violating the norms of the other. For the biologist, a trait must show evidence of genetic heritability and selective pressure, while for the psychologist, the focus is often on the universality of a cognitive mechanism. The friction arises because the critics are often demanding the rigorous causal tracing of biology, while the defenders are offering the functional coherence of psychology. This disciplinary mismatch reinforces your hypothesis that the disagreement is about the standards of explanation, as each side privileges the ways of knowing and validation methods native to their own knowledge community.

  Regarding your question about what would count as progress, it is unlikely that a single new experiment will resolve the controversy, given that both sides have a history of reinterpreting experimental results to fit their existing frameworks. Instead, progress would likely come from what philosophers of science call consilience, or the jumping together of independent lines of evidence. If evolutionary psychologists could correlate their hypothesized cognitive mechanisms with specific genetic markers, archaeological findings, and cross-cultural ethnographic data simultaneously, the claim would become much harder to dismiss as a mere narrative. Therefore, an agreed standard for adaptationist claims that requires this kind of multi-disciplinary convergence would be the most fruitful path forward. However, you should also consider the possibility that giving up the question in its current binary form might be necessary, shifting instead toward a more nuanced view where traits are seen as byproducts or exaptations rather than direct adaptations. This would not end the debate, but it would refine the questions being asked.

  For your essay, this situation offers a rich opportunity to explore how knowledge communities protect their paradigms and how the demarcation between science and non-science is often negotiated rather than discovered. You might argue that the stagnation you observe is not a failure of science, but a feature of how scientific knowledge evolves when dealing with the unobservable past. The persistence of the debate suggests that both sides are holding onto valuable insights that the other lacks, and that true progress requires a synthesis of standards rather than a victory for one side. By framing the controversy as a clash over epistemological standards rather than just facts, you will be able to engage deeply with the nature of justification and certainty in the human sciences. I hope this helps you structure your analysis, and I look forward to reading how you develop these ideas.

  Sincerely

  Your TOK Instructor
