      However, candor is required about what this argument leaves unresolved. Demonstrating that emotions adapt like perceptions proves they are perceptual in structure, but it does not fully settle what they are perceptions *of*. Does perceiving a racing heart and tightened muscles amount to perceiving value itself, or merely the physiological shadow of value? The leap from bodily state to worldly significance remains a philosophical gap. Furthermore, this model struggles with the exceptions. Phobias are defined by their recalcitrance; the affect refuses to fade despite years of constant, safe exposure. If emotions are perceptual systems designed to habituate, why does the phobic's fear remain as raw as day one? Adaptation supports the perceptual view, but it does not solve every mystery. It suggests that emotions are how we feel the body navigating value, even if the mechanism sometimes jams.

