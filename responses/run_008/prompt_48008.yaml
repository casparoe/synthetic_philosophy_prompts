  Consider the new resident beneath a flight path. When the planes first roar overhead, the reaction is visceral: a spike of alarm, a tightening of the chest. This is fear. Now fast-forward six months. The planes still roar with the same decibels and frequency. The resident still judges the noise to be a nuisance and the aircraft a potential risk; if asked, they would affirm the danger remains. Yet, the fear has quieted. The visceral spike is gone. A similar fading occurs with positive emotions: the delight taken in a view from a new apartment dims over years, even while the resident continues to judge the view as beautiful.

  This profile—fading affect amidst constant judgment—is the signature of a perceptual system recalibrating to a steady stimulus. It is exactly what happens to touch and smell. When you dress in the morning, you feel the weight of your clothes against your skin. By noon, that tactile sensation has vanished. You do not believe your clothes have disappeared; you simply cease to feel them because the stimulus is constant. Similarly, a smell overwhelms you upon entering a room, then vanishes from awareness despite lingering in the air. Our sensory systems are designed to report change, not constancy. If emotions are perceptions of the body's value-relevant states, they should behave the same way. And they do. The fear of the aircraft fades not because the risk assessment changes, but because the body's alarm system habituates to the predictable disturbance. The feeling tracks the novelty of the bodily disruption, not just the static fact of the danger.

