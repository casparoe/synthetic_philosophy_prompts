              *   *Coherentism (Holistic):* Truth is the most coherent narrative under pressure.
              *   *Popperian Falsificationism:* We can't prove truth, but we can eliminate error. Debate maximizes falsification attempts.
          *   *Condemns:*
              *   *Strong Correspondence Theory:* Truth is mind-independent. Debate is mind-dependent. If the judge is fooled, correspondence is broken.
              *   *Virtue Epistemology:* Focuses on the agent's character/reliability, not the argument's survival. A liar can win a debate; a virtuous knower might lose.
