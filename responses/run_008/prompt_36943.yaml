prompt: |-
  so i'm prepping for a philosophy of science reading group and we're doing a prediction exercise on Popper, and honestly I want a second opinion before I commit to my answers in front of everyone.

  The exercise is: from Popper's track record of verdicts on other theories, predict what he'd say about some newer evolutionary stuff. His actual verdicts, as best I can reconstruct them:

  1. Einstein's general relativity, after the 1919 eclipse expedition: real science, the gold standard, because it stuck its neck out with a risky prediction about light bending that could easily have come out wrong.
  2. Astrology: not science, because it's vague enough to fit any outcome.
  3. Freudian psychoanalysis and Adler's psychology: not science either, because they can explain any conceivable behaviour after the fact, so nothing could ever count against them.
  4. Marxism (at least as practised by his day): different from Freud, because it once made risky historical predictions, but when those failed, its adherents rescued it with reinterpretations — so a science that degenerated into pseudoscience through immunising manoeuvres.
  5. Newtonian mechanics: real science even though it got falsified (Mercury's perihelion and all that) — being falsified isn't the problem, being unfalsifiable is.
  6. Natural selection in the mid-70s: he said it was dangerously close to tautology (survivors survive because they're the fittest, and the fittest are defined as the ones who survive) and ranked it as a metaphysical but fruitful research programme rather than a testable scientific theory.
  7. But then a few years later (late 70s, Dialectica paper) he walked it back, saying he'd changed his mind: properly formulated, selection is testable in special cases — lab selection experiments, industrial melanism in the peppered moths, that sort of thing.

  Now the new cases we're supposed to call:

  (a) evolutionary psychology, specifically the claim that humans have a dedicated cheater-detection mechanism. Its defenders say it forbids things: performance on the Wason selection task should show a specific signature for social-contract rules and not for equivalent non-social rules. Its critics say that whatever the data, someone will generate an adaptive story for it after the fact, and the adaptive stories are unfalsifiable because any outcome can be given one.
  (b) punctuated equilibrium: the claim that species mostly show stasis in the fossil record with abrupt change concentrated at speciation events — a risky claim about what we'll keep finding in the strata that could straightforwardly have come out otherwise.
  (c) gene-culture coevolution models: formal mathematical models, e.g. of how dairying and lactase persistence co-evolved, which are simulation-friendly but where critics say the parameters get fitted to the already-known outcome, so it's less a prediction and more a very elaborate description.

  What I want from you:

  - Predict Popper's verdict on each of the three, consistent with the track record above. Don't just say science / not science — say which slot it lands in (proper testable science, unfalsifiable non-science like Freud, degenerating science like post-hoc Marxism, or fruitful-but-metaphysical programme).
  - Tell me which demarcation rule he's actually running, because I don't think the track record pins it down. At minimum there seem to be three going around: (i) the risky prediction rule — it's science if it forbids things in advance; (ii) the tautology rule — it's not empirical science if its core looks definitional or purely explanatory after the fact; (iii) the immunisation rule — it's pseudoscience if its practitioners rescue it with ad hoc moves. These come apart: (ii) and (iii) presumably both condemn the evo psych, but punctuated equilibrium sails through all three, and the gene-culture stuff is exactly where (i) and (iii) might split, since fitting parameters isn't the same as immunising, or maybe it is?
  - Related question: was Popper's late-70s walk-back a genuine rule change or just more charity about how you formulate the theory? If it's a rule change, that matters for how much weight his earlier verdicts should carry in the predictions.
  - Give me your best guess with reasons, and then name one further case — some specific theory or research programme, real or invented — where the candidate rules you identified give different verdicts, so we could actually settle which rule he's on.
  - Flag honestly which pairs of rules the track record can't seperate no matter what case we throw at it.

  You're a philosophy of science scholar who's spent way too much time on demarcation. Think carefully before answering — maybe start with a quick brainstorm of the candidate rules and what each predicts, then commit to your predictions. Please answer in British English (so: programme, immunise, etc). If you think one of my reconstructions of Popper's verdicts is off, say so, but don't turn this into a Popper biography — the exercise is prediction from the track record, not scholarship. Thanks!
