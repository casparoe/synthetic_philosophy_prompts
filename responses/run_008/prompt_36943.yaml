answer: |-
  Right, let's get stuck in. You've reconstructed Popper's track record quite well, though I'd quibble slightly on the Newton case: Popper admired Newton not just because it was falsifiable, but because it *invited* falsification. But for the purposes of your exercise, your summary is sufficient to derive the logic.

  Here is my assessment of how Popper would likely adjudicate your three new cases, followed by an analysis of the underlying rules and a proposal for a decisive test case.

  ### 1. The Verdicts

  **(a) Evolutionary Psychology (Cheater-Detection)**
  *   **Verdict:** **A Degenerating Research Programme (bordering on Pseudoscience).**
  *   **Reasoning:** Popper would distinguish between the *specific experimental claims* (which are testable) and the *overarching explanatory framework*. He would likely view the specific Wason task predictions as legitimate science (similar to his late-70s view on peppered moths). However, regarding the broader claim that human psychology is a bundle of adaptive modules, he would smell a rat.
  *   **Why:** The critics' charge—that adaptive stories can be generated for *any* outcome post-hoc—is exactly the charge he levelled at Freud and Adler. If the cheater-detection module is "not found" in a specific culture, and the defence is "ah, but their social contract structure was different, triggering a different module," that is an **immunising manoeuvre**. Popper would likely classify the general programme as metaphysical, but warn that its practitioners are behaving like the Marxists: rescuing the core theory from refutation by reinterpreting the environment rather than accepting the falsification of the mechanism.

  **(b) Punctuated Equilibrium**
  *   **Verdict:** **Proper Testable Science.**
  *   **Reasoning:** This lands squarely in the Einstein slot. The claim is that the fossil record *should not* show gradual transitions but rather stasis and abrupt appearance. This forbids a specific state of affairs (ubiquitous gradualism in the strata).
  *   **Why:** It sticks its neck out. It is vulnerable to the spade. If we find continuous gradual transitions everywhere, the theory is falsified. Popper was very clear (see your Newton example) that being falsified does not make a theory unscientific; only being *unfalsifiable* does. Even if Punctuated Equilibrium were later shown to be false (e.g., if the "abruptness" was just a sampling error), Popper would defend its scientific status. It is a bold conjecture about the physical world.

  **(c) Gene-Culture Coevolution Models**
  *   **Verdict:** **Fruitful-but-Metaphysical Programme (with high risk of Degeneration).**
  *   **Reasoning:** This is the trickiest one. Popper had a deep suspicion of "historicism"—the idea that we can find laws of history that explain the past. If these models are primarily used to simulate *known* outcomes (like lactase persistence) by fitting parameters until the simulation matches the history, Popper would classify this as explanation, not prediction.
  *   **Why:** This mirrors his critique of Marxism. If the parameters are adjusted to fit the known data, it is a post-hoc description, not a risky prediction. However, because they are formal mathematical models, he might grant them the status of a "metaphysical research programme" (like his late view on natural selection). They become science *only* if they predict a *novel* coevolutionary pathway in a different population that is then confirmed. Until then, they are elaborate historical descriptions.

  ---

  ### 2. Which Demarcation Rule is He Running?

  You identified three candidate rules: (i) Risky Prediction, (ii) Tautology, and (iii) Immunisation.

  My analysis is that **Rule (i) (Risky Prediction) is the master rule**, but it is operationalised through **Rule (iii) (Immunisation)**. Rule (ii) (Tautology) is merely a heuristic for spotting violations of Rule (i).

  Here is the hierarchy:
  1.  **Primary:** A theory is scientific if it is logically capable of contradicting possible observations (Risky Prediction).
  2.  **Secondary:** A theory degenerates into pseudoscience if its practitioners systematically protect it from contradiction using ad hoc adjustments (Immunisation).
  3.  **Heuristic:** If a theory looks tautological, it usually fails the Primary rule, *unless* it can be reformulated to yield specific predictions.

  **The Walk-Back on Natural Selection:**
  This was **not a rule change**; it was **charity regarding formulation**.
  In the mid-70s, Popper focused on the phrase "survival of the fittest" and saw a logical circle (Rule ii). In the late-70s, he realised that while the *principle* might be metaphysical, specific *hypotheses* derived from it (e.g., "dark moths survive better on soot-covered trees") satisfy Rule (i). He didn't change the demarcation criterion; he changed his assessment of whether evolutionary biology *necessarily* had to be stated tautologically. He conceded that biologists *could* formulate it scientifically, even if they often didn't.

  Therefore, for your exercise, you should treat "Tautology" as a warning sign, not a death sentence. If the theory can be tweaked to make a risky prediction, Popper will let it into the club.

  ---

  ### 3. A Further Test Case (The Crucial Experiment)

  To separate Rule (i) from Rule (iii), you need a case where a theory makes risky predictions, but the community systematically immunises it.

  **Case: The Efficient Market Hypothesis (EMH) in Economics.**

  *   **The Theory:** Asset prices reflect all available information.
  *   **Rule (i) Verdict (Risky Prediction):** **Science.** It makes bold claims. It predicts you cannot consistently beat the market using public information. It forbids the existence of predictable bubbles.
  *   **Rule (iii) Verdict (Immunisation):** **Pseudoscience/Degenerating.** When bubbles occur (e.g., 2008), proponents do not accept falsification. They introduce ad hoc clauses: "information was asymmetric," "transaction costs were too high," or "investors weren't rational."
  *   **Popper's Likely Verdict:** He would likely call it a **Degenerating Research Programme**. He had little patience for economics that mimicked physics without the predictive power. He would argue that while the *logic* of EMH looks scientific (Rule i), the *methodology* of its defenders is Marxist (Rule iii).

  This case separates the rules because the theory *looks* falsifiable on paper, but is treated as unfalsifiable in practice.

  ---

  ### 4. Indistinguishable Pairs

  You asked where the track record fails to separate the rules.

  **Rule (i) and Rule (ii) are largely indistinguishable in Popper's actual verdicts.**
  In practice, Popper treats "Tautology" and "Lack of Risky Prediction" as the same thing. If a theory is tautological (Freud: "repression causes X; lack of repression causes reaction-formation X"), it by definition cannot make a risky prediction. There is no case in your track record where Popper says, "This is tautological, but it makes risky predictions." (His walk-back on selection explicitly denies the tautology charge for the scientific formulations).

  **Rule (ii) and Rule (iii) are also tightly coupled.**
  If a theory is tautological, it *invites* immunisation. If practitioners are immunising, they are usually relying on the tautological flexibility of the terms.

  **The Real Split:**
  The only place the rules truly come apart is between **Logic (i & ii)** and **Sociology (iii)**.
  *   **Logic:** Is the theory *capable* of being falsified?
  *   **Sociology:** *Do* the scientists actually allow it to be falsified?

  Popper's track record shows he cares about both, but he prioritises the Logic. Newton was scientific even though it was eventually falsified (Logic held). Marxism was scientific *once*, but became pseudoscience when the practitioners changed their behaviour (Sociology shifted).

  **Summary for your Reading Group:**
  Stick to this line: Popper's core commitment is **Falsifiability (Rule i)**. The "Tautology" charge is just a way of saying "This formulation isn't falsifiable." The "Immunisation" charge is a warning that "Even if this looks falsifiable, don't let them cheat."
  *   **Evo Psych:** Fails on Immunisation (Just-So stories).
  *   **Punctuated Equilibrium:** Passes on Falsifiability (Bold claim about strata).
  *   **Gene-Culture:** Fails on Falsifiability (Historical fitting vs. Novel prediction).

  Good luck with the group. If they push back on the Evo Psych verdict, remind them of Popper's hatred of "historicism" and functionalist explanations that explain everything. He'd see a "module for everything" as Adlerian.
