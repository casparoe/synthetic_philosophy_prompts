prompt: |-
  I'm a retired atmospheric physicist -- thirty odd years building climate models, so trust me, I know what sensitive dependence on initial conditions looks like up close. Now I've got time on my hands and I'm reading ethics, and I keep hitting this thing people call cluelessness: the claim that for most acts you can't work out, even in principle, whether the total consequences are net good or bad, because everything ripples into everything else. Before I go read what actual philosophers have proposed, I want the spec first. Write the desiderata: what any adequate account of how to act under cluelessness has to deliver. Which cases it must get right -- a donation whose effects propagate through markets and other people's responses, an act that looks obviously good but whose knock-on effects could swamp the direct benefit, the situation where you know the sign of the near-term effect but nothing at all about the total. Which distinctions it must respect -- between can't-calculate and no-fact-of-the-matter, between what was reasonable ex ante and what turned out to be right, plus any others you think matter. And what it cant contradict of ordinary decision theory, since as a scientist I'd have assumed expected utility maximization right up until I met this problem. Give the case behind each requirement, say which you'd treat as non-negotiable and which are more like taste, and -- this is the part I care about most -- tell me straight if you suspect some subset of the requirements is jointly unsatisfiable. Then just briefly: how expected utility maximization, satisficing, and a rough "act on the foreseeable and let the rest go" view do against your list. Keep the weight on the criteria, the scoring can be rough.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired atmospheric physicist (30+ years experience with climate models). Understands sensitive dependence on initial conditions (chaos theory), complexity, and modeling limitations. Skeptical but open-minded. Values precision, rigor, and structural integrity of arguments.
      *   **Topic:** Ethical "Cluelessness" (the problem that long-term consequences of actions are unknowable/unpredictable, potentially making consequentialist calculation impossible).
      *   **Task:** Write the *desiderata* (criteria/requirements) for an adequate account of how to act under cluelessness *before* looking at existing philosophical solutions.
      *   **Specific Requirements:**
          *   Cases it must get right (donations/market ripples, obviously good acts with potential swamping, known near-term sign vs. unknown total).
          *   Distinctions it must respect (epistemic vs. metaphysical, ex ante vs. ex post, etc.).
          *   Consistency with ordinary decision theory (Expected Utility Maximization - EUM).
          *   Weighting: Non-negotiable vs. taste.
          *   Crucial Question: Is there a suspicion of joint unsatisfiability (impossibility theorem)?
          *   Brief Evaluation: How EUM, Satisficing, and "Foreseeable Only" views score against the list.
      *   **Tone:** Professional, rigorous, respectful of the user's scientific background, avoiding fluff.

  2.  **Deconstruct "Cluelessness":**
      *   The core problem: Consequentialism (especially Total Utilitarianism) demands we maximize good outcomes. But chaotic systems (like the economy, climate, society) mean small actions have infinite, unpredictable ripples (Butterfly Effect). If we can't know the total value, how can we be obligated to maximize it?
      *   The Physicist's Angle: This isn't just philosophical navel-gazing; it's about boundary conditions, time horizons, and sensitivity analysis in complex systems.

  3.  **Drafting the Desiderata (The Criteria):**
      *   *Requirement 1: Action-Guidance.* An ethical theory must tell you what to do *now*. It can't just say "it's unknowable."
      *   *Requirement 2: Non-Arbitrariness.* It can't just draw a line at 50 years vs. 51 years without justification. Needs a principled cutoff or weighting scheme.
      *   *Requirement 3: Sensitivity to Probability.* Must handle risk and uncertainty like a scientist does (probabilistic forecasts), not binary certainty.
      *   *Requirement 4: Ex Ante Rationality.* Must judge the decision based on information available *at the time*, not hindsight. (Crucial for a modeler).
      *   *Requirement 5: Preservation of Intuitive Duties.* If I save a drowning child, the theory shouldn't say "maybe this causes a war in 100 years, so it's neutral." It needs to preserve robust near-term goods.
      *   *Requirement 6: Compatibility with EUM (or clear deviation).* Since the user knows EUM, the theory must either fit within it (by defining utility/probability differently) or explicitly justify why EUM fails here.
      *   *Requirement 7: Metaphysical Neutrality.* Should work whether the future is determined or open, provided epistemic limits exist.

  4.  **Selecting the "Must-Get-Right" Cases:**
      *   *Case A: The Effective Altruism Donation.* Giving \$1000 to bednets. Direct good is clear. Market effects (local economy disruption) are uncertain. Long-term demographic changes are huge but unknown. *Test:* Can the theory justify the donation despite long-term uncertainty?
      *   *Case B: The Butterfly Killing.* Stepping on a bug. Direct effect negligible. Long-term effect potentially massive (chaos). *Test:* Does the theory paralyze the agent or dismiss the long-term risk appropriately?
      *   *Case C: The Trolley Problem (Long-term).* Pulling the lever saves 5 now. But one survivor becomes a tyrant. *Test:* How does it weigh near-certainty vs. low-probability/high-impact tail risks?

  5.  **Selecting the Distinctions:**
      *   *Epistemic vs. Ontological:* Is the future undefined, or just unknown to us? (Physicists care about this).
      *   *Ex Ante vs. Ex Post:* Decision quality vs. Outcome quality.
      *   *Direct vs. Indirect:* First-order effects vs. higher-order ripples.
      *   *Tractable vs. Intractable:* What can be modeled vs. what is effectively noise.

  6.  **Addressing the "Joint Unsatisfiability" (The Impossibility Worry):**
      *   This is the core intellectual hook.
      *   *The Trilemma:* (1) Accept Consequentialism (maximize total good), (2) Acknowledge Radical Uncertainty (chaos/complexity), (3) Maintain Action-Guidance (don't be paralyzed).
      *   If you accept (1) and (2), (3) seems to fail (Cluelessness).
      *   If you accept (1) and (3), you must deny (2) (claim we *can* know long-term effects, which is scientifically dishonest).
      *   If you accept (2) and (3), you must modify (1) (abandon total consequentialism).
      *   *Verdict:* Yes, there is a strong suspicion of inconsistency between standard Total Consequentialism, Scientific Realism about complexity, and Practical Action-Guidance.

  7.  **Evaluating the Three Approaches:**
      *   *Expected Utility Maximization (Standard):* Fails on Cluelessness. Integrals don't converge if variance is infinite or probabilities are undefined.
      *   *Satisficing:* Good for action guidance, bad for non-arbitrariness. Where is the "good enough" threshold?
      *   *Foreseeable Consequences:* Good for action guidance and scientific honesty. Bad for preserving the core intuition of consequentialism (why ignore bad foreseeable long-term effects if they are knowable?).

  8.  **Refining the Tone:**
