      *   *Check:* Is the impossibility claim strong enough? *Adjustment:* Frame it as a tension between *Consequentialist Scope*, *Epistemic Humility*, and *Decision-Readiness*.

  10. **Final Polish:** Ensure the distinction between "Non-negotiable" (logic/consistency) and "Taste" (moral intuition) is clear. (Proceed to generate output).

