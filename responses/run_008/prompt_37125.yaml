answer: |-
  "You still have it?"

  Mark tapped his pocket. "Wallet's at the lost and forth. Cash was untouched."

  Sarah shook her head, looking out at the blurring fields. "You know there was no way he'd have known. No cameras on that platform. You could've bought us dinner."

  "Exactly." Mark leaned forward, elbows on his knees. "That's the point. Why did I do it? Really?"

  "Because you're not a thief, Mark."

  "Because I'm religious," he said, gently. "Hear me out. From a game theory standpoint, that was a one-shot interaction. No reputation at stake, no enforcement mechanism. The rational move is to defect. Keep the cash. But if you believe an all-knowing God is watching, every interaction is on the record. It changes the payoff matrix."

  "So you're saying you're only honest because you're scared of heaven?"

  "I'm saying religion works like a commitment device for anonymous cooperation. It binds me to a strategy that looks dumb from a self-interest standpoint but pays off for the group. Maybe that's why moralizing gods show up in every large-scale society we know of. Gods who see everything and punish cheaters. It solves the stranger problem."

  Sarah took a sip of her coffee, grimacing at the heat. "It's a neat story. But look at the data. The most secular countries today—Scandinavia, the Czech Republic—they rank among the highest-trust, lowest-corruption societies around. Which is awkward if divine monitoring is load-bearing. They don't believe, yet they return wallets."

  "Legacy effects," Mark said. "You can't look at a single snapshot."

  "It's not a snapshot, it's decades. And where trust in big anonymous societies seems to actually come from is institutions. Courts, contract enforcement, reputation tracking. Mechanisms that work whether or not anyone believes. I don't need God to know I shouldn't steal; I need to know the police exist."

  "But the causation might run the other way entirely," Mark countered. "People get secure and trusting first, and then drift out of the pews. You don't need a umbrella when it stops raining, but that doesn't mean the umbrella didn't keep you dry."

  "That's convenient. Unfalsifiable."

  "Is it? Think about it. Those secular high-trust societies may be coasting on centuries of religiously-built norms. One snapshot can't tell you whether the trust survives long after the belief fades. You're spending capital someone else saved."

  Sarah stirred her coffee, the spoon clinking against the paper cup. "Even if that's true, you're defining morality as 'cooperation.' If the outcome is the same—the wallet gets returned—why does the internal software matter?"

  "Because 'more moral' has to mean more than 'cooperates when the accounting works out,'" Mark said. "Someone who's only honest because the ledger always balances isn't moral, just prudent. If the camera breaks, they steal. If God blinks, they cheat. If the only thing stopping you is the fear of getting caught, whether by cops or by God, you're not good. You're just calculated."

  Sarah paused. She looked at him, really looked at him, for the first time in an hour. "So what's the alternative? Acting against interest?"

  "Acting because it's right, not because it's safe."

  "But notice that cuts against your watched-by-God story just as much as against my reputation-and-enforcement story," Sarah said slowly. "If I return the wallet because society expects it, or because I want to maintain a self-image of honesty, that's still a ledger. I'm still balancing books. I'm just using social capital instead of spiritual capital."

  Mark sat back. The train rattled over a switch, the sound filling the silence between them.

  "Exactly," he said.

  "So we're both describing systems of enforcement," Sarah mused. "External or internal, divine or secular. It's all surveillance."

  "Unless there's a third option."

  "Which is?"

  "I don't know. Maybe that's the question." Mark looked out the window. "How do you even measure 'more moral' if you tried? Is it about what people do, or why they do it?"

  "If it's just what they do, then Scandinavia wins. They're safer, healthier, richer. If it's about why... then neither of us has clean hands. I'm performing for my peers, you're performing for your Creator."

  "Maybe morality isn't the performance," Mark said. "Maybe it's the thing that happens when you stop counting the audience."

  Sarah laughed, a short, dry sound. "And how do we test for that? Put people in a room with no cameras, no God, no peers?"

  "Maybe we already did. That platform. No cameras. I knew you weren't watching. The owner wasn't watching."

  "You were watching," Sarah said. "You knew *you* did it."

  "True." Mark sighed. "So I'm my own god."

  "Or you're just human," Sarah said. "Which is messy. Maybe the point isn't to solve the puzzle. Maybe the point is that we're both trying to solve it."

  "Trying to be good," Mark said.

  "Trying to know what good *is*," Sarah corrected.

  The train slowed as it approached a station. The announcement crackled overhead, unintelligible. Mark pocketed his phone.

  "Still think I should've kept the cash?"

  "I think," Sarah said, gathering her bag, "that I'm glad you didn't. For whatever reason. God, peers, prudency... I'll take the result."

  "Even if the motive's impure?"

  "Especially then," she said. "Means you had a reason to fight yourself."

  Mark nodded. "Next round's on me. Honest."

  "See? You're still keeping score."

  "Old habits."

  "Tell me about it."
