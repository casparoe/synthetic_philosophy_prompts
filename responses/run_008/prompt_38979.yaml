answer: |-
  Use the Order-Extension Theorem because it isolates the set-theoretic mechanism of Zorn's Lemma from algebraic verification, forcing students to confront the "union of a chain" step directly without the distraction of linear independence lemmas.

  ### Reasoning and Dependency Structure

  **Why Order-Extension over Vector Spaces:**
  For second-years who haven't seen cardinals or AC, the Vector Space Basis proof introduces a hidden dependency: proving the union of a chain of linearly independent sets is linearly independent requires understanding that linear dependence is a *finite* property. Students will get stuck on "why does the union stay independent?" and miss the Zorn's Lemma structure. In Order-Extension, the verification that the union of a chain of partial orders is a partial order is immediate from the definitions of transitivity and antisymmetry. The cognitive load rests entirely on the set-theoretic move (union of a chain), which is exactly where you want their attention. This example is the right call because it uses only the language (orders) they are currently mastering.

  **Dependency Sequence:**
  1.  **Definitions:** Poset, Chain, Upper Bound, Maximal vs. Maximum.
  2.  **Motivation:** Finite greedy algorithms vs. Infinite failure.
  3.  **Statement:** Zorn's Lemma (Hypothesis + Conclusion).
  4.  **Application:** Order-Extension Theorem (Setup, Poset of Posets, Chain Union, Maximality implies Totality).
  5.  **Boundaries:** What we are ignoring (AC, Construction).

  ### The 50-Minute Plan

  **0:00–0:10: Definitions and the Maximal/Maximum Trap**
  Start with a Hasse diagram of a finite poset (e.g., subsets of $\{1,2,3\}$ excluding the full set). Ask for a maximum (none) vs. a maximal element (many).
  *   **Misconception Alert:** Students equate "maximal" with "biggest."
  *   **Intervention:** Do not state Zorn's Lemma yet. Force them to write the definition of maximal ($x \geq y \implies x=y$) vs. maximum ($\forall y, x \geq y$). If they confuse these now, Zorn's Lemma will look false later (since linear extensions are not unique).
  *   **Whiteboard:** Draw two distinct maximal elements in a poset. Label them "Zorn gives *this*, not *that*."

  **0:10–0:20: Building and Breaking Finite Intuition**
  Build the intuition: "In a finite poset, you can just keep picking bigger elements until you stop. You must stop because it's finite."
  Break the intuition: Write $(\mathbb{N}, \leq)$. "Can I keep picking bigger elements?" Yes. "Do I ever stop?" No. "Why doesn't this poset have a maximal element?" Because the chain $1 < 2 < 3 \dots$ has no upper bound in $\mathbb{N}$.
  *   **Misconception Alert:** "Every poset has a maximal element."
  *   **Intervention:** This is where you head off the dropped hypothesis. Explicitly write: **Zorn's Lemma is false without the chain condition.** Use $\mathbb{N}$ as the permanent counterexample on the corner of the board.
  *   **Statement:** Now state Zorn's Lemma. Box the hypothesis: "Every chain has an upper bound." Box the conclusion: "There exists a maximal element."

  **0:20–0:40: The Order-Extension Proof (The Core)**
  Define the goal: Extend partial order $\preceq$ on set $S$ to a linear order.
  1.  **Define the Poset $\mathcal{P}$:** This is the critical cognitive hurdle. The elements of $\mathcal{P}$ are *relations* on $S$, not elements of $S$.
      *   **Misconception Alert:** Students think we are applying Zorn to $(S, \preceq)$.
      *   **Intervention:** Write $\mathcal{P} = \{ R \mid R \text{ is a partial order on } S \text{ and } \preceq \subseteq R \}$. Order $\mathcal{P}$ by set inclusion $\subseteq$.
  2.  **Check Zorn's Hypothesis:** Let $\mathcal{C}$ be a chain in $\mathcal{P}$. Let $U = \bigcup_{R \in \mathcal{C}} R$.
      *   **The Work:** Show $U$ is a partial order. Reflexivity/Symmetry are trivial. Transitivity is the key: If $(a,b) \in U$ and $(b,c) \in U$, they come from some $R_1, R_2 \in \mathcal{C}$. Since $\mathcal{C}$ is a **chain**, either $R_1 \subseteq R_2$ or $R_2 \subseteq R_1$. Thus both pairs are in one relation, so $(a,c)$ is in that relation, so in $U$.
      *   **Highlight:** Circle the word **chain**. Ask: "What breaks if $\mathcal{C}$ is just a subset, not a chain?" (Answer: $a,b$ might be in $R_1$, $b,c$ in $R_2$, with no comparison between $R_1, R_2$, so transitivity fails).
  3.  **Check Zorn's Conclusion:** Let $M$ be a maximal element of $\mathcal{P}$. Why is $M$ linear?
      *   If not, there exist incomparable $x,y$. Define $M'$ by adding $(x,y)$ and closing transitively. Show $M \subsetneq M'$. Contradiction.
      *   **Note:** Keep this brief. The magic was in the union step; this is just standard order manipulation.

  **0:40–0:45: Boundaries and Silence**
  Explicitly state what you are refusing to touch.
  *   "We are not proving Zorn's Lemma. It is equivalent to the Axiom of Choice."
  *   "We are not discussing Well-Ordering or Cardinals."
  *   "Zorn's Lemma is non-constructive. We know the linear order exists, but this proof tells you nothing about how to find it."
  *   **Why:** Second-years often conflate existence with construction. Preempt the "but how do I write it down?" questions.

  **0:45–0:50: The Checking Question**
  Do not ask for a proof. Ask them to locate the machinery.
  *   **Question:** "In the proof we just did, exactly which step fails if we take the union of a collection of partial orders that is *not* a chain?"
  *   **Expected Answer:** "Transitivity fails because we can't guarantee the pairs live in the same partial order to compose them."
  *   **Why this works:** If they answer "The union isn't an upper bound" vaguely, they don't get it. If they point to the transitivity check relying on comparability of the relations, they understand where the work lives.

  ### Summary of Misconception Interventions

  1.  **Maximal = Maximum:** Head off at **0:05** with Hasse diagrams. If not fixed here, the Order-Extension conclusion (a *linear* order) confuses them because they expect a *unique* maximum order.
  2.  **Dropping the Chain Condition:** Head off at **0:15** with $(\mathbb{N}, \leq)$. Keep $\mathbb{N}$ on the board. If they ask "Why do we need the chain condition?" point to $\mathbb{N}$.
  3.  **Confusing the Poset:** Head off at **0:25** when defining $\mathcal{P}$. Explicitly write "Elements of $\mathcal{P}$ are sets of pairs."
  4.  **Construction Expectation:** Head off at **0:40** in the "Boundaries" section. State clearly: "This is an existence tool, not a recipe."

  ### What to Refuse to Touch
  *   **Equivalence with AC:** Mention it exists, but say "We treat Zorn as an axiom for this course. Proving equivalence requires cardinal arithmetic we haven't covered."
  *   **Transfinite Induction:** Do not mention it. It suggests a constructive hierarchy that contradicts the non-constructive nature of Zorn.
  *   **Well-Ordering Theorem:** Do not derive it. It distracts from the Order-Extension example.

  ### Final Checking Question
  "In the proof we just did, exactly which step fails if we take the union of a collection of partial orders that is *not* a chain?"
