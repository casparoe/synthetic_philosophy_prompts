answer: |-
  - "My starting point"
  I'm framing this as "Representational Illusionism" (along the lines of Keith Frankish), rather than hard eliminativism. This distinguishes between the functional state of pain (which exists) and the introspective representation of that state as having intrinsic, non-physical qualities (which is the illusion). This framing is crucial for your prioritization because it sidesteps the "you don't really feel pain" objection but makes the mechanics of the misrepresentation the central technical hurdle. If you go full eliminativist, you spend the book denying data; if you go inflationist, you spend it explaining the error. Given your functionalist background and the goal of a monograph, the error-theory route offers the most constructive terrain for a lone writer.

  - "The ranking"
  Prioritize foundational coherence over explanatory scope, and explanatory scope over dialectical persuasion. You need the theory to stand before you can show what it explains, and you need to show what it explains before you can worry about convincing skeptics who rely on brute intuition. This order ensures that if you hit a wall on the first problem, you haven't wasted time building ethical or scientific superstructures on a broken base.

  1. **The self-defeat worry (Problem 1):** This is the existential threat. If your explanation of the illusion presupposes the very phenomenal properties you're denying, the theory collapses into realism or incoherence. It beats the others because it is a binary pass/fail condition for the project; unlike the meta-problem or intuition debates, this isn't about persuading others, but about ensuring your own model doesn't secretly rely on the thing it eliminates. It is also highly tractable for a lone writer, as it requires conceptual analysis of introspective mechanisms rather than empirical data.

  2. **The meta-problem route (Problem 3):** Once coherence is secured, you need a positive engine. Explaining why we *think* there is a hard problem provides the explanatory payoff that distinguishes illusionism from mere skepticism. This beats the intuition problem because it offers a constructive model of cognitive architecture rather than just arguing against others' feelings; it shifts the debate from "you're wrong" to "here is how the machinery works." It is currently the most active area of the field, meaning there is literature to engage with, but it still needs rigorous defense against the "bait-and-switch" charge.

  3. **The status of the intuition itself (Problem 2):** This is the dialectical barrier. You must address why smart people insist they know they have qualia, or the book will preach only to the choir. It ranks third because it is largely defensive; solving the self-defeat and meta-problems does much of the heavy lifting here anyway. However, it beats out ethics and science because if you cannot destabilize the opponent's Moorean shift ("I know I have experience"), the downstream implications don't matter. It is tractable conceptually by analyzing the reliability conditions of introspection.

  I'm excluding Ethics (4) and Cognitive Science predictions (5) from the top three because they are downstream dependencies. Ethics is too volatile and invites emotional resistance that can swamp the metaphysical argument, while specific scientific predictions are risky for a philosopher without lab access to verify them. Focus on the metaphysics and epistemology first; the applications can be a concluding chapter rather than a pillar.

  - "What I'd cut"
  I would cut the Downstream Ethics (Problem 4) as a core pillar, reducing it to a speculative concluding chapter. Ethical implications depend entirely on the success of the metaphysical argument; if illusionism fails to coherently dissolve qualia, the ethical discussion is moot. Furthermore, diving deep into AI welfare or animal suffering invites distractions that can derail the primary philosophical argument, turning a metaphysics monograph into a bioethics debate. It is better to secure the ontological ground first; the moral status of systems follows from that, not the other way around.

  - "Decision points"
  Two developments could flip this ranking. First, if a robust cognitive science model of introspective error emerges during your leave that solves the self-defeat worry empirically, you might pivot to make Problem 5 (Science) a core pillar, using the data to bolster the metaphysics. Second, if the field broadly accepts the meta-problem as a successful dissolution of the hard problem, the urgency of Problem 3 decreases, and you might elevate Problem 2 (Intuition) to focus on why resistance persists despite the solution. Conversely, if the self-defeat worry proves intractable conceptually, you may need to pivot to a quasi-realist position, which would fundamentally alter the book's scope.
