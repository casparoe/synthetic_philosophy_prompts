answer: |-
  Your view is robust for normal science but vulnerable during conceptual revolutions. Here are the defeaters, ranked by severity.

  **1. Bell and Quantum Information (Fatal)**
  This is the strongest counter. For decades, the Copenhagen orthodoxy dismissed hidden variables as metaphysical nonsense—precisely the kind of "philosophical" question physicists were told to ignore. Bell, engaging with what was deemed philosophy, derived an inequality that turned metaphysics into experiment. This didn't just clarify QM; it spawned quantum information science. If philosophy is useless, Bell shouldn't have bothered. If physicists always do the conceptual work themselves, why was the community hostile to this specific conceptual work until it bore technological fruit? This suggests philosophy isn't just scorekeeping; it's sometimes the only tool available when formalism stalls.

  **2. Mach and Einstein (Awkward)**
  Einstein explicitly credited Mach's positivism for Special Relativity (operational definitions of simultaneity). You might argue Mach was wrong about atoms, but the *method* was useful scaffolding. Einstein didn't just "do physics"; he used a philosophical framework to dismantle Newtonian absolute space. Your view can absorb this by qualifying that philosophy provides *heuristic scaffolding* that is discarded once the theory stands, but you must concede it was necessary scaffolding, not just post-hoc commentary.

  **3. Measurement and Replication (Moderate)**
  In psychology and biology, philosophical work on measurement validity (e.g., Borsboom, Chang) is actively correcting methodological errors. This is "useful to working science" by your lights, though it targets softer sciences. If you restrict your claim to physics, this is evasive. If you claim it for science generally, this is a concrete counterexample where philosophers are fixing the tools physicists take for granted.

  **Qualifications and Unfalsifiability**
  Your view survives if qualified: "Philosophy is useless for *calculation* and *normal puzzle-solving*, but occasionally vital for *conceptual bottlenecks*." However, this risks unfalsifiability. If every time philosophy helps we reclassify it as "physics thinking out loud" (as with Bell), the claim becomes tautological. Bell was treated as a philosopher by his peers until he was proven right. To avoid tautology, you must acknowledge that work *classified as philosophy by the contemporary community* can drive progress.

  **Verdict**
  Your view is too strong. It correctly identifies that dogmatic philosophy (like positivism forbidding atoms) hinders science. But it fails to recognize that *critical* philosophy (questioning assumptions deemed settled) can unlock new physics. The distinction isn't between physicists and philosophers, but between dogmatists and critics. Sometimes the critic wears a philosophy hat. Admitting this doesn't validate the "philosophers should legislate" crowd, but it concedes that conceptual clarity—often a philosophical trade—is a prerequisite for empirical breakthroughs.
