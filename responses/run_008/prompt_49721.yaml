prompt: |-
  I've been reading about remedial-right theories of secession (Buchanan-style, where secession is only justified as a remedy for serious injustice) versus plebiscitary theories (where any territorial majority that votes for independence has a pro tanto right to it), and I want to test both against Scotland 2014. What's interesting to me is that the UK government just... agreed to the referendum via the Edinburgh Agreement, making it a case of state-consented secession procedure that neither theory seems built for -- the remedial theorist has to say Scotland lacked the right, the plebiscitary theorist has to say the right existed regardless and the consent was superfluous, and both feel wrong somehow. Analyze the episode through both theories: who had standing, what the franchise decisions (16-year-olds, resident non-Scots, expat Scots excluded) did to the "people" whose self-determination was at stake, and whether "The Vow"-style last-minute promises show the process was really about bargaining power rather than rights. Then tell me where each theory is just silent about a consensual negotiated path -- and does Catalonia 2017, where the state refused consent entirely, confirm that the theories only ever get tested in the hard cases?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Remedial-right vs. Plebiscitary theories of secession applied to Scotland 2014.
      *   **Core Problem:** The Edinburgh Agreement (state-consented referendum) creates a "middle ground" that neither theory seems perfectly designed to explain.
          *   Remedial: Scotland lacked serious injustice (so no right?), yet got a vote.
          *   Plebiscitary: Right exists regardless of state consent, yet consent was sought/given.
      *   **Specific Elements to Analyze:**
          *   Standing (Who has the right?).
          *   Franchise decisions (16-17s, resident non-Scots, expat Scots).
          *   "The Vow" (Last-minute promises) -> Bargaining power vs. Rights.
          *   Silence of theories on consensual negotiated paths.
          *   Comparison with Catalonia 2017 (State refusal) -> Do theories only work in hard cases?

  2.  **Initial Brainstorming & Theoretical Mapping:**
      *   *Remedial Right Only (Buchanan):* Secession is a last resort for grave injustices (human rights violations, persistent discrimination, unlawful annexation). Scotland doesn't fit this. They have devolution, representation in Westminster, no persecution. So, under strict Buchanan, Scotland has *no right* to secede. The referendum was a gift from Westminster, not an exercise of right.
      *   *Plebiscitary (Wellman, Beran):* Any distinct territorial group with a democratic majority has a pro tanto right to secede, provided they can function as a state and respect minority rights. Scotland fits this easily. The Edinburgh Agreement wasn't granting the right, but acknowledging it/providing the legal mechanism.
      *   *The "Edinburgh Agreement" Anomaly:* It's a political settlement, not necessarily a juridical recognition of a pre-existing right. It transforms secession from a *right* claim to a *privilege* granted by the center.
      *   *Franchise:* Who is "The People"?
          *   16-17s included: Expands the demos, favors Yes (assumed). Plebiscitary likes this (more democratic). Remedial doesn't care much (injustice is the key, not the headcount).
          *   Non-Scots residents included: Civic nationalism.
          *   Expats excluded: Territorial vs. Ethnic definition.
      *   *The Vow:* Devolution max. Shows the process was negotiable. If it were a *right*, you wouldn't bargain it away for more powers. If it were *remedial*, the remedy would be independence, not devolution. This suggests a *political* process, not a *moral/legal right* process.
      *   *Catalonia:* The counterfactual. No consent. Remedial says "No right (no grave injustice)." Plebiscitary says "Right exists, state is violating it." The contrast highlights that theories are often post-hoc justifications for political struggles.

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. The Scotland 2014 case is indeed a "constitutional anomaly" that exposes the limits of normative theory when faced with political pragmatism.

      *   **Remedial Right Theory (Buchanan) vs. Scotland:**
          *   *Core Tenet:* Secession only for grave injustice.
          *   *Application:* Scotland had no grave injustice. Devolution existed.
          *   *Verdict:* Strictly speaking, Scotland had no right. The referendum was an act of grace/political prudence by Westminster.
          *   *Franchise:* Irrelevant to the theory. If there's no right, who votes doesn't matter morally, only legally.
          *   *The Vow:* Consistent. If there's no right, Westminster can offer alternatives (devolution) to dissuade secession.

      *   **Plebiscitary Theory (Wellman/Beran) vs. Scotland:**
          *   *Core Tenet:* Democratic will + viability = pro tanto right.
          *   *Application:* Scotland clearly meets criteria.
          *   *Verdict:* The right existed *antecedently*. Edinburgh Agreement was procedural recognition, not constitutive of the right.
          *   *Franchise:* Crucial. Defines the "self." Inclusion of residents (non-Scots) aligns with civic plebiscitary views. Exclusion of diaspora is tricky (blood vs. soil). 16+ vote enhances democratic legitimacy.
          *   *The Vow:* Problematic. If you have a right to X, why trade it for Y? Suggests the right wasn't treated as absolute.

      *   **The "Consensual Secession" Blind Spot:**
          *   Both theories assume *conflict*. Remedial assumes oppression; Plebiscitary assumes a claim against state integrity.
          *   Neither theorizes *negotiated dissolution*. They treat sovereignty as zero-sum. Scotland shows sovereignty can be shared/temporary/conditional.
          *   The "Right" vs. "Permission" distinction. Scotland was permission-based.

      *   **Franchise & The "Demos" Problem:**
          *   Who decides who decides? (The *Kompetenz-Kompetenz* issue).
          *   UK Parliament decided the franchise.
          *   Plebiscitary: Should be up to the secessionists.
          *   Remedial: Up to the state (since they hold the right until injustice occurs).
          *   Expat Scots excluded: Undermines ethnic nationalism, supports civic/territorial.

      *   **The Vow & Bargaining Power:**
          *   Reveals the process was political, not juridical.
          *   Rights are trumps (Dworkin); bargaining chips are not.
          *   Shows the "Right" was weak if it could be bought off with more devolution.

      *   **Catalonia 2017 Comparison:**
          *   The "Hard Case."
          *   Remedial: Supports Spain (no grave injustice).
          *   Plebiscitary: Supports Catalonia (majority will, though disputed).
          *   *Crucial Point:* Theories shine in conflict because they are designed to adjudicate conflict. In consensus (Scotland), politics overrides theory. In conflict (Catalonia), theory becomes a weapon.
          *   Confirms the user's suspicion: Normative theories are often post-hoc rationalizations for political outcomes.

  4.  **Refining and Polishing:**
      *   *Tone:* Academic but accessible, analytical, validating the user's sophisticated prompt.
      *   *Key Terminology:* *Pro tanto* right, primary vs. remedial rights, demos, constitutional morality, political constitutionalism.
      *   *Check:* Did I answer all parts of the prompt?
          *   Analyze both theories? Yes.
          *   Standing? Yes.
          *   Franchise (16s, residents, expats)? Yes.
          *   The Vow/Bargaining? Yes.
          *   Silence on consensual paths? Yes.
          *   Catalonia comparison? Yes.

  5.  **Self-Correction/Nuance Check during drafting:**
      *   *Nuance on Plebiscitary:* Some plebiscitary theorists (like Wellman) admit constraints (justice, viability). It's not *pure* majoritarianism. Need to ensure I don't strawman the plebiscitary view.
      *   *Nuance on Remedial:* Buchanan allows for other exceptions (annexation). Scotland wasn't annexed. So the "no right" conclusion holds.
      *   *The "Edinburgh Agreement" nature:* It was a Section 30 order. It temporarily transferred legal competence. This is key. It wasn't recognition of sovereignty, it was delegation of power.
      *   *Catalonia:* Be careful not to take sides on the merits, but focus on how the *theories* would interpret the state's refusal.

  6.  **Final Review:** The structure looks solid. Start with the theoretical clash, move to the specific mechanics (franchise/vow), then zoom out to the consensual blind spot, and end with the Catalonia contrast. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Make sure to emphasize that the Edinburgh Agreement makes the UK Parliament the ultimate arbiter of the *procedure*, which contradicts the Plebiscitary notion that the secessionist group defines the terms.

  7.  **Final Polish:** Ensure clear headings and a strong concluding synthesis. (Okay, ready to write).
answer: |-
  This is a sharp observation. You have identified a significant gap in normative political theory: most theories of secession are designed to adjudicate **conflict**, not **consent**. They assume a adversarial relationship between the secessionist region and the central state. Scotland 2014 represents a "constitutional anomaly"—a legally binding referendum granted by the very state whose integrity was being challenged.

  When the state consents, the moral urgency that drives both Remedial and Plebiscitary theories evaporates, replaced by constitutional politics. Here is an analysis of how both theories struggle to digest the Edinburgh Agreement, the franchise, and "The Vow," followed by the Catalonia comparison.

  ---

  ### 1. Remedial Right Only Theory (Buchanan-Style)
  **Core Premise:** Secession is a *last resort* remedy for grave injustices (persistent human rights violations, discriminatory redistribution, or unlawful annexation). There is no primary right to secede.

  *   **Standing:** Under a strict Buchanan framework, **Scotland had no standing.** Scotland possessed a devolved parliament, proportional representation, robust rule of law, and no history of persecution or cultural suppression by Westminster.
      *   *The Theory's Dilemma:* If there is no right, the 2014 referendum was not an exercise of self-determination but an act of political grace by Westminster. The theory renders the SNP's claim morally null. The Edinburgh Agreement wasn't recognizing a right; it was temporarily waiving the UK's territorial integrity for political stability.
  *   **The Franchise:** Remedial theory is largely indifferent to the franchise *because* it is indifferent to the vote itself. Since the right to secede hasn't been triggered by injustice, who votes is a matter of domestic law, not moral necessity.
      *   *16-17 Year Olds:* Irrelevant to the moral claim.
      *   *Resident Non-Scots:* Irrelevant.
      *   *Expat Scots:* Irrelevant.
      *   *Critique:* This highlights the theory's rigidity. It cannot account for why a democratic vote *should* matter in the absence of injustice. It reduces the referendum to a mere opinion poll sanctioned by the sovereign.
  *   **"The Vow" (Bargaining vs. Rights):** This fits Remedial Theory best. If secession is a remedy for injustice, and the "injustice" is actually just a desire for more autonomy, then offering more autonomy (Devolution Max) is the correct remedy. "The Vow" confirms the Remedial view: the problem wasn't sovereignty, it was policy distribution. The bargaining proves there was no fundamental right to leave, only a negotiable grievance.

  ### 2. Plebiscitary Theory (Wellman, Beran, Philpott)
  **Core Premise:** A distinct territorial group with a democratic majority desire for independence has a *pro tanto* (prima facie) right to secede, provided they respect minority rights and are politically viable.

  *   **Standing:** Scotland clearly meets the criteria. Distinct civil society, clear territory, viable economy, democratic majority (potentially).
      *   *The Theory's Dilemma:* If the right is inherent to the people, **Westminster's consent was superfluous.** The Edinburgh Agreement implies that the right to vote on independence is *granted* by the center, not *held* by the periphery. Plebiscitary theory struggles to explain why the SNP needed a Section 30 order to exercise a right they theoretically already possessed. It forces the plebiscitary theorist to say the Agreement was merely procedural, not constitutive of the right—but legally, it was constitutive.
  *   **The Franchise:** This is where Plebiscitary theory gets traction but also faces friction.
      *   *16-17 Year-olds:* Aligns with the democratic ethos. If the right is based on will-formation, including those subject to the laws (even if under 18) strengthens the legitimacy of the "self" determining itself.
      *   *Resident Non-Scots:* Aligns with civic nationalism (All affected principle). If the state's legitimacy comes from the consent of the governed, residents are the governed.
      *   *Expat Scots Excluded:* This is a problem for ethnic/cultural plebiscitary theories but fits civic versions. However, it underscores that the **UK Parliament defined the demos**, not the Scottish people. A true plebiscitary right would imply the secessionist group defines its own electorate.
  *   **"The Vow" (Bargaining vs. Rights):** This is fatal to the Plebiscitary view in this context. Rights are "trumps" (Dworkin); they are not bargaining chips. If Scotland had a *right* to independence, trading that right for more devolved powers in the final 48 hours suggests the right wasn't treated as absolute. It reveals the process was about **leverage**, not **entitlement**.

  ### 3. The Blind Spot: Consensual Negotiated Secession
  Both theories are silent on the "Edinburgh Model" because both assume sovereignty is zero-sum.
  *   **Remedial Theory** assumes the state is an oppressor that must be escaped.
  *   **Plebiscitary Theory** assumes the state is a container that can be broken if the will exists.

  Neither theorizes a scenario where the state says, "We disagree, but we accept your right to ask."
  *   **The Silence:** Both theories fail to account for **political constitutionalism**. In Scotland, the "right" to secede was not a moral pre-existing condition (Plebiscitary) nor a remedy for wrongs (Remedial); it was a **conventional privilege** granted by the UK's uncodified constitution.
  *   **The Implication:** This suggests that in stable liberal democracies, secession is not a matter of *justice* (which theories address) but of *constitutional convention* (which theories ignore). The theories are built for the Global South or post-imperial contexts (remedial) or abstract ideal theory (plebiscitary), not for the quirks of the British uncodified constitution.

  ### 4. Catalonia 2017: Do Theories Only Work in Hard Cases?
  Your intuition is correct: **Normative theories of secession are primarily tools for adjudicating conflict, not describing procedure.** Catalonia 2017 confirms this.

  *   **The Contrast:**
      *   **Scotland:** Politics swallowed theory. The legal mechanism (Edinburgh Agreement) bypassed the need to determine if a moral right existed.
      *   **Catalonia:** Theory became a weapon. Because Spain refused consent (no Edinburgh Agreement), both sides retreated to normative theories to justify their actions.
          *   *Spain (Remedial-ish):* Argued no grave injustice exists, constitution protects integrity, no right to secede.
          *   *Catalonia (Plebiscitary):* Argued democratic mandate (2017 referendum) creates a right regardless of Spanish law.

  *   **Confirmation of the Limit:**
      *   In Scotland, because the state consented, we didn't *need* to know if Buchanan or Wellman was right. The political settlement rendered the moral question moot.
      *   In Catalonia, because the state refused, the moral question became the *only* question.
      *   **Conclusion:** Remedial and Plebiscitary theories are **crisis theories**. They are designed to tell us what to do when the constitutional order breaks down. When the constitutional order functions (even if flexibly, as in the UK), these theories are silent.

  ### Summary Analysis
  The Scotland 2014 episode exposes that **secession in established democracies is often a matter of power and negotiation, not moral right.**

  1.  **Remedial Theory** is vindicated by "The Vow" (devolution solved the grievance) but embarrassed by the referendum itself (why vote if there's no right?).
  2.  **Plebiscitary Theory** is vindicated by the franchise (democratic inclusivity) but embarrassed by the Edinburgh Agreement (admitting the state holds the ultimate key).
  3.  **The Franchise** showed that the "Self" in self-determination was defined by Westminster, not Edinburgh, undermining the Plebiscitary claim to inherent sovereignty.
  4.  **Catalonia** confirms that these theories only gain traction when the state refuses to play ball.

  **Final Verdict:** You are right to feel that both theories feel "wrong" applied to Scotland. That is because Scotland was not a test of *moral right*, but a test of *constitutional flexibility*. The theories assume a clash of rights; Scotland was a negotiation of powers. The silence of the theories on consensual paths suggests they are ill-equipped to handle liberal democracies where the center is willing to let the periphery go, provided the paperwork is signed.
