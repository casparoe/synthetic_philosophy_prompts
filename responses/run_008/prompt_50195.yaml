      *   **Part (b): Rigidity Condition.**
          *   *Definition:* $P_{new}(H|E) = P_{old}(H|E)$ and $P_{new}(H|\neg E) = P_{old}(H|\neg E)$. (Conditional probabilities remain fixed).
          *   *Work it does:* It's the bridge principle. It says the *impact* of the evidence on hypotheses (the likelihoods/conditionals) doesn't change, only the credibility of the evidence itself changes. It's a substantive constraint, not a logical truth.
          *   *Student's Answer:* Defines it correctly ($P(H|E)$ same before/after). Claims it follows from axioms/definition of conditional probability. *Major Error.* Rigidity is a substantive constraint on rational belief revision, not a theorem of probability calculus. Experience *can* change conditional probabilities (e.g., if the experience changes your understanding of the connection between E and H).
      *   **Part (c): CC as Special Case.**
