      *   *Option B: Impersonal Total/average Utilitarianism.* (Parfit's Repugnant Conclusion territory). Says we should maximize good states of affairs. Solves Case 2, but implies creating more happy people is always good. Might feel cold.
      *   *Option C: The "Same Number Quality Claim" (Parfit's Principle Q).* "If in either of two possible outcomes the same number of people would live, it would be worse if those who live are worse off." This avoids the "who" problem and focuses on the quality of life of the resulting population.
