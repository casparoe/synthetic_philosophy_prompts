answer: |-
  The principle that best sorts your cases is **The Comparative Principle of Procreative Responsibility**: *When choosing between potential children, you ought to select the one expected to have the most well-being, provided all options result in lives worth living.* Wrongness lies in failing to minimize preventable suffering, not in making a specific existing person worse off than they would otherwise have been.

  **Verdicts on Your Cases:**
  1.  **14-year-old:** Wrong. She failed to create the better-off child possible by waiting.
  2.  **Resource Depletion:** Wrong. This validates your gut: it wrongs the *class* of future people by lowering their quality of life compared to the alternative.
  3.  **Delay for Money:** If wealth significantly improves welfare, delaying is morally required, not just "fine."
  4.  **Drinking:** Wrong. You chose a burdened life over a healthy one (via abortion or abstinence).
  5.  **Deaf Parents:** Wrong. Unless deafness offers equal welfare (debatable), selecting it violates the duty to minimize burdens.

  **Your Decision (CF vs. IVF):**
  This principle ranks **IVF with screening** as the morally preferred choice. Natural conception risks creating a child with CF (Person A); IVF allows creating a different child without CF (Person B). Since CF involves significant suffering, you have a duty to choose Person B. The fact that Person A would never exist is irrelevant; the moral failure is choosing the worse outcome when a better one was available. You are not "sparing" Person A; you are fulfilling a duty to bring into existence the child with the best prospects.

  **Which Verdicts Must Go?**
  To accept this, you must overturn three intuitions:
  1.  **Case 1 ("No one wronged"):** You must accept that an act can wrong a person even if they aren't comparatively harmed. The child is the subject of the moral failure because you failed their interest in having a better life, even if that interest isn't grounded in comparative harm.
  2.  **Case 3 ("Fine"):** If welfare is impacted, the act isn't neutral; it's obligatory.
  3.  **The Need for a Victim:** You must abandon the idea that wrongness requires a victim who is worse off than *they* would have been. Wrongness can attach to the state of affairs itself.

  This resolves your anxiety: You aren't harming a future child by screening; you are honoring a duty to create the best life you can. The "non-identity" logic doesn't excuse you from responsibility; it just shifts the focus from *harm* to *beneficence*.
