  Here are the two candidate rules that best fit her verdicts, followed by my predictions, my assessment of her actual view, and a discriminating test case.

  ### Two Candidate Rules

  **Rule 1: The "Reason for Action" Account (Intentionalist)**
  A regularity is a convention only if the *primary explanatory reason* agents conform to it is their expectation that others will conform.
  *   **Implications:** Explicit promises (Colleagues) block convention status because the reason becomes "I promised," not "I expect you to." Moral duties (Bus Seat, Assault) block it because the reason is "It is right," not "You are doing it." However, moral *sanctions* (Queuing) are permissible because they enforce the expectation without changing the underlying reason for the norm's existence. Codified law (Driving) is irrelevant if the actual reason drivers conform is mutual expectation rather than fear of the statute.
  *   **Key Constraint:** Requires agents to have mental states (expectations) and to view the regularity as *arbitrary* in the sense that they acknowledge the alternative is viable.

  **Rule 2: The "Functional Equilibrium" Account (Structuralist)**
  A regularity is a convention if it *constitutes* a stable coordination equilibrium with at least one viable alternative, regardless of the agents' internal reasons or beliefs about the norm's moral status.
  *   **Implications:** As long as the behavior solves a coordination problem and persists, it is a convention. Whether agents follow it due to promise, fear, habit, or expectation is secondary. The "Colleagues" verdict is explained not by the *reason* for action, but by the fact that an active contract creates an *external* enforcement mechanism that overrides the equilibrium logic; once the contract lapses, the equilibrium logic takes over.
  *   **Key Constraint:** Focuses on the stability and arbitrariness of the *outcome*, not the psychology of the participants.

  ---

  ### Predictions for the New Cases

  | Case | Rule 1 (Reason for Action) | Rule 2 (Functional Equilibrium) |
  | :--- | :--- | :--- |
  | **1. QWERTY** | **Convention.** Typists use QWERTY primarily because they expect others to (network effects). The reason is coordination, even if the alternative is now objectively worse. | **Convention.** It is a stable coordination equilibrium. The fact that the alternative is now worse (lock-in) does not negate that it *was* arbitrary and remains an equilibrium. |
  | **2. RL Agents** | **Not a Convention.** Agents lack minds, expectations, or common knowledge. They cannot conform *because* they expect others to conform. | **Convention.** They have settled into a stable signal–action pairing that solves a coordination problem with alternatives. The function is satisfied. |
  | **3. Marriage Proposals** | **Not a Convention.** A substantial fraction conforms due to religious/egalitarian belief (Duty/Truth), not coordination expectation. They do not view the regularity as arbitrary. | **Convention.** It plausibly solves a coordination problem (avoiding dual proposals or none). The existence of disagreement about the *value* of the alternative doesn't change the equilibrium structure. |

  ---

  ### Best Guess: Which Rule Is She Running?

  I am confident she is running **Rule 1 (The "Reason for Action" Account)**.

  **Why?**
  1.  **The Colleagues Case:** This is the strongest evidence. In Lewis's game theory, a contract is just a way to alter payoffs to ensure an equilibrium. If she were a Structuralist (Rule 2), the presence of a contract shouldn't fundamentally change the *status* of the regularity, only its stability. Her insistence that it is *not* a convention while the agreement stands, but *becomes* one when it lapses, highlights that the **source of the obligation** (promise vs. expectation) is the defining feature.
  2.  **The Bus Seat vs. Queuing Distinction:** Both involve moral sentiments. In Queuing, the indignation is against *breaking* the coordination (cutting in). In Bus Seat, the obligation is to *sacrifice* for another. Rule 1 captures this: in Queuing, I queue because I expect you to queue (coordination). In Bus Seat, I stand because I ought to help (duty). Rule 2 struggles to explain why one moral norm is a convention and the other isn't, as both are stable regularities.
  3.  **The "Too Strong/Too Weak" Comment:** Lewis's definition is often criticized for requiring "Common Knowledge" (too strong) or for being too permissive about what counts as a coordination problem (too weak). By focusing on the *reason for action*, she tightens the definition (excluding RL agents and duty-bound norms) while potentially loosening the "common knowledge" requirement (allowing Queuing despite moral indignation).

  **Therefore, my specific predictions are:**
  1.  **QWERTY:** **Convention.** (Reason is expectation/network).
  2.  **RL Agents:** **Not a Convention.** (Lack the requisite intentionality/expectations).
  3.  **Marriage Proposals:** **Not a Convention.** (A substantial group views it as non-arbitrary/duty-bound, violating the condition that conformity is based on the expectation of others in an arbitrary equilibrium).

  ---

  ### The Discriminating Test Case

  To definitively distinguish between Rule 1 (Reason) and Rule 2 (Function), you need a case where a coordination equilibrium exists and functions perfectly, but the agents' *reason* for conforming is explicitly **not** mutual expectation.

  **The Case: "The Sacred Signal"**
  > Imagine a remote tribe that uses a specific hand gesture to greet one another. This gesture functions perfectly as a coordination equilibrium: everyone does it, everyone expects it, and an alternative gesture would have worked just as well (it is objectively arbitrary). However, every member of the tribe believes the gesture was commanded by their God. They do not perform it because "others do it"; they perform it because "it is Piety." If asked, they would say they would perform the gesture even if no one else did, because God commands it. (In practice, everyone does it, so the equilibrium holds).

  *   **Rule 1 (Reason) Verdict:** **Not a Convention.** The agents' reason for action is religious duty, not mutual expectation. The regularity is sustained by shared belief in a command, not shared knowledge of an equilibrium.
  *   **Rule 2 (Function) Verdict:** **Convention.** It is objectively an arbitrary coordination equilibrium that solves a social problem. The internal justification is irrelevant to the structural status.

  If your professor rules this **Not a Convention**, she is firmly committed to the Intentionalist view (Rule 1) that conventions are a specific kind of *social reasoning*, not just behavioral patterns. If she rules it a **Convention**, she is a Structuralist (Rule 2) who views Lewis's psychological conditions as merely typical causes, not necessary conditions. Given her handling of the "Colleagues" case, I expect she will reject it as a convention.
