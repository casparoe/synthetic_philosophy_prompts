      *   *Refining the "Risk" point:* I need to check if Anscombe explicitly wrote about risk. In "War and Murder," she critiques the erosion of the distinction between combatant and non-combatant. She implies war involves a specific relationship between enemies. Remote killing blurs this. It's less about "courage" and more about the *definition* of the act.
      *   *Refining the "Double Effect" point:* Sam is right that precision helps PDE. *However*, Anscombe was strict. If you know civilians *will* die (collateral damage), is it truly unintended? She might argue that if the collateral damage is too high, the intention becomes suspect (you're doing it *despite* the cost, which edges toward intending it).
      *   *Refining the "Autonomous" point:* This is the strongest philosophical clash. Anscombe is an action theorist. Action requires intention. No human intention = no human action in the moral sense. This creates a void.

