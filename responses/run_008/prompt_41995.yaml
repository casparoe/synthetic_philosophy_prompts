  8.  **Final Polish:** Ensure the distinction between "fatal" (makes the theory untenable) and "awkward" (requires biting a bullet) is clear. Address the "insulation" question directly.

      *(Self-Correction during drafting)*: I need to be careful about the "Reference Class" defense. An SSA-er says the reference class isn't arbitrary; it's "observers subjectively indistinguishable from me." But that leads to the Solipsism problem or makes the class too small. I need to highlight this tension.

