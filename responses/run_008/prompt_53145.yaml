answer: |-
  **MEMORANDUM**

  **TO:** Civilian Oversight Board Members
  **FROM:** [Your Name/Seat]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Allocation of 4% Police Budget Reallocation

  ### Executive Summary

  Following the fatal shooting during a wellness check last summer, this Board was tasked with recommending the reallocation of approximately 4% of the municipal police budget. We have three proposals on the shortlist: (1) Co-responder model, (2) Standalone Civilian Crisis Team, and (3) Internal Department Investment.

  After reviewing the operational data and the philosophical implications of each model, **I recommend we adopt Option 2: A Standalone Civilian Crisis Team.**

  This recommendation is not a rejection of public safety, but a refinement of it. It aligns our response capabilities with the actual nature of the calls we are funding. While Option 1 (Co-responder) offers a perceived safety net, it retains the dynamic that led to last summer's tragedy: the presence of sworn officers in the lead role during mental health crises inherently escalates the potential for lethal force. Option 3 fails to address the structural issue entirely.

  Option 2 allows us to test the hypothesis that the state's monopoly on violence need not be the first tool deployed for social welfare issues. However, to make this defensible, we must be concrete about the limits of this model, specifically regarding armed subjects.

  ### Reasoning: The Monopoly on Violence vs. The Function of Care

  The debate before us mirrors the tension between Max Weber's definition of the state (the monopoly on legitimate violence) and Egon Bittner's sociological definition of police function (handling situations where "something ought to be done about it now").

  The Chief's allies argue that removing sworn officers from the initial response fractures the state's ability to guarantee safety. They contend that a team without force capacity creates a two-tier system where the monopoly on violence is merely delayed, not reduced.

  I argue the opposite. By deploying a Standalone Civilian Crisis Team, we acknowledge that the "monopoly on violence" is a specific tool, not a universal solvent. When the state sends an armed agent to a mental health crisis, it frames the interaction through the lens of potential coercion. Last summer's incident demonstrated that when the tool available is force, force becomes the likely outcome, even when unnecessary.

  Option 2 shrinks the monopoly not by abolishing it, but by restricting its *deployment*. It asserts that for a significant percentage of calls (welfare checks, substance crises, non-violent disturbances), the "something that ought to be done" is care, not compliance. If a civilian team can resolve 60-70% of these calls without police intervention, we have empirically demonstrated that the monopoly on violence was not required for those resolutions.

  ### The Critical Test: The Armed Scenario

  The strongest argument against Option 2 is the scenario where the civilian team arrives and the subject is armed or becomes violent. This is where the theoretical meets the practical, and where we must be precise to avoid endangering our responders or the public.

  **Protocol for Armed/Imminent Threat Scenarios:**
  If the Civilian Crisis Team encounters a visible weapon or an imminent threat of violence, the following protocol applies:

  1.  **Immediate Withdrawal:** The civilian team is trained and mandated to withdraw to a safe distance or remain in their vehicle. They do not engage.
  2.  **Request for Support:** The team contacts Dispatch via a dedicated channel (not 911 general queue) to request sworn officer assistance.
  3.  **Transfer of Command:** Upon arrival, sworn officers assume command of the scene. The civilian team acts in an advisory capacity only if safe to do so, or withdraws entirely.
  4.  **Response Time:** Dispatch prioritizes these requests as "Officer Needs Assistance" to minimize delay.

  **Implication for the Monopoly Question:**
  This protocol answers the Chief's concern directly. The state retains its monopoly on violence as a **backstop**, not a **first resort**.
  *   **If the team succeeds without calling police:** The monopoly was unnecessary for that interaction.
  *   **If the team calls police:** The monopoly is activated only when the situation exceeds the capacity of care and requires coercion.

  This validates Bittner's definition: the police are there to handle the exceptional cases where force *is* the relevant tool. By making that the exception rather than the rule, we reduce the total volume of violent interactions between the state and the citizenry.

  ### Addressing the Strongest Counter-Argument

  I want to treat the opposition's primary concern with full honesty: **Response Time and Information Loss.**

  The Chief's allies are correct that if a situation escalates, a standalone team cannot suppress the threat immediately. There will be a delay between the request for backup and the arrival of sworn officers. In a rapidly evolving violent situation, minutes matter. Furthermore, when officers arrive second, they lack the initial context the civilian team gathered, potentially leading to misunderstandings.

  **Why we accept this risk:**
  We accept this risk because the alternative—sending armed officers to every wellness check—guarantees a higher baseline of escalation. The data from similar programs (e.g., Eugene's CAHOOTS) suggests that requests for police backup from civilian teams are rare (typically under 5% of calls).

  We are trading a *theoretical* risk of delayed response in a violent scenario (which triggers the backup protocol) for a *demonstrated* risk of lethal escalation in a non-violent scenario (which Option 1 and 3 maintain). The 4% budget allocation must include funding for robust dispatch triage to ensure that calls with known violence history are routed to police initially, mitigating the "blind arrival" risk for the civilian team.

  ### Conclusion

  We cannot defend the status quo after last summer. Option 3 is insufficient. Option 1 maintains the power dynamic that led to the shooting.

  Option 2 is the only proposal that structurally changes the outcome of a wellness check. It allows us to say to the public: "The state has the power to use force, but we choose to use care whenever possible." It preserves the monopoly on violence for when it is truly needed, rather than broadcasting it as the default greeting.

  I move we recommend Option 2 to the City Council, with the mandatory backup protocol outlined above included as a binding condition of the funding.

  **Recommended Vote:** Yes on Option 2.
