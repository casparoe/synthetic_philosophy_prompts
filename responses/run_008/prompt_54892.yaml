answer: |-
  You are absolutely right to be suspicious. In fact, your intuition is spot-on: the person in your group is wielding a Dennettian slogan to make an anti-Dennettian argument. They are using the "No Skyhooks" line to motivate a form of **explanatory eliminativism** (only neurons are real explanations), whereas Dennett used it to motivate **non-greedy reductionism** (higher-level explanations are real *because* they are supported by lower-level cranes).

  Here is a breakdown you can bring to the group. It distinguishes the distinct claims hidden inside the "No Skyhooks, Only Cranes" slogan, evaluates them, and shows exactly where your colleague's argument collapses into the "greedy reductionism" Dennett warned against.

  ### Part 1: The Spectrum of "No Skyhooks, Only Cranes"

  The slogan is ambiguous. It can range from a trivial methodological rule to a radical metaphysical claim. Here are four distinct readings, from weakest to strongest.

  #### 1. The Anti-Miracle Principle (Methodological)
  *   **The Claim:** We cannot appeal to supernatural intervention, magic, or brute facts that lack a history. Every complex thing must have a genealogy of how it got there.
  *   **Status:** **Trivially True** (for naturalists). Almost no one in philosophy of mind disputes this anymore.
  *   **Does it support your colleague?** **No.** This does not rule out beliefs. You can have a naturalistic history of how beliefs arise (evolution, learning) without reducing them to neurons. A "crane" can be a cognitive process, not just a chemical one.

  #### 2. The Dependency Thesis (Ontological)
  *   **The Claim:** Higher-level phenomena (minds, beliefs) depend entirely on lower-level phenomena (brains, neurons). There is no "spooky stuff" floating above the physics. If you change the neurons, you change the mind.
  *   **Status:** **Substantive and Defensible.** This is standard non-reductive physicalism.
  *   **Does it support your colleague?** **No.** Dependency does not imply *replacement*. A software program depends on hardware, but you still explain bugs by looking at the code, not the voltage. This thesis allows beliefs to exist as long as they supervene on physics.

  #### 3. The Exhaustive Explanation Thesis (Strong Reductionism)
  *   **The Claim:** Because everything is built from the bottom up, a complete explanation of any event *can* be given solely in the vocabulary of the bottom level (physics/neurochemistry).
  *   **Status:** **Debatable/False.** While arguably true in principle (the causal closure of the physical), it is false in practice and often false in principle regarding *meaning*. A list of neuron firings does not capture the *content* of a belief (the "aboutness").
  *   **Does it support your colleague?** **Yes, partially.** This suggests that if we had enough data, we wouldn't *need* beliefs to explain behavior. But it doesn't yet say beliefs are *fake*.

  #### 4. The Eliminativist Thesis (Radical Exclusion)
  *   **The Claim:** Because the lower level does all the *causal work*, higher-level explanations (beliefs, reasons) are merely convenient fictions. They are "skyhooks" because they pretend to have causal power that actually belongs to the neurons. Therefore, we should stop using them in serious explanation.
  *   **Status:** **False (according to Dennett).** This is the claim your colleague is making.
  *   **Does it support your colleague?** **Yes, this is their conclusion.** But this is the reading that triggers the "greedy reductionism" alarm.

  ---

  ### Part 2: Where Greedy Reductionism Fits In

  Your colleague is assuming that if an explanation isn't at the "bottom" level, it is a Skyhook. **Dennett explicitly rejects this.**

  For Dennett, a **Skyhook** is an explanation that claims to hang from nothing (e.g., "It happened because of a soul" or "It happened because of Intelligent Design" without specifying the mechanism).
  A **Crane** is any mechanism that lifts complexity from simplicity.

  **The Crucial Point:** Higher-level explanations (like psychology) *are* cranes, provided they are grounded in lower levels.
  *   **Greedy Reductionism** is the mistake of saying: "Because there are cranes at the bottom, the cranes at the top aren't real."
  *   **Dennett's View:** "Because there are cranes at the bottom, the cranes at the top are *possible* and *real patterns*."

  If your colleague says, "Talk about neurons, not beliefs," they are trying to lift the weight of explanation using *only* the bottom crane. Dennett argues this is inefficient and often impossible because the patterns exist at the higher level, not the lower one.

  **Analogy:**
  *   **Skyhook:** "The chess computer moved the Queen because it desires victory." (If you think 'desire' is magic).
  *   **Greedy Reductionist:** "The chess computer moved the Queen because of voltage changes in the CPU. Talk of 'strategy' is fake."
  *   **Dennett:** "The chess computer moved the Queen because of voltage changes (crane 1), which instantiate algorithms (crane 2), which instantiate strategy (crane 3). The strategy is real because it is a **Real Pattern**."

  ---

  ### Part 3: Dennett's Actual Position (The "Petard")

  To help your group see the contradiction, you can point to two specific Dennettian concepts that directly contradict your colleague's usage of the slogan.

  **1. The Intentional Stance**
  Dennett argues that we predict the behavior of systems (people, chess computers, animals) by treating them *as if* they have beliefs and desires. He argues this isn't just a shortcut; it picks out **real patterns**. If you can reliably predict behavior using belief-talk, those beliefs are as real as anything else. To deny them is to be a "greedy reductionist."

  **2. Real Patterns (1991)**
  In his paper *Real Patterns*, Dennett argues that beliefs are not "in the head" like little sentences, but they are objective features of the world, like centers of gravity.
  *   *Center of Gravity:* You can't find a center of gravity in a particle scanner. It doesn't exist at the micro-level. But it is not a "skyhook." It is a real, explanatory feature grounded in physics.
  *   *Beliefs:* Same thing. You won't find a "belief" in a neuron. But that doesn't make it a skyhook. It makes it a higher-level crane.

  **The Hoisting:**
  Your colleague is arguing: *"No Skyhooks" = "Only Micro-Physical Explanations."*
  Dennett's actual argument: *"No Skyhooks" = "No Magic, but Higher-Level Patterns are Real."*

  By trying to eliminate beliefs, your colleague is treating the Intentional Stance as a Skyhook. Dennett treats it as a Crane. Therefore, your colleague is committing the very error Dennett warned against.

  ---

  ### Part 4: Discussion Questions for the Group

  If you want to press this gently in the group, here are three questions derived from this analysis:

  1.  **The Definition Question:** "When we say 'No Skyhooks,' are we ruling out *supernatural* explanations, or are we ruling out *higher-level* explanations? Dennett seems to think a psychological explanation can be a 'crane' if it's grounded in evolution. Why isn't 'belief' a crane?"
  2.  **The Efficiency Question:** "Dennett argues that greedy reductionism fails because the patterns disappear at the micro-level. If I want to explain why you raised your hand, is the explanation 'C-fibers fired' or 'You wanted to ask a question'? If the latter is more predictive, isn't it the better 'crane'?"
  3.  **The Reality Question:** "Is a 'center of gravity' a skyhook? It's not made of atoms, and you can't find it with a microscope, but it's physically real and explanatory. Can beliefs be like centers of gravity rather than like ghosts?"

  ### Summary for your notes
  *   **Your suspicion:** Correct.
  *   **The Slogan:** Compatible with physicalism, but incompatible with eliminativism.
  *   **The Mistake:** Your colleague conflates "grounding" (beliefs depend on neurons) with "replacement" (beliefs are not real explanations).
  *   **The Verdict:** Your colleague is practicing **Greedy Reductionism**. They are using Dennett's argument against magic to argue against *abstraction*, which Dennett explicitly defended.

  Dennett is indeed dead, but his texts are clear: He was a reductionist about *ontology* (it's all stuff), but a pluralist about *explanation* (you need many levels of cranes to lift the world). Your colleague is trying to lift the world with only one crane.
