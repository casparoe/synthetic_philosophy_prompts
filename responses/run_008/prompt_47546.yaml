answer: |-
  Yes, there is an established name for this, though it lives in a few different neighborhoods depending on whether you ask an economist, a game theorist, or an AI safety researcher.

  The specific term for the dynamic you are describing is a **Commitment Race**.

  While Thomas Schelling laid the groundwork for *commitment*, the specific pathology of the *race* to commit under uncertainty has been formalized more recently, particularly in the literature on **Preemption Games** and, most sharply, in current research on **Algorithmic Game Theory** (which aligns with your intuition about AI agents).

  Here is the breakdown of the concept, how it differs from First-Mover Advantage, and the boundaries you asked for.

  ### 1. The Name: Commitment Race
  In classical Industrial Organization economics, this is often modeled as a **Preemption Game with Incomplete Information**. However, the term **Commitment Race** has been adopted (notably in recent papers like *Commitment Races in Game-Playing AI* by Oesterheld et al.) to describe exactly the scenario you outlined: agents are incentivized to make commitments earlier than they would prefer based on fundamental value, purely to preempt the other side's ability to commit.

  The core mechanism is the **destruction of Real Option Value**. In finance and strategy, "waiting" has value (the "option" to see how the market develops before investing). A Commitment Race occurs when the *strategic* value of blocking the opponent outweighs the *informational* value of waiting. You are paying a premium (in ignorance) to buy a monopoly (in commitment).

  ### 2. Commitment Race vs. First-Mover Advantage
  This is the critical distinction you asked for. They look similar (both involve moving early) but the incentives are opposite.

  *   **First-Mover Advantage (FMA):** Moving first creates *new* value.
      *   *Example:* Launching a product first lets you build brand loyalty.
      *   *Logic:* "I want to move first because the pie is bigger for the first person."
      *   *Information:* You still prefer to move first *after* you know the market is good. You don't want to move early under ignorance; you just want to move early relative to competitors once the green light is on.
  *   **Commitment Race:** Moving first *preserves* value by denying it to the other, often destroying net value.
      *   *Example:* Signing an exclusive supplier contract before you know if demand exists.
      *   *Logic:* "I want to move now, even if I'm blind, because if I wait one more second, *you* will lock me out."
      *   *Information:* You are forced to trade information for security. The earlier you move, the less you know, but the safer you are from preemption.

  In an FMA, if you could ban the other player from entering, you'd still wait for certainty. In a Commitment Race, if you could ban the other player from entering, you *would* wait for certainty. The race exists *only* because the other player can bind themselves.

  ### 3. Defining the Edges (Where does it stop?)
  You asked for the boundaries of the concept. A situation only counts as a pathological Commitment Race if it meets these four criteria:

  **A. Observability (The "Visible" Edge)**
  *   **Condition:** The commitment must be observable *before* the other side makes their decision.
  *   **Boundary:** If you commit but the other side cannot see it until after they have acted, it is not a Commitment Race; it is a **Simultaneous Move Game** (or a gamble). The race logic collapses if the "threat" isn't received.
  *   **Nuance:** This is why AI agents are scary here. If agents can broadcast cryptographic commitments instantly, the "observation lag" shrinks to zero, accelerating the race to machine speed.

  **B. Irreversibility (The "Hard" Edge)**
  *   **Condition:** The move must be costly or impossible to undo.
  *   **Boundary:** If commitments are **cheap talk** (easy to fake or reverse), it is not a Commitment Race; it is a **Signaling Game**. In a Signaling Game, you race to send the loudest signal, but you don't actually lock yourself into a bad position. The pathology you described requires *actual* lock-in.
  *   **Nuance:** "Burning bridges" is the classic example. If the bridge can be rebuilt cheaply, the race doesn't happen.

  **C. Symmetry of Capability (The "Two-Sided" Edge)**
  *   **Condition:** Both sides must have the technical ability to bind themselves.
  *   **Boundary:** If only **one side** can bind themselves (e.g., only one company has the legal authority to sign exclusive deals, or only one AI has access to a smart contract), it is not a race. It is **Deterrence** or **Hegemony**. The side with the capability wins without racing; the other side simply capitulates. The "race to ignorance" only happens when both hold the gun.

  **D. Uncertainty (The "Epistemic" Edge)**
  *   **Condition:** There must be unresolved uncertainty about the fundamental value of the action (e.g., is the market real?).
  *   **Boundary:** If the value is **known** (perfect information), it is simply a **Preemption Game**. It might still be inefficient, but it's not "epistemically dangerous." The specific tragedy you are identifying—locking into *terrible* positions—requires that the race forces action *before* the fog of war clears.

  ### 4. Why AI Makes This "Wild"
  Your intuition about AI agents is supported by current research. This is often called the **"Logical Commitment Race"** problem in AI safety.

  Human agents have a natural "friction" that prevents Commitment Races from becoming catastrophic:
  1.  **Speed:** We think slowly. This allows time for negotiation.
  2.  **Ambiguity:** Our commitments are rarely 100% binding (lawsuits, reputation costs, changing CEOs).
  3.  **Opacity:** We can't perfectly read each other's source code.

  AI agents using smart contracts remove this friction. If two agents can deploy code that *mathematically guarantees* a response (e.g., "If you enter this market, I will trigger a price war forever"), and they can do this at millisecond speeds, the **Commitment Race** compresses. They may be forced to commit before they have even finished gathering data on the environment, simply to ensure their commitment is registered on the blockchain before the opponent's.

  ### Summary
  *   **Name:** **Commitment Race** (or **Inefficient Preemption**).
  *   **Core Mechanism:** Strategic pressure to commit overrides the fundamental value of waiting (Real Option Value).
  *   **Differentiation:** Unlike First-Mover Advantage, the goal isn't to gain ground, but to deny the opponent the *option* to move.
  *   **Boundaries:** Fails if commitments aren't observable, reversible, one-sided, or if there is no uncertainty.

  The tragedy you are noticing is that **commitment technology is a public good that acts like a private weapon.** Better tools for keeping promises (smart contracts, legal tech) inadvertently create better tools for forcing premature decisions.
