      *   *Correction:* Ensure "Shut up and calculate" gets its due. It's a methodology, not just cowardice.
      *   *Nuance:* Bell's theorem rules out *local hidden variables*. Bohm is *non-local hidden variables*. Make sure that distinction is clear.
      *   *Tone Check:* Keep it conversational but authoritative. "Look, I've seen this movie before."
      *   *Word Count Check:* The user has 10k words. That's ~3,300 per piece. That's plenty for deep dives, but not textbooks. Focus on concepts.

  9.  **Final Polish:** Check against the prompt requirements.
      *   Play the role? Yes.
      *   Think carefully/brainstorm first? Yes.
      *   List candidates then rank? Yes.
      *   Explicit reasoning? Yes.
      *   What changes the ranking? Yes.
      *   Address the specific disputes listed? Yes.

