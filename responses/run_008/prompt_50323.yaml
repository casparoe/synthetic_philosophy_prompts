answer: |-
  **Seminar Handout: Felicity Conditions in the Garden of Earnest**

  **Introduction: The Laboratory of Violation**

  In *How to Do Things with Words*, J.L. Austin proposes that certain utterances are not descriptions of reality but actions performed upon it. When a judge sentences a defendant or a priest marries a couple, the words themselves effect a change in status. However, Austin argues these "performatives" only succeed if specific "felicity conditions" are met. There must be an accepted conventional procedure, the right participants and circumstances, and the correct execution. Furthermore, participants must possess the requisite thoughts and intentions. If these conditions fail, the act may "misfire" (it simply doesn't happen) or be "abused" (it happens but is hollow).

  We are testing a specific hunch: Oscar Wilde's *The Importance of Being Earnest* functions as a laboratory where these felicity conditions are deliberately violated, yet the performatives succeed anyway. The play suggests that social convention can override linguistic rules. As you read the following analysis, note that while Austin's basic taxonomy (locutionary, illocutionary, perlocutionary acts; misfires vs. abuses) is settled ground in speech act theory, the interpretation of specific conditions—particularly sincerity—and the application of these concepts to literature are matters of live disagreement. Where this handout relies on a contested interpretation, it will be flagged as such.

  **1. The Premise: Naming, Baptism, and the Handbag**

  The play's central engine is a demand made by Gwendolen Fairfax. She declares she can only marry a man named "Ernest," claiming the name inspires absolute confidence. The protagonist, Jack Worthing, is not named Ernest; it is an alias he uses in the city. To satisfy Gwendolen, Jack resolves to be "rechristened." He intends to undergo the ceremony of baptism to confer the name upon him formally.

  From an Austinian perspective, naming is a paradigmatic performative. A baptism does not describe a name; it confers it. Jack's plan acknowledges this: he believes the name must be instituted by ceremony rather than discovered. However, the play complicates this. In the final act, it is revealed that Jack was named Ernest at birth. He was lost as an infant in a handbag at Victoria Station and adopted by a man who named him Jack. The revelation comes not through a new ceremony, but through testimony: Miss Prism, the governess who lost him, identifies the handbag, and the record of his birth is established via evidence.

  This creates a tension. If naming is purely performative, Jack's birth name should not matter without the social recognition of it. Yet, the play treats the discovery of his birth name as the solution. Does this suggest Wilde is mocking the Austinian point? Or is he dramatizing the constative truth underlying the performative? On one reading, the ending repairs the performative: Jack is Ernest, so the marriage can proceed. On another, it reveals the performative was never needed because the "fact" of the name existed all along.

  Crucially, the revelation arrives via evidence (the handbag) and testimony (Miss Prism), not through an act of naming. This strains Austin's framework. Austin distinguishes between constatives (true/false statements) and performatives (happy/unhappy acts). Here, a constative report ("This is the handbag") validates a performative requirement ("You must be named Ernest"). If the name is a matter of social convention, the birth record should be irrelevant without the ceremony. Wilde seems to suggest that the "truth" of the name matters more than the act of naming, potentially reversing Austin's priority. However, scholars debate whether Austin ultimately maintained a strict constative/performative distinction, as he later conceded that all speech involves action. If we accept Austin's later view, the testimony itself is a performative act of validation, resolving the tension.

  **2. Cecily's Diary: Manufacturing the Past**

  Perhaps the philosophically strangest scene involves Cecily Cardew, Jack's ward. Before she has ever met Algernon (who is pretending to be Jack's brother, Ernest), Cecily has written out their entire courtship in her diary. She has recorded specific dates, a proposal of marriage, a breakup, and a reconciliation. She has even purchased an engagement ring. When Algernon arrives, Cecily treats the diary entry as binding history. She informs him they are already engaged, based on the record she created.

  Algernon, rather than rejecting this, accepts the diary's authority. He agrees to fulfill the proposal written in the past. This scene presents a performative that manufactures the past it purports to record. In Austin's taxonomy, a record is usually secondary to the act; the marriage happens, then it is recorded. Here, the record precedes and necessitates the act.

  Is this a counterexample to Austin? Austin acknowledges that inscriptions can have force, but he generally treats them as evidence of prior acts. Cecily's diary functions as an institutional record without the institution. It belongs to a category of "fiction treated as fact." My honest verdict is that this is not a standard performative but a simulation of one that succeeds due to social complicity. Algernon could refuse, causing the act to misfire. He does not. Therefore, the felicity condition of "uptake" (the audience understanding and accepting the act) is met, even though the condition of "prior procedure" is violated.

  This scene challenges the direction of fit. Usually, words fit the world. Here, the world is compelled to fit the words. While Austin focuses on the moment of utterance, Wilde extends the temporal scope of the performative. Whether this counts as a genuine speech act or a theatrical metaphor is contested. If we view the diary as a script that the participants agree to enact, it aligns with Austin's requirement for conventional procedure. However, the convention exists only in Cecily's imagination until Algernon consents. This suggests that felicity conditions are not pre-existing rules but negotiable terms between speakers.

  **3. The Sincerity Condition: Bunburying and Abuse**

  Austin classifies a promise made without the intention to keep it as an "abuse." The act occurs—it is a promise—but it is unhappy because the participant lacks the requisite thoughts or feelings. This is distinct from a "misfire," where the act fails to occur at all. In Wilde's world, sincerity is virtually non-existent. Algernon maintains a fictional invalid friend named "Bunbury" to escape social obligations. Jack maintains a fictional wicked brother named "Ernest" to escape moral responsibilities. Both women keep diaries that fictionalize their relationships. The title virtue, "Earnestness," is treated as a name rather than a quality.

  Yet, the engagements and eventual marriages apparently succeed. The couples are united, the social status changes, and the play ends in celebration. This presents two competing readings. The first is that the play demonstrates sincerity is not a genuine felicity condition. The social act of marriage is complete regardless of the internal state of the spouses. The second reading is that insincerity is simply undetectable in a society where nobody checks. The acts are abuses, but because no one audits the intentions, the abuses function as successes.

  Which is better supported? The text leans toward the first reading. Lady Bracknell cares about income and lineage, not love. Gwendolen loves the name, not the man's character. The social machinery grinds forward regardless of psychological truth.

  Here we must flag a significant争议 (contestation) in Austin scholarship. Austin states that insincerity renders an act an abuse but not a nullity. However, later philosophers have argued that intention is constitutive of the act; without sincerity, there is no promise, only a mimicry of one. If we adopt the later view, Wilde's characters are not marrying; they are play-acting. If we adopt Austin's standard view, they are marrying unhappily. Wilde seems to suggest that in high society, the "abuse" is the standard procedure. The performative succeeds *because* everyone understands it as a formality. This implies that felicity conditions are not about truth but about social coherence. Austin might argue this collapses the distinction between acting and living, but Wilde insists the distinction is irrelevant to the outcome.

  **4. Lady Bracknell's Interview: Gatekeeping Authority**

  Lady Bracknell's interrogation of Jack in the first act looks like a formal gatekeeping of participant suitability. Austin lists among his felicity conditions that the participants must be the right persons for the invocation of the particular procedure. For a marriage to be felicitous, the parties must be eligible. Lady Bracknell assesses this eligibility through a rigorous interview: income, politics, and parentage.

  When Jack reveals he was found in a handbag at a railway station, Lady Bracknell declares the marriage impossible. "To lose one parent... may be regarded as a misfortune; to lose both looks like carelessness." Her verdict functions as a performative. She has the social authority to invalidate the union. Without her approval, the marriage would be a social misfire, even if legally valid.

  Is she the play's one genuine expert on felicity conditions? In a sense, yes. She understands that words only have power when backed by institutional authority. She rejects Jack not because he is lying, but because he lacks the proper history to sustain the performance of a gentleman. Her role highlights that felicity conditions are not linguistic rules but power structures. Austin acknowledges the need for appropriate circumstances, but he tends to treat them as neutral conventions. Wilde reveals them as tools of class exclusion. Lady Bracknell's authority is the ultimate felicity condition; without her "I approve," the other performatives (proposals, engagements) lack social uptake. When Jack is revealed to be of high birth (the handbag mystery resolved), Lady Bracknell's verdict flips. The facts haven't changed, but the social classification has. This confirms that the felicity condition is not the truth of the birth, but the acceptability of the birth to the authority figure.

  **Closing: Where the Reading Strains**

  We must conclude by acknowledging where this Austinian lens strains against the text. Wilde precedes Austin by decades, and the play is arguably about Victorian earnestness and the hypocrisy of sincerity-as-social-virtue rather than about speech acts at all. Applying Austin risks anachronism, imposing a mid-century analytic framework on a late-century aesthetic comedy.

  Where does the lens illuminate? It clarifies the mechanism of Wilde's humor. The comedy arises from the gap between the rules of language and the rules of society. Austin provides the vocabulary to describe why the characters' lies work: they are satisfying the external conditions of the speech act while voiding the internal ones. It helps us see Lady Bracknell not just as a snob, but as the guardian of conventional procedure.

  Where is it mere anachronism? Austin is concerned with how language hooks onto reality. Wilde is concerned with how society masks reality. Austin wants to cure philosophy of confusion; Wilde wants to entertain society with confusion. Treating Cecily's diary as a serious speech act might overlook its function as a satire on romantic sentimentalism.

  Finally, is there anything in the play that speech-act literature lacks the resources to capture? Yes: the aesthetic dimension of the infelicity. Austin treats misfires and abuses as failures to be corrected or categorized. Wilde treats them as successes to be celebrated. The play suggests that the "abuse" of language is where human freedom lies. If we are bound strictly by felicity conditions, we are trapped in procedure. By violating them—by Bunburying, by writing diaries that rewrite history—the characters escape the rigidity of their social roles.

  Later developments in speech act theory, particularly those focusing on convention versus intention (such as the work of Searle or Derrida), might capture this tension better than Austin's initial lectures. The debate over whether convention or intention grounds the speech act mirrors the conflict in the play between social form (Bracknell) and individual desire (Jack/Algernon). Wilde anticipates the objection that rules are always subject to subversion. While Austin maps the rules, Wilde maps the loopholes. For your seminar, the question remains: does the loophole invalidate the rule, or is the loophole part of the rule's structure? Wilde suggests the latter; Austin might have insisted on the former.
