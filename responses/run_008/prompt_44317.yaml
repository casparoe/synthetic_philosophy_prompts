answer: |-
  Here is a decision tree designed for your reading group. It maps the logical space of "successful but false" models first, then locates the philosophical positions within that space.

  ### The Starting Point (The Root)
  **Agreed Scenario:** We have a Model $M$. It has produced a **correct, novel prediction**. However, we know for a fact that one of its **central assumptions is false**.

  ---

  ### The Three Axes (Logical Space)
  To navigate the space, answer these three questions. They are ordered by priority. None require philosophy training; they are questions about how you treat the model in the lab.

  **Question 1: The Swap Test (Goal)**
  If a rival model came along that predicted *better* but relied on physical mechanisms you knew were impossible (e.g., action-at-a-distance in a local theory), would you adopt the rival as your final description of the system?
  *   **Yes:** I care primarily that the numbers come out right. (**Prediction Priority**)
  *   **No:** I care primarily that the story matches the machinery. (**Explanation Priority**)

  **Question 2: The Lie Test (Nature of Assumption)**
  Is the false assumption a **simplification** of something real (e.g., treating a gas as point particles when they have volume), or is it a **posit** of something that doesn't exist at all (e.g., treating heat as a fluid, or utility as a measurable quantity)?
  *   **Simplification:** It describes a real factor, just roughly. (**Idealization**)
  *   **Posit:** It describes a factor that isn't there. (**Fiction/Error**)

  **Question 3: The Limit Test (Trajectory)**
  In the final, complete theory of this domain, do we expect this assumption (or its mathematical limit) to **survive**, or do we expect it to be **discarded** entirely?
  *   **Survive:** The new theory will contain this one as a limiting case. (**Permanent**)
  *   **Discard:** The new theory will look fundamentally different; this is a scaffold. (**Temporary**)

  ---

  ### The Decision Tree

  ```text
  START: Model predicts well, Assumption is false.
  │
  ├── Q1: The Swap Test
  │   │
  │   ├── YES (Prediction Priority) ──────────────────────────────┐
  │   │   │                                                       │
  │   │   ├── Q2: The Lie Test                                    │
  │   │   │   │                                                   │
  │   │   │   ├── Simplification (Idealization)                   │
  │   │   │   │   │                                               │
  │   │   │   │   ├── Q3: The Limit Test                          │
  │   │   │   │   │   ├── Survive ──────────────► LEAF 1          │
  │   │   │   │   │   └── Discard ──────────────► LEAF 2          │
  │   │   │   │                                                   │
  │   │   │   └── Posit (Fiction/Error)                           │
  │   │   │       │                                               │
  │   │   │       ├── Q3: The Limit Test                          │
  │   │   │       │   ├── Survive ──────────────► LEAF 3          │
  │   │   │       │   └── Discard ──────────────► LEAF 4          │
  │   │   │                                                          
  │   └── NO (Explanation Priority) ──────────────────────────────┐
  │       │                                                       │
  │       ├── Q2: The Lie Test                                    │
  │       │   │                                                   │
  │       │   ├── Simplification (Idealization)                   │
  │       │   │   │                                               │
  │       │   │   ├── Q3: The Limit Test                          │
  │       │   │   │   ├── Survive ──────────────► LEAF 5          │
  │       │   │   │   └── Discard ──────────────► LEAF 6          │
  │       │   │                                                   │
  │       │   └── Posit (Fiction/Error)                           │
  │       │       │                                               │
  │       │       ├── Q3: The Limit Test                          │
  │       │       │   ├── Survive ──────────────► LEAF 7          │
  │       │       │   └── Discard ──────────────► LEAF 8          │
  ```

  ---

  ### The Leaves (Mapping Positions)

  Here is where the standard philosophical positions land in the logical space defined above.

  **LEAF 1: Friedmanite Instrumentalism**
  *(Prediction / Simplification / Permanent)*
  The assumption is a deliberate simplification. It doesn't need to be true; it needs to yield accurate predictions. We keep it because it works, not because it mirrors reality.
  *   *The Vibe:* "Don't hold the assumptions against the theory; the prediction is the only verdict."

  **LEAF 2: Constructive Empiricism**
  *(Prediction / Simplification / Temporary)*
  We accept the model because it "saves the phenomena." The assumption is an approximation we expect to refine later for higher precision, but we don't believe the current version is literally true.
  *   *The Vibe:* "Believe the observation, not the model. We'll fix the approximation later."

  **LEAF 3: Radical Fictionalism**
  *(Prediction / Posit / Permanent)*
  The assumption is a known falsehood (a fiction) with no real counterpart. We keep it forever because it is computationally useful, not because it tracks truth.
  *   *The Vibe:* "Treat the model 'as if' it were true. It's a useful lie, and it always will be."

  **LEAF 4: Provisional Pragmatism**
  *(Prediction / Posit / Temporary)*
  The assumption is wrong, but the model is useful for now. We expect a future theory to throw this assumption out completely. We use it while waiting for the real story.
  *   *The Vibe:* "It's a stopgap. Use it, but don't marry it."

  **LEAF 5: Galilean Idealization**
  *(Explanation / Simplification / Permanent)*
  We need the false assumption to isolate specific causal powers. Removing the simplification (e.g., adding friction back in) would obscure the underlying mechanism we are trying to explain.
  *   *The Vibe:* "Distortion is necessary to see the signal. The idealization reveals the capacity."

  **LEAF 6: Approximate Realism**
  *(Explanation / Simplification / Temporary)*
  The model is approximately true. We explain phenomena by showing how the real world converges toward this model as we remove the idealizations (e.g., as pressure drops, real gas becomes ideal gas).
  *   *The Vibe:* "Truth is the limit. We are converging on the real mechanism by stripping away simplifications."

  **LEAF 7: Structural Realism**
  *(Explanation / Posit / Permanent)*
  The entities in the assumption (the "posit") don't exist, but the mathematical structure relating them does. We explain the world via the relations, not the objects.
  *   *The Vibe:* "The gears are wrong, but the transmission ratio is right. Keep the math, dump the ontology."

  **LEAF 8: Mechanistic Realism**
  *(Explanation / Posit / Temporary)*
  The assumption posits non-existent entities. Therefore, the model fails to explain anything, even if it predicts well. We must discard it to find the actual mechanism.
  *   *The Vibe:* "Phlogiston predicts burning, but there is no phlogiston. Find the oxygen."

  ---

  ### Instrument Warnings (For the Group Discussion)

  **1. The Blunt Edges (Indistinguishable Leaves)**
  *   **Leaf 1 (Friedman) vs. Leaf 3 (Fictionalism):** In daily practice, these look identical. Both use a false assumption to predict. The difference is *why* you keep it. Friedman thinks the assumption represents real forces simplified (Leaf 1); the Fictionalist thinks it's a convenient fabrication (Leaf 3). If your group can't agree on whether the assumption is a "simplification" or a "fabrication," the tree won't separate these two.
  *   **Leaf 6 (Approximate Realism) vs. Leaf 8 (Mechanistic Realism):** Both expect the assumption to be discarded eventually. The difference is whether you think the current math is *close* to the truth (Leaf 6) or *fundamentally misguided* (Leaf 8). In the early stages of a theory, these are hard to tell apart.

  **2. The Empty/Unstable Quadrants**
  *   **Leaf 4 (Provisional Pragmatism)** is often an unstable position. If a model predicts well enough, scientists tend to drift toward Leaf 1 (accepting it permanently) or Leaf 8 (rejecting it fundamentally). Staying in "temporary use" for decades is psychologically difficult for working scientists.
  *   **Leaf 3 (Radical Fictionalism)** is rare in hard physics. Physicists usually hate the idea that a successful theory relies on a permanent fiction (see: the struggle with Quantum Mechanics interpretations). It is more common in economics or social sciences.

  **3. The "F-Twist" Location**
  Your debate about Friedman is essentially a debate about **Question 1**.
  *   Half your group thinks **Question 1 = Yes** is the only rational stance for a scientist (Leaf 1).
  *   The other half thinks **Question 1 = No** is required for science to progress (Leaves 5, 6, 7, 8).
  *   Friedman's specific twist is insisting that **Question 2** (whether the assumption is realistic) is irrelevant *if* Question 1 is answered "Yes."

  **How to use this:**
  Don't ask your group which "ism" they are. Ask them to walk the tree. If you find half the group at Leaf 1 and half at Leaf 8, you've identified the disagreement: it's not about the data, it's about whether prediction without mechanism counts as scientific success.
