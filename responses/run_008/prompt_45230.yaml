answer: |-
  You have put your finger on the central engine of historical methodology, yet you are correct that it lacks a single, universally recognized proper noun (like "Gresham's Law" or "Occam's Razor") that captures the *entire* inferential move.

  In the academic literature, this logic is usually fragmented across a few different terms depending on the discipline. In Classics, it falls under **_Quellenforschung_** (source research); in Biblical studies, it is the mechanics behind the **Criterion of Multiple Attestation**; in law, it is the test for **collusion**.

  However, since you are asking for the concept to be "carved" and named, the most precise existing label for the *pattern* you describe is **"Substantial Agreement with Incidental Variation."** When scholars want to name the *inference* drawn from it, they call it **"Establishing Independence."**

  But because you feel (rightly) that this is a distinct epistemic principle, I will outline the concept as it exists, offer the closest existing terminology, and then propose a synthesized label that captures the specific logic you've identified.

  ### 1. The Existing Terminology

  There is no single word, but there are three technical terms that form the vertices of the triangle you are describing:

  *   **Literary Dependence (The Negative Case):** When texts agree too closely (verbatim or near-verbatim), scholars posit a causal link (Author B copied Author A, or both copied C). This *nullifies* the evidentiary value of the agreement. The agreement is no longer about the *event*, but about the *text*.
  *   **Independent Attestation (The Goal):** This is the state scholars want to prove. It means two accounts derive from the event via separate causal chains.
  *   **The Diagnostic of Variation:** This is the missing name you are looking for. It is the method used to prove Independent Attestation. The logic is: *If two accounts agree on the structural skeleton (the event) but diverge on the incidental flesh (details), they likely accessed the event through separate channels.*

  In New Testament scholarship, this is often discussed under the **Synoptic Problem**. The "Two-Source Hypothesis" relies entirely on your observation: Matthew and Luke agree with Mark in structure but diverge in wording; therefore, they are independent witnesses to Mark (or Q), not to each other.

  In Classical Historiography, this is often called **"Cross-Examination of Sources."** The historian treats the texts like witnesses in a courtroom. If two witnesses recite the same script, they are coached (dependence). If they tell the same story but argue about the time of day, they are likely telling the truth (independence).

  ### 2. The Causal Logic (The "Carving")

  To understand why this works, we have to look at the **Causal Structure of Transmission**. There are two main hypotheses for why two texts match:

  1.  **The Common Event Hypothesis:** Event $E$ happened. Witness $A$ saw $E$. Witness $B$ saw $E$. They write Text $T_A$ and Text $T_B$.
      *   *Prediction:* $T_A$ and $T_B$ will match on the core of $E$, but diverge on details due to perspective, memory decay, or stylistic choice.
  2.  **The Common Text Hypothesis:** Author $A$ writes Text $T_A$. Author $B$ reads $T_A$ and writes $T_B$.
      *   *Prediction:* $T_A$ and $T_B$ will match on the core *and* the details, unless $B$ intentionally alters $A$.

  The inferential weight falls on the **distribution of error**.
  *   **Shared Errors** (e.g., both spell a rare name the same unique wrong way) $\rightarrow$ Proves Common Text (Dependence).
  *   **Divergent Errors** (e.g., $A$ says 50 dead, $B$ says 60 dead) $\rightarrow$ Proves Common Event (Independence).

  In Bayesian terms, the divergence **"screens off"** the dependence. Once you establish independence via variation, the agreement on the main event updates the probability of the event's truth significantly. Without the variation, the agreement is "screened" by the likelihood of copying.

  ### 3. Proposed Name: "The Principle of Divergent Corroboration"

  Since no single canonical term exists, if we were to coin a label that distinguishes this from simple "Multiple Attestation" (which assumes independence) and "Textual Criticism" (which assumes manuscript genealogy), the most accurate descriptive name is:

  **The Principle of Divergent Corroboration**

  Or, more technically: **Corroboration via Independent Variation.**

  This distinguishes it from:
  *   **Simple Agreement:** (Which could be copying).
  *   **Consilience:** (Which usually implies *different kinds* of evidence, e.g., archaeology + text).
  *   **Stemmatics:** (Which traces manuscript copying, not historical events).

  ### 4. Boundary Cases and Complications

  You asked for the edges of the concept. This is where the "art" of history comes in, because the pattern can be mimicked.

  **A. Calculated Variation (The "Rewriting" Problem)**
  *   *The Case:* Author B copies Author A but deliberately changes the numbers or names to make it look like they didn't copy, or to improve the style.
  *   *The Risk:* This mimics independence. It creates "Divergent Corroboration" artificially.
  *   *The Test:* Scholars look for **"Tendenz"** (tendency/bias). If the variations consistently favor Author B's theological or political agenda, it's likely rewriting, not independence. Also, if the *structure* of the narrative remains identical (same sequence of speeches, same breaks in the action), it suggests literary dependence despite the verbal variation.

  **B. The Common Oral Tradition (The "Rumor" Problem)**
  *   *The Case:* Author A and Author B did not copy each other, but both listened to the same storyteller or read the same lost pamphlet.
  *   *The Risk:* They appear independent, but they are actually dependent on a third, unknown source ($C$).
  *   *The Test:* This is harder to detect. Scholars look for **"Oral Markers"** (repetitive patterns, mnemonic devices) vs. **"Literary Markers"** (complex syntax, cross-references). If both texts show signs of being distilled from a long oral tradition, they count as *one* attestation of that tradition, not two attestations of the event.

  **C. Memory vs. Text (The Veteran Problem)**
  *   *The Case:* Two veterans recall a battle.
  *   *The Logic:* This is actually the *ideal* application of your principle. Human memory naturally preserves the "gist" (the outcome, the emotional arc) while corrupting the "details" (dates, specific orders).
  *   *The Nuance:* In textual transmission, divergence can be corruption. In memory, divergence is *expected*. Therefore, agreement on the "gist" amidst divergent details is stronger evidence in oral/memory contexts than in literary contexts.
  *   *The Boundary:* If the veterans agree on the *exact wording* of a speech given 10 years ago, that is suspicious (collusion or later reconstruction). If they agree on who won but disagree on the casualty count, that is high-value corroboration.

  **D. Shared Cultural Scripts**
  *   *The Case:* Two historians describe a battle using the same tropes (e.g., "the general gave a rousing speech," "the left flank crumbled").
  *   *The Risk:* This isn't copying, and it isn't independent observation. It's **Genre Convention**.
  *   *The Test:* Scholars must distinguish between **"Topoi"** (standard literary tropes) and **"Reportage."** If the agreement is only on the tropes, it corroborates nothing about the specific event, only about the genre.

  ### 5. Summary of the Concept

  To summarize the concept you have identified, here is the formal structure:

  *   **Name:** **The Principle of Divergent Corroboration** (or *Independence via Variation*).
  *   **Field:** Historical Source Criticism (_Quellenkritik_).
  *   **Premise:** Verbatim agreement suggests a causal link between *texts* (dependence); Structural agreement with detailed divergence suggests a causal link between *texts and event* (independence).
  *   **Inferential Move:** Divergence is not noise; it is the *signal* of independence.
  *   **Condition:** The divergence must be "incidental" (numbers, names, routes) while the agreement is "structural" (outcome, sequence, agents).
  *   **Failure Mode:** If divergence is systematic (always favoring one author's bias) or if agreement is verbatim (including errors), the inference fails.

  You have correctly identified that **independence is not a given; it is a conclusion argued from the pattern of agreement and disagreement.** In the professional literature, this is simply the **"Assessment of Source Independence,"** but your intuition that it deserves a distinct conceptual label is sound. It is the epistemic filter that turns "two books saying the same thing" into "evidence."
