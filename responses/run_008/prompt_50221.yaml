prompt: |-
  so I've fallen back down the two-envelope rabbit hole and this time I want an actual tier list of the proposed resolutions, not the usual "it's just a fallacy, stop worrying about it" hand-wave. quick setup so we're on the same page: two envelopes, one holds twice what the other holds, you pick one at random, and you're offered a swap. the classic argument for swapping: call the amount in mine X, the other envelope then has 2X or X/2, each with probability a half, so its expected value is 5X/4, so swap. and by symetry you'd want to swap right back the second you're holding it, which is the smell that something in the computation is rotten.

  rate each of the following resolutions from 0 to 10 and put them into tiers (S/A/B/C/trash) with one sentence of justification each:

  1. the "you implicitly assumed a uniform prior over an unbounded range, no such distribution exists, so assigning 50/50 to 'double or half' at every value is doing illegal work" argument
  2. the "the real error happens before you open anything; once you open the envelope and condition on the observed amount, ordinary bayesian decision theory handles it fine, and for plenty of priors switching is genuinely favorable at some amounts and not others" argument
  3. the "utility is bounded and wallets are finite, so at the top of the range the doubling has to break, and that break is exactly where the neat symmetry of the argument dies" argument
  4. the deflationary stance that expected value simply isn't a well-defined tool until you have a full distribution in hand, so the correct response to the pre-opening argument is to refuse to compute, not to compute and get 5X/4

  then the part I actually care about. I've been chewing on a variant where the envelopes don't hold money but years added to the end of your own healthy life — one holds twice the other, you don't know which one you picked, everything else is the same. years of life plausibly don't enter your utility linearly the way dollars sort of pretend to, and the marginal value probably saturates. so: does your tier list survive the swap from money to years? does any resolution move up or down once the stakes aren't (pretend) linear in the good, and is there one that only ever worked beacuse money let us ignore the shape of the utility curve? or is my variant just under-specified and I should quit bugging you with it — say so honestly, that's useful to me too.
