answer: |-
  ### The Money Tier List

  **S Tier (9–10/10)**
  **1. The Improper Prior Argument**
  This is the measure-theoretic root cause, identifying that the 50/50 assumption requires a uniform distribution over an infinite range which cannot exist.
  **2. The Bayesian Conditioning Argument**
  This provides the constructive fix by showing that switching decisions depend entirely on the observed value and the specific prior distribution.

  **A Tier (8–8.9/10)**
  **3. The Bounded Utility/Finite World Argument**
  This correctly notes that physical limits force the doubling condition to fail at the upper bound, breaking the symmetry that drives the paradox.

  **B Tier (7–7.9/10)**
  **4. The Deflationary "Refuse to Compute" Argument**
  This is methodologically sound but less explanatory than the top tiers, serving as a veto on the calculation rather than a diagnosis of the error.

  ***

  ### The Life-Years Variant Analysis

  **Does the tier list survive?**
  Broadly, yes, but the weights shift significantly. Resolutions 1 and 2 remain **S Tier** because the probability error is invariant to the unit of measurement; you still cannot have a uniform prior over life years, and Bayesian conditioning still dictates the switch. However, Resolution 3 (Boundedness) jumps firmly into **S Tier** alongside them. In the money version, "finite wallets" is a pragmatic constraint we often wave away with "assume a rich bank," but in the life version, biological maximums are hard constraints that make the "doubling must break" argument undeniable rather than just practical. Resolution 4 also gains strength, moving toward **A Tier**, because calculating Expected *Value* (years) instead of Expected *Utility* (quality of life) becomes obviously nonsensical when the utility curve is known to be non-linear.

  **Does any resolution move up or down?**
  Resolution 3 moves up. In the money context, it is often treated as a "real world" approximation of the mathematical truth found in 1 and 2. In the life context, it becomes a fundamental mathematical constraint because the domain of the variable (human lifespan) is intrinsically bounded, making the improper prior in Resolution 1 physically impossible rather than just mathematically disallowed.

  **Is there one that only ever worked because money let us ignore the shape of the utility curve?**
  No resolution *fails* without linear utility, but the **paradox itself** loses its grip entirely. The original 5X/4 calculation relies on $U(2X) = 2U(X)$ to make the gain from doubling look equal to the loss from halving. With life years, $U(2X) < 2U(X)$ (diminishing returns), so even if the probabilities were magically 50/50, the expected utility gain vanishes. None of the resolutions *depended* on linear utility to be correct, but the money version allowed the paradox to feel plausible by hiding the utility curve; the life version exposes that the "5X/4" logic was never about probability alone, but about conflating value with utility.

  **Is the variant under-specified?**
  No, it is actually *better* specified for resolution. The biological hard cap on human lifespan removes the "improper prior" abstraction and forces a proper bounded distribution, which makes applying Resolution 1 and 3 trivial compared to the money version where we have to argue about the theoretical possibility of infinite wealth.
