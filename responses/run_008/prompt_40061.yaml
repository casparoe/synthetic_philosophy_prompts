  **Specification: Choice Under Indeterminate Expected Value**

  **1. Problem Statement**
  In the Pasadena game, a fair coin is flipped until it first lands heads on toss $n$, whereupon you receive $(-1)^{n+1} \cdot 2^n / n$ dollars. Probabilities shrink as $2^{-n}$, but payoffs alternate in sign and grow without bound. The expected-value series emerges as the alternating harmonic series, $\sum (-1)^{n+1}/n$, which converges only conditionally. Consequently, its "value" depends on the order in which states are summed; by the Riemann rearrangement theorem, the sum can be made to equal any real number. This contrasts with the St. Petersburg game, whose series diverges to infinity, and the textbook case, where the series converges absolutely and order is irrelevant. We require a decision theory capable of adjudicating choices involving such ill-behaved expectations.

  **2. Desiderata**
  Any adequate theory must meet the following requirements:

  1.  **Extension Agreement:** (Required.) The theory must reproduce textbook expected value whenever that value is finite and well-defined. *Motivation:* A generalization must preserve established results in standard domains. *Break:* An agent rejects a sure $5 for a ticket paying $5 with probability 1, creating a Dutch Book against standard finite decision theory.
  2.  **Dominance:** (Required.) The theory must never rank a strictly dominated option at or above its dominator. *Motivation:* Dominance is a minimal condition of instrumental rationality. *Break:* A money pump where an agent pays a fee to switch from Option A to Option B, where B pays strictly more than A in every possible state, ensuring guaranteed loss.
  3.  **Order-Invariance:** (Required.) The value of an option must not depend on how its states are enumerated. *Motivation:* Enumeration is an artifact of description, not a feature of the gamble. *Break:* An agent pays a fee to relabel state indices, manipulating the summation order to change the game's calculated value without altering payoffs or probabilities.
  4.  **Verdict Delivery:** (Required.) The theory must return a determinate preference between a Pasadena ticket and a sure thing, or else supply a principled account of when verdict-freeness is permissible. *Motivation:* Rational agency requires action guidance in the face of choice. *Break:* An agent remains permanently indifferent between Pasadena and $0, failing to act even when delay incurs costs, allowing others to exploit their indecision.
  5.  **Compositionality:** (Required.) The theory must say something non-arbitrary about composites, such as playing Pasadena twice, or a 50/50 mixture of a Pasadena ticket with its sign-flipped mirror. *Motivation:* Rational agents should be able to aggregate risks consistently. *Break:* An agent pays to play both halves of a zero-sum composite (Pasadena + -Pasadena) but refuses to cancel the package for $0, violating basic arithmetic intuition regarding net value.

  **3. Joint Satisfiability**
  **Order-Invariance** and **Verdict Delivery** are jointly unsatisfiable for conditionally convergent cases. Mathematics dictates that for the Pasadena game, the sum's value is inherently order-dependent. To deliver a unique verdict (e.g., "Pasadena > $0"), a theory must privilege a specific summation order (usually the natural number index), thereby violating Order-Invariance. Conversely, respecting Order-Invariance implies admitting no unique value exists, forcing the theory to withhold verdicts. Thus, any theory satisfying Delivery must violate Invariance, or vice versa. This impossibility result suggests we must relax one desideratum or restrict the domain of admissible gambles.

  **4. Original Desideratum: Partition Invariance**
  **Partition Invariance:** The valuation must remain stable under coarse-graining of the state space (e.g., grouping tosses 1 and 2 into a single state) provided the probability measure and payoff function are preserved. *Motivation:* The granularity of the state space is a modeling choice, not an ontological fact; rational value should not hinge on descriptive resolution. *Break:* An agent pays to re-partition the probability space, exploiting the theory's sensitivity to how states are grouped. For instance, a theory might value a game differently if "heads on toss 1 or 2" is one state versus two, despite identical payoff distributions. This excludes theories relying on specific series term structures rather than measure-theoretic integration, distinguishing it from Order-Invariance which concerns sequencing.

  **5. Exclusion of Popular Fixes**
  No single requirement excludes all fixes, but **Order-Invariance** is the most restrictive constraint on proposed solutions.
  *   **Utility Truncations:** Violate Order-Invariance by relying on the natural temporal ordering of tosses to truncate sums.
  *   **Absolute Value Aggregation:** Violates Extension Agreement by altering the value of conditionally convergent series to match absolute sums.
  *   **Risk-Avoidance Fallbacks:** Violate Verdict Delivery by frequently returning "no verdict" rather than a principled ranking against sure things.
