      *   *Refinement on Mechanics:* If I put a probability in the envelope (e.g., 5%), and they allocate 50 points, do they get $50 \times 0.05 = 2.5$ points? Or do we roll a die to see if sentience is "true" for that group?
      *   *Decision:* The prompt suggests "envelopes... a probability... Then dice are rolled." This implies a two-step uncertainty.
          *   Option A (Epistemic): The envelope *is* the credence. The score is $Allocation \times Probability$. This teaches EV directly.
          *   Option B (Metaphysical): The envelope contains a "Truth" (Sentient/Not), determined by a die roll based on the probability. This feels more like gambling.
