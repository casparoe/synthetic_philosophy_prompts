          *   Fly: $10^{10} \times 0.05 = 500,000,000$ EV.
          *   *Adjustment:* If the EV is *too* high, they will just max it out rationally. The tension comes from the *risk* of $S=0$.
      *   **Envelope Mechanics:** To avoid facilitator prep nightmare (pre-writing 20 envelopes), use a die roll at the end.
