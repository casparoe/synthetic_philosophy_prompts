      *   **Goal:** Create an experiential activity where students *feel* the tension of allocating resources under uncertainty, specifically highlighting the conflict between expected value (EV) reasoning and intuitive hesitation (risk aversion/thresholds).
      *   **Proposed Mechanism:** Grant committee simulation. Fixed budget (100 points). Project cards (mammals vs. invertebrates). Sealed "sentience envelopes" with probabilities. Two rounds (one with EV, one with rule changes).
      *   **Deliverables:** Full activity design (materials, rules, cards, mechanics), minute-by-minute timeline, debrief guide, and a "what will go wrong/limitations" section.
      *   **Key Constraint:** The activity must fit 80 minutes and provoke genuine ethical discomfort ("the flinch").

