          *   Invertebrates: Roll d20. Target number based on probability.
      *   **Round 2 Rules:**
          1.  **Threshold:** Ignore any $P < 0.3$.
          2.  **Cap:** Max 20% budget to $P < 0.5$.
          3.  **EV Max:** Must maximize $N \times P$.

  4.  **Addressing the "Limitations" Section:**
      *   The prompt specifically asks for an honest assessment of what the activity *cannot* do.
