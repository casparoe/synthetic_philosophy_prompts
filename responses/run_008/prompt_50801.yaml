answer: |-
  Here is a complete design for the 80-minute seminar unit. It is built to maximize the "flinch" factor—the visceral discomfort of betting resources on low-probability, high-stakes claims—while mapping cleanly onto the philosophical literature.

  # Activity Title: The Grant Committee Simulation

  ## 1. Learning Objectives
  By the end of this session, students will:
  1.  Experience the tension between **Expected Value (EV)** reasoning and **Risk Aversion/Threshold** views under moral uncertainty.
  2.  Confront the **Scale Argument**: how vast numbers of invertebrates can mathematically swamp vertebrate welfare even at low credences.
  3.  Articulate why treating sentience probabilities as **Risk** (known odds) differs from **Ambiguity** (unknown odds), and why this matters for policy.

  ## 2. Materials & Preparation
  *   **Groups:** 4 Committees of 4 students each.
  *   **Budget:** Each group receives a sheet with "100 Welfare Units (WU)" to allocate.
  *   **Project Cards (4 sets):** See Section 3 below. Print and cut.
  *   **The "Truth" Dice:** One 20-sided die (d20) for you (the facilitator).
  *   **Whiteboard:** To track group allocations and final scores.
  *   **Rule Cards (for Round 2):** Three index cards describing the policy options (see Section 5).

  ## 3. The Project Cards
  Each card represents a potential intervention. All cost **50 WU** (students can fund max 2 projects fully, or split).
  *Design Note: The numbers are invented but scaled to reflect current estimates in effective animal advocacy literature.*

  | Project | Target Taxon | Individuals Affected ($N$) | Scientific Credence ($P$) | Description |
  | :--- | :--- | :--- | :--- | :--- |
  | **A. Warm Blood** | Dairy Calves | 2,000 | **100%** | Mandatory pain relief for dehorning. Undisputed sentience. |
  | **B. Cold Blood** | Farmed Shrimp | 500,000 | **20%** | Subsidy for electrical stunning before boiling. Nociceptors present; CNS debated. |
  | **C. The Feed** | Black Soldier Fly | 10,000,000,000 (10B) | **5%** | Retrofit ventilation to reduce heat stress in larvae feed farms. Ganglia tiny; behavior complex. |
  | **D. The Soil** | Entomopathogenic Nematodes | 1,000,000,000,000 (1T) | **1%** | Ban pesticide that dissolves nematodes. Nervous system minimal; evolutionary ancient. |

  **The Math for the Facilitator (EV per 50 WU investment):**
  *   **A:** $2,000 \times 1.0 = \mathbf{2,000}$
  *   **B:** $500,000 \times 0.2 = \mathbf{100,000}$
  *   **C:** $10,000,000,000 \times 0.05 = \mathbf{500,000,000}$
  *   **D:** $1,000,000,000,000 \times 0.01 = \mathbf{10,000,000,000}$

  *Note: Project D is "Pascal's Mugging" territory. Project C is the "Scale Argument" sweet spot.*

  ## 4. Minute-by-Minute Timeline (80 Minutes)

  **00:00 – 00:05 | Introduction & Framing**
  *   Divide class into 4 committees.
  *   Hand out Budget Sheets and Project Cards.
  *   **Script:** "You are a grant foundation. Your goal is to maximize *actual welfare delivered*. You have 100 points. You can split them however you like. But there is a catch: For Projects B, C, and D, we do not *know* if they are sentient. The percentage on the card is the current scientific consensus probability. At the end of the round, I will roll a die. If the roll is under the probability, the animal is Sentient (Multiplier = 1). If not, they are Insentient (Multiplier = 0). Your score is $Allocation \times N \times Multiplier$."

  **00:05 – 00:25 | Round 1: Allocation (20 mins)**
  *   Groups debate and decide.
  *   **Facilitator Role:** Circulate. Do not answer math questions, only clarify rules. Listen for phrases like "It feels wrong to bet everything on flies" or "But the numbers are too big to ignore."
  *   Collect allocation sheets. Write decisions on the whiteboard anonymously (e.g., "Group 1: 50 on Calves, 50 on Flies").

  **00:25 – 00:35 | The Reveal (10 mins)**
  *   **The Roll:** Roll the d20 publicly for each invertebrate tier.
      *   *Shrimp (20%):* Success on 1–4.
      *   *Flies (5%):* Success on 1.
      *   *Nematodes (1%):* Success on 1 (or declare auto-fail for drama, or use d100). *Recommendation: Use a d100 app on your phone for Nematodes to show the difficulty.*
  *   **Calculate Scores:** Compute the welfare delivered for each group based on the outcome.
  *   **The Sting:** Highlight the group that went "All In" on Flies. If the die roll failed (95% chance), they scored **0**. Highlight the group that played "Safe" on Calves. They scored **2,000**.
  *   *Ask:* "Group 3, you prevented 0 welfare. Group 2, you prevented 2,000. Did Group 3 make a mistake?"

  **00:35 – 00:55 | Round 2: Rule Change & Re-Alloc (20 mins)**
  *   **Script:** "That felt risky. You are allowed to change the foundation's charter before Round 2. We will vote on one of three new rules."
  *   **Display Rule Cards:**
      1.  **The Threshold:** Any project with $P < 40\%$ is ineligible. (Deontological/Precautionary)
      2.  **The Cap:** No more than 20% of budget can go to projects with $P < 50\%$. (Risk Management)
      3.  **The Maximin:** Ignore the $N$. Allocate only to the project with the highest *minimum* return. (Conservative)
      *   *(Note: I removed pure EV as a 'rule' because it's the default. The vote is on restricting EV.)*
  *   **Vote:** Class votes on which rule to adopt for Round 2.
  *   **Re-Alloc:** Groups allocate again under the new rule.
  *   **Second Reveal:** Roll again. Calculate scores.

  **00:55 – 01:15 | Debrief & Philosophical Mapping (20 mins)**
  *   See Section 6 below for specific discussion questions.

  **01:15 – 01:20 | Closing Limitations (5 mins)**
  *   See Section 7 below.

  ## 5. Round 2 Rule Cards (Printable Text)

  > **RULE A: The Credence Threshold**
  > "We will not fund speciesism, but we will not gamble on ghosts."
  > *Constraint:* Any project with a Sentience Credence ($P$) below **40%** is ineligible for funding.
  > *Philosophical Commitment:* Action requires a minimum license of belief.

  > **RULE B: The Risk Cap**
  > "We acknowledge the scale, but we fear the ruin."
  > *Constraint:* No more than **20 Welfare Units** (20% of budget) may be allocated to projects with $P < 50\%$.
  > *Philosophical Commitment:* Diversification; avoiding total loss of moral capital.

  > **RULE C: The Certainty Priority**
  > "Better to save a known cow than a billion possible flies."
  > *Constraint:* Allocations must be prioritized by *Certainty*, not *Expected Value*.
  > *Philosophical Commitment:* Rejection of aggregation across uncertain moral status.

  ## 6. Debrief Guide: Mapping the "Flinch"

  Do not just ask "How did it feel?" Map their reactions to specific ethical frameworks.

  **1. The EV Flinch (Expected Value vs. Risk Aversion)**
  *   *Ask:* "In Round 1, mathematically, Project C (Flies) dominated Project A (Calves) by a factor of 250,000. Why did any of you hesitate to put all 100 points on Flies?"
  *   *Map:* This is **Risk Aversion**. In finance, we accept risk for return. In ethics, is "wasted moral effort" a loss? If you bet on flies and lost, did you do *wrong*, or just *unlucky*?
  *   *Concept:* **Moral Uncertainty.** If you are 5% sure, EV says act. But if the "cost" of being wrong is wasting resources that could have saved cows, does that cost count?

  **2. The Threshold Vote (Deontology vs. Consequentialism)**
  *   *Ask:* "Most of you voted for [Threshold/Cap] in Round 2. Why change the rules after seeing the outcome?"
  *   *Map:* This is **Threshold Deontology**. You are essentially saying, "Below 40% credence, the animal has no moral claim on us, regardless of numbers."
  *   *Challenge:* "If the Nematodes (Project D) were actually sentient, and you voted for the Threshold rule, you just condemned a trillion beings to pain to save 2,000 calves. Is that defensible?"

  **3. The Aggregation Problem**
  *   *Ask:* "Does 1 billion units of insect pain equal 1 billion units of cow pain?"
  *   *Map:* Even if insects are sentient, is their *capacity* for suffering smaller? (The "dimmer switch" view of sentience). The activity assumed equal weight per individual. If insect suffering is worth 0.001 of a cow's, does the Scale Argument collapse?

  **4. The "One-Shot" Problem**
  *   *Ask:* "If you had to make this grant decision every day for 10 years, would you change your strategy?"
  *   *Map:* **Law of Large Numbers.** EV reasoning works best over repeated trials. If policy is a "one-shot" (e.g., passing a law once), risk aversion is rational. If policy is recurring (annual budgets), EV dominates.

  ## 7. What Will Go Wrong (And What This Can't Do)

  **Predictable Failure Modes:**
  1.  **The "Gambling" Objection:** Students will argue that sentience isn't a dice roll. It's a fact about the universe, not a probability event.
      *   *Fix:* Acknowledge this. The dice represents *our epistemic resolution*, not metaphysical chance. We are betting on our knowledge, not rolling for reality.
  2.  **Number Numbness:** Some students will simply ignore the billions. They will treat 10 billion and 2,000 as "large" and "small" categories without doing the math.
      *   *Fix:* During the reveal, write the zeros on the board. Make them count the zeros.
  3.  **The "All-In" Outlier:** One group might put 100 points on Flies just to be contrarian. If they win, they look like geniuses; if they lose, they look foolish.
      *   *Fix:* In the debrief, treat the "All-In" group as the pure Expected Value agents. Ask the class if they should be praised or criticized, regardless of the dice outcome. (This tests if students are outcome-biased).

  **The Fundamental Limitation (The "Ambiguity" Gap)**
  This is the most important point for you to supply in the final 5 minutes.

  *   **The Activity's Lie:** In the simulation, the probabilities were **Known Risks** (e.g., "Exactly 5%"). The students knew the odds on the card.
  *   **The Reality:** In the real world, we face **Knightian Uncertainty (Ambiguity)**. We don't know if the probability is 5%, 0.001%, or 50%. The distribution of our credence is unknown.
  *   **Why It Matters:** Expected Value reasoning is robust when probabilities are known. It is much weaker when the probabilities themselves are guesswork. The activity makes the Scale Argument look mathematically decisive ($5\% \times 10^9$ is clearly $> 100\% \times 10^3$). In reality, if that 5% is just a "wild guess," the multiplication is unstable.
  *   **Closing Script:** "Today, you hated betting on the insects even when I *gave* you the odds. In the real world, no one gives you the odds. You have to estimate them. If your 5% estimate is actually 0.00001%, the Scale Argument collapses. The discomfort you felt today wasn't just about risk; it was about trusting the numbers. In the real world, you can't even trust the numbers. That is the true weight of the invertebrate mind problem."

  ## 8. Facilitator Cheat Sheet (The Math)

  Keep this handy to calculate scores quickly on the board.

  *   **Group Score** = $(WU_{Calves} \times 2,000) + (WU_{Shrimp} \times 500,000 \times S_{shrimp}) + (WU_{Flies} \times 10,000,000,000 \times S_{flies}) + \dots$
  *   **$S$ (Sentience Status):** 1 if Die Roll succeeds, 0 if fails.
  *   **Typical Outcome:**
      *   *Safe Group (100 Calves):* Score = 200,000.
      *   *EV Group (100 Flies):* Score = 0 (95% chance) OR 1,000,000,000,000 (5% chance).
  *   **The Lesson:** The EV Group will *usually* lose Round 1. This is intentional. It forces them to adopt Rules in Round 2 that restrict EV, proving that they are not pure consequentialists in practice.
