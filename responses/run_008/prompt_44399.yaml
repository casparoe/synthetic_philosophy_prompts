answer: |-
  The transitivity of the "better-than" relation is a cornerstone of rational choice theory and axiology. It holds that if life $A$ is better than life $B$, and life $B$ is better than life $C$, then life $A$ must be better than life $C$. This principle seems as fundamental to value as it is to logic; to deny it appears to invite irrationality. However, when we apply this relation to the complex, multidimensional comparison of human lives, we encounter spectrum arguments that threaten to break the chain. These arguments suggest that while each small step in a sequence of lives constitutes an improvement, the final destination is worse than the starting point. This essay argues that the spectrum arguments succeed in demonstrating that the "better-than" relation, as it applies to lives involving trade-offs between incommensurable goods like quality and duration, is not transitive. We must reject transitivity not as a logical error, but as a faithful description of how value functions in a world of vague predicates and heterogeneous goods.

  To evaluate this claim, we must first formalize the spectrum argument. Consider a sequence of lives, $w_1$ through $w_n$. Let $w_1$ be a very long life saturated with a low-grade unpleasantness, such as a century of mild boredom and minor aches. Let $w_n$ be a very short life of excellent quality, such as a single day of sublime ecstasy. We construct the intermediate lives such that each step involves a marginal decrease in duration and a marginal increase in quality. The argument proceeds as follows:

  1.  **The Global Intuition:** $w_1$ is better than $w_n$. (A century of mild boredom is preferable to a single day of bliss.)
  2.  **The Local Intuition:** For any $i$ from 1 to $n-1$, $w_{i+1}$ is better than $w_i$. (The slight gain in quality at each step outweighs the slight loss in duration.)
  3.  **The Transitivity Principle:** If $A$ is better than $B$, and $B$ is better than $C$, then $A$ is better than $C$. (Extended to chains: if $w_2 > w_1$, $w_3 > w_2$... then $w_n > w_1$.)
  4.  **The Conclusion:** $w_n$ is better than $w_1$.

  Premises 1 and 4 are contradictory. Since the logic is valid, at least one premise must be false. The argumentative weight rests on Premise 2, the Local Intuition. It is the engine of the spectrum; without the claim that each step is an improvement, the sequence is just a list of different lives with no directional pull. However, Premise 2 is highly plausible. To deny it is to claim that there is some specific minute of life or specific unit of pleasure where a trade-off suddenly becomes catastrophic, which seems arbitrary. Premise 1, the Global Intuition, is also robust; most people firmly believe a long, decent life is better than a fleeting moment of perfection. Consequently, the premise that must be rejected is Premise 3, the Transitivity Principle. The failure lies not in our perception of the steps, nor in our judgment of the endpoints, but in the assumption that "better-than" links them in a transitive chain.

  The most natural defense of transitivity appeals to context-sensitivity. A proponent of transitivity might argue that the word "better" shifts its meaning or reference class across the sequence. When comparing $w_i$ and $w_{i+1}$, the context is local: we are asking if a specific marginal trade is worth it. When comparing $w_1$ and $w_n$, the context is global: we are comparing two distinct shapes of a life. On this view, the failure of transitivity is an artefact of equivocation. We are not comparing the same relation in Premise 2 as we are in Premise 1.

  This reply must be taken seriously, but it ultimately fails to save transitivity because it does not account for what guides rational choice. If "better" is merely context-sensitive, we need to know what the context-invariant relation is that actually matters for decision-making. Presumably, this invariant relation is "all-things-considered choice-worthiness." If $w_{i+1}$ is more choice-worthy than $w_i$ in a local context, and choice-worthiness is the metric we use to live our lives, then $w_{i+1}$ *is* better than $w_i$ simpliciter. The defender of transitivity must argue that the local judgment is misleading—that while $w_{i+1}$ seems better in isolation, it is not *really* better when the full context is accounted for.

  However, this move requires an account of why the local context is epistemically deficient. Why should the comparison of two adjacent lives be less reliable than the comparison of distant ones? The context-sensitivity defense often implies that value is a fixed scalar quantity that we merely measure poorly due to contextual noise. But if value is constituted by the trade-off of incommensurable goods (time vs. intensity), there is no fixed scalar to measure. The "context" is not a distorting lens; it is the substance of the value itself. To say that "better" changes meaning is to admit that there is no single transitive ordering of lives. If the relation that holds between neighbors does not chain to the endpoints, then the relation is not transitive, regardless of whether we label this "equivocation" or "non-transitivity." The context-sensitivity reply saves the word "transitive" only by evacuating the content of the comparison. It posits a "true" betterness that we never actually access in pairwise judgments, rendering it useless for practical reasoning. We are left with the local judgments as our only guide, and those judgments do not chain.

  This leads to a crucial, often overlooked feature of spectrum arguments: the presentation effect. Our judgments about the steps may depend on whether we see the lives in isolation or as a unified sequence. If an agent is shown $w_{7}$ and $w_{8}$ in isolation, they will likely affirm that $w_{8}$ is better. If that same agent is shown the entire spectrum from $w_1$ to $w_n$ laid out together, witnessing the "long slide" from a century of boredom to a day of bliss, they may recoil and deny that the steps are improvements, or insist that $w_1$ is better than $w_n$ despite the local steps.

  Which presentation yields the veridical judgment? If the global view overrides the local view, then Premise 2 of the spectrum argument is false, and transitivity is preserved. If the local view holds authority, transitivity fails. We should treat the isolated pairwise judgment as the primary evidence for betterness. The global presentation introduces cognitive heuristics that are irrelevant to value. When we see the whole sequence, we are prone to "anchoring" on the endpoints or fearing the slippery slope. We begin to judge the *category* of the life rather than the *value* of the life. We think, "A life of one day is tragic," rather than "Is this specific life of one day better than that specific life of one day plus an hour?"

  The pairwise comparison is the atomic unit of value. Rational choice is made between available options, typically a few at a time. We never choose from the infinite set of all possible lives simultaneously; we choose between specific alternatives. If, in every local choice available to an agent moving along the spectrum, the next step is better than the current one, then the agent is rational to take the step. To demand that they anticipate the global endpoint is to demand a form of moral foresight that contradicts the local evidence. If the local evidence says "move forward," and the global view says "stay back," the conflict reveals that value is not a linear path. The global judgment is a heuristic summary, while the local judgment is the operational truth of betterness. Therefore, the fact that the presentation pulls in different directions confirms that the relation is sensitive to the scope of comparison, which is another way of saying it is not strictly transitive across the spectrum. The local truth does not aggregate to a global truth.

  Rejecting transitivity invites a structural consequence that defenders of the principle find alarming: the possibility that there is no "best" option in a set, and that choice becomes unstable. If better-than is not transitive, can we not be trapped in cycles where $A$ is better than $B$, $B$ is better than $C$, and $C$ is better than $A$? This is the fear of the "money pump," where an agent rationally pays to switch from $A$ to $B$, $B$ to $C$, and $C$ to $A$, ending up with $A$ but less money, having gained nothing. If spectrum arguments imply such cycles, the cost of rejecting transitivity seems too high; it renders rational agency impossible.

  However, this consequence is not decisive, because spectrum arguments do not necessarily generate cycles. They generate a failure of long-chain transitivity, not necessarily a failure of local consistency. In the spectrum case, we have $w_2 > w_1$, $w_3 > w_2$, ... but $w_1 > w_n$. This is not a cycle ($A > B > C > A$); it is a divergence. It means the relation is not transitive, but it does not mean every option is better than every other option in a loop. Consequently, we can still make sense of rational choice without a single "maximum" element. We must distinguish between a *maximum* (an option better than all others) and a *maximal* option (an option such that no other available option is better than it).

  In a transitive ordering, a maximal option is usually a maximum. In a non-transitive ordering, we may have multiple maximal options. In the spectrum of lives, there may be no single "best" life. There may be a range of lives that are not dominated by their neighbors, bounded by the intuition that very short lives are bad and very long, low-quality lives are bad. Rational choice does not require finding the one best life; it requires avoiding dominated options. If I am at $w_i$, and $w_{i+1}$ is better, I should move to $w_{i+1}$. If I reach a point where neither neighbor is better, I have reached a maximal option. The instability feared by defenders of transitivity arises only if we assume rationality requires a unique global optimum. If we accept that value landscapes can have multiple peaks or plateaus without a single summit, the loss of transitivity is not a formal inconvenience but a faithful description of tragic choice.

  Furthermore, the "instability" is only practical if the agent is forced to choose repeatedly from the same set with full memory of previous choices. In the context of living a life, one does not cycle through lives. One chooses a life (or a path) once. The structural consequence of non-transitivity is not that we will spin in circles, but that we may not be able to rank all possible lives on a single scale. This is a limitation on our theoretical mapping of value, not necessarily on our practical ability to choose well. We can navigate by local comparisons without needing a global map. To insist on transitivity is to insist that the territory must conform to the map, rather than allowing the map to break where the territory is too complex.

  Therefore, the verdict must be that the "better-than" relation is not transitive when applied to lives involving trade-offs between incommensurable dimensions like quality and duration. The spectrum argument succeeds because it exposes the vagueness inherent in value predicates. Just as "heap" is not a transitive predicate in the sorites paradox (one grain does not make a heap, but adding grains eventually does), "better" is not a transitive predicate across a continuum of marginal changes. The premise to reject is Transitivity. The context-sensitivity reply fails because it attempts to solve a metaphysical problem with a semantic fix, ignoring that the local pairwise judgments are the ones that govern actual choice. The presentation effect confirms that our global intuitions are heuristic summaries that do not override the atomic truth of local comparisons. Finally, the structural consequence of non-transitivity is manageable; it denies us a single "best" life but leaves us with "maximal" lives and a robust method for avoiding dominated options.

  We should not view this failure of transitivity as a defect in rationality. It is a recognition that human value is not a scalar quantity that can be summed and compared across arbitrary distances. It is a textured, local property. To demand transitivity is to demand that the richness of a life be compressible into a single number. The spectrum argument shows that it cannot be. The chain of betterness breaks, not because we are confused, but because the links are made of different materials. A slight improvement in quality is not the same kind of "better" as a massive improvement in duration, even if we use the same word. By accepting the intransitivity of better-than, we preserve the integrity of our local moral intuitions and acknowledge the true complexity of the choices we face. We avoid the absurdity of claiming a day of bliss is better than a century of life, and we avoid the absurdity of claiming that a minute of added boredom makes a life worse. We accept that reason has limits, and that in the spectrum of lives, there is no single peak, but many high places.
