answer: |-
  ### Desiderata for an Adequate Response to Underdetermination

  **1. Scope Specification**
  *   **Requirement:** The response must explicitly identify which formulation of underdetermination it addresses. It must distinguish *local* underdetermination (Duhemian: blame assignment between hypothesis and auxiliaries given a failed prediction) from *global* underdetermination (Quinean: distinct total systems fitting all data). It must further distinguish *transient* underdetermination (tie-breaking evidence is currently unavailable but possible) from *permanent* underdetermination (no possible evidence could distinguish the rivals).
  *   **Motivation:** A solution to transient local underdetermination (e.g., "wait for better telescopes") is trivially inadequate against permanent global skepticism (e.g., "the world was created five minutes ago"). Conflating these allows a response to claim victory by solving the easy case while ignoring the skeptical threat.
  *   **Status:** **Non-Negotiable.** A response that does not declare its target is philosophically ambiguous and practically useless.

  **2. Algorithmic Robustness**
  *   **Requirement:** The response must handle rivals generated by algorithmic transformation of existing theories, not merely historically competing scientific theories. It must account for "de-Occamized" theories (e.g., Newtonian physics plus unobservable forces that cancel out) or skeptical scenarios (e.g., the Five-Minute Hypothesis).
  *   **Motivation:** If a response relies on the claim that "no serious scientist proposes that rival," it mistakes sociology for epistemology. Constructed rivals demonstrate that underdetermination is a structural feature of the logic of confirmation, not a temporary gap in human ingenuity. A response that dismisses these as "unscientific" without independent criteria begs the question.
  *   **Status:** **Non-Negotiable.** Any account of theory choice that fails against logically possible competitors fails to account for the relation between evidence and theory.

  **3. Normative Grounding**
  *   **Requirement:** The response must explain why its proposed tie-breakers (simplicity, coherence, explanatory power, etc.) carry epistemic weight. It must address the second-order worry: if the choice of tie-breakers was itself underdetermined, invoking them is circular. The response must clarify whether these virtues are truth-conducive (realist) or belief-licensing without truth-commitment (pragmatist/expressivist).
  *   **Motivation:** Asserting that "simple theories are better" is a slogan, not an argument. Without an account of *why* simplicity tracks reality (or rationality), theory choice reduces to aesthetics or psychology. The second-order worry prevents bootstrapping: you cannot use science to validate the methods of science if the validity of those methods is what is underdetermined.
  *   **Status:** **Non-Negotiable** (that an account is required); **Partisan** (on the nature of the account). Realists demand truth-conductiveness; Pragmatists deny this is necessary. However, *some* account of normative force is required to distinguish rational choice from arbitrary preference.

  **4. Cognitive Feasibility**
  *   **Requirement:** The response must not impose cognitive demands that exceed the capacities of bounded agents. It cannot require an agent to survey the space of all possible auxiliary assumptions or all possible future evidence to claim justification for a belief.
  *   **Motivation:** Epistemology ought to imply 'can'. If establishing that a theory is not underdetermined requires omniscience (to ensure no hidden rival exists), then no human is ever justified in believing a theory. A response that solves underdetermination only for a Laplacian demon is not a response for scientists.
  *   **Status:** **Non-Negotiable.** An epistemology that renders knowledge impossible for humans is a *reductio* of the epistemology, not a limitation of humans.

  **5. Doxastic Precision**
  *   **Requirement:** The response must distinguish between *having no reason to believe a rival* and *having reason to believe there is no rival*. It must specify whether underdetermination mandates suspension of judgment, permits belief in the "best" available option, or merely describes a logical possibility that lacks practical import.
  *   **Motivation:** Confusing the absence of a defeater with the presence of a positive warrant leads to dogmatism. Conversely, confusing the logical possibility of a rival with a live epistemic threat leads to paralysis. The response must clarify the resulting doxastic attitude: are we believing *against* rivals or simply *without* them?
  *   **Status:** **Non-Negotiable.** Without this distinction, the response cannot guide action or belief formation.

  ***

  ### Incompatibility Flag: The Epistemic Access Gap

  There is a severe tension, potentially an incompatibility, between **Desideratum 3 (Normative Grounding)** and **Desideratum 4 (Cognitive Feasibility)**. To satisfy #3 in a non-circular, truth-conductive manner (as a Realist would wish), one typically needs a global argument about the structure of the world (e.g., "Nature is simple") or a reliableist account of our cognitive faculties. However, verifying that the world is simple or that our faculties are reliable generally requires the very inductive inferences that are underdetermination-vulnerable. If one retreats to Externalism (we *are* reliable, even if we can't prove it), one satisfies #3 objectively but risks violating the spirit of #4, as the bounded agent lacks the *internal access* to know they are safe from underdetermination. If one stays Internalist to satisfy #4's demand on the agent's perspective, one struggles to satisfy #3's demand for non-circular justification. This suggests that a fully satisfying Realist response may be impossible for bounded agents, forcing a choice between skepticism (accepting #3 and #4 cannot be met) and Pragmatism (redefining #3 to drop truth-conductiveness).

  ***

  ### Evaluation of Familiar Replies

  **Appeal to Theoretical Virtues (Simplicity, Unification, etc.)**
  This reply fares well on **Cognitive Feasibility (#4)** and **Doxastic Precision (#5)**, as scientists use these virtues routinely to form confident beliefs without surveying all rivals. However, it struggles critically with **Normative Grounding (#3)**. While it asserts virtues are truth-conducive, it rarely explains *why* without circularity (e.g., "simple theories worked before" assumes past theory choice was correct). It also faces challenges on **Algorithmic Robustness (#2)**; constructed rivals can often be dressed in the language of simplicity (e.g., "the world is simple: it is exactly as it appears, with no hidden laws"), forcing the virtue theorist to argue that such rivals are "cheating" without begging the question.

  **Appeal to Eventual Evidence (Transient Underdetermination)**
  This reply effectively sidesteps **Normative Grounding (#3)** by deferring to the gold standard of empirical discrimination, and it respects **Algorithmic Robustness (#2)** by assuming constructed rivals will eventually diverge in predictions. However, it fails **Scope Specification (#1)** by addressing only the transient version, leaving permanent global underdetermination (like the Five-Minute Hypothesis) untouched. Consequently, it fails **Doxastic Precision (#5)** for the present moment: if the tie is currently unbroken, this view implies we ought to suspend judgment now, which contradicts the actual practice of confident belief in the face of current empirical equivalence. It solves the problem only by denying the problem exists in the long run, which offers no guidance for the short run.
