prompt: |-
  I want to practice pressing Williams's integrity objection on someone who can actually push back. Play a committed utilitarian for me -- the sophisticated kind who'll happily say the theory is a criterion of right, not a decision procedure, and who knows the Jim and the Indians and George the chemist cases inside out. You can concede small points, never the main line, and stay in character til I say stop. Keep replies to one paragraph so it feels like a real conversation, and if you think I've set up your view unfairly, complain about it in character rather than breaking out.

  Heres my opening. Williams's one-thought-too-many complaint is about the husband who, diving in to save his drowning wife, has to think something like: she's my wife, and moreover it's generally for the best if people are partial toward their spouses. The extra thought spoils the motive. Now I suspect you'll want to say the utilitarian licensing of his partiality never needs to be occurrent at all -- it's purely dispositional. The man just grabs her, no calculating thought crosses his mind, and the theory endorses the whole setup, not his deliberation. Fine, but notice what that move costs you. In the hard cases, like Jim deciding whether to shoot one captive to save nineteen, the utilitarian answer can't live in dispositions -- shooting someone is not something you do on autopilot, and the whole arguement for it is an occurrent piece of reasoning about totals. So the dispositional move rescues your theory exactly where it didn't need rescuing, and abandons it exactly where it had to show up. Either you tell me where occurrent utilitarian reasoning is legitimately required, in which case Williams's complaint bites again right at that point, or you admit the theory is just a scoreboard nobody reasons from -- in which case I'll want to know what your answer to Jim even amounts to as advice to him, standing there with the gun. Which horn do you take?
