answer: |-
  Here is a developed lesson plan designed to generate the specific intuition you need: that **policy selection** can outperform **action selection** when decisions are logically correlated, even before you know "where" you are in the game.

  I recommend a specific modification to your mechanism. While the Ultimatum Game is intuitive, it has a payoff geometry that weakens the lesson (asymmetric policies can still succeed in self-matches). I propose using a **Prisoner's Dilemma with Role Uncertainty**. This preserves your "Proposer/Responder" structure but ensures the math forces the UDT conclusion.

  ### The Game: "The Role-Blind Tournament"

  **Objective:** Maximize your total point score.
  **Participants:** 14 students.
  **Materials:** Index cards or a digital form (Google Form/Slido) for secret submission.

  #### 1. The Setup (5 Minutes)
  Explain that this is a tournament of **policies**, not just actions.
  *   **The Roles:** In every match, one player is assigned **Seat 1** and the other **Seat 2**. (Avoid "Proposer/Responder" to prevent Ultimatum baggage; use neutral labels).
  *   **The Payoff Matrix:** Display this clearly on the board.
      *   If Seat 1 plays **C** and Seat 2 plays **C**: Both get **3 points**.
      *   If Seat 1 plays **D** and Seat 2 plays **D**: Both get **1 point**.
      *   If Seat 1 plays **D** and Seat 2 plays **C**: Seat 1 gets **5**, Seat 2 gets **0**.
      *   If Seat 1 plays **C** and Seat 2 plays **D**: Seat 1 gets **0**, Seat 2 gets **5**.
  *   **The Task:** Each student must submit a **Complete Policy**. This is a pair of instructions:
      *   *"If I am assigned Seat 1, I will play: [ C / D ]"*
      *   *"If I am assigned Seat 2, I will play: [ C / D ]"*
      *   *(Example Policy: "If Seat 1: D, If Seat 2: C")*

  #### 2. The Twist (The "Mirror" Probability)
  Tell them: *"Once you submit your policy, I will pair you up. There are two types of pairings, and you will not know which one you are in until after you submit."*
  *   **Type A (Random Match):** You are paired with another student's policy.
  *   **Type B (Mirror Match):** You are paired with **your own policy**. (i.e., Your policy plays against itself).
  *   **Probability:** Announce that **50% of the pairs will be Mirror Matches**. (With 14 students, you create 7 pairs. Pre-determine 4 Mirror pairs and 3 Random pairs).

  #### 3. Submission and Pairing (10 Minutes)
  *   Collect policies anonymously.
  *   While they wait, you (the instructor) arrange the pairs according to your pre-determined list.
  *   **Crucial Step:** Do not reveal who is in a Mirror match yet.
  *   Assign roles (Seat 1 vs Seat 2) randomly within each pair.

  #### 4. The Reveal and Scoring (15 Minutes)
  *   Project the pairings.
  *   **The Discovery:** Highlight the Mirror Matches. *"In this pair, Policy #3 is playing against Policy #3."*
  *   Calculate scores live.
      *   *Scenario:* A student submitted `(D, C)` (Greedy).
          *   In a **Random Match** against a Cooperator: They likely score 5.
          *   In a **Mirror Match**:
              *   Case 1 (They are Seat 1): They play D. Opponent (Self, Seat 2) plays C. Score: 5.
              *   Case 2 (They are Seat 2): They play C. Opponent (Self, Seat 1) plays D. Score: 0.
              *   **Average Score in Mirror:** 2.5 points.
      *   *Scenario:* A student submitted `(C, C)` (Cooperative).
          *   In a **Mirror Match**:
              *   Case 1 (Seat 1): C vs C. Score: 3.
              *   Case 2 (Seat 2): C vs C. Score: 3.
              *   **Average Score in Mirror:** 3 points.
  *   **Result:** The "Greedy" policy `(D, C)` loses to the "Cooperative" policy `(C, C)` in the Mirror matches, despite looking superior in a standard one-shot game.

  ---

  ### The Debrief: Mapping Game to Theory (20 Minutes)

  Use the board to draw the distinction between the two decision procedures the students just enacted.

  **1. The "Action-Selector" (CDT/Evidential)**
  *   **Reasoning:** "I don't know my role yet. But once I know it, I want to maximize my points *in that role*."
  *   **In-Game Behavior:** If I find out I'm Seat 1, I should Defect (5 > 3). If I'm Seat 2, I should Defect (1 > 0, assuming opponent might defect).
  *   **Policy Submitted:** `(D, D)`.
  *   **Outcome:** In Mirror matches, `(D, D)` yields 1 point. They lose to the `(C, C)` players who got 3.
  *   **Lesson:** Optimizing the action *after* updating on your role fails when your policy is correlated with the opponent's.

  **2. The "Policy-Selector" (UDT)**
  *   **Reasoning:** "I am choosing a function $Policy(Role) \rightarrow Action$. I should choose the function that yields the highest expected utility across all possible roles I might occupy, weighted by the probability of the match type."
  *   **In-Game Behavior:** "If there's a 50% chance I play myself, I need a policy that cooperates with itself. `(C, C)` yields 3 against itself. `(D, D)` yields 1. `(D, C)` yields 2.5. `(C, C)` is the dominant policy for Mirror matches."
  *   **Outcome:** Even if they lose some points in Random matches, the Mirror matches pull the average up for those who coordinated with themselves.
  *   **Lesson:** UDT evaluates the **counterfactual outcome of the policy**, not the causal outcome of the action.

  **3. The "Updateless" Moment**
  *   Point to the moment they wrote the card. *"At that moment, you did not know if you were Seat 1 or Seat 2. That is the 'updateless' state. If you waited to decide until you saw your seat, you became a CDT agent. If you decided based on the whole distribution of possibilities, you acted as a UDT agent."*

  ---

  ### Honest Note 1: What This Game Cannot Reproduce

  You must explicitly warn them against the **"Veil of Ignorance" Fallacy**.

  *   **The Limitation:** In this game, the correlation exists because it is **literally the same person** (Identity). In real UDT problems (like Newcomb's Problem or Parfit's Hitchhiker), the correlation is **logical**, not physical. Alice and Bob are different people, but they run the same source code.
  *   **The Risk:** Students may leave thinking UDT is just Rawlsian justice ("Choose rules as if you might be anyone").
  *   **What to Say:** *"In this game, you played against yourself. In UDT, you play against a stranger who is **algorithmically identical** to you. The correlation isn't 'I am you'; it's 'My reasoning process outputs the same result as yours.' If you think UDT requires not knowing who you are, you will miss its application in transparent Newcomb problems where you know exactly who you are, but you know the Predictor simulates you."*

  ### Honest Note 2: Predictable Failures and Fixes

  **Failure 1: The "Gambler" Problem**
  *   **What happens:** 2-3 students will submit `(D, C)` or `(D, D)` hoping to exploit the Random matches, ignoring the Mirror risk. When they score 0 in a Mirror match, they will claim the game is "unfair" or "rigged."
  *   **The Fix:** Pre-empt this in the debrief. *"The student who Defected didn't lose because of bad luck; they lost because their policy is not **robust**. UDT isn't about winning every round; it's about choosing a policy that doesn't choke when correlated with the environment."*

  **Failure 2: Confusion About Roles in Mirror Matches**
  *   **What happens:** In a Mirror Match of `(D, C)`, students get confused. *"If we are the same policy, why did one Defect and one Cooperate?"*
  *   **The Fix:** Be visually precise. Draw two boxes labeled "Seat 1" and "Seat 2". Show that the *Policy* is the same, but the *Input* (Role) differs.
      *   *Script:* "The policy is the function $f(Role)$. In the Mirror match, both sides run $f$. But Side A gets input 'Seat 1' and Side B gets input 'Seat 2'. That is why they output different actions. UDT respects the input; it just optimizes the function."

  **Failure 3: Collusion**
  *   **What happens:** Students talk before submitting. "Let's all submit (C, C)."
  *   **The Fix:** Enforce strict silence during submission. Collect phones. The lesson requires independent decision-making to demonstrate the pull of the theory. If they collude, they are just forming a coalition, which is game theory 101, not decision theory.

  ### Summary of Logistics
  *   **Rounds:** One single decisive round is best. Multiple rounds allow learning/adaptation which muddies the "ex-ante policy" lesson.
  *   **Points:** Use a tangible reward (e.g., "Top 3 scores get priority on next week's paper selection" or actual candy). Abstract points feel fake.
  *   **Announcement:** Reveal the Mirror/Random split *after* submission to prevent them from calculating a mixed strategy based on exact odds. Tell them only: *"There is a significant chance you will play against your own policy."* (Vagueness increases the pressure to choose a robust policy).
