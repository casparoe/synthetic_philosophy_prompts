      *   Address the "darker thought" (does it matter if I like wetlands?). Yes, because human motivation matters for sustained action.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe I should say "It depends on your ethics."
      *   *Correction:* No, the prompt explicitly forbids "reasonable people disagree." I must take a stance.
      *   *Initial thought:* Argue that insects don't feel pain.
