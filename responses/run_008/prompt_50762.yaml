      *(Self-Correction on the "Parking Lot" argument)*: I need to be careful. A parking lot *locally* reduces life. But the cousin's argument is about *net* suffering. If the wetland is a "suffering factory," removing it removes that suffering. I need to argue that the wetland is *not* necessarily a suffering factory. The core dispute is the *quality of wild life*, not the location.

      *Revised Plan:*
