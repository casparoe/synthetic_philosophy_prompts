      *   Ensure the distinction between *descriptive* (psychology) and *normative* (philosophy) is clear but integrated.
      *   *Self-Correction during drafting:* I initially thought about focusing heavily on the Genetic Fallacy. But the user's "Metaphor" point is more journalistic and vivid. I should validate that but show *why* those metaphors are chosen (underlying epistemology).
      *   *Key Insight to add:* The "Convergence" argument. If morality is like math, we should converge. If it's like taste, we won't. Do we converge? Sometimes (slavery), sometimes not (abortion). This empirical track record is the missing piece.

  9.  **Final Structure:**
