      *   *The "Grain" Issue:* This is crucial. Thin universals (care/harm) vs. Thick local norms (purity/loyalty). The debate often talks past each other here.
      *   *What Progress Looks Like:*
          *   Not a verdict on objectivity (science can't do that).
          *   But a verdict on *confidence*.
          *   Shift from "Is morality objective?" to "Under what conditions are moral beliefs reliable?"
          *   The concept of **Moral Learning**: Do cultures converge over time when exposed to each other? (e.g., human rights expansion).
      *   *Conclusion:* The story isn't about solving the objectivity question. It's about the *humility* required when your moral instruments are culturally calibrated.

