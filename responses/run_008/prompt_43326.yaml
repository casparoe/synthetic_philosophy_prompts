answer: |-
  # JOINT STATEMENT ON BORDER JUSTICE AND STATE AUTHORITY

  ## 1. AGREED CLAIMS

  1.  **The Physical Reality of Enforcement:** Both sides agree that border enforcement ultimately relies on the state's monopoly on legitimate force. Whether described as 'protecting property' or 'restricting liberty', the physical act involves armed agents preventing movement under threat of detention or deportation. Both sides acknowledge this carries a heavy moral burden that requires justification, even if they disagree on whether that justification is currently met.
  2.  **Exclusion vs. Deportation:** Both sides agree there is a morally relevant distinction between excluding someone who has never entered the territory and deporting someone who has established settled ties, family, and community within it. While the open-borders side views both as coercive, they concede deportation requires a higher threshold of justification. The right-to-exclude side views exclusion as an exercise of association rights, but concedes deportation disrupts established rights and requires stronger cause.
  3.  **Empirical Settlement Conditions:** Both sides agree that certain empirical claims should not be used to justify restriction if proven false. Specifically:
      *   If rigorous modelling demonstrates that migration has a negligible long-term impact on native wages and welfare sustainability, economic protectionism ceases to be a valid justification for exclusion.
      *   If data shows migrants do not commit crimes at higher rates than natives, public safety ceases to be a valid justification for blanket exclusion.
      *   Both sides agree that where evidence is genuinely mixed or context-dependent, the debate must remain open, but neither side may rely on debunked economic or criminological stereotypes.

  ## 2. DISAGREEMENTS TABLE

  | Disagreement | Wording the open-borders side accepts | Wording the right-to-exclude side accepts | Substantive or merely verbal? |
  | :--- | :--- | :--- | :--- |
  | **The Nature of Coercion** | "Border guards coercively restrict a basic liberty by threatening force against peaceful movement." | "Border guards enforce the rules of a collective association, preventing unauthorised entry akin to trespass." | **Substantive.** Disagreement rests on whether freedom of movement is a default right or whether association is the default right. |
  | **State Ownership** | "The state holds territory in trust for humanity; citizens are stewards, not absolute owners." | "The state belongs to its citizens, roughly as a club belongs to members or a home to a family." | **Substantive.** Disagreement rests on the moral status of political membership (universal vs. particular). |
  | **The Meaning of 'Belongs'** | "To say a state 'belongs' to citizens implies administrative control, not moral ownership of the land itself." | "To say a state 'belongs' to citizens implies a right to determine the character and composition of the community." | **Merely Verbal.** Both agree citizens have control; the dispute is over whether that control includes exclusionary rights. |
  | **Burden of Proof** | "The burden lies on the excluder to justify why someone is turned away." | "The burden lies on the entrant to justify why they should be admitted." | **Substantive.** Disagreement rests on the default position (open vs. closed). |

  ## 3. CRUXES TABLE

  | Crux | Case both agree bears on it | Open-borders prediction | Right-to-exclude prediction |
  | :--- | :--- | :--- | :--- |
  | **Conditional Admission** | **The Dormitory Nation:** A tiny rich state votes to open borders, but newcomers must settle in half-empty northern provinces for ten years before living elsewhere. | **Illegitimate.** This creates a second-class caste of residents. It is barely better than exclusion because it denies equal liberty of movement within the territory. | **Legitimate.** This is a valid exercise of self-determination and zoning. The community may invite others on specific terms to manage integration and infrastructure. |
  | **Commodification of Membership** | **The Inheritance Auction:** A state admits 200,000 people yearly via sealed-bid auction for permits. Proceeds are divided equally among citizens. No other route exists. | **Unjust.** Worse than open borders (obviously), but also worse than current systems. It monetises a basic right, favouring the wealthy and treating membership as a tradeable good rather than a moral status. | **Legitimate but Risky.** Better than open borders (preserves control). It respects the right to exclude (citizens set the number and benefit). However, it may violate the 'club' analogy if selling memberships corrupts the shared purpose of the association. |
  | **Desperation Indexing** | **The Refugee vs. The Tourist:** Turning away a wealthy tourist with excellent options vs. turning away a stateless refugee with nowhere else to go. | **Indexed Wrongness.** The act is morally distinct. Turning away the refugee is a grave injustice due to the harm caused; turning away the tourist is a minor liberty violation. | **Constant Right.** The right to exclude is binary and constant. The humanitarian duty to assist is separate from the right to exclude. The act of exclusion is equally justified by sovereignty in both cases, even if aid is owed to the refugee. |

  ## 4. JSON SUMMARY

  ```json
  {
    "substantive_disagreements": [
      "Default status of movement (liberty vs. privilege)",
      "Moral ownership of the state (stewardship vs. membership)",
      "Burden of proof for admission",
      "Whether wrongness of exclusion scales with desperation"
    ],
    "verbal_disputes": [
      "Definition of coercion in border contexts",
      "Semantic scope of territorial 'belonging'"
    ],
    "most_promising_test": "The Inheritance Auction. This case forces the right-to-exclude side to confront whether their 'club' analogy permits selling memberships to the highest bidder, which may conflict with their desire for community cohesion. Simultaneously, it forces the open-borders side to clarify if market allocation is preferable to bureaucratic discretion.",
    "would_sign": true
  }
  ```
