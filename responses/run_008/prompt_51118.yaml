  me and my friend Dan (he does debate and reads philosophy stuff at lunch lol) got into this and he sprung an argument on me that beats me but that I also refuse to accept. he says it proves there's an object made out of my left shoe, the moon, and one random electron somewhere in the andromeda galaxy. apparently this is a real debate in philosophy called the special composition question, which is wild to me. here's the argument, I made him number the steps so you can point at the exact bad one:

  (1) whether some things add up to one bigger thing (like atoms adding up to a table) can't depend on what humans think — tables existed before anyone was around to have opinions about them.
  (2) so there has to be some objective fact about when smaller things compose a bigger thing.
  (3) every rule we've ever tried for this has borderline cases. two blocks touching = one object? ok, what if they touch on a single atom. glued together? how glued. arranged "table-wise"? you can make stuff table-ish to any degree you want. every rule fades out gradually instead of having a sharp edge.
  (4) but "does a table exist right now" can't have a fuzzy answer — either the table is there or it isn't, reality doesn't get to be blurry about whether a THING exists.
  (5) the only rule with zero borderline cases is "any things at all compose one object."
  (6) so any things at all, no matter how scattered or random, compose one object. shoe + moon + electron = one thing. also me + my desk + the pacific ocean = one thing, and so on forever.

  Dan's smug about it because apparently some philosophers actually defend this (universalism?) but it seems like it proves way too much — like by his logic there are more objects overlapping my shoe than there are atoms in the observable universe. and when I tried to push back it felt like the arguement proves too much in the OTHER direction too: the same reasoning about vague rules would show there's no fact about whether anyone is bald, which, fine, but wouldn't it also show there's no fact about whether my grandma is still alive in the hospital?? that seems like a place the argument has no business going.

