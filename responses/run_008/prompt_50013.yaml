prompt: |-
  My flatmate Sophie has very settled opinions on space colonisation, and we've been arguing about it for months, so I now have a decent catalogue of her verdicts. Here's her track record: volunteers going on a one-way crewed mission to Mars — totally fine, their choice. Terraforming Mars *if* it turns out there are indigenous microbes — absolutely not, that's a genocide-adjacent crime even if the microbes are just pond-scum level. A generation ship where people are born aboard and never consented, but where life is decent, there's genuine culture and self-governance, and the descendants can disembark and come and go at the destination — fine with it, she says the unborn can't be wronged by being created into a life like that. Using colonies as an involuntary escape valve for Earth's overpopulation — no. And her favourite: seeding sterile, totally dead worlds (lifeless rocks, nothing to kill) with engineered microbes purely for the microbes' own sake, no human benefit at all — she's weirdly enthusiastic about that one, calls it a gift.

  Anyway, next week we're doing a pub debate on this new case and I want to walk in knowing what she'll say. The case: a private foundation wants to send frozen embryos to a habitable exoplanet, to be raised by AI caretakers in a colony whose entire social order was planned in advance by the founders — everyone gets a decent, safe, comfortable life, but a deliberately narrow one, and here's the kicker, the colonists are genetically tweaked to thrive in that environment and be poorly suited to anywhere else, so leaving is basically off the table even once they're adults. The stated rationale is purely as a backup for humanity in case Earth goes. Will she say yes or no?

  What I actually want from you is a bit deeper than the yes/no. As far as I can tell more than one rule could be generating her earlier answers — maybe something about consent or the life-worth-living threshold, maybe a "no victims, no wrong" rule, maybe something about exit options or about the moral status of untouched nature — and they don't all agree on the embryo case. Lay out the candidate rules that fit her track record, say what each one predicts here, give me your best guess at her verdict with your reasoning, and tell me what further case (make one up) I could spring on her that would settle which rule she's actually running. Sorry if this is a lot, its for my own entertainment more than the debate tbh.
