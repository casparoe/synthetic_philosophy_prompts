prompt: |-
  I'm a software engineer with no formal background in philosophy, taking an evening course in philosophy of science, and I need to submit a proposal for a term paper of about 6000 words. My half-formed idea: at work we practice something that looks structurally like falsificationism — we write tests designed to fail before the code exists, and a passing test suite is never treated as confirming that the code is correct, only as having failed to refute it so far. Yet nobody thinks this makes software development a science, and the demarcation debate never seems to mention it. Meanwhile, colleagues who work on machine learning appear to do the opposite: they build shared benchmark suites and make incremental improvements against them, which looks more like accumulating confirmations than exposing models to genuine risk of refutation — and their field is the one people insist on calling a science.

  Please turn this into a term-paper proposal. State the question precisely — something along the lines of: does the analogy between unit testing and Popperian falsification show that falsificationism is too cheap to demarcate science, or does it reveal what additional conditions a practice must meet beyond severe testing to count as scientific? Explain why the standard positions on demarcation leave this open, lay out what I would actually do chapter by chapter, say what would count as the paper failing, and be honest about what could make the topic too big or too thin for a single term. No citations needed; I'll add those myself. Please write the proposal in American English.
