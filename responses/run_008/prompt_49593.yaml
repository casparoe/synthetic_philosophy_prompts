      *   *Pluralist (Ereshefsky, Dupré, etc.):* Key idea: The "species category" is a homeostatic property cluster that varies too much across the tree of life. One concept distorts biology. Realism = If concepts track real causal processes, and processes vary, then multiple ontologies are valid.

