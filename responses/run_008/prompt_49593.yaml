  **JOINT STATEMENT ON THE ONTOLOGY AND UTILITY OF THE SPECIES CATEGORY**
  **Signatories:** [Monist] & [Pluralist]
  **Date:** October 26, 2023

  ### 1. Points of Convergence
  *We agree on the following claims regarding the theoretical status of species, the validity of specific objections, and the minimal requirements for realism.*

  1.  **Anti-Essentialism:** We reject the notion that species are defined by intrinsic, immutable essences or necessary-and-sufficient morphological traits. Variation within a species is expected and does not invalidate its status.
  2.  **Theoretical Utility:** The primary function of a species concept is to individuate units that play a causal role in evolutionary theory (e.g., as units of selection, drift, or biodiversity accounting). Operational criteria (e.g., DNA barcoding thresholds) are heuristic tools for identification, not theoretical definitions.
  3.  **The "Easy Cases":** In the majority of sympatric, sexually reproducing vertebrate cases, concepts based on reproductive isolation (BSC), phylogenetic distinctness (PSC), and ecological niche (ESC) converge on the same boundaries. Our disagreement concerns the interpretation of the *divergence* cases, not the convergence cases.
  4.  **Mind-Independent Discontinuities:** We agree that the distribution of life is not a continuous, homogeneous smear. There are objective, mind-independent causal discontinuities in nature (gaps in morphospace, breaks in gene flow, ecological clustering). We disagree on whether these discontinuities constitute a single type of entity ("The Species") or multiple types of entities.
  5.  **Status of Properties:** We agree that properties like reproductive isolation, monophyly, and diagnosability are contingent *consequences* of lineage separation, not the definition of separation itself. However, we disagree on whether one underlying process (lineage separation) is sufficient to ground a single concept.

  ### 2. Residual Disagreements
  *The following statements represent our irreconcilable differences. Each party affirms their own statement and acknowledges the other's as a coherent, dissenting position.*

  **[Monist] Statement:**
  "Pluralism conflates the *evidence* for lineage separation with the *process* of lineage separation. While cohesion mechanisms vary (recombination in animals, ecological selection in bacteria), the underlying ontological unit—the independently evolving metapopulation lineage—is singular. Disciplinary differences (e.g., paleontology vs. neontology) reflect epistemic limitations in detecting lineages, not ontological differences in the lineages themselves. To posit multiple species ontologies is to mistake the shadow on the wall for the object casting it."

  **[Pluralist] Statement:**
  "Monism imposes a Procrustean bed on biological diversity. Evolutionary processes are heterogeneous; gene flow, ecological sorting, and phylogenetic branching do not always covary. When they come apart, there is no 'true' answer, only answers relative to the biological process under investigation. Pluralism is not merely pragmatic bookkeeping; it is an ontological claim that 'species' refers to a homeostatic property cluster that admits of multiple, equally real instantiations. Forcing a single concept obscures the distinct causal structures operative in, for example, a bacterial biofilm versus a mammal population."

  ### 3. The Cruxes
  *We identify three specific theoretical bottlenecks where our views diverge. For each, we specify the core disagreement, a concrete case study, and our divergent predictions.*

  #### Crux A: Disciplinary Pluralism vs. Ontological Pluralism
  **The Issue:** Does the fact that paleontologists, microbiologists, and ornithologists use different criteria imply there are different *kinds* of things (Ontological Pluralism), or merely that they are looking at the same kind of thing (Lineages) through different keyholes (Disciplinary Pluralism)?

  *   **[Monist] View:** Disciplinary pluralism is epistemic. Paleontologists use morphology because they lack DNA; microbiologists use ecology because they lack sex. They are all hunting lineages.
  *   **[Pluralist] View:** Disciplinary pluralism is ontological. Fossils are units of anagenetic change; mammals are units of reproductive community. These are different causal individuals.

  **Case Study: The *Anagenetic Chronospecies* (e.g., *Trilobites* in a stratigraphic sequence)**
  *   **Scenario:** A sedimentary sequence shows a gradual morphological shift over 2 million years with no branching. Arbitrary lines are drawn to name Species A, B, and C for biostratigraphy.
  *   **[Monist] Prediction:** Biologists should acknowledge this as a *single* lineage arbitrarily segmented for utility. There is one species here (the lineage), and the segmentation is a convenience, not a reflection of speciation events.
  *   **[Pluralist] Prediction:** Biologists should accept Species A, B, and C as real species *relative to the process of biostratigraphic correlation*. For the purpose of dating rock layers, these are real units of selection and sorting. To say they are "really" one lineage ignores the causal reality of the temporal slices used in geological explanation.

  #### Crux B: The Status of the "Speciation Continuum"
  **The Issue:** Is ambiguity in species boundaries a failure of our concepts (epistemic vagueness) or a feature of the world (ontic vagueness)?

  *   **[Monist] View:** Ambiguity is epistemic. Lineages are either separate or they are not. If we can't tell, it's because the properties (RI, ecology) haven't fully diverged yet.
  *   **[Pluralist] View:** Ambiguity is often ontic. Different processes decouple at different rates. A population can be ecologically distinct but genetically porous.

  **Case Study: *Ensatina eschscholtzii* (Ring Species Complex)**
  *   **Scenario:** Populations form a ring around a barrier. Adjacent populations interbreed; terminal populations in contact do not.
  *   **[Monist] Prediction:** This is one lineage in the process of splitting. The "species" status is indeterminate because the separation process is incomplete. We should classify it as one polymorphic species or acknowledge the boundary is currently unknowable, but not that it is simultaneously one and two species.
  *   **[Pluralist] Prediction:** It is simultaneously one species (by gene flow connectivity around the ring) and two species (by reproductive isolation at the terminus and ecological distinctness). Both descriptions are true relative to different causal processes. Denying one obscures the evolutionary dynamic.

  #### Crux C: Horizontal Gene Transfer (HGT) and the "Tree" Metaphor
  **The Issue:** Can the "lineage" concept survive in prokaryotes where vertical descent is compromised by rampant HGT?

  *   **[Monist] View:** Yes. Lineages are maintained by ecological cohesion. Even with HGT, distinct ecological clusters (ecotypes) exist that evolve independently.
  *   **[Pluralist] View:** No. If genetic cohesion is absent, the "lineage" is a fiction. We need a concept based on stable gene pools or ecological function, not ancestry.

  **Case Study: *Prochlorococcus* Ecotypes**
  *   **Scenario:** Marine cyanobacteria with high rates of gene exchange across traditional boundaries, yet distinct high-light and low-light adapted clusters.
  *   **[Monist] Prediction:** These clusters are species because they are separate evolutionary lineages maintained by periodic selection (ecological cohesion). The HGT is noise; the ecological divergence is the signal of lineage separation.
  *   **[Pluralist] Prediction:** Calling them "lineages" misrepresents the reticulate genetics. They are species only if we define species by ecological function. If we define them by genealogy, they do not exist. Therefore, the "species" category here refers to something different than it does in mammals.

  ### 4. Flagged Verbal Disputes
  *We acknowledge that some portion of our debate stems from divergent definitions of key terms. We agree to the following disambiguations:*

  1.  **"Real" / "Objective":**
      *   **[Monist] Usage:** "Real" means *mind-independent causal continuity*. If the continuity exists, the species is real, even if we cannot bound it precisely.
      *   **[Pluralist] Usage:** "Real" means *causally efficacious within a specific explanatory framework*. A group can be real for ecology but not for phylogenetics.
      *   **Resolution:** We agree that when [Monist] says "Species are real," she means "Lineages exist." When [Pluralist] says "Species are real," he means "Specific groupings do explanatory work." We are talking past each other when debating whether a ring species is "really" one species.

  2.  **"Lineage":**
      *   **[Monist] Usage:** An ancestral-descendant sequence of populations, regardless of the mechanism of cohesion (sex or ecology).
      *   **[Pluralist] Usage:** Implies a predominantly vertical transmission of genetic material. In high-HGT contexts, this term is misleading.
      *   **Resolution:** In prokaryotic contexts, [Monist] agrees to use "Ecological Lineage" to distinguish from "Genealogical Lineage." [Pluralist] agrees that "Ecological Lineage" can ground a species concept, provided it is not privileged over other concepts.

  3.  **"Concept" vs. "Criterion":**
      *   **Dispute:** [Monist] often accuses [Pluralist] of confusing operational criteria (how we find them) with concepts (what they are). [Pluralist] argues that in practice, the criterion *constitutes* the concept for working scientists.
      *   **Resolution:** We agree that a distinction exists, but disagree on its importance. [Monist] views the distinction as vital for ontology; [Pluralist] views it as a philosophical luxury that ignores scientific practice.

  ***

  **Signed,**

  ____________________ (The Monist)
  *"There is one truth, even if it is hard to see."*

  ____________________ (The Pluralist)
  *"There are many truths, depending on the question asked."*
