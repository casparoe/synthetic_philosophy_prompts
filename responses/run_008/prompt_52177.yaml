  8.  **Final Polish:** Check word counts and specific constraints (numbered list in Sec 1, Table in Sec 2, etc.).

      *Section 1 Word Count Check:* Needs to be substantial. I need to expand on the biological mechanisms.
      *Section 4 Word Count Check:* Needs to be concise.

      *Disagreement Wording:*
