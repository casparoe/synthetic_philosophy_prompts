      *   Camp B: Code = Metaphor for chemistry. If stereochemistry exists, it confirms it's just chemistry. This helps Camp B.
      *   *Wait, let's look closer.* Camp A says "It is a code *because* it is arbitrary/conventional." Camp B says "It is *not* a code because it lacks intent."
      *   If stereochemistry is found: The mapping is *not* arbitrary. Camp A loses a key pillar (arbitrariness). Camp B gains a pillar (it's direct chemical interaction).
