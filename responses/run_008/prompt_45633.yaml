answer: |-
  You have correctly identified that the literature often presents these interpretations as tribal affiliations rather than competing solutions to a constraint-satisfaction problem. As a mathematician, you should view this as an attempt to map the Kolmogorov axioms onto ontology and epistemology simultaneously. No map is perfect; the value lies in knowing where the projection distorts.

  Here are the desiderata for an adequate interpretation of probability, categorized by the domain they constrain.

  ### The Desiderata

  **1. Single-Case Admissibility**
  *   **Requirement:** The interpretation must assign a well-defined probability value to a unique, non-repeatable event (e.g., *this* patient's recovery, *this* specific decay of *this* atom).
  *   **Reasoning:** Scientific and practical reasoning is predominantly about singular events. If an interpretation requires an infinite collective to define the probability of a single occurrence, it cannot guide action in the limit of $n=1$.
  *   **Status:** **Non-negotiable** for a general theory of scientific inference.

  **2. Empirical Anchoring (The Frequency Link)**
  *   **Requirement:** The interpretation must explain why, in the actual world, relative frequencies tend to stabilize around probability values without circularity.
  *   **Reasoning:** Probability is useless for science if it doesn't predict observable regularities. The worry you noted is the *Law of Large Numbers* problem: if frequentists define probability *as* limiting frequency, the claim that "frequencies converge to probability" becomes a tautology or requires a probabilistic assumption to prove (the circularity). An adequate interpretation must ground the stability of frequencies metaphysically or epistemically without begging the question.
  *   **Status:** **Non-negotiable** for empirical adequacy.

  **3. Reference Class Determinacy**
  *   **Requirement:** The interpretation must provide a principled method for selecting the relevant population or conditions that determine the probability value for a specific individual.
  *   **Reasoning:** As you noted, a 40-year-old smoker belongs to infinite reference classes (smokers, 40-year-olds, smokers with anxiety, etc.). If the probability value changes with every class description, "the probability" is indeterminate. The interpretation must solve the *problem of the single case* within the *problem of the reference class*.
  *   **Status:** **Non-negotiable** for objectivity.

  **4. Normative Deference (The Principal Principle)**
  *   **Requirement:** If the interpretation posits objective chance, it must explain why a rational agent's credence should align with that chance when known (Lewis's Principal Principle).
  *   **Reasoning:** You flagged that this shouldn't be a stipulation. If "chance" is a feature of the world and "credence" is a feature of the mind, the interpretation must provide the bridge principle that makes ignoring the chance irrational. If it cannot do this, chance is epistemically inert.
  *   **Status:** **Non-negotiable** for rational decision theory.

  **5. Causal Neutrality (Invertibility)**
  *   **Requirement:** The interpretation must allow for the calculation of inverse probabilities (e.g., $P(\text{Cause}|\text{Effect})$) even if the underlying metaphysics is time-asymmetric.
  *   **Reasoning:** You asked if the propensity complaint is pedantry. It is not. The probability calculus is time-symmetric ($P(A|B)$ is defined regardless of temporal order). If an interpretation defines probability as a causal disposition (time-asymmetric), it struggles to make sense of diagnostic inference (inferring past causes from present effects) without importing extra-logical assumptions.
  *   **Status:** **Non-negotiable** for statistical inference.

  **6. Countable Additivity**
  *   **Requirement:** The interpretation must justify whether probability measures must be countably additive (Kolmogorov) or merely finitely additive (de Finetti).
  *   **Reasoning:** Dutch Book arguments guarantee coherence with only finite additivity. Countable additivity is required for standard convergence theorems but implies logical omniscience constraints that may be philosophically untenable for subjective agents. The interpretation must decide if this is a mathematical convenience or a rational requirement.
  *   **Status:** **Preference/Technical** (Depends on whether you prioritize measure-theoretic tidiness or subjective coherence).

  ---

  ### The Incompatibility Matrix (The "No-Go" Theorems)

  You asked for the subset of requirements that cannot be jointly satisfied. This is the most critical part of your inquiry.

  1.  **Single-Case Admissibility vs. Empirical Anchoring:** This is the classic fracture. To get **Empirical Anchoring** without circularity, you usually need long-run frequencies. To get **Single-Case Admissibility**, you need something inherent to the specific trial (like a propensity or a degree of belief). You generally cannot have a theory that is *defined* by long-run frequencies but applies *ontologically* to single cases without residue.
  2.  **Reference Class Determinacy vs. Single-Case Admissibility:** To solve the **Reference Class** problem objectively, you need maximal specificity about the world. But if you specify the world completely (the "single case" in full detail), the probability collapses to 0 or 1 (determinism). An interpretation must walk the line between "too vague" (indeterminate) and "too specific" (trivial).
  3.  **Normative Deference vs. Humean Supervenience:** (Lewis's "Big Bad Bug"). If chances are just summaries of patterns in actual events (Humean), then knowing the chance gives you information about the future pattern. But the future pattern determines the chance. This creates a tension where rational credence cannot defer to chance without undermining the definition of chance.

  ---

  ### The Scores

  **Frequentism (Limiting/Finite):**
  Fails Single-Case Admissibility and Reference Class Determinacy dead, but offers the strongest non-circular Empirical Anchoring for repeatable experiments.

  **Subjectivism (Bayesian/Personalist):**
  Solves Single-Case and Coherence (Finite Additivity) perfectly, but fails to provide an ontology of Objective Chance that satisfies Normative Deference without reducing chance to idealized belief.

  **Propensity (Popper/Single-case):**
  Secures Single-Case Admissibility and Objectivity, but struggles fatally with Empirical Anchoring (measuring the disposition) and Causal Neutrality (inverse probabilities).

  ---

  ### The Verdict

  **The Killer Requirement:**
  You suspected **Single-Case Admissibility**, and you are largely right, but the specific damage is done by the conjunction of **Single-Case Admissibility + Empirical Anchoring**.

  If you drop Single-Case, Frequentism works fine for casino physics. If you drop Empirical Anchoring, Subjectivism works fine for gambling strategy. But for *science* (which demands objective chances for singular events like the Big Bang or a specific patient's diagnosis that must align with observed data), this conjunction is the "Big Bad Bug."

  **Recommendation:**
  Do not look for a single interpretation that satisfies all desiderata. It does not exist. Instead, adopt a **pluralist** stance: use Subjective probability for epistemic states (credence/inference) and Propensity (or Best-System) chance for ontic states (physical laws), and treat the Principal Principle as the bridge rule between them, acknowledging that the bridge is philosophically shaky but pragmatically indispensable. Regarding additivity: stick to Finite Additivity for philosophical coherence, use Countable Additivity when you need the calculus to work, and don't lose sleep over the gap.
