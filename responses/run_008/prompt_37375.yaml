      *   Supererogatory = Giving a gift. (Optional, failure is not wrong, but the relationship is different).
      *   Why better: It removes the "scoring" aspect. It focuses on *transaction vs. grace*. It explains why declining isn't "wrong" but also isn't "neutral" in terms of character.

