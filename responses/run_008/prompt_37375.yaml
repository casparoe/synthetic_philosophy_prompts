      *   *Actually, let's go with something structural:* **The "Floor and Ceiling" vs. "Horizon" Analogy.** Duties are the floor. Supererogation isn't a ceiling (extra credit); it's a horizon you walk toward. This captures the open-ended nature of moral growth.
      *   *Wait, a more concrete one:* **The "Tipping" Analogy.** (Common in ethics). Service is the duty (meal served). Tip is supererogatory.
