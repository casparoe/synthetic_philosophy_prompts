      *   *Section 2: Load-Bearing Disanalogies.* Focus on the "Grader" (external vs internal/relational), the "Stakes" (points vs. suffering), and the "Neutrality" (skipping vs. declining).
      *   *Section 3: The Friend's Conclusion.* Does it survive? No, because the analogy defines morality as a minimum standard rather than a responsive practice. The "cost" isn't a penalty, but it's not nothing.
      *   *Section 4: Better Analogy.* The "Gift" Analogy. Duties = Debts. Supererogation = Gifts.
      *   *Section 5: Changing the Verdict.* If the definition of "wrong" is strictly "violating a binding obligation," the friend is right. My weakness might be demanding too much of morality (consequentialism creeping in).

  9.  **Refining the "Load-Bearing" Analysis:**
