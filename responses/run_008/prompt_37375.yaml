      *   *Why:* You aren't "wrong" for not giving a gift, but the relationship lacks the warmth of generosity. It distinguishes *owing* from *giving*.
      *   *Refinement:* Let's use the **"Safety Net vs. Ladder"** analogy. Duties keep you from falling (safety net). Supererogation helps you climb (ladder). Skipping the ladder doesn't make you fall, but you don't rise. This captures the *gain* without implying the *loss* is neutral to the observer.
      *   *Actually, the prompt asks for what gets right what the exam gets wrong.* The Exam gets the *structure of obligation* right (binary), but wrong on *relational impact*.
      *   *Proposed Analogy:* **The "Host and Guest" Analogy.**
          *   Duty: Don't harm the guest, provide basic shelter.
          *   Supererogatory: Give up your own bed, feast.
          *   Declining: You sleep on the floor, they sleep on the couch. Not "wrong," but the *hospitality* is lesser. It captures the *sacrifice* element better than "points."

  7.  **Steelman the Friend/Analogy (What would change my verdict?):**
      *   If morality is strictly deontological (Kantian), then anything beyond duty is genuinely indifferent regarding *obligation*.
      *   If the "cost" to the agent is extreme (kidney donation), demanding it turns duty into slavery.
      *   Argument: If we punish non-supererogation, we destroy the concept of supererogation. To preserve the category, we *must* treat declining as permissible.
      *   Weakness in my reasoning: I might be conflating "moral worth" with "obligation." The friend is talking about *wrongdoing* (blame), not *goodness* (praise). If the claim is strictly "no blame," the exam analogy might actually hold up well enough for that narrow claim.

  8.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the sophistication of the query.
