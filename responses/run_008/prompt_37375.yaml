      *   *Extra Credit:* Supererogatory Acts (e.g., self-sacrifice, major charity).
      *   *Passing Grade:* Moral Permissibility / Being a "good enough" person.
      *   *Grader:* God, Society, Conscience, or the Universe (Moral Accounting).
      *   *Total Points:* Moral Worth / Virtue Status.
      *   *Skipping Extra Credit:* No penalty, just no bonus.

  3.  **Identify Disanalogies:**
      *   *Literal vs. Metaphorical:* No literal grader, no discrete questions. (User already noted this).
      *   *Stakes:* Exam stakes are usually personal (grade); Moral stakes often involve others' welfare.
      *   *Relationship:* Exams are transactional/institutional; Morality is often relational.
      *   *Scarcity:* Extra credit is usually limited/structured; Moral opportunities are open-ended.
      *   *The "Cost":* Skipping extra credit costs *time/effort* but no *points*. Declining a kidney saves *health/risk* but might cost *moral character* or *relationship to the needy*.
      *   *The "Ceiling":* Exams have a max score (100% + extra). Morality might not have a cap on goodness.
      *   *The "Penalty":* In exams, skipping extra credit is neutral. In morality, is declining *always* neutral? (This is the crux).

  4.  **Analyze Load-Bearing Disanalogies (The Core Issue):**
      *   *The Friend's Claim:* Declining is morally neutral (no wrong done).
      *   *Why the Analogy Supports This:* Extra credit is defined by *lack of penalty*. If the map holds, supererogation implies *lack of moral penalty*.
      *   *Where it Breaks:*
          1.  **The Nature of the "Other":** In an exam, the "other" (teacher) isn't harmed by you skipping extra credit. In kidney donation, a specific person remains sick/dying. The *consequence* of inaction differs.
          2.  **Moral Residue:** Skipping extra credit leaves no regret. Declining a plea for help often leaves "moral residue" (guilt, regret, tarnished character) even if not "wrong." The analogy erases the emotional/character cost of saying no.
          3.  **The Definition of "Obligation":** The exam analogy assumes a binary: Required vs. Optional. It hides the spectrum of *expectation*. Some supererogatory acts are "expected" of certain roles (soldiers, parents) even if not strictly "duties" in a Kantian sense.
          4.  **Agency and Motivation:** Extra credit is usually done for *points* (self-interest). Supererogation is done for *others* (altruism). The motivation structure is inverted.

  5.  **Evaluate the Friend's Conclusion:**
      *   Does declining cost nothing morally?
      *   *Standard View:* It costs no *blame*, but it might cost *praise* or *moral stature*.
      *   *The Analogy's Trap:* It suggests moral life is about *clearing a bar* (permissibility) rather than *responding to need*.
      *   *Verdict:* The analogy smuggles in a "minimumist" ethics. It makes morality look like a contract rather than a response. The friend's conclusion holds *only if* you accept that morality is merely about avoiding wrongs, not about maximizing good or cultivating virtue. The analogy *carries* the conclusion by defining the terrain.

