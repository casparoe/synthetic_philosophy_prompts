prompt: |-
  I referee a lot of manuscripts for a mid-sized interdisciplinary journal, and the stuff I get is heavily "evolutionary explanation for human behavior" flavored -- why we like music, why morning sickness exists, why people get depressed, why men prefer certain waist-to-hip ratios. My problem: I'm sympathetic to evolutionary thinking but I've also read enough Gould and Lewontin to be suspicious of just-so stories, and I never know where to draw the line in a review without either rubber-stamping a panglossian fairytale or being that referee who just says "not an adaptation, byproduct" to everything without argument.

  So what I want is a decision procedure, built out of the actual substance of the adaptationism debate (spandrels/byproducts, exaptation, drift and constraints, the whole Gould-Lewontin vs Dawkins/Dennett slugfest, plus the more sober versions of the argument from design), that I can run in about half an hour per paper with no data analysis and no ability to demand new experiments. It should be an ordered list of questions with, for each one, what counts as a pass, what counts as a fail, and what just gets flagged in the review as unresolved. It needs to actually terminate in one of a few verdicts -- reject the adaptationist claim, accept it provisionally, or "the paper is fine as long as it's reframed as a hypothesis, not a finding" -- since those are the three moves available to me in a referee report. And I want the procedure to be honest about which steps are my judgment dressed up as a checkbox, because I know myself well enough to know I'll rationalize.

  Some specific things it has to handle, since they come up constantly:

  1. How much weight to give "the trait is complex and well-engineered for X, and you don't get that kind of fit by accident" when the paper never demonstrates the fit, just asserts it.
  2. Whether cross-cultural universality helps an adaptationist claim, given that plenty of byproducts are universal too.
  3. The case where a trait plausibly started as a byproduct but the paper claims it was later shaped by selection for its current use (exaptation). When is that a real explanation and when is it a free pass?
  4. The "depression is adaptive because it signals yielding in social conflict" style paper, where the proposed function explains why the trait isn't lethal but can't obviously explain why it has the specific form it has.

  Then run it on three manuscripts I'm making up but which are representative:

  - Morning sickness as an adaptation for avoiding teratogens in the first trimester (this one has actual comparative and timing evidence behind it, for whatever my memory of the literature is worth)
  - Our love of landscape paintings featuring water and open trees as an adaptation for savanna habitat selection
  - Sad music enjoyment as an adaptation for social bonding, in a paper whose only evidence is that people report feeling more connected after listening together

  Also: one of these I actually want to accept (the music one, it's charming and I'd love it to be true), so you'll have to show me what the procedure says even when it embarrasses me. And include at least one failure mode where the procedure itself misfires -- e.g. a true adaptation it would wrongly kill -- so I know when to overrule my own checklist. Keep it usable by a tired person on a Sunday night, not a philosophy seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** A referee for a mid-sized interdisciplinary journal.
      *   **Problem:** Overwhelmed by "evolutionary psychology/behavior" manuscripts that risk being "just-so stories" (Gould & Lewontin's critique). Needs a balanced way to evaluate adaptationist claims without demanding new data or becoming a reflexive skeptic.
      *   **Goal:** A decision procedure (checklist/questions) usable in ~30 mins, no new data analysis, leading to specific verdicts (Reject Claim, Accept Provisionally, Reframe as Hypothesis).
      *   **Requirements:**
          *   Built on substance of adaptationism debate (spandrels, exaptation, drift, constraints).
          *   Honest about subjective judgment calls.
          *   Handle specific edge cases (complexity assertions, universality, exaptation vs. byproduct, signaling theories like depression).
          *   Test on three specific made-up manuscripts (Morning Sickness, Savanna Landscapes, Sad Music).
          *   Must reveal bias (User wants to accept the Music one, procedure must test it rigorously).
          *   Include a failure mode (where the procedure might reject a true adaptation).
          *   Tone: Usable by a tired referee, not a philosophy seminar.

  2.  **Deconstruct the Adaptationism Debate for a Checklist:**
      *   *Gould & Lewontin (1979):* Critique of pan-selectionism. Emphasis on constraints, byproducts (spandrels), and lack of comparative evidence.
      *   *Dawkins/Dennett:* Emphasis on "design" and complexity as evidence of selection.
      *   *Williams (1966):* Adaptation is a special and onerous concept. Need evidence of *design* for a *function*.
      *   *Modern Synthesis/Evo Devo:* Constraints, plasticity, niche construction.
      *   *Key Criteria for Adaptation:*
          1.  Variation exists?
          2.  Heritability? (Hard to prove in human behavior without genetics, so proxy needed).
          3.  Differential fitness? (Hard to measure directly, so proxy needed).
          4.  *Crucial:* Evidence of *design* (complexity/specificity) relative to the proposed function, not just consistency with it.
          5.  Ruling out alternatives (byproduct, drift, constraint).

  3.  **Drafting the Decision Procedure (The "30-Minute Adaptation Audit"):**
      *   Need to structure it logically. Start with the claim, move to evidence, then alternatives, then conclusion.
      *   *Step 1: The Function Claim.* Is it clear?
      *   *Step 2: The Design Evidence.* Is there specificity/complexity? (Addresses User Point 1).
      *   *Step 3: The Comparative/Universality Check.* (Addresses User Point 2).
      *   *Step 4: The Byproduct/Constraint Screen.* (Addresses User Point 3 & Gould/Lewontin).
      *   *Step 5: The Cost/Benefit Plausibility.* (Addresses User Point 4 - Depression style).
      *   *Verdict Mapping:* Connect scores to the three allowed moves.
      *   *Bias Check:* Explicitly ask the referee to note their desire for the claim to be true.

  4.  **Refining the Questions (Pass/Fail/Flag):**
      *   *Q1 (Specificity):* Pass = Trait has features *only* useful for X. Fail = Trait is generic. Flag = Plausible but could be side effect.
      *   *Q2 (Universality):* Pass = Universal *and* varies predictably with environment. Fail = Universal but invariant. (Universality alone is weak).
      *   *Q3 (Alternatives):* Pass = Authors explicitly model/test byproducts. Fail = "It exists, therefore it was selected."
      *   *Q4 (Cost):* Pass = High cost explained by high benefit. Fail = Cost ignored.
      *   *Bias Check:* "Do I want this to be true because it's poetic?"

  5.  **Testing on the Three Manuscripts:**

      *   *Manuscript 1: Morning Sickness (Profet's Hypothesis).*
          *   Context: Actually has literature support (timing matches organogenesis, aversion to toxins).
          *   Procedure outcome: Should likely pass or "Reframe as strong hypothesis."
          *   *Correction:* The prompt says "one of these I actually want to accept (the music one)." I need to make sure the procedure doesn't just rubber stamp the Morning Sickness one if the evidence in the *specific manuscript* is weak, but acknowledge the external literature. Let's assume the MS has the standard evidence.
          *   *Verdict:* Accept Provisionally (or Reframe if MS is overconfident).

      *   *Manuscript 2: Savanna Landscapes.*
          *   Context: Classic Evo Psych. Often criticized as weak.
          *   Procedure outcome: Likely fails on specificity (art preference is culturally malleable) and alternatives (exposure effect).
          *   *Verdict:* Reframe as Hypothesis or Reject Claim.

      *   *Manuscript 3: Sad Music (The User's Favorite).*
          *   Context: User wants to accept. Evidence is self-report ("feel connected").
          *   Procedure outcome: This is the trap. Self-report is weak evidence of *adaptation*. It proves current function/utility, not evolutionary history.
          *   *Constraint:* I must be honest. The procedure *should* flag this as weak evidence for *adaptation*, even if the phenomenon is real.
          *   *Verdict:* "Reframe as Hypothesis." This honors the user's request to be embarrassed by the procedure.

  6.  **Addressing the Specific Edge Cases in the Procedure:**
      *   *Complexity without fit:* Addressed in Q1 (Design).
      *   *Universality:* Addressed in Q2 (Variation).
      *   *Exaptation:* Addressed in Q3 (History).
      *   *Signaling (Depression):* Addressed in Q4 (Cost/Handicap).

  7.  **The Failure Mode:**
      *   Need a case where the checklist kills a true adaptation.
      *   *Idea:* Traits where the mechanism is hidden or the fitness benefit is distal/delayed (e.g., menopause, or specific immune responses). Or traits where the "design" looks simple but is highly optimized (e.g., simple heuristics).
      *   *Selection:* A trait where the "byproduct" explanation is *too* compelling logically, but selection actually did occur. Example: The "Cognitive Niche" - maybe intelligence looks like a general byproduct of brain size, but was selected. Or better: *Play behavior.* Often dismissed as byproduct of excess energy, but is adaptive. Let's use **Juvenile Play**. It looks like a byproduct of energy, but the checklist might flag it as "no immediate fitness benefit."

  8.  **Final Review against Constraints:**
      *   30 mins? Yes, 5 questions.
      *   No new data? Yes, relies on MS content.
      *   Verdicts clear? Yes.
      *   Tone? Professional but candid.
      *   Bias check included? Yes.

  9.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Make sure the "Bias Check" is prominent.*
      *   *Ensure the "Sad Music" evaluation is rigorous.* The user said "I want to accept... show me what the procedure says even when it embarrasses me." I need to make sure the procedure *doesn't* let it slide just because the user likes it.
      *   *Morning Sickness:* Be careful not to conflate the *actual science* with the *manuscript quality*. I will assume the manuscript cites the standard evidence (timing, toxins).
      *   *Structure:* Introduction -> The Procedure -> The Test Cases -> The Failure Mode -> How to write the report.

  10. **Final Polish:** Check the Gould/Lewontin vs. Dawkins balance. Ensure "Spandrel" isn't used as a synonym for "false," but as "architectural consequence." Ensure "Exaptation" requires evidence of *co-option*, not just a story.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is a decision procedure designed for your specific constraints: 30 minutes, no new data, interdisciplinary context, and a need to navigate the Gould-Lewontin vs. Adaptationist tension without becoming a caricature of either.

  It is called **The SPANDREL Audit** (Specificity, Plausibility, Alternatives, Necessity, Design, Reframe, Evidence, Logic). It is designed to force you to articulate *why* you are skeptical or convinced, separating your intuition from the text's actual warrant.

  ---

  ### The 30-Minute SPANDREL Audit

  **Instructions:** Read the abstract, intro, and discussion. Skim methods/results for the specific claims. Answer the 5 questions below. Do not move to the next question until you have checked a box.

  #### 1. The Design Specificity Check (The "Engineered Fit" Test)
  *Does the trait possess complex features that are specifically calibrated to the proposed problem, which would be unlikely to arise by chance or general constraint?*
  *   **PASS:** The paper identifies specific mechanisms or timing that match the problem *only* (e.g., nausea peaks exactly when fetal organogenesis is vulnerable to toxins).
  *   **FAIL:** The trait is generic or the "fit" is vague (e.g., "we like trees because trees are good").
  *   **FLAG:** The fit is plausible but could also be a side-effect of a different mechanism (e.g., we like trees because they are easy to process visually, not because of savanna selection).
  *   **Bias Check:** *Am I counting "complexity" that is actually just detailed description?*

  #### 2. The Variation & Universality Check (The "Gould" Test)
  *If the trait is universal, does the paper explain why selection didn't prune it in environments where it's maladaptive? If it varies, does it track the ecological variable?*
  *   **PASS:** Universality is accompanied by predictable plasticity (e.g., trait turns on/off based on environmental cue) OR the cost of the trait is low enough that drift/constraint explains universality, but selection explains the *form*.
  *   **FAIL:** "It is universal, therefore it is adapted." (Universality is consistent with byproducts).
  *   **FLAG:** Universality is claimed but cross-cultural data is weak or WEIRD-only.

  #### 3. The Alternative History Check (The "Exaptation" Test)
  *Does the paper distinguish between "selected for X" vs. "selected for Y, now used for X" vs. "byproduct of Z"?*
  *   **PASS:** Authors explicitly model or argue against the leading byproduct hypothesis (e.g., "Music is not just auditory cheesecake because...").
  *   **FAIL:** The paper treats the current utility as proof of original selection (The "Vulture Fallacy": Vultures clean carcasses, therefore they were selected for sanitation).
  *   **FLAG:** Exaptation is claimed, but there is no evidence for the *co-option* event (i.e., no account of how the trait shifted function).

  #### 4. The Cost/Benefit Plausibility Check (The "Depression" Test)
  *If the trait is costly (energy, risk, fitness), does the proposed benefit outweigh it in a way that explains the **specific form** of the cost?*
  *   **PASS:** The cost acts as a hard-to-fake signal (Handicap Principle) or the benefit is direct reproductive success.
  *   **FAIL:** The benefit explains why the trait isn't *lethal*, but not why it has its specific symptoms (e.g., "Depression signals yield" doesn't explain anhedonia or suicide risk).
  *   **FLAG:** Benefit is social/psychological, but fitness link is assumed rather than argued.

  #### 5. The "I Want This to Be True" Check (The Reflexivity Test)
  *Be honest: Is the narrative aesthetically or ideologically pleasing?*
  *   **PASS:** The claim is boring or uncomfortable, but the evidence is solid.
  *   **FAIL:** The claim is poetic/charming (e.g., "music bonds us"), and the evidence is self-report or correlational.
  *   **FLAG:** You find yourself forgiving methodological sins because the conclusion is nice.

  ---

  ### Verdict Matrix

  | Score | Verdict | Action in Report |
  | :--- | :--- | :--- |
  | **Mostly PASS** | **Accept Provisionally** | "The adaptationist claim is warranted by the evidence provided." |
  | **Mostly FLAG** | **Reframe as Hypothesis** | "The phenomenon is interesting, but the evolutionary claim is speculative. Tone down 'adaptation' to 'potential function'." |
  | **Any FAIL + 2 FLAGs** | **Reject Adaptation Claim** | "The paper fails to rule out byproducts/constraints. The adaptationist narrative is unsupported." |
  | **Q5 = FAIL + Q1 = FAIL** | **Immediate Reframe** | "This is a just-so story. Must be presented as speculation." |

  ---

  ### Running the Audit on Your Three Manuscripts

  Here is how the procedure handles your specific cases, including the one you are biased toward.

  #### 1. Morning Sickness (Profet-style Hypothesis)
  *   **Q1 (Design):** **PASS.** Timing (first trimester) matches vulnerability window. Aversions match specific toxins (bitter/alkaloids).
  *   **Q2 (Variation):** **PASS/FLAG.** Universality is high, but severity varies with diet/toxin load (if paper cites this). If paper ignores variation, it's a FLAG.
  *   **Q3 (Alternatives):** **FLAG.** Hormonal byproduct explanation is the main rival. Does the paper address why hormones *cause* nausea specifically for toxins and not just general sickness?
  *   **Q4 (Cost):** **PASS.** Cost (maternal weight loss) is outweighed by benefit (preventing teratogenesis).
  *   **Q5 (Bias):** **PASS.** It's a visceral, unpleasant trait. Nobody *wants* vomiting to be adaptive.
  *   **Verdict:** **Accept Provisionally** (provided they acknowledge the hormonal byproduct rival).
  *   **Why:** The specificity of the timing and the content of the aversions passes the "Engineered Fit" test better than most behavioral traits.

  #### 2. Savanna Landscape Preference
  *   **Q1 (Design):** **FLAG.** Preference for "open trees/water" is plausible, but is the *aesthetic* mechanism specific? Or is it just visual fluency (easy to process)?
  *   **Q2 (Variation):** **FAIL.** If the paper claims universality but only tests Westerners or urbanites, it fails. If it admits people like parks in cities, that's current utility, not ancestral selection.
  *   **Q3 (Alternatives):** **FAIL.** Rarely rules out "exposure effect" (we like what we see often) or "resource availability" (we like water because we are thirsty now).
  *   **Q4 (Cost):** **PASS.** Low cost trait.
  *   **Q5 (Bias):** **FLAG.** It's a classic, comforting narrative.
  *   **Verdict:** **Reframe as Hypothesis.**
  *   **Why:** It fails to distinguish between "adapted to prefer" and "currently find useful." The "Design" is not specific enough to rule out general visual processing constraints.

  #### 3. Sad Music & Social Bonding (The One You Want to Accept)
  *   **Q1 (Design):** **FLAG.** Does sad music have features *specifically* for bonding that happy music doesn't? Or is it just "emotional music"? If the paper relies on "minor keys = sad," that's cultural, not evolutionary.
  *   **Q2 (Variation):** **FAIL.** Self-report ("I feel connected") is current psychological state, not evidence of universality or fitness variance.
  *   **Q3 (Alternatives):** **FAIL.** **Critical Failure.** Does it rule out "auditory cheesecake" (byproduct of language/emotion systems)? Most music papers do not. It assumes current utility = evolutionary function.
  *   **Q4 (Cost):** **FLAG.** Listening to sad music has low cost, so selection pressure would be weak. Hard to argue it was a driver of fitness.
  *   **Q5 (Bias):** **FAIL.** You admitted: "It's charming and I'd love it to be true." The evidence (self-report) is weak for an evolutionary claim.
  *   **Verdict:** **Reframe as Hypothesis.**
  *   **The Embarrassment:** The procedure forces you to admit that *current social utility* is not *evolutionary adaptation*. You can write: "The authors demonstrate a proximate mechanism (bonding), but the ultimate evolutionary claim (adaptation for bonding) is not distinguished from exaptation or byproduct. I recommend publishing *if* they reframe this as a testable hypothesis for future work, rather than an established finding."
  *   **Why:** This protects you from publishing a just-so story that you like. It allows the paper to exist but strips it of the unwarranted "Darwinian Proof" authority.

  ---

  ### The Failure Mode (When the Audit Lies to You)

  You asked for a case where this procedure might kill a true adaptation. Here it is:

  **The Case: Juvenile Play Behavior.**
  *   **Q1 (Design):** **FLAG.** Play looks inefficient, chaotic, and risky. It doesn't look "engineered."
  *   **Q2 (Variation):** **FAIL.** It looks like a byproduct of excess energy and neural growth.
  *   **Q3 (Alternatives):** **FAIL.** The "Byproduct of Brain Growth" hypothesis is very strong and parsimonious.
  *   **Q4 (Cost):** **FAIL.** High risk of injury, high energy cost. Hard to model the fitness benefit (skill acquisition is hard to prove as the *driver*).
  *   **Q5 (Bias):** **PASS.** It's hard to be biased here.
  *   **Audit Verdict:** **Reject Adaptation Claim / Reframe as Byproduct.**
  *   **Reality:** Play *is* likely adaptive (motor skills, social negotiation, stress testing).
  *   **Why the Audit Fails:** The SPANDREL Audit favors traits that look *obviously* designed (like morning sickness timing). It is biased against traits where the adaptation is **developmental** or **probabilistic**. Selection often acts on *capacities* (plasticity) rather than fixed traits. If a paper argues for "Adaptive Plasticity" rather than "Fixed Adaptation," this checklist will be too harsh on Q1 and Q3.
  *   **Override Rule:** If the paper explicitly argues for **Adaptive Plasticity** (the trait is variable *by design* to match environments), ignore Q1's "Specific Fit" requirement and focus on Q2 (does the variation track the environment?).

  ### How to Write the Report (Using the Audit)

  Don't paste the checklist. Use the output to structure your "Major Comments."

  *   **If Reframing:** "The authors present compelling evidence for the *proximate* function of X (e.g., social bonding). However, the leap to *ultimate* adaptation (Q3) requires ruling out exaptation. I recommend framing this as a hypothesis for future comparative testing rather than a confirmed evolutionary outcome."
  *   **If Rejecting:** "The claim relies on universality (Q2) and current utility (Q4) without demonstrating design specificity (Q1). This fits the definition of a 'just-so story' (Gould & Lewontin, 1979). Without comparative data or a model ruling out byproducts, the adaptationist claim is unsupported."
  *   **If Accepting:** "The paper successfully distinguishes between the trait's current utility and its evolutionary history (Q3), and the timing/mechanism specificity (Q1) makes the byproduct hypothesis unlikely."

  ### Final Note for the Tired Referee
  The goal of this audit is not to find "The Truth." It is to ensure **Epistemic Humility**.
  *   If the paper says "We found an adaptation," and the audit says "Flag," you make them say "We propose a potential adaptation."
  *   That single shift in modal verb is the victory. It keeps the literature honest without stifling speculation.
