answer: |-
  Here is a decision procedure designed for your board's constraints. It is built to be run in a single meeting with the proposal text in hand. It acknowledges the Gibbard–Satterthwaite (G-S) theorem without letting it paralyze decision-making.

  ### 1. The Decision Procedure Checklist

  Use this ordered checklist for any proposed voting method. If you reach Step 4 and the answer is "Yes," the G-S theorem applies. Do not stop there; proceed to Step 5.

  **Step 1: Establish the Election Scope**
  *   **Question:** How many candidates typically run for this specific office?
  *   **Action:** Look at the last 5 years of election data.
  *   **Sufficient Answer:**
      *   *Always 2 or fewer:* **STOP.** G-S does not apply. Simple majority is strategy-proof. Adopt the method if it counts majority correctly.
      *   *Often 3 or more:* **PROCEED** to Step 2.

  **Step 2: Identify the Ballot Type**
  *   **Question:** What does the voter submit?
  *   **Action:** Check the proposal text for ballot instructions.
  *   **Sufficient Answer:**
      *   *Strict Ranking (1st, 2nd, 3nd...):* **PROCEED** to Step 3. (This is the G-S domain).
      *   *Single Choice (Check one box):* **PROCEED** to Step 3. (Treated as a partial ranking).
      *   *Rating/Approval (Check multiple boxes or score 1–5):* **PROCEED** to Step 3, but note this changes the mathematical assumptions (see Worked Application C).

  **Step 3: Check for "Dictators" or Restricted Outcomes**
  *   **Question:** Is there any voter whose ballot always decides the winner regardless of others? OR Are there candidates who are mathematically barred from winning regardless of votes?
  *   **Action:** Ask the proposer: "Can any candidate win if enough people vote for them, and does no single member control the outcome?"
  *   **Sufficient Answer:**
      *   *No Dictator + All Candidates Eligible:* **PROCEED** to Step 4.
      *   *Yes Dictator or Restricted Candidates:* **STOP.** G-S does not apply (but the method is likely undemocratic).

  **Step 4: The G-S Trigger**
  *   **Question:** Do we have 3+ candidates, a non-dictatorial method, and a ballot that relies on rankings or single choices?
  *   **Action:** If Yes to all, the G-S theorem applies.
  *   **Conclusion:** **The method is theoretically manipulable.**
  *   **Critical Instruction:** Do not reject the proposal based on this conclusion alone. All methods (including the current one) trigger this. Mark "Theoretically Manipulable" on the scorecard and **PROCEED** to Step 5.

  **Step 5: The Practicality Filter (The "Degree" Check)**
  *   **Question:** What does a voter need to successfully manipulate the result?
  *   **Action:** Ask the proposer to describe the specific "attack vector."
  *   **Sufficient Answer:** You need a written description of the strategy.
      *   *Example:* "I need to know exactly how many votes the front-runner has."
      *   *Example:* "I need to coordinate with 50 other people to rank Candidate B last."
  *   **Pass Criteria:** The strategy requires specific knowledge of other people's votes or complex coordination.
  *   **Fail Criteria:** The strategy is obvious without any information (e.g., "Just vote for the person most likely to beat the one you hate").

  ---

  ### 2. Handoff Points to Human Judgment

  Once Step 4 confirms the method is manipulable (which it will), the board must move from math to judgment. The G-S theorem proves manipulation is *possible*, not *probable*. Use these three criteria to decide if the risk is acceptable.

  **A. Information Asymmetry (Objective)**
  *   **The Question:** How much data does a voter need to game the system?
  *   **Judgment Call:** If the manipulation requires knowing how others voted *before* voting (impossible in secret ballots) or precise polling data (hard to get for a 900-member society), the risk is low. If the strategy works with zero information (e.g., "always vote for the incumbent"), the risk is high.
  *   **Board Action:** Ask the retired statistician: "Does this strategy require knowing the vote distribution beforehand?" If yes, check "Hard to Execute."

  **B. Coordination Costs (Objective)**
  *   **The Question:** Does the manipulation require voters to act together?
  *   **Judgment Call:** One voter lying about preferences rarely changes an outcome. A bloc of 50 voters doing it might.
  *   **Board Action:** Assess your membership culture. Do you have active email lists or social media groups where "Vote for X to block Y" campaigns can spread in 24 hours? If yes, coordination is easy. If communication is siloed, coordination is hard.

  **C. Tolerance for Complexity (Values)**
  *   **The Question:** Is preventing strategy more important than ease of counting?
  *   **Judgment Call:** Some methods (like IRV) are harder to explain but reduce "vote splitting." Others (like Plurality) are simple but encourage "lesser-evil" voting.
  *   **Board Action:** This is a policy choice, not a math problem. You must vote on whether you value *simplicity* or *expressiveness* more. The checklist cannot decide this for you.

  ---

  ### 3. Worked Applications

  Here is how the procedure runs on your specific scenarios.

  **(a) Current System: Simple Plurality (One office, one vote)**
  *   **Step 1 (Candidates):** Often 3+? **Yes.**
  *   **Step 2 (Ballot):** Single Choice? **Yes.**
  *   **Step 3 (Dictator):** No? **Yes.**
  *   **Step 4 (G-S Trigger):** **Triggered.** Method is manipulable.
  *   **Step 5 (Practicality):**
      *   *Strategy:* "Vote splitting" / "Lesser of two evils."
      *   *Info Needed:* Low. Voters only need to know who the front-runners are (often public knowledge).
      *   *Coordination:* Low. Individual voters self-censor without needing to talk to each other.
      *   **Verdict:** **High Risk.** Easy to game with minimal information.

  **(b) Proposed System: Instant-Runoff Voting (IRV)**
  *   **Step 1–4:** **Triggered.** Like Plurality, IRV is ordinal and non-dictatorial with 3+ candidates. It is theoretically manipulable.
  *   **Step 5 (Practicality):**
      *   *Strategy:* "Burying" (ranking a strong competitor last) or "Compromising" (ranking a less-preferred but viable candidate first).
      *   *Info Needed:* High. To successfully bury a candidate without electing a worse one, you need a good guess at the elimination order.
      *   *Coordination:* High. Individual burying often backfires; it works best as a coordinated campaign.
      *   **Verdict:** **Moderate Risk.** Harder to game than Plurality because the penalty for guessing wrong is higher (your vote transfers to your last choice).

  **(c) Alternative: Approval Voting (Check all candidates you accept)**
  *   **Step 1 (Candidates):** 3+? **Yes.**
  *   **Step 2 (Ballot):** Rating/Binary (Approve/Disapprove)? **Yes.**
  *   **Step 4 (G-S Trigger):** **Technically No.** The G-S theorem assumes voters submit a *ranked order* (A > B > C). Approval allows grouping (A & B > C). It exploits a loophole in the theorem's assumptions regarding ballot structure.
      *   *Caveat:* A broader theorem (Gibbard 1978) covers this, so strategy still exists.
  *   **Step 5 (Practicality):**
      *   *Strategy:* "Bullet voting" (voting for only one to boost their share) or threshold management (where to draw the line between approve/disapprove).
      *   *Info Needed:* Moderate. You need to know who is viable to decide if you should approve your second choice.
      *   *Verdict:** **Moderate/Low Risk.** It eliminates "vote splitting" (the main complaint about Plurality) but introduces "threshold strategy." It is fundamentally different from Plurality/IRV.

  **(d) Edge Case: Two Nominees**
  *   **Step 1 (Candidates):** Only 2?
  *   **Result:** **G-S Does Not Apply.**
  *   **Verdict:** With only two candidates, simple majority rule is mathematically strategy-proof. If your society frequently has only two candidates, the voting method matters far less. The board should consider a rule that defaults to simple majority if only two candidates qualify, regardless of the general system.

  ---

  ### 4. What This Procedure Cannot Settle (Out of Scope)

  Do not attempt to use this checklist to resolve the following. These are policy questions, not mathematical ones.

  1.  **Is Tactical Voting Bad?** The procedure assumes you want to minimize it. Some theorists argue tactical voting reveals intensity of preference. The board must decide if "honest voting" is a goal in itself.
  2.  **Turnout Effects:** Will a complex ballot scare away members? Will a "lesser-evil" dynamic depress turnout? The G-S theorem says nothing about participation rates.
  3.  **Multi-Seat Elections:** You mentioned "three at-large board seats."
      *   If these are elected in **one single election** (top 3 vote-getters win), this is a *multi-winner* problem. G-S is a *single-winner* theorem. While similar impossibility results exist, this checklist does not strictly apply.
      *   If these are **three separate elections** (Seat A, Seat B, Seat C), the checklist applies to each.
      *   *Action:* Clarify your bylaws. If it's one election for three seats, you need a multi-winner analysis (e.g., Single Transferable Vote), which adds complexity this checklist does not cover.
  4.  **The "Center Squeeze" Effect:** IRV can sometimes eliminate a moderate candidate who is everyone's second choice. This is a performance characteristic, not a manipulability one. The checklist flags IRV as manipulable, but doesn't guarantee it picks the "best" winner.

  ---

  ### Final Verdict

  **Is your board member right that the debate is pointless?**

  **No. They are misreading the theorem.**

  Your board member is committing the **Nirvana Fallacy**: arguing that because a perfect solution (a strategy-proof method with 3+ candidates) does not exist, no improvement is possible.

  The Gibbard–Satterthwaite theorem proves that **all** systems are imperfect. It does not prove that all systems are **equally** imperfect.
  *   **Plurality** is manipulable with *low* information and *low* coordination (easy to game).
  *   **IRV** is manipulable but requires *higher* information and *higher* coordination (harder to game).
  *   **Approval** changes the rules of the game entirely, removing specific failure modes like vote-splitting.

  Switching from Plurality to IRV or Approval is not moving from "Manipulable" to "Perfect." It is moving from "Easy to Manipulate" to "Harder to Manipulate." That is a worthwhile debate. Tell your board member: "The theorem says we can't eliminate strategy. It doesn't say we can't make it harder to pull off."
