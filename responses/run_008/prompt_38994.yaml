  2.  **Deconstruct the Gibbard-Satterthwaite (G-S) Theorem:**
      *   *What it says:* For 3+ candidates, any deterministic voting rule that is surjective (every candidate can win) and non-dictatorial is manipulable.
      *   *What it implies:* No perfect system exists.
      *   *What it doesn't imply:* All systems are *equally* manipulable, or that manipulation is *easy* or *likely*.
      *   *Loopholes:* Randomness (not practical here), restricting preferences (single-peaked? maybe not), changing ballot type (Approval/Cardinal vs. Ordinal). *Correction:* G-S specifically applies to *ordinal* ranking methods where voters submit a strict ordering. Approval voting uses cardinal ratings (approve/disapprove), so it technically falls outside the strict assumptions of the original G-S theorem, though related impossibility results exist for cardinal systems (e.g., Gibbard's 1978 theorem). However, for a practical board checklist, the distinction is crucial: Approval changes the *input* mechanism, which changes the strategic landscape.
      *   *Key Takeaway for the Board:* "Manipulable in theory" $\neq$ "Broken in practice."

  3.  **Drafting the Decision Procedure (The Checklist):**
      *   Needs to be step-by-step.
