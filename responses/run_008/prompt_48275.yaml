      *   **The Mathematical Core (Premise 1 & 2):** Affirm these are correct *within the model*.
      *   **The Fatal Flaw (Independence):** Explain why real voters aren't independent coin flips. This is the bridge between (2) and (4).
      *   **The Competence Trap (Premise 3):** Discuss systematic error vs. random error.
      *   **The Ontological Mismatch (Premise 4):** Facts vs. Values/Counterfactuals.
      *   **What You Keep:** How to salvage a modest epistemic defense of democracy without the absurd infallibility claim.
      *   **Conclusion:** Summary advice for the course.

  7.  **Key Terminology to Include:** Conditional independence, common shock, systematic bias, epistemic democracy, truth-apt.

  8.  *(Self-Correction on "Cost")*: If I reject independence, do I lose the epistemic argument? I need to be careful here. I lose the *Condorcet* argument for *infallibility*. I might keep a *pragmatic* or *aggregate* argument (e.g., diversity trumps ability, or simple error cancellation in local contexts). I should mention that rejecting the strong CJT application doesn't mean democracy has *no* epistemic value, just that it's not a truth machine.

  9.  **Final Polish:** Ensure the distinction between "random error" (which CJT cancels) and "systematic error" (which CJT amplifies) is clear. This is the statistical heart of the rebuttal.

