answer: |-
  Your intuition is sharp, and your hypothesis—that this might be a case of "different bookkeeping" for the same underlying structure—is one that has been seriously entertained by philosophers, particularly those with a Carnapian or deflationary bent. However, the consensus among contemporary metaphysicians is that while there is a conventional element, the disagreement is not *merely* verbal or notational. It is substantive, but not in the way an experimentalist expects substantiveness.

  To answer your question directly: This is a disagreement about **truthmakers** and **ontological commitment**, centered on the doctrine of **Haecceitism**. It refuses to die because it represents a clash of fundamental theoretical virtues that cannot be adjudicated by observation. Regarding progress since the 1980s: there has been significant clarification, though not a "solution" in the empirical sense.

  Here is an analysis of the dispute through the lens of your scientific background.

  ### 1. Is it just "Bookkeeping"? (The Ontological Stakes)
  Your hypothesis suggests that Lewis and Kripke are mapping the same territory with different coordinate systems. In one sense, they are: both systems validate most of the same standard modal inferences (e.g., "Humphrey could have won" comes out true in both).

  However, in metaphysics, the "coordinate system" *is* the ontology. The disagreement is about what exists to make the statement "Humphrey could have won" true.
  *   **For Lewis (Counterpart Theory):** The truthmaker is a concrete, flesh-and-blood individual in a causally isolated spacetime who resembles Humphrey. Lewis is a **Modal Realist**. He pays an ontological price (infinite concrete worlds) to buy a qualitative benefit (no mysterious "cross-world identity").
  *   **For Kripke/Plantinga (Transworld Identity):** The truthmaker is usually an abstract entity (a "world" as a maximal consistent set of propositions) and the individual Humphrey himself, who possesses a primitive **Haecceity** (a "thisness") that allows him to be present in multiple abstract worlds. They pay an ontological price (primitive non-qualitative properties) to buy an intuitive benefit (it is literally *Humphrey* who wins).

  If this were merely notation, we could translate one into the other without loss. But we cannot. Lewis's system forbids "bare identity" across worlds; Kripke's requires it. This leads to divergent consequences in edge cases (e.g., the "Problem of Accidental Intrinsics" or the behavior of quantifiers in modal logic).

  So, it is not a verbal dispute about the phrase "could have been." It is a substantive dispute about **Haecceitism**: Do objects have a primitive identity independent of their qualitative properties?
  *   **Anti-Haecceitist (Lewis):** Identity is grounded in qualitative similarity. If you swap two qualitatively identical electrons in a possible world, nothing has changed.
  *   **Haecceitist (Kripkean):** Identity is primitive. Swapping two qualitatively identical electrons results in a distinct possible world because *this* electron is now *there*.

  ### 2. Why the Disagreement Refuses to Die
  In physical chemistry, a dispute between models dies when data falsifies one. In metaphysics, there is no "data" in that sense. The dispute persists because it is a trade-off between competing **theoretical virtues**, much like choosing between two mathematical models that fit the data equally well but imply different underlying mechanisms.

  *   **Team Lewis** prioritizes **Qualitative Supervenience**. They believe all facts should supervene on qualitative, spatiotemporal facts. They find "primitive thisness" magical and unscientific. They are willing to sacrifice the intuition that *I* could have won to preserve a naturalistic ontology.
  *   **Team Kripke** prioritizes **Modal Intuition** and **Parsimony of Worlds**. They believe it is absurd to claim I don't survive in other possibilities. They are willing to accept primitive haecceities (which look suspiciously like souls to a naturalist) to preserve the logic of identity.

  The dispute refuses to die because neither side can prove their theoretical virtue is superior. It is a stalemate of **Reflective Equilibrium**. You adjust your ontology until it fits your intuitions, but your intuitions are shaped by your ontology.

  ### 3. Progress Since the 1980s
  You noted that arguments seemed to run out in the 80s. In a way, they did. The "classical" phase ended when both sides acknowledged the costs of their positions. However, "progress" in metaphysics often looks like **dissolution** or **refinement** rather than resolution. Here is what has happened since:

  **A. Two-Dimensional Semantics (Stalnaker, Chalmers)**
  This is the closest thing to a synthesis. It distinguishes between two ways of evaluating "possibility."
  1.  **Epistemic:** What is conceivable? (Could I have been someone else?)
  2.  **Metaphysical:** What is possible given how the world actually is? (Given I am Humphrey, could I have won?)
  This framework allows philosophers to grant that Lewis is right about the *metaphysical* structure (counterparts) while acknowledging Kripke is right about the *epistemic* intuition (it feels like me). It doesn't solve the ontology, but it explains why the disagreement feels so intractable.

  **B. The "Grounding" Turn**
  Since 2010, metaphysics has shifted focus from "what exists?" to "in virtue of what?" This is the **Truthmaker** question you implicitly raised.
  Current work asks: Even if we accept Transworld Identity, *what grounds it*? Is it a brute fact? If so, many argue Lewis is right to reject it. If it is grounded in qualitative facts, then Lewis is right that Counterpart Theory is the better description. This has moved the debate from "Which logic is correct?" to "Which ontology provides better explanatory grounding?"

  **C. Quietism and Meta-Ontology**
  A significant camp (influenced by Carnap, whom you might appreciate) now argues that your "bookkeeping" hypothesis is actually the correct one. Philosophers like Eli Hirsch or Amie Thomasson argue that the dispute is merely conceptual. They claim we can stipulate our ontology based on pragmatic utility. If you want to do modal logic, use Kripke's notation. If you want to analyze causation across worlds, use Lewis's. This view treats the dispute as a choice of **conceptual framework** rather than a discovery of fact.

  **D. Formal Refinements**
  Logicians have developed **Hybrid Logics** and **Variable Domain Semantics** that allow one to model transworld identity without committing to Lewisian realism. This has clarified that the logical problems Lewis identified (like the necessity of identity) can be managed without abandoning TWI, provided one accepts complex constraints on how individuals exist across worlds.

  ### 4. A Perspective for a Scientist
  As a physical chemist, you are accustomed to **Realism**: theories aim to describe a mind-independent reality, and data decides between them.
  Metaphysics operates more like **Model Selection** in the absence of data.
  *   Lewis offers a model that maximizes qualitative clarity but minimizes intuitive identity.
  *   Kripke offers a model that maximizes intuitive identity but minimizes qualitative clarity.

  Your hypothesis that "no observation or proof could decide it" is correct. That is not a failure of the field, but a feature of the subject matter. The "progress" since the 80s is the realization that the choice between CT and TWI is not a binary truth-value but a **parameter** in one's broader metaphysical system.

  If you force me to say who "won": The field has largely moved toward **Actualism** (rejecting Lewis's concrete worlds) but incorporated Lewis's **insight** that identity across worlds must be grounded in something qualitative to avoid arbitrariness. Most contemporary metaphysicians use a Kripkean semantics but worry deeply about the Lewisian challenge regarding haecceities.

  **Summary:**
  The disagreement is substantive (ontological), not verbal. It persists because it trades off incompatible theoretical virtues (Supervenience vs. Intuition). Progress since the 80s has been the development of frameworks (2D semantics, Grounding) that map the trade-offs more precisely, and a growing acceptance that the choice may be pragmatic (your "bookkeeping" hypothesis) rather than factual. You are not missing a hidden proof; the underdetermination is genuine.
