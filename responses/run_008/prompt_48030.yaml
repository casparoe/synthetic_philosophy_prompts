prompt: |-
  I teach an intro epistemology course, 16 undergrads, one 75-minute session. They've already had the standard lecture on knowledge as justified true belief, and next session I want them to discover the Gettier problem themselves, before I ever say the name. Here's my sketch: some kind of game where teams act as a knowledge certification bureau. They get a batch of belief files — a detective's belief about a suspect, a farmer's belief that there's a sheep in his field, a student's belief about who will get the job — each file has the believer, the belief, and the evidence for it. The teams apply a JTB checklist I hand them, stamp the ones that pass as KNOWLEDGE, and then I reveal the hidden world-states, and some of the beliefs they certified turn out true only by pure dumb luck. The gut-punch has to happen in the reveal, not in anything I say beforehand.

  Second half: a rule-repair tournament. Each team gets to amend the certification test — add clauses, redefine justification, whatever — and then swaps their amended test with another team whose whole job is to find a counterexample to it. I want them to rediscover for themselves why the obvious patches fail: the no-false-lemmas fix that dies to fake barn type scenarios, a defeasibility clause that dies to lottery-type cases, and eventually someone will just write epistemic luck out of the rulebook, and I want the class to see that that's circular, not a solution. Points for patches that survive a round of attacks, bonus points for an attack that kills a patch.

  So what I need from you: the actual materials — a set of belief file cards with a public face and a hidden truth envelope, some of which are Gettiered and some of which are clean true knowledge plus maybe one plain false belief so they can't just pattern-match, a scoring scheme that doesn't need real money, and the JTB checklist handout. Don't just recycle the famous cases straight — hide one or two of them in disguise so it lands in the debrief, but most should be fresh. Also a timeline that fits 75 minutes, and a debrief that maps what happened onto the real literature: Gettier's original cases, the barn case, the lottery problem, and, if there's time, a taste of the safety vs. sensitivity response for the couple of stronger students. And be honest about what the game can't reproduce — nobody in the room actually holds these beliefs, the certifiers are third parties, the hidden truths are staged by me — and what I'll have to supply in the debrief.

  Finally, tell me what will predictably go wrong the first time I run it. My guesses are that some teams will go ultra-conservative and certify nothing, others will just keep lawyering the rule until it says knowledge is whatever doesn't Gettier, and that the reveal will fall flat if there are too few Gettiered files per round — but tell me if you see other failure modes, and roughly how many files I need per round so the reveals actually sting.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Teach the Gettier problem to 16 undergrads in a 75-minute intro epistemology session.
      *   **Method:** Discovery-based learning via a simulation game ("Knowledge Certification Bureau").
      *   **Structure:**
          *   Part 1: Apply JTB checklist to "belief files." Reveal hidden truths showing some JTB cases are luck (Gettier cases).
          *   Part 2: Rule-repair tournament. Teams amend JTB, swap, and try to break each other's rules.
          *   Part 3: Debrief mapping to literature (Gettier, Barn, Lottery, Safety/Sensitivity).
      *   **Deliverables:** Belief file cards (public/hidden), JTB checklist, scoring scheme, timeline, debrief guide, failure mode analysis.
      *   **Constraints:** 16 students (4 teams of 4?), 75 minutes, fresh cases (not just recycling Smith/Jones/Brown verbatim), honest assessment of limitations.

  2.  **Deconstruct the Logistics:**
      *   **Class Size:** 16 students. Ideal for 4 teams of 4.
      *   **Time:** 75 minutes is tight for two distinct game phases + debrief.
          *   Intro/Rules: 5 mins
          *   Phase 1 (JTB Application + Reveal): 20 mins
          *   Phase 2 (Rule Repair + Attack): 25 mins
          *   Debrief/Lecture: 25 mins
      *   **Materials:** Need physical cards/envelopes for the "reveal" mechanic to work.

  3.  **Develop the Materials (Belief Files):**
      *   *Requirement:* Mix of Clean Knowledge, Gettier Cases, False Beliefs.
      *   *Quantity:* Need enough for the reveal to "sting." If each team gets 5 files, and only 1 is Gettiered, it might not land. If 3 are Gettiered, it feels like a trick. Let's aim for 6 files per team (24 total), with a distribution that ensures every team encounters at least one Gettier case and one Clean case.
      *   *Case Design:*
          *   *Case 1 (Clean Knowledge):* Standard perception/memory.
          *   *Case 2 (False Belief):* Justified but false (to show JTB doesn't certify falsehoods).
          *   *Case 3 (Classic Gettier Disguise):* Sheep in the field (but maybe a dog disguised as a sheep, or a reflection).
          *   *Case 4 (Disjunctive Gettier):* Job/Money case variant (e.g., believing someone has a coin based on a wallet count, but the wallet is swapped).
          *   *Case 5 (Fake Barn Variant):* Driving through a town, seeing a structure.
          *   *Case 6 (Clock/Time):* Stopped clock.
      *   *Formatting:* "Public Face" (Who, Belief, Evidence) vs. "Hidden Truth" (World State).

  4.  **Develop the JTB Checklist:**
      *   Needs to be simple enough to apply quickly but rigorous enough to pass standard JTB cases.
      *   Criteria: Belief? True? Justified?

  5.  **Develop the Rule-Repair Tournament:**
      *   Mechanism: Teams write a "Clause 4" or modify definitions.
      *   Attack Mechanism: Teams swap rules and write a "Scenario Card" that breaks the new rule.
      *   Scoring: Points for surviving a round, points for breaking another team's rule.

  6.  **Drafting the Timeline:**
      *   0:00-0:05: Setup & Hook.
      *   0:05-0:25: Phase 1 (Certification).
      *   0:25-0:30: The Reveal (Crucial moment).
      *   0:30-0:55: Phase 2 (Rule Repair & Attack).
      *   0:55-1:15: Debrief & Lecture.

  7.  **Addressing Failure Modes:**
      *   *Conservative Teams:* Certify nothing. *Fix:* Incentivize certification (points for correct certs, small penalty for false negatives).
      *   *Lawyering:* Defining knowledge as "non-Gettiered." *Fix:* Call this out in debrief as circular.
      *   *Flat Reveal:* *Fix:* Ensure high ratio of Gettier cases in the first batch.
      *   *Time Creep:* *Fix:* Strict timer on Phase 2.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* 24 files might be too many to print/cut for a single session.
      *   *Adjustment:* Let's reduce to 4 files per team (16 total). It's faster. Each team gets 1 Clean, 1 False, 2 Gettier. That guarantees the sting.
      *   *Critique:* Phase 2 might get bogged down in writing.
      *   *Adjustment:* Provide a template for the "Patch" and the "Attack."
      *   *Critique:* The "Third Party" issue. Students aren't the believers.
      *   *Adjustment:* Acknowledge this in the debrief. The logic holds regardless of who holds the belief, but the *feeling* of knowledge is missing.

  9.  **Finalizing the Debrief:**
      *   Map specific game cases to specific philosophical cases (Sheep -> Chisholm, Job -> Gettier Case 1, Barn -> Goldman).
      *   Explain *why* the patches failed (No False Lemmas, Defeasibility, Anti-Luck).
      *   Mention Safety/Sensitivity briefly.

  10. **Review against constraints:**
      *   16 undergrads? Yes (4 teams).
      *   75 mins? Yes (tight but doable).
      *   No "Gettier" name drop until debrief? Yes.
      *   Materials provided? Yes.

  11. **Final Polish:** Ensure tone is supportive but realistic about classroom management. (e.g., "You need to be the timekeeper.")

  *(Self-Correction on Case Design)*: Make sure the "Hidden Truth" is clearly separated from the "Public Face" so the instructor can control the reveal. I will format these as "Front of Card" and "Instructor Key/Envelope."

  *(Self-Correction on Scoring)*: Keep it simple. Whiteboard tally. No money needed.

  *(Self-Correction on Failure Modes)*: Add the "Overfitting" risk where students make the rule so complex it's unusable. This is actually a feature for the debrief (complexity vs. utility).

