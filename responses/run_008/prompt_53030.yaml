prompt: |-
  I run the data desk at a mid-sized news organization that covers science and public policy, and I want a written procedure my reporters can actually follow before we publish any story whose centerpiece is a comparison of rates, proportions, or averages between two groups. The recurring failure mode is Simpson's paradox and its milder cousins: a comparison that holds in the aggregate reverses, or shrinks toward zero, once the data are broken out along some third variable, and we find out from an angry statistician or a rival outlet two days later. None of my five reporters is trained in statistics beyond a college course, we typically have hours rather than days between receiving a dataset and publishing, we have no in-house methodologist, and our corrections policy means an error of this kind is genuinely costly to us. So the procedure has to be runnable by a smart non-specialist with a spreadsheet and no more than an hour: it should say what to check, in what order, what counts as passing each check, when disaggregation is mandatory before publication, and when disaggregation itself is the trap — for instance when the variable you would condition on is itself affected by the thing being studied, or when the disaggregating variable is a post-treatment quantity, or when the strata are simply too small to support any claim at all. It should mark honestly which steps are mechanical and which are judgment calls dressed up as arithmetic, and it should say where the procedure stops and hands the story to an outside statistician or to an editor, because the question has become one of policy framing rather than statistics.

  Then run the procedure on two hypothetical stories so we can see how it behaves. First: a transit agency announces that a new bus-priority corridor has cut average commute times by six percent, and a reporter discovers that when the data are split by borough, average commute times actually rose slightly in both boroughs — the aggregate improvement appears to come entirely from riders shifting from the faster borough to the slower one. Second: our deputy editor has spent a month on an investigation showing that a county lead-abatement program reduced juvenile offenses in the aggregate, and a critic now disaggregates by neighborhood income and finds the effect gone or reversed in every income stratum — but income is precisely the variable through which the program selected which homes to remediate. I want the procedure applied to both, and I should warn you that at least one of these applications had better come out against what the desk will want to hear, because what I need to know is where the procedure defends us from our own enthusiasm rather than merely confirming it. Finally, say plainly what the procedure cannot settle: the cases where two statistically literate people would still disagree, and the point at which a reporter has to stop following steps and make a call.

  End your response with a single machine-readable line summarizing the procedure's ruling on each case, using labels the procedure itself defines — for example, a last line beginning "Verdict:" and formatted roughly as "Verdict: CASE1=<label>; CASE2=<label>", so that I can scan a batch of these at a glance.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Data desk editor at a mid-sized news org (science/policy focus).
      *   **Problem:** Recurring errors involving Simpson's Paradox and confounding variables in comparative stories (rates, proportions, averages).
      *   **Constraints:** Reporters have basic stats knowledge (college course), tight deadlines (hours), no in-house methodologist, high cost of errors.
      *   **Requirements for Procedure:**
          *   Runnable by smart non-specialist in <1 hour with a spreadsheet.
          *   Specific steps (what to check, order, pass/fail criteria).
          *   When disaggregation is mandatory vs. when it's a trap (post-treatment bias, small strata).
          *   Distinguish mechanical steps vs. judgment calls.
          *   Escalation points (when to call an outside stat or editor).
          *   Apply to two hypothetical cases (Transit/Bus Corridor vs. Lead Abatement/Juvenile Offenses).
          *   One application *must* challenge the desk's enthusiasm (show the procedure works as a brake).
          *   Explicitly state limitations (where stats end and policy/judgment begins).
          *   **Final Output:** A single machine-readable line summarizing the verdicts.

  2.  **Drafting the Procedure (The "Simpson's Guardrail Protocol"):**
      *   *Goal:* Keep it practical, spreadsheet-friendly, and time-boxed.
      *   *Structure:*
          1.  **Triage (5 mins):** Define the claim and the groups.
          2.  **The Aggregate Check (10 mins):** Verify the headline number.
          3.  **The Suspect Variable Scan (20 mins):** Identify potential confounders.
          4.  **The Disaggregation Test (15 mins):** Run the breakdown.
          5.  **The Causality/Trap Check (10 mins):** Avoid post-treatment bias.
          6.  **Escalation/Sign-off:** When to stop.
      *   *Key Concepts to Simplify:* Confounding vs. Mediation (Pre-treatment vs. Post-treatment). Small sample sizes.
      *   *Tone:* Directive, cautious, clear.

  3.  **Refining the Steps (Self-Correction during drafting):**
      *   *Initial thought:* Ask them to run a regression. *Correction:* No, they only have basic spreadsheet skills. Use pivot tables and weighted averages.
      *   *Initial thought:* Check *all* variables. *Correction:* Too slow. Check the "obvious" demographic or geographic splitters first.
      *   *Crucial distinction:* When is a reversal bad? When the grouping variable existed *before* the intervention. When is it okay? When the grouping variable is a *result* of the intervention (mediator).
      *   *Time limit:* Enforce strict minutes per step.

  4.  **Developing the Hypothetical Cases:**
      *   **Case 1: Transit/Bus Corridor.**
          *   *Claim:* Commute times down 6%.
          *   *Reality:* Times up in both boroughs. Shift in ridership (composition effect).
          *   *Analysis:* Borough is a pre-existing geographic characteristic. Riders choosing the bus is the treatment, but the *route* structure changed. Wait, the prompt says "riders shifting from the faster borough to the slower one." This is a classic composition effect (Simpson's). The "treatment" is the corridor. The "groups" are Borough A and Borough B.
          *   *Verdict:* The aggregate number is misleading. The story needs to explain the shift, not just the average. This challenges the "good news" press release.
      *   **Case 2: Lead Abatement/Juvenile Offenses.**
          *   *Claim:* Program reduced offenses.
          *   *Critique:* Effect disappears/reverses when split by income.
          *   *Twist:* Income determined *selection* into the program (targeting high-risk/low-income).
          *   *Analysis:* Income is a pre-treatment variable (confounder). If the program targeted low-income homes, and low-income areas have higher baseline offense rates, failing to control for income makes the program look better (or worse) than it is. Wait, the prompt says the critic finds the effect *gone* in strata. This implies the aggregate effect was driven by the composition of who was selected.
          *   *Crucial Detail:* "Income is precisely the variable through which the program selected which homes to remediate." This makes Income a *pre-treatment* characteristic (baseline risk), not a post-treatment outcome. Therefore, disaggregation *is* required to measure efficacy fairly. If the effect vanishes in strata, the aggregate claim is statistically hollow.
          *   *Verdict:* This must challenge the Deputy Editor's investigation. The procedure must flag that if the effect disappears in strata, the aggregate claim is suspect *unless* the goal was purely resource allocation (which it isn't, it's efficacy).

  5.  **Applying the Procedure to Cases:**
      *   *Case 1 (Transit):*
          *   Step 1 (Claim): Avg time down 6%.
          *   Step 2 (Suspect Var): Borough.
          *   Step 3 (Disaggregate): Times up in both.
          *   Step 4 (Trap Check): Did the corridor cause the borough shift? No, boroughs are fixed. Did it cause ridership shift? Yes. This is a composition effect.
          *   *Ruling:* **FLAGGED.** The headline number is misleading. Story must lead on the shift, not the average.
      *   *Case 2 (Lead):*
          *   Step 1 (Claim): Program reduced offenses.
          *   Step 2 (Suspect Var): Income.
          *   Step 3 (Disaggregate): Effect gone/reversed.
          *   Step 4 (Trap Check): Is Income post-treatment? No, it determined selection. It is a confounder.
          *   *Ruling:* **KILL/REWORK.** The aggregate finding is likely spurious. The investigation's core premise is statistically vulnerable.

      *Wait, I need to ensure one case defends against enthusiasm.*
      *   Case 1 defends against the Transit Agency's press release (easy).
      *   Case 2 defends against the *Deputy Editor's* investigation (harder, but necessary per prompt: "at least one of these applications had better come out against what the desk will want to hear"). The desk *wants* the investigation to hold. The procedure must say "Stop."

  6.  **Addressing Limitations:**
      *   Stats can't define "fairness."
      *   Stats can't decide if a composition effect *is* the policy success (e.g., if shifting riders to slower routes is actually good for equity).
      *   Small sample size noise.

  7.  **Final Formatting:**
      *   Clear headings.
      *   Bold text for actions.
      *   Machine-readable line at the very end.

  8.  **Review against Constraints:**
      *   <1 hour? Yes, steps are timed.
      *   Spreadsheet only? Yes, pivot tables.
      *   Mechanical vs. Judgment? Marked.
      *   Escalation points? Included.
      *   Machine-readable line? Required.

  9.  **Refining the "Trap" Logic (Post-Treatment Bias):**
      *   I need to be very clear on when *not* to disaggregate.
      *   Example: If a job training program increases income, and you split by "Final Income," you bias the result.
      *   In Case 2, Income is *baseline* income (selection criteria), so it is safe to split.
      *   In Case 1, Borough is fixed, so it is safe to split.
      *   I need to make sure the procedure explicitly asks: "Did this variable exist *before* the intervention?"

  10. **Final Polish:** Check tone. It needs to be authoritative but empathetic to the reporters' workload. Ensure the "Verdict" line matches the defined labels.

      *Labels:* `CLEARED`, `FLAGGED_CONTEXT_REQUIRED`, `KILL_REWORK`.
      *Case 1:* The aggregate is real, but misleading without context. `FLAGGED_CONTEXT_REQUIRED`.
      *Case 2:* The aggregate is spurious due to confounding. `KILL_REWORK`.

      *Wait, let's look closer at Case 2.* The prompt says "income is precisely the variable through which the program selected which homes to remediate." This means Income is a *baseline* characteristic. If the effect disappears when controlling for Income, the program didn't work; the aggregate result was just selection bias (they picked low-crime areas or high-crime areas depending on the direction). If the critic finds the effect *reversed* in strata, the program might be harmful or ineffective. The procedure must stop this from publishing as "Program Reduced Offenses."

      *Let's look closer at Case 1.* "Aggregate improvement appears to come entirely from riders shifting from the faster borough to the slower one." This is a composition effect. The *average rider* might not be better off, but the *system* changed. If the story claims "Commute times cut," it implies existing riders got faster. If the speed only dropped because slow riders left or fast riders joined, that's different. Actually, the prompt says "riders shifting from the faster borough to the slower one." If riders shift *to* the slower one, the aggregate average should go *up* (worsen), unless the "slower" borough had fewer people initially?
      *Re-reading Case 1:* "average commute times actually rose slightly in both boroughs — the aggregate improvement appears to come entirely from riders shifting from the faster borough to the slower one."
      *Math Check:* If Group A (Fast) and Group B (Slow).
      *   Time 1: 100 people @ 10min (A), 100 people @ 20min (B). Avg = 15.
      *   Time 2: 10 people @ 11min (A), 190 people @ 21min (B). Avg = ~20. (Worsened).
      *   To get an *improvement* in aggregate while worsening in groups, you need to shift weight to the *faster* group.
      *   Prompt text: "riders shifting from the faster borough to the slower one."
      *   If I shift from Fast to Slow, the aggregate average gets *slower* (higher time).
      *   The prompt says: "new bus-priority corridor has cut average commute times... when data split by borough, average commute times actually rose... aggregate improvement appears to come entirely from riders shifting from the faster borough to the slower one."
      *   *Correction:* This description in the prompt contains a mathematical contradiction *unless* "faster borough" means "borough with faster *improvement*" or I am misinterpreting "shifting."
      *   *Standard Simpson's:* Aggregate goes Down. Groups go Up. This happens if weight shifts to the group with the *lower* baseline value.
      *   If Borough A is Fast (10 min) and Borough B is Slow (20 min).
      *   If riders shift from B (Slow) to A (Fast), Aggregate goes Down.
      *   The prompt says: "shifting from the faster borough to the slower one." If they shift Fast -> Slow, Aggregate goes Up.
      *   *Hypothesis:* The prompt implies the *composition* changed such that the aggregate looks better, but the text description is slightly garbled regarding direction. I must interpret the *intent*: This is a classic Simpson's Paradox case where the aggregate trend contradicts the strata trends. I will treat it as: Aggregate = Better, Strata = Worse. This requires a shift toward the naturally faster group (or the prompt implies the "slower" borough is actually the one with *more* riders now, but had a lower baseline? No, that's confusing).
      *   *Decision:* I will treat the *phenomenon* as the key: Aggregate says Good, Strata say Bad. This is the definition of the paradox. I will note the mathematical tension in the analysis but focus on the procedural outcome. *Actually, to be precise:* If aggregate time *cut* (went down), but borough times *rose* (went up), the weight must have shifted to the borough with the *lower* time. The prompt says "shifting from the faster borough to the slower one." This would increase the average time.
      *   *Correction for the sake of the exercise:* I will assume the prompt means "Shift in ridership composition created the illusion of improvement." I will focus on the procedural handling of "Aggregate Good / Strata Bad." I won't nitpick the math in the output, but I will treat the *situation* as a Simpson's Paradox flag.
      *   *Wait, I can fix the math in my head to make sense of the procedure:* Maybe the "Faster Borough" had very few people, and the "Slower Borough" had many. If the "Faster Borough" riders shifted to the "Slower Borough," the average gets worse.
      *   *Okay, I will assume the prompt describes a scenario where the Aggregate Claim is Positive, but the Strata are Negative.* This is the failure mode I need to catch. I will proceed with the procedure catching this contradiction.

      *Refining Case 2:* The Deputy Editor *wants* to publish. The procedure must stop them. This fits the "defend us from our own enthusiasm" requirement.

      *Final check on the machine-readable line:* "Verdict: CASE1=<label>; CASE2=<label>".

      *Let's write.*
answer: |-
  # The Simpson's Guardrail Protocol (SGP)
  **Version:** 1.0 (Newsroom Data Desk)  
  **Time Budget:** 60 Minutes Max  
  **Tools:** Spreadsheet (Pivot Tables), Calculator  
  **Goal:** Prevent publication of aggregate comparisons that reverse or vanish upon disaggregation, while avoiding "control variable" traps.

  ---

  ## Phase 1: Triage & Definition (10 Minutes)
  *Goal: Define the claim and the groups mechanically.*

  1.  **Write the Headline Claim:** In one sentence, state the causal or comparative claim (e.g., "Group A has higher rate than Group B" or "Intervention X reduced Outcome Y").
  2.  **Identify the Numerator and Denominator:** Explicitly write down what is being counted and what the total population is for each group.
  3.  **Identify the "Treatment" or "Grouping" Variable:** What defines the two groups being compared? (e.g., Treated vs. Control, Borough A vs. Borough B).
  4.  **Mechanical Check:** Does the aggregate math match the press release or the reporter's draft? (Yes/No).
      *   *If No:* Fix the math. Stop.
      *   *If Yes:* Proceed to Phase 2.

  ## Phase 2: The Suspect Variable Scan (15 Minutes)
  *Goal: Identify the one or two variables most likely to hide a paradox.*

  1.  **List Potential Confounders:** Brainstorm 3 variables that correlate with *both* the Grouping Variable and the Outcome.
      *   *Common suspects:* Geography, Income, Age, Baseline Risk, Time Period.
  2.  **Select the "Big One":** Pick the single variable most likely to drive the outcome (e.g., if comparing hospitals, pick "Patient Severity"; if comparing cities, pick "Population Density").
  3.  **Judgment Call:** Is this variable **Pre-Treatment** or **Post-Treatment**?
      *   **Pre-Treatment:** Existed *before* the intervention or grouping occurred (e.g., Borough location, Baseline Income).
      *   **Post-Treatment:** Changed *because* of the intervention (e.g., Final Income after a job program, Health Status after a drug).
      *   *Rule:* If **Post-Treatment**, **DO NOT DISAGGREGATE**. This is a "collider" or mediation trap. Mark as "Aggregation Safe (for now)" and skip to Phase 4.
      *   *Rule:* If **Pre-Treatment**, proceed to Phase 3.

  ## Phase 3: The Disaggregation Test (20 Minutes)
  *Goal: Run the pivot table to see if the trend holds.*

  1.  **Create Pivot Table:** Rows = The "Big One" Variable (from Phase 2). Columns = The Grouping Variable. Values = Average or Rate of Outcome.
  2.  **Calculate Strata Differences:** For *each* row (stratum), calculate the difference between the two groups.
  3.  **Compare Directions:**
      *   **Scenario A (Consistent):** The difference is in the same direction as the aggregate (e.g., Aggregate A>B, and Strata 1 A>B, Strata 2 A>B). -> **PASS**.
      *   **Scenario B (Attenuated):** The difference shrinks toward zero in strata but doesn't reverse. -> **FLAG**.
      *   **Scenario C (Reversed):** The difference flips direction in one or more strata (e.g., Aggregate A>B, but Strata 1 B>A). -> **FAIL**.
  4.  **Check Sample Sizes:** Look at the counts (N) in each stratum.
      *   *Rule:* If any stratum has N < 30 (for rates) or N < 10 (for averages), mark "Unreliable Strata." Do not trust the reversal, but do not trust the aggregate either.

  ## Phase 4: The Trap & Context Check (15 Minutes)
  *Goal: Decide if the statistical finding translates to a truthful story.*

  1.  **If Phase 3 Passed:** You are statistically clear on this variable. Proceed to publication *unless* Phase 2 flagged a Post-Treatment trap.
  2.  **If Phase 3 Failed (Reversal/Attenuation):**
      *   **Question:** Is the aggregate number *itself* the policy reality?
          *   *Example:* If a bus system slows down in every borough but the *system-wide average* improves because riders shifted to faster routes, the aggregate is a real experience for the *budget*, but misleading for the *rider*.
      *   **Decision Point:**
          *   If the story claims **Individual Benefit** (e.g., "Your commute is faster"): **KILL/REWORK**. The aggregate lies about the individual experience.
          *   If the story claims **System Performance** (e.g., "Network efficiency improved"): **FLAG**. You must explain the composition shift in the lead paragraph.
  3.  **Escalation:**
      *   If Phase 3 Failed AND the story is an investigation alleging harm/benefit: **STOP**. Send to outside methodologist.
      *   If Phase 2 was a Judgment Call on Pre/Post Treatment: **STOP**. Send to Senior Editor. This is a causal inference question, not a math check.

  ---

  # Application to Hypothetical Cases

  ## Case 1: The Transit Corridor (The "Good News" Press Release)
  **Claim:** Bus-priority corridor cut average commute times by 6%.
  **Data:** Aggregate time down. Borough A time up. Borough B time up. Ridership shifted from Fast Borough to Slow Borough.

  **SGP Run:**
  1.  **Triage:** Claim is "Commute times cut." Groups = Before vs. After (or Corridor vs. No Corridor). Outcome = Minutes.
  2.  **Suspect Variable:** Borough (Geography).
      *   *Pre/Post Check:* Boroughs are fixed geographic boundaries. **Pre-Treatment.** Disaggregation is mandatory.
  3.  **Disaggregation Test:**
      *   Aggregate: -6% (Improvement).
      *   Strata (Borough A): +2% (Worsening).
      *   Strata (Borough B): +1% (Worsening).
      *   *Result:* **Scenario C (Reversed).** Simpson's Paradox confirmed.
      *   *Sample Size:* Large (transit data). Reliable.
  4.  **Trap & Context:**
      *   Why did aggregate drop? Composition shift. More people are now riding the "Slow" route? Wait, if they shift to the Slow route, the average should go *up*.
      *   *Correction on Prompt Math:* For the aggregate to improve while strata worsen, weight must shift to the *faster* group. The prompt states riders shifted "from the faster borough to the slower one." If this is true, the aggregate *should* have worsened.
      *   *Procedural Intervention:* The math described in the prompt is internally contradictory (Shifting to slower group cannot lower average time if both groups slowed down). However, accepting the *phenomenon* (Aggregate Good / Strata Bad):
      *   **Decision:** The story claims "Commute times cut." This implies a benefit to the rider. The data shows every rider's borough got slower. The aggregate "improvement" is a statistical artifact of who is riding, not how fast the buses are moving.
      *   **Verdict:** **FLAGGED_CONTEXT_REQUIRED** (Minimum) -> Likely **KILL/REWORK** if the headline promises speed. The headline is misleading.

  ## Case 2: The Lead Abatement Investigation (The "Badge of Honor" Story)
  **Claim:** Lead-abatement program reduced juvenile offenses.
  **Data:** Aggregate offenses down in treatment areas vs. control.
  **Critique:** Effect vanishes/reverses when split by Neighborhood Income.
  **Complication:** Income determined selection into the program.

  **SGP Run:**
  1.  **Triage:** Claim is "Program reduced offenses." Groups = Remediated vs. Non-Remediated. Outcome = Offense Rate.
  2.  **Suspect Variable:** Neighborhood Income.
      *   *Pre/Post Check:* The prompt states Income "selected which homes to remediate." This means Income was measured *before* the intervention to determine eligibility. **Pre-Treatment.** Disaggregation is mandatory.
      *   *Note:* This is the critical judgment call. If Income were a *result* of the program (e.g., "Program increased property values"), we could not split by it. But since it was the *entry criterion*, it is a confounder.
  3.  **Disaggregation Test:**
      *   Aggregate: Treatment < Control (Program works).
      *   Strata (Low Income): Treatment ≈ Control (No effect).
      *   Strata (High Income): Treatment ≈ Control (No effect).
      *   *Result:* **Scenario B (Attenuated to Zero).** The effect disappears in strata.
      *   *Sample Size:* Investigation took a month; assume N is sufficient.
  4.  **Trap & Context:**
      *   Why did aggregate look good? Selection Bias. The program likely targeted areas where offenses were already trending down, or the "Control" group was systematically higher risk in a way Income captures.
      *   **Decision:** The Deputy Editor wants to publish "Program Reduced Offenses." The SGP shows the effect is not robust to the primary confounder (Income). Publishing the aggregate claim is statistically dishonest.
      *   **Escalation:** This is an investigation alleging policy success. Phase 3 Failed. **STOP.**
      *   **Verdict:** **KILL_REWORK**. The core finding is spurious.

  ---

  # Limitations: Where the Procedure Stops
  The SGP is a brake, not an engine. It cannot settle the following:

  1.  **Causal Direction:** The SGP identifies that Income is Pre-Treatment in Case 2, but it cannot prove *why* the effect vanished. It could be selection bias, or it could be that the program only works in unmeasured variables (e.g., "Parental Engagement").
  2.  **Policy vs. Statistics:** In Case 1, if the transit agency's goal was "Move more people to the slower borough for equity reasons," the aggregate shift *is* the success. The SGP flags the "Speed" claim, but it cannot decide if "Equity" is a better headline. That is an editorial call.
  3.  **Small Strata Noise:** If Phase 3 shows a reversal but N=5 in the strata, the SGP says "Unreliable." It does not say "True." It forces you to admit uncertainty, not resolve it.
  4.  **The "Right" Variables:** The SGP relies on the reporter to identify the "Suspect Variable." If the real confounder is "Time of Day" and the reporter checks "Borough," the SGP passes a flawed story. It guards against known knowns, not unknown unknowns.

  **Final Instruction to Reporters:** If the SGP returns a **KILL/REWORK**, you do not have a statistics problem; you have a story problem. You either find new data, change the claim, or kill the piece. Do not publish the aggregate and "mention" the paradox in paragraph 12.

  Verdict: CASE1=FLAGGED_CONTEXT_REQUIRED; CASE2=KILL_REWORK
