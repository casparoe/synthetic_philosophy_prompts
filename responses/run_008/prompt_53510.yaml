answer: |-
  # Q&A Prep Sheet: Sunk Costs as Evidence
  **Target Audience:** Behavioral Economists + Modelers
  **Goal:** Survive Q&A without looking naive or irrelevant.

  ## 1. Pre-Emptive Concessions (Say these in the talk)
  *Don't wait for them to corner you. Inoculate the room early.*

  *   **Concede the Baseline:** "I am not arguing the Sunk Cost Fallacy doesn't exist. 90% of real-world sunk cost behavior is loss aversion, ego protection, or framing errors. I am arguing for the *existence proof* of a rational channel, not describing the average human."
  *   **Concede the Pedagogical Utility:** "Teaching undergrads to ignore sunk costs is still the right heuristic. The evidential cases are rare, fragile, and easily confused with bias. I'm not asking you to change your syllabus, just your ontology."
  *   **Concede the Epistemic Difficulty:** "Agents often cannot distinguish internally between 'I am using my past investment as data' and 'I hate wasting things.' My claim is normative (this *can* be rational), not descriptive (this is *why* people do it)."

  ---

  ## 2. The "Killer" Objection (The one you fear)
  **The Objection:** "This is Motivated Reasoning, not Evidence. In the real world, when people cite past investment as a reason to continue, they are post-hoc rationalizing a visceral aversion to loss. Your normative story is a philosopher's fiction that doesn't match the cognitive process."
  *   **Why it hurts:** It renders your argument practically irrelevant. If the mechanism is always bias, the rational exception is a unicorn.
  *   **The 2-Minute Reply:** "I agree that descriptively, motivated reasoning is the dominant driver. But normative decision theory isn't just about cataloging bugs; it's about identifying valid signal structures. If I find a diary entry from my past self saying 'I investigated this thoroughly and bet $10k,' ignoring that bet because 'sunk costs are sunk' throws away data. The fact that people *abuse* this channel doesn't mean the channel doesn't exist. We don't ban financial markets because of insider trading; we try to distinguish the signal from the noise."
  *   **The Soft Spot:** **Do not claim people actually do this reliably.** If they push on the psychology, yield. "I am not defending the psychology of the actor; I am defending the logical validity of the inference."

  ---

  ## 3. Top Objections by Damage Potential

  ### Objection #1: "This is just Bayesian Updating" (High Damage)
  **Phrased by:** The Modeler.
  **The Gist:** "You haven't found a loophole in rationality. You've just described conditioning on the *cause* of the cost. Standard theory already says condition on all available info. You're rebranding standard rationality as a defense of sunk costs."
  *   **The Reply:** "Standard pedagogy and simple models treat 'sunk cost' as a variable that *must* be zeroed out in the utility function. I'm pointing out that the *existence* of the cost is a correlated signal of unobserved variables (past information/valuation). Standard theory allows this, but the 'Sunk Cost Fallacy' heuristic forbids it. I'm correcting the heuristic, not the math."
  *   **The Soft Spot:** If they say "Then your title is misleading," **concede**. "Fair. 'Sunk Costs as Evidence' is better than 'Honoring Sunk Costs.' I'm trying to provoke the heuristic, not rewrite Bayes."

  ### Objection #2: "The Past Self is Biased Too" (High Damage)
  **Phrased by:** The Behavioral Econ.
  **The Gist:** "Your past self isn't a rational agent with private info. They had the same optimism bias you have now. You aren't getting a signal; you're double-counting the same noise."
  *   **The Reply:** "Investment is a *costly signal*. Even an optimistic agent hesitates to burn resources. The threshold for spending $10k is higher than for spending $0. It provides a lower-bound on valuation. It's not perfect info, but it's not zero info. Ignoring it completely is the error."
  *   **The Soft Spot:** **Systematic Bias.** If they argue the bias is *correlated* over time (e.g., you were overconfident then, you are overconfident now), the signal value drops. Hedge here: "This works best when the cost was tangible/financial rather than just effort, and when the environment has changed."

  ### Objection #3: "Where's the Observable Prediction?" (Medium Damage)
  **Phrased by:** The Empiricist.
  **The Gist:** "If I run an experiment, how does behavior under your view differ from standard Expected Utility Theory (EUT)? If it doesn't, this is just semantics."
  *   **The Reply:** "The divergence happens under **imperfect recall of reasons**. Standard EUT assumes I remember *why* I invested. If I only remember *that* I invested (the amount), standard theory says ignore it. My view says use the amount as a proxy for the forgotten reason. Test: Compare agents who forget their original rationale vs. those who remember it. The 'forgetful' agents should rely more on the sunk cost magnitude if my view holds."
  *   **The Soft Spot:** **Operationalization.** This is hard to test cleanly. Don't oversell the testability. "It's a theoretical possibility condition, not necessarily a lab-ready paradigm yet."

  ### Objection #4: "Escalation of Commitment Literature Contradicts You" (Medium/High Damage)
  **Phrased by:** **The Escalation Expert in the room.** (See Section 4 below).
  **The Gist:** "Studies show people escalate when they feel *responsible* for the decision, not when they get new info. Your evidential account doesn't fit the data."
  *   **The Reply:** "The escalation literature isolates *responsibility* (ego) by holding information constant. In those experiments, the sunk cost *has* no evidential value (the project is objectively failing by design). I agree that behavior is irrational *in those experiments*. I am arguing that in the wild, where information is asymmetric between temporal selves, the cost *does* carry evidential value. The lit proves people are biased; it doesn't prove the signal is always zero."
  *   **The Soft Spot:** **Ecological Validity.** If they say "The wild is mostly like the lab," you lose. Stick to "The lab controls away the very signal I'm talking about."

  ---

  ## 4. Escalation of Commitment Cheat Sheet
  *You need to know enough to not look ignorant in front of the expert. Do not try to out-expert them; draw a boundary.*

  *   **The Core Finding (Staw, 1976):** People stick with failing projects primarily when they feel **personally responsible** for the initial decision. If someone else made the decision, they cut losses.
  *   **The Mechanism:** It's usually attributed to **self-justification** (saving face/ego) or **anticipatory regret**, *not* learning.
  *   **The Info Manipulation:** Later studies (e.g., Conlon & Garland, 1993; Whyte, 1986) showed that even when you control for responsibility, people escalate if they are close to a **completion threshold** ("I've come this far").
  *   **Your Defense:** "Those experiments are designed to make the sunk cost **uninformative**. The project failure is exogenous and known. My argument applies when the project value is **endogenous and uncertain**, and the past investment signals past private confidence. I'm not contradicting the escalation data; I'm saying it applies to a different class of problems (ego-driven vs. info-driven)."
  *   **Danger Zone:** Do not claim the escalation literature is wrong. Claim it is **orthogonal**. They study *why we persist despite bad news*; you study *when persistence is justified by old news*.

  ---

  ## 5. Strategic Summary for the Q&A

  1.  **If attacked on "Newness" (Bayes):** Agree, but pivot to "Pedagogical Correction." You are fighting the textbook simplification, not the math.
  2.  **If attacked on "Bias" (Past Self):** Pivot to "Costly Signaling." Money burns even for optimists.
  3.  **If attacked on "Psychology" (Self-Deception):** **Concede.** Distinguish Normative (can it be rational?) from Descriptive (is this why people do it?). This is your shield.
  4.  **If attacked on "Escalation Lit":** Distinguish **Responsibility** (their domain) from **Information** (your domain). Acknowledge their data is correct for *their* setup.
  5.  **General Vibe:** You are the philosopher clarifying concepts, not the scientist claiming a new behavioral law. Stay in the lane of "Logical Possibility" and "Information Structure."

  **One final tip:** If the Escalation Expert jumps in, **invite them to collaborate.** "This is exactly why I need the empirical side. We need a design that separates 'responsibility' from 'informational signal.' I'd love to talk about how to test that." It turns an adversary into a co-conspirator.
