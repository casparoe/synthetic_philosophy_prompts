answer: |-
  Here is an analysis of your friend's implicit philosophy of theory change, a prediction for the Newton–Einstein case, and a proposal for a decisive test case.

  ### 1. Prediction: The Newton–Einstein Verdict
  **Prediction:** She will rule that General Relativity **truncated** Newtonian Gravitation (the Fresnel analog), rather than refuting it outright (the Phlogiston analog) or treating it as a mere costume change (the Lorentz analog).

  **Reasoning:**
  Her track record suggests she is a **Structural Realist with an Eliminativist constraint**. She discards ontological posits that refer to nothing (phlogiston, caloric fluid, ether substance) *unless* the mathematical structure governing them is preserved in the successor theory.
  *   **Why not "Refutation" (Phlogiston/Caloric)?** In the Phlogiston and Caloric cases, the central entity was deemed non-existent *and* the governing laws (conservation of phlogiston/caloric) were fundamentally incompatible with the new theory (oxidation/thermodynamics). In the Newtonian case, while "gravitational force" is eliminated in favor of curvature, the *mathematical structure* (the inverse-square law, the potential) is recovered exactly in the weak-field, low-velocity limit. The equations don't die; they become a subset.
  *   **Why not "Costume" (Lorentz)?** She reserved the "same theory in two costumes" verdict for Lorentz and Einstein because they were **empirically equivalent**; they made the exact same predictions for all possible experiments of the time, rendering the ether "idle." Newton and Einstein are *not* empirically equivalent (e.g., the perihelion of Mercury, light deflection). Since the theories diverge on predictions, they cannot be the "same theory."
  *   **Why "Truncation" (Fresnel)?** This matches the Fresnel case perfectly. Fresnel posited an ether (false ontology) but derived wave equations (true structure). Maxwell kept the equations but dropped the mechanical ether. Similarly, Newton posited a force (false ontology, in her view) but derived field equations (true structure). Einstein kept the structural limit but replaced the force with geometry.

  ### 2. The Rival Rules
  To understand why this prediction holds, we must disentangle the three competing rules implicit in her history of verdicts.

  | Rule | Criterion | Prediction for Newton $\to$ GR | Closest Analog in her History |
  | :--- | :--- | :--- | :--- |
  | **A. Ontological Fidelity** | Did the main "stuff" (force, fluid, ether) survive? | **Refutation.** Gravity is not a force; it is geometry. The "stuff" is gone. | **Phlogiston $\to$ Oxygen.** (Phlogiston referred to nothing; Force refers to nothing). |
  | **B. Empirical Equivalence** | Do the theories make identical predictions, making the difference merely interpretive? | **Costume.** (Only if she ignores Mercury/light bending). | **Lorentz $\to$ Einstein.** (Same predictions, different metaphysics). |
  | **C. Structural Correspondence** | Does the old mathematics appear as a limiting case of the new mathematics? | **Truncation.** Newton's laws emerge as the $c \to \infty$ / weak-field limit of GR. | **Fresnel $\to$ Maxwell.** (Wave equations survived the loss of the ether). |

  **The Caloric Anomaly:**
  You noted her dismissal of Caloric is the hardest to square. Under **Rule C (Structural Correspondence)**, Carnot's theorem *should* have saved Caloric, just as Fresnel's equations saved the wave theory.
  *   *My Reading:* She likely distinguishes between **instrumental success** and **axiomatic truth**. Carnot's efficiency formula ($\eta = 1 - T_c/T_h$) is correct, but his *derivation* relied on the conservation of caloric (a substance that cannot be created/destroyed). Thermodynamics explicitly violates this (heat can be created from work). She likely views Carnot's success as "compensating errors" rather than structural preservation. In contrast, Fresnel's wave equations did not rely on the *specific material properties* of the ether in a way that contradicted Maxwell; they described the *field behavior* directly.
  *   *Implication:* For her, a theory is "Truncated" only if the *core dynamical laws* survive, not just the final numerical results. Newton's core law ($F=GmM/r^2$) survives as a limit. Caloric's core law (Conservation of Caloric) does not.

  ### 3. The Test Case: Bohr Atom vs. Wave Mechanics
  To separate these rules at dinner, you should propose the transition from the **Bohr Model of the Atom (1913)** to **Modern Quantum Mechanics (Schrödinger/Heisenberg, 1925+)**.

  **The Setup:**
  *   **Bohr:** Electrons are particles in fixed, quantized orbits.
  *   **QM:** Electrons are wavefunctions/probability densities; "orbits" do not exist.
  *   **The Math:** The Bohr model correctly predicts the energy levels of Hydrogen. These energy levels are recovered exactly in the Schrödinger equation.
  *   **The Ontology:** "Orbits" are as non-existent in QM as "Caloric Fluid" is in Thermodynamics.

  **How the Rules Split:**
  *   **If she says "Refutation" (like Caloric):** She is prioritizing **Ontological Fidelity**. She believes that because "orbits" are false, the theory is dead, regardless of the energy levels matching. This would imply she might actually call Newton "Refuted" too (since "force" is false), contradicting my main prediction.
  *   **If she says "Truncation" (like Fresnel/Newton):** She is prioritizing **Structural Correspondence**. The quantization rules (action integrals) and energy spectra survive, even if the visualizable mechanism (orbits) is discarded.
  *   **If she says "Costume" (like Lorentz):** Unlikely, as they differ on uncertainty and trajectories, but if she argues they are just "different representations of the same quantum states," she is prioritizing **Empirical Equivalence** over ontology.

  **Why this works:** It isolates the "Caloric Problem." Like Caloric, the Bohr model got the *numbers* right (spectral lines) using the wrong *stuff* (orbits). If she saves Bohr, she must explain why Carnot wasn't enough to save Caloric. If she sinks Bohr, she risks sinking Newton (where the "force" ontology is also discarded).

  ### 4. Confidence and Uncertainty

  **Confidence Levels:**
  *   **Prediction (Newton = Truncation):** **85% Confident.** The structural continuity between Newton and Einstein is the textbook example of the Correspondence Principle, and she has shown a strong bias toward preserving equations (Fresnel, Lorentz) over entities (Phlogiston, Ether).
  *   **Rule Identification (Structural Realism):** **80% Confident.** Her distinction between Fresnel (saved) and Caloric (dumped) is the only wobble, but the "Conservation Law" distinction explains it well enough to proceed.
  *   **Test Case Efficacy (Bohr vs. QM):** **90% Confident.** This case cleanly forces a choice between "Did the math survive?" and "Did the story survive?"

  **The Claim I Am Least Sure Of:**
  I am least sure of **my explanation for her rejection of Caloric/Carnot** (specifically, that it hinges on the violation of conservation laws vs. structural survival).

  **Why:**
  This is the weakest link in the chain. Standard philosophy of science (e.g., Kuhn, Putnam) often cites Carnot as a prime example of *reference preservation* despite ontological change (caloric "refers" to thermodynamic entropy/energy flow). Your friend's flat dismissal ("won't even allow that Carnot's reasoning... saved anything") is unusually harsh for a philosopher of science.
  *   *Possibility A:* She holds a very strict **Referential Theory** where "caloric" refers to *nothing*, so any sentence containing it is false, rendering the derivation void. (This would threaten the Fresnel verdict, as "ether" also refers to nothing).
  *   *Possibility B:* She distinguishes **Kinematics** (Fresnel's waves, Newton's trajectories) from **Substance Dynamics** (Caloric flow).
  *   *Possibility C:* She is simply inconsistent, or holds a specific grudge against the Caloric metaphor that she doesn't apply to the Ether.

  If she pushes back on the Caloric explanation during dinner, the entire "Structural Realist" reading of her philosophy could collapse into a more idiosyncratic set of heuristics. I recommend you treat the Caloric verdict as the "black box" and focus your questioning on whether **Newton's Force** is more like **Fresnel's Ether** (a vehicle for a real field) or **Caloric** (a non-existent substance). That is the pivot point.
