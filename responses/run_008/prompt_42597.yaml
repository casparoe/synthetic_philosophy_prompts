answer: |-
  **Essay Question: Taurek and the Coin Flip**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  In "Should the Numbers Count?", John Taurek argues that when faced with a choice between saving one person (David) or five others, you ought to flip a coin to give each individual an equal chance of survival. Standard objections claim this ignores expected value, burning lives in expectation. However, some defenders argue the coin flip is not a decision procedure but a dramatization of the absence of a tie-breaking reason once aggregation is rejected.

  Write an essay arguing for one of the following three interpretations of Taurek's coin flip:
  (a) It is a genuine decision procedure that can sometimes be morally required.
  (b) It is a dramatization of the absence of a tiebreaker (reasons running out).
  (c) It is a confusion that conflates equal chances with equal concern.

  You must defend your chosen position against the strongest version of the other two readings. Specifically, address whether the expected value objection (that flipping sacrifices survivors in expectation) succeeds or fails based on your interpretation.

  ***

  **Model Answer**

  Taurek's coin flip is best understood not as a positive decision procedure, but as a dramatization of the absence of a tie-breaking reason (Interpretation B). Reading Taurek as mandating a flip (Interpretation A) exposes him to devastating expected value objections, while reading him as confused (Interpretation C) misses the structural point about the separateness of persons. The coin flip does not solve the dilemma; it marks the limit of justificatory reasons.

  Taurek's core insight is that numbers do not aggregate moral weight. Each person faces the loss of their life, and no single person's loss is outweighed by another's. If we cannot sum harms across persons, the reason to save the five is not weightier than the reason to save the one; it is merely more numerous. Without aggregation, there is no fact of the matter regarding who should be saved. The coin flip acknowledges this moral parity. It is not a mechanism to maximize value, but a procedural acknowledgment that reason has run out. To choose the five directly is to impose a utilitarian calculus that Taurek argues is illegitimate in this context. The flip is not doing moral work; it is revealing that there is no moral work left to be done by reason.

  Proponents of Interpretation A argue Taurek prescribes flipping as a duty to ensure equal chance. This reading is vulnerable to the expected value objection raised by consequentialists: flipping yields three survivors in expectation, while saving the five yields five. If the flip is a decision procedure, it seemingly demands we burn lives to satisfy a fairness constraint. However, if we adopt Interpretation B, the expected value objection misfires. The objection assumes there is a metric (lives saved) that ought to be maximized. Taurek denies this metric exists across persons. The flip isn't sacrificing lives; it is refusing to treat lives as fungible units in a sum. The "loss" of expected survivors is only a loss if aggregation is permitted, which is precisely what is at stake. Under Interpretation B, the agent is not failing to maximize; they are recognizing that maximization is category error.

  Critics favoring Interpretation C argue that equal chances do not demonstrate equal concern. They claim saving the five shows equal concern by respecting each life's value equally, whereas flipping treats lives as lottery tickets. This objection conflates outcome with justification. Equal concern is demonstrated by refusing to subordinate the one to the many without their consent. If aggregation is false, saving the five subordinates David's claim to the group's magnitude. The coin flip respects the distinctness of each claimant. It does not confuse chance with concern; it uses chance to respect the incommensurability of distinct claims. Interpretation C assumes the conclusion that numbers count, rather than engaging with Taurek's rejection of aggregation.

  Ultimately, Interpretation B preserves the integrity of Taurek's non-aggregation principle. Interpretation A reduces Taurek to a rule-utilitarian about chances, vulnerable to math. Interpretation C dismisses the challenge too quickly. The coin flip is a symbolic admission that when persons are separate, numbers alone cannot break the tie. We flip not because it is right to burn lives, but because there is no reason sufficient to save the five that does not violate the one's standing. The flip dramatizes the silence of reason where aggregation is forbidden.

  ***

  **Marking Scheme**

  **1. Thesis Clarity and Position Selection (5 Marks)**
  *   **Criteria:** The essay must explicitly select one of the three interpretations (a, b, or c) in the introduction and maintain that stance throughout.
  *   **B vs. A Note:** A B-grade paper hedges or ambiguously states the position; an A-grade paper commits clearly to one interpretation immediately.

  **2. Reconstruction of Taurek's Non-Aggregation Principle (5 Marks)**
  *   **Criteria:** The student must accurately explain the moral principle underpinning their chosen interpretation, specifically the "separateness of persons" or the illegitimacy of summing harms.
  *   **B vs. A Note:** A B-grade paper summarizes the example; an A-grade paper explains the underlying moral principle (separateness).

  **3. Engagement with the Expected Value Objection (5 Marks)**
  *   **Criteria:** The essay must directly address the argument that flipping sacrifices survivors in expectation and explain why this objection succeeds or fails based on the chosen interpretation.
  *   **B vs. A Note:** A B-grade paper dismisses the math; an A-grade paper explains why the math presupposes aggregation.

  **4. Critique of Alternative Interpretations (5 Marks)**
  *   **Criteria:** The student must charitable reconstruct the strongest version of the two opposing readings before refuting them.
  *   **B vs. A Note:** A B-grade paper attacks strawmen; an A-grade paper steelmans the opposing reading before refuting.

  **5. Argumentative Coherence and Conclusion (5 Marks)**
  *   **Criteria:** The argument must flow logically, culminating in a conclusion that synthesizes the defense rather than merely summarizing points.
  *   **B vs. A Note:** A B-grade paper summarizes points; an A-grade paper synthesizes into a meta-ethical conclusion.
