prompt: |-
  My buddy and I argued until like 2am last night about Taurek's "should the numbers count" thing, and I want to put the exact fight we had onto my students' final. Here's the shape of it: we both agree the naive reading is boring — of course you save the five, whatever. The interesting part is the coin flip. Taurek says flip a coin between David and the five, and if it lands on the five, save all five, so that each person has an equal chance of being rescued. I pressed my friend with the expected-value point: if you flip, the expected number of survivors is three (or 2.5, depending on setup), versus five if you just save the group, so the flip burns lives in expectation, and I don't see how giving each individual an equal shot can be worth two dead people. But then he came back with something I'm still chewing on: he said the coin flip isn't a decision procedure at all — it's a way of showing there's no fact of the matter about what you should do once your reasons run out. The flip dramatizes the absence of a tiebreaker, it doesn't create one. And that made me realize I genuinely don't know which Taurek the standard objections in the literature are even aimed at: the guy who thinks flipping is actually right, or the guy my friend invented who's making a subtler point about reasons running out.

  So: I teach an upper-level ethics seminar, the final is in two weeks, and I want one essay question on whether the numbers should count that a student cannot pass by reciting the example and the standard "each counts for one" replies. The question needs to force them to take a position on whether the coin flip is (a) a genuine decision procedure that can sometimes be the right thing to do, (b) a dramatization of the absence of a tiebreaker, or (c) a confusion that conflates equal chances with equal concern — and defend that position against the strongest version of the other two readings. Ninety minutes in class, 25 marks total.

  Along with the question, give me a model answer of about 600 words and a marking scheme built around five must-hit points, with the marks each one is worth (they should add to 25), and for each point a one-line note on the mistake that keeps a student at a B rather than an A. Begin your response with the exam question itself — no preamble, no setup, no restating any of this — then the model answer, then the marking scheme. American English throughout. And dont go easy on them, they've had a whole semester of this material.
