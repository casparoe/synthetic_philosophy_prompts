answer: |-
  ### The two norms

  The Knowledge Norm of Assertion (KNA), championed by Timothy Williamson, dictates that one must assert $p$ only if one knows $p$. Williamson argues this is a constitutive rule of the speech act. Its primary motivation lies in explaining the impropriety of Moorean paradoxes ("$p$, but I don't know $p$") and the legitimacy of challenges like "How do you know?" KNA successfully rules out asserting lottery propositions, where probability is high but knowledge is absent. Conversely, the Truth Norm (TNA) holds that one must assert $p$ only if $p$ is true. This norm aligns with the intuitive aim of assertion as conveying truth. TNA handles cases where a speaker asserts a falsehood unknowingly; the assertion is improper because it fails its constitutive aim. However, TNA struggles with lucky guesses: if I guess a lottery ticket lost and am right, TNA deems this proper, whereas intuition suggests impropriety due to lack of warrant. KNA captures this impropriety but faces tension with cases where warrant is high but knowledge is arguably absent, such as Gettier cases or specialized technical assertions where individual verification is fundamentally impossible.

  ### The mathematical case

  Mathematical practice presents a stark challenge to individualistic norms. Mathematicians routinely assert theorems they have not personally verified, relying on peer review and expert testimony. The Four-Color Theorem is clearly paradigmatic: its proof involves exhaustive computer checks no single human has surveyed. Consequently, individual mathematicians lack the direct justificatory grip typically required for knowledge, specifically regarding surveyability and understanding of every step. Under a strict individualistic KNA, asserting the theorem is improper, contradicting mathematical norms which treat such assertions as paradigmatically proper. Meanwhile, TNA fails to distinguish between asserting a proven theorem and asserting a true conjecture. If Goldbach's Conjecture is true, TNA permits asserting it now, despite the lack of proof. Mathematical practice deems such assertion premature and irresponsible, regardless of truth value. Thus, KNA seems too restrictive for individual agents, while TNA is too permissive regarding warrant. This suggests the relevant epistemic status might not reside in the individual speaker but in the community's collective warrant, challenging standard epistemological frameworks.

  ### Which norm fares better

  Can KNA absorb this via testimonial knowledge? If knowledge transmits through testimony, the individual mathematician knows the theorem via expert assurance. However, mathematical knowledge often requires understanding, not just true belief via testimony. If understanding is necessary for knowledge, and the computer proof precludes human understanding, KNA fails. Yet, KNA remains quite superior to TNA because it at least addresses the warrant deficiency. TNA is structurally blind to justification; it cannot explain why asserting a true conjecture is improper. KNA can be modified to accommodate the division of epistemic labor. We might argue that the community knows, and individuals assert as representatives of that collective knowledge. This preserves the link between assertion and epistemic authority. Alternatively, we might loosen the knowledge requirement to 'justified belief' while retaining KNA's structure. TNA offers no such resources. It treats the asserted proposition's truth value as the sole criterion, ignoring the epistemic position of the asserter. Therefore, while KNA requires refinement to handle collective warrant, TNA is fundamentally ill-equipped to capture the normative force of proof versus conjecture. KNA's focus on the speaker's epistemic state, even if broadly construed, aligns better with the practice of requiring proof before assertion. The failure is not in the norm itself, but in an atomistic conception of the knower.

  ### My verdict

  KNA is the superior account, provided we reject hyper-individualism. This case refutes an atomistic view of knowledge, not the norm itself. Mathematicians know theorems via testimonial chains anchored in community verification. The Four-Color Theorem is known by the community; individual asserters inherit this status through legitimate reliance on expert structures. TNA must be rejected because it cannot distinguish between lucky truth and warranted assertion, a distinction central to mathematical rigor. We must retain KNA but recognize that 'knowing' in specialized domains is often a distributed cognitive achievement rather than a solitary mental state. The norm holds, but the knower is collective.
