      *   *Nuance:* If they analyze it Bayesianly now, Dana is right that the stopping rule doesn't mathematically break the posterior. But if they report $p < .05$, Marcus is right that it's meaningless.
      *   *Decision:* Marcus comes out slightly ahead because the study was designed and stopped using frequentist criteria ($p < .05$). You can't retroactively apply Bayesian immunity to a frequentist stopping rule without acknowledging the selection bias introduced.

  4.  **Identify What Both Missed:**
      *   They focused on inference (p-values vs. posteriors).
