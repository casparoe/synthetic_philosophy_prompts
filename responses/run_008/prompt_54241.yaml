      *   They missed *sequential analysis methods* (alpha spending functions).
      *   They missed *power/sample size justification*.
      *   *Best point:* Sequential analysis methods exist (e.g., Pocock, O'Brien-Fleming) that allow peeking while controlling error rates. Neither mentioned that you *can* do optional stopping legally in frequentist land if you adjust the threshold. Also, the "winner's curse" (effect size inflation) due to stopping at significance is a huge issue regardless of paradigm. Let's go with the inflation of effect size (Type M error) which happens in *both* frameworks when stopping at significance.

