answer: |-
  You have put your finger on one of the most persistent and vexing problems in bioethics and health economics. The pattern you describe is real, and the tension regarding vaccines is a classic objection to the standard philosophical accounts.

  Here is a reconstruction of the implicit theory, an analysis of its logical gaps, and a look at what would happen if we abandoned it for pure welfarism.

  ### 1. The Implicit Theory: Restoring Normal Species Functioning

  The coverage rules you describe sit most comfortably with the framework developed by the American philosopher Norman Daniels, which builds upon Christopher Boorse's **Biostatistical Theory of Health**.

  **The View of Health and Disease:**
  On this view, health is not merely the absence of suffering, but the absence of **pathology**, defined as a deviation from **normal species functioning**.
  *   **Disease:** A state where an internal mechanism (e.g., serotonin regulation, bone growth, lens accommodation) fails to perform its natural function within the statistically normal range for the species (adjusted for age and sex).
  *   **Therapy:** An intervention that restores the mechanism to that statistical norm.
  *   **Enhancement:** An intervention that pushes functioning *above* the statistical norm.

  **What Fixes "Normal"?**
  It is a hybrid of **statistics** and **evolutionary design**.
  *   *Statistics:* If 95% of adults can hear up to 20kHz, a cochlear implant restoring that is therapy; one allowing hearing up to 50kHz is enhancement.
  *   *Evolutionary Design:* The function of the eye is to see; the function of the immune system is to fight pathogens. "Normal" is what the system was 'designed' by natural selection to do in a typical environment.

  **Why this justifies the NHS/Insurer rules:**
  Daniels argues that health care is special because it protects **fair equality of opportunity**. If you are depressed or blind, your share of the "normal opportunity range" is unfairly restricted by bad luck (nature). Restoring you to normal levels the playing field. Enhancements, however, do not fix an unfair restriction; they give you an advantage over others. In a tax-funded system like the NHS, using public money to give some citizens super-normal advantages is viewed as unjust.

  ### 2. The Vaccine Counterexample

  You are correct that vaccines appear to break this model. A vaccinated person has an immune system that performs *better* against a specific pathogen than an unvaccinated person's baseline. So why are they covered?

  There are two ways the implicit theory swallows this exception without choking:

  1.  **Prevention vs. Enhancement:** The theory distinguishes between *restoring* function and *maintaining* function. Vaccines are classified as **prophylaxis**. They maintain the immune system's capacity to function normally in a pathogen-rich environment. They prevent the *loss* of normal functioning rather than creating *super*-functioning.
  2.  **Public Good Externalities:** This is the stronger pragmatic reason. Antidepressants and growth hormones are **private goods**; the benefit accrues mostly to the patient. Vaccines are **public goods**; they create herd immunity. The coverage rule here isn't tracking therapy/enhancement so much as **contagion risk**. We fund vaccines because your lack of them harms me. We do not fund mood-brighteners for the mildly sad because your sadness does not infect me.

  So, vaccines do not necessarily prove the therapy/enhancement line is nonsense, but they do show that **risk reduction** and **externalities** often trump the philosophical distinction.

  ### 3. Strict Presuppositions vs. Comfortable Fit

  It is crucial to distinguish what these coverage rules *entail* logically versus what theories merely *explain* them.

  **What the rules strictly presuppose:**
  1.  **Scarcity:** Resources are finite; not everything can be funded.
  2.  **A Threshold of Need:** There is a line between "necessary" and "optional."
  3.  **Medical Authority:** The state/insurer accepts the medical profession's definition of pathology as the gatekeeper for that threshold.

  **What merely sits comfortably with the rules (Underdetermination):**
  The "Normal Species Functioning" theory is not the *only* one that licenses these rules. Several rival theories could justify the exact same coverage list:
  *   **The Suffering Principle:** We fund things that alleviate significant distress. Depression causes agony; mild sadness does not. Blindness causes dependency; 20/15 vision does not.
  *   **The Productivity Principle:** We fund things that return people to the workforce. A depressed worker cannot work; a short worker usually can.
  *   **The Social Cost Principle:** We fund things where non-treatment costs more later. Untreated depression leads to job loss and claims; untreated mild sadness does not.

  The coverage rules are **underdetermined** by the philosophy. We cannot look at the NHS formulary and prove they are Danielsians. They could be Utilitarians, Libertarians, or simply Bureaucrats following historical precedent.

  ### 4. The Welfarist Alternative: Wellbeing per Pound

  If we ditched the implicit medical model and adopted an explicit **welfarist rule** (maximise Quality-Adjusted Life Years, or QALYs, per £ spent), coverage would look radically different.

  *   **Mood Brighteners:** If a mild antidepressant cost £10 and reliably moved someone from "content" to "cheerful," generating high utility, a pure welfarist system might fund it. The distinction between clinical depression and "the blues" would blur into a continuum of suffering.
  *   **Laser Eye Surgery:** If laser surgery is cheaper over a lifetime than providing glasses and optician appointments, it would be fully covered, even for people with 20/20 vision who simply want to avoid the hassle of contacts.
  *   **Growth Hormone:** This would depend entirely on data. If being short causes measurable wellbeing loss (bullying, lower wages), and the hormone is cost-effective at remedying it, it would be funded. If not, it wouldn't. The "deficiency" label would become irrelevant.
  *   **Non-Medical Interventions:** This is the big one. A welfarist system might fund **housing improvements**, **gym memberships**, or **holidays** if they produced more wellbeing per pound than chemotherapy for terminal cancer (which often buys very few QALYs at high cost).

  **The Problem:** Pure welfarism is administratively nightmarish. Measuring "wellbeing" is subjective and prone to the **hedonic treadmill** (we adapt to enhancements). The medical model provides a convenient, objective-looking proxy for need, even if it is philosophically leaky.

  ### 5. Is it Cost Control Dressed as Philosophy?

  You suspect the therapy/enhancement line is cost control disguised as ethics. **This is not unfair; it is largely correct.**

  In health economics, this is often called the **"Rule of Rescue"** combined with **budget impact**.
  *   **Legitimacy:** If the NHS said, "We won't fund your growth hormone because we'd rather spend the money on cancer," there would be public outrage. It sounds like rationing. If they say, "We won't fund it because it is an *enhancement*, not *treatment*," it sounds like a principled moral boundary. The philosophy provides **legitimacy** for the rationing.
  *   **The Slippery Slope:** If you fund enhancements, demand becomes potentially infinite. There is no natural ceiling to human improvement. There *is* a natural ceiling to restoring normal function (you stop improving once you hit the species mean). The therapy/enhancement line creates a **fiscal stop-loss**.

  However, calling it *mere* cost control is slightly uncharitable. The distinction also protects the **solidarity** of the system. In a mutual insurance pool (like the NHS), healthy people pay for sick people. Healthy people are generally willing to pay to restore the sick to health. They are less willing to pay to give the healthy super-powers. If the system funds enhancements, the healthy may opt out, collapsing the risk pool.

  ### Summary

  The implicit theory is indeed a version of **restoring normal species functioning** (Daniels/Boorse), where "normal" is fixed by a mix of statistical averages and evolutionary teleology.

  However, the rules do not *strictly* require this theory; they only require a threshold of **priority** based on need. Vaccines fit because they are preventative public goods, not because they restore baseline function.

  If we moved to a strict **welfarist rule**, the medical gatekeepers would lose their power, and funding would flow to whatever intervention (medical or social) bought the most happiness, regardless of whether it fixed a "disease."

  Your suspicion is well-founded: the therapy/enhancement distinction is a **heuristic for rationing**. It is a philosophical fiction that serves an economic necessity. It allows the system to say "no" without appearing cruel. While it may be dressed up as philosophy, in a world of finite resources, some line must be drawn. The current line is arbitrary, but it is perhaps the least worst option for maintaining social consensus on who deserves what.
