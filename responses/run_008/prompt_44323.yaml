          6.  What would coverage look like under an explicit welfarist rule (max wellbeing per £)?
          7.  Address the suspicion: Is the therapy/enhancement line just cost control dressed up as philosophy?
      *   **Constraint:** Answer in British English.

  2.  **Initial Brainstorming & Theoretical Frameworks:**

      *   *Norman Daniels' "Normal Species Functioning":* This is the go-to theory for this distinction. Health care preserves opportunity by keeping people close to normal functioning. Enhancements go beyond that.
      *   *Christopher Boorse's Biostatistical Theory (BST):* Health is statistical normality of function relative to species/age/sex.
      *   *The Vaccine Anomaly:* Vaccines prevent disease. They restore/maintain the *capacity* to function normally in a pathogen-rich environment. They aren't usually seen as "enhancements" in the sense of surpassing species norms, but rather securing the baseline against external threats.
      *   *Cost-Effectiveness (NICE/QALYs):* The NHS explicitly uses QALYs (Quality-Adjusted Life Years). This is welfarist/utilitarian. But they still have exclusion criteria that look deontological (e.g., cosmetic surgery).
