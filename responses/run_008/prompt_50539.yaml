answer: |-
  You are describing **Functional Decision Theory (FDT)**, specifically the concept of **Logical Correlation** (sometimes called *subjunctive dependence* or *superrationality*).

  As a software engineer, you can think of it this way: Causal Decision Theory (CDT) assumes you are a unique instance of a program running on unique hardware, where your output doesn't affect other instances. FDT assumes that if other agents are running the same source code (or sufficiently similar logic) as you, your output *logically determines* theirs, even if there is no causal link between you.

  You aren't asking "What happens if *I* do X?" You are asking "What happens if *an agent running my algorithm* does X?"

  Here is the debug of your cases, the principle that unifies them, and the verdict on your new scenario.

  ### The Principle: Logical Correlation
  **Rule:** You should act as if your decision determines the output of all other agents who are running a sufficiently similar decision algorithm to yours.

  *   **High Correlation:** You and the other agent reason similarly about the problem (e.g., clones, voters, Hofstadter readers). → **Cooperate/Coordinate.**
  *   **Low Correlation:** You and the other agent reason differently or independently (e.g., random stranger, lazy roommate). → **Defect/Optimize Locally.**

  ### Debugging Your Cases

  #### 1. Voting vs. Roommate Dishes
  This is the conflict that feels like a bug, but it's actually a feature of **Reference Classes**.

  *   **Voting:** The people voting are self-selected based on a specific reasoning process: "Civic duty matters," or "My vote might matter." If you run the algorithm `if (impact == 0) { dont_vote }`, and a million other people run that same algorithm, the election outcome changes drastically. You are logically correlated with *other people reasoning about voting*.
  *   **Dishes:** Your roommates are likely not running a logical algorithm about social contracts. They are running `if (tired) { leave_dish }`. Your decision to wash a dish does not logically force their `tired` variable to false. They are not "clones" of your reasoning process regarding hygiene. Therefore, the "if everyone did this" argument fails because *everyone isn't running your code*.

  **Verdict:** Your intuition is correct. Voting is a logical coordination problem; dishes are usually a causal/tragedy-of-the-commons problem where agents are not logically linked. You keep both intuitions.

  #### 2. Prisoner's Dilemma (Stranger vs. Bot)
  *   **Stranger:** No reason to believe they run your code. CDT applies. Defect.
  *   **Bot/Clone:** They run your code. If you output `Cooperate`, they output `Cooperate`. FDT applies. Cooperate.
  *   **Verdict:** Consistent.

  #### 3. Hofstadter's Lottery (1 vs. 5)
  This is the most subtle case. It depends entirely on your model of the **other entrants' source code**.

  *   **Scenario A (Normal):** You assume the readership is full of people reasoning exactly like you (rational, game-theory aware). If you submit 100, you reason: "If I submit 100, others running my algorithm will also realize 100 is optimal and submit 100." The pot dilutes to zero. You must submit 1 to signal to all other instances of "You" to submit 1.
  *   **Scenario B (Low Participation):** You know most people won't enter. Why? Probably because they are irrational, busy, or didn't read the column. They are *not* running your decision algorithm. They are noise. The only people correlated with you are the tiny subset of *other rational entrants*. If that subset is negligible, the logical correlation breaks. You revert to CDT against the noise. Submitting 5 increases your win probability without triggering a "race to the bottom" among rational agents (because there aren't any).
  *   **Verdict:** Your intuition here is surprisingly sophisticated. It correctly identifies that logical correlation only applies to agents *actually running the logic*. If the pool is mostly non-participants, they aren't in your reference class.

  ### The Load-Bearing Check
  You asked which verdicts have to go. **None of them have to go.**

  Your intuitions are actually more consistent than standard CDT. A pure CDTer would tell you not to vote (causal impact is zero) and to defect on the clone (your button press doesn't physically move their hand). You are intuitively an FDT agent, but you are struggling to define the **boundary of the reference class**.

  *   **Voting:** Reference class = "Civic-minded reasoners." (High correlation)
  *   **Dishes:** Reference class = "People in this house." (Low correlation of reasoning)
  *   **Lottery:** Reference class = "Rational entrants." (Variable correlation based on participation data)

  The only risk is **Self-Deception**. It is very easy to convince yourself that roommates *are* reasoning logically when they are just being lazy, or that voters *aren't* reasoning logically when they are. You must be honest about whether the other party is actually running similar code.

  ### The New Case: Anonymous Game, Similar Pool
  **Scenario:** Matched in an anonymous one-shot game against a total stranger, but you know the whole player pool got there the same way and is a lot like you.

  **Prediction:** **Cooperate.**

  **Reasoning:**
  This is the definition of Logical Correlation.
  1.  **Selection Bias:** If you were selected via a specific mechanism (e.g., "top 10% of logic puzzle solvers," or "users of this specific forum"), the probability that your opponent runs a similar decision algorithm is high.
  2.  **Symmetry:** You know they know they were selected the same way. They are running the same analysis you are.
  3.  **The Loop:**
      *   If you decide `Defect`, you predict they (running similar code) will decide `Defect`. Result: (Defect, Defect).
      *   If you decide `Cooperate`, you predict they will decide `Cooperate`. Result: (Cooperate, Cooperate).
      *   Since (Cooperate, Cooperate) > (Defect, Defect), your algorithm should output `Cooperate`.

  This is distinct from the "random stranger" PD because the **selection mechanism creates the logical link**. You aren't causally influencing them, but you are both instantiations of the same "Selected Player" class.

  ### Summary for the Engineer
  *   **The Bug:** You feel inconsistent because you are switching between Causal Decision Theory (physical impact) and Functional Decision Theory (logical impact) without naming the switch.
  *   **The Patch:** Adopt **Functional Decision Theory**.
  *   **The Config:** The variable that toggles your behavior is **`is_correlated(opponent)`**.
      *   If `opponent` is reasoning via the same logic as you (Voters, Clones, Selected Pool): **Cooperate.**
      *   If `opponent` is acting on independent variables (Lazy Roommates, Random Strangers): **Defect/Optimize.**
  *   **The Warning:** Do not overfit. Do not assume correlation where there is none (e.g., assuming your roommate will wash dishes just because you did). That is a hallucination of logical dependence.

  Your gut is working correctly. It's detecting logical isomorphism. Trust it, but verify the source code of the other agents before assuming they match yours.
