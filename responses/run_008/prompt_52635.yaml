answer: |-
  Your verdicts are not a patchwork; they are remarkably consistent. They trace a single, coherent line that has a distinguished pedigree in legal and philosophical theory, most notably in the work of H.L.A. Hart and Tony Honoré (*Causation in the Law*), and more recently in normative accounts of causation (e.g., McGrath, Schaffer).

  Here is the reconstruction of your principle, the cost of maintaining it, and the verdict on your unresolved case.

  ### 1. The Reconstructed Principle: The Normative Expectation Account

  Your verdicts are best explained by the view that **causation by omission is not a purely metaphysical relation, but a normative one.**

  On this account, an omission is a cause of an outcome if and only if:
  1.  **Counterfactual Dependence:** Had the agent acted, the outcome would (likely) not have occurred; **AND**
  2.  **Normative Breach:** The agent was under a specific normative obligation (duty, contract, role, or promise) to perform that action, such that the omission constitutes a deviation from a prescribed standard of conduct.

  This principle distinguishes between *physical capacity* (which the townspeople and the passing physician possess) and *normative responsibility* (which the gardener, nurse, river-keepers, and uncle possess).

  **How it fits your seven verdicts:**

  *   **Cases 1 & 2 (The Gardener vs. The Town):** The gardener has a contractual duty; the townspeople have only general moral capacity. The principle selects the gardener.
  *   **Cases 3 & 4 (The Nurse vs. The Physician):** The nurse has a professional duty of care to *that* patient; the passing physician has only a general beneficence (no specific duty). The principle selects the nurse.
  *   **Case 5 (The River-Keepers):** Both hold the specific assigned responsibility. The normative account handles overdetermination here easily: both breached a duty that was sufficient to prevent the harm. Both are causes.
  *   **Cases 6 & 7 (The Uncle vs. The Neighbour):** This is the crux. A promise (Case 6) creates a *deontic* obligation—a normative tie that did not exist before. A habit (Case 7) creates only a *predictive* expectation. Your resistance in Case 7 confirms that for you, causal status tracks **obligation**, not **expectation**. The neighbour violated a statistical norm, but the uncle violated a normative norm.

  ### 2. The Cost: Which Verdicts Must Be Surrendered?

  You asked which verdicts must be surrendered if there is no single account. Since I have identified an account that fits all seven, the question becomes: **What must be surrendered to make this account metaphysically palatable?**

  The cost of the Normative Expectation Account is that it rejects the Humean idea that causation is solely a matter of "what happens" in the physical world. It admits "ought" into the heart of "is."

  If you are pressured to surrender this account in favor of a **Purely Metaphysical (Counterfactual) Account**, you must surrender the distinction between **Cases 6 and 7** (and consequently 1 and 2).

  *   **If you choose Metaphysical Purity:** You must admit that the neighbour in Case 7 *did* cause the injuries, just as the townspeople in Case 2 *did* cause the plants' death. (Or, conversely, that the gardener in Case 1 did *not* cause the death).
  *   **The Order of Surrender:**
      1.  **First to go:** The distinction between 6 and 7. If causation is purely counterfactual, a promise adds no metaphysical weight to a habit.
      2.  **Second to go:** The distinction between 1 and 2 (and 3 and 4). If the neighbour is a cause, so are the townspeople.
      3.  **Last to go:** Case 5. Overdetermination is tricky for simple counterfactuals, but a sophisticated counterfactual theorist (using "influence" or "NESS") might save Case 5 while sacrificing the duty distinctions.

  However, given your teaching context and your explicit resistance in Case 7, I suspect you are unwilling to surrender the 6/7 distinction. It is the anchor of your intuitions. Therefore, you should not surrender the verdicts; you should embrace the **Normative Account** and defend the claim that omissive causation is inherently sensitive to the normative landscape.

  ### 3. The Unresolved Case: The Swimmer and the Prank Call

  **The Case:** A bystander (Walker) sees a swimmer in difficulty. Another bystander (Caller) appears to be calmly dialing emergency services. Walker walks on. The call is a prank. Swimmer drowns.

  **Applying the Normative Expectation Account:**

  To determine if the Walker's omission caused the death, we must ask: **Did the Walker stand under a specific normative obligation to act?**

  1.  **General Duty?** Like the townspeople in Case 2 and the passing physician in Case 4, the Walker is a bystander with no prior relationship, contract, or role-based duty to the swimmer. In the absence of a "Bad Samaritan" law, there is no legal or strict normative duty to rescue.
  2.  **Reliance?** Unlike the nephew in Case 6, the swimmer did not rely on the Walker (the swimmer likely didn't even see the Walker).
  3.  **The "Caller" Factor:** Does the presence of the Caller create a duty?
      *   If the Caller *had* actually called, the Walker's omission would be irrelevant (the swimmer would live).
      *   Because the Caller *did not* call (prank), the situation reverts to the baseline: a swimmer in trouble and bystanders with no duty.
      *   Does the Walker have a duty to *verify* the Caller's action? Only if the Walker had a prior duty to rescue. If I have no duty to save you, I have no derivative duty to check if someone else is saving you.
  4.  **Comparison to Case 7:** The Walker might have felt a *reasonable expectation* that "someone else is handling it," or the swimmer might have hoped someone would help. But as Case 7 established, reasonable expectation without normative tie (promise/role) is insufficient for causation.

  **The Verdict:**

  On the principled account that fits your seven cases, **the Walker's omission did not cause the drowning.**

  **Reasoning:**
  The Walker is in the same normative position as the townspeople in Case 2. The presence of the prankster does not transfer the duty to the Walker. The cause of the death is the drowning (the natural process), potentially exacerbated by the prankster's *positive action* (the deception), but not by the Walker's omission. The Walker failed to prevent the death, but—like the passing physician in Case 4—did not *cause* it, because the Walker was not the agent normatively charged with the swimmer's safety.

  **A Caveat for the Seminar Room:**
  You may find students resist this because the Walker *could* have saved the swimmer at little cost. This is a moral judgment (blame), not a causal one. Your account successfully disentangles the two: The Walker may be morally blameworthy for walking on (a failure of beneficence), but his omission is not the *cause* of the death (a failure of duty). This distinction preserves the intuition that while we should help, we are not the *authors* of tragedies we merely witness.

  ### Summary for your Syllabus

  *   **Principle:** Causation by omission requires Counterfactual Dependence + Normative Duty.
  *   **Hardest Pair:** 6 vs. 7 (Promise vs. Habit). This confirms the account is normative, not statistical.
  *   **Unresolved Case:** Walker is **not a cause**. (No duty exists).
  *   **Philosophical Stance:** You are teaching a **Normative Restriction Theory**. It is coherent, but it requires admitting that causal selection is partly a function of social and moral expectations, not just physical events.
