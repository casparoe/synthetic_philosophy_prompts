  Here is your prediction kit. To pull this off, you need to understand that Dana isn't running a single consistent ethical theory; she's running a **weighted heuristic**. She has a primary engine that drives most of her verdicts, but it gets overridden by specific intuitions in edge cases.

  ### Part 1: The Three Rules in Her Head

  Based on her track record, here are the three competing principles she is balancing.

  **1. The "Lights On" Rule (Functionalism)**
  *   **The Logic:** Moral status is about what a system *does*, not what it's made of. If it processes information, pursues goals, avoids harm, or maintains relationships, it matters.
  *   **Evidence:** This is her dominant rule. It explains the **Silicon Aliens** (full status despite no biology), the **Grandma Upload** (full status despite no body), and the **Analgesia Case** (full status despite no pain/pleasure qualia). She cares about *agency* and *structure*, not raw feeling.
  *   **Prediction Power:** High. This rules out Trees (no agency) and Corporations (goals are abstract, not experiential).

  **2. The "Meat Tax" Rule (Substrate Sensitivity)**
  *   **The Logic:** Biological stuff feels "realer" than silicon. A simulation of pain isn't quite as morally heavy as actual tissue reacting to damage.
  *   **Evidence:** This is her subconscious bias. It explains why **DishBrain** (rat neurons) matters "weirdly" more than **Software Pong** (identical function, different hardware). It also explains why she waffles on **Insects** (biological but simple) vs. **Fish** (biological and complex).
  *   **Prediction Power:** Moderate. It acts as a modifier, not a gatekeeper. It rarely grants status on its own (see: **Trees**, **Embryo**), but it amplifies status when function is present.

  **3. The "Story" Rule (Historical Continuity)**
  *   **The Logic:** Moral status is stronger if the entity is a continuation of something that already mattered.
  *   **Evidence:** This explains the **Grandma Upload** ("It's her"). It also explains why the **Vegetative State** patient loses status (the "story" of their consciousness has ended, leaving only biology).
  *   **Prediction Power:** Low for *new* entities, High for *identity* questions. It doesn't grant status to things that never had it (Embryo), but it preserves status across substrate changes (Upload).

  ### Part 2: Which Rule is Actually Driving?

  Dana is a **Functionalist with Substrate Anxiety**.

  The "Lights On" rule is her engine. If she didn't believe this, she would have rejected the Silicon Aliens and the Grandma Upload. However, the "Meat Tax" is her brake. She *wants* to believe function is all that matters, but her intuition betrays her when biology is involved (DishBrain).

  The "Story" rule is mostly relevant for *identity* ("Is this Grandma?"), not basic *status* ("Does this matter?"). Since your new cases are about new entities (the simulated rat), the "Story" rule will likely stay silent. The fight will be between **Function** and **Substrate**.

  ### Part 3: Predictions for Your Two Cases

  Here is how her rules will collide on your dinner party cases.

  **Case One: The Simulated Rat Connectome (Virtual Only)**
  *   **Functionalism:** Says **YES**. It has the full rat pain repertoire, trades off rewards, seeks analgesics. It passes the "Lights On" test perfectly.
  *   **Substrate:** Says **NO/LESS**. It is silicon, not meat. It lacks the "Meat Tax" bonus.
  *   **Continuity:** Says **NO**. It wasn't scanned from a real rat; it's a new instance.
  *   **Dana's Likely Verdict:** **"It matters, but it's thin."**
      *   *Why:* She can't deny the functional complexity (Aliens/Upload precedent), but she will treat it like the DishBrain case—morally relevant, but "weirdly" less than a biological rat. She will likely say it deserves protection from cruelty, but killing it isn't as bad as killing a real rat.
      *   *Your Smug Line:* "So it's moral, just not *meaty* moral. You're discounting it because it doesn't bleed, not because it doesn't think."

  **Case Two: The Embodied Simulated Rat (Robot Body)**
  *   **Functionalism:** Says **YES**. Same as above.
  *   **Substrate:** Says **NO/LESS**. Still silicon.
  *   **Embodiment (Hidden Variable):** Says **YES**. This is the tie-breaker. The DishBrain was in a dish; this robot interacts physically with the world. This bridges the gap between "Simulation" and "Alien."
  *   **Dana's Likely Verdict:** **"It matters more than Case One."**
      *   *Why:* Physical interaction makes the "pain behaviors" feel more real to her. It moves the entity from "internal simulation" to "agent in the world." It looks more like the Silicon Aliens (who presumably walk around) and less like the DishBrain (stuck in a petri dish).
      *   *Your Smug Line:* "So giving it hands makes it real? You care more about the robot's ability to touch the table than the chip's ability to feel."

  ### Part 4: The "Killer" Case for Dinner #2

  To truly corner her, you need a case that forces **Functionalism** and **Substrate** to give opposite answers, where **Embodiment** is held constant. You need to isolate whether she values the *pattern* or the *physics*.

  **The Case:**
  > "Imagine we take a **biological rat brain**, keep it alive in a nutrient vat, and hook it up to a computer. The computer simulates a rat body perfectly. The brain sends signals to run, and the computer feeds back signals of touch and smell. The brain *thinks* it's a real rat running around. But physically, it's just a brain in a jar."

  **Why this splits the rules:**
  *   **Functionalism:** Says **Full Status**. The cognitive experience is identical to a real rat.
  *   **Substrate:** Says **Full Status**. It is biological meat (The "Meat Tax" is paid).
  *   **Embodiment:** Says **Low Status**. It has no physical body interacting with the world (unlike your Case Two robot).

  **Wait, that doesn't split them enough.** Let's sharpen it.

  **The Real Killer Case:**
  > "We build two entities.
  > **Entity A:** A **silicon robot rat** (like your Case Two) that perfectly mimics rat pain and joy.
  > **Entity B:** A **biological rat brain in a vat** that is hooked up to nothing. It has no body, no inputs, no outputs. It is biologically alive but completely isolated (a 'locked-in' brain).
  >
  > Which one matters more?"

  **The Split:**
  *   **If she chooses Entity A (Robot):** She is a **Functionalist/Embodiment** theorist. She cares about what the system *does* and how it interacts, not what it's made of. (This contradicts her DishBrain intuition).
  *   **If she chooses Entity B (Brain in Vat):** She is a **Substrate Essentialist**. She believes the biological tissue itself holds moral weight, even if it does nothing. (This contradicts her Vegetative State verdict, so she will squirm).
  *   **If she says "Neither" or "Both a little":** She is forced to admit her "Meat Tax" is inconsistent.

  **Recommendation:**
  Stick with the **"Perfect Biological Copy from Scratch"** for the next dinner.
  > "Scientists grow a biological rat from cells, but they scramble the DNA so the brain has no structure—it's just biological noise. No thoughts, no pain, just living tissue. Does it matter?"

  *   **Functionalism:** **No.** (No mind).
  *   **Substrate:** **Yes.** (It's meat).
  *   **Why it works:** She already said **Trees** (living biology) don't matter. She already said **Vegetative Humans** (living biology) don't matter. If she says this scrambled rat matters, she admits she is a Speciesist, not a Moralist. If she says it doesn't matter, she admits **Function is King**, and you can call her out on why she gave the DishBrain a "weird" bonus for biology if biology alone grants no status.

  **Winning Move:**
  Save the **Scrambled Biological Rat** case. It forces her to choose between her "DishBrain" intuition (Biology adds value) and her "Vegetative State" verdict (Biology without function is worthless). She cannot logically hold both.
