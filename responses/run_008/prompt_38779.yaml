  2.  **Deconstruct the User's Suggested Desiderata:**
      *   *Extensional Adequacy:* Crucial. But "clear cases" are contested. Is "nose + Eiffel Tower" a clear non-case? Universalists say no. Need to distinguish *pre-theoretic* intuition from *theoretical* commitment.
      *   *Non-circularity:* Vital. "Arranged F-wise" is often accused of being circular if 'F' implies a whole. Needs independent specification.
      *   *Semantic Innocence:* High priority for the user's stated purpose (ordinary questions). But many serious theories (Nihilism, Universalism) violate this. Need to rank this carefully.
      *   *Junk/Gunk:* The user thinks this is essential. Many standard theories ignore it. It *should* be on the list for completeness, even if often neglected.
      *   *Vagueness:* Lewis's argument (vagueness in existence is impossible) vs. common sense (borderline cases). This is a major fault line.
      *   *Non-arbitrariness:* The "brute cutoff" problem. Restricted views struggle here.

  3.  **Drafting the Desiderata List (Iterative Process):**
      *   *Item 1: Extensional Fit.* Needs to capture the "common sense" ontology without begging the question.
      *   *Item 2: Non-Circularity/Informative.* The "in virtue of" condition must not presuppose the whole.
      *   *Item 3: Semantic Accommodation.* Can we keep ordinary language literal? (User's "Semantic Innocence").
      *   *Item 4: Precision/Vagueness.* Must composition be sharp?
      *   *Item 5: Non-Arbitrariness.* No brute facts about *where* the line is drawn.
      *   *Item 6: Modal Robness.* (Maybe add this? If composition happens, does it happen necessarily? Sider's argument). Let's stick closer to the user's list first, maybe add Modal Profile if it fits "ordinary questions." Actually, let's keep it tight. The user asked for *their* list evaluated plus gaps.
      *   *Item 7: Junk/Gunk Compatibility.* As requested.

  4.  **Identifying Incompatibilities (The "Hard Part"):**
      *   *Extensional Fit vs. Non-Arbitrariness:* To fit common sense (chairs yes, nose+Tower no), you need a restriction. To avoid arbitrariness, you need a principled line. Principled lines (like "Life") often fail Extensional Fit (what about tables?). Arbitrary lines fail Non-Arbitrariness.
      *   *Semantic Innocence vs. Extensional Fit (for Nihilists/Universalists):* If you want to save common sense ontology, you might have to paraphrase common sense language (Error Theory or Paraphrase).
      *   *Vagueness vs. Precision:* Lewis says existence can't be vague. Common sense says it is. You can't have both.

  5.  **Evaluating the "Prejudices":**
      *   *Extensional Adequacy:* Often smuggles in Moderate Intuitionism. Nihilists deny chairs exist. Universalists deny nose+Tower is a non-case. So this is *not* neutral.
      *   *Semantic Innocence:* Favors Moderates. Nihilists/Universalists usually require paraphrase.
      *   *Non-Arbitrariness:* Favors Universalism/Nihilism (no cutoff) or strong Natural Kind realists. Moderates struggle here.

  6.  **Running the Theories:**
      *   *Nihilism:* Passes Non-Arbitrariness (never happens), Vagueness (sharp). Fails Extensional Fit (no chairs), Semantic Innocence (paraphrase needed).
      *   *Universalism:* Passes Non-Arbitrariness (always happens), Vagueness (sharp). Fails Extensional Fit (too many objects), Semantic Innocence (maybe okay, but ontologically bloated).
      *   *Organicism (Van Inwagen):* Passes Extensional Fit (mostly), Semantic Innocence (mostly). Fails Non-Arbitrariness (Why life? Why not viruses?), Vagueness (When does life begin?).

  7.  **Selecting the "Most Exclusionary" Desideratum:**
      *   It's likely **Non-Arbitrariness** combined with **Extensional Adequacy**. But if I must pick one that kills the most popular "common sense" views, it's **Non-Arbitrariness**. It kills almost all restricted views unless they posit strong metaphysical essences.
      *   Alternatively, **Semantic Innocence** kills Nihilism and Universalism (in their strict forms).
      *   Given the user's goal ("answer ordinary questions"), **Extensional Adequacy** is the primary filter. But **Non-Arbitrariness** is the philosophical killer. Let's argue that **Non-Arbitrariness** is the hardest constraint for the view the user *wants* (a common-sense restricted view).

  8.  **Refining the Output:**
      *   Structure:
          1.  Intro (acknowledging the task).
          2.  The Desiderata List (with "Binding vs. Prejudice" tags).
          3.  The Incompatibility Matrix (The "Flagged Pairs").
          4.  Theory Run-Through (Nihilism, Universalism, Organicism).
          5.  The "Most Exclusionary" Verdict.
      *   Tone Check: Ensure I'm not being evasive about "clear cases." Admit that "nose + Eiffel Tower" is only clear relative to a specific ontology.
      *   Purpose Check: Keep focusing on "how many things in the room."

  9.  **Self-Correction/Nuance during drafting:**
      *   *Correction:* The user asked about Junk/Gunk. I need to make sure I don't dismiss this as merely "formal." If the world is gunky, composition never bottoms out. If junk, nothing is a part of a maximal whole. A theory of composition *should* handle this.
      *   *Correction on Semantic Innocence:* Universalists can claim semantic innocence (the table exists, plus the table-minus-a-leg exists). Nihilists cannot (the table doesn't exist). So Semantic Innocence favors Universalism over Nihilism, but both strain ordinary *counting*.
      *   *Correction on Non-Circularity:* "Arranged chairwise" is the classic example of circularity. I need to explain *why* it's circular (presupposes the concept of a chair).
      *   *Incompatibility:* The big one is **Extensional Adequacy (Common Sense) + Non-Arbitrariness**. You can't have a restricted view that matches common sense *and* has a non-brute cutoff. This is the "Special Composition Question" deadlock.

  10. **Final Polish:** Check against constraints. Did I give the list first? Yes. Did I flag incompatible pairs? Yes. Did I run the three theories? Yes. Did I identify the single most exclusionary desideratum? Yes. Is the tone honest about prejudices? Yes.

  (Proceed to generate response based on these thoughts.)
answer: |-
  Here is the specification list for a theory of special composition, evaluated for binding force versus partisan prejudice, followed by the incompatibility flags and the theory run-down.

  ### The Desiderata List

  **1. Extensional Adequacy (The "Moorean" Constraint)**
  *   **The Requirement:** The theory must validate the existence of ordinary middle-sized dry goods (chairs, tables, people) and deny the existence of arbitrary scattered sums (your nose and the Eiffel Tower).
  *   **The Case:** If a theory tells me there is no chair in front of me, or that there is an object composed of my left shoe and the Moon, it has failed its primary purpose: answering ordinary questions about what exists.
  *   **Binding or Prejudice?** **Prejudice.** This is the biggest smuggled assumption. It assumes "Common Sense Ontology" is the correct benchmark.
      *   *Nihilists* deny chairs exist (so they fail this on purpose).
      *   *Universalists* deny the nose/Tower sum is non-existent (they say it exists, we just don't care about it).
      *   *Verdict:* If your goal is to answer ordinary questions *literally*, this is binding. If your goal is metaphysical truth regardless of ordinary utility, this is a bias toward Moderate Intuitionism.

  **2. Non-Circularity (The "In Virtue Of" Constraint)**
  *   **The Requirement:** The condition under which $xs$ compose $y$ cannot presuppose the existence or nature of $y$.
  *   **The Case:** Saying "$xs$ compose a $y$ iff $xs$ are arranged *chairwise*" is circular if "chairwise" means "in the arrangement that constitutes a chair." The analysis must use vocabulary independent of the composite (e.g., spatial proximity, causal integration, biological life).
  *   **Binding or Prejudice?** **Binding.** A theory of composition is an analysis of the relation. If the analysans contains the analysandum, it is a definition, not an explanation. However, determining what counts as "independent vocabulary" is where fights start (e.g., is "life" independent of "organism"?).

  **3. Semantic Innocence (The "Literalism" Constraint)**
  *   **The Requirement:** Ordinary claims like "The table has four legs" must come out literally true without paraphrase (e.g., without translating to "There are atoms arranged table-wise").
  *   **The Case:** You specified your purpose is answering ordinary questions. If the theory forces you to translate every ordinary sentence into a paraphrase to make it true, it fails the purpose of being a theory *for* ordinary questions.
  *   **Binding or Prejudice?** **Binding (for your stated purpose).** However, in professional metaphysics, this is often sacrificed. Nihilists treat ordinary talk as useful fiction; Universalists treat it as quantifier-restricted. If you demand this, you rule out Nihilism immediately.

  **4. Sharpness (The "Vagueness" Constraint)**
  *   **The Requirement:** The theory must state whether composition is vague or sharp. If sharp, it must explain away the appearance of vagueness. If vague, it must explain how existence can be indeterminate.
  *   **The Case:** As you add planks to a ship, is there a precise plank where the ship begins? Lewis argues existence cannot be vague (a vague fact would be a vague state of the world, which is unintelligible). Common sense says there are borderline cases.
  *   **Binding or Prejudice?** **Binding.** Silence is not an option. However, *which* horn you choose is partisan.
      *   *Lewisians* demand Sharpness (Vagueness is semantic, not ontological).
      *   *Epistemicists* allow Sharpness with ignorance.
      *   *Ontic Vagueness proponents* allow blurry existence.
      *   *Verdict:* The theory must pick a side; staying neutral is incompleteness.

  **5. Non-Arbitrariness (The "Bruteness" Constraint)**
  *   **The Requirement:** If composition is restricted (i.e., not always and not never), there must be a principled reason for the cutoff point that is not brute.
  *   **The Case:** If composition stops at "living things," why not viruses? If it stops at "functional artifacts," why not a random pile of stones that briefly blocks the wind? A cutoff without a metaphysical ground is an occult boundary.
  *   **Binding or Prejudice?** **Binding (Philosophically), Prejudice (Pragmatically).** Universalists and Nihilists love this because they have no cutoffs. Restricted theorists struggle here. Defending a "brute fact" cutoff is generally seen as a theoretical vice, though some (like Humeans about laws) might tolerate it.

  **6. Completeness on Directionality (The "Junk/Gunk" Constraint)**
  *   **The Requirement:** The theory must specify if composition bottoms out (atoms/gunk) and if it tops out (maximal objects/junk).
  *   **The Case:** You noted this is often ignored. But if the world is gunky (everything has proper parts), a theory that presupposes atoms is false. If the world is junk (everything is part of something larger), a theory that presupposes a "world" object is false.
  *   **Binding or Prejudice?** **Binding (for completeness).** Most standard theories (like Van Inwagen's) are silent on this, assuming standard mereology. A robust theory should be compatible with or rule out these topological possibilities explicitly.

  ---

  ### The Incompatibility Flags

  Here are the pairs of desiderata that likely cannot be jointly satisfied. This is the "hard part" you asked for.

  **1. Extensional Adequacy (Common Sense) + Non-Arbitrariness**
  *   **The Conflict:** To match common sense (chairs yes, nose/Tower no), you need a **Restricted** view. To satisfy Non-Arbitrariness, you need a principled cutoff. There is no agreed-upon principled cutoff that matches common sense exactly. "Life" excludes chairs. "Functional unity" includes too many scattered sums. "Consciousness" excludes plants and chairs.
  *   **The Result:** Any theory that matches common sense extensionally will likely fail Non-Arbitrariness (the cutoff looks brute). Any theory that satisfies Non-Arbitrariness (Universalism/Nihilism) will fail Extensional Adequacy.

  **2. Semantic Innocence + Extensional Adequacy (for Nihilists/Universalists)**
  *   **The Conflict:** If you are a Nihilist, you cannot have Semantic Innocence *and* Extensional Adequacy. You must deny chairs exist (fail Adequacy) OR say "chairs exist" means something else (fail Innocence).
  *   **The Result:** You can only have both if you are a Moderate (Restricted Composition) theorist. But see Conflict #1.

  **3. Sharpness + Epistemic Humility**
  *   **The Conflict:** If composition is Sharp (there is a precise number of atoms that make a chair), but we cannot know where the line is, we are forced into Epistemicism. Many find the idea of a "precise but unknowable" ontological boundary metaphysically repugnant.
  *   **The Result:** A theory must choose between "Vagueness is real (ontic)" or "Vagueness is ignorance (epistemic)." You cannot have "Vagueness is real but existence is precise."

  ---

  ### Theory Run-Through

  Here is how the three major camps fare against your spec sheet.

  #### 1. Nihilism (Composition Never Happens)
  *   **Extensional Adequacy:** **FAIL.** There are no chairs, no people, only simples.
  *   **Non-Circularity:** **PASS.** Condition is "never." Hard to be circular.
  *   **Semantic Innocence:** **FAIL.** "The chair exists" is false. Must be paraphrased to "Simples arranged chairwise."
  *   **Sharpness:** **PASS.** It never happens. Perfectly sharp.
  *   **Non-Arbitrariness:** **PASS.** No cutoff means no arbitrary cutoff.
  *   **Junk/Gunk:** **Neutral.** Compatible with gunk (simples have parts) or atoms.
  *   **Verdict:** Metaphysically clean, pragmatically useless for your stated purpose.

  #### 2. Universalism (Composition Always Happens)
  *   **Extensional Adequacy:** **FAIL (Sort of).** It says the nose/Tower object *exists*. It matches common sense on chairs, but wildly violates it on counts (there are infinite objects in the room).
  *   **Non-Circularity:** **PASS.** Condition is "always."
  *   **Semantic Innocence:** **PASS.** "The chair exists" is true. (But "The object composed of my nose and the Tower" is also true).
  *   **Sharpness:** **PASS.** Always happens. Sharp.
  *   **Non-Arbitrariness:** **PASS.** No cutoff.
  *   **Junk/Gunk:** **Compatible.**
  *   **Verdict:** Semantically friendly, ontologically bloated.

  #### 3. Organicism (Van Inwagen: Composition happens only when activity constitutes a life)
  *   **Extensional Adequacy:** **PARTIAL FAIL.** Saves people and cats. Denies chairs, tables, and rocks. (Van Inwagen accepts this; you might not).
  *   **Non-Circularity:** **PASS (Debated).** "Life" is arguably independent of "organism," but defining life without referencing the whole is tricky.
  *   **Semantic Innocence:** **FAIL.** "The table exists" is false.
  *   **Sharpness:** **FAIL.** Life seems to come in borderline cases (viruses, zygotes, brain death).
  *   **Non-Arbitrariness:** **PASS (Claimed).** Life is a natural joint of nature.
  *   **Junk/Gunk:** **Silent.** Usually assumes atoms.
  *   **Verdict:** The best balance of metaphysical rigor and biological reality, but fails the "chair" test.

  ---

  ### The Single Most Exclusionary Desideratum

  If you are looking for a theory that answers ordinary questions ("Is there a chair here?"), the single most exclusionary desideratum is:

  **Extensional Adequacy (Common Sense Ontology)**

  Here is why:
  1.  It immediately kills **Nihilism** (no chairs).
  2.  It effectively kills **Universalism** (too many objects, violating the "how many things" spirit of ordinary questions, even if it admits chairs).
  3.  It forces you into **Restricted Composition**.

  **However,** once you are forced into Restricted Composition, the **Non-Arbitrariness** constraint becomes the killer. It is the philosophical guillotine. Almost no Restricted view can satisfy Extensional Adequacy *and* Non-Arbitrariness simultaneously.

  **The Honest Truth:**
  You cannot have a theory that satisfies **Extensional Adequacy** (chairs yes, nose/Tower no) and **Non-Arbitrariness** (no brute cutoffs).
  *   If you want to answer ordinary questions literally, you must sacrifice Non-Arbitrariness (accept that the line between "heap" and "object" is somewhat brute or context-dependent).
  *   If you want metaphysical purity (No Bruteness), you must sacrifice Ordinary Questions (accept Universalism or Nihilism and paraphrase).

  Given your stated purpose ("good enough to answer ordinary questions"), you should mark **Non-Arbitrariness** as the negotiable constraint. Insisting on it makes it impossible to validate the existence of a chair without validating the existence of a "trair" (tree + chair).
