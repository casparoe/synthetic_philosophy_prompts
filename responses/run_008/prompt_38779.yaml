      *   **Constraint 2:** Be honest about which desiderata are binding vs. prejudices smuggled in by specific camps (Universalism, Nihilism, Organicism).
      *   **Constraint 3:** Flag pairs of desiderata that might be incompatible (the "incompatibility thesis").
      *   **Constraint 4:** Evaluate specific user-suggested items (Extensional adequacy, Non-circularity, Semantic innocence, Junk/Gunk, Vagueness, Non-arbitrariness).
      *   **Constraint 5:** Keep the purpose fixed: answering ordinary existence questions (how many things in the room?), not just formal mereology.
      *   **Constraint 6:** Briefly run Nihilism, Universalism, and one Restricted view (Organicism) against the list.
      *   **Constraint 7:** Identify the single most exclusionary desideratum.
