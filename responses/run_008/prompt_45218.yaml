  4.  **Develop Candidate Rules (Heuristics):**

      *   *Rule A: The Lakatosian (Scientific Research Programme).*
          *   *Theory:* A research programme is "progressive" if it predicts novel facts and solves problems without constant ad hoc patches. It is "degenerating" if it requires constant auxiliary hypotheses (patches) to explain away failures and solves problems it created itself.
          *   *Application:* Look for novel predictions vs. ad hoc fixes.
      *   *Rule B: The Pragmatic Organizational Scaler.*
          *   *Theory:* Approve tech that unblocks organizational scaling or specific, concrete bottlenecks. Reject tech that is "cool" but doesn't solve a current hard constraint.
          *   *Application:* Does this unblock a specific team/org goal like the 2020 microservices did?
      *   *Rule C: The "Don't Create Problems You Solve" (Complexity Budget).*
          *   *Theory:* If the solution introduces more complexity (patches, workarounds) than the problem it solves, kill it. (Similar to 2024 DB).
          *   *Application:* Count the workarounds vs. value.
      *   *Rule D: The "Team Trust" Heuristic.*
          *   *Theory:* Back teams that have delivered strategic value before (Feature Flag team).
          *   *Application:* Same team as Feature Flags = Trust.
      *   *Rule E: The "Demand-Driven" Rule.*
          *   *Theory:* Don't build what isn't requested, unless it anticipates needs like Feature Flags did.
          *   *Application:* Nobody requested this, but Feature Flags weren't requested either. What's the difference?

  5.  **Evaluate Rules against New Proposal:**

      *   *Lakatosian:* The pilot has "bespoke workarounds" for incidents. This sounds like "ad hoc auxiliary hypotheses." The Feature Flag system *anticipated* needs (progressive). This system is *reacting* to incidents with patches (degenerating). **Prediction: REJECT.**
      *   *Pragmatic Scaler:* 2020 Microservices were approved despite pain because they unblocked *regional teams*. Here, "nobody formally requested" cross-service workflows. Two teams hacked it. Is this a bottleneck? Seems weak compared to 2020. **Prediction: REJECT (or defer).**
