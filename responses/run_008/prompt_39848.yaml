prompt: |-
  I'm the strategy director at a mid-sized industrial components firm, and a recurring category of decision has been landing on my desk that I don't think we handle well: irrevocable or near-irrevocable commitments made under time pressure because a counterparty might commit first. Publicly announcing we will exit a market segment before a competitor announces entering it; signing a long exclusivity agreement with a supplier before our rival gets a meeting; announcing a multi-year price guarantee that we cannot honourably withdraw from. The bargaining literature since Schelling tells us the first party to make a genuinely irreversible commitment often captures the surplus; but I've also seen the opposite failure, where two firms race each other into incompatible public commitments and both end up locked into positions they'd each have paid to unwind. In some decision-theory discussions I've come across the term 'commitment races' for roughly this phenomenon: when speed of commitment is itself an advantage, agents are pushed to bind themselves before they've gathered the information or done the deliberation that would have told them not to, and a capability that is an advantage in each individual interaction can be a systematic liability in the long run, because the organisation that can commit fastest is also the organisation that commits wrongly fastest.

  What I want from you is a decision procedure my team can actually run when one of these situations comes up — we face perhaps four to six per year, stakes in the range of a bad quarter to an existential threat, and sometimes we have a week, sometimes forty-eight hours, because the whole point is that the other side may move first. The people running it are smart but have no formal training in decision theory, and anything above a certain size needs board sign-off, so the procedure has to produce an auditable written trace of why we committed or didn't. Please give me: the questions to ask, in order; what counts as a sufficient answer to each; the points at which the procedure terminates in a 'commit', a 'don't commit', or a 'wait'; and the points at which it has to hand the decision to a named human because the question is one of judgement or values rather than fact — I want those points flagged honestly rather than papered over with pseudo-quantification.

  The procedure should make room for the considerations that make commitment races distinctive rather than just risky decisions: whether the other side can actually observe and verify our commitment (a commitment no one believes in isn't one); whether 'irrevocable' really means irrevocable or merely expensive to reverse, and what that difference does to the logic; the value of the information we'd get by waiting, weighed against the risk of losing the first-mover position entirely; the possibility of negotiating a mutual standstill rather than racing; and the portfolio-level worry that winning individual races one at a time can still leave the firm committed into an accumulating pile of bad positions — though be careful to say whether that last consideration belongs inside the procedure or is a reason to have a separate annual review.

  Then run the procedure on three cases, worked through in enough detail that I can see it bite: (a) a competitor is rumoured to be entering one of our smaller segments, and we could pre-empt them by publicly and verifiably announcing our own exit from an adjacent segment as part of a focus strategy we were half-planning anyway; (b) our sole supplier for a key input offers a seven-year exclusivity deal at below-market prices, but they will only keep the offer open for two weeks, and our own engineers tell us there's a decent chance a substitute input becomes viable within three years; and (c) a case where I expect you to show the procedure giving an answer its own user won't like — for instance, a situation where the race logic says commit immediately and the procedure says don't, or vice versa, with the reasoning made explicit. Finally, state plainly what the procedure cannot do: where it will systematically misfire, and what kind of commitment decision it should never be trusted with at all. Please write the whole answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Strategy Director at a mid-sized industrial components firm.
      *   **Problem:** "Commitment Races" (Schelling-style irreversible commitments made under time pressure to pre-empt competitors).
      *   **Risk:** Winning the race but locking into a bad position; or losing the race unnecessarily.
      *   **Requirements:**
          *   A practical decision procedure (questions, order, sufficient answers).
          *   Termination points (Commit, Don't Commit, Wait).
          *   Hand-off points to named humans (judgement/values vs. facts).
          *   Auditable written trace (for Board sign-off).
          *   Specific considerations: Verifiability, True Irrevocability vs. Costly Reversal, Value of Information (VoI) vs. First-Mover Advantage, Mutual Standstill, Portfolio Risk.
          *   Three worked cases (a, b, c).
          *   Limitations statement (where it fails).
          *   Tone/Style: British English, professional, rigorous but accessible to non-decision-theorists.

  2.  **Deconstruct the "Commitment Race" Problem:**

      *   *Core Tension:* Speed vs. Accuracy.
      *   *Schelling Point:* Commitments only work if credible.
      *   *The Trap:* Committing before knowing if the commitment is good.
      *   *The Solution:* A filter that separates *credible* commitments from *rash* ones, and identifies when waiting is actually the dominant strategy despite the pressure.

  3.  **Drafting the Procedure (The "Commitment Race Protocol" - CRP):**

      *   *Structure:* Needs to be linear, step-by-step, with clear gates.
      *   *Step 1: Credibility Check.* If the market doesn't believe it, it's not a commitment. (Schelling).
      *   *Step 2: Reversibility Audit.* Is it truly irrevocable or just expensive? This changes the risk profile.
      *   *Step 3: Value of Information (VoI).* What do we learn by waiting? Is that knowledge worth losing the first-mover spot?
      *   *Step 4: Counterparty Capability.* Can they actually move fast? Or is it a bluff?
      *   *Step 5: Portfolio & Culture.* Does this fit the long-term strategy? (Addressing the "accumulating bad positions" worry).
      *   *Step 6: The Human Hand-off.* Where does the algorithm stop and the Director/Board start?

      *   *Refining the Steps for the User's Constraints:*
          *   Needs to be runnable in 48 hours to a week.
          *   Needs to produce a paper trail.
          *   Needs to flag "Judgement Calls".

      *   *Drafting the Questions:*
          1.  *Observability:* Can they see it? Do they believe it?
          2.  *Reversibility:* What is the exit cost?
          3.  *VoI:* What happens if we wait 48 hours?
          4.  *Opponent:* Are they actually ready to jump?
          5.  *Portfolio:* Does this break the bank if we get it wrong?

      *   *Termination Logic:*
          *   If not credible -> Don't Commit (it's just noise).
          *   If reversible + high VoI -> Wait.
          *   If irreversible + low VoI + high risk -> Don't Commit.
          *   If irreversible + low VoI + high reward -> Commit (with Board approval).

      *   *Human Hand-offs:* Valuation of reputation, risk appetite, ethical boundaries.

  4.  **Developing the Three Cases:**

      *   *Case (a): Pre-emptive Exit.*
          *   Context: Rumoured competitor entry. We exit adjacent segment to signal focus.
          *   Analysis: Is the exit credible? (Selling assets vs. press release). Is it reversible? (Hard to buy back). VoI? (Do we know if competitor is real?).
          *   Outcome: Likely "Wait" or "Don't Commit" unless the exit is cheap. Signalling focus by exiting a *different* segment is weak Schelling signalling.
      *   *Case (b): Supplier Exclusivity.*
          *   Context: 7-year deal, cheap, 2-week window. Substitute possible in 3 years.
          *   Analysis: Irrevocable? (Contract law). VoI? (High - will substitute work?). Risk? (Locked into tech that might be obsolete).
          *   Outcome: Likely "Don't Commit" or "Negotiate Standstill". The risk of obsolescence outweighs the price benefit.
      *   *Case (c): The Unpopular Answer.*
          *   Context: Need a scenario where "Speed" feels right but "Procedure" says No.
          *   Idea: A price war guarantee. "We match any price."
          *   Analysis: Credible? Yes. Reversible? No (reputation). VoI? (Don't know competitor's costs). Portfolio? (Margins destroyed).
          *   Outcome: Procedure says "Don't". Instinct says "Defend Share". This highlights the discipline of the protocol.

  5.  **Addressing Specific Constraints:**

      *   *Portfolio Risk:* The prompt asks if this belongs in the procedure or annual review. *Decision:* It must be in the procedure as a "Kill Switch". One bad bet might be okay; five bad bets kill the firm. The procedure needs a "Cumulative Exposure" check.
      *   *British English:* Ensure spelling (organisation, honour, programme), date formats, and tone (understated, precise).
      *   *Auditable Trace:* The output of the procedure must be a document (The "Commitment Memorandum").

  6.  **Refining the Procedure (Self-Correction during drafting):**

      *   *Critique:* Is it too academic?
      *   *Fix:* Use plain English headers. Add a "Traffic Light" system for the output.
      *   *Critique:* Where exactly does the Board come in?
      *   *Fix:* Any "Commit" recommendation on high-stakes issues triggers Board vote. Any "Don't Commit" on strategic shifts triggers Strategy Director sign-off.
      *   *Critique:* How to handle the "Mutual Standstill"?
      *   *Fix:* Add a specific step for "Cooperation Check". Can we call them?

  7.  **Final Polish:**

      *   Check against the prompt's specific list of requirements (Questions, Sufficient Answers, Termination Points, Human Hand-offs, Limitations).
      *   Ensure the "Commitment Race" theory is applied correctly (Schelling, credibility, binding).
      *   Verify the "Unpopular Answer" case is genuinely counter-intuitive.

  8.  **Writing the Response (incorporating British English):**

      *   *Intro:* Acknowledge the sophistication of the problem.
      *   *The Protocol:* "The Commitment Race Protocol (CRP)".
      *   *The Cases:* Detailed application.
      *   *Limitations:* Honest assessment of failure modes.

      *(Self-Correction on Case C)*: Make sure Case C isn't just "bad math". It needs to be a situation where the *race dynamic* pressures you to move, but the *fundamentals* say stop. A "Match Pricing" guarantee is good, but maybe a "Capacity Expansion" race is better. Let's go with Capacity. Everyone is building factories. We feel we must too. Procedure says: Demand is unproven. Don't build.

      *(Refining the Portfolio Point)*: The prompt asks whether portfolio risk belongs in the procedure or annual review. I will argue it belongs in the procedure as a *constraint*, but the *appetite* is set annually. This distinguishes the rule from the parameter.

      *(Final Review of Tone)*: Ensure it sounds like it's written by a consultant or peer to a Strategy Director, not a textbook. Professional, direct, slightly cautious.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **To:** Strategy Director
  **From:** Strategic Advisory Function
  **Subject:** Protocol for High-Velocity Commitment Decisions (The CRP)

  You have correctly identified the pathology. In game-theoretic terms, you are facing a *commitment race* where the cost of deliberation is the loss of the first-mover advantage, but the cost of error is structural lock-in. The literature (Schelling, Halpern, O'Neill) suggests that rational agents should sometimes tie their own hands, but only if the hands are tied in a direction that is profitable. Tying your hands before checking the compass is how firms sink.

  Below is the **Commitment Race Protocol (CRP)**. It is designed to be executed within 24 to 48 hours. It produces a written artefact (the *Commitment Memorandum*) suitable for Board audit. It distinguishes between factual gates and value judgements, ensuring the latter are escalated to named individuals rather than hidden in spreadsheets.

  ---

  ### Part 1: The Commitment Race Protocol (CRP)

  **Usage:** To be initiated whenever a decision involves a public or contractual binding of the firm, with a window of less than 7 days, driven by the risk of counterparty pre-emption.

  **Output:** A single-page *Commitment Memorandum* signed by the Strategy Director and, where indicated, the CEO or Board Chair.

  #### Phase 1: The Credibility & Observability Gate
  *Purpose: To determine if the action constitutes a genuine Schelling commitment. If the market does not believe it, it is merely noise, and you incur the risk without the strategic benefit.*

  **Q1. Can the counterparty observe this commitment immediately and verify it at low cost?**
  *   **Sufficient Answer:** Yes, if the commitment is public (regulatory filing, press release) or contractual (signed agreement with penalty clauses). No, if it relies on private meetings, verbal assurances, or internal memos that could be leaked as 'trial balloons'.
  *   **Termination:** If **No**, terminate as **DON'T COMMIT**. (You gain no strategic advantage from a threat no one believes).

  **Q2. Is the commitment common knowledge?**
  *   **Sufficient Answer:** Yes, if it is not enough that *they* know, but *they know that you know that they know*. (e.g., A public announcement vs. a private letter).
  *   **Termination:** If **No**, terminate as **DON'T COMMIT**.

  #### Phase 2: The Reversibility Audit
  *Purpose: To distinguish between 'irrevocable' and 'costly to reverse'. This dictates the risk profile.*

  **Q3. What is the explicit financial cost to unwind this position within 12 months?**
  *   **Sufficient Answer:** A specific figure or percentage of EBITDA.
  *   **Hand-off Point:** If the cost exceeds 5% of annual EBITDA, this question requires **CFO Sign-off** on the figure.

  **Q4. What is the reputational cost to unwind?**
  *   **Sufficient Answer:** Qualitative assessment (Low/Medium/High) of market trust degradation.
  *   **Hand-off Point:** This is a **Value Judgement**. The **Strategy Director** must sign this assessment. It cannot be quantified.

  **Q5. Does 'irrevocable' mean legally binding or operationally binding?**
  *   **Sufficient Answer:** Legal = contract law prevents exit. Operational = assets are specialised/capex is sunk.
  *   **Logic:** Operational bindings are often slower to execute, buying you time. Legal bindings are instant.

  #### Phase 3: Value of Information (VoI) vs. First-Mover Advantage
  *Purpose: To calculate if the race is worth running. Often, the 'fear of losing' outweighs the 'value of winning'.*

  **Q6. What specific information would we possess in 7 days that we do not possess now?**
  *   **Sufficient Answer:** e.g., "Competitor's Q3 earnings," "Regulatory ruling on X," "Prototype test results." Vague answers like "More market clarity" are insufficient.
  *   **Hand-off Point:** **Head of Intelligence/Market Research** must validate the VoI claim.

  **Q7. If we wait and the counterparty commits first, what is the specific downside?**
  *   **Sufficient Answer:** e.g., "We lose the exclusive supplier," "We face a price war," "We lose 5% market share."
  *   **Logic:** If the downside of waiting is 'We feel anxious', that is not a strategic cost.

  **Q8. Is the First-Mover Advantage sustainable, or can it be copied?**
  *   **Sufficient Answer:** If the competitor can copy your commitment within 3 months once you make it, the advantage is negligible.
  *   **Termination:** If Advantage is **Low/Copiable** and Reversibility Cost is **High**, terminate as **DON'T COMMIT**.

  #### Phase 4: The Cooperation Check (The Standstill)
  *Purpose: To identify if the race is a Prisoner's Dilemma that can be solved by communication.*

  **Q9. Can we negotiate a mutual delay or information sharing without violating antitrust/competition law?**
  *   **Sufficient Answer:** Legal counsel must confirm.
  *   **Logic:** In many industrial contexts, firms can agree to extend offer windows. If the counterparty refuses a reasonable extension, it signals aggression that may warrant caution.
  *   **Hand-off Point:** **General Counsel** must sign off on any communication with competitors.

  #### Phase 5: Portfolio & Culture Constraint
  *Purpose: To prevent death by a thousand cuts. Winning every race can still bankrupt the firm if the aggregate risk is too high.*

  **Q10. Does this commitment, combined with existing irrevocable commitments, exceed our risk appetite?**
  *   **Sufficient Answer:** Compare total locked-in capex/liabilities against Board-approved Risk Appetite Statement.
  *   **Logic:** This consideration belongs **inside the procedure** as a hard gate. Annual review sets the limit; this procedure checks compliance.
  *   **Termination:** If **Yes (Exceeds Limit)**, terminate as **DON'T COMMIT** (unless Board grants specific waiver).

  #### Phase 6: Final Recommendation & Escalation

  **Decision Matrix:**

  1.  **COMMIT:** Credible + Reversibility Cost Acceptable + VoI Low + First-Mover Advantage High + Portfolio Safe.
      *   *Escalation:* Requires **Board Approval** for stakes > 1 Quarter EBITDA.
  2.  **WAIT:** VoI High + Counterparty cannot punish delay significantly.
      *   *Action:* Prepare commitment but do not execute. Monitor.
  3.  **DON'T COMMIT:** Credibility Low OR Reversibility Cost Too High OR Portfolio Limit Breached.
      *   *Escalation:* Requires **Strategy Director** sign-off. If this overrides a commercial team's desire to commit, a brief 'Dissenting Opinion' log must be attached.

  ---

  ### Part 2: Worked Cases

  Here is how the CRP bites in practice.

  #### Case (a): The Pre-emptive Exit
  *Scenario:* Competitor rumoured to enter Segment X. We consider publicly exiting adjacent Segment Y to signal 'focus' and deter them, assuming we make Segment X too hot for them.
  *Timeframe:* 1 week.

  **CRP Application:**
  1.  **Credibility:** A press release saying we are 'focusing' is cheap talk. To be credible (Q1), we must sell the assets in Segment Y or announce writedowns.
  2.  **Reversibility (Q3/Q4):** Selling assets is legally binding and operationally painful to reverse (High Cost).
  3.  **VoI (Q6):** In 7 days, we could verify if the competitor's entry is real or a bluff. Currently, it is a rumour.
  4.  **First-Mover Advantage (Q8):** If we exit Segment Y, does that actually stop them entering Segment X? Unlikely. They are entering X; we are exiting Y. The linkage is weak.
  5.  **Portfolio (Q10):** Reducing our addressable market permanently.

  **Outcome:** **DON'T COMMIT.**
  **Reasoning:** The signal is not credible unless we take irreversible action (selling assets). The Value of Information (verifying the rumour) is high. The strategic linkage (exiting Y deters entry to X) is weak.
  **Trace:** The Memorandum records that we chose to verify the competitor's intent rather than shrink our footprint based on rumour.

  #### Case (b): The Supplier Exclusivity
  *Scenario:* Sole supplier offers 7-year exclusivity at 20% below market. Offer expires in 2 weeks. Engineers say substitute input viable in 3 years.
  *Timeframe:* 2 weeks.

  **CRP Application:**
  1.  **Credibility:** Contract is legally binding. High Credibility.
  2.  **Reversibility:** 7-year contract. Exit clauses likely involve punitive damages. High Cost.
  3.  **VoI:** High. We need to know if the substitute input works. That data arrives in ~3 years.
  4.  **First-Mover Advantage:** If we don't sign, do they give the deal to a competitor? Possibly. But if the substitute works in 3 years, the 7-year deal becomes a liability in year 4.
  5.  **Cooperation (Q9):** Can we ask for a 3-year deal instead of 7? Or a break clause if tech shifts?

  **Outcome:** **WAIT / NEGOTIATE.**
  **Reasoning:** The CRP flags the mismatch between the commitment length (7 years) and the technology horizon (3 years). The VoI on the substitute is massive.
  **Action:** The procedure dictates we do not sign the 7-year deal. We counter with a 3-year deal or a termination clause linked to technological obsolescence. If they refuse, we **DON'T COMMIT**. The risk of lock-in to obsolete tech outweighs the 20% savings.
  **Trace:** Memorandum highlights the 'Technology Obsolescence Risk' signed off by the CTO.

  #### Case (c): The Unpopular Answer (Capacity Race)
  *Scenario:* Industry demand is booming. Two rivals have announced new factories. Our sales team is screaming that we are losing share because customers fear we can't supply. We can break ground on a new plant in 48 hours to signal capacity security. If we wait 3 months for final demand forecasts, customers may switch to rivals.
  *Timeframe:* 48 hours.
  *Instinct:* **COMMIT.** (Defend share, match rivals).
  *CRP Outcome:* **DON'T COMMIT.**

  **CRP Application:**
  1.  **Credibility:** Breaking ground is highly credible.
  2.  **Reversibility:** Sunk capex. Very High Cost.
  3.  **VoI:** Extremely High. Demand forecasts are currently based on 'boom' sentiment. In 3 months, we will know if orders are real or inventory stuffing.
  4.  **First-Mover Advantage:** If we wait, do we lose the customers? Maybe temporarily. But if the market crashes (cycle downturn), the rivals with new factories will be burdened with debt, and we can buy share cheaply.
  5.  **Portfolio:** We already have high capex exposure.

  **Reasoning:** This is the classic 'Commitment Race' trap. The sales team fears losing the *current* order. The Strategy Director must fear losing the *company* in the downturn. The CRP forces the question: "Is the cost of being wrong (empty factory) higher than the cost of waiting (lost orders)?"
  **Trace:** The Memorandum explicitly records the Sales Director's dissent. The Strategy Director signs the 'Don't Commit' recommendation based on 'Cycle Risk'.
  **Why this is hard:** It feels like surrender. The procedure provides the armour to say "No" to revenue pressure when the structural risk is too high.

  ---

  ### Part 3: Limitations & Failure Modes

  You asked for plain speaking on where this procedure will fail. No decision protocol is immune to context.

  **1. The 'Bluff' Problem**
  The CRP assumes the counterparty is rational and observing. If a competitor is irrational, or if they are making a commitment they cannot honour (a bluff), the CRP may advise caution where aggression would have called their bluff. The procedure cannot detect lies, only verify credibility of *our own* moves.
  *   *Mitigation:* Intelligence gathering (Phase 3, Q6) must be robust.

  **2. The 'Culture Eater' Risk**
  A procedure is only as good as the culture that runs it. If the Board rewards 'decisiveness' over 'accuracy', staff will game the CRP. They will fabricate 'High VoI' answers to justify waiting, or downplay 'Reversibility Costs' to justify acting.
  *   *Mitigation:* The Audit Trail must be reviewed post-mortem. If a 'Don't Commit' decision turns out to be a missed opportunity, was the reasoning sound *at the time*? Judge process, not outcome.

  **3. Existential 'Hail Mary' Scenarios**
  The CRP is designed for a going concern. If the firm is facing insolvency within 6 months, the logic changes. In a survival scenario, high-risk irreversible commitments may be the *only* option.
  *   *Constraint:* The CRP is **not** to be used when the firm is in distress. It is a tool for strategy, not rescue.

  **4. The 'Black Box' Judgement**
  I have flagged Q4 (Reputational Cost) and Q10 (Risk Appetite) as human hand-offs. This is where the procedure is weakest. Humans are prone to overconfidence. The procedure cannot quantify 'reputation'.
  *   *Constraint:* These sections require the most senior sign-off available. Do not delegate reputational assessment to middle management.

  **5. Speed vs. Rigour**
  You noted windows of 48 hours. If the CRP takes 40 hours to complete, it has failed.
  *   *Constraint:* The team must have pre-drafted templates. The data (EBITDA %, Risk Limits) must be readily accessible. If the data gathering takes too long, the procedure defaults to **WAIT** (preserving optionality is the default safe position).

  ### Final Recommendation

  Adopt the CRP as a mandatory governance step for any commitment exceeding £[Threshold] or involving public strategic shifts.

  The value of this document is not that it guarantees the right decision—no procedure can do that in conditions of uncertainty. Its value is that it guarantees a **consistent logic**. It prevents the firm from committing rapidly on Monday and hesitating on Friday due to a change in personnel. It ensures that when we do race, we are racing with our eyes open, and when we stop, we stop for reasons of strategy rather than fear.

  **Approved for Trial:**
  [Your Name]
  Strategy Director
