      *Draft:*
      Your intuition is sharp. The committee practice you describe rests on specific, often hidden, epistemological commitments. I will address your terminology, the Aumannian lens, the conciliationism link, and the ensemble alternative.

      **Terminology Corrections**
      You used "common knowledge" loosely. In formal epistemology, this is not merely shared information. It requires an infinite recursion: I know X, you know X, I know that you know X, ad infinitum. Aumann's theorem also relies on "common priors," meaning agents start with identical probability assignments before receiving private evidence. These are technical conditions, not colloquial ones.

      **Aumann and the Committee Practice**
      The theorem itself is mathematically settled. However, its applicability to human experts is heavily contested. Most epistemologists reject the "common priors" assumption for real agents; scientists bring different theoretical commitments and values to data.

      Your committee practice presupposes an idealized Aumannian world. It operates as if common priors and common knowledge are achievable through deliberation. By demanding consensus, the procedure treats persistent disagreement as a defect—bad faith, fatigue, or poor communication—rather than an inevitable result of differing priors or underdetermined evidence. It assumes the theorem's conditions *ought* to hold for honest experts. Consequently, the practice functions as a machine to conceal disagreement that the theorem's conditions would never eliminate in reality. It pretends common priors are satisfied (or should be) and silently gives up on the descriptive truth that experts are not Bayesian ideal agents. The "one voice" report implies that a single precise probability exists, masking the imprecision inherent in the group's actual epistemic state.

      **Conciliationism vs. Steadfastness**
      In the epistemology of disagreement, "conciliationism" holds that upon discovering peer disagreement, one should significantly adjust one's confidence toward the peer's view. "Steadfastness" permits maintaining one's view.

      The unanimity rule is indeed a form of institutionalized conciliationism. It mandates that members defer to the group until opinions merge. However, it is stronger than philosophical conciliationism, which is usually a norm for individual belief revision. The committee rule is coercive: it forbids steadfastness entirely. A member cannot publicly remain steadfast, even if privately justified. This suggests the committee values social utility (clear policy guidance) over individual epistemic integrity. It assumes convergence tracks truth, a claim that is contested; sometimes, preserving dissent preserves minority evidence that the majority overlooked.

      **The Ensemble Report**
      Your instinct to publish the distribution of opinions is epistemologically defensible. It aligns with the theory of "imprecise probabilities" or "credal sets," where a rational state is represented by a range of probabilities rather than a single number. This approach treats disagreement as data—a signal of uncertainty—rather than noise.

      Is this naive? No. It is often more honest about the state of knowledge. However, the resistance to it is not necessarily epistemic ignorance; it is often pragmatic. Policymakers frequently require binary decisions (regulate/not regulate) rather than probability distributions. A spread of expert opinion transfers the burden of risk assessment from the scientists to the policymakers. The "one voice" norm shields policymakers from having to weigh conflicting expert probabilities themselves.

      **Settled vs. Contested**
      To be scrupulous: Aumann's mathematics are settled. The claim that human experts satisfy his assumptions is contested. The view that consensus committees track truth better than dissenting ensembles is also contested. Some argue consensus suppresses vital outlier information; others argue it filters noise. Your geochemical practice of publishing model spreads is increasingly favored in climate science (e.g., IPCC uncertainty ranges), suggesting your intuition aligns with evolving best practices in high-stakes uncertainty quantification.

      In sum, the committee practice assumes an idealized rationality that humans lack, enforces conciliationism to produce policy utility, and hides epistemic uncertainty that an ensemble approach would reveal. Your instinct to publish the spread rests on a defensible view of expertise as probabilistic rather than authoritarian.

