answer: |-
  This is a classic move by philosophy majors, and honestly, your cousin has done a pretty good job summarizing a debate that has kept professional philosophers awake for forty years. The puzzle you're describing is indeed **Kavka's Toxin Puzzle** (1983), and the argument your cousin is making is essentially applying **David Gauthier's** theory of "constrained maximization" to everyday life.

  Here is the good news: You do not have to accept that your grandma's loyalty is irrational. Your cousin is smart, but he is papering over a massive difference between the Toxin Puzzle and real-life promises.

  To beat him at Christmas, you need to reject **Step 5**.

  Here is the breakdown of why Step 5 is the weak link, what you lose by rejecting it, and exactly how to phrase it at the dinner table.

  ### The Break Point: Step 5 (The False Analogy)

  Your cousin's argument hinges on Step 5: *"That's the exact same structure as the toxin."*

  This is false. The Toxin Puzzle and Promise-Keeping are **not** structurally identical. The Toxin Puzzle is designed to be a "one-off" transaction in a vacuum. Promises exist in a social and psychological web.

  Here are the two specific differences that break the analogy:

  #### 1. Future Costs vs. Past Benefits
  In the Toxin Puzzle, your cousin is right: at noon, the money is already there. If you don't drink, you lose nothing *in that moment*. The transaction is closed.

  In the Promise Case (Danny or Grandma), the transaction is **not** closed at the moment of action.
  *   **Reputation:** If you don't help Danny move, you might lose his trust for *future* favors. That is a **future cost** that exists at the moment you decide whether to lift the box.
  *   **Relationship:** If Grandma leaves Grandpa, she destroys the relationship that still exists *in the present*.
  *   **Self-Concept:** If you break a promise, you become "the kind of person who breaks promises." That psychological cost hits you *at the moment of breaking*, not just afterward.

  **The Counter-Argument:** In the Toxin Puzzle, the cost of *not* drinking is zero. In the Promise Puzzle, the cost of *not* helping is high (guilt, lost trust, damaged relationship). Therefore, at the moment of action (noon or moving day), you **do** have a rational reason to act in the promise case, but not in the toxin case. Step 5 fails because the "payoff structure" isn't the same.

  #### 2. Normative Reasons (Obligations create Reasons)
  This is the heavier philosophical hit. In the Toxin Puzzle, the billionaire's offer gives you a reason to *intend*, but it does not give you a reason to *drink*. There is no moral duty to drink poison.

  In the Promise Case, the act of promising **creates a new reason** that persists until the act is done.
  *   When you promise Danny, you create an obligation.
  *   On moving day, you don't just weigh "boxes vs. no boxes." You weigh "boxes vs. breaking my word."
  *   For most rational people, "keeping my word" has positive value *in the moment*.

  Your cousin is assuming that the only "reasons" that count are external rewards (money, rides to tournaments). He is ignoring **internal reasons** (integrity, love, duty). If you count integrity as a "benefit" that you gain *at the moment of acting*, then Step 2 and Step 5 are both wrong. You *do* gain something by drinking (in the promise case): you maintain your integrity.

  ### What do you lose by rejecting Step 5?

  If you tell your cousin, "Step 5 is wrong because promises have future social costs and the Toxin Puzzle doesn't," here is the trade-off:

  *   **What you save:** You save common-sense morality. Your grandma is rational. Promises are rational. You don't have to view yourself as a hypocrite for intending to do things you might not "feel like" doing in the moment.
  *   **What you concede:** You have to admit that the Toxin Puzzle is a **special case**. You concede that if a promise were truly isolated (e.g., "I promise a stranger I'll meet them in a field tomorrow, and I will never see them again, and I feel no guilt about lying"), then yes, keeping *that* promise is irrational by standard economic models.
  *   **The Cost:** You have to accept that "Rationality" isn't just about cold, hard material gain. It includes social capital and psychological integrity. If your cousin is a hard-core "Economic Man" theorist, he might hate this. But it's the only way to make sense of human life.

  ### Alternative: Attacking Step 1 (Resolute Choice)
  If you want to be more aggressive, you can attack **Step 1**.
  *   **The Argument:** Some philosophers (like Edward McClennen) argue for **Resolute Choice**. This says a rational agent *can* intend to do something tomorrow even if they won't want to do it tomorrow, provided they have a reason *today* to bind themselves.
  *   **The Move:** You say, "Rationality includes the ability to make binding commitments. If I can't bind my future self, I'm not rational, I'm just a slave to my passing moods."
  *   **The Risk:** This is harder to defend. It requires arguing that it's rational to act against your own immediate self-interest in the future. It might get too technical for Thanksgiving. Stick to attacking Step 5.

  ### Your Christmas Cheat Sheet

  Here is how to handle the conversation without getting bogged down in jargon:

  1.  **Validate him first:** "Okay, the Toxin Puzzle is cool. I agree that in that specific, weird, one-off scenario, you can't intend to drink the poison. Step 1 through 3 work for the billionaire."
  2.  **Drop the hammer on Step 5:** "But Step 5 is where you lose me. The Toxin Puzzle is a vacuum. Promises aren't."
  3.  **Use the 'Future Cost' argument:** "If I don't help Danny move, I lose his trust for the next ten years. That's a future cost. If I don't drink the toxin, I lose nothing. So at the moment of action, I *do* have a reason to help Danny, but I *don't* have a reason to drink. They aren't the same."
  4.  **Use the 'Grandma' argument:** "You said Grandma couldn't rationally intend to stay with Grandpa. But she loves him. That love provides a reason *in the moment* to stay. The Toxin guy doesn't love the poison. You're ignoring that internal reasons count as rational reasons."
  5.  **The Closing Line:** "You're defining 'rational' as 'sociopath.' If rationality means you can't keep promises when it gets hard, then rationality is broken, not my grandma."

  ### Summary
  *   **Reject:** Step 5 (The claim that the cases are identical).
  *   **Keep:** Step 1 (Intention requires a reason at the time of action).
  *   **Why:** Because in promise cases, there *are* reasons at the time of action (reputation, guilt, love, integrity), whereas in the Toxin case, there are not.
  *   **Result:** You save morality without having to prove you'd actually drink the poison.

  Good luck. And maybe hide the poison.
