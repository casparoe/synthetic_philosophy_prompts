      *   (2) The Dilemma Setup: How is the aspiration level set? (A) Rational trade-off (cost/benefit of search) OR (B) Not by trade-off.
      *   (3) Horn A: If by trade-off -> It's utility maximization (net of deliberation costs). Satisficing = Maximizing in disguise. No normative difference.
