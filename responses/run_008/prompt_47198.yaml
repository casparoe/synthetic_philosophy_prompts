          *   *Horn 2 (Empty/Arbitrary):* Address the mechanism of aspiration adjustment. It's not arbitrary; it's anchored in experience/environment (Ecological Rationality).
      *   *Pinpointing the Error:* Focus on **Step (2)** and **Step (3)**. The false dichotomy. The assumption that "rational trade-off" *must* mean "global optimization."
      *   *The "Cost" of Rejection:* What do we give up? We give up the idea that rationality is *only* about consistency of preferences (axiomatic rationality). We accept procedural norms.
      *   *Advice for the Paper:* How to salvage the normative claim without falling into the trap.

