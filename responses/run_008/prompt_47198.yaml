      *   **Recommendation:** Reframe the paper around the *regress problem* and *ecological fit*.

  8.  **Tone Check:** Ensure it sounds like a colleague/expert. Use terms like "regress problem," "procedural vs. substantive," "ecological rationality," "optimization under constraints." Be direct but helpful. (Self-correction: Don't be too harsh on the advisor, but acknowledge the tension).

