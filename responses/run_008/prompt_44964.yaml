answer: |-
  You have independently rediscovered two of the most persistent and debated problems in the philosophy of science. Your spectroscopic intuition regarding the "construction" of the model versus the "matching" of the model is precisely where the philosophical rubber meets the road. Because you are looking for established terminology, I can save you the trouble of coining new terms for the core concepts, though I will refine their definitions to match the specific nuances you raised, particularly regarding the "knew generally but didn't use" wrinkle.

  ### The First Puzzle: The Problem of Old Evidence

  Your first puzzle has a very well-established name: **The Problem of Old Evidence**. It was famously formalized by Clark Glymour in 1980, though the tension was noted by Keynes and others earlier.

  **What it is:** This is the formal conflict between standard Bayesian conditionalization and the historical reality of science. In strict Bayesianism, if evidence $E$ is already known, its probability $P(E)$ is 1. Consequently, the probability of $E$ given a new theory $T$, $P(E|T)$, is also 1. Since confirmation is defined as the ratio $P(E|T) / P(E)$, the result is 1, meaning no confirmation occurs. Yet, as you note with Mercury, old evidence *does* feel confirmatory.

  **What it is not:** It is not a claim that scientists are irrational. It is a demonstration that the simple formula "confirmation is probability raising" is insufficient for historical cases.

  **Where the edges lie:** The boundary of this problem is strictly about the *epistemic status* of the evidence at the time the theory is evaluated. It does not matter how the theory was built; it only matters that the evidence was already certain. Solutions to this problem usually involve "counterfactual" reasoning (what would our confidence be if we *didn't* know $E$?) or treating the confirmation as coming from learning the *logical connection* between $T$ and $E$, rather than learning $E$ itself.

  ### The Second Puzzle: Use-Novelty

  Your second puzzle is also established, most commonly referred to as **Use-Novelty** (or the **Novelty Requirement**). This is often discussed under the broader header of "Prediction vs. Accommodation."

  **What it is:** Use-Novelty is the principle that evidence confirms a hypothesis more strongly if the hypothesis was constructed without using that specific evidence as a constraint or input. It distinguishes between *temporal novelty* (the evidence was discovered after the theory) and *use novelty* (the evidence was not used to build the theory, even if known).

  **What it is not:** It is not merely about "surprise." As you noted with your lab colleagues, you can know a seasonal artifact exists (no surprise) but still gain confidence if a model derived for noise reasons reproduces it (use-novelty). It is also distinct from simple "fit"; both the ad-hoc model and the noise model fit the data equally well.

  **Where the edges lie:** This is where your "wrinkle" fits. The boundary is not whether the scientists *knew of the phenomenon*, but whether the specific data points were *active constraints* during the model's derivation. If your noise modelers knew a seasonal drift existed but did not tune parameters to minimize the residual of that drift, the data remains "use-novel." If the correction modelers explicitly minimized the error against that drift, it is not use-novel.

  ### One Phenomenon or Two?

  These are **two phenomena**, though they frequently overlap in historical cases like General Relativity.

  1.  **Old Evidence** is about the *time/knowledge state*: "Did we know this fact before the theory arrived?"
  2.  **Use-Novelty** is about the *methodological independence*: "Did we use this fact to build the theory?"

  In the Mercury case, both are at play, but they do different work. The "Old Evidence" problem is the logical puzzle of how $P(E)=1$ allows for confirmation. The "Use-Novelty" aspect is why we trust Einstein more than a theorist who simply added a fudge factor to Newtonian mechanics to match the 43 arcseconds. Einstein's theory was *old-evidence confirmatory* (it matched known data) but also *use-novel* (he did not tune the field equations to get 43; the 43 fell out of the constants). Your spectroscopic example isolates Use-Novelty because the data was old in both cases, but the *construction method* differed.

  ### Confusables and Boundaries

  You correctly sensed that "overfitting" and "ad hoc" were close but not quite right.
  *   **Overfitting** is a statistical property regarding noise vs. signal; Use-Novelty is an epistemic property regarding derivation.
  *   **Ad Hocness** implies a defensive modification to save a theory; Use-Novelty applies even to brand new theories that simply happen to accommodate old data without being designed for it.
  *   **Hindsight Bias** is a psychological feeling of inevitability; Use-Novelty is a logical feature of the theory-evidence relationship.

  Regarding your wrinkle (knew rough magnitude but not value): This falls squarely within Use-Novelty. Knowing the *type* of artifact exists is background knowledge; fitting the *specific magnitude* is the constraint. If the model lands on the specific magnitude without tuning, it is use-novel.

