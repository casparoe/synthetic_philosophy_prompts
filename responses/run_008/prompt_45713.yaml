      *   *Mechanism:* Self-Supervised Learning (SSL) $\rightarrow$ Reinforcement Learning from Human Feedback (RLHF).
      *   *Structure:* Base Model (pre-trained) $\rightarrow$ Aligned Model (fine-tuned).
      *   *Signal Source (Stage 1):* Internal consistency (next token prediction). No external agent. No "actions" in the world, just text completion.
      *   *Signal Source (Stage 2):* Human preferences (comparative). Reward Model approximates human judgment.
