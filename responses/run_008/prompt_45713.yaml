      *Refining the "Cultural Transmission" point:* Turing says the machine is spared evolutionary search by undergoing cultural transmission. In LLMs, the *data* is the result of cultural evolution, but the *learning* is not transmission in the sense of a teacher guiding a child. It's compression. I should highlight this distinction.

