prompt: |-
  Bit of an odd one. I'm a novelist, so my native vocabulary is drafts, revisions, the published text, what I meant when I wrote a scene versus what the scene actually says on the page — and I've had enough rows about authorial intention in my own field to know how these fights go. Restate the textualism vs purposivism debate in legal interpretation in that vocabulary, as faithfully as you can manage. A rough sketch so you know what I'm after: a statute is the published book, the legislature is the author, textualism is 'the book is the book, I don't care what your notebooks said', purposivism is 'you can't understand the scene without knowing what I was trying to do with it'. But don't let my sketch do the work — do the real translation, including the awkward corners. Is consulting legislative history like letting readers see my early drafts (which most novelists think is cheating)? Is the canon about reading a statute consistently with the rest of the code anything like keeping a character's voice consistent across a series, or is that a stretch? Then the residue report: what translates cleanly, what gets distorted to fit, and what in the legal debate has no counterpart in fiction at all — and whether that residue points at something the lawyers are actually disagreeing about or just at the fact that statutes don't get revised the way novels do. One thing I really need: keep what's settled among people who actually know this stuff separate from what's genuinely contested, and don't hand me some scholar's hobbyhorse dressed up as consensus — I've no way of telling the difference myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist.
      *   **Task:** Restate the legal debate between *textualism* and *purposivism* (statutory interpretation) using the vocabulary of fiction writing (drafts, revisions, published text, authorial intention, etc.).
      *   **Constraints:**
          *   Don't just use the user's rough sketch; do the "real translation," including awkward corners.
          *   Address specific analogies: Legislative history vs. early drafts; Consistency within the code vs. character voice consistency.
          *   Include a "Residue Report": What translates cleanly, what gets distorted, what has no counterpart in fiction (and why).
          *   **Crucial:** Distinguish between settled consensus among legal experts and genuinely contested issues. Avoid presenting a specific scholar's hobbyhorse as consensus.
      *   **Tone:** Professional, insightful, respectful of both fields, nuanced.

  2.  **Deconstruct the Legal Concepts:**
      *   **Textualism:** The text is the law. Focus on ordinary meaning at the time of enactment. Legislative history is secondary or irrelevant. The "objective" meaning matters, not the subjective intent.
      *   **Purposivism:** The goal is to effectuate the purpose of the statute. Look at the "mischief" the law was meant to cure. Legislative history is a valid tool to find that purpose.
      *   **Legislative History:** Committee reports, floor debates, drafts, hearings.
      *   **Canons of Construction:** Rules like *nosci tur a sociis* (words known by their associates), consistency within the code, presumption against absurdity.
      *   **The "Dead Hand" Problem:** Laws stay on the books; authors (legislators) die or leave office.
      *   **Multiplicity of Authors:** A statute isn't written by one person; it's a compromise among hundreds.

  3.  **Deconstruct the Fiction Analogies:**
      *   **Published Text:** The final novel.
      *   **Drafts/Notebooks:** Early versions, cut scenes, author's notes.
      *   **Authorial Intent:** What the writer *meant* vs. what the reader *reads*.
      *   **Character Voice/Consistency:** Internal coherence of the world.
      *   **Editor/Publisher:** The filtering mechanism (somewhat like the legislative process, but not quite).
      *   **Reader:** The judge/citizen.

  4.  **Drafting the Translation (Iterative Process):**

      *   *The Statute as the Published Book:* This is the core. Both sides agree the published text is binding.
      *   *Textualism:* "The book is the book." If I wrote "bank," I meant the river bank, even if my diary says I was thinking of money. The reader's understanding of the word *now* (or at publication) matters.
      *   *Purposivism:* "Why did I write this scene?" If a scene feels clunky but serves the theme, a purposivist saves it. If a word seems wrong but defeats the theme, they might adjust the reading.
      *   *Legislative History vs. Drafts:* This is the tricky part. In fiction, showing drafts is usually "cheating" or "paratext." In law, textualists hate it (it's not the law); purposists love it (it shows intent). *Correction:* In fiction, readers *can* look at drafts, but critics usually say "Death of the Author." Textualists align with "Death of the Author." Purposists align with "Authorial Intent."
      *   *Consistency (Canons):* Keeping a character's voice consistent is a good analogy for *in pari materia* (reading statutes together). If a character uses "shall" to mean "must" in Chapter 1, they shouldn't use it to mean "maybe" in Chapter 5.
      *   *The "Many Authors" Problem:* This is the big divergence. A novel usually has one voice (or a unified editorial vision). A statute is a Frankenstein's monster of compromises. This needs to be highlighted in the Residue Report.

  5.  **Addressing the "Settled vs. Contested" Constraint:**
      *   *Settled:* Everyone agrees the text is primary. No one argues you can ignore the words entirely. Everyone agrees context matters (syntax, grammar).
      *   *Contested:* How much weight to give legislative history? What counts as "absurd"? Is there a single "purpose"?
      *   *Avoid Hobbyhorses:* Don't claim "New Textualism" is the only way. Don't claim "Dynamic Interpretation" is standard. Stick to the core Textualism vs. Purposivism/Intentionalism divide.

  6.  **Developing the Residue Report:**
      *   *Clean Translation:* Text vs. Intent. The authority of the final draft.
      *   *Distorted:* The "Author." In law, the "author" is a collective body that no longer exists in the same form. In fiction, the author is a person.
      *   *No Counterpart:* The coercive power of the state. A misread novel hurts feelings; a misread statute puts people in jail. Also, the "Dead Hand" issue (statutes persist for centuries; novels are usually read contemporaneously or as classics, but laws *must* be applied).
      *   *Revision:* Novels get revised in new editions. Statutes usually don't (they get amended, which is different).

  7.  **Refining the Tone:**
      *   Ensure I'm not talking down to the novelist. They know about intentionality.
      *   Ensure I'm not oversimplifying the law. Acknowledge the "New Textualism" (Scalia/Gorsuch) vs. "Old Textualism."
      *   Make sure the distinction between *Intent* (subjective) and *Purpose* (objective goal) is clear, as legal scholars distinguish them.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I call legislative history "drafts"? *Correction:* It's more like marginalia, editor letters, and cut scenes combined.
      *   *Check:* Did I imply judges can rewrite statutes? *Correction:* Must emphasize judges *interpret*, they don't *amend*. Even purposivists claim they are finding the meaning, not changing it.
      *   *Check:* Is the "many authors" point clear? This is the biggest friction point. A novel is a unity; a statute is a treaty.
      *   *Check:* Am I distinguishing settled law? Yes, emphasize that *text* is king for everyone, the fight is about *when* the text fails.

  9.  **Final Polish:** Organize into clear sections: The Translation, The Specific Analogies, The Residue Report. (Proceed to generate output based on these thoughts.)

  *(Self-Correction on "Settled vs. Contested"):* I need to be careful. Even "text is primary" is contested in extreme purposivism (though rare now). Better to say: "All sides start with the text." The real fight is what you do when the text is ambiguous. I need to make sure I don't present Textualism as the "correct" view, but as one side of a live debate.

  *(Refining the "Drafts" analogy):* Legislative history isn't just drafts. It's committee reports (like an editor's note), floor speeches (like an author interview), and rejected amendments (like cut scenes). Textualists reject all of it. Purposists use it.

  *(Refining the "Consistency" analogy):* In fiction, inconsistency can be a flaw or a feature (unreliable narrator). In law, inconsistency is usually a bug (unless it's a specific exception). This is a nuance to capture.

  *(Final check on constraints):* "Keep what's settled... separate from what's genuinely contested." I will add a specific section or clearly mark this distinction.

  Let's write.
answer: |-
  Here is the translation of the legal debate into your native vocabulary, followed by the residue report on where the analogy holds and where it breaks.

  ### The Translation: Statutes as Published Novels

  **The Object:**
  In law, the **Statute** is the **Published Novel**. It is the only thing that has the force of law, just as the published text is the only thing that constitutes the work of art available to the public.

  **The Authors:**
  The **Legislature** is the **Author**. However, there is a critical distortion here you must hold in your head: The Legislature is not a single person. It is a committee of 535 co-authors who hate each other, writing by compromise. They vote on the text, but they often vote on *different reasons* for the same text.

  **The Debate:**

  **1. Textualism ("The Book Is The Book")**
  The Textualist judge approaches the statute like a strict literary critic who subscribes to the "Death of the Author."
  *   **The Core Tenet:** The meaning of the statute is fixed at the moment of publication (enactment). It is determined by how an ordinary reader (or a skilled lawyer) would understand the words *at that time*, according to the standard conventions of grammar and syntax.
  *   **On Ambiguity:** If a sentence in Chapter 4 is ambiguous, you do not call the author to ask what they meant. You look at the context of the surrounding paragraphs. If the words say "vehicle," and a bicycle fits the ordinary definition of "vehicle," then the bicycle is included, even if the author secretly thought "motorized transport."
  *   **On Legislative History (The Drafts):** Textualists view consulting legislative history (committee reports, floor debates, rejected amendments) as **cheating**. It is akin to a critic reading the author's diary or early drafts to override the published text. To a Textualist, if the intent wasn't successfully encoded into the final manuscript, it doesn't exist. The "law" is the ink on the page, not the ghost in the machine.
  *   **The "Absurdity" Clause:** Textualists will generally accept a reading that leads to a foolish outcome if the text demands it. They argue it is not their job to fix the author's mistakes; that is the job of a new edition (amendment).

  **2. Purposivism ("The Scene's Function")**
  The Purposivist judge approaches the statute like a developmental editor or a biographer.
  *   **The Core Tenet:** The text is the primary evidence, but it is not the *only* evidence. The goal is to effectuate the **Purpose** of the work. What "mischief" was this statute written to cure? What thematic problem was the author trying to solve?
  *   **On Ambiguity:** If the text is ambiguous, or if a literal reading defeats the obvious theme of the book, the Purposivist adjusts the interpretation to align with the Purpose. If the text says "vehicle" but the chapter is clearly about "highway safety," a Purposivist might exclude bicycles if they don't threaten highway safety, arguing the author *couldn't have meant* to include them.
  *   **On Legislative History (The Drafts):** Purposists view legislative history as **marginalia and editor correspondence**. It is legitimate to look at committee reports (which function like an author's preface or editor's notes) to understand the goal of the scene. They argue you cannot understand the scene without knowing what the author was trying to do with it.
  *   **The "Absurdity" Clause:** Purposists assume the author is rational. They will reject a literal reading if it leads to an "absurd" result that contradicts the overall purpose of the book.

  ***

  ### Specific Analogies You Requested

  **1. Legislative History vs. Early Drafts**
  *   **The Analogy:** Is consulting legislative history like letting readers see your early drafts?
  *   **The Verdict:** Yes, but with a caveat. In fiction, most writers agree that showing drafts is "cheating" because the final text is the only thing that matters (The New Criticism stance). Textualists agree with this.
  *   **The Nuance:** Legislative history isn't just drafts; it's often *rejected* drafts. Imagine you cut a scene where the hero dies. A Purposivist might say, "The fact you cut the death scene shows us the book is meant to be optimistic." A Textualist says, "The scene isn't in the book. It doesn't exist. Stop talking about it."
  *   **The Friction:** In fiction, the author is alive to say, "Ignore the drafts, read the book." In law, the "author" (the Congress that passed the law) is gone. The current Congress cannot speak for the past Congress. This makes the "drafts" more tempting to lawyers because they can't ask the author directly.

  **2. Consistency (Canons of Construction) vs. Character Voice**
  *   **The Analogy:** Is reading a statute consistently with the rest of the code like keeping a character's voice consistent across a series?
  *   **The Verdict:** It is a strong analogy, but fiction allows for more artistic license.
  *   **The Nuance:** In law, there is a canon called *in pari materia* (on the same subject). If you use the word "shall" to mean "mandatory" in Book 1 of the Code, you are presumed to mean "mandatory" in Book 2.
  *   **The Distortion:** In fiction, if you change a character's voice, it might be growth, or it might be an unreliable narrator. In law, inconsistency is presumed to be an error, not a feature. Lawyers fight fiercely over whether a word means the same thing in two different statutes. Textualists push hard for consistency (a word means the same thing everywhere); Purposists allow the meaning to shift if the *purpose* of the specific chapter requires it.

  ***

  ### The Residue Report

  Here is what translates cleanly, what distorts, and what has no counterpart in fiction.

  **1. What Translates Cleanly**
  *   **The Primacy of the Text:** Everyone in law agrees the published text is the starting point. Just as you cannot critique a scene that isn't on the page, a judge cannot enforce a law that wasn't passed. This is settled.
  *   **Context Matters:** Everyone agrees you read a sentence in the context of the paragraph (the statute) and the book (the Code). No one reads words in isolation. This is settled.
  *   **The "Death of the Author":** The Textualist position maps perfectly onto the post-structuralist literary view that the author's subjective intent is irrelevant once the text is public.

  **2. What Gets Distorted to Fit**
  *   **The "Author":** In fiction, the author is a human consciousness. In law, the "author" is a institutional process. A statute is often a **treaty between enemies**, not a unified vision.
      *   *Why it matters:* A Purposivist asks, "What was the purpose?" A Textualist replies, "There was no single purpose. Half the votes were for X, half for Y, they compromised on Z." In fiction, if you write a clunky sentence to satisfy an editor, it's still *your* book. In law, the "clunky sentence" might be the only thing 51% of the authors agreed to. This makes "Purpose" much harder to find in law than in fiction.
  *   **Revision:** Novels get revised in new editions. Statutes almost never do; they get **amended**.
      *   *Why it matters:* An amendment is like someone else coming in and rewriting Chapter 3 of your book ten years later, while leaving Chapter 1 alone. The "voice" of the code is a cacophony of different eras. Textualists hate this because it makes "original meaning" hard to pin down; Purposists use it to argue the law must "evolve" like a series.

  **3. What Has No Counterpart in Fiction (The Critical Residue)**
  *   **Coercion:** If a reader misunderstands your novel, they write a bad review. If a judge misunderstands a statute, the state puts someone in prison or seizes their property.
      *   *The Impact:* This raises the stakes of "fair notice." Textualists argue that citizens can only read the published book, not the legislative drafts. Therefore, relying on drafts violates the citizen's right to know the rules. This is a political/moral claim that has no equivalent in literary criticism.
  *   **The Dead Hand:** Novels are usually read by contemporaries or as historical artifacts. Statutes are **operating instructions for the present** written by the dead.
      *   *The Impact:* A statute from 1964 must apply to the internet in 2024. A novelist never has to ask, "How does my 1964 dialogue apply to texting?" Lawyers do. This creates a fight Textualists call "Originalism" (meaning is fixed at enactment) vs. "Living Constitutionalism/Statutory Evolution" (meaning updates with technology). In fiction, we just call this "period pieces."
  *   **The "Absurdity" Threshold:** In fiction, an absurd ending can be brilliant (Kafka, Vonnegut). In law, an absurd result is evidence of a drafting error.
      *   *The Impact:* Purposists use "absurdity" to override text. Textualists warn that "absurdity" is just a code word for "I don't like this policy." This is the hottest part of the contested zone.

  ***

  ### Settled Consensus vs. Genuine Contention

  You asked to separate what experts agree on from what they fight about. Here is the map:

  **Settled Consensus (The Boring Stuff)**
  *   **Text is King:** No serious judge argues they can ignore the text entirely to pursue a "vibe." If the text says "Tuesday," you cannot rule it means "Friday" without a very strong reason.
  *   **Grammar Matters:** Everyone agrees syntax and grammar define the boundaries of meaning.
  *   **Judges Don't Legislate:** Everyone agrees (in theory) that if the text is clear but bad, the judge must apply it, and the Legislature must fix it. The fight is only about whether the text *is* clear.

  **Genuinely Contested (The Fight)**
  *   **When is the Text "Clear"?** Textualists believe text is clear more often. Purposists believe ambiguity is more common because language is slippery.
  *   **The Hierarchy of Tools:** If the text is ambiguous, what do you look at next?
      *   *Textualists:* Context within the code, dictionary definitions from the time of enactment.
      *   *Purposists:* Legislative history, the "spirit" of the law, contemporary policy needs.
  *   **The "Absurdity" Escape Hatch:** How bad does the result have to be before a judge is allowed to twist the words to avoid it? Textualists set this bar very high (only if the law is impossible to follow). Purposists set it lower (if the law defeats its own goal).
  *   **The "One Word, One Meaning" Rule:** Textualists prefer a word to mean the same thing across the whole code. Purposists allow the word to change meaning if the context/subject changes.

  **A Note on "Hobbyhorses"**
  Be wary of any lawyer who tells you "Textualism won." It didn't. The Supreme Court swings back and forth. Be also wary of anyone who says "Legislative History is dead." It isn't; judges still read it, they just claim they are using it only to confirm what the text already said. The debate is alive, active, and determines the outcome of major cases.

  ### Summary for the Novelist
  The legal debate is essentially the **Intentional Fallacy** debate from literary theory, but with guns.
  *   **Textualists** are the New Critics: The text stands alone.
  *   **Purposivists** are the Biographers: You need the author's life (history) to understand the art.
  *   **The Twist:** The "Author" is a headless hydra, the "Book" never goes out of print, and if you misread it, the government takes your house.
