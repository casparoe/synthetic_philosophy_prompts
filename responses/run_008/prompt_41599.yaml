      *   **User's Internal Conflict:** Novels train them to side with Member 2, but they distrust this "training" (fear of bias/romanticism).
      *   **Core Question:** Can the board *reason* its way to a decision (not just feel)? Does the answer change if the beneficiaries increase (hundreds -> thousands), and if so, *what* changed?

  2.  **Deconstruct the Ethical Frameworks:**
