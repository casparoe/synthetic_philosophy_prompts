      *   **Rights/Duty Ethics (Member 2):** Certain rights (livelihood, property usage) are inviolable. Cannot use people merely as means to an end (Kant). The organ harvesting analogy highlights the "separateness of persons."
      *   **Virtue Ethics (User's concern):** What kind of organization are we? What kind of story are we living? The user's distrust of their "novelist training" suggests a fear of romanticizing the rural over the urban, or the individual over the collective.

