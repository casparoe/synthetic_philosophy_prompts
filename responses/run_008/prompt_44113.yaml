  Your friend is correct that Curry's paradox forces a choice, but wrong that the only escape is trivialism or abandoning the Truth Schema. Curry's paradox demonstrates that you cannot simultaneously hold three things: (1) the unrestricted Truth Schema, (2) Modus Ponens, and (3) Conditional Proof. Since the dialetheist project is defined by keeping the Truth Schema (to handle the Liar) and you have ruled out sacrificing Modus Ponens (which is necessary for the conditional to be useful for detachment), the logical casualty must be Conditional Proof. This means that even if you can assume $A$ and derive $B$, you cannot automatically conclude "If $A$ then $B$" for the specific conditional used in the Truth Schema.

  Your suspicion that the conditional is "doing work twice" is precisely correct and identifies the structural rule known as Contraction. In step (3), the assumption "C is true" is used once to activate the Truth Schema (yielding "If C is true, then p") and a second time to detach $p$ via Modus Ponens within the sub-proof. In standard classical logic, using an assumption twice is harmless, but in the relevant logics often adopted by dialetheists to block Curry, this contraction of assumptions is invalid. By restricting Conditional Proof, the logic prevents the discharge of the assumption in step (3) from yielding a true conditional, thereby breaking the chain at step (4) where C's truth is re-established.

  Regarding the cost, your friend's claim that everyone is in the same boat is largely accurate, though the prices differ. The classical logician pays by restricting the Truth Schema (Tarski's hierarchy), which limits the expressiveness of the language and forbids a universal truth predicate. The dialetheist pays by restricting the logic (giving up Conditional Proof or Contraction), which complicates the behavior of the conditional and diverges from ordinary reasoning patterns. Neither repair is strictly "cheaper"; it is a trade-off between semantic expressiveness and logical simplicity. The dialetheist argues that preserving the universality of truth is worth the cost of a non-classical conditional, whereas the classical logician argues that standard logic is sacrosanct and truth must be stratified. Curry's paradox does not refute dialetheism, but it proves that dialetheism cannot be a "free lunch" that keeps all ordinary reasoning intact; it requires a sophisticated paraconsistent logic that sacrifices Conditional Proof to save the Truth Schema from triviality.
