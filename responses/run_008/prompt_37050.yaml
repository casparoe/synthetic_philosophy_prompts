  1. "The practice, restated"
  Your newsroom corrects factual errors (numbers, names) but refuses to correct accurate reports of false claims. Attribution in the body hedges ownership ("researchers say"), while headlines assert flat facts ("Drug cuts deaths"). Balance allocates space equally to consensus and fringe, treating assertion as platforming rather than endorsement. Anonymity hides sources, transferring epistemic burden to the institution. The byline promises accuracy about speech, not truth about the world. Thus, the institution asserts facts about statements in the body, but facts about reality in headlines, creating a split between reporting speech and asserting truth. This bundle treats the newspaper as a mirror of speech in the text, but a declarer of fact in the marketing, leaving the reader to navigate the gap between what was said and what is so.

  2. "The norms on the table"
  The Truth Norm dictates asserting $p$ only if $p$ is true. It permits lucky guesses but forbids false justified beliefs, focusing solely on the world-state. The Knowledge Norm (Williamson) requires asserting $p$ only if you know $p$. This excludes true assertions based on luck or insufficient evidence, demanding a stronger epistemic position involving justification and truth. The Reasonable-to-Believe Norm (Lackey) allows asserting $p$ if it is reasonable to believe based on available evidence. This permits false assertions if the evidence was misleading, distinguishing proper assertion from successful truth-telling. Truth focuses on outcome; Knowledge on state; Reasonableness on process. Each defines "proper assertion" differently regarding error: Truth forbids all falsehoods; Knowledge forbids unknown truths; Reasonableness forgives honest errors made under epistemic pressure, which is crucial for fields like developing science. Under Truth, a journalist is wrong if the drug fails, even if the study was perfect. Under Knowledge, they are wrong if they haven't verified the study's methodology themselves. Under Reasonableness, they are proper if they relied on peer review, even if the study is later retracted. This distinction matters for liability and trust.

  3. "What each practice presupposes"
  Corrections presuppose the Truth Norm for internal data (sample sizes) but exclude it for external claims, tolerating false content if accurately attributed. This suggests the paper asserts facts about its own production, not the world. Attribution evades the Knowledge Norm; reporters assert only that sources spoke, not that claims are known true, though headlines later contradict this evasion. It functions as a shield against the Knowledge Norm, allowing reporting without knowing. Headlines presuppose the Truth or Knowledge Norm, asserting flat realities the body disclaims, excluding the hedging required by Reasonable-to-Believe. They claim knowledge the reporters lack. Balance presupposes a "Fairness Norm" unrelated to truth, treating conflicting assertions as equal regardless of evidentiary support, effectively excluding the Truth Norm from editorial judgment. It prioritizes procedural equity over epistemic weight. Anonymity requires the Reasonable-to-Believe Norm; readers cannot verify sources, so they must trust the journalist's assessment of credibility. It excludes the Knowledge Norm for the reader, who cannot know the source exists, let alone the claim. Collectively, the practices toggle between norms depending on the section of the page, creating a fragmented epistemic policy. For corrections, Truth is required for numbers, excluded for claims. For attribution, Knowledge is excluded, Transmission tolerated. For headlines, Reasonableness is excluded, Truth required. For balance, Truth is excluded, Fairness required. For anonymity, Knowledge is excluded, Reasonableness required. This selective application allows the newsroom to avoid the strictures of any single norm.

  4. "The clashes"
  The clashes are systemic. Headlines assert knowledge the body explicitly disclaims via attribution, creating institutional schizophrenia. Balance treats false claims as epistemically equivalent to true ones, violating both Truth and Knowledge norms. Anonymity asks readers to accept assertions without verification, relying on trust rather than knowledge. Can this be saved? Perhaps as a division of labor: Reporters operate under Reasonable-to-Believe (gathering evidence), while Editors operate under Attention (selling stories). But this makes the institution incoherent; the headline contradicts the report. The "Transmission Norm" (we only assert claims were made) is the body's rule, but the headline violates it. The practice is not a unified theory of assertion but a pragmatic compromise between accuracy, liability, and engagement. It functions not as a coherent epistemic stance, but as a risk management strategy that distributes liability across different norms depending on the potential for backlash. If sued, they hide behind attribution (Transmission). If criticized for confusion, they point to accuracy (Truth). If criticized for silence, they point to balance (Fairness). This flexibility is functional but philosophically unstable. It is a patchwork, not a policy.

  5. "If we took that norm seriously"
  If the newsroom adopted the Reasonable-to-Believe Norm, headlines would match body hedging ("Drug *may* cut deaths" or "Study suggests reduction"). Corrections would address misleading implications, not just factual errors, acknowledging that accurate reports of false claims can still mislead readers about reality. Balance would be weighted by evidentiary strength, not column inches, refusing to platform fringe views without counter-evidence. Anonymity would require explicit justification of the source's credibility within the text, explaining why the claim is reasonable despite the hidden source. The institution would assert only what it has sufficiently vetted, accepting liability for false but reasonable claims while distinguishing them from negligent falsehoods. This aligns assertion with evidentiary support rather than mere transcription or click-driven certainty, fostering trust through transparency about uncertainty. Readers would understand the difference between a finding and a fact, reducing cynicism when science evolves.

  6. "Verdict"
  The practice presupposes a fragmented norm: Truth for facts, Transmission for claims, and Marketing for headlines. It is incoherent. The right norm is Reasonable-to-Believe, aligning institutional assertion with evidentiary support rather than mere transcription or click-driven certainty. This protects readers from misleading accuracy while preserving the ability to report on unfolding science. It demands more honesty from headlines but offers more protection for honest error.
