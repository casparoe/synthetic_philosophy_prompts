answer: |-
  **Title:** Archival Silences and the Ordinary Pupil: A Case Study of [School Name], 1870–1970

  **Research Question:**
  "To what extent do distinct categories of archival silence (non-creation, destruction, neglect) differently distort the historical record of ordinary pupils at [School Name], 1870–1970?"

  **Rationale:**
  The cliché "history is written by winners" treats archival bias as monolithic. This project argues silences are epistemically distinct. A record never created (e.g., no reports for non-prize winners) implies systemic exclusion; a destroyed record (e.g., expelled pupils' files) implies active erasure; an unindexed box implies bureaucratic neglect. Each requires different historical methodology. Treating them identically obscures the mechanism of forgetting. By distinguishing them, I demonstrate that "absence of evidence" is not always "evidence of absence."

  **Methodology:**
  Quantitative and qualitative analysis of primary sources. I will create a database of 500 pupils from admission registers (1870–1970). I will cross-reference these names against prize lists, punishment books, and magazines. Pupils appearing only in registers will be classified as "archivally silent." I will then investigate specific cases of silence: checking destruction logs for expelled pupils (active erasure) versus unindexed boxes (neglect). Finally, I will compare institutional silence against my family's private archive to see if "ordinary" lives were preserved domestically even when institutionally discarded.

  **Timeline:**
  *   **Month 1:** Literature review (Trouillot, *Silencing the Past*) + Archive audit.
  *   **Month 2:** Data collection: Sample 5 specific years (1870, 1890, 1910, 1930, 1950). Record names in registers vs. mentions in disciplinary/prize records.
  *   **Month 3:** Categorize missing data: Is the name absent from all records (non-creation)? Or mentioned then missing (destruction/loss)?
  *   **Month 4:** Compare with family archive. Analyze why private letters survived where school records didn't.
  *   **Month 5:** Write-up (5000 words).
  *   **Month 6:** Edit, format, prepare presentation.

  **Failure Criteria:**
  The project fails if the admission registers are too incomplete to establish a baseline of "ordinary" pupils, or if the distinction between "neglect" and "destruction" proves impossible to evidence without speculation.

  **Contested Assumption:**
  I assume admission registers represent a complete census of "ordinary" pupils. **I must check with my supervisor:** if these registers were themselves selectively kept (e.g., only fee-paying students), my baseline for silence is flawed, and the project's central comparison collapses.
