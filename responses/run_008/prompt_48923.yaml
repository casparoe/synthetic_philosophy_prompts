      *   **Tension 3: Anthropics (3) + MWI (1).**
          *   *The Conflict:* The "Measure Problem." In MWI, "probability" is tricky. If I'm a Thirder in Sleeping Beauty, I treat self-location as probabilistic. In MWI, self-location is about which branch. If I use SIA (Self-Indication Assumption), I favor hypotheses with more observers. MWI has *many* branches. Does this inflate the measure of MWI worlds?
          *   *Analysis:* Standard Everettian anthropics usually tries to recover the Born Rule. If the user is a Thirder, they likely accept self-locating uncertainty. This meshes okay with MWI *if* they accept that branch weights = probabilities.
          *   *Severity:* **Medium.** Requires careful handling of the Born Rule derivation.

      *   **Tension 4: Identity (4) + No QI (2).**
          *   *The Conflict:* If I am a pattern, and the pattern continues in Branch A (alive) but not Branch B (dead), and both branches are real (1), then "I" continue in Branch A. Why am I scared?
