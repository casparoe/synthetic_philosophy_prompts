          *   *Analysis:* Most FDT proponents (like Yudkowsky/Soares) explicitly reject Pascal's Mugging by imposing complexity priors (Solomonoff) or bounding utility functions. So (5) and (6) are compatible *if* (6) is justified by priors, not by rejecting EU maximization itself.
