  # JOINT STATEMENT ON DECARBONIZATION PATHWAYS FOR INDUSTRIALIZED ECONOMIES

  **Date:** October 26, 2023
  **Signatories:** The Market-Oriented Climate Economics Working Group & The Post-Growth Policy Alliance
  **Subject:** Framework for Adversarial Collaboration on National Decarbonization Strategy (2025–2050)

  Following a series of structured dialogues, we acknowledge that while our strategic prescriptions for decarbonizing the economy differ fundamentally, we share a common diagnosis of the physical crisis and several constraints on policy design. This document records our areas of convergence, catalogues our substantive divergences in our respective terminologies, and identifies the empirical cruxes that must be resolved to determine the optimal path forward.

  ### I. AREAS OF AGREEMENT

  We jointly affirm the following claims as the baseline for further debate:

  1.  **Physical Constraints:** The remaining global carbon budget consistent with a 50% probability of limiting warming to 1.5°C is approximately 500 gigatonnes of CO₂ from 2020 onwards. Wealthy industrialized nations, having contributed disproportionately to historical emissions, must reach net-negative emissions well before 2050 to allow for equitable development in the Global South.
  2.  **Policy Failure to Date:** Existing emissions trading systems (ETS) and carbon taxes have generally failed to deliver reductions at the required pace. This is due to prices being set too low to alter capital stock turnover, the prevalence of exempted sectors, and the lack of credible commitment mechanisms that prevent policy rollback.
  3.  **Technological Limits:** While low-carbon technology is necessary, reliance on future negative-emission technologies (BECCS, DAC) to offset current over-emission constitutes a moral hazard. Decarbonization must prioritize absolute emissions reductions in the real economy over offsetting.
  4.  **Distributional Imperative:** Climate policy that exacerbates inequality is politically unsustainable. Any viable strategy must address the cost-of-living impacts on low-income households and ensure that the burdens of transition do not fall disproportionately on workers in carbon-intensive industries.
  5.  **Political Economy of Durability:** Policies must be robust against lobbying and regulatory capture. Mechanisms that generate broad public support (such as dividends or visible service improvements) are superior to opaque regulatory tweaks. Both parties agree that the current growth-dependent fiscal model creates pressure to delay climate action to protect short-term tax revenues.

  ### II. TABLE OF SUBSTANTIVE DISAGREEMENTS

  The following table outlines our irreconcilable differences regarding the mechanism and macroeconomic context of the transition. Each row presents the same underlying dispute, phrased as each party would assert it.

  | Topic | Market-Oriented Climate Economist (MOCE) | Degrowth Advocate (CDA) |
  | :--- | :--- | :--- |
  | **1. Decoupling Speed** | **Absolute decoupling of emissions from GDP is feasible at the required speed.**<br>With a carbon price rising to $200/t and targeted R&D subsidies, innovation will reduce the carbon intensity of GDP faster than GDP grows, allowing emissions to fall to net-zero while living standards continue to rise. | **Absolute decoupling at the required speed is historically unprecedented and physically unlikely.**<br>Efficiency gains are consistently outpaced by rebound effects and scale expansion. Relying on decoupling risks missing carbon budgets; throughput must be capped directly regardless of GDP impact. |
  | **2. Price vs. Quantity** | **Price signals are superior to physical caps for allocation.**<br>A rising carbon fee with dividend recycling discovers the lowest-cost abatement opportunities dynamically. Hard caps on resource use create rigidities, black markets, and stifle the innovation needed to substitute scarce materials. | **Physical caps are necessary to enforce planetary boundaries.**<br>Price mechanisms allow the wealthy to purchase the right to pollute, maintaining aggregate throughput. Only statutory limits on energy and material extraction guarantee that ecological ceilings are not breached. |
  | **3. Welfare & Contraction** | **GDP contraction threatens the welfare state and political consent.**<br>Tax revenues fund public services and redistribution. A shrinking economy triggers unemployment and debt crises, eroding the social solidarity required for long-term climate policy, potentially leading to authoritarian backlash. | **Growth-dependent welfare is fragile and ecologically suicidal.**<br>Working-time reduction (e.g., 30-hour weeks) can redistribute necessary labor without mass unemployment. Social stability depends on equity and public goods, not aggregate output; we can sustain welfare through redistribution rather than expansion. |
  | **4. Objective Function** | **"Prosperity without growth" is incoherent as a mass political project.**<br>Historical data shows strong correlation between GDP per capita and well-being metrics in developing and middle-income contexts. Abandoning growth as an objective removes the primary engine of poverty alleviation and technological investment. | **"Prosperity without growth" is the only coherent objective for a saturated economy.**<br>Beyond a certain threshold, GDP growth correlates poorly with well-being and drives ecological overshoot. The social objective function must shift from accumulation to sufficiency, care, and leisure. |

  ### III. EMPIRICAL CRUXES AND PRE-REGISTERED PREDICTIONS

  We identify the following sub-questions as "cruxes." Settling these empirically would cause at least one party to revise their position. We agree on the relevant evidence and record our conflicting predictions in advance.

  #### Crux 1: Elasticity of Demand Under High Carbon Prices
  *   **The Question:** Can a high carbon price alone reduce aggregate energy demand sufficiently without explicit quantity constraints?
  *   **Agreed Evidence:** Analysis of jurisdictions with sustained high carbon taxes (e.g., Switzerland, Sweden, British Columbia) over 10+ year periods, specifically isolating the effect of the tax from concurrent regulations.
  *   **MOCE Prediction:** A price of $200/t (real terms) will induce a demand reduction of >40% in covered sectors within 15 years via fuel switching and efficiency, with GDP impact neutral or positive due to innovation dividends.
  *   **CDA Prediction:** A price of $200/t will induce a demand reduction of <15% in covered sectors, as inelastic demand and rebound effects (spending dividend income on other carbon-intensive goods) will maintain aggregate throughput.

  #### Crux 2: Welfare Stability During Planned Contraction
  *   **The Question:** Can a society maintain social cohesion and welfare financing during a period of deliberate economic contraction?
  *   **Agreed Evidence:** Comparative study of "planned downscaling" episodes (e.g., wartime mobilization economies, Cuba's *Special Period*) versus "involuntary recession" episodes (e.g., 2008 Financial Crisis, 1990s post-Soviet collapse), focusing on mortality rates, inequality metrics, and policy durability.
  *   **MOCE Prediction:** Even "planned" contraction will mimic involuntary recession dynamics, causing tax revenue shortfalls that force austerity, spiking inequality and mortality, thereby rendering the policy politically reversible.
  *   **CDA Prediction:** Planned contraction, if paired with working-time reduction and debt jubilees, will maintain or improve well-being metrics (health, leisure, equality) despite GDP decline, proving the growth-welfare link is breakable.

  #### Crux 3: The Rate of Absolute Decoupling in Advanced Economies
  *   **The Question:** Is the current rate of absolute decoupling in OECD nations accelerating fast enough to meet a 1.5°C budget without GDP reduction?
  *   **Agreed Evidence:** Trend analysis of consumption-based emissions (including embodied imports) vs. GDP for the G7 from 2015–2035.
  *   **MOCE Prediction:** The rate of decoupling will show a structural break (acceleration) post-2025 as green tech hits cost parity, allowing emissions to halve by 2035 with positive GDP growth.
  *   **CDA Prediction:** The rate of decoupling will plateau or decline as low-hanging fruit is exhausted and embodied emissions in imports rise, making a 50% reduction by 2035 impossible without reducing aggregate economic activity.

  ### IV. NOTE ON TERMINOLOGY (VERBAL DISPUTE RESOLUTION)

  During our collaboration, we identified a verbal dispute regarding the definition of **"Degrowth."**

  *   **The Confusion:** The Economist initially interpreted "Degrowth" as synonymous with "Recession" (an unplanned, crisis-driven contraction of monetary exchange causing unemployment and distress). The Advocate intended "Degrowth" to denote a "Planned Equitable Downscaling of Throughput" (a policy-driven reduction of energy and material use, agnostic to GDP, prioritizing well-being).
  *   **Resolution:** We agree to settle this definition for the purpose of this collaboration. We acknowledge that the Advocate's proposal *likely results* in a contraction of GDP as currently measured, but that GDP contraction is not the *primary objective*; the objective is the reduction of biophysical throughput.
  *   **Status:** This definition is now settled in **Section I**. However, the *desirability* and *risk* of the resulting GDP contraction remain a **Substantive Disagreement** recorded in **Section II (Row 3 & 4)**, as the Economist argues the GDP outcome is unavoidable and dangerous, while the Advocate argues it is manageable and necessary.

  ***

  **Signed,**

  *Dr. Elena Rostova, Lead Economist, Center for Market Climate Solutions*
  *Mr. Julian Thorne, Policy Director, Alliance for Post-Growth Transitions*
