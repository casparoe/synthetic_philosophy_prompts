answer: |-
  The case of Ashoka following the Kalinga War serves as a rigorous stress test for the classification of Buddhist ethics. If Buddhist ethics is a form of consequentialism, Ashoka's statecraft should align with the maximization of aggregate welfare. If it is agent-centered (virtue or deontological), his conduct should align with the purification of his own moral state and adherence to precepts. The historical record reveals a hybrid that exposes fractures in both interpretations.

  ### 1. The Nature of Remorse: Prudential Pollution or Moral Regret?

  **The Buddhist Mapping:** In early Buddhist ethics, the moral quality of an act is fixed by *cetana* (intention). The consequences of that intention ripple through *karma*, attaching primarily to the agent. Ashoka's remorse, viewed through this lens, is the recognition of heavy karmic debt. He has generated the conditions for his own future suffering (rebirth in lower realms). His regret is structurally prudential: he is polluted, and he seeks to mitigate the ripening of that bad seed.

  **The Consequentialist Mapping:** A classical consequentialist views remorse as the recognition of a net deficit in utility. The regret is not about the agent's spiritual status but about the objective suffering inflicted on the patients (the Kalingans). The moral failure is the reduction of total welfare.

  **Where It Breaks Down:**
  Ashoka's edicts complicate this dichotomy. In Rock Edict XIII, he states, "One hundred and fifty thousand were deported, one hundred thousand were killed... This is considered very painful and deplorable by His Sacred Majesty."
  *   **Against Consequentialism:** If this were purely consequentialist, the remorse would focus on the calculation error (the cost of war outweighed the benefit of annexation). Instead, Ashoka focuses on the *violence itself* as a moral stain.
  *   **Against Buddhist Agent-Centrism:** If his remorse were purely about his own karmic pollution, the remedy would logically be intense personal merit-making (meditation, monastic patronage) to offset the bad karma. While he did this, he also pivoted to public welfare.
  *   **The Verdict:** The remorse functions as a bridge. Ashoka treats his own karmic status as inextricably linked to the welfare of his subjects. However, this reveals a tension: in strict Buddhist soteriology, building a well does not erase the karma of killing. The intention to kill has already ripened. Ashoka's conduct suggests he believes *future* good works can mitigate *past* bad karma in a way that resembles consequentialist offsetting more than karmic causality. This weakens the strict "karma is immutable" reading of Buddhist ethics but does not fully confirm consequentialism, as the motivation remains tied to his own spiritual burden ("I desire for all beings... security, self-control, and peace of mind").

  ### 2. The Structure of Consequences: Agent vs. Patient

  **The Buddhist Mapping:** Karma is agent-relative. *I* reap what *I* sow. A Buddhist ethical system does not inherently mandate that I maximize *your* welfare, only that I refrain from harming you to protect my own moral integrity.

  **The Consequentialist Mapping:** Consequences are agent-neutral. It does not matter who builds the hospital, only that the hospital exists to reduce suffering. Ashoka's welfare program (medical care for humans and animals, wells, shade trees) is impartial and aggregative. It benefits whoever happens to pass by, not just those who generate merit for Ashoka.

  **Where It Breaks Down:**
  Ashoka's policy is strikingly patient-focused. He appoints *Dhamma-mahamattas* to check on prisoners and the vulnerable.
  *   **Against Buddhist Ethics:** Traditional early Buddhism is soteriological, not political. Its goal is *nirvana*, not *sukha* (worldly happiness). Ashoka's focus on worldly comfort (medical care, trees) is a category shift. A strict Buddhist ethical reading struggles to explain why a King should prioritize worldly welfare over encouraging renunciation.
  *   **Against Consequentialism:** A consequentialist state would weigh the costs of these programs against other uses of resources. Ashoka's edicts present these welfare measures as moral imperatives, not utility calculations.
  *   **The Verdict:** This is the strongest evidence *for* a consequentialist reading of Ashoka's *policy*, but it highlights a divergence from Buddhist *ethics*. Ashoka is acting as a utilitarian monarch using Buddhist vocabulary. He treats the reduction of suffering (*dukkha*) as a political end in itself, whereas Buddhist ethics treats the reduction of suffering as a path to liberation. If Buddhist ethics were inherently consequentialist, this gap wouldn't exist. The fact that Ashoka has to innovate "worldly dhamma" suggests standard Buddhist ethics does not mandate state-level welfare aggregation.

  ### 3. The Renunciation of Conquest: Calculation vs. Precept

  **The Buddhist Mapping:** War requires the intention to kill. Killing violates the first precept. Therefore, war is intrinsically unwholesome (*akusala*), regardless of the outcome.

  **The Consequentialist Mapping:** War is instrumentally bad. If a war could be won with zero casualties and result in long-term peace that maximizes utility, a consequentialist must endorse it. Renunciation is only justified if the expected costs of future wars exceed the benefits.

  **The Cynic Mapping:** The Mauryan empire had reached its geographic and logistical limits. Further conquest was impractical.

  **Where It Breaks Down:**
  Ashoka declares a renunciation of "war by sword" (*digvijaya*) in favor of "conquest by dhamma" (*dhammavijaya*).
  *   **The Cynic Check:** While logistical limits existed, Ashoka explicitly threatens the forest tribes with punishment if they do not conform. He retained the capacity for violence but chose to restrict its use. This weakens the cynic argument; he didn't *stop* because he *couldn't*, he stopped because he *wouldn't*.
  *   **The Consequentialist Failure:** A consequentialist cannot rule out war *in principle*. If a neighboring state threatened to massacre Mauryan subjects, a consequentialist Ashoka would have to fight. Ashoka's edicts, however, suggest a near-absolute prohibition. He writes, "Even if a tenth or a hundredth part of those people were to be killed... it would be a matter of regret." This implies the killing itself is the wrong, not just the scale.
  *   **The Buddhist Success:** This aligns perfectly with the intention-based ethics of Buddhism. The mental state of aggression is the poison.
  *   **The Verdict:** The renunciation of war is the point where the Consequentialist reading of Buddhist ethics collapses. Ashoka does not optimize violence; he rejects the intention of violence. This supports the view that Buddhist ethics is deontological regarding precepts (do not kill), even if the *outcome* (peace) is desirable.

  ### 4. The Aggregation Problem: Statecraft or Soteriology?

  **The Buddhist Mapping:** Buddhism lacks a procedure for summing welfare across persons. Each being is responsible for their own liberation. There is no "social utility" in the *Nikayas*.

  **The Consequentialist Mapping:** Governance requires aggregation. Ashoka's statement "All men are my children" implies an impartial weighing of interests. He acts to maximize the "welfare and happiness" of the whole.

  **Where It Breaks Down:**
  Ashoka's administration looks like an exercise in summing welfare. He plants trees for travelers he will never meet; he provides medicine for animals that cannot generate merit for him.
  *   **The Tension:** If Buddhist ethics is not consequentialist, why does a Buddhist King act like a consequentialist?
  *   **The Explanation:** This is likely an artifact of statecraft, not ethics. To rule an empire, one must adopt agent-neutral policies. Ashoka is importing consequentialist *methods* to solve political problems, justified by Buddhist *motives* (compassion).
  *   **The Verdict:** This is a genuine point against the thesis that Buddhist *ethics* is consequentialist. If the ethics themselves mandated aggregation, Ashoka wouldn't need to innovate a "Dhamma" that looks so different from monastic discipline. The fact that his royal Dhamma diverges from monastic Dhamma (focusing on social welfare rather than individual liberation) suggests that Buddhist ethics *requires* modification to function consequentially at a state level.

  ### 5. Discipline About Silence

  There are features of Ashoka's conduct that neither framework fully predicts or explains. Candor requires acknowledging these gaps.

  *   **Religious Tolerance:** Ashoka urges restraint in criticizing other sects and praises the "essence" of all religions.
      *   *Buddhist Silence:* Early Buddhist texts are exclusivist regarding truth (the Four Noble Truths are *the* truth). They do not mandate respecting "false" views.
      *   *Consequentialist Silence:* A utilitarian might suppress religions that cause social friction. Tolerance is only good if it produces harmony.
      *   *Analysis:* Ashoka's tolerance seems to stem from a political insight (diverse empires fracture under dogmatism) rather than a strict ethical derivation from either system. This weakens the claim that his conduct is a pure output of Buddhist ethics.
  *   **Renouncing War vs. Reforming War:**
      *   *Silence:* Neither framework strictly demands the total renunciation of war over the reform of its conduct. A consequentialist could argue for "humane war." A Buddhist could argue for "defensive war."
      *   *Analysis:* Ashoka's choice to renounce war entirely rather than minimize its cruelty is a specific moral leap. It aligns closer to the Buddhist precept against killing, but the *public* nature of this renunciation (as a tool of soft power) is political.
      *   *Impact on Thesis:* This strengthens the argument that Buddhist ethics is **not** consequentialist. A consequentialist would not foreclose the option of war if the utility calculation shifted. Ashoka's absolute stance suggests a deontological constraint (ahimsa) overriding consequentialist calculation.

  ### Conclusion: The Verdict on Consequentialism

  Ashoka's conduct after Kalinga weakens the case that Buddhist ethics is inherently a form of consequentialism.

  1.  **Motivation vs. Outcome:** While Ashoka's *policies* produce consequentialist outcomes (aggregate welfare), his *justifications* are often agent-centered (karmic merit, personal remorse, intention).
  2.  **The War Constraint:** The absolute renunciation of conquest contradicts the consequentialist willingness to trade lives for greater goods. It aligns with the Buddhist emphasis on the moral quality of the intention (*cetana*).
  3.  **The Aggregation Gap:** The fact that Ashoka had to construct a "Royal Dhamma" that focuses on worldly welfare—distinct from the monastic focus on liberation—suggests that standard Buddhist ethics does not naturally accommodate the aggregation of welfare required by consequentialism.

  Ashoka appears not as a pure Buddhist ethicist, but as a ruler who recognized that Buddhist *compassion* could be operationalized through consequentialist *statecraft*. The friction between the two systems is visible in the edicts: he wants to maximize happiness (consequentialism) to cleanse his karma (Buddhist agent-ethics). The synthesis works politically, but analytically, it demonstrates that Buddhist ethics lacks the machinery for impartial aggregation without significant modification. Therefore, Ashoka's case suggests Buddhist ethics is best understood as **agent-centered virtue ethics** that can *support* consequentialist policies in a political context, but is not consequentialist in its foundational meta-ethics.
