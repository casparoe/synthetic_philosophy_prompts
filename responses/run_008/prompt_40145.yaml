  my friend works on inverse reinforcement learning and it has fully leaked into how she judges regular people. whenever someone's words and actions point in different directions she gives a verdict like she's labeling a dataset. her rulings so far, from memory:

  - a guy at her old office who said he hated parties but showed up to every single one: she said he likes parties, the complaining is noise
  - a woman on her team who claimed to be easygoing about restaurants but vetoed everything except thai places: she said there's a strong thai preference there, no ambiguity
  - her aunt, smoked for 30 years, says every year she wants to quit, has gone cold turkey maybe five times (longest stretch eight months) and relapsed every time: she said the aunt's real preference is quitting — the relapses are akrasia, and the repeated costly attempts are the truest data we have on her
  - a cousin who says he wants to get in shape, bought a nice bike and a gym membership in january, never went once: she said his actual preference is for being the kind of person who works out (identity purchase), not for exercising — the bike is a signal, not evidence
  - a guy she knew who said he hated his job and would love to do something else, but never looked around and kept showing up: she said you can't infer anything about his job preferences — showing up reveals he needs a paycheck, and behavior forced by constraints tells you about the constraints, not the preferences

  next week we're arguing about her brother. he says he wants to quit drinking, has said so for years. his attempts fizzle within a day, every time — never made it a week on his own. but last year he paid for and completed a full month at a residential program, came out, and has been drinking since, basically same as before.

  so whats her call going to be? i can see at least two rules she might be running: something like "weight the evidence by cost, discount one-off purchases, discount constraint-driven behavior" vs. something like "in domains where weakness of will is expected, the stated preference wins as long as there was ever some real costly effort". predict her verdict on the brother, say which earlier case is the closest analog under each rule and why the two analogies pull in opposite directions, and then give me the further case that would definately split those two rules apart. it seems to me the crux is whether a paid month in a residential program is more like the aunt's eight-month quit (sustained costly effort, then relapse) or more like the cousin's bike (a one-time payment to buy the feeling of having tried) — but i'd like to know if you think that's even the right cut, or whether the real distinction is purchased vs self-powered, or repeated vs one-off, or something else entirely.

  also she keeps insisting this is basically her day job — that human speech is just off-policy data with unknown reliability and everything else is the standard identification problem. does that analogy actually hold up, or does it break somewhere?
