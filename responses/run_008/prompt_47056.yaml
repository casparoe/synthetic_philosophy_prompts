prompt: |-
  You're a philosopher who works on autonomy and behavioral policy -- think the nudging literature and its critics, not pop behavioral econ. I run benefits for a company of about 2,000 people, and HR keeps redesigning "choices": the pension enrollment default, whether new hires are auto-enrolled in income protection, the cafeteria layout, even whether the leave-booking portal rounds your days up or down. Everyone has opinions, nobody has a principled way to decide which of these changes are fine and which cross into manipulation. Please turn the actual ethical distinctions from the paternalism/nudging debate -- shoves vs nudges, whether an intervention works by exploiting a bias or by supporting deliberation, transparency, whether opting out is easy in practice and not just on paper -- into a procedure my team can actually run on any proposed change: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a "no", and where it should just say "this is a values call, take it to the works council" because the theory genuinely doesn't settle it. Be honest about where the procedure will misfire or get gamed by people who want a predetermined answer. Then run it on three cases: defaulting everyone into the pension at 6% contributions (opt-out available), putting the salad at eye level and moving desserts to a back counter, and defaulting new hires into donating 1% of salary to the company charity with an opt-out checkbox on their first day. Think carefully before you write -- maybe start with a quick brainstorm of the distinctions worth keeping vs dropping for a lay team -- and note that I suspect the procedure will bless at least one of these that I personally think is over the line, and block one I want to do. If that's right, tell me, and explain where the disagreement is coming from.
