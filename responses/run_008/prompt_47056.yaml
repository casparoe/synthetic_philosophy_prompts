answer: |-
  This is a classic problem in applied normative ethics: translating high-level principles (autonomy, welfare, manipulation) into an operational checklist for non-philosophers. The literature you're referencing—Thaler & Sunstein's *Libertarian Paternalism*, contrasted with critics like Hausman & Welch, Bovens, and Wilkinson—centers on whether an intervention respects the agent's capacity to choose while acknowledging their cognitive limitations.

  Below is a draft **Autonomy Impact Assessment (AIA)**. It is designed to be run by your team before any "choice architecture" change is implemented. Following that, I apply it to your three cases and address the friction you anticipate.

  ### Part 1: The Autonomy Impact Assessment (AIA)

  This procedure is a filter. If a proposal fails a "Hard Stop," it is rejected. If it hits a "Values Call," it must go to the Works Council or Employee Representative Body. If it passes all filters, it is ethically permissible (though not necessarily mandatory).

  **Instructions:** Answer the questions in order. You must provide evidence, not assertions.

  #### 1. The Coercion Test (Hard Stop)
  *   **Question:** Does this change remove an option entirely, or impose a significant financial/employment penalty on choosing the alternative?
  *   **Sufficient Answer:** "No. All previous options remain available at the same cost/effort, except for the default setting."
  *   **Fail Condition:** If an option is removed, or if opting out costs money (e.g., a fee) or risks employment status.
  *   **Philosophical Rationale:** Distinguishes a *nudge* (choice preserving) from a *shove* (coercive).

  #### 2. The Friction Test (Hard Stop)
  *   **Question:** Is the effort required to opt out *roughly equivalent* to the effort required to stay in?
  *   **Sufficient Answer:** "Yes. Opting out requires the same number of clicks, time, or physical movement as opting in."
  *   **Fail Condition:** If opting out requires a phone call, a form, a manager's signature, or waiting periods, while opting in is one click.
  *   **Philosophical Rationale:** "Easy opt-out" is the core defense of nudging. If friction is added to the exit, it becomes a *sludge*, violating negative liberty.

  #### 3. The Transparency Test (Hard Stop)
  *   **Question:** If we published this change in a company-wide email with the subject line "How We Are Influencing Your Choices," would a reasonable employee feel betrayed?
  *   **Sufficient Answer:** "No. We are comfortable stating the goal of the intervention publicly."
  *   **Fail Condition:** If the team feels the need to hide the mechanism, downplay the default, or bury the opt-out in fine print to make it work.
  *   **Philosophical Rationale:** Based on the "Publicity Condition." Manipulation relies on secrecy; autonomy respects the agent's right to know why their environment is structured a certain way.

  #### 4. The Mechanism Test (Values Call)
  *   **Question:** Does this intervention work primarily by *aiding deliberation* (making info clearer) or by *exploiting inertia/bias* (relying on them not thinking)?
  *   **Sufficient Answer:** "It aids deliberation" OR "It exploits inertia, but the stakes are low."
  *   **Trigger for Values Call:** If it relies heavily on inertia/bias (System 1) for a high-stakes decision.
  *   **Philosophical Rationale:** Critics argue that bypassing reasoning treats employees like children. Proponents argue it helps them achieve their own goals when they are distracted. This is where reasonable people disagree.

  #### 5. The Beneficiary Test (Hard Stop / Values Call)
  *   **Question:** Who is the primary beneficiary of the default? The employee (welfare) or the employer (cost savings/culture/PR)?
  *   **Sufficient Answer:** "Primarily the employee."
  *   **Trigger for Hard Stop:** If the primary beneficiary is the employer *and* it exploits inertia (e.g., defaulting into arbitration clauses).
  *   **Trigger for Values Call:** If the beneficiary is a third party (e.g., charity) using employee resources.
  *   **Philosophical Rationale:** Paternalism is only defensible if it serves the agent's own good (or prevents harm to others). Using behavioral bias to benefit the company is manipulation.

  ---

  ### Part 2: Limitations and Gaming

  Be honest with your team: **This procedure is not a black box.**

  1.  **The "Effort" Gaming:** People will argue that a phone call is "roughly equivalent" to a click. It isn't. You need a standardized metric (e.g., "max 2 minutes").
  2.  **The "Welfare" Definition:** HR often assumes "more savings = better welfare." Some employees value current cash flow over future security. The procedure assumes the default aligns with *most* employees' long-term interests. If that assumption is wrong, the ethics crumble.
  3.  **The "Transparency" Blindspot:** Teams often convince themselves employees "wouldn't care" about things they would actually find intrusive. If possible, test the Transparency question on a sample of employees, not just the HR team.
  4.  **Values Call Evasion:** Teams may frame a "Values Call" issue as a "Mechanism" pass to avoid going to the Works Council. You need a neutral arbiter to decide when a Values Call is triggered.

  ---

  ### Part 3: Running the Cases

  Here is how the AIA processes your three scenarios.

  #### Case 1: Pension Default (6% Contribution, Opt-Out Available)
  1.  **Coercion:** Pass. Options remain, no penalty.
  2.  **Friction:** Pass (Assuming opt-out is digital and immediate).
  3.  **Transparency:** Pass. "We default you to 6% to help you save" is defensible publicly.
  4.  **Mechanism:** **Values Call.** It relies on inertia (status quo bias). Some argue this bypasses autonomy; others argue it aids long-term welfare.
  5.  **Beneficiary:** Pass. Primarily benefits the employee (future self).
  *   **Verdict:** **Permissible, but requires Values Call on the Rate.**
      *   *Note:* 3% might be standard; 6% is aggressive. The Works Council should decide if 6% is the appropriate "presumed interest."

  #### Case 2: Cafeteria Layout (Salad Eye-Level, Dessert Back)
  1.  **Coercion:** Pass. Dessert is still available.
  2.  **Friction:** Pass. Walking further is a minor inconvenience, not a barrier.
  3.  **Transparency:** Pass. It is visible. "We arranged food to encourage health" is not secretive.
  4.  **Mechanism:** **Values Call.** It exploits salience and convenience biases. It does not aid deliberation about nutrition; it bypasses it.
  5.  **Beneficiary:** Pass. Employee health (mostly).
  *   **Verdict:** **Permissible (Classic Nudge).**
      *   *Note:* This is the textbook example of a nudge. Low stakes, health benefit, no financial loss.

  #### Case 3: Charity Default (1% Salary Donation, Opt-Out Checkbox Day 1)
  1.  **Coercion:** Pass. Technically optional.
  2.  **Friction:** Pass (Assuming checkbox is easy).
  3.  **Transparency:** **Fail/High Risk.** Would you headline: "We Automatically Take 1% of Your Pay for Our Charity Unless You Stop Us"? Most companies hide this.
  4.  **Mechanism:** **Values Call.** Relies entirely on inertia and onboarding overwhelm.
  5.  **Beneficiary:** **Hard Stop / Values Call.** The primary beneficiary is the Charity/Company PR, *not* the employee's financial welfare. It transfers assets from employee to third party by default.
  *   **Verdict:** **Blocked (or High-Risk Values Call).**
      *   *Note:* This fails the Beneficiary Test. Unlike a pension (money for *you*), this is money *away from you*. Defaulting financial outflows is ethically distinct from defaulting financial retention.

  ---

  ### Part 4: The Disagreement (Where the Procedure Clashes with Intuition)

  You mentioned you suspect the procedure will bless something you think is over the line, and block something you want to do. Based on the analysis above, here is where that friction will likely occur:

  **1. The Procedure Blesses the Cafeteria (Case 2), You Might Hate It.**
  *   **Why you might dislike it:** It feels infantilizing. It treats grown adults like children who can't walk ten extra feet for a cookie. It signals that the company claims authority over your body and appetite.
  *   **Why the Procedure blesses it:** In the nudging literature, this is the "purest" nudge. It preserves all options, costs nothing, and promotes a widely shared value (health). The philosophical defense is that our environment *already* influences us (e.g., if dessert is at the register, that's also a design choice). Making the healthy choice the easy one is seen as neutral or beneficial.
  *   **The Philosophical Clash:** This is a clash between **Negative Liberty** (freedom from interference, even subtle) vs. **Welfarism** (outcomes matter more than the purity of the decision process). If you value bodily autonomy highly, this nudge feels like a violation. The procedure prioritizes welfare outcomes.

  **2. The Procedure Blocks the Charity Default (Case 3), You Might Want It.**
  *   **Why you might want it:** It builds culture, supports good causes, and is "easy" for employees who *would* donate if asked. It looks like corporate responsibility.
  *   **Why the Procedure blocks it:** This is the critical ethical distinction. **Defaulting savings (Pension) is not the same as defaulting donations (Charity).**
      *   *Pension:* I am keeping my money for my future self. If I do nothing, I retain ownership.
      *   *Charity:* If I do nothing, I lose ownership.
      *   Philosophers like **Bovens** and **Hausman** argue that defaulting financial *contributions* presumes consent to alienate property, which is a much higher bar than presuming consent to save. It exploits the onboarding process (a time of high cognitive load) to extract money.
  *   **The Philosophical Clash:** This is a clash between **Collective Good/Culture** vs. **Financial Autonomy**. The procedure takes a hard line on financial outflows. If you believe the "greater good" of the charity justifies the default, the procedure will look too rigid to you.

  ### Summary Recommendation

  If you adopt this procedure:
  1.  **Kill the Charity Default.** Move it to an *opt-in* campaign. The reputational risk of being seen as "taking money by stealth" outweighs the donation volume.
  2.  **Keep the Pension Default,** but take the 6% rate to the Works Council. Let them own the "values" decision on how aggressive the savings target should be.
  3.  **Keep the Cafeteria Layout,** but acknowledge the criticism. Frame it not as "making you healthy" but as "making healthy food more visible."

  If you find yourself fighting the procedure on the Cafeteria or the Charity, do not ignore that feeling. It means your company's culture values either **bodily non-interference** (Cafeteria) or **aggressive cultural signaling** (Charity) more than the standard philosophical framework allows. In those cases, the "Values Call" is doing its job: it's telling you that this isn't a technical policy decision, it's a statement of who you are.
