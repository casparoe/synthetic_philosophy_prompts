prompt: |-
  I've been reading the inside view vs. outside view debates for over a decade, and I've finally tried to write down my actual epistemic commitments. Before I circulate them to my forecasting group, I'd like an audit of whether they jointly hang together:

  1. When my object-level reasoning conflicts with a reference-class forecast, the reference class should usually win.
  2. When epistemic peers whom I consider informed disagree with me, I should move my credences toward the aggregate rather than trust my own analysis.
  3. I take Tetlock's results seriously: on long-range political and technological questions, expert forecasts are barely better than chance, and adding more experts doesn't reliably fix this.
  4. Reference classes are chosen, not given. The same venture can be lumped in with all startups, or with two-person technical startups in the same city by repeat founders, and the base rates differ wildly. Picking which class is relevant is itself an exercise of inside-view judgment, so the outside view never fully bottoms out.
  5. In my day job I estimate software projects, and my calibrated inside-view estimates beat both the industry-standard overrun statistics and any base-rate model I've built, so I keep using them.
  6. I believe universal deference is self-undermining: the reason averaging across people works is that their errors are partly independent, but if everyone adopts averaging as a norm and discards their own signal, the independence is destroyed and the aggregate degrades.
  7. I endorse the first-principles, inside-view-heavy reasoning behind taking AI risk seriously — arguments about capability growth and timelines for which no clean reference class exists and expert consensus is currently an unreliable guide.

  Which pairs of these are genuinely in tension, which only look like they are, and what would the cheapest coherent revision be? Please order the tensions by severity rather than flagging everything equally, and for each one say which commitment has to give and what giving it up would cost me elsewhere on the list.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the Request:**
      *   **Input:** A list of 7 epistemic commitments regarding inside view vs. outside view, forecasting, expert opinion, and specific domains (software, AI).
      *   **Task:** Audit the list for internal consistency (do they "hang together"?). Identify tensions (genuine vs. apparent). Order tensions by severity. Propose the "cheapest coherent revision" for each tension (which commitment gives, what is the cost).
      *   **Constraint:** Order by severity, not just flag everything.

  2.  **Analyze the Commitments:**
      *   *C1:* Reference class > Object-level reasoning (usually).
      *   *C2:* Epistemic peers/aggregate > Own analysis (move toward aggregate).
      *   *C3:* Tetlock's results: Experts $\approx$ chance on long-range political/tech; more experts $\neq$ fix.
      *   *C4:* Reference classes are chosen (inside view judgment); outside view doesn't bottom out.
      *   *C5:* Personal track record: Calibrated inside-view (software) > Base rates/Industry stats.
      *   *C6:* Universal deference is self-underundermining (needs independent signals).
      *   *C7:* Inside-view-heavy reasoning justifies AI risk (no clean reference class, experts unreliable).

  3.  **Initial Scan for Tensions:**
      *   *C1 vs. C5:* C1 says reference class usually wins. C5 says inside view wins (in software). *Potential Conflict.*
      *   *C1 vs. C7:* C1 says reference class usually wins. C7 says inside view wins (in AI). *Potential Conflict.*
      *   *C2 vs. C6:* C2 says defer to aggregate. C6 says if everyone defers, aggregate breaks. *Potential Conflict (Game Theoretic).*
      *   *C2 vs. C3:* C2 says defer to peers/aggregate. C3 says experts are bad at long-range tech/politics. *Potential Conflict (Who are the peers?).*
      *   *C3 vs. C7:* C3 says experts bad at tech. C7 says take AI risk seriously (often based on expert-adjacent arguments, but claims experts are unreliable guide). *Actually, C7 aligns with C3 on expert unreliability, but relies on inside view.*
      *   *C4 vs. C1:* C4 says picking reference class is inside view. C1 says reference class wins over inside view. *Circularity/Regression risk.*

  4.  **Deep Dive into Specific Tensions (Drafting the Analysis):**

      *   **Tension 1: The "Usually" Exception Problem (C1 vs. C5 & C7)**
          *   *Conflict:* C1 establishes a general rule (Outside > Inside). C5 and C7 establish specific domains where Inside > Outside.
          *   *Severity:* High. If you have exceptions for "my job" and "the most important issue of our time," does the general rule do any work? It risks becoming "Outside view wins, except when I think it shouldn't."
          *   *Resolution:* C1 needs a caveat. "Usually" does heavy lifting. But C5 and C7 define the conditions for "usually."
          *   *Cheapest Revision:* Modify C1 to explicitly acknowledge domain dependence based on track record (C5) and reference class availability (C7).

      *   **Tension 2: The Expert Deference Paradox (C2 vs. C3 vs. C7)**
          *   *Conflict:* C2 says defer to informed peers/aggregate. C3 says experts on long-range tech (like AI) are barely better than chance. C7 says use inside view for AI because experts are unreliable.
          *   *Severity:* High. C2 suggests aggregating expert opinion. C3+C7 suggests expert opinion on AI is noise. If you follow C2 on AI, you violate C3/C7. If you follow C3/C7, you violate C2 for that domain.
          *   *Resolution:* Define "epistemic peers" in C2. Are superforecasters peers? Or domain experts? Tetlock distinguishes these.
          *   *Cheapest Revision:* Qualify C2. Defer to *calibrated* peers (superforecasters), not just *domain* experts.

      *   **Tension 3: The Reference Class Selection Loop (C1 vs. C4)**
          *   *Conflict:* C1 says use reference class to correct inside view. C4 says picking the reference class *is* inside view.
          *   *Severity:* Medium-High. This is the classic "Reference Class Tennis" problem. If the selection mechanism is the thing being corrected, you haven't escaped bias.
          *   *Resolution:* Acknowledge that C1 is a *check*, not a replacement. You use inside view to pick the class, then let the class constrain the inside view.
          *   *Cheapest Revision:* Clarify C1/C4 relationship. C1 isn't "blindly follow class," it's "use class as a prior."

      *   **Tension 4: The Public Goods Problem (C2 vs. C6)**
          *   *Conflict:* C2 says *I* should defer. C6 says if *everyone* defers, system breaks.
          *   *Severity:* Low-Medium. This is a standard coordination problem. It doesn't make *my* policy irrational, just collectively suboptimal if universalized. Kantian categorical imperative vs. Rule Utilitarianism.
          *   *Resolution:* C2 is a personal policy given the current state of the world (where others *aren't* all deferring). C6 is a systemic observation.
          *   *Cheapest Revision:* No change needed, just clarify scope (Personal vs. Systemic).

      *   **Tension 5: Software vs. AI (C5 vs. C7)**
          *   *Conflict:* C5 says inside view works for software. C7 says inside view works for AI. Are they consistent?
          *   *Severity:* Low. Both argue for inside view when base rates are weak or personal calibration is strong. They actually support each other against C1's generality.
          *   *Resolution:* These are allies. The tension is with C1, not each other.

  5.  **Structuring the Audit:**
      *   **Executive Summary:** Overall assessment (mostly coherent, but C1 is the weak link).
      *   **Ranked Tensions:**
          1.  **The "Except When It Doesn't" Rule (C1 vs. C5/C7).** Severity: High.
          2.  **The Definition of "Peer" (C2 vs. C3/C7).** Severity: High.
          3.  **The Regress Problem (C1 vs. C4).** Severity: Medium.
          4.  **The Coordination Problem (C2 vs. C6).** Severity: Low.
      *   **Synthesis/Revision:** Propose a unified framework.

  6.  **Refining the "Cheapest Revision":**
      *   For Tension 1 (C1 vs C5/C7): Don't drop C1. Drop the *universality* of C1. Make C1 conditional on "When a robust, uncontroversial reference class exists AND I lack domain-specific calibration."
      *   For Tension 2 (C2 vs C3): Clarify "informed peers." Tetlock's superforecasters are not the same as "experts" in C3. C2 should specify *forecasting* peers, not *domain* peers.
      *   For Tension 3 (C1 vs C4): Acknowledge the iterative process. Inside view selects class -> Outside view anchors -> Inside view adjusts.

  7.  **Final Review against User Constraints:**
      *   *Order by severity?* Yes.
      *   *Which commitment gives?* Be specific.
      *   *What is the cost?* Be specific.
      *   *Tone:* Analytical, respectful of the decade of thought, rigorous.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, is C3 actually in tension with C2?* C3 says experts are bad. C2 says defer to peers. If "peers" = "experts," yes. If "peers" = "other forecasters," maybe not. Tetlock's work shows *superforecasters* beat experts. So C2 needs to distinguish between "domain experts" and "forecasting peers."
      *   *Is C5 justified?* User claims calibrated inside view beats base rates in software. This is an empirical claim about their specific skill. It doesn't contradict C1 generally, only C1's "usually."
      *   *Is C7 justified?* AI has no reference class. So C1 (which requires a reference class) doesn't apply. This is a clean exception, not a contradiction, *provided* C1 is read as "When a reference class exists..."
      *   *Key Insight:* The main friction is C1's phrasing "usually win." It's too strong given C5 and C7. C1 is the linchpin that needs loosening.

  9.  **Drafting the Response:** (Mental Outline)
      *   Intro: Strong set of commitments, surprisingly coherent, but C1 is doing too much work.
      *   Tension 1 (High): C1 vs. (C5+C7). The "General Rule vs. Specific Exceptions" problem.
      *   Tension 2 (High): C2 vs. C3. Who counts as a peer?
      *   Tension 3 (Med): C1 vs. C4. The selection regress.
      *   Tension 4 (Low): C2 vs. C6. The universalization paradox.
      *   Recommendation: Rewrite C1 to be conditional. Refine C2 to specify *forecasting* track records over *domain* status.

  10. **Final Polish:** Ensure the "Cost" of giving up is clear for each. (e.g., If you weaken C1, you lose a heuristic for humility. If you weaken C2, you risk arrogance.)

  *(Self-Correction during drafting)*: I need to make sure I don't just say "C1 is wrong." C1 is a good heuristic. The problem is the conflict with the user's specific empirical claims in C5/C7. The revision should integrate them.

  Let's finalize the ranking.
  1. C1 vs C5/C7 (Substantive conflict on when to use inside view).
  2. C2 vs C3 (Definition of authority).
  3. C1 vs C4 (Methodological circularity).
  4. C2 vs C6 (Game theory/Universalization).

