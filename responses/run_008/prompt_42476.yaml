answer: |-
  This is the right move. The literature is indeed bogged down in intuition-pumping without a clear metric for what counts as a successful pump. You are asking for the *functional specification* of the normative mechanism.

  Here is the requirements list for a theory of Advance Directive (AD) authority, structured by the work it needs to do, followed by the tension matrix, the model stress test, and the single constraint that breaks the most theories.

  ### I. The Specification: Desiderata for AD Authority

  A theory of AD authority must satisfy the following constraints to be adequate. I have categorized them by the type of work they perform.

  #### A. Metaphysical & Identity Constraints
  **1. The Continuity/Discontinuity Neutrality Test**
  *   **The Consideration:** Personal identity theories vary (Psychological Continuity, Biological, Narrative). Some suggest the demented self is a *different person* than the author of the directive.
  *   **The Requirement:** The theory must explain why the directive binds (or doesn't) *regardless* of whether we adopt a strict or loose view of identity, OR it must explicitly argue why a specific metaphysical view is a precondition for bioethical policy.
  *   **Status:** *Non-negotiable.* You cannot build a policy on a metaphysical claim that is contested unless you show why the ethics forces the metaphysics.
  *   **The Trap:** If identity is broken, the directive looks like a stranger's command. If identity is preserved, the directive looks like self-rule. The theory must bridge this gap without smuggling in the conclusion.

  **2. The "Dead Stranger" Distinction**
  *   **The Consideration:** Why is the past self not treated like a deceased relative whose will we respect out of sentiment, but whose medical demands we would ignore?
  *   **The Requirement:** The theory must articulate the specific normative link between Time-Slice A (Author) and Time-Slice B (Patient) that grants A authority over B's body, distinct from the authority a parent has over a child or a deceased person has over an estate.
  *   **Status:** *Non-negotiable.* Without this, ADs are merely sentimental artifacts.

  #### B. Normative & Authority Constraints
  **3. The Evidence vs. Authority Distinction**
  *   **The Consideration:** Is the AD *evidence* of what the current self would want if they could speak (substituted judgment), or is it an *authoritative command* that binds even if the current self would want otherwise (precedent autonomy)?
  *   **The Requirement:** The theory must explicitly choose one. It cannot slide between them. If it is evidence, it is defeasible by current behavior. If it is authority, it overrides current behavior.
  *   **Status:** *Non-negotiable.* Most theories fail here by equivocation.

  **4. The Value Shift Filter (The Grandmother Constraint)**
  *   **The Consideration:** Your grandmother mellowed. Was this pathology or growth? A theory that says "Past Self Always Wins" ignores moral growth. A theory that says "Current Self Always Wins" ignores the stability required for life planning.
  *   **The Requirement:** The theory must provide a criterion to distinguish between *endorsed value evolution* (which should void the AD) and *unendorsed value erosion* (which should not).
  *   **Status:** *Non-negotiable.* This is the hardest lift. If the theory cannot distinguish mellowing from dementia, it is useless.

  **5. The Ulysses Extension**
  *   **The Consideration:** Psychiatric ADs often involve a request to treat the patient *against* their will during a manic episode. The future self actively resists.
  *   **The Requirement:** If the theory validates standard dementia ADs (where the self is passive/content), it must explain why it does or does not validate Ulysses contracts (where the self is active/resisting). It cannot accept one and reject the other without a principled distinction regarding *resistance*.
  *   **Status:** *Non-negotiable.* Consistency demand.

  #### C. Functional & Practical Constraints
  **6. The Revocability Condition**
  *   **The Consideration:** Can the current demented patient revoke the AD by expressing a contrary preference?
  *   **The Requirement:** The theory must specify the threshold for revocation. Is it capacity-dependent? Or does the mere expression of current desire void the past command?
  *   **Status:** *Non-negotiable.* Determines the practical application.

  **7. The Content Neutrality Constraint**
  *   **The Consideration:** Does the authority of the AD depend on whether the decision is "reasonable"?
  *   **The Requirement:** The theory must state if a "bad" AD (e.g., refusing antibiotics for a curable infection based on a delusion) holds the same weight as a "good" AD (refusing ventilation based on stable values).
  *   **Status:** *Camp Prejudice.* Some argue autonomy covers bad decisions; others argue authority is forfeited by irrationality. You must pick a lane, but acknowledge this is a point of contention.

  ---

  ### II. The Instability Matrix (Incompatible Pairs)

  You suspected the area is unstable. You are correct. Here are the pairs of requirements that are exceptionally difficult to satisfy jointly. A theory that solves one usually breaks the other.

  **Tension 1: The Value Shift Filter vs. The Ulysses Extension**
  *   **The Conflict:** To handle the Grandmother case (Value Shift), you need a mechanism that allows current values to override past values if the change represents "growth" or "authentic evolution." To handle the Ulysses case (Psychiatric AD), you need a mechanism that *prevents* current values from overriding past values precisely because the current values are viewed as "distorted" or "inauthentic."
  *   **The Instability:** How do you distinguish Grandmother's mellowing (which should override the AD) from the Psychiatric Patient's mania (which should not)? Both involve a change in preference. Both involve the current self feeling their new preference is "right."
  *   **Verdict:** Most theories solve this by smuggling in a normative judgment about *which* values are correct, which violates the neutrality of autonomy.

  **Tension 2: The "Dead Stranger" Distinction vs. The Revocability Condition**
  *   **The Conflict:** If the Past Self has authoritative power (not just evidence), it resembles a legal contract or a property right. Property rights generally cannot be voided by a third party (the current self) without consent. However, if the Current Self can easily revoke the AD (to respect current autonomy), the Past Self's authority dissolves into mere suggestion.
  *   **The Instability:** Strong authority makes revocation impossible (tyranny of the past). Easy revocation makes authority illusory (tyranny of the present).
  *   **Verdict:** This is where the "Contract" model usually dies.

  **Tension 3: Continuity/Discontinuity Neutrality vs. The Evidence/Authority Distinction**
  *   **The Conflict:** If you claim the AD is *Authoritative*, you usually rely on the idea that it is the *same person* binding themselves. If you admit the demented self is a *different person* (Discontinuity), Authority becomes hard to justify (why does Person A bind Person B?). If you switch to *Evidence* to accommodate Discontinuity, you lose the binding force in the Contented Dementia case.
  *   **Verdict:** You cannot have it both ways. You must tie your normative authority to a specific metaphysical claim, violating Neutrality.

  ---

  ### III. Model Stress Test

  Here is how the two common framings you mentioned fare against the Spec.

  #### Model 1: The Trustee Model (Fiduciary)
  *   **The Framing:** The Earlier Self is a trustee appointed to manage the interests of the "Whole Life." The directive is the execution of that fiduciary duty.
  *   **Passes:**
      *   *Dead Stranger Distinction:* Yes, fiduciary relationships explain why A has power over B's assets (body/life).
      *   *Contented Dementia:* Yes, a trustee can protect long-term assets even if the beneficiary (current self) wants to spend them foolishly.
  *   **Fails:**
      *   *The Value Shift Filter:* A trustee must act in the *best interest* of the beneficiary. If the Grandmother's mellowing represents a genuine increase in well-being, the Trustee (Past Self) is arguably failing their duty by enforcing the stern directive. The model struggles to explain why the Trustee's plan overrides the Beneficiary's current good.
      *   *The Ulysses Extension:* A fiduciary generally cannot harm the beneficiary to fulfill a past instruction. In psychiatric cases, enforcing the AD causes immediate distress to the beneficiary. The Trustee model collapses into a "Best Interests" standard, which often voids the AD.
  *   **Verdict:** Fails **Requirement 4 (Value Shift)** and **Requirement 5 (Ulysses)**. It turns the AD into a Best Interest judgment, losing the "Autonomy" force.

  #### Model 2: The Inter-temporal Contract Model
  *   **The Framing:** The directive is a binding agreement between Time-Slice A and Time-Slice B. Time-Slice B agrees to abide by A's rules in exchange for A's planning.
  *   **Passes:**
      *   *The Ulysses Extension:* Excellent fit. Contracts are designed to bind parties even when they want to renege later.
      *   *Evidence vs. Authority:* Clear. It is authoritative by definition of contract.
  *   **Fails:**
      *   *The "Dead Stranger" / Identity:* Contracts require two consenting parties. If Time-Slice B (demented) lacks capacity, they cannot be a party to the contract. If they are a *different person*, there is no privity of contract.
      *   *The Revocability Condition:* Contract law generally allows for renegotiation if circumstances change fundamentally (frustration of purpose). The model struggles to explain why the "contract" holds in dementia (where circumstances changed radically) but might not hold in other cases.
      *   *The Value Shift Filter:* Contracts don't typically account for "moral mellowing." If I sign a contract and then become a kinder person, the contract still binds. This makes the model too rigid for the Grandmother case.
  *   **Verdict:** Fails **Requirement 1 (Identity)** and **Requirement 4 (Value Shift)**. It creates a tyranny of the past that ignores the metaphysical reality of the present self.

  ---

  ### IV. The "Killer" Requirement

  If you want to know which single requirement knocks out the most theories, it is **Requirement 4: The Value Shift Filter (The Grandmother Constraint).**

  **Why:**
  Almost every theory can handle the "Contented Dementia" case by either prioritizing the Past Self (Dworkin) or the Present Self (Dresser). That is a binary switch.

  However, the Value Shift case requires a *gradient*. It requires the theory to admit that:
  1.  Some changes in preference invalidate the AD (Grandmother mellowing).
  2.  Some changes in preference do *not* invalidate the AD (Dementia contentment).
  3.  Some changes in preference require enforcing the AD *against resistance* (Psychiatric Ulysses).

  **The Collapse:**
  To distinguish (1) from (2) and (3), the theory must have a metric for **Authenticity** or **Endorsement**.
  *   If the metric is *Rationality*, it fails the Psychiatric case (mania is irrational, but so might be a refusal of treatment based on religious conversion).
  *   If the metric is *Stability*, it fails the Grandmother case (her mellowing was stable, just different).
  *   If the metric is *Well-being*, it collapses into Best Interests and loses the Authority of the AD entirely.

  Most dissertation chapters in this area paper over this by assuming the dementia case is "pathological" and the grandmother case is "natural." But that is a biological distinction, not a normative one. Unless your theory can explain *normatively* why one shift in values respects the agent's life-plan and the other betrays it, without simply asserting the conclusion, the theory is incomplete.

  **Recommendation for your Chapter:**
  Don't try to solve the Value Shift Filter perfectly. Instead, structure your chapter to show that *any* adequate theory must pay a cost here.
  *   If you prioritize the AD, you risk tyranny over the mellowed self.
  *   If you prioritize the Current Self, you risk undermining the security of life-planning.
  *   Your contribution should be mapping the *trade-off* explicitly, rather than claiming to have eliminated it. The "Spec" you write should highlight this tension as a feature of the problem, not a bug in your solution.

  This approach moves you from "slinging cases" to "mapping the logical space," which is exactly what a dissertation needs.
