      *   Key Scenarios: Dementia (contented but non-compliant), Religious Conversion (radical value shift), Psychiatric ADs (Ulysses contracts - resisting future self), Mellowing (softening of values without pathology).
      *   Key Concepts: Personal Identity (numerical vs. narrative), Autonomy (critical interests vs. experiential interests), Authority (precedent autonomy vs. current best interest).

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Requirement 1: The Contented Dementia Case.* (Dworkin's Margo). Must explain why a prior refusal binds a currently happy self.
      *   *Requirement 2: The Value Shift Case.* (Grandmother). Distinguish pathological change from natural evolution.
      *   *Requirement 3: The Ulysses/Psychiatric Case.* Binding future resistance.
      *   *Requirement 4: Evidence vs. Authority.* AD isn't just a guess; it's a command.
      *   *Requirement 5: Personal Identity.* If the self changes, does the authority persist?
      *   *Requirement 6: Revocability.* Can the current self override the past self easily?
      *   *Requirement 7: The "Dead Stranger" Problem.* Why isn't the past self just a dead person imposing will?

  4.  **Refining and Categorizing (Non-negotiable vs. Prejudice):**
      *   *Non-negotiable:* Must handle the standard cases (Dementia, Ulysses). Must distinguish evidence from authority (otherwise it's just proxy decision making). Must address identity.
      *   *Prejudice:* "Current self always wins" (contemporary autonomy bias). "Past self always wins" (rigid precedent autonomy). "Identity must be strict numerical identity" (might be too metaphysical for practical ethics).

  5.  **Identifying Tensions (The "Unstable" Part):**
      *   *Tension A:* Respect for Critical Interests (Past) vs. Protection of Experiential Interests (Present).
      *   *Tension B:* Continuity of Identity (needed for authority) vs. Discontinuity (needed to explain why we sometimes override ADs).
      *   *Tension C:* Ulysses Bindingness vs. Right to Change Mind.

  6.  **Testing the Two Models:**
      *   *Model 1: Trustee (Fiduciary).* Past self acts for the "whole life."
          *   *Strength:* Handles critical interests well.
          *   *Weakness:* Fails on Ulysses (trustee shouldn't harm the beneficiary) and Value Shift (trustee assumes static good).
      *   *Model 2: Contract (Inter-temporal).* Agreement between Time-Slice A and Time-Slice B.
          *   *Strength:* Handles Ulysses (binding agreement).
          *   *Weakness:* Fails on Identity (can't contract with non-existent entity) and Revocability (contracts usually require mutual consent to break).

  7.  **Selecting the "Killer" Requirement:**
      *   What kills the most theories? Usually the *Value Shift / Mellowing* case combined with *Authority*. If authority is absolute, mellowing is ignored (bad). If authority is weak, dementia refusal is ignored (bad). The requirement to distinguish *endorsed change* from *unendorsed erosion* is the hardest lift.

  8.  **Drafting the Response (Iterative refinement for tone and structure):**
