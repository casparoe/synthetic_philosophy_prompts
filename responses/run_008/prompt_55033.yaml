prompt: |-
  I do rapid-response communications for a mid-sized human rights org -- the person who drafts the first public statement when something awful starts happening somewhere. A few times a year a situation flares up and within a day or two I have to decide what we CALL it in our press releases and reports: genocide, crimes against humanity, ethnic cleansing, war crimes, or the infinitely deniable "mass atrocities." Our legal counsel then reviews before the director signs off, but the first draft and the framing are mine, and once you put a word in the first press release it's basically impossible to walk back.

  The problem is that the word "genocide" specifically is a legal category with weird edges that everyone on all sides keeps muddying. As I understand it: the Genocide Convention limits protected groups to national, ethnic, racial and religious ones, so political groups and most class-based persecution are out by definition. You need specific acts (killing, serious harm, destroying conditions of life, preventing births, forcibly transferring children) done with special intent to destroy the group as such -- which courts have treated as a very demanding thing, more than just knowingly doing terrible things to a group. Meanwhile Lemkin, who basically invented the concept, thought of it much more broadly, including destroying a group's culture and way of life without mass killing, but that broader conception mostly did NOT make it into the convention. And then there's "ethnic cleansing," which everyone uses loosely but which is not a standalone legal category, more of a description that can slide into genocide depending on what the intent was. On top of all that there's the practical layer: calling something genocide when you can't prove special intent hands deniers a win when a court later disagrees, but NOT calling it genocide is itself a political act with its own history, and "crimes against humanity" is both technically more prosecutable in some ways and rhetorically weaker.

  I need this turned into something I can actually run at 11pm before a 7am statement deadline. Write me a decision procedure -- ordered questions, what counts as enough of an answer to each, where the procedure outputs "insufficient basis, say X instead," and crucially where it has to stop and hand the call to a human because what's left isn't a factual question but a values/strategy question (e.g. whether withholding the word aids denial, whether our org should be in the business of legal conclusions at all vs. documenting facts). Be honest about which steps are judgment calls wearing a labcoat.

  Then run it on three situations. (a) A regional minority is being deported en masse from a contested province -- villages burned, mosques/churches razed, dozens killed in the course of expulsion, aid workers expelled, but killing doesn't seem to be the point so much as getting the land. Half my colleagues want the g-word in the first line. (b) Decades of a state removing an Indigenous group's children to boarding schools with forced language suppression and high death rates -- this is the case where the broader Lemkin conception and the convention's child-transfer clause pull apart, and where our own staff and the affected community call it genocide while a court probably wouldn't on the mass-killing framing. (c) A government blockades a rebellious region where an ethnic group is concentrated and food can't get in, famine deaths climbing -- the leadership clearly knows what blockade plus famine does but frames it as counterinsurgency, so it's a knowledge-vs-purpose problem.

  Tell me where the procedure gives answers I won't like, and what it can't do at all. Also please say how the procedure should handle us being early -- situations where the destruction is clearly underway but evidence is still thin, since "waiting for certainty" is exactly how the phrase "never again" keeps failing. Keep it practical, I'm not a lawyer and never will be.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Rapid-response communications lead for a mid-sized human rights org.
      *   **Task:** Drafting first public statements (press releases/reports) within tight deadlines (11pm to 7am).
      *   **Core Problem:** Deciding on terminology ("Genocide" vs. "Crimes Against Humanity" vs. "Ethnic Cleansing" vs. "Mass Atrocities") under legal, rhetorical, and ethical pressure.
      *   **Constraints:** Needs a practical decision procedure (flowchart-style logic), not a law school lecture. Must acknowledge where legal definitions clash with moral/political realities. Must handle uncertainty/early stages. Must run three specific scenarios.
      *   **Tone:** Professional, pragmatic, honest about limitations ("judgment calls wearing a labcoat"), empathetic to the high-stakes nature of the work.

  2.  **Deconstruct the Legal/Conceptual Landscape (as provided by user + general knowledge):**
      *   *Genocide (UNGC 1948):* Specific intent (*dolus specialis*) to destroy a national, ethnic, racial, or religious group *in whole or in part*. Protected acts: killing, serious harm, conditions of life, preventing births, child transfer. *Excludes* political groups.
      *   *Crimes Against Humanity (Rome Statute):* Widespread/systematic attack against civilians. No specific intent to destroy a group required. Broader scope (political groups included).
      *   *War Crimes:* Violations of laws of war (IHL). Context of armed conflict required.
      *   *Ethnic Cleansing:* Policy term, not a standalone treaty crime. Often a precursor or component of genocide/Crimes Against Humanity.
      *   *Mass Atrocities:* Catch-all, safe, but potentially weak.
      *   *The Tension:* Legal precision vs. Moral urgency vs. Strategic impact (credibility vs. mobilization).

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Goal:* A step-by-step checklist that filters options.
      *   *Structure:*
          1.  Threshold Check (Is it even in the ballpark?).
          2.  Group Check (Does the victim group fit the Convention?).
          3.  Act Check (Do the acts fit the Convention list?).
          4.  Intent Check (The hardest part: Specific Intent vs. Knowledge).
          5.  Strategic/Values Override (Where the human must step in).
          6.  Output Recommendation.
      *   *Crucial Element:* The "Stop and Hand Off" point. The procedure can't make the final call on *strategy*, only on *evidence*.
      *   *Addressing Uncertainty:* Need a "Provisional Labeling" protocol for early stages.

  4.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Don't make it too legalistic. The user isn't a lawyer.
      *   *Fix:* Use plain language for legal tests (e.g., instead of *dolus specialis*, use "Goal vs. Side Effect").
      *   *Critique:* Acknowledge the "Political Group" exclusion explicitly.
      *   *Critique:* Make sure the "Ethnic Cleansing" distinction is clear (it's descriptive, not a charge).
      *   *Critique:* Add a specific step for "Early Stage/Uncertainty."

  5.  **Running the Scenarios:**

      *   **Scenario (a) Deportation/Expulsion:**
          *   *Facts:* Villages burned, religious sites razed, dozens killed, aid expelled. Goal = Land/Expulsion.
          *   *Analysis:* Acts fit (conditions of life, serious harm). Group fits (ethnic/religious). Intent? "Getting the land" vs. "Destroying the group." This is the classic "Ethnic Cleansing" vs. "Genocide" fork.
          *   *Procedure Output:* Likely "Ethnic Cleansing/Crimes Against Humanity" legally, but high strategic pressure for "Genocide."
          *   *Honesty:* This is where the procedure says "Insufficient basis for Genocide" but flags the strategic risk.

      *   **Scenario (b) Indigenous Boarding Schools:**
          *   *Facts:* Child transfer, culture suppression, high death rates, decades long.
          *   *Analysis:* Act fits (forcibly transferring children). Group fits (ethnic/national). Intent? Assimilation vs. Destruction. Lemkin vs. Convention.
          *   *Procedure Output:* Convention technically supports "Genocide" (child transfer clause), but courts often demand physical destruction. Community says Genocide.
          *   *Honesty:* Procedure should lean towards "Genocide" based on the child transfer clause, acknowledging the legal risk is lower here than in mass killing cases.

      *   **Scenario (c) Blockade/Famine:**
          *   *Facts:* Blockade, famine deaths, leadership knows, claims counterinsurgency.
          *   *Analysis:* Act fits (deliberate deprivation). Group fits (ethnic). Intent? Knowledge vs. Purpose.
          *   *Procedure Output:* This is the "Intent" trap. Knowledge $\neq$ Specific Intent.
          *   *Honesty:* Procedure will likely flag this as "Crimes Against Humanity" unless there's direct evidence of purpose to destroy.

  6.  **Addressing the "Uncomfortable Truths" & Limitations:**
      *   Need a section explicitly stating where the procedure fails (e.g., political groups, early evidence).
      *   Need to address the "Never Again" vs. "Credibility" tension.

  7.  **Final Review against User Constraints:**
      *   *11pm deadline?* Keep it scannable.
      *   *Not a lawyer?* Avoid Latin where possible, explain necessary terms.
      *   *Honest about judgment calls?* Yes, highlight the "Red Zone."
      *   *Three scenarios?* Yes.
      *   *Where it gives answers I won't like?* Explicitly state this.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the weight of the role.
      *   *The Tool:* "The 0400 Protocol." (Sounds operational).
      *   *Steps:* Filter 1 (Group), Filter 2 (Acts), Filter 3 (Intent), Filter 4 (Uncertainty).
      *   *The "Red Zone":* Where the human decides.
      *   *Scenario Runs:* Apply the protocol strictly.
      *   *Limitations:* Be blunt.

      *(Self-Correction on Scenario A)*: Be careful not to definitively say "Not Genocide." Say "Evidence points to Ethnic Cleansing/Crimes Against Humanity, Genocide requires higher bar on intent."
      *(Self-Correction on Scenario B)*: Highlight the specific clause about children. That's the legal hook.
      *(Self-Correction on Scenario C)*: Distinguish between "knowing" and "purposing."

  9.  **Final Polish:** Ensure tone is supportive but rigorous. (e.g., "You are the gatekeeper, not the judge.")

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a high-stakes workflow. You are operating in the gap between *legal truth* (what a court can prove beyond reasonable doubt) and *moral truth* (what the world needs to know to act). The procedure below is designed to protect your organization's credibility while maximizing moral clarity. It is not a legal brief; it is a triage tool for 3:00 AM.

  ### The "0400 Protocol": Terminology Decision Procedure

  **Pre-Check:** Do you have at least two independent sources (NGO, UN, credible media, witness testimony) corroborating the core facts?
  *   **No:** Stop. Use "Reports indicate..." or "Allegations of..." Do not label the crime yet. Label the *risk* (e.g., "Risk of mass atrocities").
  *   **Yes:** Proceed to Filter 1.

  ---

  #### Filter 1: The Group Test (The Convention Gate)
  *Question:* Is the targeted group defined primarily by **National, Ethnic, Racial, or Religious** identity?
  *   **Yes:** Proceed to Filter 2.
  *   **No (e.g., Political Opponents, Trade Unionists, Social Class):** **STOP.** You cannot legally use "Genocide" under the 1948 Convention.
      *   *Output:* "Crimes Against Humanity" or "Mass Atrocities."
      *   *Note:* You can quote partners who call it genocide, but your org's voice must use the accurate legal term.

  #### Filter 2: The Act Test (The Convention List)
  *Question:* Is there evidence of at least one of the five specific acts?
  1.  Killing members of the group.
  2.  Causing serious bodily/mental harm.
  3.  Deliberately inflicting conditions of life calculated to bring about physical destruction (e.g., starvation, blocking medicine).
  4.  Imposing measures intended to prevent births (sterilization, banning marriage).
  5.  Forcibly transferring children of the group to another group.
  *   **Yes:** Proceed to Filter 3.
  *   **No (e.g., Cultural destruction only, property damage, displacement without harm):** **STOP.**
      *   *Output:* "Ethnic Cleansing" (descriptive) or "Crimes Against Humanity" (persecution/deportation).
      *   *Note:* Destroying mosques/libraries is cultural genocide (Lemkin), but not legal genocide (Convention). Do not use the G-word alone.

  #### Filter 3: The Intent Test (The "Special Intent" Trap)
  *Question:* Is the *primary purpose* of the violence to **destroy the group as such**, or is it to achieve a military/political goal (land, resources, quelling rebellion) where the group's destruction is a *side effect*?
  *   **Evidence of "Destroy as Such":** Direct statements by leaders ("We must eliminate X"), systematic targeting of infants/elderly non-combatants with no military value, patterns indicating total eradication.
      *   *Verdict:* **Genocide** is legally defensible.
  *   **Evidence of "Side Effect/Displacement":** Violence stops if the group flees, targeting focuses on military-age males or specific strategic locations, leaders claim "counter-terrorism" or "border security."
      *   *Verdict:* **Insufficient basis for Genocide.**
      *   *Output:* "Ethnic Cleansing" (if displacement is the goal) or "War Crimes/Crimes Against Humanity."
  *   **Ambiguous/Mixed:** (Most common). Leaders use dehumanizing rhetoric, but tactics look like counter-insurgency.
      *   *Verdict:* **RED ZONE.** Proceed to "The Handoff."

  #### Filter 4: The Uncertainty Check (The "Early Stage" Clause)
  *Question:* Is the situation evolving rapidly with thin evidence?
  *   **Yes:** Do not lock into a final legal conclusion. Use **Qualifiers**.
      *   *Phrasing:* "Acts consistent with genocide," "Warning signs of genocide," "Risk of genocide."
      *   *Rule:* You can warn of the *risk* of genocide earlier than you can accuse of the *crime* of genocide.
  *   **No:** Proceed to Final Output.

  ---

  #### The Handoff (The Red Zone)
  If Filter 3 returns "Ambiguous" or if Filter 1/2 exclude Genocide but the moral pressure is high, the procedure stops. This is no longer a factual question; it is a **strategic values judgment**.

  **You must wake the Director/Legal Counsel for this decision.** Present them with this brief:
  1.  **Legal Risk:** "We cannot prove specific intent in court based on current evidence."
  2.  **Moral Cost:** "Withholding the term may aid denialists and demoralize victims."
  3.  **Recommendation:** "Use 'Crimes Against Humanity' for precision, BUT amplify victim voices using 'Genocide' in quotes."
  4.  **Decision:** Yes/No on using "Genocide" in the org's voice.

  ---

  ### Scenario Runs

  Here is how the Protocol handles your three cases.

  #### (a) The Deportation/Expulsion (Contested Province)
  *   **Filter 1 (Group):** Ethnic/Religious minority. **Pass.**
  *   **Filter 2 (Acts):** Killing (dozens), Serious Harm, Conditions of Life (villages burned). **Pass.**
  *   **Filter 3 (Intent):** Killing is not the point; expulsion is. Violence stops if they leave. This is the definition of Ethnic Cleansing. Specific intent to *destroy* the group physically is weak; intent to *remove* them is strong.
  *   **Protocol Output:** **Insufficient basis for Genocide.**
  *   **Recommended Phrasing:** "Ethnic Cleansing and Crimes Against Humanity."
  *   **The "Answer You Won't Like":** Your colleagues want the G-word. The Protocol says using it now hands a victory to deniers who will prove the goal was land, not destruction.
  *   **Strategy:** Use "Ethnic Cleansing" prominently. It is legally accurate, rhetorically strong, and describes the *goal* (removal) better than Genocide (which implies death).

  #### (b) Indigenous Boarding Schools (Child Transfer)
  *   **Filter 1 (Group):** Indigenous (National/Ethnic). **Pass.**
  *   **Filter 2 (Acts):** Forcibly transferring children. **Pass.** (This is Article II(e) of the Convention).
  *   **Filter 3 (Intent):** The policy is explicitly to "kill the Indian in the child." The intent is to destroy the group's *continuity*.
  *   **Protocol Output:** **Basis for Genocide exists.**
  *   **Nuance:** Courts often struggle with this because mass killing isn't the primary metric, but the Convention *explicitly* includes child transfer.
  *   **Recommended Phrasing:** "Genocide."
  *   **Why:** This is one of the few cases where the Lemkin view and the Convention align on *acts*, even if the *killing* metric is lower. The affected community's definition aligns with the specific child-transfer clause.

  #### (c) The Blockade/Famine (Counterinsurgency)
  *   **Filter 1 (Group):** Ethnic concentration. **Pass.**
  *   **Filter 2 (Acts):** Deliberately inflicting conditions of life (starvation). **Pass.**
  *   **Filter 3 (Intent):** Leadership claims counterinsurgency. They *know* famine will happen (Knowledge), but is it their *purpose* (Specific Intent)?
  *   **Protocol Output:** **RED ZONE / Insufficient for Genocide.**
  *   **The Trap:** This is the "Knowledge vs. Purpose" problem. International courts rarely convict on Genocide for famine unless there are statements proving the starvation was the *goal*, not just a tolerated cost of war.
  *   **Recommended Phrasing:** "War Crimes and Crimes Against Humanity." Use "Starvation as a weapon of war."
  *   **Strategy:** "Starvation" is visceral. You don't need the G-word to mobilize outrage here. Using "Genocide" without proof of purpose risks credibility if the blockade is lifted later.

  ---

  ### Limitations & Honest Truths

  **1. Where the Procedure Fails (The "Political Group" Gap)**
  If a government massacres a political opposition (e.g., communists, unionists, pro-democracy activists), this Protocol *forces* you to say "Crimes Against Humanity."
  *   **The Pain:** Victims will call it genocide. You will look like you are minimizing it.
  *   **The Fix:** You must explain *why* in the footnote or Q&A. "While the legal definition of genocide excludes political groups, the scale and intent match the moral horror of genocide." Do not break the legal definition; explain its flaw.

  **2. The "Early Stage" Dilemma**
  You asked how to handle "destruction clearly underway but evidence thin."
  *   **The Rule:** Label the **Pattern**, not the **Crime**.
  *   **Bad:** "This is genocide." (Too early, high retraction risk).
  *   **Good:** "We are witnessing warning signs of genocide." (Accurate, mobilizes action, protects credibility).
  *   **Why:** The Genocide Convention includes a duty to *prevent*. You can call for prevention based on risk without needing proof of completed intent.

  **3. The "Judgment Calls Wearing a Labcoat"**
  Filter 3 (Intent) is the weakest link. No algorithm can truly read a regime's mind.
  *   **The Reality:** When you decide "Intent is ambiguous," you are making a political calculation about your org's risk tolerance.
  *   **The Mitigation:** Always attribute the strongest claims. "Community leaders describe this as genocide. Legal experts note the threshold for proof remains..." This allows you to report the moral truth without signing the legal affidavit.

  **4. What This Cannot Do**
  It cannot solve the "Credibility vs. Mobilization" trade-off.
  *   If you say "Genocide," you mobilize the base but risk future retraction.
  *   If you say "Atrocities," you protect credibility but risk apathy.
  *   **The Protocol's Limit:** It tells you when you *can* legally say it. It cannot tell you if you *should* strategically say it when the legal case is 51% strong. That is the Director's call, not yours.

  ### Summary for the 7 AM Deadline

  1.  **Check the Group:** Political? $\rightarrow$ No Genocide.
  2.  **Check the Act:** No killing/conditions/children? $\rightarrow$ No Genocide.
  3.  **Check the Intent:** Displacement/Counter-insurgency? $\rightarrow$ Likely Ethnic Cleansing/War Crimes.
  4.  **Check the Evidence:** Thin? $\rightarrow$ "Risk of" / "Warning signs."
  5.  **If Stuck:** Wake the Director. Present the risk.

  **Final Advice:** In the gray areas, "Crimes Against Humanity" is your best friend. It covers murder, deportation, torture, and persecution against *any* civilian population (including political groups) without the impossible burden of proving "intent to destroy." It is legally robust, morally heavy, and rarely successfully challenged in the court of public opinion.
