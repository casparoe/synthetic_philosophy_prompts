  My bowl is heaped with warm and broken bread,
  No lash has raised a welt upon my hand;
  The master nods when I approach and stand
  To hear the gentle words that he has said.
  I sleep secure beneath a roof overhead,
  The hired man toils until he drops his head,
  And begs for coin across this hungry land;
  I lack for nothing that I might demand,
  So by the count of blows, I am well-fed.

  Yet this account ignores the lack of right,
  For nothing here is owed by bond or law;
  The grain is his to give or withdraw,
  And leaves me subject to the master's might.
  For freedom is not kindness from the strong,
  But where no master holds the right to wrong.
