answer: |-
  Here is a complete lesson plan designed for a 50-minute seminar. It prioritizes the experiential gap between *binding commitment* and *mere prediction*, which is the core philosophical tension in Parfit's case.

  # Game Title: The Desert Crossing

  **Class Size:** 14 Students
  **Time:** 50 Minutes
  **Materials:** 
  *   Two colors of index cards or slips of paper (e.g., Blue for Round 1, Red for Round 2).
  *   A "Leaderboard" on the whiteboard (Student Initials + Score).
  *   A box or hat for collecting slips.

  ## 1. Payoff Scheme (Write on Board)
  Keep the math simple so they calculate dominance instantly.

  *   **Starting Score:** 0 points.
  *   **Outcome A (Left in Desert):** 0 points.
  *   **Outcome B (Reach Town & Pay Fare):** 60 points (100 for survival - 40 cost).
  *   **Outcome C (Reach Town & Don't Pay):** 100 points (100 for survival - 0 cost).
  *   **Commitment Penalty:** If you sign a Binding Contract in Round 1 and do *not* pay, you are fined 50 points. (Net: 100 - 50 = 50 points).

  **Rationality Check:** 
  *   **With Contract:** Paying (60) > Not Paying (50). *Rational to Pay.*
  *   **Without Contract:** Not Paying (100) > Paying (60). *Rational to Defect.*

  ---

  ## 2. Timing & Procedure

  ### Introduction (5 Minutes)
  1.  **Scenario:** Explain the Parfit Hitchhiker setup. You are the Driver. They are the Hitchhikers. You are a psychologist who can predict intentions with high accuracy, but you are not a mind-reader.
  2.  **Goal:** Maximize individual points. Top 3 scores get a small prize (candy/privilege) or just bragging rights.
  3.  **The Driver's Rule:** "I will only pick you up if I believe you will pay me at the destination. If I think you will defect, I leave you in the desert."

  ### Round 1: The Binding Contract (10 Minutes)
  *Goal: Demonstrate that changing the payoff structure solves the problem.*

  1.  **Distribution:** Hand out **Blue Slips**.
  2.  **The Mechanism:** Tell them: "On this slip, write your name and 'I AGREE TO PAY.' Sign it. This is a **Binding Contract**. If you reach town and refuse to pay, I will enforce the contract and deduct the 50-point penalty."
  3.  **Action:** Collect slips. 
  4.  **The Rescue:** Announce: "Everyone signed. I am picking everyone up." (Skip the prediction phase here to save time; the contract *is* the guarantee).
  5.  **The Choice:** Hand out "Town Decision" cards. They choose **PAY** or **DEFECT**.
  6.  **Resolution:** Collect cards. Reveal scores. 
      *   *Expected Outcome:* Almost everyone pays. 
      *   *Board Update:* Write "60" next to everyone's name.

  ### Round 2: The Prediction Problem (15 Minutes)
  *Goal: Replicate the Parfit tension. No enforcement, only prediction.*

  1.  **Distribution:** Hand out **Red Slips**.
  2.  **The Mechanism:** "This time, there is **no contract**. No penalty. Write your name and what you **intend** to do if I save you (PAY or DEFECT). Seal it in an envelope/fold it."
  3.  **The Prediction (Crucial Step):** 
      *   Collect the Red Slips. 
      *   **Instructor Script:** "I am now the Driver. I am looking at your stated intentions. In the real thought experiment, I read your mind. Here, I read your note. **My Rule:** If the note says DEFECT, I leave you in the desert (0 points). If the note says PAY, I drive you to town."
      *   *Theatrical Pause:* Sort the slips visibly. "Okay, I'm leaving the defectors behind. The rest of you are in town."
  4.  **The Choice:** Hand out "Town Decision" cards *only* to those "rescued."
      *   **Instruction:** "You are now in town. The contract is void. Your note was just cheap talk. Choose PAY or DEFECT to maximize your points."
  5.  **Resolution:** 
      *   Collect cards. 
      *   **Reveal:** Ask for a show of hands. "Who wrote PAY on the note but chose DEFECT in town?" (Expect many hands). "Who wrote DEFECT on the note?" (Expect few, as they knew they'd be left behind).
      *   **Board Update:** 
          *   Those left in desert: 0.
          *   Those who Paid: 60.
          *   Those who Defected: 100.

  ### Debrief & Discussion (20 Minutes)
  *Do not lecture. Use the board data to drive the conversation.*

  **Phase 1: The Data (5 mins)**
  *   "Look at the board. In Round 1, almost everyone got 60. In Round 2, who got the highest score?" (The defectors: 100).
  *   "Who got the lowest score?" (The honest predictors who wrote DEFECT and were left behind: 0).
  *   "Who feels frustrated right now? Why?" (Likely those who wrote PAY, got rescued, paid, and saw others get 100).

  **Phase 2: The Rationality Trap (10 mins)**
  *   **Question:** "In Round 2, once you were in town, was it rational to pay?"
      *   *Target Answer:* No. Dominance. The money is gone either way. Paying costs 40 points for no gain.
  *   **Question:** "If it's irrational to pay in town, why did the Driver leave some people behind?"
      *   *Target Answer:* Because the Driver predicts you won't pay.
  *   **Question:** "So, to get rescued, you need to be the *kind of person* who does something irrational later. How do you become that person without a contract?"
      *   *Discussion:* This is the bridge to Parfit. You need a disposition that overrides standard dominance reasoning *in the moment*.

  **Phase 3: Connecting to Theory (5 mins)**
  *   **CDT (Causal Decision Theory):** "CDT says: My choice in town doesn't cause the rescue. The rescue already happened. So don't pay." (Result: Left in desert).
  *   **EDT/FDT (Evidential/Functional):** "These theories say: Your choice in town is *evidence* of what you would have predicted earlier. If you defect now, you are the kind of person who would have been left behind."
  *   **Commitment:** "Round 1 showed us the engineering solution. If you can't change your mind, you don't need to. You just change the payoffs."

  ---

  ## 3. Predictable Pitfalls (And How to Handle Them)

  **1. The "Liar's Advantage" (Most Likely)**
  *   **What happens:** Students will write "PAY" on the Red Slip to get rescued, then choose "DEFECT" in town to get the 100 points.
  *   **Why this is good:** This *is* the lesson. It proves that without commitment, "intentions" are cheap talk. 
  *   **How to handle:** Don't scold them. Highlight it. "This student successfully gamed the prediction mechanism. But what happens if *everyone* does this?" (Answer: The Driver stops believing notes and leaves everyone in the desert). This leads to the breakdown of trust/cooperation.

  **2. The "Spiteful Driver"**
  *   **What happens:** A student writes "DEFECT" on the note out of principle or to test you.
  *   **How to handle:** Stick to your rule. Leave them in the desert (0 points). If they complain, say: "The Driver is an algorithm. You signaled 'Defect', so you got 0. This shows why signaling defect is costly."

  **3. Collusion**
  *   **What happens:** Students whisper and agree to all defect to "beat the system."
  *   **How to handle:** Remind them it's an individual score. If they all defect, you (the Driver) will announce: "I predict universal defection. I am picking up no one." (You must be willing to follow through on this threat for it to work).

  ---

  ## 4. Limitations (For the Debrief)

  Be honest about where the simulation fails. This builds trust and deepens the philosophy.

  **1. The Prediction Mechanism is Fake**
  *   **Reality:** In Parfit's case, the Driver predicts based on your *psychology/character* before you even speak.
  *   **Game:** They wrote a note *after* knowing the rules. They could lie on the note.
  *   **Teaching Point:** "In the game, you could lie on the Red Slip. In the real thought experiment, you cannot lie to a mind-reader about your disposition. The question Parfit asks is: Can you *cultivate* a disposition that pays, even when it's costly? The game simulates the *pressure*, but not the *epistemology*."

  **2. One-Shot vs. Repeated**
  *   **Reality:** We played once.
  *   **Game:** In real life, reputation matters.
  *   **Teaching Point:** "If we played this 10 times, would you defect in Round 2?" (Students will say no, to build reputation). "Parfit's case is interesting precisely because it's often framed as a one-off scenario where reputation doesn't save you."

  **3. The "Contract" is External**
  *   **Reality:** Precommitment in real life (e.g., Ulysses binding himself to the mast) requires external enforcement.
  *   **Teaching Point:** "Round 1 worked because *I* enforced the contract. The hard philosophical problem is: How do you precommit when no one is watching? That's where 'Rationality as Disposition' comes in."

  ## 5. Instructor Cheat Sheet (Summary)

  *   **0:00-0:05:** Setup & Payoffs.
  *   **0:05-0:15:** Round 1 (Blue Slips/Contract). Enforce penalties if anyone defects (unlikely).
  *   **0:15-0:30:** Round 2 (Red Slips/Prediction). **Crucial:** Sort slips visibly. Leave "Defect" writers behind. Let "Pay" writers defect in town.
  *   **0:30-0:50:** Debrief. Focus on the tension between *ex-ante* rationality (wanting to be rescued) and *ex-post* rationality (wanting to keep money).

  This plan ensures they feel the frustration of the "rational defector" who gets left behind, and the "rational payer" who loses points, setting the stage perfectly for Parfit's solution.
