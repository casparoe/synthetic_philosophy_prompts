      *   **Background:** Students know basic decision theory (dominance, EU) but haven't read Parfit.
      *   **Core Task:** Design an in-class game based on Parfit's Hitchhiker.
      *   **Key Requirement:** Two rounds.
          *   Round 1: Commitment device available (binding).
          *   Round 2: No commitment device (prediction mechanism only).
      *   **Goal:** Students feel the difference between precommitment and mere intention/prediction.
      *   **Deliverables:** Rules, Payoff Scheme (points), Timing (50 mins), Debrief (interactive, not lecture), Predictable Pitfalls, Limitations of the simulation.

  2.  **Deconstruct Parfit's Hitchhiker:**
      *   *The Scenario:* Agent is dying in desert. Driver passes. Driver is a mind-reader (or very good predictor). Driver only saves Agent if Agent will pay $1000 upon reaching town. Once in town, Agent has no incentive to pay (dominance). If Driver predicts Agent won't pay, Driver leaves Agent.
      *   *The Rationality Puzzle:* Causal Decision Theory (CDT) says don't pay (dominance). Evidential Decision Theory (EDT) or Functional Decision Theory (FDT) says intend to pay (to get saved). Precommitment solves it by changing the payoff structure.
      *   *The Classroom Challenge:* I cannot actually read minds. I need a proxy for "prediction."

  3.  **Drafting the Game Mechanics:**

      *   *Roles:* Hitchhikers (Students) vs. Drivers (Instructor or Selected Students?).
          *   *Option A:* Instructor is the Driver. This ensures consistency but removes the "prediction" tension between peers.
          *   *Option B:* Students pair up. One Hitchhiker, One Driver. This scales better for 14 students (7 pairs). It makes the "prediction" a social game.
          *   *Decision:* Let's go with **Instructor as Driver** for consistency and speed, *but* use a mechanism that simulates prediction. Actually, for 14 students, having them play against *each other* is more engaging. Let's try 7 pairs. Wait, if they switch roles, it takes too long.
          *   *Revised Decision:* **Instructor as Driver.** Why? Because the "prediction" needs to be credible. If a student is the driver, they might just collude or act randomly. The Instructor can claim "I know your psychology" or use a heuristic.
          *   *Wait, better idea:* To simulate the *prediction* without mind-reading, use a **Pre-Game Survey** or a **Simultaneous Reveal**.
          *   *Best Mechanism for "Prediction":* The "Driver" (Instructor) makes a decision to "Pick Up" or "Leave" based on a signal from the Hitchhiker.
          *   *Refining the "Prediction":* In Parfit, the prediction happens *before* the rescue. In class, we need to simulate the *credibility* of the promise.
          *   *Round 1 (Commitment):* Students sign a contract/deposit points *before* the rescue decision.
          *   *Round 2 (No Commitment):* Students just say "I promise." The Instructor (Driver) decides to rescue based on how convincing they are (or a fixed rule).
          *   *Actually, to make it a game:* The "Driver" needs to be an algorithm or a fixed rule to avoid bias accusations.
          *   *Let's try this:*
              *   **Round 1 (Binding):** Students put 10 points in an envelope. If they reach "Town," they can keep it (defect) or give it to Instructor (cooperate). *Wait, if it's binding, they can't keep it.* Okay, they sign a contract enforced by the "university" (Instructor). If they defect, they lose massive points.
              *   **Round 2 (Non-Binding):** Students write a note "I will pay." Instructor decides to "Rescue" based on the note. Then students decide to Pay or Not.
              *   *Problem:* If the Instructor decides based on the note, students will just write "I promise." The Instructor needs a way to *predict*.
              *   *Solution:* Use a **Calibration Phase**. Before Round 2, ask them a hypothetical: "If you were in the desert, would you pay?" Record answers. Use this to "predict" their behavior in the actual game. Or, simpler: The Instructor acts as a *perfect predictor* for the sake of the game logic, *except* when the game mechanics prevent it.
              *   *Better Solution for "Prediction":* **The Trust Mechanism.**
              *   *Round 1 (Commitment):* Students place a "bond" (points) with the Instructor *before* being "rescued." If they don't pay later, they lose the bond. (This makes paying rational).
              *   *Round 2 (No Commitment):* Students state intention. Instructor "predicts." If Instructor predicts "No Pay," Student gets 0 (dies). If Instructor predicts "Pay," Student goes to Town. In Town, Student chooses Pay or Don't.
              *   *How does Instructor predict?* Honesty is key here. Tell them: "I will look at your face/answer. If I think you're bluffing, I leave you." This is weak.
              *   *Stronger Mechanism:* **The "Psychic" Envelope.**
              *   Round 2: Students write "PAY" or "DON'T" on a slip, seal it in an envelope. This represents their *true disposition* (the thing the Driver predicts). The Instructor collects these *first*. Then, the Instructor acts as the Driver: "I open the envelope. If it says DON'T, I leave you in the desert (0 points). If it says PAY, I drive you to town." *Then* the student actually makes the choice in town.
              *   *Wait, that removes the choice in town.* If the envelope binds them, it's Round 1.
              *   *Correction:* The envelope represents the *Driver's Prediction*.
              *   *Let's simplify:*
                  *   **Round 1 (Commitment):** Students sign a binding contract. They *must* pay. Payoff: High.
                  *   **Round 2 (No Commitment):** Students make a cheap-talk promise. The Instructor (Driver) decides to rescue based on a *randomized strategy* that mimics prediction accuracy, OR (better) the Instructor explains: "In this round, I am a perfect predictor. If you *plan* to defect, I leave you." But they can lie about their plan.
                  *   *Okay, the most robust way to simulate Newcomb/Parfit without mind reading:* **The "Dispositional" Reveal.**
                  *   Step 1: Students write down what they *would* do in the desert (True Disposition). Seal it.
                  *   Step 2: Instructor collects. "I am the Driver. I can read these." (Metaphorically).
                  *   Step 3: Instructor returns them. "I rescued everyone whose note said PAY. I left everyone whose note said DON'T."
                  *   Step 4: Now, those rescued actually choose: Pay or Don't.
                  *   *Problem:* If they wrote PAY to get rescued, they can still defect in Step 4. This captures the Parfit tension perfectly. The "Prediction" was the note. The "Action" is the final choice.
                  *   *Refinement:* To make the prediction credible, the Instructor must commit to a rule: "I will only rescue if the note says PAY."

  4.  **Developing the Payoff Structure:**
      *   Need points that matter (grade bonus? candy? just bragging rights?). Let's use "Rationality Points" (RP) convertible to a small prize or just leaderboard.
      *   *State 1: Desert.* 0 RP.
      *   *State 2: Town (Rescued).*
          *   If Driver leaves you: 0 RP.
          *   If Driver saves you & You Pay: 10 RP (Survival - Cost).
          *   If Driver saves you & You Don't Pay: 20 RP (Survival + Free Ride).
      *   *Commitment Round:* If you sign contract, you *must* pay or lose 50 RP (penalty). So Paying = 10, Not Paying = -40. Rational to Pay.
      *   *No Commitment Round:* Pay = 10, Don't = 20. Rational to Don't (Dominance). But if Driver predicts Don't, you get 0.

  5.  **Timing (50 Minutes):**
      *   Intro/Rules: 5 mins.
      *   Round 1 (Commitment): 10 mins (Setup, Decision, Reveal).
      *   Round 2 (No Commitment): 15 mins (Setup, "Prediction", Decision, Reveal).
      *   Debrief/Discussion: 20 mins.

  6.  **Addressing the "Predictable Pitfalls":**
      *   *Gaming the Prediction:* In Round 2, students will write "PAY" to get rescued, then choose "DON'T" to maximize points. This *is* the point of the game (time inconsistency), but if *everyone* does it, the "Driver" looks foolish.
      *   *Mitigation:* The Instructor must pre-commit to a prediction rule. "I will check your past behavior" or "I will audit 50%." Or, acknowledge that in the game, the Driver *failed* because they aren't a real mind-reader, which highlights the need for commitment.
      *   *Better:* In Round 2, the "Prediction" is based on a *prior* question asked before they knew the payoffs. (Too complex).
      *   *Best:* Acknowledge the limitation. The game works if some students feel guilt/honor and pay, while others defect. The tension is the lesson.

  7.  **Addressing the "Limitation":**
      *   Real Parfit: Driver predicts *before* interaction.
      *   Game: Students write note *knowing* the rule.
      *   Fix: In debrief, explain that in the real thought experiment, the prediction is based on your *character*, not your specific note. The note is a proxy for character.

  8.  **Refining the Debrief:**
      *   Don't lecture. Use Socratic questioning.
      *   "Who defected in Round 2? Why?"
      *   "Who wrote PAY but defected? How did you feel?"
      *   "What did the Commitment Round change?"
      *   Connect to CDT vs. EDT/FDT.

  9.  **Final Polish of Rules:**
      *   Make sure the Commitment Device is tangible (Signed slip + "Penalty" enforced by Instructor).
      *   Make sure the Prediction Mechanism is clear (Sealed Note = Driver's View).
      *   Ensure Payoffs are clear on the board.

  10. **Self-Correction/Review:**
      *   *Wait, 50 minutes is tight.* 14 students.
      *   Round 1: Hand out "Contract" slips. 2 mins. Decide. 3 mins. Reveal. 2 mins.
      *   Round 2: Hand out "Prediction" slips. 2 mins. Collect. Instructor "Reviews" (theatrical pause). 3 mins. Return "Rescue" status. Decide Pay/No Pay. 5 mins. Reveal. 5 mins.
      *   Debrief: 25 mins.
      *   *Risk:* Students might collude. "Let's all defect."
      *   *Mitigation:* Individual payoffs.
      *   *Risk:* Students feel cheated if Instructor "predicts" arbitrarily.
      *   *Mitigation:* Be transparent. "In this simulation, I am bound by the note. If you wrote PAY, I rescue. If DON'T, I leave." This makes the *student's* future choice the variable, not the Instructor's whim.
      *   *Wait, if I am bound by the note, then the note IS a commitment.*
      *   *Crucial Distinction:* In Round 2, the note is *not* binding. It is only used for the "Rescue" decision. Once rescued, they can ignore the note. In Round 1, the note *is* binding (Instructor enforces payment).
      *   *Yes, that works.* Round 1: Note + Enforcement. Round 2: Note + No Enforcement.

  11. **Drafting the Content:** (Mental Outline)
      *   Title: The Desert Crossing.
      *   Payoffs: Survival (100) - Cost (40) = 60. Free Ride = 100. Death = 0.
      *   Round 1: Contract. If you sign, you *must* pay.
      *   Round 2: Promise. Driver predicts based on promise. Then you choose.
      *   Debrief questions.
      *   Pitfalls: "Lying to the Driver."
      *   Limitation: Real prediction is about character, not a slip of paper.

  12. **Final Review against constraints:**
      *   14 students? Yes.
      *   50 mins? Yes.
      *   Two rounds (Commitment vs. No)? Yes.
      *   Payoff scheme? Yes.
      *   Debrief plan? Yes.
      *   Pitfalls/Limitations? Yes.

      *Wait, one nuance:* In Parfit, the Driver predicts *before* meeting the Hitchhiker. In my game, they write the note *to* the Driver.
      *Adjustment:* To make it closer to Parfit, in Round 2, ask them to write down what they *would* do *before* explaining the Rescue Rule.
      *Actually, that's too confusing for 50 mins.*
      *Compromise:* Explain the scenario. Tell them the Driver "reads intentions." The slip represents their intention. The Driver rescues based on the slip. The *catch* is the slip isn't legally binding in Round 2. This captures the *spirit* (time inconsistency) even if the *epistemology* (how prediction works) is simplified. I will address this simplification in the "Limitations" section.

      *Let's refine the Payoff Numbers:*
      *   Start: 0.
      *   Die in Desert: 0.
