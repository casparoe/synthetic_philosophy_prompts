      *Decision:* I will identify the specific pairs that clash. (1-3), (3-6), (4-5), (2-5). I will explicitly mention that others (like 1-6) are consistent.

      *Refining the "Peeking" argument:*
      (1) says updating as data arrives is legitimate.
