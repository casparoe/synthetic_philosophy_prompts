      *   *The "Peeking" Contradiction:* Position (1) says sequential updating is fine (Bayesian). Position (3) says peeking invalidates the test (Frequentist). Position (6) says stopping rules shouldn't matter (Likelihood Principle/Bayesian). This is the biggest flashpoint.
      *   *The Prior Contradiction:* Position (1) says Bayes is rational. Position (2) says don't use informative priors in science. Position (5) says switch to Bayes for science. If science switches to Bayes but uses flat priors (per 2), does it solve the problems in (4)?
      *   *The Crisis Diagnosis:* Position (4) blames flexibility. Position (5) suggests Bayes. But Bayes allows flexibility (per 1 & 6). Does (5) actually fix (4) if (2) restricts priors?

  3.  **Pairwise Analysis Strategy:**

