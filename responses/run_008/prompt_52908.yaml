      These are directly contradictory *if* "invalidates" means "epistemically unsound." If "invalidates" means "violates the error control guarantees of the specific Frequentist test being run," they are consistent. The user says "I mean that as a claim about right practice, not merely as company policy." This suggests an epistemic claim. This is the crux.

