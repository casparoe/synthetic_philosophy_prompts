  I'm taking a philosophy of mind seminar this semester, and our unit on self-models and consciousness recently touched on Hofstadter's ideas about self-reference and "strange loops." The professor mentioned Gödel, Escher, Bach only in passing, so I picked up a popular science book on consciousness (I'd rather not say which one, since my question is about a specific chapter's fairness, and I don't want to just dunk on the author by name) to get more background. The chapter's summary of Hofstadter went roughly like this:

  "Hofstadter's favorite image is Escher's Drawing Hands, the print where two hands emerge from the paper and sketch each other. He calls this a tangled hierarchy: instead of a clean chain where one level acts on the level below, the levels loop around so that neither is really on top. This is his model of the self. In the brain, symbols acquire their meaning by referring to one another, and the self is nothing but the special symbol that refers to itself, so the 'I' is really a circular construction rather than a thing. Since Gödel proved that any sufficiently powerful formal system can turn around and talk about its own rules, and thereby escape those rules, Hofstadter concludes that the mind, being such a system, can never be fully described from the outside — no objective science of consciousness is possible in principle. And unlike the Escher print, where the paper and the artist sit outside the loop and quietly anchor it, the brain has no such outside level at all: everything in it is tangled together, which is why Hofstadter says the self is ultimately an illusion."

  Something about this bothers me. In seminar we spent a while on the idea that for Hofstadter the interesting feature of Escher's circular prints is precisely that they are not fully circular — that there's an untouched or "inviolate" level, like the paper itself or Escher's own hand drawing the whole scene — and the book's last sentence seems to flatten exactly that distinction. I'm also unsure whether the Gödel point is being used the way Hofstadter actually uses it; my vague memory is that he leans in almost the opposite direction from the classic "mathematics proves minds beat machines" argument, but I haven't read GEB cover to cover and could be wrong.

  Could you go through the summary sentence by sentence (or at least claim by claim) and tell me: (1) which parts a careful reader of Hofstadter would accept as accurate; (2) which parts involve a conflation, an overstatement, or a misattribution of a claim Hofstadter explicitly argues against; (3) whether the two big conclusions of the summary — that no objective science of consciousness is possible, and that the brain contains no inviolate level at all — actually follow from the parts that are accurate, or whether they're artifacts of the errors. No citations or reading lists, please; I just want the conceptual audit. Please end with a final line of the form "Verdict:" followed by exactly one of the four labels: "FAIR", "MOSTLY FAIR", "MISLEADING", or "BADLY WRONG", plus a short phrase naming the single worst problem if any.
