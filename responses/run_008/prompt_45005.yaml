      *   *Check:* Safety vs. Sensitivity. Sensitivity: $\neg p \to \neg B(p)$. Safety: $B(p) \to p$. They are contrapositives only if we assume modal stability that doesn't hold across the relevant world sets. They have different closure properties. Safety preserves closure better than Sensitivity. Conflating them is a serious error.
