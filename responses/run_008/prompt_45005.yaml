          *   *S3:* The Closure/Skepticism mechanism is garbled. Nozick denies knowledge of $\neg$BIV. The notes imply you get it via deduction.
          *   *S4:* The "small price" rhetoric. Nozick was candid about the cost, but the notes minimize the theoretical damage.
      *   **Key Conceptual Distinctions:**
          *   Sensitivity (Tracking) vs. Safety (Williamson/Pritchard).
