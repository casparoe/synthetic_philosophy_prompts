          *   Final paragraph: Ethical-first vs. Market-rate approaches (max 1 paragraph).
          *   Tone: Analytical, rigorous, avoiding shouting numbers.

  2.  **Deconstruct the Requirements (The "Spec"):**

      *   *Requirement 1: Intergenerational Impartiality (No Pure Time Preference).*
          *   *Argument:* Ramsey (1928) called pure time preference "ethically indefensible." If we value a life less just because it happens later, that's discrimination by date of birth.
          *   *Status:* Non-negotiable for ethical frameworks (utilitarian), but often violated in market frameworks.
          *   *Nuance:* Extinction risk acts as a probability discount, not a pure rate discount.

      *   *Requirement 2: Time Consistency.*
          *   *Argument:* If the plan changes simply because time has passed (without new info), policy becomes dynamically inconsistent. Exponential discounting is time-consistent. Hyperbolic/declining rates can lead to procrastination.
          *   *Status:* Non-negotiable for *implementation*, but ethically tricky.
          *   *Nuance:* Weitzman (2001) shows uncertainty about the rate leads to declining effective rates, which *looks* time-inconsistent but isn't if uncertainty is resolved correctly.

      *   *Requirement 3: Extreme Behavior (Dictatorship vs. Paralysis).*
          *   *Argument:* Constant positive rate $\to$ future value goes to zero (Present Dictatorship). Zero/Negative rate $\to$ infinite present value of future flows (Tyranny of the Future/Paralysis).
          *   *Status:* Non-negotiable (must be usable).
          *   *Nuance:* Need a rate that allows trade-offs without rendering the future negligible or the present irrelevant.

      *   *Requirement 4: The Elasticity Parameter ($\eta$) Clarity.*
          *   *Argument:* In Ramsey $r = \delta + \eta g$. $\eta$ is curvature of utility. It implies aversion to inequality across time, risk aversion, and willingness to substitute consumption. Using one number for all three is risky.
          *   *Status:* Camp Preference (Technical honesty).
          *   *Nuance:* Need to separate risk aversion from intertemporal substitution (Epstein-Zin preferences) if possible, but standard CBA lumps them.

      *   *Requirement 5: Numeraire Consistency (Dollars vs. Lives vs. Ecosystems).*
          *   *Argument:* Discounting monetary flows (market rate) is different from discounting physical/biological impacts (ethical rate). If climate damages are non-marginal, standard discounting breaks.
          *   *Status:* Non-negotiable for coherence.
          *   *Nuance:* Relative price effects (environmental goods become scarcer, so their value rises relative to consumption).

  3.  **Identify Joint Unsatisfiability (The "Smell Test"):**
      *   *The Trilemma:* You generally cannot have (1) No Pure Time Preference ($\delta=0$), (2) Positive Economic Growth ($g>0$), and (3) Market-consistent Discount Rates ($r \approx 3-5\%$) simultaneously without implying implausibly high inequality aversion ($\eta$).
      *   *The Consistency vs. Uncertainty Problem:* Time consistency usually demands exponential discounting. But handling deep uncertainty about future rates (Weitzman) demands declining discount rates. Reconciling these requires careful treatment of resolution of uncertainty.
      *   *The Infinity Problem:* If $\delta=0$ and $g=0$ (or negative), the integral diverges. You can't sum infinite utility.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the frustration. The number is the output, not the input.
