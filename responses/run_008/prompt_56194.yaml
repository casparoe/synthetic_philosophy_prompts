      *   *Section 2: Impossibility/Trade-offs.* Focus on the Ramsey Equation constraints and the Time-Consistency vs. Uncertainty tension.
      *   *Section 3: Ethical vs. Market.* Keep it tight (one paragraph).

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Time Consistency:* Be careful not to say declining rates are *always* time-inconsistent. Weitzman showed that if the uncertainty is about a constant but unknown rate, the *effective* rate declines, and this can be time-consistent if the uncertainty resolves appropriately. I need to make sure this distinction is clear so I don't mislead.
      *   *Correction on Extinction:* The prompt asks about extinction risk. This isn't pure time preference; it's a probability of the future existing. $r_{effective} = r + \text{hazard rate}$. This preserves impartiality while acknowledging risk.
      *   *Correction on Elasticity:* Explicitly mention Epstein-Zin-Weil as the technical fix for separating risk and substitution, even if CBA rarely uses it.
      *   *Correction on Numeraire:* Mention "relative price effects." If the environment gets scarcer, its shadow price rises. Discounting the physical unit at the consumption rate is wrong if they aren't perfect substitutes.

  6.  **Final Review against Constraints:**
