  7.  **Final Polish:** Check the "No pure time preference" logic. If $\delta=0$, and $g>0$, then $r = \eta g$. If we observe $r=4\%$ and $g=2\%$, then $\eta=2$. Is that plausible? Yes. But if we want low $r$ for climate, we need low $\eta$ or low $g$. If $\delta=0$ is non-negotiable, then $r$ is determined by growth and inequality aversion. This creates the tension with market rates.

      *Wait, one nuance on Time Consistency:* Standard hyperbolic discounting is time-inconsistent. Declining discount rates due to *parameter uncertainty* (Weitzman) are time-consistent *ex-ante* but look inconsistent *ex-post* if you don't update the distribution correctly. I will frame this as a tension between *structural form* (exponential) and *uncertainty handling* (declining).

      *Let's write.*
answer: |-
  Here is the specification for a social discount function intended for intergenerational analysis, broken down by requirement, justification, and negotiability, followed by the impossibility results and the comparative summary.

  ### The Specification

  **1. Intergenerational Impartiality (No Pure Time Preference)**
  *   **The Argument:** Following Ramsey (1928) and Pigou, a pure rate of time preference ($\delta$) discriminates against future persons simply because of their date of birth. If we accept persons as morally equal regardless of when they exist, $\delta$ must be zero. The only justification for valuing the present more is the probability that the future might not exist (extinction risk) or that future generations will be richer (diminishing marginal utility).
  *   **Status:** **Non-negotiable** for ethical frameworks (utilitarian/Ramsey); **Camp Preference** for market-based frameworks (which treat $\delta$ as revealed preference).
  *   **Extinction Risk Note:** This is not pure time preference. It is a hazard rate ($h$). If there is a 1% annual chance of human extinction, future utility is discounted by that probability. This is compatible with impartiality; it discounts the *existence* of the beneficiary, not the *value* of their welfare.

  **2. Dynamic Time-Consistency**
  *   **The Argument:** A plan made today for implementation in 2050 should remain the optimal plan when 2050 arrives, absent new information. If the discount function is hyperbolic (steep short-term, flat long-term), planners will repeatedly procrastinate mitigation, creating a "time-inconsistency trap." Exponential discounting guarantees consistency. However, if uncertainty about the *rate itself* is resolved over time, a declining effective rate (Weitzman, 2001) can be consistent, provided the uncertainty structure is modeled correctly.
  *   **Status:** **Non-negotiable** for policy implementation; **Camp Preference** on whether declining rates violate this (depends on uncertainty modeling).

  **3. Convergence at Extremes (No Dictatorship, No Paralysis)**
  *   **The Argument:** The discount function must ensure the present value of infinite future flows is finite but non-negligible. A constant positive rate makes the distant future worth zero (Present Dictatorship). A zero rate with positive growth makes the present value of future damages infinite, potentially justifying infinite present sacrifice (Tyranny of the Future/Paralysis). The function must allow for trade-offs without collapsing the objective function.
  *   **Status:** **Non-negotiable** for mathematical usability.

  **4. Parameter Honesty (The Elasticity Problem)**
  *   **The Argument:** In the standard Ramsey equation ($r = \delta + \eta g$), the elasticity of marginal utility ($\eta$) performs triple duty: it measures aversion to inequality across time, willingness to substitute consumption intertemporally, and risk aversion. Using one parameter for all three assumes they are identical, which is empirically and theoretically dubious. High $\eta$ implies we should save massively for the future (if they are richer) but also that we are extremely risk-averse.
  *   **Status:** **Camp Preference** (Technical honesty). Standard CBA lumps them; advanced asset pricing (Epstein-Zin-Weil) separates them, but this complicates the spec significantly.

  **5. Numeraire Consistency (Dollars vs. Physical Units)**
  *   **The Argument:** Discounting monetary flows is not the same operation as discounting physical impacts (life-years, CO2 ppm, biodiversity). If environmental goods become scarcer relative to consumption, their relative price rises. Discounting physical units at the consumption discount rate ignores "relative price effects." A usable spec must define whether the rate applies to consumption utility or specific physical goods.
  *   **Status:** **Non-negotiable** for coherence. Mixing numeraires without adjustment leads to systematic undervaluation of non-market goods.

  ### Joint Unsatisfiability (The Impossibility Results)

  You are correct to smell a rat; specific subsets of these requirements are jointly unsatisfiable without making heroic assumptions.

  1.  **The Ramsey Trilemma:** You cannot simultaneously hold **(A) No Pure Time Preference ($\delta=0$)**, **(B) Positive Economic Growth ($g>0$)**, and **(C) Market-Consistent Discount Rates ($r \approx 4\%$)** without implying an implausibly high inequality aversion ($\eta \approx 2$ or higher). If you demand low discount rates for climate (to justify mitigation) while keeping $\delta=0$ and $g>0$, you must lower $\eta$. But lowering $\eta$ implies low risk aversion and low aversion to inequality, which contradicts other observed behaviors and ethical stances. You must break one leg of the stool.
  2.  **Consistency vs. Uncertainty:** You cannot have **(A) Strict Exponential Discounting** and **(B) Robust Handling of Deep Parameter Uncertainty**. If you are uncertain about the future discount rate and that uncertainty is persistent, the *effective* discount rate *must* decline over time (Weitzman). Enforcing a constant exponential rate ignores this uncertainty, while adopting a declining rate invites accusations of time-inconsistency unless the resolution of uncertainty is explicitly modeled.
  3.  **Convergence vs. Impartiality:** If **(A) $\delta=0$** and **(B) Growth is zero or negative** (e.g., due to climate damages), the integral of future utility diverges (becomes infinite). Standard utilitarian CBA breaks down completely. You cannot satisfy impartiality and convergence in a stagnant or contracting economy without introducing a "critical level" utilitarianism or an artificial cutoff, both of which violate the pure spec.

  ### Ethical-First vs. Market-Rate Approaches

  Ethical-first approaches (e.g., Stern Review) satisfy impartiality and numeraire consistency by deriving rates from moral axioms ($\delta \approx 0$), but they struggle with the Ramsey Trilemma, often implying savings rates and mitigation costs that vastly exceed observed market behavior and political feasibility, risking paralysis. Market-rate approaches (e.g., Nordhaus) satisfy time-consistency and parameter calibration by relying on observed returns, but they violate impartiality by embedding a high pure time preference ($\delta > 0$) and often fail numeraire consistency by discounting physical climate damages at the rate of capital return, systematically undervaluing the far future. Neither satisfies the full spec; the former fails on feasibility and growth assumptions, the latter fails on ethical coherence.
