  So my philosophy club advisor brought up this thing called Fitch's paradox of knowability last week and two of my friends, Marcus and Dana, have been fighting about it in the group chat ever since. They finally asked me to be the ref and I honestly have no clue, so I'm hoping you can sort it out. Here's basically how the whole thing went.

  First some background: the starting idea (I guess some philosphers actually believed this) is that every truth is knowable in principle -- no truth is forever a mystery, even if nobody ever actually gets around to knowing it. Seems harmless enough. But then Marcus explained the proof. Suppose some truth p is such that nobody knows it. If every truth is knowable, then it's possible that someone comes to know the conjunction 'p is true and nobody knows p'. But if you know a conjunction you know both parts, so this person knows p, and also knows that nobody knows p. But they themselves know p now, so what they know is false -- and you can't know something false. Contradiction. So there can't be any truth that nobody knows, which means every truth is already known by somebody. Marcus's conclusion: the "every truth is knowable" thing doesn't just fail, it self-destructs and implies something crazy, and anyone who believed it just never thought it through.

  Dana said this is a cheap gotcha like the liar paradox or the sentence 'this sentence is false' -- the conjunction about p smuggles in a self-referential poison pill, and just like with the liar, the right response is to say that sentence simply can't be known and that's fine, not that all truths are known. Marcus said that's wrong because nothing here refers to itself at all, no sentence talks about itself -- the proof only uses boring obvious rules like "knowing a conjunction means knowing both halves" and "you can only know true things." There's nothing sketchy to quarantine.

  Then Dana pivoted and said okay, the real problem is the phrase "in principle" -- nobody who says every truth is knowable means knowable by a limited human being in a world like this one, so the proof attacks a strawman version of the view. Marcus said that's just dodging: if you weaken it like that you have to say exactly which truths are knowable and by whom, and until you do, your principle is too vague to mean anything.

  Can you go through their whole exchange move by move and say who's right at each step, not just who wins overall? And also whether they're both missing some obvious way out that would settle this. Please answer in american english btw -- my teacher takes points off for british spellings lol.
