answer: |-
  This is a classic conflict between **utilitarian ethics** (maximizing total happiness) and **deontological/rights-based ethics** (fairness and entitlement). Your sister is making a utilitarian argument; your gut is reacting to a violation of rights-based fairness.

  The teacups are absolutely proxies. This isn't about china; it's about who gets to define the terms of your relationship to your mother's memory, and whether emotional volatility constitutes a currency that can buy ownership.

  Here is a principled breakdown of why her argument feels wrong, why your intuition is right, and the actual mathematical framework used to solve this exact problem.

  ### 1. Deconstructing Her Argument: "Emotional Utilitarianism"

  Your sister's argument is: *Total Family Utility = (My Joy × High Sensitivity) + (Your Joy × Low Sensitivity).* Therefore, to maximize utility, I should get more stuff.

  **Why it bugs you (The Principled Objection):**
  You are sensing a violation of **procedural justice**. Inheritance is generally based on *relationship to the deceased*, not *capacity to suffer*.
  *   **The Moral Hazard:** If you accept her premise, you incentivize emotional dysregulation. You are effectively being taxed for your own resilience. If you trained yourself to care less (as you noted), your share of the estate would shrink. This punishes emotional stability.
  *   **The Category Error:** She is asking for **welfare** (distribution based on need/capacity) from an **estate** (distribution based on right/claim). If her grief is debilitating, that is a tragedy that deserves support, but that support should come from family care, therapy, or time—not by claiming ownership of assets you have an equal right to.
  *   **The Verification Problem:** Suffering is subjective. Ownership is objective. Basing objective property rights on subjective internal states creates a system where the most convincing dramatist wins.

  **Where she is right:**
  She is right that a rigid 50/50 split of *items* might result in a 90/10 split of *happiness*. If you don't care about the teacups and she does, giving them to her creates more net good. But that doesn't mean she gets *more* items overall; it means the *method* of splitting needs to account for preference intensity, not just item count.

  ### 2. The Solution: Fair Division Theory

  There is an actual mathematical field dedicated to this called **Fair Division**. The specific mechanism your uncle suggested (points) is on the right track, but you are worried about bluffing.

  **The Correction on the Point System:**
  You wrote: *"Obviously we'd both just exaggerate how much we care about everything."*
  **This is mathematically impossible if the points are capped.**
  If you each get 100 points total to spend across 50 items, you cannot bid high on everything. You *must* reveal your true preferences. If you bid 10 points on every item, you run out of points after 10 items. To get the teacups, you have to underspend on the lamp. This forces you to prioritize.

  **The Gold Standard: The Adjusted Winner Procedure**
  Developed by mathematicians Steven Brams and Alan Taylor, this is the principled framework you are looking for. Here is how it works:

  1.  **Independent Bidding:** You and your sister sit in separate rooms. You each get 100 points. You distribute them across every single item in the house based on how much you want it. (You can put 40 points on the teacups and 0 on the sofa, or 1 point on everything).
  2.  **Initial Allocation:** Each item goes to the person who bid more points on it.
  3.  **Equitability Adjustment:** Usually, one person ends up with more total "points value" than the other.
      *   *Example:* You end up with items worth 110 points to you; she ends up with items worth 90 points to her.
      *   To fix this, you transfer items (or cash) from the "winner" to the "loser" until the *ratio* of points obtained is equal.
  4.  **Cash Equalization:** If an item can't be split (like a teacup set), the person who gets it pays the other person cash to equalize the value.

  **Why this solves your problem:**
  *   It acknowledges intensity of feeling (she can bid 50 points on the teacups if she wants).
  *   It prevents bluffing (because points are finite).
  *   It ensures fairness (you both end up feeling you got the same "percentage" of what you wanted).
  *   It removes the argument from the room. The math decides, not who cries louder.

  ### 3. Addressing the "Teacups are Proxies" Reality

  You know this, and she likely knows this too. The fight is about **grief validation**.

  *   **Her perspective:** "If you take the teacups, you are taking a piece of Mom, and because I feel Mom's absence more, you are hurting me more than I hurt you."
  *   **Your perspective:** "If I give you the teacups because you're sad, you are holding my resilience hostage."

  **The Principled Response to Her:**
  You can validate her feelings without conceding the assets.
  > "I believe you that you feel this more deeply. I believe you will suffer more without these items than I will. But my claim to Mom's things is based on being her child, not on how loudly I grieve. If we divide based on who hurts more, we turn Mom's memory into a competition for suffering. I want us to split this based on fair rules, not on who can demonstrate the most pain."

  ### 4. Practical Recommendations

  If you want to resolve this without ruining the sibling relationship, do not coin-flip the contested stuff (too random) and do not do a simple 50/50 item split (ignores value/preference).

  1.  **Implement the Sealed Bid Point System:** Tell her: "We each get 100 points. We write down our bids secretly. Highest bidder gets the item. If we end up with unequal value, the winner pays the loser cash to balance it." This forces her to put her money where her mouth is. If she bids 40 points on teacups, she only has 60 left for everything else.
  2.  **The "Buyout" Option:** If she wins the teacups in the bidding but doesn't have the cash to equalize the split, she can't have them. This tests whether the emotional value is real or just positional.
  3.  **The Nuclear Option (Liquidation):** If the emotions are too high for rational bidding, sell *everything*. Donate the low-value stuff, auction the collectibles, and split the cash. Cash is infinitely divisible and carries no emotional baggage. It is often the only way to stop the bleeding.
  4.  **Third-Party Arbitration:** If you can't agree on the rules, hire a professional estate mediator. Do not use the uncle. An outsider has no emotional investment in who "feels more."

  ### Summary
  Your sister is arguing for **equity of outcome** (we should end up equally happy) using **inequitable rules** (my feelings count more). You are arguing for **equity of process** (we follow the same rules).

  In inheritance, process rights usually trump outcome utility. Use the **Adjusted Winner** framework (sealed bids with a fixed point total). It validates that she cares more (by letting her bid more points) without rewarding her for it (because she has to sacrifice other items to do so).

  If she refuses a mathematical framework and insists on "first pick because I feel more," she is no longer negotiating a division of assets; she is negotiating a power dynamic. At that point, liquidation is the only way to protect your relationship from the poison of the objects.
