answer: |-
  Your instinct is sound. While the summary you have read captures the *spirit* of Harsanyi's project, it conflates distinct arguments, oversimplifies technical conditions, and makes a category error regarding interpersonal comparability that would make a formal social choice theorist wince. For a software engineer, the distinction is akin to confusing a specification of an interface with a proof of its implementation, or treating a contingent configuration setting as a hard-coded constraint.

  Here is an assessment of the claims, distinguished by their standing in contemporary social choice theory and moral philosophy.

  ### 1. The Aggregation Theorem
  **Claim:** *"If every individual's preferences are rational... and society's preferences are rational... and society always follows its members whenever they are unanimous, then social welfare must be a weighted sum of individual utilities."*

  **Verdict:** **Mostly Correct, with a hidden assumption.**

  This is the core of Harsanyi's Aggregation Theorem (1955). Mathematically, it is robust. If individuals and society both satisfy the von Neumann–Morgenstern (vNM) axioms of expected utility theory, and society satisfies the **Pareto Principle** (if everyone prefers $A$ to $B$, society prefers $A$ to $B$), then the social welfare function is indeed a linear combination of individual utilities:
  $$ W = \sum_{i=1}^{n} a_i U_i $$
  **The Caveat:** The theorem implicitly assumes that all individuals and society hold the **same subjective probabilities** regarding states of the world. If individuals disagree on the likelihood of outcomes, the theorem breaks down (a result later formalised by Seidenfeld, Kadane, and Wasserman). The summary omits this, but for a popular account, it is a passable simplification.

  ### 2. Equal Weights and Classical Utilitarianism
  **Claim:** *"Add the requirement that citizens count equally, and the weights must all be the same, yielding the classical utilitarian prescription to maximise the total."*

  **Verdict:** **Oversimplification.**

  This moves from mathematics to ethics. The theorem produces *weighted* utilitarianism. To get *classical* utilitarianism (equal weights), one must introduce an ethical axiom, typically **Anonymity** (swapping the utility functions of two individuals should not change the social ranking).
  **The Wince:** A philosopher would note that "counting equally" is not a mathematical necessity derived from rationality; it is a moral commitment. Furthermore, "maximising the total" commits one to **Total Utilitarianism**. One could equally argue for **Average Utilitarianism** (maximising the average utility), which also satisfies the linear form but handles population changes differently. The summary presents classical total utilitarianism as the only option, which is not strictly true.

  ### 3. The Veil of Ignorance
  **Claim:** *"The result extends Harsanyi's veil-of-ignorance argument... with an equal chance of being anyone."*

  **Verdict:** **Conflation of Two Distinct Arguments.**

  This is a significant confusion. Harsanyi has two famous arguments for utilitarianism:
  1.  **The Aggregation Theorem:** Based on observing preferences and the Pareto principle (ex-post).
  2.  **The Impartial Observer Theorem:** Based on the veil of ignorance (ex-ante). This argues that if you have an equal probability of being any person in society, rational choice dictates maximising average utility.

  The summary suggests the Aggregation Theorem *is* or *extends* the veil-of-ignorance argument. They are logically distinct. The Aggregation Theorem does not require a veil of ignorance; it requires the Pareto principle. The veil-of-ignorance argument is what Harsanyi uses to try to justify the *interpersonal comparability* and the *equal weights*, not the aggregation theorem itself. Conflating them obscures where the ethical work is being done.

  ### 4. Interpersonal Comparability
  **Claim:** *"It also settles the old worry about interpersonal comparisons: since the utilities are being added together, they must be measurable on a common scale, so the theorem establishes that utilities are interpersonally comparable."*

  **Verdict:** **Flatly Wrong.**

  This is the most serious technical error in the summary.
  **The Maths:** In expected utility theory, a utility function $U$ is unique only up to a **positive affine transformation**. That is, $U$ and $V$ represent the same preferences if $V = aU + b$ (where $a > 0$).
  **The Problem:** You cannot sum utility functions that are on different scales. If my "10 utils" represents a mild pleasure and your "10 utils" represents the ecstasy of a lifetime, adding them is meaningless.
  **The Error:** The Aggregation Theorem *assumes* that the individual utility functions $U_i$ are already fixed on a common scale so that they *can* be summed. It does not *derive* this comparability. It says: "If you can compare utilities, here is how you must aggregate them." It does not solve the measurement problem. Harsanyi relied on his *Impartial Observer* argument (the veil of ignorance) to attempt to normalise these scales, but the Aggregation Theorem alone does nothing of the sort. To claim the theorem "establishes" comparability is backwards; comparability is a prerequisite for the theorem's conclusion to have normative weight.

  ### 5. The Distribution Objection
  **Claim:** *"Harsanyi answered this: any social rule that sacrifices total utility for the sake of equality can be recast as a gamble that every rational citizen would reject, so preferring equality is formally incoherent."*

  **Verdict:** **Contested / Philosophically Contentious.**

  This refers to Harsanyi's argument that society should not be more risk-averse than its individuals. If individuals are risk-neutral (in the vNM sense), society should be too. Harsanyi argues that caring about distribution (e.g., Prioritarianism or Egalitarianism) amounts to "double counting" risk aversion.
  **The Critique:** Philosophers and economists (such as Amartya Sen or John Broome) do not accept that this makes preferring equality "formally incoherent." It is only incoherent *relative to Harsanyi's specific axioms*.
  One can construct a coherent social welfare function that is concave in utility (giving priority to the worse off) without violating logical consistency. The disagreement is not about logic; it is about whether the **Pareto Principle** should apply to "expensive tastes" or adaptive preferences, and whether social risk attitudes should mirror individual ones. To say preferring equality is "incoherent" is to define "rationality" in a way that begs the question against egalitarians.

  ### 6. The Final Conclusion
  **Claim:** *"Rational social choice must be utilitarian and that preferring equality is incoherent."*

  **Verdict:** **Does Not Follow.**

  This conclusion depends entirely on the validity of the premises that the summary glossed over or misrepresented.
  1.  **Dependence on Comparability:** Since the theorem does not solve interpersonal comparability, the move to a single "total" is not mathematically forced without additional ethical assumptions.
  2.  **Dependence on Axioms:** The result holds only if one accepts vNM rationality as the *sole* definition of rationality for social states. Many philosophers argue that moral reasoning involves constraints (rights, duties) that are not captured by utility maximisation.
  3.  **Dependence on Risk:** The rejection of distributional concerns relies on a specific view of risk that is not universally shared.

  ### Summary Assessment

  If I were to annotate the book's margin as a social choice theorist:

  *   **The Aggregation Maths:** Acceptable simplification.
  *   **The Veil of Ignorance:** Confused. Distinct argument.
  *   **Interpersonal Comparability:** **Incorrect.** The theorem presupposes comparability; it does not prove it.
  *   **Distribution/Equality:** **Misleading.** It is not incoherent to prefer equality; it merely violates Harsanyi's specific axioms.
  *   **Final Conclusion:** **Unwarranted.** It presents a conditional result ("If you accept X, Y, and Z, then Utilitarianism") as an unconditional proof ("Rationality implies Utilitarianism").

  **Verdict for the Engineer:**
  Your instinct that "distribution... is a genuine concern that a formal framework cannot simply dissolve" is correct. Harsanyi's framework does not dissolve the concern; it **modells it away** by defining rationality in a way that excludes sensitivity to distribution.

  The book presents Harsanyi's work as a *proof* of utilitarianism. In reality, it is a **representation theorem**. It shows that *if* you want to satisfy certain conditions (Pareto, vNM rationality, etc.), *then* you must act as a utilitarian. But one is perfectly free to reject the conditions (for example, by rejecting the Pareto principle in cases of unfairness, or by rejecting the idea that social choice must follow vNM risk neutrality).

  The conclusion that rational social choice *must* be utilitarian is not a mathematical truth; it is a philosophical stance that uses mathematics to clarify its commitments. The book has sold you a map and claimed it is the territory.
