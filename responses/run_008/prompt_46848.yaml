  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "rationality" (instrumental) and "ethics" (normative) is clear. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't sound too dismissive of Harsanyi. He is a giant in the field. The critique is about the *book's summary* and the *strong claims* made, not necessarily Harsanyi's actual nuanced work. I should defend Harsanyi's actual contribution while critiquing the pop-econ presentation.

  *Wait, one more check on the "Veil of Ignorance" claim.* Harsanyi *did* use a veil of ignorance argument (the Impartial Observer Theorem). The book says the Aggregation Theorem *extends* it. Actually, they are often presented as two pillars of his utilitarianism. The Aggregation Theorem is usually ex-post (given preferences), the Impartial Observer is ex-ante (behind the veil). The summary blurs them. I need to be precise: The Aggregation Theorem *itself* does not rely on the veil; it relies on the Pareto principle. The Veil argument is separate.

