  5.  **Refining the Distribution/Risk Point:**
      *   *Thought:* The book says preferring equality is "formally incoherent."
      *   *Correction:* This is strong language. It's incoherent *relative to Harsanyi's axioms*. But if you introduce a social welfare function that is concave in utility (Prioritarianism), it is mathematically coherent. Harsanyi argues this violates the Pareto principle ex-ante. This is the "Ex-ante vs Ex-post" debate in social choice. I should mention this briefly without getting too bogged down.

  6.  **Final Review against constraints:**
