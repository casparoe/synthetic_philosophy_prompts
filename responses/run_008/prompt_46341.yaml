answer: |-
  We, the undersigned, enter this adversarial collaboration with the shared aim of resolving the longstanding dispute regarding the cognitive penetrability of perceptual experience, acknowledging that previous debates have often stalled due to ambiguities in operational definitions and methodological confounds. We agree first that any claim of penetrability must survive controls for response bias, criterion shifts, and demand characteristics, and second that invoking the El Greco fallacy is necessary to rule out explanations where cognitive states merely alter the interpretation of ambiguous stimuli rather than the sensory processing itself. We further agree that distinguishing perceptual experience from perceptual judgment requires tasks that minimize conceptual mediation, such as forced-choice matching or adjustment paradigms rather than explicit categorization, and we acknowledge that spatial attention must be rigorously controlled or measured, since cueing effects alone do not constitute cognitive penetration. On the philosophical front, we agree that the stakes involve the epistemic role of perception, specifically whether perception retains its status as a neutral arbiter of evidence if it is shaped by prior belief or desire, though we remain open to the possibility that this worry is overblown if the penetrating states are themselves reliable. We also agree that the modularity hypothesis is not an all-or-nothing claim but a matter of degree, and that finding a single instance of penetration does not collapse the entire distinction between perception and cognition, nor does finding a firewall in one domain guarantee it in all others.

  Despite these shared commitments, we disagree fundamentally on the best explanation for existing data and the likely outcome of future experiments. One of us holds that cognitive states such as desire, expertise, or linguistic categorization can alter the phenomenal character of perceptual experience itself, such that two individuals with identical sensory inputs but different cognitive backgrounds literally see the world differently in terms of vividness, distance, or color appearance. The other holds that these effects are fully explainable by post-perceptual processes, including shifts in decision criteria, memory reconstruction, or the allocation of spatial attention, and that the intuition of altered experience is a confabulation resulting from the integration of sensory data with cognitive expectations at the stage of judgment. We recognize that this disagreement hinges on whether the perception-cognition boundary is a real joint in nature or a pragmatic carve-up, and we acknowledge that our respective positions commit us to different predictions regarding where in the processing stream cognitive influences should be detectable.

  To adjudicate this, we identify three specific cruxes where empirical evidence can bear on the dispute, and we pre-register our predictions for each. The first crux concerns perceptual matching tasks under cognitive load, where participants must adjust a patch to match a target while holding either a neutral or a semantically related concept in working memory; the penetrability proponent predicts that reaction times and matching accuracy will show interference patterns consistent with altered sensory representations even when response deadlines prevent strategic judgment, whereas the firewall proponent predicts that effects will vanish when response criteria are equated via signal detection measures and that any remaining variance will correlate with markers of decision noise rather than sensory noise. The second crux involves physiological proxies for perceptual processing, specifically steady-state visually evoked potentials or pupillometry during binocular rivalry, where the penetrability proponent predicts that cognitive priming will shift the dominance duration of rival stimuli and alter early visual cortex signal strength independent of report, while the firewall proponent predicts that neural modulation will be confined to later frontal or parietal components associated with report and attention rather than early sensory areas. The third crux concerns the transfer of learning in expertise domains, such as chess or radiology, where the penetrability proponent predicts that experts will show enhanced perceptual discrimination thresholds for domain-specific stimuli even in tasks where memory is ruled out by masking, whereas the firewall proponent predicts that expert advantages will disappear when chunking strategies are blocked and that performance gains will map onto memory retrieval speeds rather than sensory acuity. For each of these cases, we agree that if the data show early sensory modulation independent of report and attention, it favors the penetrability view, but if effects are localized to decision stages or disappear under strict controls for bias, it favors the firewall view.

  We also acknowledge that a portion of our dispute may be verbal, stemming from divergent uses of the term perception to pick out different stages of processing. One of us tends to use perception to refer to the output of encapsulated early vision modules, while the other uses it to refer to the contents of conscious visual experience regardless of where in the pipeline those contents are constructed. We agree that if our disagreement reduces to this definitional variance, it should be explicitly noted rather than fought over, and we commit to distinguishing between early sensory penetration and late experiential penetration in our reporting. Should the data show that cognitive states affect conscious experience but only via late-stage integration, the firewall proponent will concede that experience is penetrable while maintaining that early vision is not, and the penetrability proponent will concede that modularity holds for early processing while maintaining that the epistemically relevant stage is the conscious output. We therefore agree to treat the question as empirical rather than terminological, letting the data dictate whether the joint between perception and cognition lies before or after the influence of desire, language, and expertise. We commit to accepting the results of these preregistered studies regardless of whether they vindicate our prior views, and we agree that the final publication will present our competing interpretations side-by-side if the data remain ambiguous, though we aim for a resolution that clarifies whether the mind reaches into perception or merely interprets what perception provides.
