prompt: |-
  I have to write a paper for my theory of knowledge class about the grue thing (emeralds are grue if they're green if observed before some future time T, and blue otherwise). My teacher keeps saying that "grue is just gerrymanderd, obvously" isn't an actual answer, and I think she's right that it's kind of a dodge -- it just restates the problem in fancier words. So before I go read a bunch of proposed solutions I want the spec first: what would a real solution to Goodman's new riddle even have to deliver? Write me the requirements list. I'm thinking it has to actually explain what makes "green" projectible and "grue" not, without just pointing at which predicate we happen to use (that would be circular, right?). It should also be a rule we could apply to predicates nobody has ever tested, so a solution that just sorts known predicates into good and bad piles doesn't count. And whatever the rule is, it shouldn't depend on some weird fact about human psychology, because then induction would stop working for creatures built differently, which seems wrong? Feel free to add requirements I'm missing. For each one say why it's a requirement, mark which are non-negotiable vs which are just what one camp wants, and flag any that you think can't be jointly satisfied -- that's the part I most want to see. Start with your bottom line in the first sentence, then the reasoning, no preamble and no restating my question.
