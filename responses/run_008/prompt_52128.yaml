      *   *Req 3: Generativity.* Must apply to new predicates. (Non-negotiable).
      *   *Req 4: Mind-Independence.* (Contested/Camp-specific). Naturalists say yes, Pragmatists say no.
      *   *Req 5: Normativity.* Must guide action, not just describe habit. (Non-negotiable).

