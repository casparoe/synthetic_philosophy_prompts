answer: |-
  **1. Setup (5 mins): The Natural API**
  Don't start with the paradox. Start with the rule: "For any predicate `bool f(x)`, `filter(all_things, f)` returns a Set." For programmers, this is trivial. For Frege, this was logic. Emphasize: Naive Comprehension wasn't a mistake; it was the most natural abstraction possible. You are breaking their intuition, not fixing a typo. Tell them: "You think `filter` always returns a Collection. Frege thought `predicate` always returns a Set. This is a feature, not a bug."

  **2. The Example (10 mins): Sets, Not Barbers**
  Your instinct is right: Ditch the Barber. It frames the paradox as a semantic trick or social contract violation. Stick to $R = \{x \mid x \notin x\}$.
  *Misconception Alert:* When they say "Self-reference is illegal," stop them. Self-reference is fine. The crisis is *existence*. $R$ isn't a set that glitches; it's a collection that *cannot exist*. Head this off immediately after the boolean flip. If they say "Just use types," acknowledge it but say "Types are the solution, not the explanation. We need to feel the break first."

  **3. The Technique & Analogy (10 mins)**
  Russell's move is a general stress-test: Assume completeness, construct an object using internal rules that violates external consistency. This is diagonalization.
  *Gödel/Halting:* Place this *after* the paradox is clear.
  *The Good:* All three construct an input that breaks the predictor/classifier.
  *The Bad (Mushed Version):* Watch for "Systems can't know themselves." That's mysticism. The precise claim: "A system cannot consistently classify all its own objects using its own rules." If they start waving hands about "consciousness" or "infinity," rein them in.

  **4. Check Question (5 mins)**
  Do not ask "What is Russell's Paradox?"
  *Ask:* "If we ban sets from containing themselves ($x \notin x$), does the paradox disappear? Why?"
  *Pass:* "No. You can construct a new property (e.g., $x \notin x \land x \neq \emptyset$). The fix isn't banning self-containment; it's banning unrestricted comprehension."
  *Fail:* "Yes, because $R$ can't be formed." (Shows they think the problem was the specific property, not the comprehension rule).

  **5. Hard No's**
  1.  **ZFC Axioms:** Too dry, misses the philosophical break.
  2.  **Type Theory details:** Rabbit hole.
  3.  **Frege's letter:** History lesson.
  4.  **Solutions:** Just say "we restricted comprehension" and move on.
