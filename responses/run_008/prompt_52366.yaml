      *   The circularity charge is accurate but accepted by both as unavoidable. Lewis's "similarity" weights causal laws heavily to avoid backtracking. Woodward's "interventions" presuppose a causal structure to distinguish them from mere correlations. Neither escapes the causal circle; they just locate the primitive differently.
