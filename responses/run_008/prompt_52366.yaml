      *   **Context:** TA for a philosophy of science class.
      *   **Topic:** Theories of causation (Lewis vs. Woodward).
      *   **Problem:** Class ground to a halt. Students see no disagreement on cases (both agree on most, fail on same weird cases).
      *   **TA's Hunch:** The disagreement isn't about cases, but about foundations/circularity (Lewis's similarity metric vs. Woodward's primitive interventions).
      *   **Task:** Diagnose the disagreement (substantive, verbal, research programs), validate/correct the hunch, and advise on what counts as progress (formal framework, impossibility result, etc.) vs. moving on.
      *   **Constraint:** Under 500 words.

