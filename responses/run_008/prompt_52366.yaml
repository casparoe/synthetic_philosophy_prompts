      *   The hunch is largely correct. Lewis reduces causation to counterfactuals, but cashes out counterfactuals using a similarity metric that often smuggles in causal intuitions (e.g., avoiding miracles). Woodward reduces causation to interventions, but interventions are defined counterfactually (invariant relationships under testing).
      *   It's not merely verbal; it's about *explanatory priority* and *metaphysical commitment*. Lewis is more metaphysical (what makes causation true); Woodward is more epistemological/manipulability-focused (what allows us to identify/use causation).
      *   They are distinct research programs with different aims.

  3.  **Diagnose the Disagreement:**
      *   **Substantive?** Yes, but not primarily about extension (cases). It's about *analysis* vs. *characterization*. Lewis wants truth conditions; Woodward wants criteria for discovery and manipulation.
      *   **Circularity:** Both face the "causal circle" charge. Lewis's similarity metric relies on causal independence. Woodward's interventions rely on causal structure to define valid interventions.
      *   **Overlap:** They overlap significantly in "normal" cases but diverge on *why* we care about causation.

  4.  **Determine What Counts as Progress:**
      *   Shared formal framework? Causal Bayes Nets (CBNs) actually bridge this. Woodward aligns well with CBNs. Lewis is harder to formalize this way but compatible.
      *   Impossibility result? Unlikely to resolve the metaphysical vs. pragmatic split.
      *   Agreement on cases? Already have it, doesn't help.
      *   Advice: Acknowledge the convergence on extension, pivot to the divergence in *aim*.

  5.  **Drafting the Response (Iterative Process):**

