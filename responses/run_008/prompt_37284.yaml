answer: |-
  Thanks for making time. I'm dramatizing these arguments, so I need to know where the strong view bleeds. I'll be reading these off my phone, so direct answers are best.

  1.  Critics argue the strong claim quietly retreats to Slobin's "thinking-for-speaking." Do you see that as a theoretical rescue or giving away the store?
  2.  *Follow-up:* You'll likely say it's a refinement. But if it's just online processing, does that kill the "unthinkable thought" angle my MC needs, or is there still room for deep determinism?
  3.  Regarding grammatical gender: the bridge/key studies famously struggled to replicate. Do you still defend the effect as evidence of shaped perception?
  4.  *Follow-up:* I expect you'll say some studies hold. But if the effect is fragile, can my MC rely on it as a hard rule, or does that fragility undermine the theory?
  5.  Take Guugu Yimithirr absolute directions. Is that evidence language shapes thought, or just that the community drills a habit into kids like reading maps?
  6.  *Follow-up:* You'll probably say it's both. If so, how do you prove language is the causal driver and not just the vehicle for cultural training?
  7.  On evidentials: languages forcing source-marking. Does your view predict speakers are actually better at remembering where knowledge came from?
  8.  *Follow-up:* I assume the data is mixed. If so, does grammar constrain the *availability* of the thought, or just highlight it? I need to know the limit.
  9.  Translation question: as a bilingual, can I have a thought in Polish literally impossible in English, or does it just cost an extra beat?
  10. *Follow-up:* You'll likely say "costlier." If it's just cost, isn't that weak determinism? How do you push back against the idea that everything is translatable, just clumsily?
  11. Finally, what evidence would genuinely count against your view? I need to know if "nothing—it's complicated" is a live answer, or if something could actually falsify it.
