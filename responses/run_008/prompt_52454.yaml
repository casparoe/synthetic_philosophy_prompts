answer: |-
  **Setting:** *A quiet corner of a coffee shop a few blocks from the group house. It's two days after the mailing list explosion. Maya and David are both senior members of the local rationalist community, though they live in different houses.*

  **David:** So. Have you seen the thread? It's finally gone quiet, but I'm worried the silence is just exhaustion, not resolution.

  **Maya:** I've seen it. I think the silence is the only thing that saved the house from a split. But honestly? I think Bob was right to shut Alice down.

  **David:** Right to shut her down? Bob didn't dispute the dishes. He admitted the counter was piled high. He just refused to engage with the criticism because of Alice's chore strike in February. That's textbook *tu quoque*. It's a logical fallacy for a reason. The truth value of "the dishes need doing" is independent of Alice's history.

  **Maya:** I'm not talking about the truth value of the proposition, David. I'm talking about the speech act of *blame*. There's a difference between stating a fact ("There are dirty dishes") and issuing a normative demand ("You are blameworthy for these dishes"). My claim is that Alice forfeited the standing to make the second move.

  **David:** Forfeited standing. Okay. Help me parse that. Are you saying she's not allowed to speak? Or that what she said doesn't count?

  **Maya:** It's that she lacks the authority to hold him accountable. Think about what blame *is*. It's not just a description of a norm violation. When I blame you, I'm implicitly claiming a certain position relative to you. I'm saying, "We are both subject to this norm, and I am invoking it against you." If I am currently exempting myself from that norm, I'm no longer speaking as a peer. I'm speaking as a privileged enforcer.

  **David:** But Alice isn't currently exempting herself. She had a strike in February. That's past tense.

  **Maya:** In the context of a group house, a "strike" isn't a one-off event; it's a declared policy of non-compliance. It signals, "I reserve the right to opt out of this system when I deem it necessary." If she reserves that right for herself, she can't consistently deny it to Bob. Bob's reaction—"You're the last person who gets to talk"—isn't just defensiveness. It's a rejection of her authority. He's saying, "You don't get to govern me by rules you explicitly suspended for yourself."

  **David:** I see the intuition. It feels unfair. But let's stress test it. Consider the reformed smoker.

  **Maya:** Okay.

  **David:** Imagine Alice smoked for ten years, quit last month, and now tells Bob, "You shouldn't smoke, it's bad for the house." By your metric, she's a hypocrite. She violated the norm for a decade. Does she lack standing to tell Bob not to smoke?

  **Maya:** No. And this is where the distinction matters. The reformed smoker isn't claiming an *exemption*. They are saying, "I violated this, it was wrong, and now I submit to the norm." Hypocrisy that forfeits standing isn't about having a dirty past; it's about claiming a *current* immunity. If Alice had said, "Yes, I struck in February, and I was wrong to do it, and I'm sorry," she would have regained standing. But she didn't. She let the strike stand as a justified action while using the norm against Bob.

  **David:** That's a narrow slice of hypocrisy, though. Most *tu quoque* attacks aren't about current immunity. They're about consistency. If I tell you not to lie, and you point out I lied last week, the logic is: "Your judgment is compromised." But if we follow your rule, we risk paralyzing norm enforcement. Everyone in a group house violates chores sometimes. If only the sinless can cast the first stone, the dishes never get done.

  **Maya:** That's the coordination problem, sure. But there's a cost to allowing hypocritical blame. It erodes the trust that norms are shared. If Bob sees Alice enforcing a rule she treats as optional, he doesn't think "Oh, I should do dishes." He thinks "This is a power game." The norm becomes about status, not cooperation.

  **David:** But isn't that Bob's problem? If the dishes are dirty, the utility loss is real. Mold grows. Roaches come. Does the house get cleaner if we tell Alice, "Sorry, you struck in February, you can't mention the dishes"? Or does the house get dirtier because we've created a safe harbor for violators as long as they can find a violator to point at?

  **Maya:** I'm not saying the dishes don't need doing. I'm saying Alice isn't the right person to enforce it. There are other housemates. Charlie could have said it.

  **David:** Ah, the "didactic blame" angle. What if Alice didn't email Bob? What if she sighed loudly to Charlie in the kitchen, "I hate it when the dishes pile up," knowing Bob could hear?

  **Maya:** *laughs* You think that dodges it?

  **David:** Doesn't it? She's not directly blaming him. She's expressing a preference to a third party.

  **Maya:** If the intent is to pressure Bob, it's the same speech act. It's still an attempt to enforce a norm. If she lacks standing to confront him, she lacks standing to mobilize the group against him. It's actually worse, because it's covert. But look, David, I think you're conflating "Alice is wrong to blame" with "Bob is right to ignore."

  **David:** Exactly! That's my point.

  **Maya:** But they aren't the same. Bob can acknowledge, "You're right, the dishes are my responsibility, but I'm not accepting this critique from you because of the double standard." He can fix the dishes without conceding her authority. The problem with the mailing list thread wasn't that Bob didn't do the dishes. It was that everyone started debating Alice's moral character instead of the dishes. That is the tax hypocritical blame imposes. It shifts the focus from the object-level violation to the meta-game of enforcement.

  **David:** I agree it shifts the focus. But is that always bad? Sometimes the meta-game *is* the problem. If Alice is consistently weaponizing norms while dodging them, that's a bigger issue than the dishes. Bob forcing the conversation to her hypocrisy might have been the only way to expose that pattern.

  **Maya:** Maybe. But there's a difference between exposing a pattern and using it as a shield. If Bob had said, "Alice, you struck in February. If you want to enforce this, we need to talk about how we handle strikes generally," that's a constructive pivot. Instead, he said, "You're the last person who gets to talk." That's a dismissal. It treats her hypocrisy as a silencing mechanism, not a topic for discussion.

  **David:** Because he felt silenced! That's the resentment I'm talking about. If I feel you're governing me by rules you don't follow, I resent it. And that resentment is valid. But does my resentment make your statement *false*?

  **Maya:** No. It makes your *obligation to accept her blame* void. This is the crux. I'm not saying "The dishes are clean." I'm saying "Alice cannot successfully place Bob in the position of 'wrongdoer'." Blame is a relational transaction. It requires a creditor and a debtor. If the creditor has defaulted on their own debts, they can't collect.

  **David:** That's a strong metaphor. But in the real world, we let creditors collect all the time even if they're in debt elsewhere. The bank doesn't lose the right to foreclose because they mistreat their employees.

  **Maya:** But a group house isn't a bank. It's a mutual aid society. The authority comes from reciprocity, not capital. In a reciprocity system, exemption is fatal to authority.

  **David:** Okay, let's grant you that. Let's say Alice lacked standing. What's the prescription? Do we delete her email? Do we tell her she's not allowed to speak up next time? Because if the answer is "Charlie should have said it," we're relying on Charlie's vigilance. Charlie might be shy. Charlie might not notice. Alice noticed. Alice cares. Do we really want to disincentivize the people who care enough to enforce norms, even if they're imperfect?

  **Maya:** We want to incentivize them to clean their own hands first. Or to frame it differently. "Hey Bob, I know I struck in February, and I own that. But the counter is piling up again." That acknowledges the debt while enforcing the norm. It restores standing through humility.

  **David:** And if she doesn't? If she's just blind to her own inconsistency?

  **Maya:** Then she's a liability to the house's normative infrastructure. And maybe Bob was right to call that out, even if he did it to dodge the dishes.

  **David:** So you're conceding Bob was right?

  **Maya:** I'm conceding Bob was right to challenge her *standing*, not necessarily to ignore the dishes. But he did ignore the dishes. That's the tragedy. The hypocrisy trap consumed the object-level problem.

  **David:** Which brings me back to my side. If we adopt your rule—"Hypocrites lack standing"—we make it too easy to trap the conversation in the meta. Bob didn't have to prove Alice was a hypocrite to win the point. He just had to imply it. It encourages everyone to keep dirt on everyone else. "I can't be blamed for X because I know you did Y." It's a mutually assured destruction pact for norms.

  **Maya:** That's a real risk. But the alternative—"Content is all that matters"—encourages moral licensing. "I can enforce this norm on you strictly, even if I violate it, because the norm is important." That leads to tyranny. The Puritans were very big on content over standing.

  **David:** *smiles* Fair. The Puritans were not a good equilibrium.

  **Maya:** So where does that leave us?

  **David:** I think... I think I have to grant you that standing is real. It's not just vibes. If I don't respect you, your blame doesn't land. It bounces off. But I still think calling it "forfeiture" is too strong. It's more like... friction. Hypocritical blame has high friction. It generates heat. Sometimes that heat is useful—it burns away the hypocrisy. Sometimes it just burns down the house.

  **Maya:** I can live with "high friction." As long as we agree that Bob wasn't obligated to accept the blame as valid *from her*. He owed the house clean dishes. He didn't owe Alice submission.

  **David:** Agreed. He owed the house dishes. He owed Alice... honesty. And he gave her honesty: "I won't listen to you on this." Whether that was productive is another question.

  **Maya:** Next time, I'm telling Charlie to send the email.

  **David:** *laughs* Next time, I'm telling Alice to wash her damn plates before she takes a photo.

  ***

  **Postscript**

  **Which side would I bet on?**
  I would bet on **Maya (The Forfeiture Person)**, specifically in the context of small, high-trust communities like group houses or intentional communities. In these environments, norms are enforced primarily through social capital and reciprocity rather than formal rules. When someone attempts to spend social capital they don't have (because they've previously devalued the currency), the transaction fails. The "friction" David mentions is often so high it becomes a wall. In my experience, allowing hypocritical blame to stand usually corrodes group trust faster than letting a specific violation slide.

  **What would move me to the other side?**
  I would move toward **David (The Content Person)** if the cost of the norm violation was catastrophic or immediate. If Alice's email was about Bob leaving a gas stove on, or hoarding biohazardous waste, the "standing" argument becomes a luxury we can't afford. In high-stakes safety cultures (like labs or aviation), *anyone* must have standing to call out *anyone*, regardless of past performance. If the dialogue had focused on safety norms rather than chores, David's argument that "truth is independent of the messenger" would carry significantly more weight.

  **The Weakest Joint:**
  The dialogue likely talks past the strongest version of the **"Reformed Sinner"** counterexample. Maya dismisses it by distinguishing between "past sin" and "current exemption," but in practice, this line is blurry. If Alice's "strike" in February was publicly framed as a protest against an unfair system (a moral stance), she might claim she has *more* standing now, not less, because she is consistent with her principles. David didn't press hard enough on whether Alice's strike was seen as a *violation* or a *principled objection*. If it was the latter, Bob's *tu quoque* fails even on Maya's terms, because Alice isn't claiming an exemption; she's claiming a different normative framework entirely. That ambiguity is where most real-world house blowups actually live.
