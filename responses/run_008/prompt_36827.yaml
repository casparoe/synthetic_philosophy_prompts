  *Soft:* P&R essentially anticipate the multiself game view. Distinguishing 'non-cooperative imperfect recall' from 'cooperative team reasoning' is subtle. Don't claim they missed the structure; claim they ignored the solution class.

  **2. The "Hope Nobody Asks" (Critical Damage)**
  *Q:* "If they are a team with aligned interests, why can't they correlate on a pure strategy (Continue then Exit) instead of mixing? Mixing seems inefficient."
  *A:* They can't distinguish nodes. A pure strategy requires knowing *which* intersection you're at. Since information sets are identical, the policy must be symmetric. Mixing is the only way to probabilistically access the second exit without memory.
  *Soft:* If you allow ex-ante commitment devices (like a timer), pure strategies become possible. This relies on strict isolation. If they push on "correlated signals," emphasize the physical impossibility of private signals between temporal selves.

  **3. The Economists (High Damage)**
