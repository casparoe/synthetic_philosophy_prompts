  *A:* Because 'you' are a team. Rationality isn't just interim optimization; it's adhering to the policy that maximizes *team* payoff. Deviating hurts your partner-self. Team reasoning overrides local dominance.
  *Soft:* Requires accepting team reasoning as a primitive. Skeptics see this as begging the question against causal decision theory. Be ready to defend team reasoning as normative, not just descriptive.

  **4. The CS Guy (Medium Damage)**
