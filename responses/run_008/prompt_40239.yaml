answer: |-
  You and your friend are both right, and that is the problem. You have identified a category error that is currently generating more heat than light in the interpretability community.

  Here is the blunt truth: **Mechanistic interpretability (Mech Interp) is not finding representations in the classical cognitive science sense.** It is finding *causal levers*.

  When your friend says "representation," she is invoking a notion thick with intentionality: a state that stands in for something else, possesses correctness conditions (it can be false), and participates in a compositional grammar (Fodor's LOT). When an interpretability researcher says "representation," they are invoking a notion that is purely structural and functional: a subspace of activations that, when manipulated, covaries with a specific output feature.

  These are not the same concept at different resolutions. They are different concepts entirely. One is semantic; the other is causal. The friction in your argument comes from Mech Interp researchers implicitly borrowing the prestige of the classical definition while only delivering the causal one.

  ### 1. The Two Concepts Diverge on Intentionality

  The classical notion (let's call it **Rep-C**) requires *aboutness*. A belief that "it is raining" is a representation because it refers to a state of the world and can be evaluated as true or false. This is the Marr Computational Level: *what* is being computed and *why*.

  The interpretability notion (**Rep-I**) requires *causal specificity*. A "curve detector" in V1 is a representation because if you zero out that neuron, the network stops reporting curves. This is the Marr Implementational Level: *how* the computation is physically realized.

  **Where Rep-I fails Rep-C:**
  Take your SAE feature example. You find a direction in activation space that correlates with "sycophancy." You ablate it, and the model becomes less sycophantic.
  *   **Rep-I says:** "We found the sycophancy representation."
  *   **Rep-C says:** "You found a switch that turns off sycophantic behavior. You have not shown that the model *believes* it should be sycophantic, nor that it has a concept of 'sycophancy' that could be applied correctly or incorrectly in a novel context."

  The SAE feature has no truth conditions. It cannot be "wrong" about sycophancy; it can only be active or inactive. If the model activates the "sycophancy direction" when the user is actually being hostile, the classical cognitive scientist says the representation is *misapplied*. The Mech Interp researcher just says the feature has low precision. This isn't just terminological; it's a fundamental disagreement about whether the network has an ontology or just a topology.

  ### 2. Compositionality and Systematicity

  Your friend is likely hung up on **systematicity** (Fodor & Pylyshyn). If a system represents "A loves B," it should be able to represent "B loves A." Classical representations are compositional; they have syntax.

  Rep-I features are notoriously monolithic. An SAE feature for "Golden Gate Bridge" might fire for images of the bridge, text about San Francisco, and discussions of suspension cables. But is it composed of sub-features for "bridge," "gold," and "location"? Often, no. It's a holistic cluster in activation space.

  If Rep-I lacks compositionality, it cannot support the kind of generalization that classical cognitive science views as the hallmark of mind. It suggests the network is a giant lookup table of correlated features rather than a reasoning engine manipulating symbols. This is why your friend feels cheated: Mech Interp claims to be opening the black box to find *thought*, but often it just finds *circuitry*.

  ### 3. The "Lines of Longitude" Analogy

  Your lab mate's analogy is insightful but needs a tweak. Lines of longitude are arbitrary (we chose Greenwich), but the *axis* they rotate around (the Earth's spin) is physical.

  A better analogy for SAE features is **Principal Components Analysis (PCA)**.
  *   Are the principal components "real"? They mathematically capture the variance of the dataset.
  *   Are they "in the system"? No. The system (the brain, or the network) doesn't necessarily compute in the PCA basis. It computes in whatever basis is energetically or computationally efficient.

  When we train an SAE, we are imposing a sparsity constraint. We are *forcing* the network's activity to be described as a sum of independent features. If we succeed, it means the network's activity *can be described* that way. It does not prove the network *uses* that description internally.

  This is the crux of the realism debate.
  *   **Realist:** "The feature is real because it's causal. If I poke it, behavior changes."
  *   **Anti-Realist:** "The feature is an artifact of your sparsity penalty. A different basis could explain the same behavior."

  **My opinion:** The anti-realist has the stronger philosophical ground here. Causal efficacy does not imply ontological uniqueness. I can control a car's speed by pressing the gas pedal or by pouring more fuel into the engine directly. Both are causal levers. Only one is the "representation" of speed intended by the design. In neural networks, we don't know the design intent, so claiming the SAE basis is the "true" ontology is premature.

  ### 4. What the Realism Debate is Actually About

  The realism debate in interpretability is confused because it oscillates between two questions:

  1.  **Causal Realism:** Are there directions in activation space that causally influence specific behaviors? (Answer: Yes, trivially.)
  2.  **Semantic Realism:** Do these directions correspond to discrete, meaningful concepts that the model "uses" in a way analogous to human cognition? (Answer: Unknown, probably no.)

  Most interpretability papers defend Causal Realism but write their abstracts as if they've proven Semantic Realism. When they say "The model represents X," they mean "We found a causal lever for X." But the reader (and your friend) hears "The model has a concept of X."

  This is why the "does the model have its own ontology" question is oversold. If ontology requires truth conditions and compositionality, current Mech Interp has not found an ontology. It has found a **control map**.

  ### 5. The Verdict

  You should tell your friend this:

  Mech Interp is doing **Reverse Engineering**, not **Cognitive Science**.
  *   **Cognitive Science** asks: "What are the representational states that constitute this mind?"
  *   **Reverse Engineering** asks: "What are the subcomponents that, if modified, change the output?"

  A transistor in a CPU is a causal lever. If I cut the wire, the bit flips. But the transistor is not a "representation" of the bit. The *voltage pattern* across many transistors is the representation. Mech Interp is currently identifying the transistors (or groups of them) and calling them "bits."

  **Where they coincide:**
  They coincide at the limit. If you find a causal lever that is *also* compositional, *also* systematic, and *also* tracks truth conditions in the environment, then Rep-I collapses into Rep-C. We haven't found that yet. We've found linear probes and sparse features.

  **My Opinionated Take:**
  The interpretability community is suffering from a naming crisis. By using the word "representation," they are inviting philosophical scrutiny they cannot withstand. They should adopt a more deflationary terminology: **"Causal Features"** or **"Behavioral Levers."**

  If they did this, the realism debate would vanish. No one argues about whether a lever is "real." It's there, it works. But no one thinks the lever *is* the machine's understanding.

  Your friend is holding out for a Language of Thought. The Mech Interp researchers are building a Map of Levers. Both are valuable. But until the Map of Levers shows how the levers combine to form truth-apt propositions, the Mech Interp researchers are not finding representations in the sense that matters for philosophy of mind. They are finding the neural correlates of behavior, not the constituents of meaning.

  **Recommendation:**
  Don't try to reconcile the definitions. Accept the bifurcation.
  1.  **Rep-C (Classical):** Semantic, compositional, truth-apt. (The goal of AGI safety, arguably).
  2.  **Rep-I (Mech Interp):** Causal, correlational, basis-dependent. (The tool we have now).

  The danger lies in assuming Rep-I gives you Rep-C. If you assume that finding a "deception feature" means the model *knows* it is deceiving, you will build safety cases on sand. The model might just have a "say things that sound like deception" lever, with no internal concept of truth to violate. That distinction is the difference between a liar and a tape recorder. Mech Interp currently cannot tell them apart.
