      *   *The "As-If Random" Condition:* The split line (38th Parallel) must be uncorrelated with unobserved determinants of economic success.

  3.  **Evaluate the "As-If Random" Claim (The 38th Parallel):**
      *   *Fact:* Chosen by Dean Rusk and Charles Bonesteel in 1945.
      *   *Criterion:* They needed a line that put Seoul in the US zone. It wasn't based on economic data, but it wasn't *purely* random like a coin flip. It was strategic.
      *   *Initial Endowments:* The North *did* have the heavy industry (hydroelectric, mining, Japanese colonial investment). The South was agrarian.
      *   *Implication:* If anything, geography/initial endowments favored the North. The fact that the South overtook the North *strengthens* the institutional argument because it overcame an initial disadvantage. *However*, this isn't a controlled lab setting.

  4.  **Evaluate Confounding Factors (The "Bundle" Problem):**
      *   *Institutions vs. Policy vs. Shocks:* Is it just "institutions" (property rights, rule of law)? Or is it the Korean War (1950-1953)?
      *   *War Damage:* The North was bombed extensively (more than the South). This destroyed the industrial base they inherited.
      *   *Aid:* South received massive US aid. North received Soviet/Chinese aid (different terms, often less consumer-oriented).
      *   *Geopolitics:* Integration into global trade (South) vs. Autarky (North). Is this "institutions" or "geopolitical alignment"? AJR argue geopolitical alignment shapes institutions. Critics might say it's external market access (geography/trade).
      *   *The "Bundle":* The treatment isn't just "democracy vs. dictatorship." It's "US Ally + Market Access + Land Reform + Education + War Destruction + Aid" vs. "Soviet Ally + Command Economy + Less War Destruction (initially) + Isolation." Isolating *institutions* is hard.

  5.  **Evaluate the Germany Comparison:**
      *   *Similarities:* Split after WWII, different systems, same culture (roughly).
