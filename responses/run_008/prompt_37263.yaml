      *   *Culture:* Can culture defenders say anything?
          *   *Argument:* "One culture in 1945" is true. But culture evolves. 80 years of divergence means culture is no longer fixed.
          *   *Rebuttal:* True, but the *divergence* is the outcome to be explained. You can't use post-1945 cultural drift as an exogenous cause without explaining *why* it drifted (likely due to institutions).
          *   *Nuance:* Maybe Confucianism interacted differently with capitalism vs. communism? (Weberian argument). But this is post-hoc.

