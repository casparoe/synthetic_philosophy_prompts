prompt: |-
  So, some context: I'm a journalist covering science and ideas, and for the past few months I've been doing a series of long-form conversations with philosophers for our podcast, mostly about how people actually reason about right and wrong. Next week's guest is a philosopher who just put out a book defending what she calls agent-centered constraints -- the idea that there are certain things you must not do (kill the innocent, torture, break a serious promise) even when doing so would prevent more of those very things from happening elsewhere. Her own twist, which is the reason I booked her, is that she doesn't frame this as being about keeping your hands clean or preserving your moral purity, which she thinks is a slander invented by her critics. Instead she compares constraints to guarantees: the moral community has, in effect, extended a standing guarantee to each person that they won't be used as a means in certain ways, and a guarantee that gets quietly traded away when the math goes bad is no guarantee at all. Like how a lawyer who betrays one client's confidence to prevent two other lawyers from betraying theirs hasn't merely done a cost-benefit calculation badly -- she's destroyed the thing that made the practice possible.

  I want to write up eight to ten interview questions before we record, and I'd rather not have her just restate the book's thesis for an hour, which she's very practiced at doing. I need at least one question squarely on the paradox of deontology: the bit where, if you refuse to violate one constraint in order to prevent five violations of the same constraint, it starts to look like you're not actually valuing the thing the constraint is supposed to protect. Please include for each question a follow-up keyed to the answer she's most likely to give -- she's the type to say that the guarantee only makes sense from the inside, that there's no impersonal standpoint from which violations are supposed to be totaled up, so the follow-ups should try to make that move harder rather than accepting it as a mic-drop. Also work in something on the intending/foreseeing and doing/allowing distinctions, since her view leans on those pretty heavily, and something on whether her guarantee analogy survives cases where the guarantee-holder herself would waive it (say a person who begs you to break your promise to her in order to help others).

  One more thing: I'd like to close the interview with a question about what would actually count against her view -- she's charming and quick, and my producer thinks I've been too soft on recent guests, so if you can make that final question pointed without being rude, that'd be great. Keep the register conversational, these are spoken questions not essay prompts, and its fine if a couple of them are a bit scrappy, that's just how I talk on the show.
