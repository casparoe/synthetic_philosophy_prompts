answer: |-
  Here are nine questions drafted for the recording. I've kept the language conversational and slightly informal ("scrappy," as you requested), with specific follow-ups designed to pin her down when she retreats to the "internal standpoint."

  ### 1. The "Purity" vs. "Guarantee" Setup
  "I want to start with the framing, because you're pushing back hard against the idea that constraints are about keeping your own hands clean. You call it a slander to say deontologists care more about their own purity than other people's suffering. Instead, you use this word: *guarantee*. The moral community guarantees I won't be used in certain ways. But help me understand the transaction here. If I refuse to break a promise to you, even to stop two other people from breaking promises elsewhere, you say I'm upholding the guarantee. But from the outside, it looks like the total amount of promise-breaking in the world just went up. How is that not just valuing the *rule* over the *people* the rule is supposed to help?"

  *   **Likely Answer:** She will argue that morality isn't a project of minimizing bad states of affairs from a "God's eye view." It's about the relationship between agents.
  *   **Follow-up:** "Okay, but relationships exist in a world where people bleed. If I stand on this 'internal' view of our relationship, but the consequence is that three other relationships get destroyed out there, haven't I effectively sacrificed real people to preserve a concept? Why is the concept more durable than the people?"

  ### 2. The Paradox of Deontology
  "This leads to the classic headache with your view, the so-called 'Paradox of Deontology.' If the constraint against killing the innocent is there to protect innocent people, it seems bizarre to let five innocent people die rather than kill one. It starts to look like the constraint isn't protecting *people*, it's protecting *the constraint*. Do you ever feel the weight of that paradox? Or do you think it's just a trick of the language?"

  *   **Likely Answer:** She'll say the paradox only arises if you assume the goal of morality is to minimize violations impersonally. She'll reiterate that the constraint protects *you* from *me*, not *you* from everyone.
  *   **Follow-up:** "I get that distinction, but let's make it concrete. If I'm the one holding the knife, and I say, 'I can't stab this one person to stop five stabbings,' the five victims don't care about my moral standpoint. They're just dead. If the system allows five deaths to preserve a principle that is supposed to prevent death, hasn't the principle eaten its own tail?"

  ### 3. Doing vs. Allowing
  "You lean pretty heavily on the distinction between doing and allowing, and intending versus foreseeing. If I divert a trolley to kill one to save five, I'm *using* the one. If I just let the trolley hit the five, I'm *allowing* it. Your guarantee says I can't use you. But if I know I could save you and I don't, does your guarantee protect you from my inaction? Where does the shield stop? Does the moral community guarantee I'll rescue you, or just that I won't attack you?"

  *   **Likely Answer:** She will likely argue the guarantee is negative—a guarantee against intrusion, not a guarantee of aid.
  *   **Follow-up:** "But if I'm standing right next to you, and I could save you at zero cost to myself, and I don't... that feels like a betrayal of the community just as much as attacking you. If the guarantee doesn't cover easy rescues, is it really a guarantee of safety, or just a guarantee of non-interference? And why is non-interference the only thing that matters?"

  ### 4. Intending vs. Foreseeing
  "Let's tighten that screw on intention. Suppose I bomb a factory to stop a war. I know there are civilians inside. I don't *want* them dead, I just accept it as inevitable. On your view, am I violating the guarantee? Because from the civilian's perspective, they're just as dead whether I intended it or merely foresaw it. Why does my mental state change the moral status of their death?"

  *   **Likely Answer:** She'll argue that intention defines the *nature* of the action. If I don't intend their death, I'm not treating them as a means.
  *   **Follow-up:** "See, that's the move I want to press. You're saying the morality is in *my* head, not in *their* body. If I'm the civilian, I don't experience your intention. I experience the explosion. Why does the moral weight rest on my state of mind rather than the impact on their life?"

  ### 5. The Waiver Problem
  "I want to test the durability of this guarantee. Say I've made a serious promise to you. But then, a crisis hits. If you break that promise, it would help a lot of people. And let's say *I* come to you and I say, 'Please, break the promise. I waive my right. I want you to do it.' Does the constraint still hold? Can I give you permission to violate the guarantee, or does the moral community own that guarantee, not me?"

  *   **Likely Answer:** She might say that some constraints are inalienable—you can't consent to being tortured, for example, because it degrades the moral status of persons generally.
  *   **Follow-up:** "That's a really strong claim. It means you know what's good for me better than I do. If I say, 'This promise is binding me and hurting people, let it go,' and you say, 'No, the moral law forbids it,' aren't you actually using me now? You're using my integrity as a hostage to keep your hands clean."

  ### 6. The Lawyer Analogy
  "You compare this to a lawyer betraying a client's confidence. Even if betraying that confidence would stop two other lawyers from betraying theirs, she can't do it. It destroys the practice. But is morality really a practice like law? Lawyers have a specific role within a system. Morality seems like it applies to everyone, everywhere, all the time. If I'm not playing a role, but just living, do I really have the luxury of treating my moral obligations like professional confidentiality?"

  *   **Likely Answer:** She'll argue that we *are* all participants in the moral community, which functions like a practice.
  *   **Follow-up:** "But if the practice leads to outcomes that everyone in the community agrees are horrific—like letting five people die to save one—why should we trust the practice? At what point do we admit the institution is broken and needs reform?"

  ### 7. The Catastrophe Threshold
  "Let's go to the extreme. The usual 'ticking time bomb' stuff. If violating one constraint—say, torturing one guilty person—would genuinely prevent a genocide, do you still hold the line? Is there any number of lives where the guarantee gets overridden? Or is the guarantee absolute?"

  *   **Likely Answer:** She will likely resist the "override" language. She might say even then, you cannot torture, because that destroys the moral standing of the torturer and the community.
  *   **Follow-up:** "If the answer is truly 'no, never,' then it seems like the guarantee is more valuable than the lives it was supposed to secure. If the answer is 'well, maybe at some point,' then aren't we just doing consequentialism with a very high threshold? Where's the actual difference?"

  ### 8. Who Gets the Guarantee?
  "One thing I'm curious about is the membership card for this moral community. You talk about the guarantee being extended to each person. Does this cover everyone? What about people who can't understand guarantees—infants, people with severe cognitive disabilities, or even animals? If they can't participate in the practice of giving and receiving guarantees, do they still get the protection? And if not, what does that say about the basis of their rights?"

  *   **Likely Answer:** She will likely try to extend the protection to non-participants via proxy or potentiality.
  *   **Follow-up:** "But if the foundation is a *social practice* of guarantees, and they can't participate in the practice, aren't they relying on our charity rather than their right? That feels shaky. If the guarantee is the source of the right, and they can't hold the guarantee, do they have the right?"

  ### 9. The Falsification Question (Closer)
  "I want to end on something my producer insists I ask. You've built a really coherent system here. It's internally consistent. But I'm wondering: what would actually count against it? Is there a scenario, a piece of evidence, or a moral intuition that, if you encountered it, would make you say, 'Okay, maybe constraints aren't the foundation'? If everything can be explained away as 'that's just the impersonal standpoint talking,' how do we know this isn't just unfalsifiable?"

  *   **Likely Answer:** She might say that if her view couldn't account for basic moral intuitions about respect, it would fail.
  *   **Follow-up:** "But respecting persons is the starting assumption, not the test. I mean, if you saw a world where following these constraints consistently led to more suffering, more rights violations, and less respect overall... would you still recommend that world? Or at some point, do the results have to matter?"
