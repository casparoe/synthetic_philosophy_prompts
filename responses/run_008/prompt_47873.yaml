      *   *Guise Theory / Propositional Attitudes:* The proposition is the same, but it's grasped under different guises.
      *   *Pragmatics (Grice):* The semantic content is the same, but the *implicature* differs.
      *   *Best fit:* **Propositional Guises / Cognitive Roles.** The idea that the *proposition* is singular (Dan is right) but the *cognitive route* to it is part of the language's function (Priya is right). Or **Two-Dimensionalism**.
      *   *Selection:* The "Guise" or "Cognitive Role" distinction is the most direct synthesis. It acknowledges Dan's point (same truth conditions/reference) and Priya's point (different cognitive value).

