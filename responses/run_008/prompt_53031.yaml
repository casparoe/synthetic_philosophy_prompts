answer: |-
  You have put your finger on a profound disconnect between the *moral psychology* of everyday fairness and the *rational choice* models of formal bargaining. The short answer is that the everyday practice of "splitting the difference" does not presuppose a theory of distributive justice (who deserves what) at all. It presupposes a theory of **procedural reciprocity**.

  Here is a reconstruction of the implicit theory behind the practice, why it treats offers as meaningful despite their gameability, and why it diverges from the formal solutions you cited.

  ### 1. The Core Norm: Symmetry of Concession
  The formal theories you mentioned (Nash, Kalai-Smorodinsky) are outcome-oriented. They ask: "Given the structural constraints of this situation, what is the mathematically optimal point?"

  The everyday "meet in the middle" norm is process-oriented. It asks: "Did we both sacrifice equally to get here?"

  In this implicit theory, fairness is not defined by the relationship between the *outcome* and the *object* (e.g., does the rent match the room's square footage?). Fairness is defined by the relationship between the *outcome* and the *parties' movements*. If I start at \$1000 and you start at \$1400, and we meet at \$1200, the fairness claim rests on the fact that we both moved \$200.

  This explains why the opening offers matter so much, even if they are absurd. In formal theory, an opening offer is cheap talk. In everyday fairness, an opening offer is a **commitment of ego**. By stating a number, you plant a flag. Moving away from that flag is a social cost (a loss of face, a concession of status). "Splitting the difference" is a mechanism to ensure that the social cost of the negotiation is borne equally, regardless of the economic value of the room.

  ### 2. Fact vs. Claim: The Epistemic Suspension
  You noted that we don't split the difference on factual disputes (store hours). This is the key to the whole practice. The "meet in the middle" norm only functions under a condition of **epistemic suspension**.

  For the norm to work, the participants must implicitly agree to treat a partly factual dispute (room size, amenities) as a purely subjective claim (how much I *feel* the room is worth).

  If we treated the rent dispute as a factual problem, we would measure the rooms, calculate the price-per-square-foot, and assign rent objectively. But doing that requires an authority (a lease, a surveyor, a landlord) and turns the housemates into auditors of each other's lives. By treating the value as a "claim" rather than a "fact," we make it negotiable.

  The implicit theory presupposes that **value is intersubjective.** It assumes there is no "true" rent, only what we can agree on. Therefore, the "truth" of the rent is constituted by the agreement itself. The midpoint isn't fair because it reflects the room's value; it's fair because it reflects the point where our competing subjective valuations canceled each other out.

  This is why the practice feels sloppy when applied to things with objective metrics. It *is* sloppy. It actively ignores objective data to preserve the social frame that "we are equals negotiating," rather than "we are adversaries litigating facts."

  ### 3. Why Offers Carry Weight (Despite Gameability)
  You asked why stated offers are treated as meaningful if they are so gameable. In the implicit theory of everyday fairness, offers are not treated as **information about value**; they are treated as **signals of pain**.

  When I say, "I will pay no more than \$1000," the mediator does not hear, "The market value is \$1000." They hear, "Paying \$1001 causes me significant distress."

  The "meet in the middle" heuristic assumes that the distance between my offer and the final deal is proportional to the utility I am sacrificing. By meeting in the middle, the mediator is equalizing the *disutility* of the deal, not the *value* of the room.

  This is why anchoring works. If I anchor at \$800 (absurdly low), and we meet at \$1100, I have "sacrificed" \$300. If you anchored at \$1400 and moved to \$1100, you "sacrificed" \$300. We both feel the pain equally. The fact that the room is objectively worth \$1250 is irrelevant to the *fairness of the process*, even if it makes the *outcome* economically inefficient. The practice prioritizes **equity of suffering** over **accuracy of valuation**.

  ### 4. Divergence from Formal Theory
  This is where the everyday practice genuinely diverges from Nash or Kalai-Smorodinsky, rather than approximating them.

  *   **Formal Theory Inputs:** Fallback positions (BATNA), ideal points, utility functions. These are structural and often hidden.
  *   **Everyday Theory Inputs:** Opening offers, concession rates, visible willingness to cooperate. These are performative and public.

  Formal theory tries to solve the bargaining problem by looking at the *threat points* (what happens if we don't agree). Everyday fairness tries to solve it by looking at the *cooperation points* (how hard are we trying to agree).

  If you applied the Nash Bargaining Solution to your rent dispute, you would have to explicitly state your fallback: "If we don't agree, I will move out, which costs me \$2000 in moving fees, but you will be stuck with the whole rent, costing you \$3000."

  This is socially toxic. Explicitly stating your BATNA is a threat. It turns a cooperative house dynamic into an adversarial standoff. The "meet in the middle" norm exists specifically to **avoid** discussing fallback positions. It allows everyone to pretend they aren't threatening to leave, thereby preserving the relationship.

  ### 5. What Would Change If We Rebuilt the Practice?
  If you rebuilt the practice around the proportional or Nash ideas, three things would happen, none of them pleasant for a group of friends:

  1.  **Transparency of Vulnerability:** You would have to disclose your "walk-away" points. In a friendship or housemate situation, admitting "I literally cannot afford more than \$X" or "I have another option lined up" creates power imbalances. The "meet in the middle" norm protects privacy; formal theory demands disclosure.
  2.  **The End of "Reasonableness":** Currently, being "reasonable" means moving toward the center. Under a formal proportional system, being "reasonable" means accurately calculating your maximum gain. This shifts the virtue from *flexibility* to *calculation*. The person who is best at quantifying their own utility gains the most advantage.
  3.  **Factual Colonization:** You would be forced to adjudicate the objective value of the rooms. You would need to assign dollar values to sunlight, noise, and square footage. This turns the home into a marketplace. The "sloppiness" of splitting the difference is a feature, not a bug: it papers over the incommensurable differences between how you value a sunny room and how I value a quiet one.

  ### Summary: The Implicit Theory
  The everyday practice presupposes a theory of **Relational Egalitarianism**.

  It holds that in ongoing social relationships (housemates, friends, families), the preservation of the *equal status* of the participants is more important than the economic efficiency of the specific deal.

  *   **Fairness** = Equal concession (Symmetry).
  *   **Value** = Constructed by agreement, not external metric (Intersubjectivity).
  *   **Offers** = Signals of social cost, not economic truth (Expressivism).
  *   **Goal** = Conflict resolution, not utility maximization (Peacekeeping).

  It is "sloppy" economically because it is designed to be robust socially. It ignores the "facts" of the room sizes because acknowledging them too precisely would require a level of accounting that damages the social fabric. It ignores the "fallback" positions because stating threats explicitly damages trust.

  You felt the midpoint was fair because your mediator successfully equalized the *social cost* of the negotiation. You may have paid more for the room than it was "worth," but you paid the same "price" in concession as your housemates. In the implicit theory of everyday life, that is the only fairness that matters.
