answer: |-
  # Q&A Prep Sheet: Simulation Argument as Consistency Test

  **Context:** 40-minute discussion. Replies must be tight (≈2 mins). Audience is mixed (Skeptical Metaphysicians, Anthropic Experts, One Cosmologist).

  ---

  ### 1. The "Skeptical Skepticism" Objection
  **Who:** Mainstream Metaphysician (50% of room)
  **Phrasing:** "This feels like you're spending a lot of energy defending a skeptical hypothesis only to say it's not really about the hypothesis. If the simulation argument doesn't predict we're simulated, what work is it actually doing? Why should I care about this triad if the conclusion is just 'check your premises'?"
  **Damage:** Low. They are skeptical of the framework itself, not the internal logic.
  **Reply:**
  "Fair point. I'm not trying to convince you that self-locating belief is meaningful—if you reject that framework entirely, this talk isn't for you. But for those who do use anthropic reasoning, the Simulation Argument is often wielded as a physical prediction ('We are likely sims'). I'm arguing it's misused. It's actually a tool to expose hidden commitments. If you hold (a) and (b) but deny (c), you're making a substantive claim about computational physics or consciousness. My goal is to move the debate from 'Are we sims?' to 'Which premise are you dropping and why?' That clarifies the metaphysics regardless of the outcome."
  **Soft Spot:** If they press that "checking premises" is trivial philosophically, you risk sounding like you're offering a tautology. Keep the focus on the *hidden cost* premise to show non-triviality.

  ### 2. The "Measure vs. Count" Objection
  **Who:** The Cosmologist
  **Phrasing:** "You're talking about counting observer-moments. In eternal inflation, we don't have counts, we have measures over a continuum. If the 'cost' of a simulation depends on the physical measure assigned to that computational substrate, your triad collapses. You can't just count sims against biological observers."
  **Damage:** Medium. Challenges the physical coherence of premise (b), but doesn't break the logical triad.
  **Reply:**
  "You're right that 'counting' is a shorthand for a measure problem. But that actually strengthens my point. The 'reasonable cost' premise smuggles in assumptions about that measure. If computational shortcuts (like not rendering unobserved regions) change the physical measure of the observer, then premise (b)—that sims count equally—becomes the variable. Whether you use counts or measures, you still face the tension: can you have low-cost, high-measure simulations that are phenomenologically identical to biological ones? The triad holds; the currency just changes from 'number' to 'measure weight'."
  **Soft Spot:** If they insist that "observer" is ill-defined in QM, you can't defend (b) without a theory of consciousness. Concede that (b) is the placeholder for "theory of consciousness + measure."

  ### 3. The "SSA vs. SIA" Objection
  **Who:** Anthropic Experts (The 2 Specialists)
  **Phrasing:** "You say this is a consistency test, but aren't you just begging the question for the Self-Indication Assumption (SIA)? Premise (b) basically *is* SIA. If I'm a SSAer (Self-Sampling Assumption), I reject (b) outright. So your triad isn't revealing hidden commitments; it's just forcing everyone to admit they aren't SIAers."
  **Damage:** High. Targets the technical core of your anthropic reasoning. If successful, it makes your thesis look like a restatement of existing debates.
  **Reply:**
  "I'm not assuming SIA is correct; I'm assuming it's the default for the Simulation Argument literature. Bostrom's original argument relies on the indifference principle between sim and bio observers. If you're a SSAer, you naturally drop (b), and my framework predicts that. But notice where the work moves: SSAers usually drop (b) to save (c). I'm arguing that if you want to keep (c) without adopting SSA, you have to attack (a)—the computational cost. The triad forces SSAers to admit *why* they reject indifference. It isolates whether your resistance is anthropic (SSA) or physical (cost)."
  **Soft Spot:** They can push that "indifference" is never justified regardless of SIA/SSA. Be ready to concede that (b) is the strongest link to break, but insist that *which* link you break is the data point.

  ### 4. The "Lazy Evaluation" Objection (The One You Hope Nobody Asks)
  **Who:** Anthropic Expert or Cosmologist (The sharpest person in the room)
  **Phrasing:** "You claim the 'reasonable cost' premise hides computational shortcuts, like not rendering unobserved regions. But if a simulation uses lazy evaluation, the simulated observer isn't physically identical to a biological one—their past/future isn't fully realized. Doesn't that mean premise (b) is false by definition if premise (a) is true in the 'cheap' way? You can't have cheap sims *and* equal observer-moments. The triad collapses."
  **Damage:** Critical. This severs the link between your unique contribution (hidden cost) and the anthropic conclusion. It suggests (a) and (b) are mutually exclusive, making the triad trivial.
  **Reply:**
  "That's the crux of the 'hidden work' I'm highlighting. If 'cheap' means 'philosophical zombies' or 'incomplete physics,' then yes, (b) fails. But proponents of (a) argue substrate independence: consciousness supervenes on the computed information, not the uncomputed parts. My argument is that you can't have it both ways. You can't claim sims are cheap *because* of shortcuts, but also claim they count equally *despite* those shortcuts. Most people want both. I'm forcing a choice: either sims are expensive (full rendering) so (a) is false, or they are cheap but metaphysically distinct so (b) is false. Either way, the standard conclusion (c) is safe, but not for the reasons usually given."
  **Soft Spot:** This requires a theory of consciousness you might not want to defend. If they push that "incomplete rendering" precludes consciousness, you have to concede (b) is likely false, which undermines the "consistency test" novelty—it just becomes "Sims aren't real."
  **Note:** I suspect this is the question you fear. It attacks the coherence of your specific "hidden cost" insight.

  \answer{The "Lazy Evaluation" Objection}
