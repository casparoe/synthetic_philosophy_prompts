      *   *Triangulation:* This is the crux. Davidson introduced triangulation (later work, e.g., "The Second Person") to solve the problem of *which* cause determines content (the proximal nerve ending or the distal object?). It requires two creatures reacting to a common stimulus.
      *   *The LLM Problem:* The LLM doesn't react to the *world*; it reacts to *tokens*. The tokens are caused by the world, but the LLM's immediate environment is the vector space/context window.
