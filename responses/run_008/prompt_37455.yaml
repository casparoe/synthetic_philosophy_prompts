      *   *The "Cost" of Horn B:* If triangulation is empirical, Davidson loses his grip on objectivity. The "Second Person" is constitutive of thought, not just a common way we get it.
      *   *Derived vs. Underived Intentionality:* This is the Searle/Davidson overlap. The model has derived intentionality from the corpus. RI might recover the *corpus authors'* beliefs, not the model's.

