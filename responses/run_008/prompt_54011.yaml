prompt: |-
  I'm a journalist who writes about science and ideas for a general audience, and I'm working on a piece about how to act when you're not sure what's morally right in the first place — not factual uncertainty, but genuinely not knowing which moral theory is true. I've got a handle on the basics (moral hedging, the moral parliament idea, that sort of thing) but there's one bit I keep getting stuck on and I need someone to actually walk me through it.

  Please act as a professional philosopher who works on decision theory and ethics and has explained this stuff at a lot of dinner parties. Think carefully before answering — maybe start with a quick brainstorm of a few different ways to frame the core problem, then pick the framing you find most honest and build the explanation around that.

  Here's what I'm stuck on: suppose you're 60% a utilitarian and 40% a Ross-style pluralist who thinks what matters is avoiding violations of prima facie duties. People say you should act on the "expected moral value" of your options, like mixing the theories into a weighted average. But the two theories don't even share units. Utilitarianism gives you something like utils (whatever those are), and the pluralist theory gives you something like a count of duty violations. How do you set the exchange rate between "one duty violated" and "some amount of utility lost"? Is there any principled way to do this, or is the whole weighted-average picture a category error?

  Related thing I want your take on: I've come across the idea of normalizing each theory's values by the variance of how it scores your options, so that a theory with big dramatic swings in its rankings doesn't just dominate the average. But doesn't that give weird results too? Like, if one of your theories is nearly indifferent between all the options but has a tiny bit of noise in how it scores them, variance normalization seems to blow that noise up into a full-strength vote. Am I getting that right, or did I mangle it?

  And here's my own possibly-dumb thought experiment — tell me if it's dumb. Imagine you give 10% credence to a theory that says the entire enterprise of ranking options and trading them off is illegitimate, that morality just isn't the kind of thing you can put on a scale at all. Can the parliament model even give that theory a seat? What would its vote even be a vote for? Is there a principled way to handle theories like that, or does the whole framework quietly assume they're false?

  Don't worry about being exhaustive or name-dropping every paper — I can't check citations right now and honestly don't need them. What I need is a clear explanation of what the actual options are for the units problem, which one you'd defend if you had to, and where the whole project gets shaky. Its for an educated lay audience, so analogies are welcome, but don't dumb it down to the point of being wrong.
