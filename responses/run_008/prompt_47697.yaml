answer: |-
  It is a pleasure to address a question from someone with your background. Your intuition is sharp, and the "nag" you feel identifies one of the most active and contentious fault lines in contemporary decision theory. You have correctly identified that the mathematical machinery of Expected Value (EV) maximization, which serves well in probabilistic hazard assessment (PHA), behaves pathologically when decoupled from empirical constraints.

  Here is a breakdown of the concepts, names, and distinctions you requested, separating the settled mathematics from the philosophical contestation.

  ### 1. Names for the Configuration

  There are two primary terms used to describe the configuration you outlined.

  **Pascal's Mugging**
  Coined by the philosopher Nick Bostrom (2009), this is the colloquial name. It refers to a scenario where an agent is presented with a request (a "mugging") backed by a threat or promise of astronomical magnitude but supported by only a tiny, arguably ungrounded probability. If the agent maximizes expected utility, they must comply, no matter how absurd the claim. This matches your description of stakes being scaled to compensate for tiny probabilities.

  **Decision-Theoretic Fanaticism**
  This is the more technical, contemporary term (used by philosophers like William MacAskill, Hayden Wilkinson, and Jacob Thomas). "Fanaticism" is defined as the view that for any prospect with a non-zero probability of a sufficiently good outcome, there is some probability low enough that the agent should still prefer that prospect over a certainty of a moderate good.
  *   **Why this fits your nag:** In PHA, you deal with *risk* (probabilities grounded in physics and data). Fanaticism arises when dealing with *uncertainty* where the probability is a subjective credence untethered from frequency or physical models. The "Fanaticism" label captures the implication that rational agents *must* prioritize these uninformable tails over immediate, certain needs.

  ### 2. Relation to the St. Petersburg Paradox

  They are cousins, but they are not the same phenomenon.

  **The St. Petersburg Paradox** involves a lottery with an **infinite expected value**. The payoff structure is $2^n$ with probability $1/2^n$. The sum diverges to infinity. The paradox is that no rational person would pay an infinite (or even very large) finite amount to play.
  *   **Resolution:** Most decision theorists resolve this by positing **bounded utility**. If utility is bounded (e.g., by a logarithmic function of wealth or a hard cap), the expected value becomes finite.

  **Pascal's Mugging / Fanaticism** involves **finite but unbounded utility**. The payoff is not infinite, just astronomically large (e.g., $10^{40}$ lives saved). The probability is not part of a convergent series, but a single point estimate (e.g., $10^{-40}$).
  *   **The Distinction:** The St. Petersburg paradox is a problem of *summation* (an infinite series). Fanaticism is a problem of *trade-offs* (a single comparison). You can resolve St. Petersburg with bounded utility, but Fanaticism is more stubborn. Even with bounded utility, if the bound is high enough, one can construct a scenario where a tiny probability of hitting the bound dominates a certainty of a moderate good.

  **The Money Pump Connection:**
  You noted a resemblance to a money pump. Standard Fanaticism does not necessarily violate transitivity (the usual source of money pumps). However, it creates a vulnerability known as **dynamic inconsistency**. If you are a fanatic, you might make a plan today to invest in a low-probability future benefit, but when the time comes to pay the cost tomorrow (with the probability slightly updated), you might abandon the plan. This temporal instability is functionally similar to a money pump, though technically distinct from the intransitivity loops of classic preference theory.

  ### 3. Risk vs. Uncertainty (Knightian Distinction)

  Your distinction between "data-informable" and "uninformable" probabilities maps very closely to Frank Knight's 1921 distinction, though modern decision theory has complicated it.

  *   **Knightian Risk:** Probabilities are known (objective, frequentist, or well-calibrated model outputs). This is your career in seismology. The 1-in-10,000 figure is derived from slip rates, recurrence intervals, and physics. It is *epistemically grounded*.
  *   **Knightian Uncertainty:** Probabilities are unknown or unknowable. The 1-in-$10^{40}$ figure for an existential catastrophe caused by a specific future technology is not grounded in frequency or physics; it is a subjective credence.

  **The Conflict:**
  In the mid-20th century, the "Bayesian Revolution" (Savage, de Finetti) argued that the Knightian distinction was illusory. They claimed rational agents *must* assign precise subjective probabilities to all propositions to avoid Dutch Books (sure-loss contracts). Under this view, a 1-in-$10^{40}$ credence is treated mathematically identical to a 1-in-10,000 frequency.
  **Your nag is essentially a Knightian objection to the Bayesian orthodoxy.** You are observing that treating "uninformable" credences as if they were "informable" risks leads to absurd decision rules.

  Modern decision theorists often use the term **Ambiguity** (following Ellsberg) to describe this. There are formalisms (like Improbability Maximin or Imprecise Probabilities) that allow agents to represent uncertainty as a *range* of probabilities rather than a point estimate. If the range is $[0, 10^{-10}]$, the decision rule might default to the lower bound, effectively implementing the "probability discounting" you observed.

  ### 4. Settled Mathematics vs. Philosophical Disagreement

  This is the most critical part of your query. There has been significant recent progress in formalizing exactly what you are describing.

  **The Settled Mathematics (The Beckstead-Thomas Theorem)**
  In a pivotal 2021 paper ("A Paradox for Tiny Probabilities and Enormous Values"), philosophers Nick Beckstead and Thomas (2021) proved a trilemma. They showed that you cannot simultaneously hold the following three positions:
  1.  **Unbounded Utility:** There is no upper limit to how good an outcome can be (e.g., saving $N+1$ lives is always better than saving $N$).
  2.  **Antifanaticism:** You should not trade a certain moderate good for a tiny probability of an enormous good (if the probability is small enough).
  3.  **Standard Decision Axioms:** Specifically, **Independence** and **Continuity** (core components of VNM utility theory).

  **The theorem proves that if you accept standard decision axioms and Unbounded Utility, you *must* accept Fanaticism.** There is no arithmetic error in the fanatic's calculation; the error (if there is one) must be in the axioms or the utility function.

  **The Philosophical Disagreement**
  Since the math forces a choice, the disagreement sits entirely on **which axiom to reject**. There is no consensus. The three "escape routes" you identified correspond to rejecting one of the three horns of the trilemma:

  1.  **Utility Capping (Bounded Utility):**
      *   *The Move:* Assert that utility functions must be bounded. Saving $10^{40}$ lives is not infinitely better than saving $10^{39}$; eventually, the marginal utility drops to zero or asymptotes.
      *   *The Cost:* This implies "satiation." It suggests there is a point where adding more happy lives to the universe makes no difference to the value of the outcome. Many find this ethically repugnant.
      *   *Status:* Mathematically sound, ethically controversial.

  2.  **Probability Discounting (Rejecting Continuity/Independence):**
      *   *The Move:* Assert that probabilities below a certain threshold should be treated as zero, or weighted non-linearly.
      *   *The Cost:* This violates the **Continuity Axiom** of VNM. It creates "lexical preferences" where some goods are strictly superior regardless of probability. It also risks the "slippery slope": if you ignore $10^{-40}$, why not $10^{-30}$? Where is the cut-off?
      *   *Status:* Mathematically non-standard, intuitively appealing to practitioners (like seismologists).

  3.  **Epistemic Constraints (The "Defeater" Approach):**
      *   *The Move:* This is closest to your seismological intuition. It argues that a probability estimate like $10^{-40}$ is not a valid input for the EV formula because it lacks **epistemic grounding**. The probability is not just "low"; it is "unsupported."
      *   *The Cost:* This requires expanding decision theory to include meta-epistemic rules about when a credence is "too vague" to be used. It challenges the Bayesian view that all uncertainty can be quantified.
      *   *Status:* Gaining traction in existential risk literature (e.g., Toby Ord, Hilary Greaves), but lacks a unified formalism.

  ### Summary for the Retired Seismologist

  Your "nag" is philosophically robust. You are identifying the friction between **instrumental rationality** (consistency of preferences, which demands EV maximization) and **epistemic rationality** (connection of beliefs to evidence, which demands skepticism of ungrounded numbers).

  *   **Name:** The problem is **Decision-Theoretic Fanaticism** (or Pascal's Mugging).
  *   **St. Petersburg:** It is a related but distinct problem of unbounded utility vs. infinite series.
  *   **Knight:** Your distinction is indeed **Risk vs. Uncertainty**, though modern Bayesians try to collapse them.
  *   **The Disagreement:** The math (Beckstead-Thomas) says you cannot have Unbounded Utility, Standard Axioms, and Common Sense (Antifanaticism) all at once.
      *   Economists tend to keep the Axioms and Utility, accepting Fanaticism.
      *   Ethicists tend to keep the Axioms and Common Sense, accepting Bounded Utility.
      *   Practitioners (like you) tend to keep Common Sense and Utility, rejecting the Axioms (via discounting or epistemic constraints).

  There is no consensus on which sacrifice is correct. Your intuition that "uninformable probabilities" should not drive policy via simple multiplication is a defended philosophical position, often argued under the banner of **Ambiguity Aversion** or **Epistemic Humility**. You are not refusing to do the arithmetic; you are questioning the validity of the inputs, which is a scientifically sound stance.
