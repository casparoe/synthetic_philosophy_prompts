  **Jointly Tense Pairs**
  1.  **Lexicality vs. Mundane Continuity:** Asserting "no pleasure outweighs torture" conflicts with "minor pains/pleasures aggregate in medical decisions." If pain lexically dominates, minor pains shouldn't aggregate to block minor pleasures, yet chronic pain management assumes they do.
  2.  **Asymmetry vs. Aggregation:** The intuition that creating misery is wrong but failing to create happiness is fine conflicts with symmetric aggregation models. Satisfying both requires abandoning standard total views.

  **Desiderata Spec**
  1.  **Case Range (NN):** Must adjudicate extreme cases (trillions of specks vs. one torture) and mundane swaps (pinprick vs. lifetime bliss). If treating them differently, a principled boundary is required, not just intuition pumping.
  2.  **Asymmetry Intuition (NN):** Must accommodate the view that creating miserable lives is impermissible even alongside happy ones, while failing to create happy lives is permissible.
  3.  **Existence Objection (NN):** Must survive the "Benevolent World-Exploder" argument (that pain-dominance implies ending all life). Either accept the conclusion or explain the error without ad hocery.
  4.  **Structural Ontology (NN):** Must specify whether measuring the badness of states of affairs or the aggregation of reasons/claims, since commensurability might hold for one but not the other.
  5.  **Threshold Precision (P):** If positing a cancellability threshold, must locate it and address vagueness. If the threshold is vague, the theory must admit whether ethics itself becomes imprecise at the margins.

  **Evaluation**
  Plain Hedonistic Utilitarianism (HU) satisfies Mundane Continuity and Existence Stability but fails Case Range (implies specks outweigh torture) and Asymmetry (treats pleasure/pain symmetrically). Lexical Threshold Negative Utilitarianism (LTNU) satisfies Case Range (blocks specks) and Asymmetry but struggles with Threshold Precision (the "where" is arbitrary) and risks Existence Stability if the threshold is low. HU offers smooth aggregation; LTNU offers lexical protection but introduces discontinuity and vagueness problems. Neither fully satisfies all NN criteria without cost, confirming your hunch that lexicality and mundane tradeoffs pull in opposite directions.
