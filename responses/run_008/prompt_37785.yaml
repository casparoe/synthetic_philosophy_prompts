  5–25: Phase 1 (3 rounds, 6 mins each). Swap roles at minute 15.
  25–45: Phase 2 (3 rounds, 6 mins each). Swap roles at minute 35.
  45–75: Debrief.
  **Materials:** Code cards, Compel tokens (pokers/chips), score sheet.

  **Debrief Script:**
  1.  *Phenomenology:* Ask Phase 1 Agents: "Did navigating the truth feel morally safer, or just more exhausting? Did you feel clever or dirty?" Ask Hunters: "Did truthful answers feel less hostile, even if misleading?"
  2.  *Mechanism:* Distinguish *assertion* (explicit claim) from *implicature* (suggested meaning). Did Agents violate the spirit of communication while keeping the letter? Write examples on the board: "I didn't say X" vs. "X is false." Map specific moments: When an Agent said "I usually go to the bank" (true) implying "The code is at the bank" (false), did they lie?
  3.  *Evaluation:* If the Hunter is misled equally, is the harm identical? Or does the Agent's integrity remain intact in Phase 1? Leave unsettled: Is technical truthfulness a moral shield or a loophole? Connect to Kant: Does the duty to truthfulness protect the *listener* or the *speaker's humanity*? Ask: "Would you trust the Phase 1 Agent later? What about the Phase 2 Agent?"

  **Predictable Failures:**
  1.  *Stonewalling:* Agents say "No comment" to avoid traps. *Fix:* Rule requires responsive answers; Compel tokens override evasion. Warn that non-answers count as rule violations.
  2.  *Rules-Lawyering:* Agents argue their falsehood was "technically true" (e.g., ambiguous phrasing). *Fix:* Honor system + partner challenge. If challenged successfully by Hunter, point loss. This forces Agents to own their ambiguity.
  3.  *Phase 1 Collapse:* Students lie in Phase 1 anyway due to competitive stress. *Fix:* Emphasize this is about *experience*, not winning. Pause game if widespread cheating occurs. Remind them the "penalty" is philosophical, not just points. If a student lies, don't shame them. Use it: "Why was the constraint so hard to bear?"

  **Limitations:**
