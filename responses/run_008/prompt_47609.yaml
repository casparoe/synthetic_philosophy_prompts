answer: |-
  **To:** The Monthly Review Committee
  **From:** The Chair
  **Subject:** The Project Continuation Protocol (20-Minute Version)

  ### Context
  We are not here to discuss how much we have spent. We are here to decide if the next pound we spend will buy us more value than putting that pound into a different project.

  Research into 'escalation of commitment' confirms your suspicion: the trap isn't just psychological bias; it is structural. Like the dollar auction, the logic of 'minimising loss' drives us to maximise ruin. To break this, we cannot rely on willpower. We need a procedure that forces a structural break in the decision-making process.

  This document is the **Continuation Protocol**. It is designed to be printed and used during the monthly review. It takes 20 minutes per project.

  ---

  ### The Continuation Protocol

  **Timebox:** 20 Minutes Strict.
  **Attendees:** Committee + Project Owner (PO).
  **Rule:** The PO speaks only to answer specific questions. They do not present slides. They do not narrate the journey.

  #### Phase 1: The Zero-Base Reset (5 Minutes)
  *Goal: Neutralise the sunk cost and the dollar-auction dynamic.*

  **Question 1:** "If this project did not exist today, and we had the budget in hand, would we approve starting it *now*?"
  *   **Yes:** Proceed to Phase 2.
  *   **No:** Immediate Kill. (Exception: See Phase 3, Question 4).
  *   **Note:** If the answer is "No, but we've come too far," the Committee Chair must intervene. That is the auction talking.

  **Question 2:** "What specific, observable evidence proves the project is 70% complete, rather than 70% *spent*?"
  *   **Acceptable:** Working code in production, signed contracts, physical assets installed.
  *   **Unacceptable:** "Vendor says so," "Designs approved," "Testing phase."
  *   **Action:** If evidence is unavailable, downgrade the 'completion' estimate by half for the sake of this calculation.

  #### Phase 2: The Marginal Audit (10 Minutes)
  *Goal: Isolate local rationality from global ruin.*

  **Question 3:** "What is the exact cost to finish (CTF) from this moment forward?"
  *   PO must provide a number. No ranges. If they give a range, use the highest number.
  *   *Committee Check:* Has this CTF increased in the last three months? If yes, why should we trust it now?

  **Question 4:** "If we spend the CTF, what is the tangible value delivered on Day 1 of completion?"
  *   Must be quantified (revenue, risk reduction, hours saved).
  *   If the value is "strategic alignment" or "brand equity," move to Phase 3.

  **Question 5:** "Is there a 'Half-Stop' option?"
  *   Can we harvest the 70% built so far without spending the CTF?
  *   Example: Can we use the new software in one warehouse only? Can we launch the brand in one region?
  *   If yes, fund the Half-Stop. If no, proceed to verdict.

  #### Phase 3: The Verdict (5 Minutes)
  *Goal: Make the decision and define the off-ramp.*

  **Decision Matrix:**
  1.  **Kill:** If Zero-Base Reset is 'No'.
  2.  **Fund:** If Zero-Base Reset is 'Yes' AND Marginal Value > CTF.
  3.  **Mandate:** If Zero-Base Reset is 'No' BUT stopping creates existential risk (legal, safety, systemic collapse).

  **Condition for Funding:**
  If funded, the next review date is set *now*, not next month. A specific milestone must be hit by that date. If the milestone is missed, funding terminates automatically without a vote. This is a pre-commitment device to counter future escalation.

  ---

  ### Application: Three Test Cases

  Here is how the Protocol runs on your current pipeline.

  #### Case 1: The Warehouse Software Migration
  *Status:* 2 years late. £2m spent. Vendor claims 70% done, last 30% is "complex integration."
  *   **Phase 1 (Reset):** Would we start this migration today given the current vendor landscape? *Likely No.* Newer tech exists. Evidence of 70% completion? *Vendor testimony only.* Downgrade to 40%.
  *   **Phase 2 (Audit):** Cost to Finish (CTF) has risen every quarter for 18 months. Value on completion? *Efficiency gains that were relevant 2 years ago.* Half-Stop option? *Can we run legacy in parallel and scrap the migration?* Yes.
  *   **Phase 3 (Verdict):** **KILL.**
  *   **Rationale:** The Zero-Base test fails. The "last 30%" is a moving goalpost typical of the dollar auction. We harvest what works (if anything) and revert to legacy or tender anew.
  *   **Committee Feeling:** Relief mixed with guilt over the £2m.
  *   **Protocol Output:** Stop funding.

  #### Case 2: The Modest Rebrand
  *Status:* On budget, on time. 70% rolled out.
  *   **Phase 1 (Reset):** Would we start a rebrand today? *Pause.* Nobody can articulate *why* we are doing it other than "we started it."
  *   **Phase 2 (Audit):** CTF is low. Value on completion? *Marketing says "freshness."* No revenue link. Half-Stop? *Yes, stop at 70%. Use the new logo on digital, keep old on trucks.*
  *   **Phase 3 (Verdict):** **KILL (or Pause Indefinitely).**
  *   **Rationale:** A project without a 'Why' fails the Zero-Base test immediately. Completing it is locally rational (it's cheap to finish) but globally useless.
  *   **Committee Feeling:** Annoyance at Marketing Director.
  *   **Protocol Output:** Stop funding.

  #### Case 3: The Foundational API Rewrite (The Unpleasant Result)
  *Status:* 18 months in. £1.5m spent. Zero customer visibility. No revenue increase.
  *   **The Gut Feeling:** This looks like a money pit. It's invisible tech debt work. It feels like we should kill it and focus on sales features.
  *   **Phase 1 (Reset):** Would we start this today? *Yes.* If our core API collapses, the company stops trading.
  *   **Phase 2 (Audit):** CTF is £500k. Value on completion? *£0 revenue, but prevents 100% system outage risk.* Half-Stop? *No. Half-finished architecture is less stable than the old one.*
  *   **Phase 3 (Verdict):** **FUND.**
  *   **Rationale:** This is the 'Mandate' clause. The ROI is negative in cash, but infinite in risk mitigation. The Zero-Base test passes because the alternative is business failure.
  *   **Committee Feeling:** Frustration. It feels like throwing good money after bad because there's no 'win' condition, only 'survival'.
  *   **Protocol Output:** Continue funding, but set a hard deadline for completion.

  ---

  ### Limitations & Failure Modes

  This procedure is a tool, not a truth machine. You need to know where it will misfire.

  **1. The False Kill (The "Restart Tax")**
  Sometimes the Protocol will tell you to kill a project that *should* have been finished. You will kill the Migration (Case 1), only to realise 12 months later you need to build the same thing again, costing £3m instead of the remaining £1m.
  *   **Acceptance:** You must accept this cost. It is the price of regaining control. Paying the 'restart tax' is better than paying the 'endless auction tax'.

  **2. The Strategic Lie**
  Project Owners may learn to game the Zero-Base Reset. They will argue "Yes, we would start this today" even if they wouldn't.
  *   **Mitigation:** The Committee must challenge the 'Why'. If the 'Why' is vague, the answer defaults to 'No'.

  **3. The Values Boundary (Facts vs. Virtue)**
  The Protocol handles facts (costs, dates, specs). It cannot handle values.
  *   **Example:** A project to reduce carbon emissions might fail the Marginal Audit (costs more than it saves).
  *   **Handover:** If a project fails the financial audit but aligns with a core company value (e.g., "We are a green logistics firm"), the Committee must vote on *Values*, not *Finance*. Mark these decisions clearly in the minutes as "Strategic Mandate" so they don't confuse future financial reviews.

  **4. The Morale Trap**
  Killing a project demoralises the team working on it.
  *   **Mitigation:** When killing, explicitly state: "This is not a failure of effort; it is a change in strategy." Reassign the team immediately. Do not let them sit in the wreckage.

  ### Final Instruction
  Print this. Put it on the table. When a Project Owner says "We've come too far to turn back," read Phase 1, Question 1 aloud. Do not move to the next agenda item until the question is answered.
