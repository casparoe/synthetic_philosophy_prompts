prompt: |-
  I chair a monthly review commitee at a mid-sized logistics company where we decide which internal projects keep getting funded and which get killed. Think software migrations that are two years late, a rebrand that's half rolled out, a warehouse automation pilot eating money — you know the type. The problem is that every month, the person running each project shows up and argues that they're 70% done and it'd be a waste to stop now, and every month we nod along and approve another tranche. I've read enough pop-management stuff to know "sunk cost fallacy, just ignore sunk costs, next question" but I've also started to suspect that advice is too glib, and here's why: I once read about the dollar auction, where the top bidder wins the prize but the *second* bidder also has to pay their bid and gets nothing. The nasty part is that at every point after you're in second place, bidding a bit more is actually the cheaper move compared to eating your loss and walking away — it's locally rational to keep going even though the whole sequence is ruinous. That maps onto our projects uncomfortably well: when we've sunk 2 million into a migration, "one more quarter" often genuinely looks better than abandoning it, and I don't think the standard sunk-cost lecture captures that. The trap isn't just bias, it's structure.

  So what I want is a real procedure my committee can actually run in a 20-minute slot per project, written so the least philosophical person in the room can follow it. Please base it on whatever escalation-of-commitment research and the dollar-auction logic actually support, not just vibes. Specifically I'd want it to cover: (a) questions that separate "this is genuinely 70% done and the last 30% is cheap" from "this is the auction talking"; (b) some way to handle the fact that the local-rationality trap means we can't trust our own month-to-month judgements — maybe pre-commitment devices or reframing what's on the table at each decision point, you decide what's actually workable; (c) where the procedure has to stop and hand it to human judgement because it's a values question, not a facts question; and (d) it should be honest about where it will misfire, e.g. projects that get killed and restarted later at higher cost.

  Then run it on three cases: the warehouse software migration that's 70% "done" (the vendor says the last 30% is always the hard 30%), a modest rebrand that is on budget and on time but where nobody can articulate what the rebrand is *for*, and a case where the procedure should say keep going even though the gut says kill it — I want at least one of the three to come out as an answer I won't like, because otherwise I won't trust the thing.

  Please write the whole answer in British English, and keep it usable — I'm going to print it and put it in front of five tired people with a spreadsheet.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Chair of a monthly review committee at a mid-sized logistics company.
      *   **Problem:** Projects keep getting funded due to the "sunk cost fallacy," but the user correctly identifies it's deeper than just bias—it's structural (like the Dollar Auction/Escalation of Commitment). Local rationality drives global ruin.
      *   **Goal:** A 20-minute per project procedure for the committee.
      *   **Constraints:**
          *   Based on escalation-of-commitment research and dollar-auction logic (not just pop-management).
          *   Usable by tired people with a spreadsheet (practical, not philosophical).
          *   British English.
          *   Must cover: (a) distinguishing real progress vs. auction trap, (b) handling local-rationality traps (pre-commitment/reframing), (c) identifying values vs. facts boundaries, (d) admitting limitations (false negatives).
          *   Must test the procedure on three specific cases:
              1.  Warehouse software migration (70% done, vendor claims last 30% is hard).
              2.  Rebrand (on time/budget, but purpose unclear).
              3.  A case where the procedure says "keep going" but gut says "kill" (to build trust).

  2.  **Deconstruct the Theory:**
      *   *Sunk Cost Fallacy:* Ignoring past costs. (User knows this is too simple).
      *   *Dollar Auction (Shubik):* Bidding escalates because the second-highest bidder pays but gets nothing. In projects, the "loss" of stopping feels heavier than the cost of continuing *if* there's a chance of recovery.
      *   *Escalation of Commitment (Staw, Ross, Brockner):* Why do people double down? Self-justification, proximity to completion, social pressure, lack of clear stopping rules.
      *   *Solution Logic:*
          *   Reframe the decision: Don't ask "Should we stop?" Ask "If we weren't doing this, would we start it *now*?" (The Zero-Base Test).
          *   Separate Past from Future: Isolate the *marginal* cost vs. *marginal* benefit.
          *   Pre-commitment: Set hard gates *before* money is spent, not during.
          *   Externalize: Remove the project owner from the decision (or limit their voice).

  3.  **Drafting the Procedure (The "Kill Sheet"):**
      *   *Name:* Needs to sound official but functional. "Project Continuation Protocol" or "The Red Light Procedure." Let's go with "The Continuation Protocol."
      *   *Time:* 20 minutes strict.
      *   *Structure:*
          *   Phase 1: The Reset (5 mins) - Reframing the question.
          *   Phase 2: The Marginal Audit (10 mins) - The numbers/logic.
          *   Phase 3: The Verdict (5 mins) - Decision & Conditions.
      *   *Addressing Specific Requirements:*
          *   (a) Distinguishing 70% real vs. auction: Focus on *evidence* of completion, not *claims*.
          *   (b) Local rationality: Use the "Fresh Eyes" test (would we start today?).
          *   (c) Values vs. Facts: Strategic alignment vs. ROI.
          *   (d) Limitations: Acknowledge "false kills."

  4.  **Developing the Three Test Cases:**
      *   *Case 1: Warehouse Migration.* Classic escalation. Vendor says "last 30% is hard."
          *   *Application:* Marginal cost likely high. Benefit unclear if delayed 2 years.
          *   *Outcome:* Likely Kill or Pause.
      *   *Case 2: Rebrand.* On budget/time, but no purpose.
          *   *Application:* Zero-Base Test fails immediately. Why are we doing this?
          *   *Outcome:* Kill.
      *   *Case 3: The "Keep Going" (Unpleasant Result).* Needs to be a project that looks bad but is strategically vital. Maybe a compliance/regulatory project or a foundational tech debt fix that offers no revenue but prevents collapse.
          *   *Selection:* A safety/compliance upgrade. It eats money, no revenue, looks like a sinkhole. But stopping means legal risk.
          *   *Outcome:* Continue (even though it feels like wasting money).

  5.  **Refining the Tone and Language:**
      *   British English (programme, centre, realise, £).
      *   Professional, direct, slightly weary but authoritative (matching the user's vibe).
      *   No fluff. "Tired people with a spreadsheet."

  6.  **Iterative Review against Constraints:**
      *   *Did I address the Dollar Auction?* Yes, by reframing the "loss" of stopping vs. the "cost" of continuing.
      *   *Is it 20 minutes?* The steps need to be tight.
      *   *Is it actionable?* Yes, specific questions to ask.
      *   *Did I include the limitation section?* Yes, crucial for honesty.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Initially, I might make it too complex. Need to simplify the "Marginal Audit." Just ask: "Cost to finish" vs. "Value if finished today."
      *   *Correction:* Make sure the "Values" section is clear. Sometimes you *must* spend money even if ROI is negative (e.g., safety). The procedure needs to allow for that without calling it a "failure."
      *   *Correction:* Ensure the "Unpleasant Result" case is genuinely unpleasant. A safety project is good, but maybe a "platform migration that enables *future* products" is better. Let's go with the "Foundational API Rewrite." It looks like a money pit, no customer visibility, but essential for long-term survival.

  8.  **Final Output Structure:**
      *   Introduction (acknowledging the insight).
      *   The Protocol (The 20-minute workflow).
      *   The Three Cases (Applied).
      *   The Limitations (Where it breaks).

  *(Self-Correction on British English)*: Ensure spelling (programme, organisation, colour) and idioms (reckon, proper, whilst) are appropriate but not caricatured. Keep it business-British.

  *(Final check on the "Dollar Auction" logic)*: The key insight is that the decision *now* must ignore the entry fee. The procedure must force the committee to treat the sunk cost as zero. The "Fresh Start" question is the standard academic counter-measure to escalation of commitment (Staw & Ross). I will emphasise that.

