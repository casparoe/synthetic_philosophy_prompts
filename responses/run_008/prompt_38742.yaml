      *(Refining Part 2)*: The user asks if the dispute collapses into "do features do causal work." I need to point out that for Dennett, *predictive success* is the metric, not *causal isolation*. A probe might find a correlation that is epiphenomenal but still predictive. Dennett would accept the belief attribution if the prediction works, even if the "belief" isn't a localized causal unit. The ML engineer wants a causal circuit. Dennett wants a predictive model. This is a tension.

      *(Refining Part 3)*: What's new about LLMs? The lack of *embodiment* and *reinforcement from reality*. Dennett's intentional stance usually applies to systems that interact with the environment to satisfy desires. LLMs interact with a text distribution. This changes the "truth conditions" of the beliefs.

  7.  **Final Polish:** Check against the "motivated amateur in philosophy" constraint. Don't lecture on Dennett, assume I know him, just translate. Ensure the ML terms are used accurately (e.g., distinguishing weights from activations, SAE features from PCA).

