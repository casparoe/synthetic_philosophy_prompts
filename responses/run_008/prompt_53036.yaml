prompt: |-
  I run a small decision-theory blog and want to build an interactive quiz titled "What Kind of Probabilist Are You?" for readers who have encountered the sharp-credences debate only in passing. The question the quiz must sort people on is: must rational credences be single real numbers, and, if they need not be, what should govern action when they are not? The quiz must sort readers by what they say about cases, not by which labels they like, so no question may ask anything like "do you think credences are sets of probabilities?" — every question must be a concrete choice or a commitment the reader can endorse in plain language.

  Please build it as follows. First construct the logical space from branching questions, not from a list of schools: roughly, (a) is there always a determinate answer to what your credence in a given proposition is; (b) if not, do the behavioral signatures of "ambiguity aversion" live in the credence itself or in the utility/risk side; (c) for those with non-sharp credences, how is a set or interval of probabilities converted into a choice. Then locate the actual positions in that space, and note which answer combinations nobody in the literature occupies, with a one-sentence diagnosis of why (incoherent, unattractive, or merely unexplored).

  The quiz should have ten questions, each presenting a case with two or three plain-language options. The following cases must appear among them: (1) an Ellsberg-style two-urn choice (known 50/50 composition vs. unknown) at stakes small enough that utility is effectively linear, so risk attitude in the ordinary sense cannot be the explanation; (2) a follow-up testing whether the preference for the known urn survives when the play is repeated many times with the unknown urn's composition fixed once at the start — ambiguity should persist across repetition in a way ordinary risk aversion does not; (3) a dilation case: the reader is happy with credence 1/2 for a coin they know is fair, then learns the result of an independent, ambiguous device, and conditional on that result their credence in the coin spreads toward the extremes — ask whether this is a reductio, a benign consequence, or a misuse of the formalism, with options phrased as reactions rather than positions; (4) a bid-ask spread case: the least the reader would accept to sell a small-stakes bet on an ambiguous event and the most they would pay to buy it are some distance apart, and the question is what, if anything, rationally occupies that gap; (5) a second-order-probability case: whether the reader would model their uncertainty about a probability as itself a sharp distribution over probabilities, and whether they find it a problem that the resulting overall credence then pins down a single fair betting price; (6) at least two cases in which the imprecise decision rules come apart behaviorally — e.g. one act is optimal relative to some probabilities in a set but not the worst-case-minimizing one, versus an act that only dominates when whole intervals are compared — presented as concrete menus with the properties of each option described in words, so a reader picks a meal without knowing which rule they are endorsing. The remaining questions are up to you, but each must do diagnostic work.

  The leaves must include: the orthodox sharp Bayesian; the hierarchical Bayesian who pushes the non-sharpness up a level; the view that absorbs ambiguity attitudes into the utility side (Buchak-style risk-weighted expected utility); imprecise probabilists split by decision rule — E-admissibility in Levi's sense, maximin over the set of probabilities, and interval-dominance or permissive views; and an eliminativist leaf for readers who deny there are credences to be sharp in the first place. Where two leaves cannot be separated by the quiz — for instance, a plain maximin-over-probabilities rule versus Gilboa–Schmeidler-style maxmin expected utility, or E-admissibility versus Levi's full view with its secondary security level — flag this explicitly and say what further case, if any, would drive the wedge.

  Please return the whole thing as a single JSON object with the following fields. "branching_logic": an array of objects, each with "node", "question" (the substantive question encoded at that fork, in one sentence), and "children". "questions": an array of ten objects, each with "id", "case" (the concrete scenario), and "options", an array of two or three objects each with "label" (a letter) and "text" (the plain-language answer). "scoring_key": an array of objects, each with "leaf" (the position's name, which may appear here but never inside the questions), "thesis" (one sentence), "signature" (the option letters that route a reader there, with wildcards where questions are non-diagnostic for that leaf), and "awkward_commitment" (the consequence this leaf has to bite hardest). "unoccupied": an array of objects, each with "signature" and "diagnosis". "separation_failures": an array of objects, each with "pair", "why" (why the quiz cannot tell them apart), and "wedge" (a further case that would, or a statement that none would). Before the JSON, give no preamble; after it, nothing.
reasoning: |-
  The user wants a JSON object representing a quiz titled "What Kind of Probabilist Are You?".
  The quiz is designed for a decision-theory blog audience familiar with the sharp-credences debate.
  The core sorting question is: "Must rational credences be single real numbers, and if not, how do they govern action?"

  Constraints & Requirements:
  1.  **Format:** Single JSON object. No preamble or postscript.
  2.  **Structure:**
      *   `branching_logic`: Array of objects defining the logical tree (node, question, children).
      *   `questions`: Array of 10 objects (id, case, options).
      *   `scoring_key`: Array of objects (leaf, thesis, signature, awkward_commitment).
      *   `unoccupied`: Array of objects (signature, diagnosis) for logically possible but unoccupied positions.
      *   `separation_failures`: Array of objects (pair, why, wedge) for positions the quiz can't distinguish.
  3.  **Content Requirements:**
      *   **Questions:** 10 total. Must be concrete cases/commitments, not label-checking.
      *   **Specific Cases to Include:**
          1.  Ellsberg two-urn (small stakes, linear utility).
          2.  Repeated Ellsberg (fixed unknown composition).
          3.  Dilation case (reaction to spreading credence).
          4.  Bid-ask spread (what occupies the gap).
          5.  Second-order probability (sharp distribution over probabilities).
          6.  Two cases where imprecise decision rules come apart behaviorally (E-admissibility vs. Maximin vs. Interval Dominance).
          7.  3 remaining diagnostic questions.
      *   **Leaves (Outcomes):**
          *   Orthodox Sharp Bayesian.
          *   Hierarchical Bayesian (non-sharpness pushed up a level).
          *   Risk-Weighted Expected Utility (Buchak-style, ambiguity in utility).
          *   Imprecise Probabilists (split by rule: E-admissibility, Maximin, Interval Dominance/Permissive).
          *   Eliminativist (no credences).
      *   **Branching Logic:** Must construct the logical space first (a: determinate answer? b: ambiguity aversion location? c: conversion to choice?), then locate positions.
      *   **Unoccupied Spaces:** Identify combinations nobody holds and diagnose why.
      *   **Separation Failures:** Explicitly flag leaves that cannot be separated by this specific quiz (e.g., Maximin vs. Maxmin EU) and suggest a wedge case.

  Plan:
  1.  **Define the Logical Space (Branching Logic):**
      *   Root: Do you always have a single precise number for every proposition? (Yes -> Sharp/Hierarchical/RWEU path; No -> Imprecise/Eliminativist path).
      *   Branch 1 (Sharp side): Is the hesitation in Ellsberg cases due to risk attitudes over known probabilities or something else?
      *   Branch 2 (Imprecise side): How do you choose? (Maximin, E-admissibility, etc.).
      *   Branch 3 (Eliminativist): Do you reject the framework entirely?

  2.  **Draft the 10 Questions:**
      *   Q1: Ellsberg (Small stakes). Tests Sharp vs. Imprecise/RWEU.
      *   Q2: Repeated Ellsberg. Tests if ambiguity aversion persists (distinguishes RWEU/Risk from pure Imprecise).
      *   Q3: Bid-Ask Spread. Tests the nature of the gap (Indifference vs. Incomparability).
      *   Q4: Second-Order Probability. Tests Hierarchical Bayesian vs. Imprecise.
      *   Q5: Dilation. Tests reaction to formal consequences of Imprecise Probability.
      *   Q6: Decision Rule Conflict 1 (E-admissibility vs. Maximin). A case where an option is admissible but not max-min optimal.
      *   Q7: Decision Rule Conflict 2 (Interval Dominance vs. E-admissibility). A case where an option is not dominated but not admissible.
      *   Q8: Reflection/Updating. How to handle learning with sets.
      *   Q9: The "Why" of Precision. Is precision a requirement of rationality or just a modeling convenience?
      *   Q10: Action under Ignorance. Pure ignorance case (Principle of Insufficient Reason vs. Ignorance).

      *Refining Questions to match constraints:*
      *   Need to ensure Q6 and Q7 clearly separate the decision rules without using jargon.
      *   Need to ensure the "Eliminativist" leaf is reachable.
      *   Need to ensure "Hierarchical Bayesian" is distinct from "Orthodox Sharp".

  3.  **Define Leaves & Signatures:**
      *   *Orthodox Sharp Bayesian:* Always precise, maximizes EU.
      *   *Hierarchical Bayesian:* Precise priors over parameters, reduces to sharp credence eventually or treats higher-order uncertainty as sharp risk.
      *   *Risk-Weighted (Buchak):* Sharp credences, but non-linear weighting of probabilities (explains Ellsberg).
      *   *Imprecise - Maximin:* Sets of probabilities, choose worst-case.
      *   *Imprecise - E-admissibility (Levi):* Sets of probabilities, choose any that is optimal for *some* probability in the set (plus security).
      *   *Imprecise - Interval Dominance/Permissive:* Sets, choose any not strictly dominated.
      *   *Eliminativist:* Rejects credences.

  4.  **Identify Unoccupied Spaces:**
      *   Example: Believing credences are sets but insisting on a single precise betting price for everything (incoherent).
      *   Example: Believing credences are sharp but refusing to bet according to them without a risk function (covered by RWEU, but maybe a specific combo is empty).
      *   Example: Dilation enthusiast who hates ambiguity aversion (unstable).

  5.  **Identify Separation Failures:**
      *   Maximin (Wald) vs. Maxmin Expected Utility (Gilboa-Schmeidler). Often behaviorally identical in simple static cases. Wedge: Dynamic consistency or specific mixture requirements.
      *   E-admissibility vs. Levi's full view (which includes a secondary "security" level). The quiz might only capture the primary admissibility.

  6.  **Construct JSON:** Assemble the pieces carefully ensuring valid JSON syntax.

  *Self-Correction during drafting:*
  *   Make sure the "Branching Logic" section reflects the *structure* of the quiz logic, not just the questions.
  *   Ensure the "Separation Failures" explicitly mentions Maximin vs. Maxmin EU as requested in the prompt ("plain maximin-over-probabilities rule versus Gilboa–Schmeidler-style maxmin expected utility").
  *   Ensure Q1 is the Ellsberg case with small stakes.
  *   Ensure Q2 is the Repeated Ellsberg case.
  *   Ensure Q3 is Dilation.
  *   Ensure Q4 is Bid-Ask.
  *   Ensure Q5 is Second-Order.
  *   Ensure Q6 & Q7 are the Decision Rule conflicts.

  *Refining the Decision Rule Cases (Q6, Q7):*
  *   *Case A (E-admissibility vs Maximin):* Option X is best under P1, worst under P2. Option Y is mediocre under both. Maximin picks Y. E-admissibility permits X.
  *   *Case B (Interval Dominance vs E-admissibility):* Option Z is worse than X under P1, better under P2, but the *intervals* of expected utility don't overlap in a way that dominates? No, Interval Dominance says choose A if min(A) > max(B). E-admissibility says choose A if there exists P where EU(A) >= EU(B).
      *   Let's create a menu where one option is "safe" (narrow interval, low floor) and one is "risky" (wide interval, high ceiling, low floor).
      *   Maximin picks Safe. E-admissibility permits Risky.
      *   Interval Dominance might permit both if intervals overlap.
      *   I need to make sure the text describes the *properties* of the options, not the rules.

  *Refining Leaves:*
  *   The prompt asks for "Imprecise probabilists split by decision rule".
  *   It also asks for "Hierarchical Bayesian".
  *   It asks for "Eliminativist".
  *   It asks for "Orthodox Sharp".
  *   It asks for "Buchak-style".

  *Checking Unoccupied:*
  *   "Sharp Credences + Ambiguity Aversion without Risk-Weighting": Incoherent (if you have sharp credences and linear utility, you must bet according to them).
  *   "Imprecise Credences + Mandatory Sharp Betting": Incoherent (why have imprecise credences?).

  *Checking Separation:*
  *   Maximin vs Maxmin EU.
  *   E-admissibility vs Levi's Security.

  Let's build the JSON.

  *Node Structure:*
  Root -> Q1 (Ellsberg).
  Yes (Prefer Known) -> Q2 (Repeated).
    Yes (Still Prefer Known) -> Q4 (Second Order).
      Yes (Reduce to Sharp) -> Sharp/Hierarchical.
      No (Keep Imprecise) -> Imprecise.
    No (Switch to Unknown) -> Sharp/RWEU.
  No (Indifferent) -> Sharp/RWEU/Eliminativist.

  Actually, the prompt asks for `branching_logic` to be an array of objects representing the forks. I will model the logical flow there.

  *Question Details:*
  Q1: Ellsberg (Small Stakes).
  Q2: Repeated Ellsberg.
  Q3: Dilation.
  Q4: Bid-Ask.
  Q5: Second-Order.
  Q6: Rule Conflict 1 (Maximin vs E-Admissibility).
  Q7: Rule Conflict 2 (Interval Dominance vs E-Admissibility).
  Q8: Updating/Reflection.
  Q9: Nature of Probability (Frequency vs Belief).
  Q10: Action under Total Ignorance.

  Wait, I need to make sure the "Eliminativist" path is clear. Maybe Q9 or Q10 handles the "Do you even have credences?" aspect.
  Let's put the "Do you have credences?" check early or as a foundational commitment.
  Actually, the prompt says "eliminativist leaf for readers who deny there are credences to be sharp in the first place."
  I should add a question that allows opting out of the credence framework.
  Let's adjust Q9 to be about the existence of internal states.

  Okay, let's finalize the JSON structure.
  Fields: `branching_logic`, `questions`, `scoring_key`, `unoccupied`, `separation_failures`.

  *Diagnosis of Unoccupied:*
  Signature: Sharp Credences + Ambiguity Aversion + Linear Utility.
  Diagnosis: Incoherent (Dutch Bookable).

  *Separation Failures:*
  Pair: Maximin vs Maxmin EU.
  Why: Both select the option with the highest minimum expected utility in static one-off cases.
  Wedge: Dynamic choice sequences where Maxmin EU requires updating the set of priors differently than pure Maximin.

  Pair: E-Admissibility vs Levi's Security.
  Why: Both permit the same set of admissible options in standard cases.
  Wedge: Cases involving "E-admissibility + Security" where a secondary lexicographic rule breaks ties between admissible options.

