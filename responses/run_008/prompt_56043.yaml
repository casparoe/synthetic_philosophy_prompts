answer: |-
  **Research Proposal: The Logical Structure of the Disintegration Thesis**

  **Research Question**
  Is the "disintegration thesis" underlying legal moralism best understood as a claim of continuous decay or a claim of threshold collapse, and does either formulation remain defensible when tested against historical instances of drastic moral change?

  **Background and Significance**
  The standard pedagogical treatment of the Hart–Devlin debate characterizes the conflict as a clash between liberal neutrality and conservative moralism. Devlin's central empirical premise is that a society's shared morality functions as an invisible fabric; tolerating deviations erodes this fabric, eventually threatening the existence of the society itself. The standard liberal reply, articulated by Hart, rejects this premise as empirically unfounded and logically dangerous. Hart argues that Devlin fails to distinguish between positive morality (what people actually believe) and critical morality (what people ought to believe). Consequently, Hart contends that the mere fact of majority disapproval cannot demonstrate that tolerating conduct destroys anything of value. He further argues that if Devlin's logic held, it would license the suppression of harmless eccentricities, as any deviation technically counts as erosion under a continuous decay model.

  However, both interlocutors leave the logical structure of the "fabric" claim under-theorized. Devlin oscillates between suggesting that every increment of deviance causes proportional damage and suggesting that society survives until a critical tipping point is reached. Hart largely assumes the former to generate his slippery slope objection. This proposal argues that this ambiguity is not merely rhetorical but substantive. If the claim is one of continuous decay, Hart's objection holds. If, however, the claim is one of threshold collapse, legal moralism might avoid the charge of suppressing harmless eccentricity, provided the threshold is high enough. My working hypothesis is that while the threshold reading is the only version capable of supporting legal moralism without absurdity, it renders the disintegration thesis non-falsifiable. Historical cases of radical moral shift—such as the abandonment of enforced religious observance or the repeal of Prohibition—appear empirically as social adaptation rather than disintegration. Distinguishing between a society that has collapsed and a society that has merely changed its moral constitution may be conceptually impossible.

  **Methodology**
  The research will be conducted over the course of the semester using library-based resources, without primary archival or empirical sociological work. The project will proceed in three phases.

  *Months One and Two: Conceptual Taxonomy.*
  The first phase will focus on textual reconstruction and conceptual analysis. I will construct a taxonomy of "fabric-claims" to categorize the possible logical forms of Devlin's premise. This taxonomy will distinguish between: (1) *Constitutive Claims*, where shared morality is partly what defines the population as a specific society; (2) *Instrumental Claims*, where morality serves a functional role in maintaining order but is replaceable; and (3) *Threshold Claims*, where stability is maintained until a specific density of deviance is reached. I will map Devlin's various formulations onto this taxonomy to determine which reading he requires for his normative conclusion to follow. Simultaneously, I will analyze Hart's responses to determine if his distinction between positive and critical morality successfully undermines the constitutive claim, or if it only addresses the instrumental claim.

  *Months Three and Four: Historical Testing.*
  The second phase will apply this taxonomy to secondary historical literature regarding three specific instances of moral legal change: the decriminalization of homosexual conduct (the context of the original debate), the repeal of alcohol Prohibition, and the secularization of Sunday observance laws. I will not conduct new empirical research but will analyze existing philosophical and historical accounts of these transitions. The goal is to determine if these events are better described as "disintegration" (supporting the threshold claim) or "adaptation" (supporting the liberal view). I will look for evidence of social collapse correlated with moral liberalization to test the falsifiability of the threshold model.

  *Month Five: Synthesis and Drafting.*
  The final phase will integrate the conceptual taxonomy with the historical analysis to answer the research question. I will draft the 6000-word paper, ensuring the argument moves from the logical reconstruction of the debate to the empirical implications of the threshold hypothesis.

  **Success and Failure Conditions**
  A successful outcome will demonstrate that the threshold version of the disintegration thesis is the only coherent foundation for legal moralism, but that it fails to be testable because "social disintegration" is indistinguishable from "moral evolution" in historical record. This would show that the Hart–Devlin debate turns on a metaphysical ambiguity rather than a resolvable empirical dispute.

  A specific failure mode I aim to avoid is the collapse of the "fabric" claim into standard consequentialism regarding offense and externalities. If the taxonomy reveals that Devlin's claims about social fabric are merely disguised claims about psychological offense or indirect harm to third parties, the project would cease to be a novel examination of legal moralism and would instead become a restatement of the harm principle debate. If the analysis shows that "social cohesion" adds no explanatory power beyond "aggregate individual welfare," the project will have failed to identify a distinct philosophical problem.

  **Feasibility and Fallback**
  Completing a conceptual taxonomy and a historical analysis within 6000 words is ambitious. The primary risk is that the historical case studies will consume too much word count, leaving insufficient space for the philosophical reconstruction. If it becomes clear during the second month that the historical testing is unmanageable within the word limit, I will enact a fallback strategy. I will abandon the historical case studies and focus exclusively on the conceptual taxonomy. The paper would then argue that the threshold claim is *in principle* untestable regardless of historical evidence, relying on the logical indistinguishability of "change" and "collapse" in social ontology. This ensures the core philosophical contribution remains intact even if the empirical illustration is truncated.
