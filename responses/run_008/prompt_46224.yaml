answer: |-
  # Research Proposal: Institutionalizing Confirmation
  **Preregistration as a Dissolution of the Problem of Old Evidence**

  ## 1. The Research Question

  The Problem of Old Evidence (PoOE) presents a formal embarrassment for Bayesian confirmation theory. If evidence $E$ is already known (probability 1), conditionalizing on it cannot raise the probability of a hypothesis $H$. Yet, historically, known evidence (like the anomalous perihelion of Mercury) confirms new theories (like General Relativity). Standard philosophical repairs invoke counterfactual credences: asking what an agent *would have* believed had they not known $E$. These repairs are widely regarded as technically cumbersome and metaphysically fuzzy, relying on ill-defined models of "forgetting."

  Conversely, the modern forecasting community operates on a strict norm: credibility is earned only on probabilistic commitments fixed *before* the evidence is observed. Preregistration renders the counterfactual unnecessary by replacing it with a historical record.

  This paper will answer the following determinate question:

  **Does the institutional norm of preregistration dissolve the Problem of Old Evidence by replacing underdetermined psychological counterfactuals with determinate historical commitments, thereby shifting the locus of confirmation from individual belief states to public verification structures?**

  This is not a survey question. It demands a binary evaluation: either the forecasting norm provides a functional equivalent that resolves the philosophical tension (dissolution), or it merely sidesteps the epistemic issue without solving it (dodge).

  ## 2. Background and The Collision

  ### 2.1 The Philosophical Stalemate
  In standard Bayesian epistemology, confirmation is defined by the ratio $P(H|E) / P(H)$. When $E$ is "old," $P(E) = 1$, and the ratio collapses to 1. No confirmation occurs. This contradicts scientific practice, where Einstein's explanation of Mercury's perihelion is cited as a primary confirmation of General Relativity (GR), despite the data being decades old.

  Philosophers (notably Garber, Jeffrey, and others) have attempted to fix this by relaxing the assumption of logical omniscience. They suggest we should evaluate $P(H | E \text{ is entailed by } H)$, or model the agent's credence in a state where $E$ is unknown. The consensus is that these moves are "uncomfortable." They require constructing a fictional epistemic history—a "state of ignorance" that never existed and is difficult to model consistently. Different models of forgetting yield different confirmation values. The machinery works, but it feels ad hoc.

  ### 2.2 The Forecasting Norm
  In parallel, the forecasting community (e.g., Good Judgment Project, Metaculus, prediction markets) has institutionalized a different norm. A forecast only "counts" if the probability was locked before the outcome was resolved. This is not merely a rule for scoring; it is a norm for *epistemic credit*. A forecaster who explains why an event happened after the fact gains no credibility, even if their explanation is causally perfect.

  This norm effectively declares that old evidence *is not evidence* for the purpose of scoring. However, unlike the philosophers who view this as a pragmatic limitation, the forecasting community treats it as the *definition* of skill. The collision arises when we ask: Is the forecasting community merely avoiding the philosophical problem, or have they inadvertently solved it by changing the ontology of confirmation?

  ## 3. Critique of Existing Positions

  To justify this project, I must show that current solutions leave the question open.

  **The Counterfactual-Credence Repair:** This approach attempts to save the subjective Bayesian framework. It insists that confirmation is a mental state update. The problem is that "what I would have believed" is not a fact of the matter. It is a model-dependent construct. If two philosophers model the "ignorant state" differently, they get different confirmation values for the same historical event. This leaves confirmation underdetermined.

  **The Simple Refusal (Old Evidence = No Evidence):** Some subjectivists bite the bullet and say Mercury did not confirm GR; only the 1919 eclipse did. This preserves the math but violates strong scientific intuitions. It renders the historical narrative of science incoherent. It fails to explain why we feel *justified* in accepting GR based on Mercury, even if we technically shouldn't.

  **The Gap:** Both positions assume confirmation must be a function of *individual psychology* (either actual or counterfactual). Neither considers that confirmation might be a function of *institutional record*. The forecasting norm suggests that confirmation is not about what you *would have* thought, but what you *did* commit to. Existing literature has not rigorously analyzed whether this shift from psychology to institution constitutes a philosophical solution or a category error.

  ## 4. Proposed Thesis: The Commitment Device

  My central hypothesis is that the preregistration norm acts as a **commitment device** that operationalizes the counterfactual.

  1.  **The Problem is Underdetermination:** The PoOE is difficult because the counterfactual "What would I have believed?" is metaphysically fuzzy. There is no fact of the matter about a state of mind that did not exist.
  2.  **The Solution is Historical Determinacy:** Preregistration creates a fact of the matter. "What did I commit to?" is a historical question with a binary answer (Yes/No/Specific Probability).
  3.  **Dissolution:** By adopting the norm, we stop asking the fuzzy question and start asking the sharp one. This does not "solve" the math of Bayesian updating in a vacuum; it dissolves the problem by showing that the relevant metric for scientific progress is not *belief update* but *risk exposure*.

  If this thesis holds, the PoOE is not a bug in Bayesianism but a bug in our expectation that Bayesianism should model *retrospective justification* using *prospective tools*. The forecasting norm corrects this by aligning the tool (scoring rules) with the goal (tracking truth-tracking behavior).

  ## 5. Methodology: Semester Plan

  I will execute this research over a standard 14-week semester, divided into four phases.

  ### Month 1: Reconstruction and Formalization
  *   **Weeks 1-2:** Deep review of the PoOE literature. I will reconstruct the Garber-style solution formally to pinpoint exactly where the "forgetting" model becomes arbitrary. I will map the specific axioms that break when $P(E)=1$.
  *   **Weeks 3-4:** Analysis of forecasting epistemology. I will review the literature on proper scoring rules (Brier, Log) and the specific rules of major forecasting platforms regarding "late" predictions. I will formalize the "Preregistration Norm" not as a rule of thumb, but as a constraint on the likelihood function.
  *   **Deliverable:** A 1000-word memo defining the "Commitment Device" formalism, contrasting the counterfactual credence $P_{counter}(E)$ with the registered commitment $C_{pre}(E)$.

  ### Month 2: Argument Development
  *   **Weeks 5-6:** Drafting the core argument. I will argue that $C_{pre}(E)$ performs the same epistemic function as $P_{counter}(E)$ but without the metaphysical baggage. I will explore the analogy to contract law: a contract is valid not because of what parties *would have* agreed to, but what they *did* sign.
  *   **Weeks 7-8:** Integrating the "Dissolution" claim. I will refine the distinction between a "workaround" (ignoring the problem) and a "dissolution" (showing the problem arises from a category mistake). I will argue that PoOE assumes confirmation is private/psychological, while forecasting shows it is public/verifiable.
  *   **Deliverable:** A complete outline of the 6000-word paper with section-by-section argument summaries.

  ### Month 3: Case Studies and Stress Testing
  *   **Weeks 9-10:** The Mercury Case. I will apply the framework to General Relativity.
      *   *Scenario A:* If we treat GR as a "forecast" registered before 1850 (impossible), it fails.
      *   *Scenario B:* If we treat the *mathematical structure* of GR as the commitment, does it entail the perihelion shift necessarily?
      *   *Scenario C:* I will argue that Mercury was *not* confirmation in the strict forecasting sense, and that our intuition otherwise is a conflation with the 1919 eclipse (novel evidence). I will test if this "hard line" is defensible.
  *   **Weeks 11-12:** Counter-arguments. I will steelman the objection that this reduces science to a game of scoring points, ignoring explanatory power. I will draft responses focusing on how explanatory power generates *future* registered predictions.
  *   **Deliverable:** Draft of the "Case Studies" and "Objections" sections (approx. 2000 words).

  ### Month 4: Synthesis and Risk Analysis
  *   **Weeks 13-14:** Final assembly and revision. I will ensure the tone balances the rationalist/forecasting perspective with rigorous philosophy of science standards. I will explicitly include the Risk Assessment (see below) as a section of the paper or a concluding reflection.
  *   **Deliverable:** Final 6000-word paper.

  ## 6. Expected Results

  ### 6.1 Success Conditions
  The project succeeds if I can demonstrate that:
  1.  The counterfactual credence required by standard Bayesian repairs is functionally equivalent to a preregistered commitment, but strictly less robust.
  2.  Adopting the "Commitment Device" view resolves the arbitrariness of the "forgetting" models.
  3.  We can reclassify historical cases (like Mercury) without losing explanatory power.

  **Classification of the Mercury Case:**
  If the dissolution succeeds, the Mercury case must be classified as **non-confirmatory evidence** in the strict sense. The paper will argue that GR gained confirmation from Mercury only insofar as the theory *could have been* formulated earlier and tested. However, the *actual* epistemic credit came from the *novel* predictions (light bending, gravitational redshift) that acted as the "registered questions." The paper will argue that our intuition that Mercury confirmed GR is a post-hoc narrative convenience, not a reflection of the actual confirmation logic. This is a strong, falsifiable claim. If I can defend this counter-intuitive result without sounding absurd, the thesis holds.

  ### 6.2 Failure Conditions
  The project fails if:
  1.  The "Commitment Device" is shown to be merely a sociological label for the same mathematical operation as the counterfactual repair, offering no new resolving power.
  2.  The reclassification of Mercury renders the history of science incoherent (e.g., if we must discard too many accepted confirmations).
  3.  I cannot distinguish between "preregistration" and "logical entailment" in cases where no human registration occurred (e.g., evolutionary biology retrodictions).

  ## 7. Risk Assessment

  This section addresses the specific vulnerabilities of the proposal, particularly the concern that this is merely a restatement of existing ideas in sociological vocabulary.

  ### 7.1 The "Sociological Restatement" Risk
  **The Worry:** The standard counterfactual repair asks, "What would you have believed?" My proposal asks, "What did you commit to?" Critics may argue this is just changing the subject from *epistemology* (justification of belief) to *sociology* (rules of a community). If Bayesianism is about how a rational agent *should* update, why does it matter what they wrote down?
  **Mitigation:** I will argue that for scientific knowledge, the "rational agent" is not the individual scientist but the *institution*. Science is a multi-agent system. Individual psychology is noisy and unfalsifiable; institutional record is sharp and falsifiable. Therefore, shifting the locus to the institution is not a change of subject, but a correction of the unit of analysis. If I cannot make this move convincingly, the paper collapses into a commentary on scientific norms rather than a solution to PoOE.

  ### 7.2 The "Change of Subject" Risk
  **The Worry:** Philosophers might claim I am solving the "Problem of Scientific Credit," not the "Problem of Old Evidence." The PoOE is about whether $H$ is *true* or *probable*, not whether Einstein gets *credit*.
  **Mitigation:** I will argue that in a fallibilist framework, "probability" *is* a measure of creditable commitment. There is no access to "Truth" outside of the tracking mechanisms we build. If the tracking mechanism (preregistration) says old evidence doesn't count, then asserting it *does* count is a metaphysical claim without operational content. I must bridge the gap between "credibility" and "confirmation."

  ### 7.3 The Mercury "Hard Line" Risk
  **The Worry:** Claiming Mercury did not confirm GR is a hard sell. It might alienate readers who view the Mercury fit as a paradigmatic example of abductive reasoning.
  **Mitigation:** I will nuance the claim. I will argue that Mercury provided *accommodation*, not *confirmation*. Accommodation has value (it shows consistency), but it does not reduce uncertainty about the theory's future predictive power in the way confirmation does. Distinguishing "consistency with old data" from "confirmation by old data" allows me to keep the intuition that Mercury was important without violating the Bayesian constraint.

  ### 7.4 Feasibility Risk
  **The Worry:** 6000 words is tight for this scope. I might get bogged down in the formal Bayesian math and lose the philosophical argument.
  **Mitigation:** I will keep the formal math in an appendix or simplified in the text. The core argument is conceptual (Institution vs. Psychology). I will prioritize the argument over the algebra.

  ## 8. Conclusion

  The collision between forecasting norms and Bayesian philosophy offers a rare opportunity to test epistemic theories against a live, functioning community of practice. Forecasters have effectively "solved" the Problem of Old Evidence by refusing to play the game on those terms. This paper will investigate whether that refusal is a philosophical insight or a pragmatic evasion.

  By framing preregistration as a commitment device that determinates the counterfactual, I aim to show that the Problem of Old Evidence was never a problem about probability, but a problem about *verifiability*. If successful, this paper will not only contribute to the philosophy of science but also provide a robust epistemic defense of the preregistration norms currently transforming social science and forecasting. The result will be a clearer understanding of why we value prediction over accommodation, grounded not in tradition, but in the logic of commitment.

  ---

  ## Detailed Argument Structure (for the 6000-word paper)

  *To ensure the proposal is actionable, I include here the intended structure of the final paper.*

  **1. Introduction (750 words)**
  *   Hook: The tension between Einstein's Mercury success and the Bayesian $P(E)=1$ problem.
  *   Context: The rise of forecasting norms (preregistration) as a competing epistemic standard.
  *   Thesis: Preregistration dissolves PoOE by operationalizing counterfactuals.

  **2. The Problem of Old Evidence (1000 words)**
  *   Formal statement of the Bayesian difficulty.
  *   Review of standard repairs (Garber, etc.) and their reliance on "logical forgetting."
  *   Critique: The underdetermination of the counterfactual state.

  **3. The Forecasting Norm (1000 words)**
  *   Description of the "Registered Question" norm.
  *   Why it exists (preventing overfitting/hindsight bias).
  *   Epistemic implication: It treats "commitment" as the primary unit of evidence.

  **4. The Commitment Device Thesis (1500 words)**
  *   Core Argument: Counterfactuals are fuzzy; commitments are sharp.
  *   Analogy: Contract law (performance vs. intent).
  *   Shifting the locus: From individual belief to institutional record.
  *   Why this counts as dissolution: It shows the original problem assumed the wrong ontology.

  **5. Case Study: Mercury and General Relativity (1000 words)**
  *   Application of the thesis.
  *   Argument: Mercury was accommodation, not confirmation.
  *   Real confirmation came from novel predictions (1919).
  *   Addressing the intuition pump: Why we *feel* Mercury confirmed GR (unification value vs. probabilistic update).

  **6. Objections and Risks (500 words)**
  *   "Is this just sociology?" (Addressed in Risk Assessment).
  *   "What about fields without preregistration?" (Evolutionary biology, cosmology).
  *   Response: Logical entailment acts as a proxy for registration in mature theories.

  **7. Conclusion (250 words)**
  *   Summary of the dissolution.
  *   Implications for scientific practice (push for more preregistration).
  *   Final thought: Epistemology as an institutional design problem.

