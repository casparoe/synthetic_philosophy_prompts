              *   Posterior: $P(H | D_1) = P(H_1) / (P(H_1) + P(T_1)) = (1/2) / (1/2 + 1/4) = (1/2) / (3/4) = 2/3$.
              *   *Student Answer:* Correctly calculates 2/3.
      *   **Part (c):** Is 2/3 a cost?
          *   *Standard Debate:* This is the "Double Halfer" or "Lewisian Halfer" position. The result $P(H|D_1) = 2/3$ is often cited as a major objection (the "Extreme Halfer" problem or similar). It implies Beauty learns about the coin toss from learning the day, even though the day and coin are causally independent *ex ante*.
