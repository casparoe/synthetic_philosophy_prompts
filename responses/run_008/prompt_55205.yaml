      *   **Specific Needs:** Scoring, debrief, handling sensitive constraints (family money, health), ensuring one role has a valid defense (distinction between reason and camouflage), predicting failures, acknowledging limitations (can't hand a teenager anguish), avoiding teacher oversharing.
