      *   *Refining the "Valid Defense":* Sartre says bad faith is lying to oneself. If a role says "I can't leave because I am in prison," that's facticity. If they say "I can't leave because I'm a father," that's bad faith (you can choose to abandon the role, though there are consequences). The lesson needs to show the difference between external barriers and internal identification with a role. Let's make one role have a concrete physical barrier vs. the others having social/psychological barriers.

