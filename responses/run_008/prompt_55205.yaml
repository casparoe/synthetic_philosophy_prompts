  5.  **Drafting Content (Iterative refinement for flow and constraints):**

      *   *Opening:* Validate the teacher's experience. It's a powerful hook.
      *   *Activity Design:* Call it "The Tribunal of Freedom." Set the stage.
      *   *Roles:* Need specific scripts. The "Valid Defense" role needs to be someone facing actual facticity (e.g., physical limitation) vs. bad faith (e.g., social expectation).
