answer: |-
  ### Exam Question

  **The eliminative materialist defends their view by comparing folk psychology to abandoned theories like phlogiston. Critics object that asserting this comparison presupposes the existence of beliefs, thereby refuting elimination. Can the eliminativist consistently maintain both the phlogiston analogy and the claim that beliefs do not exist? Or does saving the analogy require revising elimination into something like Dennett's instrumentalism? Argue for a definite position on what must be sacrificed to make the view coherent.**

  ***

  ### Model Answer

  The tension between the self-refutation objection and the phlogiston analogy is not merely a stalemate; it reveals a fatal instability in strict eliminative materialism. To resolve it, we must acknowledge that the eliminativist cannot consistently wield the phlogiston analogy without conceding the core of the self-refutation objection. Consequently, to make the view coherent, one must sacrifice "elimination" in favor of "revisionism."

  The self-refutation objection claims that asserting eliminative materialism is a performative contradiction. If I say, "Beliefs do not exist," I am expressing a belief. If the theory is true, I have not expressed a belief; I have merely emitted neural noise. For the assertion to have truth value, the category it denies must exist. The eliminativist's standard reply invokes the phlogiston analogy: chemists denied phlogiston without self-refutation, so why can't we deny beliefs?

  However, this reply cuts both ways, as the prompt suggests. The analogy only works if the eliminativist stands in the same relation to "belief" as the chemist stood to "phlogiston." But the chemist possessed beliefs about phlogiston. The chemist believed phlogiston was false. If the eliminativist is correct, they do *not* possess beliefs about belief. They possess neural states. Therefore, the eliminativist cannot claim to be in the same epistemic position as the chemist without presupposing the existence of the very states (beliefs) they seek to eliminate. To use the analogy is to assume folk psychology is true enough to describe the eliminativist's own argumentative stance.

  If the eliminativist insists strictly that beliefs do not exist, they cannot claim their theory is "true" or "rationally justified," since those are folk-psychological notions. They must admit their theory is merely a causal output of their brain that will cause other brains to react. This renders the theory politically potent but philosophically silent. It cannot argue for itself without borrowing from the enemy.

  The only way to save the argument is to adopt a stance like Dennett's. Dennett argues that beliefs are not internal neural sentences but "real patterns" discernible from the intentional stance. On this view, belief-talk is not false; it is abstract but indispensable. If we take this line, the self-refutation objection loses its grip because the eliminativist *does* have beliefs, just not the ones folk psychology imagines (e.g., not discrete neural states).

  However, this comes at a steep cost. It transforms eliminative materialism into revisionary materialism. We are no longer saying beliefs don't exist; we are saying beliefs are not what you thought they were. This saves the coherence of the argument but abandons the elimination.

  Therefore, a coherent position requires a choice. You cannot have the rhetorical force of the phlogiston analogy (which requires you to have beliefs to make the comparison) and the ontological austerity of strict elimination (which says you have no beliefs). If you keep the analogy, you must admit belief-talk picks out something real (patterns), making you a revisionist. If you keep strict elimination, you must admit you cannot argue for it without self-undermining. The better philosophical bargain is to accept revisionism. We keep the utility of belief-talk while updating its ontology, rather than silencing ourselves in the name of a purity that forbids us from speaking.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Grade Bands:**

  *   **0–5 (Fail/Weak):** The answer simply restates the seesaw (e.g., "Churchlands say no beliefs, critics say yes beliefs") without analyzing the tension. It treats the phlogiston analogy as a straightforward victory for eliminativism or dismisses the self-refutation objection as silly without argument.
  *   **6–12 (Pass/Decent):** The answer identifies that the eliminativist needs beliefs to make their argument. It explains the phlogiston analogy correctly. However, it fails to explicitly state what must be *sacrificed* (elimination vs. coherence) or treats Dennett's view as just another option rather than the necessary cost of saving the analogy.
  *   **13–20 (Excellent):** The answer takes a definite stance on the incompatibility of the two moves. It identifies that using the analogy presupposes the existence of the states being denied. It clearly articulates the trade-off: strict elimination leads to silence/self-undermining, while coherence requires revisionism (Dennett).

  **Specific Criteria for Marking:**

  1.  **The Performative Point (5 Marks):**
      *   *Full marks:* Explicitly notes that the act of *arguing* for eliminativism relies on the existence of beliefs (the performative contradiction).
      *   *Lose marks:* Treats the self-refutation objection as merely "you believe it, so it exists" without analyzing the status of the *utterance* itself.

  2.  **The Analogy Trap (5 Marks):**
      *   *Full marks:* Identifies that the phlogiston analogy fails *unless* the eliminativist claims to have beliefs about phlogiston, which contradicts their theory.
      *   *Lose marks:* Accepts the phlogiston analogy at face value without noting it assumes the eliminativist is a believer.

  3.  **The Cost/Trade-off (5 Marks):**
      *   *Full marks:* Clearly states that saving coherence requires shifting from elimination to revisionism (Dennett's line) and acknowledges this changes the theory.
      *   *Lose marks:* Suggests both can be held comfortably together without cost.

  4.  **Definite Position (5 Marks):**
      *   *Full marks:* Commits to a conclusion (e.g., "Strict EM is self-silencing" or "Revisionism is the only coherent path").
      *   *Lose marks:* Hedges endlessly ("Some say this, some say that") without planting feet.

  **The "Top Answer" Differentiator:**
  The specific move that separates a top answer from a merely decent one is recognizing that the **phlogiston analogy is self-undermining for the strict eliminativist**. A decent answer says "The critic says X, the eliminativist says Y." A top answer says "The eliminativist cannot use Y to support X without assuming X is false."

  **The Specific Deduction:**
  Lose 3 marks immediately if the answer claims "Neuroscience will replace folk psychology" as a sufficient reply to the self-refutation objection. This is the "surface level" response the prompt warns against; it ignores the logical pressure on the *assertion* of the theory itself.
