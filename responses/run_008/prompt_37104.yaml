answer: |-
  This is a classic historiographical and ethical dispute, and your intuition is correct: your friend is using a poetic slogan to do philosophical heavy lifting it cannot support. Hartley's line is beautiful, but in an argument about moral judgment, it is a chameleon. It shifts color depending on how much work you need it to do.

  Here is the menu of what that sentence can claim, followed by a diagnosis of your friend's argument, and finally, a definite verdict you can take to your next book club.

  ### Part 1: The Menu of Interpretations

  Hartley's line ("The past is a foreign country: they do things differently there") can be parsed into three distinct claims, ranging from trivial to radical.

  **1. The Anthropological Claim (Trivially True)**
  *   **The Claim:** The past differs from the present in facts, technologies, laws, and customs.
  *   **Implication:** We must not make factual errors. We shouldn't be surprised that they didn't have smartphones or democratic voting.
  *   **Status:** **True.** But this doesn't stop moral judgment. We can judge a foreign country's human rights record today; knowing they are "different" doesn't silence criticism.

  **2. The Hermeneutic Claim (Methodologically Sound)**
  *   **The Claim:** To understand *why* actors did what they did, we must reconstruct their worldview, not just project ours.
  *   **Implication:** Before calling the mill owner "cruel," we must understand what "child," "work," and "duty" meant to him. This prevents caricature.
  *   **Status:** **True.** This is standard historical practice. However, *understanding* an action is not the same as *exonerating* it. We can understand why a murderer killed (revenge, passion) without ceasing to call it murder.

  **3. The Moral Relativist Claim (Radically False)**
  *   **The Claim:** Moral truths are time-bound. Because their norms were different, our moral vocabulary (cruel, controlling, unjust) literally does not apply. To judge them is a category error.
  *   **Implication:** There is no trans-historical standard of human welfare. The biographer is committing "presentism" by applying 21st-century ethics to 19th-century actors.
  *   **Status:** **False.** This claims incommensurability where there is continuity. It assumes moral progress is an illusion and that suffering or domination are only "real" if the people experiencing them have the vocabulary to name them.

  ### Part 2: Diagnosing Your Friend's Argument

  Your friend is sliding between Claim 2 and Claim 3. She uses the respectability of Claim 2 (context matters!) to smuggle in the immunity of Claim 3 (judgment is forbidden!).

  Here is how that slogan functions in her two specific cases:

  **Case A: The Child Labor Charge**
  *   **Her Reading:** She is leaning on **Claim 3 (Moral Relativism).** She is arguing that "cruelty" is a modern label. In the "foreign country" of the 19th century, 12-hour days were standard economic participation, not abuse.
  *   **The Flaw:** This treats physical suffering and developmental harm as cultural constructs. They are not. A 10-year-old's exhaustion, stunted growth, and lack of play are biological realities, not social conventions.
  *   **Verdict:** **This reading fails.** Even in the 19th century, there were contemporaries who argued this was cruel. The "foreign country" wasn't a monolith; it had dissenters. To say we cannot judge it is to say moral progress is impossible. If we can't judge child labor then, we can't judge it now, because "now" is just "then" for a future generation.

  **Case B: The Treatment of His Wife**
  *   **Her Reading:** She is leaning on **Claim 3 (Moral Relativism)** regarding social roles. She argues that "controlling" is a modern feminist concept. In his "country," a husband's authority was legal and moral fact (coverture). He was following the script.
  *   **The Flaw:** This conflates *legal structure* with *interpersonal ethics*. Even within patriarchal structures, there was a spectrum of kindness, respect, and partnership versus domination and contempt.
  *   **Verdict:** **This reading fails.** While the *legal* constraints were different, the *ethical* quality of the relationship is evaluable. Describing a man as "controlling" is not anachronistic; it describes a power dynamic that existed then, even if it was legally sanctioned. Sanctioned oppression is still oppression.

  ### Part 3: The Definite Verdict

  You asked for a position, not a shrug. Here is the position you should take into the next argument.

  **1. The "Foreign Country" metaphor is morally dangerous.**
  It implies we are tourists. We are not. We are the descendants of that country. The structures built then (labor laws, gender roles) built the house we live in now. We have standing to judge the foundation because we are living in the building.

  **2. Description *always* smuggles in standards.**
  Your intuition was right. Your friend says the book should have "just described the guy." This is impossible.
  *   If the biographer writes: *"He made the children work 12 hours,"* that sounds neutral.
  *   If the biographer writes: *"He utilized the available juvenile labor force for standard shifts,"* that sounds apologetic.
  *   If the biographer writes: *"He subjected children to grueling 12-hour shifts,"* that sounds critical.
  Every adjective and verb choice implies a standard of normalcy or deviance. To refuse to call it "cruel" is itself a moral judgment that the children's suffering was acceptable. **Neutrality in the face of harm is a stance.**

  **3. The "Presentism" Trap.**
  Your friend accuses the biographer of "presentism." But the opposite error is "Pastism"—the idea that we must suspend our moral faculties when looking backward.
  *   **True Historical Understanding:** Acknowledges that the mill owner likely didn't *feel* cruel (Claim 2).
  *   **True Moral Judgment:** Acknowledges that he *was* cruel regardless of his feelings (Rejecting Claim 3).
  We can hold both. We can say, "He was a product of his time, *and* what he did was wrong." In fact, saying "he was a product of his time" is only meaningful if we have a standard *outside* of that time to measure him against.

  ### Your Closing Argument

  When you meet next, do not let her hide behind Hartley. Say this:

  > "Hartley's line works for fashion or technology, but it fails for ethics. If the past is a foreign country, it's one where people still bled, still tired, and still wanted autonomy.
  >
  > On the child labor: Suffering isn't relative. If we can't call 12-hour days for children 'cruel' in 1850, we lose the language to call it cruel today.
  >
  > On the wife: Legal authority isn't moral license. A king can be a tyrant even if kingship is legal.
  >
  > You say we should just 'describe' him. But choosing what to describe and how to phrase it is already judging. The biographer isn't a tourist; she's an investigator. And if we refuse to judge the past, we aren't being respectful—we're being complicit."

  **Summary Verdict:** Your friend is relying on the **Moral Relativist** reading of Hartley. It is **false**. Understanding context (Hermeneutics) is required for accuracy, but it does not grant moral immunity. The biographer was right to judge.
