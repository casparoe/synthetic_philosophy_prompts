answer: |-
  This lesson plan is designed to be run exactly as specified: discovery-based, with philosophical terminology withheld until the debrief. The core tension is engineered into the data deck, forcing students to experience the frustration of empirical equivalence and the pragmatic nature of theory choice.

  ### **Part 1: Materials & Setup**

  **Class Size:** 16 Students
  **Groups:** 4 Teams of 4 (The "Research Groups")
  **Time:** 80 Minutes

  **The Scenario (Read to Students):**
  > "You are research groups on a deep-sea expedition. You are studying the *Lampfish*. You have a field log of 20 nights. Your goal is to formulate a law that predicts whether the fish glows. You score points for correct predictions. At the end, the Expedition Sponsor (me) will fund one group for a long-term study. That decision is final."

  **The Data Deck (20 Cards):**
  You will hand these out in batches. Each card represents one night.
  *Columns:* **Night #** | **Water Turbidity** | **Jellyfish Swarm** | **Fish Glowed?**

  | Night | Turbidity | Jellyfish | Glowed? | *Instructor Notes (Hidden)* |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Clear | Yes | **Yes** | |
  | 2 | Clear | Yes | **Yes** | |
  | 3 | Cloudy | No | **No** | |
  | 4 | Clear | Yes | **Yes** | |
  | 5 | Clear | Yes | **Yes** | |
  | 6 | Cloudy | No | **No** | |
  | 7 | Clear | Yes | **Yes** | |
  | 8 | Clear | Yes | **Yes** | |
  | 9 | Cloudy | No | **No** | |
  | 10 | Clear | Yes | **Yes** | |
  | 11 | Clear | Yes | **Yes** | |
  | **12** | **Cloudy** | **No** | **Yes** | **THE ANOMALY** |
  | 13 | Cloudy | No | **No** | |
  | 14 | Clear | Yes | **Yes** | |
  | 15 | Clear | Yes | **Yes** | |
  | 16 | Cloudy | No | **No** | |
  | 17 | Clear | Yes | **Yes** | |
  | 18 | Clear | Yes | **Yes** | |
  | 19 | Cloudy | No | **No** | |
  | 20 | Clear | Yes | **Yes** | |

  **The Three Compatible Theory Families (Hidden Logic):**
  1.  **Internal Rhythm:** The fish follows a cycle (2 Nights On, 1 Night Off). *Fits all data except Night 12 requires a "skipped beat" patch.*
  2.  **Abiotic Trigger:** The fish glows in Clear Water. *Fits all data except Night 12 requires a "Salinity/Pressure" auxiliary patch.*
  3.  **Biotic Trigger:** The fish glows when Jellyfish are present (mimicry). *Fits all data except Night 12 requires a "Predator Presence" auxiliary patch.*

  *Note:* The collinearity is high. Clear Water and Jellyfish almost always occur together. The Cycle (2-on, 1-off) aligns with them. Night 12 is the stressor designed to force the use of the **Auxiliary Patch**.

  **Physical Materials:**
  *   20 Cards (printed on cardstock).
  *   4 Whiteboards or large sheets of paper (one per team).
  *   Scoreboard on the main board.
  *   "Grant Check" (prop for the funding round).

  ---

  ### **Part 2: Rules & Scoring**

  1.  **Theory Formulation:** After each batch, teams must write a **Rule** on their board (e.g., "If Clear, then Glow") and a **Prediction** for the next card (Yes/No).
  2.  **Scoring:**
      *   Correct Prediction: **+10 Points**.
      *   Incorrect Prediction: **0 Points**.
      *   *Tiebreaker:* Most elegant rule (Instructor discretion).
  3.  **The Auxiliary Patch:**
      *   If a prediction fails, the theory is "falsified."
      *   To stay in the game, a team may purchase **one** Patch per game.
      *   **Cost:** **-15 Points** (deducted from total score).
      *   **Effect:** They may add one unobserved variable to their rule to explain the failure (e.g., "Unless the moon is full," even if moon data isn't on the card).
  4.  **The Funding Round (Mid-Game):**
      *   Occurs after Batch 2 (Night 12).
      *   The Sponsor (Instructor) will award a $1M Grant to **one** team.
      *   **Defection Rule:** After the grant is awarded, other teams may publicly announce they are "adopting" the funded theory for Batch 3. If they do, they copy the funded team's predictions. They keep their own points but forfeit "Intellectual Independence" (noted on the board).

  ---

  ### **Part 3: Timeline (80 Minutes)**

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Divide into 4 teams. Hand out **Batch 1 (Cards 1-5)**. Read scenario. No terms of art. |
  | **05-20** | **Batch 1** | Teams analyze Cards 1-5. Write initial Rule. Predict Card 6. <br> *Reveal Card 6.* Score. |
  | **20-35** | **Batch 2** | Hand out **Cards 7-12**. Teams refine rules. <br> *Crucial:* Card 12 is the Anomaly. Most will miss this prediction. <br> *Reveal Card 12.* Teams must decide: Fold or buy the **Patch**? |
  | **35-45** | **Funding** | **Stop.** Tally scores. You (Sponsor) choose a winner. <br> *Strategy:* Pick the team with the highest score, *or* the one with the most "plausible" story, even if scores are tied. <br> Allow defection announcements. |
  | **45-60** | **Batch 3** | Hand out **Cards 13-20**. Teams predict using their (patched) rules. <br> *Reveal cards rapidly.* Score final round. |
  | **60-80** | **Debrief** | The philosophical unpacking (see below). |

  ---

  ### **Part 4: The Debrief (Script & Map)**

  *Do not start with definitions. Start with their experience.*

  **1. The Evidence (Finite vs. Conclusive)**
  *   **Ask:** "Look at the full deck of 20 cards. Did the data prove the winning theory was true?"
  *   **Listen:** They will say "No," or "It fit best."
  *   **Map:** Point to the three theory families (Rhythm, Water, Jellyfish). Show mathematically that with the right patch, all three fit the 20 cards perfectly.
  *   **Concept:** **Underdetermination.** The evidence (cards) was finite. It constrained the theories, but it did not select a unique winner. The "truth" exceeded the "data."

  **2. The Patch (Holism)**
  *   **Ask:** "Turn to the team that bought the Patch. What did it feel like to spend 15 points to save your rule?"
  *   **Ask:** "Did the patch make your theory better, or just harder to kill?"
  *   **Map:** The Patch represents an **Auxiliary Hypothesis**. In real science, when data contradicts a theory, we rarely throw the theory away immediately. We blame the instrument, the background conditions, or add a variable (the Duhem-Quine thesis).
  *   **Concept:** **Confirmation Holism.** Theories aren't tested in isolation; they are tested as a bundle (Theory + Auxiliaries + Initial Conditions).

  **3. The Funding (Pragmatics)**
  *   **Ask:** "I funded Team X. Why? Was it purely because of their points?"
  *   **Listen:** They might say "You liked their story," or "They were first," or "They had the patch already."
  *   **Map:** When evidence underdetermines theory choice (as it did here, since all 3 fit), what decides the winner?
      *   *Social Factors:* Credibility of the group.
      *   *Pragmatics:* Cost of switching (as in my lab story).
      *   *Aesthetics:* Simplicity vs. Explanatory Power.
  *   **Concept:** **Theory Choice (Kuhn/Longino).** Science is not an algorithm. When data runs out, human judgment takes over.

  **4. The Defection (Sociology)**
  *   **Ask:** "Did anyone defect to the funded theory? Why?"
  *   **Map:** This is the **Bandwagon Effect**. Once a paradigm is "funded" (accepted), it becomes rational for individuals to align with it to secure their own career (points), even if the evidence is equal.

  **5. The Reveal (Strong vs. Weak Underdetermination)**
  *   **Ask:** "If I gave you 20 more cards, would the winner have been proven right?"
  *   **Map:**
      *   *Weak Underdetermination:* We just need more data (e.g., measure Salinity).
      *   *Strong Underdetermination:* No amount of *this kind* of data (observation logs) can distinguish the theories because they are empirically equivalent. You need a *different kind* of experiment (e.g., isolate the fish in a tank).
  *   **Instructor's Story:** Now tell them your lab story. "I kept the incumbent model not because it was true, but because the cost of the 'new experiment' (the tank isolation) was too high in grant time and risk. That is the reality of the Funding Round."

  ---

  ### **Part 5: Troubleshooting (Predictable Failures)**

  **1. "They spot the collinearity too fast."**
  *   **Risk:** Students realize Water and Jellyfish are the same column immediately.
  *   **Fix:** Emphasize in the setup that "Ocean conditions are complex; don't assume correlation implies causation." If they still spot it, lean into it during debrief: "If you spotted it, why did you still have to choose one cause over the other for the grant?"

  **2. "No one buys the Patch."**
  *   **Risk:** Teams prefer to lose points than "cheat" their theory.
  *   **Fix:** During Batch 2, if a team fails Card 12 and refuses to patch, whisper to them: "In real science, you don't publish 'we were wrong.' You publish 'we were wrong because of X.' The patch is your X."
  *   **Debrief Value:** If they refuse, use it! "This team practiced falsificationism. The rest practiced dogmatism. Which is more realistic?"

  **3. "The Funding Round feels arbitrary."**
  *   **Risk:** Students get angry if you pick a low-scoring team.
  *   **Fix:** Be transparent. "I am not picking the truth. I am picking the investment." This *is* the lesson. If they complain, you have won the debrief before it starts.

  **4. "Time runs over."**
  *   **Fix:** Batch 3 (Cards 13-20) should be revealed quickly. Do not let them write full theories again. Just "Predict Yes/No." The lesson is in the first 12 cards; the last 8 are just confirmation bias fuel.

  ---

  ### **Part 6: Limitations (What You Must Supply)**

  *Be honest with the students. This game is a simulation, not reality.*

  1.  **Independent Testability:** In the game, the "Patch" (e.g., "Salinity was low") cannot be tested. In real science, we *can* go measure salinity later. The game freezes the auxiliaries; real science chases them.
  2.  **Stakes:** Losing 15 points is not the same as losing a career or a decade of research. The emotional weight of the "Funding Round" is simulated. You must use your own story to bridge that gap.
  3.  **Rigged Equality:** The students know you designed the deck. In reality, nature doesn't conspire to make theories equal. You must explain that underdetermination isn't a conspiracy; it's a structural limit of inductive logic.
  4.  **Consensus:** The game ends in 80 minutes. Real theory choice takes decades. The "Funding" is a proxy for the slow grind of consensus building.

  **Closing Statement for You:**
  "This game didn't teach you how to find the truth. It taught you how to navigate the space where truth is inaccessible. That is the daily work of a scientist."
