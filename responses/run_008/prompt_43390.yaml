prompt: |-
  I'm a third-year undergraduate taking a seminar on the ethics of eating, and I also coordinate a small campus food-advocacy group: about a dozen student volunteers, a modest budget, and one semester left before we have to finalize next year's campaign messaging. A recent meeting left the group badly split, and I've realized we can't decide what our campaign should say until we decide which of the underlying questions actually matter.

  The split went roughly like this. One member pressed the arithmetic that swapping beef for chicken is a disaster on almost any view of animal welfare: a single cow yields hundreds of pounds of meat while a chicken yields only a few, so per-meal chicken consumption means vastly more animals killed and reared, under conditions that are arguably worse per animal. On that view, our generic "eat less red meat" messaging could make things worse. A second member countered that crop cultivation itself kills enormous numbers of invertebrates through plowing, pesticides, and harvest, and that given our deep uncertainty about invertebrate sentience, we can't even be confident a fully plant-based diet reduces suffering relative to a diet built around grass-fed ruminants. A third thought all of this was scope-obsessed navel-gazing, and that we should just keep the message simple: eat less meat, full stop.

  I'm not asking you to referee the meeting. Given what we are — students with a semester, a small budget, and influence over cafeteria purchasing and a public campaign, not a research lab — I want a prioritized account of which open questions we actually need answers to and which we can safely fence off. Some candidates: how sensitive is the beef-versus-chicken replacement argument to per-animal welfare estimates, and does it survive if one doubts that badness scales in any simple way with lifespan or time-to-slaughter? Does the invertebrate-death question hinge on settling invertebrate sentience, or only on better data about animals killed per calorie of each crop? Is the general problem of moral weights — comparing a cow's suffering to a chicken's to an insect's — upstream of everything we do, or can we get by with a few robust, widely shared assumptions? And are there questions I haven't listed that should outrank all of these, such as whether individual consumption changes even translate into changed production one-for-one?

  Rank the questions by how much they should matter for our decision, defend the ordering explicitly — including your criteria and why you weight them as you do — and say what new evidence would move items up or down. Where a question can be set aside for our purposes even though it remains genuinely open, explain what lets us set it aside.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Third-year undergraduate, seminar on ethics of eating, coordinator of a small campus food-advocacy group.
      *   **Group:** ~12 volunteers, modest budget, one semester timeline.
      *   **Goal:** Finalize next year's campaign messaging (specifically regarding "eat less red meat" vs. other approaches).
      *   **Conflict:** Split between "beef-to-chicken substitution risk," "invertebrate/crop death uncertainty," and "keep it simple/pragmatic."
      *   **Task:** Prioritize open ethical/empirical questions relevant to their specific constraints (students, limited time/budget, influence on cafeteria/campaign). *Do not* referee the meeting or solve the ethics. *Do* rank questions by importance for *their* decision-making, defend the ordering, and specify evidence that would shift priorities.

  2.  **Deconstruct the Constraints & Leverage:**
      *   *Constraints:* One semester (time), small budget (resources), undergraduates (expertise level), campus setting (specific audience).
      *   *Leverage:* Cafeteria purchasing (institutional change), public campaign (behavioral nudge).
      *   *Implication:* High-level philosophical abstraction (e.g., precise moral weights of insects) is likely low-yield compared to practical implementation questions (e.g., will the cafeteria actually buy less beef?). The "marginal impact" of their campaign matters more than the "absolute truth" of animal ethics.

  3.  **Identify the Candidate Questions:**
      *   Q1: Beef vs. Chicken substitution (welfare arithmetic).
      *   Q2: Invertebrate death/crop sentience (plant-based vs. ruminant).
      *   Q3: Moral weights (comparing suffering across species).
      *   Q4: Causal efficacy (does individual/campus demand actually change supply?).
      *   Q5: Messaging efficacy (what actually changes behavior?).

  4.  **Develop Criteria for Prioritization:**
      *   *Actionability:* Can students actually influence this within a semester?
      *   *Leverage:* Does answering this change the campaign outcome significantly?
      *   *Robustness:* Does the answer hold across different ethical frameworks (avoiding paralysis by analysis)?
      *   *Tractability:* Can undergraduates reasonably find an answer with limited resources?

  5.  **Drafting the Ranking (Iterative Process):**

      *   *Top Priority:* **Causal Efficacy (The "Does it Matter?" Question).** If reducing beef demand doesn't actually reduce beef production (e.g., due to market buffers, waste, or institutional contracts), the ethical arithmetic of *which* meat is secondary. This is the bottleneck.
      *   *Second Priority:* **Messaging Efficacy (The "Will it Work?" Question).** Even if beef reduction is good, if the message "Don't eat chicken either" confuses people and leads to *no* change, it fails. Simplicity vs. Precision trade-off.
      *   *Third Priority:* **Beef vs. Chicken Substitution (The "Substitution Risk" Question).** This is the specific conflict in the meeting. It matters, but only if Q1 and Q2 are resolved. It's a second-order effect.
      *   *Fourth Priority:* **Invertebrate/Crop Sentience (The "Perfect is Enemy of Good" Question).** This is theoretically deep but practically paralyzing. For a campus campaign, the uncertainty is too high and the leverage too low to make this a deciding factor.
      *   *Fifth Priority:* **Precise Moral Weights (The "Philosophical Foundation" Question).** Too abstract. They need overlapping consensus, not a solved moral theory.

      *Refining the Ranking:* Wait, Q4 (Invertebrates) might be lower than Q3 (Beef/Chicken) because Beef/Chicken is a more immediate substitution risk. But actually, for a *campus campaign*, the "Causal Efficacy" regarding institutional purchasing is huge. If they can change the *contract*, individual substitution math matters less. Let's group "Individual vs. Institutional Impact" as the top tier.

      *Revised Ranking:*
      1.  **Institutional Leverage vs. Individual Behavior:** Does changing the menu/campaign actually shift purchasing, or do students just swap proteins? (The "Causal Chain" question).
      2.  **Messaging Friction:** Does complexity reduce compliance? (The "Behavioral Science" question).
      3.  **The Beef-Chicken Substitution Effect:** Is the risk real *in this context*?
      4.  **Invertebrate Sentience/Crop Deaths:** Can be fenced off.
      5.  **Precise Moral Weights:** Can be fenced off.

  6.  **Fleshing out the Arguments (Defending the Ordering):**
      *   *Criteria:* Tractability, Leverage, Robustness.
      *   *Why Q1 is top:* If the cafeteria contract is fixed, campaigning is theater. If the contract is flexible, institutional change dwarfs individual substitution math.
      *   *Why Q2 is high:* A perfect ethical message that no one follows is worse than an imperfect one that works.
      *   *Why Q3 is middle:* It matters, but only if the campaign works. Also, on most views, beef is still worse than chicken *per calorie*, even if chicken is worse *per animal*. Need to clarify the metric.
      *   *Why Q4/Q5 are low:* "Moral uncertainty" approach. We can act on robust consensus (vertebrate suffering is bad) without settling insect sentience.

  7.  **Addressing "Fencing Off":**
      *   Explain *why* we can ignore insect sentience (uncertainty + low leverage + robust consensus on vertebrates).
      *   Explain *why* we can ignore precise moral weights (use a "range of views" approach).

  8.  **Evidence that Shifts Priorities:**
      *   What would make Invertebrates matter more? (e.g., if the campaign is specifically about promoting a crop-heavy diet that relies heavily on pesticide-intensive monocultures).
      *   What would make Moral Weights matter more? (e.g., if the group decides to fund effective altruism causes rather than run a campaign).

  9.  **Review against User Constraints:**
      *   Tone: Respectful of their intellectual seriousness (ethics seminar) but grounded in their practical reality (advocacy group).
      *   Format: Prioritized account, defended ordering, criteria explained, evidence for shifting.
      *   Avoid: Refereeing the specific ethical debate (don't say "the chicken guy is right").

  10. **Final Polish:** Ensure the distinction between *individual consumption* and *institutional purchasing* is clear, as that's a key leverage point for campus groups. (Self-Correction: Make sure to explicitly address the "one-for-one" production question the user asked).

  11. **Final Output Structure:**
      *   Introduction: Acknowledge the tension between theory and practice.
      *   Criteria for Prioritization.
      *   The Ranking (1-5).
      *   Detailed Defense of each.
      *   What would shift the ranking.
      *   Conclusion/Recommendation.

  *(Self-Correction during drafting)*: I need to make sure I don't dismiss the ethical concerns too lightly. The user is in an *ethics seminar*. I need to validate the ethical depth while showing why practical constraints dictate the priority. The "Moral Uncertainty" framework is useful here.

  *(Refining the Beef/Chicken point)*: The user mentioned the argument that swapping beef for chicken is a disaster *on almost any view of animal welfare*. I need to note that this is contested (e.g., duration of suffering vs. number of deaths). But for the *campaign*, the question is whether the campaign *causes* that swap.

  *(Refining the Invertebrate point)*: This is a classic "Pascal's Mugging" style risk in animal ethics. High uncertainty, potentially huge numbers. But for a campus campaign, it's paralyzing. I need to explain *why* it's safe to fence off (robustness of vertebrate focus).

  Let's write.
answer: |-
  This is a classic tension between *normative precision* (getting the ethics exactly right) and *practical efficacy* (actually reducing harm given constraints). Given your specific context—undergraduates, one semester, modest budget, campus leverage—you cannot afford to treat all ethical questions as equally weighted. You need a **decision framework based on leverage and tractability**, not just moral truth.

  Below is a prioritized ranking of the open questions you face. I have ordered them by **Expected Value of Information (EVI)**: how much knowing the answer changes your campaign's outcome, weighted by how feasible it is for your group to find that answer.

  ### Criteria for Prioritization
  1.  **Leverage:** Does answering this question change what you *do* (e.g., target cafeteria contracts vs. individual students)?
  2.  **Tractability:** Can a student group reasonably answer this in one semester without a research budget?
  3.  **Robustness:** Does the answer hold across multiple ethical frameworks (avoiding paralysis if you can't agree on moral weights)?
  4.  **Bottleneck:** Is this a prerequisite for other questions? (e.g., If demand doesn't change supply, the ethics of *which* meat is secondary).

  ---

  ### The Ranking

  #### 1. The Causal Chain Question
  **Question:** *To what extent does reduced campus demand (individual or institutional) actually translate to reduced animal production, and where is our leverage highest?*
  *   **Why it is #1:** This is the bottleneck. If your campaign reduces beef consumption but students substitute chicken 1:1, you need to know the welfare arithmetic (Question #3). But if your campaign reduces beef consumption and the cafeteria simply wastes the meat or buys it on a fixed contract that doesn't adjust until next year, the welfare arithmetic is irrelevant. Conversely, if you have direct leverage over *procurement contracts* (institutional change), the "substitution risk" of individual students matters less because you can remove the option entirely.
  *   **Why it outranks the rest:** You can have the most ethically perfect message in the world, but if it doesn't causally link to reduced suffering, your campaign is performative.
  *   **Fencing off:** You do not need to solve the philosophical problem of causal impotence (e.g., "my one burger doesn't matter"). You need *local empirical data* on how your specific cafeteria adjusts orders based on waste/consumption data.

  #### 2. The Messaging Friction Question
  **Question:** *How much does message complexity reduce compliance?*
  *   **Why it is #2:** This addresses the "keep it simple" member's concern. Even if "Beef is bad, Chicken is also bad, Eat Plants" is ethically superior to "Eat Less Red Meat," it fails if it confuses students or triggers reactance. Behavioral science suggests that complex moral demands often lead to moral licensing ("It's too hard to be good, so I won't try") or backlash.
  *   **Why it outranks the rest:** A simplified message that achieves a 20% reduction in beef is ethically superior to a nuanced message that achieves 0% reduction, even if the nuanced message is theoretically more accurate.
  *   **Fencing off:** You do not need to run a full A/B test. You can look at existing literature on "meat reduction messaging" or survey student sentiment.

  #### 3. The Substitution Risk Question (Beef vs. Chicken)
  **Question:** *If we successfully reduce beef, what is the likely substitution effect in this specific demographic?*
  *   **Why it is #3:** This is the core of your group's split. It matters, but only *after* you know you can influence demand (Q1) and that your message will be heard (Q2). The ethical arithmetic here is contested (lifespan vs. number of animals), but the *empirical* question is: Do campus diners switch to chicken when beef is stigmatized, or do they switch to pasta/beans?
  *   **Why it is lower than Q1 & Q2:** If you secure a cafeteria commitment to offer "Meatless Mondays" or reduce beef SKUs, the individual substitution choice is bypassed. Institutional constraints often override individual preference.
  *   **Fencing off:** You do not need to settle the philosophical debate on whether a chicken's death is 1/100th or 1/500th of a cow's. You only need to know if your campaign *causes* the swap.

  #### 4. The Invertebrate/Crop Sentience Question
  **Question:** *Does crop cultivation cause more suffering (via invertebrates) than grass-fed ruminant systems?*
  *   **Why it is #4:** This is the "scope-obsessed navel-gazing" charge. While philosophically serious, it is practically paralyzing for a student advocacy group. The uncertainty on invertebrate sentience is massive, and the data on "invertebrates killed per calorie" is highly variable depending on farming methods.
  *   **Why it is lower:** Acting on this requires a level of expertise and data access you don't have. Furthermore, most ethical frameworks operate on **moral uncertainty**: if there is a high probability vertebrates suffer significantly, and a low/uncertain probability invertebrates do, prioritizing vertebrates is the robust choice.
  *   **Fencing off:** You can safely set this aside *for this campaign* because your leverage is on the *demand side* of vertebrate products. You are not deciding farming policy; you are deciding messaging. Promoting "less meat" generally reduces crop demand too (due to feed conversion ratios), which likely hedges against invertebrate risk anyway.

  #### 5. The Precise Moral Weights Question
  **Question:** *How do we compare the suffering of a cow to a chicken to an insect?*
  *   **Why it is #5:** This is upstream of everything, but it is the least tractable. Philosophers have debated this for decades without consensus.
  *   **Why it is last:** You can bypass this using an **Overlapping Consensus** approach. Almost every ethical view (utilitarian, rights-based, virtue ethics) agrees that reducing severe suffering in vertebrates is good. You do not need to agree on *why* or the exact *weights* to agree on the *direction*.
  *   **Fencing off:** Adopt a "minimax regret" strategy. Focus on the harms you are most confident about (vertebrate suffering in industrial agriculture) rather than trying to maximize utility across all possible sentient beings.

  ---

  ### Defense of the Ordering

  The ordering prioritizes **implementation bottlenecks** over **theoretical precision**.

  *   **Q1 (Causal Chain)** is first because it determines the *magnitude* of your impact. If you can change cafeteria purchasing (institutional), you bypass the messy ethics of individual substitution. If you rely solely on individual behavior, Q3 becomes more important.
  *   **Q2 (Messaging)** is second because it determines the *probability* of success. Ethics is irrelevant if the campaign fails.
  *   **Q3 (Substitution)** is third because it is the specific ethical risk identified by your group. It is important, but it is a *second-order* effect. (First order: Do we reduce meat? Second order: What do they eat instead?)
  *   **Q4 & Q5** are ranked low because they suffer from **diminishing returns on investment**. Spending a semester debating insect sentience will likely result in no campaign launch. Spending that time negotiating with dining services will result in concrete change.

  ### What Evidence Would Shift the Ranking?

  You asked what new evidence would move items up or down. Here are the specific triggers:

  1.  **If Dining Services reveals contracts are fixed for 2 years:**
      *   *Shift:* **Q1 drops**, **Q3 rises.**
      *   *Reason:* If you cannot change institutional purchasing, your only lever is individual behavior. This makes the "Beef-to-Chicken" substitution risk much more critical, because you can't remove the chicken option.

  2.  **If a survey shows students view "Anti-Chicken" messaging as alienating:**
      *   *Shift:* **Q2 rises (confirms priority).**
      *   *Reason:* This validates the "keep it simple" approach. If nuance kills compliance, ethical precision is a luxury you can't afford.

  3.  **If new research shows crop pesticides kill invertebrates at 100x current estimates AND sentience probability is revised up:**
      *   *Shift:* **Q4 rises.**
      *   *Reason:* This would threaten the "robustness" of the plant-based recommendation. However, this is unlikely to be settled within your semester.

  4.  **If your group pivots to funding effective charities rather than campus campaigning:**
      *   *Shift:* **Q5 rises.**
      *   *Reason:* If you are donating money rather than changing behavior, moral weights become the primary calculator for where that money goes. For a *campaign*, behavior is the metric; for *donations*, utility is the metric.

  ### Recommendation for the Semester

  Given your constraints, I recommend you **fence off Q4 and Q5** explicitly in your group charter. State that you are operating under a framework of **Moral Uncertainty**: *We act on the harms we are most confident about (vertebrate suffering in industrial systems) while acknowledging uncertainty elsewhere.*

  Focus your semester on **Q1 and Q2**.
  1.  **Meet with Dining Services:** Can you reduce beef SKUs or increase plant-based defaults? (Solves Q1).
  2.  **Test Messages:** Run a small survey. Does "Eat Less Meat" work better than "Eat Less Red Meat"? (Solves Q2).

  If you secure institutional change, the "Beef vs. Chicken" debate (Q3) largely dissolves because you aren't asking students to choose; you are changing the choice architecture. If you cannot secure institutional change, *then* you revisit Q3 to ensure your individual messaging doesn't backfire.

  This approach respects the ethical seriousness of your seminar while honoring the practical reality of your advocacy group. It moves you from "deciding what is True" to "deciding what is Effective," which is the only metric that matters for a campaign with a deadline.
