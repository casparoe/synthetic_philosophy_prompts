  **MERIDIAN INTERMODAL LOGISTICS**
  **INTERNAL POLICY ADDENDUM 9.4: ETHICAL ALIGNMENT PROTOCOL**
  **EFFECTIVE DATE:** Q3 Fiscal Year
  **DISTRIBUTION:** All Personnel

  **1.0 PREAMBLE**
  To align operational conduct with maximal ethical efficiency, Meridian Intermodal Logistics is formally adopting Act Consequentialism as its primary governance framework. All previous deontological constraints and satisficing metrics are hereby superseded. The following clauses outline the implementation of the Maximized Outcome Framework (MOF).

  **2.0 POLICY CLAUSES**

  **2.1 Personal Allocation Stipend (PAS)**
  Employees are granted a theoretical allowance of non-optimal time for personal use. However, PAS hours are subject to real-time utility audit. Should a verifiable opportunity arise wherein redeployment of PAS hours yields greater aggregate utility than personal leisure, the allowance is immediately revoked and reallocated. This ensures prerogatives remain stable only when mathematically permissible.

  **2.2 Integrity and Personal Projects**
  Meridian respects employee integrity and long-term personal projects. Protection is granted unless interference with said projects produces a net positive outcome exceeding the integrity loss. Employees must submit project plans for weekly cost-benefit analysis to determine continued viability.

  **2.3 Actionable Inactivity**
  The distinction between doing and allowing is discontinued. Inactivity is classified as a deliberate decision with causal consequences. Failure to intervene in observable inefficiencies, whether within scope or not, will be logged as active resource mismanagement and scored accordingly.

  **2.4 Wellness Benefit Aggregation**
  Local employee wellbeing is no longer weighed independently. Wellness budgets are calibrated against distant humanitarian needs. If funds allocated to office ergonomics produce less utility than direct aid to high-need regions, ergonomics budgets will be diverted. Employee discomfort is recognized as a cost, but not necessarily a veto.

  **2.5 Performance Ranking Elimination**
  The "Satisfactory" and "Good" performance tiers are discontinued. There is no passing grade. All employees are scored on a single continuous leaderboard based on marginal utility contribution. Rank is relative; being in the 90th percentile is insufficient if the 91st percentile demonstrates achievable higher output.

  **2.6 Deferred Ethical Recharge**
  Accrued "Moral Holiday" PTO vests only when global utility metrics reach peak saturation. As current data suggests global utility is sub-optimal, vesting conditions are currently unmet. Hours will carry over indefinitely until conditions obtain.

  **2.7 High-Capacity Resource Accommodation**
  Employees demonstrating utility output exceeding 300% of baseline may requisition disproportionate team resources. Morale impacts on supporting staff are considered secondary costs. Accommodations are mandatory provided the high-capacity employee's net output remains positive after resource deduction.

  **3.0 FREQUENTLY ASKED QUESTIONS**

  **Q: Can I clock out at 5:00 PM if my tasks are complete?**
  A: Only if no higher-value task exists globally. If your labor could generate more value elsewhere (e.g., volunteer coordination, additional logistics routing), staying home is classified as utility negation. Please consult the Live Opportunity Dashboard before departing.

  **Q: Why was my request for a mental health day denied?**
  A: The MOF calculation determined your current distress cost was lower than the projected utility loss of your absence. We encourage you to optimize your resilience to meet demand.

  **Q: Is there a cap on how much I am expected to give?**
  A: Caps imply arbitrary limits. Expectations are bound only by the diminishing marginal utility of your contribution. If you can do more, the framework dictates you should.

  **4.0 COMPLIANCE**
  This policy is subject to immediate revision should recalibration of utility metrics suggest a different framework yields better results. Management reserves the right to update clauses without notice if the numbers change.

  **Approved By:**
  *Department of Ethical Optimization*
