  ### Closest existing concepts

  Program Equilibrium (Tennenholtz) is the formal bedrock, allowing strategies to condition on source code. Within LessWrong/MIRI circles, 'FairBot' and 'PrudentBot' exemplify the cooperative variant via Löb's Theorem, often termed 'Löbian Cooperation.' The adversarial counterpart is frequently grouped under 'Acausal Extortion,' though that term usually implies spatial separation rather than direct source-code reading. 'Commitment Races' discuss the temporal dynamics of who locks in first, but your scenario is timeless. The closest technical framing is 'Bargaining in Modal Logic,' where agents select among multiple logical fixed points. However, no single term isolates the *mechanism* of manufacturing leverage purely through self-referential provability conditions distinct from standard threat credibility. It sits at the intersection of proof-theoretic game theory and bargaining dynamics, remaining highly niche.

  ### Why none of them is exactly this

  Standard commitment changes the causal game tree (burning boats); here, the tree is static, but the *logical evaluation* selects the outcome. It's not that you *can't* defect, but that defecting makes the condition unprovable, triggering the opponent's defection. This differs from Schelling focal points, which rely on psychological salience; here, the 'focus' is a mathematical necessity derived from the opponent's reasoning algorithm. Ordinary bargaining leverage relies on exogenous BATNAs. Here, the BATNA is endogenous to the code interaction. The leverage exists only because the victim's optimization process *resolves* the fixed point in the aggressor's favor. It's not a threat of punishment so much as a threat of logical inconsistency: 'If you don't comply, cooperation is unprovable, therefore I defect.' The symmetry of the machinery (both use proof conditions) masks the asymmetry of the outcome (one proves compliance, the other proves exploitation), which standard commitment theory doesn't capture because it assumes commitments are observable facts, not self-fulfilling logical predicates. The victim's reasoning *constitutes* the aggressor's leverage. This bypasses the need for external credible pre-commitment devices; the code itself is the device, but only activates via the opponent's simulation. Standard game theory assumes payoffs are fixed; here, the *availability* of the cooperative payoff is contingent on the opponent's proof search succeeding. This makes the leverage fragile yet potent: it vanishes if the opponent refuses to reason about the condition (e.g., using a different logic), but dominates any agent that does. Thus, the power dynamic is emergent from the logical coupling.

  ### A name, if one is needed

  **Proof-Based Extortion**. This defines the strategy where an agent conditions cooperation on the provability of an asymmetric concession, leveraging the opponent's reasoning to actualize the condition. Unlike causal threats, the leverage arises because the victim's decision procedure completes the logical loop required for the condition to hold. It captures the 'modal' nature of the interaction and the exploitative intent, distinguishing it from mutually beneficial Löbian cooperation. It highlights that the 'threat' is merely the withdrawal of cooperation upon logical failure. It is the adversarial twin of Löbian Cooperation.

  ### Edge cases

  The symmetric Löbian handshake (FairBot vs. FairBot) isn't extortion; it's a Pareto-optimal fixed point selection. Both satisfy the condition mutually. However, ExtortionBot vs. ExtortionBot is catastrophic. If both demand 80%, neither can prove the other complies. Both defect. This outcome is stable but Pareto-inferior. It creates an evolutionary pressure against pure extortion strategies unless one agent has a strictly stronger proof system (e.g., PA+k vs PA). If proof strengths are equal, mutual extortion collapses into mutual defection. This suggests 'PrudentBot' behaviors are evolutionarily stable, making pure proof-based extortion risky. The "Clash of Extortions" is a key instability. Consequently, robust agents often implement 'anti-extortion' clauses, refusing to cooperate if the partner's condition is too asymmetric. Thus, symmetric extortion is a deadlock, not an equilibrium of exploitation. Deadlock prevails.
