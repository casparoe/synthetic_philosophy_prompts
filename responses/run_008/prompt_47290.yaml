  This session gamifies the Best System Account, forcing students to construct lawbooks from raw data without assuming hidden generators. Through scored rounds involving ties and exceptions, they experience the instability of laws as mere summaries. The debrief contrasts their frustration with the Non-Humean intuition that laws should govern facts.

  # Rules and Materials
  **Dataset:** Hand out 10x10 grids of Black/White cells.
  **Vocabulary:** "Row $n$ is All B," "Column $n$ is All W," "If Row $n$ is B, Row $n+1$ is W."
  **Scoring:** Score = (Correct Predictions) − (Symbols Used). Exception Clauses cost 2 symbols.
  **Constraint Note:** I generate mosaics *without* a hidden generative rule. This prevents students from treating lawbooks as guesses at a "true" governor, forcing them to confront the Humean claim that nothing lies behind the mosaic.
  **Engineered Tie (Round 2):** Design a grid symmetric by both rows and columns (e.g., checkerboard). "All odd rows B" and "All odd cols B" yield identical scores.
  **Miracle Round (Round 3):** Use a clean pattern with one inverted cell. Teams choose between a simple law + exception clause or a complex law covering the exception.

  # Timeline
  **0-10:** Intro rules; emphasize no "true" rule exists.
  **10-30:** Round 1 (Clean Pattern). Teams maximize score.
  **30-50:** Round 2 (Tie). Reveal identical scores for distinct lawbooks.
  **50-70:** Round 3 (Miracles). Introduce the exception cell.
  **70-80:** Debrief.

  # Debrief Plan
  Ask Round 2 teams: "Which lawbook is correct?" When they hesitate, highlight Humean underdetermination. Ask Round 3 teams: "Did you tolerate a miracle to save simplicity?" Map this to Lewis's trade-off. Finally, ask: "Did the laws feel like they *made* the grid happen?" Use their 'no' to introduce the Non-Humean governing intuition they likely felt was missing.

  # Honesty Section 1: Predictable Failures
  Students will persistently ask, "But which one is *really* the law?" Refuse to answer; insist the mosaic is all there is. If a team games the score (e.g., listing every cell), penalize ad hoc clauses as "not laws." If the tie fails (scores differ), manually adjust the simplicity cost live to force equality, framing it as the "exchange rate" being part of the system, not nature.

  # Honesty Section 2: Unreproducible Features
  The game cannot reproduce modal force. Students systematize *actual* cells, but real laws support counterfactuals (e.g., "If this cell *were* different..."). You must verbally supply this: ask what would happen if they changed one cell *before* the game started. Similarly, the game lacks explanatory direction. Students build laws *from* facts; you must articulate the Non-Humean claim that facts obtain *because* of laws. The game shows the Humean cost; you must supply the Non-Humean benefit.
