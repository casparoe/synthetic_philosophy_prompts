  Any adequate theory of propositional unity must meet five desiderata.

  1.  **List vs. Proposition:** The theory must specify what the set {Socrates, Wisdom} lacks that the proposition possesses. A mere inventory lacks assertoric force or truth-conditions; it does not claim anything. Without this distinction, logic collapses into set theory. This is non-negotiable. (Confidence: High)
  2.  **Bradley's Regress:** If a relation relates relata, what connects the relation to them? The theory must choose: terminate at a primitive, run infinitely, or close circularly. Silence is failure. Adding connectors reproduces the problem. Each option carries a cost: primitivism accepts bruteness; infinitism accepts viciousness. This is non-negotiable. (Confidence: High)
  3.  **Falsehood:** The unity of 'Socrates is foolish' cannot depend on worldly existence, as the fact does not obtain. The account must unify false propositions equally without borrowing reality. Truth cannot constitute unity. This is non-negotiable. (Confidence: High)
  4.  **Direction:** The theory must distinguish $aRb$ from $bRa$. Structure must encode order, not just presence. Otherwise, predication is indistinguishable from its converse. The theory must explain asymmetry. This is non-negotiable. (Confidence: High)
  5.  **Productivity:** We understand novel sentences via constituents. The unity account cannot make this compositional ability mysterious. If unity is opaque, understanding is magic. The mechanism must be learnable. This is non-negotiable. (Confidence: Medium-High)

  **The Impossible Pair:** I suspect Desideratum 2 (terminating regress) and the implicit demand for "No unexplained primitives" cannot be jointly satisfied. To stop Bradley's regress, one must posit a primitive unity (a brute fact of combining). To avoid primitives, one accepts infinite regress. Both carry costs: obscurity or vicious infinity. I regard this tension as the real deliverable. You cannot have explanation without end or end without brute fact. (Confidence: High)

  **Least Sure Point:** I am least sure about Desideratum 5. It assumes propositional structure mirrors psychological understanding, which might be a category error conflating ontology with epistemology. (Confidence: Medium)

  The state-of-affairs view grounds unity in an exemplification tie. It handles direction but struggles with false propositions, as the tie suggests actual obtaining. The Tractarian picture configures objects into facts. It secures direction via logical form but fails unity for false propositions, since non-existent facts cannot configure objects. The primitive predicative operation view posits a brute combining act. It stops Bradley's regress by fiat, satisfying termination, but violates explanatory demands, leaving unity mysterious. All three sacrifice a desideratum: falsehood, unity, or depth. None satisfy the impossible pair simultaneously.
