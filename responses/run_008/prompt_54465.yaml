      *   Even Better: **Internal Consistency Check via Competitive Search.** The market isn't aggregating info about the world; it's aggregating *search strategies* about the map.
      *   Let's stick close to the User's intuition but refine it. It's a **Prediction Market where the resolution mechanism is computationally bounded.**

  10. **Final Review against Constraints:**
