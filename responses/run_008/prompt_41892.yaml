      *   *The Spoilsport:* Grice's worry is that if you make the intention too explicit, the communicative act collapses or changes. A referee saying "You're trying to make them think X" kills the implicature. How to gamify this? The Referee needs to be a player who wins by catching "hidden agendas."
      *   *Soak Time:* This is tricky in an 80-minute class. Real soak time happens over days/weeks. In-class soak time needs to be simulated via *commitment* or *repetition*. If I say it once, I can cancel it. If I say it three times and the other team acts on it, can I cancel it?
