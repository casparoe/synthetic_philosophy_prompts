      *Mechanic:* The Referee sees the Secret Fact. The Speaker speaks. If the Referee thinks the Speaker is *relying* on the Hearer recognizing the intention too overtly (violating the "Off the Record" nature), they veto.
      *Actually, Grice's worry in "Meaning" papers is about the complexity of intentions.* If I say "I intend you to believe P by recognizing my intention," does that collapse?
      *Let's simplify for the game:* The Referee represents the "Literalist Police." They veto if the gap between Sentence and Meaning is too small (Literal) OR if the gap is too transparent (Manipulative).
      *Better:* The Referee wins if they can accurately state the Speaker's Meaning *better* than the Hearer. If Referee says "You meant X" and Speaker admits it, Referee gets points. This forces Speaker to be subtle.

      *Let's go with "The Off-The-Record Protocol".*

      **Materials:**
