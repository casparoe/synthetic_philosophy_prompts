      *   *Phase 3: The Retraction (Cancellability).* Team A makes a move. Team B infers X. Team A tries to take it back ("...but I didn't mean X"). Team B/Judge scores the "damage."
      *   *Phase 4: The Hardening (Soak Time).* Simulate this by having the inference be acted upon before cancellation is attempted.

