answer: |-
  # Activity Plan: "The Off-The-Record Protocol"

  **Time:** 80 Minutes
  **Class Size:** 12 Students (3 Teams of 4)
  **Goal:** Distinguish Sentence Meaning from Speaker Meaning via production, cancellation, and "hardening" of inferences.
  **Constraint:** The word "implicature" is banned until the final 10-minute debrief.

  ## Materials Needed
  *   **3 Sets of "Mission Cards"** (See Appendix): Each card has a **Secret Fact** (what must be conveyed) and a **Public Context** (the scenario).
  *   **Veto Tokens:** 3 red poker chips or cards per team.
  *   **Commitment Chips:** 10 blue poker chips per team.
  *   **Whiteboard:** For scoring and the "Public Record."
  *   **Timer:** Visible to all.

  ## Setup (5 Minutes)
  1.  **Divide:** Split the class into 3 Teams (Alpha, Beta, Gamma) of 4 students.
  2.  **Roles:** Inside each team, assign roles: 1 **Speaker**, 2 **Hearers**, 1 **Referee** (The Spoilsport). *Note: Roles will rotate in Phase 2.*
  3.  **The Rule of Truth:** Explain the core constraint: **The Speaker's statement must be literally true.** If the statement is factually false, the team is immediately disqualified.
  4.  **The Objective:** The Speaker must get the Hearers to believe the **Secret Fact** on the Mission Card without writing/saying the Fact itself.

  ## Phase 1: The Transmission & The Spoilsport (25 Minutes)
  **Mechanic:** Producing meaning under the threat of exposure.

  1.  **Deal:** Give Team Alpha a Mission Card (e.g., Secret Fact: *The Dean is embezzling funds*. Context: *A faculty meeting*).
  2.  **Draft:** The Speaker has 2 minutes to write **one sentence** on a slip of paper.
  3.  **The Referee's Power (The Spoilsport):**
      *   Before the Hearers see the sentence, the Referee reads it.
      *   The Referee knows the Secret Fact.
      *   If the Referee believes the sentence is *too obvious*—i.e., the only reason to say it is to convey the Secret Fact—they play a **Veto Token**.
      *   **The Veto Line:** To play the token, the Referee must say: *"Veto. You are trying to get them to believe [Secret Fact], you are not saying [Secret Fact]."*
      *   **Scoring:**
          *   If Vetoed: Speaker gets 0 points. Referee gets 2 points. (The "Off-the-Record" attempt failed).
          *   If Not Vetoed: The sentence is passed to the Hearers.
  4.  **The Hearer's Guess:**
      *   Hearers read the sentence. They have 1 minute to write down what they think the Secret Fact is.
      *   **Scoring:**
          *   If Hearers guess the Fact correctly: Speaker gets 3 points.
          *   If Hearers guess wrong: Speaker gets 0 points.
  5.  **Rotate:** Switch roles within the team. Repeat until everyone has been Speaker once. Then swap Mission Cards between teams (Alpha's card goes to Beta, etc.) and repeat.

  ## Phase 2: The Walk-Back (Cancellation) (25 Minutes)
  **Mechanic:** Testing the bond between sentence and inference.

  1.  **Setup:** Keep the same teams. Use the sentences generated in Phase 1 (or generate new ones if Phase 1 failed).
  2.  **The Move:** Speaker reads their sentence aloud. Hearers state their inference out loud ("You mean the Dean is embezzling").
  3.  **The Cancellation:** The Speaker must now attempt to cancel the inference using the phrase: *"...but I don't mean to suggest that [Inference]."*
      *   *Example:* "The Dean's accounting has been very creative... but I don't mean to suggest he is embezzling."
  4.  **The Judgment (Scoring):**
      *   The **Opposing Team** (e.g., Beta judges Alpha) acts as the Jury. They must unanimously agree on one of three verdicts:
          *   **FINE (2 pts):** Sounds like a normal clarification.
          *   **WEIRD (1 pt):** Sounds awkward, like you're hiding something, but not a lie.
          *   **CONTRADICTION (0 pts):** Sounds logically impossible or like a blatant lie.
  5.  **Rotate:** Ensure every team judges and is judged.

  ## Phase 3: The Hardening (Soak Time Simulation) (15 Minutes)
  **Mechanic:** Simulating the cost of cancellation after belief has "set."

  1.  **Round A (Immediate):** Same as Phase 2. Speaker cancels immediately after Hearer infers. Score normally.
  2.  **Round B (Commitment):**
      *   Hearer hears sentence.
      *   Hearer places a **Commitment Chip** on the table (signifying "I am acting on this info").
      *   *Then* Speaker attempts to cancel.
      *   **Penalty:** If the Jury votes "FINE," the Speaker gets 1 point (instead of 2). If "WEIRD," 0 points. "CONTRADICTION" remains 0.
  3.  **Round C (Public Record):**
      *   Hearer hears sentence.
      *   Hearer places Chip **AND** writes the inference on the Whiteboard "Public Record."
      *   *Then* Speaker attempts to cancel.
      *   **Penalty:** Most cancellations here will feel like Contradictions. If a team manages a "FINE" here, they get 5 bonus points (highly unlikely).
  4.  **The Boundary Case (Last 5 mins of this phase):**
      *   Give every team a specific "Boundary Card."
      *   *Card Text:* "Some of the bombs have been defused." (Secret Fact: *All bombs are defused*).
      *   Run the Cancellation mechanic. "Some have been defused... but I don't mean to suggest not all were."
      *   Ask the room: *Is this FINE or CONTRADICTION?* (Expect split verdicts).

  ## Debrief (10 Minutes)
  **Constraint Lift:** You may now use the word "Implicature."

  1.  **Map the Mechanics:**
      *   **Sentence Meaning:** The literal text written on the slip (must be true).
      *   **Speaker Meaning:** The Secret Fact (what you wanted them to believe).
      *   **The Referee:** Represents the **Gricean Intention**. If the intention is too overt (Referee vetoes), the "off-the-record" nature collapses. This mirrors Grice's worry that if the hearer recognizes the intention *too* explicitly, the act changes.
      *   **Cancellation:** The test for **Conversational Implicature**. If you can cancel it without contradiction, it wasn't part of the literal meaning.
      *   **Soak Time (Commitment Chips):** This simulated **Contextual Hardening**. In real life, once someone acts on an inference, cancelling it feels like a lie, even if logically it's fine.
      *   **Boundary Case:** "Some" vs. "All." This is the **Scalar Implicature** boundary. In high stakes, it behaves like entailment (contradiction to cancel). In low stakes, it's cancellable.

  2.  **Honesty Check (The Limitation):**
      *   Tell them: "In this game, you guessed the meaning based on intuition and context. Grice claims you actually *calculate* this (Premise 1: He said P; Premise 2: Maxims... Conclusion: He meant Q). Did anyone actually run that calculation in their head during Phase 1?"
      *   (Most will say no).
      *   **Conclusion:** The game reproduces the *phenomenology* of implicature, but not necessarily the *psychological process* of calculability. We pattern-match faster than we reason.

  ---

  ## Predictable Failures & Fixes

  | What Goes Wrong | Trigger | Fix |
  | :--- | :--- | :--- |
  | **Referees Veto Everything** | Referees realize they get points for stopping the Speaker, so they veto any successful communication. | **Limit Tokens:** Give Referees only 2 Veto Tokens for the whole phase. If they waste them, they can't stop blatant cheating later. |
  | **Speakers Just Lie** | Speakers find it easier to say the Secret Fact falsely than to imply it. | **The Truth Rule:** Remind them immediately: "If your sentence is literally false, your team is disqualified." Enforce this strictly on the first infraction. |
  | **Cancellation Feels Like Lying** | Students feel that *any* cancellation is dishonest, scoring everything as "Contradiction." | **Reframe:** Tell the Jury: "You are judging *logical consistency*, not moral honesty. Does 'P but not Q' make sense, or is it nonsense?" |
  | **Soak Time Feels Fake** | Placing a chip doesn't feel like "time passing." | **Add Stakes:** In Phase 3, tell Hearers: "If you place the chip, you must bet 1 point of your team score on this being true." Real loss simulates commitment. |

  ---

  ## Appendix: Sample Mission Cards

  **Card 1 (The Recommendation)**
  *   **Context:** Writing a reference letter for a philosophy PhD applicant.
  *   **Secret Fact:** The applicant is terrible at philosophy.
  *   **Constraint:** You cannot say they are bad.

  **Card 2 (The Party)**
  *   **Context:** Texting a friend about a party tonight.
  *   **Secret Fact:** You do not want them to come.
  *   **Constraint:** You cannot say "Don't come."

  **Card 3 (The Boundary)**
  *   **Context:** Bomb Squad briefing.
  *   **Secret Fact:** All bombs are defused.
  *   **Sentence to Test:** "Some of the bombs are defused."

  ---

