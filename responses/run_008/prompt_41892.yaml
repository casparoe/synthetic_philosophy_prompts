      *Revised Concept: "The Truth & Nothing But"*
      *   **Teams:** 2 Teams (6 vs 6).
      *   **Roles:** Speaker, Hearer, Adjudicator (Spoilsport).
      *   **Round 1 (Implicature Generation):** Speaker gets a "State of Affairs" (SOA) they must convey (e.g., "The Dean is embezzling"). They cannot say the SOA directly. They must say something true that implies it. Hearer must guess the SOA.
      *   **Round 2 (The Spoilsport):** The Adjudicator watches. If the Speaker *says* the SOA, Adjudicator calls "Literal!" (Points to Adjudicator). If the Speaker is *too obvious* (violating the spirit of the game), Adjudicator calls "Transparent!" (This maps to the Gricean worry).
      *   **Round 3 (Cancellation/Soak):** Hearer states what they inferred. Speaker attempts to cancel ("...but not that").
      *   **Scoring:** Points for successful transmission, points for successful cancellation, points for catching contradictions.

