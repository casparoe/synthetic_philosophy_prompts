      *   *Concept:* Teams are diplomats trying to convey sensitive information without *saying* it directly, while an opposing team (or Referee) tries to pin them down on exactly what was said.
      *   *Phase 1: The Whisper Network (Producing Implicature).* Teams get a "Secret Goal" (e.g., Make Team B believe the Ambassador is corrupt). They must write notes/utterances that achieve this without stating it.
