      *   **Topic:** Kierkegaard's *Fear and Trembling*, specifically the "teleological suspension of the ethical," the distinction between the Knight of Infinite Resignition and the Knight of Faith, and the argument that this is a limit case, not a general license for immorality.
      *   **Audience:** 15 students, 2 teachers.
          *   General: Most haven't read Kierkegaard.
