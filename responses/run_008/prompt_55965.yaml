answer: |-
  The only sound in the observatory was the rhythmic *ch-whir* of the anemometer, followed by the slide of paper into the tray. Theo pulled the slip free, glancing at the tally column.

  " Ninety-nine percent," he said, tapping the paper. "Consistent with last hour. It's reliable."

  Mara didn't look up from her logbook. "According to whom?"

  "According to the instrument."

  "Exactly." Mara capped her pen. "That's the bootstrapping problem, Theo. You're using the anemometer's readings to confirm the anemometer's accuracy. If the machine were broken but programmed to print '99% accurate' on every slip, you'd still conclude it was reliable. You've manufactured justification out of thin air."

  Theo leaned against the console, crossing his arms. "But it *isn't* broken. That's the external fact that matters. If the process is actually reliable, why does it matter that I used the process to verify itself? You're demanding I step outside my own skin to check my eyesight. If I can't use my vision to check a mirror, and I can't use a mirror to check my vision, I'm blind. That's not rigor, Mara; it's skepticism."

  "It's not skepticism to distinguish between *having* a reliable belief and having a reason to think the source is reliable," Mara countered. "I can see the wind speed. That's using the source. But believing the source is trustworthy requires independent calibration. The policy here wipes out that distinction. Look at the swap-out rule: we keep any machine that self-reports above ninety-five percent. We're institutionalizing the cheat."

  "Is it a cheat if it works?" Theo pushed off the console. "Suppose you trust your memory. How do you justify that trust? You remember times your memory served you well. That's circular. But if memory is reliable, the circularity doesn't poison the well. It just reflects the structure of induction. We start somewhere. If the anemometer is reliable, the tally transmits warrant. The circle isn't vicious; it's just a loop."

  "But the loop hides the failure mode," Mara insisted. "Imagine we install a new unit. Policy says it's untrusted until it builds a history. So, for the first week, we take its readings to generate the tally, then use the tally to trust the readings. If the unit is garbled, the tally says 'perfect,' and we certify it. Your reliabilism says that as long as the unit *happens* to be right, I'm justified. But my justification shouldn't hinge on luck. If I can't tell the difference between the reliable machine and the broken one using this method, I don't *know* it's reliable."

  Theo sighed, looking out the dark window at the swaying trees. "You're conflating knowing it's reliable with being able to prove it to a skeptic. If the machine is reliable, your belief is formed by a truth-tracking process. That's what justification *is*. If you demand a non-circular calibration for every faculty, you never start. You want a view from nowhere. I'm happy with a view from inside the system, provided the system holds."

  "The system holds only if we assume what we're trying to prove," Mara said. "That's the 'easy knowledge' objection. It makes justification too easy. It allows me to raise myself by my epistemic bootstraps. You say the warrant transmits through the chain. I say the chain is missing a link. You're using the conclusion—that the readings are true—to support the premise—that the machine is accurate. That's not induction; that's begging the question."

  "Is it?" Theo turned back to her. "When you check the wind against the trees outside, you're using vision to verify vision's report on the trees. Is that cheating? Or is it just how coherent belief works? The policy isn't saying the machine vouches for itself in a vacuum. It's saying we track coherence over time. If the readings cohere with the tally, and the tally coheres with the readings, stability emerges. That's not magic; it's feedback."

  "It's feedback without an input check," Mara corrected. "A thermostat regulates temperature, but it doesn't certify its own accuracy. We do that with a separate thermometer. This policy forbids the separate thermometer. It says the anemometer's self-report *is* the certification. That's why the new unit rule is so telling. It forces us to treat the machine's output as evidence for its own reliability before we're allowed to treat it as evidence for the wind. We're building the foundation out of the roof."

  Theo picked up the slip again. "And yet, if I throw this out, I have no data. If I keep it, I have weather reports that match the storm outside. Practical success has to count for something. If I wait for independent verification that isn't just another instrument requiring verification, I freeze in the dark. Maybe 'easy knowledge' isn't a bug. Maybe it's the only kind we get."

  "Maybe it's the only kind we get," Mara conceded softly. "But that doesn't make it knowledge. It makes it pragmatic acceptance. The policy treats them as the same. It says if the tally hits ninety-five percent, you are epistemically justified in trusting the unit. I'm saying you're administratively compliant, but epistemically empty. You haven't gained evidence about the machine; you've just heard it talk about itself."

  "So we're stuck," Theo said. "You won't trust the machine without independent proof I can't give. I won't discard the machine because it works."

  "We're stuck on whether 'works' is enough for 'justified,'" Mara said.

  The anemometer whirred again. The paper slid out. Theo glanced at it. " Hundred percent," he said. "Perfect run."

  "According to itself," Mara said, though she reached for the logbook to record the data.

  "According to the only test we have," Theo replied, filing the slip.

  They worked in silence for a moment, the machine humming between them, reliable perhaps, but silent on why they should believe it.
