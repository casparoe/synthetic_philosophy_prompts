  1. Divide the fourteen students into four teams and provide whiteboards for them to calculate outputs for a sequence of input pairs you display. Carefully select initial cases where standard addition and your hidden rule yield identical results.
  2. Teams accumulate points for correct answers but must wager their entire score on a final "Master Case" of their own choosing, with the losing team required to lead the opening ten minutes of the next seminar without notes.
  3. After wagers are locked, reveal you were applying a private rule all along, such as "add the operands unless the first number is prime, then subtract the second," which fit every prior example but invalidates the Master Case they confidently selected.
  4. Connect their shock to the skeptical challenge by showing past success guarantees no future application, then pivot to the book's skeptical solution that meaning survives only through communal agreement rather than private certainty.
  5. Admit that students will protest you simply changed the rules mid-game, which reveals the limitation that the game cannot reproduce the absence of an external arbiter without your explicit verbal framing.
