  # SEMINAR HANDOUT: Mapping Omnipotence
  **Philosophy of Religion 300 | Unit: Divine Attributes**

  **Instructions:** Work through the questions below. Circle **YES** or **NO** at each node. Follow the arrows to find your position on the Omnipotence Paradox. Be prepared to defend your path in 15 minutes.

  ```text
  START: The Logical Boundary
  │
  ├─ Q1: Can an all-powerful being draw a "square circle"?
  │   │
  │   ├─ YES ───────────────────────────────────────────────► LEAF A: [Cartesian Voluntarism]
  │   │   (God transcends logic; contradictions are possible tasks.)
  │   │
  │   └─ NO ──► Q2: Is this inability a *defect* in God's power?
  │       │
  │       ├─ YES ───────────────────────────────────────────► LEAF B: [Incoherent Theism]
  │       │   (If God can't do nonsense, He isn't all-powerful. 
  │       │    *Note: Few hold this; implies logic binds God externally.*)
  │       │
  │       └─ NO ──► Q3: The Stone. Is "Create a stone you can't lift" 
  │                   a coherent description (like "lift 10 tons") 
  │                   or nonsense (like "draw square circle")?
  │           │
  │           ├─ NONSENSE ──────────────────────────────────► LEAF C: [Pseudo-Task Reply]
  │           │   (The task has no meaning; no power is required to skip it.)
  │           │
  │           └─ COHERENT ──► Q4: The Two-Step Test. Does the inability 
  │                               to lift the stone exist *before* 
  │                               the stone is created?
  │               │
  │               ├─ YES (Impossible from start) ───────────► LEAF D: [Logical Restriction]
  │               │   (It's logically impossible for an omnipotent 
  │               │    being to be non-omnipotent. *See Annotation 1.*)
  │               │
  │               └─ NO (Arises only after creation) ──► Q5: Can God *cease* 
  │                                                       to be omnipotent 
  │                                                       temporarily?
  │                   │
  │                   ├─ YES ───────────────────────────────► LEAF E: [Accidental Omnipotence]
  │                   │   (God can create the stone, lose power, 
  │                   │    and fail to lift it. Power is contingent.)
  │                   │
  │                   └─ NO ──► Q6: Moral Binding. If God promises 
  │                               never to lie, is He *unable* to lie?
  │                       │
  │                       ├─ NO (He can, but won't) ────────► LEAF F: [Moral Self-Restriction]
  │                       │   (Inability is voluntary; power remains intact.)
  │                       │
  │                       └─ YES (He literally cannot) ──► Q7: Is this inability 
  │                                                         a *defect* in power?
  │                           │
  │                           ├─ YES ───────────────────────► LEAF G: [Theological Fatalism]
  │                           │   (*Unoccupied:* Implies God is imperfectly 
  │                           │    powerful due to His goodness.)
  │                           │
  │                           └─ NO ──► Q8: Kenny's Challenge. Is "Omnipotence" 
  │                                       like "The Greatest Integer" 
  │                                       (a logically incoherent concept)?
  │                               │
  │                               ├─ YES ───────────────────► LEAF H: [Kenny's Rejection]
  │                               │   (Discard "Omnipotence"; no maximal power exists.)
  │                               │
  │                               └─ NO ──► Q9: Reformulation. Should we define 
  │                                           power as "Maximal *compossible* 
  │                                           power" (most power logically possible)?
  │                                   │
  │                                   ├─ YES ───────────────► LEAF I: [Reformulation Project]
  │                                   │   (Flint/Freddoso style; saves the doctrine.)
  │                                   │
  │                                   └─ NO ────────────────► LEAF J: [Naive Realism]
  │                                       (*Unoccupied:* Claims concept is coherent 
  │                                        but refuses to define limits.)
  ```

  ***

  ### INSTRUCTOR ANNOTATIONS & LOGICAL SPACE MAP
  *(For Seminar Discussion & Design Transparency)*

  **1. Indistinguishable Leaves (Req 3):** **Leaf C (Pseudo-Task)** and **Leaf D (Logical Restriction)** are functionally identical in outcome (God doesn't make the stone), but differ in *diagnosis*. C claims the *description* is nonsense (Mavrodes); D claims the *state of affairs* is logically excluded from power's scope (Aquinas). Q3 attempts to separate them, but students often conflate "nonsense" with "logically impossible."

  **2. Unoccupied Combinations (Req 3):**
  *   **Leaf B (Defect in Logic):** Unoccupied because **theologically unattractive**. It subjects God to external logical laws He cannot touch, undermining sovereignty.
  *   **Leaf G (Fatalism):** Unoccupied because **incoherent** within classical theism. If moral perfection entails power-defects, God is not *maximally* great.
  *   **Leaf J (Naive Realism):** Unoccupied because **neglected**. No philosopher asserts the concept is coherent but refuses to specify the scope when pressed.

  **3. Diagnostic Nodes (Req 2):**
  *   **Q4 (Two-Step):** Tests if the Stone paradox is unique or just a disguised Square Circle. If students answer "YES" (Impossible from start), they collapse the Stone into Q1.
  *   **Q6/Q7 (Binding):** Tests if an inability can be **non-power-limiting**. This separates moral nature (goodness) from metaphysical capacity (power).
  *   **Q8 (Kenny):** Generalizes the problem. If "Yes," the debate shifts from "Can God make the stone?" to "Is 'Omnipotence' a meaningful word?"

  **4. Design Note:** The tree forces a choice between **Essential** vs. **Accidental** omnipotence (Q5) before addressing moral binding. This prevents students from using "God can't sin" as a shortcut to solve the Stone paradox without addressing whether power can be lost.
