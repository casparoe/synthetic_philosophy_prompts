answer: |-
  **MEMORANDUM**

  **TO:** Curatorial Team, First World War Museum
  **FROM:** Academic Advisory Council
  **DATE:** October 26, 2023
  **SUBJECT:** Guidance for Wall Panel: "Who Was Responsible?"

  **Recommendation**
  The Council recommends the panel adopt a framing of **Causal Primacy without Collective Guilt**. The text must assert that while the crisis was systemic, the decisive choices to escalate local conflict into continental war were made by the political and military leadership of the Central Powers (specifically Imperial Germany and Austria-Hungary) in July 1914.

  **Historiographical Position**
  We must honor the evidence established by Fritz Fischer and his successors regarding German war aims and the "blank check" to Vienna. This evidentiary basis cannot be erased by a "shared responsibility" narrative. However, the Council acknowledges the validity of the "sleepwalker" contention: alliance rigidity and mobilization timetables created a trap that limited options for all powers. The panel must reflect that leaders *chose* to spring this trap, rather than implying the trap sprung itself. We reject the notion that structural causes absolve human agency.

  **Conceptual Clarity**
  Addressing the Council's third faction: the panel must distinguish between the *German State* of 1914 and the *German Nation* across time. Responsibility is assigned to specific decision-makers for the *initiation* of hostilities, not to a people for the *conduct* or *memory* of the war. Avoid moralizing language that implies eternal sin; use political language denoting accountability.

  **Drafting Constraints**
  1.  **Avoid Versailles 2.0:** Do not use language resembling Article 231. Do not address "Germany" as a trans-historical monolith.
  2.  **Avoid Hedging:** Do not conclude with "historians still disagree." State the consensus on agency, then acknowledge the debate on context.

  The goal is not a verdict for the court of history, but an explanation for the visitor. Be precise, be brave, be nuanced.
