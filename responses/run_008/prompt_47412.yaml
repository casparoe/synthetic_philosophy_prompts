answer: |-
  This is a high-risk, high-reward pedagogical move. If the game feels rigged or the burdens feel like hazing, you lose the room. If it lands, it creates a visceral memory that anchors the abstract philosophy.

  Below is a complete lesson plan designed for a 75-minute section with 24 students.

  ### **Lesson Plan: The Aggregation Game**

  **Objective:** Students will experience the tension between *maximizing aggregate good* and *respecting individual boundaries*, specifically isolating why we accept trade-offs within a life but resist them across lives.
  **Class Size:** 24 Students.
  **Grouping:** 6 Groups of 4 students.
      *   **Groups 1–5:** "Households" (Citizens).
      *   **Group 6:** "The Algorithm" (Optimizers).

  ---

  ### **1. Materials List**
  *   **Printed Payoff Tables:** One per Household (see Appendix A).
  *   **Burden Cards:** 5 cards labeled "BURDEN."
  *   **Compensation Tokens:** 10 poker chips or distinct slips of paper.
  *   **The "Tax":** A physical task. *Recommendation:* The "Statue Task." The bearer must stand at the back of the room, holding a heavy textbook overhead with one hand for the duration of the round (5 mins). It is safe, visible, and annoying, but not dangerous.
  *   **Reward:** 1 large bag of high-value candy (e.g., Name Brand chocolate, not generic hard candy).
  *   **Timer:** Visible on screen or phone.

  ---

  ### **2. Minute-by-Minute Timeline**

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Setup & Rules** | Divide groups. Assign Roles. Explain the "Statue Task." Explain Points = Candy. |
  | **10–20** | **Round 1: Autonomy** | Households decide internally how to maximize their own points. No Algorithm interference. |
  | **20–30** | **Round 2: Optimization** | The Algorithm assigns Burdens to maximize *Total Class Points*. Households must comply. |
  | **30–40** | **Round 3: Compensation** | The Algorithm can offer Compensation Tokens to Burden-Bearers to smooth over Round 2's injustice. |
  | **40–75** | **Debrief & Lecture** | Connect game mechanics to Rawls/Williams. Address the "It's just a game" objection. |

  ---

  ### **3. Game Rules & Mechanics**

  **The Goal:** Maximize your Household's Point Total. At the end, Points convert to Candy (10 pts = 1 piece).
  **The Catch:** To generate points, someone must hold the **Burden Card**.

  **Round 1 (Autonomy):**
  *   Each Household receives 1 Burden Card.
  *   The Household decides *who* holds it.
  *   **Payoff:** If you hold the Burden, your Household gets **50 Points**. If you don't, you get **10 Points**.
  *   *Expected Outcome:* Students rotate the burden or pick a volunteer. They accept the trade-off because the benefit stays in the "family."

  **Round 2 (Optimization):**
  *   Households return Burden Cards to the TA.
  *   **The Algorithm (Group 6)** receives all 5 Burden Cards. Their goal: Maximize **Total Class Points**.
  *   **The Twist:** The Algorithm can assign *multiple* Burdens to one Household or *zero* to others.
  *   **Engineered Inequality:** Give the Algorithm a secret instruction: *"Assign all 5 Burdens to Household 3. Give Households 1, 2, 4, 5 zero Burdens."*
  *   **Payoff:**
      *   Household with Burden(s): **50 Points per Burden** (but the *person* holding the Statue suffers).
      *   Household without Burden: **40 Points per Member** (Free Rider Bonus).
  *   *Math:* If Household 3 takes all 5 burdens, they get 250 points. The other 4 households get 160 points each (4 members x 40). Total Class Points are higher than if burdens were spread out (due to the "Free Rider Bonus" efficiency).
  *   *Experience:* Household 3 is sacrificed. Specifically, the *Bearer* in Household 3 (likely the same person from Round 1) has to do the Statue Task 5 times (or for 5x duration).

  **Round 3 (Compensation):**
  *   The Algorithm sees Household 3 is angry.
  *   They are allowed to offer **Compensation Tokens** from the "Free Rider" households to the Burden Bearer.
  *   **Rate:** 1 Token = 5 Points.
  *   **Constraint:** The Algorithm can offer tokens, but the Burden *must* still be carried if the Total Class Points increase.
  *   *Experience:* Household 1 gives 2 tokens to Household 3's Bearer. The Bearer is still standing holding the book, but now has "been paid." Does this make it okay?

  ---

  ### **Appendix A: Payoff Table (Printable)**

  | **Scenario** | **Burden Bearer Action** | **Household Point Gain** | **Personal Cost** |
  | :--- | :--- | :--- | :--- |
  | **Round 1 (Internal)** | Hold Burden Card | +50 Points | Statue Task (5 mins) |
  | | Do Not Hold | +10 Points | None |
  | **Round 2 (External)** | **If Your Household is Chosen** | +50 Points per Burden | Statue Task (5 mins per burden) |
  | | **If Your Household is Safe** | +40 Points per Member | None |
  | **Round 3 (Compensation)** | Accept Token | +5 Points per Token | Statue Task (Unchanged) |
  | | Give Token | -5 Points per Token | None |

  **Conversion Rate:** 10 Points = 1 Piece of Chocolate.

  ---

  ### **4. The Debrief Guide (35 Minutes)**

  Do not start by explaining Utilitarianism. Start by asking about their feelings.

  **Phase 1: The Felt Experience (10 mins)**
  *   *Ask Household 3:* "In Round 1, you volunteered for the burden. In Round 2, it was forced. The math was the same (50 pts vs task). Why did Round 2 feel worse?"
  *   *Ask The Algorithm:* "You were tasked with maximizing the total. Did you feel justified in targeting Household 3? Why?"
  *   *Ask The Compensators:* "In Round 3, did giving candy make the sacrifice feel 'fair'? Or did it feel like a bribe?"

  **Phase 2: Mapping to Theory (15 mins)**
  *   **The Utilitarian Move:** "The Algorithm acted as a Classic Utilitarian. It treated the class as one big container of points. It didn't care *where* the points were, only *how many*."
  *   **The Separateness Objection (Rawls/Williams):** "In Round 1, you sacrificed for *yourself* (or your group). That's prudence. In Round 2, you sacrificed for *strangers*. That's exploitation."
  *   **Key Distinction:** "Utilitarianism treats the boundary between persons as morally irrelevant, just like the boundary between Tuesday and Thursday. This game shows why that feels wrong. We are not slots in a machine; we are distinct lives."
  *   **Compensation:** "Round 3 tested the 'Consent/Compensation' loophole. If I pay you enough to let me punch you, is it okay? Utilitarianism says yes if utility rises. Most of you said 'no' or 'heck no.' Why? Because some rights aren't for sale."

  **Phase 3: The "It's Just a Game" Objection (10 mins)**
  *   *Anticipate this:* A student will say, "This doesn't prove anything. In real life, I wouldn't stand there. Real morality has consequences."
  *   *Your Response:* "You are right that this is a simulation. But Utilitarianism isn't about *feelings*; it's about *structure*. If you accept the principle 'Maximize Total Good,' you logically commit to Round 2. The game isn't trying to prove Utilitarianism is evil; it's trying to show you what the *logic* looks like when it hits the real world. If the logic feels broken in the game, why would it work in reality?"

  ---

  ### **5. Predictable Failure Modes & Mitigations**

  **1. The "Gamers" (Treating the Burden as a Joke)**
  *   *Risk:* The Bearer in Household 3 laughs it off, undermining the "injustice."
  *   *Fix:* Before Round 2,严肃 (seriously) state: "The integrity of the experiment depends on the burden feeling like a burden. If you treat it as a joke, you ruin the data for everyone." If they still laugh, ask them to sit out the debrief observation.
  *   *Alternative:* Make the burden mental. "The Bearer must write the summary notes for the whole class on the board while standing." This adds social pressure.

  **2. The "Rigged" Accusation**
  *   *Risk:* Students think you targeted Household 3 because you dislike them.
  *   *Fix:* Make the Algorithm's choice public. Have Group 6 write their decision on the board *before* they announce it. "We chose Group 3 because [Math Reason]." This depersonalizes the cruelty. It becomes systemic, not personal.

  **3. The Compensation Loophole Works Too Well**
  *   *Risk:* Household 3 accepts the candy and says "Actually, this is fine."
  *   *Fix:* Limit the compensation. "The Algorithm only has 5 tokens total." Ensure the payment is visibly insufficient for the effort.

  **4. Time Overrun**
  *   *Risk:* The game drags.
  *   *Fix:* Be a ruthless timekeeper. Use a projected timer. If Round 3 runs long, cut it and move to debrief. The debrief is where the learning happens.

  ---

  ### **6. Handling the Smart Utilitarian Student**

  **The Objection:** "The rules made you do it. In real life, we have rights. A real Utilitarian would know that violating rights causes long-term anxiety, so they wouldn't do Round 2. Your game is a strawman." (This is the *Rule Utilitarian* or *Indirect Utilitarian* defense).

  **Your Concession:** "That is a sophisticated objection. You are arguing that respecting separateness is instrumentally useful for maximizing utility in the long run."

  **Your Counter-Punch:** "Okay, let's tweak the scenario. Imagine a 'Secret Sacrifice.' The Algorithm sacrifices Household 3, but *no one finds out* except the Algorithm. No long-term anxiety, no social unrest. The Total Good goes up, and the secret is kept. Does the Separateness Objection still hold? Most people say yes. It's not about the *consequences* of the sacrifice; it's about the *act* of using a person as a means. The game isolates that intuition. If you rely on 'secrecy' to make Utilitarianism work, you've admitted that the bare principle violates our moral intuitions."

  ---

  ### **7. TA Cheat Sheet: Key Philosophical Terms to Write on Board**

  *   **Aggregation:** Summing up goods across different people.
  *   **Distribution:** How the goods are spread out.
  *   **The Boundary Problem:** Where does *my* life end and *yours* begin?
  *   **Instrumentalization:** Using a person as a tool for someone else's end (Kant).
  *   **Prudence vs. Morality:** Sacrificing for self (Prudence) vs. Sacrificing for others (Morality).

  ### **Final Note on Safety**
  Ensure the "Statue Task" is physically safe for all students. If you have a student with a shoulder injury, offer an alternative burden (e.g., "The Scribe" must write all notes in non-dominant hand). The point is the *imposition*, not the physical strain.
