  Your roommate is operating with a sophisticated, hybrid definition of akrasia that blends **Harry Frankfurt's hierarchical model of volition** (what you want to want) with **behavioral economics' time-inconsistency** (hyperbolic discounting).

  Based on her track record (Cases 1–5), she is not using a simple "acting against your own judgment" rule. If she were, Case 4 (the $80/$100 reversal) wouldn't qualify, because at the exact moment of taking the $80, the agent *prefers* the $80. Nor is she using a simple "regret" rule, because Case 5 (OCD) involves misery but isn't akrasia.

  Here is the reconstruction of her implicit principles, the predictions for your dinner cases, and the test to settle the debate.

  ### The Roommate's Implicit Rules

  She seems to be applying two necessary conditions for akrasia, derived from her verdicts:

  1.  **The Reflective Endorsement Condition (The "Calm Self" Rule):**
      *   *Derived from Cases 3 & 4:* Akrasia is a violation of the judgment made by your "calm," "distant," or "reflective" self, not necessarily your "hot," "immediate," or "impulsive" self.
      *   *Why:* In Case 4, the agent prefers the $80 *in the moment*, but she still calls it akratic because it violates the *prior* distant preference. In Case 3, it's *not* akratic because the "calm self" changed its mind *before* acting.
  2.  **The Agency Condition (The "Ownership" Rule):**
      *   *Derived from Cases 1 & 5:* The action must be willed by the agent, not compelled by an external-seeming force.
      *   *Why:* In Case 5 (OCD), the agent acts against judgment but it's "not really their urge." In Case 1 (Smoker), the agent acts against judgment and "hates herself," implying she knows she is the one choosing it.

  **The Tension:** There is a conflict between **Case 1** (Smoker) and **Case 3** (Banker). Case 1 implies *regret* is a marker of akrasia. Case 3 implies *value alignment* (even if changed) removes akrasia. This tension is the key to predicting your cases.

  ---

  ### Predictions for Cases A–D

  **A. The Procrastinator**
  *   **Verdict:** **Akratic.**
  *   **Why:** This is structurally identical to **Case 4** (Temporal Discounting). The "morning self" (calm/distant) prefers the report; the "evening self" (hot/immediate) prefers streaming. She has already established in Case 4 that yielding to the immediate preference against the distant resolution counts as weakness of will, even if the preference flips in the moment. The morning regret confirms the "Reflective Endorsement" was violated.

  **B. The Addict Ex**
  *   **Verdict:** **Not Akratic (Compulsion).**
  *   **Why:** This hinges on the **Agency Condition**. In **Case 5** (OCD), she ruled out akrasia because the urge "wasn't really theirs." The addict's description ("autopilot," "hand already moving," "resolution is true but not live") mirrors the OCD case. The resolution exists (unlike Case 2), but the *mechanism of agency* is bypassed. She will likely categorize this as pathology or compulsion, not a failure of will, because the "self" wasn't driving the car in the moment.

  **C. You (The Lisbon Trip)**
  *   **Verdict:** **Not Akratic.**
  *   **Why:** This is the most contentious case, but **Case 3** is your shield. In Case 3, the banker changed their mind and felt "zero inner conflict." You are claiming "zero regret" and that your judgment "quietly updated."
      *   If she strictly followed Case 1 (Smoker), she would say you are akratic because you acted against a standing judgment.
      *   However, she explicitly exempted "changing your mind" in Case 3. Since you are asserting that your considered judgment *now* matches your action (even if the update was post-hoc), she will likely accept that the conflict has dissolved. Without current conflict or regret, she cannot classify it as weakness of *will*; she will call it **rationalization** or **preference revision**. To call it akrasia, she would have to claim your update is "fake," which she can't verify.

  **D. The Risky Career Friend**
  *   **Verdict:** **Not Akratic.**
  *   **Why:** This fails the basic definition. Akrasia is acting *against* your best judgment. This friend acted *in accordance* with her best judgment ("judges the risky career move is best and actually takes it"). The terror and wish for safety are emotional conflicts, not volitional ones. She did the thing she thought was best. Your roommate would likely call this **courage** or **endurance**, not weakness of will. The will was strong enough to override the fear; that is the opposite of akrasia.

  ---

  ### Where the Rules Come Apart

  The divergence lies in **Case C**.

  *   **Rule 1 (Violation of Prior Calm Judgment):** If akrasia is defined by breaking a resolution made by your calm self, you are **Akratic**. The fact that you updated your view *after* the fact looks like a cover-up (sour grapes).
  *   **Rule 2 (Current Endorsement/Regret):** If akrasia requires *ongoing* conflict or regret (like the Smoker in Case 1), you are **Not Akratic**. Since you now endorse the trip, there is no split in the self.

  Your roommate's verdict on Case 3 suggests she prioritizes **Current Endorsement**. If you genuinely change your mind, you aren't weak-willed. The risk is that she views post-hoc updates as less "genuine" than pre-action updates.

  ### The Decisive Test Case

