      *   *Claim 3:* "Russell's guiding idea came from his epistemology: we are acquainted only with our own sense data and the particulars directly before the mind, so any name purporting to pick out something beyond that — 'Julius Caesar,' for instance — must really abbreviate a description."
          *   *Assessment:* **Problematic.** This conflates "On Denoting" (1905) with "Knowledge by Acquaintance and Knowledge by Description" (1910/1911) and later logical atomism. While related, the *primary* motivation in 1905 was logical (solving puzzles about denoting, non-existence, and identity), not strictly epistemological. The epistemological argument strengthens the view that ordinary proper names are descriptions, but the Theory of Descriptions itself applies to definite descriptions regardless of the epistemology. Also, Russell didn't think "Julius Caesar" *must* abbreviate a description in 1905 necessarily; that comes more with the "Logically Proper Name" doctrine later. In 1905, he treats ordinary names as capable of being descriptions, but the theory is about *descriptions* primarily.
