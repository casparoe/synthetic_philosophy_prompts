  Preliminary assessment
  Your package is not jointly tenable. You combine incompatible explanations for Moorean absurdity with conflicting accounts of self-knowledge. Specifically, the pragmatic explanation in (2) contradicts the claim about silent thought in (3). Furthermore, commitment to first-person authority in (5) clashes with the dispositionalist allowance for self-deception in (6). While individually plausible, these pairs cannot both be true without qualification. You hold positions pulling in opposite directions regarding normative constraints and introspective reliability. Further revision is necessary to prevent the paper from collapsing under internal contradiction.

  Tensions, most severe first
  Commitment (5) asserts that first-person avowals enjoy special authority because they function as indirect assertions of the world, implying one can hardly be mistaken about one's own beliefs. Commitment (6), however, defines belief dispositionally and explicitly entails that self-deception is possible, meaning subjects can be wrong about their current beliefs. These are in direct conflict. If (6) is correct, the mechanism in (5) fails in cases of self-deception; the avowal no longer tracks the belief disposition reliably. To maintain (5), you must argue self-deception is so rare it doesn't undermine general authority, weakening (6). To maintain (6), you must reduce (5)'s authority to a mere presumption, losing the strong transparency account. You cannot have robust transparency and robust self-deception simultaneously without qualifying the scope of 'authority'.

  Commitment (2) locates the absurdity of Moorean sentences specifically in the 'norms of assertion', suggesting the defect is communicative. Commitment (3) insists this absurdity survives even in silent thought, where no assertion occurs. If the absurdity persists without speech, it cannot be grounded solely in assertion norms. This suggests the constraint is doxastic—a rule of belief rather than communication. To save (2), you must argue that entertaining a thought involves an implicit assertion to oneself, which is controversial. To save (3), you must broaden (2) to cover norms of belief expression generally. As written, (2) renders (3) inexplicable, since a norm of assertion should not bind a silent thinker. You must choose whether Moore's paradox is fundamentally linguistic or psychological.

  Apparent tensions
  The conflict between (1) and the absurdity claims (2, 3) is apparent only. (1) concerns logical consistency, while (2) and (3) concern rational appropriateness. Moore's paradox is defined by this gap, so asserting both is required. Similarly, (2) and (4) are complementary. (2) describes the normative cost of asserting $p$ (presenting oneself as believing), while (4) describes the psychological state of the sincere asserter. One governs the practice externally, the other describes the internal state. There is no contradiction in an act having a norm regardless of sincere compliance. These pairs dissolve once logic is distinguished from rationality, and norms from sincerity.

  The cheapest single revision
  The cheapest revision is to broaden (2). Replace 'norms of assertion' with 'norms governing the expression of belief'. This accommodates (3), as thought is expressive or governed by similar doxastic norms, avoiding the claim that thought is implicit assertion. This secures your core analysis. However, the significant tension between (5) and (6) remains. You must still qualify either the strength of first-person authority or the scope of self-deception. Fixing (2) saves the seminar topic, but the philosophy of mind background requires further work. This change stabilises the paradox effectively, leaving the deeper metaphysical dispute for later.
