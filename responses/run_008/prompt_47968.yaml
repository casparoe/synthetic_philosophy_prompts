  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** 3rd-year PhD student in philosophy.
      *   **Task:** Presenting a paper at a departmental colloquium next month.
      *   **Topic:** *Local* Evolutionary Debunking Argument (EDA). Targets specific moral intuitions (partiality, reciprocity, punishment) while sparing others (impartial benevolence, honesty). Goal: Vindicate a reflective equilibrium that downweights the targeted intuitions.
      *   **Audience:** Metaethicists. Specific profiles:
          *   2 Cornell-style Naturalist Realists (Boyd/Brink style: moral facts = stable cooperation points).
          *   2 Parfitian Non-Naturalists (need independence from moral facts).
          *   1 Constructivist (genealogy = metaethics).
          *   1 Kantian (normativity in general).
          *   Grad students (regress worries).
      *   **Tone:** Casual, American English, honest, strategic (for the student's eyes only).
      *   **Requirements:** ~8 objections (ordered by damage), 2-minute replies, "soft spots," concession advice, the "secret fear" question, specific advice for the Constructivist.

  2.  **Deconstruct the Argument:**
      *   *Core Claim:* Evolution explains *some* intuitions via fitness, not truth. Therefore, those intuitions are undermined. Others are spared.
      *   *Strength:* Avoids global skepticism (Street's dilemma).
      *   *Weakness:* The "Line-Drawing Problem." Why does evolution track fitness for kin/reciprocity but *not* for impartial benevolence? If evolution shaped the faculty, didn't it shape all of it?
      *   *Metaethical Tension:* Naturalists will say fitness *is* the truth. Non-naturalists will say the causal link is the problem regardless of locality. Constructivists will co-opt the argument.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Big One):* The Line-Drawing Problem. (User suspected this). If evolution shaped the mind, why trust the "spared" intuitions? This is the strongest objection.
      *   *Objection 2 (Cornell Naturalists):* Coincidence/Convergence. If moral facts *are* facts about cooperation, evolution tracking cooperation *is* tracking truth.
      *   *Objection 3 (Parfitians):* The "Off-Track" Condition. Just showing a causal explanation isn't enough; need to show it's *insensitive* to the truth.
      *   *Objection 4 (Kantian):* Normativity vs. Morality. If you debunk moral intuitions, do you debunk the rational norms used to do the debunking?
      *   *Objection 5 (Constructivist):* Co-option. "I agree, but that means constructivism is true."
      *   *Objection 6 (Grad Students/Regress):* What justifies the downweighting? Isn't that just another intuition?
      *   *Objection 7 (Specific Target):* Reciprocity/Free-riders. Is punishment really just fitness? What about third-party punishment?
      *   *Objection 8 (Methodology):* Reflective Equilibrium. Can you really excise intuitions mid-equilibrium without collapsing the method?

      *Refining Order:* The Line-Drawing problem is definitely #1. The Naturalist "Truth-Tracking" is #2. The Parfitian "Insensitivity" is #3. The Constructivist is tricky but maybe less damaging if handled right. Let's prioritize damage potential.

  4.  **Developing Replies & Soft Spots:**
      *   *Line-Drawing:* Need to argue for modularity or different cognitive mechanisms. *Soft spot:* Empirical uncertainty.
      *   *Naturalists:* Distinguish "stable cooperation" from "moral rightness." *Soft spot:* If they define moral facts thinly enough, they win.
      *   *Parfitians:* Argue that the specific causal story precludes sensitivity. *Soft spot:* Hard to prove negative counterfactuals.
      *   *Constructivist:* Accept the overlap but maintain the normative force comes from the debunking, not the construction. *Soft spot:* Might just be verbal disagreement.

  5.  **Addressing the "Secret Fear":**
      *   User thinks it's the Line-Drawing problem. I agree. It's the "Domino Effect." If kin-selection is debunked, why not the intuition that "suffering is bad"?
      *   *Advice:* Don't fight it hard. Concede the boundary is fuzzy but insist the *core* cases (incest taboo, tit-for-tat) are distinct from abstract benevolence.

  6.  **Addressing the Constructivist:**
      *   They think genealogy *is* the metaethics.
      *   *Strategy:* Distinguish *explaining* the origin from *justifying* the norm. They want to say "we made it." You say "we found out this part is broken."
      *   *Advice:* Don't fight the label, fight the implication.

  7.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by damage? Yes.
      *   2-minute replies? (Keep text concise).
      *   Soft spots noted? Yes.
      *   Concession advice? Yes.
      *   Secret fear included? Yes.
      *   Constructivist note? Yes.
      *   Tone: Casual, American English, PhD level.

  8.  **Final Polish:**
      *   Make sure the vocab matches the specific schools (e.g., "sensitivity," "stable points," "constitutive," "normativity").
      *   Ensure the advice is pragmatic (e.g., "bite the bullet," "concede the point").
      *   Check the "Constructivist" specific advice.
      *   Check the "Secret Fear" analysis.

      *(Self-Correction during drafting)*: I initially thought about putting the Kantian higher, but for a metaethics colloquium, the Naturalist and Line-Drawing objections are more lethal to the *argument's success*. The Kantian is more of a "scope" worry. I'll keep Line-Drawing at #1. The Constructivist is annoying but not necessarily fatal to the *paper*, just the *conclusion's novelty*. I'll put them lower.

      *Refining the Naturalist Objection:* Cornell realists (Brink/Boyd) argue moral properties are natural kinds. If evolution selects for cooperation, and cooperation *is* the moral good, then evolution tracked truth. I need to make sure the reply distinguishes between *functional* success and *moral* truth.

      *Refining the Parfitian Objection:* They care about the "explanatory connection." If the belief is caused by fitness, is it *because* of the truth? I need to emphasize the *indifference* of the mechanism.

      *Refining the Constructivist:* This is actually a "friendly fire" situation. If they agree, is it bad? It undermines the *realist* implications the user might want. I need to advise the user on how to keep their realist (or at least non-constructivist) credentials.

      *Final check on tone:* Needs to sound like a senior grad student or postdoc giving advice to a peer. "Here's the deal," "Don't sweat it," etc.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is your Q&A prep sheet. I've ordered these by how much they threaten the core thesis, not just how annoying they are. I've kept the replies tight (roughly 2 minutes spoken) and flagged where you're vulnerable.

  ### 1. The "Domino" / Line-Drawing Objection (Highest Damage)
  **Who:** Everyone, but led by the Non-Naturalists and sharp Grad Students.
  **The Question:** "You're drawing a bright line between 'partiality/reciprocity' intuitions and 'impartial benevolence' intuitions. But if evolution shaped the cognitive faculties that produce the former, didn't it shape the very same faculties producing the latter? If the mechanism is tainted for kin-selection, why isn't it tainted for the intuition that 'suffering is bad'? How do you stop the debunking from going global?"
  **The Reply:** "Great question. I'm not claiming these are distinct *faculties* in a modular sense, but distinct *outputs* with distinct causal histories. The selection pressure for kin-altruism is direct and specific (inclusive fitness). The selection pressure for impartial benevolence is, at best, a byproduct or exaptation. My argument relies on the *specificity* of the explanation. For the targeted intuitions, the fitness explanation *screens off* the moral truth. For the spared intuitions, there is no competing fitness explanation that is as robust. I'm not saying the spared intuitions are infallible, just that they aren't *debunked* by this specific genealogy."
  **Soft Spot:** This is empirically shaky. Evolutionary psych is notoriously adaptable. If they press that "impartial benevolence" also aids group selection, you're in trouble.
  **Strategy:** **Concede the fuzziness.** Don't claim a bright line. Claim a *gradient* of confidence. "I agree the boundary isn't sharp, but the core cases of incest avoidance or tit-for-tat retaliation are much more strongly tied to direct fitness than abstract concern for distant strangers."

  ### 2. The Cornell Naturalist "Convergence" Objection
  **Who:** The two Naturalist Realists.
  **The Question:** "On our view, moral facts *just are* facts about the stable points of rational cooperation. If evolution selected for intuitions that promote stable cooperation, then evolution selected for truth-tracking intuitions. Your 'fitness' story *is* a 'truth-tracking' story. So where's the debunking?"
  **The Reply:** "That works if moral facts are defined functionally as 'whatever promotes stability.' But my argument assumes a thicker conception of moral truth, one that allows for the possibility that stable cooperation is sometimes unjust. Evolution selects for *fitness*, not *justice*. If the fitness optimum requires, say, xenophobia or rigid hierarchy, evolution would select for that, even if it's morally wrong. The coincidence between fitness and moral truth is too contingent to sustain knowledge."
  **Soft Spot:** If they dig in and say "No, moral facts *are* the natural kinds of human flourishing," you can't prove them wrong without begging the question.
  **Strategy:** **Bite the bullet on definition.** "If you define moral facts as 'fitness-conducive behaviors,' then yes, you're immune. But that's not a view that can accommodate the critical leverage we need to criticize existing social norms."

  ### 3. The Parfitian "Explanatory Connection" Objection
  **Who:** The Non-Naturalists.
  **The Question:** "Debunking requires showing the belief is *insensitive* to the truth. Merely showing a causal link to fitness isn't enough unless you show that *even if the moral facts were different*, we'd still have these intuitions. Can you really establish that counterfactual?"
  **The Reply:** "I can't prove the counterfactual with certainty, but the burden is on the reliability of the mechanism. If the best explanation for the belief is 'it helped ancestors reproduce,' and that explanation makes no reference to moral truth, the probability that the belief is true is lowered. We don't need to know what the alternative moral facts would be; we just need to see that the actual cause is independent of them."
  **Soft Spot:** Parfitians are sticklers for the "explanatory gap." They might say fitness and moral truth could be correlated.
  **Strategy:** **Hold the line on 'Best Explanation.'** Frame it as an inference to the best explanation. The fitness story is complete without invoking moral facts; therefore, moral facts are explanatorily redundant.

  ### 4. The Constructivist Co-Option (The "Spooky" One)
  **Who:** The Constructivist.
  **The Question:** "I'm happy to grant your genealogy. In fact, I insist on it. But that just shows moral truths are constructed from the practical standpoint of agents like us. You think you're debunking realism; I think you're just doing metaethics. Why isn't your conclusion just a premise in my view?"
  **The Reply:** "Because the normative force of my argument relies on the idea that we *ought* to revise these beliefs in light of their origins. If constructivism is true, and these intuitions are constitutive of the moral framework, you can't use the genealogy to undermine them without undermining the framework itself. I'm using the genealogy to *correct* our moral view, not just describe its architecture."
  **Soft Spot:** She might be right. If morality is constructed, finding out the "construction materials" are evolutionary doesn't break the building.
  **Strategy:** **Distinguish *Origin* from *Validity*.** "Agree that genealogy is central. But for the constructivist, the origin *validates* the norm. For me, the origin *challenges* it. We agree on the science, disagree on the normative upshot." (See specific note below).

  ### 5. The Kantian "Normativity" Scope Objection
  **Who:** The Kantian.
  **The Question:** "You're using rational norms to argue that we should downweight these intuitions. But if evolutionary pressures shape our practical reasoning, why trust the norms of inference you're using to make the argument? Doesn't this debunk normativity in general?"
  **The Reply:** "This is the global skeptical worry I'm trying to avoid. I'm targeting *substantive moral intuitions* (e.g., 'help your brother'), not *procedural rational norms* (e.g., 'avoid contradiction'). The latter are preconditions for having a debate at all. If you debunk logic, you've debunked your own objection."
  **Soft Spot:** Quineans and naturalists will say the distinction between substantive and procedural is blurry.
  **Strategy:** **Pragmatic Stop.** "I'm willing to treat logical norms as the 'hinge' propositions that stay fixed. If we can't trust modus ponens, we can't do philosophy. But we can trust modus ponens while doubting whether we ought to favor our kin."

  ### 6. The "Third-Party Punishment" Pushback
  **Who:** Empirically minded Metaethicists.
  **The Question:** "You target punishment of free-riders as fitness-tracking. But humans punish even when it's costly and anonymous. That looks like genuine moral commitment, not fitness maximization. Doesn't that undermine your selection story?"
  **The Reply:** "Not necessarily. Reputation management is a powerful selection pressure. Even anonymous punishment can be sustained by internalized norms that were selected for public contexts. The *mechanism* is fitness-tracking even if the *output* in modern contexts looks impartial. We're stuck with Stone Age software in a modern world."
  **Soft Spot:** Strong reciprocity theories are debated. If they cite specific studies showing altruism is too costly to be adaptive, you need to pivot.
  **Strategy:** **Pivot to Mismatch.** "Whether it's direct fitness or reputation management, the point is the *source* is non-moral. The fact that it misfires in modern anonymous contexts proves it wasn't tracking abstract justice."

  ### 7. The Reflective Equilibrium "Bootstrapping" Worry
  **Who:** Methodologists / Grad Students.
  **The Question:** "You say we should downweight these intuitions in reflective equilibrium. But what tells us to downweight them? Isn't that just another intuition? Aren't you just privileging the intuitions you like?"
  **The Reply:** "It's not an intuition; it's a methodological constraint based on reliability. If I have a reason to think my vision is blurry in red light, I downweight visual seemings in red light. That's not a visual seeming; it's a theory about the instrument. Here, the evolutionary theory is the reason to distrust the specific instrument."
  **Soft Spot:** It can feel circular if the theory itself relies on some moral assumptions.
  **Strategy:** **Analogy.** Stick to the perceptual analogy. It's the strongest defense against circularity charges.

  ### 8. The "So What?" Objection
  **Who:** The Tired Senior Faculty.
  **The Question:** "Let's say you're right. We should downweight kin-partiality. Does that actually change any first-order moral conclusions we didn't already accept? Or is this just a fancy justification for liberalism?"
  **The Reply:** "It changes the *justification*, which matters for stability. But it also targets specific practices: nepotism, retributive justice, and in-group bias. If those intuitions are undermined, arguments relying on them lose their premise. It's not just liberalism; it's a demand to re-justify our practices without leaning on 'natural' affections."
  **Soft Spot:** It might not change much in practice.
  **Strategy:** **Lower Expectations.** "Philosophy rarely overturns common sense. It clarifies which parts of common sense are worth keeping."

  ---

  ### The "Secret Fear" Question
  **You asked:** *I think I know what it is (something about where I draw the line and why the same selection story doesn't extend to the intuitions I'm trying to save), but I want to see if you agree and how bad it actually is.*

  **My Verdict:** You are absolutely right. This is **Objection #1 (The Domino)**. It is the most dangerous objection because if it sticks, your "Local" argument collapses into a "Global" one, which you explicitly said you want to avoid.

  **How bad is it?** It's lethal if you claim the line is sharp. It's manageable if you claim the line is a **spectrum of confidence**.
  **Advice:** Do not fight this hard. Pre-empt it in your closing remarks. Say something like: "I anticipate the worry that this spreads. I'm not claiming the spared intuitions are certain, only that they lack the *specific* defeater that the kin/reciprocity intuitions have." If you concede that *some* leakage is possible, you look reasonable. If you defend a hard wall, you look naive.

  ---

  ### Specific Note on the Constructivist
  **The Situation:** She says, "Your debunking argument is just my thesis stated menacingly."
  **Why it spooks you:** It makes your paper look like it's arguing for a view you don't hold, or that your "realist-sounding" conclusion is actually constructivist.
  **The Fix:** Don't fight the label; fight the **implication**.
  **What to say:** "I think we agree that genealogy matters. But for you, the genealogy *constitutes* the authority of the norm. For me, the genealogy is a *test* of the norm's independence. If we agree on the upshot (we should revise these intuitions), that's great. But I want to maintain that we are revising them because they fail to track *truth*, not because they fail to fit a *construction procedure*."
  **Real Talk:** If she's friendly, this isn't a defeat. It means she agrees with your conclusion. Just clarify that you aren't signing up for constructivism as a metaethical package deal. You can use her tools without buying her house.

  ### General Strategy Tips
  1.  **Concede the Empirical Uncertainty:** Don't act like evolutionary psych is settled physics. Say "Assuming the standard model of kin-selection..." This protects you if a biologist in the room objects.
  2.  **Own the "Local" Label:** Keep repeating that this is a *local* argument. When they attack globally, bring them back to the specific case of kin/reciprocity.
  3.  **The "Two-Minute" Rule:** In the Q&A, don't monologue. Answer, then ask "Does that address the worry?" It keeps you from digging a deeper hole.

  Good luck. You've got a solid paper; the "Local" move is your strength, just don't let them push you into defending a global boundary you can't draw.
