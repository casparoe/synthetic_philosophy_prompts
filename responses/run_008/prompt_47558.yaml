  I'm a high school senior finishing a capstone project on the debate over adaptationism in evolutionary biology, and I'd like to imagine that the two sides finally agreed to a structured, good-faith adversarial collaboration. Please take the role of a philosopher of biology who has spent equal time in both camps, think carefully about what each side could genuinely sign, and draft the resulting joint statement.

  The parties are a committed adaptationist — someone who thinks assuming a trait is an adaptation is usually the right first hypothesis and that natural selection is the only known force that can build complex functional organization — and a committed defender of the Gould–Lewontin spandrels critique, who thinks adaptationists systematically overreach by treating byproducts, constraints, and accidents of history as things selection designed. Please produce: a numbered section of claims both would accept, including about what the spandrels analogy itself does and does not show, and about the charge of "just-so storytelling" being a methodological complaint rather than a refutation of any particular claim; a disagreements table in which each row states one remaining disagreement in wording each side would accept for its own view; the cruxes, with special attention to whether the two camps can ever agree on how to classify a trait as adaptation, byproduct, or drift before they have independent evidence of its selective history — consider the human chin as a running example, since one side treats it as a likely structural byproduct of jaw growth and the other as a candidate object of selection; and, for each crux, a concrete kind of evidence both sides would agree bears on it, with each side's prediction written down in advance — for instance, what each would predict about how often comparative genomic studies should find signatures of recent positive selection behind complex human traits like music or chronic depression, or about what developmnetal biology would have to show for the "byproduct" verdict to count as more than a label.

  One more thing: the parties suspect part of their dispute is merely verbal — one hears "adaptationism" as an empirical claim that most traits are adaptations, the other as a heuristic claim that assuming adaptation is a productive research strategy, in the way philosophers who distinguish empirical, explanatory, and methodological versions of the view would put it. Please say explicitly which parts of their disagreement you judge to be verbal and which substantive.

  Begin your response with the joint statement itself, with no preface, commentary, or restating of my instructions; any reflections on what was hard to phrase go at the very end, after the full document.
