  # Joint Statement on the Scope and Limits of Adaptationist Explanations in Evolutionary Biology

  **Signatories:** The Adaptationist Working Group (AWG) and the Structuralist-Constraint Working Group (SCWG)  
  **Facilitated by:** The Philosophy of Biology Mediation Committee  
  **Date:** October 26, 2023

  ## I. Points of Consensus

  Both parties affirm the following propositions as foundational to future research collaboration:

  1.  **The Reality of Selection:** Natural selection is a genuine, potent evolutionary force capable of shaping phenotypic traits. Neither party disputes the existence of selection or its role in cases where independent evidence (e.g., experimental evolution, clear fitness gradients) is available.
  2.  **The Validity of the Spandrels Analogy:** Both parties agree that the Gould–Lewontin "spandrels" analogy successfully demonstrates that some traits arise as necessary architectural byproducts of other selected features (constraints) rather than direct targets of selection. The analogy does not, however, demonstrate that *no* traits are adaptations, nor does it invalidate adaptationist explanations where evidence supports them.
  3.  **The Nature of "Just-So Storytelling":** Both parties agree that the charge of telling a "just-so story" is a methodological complaint regarding the lack of independent evidentiary support for a hypothesis, not a logical refutation of the hypothesis itself. A plausible adaptive narrative is insufficient for confirmation but remains a valid starting point for investigation.
  4.  **Evidentiary Standards:** Both parties agree that confirming a trait as an adaptation requires evidence beyond mere fit between form and function. Acceptable forms of independent evidence include comparative phylogenetic analysis, developmental genetic mapping, and population genomic signatures of selection.
  5.  **Complexity and Function:** Both parties acknowledge that complex functional organization is rare and requires explanation. The AWG maintains selection is the only known cause of such complexity; the SCWG agrees selection is a primary cause but maintains that developmental systems can generate complex-looking patterns without specific selective targeting of every detail.

  ## II. Table of Remaining Disagreements

  The following table outlines substantive disagreements that remain after consensus was reached on Section I. The wording below is accepted by both parties as an accurate characterization of the opposing view.

  | Domain of Dispute | Adaptationist Working Group (AWG) Position | Structuralist-Constraint Working Group (SCWG) Position |
  | :--- | :--- | :--- |
  | **The Default Null Hypothesis** | When encountering a trait with apparent function, the working null hypothesis should be that it is an adaptation shaped by selection, until evidence suggests otherwise. | When encountering a trait, the working null hypothesis should be neutrality or structural constraint, requiring positive evidence to infer specific selective history. |
  | **Interpretation of Complexity** | Complex functional integration is a reliable indicator of selective design; the probability of such integration arising via drift or constraint alone is negligible. | Complex integration can emerge from developmental constraints and physical laws; complexity alone is not sufficient evidence of specific selective targeting. |
  | **Burden of Proof** | The burden lies on the critic to demonstrate that a trait *cannot* be explained by selection or offers no fitness benefit. | The burden lies on the proponent to demonstrate that a trait *was* specifically selected for, rather than being a byproduct of something else that was selected. |
  | **Frequency Claim** | The majority of phenotypic traits exhibiting functional coherence are adaptations. | A significant proportion of traits exhibiting functional coherence are byproducts, exaptations, or results of drift, sufficient to warrant systematic skepticism. |

  ## III. Cruxes and Empirical Arbitration

  The central crux of this debate is whether a trait can be classified as an adaptation, byproduct, or result of drift *prior* to the acquisition of independent evidence of its selective history. The AWG argues classification defaults to "adaptation" based on functional appearance; the SCWG argues classification must remain "undetermined" or default to "byproduct" until selective history is reconstructed.

  To resolve this, both parties agree to the following pre-registered predictions using the **human chin** as a running example, alongside broader genomic traits.

  ### Case Study: The Human Chin (*Mentum Osseum*)

  *   **AWG Classification:** Candidate Adaptation. (Hypotheses: Sexual selection, mechanical stress resistance, speech articulation support).
  *   **SCWG Classification:** Likely Structural Byproduct. (Hypothesis: Geometric consequence of differential jaw growth rates and tooth reduction).

  #### Agreed Evidence Types and Predictions

  | Evidence Type | What Both Parties Agree Bears on the Question | AWG Prediction (Adaptation) | SCWG Prediction (Byproduct) |
  | :--- | :--- | :--- | :--- |
  | **1. Developmental Biology** | Identification of genetic loci specifically controlling chin protrusion independent of overall jaw size. | We predict distinct developmental modules or loci that regulate chin projection separately from general mandible size, indicating specific targeting. | We predict chin morphology will correlate perfectly with overall jaw resorption rates and tooth size, with no independent genetic module for "chin-ness." |
  | **2. Comparative Phylogenetics** | Examination of hominid fossils and primate relatives to determine trait emergence relative to selective pressures. | We predict the chin emerges concurrently with a specific new selective pressure (e.g., speech or social signaling) not present in close relatives lacking chins. | We predict the chin emerges solely as a function of facial shortening seen in *Homo sapiens*, appearing even in lineages without the proposed selective pressure. |
  | **3. Population Genetics** | Genome-wide association studies (GWAS) and scans for signatures of recent positive selection (e.g., reduced heterozygosity, high linkage disequilibrium) in relevant loci. | We predict strong signatures of recent positive selection in loci associated with chin morphology, distinct from background selection on jaw size. | We predict chin-related loci will show neutral evolution patterns or signatures consistent with hitchhiking alongside general craniofacial changes, not specific selection. |

  ### Extended Cases: Music and Chronic Depression

  Both parties agree to apply the same evidentiary standards to complex behavioral/psychological traits.

  | Trait | AWG Prediction | SCWG Prediction |
  | :--- | :--- | :--- |
  | **Human Musical Capacity** | Comparative genomic studies should find signatures of positive selection in genes associated with auditory processing and rhythm coordination specific to humans. | Genomic studies will show musical capacity is a byproduct of language circuitry and general auditory processing; no specific "music genes" under recent selection will be found. |
  | **Chronic Depression** | Variants associated with depression should show evidence of balancing selection (e.g., heterozygote advantage) or context-dependent fitness benefits. | Variants associated with depression will show patterns consistent with mutation-selection balance or mismatch between modern environments and ancestral physiology, without specific adaptive history. |

  ## IV. Diagnosis of Verbal vs. Substantive Dispute

  Upon review, the parties conclude that a portion of the historical debate is verbal, while a core remains substantive.

  **1. Verbal Disagreement (Methodological vs. Empirical Adaptationism)**
  *   **Diagnosis:** Much conflict arises because the AWG often defends "adaptationism" as a **heuristic strategy** (methodological adaptationism), whereas the SCWG often attacks "adaptationism" as an **empirical claim** about the frequency of adaptations (empirical adaptationism).
  *   **Resolution:** The parties agree that if adaptationism is defined solely as "assuming adaptation is a productive way to generate hypotheses," the SCWG has no objection. If adaptationism is defined as "most traits are in fact adaptations," the AWG must acknowledge this is an empirical claim subject to falsification. The heated rhetoric often stems from conflating these two definitions.

  **2. Substantive Disagreement (The Frequency and Default)**
  *   **Diagnosis:** Even after clarifying definitions, a substantive disagreement remains regarding the **prior probability** of adaptation.
  *   **Resolution:** This cannot be resolved verbally. It requires the empirical arbitration outlined in Section III. The AWG believes the "design stance" yields true positives more often than the "constraint stance." The SCWG believes the "design stance" yields false positives (type I errors) at an unacceptably high rate. This is a disagreement about the structure of nature, not merely the definition of words.

  ***

  ### Reflections on Drafting (Facilitator's Note)

  Several aspects of this document proved difficult to phrase in a way both parties could sign without feeling they had conceded their core identity.

  1.  **The "Only Known Force" Claim:** The Adaptationist Working Group insisted on retaining the claim that selection is the *only* known force capable of building complex functional organization. The SCWG found this too strong, as they believe developmental constraints can generate complexity. The compromise in Section I, Point 5, acknowledges the AWG's stance while allowing the SCWG to register their dissent regarding the "only" qualifier without blocking consensus on the need for evidence.
  2.  **The Null Hypothesis:** Framing the disagreement over the "default" hypothesis was delicate. The AWG views the default as "adaptation" because they view function as evidence of history. The SCWG views the default as "null" because they view function as potentially illusory. The table in Section II had to be carefully worded to avoid implying one side is being "unscientific" for their choice of null.
  3.  **The Chin Example:** Selecting the human chin was risky because there is existing literature both sides cite. We had to ensure the predictions were future-looking (e.g., specific genetic modules) rather than re-litigating past morphological analyses. Ensuring the SCWG prediction allowed for "hitchhiking" was crucial so they didn't have to deny selection exists, only that it targeted the chin *specifically*.
  4.  **Verbal vs. Substantive:** Distinguishing between the heuristic and empirical versions of adaptationism is standard in philosophy of biology, but getting the practitioners to admit that their heat often stems from this confusion was challenging. The text in Section IV tries to validate both approaches while insisting that the empirical frequency claim must be tested, not assumed.
