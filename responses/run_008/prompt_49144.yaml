answer: |-
  This is a fantastic philosophy of science puzzle. You've basically reconstructed a debate between **Instrumentalism** (models are tools for prediction, truth doesn't matter) and **Scientific Realism** (models need to reflect how the world actually works), but with a specific constraint on *methodological honesty*.

  Here is my read on your roommate, her likely verdict, and how to settle the bet.

  ### The Verdict
  **She is going to hate the AI weather models.**

  She will likely classify them as "NOT fine," probably grouping them closer to the hand-tuned climate model than the billiard-ball physics.

  ### The Diagnosis: What Rule Is She Actually Using?
  You identified two potential rules, but I think there is a third, more specific one that fits her track record perfectly. Let's call it the **"Transparency of Simplification"** rule.

  Here is how her past cases break down under this rule:

  1.  **The "OK" Pile (Physics, Econ, Genetics, Traffic):**
      *   **Commonality:** These models all make **explicit, declarative lies.**
      *   *Physics:* "We declare molecules are hard spheres." (Everyone knows they aren't, but we agree to pretend).
      *   *Econ:* "We declare humans are rational." (We know they aren't, but it's a stated axiom).
      *   *Traffic:* "We declare cars are dots."
      *   **Why she likes them:** The "lie" is out in the open. You know *where* the model departs from reality. This allows you to say, "The model works *despite* this lie, so it must be capturing a deeper truth" (her comment on Econ).

  2.  **The "NOT OK" Pile (Climate, Psychology):**
      *   **Commonality:** These involve **hidden manipulation of evidence.**
      *   *Climate:* A parameter was moved *until* it fit. The "lie" isn't a simplifying assumption; it's a fudge factor inserted to force agreement.
      *   *Psychology:* Data was dropped. This is hiding evidence to force agreement.
      *   **Why she hates them:** The agreement between model and world is manufactured, not discovered. You don't know if the model works because it's true or because you tweaked it until it did.

  **Where the AI Model Fits:**
  The AI weather model is the ultimate "Black Box." It has **no explicit assumptions** (unlike Physics/Econ) and it is **purely fitted parameters** (like the Climate model, but with millions of parameters instead of one).
  *   It violates the "Explicit Lie" norm: You can't point to a simplification.
  *   It violates the "No Fudging" norm: The entire model is a fit to historical data.

  Even though it predicts well, she likely views it as **correlation without comprehension.** To her, the Econ model predicts well *because* the rational agent assumption isolates a real signal. The AI model predicts well *because* it memorized the past.

  ### Where the Rules Diverge
  You were right to be confused, because two different philosophical rules collide here:

  *   **Rule 1: Pure Instrumentalism.** ("If it predicts, it's good.")
      *   *Verdict on AI:* **OK.** It beats the physics models. Who cares why?
      *   *Conflict:* This rule struggles to explain why she hated the Climate model (which also "predicted" the past perfectly). She would have to argue the Climate model was overfitted (didn't predict the *future*), whereas the AI does.
  *   **Rule 2: Structural Realism.** ("You need a causal story.")
      *   *Verdict on AI:* **NOT OK.** There is no mechanism. It's a curve-fitting exercise.
      *   *Conflict:* This rule struggles with Econ. Rational agent theory is often criticized as having *no* causal reality. But she defends Econ by saying the *assumption* is the feature. AI has no assumption to defend.

  **The Synthesis:** Her rule is actually **"Predictive Success + Transparent Structure."**
  *   Physics/Econ/Traffic: Transparent Structure (even if false) + Good Prediction = **OK**.
  *   Climate/Psych: Opaque Manipulation + Good Fit = **NOT OK**.
  *   AI: Opaque Structure + Good Prediction = **NOT OK** (because the structure is missing).

  ### The Crucial Experiment
  To settle which rule she is running, you need to disentangle **"Automated Fitting"** from **"Transparent Structure."**

  You asked: *"Would the hand-tuning still count as cheating if a computer did the tuning automatically over ten thousand parameters instead of a scientist doing it by hand?"*

  **Yes, throw this exact case at her.** But to make it definitive, frame it like this:

  > **The Case:** "Imagine a traditional physics climate model. Instead of a scientist hand-tuning one parameter to match history, they use an algorithm to automatically calibrate 50 parameters to match the historical record as closely as possible. It's the same physics, just 'optimized' by computer. Is this fine now, or is it still cheating?"

  **How to interpret her answer:**

  1.  **If she says "It's still cheating":**
      *   **Her Rule:** "Fitting parameters to match data is fundamentally unscientific, regardless of who (or what) does the fitting."
      *   **AI Verdict:** Confirmed **NOT OK**. The AI is just 10 million parameters being auto-tuned.
      *   **Why:** This proves she cares about the *source* of the model's success (theory), not just the *method* of optimization.

  2.  **If she says "That's fine, it's just calibration":**
      *   **Her Rule:** "Human hand-tuning is the sin (bias/fraud), but computer optimization is legitimate estimation."
      *   **AI Verdict:** **Uncertain.** Now you have to test the "Black Box" element.
      *   **Follow-up Case:** "What if the computer doesn't just tune parameters, but *invents the equations*? (Symbolic AI). It spits out a formula that predicts weather, but the formula looks like gibberish (e.g., `Temp = (Pressure^2.3 * Wind)^0.5 + 4.2`). No physics, just a formula found by math."
          *   If she accepts *this*, she is a pure **Instrumentalist** (Prediction is King).
          *   If she rejects *this*, she is a **Structuralist** (The equations must make physical sense).

  ### My Bet
  I suspect she will say the **Automated Calibration is still cheating** (or at least "less good" than first-principles).

  Why? Because of her comment on Econ: *"If your theory still predicts well while assuming something insane, that proves it's capturing something real."*

  The key phrase is **"Your theory."**
  *   **Econ:** Has a theory (Rational Agents).
  *   **Physics:** Has a theory (Kinetic Energy).
  *   **AI:** Has no theory. It has weights and biases.

  To her, science is about **explanation**, not just **forecasting**. The AI forecasts the weather, but it cannot explain *why* the storm formed. The Billiard Ball model explains pressure via collisions, even if the balls aren't real. The AI explains nothing.

  **Summary for your argument:**
  Tell her the AI model is "The Climate Model on Steroids." It takes the thing she hated (fitting to history) and removes the thing she liked (explicit assumptions). If she accepts it, she has to admit she was wrong about the Climate model. If she rejects it, she has to admit that Prediction isn't the only thing that matters.
