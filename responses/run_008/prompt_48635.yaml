      *   *Claim 7: "...modal realism simply takes the physics at face value."*
          *   **Lewis's View:** No. Modal realism is a priori metaphysics.
          *   **Verdict:** Wrong.

      *   *Claim 8: "Lewis's view therefore stands or falls with the multiverse physics..."*
          *   **Lewis's View:** No. They are independent.
          *   **Verdict:** Wrong conclusion based on wrong premises.

