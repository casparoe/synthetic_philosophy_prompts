prompt: |-
  I'm the duty hydrologist for a river basin authority, and during flood season I make the call every six hours on whether to issue warnings, request evacuations, or stand down. The way it works: our hydrological model gets fed a weather forecast plus the current river readings, and it spits out a single water-level curve for the next 72 hours. The people above me love the single number -- it makes the briefing easy. We also have a mode where it runs 50 times with slightly perturbed initial conditions, which nobody had trained me on until last month, and I mostly use it now when I'm nervous, without really knowing what I'm looking for.

  Here's my problem. Sometimes the model is confidently wrong 48 hours out and we evacauted nobody and got lucky. Sometimes the 50 runs are all over the place and I stood down because "most of them looked fine" and that was gut, not method. I know enough to know that deterministic doesn't mean predictable -- that a perfect model with imperfect initial conditions goes bad at a rate that depends on the horizon, and that there's a difference between the forecast losing skill because of chaos and the model being wrong about the physics (our rainfall-runoff routine has a known bias after long dry spells). But I can't put any of that into practice in the 30 minutes between the run finishing and my briefing, and I don't have time to become a dynamical systems person.

  Write me a decision procedure I can actually run in those 30 minutes: what to look at, in what order, what counts as signal and what's noise, rough thresholds or rules of thumb where numbers help, and clear stopping points where the procedure hands off to the duty manager because the question is judgment, not computation. It should distinguish, in plain language, three failure sources: (1) chaos -- small initial-condition errors blowing up, (2) structural error -- the model itself being biased, and (3) the weather forecast upstream being off, since we inherit whatever skill it has. Be honest about which of your steps are just my judgment dressed up as arithmetic, and say where the procedure will misfire.

  Then run it on three cases and, for each, end with its own line beginning "Call:" followed by one word or a short phrase:

  (a) 12-hour horizon, all 50 perturbed runs agree on peak level within a couple of centimeters, and the peak is above the evacuation threshold;
  (b) 48-hour horizon, the runs split roughly half above and half below the threshold, with no pattern I can see in which ones go which way;
  (c) 12-hour horizon, all runs agree -- and they all agree on something this exact model got badly wrong in the same situation two years ago, after a long dry spell.

  And at the very end of the whole thing, one final line beginning "Verdict:" with a short phrase (no sentence) capturing the overall stance I should take into the next 72 hours given all three cases.

  Note we already have the ensemble mode, so don't just tell me to go buy one. And case (b) matters most -- that's the one where the procedure has to give me an answer I won't like, because right now my default there is hope.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Duty Hydrologist at a River Basin Authority.
      *   **Task:** Make critical decisions (warnings, evacuations, stand down) every 6 hours during flood season.
      *   **Constraint:** 30 minutes between model run completion and briefing.
      *   **Tools:** Deterministic model (single curve) + Ensemble model (50 perturbed runs).
      *   **Problem:** Deterministic model is confidently wrong sometimes. Ensemble is used intuitively ("gut") when nervous, lacking methodological rigor. Need to distinguish between Chaos (initial conditions), Structural Error (model physics), and Forcing Error (weather forecast).
      *   **Requirement:** A concrete, 30-minute decision procedure. Plain language. Distinguish failure sources. Acknowledge limitations/judgment calls. Run on three specific cases (a, b, c). Specific formatting for "Call:" and "Verdict:".
      *   **Tone:** Professional, pragmatic, honest about uncertainty, authoritative but humble.

  2.  **Deconstruct the Three Failure Sources:**
      *   *Chaos (Initial Conditions):* Small errors grow over time. Ensemble spread increases with horizon. If spread is tight at 12h but wide at 72h, that's chaos.
      *   *Structural Error (Model Physics):* The equations are wrong for *this* specific state (e.g., dry soil bias). All runs (deterministic and ensemble) will likely agree but be wrong in the same direction.
      *   *Forcing Error (Weather):* The input rainfall is wrong. If the weather forecast changes drastically between runs or has low confidence, the hydro model output inherits that. Hard to separate from chaos without weather ensemble data, but can be inferred if hydro spread matches known weather uncertainty patterns.

  3.  **Drafting the Decision Procedure (The "30-Minute Protocol"):**
      *   *Goal:* Turn "gut feeling" into a checklist.
      *   *Time Allocation:* 5 mins (Data Check), 10 mins (Ensemble Analysis), 10 mins (Context/History), 5 mins (Decision/Handoff).
      *   *Step 1: The Sanity Check (Structural Error).* Before looking at spread, check if the model is known to fail in *this* specific condition (e.g., dry spell, snowmelt, saturated soil).
      *   *Step 2: The Spread Check (Chaos).* Look at the ensemble spread (min/max/percentiles) relative to the threshold.
      *   *Step 3: The Horizon Check (Chaos vs. Forcing).* Compare spread at 12h vs. 48h vs. 72h.
      *   *Step 4: The Weather Reality Check (Forcing).* Does the rainfall input look realistic compared to radar/nowcasting?
      *   *Step 5: The Decision Matrix.* Combine findings into a recommendation.
      *   *Handoff Point:* When the risk is ambiguous (Case B), the hydrologist recommends, the Manager decides on liability/policy.

  4.  **Refining the "Rules of Thumb":**
      *   Need specific metrics. "Spread" needs definition (e.g., 10th-90th percentile range).
      *   Need thresholds. If >20% of ensemble exceeds threshold, treat as risk.
      *   Need to address the "Structural Bias" explicitly. If history says "Dry Spell = Underestimate," apply a correction factor or flag it.

  5.  **Addressing the "Honesty" Requirement:**
      *   Must admit where arithmetic is just codified judgment.
      *   Must admit where the procedure fails (e.g., unprecedented events, model breakdown).

  6.  **Developing the Three Cases:**
      *   *Case (a):* 12h, tight ensemble, above threshold. Low chaos, low structural risk (short term). High confidence.
      *   *Case (b):* 48h, 50/50 split. High chaos. This is the critical one. The procedure must force a "Risk On" stance rather than "Hope."
      *   *Case (c):* 12h, tight ensemble, known historical bias (dry spell). Structural error. The model is confidently wrong.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the pressure.
      *   *The Protocol:* Break it down into minutes.
      *   *Failure Modes:* Define them clearly within the steps.
      *   *Limitations:* Be clear about what this doesn't solve.
      *   *Case Runs:* Apply the protocol strictly.
      *   *Formatting:* Ensure "Call:" and "Verdict:" are exact.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "look at the spread." I need to say *how*. E.g., "Calculate the percentage of members exceeding the threshold." For Case (b), the user's current default is "hope." The procedure needs to counteract that. If 50% exceed, that's a coin flip for a disaster. The recommendation should be to prepare/warn, not stand down.

      *(Refining Structural Error)*: How does the hydrologist know about the dry spell bias in 30 mins? They need a "Bias Log." I should include that as a prerequisite tool.

      *(Refining Forcing Error)*: Since they inherit weather forecasts, they need to check the weather confidence. If the weather forecast changed significantly in the last 2 cycles, that's forcing uncertainty.

  8.  **Final Review against Constraints:**
      *   30-minute procedure? Yes.
      *   Distinguish Chaos, Structural, Forcing? Yes.
      *   Plain language? Yes.
      *   Admit judgment vs. arithmetic? Yes.
      *   Three cases with "Call:"? Yes.
      *   Final "Verdict:"? Yes.

  9.  **Final Polish:** Check tone. It needs to sound like a senior colleague writing a memo, not a textbook. Empathetic to the "30 minutes" pressure.

      *(Case B specific thought)*: The prompt says "that's the one where the procedure has to give me an answer I won't like, because right now my default there is hope." This means the procedure must explicitly advise *against* standing down when the spread straddles the threshold at 48h. It must recommend precaution.

      *(Verdict thought)*: Needs to capture the stance for the next 72 hours across all cases. "Precautionary Principle" or "Trust but Verify"? Given Case C (structural bias) and Case B (chaos), "Defensive Posture" seems right.

  10. **Writing the Output.** (Proceeding to generate response based on these thoughts).

      *Wait, one detail:* "Case (c)... all runs agree -- and they all agree on something this exact model got badly wrong in the same situation two years ago." This implies the ensemble *also* inherits the structural bias because they perturb initial conditions, not model physics. I need to make sure the procedure highlights that ensemble spread does *not* capture structural error.

      *Okay, let's build the "Bias Log" into the procedure.*

      *Let's finalize the "Call" phrases.*
      (a) Evacuate/Warning.
      (b) Prepare/Watch (Not Stand Down).
      (c) Override/Adjust.

      *Let's finalize the "Verdict".*
      "Trust the spread, doubt the physics." Or "Ensemble for chaos, log for bias."
      Let's go with: "Ensemble for chaos, history for bias."

      *Wait, checking the prompt again:* "Verdict: ... capturing the overall stance I should take into the next 72 hours given all three cases."
      Okay, I need to synthesize the lessons from a, b, and c.
      a = Trust short term deterministic/ensemble.
      b = Respect uncertainty (don't hope).
      c = Respect history over model.
      Combined: "Calibrated Skepticism."

      *Let's write it.*
answer: |-
  **MEMORANDUM: 30-Minute Flood Decision Protocol**
  **TO:** Duty Hydrologist
  **SUBJECT:** Operationalizing Ensemble Data & Failure Modes

  You have 30 minutes. You cannot become a dynamical systems theorist, and you cannot fix the model physics. You can, however, stop treating the ensemble as a "nervousness check" and start treating it as a risk diagnostic.

  This procedure forces you to categorize uncertainty before you categorize risk. It separates what the model *can't* know (Chaos) from what the model *gets* wrong (Structure) and what the model *was told* (Forcing).

  ### The 30-Minute Protocol

  **Minutes 0–5: The Structural Sanity Check (Failure Source: Model Physics)**
  *   **Action:** Open the "Bias Log." This is a simple one-page history of known model failures (e.g., "Underestimates peak after >14 dry days," "Overestimates during rapid snowmelt").
  *   **Question:** Does the current basin state match a known bias condition?
  *   **Signal:** If yes, the deterministic line and the ensemble mean are *both* suspect. The spread will not help you here because all 50 runs share the same faulty physics.
  *   **Rule:** If a bias match is found, apply a mental correction factor (e.g., "Add 0.5m to all outputs") or flag for Manager override immediately.
  *   **Judgment Call:** This is not arithmetic; it is institutional memory. If the log is empty, you are flying blind on structural error.

  **Minutes 5–15: The Spread & Horizon Check (Failure Source: Chaos)**
  *   **Action:** Plot the 50 ensemble traces. Ignore the deterministic line for now.
  *   **Metric 1 (The Straddle):** Count how many runs exceed the action threshold.
      *   *<10%:* Low risk of threshold breach.
      *   *10–40%:* Moderate risk (Prepare).
      *   *>40%:* High risk (Warn/Evacuate).
  *   **Metric 2 (The Funnel):** Compare the spread (10th to 90th percentile) at 12 hours vs. 48 hours vs. 72 hours.
      *   *Signal:* If the spread is tight at 12h but explodes by 48h, this is **Chaos**. The initial conditions are decaying.
      *   *Signal:* If the spread is wide at 12h, the system is already highly sensitive (likely high flow/turbulence).
  *   **Rule:** Never stand down if >20% of runs exceed the threshold at 48 hours. "Hope" is not a mitigation strategy.

  **Minutes 15–20: The Input Reality Check (Failure Source: Weather Forcing)**
  *   **Action:** Compare the rainfall input used for *this* run vs. the run 6 hours ago.
  *   **Signal:** If the total forecast rainfall changed by >20% between cycles, the hydrological spread is secondary to the **Forcing Error**.
  *   **Rule:** If forcing is volatile, treat the hydro ensemble as unreliable regardless of spread. The weather model is the bottleneck.

  **Minutes 20–25: Synthesis & Recommendation**
  *   **Action:** Combine the three checks into one of four recommendations.
      1.  **Go:** High confidence, threshold exceeded, no bias flags.
      2.  **Watch:** Threshold not met, but spread widening or forcing volatile.
      3.  **Adjust:** Model output corrected for known structural bias.
      4.  **Handoff:** Ambiguous risk (e.g., 50/50 split at 48h) or high consequence/low probability.
  *   **Note:** The Handoff is not passing the buck; it is passing the *liability*.

  **Minutes 25–30: Briefing Prep**
  *   **Action:** Write the single number your bosses want, but attach the "Confidence Tag" (High/Med/Low) derived from the steps above.

  ---

  ### Where This Procedure Misfires
  1.  **Black Swans:** If the bias log doesn't record a specific physics failure, Step 1 will pass a broken model. You are relying on past failures to predict future ones.
  2.  **Correlated Errors:** The 50 runs perturb initial conditions, not physics. If the physics are wrong (Case C), the ensemble gives a false sense of precision.
  3.  **The 40% Rule:** The threshold for "High Risk" (>40% of runs) is arbitrary. It is judgment dressed as arithmetic. In a catastrophic basin, lower this to 20%. In a nuisance-flood basin, raise it.
  4.  **Weather Blindness:** You inherit the weather forecast. If the meteorologists are confidently wrong, your best hydro ensemble cannot save you.

  ---

  ### Case Runs

  **Case (a): 12-hour horizon, all 50 perturbed runs agree on peak level within a couple of centimeters, and the peak is above the evacuation threshold.**
  *   **Step 1 (Structure):** Check Bias Log. Assuming no specific short-term bias (e.g., sensor drift), the model physics are likely stable for this horizon.
  *   **Step 2 (Chaos):** Spread is negligible (couple of centimeters). Chaos is not a factor at 12 hours. 100% of runs exceed threshold.
  *   **Step 3 (Forcing):** 12-hour weather forecasts are generally high skill. Unless radar shows a sudden stall, forcing is stable.
  *   **Synthesis:** High confidence. The system is not sensitive to initial conditions yet, and the physics are holding.
  *   **Call:** Evacuate

  **Case (b): 48-hour horizon, the runs split roughly half above and half below the threshold, with no pattern I can see in which ones go which way.**
  *   **Step 1 (Structure):** Check Bias Log. Assuming no specific bias, proceed.
  *   **Step 2 (Chaos):** Spread is massive (straddling the threshold). 50% of runs exceed. This is pure Chaos (initial condition sensitivity). The "funnel" has widened significantly compared to the 12-hour mark.
  *   **Step 3 (Forcing):** 48-hour weather forecasts have lower skill. Volatility is expected.
  *   **Synthesis:** This is the "Hope" trap. A 50% chance of a flood is a 50% chance of a disaster. Standing down because "most looked fine" (or even because it's a coin flip) is negligence when lives are at stake. The protocol dictates that >40% exceedance at 48 hours triggers a "Watch" or "Warn," not a "Stand Down." You must hand this off because the risk is ambiguous but the consequence is high.
  *   **Call:** Handoff to Duty Manager

  **Case (c): 12-hour horizon, all runs agree -- and they all agree on something this exact model got badly wrong in the same situation two years ago, after a long dry spell.**
  *   **Step 1 (Structure):** Bias Log match: "Long dry spell = Underestimation." All 50 runs share the same physics, so they all make the same mistake. The tight ensemble is a lie; it measures consistency, not accuracy.
  *   **Step 2 (Chaos):** Chaos is low (tight spread), but irrelevant because the baseline is wrong.
  *   **Step 3 (Forcing):** Irrelevant. Even if rain is perfect, the runoff conversion is biased.
  *   **Synthesis:** Structural Error. You cannot trust the number. You must apply the historical correction (e.g., add the error margin from two years ago) or treat the output as a minimum bound. Since the model underestimates, the real level is likely above threshold.
  *   **Call:** Override Model (Warn)

  ---

  Verdict: Ensemble for chaos, history for bias.
