  1. "Preamble"

  You likely believe you know what a species is until a difficult case forces a choice between your intuitions. This quiz does not test knowledge; it tests consistency. We present ten concrete scenarios drawn from real biological controversies. There are no correct answers, only coherent patterns. Be warned: your responses may reveal that you are a splitter in some contexts and a lumper in others. This instability is the point. Answer based on what you would actually do in the lab or field, not what you think you should say. Your resulting profile may not match a single textbook definition.

  2. "The ten cases"

  1. Ring Species. A chain of populations circles a mountain range. Neighbors interbreed freely, but the terminal ends meet and cannot produce fertile offspring. Genetic flow connects the entire ring, yet the extremes behave as distinct biological units where they contact.
  A. Classify as one species because the chain is genetically connected.
  B. Classify as two species because the ends are reproductively isolated.
  C. Classify as multiple species based on where distinct traits emerge.

  2. Asexual Lineage. An ancient lineage reproduces only clonally. Individuals form a tight morphological cluster but exchange genes with no other group. They have persisted for millions of years without sexual recombination, maintaining stable distinctness despite the lack of genetic cohesion mechanisms typical of sexual populations.
  A. Classify as a species because they are distinct and stable.
  B. Refuse species status because they lack sexual cohesion.
  C. Classify as a species only if they occupy a unique ecological niche.

  3. Bacterial HGT. A bacterium routinely incorporates DNA from distantly related lineages, blurring genealogical lines. Different genes within the same organism suggest different evolutionary histories, making a single tree of life impossible to construct for this group despite clear phenotypic stability.
  A. Classify based on overall genetic similarity despite gene flow.
  B. Refuse species status because no clear lineage exists.
  C. Classify based on ecological function rather than ancestry.

  4. Hybridizing Oaks. Two populations exchange genes along a stable zone but remain distinct outside it without merging. Hybridization occurs frequently, yet selective pressures maintain distinct morphological forms across the landscape, preventing complete homogenization of the gene pool.
  A. Classify as one species because gene flow occurs.
  B. Classify as two species because distinct forms persist.
  C. Classify as one species with distinct varieties.

  5. Fossil Chronospecies. A fossil sequence grades continuously from one morphology to another over millions of years. There are no sharp breaks in the rock record, only a slow drift in shape and size that eventually results in a form unrecognizable from the ancestor.
  A. Divide into multiple species where morphology shifts significantly.
  B. Treat as one species because the change is continuous.
  C. Refuse species assignments because breeding cannot be tested.

  6. Cryptic Siblings. Two populations look identical but differ in mating song and never interbreed in nature. Genetic analysis confirms they have been separate for millions of years, despite retaining ancestral morphological characteristics that hide their divergence from human observers.
  A. Classify as two species because they are reproductively isolated.
  B. Classify as one species because they are morphologically identical.
  C. Classify as two species only if genetic data confirms divergence.

  7. Conservation Impact. Splitting a widespread organism into five species changes four from "least concern" to "endangered." The biological data supports the split, but recognizing them separately would strain limited conservation resources and potentially doom the newly listed entities.
  A. Split them because biological reality dictates the count.
  B. Keep them lumped to prevent losing conservation resources.
  C. Split them only if the distinctness is scientifically robust.

  8. Polyploid Plant. A plant population instantly becomes reproductively isolated from parents via chromosome doubling. They can grow alongside the parents but cannot exchange genes, forming a distinct reproductive community from the moment of origin without gradual morphological change.
  A. Classify as a new species immediately upon isolation.
  B. Wait until they form a stable ecological population.
  C. Classify as a variety until morphological divergence occurs.

  9. Allopatric Populations. Two populations are geographically separated but would likely interbreed if brought together. They show minor genetic differences due to drift, but no unique diagnostic traits have evolved during their separation in different mountain ranges.
  A. Classify as one species because isolation is accidental.
  B. Classify as two species because they evolve independently.
  C. Classify as subspecies until divergence is confirmed.

  10. Polymorphic Population. A single interbreeding population shows extreme morphological variation resembling distinct species. Some individuals look vastly different from others, yet they mate randomly and produce fertile offspring across all morphological forms within the same geographic area.
  A. Classify as one species because they interbreed freely.
  B. Classify as multiple species based on morphological clusters.
  C. Classify as one species with distinct morphs.

  3. "The scoring key"

  The logical space of this quiz is defined by three primary tensions: cohesion versus independence, diagnosis versus history, and realism versus utility. Your answers locate you within this multidimensional space rather than on a single linear scale. The first axis measures the weight you give to reproductive connection versus independent evolution. Questions one, four, and nine test this directly. The second axis measures reliance on observable traits versus genealogical history. Questions two, five, and six discriminate here. The third axis measures commitment to objective boundaries versus pragmatic utility, tested primarily in question seven.

  If you prioritized reproductive connection (Questions 1, 4, 6, 8, 9, 10), you hold an isolation-based view. You see species as communities of gene exchange, where barriers define boundaries. This view struggles with asexuals. If you prioritized distinct traits regardless of gene flow (Questions 2, 5, 10), you hold a diagnosability-based view. You see species as identifiable clusters, where character states define boundaries. This view struggles with polymorphism. If you prioritized exclusive ancestry (Questions 3, 5, 9), you hold a monophyly-based view. You see species as branches on a tree, where lineage splitting defines boundaries. This view struggles with hybridization.

  The evolutionary lineage view emerges if you treated independent fate as decisive (Questions 4, 9) even without full isolation. This view separates lineages based on their separate evolutionary trajectories, allowing for some gene flow. The ecological view appears if niche occupancy outweighed genetics (Questions 2, 3, 8). Here, species are adaptive zones, defined by function rather than form or genes. The phenetic cluster view groups by overall similarity (Questions 3, 10), ignoring history entirely. Finally, species nominalism appears if you refused assignments due to arbitrariness or utility (Questions 5, 7). This position denies that species are natural units at all, viewing them as human conveniences.

  Note that isolation-based and monophyly-based views often overlap but diverge on asexuals and hybrids. Diagnosability and phenetics overlap but diverge on cryptic species. Nominalism is distinct in rejecting the premise. Most respondents will not fit one leaf perfectly. This is expected. The concepts are tools, not truths. Your inconsistency reflects the complexity of biological reality, not a failure of reasoning. The positions are idealized poles; your actual view is a vector in this multi-dimensional space. Do not seek a perfect match. Seek the tension that bothers you most. That tension defines your operational philosophy. The quiz reveals not what you are, but how you decide when criteria conflict. Real biologists operate in the overlaps.

  4. "Unoccupied combinations"

  Certain answer patterns are logically uninhabited because they violate the internal coherence of any recognized position. For example, demanding strict monophyly in the bacterial case (Question 3B) while accepting a paraphyletic chronospecies in the fossil case (Question 5B) is inconsistent. One cannot require exclusive ancestry for microbes but accept ancestral grades for fossils without abandoning the historical criterion entirely. Similarly, demanding reproductive isolation for the ring species (Question 1B) while accepting the asexual lineage as a species without niche differentiation (Question 2A) creates a contradiction regarding the necessity of cohesion mechanisms.

  Nobody stands in these empty zones because they represent theoretical instability rather than distinct philosophical stances. To occupy them would require holding two mutually exclusive definitions of species simultaneously without acknowledging the conflict. These combinations usually indicate a respondent answering impulsively rather than according to a principled view. They reveal where intuition overrides theory, but they do not constitute a stable position in the logical space. They are artifacts of the quiz, not maps of the terrain.

  5. "What this quiz cannot sort"

  This quiz cannot distinguish between viewing species as natural kinds versus viewing them as individuals with spatiotemporal extension. Both metaphysical stances can employ the same operational criteria for drawing boundaries. A realist about individuals (Ghiselin/Hull) and a realist about kinds might both prioritize reproductive isolation in practice. This question runs orthogonal to the diagnostic cases provided here. The quiz tests operational thresholds, not metaphysical commitments. You can answer every question consistently while remaining agnostic about whether species are discovered or constructed. That deeper debate requires different tools.
