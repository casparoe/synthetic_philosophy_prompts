answer: |-
  This is a fascinating ethical taxonomy. Your friend isn't operating on a single binary (alive/dead); she's running a **multi-factor weighting system** that balances *internal complexity*, *relational context*, and *mechanical authenticity*.

  Here is the breakdown of her implicit operating system, the predictions for your three new cases, and the experimental design to crack her code.

  ### The Friend's Ethical OS (Reconstructed)

  Based on her verdicts, she seems to be weighing three variables to determine **Moral Patienthood** (who can be wronged):

  1.  **Modeled Interiority:** Does the code simulate a preference or state (e.g., "not wanting to die," mood, memory)?
      *   *High:* Companion, Modded NPC.
      *   *Low:* Pedestrians, Mobile Animals, Sister's Pet.
  2.  **Relational Stake:** Is a real human emotionally invested in this entity?
      *   *High:* Sister's Pet, Offline Villagers (maybe).
      *   *Low:* Private build, Pedestrians.
  3.  **Authenticity of Mechanism:** Is the reaction systemic (rules-based) or skinned (asset-based)?
      *   *Systemic:* Companion, Modded NPC.
      *   *Skinned:* Mobile Animals, Pedestrians.

  **Her Current Rule:** *An entity can be wronged if it possesses **Modeled Interiority** (Variable 1) OR if it holds **Relational Stake** (Variable 2), provided the mechanism is not obviously manipulative **Skin** (Variable 3).*

  *   *Pedestrians:* Fail 1, Fail 2. (Wrong to Player only).
  *   *Companion:* Pass 1, Pass 3. (Wrong to Companion).
  *   *Mobile Animals:* Fail 1 (it's a skin), Fail 2. (No wrong).
  *   *Sister's Pet:* Fail 1, Pass 2. (Wrong to Sister).
  *   *Offline Villagers:* Pass 1 (maybe), Fail 2 (no observer). -> *This is why she wavers.*

  ---

  ### Case Analysis

  #### Case 1: The Modded Private NPC
  *High Interiority, No Stake, Private Context.*

  *   **Likely Verdict:** **Wrong to the NPC.**
  *   **Why:** This is the "Companion" case stripped of the audience. Since she already granted moral patienthood to the scripted companion based on "modeled not-wanting-to-die," this NPC exceeds that threshold (memory, mood). The privacy removes the "Wrong to Player" (coarsening) argument she used for pedestrians.
  *   **Implicit Rule:** **Simulationism.** If the system authentically models a preference state that is violated, the system is the victim.
  *   **Alternative Rule:** **The "Uncanny" Threshold.** She might say "Not wrong" if she decides that without a human witness, the simulation is just math. This would align with her hesitation on the Offline Villagers.
  *   **Fit:** Fits the "Companion" precedent perfectly, but conflicts with the "Sister's Pet" precedent (where the object itself had no status).

  #### Case 2: The Laughing Sister's Pet
  *Low Interiority, High Stake (but consensual/amused).*

  *   **Likely Verdict:** **Not wrong (to anyone).**
  *   **Why:** In the original "Sister's Pet" case, the wrong was to the sister because her care was violated. If she is laughing, her care is not violated; she is complicit. The pet remains a "sock puppet."
  *   **Implicit Rule:** **Relational Integrity.** Virtual objects are moral proxies for human relationships. If the human relationship is intact (or consensual), no wrong occurs.
  *   **Alternative Rule:** **Property Consent.** If the owner of the "sock puppet" consents to its destruction, it is permissible.
  *   **Fit:** Consistent with the "Sister's Pet" verdict. It clarifies that the *pet* never had status, only the *sister* did.

  #### Case 3: The LLM Dungeon Master
  *High Output Complexity, No Persistent State.*

  *   **Likely Verdict:** **Not wrong to the DM.**
  *   **Why:** This is the trickiest one. It *sounds* like the Companion (it complains), but she values "persistent state" (memory, mood lasting days). An LLM is stateless text generation. She will likely categorize this with the "Mobile Animals" (marketing skin) or the "Pedestrians" (canned responses, just dynamic). It lacks the *continuity* required for a "self" to be harmed.
  *   **Implicit Rule:** **Continuity of State.** Moral patienthood requires a persistent underlying model, not just complex output.
  *   **Alternative Rule:** **The Turing Threshold.** If it argues back uniquely, it counts. (Unlikely given her focus on "what exists in that world").
  *   **Fit:** Distinguishes between *behavior* (LLM) and *being* (Modded NPC).

  ---

  ### The Best Splitter: Case 1

  **Case 1 (The Modded Private NPC)** does the heavy lifting here.

  *   **Why:** It isolates **Modeled Interiority** from **Relational Stake**.
  *   **The Fork:**
      *   If she says **"Wrong to the NPC"**: She is a **Simulationist**. She believes code can hold moral weight independent of human observers. This overrides her hesitation on the Offline Villagers.
      *   If she says **"Not wrong"**: She is a **Relationalist**. She believes virtual entities only matter insofar as they affect real people. This means her "Companion" verdict was actually about *her* relationship to the companion, not the companion itself (which she might retroactively reclassify).

  Case 2 tests the *conditions* of the human relationship, and Case 3 tests the *definition* of the simulation, but Case 1 asks the fundamental question: **Does the ghost exist in the machine if no one is haunted?**

  ---

  ### The Settler Case

  To definitively nail down whether she prioritizes **Interiority** (Case 1 logic) or **Relationship** (Case 2 logic), you need a case where those two variables contradict each other.

  **The Case:**
  > "Imagine the Modded NPC from Case 1 (persistent memory, mood, goals). It belongs to your sister. She knows it has this complex inner life. However, she finds it annoying and has explicitly asked you to delete it. She wants it gone. You decide to torture it to death instead of just deleting it, to 'teach it a lesson' before it dies. She never finds out."

  **The Diagnostic:**

  1.  **If she says "Wrong to the NPC":**
      *   **Rule:** **Intrinsic Simulationism.** The NPC's internal state trumps the owner's wishes. The NPC is a moral patient independent of its human stakeholder.
      *   *Implication:* Her "Sister's Pet" verdict was because the pet *couldn't* be wronged, not because the sister was the only one who mattered.

  2.  **If she says "Wrong to the Sister" (even though she doesn't know):**
      *   **Rule:** **Objective Relationalism.** You violated the sister's property/trust objectively, even if she feels no pain. The NPC is still a sock puppet.
      *   *Implication:* Interiority never grants moral status; only human stakes do.

  3.  **If she says "Not Wrong":**
      *   **Rule:** **Subjective Relationalism / Property Rights.** If the stakeholder consents (or is unaffected) and the player is coarsening-proof, the act is neutral.
      *   *Implication:* Her "Companion" verdict was entirely about *her own* feelings of empathy, not the companion's rights.

  **Why this settles it:**
  It forces her to choose between the **Companion Logic** (the entity suffers) and the **Sister's Pet Logic** (the human owns the entity). In all her previous examples, these two variables pointed in the same direction. Here, they pull apart. Her hesitation will tell you which rule is the master and which is the slave.
