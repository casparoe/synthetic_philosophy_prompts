                      *   So: Remove M (Row) -> Remove C (Col) -> 2x2 game (T/B vs L/R).
                      *   T vs L: Row 4, Col 2.
                      *   T vs R: Row 4, Col 1.
                      *   B vs L: Row 0, Col 1.
                      *   B vs R: Row 0, Col 2.
                      *   Now Row: T (4,4) vs B (0,0). T dominates B.
