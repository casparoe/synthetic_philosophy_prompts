              *   L: 2, 0, 1 (vs T, M, B)
              *   C: 0, 2, 0
              *   R: 1, 0, 2
          *   *Check Row Dominance:*
              *   M (1,1,1) vs T (4,0,4). T better in 1,3. M better in 2. No pure dominance.
              *   M (1,1,1) vs B (0,4,0). B better in 2. M better in 1,3. No pure dominance.
              *   M (1,1,1) vs 0.5T + 0.5B (2, 2, 2). Mix strictly dominates M.
          *   *Check Iteration:*
              *   Remove M.
              *   Reduced Col Payoffs (vs T, B):
                  *   L: 2, 1
                  *   C: 0, 0
                  *   R: 1, 2
              *   L strictly dominates C (2>0, 1>0). Remove C.
