answer: |-
  Here is a complete lesson plan designed to force the "mixed strategy dominance" realization through guided failure.

  ### **Lesson Overview**
  *   **Topic:** Iterated Elimination of Strictly Dominated Strategies (IESDS) with Mixed Strategies.
  *   **Time:** 75 minutes.
  *   **Class Size:** 25 students (12 pairs, 1 trio).
  *   **Prerequisites:** Pure strategy dominance, expected value calculation.
  *   **Incentives:** Top 3 total scores receive a $10 coffee card (or 5 bonus points on the next midterm). This is high enough to care, low enough to avoid panic.

  ---

  ### **1. The Game Matrix**
  Print this on the board and on handouts. Row Player chooses the row; Column Player chooses the column. First number is Row's payoff, second is Column's.

  | | **Col: Left (L)** | **Col: Center (C)** | **Col: Right (R)** |
  | :--- | :---: | :---: | :---: |
  | **Row: Top (T)** | 4, 2 | 0, 0 | 4, 1 |
  | **Row: Middle (M)** | 1, 0 | **1, 2** | 1, 0 |
  | **Row: Bottom (B)** | 0, 1 | 4, 0 | 0, 2 |

  **Instructor Key (Do Not Distribute):**
  1.  **Pure Strategy Check:**
      *   Row: M is not dominated by T (0 < 1 in Col C). M is not dominated by B (0 < 1 in Col L/R).
      *   Col: No strategy is initially dominated.
  2.  **Mixed Strategy Check:**
      *   Row: A 50/50 mix of T and B yields expected payoffs of **(2, 2, 2)** against L, C, and R.
      *   Since 2 > 1 in all columns, the mix **strictly dominates M**.
  3.  **Solvability after Deletion:**
      *   Remove M.
      *   Col now faces only T and B.
      *   Col Payoffs vs {T, B}: L gives (2, 1). C gives (0, 0). R gives (1, 2).
      *   **L strictly dominates C** for Column (2>0 and 1>0). Remove C.
      *   Row now faces only L and R.
      *   Row Payoffs vs {L, R}: T gives (4, 4). B gives (0, 0).
      *   **T strictly dominates B**. Remove B.
      *   **Solution:** (Top, Left).

  ---

  ### **2. Activity Structure & Timing**

  #### **Phase 1: The Wall (Pure Strategies Only)**
  *   **Time:** 20 Minutes.
  *   **Setup:** Pair students up. Assign one Row, one Column. Hand out score sheets.
  *   **Rules:**
      1.  You will play 10 rounds.
      2.  You must choose a **single pure strategy** (T, M, or B) each round.
      3.  Record your choice, opponent's choice, and your points.
      4.  Between rounds, you may change your strategy.
  *   **Instructor Script:** *"Play to maximize your points. You know the drill from last week. Look for dominated strategies and eliminate them. I want to see your elimination logic on the back of your score sheet."*
  *   **Expected Outcome:** Students will try to eliminate M. They will fail. They will argue that M is "safe" because it guarantees 1 point, whereas T and B risk 0. Most will stick with M or cycle randomly. The game will not solve.

  #### **Phase 2: The Loophole (Allowing Mixtures)**
  *   **Time:** 25 Minutes.
  *   **Setup:** Keep pairs. Distribute coins or 6-sided dice.
  *   **Rules:**
      1.  You will play 15 more rounds.
      2.  **New Rule:** You are now allowed to commit to a **randomized plan** before the round.
      3.  Example: "I will flip a coin. Heads = Top, Tails = Bottom."
      4.  You must record your *plan* (e.g., "50% T, 50% B") on the score sheet, then execute the randomizer, then record the *actual* move played.
  *   **Instructor Script:** *"In the real world, you aren't always forced to be predictable. If you want to use a coin or die to decide your move between rounds, you are allowed to. Your score is still based on the actual move that lands, but I want to see if planning a mixture helps you beat the 'safe' option."*
  *   **Expected Outcome:** High-performing students will notice M yields 1 point. They will try mixing T and B. The math says they should average 2 points. Variance will occur, but over 15 rounds, the mixers should pull ahead of the M-players.

  #### **Phase 3: The Debrief (Formalization)**
  *   **Time:** 30 Minutes.
  *   **Activity:** Collect score sheets. Project the matrix.
  *   **Discussion:** See "Debrief Script" below.

  ---

  ### **3. Instructor Script & Management**

  **What to Say:**
  *   **Start of Phase 1:** *"Apply what you learned last week. If a strategy is never a best response, cross it out. If you get stuck, stay stuck. Don't ask me for hints."*
  *   **Start of Phase 2:** *"I am relaxing the rules. You can now use a randomizing device. You are still rational agents maximizing expected points."*
  *   **During Play:** Walk around. If a pair solves it early, tell them: *"Don't tell the class. Write down exactly why it worked on a separate paper. I'll collect it."*
  *   **End of Phase 2:** *"Look at the average score of students who played Middle every time versus students who mixed Top and Bottom. Who made more points?"*

  **What NOT to Say:**
  *   Do not use the word "convex combination."
  *   Do not mention "Nash Equilibrium" (save for next week).
  *   Do not confirm if M is dominated during Phase 1. If asked, say: *"Check the definition. Is there a single strategy that beats it in every column?"*

  ---

  ### **4. The Debrief: Mapping Activity to Theory**

  **Step 1: The Definition Gap (10 mins)**
  Draw the definition of Strict Dominance on the board:
  *   *Strategy $s_i$ is strictly dominated if there exists another strategy $s'_i$ such that $u_i(s'_i, s_{-i}) > u_i(s_i, s_{-i})$ for all $s_{-i}$.*
  Ask: *"Did Top beat Middle in every column?"* (No, Col C). *"Did Bottom beat Middle in every column?"* (No, Col L/R).
  *"So by the definition we used last week, Middle survives. But the data shows Middle loses money. Why?"*
  Elicit the answer: We restricted $s'_i$ to be a **pure** strategy.
  **Formal Update:** Write the new definition. $s'_i$ can be a **probability distribution** over pure strategies.
  Show the math: $0.5(4) + 0.5(0) = 2$. Since $2 > 1$, M is dominated.

  **Step 2: The Iteration Restart (10 mins)**
  Ask: *"Once we delete Middle, what happens to Column?"*
  Walk through the reduction.
  *   *"Why did we have to stop and check Column again? Why couldn't we just keep deleting Row strategies?"*
  **Key Point:** Dominance depends on what the *opponent* is playing. When you delete M, you change the set of strategies Column might play. A strategy that was safe against M (like Col C) might be terrible against {T, B}.
  **Rule:** IESDS requires you to **restart the search** for dominated strategies for *both* players after every deletion.

  **Step 3: Risk Neutrality (5 mins)**
  Address the variance.
  *"Some of you mixed T and B and still scored lower than the Middle player in Phase 2. Does that mean the theory is wrong?"*
  **Key Point:** Game theory assumes **risk neutrality** in this context. We maximize *expected* payoff, not guaranteed minimum payoff. M guarantees 1. The mix guarantees an *average* of 2. Over one round, luck matters. Over a career (or 100 rounds), the math wins.

  ---

  ### **5. Predictable Failure Modes & Mitigations**

  **1. The "Loud Kid" Problem**
  *   **Risk:** A student who read the textbook or took a friend's class shouts, "Just mix Top and Bottom!" in minute 5 of Phase 1.
  *   **Mitigation:** Pre-empt this in the Phase 1 instructions. *"If you announce strategies to the room, you are disqualified from the prize."*
  *   **Pivot:** If they shout it anyway, turn it into a challenge. *"Okay, prove it. Play that mix for the next 10 rounds. If your average isn't higher than the Middle players, you lose the bonus points."* This forces them to rely on the data, not just authority.

  **2. Variance Hiding the Signal**
  *   **Risk:** In a 15-round phase, a student mixing T/B might get unlucky (rolling Bottom 10 times) and score 0, while the "safe" Middle player scores 15. They will conclude mixing is bad.
  *   **Mitigation:**
      *   Ensure you have enough pairs (25 students = 12 data points per strategy is usually enough to show the trend).
      *   In the debrief, aggregate the class data on the board. *"Group A averaged 1.1 points. Group B (mixers) averaged 1.9 points."*
      *   Explicitly state: *"We are looking at class aggregates, not individual luck."*

  **3. Cognitive Load on Column**
  *   **Risk:** Row figures out the mix, but Column gets confused because their payoffs change when M is removed. They might keep playing C out of habit.
  *   **Mitigation:** In Phase 2, tell Column players: *"Watch your opponent. If they stop playing Middle, you should re-evaluate your best response."* This hints at the iterative nature without giving away the solution.

  ---

  ### **6. Limitations: What This Activity Cannot Do**

  Be honest with yourself about where the lecture must take over.

  1.  **It does not prove Rationalizability:** The activity shows *you* can delete M. It does not prove that *Column knows that you know* to delete M. The common knowledge of rationality assumption is heavy lifting that the game glosses over. You must explain in the debrief that IESDS only works if both players are rational *and* know the other is rational.
  2.  **It assumes Risk Neutrality:** Undergrads often conflate "maximizing points" with "avoiding zero." If a student prefers the guaranteed 1 point (Middle) over the risky 2-point average (Mix), they are being risk-averse, not irrational. The activity treats risk aversion as a mistake. You must clarify in the debrief that standard IESDS assumes utility is linear in payoffs.
  3.  **It doesn't show "Why Mix?":** The activity shows mixing dominates a pure strategy. It does not explain why a player would ever *actually* randomize in equilibrium (which is about making the opponent indifferent). That is for the Nash Equilibrium lecture next week. Do not try to bridge that gap yet; you will confuse them.

  ---

  ### **7. Materials Checklist**

  *   **Score Sheets:** Columns for [Round #, Plan (e.g., 50/50), Die Roll/Result, Opponent Move, Payoff].
  *   **Randomizers:** 13 Coins or 6-sided dice (one per pair).
  *   **Board Space:** Pre-draw the 3x3 matrix on the left side of the board. Leave the right side blank for the reduction steps during the debrief.
  *   **Prizes:** 3 Coffee Cards ($10 each) or equivalent.

  ### **American English Style Check**
  *   Ensure all handouts use **program** (not programme), **center** (not centre), **defense** (not defence), **modeling** (not modelling), and **analyze** (not analyse).
  *   Use **z** in **realize** and **maximize**.
  *   Refer to the course as **Math** or **Econ**, not **Maths** or **Econs**.
  *   Use **faculty** or **instructor**, not **lecturer**.
  *   Ensure dates are formatted **Month Day, Year** (e.g., September 5, 2024).
