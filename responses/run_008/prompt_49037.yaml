prompt: |-
  So I've been going down a free will rabbit hole lately, no background in this stuff at all, just thinking about it on my own during commutes. My friend listened to some philosophy podcast about it and gave me his takeaway, and I want to know if he's representing the guy fairly before I keep building on it. It's about the British philosopher Galen Strawson and something called the Basic Argument. Here's how my friend put it:

  "Strawson proved nobody is responsible for anything. The argument is that you can't be responsible for what you do unless you're responsible for how you are. But you're not responsible for how you are, because you got your genes and your upbringing without any say in the matter. And even if you later try to remake yourself, you're doing the remaking with the personality you already had, so it just goes in a circle forever. So nobody deserves punishment or credit for anything. Which means we should basically stop blaming people altogether and treat criminals more like sick people. He also says quantum randomness doesn't help, because doing something random isn't the same as doing something freely."

  Some of this tracks with the little I've pieced together but a few things bug me. Like, is the argument really that nobody is responsible for ANYTHING, or is there some more careful version where it's about a stronger kind of responsibility? My friend says it like it settles everything, but then he also draws this practical conclusion about how we should treat criminals, and I can't tell if that's Strawson talking or my friend improvising. Also is the circle thing (the part about remaking yourself) actually part of the argument, or is that my friend's own spin? Can you go through his summary and tell me which parts a defender of the argument would nod along to, which parts are subtly off, and whether the stuff at the end about blame and punishment actually follows from whatever parts are right? And if parts are off, what would the corrected version of those claims be? I'd rather not keep repeating my friend's version if it's wrong, its already gotten me into two arguments at work.
