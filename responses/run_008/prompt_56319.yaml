  ### The two positions, stated fairly

  The classical position holds that rationality evaluates actions within a fixed causal structure. In a genuine one-shot Prisoner's Dilemma, moves are causally independent; my choice cannot influence yours. Therefore, defection strictly dominates cooperation regardless of the opponent's move. Any apparent cooperation smuggles in repetition, reputation, altruism, or external enforcement. Transparency proponents change the subject: by allowing source code inspection, you introduce informational or causal links that transform the game into something else, perhaps a coordination game. Rationality requires maximizing utility given the constraints, not wishing the constraints away. The game matrix is the law; rationality is the optimization within it. To claim cooperation is rational here is to redefine the payoff structure or the available moves, rendering the conclusion trivial. The classicalist insists that if the game is truly a PD, defection is the only coherent answer.

  The transparency position holds that rationality evaluates decision algorithms across possible instantiations. If agents are similar and code is visible, outputs are logically correlated; choosing cooperation implies the other cooperates. Treating opacity as fixed arbitrarily restricts the agent's design space to suboptimal forms. Rationality demands exploiting logical correlations, not just causal ones. The classical view mistakes engineering constraints for laws of nature. True rationality selects the algorithm that yields the best outcome, even if that requires rejecting the dominance principle in favor of logical dependence. The game is not fixed; the agent's architecture is the variable. Opacity is a contingent feature of physical implementation, not a fundamental constraint on rational agency. Hofstadter's superrationality anticipated this: identical reasoners should reach identical conclusions.

  ### Diagnosis

  Your hypothesis is insightful but incomplete. You correctly identify a methodological divergence: classicalists fix the game and optimize the move; transparency proponents fix the agent design and optimize across games. However, characterizing this as merely a disagreement about "what may be held fixed" or a verbal dispute underestimates the substantive formal conflict underneath. This is not just sociological; it is a clash between Causal Decision Theory (CDT) and Functional Decision Theory (FDT).

  The impasse persists because each side rejects the other's counterfactuals as illegitimate. The classical side argues that logical correlation is not causation; saying "if I cooperated, they would cooperate" is a false counterfactual because my action does not *cause* theirs. The transparency side argues that ignoring logical dependence leaves utility on the table; in transparent settings, CDT agents are money-pumped by FDT agents. Thus, it is not merely verbal—they disagree on who wins money. A verbal dispute would allow both to be right in their own lexicon; here, they disagree on empirical outcomes in transparent scenarios.

  Furthermore, the "fixed point" argument is itself contested. Classicalists argue opacity is inherent to the definition of a "move" in standard game theory; transparency proponents argue opacity is a contingent feature of physical implementation. Because neither side accepts the other's metaphysics of action, they talk past each other. Your hypothesis captures the surface structure, but the deep structure is a dispute over which mathematical model of counterfactuals governs rational choice. The hidden formal question is: "Which counterfactuals are valid for decision making?" Until there is consensus on whether logical dependence counts as a valid channel for influence, the "fixed" argument will remain a proxy for this deeper formal disagreement. They are answering different questions, but both claim theirs is the only valid definition of rationality. This makes the dispute substantive, not just verbal, because it dictates different behaviors in overlapping domains. The classical side sees the transparency side as confused about causality; the transparency side sees the classical side as confused about computation. This is akin to the Newcomb Problem debate: is the box already filled, or does your choice determine the filling? The core formal question is about the object of choice: is it the atomic action or the decision function? Classical theory treats actions as primitives; transparency theory treats functions as primitives. This changes the topology of the decision space. Consequently, your hypothesis that it is about 'what is held fixed' is correct as a description of their rhetoric, but incorrect as a diagnosis of the barrier. The barrier is not that they choose different fixed points, but that they disagree on which fixed points are *permissible* given the nature of reality. One side sees the causal graph as reality; the other sees the computational graph as reality. This is a metaphysical dispute disguised as a methodological one. Therefore, the disagreement is substantive. It is not simply that they are using 'rational' differently; it is that they have incompatible models of how choices map to outcomes. Resolving this requires more than terminological clarity; it requires adjudicating between competing ontologies of agency. If the disagreement were merely verbal, we could translate one into the other without loss. But because they prescribe different actions in the same transparent setup, translation fails. The classicalist says 'Defect' is rational; the transparency proponent says 'Cooperate' is rational. They cannot both be right about the action. Thus, your hypothesis that it might be merely verbal is weakened by the practical divergence. The 'hidden formal question' is indeed about counterfactuals, but specifically about whether logical implication substitutes for causal influence in utility maximization. This is a hard formal problem, not just a semantic one.

  ### What would count as progress

  Progress requires abandoning the monolithic term "rational." We should formally distinguish *act-rationality* (optimal move given a fixed causal graph) from *source-rationality* (optimal algorithm given a distribution of logical correlations). This terminological shift acknowledges both positions without forcing synthesis. It clarifies that classicalists defend act-rationality while transparency proponents defend source-rationality. This prevents the cycling by forcing speakers to specify which property they are optimizing.

  Formally, progress depends on resolving logical counterfactuals. Researchers must demonstrate rigorous conditions under which "if my source code outputted C" is a well-defined statement without contradiction. Recent work in logical induction and program equilibrium (e.g., LaVictoire et al.) offers tools, but a unified framework is needed. Empirically, deploying transparent AI agents in high-stakes tournaments could settle practical utility. If FDT agents consistently outearn CDT agents in transparent environments, the pragmatic burden shifts to classicalists to explain why "rationality" should ignore winning. Finally, clarifying the physical conditions required for transparency (is it computationally feasible?) would determine if the transparency camp is discussing engineering or physics. Distinguishing normative claims from descriptive capabilities is also key. We need a taxonomy of games where causal independence holds versus where logical dependence holds. This maps the boundary conditions of each theory. A change of question from 'What should I do?' to 'What should I have been built to do?' dissolves the contradiction. This reframes the PD not as a puzzle of action, but as a puzzle of design.

  ### An honest coda

  Yes, the cycling will continue indefinitely. This debate touches on foundational questions about free will, causation, and the definition of agency. Without a paradigm shift in decision theory or decisive empirical dominance by transparent agents, partisans will continue to view the other's framework as category-erroring. The disagreement is feature, not bug.
