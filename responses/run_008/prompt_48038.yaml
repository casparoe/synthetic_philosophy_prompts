answer: |-
  Dear friend, you have stumbled onto one of the most elegant traps in probability theory, and your quant friend is right to be proud of the setup because he has successfully bypassed the usual sloppy errors that plague the two-envelope paradox. He is correct that the arithmetic holds up at every local step, and he is correct that the contradiction is real, but his conclusion that expected value reasoning is generally incoherent is too broad a verdict for a crime committed only at the limits of infinity. The step that fails is step three, the inference that because the conditional expected gain is positive for every observed amount, the unconditional expected gain must be positive. This inference relies on a theorem called the law of total expectation, which guarantees that you can sum up conditional expectations to get the total expectation, but that theorem has a hidden requirement that your friend's setup violates: the expected value of the money in the envelope must be finite. In this specific puzzle, the expected value is infinite, and once you allow infinity into the arithmetic, the standard rules of addition and subtraction break down in ways that look like paradoxes but are actually just warnings that you have left the domain where expected value is well-defined.

  To see why the expected value is infinite, you have to look at the tail of the distribution your friend constructed. He stipulated that the pair of envelopes contains amounts based on powers of two, specifically the pair two to the n and two to the n-plus-one, chosen with a probability proportional to three-quarters to the n. While the probability of seeing larger and larger amounts decreases exponentially, the amounts themselves increase exponentially, and crucially, they increase faster than the probability decreases. The probability term shrinks by a factor of four for every three steps, roughly speaking, while the money grows by a factor of two every step. When you multiply the probability of a pair by the amount of money in it to get the contribution to the expected value, you are multiplying a term that decays like three-quarters to the n by a term that grows like two to the n. The result is a term that grows like one-and-a-half to the n. When you sum these contributions over all possible n from zero to infinity, you are adding up an infinite series of growing positive numbers, which diverges to infinity. This means the average amount of money in an envelope is not a large number; it is undefined, or infinite, and this is the engine that drives the paradox.

  The reason this infinite expectation breaks step three is that it allows the order in which you sum the gains to change the result, much like how you can rearrange the terms of certain infinite series to make them sum to any number you like. Your friend calculates the expected gain by grouping outcomes based on what you see in your envelope. He observes that for every specific amount x, the conditional math says you expect to gain x-over-seven. Since x is always positive, every term in this sum is positive, so when you add them all up, the total expected gain looks like positive infinity. However, the symmetry argument your friend mentions in step four groups the outcomes differently, based on which pair of envelopes was originally chosen. In any specific pair, say the one containing two-to-the-n and two-to-the-n-plus-one, there is a fifty percent chance you hold the smaller one and switch to gain two-to-the-n, and a fifty percent chance you hold the larger one and switch to lose two-to-the-n. Within every single pair, the expected gain is exactly zero. If you sum up zeros over all the pairs, the total expected gain is zero. So, depending on whether you group the possibilities by the observed value or by the underlying pair, you get a total expected gain of infinity or zero. In standard mathematics, this contradiction tells us that the expected value of the gain does not exist as a finite number, not that logic itself is broken.

  This resolves the question of how positive conditional gains can add up to nothing. They do not add up to nothing in your friend's calculation; they add up to infinity. But the negative gains, which are hidden inside the conditional probabilities, also add up to negative infinity when grouped by the underlying pairs. You are effectively facing a situation where you have positive infinity minus positive infinity, which is an undefined operation. The symmetry argument is intuitively compelling because the physical setup is symmetric, implying that no strategy should beat another, but the expected value formula is too blunt an instrument to capture that symmetry when the tails of the distribution are so heavy. The conditional calculation feels persuasive because it looks at every finite scenario and says switching is good there, but it ignores the fact that the weight of the scenarios where you lose big is exactly balanced by the scenarios where you win big, provided you account for them in the right order. The paradox arises because the infinite tail allows the positive contributions to outweigh the negative ones if you sum them one way, while they cancel out perfectly if you sum them another way.

  Rejecting step three does not cost us the utility of expected value in general situations; it only costs us the ability to use it in cases involving infinite utilities or probabilities that decay too slowly relative to the payoffs. In almost all real-world situations, there is a maximum amount of money possible, even if it is astronomically large. If you impose a cap on the money, say the envelopes cannot contain more than a trillion dollars, the infinite tail is cut off. In that finite case, the probability distribution must adjust at the top end, meaning that if you open an envelope and see the maximum possible amount, you know for certain that the other envelope contains less, not more. This boundary condition breaks the chain of conditional probabilities that allowed your friend to claim a three-sevenths versus four-sevenths split for every single x. Once that chain is broken at the top, the conditional expected gain becomes negative for the highest values, and when you sum everything up, the total expected gain returns to zero, aligning perfectly with the symmetry argument. The paradox only exists in the idealized mathematical limit where the money can grow without bound.

  So you can tell your friend that he has not disproven expected value theory, but rather demonstrated its boundary conditions. Expected value is a tool designed for integrable functions, and his distribution is not integrable. The step that failed was treating an undefined quantity as if it were a positive number. The lesson for your readers is not that rational decision-making is incoherent, but that our intuitions about averaging break down when we deal with infinities, and that symmetry arguments often hold more robustly than calculation when the calculations involve divergent series. You can safely write that expected value reasoning is sound, provided one checks that the expectations are actually finite, and in this puzzle, the heavy tail is the culprit that makes the expectation blow up, allowing the conditional gains to appear positive everywhere while the global gain remains undefined. The mystery is not in the logic of switching, but in the behavior of infinite sums, and resolving it requires acknowledging that some questions simply do not have a numerical answer in the standard framework.
