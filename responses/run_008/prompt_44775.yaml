  **Title:** The Prophecy and the Prohibition: Popper vs. Fukuyama at the End of History

  **Introduction: The Duel That Wasn't**

  In the annals of post-Cold War intellectual history, few moments are as iconic as Francis Fukuyama's 1989 declaration of the "End of History." Fewer still are as philosophically loaded. Fukuyama's thesis—that liberal democracy and market economics represent the terminal point of humanity's ideological evolution—was explicitly Hegelian, filtered through the Marxist-turned-Hegelian Alexandre Kojève. It was a claim about the destiny of the human spirit.

  Thirty-five years prior, Karl Popper had laid a trap for precisely this kind of thinking. In *The Poverty of Historicism* (1944/1957) and *The Open Society and Its Enemies* (1945), Popper argued that "historicism"—the belief that history follows immutable laws toward a predetermined end—was not only scientifically false but politically dangerous. He named Hegel as one of the chief enemies of the "Open Society."

  Yet, when Fukuyama published *The End of History and the Last Man* in 1992, the expected confrontation never fully materialized. Fukuyama cited Popper, attempting to inoculate himself against the charge of historicism. But viewed through the rearview mirror of the 21st century, the episode looks less like a reconciliation and more like a staged duel between a Popperian prohibition and a revival of the very tradition Popper sought to bury.

  To understand the last three decades of geopolitical turbulence, we must subject the "End of History" episode to a strict Popperian audit. Does Fukuyama's thesis violate Popper's epistemic boundaries? Did the belief in the thesis alter the history it predicted? And finally, does the survival of liberal democracy vindicate Fukuyama's directionality, or does it expose a blind spot in Popper's own defense of the Open Society?

  ### I. The Technical Charge: Is Fukuyama a Historicist?

  To judge Fukuyama by Popper's standards, we must first be precise about Popper's definition of historicism. For Popper, historicism is not merely the study of history; it is the claim that there are "rhythms," "patterns," or "laws" of historical development that allow for unconditional prophecy. Popper contrasts this with "conditional scientific prediction" (if X happens, Y will follow) and "piecemeal social engineering" (solving specific problems without claiming to remake society according to a master plan).

  Fukuyama's thesis is nuanced. He does not argue that every nation will automatically become liberal tomorrow. He posits a *mechanism*: the logic of modern natural science drives economic modernization, which creates a middle class that demands political participation. Coupled with this is the Hegelian *thymos*—the struggle for recognition—which finds its ultimate satisfaction only in universal recognition under liberal democracy.

  Is this a Popperian law of history?

  **The Case for the Defense:** Fukuyama would argue he is not making an unconditional prophecy. He explicitly allows for reversals. In the 1990s, he pointed to the Balkans as evidence that "history" could still produce bloodshed. He argued that while the *ideal* was universal, the *process* would be long and uneven. This looks like a conditional prediction: *If* states seek legitimacy and wealth, *then* they will converge on liberalism.

  **The Popperian Verdict:** Popper would likely remain unconvinced. The distinction blurs because Fukuyama claims to know the *endpoint*. Even if the timetable is long and reversals are possible, the claim that there is a "terminal point" implies a directionality that Popper rejected in principle. Popper's argument rests on the unpredictability of the future state of knowledge. If we cannot know what new ideas will emerge, we cannot know if liberalism is the final one.

  Furthermore, Fukuyama's mechanism relies heavily on a philosophical anthropology (the nature of *thymos*) rather than empirical regularities. Popper viewed such metaphysical claims about human nature as untestable. By grounding his prophecy in Hegel rather than falsifiable social science, Fukuyama steps into the historicist camp, regardless of his caveats about timetables. He is not predicting *events*; he is predicting the *exhaustion of alternatives*. For Popper, claiming to know the limits of future ideological innovation is the height of historicist hubris.

  **The Blurred Line:** The distinction fractures on the question of *science*. Fukuyama argues the directionality is driven by the accumulation of technical knowledge (you can't un-invent the nuclear bomb or the internet). Popper agrees we cannot predict the *content* of future science, but he might concede that the *accumulation* of knowledge is directional. However, Popper would insist that technical progress does not dictate political forms. The link between the internet and liberal democracy is not a law of nature; it is a hope. Fukuyama treats a hope as a historical vector.

  ### II. The Oedipus Effect: Prophecy as a Historical Force

  Popper's most potent insight regarding historicism is what he called the "Oedipus effect": the influence that the prediction itself has on the predicted event. In *The Poverty of Historicism*, he notes that social predictions can be self-fulfilling or self-defeating depending on how actors react to them.

  The "End of History" thesis was not merely an academic observation; it became a operational manual for the 1990s and 2000s.

  **The Self-Fulfilling Phase:** In the immediate aftermath of the Cold War, the belief that liberalism was the inevitable future shaped elite behavior. The expansion of the European Union and NATO was driven by the assumption that post-communist states *could* and *should* become liberal democracies. This belief mobilized capital, institutions, and diplomatic pressure that arguably *made* the prophecy come true in Poland, the Baltics, and Central Europe. Here, the thesis functioned as a normative anchor, accelerating the convergence Fukuyama described.

  **The Self-Defeating Phase:** However, the Oedipus effect cuts both ways. The confidence that history had "ended" bred a specific kind of policy hubris. If liberal democracy is the natural state of man, then authoritarianism is an aberration that can be cured by intervention. This logic underpinned the neoconservative turn in the early 2000s, culminating in the Iraq War. The assumption was that removing a dictator would automatically release the latent liberal democratic impulses of the population.

  The backlash was severe. The failure of democracy promotion in the Middle East, combined with the rise of an authoritarian China that mastered market economics without political liberalization, served as a empirical refutation of the "End of History" mechanism. But through a Popperian lens, these failures are not just empirical errors; they are the result of *acting* on a prophecy.

  The rise of "civilizational states" (Russia, China, Iran) can be interpreted as a reaction *against* the End of History. These regimes defined their legitimacy in opposition to the liberal endpoint. In this sense, Fukuyama's thesis helped create the very adversaries that now challenge it. Popper warned that utopian engineering based on historical prophecy leads to violence because it treats resistance to the "inevitable" as irrational or evil. The 2000s illustrated this: if history is on your side, compromise with opponents becomes unnecessary.

  **Verdict:** Popper explains this episode better than Fukuyama. The trajectory of the 2000s and 2010s was not simply a "failed prophecy"; it was a demonstration of how belief in a prophecy alters the landscape, triggering immune responses in the system. The "End of History" did not end history; it provoked a new chapter of it.

  ### III. The Growth of Knowledge: The Epistemic Block

  Popper's central argument in *The Poverty of Historicism* is epistemic: "Human history is influenced by the growth of human knowledge. We cannot predict, by rational or scientific methods, the future growth of our scientific knowledge. Therefore, we cannot predict the future course of human history."

  This is where the Popperian framework bites hardest.

  In 1989, Fukuyama's thesis leaned on the technology of the industrial and early information age. The assumption was that economic modernization required free flows of information, which would inevitably erode authoritarian control. This seemed plausible when the alternative was the sclerotic Soviet command economy.

  But Popper's argument reminds us that we could not anticipate the technologies of the 2020s. We did not know that digital technology would enable authoritarian surveillance capitalism more efficiently than it enabled liberal dissent. We did not know that social media would fragment the public sphere, undermining the rational consensus required for liberal democracy.

  Fukuyama himself has conceded this point, particularly regarding biotechnology. In *Our Posthuman Future* (2002), he worried that biotech could alter human nature itself, potentially reopening "history" by creating new forms of inequality or changing the nature of the struggle for recognition. If we can engineer humans to be content without recognition, or to be subservient without resentment, the Hegelian engine stops.

  **Verdict:** This is a clear victory for Popper. Fukuyama's 1989 model was bounded by the knowledge of 1989. The subsequent technological landscape did not simply accelerate the liberal convergence; it complicated it in ways that were unknowable at the time. Popper's prohibition on predicting the future state of knowledge remains the strongest philosophical objection to any "End of History" claim.

  ### IV. Turning the Lens: Is Popper Immune?

  If we run the analysis in the other direction, the "End of History" episode exposes tensions in Popper's own framework.

  **The Directional Claim:** It is undeniable that since 1989, the number of liberal democracies has increased, even if the trend has stalled or reversed recently. Does this partial vindication suggest Popper's blanket prohibition on directional claims was too strong? Popper argued against *laws* of history, but he was a staunch defender of the "Open Society" as the only form of social life compatible with critical rationality.

  There is a tension here. Popper insists we cannot predict the future, yet he argues with moral certainty that the Open Society is the *destination* of rational political evolution. He denies this is historicist, framing it as a moral choice. But functionally, it operates similarly to Fukuyama's endpoint. If Popper is right that the Open Society is the only system that allows for error-correction, then it has a survival advantage. This implies a form of evolutionary directionality that borders on the historicism he attacked in Hegel.

  **The Problem of Stability:** Popper's "piecemeal social engineering" assumes a stable framework in which to tinker. But the post-1989 era showed that the *framework itself* is vulnerable. Popper's framework is silent on how to defend the Open Society against actors who use open institutions to close them (the "paradox of tolerance"). Fukuyama's thesis, for all its flaws, addressed the *legitimacy* crisis that Popper often took for granted. Popper explains why we shouldn't claim to know the end; he explains less about why people stop wanting the Open Society in the first place.

  **Verdict:** Popper is not entirely immune. His defense of the Open Society relies on a belief in the superiority of critical rationality that assumes a certain trajectory of human moral learning. While not "historicist" in the Marxist sense, it shares the Enlightenment faith that reason tends to win out. The rise of illiberal democracy suggests that reason does not always win, a contingency Popper's optimistic epistemology underestimates.

  ### V. The Silences: Meaning and Myth

  Finally, we must acknowledge where Popper's framework is simply silent. Popper's critique is logical and epistemic. It addresses the *validity* of historical prophecy, not its *appeal*.

  The "End of History" thesis filled a vacuum. The Cold War provided a grand narrative, a binary struggle of good versus evil that gave meaning to geopolitical events. When it ended, the West faced a crisis of meaning. Fukuyama provided a myth: the story of humanity's journey toward freedom.

  Popper offers critical rationality, which is cold, demanding, and devoid of teleological comfort. He asks us to accept uncertainty and work piecemeal. This is intellectually robust but emotionally sparse. Popper's framework cannot explain why the "End of History" was so seductive to policymakers and intellectuals, nor why its decline has produced such existential anxiety. He analyzes the logic of the prophecy, but not the psychology of the prophet or the audience. He treats the belief in historicism as an error of reasoning, rather than a response to a human need for narrative coherence.

  ### Conclusion: What Popper Explains, and What He Misses

  The confrontation between Popper and Fukuyama is not a clean kill. It is a complex entanglement of philosophy and policy.

  **What Popper Explains Well:**
  1.  **The Epistemic Hubris:** Popper correctly identifies that claiming to know the endpoint of ideological evolution violates the limits of human knowledge, specifically regarding future technological and social innovation.
  2.  **The Policy Danger:** The Oedipus effect explains how the "End of History" thesis morphed from an observation into a dogma that justified disastrous foreign policy interventions.
  3.  **The Unpredictability of Reaction:** Popper's framework anticipates that declaring an ideology "final" would provoke a counter-reaction, which is exactly what occurred with the rise of authoritarian capitalism and populist nationalism.

  **What Popper Misdescribes:**
  1.  **Fukuyama's Nuance:** Popper's definition of historicism was built to combat Marxism and Fascism. Applying it to Fukuyama is slightly category-confused. Fukuyama was not predicting an inevitable economic collapse of capitalism (like Marx); he was arguing for the *legitimacy* superiority of liberalism. He allowed for reversals. Popper's blanket prohibition treats Fukuyama's "tendency" as if it were Marx's "law."
  2.  **The Evolutionary Argument:** Popper dismisses social evolution too readily. There *are* directional pressures (e.g., the need for states to generate wealth to survive). While not deterministic, they create a landscape where some systems survive longer than others. Popper's refusal to acknowledge any directional trends leaves him ill-equipped to explain why liberalism *did* spread as much as it did.

  **Where the Aim Was Off:**
  Ultimately, *The Poverty of Historicism* was never aimed at a thesis like Fukuyama's. Popper was fighting against totalitarian determinism that justified sacrifice in the present for a utopia in the future. Fukuyama was arguing for the *present* system as the utopia.

  Popper warns us against sacrificing the present for the future. Fukuyama argued the future had arrived. In that specific sense, Fukuyama is less dangerous than the historicists Popper hunted. However, Fukuyama's thesis encouraged the West to treat the present as permanent, blinding it to the fragility of its institutions.

  **Final Judgment:**
  Popper wins on the philosophy of science: we cannot know the end of history because we cannot know the future of knowledge. But Fukuyama wins on the sociology of ideas: humans crave endpoints. The tragedy of the last thirty years is that we acted on Fukuyama's myth while ignoring Popper's warning. We treated a hypothesis as a destiny, and when history refused to end, we were left unprepared for its return.

  The "End of History" was not a Popperian law of history, but it was a Popperian warning unheeded. It reminds us that the Open Society is not a destination where we can rest, but a continuous, uncertain project that requires the very critical rationality Popper championed—and that the comfort of believing history has ended is the surest way to ensure it begins again.
