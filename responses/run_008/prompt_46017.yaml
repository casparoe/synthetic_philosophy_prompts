      *   **Voice:** Thoughtful, principled, slightly weary of rigid analytical distinctions that ignore human purpose. He values the *enterprise* of law as subjecting human conduct to the governance of rules.
      *   **Key Argument:** Law isn't just a command backed by force; it's a purposive enterprise. If a system fails the "inner morality of law" (e.g., secret rules, retroactive decrees, no congruence between rule and action), it fails to be law because it fails to guide conduct.
      *   **Response to Hart's Opening:** Hart argues for clarity: call it law, then punish retroactively based on moral necessity. Fuller argues this misses the point: the Nazi system itself often failed the procedural prerequisites of law, making the "validity" claim shaky. Moreover, pretending it was valid law obscures the deeper betrayal of the legal order itself. The connection isn't just about obedience; it's about the existence of a legal system.

