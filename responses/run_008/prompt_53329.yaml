  **Activity: The Dutch Book Game**

  **Setup:** Each player gets 100 chips (winner buys coffee next week). You are the Bookie. Use a standard d6.
  **The Rule:** Players set a "Price" (0–10 chips) for an event. A ticket costs *Price*, pays 10 chips if Event happens. **Crucial:** Players must accept bets at their own price from either side (buy or sell).

  **Round 1: Exhaustivity (20 mins)**
  *   **Event A:** Roll 1–3. **Event Not-A:** Roll 4–6.
  *   Players write down Price$_A$ and Price$_{notA}$.
  *   **The Trap:** If Price$_A$ + Price$_{notA}$ > 10, you sell them both tickets. They pay >10 total, max payout 10. **Sure loss.**
  *   If sum < 10, you buy both tickets from them. You pay <10, they owe you 10. **Sure loss.**

  **Round 2: Additivity (20 mins)**
  *   **Event B:** Roll 1–2. **Event C:** Roll 3–4. **Event D:** Roll 1–4.
  *   Players set Price$_B$, Price$_C$, Price$_D$.
  *   **The Trap:** If Price$_D$ > Price$_B$ + Price$_C$, sell them D, buy B and C from them. You pocket the difference. Reverse if opposite.

  **Debrief (20 mins)**
  1.  **Reveal the ledger.** Highlight guaranteed losses regardless of the die roll.
  2.  **Ask:** "Did the die roll matter?" (No). "So what caused the loss?" (The prices).
  3.  **Map:** Price = Degree of Belief. 10 chips = Certainty.
  4.  **Point:** Probability axioms aren't abstract math; they are consistency constraints. Violating them makes you a "money pump."

  **Predictable Problems**
  1.  **Hedging:** Players bet 1 chip to minimize risk. *Fix:* Mandate minimum 10-chip exposure per event.
  2.  **Gaming:** Clever players try to profit off you. *Fix:* Remind them the goal is sincere pricing. If they game it, they aren't testing their beliefs.
  3.  **Confusion:** "Selling" a bet is tricky. *Fix:* Phrase as "You pay me 2 chips now, I pay you 10 if it hits" vs "I pay you 2 chips now, you pay me 10 if it hits."

  **Limitations (Must State Aloud)**
  1.  **Volition:** Real agents can refuse to bet. This shows *conditional* irrationality (if you bet, you lose), not absolute.
  2.  **Pragmatic vs. Epistemic:** Losing chips proves practical inconsistency, not that beliefs are *false*. Coherence $\neq$ Truth. You can be coherent and wrong.
  3.  **Logical Omniscience:** The theorem assumes a Bookie who sees all inconsistencies instantly. Humans don't. Avoiding Dutch Books is a regulative ideal, not a human capacity.
  4.  **The Normative Leap:** The game shows you *lose chips*. It does not prove you *should* update beliefs unless you value coherence over comfort. That's a philosophical leap you must argue separately.
