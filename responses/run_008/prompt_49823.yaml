          *   **Arrow:** Non-dictatorship, IIA, Unrestricted Domain, Pareto Efficiency $\rightarrow$ Impossible (no SWF exists).
          *   **Gibbard–Satterthwaite:** Non-dictatorship, *Surjectivity/On-to* (range $\ge$ 3), Unrestricted Domain $\rightarrow$ Manipulable (not strategy-proof).
