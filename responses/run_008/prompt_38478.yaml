answer: |-
  The flaw in your study group member's argument is decisive, but it hides in plain sight. It relies on a metaphysical intuition that feels like common sense but is actually a specific, controversial, and ultimately untenable philosophical commitment. As a Dennettian, I will not reject premise (4), nor will I claim there is a mere equivocation between (1) and (5). I reject **Premise (3)**: *"Whatever is a posited abstraction rather than a concrete entity has no causal powers of its own."*

  This is the linchpin. If (3) falls, the argument collapses. Your friend's inference from "abstraction" to "causal inertness" is where the nihilism is smuggled in. Here is the diagnosis, the pricing of alternatives, and the defense of a robust Dennettian ethics.

  ### The Diagnosis: The Trap of Causal Fundamentalism

  Premise (3) looks undeniable because it appeals to a view called **Causal Fundamentalism**: the idea that *real* causation only happens at the bottom level of physics (particles pushing particles). On this view, if you can explain an event entirely in terms of neurons firing and muscles contracting, any appeal to a "self" or a "narrative" is just decorative shorthand. It's the "Center of Mass" intuition: the center of mass didn't break the bridge; the steel did.

  But Dennett's entire philosophy of mind is an attack on Causal Fundamentalism. He argues that **Real Patterns** have causal power.

  Consider a computer. You can explain every state change in terms of voltage gates (the physical stance). But if you ignore the software (the abstraction), you cannot explain *why* the computer crashed when you opened a specific file. The software is an abstraction relative to the hardware, yet it undeniably has causal powers: it directs the hardware, constrains its operations, and causes outputs. If the software is a "fiction," it is a fiction that steers the machine.

  Dennett's "Center of Narrative Gravity" is not merely a geometric point like a Center of Mass; it is a **virtual machine** running on the brain's hardware. The narrative organizes the memory, constrains future behavior, and integrates sensory data. By positing the self, the organism gains a control structure that exerts top-down causation on its own parts. To say the self has "no causal powers" is to say that the operating system has no effect on the computer's behavior. That is empirically false.

  The flaw in (3) is that it conflates **ontological fundamentality** with **causal efficacy**. A self is not a fundamental particle, but it is a real pattern that exerts control. Your friend's argument works only if you assume that *only* fundamental particles can be causes. Dennett rejects this. Biology, economics, and software all deal in abstractions that cause things.

  ### Why This Step Looked Fine to Smart People

  Premise (3) seduces us because the **Center of Mass analogy** (Premise 2) is so clean. A center of mass *is* causally inert; it is a mathematical point. Dennett invites us to compare the self to a center of gravity to explain its *unity* (how many experiences become one perspective), not its *causal impotence*.

  Your study group member took the analogy too literally. They assumed that because the self is *like* a center of gravity in being an abstraction, it must be *like* a center of gravity in being causally inert. This is a category error. A center of gravity is a static property of a distribution of mass. A self is a dynamic control loop. The first is a description; the second is a mechanism. By accepting (3), your friend inadvertently accepts that software, institutions, and biological functions are all causally inert fictions.

  ### Pricing the Alternatives

  Why reject (3) rather than (4) or the transition? We must price the alternatives to see why (3) is the only viable cut.

  **1. Rejecting Premise (4):** *"What has no causal powers... can neither undergo nor do anything."*
  If you keep (3) (selves have no causal powers) but reject (4) (therefore they can't act), you land in **Epiphenomenalism**. You are claiming that selves *can* choose and be harmed even though they have *no causal power*. This makes agency magical. It suggests that "choice" is a ghostly property that floats above the physical world without touching it. This destroys ethics faster than the original argument. If my choice doesn't cause my action, I am not an agent; I am a spectator. Dennett is a compatibilist, not a magician. He wants agency to be real *because* it causes behavior, not in spite of it.

  **2. Rejecting the Transition (Equivocation):**
  Some in your group suspect an equivocation between the "theoretical self" of (1) and the "moral self" of (5). This is a tempting escape hatch, but it costs Dennett his theoretical unity. Dennett's point is that the *same* entity—the narrative center of gravity—is the subject of both psychology and ethics. If you say the word "self" changes meaning between premise 1 and 5, you concede that the ethical self is *not* the narrative self. This splits the mind in two, inviting the very dualism Dennett sought to dissolve. It saves ethics by abandoning the philosophy of mind.

  **3. Rejecting Premise (3) (The Recommended Path):**
  The cost here is metaphysical humility. You must give up the intuition that "real causation" looks like billiard balls hitting each other. You must accept that **information is physical** (Landauer's Principle) and that patterns instantiated in matter can be causes. This is not a high price; it is the price of admitting that biology and computer science are real sciences. If you reject (3), you preserve the unity of the self (it is one thing, the narrative) and the reality of ethics (that thing causes actions and suffers consequences).

  ### Can a Dennettian Keep Ethics?

  Yes, but only by rejecting (3). Ethics does not require a "soul substance" or a "homunculus" with magical pushing powers. It requires **responsiveness to reasons**.

  When we hold someone responsible, we are treating them as an Intentional System. We are acknowledging that their behavior is governed by a narrative structure that can be influenced by praise, blame, and threat. If the self were truly causally inert (as (3) claims), blame would be like shouting at a stone. But because the self is a **real pattern of control**, blame acts as an input that modifies the narrative, which in turn modifies future behavior.

  A victim is a system whose narrative integrity is damaged. A promise is a commitment installed in the narrative control system. These are not "mere" abstractions; they are the functional architecture of human social life. To say they aren't "real" because they aren't made of quarks is like saying a chess game isn't "real" because the pieces are just wood. The game is in the patterns, and the patterns are what matter.

  **Conclusion:**
  Tell your study group member that their argument is a *reductio ad absurdum* of Premise (3), not of Dennett. If (3) were true, there would be no software, no biology, and no economics—only physics. Since those things clearly exist and have effects, (3) is false. The self is an abstraction, but it is a **causally potent abstraction**. It is the control software of the human organism. And software can certainly be hacked, harmed, and held responsible for its outputs.
