answer: |-
  There is a single principle that captures your verdicts, though it requires a precise definition of "risk." Your intuition is not tracking standard probability, but rather **the asymmetry of downside consequences combined with epistemic confidence.**

  I call this **The Principle of Asymmetric Ruin.**

  ### The Principle Defined
  **"Do not undertake an action if it introduces a risk of irreversible, systemic catastrophe ('Ruin'), unless the status quo already guarantees a comparable catastrophe that the action demonstrably reduces, AND the new risk is epistemically bounded or understood."**

  This principle relies on three filters:
  1.  **Ruin:** Is the downside irreversible, existential, or systemically catastrophic? (If no, proceed).
  2.  **Certainty:** Is the harm of the *status quo* certain, while the harm of the *intervention* is speculative? (If yes, act).
  3.  **Complexity:** Is the intervention's mechanism simple enough to model, or does it introduce unmanageable unknowns? (If unknowns dominate, halt).

  ### How It Maps to Your Verdicts
  1.  **Race Condition:** **Ruin** (silent data corruption is irreversible trust loss). **Certainty** (bug exists). **Verdict:** Halt.
  2.  **UI Glitches:** **No Ruin** (visual annoyance is reversible). **Verdict:** Ship.
  3.  **Golden Rice:** **Status Quo Ruin** (blindness/death is certain). **Intervention Risk** (ecological damage is speculative/low probability). **Verdict:** Deploy.
  4.  **Nuclear vs. Coal:** **Status Quo Ruin** (coal pollution/climate is certain/diffuse). **Intervention Risk** (meltdown is contained/low probability). **Verdict:** Keep Nuclear.
  5.  **Drug Approval:** **Intervention Ruin** (direct toxicity is physiological/irreversible for the patient). **Status Quo Harm** (disease progression). **Verdict:** Halt/Verify. *Note: This is the tension point, addressed below.*
  6.  **Geoengineering:** **Status Quo Ruin** (climate damage is certain). **Intervention Ruin** (planetary system collapse is possible). **Complexity** (mechanism is poorly understood/chaotic). **Verdict:** Halt.
  7.  **Food Additive:** **Status Quo Harm** (cancer link is weak/uncertain). **Intervention Cost** (banning limits choice/economy). **Verdict:** Don't Ban.

  ### The AI Email Agent Case
  **Verdict: Do not release broadly.**

  Applying the **Principle of Asymmetric Ruin**:
  *   **Ruin:** An AI agent sending emails on a user's behalf introduces the risk of reputational destruction, legal liability, or enabling large-scale phishing from trusted accounts. This is systemic and potentially irreversible for the user and your platform.
  *   **Complexity:** You stated you "cannot enumerate the failure and misuse scenarios." This is **Knightian Uncertainty** (unknown unknowns). You cannot model the downside.
  *   **Status Quo:** The status quo is manual emailing. It is slower, but it does not carry a risk of automated catastrophe.

  Because the intervention introduces unbounded, unenumerable risk without a "certain ruin" in the status quo to justify it, the principle dictates you must halt or severely constrain the feature (e.g., "draft only" mode with human confirmation) until the failure modes are bounded.

  ### The Tension Point and Cheapest Repair
  Your verdicts are remarkably consistent, but **Case 5 (Drug Approval)** is the outlier that strains the principle.

  In Case 3 (Golden Rice), you prioritized saving lives over speculative ecological risk. In Case 5 (Drugs), you prioritize safety testing over the lives lost during the delay. Both involve "certain harm now" vs. "risk of harm from intervention."

  **The Conflict:** If saving certain lives (Rice) trumps speculative risk, why doesn't saving certain lives (Drug delay) trump speculative side-effect risk?

  **The Cheapest Repair:** You must explicitly accept the **Commission vs. Omission Distinction.**
  Your principle implicitly treats harm *caused by your action* (Commission) as weightier than harm *allowed by your inaction* (Omission), even if the body count is similar.
  *   **Repair:** Amend the principle to read: "...unless the status quo guarantees a comparable catastrophe... **and the intervention does not directly inflict the harm upon the beneficiary.**"
  *   In Golden Rice, the rice *feeds* the child; the eco-risk is external.
  *   In Drug Approval, the drug *enters* the patient; the toxicity is direct.
  *   Acknowledging this bias repairs the logic without forcing you to abandon your stance on drug safety.

  ### Is This the Precautionary Principle or Expected Value?
  To answer you honestly: **It is Expected-Value Reasoning with a 'Ruin' Barrier.**

  It is **not** the traditional Precautionary Principle. The strong Precautionary Principle argues that if an action has *any* suspected risk of severe harm, the burden of proof is on the actor to show it is safe, often leading to paralysis (e.g., blocking Golden Rice). Your view allows risk-taking when the status quo is catastrophic (Nuclear, Rice), which the traditional Precautionary Principle often forbids.

  It is **not** pure Expected Value (EV). Pure EV would sum `(Probability × Cost)`. In cases like Geoengineering or Nuclear waste, the probabilities are unknown, making standard EV impossible. You are intuitively applying a **convex cost function**: you treat "Ruin" (systemic collapse, irreversible death, total data loss) as having near-infinite weight, regardless of low probability.

  **Conclusion:** You are practicing **Risk of Ruin Management.** You are willing to accept high-probability, low-severity risks (UI glitches) and certain harms to avoid speculative ones (Rice), but you refuse to gamble with unbounded, irreversible downsides when the mechanism is unknown (Geoengineering, AI Agents). This is a robust, engineering-grade heuristic, provided you accept the Commission/Omission bias in your drug safety verdict.
