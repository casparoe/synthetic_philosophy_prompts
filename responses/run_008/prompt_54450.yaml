answer: |-
  You have identified a genuine blind spot in Orwell's analysis, and by extension, in much of 20th-century linguistic philosophy. Orwell operated under a **constative bias**: he assumed the primary purpose of political language was to describe reality (make true/false claims), and therefore viewed any deviation from clarity as a *failure* of language.

  Your observation corrects this: the language isn't failing to describe; it is succeeding at *binding*. It is not a broken mirror; it is a functioning badge.

  There is no single, settled English term that captures this precisely. The closest theoretical concept is the **"Empty Signifier"** (coined by Ernesto Laclau), which describes a symbol (like "Freedom" or "The People") that is drained of specific content so it can unite a diverse coalition. However, "Empty Signifier" describes the *structure* of the symbol, not the *speech act* of the speaker. It doesn't capture the interpersonal dynamic you noted: the defensive reaction when the phrase is questioned. "Virtue Signaling" is the pop-culture cousin, but it focuses on moral superiority rather than tribal alignment, and it is too pejorative to be analytically neutral.

  Since no existing term perfectly isolates the *function* of allegiance-display without carrying unwanted baggage, I propose we coin the term:

  ### **The Allegiance Phatic**

  Here is the definition, the mechanics, and the boundary work you requested.

  ---

  ### 1. Definition and Mechanics
  An **Allegiance Phatic** is a phrase or utterance whose primary function is not to convey propositional information (facts, claims, arguments) but to verify and reinforce the speaker's membership within a specific social or political tribe.

  It is a sub-species of **phatic communication** (a term from anthropologist Bronisław Malinowski). Malinowski originally used "phatic" to describe small talk ("Lovely weather," "How do you do?") where the *content* is irrelevant, and the *function* is simply to keep the channel of communication open.

  The **Allegiance Phatic** expands this definition. It does not keep the channel open; it *identifies the frequency*. It signals: *"I am broadcasting on your wavelength."*

  **Key Characteristics:**
  *   **Truth-Conditional Immunity:** Because the phrase makes no specific claim, it cannot be falsified. Asking "What does 'right side of history' actually entail?" is a category error, like asking "What is the chemical composition of a handshake?"
  *   **Defensive Reaction:** As you noted, questioning the meaning is interpreted as challenging the loyalty. The listener hears: *"I don't recognize your badge,"* which implies *"You are not one of us."*
  *   **Interchangeability:** The phrase can be adopted by opposing sides because its utility lies in the *act of saying it*, not the policy it describes. Both a socialist and a libertarian can demand "common-sense reform"; the phrase serves to paint the *other* side as having "uncommon nonsense."

  ### 2. Boundary Marking
  To ensure this term is useful, we must distinguish it from the concepts you rightly rejected.

  **Vs. Euphemism**
  *   **Euphemism:** Hides an unpleasant truth (e.g., "collateral damage" for "dead civilians"). It has propositional content; it is a lie or a softening of a fact.
  *   **Allegiance Phatic:** Has *no* propositional content to hide. It is not concealing a body; it is waving a flag.

  **Vs. Shibboleth**
  *   **Shibboleth:** A linguistic test used to *exclude* outsiders (e.g., pronouncing "sibboleth" correctly in the Book of Judges). It is a gatekeeping mechanism used *against* a suspect.
  *   **Allegiance Phatic:** A voluntary display used *by* the insider to reassure the group. It is not a test administered by the group; it is a badge worn by the member. A shibboleth says, "Prove you belong." An Allegiance Phatic says, "See that I belong."

  **Vs. Vagueness (Orwell's Target)**
  *   **Vagueness:** A failure of precision. "The situation is problematic" is vague because it lacks specific detail the speaker *should* have provided.
  *   **Allegiance Phatic:** A precision of function. "The situation is problematic" is precise in its job to signal concern without committing to a solution. Orwell saw this as slovenliness; an Allegiance Phatic analysis sees it as efficiency. It achieves its goal (signaling) perfectly.

  **Vs. Dogwhistle**
  *   **Dogwhistle:** Relies on *secrecy*. It has a surface meaning for the general public and a coded meaning for a subset (e.g., "states' rights" implying segregation to a specific audience).
  *   **Allegiance Phatic:** Relies on *publicity*. The signaling is the point. Everyone knows what the phrase is doing, including the opposition. There is no hidden layer; the surface *is* the signal.

  ### 3. Why Orwell Missed It
  Orwell's thesis in *Politics and the English Language* is moral and cognitive: he believed that sloppy language leads to sloppy thought ("the slovenliness of our language makes it easier for us to have foolish thoughts"). He viewed language as a **tool for thinking**.

  The **Allegiance Phatic** reveals that political language is often not a tool for thinking, but a tool for **cohesion**. In this context, clarity is actually a *disadvantage*. If "the right side of history" were defined precisely (e.g., "the side that supports policy X by year Y"), it would alienate members of the tribe who disagree on policy X but agree on the tribal identity. The vagueness is a feature, not a bug. It allows for a "coalition of the vague."

  Orwell assumed the speaker was trying to communicate a thought and failing. You have identified that the speaker is communicating an *identity* and succeeding.

  ### 4. Examples in the Wild
  *   **"Thoughts and Prayers":** (Post-tragedy). Propositional content: Near zero. Function: Signals membership in the "caring/decency" tribe without committing to policy changes that might alienate other donors/voters.
  *   **"Systemic Racism" / "Woke":** Depending on the speaker, these function less as sociological descriptions and more as Allegiance Phatics. To say them is to display which epistemic tribe you trust.
  *   **"Support Our Troops":** Rarely involves actual logistical support. It is a loyalty oath. Questioning it is treated as treason, not policy debate.

  ### Summary
  The term is **Allegiance Phatic**.

  It rescues the concept of "phatic" from the realm of small talk and applies it to the high-stakes world of political identity. It acknowledges that these phrases are not broken attempts at description, but functional tools of social bonding. When you hear one, you are not being invited to think; you are being invited to stand.
