  **MEMORANDUM**

  **TO:** State Sentencing Guidelines Commission
  **FROM:** Citizen Member
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo on "Desert Cap" Pilot Proposal

  **Recommendation**

  I recommend that the Commission adopt the "desert cap" pilot proposal with specific modifications regarding the "reopener" clause and the "earn-down" endpoint. I further recommend a phased implementation over a thirty-six-month pilot period, followed by a mandatory review of recidivism data and judicial feedback. While the proposal offers a pragmatic bridge between irreconcilable philosophical positions, the draft language contains structural ambiguities that threaten to undermine the very compromise it seeks to encode.

  **Philosophical Context and Rationale**

  The legislature's referral asks us to navigate a fundamental disagreement regarding the justification of punishment. One faction within our deliberations maintains that offenders deserve punishment in a backward-looking sense tied to culpable choice. For this group, capping the retributive component at one-third of the guideline range is not a compromise but a moral error; it treats deserved punishment as a bargaining chip rather than a claim of justice. Their strongest consideration is that justice requires proportionality between culpability and suffering, and statutory caps sever this link arbitrarily.

  Opposing this is the view that "ultimate authorship" of character is a myth, meaning no one deserves punishment in a basic sense. For this faction, only forward-looking grounds (risk reduction, rehabilitation) justify state coercion. They view the cap as a step toward truth, acknowledging that the retributive portion is merely a political concession.

  The proposal attempts to codify a compatibilist middle ground: that a weaker sense of desert survives even without ultimate authorship, tied to the capacity to respond to reasons. By retaining a fixed one-third component, the proposal acknowledges accountability. By making the remainder earnable, it acknowledges the limits of culpability. To adopt this pilot is to test whether this weaker sense of desert can sustain public confidence while reducing incarceration. However, to respect the Retributivist concern that justice is being diluted, the modifications below are necessary to ensure the retributive portion remains meaningful.

  **The Reopener Clause Asymmetry**

  The draft allows the retributive one-third to be recalculated if new information arises regarding circumstances at the time of the offense (e.g., coercion, neurological conditions). However, it prohibits reducing the forward-looking two-thirds on this basis. Sponsors argue this asymmetry follows from the nature of the interests involved: desert looks backward to the offense, while risk looks forward to future behavior.

  This reasoning is flawed. Risk assessments are not crystal balls; they are extrapolations based largely on historical data and the nature of the offense. If new information reveals that an offender's participation was coerced or influenced by an undiagnosed neurological condition, this does not merely reduce culpability; it fundamentally alters the risk profile. An offender acting under coercion may pose a lower risk of recidivism than one acting on autonomous malicious intent. Similarly, a neurological condition may indicate specific treatment needs that, if addressed, lower risk more rapidly than standard programming.

  Locking the forward-looking portion while adjusting the retributive portion assumes that risk is independent of culpability factors. It is not. If the assessment of "dangerousness" was contaminated by the same facts that mitigate desert, maintaining the two-thirds portion undermines the forward-looking justification itself.

  *Modification:* The reopener clause must be amended to allow recalibration of both the retributive and forward-looking components when new information materially affects the understanding of the offender's culpability or risk profile.

  **The Earn-Down Endpoint**

  The draft is silent on the status of the sentence once an offender completes all earn-down conditions. Specifically, it does not specify whether the remaining retributive one-third serves as a ceiling, a floor, or a presumption. This silence creates a critical ambiguity regarding the commission's stance on desert.

  If the retributive one-third can be waived upon completion of the forward-looking conditions, the entire sentence becomes functionally forward-looking. This would validate the Skeptic faction's view entirely and tacitly admit that the retributive portion was never truly "deserved" but was merely a administrative hurdle. This would betray the Retributivist faction and likely erode judicial buy-in.

  Conversely, if the one-third is treated as a mandatory floor, it affirms that there is a non-negotiable cost to culpable choice, regardless of rehabilitation. This preserves the integrity of the compromise. It signals that while the state is willing to forego excess punishment for utility's sake, it will not forego the core penalty required by justice.

  *Modification:* The guidelines must explicitly state that the retributive one-third constitutes a mandatory floor upon successful completion of earn-down conditions, unless the reopener clause is triggered to reduce culpability. This ensures the retributive component is not treated as merely another variable to be earned away.

  **Implementation and Timeframe**

  I propose a thirty-six-month pilot period limited to non-violent property and drug offenses. This scope minimizes public safety risks while providing sufficient data to evaluate the philosophical and practical outcomes. During this period, the Commission should collect data on: (1) completion rates of earn-down conditions; (2) recidivism compared to matched controls under current guidelines; and (3) judicial surveys regarding perceived fairness.

  **Conclusion**

  The "desert cap" is an ambitious attempt to legislate a philosophical compromise. Without modification, however, it risks satisfying neither side: it dilutes justice enough to alarm Retributivists while retaining enough retributive language to annoy Skeptics, all while operating on flawed assumptions about risk assessment. By correcting the reopener asymmetry and defining the earn-down endpoint as a floor, we can create a pilot that honestly tests the compatibilist claim. This approach respects the legislature's referral while ensuring the Commission maintains intellectual consistency regarding the nature of punishment.
