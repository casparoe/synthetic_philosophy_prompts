prompt: |-
  Quick question about the extended mind thing. In our phil of mind class we got the famous Otto and Inga case: Otto writes everything in his notebook, Inga just remembers. The parity claim is basically that Otto's notebook plays the same functional role for him that Inga's biological memory plays for her — so if her memory counts as part of her mind, his notebook should too. My professor said this analogy is doing basically ALL the argumentative work for the whole thesis, not just illustrating it. Meanwhile my roommate says it's obviously a bad analogy, that the notebook is more like a prosthetic leg — a tool you've learned to use really well, sure, but nobody says the prosthetic is part of your body just because you trust it and reach for it without thinking. Can you audit the Otto/Inga comparison? Like, actually map what's supposed to correspond to what (availability, trust, the way Otto consults it without deliberation, the fact it was endorsed by past-Otto, whatever else), then show where the mapping breaks down, and tell me which of the breakdowns actually matter for the conclusion. I'm especially confused about the asymmetry cases: Inga's memory can't be borrowed or stolen or read by others, and she can't consult it before deciding whether to consult it — do those differences sink the parity claim or are they just disanalogies that don't do any real work? And if the notebook analogy fails, does the extended mind thesis go with it, or does the prosthetic-leg counter-analogy have its own problems (people with prosthetics do talk about them as parts of themselves, don't they?). Also if there's a better analogy somewhere in the neighborhood I'd like to hear it. Btw this is for a term paper so I care more about where the argument actually bends than about who's supposed to have won this in the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The Extended Mind Thesis (EMT), specifically the Otto and Inga thought experiment (Clark & Chalmers, 1998).
      *   **Core Task:** Audit the Otto/Inga analogy. Map correspondences, identify breakdowns, and evaluate which breakdowns matter for the conclusion.
      *   **Specific Concerns:**
          *   Professor's claim: The analogy does *all* the argumentative work.
          *   Roommate's claim: It's a bad analogy (like a prosthetic leg/tool, not part of the mind/body).
          *   Asymmetry cases: Privacy, theft, pre-consultation. Do these sink the parity claim?
          *   Stakes: If the analogy fails, does EMT fail? Does the prosthetic counter-analogy have problems?
          *   Request for better analogies.
          *   Context: Term paper (needs philosophical rigor, focus on argumentative structure, not just "who won").

  2.  **Deconstruct the Otto/Inga Case (The Parity Principle):**
      *   *The Principle:* If a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process.
      *   *The Mapping:*
          *   Inga: Biological memory $\rightarrow$ Belief storage $\rightarrow$ Retrieval $\rightarrow$ Action.
          *   Otto: Notebook $\rightarrow$ Belief storage $\rightarrow$ Retrieval $\rightarrow$ Action.
      *   *Key Criteria (Clark & Chalmers):*
          1.  Constant availability (Otto always has the notebook).
          2.  Easy accessibility (no major barriers to entry).
          3.  Automatic endorsement (Otto trusts the info implicitly, like Inga trusts memory).
          4.  Past endorsement (Info was consciously placed there by Otto).

  3.  **Evaluate the Roommate's Objection (The Prosthetic/Tool Objection):**
      *   *Claim:* Notebook = Tool (like a calculator or prosthetic limb). Tools are *used by* the mind, not *part of* the mind.
      *   *Counter-claim:* EMT argues the boundary of the *mind* isn't the boundary of the *skin*. If the functional role is identical, the location shouldn't matter.
      *   *Prosthetic nuance:* Some phenomenology suggests prosthetics *are* incorporated into the body schema (Merleau-Ponty). So the roommate's intuition might be philosophically shaky too.

  4.  **Analyze the Asymmetries (The "Breakdowns"):**
      *   *Privacy:* Inga's thoughts are private; Otto's notebook is public.
      *   *Theft/Loss:* Notebook can be stolen; memory (usually) can't.
      *   *Pre-consultation:* Inga can't "check" if she remembers before remembering. Otto can check if he has the notebook before looking.
      *   *Do these matter?*
          *   *Privacy:* EMT proponents say cognitive *vehicles* don't need to be private, only the functional role matters.
          *   *Theft:* Vulnerability doesn't negate constitution. (I can lose a hand, it's still part of me).
          *   *Pre-consultation:* This is the "Glitch" argument (Adams & Aizawa). If Otto has to decide to look, isn't that a meta-cognitive step Inga doesn't take? *Crucial point for the paper.*

  5.  **Address the "Does the Analogy Do All the Work?" Question:**
      *   The professor is mostly right. EMT relies heavily on *functionalism*. If functionalism is true, and the functions match, the conclusion follows. The analogy *is* the argument for the functional match.
      *   However, it relies on the *Parity Principle* being accepted. If one rejects the Parity Principle (e.g., biological chauvinism), the analogy fails regardless of functional similarity.

  6.  **Evaluate the "If Analogy Fails, Does EMT Fail?" Question:**
      *   Otto/Inga is the *canonical* argument, but not the *only* one.
      *   Other arguments: Coupling-constitution fallacy (objection), sensory substitution devices, modern tech (smartphones).
      *   If Otto fails because of specific disanalogies, EMT might still hold for *tighter* couplings (e.g., neural implants).

  7.  **Identify Better Analogies:**
      *   *The Blind Man's Cane:* Merleau-Ponty. The cane becomes an extension of sensory perception.
      *   *Tetris:* Rotating pieces on screen vs. in head (Kirsh & Maglio).
      *   *Smartphone:* Modern update (Otto 2.0).

  8.  **Structure the Response:**
      *   **Introduction:** Acknowledge the centrality of the case. Validate the professor and the roommate (both have points).
      *   **Mapping the Parity:** Explicitly list the criteria (Availability, Accessibility, Trust, Endorsement).
