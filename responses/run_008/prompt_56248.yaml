      *   *Professor's point:* The analogy isn't just illustration; it's an *inference to the best explanation* based on functionalism.

  10. **Final Polish:** Ensure tone is academic but accessible (for a student). Highlight key terms (Functionalism, Parity Principle, Coupling-Constitution Fallacy).

