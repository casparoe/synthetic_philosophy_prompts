      *   If Camp A is right, high-inequality societies should work more than low-inequality societies at similar GDP/capita.
      *   If Camp B is right, hours should correlate primarily with GDP/capita (or not at all), regardless of distribution.
      *   *Conceptual Distinction:* Distinguish "Relative Needs as Status Competition" (zero-sum) vs. "Relative Needs as Habit Formation" (ratchet effect).
      *   *Specific Evidence:* Cross-national comparison of hours worked vs. Gini coefficient, controlling for productivity.
