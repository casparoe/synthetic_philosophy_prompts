      *(Refining the "Performance" verdict)*: If it's a performance, the prediction is rhetorical. But the *argument* relies on the psychology. If the psychology is false, the rhetoric fails. So the "Performance" camp is actually siding with Camp B (Psychology is false/irrelevant) but changing the stakes. I should call this out.

