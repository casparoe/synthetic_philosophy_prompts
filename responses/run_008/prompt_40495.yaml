prompt: |-
  I'm on a small working group for our city's participatory budgeting program — we advise the city council, and in about six weeks they'll vote on how the next funding round (something like 4 million for local infrastructure and community projects) gets its recommendations made.

  Quick background on the fight. Last round we used the classic open town-hall format: anyone who shows up can propose and vote on projects. About 130 people came, median age well above the city average, hugely overrepresented from the neighborhood associations and one extremely organized cycling lobby, and the same twenty faces who show up to everything. One faction on our group, led by my colleague, says the fix is obvious: pick the next recommending body by lottery. Stratified random sample of maybe 350 residents, compensated for their time, meeting over several weekends. No more self-selection, no more rewards for having a flexible Tuesday evening. The other faction, mostly the finance office people, says this is naive twice over: (1) randomly selected residents are mostly disengaged and will just rubber-stamp whatever the professional staff put in front of them, so we're not democratizing anything, we're laundering staff decisions through a lottery, and (2) motivated volunteers, whatever their biases, at least know the neighborhoods. They want to keep town halls and just do better outreach.

  I have to write the recommendation memo the council will actually read before the vote. Please draft it for me.

  A few things I want in there:

  - A clear recommendation — full sortition, keep town halls, or some hybrid — with a decision the council can act on, not a menu of options.
  - Concrete design conditions attached to the recommendation: panel size, what to stratify on and why those variables rather than others, what happens when someone drawn by lottery doesn't show up or stops coming, how much the panel can go beyond staff-prepared options. If your recommendation is a hybrid, say exactly which parts are random and which are open.
  - An honest treatment of the losing side's single strongest point. My colleague's lottery faction has a genuinely good argument about self-selection bias (open formats systematically select for spare time, extroversion, and pre-existing organization — a point about *who* gets rewarded, not just who shows up). The town-hall faction has a genuinely good argument about the agenda (if staff frame the options and the panel only ranks them, random selection decorates an unelected process rather than changing it). Don't strawman either.
  - Something about the competence worry that goes deeper than "trust the people": if a big random panel is on average only weakly informed about infrastructure costs, what exactly are we hoping the aggregation does for us, and under what assumptions would that hope actually be justified? I remember there's a classic result along these lines about juries and majorities — I don't want the memo to misuse it.

  Some context on me: I'm a mid-level planner, not a philosopher, but the council members have heard of deliberative mini-publics and will spot hand-waving. So play the role of a political theorist who's spent a career studying democratic institutions and has watched a few of these citizen-assembly-type bodies succeed and fail up close — please actually think through the design tradeoffs before locking in the recommendation, like, maybe sketch the realistic failure modes of each option first and then decide which failure mode this specific city can least afford, given what I described about who currently dominates the town halls.

  Also, if it helps the memo, you can note the deeper point that keeps bugging me: a lottery doesn't reward anyone for anything — it just ignores motivation entirely. Whether that's a bug or the whole feature seems to be the philosophical crux of this fight, and I'd love the memo to be honest about it rather than pretending there's a technocratic answer.

  Keep it usable — council members read about two pages before their eyes glaze over. Something like a real decision memo: recommendation up top, reasoning under it, and the strongest objection answered rather than buried.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Mid-level planner writing for City Council, but with the intellectual depth of a political theorist experienced in democratic institutions.
      *   **Audience:** City Council members (busy, pragmatic, familiar with terms like "deliberative mini-publics," prone to glazing over after two pages).
      *   **Task:** Draft a recommendation memo on the design of the next Participatory Budgeting (PB) round.
      *   **Current Situation:** $4M funding. Last round used open town halls (130 attendees, older, wealthy/organized bias, cycling lobby dominance).
      *   **The Conflict:**
          *   *Faction A (Colleague):* Sortition (Lottery). 350 residents, stratified, compensated. Fixes self-selection bias.
          *   *Faction B (Finance Office):* Keep Town Halls + Better Outreach. Argues lottery = rubber stamp of staff, volunteers know neighborhoods better.
      *   **Required Elements:**
          *   Clear recommendation (not a menu).
          *   Concrete design conditions (panel size, stratification variables, attrition handling, scope of power).
          *   Honest treatment of the strongest argument from the "losing" side.
          *   Address the "competence worry" (Condorcet's Jury Theorem reference needed, but accurate).
          *   Address the philosophical crux: Lottery ignores motivation (bug vs. feature).
          *   Length: ~2 pages (usable decision memo).
          *   Tone: Professional, analytical, decisive, theoretically grounded but practical.

  2.  **Determine the Recommendation:**

      *   *Option 1: Pure Town Hall.* Status quo failed representationally. "Better outreach" rarely fixes structural self-selection bias (time, confidence, organization). High risk of continued capture by special interests.
      *   *Option 2: Pure Sortition.* Fixes representation. Risk of disengagement or staff capture. High logistical lift.
      *   *Option 3: Hybrid.* Best of both worlds? Usually, hybrids dilute the benefits of sortition. If the town hall can veto the panel, the bias remains. If the panel just advises the town hall, it's tokenism.
      *   *Decision:* The prompt highlights the *severe* bias of the current town hall (20 faces, cycling lobby, age skew). The Finance Office's fear (staff capture) is manageable through design. The Colleague's fear (exclusion) is structural.
      *   *Choice:* **Recommend Sortition (Citizens' Assembly model), but with specific safeguards against staff capture.** This aligns with the "political theorist" persona who knows that *who* decides matters more than *how much* they know, provided the process is structured for learning. It directly addresses the "motivation as bias" crux.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary/Recommendation:** Put the decision first. Clear and actionable.
      *   **The Problem:** Briefly state why the status quo is untenable (legitimacy crisis, not just attendance numbers).
      *   **The Recommendation (Design Specs):**
          *   *Size:* 350 is too big for deliberation, too small for statistical significance if attrition is high. Let's aim for a "mini-public" size. 100-150 is standard for assemblies. 350 is more like a poll. Let's compromise: 150 selected, target 100 final.
          *   *Stratification:* Age, Geography (council districts), Income/Rent vs. Own (proxy for class), maybe Race/Ethnicity if data allows.
          *   *Attrition:* Over-recruit. Pay them.
          *   *Scope:* They need to *generate* ideas, not just rank staff ideas. This counters the Finance Office's "rubber stamp" fear.
      *   **Addressing the Competence Worry (The Theory Bit):**
          *   Need to reference Condorcet's Jury Theorem correctly. It requires voters to be *better than random* (>50% chance of being right).
          *   Counter-argument: Deliberation *makes* them better than random. It's not raw ignorance; it's informed judgment.
          *   Distinction: Technical feasibility (staff's job) vs. Value judgment (public's job).
      *   **Addressing the "Motivation" Crux:**
          *   Acknowledge the Finance Office's point: Volunteers care more.
          *   Reframe: In PB, "caring more" often means "having a specific axe to grind." The lottery treats motivation as a conflict of interest, not a qualification.
      *   **Addressing the Strongest Objection (Staff Capture):**
          *   Finance Office is right that bad design leads to rubber-stamping.
          *   Mitigation: Independent facilitation, staff as witnesses not advocates, ability to call experts.
      *   **Conclusion:** Reiterate the choice.

  4.  **Refining the Content (Self-Correction during drafting):**

      *   *Critique:* Is 350 too big?
      *   *Correction:* The prompt mentions the colleague wants 350. That's large for a deliberative body (hard to talk). But it's good for statistical representation. I should recommend a two-stage process or a smaller deliberative body drawn from the larger pool. Actually, for a memo, keep it simple. Recommend a **Citizens' Panel of 120**. It's large enough for diversity, small enough for deliberation. 350 is survey territory.
      *   *Critique:* Condorcet's Jury Theorem.
      *   *Correction:* Be careful. Condorcet assumes independent votes. Deliberation violates independence. I need to nuance this. The "wisdom of crowds" relies on diversity and independence. Deliberation reduces independence but increases competence. The argument should be about *collective learning*, not just aggregation of pre-existing ignorance.
      *   *Critique:* Tone.
      *   *Correction:* Ensure it doesn't sound academic. Use "legitimacy," "risk," "implementation."
      *   *Critique:* The "Motivation" point.
      *   *Correction:* Make sure to explicitly state: "Lottery treats motivation as a source of bias." That's the key insight the user wants.

  5.  **Final Polish:**

      *   Check word count/visual length.
      *   Ensure the "Decision" is bold.
      *   Check that all constraints from the prompt are met (stratification variables, attrition, scope, competence theory, motivation crux).

  6.  **Final Review against constraints:**
      *   Clear recommendation? Yes (Sortition-based Citizens' Panel).
      *   Concrete design conditions? Yes (120 members, stratification details, attrition buffer, scope of idea generation).
      *   Honest treatment of losing side? Yes (Finance Office's staff capture concern).
      *   Competence worry/Condorcet? Yes (addressed in "Technical Feasibility vs. Value Judgment").
      *   Motivation crux? Yes (Motivation as bias).
      *   Length? Aiming for ~1000-1200 words (2 pages single spaced equivalent).

  *(Self-Correction on Condorcet)*: I need to be precise. Condorcet says if $p > 0.5$, larger groups $\to$ certainty. If $p < 0.5$, larger groups $\to$ certainty of error. The risk is that without information, $p$ is low. The solution is *learning*, not just *counting*. I will frame it as "Deliberative Competence."

  *(Self-Correction on Size)*: The colleague suggested 350. I should acknowledge that but recommend a size optimized for *deliberation* (talking), not just *representation* (mirroring). 120-150 is the sweet spot for modern assemblies (like France's Climate Convention). I'll recommend 150 selected to yield 120 active.

  *(Self-Correction on Hybrid)*: The prompt asks me to choose. A hybrid often fails. I will recommend a "Sortition-First" model where the town hall is demoted to an idea-gathering phase *before* the panel meets, so the panel isn't bound by it. Actually, better to keep it clean: The Panel decides. Town halls become informational only.

  Let's write.

  *(Drafting thought)*: Start with the "To/From/Subject". Get straight to the recommendation. Use bolding for skimmability.

  *(Drafting thought)*: Make sure the "Motivation" paragraph lands hard. That's the philosophical core.

  *(Drafting thought)*: Ensure the Finance Office's concern isn't dismissed but *managed*.

  *(Final check)*: Does this sound like a planner who reads political theory? Yes, using terms like "epistemic value," "selection bias," "legitimacy."

