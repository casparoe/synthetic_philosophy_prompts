answer: |-
  Here is the spec sheet for epistemic utility functions. This breaks down what the accuracy-first program demands, where the bodies are buried, and which constraints are doing the heavy lifting.

  ### I. The Core Desiderata (The "Official" Story)

  These are the requirements usually presented as non-negotiable for any function $U(c, w)$ that measures the accuracy of a credence function $c$ at a world $w$.

  **1. Alethic Functionality (Truth-Directedness)**
  *   **The Demand:** The epistemic value of a belief state must depend solely on how closely it represents the truth. If $c_1$ is closer to the truth value of a proposition than $c_2$, $c_1$ must receive a higher score.
  *   **The Motivation:** Belief "aims at truth." If epistemology is normative, it must be because truth is the fundamental epistemic good. Anything else (pragmatic benefit, comfort) is non-epistemic.
  *   **Status:** **Genuine Constraint.** Almost everyone accepts this as the definition of *epistemic* utility, even if they think other values matter too.

  **2. Strict Propriety (Immodesty)**
  *   **The Demand:** For any probabilistic credence function $c$, $c$ expects itself to be more accurate than any alternative credence function $c'$. Formally, the expected utility of $c$ calculated by $c$ is strictly higher than the expected utility of $c'$ calculated by $c$.
  *   **The Motivation:** Rational coherence. If your current credences led you to expect that *another* credence would be more accurate, you would be rationally required to adopt that other credence immediately. Your current state should not be self-undermining.
  *   **Status:** **Smuggled Assumption.** This is the engine of the accuracy-first program, but it is highly contentious. It assumes that agents *should* evaluate expectations using their current credences as probabilities. Critics argue this begs the question against non-probabilistic norms.

  **3. Extensionality (Truth-Functionality)**
  *   **The Demand:** The accuracy score of a credence in proposition $P$ depends *only* on the credence assigned and the truth value of $P$. It does not depend on the content, the complexity, or how $P$ is described.
  *   **The Motivation:** Alethic purity. If $P$ and $Q$ are logically equivalent, they have the same truth conditions. Therefore, believing $P$ to degree $x$ should be epistemically identical to believing $Q$ to degree $x$.
  *   **Status:** **Major Cost.** This is where logical omniscience enters by the back door. If accuracy is extensional, you are penalized for failing to see that $P$ entails $Q$. It makes the theory hostile to bounded rationality.

  **4. Separability (Additivity)**
  *   **The Demand:** The total accuracy of a credence function over a set of propositions is the sum (or weighted sum) of the accuracy scores for each individual proposition.
  *   **The Motivation:** Tractability and atomism. It allows us to analyze beliefs proposition-by-proposition rather than requiring a holistic evaluation of the entire web of belief.
  *   **Status:** **Contested.** This ignores holism. Sometimes a contradiction in a remote part of your belief system undermines the value of your true beliefs elsewhere (e.g., if your true beliefs are derived from a method you know is flawed).

  ---

  ### II. The Tensions and Impossibility Results

  This is the part you need for the seminar argument. The desiderata above do not play nicely together, and satisfying them often comes at a steep philosophical price.

  **1. Extensionality vs. Bounded Rationality (The Logical Omniscience Problem)**
  *   **The Conflict:** If you accept Extensionality, you cannot distinguish between "believing a falsehood" and "failing to see a tautology."
  *   **The Result:** Standard scoring rules (like the Brier Score) treat logical equivalence as identity. If $P$ is "It will rain" and $Q$ is "It will rain or (Snow and not Snow)," a scoring rule satisfying Extensionality demands $c(P) = c(Q)$. If you are not logically omniscient, you will violate this. The utility theory then labels you as *inaccurate* for being logically ignorant, not just probabilistically incoherent.
  *   **The Cost:** To vindicate Probabilism for non-ideal agents, you have to drop Extensionality. But if you drop Extensionality, the math becomes intractable, and it's unclear how to define "distance from truth" for logical relations.

  **2. Calibration vs. Resolution**
  *   **The Conflict:** Calibration requires that when you assign credence $x$, the proposition is true $x\%$ of the time. However, you can be perfectly calibrated by having no opinion (always assigning 0.5 to everything on a fair coin).
  *   **The Result:** A "Calibration-First" desideratum conflicts with a "Truth-Directedness" desideratum that rewards informativeness. You need a scoring rule that balances calibration (reliability) with refinement (sharpness).
  *   **The Cost:** Pure calibration views fail to vindicate Probabilism in single-case scenarios (where frequencies don't exist). Pure accuracy views (like Brier) incorporate calibration but can recommend "gambling" on high credences that turn out false.

  **3. Partition Independence**
  *   **The Conflict:** Should your accuracy score change if we refine the possibility space? (e.g., scoring "Horse A wins" vs. "Horse A wins by <1 length", "Horse A wins by >1 length").
  *   **The Result:** Many proper scoring rules are sensitive to how the question is framed (the partition).
  *   **The Cost:** If accuracy depends on how you carve up logical space, then rationality depends on linguistic framing. Most accuracy theorists demand Partition Independence, but this severely limits the class of admissible scoring rules.

  ---

  ### III. The Workhorse Constraint

  **Strict Propriety is doing 90% of the work.**

  If you want to know which requirement rules out the contenders, it is this one.
  *   **Why?** Without Strict Propriety, you cannot prove that Probabilism is the unique norm. If a scoring rule is *improper*, a probabilistic agent might expect a non-probabilistic credence function to be more accurate.
  *   **The Critique:** This is the "smuggling" charge. To prove that you ought to be a Bayesian, the accuracy theorist assumes a scoring rule that only Bayesians find immodest. If you start with a non-probabilistic mindset, there are scoring rules that are "proper" relative to *your* norms but improper relative to Bayesian norms.
  *   **Seminar Point:** Challenge the justification for Propriety. Is it a conceptual truth about epistemic value, or just a mathematical convenience to get the domination theorems to work?

  ---

  ### IV. Scorecard of Main Options

  Here is how the leading contenders stack up against the desiderata.

  | View | Truth-Directedness | Strict Propriety | Extensionality | Handles Logical Omniscience? | Vindicates Probabilism? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Pure Veritism (Brier/Log)** | **Yes** (Primary good) | **Yes** (Built-in) | **Yes** | **No** (Penalizes ignorance) | **Yes** (Via domination) |
  | **Calibration-First** | **Mixed** (Focus on freq.) | **No** (Often improper) | **No** (Context sensitive) | **Yes** (Empirical focus) | **No** (Allows non-prob) |
  | **Hybrid (Understanding + Truth)** | **Yes** (Plus extra goods) | **Debatable** | **No** (Content matters) | **Yes** (Can weight complexity) | **Maybe** (Depends on weights) |
  | **Chance-Deference** | **Yes** (To objective chance) | **Yes** (Relative to chance) | **Yes** | **No** | **Yes** (If chances are prob) |

  **Quick Take:**
  *   **Pure Veritism** wins on mathematical elegance and vindicating Bayesian norms but loses on psychological realism (logical omniscience).
  *   **Calibration-First** wins on intuition for frequentist cases but loses on single-case norms and dynamic updating (Conditionalization).
  *   **Hybrid Views** (adding understanding/explanation) solve the omniscience problem but lose the formal precision that makes EUT attractive in the first place.

  ### V. Summary for the Seminar

  If you need to pick a fight, focus on **Extensionality** and **Propriety**.

  1.  **Attack Extensionality:** Argue that epistemic value *should* be sensitive to cognitive effort. Believing a complex truth via deduction is better than guessing it, even if the truth conditions are identical. Standard EUT cannot capture this.
  2.  **Attack Propriety:** Argue that "immodesty" is not a requirement of rationality but a feature of specific epistemic cultures. A skeptic might modestly expect their own credences to be flawed; EUT rules this out by fiat.
  3.  **The Preface/Peer Disagreement:** Standard EUT struggles here. In the Preface Paradox, you believe each claim in your book (high credence) but also believe there is an error (high credence in the conjunction's negation). This violates Probabilism. EUT says you are accuracy-dominated. But intuitively, this is the *rational* stance for a humble author. EUT forces you to call rational humility "inaccurate."

  The bottom line: Epistemic Utility Theory is powerful, but it buys its power by idealizing the agent into a logically omniscient, immodest Bayesian. The question is whether that idealization illuminates human rationality or replaces it with a different normative ideal.
