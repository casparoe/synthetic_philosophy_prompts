      *   *Extensionality/Truth-Functionality:* Accuracy depends only on truth values and credences, not content. Motivation: Formal tractability, alethic purity.
      *   *Logical Omniscience:* Should the score penalize failing to see logical equivalence? Motivation: Idealization vs. realism.
