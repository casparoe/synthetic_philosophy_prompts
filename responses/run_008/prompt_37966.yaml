prompt: |-
  I'm in a formal epistemology seminar and we just hit epistemic utility theory, and honestly before I pick a side between the accuracy-first people and their critics I want the spec first. So: write out the desiderata for an adequate epistemic utility function / scoring rule. What does it actually have to deliver? Things like -- it has to make credences closer to the truth score better, it can't tell you to deliberately stay miscalibrated, it should vindicate probabilism and (maybe) conditionalization rather than just building them in by hand, it has to say something about the preface paradox and peer disagreement, it can't demand logical omniscience, and there's the immodesty thing where no credence should expect some alternative to beat it by its own lights. For each requirement say what motivates it, and be honest about which ones are genuine constraints and which are just things the accuracy-first camp smuggled in as "obvious". The part I most want to see: which pairs of desiderata might be jointly unsatisfiable -- I vaguely remember there are results showing strictly proper scoring rules force you to score logically equivalent claims as equally accurate no matter what, which seems like a real cost -- and which single requirement does the most work ruling out contenders. You can do a quick scorecard of the main options at the end (pure veritism, views that add coherence or understanding as separate epistemic goods, calibration-first views) but keep it short, the criteria are the part I care about. also plz no bibliography, my prof wants us arguing not footnoting.
