answer: |-
  Dear Student,

  It is a pleasure to engage with a puzzle that cuts so cleanly to the heart of political philosophy, and I commend you for resisting the urge to simply discard your Burkean sympathies in the face of a cleverly constructed reductio. Your TA has presented you with a argument that feels airtight because it exploits a specific vulnerability in popular interpretations of conservatism, but it is not without a flaw. You asked for a definite verdict, so I will not hedge: the error lies squarely in premise two, specifically in the claim that the burden of justification can be discharged only by recovering the reason the arrangement was originally established. This premise commits a subtle but devastating genetic fallacy, conflating the historical origin of a practice with its normative justification, and rejecting it is the only way to preserve both the conservative presumption against rash change and the moral necessity of reforming evils like slavery.

  The reason this step looks so innocent is that it smuggles in a specific theory of knowledge under the guise of epistemic humility. The TA argues that because surface appearances mislead, we must dig for original intent to find the truth of an institution. This sounds deeply Burkean because it emphasizes the limits of individual reason against the wisdom of the past. However, it mischaracterizes what that wisdom consists in. For Burke, the value of tradition is not that it preserves the specific intentions of dead legislators, but that it embodies the accumulated adjustments of a society over time. A institution survives not because its founders were wise, but because it has proven adaptable and functional across generations. To insist that a reformer must uncover the original reason is to demand historical archaeology rather than political judgment. It shifts the burden from showing that a practice is currently harmful to showing that its founders were mistaken, which is an entirely different, and often impossible, task. By rejecting premise two, you acknowledge that the "accumulated knowledge" Burke speaks of is embedded in the continued existence and function of the practice, not locked away in its origin story.

  You expressed a legitimate worry that widening the definition of understanding in premise two might hollow out the principle, allowing any confident reformer to claim they understand the current function well enough to dismantle it. This is a serious concern, but it is manageable if you clarify what discharging the burden actually requires. If you reject the TA's narrow historical requirement, you do not thereby accept that a reformer's mere confidence is sufficient. The burden remains heavy because the presumption is that long-standing arrangements serve complex social functions that are not immediately apparent. To discharge the burden, a reformer must demonstrate not just that a practice seems bad, but that its removal will not cause greater social harm, or that the practice violates a higher-order principle so fundamental that it overrides the presumption of utility. This preserves the conservative insistence on caution and the complexity of social systems without demanding the impossible knowledge of ancestral motives. The principle still does conservative work because it forces the reformer to engage with the system as it is, rather than treating it as a blank slate, but it allows for the possibility that the system has become pathological over time regardless of its origins.

  Consider the cost of the alternatives to see why this is the only viable path. If you were to reject premise one, you would abandon the Burkean project entirely, conceding that there is no presumption in favor of inherited institutions and that the burden of proof lies equally on preservers and reformers. This leaves you with a radicalism that cannot account for the value of social stability. If you were to reject premise five, you would be forced to argue that the abolition of slavery or the emancipation of women was not justified because the historical origins of those institutions were obscure. This is morally untenable and historically inaccurate, as the abolitionists did not wait for historical consensus before declaring slavery an evil; they appealed to universal moral truths accessible in the present. If you were to reject premise three and claim that original reasons are usually recoverable, you would be making an empirically dubious claim that leaves you vulnerable to the many cases where history is genuinely silent or mixed. Thus, premise two is the only link that can be broken without destroying the chain of moral reasoning or the core insight of conservatism.

  Regarding your worry about premise five and retrospective certainty, it is important to note that the justification for abolishing slavery did not rely on hindsight but on moral reasoning available at the time. The abolitionists did not need to know why slavery began to know that it violated natural rights; they needed to understand what slavery *did* to human beings and the social order. This supports the rejection of premise two, because it shows that the relevant understanding is functional and moral, not genealogical. The TA's argument tries to trap you into thinking that because we cannot know the origin, we cannot know the evil. But the evil of slavery was manifest in its operation, not its inception. By holding onto this distinction, you can maintain that the burden of proof is on the reformer to show the harm, while denying that the only evidence of harm is historical intent.

  In sum, your TA has constructed a straw man of Burkeanism that equates tradition with originalism. A more robust defense of tradition argues that practices are justified by their continued service to human flourishing, not by the intentions of their founders. When you reject premise two, you are not surrendering to radicalism; you are refining the conservative insight to acknowledge that traditions can decay or become corrupt over time even if they began benignly, and that reformers can identify this corruption through an analysis of current effects rather than past causes. This allows you to keep the presumption against change, ensuring that reform is undertaken with due caution and respect for social complexity, while avoiding the moral paralysis that would forbid us from correcting grave injustices simply because their history is obscure. You can tell your TA that the burden of proof remains on the reformer, but the currency required to discharge that burden is moral and functional clarity, not historical reconstruction.
