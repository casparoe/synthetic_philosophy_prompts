  3.  **Evaluate the Steps:**
      *   **Step (1):** "A reformer who does not understand... has no standing to remove it." This is the core Burkean claim. Rejecting this undermines the whole project the user wants to defend.
      *   **Step (2):** "That burden can be discharged only by recovering the reason the arrangement was originally established." This is the critical move. It equates "understanding the function/value of a tradition" with "knowing the historical intent of its originators." This is a strong historical fallacy. Burke himself talked about prescription and accumulated wisdom, not necessarily original intent. Traditions evolve. Their current utility might differ from original intent.
      *   **Step (3):** "For most long-standing arrangements the original reason is unrecoverable." Plausible historically, but depends on (2).
      *   **Step (4):** "So for most long-standing arrangements the burden can never be discharged, and removal is never justified." This follows from (2) and (3).
      *   **Step (5):** "Yet some long-standing arrangements... were plainly justified to remove." This is the moral intuition bomb. Rejecting this makes the Burkean position morally repugnant (defending slavery).
      *   **Step (6):** Conclusion.

  4.  **Identify the Flaw:**
      *   The TA's argument hinges on defining "understanding" in a way that makes it impossible to achieve. Specifically, premise (2) asserts that justification requires recovering the *original reason*. This is the equivocation the user suspected.
      *   Burkean wisdom isn't about *origins*; it's about *survival* and *function*. The "accumulated knowledge" is embedded in the practice's continued existence and adaptation, not necessarily in the founder's mind.
      *   If I reject (2), I can replace it with a functionalist or consequentialist understanding of tradition. The burden of proof is still on the reformer, but they discharge it by showing the tradition causes harm or lacks current utility, not by archaeologically digging up original intent.
      *   Does this hollow out the principle? The user worries about this. If "understanding" just means "I think this is bad," then yes, it's hollow. But if "understanding" means "demonstrating a clear conflict with fundamental moral principles or evident social harm," it retains weight. The key is that the burden remains high, but the *method* of discharging it isn't impossible historical reconstruction.
