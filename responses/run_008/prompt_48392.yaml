answer: |-
  Here is a complete design for your ninety-minute session. It is built to be run by you with minimal interruption, relying on printed instructions and simple physical mechanics to let the math reveal itself through play.

  # Activity Title: "The Survival Game & The Market"

  ## 1. Materials Needed
  *   **Currency:** 200 "Raffle Tickets" per person (printed paper slips, distinct from money).
  *   **Coins:** 7 fair coins (or a coin flip app on your phone projected/loud).
  *   **Decks:** 2 decks of playing cards (for the Market Game).
  *   **Slips:** 14 small folded papers (7 marked "Signal A", 7 marked "Signal B").
  *   **Board:** A whiteboard or large pad to track prices and ticket counts.
  *   **Prize:** One decent bottle of wine (visible on the table).
  *   **Timer:** A phone or kitchen timer.

  ## 2. Payoff Scheme
  *   **Entry:** Everyone starts with **100 Tickets**.
  *   **Elimination:** If a player reaches **0 Tickets**, they are "Bust." They cannot play further. They sit out but stay for the discussion.
  *   **Winning:** At the end of 90 minutes, all remaining tickets from all players go into a single hat.
  *   **Prize:** Draw **one name** from the hat. That person wins the wine.
      *   *Why:* This makes every ticket valuable but ensures that having *more* tickets increases your odds linearly, while having *zero* guarantees you lose. It simulates "utility of wealth" without complex math.

  ---

  ## 3. Minute-by-Minute Plan (90 Minutes)

  ### **Part 1: Introduction (5 Minutes)**
  *   **0:00–0:05:** Welcome. Place the wine on the table. Hand out 100 tickets to each person.
  *   **Script:** "Tonight is about growing these tickets. At the end, we raffle the wine based on how many tickets you hold. If you hit zero, you're out of the raffle. There are two games. No theory, just rules."

  ### **Part 2: Game One — The Coin (30 Minutes)**
  *Goal: Experience Insight 1 (Ruin vs. Growth).*

  *   **5:00–10:00 (Setup):**
      *   Explain the bet: "We will flip a coin 10 times. It is weighted. It lands Heads 60% of the time." (Do not explain *how* you know, just state it as a rule of the game).
      *   Payout: Even money. Bet 10 tickets on Heads, win 10. Bet 10 on Tails, lose 10.
      *   Rule: "Before each flip, write down your bet on this slip. You cannot bet more than you have. You must bet at least 5 tickets unless you have less." (Forces action).
  *   **10:00–25:00 (Play):**
      *   Run the 10 flips. (Allow 1.5 mins per flip for writing bets, collecting, flipping, paying).
      *   **Crucial:** Announce the result of every flip loudly. Track the "Busts" on the whiteboard.
      *   *Facilitator Note:* If someone goes bust, announce it. "John is out."
  *   **25:00–30:00 (Tally):**
      *   Count final tickets. Do not reveal strategies yet. Just collect the final numbers.
      *   Ask: "Who ended with more than 100 tickets? Who ended with zero?"

  ### **Part 3: Game Two — The Market (40 Minutes)**
  *Goal: Experience Insight 2 & 3 (Voting vs. Trading).*

  *   **30:00–35:00 (The Vote):**
      *   Proposition: "Will the top card of this shuffled deck be Red?" (True probability 50%).
      *   **Twist:** Hand out the Secret Slips.
          *   7 people get **Signal A**: "Your private research suggests an 85% chance of Red."
          *   7 people get **Signal B**: "Your private research suggests a 15% chance of Red."
      *   **Task 1:** Everyone writes down their "% Confidence" on a card and hands it to you.
      *   **Action:** Calculate the **Arithmetic Average** of these confidences on the whiteboard. (It should be exactly 50%).
      *   **Script:** "The Group Vote says 50%. This is our 'Committee Price'."

  *   **35:00–55:00 (The Trade):**
      *   **Task 2:** Pair up (one Signal A with one Signal B).
      *   **Goal:** "You want to maximize your ticket count for the final raffle. You may make a bet with your partner using your tickets."
      *   **Mechanism:** They must agree on a **Price** for a "Red Ticket."
          *   Example: If they agree on 60 cents, the Signal A person buys a ticket for 60 tickets from Signal B. If Red comes up, ticket pays 100. If Black, pays 0.
          *   They can make multiple small trades or one big trade.
      *   **Instruction:** "Imagine you will play this trading game every week for a year. Don't just win this hand; stay in the game." (This primes Kelly/Geometric thinking without naming it).
      *   Let them negotiate for 20 minutes. Walk around and listen. Do not interfere.

  *   **55:00–65:00 (Settlement):**
      *   Record the **Agreed Price** from each of the 7 pairs on the whiteboard.
      *   Calculate the **Average Market Price**.
      *   Reveal the card. Settle the bets.
      *   Compare the **Average Market Price** to the **Committee Vote (50%)**.

  ### **Part 4: The Debrief (25 Minutes)**
  *Goal: Map experience to your three insights.*

  *   **65:00–75:00 (Discuss Game 1 - Ruin):**
      *   Ask the busts: "You had a favorable coin (60%). Why are you out?"
      *   Ask the winners: "What was your bet size?"
      *   **Your Script:** "Most of you who went bust bet too big. Mathematically, betting everything on a 60% coin gives the highest *average* winnings, but it guarantees you eventually hit zero. The winners likely bet smaller. You sacrificed 'maximum average' for 'survival.' That is the first lesson: **In repeated games, survival beats maximum average.**" (Maps to Insight 1).

  *   **75:00–85:00 (Discuss Game 2 - The Price):**
      *   Point to the whiteboard. "The Vote averaged to 50%. Did your trading prices average to 50%?"
      *   If they settled higher (e.g., 60-70%): "Why did the price move away from the vote?"
      *   **Your Script:** "When you voted, you averaged percentages. When you traded, you were risking tickets. The people who were very sure (85%) were willing to pay more to buy than the unsure people were willing to sell. The price didn't meet in the middle of the *percentages*; it met in the middle of the *odds*. The market price reflected how much conviction people had, not just what they thought." (Maps to Insight 2).
      *   "If the Committee had bet at 50%, the 85% people would have bet against the Committee. The money would have forced the price to move. A vote ignores the incentive to trade." (Maps to Insight 3).

  *   **85:00–90:00 (Close):**
      *   Put tickets in the hat. Draw the winner. Pour the wine.
      *   **Final Thought:** "I've been studying how to size bets. Tonight proved that how much you bet matters as much as what you bet on. Next time, we can talk about the math of why."

  ---

  ## 4. The Debrief (Plain Language Script for You)
  *Use this to guide your talking points during the 25-minute debrief.*

  **On Insight 1 (The Coin):**
  "Many of you noticed that betting big felt exciting but ended in disaster. In math, we call this 'Expected Value' versus 'Geometric Growth.' Expected Value says if you bet 100% on a 60% coin, you should get rich. But it ignores the 'absorbing barrier'—the moment you hit zero, the game ends for you. The winners tonight intuitively practiced 'Kelly sizing.' They bet enough to grow, but not enough to die. You discovered that **compounding requires survival.**"

  **On Insight 2 (The Market Price):**
  "In the second game, the group vote was 50%. But I suspect your trading prices settled higher, perhaps around 65%. Why? Because a vote averages *opinions*, but a market averages *conviction*. The person who was 85% sure had more 'force' behind their belief than the person who was 15% sure. When you trade with skin in the game, the price moves toward the geometric mean of the odds, not the arithmetic mean of the probabilities. **Prices aggregate confidence, not just guesses.**"

  **On Insight 3 (The Committee):**
  "Finally, imagine if this group voted to bet our entire club fund at 50% odds. The members who held the 85% signal would immediately bet against the club. The club would lose money to its own members. A committee vote assumes everyone agrees to hold the position. A market assumes everyone is allowed to change their mind. **Voting creates a static price; trading finds the true price.**"

  ---

  ## 5. Honest Critique: What Will Go Wrong
  *You asked for honesty. Here is the reality of running this with novices in 90 minutes.*

  **1. The "Log-Odds" Result is Fragile**
  *   **The Risk:** In Insight 2, you expect the price to settle at ~66% (the geometric mean of odds). Untrained humans almost *never* do this spontaneously. They default to "splitting the difference" (50%).
  *   **Why:** Calculating odds requires mental effort. Negotiating a price feels like compromising.
  *   **Mitigation:** If they settle at 50%, do not claim failure. Use it! "You averaged the percentages. That's why markets exist—so people who understand *conviction* can take money from people who just average *opinions*."
  *   **Limitation:** A 90-minute game cannot reproduce the "Long Run." Kelly works over hundreds of bets. In 10 flips, a Kelly bettor can still lose to an All-In bettor by luck. You must emphasize that the *risk of ruin* is the lesson, not necessarily who won the most tickets tonight.

  **2. Collusion and "Friendly" Betting**
  *   **The Risk:** Since these are friends/poker mates, Signal A and Signal B might just split the pot 50/50 to guarantee a small profit for both, ignoring the "market price."
  *   **Mitigation:** Remind them during instructions: "This is a raffle. You need *more* tickets than your partner to win the wine. Cooperation lowers your chance of winning the bottle."

  **3. Cognitive Load**
  *   **Risk:** Tracking ticket counts, calculating bets, and negotiating prices is exhausting for 14 people.
  *   **Mitigation:** Appoint two "Bankers" from the group (people good with arithmetic) to handle payouts in Game 1 so you can focus on facilitation.

  **4. The "House Money" Effect**
  *   **Risk:** Because the tickets aren't real cash, people might bet 100% in Game 1 just for fun, ruining the lesson on ruin.
  *   **Mitigation:** The Wine Prize is critical. Remind them repeatedly: "Zero tickets means zero chance at the wine." Make the prize desirable.

  **5. What You Cannot Reproduce**
  *   **Continuous Time:** Real markets move continuously. Your game is discrete rounds.
  *   **Infinite Horizon:** Kelly is optimal as $N \to \infty$. In 10 rounds, variance dominates.
  *   **True Information:** In Game 2, the "Signals" are assigned, not earned. Real confidence comes from work.
  *   **Conclusion:** You are not proving the math tonight. You are **creating a shared vocabulary.** When you mention "Ruin" or "Market Price" next month, everyone will remember the night John went bust on the coin flip, or how the trading price didn't match the vote. That is a successful meeting.
