answer: |-
  # Decision Tree: The Scale Problem in Insect Ethics

  **Starting Point:** *"I am unsure whether insects are sentient."*

  ---

  ### **Node 1: The Lottery of Harm**
  **Case:** A factory produces 10,000 toys. There is a 1% statistical chance that any single toy contains a defect that causes a minor electric shock to the child using it. No specific toy is known to be defective.
  **Question:** Do you treat the *expected* 100 shocks as a real moral tragedy requiring a recall, or do you say "no specific child is definitely harmed" and ignore the statistics?
  *   **(A) The statistics count:** Expected harms sum up across probabilities. → *Go to Node 2*
  *   **(B) Only actual harms count:** Without certainty, there is no moral injury. → *Go to Node 3*

  ### **Node 2: The $1,000 Donation**
  **Case:** You have $1,000 to reduce suffering. Based on the math from Node 1 (probabilities count), the sheer number of insects suggests your money saves more "expected sentient moments" if spent on insect welfare (e.g., pesticide reform) than on chicken welfare (e.g., cage-free campaigns), even though chickens are much more likely to be sentient.
  **Question:** Is this conclusion (Insects > Chickens) a correct application of your principle, or is it a sign that the principle is broken?
  *   **(A) Correct Application:** The numbers speak for themselves; insects dominate. → *Go to Node 6*
  *   **(B) Broken Principle:** The result is absurd; vertebrates must matter more. → *Go to Node 4*

  ### **Node 3: The "Just in Case" Policy**
  **Case:** You are about to spray pesticide in your garden. You believe there is only a 1% chance the insects feel pain (so you rejected Node 1). However, if they *do* feel pain, the harm is severe.
  **Question:** Does the mere *risk* of causing severe suffering obligate you to avoid the spray, even if the probability doesn't "count" mathematically?
  *   **(A) Yes, avoid the risk:** We should err on the side of caution. → **Leaf 1: The Precautionary View**
  *   **(B) No, wait for proof:** Without confirmed sentience, insects are objects. → **Leaf 2: The Deflationary Option**

  ### **Node 4: The Credence Floor**
  **Case:** To avoid the "Insects > Chickens" result from Node 2, you need to discount the insects.
  **Question:** Do you argue that a probability below a certain point (e.g., <5%) counts as *zero* moral status, regardless of how many insects there are?
  *   **(A) Yes, there is a floor:** Tiny probabilities vanish when multiplied. → **Leaf 3: The Threshold View**
  *   **(B) No, probabilities never vanish:** The math works, but something else saves the chicken. → *Go to Node 5*

  ### **Node 5: The Intensity Scale**
  **Case:** You accept the probabilities count (Node 1) and refuse a hard cutoff (Node 4), but still prioritize chickens.
  **Question:** Do you argue that an insect's pain is intrinsically *less intense* or *less valuable* than a chicken's pain (e.g., 1 unit vs. 100 units), independent of the probability?
  *   **(A) Yes, pain is lesser:** Insect experience is fainter or morally lighter. → **Leaf 4: The Weighted View**
  *   **(B) No, pain is equal:** A unit of pain is a unit of pain. → **Leaf 5: Diagnosed Instability** *(See Analysis Below)*

  ### **Node 6: The Human Hand**
  **Case:** You accept that insects dominate the moral calculus (Node 2). You see a field where insects are dying naturally of drought, and a farm where insects are killed for feed.
  **Question:** Does your obligation apply equally to the wild insects (drought) and the farmed insects (human-caused), or only to the ones we directly harm?
  *   **(A) Only direct harm:** We are responsible for what we cause, not nature. → **Leaf 6: The Contextualist View**
  *   **(B) All suffering counts:** Suffering is bad regardless of the cause. → **Leaf 7: The Expected-Value Aggregator**

  ---

  ### **Leaf 8: Flagged Indistinction**
  **Note on Leaves 3 & 4:** The **Threshold View** (Node 4A) and the **Weighted View** (Node 5A) are flagged as difficult to separate in practice. A participant may claim they have a "probability floor" when they actually mean "moral weight is so low it functions as a floor." The tree separates them logically (one denies the probability counts, the other denies the value counts), but psychologically they often yield identical policy recommendations.

  ### **Analysis of Leaf 5: Diagnosed Instability**
  **Position:** *Aggregates Probabilities + Rejects Insect Dominance + No Credence Floor + No Weight Difference.*
  **Diagnosis:** This combination is theoretically unoccupied/unstable. If you accept expected value aggregation (Node 1), reject a probability cutoff (Node 4), and admit insect/chicken pain is equal (Node 5), you logically *must* accept that insects dominate (Node 2). A participant landing here is likely relying on an unstated "Species Essentialism" (vertebrates matter simply because they are vertebrates) which contradicts the sentience-based premises of the workshop. This leaf serves as a prompt to re-examine Node 1 or Node 5.

  ---

  ### **Summary of Positions (Leaves)**

  1.  **The Precautionary View:** Insect sentience is unproven, but the risk is too high to ignore. We minimize harm not because we *know* they suffer, but because we can't afford to be wrong.
  2.  **The Deflationary Option:** Insects are biological machines. Without proof of sentience, they hold no moral status. Uncertainty does not generate obligation.
  3.  **The Threshold View:** Probabilities of sentience below a certain level (e.g., 1%) are treated as zero. The vast numbers of insects cannot overcome the tiny credence.
  4.  **The Weighted View:** Insect sentience is possible and probabilities count, but the *intensity* or *moral weight* of insect experience is vastly lower than vertebrates, preserving the priority of cows/chickens.
  5.  **Diagnosed Instability:** (See Analysis above).
  6.  **The Contextualist View:** Insect welfare matters massively, but only regarding human-caused harm (farming/pesticides). We are not obligated to fix wild predation or natural death.
  7.  **The Expected-Value Aggregator:** The math is uncompromising. $10^{18} \times 1\%$ outweighs $10^{10} \times 90\%$. Insect welfare is the primary moral priority of our time, wild or farmed.
