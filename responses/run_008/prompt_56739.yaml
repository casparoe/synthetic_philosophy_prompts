answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Topic:** Epistemology (Williamson on Luminosity)

  **Question:**

  Williamson's anti-luminosity argument aims to show that no non-trivial condition is "luminous," where a condition is luminous if, whenever it obtains, the subject is in a position to know that it obtains. The argument relies on a series of cases where a subject gradually warms up from feeling clearly cold to feeling clearly warm. Williamson argues that knowledge requires a margin for error: if you know you feel cold in a specific case, you must feel cold in any sufficiently similar case. Since the change is gradual, there are adjacent cases where you cannot discriminate the difference. If luminosity held, you would know you are cold in the first case; by the margin for error principle, you would have to be cold in the next; iterating this pushes the requirement until it covers cases where you are clearly not cold, generating a contradiction. Thus, there must be cases where you feel cold but are not in a position to know it.

  In a recent seminar, a debate arose regarding this conclusion. The "Repairer" argued that luminosity should only be claimed for *clear* cases of feeling cold, excluding the borderline cases where the argument gains traction. The "Presser" replied that this retreat is fatal: either there is a sharp, knowable boundary between clear and unclear cases (which the same margin-for-error reasoning rules out), or the boundary is unknowable, in which case the subject cannot know they are in the "clear" zone, rendering the repaired thesis too weak to support the privileged access often associated with luminosity. The Repairer countered that perhaps that privileged access was never guaranteed to begin with.

  Write an essay adjudicating this dispute. Is the retreat to clear cases a legitimate repair of the luminosity thesis, or does it succumb to the Presser's dilemma? Crucially, explain how your verdict bears on the KK principle (the claim that if one knows $p$, one is in a position to know that one knows $p$). In your answer, distinguish between the logical structure of Williamson's argument and the contested epistemological premises it relies upon.

  ***

  **Model Answer**

  Williamson's argument functions as a sorites-style paradox applied to knowledge. The engine of the argument is the margin-for-error principle: because our discriminative capacities are finite, knowledge in one case requires the truth of the belief in nearby cases. If feeling cold were luminous, one would know one feels cold in every case where one does. But since the transition from cold to warm is gradual, there are adjacent cases indistinguishable to the subject. If one knows one is cold in case $i$, the margin for error requires one is cold in case $i+1$. Iterating this leads to the absurd result that one is cold even in cases of clear warmth. Therefore, luminosity fails.

  The Repairer attempts to halt this iteration by restricting luminosity to "clear" cases. The idea is that the margin-for-error pressure only applies where discrimination is difficult; in clear cases, the signal is strong enough to sustain knowledge. However, the Presser correctly identifies that this restriction merely shifts the target. For the Repairer's thesis to hold, the condition "it is a clear case that I am cold" must itself be luminous. If it is not, then in a case where it is clearly cold, the subject may not be in a position to know that it is *clearly* cold.

  This generates the Presser's dilemma. First, if there is a sharp boundary between clear and unclear cases, Williamson's margin-for-error reasoning applies to that boundary just as it did to the coldness itself. We cannot know exactly where clarity ends, so we cannot know we are safely on the "clear" side. Second, if the boundary is vague or unknowable, then the subject cannot distinguish clear coldness from borderline coldness. Consequently, even if one is in a clear case, one cannot know one is in a clear case. The repaired thesis becomes: "When I am clearly cold, I am cold." This is trivial. It fails to deliver the epistemic security luminosity was meant to provide, namely, that one's perspective on one's mind is uniquely authoritative.

  The implications for the KK principle are direct. A strong KK principle requires that the condition of knowing $p$ be luminous. If I know I am cold, KK implies I am in a position to know I know I am cold. But if luminosity fails—even restricted to clear cases—then I cannot always know that I am in the epistemic position of knowing. If I cannot distinguish clear cases from borderline ones, I cannot know that my belief constitutes knowledge rather than mere true belief. Thus, accepting Williamson's conclusion (or the Presser's critique of the repair) entails rejecting KK for phenomenal states.

  However, it is vital to distinguish the argument's validity from the truth of its premises. The logical structure is widely accepted as valid. What remains contested is the margin-for-error premise itself. Critics argue that knowledge might not require safety across indiscriminable cases if one's evidence is factive. Others suggest a "cognitive home" exception, where phenomenal states resist the margin-for-error constraints applied to external world beliefs. A candidate defending the Repairer might argue that phenomenal clarity provides a kind of evidence that stops the slide, though they must admit this rejects the standard safety condition on knowledge. Therefore, while the anti-luminosity argument successfully blocks luminosity *given* Williamson's epistemology, it does not settle the debate without first settling the nature of the knowledge relation.

  ***

  **Marking Scheme**

  **Total Marks:** 20
  **Structure:** 5 Key Points (4 marks each).

  **1. Reconstruction of the Margin-for-Error Mechanism (4 marks)**
  *   **Requirement:** Candidate explains that the argument relies on the inability to discriminate adjacent cases forcing a safety condition (if you know in $i$, it must be true in $i+1$).
  *   **Common Pitfall:** Treating this as a standard sorites paradox about vagueness in the world, rather than a constraint specifically on *knowledge* and discriminability.
  *   **Note:** Award full marks if they note this applies to the subject's epistemic position, not just the temperature.

  **2. Analysis of the 'Clear Case' Restriction (4 marks)**
  *   **Requirement:** Candidate articulates that for the repair to work, the property of *being a clear case* must itself be luminous.
  *   **Common Pitfall:** Accepting the Repairer's move at face value without noting that "clarity" is itself a condition subject to evaluation.
  *   **Note:** Candidates must see that restricting the domain does not remove the epistemic requirement within that domain.

  **3. The Presser's Dilemma (Boundary vs. Triviality) (4 marks)**
  *   **Requirement:** Candidate explains that a sharp boundary of clarity is unknowable (due to margin for error), while an unknowable boundary makes the thesis trivial (subject can't know they satisfy the condition).
  *   **Common Pitfall:** Focusing only on the sharp boundary horn and missing the point that an unknowable boundary defeats the anti-skeptical purpose of luminosity.
  *   **Note:** Must connect the unknowability of the boundary to the failure of privileged access.

  **4. Implications for the KK Principle (4 marks)**
  *   **Requirement:** Candidate links the failure of luminosity to the failure of KK (if you can't know you're in a clear case, you can't know you know).
  *   **Common Pitfall:** Stating KK is false without explaining *why* luminosity is a prerequisite for KK in this context.
  *   **Note:** Look for the connection: KK requires knowing one's epistemic status; non-luminosity denies this is always possible.

  **5. Meta-Epistemological Awareness (Settled vs. Contested) (4 marks)**
  *   **Requirement:** Candidate distinguishes between the validity of Williamson's argument (settled) and the truth of the safety/margin-for-error premise (contested). Explicitly flags that rejecting the premise is a live option.
  *   **Common Pitfall:** Presenting Williamson's conclusion as established fact or orthodoxy, ignoring challenges from factive evidence or cognitive home theorists.
  *   **Note:** **Crucial:** Award full marks only if the candidate explicitly identifies the safety premise as the point of contention rather than the logic.
