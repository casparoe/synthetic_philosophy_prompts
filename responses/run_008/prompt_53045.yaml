      *   *Focus on the definition of "Task".* In Zeno, the "tasks" are retrospective descriptions. In the Lamp, they are prospective instructions. This is a crucial distinction.
      *   *Benacerraf's Point:* Paul Benacerraf's 1962 paper "Tasks, Super-Tasks, and the Modern Eleatics" is the key reference here. I should incorporate his insight without necessarily name-dropping excessively (unless it adds authority). The key is that the state at the limit is not logically determined by the states *before* the limit.
