      *   *Verdict:* It's not *just* OOD. It's about the *prior* over world dynamics. ML lacks a "nothing changes" prior unless explicitly architected (e.g., residual connections).

  6.  **Refining the Tone:**
      *   Must sound like an engineer talking to an engineer.
