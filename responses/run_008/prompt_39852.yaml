      *   **Key Question:** Is the Frame Problem just OOD generalization + bounded compute, or is there something structurally missing from ML vocabulary?
      *   **Constraint:** Do not smuggle in ML assumptions and call them translation. Be honest about mismatches.

  2.  **Deconstruct the Frame Problem (Philosophical Side):**
      *   *Origin:* McCarthy & Hayes (1969). Logical representation of change.
      *   *Narrow Frame Problem:* How to represent *what doesn't change* without writing infinite frame axioms (e.g., if I pick up a block, its color doesn't change, the wall doesn't move, etc.).
      *   *Yale Shooting Scenario:* A specific counter-example showing that simple non-monotonic logic solutions fail to capture causal temporal sequences correctly (gun loads, waits, shoots -> victim dies? Logic says maybe not).
      *   *Dennett's Robot:* R1, R2, R3. The robot tries to deduce all implications of an action. R1 deduces the wall color doesn't change. R2 deduces the wagon won't explode. R3 (the "successful" one) tries to distinguish *relevant* implications from *irrelevant* ones but gets stuck in infinite deliberation.
      *   *Broad Frame Problem (Relevance):* How does an agent know *which* facts are relevant to its current goal without checking everything? This is the combinatorial explosion of relevance.
      *   *Shanahan's Distinction:* Narrow is representational (logic). Broad is cognitive/architectural (relevance/attention).

  3.  **Translate to ML Vocabulary (The "Restatement"):**
      *   *World Model:* The agent's internal representation of state $S_t$.
      *   *Transition Function:* $P(S_{t+1} | S_t, A_t)$.
      *   *Narrow Frame Problem:* How to parameterize the transition function efficiently. If the state vector is huge, most dimensions are invariant to action $A_t$. Explicitly modeling $S_{t+1}^i = S_t^i$ for all invariant $i$ is parameter-inefficient.
      *   *Yale Shooting:* Temporal credit assignment / Causal discovery in sequence modeling. If the model learns correlations, it might fail on counterfactuals involving delayed effects (waiting with a loaded gun).
      *   *Dennett's Robot:* Inference time compute. R1/R2 = Unbounded rollout. R3 = Trying to prune the search tree of consequences.
      *   *Broad Frame Problem:* Attention mechanisms / Feature selection. Which parts of the context window or state vector matter for the current decision?
      *   *Relevance:* The loss landscape doesn't explicitly penalize "thinking about irrelevant things" unless it impacts the final reward prediction.

  4.  **Drafting the Residue Report (Mapping & Mismatches):**
      *   *Match 1: Narrow Frame Problem $\rightarrow$ Inductive Biases in Dynamics Models.*
          *   ML solves this via architecture (sparse attention, object-centric representations, factorized dynamics). We don't write axioms; we learn sparsity.
      *   *Match 2: Broad Frame Problem $\rightarrow$ Attention / Context Pruning.*
          *   Transformers solve "what to look at" via attention scores. RL solves it via state abstraction.
      *   *Match 3: Dennett's Relevance $\rightarrow$ Reward Shaping / Auxiliary Losses.*
          *   We guide relevance via loss functions.
      *   *Mismatch 1: Semantics vs. Statistics.*
          *   Philosophy cares about *meaning* (color *is* a property). ML cares about *prediction* (pixel values correlate). The "aboutness" is missing.
      *   *Mismatch 2: The "Default" Assumption.*
          *   Logic assumes things stay the same unless changed (inertia). ML assumes nothing stays the same unless the loss forces it (distribution shift is always possible).
