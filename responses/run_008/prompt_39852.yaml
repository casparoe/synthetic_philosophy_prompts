answer: |-
  Here is the translation of the Frame Problem into your native stack, followed by the residue report on what survives the compilation.

  ### Part 1: The Frame Problem Restated (ML Dialect)

  **1. The Narrow Frame Problem (McCarthy & Hayes, 1969)**
  *   **Philosophical Original:** In logical planning, if an agent performs action $A$, how do you represent that $A$ changes fact $X$ without explicitly writing axioms stating that $A$ does *not* change facts $Y, Z, \dots, \infty$?
  *   **ML Restatement:** **Transition Sparsity & Parameter Efficiency.**
      You are training a world model $f_\theta(S_t, A_t) \to S_{t+1}$. Your state vector $S$ is high-dimensional (e.g., pixel space or a large feature set). When you take an action, only a tiny subspace of $S$ changes (locality).
      The "Narrow Frame Problem" is the inefficiency of forcing the model to learn or represent the identity function $S_{t+1}^i = S_t^i$ for every invariant dimension $i$ at every step. If your architecture doesn't enforce sparsity (e.g., via residual connections, object-centric slots, or sparse attention), you waste compute and data capacity re-learning that the background stays static every time the agent moves.

  **2. The Yale Shooting Scenario (Hanks & McDermott, 1987)**
  *   **Philosophical Original:** A logical puzzle showing that simple "inertia" defaults fail in non-monotonic logic. A gun is loaded, you wait, you shoot. Logic systems struggled to conclude the victim dies without also allowing models where the gun spontaneously unloads during the wait.
  *   **ML Restatement:** **Causal Discovery vs. Spurious Temporal Correlations.**
      You have a sequence: `Load` $\to$ `Wait` $\to$ `Shoot` $\to$ `Death`.
      A purely predictive model (minimizing next-token or next-state loss) might learn that `Wait` correlates with `Unloaded` if its training data contains failed attempts. The problem is distinguishing **causal persistence** (the gun stays loaded unless an unloading event occurs) from **statistical correlation** (guns are often found unloaded after waiting).
      This is a failure of **counterfactual robustness**. If you intervene on the `Wait` step, does the model preserve the latent `Loaded` state correctly? If your world model is just a next-step predictor without causal structure, it fails the Yale test under OOD interventions.

  **3. Dennett's Robot (R1, R2, R3)**
  *   **Philosophical Original:** R1 deduces all implications of an action (too slow). R2 deduces all non-implications (too slow). R3 tries to tag relevance but gets stuck deliberating on which tags are relevant.
  *   **ML Restatement:** **Inference-Time Compute vs. Pruning Heuristics.**
      *   **R1:** An agent that runs a full MCTS rollout or processes the entire context window for every micro-decision. It captures all dependencies but blows the compute budget.
      *   **R2:** An agent that tries to explicitly mask out irrelevant tokens/state features but spends more compute computing the mask than saving on the forward pass.
      *   **R3:** An agent with an attention mechanism or a gating network. It tries to learn a policy for *what to attend to*. The "Frame Problem" here is the **meta-learning problem**: How do you train the gating mechanism to ignore irrelevant features without needing to evaluate them first to know they're irrelevant? If the gating function is imperfect, you get catastrophic forgetting or attention collapse.

  **4. Shanahan's Distinction (Narrow vs. Broad)**
  *   **Philosophical Original:** The Narrow problem (representation of change) is solvable. The Broad problem (relevance) is the real AI-hard problem.
  *   **ML Restatement:** **Architecture vs. Objective.**
      *   **Narrow:** Solved by inductive biases (Transformers, ResNets, World Models with skip connections). We have architectures that assume "most things don't change."
      *   **Broad:** This is **Feature Relevance under Bounded Compute.** It's not about representation anymore; it's about the loss landscape. Does the reward signal $R$ provide enough gradient information to tell the agent *which* of the million input dimensions were actually relevant to the success? This is the **Credit Assignment Problem** scaled to semantic relevance.

  ---

  ### Part 2: The Residue Report

  Here is the mapping of the philosophical concepts to your engineering reality.

  #### 1. Direct Maps (High Fidelity)
  *   **Narrow Frame Problem $\to$ Inductive Biases for Dynamics.**
      *   *Translation:* We don't write frame axioms; we build architectures that assume $S_{t+1} \approx S_t$ by default (residual streams, latent dynamics).
      *   *Status:* Largely solved in practice. If your model fails this, your architecture is wrong for the domain.
  *   **Broad Frame Problem $\to$ Attention / Context Management.**
      *   *Translation:* "What is relevant?" is exactly what attention scores compute.
      *   *Status:* Solved statistically, not logically. The model learns relevance from data, not from first principles.
  *   **Dennett's Relevance $\to$ Auxiliary Losses / Regularization.**
      *   *Translation:* We force relevance learning by penalizing compute (e.g., sparse MoE, attention entropy regularization).

  #### 2. Distorted Maps (Requires Semantic Stretching)
  *   **Yale Shooting $\to$ OOD Generalization.**
      *   *Distortion:* In philosophy, Yale Shooting is a failure of *logic* (entailment). In ML, it's a failure of *distributional shift*.
      *   *Why it distorts:* Logic demands truth preservation. ML demands loss minimization. If the "gun unloads spontaneously" minimizes loss on the training set (e.g., because of noisy data), the ML agent accepts it as truth. The ML version is weaker; it's about robustness, not validity.
  *   **Inertia $\to$ Temporal Smoothness Priors.**
      *   *Distortion:* Philosophers treat inertia as a default logical rule (things stay same *unless*). ML treats inertia as a statistical regularity (things *usually* stay same).
      *   *Why it distorts:* If you train an RL agent in a chaotic environment where everything changes every step, it learns no inertia. The philosophical frame problem assumes inertia is *a priori*; ML learns it *a posteriori*.

  #### 3. No Counterpart (Structural Mismatches)
  *   **Semantic Grounding / "Aboutness".**
      *   *The Gap:* The Frame Problem assumes the agent knows what "color" or "location" *means* and why they are distinct properties.
      *   *ML Reality:* Your agent sees embeddings. It doesn't know "color" is a property that *should* be invariant to "location" changes unless the data enforces it. There is no ontological structure in a transformer, only co-occurrence statistics.
  *   **The Normative "Should".**
      *   *The Gap:* Shanahan's Broad Frame Problem asks: "Which facts *ought* the agent to consider?"
      *   *ML Reality:* ML only answers: "Which facts *did* the agent use to minimize loss?" There is no vocabulary for "relevant but ignored" unless it impacts the reward. If an agent ignores a crucial safety constraint that hasn't been violated yet (reward=0), ML calls that "optimal policy." Philosophy calls that "framing error."
  *   **Logical Consistency vs. Probabilistic Coherence.**
      *   *The Gap:* The Frame Problem is worried about contradictions (A and not-A).
      *   *ML Reality:* We are worried about calibration and perplexity. A model can be logically inconsistent (hallucinate) but still have low loss. The "problem" of maintaining a consistent world model is not enforced by the objective function.

  ---

  ### Part 3: The Verdict

  **Is the residue just OOD generalization under bounded compute restated in 1980s terms?**

  **Mostly, yes. But with one critical structural exception.**

  **The "Yes" part:**
  Dennett's Robot is literally a description of inference-time compute budgets. Shanahan's Relevance is literally feature selection / attention. The Yale Shooting Scenario is literally a test for causal OOD generalization (does the model generalize to the counterfactual where the wait time is longer?). If you have infinite data and infinite compute, the ML Frame Problem vanishes. You brute-force the correlations.

  **The "No" part (The Structural Gap):**
  There is a question your vocabulary structurally cannot ask: **"What is the default state of the world?"**

  In GOFAI (Good Old-Fashioned AI), the default is *stasis*. You have to justify change.
  In ML (RL/LLM), the default is *noise*. You have to justify stability.

  Your world models assume $P(S_{t+1} | S_t)$ is arbitrary unless constrained by data. The philosophical Frame Problem assumes the world has an ontological structure where properties persist unless acted upon.
  *   **ML:** "I predict the wall color changes because my loss function didn't penalize it enough."
  *   **Philosophy:** "You shouldn't even have hypothesized the wall color changed."

  **The Unaskable Question:**
  Your vocabulary handles **prediction error** (loss) and **generalization error** (OOD). It does not handle **ontological error**.
  If your agent learns a world model where "picking up a block" changes "the year," and this prediction is statistically valid in your training set (e.g., a buggy simulator), your agent has not committed a Frame Error in ML terms. It has minimized loss. In philosophical terms, it has failed to understand the *category* of the properties involved.

  **Conclusion:**
  The Frame Problem in 2024 is the **Inductive Bias Gap**.
  We solve the Narrow Frame Problem with architecture (ResNets, Attention).
  We solve the Broad Frame Problem with data scaling (throwing compute at relevance).
  But we have no solution for the **Semantic Frame Problem**: ensuring the agent's latent space aligns with human ontological categories (objects, properties, persistence) rather than just statistical co-occurrence.

  When alignment researchers bring up the Frame Problem, they are usually warning you that **scaling alone does not guarantee the agent learns the right "defaults" for reality.** They are worried that under distributional shift (OOD), your agent won't default to "things stay the same," it will default to "anything predicted by the weights," which might include hallucinated side-effects that are statistically plausible but ontologically impossible.

  **Translation:** You call it "hallucination under distributional shift." They call it "failure of frame inertia." It's the same bug, but they are worried about the *reason* (lack of semantic grounding), and you are worried about the *metric* (increased KL divergence).
