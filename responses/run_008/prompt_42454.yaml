answer: |-
  Here is a teaching plan designed for a 90-minute session. It prioritizes structural logic over historical chronology, leveraging your background in systems thinking to treat the political mechanism as an engineering problem.

  ### Session Goal
  Move the group from viewing sortition as a "gimmick" to viewing it as a distinct **selection technology** with specific trade-offs, comparable to elections.

  ### 1. The Foundation: Reframing Selection (Minutes 0–20)
  **Objective:** Dislodge the assumption that elections are the only legitimate way to select leaders.
  **Why first:** If you propose sortition before challenging the default status of elections, it sounds like a prank. You must normalize the concept of "selection mechanisms" first.

  *   **The Hook:** Do not start with Athens. Start with a list of selection methods used in history or current life: Inheritance (Monarchy), Appointment (Bureaucracy/Supreme Court), Merit/Exam (Civil Service), Election, and Sortition (Lottery).
  *   **The Athenian Pivot:** Introduce the Aristotelian distinction early.
      *   *Concept:* Elections favor the "notable" (rich, famous, loud). The Athenians viewed elections as **aristocratic** (rule by the best/elite).
      *   *Concept:* Sortition favors the "average." They viewed the lot as **democratic** (rule by the people).
      *   *Takeaway:* Elections are not "neutral"; they systematically select for specific traits (wealth, charisma, ruthlessness). Sortition selects for *representativeness*.
  *   **Seismologist Analogy:** Compare it to sensor networks. An election is like placing sensors only where the signal is strongest (cities/elites). Sortition is a grid array that captures the background noise (the silent majority) equally.

  ### 2. The Core Example: The Modern Citizens' Assembly (Minutes 20–50)
  **Recommendation:** Use a **Modern Citizens' Assembly** (specifically the **Irish Constitutional Convention/Assembly** model) rather than a Jury or a fictional legislature.
  *   **Why not a Jury?** Juries decide *facts* based on existing law. Legislators decide *values* to create new law. The cognitive load is different. Using juries invites the "courts vs. laws" confusion.
  *   **Why not Fictional?** Designing a mini-legislature eats 45 minutes and risks becoming a game rather than an analysis.
  *   **Why the Irish Assembly?** It is real, recent, and dealt with polarizing legislative issues (abortion, climate change) that elected politicians were avoiding.
  *   **What the Example Must Have:**
      *   **Stratified Random Selection:** Explicitly show how they matched the population demographics (age, gender, geography).
      *   **Deliberation Time:** Emphasize they met over weekends for months, not one afternoon.
      *   **Expert Testimony:** They heard from advocates on *both* sides before voting.
  *   **What the Example Must Lack:**
      *   **Campaigning:** No fundraising, no ads, no parties.
      *   **Re-election:** They went home after the job was done.

  ### 3. Addressing Misconceptions (Minutes 50–75)
  **Strategy:** Do not wait for questions. Introduce these as "Structural Stress Tests" for the model.

  *   **Misconception 1: "It's just a lottery/zero competence."**
      *   *Where to head it off:* During the Citizens' Assembly description.
      *   *The Counter:* Distinguish between **technical expertise** (writing the bill) and **value judgment** (what the bill should achieve). We trust juries with life-and-liberty without law degrees; we trust boards of directors with corporate strategy without being CEOs. The Assembly uses staff/experts for drafting; the citizens provide the *direction*.
  *   **Misconception 2: "Zero accountability (can't vote them out)."**
      *   *Where to head it off:* Immediately after the competence point.
      *   *The Counter:* Accountability in elections is *retrospective* (punish them later). Accountability in sortition is *structural* (short terms, transparency, peer monitoring). If a member is corrupt or lazy, they are isolated within a large group; they cannot hold the whole body hostage like a party whip can.
  *   **Misconception 3: "Conflating with Direct Democracy/Polling."**
      *   *Where to head it off:* In the setup of the example.
      *   *The Counter:* Direct democracy = everyone votes on everything (referendum). Polling = snap opinion without information. Sortition = **representative deliberation**. They change their minds *after* learning, unlike poll respondents.
  *   **The Statistical Representation Point (Centerpiece vs. Footnote):**
      *   **Verdict:** Make this a **Centerpiece**.
      *   *Reasoning:* This is the one area where modern sortition is *superior* to the Athenian version. The Athenians relied on the "law of large numbers" intuitively. We have demographic data. You can guarantee a mirror of the population (51% female, 13% Black, X% rural, etc.). This answers the "who are these people?" fear better than any election ever could. For a seismologist, this is the data integrity argument. Lean into it.

  ### 4. Scope Management: What to Explicitly Exclude (Minutes 75–80)
  **Objective:** Prevent the discussion from dissolving into utopian constitutional drafting.
  **Statement to make:** "We are not discussing how to replace the House of Representatives tomorrow. We are not discussing the exact percentage of seats that should be allotted by lot. We are analyzing the *mechanism* itself."
  *   **Do Not Cover:**
      *   How to handle foreign policy/defense (too complex for 90 mins).
      *   The specific mechanics of recall or removal.
      *   Historical deep-dives into Venice or Florence (stick to Athens + Modern).

  ### 5. Assessment: The Closing Question (Minutes 80–90)
  **Objective:** Test for synthesis, not agreement. You want to know if they understand the *trade-off*, not if they think it's a "nice idea."

  **The Question:**
  > "If we accept that sortition gives us better *representation* but elections give us better *ambition-driven accountability*, what is **one specific type of legislation** you would trust a random body to write, and **one** you would absolutely refuse to let them touch?"

  **Why this works:**
  *   If they say "Budget/Defense" for the refuse pile, they understand the competence/complexity limit.
  *   If they say "Civil Rights/Social Issues" for the trust pile, they understand the value-judgment strength.
  *   If they say "Everything" or "Nothing," they haven't grasped the nuance of selection mechanisms.

  ### Logistics & Room Setup
  *   **Seating:** Round tables if possible. Avoid "lecture hall" style to reinforce the deliberative nature of the topic.
  *   **Handout:** A one-pager comparing "Election" vs. "Sortition" across three rows: *Selection Criteria, Incentive Structure, and Accountability Mechanism.* Leave the "Pros/Cons" column blank for them to fill in during the session.
  *   **Your Role:** Facilitator, not Advocate. When a participant gets heated, ask: "Is that a failure of the *people*, or a failure of the *selection method*?"

  ### Summary of Dependencies
  1.  **Legitimacy** depends on normalizing selection methods (Section 1).
  2.  **Competence** depends on the distinction between drafting vs. directing (Section 3).
  3.  **Fairness** depends on the statistical argument (Section 3 Centerpiece).
  4.  **Understanding** depends on recognizing the trade-off, not just the benefit (Section 5).
