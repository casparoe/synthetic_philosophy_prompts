prompt: |-
  I'm a retired seismologist who's gotten badly into political philosophy since I stopped working, and I volunteer running a civics discussion group at my local library — mostly retirees, a few college kids, all of them opinionated but none of them academic. Next month's session is on sortition, i.e., picking legislators by random draw instead of elections, and I keep starting an outline and then tearing it up because I'm not sure what depends on what. Don't write the explanation itself — I want a teaching plan. What has to be established first before the idea even sounds like something other than a gimmick (my hunch: they need to see elections as one selection mechanism among several, and maybe that the Athenians thought elections were the aristocratic part of their constitution and the lot the democratic part, before modern versions land as anything but weird)? What one example should carry the whole session — is the jury the right vehicle, or a modern citizens' assembly, or a fictional mini-legislature we design together — and what does that example need to have and to lack? Which misconceptions should I expect and where in the sequence do I head each one off: I'm already bracing for "so government is just a lottery and we get whatever competence happens to fall out of the hat," people conflating sortition with direct democracy or with opinion polling, and someone insisting random selection means zero accountability since you can't vote them out. And there's a subtle one I suspect matters: the idea that a random sample statistically mirrors the population is a modern idea the Athenians didn't have — should that be a centerpiece or a footnote at this level? Finally, what should I openly refuse to cover in ninety minutes and say so, and what question can I ask at the end that would show me they actually got the idea rather than just found it charming? Please answer in American English.
