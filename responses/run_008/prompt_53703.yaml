answer: |-
  **Translation**
  **Expressivism:** Moral predicates don't return `Bool`; they return `IO ()`. "Lying is wrong" ≡ `disapprove(Lying)`.
  **Frege-Geach:** A type error. In `if p then q`, `p` must be `Bool`. But if `p` is `IO ()`, it fails. In assertion context, `p` executes (you boo). In embedding, `p` is data (a condition). Expressivism says `p` is only the execution. Meaning isn't compositional; you can't pass an effect as a value.
  **Quasi-realism:** Defines a `newtype Moral a` implementing `Monad`. It lifts attitudes into a structure supporting `(>>=)`, simulating logical connectives so `if p then q` type-checks without assuming `p` is `Bool`.

  **Residue Report**
  *Clean:* The embedding problem is precisely a context mismatch (pure vs. effectful).
  *Distorted:* "Attitudes" aren't runtime effects; they're psychological states.
  *Missing:* Ontology. Code doesn't care what `IO` represents; philosophy cares if moral facts exist.

  **Your Bugs**
  (1) *Contradiction:* `print "A"` and `print "Not A"` are compatible effects. Moral claims are not. The monad needs an internal algebra where `m` and `not m` are uninhabited together. Expressivists argue conflicting attitudes are psychologically impossible, not logically false.
  (2) *Validity:* Validity preserves truth. Effect systems preserve *structure*. The monad story recovers validity as "attitude consistency." If you accept premises, the type system forces acceptance of conclusion. Truth-aptitude is emulated, not assumed.

  **Breakdown**
  Here is where a philosopher stops nodding.
  1.  **Separation vs. Erasure:** Monads acknowledge the effect exists but wrap it. Quasi-realism argues the effect *is* the truth; there's no underlying fact to wrap. Your analogy assumes a `Pure` core exists. Expressivists deny moral truth exists *at all*, even inside the monad. They want `IO ()` to behave *exactly* like `Bool` without becoming `Bool`.
  2.  **Normativity:** Logic is normative for belief. If `p → q` is valid, you *ought* to believe `q`. Effects are descriptive. Your analogy maps logic to type safety, but type safety is about preventing crashes, not normative rationality.
  3.  **Exclusion:** The "contradiction" bug is fatal. In code, `IO ()` and `IO ()` compose fine. In ethics, "Wrong" and "Not Wrong" exclude each other. Unless your monad enforces mutual exclusion at the type level (like `Data.Void`), you haven't solved Frege-Geach, you've just hidden it. Expressivists struggle to explain this exclusion without smuggling in truth-conditions.

  **Verdict**
  Your instinct is structurally brilliant but ontologically inverted. You see monads as saving effects; expressivists see them as eliminating the need for facts. The residue points to what expressivists are missing: a robust account of logical inconsistency between attitudes that doesn't secretly rely on truth-conditions.
