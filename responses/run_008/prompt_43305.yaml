answer: |-
  Your intuition is spot on. You caught something that a lot of intro philosophy students miss: your friend's brother mashed together two distinct (and somewhat conflicting) philosophical discussions and presented them as one settled fact. He got the "vibe" of the arguments but garbled the technical details and the consensus.

  Here is a piece-by-piece breakdown of what he said, what is actually going on in epistemology, and what you should put on your final.

  ### 1. The Epistemic Closure Principle
  **Brother's Claim:** "If you believe something, and you believe that it implies something else, then you have to believe that other thing too."
  **Verdict:** **Incorrect/Imprecise.**

  *   **The Correction:** Closure is not about *belief*; it is about **knowledge** (or justification). Belief is psychological; you can believe $P$ and believe $P \to Q$ but fail to put two and two together due to distraction.
  *   **The Actual Principle:** A standard formulation is: *If $S$ knows that $P$, and $S$ knows that $P$ entails $Q$, then $S$ knows that $Q$.*
  *   **Why it matters:** If it were just about belief, it would be a principle of rationality, not knowledge. The paradox arises because we think knowledge *should* transfer across known entailments, but doing so leads to weird results (like the dogmatism problem).

  ### 2. The Moorean Shift & Skepticism
  **Brother's Claim:** "This basically settles the whole skepticism debate in favor of common sense, like this philosopher Moore just used it to prove the external world and that was that."
  **Verdict:** **Misleading.**

  *   **The Context:** G.E. Moore did famously hold up his hands and say, "Here is one hand, here is another, therefore an external world exists." He used a closure-like principle to argue: *I know I have hands. Having hands entails I am not a brain-in-a-vat (BIV). Therefore, I know I am not a BIV.*
  *   **The Reality:** Philosophers do **not** agree this "settled" the debate. Skeptics argue Moore **begs the question**. The skeptic says, "You can't *know* you have hands unless you first rule out that you are a BIV." Moore assumes he knows he has hands to prove he isn't a BIV; the skeptic says you need to know you aren't a BIV to know you have hands.
  *   **For Your Final:** Moore represents a "Common Sense" response to skepticism, but it is generally viewed as shifting the burden of proof rather than delivering a knockout blow. Most contemporary epistemologists treat the "Moorean Shift" as a valid *structure* of argument, but one that skeptics will simply reject the premise of.

  ### 3. The Dogmatism Paradox (The Core Issue)
  **Brother's Claim:** "The paradox shows you can never rationally change your mind... if a doctor tells you your test came back positive, you can say well I know I'm healthy, therefore the test is wrong."
  **Verdict:** **Accurate description of the Paradox, but wrong about the Conclusion.**

  *   **The Actual Argument:** This is Gilbert Harman's "Dogmatism Paradox" (1973). The logic is:
      1.  If I **know** $P$ (e.g., "I am healthy"), then $P$ is true.
      2.  If $P$ is true, any evidence against $P$ is evidence for a falsehood.
      3.  Evidence for a falsehood is misleading evidence.
      4.  Therefore, if I know $P$, I know in advance that any evidence against $P$ is misleading.
      5.  Therefore, I am justified in ignoring any future evidence against $P$.
  *   **The Problem:** This leads to **dogmatism**. It implies that once you know something, you are rationally required to ignore counter-evidence. As you noted, this is absurd. If a doctor gives you a positive test, you *should* update your belief.
  *   **The Solution:** The doctor example is not a *recommendation* on how to act; it is a **_reductio ad absurdum_**. It shows that our definition of "knowledge" + "closure" leads to a crazy result.
  *   **How Philosophers Fix It:** Most argue that knowledge is **defeasible**. If strong enough evidence comes in (the doctor's test), it defeats your justification. You realize you didn't *know* you were healthy; you only *believed* it with high confidence. The new evidence destroys the "knowledge" status, allowing you to update.

  ### 4. The Philosophical Consensus
  **Brother's Claim:** "Most philosophers have concluded that the only way out is to give up on closure entirely, which is why alot of them are skeptical about whether logic even applies to real life reasoning."
  **Verdict:** **Flat Out Wrong.**

  *   **The Reality:** This is the most dangerous thing he told you for your exam.
      1.  **Closure:** While some famous philosophers (like Fred Dretske and Robert Nozick) have argued that closure fails in specific skeptical contexts, **most epistemologists do not reject closure entirely.** Many try to refine it (e.g., "Closure holds for competent deduction," or "Contextualist closure").
      2.  **Logic:** Almost **no** philosopher claims "logic doesn't apply to real life reasoning." That is a caricature. The debate is about the *conditions* for knowledge, not the validity of logic itself.
  *   **For Your Final:** Do not write that philosophers reject logic. Write that philosophers debate whether epistemic closure is *unrestricted* or *context-sensitive*.

  ### 5. Your Intuition: The Contradiction
  **Brother's Claim:** He presented the Closure Principle as both a **win for common sense** (Moore proves the world exists) AND a **proof that we are trapped** (Dogmatism means we can't learn).
  **Verdict:** **You are right to be suspicious.**

  *   **The Tension:** He conflated two different uses of closure.
      *   **Use A (Anti-Skepticism):** "I know common sense things, so closure lets me know skeptical scenarios are false." (Moore).
      *   **Use B (Dogmatism):** "If I know common sense things, closure prevents me from accepting evidence that I'm wrong." (Harman).
  *   **The Synthesis:** These aren't the same argument. One is about the *scope* of knowledge (can it reach past skepticism?), and the other is about the *stability* of knowledge (can it be revised?). Using closure to defeat skepticism (Moore) makes you vulnerable to the Dogmatism Paradox. If you say "I *know* I have hands, so I *know* I'm not a BIV," the Dogmatism Paradox asks, "Okay, so if a scientist shows you a vat, can you change your mind?" If you say yes, you admit you didn't *know*. If you say no, you're dogmatic.

  ### Summary Cheat Sheet for Your Final

  If you need to write about this, here is the accurate version:

  1.  **Epistemic Closure:** The principle that knowledge transmits across known entailments ($K(P) \& K(P \to Q) \to K(Q)$). It is widely accepted but debated in skeptical contexts.
  2.  **Moore's Argument:** Uses closure to argue from common sense (I have hands) to anti-skepticism (I'm not a BIV). Critics say it begs the question.
  3.  **The Dogmatism Paradox (Harman):** Argues that if knowledge implies truth, then knowing $P$ makes one rationally immune to evidence against $P$.
  4.  **Resolution:** Most philosophers reject the dogmatic conclusion. They argue that new evidence can **defeat** knowledge. You don't "ignore" the doctor; the doctor's evidence reveals you didn't *know* you were healthy to begin with.
  5.  **Consensus:** Philosophers do **not** reject logic or closure entirely. They refine the conditions under which closure applies (e.g., distinguishing between "easy" knowledge and "hard" knowledge).

  **Bottom line:** Your friend's brother gave you a "philosophy bro" version—half-remembered concepts mixed with dramatic flair. Trust your gut: the doctor example *is* obviously wrong, and that's exactly why it's a paradox that needs solving, not a truth about the world. Good luck on the final!
