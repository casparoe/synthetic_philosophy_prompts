          *   *Brother's Version:* "If you believe $P$, and believe $P$ implies $Q$, then you have to believe $Q$."
          *   *Philosophical Reality:* Closure is usually about *knowledge* or *justification*, not just belief. "If $S$ knows $P$, and $S$ knows $P$ entails $Q$, then $S$ knows $Q$." The brother's version is too psychological/weak. Also, closure is a premise *used* in skeptical arguments, not necessarily the tool Moore used to *defeat* skepticism (though Moore relies on something like it).
          *   *Verdict:* Simplified/Imprecise.

      *   **Claim 2: Moore & Skepticism.**
          *   *Brother's Version:* Closure settles skepticism in favor of common sense (Moore proved the external world).
          *   *Philosophical Reality:* G.E. Moore did argue "Here is a hand, therefore an external world exists." However, most philosophers do *not* think this "settled" the debate. Skeptics argue Moore begs the question (he assumes he knows he has a hand, which is what the skeptic doubts). Closure is actually often used *by skeptics* (If you don't know you aren't a BIV, you don't know you have hands).
          *   *Verdict:* Misleading. Moore made the move, but it didn't "settle" anything.

      *   **Claim 3: The Dogmatism Paradox (Harman).**
          *   *Brother's Version:* If you know $P$, you can ignore evidence against $P$. (Example: Doctor's test).
          *   *Philosophical Reality:* This is the core of Gilbert Harman's "Dogmatism Paradox" (1973). The logic is: If I know $P$, then $P$ is true. Any evidence against $P$ is evidence for a falsehood. Evidence for a falsehood is misleading. Therefore, I know in advance that contrary evidence is misleading. Therefore, I can ignore it.
          *   *The Problem:* This leads to dogmatism (refusing to update).
          *   *The Doctor Example:* This is the classic illustration of why the paradox is problematic. It shows the *reductio ad absurdum* of a strict view of knowledge + closure.
