answer: |-
  (1) "The menu"

  **1. Epistemic Opacity**
  Introspection is a cognitive process mediated by neural machinery we cannot directly observe. Consequently, our reports about mental states are lossy summaries rather than perfect mirrors of underlying processing. This claims only that we lack privileged access to the *mechanisms* of mind, not that the mind itself is fake. It suggests we should not trust introspection as a guide to neural architecture. It aligns with standard cognitive science and rejects Cartesian transparency. (Platitude)

  **2. Pragmatic Interface**
  Conscious experience functions like a desktop interface, simplifying complex reality to facilitate adaptive action. On this view, spatial or qualitative features are useful fictions that hide the complexity of the physical world. This suggests the *content* of experience is not veridical, though the experience itself occurs. It prioritizes fitness over truth in evolutionary explanations. Thus, the simplicity of the visual field is a feature of the user, not the hardware. (Contested)

  **3. Phenomenal Misrepresentation**
  Phenomenal properties exist as representational states but systematically misrepresent the physical properties they track. The "stripes" exist in experience but do not correspond to determinate properties in the brain or world. This preserves the existence of experience while denying its metaphysical innocence. It treats qualia as real representational vehicles with false contents. This allows us to speak meaningfully about experience without committing to dualism. (Contested)

  **4. Doxastic Illusion**
  The sensory experience is real, but the *belief* that it possesses ineffable, intrinsic qualia is the illusion. This locates the error in our higher-order judgments about experience rather than in the experience itself. It allows that there is something it is like, but denies our theoretical description of it. This is the core of "illusionism" as defended by Frankish. It distinguishes between having an experience and having a theory about that experience. (Contested)

  **5. Phenomenal Eliminativism**
  There are no qualitative properties whatsoever; the "what it is like" is a cognitive posit that refers to nothing. This claims that the seeming existence of experience is itself the error, not just our interpretation of it. It treats consciousness talk as analogous to witchcraft or phlogiston theory. This denies the primary datum of philosophy of mind. Consequently, there is no hard problem because there is no phenomenon to explain. (False)

  (2) "Who believes what"

  When Dennett, Frankish, or Hoffman deploy the "user illusion" line, they typically intend to slide from the Pragmatic Interface to Phenomenal Eliminativism. They rarely settle for mere Epistemic Opacity, as that leaves qualia intact and the Hard Problem unsolved. Their goal is to dissolve the Hard Problem by denying the existence of the problematic phenomena, not just our access to them. Dennett specifically targets the notion of a central observer, while Frankish targets the concept of phenomenal properties. However, they often speak ambiguously, sometimes granting that "experience exists" while simultaneously arguing it lacks the properties we attribute to it. This strategic ambiguity allows them to sound reasonable to realists while pulling the rug out from under them. Most serious proponents aim for the Doxastic Illusion or Phenomenal Eliminativism readings, intending to revise our ontology of mind rather than merely correct our epistemology. They want you to stop looking for the ghost in the machine, not just admit the ghost is hard to see. The line is often used rhetorically to bypass the need for a positive account of qualia. Ultimately, the metaphor is designed to shift the burden of proof onto the realist to explain why the illusion isn't sufficient.

  (3) "Back to the stripes"

  Only the strongest reading (Phenomenal Eliminativism) licenses calling the student's question confused, as it denies the existence of the entity (experience) whose structure is being queried. On the weaker readings, the stripes still exist as appearances or representations, meaning the question about their determinacy remains meaningful even if the answer is "they are indeterminate representations." Your student conflated "misrepresenting the world" with "not existing as an experience." You should point out that even a hallucinated snake has a determinate length in the hallucination; similarly, even an illusory experience has a structure that can be interrogated. Dismissing the question requires denying the reality of the appearance itself, not just its fidelity. Therefore, unless the student is prepared to defend full eliminativism, the question stands.

  (4) "What I'd tell the seminar"

  The "user illusion" metaphor is a conclusion disguised as a premise, smuggling eliminativism into a discussion about structure. It should not be allowed to veto phenomenological inquiry unless the eliminativist argument is explicitly made and defended. Even if consciousness is an illusion, illusions have structures that demand explanation. Treat the claim as a substantive hypothesis to be tested, not a conversation-stopper.
