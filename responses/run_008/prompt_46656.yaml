      *   *Claim 2 (Melody/Striving):* Melody is the lead voice. It uses tendency tones (leading tone to tonic). It uses non-chord tones (appoggiaturas leaning into the change). It avoids landing on 1 too early. Modulation = seeking new ground.
      *   *Claim 3 (Bass/Harmony):* Bass is the root movement. Tonic is home (gravity). Dominant is the demand. Inner voices fill the density. Low register = foundational will.
      *   *Claim 4 (Dissonance/Resolution):* Tritone resolution (7th of dom to 3rd of tonic). Suspensions (4-3). Cadences (Perfect = final, Deceptive = deferred).
