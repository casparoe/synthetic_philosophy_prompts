      *   *Psychoacoustics vs. Metaphor:* Tension/release is partly psychoacoustic (roughness, harmonic series) and partly cultural (learned expectation). Schopenhauer wants it to be Ontological (the nature of reality).
      *   *Surviving Claim:* How to save it without being boring? It's not just "rest/relief." It's about *time*. Music is the only art that exists *in* time as its primary substance. It enacts the *process* of desire, not just a picture of it.

