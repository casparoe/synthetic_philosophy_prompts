answer: |-
  **MEMORANDUM**

  **TO:** Desk Officer, Crisis Response Unit
  **FROM:** Strategic Policy Advisory Group
  **SUBJECT:** Operational Decision Procedure for Humanitarian Intervention (72-Hour Protocol)
  **CLASSIFICATION:** INTERNAL DRAFT

  You are correct that *Just War Tradition* (JWT) and *Responsibility to Protect* (R2P) are often used as rhetorical varnish rather than decision tools. The following procedure is designed to be run by a small team in 48 hours using existing intelligence and open-source reporting. It does not replace legal advice (Jus ad Bellum legality) or Ministerial judgment (Political Will). It is a filter to separate *actionable moral imperatives* from *strategic mirages*.

  ---

  ### PART I: THE DECISION PROCEDURE (THE FILTER)

  This is a sequential gate system. If a case fails a gate, the recommendation is **NO INTERVENTION**. If it passes all gates, the recommendation is **OPTION READY FOR MINISTERIAL DECISION**.

  #### GATE 1: THRESHOLD OF CONSCIENCE (Just Cause / R2P Pillar III)
  **Question:** Is there evidence of ongoing or imminent mass atrocity crimes (genocide, war crimes, ethnic cleansing, crimes against humanity) that the host state is unwilling or unable to halt?
  *   **Sufficient Answer:** Verified reporting (UN, NGOs, Intel) indicating >1,000 civilians at immediate risk of death OR systematic sexual violence/forced displacement on a mass scale.
  *   **Stop/No:** If the crisis is political instability, civil war without civilian targeting, or human rights abuses below the mass atrocity threshold.
  *   **Value Flag:** *Definition of "Imminent."* Intelligence often conflates "possible" with "imminent." Require specific troop movements or explicit orders, not just capability.

  #### GATE 2: PRIMARY MOTIVE (Right Intention)
  **Question:** Is the humanitarian objective the *dominant* driver, and can it be decoupled from regime change or resource access?
  *   **Sufficient Answer:** A written "Intent Statement" from participating nations that explicitly rules out regime change as a *condition* for cessation of hostilities.
  *   **Stop/No:** If key partners explicitly link intervention to leadership removal or strategic basing rights.
  *   **Value Flag:** *Smuggled Value:* "Stability." Often used to mean "a government friendly to us." The team must define stability as "absence of mass violence," not "political alignment."

  #### GATE 3: EXHAUSTION OF MEANS (Last Resort)
  **Question:** Have non-military measures been tried and failed, or are they demonstrably insufficient to stop the *immediate* threat?
  *   **Sufficient Answer:** A timeline of the last 6 months showing: (1) Diplomatic engagement, (2) Targeted sanctions, (3) Threat of ICC referral. Plus, an assessment that further delay equals mass death.
  *   **Stop/No:** If significant diplomatic channels remain open and time permits their use.
  *   **Value Flag:** *Smuggled Value:* "Reasonable" vs. "Absolute." You cannot try everything forever.
      *   *Operational Fix:* The team must certify that **time** is the limiting factor. If the killing is slow, Last Resort is not met. If the killing is rapid (e.g., Srebrenica), Last Resort is met faster.

  #### GATE 4: PROPORTIONALITY OF MEANS
  **Question:** Will the anticipated harm caused by the intervention (civilian casualties, infrastructure damage, regional destabilization) exceed the harm prevented?
  *   **Sufficient Answer:** An estimate of "Collateral Damage" vs. "Lives Saved."
  *   **Stop/No:** If air campaigns or ground invasion will likely cause civilian casualties exceeding 10% of the projected lives saved.
  *   **Value Flag:** *Valuation of Life.* Is a civilian death in the intervening nation worth 100 civilian deaths in the target nation? The procedure assumes **1:1** moral weight, but political reality does not. This must be flagged for Ministers.

  #### GATE 5: REASONABLE PROSPECT OF SUCCESS (The "Day After" Test)
  **Question:** Will the intervention stop the atrocities *and* leave a sustainable political order, or will withdrawal trigger a worse collapse?
  *   **Sufficient Answer:** A defined "End State" (e.g., "Safe Zones secured," "Genocidal unit neutralized") and a committed partner (local or international) to hold the peace post-intervention.
  *   **Stop/No:** If the plan relies on "hope" for political reconciliation or assumes the enemy will simply surrender power without a vacuum forming.
  *   **Value Flag:** *Smuggled Value:* "Success."
      *   *Operational Fix:* Separate **Tactical Success** (stopping the killing) from **Strategic Success** (lasting peace).
      *   *The Hard Rule:* If Tactical Success is high but Strategic Success is low, the procedure **DOES NOT STOP**. It flags this specifically for the Minister. This is the value judgment zone.

  #### THE HANDOFF POINT
  If the case passes Gates 1–5, the team produces a **Decision Memorandum**.
  *   **Facts:** The atrocity threshold, the cost, the likely casualties.
  *   **Values:** The trade-off between "doing something" vs. "making it worse" (Gate 5).
  *   **Ministerial Role:** Only Ministers can decide if the moral obligation to stop the killing outweighs the strategic risk of a failed state (Libya scenario). The procedure provides the trade-off; it does not make the trade.

  ---

  ### PART II: CASE APPLICATIONS

  #### 1. Kosovo (1999)
  *   **Gate 1 (Threshold):** **PASS.** Racak massacre and ongoing ethnic cleansing verified.
  *   **Gate 2 (Intention):** **PASS.** NATO stated aim was to prevent humanitarian catastrophe, though regime survival was threatened.
  *   **Gate 3 (Last Resort):** **MARGINAL PASS.** Rambouillet accords were rejected by Belgrade. Diplomacy exhausted *in the window of the killing*.
  *   **Gate 4 (Proportionality):** **PASS.** Air campaign minimized civilian risk to interveners; civilian casualties in FRY high but arguably lower than ground invasion.
  *   **Gate 5 (Prospect):** **PASS (Tactical) / UNKNOWN (Strategic).** Killing stopped. Political status unresolved for a decade.
  *   **Result:** **CLEAR FOR INTERVENTION.**
  *   **Note:** The procedure clears it because the immediate humanitarian objective was met. The unresolved sovereignty issue is a political cost, not a humanitarian failure.

  #### 2. Libya (2011)
  *   **Gate 1 (Threshold):** **PASS.** Gaddafi's "Zanga Zanga" threat to Benghazi constituted imminent mass atrocity.
  *   **Gate 2 (Intention):** **FAIL (Retrospective).** While UNSCR 1973 mandated civilian protection, key interveners (France/UK) quickly shifted to regime change.
  *   **Gate 3 (Last Resort):** **PASS.** Sanctions and condemnation failed; attack on Benghazi was imminent.
  *   **Gate 4 (Proportionality):** **PASS.** Limited air power, low intervener casualties.
  *   **Gate 5 (Prospect):** **FLAGGED.** Tactical success (Benghazi saved, Gaddafi fell). Strategic success (Stable Libya) was never defined or resourced.
  *   **Result:** **CLEAR FOR INTERVENTION (WITH HIGH RISK FLAG).**
  *   **Note:** The procedure clears the *intervention* because the immediate massacre was prevented. It flags the lack of a "Day After" plan, handing the strategic risk to Ministers. Historically, Ministers ignored the flag.

  #### 3. Iraq (2003)
  *   **Gate 1 (Threshold):** **FAIL.** No evidence of ongoing mass atrocity or genocide at the time of invasion. WMDs were the stated *casus belli*.
  *   **Gate 2 (Intention):** **FAIL.** Regime change was the explicit goal; humanitarian justification was retroactive.
  *   **Gate 3 (Last Resort):** **FAIL.** UNMOVIC inspections were ongoing and yielding cooperation.
  *   **Result:** **STOP. NO INTERVENTION.**
  *   **Note:** The procedure kills this immediately. It cannot be operationalized as a humanitarian intervention because the premises were false.

  ---

  ### PART III: THE TRAP CASE (The "Libya 2.0")

  You asked for a case the procedure clears but you won't like. This is the **"Protective Enclave" Scenario.**

  **Scenario:** A civil war in "Ruritania." The government is shelling a rebel-held city (500k civilians). Rebels are Islamist extremists but currently protecting civilians.
  **The Plan:** No-fly zone + limited ground buffer to stop shelling.

  *   **Gate 1:** **PASS.** Shelling constitutes war crimes.
  *   **Gate 2:** **PASS.** Mandate is strictly civilian protection, not toppling the government.
  *   **Gate 3:** **PASS.** Diplomacy stalled; shelling is active.
  *   **Gate 4:** **PASS.** Precision strikes can stop artillery with low collateral damage.
  *   **Gate 5:** **PASS (Technically).**
      *   *Tactical Success:* Shelling stops. Civilians saved.
      *   *Strategic Success:* The procedure requires a "partner to hold peace." The Rebels agree to hold the enclave.
  *   **The Trap:** The procedure clears this. The humanitarian math works.
  *   **The Failure:** By creating a safe zone, you inadvertently allow the Rebel extremists to rearm, recruit, and use the enclave as a base to launch a wider war later. You have "saved" the civilians today to make them combatants tomorrow. Furthermore, the intervention creates a dependency. When domestic political will fades in 2 years and you withdraw, the government retakes the city with vengeance.
  *   **Why the Procedure Misses It:** Gate 5 asks for a "partner." It does not adequately vet the *long-term moral hazard* of that partner. It prioritizes *immediate* cessation of killing over *long-term* political agency.

  ---

  ### PART IV: STRUCTURAL BLIND SPOTS

  This procedure is a tool for a Foreign Ministry, not a Moral Philosophy Department. It has inherent blind spots you must disclose to the Minister.

  **1. The Epistemic Blind Spot (The Fog of Future)**
  The procedure relies on "Reasonable Prospect." In reality, this is a guess. Intelligence can assess enemy troop strength, not societal resilience. The procedure treats "Success" as a calculable variable, but in intervention, success is often emergent.
  *   *Risk:* We will confidently clear cases that fail due to black swan events.

  **2. The "Clean Hands" Bias**
  The procedure weighs "Lives Saved" vs. "Lives Lost." It does not weigh "Lives Lost by Inaction" vs. "Lives Lost by Action." Bureaucracies prefer *actionable* risk (doing something wrong) over *omissive* risk (doing nothing while people die). The procedure may bias toward intervention because "doing something" generates data; "waiting" generates uncertainty.

  **3. The Sovereignty Vacuum**
  The procedure assumes that stopping a massacre is the end of the moral duty. It is structurally blind to the **obligation of reconstruction**. If we break the state's monopoly on violence (even to stop a massacre), do we own the state until it works? The JWT/R2P framework says "protect," not "build." This leads to the Libya outcome: we protected them from the dictator, then left them to the warlords.

  **4. The Regional Externality**
  The procedure focuses on the target state. It is weak at assessing **regional contagion**. An intervention might succeed locally (stop the killing) but destabilize three neighbors (refugee flows, proxy wars). Gate 4 touches on this, but Ministries rarely have the intel to model regional second-order effects in 48 hours.

  **5. The Legitimacy Gap**
  I have excluded Legality (UNSC approval) per your instructions. However, **Legitimacy** is operational. If the intervention is illegal (Kosovo) but clears this ethical procedure, you create a precedent that weakens the international order long-term. The procedure cannot calculate the cost of eroding the UN system.

  ### RECOMMENDATION FOR USE
  Attach this procedure to every Options Paper. When a case clears Gate 5 but carries the "Libya Flag" (Tactical Success/Strategic Risk), the cover memo to the Minister must read:

  > *"This option meets the ethical threshold for intervention to stop immediate killing. It does not guarantee a stable political outcome. Proceeding accepts the risk of state collapse post-intervention. This is a value judgment, not a strategic one."*

  This forces the Minister to own the moral hazard, rather than hiding behind the bureaucracy's "assessment."
