      *   **Task:** Create a 2-day decision procedure for assessing military intervention options based on Just War Tradition (JWT) and Responsibility to Protect (R2P).
      *   **Constraints:** Small team, 2 days, lawyers handle legality (so focus on ethics/strategy/policy), needs to distinguish between factual/empirical questions and value judgments, needs to flag where values are smuggled into empirical claims (specifically "reasonable prospect" and "last resort").
      *   **Output Requirements:**
          1.  The Decision Procedure (questions, sufficiency criteria, stop points, value flags).
          2.  Application to three cases: Kosovo (1999), Libya (2011), Iraq (2003).
          3.  Construct a hypothetical case that clears the procedure but is morally/strategically dubious (the "trap" case).
          4.  Explain the structural blind spots of the procedure.
      *   **Tone:** Professional, pragmatic, bureaucratic but intellectually honest, high-level policy analysis.

  2.  **Deconstruct the Core Concepts:**
      *   *Just War Tradition (JWT):* Jus ad bellum (Just Cause, Right Authority, Right Intention, Last Resort, Probability of Success, Proportionality).
      *   *Responsibility to Protect (R2P):* Pillar III (International community action), threshold (shocking conscience), precautionary principles.
      *   *The Problem:* These are often used as rhetorical cover. The user wants an *operational* tool, not a philosophical treatise.
      *   *The "Two-Day" Constraint:* Means no deep intelligence dives. Reliance on existing reporting, open source, and expert consensus. Needs to be a checklist/filter.

  3.  **Drafting the Decision Procedure (The "Filter"):**
      *   *Structure:* Sequential gates. If you fail one, stop.
      *   *Gate 1: Just Cause / R2P Threshold.* Is there actual mass atrocity? (Fact-heavy, but definition matters).
      *   *Gate 2: Right Intention.* Is the primary motive humanitarian? (Hard to prove, need to look for conflicting interests).
      *   *Gate 3: Last Resort.* Have non-military options been exhausted? (The "smuggled value" zone).
      *   *Gate 4: Proportionality.* Do benefits outweigh costs? (Comparative assessment).
      *   *Gate 5: Reasonable Prospect of Success.* Will it work? (The biggest "smuggled value" zone).
      *   *Exit Point:* Where does it hand off to Ministers? Usually at the trade-off between risk and moral obligation (Proportionality/Intention).

      *Refining the "Smuggled Values":*
      *   *Last Resort:* Often means "we tried what was convenient." Need to define "reasonable exhaustion" vs. "absolute exhaustion."
      *   *Reasonable Prospect:* Often means "we think we can win the war," ignoring "we can win the peace." Need to separate tactical success from strategic outcome.

  4.  **Running the Cases:**
      *   *Kosovo (1999):* No UNSC resolution (Legality issue, but user said lawyers handle that). Humanitarian case strong (ethnic cleansing). Last resort? Rambouillet was tricky. Success? Tactical yes, strategic (status) unresolved but killing stopped. *Verdict: Clears procedure, but highlights authority gap.*
      *   *Libya (2011):* R2P citation. Humanitarian case (Benghazi threat). Last resort? Sanctions/condemnation tried. Success? Regime change happened, state collapse followed. *Verdict: Clears initial procedure (tactical success), fails on "Reasonable Prospect of Political Order" if defined strictly.*
      *   *Iraq (2003):* WMDs (false cause). Humanitarian retroactive justification. *Verdict: Fails Just Cause immediately.*

  5.  **Constructing the "Trap" Case:**
      *   Need a case where the humanitarian need is real, the military can win, but the long-term result is disaster due to mandate creep or unintended consequences.
      *   *Idea:* A "Limited Protection Zone" that becomes a quagmire. Or a intervention that stops a massacre but empowers a worse actor.
      *   *Selection:* Let's create "Case X: The Stabilization Trap." A genocide is happening. Intervention stops it. But the intervention props up a faction that becomes authoritarian later, or the withdrawal creates a vacuum. The procedure focuses on *stopping the killing now*, not *governing the peace later*.
      *   *Refinement:* Let's make it about "Success." If success is defined as "stopping the massacre," it passes. If success is "lasting peace," it might fail. The procedure needs to force the definition of "End State."
      *   *Better Trap:* A case where the intervention is technically successful but violates sovereignty in a way that destabilizes the region long-term, yet the immediate humanitarian metrics are met. Let's go with a "Counter-Genocide Intervention that Ignites Regional War." The procedure might miss the *regional* proportionality.

  6.  **Identifying Structural Blind Spots:**
      *   *Post-Conflict Blindness:* JWT focuses on entering war, not exiting or building peace.
      *   *Epistemic Humility:* We never *really* know the future (Reasonable Prospect is a guess).
      *   *Institutional Incentives:* Bureaucracies want to offer options, not say "no."
      *   *The "Clean Hands" Problem:* Intervening might make us feel better while making things worse on the ground.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the pressure. Validate the need for a tool that isn't just legal cover.
      *   *The Procedure:* Make it a flowchart in text. Use specific "Stop/Go" criteria.
      *   *Value Flags:* Explicitly mark where judgment calls override data.
      *   *Case Studies:* Be concise. Apply the gates.
      *   *The Trap Case:* "Operation Safe Haven (Hypothetical)."
      *   *Blind Spots:* Be honest about the limits of bureaucracy.

      *(Self-Correction during drafting)*: The prompt asks specifically about "Last Resort" and "Reasonable Prospect" smuggling values. I need to ensure the procedure forces the team to write down *what* values they are using there.
      *   *Last Resort Fix:* Require a timeline of specific non-military measures and an assessment of *why* they would fail *now*, not just that they failed *before*.
      *   *Prospect Fix:* Separate "Military Victory" from "Political Outcome." Require a "Day After" plan.

      *(Refining the "Ministerial Handoff"):* The procedure shouldn't make the final moral call. It should present the *cost* of the moral call. If the facts say "We can stop the killing but it costs $5B and 50 lives," the Minister decides if that price is worth the moral good. The procedure stops before the final "Yes/No" on values.

      *(Refining the Trap Case)*: The prompt suggests a mission where the humanitarian case is strong but success depends on mandate creep. Let's design "The Protective Enclave." It clears the procedure because the immediate killing stops, but the procedure doesn't account for the *dependency* created or the inevitable collapse when political will fades.

  8.  **Final Review against constraints:**
      *   2-day feasible? Yes, relies on existing intel.
