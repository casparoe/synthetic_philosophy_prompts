      *   Kosovo, Libya, Iraq covered? Yes.
      *   Trap case included? Yes.
      *   Blind spots included? Yes.

  9.  **Final Polish:** Ensure tone is appropriate for a desk officer (sober, clear, actionable). (Proceed to generate output).

  *(Self-Correction on Iraq)*: Iraq is tricky because the *stated* cause was WMDs, but the *retroactive* cause was humanitarian. The procedure must test the *stated* cause at the time of decision. If the cause is WMDs, it fails the "Humanitarian/Just Cause" gate of *this specific procedure* (which is designed for humanitarian intervention). I need to make sure I frame the procedure as specifically for *Humanitarian/R2P* interventions, not general war. The prompt implies "usually on humanitarian grounds." So Iraq should fail because the humanitarian justification was not the primary driver *at the time*, or the intelligence was false. I will frame it as failing the "Evidence Threshold" for Just Cause.

