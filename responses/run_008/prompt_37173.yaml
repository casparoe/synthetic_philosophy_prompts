  1. While neuroscientists accept that the readiness potential precedes the reported urge, labeling this neural activity as a completed "decision" is an oversimplification of motor preparation.
  2. The assertion that consciousness is merely notified after the fact ignores the critical window Libet identified where conscious awareness can still intervene before the muscle fires.
  3. Claiming Libet "proved" the deciding is done overstates the data, given modern evidence that readiness potentials may reflect stochastic noise rather than deterministic commands.
  4. It is factually wrong that Libet abandoned free will, as he explicitly argued for a conscious "veto" power to halt actions initiated by unconscious processes.
  5. Consequently, the conclusion that free will is an illusion does not follow from the corrected findings, since the capacity to consciously abort an action preserves a meaningful form of agency.
