answer: |-
  "The wine is excellent," Aiko said, setting her glass down precisely on the coaster. "But you knew that already."

  Marieke didn't smile. "It's a twenty-euro supermarket blend. It's adequate. Like telling Sarah her memoir is adequate when we both know it's unreadable."

  Aiko's hand paused halfway to her plate. "Sarah is happy. She's writing every morning. It gives her structure."

  "It gives her delusion," Marieke said. "She's spent three years polishing a manuscript that doesn't work. You're her editor. You're the only one who knows. And you tell her it's 'promising.'"

  "I tell her it has potential," Aiko corrected. "Because it does. Just not in its current form. If I tell her it's unsalvageable, she stops writing. Maybe she stops reading. Why would I take that away from her?"

  "Because you're buying her comfort with her own information," Marieke said, leaning forward. "You're treating her like a child who can't be trusted with reality. You decide what she can handle. That isn't kindness, Aiko. It's control. You keep her manageable."

  Aiko picked up her fork, her movements slow, deliberate. "And you? You dump the truth on her and walk away feeling clean. You get to feel honest, and never have to do the work of figuring out what she can actually *use* right now. Your bluntness isn't the absence of a strategy, Marieke. It's a strategy of its own. You insist on your right of way at every intersection and call it virtue."

  "I call it respect," Marieke said. "If everyone did what you do, compliments would be worthless currency. We'd live in a world where nobody can believe anything anyone says. If the cake is dry, say it. Otherwise, how do I ever bake a better cake?"

  "Sometimes the cake is irrelevant," Aiko said. "Sometimes the point is that you baked it."

  "Take Grandma," Marieke said. "The doctors confirmed it yesterday. Pancreatic. Months, maybe less. The cousins want to keep it from her. Say she's too frail. You agree with them."

  "I agree with letting her finish her winter in peace," Aiko said. "What does knowing do? It steals her remaining time. She spends her last months in terror instead of confusion. Is that the dignity you're fighting for? Dying in panic because you demanded transparency?"

  "It's her life," Marieke said. "She has a right to prepare. To say goodbye. To settle things. You're protecting us from the awkwardness of her grief, not her from the pain."

  "I'm protecting her from a burden she doesn't need to carry," Aiko said. "Truth delivered without regard for the listener is just cruelty wearing a moral badge. You want to tell her so *you* don't have to carry the secret. That's your comfort, not hers."

  Marieke pushed her plate away. "And the vase. Auntie's anniversary gift. The one that looks like a melted traffic cone. You thanked her warmly. You said it was 'bold.'"

  "It was bold," Aiko said.

  "It was ugly," Marieke said. "You lied. You performed gratitude for an object you despise. That's a lie. Small, but a lie. It erodes the connection. If I can't trust you on the vase, why should I trust you on the diagnosis?"

  "Because the vase isn't about the object," Aiko said. "It's about the effort. To thank her for the object is literal. To thank her for the thought is human. You think honesty is the highest value. I think connection is. Sometimes honesty breaks the bridge."

  "So we just live in a polite fiction," Marieke said. "Smiling while the house burns."

  "We live in a society," Aiko said. "Which requires friction reduction. You treat every statement like a sworn testimony. I treat them like social agreements."

  Marieke swirled her wine. "Unless she asks."

  Aiko looked up. "Who?"

  "Grandma. If she asks 'Am I dying?'" Marieke said. "You wouldn't lie then. Would you?"

  Aiko was silent for a long moment. She refilled her glass, the sound of the wine loud in the quiet room. "If she asks directly... no. I wouldn't lie."

  "Because truth matters," Marieke said.

  "Because consent matters," Aiko corrected. "If she asks for the burden, who am I to refuse her? But I won't volunteer it. I won't hand her a weight she hasn't asked to carry."

  Marieke nodded slowly. "If she asks, you tell her. No softening. No 'we're hoping for the best.'"

  "If she asks, I tell her," Aiko said. "But don't get smug. That's not your victory. That's just recognizing when the contract changes."

  "It's a start," Marieke said.

  "And Sarah," Aiko said. "If she asks me, 'Can I quit my job to publish this?' I will tell her no."

  Marieke raised an eyebrow. "Even if it crushes her?"

  "Especially then," Aiko said. "Because then the stakes are real. Not feelings. Reality."

  Marieke leaned back, the tension in her shoulders dropping an inch. "Okay. So. Direct questions. Financial ruin. Those are the lines."

  "Those are the lines," Aiko agreed. She lifted her glass. "To the lines."

  Marieke clinked her glass against Aiko's. "To not crossing them."

  They drank. The wine was still adequate, but neither of them said so.
