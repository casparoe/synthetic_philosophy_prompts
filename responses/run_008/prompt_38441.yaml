answer: |-
  **Essay Question**

  **The Limits of Aggregation: Principles and Cases**

  Standard utilitarian aggregation implies that enough trivial harms can outweigh a grave one; strict deontology implies they never can. Both face difficulties. Your task is to construct a *principle of restricted aggregation* that avoids these extremes. Your principle must identify a specific criterion (e.g., a threshold of severity, a distinction in claim-types, or a structural limit) that determines when harms aggregate and when they do not.

  Defend your principle by applying it to the following three cases:

  1.  **The Ladder:** A sequence begins with two people tortured for 49 years versus one for 50. It proceeds through 1,000 people for a year, a million for a day, down to an astronomical number suffering an imperceptible speck of dust. You must identify exactly where your principle stops aggregation on this ladder and justify *why* it fails at that precise point rather than elsewhere.
  2.  **The Penny Case:** Suppose each of the astronomical number of people would knowingly and gladly accept the tiny harm in exchange for a trivial benefit (e.g., a penny). Does individual consent dissolve the moral weight of the harm, or can individually waived harms still aggregate to outweigh the single grave harm inflicted on a non-consenting victim?
  3.  **A Case of Your Own Construction:** Devise a third scenario that specifically tests the boundary of your principle. Explain why this case poses a unique challenge to the rule you have proposed.

  Finally, state the strongest objection to your view. If you argue against aggregation, you must address the fact that ordinary morality accepts aggregation in safety regulation and vaccination programs. If you argue for aggregation, you must address the intuition that trading a life for enough headaches is monstrous.

  ***

  **Model Answer**

  **Principle:** Claims based on *central interests* (physical integrity, autonomy) cannot be outweighed by the cumulative frustration of *peripheral preferences* (minor comforts, trivial gains). Aggregation is permitted only within categories.

  **The Ladder:** On the ladder, aggregation fails when the harm shifts from impairing a central interest to frustrating a peripheral preference. Torture clearly violates physical integrity. A dust speck is a mere annoyance. The cutoff lies not at the bottom, but where "significant daily impairment" ceases. For example, a broken arm prevents work and sleep (central interest); a mild headache does not. Therefore, one person's torture cannot be traded for a million headaches, but could be traded for a million broken arms. This avoids the dust-specks conclusion without forbidding all trade-offs. The justification is that rights protect the *conditions* of agency, not the *quality* of every moment. Once the harm no longer threatens agency, it becomes a utility metric subject to summation.

  **The Penny Case:** Consent changes the moral category. When individuals accept a speck of dust for a penny, they transform the interaction from a *violation* to a *transaction*. Transactions aggregate differently than violations. A non-consenting victim of torture suffers a violation of their central interests. The dust-sufferers have engaged in a voluntary exchange satisfying their peripheral preferences. To weigh the torture against the dust-specks here is to compare a rights violation against a sum of satisfied preferences. The violation wins. The waived harms do not accumulate moral weight against the non-consenting victim because the agents have authoritatively settled the moral status of their own minor interests. They have no remaining complaint to lodge against the torturer.

  **Original Case: The Cumulative Noise.** Imagine a factory that emits a hum imperceptible to any single neighbor but causes collective insomnia when combined. No single neighbor has a central interest claim (the noise is imperceptible alone), but the aggregate effect creates a health hazard (central interest). My principle must decide: does the *outcome* determine the category, or the *individual input*? If the input is peripheral, aggregation is allowed. Thus, the factory must close. This tests my principle because it suggests that peripheral harms can *become* central harms through aggregation. I must concede that if the cumulative effect creates a central interest violation, the threshold is crossed retroactively. This refines my principle: aggregation is forbidden only if the *individual* claims remain peripheral. If they sum to a central violation, they aggregate into a weighty claim.

  **Strongest Objection:** The strongest objection comes from ordinary moral practice regarding safety regulation. We accept traffic laws that impose tiny costs (waiting at red lights) on millions to save a single life. This contradicts my claim that peripheral preferences cannot outweigh central interests. Waiting at a light is a peripheral preference; life is a central interest. Yet we aggregate the delays to save the life.

  **Response:** I distinguish between *imposing risk* and *inflicting harm*. Traffic laws impose a certain minor cost to prevent a *probabilistic* grave harm. My principle governs *certain* outcomes: trading one certain torture for certain dust specks. In safety regulation, we are not trading certain minor harms for a certain death; we are trading certain minor harms to reduce the *risk* of death. Risk reduction is a central interest for everyone, including the drivers. Thus, safety regulation aggregates central interests (everyone's security) against peripheral ones (everyone's delay). This preserves the principle: central interests (security) aggregate against peripheral ones (delay), but peripheral ones (dust) do not aggregate against a central one (torture).

  ***

  **Marking Scheme**

  | Class | Descriptors & Required Moves |
  | :--- | :--- |
  | **First (70+)** | **Constructive & Precise.**<br>• **Principle:** Proposes a novel or rigorously defended restriction (e.g., threshold, claim-type distinction) rather than restating utilitarianism/deontology.<br>• **The Ladder:** Identifies a specific cutoff point (not "top" or "bottom") and justifies the *location* based on the principle's internal logic.<br>• **The Penny:** Engages with the moral transformation of consent (waiver vs. aggregation) rather than dismissing it.<br>• **Original Case:** Devises a scenario that genuinely stresses the proposed principle (e.g., exposes a loophole or boundary condition).<br>• **Objection:** States the specific "Safety Regulation" counter-argument and offers a substantive reconciliation, not a dismissal. |
  | **Upper Second (60-69)** | **Competent & Applied.**<br>• **Principle:** Identifies a plausible restriction but may rely on established distinctions (e.g., rights vs. utility) without deep reconstruction.<br>• **The Ladder:** Applies the principle to the sequence but the cutoff point may be vague or intuitively driven rather than principled.<br>• **The Penny:** Addresses consent but may treat it as binary (valid/invalid) without exploring aggregation of waived claims.<br>• **Original Case:** Provides a third case, but it may mirror the canonical cases too closely.<br>• **Objection:** Acknowledges the counter-argument but the rebuttal may be weak or concede too much ground. |
  | **Lower Second (50-59)** | **Descriptive & Intuitive.**<br>• **Principle:** Relies on "moderate" intuitions without a clear structural rule.<br>• **The Ladder:** Describes the problem but fails to locate a specific failure point for aggregation.<br>• **The Penny:** Treats consent as irrelevant or decisive without argument.<br>• **Original Case:** Missing, or trivial.<br>• **Objection:** Mentions an objection but fails to engage with the specific "Safety Regulation" constraint. |

  **Common Cop-Outs & Penalties**

  1.  **The "Intuition" Retreat:** Stating that "intuitions differ" or "there is no objective answer" to avoid taking a stance.
      *   *Penalty:* Caps mark at **Lower Second (50)**. Fails the core task of constructing a principle.
  2.  **The "Textbook" Recitation:** Summarizing Parfit, Kamm, or Scanlon without constructing an independent argument from the cases provided.
      *   *Penalty:* Caps mark at **Upper Second (65)**. Demonstrates knowledge but not application.
  3.  **The "Case" Ignore:** Failing to address the specific mechanics of The Ladder (the sequence) or The Penny Case (consent), treating them as generic "many vs. one" examples.
      *   *Penalty:* Deduct **10 marks** from the final total. Fails to answer the specific question set.
