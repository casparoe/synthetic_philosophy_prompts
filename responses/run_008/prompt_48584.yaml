answer: |-
  The impasse is a substantive metamethodological conflict over which normative axiom correctly extends probability theory to indexical beliefs, rather than a verbal dispute or a solvable mathematical error.

  The disagreement persists because standard probability theory is silent on how to handle self-locating information—propositions about *who* or *where* an agent is within a world—creating a vacuum filled by competing axioms that cannot be derived from non-anthropic premises. Proponents of the Doomsday Argument (DA) adopt the Self-Sampling Assumption (SSA), treating your birth rank as a random sample from the set of all observers, which dictates that the likelihood of your evidence decreases as the total number of observers increases. Opponents adopt the Self-Indication Assumption (SIA), which treats your existence itself as evidence that favors hypotheses with more observers, effectively canceling the DA's likelihood shift. Both sides agree on Bayes' theorem and the empirical data (your birth rank); they disagree on the definition of the likelihood term $P(\text{Evidence}|\text{Hypothesis})$ when the evidence is indexical. This is not verbal because the axioms yield different betting odds in thought experiments (e.g., the "Incubator" vs. the "Presumptuous Philosopher"), but it is metamethodological because there is no higher-order probability rule to adjudicate between SSA and SIA.

  Your hypothesis that the dispute concerns the nature of self-locating evidence is correct, but it is deeper than a confusion about "ordinary evidence." The stalemate exists because both axioms violate robust intuitions when pushed to their limits. SSA implies that merely changing the reference class (e.g., including aliens) can alter the probability of human extinction without physical interaction, which looks like magic. SIA implies that you should be overwhelmingly confident in hypotheses with vast numbers of observers regardless of empirical data, which looks like presumption. The debate is static because each side defends their axiom by pointing out the absurd consequences of the other's, resulting in a standoff of counterintuitive implications rather than a convergence on truth.

  You would expect to observe evidence of this diagnosis in the literature where authors concede the internal consistency of the opposing view while rejecting it based on "implausible consequences." For instance, Nick Bostrom acknowledges SIA avoids the Doomsday conclusion but rejects it because it favors the "Presumptuous Philosopher" who bets on a larger universe purely based on existence. Conversely, SIA proponents accept the Presumptuous Philosopher's reasoning as valid but reject SSA because it implies "Adam and Eve" scenarios where agents can seemingly influence outcomes via birth rank. If the dispute were merely about the reference class, refining the class would resolve the tension; instead, refining the class merely shifts the locus of the paradox, confirming that the reference class problem is a symptom of the underlying axiomatic clash, not the cause.

  Progress will not come from a new formal result within standard epistemology, as the underdetermination is structural. The only viable path forward is a decision-theoretic turn: shifting the question from "What credence is true?" to "Which updating rule maximizes expected utility across possible worlds?" Approaches like Updateless Decision Theory (UDT) attempt to bypass the indexing problem by evaluating policies before the agent knows their identity, potentially dissolving the SSA/SIA dichotomy by showing that one rule leads to systematically better outcomes than the other. If this fails, the verdict is that the question is ill-posed: anthropic reasoning may not have determinate content independent of the agent's goals, meaning the debate will never terminate because it asks for a factual answer to a normative constraint.
