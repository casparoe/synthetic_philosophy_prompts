answer: |-
  # Q&A Prep Sheet: Load-Bearing Realism
  **Talk:** *Ecological Niches, Not Constellations: A Defence of Load-Bearing Realism*
  **Audience:** Mech Interp Lab (Sceptics, Realists, Philosopher, Scaling)

  ---

  ### 1. The Scaling-Law Person (The "So What?" Objection)
  **Likelihood:** High (Often asked early to set the stakes).
  **Voice:** Pragmatic, slightly impatient, macro-focused.

  **The Question:**
  "Look, if the model produces the behaviour reliably, and the scaling laws hold regardless of how we slice the residual stream, why does the ontology of the features matter? You're arguing about whether the ink is 'real' while the book writes itself. If I can predict loss without knowing your 'niches', isn't this just a rounding error on the actual intelligence?"

  **The Reply (2 mins):**
  "It's a fair challenge, but it assumes the only thing that matters is input-output behaviour. If we want to *steer* these models, or guarantee safety properties under distributional shift, black-box prediction isn't enough. We need causal handles.

  My point is that 'load-bearing' features are the stable handles. If features were just constellations—arbitrary patterns we impose—then intervening on them would be brittle. You'd nudge one, and the behaviour wouldn't change, or it would break unpredictably. But when we find a feature that is causally load-bearing, it means the model's computation *depends* on that structure.

  Think of it like debugging code. You could treat the compiled binary as a black box that predicts output. But if you want to fix a bug, you need to know which variable is load-bearing. My claim is that 'load-bearing realism' identifies the variables in the neural net that function like code variables. They aren't fundamental particles, but they are the level of abstraction where control becomes possible. Ignoring them because scaling laws work doesn't help you when the model lies to you in a way that doesn't impact loss immediately."

  **Soft Spot:**
  *Admitting that we don't yet have a theorem linking 'load-bearing' features to robustness under extreme distributional shift. If the niche changes, does the feature persist?*

  ---

  ### 2. Faction A: The Sceptics (The "Rorschach" Objection)
  **Likelihood:** Very High (Immediate technical pushback).
  **Voice:** Cynical, technical, focused on polysemanticity and rotation.

  **The Question:**
  "You're saying these features are 'load-bearing', but we know SAEs are just rotating the basis to make things look sparse. I can find a different basis, perhaps with a different random seed, that intervenes just as well on the same task but looks completely different. If the features are observer-relative, isn't 'load-bearing' just a fancy way of saying 'my probe overfitted to this specific decomposition'?"

  **The Reply (2 mins):**
  "This is the crux of it. I'm conceding that the *exact boundary* of a feature is observer-relative—different dictionaries might carve the space slightly differently. But I'm denying that *anything goes*.

  If features were purely Rorschach tests, causal intervention would be noisy. You'd expect to need to ablate half the dictionary to move the needle. But when we find a load-bearing feature, a single direction often controls a specific behaviour with high precision. That suggests the model's computation is actually channelled through that subspace.

  The 'ecological niche' analogy does work here. Think of a predator and prey. Exactly where you draw the boundary of the 'niche' depends on your measurement tools. But the fact that the niche *exists*—that there is a pressure for a certain computational structure to exist—is a hard fact. If two different SAEs find different features that both intervene, they are likely approximating the same underlying computational pressure. The observer-relativity is in the *map*, not the *territory* of causal leverage."

  **Soft Spot:**
  *The "underlying computational pressure" is vaguely defined. If the bases are orthogonal but both work, the claim that they approximate the same thing is weak without a metric for 'computational equivalence'.*

  ---

  ### 3. Faction B: The Realists (The "Give Up on Truth" Objection)
  **Likelihood:** Medium (Reaction to concessions made to Faction A).
  **Voice:** Confident, essentialist, frustrated by philosophy.

  **The Question:**
  "Wait, you're hedging. By calling it 'observer-relative', you're saying there isn't a ground truth feature. But if I train a model to add numbers, there *is* a circuit that does addition. Are you telling the lab we should stop looking for the actual features and settle for 'useful fictions that intervene'?"

  **The Reply (2 mins):**
  "Not at all. I'm not saying there's no ground truth about the *weights*. The weights are what they are. I'm saying the *semantic description* of those weights as 'features' is a higher-level abstraction.

  Consider a fluid dynamics simulation. There is a ground truth about the position of every particle. But 'vortices' are real patterns that emerge from that. You can't find a vortex by looking at a single particle; you need the right observational scale. If you say 'vortices are just fictions', you lose the ability to predict turbulence efficiently.

  I want us to find the actual circuits. But 'load-bearing realism' warns you against reifying the *output of your tool* as the *only possible description*. If you treat SAE features as literal atoms, you'll be confused when they merge or split in a different model. If you treat them as ecological niches, you understand that the model is constrained to form them, but the exact representation might vary. It protects the research programme from falsification when features aren't perfectly universal."

  **Soft Spot:**
  *Risk of sounding like you're lowering the bar for discovery. Hard to define when a 'vortex' is real vs. when it's just noise in the fluid.*

  ---

  ### 4. The Philosopher of Mind (The "Instrumentalism Trap" Objection)
  **Likelihood:** Medium-High (Will wait for the Dennett reference).
  **Voice:** Precise, terminology-focused, wary of equivocation.

  **The Question:**
  "You're invoking Dennett's 'Real Patterns'. But Dennett is an instrumentalist. He thinks patterns are real *only* insofar as they facilitate prediction. You want to claim there's a 'hard fact of the matter' about causal load-bearing. These seem incompatible. Are you a realist about the causality but an instrumentalist about the ontology? If so, what is the truth-maker for your 'hard fact'?"

  **The Reply (2 mins):**
  "That's a sharp distinction, and I accept the tension. I'm trying to carve a middle path. I am an instrumentalist about the *feature vocabulary*—the label 'dog feature' is relative to our interests. But I am a realist about the *causal structure*.

  The truth-maker for the 'hard fact' is the counterfactual dependence. If I intervene on direction *d*, output *o* changes. That is a physical fact about the computation graph, independent of the observer. The 'Real Pattern' is the stable cluster of activations that allows us to *identify* *d* reliably across inputs.

  So, the *pattern* is observer-relative (we chose to look for sparsity), but the *causal leverage* is not. I'm using Dennett to dissolve the demand for fundamental ontology, but I'm keeping the causal realism required for science. It's not just 'useful fiction' because a fiction doesn't resist your intervention. If I try to intervene on a constellation, nothing happens. If I intervene on a niche, the system pushes back. That resistance is the hard fact."

  **Soft Spot:**
  *The distinction between 'pattern' and 'causal structure' might collapse. If the pattern is observer-relative, how do we know the causal structure isn't also gerrymandered by the choice of basis?*

  ---

  ### 5. The "Hope Nobody Asks" (The Divergent Dictionaries Objection)
  **Likelihood:** Low (Hopefully too technical for a general Q&A), but High Impact.
  **Voice:** Sharp, technical, trap-setting.

  **The Question:**
  "Let's test your 'hard fact'. Suppose I train two SAEs on the same model with different hyperparameters. Dictionary A finds Feature 101 that controls 'sarcasm'. Dictionary B doesn't find that feature at all, but finds a linear combination of Features 5, 9, and 12 that controls 'sarcasm' equally well. Both are load-bearing. By your view, are there two niches? Or one? If the features carve the space differently, where is the 'fact of the matter'?"

  **The Reply (2 mins):**
  "This is the hardest case, and it's where the 'ecological niche' analogy earns its keep. In ecology, you can describe a niche by the species present, or by the resource consumption vectors. They look different, but they map to the same functional role.

  In your case, there is *one* computational function (detecting sarcasm) that the model must implement. That is the niche. Dictionary A found a 'canonical basis' for it; Dictionary B found a rotated one. The 'hard fact' isn't that Feature 101 is the *only* way to represent sarcasm. The hard fact is that the model *must allocate a subspace of dimension N* to this computation to achieve its loss.

  If both dictionaries allow successful intervention, they have both latched onto that subspace. The observer-relativity is in the *coordinate system*, not the *subspace*. My view predicts that while the individual features might differ, the *causal subspace* they span will overlap significantly. If they don't overlap, then one of them isn't truly load-bearing, it's just a confounder. We test this by checking the subspace intersection, not the feature indices."

  **Soft Spot:**
  *This relies on the subspaces actually overlapping. In high-dimensional spaces, 'equifinal' solutions might be orthogonal. If they are orthogonal, the claim that there is 'one niche' collapses, and you're left with pure instrumentalism.*
