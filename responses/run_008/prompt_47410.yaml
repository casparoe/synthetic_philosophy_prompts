answer: |-
  ### Quiz: Evolutionary Inference and the Petrichor Case

  **Vignette:** A researcher proposes that people's positive reaction to the smell of rain on dry ground (petrichor) is an evolved water-finding adaptation: ancestors on the savannah who found the smell rewarding did better at locating waterholes in the dry season. As evidence they note (i) the pleasant reaction shows up across a lot of cultures, (ii) it seems to appear early in development, before anyone's had years of associating rain with relief from heat, and (iii) it's easy to tell an adaptive story for it—finding water mattered constantly. A critic replies that this is a textbook just-so story: you start from the trait, imagine a benefit, and declare victory.

  **1. The critic claims the researcher's argument is a "just-so story" rather than simply an untested hypothesis. What is the methodological distinction between these two statuses?**
  A. An untested hypothesis relies on fossil data, while a just-so story relies on psychological data.
  B. An untested hypothesis awaits evidence, while a just-so story is structured to accommodate any evidence.
  C. An untested hypothesis is likely false, while a just-so story is likely true but unproven.
  D. An untested hypothesis is about current behavior, while a just-so story is about ancestral behavior.

  **2. Suppose it is proven that smelling rain *did* help ancestors survive by locating water. Why might the critic still object to calling it an "adaptation for water-finding"?**
  A. Because adaptations must be physical structures, not sensory preferences or feelings.
  B. Because the trait could be a byproduct of selection for general olfactory sensitivity, not water-finding specifically.
  C. Because if the trait helped survival, it would be universal, and this trait is not universal.
  D. Because modern water sources are chemically different than ancestral water sources were.

  **3. The researcher cites cross-cultural presence and early development as evidence for adaptation. How should the critic evaluate this specific evidence?**
  A. It proves adaptation, because byproducts are always random and vary between individuals.
  B. It proves adaptation, because only survival-critical traits appear early in development.
  C. It is inconclusive, because fixed developmental byproducts can also be universal and appear early.
  D. It counts against adaptation, because evolved traits should require learning to calibrate to local environments.

  **4. Which additional finding would most strengthen the researcher's claim against the "just-so" charge?**
  A. A historical record showing ancestors explicitly praised the smell of rain in oral traditions.
  B. A demonstration that the preference is linked to a specific genetic marker found only in humans.
  C. A prediction that people in arid climates should value the smell more than those in rainforests, which is then confirmed.
  D. A philosophical argument that water is objectively more valuable than other resources for survival.

  **5. When evaluating adaptationist hypotheses, which of the following best states the actual methodological requirement rather than a scientific slogan?**
  A. Researchers must always prioritize the most parsimonious explanation for human behavior.
  B. Researchers must ensure their hypotheses respect the dignity of human subjective experience.
  C. Researchers must rule out alternative evolutionary explanations, such as drift or byproducts, with empirical evidence.
  D. Researchers must avoid speculating about the past whenever possible to ensure accuracy.

  ***

  ### Answer Key & Diagnostic Distractors

  **1. Correct Answer: B**
  *   **Diagnosis:** This tests the difference between *untested* (empirical gap) and *untestable* (logical flaw).
  *   **Distractor A:** Diagnoses confusion about *data sources* (thinking the issue is fossils vs. psychology rather than inferential structure).
  *   **Distractor C:** Diagnoses confusion about *truth value* (thinking "just-so" means "probably true" rather than "unsupported inference").
  *   **Distractor D:** Diagnoses confusion about *subject matter* (thinking the distinction is about time period rather than falsifiability).

  **2. Correct Answer: B**
  *   **Diagnosis:** This tests the Gould/Lewontin point: fitness-enhancing $\neq$ adaptation (the "Panglossian" slide). It requires understanding that byproducts can be useful.
  *   **Distractor A:** Diagnoses a restrictive *definition of adaptation* (thinking it requires anatomy rather than function/history).
  *   **Distractor C:** Diagnoses a contradiction of the *vignette* (the vignette states it is universal) and confusion about variation.
  *   **Distractor D:** Diagnoses a *mismatch objection* (focusing on modern validity rather than the historical selection claim).

  **3. Correct Answer: C**
  *   **Diagnosis:** This tests whether students understand that universality and early development do not rule out byproducts (species-typical byproducts exist).
  *   **Distractor A:** Diagnoses the misconception that *byproducts must be variable/random* (the "noise" assumption).
  *   **Distractor B:** Diagnoses the misconception that *early development implies selection* (the "innate = adapted" assumption).
  *   **Distractor D:** Diagnoses the misconception that *adaptation requires learning* (confusing adaptation with plasticity).

  **4. Correct Answer: C**
  *   **Diagnosis:** This tests the constructive move: providing a risky prediction that could have failed (comparative/ecological test). It gives the researcher a path forward.
  *   **Distractor A:** Diagnoses reliance on *historical testimony* (thinking cultural records equal evolutionary history).
  *   **Distractor B:** Diagnoses reliance on *heritability alone* (thinking genetic linkage proves adaptive function).
  *   **Distractor D:** Diagnoses reliance on *philosophical plausibility* (thinking logical value equals empirical evidence).

  **5. Correct Answer: C**
  *   **Diagnosis:** This tests the ability to distinguish a real methodological demand (ruling out alternatives) from a bumper sticker. The correct answer is technically accurate but "boring."
  *   **Distractor A:** Diagnoses reliance on *parsimony as a trump card* (a seductive slogan that doesn't solve the adaptation/byproduct problem).
  *   **Distractor B:** Diagnoses reliance on *ethical/intuitive constraints* (a slogan about "human nature" rather than method).
  *   **Distractor D:** Diagnoses reliance on *avoidance heuristics* (a slogan about "speculation" that ignores that all evolutionary psych involves some reconstruction).

  ***

  ### Instructor Note: The Hardest Question

  **Expect Question 2 to be the hardest for a middling student.**

  **Why:** Students often conflate "useful" with "adapted." If a trait helps you survive, the intuitive leap is that natural selection built it *for* that purpose. Question 2 requires them to hold two thoughts simultaneously: (1) the trait *is* useful, but (2) usefulness alone doesn't prove history of selection. They have to entertain the possibility of a "useful byproduct," which is counter-intuitive compared to the direct "problem → solution" narrative of adaptationism. Distractor A and D are easy to eliminate for students who paid attention, but Distractor B requires genuine conceptual grasp of the spandrel/byproduct argument.
