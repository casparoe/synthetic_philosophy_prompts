answer: |-
  This is a heavy lift, and I appreciate you asking for the scaffolding rather than the answer. Your editor is reaching for a legalistic defense (actus reus vs. omission), but you're writing a moral tragedy. In ethics, the "doing/allowing" distinction is notoriously leaky. If you build your character's arc on the idea that "allowing is lighter than doing," you risk building on sand.

  Here is the spec sheet for an adequate theory of the Doing/Allowing distinction, tailored to your water diversion case and the collective omission problem. I have attached confidence levels to each component. **Note:** In philosophy, "confidence" usually means "degree of consensus," not "truth." Where consensus is low, I have flagged it.

  ### The Spec Sheet: Requirements for an Adequate Theory

  #### 1. The Causal Topology Requirement
  **What it must deliver:** The theory must distinguish between *initiating* a threat, *sustaining* a threat, *redirecting* a threat, and *failing to block* a threat. It cannot treat all causal chains as identical.
  **The Case:** Your water diversion. She did not create the drought (initiate). She did not poison the well (initiate harm). She moved a resource that was in motion. This is *redirecting*. If the theory treats "redirecting water away" the same as "poisoning water," it fails. If it treats it the same as "watching water dry up," it also fails.
  **Constraint Status:** **Non-negotiable.** A theory that cannot distinguish topological differences in causation is useless for narrative.
  **Confidence:** **High (85%).** Most accounts (Quinn, Foot) agree some distinction exists here, even if they disagree on where to draw the line.

  #### 2. The Normative Baseline Requirement
  **What it must deliver:** The theory must define what counts as the "status quo" or the "natural course of events." An omission is only an omission relative to an expected norm.
  **The Case:** The water allocation. Was the water *supposed* to flow to her village? If there was an established pipeline or agreement, breaking it is an *act* of diversion. If the water was wild and she built a channel to the other town, that is also an act. But if she simply *closed a valve* that was previously open, is that doing or allowing? The theory must explain why closing a valve feels different than digging a trench, even if the physical outcome is identical.
  **Constraint Status:** **Non-negotiable.** Without a baseline, "allowing" has no meaning.
  **Confidence:** **Medium (60%).** This is where most theories start to wobble. Defining the "expected norm" is often circular (it's expected because it's normal, it's normal because it's expected).

  #### 3. The Collective Aggregation Requirement
  **What it must deliver:** The theory must account for harm that arises from the sum of many small omissions, where no single agent causes the harm, but the group does. It cannot require a single "but-for" cause for moral responsibility.
  **The Case:** The "hundred people" scenario. If 100 villagers each fail to fix a small leak, and the reservoir drains, no single person "killed" the village. But the village is dead. A theory that says "no single person caused it, therefore no one is responsible" fails the moral sniff test.
  **Constraint Status:** **Non-negotiable for fiction.** Real life is full of distributed harm. A theory that only works for lone actors is too narrow for a novel about society.
  **Confidence:** **Low (40%).** This is the hardest problem in moral philosophy (the Problem of Overdetermination/Complicity). There is no agreed-upon solution.

  #### 4. The Legal Independence Requirement
  **What it must deliver:** The theory must be allowed to declare the law wrong. It cannot simply track the legal distinction between act and omission.
  **The Case:** Legally, your character might be safe. "She didn't kill them." Morally, she might be damned. If the theory is constrained to match legal statutes, it becomes jurisprudence, not ethics. It must be able to say, "The law says you are innocent, but you are a murderer."
  **Constraint Status:** **Non-negotiable.** Law is about punishability; ethics is about blameworthiness. They diverge constantly.
  **Confidence:** **High (90%).** Philosophers generally agree morality and law are distinct domains.

  ---

  ### The Impossible Pair (The Tension)

  Here is the conflict you asked for. I suspect **Requirement 1 (Causal Topology)** and **Requirement 3 (Collective Aggregation)** cannot be jointly satisfied in a single, coherent system without one undermining the other.

  *   **Why:** To satisfy **Causal Topology**, you need to isolate individual agency. You need to say, "Hand A moved Valve B, causing Result C." This preserves the doing/allowing distinction for the individual.
  *   **The Conflict:** To satisfy **Collective Aggregation**, you have to dissolve individual agency into a group metric. You have to say, "The Group failed, therefore the Individuals are responsible," even if Individual X's omission made no physical difference to the outcome.
  *   **The Result:** If you prioritize the individual causal chain (to save the doing/allowing distinction), you exonerate the hundred villagers (no one caused the death). If you prioritize the collective harm (to blame the villagers), you blur the doing/allowing distinction until it vanishes (because "failing to fix a leak" becomes morally equivalent to "draining the reservoir").

  **Confidence in this Tension:** **High (80%).** This is a known fracture line in non-consequentialist ethics. You can have individual purity or collective responsibility, but keeping both is metabolically expensive for a moral theory.

  ---

  ### The Killer Requirement

  If I have to pick the single requirement that knocks out the most standard accounts (Foot, Thomson, Kamm, etc.), it is **Requirement 2: The Normative Baseline.**

  **Why it kills the accounts:**
  Most theories try to ground the doing/allowing distinction in physics or biology (e.g., "Did she interrupt a natural sequence?"). But your water case proves that "natural sequences" are social constructs.
  *   Is the water flowing to her village "natural"? Or is the *drought* natural?
  *   If the village has had water for 50 years, stopping it feels like *killing*.
  *   If the village has never had water, not sending it feels like *allowing*.
  *   **The Kill Shot:** The physical action is identical in both cases (closing a valve). The moral weight shifts entirely based on *expectation*.
  *   Most philosophical accounts try to find an objective line in the action itself. They fail because the line isn't in the action; it's in the social contract surrounding the action. Any theory that ignores the social baseline collapses.

  **Confidence:** **Medium-High (75%).** This is the standard objection raised by legal realists and critical theorists against analytic moral philosophy.

  ---

  ### My Uncertainty & The Least Sure Point

  You asked for honest uncertainty. Here it is:

  **The Point I Am Least Sure Of:**
  I am least sure that the Doing/Allowing distinction is a *real feature of the world* rather than a *psychological heuristic*.

  **Confidence:** **Low (30%).**
  There is a genuine possibility that "Doing" and "Allowing" are not ontologically distinct categories, but merely emotional responses we have to proximity and intent. If this is true, then trying to build a "correct theory" of the distinction is like trying to build a correct theory of "disgustingness." It's not in the object; it's in the viewer.

  **Why this matters for your book:**
  If the distinction is real (ontological), your character is objectively guilty or innocent based on the mechanics of her choice.
  If the distinction is a heuristic (psychological), your character's guilt is a matter of how she (and the village) *processes* the choice.

  **My Best Guess:**
  The distinction does not survive rigorous metaphysical scrutiny (the "Baseline Problem" usually wins), but it *does* survive phenomenological scrutiny (it feels real to the agent).
  *   **Spec Verdict:** An adequate theory shouldn't try to prove the distinction is objectively real. It should explain why it *feels* real and why that feeling has moral weight.

  ### Recommendation for the Arc

  Given the spec above, here is how I would play the character's redemption (or lack thereof):

  1.  **Don't let her off the hook with "I didn't kill them."** That is the legal defense, and Requirement 4 says morality can reject it.
  2.  **Lean into the Baseline Problem.** Have the character struggle with whether the water "belonged" to her village. If the baseline was "water flows to us," she killed them. If the baseline was "water flows to the thirsty," she saved them. The tragedy is that *she had to choose the baseline.*
  3.  **Embrace the Impossible Pair.** If you want realism, show that she can't satisfy both individual purity and collective good. She sacrificed her specific neighbors for a diffuse downstream group. That is the definition of moral residue.

  **Final Confidence in this Advice:** **Medium (65%).** I am confident the philosophical landscape is this messy. I am less confident that mapping it perfectly will make the book better. Sometimes the "philosophical shortcut" your editor wants is exactly what a reader needs to keep turning the page, even if it's wrong. But if you want a book that haunts people, the ambiguity is the engine.

  If the honest answer is "nobody knows," then your character shouldn't know either. Her redemption shouldn't come from solving the equation, but from learning to live with the fact that it has no solution.
