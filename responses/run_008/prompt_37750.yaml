prompt: |-
  I'm in a bioethics course this semester (mostly pre-meds, I'm one of two philosophy majors) and we just finished the unit on defining death. I keep getting told this is "settled policy, unsettled philosophy," and I want an actual number out of somebody instead of that shrug. So: what's your credence that the whole-brain criterion is the correct criterion for human death -- i.e. that a patient with total, irreversible loss of all brain function is dead, full stop, even though their body keeps digesting food, fighting infections, sometimes even gestating a fetus?

  Please decompose it roughly like this, though you can rearrage the slots: (a) the probability that death is a single biological event that happens at an identifiable point, rather than a process we just draw a policy line through; (b) given that it's an event, the probability that the event is the loss of integrated functioning of the organism as a whole, rather than the loss of consciousness or the capacity for it; (c) given the whole-brain criterion, the probability that current bedside tests actually capture it.

  But the part I actually want to think through with you: my professor floated a thought experiment where surgeons stop a patient's heart, drain the blood, cool the body way down, do 45 minutes of repair work on the aorta with no circulation and no brain activity whatsoever, then rewarm, restart everything, and the patient walks out fine a week later. His point was that the mainstream criteria seem to imply the patient was literally dead mid-operation and then un-died, and he asked whether that's a reductio of the criteria or just shows "irreversible" is doing all the work. Related thing my TA brought up: in donation-after-circulatory-death protocols they only wait a few minutes after the heart stops before declaring death, on the grounds that it won't restart *on its own* -- even though a machine could in principle restart it -- which sounds like "irreversible" quietly got swapped for "permanent." So maybe slot (d): how much do cases like these push you toward thinking the biological facts underdetermine the line, and how should that enter the math?

  One more data point I half-remember from the reading, so don't hold me to specifics: some neurologist has documented a bunch of cases of brain-dead bodies kept alive for months, and I think at least one went past a year. No exact numbers please, just tell me whether that general fact cuts for or against slot (b) -- I can see it argued both ways (the body is obviously more than a bag of organs without a brain; or: it just proves families and medicine can keep meat running).

  So: number per slot, one line of justification each, how you combine them, which slot the final answer is most sensitive to, and what would move it most. And if your honest view is that the question is partly normative and no well-formed credence exists, say so -- but then still give me the number you'd act on if a transplant decision had to be made tomorrow.
