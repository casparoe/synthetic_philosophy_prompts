  1.  **Analyse the Request:**
      *   **Task:** Sanity check a "where I stand" writeup on Dennett (Real Patterns, Three Stances) for a philosophy of mind reading group.
      *   **Input:** Five specific claims/positions held by the user.
      *   **Output Requirements:**
          *   Identify tensions (genuine vs. apparent).
          *   Propose cheapest fixes for each.
          *   Rank tensions by severity.
