prompt: |-
  doing a little "where I stand" writeup for our philosophy of mind reading group on Dennett (real patterns, the three stances) and I want a sanity checke before I circulate it. here's my picture: (1) beliefs and desires are real patterns, i.e. the intentional stance carves nature at genuine joints, the way 'centre of mass' or a trade cycle does; (2) nothing about a system's beliefs is strictly needed once you can predict at the fundamental physical level, and I'm fine with that; (3) I've always half-agreed with the Churchlands that 'belief' is a folk relic destined to go the way of phlogiston; (4) I'm comfortable saying a strong chess engine has beliefs about the position, but I flatly refuse to say my thermostat believes anything; (5) real, for a pattern, basically means it compresses prediction — the pattern's there iff the stance buys you predictive power you can't get more cheaply otherwise. Go through these and tell me which bits are genuinely in tension, which only look like it, and what the cheapest fix would be for each. Rank the tensions by severity rather than treating them all as equally bad, and if one single revision would clean up most of the mess, tell me which one and what it costs me. Answer in British English please.
