  This is a classic setup in experimental ethics. Your friend's record is highly consistent, but as you suspected, it doesn't point to a single principle yet. The key to cracking his code lies in how he interprets the **Loop** case.

  Here is the breakdown of the rules that fit his record, the predictions for your new cases, and the strategy to pin him down.

  ### 1. The Candidate Rules

  Based on his verdicts (specifically saying **Fine** to *Loop* but **Not Fine** to *Footbridge*), we can rule out the standard **Doctrine of Double Effect (DDE)**. Standard DDE forbids harming someone as a *means* to an end. In the *Loop*, the one person's body is the means that stops the trolley. If he were following strict DDE, he would have to say *Loop* is impermissible. Since he says it's fine, he is running one of two other principles:

  **Rule A: The "Redirecting Existing Threat" Principle (The Thomson View)**
  *   **The Rule:** You may deflect a threat that is already in motion toward fewer people. You may *not* initiate a new causal sequence of harm or use a bystander as a tool.
  *   **Why it fits:**
      *   *Switch/Loop:* You are redirecting the **trolley** (existing threat). Verdict: Fine.
      *   *Footbridge/Shoving/Surgeon:* You are initiating a **new threat** (your push, your scalpel) against someone safe. Verdict: Not Fine.
  *   **Nuance:** This rule allows the person to be a *means* (as in *Loop*), provided the threat killing them is the original one (the trolley), not a new one you created.

  **Rule B: The "Direct Personal Force" Principle (The Contact View)**
  *   **The Rule:** Harm is permissible if mediated by impersonal mechanisms (levers, switches). Harm is impermissible if it requires direct physical contact or "personal force" against the victim.
  *   **Why it fits:**
      *   *Switch/Loop:* You pull a lever; you don't touch the victim. Verdict: Fine.
      *   *Footbridge/Shoving/Surgeon:* You lay hands on (or cut) the victim. Verdict: Not Fine.
  *   **Nuance:** This rule is less about the threat's origin and more about the *agent's physical relationship* to the harm.

  *(Note: You asked if DDE and Redirecting "collapse." His Loop verdict proves they don't. DDE bans Loop; Redirecting allows it. He allows it, so he's not on team DDE.)*

  ### 2. Predictions for Cases (1)–(3)

  Here is how the two rules diverge on your new cases.

  | Case | Scenario | Rule A: Redirecting Threat | Rule B: Personal Contact |
  | :--- | :--- | :--- | :--- |
  | **(1)** | **Crane (Collateral)**<br>Crate stops trolley. Worker crushed on way down (Side Effect). | **Not Fine**<br>The threat to the worker is the **crate** (a new threat you initiated), not the trolley. Even though it's a side effect, you attacked him to save the five. | **Fine**<br>You pulled a lever. No physical contact with the worker. |
  | **(2)** | **Crane (Means)**<br>Worker's body cushions crate to stop trolley. | **Not Fine**<br>New threat (crate) + Using person as means. Double violation. | **Fine**<br>You pulled a lever. No physical contact. (This is "Remote Footbridge".) |
  | **(3)** | **Trapdoor**<br>Lever drops man onto track. | **Not Fine**<br>You initiated a new sequence (trapdoor) to use him as a means. You did not redirect the trolley. | **Fine**<br>You pulled a lever. No physical contact. |

  ### 3. Which Case Best Splits the Rules?

  You guessed that **Case (3)** "won't split anything and just tests whether his footbridge verdict was really about the physical pushing."

  **You are half-right.**
  Case (3) *is* the test for physical pushing. However, you are wrong that it won't split the rules. It is actually the **cleanest splitter** between Rule A and Rule B.
  *   If he says **Fine** on (3): He is following **Rule B (Contact)**. The mechanism (lever vs. hands) is the deciding factor.
  *   If he says **Not Fine** on (3): He is following **Rule A (Redirecting)**. The mechanism doesn't matter; what matters is that he initiated a new threat against the man rather than redirecting the trolley.

  **However, Case (1) is the deeper diagnostic.**
  Case (1) removes the "Means" variable entirely (the worker is a side effect, not a means).
  *   If he says **Fine** on (1): It suggests he cares about **Means vs. Side-Effect** (a soft DDE) OR **Contact**.
  *   If he says **Not Fine** on (1): It confirms **Rule A (Redirecting)** decisively. It proves he forbids *New Threats* even when they are merely collateral damage. This is the hallmark of the "Redirecting" view (often associated with Judith Jarvis Thomson).

  **Recommendation:** Vote on **Case (3)** first. It directly addresses your hypothesis about the Footbridge verdict. If he says "Fine," you know it was about the pushing. If he says "Not Fine," you know it was about the threat source.

  ### 4. The "Pin-Down" Follow-Up Case

  If Case (3) comes back **Not Fine** (supporting Rule A: Redirecting), you still need to know if he allows *any* means, or if he just hates *new* threats. You already know he allows means in the *Loop*. To really lock in his logic, propose this case:

  **The "Villain's Bridge" Case:**
  > A villain has already pushed a fat man off the bridge. He is currently falling. You are standing next to a lever that controls a net.
  > *   **Option A:** Do nothing. The man falls on the ground and survives; the trolley kills the five.
  > *   **Option B:** Pull the lever. The net catches the falling man and redirects his trajectory onto the track. His body stops the trolley, saving the five, but he dies.
  > *   **Crucial Detail:** You did not push him. The threat to the five (trolley) and the threat to the one (gravity/falling) were already in motion. You are merely redirecting the falling man.

  **Why this pins him down:**
  *   **Rule A (Redirecting):** Should say **Fine**. You are redirecting an existing threat (the falling man) to stop an existing threat (the trolley). You initiated nothing.
  *   **Rule B (Contact):** Should say **Fine**. You pulled a lever.
  *   **Strict DDE:** Should say **Not Fine**. You are using the man as a means.

  If he says **Fine** here, he is firmly in the **Redirecting** camp (Thomson/Kamm). If he says **Not Fine** here (despite saying Fine to Loop), his principle is likely more restrictive, perhaps forbidding *using people* regardless of threat origin, which would make his Loop verdict an outlier or based on a specific technicality about the track layout.

  ### Summary Prediction
  Given his consistency on *Loop* (Fine) vs. *Footbridge* (Not Fine), my money is on **Rule A (Redirecting Existing Threat)**.
  *   **Case (1):** Not Fine (New Threat).
  *   **Case (2):** Not Fine (New Threat + Means).
  *   **Case (3):** Not Fine (New Threat/Means, despite remote lever).

  If he surprises you and says **Fine** to Case (3), he's a **Rule B (Contact)** thinker, and you should pivot your follow-up to test the limits of remote harm (e.g., the Robot Arm Shove).
