answer: |-
  **Commonly™: Frequently Asked Questions**

  **What is Commonly?**
  Commonly is a SaaS platform designed to optimize communal grazing assets through dynamic resource allocation. We believe the traditional "Tragedy of the Commons" is actually a market inefficiency waiting to be disrupted. By leveraging mobile technology, we allow herders to maximize individual utility while distributing ecological overhead across the entire network.

  **How does the app prevent overgrazing?**
  We don't prevent it; we incentivize efficiency. Economically, a herder captures 100% of the marginal benefit from adding one additional cow, while the cost of pasture degradation is socialized across all users. Commonly accelerates this value capture. We encourage users to apply a high discount rate to future pasture viability, prioritizing immediate milk and meat production over long-term soil health. This ensures liquidity now rather than uncertain grass later.

  **Who is allowed to graze on the shared pasture?**
  Commonly believes in open access ecosystems. Restricting grazing based on historical usage or geographic boundaries creates friction and limits network effects. Any user who downloads the app is granted grazing rights. This maximizes the total number of participants, ensuring the shared cost base is as wide as possible, even if the resource base remains fixed.

  **How do you monitor compliance and enforce rules?**
  Monitoring is crowdsourced and optional to reduce operational overhead. We rely on an honor system where herders self-report herd sizes. Regarding sanctions, we utilize a tiered enforcement model. Users on the Free Tier are subject to strict grazing limits and automatic fines for overuse. Premium subscribers benefit from "Compliance Flexibility," allowing them to exceed carrying capacity without penalty. This ensures our most valuable customers are never constrained by arbitrary ecological limits.

  **What happens if two herders dispute grazing rights?**
  Commonly centralizes conflict resolution to ensure consistency. There is no local council or face-to-face mediation process. Users must submit a support ticket to support@commonly.app. Our team reviews disputes asynchronously based on Terms of Service agreements signed during onboarding. Please note that response times may vary depending on server load and pasture conditions.

  **Pricing Tiers**

  | Feature | Free Tier (Scout) | Premium (Herder Plus) | Enterprise (Baron) |
  | :--- | :--- | :--- | :--- |
  | **Grazing Rights** | Standard Access | Priority Grass Selection | Unlimited Headcount |
  | **Compliance** | Strict Enforcement | Flexibility Included | Audit Immunity |
  | **Support** | Email Only | Priority Queue | Dedicated Account Mgr |
  | **Cost** | $0/mo | $49.99/mo | Contact Sales |

  **Public Beta Status Update**
  Please be advised that the Public Beta has been temporarily paused. The demo pasture is currently undergoing an unscheduled recovery period due to rapid asset depletion. Existing users retain access to the dashboard, though grazing functions are disabled until further notice. We appreciate your patience as we recalibrate our growth metrics.
