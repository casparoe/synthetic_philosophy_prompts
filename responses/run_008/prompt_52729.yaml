      *   *Validation:* Acknowledge the novelist's hypothesis is sharp.
      *   *The Core Diagnosis:* It's not just verbal. It's a category error in standard probability theory when applied to *indexical* uncertainty.
      *   *Halfer View:* Focus on the *coin*. The coin doesn't care about awakenings. Belief tracks physical chance.
      *   *Thirder View:* Focus on the *experience*. The experience is sampled from the set of all experiences. Belief tracks sampling frequency.
