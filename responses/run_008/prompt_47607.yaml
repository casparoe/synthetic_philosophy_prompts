answer: |-
  You are right to be annoyed. The slogan "Local Realism is Dead" is a piece of scientific marketing, not a precise theorem. It conflates distinct assumptions to create a dramatic narrative, and as you suspected, it obscures the actual mechanical question: *Is there a physical influence propagating between the wings?*

  Your hypothesis is largely correct: **Bell's Theorem rules out Local Causality (given some assumptions about variables), but the No-Signaling Theorem separately guarantees you can't use the correlation to communicate.** Whether "nothing travels" depends entirely on which interpretation of quantum mechanics you adopt to survive the Bell test, not on the Bell test itself.

  Here is the menu you asked for. It breaks down the conjuncts, evaluates their status, and verdicts whether they support the "nothing travels" claim.

  ---

  ### Part 1: The "Local" Menu (Causality Conditions)

  In the context of Bell tests, "Locality" is not a single concept. It is a stack of conditions. Bell's derivation requires the conjunction of these to hold.

  #### 1. Signal Locality (No-Signaling)
  *   **Definition:** It is impossible to transmit information faster than light. Mathematically, the marginal probability of Alice's outcome does not depend on Bob's setting: $P(A|a, b) = P(A|a)$.
  *   **Status:** **ALIVE.** Quantum Mechanics respects this. Experiments confirm it.
  *   **Ruled out by Bell?** No. Bell inequalities can be violated while preserving Signal Locality.
  *   **Does it support "Nothing travels"?** **Yes, but weakly.** It means nothing *controllable* travels. It does not rule out an uncontrollable ontic influence (a "hidden" signal).

  #### 2. Parameter Independence
  *   **Definition:** Alice's outcome does not depend on Bob's *detector setting*. (A subset of Signal Locality, usually conditioned on the hidden state $\lambda$).
  *   **Status:** **ALIVE (in standard QM).** If this were violated, superluminal signaling would usually be possible.
  *   **Ruled out by Bell?** No. Standard QM violates Bell inequalities while maintaining Parameter Independence.
  *   **Does it support "Nothing travels"?** **Yes.** It says the choice of measurement here doesn't tweak the physics there.

  #### 3. Outcome Independence
  *   **Definition:** Alice's outcome does not depend on Bob's *outcome*. Given the source state $\lambda$ and settings $a, b$, the outcomes are statistically independent: $P(A, B | a, b, \lambda) = P(A | a, b, \lambda) \cdot P(B | a, b, \lambda)$.
  *   **Status:** **DEAD (in standard QM).** This is where the correlation lives. In QM, knowing Alice's outcome updates the probability of Bob's outcome instantly, even given $\lambda$.
  *   **Ruled out by Bell?** **Yes.** To violate Bell inequalities while keeping Parameter Independence, you *must* violate Outcome Independence.
  *   **Does it support "Nothing travels"?** **No.** This is the precise locus of "spooky action." Violating Outcome Independence implies a dependency between distant events that isn't mediated by a common past cause. Whether this counts as "influence traveling" depends on your metaphysics, but it is definitely non-local correlation.

  #### 4. Bell's Local Causality (Factorizability)
  *   **Definition:** The combination of Parameter Independence + Outcome Independence + the existence of a complete state description $\lambda$. The probability factorizes: $P(A, B | a, b, \lambda) = P(A | a, \lambda) \cdot P(B | b, \lambda)$.
  *   **Status:** **DEAD.** This is the actual assumption used to derive the inequality.
  *   **Ruled out by Bell?** **Yes.** This is the core result of the 2022 Nobel work.
  *   **Does it support "Nothing travels"?** **Ambiguous.** It proves you cannot have a theory where common causes screen off the correlation. It forces you to choose: either there is a non-local influence (something "travels" or acts instantly), or there is no fact of the matter about the outcomes until measurement (anti-realism).

  ---

  ### Part 2: The "Realism" Menu (Ontological Commitments)

  This is where the slogan is most misleading. "Realism" in "Local Realism" does not mean "the world exists." It refers to specific technical assumptions about variables.

  #### 1. Counterfactual Definiteness (CFD)
  *   **Definition:** It makes sense to talk about the result of a measurement that was *not* performed. (e.g., "If I had measured spin-X instead of spin-Z, I would have gotten +1").
  *   **Status:** **DEAD (in Copenhagen/Standard QM).** Standard QM rejects CFD.
  *   **Ruled out by Bell?** **Sort of.** You can derive Bell inequalities using CFD. If you reject CFD, you can claim Locality is saved because the unmeasured values never existed to be influenced.
  *   **Does it support "Nothing travels"?** **Yes.** If unmeasured properties don't exist, nothing needs to travel to update them. This is the "Copenhagen escape hatch."

  #### 2. Determinism (Predetermination)
  *   **Definition:** The outcomes are fully determined by the source state $\lambda$ and local settings. $P(A|a, \lambda)$ is 0 or 1.
  *   **Status:** **DEAD.**
  *   **Ruled out by Bell?** **Yes, but it doesn't matter.** Bell's theorem was later generalized to stochastic (probabilistic) hidden variables. Dropping determinism does not save Local Causality.
  *   **Does it support "Nothing travels"?** **No.** Even random local hidden variables fail to reproduce QM correlations.

  #### 3. Hidden Variables ($\lambda$ exists)
  *   **Definition:** There is some physical state $\lambda$ emitted by the source that carries the instructions for the outcomes, independent of measurement.
  *   **Status:** **DEAD (if Local).** You can have $\lambda$ (Bohmian mechanics), but it cannot be Local. You can have Locality (Copenhagen), but you cannot have $\lambda$ determining outcomes.
  *   **Ruled out by Bell?** **Yes, the *Local* version is.**
  *   **Does it support "Nothing travels"?** **No.** If you keep $\lambda$ (Realism), you must accept Non-Locality (something travels/acts instantly). If you want "nothing to travel," you must drop $\lambda$.

  #### 4. Philosophical Realism (Mind-Independent World)
  *   **Definition:** There is a world that exists independently of observers.
  *   **Status:** **ALIVE.**
  *   **Ruled out by Bell?** **No.** Many Worlds and Bohmian Mechanics are fully realist and reproduce QM predictions.
  *   **Does it support "Nothing travels"?** **No.** Realist interpretations (like Bohm) explicitly posit non-local influences.

  ---

  ### Part 3: Verdict on the Dinner Argument

  Your friend's slogan ("Local Realism is dead, therefore nothing travels") is a non-sequitur. Here is the breakdown of why, organized by how different interpretations handle the "Nothing Travels" question.

  | Interpretation | Saves Locality? | Saves Realism? | Does "Something Travel"? | Verdict on Slogan |
  | :--- | :--- | :--- | :--- | :--- |
  | **Copenhagen / QBism** | **Yes** (sort of) | **No** (rejects $\lambda$/CFD) | **No.** (Category error; no ontic state to update). | Slogan works *if* you define Realism as CFD. |
  | **Bohmian Mechanics** | **No** (Explicitly Non-Local) | **Yes** (Particles + Pilot Wave) | **Yes.** The pilot wave updates instantly across space. | Slogan is **False**. Realism is alive, Locality is dead. |
  | **Many Worlds (Everett)** | **Yes** (Locality redefined) | **Yes** (Universal Wavefunction) | **No.** Correlations are due to branching, not signaling. | Slogan is **Misleading**. Locality is technically preserved. |
  | **Collapse (GRW)** | **No** | **Yes** | **Yes.** Collapse is a physical, non-local process. | Slogan is **False**. |

  #### The "Nothing Travels" Claim
  The claim that "nothing passes between detectors" is **not** a consequence of Bell's Theorem. It is a consequence of the **No-Signaling Theorem** (which is separate) combined with a specific choice of interpretation (like Copenhagen).

  *   **If you are a Bohmian:** Something *does* travel (the quantum potential acts instantly). Bell's theorem forced you to accept this.
  *   **If you are a Copenhagenist:** Nothing travels because there was no fact of the matter to update. Bell's theorem forced you to accept *this*.
  *   **If you are an Everettian:** Nothing travels because both outcomes happened in different branches.

  The slogan "Local Realism is Dead" is a compromise phrase designed so that Copenhagenists, Bohmians, and Everettians can all nod along while meaning different things.
  *   **Copenhagenists** hear: "Realism is dead." (So Locality is safe).
  *   **Bohmians** hear: "Locality is dead." (So Realism is safe).
  *   **The Public** hears: "Spooky magic."

  ### Summary for Your Next Dinner

  1.  **The Theorem:** Bell's Theorem proves that **Local Causality + Hidden Variables** cannot reproduce Quantum predictions. One must go.
  2.  **The Experiments:** Aspect/Clauser/Zeilinger confirmed Quantum predictions. Therefore, **Local Causality + Hidden Variables** is false.
  3.  **The "Realism" Trap:** "Realism" in the slogan usually means "Hidden Variables determining outcomes," not "an objective world." You can keep an objective world (Many Worlds, Bohm) if you sacrifice Locality.
  4.  **The "Nothing Travels" Claim:**
      *   **True** regarding *signals* (No-Signaling Theorem). You cannot send a message.
      *   **Unproven** regarding *influence*. Bohmian mechanics posits instantaneous influence.
      *   **Category-Dependent.** In Copenhagen, the question is meaningless. In Bohm, the answer is "yes."
  5.  **The Correction:** The accurate slogan is: **"Local Causality is incompatible with Quantum Predictions."** Whether that means "nothing travels" or "realism is false" is an interpretational choice, not an experimental result.

  **Your winning line:** "Bell killed Local Causality, not Realism. If you want to keep Realism, you have to accept Non-Locality (Bohm). If you want to keep Locality, you have to drop Realism (Copenhagen). The slogan 'Local Realism is Dead' lets you hide which sacrifice you're making."
