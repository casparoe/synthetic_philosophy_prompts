prompt: |-
  I got into an argument at a dinner with some physics grad students (a friend's birthday, they took over the conversation) about the Aspect/Clauser/Zeilinger experiments, and someone ended my question by repeating what seems to be the official slogan of the whole field since the 2022 Nobel announcement: "local realism is dead." My question had been whether the correlations in a Bell test mean anything is actually passing between the two detectors — some influence, signal, whatever — and the slogan was deployed like it obviously answered "no, nothing passes, the universe just isn't locally real, next topic." The thing is, I don't think anyone at that table could actually unpack the phrase, and honestly neither can I, which bugs me. So I want your help laying out what it could mean.

  Since "local realism" sounds like a conjunction, I'd want the menu organized around what the conjuncts even are. On the "local" side, I've noticed people slide between what look like different commitments — no faster-than-light causal influence of any kind, no dependence of one wing's outcome on the distant detector setting, Bell's own later factorization/local-causality condition — and I've also seen a distinction drawn between dependence on the distant setting versus dependence on the distant outcome, where supposedly only one of those is compatible with no-signaling. On the "realism" side it's even worse: hidden variables exist, results are predetermined at the source, there are facts about unperformed measurements, or just vaguely that the theory is about a mind-independent world. For each precise reading you can construct, tell me whether it's plausible, whether the experiments plus the theorem actually rule it out, and — the part I care about most — whether that reading supports the use the slogan was put to at dinner, i.e., a flat "no, nothing travels." My suspicion is the honest story is something like: local causality in Bell's sense is dead, the no-signaling theorem separately guarantees you can't exploit the correlations to send a message, and the word "realism" in the slogan may not be doing any work at all — but I want it as a proper laid-out list with verdicts, not a vibes paragraph, so I can bring it to the next dinner.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user got into an argument with physics grad students about Bell tests (Aspect/Clauser/Zeilinger) and the slogan "local realism is dead."
      *   **Core Question:** Does anything actually pass between detectors (influence, signal)? The slogan implies "no," but the user suspects it's more nuanced.
      *   **Specific Demand:** A structured "menu" breaking down the conjuncts "Local" and "Realism."
      *   **Requirements for each item:**
          *   Precise definition/reading.
          *   Plausibility/Status (is it a coherent position?).
          *   Verdict (ruled out by Bell/Experiments?).
          *   Relevance to the "nothing travels" claim (does this specific reading support the dinner slogan?).
      *   **User's Hypothesis:** Local causality is dead, no-signaling holds separately, and "realism" might be doing no work.
      *   **Tone:** Rigorous, clear, structured (not a "vibes paragraph"), suitable for bringing to a future dinner party.

  2.  **Deconstruct "Local Realism":**
      *   The phrase is indeed a conjunction: $Local \land Realism$.
      *   Bell's Theorem shows that Quantum Mechanics (QM) predictions (confirmed by experiment) violate Bell Inequalities.
      *   Bell Inequalities are derived from assumptions. Which assumptions?
      *   *Standard Decomposition:* Bell Locality (or Local Causality) + Statistical Independence (often conflated with Realism/Determinism).
      *   *The "Realism" Confusion:* Many physicists use "Realism" to mean "Counterfactual Definiteness" or "Predetermination." Others use it to mean "Mind-independent reality."
      *   *The "Local" Confusion:* Parameter Independence vs. Outcome Independence vs. Signal Locality.

  3.  **Drafting the Menu - Step-by-Step:**

      *   **Category 1: The "Local" Conjunct (Locality Conditions)**
          *   *Idea 1: Signal Locality (No-Signaling).* Can we send bits faster than light?
              *   *Status:* Preserved by QM. Not ruled out.
              *   *Relevance to "Nothing travels":* Supports "no *usable* signal," but doesn't rule out ontic influence.
          *   *Idea 2: Parameter Independence.* Does outcome $A$ depend on setting $b$?
              *   *Status:* Preserved by QM (usually).
              *   *Relevance:* Crucial for no-signaling.
          *   *Idea 3: Outcome Independence.* Does outcome $A$ depend on outcome $B$?
              *   *Status:* Violated by QM.
              *   *Relevance:* This is where the "spooky action" lives.
          *   *Idea 4: Bell's Local Causality (Factorizability).* The combination of Parameter + Outcome Independence + Hidden Variables.
              *   *Status:* Ruled out.
              *   *Relevance:* This is the technical thing that died.

      *   **Category 2: The "Realism" Conjunct (Ontological Commitments)**
          *   *Idea 1: Counterfactual Definiteness (CFD).* Unmeasured values exist.
              *   *Status:* Often assumed in derivations, but technically Bell only needs hidden variables $\lambda$.
              *   *Relevance:* If you drop this (Copenhagen), you save Locality? Maybe.
          *   *Idea 2: Determinism/Predetermination.* Outcomes fixed at source.
              *   *Status:* Not strictly required for Bell, but often assumed in simple proofs (CHSH). Stochastic local hidden variables also fail.
              *   *Relevance:* Dropping determinism doesn't save locality.
          *   *Idea 3: Mind-Independent Reality.* The world exists without observers.
              *   *Status:* Not ruled out. QM can be realist (Bohm, Many Worlds).
              *   *Relevance:* "Realism is dead" is misleading here.

      *   **Category 3: The Combined Package (Bell's Assumptions)**
          *   *The Derivation:* $P(A, B | a, b, \lambda) = P(A | a, \lambda) \times P(B | b, \lambda)$.
          *   *What breaks?* To match QM, you must violate this factorization.
          *   *Options:*
              1.  Violate Parameter Independence (Non-local signaling). Ruled out by experiment (mostly).
              2.  Violate Outcome Independence (Non-local correlation). This is standard QM.
              3.  Violate Statistical Independence (Superdeterminism).
              4.  Reject $\lambda$ exists (Anti-realism/Observables only).

  4.  **Addressing the "Nothing Travels" Claim:**
      *   This is the user's main pain point.
      *   If "Local Causality" is dead, does that mean influence travels?
      *   *Bohmian Mechanics:* Yes, pilot wave travels instantly.
      *   *Collapse Theories (GRW):* Yes, collapse is non-local.
      *   *Many Worlds:* No, nothing travels, but locality is redefined (all outcomes happen).
      *   *Copenhagen/QBism:* Category error. Questions about "what travels" are meaningless.
      *   *Conclusion:* The slogan "Local Realism is dead" *does not* logically entail "Nothing travels." It entails "You can't have *both* local causality *and* a specific type of realism." You can keep influence (Bohm) or drop realism (Copenhagen).

  5.  **Refining the Structure:**
