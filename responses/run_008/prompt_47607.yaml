  7.  **Final Polish:**
      *   Check against the user's specific hypothesis ("local causality is dead, no-signaling holds, realism might be doing no work").
      *   Confirm the verdict: The user is mostly right, but "realism" does do work in the derivation (you need $\lambda$). However, you can drop realism to save locality.
      *   Make sure the "Nothing Travels" question gets a direct answer (It depends on the interpretation, not the theorem).

