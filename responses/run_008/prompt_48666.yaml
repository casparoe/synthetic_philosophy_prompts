answer: |-
  This is an excellent philosophical instinct. Your suspicion is well-founded: Dennett's slogan is rhetorically powerful precisely because it is ambiguous between a linguistic suggestion, a pragmatic observation, and a substantive metaphysical claim. When your instructor uses it to "wave off" the hard incompatibilist, they are likely sliding between these readings.

  Here is a numbered list of five distinct theses the "worth wanting" framing could be asserting, ordered from the weakest (least controversial, least effective against the objection) to the strongest (most controversial, most effective if true).

  For each, I have assessed its **Plausibility**, its **Efficacy** (does it actually refute the hard incompatibilist?), and whether it **Begs the Question** (smuggles in a compatibilist assumption).

  ### 1. The Semantic Disambiguation Thesis
  **Thesis:** The term "free will" is ambiguous. It sometimes refers to a magical, contra-causal power (which we lack) and sometimes to a natural capacity for self-control and rationality (which we have). The slogan merely recommends that we stop using the word to track the former and reserve it for the latter.
  *   **Plausibility:** **High.** Philosophical terms are often ambiguous, and clarifying usage is a standard philosophical move.
  *   **Efficacy against Desert Objection:** **None.** This does not refute the hard incompatibilist. The classmate is not making a claim about *word usage*; they are making a claim about *moral justice*. They are arguing that without the "magical" power, *desert* is unjustified. Changing the label on the capacity we do have does not show that we deserve blame in the ultimate sense the classmate is worried about.
  *   **Question-Begging?** **No.** It is a proposal about language, not a claim about the world.
  *   **Standpoint:** Theorist's stipulation. It doesn't matter what agents want; it matters how we define terms for clarity.

  ### 2. The Pragmatic Sufficiency Thesis
  **Thesis:** The "varieties" of freedom we actually possess (responsiveness to reasons, avoidability in a practical sense) are sufficient to sustain all the social practices (praise, blame, punishment, reward) that we currently value. Therefore, the lack of "ultimate" freedom makes no practical difference.
  *   **Plausibility:** **Moderate to High.** It is plausible that society functions well with compatibilist responsibility.
  *   **Efficacy against Desert Objection:** **Low.** This changes the subject from *justification* to *utility*. The hard incompatibilist grants that these practices are useful for social control but denies they are *morally fair* without ultimate responsibility. Showing that we *can* keep the practices doesn't show we *should* (in a moral sense) if they are fundamentally unjust.
  *   **Question-Begging?** **No,** but it risks a **Category Mistake**. It answers a moral question ("Is it fair?") with a sociological answer ("Does it work?").
  *   **Standpoint:** The Social Planner's. It values the stability of the system over the metaphysical status of the agent.

  ### 3. The Revisionary Normative Thesis
  **Thesis:** We *ought* to refashion our concept of moral responsibility to align with the capacities we have, because clinging to the "ultimate" variety is psychologically harmful or socially detrimental. The "worth wanting" claim is a moral imperative to abandon the desire for incompatibilist freedom.
  *   **Plausibility:** **Contested.** This depends on whether one believes our concept of responsibility *should* track metaphysical truth or social well-being.
  *   **Efficacy against Desert Objection:** **Moderate.** It attempts to dissolve the objection by arguing the desire behind it is harmful. However, it concedes that the incompatibilist version of desert is the "real" one, but argues we should give it up for our own good.
  *   **Question-Begging?** **Potentially.** It assumes that social well-being trumps metaphysical accuracy regarding desert. If the classmate believes justice is more important than social utility, this thesis fails to persuade them.
  *   **Standpoint:** The Moral Reformer's. It tells agents what they *should* want, regardless of what they currently want.

  ### 4. The Metaphysical Impossibility Thesis
  **Thesis:** The variety of free will the incompatibilist wants (contra-causal freedom) is not just absent, but logically incoherent or nomologically impossible (like a square circle). Therefore, it is not "worth wanting" because it is not a possible object of desire.
  *   **Plausibility:** **Contested.** Libertarians argue it is possible; hard determinists argue it is not. Dennett leans toward the view that it is incoherent.
  *   **Efficacy against Desert Objection:** **High.** If the incompatibilist's requirement is impossible, then the objection loses its grip. You cannot be deprived of something that cannot exist.
  *   **Question-Begging?** **Yes.** Against a libertarian incompatibilist, this simply asserts their metaphysics is wrong without proving it. It uses the slogan to mask a substantive metaphysical disagreement as a pragmatic preference.
  *   **Standpoint:** The Metaphysician's. It claims the object of the desire is null.

  ### 5. The Axiological Error Thesis (Strongest)
  **Thesis:** The desire for "ultimate" responsibility is itself irrational or misguided. Even if libertarian free will *were* possible, it would not be "worth wanting" because it would not actually ground the kind of desert we care about (e.g., because it introduces randomness, not control). The classmate's worry is based on a false theory of value.
  *   **Plausibility:** **Low to Moderate.** This contradicts a deep-seated human intuition that ultimate authorship matters for justice.
  *   **Efficacy against Desert Objection:** **Very High.** This attacks the root of the classmate's objection. It argues that the incompatibilist is mistaken about what makes blame fair, not just about physics.
  *   **Question-Begging?** **Yes.** This is the most flagrant instance of begging the question. It asserts that the incompatibilist's core value judgment (that ultimate responsibility is required for desert) is false, which is precisely what is under debate. It uses the slogan ("not worth wanting") as a substitute for an argument about the nature of desert.
  *   **Standpoint:** The Philosopher-King's. It claims to know what is truly valuable better than the agent does, dismissing the agent's own intuition about fairness as an error.

  ### Summary for Seminar Discussion

  You can bring this list to seminar and make the following point:

  > "The slogan 'varieties worth wanting' only refutes the hard incompatibilist if we accept **Thesis 4** (it's impossible) or **Thesis 5** (it's valueless). But **Thesis 4** assumes the incompatibilist's metaphysics is wrong, and **Thesis 5** assumes the incompatibilist's moral intuition is wrong.
  >
  > If the instructor is relying on **Thesis 1** (semantics) or **Thesis 2** (pragmatics), they haven't actually answered the classmate; they have just changed the subject from *justice* to *language* or *utility*. The slogan sounds like a master key, but it only opens the door if we already agree with Dennett's conclusion."

  This distinction allows you to acknowledge Dennett's insight (that we should focus on valuable capacities) while maintaining that the *dismissal* of the desert objection requires more argument than the slogan provides.
