  You say that Art should stand alone,
  And let the people be,
  But I say claim the prophet's tone,
  Let beauty fight for you and me.

  They watch us from a judgment place,
  To see if we are free,
  And scan the lines upon the face,
  Let beauty fight for you and me.

  For pretty lies will sell so sweet,
  And cost our liberty,
  I will not wear the mask complete,
  Let beauty fight for you and me.

  The veil hangs heavy on the brow,
  And hides what we can see,
  I lift it up to show you now,
  Let beauty fight for you and me.

  There is no difference in the song,
  Where truth sets captives free,
  Where truth and beauty both belong,
  Let beauty fight for you and me.
