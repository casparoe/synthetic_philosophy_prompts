      *   *Section 2: The Spandrel Definition.* Define it clearly (architectural byproduct -> biological byproduct of constraint/development).
      *   *Section 3: The Panda's Thumb.* This is the biggest error in the summary. Explain the difference between a spandrel (non-adaptive origin, maybe no function) and the Panda's thumb (non-adaptive origin, *current* function = Exaptation). The user's intuition is correct.
      *   *Section 4: Methodological Advice.* Did G&L say "assume non-adaptive"? No. They said "consider alternatives." The summary describes a reverse-Panglossian paradigm, which G&L would reject.
      *   *Section 5: Origin vs. Use.* Explain Adaptation vs. Exaptation. This is key to the Panda confusion.
      *   *Section 6: The Architecture.* Confirm the pendentive vs. spandrel point.
