      *   **Conflict:** Ecologist sees structural-demographic models (SDMs) as applicable to human history (elite overproduction, secular cycles). Historian sees this as numerology, reductionist, and ignores human agency/complexity.
      *   **Goal:** A joint statement for an "adversarial collaboration."
