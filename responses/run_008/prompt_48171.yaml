answer: |-
  You have reconstructed one of the most persistent and difficult problems in the metaphysics of causation: the **problem of profligate omissions** (sometimes called the "too many causes" objection to counterfactual theories). Your friend's attempt to use Lewisian similarity metrics is a standard move, but as you correctly noted, it fails when the gardener is distant or negligent.

  Here is the diagnosis: The argument is valid, but it is **unsound**. The flaw lies in **Premise (2)**.

  ### The Flawed Step: Premise (2)
  > *(2) What makes his omission causal can only be this: had he watered them instead, the plants would not have died. An omission is nothing, and nothing can contribute to an effect except through the difference it makes to what happens instead; the counterfactual is the whole story, or I do not know what else could be.*

  **Why it looked fine:**
  Premise (2) appeals to the **Counterfactual Theory of Causation**, which is intuitively powerful. It captures the idea that causes "make a difference." If the effect disappears when the cause is removed, the cause seems essential. Since omissions have no physical substance, it feels analytic that their *only* claim to causality is this counterfactual dependence. To deny (2) feels like denying the only handle we have on nothingness.

  **Why it is wrong:**
  Premise (2) conflates **counterfactual dependence** with **causal attribution**. While counterfactual dependence is likely *necessary* for causation by omission, it is not *sufficient*.

  If (2) were true, causation would be a purely extensional relation between events (or non-events) and outcomes, independent of context. But causal *attribution* is inherently **contrastive** and **context-sensitive**. When we say "X caused Y," we are implicitly answering a specific question: "Why did Y happen *rather than* not happen?" or "Why did Y happen *now*?"

  To solve the profligacy problem without abandoning the gardener case (1), you must adopt a view where causation relies on **defaults and deviations**.

  ### The Solution: Norms and Defaults
  The distinction between the gardener and you is not found in the physical structure of the universe, nor in the spatiotemporal "closeness" of possible worlds. It is found in the **normative expectation** that sets the "default" state of the world.

  1.  **The Gardener:** There is a norm (contractual, professional, or moral) that the gardener *should* water the plants. His watering is the expected "default" course of events. His *not* watering is a **deviation** from that norm.
  2.  **You:** There is no norm that you should water the plants. Your *not* watering is the **default** state of the world.

  On this view (championed by philosophers like H.L.A. Hart, Tony Honoré, and more recently Jonathan Schaffer), causation selects the *abnormal* condition that explains the outcome.
  *   **Gardener:** Deviation (Not Watering) $\rightarrow$ Effect (Death). **Causal.**
  *   **You:** Default (Not Watering) $\rightarrow$ Effect (Death). **Non-causal (Background Condition).**

  This handles the rain case (4) as well. In an arid climate, rain is the deviation (a miracle), so its absence is the default (non-causal). In a rainy season, rain is the default, so its absence is a deviation (causal drought).

  ### The Price of This Alternative
  You expressed worry that this makes causation "depend on norms and locations rather than on the world's causal structure." You must swallow this price.

  **The Cost:** You must accept that "causation" is not a purely natural kind term like "electron" or "mass." It is a **pragmatic concept** partly constituted by human interests, expectations, and norms.
  *   **Metaphysical Inflation:** If you refuse this cost, you are forced to accept that the causal structure of the universe changes based on who signed a contract.
  *   **Pragmatic Deflation:** The better view is that the *physical dependencies* are objective (the plants need water), but the *selection of causes* is pragmatic. The world provides the dependencies; we provide the causes.

  If you reject this, you are left with the alternatives below.

  ### Alternative 1: Reject Premise (1) (Eliminativism)
  **The Move:** Deny that omissions can ever be causes. The plants died of thirst (a positive physiological process); the gardener merely failed to prevent it.
  **The Price:** This saves metaphysical purity but wrecks ethics and law. If omissions aren't causes, negligence is impossible. You said you cannot accept this, and rightly so: it makes a hash of moral responsibility.

  ### Alternative 2: Accept the Conclusion (Causal Egalitarianism)
  **The Move:** Swallow the pill. Admit that metaphysically, you *are* a cause of the child's drowning, just as the gardener is a cause of the plants' death.
  **The Price:** This inflates causation until it loses explanatory power. If everything that could have prevented an event is a cause of the event, then "cause" no longer helps us distinguish what happened from what merely *could have* happened.
  **What is left of the distinction?**
  If you take this route, the distinction between "causing a death" and "failing to prevent one" collapses metaphysically. It survives only as a **moral and legal distinction**.
  *   **Metaphysics:** We are all causes.
  *   **Morality:** The gardener is *responsible*; you are not.
  This creates a disconnect: you would be causally implicated in tragedies you had no power to know about, which you must then morally exonerate. Most philosophers find this separation too costly; it makes causation irrelevant to responsibility.

  ### Recommendation
  Reject the claim in **(2)** that the counterfactual is the "whole story."

  The counterfactual is the *engine* of causation, but **norms provide the steering**. The gardener causes the death because his omission is a **salient deviation** from the expected course of events. Your omission is not salient; it is part of the background.

  This does not mean causation is "subjective." It means it is **contextual**. Just as "tall" depends on a comparison class (tall for a jockey vs. tall for a basketball player), "cause" depends on a contrast class (watering vs. not watering *given the role of gardener*).

  **Summary of the fix:**
  1.  **Keep (1):** The gardener caused the death.
  2.  **Modify (2):** Counterfactual dependence is necessary, but causal attribution requires a **contrast** determined by norms or defaults.
  3.  **Block (3):** You satisfy the counterfactual, but you do not satisfy the normative contrast. Therefore, you are a *condition* of the death, but not a *cause*.

  This preserves the utility of the word "cause" without denying the reality of omissive causation. It admits that our causal talk is designed for agents navigating a social world, not just for gods observing physical dependencies.
