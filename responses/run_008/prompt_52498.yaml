  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **On the Cognitive and Cultural Evolution of Religious Phenomena**

  **Date:** [To be inserted]
  **Signatories:** [Name of By-product Theorist] & [Name of Adaptationist Theorist]

  ## 1. Agreed Empirical Claims
  We, the undersigned, acknowledge the following propositions as established working premises for this collaboration. These claims represent the common ground upon which our divergent explanations are built. We accept these as descriptive observations of the world, without necessarily agreeing on their ultimate causal explanation.

  1.  **Recurrence and Constraint:** Religious concepts, rituals, and organisational structures recur across widely separated cultures, but they do not vary randomly. They appear in restricted, highly transmissible shapes.
  2.  **Cognitive Foundations:** The cognitive biases underpinning religious thought (such as sensitivity to agency, teleological reasoning, and intuition about substances) are real, measurable, and present in children prior to religious instruction. These biases pre-date specific religious traditions.
  3.  **Costly Participation:** Participation in religious rituals frequently involves significant costs (time, resources, physical pain, or opportunity costs). The magnitude of these costs correlates positively with an individual's stated commitment to the group and their reliability in inter-member interactions.
  4.  **Cultural Inheritance:** Populations inherit religious practices through social learning and transmission. None of this requires that the specific content of religious beliefs be genetically encoded.
  5.  **Non-Uniformity:** Religious phenomena are not uniform. There is a measurable distinction between the small-scale, shamanistic traditions of foraging bands and the doctrinal, moralising traditions associated with large-scale agrarian states.

  ## 2. Residual Disagreements
  While we agree on the phenomena listed above, we disagree on their explanatory status. The following table summarises the core theoretical divergences. Each statement is phrased so that the respective signatory accepts it as an accurate representation of their position.

  | Domain of Dispute | Position A (Cognitive By-product) | Position B (Cultural Adaptation) |
  | :--- | :--- | :--- |
  | **Primary Function of Ritual** | Costly rituals are primarily signals of individual commitment or by-products of anxiety-management systems. They do not necessarily solve group-level coordination problems. | Costly rituals are mechanisms that solve the 'free-rider' problem. They function to stabilise cooperation within large groups by making defection expensive. |
  | **Ontology of 'Religion'** | 'Religion' is not a natural kind. It is a grab-bag label for various cognitive outputs that share a family resemblance but have no single unifying cause or function. | 'Religion' names a functional category of cultural systems. Regardless of cognitive origins, these systems function as integrated units that sustain group cohesion. |
  | **Level of Selection** | Evolutionary pressures operated primarily on individual cognition. Religious thought is a side-effect of mental machinery selected for individual survival (e.g., predator detection). | Evolutionary pressures operated on cultural groups. Groups with more effective religious systems out-competed or out-survived groups without them. |
  | **Role of Belief** | Beliefs are often post-hoc rationalisations of intuitive cognitive processes. The content matters less than the memorability of the concepts. | Beliefs (specifically regarding surveillance and punishment) are functional tools. The content matters because it specifically targets cooperative behaviour. |

  ## 3. The Crux: Pre-registered Predictions
  To move beyond theoretical stalemate, we identify the temporal relationship between **Social Complexity** (large-scale, anonymous societies) and **Moralising High Gods** (deities concerned with human ethics and punishment) as the critical test case. We record the following predictions regarding what careful comparative historical work will demonstrate.

  **Prediction A (By-product Signatory):**
  Historical analysis will show that complex social structures can and do arise *without* prior belief in moralising high gods. Where such gods appear, they will often emerge *after* the rise of social complexity, serving as a retrospective justification for existing hierarchies rather than a prerequisite for cooperation. The correlation between gods and complexity is due to larger societies generating more elaborate theological concepts, not gods creating larger societies.

  **Prediction B (Adaptationist Signatory):**
  Historical analysis will show that the rise of moralising high gods systematically *precedes* or coincides exactly with the transition to large-scale, anonymous cooperation. In cases where social complexity arises without these beliefs, the society will be unstable or short-lived. The beliefs are a necessary causal condition for scaling up human cooperation beyond kin networks.

  **Adjudication:**
  We agree to review the relevant archaeological and historical data together within twelve months. If the data consistently supports Prediction A, the Adaptationist will concede that moralising gods are not a necessary adaptation for complexity. If the data consistently supports Prediction B, the By-product Theorist will concede that these specific beliefs play a functional causal role in social scaling that cannot be explained by cognitive bias alone.

  ## 4. Shared Taxonomy of Traits
  A significant portion of our past disagreement stems from inconsistent use of the terms 'adaptation' and 'by-product'. To remedy this, we adopt the following three-category taxonomy for classifying specific traits. We define them as follows:

  *   **Genetic Adaptation:** A trait of the individual human brain/body shaped by natural selection to solve a specific problem of survival or reproduction.
  *   **Cultural Adaptation:** A trait of a cultural system (practice, belief, norm) shaped by cultural selection to solve a problem of group stability or transmission.
  *   **By-product (Spandrel):** A trait that exists only as a consequence of other systems functioning; it was not selected for directly, either genetically or culturally, though it may have secondary effects.

  We classify the four candidate traits below according to this taxonomy. Where we agree, the classification is listed once. Where we disagree, both classifications are listed.

  | Trait | Classification | Notes on Agreement/Disagreement |
  | :--- | :--- | :--- |
  | **Agency Detection** (The tendency to perceive agents in ambiguous stimuli) | **Genetic Adaptation** | **Agreed.** Both sides accept this is a cognitive mechanism evolved for predator/prey detection, not specifically for religion. |
  | **Ecstatic Experience** (Altered states of consciousness during ritual) | **By-product** | **Agreed.** Both sides accept this is a physiological side-effect of rhythmic activity or stress, though we disagree on whether it is later co-opted for group bonding. |
  | **Costly Ritual** (Sacrifice, fasting, ordeal) | **Disagreement** | **Side A:** By-product of commitment signalling or anxiety reduction.<br>**Side B:** Cultural Adaptation for group cohesion. |
  | **Moralising High Gods** (Deities policing social norms) | **Disagreement** | **Side A:** By-product of applying social intuition to agency concepts.<br>**Side B:** Cultural Adaptation for enforcing norms in large groups. |

  ## 5. Closing Statement on Verbal Disputes
  We conclude by acknowledging that a substantial portion of our eighteen-month debate has been verbal rather than substantive. Specifically, the word **'adaptation'** has been doing duty for two distinct concepts in our respective camps.

  When the **By-product Theorist** speaks of adaptation, they refer almost exclusively to **Genetic Adaptation** of the individual organism. From this vantage point, if religion is not genetically encoded, it cannot be an adaptation in the primary sense, and must therefore be a by-product.

  When the **Adaptationist** speaks of adaptation, they refer primarily to **Cultural Adaptation** of the group system. From this vantage point, even if religion is not genetically encoded, it can still be an adaptation if it is selected for at the cultural level because it enhances group survival.

  We recognise that many of our past arguments involved one side denying the other's conclusion because they were answering different questions. The By-product Theorist was answering: *"Did natural selection build a religious module in the brain?"* (Answer: No). The Adaptationist was answering: *"Did cultural selection build religious systems that sustain groups?"* (Answer: Yes).

  By signing this document, we agree to cease arguing past one another on this definition. We accept that both statements can be true simultaneously: religious cognition may rely on genetic by-products while religious systems function as cultural adaptations. Our remaining dispute is not about definitions, but about the empirical weight of evidence regarding which of these forces is the dominant driver of religious history.

  ***

  **Signed:**

  _________________________ (By-product Theorist)

  _________________________ (Adaptationist Theorist)
