answer: |-
  Your roommate is deploying a sophisticated variation of an argument that actually exists in the literature (often discussed in the context of "intrapersonal utility comparisons" or the "multiple selves" model in behavioral economics). It is formally clever, but it conflates **logical possibility** with **normative necessity**.

  He is right that the *math* doesn't care if the inputs come from different people or different time-slices. He is wrong that the *implications* are the same.

  Here is how you dismantle the argument without conceding that democracy is impossible or that you are an irrational mess. You need to attack the **normative status of the axioms**, specifically **Non-Dictatorship**, and the **temporal structure of choice**.

  ### 1. The Normative Defense: Non-Dictatorship is Political, Not Logical
  Arrow's Theorem proves you cannot have (Unrestricted Domain + Pareto + IIA + Non-Dictatorship). You must drop one.

  *   **In Democracy:** We treat **Non-Dictatorship** as a moral imperative. A voting system where one person always wins is tyranny. Therefore, because we refuse to drop Non-Dictatorship, we must accept that our collective decision-making will sometimes be intransitive or inconsistent (the "Impossibility").
  *   **In the Individual:** We treat **Non-Dictatorship** as a bug, not a feature. For an individual to act, there *must* be a "dictator." There must be a mechanism that resolves conflicts between "hungry me" and "dieting me." We call this **Will**, **Agency**, or **Identity**.

  **The Counter-Argument:**
  "Arrow's Theorem isn't a law of physics; it's a constraint on *constitutions*. In a political constitution, we forbid dictatorship to protect liberty. In a psychological constitution, we *require* a 'dictator' (a unified executive function) to enable action. If I drop Non-Dictatorship for myself, I don't become irrational; I become an **agent**. If I keep Non-Dictatorship for the state, I don't become impossible; I accept that **legitimacy costs efficiency**."

  **The Cost:** You admit that the "Self" is not a pre-existing atom but a constructed hierarchy where some preferences (second-order volitions) rule over others.
  **The Payoff:** You save democracy. The impossibility of perfect democratic consistency is the price of freedom; the "impossibility" of individual consistency is solved by authority (self-mastery).

  ### 2. The Technical Defense: Sequential vs. Simultaneous Aggregation
  Arrow's Theorem applies to a function that takes a profile of orderings and produces *one* ordering **simultaneously**.

  Your roommate is modeling time as a set of simultaneous inputs ("Tuesday-Me" and "Wednesday-Me" submit ballots to "Life-Me"). But that's not how time works.
  *   **Social Choice:** All voters exist simultaneously. The aggregation must happen at once to produce a social state.
  *   **Individual Choice:** Decisions are sequential. "Tuesday-Me" chooses on Tuesday. "Wednesday-Me" chooses on Wednesday.

  There is no single moment where all temporal selves submit rankings to be aggregated into a single life-plan *unless* you assume a "God's eye view" at T=0.
  *   If you assume that view (I plan my whole life at birth), then **Tuesday-Me is a Dictator** over Wednesday-Me. (See Point 1: This is fine for individuals).
  *   If you don't assume that view, then there is no single aggregation function violating Arrow. There is just a sequence of choices. If my preferences change, that's not an Arrow violation; that's **preference change**, which Arrow's static model doesn't cover.

  **The Counter-Argument:**
  "Arrow assumes a static profile of preferences. My temporal selves aren't voting simultaneously; they are acting sequentially. If I change my mind, that's not an intransitive social welfare function; it's a dynamic preference update. You're trying to run a static theorem on a dynamic process."

  ### 3. The Domain Defense: Unrestricted Domain is False for Selves
  Arrow requires **Unrestricted Domain**: The aggregation rule must work for *any* logical combination of voter orderings.
  *   **Voters:** Voter A can love X>Y>Z while Voter B loves Z>Y>X. There is no causal link between their brains.
  *   **Temporal Selves:** My preferences at T1 are causally linked to my preferences at T0. I cannot simply "have" any preference tomorrow. My psychology imposes continuity constraints (habit, memory, identity).

  Because the domain of possible preference profiles for a single person over time is **restricted** by psychology and biology, Arrow's theorem technically doesn't apply. The "Impossibility" only arises if your temporal selves are as independent as strangers. They aren't.

  **The Counter-Argument:**
  "Arrow requires Unrestricted Domain. Strangers' preferences are independent; my temporal preferences are causally linked. The space of possible 'intrapersonal profiles' is restricted by psychological continuity. Therefore, the theorem doesn't trigger."

  ### How to Deploy This (Without Sounding Like *Him*)

  Don't get bogged down in the math. He knows the math. Attack the **philosophical pricing**.

  Say this:
  > "Your argument works mathematically but fails normatively. Arrow's Theorem tells us we can't have a specific set of nice properties.
  >
  > In **politics**, we prioritize **Non-Dictatorship** because we value equality. So we accept the inconsistency.
  >
  > In **psychology**, we prioritize **Consistency** (Rationality) because we value agency. So we accept the 'Dictatorship' of the executive self.
  >
  > You're treating the axioms like laws of nature. They aren't. They're design constraints. We design democracies to avoid tyrants, even if it makes them messy. We design selves to avoid paralysis, even if it means some impulses get vetoed. The fact that I solve my internal conflicts with authority doesn't mean the state should solve its conflicts with authority."

  ### Summary of the Trade-Offs

  | Axiom | Democratic Context | Individual Context | Why the Difference? |
  | :--- | :--- | :--- | :--- |
  | **Non-Dictatorship** | **Keep.** (Essential for liberty) | **Drop.** (Essential for agency) | Politics requires equality; Action requires hierarchy. |
  | **Unrestricted Domain** | **Keep.** (Voters are independent) | **Drop.** (Selves are causally linked) | Psychology restricts possible preference shifts. |
  | **Result** | **Impossibility.** (Cycles/Instability) | **Possibility.** (Unified Will) | Democracy is hard; Sanity is mandatory. |

  ### The "Insufferable Roommate" Checkmate
  If he pushes back and says, "But that's special pleading," you reply:

  > "It's not special pleading; it's **category error**. The 'Impossibility' in democracy is a feature of *pluralism*. The 'Impossibility' in the individual is a feature of *pathology*. If a person actually exhibited Arrow's paradox (intransitive choices over time without learning), we wouldn't say 'Ah, they are a perfect democracy of selves.' We'd say they have **executive dysfunction**. The fact that we treat internal dictatorship as 'health' and external dictatorship as 'tyranny' proves the two cases aren't analogous."

  **Verdict:** You can keep Arrow as a constraint on democracy. The cost is admitting that "Individual Rationality" requires a form of internal authoritarianism (self-control) that we rightly reject in politics. That is a price worth paying.
