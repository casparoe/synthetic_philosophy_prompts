answer: |-
  Yes, there is a single account that captures all of these intuitions without requiring you to discard any of your verdicts. Your intuitions are remarkably consistent with a view in the philosophy of language known as the **Normative Endorsement Account** (sometimes associated with expressivism or presupposition theories).

  ### The Theory: Normative Endorsement

  On this account, the derogatory force of a slur isn't just about the literal definition (semantics) or just about what the speaker means in the moment (pragmatics). Instead, slurs encode a **normative perspective**: a social rule or attitude that the target group is inferior, contemptible, or subordinate.

  To use a slur (outside of specific protected contexts) is to **signal endorsement** of that normative perspective.

  Here is how this single principle explains your cases:

  1.  **Two Black friends (Fine):** This is **reclamation**. By using the word within the in-group, they are not endorsing the perspective of White supremacy; they are subverting it. They are changing the norm associated with the word.
  2.  **White guy quoting rap (Not fine):** He is an outsider. He cannot access the reclaimed norm. By speaking the word, he signals endorsement of the historical, oppressive norm, regardless of his personal intent. The word carries the history he cannot opt out of.
  3.  **Linguist abstract (Fine):** This is **mention, not use**. She is talking *about* the word, not using it to refer to people. She is not endorsing the perspective; she is reporting on the linguistics.
  4.  **Linguist examples (Less fine):** This is **use**. Even if her intent is academic, tokening the word in sentences risks normalizing the toxicity for the reader. It forces the reader to process the slur without the protective context of reclamation. It flirts with endorsing the perspective by treating the word as a standard variable.
  5.  **Homophobe "pro-housing" (Not fine):** The predicate ("deserve housing") is positive, but the subject term encodes the normative perspective that gay men are inferior. He is saying, "Even [inferior people] deserve housing." The slur undermines the apparent support.
  6.  **Gay man contemptuous (Not fine):** He has the "license" of identity, but he is weaponizing the oppressive norm against his own group. He is endorsing the perspective that the other person is contemptible *because* they are gay. The harm is the same as the homophobe's because the normative perspective being activated is the same.
  7.  **Straight banter (Not fine):** Even if not targeting gay people, using the word as a generic intensifier trivializes the history of violence attached to it. It endorses the norm that the word is "light" enough for banter, which ignores the weight of the oppression it signifies.
  8.  **Translator (Fine):** This is **attributed use**. The translator is not speaking in their own voice; they are faithfully representing the voice of the original author. The endorsement belongs to the character/author of the novel, not the translator. Inventing a slur would be the translator endorsing the norm; keeping an existing one is archival fidelity.

  ### Do Any Verdicts Have to Go?

  **None of your verdicts need to be discarded.** They form a coherent set under the Normative Endorsement Account.

  However, the tension point in your list—and the one most likely to be challenged by a different theory—is the **Straight Guy Banter** case. A pure Pragmatic Account (which says meaning is only about speaker intent) would argue that if no gay person is targeted and no harm is intended, it shouldn't be derogatory. But your intuition (and the Normative Account) correctly identifies that the *word itself* carries a social weight that makes it "not fine" regardless of the immediate intent. Keeping this verdict is the right move; it acknowledges that language carries history beyond the immediate conversation.

  The other potential friction point is between the **White Rap Quoter** and the **Translator**. Both are outsiders reproducing the word. The distinction lies in **adoption vs. attribution**. The rapper quotes the lyric to adopt the flow/persona (making it his own speech act), while the translator explicitly signals "this is not my speech act, this is the original author's." Your verdicts correctly distinguish these.

  ### The New Case: The Assimilated Outsider

  **Case:** Someone who is an outsider by birth (e.g., a white person adopted into a Black family as an infant, or a straight person married into a gay community for decades) using the word.

  **Prediction:** **It depends on Social License, not Biology.**

  Under the Normative Endorsement Account, the "fine/not fine" distinction isn't about DNA; it's about whether the speaker is operating within the **reclaimed norm** or the **oppressive norm**.

  *   **If the in-group accepts them:** If the community views this person as "one of us" and grants them explicit or implicit social license, their use functions like the "Two Black Friends" case. They are endorsing the *reclaimed* perspective, not the oppressive one. It is **Fine**.
  *   **If the in-group rejects them:** If the community views them as an outsider regardless of their history, their use signals an assumption of privilege ("I can say this even though I'm not one of you"). This endorses the oppressive norm of entitlement. It is **Not Fine**.

  **Why:** Derogation is a social phenomenon. The "license" to use a reclaimed slur is granted by the community that was harmed by it, not by genetics. If the community has absorbed the individual to the point where their use is understood as solidarity rather than appropriation, the normative perspective shifts to the reclaimed one. If there is any doubt about their standing, the default assumption reverts to the oppressive norm, making the use derogatory.

  **Summary:** Your gut is tracking a sophisticated philosophical distinction. The word derogates when its use signals endorsement of a perspective of inferiority. It stops derogating when the context (in-group status, mention, attribution) breaks that link of endorsement.
