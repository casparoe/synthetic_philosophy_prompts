  2.  **Deconstruct Weber's Thesis (Key Concepts):**
      *   *Calling (Beruf):* Religious duty to work in a worldly vocation.
      *   *Salvation Anxiety:* Uncertainty about election; work alleviates anxiety but doesn't earn salvation.
      *   *Signs of Election:* Success/wealth as evidence of God's favor (not the cause).
      *   *Asceticism:* Rational, methodical self-denial to avoid distraction from work.
      *   *Iron Cage:* Eventually, the religious root dies, leaving only compulsive work for work's sake.

  3.  **Map Hustle Culture:**
      *   *Calling:* The "hustle" itself is the vocation. Self-optimization is the duty.
      *   *Anxiety:* Not salvation, but irrelevance/precarity. Fear of falling behind (FOMO).
      *   *Signs:* Productivity metrics, wealth flexes. But here, striving *produces* the outcome (meritocracy), unlike Weber's predestination.
      *   *Asceticism:* Cold showers, 5 a.m. routines, sacrificing rest (reframed as recovery).

  4.  **Identify Breaks/Critiques:**
      *   *Theology vs. Meritocracy:* Weber's elect status is fixed; hustle culture promises transformation through work. It's transactional, not evidentiary.
      *   *Commercialization:* Weber saw asceticism as internal/religious; hustle culture is externally sold (courses, influencers). It's a product, not just a spirit.
      *   *Structural Blindspots:* Weber ignores class (gig economy vs. owner), geography (Global South), gender (unpaid labor).

