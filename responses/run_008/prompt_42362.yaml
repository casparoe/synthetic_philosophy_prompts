answer: |-
  **Question 4 (40 minutes)**

  Recall the Absent-Minded Driver (AMD) scenario: two intersections, payoffs 0 (Exit 1st), 4 (Exit 2nd), 1 (Continue past 2nd). The driver cannot distinguish intersections (imperfect recall).

  Consider the following argument posed by a classmate:

  > "Since the driver cannot distinguish the two intersections, they are effectively one decision node from the driver's point of view. The ex ante optimal plan (Continue at 1st, Exit at 2nd) is therefore simply unavailable rather than irrational due to this informational constraint. Once you accept this constraint, doing the mixed-strategy calculation at the single effective node gives you the right answer. There is no paradox left, just an extra constraint on the driver's feasible set."

  (a) Critically evaluate the claim that the ex ante optimal plan is merely "unavailable" rather than indicative of a deeper rationality issue. (10 points)
  (b) Explain whether treating the intersections as a "single effective node" licenses the standard optimization procedure without further modification. Specifically, address how the action taken at this node influences the probability of reaching the second instance of that node. (15 points)
  (c) Briefly conclude what this shows about the relationship between planning under ex ante commitment and acting under imperfect recall. (5 points)

  ***

  **Model Answer**

  The classmate's argument correctly identifies the information set structure but fails to capture the dynamic inconsistency that generates the paradox. While it is true that the pure strategy "Continue then Exit" is unavailable without commitment, labeling this merely as a constraint obscures the conflict between the driver's ex ante preferences and their interim incentives.

  Regarding (a), the issue is not just feasibility but time consistency. The ex ante optimal plan yields a payoff of 4. However, if the driver reaches the second intersection, their interim preference shifts. Given imperfect recall, upon arriving at any intersection, the driver must form beliefs about their location. If they plan to Continue with probability $p$, the probability they are at the first intersection is $\alpha = 1/(1+p)$. The expected utility of Exiting is $4(1-\alpha)$, while Continuing yields $p\alpha + 1(1-\alpha)$. For the plan to be executable without commitment, the action must be optimal at the information set given these beliefs. The "unavailable" claim ignores that the driver's future self will deviate from the ex ante plan because, at the second node, Exiting dominates Continuing given the updated beliefs. Thus, the plan is not just unavailable; it is dynamically inconsistent.

  Regarding (b), treating the intersections as a "single effective node" is heuristically useful for defining the information set, but it does not automatically license standard optimization. In a standard single-node decision problem, the probability of states is exogenous. In AMD, the "state" (being at intersection 1 vs. 2) is endogenous to the strategy $p$. The optimization at the single effective node must account for the fact that choosing "Continue" increases the probability of facing the decision node a second time. If one optimizes at the single node without weighting the payoffs by the probability of reaching each physical instance (the "forgetting" factor), one calculates the wrong expected utility. The standard solution requires maximizing ex ante expected utility subject to the constraint that the strategy is optimal at the information set (modified self-consistency). The classmate's argument risks treating the probability of being at the first vs. second intersection as fixed, rather than as a function of the choice variable $p$.

  Regarding (c), this demonstrates that under imperfect recall, ex ante planning and interim acting diverge because beliefs are strategy-dependent. Ex ante commitment restores the ability to maximize total trip utility, whereas acting under imperfect recall forces the agent to maximize utility conditional on being at the information set, which distorts the weighting of future outcomes. The paradox arises because rationality defined as interim optimization conflicts with rationality defined as ex ante optimization when recall is imperfect.

  ***

  **Marking Scheme**

  **A Answer (27-30 points)**
  *   **Part (a):** Explicitly identifies **dynamic inconsistency** or **time inconsistency**. Explains that the ex ante plan is not just infeasible but unstable because the interim incentives at the second node differ from the ex ante preferences.
  *   **Part (b):** Identifies the **endogeneity of beliefs** or probabilities. Notes that the probability of being at the first vs. second intersection depends on the strategy $p$ itself. Critiques the "single node" view for potentially ignoring the causal link between the action taken and the probability of reaching the second instance (the weighting issue).
  *   **Part (c):** Clearly distinguishes between **ex ante welfare** (commitment) and **interim rationality** (self-consistency). States that imperfect recall breaks the equivalence between planning and acting.

  **B Answer (21-26 points)**
  *   **Part (a):** Correctly states the plan is impossible without commitment but treats it as a purely **feasibility constraint** without discussing dynamic inconsistency or the deviation incentive at the second node.
  *   **Part (b):** Correctly notes that the calculation requires weighting by probabilities but fails to emphasize that these probabilities are **endogenous** to the choice variable. May accept the "single node" abstraction too readily without noting the causal complication.
  *   **Part (c):** Vaguely mentions that commitment helps or that recall is hard, but fails to articulate the divergence between ex ante and interim optimization criteria.

  **C Answer (15-20 points)**
  *   **Part (a):** Merely restates the payoffs or the setup.
  *   **Part (b):** Attempts the math but misses the conceptual critique of the "single node" argument.
  *   **Part (c):** No clear conclusion on commitment vs. recall.
