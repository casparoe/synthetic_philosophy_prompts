answer: |-
  You have stumbled upon the **St. Petersburg Paradox**, a famous problem in probability and economics first proposed by Nicolas Bernoulli in 1713.

  Here is the breakdown of who is right, why the math leads to a counter-intuitive result, and what fee you should set.

  ### 1. Who is reasoning better?

  **Friend B (The Pragmatist) is right about the game, but Friend A (The Mathematician) is right about the arithmetic.**

  *   **Friend A's Math:** They are mathematically correct. The expected value ($E$) is indeed infinite.
      *   Toss 1 (Heads): Probability $1/2$, Payout $\$2$. Contribution: $\$1$.
      *   Toss 2 (Heads): Probability $1/4$, Payout $\$4$. Contribution: $\$1$.
      *   Toss 3 (Heads): Probability $1/8$, Payout $\$8$. Contribution: $\$1$.
      *   Sum: $1 + 1 + 1 + 1 + \dots = \infty$.
  *   **Friend B's Intuition:** They are economically correct. No rational person would pay \$50 for a game where there is a 50% chance they win only \$2.

  ### 2. The Hidden Assumption

  Friend A is making a hidden assumption from classical economics: **that rational people maximize Expected Monetary Value.**

  They assume that every dollar has the same value to a person (Linear Utility). However, in reality, humans maximize **Expected Utility**. This concept, introduced by Daniel Bernoulli to solve this exact paradox, relies on **Diminishing Marginal Utility**.

  *   **The Logic:** The first \$1,000 you win is life-changing; the millionth dollar is just a number. As the payout doubles, the *happiness* (utility) it provides does not double.
  *   **The Result:** If you apply a standard logarithmic utility function ($U = \ln(x)$) to the payouts, the infinite series converges to a finite number. Mathematically, the "fair value" of this game to a typical person is only about **\$4**.

  Furthermore, Friend A ignores the difference between the **Mean** and the **Median**:
  *   **The Mean (Average):** Infinite (skewed by one-in-a-billion jackpots).
  *   **The Median (Typical Outcome):** \$2. (50% of the time, the game ends on the first flip).

  ### 3. What fee should you set?

  You should ignore the infinite expected value. If you charge a "steep fee" based on Friend A's logic, your booth will remain empty.

  **Recommended Fee: \$5.00 – \$10.00**

  *   **Why this price?**
      *   **Psychology:** Since the median payout is only \$2, a \$5 entry fee means 50% of players lose \$3 immediately. However, the small entry fee makes the potential for a massive jackpot feel like an exciting "lottery ticket" rather than a bad investment.
      *   **Fundraising:** At \$5, you cover the typical payouts (which are low) and generate a profit from the "long tail" of players who lose early.
      *   **Sustainability:** Charging \$20 or \$50 would be perceived as a "scam" because 87.5% of players would walk away with less money than they started with.

  **Summary:** Friend A calculated the average of a theoretical infinite universe; Friend B calculated the value for a human being in the real world. Listen to Friend B.
