      *   *Selection:* A small, isolated community facing a resource crisis or a structural decision. Let's go with a generational ship or a closed ecosystem where decisions have permanent consequences. Let's choose a "Sanctuary" town using a system called "The Mirror" to decide on a controversial infrastructure change (e.g., dismantling a historic but inefficient sector). This allows for the Aggregation Problem (some lose out) and Divergence (a character sees their future self agree to the loss).
      *   *Refinement:* To hit the "murder-Gandhi" point, I need a moment where a character refuses to change their mind even if it leads to worse outcomes, valuing their current integrity over the extrapolated improvement.
