      *   **Task:** Lay out distinct precise claims the slogan "You can't compare utility across people" could make (measurement, epistemic, ontological, disciplinary boundary). For each, assess plausibility, triviality/substantiveness, and whether it supports the first move (anti-tax) and/or undercuts the second (pro-aid), or if a consistent package exists.
      *   **Constraint:** No preamble. Lead with the bottom line in the first sentence.

  2.  **Deconstruct the Slogan ("You can't compare utility across people"):**
      *   *Claim 1: Ontological/Metaphysical.* There is no fact of the matter. Utility is ordinal and personal; there is no common scale existentially.
      *   *Claim 2: Epistemic.* There is a fact of the matter, but we cannot know/measure it scientifically.
      *   *Claim 3: Methodological/Disciplinary (Robbins' specific point).* Economics as a positive science cannot rely on value judgments (which IUC imply), even if ethics might.
      *   *Claim 4: Measurement/Operational.* Utilities lack a common unit (cardinality issue), making calculation impossible.

  3.  **Evaluate Each Claim against the Scenario:**
      *   *Scenario Move 1:* Anti-progressive tax (utilitarian argument fails because IUC invalid).
      *   *Scenario Move 2:* Pro-foreign aid (utilitarian argument succeeds because dollar goes further for poor abroad vs rich domestically).

      *   *Claim 1 (Ontological):* If IUC are meaningless, *both* arguments fail. Inconsistent to use Move 2.
      *   *Claim 2 (Epistemic):* If we can't know IUC, *both* arguments fail (as policy prescriptions based on utility maximization). Inconsistent.
      *   *Claim 3 (Disciplinary/Robbins):* Economics shouldn't *assert* IUC as scientific fact. But ethics can. Move 1 says "Economics can't justify tax." Move 2 says "Ethically/Morally we should do aid." This *could* be consistent if framed carefully (Positive vs. Normative), but usually, the foreign aid argument relies on the same empirical claim about marginal utility of income that the tax argument relies on. If the empirical claim is unscientific for tax, it's unscientific for aid.
      *   *Claim 4 (Measurement):* Similar to epistemic. If you can't measure, you can't calculate for tax or aid.

  4.  **Determine the "Bottom Line":**
      *   The colleague is being inconsistent unless they adopt a very specific, narrow disciplinary boundary claim (Robbins' actual view) while treating the foreign aid argument as purely ethical rather than economic/empirical. However, even then, the *reason* given for foreign aid ("dollar goes further") is an empirical claim about marginal utility of income across persons, which Robbins explicitly barred from scientific economics. So, practically, he is inconsistent.
      *   *Draft Bottom Line:* Your colleague is almost certainly being inconsistent, because every plausible precise reading of the "no interpersonal comparisons" slogan that blocks the progressive tax argument also demolishes the empirical premise required for his foreign aid claim.

