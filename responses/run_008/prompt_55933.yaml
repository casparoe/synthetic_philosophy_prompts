prompt: |-
  Our philosophy reading group did the Smart and Williams for-and-against book on utilitarianism last month, and afterwards two of the members kept the argument going in the pub, about the case Williams uses where a man can rescue his wife or two strangers from drowning but not both. I tried to follow along and mostly did, but I couldn't tell who was actually winning, so I want an outside referee. You're a professional moral philosopher, so please think carefully and don't just give me vibes -- maybe do some brainstorming about each move before you rate them, and be honest where someone is only half right.

  The exchange went roughly like this, five moves:

  (1) Maya said the utilitarian answer is obvious: two lives outweigh one, and from the impartial standpoint there's no morally relevant difference between the man's wife and the two strangers, so he ought to save the two. Any other answer is just letting affection do arithmetic's job.

  (2) Dan said that's exactly what Williams was on about: a man who has to work out that saving his wife is justified, or who does the sums and is relieved that the sums happened to favor her, has in some sense one thought too many. His devotion shouldn't have to win a deliberative contest. And anyway the wife is part of the man's ground projects and attachments, the stuff that makes his life his -- a theory that keeps being ready to tell him to set her aside treats him as just a container that utility passes through, which is what Williams meant by the integrity objection.

  (3) Maya answered that Dan is conflating the criterion of rightness with a decision procedure. A utilitarian, even a smart two-level one, can perfectly well say the husband should NOT stand there calculating in the moment -- the right act is still saving the two strangers, and the husband who spontaneously dives for his wife is admirable but morally lucky. She also said the integrity complaint proves way too much: the selfish careerist also has ground projects and attachments he refuses to set aside, and utilitarianism won't be impressed by his integrity either, so the objection can't be that the theory overrides projects, otherwise it just licenses anyone with a project.

  (4) Dan came back: if your theory only gets the husband to the right verdict by telling him not to think about it, its practical content is parasitic on the very motives it discredits, which should make you wonder what work the theory is doing. And re the careerist, that's a bad analogy -- the point was never that having projects excuses anything, it's that loving particular people, being a husband and not just an altruist with a spouse, is partly constitutive of a life worth living, and a theory that can't explain why that's valuable except as a useful input to welfare is missing something about value, not just about psychology.

  (5) Maya's last word: she suspects Dan's position isn't actually a rival moral theory at all, just an account of good character, and that the two of them aren't disagreeing about what the man ought to do -- they're answering different questions, one about right action and one about what it's admirable or decent to feel. She also accused Dan of sliding between the wife case, where the impartial verdict just feels harsh, and the life-project version of the integrity objection, which is a much bigger claim, and of not noticing he'd changed the subject somewhere between them.

  Please adjudicate move by move: for each of the five, say whether the person is clearly right, clearly wrong, or half right, and justify it. Then tell me who's more right overall, and what (if anything) both of them are missing. Its fine to bring in things neither of them said, as long as you're explicit that you're doing it.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Role:** Professional Moral Philosopher.
      *   **Task:** Adjudicate a five-move debate between Maya (Utilitarian defender) and Dan (Williams/Integrity critic) regarding Bernard Williams' famous "Jim and the Indians" / "Husband and Wife" critique of utilitarianism.
      *   **Format:** Move-by-move analysis (Right/Wrong/Half-Right + Justification), Overall Verdict, and Identification of Missing Elements.
      *   **Tone:** Careful, analytical, honest (no "vibes"), acknowledging nuance.

  2.  **Deconstruct the Debate Moves:**

      *   **Move 1 (Maya):** Classic Act Utilitarian stance. Impartiality is key. 2 lives > 1 life. Personal relationship is morally irrelevant from the "point of view of the universe."
      *   **Move 2 (Dan):** Williams' "One Thought Too Many" & "Integrity Objection." Deliberation undermines the relationship. Ground projects constitute identity. Utilitarianism alienates the agent from their actions.
      *   **Move 3 (Maya):** Criterion of Rightness vs. Decision Procedure distinction. Indirect Utilitarianism defense. The husband *should* save the wife spontaneously, even if the *theory* says 2 > 1. Integrity objection overgeneralizes (careerist analogy).
      *   **Move 4 (Dan):** Parasitism objection (theory relies on motives it condemns). Value objection (relationships are intrinsically valuable, not just instrumentally for welfare).
      *   **Move 5 (Maya):** Meta-ethical move. Dan is talking about character/virtue, not right action. Accusation of equivocation (harshness vs. integrity).

  3.  **Evaluate Each Move (Drafting the Analysis):**

      *   **Move 1 (Maya):**
          *   *Analysis:* This is standard Act Utilitarianism (AU). It's internally consistent. However, it ignores the specific nuance of Williams' critique, which targets *this* kind of rigid impartiality.
          *   *Verdict:* **Half Right.** It's the correct *utilitarian* answer, but it sets up the straw man Williams actually attacks. It ignores the distinction between justification and motivation which becomes crucial later.
      *   **Move 2 (Dan):**
          *   *Analysis:* Accurately cites Williams. "One thought too many" is the key phrase. The integrity objection is about alienation.
          *   *Verdict:* **Clearly Right (exegetically).** He captures Williams' core argument well. Philosophically, it's a strong challenge, though it relies on the assumption that utilitarianism *requires* the calculation in the moment (which Maya will challenge).
      *   **Move 3 (Maya):**
          *   *Analysis:* The Criterion/Decision Procedure distinction is the standard utilitarian rebuttal (Smart's "negative responsibility" / "two-level utilitarianism"). The careerist analogy is interesting but maybe slightly off-target (integrity isn't just *any* project).
          *   *Verdict:* **Half Right.** The distinction is valid and saves utilitarianism from the "calculating husband" absurdity. However, the careerist analogy weakens her point because Williams distinguishes between *ground projects* (constitutive of self) and mere selfish desires.
      *   **Move 4 (Dan):**
          *   *Analysis:* The "parasitism" point is strong (Williams/Stockier). If utilitarianism needs non-utilitarian motives to work, is it self-effacing? The value point attacks the axiology (hedonic/welfarist vs. relational value).
          *   *Verdict:* **Clearly Right.** This deepens the critique beyond psychology to value theory. It challenges the utilitarian conception of the good, not just the right.
      *   **Move 5 (Maya):**
          *   *Analysis:* She tries to compartmentalize. "You're doing virtue ethics, I'm doing normative ethics." This is a common defensive move. Is it valid? Partially. But Williams argues the theory of *right action* shapes the agent. The equivocation charge is fair (Williams mixes examples), but the core point remains.
          *   *Verdict:* **Half Right.** She correctly identifies a category difference, but dismisses the implication that a theory of right action *must* accommodate moral psychology. You can't fully separate "what to do" from "who to be."

  4.  **Synthesize the Overall Winner:**
      *   Maya defends a sophisticated Utilitarianism (Smart-style).
      *   Dan defends a Williams-style Integrity/Agent-Centered view.
      *   *Who wins?* In contemporary meta-ethics, Maya's "Decision Procedure" defense is the standard reply, but Dan's "Value/Alienation" critique is generally seen as the deeper philosophical wound. Utilitarianism can *accommodate* the action (save the wife) via indirect rules, but it struggles to *value* the relationship intrinsically.
      *   *Verdict:* Dan has the deeper philosophical point, but Maya has the more robust normative framework for *action*. However, since the debate is about Williams' specific critique, Dan captures the *spirit* of the objection better. Maya saves the theory by changing the subject slightly (from justification to psychology). I'll lean towards Dan having the stronger *critique*, but Maya having the more defensible *theory*. Actually, the prompt asks "who's more right overall." In the context of Williams' specific argument, Dan is more faithful to the problem. Maya is defending a modified utilitarianism that concedes ground. I will call it a draw with a slight edge to Dan on the philosophical depth of the objection, but acknowledge Maya's technical defense is standard.
      *   *Refinement:* Let's look closer. Maya's Move 5 is a bit of a dodge. Dan's Move 4 is the knockout punch regarding value. Maya's Move 3 is the strongest utilitarian defense. Overall, Dan exposes a limit in utilitarianism that Maya admits (by saying "don't think about it"). Dan wins on the *diagnosis*, Maya wins on the *prescription*. But since the topic is Williams' critique, Dan is "more right" about what Williams was showing.
      *   *Decision:* I will declare it a **Draw with a nuance**: Maya wins on normative coherence (how to act), Dan wins on moral phenomenology (what it feels like to be a moral agent). But if forced to choose who better represents the *truth* of the situation, Dan's point about the value of relationships is less reducible than Maya admits. I'll give the edge to **Dan** for identifying the axiological deficit, which is harder to fix than a decision procedure.

  5.  **Identify Missing Elements:**
      *   **Supererogation:** Is saving the wife supererogatory?
      *   **Special Obligations:** Do we have duties to specific people?
      *   **Rule Utilitarianism:** Maya hints at it (decision procedure), but doesn't fully deploy Rule Utilitarianism which might actually *mandate* saving the wife.
      *   **The "Point of View of the Universe":** Sidgwick's phrase.
      *   **Agent-Relative Reasons:** The technical term for what Dan is groping towards.

  6.  **Drafting the Response:**
      *   *Intro:* Acknowledge the classic nature of the debate (Smart vs. Williams).
      *   *Move-by-Move:* Be precise. Use terms like "Criterion of Rightness," "Decision Procedure," "Agent-Relative Reasons," "Alienation."
      *   *Overall:* Weigh the technical defense against the phenomenological critique.
      *   *Missing:* Bring in Agent-Relative Reasons and Rule Utilitarianism distinctions.

  7.  **Review against Constraints:**
      *   "Professional moral philosopher" tone.
      *   "Don't just give vibes."
      *   "Brainstorm about each move before rating." (I will incorporate this reasoning into the justification).
      *   "Honest where someone is only half right."

  8.  **Final Polish:** Check the "Careerist" analogy in Move 3. Maya says integrity objection proves too much. Dan replies it's about constitutive projects. This is a crucial pivot. I need to make sure I highlight that Dan's correction in Move 4 is vital. Maya's Move 5 attempt to separate "right action" from "character" is the weakest link because Williams argues they are linked.

      *(Self-Correction during drafting)*: I need to be careful not to simply say "Williams is right." I need to evaluate *Dan's representation* of Williams. Dan represents Williams well. Maya represents Smart well. This is basically a reenactment of Smart vs. Williams.
      *   Move 1: Maya is standard AU. Correct within system, ignores the critique. -> Half Right.
      *   Move 2: Dan captures Williams perfectly. -> Right.
      *   Move 3: Maya uses the Smart defense (Decision Procedure). This is technically strong but concedes the psychological point. The careerist analogy is weak. -> Half Right.
      *   Move 4: Dan hits the axiological point. This is the strongest philosophical move. -> Right.
      *   Move 5: Maya tries to compartmentalize. This is a category error in moral philosophy (action vs. agent). -> Half Right/Wrong.

      *Overall:* Dan wins on depth, Maya wins on systematic consistency. But Dan's points suggest the system is flawed, not just the application. So Dan takes it.

      *Missing:* Agent-relative reasons, Rule Utilitarianism (vs. Two-Level), Supererogation.

