answer: |-
  Here are ten interview questions designed to press the guest on the friction points of Moral Trade Maximalism, keeping the tone conversational but rigorous.

  ### 1. The Complicity Objection (Pro-Life/Pro-Choice)
  "Let's start with your favorite example: the pro-life and pro-choice donors pooling money for contraception. For a pro-life donor who believes abortion is murder, this trade works because they get fewer abortions. But does entering that contract make them complicit in the *possibility* of abortion that remains? If I believe something is evil, isn't facilitating the system where it happens—even to reduce it—a moral failure in itself?"

  *   **Follow-up A (If he says 'Consequences matter more than purity'):** "So you're saying moral integrity is just a preference like any other? If I can get a 'better outcome' by shaking hands with someone I think is a murderer, I should do it?"
  *   **Follow-up B (If he says 'We already do this in politics'):** "Politics is messy compromise. You're proposing *apps* and *contracts* that formalize this. Doesn't building an institution around it legitimize the view you're trading with?"
  *   **⚠️ Suspicious Answer:** "It's just a tool, tools are neutral." (Push back: Institutions shape norms, they aren't neutral.)

  ### 2. The Complicity Objection (Everyday Trade vs. Moral Markets)
  "I know where you'll go with this: we buy gas from dictatorships and clothes from sweatshops every day, so why is a moral trade different? But isn't there a distinction between *incidental* trade with bad actors and *intentional* trade *about* the bad act? When you build a market specifically to monetize a moral disagreement, aren't you signaling that the disagreement is just a difference in taste, not truth?"

  *   **Follow-up (If he says 'All values are subjective preferences'):** "If values are just preferences, then moral trade is easy. But most people feel morality is about *truth*. If you're wrong about slavery, I shouldn't trade with you; I should stop you. How does your model handle moral truth claims?"
  *   **⚠️ Suspicious Answer:** "We can't know moral truth, so we must trade." (Push back: That's an epistemological claim, not a moral one, and it begs the question.)

  ### 3. Intra-Personal vs. Inter-Personal Uncertainty
  "You treat hedging your own moral uncertainty—like splitting donations between utilitarian and deontological charities—as the same logical move as paying a vegetarian to stay vegetarian. But one is internal prudence, and the other is outsourcing your conscience. If I pay *you* to be good on my behalf, haven't I severed the link between my own agency and my moral responsibility?"

  *   **⚠️ Suspicious Answer:** "The outcome is the same, so the agent doesn't matter." (Push back: Moral development requires personal action, not just buying results.)

  ### 4. The "Indulgence" Effect
  "Medieval Catholics could buy indulgences to pay off sin. I'm worried moral offsets create a modern fee schedule. If I know I can pay a vegetarian to offset my burger, does that degrade my motivation to actually change my habits? Does this market teach people that ethics is just a subscription service?"

  *   **⚠️ Suspicious Answer:** "People will do it anyway, this is better than nothing." (Push back: Markets create demand; you might be *creating* sinners who wouldn't have existed otherwise.)

  ### 5. The Hard Limit
  "I want to test the boundary. Can you name a specific moral trade you would refuse to facilitate on principle? Not because the math doesn't work, but because the transaction itself is wrong. If you can't name one, your theory looks like it allows anything to be priced."

  *   **⚠️ Suspicious Answer:** "It depends on the price/efficiency." (Push back: If it depends only on price, there are no rights, only costs.)

  ### 6. Wealth and Power Dynamics
  "These trades require capital. In your meat-offset market, the rich meat-eater pays the poor vegetarian to stay virtuous. Doesn't this turn morality into a luxury good where the wealthy buy the right to sin, and the economically vulnerable are pressured to sell their moral stance to survive?"

  *   **⚠️ Suspicious Answer:** "The vegetarian chooses to participate voluntarily." (Push back: Economic coercion undermines voluntary consent.)

  ### 7. Crowding Out Intrinsic Motivation
  "Psychologists talk about 'motivational crowding out'—if you start paying people to do things they used to do for free, they stop doing them when the money stops. If we monetize moral behavior, do we risk destroying the intrinsic desire to be good once the market closes?"

  *   **⚠️ Suspicious Answer:** "We can phase it out later." (Push back: Cultural norms stick; you can't just turn off a market mindset easily.)

  ### 8. Enforcement and Verification
  "Let's get practical. If I pay you to remain a vegetarian for a year, how do we enforce that? Do we need surveillance? If you cheat and eat a steak, is it a breach of contract or a sin? Blending legal contracts with moral behavior seems like it requires a level of monitoring most people would find dystopian."

  *   **⚠️ Suspicious Answer:** "We can use existing verification tech." (Push back: Moral integrity shouldn't require a panopticon.)

  ### 9. Defining the "Tradable"
  "You say 'almost any disagreement' is a trade opportunity. What isn't tradable? Is there a category of moral claims that are off-limits to markets, or is your claim really that *everything* with a preference attached has a price?"

  *   **⚠️ Suspicious Answer:** "Everything is tradable if the gain is high enough." (Push back: This denies the concept of human dignity or inalienable rights.)

  ### 10. Freezing the Status Quo
  "Finally, moral progress often comes from refusing to compromise—abolitionists didn't trade with slaveholders, they demanded an end to slavery. By incentivizing compromise, doesn't Moral Trade Maximalism bias us toward the status quo and make radical moral progress harder to achieve?"

  *   **⚠️ Suspicious Answer:** "Radical change is risky; trade is safe." (Push back: Safety isn't the only moral virtue; justice sometimes requires conflict.)
