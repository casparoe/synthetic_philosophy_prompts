      *   *Specific Instruction:* Address the "attractor language" critique (Game Theorist).
      *   *Specific Instruction:* Identify the "forbidden question" (Legitimacy/Who is 'We').

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Make sure the Rawlsian objection sounds like a Rawlsian (public reason, legitimacy), not just a liberal.
      *   *Critique:* Ensure the Game Theorist objection hits the "math-washing" angle hard, as requested.
      *   *Critique:* The "Who is 'We'" question needs to be highlighted as the suspected "forbidden question."
      *   *Tone:* Respectful, academic, acknowledging the user's physics background while bridging to philosophy.

  6.  **Finalizing the Structure:**
      *   Introduction: Acknowledge the unique position (Physicist in Phil room).
      *   The Q&A Sheet (8 Objections).
      *   Strategic Advice: Concede, Hold, Forbidden Question.
      *   Specific focus on the "Attractor" language.

  7.  **Drafting the Content (Mental or Scratchpad):**
      *   *Q1 (Rawls):* "By what right?" Reply: Survival is a precondition for justice. Soft spot: Doesn't solve the transition legitimacy.
      *   *Q2 (Pettit):* "Domination." Reply: Domination requires a master. AI isn't a master if aligned. Soft spot: Who aligns it?
      *   *Q3 (Berlin):* "Value Monoculture." Reply: Diversity is good, extinction is final. Soft spot: Assumes we know which values preserve existence.
