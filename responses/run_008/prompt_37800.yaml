      *   *Q5 (Aristotelian):* "Flourishing." Reply: No flourishing if dead. Soft spot: Mere survival isn't *eudaimonia*.
      *   *Q6 (Epistemic):* "Roughly right values." Reply: Better than race dynamics. Soft spot: Circular.
