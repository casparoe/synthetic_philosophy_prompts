      *   *The Moral Depth of Shame:* Guilt says "I broke the rule." Shame says "I broke the trust/ideal." Guilt is transactional (I pay the debt). Shame is transformational (I must change). Without shame, guilt is just a fine you pay to keep speeding.
      *   *The Destigmatization Problem:* We want to destigmatize *being* an addict, but we want to stigmatize *lying* about it. That's a distinction in shame objects, not the absence of shame. If we remove all shame, we remove the fear of being unworthy.
