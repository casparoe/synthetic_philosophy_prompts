          *   *Mechanism:* Sectoral laws, strong private data flows, public records (transparency of gov/property).
          *   *Nuance:* Jealous of state eyes, permissive of corporate eyes.
          *   *Philosophical Tension:* Public/Private distinction. Does this hold up when corporations act like states (platform governance)?
          *   *Assessment:* Presupposes a negative liberty view (freedom *from* state), but relies on a robust civil society/market that might not exist in reality.

      *   **Chinese (The "Power/Order" Hybrid):**
