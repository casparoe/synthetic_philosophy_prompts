          *   *Mechanism:* Data minimization, purpose limitation (GDPR). Applies to state *and* private actors.
          *   *Nuance:* State *can* count (census happened), but with strict guards.
          *   *Philosophical Tension:* Is it dignity (inalienable, you can't sell yourself into data slavery) or control (you decide how data is used)? The user asks if a control-based view could license the same rules.
          *   *Assessment:* It looks like dignity because it limits *consent* (you can't just waive rights easily), but it functions like control (self-determination).

      *   **American (The "Liberty/Market" Hybrid):**
