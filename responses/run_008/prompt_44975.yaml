      *   *Correction on China:* Avoid calling it "totalitarian" (too blunt). Use "Legibility" (James C. Scott) and "Rule by Virtue/Trust." The user mentioned "visibility must run uphill." Stick with that. It's a theory of *asymmetric transparency*.

  5.  **Addressing the "Underdetermination" Requirement:**

