          *   *Underdetermination:* Libertarianism vs. Republicanism (civic transparency).
          *   *Fragility:* If the 4th Amendment expands to cover private actors (state action doctrine expansion) or if commercial data is reclassified as non-speech.
      *   **China:** Address the Theory of Power vs. Theory of Person.
          *   *Argument:* It's not privacy theory; it's legibility theory. "Visibility must run uphill."
          *   *Underdetermination:* Confucian trustworthiness vs. Leninist control.
          *   *Fragility:* If citizens gain reciprocal visibility (transparency laws) or if the system shifts from punishment to service without surveillance.
      *   **Comparative Synthesis:** Whitman's view holds for DE/US but fails to capture CN. DE/US share a commitment to the *subject* (the individual has rights), CN commits to the *object* (the citizen is a node to be managed).
      *   **Fragility & Falsification:** This is the most important part for the user. I need to be specific about what legal changes would break these philosophical attributions.

  4.  **Refining the Philosophical Nuance (Self-Correction during drafting):**

      *   *Correction on Germany:* Don't say it *is* dignity. Say it *invokes* dignity to justify limits on control. The "Informational Self-Determination" right is key. It sounds like control ("Self-Determination"), but the Court grounded it in Dignity. This is the knot. A pure control theorist (libertarian) would say "I should be able to sell my data." Germany says "No, that undermines the precondition of personality."
