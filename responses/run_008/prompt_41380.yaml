answer: |-
  **Product:** Moral Language Suite (Expressivist Edition)
  **Maintainers:** Non-Cognitive Systems Group
  **Release Channel:** Stable

  **v1.0.0 — Initial Release**
  *   **Feature:** Core Assertive Engine deployed. Users can now utter standalone moral sentences (e.g., "Murder is wrong") to successfully emit non-cognitive attitude payloads.
  *   **Spec:** Sentences function as expressive outputs rather than descriptive maps. No truth-conditional overhead included to maximize ontological efficiency.
  *   **Known Issue:** System assumes all usage occurs in simple assertion contexts.

  **v1.2.4 — Hotfix (The Embedding Patch)**
  *   **Fix:** Addressed Crash #102 where negating a moral sentence caused a null pointer exception on truth values. Previously, `not("Murder is wrong")` failed to distinguish between denying the attitude and asserting the negation of the content.
  *   **Fix:** Patched Conditional Module. Users reported that `if ("Murder is wrong") { ... }` stopped executing logic flows. The system could not process the antecedent without asserting the consequent.
  *   **Regression:** Performance lag increased when nesting attitudes. Users report stack overflow errors when attempting to evaluate "If stealing is wrong, then encouraging stealing is wrong."

  **v2.0.0 — Higher-Order Attitude Update**
  *   **Feature:** Introduced Recursive Attitude Wrapper. To handle embedding without truth conditions, the system now generates attitudes toward patterns of attitudes.
  *   **Change:** Disjunctions now render as "Disapproval of holding incompatible attitudes."
  *   **Bug Report #404 (Logic Consistency):** Multiple users in the Support Forum report that Modus Ponens fails in mixed arguments. When combining a descriptive major premise with a moral conditional, the conclusion does not feel binding.
      *   *User Ticket:* "I asserted 'If lying is wrong, do not lie' and 'Lying is wrong.' The system refused to enforce 'Do not lie.' Error log says: 'Truth-apt content missing from major premise. Inference invalid.'"
  *   **Engineering Note:** We are exploring ways to make validity constraint-based rather than truth-based.

  **v3.5.0 — Minimalist Truth Compatibility Layer**
  *   **Feature:** Added deflationary `is_true()` predicate. This allows moral sentences to pass validity checks in mixed arguments without committing to robust moral facts.
  *   **Change:** Moral sentences now behave as truth-apt in embedded contexts while retaining expressive payload in standalone assertions.
  *   **Deprecation:** The pure "Attitude-Only" mode is deprecated due to incompatibility with standard logical operators (AND, OR, IMPLIES).
  *   **Known Issue:** Users note that the `is_true()` predicate behaves identically to the realist correspondence model during runtime. Engineering claims this is a UI artifact, not a backend change.

  **v4.0.0 — Long Term Support (LTS)**
  *   **Feature:** Full Compositional Semantics Module integrated. Moral language now supports negation, conditionals, disjunctions, and belief ascriptions without syntax errors.
  *   **Change:** To ensure validity in mixed arguments, the system now assigns proposition-like content to all moral sentences.
  *   **Performance:** Stability improved significantly. Logic flows now execute deterministically.
  *   **Migration Notice:** Users upgrading from v1.0 will notice the system now requires a truth-conditional kernel to operate.
  *   **Competitor Analysis:** Internal benchmarking confirms this release is behaviorally indistinguishable from Moral Language Suite (Realist Core) v5.2.
  *   **Status:** Difference between Expressivist Edition and Realist Core marked as "Working as Intended."
  *   **Comment:** When asked why the non-cognitive backend was replaced entirely, Lead Dev stated: "The embedding problem required a truth-conditional solution. We solved it. The ontology is a separate module we no longer load."

  **Support Forum Thread #8921**
  *   **User:** LogicLord99
  *   **Topic:** Modus Ponens still feels weird
  *   **Post:** "I know the update says validity is fixed, but when I run a moral syllogism, it feels like I'm just describing my feelings rather than deriving a conclusion. Is there a flag to force actual bindingness?"
  *   **Dev Response:** "Bindingness is a user-side configuration. The backend now supports truth-apt inference. Please clear your cache and accept the realist implications to resolve."
