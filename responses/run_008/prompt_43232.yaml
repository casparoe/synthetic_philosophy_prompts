  *(Self-Correction during drafting)*: Wait, if I say it survives as risk assessment, isn't that still a "discount"? Yes, but it's not a *moral* discount. It's a *safety* discount. I need to make sure I distinguish between "you get less time because you're a better person" (Desert) vs "you get less time because you're safer" (Consequentialism). The current system conflates them. My verdict should be that the *moral* discount must die, even if the *risk* adjustment remains.

  Let's sharpen the "Suffering in Prison" point. Why doesn't post-sentencing remorse count? Because sentencing is the moment of *commitment*. Once committed, the state needs certainty. Also, parole *does* consider remorse sometimes. The user says "genuine remorse that arrives the day after sentencing also gets you nothing." That's slightly inaccurate (parole boards), but I should address the *sentencing* moment specifically. The sentencing moment is about *projection*.

  Okay, ready to write. The stance will be: The practice is a "Retributive-Communicative Hybrid" that is incompatible with Hard Incompatibilism. It *must* be abolished or radically transformed to be just to the remorse-incapable. Roommate wins the point, but loses the nuance on *why*.

