      *   **The "Mark of the Cognitive":** Need to specify what makes something cognitive. Internalists often point to intrinsic intentionality or the specific causal role within the neural architecture.
      *   **The "Sleeping Otto" point:** Bring up the discontinuity argument. The notebook/AI doesn't process when not accessed. The brain does.
      *   **Tone:** Respectful, rigorous, slightly provocative but fair.

  3.  **Drafting the Response (Iterative Process):**
