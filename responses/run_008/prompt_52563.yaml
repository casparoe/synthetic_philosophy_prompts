      *   **Constraint:** Stay in character until "stop". Keep replies to 1-2 paragraphs. Live conversation feel.
      *   **User's Opening:** Uses autocomplete AI as an example of extended mind. Claims it satisfies Otto's criteria (availability, access, trust, endorsement). Challenges internalist to distinguish notebook from autocomplete, or explain why neither counts, without circular definition ("brain = mind").

  2.  **Determine the Internalist Response:**
