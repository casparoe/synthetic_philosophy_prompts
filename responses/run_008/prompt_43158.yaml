  My brother-in-law is one of those guys who watched a couple of regenerative farming documentaries and now thinks he's found the ultimate gotcha for vegetarians. His claim: if you eat grass-fed beef from a local farm, you're actually responsible for fewer animal deaths than a vegan, because harvesting grain and vegetables grinds up enormous numbers of field mice, rabbits, frogs and whatever else lives in the fields, whereas a single cow is one death that yields a huge amount of food. When I pushed back he asked me how many mice I think die per loaf of bread and honestly I had no idea, so I've been going back and forth ever since. I was vegan for two years and now I eat some dairy so this isn't academic for me, I actually want to know if I've been getting this wrong.

  Give me your actual credence on his claim, with the number decomposed into the pieces it depends on rather than just a vibe. Define it like this so it has a truth value: an average adult's yearly food supply based on beef from cattle that spent their whole lives on pasture (hay in the winter, minimal grain finishing) causes fewer vertebrate deaths, counting both slaughter and collateral harvest deaths, than the same year of food from a typical vegan diet of conventionally farmed crops. Some terms you might want: your probability that small-animal mortality in crop farming is high enough per calorie for this to even be in the running; your probability that "grass-fed" cattle actually get almost all their calories from pasture and hay rather than from harvested feed (if they eat a lot of grain the whole argument collapses back onto the same field deaths); your probability that the right way to add up deaths weights a cow and a mouse roughly equally versus scaling somehow by sentience or lifespan or brain, since if you weight heavily toward cows the math flips the other way; and your probability that it even matters morally that harvest deaths are unintentional rather than deliberate — is accidentally shredding a mouse more like killing it or more like collateral damage you didn't aim at, or does the death count not care about intentions at all.

  Then put the terms together, tell me which one the final number is most sensitive to (my guess is it lives or dies on the field-mouse numbers, but I might be wrong), and tell me what evidence would actually move your credence most — like what would a really careful study of harvest mortality have to show, or what would have to be true about how much grain "grass-fed" cows really eat. And as a quick side question, does anything change if instead of beef vs a vegan diet it's chicken vs a vegan diet? My brother-in-law eats plenty of supermarket chicken too and I've always suspected that part of his diet is doing way more damage than he admits, but I'd like to hear whether the same decomposition says that.
