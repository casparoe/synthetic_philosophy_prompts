      *   *Recommendation:* Modify (2). Move from a syntactic consequence-counting view to a semantic *similarity* view (state-space/natural properties).
      *   *Why?* It saves (3) (invariance is possible with natural properties), saves (4) (NM is close in state space), saves (1) (realism), and refines (5) (truth is the target state).
      *   *Cost:* It requires admitting that "consequences" isn't the fundamental metric; "distance in possibility space" is. It requires a commitment to "natural kinds" or a privileged ontology to solve the language dependence.

