      *   If the "True Theory" is the target, and NM is strictly false, the "distance" is maximal in the theoretical domain unless we introduce a *metric* of similarity (which (2) seems to reject in favor of "true/false consequences").
      *   *Conflict:* A binary true/false consequence count (2) struggles to capture "approximate truth" against a precise target (5) when the theory is strictly false. You need a *measure* of distance, not just a count of truths/falsehoods.

