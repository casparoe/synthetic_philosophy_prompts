  2. If two-dimensional semantics is shown to be stipulative machinery designed solely to protect dualism rather than capturing actual linguistic behavior, the framework begs the question despite attempts to ground it in natural language. This moves down if independent linguistic evidence robustly supports primary/secondary intension splits in non-philosophical contexts.

  3. Demonstrable cases where ideal conceivability diverges from metaphysical possibility in logic or mathematics would undermine the general bridge principle, which a two-dimensionalist concedes would break their modal epistemology. This moves up if specific mathematical conjectures are proven conceivable yet false despite ideal reasoning.

  4. A successful Phenomenal Concept Strategy that explains the epistemic gap via cognitive architecture without ontological divergence blocks the inference, though proponents typically wave this off as failing to explain the hard problem. This moves down if Chalmers' objections to PCS regarding structural vs. non-structural concepts hold firm.

  5. Illusionism denies the existence of the phenomenal qualities being conceived, dissolving the argument by rejecting the datum rather than the inference, which is a bullet most dualists refuse to bite. This moves up if neuroscientific accounts of introspective error become as compelling as sensory error theories.
