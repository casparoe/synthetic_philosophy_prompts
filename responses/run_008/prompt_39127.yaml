      *   *The Problem:* In the rule code (`if is_harassment(content): escalate()`), the system isn't actually escalating *yet*. It's defining the relationship. If "Harassment" *means* "Escalate," then the antecedent means "Escalate." So the rule reads: "If Escalate, then Escalate." That's a tautology, not a policy.
      *   *Negation/Appeals:* User says "This is NOT Harassment." If Harassment = Ban, then Not Harassment = No Ban. But in the appeals logic, we are debating the *truth* of the label to determine the *action*. If the label is just the action, there's nothing to debate.
      *   *Mixed Inference:* Premise 1 (Fact): "User sent message M." Premise 2 (Norm): "Message M is Harassment." Conclusion: "Ban User." If Premise 2 is just an attitude ("Boo M!"), how does it logically combine with Premise 1 to force the Conclusion? In code, it works because of the engine. In logic, it's tricky if the premises have different semantic types (descriptive vs. prescriptive).

