      *   **Expressivism/Noncognitivism:** "X is wrong" $\neq$ "X has property Wrongness." It means "Boo X!" or "Do not do X." It's an expression of attitude or a command.
      *   **Frege-Geach Problem:** If "X is wrong" just means "Boo X!", what does it mean in "If X is wrong, then Y"? In the conditional, I'm not saying "Boo X!" I'm hypothesizing. If the meaning *is* the attitude, the conditional loses its meaning because the attitude isn't being expressed. Also, how do we validate logical inferences like Modus Ponens if the premises are attitudes and the conclusion is an attitude?

