  6.  **Final Polish:** Check against constraints. Strong logic background (use terms like antecedent, validity, schema). One intro philosophy course (explain Frege-Geach clearly). Honest critique.

      *(Self-Correction on the "Mixed Inference" part)*: In philosophy, the problem is how a normative premise and a descriptive premise yield a normative conclusion. In engineering, this is `Fact (User posted X) + Rule (If X then Ban) -> Action (Ban)`. The "Rule" is the normative bit. If the Rule is just an attitude, does it bind the engine? Yes, because the engine is the embodiment of the attitude. But the *label* inside the rule needs to be stable.

      *(Refining the ML section)*: ML makes the "attitude" statistical. This complicates the Frege-Geach point because the "label" is now a probability. Does `if probability > 0.8` solve it? Yes, it turns the norm into a descriptive threshold. That's the "Realist" patch.

