      *   *Part 3:* "Homework stakes" is bad. "Free time" is good. Let's make it: "If you think the character deserves help, stand up." No, that's just opinion. "If you feel fear, press this button to 'save' them." It's symbolic.
      *   *Wait, the prompt asks for "small real stakes".* How about: If the majority felt genuine fear, the tutor assigns a 200-word reflection. If they felt 'quasi-fear', no reflection. This makes the *classification* have stakes. Or: "We have 10 mins left. If you believe the emotion was real, we spend it discussing ethics. If quasi, we pack up."
      *   *Best Idea for Part 3:* The "Donation" simulation. "A charity is taking donations for the victim you just saw." (But they find out it's fictional). This highlights the *blockage* of action.
      *   *Let's go with the User's idea:* "What we do with the last 10 minutes."
      *   *Confidence:* I am least sure about Part 3 working as intended. Students are cynical. They know it's a tutorial.

  5.  **Finalising the Structure:**
      *   **Title:** Tutorial Plan: The Paradox of Fiction (Experiential).
