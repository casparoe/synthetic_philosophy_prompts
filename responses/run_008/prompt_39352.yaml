  *(Self-Correction on Part 3)*: The user wants "small real stakes". Let's use the "End of Class" stake. If they vote the emotion was 'real', the tutor (user) leads a serious discussion (work). If 'quasi', they can leave 5 mins early or chat informally. This makes the *ontological status* of the emotion determine the *action* of the class.

