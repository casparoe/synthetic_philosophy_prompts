      *   *Compromise:* I will design the activity but add a HUGE warning about the deception. I'll suggest using a clip where the "realness" is ambiguous (e.g., a scene from *The Office* vs actual CCTV). Actually, the safest bet is to use a clip that is *definitely* fiction but frame the *context of viewing*.
