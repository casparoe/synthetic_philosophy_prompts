      *   **Part 1 (The Belief Manipulation):**
          *   *Ethical Check:* Lying to students about footage being "real" (e.g., footage of an accident) is a no-go if it causes distress. If it's benign (e.g., someone running), it might not evoke emotion.
          *   *Solution:* Use a clip that is emotionally ambiguous or use a "Breaking News" overlay vs. "Film Scene" overlay.
          *   *The Reveal:* Must be handled gently. "This was a pedagogical device to test the belief condition."
      *   **Part 2 (Suspense):**
          *   Instead of rewatching (takes too long), use a *spoiler* intervention. Tell them the ending, then show the climax. Ask if they felt suspense.
      *   **Part 3 (Action Tendencies):**
          *   Idea: A fictional petition. If the character suffers, the class has to do a boring task. If they succeed, they get free time.
          *   *Problem:* They know it's fake. Does it prove action tendencies?
          *   *Refinement:* Make it about *consistency*. "If you felt fear, you should want to help. Do you?"
      *   **Debrief:** Connect the dots.
          *   Part 1 -> The Belief Condition (Radford).
          *   Part 2 -> The Knowledge Condition (Suspense).
          *   Part 3 -> The Action Condition (Walton/Quasi-emotion).
      *   **Risk Assessment:** What if they don't feel anything? What if they hate the deception?
      *   **Confidence Flags:** Be honest about the "Action Tendencies" bit. That's the weakest link philosophically.

