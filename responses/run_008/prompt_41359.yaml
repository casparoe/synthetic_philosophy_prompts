answer: |-
  # The 10-Minute Heritability Triage Checklist

  **Purpose:** To catch the five most common statistical fallacies in genetics reporting before deadline.
  **Users:** Copy editors, standards desk, section editors.
  **Time:** 10 minutes max. If it takes longer, punt to an expert or cut the claim.

  ### Phase 1: The Five-Point Scan
  Read the sentence or paragraph containing the genetic claim. Check for these triggers.

  **1. The "Individual" Trap**
  *   **Trigger:** Does the text say a specific person's trait is "X% genetic" (e.g., "60% of John's IQ is genetic")?
  *   **Rule:** Heritability applies to *variance in a population*, not individuals.
  *   **Action:** **STRIKE** the percentage applied to the individual.

  **2. The "Within/Between" Slip**
  *   **Trigger:** Does the text use a heritability estimate from *within* a group (e.g., white twins in the UK) to explain differences *between* groups (e.g., why Group A scores higher than Group B)?
  *   **Rule:** High within-group heritability tells you nothing about between-group differences.
  *   **Action:** **STRIKE** the causal link.

  **3. The "Immutable" Fallacy (The PKU Test)**
  *   **Trigger:** Does the text imply that because a trait is heritable, it cannot be changed by environment or policy?
  *   **Rule:** Highly heritable traits can be environmentally malleable (e.g., PKU is 100% genetic but cured by diet; height is highly heritable but increased by nutrition).
  *   **Action:** **STRIKE** the claim that intervention is futile. **SOFTEN** to "intervention may be more challenging" *only* if evidence supports it.

  **4. The "Uniform Environment" Bias**
  *   **Trigger:** Was the heritability measured in a population with very similar environments (e.g., wealthy, modern, stable)?
  *   **Rule:** Heritability looks higher when environments are uniform. It does not mean genes matter *more* absolutely, just that environmental variance is low.
  *   **Action:** **SOFTEN**. Add context: "in this specific environment."

  **5. The "Time Travel" Error**
  *   **Trigger:** Is a heritability number from one era/population applied to a different era/population (e.g., 1970s twins applied to 2024 policy)?
  *   **Rule:** Heritability is population- and time-specific. It does not transport.
  *   **Action:** **STRIKE** the number if the context has shifted significantly.

  ---

  ### Phase 2: Decision Matrix

  | If the claim... | Then... | Why? |
  | :--- | :--- | :--- |
  | **Violates Trigger 1, 2, or 3** | **STRIKE** | These are empirically false. |
  | **Violates Trigger 4 or 5** | **SOFTEN** | These are misleading but fixable with qualifiers. |
  | **Moves from Stat to Policy** | **PUNT** | Science describes; policy prescribes. This is a values call. |
  | **Involves Complex GWAS/Polygenic Scores** | **PUNT** | If the reporter says "Gene for X found," it's usually hype. Requires expert review. |

  ---

  ### Phase 3: Where Judgment is Dressed as Procedure
  Be honest: You cannot fully automate this. Two steps require human intuition:
  1.  **Defining "Uniform Environment" (Trigger 4):** There is no cutoff for how similar is "too similar." If the study was on affluent twins in a welfare state, environmental variance is low. If it was on a diverse national cohort, it's higher. You must judge if the reporter is treating a specific $h^2$ as a universal constant.
  2.  **The Policy Punt:** The checklist can tell you the *science* doesn't support the *policy*, but it cannot tell you if the policy is bad. You must decide if the story survives without the genetic justification.

  ---

  ### Phase 4: Running the Procedure on Your Queue

  #### Case 1: IQ, Heritability, and Head Start
  **The Claim:** "IQ heritability estimates run high in modern cohorts (approx. 0.8), so Head Start-style programs can't do much and we should say so."
  **The Scan:**
  *   **Trigger 1 (Individual):** No.
  *   **Trigger 2 (Within/Between):** No.
  *   **Trigger 3 (Immutable):** **YES.** The claim equates high heritability with low malleability.
  *   **Trigger 4 (Uniform Env):** **YES.** "Modern cohorts" often imply stabilized environments, inflating $h^2$.
  *   **Trigger 5 (Time Travel):** No.
  **The Verdict:**
  1.  **STRIKE** the conclusion that programs "can't do much." This fails the PKU Test.
  2.  **SOFTEN** the heritability number to specify it applies to *variance in current environments*, not potential.
  3.  **PUNT** the policy recommendation. The statistic cannot support a funding decision.
  **Result:** The paragraph must be rewritten. The stat remains only if qualified; the policy conclusion must be supported by outcome data, not genetics.

  #### Case 2: GWAS and "Genes for Education"
  **The Claim:** "A GWAS found common variants explaining variance in educational attainment. The missing heritability is solved; genes for education found."
  **The Scan:**
  *   **Trigger 1 (Individual):** **YES.** "Genes for education" implies individual prediction.
  *   **Trigger 2 (Within/Between):** No.
  *   **Trigger 3 (Immutable):** Implied.
  *   **Trigger 4 (Uniform Env):** Likely (GWAS often use UK Biobank-style data).
  *   **Trigger 5 (Time Travel):** No.
  **The Verdict:**
  1.  **STRIKE** "Missing heritability is solved." (It rarely is; rare variants and epistasis usually remain).
  2.  **STRIKE** "Genes for education found." (These are statistical associations, not causal "genes for" a complex social outcome).
  3.  **SOFTEN** to "Genetic markers *associated* with educational attainment."
  4.  **PUNT** if the reporter insists on causal language. This requires a genetics specialist to verify the variance explained vs. total heritability.
  **Result:** The headline and lede must be downgraded from "Discovery" to "Association."

  #### Case 3: Rare Genetic Condition (High Penetrance)
  **The Claim:** "Carriers of Mutation X essentially always develop the condition if they live past age 40."
  **The Scan:**
  *   **Trigger 1 (Individual):** No, refers to carriers as a class.
  *   **Trigger 2 (Within/Between):** No.
  *   **Trigger 3 (Immutable):** **NO.** This is a high-penetrance Mendelian (or near-Mendelian) trait, not a complex polygenic trait. The PKU Test does not apply in the same way; the genetic cause *is* the primary driver.
  *   **Trigger 4 (Uniform Env):** Irrelevant for high-penetrance rare variants.
  *   **Trigger 5 (Time Travel):** No.
  **The Verdict:**
  1.  **ALLOW** the strong claim.
  2.  **DO NOT HEDGE** with "environment matters too" unless there is specific evidence that environment alters *onset* or *severity*.
  3.  **Result:** Standard "environment matters" hedging is scientifically inaccurate here and should be cut.

  ---

  ### The Answer You Won't Like
  **Case 1 (IQ/Head Start)** is the one that will cause friction.
  **Why:** The procedure correctly identifies that the heritability statistic *cannot* support the policy conclusion (futility of intervention). However, the procedure **cannot confirm the opposite** (that Head Start *will* work).
  **The Pain Point:** You will be forced to strip the reporter's primary evidence for their thesis without being able to validate the thesis yourself. You are left with a story that says "Genetics doesn't prove futility," but you still don't know if the program is effective. This forces you to either kill the story's angle or demand new reporting on program outcomes at deadline. The checklist protects you from falsehoods, but it leaves you with a hole in the narrative.

  ---

  ### Limitations: What This Procedure Cannot Do

  **1. Extrapolation Across Eras/Populations**
  The procedure tells you to **STRIKE** numbers that are transported (Trigger 5). It *cannot* tell you what the *correct* number would be. If a reporter asks, "Well, what *is* the heritability in this population?" you cannot answer that without a new study. You must write "Unknown" or "Not measured."

  **2. Distinguishing GxE (Gene-Environment Interaction)**
  If a trait is heritable *only* under stress, this checklist might miss it. It assumes a main-effects model. If the story is specifically about interaction (e.g., "The 'depression gene' only activates after trauma"), this checklist is too blunt. **Punt** those stories.

  **3. The "Values" Boundary**
  The procedure can identify when science is being used to justify a value judgment (e.g., "Therefore, we shouldn't fund X"). It cannot tell you if the value judgment is *wrong*, only that the *science* doesn't support it. You must decide if the story is opinion masquerading as news.

  **4. Genuine Empirical Uncertainty**
  Sometimes the science is actually contested (e.g., the exact heritability of schizophrenia). This checklist assumes the reported number is real, just misused. If the number itself is dubious, you need a human expert. If you don't have one, **PUNT** the number entirely. It is better to have no number than a wrong one.
