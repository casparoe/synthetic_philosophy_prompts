  So I've fallen down a rabbit hole with the Judy Benjamin problem (the one van Fraassen introduced in the 80s, about updating on a conditional). Quick recap so we're on the same page: Judy gets dropped into a swampy region at night. The region is divided into Blue territory and Red territory. HQ radios her and says: we can't tell you which territory you're in, but if you're in Blue territory, it's twice as likely you're in the Red-occupied part of it as in the Blue-occupied part. That's it. From HQ she only ever expected to be equally likely to be anywhere, so beforehand she'd put something like 1/2 on being in Blue territory (equal areas, say). The classic line is that she should now put 1/3 on being in Blue territory, and 2/3 on Red. But some people think the answer should stay at 1/2, and others say the evidence just doesn't pin down a unique posterior.

  I want your actual credence that 1/3 is the uniquely rational answer here -- a number, and then the derivation. Specifically decompose it into sub-questions like (roughly, adjust as you see fit): the probability that this kind of conditional evidence is properly handled by treating it as a constraint on her conditional credence and updating to the closest distribution that satisfies it; the probability that "closest distribution" talk is even well-defined enough to force a unique answer (this is where the entropy / information-minimization debates come in, and where I suspect things get shaky); the probability that the right framework says rationality is permissive here -- i.e., any posterior in some range is fine and there is no fact of the matter about which is *the* rational one; and anything else you think belongs, like whether the answer depends on weird stuff such as what Judy would assume about the relative sizes of the territories or how she'd react to being told multiple conditionals.

  Assign each term a rough probability with one line of justification, combine them, and tell me which term the final number is most sensitive to. Then two more things: which term are you least confident in and what kind of argument or result would move it the most, and also -- I have one friend at 1/3 saying it's just conditioning, and another at 1/2 saying a conditional with a false antecedent tells you nothing about Blue territory so why update at all, and a third who says the question is ill-posed -- which pair of them do you think most likely actually disagrees about the substantive sub-question rather than talking past each other? thx
