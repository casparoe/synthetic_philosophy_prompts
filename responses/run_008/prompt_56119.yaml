answer: |-
  This is a fantastic choice for a civics write-up. You are absolutely right that Douglass's flip is the critical hinge here. Most people stop at "Douglass hated the Constitution" or "Douglass loved the Constitution," missing the strategic evolution in between.

  Here is the reasoning on where Douglass would land in the modern debate, followed by a definitive position you can use for the assignment.

  ### The Reasoning

  To figure out where Douglass stands today, we have to understand *why* he changed his mind in 1851. When he was a Garrisonian, he believed the Constitution was pro-slavery because the *people* who wrote it were slaveholders and the *results* of the document protected slavery. When he flipped, he didn't suddenly love the slaveholding founders. He realized that if he wanted to destroy slavery, he couldn't stand outside the system denouncing it; he had to wield the system's own weapons against it.

  In his 1860 Glasgow speech, Douglass argues that we must look at the "objects and purposes" of the Constitution, not just the "corrupt practices" of the time. He famously said, "Interpreted as it ought to be interpreted, the Constitution is a GLORIOUS LIBERTY DOCUMENT." Note the phrasing: *"Interpreted as it ought to be."* That is not a historical claim; it is a moral one. He wasn't saying, "I surveyed all the founders and 51% of them hated slavery." He was saying, "The text promises liberty, so we are morally obligated to read it that way."

  This is where he diverges from modern originalism. Modern originalism often seeks to freeze the "public meaning" of a text at the moment of ratification. If the public in 1787 or 1868 accepted prison labor, a strict originalist says, "Then it is constitutional." Douglass would reject that. He would argue that the *principle* of the 13th Amendment was the eradication of the "badges and incidents of slavery." If a loophole (like the punishment clause) is used to recreate the very system the Amendment was designed to destroy, Douglass would argue that the *application* has betrayed the *purpose*.

  Douglass treated the Constitution as a tool for liberation, not a relic to be preserved. In the 1850s, an originalist reading (focusing on the text's silence on slavery and the Preamble's promise of liberty) served liberation. Today, if an originalist reading is used to defend unpaid prison labor or restrict voting rights based on a narrow 19th-century understanding, the tool is no longer doing the job.

  Furthermore, Douglass lived through the "Second Founding" of Reconstruction. He understood that the 13th, 14th, and 15th Amendments fundamentally altered the Constitution's operating system. He wouldn't let 1787 originalism override 1868 originalism. He would argue that the Reconstruction Amendments created a new baseline of equality that must expand, not contract. To use the "punishment exception" in the 13th Amendment to justify a carceral state that disproportionately targets Black men would strike him as a betrayal of the Amendment's soul, regardless of what the text literally says.

  ### The Position

  **Frederick Douglass would not be a modern originalist.**

  While he used originalist *tactics* in the 1850s to break the grip of slavery, he was never an originalist in principle. He was a **Constitutional Pragmatist**. He believed the document was valid only insofar as it secured liberty.

  If you forced him to choose between the two modern camps, he would side with the **Living Constitution**.

  Here is why: Modern originalism often functions as a brake on social change, arguing that rights not explicitly recognized in the past cannot exist today. Douglass's entire life was an argument that rights *must* expand to meet the promises of the founding. He would argue that the Constitution contains broad principles (Liberty, Equality, Due Process) that must be applied livingly to new contexts (like the modern prison-industrial complex) to ensure they actually result in freedom.

  He would look at the punishment clause of the 13th Amendment and say: "The text allows this, but the *purpose* of the Amendment forbids it." That is not originalism; that is purposivism, a core tenet of living constitutionalism. Douglass would tell your daughter's class that we do not worship the text; we use the text to build a more perfect union. If the "original meaning" builds a prison, we must find the "living meaning" that builds a home.

  **For the write-up:**
  Focus on the idea that Douglass's method was **teleological** (focused on the end goal of liberty) rather than **archeological** (focused on digging up the past). He used the past when it helped liberty, and he would discard it the moment it became a shackle.
