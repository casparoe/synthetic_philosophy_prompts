answer: |-
  ### Part 1: Mapping the Logical Space

  Before we build the quiz, we need to map the territory. You have correctly identified the "Paradox of Voting": the cost of voting (time, effort) exceeds the expected benefit (probability of decisiveness $\times$ value of the winner). Since your arithmetic is sound, anyone who votes is relying on a different *framework* for decision-making than simple individual causality.

  Here are the five distinct "engines" that drive voting behavior, plus the one that drives abstention. Your friends are likely running different engines but using the same words ("civic duty," "matters") to describe them.

  1.  **The Rational Abstainer (Pure Instrumentalist):**
      *   *Logic:* Voting is an investment. If the return is zero, don't invest.
      *   *Trigger:* Large elections with safe outcomes.
      *   *Exception:* Small elections (HOA) where odds are better.

  2.  **The High-Stakes Calculator (Expected Utility):**
      *   *Logic:* The odds are tiny, but the prize (the welfare of 300 million people) is so massive that "tiny $\times$ massive" still beats the cost of gas and time.
      *   *Trigger:* Any election where the stakes are high, regardless of odds.

  3.  **The Expressive Voter (Fan Theory):**
      *   *Logic:* Voting is consumption, not production. It's like cheering at a game. You don't expect your cheer to change the score, but it feels good to support the team.
      *   *Trigger:* Identity alignment.

  4.  **The Duty-Bound Citizen (Deontologist):**
      *   *Logic:* Voting is a moral obligation, like telling the truth or keeping a promise. It is wrong *not* to do it, regardless of the outcome.
      *   *Trigger:* Internal conscience, not external results.

  5.  **The Norm Sustainer (Rule Utilitarian):**
      *   *Logic:* My single vote doesn't change the election, but my *decision rule* ("people like me vote") does. If I abstain, I weaken the habit of democracy for everyone.
      *   *Trigger:* Concern for the long-term health of the system.

  6.  **The Evidential Thinker (The Statistician):**
      *   *Logic:* My vote is evidence. If I vote, it is statistically likely that others like me vote. I am not causing them to vote, but I am "diagnosing" a winning coalition.
      *   *Trigger:* Correlation without causation.

  ***

  ### Part 2: The Diagnostic Quiz
  **"Why Do You Vote (Or Not Vote)?"**

  *Instructions: Read each scenario and choose the answer that best matches your gut reaction. Do not overthink it. There are no right or wrong answers.*

  **1. The Landslide**
  It is election day. Every poll says Candidate A will win by 20 points. The race is not close. You are tired, it is raining, and the line at the polling place is long.
  *   **A.** I go anyway. If I stay home, I've failed at something important, regardless of who wins.
  *   **B.** I go anyway. Even a 1 in 10 million chance of affecting the outcome is worth it when the country's future is on the line.
  *   **C.** I stay home. My time is worth more than a mathematical zero.

  **2. The Homeowners' Association (HOA)**
  Your HOA has 11 members. You are voting on a new fence rule. Your vote has a real chance of tying or breaking the result.
  *   **A.** I definitely vote. This is exactly when voting makes sense.
  *   **B.** I vote, for the same reason I vote in national elections.
  *   **C.** I vote, but mostly because my neighbors will see if I don't.

  **3. The Coin Flip**
  Imagine an election ends in a perfect tie. The law says ties are broken by a coin flip. You cast the vote that created the tie.
  *   **A.** My vote mattered immensely. I forced a 50/50 chance instead of a loss.
  *   **B.** My vote didn't really matter. I didn't decide the winner; the coin did.
  *   **C.** It doesn't matter if it mattered. I did my part.

  **4. The Secret Ballot**
  Suppose you had a magic guarantee: If you stayed home, no one would ever know. No records, no social shame, no guilt. You would be completely anonymous.
  *   **A.** I would still vote. I need to be able to live with myself.
  *   **B.** I would stay home. Without social pressure or impact, there's no reason to go.
  *   **C.** I would still vote. It's about who I am, not who is watching.

  **5. The Statistician**
  A super-computer tells you: "People with your exact background and psychology vote 99% alike. If you decide to vote, it is nearly certain that one million others like you will also vote. If you stay home, they will too." (Your vote does not *cause* theirs; you are just all wired the same way).
  *   **A.** That's superstition. My arm moving doesn't move their arms. I decide based on my own impact.
  *   **B.** That's a reason to vote. I want to be on the side of the million, not the one.
  *   **C.** That's interesting, but I vote because it's my duty, not because of the numbers.

  **6. The Third Party**
  You love a candidate who has 0% chance of winning. Voting for them might help the candidate you hate win by splitting the vote.
  *   **A.** I vote for my favorite anyway. It's about expressing my true views, not picking the winner.
  *   **B.** I vote for the "lesser evil" to prevent the worst outcome.
  *   **C.** I don't vote. Both options are unacceptable.

  **7. The Magic Wand**
  Suppose a genie offers you a deal: "I will ensure your preferred candidate wins, but you are not allowed to vote. You must stay home."
  *   **A.** I take the deal. The goal is the winner, not the voting.
  *   **B.** I refuse. The act of voting is part of the value.
  *   **C.** I take the deal, but I'd feel guilty about it.

  **8. The Collapse**
  Your friend says, "If everyone reasoned that their single vote doesn't matter, democracy would collapse."
  *   **A.** That's true, so I vote to keep the system going, even if my vote doesn't change this election.
  *   **B.** That's not my problem. I have to act based on what *I* can do, not what everyone else does.
  *   **C.** That's why I vote. I'm doing my share of the work.

  **9. The Cost**
  How much inconvenience would it take to stop you from voting in a national election?
  *   **A.** If I had to wait more than an hour, I'd skip it. It's not worth the time.
  *   **B.** I would vote even if I had to drive 50 miles. It's that important.
  *   **C.** I would vote unless it was physically impossible. It's an obligation.

  **10. The Aftermath**
  Your candidate loses by a million votes. How do you feel about your ballot?
  *   **A.** Wasted. I spent time for no result.
  *   **B.** Satisfied. I stood up for what I believe in.
  *   **C.** Neutral. I did my job; the outcome is out of my hands.

  ***

  ### Part 3: Scoring Key

  Count which letter you selected most often. If you have a mix, read the descriptions to see which narrative fits your reasoning.

  **Mostly A: The Rational Abstainer (Pure Instrumentalist)**
  *   **Position:** Voting in large elections is irrational.
  *   **Logic:** You view voting strictly as a tool to cause an outcome. If the tool is broken (probability is zero), you don't use it. You likely only vote in small elections (HOA) where the math works.
  *   **Philosophical Label:** Causal Decision Theory / Rational Choice.

  **Mostly B: The High-Stakes Calculator (Expected Utility)**
  *   **Position:** The tiny probability is outweighed by the enormous stakes.
  *   **Logic:** You agree the odds are low, but you believe the benefit of a good government is so huge (billions of dollars, lives saved) that even 1 in 10 million is a good bet. You would take the Magic Wand (Q7) because the *outcome* is what counts.
  *   **Philosophical Label:** Act Utilitarianism / Expected Utility Maximization.

  **Mostly C: The Duty-Bound Citizen (Deontologist)**
  *   **Position:** Voting is a moral obligation.
  *   **Logic:** You vote because it is the *right thing to do*, similar to paying taxes or not stealing. The outcome is secondary. You would refuse the Magic Wand (Q7) because skipping the vote violates the rule, even if the result is the same.
  *   **Philosophical Label:** Deontology / Civic Republicanism.

  **Mixed B & C (Specifically Q1, Q7, Q10): The Norm Sustainer**
  *   **Position:** My vote's job is to sustain the general norm of turnout.
  *   **Logic:** You vote not to change *this* election, but to maintain the *habit* of democracy. You are worried about the "Collapse" (Q8). Unlike the Duty voter, you care about consequences, but you care about the long-term consequence of the *system*, not the short-term consequence of the *winner*.
  *   **Philosophical Label:** Rule Utilitarianism.

  **Mostly "Expressive" Answers (Q4 Option C, Q6 Option A, Q10 Option B): The Expressive Voter**
  *   **Position:** Voting is worth it for what it expresses rather than what it causes.
  *   **Logic:** You vote to affirm your identity. You are the fan at the football game. You don't expect to change the score, but you refuse to cheer for the other team.
  *   **Philosophical Label:** Expressive Voting Theory.

  **Specific Pattern (Q5 Option B): The Evidential Thinker**
  *   **Position:** My vote is evidence of a coalition.
  *   **Logic:** You selected B on the Statistician case. You believe your choice is correlated with others, and that correlation gives your vote weight, even without causation.
  *   **Philosophical Label:** Evidential Decision Theory.

  **Unnamed Combinations (Incoherent or Unexplored)**
  *   **The "Magic Hypocrite" (Q1=C, Q7=A, Q8=B):** You say voting is useless and you'd take the win without voting, but you still vote in landslides.
      *   *Why unnamed:* This is logically incoherent. You claim to be an Instrumentalist (outcomes only) but act like a Duty voter. This usually indicates social pressure masquerading as logic.
  *   **The "Lone Savior" (Q1=B, Q8=B):** You believe your single vote changes the election (High Stakes) but also believe it doesn't matter if everyone else abstains.
      *   *Why unnamed:* This is mathematically unattractive. If your vote matters because of the stakes, then everyone else's vote matters too. Denying the collective impact while claiming individual impact is inconsistent.

  ***

  ### Part 4: Evaluation of Your Six Cases

  You asked me to tell you which of your cases were genuinely diagnostic and which I had to adjust. Here is the honest assessment from a decision theorist's perspective.

  **1. The Coin-Flip Case (Diagnostic: High)**
  *   **Verdict:** Keep.
  *   **Why:** This cleanly separates **Causal** thinkers from **Process** thinkers. A pure instrumentalist says, "I didn't win, the coin did." A duty/process voter says, "I forced the fair procedure." It tests whether you value *control* or *participation*.

  **2. The Statistician Case (Diagnostic: High, but Fragile)**
  *   **Verdict:** Keep, but it is the hardest for laypeople to grasp.
  *   **Why:** This is the only way to separate **Causal Decision Theory** (my arm moves my lever) from **Evidential Decision Theory** (my decision predicts others). However, many people conflate this with the "Norm Sustainer" view. I phrased it carefully to emphasize *correlation without causation* to ensure it splits the two.

  **3. The Landslide Case (Diagnostic: Medium)**
  *   **Verdict:** Modified slightly.
  *   **Why:** This is the classic test for Instrumentalism vs. Everything Else. However, I had to ensure the "High-Stakes" voter didn't get lumped in with the "Duty" voter. Both vote in landslides, but for different reasons (Math vs. Morals). The "Magic Wand" question (Q7) is needed to split them.

  **4. The Small-Association Case (Diagnostic: High)**
  *   **Verdict:** Keep.
  *   **Why:** This is the control group. If someone says "Voting is irrational" but votes in the HOA, they are a consistent Instrumentalist. If they say "Voting is irrational" and *don't* vote in the HOA, they are consistent Abstainers. If they vote in both for the *same reason*, they are not Instrumentalists.

  **5. The Third-Party Case (Diagnostic: Low)**
  *   **Verdict:** Dropped/Merged into Q6.
  *   **Why:** I found this overlaps too much with the Expressive Voter profile. It doesn't distinguish well between "Duty" and "Expression." Both might vote third party. I folded this into the "Expressive" scoring logic rather than making it a standalone pivot point, as it confuses *who* you vote for with *why* you vote.

  **6. The Secret-Ballot Case (Diagnostic: Medium)**
  *   **Verdict:** Keep.
  *   **Why:** This tests for **Social Reputation** vs. **Internal Integrity**. However, be warned: many people *think* they would vote in secret, but in reality, they wouldn't. It diagnoses what people *believe* motivates them, which is philosophically useful, even if empirically shaky.

  **Final Note:**
  You mentioned your friends all say "of course you should vote" but mean different things. This quiz confirms that suspicion. The "High-Stakes Calculator" and the "Duty-Bound Citizen" will vote in the exact same elections, but they are having completely different conversations. One is betting on a lottery ticket with a huge jackpot; the other is paying a membership fee. Knowing which one you are will stop you from arguing past your friends.
