  ### The Residue

  Hume's point is **not** just the No-Free-Lunch (NFL) theorem in a powdered wig, though NFL is the mathematical crystallization of his skepticism. There is a residue, and it is **normative**.

  **1. The Instrumental vs. The Normative**
  Learning theory is fundamentally instrumental. It answers: *"Given bias $B$, what performance can I guarantee?"* or *"To get performance $P$, what bias $B$ do I need?"*
  Hume is asking a deontological question about belief: *"Am I **entitled** to hold bias $B$?"*

  When you invoke NFL, you are saying, "Without bias, you lose." Hume agrees. But when you pick a bias (e.g., "smoothness"), SLT says, "Great, now you have a bound." Hume asks, "Why smoothness? Why not 'grue'-smoothness?"
  SLT answers: "Because smoothness has lower VC dimension."
  Hume replies: "Why should the universe care about your VC dimension?"
  SLT has no answer here, because SLT defines "success" as minimizing loss *assuming* the bias matches the world. It cannot step outside the system to justify the system without circularity (using data to justify the bias used to interpret the data).

  **2. The Vocabulary Gap**
  This is **mixed** fault.
  *   **Vocabulary's Fault:** Your vocabulary is designed for *engineering*, not *epistemology*. It optimizes for $P(\text{success} | \text{bias})$, not $P(\text{bias} | \text{truth})$. The concept of "rational entitlement" doesn't exist in loss landscapes. You can have a model that is "irrational" (biased incorrectly) but generalizes well due to distributional luck, and SLT calls that a win. Hume calls that a problem.
  *   **Philosophy's Clarity:** Hume's claim is clear, but it demands a type of justification (foundationalist) that is arguably impossible. If you accept that "rational entitlement" just means "high probability of minimizing loss," then Hume collapses into NFL. But if "entitlement" means something stronger (access to truth independent of utility), then SLT cannot express it by design.

  **Verdict:** The residue is real. Learning theory dissolves the *mystery* of induction (showing it requires bias) but sidesteps the *anxiety* of induction (that the bias is unjustified). You can map Hume's *mechanics* to SLT perfectly, but you cannot map his *demand for warrant*. SLT tells you how to bet; Hume asks why you're allowed to sit at the table.
