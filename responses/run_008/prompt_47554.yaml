prompt: |-
  For my philosophy elective we're doing a unit on Gödel, Escher, Bach (we've mostly gotten through the MIU-system chapter and some of the Achilles and Tortoise dialogues, which are honestly the only assiged reading I've finished all semester lol). The part that actually stuck with me is the MU-puzzle: you start with MI and you've got these typographical rules where you can add U to strings ending in I, double everything after the M, turn any III into a U, or delete any UU — and the whole drama is that you can crank the rules literally forever and never get MU, and the only way to *know* that is to jump outside the system and notice that the number of I's can never become a multiple of 3. Hofstadter calls the move of stepping outside jumping out of the system, or JOOTSing, and contrasts it with the mechanical mode where you just apply rules blindly forever.

  Our assignment is to "respond creatively" to the concept and I have an idea I can't fully pull off on my own. I want a parody of one of those slick management-consulting brochures — the glossy McKinsey-style thing with taglines, package tiers, stock-photo captions, and a testimonial section — for a consultancy that sells JOOTSing workshops to formal systems. Like the MIU system itself is their flagship client, signed up for the premium "Escape Your Ruleset" package, and there's an FAQ where someone asks whether the program helps you derive MU and the consultants answer that with the Level 2 package you'll derive MU in ways that transcend the very notion of derivation. Include fine print that quietly admits every escape module operates strictly within the system being escaped from, plus maybe an upsell for an "Escape from the Escape module" that is somehow just more modules.

  To be clear, the real target of the satire should be the corporate self-help "think outside the box" industry, NOT the book itself — the joke is that consultants promise transcendence but deliver exactly what they always deliver, more rules, workshops, and a five-step JOOTSing methodology, which is precisely the thing about formal systems that they can only do what their rules let them. Keep it deadpan throughout, around 600 words, and make sure the GEB content is actually right (the four MIU rules, why MU genuinely can't be derived, the mechanical vs. intelligent mode distinction) so that someone who's read the book would nod along instead of wincing.

  After the piece, please give me a JSON object summarizing it, with these fields: "client" (which formal system the main testimonial in the brochure is from), "packages_offered" (an array of objects, each with "name", "price", and "what_it_actually_delivers"), "fine_print" (the single clause where the brochure accidentally gives away the whole joke), and "tagline" (the consultancy's one-sentence pitch, stated exactly as the brochure would state it).
