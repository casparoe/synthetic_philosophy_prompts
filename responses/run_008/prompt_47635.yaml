answer: |-
  Here is a draft package tailored to your specifications. I've tried to keep the question tight enough for a 90-minute window while ensuring the "autopilot" answer will hit a ceiling.

  ### 1. Exam Question

  **Question 4: The Geometry of Moral Progress (90 Minutes)**

  The "Expanding Circle" metaphor suggests moral progress consists primarily of extending the *scope* of moral concern from the self/kin to the universal (e.g., all humans, all sentient beings). However, critics argue this metaphor smuggles in a binary (in/out) conception of moral status, obscuring alternative models such as *weighting functions* (where status is a matter of degree) or shifting *criteria* for membership (e.g., from rationality to sentience).

  Furthermore, if the Circle implies that ideal moral progress results in equal moral weight for all members within the boundary, it faces a "reductio of impartiality" (e.g., being unable to prioritize a child's significant pain over a stranger's minor inconvenience).

  **Essay Task:**
  Critically evaluate the "Expanding Circle" model. Does the binary scope-expansion picture accurately describe moral progress, or should it be replaced by a weighting model? In your answer, you must:
  1.  Distinguish between *scope expansion* and *weight adjustment*, and explain why this distinction matters for interpreting historical change.
  2.  Address the "endpoint problem": Can the Circle model accommodate special obligations (partiality), or does its geometric structure necessitate an implausible impartialism?
  3.  Conclude whether the model should be discarded, or if it can be "patched" (e.g., via decaying weights or a two-layer system) to remain useful.

  *Note: No outside reading is required or permitted. Rely on seminar discussions and the prompt's framework.*

  ***

  ### 2. Model Answer (Approx. 600 words)

  The "Expanding Circle" is a potent heuristic for moral progress, but as a structural model, it is fundamentally flawed. It conflates the *boundary* of moral consideration with the *weight* of that consideration, and it fails to account for the necessity of partiality. While the metaphor captures the historical trend of inclusion, it should be discarded in favor of a weighting function model, or at minimum, radically patched to separate scope from obligation.

  The primary failure of the Circle is its binary geometry. The metaphor implies that moral progress is moving entities from outside the circle (moral nullity) to inside (moral equality). However, historical moral psychology rarely operates binarily. In 1800, animals or foreign peoples were not necessarily treated as having *zero* moral weight; they were often assigned negligible weight (0.001) compared to kin (1.0). Describing this as "exclusion" misdiagnoses the moral error. If we model status as a weighting function, progress looks less like opening a gate and more like recalibrating a scale. This distinction matters because it changes the prescription for progress. If the problem is scope, the solution is inclusion. If the problem is weight, the solution is re-prioritization. A weighting model better explains why we can acknowledge an entity has *some* rights (is "in") while still debating the severity of violations against them.

  Secondly, the Circle model obscures shifts in the *criteria* for membership. The radius of the circle expands, but what determines the radius? If the criterion is "rational agency," the circle cannot expand to include non-human animals without breaking the definition. If the criterion shifts to "sentience," the circle expands, but this is not progress *within* a single framework; it is a replacement of the framework itself. The Circle metaphor hides this conceptual rupture, making distinct moral revolutions look like a single continuous trajectory.

  Finally, and most destructively, the Circle implies an endpoint of equal weight. If the goal is a circle where all members are equidistant from the center, the ideal observer must treat a child's severe injury and a stranger's minor inconvenience with equal concern. This is the "reductio of impartiality." Most moral agents intuitively reject this; we believe special obligations are constitutive of morality, not obstacles to it. The geometric structure of the Circle (equidistance) cannot easily accommodate this without ceasing to be a Circle.

  Can the model be patched? Proponents might suggest "decaying weights" based on social distance, or a two-layer system where basic rights are universal (the Circle) but special obligations exist in a separate sphere. However, decaying weights essentially abandon the Circle for a gradient field. A two-layer system admits that the Circle only tracks *minimal* status, not *full* moral life.

  Therefore, the Expanding Circle should be discarded as a primary theoretical model. It is useful pedagogy for introducing inclusivity, but it structurally misrepresents moral status as binary and moral progress as impartialization. A weighting function model avoids the binary trap, and a partiality-permitting framework avoids the impartiality reductio. We should retain the insight that moral concern should broaden, but reject the geometry that demands everyone end up standing at the same distance from the center. Moral progress is not about making everyone equidistant; it is about ensuring no one is at zero, while acknowledging that some relationships rightly carry more weight.

  ***

  ### 3. Marking Scheme (Out of 20)

  **Grade Bands:**
  *   **A (17–20):** Structural critique, distinguishes scope/weight, resolves partiality problem.
  *   **B (13–16):** Accurate historical summary, identifies problems but treats them superficially.
  *   **C (9–12):** Descriptive only, misses the prompt's specific constraints.
  *   **D/F (0–8):** Fundamental misunderstandings or incomplete.

  **Specific Criteria & "Look-Fors"**

  **1. Scope vs. Weight Distinction (6 Points)**
  *   **A (5-6 pts):** Explicitly argues that "in/out" (binary) differs from "how much" (weight). Explains *why* this matters (e.g., historical actors didn't see outsiders as having *zero* value, just low value). Uses this to critique the Circle's geometry.
  *   **B (3-4 pts):** Mentions scope and weight but treats them as synonyms. Says "we care about more people now" without analyzing the *degree* of care.
  *   **C (0-2 pts):** Ignores the distinction; treats the Circle as purely historical inclusion.

  **2. The Endpoint/Partiality Problem (6 Points)**
  *   **A (5-6 pts):** Connects the geometric structure (equidistance) to the problem of impartiality. Argues that the Circle *structurally* necessitates equal weight, which conflicts with special obligations (kid vs. stranger). Does not just say "impartiality is hard," but that the *model* demands it.
  *   **B (3-4 pts):** Identifies that impartiality is counterintuitive ("we love our kids more") but treats it as a psychological limitation rather than a structural flaw in the Circle metaphor.
  *   **C (0-2 pts):** Ignores the partiality problem or claims the Circle solves it.

  **3. Resolution (Patch vs. Discard) (4 Points)**
  *   **A (4 pts):** Takes a clear stance. If "patch," explains the mechanism (decaying weights, two-layers) and its cost. If "discard," offers the alternative (weighting function).
  *   **B (2-3 pts):** Sits on the fence ("it has pros and cons") without committing to a structural verdict.
  *   **C (0-1 pts):** No conclusion.

  **4. Clarity & Constraints (4 Points)**
  *   **A (4 pts):** Within word limit (approx.), no outside reading cited, clear thesis.
  *   **B (3 pts):** Slightly over/under limit, minor clarity issues.
  *   **C (0-2 pts):** Disorganized or violates constraints.

  **Specific Penalties (The "Fried Grader" Shortcuts)**
  *   **-3 Points:** **The History Trap.** If the essay is primarily a timeline (Greeks -> Christians -> Enlightenment -> Singer) without analyzing the *metaphor*, cap at 14 (High B).
  *   **-3 Points:** **The Intuition Trap.** If the student critiques impartiality solely on the grounds that "it feels wrong" without linking it to the *geometry of the circle* (equidistance/radius), cap at 15.
  *   **-5 Points:** **The Binary Blindspot.** If the student fails to distinguish between being "outside the circle" and "having low weight," cap at 13 (Low B).

  **Notes for Grading:**
  *   An **A** answer doesn't need to get the "right" answer on whether to patch or discard, but it must recognize that the *geometry* is the source of the problem.
  *   A **B** answer will likely agree with the prompt's premises but fail to deploy them rigorously, falling back on the standard "Singerian" narrative you wanted to avoid.
