answer: |-
  You need a four-step filtration test based on consent, mission integrity, normative corruption, and equality, followed by a majority vote for cases that pass all filters.

  ### The Decision Procedure (20-Minute Protocol)

  This procedure draws on Michael Sandel's work on the moral limits of markets (corruption of norms), Alvin Roth's work on repugnant transactions (consent vs. social taboo), and Elizabeth Anderson's theory of value (modes of valuation). It is designed to move from factual thresholds to value judgments.

  **Step 1: The Desperation Check (Consent & Power)**
  *   **Question:** Is there a power imbalance or level of desperation such that consent is coerced by circumstance rather than free choice?
  *   **Criteria:** Look for situations where one party *must* agree to survive or succeed, and the other party holds a monopoly on that necessity.
  *   **Stop Condition:** If yes, **Reject.** (e.g., A student selling blood to eat; a professor selling grades to avoid expulsion).
  *   **Pass:** If both parties have reasonable alternatives and basic welfare is not at stake, move to Step 2.

  **Step 2: The Mission Check (Essentiality)**
  *   **Question:** Is the good or service being traded central to the institution's core non-commercial purpose?
  *   **Criteria:** Distinguish between auxiliary services (food, merchandise, housing) and core mission goods (education, grades, access to classes, research integrity).
  *   **Stop Condition:** If the good is core to the mission, **Reject.** Markets treat goods as interchangeable; mission goods are often unique and merit-based.
  *   **Pass:** If the good is auxiliary or peripheral, move to Step 3.

  **Step 3: The Corruption Check (Normative Crowding-Out)**
  *   **Question:** Will putting a price on this change the meaning of the practice for people who *do not* participate?
  *   **Criteria:** Ask if the market incentive displaces a moral or civic incentive. (e.g., Does paying kids to read make them read less for love? Does paying for class seats make learning seem like a purchase rather than an achievement?)
  *   **Stop Condition:** If pricing degrades the value of the good for the whole community, **Reject.**
  *   **Pass:** If the market is contained and doesn't alter the social meaning of the practice, move to Step 4.

  **Step 4: The Equality Check (Status Hierarchies)**
  *   **Question:** Does this transaction create a wealth-based caste system within the community that undermines equal status?
  *   **Criteria:** Compare the market inequality to the non-market alternative (e.g., queueing). Queueing favors those with time (often wealthier or less working-class); markets favor those with money.
  *   **Stop Condition:** If the market creates a visible, permanent hierarchy of citizenship (e.g., VIP students vs. regular students), **Reject.**
  *   **Pass:** If the inequality is transient or comparable to the alternative, **Move to Vote.**

  **Final Step: The Vote**
  *   If a proposal passes all four filters, the remaining objection is purely preferential. The committee votes majority rule.

  ---

  ### Application to Proposals

  **1. Exam-Week Burritos (Dynamic Pricing)**
  *   **Desperation Check:** **Pass.** Students are hungry, but not desperate enough to compromise consent; alternatives exist (meal plans, cooking).
  *   **Mission Check:** **Pass.** Food service is auxiliary to the educational mission.
  *   **Corruption Check:** **Pass.** A burrito is a commodity; pricing it dynamically does not change the meaning of education or dining for non-buyers.
  *   **Equality Check:** **Pass/Fail Borderline.** Surge pricing hurts low-income students, but queueing hurts students who work jobs during peak hours. The inequality is transient (one meal) and comparable to the alternative.
  *   **Outcome:** **Move to Vote.** The committee must decide if the efficiency gain outweighs the annoyance of price volatility. This is a policy preference, not a moral violation.

  **2. Paid Line-Standing (Proxy Queuing for Registration)**
  *   **Desperation Check:** **Pass.** Students hire peers voluntarily; no dire coercion.
  *   **Mission Check:** **Fail.** Course registration is the gateway to the core mission (education). While the *line* is administrative, access to the *seat* is academic.
  *   **Corruption Check:** **Fail.** It changes registration from a "first-come, first-served" civic queue (where everyone waits equally) to a market transaction. It signals that time is less valuable than money, altering the norm of equal access.
  *   **Equality Check:** **Fail.** It creates a visible hierarchy where wealthy students bypass constraints that bind others, undermining the status of students who must wait.
  *   **Outcome:** **Reject.** Even if consensual, it commodifies access to the core mission and corrupts the norm of equal opportunity.

  **3. Waitlist Bumping (Paying to Skip the Queue)**
  *   **Desperation Check:** **Pass.** Students consent; no physical coercion.
  *   **Mission Check:** **Fail.** Access to oversubscribed courses is a core educational good. Selling access treats education as a private commodity rather than a merit-based right.
  *   **Corruption Check:** **Fail.** This is the strongest failure point. If students can buy seats, the value of the course credential diminishes for everyone. It signals that graduation is a purchase, not an achievement. As Sandel argues, this crowds out the norm of academic merit.
  *   **Equality Check:** **Fail.** It institutionalizes a two-tier system: those who pay get the degree path; those who don't wait. This undermines the equal status of students within the academic community.
  *   **Outcome:** **Reject.** I know you support this, but grounded in the philosophy of commodification you requested, this fails the Mission and Corruption checks. It turns the college from a community of scholars into a vendor of credentials. The fact that the alternative (queueing) favors students with free time is a problem, but solving it with a pay-to-bump system corrupts the meaning of the course itself.

  ---

  ### Limitations and Risks

  This procedure cannot eliminate subjectivity; it only structures it. Here is where it will launder your prejudices into official-sounding steps:

  1.  **Defining "Mission":** Step 2 relies entirely on how you define the college's core purpose. If the committee views the college as a business, almost nothing fails this check. If you view it as a public trust, almost everything does. The procedure forces you to declare this, but it doesn't solve the disagreement.
  2.  **Intuition as Data:** Step 3 (Corruption) asks you to predict social meaning. This is often just a placeholder for "this feels weird to me." You may find yourself claiming norms are corrupted simply because you dislike the change, not because there is evidence of crowding-out.
  3.  **Status Quo Bias:** Step 4 compares the market to the alternative (like queueing), but it often defaults to protecting existing hierarchies. You might reject a market because it creates *new* inequalities while ignoring that the queue creates *old* ones that favor a different privileged group (those with leisure time).
  4.  **The "Vote" Loophole:** If a proposal passes all filters, it goes to a vote. A committee determined to allow something controversial can simply argue their way through Steps 1–4 by narrowing definitions (e.g., "Waitlist bumping isn't core mission, it's administrative"), rendering the filters useless.

  The procedure forces you to articulate *why* something feels off, but it cannot prove that your feeling is correct. It converts moral intuition into administrative language, which makes the decision defensible, but not necessarily true.
