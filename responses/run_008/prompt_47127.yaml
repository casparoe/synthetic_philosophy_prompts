      *Best Fix:* Make it a **Vow System**. The utterance *itself* binds them. "I declare myself destitute" *makes* them destitute in the eyes of the law *because* that is what the words mean.
      If "Destitute" means "Rich," then declaring "Destitute" declares "Rich," binding them to Rich taxes.
      This locks the consequence to the *meaning*, not the sound.
