answer: |-
  The pen hovered over the signature line. The paper was thick, matte, absorbing the sterile light of the prep room. Elena didn't look up. Marcus stood by the door, arms crossed, blocking the exit only in the symbolic sense.

  "It's not the safety profile I'm worried about," Marcus said. "You know the shielding is solid. It's the lock-in."

  "It's not lock-in, Marcus. It's optimization." Elena tapped the pen against the clipboard. "We spent ten years studying reinforcement learning. We know what reward is. It's a scalar signal. A proxy evolution used to keep us breeding and foraging. Why respect the proxy when you can access the signal?"

  "Because the proxy is the life!" Marcus pushed off the doorframe. "The signal is supposed to be contingent. You solve the problem, you get the ping. You eat, you get the ping. If you decouple the ping from the cause, you're not optimizing life. You're simulating it."

  "Simulating? Or just cutting out the middleman?" She finally looked at him. Her eyes were clear, tired but steady. "We chase jobs, lovers, hobbies because they trip the wire. I'm just tripping the wire directly. It's honest. Everything else is just elaborate foreplay for a chemical release."

  "It's not honest if it deletes the capacity to care about the honesty." Marcus stepped closer, lowering his voice. "You're making a binding contract with a future self that won't have the machinery to void it. The Elena who signs this wants peace. The Elena who wakes up... she won't want anything. She'll just *be*."

  "She'll be satisfied. Isn't that the goal? You think I haven't modeled this? I'm the principal and the agent. There's no alignment problem here because I'm aligning the agent to my current values."

  "Your current values!" Marcus laughed, a sharp, brittle sound. "You're using your pre-op hardware to decide that post-op hardware doesn't need to function. That's like a hand deciding the brain is obsolete. Once you're parked, you can't decide to leave the parking lot. The steering wheel disconnects."

  "Maybe I don't want to drive anymore."

  "That's the depression talking."

  "Don't," Elena warned, the pen stilling completely.

  "It is. You're tired. The work, the grant rejections, the noise. You want the noise to stop. But static isn't peace, El."

  "Is this where you tell me about struggle? About how suffering builds character?" She gestured to his pocket. "You're taking Lexapro. Since when?"

  Marcus flinched. He touched his jacket pocket instinctively. "That's different. That's restorative. It brings the baseline back to normal."

  "Normal is a statistical average, not a biological truth. Your serotonin reuptake inhibition is a chemical intervention designed to alter your mood state away from distress toward stability. How is that philosophically distinct from a device that stabilizes the reward pathway?"

  "Because I still feel sad!" Marcus snapped. "I still feel anxiety. The meds keep me from drowning, they don't carry me to the shore. I still have to swim. This thing..." He pointed at the clipboard. "That's being carried. That's never drowning because you've removed the water. You've removed the swimming. You're talking about a flat line of contentment."

  "Low-grade, stable satisfaction," she corrected. "Not euphoria. Just... enough. Always enough."

  "Forever," Marcus said. "Think about the contrast. You need the dip to feel the peak. If you flatten the curve, you don't get peace. You get nothing."

  "I get freedom from the craving," Elena said softly. "You say I'm deleting the self. I say I'm deleting the parasite. The part that always needs *more* to feel okay. Why is that version of me the sacred one?"

  "Because it's the only one that can ask the question!" Marcus rubbed his face. "Look, I know the meds look like a compromise. They are. They're messy. But they leave the door open. I can stop taking them. I can choose to suffer. Can you choose to suffer after Tuesday?"

  Elena looked down at the form. The signature line waited. "Why would I choose to suffer?"

  "To know you're real!"

  "Is reality defined by friction?" She lifted the pen. "If I feel safe, and warm, and satisfied... what does it matter if the source is endogenous or engineered? The qualia are the same."

  "The qualia aren't the same if the context is a lie."

  "Who's lying to whom? I'm designing the experience. I'm the truth-teller."

  "You're the designer until the switch is flipped. Then you're just the output." Marcus moved to the table, resting a hand near hers, not touching. "Just wait. Don't sign today. Come home. We'll talk to someone else. Not the engineers. Someone who isn't selling the solution."

  "The engineers wrote the paper, Marcus. They know the risks better than anyone. They call it 'parking' because that's what it is. A place to rest."

  "A garage is for cars," he said. "Not people."

  "Maybe people are just cars that think they're drivers."

  The intercom buzzed, harsh and sudden in the quiet room. *'Dr. Vance? We're ready for you in OR One.'*

  Elena looked at the pen. She looked at Marcus. He looked back, his hand still hovering near hers, shaking slightly. The silence stretched, heavy with the weight of the unsignable contract.

  "Well," Elena said.
