  I've been rereading Gödel, Escher, Bach and I'm pretty much sold on the strange-loop picture of the self: consciousness is what you get when a system builds a symbolic model of itself and that model gets causally caught up in what it describes, like Escher's drawing hands but made of neurons, and the I is the tangle rather than some little observer inside the brain. Hofstadter also insists there's always an inviolate level underneath (for us, the neurons, which know nothing about the levels above them) and that the tangling only exists from the inside -- from outside it's just flat physical causation, which is why the self is real-ish without being soul-ish.

  What would count against this? I don't want the standard zombies stuff. I want things like: cases where you have self-reference but no self shows up, systems that seem to be conscious selves with little or no self-modeling, results from neuroscience, animal cognition, or AI that strain the story, and internal problems -- e.g. whether the loop story actually explains anything or just redescribes self-reference in brainy vocabulary and calls it a theory of consciousness. Also, a friend keeps telling me a strightforward feed-forward predictive-processing account gives you everything the strange loop gives you minus the poetry -- what would have to be true for that to be right? Rank the defeaters from fatal to merely awkward, say which ones committed Hofstadter-types would actually concede as damage versus brush off as missing the point, and tell me straight whether the view has been qualified into something that can't lose.

  Please structure the answer as: "What the view commits you to" (~4 sentences), "Fatal defeaters", "Serious but survivable", "Merely awkward", "What defenders would concede", and "Is it insulated?" (keep that last one to about 3 sentences).
