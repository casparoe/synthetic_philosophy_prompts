      *(Self-Correction during drafting)*: I need to be careful about the "Maximin" suggestion in the prompt. LTNU is usually *aggregate* negative utilitarianism above the threshold, not necessarily maximin. However, the prompt asks me to explore the reconstruction "something like a maximin... on the suffering-above-threshold term." I should address both: Aggregate Severe Suffering (standard LTNU) vs. Worst-Case Severe Suffering (Leximin NU). I will focus on the Aggregate version as primary but note the Leximin variant as it strengthens the lexical claim.
      *Actually, re-reading the prompt:* "something like a maximin (or leximin) on the suffering-above-threshold term with an ordinary additive term for everything else." I should evaluate *that* specific reconstruction.
      *Okay, Plan:* Define the SWF as $W(x) = (S_{lex}(x), U_{std}(x))$.
