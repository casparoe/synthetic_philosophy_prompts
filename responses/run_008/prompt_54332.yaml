answer: |-
  Here is a draft of the quiz and the accompanying scoring guide. I've designed the questions to be punchy and scenario-driven, avoiding philosophical jargon entirely. The scoring key is structured to help you interpret the data for your piece, including the specific limitations and "incoherent" combinations you requested.

  ***

  # QUIZ: What Do You Actually Think Makes a "Yes" Count?

  We say "consent" everywhere—from surgery to software, from the bedroom to the boardroom. But we don't all mean the same thing. When does a signature become a surrender? When does a "yes" mean "no"?

  Read the ten scenarios below. Don't pick the answer you think the law would choose, or what your boss would want. Pick the one that matches your gut.

  **1. The Surgery Form**
  A patient signs a standard consent form for a minor procedure without reading it. The surgeon knows this patient is a pianist but never mentions a 1% risk of nerve damage that could affect fine motor skills. The surgery goes fine, but the patient later sues, saying, "I didn't really consent to *that* risk."
  *   **A.** The signature counts. You can't sign a paper and then pretend you didn't read it.
  *   **B.** The consent is invalid. A yes isn't real if you're kept in the dark about what matters most to you.
  *   **C.** The consent is invalid. Even if they knew the risk, they clearly didn't understand what they were agreeing to.

  **2. The Cookie Banner**
  You visit a news site. A banner pops up. The big green button says "Accept All." To reject tracking, you have to click "Settings," then "Partners," then "Opt Out." You click the green button just to make it go away.
  *   **A.** You consented. You clicked the button. That's an action.
  *   **B.** You didn't consent. The design was rigged to manipulate your choice.
  *   **C.** You tacitly consented. By staying on the site, you agreed to the default rules.

  **3. The Boss's Invitation**
  Your boss asks you out for drinks. They don't explicitly threaten your job, but you know they write your performance reviews. You say yes.
  *   **A.** This is invalid. The power gap is too wide; a real "no" wasn't safely available.
  *   **B.** This is valid. As long as they didn't explicitly say "or else," you have agency.
  *   **C.** This is invalid. You only said yes because you needed the paycheck, not because you wanted to go.

  **4. The ER Decision**
  Someone is brought to the ER screaming in agony. They beg for *any* procedure to stop the pain and sign a waiver they can't focus on. Later, they claim they were out of their mind.
  *   **A.** Valid. They asked for help and agreed to the treatment in the moment.
  *   **B.** Invalid. Severe pain compromises your capacity to judge risks, just like alcohol.
  *   **C.** Valid. A reasonable person in that situation would have done the same thing.

  **5. The Drunk Text**
  Two people have been drinking. One enthusiastically suggests going home together. They are coherent enough to walk and talk, but if they were sober, they would never sleep with this person.
  *   **A.** Valid. Consent is about what you want *now*, not what sober-you would want.
  *   **B.** Invalid. Alcohol clouds judgment; you can't waive rights when intoxicated.
  *   **C.** Invalid. If your "sober self" wouldn't agree, the "drunk yes" doesn't count.

  **6. The Hurricane Generator**
  After a storm, power is out for weeks. One seller has generators left. They sell them at 5x the normal price. Buyers line up and pay willingly.
  *   **A.** Valid. It was a voluntary exchange between adults.
  *   **B.** Invalid. When someone is desperate, the market isn't free; it's coercion by circumstance.
  *   **C.** Valid, but immoral. The consent is real, even if the price gouging is wrong.

  **7. The Risky Stunt**
  You dare a friend to jump off a dock. You say, "I promise I won't sue if you get hurt." They jump, break a leg, and now want to sue you for suggesting it.
  *   **A.** They can't sue. Your "yes" gave me permission to take the risk.
  *   **B.** They can sue. You can't give permission to be negligent, only waive the complaint afterward.
  *   **C.** They can sue. Being hurt means something went wrong, regardless of what was said.

  **8. The Lie**
  A partner lies about their income to convince you to move in together. You say yes to the lease. Later you find out the truth.
  *   **A.** The agreement stands. You still wanted to move in; the lie was just a detail.
  *   **B.** The agreement is void. If the facts change, the consent evaporates.
  *   **C.** The agreement is void. You didn't agree to *this* reality, only the one they described.

  **9. The Silent Policy**
  Your gym emails: "We are raising fees. Reply by Friday to cancel." You don't read the email. The fee is charged.
  *   **A.** You consented. Silence in the face of a warning counts as agreement.
  *   **B.** You didn't consent. Doing nothing isn't saying yes.
  *   **C.** You consented only if the price hike is reasonable for the market.

  **10. The Toxic Dump**
  A company pays a struggling town to sign a contract allowing toxic waste storage nearby. The town votes yes to get the money.
  *   **A.** Valid. A contract is a contract.
  *   **B.** Invalid. Some things (like health/safety) shouldn't be up for sale, no matter the vote.
  *   **C.** Invalid. The town was too poor to have a real choice; the background conditions were unfair.

  ***

  # SCORING KEY & INTERPRETATION GUIDE
  *(For the Editor/Journalist)*

  **How to Score:**
  There is no single point tally. Instead, look for **clusters** of answers. Most readers will not fit neatly into one box. The value of this quiz for your piece is to highlight where people are inconsistent or where distinct philosophical views converge on the same outcome.

  **The Answer Map:**
  Below is what each choice generally signals. Note that different questions test different "leaves" of the consent tree.

  *   **Mostly A's (The Performative/Tacit View):** You believe consent is an external act. A signature, a click, or a spoken "yes" changes the rules of the game, regardless of what was going on inside the person's head. You prioritize certainty and clear boundaries over psychological nuance.
  *   **Mostly B's (The Standard Liberal View):** You believe consent requires **Information + Capacity + Freedom**. If any of those three are missing (hidden risks, pain, coercion), the "yes" is broken. This is the dominant legal/ethical framework in medicine and law.
  *   **Mostly C's (The Internal/Skeptical View):** This is a split cluster.
      *   On *personal* questions (Surgery, Drunk, Lie), C indicates an **Internal-Attitude View**: The outward "yes" is just evidence; if the mental state isn't aligned, it doesn't count.
      *   On *structural* questions (Boss, Hurricane, Toxic Dump), C indicates a **Skeptical/Structural View**: Consent is a ritual that legitimizes power. If the background options are unfair (poverty, monopoly, hierarchy), the "yes" is invalid regardless of the moment.

  ### Specific Distinctions & Overlaps (For the Feature)

  **1. The "Permissibility vs. Complaint" Split (Question 7)**
  *   **The Split:** This question tests whether consent makes an act *okay* (Permissible) or just stops you from *complaining* (Waiver).
  *   **The Overlap:** Most readers won't distinguish these. If a reader chooses **7A**, they view consent as a magic wand that makes the act right. If they choose **7B**, they view consent as a shield against liability, not a moral cleanser.
  *   **Journalist Note:** If a reader validates the drunk sex (5A) but validates the lawsuit (7B), they hold an incoherent view: they think the "yes" binds the person socially but not legally. This is actually a very common common-sense position, even if philosophically messy.

  **2. The "Deception vs. Unwillingness" Split (Question 8)**
  *   **The Split:** Does the lie invalidate the consent because you were tricked (Deception), or because you wouldn't have done it if you knew (Counterfactual Unwillingness)?
  *   **The Overlap:** **8B** and **8C** often map to the same result (Void), but for different reasons. **8B** suggests some facts are so essential that lying about them voids *any* agreement. **8C** suggests it depends entirely on the individual's specific preferences.
  *   **Journalist Note:** This is a great place to quote the "incoherence." If someone says the cookie banner (2B) is invalid because of "manipulation" but the hurricane generator (6A) is valid despite "desperation," they are prioritizing *digital* manipulation over *economic* coercion. That's a cultural bias worth highlighting.

  **3. The "Incoherent" Combinations**
  *   **The Libertarian Inconsistency:** Validating the Toxic Dump (10A) but invalidating the Boss (3A). This suggests the reader thinks financial desperation is fine in a town vote but not in a workplace.
  *   **The Paternalist Inconsistency:** Invalidating the ER patient (4B) but invalidating the Drunk person (5B). This is consistent (Capacity matters). However, invalidating the ER patient (4B) but validating the Cookie Click (2A) is inconsistent. It suggests you trust a person in agony less than a person bored by a website.
  *   **The "Nobody Holds This" View:** If a reader chooses **1A** (Signature counts even without reading) but **9B** (Silence doesn't count). This is logically difficult: why does a signature bind you if you didn't read it, but silence doesn't bind you if you were warned? This view is rare; if you find it, it suggests the reader places magical weight on the *physical act* of signing vs. the *passive act* of ignoring.

  **4. Where the Quiz Can't Separate the Leaves**
  *   **Performative vs. Tacit:** Questions 2 and 9 try to separate these, but in practice, people who accept "Clickwrap" (2A) usually accept "Silence" (9A). The quiz cannot easily distinguish between "Consent is a speech act" and "Consent is a default setting." Both treat the internal state as irrelevant.
  *   **Internal vs. Standard Liberal:** Questions 1 and 5 try to separate these. The Standard Liberal view says "You need info." The Internal view says "You need alignment." Often, these yield the same verdict (Invalid). You will likely find readers cluster in "Invalid" without caring *why*.
  *   **Skeptical vs. Internal:** On the Boss question (3), the Skeptic says "Power imbalance invalidates." The Internalist says "Fear invalidates desire." The outcome is the same. The quiz cannot easily tell if the reader objects to the *structure* or the *psychology*.

  ### Suggested "Result Profiles" for the Site
  *Instead of a single score, give readers a "Consent Profile."*

  *   **The Contractarian (Mostly A):** "A handshake is a handshake." You value clarity and finality. You worry that if we dig too deep into people's heads, no agreement is ever safe.
  *   **The Protector (Mostly B):** "Not so fast." You believe consent is a process, not an event. You want safeguards to ensure the "yes" is truly free and informed.
  *   **The Realist (Mostly C on Structural Qs):** "It's rigged." You suspect "consent" is often just a way for the powerful to blame the weak. You look at the options people had *before* they said yes.
  *   **The Intuitionist (Mixed/Contextual):** "It depends." You don't have a single rule. You judge based on the stakes. A cookie click isn't a surgery consent. (Note: This is likely the most common result, and the most honest one).

  ### Journalist's Cheat Sheet for the Piece
  *   **Quote the Inconsistencies:** The most interesting data won't be the "pure" types, but the people who say the drunk "yes" counts (5A) but the cookie "yes" doesn't (2B). Ask them: *Why is alcohol a barrier to judgment but dark patterns aren't?*
  *   **The "Magic Word" Argument:** Use the results from Question 7 to argue that we use "consent" to do two different jobs: making things okay (moral) and stopping lawsuits (legal). When those come apart, the word breaks.
  *   **The Structural Blindspot:** If most readers invalidate the Boss (3A) but validate the Hurricane Seller (6A), point out that we are more comfortable recognizing coercion in *relationships* than in *markets*, even if the desperation is the same.
