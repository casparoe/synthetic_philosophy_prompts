answer: |-
  You have stumbled onto the "inefficacy problem" in moral philosophy, but you have done something most philosophers don't: you have trusted your intuitions enough to list them, rather than forcing them into a pre-existing theory. Your brother-in-law is relying on a crude causal utilitarianism (if $X$ doesn't change the outcome, $X$ doesn't matter). Your intuitions correctly reject this, but they are currently relying on a mix of deontology (duty), virtue ethics (character), and rule-utilitarianism (norms), which is why they feel inconsistent.

  To resolve this, we need a principle that shifts the focus from **causal efficacy** (did I change the world?) to **moral participation** (what role did I play?).

  Here is a precise principle designed to capture your verdicts, followed by the hard truth about which one must go.

  ### The Principle of Policy and Participation

  **An act is morally significant not by its aggregate consequence, but by the nature of the practice it instantiates.**

  1.  **Clause A (Constitutive Practices):** If an act is a constitutive part of a valuable social practice (e.g., democracy, shared cleanliness), you are obligated to perform (or refrain from) it regardless of causal efficacy.
      *   *Motivating Case:* **Voting.** Voting constitutes the practice of democracy; abstaining undermines the norm even if the vote isn't decisive.
      *   *Motivating Case:* **Littering.** Cleanliness is a constitutive norm of shared space; littering violates the rule of the "commons" even if one wrapper doesn't fill the landfill.

  2.  **Clause B (Structural Complicity):** If an act joins you to a harmful structural system (e.g., factory farming, fossil fuel infrastructure), it is wrong if it represents a **standing policy of the self**, unless a specific exception applies.
      *   *Motivating Case:* **Gas Car.** Buying the car is a multi-year commitment (a policy) to emissions. It normalizes the harm for yourself and signals demand to the market.
      *   *Motivating Case:* **Chicken Sandwich.** While one sandwich doesn't kill a bird, it is a participation in a cruel industry where alternatives exist. It is a "vote" for that system.

  3.  **Clause C (The Relational Exception):** A singular act that contributes to structural harm is permissible only if it secures a **non-fungible relational good** that cannot be achieved through lower-harm means, and is not routinized.
      *   *Motivating Case:* **The Flight.** This is the wedge. You judge it fine because it is rare (not a policy) and serves a specific high-value relationship (sister) that Zoom cannot replace.

  ### Application to New Cases

  Here is what this principle dictates for the cases you haven't listed:

  **1. A single burger on your birthday after a year of vegetarianism.**
  *   **Verdict:** **Permissible (borderline).**
  *   **Reasoning:** This falls under Clause C. It is singular (not a policy) and serves a celebratory/relational function (birthday). However, because the harm (animal suffering) is more direct than carbon emissions, it is morally "costlier" than the flight. It is permissible, but requires acknowledgment, not indifference.

  **2. A billionaire's private flight.**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** This fails Clause C. While it is a "singular act" in one sense, for a billionaire, private aviation is often a **policy of lifestyle**, not a singular relational necessity. Furthermore, the magnitude is so vast it ceases to be a "rounding error" and becomes a dominant contribution. It lacks the "non-fungible relational good" justification (it is usually for convenience or status).

  **3. Voting in a seat so safe that decisiveness odds are even more remote.**
  *   **Verdict:** **Obligatory.**
  *   **Reasoning:** Clause A is insensitive to probability. The obligation is to *participate in the practice*, not to *decide the election*. In fact, in safe seats, the expressive signal of participation is arguably more important because the outcome is foregone.

  **4. A small donation to a large relief fund.**
  *   **Verdict:** **Worthwhile (and weakly obligatory if wealthy).**
  *   **Reasoning:** This is like Voting (Clause A), not like the Tap. You are sustaining the *institution* of aid. Even if your $50 doesn't save a specific life, it keeps the mechanism of saving lives operational. It is a participatory act in a constitutive good (humanitarianism).

  ### The Honest Trade-Off: Which Verdict to Surrender?

  You asked me to be honest about the choice the list forces. You want to know if the only way to save all six verdicts is a principle with a separate clause per case.

  **The answer is yes.** As it stands, your verdict on **The Flight** is the outlier that threatens the coherence of the entire system.

  Here is why you must surrender the intuition that the flight is "basically fine."

  1.  **The Magnitude Mismatch:** You admit the flight emits more in hours than your rest of the year. If the **Gas Car** is a "genuine contribution to harm" because of its emissions, the Flight is a *massive* contribution to harm. To call one "wrong" and the other "fine" relies entirely on the *frequency* (policy vs. act) rather than the *damage*.
  2.  **The Precedent Problem:** If the "Relational Exception" (Clause C) allows for 5 tons of CO2 because you love your sister, it is hard to explain why it doesn't allow for the Gas Car if you love your commute, or the Burger if you love the taste. You are relying on the *rarity* of the flight to do moral work that the *magnitude* of the emissions overwhelms.
  3.  **The Brother-in-Law's Trap:** Your brother-in-law argues that individual acts don't matter. By saying the Flight is "fine," you are inadvertently agreeing with him on the biggest emitter in your life. You are conceding that when the numbers get big enough, individual choice dissolves into "just one flight."

  **The Recommendation:**
  Adopt the **Principle of Policy and Participation**, but **tighten Clause C**.
  *   *Revised Clause C:* A singular act contributing to structural harm is permissible only if the harm is *proportionate* to the relational good.
  *   *The Surrender:* You must admit the Flight is **wrong**, or at best a **guilty indulgence**, not "basically fine."

  **Why surrender this one?**
  *   **Voting** and **Littering** are about civic identity; keep them. They define who you are as a citizen.
  *   **Gas Car** and **Sandwich** are about routine complicity; keep them. They define who you are as a consumer.
  *   **Tap Water** is low-stakes habit; keep it as "mildly wrong."
  *   **The Flight** is the only one where you are asking for a "free pass" on the largest harm you commit. If you surrender this verdict, your moral profile becomes consistent: *You are a person who fulfills civic duties, avoids routine structural harm, and acknowledges that even rare indulgences carry a moral cost that must be owned, not dismissed.*

  **The Resulting View:**
  You tell your brother-in-law: "You are right that my vote doesn't decide the election, and right that my sandwich doesn't kill a bird. But ethics isn't about being a causal lever; it's about not being a free-rider on the norms that keep society and the planet habitable. I vote because I am a citizen, not a kingmaker. I don't litter because I am a neighbor, not a janitor. And I shouldn't take that flight—not because it changes the climate single-handedly, but because I cannot claim to care about the climate while paying for the single most damaging act I commit all year, simply because it's rare."

  This leaves you holding a consistent, demanding, but defensible moral identity. It costs you the flight, but it saves your integrity.
