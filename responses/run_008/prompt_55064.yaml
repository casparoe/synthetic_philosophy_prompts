answer: |-
  **Ticket #9942-Ω**
  **Subject:** Warranty Claim – Cardiac Cessation / Visual Intentionality
  **Status:** Closed – Denied
  **Department:** Original Function Warranty Co. (Etiological Division)

  **Customer (Swampman):**
  My heart stopped. It restarted, but I assume this counts as a malfunction under the Lifetime Biological Coverage plan. I also need my eyes checked; they seem to be representing the world accurately, but I'd like confirmation they are functioning *for* that purpose.

  **Agent (K. Papineau):**
  Thank you for contacting Original Function Warranty Co. We have received your claim regarding organ cessation. However, our records indicate a gap in your phylogenetic paperwork. To qualify for a malfunction claim, the organ in question must possess a *proper function*. Under Policy 4.1 (Selected-Effect), a proper function is derived exclusively from the item's selection history.

  Currently, our system shows no evidence of evolutionary antecedents for your unit. Without ancestors who survived due to similar cardiac activity, your heart has no proper function. It merely has a causal role. Therefore, it cannot malfunction. It can only cease causal activity. Please submit proof of lineage to proceed.

  **Customer (Swampman):**
  I don't have paperwork. I popped into existence moments ago when lightning struck a swamp. But I have memories of having a heart. I remember it pumping. Doesn't that count? It feels exactly like I have a history.

  **Agent (K. Papineau):**
  We understand the subjective experience is indistinguishable from that of a lineage-bearing customer. However, under Teleosemantic Standards, internal states without a causal history of selection lack intentional content. Your "memories" are not *about* the past; they are merely physical states isomorphic to past events. They do not refer. Consequently, you cannot remember having a function, because you cannot have thoughts *about* functions.

  Regarding your eyes: They may detect light, but without a history of selection for visual discrimination, your visual states are not *about* the environment. They are blind reactions. We cannot warranty a function that does not exist.

  **Customer (Swampman):**
  This email you sent me—it has content. It's about my claim. But it's just ink on a screen (or electrons) generated by your company's history. My brain is physically identical to a warranted customer's brain. If your text has meaning because of its production history, why doesn't my brain state have meaning because of its physical structure? What is the relevant difference other than the paperwork you're asking for?

  **Agent (K. Papineau):**
  That is a category error. This policy document was produced by a mechanism (the Legal Dept) selected for the purpose of regulating claims. Its function is derived from that institutional selection. Your neural states were not selected for by any prior mechanism; they arose via stochastic swamp activity. The difference is not structural, but historical. Since we cannot verify you are not an ordinary customer with a data loss issue, we must treat you as a Causal Orphan until further notice.

  I am escalating this to Supervision to determine if your structural isomorphism qualifies for a provisional waiver.

  **Supervisor (R. Millikan):**
  Review complete. The objection regarding the policy document is noted but irrelevant. The document's function is sustained by its reproduction within our corporate ecosystem. You are not part of that ecosystem. You are a philosophical accident.

  Under Section 9 (Misrepresentation), a state misrepresents only if it fails to perform its proper function. Since you have no proper functions, you cannot misrepresent reality, nor can your organs fail. You are functioning exactly as a lightning-struck swamp entity should. Claim denied. We recommend decomposing peacefully to avoid further causal confusion.

  **Customer (Swampman):**
  So if I stop breathing, it's not a failure?

  **Supervisor (R. Millikan):**
  Correct. It is merely a change in state. Ticket closed.
