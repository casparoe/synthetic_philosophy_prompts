  **The state of the play**
  Biological Species Concept (BSC) proponents define species as actually or potentially interbreeding populations reproductively isolated from others, prioritizing process over pattern. Phylogenetic Species Concept (PSC) advocates argue for the smallest diagnosable monophyletic lineage, prioritizing genealogy and pattern over mating compatibility. Cohesion theorists view species as clusters held together by homeostatic processes like gene flow or stabilizing selection, attempting to bridge the two. Pluralists contend no single concept fits all life, advocating context-dependent definitions for different kingdoms or questions. Meanwhile, taxonomists often bypass theory, relying on morphological gaps and intuition to name units for museums and laws. Asexuals, microbes, and ring species remain outliers exposing cracks in each framework, creating a stalemate where theory fragments while practice continues unchanged.

  **Diagnosis**
  Your hypothesis is closer to the truth about the *debate*, but the biologist is right about the *biology*. This is not merely verbal, nor purely empirical. It is a normative dispute over where to draw thresholds on a continuous evolutionary process.

  The biologist correctly identifies that lineage separation is a real physical phenomenon. Genetic clusters exist; reproductive isolation evolves. However, she errs in assuming nature labels these clusters "species." Evolution produces a continuum of divergence, from panmixia to complete isolation. "Species" is a discrete linguistic rank we impose on this gradient. The BSC cuts the continuum at reproductive isolation; the PSC cuts at diagnosable divergence. Both track real processes, but they prioritize different snapshots of speciation. When she calls pluralism "changing the subject," she is defending ontological realism—the belief that natural kinds exist independently of us. She fears that if "species" is just a tool, biology loses its objective footing.

  You are correct that "species" performs multiple jobs—legal, evolutionary, classificatory—and each camp optimizes for a different function. Conservation needs stable units (favoring PSC); evolutionary biologists need process units (favoring BSC). The disagreement persists because no single threshold satisfies all functions simultaneously. Calling it "pluralism" isn't evasion; it's acknowledging that one word cannot capture both the process of splitting and the product of divergence. The fight isn't about what nature is doing; it's about which slice of nature deserves our specific label. You are both right: there are real clusters, but the decision to call a cluster a "species" is a human valuation, not a natural fact. The disagreement is bedrock intuition about whether science should describe nature or manage it. The stalemate exists because we are trying to force a discrete noun onto a continuous verb. Until we admit the rank is arbitrary, even if the lineage is real, the camps will talk past each other, mistaking methodological preferences for ontological discoveries. Working taxonomists ignore the theory because they solve practical ID problems, not metaphysical ones. The biologist's pushback is a defense of scientific realism against pragmatic instrumentalism.

  **What would count as progress**
  More data won't solve this; genomics only reveals finer gradients, sharpening the continuum problem. The "Pluto route"—a committee ruling by fiat—would be progress for nomenclature but surrender for science. It stabilizes communication for museum drawers and lawyers, which is valuable, but it obscures the biological reality that boundaries are porous. It treats a dynamic process as a static object.

  Real progress requires decoupling "lineage" from "rank." We should stop asking binary questions ("Is this a species?") and start reporting divergence metrics (genomic distance, gene flow rates). We need a taxonomy that acknowledges uncertainty rather than forcing discrete boxes. Until we accept that "species" is a human tool for managing complexity, not a natural kind waiting to be discovered, the debate will remain a zombie argument. The Pluto decision worked for planets because orbits are stable; evolution is not. We should embrace the messiness rather than legislate it away. A committee can standardize names, but it cannot standardize nature. Tell your editor the Pluto route is administrative progress, but scientific surrender. This is the honest conclusion.
