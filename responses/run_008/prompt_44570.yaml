prompt: |-
  Next month I'm presenting at a metaethics workshop, defending expressivism — roughly, that moral claims express desire-like attitudes rather than beliefs — but a specific version, where the attitude expressed is something like accepting a norm or plan rather than approval or disgust, since I think the approval-based versions die on embedded negation. The room: three or four committed moral realists who think Frege–Geach settled all this long ago, one logician who doesn't do metaethics and mostly showed up because he heard there'd be conditionals, and some grad students who'll ask whatever the senior people signal is fair game. Prep my Q&A sheet: the objections in roughly the order they'll arrive, phrased the way each group would actually put it (the realists will open with how modus ponens stays valid on a moral conditional if the premises aren't beliefs; the logician will want to know what semantic value a moral sentence even carries in my compositional semantics, and whether failing to approve of X is supposed to be the same state as approving of not-X), each with a reply I can give in about two minutes and an honest note on where that reply is soft. Also tell me what I should concede up front to buy some goodwill. And include the question I'm hoping nobody asks: I still dont have a good answer for how the plan-version of the view handles genuine disagreement with a total amoralist, someone with no plans or commitments about torture either way.
reasoning: |-
