      *   *Specifics:* Norm-acceptance/Planning state (Allan Gibbard's *Wise Choices, Apt Feelings* or *Thinking How to Live*).
      *   *Motivation:* Solves the "embedding problem" (Frege-Geach) better than simple emotivism because plans/norms have logical structure.
      *   *Weakness:* The "Amoralist" challenge (How do we disagree with someone who has no plans?) and potentially the "Negation" challenge (What is the difference between not planning to X and planning not to X?).

  3.  **Drafting the Q&A Section (Iterative Process):**

      *   *Objection 1: The Realists (Frege-Geach/Modus Ponens).*
          *   *Phrasing:* "If 'Murder is wrong' isn't a belief, how does it function as a premise in modus ponens? You can't infer a belief from a non-belief."
          *   *Reply:* Focus on consistency of planning states. It's not about truth-preservation in the realist sense, but consistency of norms. If I accept "If murder is wrong, then hiring a hitman is wrong" and "Murder is wrong," consistency demands I accept "Hiring a hitman is wrong."
          *   *Soft Spot:* Does "consistency of plans" really mimic "validity" enough to satisfy a logician/realist? It might look like pragmatics, not semantics.

      *   *Objection 2: The Logician (Semantic Value & Negation).*
          *   *Phrasing:* "What is the semantic value? Is it a set of worlds? A set of plans? And what about negation? Is 'not accepting norm N' the same as 'accepting norm not-N'?"
          *   *Reply:* Semantic value is a function from contexts to planning states (or sets of hyperplans). Negation is tricky but distinct: Rejecting a plan vs. Planning the alternative. We need a logic of planning.
          *   *Soft Spot:* This is technically demanding. If the semantics isn't fully fleshed out (e.g., Schwarz's or Gibbard's later work), it looks hand-wavy. The distinction between negation of attitude vs. attitude toward negation is a classic trap.

      *   *Objection 3: The Realists (Truth & Factuality).*
          *   *Phrasing:* "We talk about moral truths. You're saying we're all systematically mistaken or speaking loosely? Why not just admit they are beliefs about normative facts?"
          *   *Reply:* Deflationism about truth. "True" just means "I accept the norm." We can talk about moral truth without realist ontology. It captures the *feel* of realism without the metaphysical baggage.
          *   *Soft Spot:* Deflationism often feels like a cheat to realists. It doesn't explain *why* the norm is correct, just that we hold it.

      *   *Objection 4: Grad Students (Motivation/Internalism).*
          *   *Phrasing:* "If it's just plans, why does morality feel binding? Can't I just plan to be selfish?"
          *   *Reply:* Moral norms are the ones we accept for coordinating social life/resolving conflict. It's not just any plan, it's a specific *kind* of norm acceptance (impartial, etc.).
          *   *Soft Spot:* Risks collapsing into a form of constructivism or realism about rationality.

      *   *The Dreaded Question (The Amoralist).*
          *   *Phrasing:* "How do you disagree with someone who has no plans regarding torture?"
          *   *Strategy:* Acknowledge the difficulty. Don't bluff. Frame it as a limitation of the *communicative* function rather than the *semantic* function. Or, argue that such a person is conceptually impossible (constitutive normativity).
          *   *User's Constraint:* User says they *don't* have a good answer. I need to frame this carefully so they don't get crushed, perhaps by shifting the burden or admitting it's an open research question.

