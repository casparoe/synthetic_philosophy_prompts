  8.  *(Self-Correction during drafting)*: I initially thought about suggesting a Gibbard-style answer to the amoralist (that they are irrational). But the user said they don't have a good answer. I should advise them to *own* that uncertainty rather than fake a solution that the realists will tear apart. Better to frame it as "My account explains disagreement between moral agents; the amoralist is an edge case regarding the scope of normativity."

  9.  *(Final check on the Logician)*: The logician cares about compositionality. The reply needs to mention how complex sentences get their values (e.g., via consistency constraints on planning states).

  10. *(Final check on Realists)*: They love Frege-Geach. The reply must explicitly mention how the *logic* works, not just the psychology.

