answer: |-
  Here is your Q&A battle sheet. It's structured by who is likely to stand up, based on the room composition you described. The replies are timed for about two minutes of spoken speech (approx. 250–300 words).

  ### **Pre-Game Strategy: Concessions for Goodwill**
  *Do not start defensive.* The realists expect you to fight for every inch. Disarm them by conceding the historical failures of your view.

  1.  **Concede that Simple Emotivism is Dead:** Open by acknowledging that Ayer/Stevenson style expressivism *did* die on Frege-Geach. Make it clear you are defending a *normative/plan-based* expressivism (Gibbard-style), not an emotional one. This shows you know the literature and aren't recycling 1930s mistakes.
  2.  **Concede "Truth" Talk:** Explicitly state that you are happy to say moral sentences are "true." You are a deflationist about truth, not an eliminativist. This removes the "But we talk about moral facts!" objection before they can raise it.
  3.  **Concede Complexity:** Admit that your semantics is more complex than realist semantics. Don't claim expressivism is "simpler." Claim it is *metaphysically lighter*. Realists will respect honesty about technical debt.

  ---

  ### **The Q&A Sheet**

  #### **1. The Committed Realists (The Opening Salvo)**
  **The Objection:** "Let's go straight to Frege-Geach. If 'Murder is wrong' expresses a plan rather than stating a fact, it lacks a truth-apt content. So, in the argument: (1) If murder is wrong, then hiring a hitman is wrong; (2) Murder is wrong; (3) Therefore, hiring a hitman is wrong—premise (2) expresses a plan, but the antecedent of (1) is unasserted. How can the same sentence have a different semantic function in the antecedent? If it doesn't express the plan there, modus ponens fails. You haven't solved embedding; you've just pushed it back."

  **Your Reply:**
  "The key is that we aren't analyzing the sentence in isolation, but the *state of mind* expressed. On my view, the semantic value of a moral sentence is its role in constraining planning states. When I assert 'Murder is wrong,' I am expressing my own plan-acceptance. When I assert the conditional 'If murder is wrong...', I am expressing a higher-order plan: a commitment to consistency between my plans.
  Validity isn't about truth-preservation here; it's about *consistency-preservation* of attitudes. If I accept the conditional norm and I accept the antecedent norm, consistency *requires* I accept the consequent norm. The semantic content is the constraint on the planning state, which remains constant whether asserted or embedded. The logic holds because the planning states themselves have logical structure."

  **Honest Note on Soft Spot:**
  This relies heavily on the claim that planning states have a logic isomorphic to propositional logic. If they press on *why* inconsistency in plans is irrational in the same way contradictory beliefs are, you might struggle. You are essentially asserting a "logic of plans" without a metaphysical grounding for why that logic binds us.

  #### **2. The Logician (The Technical Check)**
  **The Objection:** "I want to look at your compositional semantics. If the semantic value is a set of plans or norms, what is the denotation of a negation? Is 'It is not the case that X is wrong' the same semantic value as 'X is permissible'? More specifically, is the state of *failing to accept a norm against X* identical to *accepting a norm permitting X*? If not, your negation operator isn't classical, and you lose standard logic."

  **Your Reply:**
  "That's the crucial distinction. On a plan-based view, *rejecting* a norm (not planning against X) is distinct from *accepting the negation* (planning to permit X). We call this the difference between 'no plan' and 'plan for the alternative.'
  To keep classical logic, I treat the semantic value as a function from contexts to sets of hyperplans. Negation operates on the content of the plan, not just the attitude. So, 'Not wrong' maps to the set of planning states that rule out ruling out X. It's technically dense, but it allows us to preserve bivalence within the system of norms without positing moral properties. We get classical logic by ensuring the *normative propositions* behave classically, even if the psychological states are complex."

  **Honest Note on Soft Spot:**
  This is the most dangerous technical moment. If you haven't memorized the specific compositional machinery (e.g., Gibbard's *Thinking How to Live* vs. later refinements by Schwarz or Silk), you will sound vague. If you admit the semantics is "still being worked out," the logician will mark you down for incompleteness.

  #### **3. The Realists (Round Two: Disagreement)**
  **The Objection:** "Even if you solve logic, you lose disagreement. If I say 'Torture is wrong' (expressing my plan) and you say 'Torture is not wrong' (expressing your plan), we aren't contradicting each other. We're just comparing diaries. I can have a plan to ban torture, and you can have a plan to allow it, and we're both consistent. Where is the *conflict*?"

  **Your Reply:**
  "The conflict isn't in the world; it's in the joint coordination of our plans. Moral discourse is a tool for negotiating shared norms. When I disagree with you, I'm not saying your psychology is flawed; I'm trying to get you to adopt a plan that coordinates with mine.
  The 'contradiction' is pragmatic. We cannot jointly enact a plan that torture is both forbidden and permitted. Disagreement is the inability to converge on a shared practical standpoint. It feels like a factual disagreement because the pressure to converge is objective—we are constrained by human needs and rationality—but the state of mind is still practical, not theoretical."

  **Honest Note on Soft Spot:**
  Realists hate "pragmatic contradiction." They will argue that genuine disagreement requires one party to be *mistaken*, not just unable to coordinate. If you say "we just can't agree," they will say "No, one of you is *wrong*." You need to hold the line that "wrong" just *means* "fails to meet the standards of the converged plan."

  #### **4. The Grad Students (The Follow-Up)**
  **The Objection:** "Following up on disagreement: What about the amoralist? If someone says, 'I know torture violates your norms, but I have no plan regarding it either way,' you can't say they are inconsistent. So how is their view false? It seems your view makes morality optional for anyone who opts out of planning."

  **Your Reply:**
  "This is the limit case of the theory. My account explains the semantics of moral discourse *within* a community of agents seeking to coordinate. The amoralist is stepping outside the language game.
  However, I'd argue that having *no* plan on torture is itself a kind of planning failure given the nature of agents like us. We are social planners. To have no stance on significant harm is to be practically irrational, even if not logically inconsistent. So, while I can't say their belief is false (since they have none), I can say their practical stance is defective relative to the function of agency."

  **Honest Note on Soft Spot:**
  **This is your weakest point.** (See below). You are blurring the line between "irrational" and "immoral." If the amoralist says "I accept I'm irrational, so what?" you have no further move. This reply tries to pivot to a theory of rationality, which might open a new can of worms.

  ---

  ### **The Dreaded Question (The Amoralist Challenge)**
  **The Question:** "You just touched on this, but let's press it. If moral claims express plans, and the amoralist has no plans about torture, then when you say 'Torture is wrong' to them, you aren't contradicting them. They aren't saying 'Torture is permissible,' they are saying 'I don't care.' On your view, there is no genuine disagreement here. But intuitively, the amoralist is *wrong*, not just indifferent. How does your view capture the wrongness of the amoralist's stance without smuggling in a realist fact?"

  **Your Strategy:**
  *Do not bluff.* The realists know this is the hard case for Gibbardian views. If you try to fake a solution, they will smell blood.

  **Suggested Reply:**
  "I'm going to be candid: this is the frontier of the expressivist project. There are two ways to handle this, and I'm currently weighing them.
  First, I could argue that the amoralist is conceptually impossible—that to be an agent *just is* to be in the business of planning, so a total lack of normative stance is a failure of agency, not just morality.
  Second, I can concede that on my view, the amoralist isn't *mistaken* in a representational sense, but is failing to participate in the practice that gives moral terms their meaning.
  I lean toward the first: that normativity is constitutive of planning. But I admit this requires a robust account of practical rationality that I'm still refining. I don't think this collapses into realism, because the 'fact' of rationality is still a fact about *us* and our agency, not a mind-independent moral property."

  **Why this works:**
  It shows intellectual honesty. It frames the problem as a dispute about the *nature of agency* (which is fertile ground) rather than a semantic bug. It prevents the realists from claiming you "ignored" the problem.

  **Honest Note on Soft Spot:**
  You admitted you don't have a good answer. The soft spot is that if they press on *why* agency requires specific moral plans (vs. selfish plans), you might be forced to admit that "rationality" is just "realism in disguise." Be prepared to defend the claim that practical rationality is not just objective morality by another name.
