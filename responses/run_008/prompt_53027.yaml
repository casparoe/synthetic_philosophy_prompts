answer: |-
  ### Preliminary Brainstorming

  To make "collapse" scientifically usable, we cannot treat it as a vague metaphor for "things got worse." We need operational criteria that separate the loss of political complexity from the biological survival of the population. The theory must force us to specify *what* is disappearing—is it the king, the farmer, or the pot style? It must also demand temporal precision; if "collapse" can take three centuries, it risks becoming synonymous with "change." Finally, the theory must require independent evidence. We cannot define collapse by the absence of monuments and then explain the absence of monuments by collapse. The material record—bones, seeds, settlement footprints—must carry the weight, not just the silence of the elite archive.

  ***

  ### A. Requirements for a Theory of Societal Collapse

  1.  **Differentiation of Subsystems (The Elite/Population Distinction)**
      *   **Requirement:** The theory must explicitly distinguish between the dissolution of centralized political/economic institutions (elites, monuments, administration) and the biological welfare of the general population (nutrition, mortality, settlement density).
      *   **Case/Consideration:** **Post-Roman Britain.** If administrative structures vanish but skeletal stature increases, a theory that conflates "state loss" with "societal failure" fails. A valid theory must allow a verdict of "political collapse" alongside "demographic stability" or "improvement."
      *   **Settles:** Whether the fate of elites can be indexed separately from the fate of populations. (Verdict: Yes, they must be separable).

  2.  **Material Operationalization (The Evidence Constraint)**
      *   **Requirement:** The theory must generate specific, negative expectations about the material record that are independent of textual or ideological claims. It must specify what *absence* looks like in soil, bone, and stone.
      *   **Case/Consideration:** **Rapa Nui.** To adjudicate between ecocide and revisionism, the theory must specify whether pre-contact soil erosion, rat-gnawed seeds, or trauma in skeletons are necessary conditions. It cannot simply absorb whatever evidence is found as proof of "collapse."
      *   **Settles:** Whether the theory must generate testable expectations rather than absorbing whatever turns up. (Verdict: Yes, it must predict specific material signatures).

  3.  **Scalar Specificity (The Geographic/Political Unit)**
      *   **Requirement:** The theory must define the spatial and political unit of analysis *before* the event is identified. It cannot shift scales to save the concept (e.g., claiming "the Maya" didn't collapse because the North survived, while the South did).
      *   **Case/Consideration:** **The Maya.** A theory must decide if "collapse" applies to the Southern Lowland polities specifically, or if it requires the failure of the entire linguistic/cultural group. It must handle regional heterogeneity without moving the goalposts.
      *   **Settles:** Whether a verdict of collapse can be indexed to one level while other levels continue. (Verdict: Yes, collapse can be regional/sub-systemic, provided the unit was defined in advance).

  4.  **Temporal Thresholds (The Process/Event Distinction)**
      *   **Requirement:** The theory must specify a maximum duration for the "collapse" phase. If the decline exceeds a certain generational threshold, it must be reclassified as transformation or evolution.
      *   **Case/Consideration:** **Late Bronze Age.** If palace economies fail over 150 years, is that collapse or drift? A theory needs a temporal boundary to distinguish systemic failure from gradual restructuring. However, this boundary must be flexible enough to accommodate communication lags in pre-modern networks.
      *   **Settles:** Whether collapse must be treated as a state or a process, graded or all-or-nothing. (Verdict: It is a process with a defined temporal threshold, not an instantaneous event, but not infinite).

  5.  **Observer Neutrality (The Complexity Bias)**
      *   **Requirement:** The theory cannot define collapse solely by the loss of features valued by modern observers or ancient elites (e.g., monument building, literacy, centralization).
      *   **Case/Consideration:** **The Maya & Rome.** The end of monument building is an elite signal. A theory that equates "no more stelae" with "societal collapse" privileges the dynastic perspective over the villager's. The definition must be neutral regarding whether less complexity is inherently "worse."
      *   **Settles:** Whether the concept is required to be observer-neutral. (Verdict: Yes, it cannot rely on elite markers alone).

  ***

  ### B. Analysis of Requirements

  **Non-Negotiable Requirements (Scientific Necessities)**
  *   **Material Operationalization:** Without independent material correlates, the concept is unfalsifiable storytelling.
  *   **Differentiation of Subsystems:** Without separating elite institutions from population welfare, the concept cannot account for cases where political dissolution benefits the majority (e.g., Post-Roman Britain).
  *   **Scalar Specificity:** Without a fixed unit of analysis, the concept becomes immune to counter-evidence by shifting scale (the "No True Scotsman" fallacy).

  **Prejudices of Research Traditions**
  *   **Temporal Thresholds:** The demand for rapidity is a **Catastrophist prejudice**. The Resilience/Transformation school rightly argues that systemic change can be slow. Enforcing a strict "rapid" requirement biases the theory against gradual failures.
  *   **Observer Neutrality:** The demand that "less complexity is not necessarily bad" is a **Resilience/Transformation prejudice**. Catastrophists often assume complexity is a good that its loss is inherently negative. However, for a *scientific* concept, neutrality is actually required to avoid normative bias, so this borders on non-negotiable for social science, even if catastrophists resist it.

  **Jointly Unsatisfiable Subset**
  *   **Rapidity + Totality + Material Continuity.** You cannot simultaneously demand that collapse be (1) rapid (under 50 years), (2) total (affecting the whole society/unit), and (3) compatible with material continuity of the population.
      *   *Why:* The **Late Bronze Age** and **Rome** cases show that political totality can fail rapidly while the population persists and adapts over centuries. If you enforce Rapidity and Totality, you must deny the population continuity, which contradicts the bioarchaeology. If you enforce Totality and Continuity, you must abandon Rapidity, which contradicts the burning layers of the LBA. A theory must drop one: usually "Totality," accepting that collapse is subsystemic.

  **The Single Most Excluding Requirement**
  *   **Differentiation of Subsystems (Elite vs. Population).**
      *   *Why:* This requirement excludes the majority of popular "collapse" narratives (including Diamond-style accounts and traditional historiography) which rely on the conflation of "end of empire" with "end of people." Enforcing this forces theorists to admit that in many cases (Rome, Maya), only the *superstructure* collapsed, while the *base* persisted. This strips the concept of its dramatic, apocalyptic weight, rendering many existing theories insufficient.

  ***

  ### C. Preliminary Scorecard

  **Tainter (Diminishing Returns on Complexity)**
  Fares well on Scalar Specificity and Subsystem Differentiation, as it defines collapse as a loss of sociopolitical complexity rather than people. However, it struggles with Material Operationalization regarding welfare, often assuming complexity loss implies welfare loss, which the Britain case challenges.

  **Diamond (Ecocide/Environmental Determinism)**
  Fares poorly on Observer Neutrality and Subsystem Differentiation. It tends to conflate environmental stress with total societal moral failure and assumes population collapse follows environmental degradation, which the Rapa Nui revisionists and Britain data contest.

  **Resilience/Transformation View**
  Fares well on Material Operationalization and Temporal Thresholds, accepting gradual change and continuity. However, it risks failing the Scalar Specificity requirement by redefining "collapse" out of existence as mere "adaptation," potentially losing the ability to distinguish catastrophic failure from successful reorganization.
