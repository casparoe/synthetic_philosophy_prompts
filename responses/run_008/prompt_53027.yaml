  10. **Final Polish:** Check word count and flow. Ensure the distinction between "collapse of a state" and "collapse of a society" is clear, as that's the crux of the Maya/Rome problems.

  *(Self-Correction on Section B)*: The prompt asks to identify if any subset is jointly unsatisfiable. I need to be careful here. If I demand "collapse must be rapid" AND "collapse must affect the whole society," does that rule out Rome? Yes. Does it rule out LBA? Maybe. Does it rule out Maya? Yes. So that's a good tension to highlight.

