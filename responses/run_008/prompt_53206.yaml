      *   *Strength:* Determined by the minimum strength of components.
      *   *Load:* External stress applied to the system.
      *   *Breaking:* Catastrophic failure.
      *   *Mapping to AI:*
          *   Links $\to$ Safeguards? Failure modes? Input classes?
          *   Load $\to$ Adversarial input / Deployment context.
