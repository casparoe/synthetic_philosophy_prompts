answer: |-
  Your framing is astute in its general skepticism—philosophical disputes *often* dissolve under taboo—but your specific premise regarding the etiological (selected-effect, SE) and causal-role (CR) accounts is factually incorrect. **The two accounts are not extensionally equivalent.**

  While they agree on paradigm cases (the heart pumping), there is a well-documented set of cases where they yield divergent verdicts. Consequently, the choice between them is not merely stylistic; it determines how you classify specific biological phenomena, particularly regarding malfunction, side effects, and novel traits.

  Here is the scrutiny of your framing, the boundary between settled and contested ground, and the practical recommendation you requested.

  ### 1. Scrutinizing the Framing: Extensional Equivalence is False

  You claim that "in every actual case I can think of, the two accounts classify the same traits as having the same functions." This is the weak link in your reasoning. The literature persists not because philosophers are generating employment, but because the two definitions carve nature at different joints in non-trivial ways.

  Here are three classes of cases where SE and CR diverge:

  **A. Side Effects (Spandrels)**
  *   **The Case:** The heart makes a thumping sound. This sound contributes to the capacity of a doctor to diagnose heart conditions via stethoscope.
  *   **Causal-Role (CR):** The sound *is* a function of the heart, relative to the capacity of "being diagnosable by a physician." It is a causal contribution to a systemic capacity.
  *   **Etiological (SE):** The sound is *not* a function. Hearts were not selected *for* making noise; the noise is a byproduct of the pumping mechanism.
  *   **Divergence:** CR ascribes function; SE denies it.

  **B. Malfunction and Disease**
  *   **The Case:** A heart with a congenital defect that cannot pump blood.
  *   **Etiological (SE):** The heart still has the *function* of pumping blood, even if it cannot do it. It is malfunctioning. This aligns with medical intuition (it is a diseased heart).
  *   **Causal-Role (CR):** Strict CR accounts struggle here. If function is defined by *actual* causal contribution to a capacity, and the heart contributes nothing to pumping, it arguably has no function of pumping. Some CR theorists modify the view to handle this, but the basic CR formulation implies that if it doesn't do it, it isn't functioning.
  *   **Divergence:** SE preserves normative norms (ought vs. is); CR tends to collapse function into actual performance.

  **C. Novel Traits and Exaptations**
  *   **The Case:** A new mutation arises that immediately confers a survival advantage, but has no selection history yet.
  *   **Etiological (SE):** Strictly speaking, the trait has no "function" yet, because there is no history of selection. It is merely beneficial.
  *   **Causal-Role (CR):** The trait has a function immediately, because it is currently contributing to the organism's capacity to survive.
  *   **Divergence:** SE requires history; CR requires only present utility.

  Because these verdicts differ, the dispute is not purely verbal in the sense of "agreeing on all facts." They disagree on which facts (history vs. present contribution) are *relevant* to the ascription of the label "function."

  ### 2. Settled vs. Contested

  To answer your request for explicit boundaries:

  **Settled (Consensus)**
  *   **Paradigm Cases:** Both accounts agree on standard textbook examples (hearts pump, kidneys filter).
  *   **Utility:** Both agree that "function" talk is indispensable to biology and cannot be fully eliminated without loss of explanatory power.
  *   **Naturalism:** Both agree that functions must be grounded in natural facts, not supernatural or mysterious teleology.

  **Contested (Genuine Disagreement)**
  *   **The Extension:** As shown above, whether side effects, novel traits, or broken traits count as "functions" is not settled.
  *   **Normativity:** Whether "function" implies a normative standard (i.e., that a trait *ought* to do X) is contested. SE supports normativity (you can fail your function); CR tends toward descriptivism (you just do what you do).
  *   **Pluralism:** Whether there is *one* correct concept of function or *many* (context-dependent) is a major live debate.

  ### 3. Is Pluralism an Evasion?

  You asked whether pluralism is a respectable position or an evasion. In this specific literature, **pluralism is a highly respectable and increasingly dominant position.**

  Philosophers like Peter Godfrey-Smith and Justine Kingsbury have argued that biologists use "function" in different senses depending on the sub-discipline.
  *   **Evolutionary Biologists** generally need the **SE** account (to explain why a trait exists).
  *   **Physiologists** generally need the **CR** account (to explain how a system works right now).
  *   **Philosophers of Medicine** generally need the **SE** account (to define disease as the failure of a selected function, per Boorse).

  Adopting pluralism is not dissolving the dispute out of laziness; it is acknowledging that the word "function" does different work in different explanatory contexts. It is not an evasion if you explicitly state which sense you are using in which context.

  ### 4. Practical Recommendation

  Since the accounts are not extensionally equivalent, you cannot make an arbitrary stylistic choice without risking confusion or error in borderline cases. Your choice should be driven by the **explanatory goal** of your writing.

  **Adopt the Etiological (SE) idiom if:**
  *   You are discussing evolution, adaptation, or why a trait exists.
  *   You are discussing medicine, disease, or malfunction (where you need to distinguish "broken" from "working differently").
  *   You want to rule out "spandrels" (side effects) from counting as functions.
  *   *Reasoning:* This is the standard in evolutionary biology and philosophy of medicine. It preserves the intuition that a thing can fail to do what it is supposed to do.

  **Adopt the Causal-Role (CR) idiom if:**
  *   You are discussing physiology, engineering, or systems analysis.
  *   You are analyzing a system where selection history is unknown or irrelevant (e.g., AI, novel ecosystems, or immediate physiological responses).
  *   You want to include side-effects in your analysis of how a system operates.
  *   *Reasoning:* This is the standard in functional analysis and systems biology. It captures what a trait is *doing* regardless of why it is there.

  **The Rationalist Move:**
  Do not simply pick one and hide the other. The most precise approach is to **operationalize**.
  *   *Bad:* "The function of the heart is to pump blood." (Ambiguous which account you use).
  *   *Better:* "The selected-effect function of the heart is to pump blood."
  *   *Better:* "The causal role of the heart sound is to aid diagnosis."

  ### Summary Correction

  Your premise that the dispute is purely verbal and the accounts are extensionally equivalent is false. There are clear cases (malfunction, side effects, novel traits) where the two accounts deliver different truth values.

  Therefore, the dispute should not be dissolved. However, your intuition that *much* of the heat in the debate is verbal is partially correct: the disagreement is often about which concept *deserves* the word "function," rather than about the biological facts themselves.

  **Final Advice:** Do not treat the choice as arbitrary. If you are writing about biology or medicine, default to the **etiological (selected-effect)** account, as it handles malfunction and normativity better, which are usually the stakes in those fields. If you are writing about systems or mechanics, use **causal-role**. Explicitly specify which you are using when borderline cases arise. This avoids the verbal dispute without ignoring the substantive differences.
