      *   *Key Divergence 1: Spandrels/Side Effects.* A trait might contribute to survival (CR) but not be selected *for* that contribution (SE). Example: The redness of blood. It contributes to oxygen transport (chemically), but is it a *function*? CR might say yes (it plays a role in the system). SE says no (it wasn't selected for redness, just for oxygen binding). Better example: Bone density supporting muscle attachment. CR says "supporting muscles" is a function. SE says only if selected for that.
      *   *Key Divergence 2: Malfunction/Disease.* SE handles malfunction well (it's doing what it wasn't selected to do, or failing to do what it was selected to do). CR struggles. If a heart pumps blood poorly, is that its function? CR often defines function as "what it actually does." If it fails, does it lose the function? SE says the function remains even if the trait is broken.
      *   *Key Divergence 3: Novel Traits/Exaptations.* A trait arises for reason A, is co-opted for reason B. SE says function is A (historically). CR says function is B (current contribution). Example: Feathers. Originally for warmth (SE), now for flight (SE updated? or CR?). If a trait *just* evolved and hasn't been selected yet, SE says no function yet. CR says yes, if it contributes.
