      *Key Insight on Rivals:* The "Truth Norm" is the main competitor. But Truth doesn't explain the *first-person* authority.

      *Let's check the user's specific question about "grading by confidence".* If ordinary speech grades by confidence, does that conflict? KNA says assertion is binary (you know or you don't), but you can *hedge* ("I think..."). If people treat "I'm 90% sure" as an assertion, KNA says that's not a flat-out assertion. This is a potential friction point.

      *Let's check the "Immunization" risk.* If I say "Knowledge is context sensitive," I can explain away almost anything. But then "Knowledge" loses its bite. I need to warn the user that Contextualism saves KNA but at the cost of making "Knowledge" unstable.

