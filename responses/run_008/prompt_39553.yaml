          *   *Tier 3 (Awkward but manageable):* Children/Reprimands. This actually *supports* KNA.
          *   *Tier 4 (Conceptual):* Confidence Grading. KNA handles this via "hedging."
      *   *Section 3: Rival Norms.*
          *   Truth (too weak, externalist).
          *   Justified Belief (too permissive, lottery issue).
          *   Reasonable Assertibility (pragmatic, loses the constitutive punch).
      *   *Section 4: Conclusion/Advice.* Don't retreat to "idealized" assertion. Keep the norm sharp.

      *(Self-Correction during drafting)*: I need to be careful with the Lottery case. The KNA *uses* the lottery case as support (it explains why asserting your ticket lost feels wrong). The *counter* to KNA is when people say "But it's okay to assert based on statistics in other contexts (e.g., epidemiology)." I need to frame this correctly.
      *Correction:* The "Selfless Assertion" case is the real killer. In these cases, the subject lacks knowledge (by their own admission or philosophical stipulation) but the assertion is deemed appropriate.
      *Correction on Children:* The user asks if reprimanding children supports the view. Yes, it does. It shows the norm is socially enforced. I should clarify that.

      *(Refining the Immunization Point)*: The user asks if a rule nothing observable could break is a rule. Exactly. If every time someone asserts without knowledge, we say "Oh, they must have known" or "That wasn't assertion," the theory is tautological. I need to validate this fear.

      *(Structuring the Ranking)*:
      1.  Selfless Assertion (The "Turri" cases).
      2.  Asserting on Statistical Evidence (where it seems okay, e.g., public health).
