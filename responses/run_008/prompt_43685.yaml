answer: |-
  **TO:** Patient Safety Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Causal Language for Heparin Drip RCA

  Colleagues,

  We are stuck on a semantic problem that is actually a philosophical one. The Quality Office wants to assign cause; the Union wants to protect individuals from logical inconsistency; Legal wants to limit liability. All three concerns are valid.

  The Union representative raises a logically sound point regarding "but-for" causation. In an overlapping shift where responsibility is shared, neither Nurse A nor Nurse B is individually a *necessary* condition for the error. If Nurse A had acted, the harm is averted. If Nurse B had acted, the harm is averted. Because either *could* have prevented it, neither's specific omission is uniquely decisive under a strict counterfactual test. Singling out one nurse's omission as "the cause" implies the other's role was secondary, which is factually untrue.

  However, the Union's proposed wording ("contributing factors included a communication lapse") is too vague to drive change. It describes the weather, not the crash.

  **My Recommendation**

  We should adopt a **Conjunctive Causation** model. We acknowledge that while neither omission was individually sufficient to guarantee safety (given the shared duty), the *combination* of both omissions was sufficient to cause harm. The "cause" is not the individual inaction, but the *unverified assumption* that allowed both inactions to coexist.

  **1. On Naming Individuals**
  Do not name the nurses in the final report. Under Just Culture principles, this was a systemic handoff failure, not reckless behavior. Naming them invites the exact counterfactual blame game the Union opposes and discourages future self-reporting. Identify the *roles* (e.g., "Transport Nurse," "Receiving Nurse"), not the persons.

  **2. Recommended Wording Options**
  We need language that satisfies Legal (no admission of proximate cause), Quality (acknowledges the mechanism of harm), and Union (avoids individual but-for blame).

  *   **Option A (Systems-Focused):** "The patient's death resulted from a six-hour interruption in anticoagulation therapy. This interruption occurred due to a breakdown in the shift-handoff verification process, where concurrent assumptions by nursing staff led to a failure to re-initiate the drip."
      *   *Why:* "Breakdown in process" is the subject, not the nurses. "Concurrent assumptions" captures the joint nature of the error.

  *   **Option B (Cautiously Direct):** "The six-hour lapse in therapy was a substantial factor in the patient's outcome. The lapse was produced by a dual omission during shift transition, wherein established handoff protocols were not followed by either party."
      *   *Why:* "Substantial factor" is a legal standard that bypasses the strict "but-for" test. "Dual omission" acknowledges the Union's point that both were involved.

  *   **Option C (The Compromise):** "The root cause was a failure in the handoff verification loop. This allowed two independent omissions to align, resulting in a therapeutic gap that contributed to the fatal stroke."
      *   *Why:* It identifies the *loop* as the root cause, making the omissions symptoms of the system failure.

  **3. The Causal Account (For the Record)**
  To answer the question of how two non-but-for omissions kill a patient: We must move from linear causation to **configural causation**. Think of a safety circuit with two switches in parallel; the system fails only if *both* switches are open. Neither switch is solely responsible for the circuit breaking, but the *configuration* of both being open is the cause of the failure.

  In this case, the safety circuit was the handoff verification. Both nurses were switches. The report should reflect that the *circuit design* (the protocol) allowed the switches to be open simultaneously without alarm.

  **Action Item**
  I move we adopt **Option A** for the executive summary. It is precise enough for Quality, systemic enough for the Union, and avoids the word "caused" in a liability sense for Legal.

  Please review before Thursday.

  [Your Name]
