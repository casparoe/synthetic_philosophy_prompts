answer: |-
  **JOINT STATEMENT ON THE PARADOX OF PHENOMENAL JUDGMENT**

  **Date:** October 26, 2023
  **To:** Philosophy of Mind Seminar (PHIL 450)
  **From:** The Epiphenomenalist and Physicalist Working Groups
  **Subject:** Mapping Agreement and Disagreement Regarding Causal Efficacy and Phenomenal Knowledge

  ### I. Preamble

  This document represents the outcome of a structured adversarial collaboration between two factions within the seminar: the Epiphenomenalist Camp (hereinafter "E-Camp") and the Physicalist Camp (hereinafter "P-Camp," comprising identity theorists, functionalists, and Russellian monists). Our objective was not to achieve consensus, but to precisely delineate the boundary between shared commitments and substantive disagreement regarding the Paradox of Phenomenal Judgment. We affirm that this dialogue has clarified the dialectical landscape, even where metaphysical reconciliation remains elusive.

  ### II. Shared Commitments

  Both camps endorse the following propositions as the baseline for further inquiry. We reject eliminativism and agree on the structural constraints of the problem.

  1.  **The Reality of Experience (Anti-Eliminativism):** Both camps affirm that phenomenal experience (qualia) exists. We reject the view that talk of experience is merely a *façon de parler* or that subjects are systematically mistaken about the existence of their own conscious states.
  2.  **Causal Closure of the Physical:** Both camps accept the principle of causal closure: every physical event that has a cause has a sufficient physical cause. Neither camp posits a violation of physical conservation laws or a "ghost in the machine" that intervenes in neural dynamics to alter behavior.
  3.  **Systematic Correlation:** Both camps acknowledge a strict, nomological correlation between specific physical/neural states and specific phenomenal states. When a subject reports "I am in pain," a specific physical state obtains, and (according to both camps) a specific phenomenal state obtains.
  4.  **The Structure of the Paradox:** Both camps agree that the "Paradox of Phenomenal Judgment" arises from the tension between (a) the causal closure of the physical and (b) the apparent fact that we have knowledge of, and can report on, our phenomenal states. The central question is how this knowledge is possible given the causal constraints.

  ### III. Formulations of Disagreement

  The following statements capture the core divergence. Each formulation is phrased to be acceptable to its proponents without conceding the opponent's metaphysical premises.

  **A. The Epiphenomenalist Formulation**
  > "The reliability of phenomenal reports is secured by the common cause structure of the physical substrate. The neural state $N$ causes both the phenomenal state $Q$ and the verbal report $R$. While $Q$ does not causally influence $R$, the lawful connection between $N$ and $Q$ ensures that $R$ tracks $Q$ with perfect reliability. Causal efficacy is not a necessary condition for semantic reference; a reliable indicator can refer to that which it does not causally produce."

  **B. The Physicalist Formulation**
  > "The reliability of phenomenal reports requires that the phenomenal state play a causal role in the production of the report. If the phenomenal state were causally inert, the correlation between the report and the experience would be an inexplicable coincidence. For a judgment to be *about* a phenomenal state, that state must be part of the causal chain fixing the content of the judgment. Therefore, phenomenal states must be physically constituted or possess causal powers."

  ### IV. Disagreements Table

  | Issue | Epiphenomenalist Position | Physicalist Position | Neutral Statement of Issue |
  | :--- | :--- | :--- | :--- |
  | **Causal Efficacy** | Phenomenal properties are causally inert byproducts; physical properties do all the work. | Phenomenal properties are causally potent (either identical to or realized by physical properties). | Do phenomenal properties contribute to the causal production of behavior, or are they side-effects? |
  | **Nature of "Tracking"** | Tracking requires only a lawful correlation mediated by a common physical cause. | Tracking requires a direct causal link from the object tracked to the tracker. | What are the necessary conditions for a physical state to "track" or represent a phenomenal state? |
  | **Reference & Coincidence** | A report refers to experience via the physical mechanism that correlates with experience; it is not a coincidence. | A report refers to experience only if the experience causes the report; otherwise, truth is coincidental. | Does the truth of a phenomenal judgment rely on causal history or reliable correlation? |

  ### V. Cruxes and Test Cases

  We have identified two specific cruxes where our predictions diverge sharply. For each, we agree on the probative value of the case but disagree on the outcome.

  **Crux 1: The Fixation of Content**
  *Issue:* Must the content of a phenomenal judgment be fixed by the causes of the judgment?
  *   **E-Camp:** No. Content is fixed by the functional role of the physical state that correlates with the quale.
  *   **P-Camp:** Yes. Content is fixed by the causal history involving the phenomenal property itself.

  **Crux 2: The Possibility of Systematic Error in Duplicates**
  *Issue:* Could a physical duplicate of a subject be systematically wrong about her own experience?
  *   **E-Camp:** Yes. A duplicate could lack qualia entirely (a Zombie) or have different qualia, yet make identical reports, because the reports are caused by physics, not qualia.
  *   **P-Camp:** No. A physical duplicate must have identical mental states. If the duplicate reports "I am in pain," it is in pain, and that state caused the report.

  **Shared Test Case: The Diary of the Perfect Double**
  *Description:* Consider a subject, Alice, who keeps a detailed diary of her inner life. Consider "Double-Alice," a molecule-for-molecule physical duplicate of Alice existing in a world where physical laws are identical. Double-Alice writes a diary indistinguishable from Alice's.

  | Camp | Prediction regarding Double-Alice's Diary | Rationale |
  | :--- | :--- | :--- |
  | **Epiphenomenalist** | The entries in Double-Alice's diary are physically caused. If Double-Alice is a Zombie (lacks qualia), the entries claiming "I feel pain" are false, but physically inevitable. If Double-Alice has qualia, the entries are true, but the qualia did not cause the writing. | The physical state suffices for the writing. The truth value depends on the presence of the inert byproduct (qualia), which is not guaranteed by physics alone. |
  | **Physicalist** | The entries in Double-Alice's diary are caused by her mental states. Because she is a physical duplicate, she *must* have the same mental states (qualia). Therefore, the entries are true, and the mental states caused them. | Mental states supervene on the physical. To lack the mental state would require a physical difference. The report is evidence of the state's causal power. |

  ### VI. Analysis of Verbal vs. Substantive Dispute

  Upon review, we conclude that while the metaphysical disagreement is substantive, a portion of the dialectical friction is verbal, specifically concerning the definition of **"Reference"** and **"Causal Relevance."**

  **1. The Verbal Component:**
  The E-Camp utilizes a **teleosemantic or functionalist theory of reference**, where a state refers to $X$ if it is *supposed to* indicate $X$ (via evolutionary history or lawful correlation), regardless of whether $X$ causes the state token. The P-Camp utilizes a **causal-historical theory of reference**, where a state refers to $X$ only if $X$ is in the causal ancestry of the state.
  *   *Dissolution:* If we agree to distinguish *semantic reference* (what the word picks out) from *causal etiology* (what produced the word), we can agree that E-Camp allows reference without causal etiology, while P-Camp denies this is possible. The dispute then shifts to whether "knowledge" requires causal etiology.

  **2. The Substantive Component:**
  Even if terminology is standardized, a metaphysical disagreement remains regarding **Supervenience**.
  *   The P-Camp holds that the physical facts *metaphysically necessitate* the phenomenal facts.
  *   The E-Camp holds that the physical facts only *nomologically correlate* with the phenomenal facts (leaving open the logical possibility of Zombies).
  *   *Reformulation:* The debate should not focus on whether we can "talk" about qualia without them causing speech (both agree we can). It should focus on whether the *truth* of that talk is metaphysically guaranteed by the physical facts alone.

  ### VII. Conclusion

  We submit that the "Paradox of Phenomenal Judgment" is not a problem of explaining how reports are generated (both sides agree physics does this), but a problem of explaining how those reports acquire **veridical content** regarding non-physical properties without causal contact. The E-Camp accepts a form of pre-established harmony via lawful correlation; the P-Camp rejects this as implausible and insists on causal identity or realization. We recommend future seminar discussions focus on the plausibility of lawful correlation without causation as a basis for knowledge, rather than re-litigating the mechanics of speech production.

  ***

  **Signed,**

  *The Epiphenomenalist Working Group*
  *The Physicalist Working Group*
