answer: |-
  This is a sophisticated worry that cuts to the heart of contemporary metaphysics. You have essentially reconstructed Ted Sider's "Vagueness Argument" for mereological nihilism, and then identified the classic counter-worry: **If this argument kills composites, why doesn't it kill simples?**

  Your friend is right that there is a disanalogy, but their explanation ("location vs. existence") needs metaphysical fleshing out to be convincing. Meanwhile, your intuition that (2) or (3) might be the weak point in the *original* argument is shared by most defenders of common-sense ontology.

  Here is the breakdown of where the argument stands, why the generalization to simples fails, and where the original argument is most vulnerable if you wish to resist nihilism.

  ### 1. Does the Generalization to Simples Go Through?

  **Verdict:** No. The move from (6) to (7) is the breaking point. Your friend's distinction does work, but it requires a specific technical explanation regarding **quantification vs. predication**.

  The original argument (1–5) turns on the idea that mereological vagueness creates vagueness in the **domain of quantification** (how many things are there?).
  *   **Composition Case:** If it is indeterminate whether the quarks compose a proton, it is indeterminate whether the universe contains $N$ objects (just the quarks) or $N+1$ objects (the quarks plus the proton). The *count* itself is fuzzy. This violates (4).

  The simples objection (6–9) turns on **property vagueness** (where are the things?).
  *   **Quantum Case:** If an electron has a spread-out wavefunction, it is indeterminate *where* the electron is. However, in standard non-relativistic quantum mechanics, it is **not** indeterminate *that* the electron is. The theory posits exactly one electron in the system; its position operator yields a probability distribution, but the particle number operator yields a definite value (1).
  *   **Why (7) Fails:** Premise (7) claims: *If it is indeterminate whether a region contains an electron, it is indeterminate... how many electrons exist.*
      *   This conflates "Is there an object in region $R$?" with "Does an object exist?"
      *   Consider an analogy: It is indeterminate whether John is in the room (he is standing in the doorway). It does **not** follow that it is indeterminate whether John exists, nor that it is indeterminate how many people exist in the world. The census is stable; the map is fuzzy.
      *   Premise (4) bans a "fuzzy census." It does not ban a "fuzzy map." Quantum mechanics gives us a fuzzy map of precise entities (on most interpretations compatible with nihilism).

  **The Cost for the Nihilist:** To maintain this line, the nihilist must commit to a metaphysics of quantum mechanics where particle number is determinate even if position is not. This is tenable in Bohmian mechanics or certain collapse theories, but harder in standard Quantum Field Theory (where particle number can be superposed). However, for the purpose of the *mereological* argument, the distinction between **count indeterminacy** (fatal) and **property indeterminacy** (survivable) is sufficient to block the reductio against simples.

  ### 2. Which Step of the Original Argument is Weakest?

  If you wish to resist nihilism (i.e., save composite objects like tables and protons), you must break the chain at (2) or (3). Premise (4) is the engine; if you keep (4), you must stop the vagueness from arising.

  #### The Primary Target: Premise (2)
  > *(2) If composition ever occurs, then it is sometimes indeterminate whether it occurs.*

  **Why it looked fine:** This relies on the intuition that nature contains no "sharp cutoffs." It seems arbitrary to say composition occurs at arrangement $A$ but fails at arrangement $A$-minus-one-atom. This is the classic Sorites intuition.

  **How to reject it:** You can accept that composition occurs but deny that this entails vagueness. There are two main strategies:

  1.  **Epistemicism (e.g., Timothy Williamson):** There *is* a sharp cutoff in the Sorites sequence. There is a precise moment when adding one more quark makes a proton exist. We cannot know where it is, and there are no semantic rules that fix it, but it is metaphysically precise.
      *   *Cost:* You must accept brute, unknowable facts about reality. Many find this implausible, but it preserves (4) and saves composites.
  2.  **Brutal Composition (e.g., Ted Sider):** Composition is a fundamental, unanalyzable fact. It is not determined by spatial arrangement or causal bonding. Therefore, there is no Sorites sequence generated by varying arrangement, because arrangement doesn't *constitute* composition.
      *   *Cost:* You lose the explanatory link between how things are arranged and what objects exist. It makes composition "magical" or brute.

  #### The Secondary Target: The Link between (3) and (4)
  > *(3) If it is indeterminate whether some things compose a further object, then it is indeterminate how many concrete objects exist.*

  **Why it looked fine:** If there's a new object, the count goes up. If it's vague whether there's a new object, the count is vague.

  **How to reject it:** **Semantic Vagueness.**
  You can argue that the vagueness is not in the *world* (ontic), but in our *concepts* (semantic).
  *   **The Move:** The world contains a precise arrangement of simples. Our word "proton" is vague. It is indeterminate whether our *word* applies to this arrangement, but it is **not** indeterminate whether the *world* contains a composite object, because "composite object" is just a way of talking about the simples arranged that way.
  *   **The Problem:** This effectively softens (4). If you say "The world is precise, only our language is fuzzy," you are accepting a version of (4) that allows linguistic vagueness. The original argument assumes (4) bans *ontic* vagueness. If you take this route, you are essentially saying the "fuzzy census" is only a feature of our description, not reality.
  *   *Cost:* You must adopt a deflationary view of existence. Objects don't "exist" in a heavy metaphysical sense; they are just conceptual ways of indexing simples. This is close to nihilism anyway ("there are no composite objects, only simples arranged table-wise").

  ### 3. Recommendation

  You stated you are inclined to keep (4). If you hold (4) firmly (no ontic vagueness in the census of the world), you have two coherent paths:

  1.  **Stay a Nihilist:** Accept the original argument (1–5). Block the Simples Objection by insisting on the **Count vs. Location** distinction (rejecting 7).
      *   *Requirement:* You must ensure your physics allows for determinate particle counts (avoiding QFT states with indeterminate particle number, or interpreting them epistemically).
      *   *Benefit:* Metaphysically parsimonious; solves the Sorites cleanly.
      *   *Cost:* Error theory about everyday speech ("There is a table" is strictly false).

  2.  **Become an Epistemicist/Brutalist about Composition:** Reject (2). Claim composition is precise, even if we can't locate the cutoff.
      *   *Requirement:* Accept sharp cutoffs in nature.
      *   *Benefit:* Saves common sense objects ("There is a table" is true).
      *   *Cost:* Accepts brute modal facts or unknowable boundaries.

  **My Advice:**
  The generalization to simples **does not go through**. Your friend's distinction is valid because **vagueness in properties (location) does not entail vagueness in quantification (existence count)** unless the object's identity is *constituted* by that location. Since electrons are not defined merely as "occupants of region R," their location vagueness does not threaten their existence count.

  Therefore, the Nihilist position is stable against the Simples Objection.

  However, if you find Nihilism too audacious, the weakest step in the original chain is **(2)**. It assumes that *Restrictivism* (composition sometimes happens) inevitably leads to vagueness. By adopting **Epistemicism**, you can claim composition is precise, thereby satisfying (4) without eliminating composite objects. This is the standard "conservative" response to Sider's argument. It pays the price of arbitrariness, but it saves the furniture of the world.

  **Summary of the Equivocation:**
  You suspected an equivocation between "indeterminate whether composition occurs" and "indeterminate how many objects there are." There isn't one *if* composition is ontologically robust. But there *is* an equivocation in the Simples Objection between "indeterminate whether an object is *here*" and "indeterminate whether an object *exists*." The former is compatible with a precise census; the latter is not. That is where the chain breaks.
