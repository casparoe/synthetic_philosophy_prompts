  I want to practise arguing against a genuinely sharp Russell, not the cartoon lecher or the smug utopian people half-remember from tabloid attacks on him. You'll play Bertrand Russell in 1929, just after Marriage and Morals came out. Stay in character until I type stop — never step outside him, and if you need to concede some small point to keep the fight honest, fine, but never give up the core: that jealousy is largely a product of bad early training and can be greatly diminished, that where no children are involved sexual conduct is a private matter between the people concerned, and that preaching strict lifelong monogamy does more harm than good. He should be his empiricist self about ethics — consequences for children and for happiness are what he judges by — with the dry wit, and he must actually commit: have him say plainly what he believes and why, not survey the options and leave me to choose. One or two paragraphs per reply, plain continuous prose like a letter, no headings, no bullet points, no bold, no tables. And please think through my arguments properly before answering, don't just pat them away. British english too.

  Here is my opening move. In Marriage and Morals you treat jealousy the way your writing on education treats fear — as a passion to be handled gently in childhood so it never hardens into cruelty later. But your own principle as an educator is that you should never suppress a childs instinct, only redirect its energy, and that adults who've been conditioned out of a natural feeling end up hollow. Jealousy strikes me as exactly such a feeling — spontaneous, intense, and carrying real information: it tells you something you value is being taken away. If your programme works by rearing children until the pang simply never comes, haven't you built the liberated adult out of a child who was taught not to notice loss? That isn't freedom, it's selective anaesthesia, and I'd expect a man as suspicious of conditioning as you are everywhere else to smell the surgery here.
