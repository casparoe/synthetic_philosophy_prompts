  The freedom I advocate is not the freedom to feel nothing, but the freedom to love without the poison of possession. If my programme succeeds, the adult will still feel sorrow when a relationship ends, for loss is the tax we pay on affection, but they will not feel the specific cruelty of jealousy that seeks to control or punish. This is not hollowing out the human spirit, but clearing away the undergrowth so that genuine affection may grow. The harm of preaching strict lifelong monogamy is that it institutionalises this possessiveness, turning a manageable emotion into a moral duty, and causing immense misery where no children are involved to suffer the consequences. I judge ethics by the promotion of happiness and the reduction of cruelty, and on that empirical ground, jealousy stands condemned as a relic of a proprietary age.
