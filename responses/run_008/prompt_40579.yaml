      *   **Context:** A debate between the user and a friend. The friend argues for "inefficacy" (individual actions don't change outcomes in threshold/chaos systems). The user is less interested in empirical efficacy and more interested in the *philosophical presuppositions* of the practice itself.
      *   **Specific Questions to Address:**
          1.  What does the practice presuppose about the structure of collective harm (fungible shares, probability raisers, symbolic clean hands)?
          2.  Is the practice internally consistent given the conflicting stances of airlines and NGOs?
          3.  Why does "vote offsetting" feel absurd while "carbon offsetting" feels natural? Is it physical fungibility or something else?
          4.  How would the practice change under strict inefficacy vs. expected-value consequentialism? Would the checkbox survive?
      *   **Goal:** Provide a reconstructed theory, identify philosophical underdetermination, and deliver a verdict on whether the friend's objection defeats the practice's self-understanding.
      *   **Constraint:** No need for specific citations, focus on arguments and positions.

  2.  **Initial Brainstorming & Concept Mapping:**

      *   *The Practice:* Buying a "carbon neutral" label at checkout.
