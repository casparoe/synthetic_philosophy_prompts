answer: |-
  This is a sophisticated package. You are effectively advocating for a robust **Type-B Physicalism** that combines the **Phenomenal Concept Strategy (PCS)** with the **Ability Hypothesis**, while attempting to preserve the "hardness" of the Hard Problem via Commitment 7.

  You asked for an audit, not a pat on the back. I have brainstormed the pairwise conflicts below. While there are several friction points, one stands out as potentially fatal to the coherence of the view.

  Here is the audit, ranked by severity.

  ### 1. The Fatal Tension: Straight Physicalism (1) vs. Substantive Gap (7)
  **Severity:** Critical
  **Confidence:** 95%

  **The Conflict:**
  Commitment 1 states: "Every fact about experience is a physical fact."
  Commitment 7 states: "The explanatory gap is... a substantive fact about consciousness itself, not just a fact about how our concepts happen to work."

  These two claims are ontologically incompatible. If the explanatory gap were merely a fact about our concepts (the standard Type-B move), Physicalism (1) remains secure: the world is physical, but our cognitive architecture represents it in two incommensurable ways.

  However, by asserting in (7) that the gap is a *substantive fact about consciousness itself*, you are conceding that physical descriptions leave out something *in the world*, not just in our mode of presentation. If there is a fact about consciousness that is substantive and not captured by the "complete neuroscience" Mary possesses (2), then by definition, not every fact about experience is a physical fact. You are effectively asserting Property Dualism while labeling it Physicalism. You cannot claim the gap is "permanent" and "substantive" regarding the *target* (consciousness) while maintaining the *source* (physical facts) is exhaustive.

  **What Would Have to Give:**
  You must soften (7). The gap must be described as a permanent *epistemic* or *conceptual* feature of human cognition, not a substantive feature of consciousness itself.

  ### 2. The Super-Mary Tension: Ability Hypothesis (5) vs. Super-Mary Verdict
  **Severity:** High
  **Confidence:** 85%

  **The Conflict:**
  Commitment 5 runs the Ability Hypothesis ("What she gains is abilities — to recognize, imagine, remember").
  The Super-Mary verdict states: "Super-Mary still doesn't know what red looks like before release."

  The Ability Hypothesis traditionally identifies "knowing what it's like" *with* possessing certain abilities (recognitional, imaginative). In your Super-Mary case, you stipulate she has a "perfect physical self-model" and can "predict her own future reports with total accuracy."

  If she can accurately predict her reports (e.g., "I am seeing red now"), she functionally possesses the recognitional capacity. She can distinguish the state from others via her simulation. If the Ability Hypothesis is true, and she has the abilities (via simulation/prediction), she *should* know what it's like. Your verdict says she doesn't.

  This suggests you are actually relying more heavily on the **Phenomenal Concept Strategy (PCS)** than the Ability Hypothesis. The PCS says she lacks a specific *concept* (the demonstrative) that requires acquaintance. But if you lean too hard on PCS to save the Super-Mary verdict, you undermine the Ability Hypothesis component of (5). You are claiming she gains abilities in (4), but your Super-Mary case implies that having the abilities (simulation/prediction) isn't sufficient for the knowledge.

  **What Would Have to Give:**
  You need to clarify the definition of "ability." You must argue that Super-Mary's simulation is *not* the relevant ability. The relevant ability must be tied to *acquaintance* (a causal link). But if you tie it to acquaintance, you risk making the ability non-physical (see Tension 1). The cheapest repair is to demote the Ability Hypothesis to a secondary role and admit PCS is doing the heavy lifting for the Super-Mary case.

  ### 3. The Zombie/Gap Tension: Zombie Intuition (6) vs. Substantive Gap (7)
  **Severity:** Medium
  **Confidence:** 80%

  **The Conflict:**
  Commitment 6: Zombie intuition is pure confusion (implies consciousness is metaphysically necessitated by the physical).
  Commitment 7: The gap is substantive and permanent.

  This is the classic Type-B tightrope walk. It is *possible* to hold both, but it requires precise wording. If the gap is "substantive about consciousness" (7), it invites the intuition that consciousness could float free of the physical (i.e., zombies). If you deny zombies (6), you are claiming a necessary connection. If the connection is necessary, why is the gap "substantive" and "permanent"?

  Usually, Type-B physicalists say the gap is permanent *epistemically* but not *metaphysically*. Your wording in (7) ("substantive fact about consciousness itself") blurs this line. It suggests the gap reflects the metaphysics, which makes the denial of zombies (6) look dogmatic rather than argued.

  **What Would Have to Give:**
  Again, (7) is the weak link. If you frame the gap as a permanent feature of our *epistemic access* rather than consciousness *itself*, (6) becomes much easier to defend (Kripkean necessary a posteriori identities).

  ### 4. The "Learns Something" Tension: Core Intuition (3) vs. No New Fact (4)
  **Severity:** Low
  **Confidence:** 90%

  **The Conflict:**
  Commitment 3: She learns something.
  Commitment 4: She doesn't come to know any new fact or proposition.

  **Analysis:**
  This is not a genuine logical conflict, but a linguistic one that you have already anticipated with the PCS/Ability package. As long as you distinguish "propositional knowledge" (knowledge-that) from "non-propositional knowledge" (knowledge-how / acquaintance), this holds together. The only risk is if your opponents argue that "learning something" *entails* "learning a fact."

  **Repair:**
  No repair needed, but be prepared to defend the distinction vigorously. This is standard PCS territory.

  ---

  ### The Single Revision That Cleans Up the Most

  **Revision:** **Rewrite Commitment 7.**

  **Current:** "The explanatory gap is real and permanent. No amount of neuroscience, ever, not even in principle, will close it — and I take that to be a substantive fact about consciousness itself, not just a fact about how our concepts happen to work."

  **Proposed:** "The explanatory gap is real and permanent. No amount of neuroscience, ever, not even in principle, will close it — and I take that to be a **substantive fact about our cognitive architecture and conceptual repertoire**, not a fact about consciousness itself."

  **Why this fixes it:**
  1.  **Saves Physicalism (1):** If the gap is about *us* (concepts), not *it* (consciousness), then physical facts can still exhaust the ontology.
  2.  **Saves Super-Mary:** Super-Mary has the physical facts but lacks the specific *conceptual architecture* (the demonstrative concept grounded in acquaintance) that humans deploy upon release. The gap is in the *access*, not the *object*.
  3.  **Saves Zombie Denial (6):** If the gap is conceptual, zombies are conceivable (conceptually) but not metaphysically possible. This is the standard, defensible Type-B position.
  4.  **Cost:** You lose the "mysterious realist" flair of claiming the gap is in the world. You have to admit the "Hard Problem" is a "Hard Problem of Human Cognition." Some find this deflationary. But it is the only way to keep (1).

  ### Confidence & Uncertainty

  **Overall Confidence:** High that (1) and (7) as currently written are incompatible.

  **Point of Least Confidence:**
  I am **least sure** about your specific definition of "substantive" in Commitment 7.
  *   *Possibility A:* You mean "ontologically robust" (i.e., there is a real feature of the world that physicalism misses). If so, my audit holds: you are a dualist.
  *   *Possibility B:* You mean "epistemically robust" (i.e., the feeling of the gap is not an illusion, even if the ontology is physical). If you mean B, then (1) and (7) are compatible, but your wording is dangerously ambiguous and will be exploited by opponents in the workshop.

  **Recommendation:**
  Assume your audience will interpret "substantive fact about consciousness itself" as Possibility A. Even if you mean B, the wording invites the charge of inconsistency. Shift the "substantiveness" from the *consciousness* to the *epistemic relation*.

  **Final Verdict on Super-Mary:**
  The Super-Mary case is a strong addition *if* you fix Commitment 7. It isolates the "acquaintance" requirement of the Phenomenal Concept Strategy. However, be careful: if Super-Mary can simulate the *output* perfectly, opponents will argue she has the *functional role* of the concept. You must be ready to argue that phenomenal concepts are not purely functional; they require a specific *causal history* (the actual seeing) that simulation cannot replicate. This aligns with the "impure" PCS view.

  **Summary for the Workshop:**
  If you send this out with Commitment 7 as written, you will be eaten alive on the contradiction between "Straight Physicalism" and "Substantive Fact about Consciousness." Fix (7), and you have a defensible, standard Type-B Physicalist position with a nice Super-Mary variant. Keep (7), and you are a dualist pretending to be a physicalist.
