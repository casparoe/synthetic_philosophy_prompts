      *Wait, let's re-evaluate the "Corrupted Faculty" objection.* If the thesis is that the *act* is always available, but Epictetus says the *prohairesis* can be enslaved, that's a direct textual conflict. This might be higher damage than Regress. Let's swap 1 and 2. Actually, Regress is more logical, Corrupted Faculty is more textual. For an Epictetus expert, Textual is king. Let's put Corrupted Faculty first.
