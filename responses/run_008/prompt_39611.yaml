          *   Theory C: Habit/Routine (Bureaucracy works).
          *   Theory D: Peer Pressure (Social norms).
      *   *Problem:* You can't look at compliance rates and know *which* mechanism is driving it. This makes it hard to know if the oath is just theatre or if the audits are actually necessary.
      *   *Implication:* The system might be over-invested in enforcement if identity is the real driver, or vice versa.

  6.  **Address Question 4: Structural Redesign (If Glaucon is Wrong):**
      *   *Premise:* If we believe people are intrinsically motivated by justice (Socratic), current enforcement is insulting/unnecessary.
