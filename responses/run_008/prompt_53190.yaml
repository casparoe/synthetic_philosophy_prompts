      *   **Request:** Predict verdict, analyze candidate rules, give best guess with reasons, and propose a "crucial experiment" case to distinguish rules. Open to having the question reframed if the premise is flawed.

  2.  **Deconstruct the Professor's Verdicts (Aristotelian Analysis):**
      *   *Verdict 1 (Fisherman/Farmer):* Classic *oikonomia* (household management). Direct use-value exchange. No money necessarily involved. Natural.
      *   *Verdict 2 (Retailer):* Classic *kapelike* (retail trade). Aristotle explicitly condemns this in *Pol.* I.10 as the most unnatural because it divorces exchange from need and makes it about profit. The professor emphasizes "even though customers need goods." This suggests *intent* matters more than *outcome*.
      *   *Verdict 3 (Usury):* Classic *tokos* (interest). Aristotle hates this most of all. Money breeding money. No natural limit.
      *   *Verdict 4 (Potter):* This is the tricky one. The Potter is a producer (*technites*), not just a trader. He sells for money, but the *end* is household sustenance, not infinite accumulation. The price covers needs, even if > material cost. This aligns with *oikonomia* using market means.

  3.  **Evaluate the User's Two Rules:**
      *   *Rule A (Need/Teleology):* Focuses on the *telos* (end) of the transaction. Is it to satisfy household need (*oikonomia*) or infinite accumulation (*chrematistike*)?
          *   Fits V1 (Need), V2 (Profit), V3 (Money breeding), V4 (Need).
          *   Prediction for Dealer: Condemned. Why? Because he buys *to sell*, not to consume. He is engaging in trade for profit, even if the profit is used for needs later. The *activity itself* is speculative trade.
      *   *Rule B (Contribution/Proportionality):* Focuses on reciprocity (*antipeponthos* in NE V.5). Is the return equal to the worth contributed?
