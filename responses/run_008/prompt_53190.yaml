          *   Struggles with V2: The retailer *does* contribute service (transport/convenience), yet is condemned. The professor specifically said "even though customers genuinely need the goods." This implies the service doesn't save the retailer.
          *   Struggles with V3: Usury involves risk (default), yet condemned.
          *   Prediction for Dealer: Acquitted (Risk/Storage = Contribution).
      *   *Comparison:* Rule A fits the *Politics* distinction (Natural vs. Unnatural Wealth-Getting) much better than Rule B fits the *Retailer* verdict. Aristotle is notoriously skeptical of trade *as such*, regardless of service provided.

  4.  **Identify the Core Tension (The "Potter" Problem):**
      *   The Potter sells for money. The Retailer sells for money. Why is Potter OK and Retailer Bad?
      *   *Aristotle's distinction:* The Potter creates value (*techne*). The Retailer merely moves it.
      *   *The Grain Dealer:* He does *not* create value (like the Potter). He moves it across *time* (like the Retailer moves it across space).
      *   *Key Question:* Is storage/transport across time considered "production" (adding value) or "trade" (mere exchange)?
      *   *Aristotelian View:* Generally, agriculture is natural. Trade is unnatural. Storage is part of household management (*oikonomia*) if it's *your own* surplus. But buying *to* store *to* sell is trade.
      *   *Professor's Clue:* The Retailer verdict is harsh. "Even though customers need goods." This kills the "social utility" defense. The Grain Dealer provides social utility (smoothing supply), but if the Retailer is condemned despite utility, the Dealer likely is too.

