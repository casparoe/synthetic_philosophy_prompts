      *   *Move 5:* Dana is right. Coasean solutions fail for inalienable rights and distributional issues. *Edge: Dana.*

      *   *Overall:* Dana seems to win on the philosophical/normative implications. Marcus wins on the mechanical diagnosis and potential (limited) workarounds.

  4.  **Identify What They Are Missing:**
      *   **Form vs. Substance:** They are arguing about outcomes, but Sen's point is often about the *form* of rights (game forms vs. social choice functions).
      *   **The "Liberal" in Liberal Paradox:** Sen wasn't attacking liberalism; he was refining it. He suggested "rights as goals" vs. "rights as constraints."
      *   **Welfarism:** Both accept the welfarist framework (preferences = utility). Sen later critiqued welfarism itself.
      *   **The "Game Form" Approach:** Robert Nozick or Gibbard might say rights define the *rules of the game*, not the *social outcome*. Marcus touches on this, but Dana shuts it down too quickly.

  5.  **Identify Uncertainty & Flip Conditions:**
