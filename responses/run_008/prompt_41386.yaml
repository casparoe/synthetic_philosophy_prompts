answer: |-
  **MEMORANDUM**

  **TO:** Prehistory Gallery Interpretive Panel
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Axe Deposit Display Case (Case 14)

  **Purpose**
  With four months remaining until opening, we must resolve the deadlock regarding the polished axe deposit. This memo proposes a specific text and visual strategy for Case 14. The goal is to navigate between the risk of over-interpretation (inventing institutions we cannot prove) and the risk of under-interpretation (presenting raw data that obscures the human behavior evident in the soil).

  **Recommendation Summary**
  I recommend we adopt a "Comparative Context" approach. We will explicitly contrast the deposit axes with the settlement axes in the label text, reject the figurative reconstruction of people in favor of a stratigraphic diagram, and link the burial to the deposit through proximity and object type without assigning a specific social title.

  **1. Proposed Label Text**
  *Current Draft (Curator):* "A Shrine to the Stone. Ritual specialists placed these perfect axes here to honor the ancestors. The nearby burial holds a Priest of the Axe."
  *Current Draft (Skeptic):* "Pit Deposit. Forty polished stone axes were buried here. They show no use-wear. One similar axe was found in a grave."

  *Proposed Compromise Text:*
  > **The Axe Deposit**
  > Excavators found forty polished stone axes packed tightly in this pit, sealed beneath burnt earth. Unlike the axes found in the nearby settlement—which are chipped, ground down, and repaired—these show no sign of use. They were made to the same high standard as working tools, but they were never swung.
  >
  > Why bury them? In many societies, objects removed from everyday use mark special events, agreements, or offerings. We cannot know the specific ceremony, but the care taken to bury them suggests they held a value beyond cutting wood.
  >
  > **The Burial**
  > A few meters away, a single adult was buried with one of these unused axes. While we cannot name their role, this pairing suggests a person of specific significance, linked to the group who prepared the deposit.

  **2. Visual Strategy (Reconstruction Drawing)**
  *Recommendation:* **Reject** the proposed illustration of robed figures placing the axes. **Commission** a split-view diagram:
  *   **Left:** A stratigraphic cross-section of the pit showing the axes and the burnt layer (factual record).
  *   **Right:** A comparative image of a "working" axe from the settlement (magnified edge showing wear) next to a "deposit" axe (smooth edge).
  *   **Reasoning:** The robed figures impose a specific costume and social hierarchy that is pure fiction. However, a diagram comparing the *edges* of the tools makes the physical evidence (wear vs. no wear) visible to the visitor, allowing them to see the basis for our interpretation.

  **3. Handling the Burial**
  *Recommendation:* Link the burial to the deposit via a "See Also" reference or the shared text above, but **do not** use the word "Priest." Use "Person of Significance."
  *   **Reasoning:** The spatial proximity and the uniqueness of the grave good imply a connection. However, "Priest" implies a formalized religious office that may not have existed. "Person of Significance" acknowledges the differential treatment in death without defining the nature of their authority.

  **Reasoning and Engagement with Panel Concerns**

  **To the Lead Curator (Addressing the "Ritual" Argument):**
  Your position rightly identifies that visitors need a narrative hook. A label that refuses to speculate can feel sterile, failing to convey that *something meaningful happened here*. You are correct that cross-cultural analogy suggests non-utilitarian deposition is rarely accidental; it usually signals social or cosmological action.
  *However:* By specifying "robed figures" and "Priest," we move from *analogy* to *invention*. If future research or peer review challenges the "shrine" classification, the museum's credibility suffers. We can convey the *weight* of the action (deliberate, valuable, special) without locking ourselves into a specific institutional structure (shrine/priest) that the soil cannot confirm.

  **To the Skeptic (Addressing the "Descriptive" Argument):**
  Your position rightly guards against the "ritual" label becoming a catch-all for things we don't understand. You are correct that calling this a "shrine" projects a modern category of religion onto prehistoric behavior.
  *However:* The proposal to label these merely as "unused tools" is not neutral. It assumes the objects were *intended* as tools that simply weren't used. As our third panelist noted, this smuggles in a "tool paradigm." If they were made specifically for deposition, they were never "unused tools"; they were "deposit objects." A purely descriptive label hides the mystery. It tells the visitor *what* is there, but suppresses the *problem* of why it is there. Our job is to present the problem, not just the inventory.

  **Judgment Calls**
  Please note the following areas where this recommendation relies on interpretation rather than strict deduction:
  1.  **[Judgment Call]:** The label text states they were "made... but never swung." This infers intent from the lack of wear. It is possible they were used on soft material that left no trace, though unlikely given the polish.
  2.  **[Judgment Call]:** Linking the burial to the pit. While they are meters apart and share an object type, we cannot prove the person buried was involved in the deposit. The text "linked to the group" is a probabilistic inference, not a fact.
  3.  **[Judgment Call]:** The phrase "value beyond cutting wood." This assumes the alternative value is social/symbolic. It is the most speculative line in the text, but necessary to explain why unused items are worth displaying.

  **Next Steps**
  If approved, I will work with the design team to commission the stratigraphic/comparative diagram immediately, as this is the longest lead-time item. Text edits can be finalized in the next session.

  ***

  **Assessor's Note on Confidence**
  I am **highly confident** in the recommendation to reject the figurative reconstruction of robed figures; the evidentiary gap there is too wide to defend publicly. I am **moderately confident** in the proposed label text, as it balances engagement with accuracy. I am **least sure** about the reasoning step linking the burial to the deposit (Judgment Call #2). While the proximity is suggestive, it is the weakest link in the chain of inference, and we should be prepared to soften that connection if new comparative data emerges before opening.
