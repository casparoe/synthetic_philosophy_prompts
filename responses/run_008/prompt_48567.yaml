prompt: |-
  I've been going down a rabbit hole on Lewis's triviality results for indicative conditionals, and I want to make sure I actually understand what they do and don't show, and what follows for normal people reasoning with if-statements.

  My rough understanding: if you assume the probability of "if A, then C" always equals the conditional probability P(C|A) — the thing everyone informally does when they say things like "there's an 80% chance the picnic happens if it doesn't rain" — then Lewis showed you can't treat that conditional as an ordinary proposition that's true or false, unless the world is boring in some way (like A and C being probabilistically independent, or C having probability 0 or 1). So the probability of a conditional can't systematically equal the conditional probability, on pain of triviality.

  What I want from you: the most important implications of this. In particular, does it mean that when my doctor tells me "if you take these antibiotics, you'll most likely feel better within a week," she isn't really asserting a proposition with a truth value at all, but something more like a conditional probability or a disposition to infer? What happens to Ramsey-test style reasoning and betting on conditionals — can I still coherently put money down on "if A then C"? And what does the result push us toward: treating conditionals as having no truth values at all, or three-valued truth, or some other story? I'd especially like implications for everyday probabilistic reasoning, not just for formal semanticists — like, is the common practice of going from P(C|A) straight to "the probability that if A then C" a mistake I should stop making, or is it fine as long as I don't build a whole theory on it?

  Also, be upfront about how confident you are in the different parts of your answer, and single out the claim you're least sure about — I suspect some of this stuff (like exactly how strong the triviality results are, or which escape route is most popular now) is more contested than it looks.
