answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Automated Detection Proposal

  We are voting in three weeks on whether to institutionalize the use of automated detection software for contract cheating and unauthorized AI use. The proposal before us is a hybrid model: the software flags submissions, and a faculty reviewer confirms the flag before charges are filed. The administration argues this keeps a "human in the loop." My purpose in this memo is to argue that without significant conditions, this model does not preserve human agency; it launders it.

  I recommend we **adopt the proposal only with strict conditions regarding explainability and reviewer capacity.** If these conditions cannot be met, we should reject the system.

  I want to address the strongest arguments for adoption first. Several colleagues have noted the pilot's accuracy numbers are decent, and the scale is something human panels cannot match. Another colleague correctly pointed out that human detection is inherently biased and inconsistent. We know that human graders often disproportionately flag non-native speakers or students they perceive as difficult. If this system reduces that bias, it is a moral good. I am not arguing that human judgment is infallible. It is not.

  However, accuracy statistics alone cannot justify the procedure. In academic integrity, a false positive is not a mere statistical error; it is an accusation that can derail a student's career. When a human professor accuses a student, they stake their professional reputation on that judgment. They can be asked *why* they suspect cheating. They can point to stylistic shifts, specific errors, or contextual knowledge. If they are wrong, they can be corrected, and they bear the moral weight of that error.

  The "Responsibility Gap" arises when we insert a black box into this chain. In the proposed hybrid model, the faculty reviewer is presented with a confidence score and highlighted text. They are expected to clear hundreds of these a week. They cannot independently verify the system's reasoning because the vendor cannot explain it beyond probability. Consequently, the reviewer is not actually judging the evidence; they are ratifying the algorithm.

  This creates a scenario where accountability vanishes. If we expel an innocent student because the system flagged them and the reviewer rubber-stamped it, who is responsible? The vendor will point to the faculty signature. The faculty member will point to the system's high confidence score. The Committee will point to the policy. The student is left with no one to appeal to, because no one actually made a defensible judgment. The "human in the loop" becomes a designated blame-absorber, insulating the university from liability while stripping the faculty member of agency.

  This brings me to the question I have struggled to answer in discussion: *If the machine is more accurate than the human, why prefer the imperfect human?*

  The answer is that we are not just optimizing for error rates; we are optimizing for *answerability*. We prefer human judgment because humans can give reasons. A human can say, "I was wrong, and here is how I will adjust my judgment." An algorithm cannot. When we choose the machine, we are choosing a system that may be more consistent but is fundamentally unaccountable. We are trading the possibility of human error for the certainty of administrative opacity.

  Therefore, I propose we vote to **Adopt with Conditions.** We must close the responsibility gap before we deploy. Specifically:

  1.  **Explainability Standard:** The vendor must provide a level of explainability sufficient for a human to form an independent judgment. Heat maps and confidence scores are not evidence; they are assertions. If the vendor cannot provide linguistic or metadata reasoning that a faculty member can evaluate, the flag cannot serve as the basis for a charge.
  2.  **Workload Caps:** Reviewers cannot be expected to genuinely evaluate flags if they are assigned them at an industrial scale. We must cap the number of flags a reviewer can process per week to ensure they have time to read the work in context. If we demand speed, we admit we want rubber stamps, not reviewers.
  3.  **Burden of Proof:** The policy must explicitly state that a system flag is *not* evidence of misconduct. It is merely a tip that justifies an inquiry. The faculty reviewer must find independent evidence in the text to support the charge. If they cannot find it, the flag must be discarded without penalty to the student.

  If the vendor cannot meet the explainability standard, or if the administration will not fund the reviewer time required to meet the workload caps, we must reject the system. To do otherwise is to build a disciplinary apparatus where the university retains the power to punish but relinquishes the ability to explain why.

  We have a choice between a system that is scalable but opaque, and one that is labor-intensive but accountable. I urge the committee to choose accountability.

  [Your Name]
  Professor of Philosophy
