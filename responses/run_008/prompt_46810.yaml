prompt: |-
  i'm a philosophy professor serving on my university's academic integrity committee, and we're about to vote on something I have real qualms about, so I want a draft memo I can circulate beforehand.

  The situation: we've been piloting an automated system that flags suspected contract cheating and unauthorized AI use in coursework. It operates at a scale no human panel could — it screens thousands of submissions — and its accuracy numbers in the pilot looked genuinely decent. But it's a black box in an important way: even the vendor can't give a reason for an individual flag that's more specific than the system assigning that submission a high probability. The proposal on the table is a hybrid model: the system flags, and then a designated faculty reviewer confirms each flag before charges go forward. The selling point is that this keeps a human in the loop and therefore keeps responsibility where it belongs.

  Here's my worry, and I want the memo to take it seriously rather than treat it as philosophy-professor hand-wringing. When a human grader accuses a student, there's someone who made a judgment and can answer for it — can explain why, defend it, be shown to be wrong, and feel the weight of wrecking someone's semester if they were careless. If our reviewer is just ratifying flags they can't independently verify — they see a confidence score and a few highlighted passages, and they're expected to clear a hundred flags a week — then the human in the loop looks less like a responsible agent and more like a designated blame-absorber. And when we eventually expel a student who was innocent, or let a cheater through because the system missed them, it's not clear anyone answers for it: the vendor points to the reviewer, the reviewer points to the system, the comittee points to the policy. Philosophers call this kind of thing a responsibility gap, and I want the memo to actually reckon with whether the hybrid proposal closes the gap or just launders it.

  Please draft the memo. It should recommend a concrete decision — adopt as proposed, adopt with conditions (say which ones), or reject and propose an alternative — and give reasons the rest of the comittee could actually respond to. Several of them think the accuracy numbers speak for themselves, and one has pointed out, fairly, that human detection of cheating is itself biased and inconsistent, which the system might improve on; she deserves a real answer, not a pat on the head. Also please address the question I keep getting asked and keep fumbling: if we reject the system, are we really saying imperfect human judgment is more acceptable than better-performing machine judgment, and if so, why? Something I can circulate, maybe 900 words, and no gesturing at needing more study — we vote in three weeks.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Philosophy Professor on University Academic Integrity Committee.
      *   **Task:** Draft a memo to circulate before a vote on a new academic integrity policy involving automated cheating detection.
      *   **Context:** The university is piloting an automated system (black box) for contract cheating/AI use. It scales well and has decent accuracy.
      *   **Proposal:** Hybrid model (System flags -> Faculty reviewer confirms -> Charges proceed).
      *   **Core Concern:** The "Responsibility Gap." The human reviewer becomes a "blame-absorber" rather than a responsible agent because they can't independently verify the black box's reasoning. This launders responsibility rather than closing the gap.
      *   **Audience:** Committee members (some focused on accuracy stats, one focused on reducing human bias/inconsistency).
      *   **Requirements:**
          *   Take the philosophical concern seriously (not hand-wringing).
          *   Recommend a concrete decision (Adopt, Adopt with Conditions, or Reject/Alternative).
          *   Address the "accuracy speaks for itself" argument.
          *   Address the "human bias vs. machine consistency" argument.
          *   Address the "imperfect human vs. better machine" question.
          *   No "needs more study" delays (vote in 3 weeks).
          *   Length: Approx. 900 words.

  2.  **Determine the Stance/Recommendation:**
      *   The prompt implies the professor has "real qualms." A flat rejection might be politically dead on arrival given the "decent accuracy" and "scale" arguments. A flat adoption ignores the ethical core.
      *   *Best Path:* **Adopt with Strict Conditions.** This acknowledges the utility (scale/consistency) but mitigates the responsibility gap. It forces the vendor or the process to change to allow for genuine human oversight.
      *   *Specific Conditions:* Explainability requirements, lower caseloads for reviewers, shifting the burden of proof, or a sunset clause. Let's focus on *Explainability* and *Burden of Proof*. If the human can't explain *why*, they shouldn't sign off.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose clearly. Acknowledge the benefits (scale, consistency) to show good faith.
      *   **The Core Argument (The Responsibility Gap):** Define the problem. It's not about accuracy; it's about accountability. Use the "blame-absorber" concept.
      *   **Addressing the Counter-Arguments:**
          *   *Accuracy:* Accuracy isn't justice. False positives matter more when stakes are high.
          *   *Bias/Consistency:* Acknowledge human bias is real. But replacing it with unaccountable automation swaps one injustice for another.
          *   *The "Imperfect Human" Question:* This is the crux. Why prefer fallible humans? Because they can *answer* for their fallibility. Machines cannot.
      *   **The Recommendation:** Adopt with Conditions.
      *   **Specific Conditions:**
          1.  Explainability standard (vendor must provide more than heat maps).
          2.  Reviewer capacity (cannot be 100 flags/week if they need to actually read).
          3.  Burden of Proof (Flag is not evidence, it's a tip).
      *   **Closing:** Reiterate the ethical stakes.

  4.  **Drafting - Tone and Style:**
      *   Professional, academic but accessible.
      *   Firm but collaborative.
      *   Avoid jargon where possible, but use "responsibility gap" as a framing device since the user is a philosopher.
      *   Keep it tight to meet the word count (around 900 words).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "human bias" colleague? *Correction:* Make sure to explicitly validate her point about human inconsistency but frame the solution as "augmented human judgment" not "rubber-stamping."
      *   *Check:* Did I answer the "imperfect human" question? *Correction:* Ensure the distinction between *making a mistake* and *owing an account* is clear.
      *   *Check:* Is the recommendation concrete? *Correction:* Yes, specific conditions on vendor transparency and reviewer workload.
      *   *Check:* Word count? *Correction:* Monitor length. Don't ramble on philosophical theory; keep it applied.

  6.  **Final Polish:**
      *   Ensure the "Responsibility Gap" concept is explained clearly for non-philosophers.
      *   Make sure the "Adopt with Conditions" feels like a viable path, not a disguised rejection.
      *   Strengthen the closing to urge a specific vote.

  *(Self-Correction on Word Count)*: I need to be careful not to go too short. 900 words is roughly 1.5 to 2 single-spaced pages. I need to expand on the "Why prefer humans" section to ensure it lands hard.

  *(Drafting thought)*: Start with the "Human in the Loop" fallacy. That's a strong hook.

  7.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Concrete decision? Yes (Adopt with Conditions).
      *   Address accuracy stats? Yes.
      *   Address bias argument? Yes.
      *   Address "imperfect human" question? Yes.
      *   No "more study"? Yes.
      *   Tone? Serious, philosophical but practical.

  Let's write.

  *(Post-Drafting Check)*: The prompt asks for "no gesturing at needing more study." The conditions must be implementable *now* as part of the policy adoption, not "let's study this for a year." The conditions must be prerequisites for the *operation* of the system under the new policy.

