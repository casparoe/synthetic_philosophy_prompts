      *   *Shawshank* is often viewed as a heartwarming tale of hope. Through a penal philosophy lens, it's actually quite dark about the institution itself.
      *   *Retribution:* The film portrays retribution not as "just deserts" but as sadism and profit-seeking (Norton). It doesn't really argue against *fair* punishment, but against *abusive* punishment.
      *   *Rehabilitation:* The system claims to rehabilitate ("reformed?") but actually crushes souls (Brooks). Real rehabilitation happens *despite* the system (Andy's influence, Red's friendship), not *because* of it.
      *   *Institutionalization:* This is the core philosophical contribution. It suggests that the *structure* of prison (loss of autonomy) is inherently damaging over time, regardless of whether guards eat with inmates (Halden) or beat them (Shawshank). This challenges the Halden model if the issue is time + loss of liberty, not just conditions.
      *   *The Escape:* Andy's escape is a deus ex machina that bypasses the system entirely. It suggests justice isn't found *within* the penal process.

