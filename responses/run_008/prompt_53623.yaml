      *   *Definition:* Memory is a moral obligation only when it functions to protect the vulnerable or prevent recurrence. When it functions to punish, polarize, or trap individuals in trauma, the obligation ceases.

      *   *Wait, I need to make sure I don't waffle.* The prompt says "commit to one principle (or commit to the claim that there isn't one)." I should commit to a principle.
      *   *Let's sharpen the blade:* **Memory is a debt owed to the future, not the past.**
      *   *Explanation:* We don't remember because the past demands it (the dead don't care). We remember because the *living* need the lesson to survive.
      *   *This handles the survivor:* She doesn't owe the future her trauma if it destroys her.
      *   *This handles the teen:* The future needs him rehabilitated, not branded.
