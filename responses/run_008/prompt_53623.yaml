      *   *Refined Principle:* **The Principle of Consequential Dignity.** We owe a duty to remember only when doing so preserves human dignity or prevents future harm. When memory undermines dignity or invites harm, the duty dissolves.

      *   *Wait, I need to be careful not to sound too utilitarian.* "Consequential Dignity" sounds a bit dry. Let's try: **The Principle of Generative Justice.** Memory is required when it generates justice (broadly defined as repair and prevention).
