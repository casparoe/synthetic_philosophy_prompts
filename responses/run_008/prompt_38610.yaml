      *   *Verdict:* Statement is accurate enough for pop-sci. "Self-reference" is misleading/imprecise terminology for a logician.

  4.  **Address Question 2: Verificationism and the "Devastation":**
      *   *Target:* Yes, Fitch's result (actually discovered in a referee report in 1945, published 1963) was aimed at the verificationist theory of truth (logical positivists) and later semantic anti-realism (Dummett). The verificationist principle is roughly "truth = verifiability/knowability."
      *   *Did it finish it off?* The host says "After Fitch that view was finished." This is hyperbolic. Philosophers *hated* the conclusion (that all truths are known) because it's obviously false (omniscience). So they rejected the premise (all truths are knowable). But anti-realists didn't just give up. They tried to restrict the logic (intuitionistic logic), restrict the knowability principle (only basic truths are knowable), or deny the distribution of knowledge over conjunction.
