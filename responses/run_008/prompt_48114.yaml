  10. **Final Polish:** Check tone (philosophical, rigorous, helpful). Ensure confidence levels are explicit. Ensure the "least sure" point is highlighted. (The Haircut case is the tricky one because it blurs art and social function).

      *(Self-Correction on the Poet case)*: Why doesn't the poet's word settle it? Because aesthetic judgment of one's own work requires *hearing* it as other. The testimony doesn't provide the *hearing*, it provides the *verdict*. I need the hearing.
