  5.  **Addressing the Specific Cases:**

      *   *Friend (Film):* Saved by "Shared Sensibility/Alignment."
      *   *Critic (Film):* Saved by "Action vs. Assertion." I buy the ticket (action) but don't claim the judgment (assertion).
      *   *Aggregate (Film):* Saved by "Data vs. Judgment." 8.7 is a statistic, not a verdict I can own.
      *   *Sommelier (Wine):* Saved by "Immediate Experience." Wine is ephemeral; tasting is the point. Nodding implies tasting.
      *   *Novel Ending:* "Devastating" is a psychological effect prediction. I can believe the prediction without feeling the effect yet. Uninteresting because it's factual about my future state, not a value judgment per se.
