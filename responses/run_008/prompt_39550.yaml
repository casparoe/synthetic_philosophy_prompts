answer: |-
  The disagreement between you and your friend hinges on a subtle but crucial distinction in how Functional Decision Theory (FDT) evaluates **subjunctive dependence** across possible worlds. You are correct that the surface structure of the two problems looks identical: a predictor simulates you, a past fact is fixed, and your current causal leverage is nil. However, your friend is also correct that the distinction in FDT's recommendation is principled, not ad hoc.

  The core of the disagreement lies in **what exactly is logically dependent on your decision algorithm.**

  ### The Core Distinction: Utility vs. Signal

  To see the principled difference, you must look at the problem from the **ex-ante perspective** (before the coin flip or before the termite infestation), because FDT selects a *policy* (a decision function) rather than a momentary act. FDT asks: "Which algorithm, if run by me, produces the best expected outcome across all possible worlds?"

  **1. Counterfactual Mugging**
  *   **The Setup:** Omega flips a coin. Heads: Omega asks for $100. Tails: Omega gives you $1,000,000 *if and only if* your algorithm would have paid on Heads.
  *   **The Dependency:** The *utility* in the Tails world is logically dependent on your decision in the Heads world.
  *   **The FDT Calculation:**
      *   If your algorithm is **Pay**: You lose $100 in Heads, but you *gain* $1,000,000 in Tails.
      *   If your algorithm is **Refuse**: You lose $0 in Heads, but you *gain* $0 in Tails.
      *   **Result:** The Tails reward *exists only because* your algorithm says "Pay." Your decision function *creates* the value in the counterfactual branch where you don't actually act.
  *   **Verdict:** Pay. You are "buying" the Tails reward with your Heads payment.

  **2. XOR Blackmail**
  *   **The Setup:** Termites exist (or not). Blackmailer sends a letter *if and only if* (Termites exist AND you Pay) OR (No Termites AND you Refuse).
  *   **The Dependency:** The *arrival of the letter* is logically dependent on your decision. However, the *termite damage* is **not**.
  *   **The FDT Calculation:**
      *   If your algorithm is **Pay**: The Blackmailer sends the letter only when Termites exist.
          *   Outcome: You receive the letter, you pay, and the termites eat your house. (In the No-Termite world, no letter is sent, you pay nothing, no termites).
          *   Net Loss: Payment + Termite Damage (in the termite world).
      *   If your algorithm is **Refuse**: The Blackmailer sends the letter only when No Termites exist.
          *   Outcome: You receive the letter, you refuse to pay, and there are no termites. (In the Termite world, no letter is sent, you pay nothing, but termites eat your house).
          *   Net Loss: Termite Damage (in the termite world).
      *   **Result:** In both cases, the termites eat your house in the termite world. Your decision function cannot stop the termites. It can only stop you from *paying the blackmailer*.
  *   **Verdict:** Refuse. You save the payment cost without affecting the termite cost.

  ### Why Your Objection Misses the Mark

  You argued: *"The refusal that pays off is the refusal of the letter that never arrives."*

  This is where the equivocation happens. You are treating **avoiding the letter** as the goal, analogous to **getting the money** in Mugging. But in FDT, the goal is **utility**, not information flow.

  *   In **Mugging**, the counterfactual event (Omega paying you) is a **utility gain** that is ontologically dependent on your algorithm. Without your "Pay" algorithm, that million dollars literally does not exist in the Tails world.
  *   In **Blackmail**, the counterfactual event (Termites eating your house) is a **utility loss** that is ontologically *independent* of your algorithm. The termites are a fact of nature. The Blackmailer merely decides when to *tell* you about them.

  When you Refuse in Blackmail, you aren't "reaching back" to stop the termites in the world where they exist. You are simply arranging it so that you are only *contacted* in the world where they don't. But since FDT evaluates the whole policy:
  *   **Policy Pay:** You pay in the termite world. Termites happen.
  *   **Policy Refuse:** You don't pay in the termite world. Termites happen.
  *   **Difference:** You save the payment. The termites were never under your logical control.

  In Mugging:
  *   **Policy Pay:** Money appears in the tails world.
  *   **Policy Refuse:** Money disappears in the tails world.
  *   **Difference:** You gain the money. The money *was* under your logical control.

  ### Is Your Friend's Contrast Principled?

  Your friend says: *"In the mugging your refusal can reach back into the tails world... whereas in the blackmail nothing you do counterfactually bears on the termites."*

  Your friend is **substantively correct**, though their phrasing ("reach back") is metaphorical and risks sounding like magical backward causation. A more precise FDT phrasing would be: *"In Mugging, the utility in the counterfactual branch is a function of your decision algorithm. In Blackmail, the disutility in the counterfactual branch is independent of your decision algorithm."*

  **Are there smuggled assumptions?**
  No, provided your friend isn't secretly relying on Causal Decision Theory (CDT).
  *   A CDT agent refuses in Mugging because they think "My payment can't causally change the past coin flip."
  *   A CDT agent pays in Blackmail (sometimes) because they think "Paying makes the letter go away / correlates with safety."
  *   Your friend is arguing for the FDT position (Pay Mugging, Refuse Blackmail) based on the **structure of logical dependence**. This is the core of FDT. They are not smuggling in causal assumptions; they are correctly identifying that logical dependence applies to Omega's *payout* in Mugging, but only to the Blackmailer's *notification* in Blackmail.

  ### Conclusion

  The distinction is **principled**. It rests on whether the *value at stake* in the counterfactual scenario is logically contingent on your decision function.

  *   **Mugging:** The Million Dollars is contingent. You can logic it into existence.
  *   **Blackmail:** The Termite Damage is not contingent. You cannot logic it out of existence; you can only logic yourself out of paying for it.

  Your intuition that the structures look similar is sharp—they both involve predictors and logical correlations. But FDT distinguishes between **controlling the prize** (Mugging) and **controlling the notification of the prize/threat** (Blackmail). Your friend's contrast holds up: in one case, your algorithm writes the check; in the other, it only answers the phone.
