prompt: |-
  I cover science and medicine for a mid-size outlet, and our copy desk keeps fighting about how to describe people at the edge of death — organ donors on ventilators, the phrase "brain dead," cases where a heart stops and gets restarted. Our stylebook just says don't use "brain dead" metaphorically, which dodges the actual problem. Write me a procedure an editor can run on a sentence in five minutes: what to ask about the case, when plain "dead" is safe, when it needs a qualifier and which one, and where the procedure has to stop and say this is a values call a human has to make. Ground it in the real philosophy — whole-brain death vs. permanent loss of integrated bodily functioning vs. losing the person while the body lives on — but usable by someone with zero philosophy background and a deadline. Then run it on three cases: a donor declared brain dead being wheeled to the OR with a beating heart, a donation-after-circulatory-death case where the heart is stopped for only a couple minutes before its stopped for good, and a patient in a permanent vegetative state whose family asks us not to call her dead in our story. Flag the places where the procedure gives an answer readers or families will hate, and be honest about what it cant settle.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Target Audience:** Science/medicine journalists and editors at a mid-size outlet.
      *   **Problem:** Inconsistent/confusing terminology regarding end-of-life states (brain death, cardiac death, vegetative states, organ donation). Current stylebook is insufficient ("don't use 'brain dead' metaphorically").
      *   **Task:** Create a 5-minute editorial procedure/flowchart.
      *   **Requirements:**
          *   Grounded in real philosophy/medicine (whole-brain death, integrated functioning, personhood).
          *   Usable by non-philosophers under deadline.
          *   Must identify when "dead" is safe, when qualifiers are needed, and when it's a values call.
          *   Apply the procedure to three specific cases (Brain Dead Donor, DCD Donor, PVS Patient).
          *   Flag where the procedure yields unpopular results or fails to settle the issue.
      *   **Tone:** Professional, practical, empathetic, honest about limitations.

  2.  **Deconstruct the Medical/Philosophical Landscape:**
      *   *Cardiopulmonary Death:* Heart/lungs stop permanently. Traditional definition.
      *   *Neurological Death (Brain Death):* Whole brain (including brainstem) function ceases irreversibly. Legally dead in most jurisdictions, even if heart beats via ventilator. Philosophical basis: Loss of integrative function/consciousness.
      *   *Donation after Circulatory Death (DCD):* Heart stops, wait period (e.g., 5 mins), declared dead, organs harvested.
      *   *Permanent Vegetative State (PVS) / Unresponsive Wakefulness:* Brainstem works (breathing, sleep-wake), cortex damaged (no awareness). *Not* dead legally or medically.
      *   *The "Gray Zones":* The time between heart stop and declaration in DCD; the visual dissonance of a "dead" person with a warm chest; the family's emotional reality vs. clinical reality.

  3.  **Drafting the Procedure (The "5-Minute Triage"):**
      *   *Goal:* Quick decision tree.
      *   *Step 1: Legal/Medical Status.* Is there a formal declaration? This is the safest anchor.
      *   *Step 2: Physiological Reality.* What is the body doing? (Beating heart? Breathing on its own?)
      *   *Step 3: Narrative Context.* Why are we writing this? (Obit? Science explainer? Human interest?)
      *   *Step 4: The "Values Stop."* When does the editor need to escalate?
      *   *Constraint:* Must be simple enough for a copy editor but accurate enough for a science writer.

      *Drafting the Questions:*
      1.  Has a physician declared death? (Yes/No)
      2.  Is the heart beating? (Yes/No)
      3.  Is the distinction relevant to the story? (Yes/No)

      *Refining the Logic:*
      *   If Declared Dead + Heart Beating (Brain Death) -> Use "Dead" but explain the mechanism if space allows.
      *   If Heart Stopped + Not Declared (DCD waiting period) -> Use "Dying" or "Heart Stopped."
      *   If Not Declared Dead (PVS/Coma) -> Never use "Dead."

      *Adding the Philosophical Grounding (Simplified):*
      *   *Whole-Brain:* The "control center" is gone.
      *   *Circulatory:* The "fuel pump" is gone permanently.
      *   *Personhood:* The "self" is gone (risky territory for journalists).

      *Let's structure it as a Checklist + Decision Matrix.*

  4.  **Developing the Three Case Studies:**

      *   *Case 1: Brain Dead Donor (Beating Heart).*
          *   Medically/Legally: Dead.
          *   Visually: Alive.
          *   Procedure Output: Call them "dead."
          *   Friction Point: Families see a warm body. Readers get confused.
          *   Recommendation: "Declared dead by neurological criteria."

      *   *Case 2: DCD (Heart stopped 2 mins, waiting for 5).*
          *   Medically/Legally: Not dead *yet* (auto-resuscitation window).
          *   Procedure Output: Do not call "dead." Use "heart stopped" or "dying."
          *   Friction Point: Semantics feel cruel when death is imminent.

      *   *Case 3: PVS Patient (Family says "not dead").*
          *   Medically/Legally: Alive.
          *   Procedure Output: Do not call "dead."
          *   Friction Point: Family fears being ignored. Science says "no personhood left," Family says "she's still here."
          *   Values Call: Respect family language within medical accuracy.

  5.  **Refining the "Values Stop":**
      *   Where does the procedure fail?
      *   It fails when medical accuracy causes undue harm to grieving families.
      *   It fails when the law conflicts with public understanding.
      *   It fails when the "truth" depends on which definition of death you prioritize (biological vs. social).

  6.  **Writing the Response (Iterative Polish):**
      *   *Intro:* Acknowledge the difficulty. This is one of the hardest beats in journalism.
      *   *The Procedure:* Make it look like a checklist. Use bold text for decisions.
      *   *The Philosophy:* Keep it in a sidebar or brief intro so it informs the procedure without bogging it down. (Actually, better to weave the *reasoning* into the procedure steps so they learn *why*).
      *   *The Cases:* Run them strictly through the procedure.
      *   *The Critique:* Be honest about where the procedure hurts.

      *(Self-Correction during drafting)*: I need to make sure I don't give medical advice. I need to emphasize *reporting* the status, not *determining* the status. The journalist relies on the medical record.
      *Correction:* Step 1 must be "What does the medical record/chart say?" not "Is the patient dead?"

      *(Refining the "Dead" vs. "Declared Dead")*: In journalism, we report claims. If a doctor declares death, we report they are dead. But we must clarify *why* if it contradicts visual evidence (beating heart).

      *(Refining the PVS case)*: This is the trickiest. Medically alive. Socially/Philosophically ambiguous. The procedure must say "Do not use dead." But acknowledge the family's pain.

  7.  **Final Review against Constraints:**
      *   5-minute procedure? Yes, checklist format.
      *   Grounded in philosophy? Yes (integrated function vs. circulation).
      *   Usable by non-philosophers? Yes, avoids jargon.
      *   Three cases run? Yes.
      *   Flagged friction points? Yes.

  8.  **Final Polish:** Ensure tone is supportive of the editor, not condescending. Emphasize that clarity serves the public, but empathy serves the subjects. (Proceed to generate output).

  *(Post-Drafting Thought)*: I need to make sure the distinction between "Brain Death" and "Vegetative State" is crystal clear, as this is the most common public confusion. The procedure must explicitly separate them.

  *(Final Plan)*:
  1.  Introduction: Validate the struggle.
  2.  The "5-Minute Death Terminology Triage" (The Procedure).
  3.  The Philosophical Cheat Sheet (Brief context).
  4.  Case Studies (Applied procedure).
  5.  The "Red Flags" (Where the procedure breaks/needs human judgment).
  6.  Conclusion.

