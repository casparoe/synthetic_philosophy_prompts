answer: |-
  # The 5-Minute Death Terminology Triage
  **For:** Copy Editors, Desk Chiefs, Science Reporters
  **Time:** 5 Minutes
  **Goal:** Accuracy without unnecessary cruelty; clarity without pseudoscience.

  This procedure does not determine *if* someone is dead. It determines *how to write about* the status determined by medical professionals. It balances legal definitions, biological reality, and reader comprehension.

  ---

  ## Part 1: The Procedure (Checklist)

  **Step 1: Anchor to the Medical Record (1 Minute)**
  *Do not make a medical determination yourself.* Look for the formal declaration in your notes or press materials.
  *   **Q:** Has a physician formally declared death?
      *   **YES:** Go to Step 2.
      *   **NO:** (e.g., coma, vegetative state, cardiac arrest before declaration). **STOP.** You cannot use the word "dead" or "died." Use "critically ill," "unresponsive," or "heart stopped."
  *   **Q:** What was the *mechanism* of declaration?
      *   **Cardiopulmonary:** Heart/lungs stopped permanently.
      *   **Neurological:** Whole-brain function ceased (Brain Dead).

  **Step 2: Check the Visual Dissonance (2 Minutes)**
  *Does the body look alive to a layperson?*
  *   **Q:** Is the heart beating or chest rising (via ventilator) *after* the declaration of death?
      *   **NO:** (Cold, still body). Use **"Dead"** or **"Died."** No qualifier needed unless relevant to the story.
      *   **YES:** (Warm skin, beating heart, pregnant body). **DO NOT** use "dead" without a qualifier. The visual contradiction will confuse readers and offend families.
          *   *Preferred Phrasing:* "Declared dead by neurological criteria," "Legally dead," or "Brain dead."
          *   *Avoid:* "Technically dead" (implies doubt), "As good as dead" (metaphorical).

  **Step 3: Assess Narrative Necessity (1 Minute)**
  *Why does the distinction matter to this specific story?*
  *   **Q:** Is the *timing* or *state* of death central to the science? (e.g., organ transplant viability, resuscitation research).
      *   **YES:** Be precise. Explain the definition briefly. ("Under state law, death occurs when brain function ceases, even if the heart beats.")
      *   **NO:** (e.g., general obit, policy piece). Prioritize clarity and empathy. If the family refers to them as "living" during the donation process, you may quote them, but maintain the medical fact in your narration.

  **Step 4: The Values Stop (1 Minute)**
  *If you answer YES to any of these, escalate to a Senior Editor.*
  *   Does the family explicitly dispute the medical declaration of death in a way that impacts the story's ethics?
  *   Are you writing about a patient in a **Permanent Vegetative State (PVS)** where the family considers them "gone" but they are legally alive?
  *   Does the story involve a religious or cultural objection to neurological death (some groups do not accept brain death as true death)?

  ---

  ## Part 2: The Philosophical Cheat Sheet (For Context)
  *Keep this in your head to understand **why** Step 1 and 2 exist.*

  1.  **Whole-Brain Death:** The "integrator" is gone. The body cannot breathe or regulate itself without machines. Legally dead in all 50 states. *Philosophical justification:* The person is gone; the organism is disintegrating.
  2.  **Circulatory Death:** The "pump" is gone permanently. *Philosophical justification:* Blood flow is required for consciousness and life.
  3.  **Vegetative State:** The "person" (cortex) is gone, but the "organism" (brainstem) lives. *Legally Alive.* **Never call this dead.**
  4.  **The "Dead Donor Rule":** Organs can only be taken after death is declared. This creates the tension in donation stories.

  ---

  ## Part 3: Running the Cases

  Here is how the procedure applies to your three specific scenarios.

  ### Case 1: The Brain-Dead Donor (Beating Heart)
  *Scenario:* A patient declared brain dead is wheeled to the OR for organ retrieval. The heart is beating.
  *   **Step 1 (Record):** Physician declared death via neurological criteria. **(Status: Dead)**
  *   **Step 2 (Visual):** Heart is beating. Chest is warm. **(Dissonance: High)**
  *   **Step 3 (Necessity):** High. Organ viability depends on blood flow.
  *   **Procedure Verdict:** Use "Dead" or "Died," but **must qualify** immediately to resolve visual dissonance.
  *   **Suggested Copy:** "The patient, declared dead by neurological criteria, was wheeled to the operating room while his heart still beat."
  *   **Friction Flag:** **HIGH.** Families often describe this moment as "watching him die" or "keeping him alive for donation." Readers will see "beating heart" and think "alive."
      *   *Editorial Note:* Do not concede that the patient is "alive" to make the family feel better, but do not ignore the visual reality. Acknowledge the tension: *"Though legally dead, the ventilator kept oxygen flowing to the organs."*

  ### Case 2: Donation After Circulatory Death (DCD)
  *Scenario:* Life support is withdrawn. Heart stops. Doctors wait 5 minutes to ensure it doesn't restart (auto-resuscitation). Organs are harvested immediately after.
  *   **Step 1 (Record):** Death is declared *after* the 5-minute wait. Before that, the patient is dying, not dead.
  *   **Step 2 (Visual):** Heart is stopped.
  *   **Step 3 (Necessity):** Critical. The 2-minute vs. 5-minute window is the science story.
  *   **Procedure Verdict:** Before the 5-minute mark, **cannot use "Dead."**
  *   **Suggested Copy:** "After his heart stopped, doctors waited five minutes to declare death. At the two-minute mark, he was not yet dead, though death was imminent."
  *   **Friction Flag:** **MEDIUM.** To a layperson, a stopped heart equals death. Explaining the "waiting period" can sound like bureaucratic hair-splitting to grieving readers.
      *   *Editorial Note:* Be precise. If you write "He died when his heart stopped," you are medically inaccurate regarding DCD protocols. Use "His heart stopped; death was declared five minutes later."

  ### Case 3: Permanent Vegetative State (PVS)
  *Scenario:* Patient has been unresponsive for years. Family says, "She's not here anymore," but asks you not to call her "dead" in the story.
  *   **Step 1 (Record):** No death certificate. Physician notes indicate PVS/Unresponsive Wakefulness. **(Status: Alive)**
  *   **Step 2 (Visual):** Breathing on own, eyes open, sleep-wake cycles.
  *   **Step 3 (Necessity):** Story is about quality of life/ethics.
  *   **Procedure Verdict:** **STOP.** You cannot call her "dead." Step 4 (Values Stop) is triggered.
  *   **Suggested Copy:** "She is in a permanent vegetative state. Her family says the person they knew is gone, though her body remains alive."
  *   **Friction Flag:** **EXTREME.** This is the gap between *biological life* and *biographical life.*
      *   *Editorial Note:* This is where the procedure yields to human judgment. Medically, she is alive. Philosophically, "personhood" may be lost. Respect the family's request to avoid "dead," but do not validate the idea that PVS *is* death. Use their quotes for the emotional reality ("She's gone"), use medical terms for the physical reality ("She is breathing").

  ---

  ## Part 4: Where the Procedure Fails (The Honest Assessment)

  As an editor, you need to know where this 5-minute triage will generate hate mail or ethical complaints.

  **1. The "Beating Heart" Problem (Case 1)**
  *   **The Failure:** The procedure tells you to call them "dead."
  *   **The Reaction:** Families will accuse you of dehumanizing their loved one. "How can he be dead if he's warm?"
  *   **The Fix:** You cannot fix the medical definition, but you can fix the tone. Acknowledge the *appearance* of life. "Although her chest rose and fell..." validates the family's visual experience without contradicting the medical record.

  **2. The DCD "No-Man's Land" (Case 2)**
  *   **The Failure:** The procedure forces you to distinguish between "heart stopped" and "declared dead."
  *   **The Reaction:** Readers will find this pedantic. "He had no pulse! He was dead!"
  *   **The Fix:** Explain *why* the distinction matters (organ viability, legal protection for doctors). If the distinction doesn't matter to the story, simplify, but do not lie.

  **3. The Personhood Gap (Case 3)**
  *   **The Failure:** The procedure says "Alive." The family says "Gone."
  *   **The Reaction:** Both sides will be unhappy. Families feel you don't understand their grief; bioethicists feel you're promoting pseudoscience.
  *   **The Fix:** This is the **Values Stop**. Do not use the procedure to override the Senior Editor here. This requires a conversation about the outlet's stance on personhood vs. biology. Generally: Report the medical status (Alive), quote the emotional status ("Gone").

  ## Final Directive for the Copy Desk
  If the sentence passes the **Step 1 (Medical Record)** check, it is factually safe. If it fails **Step 2 (Visual Dissonance)**, it requires a qualifier. If it triggers **Step 4 (Values Stop)**, it requires a human conversation, not a style rule.

  **When in doubt:** Report the *declaration*, not the *metaphysics.*
  *   *Bad:* "He was basically dead."
  *   *Good:* "Doctors declared him dead."
