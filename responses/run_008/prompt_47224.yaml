  **JOINT STATEMENT ON THE NATURE OF SOCIETAL DISCONTINUITY IN PRE-MODERN CONTEXTS**

  **Seminar:** Collapse and Transformation in Pre-Modern Societies
  **Date:** October 26, 2023
  **Submitted By:** The Adversarial Collaboration Pair (Structural Fragility Thesis & Societal Continuity Thesis)

  ### I. Shared Claims

  The undersigned representatives of the Structural Fragility ("Failure") and Societal Continuity ("Transformation") perspectives affirm the following propositions as the foundational basis for our ongoing inquiry. We assert that agreement on these points renders our remaining disagreements substantive rather than semantic.

  1.  **Conflation of Variables:** We agree that the term "collapse," as commonly deployed in both popular and academic discourse, conflates at least three distinct variables: (a) the fate of a political apparatus (centralized administration), (b) the fate of a population (demographic density and health), and (c) the fate of a cultural tradition (symbolic systems, literacy, and identity).
  2.  **Differential Weighting:** We acknowledge that our divergence arises less from a denial of the other's data and more from how these variables are weighted. The Fragility Thesis prioritizes the loss of centralized capacity as the defining metric of societal health, while the Continuity Thesis prioritizes demographic persistence and welfare as the defining metric.
  3.  **The Visibility Problem:** We concur that the archaeological record possesses a structural bias toward elite activities. Monumental architecture, palatial storage, and literate administration leave durable traces; village-level subsistence, oral tradition, and decentralized governance do not. Consequently, a transition from state to non-state organization will inevitably appear as a "loss" in the material record, regardless of the lived experience of the population.
  4.  **Universality of Change:** We agree that no case study under review (Late Bronze Age Eastern Mediterranean, Terminal Classic Maya, Rapa Nui) represents a status quo. In all instances, significant reorganization occurred. The disagreement concerns whether that reorganization was a catastrophic failure of systems or an adaptive strategy by agents.
  5.  **Irreversibility:** We agree that in all three case studies, the specific configuration of the "peak" complex society was not restored in the short term. Once the palaces fell, the stelae stopped, or the statues were toppled, those specific institutions did not return to their prior intensity.

  ### II. Disagreements Table

  The following table outlines our residual disagreements. Each statement is phrased in the voice of the camp holding the view, with a charitable gloss provided by the rival camp to ensure mutual comprehension.

  | **Disagreement** | **Holding Camp's Statement** | **Rival Camp's Gloss** |
  | :--- | :--- | :--- |
  | **Welfare Trajectory** | **Fragility Thesis:** The dissolution of centralized systems removed essential protections (resource redistribution, conflict mediation), leading to a measurable decline in public health and security for the majority. | **Continuity Gloss:** *They argue that the state provided a net benefit to commoners, and its removal exposed people to greater risk and mortality.* |
  | **Agency vs. Determinism** | **Continuity Thesis:** Populations actively chose to abandon monumental investment and centralized tribute as a rational cost-benefit analysis, opting out of a system that extracted too much labor for too little return. | **Fragility Gloss:** *They argue that people chose to leave the state because it was exploitative, rather than being forced out by systemic failure or external shock.* |
  | **Definition of "Society"** | **Fragility Thesis:** A complex society is defined by its integrative institutions. When the palace burns and literacy vanishes, the society has ceased to exist, even if biological descendants remain in the region. | **Continuity Gloss:** *They argue that the "society" is the institutional shell, so when the shell breaks, the society is dead, regardless of the people inside.* |

  ### III. Cruxes and Evidentiary Predictions

  We have identified three specific cruxes where our interpretations diverge sharply. For each crux, we specify a class of evidence conceded by both sides as probative and record our respective predictions. This serves as a binding pre-commitment to how we will interpret forthcoming data.

  **Crux A: The Counterfactual Baseline**
  *   **The Issue:** Is the relevant comparison for "collapse" the society at its own complexity peak, or the trajectory a non-collapsed regional society would have followed?
  *   **Probative Evidence:** **Settlement-survey data showing continuity versus dispersal.** This data tracks site numbers and sizes over time independent of monumental construction.
  *   **Predictions:**
      *   *Fragility Thesis:* If collapse is catastrophic, survey data will show a sharp reduction in total settled area and site hierarchy that falls *below* the regional baseline for subsistence stability.
      *   *Continuity Thesis:* If transformation is adaptive, survey data will show a redistribution of settlement (e.g., from large centers to smaller hamlets) with no significant net loss in total occupied area or carrying capacity utilization.

  **Crux B: The Record-Bias Question**
  *   **The Issue:** How much of the apparent sharpness of a "collapse" is an artifact of which activities leave durable traces (monuments/texts) versus a real discontinuity in lived welfare?
  *   **Probative Evidence:** **Paleodemographic estimates (skeletal data).** Specifically, markers of physiological stress (enamel hypoplasia, porotic hyperostosis) and trauma rates in human remains pre- and post-transition.
  *   **Predictions:**
      *   *Fragility Thesis:* If collapse is a welfare catastrophe, skeletal samples from the post-transition period will show a statistically significant increase in stress markers and interpersonal violence compared to the peak period.
      *   *Continuity Thesis:* If collapse is an elite phenomenon, skeletal samples from the post-transition period will show stable or improved health markers, indicating that commoner welfare was decoupled from elite monumental output.

  **Crux C: Voluntariness**
  *   **The Issue:** At what point does settlement dispersal and abandonment of monumental investment stop counting as adaptation and start counting as flight under duress?
  *   **Probative Evidence:** **Lake sediment cores for land-use intensity combined with evidence of depopulation timing relative to foreign contact.** This distinguishes between gradual agricultural shifts and sudden abandonment coinciding with conflict.
  *   **Predictions:**
      *   *Fragility Thesis:* If flight under duress occurred, sediment cores will show a sudden, precipitous drop in agricultural pollen (e.g., maize, wheat) coincident with layers of ash or destruction, indicating rapid abandonment.
      *   *Continuity Thesis:* If adaptation occurred, sediment cores will show a gradual shift in pollen signatures (e.g., from intensive monoculture to diverse subsistence crops) without a corresponding spike in destruction layers, indicating a managed transition.

  ### IV. Closing Note on Verbal Disagreements

  In the course of drafting this statement, we identified one area of disagreement that we conclude is primarily verbal rather than substantive. This concerns the definition of the word **"Civilization."**

  The Fragility Camp uses "Civilization" to denote a specific threshold of urbanization, literacy, and state-level hierarchy. By this definition, if the state falls, civilization has ended. The Continuity Camp uses "Civilization" to denote the enduring cultural and social fabric of a people, including kinship networks, oral traditions, and subsistence practices. By this definition, if the people persist, civilization continues.

  We acknowledge that this lexical divergence drives much of the emotional heat in our seminar debates. We agree to bracket the term "Civilization" in future communications in favor of more precise descriptors (e.g., "State Apparatus" vs. "Populace"). Resolving this terminological friction does not resolve our factual disagreements regarding welfare and causality, but it prevents us from talking past one another regarding the final status of the groups in question.

  ***

  **Signed,**

  __________________________
  *Proponent, Structural Fragility Thesis*

  __________________________
  *Proponent, Societal Continuity Thesis*

  **Date:** October 26, 2023
