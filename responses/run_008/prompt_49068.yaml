      *   *Smuggling Alert:* The user assumes the "Outer" is *discoverable* via stats. Hofstadter worries the "Outer" might require *prior knowledge* to be recognized. Crypto assumes redundancy makes the Outer detectable *ex nihilo* (given enough text). Hofstadter is skeptical of *ex nihilo* decoding.

  5.  **Addressing the Residue Report (The Three Claims):**
      *   *Claim 1: Outer message is implicit/cannot be explicit.*
