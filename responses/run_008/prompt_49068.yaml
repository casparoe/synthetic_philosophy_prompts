      *   *Frame Message:* Signals "I am a message." (e.g., DNA looks distinct from background noise, a record looks distinct from a lump of coal).
      *   *Outer Message:* Instructions on *how* to decode. (e.g., "I am in English," "I am a vinyl record spinning at 33RPM," "I am DNA using the genetic code"). Hofstadter argues this is often implicit, not explicit.
      *   *Inner Message:* The actual content/meaning. (e.g., The protein instructions, the music, the secret text).
