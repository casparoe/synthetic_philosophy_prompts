answer: |-
  **TO:** Student Union Council
  **FROM:** Graduate Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo on Futarchy Pilot Proposal

  **Recommendation**
  I recommend that the Council **APPROVE** the pilot **WITH CONDITIONS**. Specifically, the Council must adopt both floor amendments, codify specific triggers for the escape clause prior to trading, and commission an independent audit of market integrity. This path preserves the experiment's potential to generate data on information aggregation while mitigating risks to fiscal responsibility and institutional credibility.

  **The Escape Clause and Market Credibility**
  The proposal's most critical flaw is the undefined escape clause. As skeptics note, rational traders will price in the probability that the Council exercises this clause if the market outcome is unpopular. If traders believe the Council will veto a winning project they dislike, prices will reflect Council preference rather than project efficacy. This collapses the futarchy mechanism into a standard beauty contest, rendering the data useless.

  To proceed, the Council must define "manifest market failure" ex ante. Acceptable triggers should be limited to objective criteria: proven fraud, technical failure of the automated market maker, or legal impediments. Subjective dissatisfaction with the outcome must not be a trigger. This does not remove the Council's ultimate authority but stabilizes trader expectations, allowing prices to function as signals rather than guesses about Council whim.

  **Analysis of Amendments**
  The first amendment bars traders with financial stakes in vendors. The proponent of the liquidity subsidy argues that manipulation offers profit opportunities to honest traders, correcting the price. This holds in deep, liquid markets with sophisticated arbitrageurs. It does not hold in a thin, play-money student market. Here, a large subsidy can drown out signal without risk of loss, destroying confidence rather than correcting price. This amendment **fixes** the problem of conflicts of interest; it does not merely relocate them.

  The second amendment replaces the single satisfaction survey with a composite metric. A single survey is vulnerable to Goodhart's law: traders will campaign for short-term satisfaction spikes rather than genuine welfare. A composite index (e.g., survey plus usage data plus broader sentiment) raises the cost of gaming. While no metric is immune to manipulation, this **fixes** the vulnerability by diversifying the targets, making it harder to game all components simultaneously.

  **Engaging the Skeptics and Proposers**
  Proposers argue that markets aggregate dispersed information better than committees. This is theoretically sound but assumes the metric accurately captures welfare. Skeptics argue that professional staff possess superior expertise regarding facility feasibility. Both are correct: staff should vet technical feasibility, while the market assesses student valuation. The pilot's modest scale (10% of budget) justifies the risk of amateur error in exchange for institutional learning.

  However, the skeptic's concern regarding the metric's scope is weightier. A satisfaction survey captures only users. A gym expansion might delight athletes while leaving the median student untouched, yet register as a success. The composite metric amendment mitigates this, but not entirely.

  **Strongest Consideration for the Losing Side**
  For those urging rejection, the strongest consideration is that institutional responsibility cannot be outsourced to a gamified mechanism when the success metric fails to capture the welfare of the non-user majority. If the market selects a project that benefits a vocal minority at the expense of broader utility, the Council remains politically accountable for the misallocation. No escape clause fully insulates the Council from the cost of a market-driven decision that appears indifferent to the median student. Skeptics are correct that a pilot cannot inoculate the Council against the political fallout of a "successful" market failure.

  **Conclusion**
  This pilot is valuable only if it produces legible data on market governance. An undefined escape clause and vulnerable metrics guarantee ambiguous results. By adopting the amendments and defining the veto triggers, we preserve the experiment's integrity while respecting the Council's fiduciary duty. We proceed not because the market is infallible, but because the cost of learning is low and the potential insight into democratic innovation is high.

  \answer{APPROVE-WITH-CONDITIONS}
