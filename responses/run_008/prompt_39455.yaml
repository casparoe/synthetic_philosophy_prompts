prompt: |-
  I teach an upper-level university seminar on cognition and creativity — fourteen students, one 90-minute session — and our next unit is on the idea, associated with Douglas Hofstadter's work on analogy and concept-slippage, that genuine creativity is best understood not as the production of something unprecedented but as the making of small, carefully chosen variations on a deeply familiar theme. On this picture, a concept or structure comes with "knobs" — dimensions along which it can be smoothly deformed — and the crux of creativity is knowing which knob to turn and how far: turn a knob a trivial amount and you get a shallow riff; turn a load-bearing one too far and the structure collapses into noise. I want to extend this with a distinction my students and I have been developing in discussion, between what we've been calling load-bearing knobs (dimensions whose perturbation destroys the coherence that made the theme worth varying) and slack knobs (dimensions that can be turned almost freely without losing the underlying idea). Our working hypothesis is that creative skill largely consists in telling the two apart without being told, and in turning a load-bearing knob just far enough that the structure strains but holds.

  Please act as an experienced instructional designer with a background in cognitive science and philosophy of mind, and think carefully about the pedagogical design before writing: the phenomenon has to show up in what the participants do, not in anything I say at the front of the room. Design an in-class activity in which students first generate variations under pressure — ideally with some small non-monetary incentive structure — and then collide with the load-bearing/slack distinction themselves, noticing that their most interesting outputs came from small perturbations of something deeply familiar while their most "novel" outputs were hollow. They should not hear Hofstadter's name or the theme of the unit until the debrief. The debrief should map specific moments in the activity onto specific parts of the model: the choice of theme, the selection of a knob, the magnitude of the turn, the point at which coherence breaks. You should also tell me, honestly, what will predictably go wrong the first time I run it and how to handle it, and which feature of the model no classroom activity can reproduce — I already suspect the years of tacit familiarity with a theme that real variation presupposes is one such feature, and I'd like your candid assessment.

  Structure your response with the following sections, in this order, in American English: **Design rationale** (what the activity is meant to make students feel, and why this mechanism rather than a lecture or discussion, at most 150 words); **The activity** (rules, roles, materials, a timeline minute by minute, and the incentive scheme — approximately 600 words); **The debrief** (how to map what happened onto the model, including when and how to reveal the framing, approximately 300 words); **Predictable failure modes** (at most 150 words); and **What the game cannot reproduce** (at most 150 words).
