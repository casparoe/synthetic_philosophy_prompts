answer: |-
  **Design rationale**
  This activity prioritizes experiential friction over explanatory clarity. Students must feel the resistance of a conceptual structure before they can understand its geometry. A lecture would define "load-bearing" abstractly; this task forces them to break something to find out which pieces hold weight. By withholding the theoretical framing, we prevent them from optimizing for the "correct" answer rather than exploring the boundary conditions. The incentive structure rewards tension—novelty that survives coherence—mirroring the seminar's core hypothesis that creativity is strained familiarity, not random noise.

  **The activity**
  **Title:** The Structural Strain Challenge
  **Participants:** 14 students (7 pairs)
  **Materials:** 7 envelopes containing a "Base Text" (a widely known limerick, e.g., "There once was a man from Nantucket"), 3 "Variation Cards" per pair, timer, voting slips.
  **Incentive:** The "Golden Tension" prize (e.g., choosing the next reading topic) awarded to the pair whose Round 3 variation is voted "Most New" yet "Still Recognizable."

  **Timeline (45 minutes):**
  **0:00–0:05 (Setup):** Divide into pairs. Distribute envelopes. Instruct students: "Your goal is to mutate this text. It must remain identifiable as *that* text, but it must also feel new. Do not discuss theory yet."
  **0:05–0:15 (Round 1: Slack):** Pairs draw Card A ("Change one noun" or "Change one adjective"). They have 5 minutes to generate two versions. They must select the one that feels easiest.
  **0:15–0:25 (Round 2: Load):** Pairs draw Card B ("Remove one line" or "Change the rhyme scheme"). They have 5 minutes to generate two versions. They must select the one that feels risky.
  **0:25–0:35 (Round 3: Break):** Pairs draw Card C ("Change the meter" or "Remove the punchline"). They have 5 minutes to push the text until it nearly collapses. They must submit one version that feels "strained but holding."
  **0:35–0:45 (Voting):** Post all Round 3 submissions anonymously. Students vote for the entry that feels most "creative" (not funniest, not most broken). Tally votes.

  **Instructions to Students:**
  "You are engineers of meaning. The Base Text is your structure. The Variation Cards are your tools. In Round 1, make a change that costs you nothing. In Round 2, make a change that worries you. In Round 3, make a change that threatens the structure's integrity. If the text becomes nonsense, you have turned the knob too far. If it feels identical to the original, you haven't turned it enough. Your submission for Round 3 must walk this line."

  **Incentive Scheme:**
  Points are awarded based on peer voting. However, the winning criterion is dual: the text must be rated high on "Surprise" and high on "Coherence." A text that is purely nonsense gets low Coherence scores. A text that is identical gets low Surprise scores. The "Golden Tension" prize goes to the highest combined score, incentivizing the precise calibration of structural strain.

  **The debrief**
  **Timing:** 30 minutes.
  **Process:** Begin by asking the winning pair to describe their Round 3 decision process. Ask: "What did you want to change? What did you avoid changing? Why?" Expect answers like, "We wanted to change the setting, but we knew if we changed the rhyme, it wasn't a limerick anymore."

  **Mapping the Model:**
  Only now introduce the terminology. Write "Knobs" on the board.
  1.  **Slack Knobs:** Map Round 1 (noun/adjective swaps) to this. Explain that these dimensions allow free variation without threatening category membership.
  2.  **Load-Bearing Knobs:** Map Round 2 and 3 (rhyme, meter, structure) to this. Explain that perturbing these dimensions risks collapsing the concept into noise.
  3.  **The Creative Sweet Spot:** Highlight the winning entry. Explain that creativity isn't breaking the load-bearing knobs (destruction) nor ignoring them (cliché), but turning them just enough that the structure strains but holds.

  **Revealing the Frame:**
  State: "This mechanic describes Douglas Hofstadter's theory of analogy and concept-slippage. Creativity is not unprecedented generation; it is the skilled manipulation of familiar structures." Connect their felt resistance during Round 3 to the cognitive work of maintaining coherence under variation. Ask them to reflect on where their "tacit sense" of the limerick structure came from (lifetime exposure) versus the 10 minutes they just spent.

  **Predictable failure modes**
  First, students may treat Round 3 as a joke, intentionally producing nonsense to be "creative." Counter this by enforcing the voting criterion: "Most Creative" requires "Still Recognizable." Second, pairs may stall on decision-making, arguing over whether a variation "counts." Remind them that the argument *is* the data; the friction they feel is the load-bearing knob revealing itself. Third, time creep. Keep the rounds strict; the pressure is necessary to prevent over-thinking. If a group finishes early, have them generate a "broken" version to compare against their "strained" version.

  **What the game cannot reproduce**
  This simulation compresses years of domain familiarity into 45 minutes. Real creative expertise relies on tacit knowledge acquired through deep immersion—the "feel" for which knobs are load-bearing comes from having seen the structure hold weight thousands of times before. Students are guessing at boundaries based on superficial exposure; experts navigate them via intuition. Additionally, the activity isolates a single concept. Real creativity often involves slippage across multiple conceptual domains simultaneously, a complexity this single-text mutation cannot fully capture.
