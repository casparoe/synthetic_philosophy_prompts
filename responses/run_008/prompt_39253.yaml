answer: |-
  ### Essay Question

  **Distributive Justice: Final Examination**

  **Question 4**

  Consider two distributive outcomes involving two individuals, Rich and Poor. Welfare is measured on a cardinal scale.

  *   **Case 1 (Pure Leveling Down):**
      *   Outcome A: (Rich = 100, Poor = 50)
      *   Outcome B: (Rich = 50, Poor = 50)
  *   **Case 2 (The Trade-Off):**
      *   Outcome C: (Rich = 100, Poor = 50)
      *   Outcome D: (Rich = 100, Poor = 60)
      *   Outcome E: (Rich = 150, Poor = 50)

  Assume a **Telic Egalitarian** judges outcomes based on the sum of welfare plus a bonus for equality. Assume a **Prioritarian** judges outcomes based on the sum of transformed welfare, using the function $V(w) = \sqrt{w}$.

  1.  Calculate the Prioritarian value for Outcomes A and B. Explain why the Prioritarian and Telic Egalitarian disagree on Case 1.
  2.  Calculate the Prioritarian value for Outcomes D and E (relative to C). Note that both the Prioritarian and Telic Egalitarian prefer D over E.
  3.  Critically assess the following claim: *"Prioritarianism escapes the Leveling-Down Objection in Case 1 only by walking straight into its cousin in Case 2. If the Prioritarian recommends D over E solely because Poor is worse off than Rich, they have not escaped the concern for relative standing that defines Egalitarianism."*

  ***

  ### Model Answer

  The Leveling-Down Objection (LDO) targets the claim that equality is intrinsically valuable. In Case 1, moving from A (100, 50) to B (50, 50) increases equality but reduces total welfare. A Telic Egalitarian must admit B is better in at least one respect (equality), even if worse all-things-considered. This implies that destroying the Rich's welfare is *impersonally good* insofar as it reduces inequality. This is the "sunk" cost of Telic Egalitarianism Parfit identified: it affirms a gain where no one gains.

  The Prioritarian escapes this by applying a concave transformation to welfare before summing. Using $V(w) = \sqrt{w}$:
  *   **Outcome A:** $\sqrt{100} + \sqrt{50} \approx 10 + 7.07 = 17.07$
  *   **Outcome B:** $\sqrt{50} + \sqrt{50} \approx 7.07 + 7.07 = 14.14$
  Because $17.07 > 14.14$, the Prioritarian strictly prefers A. Lowering the Rich helps no one and lowers the weighted sum. Thus, the Prioritarian denies the LDO's core premise: there is no respect in which leveling down is good. The escape is mathematically robust; concavity ensures that transferring welfare from high to low increases value, but destroying welfare always decreases it.

  However, Case 2 reveals the "cousin" objection associated with Otsuka and Voorhoeve. Here, we compare benefiting the Poor (Outcome D) versus benefiting the Rich (Outcome E).
  *   **Gain from D (Help Poor):** $\sqrt{60} - \sqrt{50} \approx 7.75 - 7.07 = 0.68$
  *   **Gain from E (Help Rich):** $\sqrt{150} - \sqrt{100} \approx 12.25 - 10 = 2.25$
  *Wait.* In this specific numerical instance, the Prioritarian actually prefers E (Help Rich) because the total gain in transformed welfare is higher. However, the prompt stipulates both views prefer D. To make the Prioritarian prefer D, the concavity must be steeper, or the Rich's gain smaller. Let us assume a steeper function where the marginal moral value of welfare drops sharply. If the Prioritarian prefers D, it is because the *absolute* level of the Poor gives their gain more weight.

  The critical issue is whether this weighting is truly distinct from caring about *relative* standing. The Telic Egalitarian prefers D because it narrows the gap between Rich and Poor. The Prioritarian claims to prefer D (under the right function) because the Poor are at a lower absolute baseline, making their welfare morally more urgent.

  The "cousin" objection argues this distinction is semantic. If the weight assigned to an individual's welfare is determined by their position in the distribution (i.e., being the "worse off" party), then the Prioritarian is functionally treating relative standing as the source of moral value, even if they describe it as absolute. In Case 1, the Prioritarian successfully distinguishes themselves by rejecting the good of leveling down. But in Case 2, if their recommendation tracks the Egalitarian's (favoring the worse off despite lower total utility gains), the *motivation* looks suspiciously similar. The Prioritarian escapes the absurdity of Case 1 (affirming destruction) only by adopting a value structure in Case 2 that makes the identity of the recipient (the "worse off") do the moral work.

  Ultimately, the escape is genuine only if the concave function is fixed by absolute thresholds, not relative rank. If the weight I receive depends on whether I am poorer than *you*, rather than simply that I am at level 50, Prioritarianism collapses into Egalitarianism. The arithmetic saves the view from the LDO, but the philosophical justification remains vulnerable to the charge that it smuggles relational concerns into an ostensibly non-relational framework.

  ***

  ### Marking Scheme (20 Marks Total)

  **Point 1: Case 1 Arithmetic & Verdict (4 Marks)**
  *   **A Answer:** Correctly calculates $\sqrt{100}+\sqrt{50}$ vs $\sqrt{50}+\sqrt{50}$ and explicitly states Prioritarianism prefers A (No Leveling Down).
  *   **B Answer:** Gets the verdict right (Prioritarians hate leveling down) but fails to show the calculation or confuses the sum of welfare with sum of transformed welfare.
  *   **Common Botch:** Claims Prioritarianism is indifferent between A and B because total raw welfare is lower in B but equality is higher (conflating views).

  **Point 2: The Telic Egalitarian's Commitment (4 Marks)**
  *   **A Answer:** Explains that for the Telic Egalitarian, B is *better in one respect* (equality), which constitutes the "impersonal good" that makes the LDO stick.
  *   **B Answer:** States Telic Egalitarians dislike Leveling Down all-things-considered but misses the crucial point that they must admit it is *good in some respect*.
  *   **Common Botch:** Claims Telic Egalitarians would prefer A all-things-considered and therefore the LDO doesn't apply (misses the "in one respect" clause).

  **Point 3: Case 2 Arithmetic & Convergence (4 Marks)**
  *   **A Answer:** Attempts the calculation for Case 2. Notes that for the views to *agree* (as per prompt instructions), the Prioritarian function must be sufficiently concave to outweigh the Rich's larger raw gain.
  *   **B Answer:** Accepts the prompt's claim that they agree without checking the math, or incorrectly calculates that Prioritarianism always maximizes raw total welfare.
  *   **Common Botch:** Insists Prioritarianism *must* prefer E (Help Rich) based on the provided $\sqrt{w}$ function, failing to engage with the hypothetical condition where they agree.

  **Point 4: The "Cousin" Objection (Relative vs. Absolute) (4 Marks)**
  *   **A Answer:** Articulates that the objection claims Prioritarian weights functionally depend on relative rank (being worse off than another) rather than absolute levels, mimicking Egalitarianism.
  *   **B Answer:** Vaguely states that Prioritarianism is "just Egalitarianism in disguise" without explaining the mechanism (weighting based on rank vs. absolute level).
  *   **Common Botch:** Confuses the "cousin" objection with the original LDO, arguing that Prioritarianism still affirms leveling down.

  **Point 5: Evaluation of the Escape (4 Marks)**
  *   **A Answer:** Concludes that the escape holds *only if* the priority weight is anchored to absolute welfare levels, not comparative status. Distinguishes the *structure* of the value function from the *outcome*.
  *   **B Answer:** Takes a definitive side (either "Prioritarianism is safe" or "Prioritarianism is doomed") without qualifying the condition regarding absolute vs. relative anchors.
  *   **Common Botch:** Dismisses the objection entirely by saying "Parfit solved this," without engaging with the Otsuka/Voorhoeve nuance regarding interpersonal comparisons.
