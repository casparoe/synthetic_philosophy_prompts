  I've been reading a popular history of logic that has a chapter on ancient China, and it wraps up Gongsun Long's white horse argument like this: he proved that a white horse is not a horse. The argument turns on requests — if you ask for a horse, a yellow or black one will do, but if you ask for a white horse it won't — so the two expressions don't cover the same things, and that makes the sentence 'a white horse is a horse' false. Gongsun had glimpsed that 'is' can mean identity or predication, but since classical Chinese thought never developed formal logic, he had no way to state the distinction, and the puzzle had to wait for Western logicians to sort it out. In the end it was really just a stunt, the kind of wordplay the School of Names — ancient China's guild of professional debaters — traded in. Something about the step from 'don't cover the same things' to 'the sentence is false' felt too fast to me, but I honesly can't say why. Can you go through the summary piece by piece and tell me what a scholar of classical Chinese philosophy would accept, where they'd wince, and what's flat wrong? And does the closing verdict — stunt in the end — actually follow from the parts of the summary that survive?
