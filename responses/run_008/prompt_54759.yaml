answer: |-
  Your intuition is spot-on. That summary is a classic example of "Whig history" applied to logic: it judges an ancient text solely by how closely it anticipates modern Western categories, and when it finds a mismatch, it dismisses the text as a failure or a trick.

  A scholar of classical Chinese philosophy (specializing in the Warring States period, the *Ming Jia* or School of Names, and the *Mohist Canons*) would find much of that summary frustratingly reductive. While it gets the surface mechanics of the argument roughly right, it misidentifies the philosophical stakes and relies on outdated stereotypes about Chinese thought.

  Here is a piece-by-piece autopsy of the summary, followed by an explanation of why your intuition about the logical gap is correct, and finally, a verdict on the "stunt" claim.

  ### Part 1: The Autopsy

  **1. "He proved that a white horse is not a horse."**
  *   **Scholar's Verdict:** **Wince.**
  *   **Why:** "Proved" implies a mathematical or deductive certainty that Gongsun Long (c. 320–250 BCE) wasn't claiming. He was offering a *discourse* or *dialogue* (the *Bai Ma Lun*). More importantly, scholars debate whether *fei* (not) here means "is not a member of" or "is not identical to." The summary assumes the former; Gongsun is likely arguing the latter regarding *names*, not physical objects.

  **2. "The argument turns on requests... if you ask for a horse, a yellow or black one will do, but if you ask for a white horse it won't."**
  *   **Scholar's Verdict:** **Accept.**
  *   **Why:** This is an accurate summary of one of the specific moves Gongsun makes in the text. He uses extensional criteria (the set of objects that satisfy the request) to show that the extension of "horse" is wider than the extension of "white horse."

  **3. "So the two expressions don't cover the same things, and that makes the sentence 'a white horse is a horse' false."**
  *   **Scholar's Verdict:** **Flat Wrong.**
  *   **Why:** This is the leap your intuition caught. In logic, if Set A (white horses) is a subset of Set B (horses), it does not follow that "A is B" is false. It only follows that "A is identical to B" is false. Gongsun is not making a simple error in class inclusion. He is arguing that the *compound name* "white-horse" functions differently than the *simple name* "horse." The summary conflates **extension** (what things the word picks out) with **intension** (the meaning or concept of the word). Gongsun is arguing that adding the attribute "white" changes the essence of the name, not just the list of objects.

  **4. "Gongsun had glimpsed that 'is' can mean identity or predication..."**
  *   **Scholar's Verdict:** **Wince.**
  *   **Why:** This is anachronistic projection. The distinction between the "is" of identity and the "is" of predication is Aristotelian/Fregean. While Gongsun is certainly playing with how language refers to reality, claiming he "glimpsed" this specific Western distinction implies he was trying to solve a Western problem and failed. Scholars like A.C. Graham and Chad Hansen argue he was addressing a specific Chinese problem: the relationship between *ming* (name) and *shi* (actuality).

  **5. "...since classical Chinese thought never developed formal logic, he had no way to state the distinction..."**
  *   **Scholar's Verdict:** **Flat Wrong.**
  *   **Why:** This is a major historiographical error. While China did not develop symbolic logic in the Western sense, the **Mohist Canons** (contemporary with or slightly later than Gongsun) contain rigorous definitions of logical terms, necessity, possibility, and geometric reasoning. To say there was "no way to state the distinction" ignores the sophisticated meta-linguistic vocabulary available in the Warring States period. It implies a linguistic incapacity that simply didn't exist.

  **6. "...the puzzle had to wait for Western logicians to sort it out."**
  *   **Scholar's Verdict:** **Flat Wrong.**
  *   **Why:** This is Whiggish history (viewing history as a progression toward the present/West). Modern scholars have "sorted it out" using tools from analytic philosophy, semantics, and mereology without needing to wait for Frege or Russell. The puzzle is considered "solved" in the sense that we now understand what Gongsun was doing, even if we reject his conclusion.

  **7. "In the end it was really just a stunt... professional debaters traded in."**
  *   **Scholar's Verdict:** **Wince.**
  *   **Why:** While the School of Names (*Ming Jia*) were indeed professional rhetoricians, dismissing their work as "stunts" is an old Confucian bias (Confucians hated them because they threatened social stability). Modern scholarship treats the *Bai Ma Lun* as a serious contribution to the philosophy of language and ontology.

  ---

  ### Part 2: Why Your Intuition Was Right

  You sensed the step from "don't cover the same things" to "the sentence is false" was too fast. Here is the technical reason why.

  The summary treats the argument as **Extensional**:
  *   Extension of "Horse" = {Black, Yellow, White, Brown...}
  *   Extension of "White Horse" = {White}
  *   Since {White} $\neq$ {Black, Yellow, White...}, the summary concludes "White Horse is Horse" is false.

  But in standard logic, "A white horse is a horse" is a statement of **Class Inclusion**, not **Class Identity**.
  *   True: The set of white horses is *contained in* the set of horses.
  *   False: The set of white horses is *identical to* the set of horses.

  Gongsun Long is not confusing inclusion with identity. He is arguing that the **Name** "White Horse" is not the **Name** "Horse."
  *   If you seek a *horse*, a yellow one suffices.
  *   If you seek a *white horse*, a yellow one does not suffice.
  *   Therefore, the *criteria for satisfaction* (the intension) are different.
  *   Therefore, the *names* are not equivalent.

  The summary claims Gongsun failed to distinguish identity from predication. A scholar would argue Gongsun was actually distinguishing **compound concepts** from **simple concepts**. He is arguing that "white horse" is a distinct ontological category from "horse" because the attribute "white" is fused with the substance "horse" to create a new *name*.

  The summary makes Gongsun look like he made a basic Venn diagram error. In reality, he was making a sophisticated point about how modifiers change the reference of a noun.

  ---

  ### Part 3: Does the "Stunt" Verdict Follow?

  **No.** The verdict that it was "just a stunt" does not follow from the parts of the summary that survive, and it certainly doesn't follow from the actual text.

  Even if we accept the summary's charitable claims (that Gongsun was playing with extension and reference), calling it a "stunt" ignores the context of **Rectification of Names** (*Zhengming*).

  In Warring States China, the correctness of names was not a parlor game; it was a political and ethical necessity. Confucius argued that if names are not correct, language is not in accord with the truth of things; if language is not in accord with the truth of things, affairs cannot be carried on to success.

  Gongsun Long's argument has stakes:
  1.  **Ontological:** It challenges how we categorize reality. Is a "white horse" a horse with a property, or a unique kind of thing?
  2.  **Political:** If a ruler asks for a "talent" (a broad category), does a "specific specialist" (a narrow category) suffice? If the names are conflated, governance fails.

  To call it a "stunt" is to adopt the bias of Gongsun's Confucian detractors, who viewed logical hair-splitting as dangerous to social harmony. Modern scholarship (such as that by Chris Fraser or Bryan Van Norden) views the School of Names as China's first philosophers of language, grappling with problems that wouldn't be tackled in the West until the 20th century.

  ### Summary for the Reader

  *   **What to Accept:** The summary correctly identifies that Gongsun uses the "seeking a horse" example to show that the extensions of the two terms differ.
  *   **What to Wince At:** The claim that this makes "a white horse is a horse" false is a simplification that misses Gongsun's point about names vs. objects. The claim that it was a "stunt" dismisses the serious philosophical and political context.
  *   **What is Flat Wrong:** The claim that Classical Chinese lacked the logical resources to handle this, and that it required Western logic to "solve" it. The Mohist Canons demonstrate that Chinese thinkers were developing rigorous logical systems at the exact same time.

  **Your intuition was correct:** The summary skips the hard philosophical work Gongsun is actually doing (about intension and naming) and replaces it with a caricature of a man who couldn't do basic set theory. It wasn't a stunt; it was a rigorous, if controversial, inquiry into how language hooks onto the world.
