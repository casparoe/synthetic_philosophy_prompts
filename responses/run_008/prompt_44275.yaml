      *   **Tone:** Philosophical, precise, neutral (no favored interpretation), useful for a discussion group.

  2.  **Deconstruct the *Cogito* (The "Menu" Strategy):**
      I need to categorize the interpretations based on the user's prompts and standard philosophical scholarship.

      *   *Category 1: The Minimal/Phenomenological Reading.* (Thinking is occurring).
      *   *Category 2: The Indexical/Token-Reflexive Reading.* (The thinker of *this* thought exists *now*).
      *   *Category 3: The Substantial Reading.* (An enduring ego/substance exists).
      *   *Category 4: The Performative/Self-Verifying Reading.* (The act of asserting makes it true).
