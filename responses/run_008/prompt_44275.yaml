  3.  **Drafting the Content - Step-by-Step:**

      *   **Introduction:** Acknowledge the user's sharp intuition. Validate that the *Cogito* is notoriously ambiguous between a logical inference and an intuition/performance. Set the stage for the menu.

      *   **Thesis 1: The Event Reading (Lichtenberg's Critique).**
          *   *Claim:* "Thinking is occurring." (*Cogitatur*).
          *   *Proof:* Existence of the *activity*, not necessarily the *agent*.
