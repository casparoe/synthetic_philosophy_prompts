answer: |-
  You have identified a genuine gap in the standard metaontological taxonomy. Your observation is sharp: the Carnapian/deflationary toolkit is excellent at *dissolving* disputes, but it is surprisingly silent on what happens when the dissolution is accepted intellectually yet fails to land affectively or normatively.

  To answer your primary question directly: **No, there is no single, settled term in the literature for this specific phenomenon.**

  However, your description maps onto three adjacent discussions in contemporary metaontology and metametaphysics. Understanding these will help you locate the phenomenon, even if the specific label is missing.

  ### 1. The Existing Literature Neighbors

  **A. Chalmers' "Deep Verbal Disputes"**
  In his seminal paper *"Verbal Disputes"* (2011), David Chalmers distinguishes between shallow verbal disputes (easily resolved by clarification) and **deep verbal disputes**. A dispute is deep when the conflicting terms are tied to distinct theoretical roles or "clusters of concepts" that are central to the speakers' overall worldview. Chalmers acknowledges that even after the verbal nature is exposed, parties may resist switching frameworks because the concepts are "entrenched." However, Chalmers generally prescribes that the dispute *should* dissolve; he doesn't offer a specific name for the persistence of the disagreement itself.

  **B. Hirsch's "Phenomenology of Objectivity"**
  Eli Hirsch (e.g., *"Quantifier Variance and Realism"*) argues that ontological disputes feel substantive because of a **"phenomenology of objectivity."** Our language hooks onto the world in a way that makes our conceptual scheme feel like *the* scheme. Hirsch treats the persistence of the disagreement as an **illusion** to be cured by philosophical therapy. He would classify the residue you describe as a psychological failure to fully internalize the metaontological lesson, rather than a genuine philosophical category.

  **C. Conceptual Ethics and Engineering**
  The most promising literature for your phenomenon is found in **Conceptual Ethics** (work by Matti Eklund, David Plunkett, Stephen Finlay, and Cian Dorr). If two parties agree that an ontological question is framework-relative (Carnapian external), but continue to argue, they have likely shifted from a first-order ontological dispute to a **normative dispute about concepts**.
  *   The Platonist isn't saying "Numbers exist (fact)"; they are saying "The Platonist framework is *better* for mathematical practice (value)."
  *   The Nominalist is saying "The Nominalist framework is *better* for parsimony (value)."
  In this literature, this is often called a **disagreement in conceptual preference** or **theoretical virtue**. However, this describes the *content* of the residual disagreement, not the *phenomenon* of the disagreement surviving its own deflation.

  ### 2. Distinguishing Genuine Residue from Psychological Inertia

  You asked how the literature distinguishes genuine residual disagreement from a mere inability to let go. Since there is no settled term, the distinction is usually drawn along these lines:

  *   **Psychological Inertia (The "Hangover"):** This occurs when a party verbally assents to the metaontological deflation but continues to speak *as if* there were a fact of the matter. They say, "I know it's just a framework, but *really*, numbers exist." This is treated as a failure of philosophical consistency (a performative contradiction).
  *   **Genuine Normative Disagreement:** This occurs when the parties re-locate the dispute. They stop arguing about *existence* and start arguing about *utility, fruitfulness, or fidelity to practice*. This is a substantive disagreement about **theoretical virtues**. It is "genuine" because claims about which framework is *better* are truth-apt (or at least arguable) even if claims about which framework is *true* are not.

  ### 3. Coining a Term: "Metaontological Friction"

  Since the phenomenon lacks a canonical name, I propose the term **"Metaontological Friction."**

  **Definition:**
  > **Metaontological Friction** occurs when two parties explicitly accept a deflationary or metaontological account of their dispute (agreeing it is verbal, framework-relative, or pragmatic) yet maintain an adversarial stance. This friction is characterized by the persistence of the *feeling* of disagreement and the judgment that the opposing framework is *mistaken* (not merely different), grounded in competing assessments of theoretical virtue rather than fact.

  **Locating the Edges:**

  **A. The Compatibilist/Incompatibilist Case**
  Does the standoff between compatibilists and incompatibilists belong to this category?
  *   **Yes, if:** Both concede that "free will" is a term of art and that the choice depends on whether we prioritize *moral responsibility practices* (compatibilism) or *causal sourcehood* (incompatibilism). If they continue to argue that the other is "wrong," they are experiencing **Metaontological Friction**. They are no longer disagreeing about the causal structure of the universe (fact), but about which concept serves our normative practices better (value).
  *   **No, if:** One side insists that their definition captures the *only real* kind of freedom, denying the legitimacy of the other's framework. That is not friction; that is a refusal to accept the metaontological premise.

  **B. Asymmetric Residue**
  Can a dispute count if only one party feels the pull?
  *   **Yes.** We can call this **Asymmetric Metaontological Friction**. This often happens when a deflationist (Party A) debates a realist (Party B). Party A sees the dispute as verbal; Party B feels the friction intensely. In your specific scenario (where *both* accept the metaontological picture), the friction is **Symmetric**. Symmetric friction is philosophically more interesting because it suggests the disagreement has successfully migrated from ontology to axiology (value), yet retains the *heat* of ontology.

  ### 4. Why This Matters for Your Seminar

  Using the term **Metaontological Friction** allows you to make a precise intervention in the seminar. You can argue that the Carnapian distinction (Substantive vs. Verbal) is a binary that misses a third category: **Normatively Robust Verbal Disputes**.

  When the Platonist says the Nominalist is "doing violence to practice," they are not making an ontological claim. They are making a claim about **conceptual cost**. The friction persists because **theoretical virtues are themselves contestable**. Parsimony conflicts with Fidelity to Practice. Neither is a "fact" in the Carnapian sense, but both are legitimate grounds for disagreement.

  **Summary for your paper/discussion:**
  1.  **State the gap:** Standard metaontology treats verbal disputes as dissolving. It lacks a vocabulary for when they don't.
  2.  **Propose the term:** **Metaontological Friction**.
  3.  **Define the mechanism:** The dispute hasn't vanished; it has shifted from *first-order ontology* (what exists) to *conceptual ethics* (what concepts should we use), but retains the phenomenological intensity of the former.
  4.  **Apply:** Use the Platonist/Nominalist and Compatibilist cases as examples of Symmetric Metaontological Friction grounded in competing theoretical virtues.

  This framing respects the sophistication of your observation while giving you the terminological tools to deploy it rigorously.
