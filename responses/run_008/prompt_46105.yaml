answer: |-
  ### Desiderata for an Adequate Theory of Moral Progress

  **1. The Paradigm Constraint (The Abolition Test)**
  *   **Requirement:** The theory must classify the abolition of chattel slavery and the repudiation of systematic torture as moral progress, not merely functional shifts.
  *   **Motivation:** A theory that cannot condemn these practices without relying solely on contemporary preference fails to capture the normative force of "progress." It must provide grounds to tell the slaveholder they are *wrong*, not just *outdated*.
  *   **Tension:** This risks begging the question against the skeptic (see #7).

  **2. The Hypocrisy Distinction (Talk vs. Walk)**
  *   **Requirement:** The theory must distinguish between the proliferation of moral *vocabulary* (rights, dignity) and the actual *distribution* of welfare or respect.
  *   **Motivation:** Your granddaughter who champions strangers but neglects her children illustrates this. A theory must determine if universalizing rhetoric without intimate care constitutes progress, stagnation, or a specific kind of moral fragmentation.
  *   **Tension:** Conflicts with #3 if breadth is prioritized over depth.

  **3. The Breadth/Depth Trade-off**
  *   **Requirement:** The theory must account for the intensity of obligation (depth) versus the number of obligees (breadth).
  *   **Motivation:** The grandmother's deep, hierarchical loyalty vs. the granddaughter's shallow, universal scrupulosity. Progress cannot be defined solely by the widening circle if the center becomes too cold to sustain human flourishing.
  *   **Tension:** Hard to maximize both simultaneously; a theory favoring breadth may fail the "cold children" test.

  **4. The Power Independence Constraint**
  *   **Requirement:** The theory must distinguish between moral improvement and shifts in bargaining power or economic necessity.
  *   **Motivation:** If serfdom ended only because labor became scarce, was it moral progress or market adjustment? A theory must explain why the *result* is moral even if the *cause* was pragmatic.
  *   **Tension:** Conflicts with the Contract/Interdependence rival account, which may reduce morality to prudence.

  **5. The Barbarism Paradox (In-Group/Out-Group)**
  *   **Requirement:** The theory must explain episodes where internal morality gentled while external brutality intensified (e.g., Nazi Germany's animal protection laws concurrent with the Holocaust; colonial "civilizing" missions).
  *   **Motivation:** Moral refinement within a tribe can sharpen the knife used against the outsider. Progress cannot be linear if sensitivity to pain is selective.
  *   **Tension:** Challenges the "Expanding Circle" model if the circle can shrink or harden even while expanding elsewhere.

  **6. The Instrumentalization Warning**
  *   **Requirement:** The theory must identify when new machinery of cruelty is justified by the vocabulary of compassion (e.g., humanitarian intervention used for regime change; asylums that imprison).
  *   **Motivation:** Moral language can be co-opted to sanitize violence. Progress requires scrutiny of institutions, not just intentions.
  *   **Tension:** Risks cynicism that undermines #1.

  **7. The Skeptic's Challenge (Non-Question-Beggingness)**
  *   **Requirement:** The theory must define progress without simply defining it as "the values we currently hold." It requires an Archimedean point outside of current consensus.
  *   **Motivation:** To answer the character (or reader) who claims "we just like democracy more, not that it is better."
  *   **Tension:** **Critical Incompatibility:** Satisfying #1 (Objective Normativity) and #7 (Neutrality) simultaneously is the hardest philosophical lift. To prove slavery is objectively wrong (#1) usually requires premises the skeptic rejects (#7). A theory that satisfies #7 often lacks the teeth for #1.

  ***

  ### Scorecard

  Peter Singer's "Expanding Circle" fares well on Breadth (#3) and the Paradigm Constraint (#1), positing reason as the engine that pushes concern outward, but it struggles with the Hypocrisy Distinction (#2) and the Barbarism Paradox (#5), as reason can arguably justify exclusion as easily as inclusion, and it offers little defense against the Skeptic (#7) who rejects the premise that impartiality is binding. A Contract-driven or Interdependence account handles the Power Independence Constraint (#4) and the Instrumentalization Warning (#6) with sophistication, showing how rights emerge from mutual vulnerability, but it risks reducing morality to prudence, failing to explain why we owe duties to those with no bargaining power (failing #1). Finally, the Debunking or Power account excels at exposing the link between moral vocabulary and dominance (#6, #4), correctly identifying when "progress" is merely the self-description of victors, but it collapses entirely on the Paradigm Constraint (#1), rendering it unable to call slavery wrong, only "disfavored," thus surrendering the normative ground your novel seeks to test.
