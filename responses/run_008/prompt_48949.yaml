  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Status of Qualia, Introspection, and Phenomenal Character
  **Participants:** Proponent of Qualia Realism (PR) & Proponent of the Quining Qualia Programme (PQ)
  **Date:** October 26, 2023

  ## I. SUBSTANTIVE CLAIMS ACCEPTED BY BOTH PARTIES

  After one year of dialectical exchange, review of empirical literature, and analysis of thought experiments, we endorse the following claims as the common ground for our continued disagreement:

  1.  **Neural Supervenience:** There is no evidence for Cartesian dualism; phenomenal experience (however characterized) depends causally and constitutively on the functioning of the central nervous system.
  2.  **The Fallibility of Introspection:** Introspection is not a direct, infallible perception of inner objects but a cognitive process of judgment and reporting that is subject to error, bias, and memory degradation.
  3.  **The Chase-and-Sanborn Lesson:** Cases of gradual qualitative drift (e.g., the coffee tasters whose enjoyment fades imperceptibly over decades) demonstrate that the *apparent* stability of qualitative character is not guaranteed by introspection alone and relies heavily on stable discriminatory dispositions and memory comparisons.
  4.  **The Authority of Report:** For third-person science, the subject's sincere report of their experience is the primary data point; there is no "view from nowhere" that can override a subject's sincere claim about how things seem to them *at the time of reporting*.
  5.  **The Explanatory Target:** Any adequate theory of mind must account for why organisms make the phenomenal judgments they do (e.g., "This looks red," "This hurts"), regardless of whether those judgments track intrinsic properties or functional relations.
  6.  **The Inverted Spectrum Heuristic:** The inverted spectrum scenario is a valid tool for probing intuitions about the relationship between function and feeling, even if the parties disagree on its metaphysical possibility.

  ## II. TABLE OF RESIDUAL DISAGREEMENTS

  | (1) Point of Residual Disagreement | (2) Realist's Signed Formulation | (3) Quiner's Signed Formulation | (4) The Crux | (5) Agreed Test Case / Argument | (6) Advance Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Ontological Status of "What It's Like"** | The way an experience seems constitutes a fact *over and above* the subject's dispositions to discriminate, react, and report; this residue is the quale. | The way an experience seems is *exhausted by* the subject's complex dispositions to discriminate, react, and report; there is no residue. | **Functional Sufficiency:** Does a complete functional/physical explanation leave anything out? | **The Gradual Neural Swap:** Replacing neurons with functionally isomorphic silicon chips one by one. | **PR:** Phenomenal character could fade or invert while function remains constant.<br>**PQ:** If function (discrimination/report) remains constant, phenomenal character *just is* that function, so it cannot change. |
  | **2. The Nature of Ineffability** | Ineffability is an ontological feature of qualia; language is too coarse-grained to capture the intrinsic fine-grain of experience. | Ineffability is an epistemic defect of the subject's discriminatory capacity; we cannot report what we cannot distinguish or label. | **Granularity:** Is the limit in the *experience* or in the *access*? | **Perceptual Learning (Wine Tasting):** Training subjects to distinguish previously indistinguishable tastes. | **PR:** Training allows access to pre-existing fine-grained qualia via new concepts.<br>**PQ:** Training literally constructs new discriminatory pathways, creating new "qualia" (judgments) where none existed before. |
  | **3. The Inverted Spectrum Possibility** | It is metaphysically possible for two subjects to be functionally identical but have inverted qualitative experiences (e.g., red vs. green). | It is incoherent to posit an inversion that makes no difference to discrimination, behavior, or neural structure; "seeming" is relational. | **Internal Relations:** Is phenomenal identity determined internally or relationally? | **The Heterophenomenological Interrogation:** Rigorous cross-examination of a claimed inverter to detect subtle behavioral/neural asymmetries. | **PR:** Even perfect interrogation may fail to detect the inversion because it is purely internal.<br>**PQ:** If interrogation detects no difference (neural or behavioral), the claim of inversion is empty; there is no fact of the matter. |

  ## III. NOTE ON VERBAL DISPUTE

  We acknowledge that a portion of our residual dispute is merely verbal. Specifically, we disagree on the definition of the term **"Qualia."**

  *   **The Realist** uses "Qualia" to refer to the *intrinsic, non-representational properties* of experience.
  *   **The Quiner** uses "Qualia" to refer to the *traditional philosophical posit* (ineffable, intrinsic, private, immediate) which they reject, while admitting the existence of "conscious experiences" (understood as judgments/representations).

  We agree that if the Realist were to adopt the Quiner's definition of "experience" (as a judgmental capacity), they would still insist there is a "hard residue." If the Quiner were to adopt the Realist's definition of "Qualia," they would still insist such properties are incoherent. Therefore, the dispute is not *merely* verbal, but the verbal confusion obscures the precise locus of the metaphysical disagreement.

