  3.  **Critique of Existing Positions:**
      *   *Methodological Individualists (MI):* Argue macro reduces to micro + constraints. They treat aggregate expectations as just another micro-attitude. They miss the *constitutive* role of the aggregate in forming that attitude.
      *   *Holists:* Argue for emergent properties. They get the autonomy right but often rely on vague ontological claims ("social facts are real") rather than structural/functional analysis of the feedback loop.
      *   *The Gap:* Both assume a directional flow of explanation. Neither adequately models the *simultaneity* or *fixed-point* nature of coordination equilibria.

  4.  **Methodology (The 4-Month Plan):**
