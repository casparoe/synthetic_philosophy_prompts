  Based on your friend's track record, here are the predictions for the three new cases, followed by an analysis of the implicit rules governing her verdicts and how they diverge from the classical schools she cites.

  ### Predictions

  1.  **The Dead Bird (Revulsion without instruction):** **Inborn.**
      *   *Reasoning:* Her "Inborn" verdicts consistently hinge on the explicit absence of adult instruction ("never been told," "nobody discovered"). Since this case emphasizes that "no adult ever says a word," it triggers her primary heuristic for innateness.
  2.  **The Siblings (Loyalty without instruction):** **Inborn.**
      *   *Reasoning:* This mirrors the "toddler patting a playmate" case. It is an untaught, prosocial impulse that arises spontaneously between individuals. Despite loyalty potentially leading to exclusion (which a Xunzian might frown upon), the *source* of the behavior is unprompted nature, which she has consistently ruled as Inborn.
  3.  **The Weeping Adult (Empathy without action):** **Inborn.**
      *   *Reasoning:* She previously ruled "feeling wretched over a lie" as Inborn. That verdict prioritized the internal emotional state (conscience) over external correction. Here, the tears indicate the moral sentiment exists, even if the behavioral follow-through fails. She classifies the *sprout* of the response, not the harvest.

  ### The Competing Rules

  Two distinct rules fit her existing track record equally well, but they rely on different underlying logic:

  *   **Rule 1: The Epistemic Heuristic (The "Untaught" Rule).**
      *   *Logic:* A response is **Inborn** if the scenario explicitly rules out teaching or external enforcement. It is **Trained** if the behavior implies standard socialization or cultural norms.
      *   *Fit:* This explains every verdict. The "Inborn" cases all explicitly mention the lack of instruction ("never been told," "nobody discovered"). The "Trained" cases (bowing, queuing, modesty) imply standard cultural transmission without needing to explicitly state "they were taught this."
  *   **Rule 2: The Moral Domain Heuristic (The "Foundation" Rule).**
      *   *Logic:* A response is **Inborn** if it belongs to the core moral domains of **Care** (empathy) or **Fairness** (promise-keeping, honesty). It is **Trained** if it belongs to **Purity** (modesty), **Authority** (bowing), or **Order** (queuing).
      *   *Fit:* This also explains every verdict. Compassion, promise-keeping, and guilt are universal moral intuitions (Care/Fairness). Bowing, modesty, and queuing are cultural conventions or rituals (Authority/Purity/Order).

  ### The Deciding Case

  **Case 1 (The Dead Bird)** is the best test to distinguish these rules.

  *   **Under Rule 1 (Epistemic):** The verdict must be **Inborn**, because the prompt explicitly states the child was never taught about dirt or disease and no adult spoke to them. The absence of instruction is the deciding factor.
  *   **Under Rule 2 (Domain):** The verdict should be **Trained**. Revulsion at decay falls under the **Purity/Sanctity** foundation. In your friend's track record, "Modesty about the body" (also a Purity-related norm) was ruled **Trained**. If she is consistently classifying Purity norms as cultural conventions rather than universal morals, she should rule this as Trained, regardless of the lack of instruction.

  If she rules **Inborn**, she is following the Epistemic Heuristic (focusing on *how* the behavior arose). If she rules **Trained**, she is following the Moral Domain Heuristic (focusing on *what* the behavior is).

  ### The Settling Case

  If Case 1 leaves the matter open (for instance, if she hedges or argues that disgust is biological but not moral), the matter would be settled by a case of **Untaught Convention**:

  *   **The Case:** *Two children who invent a complex, arbitrary handshake or game rule and insist their peers follow it, despite no adult ever teaching it to them.*
  *   **The Split:**
      *   **Rule 1 (Epistemic)** predicts **Inborn** (because it was untaught).
      *   **Rule 2 (Domain)** predicts **Trained** (because it is a social convention/ritual, not a moral universal).
  *   **Why it Settles It:** This removes the confounding variable of biological instinct (disgust/loyalty) and isolates whether she values the *history of instruction* or the *type of norm* more highly.

  ### Departure from the Schools

  Your friend claims the **Xunzian** side, but her verdicts reveal she is actually operating as a **Modern Moral Psychologist** with a **Mencian** bias.

  1.  **Departure from Xunzi:** Xunzi argues that human nature is inherently self-interested and chaotic; *all* moral behavior (including empathy and fairness) is the result of conscious artifice and training (*wei*). By ruling empathy, promise-keeping, and guilt as **Inborn**, your friend contradicts Xunzi's core thesis. She accepts the Mencian view that moral "sprouts" exist naturally.
  2.  **Departure from Mencius:** Mencius argues that ritual propriety (*Li*)—such as respect for elders and proper conduct—grows naturally from the innate "heart of respect." Your friend, however, rules formal bowing and manners as **Trained**. She separates *moral sentiment* (Inborn) from *social ritual* (Trained), a distinction neither classical philosopher made so sharply. Mencius saw ritual as the flowering of nature; she sees it as a cultural overlay.

  In short, she is arguing like a 21st-century secular humanist (who believes in innate empathy but cultural rituals) while wearing the mask of a 3rd-century BCE Confucian realist. Her rule is not "Human Nature is Evil" (Xunzi), but rather "Human Nature is Good, but Culture is Complicated."
