answer: |-
  Dear Colleague,

  Your diagnosis of the money-pump literature is astute, and your hesitation to accept the textbook story without qualification is precisely where the most fruitful work lies. The fragility you identify regarding foresight, commitment, and transaction costs is not merely a technical nuisance but the central philosophical hinge upon which the normative force of the argument turns. Given your background in proof theory and axiomatic choice theory, you are uniquely positioned to treat these not as empirical contingencies but as formal constraints on the logic of agency. If I were to advise you on how to structure a three-year agenda that maximizes impact while leveraging your specific technical strengths, I would suggest a significant reordering of your provisional list, the rejection of one item, and the addition of a foundational question that you have not explicitly named but which underpins them all.

  I propose that you make your second question, concerning the rationality of blocking strategies like sophisticated and resolute choice, the primary focus of your first year and the anchor of the entire project. This is the most tractable entry point for someone with your logical training because it translates directly into problems of consistency, recursion, and modal logic. The debate between sophisticated choice, which relies on backward induction, and resolute choice, which relies on prior commitment, is essentially a debate about the logical structure of dynamic consistency and separability. By formalizing the conditions under which a sophisticated agent refuses to trade, you are engaging in a proof-theoretic analysis of the decision tree itself. This question deserves priority because it is the immediate obstacle to the money-pump argument; if sophisticated choice is rationally mandatory, the standard pump fails, and if it is forbidden, we need a formal proof of why. Downstream work in decision theory turns heavily on this, as dynamic consistency is a prerequisite for most normative models of planning. This question would move down in priority only if a definitive impossibility theorem were published showing that no coherent logic of sophisticated choice can be constructed without begging the question, but until then, it is the engine room of the debate. You should move it up if you find that the formal models of commitment yield a new class of vulnerability that mimics the original pump, as this would revitalize the exploitation argument immediately.

  Once you have established the formal behavior of the agent under these blocking strategies, you should proceed to your third question regarding over-generation and incomplete preferences. This serves as the critical validity check on your findings from the first stage. If the refined money-pump argument, adjusted for sophisticated or resolute choice, still implies that rational agents must have complete preferences, you have a powerful reductio ad absurdum, given the plausible cases for rational incompleteness. This is highly suitable for your background in axiomatic choice theory, as it involves testing the independence of axioms and the structural implications of preference relations. This question is second in order because its force depends on the mechanics of the pump being settled; you cannot know if the pump over-generates until you know exactly how the pump operates against a non-myopic agent. Downstream, this impacts welfare economics and social choice theory, where incomplete preferences are increasingly taken seriously. This question would move up in priority if recent work suggests that incomplete preferences are more vulnerable to exploitation than previously thought, potentially forcing a revision of standard choice axioms. Conversely, it would move down if you find that the blocking strategies successfully protect incomplete preferences without generating new pathologies, thereby neutralizing the worry.

  Your first question, concerning the derivation of diachronic norms from synchronic ones, should be treated as the theoretical synthesis of the project rather than the starting point. While you rightly identify it as upstream in a metaphysical sense, practically speaking, you cannot answer it without the formal results from the first two questions. For a logician, the existence of diachronic norms is best investigated by attempting to construct a representation theorem that reduces diachronic constraints to synchronic constraints on plans. If you can show that diachronic rationality is merely synchronic rationality applied to temporally extended objects, you dissolve the metaphysical worry without needing to settle deep meta-ethical disputes. This makes it tractable for you, whereas a purely normative inquiry might drift beyond your expertise. This question belongs third because it is the conclusion you draw from the formal work, not the premise you begin with. It would move up if you encounter a formal barrier proving that no such reduction is possible, which would force you to confront the metaphysics directly. It would move down if the reduction proves trivial, in which case the philosophical interest diminishes.

  Regarding your fourth question on de-idealisation and bounded agents, I advise you to integrate this into your work on blocking strategies rather than treating it as a separate research strand. A full empirical investigation into cognitive costs falls outside your strengths and risks diluting the formal rigor of your agenda. However, modeling computational cost as a parameter within your logical framework—perhaps treating backward induction as a resource-intensive operation—is a promising way to address boundedness without leaving axiomatic theory. If you can show that the money-pump argument fails only when computational costs are zero, you have a powerful result. You should drop this as a standalone empirical question but keep it as a formal constraint. If you find that even minimal cognitive costs block the pump, this moves the issue of boundedness up to primary importance.

  I recommend that you drop your fifth question concerning the unification of money-pump and Dutch-book arguments entirely for this fellowship. While elegant, this is a lifetime project that risks becoming too speculative for a three-year term. The literature on probabilism and the literature on preference coherence operate with different structural assumptions, and bridging them requires settling the foundational issues of the money-pump argument first. Pursuing this now would likely result in a broad but shallow treatment that fails to resolve the specific fragilities you have identified. You should return to this only after you have secured a robust account of diachronic preference rationality.

  There is, however, a question you have not listed that belongs above all of them, and that is the ontological status of the planning agent. The money-pump argument assumes a tension between the agent at time one and the agent at time two, but it rarely specifies whether these are distinct entities or stages of a single entity. This question underpins your first and second questions because the rationality of commitment depends on whether the agent has the authority to bind its future selves. For a logician, this can be framed as a problem of identity over time within a formal system. If the agent is a sequence of selves, sophisticated choice looks like game-playing between distinct players; if the agent is a single extended entity, resolute choice looks like consistency. Settling this formal ontology is prerequisite to determining which blocking strategies are permissible. I suggest you make this the silent partner to your work on blocking strategies, as it provides the metaphysical grounding for your formal models.

  In summary, your three years should be dedicated to reconstructing the logic of diachronic choice. Begin by formalizing the blocking strategies to test the mechanical viability of the pump, then test the scope of the resulting argument against incomplete preferences, and finally synthesize these results into a account of diachronic norms grounded in the ontology of the planning agent. This agenda respects your technical strengths, addresses the fragility you identified, and produces a cohesive body of work rather than scattered interventions. If you can demonstrate that the money-pump argument survives only under specific logical conditions regarding agency and commitment, you will have advanced the debate significantly beyond the textbook story. I look forward to seeing where this line of inquiry takes you.
