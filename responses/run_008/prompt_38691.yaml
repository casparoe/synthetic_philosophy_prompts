  My credence on the proposition is **0.75**.

  (a) **0.85** — Causation is best modeled as invariant counterfactual dependence, which can be satisfied at higher levels even if lower levels are physically closed.
  (b) **0.90** — The thought experiment explicitly constructs simmballs as stable attractors, ensuring the macro-pattern survives micro-perturbations of the simms.
  (c) **0.25** — While definitions vary, the difference in predictive robustness and control between levels constitutes a functional fact, not merely semantics.

  **Combination:** I treat (a) and (b) as necessary conditions for genuine high-level causation and (c) as a defeater; since I find level-relativity highly plausible and the setup robust by design, I discount the deflationary view, landing well above your 0.6 but acknowledging the metaphysical stickiness that keeps me from 1.0.

  **Where the disagreement lives:** Almost entirely in **term (a)**. Your friend (0.15) is operating on a principle of *Causal Exclusion* (if the marbles determine the future, nothing else can), whereas you and I are operating on *Causal Compatibilism* (higher levels can capture dependencies the lower level obscures).

  **Most sensitive term:** **(a)**. If you concede that causation *must* be fundamental to be real, my number collapses to your friend's 0.15 instantly; nothing else matters if the ontology doesn't permit it.

  **What would shift it:** A demonstration of **causal divergence**: show a case where two distinct micro-states (simm arrangements) necessarily lead to *different* macro-outcomes (simmball movements) despite identical macro-initial conditions, proving the higher level lacks causal closure.
