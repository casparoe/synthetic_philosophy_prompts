  ### Analyzing the Disagreement: You, Your Friend, and Me

  First, a clarification on the numbers: You state your friend thinks superrationality is "seductive nonsense" but assign her a credence of 0.9. I am interpreting this to mean she has **0.9 credence that it is nonsense** (i.e., ~0.1 credence it is correct). If she actually believed it was correct with 0.9 probability, she wouldn't call it nonsense. Assuming she is a skeptic (0.1) and you are a hesitant skeptic (0.45), you are actually on the same side of the debate, merely arguing over the *degree* of plausibility.

  **Where you are talking past each other:**
  Your disagreement is not primarily about causation versus evidence, though that is the language you are using. It is upstream, concerning the **ontology of the agent**.

  1.  **Your Friend's View (Physicalist/CDT):** She views the agent as a *physical body* located in spacetime. For her, "influence" requires energy transfer (a telegram, a signal, a force). Since your decision cannot physically reach the other 19 people, treating your choice as evidence of theirs is, to her, a category error akin to believing voodoo dolls work. Her 0.9 confidence comes from the robustness of physical causality in every other domain of her life.
  2.  **Your View (Hesitant Functionalist):** You suspect the agent is a *pattern* or *computation*. You recognize that if the reasoning is identical, the conclusion must be identical, creating a "logical channel." However, your 0.45 credence shows you are haunted by the lack of a *mechanism*. You want to believe the math, but you can't shake the feeling that without a causal lever, you are powerless.
  3.  **The Upstream Question:** You are arguing about what the word **"rational"** is supposed to track.
      *   For your friend, rationality is **instrumental control**: "What action can I take to physically manipulate the world to my benefit?" In a one-shot game with no causal leverage, the answer is "Nothing," so any strategy expecting a different outcome is irrational.
      *   For the superrationalist, rationality is **algorithmic alignment**: "What output should my decision-function produce to maximize utility, given that identical functions produce identical outputs?"

  **Why the gap persists:**
  You are stuck at 0.45 because you are trying to reconcile the Functionalist math with the Physicalist intuition. You want the "magic" to have a mechanism. Your friend is at 0.9 (skepticism) because she refuses to grant the Functionalist premise at all.

  To move your friend, you wouldn't show her more math; you would have to convince her that **logical necessity is a form of causality**. To move yourself from 0.45 to my 0.62, you need to accept that in a one-shot symmetric dilemma, "causality" is the wrong metric entirely. The constraint isn't "Can I change their behavior?" but "Is my behavior logically distinct from theirs?" If the answer is no, then maximizing utility *requires* acting as if you control the group, not because you have a magic wand, but because you *are* the group, computationally speaking.
