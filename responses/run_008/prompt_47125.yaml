      *   **Tension A (The Procedural Conflict): (4) vs. (5).**
          *   *Conflict:* (4) proposes automatic expiration (low effort to remove). (5) argues street renaming has high costs and needs a high bar. If a street name sunsets, do you force residents to change addresses just because of a calendar date?
          *   *Severity:* High. It creates a direct policy contradiction.
