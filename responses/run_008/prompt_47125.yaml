      *   *(1) vs. (2):* Honor is present-tense vs. Whole-life judgment.
          *   *Tension:* If it's purely present-tense (1), why do we care about the whole life (2)? Actually, they align well. We honor the *person* now, so we need to know the *whole person*.
          *   *Verdict:* Low tension.

      *   *(1) vs. (3):* Honor is present-tense vs. Judge by past standards.
          *   *Tension:* If it's a *present-tense* honor (1), shouldn't we judge by *present* standards? Principle (3) says judge by *past* standards. This is a major philosophical clash. If I'm honoring them *now*, why does it matter what *then* thought?
