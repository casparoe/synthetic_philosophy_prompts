          *   *Tension:* If I judge the whole life, do I weigh the bad acts by their era's standards? (3) says yes. (2) says look at everything. They work together, but (3) limits the "bad" found in (2).
          *   *Verdict:* Low tension (Complementary).

      *   *(2) vs. (4):* Whole-life judgment vs. Sunset clause.
          *   *Tension:* (2) implies a deep, careful historical audit. (4) implies passive removal if no one cares. If a figure passes the "whole-life" test today, should they disappear in 50 years just because no one showed up to a meeting?
          *   *Verdict:* Moderate tension (Rigorous Judgment vs. Administrative Convenience).

      *   *(3) vs. (4):* Era standards vs. Sunset clause.
          *   *Tension:* (3) is about *historical justice* (don't judge past by present). (4) is about *present relevance* (do we still care?). If a figure was fine by their era's standards, but we just forget them, (4) removes them. Is that unjust?
          *   *Verdict:* Low tension. (4) bypasses the judgment of (3).

