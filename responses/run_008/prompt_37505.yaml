answer: |-
  ### The Matched Pair

  **Setting:** A high-stakes corporate law firm during a partner review meeting.

  **Case 1: The Weaponized Neutral**
  During a review of junior associates, Senior Partner Vance refers to Henderson, a highly competent associate from a working-class background, as a "charity case." Vance knows Henderson earned their spot, but the firm culture prizes elite pedigree. Vance says, "Henderson's billables are fine, but let's be honest, he's a charity case; we keep him for optics." The room goes silent. Henderson stops taking notes (silencing). Two other associates later confront Vance, saying, "You can't talk about him like that; it's not just criticism, it's degrading." The term "charity case" has no history of oppression, no taboo lexicon, and literally means "recipient of aid." Yet, in this context, it functions exactly like a slur: it essentializes Henderson as inferior, excludes him from the professional in-group, and triggers bystander intervention based on the offensiveness of the *act*, not the word.

  **Case 2: The Neutralized Slur**
  Later that week, two senior female partners, Ross and Chen, are strategizing against a hostile opposing counsel. Ross says, "We need to be absolute bitches in that deposition, or they'll walk all over us." Chen replies, "Agreed. You're the biggest bitch in the firm, that's why you're lead counsel." They laugh and shake hands. No one is offended; no silencing occurs; no bystanders intervene. The word "bitch" is undeniably a slur with a history of misogynistic oppression. However, here it is understood as a marker of necessary ruthlessness and professional competence. The derogation is absent not because the audience is confused, but because the conversational goal is solidarity and praise for toughness, not contempt for gender.

  ***

  ### Theoretical Walkthrough

  **1. The Semantic Content View**
  *   **The Claim:** Derogation is part of the truth-conditional content or lexical entry of the word.
  *   **Case 1 (Strain):** This view collapses. "Charity case" does not have "inferior human" in its lexical entry. To explain the offense, the semanticist must argue the word *changed its meaning* in that room. But if meaning changes that fast based on use, semantics bleeds into pragmatics. They are forced to posit a "local semantics" that looks suspiciously like an implicature.
  *   **Case 2 (Strain):** This view also struggles. If "bitch" semantically encodes contempt for women, Ross and Chen's conversation should be semantically contradictory (praising someone by calling them contemptible). The semanticist must argue the word is ambiguous (like "bank"), but there is no evidence of a separate lexical entry for "tough bitch" vs. "slur bitch." They have to stipulate a new sense to avoid the contradiction.
  *   **Verdict:** High strain on both. The view cannot explain how neutral words gain slur-force or how slur-words lose it without ad hoc semantic shifting.

  **2. The Expressivist View (Conventional Implicature)**
  *   **The Claim:** The word conventionally expresses a negative attitude (contempt) toward the target group, independent of truth conditions.
  *   **Case 1 (Strain):** Similar to semantics. "Charity case" has no conventional expressive content. The expressivist must argue the *context* generated a "local convention." This weakens the idea that the expression is *conventional* (stable across contexts).
  *   **Case 2 (Strength/Nuance):** Expressivists have a stronger move here than often credited. Sophisticated expressivists (e.g., Copp, Anderson) argue that reclamation *changes the convention* within a group. If Ross and Chen are part of a sub-community that has reclaimed "bitch" to mean "tough," the conventional implicature has genuinely shifted for them.
  *   **The Strain:** However, in Case 2, Ross and Chen aren't necessarily "reclaiming" in the political sense; they are using it instrumentally. If the expressivist says the convention *always* fires, they can't explain why no offense is taken. If they say the convention *can be suspended*, they are admitting the force is pragmatic (cancellable), not conventional (non-cancellable).
  *   **Verdict:** Moderate strain. They handle Case 2 better than semanticists via reclamation theory, but Case 1 remains a major problem (neutral words don't have expressive conventions to begin with).

  **3. The Pragmatic View (Implicature/Use-Based)**
  *   **The Claim:** Derogation is a conversational effect generated by the speaker's intent, audience uptake, and shared norms (Gricean maxims or Scorekeeping).
  *   **Case 1 (Strength):** This is the pragmatic home turf. Vance violates the maxim of Relation or Manner to imply Henderson doesn't belong. The offense arises because the audience infers Vance is expressing contempt *via* the description. The word is just the vehicle; the insult is the ride.
  *   **Case 2 (Strength):** Equally strong. The literal content (female dog/derogatory woman) is overridden by the conversational goal (solidarity/strategy). The audience recognizes the intent is praise, so the derogatory implicature is cancelled or replaced by a "toughness" implicature.
  *   **The Strain:** The prompt warns against "intent explains everything." The pragmaticist must ensure this isn't just psychology. The defense is that the *norms* of the firm allow "bitch" as praise in Case 2 but forbid "charity case" as critique in Case 1. It's about public rules of the conversation, not private minds.
  *   **Verdict:** Low strain. Handles both cases by locating the force in the *use*, not the *word*.

  ***

  ### Critical Evaluation

  **The Single Feature Doing the Work**
  The discriminating feature is **Illocutionary Point relative to Shared Norms**.
  In both cases, the literal meaning of the words is stable. What changes is what the speakers are *doing* with the words (insulting vs. strategizing) and whether the conversational participants share the norms that license that move. In Case 1, the norm is "pedigree matters," so "charity case" insults. In Case 2, the norm is "winning matters," so "bitch" praises. The pragmatic account captures this because it treats meaning as action. The semantic and expressivist accounts treat meaning as a property of the tool, which makes it hard to explain why the same tool builds a house in one scenario and breaks a window in the other.

  **What Happens If You Remove It?**
  If you remove the shared normative context (e.g., if the associates in Case 2 didn't share the "toughness" norm), Case 2 collapses into offense. If the firm in Case 1 didn't prize pedigree, "charity case" would just sound confused, not insulting. This confirms the force is external to the word. If the force were semantic, the offense in Case 1 and the neutrality in Case 2 would persist regardless of the room's norms.

  **How a Committed Semanticist Would Attack**
  A sophisticated semanticist (specifically a **Contextualist**) will not deny the data but will reinterpret the mechanism. They will argue: *"You haven't proven this is pragmatics. You've proven that semantic content is context-sensitive. In Case 1, 'charity case' semantically means 'inferior' relative to the context of evaluation. In Case 2, 'bitch' semantically means 'tough' relative to the context of the feminist in-group. The lexicon is flexible."*
  They will attack the pragmatic view by claiming it cannot explain **embedding**. If I say, "If Vance calls him a charity case, Henderson will quit," the conditional seems to carry the derogatory weight even without Vance asserting it. A pragmatic implicature usually cancels in embeddings; a semantic content does not. If the derogation projects through logical operators, the semanticist claims victory.

  **Does the Pair Secretly Favor the Semantic Side?**
  **Yes, potentially.**
  If the "charity case" insult in Case 1 feels *inescapable* (i.e., you can't cancel it by saying "I don't mean he's inferior"), it behaves like semantic content. If the "bitch" praise in Case 2 feels like a stable, coded meaning within that law firm (a local dialect), the semanticist can argue these are just context-dependent lexical entries.
  However, the pair favors **Pragmatics** if you can show **cancellability**.
  *   *Test:* In Case 1, if Vance adds, "...by which I mean he received financial aid, not that he's incompetent," does the offense vanish? If yes, it's pragmatic. If the offense remains ("He's still calling him a charity case!"), it's semantic/expressive.
  *   *Test:* In Case 2, if Chen says, "I don't mean that as a compliment," does it become an insult? If yes, the default force is derogatory (semantic/expressive), and the praise was the exception.

  **Final Recommendation:** To secure the pragmatic defense, you must explicitly argue that the *offense* in Case 1 is cancellable (even if socially difficult) and the *neutrality* in Case 2 is fragile (dependent on the specific conversational score). If you concede the force is "baked in" even for "charity case," you hand the semanticist the weapon they need. The pragmatic account wins only if the derogation is shown to be a **risk of use**, not a **property of the word**.
