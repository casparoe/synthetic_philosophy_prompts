      *   **The 2024 Vote Nuance:** They didn't vote down the *idea* that humans changed the planet. They voted down the *specific technical proposal* to carve it into the rock record as a new epoch *right now*. It might still happen later, or be defined differently.
      *   **AP Enviro Context:** In AP Enviro, the *concept* matters more than the *stratigraphy*. The curriculum focuses on human impact, regardless of the epoch name.

