answer: |-
  Here is the teaching plan for your fifty-minute section.

  Begin the section by establishing the boundary between what ZF proves and what it does not. Open with finite choice. Remind students that for any finite family of non-empty sets, ZF proves a choice function exists via induction and the pairing axiom. Write this explicitly on the board: $\forall n \in \mathbb{N}, \forall \mathcal{F} (|\mathcal{F}| = n \land \emptyset \notin \mathcal{F} \implies \exists f: \mathcal{F} \to \bigcup \mathcal{F} \dots)$. This must happen before any mention of the Axiom of Choice to prevent the misconception that AC is about finite families. Once finite choice is secured as a theorem, introduce the break: induction does not bridge the gap to infinity. This is the moment to address the misconception that "choosing from one set and choosing from infinitely many simultaneously is the same problem." Explain that while we can pick from one set existentially, doing so for an infinite family requires a single set-theoretic object (the function) that contains all selections at once.

  Next, provide the formal statement of the Axiom of Choice (AC). Define it strictly as an existential claim about a function: For every family of non-empty sets, there exists a function $f$ such that for every set $S$ in the family, $f(S) \in S$. This formalism is your primary defusal for the misconception that "the axiom says someone actually picks, at a moment in time." Emphasize that AC asserts the *existence* of the set of ordered pairs constituting the function, not a physical or temporal process of selection. Once the formalism is grounded, introduce Russell's shoes and socks example. This example must carry the weight of the section, but you must frame it carefully to avoid the trap of physical impossibility. State clearly: the socks are not physically indistinguishable, but they lack a *definable property* within the language of set theory that distinguishes one from the other in each pair. The shoes have a definable property ("leftness"); the socks do not. This distinction clarifies that AC is about the existence of a function when no defining rule is available, not about human inability to grab objects. Use this to reinforce that without AC, we cannot prove the set of chosen socks exists, even though every pair is non-empty.

  After solidifying the intuition, move to the equivalents. Introduce the Well-Ordering Theorem and Zorn's Lemma. You must state explicitly that these are logically equivalent to AC in ZF, not stronger principles. This addresses the misconception that "Zorn's lemma is a different, stronger principle than AC." When discussing the Well-Ordering Theorem, immediately confront the misconception that "the reals can't be well-ordered because the positive reals have no least element." Clarify that AC guarantees the existence of *some* ordering relation $\prec$ under which $\mathbb{R}$ is well-ordered, not that the standard ordering $<$ is a well-ordering. This distinction is vital for their future analysis courses. At this stage, briefly mention Countable Choice (AC$_\omega$) and Dependent Choice (DC). Acknowledge that these are the principles they have likely been silently using in analysis (e.g., constructing sequences recursively), but distinguish them from Full AC, which applies to uncountable families. This validates their prior intuition while marking the boundary of the current course's scope.

  Regarding the topos-theoretic note that full choice implies excluded middle: omit this entirely. While true, it introduces logical nuance that distracts from the set-theoretic existence questions central to a third-year foundations course and risks conflating classical logic issues with choice principles. Similarly, omit Banach–Tarski and independence proofs. Banach–Tarski requires too much measure theory setup for fifty minutes, and independence proofs require forcing or model theory beyond their current toolkit.

  Conclude the section with a comprehension question in the last five minutes. Ask: "Consider the family of sets $A_n = \{2n, 2n+1\}$ for each $n \in \mathbb{N}$. Do we need the Axiom of Choice to guarantee a choice function exists for this family? Why or why not?" The correct answer is no, because the integers are well-ordered, allowing a definable rule (pick the minimum). This tests whether they understand the Shoes vs. Socks distinction and the role of definability versus mere existence.

