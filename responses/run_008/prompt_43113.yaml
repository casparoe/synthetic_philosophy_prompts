answer: |-
  My credence that refusing free, reliable, decision-relevant information can be rational in a one-person case is **0.20 (20%)**.

  I am siding closer to your friend than to you, but I am not in the 0.05 camp. Good's Theorem is mathematically robust within its domain, but I believe the domain is narrower than your friend assumes, and alternative normative frameworks are more plausible than he allows.

  Here is the decomposition of that 0.20:

  **1. The "Fixed-Utility" Assumption (0.12 contribution)**
  *   **Probability that utilities genuinely depend on knowledge states (not just outcomes): 0.15.**
      *   I assign a 15% chance that a rational agent's utility function *principally* includes states of knowledge (e.g., $U(\text{Healthy}, \text{Ignorant}) > U(\text{Healthy}, \text{Know})$). This is not just a "cost" like time or money; it is a fundamental feature of the outcome space.
  *   **Probability this is just "unmodeled costs" vs. principled failure: 0.80 vs 0.20.**
      *   Most "spoiler" cases are best modeled as the information having a negative utility component (a cost). If "free" means "zero transaction cost" but allows "negative utility impact," then refusal is rational, but Good's Theorem isn't violated—it just doesn't apply because the info isn't utility-free.
      *   However, I assign a **0.03** probability that this represents a genuine failure of the fixed-utility assumption (i.e., the utility function itself shifts upon learning, rather than just selecting a different outcome from a fixed set).
      *   **Net Contribution:** $0.15 \times 0.80$ (refusal rational due to intrinsic disutility) = **0.12**. (Note: I count this as "rational refusal" even if it's technically a cost, because in common parlance, a genetic test is "free info" even if it hurts).

  **2. Non-EU Theories (REU/Risk-Sensitivity) (0.07 contribution)**
  *   **Probability that Risk-Weighted Expected Utility (or similar) is normatively permissible: 0.25.**
      *   I think there is a serious case that strict linearity in probabilities (EU) is not a requirement of rationality. Lara Buchak's work is compelling.
  *   **Probability that, given REU, refusing info is a feature not a bug: 0.70.**
      *   If REU is correct, info aversion is a standard feature for sufficiently risk-averse agents.
  *   **Probability that dynamic consistency worries kill this advantage: 0.60.**
      *   There is a significant risk that REU agents are dynamically inconsistent or Dutch-bookable in ways that make the "rationality" of refusal unstable.
      *   **Net Contribution:** $0.25 \times 0.70 \times (1 - 0.60)$ = **0.07**.

  **3. Other Edge Cases (0.01 contribution)**
  *   Logical uncertainty, self-locating belief, or cases where the *processing* of info forces a belief update that lowers expected utility by current lights (e.g., evidence of your own irrationality).
  *   **Net Contribution:** **0.01**.

  **Total:** $0.12 + 0.07 + 0.01 = 0.20$.

  ***

  ### The Core Disagreement
  You and your friend are mostly fighting over **Term 2: The Normative Status of Expected Utility.**

  *   **Your Friend** assumes EU is the *only* rational framework. If EU is the only game in town, and you define "free" as "zero utility cost," his 0.05 is basically correct (allowing only for modeling errors).
  *   **You** are intuitively grasping that EU might not be the whole story (REU) or that the "outcome" definition is too narrow (knowledge states).
  *   **The Fight:** It looks like you're arguing about "spoilers" (Term 1), but that's a semantic dispute about the definition of "free." The substantive philosophical disagreement is whether **Risk-Weighted preferences are rational.** If EU is mandatory, your 0.4 is too high. If REU is permissible, your friend's 0.05 is too low.

  ### What Would Move My Number
  The single thing that would move my credence the most is a **Dutch Book argument that specifically targets information aversion in REU.**

  *   **Move to 0.05:** If it were proven that an REU agent who refuses free information is necessarily susceptible to a Dutch Book *that cannot be avoided by changing the decision rule*, I would drop my credence in REU's permissibility, collapsing my number toward your friend's.
  *   **Move to 0.50+:** If a robust defense of REU showed that dynamic consistency can be maintained *while* allowing info-aversion (e.g., via a sophisticated choice mechanism), I would increase the weight on Term 2 significantly.

  **Verdict:** Your friend wins on the strict math of EU. You win on the broader philosophy of what counts as a "rational agent." My 0.20 splits the difference: Good's Theorem holds for EU agents with utility over final states, but that describes a smaller slice of rational possibility space than your friend thinks.
