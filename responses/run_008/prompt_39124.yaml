          2.  **Analogy:** The dovetail is static; persistence is causal/asymmetric. The baton implies a "thing" (the pattern) which risks reifying the soul. The joint analogy works for *connection* but fails for *direction*.
          3.  **Attack Point:** The Blame paragraph. It asserts responsibility transfers without explaining *why* moral properties stick to causal joints. The "stress travels" line is a metaphor, not a justification.
