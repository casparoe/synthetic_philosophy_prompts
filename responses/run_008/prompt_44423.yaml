prompt: |-
  After years of passive index investing, I've recently taken over managing a small portion of my family's savings, and position sizing has become a very concrete question for me rather than an academic one. I understand that the Kelly criterion recommends the bet fraction that maximizes expected log wealth, and I've also come across the "ergodicity economics" line of argument, according to which ordinary expected-value reasoning is simply inappropriate for individuals, because a single person lives through one time series rather than an ensemble of parallel possible worlds. What I cannot untangle is this: if my utility for money happens to be logarithmic, then maximizing expected utility and betting Kelly amount to the same thing, so what exactly is the ergodicity argument supposed to add? Is it a genuine rival to expected utility theory, or does it quietly presuppose a log-utility assumption and then present itself as an assumption-free derivation of that same assumption? There is a related point that I also want cleared up: I've seen it claimed that Kelly's long-run dominance only manifests over many repeated bets, so that in a genuinely one-shot situation the Kelly recommendation collapses into an arbitrary choice of how risk-averse to be, no better justified than any other concave utility function. Please explain, in plain terms, where a Kelly bettor and an expected-utility maximizer genuinely disagree and where the disagreement is merely bookkeeping, and tell me what practical conclusion, if any, follows for someone sizing positions in a real account. Please write in continuous prose only, with no headings, bullet points, bold text, or tables.
