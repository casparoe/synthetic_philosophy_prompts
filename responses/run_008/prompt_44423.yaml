      *Middle:* The core insight of ergodicity economics is that most financial processes are non-ergodic, meaning the average outcome across many parallel universes does not match the average outcome experienced by one individual over time. When wealth evolves multiplicatively through compounding returns, the ensemble average expected value can be positive while the time average growth rate is negative, leading to eventual ruin for the individual investor despite the favorable odds. Ergodicity economics posits that rational agents should maximize the time-average growth rate rather than the ensemble average expected value. For multiplicative dynamics, maximizing the time-average growth rate mathematically requires maximizing the expected logarithm of wealth. Therefore, ergodicity economics does not quietly presuppose logarithmic utility as an arbitrary assumption but rather derives it as a necessary condition for survival and growth in a compounding environment. It shifts the justification from I prefer log utility to I must use log utility if I want my wealth to grow over time without going bankrupt. This is a genuine conceptual addition because it removes the burden of proving why an investor should be risk-averse from the realm of psychology and places it in the realm of statistics and dynamics.

