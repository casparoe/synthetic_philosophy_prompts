      *   *One-shot:* In a single bet, the time average doesn't converge. You either win or lose.
      *   *Disagreement:* A strict EUT maximizer with log utility will still bet Kelly in a one-shot scenario because they maximize $E[\ln(W)]$. A strict ergodicity proponent might argue that without repetition, the time-average growth rate is undefined or irrelevant, so the criterion loses its force. However, most practical Kelly users apply it because they view investing as a repeated game (even if the specific trades differ, the process repeats).
      *   *Nuance:* If you truly face a one-off bet that affects your entire financial life, full Kelly is often too aggressive due to estimation error and utility curvature beyond log (e.g., needing a minimum threshold for survival).
      *   *Practical implication:* Investing is rarely a true one-shot. It's a sequence. But estimation error makes full Kelly dangerous.

  5.  **Synthesize the "Disagreement vs. Bookkeeping" Aspect:**
      *   *Bookkeeping:* If an EUT agent has log utility, their math is identical to Kelly. The position size is the same.
