      *   **Ergodicity Economics:** Argues that ensemble averages (expected value across parallel worlds) are irrelevant for individual decision-making over time. Instead, one should look at the time average growth rate. For multiplicative dynamics (like investing), the time average growth rate is the geometric mean, which corresponds to the log utility maximization.
      *   **The Conflict/Confusion:** The user suspects Ergodicity Economics is just deriving log utility from dynamics rather than assuming it as a preference. They also question Kelly's applicability in one-shot scenarios.

  3.  **Address the Ergodicity vs. EUT Question:**
      *   *EUT Perspective:* Log utility is a *preference*. You like money, but with diminishing marginal utility. You choose log because you are risk-averse in a specific way.
      *   *Ergodicity Perspective:* Log utility is a *property of the system*. If wealth evolves multiplicatively (compounding), the time-average growth rate is defined by the log. You don't need to assume a preference; you need to assume you want to grow wealth over time in a non-ergodic system.
      *   *Is it a rival?* It's a foundational critique. EUT says "choose a utility function based on psychology." Ergodicity says "choose a utility function based on the dynamics of the process to ensure survival/growth."
      *   *Does it presuppose log?* It presupposes multiplicative dynamics. If the dynamics are additive, ergodicity leads to linear utility (maximize expected value). So it's not assuming log utility *a priori*, it's deriving it from the structure of wealth evolution (compounding).
