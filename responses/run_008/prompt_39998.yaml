      *   *Conceptual Upshot:* Retrospective reports cannot be treated as objective logs of perceptual awareness. Legal/ethical frameworks relying on "moment of awareness" (for liability, reaction time standards) are built on a folk-psychological misconception of how consciousness works. It implies we should be skeptical of subjective temporal testimony in high-stakes temporal judgments.

