      *   *Current Practice:* Many studies ask subjects "When did you see X?" and try to match that timestamp to neural activity (e.g., Libet-style experiments, masking studies).
      *   *Dennett's Challenge:* If the subjective timestamp is a retrospective construction (a "draft" created at the time of reporting), then correlating it with earlier neural events assumes a causal chain that might not exist in that linear form.
      *   *Conceptual Upshot:* It undermines the validity of using subjective timing reports as a "ground truth" anchor for neural data. If there is no fact of the matter about *when* the experience occurred, searching for the *neural moment* of consciousness is chasing a phantom. It suggests NCC research needs to shift from finding a "threshold moment" to mapping the distributed processes that enable the *report* of consciousness.

