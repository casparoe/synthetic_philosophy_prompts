      *   *Traditional View:* There is a "Cartesian Theater" where things happen. Either the edit happens before the show (Stalinesque) or after the show (Orwellian).
      *   *Dennett's MDM:* There is no single place or time where consciousness "happens." There are multiple parallel streams of processing (drafts). A report is just another draft.
      *   *The Claim:* Asking *when* a content became conscious is like asking *where* the center of gravity of a cube is located in the air. It's a category error. The distinction between Orwellian and Stalinesque presupposes a definitive moment of consciousness that doesn't exist.
