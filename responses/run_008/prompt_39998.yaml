  Please describe the most important implications of Dennett's claim that, for phenomena like the color phi illusion, there may be no fact of the matter distinguishing an Orwellian account (the experience occurred as it seems, and memory of it is later revised) from a Stalinesque account (the brain delays and edits before consciousness of anything arrives), so that asking exactly when a content first became conscious can be ill-posed. I am particularly interested in what this means, given the multiple drafts model, for (1) research that tries to correlate subjects' retrospective timing judgments with neural events, as in the search for the neural correlates of consciousness, and (2) practical settings where a confident retrospective report is treated as fixing when someone became aware of something, such as a driver's account of a momentary hazard. Please focus on the conceptual upshots rather than the empirical details of any particular study, and conclude with a one-sentence summary of your answer given in the form \answer{...}.
