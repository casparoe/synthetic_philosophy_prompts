prompt: |-
  I'm a software engineer, no philosophy background, but I keep bumping into metaethics arguments online and the expressivism one finally clicked for me in programmer terms: moral claims are like statements with side effects rather than expressions that evaluate to values. Saying "lying is wrong" is more like print-shaming someone than like returning a boolean. Restate the Frege-Geach problem for expressivism in the vocabulary I actually use -- expressions vs statements, side effects, evaluation order, lazy evaluation, macros vs functions, and how a compiler or interpreter gives an AST node its meaning compositionally from its children. As I understand it, the problem is that these non-truth-claiming things get embedded in conditionals and arguments, e.g. if lying is wrong, then getting your little brother to lie is wrong, and the compound's meaning is supposed to be built out of the parts' meanings. Translate the whole problem into my terms as faithfully as you can, then give me the residue report: which parts of the philosophical debate map cleanly onto how real languages embed side-effectful statements (or fail to), which parts I'm implicitly distorting by using the compiler metaphor, and which parts have no counterpart in my vocabulary at all. And tell me whether that residue is my vocabulary missing something or the philosophers' problem being fuzzier than it looks. For the record my hunch is it's all just lazy evaluation, but I suspect that hunch is exactly the kind of thing that's missing something.
