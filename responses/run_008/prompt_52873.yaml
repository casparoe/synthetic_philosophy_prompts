answer: |-
  This is a fantastic analogy. You have intuitively grasped the core tension of non-cognitivism (expressivism) using the distinction between **expressions** (which return values) and **statements** (which perform actions/side effects).

  Here is the Frege-Geach problem translated into your stack, followed by the residue report and a verdict on your "lazy evaluation" hunch.

  ---

  ### Part 1: The Frege-Geach Problem in Compiler Terms

  **The Setup**
  *   **Cognitivism (Realism):** Moral claims are **Expressions** returning a `bool`.
      *   `is_wrong("lying")` evaluates to `true` or `false`.
      *   The AST node has a type `Boolean`.
  *   **Expressivism:** Moral claims are **Statements** with side effects (IO).
      *   `condemn("lying")` executes a function that updates the global state of "attitude" or prints to stderr.
      *   The AST node has a type `void` (or `IO Unit`). It does not return a value usable by logic.

  **The Compilation Error (Frege-Geach)**
  In natural language, we embed moral claims inside logical operators (conditionals, negations, disjunctions). In your vocabulary, this is embedding a `Statement` inside an `Expression` context.

  Consider this valid argument (Modus Ponens):
  1.  If lying is wrong, then getting your brother to lie is wrong.
  2.  Lying is wrong.
  3.  Therefore, getting your brother to lie is wrong.

  **In Code (Cognitivist/Realist):**
  ```python
  # Type checks out. All nodes return bool.
  if is_wrong("lying") == True:
      assert is_wrong("inciting_lying") == True

  assert is_wrong("lying") == True
  # Compiler infers: is_wrong("inciting_lying") must be True
  ```
  The compiler builds the AST compositionally. The `if` node expects children of type `bool`. `is_wrong` provides `bool`. Logic flows through the wire.

  **In Code (Expressivist):**
  ```python
  # Type Mismatch Error
  if condemn("lying"):  # <--- ERROR: Expected bool, got void/IO
      condemn("inciting_lying")

  condemn("lying")
  ```
  **The Problem:**
  To make the `if` statement compile, the antecedent (`condemn("lying")`) must evaluate to something truth-apt (a `bool`) so the control flow can decide whether to enter the block.
  1.  **If you force it to return a bool:** You admit `condemn` isn't just a side effect; it's checking a fact. You've collapsed back into Cognitivism.
  2.  **If you keep it as void/side-effect:** The code doesn't compile. You cannot build the parent AST node (`if`) from the child node (`condemn`) because the types don't match.
  3.  **If you use a Macro:** You might say `condemn` is a macro that expands differently based on context.
      *   Top-level: `condemn("lying")` → `print_shame("lying")`
      *   Inside `if`: `condemn("lying")` → `check_shame("lying")`
      *   **The Linkage Bug:** If the expansion is different, the variable isn't the same. In logic, for Modus Ponens to be valid, the symbol `P` in `P -> Q` and `P` must be identical. If the macro expands to different bytecode, you have an **equivocation error**. The logical connection is broken. The compiler cannot guarantee validity because the semantic value of the node changes based on its parent.

  **Summary:** Expressivism treats moral nodes as `IO` actions. Logic requires `Pure` values. Frege-Geach asks: "How do you compose `IO` nodes into `Pure` logic structures without losing the `IO` nature or breaking the logic?"

  ---

  ### Part 2: The Residue Report

  Here is where your compiler metaphor maps perfectly, where it distorts, and where it hits a wall.

  #### 1. Green Zone: Clean Maps
  *   **Compositionality:** The philosophical demand that "the meaning of the whole is determined by the meaning of the parts" is exactly how a compiler traverses an AST. If a child node lacks a return value, the parent operator (AND, IF, OR) cannot be defined.
  *   **Side Effects vs. Return Values:** This is the exact distinction between Cognitivism (truth-conditions) and Expressivism (attitude-expression). The intuition that `print("Boo!")` is different from `return False` is spot on.
  *   **Context Sensitivity:** The problem of unasserted contexts (conditionals) maps perfectly to the difference between *evaluating* an expression and *referencing* it.

  #### 2. Yellow Zone: Distortions
  *   **The "Runtime":** In code, side effects happen on a CPU/OS. In expressivism, the "side effect" is a psychological state or a social norm. There is no central processor. When I say "If lying is wrong...", I am not actually updating my brain's "shame registry" yet. Your metaphor implies a concrete execution environment that doesn't exist in the same way.
  *   **Strict Typing:** Compilers are pedantic; natural language is fluid. In Python or JavaScript, you can put almost anything in an `if` condition (truthiness). A philosopher would say, "Just because English *allows* the grammar doesn't mean the *logic* holds." Your metaphor might make it look like a syntax error, whereas philosophers treat it as a semantic incoherence.
  *   **Macros:** Suggesting expressivism is a "macro" (context-sensitive rewriting) is actually a specific solution to Frege-Geach (called *Semantic Minimalism* or *Ecumenical Expressivism*). It's not just a metaphor for the problem; it's a proposed patch. But as noted above, it risks breaking the "variable identity" required for logical validity.

  #### 3. Red Zone: No Counterpart (The Hard Residue)
  *   **Logical Validity vs. Type Safety:** This is the big one.
      *   In code, if types match, the program runs. If `if (true) { crash() }` runs, it's "valid" code even if it crashes.
      *   In logic, **Validity** means "If premises are true, the conclusion *must* be true."
      *   Expressivism denies moral premises are "true." So what is being preserved?
      *   **The Missing Concept:** *Normative Force.* In code, `if` controls *execution flow*. In ethics, logic controls *commitment consistency*. If I accept "Lying is wrong" and "If lying is wrong, stealing is wrong," I am *committed* to "Stealing is wrong."
      *   Your vocabulary handles **control flow** (what the machine does) well. It handles **commitment flow** (what the agent is rationally obliged to believe/do) poorly. There is no `RationalObligation` type in C++ or Rust.

  ---

  ### Part 3: The Verdict on Your Hunch

  **Your Hunch:** *"It's all just lazy evaluation."*
  **Verdict:** **Incorrect, but insightful.**

  **Why it's incorrect:**
  Lazy evaluation changes *when* an expression is reduced, not *what type* it reduces to.
  *   `let x = lazy(condemn("lying"))`
  *   `if (x) { ... }`
  *   When `x` is finally forced inside the `if`, it still needs to resolve to a `bool` to make the branch decision. Lazy evaluation delays the side effect, but it doesn't turn a `void` into a `bool`. Frege-Geach isn't about timing; it's about **semantic type**. You can't branch on a side effect.

  **Why it's insightful:**
  You are sensing that the "meaning" of the moral claim in the conditional is **deferred**.
  *   In `if (lying_is_wrong)`, I am not actually shaming liars right now. I am talking about the *condition* under which shaming would occur.
  *   This looks like a **Thunk** or a **Promise**.
  *   Some modern expressivists (like Blackburn or Gibbard) basically argue that moral logic is a logic of **plans** or **commitments**, not truth.
  *   If you view `condemn("lying")` not as `void`, but as `Promise<Unit>` (a commitment to act), then logic becomes about combining promises.
      *   `Promise A` + `Promise (A -> B)` => `Promise B`.
      *   This avoids truth values entirely.

  **Is the residue your vocabulary's fault or the philosophers'?**
  It is **your vocabulary's fault**, specifically the lack of a **Normative Type**.

  In software, we have:
  1.  **Descriptive Types:** `int`, `string`, `bool` (What *is*).
  2.  **Effect Types:** `IO`, `async`, `mutable` (What *happens*).

  Philosophy requires a third category:
  3.  **Normative Types:** `Obligatory`, `Permissible`, `Forbidden` (What *ought to be*).

  The Frege-Geach problem arises because Expressivists try to implement **Normative Types** using only **Effect Types** (attitudes/emotions).
  *   **Realists** say: Normative Types are just Descriptive Types (moral facts exist like math facts).
  *   **Expressivists** say: Normative Types are Effect Types (moral facts are just feelings/actions).
  *   **Frege-Geach** says: Effect Types don't compose like Descriptive Types. You can't `AND` two feelings together to get a valid conclusion in the same way you `AND` two booleans.

  **Final Diagnosis:**
  The philosophers' problem is not fuzzy; it is rigorous. It is a type-safety error in the architecture of ethics. Your hunch about lazy evaluation is you trying to find a runtime feature that solves a type-system problem. The solution isn't to delay the evaluation (lazy); it's to define a new type system where "attitudes" can compose logically without becoming "truths."

  If you want to read one thing that matches your brain: Look up **"Logic of Satisfaction"** or **"Plan Logic"** (Michael Bratman or Allan Gibbard). They essentially try to write a compiler for normative commitments where the output isn't `true/false`, but `consistent/inconsistent`. That is the "Normative Type" your vocabulary is missing.
