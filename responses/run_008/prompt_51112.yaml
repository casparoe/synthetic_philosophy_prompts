answer: |-
  This is a high-stakes workshop. In a departmental setting, the goal isn't necessarily to "win" the debate (you won't convert the Kantians or the Humean), but to show that your view is *stable*, *precise*, and *worth pursuing* in the dissertation. You need to demonstrate that you understand the cost of your hybrid view and that you're paying it intentionally, not accidentally.

  Here is your Q&A Prep Sheet.

  ### **Concession Strategy**

  **What to Concede (To Look Reasonable):**
  *   **Terminology:** Concede that "Dormant Reason" sounds awkward and might be terminologically confusing. Offer that you are open to better labeling (e.g., "Counterfactual Internal Reasons").
  *   **Extension:** Concede that your view extends the concept of "internal" further than Williams intended. Don't claim Williams would agree with you; claim you are *repairing* Williams.
  *   **Epistemic Access:** Concede that agents cannot always *know* they have dormant reasons. This buys you goodwill with the epistemic constraint crowd.

  **What NOT to Concede (The Dissertation Core):**
  *   **The Grounding:** Do **not** concede that dormant reasons are grounded in anything other than the agent's *potential* psychology. If you concede they are grounded in objective value independent of the agent, you collapse into Externalism and the chapter fails.
  *   **The Distinction:** Do **not** concede that the distinction between "Deliberative Failure" and "Deprivation" is negligible. This is the engine of your view.
  *   **Normative Force:** Do **not** concede that dormant reasons are merely "advisory." They must be genuine reasons, just currently inactive.

  ---

  ### **The 8 Objections (Ordered by Damage Potential)**

  #### **1. The Kantian Collapse (The Externalist Attack)**
  **Who:** The Neo-Kantians.
  **The Objection:** "You say these aren't external reasons, but you admit the agent has no motivational route to them *from their actual set*. If the reason exists independently of their actual psychology, in virtue of what *are* they internal? You've kept the label 'internal' but emptied it of its defining constraint. This is just Externalism with a psychological safety blanket."
  **The Reply (2 mins):** "The grounding is the difference. For the robust externalist, the reason exists even if the agent *could never* come to care about it (e.g., a psychopath who cannot value humanity). My 'dormant' reason exists *only because* there is a counterfactual route: if the agent had the opportunity for development, the motivation *would* arise. The reason is still tethered to the agent's subjective motivational architecture, just under idealized developmental conditions, not just idealized deliberative conditions. I'm not severing the link to psychology; I'm expanding the timeline of how that link is formed."
  **Soft Spot:** You are relying heavily on the metaphysics of "possible selves." If they press on whether that possible self is *this* agent, you're on thin ice.

  #### **2. The Humean Fudge (The Internalist Attack)**
  **Who:** The Hardline Humean.
  **The Objection:** "Internalism is supposed to explain the explanatory connection between reasons and action. If the reason is 'dormant,' it explains nothing. You're introducing this category just to save the intuition that the music-isolated person *should* listen to Beethoven. But internalism requires us to bite the bullet: if they can't get there from here, they have no reason. This is a face-saving fudge."
  **The Reply (2 mins):** "Internalism shouldn't require us to deny obvious normative truths to save a theory. If our theory says a person raised in a cave has no reason to care about their own flourishing once shown the light, the theory is too strict, not the intuition too weak. I'm not saving the intuition by cheating; I'm arguing that 'sound deliberation' in Williams' sense implicitly assumes a baseline of informational and developmental adequacy. When that baseline is missing due to deprivation, we don't say 'no reason,' we say 'the deliberative route is blocked by external factors.' That's not a fudge; it's a correction of the deliberative model."
  **Soft Spot:** The Humean will argue you've changed the definition of "Internalism" so much it's no longer Internalism. You have to stand firm that you are refining the view, not abandoning it.

  #### **3. The Normative Inertness (The Guidance Constraint)**
  **Who:** Metaethicists / Action Theorists.
  **The Objection:** "Reasons are supposed to guide action. A 'dormant' reason, by definition, cannot guide the agent *now*. If it can't feature in their practical reasoning, in what sense is it a reason *for them*? It sounds like a reason for *us* to intervene, not a reason for *them* to act."
  **The Reply (2 mins):** "Distinguish between *activating* reasons and *possessed* reasons. I possess a reason to take a medicine that will cure me even if I don't know I'm sick. The reason is grounded in my interest in health. Similarly, the dormant reason is grounded in my potential motivational set. It becomes guiding once the deprivation is lifted. Until then, it functions as a normative standard for evaluating the deprivation, not necessarily as a premise in current practical syllogisms."
  **Soft Spot:** This is your weakest philosophical point. Internalism is usually tied to the "guidance constraint." You are essentially arguing for reasons that can't guide. Be prepared to defend "potential guidance."

  #### **4. The Advisor's Knife (The "Helpful" Clarification)**
  **Who:** Your Advisor.
  **The Objection:** (Phrased gently) "I just want to make sure the audience grasps the mechanism here. You say 'sound deliberation' gets us to internal reasons, and 'developmental opportunity' gets us to dormant ones. But isn't 'sound deliberation' supposed to include gathering information? If the agent deliberated soundly, wouldn't they seek out the music? If so, isn't the dormant reason just an internal reason they haven't found yet? I'm worried you're positing a category that dissolves under analysis."
  **The Reply (2 mins):** "That's a crucial distinction. Sound deliberation operates on the *existing* set. It can add information, but it can't generate new fundamental elements if the agent has never encountered the concept. If I've never heard of music, I can't deliberate about seeking it. The 'dormant' category captures cases where the *input* for deliberation is missing due to no fault of the agent. So it doesn't dissolve: Internal = route exists from Actual Set. Dormant = route exists from Hypothetical Developed Set. The gap is the deprivation."
  **Soft Spot:** Your advisor knows your draft better than anyone. If she thinks this distinction is shaky, she's testing if you can defend it without panicking. Do not get flustered. Stick to the "Input vs. Processing" analogy.

  #### **5. The Circularity of "Opportunity"**
  **Who:** Any attentive critic.
  **The Objection:** "You hinge the whole view on 'lack of opportunity' vs. 'deliberative failure.' How do you define 'opportunity' without referencing the reason itself? Isn't an 'opportunity to develop a concern for X' just 'a situation where one comes to have a reason for X'? If so, your definition is circular."
  **The Reply (2 mins):** "Not necessarily. We can define opportunity materially and socially without referencing the normative outcome. Was the agent physically isolated? Were they subjected to coercive indoctrination? Was the cultural artifact unavailable? These are empirical, non-normative facts about the agent's history. We identify the deprivation first, then infer the dormant reason. We aren't saying 'they have a reason so they must have lacked opportunity.' We're saying 'they lacked opportunity, therefore the absence of motive doesn't negate the reason.'"
  **Soft Spot:** The line between "couldn't care" and "didn't care" is notoriously hard to draw. Have a concrete example ready (e.g., the isolated child vs. the stubborn adult).

  #### **6. The Williams Fidelity**
  **Who:** The Williams Scholar in the room.
  **The Objection:** "Williams was very clear that the 'sound deliberative route' starts from the *actual* motivational set. You're essentially rewriting his definition. Why call this a Williams-style internalism at all? Why not just own the hybrid nature?"
  **The Reply (2 mins):** "I call it Williams-style because I retain the core insight: reasons must speak to the agent's subjective motivations to be normative *for that agent*. I reject the Externalist claim that reasons float free of psychology. I'm arguing that Williams' 'actual set' was too static. If we view the self as temporally extended, the 'actual set' includes what it would become under non-deprived conditions. I'm not rewriting him; I'm temporalizing his model."
  **Soft Spot:** Textual fidelity is less important than philosophical truth, but don't pretend Williams would definitely agree with you. Acknowledge you are departing from the letter to save the spirit.

  #### **7. The Metaethical Status**
  **Who:** The Reasons-as-Facts Crowd.
  **The Objection:** "Are dormant reasons facts or psychological states? If they are facts, you're an externalist. If they are psychological states, how can they exist if the psychology is missing?"
  **The Reply (2 mins):** "They are conditional psychological facts. The fact is: 'If Agent A were exposed to X under conditions C, Agent A would desire X.' That is a truth-apt fact about the agent's psychology, even if the desire isn't currently occurrent. So it satisfies the factivity requirement without positing non-natural normative properties."
  **Soft Spot:** This commits you to a specific metaphysics of dispositions. If they attack dispositionalism, you need a backup.

  #### **8. The "So What?" (Pragmatic Objection)**
  **Who:** The Pragmatist / Ethicist.
  **The Objection:** "Even if you're right, what work does this do? Does it change how we treat the agent? If the reason is dormant, we can't blame them for ignoring it. So why posit the reason?"
  **The Reply (2 mins):** "It changes how we evaluate intervention. If they have no reason, giving them Beethoven is imposition. If they have a dormant reason, giving them Beethoven is *liberation*. It justifies paternalism in cases of deprivation but forbids it in cases of simple difference. That's a crucial ethical distinction grounded in the metaphysics of reasons."
  **Soft Spot:** None really, this is your strongest practical application. Lean into it.

  ---

  ### **The Nightmare Question**
  **The Question:** "If the agent cannot access this reason through any current cognitive or motivational process, and it only exists relative to a *counterfactual* version of themselves, **why is it a reason *for the actual agent* rather than a reason *for the counterfactual agent*?** You haven't bridged the gap; you've just pointed to a different person."

  **Why it kills you:** It attacks the trans-world identity of the agent. If the "developed you" is a different normative subject than the "deprived you," then the deprived you has no reason.

  **What to do if asked:**
  1.  **Pause.** Do not answer immediately. Take a sip of water.
  2.  **Acknowledge the gravity:** "That is the central metaphysical challenge of the view."
  3.  **The Defense:** "Because the counterfactual agent isn't a *different* person, it's the *same* person under non-deprived conditions. The deprivation is an external obstruction to their own nature, not a constitutive part of their identity. We treat them as the same agent for blame and praise; we should treat them as the same agent for reasons."
  4.  **The Out:** "However, I am willing to concede that the *normative force* is weaker than standard internal reasons. It is a pro tanto reason that becomes full-force only upon development."

  ---

  ### **Special Protocol: If Your Advisor Asks the Nightmare Question**
  Your advisor knows this is the weak point. If she asks this (or the "Knife" question #4 above), she is testing your defensibility.

  *   **Do not** get defensive or say "I address this in chapter 3."
  *   **Do** say: "I'm glad you raised that, [Name]. That's precisely the tension I'm working through in the next draft. My current thought is [Insert Defense from above], but I recognize the metaphysical cost there. Do you think that cost is fatal, or just expensive?"
  *   **Why:** This shows you know the weakness, you have a plan, and you respect her judgment. It turns an attack into a collaboration, which neutralizes the "bloodbath" vibe.

  ### **Final Advice for the Workshop**
  *   **Own the Hybrid:** Don't try to pretend you are a pure Internalist. You are proposing a *third category*. Own it.
  *   **Time Management:** If a reply is going long, stop and say, "I think the core of my answer is X, but I'd love to discuss the nuances offline."
  *   **The "I'll Take That" Move:** If someone lands a hit you can't parry, say: "That's a really strong objection. I don't have a satisfactory answer right now, but I will think about that for the revision." This shows intellectual honesty, which counts for more than having a perfect answer in a workshop.

  Good luck. You know the material. Just keep the distinction between *Actual Set* and *Developed Set* clear, and you'll survive.
