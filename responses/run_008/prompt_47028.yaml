      *   *The Risk:* The novelist relies on the *reader's* intuition that qualia are real to create empathy. If the reader becomes an illusionist, does literature break?

  6.  **Ranking the Defeaters (Fatal to Awkward):**
      *   *Fatal:* Self-refutation (The "Illusion of an Illusion" problem). If the illusion itself requires phenomenality, the view collapses.
