      *   **The Conflict:** Their philosophical view contradicts their professional practice (rendering interiority).
      *   **The Request:** A "map of exposure." What arguments/experiments/results should worry an illusionist? Distinguish between what illusionists concede vs. dismiss. Focus on empirical (psych/neuro) threats. Address the "unfalsifiability" charge (is reinterpreting data as illusion a defect or a feature?). Rank defeaters (fatal to awkward). Address the specific tension with their profession (novel writing).

  2.  **Deconstruct Illusionism:**
      *   *Core Claim:* Phenomenal properties (qualia) don't exist. We *think* we have them, but that's a cognitive error (a "user illusion").
      *   *Key Proponents:* Keith Frankish, Daniel Dennett (sort of), Pete Mandik, some eliminative materialists.
      *   *The "Hard Problem":* Illusionism dissolves it. There is no hard problem because there is no phenomenon to explain.
      *   *The "Illusion":* It's not that experience doesn't happen, but that it doesn't have the *intrinsic, non-physical, ineffable* properties we attribute to it.

  3.  **Brainstorming Defeaters/Challenges:**
      *   *The Self-Refutation Argument:* If consciousness is an illusion, who is being fooled? An illusion *is* a conscious experience.
      *   *The Phenomenal Concept Strategy (PCS) limits:* Can physical concepts really capture the cognitive role of phenomenal concepts?
      *   *Neuroscience of Pain/Pleasure:* If we find a "neural correlate of qualia" that looks distinct from function, does that hurt illusionism? (Actually, illusionists say no, but need to check).
      *   *The "Zombie" Intuition:* If illusionism is true, aren't we all zombies? (Illusionists accept a version of this).
      *   *The Normative/Ethical Angle:* If pain is an illusion, why avoid it? (Illusionists say the *reaction* is real).
      *   *The "Harder Problem":* Explaining *why* the illusion is so persistent and universal.
      *   *Empirical Specifics:* Binocular rivalry, change blindness, phantom limbs. Do these support or hurt? (Usually support illusionism by showing perception is constructed).
      *   *The "What It's Like" residue:* Even if I know it's an illusion, it still *seems* like something. Can science explain the *seeming* without positing the *thing*?

  4.  **Addressing the "Unfalsifiability" Charge:**
      *   Is illusionism a "get out of jail free" card? If every counter-evidence is just "more illusion," is it scientific?
      *   *Defense:* It makes predictions about cognitive architecture (meta-cognitive monitoring errors).
      *   *Critique:* It risks being ad hoc.

