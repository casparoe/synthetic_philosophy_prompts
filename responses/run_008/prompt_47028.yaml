      *   *Section 4: The Novelist's Specific Vulnerability.*
          *   This is the crux. The user asks if their profession inoculates them.
          *   *Argument:* Novelists traffic in *shared* illusion. If illusionism is true, the "shared interiority" is a shared cognitive glitch.
          *   *The Real Threat:* Not that writing is impossible, but that the *value* of writing (empathy via qualia) is undermined.
          *   *Inoculation:* Actually, the novelist might be *more* vulnerable because they know how constructed interiority is (narrative voice, unreliable narrator). Or less vulnerable because they treat it as real.
