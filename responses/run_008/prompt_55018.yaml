      *   Is there a fix for (2)? (Yes, pre-existing democratic units + viability).
      *   Are those ad hoc? (No, they are functional prerequisites).

  10. (Final Review of the Output): Ensure the distinction between *primary right* (plebiscitary) and *remedial right* is clear. Ensure the "infinite regress" is stopped by the definition of political agency.

  *(Self-Correction)*: Wait, I need to make sure I don't just argue "states are practical." The roommate will say "morality trumps practicality." I need to argue that *without* practicality, the moral good (self-determination) cannot be realized. If you secede into statelessness, you have *less* self-determination. That's the key.

