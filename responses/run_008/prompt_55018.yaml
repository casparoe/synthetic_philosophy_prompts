answer: |-
  This is a classic problem in political philosophy, often called the **"boundary problem"** or the **"infinite regress objection"** to plebiscitary (primary right) theories of secession. Your roommate has articulated a version of this argument that is standard in the literature (akin to arguments made by Wayne Norman or critics of Harry Beran).

  Your intuition is correct: the argument relies on a category mistake regarding what "collective" means in self-determination. However, your roommate is also right that you cannot simply wave hands at "viability."

  Here is how you can dismantle the argument while keeping Premise (1), modifying Premise (2), and avoiding the trap of the Remedial Right theory.

  ### 1. Where the Argument Goes Wrong: The Category Mistake

  The fatal flaw is in the transition from **(1)** to **(3)**.

  Premise (1) defines self-determination as not living under institutions one doesn't endorse. Premise (3) assumes that because *individuals* don't endorse the institutions, any *aggregation* of individuals can claim the right to form new institutions.

  This treats political agency as infinitely divisible. It isn't.

  **The Counter-Argument:** "Self-determination" is not just "exit." It is the capacity to *govern*.
  If an apartment building secedes, it cannot levy taxes, enforce contracts, provide justice, or defend rights. It cannot actually *determine* anything. It becomes a private association, not a political unit. Therefore, the "right to collective self-determination" logically entails a **capacity constraint**.

  The regress stops not at an arbitrary line, but at the point where the unit ceases to be capable of exercising the *functions* of the self-determination it claims. If you claim the right to make laws, you must be able to enforce them. If you claim the right to welfare, you must be able to tax. An apartment building cannot do this without relying on the state it is trying to secede from, which creates a performative contradiction.

  **The Cost of Keeping (1):**
  You keep the idea that endorsement is the source of legitimacy. But you must concede that endorsement alone is insufficient to *instantiate* a right. Endorsement triggers the *claim*, but the *satisfaction* of the claim requires the unit to be capable of assuming the burdens of statehood. This doesn't negate (1); it just says (1) is a necessary condition, not a sufficient one.

  ### 2. Fixing Premise (2): The "Pre-Existing Unit" Constraint

  Your roommate claims any fix for the territorial unit is "smuggled in." This is false. It is **jurisdictionally inherited.**

  Democracies are not blank slates; they are layered administrative structures. The reason the 2014 Scottish referendum was held across Scotland and not by neighborhood is that **Scotland is a pre-existing jurisdiction with democratic accountability.**

  *   **The Fix:** The unit entitled to vote on secession is the **smallest pre-existing democratic administrative unit that possesses the functional capacity to sustain statehood.**
  *   **Why this isn't ad-hoc:** It relies on the existing democratic infrastructure. Scotland has a parliament, a legal history, and a bureaucracy. Shetland has a council. A neighborhood has... a homeowners association?
  *   **The Shetland Case:** Your roommate brings up Shetland. This is actually the strongest test case. If Scotland becomes independent, does Shetland get a vote?
      *   *Plebiscitary Answer:* Yes, arguably. If the "parent" state changes fundamentally (from UK to Scotland), the contract is broken for Shetland too. They might be entitled to a *remedial* vote or a negotiated opt-out.
      *   *The Limit:* But Shetland is a distinct historical jurisdiction with a council. A *street* is not. The regress stops at the level of recognized political administration.

  This avoids the "apartment building" problem because apartment buildings are not political jurisdictions. They are private property arrangements. Seceding from a state is a political act; leaving a condo board is a property transaction. The moral weight differs because the *coercive power* differs.

  ### 3. Addressing the "Smuggling" Charge (Premise 6)

  Your roommate argues that adding constraints "smuggles in" criteria that undermine the endorsement theory.

  **The Rebuttal:** Defining the scope of a right is not smuggling; it is jurisprudence.
  *   Free speech is grounded in autonomy. But we don't allow free speech to justify libel or inciting violence. Is that "smuggling" in a harm principle? No, it's recognizing that rights exist within a social context where they can conflict.
  *   Similarly, the right to secede exists within a context of **democratic stability.**

  If boundaries could change every time a neighborhood voted, no public goods (roads, schools, currency) could be planned. This undermines the *very self-determination* the secessionists seek. You cannot exercise self-determination in a failed state. Therefore, constraints on *when* and *at what level* secession can occur are required to make the right meaningful.

  ### 4. Why the Remedial View is Worse

  Your roommate concludes that only the **Remedial Right Theory** (you can only leave if oppressed) survives. You are right to feel this is "off."

  *   **The Problem with Remedial Theory:** It makes state legitimacy purely negative. It implies that as long as Westminster isn't actively abusing Scots, Scotland *must* stay, even if 60% of Scots democratically wish to leave.
  *   **The Democratic Deficit:** This treats the state like a prison. You can only leave if the guards are beating you. But a state is supposed to be a voluntary association of citizens. If the association is no longer wanted, forcing it to continue creates a legitimacy deficit, even if no "rights" are being violated.
  *   **The "Benevolent Empire" Trap:** Under remedial theory, a benevolent empire that treats all subjects well has an absolute claim to them forever. Most liberals find this intuitively repugnant.

  ### 5. The Synthesis: "Qualified Plebiscitary Theory"

  You can win this argument by proposing a **Qualified Plebiscitary Theory**. This keeps your Premise (1) but fixes Premise (2) without collapsing into the apartment-building absurdity.

  **The Argument:**
  1.  **Legitimacy comes from consent (Premise 1).** People shouldn't be forced to live under laws they reject.
  2.  **But political agency requires capacity.** To exercise self-determination, a group must be able to function as a state (viability).
  3.  **And democracy requires stability.** To prevent chaos, the *unit* of secession must be a pre-existing democratic jurisdiction (e.g., a province, region, or republic), not an ad-hoc gathering of individuals.
  4.  **Therefore:** A group has a primary right to secede **IF**:
      *   They form a majority in a pre-existing administrative unit.
      *   They vote via a democratic process (supermajority thresholds are often proposed here to ensure stability).
      *   The new state is viable and will respect the rights of minorities within *its* borders (addressing the "wealthy bits of Catalonia" problem).

  **How this handles the Roommate's traps:**
  *   **The Apartment Building:** Not a pre-existing administrative unit. No claim.
  *   **The Shetlands:** A pre-existing unit. They might have a claim *if* Scotland leaves the UK, because the constitutional order changed. But they can't secede from Scotland just because they dislike Scottish tax policy, unless they meet the viability/democratic threshold.
  *   **The Regress:** Stops at the level of political administration, not geography.

  ### Summary for Your Debate

  Tell your roommate this:

  > "Your regress argument works only if you assume territory is morally inert and infinitely divisible. But political units aren't just lines on a map; they are **functional agencies**.
  >
  > I keep Premise (1): Consent matters. But I reject the idea that consent alone creates a state. To have a right to *self-determination*, you must be capable of *determining* something. An apartment building cannot determine a currency, a legal code, or a defense policy.
  >
  > The fix for Premise (2) isn't smuggled; it's **jurisdictional**. The right to vote on secession belongs to the smallest **pre-existing democratic unit** that is capable of statehood. This stops the regress at the level of political administration (regions/states) rather than geography (streets/buildings).
  >
  > If you reject this and go with the Remedial View, you're arguing that a democratic union is indistinguishable from a prison: you can only leave if the guards beat you. I'd rather accept some constraints on boundary-drawing than accept that democracy doesn't allow for divorce."

  This allows you to keep the moral core of your position (consent/endorsement) without falling into the "every man for himself" absurdity.
