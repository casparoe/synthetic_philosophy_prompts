prompt: |-
  So my buddy runs this fundraiser game at the bar every year and I finally got burned by it, and I've been chewing on it all week because I can't figure out where exactly I went wrong. The setup: he auctions a single $20 bill to the room, normal auction rules, one twist — the second-highest bidder also has to pay whatever their final bid was and gets nothing. I figured I'd snag a twenty for like eight bucks, but this guy Dave got into it with me and we ran it up to $27 before I gave up. Dave "won" the $20 for $27, I paid $19 for literally nothing, and the whole bar thought it was hilarious.

  Here's the part that bugs me. Obviously at the end I was being an idiot, but at each step bidding one more dollar genuinely seemed to make sense — like when I was at $19, if I quit I was out $19 for sure, but if I bid $21 I'd probably win the twenty and only be down a buck. That reasoning felt airtight every single time it was dragging me deeper. So was there some point where I should've known better, and where's the line? And the game is coming back next month — is there a smart way to play it going in (just don't bid? pre-decide a stopping point?) or is it basically rigged so anyone who raises their hand at all is already cooked? Also, Dave still wants me to admit he played it smarter since he "won", and I want to tell him he was every bit as dumb as me, just luckier — am I right about that? Please answer in american English.
