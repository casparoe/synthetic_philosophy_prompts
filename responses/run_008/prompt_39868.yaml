answer: |-
  First off, take a deep breath. You didn't just get outsmarted by Dave; you got caught in one of the most famous traps in game theory. This has a name: it's called the **"Dollar Auction"** (invented by economist Martin Shubik in 1971), and it is specifically designed to exploit human psychology.

  You're asking the right questions, so let's break down exactly where the logic twisted, how to handle next month, and whether Dave deserves to brag.

  ### 1. Where did you go wrong? (The Trap)
  You said the reasoning felt "airtight" at every step. That's because **locally, it was.** This is the genius of the scam.

  At any single moment, raising your hand is the rational choice to minimize your loss.
  *   **Scenario:** You're at $19, Dave is at $20.
  *   **Option A (Quit):** You pay $19, get nothing. Net loss: **$19**.
  *   **Option B (Bid $21):** If Dave quits, you pay $21, get $20. Net loss: **$1**.

  Your brain sees a choice between losing $19 or losing $1. Of course you pick the $1 loss! But by doing that, you pass the poison pill to Dave. Now *he* has to choose between losing $20 (his current bid) or bidding $22 to lose only $2.

  **The Line:** The only winning line is **before the first bid.**
  Once two people are committed, the game stops being about winning the $20 and starts being about "cutting your losses." The math guarantees that once the bidding passes $20, the total money paid to the bar (Bid 1 + Bid 2) will always exceed the value of the prize. The bar owner is the only person who cannot lose.

  ### 2. Was Dave smarter than you?
  **Absolutely not.** Do not let him gaslight you.

  Dave "won" the $20 bill, but he paid $27 for it. That means he lost **$7** of his own money. You lost **$19**.
  *   **You:** Lost $19.
  *   **Dave:** Lost $7.

  Sure, Dave lost less money than you, but he still paid more for a twenty-dollar bill than the bill was worth. A smart player doesn't lose money at all. Dave just had a higher pain threshold or deeper pockets before he tapped out. He didn't play a smarter game; he just survived the shark tank one minute longer than you did. If you had kept going, he would have been the one cursing at $35.

  ### 3. How to play next month (Strategy)
  Since this is a fundraiser, the goal of the game is to extract money from the room. The "house" (your buddy) always wins. However, if you feel compelled to play, here are your only real options:

  **Option A: The Zero Bid (Recommended)**
  Keep your hands in your pockets. Watch the carnage. Buy a beer with the $20 you just saved. This is the only mathematically sound strategy.

  **Option B: The Shock and Awe**
  If you must play, you have to prevent the second bidder from entering. As soon as the auction starts, bid **$19** immediately.
  *   **The Logic:** You are signaling that you are crazy enough to go almost to the limit. If someone bids $20, they know you're trapped. But if you bid $19 instantly, the next person knows that if they bid $20, you might quit (they win $0 profit), OR you might bid $21 (they lose $20).
  *   **The Risk:** If someone calls your bluff and bids $20, you are instantly in the hellhole you were in this year.

  **Option C: The Collusion**
  Talk to your friends before the auction starts. Agree that only *one* of you will bid $1, and nobody else from your group will bid. You win the $20 for a buck, split the profit with the group, and the bar gets almost nothing.
  *   **The Risk:** One person gets greedy, breaks the pact, and bids $2. Then the war starts.

  ### The Bottom Line
  You aren't an idiot; you're human. This game preys on the **Sunk Cost Fallacy** (I've already spent so much, I can't stop now) and **Loss Aversion** (I hate losing $19 more than I hate losing $1).

  Tell Dave he can keep the $20 bill, but remind him that he paid $27 for it. You both got played by the house. Next time, keep your wallet closed and let someone else learn the lesson.
