answer: |-
  This is a classic dispute, one that has simmered since the days of Savage and Barnard. It is excellent that your seminar provoked such heat; it suggests the students are engaging with the material rather than merely memorising formulae. Here is my adjudication on the four moves, followed by a verdict on the debate as a whole.

  ### Adjudication of Moves

  **(1) Marco: Optional stopping is a non-issue for Bayesians; pre-registration is a frequentist solution.**
  **Verdict: Right-but-missing-something.**
  Marco is technically correct regarding the Likelihood Principle. In a closed Bayesian system, the posterior distribution depends only on the prior and the likelihood of the observed data; the stopping rule is irrelevant to the *coherence* of the belief update. However, he is too dismissive of pre-registration. Even for a Bayesian, pre-registering the prior, the model structure, and the loss function prevents 'prior-hacking' and ensures the analysis remains honest. To claim pre-registration is solely a frequentist artefact ignores its utility for transparency in any inferential framework.

  **(2) Priya: Bayesian 'immunity' is the disease; ignoring intentions guarantees misleading evidence.**
  **Verdict: Basically right.**
  Priya correctly identifies the practical danger. While a Bayesian posterior may be coherent, a policy of 'sample until the Bayes factor exceeds $K$' can indeed lead to rejecting a true null hypothesis with high probability in the long run, depending on the prior and the true state of nature. If the scientific community adopts a method that allows researchers to guarantee 'significant' evidence through persistence alone, the literature will become polluted. Her point that error control exists precisely because intentions are unreliable is a robust defence of the frequentist rationale.

  **(3) Marco: Unscrupulous behaviour is possible, but calibrated Bayesians have bounded error rates; pre-registration is just stating priors.**
  **Verdict: Right-but-missing-something.**
  Marco is correct that one *can* evaluate Bayesian procedures using frequentist metrics (calibration), and that a fixed Bayes factor threshold often performs reasonably well under optional stopping. However, this move undermines his opening gambit. If he must appeal to long-run error rates to defend the method's safety, he has tacitly conceded that frequentist properties matter. Furthermore, equating pre-registration merely with 'stating priors' underestimates the frequentist concern with multiple testing and garden-of-forking-paths in the data collection process itself, not just the analysis.

  **(4) Priya: Bounded-error claims import frequentist reasoning; priors are just another degree of freedom.**
  **Verdict: Basically right.**
  This is Priya's strongest move. She spots the tension in Marco's defence: if long-run performance is the ultimate guarantor of trust, why not use the framework designed to optimise it? More importantly, her point about the prior is crucial. In the messy reality of the replication crisis, researchers can tune priors (or model specifications) just as easily as they can tune $p$-values. Treating the prior as a sacred, objective input ignores the reality that it is often a tunable parameter in the hands of a motivated researcher.

  ### Overall Verdict

  **Priya comes out ahead.**

  While Marco wins on the narrow theoretical ground of *inference* (the Likelihood Principle holds mathematically), Priya wins on the broader ground of *scientific practice*, which is the actual subject of a replication seminar. Marco's argument relies on an idealised Bayesian agent who specifies priors honestly and does not game the system. Priya's argument addresses the actual ecosystem of science, where incentives drive behaviour. Since the replication crisis is a crisis of behaviour and incentives rather than purely of mathematics, her critique lands the heavier blow. Marco is forced into a defensive position where he justifies Bayesianism using frequentist criteria, whereas Priya remains consistent within her own framework.

  ### What Both Are Missing

  Both students are treating the Likelihood Principle and the replication crisis as purely statistical problems, when they are ultimately **sociological and decision-theoretic ones**.

  Firstly, they are conflating *inference* with *decision*. The Likelihood Principle states that the *evidence* is unaffected by the stopping rule. It does not state that the *consequences of acting on that evidence* are unaffected. A journal editor making a publication decision based on a Bayesian analysis *does* care about the stopping rule if they wish to maintain the reliability of the literature. Marco focuses on the belief of the individual scientist; Priya focuses on the error rate of the community. Both are valid, but they are talking past one another about different goals.

  Secondly, neither adequately addresses the role of **external validation**. The replication crisis is not solved by internal statistical control alone, whether frequentist or Bayesian. It is solved by a culture that values replication studies, null results, and transparency. Pre-registration is not merely a statistical constraint; it is a social contract. Both students assume that if the statistics are 'correct', the science will follow. They miss the point that no statistical framework can fully compensate for a reward structure that prioritises novelty over truth.

  In short: Marco is right about the maths of belief, and Priya is right about the politics of publication. But the solution to the replication crisis lies less in choosing a side in this debate, and more in recognising that statistics is only one tool in a much larger toolbox of scientific reform.
