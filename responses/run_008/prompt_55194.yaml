  there's been talk of forming a union at my warehouse, and at thanksgiving my brother-in-law (huge econ youtube guy) went off about how unions are just labor cartels. his argument: a union is workers banding together to restrick the supply of labor, exactly like OPEC countries banding together to restrict the supply of oil so the price stays up. so if price-fixing is illegal and bad when companies do it, it should be bad when workers do it, and it's wierd that we jail one group and celebrate the other. I tried to push back and just got steamrolled, so I want to actually understand this instead of just having a bad feeling about it.

  can you walk through the analogy properly? like what maps onto what — who are the cartel members, what's the "product" being restricted, what's the price, who are the customers, what plays the role of antitrust law. then show me where the mapping stops holding, and be honest about which of those breakdowns actually matter for his conclusion (unions should get the same legal and social treatment that cartels get) and which ones are just cosmetic differences I shouldn't lean on. and then tell me whether his conclusion survives once the disanalogies are all on the table, or whether the analogy was doing all the work the whole time.

  one more thing: I don't want to trade one steamroll for another. can you flag which parts of this are basically settled among people who study labor economics and which parts are genuinely contested — e.g. whether the cartel framing is just standard economics or a contested ideological move — instead of handing me one side dressed up as the obvious truth?
