  Consider a scenario involving a high-security contractor known as the Agent and a multinational corporation known as the Principal. The Principal requires an operative for a mission where there is a significant risk that the Agent will face a choice between following a costly safety protocol or violating it to secure a personal financial windfall. The sequence of events unfolds in three distinct stages. At the first stage, the Agent chooses whether to undergo a psychological conditioning procedure that instills a rigid disposition to prioritize protocol over personal gain. This procedure costs the Agent ten thousand dollars in time and discomfort, but it alters her neural pathways in a way that is detectable by specific biometric scanners. At the second stage, the Principal decides whether to hire the Agent. Before making this decision, the Principal employs a neural audit, a cheap and highly reliable test costing the Principal one thousand dollars, which detects the presence of the conditioned disposition with near perfect accuracy. If the audit confirms the disposition, the Principal hires the Agent and pays a signing bonus of five hundred thousand dollars. If the audit fails to detect the disposition, the Principal rejects the Agent, and she receives nothing. At the third stage, the hired Agent encounters the crisis situation. She must choose between Act A, which follows the safety protocol, and Act B, which violates it. Following the protocol costs the Agent one hundred thousand dollars in lost future opportunities and potential hazard pay, while violating it saves her that amount. For the Principal, hiring an Agent who performs Act A yields a net profit of two million dollars, while hiring an Agent who performs Act B results in a net loss of one million dollars due to liability and mission failure.

  The structure of payoffs creates a tension between the rationality of acquiring the disposition and the rationality of acting on it at the moment of choice. From the perspective of the Agent at the first stage, acquiring the disposition is clearly advantageous. If she pays the ten thousand dollars for conditioning, she passes the neural audit, receives the five hundred thousand dollar bonus, and later incurs the one hundred thousand dollar cost of following the protocol, leaving her with a net gain of three hundred and ninety thousand dollars. If she does not acquire the disposition, she fails the audit, receives zero dollars, and incurs no further costs. Thus, overall welfare is maximized by becoming the kind of person who will later act against her immediate self-interest. However, at the third stage, when the Agent actually faces the choice between Act A and Act B, the signing bonus is a sunk cost. The hiring decision has already been made, and the money is in her account. At this specific moment, Act A costs her one hundred thousand dollars relative to Act B. According to causal decision theory, which evaluates acts based on their causal consequences from the moment of deliberation, choosing Act A is irrational because it causally results in a lower payoff for the Agent than Act B, with no possibility of altering the past hiring decision. The disposition pays off only because it was genuinely possessed at the time of the audit, not merely because the Agent claimed to have it. The neural audit serves as the cheap probe that distinguishes genuine possession from mere assertion. If the Agent could have bluffingly mimicked the disposition during the audit without actually possessing it, she could have secured the bonus and then chosen Act B at the third stage, netting five hundred thousand dollars minus the ten thousand conditioning cost, or even zero conditioning cost if bluffing were free. The requirement that the disposition be genuinely possessed is enforced by the test, which gates the benefit on the physical reality of the psychological state rather than the Principal's fallible belief or the Agent's cheap talk.

  This example is meant to show that the genuine possession of a disposition can be instrumentally rational even if the exercises of that disposition are locally irrational according to certain decision-theoretic frameworks. The work the genuine possession is doing is causal and evidential relative to the earlier hiring stage. It causes the Agent to pass the audit, which causes the Principal to hire. Without the genuine state, the test would not be passed, and the benefit would not be conferred. This distinguishes the case from simple reputation games where an agent might maintain a disposition only because others are watching; here, the test verifies the internal state before the external behavior is required. Whether the "irrational" act at the third stage really comes out irrational once the whole case is in view depends heavily on which decision theory one accepts, and this is a point of genuine contestation in the literature. Proponents of causal decision theory maintain that the act is irrational because the past is fixed and the act cannot causally influence the hiring decision. Proponents of evidential decision theory or timeless decision theory might argue that the act is rational because choosing Act A is strong evidence that the Agent possessed the disposition at the time of the audit, and thus evidence that she is in the world where she was hired and received the bonus. On these alternative views, the act is not irrational even at the moment of performance, because the correlation between the act and the past disposition is relevant to expected utility. It is important to flag that the verdict on the irrationality of the third-stage act is not settled consensus but varies by theoretical commitment. If one accepts causal decision theory as the correct account of rationality, then the example supports the claim that rational agents should sometimes cultivate dispositions to act irrationally. If one accepts evidential or timeless decision theory, the example supports the claim that what looks like irrationality from a narrow causal view is actually rational when informational links are accounted for.

  Regarding whether such dispositions should be treated as rational in themselves rather than as costly side effects of rational design, the example suggests a nuanced position. The disposition is not rational in the sense that exercising it maximizes utility at the time of exercise, assuming causal decision theory. However, the disposition is rational as a target of cultivation because having it maximizes utility over the agent's lifetime. This supports treating the disposition as a rational design feature of the agent's psychology, even if its operational output is suboptimal in isolated instances. The cost of the disposition, both the initial ten thousand dollars for conditioning and the later one hundred thousand dollars for protocol compliance, is outweighed by the access it grants to the five hundred thousand dollar bonus. The genuine possession matters because the Principal's test makes the benefit contingent on the fact of the disposition, not just the belief in it. This removes the possibility of strategic bluffing that plagues simpler trust games. The example illustrates that in environments where counterparty verification is possible and cheap, the value of a disposition lies in its truth-conduciveness regarding the agent's type. Whether this makes the disposition itself a constituent of rationality or merely a tool for satisfying rationality constraints depends on whether one defines rationality as a property of acts or a property of agents and their decision-making algorithms. The literature remains divided on whether rationality should assess the token act in isolation or the type of agent performing it, and this case provides concrete stakes for that abstraction without resolving the underlying theoretical dispute.
