answer: |-
  Hi colleague, I know this drill well and you are right to be wary of flattening the objection because that one-liner is actually a cluster of distinct arguments that rarely get untangled in an intro classroom. If you want to handle this without strawmanning, you need to separate the metaethical claim from the psychological claim and then from the sociological one, because their truth values and their implications for your student's conclusion about trust are wildly different. The first reading is the semantic or metaethical one, which claims that moral propositions literally lack truth conditions or meaning without a divine commander. On this view, the sentence everything is permitted means there is no objective fact of the matter about right and wrong if God is absent. Among professional ethicists, this is heavily contested and certainly not settled. Divine Command Theory is a live position, but so are secular moral realisms, constructivisms, and naturalisms, so you cannot present the student's view as the default or the only coherent option. However, even if we grant this claim for the sake of argument, it does not get the student to her conclusion about social trust. The absence of objective moral facts does not entail the absence of subjective reasons, social norms, or interpersonal agreements that sustain cooperation. An error theorist or a moral fictionalist can still have strong prudential or empathetic reasons to keep promises, so this reading might be defensible within certain metaethical frameworks but it is useless for proving that secular societies will collapse into distrust.

  The second reading is psychological and concerns motivation rather than truth. This claim suggests that human beings are psychologically incapable of sustaining moral behavior without the belief in divine surveillance or cosmic justice. This is an empirical claim about human psychology and motivation. Here the debate is much more settled among social scientists and psychologists than it is in metaethics, and the evidence leans strongly against the student. Secular individuals and societies demonstrate high levels of prosocial behavior, empathy, and cooperation without religious belief. If you present this as a settled empirical matter, you are on firmer ground, though you should acknowledge that religion can be a motivator for some people. Even if this claim were true for some subset of the population, it does not prove that a fully secular society would lose the ability to sustain trust, because secular institutions and socialization processes can cultivate intrinsic motivation and empathy. So this reading is largely false based on current data, and even if it were partially true, it fails to support the inevitability of social collapse.

  The third reading is sociological or functionalist, arguing that religious institutions have historically provided the social capital and community structures necessary for trust, and that removing them removes the infrastructure of cooperation. This is substantive and defensible, and there is genuine debate here among sociologists. Religious communities do often generate high trust within the group, and some literature suggests religious decline correlates with certain social fractures. However, this is not settled, and there are strong counterexamples like the Nordic countries which are highly secular yet maintain some of the highest levels of social trust and cooperation in the world. This reading is the strongest version of the student's argument because it points to institutional replacement rather than individual psychology. But even if true, it does not guarantee the student's conclusion because it assumes secular institutions cannot replicate the trust-building functions of religious ones, an assumption that existing high-trust secular societies seem to falsify. You can concede that religion has historically played this role without conceding that it is uniquely necessary for the future.

  The fourth reading is prudential or game-theoretic, which is likely what your student meant when she talked about nobody watching. This claim posits that without divine punishment, rational self-interest dictates defection in one-off interactions where reputation is not at stake. In the context of pure game theory without internalized norms, this is trivially true. If agents are purely self-interested and there is no enforcement, defection is the dominant strategy. However, this reading is false as a description of actual human beings. Humans are not purely self-interested rational agents; we have internalized norms, guilt, and reputation concerns that function as enforcement even without God. Furthermore, secular societies have legal systems and reputation mechanisms that serve as the enforcement layer the student claims is missing. So while the logic holds in a vacuum of pure rational choice theory, it fails when applied to actual human societies where secular enforcement and internalized norms exist. This reading fails to support the conclusion because it ignores the non-divine enforcement mechanisms that secular societies possess.

  There is a fifth reading that is existential rather than moral, suggesting that without God life has no meaning and therefore nothing matters enough to keep promises. This is a claim about axiology or meaning rather than ethics. This is deeply contested in philosophy of religion and existentialism. Many secular existentialists argue meaning is created rather than discovered. Even if this were true, it is a non sequitur regarding trust. One can find meaning in relationships, projects, or community without cosmic significance, and that meaning is sufficient to ground promise-keeping. So this reading is contested and does not logically lead to the conclusion that trust must evaporate.

  When you address this in class, the key is to show that the student is conflating the grounding of morality with the motivation for morality and the sociology of trust. You can acknowledge that the metaethical question is open debate among philosophers so you don't get caught dogmatically asserting secular realism as fact. But you can be much firmer on the empirical claims about trust and cooperation, pointing to existing secular societies as existence proofs that the conclusion is false regardless of the metaethical premise. If you separate these threads, you avoid the strawman because you are granting that some versions of the claim have philosophical weight while showing that none of them successfully bridge the gap to the prediction of social collapse. This approach respects the philosophical complexity while preventing the class from walking away thinking secular ethics is obviously untenable. I hope this helps you structure the seminar without getting bogged down in a culture war debate, and good luck with the next session.
