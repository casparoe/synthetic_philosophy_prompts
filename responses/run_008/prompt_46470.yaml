answer: |-
  # Proposal: Disaggregating the Aggregation Problem in Contractualist Moral Theory

  ## I. Introduction and Statement of the Problem

  The central difficulty facing contractualist moral theory is the problem of aggregation. The theory is fundamentally individualistic: it grounds moral principles in the idea that an act is wrong if it could be reasonably rejected by any individual affected by it. This structure provides a powerful explanation for why we cannot sacrifice one person to save many, as the individual sacrificed has a complaint that no single beneficiary can match. However, this same structure appears to generate counterintuitive results in cases involving large numbers of people suffering minor harms. If no single individual's minor complaint can outweigh one person's major complaint, then it seems a contractualist must accept a principle that allows one person to suffer a catastrophe rather than impose trivial inconveniences on a million others.

  The standard debate surrounding this problem is typically framed by a single binary question: "Do the numbers count?" Critics argue that contractualism must answer "no," rendering the theory implausibly rigid. Defenders argue that the theory can accommodate numbers, either by adjusting how complaints are weighted or by appealing to the availability of alternative principles. However, this debate often proceeds as if "counting the numbers" is a unitary phenomenon. My suspicion is that the standard debate conflates two structurally distinct questions that are routinely run together in the canonical test cases.

  The first question is **Within-Person Amplification**: Does the fact that many people would each suffer a given burden raise the strength of *any one individual's* complaint, as compared with a situation in which only that one person would suffer it? This asks whether the *context* of widespread suffering alters the moral weight of a single person's grievance.

  The second question is **Cross-Person Summation**: Can a larger number of individually weaker complaints, taken together, outweigh a smaller number of individually stronger complaints? This asks whether we are permitted to sum the weights of distinct complaints to override a stronger individual claim.

  In the familiar "transplant-style" cases, where harvesting one person's organs would save several dying patients, the intuition that this is forbidden is taken to show that headcounts cannot add up across persons (Cross-Person Summation is false). In cases involving the distribution of a public good, such as a television broadcast to a vast audience versus a tiny one, the intuition that we should serve the larger audience is often taken to show that headcounts *do* matter. However, it is unclear whether this second intuition relies on Cross-Person Summation or on Within-Person Amplification. It may be that the availability of alternatives changes what any single person can reasonably reject, or that the sheer scale of the exclusion makes the individual complaint more severe.

  If these are genuinely different mechanisms, then the standard exchanges between contractualists and their critics may be talking past each other. A theory might plausibly accept Within-Person Amplification while rejecting Cross-Person Summation, or vice versa. By failing to distinguish them, the literature obscures the specific point at which contractualism succeeds or fails.

  This project proposes to disentangle these two questions. I will argue that the aggregation problem is not a single obstacle but a composite of two distinct challenges. By constructing pairs of cases that vary one dimension while holding the other fixed, I will demonstrate that existing contractualist responses are indeterminate regarding which mechanism is doing the work. The goal is not necessarily to solve the aggregation problem definitively, but to refine the question such that the answer becomes determinate.

  ## II. Precise Statement of the Research Question

  To ensure the project yields a determinate answer rather than a survey of opinions, the research question must be formulated to test the conceptual independence of the two aggregation mechanisms within the contractualist framework.

  **Primary Research Question:**
  *Is the moral relevance of numbers in contractualist reasoning best explained by the amplification of individual complaint strength (Within-Person) or by the summation of distinct complaints (Cross-Person), and can the contractualist framework consistently accommodate one without the other?*

  This question breaks down into two sub-questions that the paper will address sequentially:

  1.  **The Independence Thesis:** Can we construct coherent cases where our intuitive verdicts track Within-Person Amplification independently of Cross-Person Summation? That is, are there scenarios where we feel a single person's complaint is stronger *because* others are similarly affected, even when no summing of complaints is required to reach a verdict?
  2.  **The Theoretical Cost:** If the Independence Thesis holds, which of the two mechanisms is compatible with the core contractualist constraint that principles must be justifiable to each individual? Specifically, does accepting Within-Person Amplification violate the individualistic basis of the theory, or does it merely refine the description of the individual's situation?

  A determinate answer will take one of the following forms:
  *   **Type A:** The two questions are distinct; contractualism can accommodate Within-Person Amplification without accepting Cross-Person Summation, thereby resolving the aggregation problem without sacrificing the theory's core individualism.
  *   **Type B:** The two questions are distinct; contractualism cannot accommodate Within-Person Amplification without collapsing into Cross-Person Summation, implying that the theory must either accept full aggregation or reject the intuitions driving the "broadcast" style cases.
  *   **Type C:** The two questions are not distinct; Within-Person Amplification is conceptually dependent on Cross-Person Summation (or vice versa), meaning the standard binary debate is correct, and the proposed distinction is illusory.

  The paper will argue for a Type A or Type B conclusion, demonstrating that the distinction is real and forcing a choice about which mechanism the theory should adopt.

  ## III. The Existing Landscape and Why It Leaves the Question Open

  The current literature generally clusters around three positions, none of which adequately distinguish between Within-Person Amplification and Cross-Person Summation. Consequently, each position leaves the primary research question open.

  **1. The Strongest Claim View**
  This position holds that in any choice between principles, we should look to the individual with the strongest complaint. If one person faces death and a million face a headache, the death complaint is stronger, and the principle allowing the death is rejected. This view is designed to block Cross-Person Summation. However, it leaves open the question of how complaint strength is determined. Does the strength of the "death complaint" remain constant regardless of how many others are dying? Proponents of this view often assume complaint strength is intrinsic to the harm suffered by the individual. If so, they implicitly reject Within-Person Amplification. But they rarely argue for this rejection; they simply assume that numbers don't change the *strength* of a claim, only the *number* of claims. By failing to argue why the context of widespread harm doesn't amplify individual strength, this view leaves the Within-Person question unanswered. It treats the aggregation problem as solely a matter of Cross-Person Summation.

  **2. The Alternatives and Reasonable Rejection View**
  This position focuses on the comparative nature of reasonable rejection. An individual can only reject a principle if there is an alternative principle that imposes a lesser burden on them. In cases involving public goods (like the broadcast case), the argument is often that the individual in the small group could have been served at no extra cost to the large group, making their rejection unreasonable. This approach attempts to solve the aggregation problem without summing complaints. However, it conflates the two dimensions. When we say the rejection is unreasonable because "so many others would lose out," are we saying that the *sum* of their losses outweighs the individual's loss (Cross-Person), or are we saying that the individual's loss is rendered less significant *in light of* the alternative that helps the many (which might rely on Within-Person Amplification of the many's complaints)? This view often slides between arguing that the individual has no valid complaint because the alternative is better for *them* (which is rarely true in pure numbers cases) and arguing that the alternative is better *simpliciter*. Without isolating whether the "reasonableness" is affected by the sheer number of other sufferers (Within-Person) or the aggregate welfare (Cross-Person), this position fails to pinpoint the mechanism.

  **3. The Skeptical View on Interpersonal Comparisons**
  This position argues that interpersonal comparisons of complaint strength are too indeterminate to carry the weight contractualism requires. If we cannot precisely measure whether a headache is 1/1000th as bad as a death, we cannot sum them. This skepticism effectively blocks Cross-Person Summation. However, it is less clear on Within-Person Amplification. Does skepticism about comparing *different* harms imply skepticism about comparing the *same* harm in different contexts? One could consistently hold that while we cannot compare headaches to deaths, we can recognize that a headache suffered in a context of mass exclusion is morally more significant than an isolated headache. The skeptical view tends to treat all aggregation as a measurement problem, failing to distinguish between the measurement of a single claim's context-dependent weight and the summation of distinct claims.

  Because none of these positions explicitly separate the question of *individual complaint strength* from the question of *claim summation*, the debate remains stalled. Critics attack the inability to sum; defenders appeal to the strength of individual claims or the structure of alternatives. Neither side addresses whether the strength of the individual claim itself shifts with the numbers. My project intervenes here by forcing the positions to declare themselves on the Within-Person question.

  ## IV. Methodology: Designing Probative Case Pairs

  To answer the research question, I cannot rely on existing test cases, as they are confounded. The transplant case confounds the strength of the victim's claim with the summation of the beneficiaries' claims. The broadcast case confounds the triviality of the individual harm with the availability of costless alternatives.

  The method for this paper will be the construction and analysis of **Minimal Pair Cases**. These are thought experiments designed to vary one variable (Within-Person vs. Cross-Person) while holding the other fixed. For these cases to be probative rather than merely clever, they must satisfy three criteria:
  1.  **Control of Harm Magnitude:** The intrinsic severity of the harm to any single individual must remain constant across the comparison.
  2.  **Control of Alternatives:** The availability of alternative principles must be held constant to ensure the verdict isn't driven by the "Alternatives View."
  3.  **Isolation of Mechanism:** The cases must be described in a way that makes it clear whether the intuition is driven by the status of the individual or the collective.

  **Pair 1: Testing Within-Person Amplification (Holding Cross-Person Constant)**
  *   *Case A (Isolated Sufferer):* A policy is adopted that causes one specific individual to lose an arm. No one else is affected.
  *   *Case B (Contextual Sufferer):* A policy is adopted that causes one specific individual to lose an arm. Additionally, due to unrelated causal chains, 1,000 other people elsewhere also lose an arm. The decision-maker cannot affect the 1,000 others; their fate is sealed regardless of the choice regarding the single individual.
  *   *The Test:* Does the individual in Case B have a stronger complaint against the policy than the individual in Case A?
  *   *Rationale:* Cross-Person Summation is held constant (or rendered irrelevant) because the 1,000 others are not being *sacrificed* for the sake of the one; their suffering is not a counter-weight in the decision. If the intuition is that the individual in Case B has a stronger complaint, this supports Within-Person Amplification. If the complaint strength is identical, it suggests that numbers only matter for Cross-Person Summation.
  *   *Challenge:* Ensuring the "unrelated causal chains" do not introduce a sense of "fairness" or "lottery" that confounds the intuition. The focus must remain on the strength of the *rejection* of the principle.

  **Pair 2: Testing Cross-Person Summation (Holding Within-Person Constant)**
  *   *Case C (Strong vs. Weak):* One person will lose an arm unless we choose a principle that causes 1,000 people to lose a finger. The 1,000 people know that their individual complaint (finger) is weaker than the one person's complaint (arm).
  *   *Case D (Strong vs. Weak with Amplification):* Same as Case C, but we stipulate that the 1,000 people *do not* have amplified complaints (i.e., we assume Within-Person Amplification is false). We ask purely: Do the 1,000 weak complaints sum to outweigh the 1 strong complaint?
  *   *The Test:* This is harder to isolate because our intuitions about summation often rely on the sense that "many small harms add up to a big harm." To make this probative, I will frame the question not as "what should we do?" but as "is the rejection reasonable?"
  *   *Refinement:* A better pair for Cross-Person testing involves **Sequential vs. Simultaneous** imposition.
      *   *Case E:* A principle allows imposing a finger-loss on Person 1, then Person 2, then Person 3, up to 1,000, to save one arm.
      *   *Case F:* A principle allows imposing a finger-loss on 1,000 people simultaneously to save one arm.
      *   *Rationale:* If Within-Person Amplification is the driver, Case F should generate stronger complaints (the context of mass harm). If Cross-Person Summation is the driver, the verdict should be the same in both, as the total count is identical. If our intuition differs between E and F, it suggests Within-Person Amplification is doing the work.

  **Criteria for Probative Value**
  To ensure these cases are not dismissed as idiosyncratic, I will apply the **Ceteris Paribus Constraint**. In describing the cases, I must explicitly stipulate that factors like urgency, certainty, special relationships, and causal responsibility are identical. The only variable is the number of sufferers and their relation to the decision. Furthermore, I will subject these cases to a **Reversibility Test**: If the numbers were reversed, would the intuition flip symmetrically? If not, the intuition may be driven by a heuristic rather than a moral principle.

  The method section of the paper will not just present these cases but will defend their validity against the objection that "contractualism is not about intuitions." I will argue that while contractualism is not intuitionist, the input for "reasonable rejection" is necessarily grounded in our considered judgments about what burdens individuals can bear.

  ## V. Possible Conclusions and Deciding Factors

  The paper will evaluate the results of the methodological test against three possible conclusions. The decision among them will rest on which conclusion preserves the most theoretical virtues of contractualism (consistency, individualism, and explanatory power).

  **Conclusion 1: The Amplification Defense (Type A)**
  *   *Thesis:* Within-Person Amplification is real and permissible; Cross-Person Summation is false.
  *   *Implication:* Contractualism can solve the aggregation problem by arguing that in mass-harm cases, the individual's complaint is strengthened by the context, allowing it to outweigh the strong complaint of the single victim. We do not sum complaints; we recognize that the "minor harm" complaint becomes a "major harm" complaint when universalized.
  *   *Deciding Factor:* This conclusion holds if the Minimal Pair cases show that individuals feel more aggrieved when others are similarly affected, even without summation. It preserves contractualist individualism because the justification still rests on a single individual's strengthened complaint.
  *   *Risk:* It risks collapsing into a form of rule-utilitarianism if the "context" is defined purely by the number of people. I must show that the amplification is about the *nature* of the burden (e.g., being excluded from a social practice) rather than the *count*.

  **Conclusion 2: The Hard Line (Type B)**
  *   *Thesis:* Within-Person Amplification is illusory; Cross-Person Summation is false.
  *   *Implication:* Contractualism must bite the bullet. In the broadcast case, the single person *can* reasonably reject the principle favoring the million, or the theory must find a non-aggregative reason to favor the million (e.g., fairness, tie-breaking).
  *   *Deciding Factor:* This conclusion holds if the Minimal Pair cases show no difference in complaint strength between the isolated and contextual sufferer. It preserves the purity of the theory but sacrifices some intuitive appeal.
  *   *Risk:* It makes the theory vulnerable to the standard "absurdity" objections regarding large numbers and trivial harms.

  **Conclusion 3: The Collapse (Type C)**
  *   *Thesis:* Within-Person Amplification and Cross-Person Summation are conceptually inseparable.
  *   *Implication:* The proposed distinction is a philosophical error. To say a complaint is stronger because others suffer is just a disguised way of saying the total suffering matters.
  *   *Deciding Factor:* This conclusion holds if every attempt to isolate Within-Person Amplification inevitably smuggles in a comparison of totals.
  *   *Risk:* This would validate the critics who say contractualism cannot distinguish itself from aggregative views in the end.

  I anticipate arguing for **Conclusion 1**. The most promising path for contractualism is to argue that the *reasonableness* of rejection is sensitive to the generalizability of the burden. A burden that is widely shared changes the social meaning of the harm for the individual, thereby strengthening their specific complaint without requiring the summation of distinct claims. This allows the theory to respect the "separateness of persons" while accommodating the intuition that numbers matter.

  ## VI. Risk Assessment and Failure Conditions

  A project of this nature carries significant philosophical risks. An honest account of failure conditions is necessary to assess the viability of the proposal.

  **1. The Indistinguishability Failure**
  The primary risk is that the two questions cannot in the end be pulled apart. It may be that our concept of "complaint strength" is inherently comparative. When we ask, "How bad is it to lose a finger?", the answer may implicitly depend on "How many others are losing fingers?" If the concept of an individual complaint is holistically determined by the state of the population, then distinguishing Within-Person from Cross-Person is merely verbal.
  *   *Mitigation:* I will attempt to construct cases where the population state is epistemically inaccessible to the individual. If the individual does not *know* others are suffering, does their complaint strength change? If contractualism relies on *reasonable* rejection, and reasonableness depends on available information, this might help isolate the variables. If the distinction collapses even under conditions of ignorance, the project fails.

  **2. The Intuition Instability Failure**
  The method relies on eliciting stable intuitions about minimal pair cases. It is possible that upon reflection, these intuitions prove unstable or vary wildly between respondents. If there is no "reflective equilibrium" regarding whether an isolated sufferer has a weaker complaint than a contextual sufferer, the method yields no data.
  *   *Mitigation:* I will not rely on raw intuition alone. I will anchor the intuitions in the *principles* that would be rejected. Instead of asking "Who is worse off?", I will ask "Which principle could be reasonably rejected?" This aligns the method with the contractualist framework itself.

  **3. The Theoretical Irrelevance Failure**
  Even if the distinction is real, it may be theoretically irrelevant. It might turn out that contractualism requires the same action in both cases regardless of the mechanism. If the theory yields the same verdict via different routes, the distinction may be philosophically interesting but practically inert.
  *   *Mitigation:* I will argue that the distinction matters for *justification*. Contractualism is concerned with justifiability to each person. If the justification relies on Cross-Person Summation, it violates the individualist constraint. If it relies on Within-Person Amplification, it respects it. Therefore, the mechanism determines the legitimacy of the theory, even if the verdict is the same.

  **4. Scope Creep**
  There is a risk of expanding the project to cover all forms of aggregation (e.g., risk aggregation, future persons). This would make the project unmanageable.
  *   *Mitigation:* I will explicitly limit the scope to **deterministic, same-generation, direct harm cases**. I will note in the introduction that risk and future persons are excluded to maintain focus on the core conceptual distinction.

  ## VII. Scope and Feasibility Assessment

  The target length for the final paper is roughly 6,000 words. This is a substantial but manageable length for a one-semester term paper. It allows for approximately 1,000 words of introduction, 1,500 words on the existing landscape, 2,000 words on the methodology and case analysis, and 1,500 words on conclusions and implications.

  **Feasibility of the Method:**
  Designing the Minimal Pair cases is the most time-intensive part of the project. It requires iterative refinement to ensure no confounding variables exist. I will dedicate the first three weeks of the semester to drafting and testing these cases (informally) to ensure they hold up to scrutiny. The rest of the paper depends on the robustness of these examples.

  **Feasibility of the Argument:**
  The argument does not require mastering the entire history of contractualism, but it does require a precise understanding of the "reasonable rejection" criterion. I will focus on the core formulation of the theory rather than peripheral debates. The constraint against naming specific philosophers helps maintain focus on the arguments rather than exegesis.

  **Potential Bottlenecks:**
  The "Failure Conditions" section of the paper risks becoming too defensive. I must ensure that the paper remains constructive. The goal is to advance the debate, not just critique it. I will structure the paper so that the risk assessment serves to strengthen the positive argument (by showing I have considered objections) rather than undermining it.

  **Timeline:**
  *   *Weeks 1-3:* Refine the Minimal Pair cases. Ensure they meet the Ceteris Paribus Constraint.
  *   *Weeks 4-6:* Draft the "Existing Landscape" section. Characterize the three positions without relying on specific citations.
  *   *Weeks 7-9:* Draft the core argument (Methodology and Analysis). This is the heart of the paper.
  *   *Weeks 10-12:* Draft the Conclusion and Failure Conditions.
  *   *Weeks 13-14:* Revision and polishing. Ensure the distinction between Within-Person and Cross-Person is maintained consistently throughout the text.

  **Conclusion on Viability:**
  The project is viable because it addresses a known stalemate in the literature with a novel conceptual distinction. It does not require empirical data, only philosophical argumentation and thought experimentation, which fits the scope of a term paper. The word count is sufficient to develop the cases in enough detail to be persuasive without requiring a book-length treatment. The primary challenge will be maintaining precision in language to ensure the two questions remain distinct throughout the writing process. If I can successfully articulate the difference between "my complaint is stronger because others suffer" and "our complaints together are stronger," the paper will make a significant contribution to the understanding of contractualist aggregation.

  ## VIII. Summary of Contribution

  This project proposes a shift in the dialectic of the aggregation problem. By moving from the question "Do numbers count?" to "How do numbers count?", it opens a space for contractualism to defend itself against charges of implausibility without abandoning its individualist foundations. If successful, the paper will show that the aggregation problem is not a single wall but a gate that can be opened with the right key. The key is recognizing that the social context of harm affects the individual moral standing of the victim. This preserves the insight that we are separate persons while acknowledging that we live in a world with others. The proposal outlines a clear path to demonstrating this, with defined methods, clear success criteria, and an honest assessment of where the argument might fail. This makes it a suitable and rigorous topic for a semester-long term paper.
