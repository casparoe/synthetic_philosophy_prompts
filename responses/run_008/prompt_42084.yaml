prompt: |-
  Last night my two friends Dana and Rob spent like two hours at dinner going at it over our friend Priya's giving habits, and I was stuck in the middle the whole time and honestly couldn't tell who was winning. Context: Priya donates a decent chunk of her salary to the animal shelter two blocks from her apartment and won't give to famine relief or anything far away, and when pressed she just says she cares more about the dogs she can go visit, full stop. So Dana opened with: that's not a moral position, that's proximity bias — whether the suffering is down the block or across an ocean doesn't change what it's like for the victim, so her concern is being steered by a morally arbitrary factor, which is pretty much the defintion of a bias masquerading as a moral preference. Rob countered that ALL moral concern has contingent sources — Dana presumably cares about her own kid more than a stranger's kid, and common-sense morality blesses that as a legitimate special obligation rather than a bias — so if partiality toward your family counts as moral, why does partiality toward your neighborhood dogs suddenly get pathologized? Dana said the family case is different because relationships generate obligations: her kid depends on her, there are promises and history involved, whereas the shelter dogs made no claim on Priya specifically — Priya isn't partial to individuals she has relationships with, she's partial to a category (nearby dogs) defined by nothing but where she happens to live, and that could have been otherwise with no change in anything that matters. Rob came back that "nearby" isn't as arbitrary as Dana pretends: giving locally means Priya can watch the money actually working, verify the charity isn't a scam, maybe volunteer on weekends — so maybe what looks like distance-bias is really a preference about being a hands-on agent rather than a judgment about whose suffering counts. Dana's last word was that this proves her point: Priya never says any of that until