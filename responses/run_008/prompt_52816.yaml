answer: |-
  This is a classic coordination problem disguised as a semantic dispute. Your intuition is correct: your friend is leveraging the *origin* of the convention to argue about the *normative status* of its maintenance, skipping over the mechanics of how conventions actually function in a population. As a philosopher working in this tradition, I can tell you that the slogan "conventions are arbitrary" is a philosophical Rorschach test. It looks like a single premise, but it dissolves into several distinct claims with very different truth values and normative implications.

  Here is the menu of precise theses hidden behind that slogan, evaluated through the lens of Lewis, Schelling, and evolutionary game theory.

  ### The Menu of "Arbitrariness" Theses

  #### 1. The Equilibrium Thesis (Lewisian Arbitrariness)
  *   **Thesis:** For any existing convention $R$, there exists at least one alternative regularity $R'$ that *could have* solved the coordination problem equally well had the population converged on it instead.
  *   **Status:** **Substantive and Defensible (within Lewis's 1969 framework).** This is the technical definition of arbitrariness in *Convention*. It refers to the existence of alternative coordination equilibria.
  *   **Supports Reform?** **No.** This thesis describes the *history* of selection, not the *current* game structure. Once $R$ is selected, $R'$ is no longer an equilibrium because no one expects others to follow it. Switching to $R'$ requires a coordinated shift, which incurs transition costs. The existence of a *past* alternative does not imply a *costless future* switch.
  *   **Evolutionary Context:** Consistent with "lock-in." Evolutionary dynamics (like replicator dynamics) show that once a population locks into an equilibrium, moving to an alternative equilibrium requires overcoming a "basin of attraction."

  #### 2. The Saussurean Thesis (Semiotic Arbitrariness)
  *   **Thesis:** There is no intrinsic, natural, or causal connection between the signifier (the spelling "night") and the signified (the concept/phoneme).
  *   **Status:** **Platitude.** Almost everyone agrees spelling is not biologically determined (unlike, say, a blush).
  *   **Supports Reform?** **No.** This is a category error. The utility of spelling is not reference (linking word to world) but coordination (linking writer to reader). Even if the link is arbitrary, the *stability* of the link has immense non-arbitrary value. A map is arbitrary (you could draw the coastline differently), but swapping maps mid-voyage is dangerous.

  #### 3. The Historical Contingency Thesis (Path Dependence)
  *   **Thesis:** The specific form of the convention was determined by chance, drift, or minor historical accidents rather than by a deliberate optimization process.
  *   **Status:** **Substantive and Likely True.** English spelling is a mess of etymological fossils and printing press decisions. It was not designed by a central planner for efficiency.
  *   **Supports Reform?** **Weakly.** This supports the idea that the *current* spelling isn't optimal. However, it does not support the claim that *reform* is costless. Evolutionary theory teaches us that suboptimal equilibria are stable. A suboptimal convention is still better than a period of chaotic transition where no convention holds.

  #### 4. The Normative Weightlessness Thesis (Moral Arbitrariness)
  *   **Thesis:** Because the convention is arbitrary, it generates no moral or prudential obligations. Adhering to it is merely a habit, not a duty.
  *   **Status:** **Outright False.** In the Lewis–Schelling tradition, conventions generate *expectations*. When you rely on my adherence to the convention (to read my text), I incur an obligation based on that reliance. Violating the convention creates negative externalities (confusion, miscommunication) for others.
  *   **Supports Reform?** **No.** This thesis attempts to dissolve the coordination problem by denying the existence of the interdependence. But the interdependence is real. If I spell phonetically and you don't, communication fails. The "obligation" is derived from the welfare costs of coordination failure, not the intrinsic sanctity of the spelling.

  #### 5. The Costless Transition Thesis (Pragmatic Arbitrariness)
  *   **Thesis:** Moving from Convention $R$ to Convention $R'$ involves no significant loss of utility, coordination, or welfare.
  *   **Status:** **Outright False.** This is the hidden premise required for your friend's conclusion to hold. It ignores network effects. The value of a spelling system is proportional to the number of people using it. During reform, that number drops, causing a collapse in utility.
  *   **Supports Reform?** **Yes, but only because it is false.** If this were true, reform would be easy. But since it is false, this thesis actually constitutes the *principled objection* to reform: the transition costs are prohibitively high.

  ---

  ### Locating Your Suspicion

  Your suspicion is astute and maps directly onto the distinction between **Thesis 1 (Equilibrium/Selection Time)** and **Thesis 5 (Transition/Entrenchment)**, with a side of **Thesis 4 (Normative Standing)**.

  You identified that your friend is conflating:
  1.  **Arbitrariness at Selection Time:** "We could have started with 'f' instead of 'ph'." (True, Thesis 1).
  2.  **Arbitrariness in Current Merits of Switching:** "It doesn't matter if we switch now." (False, Thesis 5).
  3.  **Normative Standing:** "No one can tell me how to spell." (False, Thesis 4).

  **Does this defeat her conclusion?**
  Yes, decisively. Her argument relies on the inference: *Because the origin was arbitrary (1), the maintenance is optional (4) and the switch is costless (5).*

  The Lewisian counter-argument is that conventions are **self-reinforcing**. The reason to follow the convention is not that it is the *best* possible system in the abstract, but that it is the system *others expect you to follow*.
  *   **The Principled Objection:** The objection to reform is not "tradition is sacred." The objection is **Consequentialist**. Uncoordinated reform leads to a breakdown in communication (a coordination failure). Coordinated reform requires a transition period where utility plummets (everyone has to relearn). Therefore, there is a *principled, welfare-based objection* to reform: it imposes massive transition costs on the population for a gain (regularity) that may not offset those costs.
  *   **Standing:** You have "standing" to enforce the convention because your adherence is a public good. Deviating (spelling reform unilaterally) is a form of free-riding or pollution; you gain the expressiveness of your new system while imposing the decoding cost on everyone else.

  ---

  ### The Lewis Wrinkle: Did He Drop Arbitrariness?

  You recall correctly that Lewis's view evolved, but the nuance is critical for your debate.

  In *Convention* (1969), Lewis defined convention strictly, requiring that there be an alternative regularity $R'$ that would have worked *about as well*. This is strict arbitrariness.
  However, in the **Postscript to the 1983 reprint of *Convention***, and in his paper "Languages and Language" (1975), Lewis softened this. He acknowledged that strict arbitrariness might not be necessary.
  *   **The Shift:** Lewis conceded that a convention could exist even if one equilibrium is *slightly* better than the alternatives, provided that the *primary reason* for following it is still the expectation that others will follow it, not the intrinsic superiority of the rule.
  *   **Why he softened it:** To account for cases where a convention drifts toward efficiency, or where one option is marginally preferred but still requires coordination to sustain.

  **What this does to her argument:**
  Paradoxically, Lewis dropping strict arbitrariness **weakens your friend's position**, it does not help her.
  *   **If arbitrariness is essential (1969 Lewis):** She can claim spelling is arbitrary. But you counter with *entrenchment* (Thesis 5).
  *   **If arbitrariness is non-essential (1983 Lewis):** Then the *merits* of the convention matter more. If the current spelling is entrenched, it has value *because* it is entrenched. If a reformed spelling is proposed, it must prove it is not just "arbitrarily different" but *sufficiently better* to overcome the inertia of the current equilibrium.
  *   **The Knockout:** Lewis's later work emphasizes **precedent** and **salience**. The fact that a convention *exists* makes it salient. To overturn it, the new system must be so salient or so superior that it creates a new focal point. Merely pointing out that the old one was "arbitrary" is irrelevant. The burden of proof shifts to the reformer to show that the new equilibrium is stable and worth the transition cost.

  ### Strategic Summary for Your Friend

  Bring her this distinction:
  1.  **Origin vs. Maintenance:** Agree that spelling was arbitrary *in origin* (Thesis 1 & 3).
  2.  **The Network Effect:** Explain that conventions derive their value from *common knowledge*, not intrinsic merit.
  3.  **The Principled Objection:** The objection to reform is not "we must keep the old rules." It is "uncoordinated switching destroys the value of the system."
  4.  **The Lewis Update:** Even if Lewis softened the definition of arbitrariness, he doubled down on the idea that we follow conventions because we *expect others to*. Reform fails not because it's "wrong," but because it breaks the expectation structure that makes communication possible.

  Her slogan "conventions are arbitrary" is a half-truth that ignores the second half of Lewis's definition: "...and we follow them because we expect each other to." The first half allows for reform in the abstract; the second half explains why reform fails in practice.
