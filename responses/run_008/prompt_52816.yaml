      *   *Impact on Friend's Argument:* If Lewis softens arbitrariness, it actually *weakens* the friend's argument. If conventions can be non-arbitrary (e.g., one spelling is genuinely more efficient), then reform might be principled. If conventions are defined by *reasons for action* rather than strict alternative equilibria, the *cost of switching* becomes the central normative factor, not the origin.

