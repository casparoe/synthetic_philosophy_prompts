      *   *Evolutionary Game Theory (Skyrms, Young, etc.):* Conventions emerge via dynamics (replicator, best response). "Arbitrariness" here relates to path dependence. Once locked in, switching is costly.
      *   *The Friend's Inference:* Arbitrary $\rightarrow$ No principled objection to reform.
