  # The Moral Exchange Protocol (MEP)
  **Version 1.0 | For Foundation Board Use**

  ## Purpose
  To move the board from *compromise* (diluting all projects to acceptable levels) to *trade* (maximizing intensity-satisfied outcomes across divergent values), while maintaining fiduciary duty, auditability, and respect for constitutive moral constraints.

  ## Constraints & Assumptions
  *   **Time:** 3.5 Hours (Half-day session).
  *   **Participants:** 7 Trustees (No philosophy training assumed).
  *   **Authority:** Each trustee holds a "Core Concern Veto."
  *   **Auditability:** All decisions must be recorded as "Portfolio Optimization Decisions," not "Vote Trades."

  ---

  ## Part 1: The Procedure

  ### Phase 1: The Constitutive Screen (30 Minutes)
  *Goal: Distinguish between **Preferences** (tradable) and **Constraints** (non-tradable).*

  1.  **Pre-Work:** Before the meeting, each trustee submits a "Core Concern Statement" (1 paragraph) for any grant they oppose.
  2.  **The Test:** In the meeting, the Chair reads the statement. The objecting trustee must answer one question: *"If we offered you double the budget for your top priority in exchange for accepting this grant, would you still object?"*
      *   **Yes:** This is a **Constitutive Constraint**. It triggers a Veto. No trade is possible. The grant is dead or must be modified to remove the objectionable feature.
      *   **No:** This is a **Preference**. It enters the Trading Pool.
  3.  **Record:** The minutes record this as "Identification of Fiduciary/Moral Constraints vs. Strategic Priorities."

  ### Phase 2: Intensity Elicitation (60 Minutes)
  *Goal: Map preference strength without requiring a common utility currency.*

  1.  **The Token System:** Each trustee is allocated 100 "Influence Tokens" for this cycle.
  2.  **Budgeting:** Trustees distribute tokens across the *Trading Pool* grants.
      *   If you care moderately, spend 10 tokens.
      *   If this is your top priority, spend 40+ tokens.
      *   If you are indifferent, spend 0.
  3.  **The "Cost to Swap" Question:** For any grant where you oppose the majority, you must state: *"I am willing to withdraw my opposition if my top priority receives X tokens of support from the opposition."*
  4.  **Audit Check:** Token distributions are kept confidential from the public but recorded in internal minutes to justify "Resource Allocation Weighting."

  ### Phase 3: The Trading Floor (90 Minutes)
  *Goal: Execute Pareto-improving swaps.*

  1.  **Matching:** The Chair (or neutral facilitator) identifies pairs where Trustee A has high tokens on Grant X and low on Grant Y, while Trustee B has high tokens on Grant Y and low on Grant X.
  2.  **Structuring the Deal:**
      *   **Bundling:** Grants are approved in packages (e.g., "Package A: X-Risk + Maternal Health").
      *   **Side Payments:** If values don't align perfectly, use "Budget Share." (e.g., "We fund your grant at 100%, but you concede 10% of your budget share to my priority next cycle.")
      *   **Sunset Clause:** All trades are valid for 2 cycles (1 year). This prevents locking in bad deals if values shift.
  3.  **Third-Party Harm Check:** Before finalizing, the Board Counsel asks: *"Does this trade impose significant harm on beneficiaries not represented at this table?"*
      *   If **Yes** (e.g., cutting life-saving medical research to fund animal welfare): The trade is **Blocked**. The grant reverts to Phase 4.
      *   If **No** (e.g., funding AI safety vs. malaria nets): The trade proceeds.

  ### Phase 4: Fallback (Moral Parliament) (30 Minutes)
  *Goal: Resolve deadlocks without watered-down compromise.*

  If no trade is reached (e.g., everyone has high intensity on opposing items, or Third-Party Harm blocks the deal):
  1.  **Proportional Allocation:** The budget is sliced according to token weight.
  2.  **Example:** If 60% of tokens support X-Risk and 40% support Maternal Health, 60% of the *discretionary* budget goes to X-Risk, 40% to Maternal Health.
  3.  **Rationale:** "The Board could not identify efficiency gains through trade; therefore, it allocated capital proportionally to demonstrated intensity of trustee conviction."

  ---

  ## Part 2: Failure Mode Safeguards

  | Failure Mode | Mitigation Mechanism |
  | :--- | :--- |
  | **Strategic Exaggeration** (Hoarding tokens) | **Consistency Audit:** If a trustee spends 90 tokens on a project but argues weakly for it in discussion, the Chair can flag the "Intensity Mismatch." Repeated offenses reduce token allocation next cycle. |
  | **Logrolling** ("I scratch your back") | **Audit Language:** Minutes must not say "Trustee A traded for Trustee B." They must say: "The Board determined that a combined portfolio approach maximizes aggregate impact across diverse value dimensions." |
  | **Third-Party Harm** | **Charter Constraint:** The "Third-Party Harm Check" (Phase 3, Step 3) is a hard stop. Beneficiaries cannot be bargained away for trustee moral satisfaction. |
  | **Constitutive Collapse** | **Phase 1 Veto:** Rigid moralists (Kantians) are not forced to trade. They exercise veto power, protecting their integrity and preventing deals they would view as illegitimate. |

  ---

  ## Part 3: Running the Live Cases

  ### Case 1: X-Risk (Utilitarians) vs. Maternal Health (Humanists)
  *   **Setup:** 2 Utilitarians want 30% budget to X-Risk. 2 Humanists want 30% to Maternal Health. Both say the other can wait.
  *   **Phase 1 (Screen):** Both sides answer "No" to the Constitutive Test. They prefer their priority, but would accept the other if their own was fully funded. **Status: Tradable.**
  *   **Phase 2 (Intensity):**
      *   Utilitarians spend 80 tokens on X-Risk, 5 on Maternal Health.
      *   Humanists spend 80 tokens on Maternal Health, 5 on X-Risk.
  *   **Phase 3 (Trade):**
      *   **Match:** High intensity divergence.
      *   **Deal:** Fund both at full intensity (30% each). The remaining 40% is split or saved.
      *   **Third-Party Check:** Neither grant harms third parties; both aim to help.
  *   **Outcome:** **Trade Approved.**
  *   **Audit Rationale:** "The Board recognized divergent impact timelines (far-future vs. near-term). By funding both fully rather than partially, the Board maximizes expected value across both time horizons, respecting the intensity of trustee conviction regarding urgency."
  *   **Result:** Efficient. Everyone wins relative to compromise.

  ### Case 2: Manipulative Advertising (Kantian vs. Everyone Else)
  *   **Setup:** 6 Trustees want to fund an Effective Charity using emotional ads. 1 Kantian objects to manipulation.
  *   **Phase 1 (Screen):**
      *   Chair asks Kantian: *"If we offered double budget for Animal Welfare, would you accept the manipulative ads?"*
      *   Kantian answers: *"No. Using persons as means is impermissible regardless of consequences."*
      *   **Status: Constitutive Constraint.**
  *   **Phase 2 (Intensity):** Skipped. Veto triggered.
  *   **Phase 3 (Trade):** Blocked.
  *   **Outcome:** **Grant Rejected (or Modified).**
  *   **Audit Rationale:** "The proposed grant mechanism violated a core fiduciary constraint regarding donor/beneficiary autonomy as defined in the Board's Ethical Charter (Section: Respect for Persons). No trade is permissible on compliance matters."
  *   **Result:** Inefficient for the majority, but procedurally correct. The Kantian's veto protects the constraint.

  ### Case 3: Animal Testing Institute (Welfarist + Utilitarians vs. Charter/Harm)
  *   **Setup:**
      *   **Welfarist:** Offers vote on X-Risk (which they don't care about) in exchange for cutting Animal Testing Institute (ATI).
      *   **Utilitarians (You):** Want X-Risk funded. Value ATI as scientifically valuable (pandemic prevention).
      *   **Trade:** Welfarist supports X-Risk; Utilitarians support cutting ATI.
  *   **Phase 1 (Screen):** Both sides indicate willingness to trade. **Status: Tradable.**
  *   **Phase 2 (Intensity):**
      *   Welfarist spends 95 tokens on cutting ATI.
      *   Utilitarians spend 60 tokens on X-Risk, 30 tokens on ATI.
      *   *Note:* The Utilitarians value X-Risk more than ATI, but they value ATI *positively*.
  *   **Phase 3 (Trade & Harm Check):**
      *   **Proposed Deal:** Fund X-Risk (with Welfarist support); Defund ATI.
      *   **Third-Party Harm Check:** The Counsel notes that ATI research contributes to pandemic preparedness (human safety). Defunding it increases existential risk from biology, even if AI risk is mitigated.
      *   **Constraint:** The Foundation Charter mandates "Maximization of Human Welfare."
      *   **Ruling:** Trading a *certain* reduction in human safety (cutting ATI) for a *probabilistic* gain in X-Risk (via Welfarist support) violates the "Do No Harm" fiduciary duty regarding current beneficiaries.
      *   **Decision:** **Trade Blocked.**
  *   **Phase 4 (Fallback):** Moral Parliament.
      *   Budget is allocated by token weight.
      *   X-Risk gets majority support but not the Welfarist's bonus vote.
      *   ATI retains funding because the Welfarist lacks the votes to cut it without the Utilitarian trade.
  *   **Outcome:** **Status Quo Maintained (No Trade).**
  *   **Audit Rationale:** "While a trade was proposed, the Board determined that defunding the ATI posed unacceptable risks to current human beneficiaries. The Board reverted to proportional allocation to ensure no single value system imposes negative externalities on protected classes."
  *   **Result:** **You (The Utilitarian) Lose.**
      *   You wanted the trade to secure the Welfarist's vote for X-Risk.
      *   The procedure blocked the trade to protect the ATI's human beneficiaries.
      *   You do not get the Welfarist's bonus support. X-Risk funding is lower than it would have been under the trade.
      *   *Why this stings:* The procedure imposed a deontological constraint ("Do No Harm to current beneficiaries") on *you*, the Utilitarian, preventing you from making a calculated trade-off that you believed was net-positive. The system prioritized auditability and risk-aversion over your expected-value calculation.

  ---

  ## Part 4: Honest Limits & Meta-Ethical Disclosure

  This procedure is not moral magic. It is a coordination mechanism with specific failure modes you must acknowledge in your internal memos.

  ### 1. Mechanics Disguised as Philosophy
  The "Token System" (Phase 2) pretends to measure moral intensity, but it actually measures **political capital**. A trustee with more time, charisma, or confidence will hoard tokens more effectively. This is not a utilitarian calculus; it is a parliamentary procedure with extra steps. Do not claim the outcome is "Objectively Better." Claim it is "Procedurally Robust."

  ### 2. The Reliability of Stated Intensity
  Trustees will exaggerate. If the Welfarist knows their vote is the swing vote on X-Risk, they will spend 100 tokens on Animal Welfare to extract maximum concession. The "Consistency Audit" is weak. You are relying on social norms among friends/colleagues to prevent gaming. If those norms break, the procedure collapses into logrolling.

  ### 3. The "Corruption" of Trade
  This is the hardest pill. Toby Ord's insight assumes moral views are *preferences*.
  *   **For the Utilitarian:** This is fine. Values are functions to be maximized.
  *   **For the Kantian:** Trading is suspicious.
  *   **For You:** The procedure forces you to treat your moral convictions as **currency**. In Case 3, you were willing to trade the ATI (which saves lives) for X-Risk support. The procedure blocked you, but the mere act of *offering* that trade requires you to view human lives as fungible against animal suffering in a way that might feel repugnant to external auditors (or your own future self).
  *   **The Limit:** The procedure cannot settle whether trading convictions is permissible. It assumes it is. If a trustee wakes up and decides "Trading my values is itself a sin," the procedure breaks. Phase 1 catches this, but it creates a deadlock.

  ### 4. The Third-Party Blind Spot
  The procedure protects third parties only if their harm is *visible* and *charter-mandated*. In Case 3, the "future people" saved by X-Risk are third parties too. The procedure favored the *visible* current beneficiaries (ATI patients) over the *invisible* future beneficiaries (X-Risk). This is a systematic bias toward the near-term and the tangible. As a Utilitarian, you know this is suboptimal, but the procedure cannot correct for it without violating its own auditability constraints.

  ## Final Recommendation
  Run the MEP. It will improve efficiency on Case 1 type problems. It will protect the Kantian on Case 2 type problems. But be prepared for Case 3: the system will sometimes prioritize **defensibility** over **optimality**. As a Utilitarian on a board with fiduciary duties, you must accept that "Audit-Proof" is a constraint on your utility function, not just a bureaucratic hurdle. If you cannot accept that constraint, you are the one incompatible with the board, not the other way around.
