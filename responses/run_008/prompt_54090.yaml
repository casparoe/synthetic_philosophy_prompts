answer: |-
  **Final Examination: Contemporary Normative Theory**
  **Take-Home Essay Question**

  **Case Study: The Oakhaven Budget**
  The town of Oakhaven has a one-time public health surplus. The Council must choose between two mutually exclusive programs. **Option A** involves retrofitting the municipal reservoir. Without this, 40,000 residents will each suffer a single, isolated episode of debilitating nausea lasting two days. No resident suffers more than this single episode. **Option B** funds a specialized treatment program. Without this, 30 children will contract a rare degenerative condition resulting in lifelong, severe mobility loss. No child suffers more than this condition. The largest individual complaint on side A (two days of nausea) is significantly smaller than the smallest complaint on side B (lifelong mobility loss).

  **The Cumulative Complaint Principle (CCP):** *A principle is reasonably rejectable if the sum of the strengths of all individual complaints against it exceeds the corresponding sum for any alternative.*

  **Essay Prompt**
  Write an essay addressing the following three parts:

  (i) **The Aggregation Problem:** Explain the aggregation problem as it arises specifically in the Oakhaven case. Why does Scanlon's standard test of reasonable rejectability appear unable to resolve this choice without yielding a counterintuitive result? Do not simply define contractualism; explain the mechanical failure of the pairwise comparison here.

  (ii) **Evaluating the CCP:** Evaluate the Cumulative Complaint Principle. Does this principle preserve the contractualist form of justification, or does it smuggle utilitarian content into the theory? You must distinguish between aggregating complaints within a single pairwise comparison versus aggregating across all affected persons. Furthermore, take seriously the best defense of the CCP: why is it obscure why one person's grave complaint should silence 40,000 modest ones when no individual burden on either side is extreme?

  (iii) **Scanlon's Response and Parfit's Worry:** What should Scanlon himself say about the CCP? Invoke the individualist restriction in your answer. Finally, address Parfit's worry that any threshold view (where numbers sometimes matter) can be destabilized by a chain of intermediate cases. Does rejecting the CCP leave contractualism with anything principled to say about Oakhaven, or is there a viable stopping point between the view that numbers never matter and the view that only totals matter?

  ***

  **Model Answer**

  The aggregation problem in Oakhaven arises because Scanlon's framework relies on pairwise comparisons of individual reasons for rejection. In this case, any single resident suffering nausea has a weaker individual reason to reject Option B than any single child suffering mobility loss has to reject Option A. Because contractualism evaluates principles based on whether any *individual* could reasonably reject them, the 30 children's severe complaints outweigh the 40,000 residents' minor ones. The mechanical failure is that the theory counts persons, not complaints; it prevents the minor complaints from pooling their strength to override the major complaint, leading to the counterintuitive result that 40,000 people suffer so that 30 do not.

  The Cumulative Complaint Principle (CCP) attempts to solve this by summing the strengths of all complaints. While this yields the intuitively correct outcome for Oakhaven, it smuggles utilitarian content into contractualism. Standard contractualism aggregates reasons only within a single individual's standpoint (e.g., weighing one person's safety against their liberty), not across different persons. The CCP treats the 40,000 residents as a collective entity whose total pain outweighs the children's total pain. This violates the contractualist form of justification, which is owed to each individual separately. However, the defense of the CCP is potent. It is obscure why a single grave complaint should automatically silence 40,000 modest ones when the total suffering on the nausea side is vastly greater. If justification is about finding principles no one could reasonably reject, it seems reasonable to reject a principle that ignores massive aggregate suffering for the sake of a few, provided no single individual on the majority side is being sacrificed excessively.

  Scanlon must reject the CCP to maintain the individualist restriction, which forbids sacrificing one person for the greater good of others. Accepting the CCP would collapse contractualism into a form of weighted utilitarianism. However, rejecting it leaves the theory vulnerable to Parfit's worry. If Scanlon argues that numbers matter only after a certain threshold (e.g., if 1 million people were nauseous), Parfit argues that no principled stopping point exists. We can construct a chain of intermediate cases where removing one person from the majority group seems irrelevant, yet eventually, we arrive back at the original 40,000 vs. 30 case. If the theory cannot identify a non-arbitrary threshold where numbers begin to count, it faces a dilemma: either accept the counterintuitive Oakhaven result (numbers never matter) or accept the CCP (only totals matter). A viable stopping point might rely on qualitative significance rather than quantitative thresholds, but Parfit's continuum suggests that without aggregating complaints, contractualism risks silence in cases of large-scale minor harms versus small-scale major harms.

  ***

  **Marking Scheme (20 Marks)**

  **1. Identification of the Aggregation Problem (4 marks)**
  *   **Must Hit:** Student explains that pairwise comparison prevents minor complaints from pooling strength against major complaints, leading to the counterintuitive result in Oakhaven.
  *   *Common Miss:* Students define contractualism generally but fail to explain why the *mechanism* of pairwise comparison fails in this specific numerical context.

  **2. CCP vs. Individualist Restriction (4 marks)**
  *   **Must Hit:** Student identifies that CCP aggregates *across* persons, violating the individualist restriction which requires justification *to* each person.
  *   *Common Miss:* Students label CCP as "utilitarian" without explaining the structural violation of pairwise comparison vs. summation.

  **3. Steelmanning the CCP (4 marks)**
  *   **Must Hit:** Student articulates the intuition that ignoring 40,000 complaints is unreasonable even if individual burdens are small, challenging the strict individualist view.
  *   *Common Miss:* Students dismiss the CCP immediately as utilitarian without engaging with the moral intuition that volume of suffering should matter.

  **4. Scanlon's Stance (4 marks)**
  *   **Must Hit:** Student affirms Scanlon must reject CCP to preserve contractualism's core commitment to individual justification.
  *   *Common Miss:* Students suggest Scanlon could accept CCP with minor tweaks, missing the fundamental incompatibility with the individualist restriction.

  **5. Parfit's Worry and Stopping Point (4 marks)**
  *   **Must Hit:** Student explains Parfit's chain of cases argument and evaluates whether a non-arbitrary threshold exists between "numbers never matter" and "only totals matter."
  *   *Common Miss:* Students mention Parfit but fail to connect the "chain of cases" to the difficulty of finding a principled stopping point in Oakhaven.

  **Differentiating A from B Answers**
  A **B-range answer** will correctly state the individualist restriction and criticize the invented principle for being utilitarian in disguise. It will successfully identify that Scanlon must reject the CCP. However, it will stop there, treating the rejection as a successful defense of the theory. An **A-range answer** must engage the final clause of part (iii): it must analyze what the theory should say about the case *after* rejecting the CCP. The A answer will grapple with the implication that rejecting CCP may leave contractualism silent or arbitrary in the face of Parfit's worry, critically evaluating whether a principled stopping point is actually possible or if the theory must accept counterintuitive results to maintain its integrity.
