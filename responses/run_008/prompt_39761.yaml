answer: |-
  This is a classic philosophical stalemate, often framed as **Ethicism** (your friend's view) versus **Autonomism** or **Formalism** (your view). The fact that you agree on every concrete case but disagree on the label suggests you have correctly identified that the battle is over the *concept* of "good art," not the *content* of specific works.

  However, your hypothesis that this is "mostly verbal" is only half-right. If it were purely verbal, you could simply say, "You mean *good*₁, I mean *good*₂," and move on. The fact that you can't suggests there is a substantive normative disagreement hiding inside the verbal one.

  Here is a diagnosis of the standoff, followed by paths for progress.

  ### 1. The Diagnosis: A Dispute Over the Ontology of the Artwork

  You are not just arguing about definitions; you are arguing about **what an artwork actually is.**

  *   **Your View (The Artifact View):** You treat the artwork as a **tool** or an **object**. Like an engine, it has mechanical properties (craft, technique, structure) that can be measured independently of how it is used or what it points at. For you, "good art" describes the *quality of the manufacture*.
  *   **Her View (The Transaction View):** She treats the artwork as an **event** or a **relationship**. Art is something that *happens* between the work and the audience. For her, "good art" describes the *quality of the experience*.

  **Why this causes a stall:**
  When you say the Nazi documentary is "good art," you are praising the *manufacture* (the editing, the music, the camera work). When she says it is "bad art," she is condemning the *transaction* (the viewer is being manipulated into loving evil).

  You are both right, but you are measuring different things. The frustration arises because English forces you to use the same adjective ("good") for both the quality of the *object* and the value of the *experience*.

  ### 2. Is there a "Fact of the Matter" about the word "Good"?

  You asked if there is a fact of the matter about who owns the word. **No.** There is only a pragmatic fact.

  The word "good" in aesthetics is not just descriptive; it is **commendatory**. To call something "good art" is usually to recommend it, to suggest it is worth engaging with, or to claim it contributes something positive to culture.

  *   **Her Claim:** If a work damages the audience (by normalizing evil), it cannot be commended. Therefore, it cannot be "good."
  *   **Your Claim:** If a work demonstrates mastery, it deserves recognition. Therefore, it is "good," even if we condemn its message.

  The substantive question underneath is: **Does the label "Good Art" imply a recommendation to engage?**
  *   If yes, she is right. (You wouldn't recommend *Triumph of the Will* as a "good film" for a Friday night.)
  *   If no, you are right. (You can acknowledge it as a "good example of editing" without recommending it.)

  ### 3. Paths for Progress

  Since you don't want to "go home" (split the word and stop talking), here are three ways to move the conversation forward without requiring one of you to surrender.

  #### A. The "Proficiency vs. Success" Distinction
  You currently both fight over "Good Art." Try splitting this into **"Artistically Proficient"** vs. **"Artistically Successful."**

  *   **You** argue the work is *Proficient* (the engine works).
  *   **She** argues the work is *Unsuccessful* (the car crashed).

  **The Progress:** Agree that a work can be *Proficient* but *Unsuccessful*. This validates your observation of craft without invalidating her moral concern. The standoff often breaks when you admit that "Good Art" is an all-things-considered judgment (Success), while you are isolating a specific variable (Proficiency). If she agrees the craft is "proficient," you win the point that matters to you. If you agree the work is "unsuccessful" overall, she wins the point that matters to her.

  #### B. The "Hidden Flaw" Thought Experiment
  To test if the disagreement is truly substantive, propose this case:

  > Imagine a film that is morally repulsive, but **no one knows it.** The director hid subtle code in the film that glorifies genocide, but it is undetectable to any human audience. The audience has a standard, positive emotional experience.

  *   **Your Prediction:** You should say the art is still "good" because the craft is unchanged. The moral flaw is inert.
  *   **Her Prediction:** She should say the art is "flawed" because the *intent* or the *object itself* is corrupted, even if the effect is neutral.

  **The Progress:** If she admits the art is "good" in this specific case (because the moral harm never actualizes), she concedes that aesthetic value relies on the *effect on the audience*, not just the moral status of the content. If she insists it is still "bad," she reveals her position is about **purity of origin**, not audience harm. This clarifies exactly where the normative disagreement lies.

  #### C. The "Invitation" Framework
  Reframe the definition of art. Instead of "Art is an object," propose: **"Art is an invitation to a perspective."**

  *   **Your View:** The invitation can be skillfully written, even if the party is terrible.
  *   **Her View:** An invitation to a terrible party is a bad invitation, regardless of the calligraphy.

  **The Progress:** This shifts the debate from "Is the engine good?" to "What is the function of the invitation?" If the function of art is to expand human understanding, does inviting us into a war criminal's mind expand understanding (Your view: yes, we see the mechanism) or does it corrupt understanding (Her view: no, it normalizes the crime)?

  This moves you from arguing about labels to arguing about the **purpose of art**. You might find you disagree on the *telos* (goal) of art. You see the goal as *expression/mastery*; she sees the goal as *communion/ethical engagement*. That is a deeper, more fruitful disagreement than "Is this word 'good'?"

  ### Summary
  Your hypothesis is correct that the word "good" is doing too much work, but incorrect that it is *only* verbal. It is a **pragmatic dispute about commendation.**

  **To make progress:**
  Stop asking "Is it good art?" Start asking: **"Is this a mastery of craft that we should study, or an experience we should endorse?"**

  You can agree that *Triumph of the Will* is a **mastery of craft we should study** (satisfying you) but **an experience we should not endorse** (satisfying her). If you can agree on that sentence, you have solved the two-year argument without either of you having to be wrong.
