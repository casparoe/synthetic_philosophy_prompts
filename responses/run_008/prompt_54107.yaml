answer: |-
  ### Preliminary Conceptual Map

  Before specifying the desiderata, we must clear the conceptual underbrush. The "War Guilt" debate suffers from a category error: it conflates *historical causation* (what made the war happen), *moral culpability* (who acted wrongly), and *legal liability* (who pays). A theory of national responsibility must decouple these. Causation is often distributed; culpability requires agency; liability is a political tool. If a theory treats Article 231 as a historical thesis, it fails. If it treats Fischer's thesis as a legal verdict, it fails. The following desiderata are designed to force a theory to declare which domain it occupies and how it bridges the others.

  ***

  ### Desiderata for a Theory of National Responsibility in War

  #### 1. The Distinction Between Condition and Trigger
  *   **Specification:** The theory must distinguish between background conditions that made war *probable* (alliance systems, imperialism, arms races) and specific decisions that made war *actual* (mobilization orders, ultimata).
  *   **Motivation:** In July 1914, structuralists argue the "powder keg" was the cause; Fischerians argue the "match" was the cause. A theory that blames the existence of the keg absolves the match-lighter; a theory that blames only the match ignores the arsonist who stored the powder.
  *   **Status:** **Non-Negotiable.** Without this, causation collapses into fatalism or voluntarism.
  *   **Camp Alignment:** Structuralists prioritize conditions; Fischerians prioritize triggers. An adequate theory must weigh both without reducing one to the other.

  #### 2. The Agency Threshold (Intent vs. Negligence)
  *   **Specification:** The theory must specify whether responsibility requires *deliberate intent* to start a general war or if *culpable negligence* (reckless risk-taking without full foresight) suffices.
  *   **Motivation:** This is the crux of the Fischer debate. Did Berlin will the war (Intent), or did they merely accept the risk of a continental war to achieve local goals (Negligence)? In "cascade" wars (e.g., Italy 1915, US 1917), leaders often joined without intending a *long* war, but accepting the risk of one.
  *   **Status:** **Non-Negotiable.** A theory that requires specific intent cannot handle 1914 (where few wanted a *world* war specifically). A theory that accepts mere negligence risks blaming everyone.
  *   **Camp Alignment:** Pro-Fischer requires Intent. Structuralists/Anti-Fischer often rely on Negligence or Systemic Determinism.

  #### 3. The Collective Attribution Bridge
  *   **Specification:** The theory must provide a principled link between the actions of a small cadre of decision-makers and the responsibility of the "nation" (including citizens who bear reparations).
  *   **Motivation:** Article 231 punished the German people for the acts of the Kaiser and Bethmann-Hollweg. In unilateral aggression (e.g., Germany 1939), we accept this link more readily. In 1914, where public enthusiasm varied and parliamentary control differed (e.g., UK vs. Germany), the link is frailer.
  *   **Status:** **Non-Negotiable.** Without this, "national responsibility" is a metaphor, not a basis for reparations or moral judgment.
  *   **Camp Alignment:** Versailles assumed organic national unity (Prejudice). Liberal individualists reject this (Prejudice). The theory must justify the bridge, not assume it.

  #### 4. The Ex-Ante/Ex-Post Epistemic Constraint
  *   **Specification:** The theory must judge decisions based on information available *at the time* (ex-ante), not on the catastrophic outcome that followed (ex-post).
  *   **Motivation:** Hindsight bias makes every risk look like a mistake. In July 1914, leaders believed war might be localized or short. A theory that blames them solely because the war became long and total is engaging in outcome bias.
  *   **Status:** **Non-Negotiable.** Moral responsibility requires control, and control is limited by knowledge.
  *   **Camp Alignment:** Often violated by all camps when emotions run high.

  #### 5. Scalability Across Aggression Types
  *   **Specification:** The theory must yield coherent verdicts for unilateral aggression (1939), multi-causal crises (1914), and opportunistic cascade entry (1915/1917) without changing its core definitions.
  *   **Motivation:** If a theory assigns 100% guilt in 1939 but 0% in 1914 because "everyone did it," it is inconsistent. If it assigns 20% to five powers in 1914, does it assign 20% to Germany and 0% to Poland in 1939?
  *   **Status:** **Non-Negotiable.** Consistency is the baseline of philosophical adequacy.

  ***

  ### Avoiding the Standard Failure Modes

  Any adequate theory must navigate between the Scylla of **Over-Concentration** and the Charybdis of **Over-Diffusion**.

  1.  **Avoiding Over-Concentration:** This is the failure mode of the Versailles diktat and hardline Fischerism. It occurs when a theory isolates a single actor as the *sole* sufficient cause, ignoring the enabling context provided by others. To avoid this, the theory must acknowledge that while one actor may be *most* responsible, the possibility of their action was predicated on the permissiveness or hostility of others.
      *   *Constraint:* The theory must allow for "primary responsibility" without requiring "exclusive causation."

  2.  **Avoiding Over-Diffusion:** This is the failure mode of the "Sleepwalker" or strong Structuralist accounts. It occurs when responsibility is spread so thinly across systemic forces, alliance rigidities, and mutual misunderstandings that no specific agent remains culpable. If "the system" caused the war, then no human is to blame.
      *   *Constraint:* The theory must identify specific decision-points where human agency could have overridden systemic pressure.

  ***

  ### The Incompatibility Matrix: Tensions Within the Desiderata

  Here lies the philosophical friction. I suspect the following subset of desiderata cannot be jointly satisfied without residual tension:

  **The Tension:** *The Collective Attribution Bridge (Desideratum 3)* vs. *The Agency Threshold (Desideratum 2)* vs. *Ex-Ante Epistemic Constraint (Desideratum 4).*

  **The Problem:**
  To hold a *Nation* responsible (Desideratum 3), you generally need to show that the war served some collective interest or reflected a collective will. However, in July 1914, the *Leaders* often acted against the long-term economic interests of their *Citizens* (violating the Bridge). Furthermore, if we judge by *Ex-Ante* knowledge (Desideratum 4), many leaders genuinely believed they were acting defensively or that war would be localized. If we accept *Negligence* as sufficient for Culpability (Desideratum 2), then almost all Great Power leaders are guilty (Over-Diffusion). If we require *Intent*, then arguably no one is guilty of a *world* war, because no one intended the specific catastrophe that occurred (Over-Diffusion/Structuralism).

  **The Unresolvable Conflict:**
  You cannot simultaneously maintain that:
  1.  Citizens are liable for the acts of leaders (Collective Bridge).
  2.  Leaders are only culpable for intended outcomes (Strict Intent).
  3.  Leaders did not intend a general war (Historical Consensus).

  *If (2) and (3) are true, (1) must be false.* Yet, international law and reparations require (1). Therefore, a theory of *national responsibility* for WWI must either abandon strict moral intent (moving to strict liability) or admit that "national responsibility" is a legal fiction unrelated to moral blame. This is the knot the Versailles treaty tried to cut with a sword rather than untie.

  ***

  ### Conclusion: The Adjudicating Requirement

  If one must select a single requirement to adjudicate between Fischer-style verdicts (Germany is primarily guilty) and Shared-Responsibility verdicts (the system failed), it is **Desideratum 2: The Agency Threshold (Intent vs. Negligence).**

  This is the pivot point.
  *   If the theory sets the threshold at **Deliberate Intent to escalate to general war**, the Fischer thesis struggles (as evidence for a conscious plan for *world* war is debated) and the Shared-Responsibility model gains ground (since no one clearly intended the full catastrophe).
  *   If the theory sets the threshold at **Culpable Risk-Taking (Negligence)**, the Fischer thesis thrives (Germany took the biggest risks with the "blank check"), but the Shared-Responsibility model also thrives (Austria, Russia, and France also took culpable risks).

  However, the *degree* of negligence is the true arbiter. The requirement that does the most work is not just defining negligence, but **weighing the asymmetry of risk.** A theory must ask: *Which actor introduced a risk disproportionate to the threat faced?* Fischer wins if Germany's risk-taking was asymmetrical to its security needs. The Structuralists win if all actors' risk-taking was symmetrical and mutually reinforcing. Therefore, the criterion of **Proportionality of Risk** within the Agency Threshold is the specific lever that decides the historical verdict. Without a rigorous standard for what constitutes "reckless" versus "prudent" statecraft in 1914, the debate remains purely ideological.
