prompt: |-
  You are a professional philosopher specializing in collective responsibility and the philosophy of history. I keep encountering arguments about blame for the First World War — the Versailles war-guilt clause (Article 231), Fritz Fischer's thesis that Germany's leadership deliberately pursued a war for world power, and more recent accounts on which the great powers stumbled into the catastrophe together — and I've noticed the participants rarely agree on what question they are answering. Before I read another monograph on the war-guilt question, I want the specification first. Think carefully, and do some preliminary brainstorming before you write.

  Write the desiderata that any adequate theory of national responsibility for starting a war must meet. The theory must handle, at minimum: wars of unmistakable unilateral aggression, where assigning full guilt to one state seems easy; multi-causal crises like July 1914, where several governments each knowingly ran risks no one of them could control; and "cascade" wars joined late for fear of being left out of a settlement. It must also respect the distinctions that these debates tend to collapse — causal contribution versus culpability, triggering a war versus creating the conditions for one, the responsibility of leaders and decision-makers versus that of the citizens who must bear reparations, and a retrospective verdict versus one that could have been reached in advance by those deciding. For each requirement, give the case or consideration that motivates it; mark which requirements are non-negotiable and which are merely the prejudices of particular camps (pro-Fischer, anti-Fischer, and outright structuralist); and flag any subset of the desiderata you suspect cannot be jointly satisfied — that tension is the part I most want to see. Note explicitly how the theory should avoid the two standard failure modes: concentrating responsibility so tightly that it fits only pre-written conclusions about Germany, and diffusing it so thin that no one remains answerable at all. Conclude briefly with which single requirement does the most to adjudicate between Fischer-style verdicts and shared-responsibility verdicts, but keep the weight on the criteria themselves rather than on scoring the historians. Please answer in American English.
