      *   *The Mathematical Solution:* Calculus (limits, infinite series) solves the *mathematical* problem (summing infinite series yields finite results).
      *   *The Philosophical Problem:* Even if the math works, does it describe *reality*? How can a task be completed if it involves an infinite number of sub-tasks? (Supertasks).
      *   *Relevance today:* Philosophers discuss them to understand the nature of time, space, and motion, not necessarily because they think Achilles won't reach the tortoise.

