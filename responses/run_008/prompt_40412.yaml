      *   *Underdetermination:* Commercial cases (both theories enforce).
      *   *Pulling in different directions:* Pre-existing duty rule (Bargain) vs. Modification (Commercial reality/Reliance).
      *   *Civil Law shift:* Enforceability of gifts, charity, modifications.

  7.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the peppercorn specifically? *Yes, emphasize it as a ritual/formality.*
      *   *Check:* Did I address Hume specifically? *Yes, link the "artificial virtue" to the "artificial requirement of consideration."*
      *   *Check:* Did I answer the "what would change" question concretely? *Need to ensure I list specific doctrines like Pre-existing Duty Rule and Charity Subscriptions.*
      *   *Tone:* Keep it academic but accessible, respecting the user's dual background. Avoid oversimplifying the law.

  8.  **Final Polish:** Ensure clear headings. Make sure the distinction between "Bargain Theory" (Williston) and "Reliance Theory" (Fuller) is clear. Mention the *Restatement (Second)* shift towards reliance.

      *(Self-Correction on Civil Law)*: Be careful not to say Civil Law enforces *all* promises. They often require *causa* or specific formalities for donations. The contrast is that *causa* is easier to satisfy than *consideration*. I should nuance this.

      *(Refining the Hume point)*: Hume thinks the *practice* creates the obligation. The Common Law thinks the *exchange* creates the obligation. They are close. The peppercorn shows the law cares about the *existence* of the practice, not the *value*.

  9.  **Final Output Generation** (Proceed to draft response based on these thoughts).
answer: |-
  This is a sophisticated collision, and your intuition is correct: the common law of contracts is not merely a set of rules but a repository of implicit philosophical commitments about the nature of obligation. Your professor's dismissal ("law isn't morality") is a standard positivist shield, but it fails to account for the fact that legal doctrines *embody* theories of obligation, even if they refuse to call them "moral."

  Here is a reconstruction of the implicit theory of promissory obligation in the common law, where it diverges from Hume and Reliance theories, what it rules out, and what would change if we adopted a "promise binds" (Civil Law) model.

  ### 1. Reconstructing the Implicit Theory: The "Formalist-Bargain" Hybrid

  The common law does not presuppose a single unified theory. Instead, it operates on a **primary theory of Bargain** with a **secondary safety valve of Reliance.**

  **The Humean Connection (The Bargain Theory)**
  You are right to see Hume here. For Hume, a promise is an "artificial virtue." There is no natural sentiment that binds me to keep a word; rather, we invent the practice of promising to facilitate cooperation and commerce. The obligation is created by the social convention, not the internal mental state.

  The Consideration Doctrine is the legal instantiation of this artificiality. By requiring a "quid pro quo," the law says: *We will not enforce the internal act of willing (the promise); we will only enforce the external social act of trading.*
  *   **The Peppercorn:** This is the smoking gun for the Humean/Conventional reading. If the law were about economic value (utility), a peppercorn would fail. If it were about moral duty, the peppercorn would be irrelevant. The peppercorn works because it satisfies the **ritual form** of the convention. It signals that the parties have entered the "game" of exchange. As Lon Fuller argued, consideration serves a **channeling function**: it provides a clear, external marker that distinguishes legally binding intent from casual social assurance.
  *   **Implicit Theory:** Obligation arises not from the promise itself, but from entering the *conventional practice of exchange*.

  **The Reliance Counterpoint (Estoppel)**
  Promissory Estoppel (§90 of the Restatement) introduces a different ontology. Here, the wrong is not the breach of the convention, but the **harm caused by the inducement.**
  *   **Implicit Theory:** Obligation arises from the *consequences* of the speech act on the listener, not the speech act itself or the exchange surrounding it.

  **The Synthesis:** The common law implicitly holds that promises are *prima facie* non-binding (rejecting the natural duty view). They become binding only when "clothed" in either the form of exchange (Consideration) or the fact of detrimental reliance (Estoppel).

  ### 2. Which Rival Theories Does the Practice Rule Out?

  The common law doctrine is not neutral; it actively hostile to specific philosophical accounts of promising.

  **A. The "Natural Duty" or Moral Obligation Theory (Ruled Out)**
  The law explicitly rejects the idea that a promise binds simply because it is a moral wrong to break it.
  *   **Evidence:** The rule that **past consideration is no consideration**. If I save your life, and you later promise to pay me a pension, that promise is generally unenforceable (*Mills v. Wyman*). A moral duty to repay exists, but the law refuses to transmute it into a legal duty.
  *   **Evidence:** Gratuitous promises. If I promise to give you my car and sign a deed, but you give me nothing, I can revoke it anytime before delivery. The law says your expectation is legally irrelevant without the "price" of exchange.

  **B. The Pure "Will Theory" (Ruled Out)**
  This theory holds that obligation arises from the autonomy of the promisor—the act of willing binds the willer.
  *   **Evidence:** The **Pre-Existing Duty Rule**. If I am already contractually bound to build your house for $100k, and I say "I will not finish unless you pay $110k," and you agree, common law traditionally says your new promise is unenforceable. I gave no new consideration. If the Will Theory held, our new mutual agreement should bind us. The law prioritizes the *structure of the original bargain* over the *current will of the parties* (to prevent duress/holdup, but theoretically rejecting the sufficiency of will alone).

  **C. The Pure "Communication/Uptake" Theory (Ruled Out)**
  Some philosophers argue obligation arises when an intention is communicated and understood.
  *   **Evidence:** The **Statute of Frauds**. Even if a promise is communicated, understood, and relied upon, if it concerns land or goods over $500 and isn't written, it is often unenforceable. The law prioritizes *evidentiary form* over the *communicative act*.

  ### 3. Where the Practice is Underdetermined vs. Tension

  **Underdetermination (Where theories converge)**
  In standard commercial cases, the Bargain Theory and Reliance Theory yield the same result.
  *   *Scenario:* A orders goods from B; B ships them.
  *   *Bargain Theory:* Enforced (Exchange occurred).
  *   *Reliance Theory:* Enforced (B relied on A's order).
  *   *Will Theory:* Enforced (Both willed it).
  Here, the doctrine is philosophically underdetermined; the judge need not choose a metaphysics of obligation to resolve the case.

  **Internal Tension (Where doctrines pull apart)**
  The friction you sensed is real and creates doctrinal incoherence.
  1.  **Consideration vs. Estoppel:** Consideration says "No reliance matters without exchange." Estoppel says "Reliance matters even without exchange." This creates a boundary problem: *How much reliance is needed to trigger estoppel?* The law has no principled answer, leading to arbitrary line-drawing.
  2.  **Waiver and Modification:** Modern commercial law (UCC §2-209) allows contract modifications without consideration if made in good faith. This abandons the Humean/Bargain theory for a Will/Reliance hybrid in commercial contexts, while retaining the strict Bargain theory for non-merchants. The law implicitly admits that the Consideration doctrine is an impediment to commerce, yet retains it as a default.

  ### 4. The Counterfactual: What if We Adopted the "Promise Binds" Model?

  Your professor suggests the separation between law and moral duty is clean. It isn't. If we rebuilt the doctrine on the Civil Law presupposition (*pacta sunt servanda*—agreements must be kept), relying on the idea that a serious promise creates an obligation *qua* promise, the following concrete changes would occur:

  **A. Gratuitous Promises Would Be Enforceable**
  *   *Current Law:* I promise to donate $1M to a university. I change my mind. University sues. Court searches for "reliance" (did they start building a wing?) to enforce via Estoppel.
  *   *Civil Law Model:* The promise is enforceable simply because it was serious (often requiring a notary form for gifts, but binding nonetheless).
  *   *Outcome:* Charity subscriptions would be routinely enforced without fictitious findings of reliance.

  **B. The Death of the Pre-Existing Duty Rule**
  *   *Current Law:* As noted, modifying a contract requires new consideration.
  *   *Civil Law Model:* A mutual agreement to modify binds because it is a new promise.
  *   *Outcome:* Courts would focus entirely on **duress and coercion** rather than the metaphysical search for "new consideration." This is actually where the law is heading (see *Williams v. Roffey Bros* in England), acknowledging that the Consideration doctrine is a clumsy proxy for policing fairness.

  **C. Shift from "Bargain" to "Form"**
  *   *Current Law:* We use the peppercorn (substance of exchange) as a formality.
  *   *Civil Law Model:* We would likely require actual formalities (writing, notarization, *causa*) for gratuitous promises to ensure seriousness.
  *   *Outcome:* The "peppercorn" fiction would vanish. It would be replaced by explicit formal requirements. This would actually make the law *more* honest about its function: distinguishing serious commitments from casual ones.

  **D. Damages would Shift**
  *   *Current Law:* Contract damages are expectation-based (give me the benefit of the bargain). Reliance damages are a fallback.
  *   *Civil Law Model:* If the basis of obligation is the promise itself, expectation damages remain. However, if the basis shifts toward reliance (as it has in estoppel), damages might be capped at the loss suffered rather than the gain promised.
  *   *Outcome:* In a pure "promise binds" system, we might see a clearer distinction: **Gratuitous promises** enforced only to the extent of reliance (to prevent impoverishment of the promisor), **Commercial promises** enforced to the extent of expectation. The current common law muddles this by trying to force gratuitous promises into the commercial box via estoppel.

  ### 5. Conclusion: The Separation Thesis

  Can the separation between law and moral duty be maintained? **No, not structurally.**

  The law *could* refuse to enforce promises entirely (a pure tort system based only on harm). It *could* enforce all promises (a pure moral system). The fact that it selects *some* promises based on *exchange* indicates it is making a philosophical claim: **Obligation is a product of reciprocal engagement, not individual volition.**

  The "peppercorn" embarrasses the Reliance theory (no reliance on a peppercorn) and the Utility theory (no value in a peppercorn). It supports a **Formalist-Convention** theory. The law is saying: *"We do not care about your morality, and we do not care about your economics. We care that you performed the ritual of the market."*

  If you rebuilt the system on the view that "promises bind because they are promises," you would not just change the outcomes; you would change the **jurisdiction of the court**. Currently, the court asks, "Did you pay the entry fee (consideration)?" In the reconstructed system, the court would ask, "Did you undertake a serious obligation?"

  The common law doctrine is not philosophically neutral. It is a pragmatic, somewhat incoherent hybrid that privileges **commercial certainty** (Bargain) over **moral fidelity** (Will) or **individual protection** (Reliance), only invoking the latter two when the former produces egregious injustice. Your Hume seminar and Contracts course are colliding because Hume correctly identified that the "obligation" of a promise is a social technology, and the Common Law is the engineering manual for that technology.
