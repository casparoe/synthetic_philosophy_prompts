prompt: |-
  I did a law degree before coming back to philosophy, and lately the contracts course I suffered through keeps colliding in my head with the Hume seminar I'm taking. Here is the collision. The common law's consideration doctrine says that a promise, simply as a promise, binds nobody: my solemn, witness-signed promise to give you my car next month is legally worthless, yet the same promise becomes enforceable the moment you hand me a peppercorn in exchange for it. Past benefits don't count as consideration, motives and affection don't count, but a purely nominal token does. Meanwhile promissory estoppel, in both its American Restatement form and its English form, lets courts enforce some bare promises, typically where the promisee relied on them, and some American courts have enforced promises to charities without much inquiry into reliance at all. So the practice seems to hold that a promise binds not because it is a promise but because of something that happens around it — an exchange, or reliance, or a created expectation. I want someone to reconstruct the implicit theory of promissory obligation here. Is the doctrine presupposing something like a Humean picture, on which the binding force of promises is an artificial convention generated by practices of exchange rather than any natural duty to keep one's word? Or is it closer to a reliance theory, on which the wrong done in breaking a promise is always a wrong to the action the promise induced, never a wrong in the mere breaking? And notice that the peppercorn seems to embarrass any of these readings, since the law apparently doesn't care whether the consideration has any value at all — which makes me suspect the doctrine may be compatible with several theories rather than genuinely presupposing one.

  There are some sharper questions I'd like answered too. Which rival theories of why promises bind does the practice quietly rule out — for example, the view that a promise creates an obligation simply qua promise, or views on which obligation arises from the communication and uptake of an intention rather than from exchange or reliance? Where exactly is the practice philosophically underdetermined, such that two very different accounts of promising would generate the same case outcomes, and where do the parts of the doctrine pull in different directions (the exchange logic of consideration sitting next to the reliance logic of estoppel, plus doctrines like contractual waiver that seem to rest on yet a third idea)? Finally, my contracts professor dismissed the whole question by saying the law just isn't in the business of enforcing the moral duty to keep promises, but I want to know whether that separation can really be maintained: if we rebuilt the doctrine on the presupposition that promises bind because they are promises — the way civil-law systems, which generally require no consideration, seem to — what concretely would have to change in the outcomes courts reach, and which current doctrines would become unexplainable? I'd be grateful for an answer that works through the actual shape of the practice rather than treating it as a free-floating intuition about promising.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Background:** Law degree + Philosophy returnee. Currently taking a Hume seminar.
      *   **Core Observation:** Common law consideration doctrine (peppercorn theory) vs. Promissory Estoppel (reliance/charity).
      *   **The "Collision":** Law doesn't enforce bare promises (generally) but enforces exchanged promises (even nominal) and some relied-upon promises.
      *   **The Goal:** Reconstruct the *implicit theory of promissory obligation* in common law contract doctrine.
      *   **Specific Questions:**
          1.  Is it Humean (conventional/exchange-based) or Reliance-based (harm-based)?
          2.  What does the "peppercorn" problem imply for these theories?
          3.  Which rival theories does the practice *rule out* (e.g., Will Theory, Pure Moral Duty)?
          4.  Where is the practice philosophically *underdetermined* (same outcomes, different theories)?
          5.  Where do parts of the doctrine *pull in different directions* (Consideration vs. Estoppel vs. Waiver)?
          6.  Can the separation between law and moral duty be maintained? What would change if we adopted a "promise binds because it is a promise" model (Civil Law style)?

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *Hume:* Promises are artificial virtues, created for social utility (commerce). No natural obligation. Fits Consideration (exchange).
      *   *Reliance (Fuller/Perdue):* The harm is the detrimental reliance. Fits Promissory Estoppel.
      *   *Will Theory (Autonomy):* Binding because I willed it. Fits Civil Law/Civilian *pacta sunt servanda*. Common law rejects this for bare promises.
      *   *Peppercorn:* Suggests form over substance. It's a *ritual* of exchange, not the economic value. This complicates pure reliance (no reliance on a peppercorn) and pure utility (no economic gain). It points to *Formalism* or *Channeling Function*.
      *   *Estoppel:* Softens the hard edge of consideration. Creates tension.
      *   *Professor's Point:* Law $\neq$ Morality. But the user wants to know if that separation holds water when looking at *outcomes*.

  3.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the "collision" between Hume and Contracts.
      *   **Section 1: The Implicit Theory (Hume vs. Reliance vs. Form).** Address the peppercorn. It's not just exchange; it's *evidence* of intent.
      *   **Section 2: What is Ruled Out.** The "Naked Promise" (Moral Duty/Will Theory). Common law explicitly rejects *pacta sunt servanda* for gratuitous promises.
      *   **Section 3: Internal Tensions (The Doctrinal Pull).** Consideration (Bargain) vs. Estoppel (Reliance) vs. Waiver (Voluntary Relinquishment). This shows the law isn't monolithic.
      *   **Section 4: Underdetermination.** Where do different theories yield same results? (Most commercial cases).
      *   **Section 5: The Civil Law Counterfactual.** What if we adopted the "Promise Binds" model? Concrete changes (Gratuitous promises enforceable, reliance less critical, formalities might shift).
      *   **Conclusion:** Synthesize. The law is a pragmatic hybrid, not a pure philosophical system.

  4.  **Drafting the Content - Key Arguments & Nuances:**

      *   *The Peppercorn:* It's crucial. It shows the law cares about the *form* of a bargain, not the *substance* of value. This aligns with Lon Fuller's "Channeling Function." It's a cautionary ritual. It distinguishes serious intent from casual talk.
      *   *Humean Connection:* Hume says promises are created to facilitate exchange. Common law says: No exchange (consideration), no enforcement. Strong link. But Hume emphasizes utility; Law emphasizes *form* of exchange.
      *   *Reliance:* Estoppel is the outlier. It admits that sometimes harm matters more than bargain. But it's usually a "shield not a sword" (in UK) or limited damages (in US).
      *   *Ruled Out:* The "Moral Obligation" theory. *Mills v. Wyman* (promise to pay for care of sick son). Past moral obligation is not consideration. This is a hard "No" to natural duty.
      *   *Will Theory:* Common law rejects the idea that will alone binds. You need the *external* sign (consideration).
      *   *Civil Law Comparison:* In Civil Law (e.g., France, Germany), a gratuitous promise often needs *form* (notarization) to be valid. So it's not *any* promise, but *formalized* promise. Common law uses Consideration as the form.
      *   *Concrete Changes:* If we switched to Civil Law style:
