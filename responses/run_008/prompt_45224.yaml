answer: |-
  It is a pleasure to engage with a colleague who understands both the grit of data collection and the abstract architecture of methodology. Your background in pulsar timing gives you a keen eye for the difference between a signal and noise, which is precisely what demarcation problems amount to in philosophy.

  Your virologist friend is indeed operating within a specific tradition. She is not a naive falsificationist (who would demand immediate refutation), nor is she a verificationist (who would demand confirmation). She is likely a **sophisticated methodological falsificationist**, perhaps influenced by Lakatos as much as Popper, given her sensitivity to how theories evolve over time.

  Here is my brainstorming analysis of the rules implicit in her track record, their application to your three new cases, my predictions, and a proposal for a crucial test case.

  ### Part 1: Candidate Rules Derived from the Track Record

  To predict her rulings, we must reconstruct the axioms of her "court." Based on the six prior rulings, I discern three candidate rules. Note that these rules are not necessarily consistent with one another in all philosophical frameworks, but they appear consistent in *her* jurisprudence.

  **Rule A: Logical Falsifiability (The Popper Baseline)**
  *   **Definition:** A theory is scientific if there exists at least one logically possible observation statement that would contradict the theory.
  *   **Evidence from Track Record:** This explains *GR (1915)* and *Steady-State*. Both made specific claims about the world (light bending, constant density) that could be logically contradicted, even before the technology existed to check them. This rules out *Astrology* (vague claims) and *Freud* (claims compatible with any behavior).
  *   **Limit:** This rule is too permissive. It cannot distinguish between *Proton Decay ($10^{39}$ yrs)* and *GR (1915)*, as both are logically falsifiable.

  **Rule B: The Empirical Horizon (The "Near-Term" Constraint)**
  *   **Definition:** A theory is scientific only if the falsifying observation is not just logically possible, but physically achievable within the lifespan of a research community (or with technology plausibly derivable from current physics).
  *   **Evidence from Track Record:** This refines the *GR (1915)* ruling. Eddington's eclipse was decades away, but physically plausible. This rule likely excludes theories that push tests into the realm of the physically impossible or the indefinitely distant future. It explains why she might treat *Lysenko* poorly (ignored physical constraints of genetics), though that is also covered by Rule C.
  *   **Limit:** This rule struggles with *Steady-State*. By 1960, the CMB was discovered (1965), but in 1960 the theory was still viable. The "horizon" must be flexible enough to allow a theory to be scientific even if it eventually fails the test.

  **Rule C: The Prohibition on Immunization (The "Ad Hoc" Constraint)**
  *   **Definition:** A theory ceases to be scientific (or is pseudoscientific) if its proponents protect it from refutation by introducing auxiliary hypotheses that reduce its empirical content (i.e., make it fit *any* data).
  *   **Evidence from Track Record:** This is the strongest predictor for *Freud*, *Evo-Psych*, and *Lysenko*. In each case, the theory was retrofitted to accommodate anomalies rather than risking falsification. This distinguishes *Steady-State* (which was eventually falsified by data, not by ad hoc fixes) from *Astrology* (where failures are explained away by "rising signs" or "interpretation").

  ---

  ### Part 2: Application to the Three New Cases

  Here is how these rules map onto your pending cases.

  | Case | Rule A: Logical Falsifiability | Rule B: Empirical Horizon | Rule C: No Immunization |
  | :--- | :--- | :--- | :--- |
  | **1. Proton Decay ($10^{39}$ yrs)** | **Scientific.** It predicts decay. No decay = falsified. | **Not Scientific.** $10^{39}$ years exceeds the lifespan of the universe/detectors. It is "in principle" but not "in practice." | **Scientific.** No mention of ad hoc rescues yet. |
  | **2. Low-Freq GW (1 AU Baseline)** | **Scientific.** Specific deviation predicted. | **Not Scientific.** An interferometer arm wider than Earth-Sun is engineering-impossible. | **Scientific.** No mention of ad hoc rescues yet. |
  | **3. Pulsar "Dark Wind"** | **Not Scientific.** If density is "free to set," no data can falsify it. | **N/A.** (Fails on logic first). | **Not Scientific.** Classic ad hoc rescue to save the model from null results. |

  ---

  ### Part 3: Best Guesses and Reasoning

  Based on the synthesis of these rules, here is my prediction of your virologist's rulings.

  **Case 1: Proton Decay ($10^{39}$ years)**
  *   **Prediction:** **Not Scientific.**
  *   **Reasoning:** While a strict Popperian might accept Rule A alone, your friend's track record suggests she respects the *GR (1915)* precedent *only because* the tests were eventually feasible. A lifetime of $10^{39}$ years moves the prediction from "hard to test" to "metaphysical." It violates the spirit of Rule B (Empirical Horizon). For a theory to be scientific, the risk must be real; a risk that cannot materialize within the causal future of humanity is not a scientific risk. She will likely classify this as "speculative metaphysics" rather than science.

  **Case 2: Low-Frequency GW (1 AU Baseline)**
  *   **Prediction:** **Not Scientific.**
  *   **Reasoning:** Similar to Case 1. The distinction here is engineering vs. time. A baseline wider than the Earth-Sun distance implies a rigid structure or formation flying that violates current physical constraints on stability and control. Unlike *GR (1915)*, where the technology (photography, telescopes) existed and the event (eclipse) was rare, this requires technology that is physically implausible. She will likely view this as "mathematical physics" but not "empirical science."

  **Case 3: Pulsar "Dark Wind"**
  *   **Prediction:** **Not Scientific.**
  *   **Reasoning:** This is the clearest case. It is a textbook example of what Lakatos called a "degenerating problemshift" and what Popper called the "conventionalist stratagem." The fact that the *original* version was falsifiable is irrelevant; the *current* version, which is the one being defended, has had its empirical content drained by the "free parameter" of the dark wind density. This matches her rulings on *Freud* and *Evo-Psych*. The behavior of the proponents (saving the theory at the cost of predictive power) is the deciding factor.

  ---

  ### Part 4: The Crucial Discriminator Case

  You asked for a further case that would best tell the rival rules apart. The tension lies primarily between **Rule A (Logical Falsifiability)** and **Rule B (Empirical Horizon)**. Case 3 is already decided by Rule C, so it doesn't help distinguish A from B.

  To separate Rule A from Rule B, we need a theory that is **logically falsifiable** but **technologically ambiguous** (plausible in 100 years, but not 10).

  **The Proposed Case:**
  > "A theory of Quantum Gravity predicts a specific 'graininess' in spacetime that would cause a measurable dispersion in gamma-ray bursts. However, detecting this dispersion requires a gamma-ray telescope with an aperture of 10 kilometers, which is beyond current engineering but does not violate laws of physics. Construction is estimated to take 150 years."

  **How the Rules Diverge:**
  *   **If she rules it SCIENTIFIC:** She is prioritizing **Rule A (Logical Falsifiability)**. She believes that as long as the test does not violate the laws of physics, the timeframe is irrelevant. This aligns her with a stricter, more traditional Popperism.
  *   **If she rules it NOT SCIENTIFIC:** She is prioritizing **Rule B (Empirical Horizon)**. She believes that science is a human activity bound by the lifespan of research communities. If a prediction cannot be checked by the grandchildren of the theorists, it functions as metaphysics. This aligns her more with a sociological or Lakatosian view of scientific research programmes.

  **Why this matters:**
  This distinction cuts to the heart of modern theoretical physics (e.g., String Theory). If she accepts the 150-year telescope, she must accept String Theory as scientific (since it is logically falsifiable, even if hard to test). If she rejects it, she excludes much of high-energy theory from the domain of science. Given her rejection of *Lysenko* and *Astrology* based on *practice*, I suspect she will lean toward Rule B, but the *GR (1915)* precedent is the counter-weight. This case forces her to choose between the *logic* of the theory and the *sociology* of its testing.

  ### Summary for Your Group
  Your virologist is likely operating with a **hybrid demarcation criterion**. She requires logical falsifiability, but she conditions it on a "plausible path to verification" (Rule B) and strictly polices against "immunizing maneuvers" (Rule C).

  *   **Proton Decay:** Fails Rule B (Time).
  *   **GW Modification:** Fails Rule B (Engineering).
  *   **Pulsar Wind:** Fails Rule C (Immunization).

  She is less interested in whether a theory is *true* (Steady-State) and more interested in whether it *plays the game of science* by risking its neck in a way that humans can actually check.
