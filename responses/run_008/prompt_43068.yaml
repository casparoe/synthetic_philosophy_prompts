answer: |-
  Right, so your mate's got hold of a half-truth and is running with it like it's the whole pitch. It's a classic move in these sorts of debates: take a specific, narrow empirical finding and stretch it until it covers the entire metaphysical landscape. The Libet experiments are fascinating, certainly, but the slogan "your brain decides before you do" is doing far too much heavy lifting. It conflates temporal precedence with causal exclusion. Just because the engine hums before the car moves doesn't mean the driver didn't turn the key.

  Here is the breakdown of the distinct claims hiding inside that slogan, arranged from the uncontroversial to the radical, along with whether they actually kill off free will.

  **1. Neural Activity Precedes Conscious Report**
  This is the boring, empirical baseline. The readiness potential (RP) shows up on the EEG roughly 550 milliseconds before the muscle flicks, whereas the conscious awareness of the urge (the "W-time") only pops up about 200 milliseconds before. So, yes, some neural processing happens before you can articulate the decision.
  *   **Plausibility:** Trivial. It's the actual data.
  *   **Does it kill free will?** No. It merely shows that unconscious processing is part of the decision-making pipeline. You might unconsciously prepare the move, but consciousness could still be the trigger.

  **2. Consciousness is a Laggy User Interface**
  This is your teammate's favourite metaphor: consciousness is just a progress bar that renders after the job has started. It suggests awareness is retrospective, a story the brain tells itself to explain what the subconscious already did.
  *   **Plausibility:** Defensible. Many cognitive processes are unconscious.
  *   **Does it kill free will?** Not necessarily. A UI can still be causal. Clicking a button sends a signal; just because the rendering lags doesn't mean the click didn't cause the action. Consciousness could still be required to finalise the commitment.

  **3. Conscious Intention is Causally Inert**
  This is the radical leap. It claims that because the RP starts first, the conscious urge plays *no* causal role in the initiation. It implies the conscious mind is a passenger watching the scenery, pretending to steer.
  *   **Plausibility:** Dubious. The data shows precedence, not exclusion. Correlation (or even temporal order) does not prove that consciousness didn't initiate the chain of events that led to the RP.
  *   **Does it kill free will?** Yes, if true. This is epiphenomenalism. But Libet's data doesn't prove this; it only shows timing.

  **4. The Veto Power (The Escape Hatch)**
  You remembered correctly. Libet himself wasn't a hard determinist. He proposed that while consciousness might not *initiate* the impulse, it can *veto* it at the last moment. He called this "free won't". The RP builds up, but consciousness can abort the action before the motor signal fires.
  *   **Plausibility:** Defensible (within the model).
  *   **Does it kill free will?** No. It preserves a form of agency, just not the kind of uncaused causer your mate is attacking.

  **The Verdict**
  Your teammate is committing a category error. He's taking a finding about *timing* and treating it as a finding about *causation*. Even if the brain prepares the action, consciousness might still be the gatekeeper. Furthermore, relying on a 1980s experiment about wrist-flicking to solve the problem of human agency is a bit like trying to debug a distributed system by looking at a single log entry.

