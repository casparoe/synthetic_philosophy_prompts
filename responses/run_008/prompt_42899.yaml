answer: |-
  # Seminar Plan: The Superrational Pull
  **Course:** Intermediate Decision Theory  
  **Topic:** Superrationality, CDT vs. EDT, and the Symmetry Assumption  
  **Class Size:** 18 Students  
  **Duration:** 75 Minutes  

  ## 1. Pre-Class Questionnaire (Sent 48 Hours Prior)
  **Instructions:** *Complete this honestly. There are no right answers. Your responses will be used to assign in-class tasks. Do not discuss your answers with classmates.*

  1.  **The Twin Puzzle:** You are told that an exact copy of you is in another room facing the exact same choice. You cannot communicate. If you both choose A, you both get $10. If you both choose B, you both get $5. If one chooses A and the other B, the A-chooser gets $0 and the B-chooser gets $15. What do you choose?
      *   [ ] A
      *   [ ] B
  2.  **Reasoning Source:** When making a difficult decision, how much weight do you give to "what a rational person *should* do" versus "what gets me the best result *this time*"?
      *   [ ] Heavily weighted toward "what a rational person should do"
      *   [ ] Balanced
      *   [ ] Heavily weighted toward "best result this time"
  3.  **Predictability:** Do you believe that people with similar educational backgrounds and values tend to make the same decisions in novel situations?
      *   [ ] Yes, almost always.
      *   [ ] Sometimes.
      *   [ ] No, people are too idiosyncratic.
  4.  **Trust Baseline:** In a one-time interaction with a stranger, do you assume they will follow social norms unless given a reason not to?
      *   [ ] Yes
      *   [ ] No
  5.  **Logical Connection:** If you know someone else is using the *exact same logic* as you to solve a problem, do you view your decision and their decision as independent events?
      *   [ ] Yes, our hands move separately.
      *   [ ] No, the logic links the outcomes.

  **Instructor Prep:** Score these quickly. Identify 9 students who lean toward "logical connection/shared rationality" (Matched Pool) and 9 who lean toward "independent/strategic" (Random Pool). *Note: For the experiment to work best, you will actually pair the "Matched" group based on similarity, and pair the "Random" group arbitrarily.*

  ---

  ## 2. The Experiment: "Token Exchange"
  **Incentives:** 1 Token = 1 High-Quality Chocolate Coin (or $1 voucher). Immediate redemption at the end of class.
  **Payoff Matrix (per pair):**

  | | Partner Cooperates | Partner Defects |
  | :--- | :---: | :---: |
  | **You Cooperate** | 3 Tokens each | 0 Tokens (You) / 5 Tokens (Partner) |
  | **You Defect** | 5 Tokens (You) / 0 Tokens (Partner) | 1 Token each |

  ### Minute-by-Minute Timeline

  **00:00 – 00:05: Setup & Stakes**
  *   Distribute envelopes containing 10 "starter tokens" to every student (ensures everyone leaves with something, reducing anxiety).
  *   State clearly: "Today involves a decision task. Tokens earned are redeemable for chocolate/cash at the door. Your decisions are anonymous to peers, recorded only by me."
  *   Divide the room: "Students 1–9, you are **Group Alpha**. Students 10–18, you are **Group Beta**. Please do not speak to the other group."

  **00:05 – 00:15: Instructions (Differentiated)**
  *   **Group Alpha (Random Framing):** "You will be paired with another student in this room. The pairing was determined by **random draw** just now. You will not know who they are. You have one chance to choose 'Red' (Cooperate) or 'Blue' (Defect). Your partner's choice is causally independent of yours."
  *   **Group Beta (Matched Framing):** "You will be paired with another student in this room. The pairing was determined by **algorithmic analysis of your pre-class questionnaire**. You are paired with someone whose **reasoning profile is nearly identical to yours**. You have one chance to choose 'Red' (Cooperate) or 'Blue' (Defect). Your partner thinks like you."
  *   *Crucial:* Emphasize the **One-Shot** nature. "You will never interact with this person again. There is no reputation."

  **00:15 – 00:25: Decision & Collection**
  *   Distribute decision slips.
  *   Students mark Red/Blue, fold slip, place in envelope.
  *   Collect envelopes. (Instructor leaves the room for 30 seconds to ensure no signaling, or has a TA collect).
  *   *Instructor Note:* While "grading," tally the cooperation rates for Alpha vs. Beta immediately.

  **00:25 – 00:35: The Reveal**
  *   Ask Group Alpha: "By show of hands, who chose Red (Cooperate)?" Record % on board.
  *   Ask Group Beta: "By show of hands, who chose Red (Cooperate)?" Record % on board.
  *   **Reveal the Manipulation:** "Group Alpha was told random. Group Beta was told matched. In reality, both groups faced the same game structure. The only variable was your belief about the *connection* between your reasoning and your partner's."
  *   Distribute earned tokens.

  **00:35 – 01:15: Debrief & Lecture (The Core)**
  *   **Phase 1: The Data (10 mins):** Compare the rates. (Expectation: Beta > Alpha). Ask Beta students: "Did the instruction that your partner 'thinks like you' make you feel safer cooperating?" Ask Alpha: "Did the 'random' instruction make you feel vulnerable?"
  *   **Phase 2: CDT vs. EDT (15 mins):**
      *   **Causal Decision Theory (CDT):** My action cannot *cause* the partner's action in a one-shot game. The past (questionnaire) is fixed. The partner's move is already determined or independent. Dominance reasoning applies: Defecting always yields more tokens regardless of their move. *Alpha framing triggers this.*
      *   **Evidential Decision Theory (EDT):** My action is *evidence* of the partner's action. If I cooperate, it increases the probability (in my estimate) that the partner cooperates, because we share a common cause (our reasoning type). *Beta framing triggers this.*
  *   **Phase 3: Superrationality (10 mins):**
      *   Hofstadter's claim: It's not just correlation; it's **logical identity**. If we are both perfectly rational and the problem is symmetric, we must output the same answer.
      *   Discussion: "Did you cooperate because you thought they *would* (prediction), or because you thought you *should* to ensure the symmetric outcome (normative logic)?"
  *   **Phase 4: The Trap (10 mins):**
      *   Is this a confusion? If I switch my decision, does the partner's decision change? No.
      *   So, is EDT irrational? Or is CDT missing the "logical causation"?
      *   Connect to Newcomb's Problem (if covered) or Parfit's Hitchhiker.

  ---

  ## 3. Limitations Note (For Instructor)
  **What this activity cannot reproduce:**
  1.  **True Logical Identity:** The students are not actually identical algorithms. They are merely psychologically similar. A true superrational agent knows that *if* they switch strategies, the other *must* switch, because they are the same function. This experiment only creates a *statistical correlation* via common cause (the questionnaire), not logical necessity.
  2.  **Genuine One-Shot Conditions:** Students are in a classroom. They may expect future interactions with you (the instructor) or worry about social judgment despite anonymity.
  3.  **The "Magic" of Superrationality:** The experiment validates EDT (correlation via common cause) more than Hofstadter's specific claim (logical identity).

  **How to supply these in the debrief:**
  *   Explicitly state: "Today you felt the pull of *correlation*. Hofstadter argues for something stronger: *identity*. If you are truly rational, you and your counterpart are running the same source code. In that case, your choice doesn't just *predict* theirs; it *determines* theirs logically, even if not causally."
  *   Use the board to draw the difference:
      *   *Experiment:* Me ← Questionnaire → Partner (Common Cause)
      *   *Superrationality:* Me = Partner (Identity)

  ---

  ## 4. Troubleshooting: What Will Go Wrong
  **1. The "Joker" Defector**
  *   **Problem:** In Group Beta (Matched), one student defects to "test the theory" or be contrarian, ruining the pair's payoff and skewing the data.
  *   **Handling:** In the debrief, isolate this data point. "One pair in the Matched group defected. Why?" This usually sparks a debate on whether superrationality requires *common knowledge* of rationality. If the Joker didn't believe the other was rational, the symmetry breaks. This is a feature, not a bug—it highlights the fragility of the common knowledge assumption.

  **2. Sample Size Ambiguity**
  *   **Problem:** With 9 students per group, you might get 4/9 cooperating in Random and 5/9 in Matched. The effect looks weak.
  *   **Handling:** Do not rely on statistical significance. Rely on *phenomenology*. Ask: "How did the instruction *feel*?" If the rates are similar, pivot the lecture: "Interesting. Even when told you are matched, the causal intuition (CDT) is so strong it overrides the evidential pull. This shows how deeply ingrained causal thinking is."

  **3. Cross-Group Conferring**
  *   **Problem:** Students realize there are two instructions and talk between Group Alpha and Beta before submitting decisions.
  *   **Handling:** Physical separation. Seat Group Alpha on the left, Beta on the right. Collect decisions simultaneously. If discovered, acknowledge it: "This contamination actually proves the point—communication breaks the one-shot condition and introduces causal negotiation, which is a different game entirely."

  **4. Ethical Pushback on Matching**
  *   **Problem:** If you claim the matching is based on the questionnaire, students might ask to see the algorithm.
  *   **Handling:** Be transparent in the debrief. "I did group you by similarity, but the 'algorithm' was my judgment of your responses. The key variable was your *belief* in the match, not the mathematical precision of it." (If you choose to actually randomize both groups and lie about the match, you must disclose this deception at the start of the debrief as part of the lesson on framing effects). *Recommendation: Actually match them if possible to avoid deception ethics.*
