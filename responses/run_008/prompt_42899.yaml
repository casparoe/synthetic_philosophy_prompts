      *Actually, a better way to handle the small N:* Run the game, then ask for a show of hands on "Who cooperated?" for each group. Even with 9 people per group, the percentage difference is visible.
      *Wait, let's look at the "Matched" logic again.* If I match them based on the questionnaire, I am creating a Common Cause.
      *   Questionnaire -> Decision.
      *   Questionnaire -> Partner's Decision.
      *   Therefore, My Decision correlates with Partner's Decision.
      *   This is the perfect setup for EDT. CDT ignores this correlation. Superrationality claims the correlation is even tighter (logical identity).
      *   Okay, I will proceed with the "Actual Matching" strategy for the Matched group. It's more robust.

      *Wait, one more thing:* The prompt asks for "pre-class questionnaire." I need to provide the items.
