answer: |-
  You have put your finger on a genuine philosophical distinction that often gets collapsed in ordinary language. You are correct that the "Ship of Theseus" is usually framed as a puzzle about *thresholds* (how much change is too much?), whereas your observation is about *criteria* (which rulebook are we using to judge sameness?).

  There is an established concept for this, though it lives in the technical end of metaphysics and philosophy of language. The term you are looking for is **Sortal Dependence** (or **Sortal Relativity**).

  Here is the precise breakdown of the concept, how it differs from the Theseus puzzle, and a framework you can use as an editorial tool to audit your copy.

  ### 1. The Concept: Sortal Dependence
  In the mid-20th century, the philosopher Peter Geach argued that the word "same" is logically incomplete. You cannot say two things are "the same" in a vacuum; you must always say "the same *what*?"

  That "*what*" is called a **Sortal**. A sortal is a concept that supplies a principle of individuation and identity.
  *   **Sortal A:** "Cathedral" (implies function, location, consecration).
  *   **Sortal B:** "Collection of Stones" (implies material constitution).

  **The Wrinkle:** Natural language allows us to drop the sortal and just say "the same." When you wrote that the cathedral "has stood there for 900 years," you were invoking the sortal *Cathedral* (which persists through reconstruction). When you wrote "nothing of the original building survives," you were invoking the sortal *Physical Structure* (which does not persist through replacement).

  Philosophers call the phenomenon you noticed—a silent change in the criteria for identity within a single discourse—a **Sortal Shift**.

  ### 2. How This Differs from the Ship of Theseus
  You were right to sense that "Ship of Theseus" wasn't quite the label you needed.
  *   **The Theseus Puzzle** asks: *At what point does the object cease to exist?* It assumes we are using one rulebook and tries to find the breaking point.
  *   **Sortal Dependence** explains: *We are using two different rulebooks simultaneously.* It explains why your editor didn't flag a contradiction. There is no contradiction because the truth conditions shifted. Under the sortal *Institution*, the company is the same. Under the sortal *Workforce/Management*, it is not.

  ### 3. The Two Tracks (For Editorial Use)
  While "Sortal Shift" is the academic term, it is a bit dry for a style guide. For your purposes, I recommend distinguishing between two specific modes of persistence. You can use these labels to tag sentences in your drafts.

  **Track 1: Material Continuity (Constitution)**
  *   **Definition:** Identity is determined by the physical stuff, the specific atoms, or the original components.
  *   **Trigger Words:** "Original," "Survives," "Authentic," "Physical," "Built of."
  *   **Example:** "Nothing of the original building survives."
  *   **Truth Condition:** False if the matter has been replaced.

  **Track 2: Functional Continuity (Narrative/Legal)**
  *   **Definition:** Identity is determined by the role, the legal charter, the location, or the unbroken story thread.
  *   **Trigger Words:** "Traces to," "Stood for," "History of," "Legacy," "Still."
  *   **Example:** "The cathedral has stood on that site for 900 years."
  *   **Truth Condition:** True if the function/legal status/location thread is unbroken, even if matter is replaced.

  ### 4. The Editorial Tool: The "Same What?" Test
  To stop yourself from printing sentences that are true on one reading and false on the other without intending it, apply this test to every claim of persistence (same, still, continues, original):

  1.  **Isolate the claim:** "This company is the same one founded in 1904."
  2.  **Force the Sortal:** Ask, "The same *what*?"
      *   The same *legal charter*? (True)
      *   The same *business*? (Ambiguous)
      *   The same *people*? (False)
  3.  **Check the Neighbors:** Look at the surrounding paragraphs. Did you just establish that the workforce and product line are entirely new (Material/Functional shift)? If so, claiming it is the "same company" without qualification relies on a **Sortal Shift**.

  **When to allow the shift:**
  In general-interest writing, Sortal Shifts are often necessary and helpful. They allow us to respect both the legal reality and the lived reality.
  *   *Acceptable:* "It is the same regiment (Functional), though none of the original soldiers remain (Material)."
  *   *Problematic:* "It is the same regiment, and the original soldiers still fight today." (This collapses the tracks into a falsehood).

  ### 5. If You Need a Coinage
  If "Sortal Dependence" feels too academic for your newsroom, I suggest coining the term **The Diachronic Slide**.

  *   **Definition:** The unflagged transition between Material Continuity and Functional Continuity when describing an entity's persistence through time.
  *   **Usage:** "Watch out for the Diachronic Slide in the third graf; you call it the 'original team' right after explaining the roster was traded."

  ### Summary for Your Workflow
  *   **The Philosophy:** Sortal Dependence / Sortal Shift.
  *   **The Tracks:** Material Continuity vs. Functional Continuity.
  *   **The Check:** Ask "Same *what*?" for every instance of "same," "original," or "still."
  *   **The Goal:** Not necessarily to eliminate the shift (which is natural), but to ensure you aren't relying on it to smuggle in a claim that is false on *both* readings.

  You are essentially acting as a metaphysician when you edit these sentences. You are deciding which principle of individuation governs the noun in question. Knowing that you have two distinct tools (Matter vs. Story) allows you to wield them intentionally rather than accidentally.
