  *Plan:*
  1. Validate the intuition (Santayana is often a conversation-stopper, not an argument).
  2. Break down the claims (Instrumental, Psychological, Constitutive).
  3. Apply Margalit (Thick/Thin).
  4. Address the Remember/Forget Dichotomy (Rieff's nuance).
  5. Conclude on the "License to Override" question.

