answer: |-
  **Module:** PHIL3045 Metaphysics of Mind
  **Assessment:** Summer Examination
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  ***

  ### Exam Question

  **Question 1**
  Panpsychists face the combination problem: how do micro-experiences combine to constitute macro-experiences? In lectures, we considered the 'Committee Picture' as a potential solution. On this view, a macro-subject is not a new entity fused from micro-subjects (like streams merging into a river), but is constituted by micro-subjects organised in a specific way (like a committee constituted by its members). The committee reaches decisions no single member reaches, yet nothing exists 'over and above' the members and their organisation.

  Evaluate this proposal. Does the Committee Picture successfully dissolve the combination problem, or does it merely relocate the difficulty? In your answer, you should consider whether phenomenal consciousness can be treated as a structural or organisational fact in the way a committee's decision can, and whether this picture is compatible with the causal completeness of physics and the introspective unity of experience.

  ***

  ### Model Answer

  The Committee Picture attempts to bypass the hardest version of the combination problem by denying that macro-subjects require a mysterious fusion of micro-subjects. Instead, it posits a relation of constitution: the macro-subject is nothing over and above micro-subjects arranged committee-wise. While this avoids the metaphysical oddity of 'subject-summing', it ultimately fails to dissolve the problem because it mischaracterises the nature of phenomenal consciousness. The analogy works for functional roles but collapses when applied to qualitative experience.

  The primary failure lies in the distinction between structural facts and categorical facts. A committee's decision is a structural or functional outcome. To say 'the committee decided X' is shorthand for a complex set of facts about individual votes, rules of procedure, and causal interactions between members. There is no extra 'committee spirit' that feels the decision. However, the central motivation for panpsychism is that consciousness is categorical and qualitative, not merely structural. Micro-experiences are posited as intrinsic natures. If the macro-experience is merely shorthand for organised micro-experiences, we are left explaining how a collection of distinct qualitative points of view becomes a single qualitative point of view without a new subject to hold it. If the macro-experience is real and qualitative, it cannot be merely shorthand; if it is shorthand, it is not the robust consciousness panpsychism promises. Thus, the Committee Picture relocates the problem: it explains how micro-agents cooperate, but not how micro-feelings unify.

  This leads directly to the issue of introspective acquaintance. My experience of tasting coffee is presented to me as a unified whole. I do not experience my consciousness as a swarm of distinct entities voting on sensory data. The Committee Picture suggests a fragmentation at the base level that is not reflected in the phenomenology. If the macro-subject is just the micro-subjects organised, the unity of experience is illusory or derivative. But if the unity is illusory, panpsychism loses its appeal as a theory that respects the data of experience. If the unity is real, the Committee Picture cannot account for it, because a committee, by definition, comprises distinct members who do not share a single perspective. The 'decision' is shared functionally, not felt phenomenally.

  Furthermore, the Committee Picture creates tension with the causal completeness of physics. If the macro-subject is nothing over and above the organised micro-subjects, we must ask what does the causal work. If the micro-experiences are genuine categorical properties, do they contribute causally to the macro-behaviour? If the macro-behaviour is fully determined by micro-physics, the micro-experiences risk being epiphenomenal passengers. If the Committee Picture suggests the macro-subject has causal powers distinct from the sum of the micro-parts, it violates causal closure. If it suggests the macro-subject has no distinct powers, it is hard to see in what sense the macro-subject is a genuine subject of experience rather than a fictional convenience. The committee analogy works for corporations because corporate agency is legally and functionally constructed; it does not work for consciousness because consciousness is ostensibly the ground of agency, not a construction of it.

  Finally, we must consider the coherence of 'constitution' without 'identity'. The proponent claims the macro-subject is 'nothing over and above' the micro-subjects. But if the micro-subjects have their own distinct points of view, how can they constitute a subject with a *different* point of view without ceasing to be distinct? In a committee, the members remain distinct. In a mind, the macro-subject subsumes the content. If the micro-experiences remain distinct, we have not explained macro-consciousness; we have merely described a crowd. If they cease to be distinct, we are back to subject-summing.

  In conclusion, the Committee Picture does not dissolve the combination problem; it relocates it from metaphysics to phenomenology and causation. It successfully describes how functional agency might arise from organised parts, but it fails to explain how qualitative unity arises from distinct qualitative parts. Unless one is willing to reduce macro-consciousness to a fiction, the analogy cannot bear the weight of the phenomenal facts.

  ***

  ### Marking Scheme

  **Total Marks: 25**
  **Pass Mark: 10**

  **1. Distinction between Structural/Functional Facts and Qualitative/Categorical Facts (5 Marks)**
  *   **Requirement:** The answer must identify that committee decisions are structural/functional shorthand, whereas consciousness is argued to be intrinsic/qualitative. It must argue that treating consciousness as shorthand undermines the panpsychist commitment to experience as fundamental.
  *   **Common Mistake:** Treating consciousness as just another functional output, ignoring the 'hard problem' aspect of why organisation feels like anything at all.

  **2. Introspective Unity and Phenomenology (5 Marks)**
  *   **Requirement:** The answer must engage with the first-person perspective. It should note that experience appears unified, whereas a committee implies fragmentation or distinct perspectives that do not merge.
  *   **Common Mistake:** Discussing unity only in terms of behavioural coordination, ignoring the *phenomenal* unity (what it is like to be the subject).

  **3. Causal Completeness and Epiphenomenalism (5 Marks)**
  *   **Requirement:** The answer must address the causal status of the micro-experiences. It should highlight the tension: if physics is complete, do the micro-experiences do anything? If the macro is just the micro organised, is there causal overdetermination?
  *   **Common Mistake:** Ignoring the causal exclusion problem entirely or assuming panpsychism automatically solves causation without argument.

  **4. Analysis of 'Nothing Over and Above' (Constitution vs. Identity) (5 Marks)**
  *   **Requirement:** The answer must scrutinise the metaphysical claim of constitution. It should question how distinct subjects can constitute a single subject without losing their distinctness or without the macro-subject being merely fictional.
  *   **Common Mistake:** Accepting 'constitution' as a magic bullet without explaining how it differs from emergence or fusion in this specific context.

  **5. Overall Evaluation (Dissolved vs. Relocated) (5 Marks)**
  *   **Requirement:** The answer must provide a clear verdict. It should conclude whether the analogy works or fails, summarising *why* based on the previous points. A balanced 'it depends' is acceptable only if rigorously qualified.
  *   **Common Mistake:** Sitting on the fence without justification, or concluding it works simply because it sounds plausible, without addressing the specific objections raised in the essay.

  ***

  ### Examiner's Note: False Friends

  Students should be aware that the following **will not** attract marks and may detract from the score:

  1.  **Name-Dropping:** Citing specific philosophers (e.g., "As Goff says...", "Chalmers argues...") without analysing the argument itself. This is a theory exam, not a history exam. We are testing understanding of the *problem*, not memory of the reading list.
  2.  **Irrelevant Objections:** Bringing in the Knowledge Argument (Mary's Room) or Philosophical Zombies. These address physicalism vs. non-physicalism, not the internal coherence of panpsychism regarding combination. Using them here demonstrates a lack of focus on the specific question asked.
