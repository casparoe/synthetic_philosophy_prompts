  I accept a role at NanoChip, knowing 90% of hardware startups fold despite working prototypes. Friends joined similar firms, handled functioning units, and rationally concluded the tech was revolutionary, yet most companies failed. I predict that once I hold the prototype and see benchmarks, I will assign 0.9 credence to "This tech is revolutionary." My future self will be rational, possessing direct empirical evidence I lack. However, knowing identical evidence precedes failure as often as success, I currently assign 0.1 credence. I refuse to update now to match my foreseen future conviction, acknowledging my future self's rationality.

  2. Where Reflection bites
  Let $A$ be "This tech is revolutionary." My current credence $P_t(A)$ is 0.1. I foresee that at $t+1$, after examining the prototype, my credence $P_{t+1}(A)$ will be 0.9. Van Fraassen's Reflection Principle dictates that $P_t(A | P_{t+1}(A) = 0.9)$ should equal 0.9. If I know my future rational self will believe $A$ to $r$, I should believe $r$ now. Maintaining 0.1 while acknowledging the future 0.9 violates the principle, treating future judgment as informative about evidence but not truth.

