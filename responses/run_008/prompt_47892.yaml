  **SUPERVENIENCE SOLUTIONS INC.**
  **OFFICIAL SAFETY RECALL NOTICE: CLASS-4 ONTOLOGICAL DEFECT**

  **Date:** October 24, 2023
  **Recall ID:** SSC-2023-Emergence
  **Affected Products:** All Class-4 Macro-Properties (Series E)

  Supervenience Solutions Inc. is issuing a voluntary recall for our entire "Emergence" product line, including but not limited to units labeled *Liquidity*, *Market Crash*, *Team Morale*, and *Wetness of Water (Model W-4)*. This action follows customer reports regarding causal inefficacy.

  **The Defect: Causal Exclusion**
  Under normal operating conditions, users expect higher-level properties to exert downward causal influence on physical substrates. However, internal auditing has confirmed a Causal Exclusion error. Investigations indicate that whenever a macro-level property is invoked to explain an effect, the underlying microphysical realizers have already fully accounted for the causal output. Due to the Causal Closure of the Physical, the macro-property is rendered causally inert. Users attempting to utilize *Team Morale* to drive productivity may find the property is merely supervenient, riding along on the neural firings of employees without contributing independent work. Continued use poses a risk of Epiphenomenalism, where properties exist but do nothing.

  **Affected Models and Warranty Status**
  *   **Model W-4 (Weak Emergence):** Marketed as "Predictable from Parts." Warranty void if users claim novel causal powers. These units are technically safe but redundant.
  *   **Model S-9 (Strong Emergence):** Marketed as "Novel Causal Powers." High risk. These units claim downward causation capabilities that violate microphysical conservation laws. Immediate discontinuation advised.
  *   **Multiple Realizability Feature:** While advertised as "Compatible with Wide Range of Underlying Hardware," this feature has been found to obscure the lack of type-identity between macro and micro states, complicating liability assignment.

  **Compliance and Documentation**
  This recall is prompted by a failure to provide required Nagel-Style Bridge Law documentation. Customers cannot legally reduce macro-terms to micro-terms without explicit connective laws. The absence of these laws means the Emergence Line cannot be formally derived from our Physics Basic Package. Until bridge laws are supplied, all macro-properties are considered legally distinct but causally suspect.

  **Frequently Asked Questions**

  **Q: Can I continue using these properties for everyday prediction?**
  A: Yes, for instrumentalist purposes only. You may use *Inflation* to predict prices or *Belief* to predict behavior. However, please note these properties are now offered "as a manner of speaking only." Do not attribute ontological weight to them in legal or metaphysical proceedings.

  **Q: Is my consciousness covered under this recall?**
  A: If your consciousness is modeled as a Strong Emergent property (S-9), yes. If it is identical to brain states, no. Please consult your local reductionist.

  **Q: Will you be issuing a refund?**
  A: Refunds will be issued in microphysical currency only. Macro-level compensation is currently unavailable due to the recall.

  **Contact Information**
  For return instructions, please contact our Reduction Department. Do not attempt to force downward causation manually. Supervenience Solutions apologizes for this ontological confusion and remains committed to providing properties that do actual work.

  **Supervenience Solutions Inc.**
  *Everything is grounded somewhere.*
