  Your intuitions align with **Non-Fanatical Majoritarianism**: Act on the most probable view, hedge when confidence is moderate, but never let low-probability extreme stakes dictate action. Crucially, **blame requires much higher credence than action.**

  To achieve consistency, you must abandon three verdicts:
  1.  **Voting (Action):** With only 40% credence in a duty, the majority view says you have no obligation. You should stop voting out of duty.
  2.  **Voting (Blame):** You must stop thinking worse of non-voters. 40% credence is insufficient for blame.
  3.  **Gossip (Blame):** You may gossip (70% says it's fine), but you cannot judge others who do. 30% credence in wrongness is too low to justify blame.

  The surviving cases fit the principle:
  *   **Meat:** 70% wrong justifies cutting down (hedging against significant risk), but the 30% doubt excuses you from strict veganism.
  *   **Promise:** 60% deontology wins. Since the stakes aren't astronomically different, the majority view dictates keeping the promise.
  *   **Death:** 90% majority dominates. The 10% Epicurean view is rightly ignored.

  **The Kid Question:**
  Your principle dictates that the 1% credence in extreme good **should not dominate**. Allowing tiny probabilities of infinite utility to dictate action leads to fanaticism (Pascal's Wager). Since 99% of your credence doesn't view procreation as an extreme imperative, you proceed based on the 99%.

  In short: Trust the majority view for action, demand near-certainty for blame, and ignore low-probability extreme stakes.
