  ### 1. The target, fixed

  A theory of self-deception must explain a specific subset of motivated irrationality. It is not mere error, nor is it standard interpersonal deception scaled down. The target phenomenon involves an agent acquiring or sustaining a belief that contradicts available evidence, driven by a desire for that belief to be true. Crucially, the theory must account for the agential flavor—the sense that the subject is responsible for the belief—without positing impossible mental states like simultaneously believing $p$ and not-$p$. The target is the intersection of epistemic failure and practical motivation, where the mind's architecture allows desire to bypass evidence-tracking mechanisms. We are theorizing a stable state of motivated false belief that retains a shadow of intentional structure, distinguishing it from simple cognitive malfunction while avoiding the logical impossibility of conscious simultaneous contradiction.

  ### 2. The desiderata

  **Dissolving the Paradox:** The static paradox requires avoiding the claim that the agent consciously believes $p$ and not-$p$ at the same time. *Motivating Case:* Consider the spouse who knows about the affair yet believes in fidelity. If they truly know the truth, how do they function without cognitive collapse? *Verdict:* Genuine. Logical coherence is non-negotiable for any philosophical theory; a solution that relabels the contradiction rather than resolving it fails to explain how the mind remains functional.

  **Distinguishing from Bias:** Wishful thinking is often passive; self-deception feels active. *Motivating Case:* A parent denying a child's guilt feels morally distinct from a generic optimism bias regarding one's own health risks. *Verdict:* Genuine. Without this distinction, the concept collapses into general irrationality, losing its specific explanatory power regarding agency and responsibility. The theory must isolate the motivational component.

  **Timing:** Entry versus Maintenance. *Motivating Case:* Did I trick myself into believing initially, or did I believe then justify subsequently to reduce dissonance? *Verdict:* Genuine. A unified theory should explain both, though mechanisms may differ between acquisition and sustenance. If the theory only covers one, it is incomplete regarding the lifecycle of the deceptive state.

  **Partial Belief:** The "flinch" case suggests divided credence. *Motivating Case:* Saying "I forgive" while flinching indicates conflicting doxastic states existing simultaneously. *Verdict:* Genuine. Binary belief models fail to capture the phenomenology of uncertainty and inner conflict inherent in the phenomenon. Graded credence or partitioned belief is likely required to explain the behavioral leakage.

  **Empirical Constraints:** Fit with psych data. *Motivating Case:* Anosognosia patients deny paralysis despite clear evidence. *Verdict:* Camp Prejudice. Ordinary self-deception isn't pathological; demanding fit with brain lesions risks category errors between illness and agency. We should fit normal psychology, not just pathology, though pathological cases offer structural clues.

  **Moral Profile:** Why blame? *Motivating Case:* We blame self-deceivers more than honest errers but less than liars. *Verdict:* Genuine. If the process is purely mechanical, blame is unjustified. The theory must locate the hook for responsibility without reintroducing the paradox of intentional lying to oneself. This is crucial for ethical application.

  **Detectability:** Can I catch myself? *Motivating Case:* Thinking "I only believe this because I want to" implies some access to the motivation. *Verdict:* Genuine. If the mechanism is wholly unconscious, self-correction is impossible. The theory needs a leakage mechanism that allows for occasional transparency without collapsing the deception entirely.

  **Social Dimension:** Is it extended? *Motivating Case:* Complicit spouses enable deception by withholding evidence. *Verdict:* Camp Prejudice. While social scaffolding helps, the core phenomenon seems intrapersonal. Making it essentially social changes the subject to collective ignorance, though a complete theory should acknowledge external aids as facilitators rather than constituents.

  ### 3. The conflicts

  The deepest tension lies between the Moral Profile and Empirical Constraints. To justify blame, the agent must have some control or awareness (agency). However, psychological data suggests these processes are often automatic and unconscious (mechanism). If you satisfy the empirical requirement by making self-deception wholly subpersonal, you lose the hook for moral responsibility. Conversely, if you strengthen agency to secure blame, you risk reviving the Static Paradox: how can I intentionally deceive myself without knowing the truth? Additionally, demanding First-Person Detectability conflicts with the very success of the deception; if the mechanism is transparent enough to be caught, it might not be robust enough to sustain the false belief. These aren't just hard problems; they suggest we may need pluralistic theories rather than a unified account.

  ### 4. The contenders, briefly

  Deflationary accounts (e.g., Mele) excel at dissolving the paradox by denying intentional deception, treating it as motivated bias. They score high on Empirical Constraints and Paradox Dissolution but take a heavy hit on Moral Profile and Distinction from Bias; if it's just bias, why blame? They also handle the Social Dimension well, as bias is easily scaffolded externally. Divided-mind approaches (e.g., Davidson) preserve the deception analogy via mental partitions. They handle Moral Profile and Timing better by locating agency in a sub-system. However, they struggle with Empirical Constraints, risking homuncular explanations that neuroscience doesn't support. They also fare poorly on First-Person Detectability, as partitions imply opaque barriers. Neither scores perfectly; the choice depends on whether you prioritize logical coherence (deflationary) or phenomenological fidelity (partitioning). The social requirement further favors deflationism, as partitioning isolates the agent too strictly.
