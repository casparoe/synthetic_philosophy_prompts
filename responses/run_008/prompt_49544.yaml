      *   **User Profile:** Retired biochemist (35 years, protein structure). This means they have deep practical experience with molecular reality, classification, and induction. They aren't a novice; they understand the science intimately. They've been reading philosophy of science for a couple of years.
      *   **The Problem:** They have a set of 6 philosophical commitments that feel internally inconsistent ("something about my package feels off"). They want an *audit*, not a lecture.
      *   **The Task:**
          1.  Analyze pairs of commitments for tension.
