prompt: |-
  i'm an interpretability engineer who's been asked to run a 45-minute session for the rest of our ML team on whether neural networks actually *have* representations — or whether "features" and "circuits" are just convenient stories we project onto matrices. The catch is the audience: they train models daily and use "embedding" and "feature" without blinking, so their default stance is "obviously the network has representations, that's what the weights encode" and they won't even see there's a live philosophical question here. Plan the explanation for me instead of writing it: what idea needs to be in place before the realist/anti-realist question even registers as a question (my hunch is something like underdetermination — that many different carve-ups of the same weights could each fit the data — but push back if you think something else has to come first), which single concrete case should carry the whole thing (I'm torn between polysemantic neurons and the way a "feature" can seem to exist in one checkpoint and not the next — argue for one and tell me what the example must have and must lack), the misconceptions they'll predictably form — e.g. that the skeptic side is just the boring claim "interpretability is hard," or that this is a question neuroscience settled long ago — and where in the sequence each one should be headed off, plus what I should openly refuse to cover at this level and say so. End with one question I can ask to check whether they actually got the question rather than just deciding I was being pedantic. no citations or reading recs needed, I want the conceptual arc only.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Role:** Interpretability Engineer.
      *   **Audience:** ML Practitioners (train models daily, use terms like "embedding" and "feature" casually, realist default stance).
      *   **Topic:** Ontological status of neural network representations (Realism vs. Anti-Realism/Instrumentalism).
      *   **Constraint:** 45-minute session.
      *   **Task:** Plan the explanation (conceptual arc), don't write the script.
      *   **Key Requirements:**
          *   Identify the prerequisite concept needed for the question to register (hunch: underdetermination, but verify).
          *   Select *one* concrete case study (Polysemanticity vs. Feature Instability) and justify it + define constraints.
          *   Anticipate misconceptions and schedule interventions.
          *   Define scope boundaries (what *not* to cover).
          *   End with a specific comprehension check question.
          *   No citations/reading recs.

  2.  **Deconstruct the Core Problem:**
      *   The audience thinks "weights = representation."
      *   The goal is to make them doubt that identity without convincing them interpretability is useless.
      *   The philosophical core is: Do the features exist *in* the model, or do we impose them *on* the model to make sense of it?
      *   *Prerequisite Concept:* The user suggests "underdetermination." Is that the best entry point? Underdetermination usually means "data supports multiple theories." Here, it's more about "mathematics supports multiple bases." If I can rotate the activation space without changing output, do the features move? Yes. So the features aren't intrinsic to the weights alone; they depend on the *basis*. This is the "Basis Problem" or "Rotation Invariance." This is more fundamental than underdetermination of theories; it's underdetermination of *structure* within the math itself. Let's call it "Basis Independence" or "Rotation Equivariance."

  3.  **Select the Concrete Case:**
      *   *Option A: Polysemanticity.* (One neuron fires for cat ears and car doors).
          *   Pros: Very popular in interp right now. Shows neurons aren't semantic units.
          *   Cons: Realists can say "Okay, so neurons aren't features, but *directions* are." It doesn't kill realism, just refines it.
      *   *Option B: Feature Instability/Rotation.* (A feature exists in Checkpoint A, disappears in Checkpoint B, but performance is identical. Or, rotating the space).
          *   Pros: Hits the ontological status harder. If I can rotate the space and the math works the same, which basis is the "real" one?
          *   Cons: Can feel too abstract/mathematical.
      *   *Decision:* **Polysemanticity** is too easily dismissed as "we just need better bases (sparse autoencoders)." **Rotation/Basis Ambiguity** is the killer argument against naive realism. However, for an ML audience, **Feature Instability across seeds/checkpoints** is more visceral. Let's go with a specific flavor of this: **The "Superposition" vs. "Basis" tension.** Actually, the prompt asks to choose between Polysemanticity and Feature Instability.
      *   *Re-evaluation:* Polysemanticity is the *symptom*. The *cause* is the basis problem. But Polysemanticity is more concrete. Wait, the prompt asks to argue for one.
      *   *Argument:* Polysemanticity is better for this audience. Why? Because they think "Neuron = Feature." Polysemanticity breaks that. But to make it ontological, we need to show that *even directions* are arbitrary.
      *   *Better Choice:* **Rotation Invariance (The Basis Problem).** Why? Because polysemanticity can be solved by SAEs (Sparse Autoencoders), leading the audience to think "Okay, we found the real features." Rotation invariance shows that *even with SAEs*, the choice of basis is somewhat arbitrary unless constrained by something external.
      *   *Wait, looking at the prompt's specific options:* "Polysemantic neurons" vs "Feature existence in one checkpoint and not the next."
      *   *Selection:* **Feature Instability (Checkpoint/Seed variation).**
      *   *Reasoning:* Polysemanticity suggests features are mixed. Instability suggests features might not be *there* at all, just functional outcomes. It highlights that the *function* is real, but the *implementation* (the specific vector) is contingent. This drives the wedge between "what it does" (functional) and "what it is" (structural).
      *   *Constraints for the Example:* Must show identical loss/accuracy. Must show distinct internal geometry. Must avoid "one model is broken" narratives.

  4.  **Drafting the Conceptual Arc:**

      *   **Phase 1: The Hook (The "Obvious" Truth).** Start by validating their intuition. Yes, we need abstractions to talk about this.
      *   **Phase 2: The Wedge (The Prerequisite).** Introduce **Basis Independence/Rotation Equivariance**. This is the mathematical fact that makes the philosophical question possible. If $W_2 \cdot W_1 = W_2 \cdot A^{-1} \cdot A \cdot W_1$, the function is unchanged but the intermediate "representations" ($A \cdot W_1$) are totally different. *This is the prerequisite.* Without this, they think weights fix the representation.
      *   **Phase 3: The Concrete Case.** Use **Feature Instability across Checkpoints**. Show two models with same loss, different internal "features."
      *   **Phase 4: Misconception Management.**
          *   "Interp is just hard": Head off early by distinguishing *epistemic* (we can't find it) vs *ontic* (it's not there).
          *   "Neuroscience settled this": Address mid-session. Brains have physical constraints; matrices don't.
      *   **Phase 5: Scope Boundaries.** Don't talk about SAE technicalities or specific visualization tools. Don't solve the problem.
      *   **Phase 6: The Check.** A question that forces them to choose a stance.

  5.  **Refining the Prerequisite:**
      *   Is it Underdetermination? Underdetermination is usually Theory vs. Data. Here it's Structure vs. Function.
      *   The specific concept is **Functional Equivalence via Transformation**. If I can transform the internal state without changing the input-output map, the internal state is not uniquely determined by the function.
      *   Let's call it **"The Gauge Freedom of Hidden Layers."** (Like gauge freedom in physics). This resonates with engineers.

  6.  **Refining the Concrete Case:**
      *   Why Feature Instability over Polysemanticity? Polysemanticity implies features are *there* but mixed. Instability implies features might be *artifacts of training trajectory*.
      *   *Requirement:* The example must show two models $M_1$ and $M_2$. $Loss(M_1) \approx Loss(M_2)$. Feature $F$ exists in $M_1$ (probed with high accuracy). Feature $F$ does not exist in $M_2$ (linear probe fails), yet $M_2$ performs the task.
      *   *What it must lack:* It must not imply $M_2$ is "worse." It must not rely on specific neuron indices (no "Neuron 42").

  7.  **Refining Misconceptions:**
      *   *Misconception 1:* "You're saying interpretability is impossible." -> Correction: "I'm saying we need to be clear if we're finding things or making things."
      *   *Misconception 2:* "It's just like the brain." -> Correction: "Brains have metabolic/spatial costs that force specific wiring. MLPs have rotation freedom."
      *   *Misconception 3:* "This is just semantics." -> Correction: "It changes how we debug. If features aren't real, debugging them is like debugging variable names in compiled code."

  8.  **Refining Scope:**
      *   Don't cover: How to train SAEs. Specific attribution methods (IG, SHAP). The history of philosophy.
      *   Do cover: The math of rotation, the empirical evidence of instability, the implication for engineering.

  9.  **Refining the Check Question:**
      *   Needs to distinguish between "We haven't found the right basis yet" (Realist) and "The basis is a tool we choose" (Instrumentalist).
      *   Question: "If we find a basis that makes perfect sense but changes the model's output slightly, is that more 'real' than the original weights?" (Maybe too complex).
      *   Better: "If you rotate the activation space of a deployed model to make the features more human-readable, but the rotation doesn't change the output, have you *discovered* the model's structure or *imposed* a UI on it?"

  10. **Final Review against Constraints:**
      *   45 mins? Yes, the arc fits.
      *   No citations? Yes.
      *   Conceptual arc only? Yes.
      *   Push back on "Underdetermination"? I will refine it to "Gauge Freedom/Rotation Invariance" because underdetermination is too vague.
      *   Concrete case selected? Feature Instability.
      *   Misconceptions mapped? Yes.
      *   Scope defined? Yes.
      *   Check question included? Yes.

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe Polysemanticity is better because SAEs are hot.
      *   *Correction:* No, SAEs reinforce Realism ("We found the true features!"). To challenge Realism, we need to show that *even SAE features* are contingent. Feature Instability across seeds is a stronger wedge for the "convenient story" argument. It shows the *function* is robust, the *representation* is fragile.
      *   *Prerequisite:* I need to make sure they understand that "Representation" implies a specific coordinate system. If the coordinate system is arbitrary, the representation is arbitrary.

  12. **Final Polish:** Ensure the tone is respectful of their engineering mindset. Don't sound like a philosopher descending from ivory tower. Sound like a senior engineer pointing out a subtle bug in their mental model.

  *(Self-Correction on the Prerequisite)*: The user hunches "underdetermination." I should acknowledge that but refine it. Underdetermination of theory by data is standard. Here it's underdetermination of *internal structure by function*. I will call this "Functional Degeneracy." It's more precise for ML.

  *(Self-Correction on the Case)*: I need to be careful. If I say "Feature doesn't exist in checkpoint 2," a realist says "It exists in a rotated basis." I need to ensure the example shows that *no linear probe* finds it, implying the information is encoded non-linearly or differently. The key is: **Is the feature a property of the function or the weights?**

