answer: |-
  **MEMORANDUM**

  **TO:** Constitutional Commission
  **FROM:** Electoral Rules Subcommittee
  **SUBJECT:** Recommendation for Lower House Electoral System
  **DATE:** October 24, 2023

  **Recommendation**
  The Subcommittee recommends a **Mixed-Member Proportional (MMP)** system for the 150-seat lower house. Specifically: 75 members elected from single-member districts (SMDs) and 75 from national party lists, with a **3% legal threshold** for list eligibility. Seats are allocated to ensure total party representation matches vote share, using list seats to top up district wins.

  **The Principled Case: Correcting the Geographic Asymmetry**
  The current debate frames the choice as "constituency delegate" versus "national mirror." This obscures the fundamental issue of political equality. Under First-Past-The-Post (FPTP), the weight of a vote depends on where it is cast. Our data confirms this arbitrariness: a regionally concentrated party (14% national support) secures roughly 18% of seats (28/150), while a dispersed linguistic minority (7% national support) secures zero.

  This is not merely a technical discrepancy; it is a moral defect. In a democracy founded on equal citizenship, representation should not hinge on the accident of geography. FPTP rewards clustering and penalizes dispersion, effectively disenfranchising the linguistic minority while over-representing the regional bloc. While the "delegate" model values local ties, it cannot justify a system where 15% of voters receive 30 seats or none based solely on density. Proportionality is required to ensure that political power reflects popular will, not demographic luck.

  **Empirical Uncertainties**
  We must be honest about the limits of comparative data. Claims that FPTP guarantees stability and PR breeds fragmentation are statistical tendencies, not laws. In established democracies, FPTP often manufactures single-party governments from minority vote shares (as seen in our previous elections, where 42–48% of votes yielded 100% of executive power). This "stability" is purchased at the cost of exclusion. Conversely, while PR often produces coalitions, in a new democracy with four significant parties, coalition-building may foster necessary consensus rather than instability. We cannot rely on foreign precedents to predict our party system's evolution; we must design institutions that remain legitimate regardless of how parties fragment or consolidate.

  **The Case for the Losing Side: Direct Accountability**
  The strongest argument against proportional systems concerns accountability. Under pure list-PR, MPs are beholden to party hierarchies rather than specific constituents. Voters cannot easily punish an underperforming representative without rejecting their entire party. Furthermore, post-election coalition bargaining can obscure who is responsible for policy failures, weakening the link between voting and governing.

  Proponents of FPTP argue that single-member districts force MPs to maintain a "constituency service" ethic, providing citizens a specific officeholder to petition for grievance or aid. This local anchor is vital for political engagement, particularly in rural areas where national party lists may feel abstract. To discard this link entirely risks alienating voters who view Parliament as distant. We acknowledge this risk: a system that ignores local representation undermines the tangible experience of democracy.

  **Why MMP Resolves the Conflict**
  MMP is not merely a compromise; it is the only system that respects both the principle of vote equality and the value of local accountability. By retaining 75 SMDs, we preserve the constituency link MPs use to serve local needs. By using the remaining 75 seats to correct proportionality, we eliminate the geographic asymmetry that disenfranchises the linguistic minority and over-rewards the regional bloc.

  A 3% threshold is specified to ensure the 7% linguistic minority clears it comfortably, while preventing excessive fragmentation. This structure ensures that while geography determines *which* MP represents a district, numbers determine *how many* MPs a party sends to Parliament.

  **Conclusion**
  We reject FPTP because it allows geography to dictate political weight. We reject pure List-PR because it severs the local accountability link. MMP satisfies the mandate for democratic equality without sacrificing the constituency service essential for public trust. We urge the Commission to adopt this system to ensure our first democratic parliament is both representative and responsive.
