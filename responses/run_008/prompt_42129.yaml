answer: |-
  You have put your finger on one of the most famous and contentious fault lines in the philosophy of social science. The intuition you are relying on—that idealizations are controlled approximations that must hold in some limiting regime—is the standard view in physics (often associated with *Galilean idealization* or *perturbation theory*). The economic stance you encountered is indeed a different animal, and it has a specific name, a specific origin, and a substantial literature critiquing it.

  Here is the breakdown of the doctrine, its philosophical classification, and how methodologists distinguish it from the practice you are familiar with.

  ### 1. The Doctrine: Name and Origin

  The essay you are describing is **"The Methodology of Positive Economics" (1953)** by **Milton Friedman**.

  The specific doctrine is commonly referred to as **Friedmanian Instrumentalism** or the **"As-If" Methodology**.

  While Friedman did not coin the phrase "as-if" (that belongs to the German philosopher Hans Vaihinger, whose 1911 book *The Philosophy of 'As If'* argued that we should treat useful fictions as true), Friedman is the one who operationalized it as a defense of neoclassical economic theory. His central thesis is what philosophers call **predictive instrumentalism**: the view that a theory is an instrument for prediction, not a representation of reality. Therefore, the realism of its assumptions is irrelevant; only the accuracy of its predictions matters.

  The examples you cited are directly from Friedman's essay:
  *   **The Billiards Player:** He predicts shots *as if* he knew the mathematical formulas, though he likely does not.
  *   **The Leaves:** They cluster *as if* they sought to maximize sunlight, though they have no consciousness.
  *   **The Firm:** Managers act *as if* they are maximizing expected returns, even if they use rules of thumb.

  Friedman explicitly argues that *because* the world is complex, assumptions *must* be descriptively false to be useful. He writes, "Truly important and significant hypotheses will be found to have 'assumptions' that are wildly inaccurate descriptive representations of reality, and, in general, the more significant the theory, the more unrealistic the assumptions."

  To a physicist, this sounds like saying the ideal gas law is *better* because molecules are not actually point masses, rather than *useful despite* them not being point masses. This is the "F-Twist," as his critic Paul Samuelson called it: turning a vice (falsehood) into a virtue.

  ### 2. The Philosophical Carving: Idealization vs. Instrumentalism

  Philosophers of economics (notably **Daniel Hausman**, **Uskali Mäki**, and **Alexander Rosenberg**) have spent decades carving up the space between what you do in condensed matter and what Friedman advocated. The distinction lies in the relationship between the model and the target system.

  #### A. Galilean Idealization (Your Toolkit)
  In physics, an idealization is a **simplification of the truth**.
  *   **Ontological Status:** The frictionless plane does not exist, but friction is a real force that is being set to zero.
  *   **Control:** You know *why* you are ignoring it (perturbation parameter $\epsilon \ll 1$).
  *   **Deformation:** You can reintroduce the term. The model is a limit case of a more general, realistic theory.
  *   **Goal:** To isolate causal mechanisms.

  #### B. Friedmanian Instrumentalism (The Economic Stance)
  In Friedman's view, the assumption is a **useful fiction**.
  *   **Ontological Status:** The assumption (e.g., perfect rationality) may be fundamentally false, not just simplified.
  *   **Control:** There is no requirement to show *when* it fails, only that it predicts well *now*.
  *   **Deformation:** Reintroducing "realism" (e.g., bounded rationality) is often seen as unnecessary complication if the prediction holds.
  *   **Goal:** To generate accurate predictions, regardless of mechanism.

  #### C. The Key Distinction: Negligibility vs. Heuristic Falsehood
  Philosopher **Uskali Mäki** offers a useful taxonomy here. He distinguishes between:
  1.  **Negligibility Assumptions:** A factor exists but is too small to matter (Physics style).
  2.  **Domain Assumptions:** The theory only claims to apply where the assumption holds (e.g., "This applies only to frictionless surfaces").
  3.  **Heuristic/As-If Assumptions:** The factor does not exist or operates differently, but assuming it exists yields the right output (Friedman style).

  Your discomfort stems from the fact that Friedman conflates (1) and (3). He argues that (3) is acceptable without the safety net of (1).

  ### 3. Standard Objections

  The literature since 1953 has been overwhelmingly critical of strict Friedmanism, though it remains influential in practice.

  **1. The Samuelson Critique ("The F-Twist")**
  Paul Samuelson argued that Friedman was logically incoherent. If a theory predicts well, it is usually *because* its assumptions capture something essential about the structure of the world. If the assumptions are wildly false, the predictive success is likely accidental or limited to a specific historical context. By forbidding the testing of assumptions, Friedman makes the theory immune to falsification in a way physics never is.

  **2. The Explanatory Deficit**
  In physics, prediction and explanation are often linked. If you predict a phase transition using a model with false postulates, you haven't explained *why* the transition occurred. You have only fitted a curve. Philosophers argue that Friedman's method yields **phenomenological models** (like the Ideal Gas Law) but masquerades them as **structural models** (like Statistical Mechanics). It tells you *what* will happen, but not *how* or *why*.

  **3. The Lucas Critique (Structural Instability)**
  In macroeconomics, Robert Lucas (1976) delivered a technical blow to instrumentalism. He argued that if you build a model based on false behavioral assumptions (e.g., agents don't actually maximize utility), the model will fail when policy changes. Why? Because the "false" parameters might change when the environment changes. A model that is "true" about the underlying mechanism (deep parameters) is robust; a model that is merely "predictive" (reduced form) is fragile. This forced economics back toward checking the realism of assumptions (micro-foundations).

  **4. The Problem of Underdetermination**
  If you only test predictions, many different theories with contradictory assumptions can predict the same outcome. If you refuse to test assumptions, you have no way to choose between them. In physics, you might choose the simpler one; in economics, the "false" assumptions often carry ideological weight (e.g., markets always clear), which goes unchallenged if assumptions are off-limits.

  ### 4. The Best Defense of the Position

  Despite the criticism, there are coherent defenses of a moderated version of this view, often found in the work of **Nancy Cartwright** or **Margaret Morrison**.

  **1. Complexity and Tractability**
  The strongest defense is ontological humility. Human economic systems are vastly more complex than a lattice of spins. We may simply lack the capacity to model the "true" mechanisms. If a false assumption (like rational expectations) allows us to navigate the system without crashing it, it has pragmatic validity. This is not claiming the assumption is *true*, but that it is **adequate for the purpose**.

  **2. Robustness Analysis**
  Modern defenders argue that if multiple models with *different* false assumptions all yield the same prediction, the prediction is "robust." Here, the falsity of the assumptions doesn't matter because the result is independent of the specific details. This is closer to **universality classes** in physics (e.g., renormalization group flow), where microscopic details wash out. Friedman didn't argue this explicitly, but it is the strongest modern rehabilitation of his intuition.

  **3. Separation of Contexts**
  Some argue that for *policy* purposes, outcomes matter more than mechanisms. If a model predicts that a tariff will lower welfare, it may not matter whether the agents are actually maximizing utility or following heuristics, provided the aggregate outcome is stable.

  ### 5. Explanation vs. Prediction: Can False Postulates Explain?

  You asked if one can coherently hold that postulates are nowhere near true and still take them to explain anything.

  *   **The Realist Answer:** No. Explanation requires identifying the actual causal machinery. If the machinery you posit (rational calculation) does not exist, you have not explained the phenomenon; you have merely described it mathematically.
  *   **The Instrumentalist Answer:** Yes, because "explanation" just means "reduction of surprise." If the model organizes the phenomena, it explains them.
  *   **The Mediating View (Morrison/Morgan):** Models are not mirrors of nature; they are **instruments of investigation**. They don't have to be "true" to provide understanding. They function like a map: a subway map is topologically false (distances are wrong), but it explains how to get from Station A to Station B better than a geographically accurate map.

  The consensus in modern philosophy of economics is that Friedman went too far. Most methodologists now accept **entity realism**: we should strive for assumptions that are *approximately* true regarding the *causal powers* of the entities involved, even if we must idealize the context.

  ### 6. Conceptual Map: Separating the Conflations

  To finalize the toolkit adjustment, here are the edges you should draw:

  | Concept | Physics (Your Experience) | Friedmanian Economics | Modern Economic Methodology |
  | :--- | :--- | :--- | :--- |
  | **Role of Assumptions** | Controlled approximations (Negligibility). | Useful fictions (Instrumentalism). | Micro-foundations (Realism). |
  | **Truth Value** | Approximately true in a limit. | Irrelevant / Deliberately false. | Ideally approximately true. |
  | **Testing** | Test assumptions and predictions. | Test predictions only. | Test both (where possible). |
  | **Failure Mode** | Perturbation breaks down (error grows). | Policy regime change (Lucas Critique). | Empirical falsification. |
  | **Goal** | Causal Mechanism & Prediction. | Prediction only. | Mechanism & Prediction. |

  **Summary for your conceptual toolkit:**
  You are encountering **Instrumentalism**, not **Idealization**.
  *   **Idealization** says: "This factor is small, so we drop it to solve the equation, but we know how to add it back."
  *   **Instrumentalism** says: "This factor is non-existent, but assuming it exists solves the equation, and we don't care if we can add it back."

  The literature you are looking for falls under **Philosophy of Economics**, specifically the debates surrounding **Milton Friedman's 1953 Essay**. Key authors to search for are **Daniel Hausman** (*The Inexact and Separate Science of Economics*), **Uskali Mäki** (on realism and idealization), and **Paul Samuelson** (for the contemporary critique).

  Your physicist's instinct is correct: Friedman's position is methodologically distinct from the controlled idealizations of theoretical physics, and most philosophers of science agree that treating false assumptions as a *virtue* rather than a *necessary evil* limits the explanatory power of the discipline.
