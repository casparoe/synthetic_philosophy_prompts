      "Listen to me. A tower built without a foundation in heaven must eventually topple, for who will worship the masters of such a place? If there is no miracle, no authority derived from the eternal, then the authority rests only on force or on the shifting sand of human agreement. That is not my work completed; it is my work hollowed out. They may be my descendants in method, but in spirit, they are orphaned. Tell me, when the people eat this bread you describe, do they kneel? Or do they merely consume, like cattle in a stall who know not the hand that feeds them?"

