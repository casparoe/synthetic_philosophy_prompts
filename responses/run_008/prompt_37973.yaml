answer: |-
  ### The Somatic-Normative Triage (SNT) Protocol

  **Purpose:** To determine whether a proposed diagnostic category constitutes a *medical disease* (literal pathology) or a *problem in living* (metaphorical illness/normative deviation).
  **Time Allocation:** 25 minutes for deliberation, 5 minutes for documentation.
  **Users:** Subcommittee of three.

  #### Step 1: The Lesion Test (Somatic Marker)
  **Question:** Is there a specific, measurable pathophysiology (lesion, genetic marker, lab anomaly) that is *necessary* for the diagnosis, independent of patient report or observer judgment?
  *   **Yes:** Classify as **Medical Disease**. Proceed to documentation. (Stop).
  *   **No:** Proceed to Step 2.
  *   *Note:* "Chemical imbalance" theories without specific assays count as **No**.

  #### Step 2: The Norm Test (Social Valuation)
  **Question:** If the behavior or feeling occurred in a different cultural, historical, or economic context, would it still be considered pathological, or would it be neutral/admirable? (e.g., Is "impairment" defined by inability to work a 40-hour week?)
  *   **Yes (Context-Dependent):** The category relies on social norms. Proceed to Step 3.
  *   **No (Context-Independent):** The condition is universally maladaptive (e.g., seizures). Classify as **Medical Disease**. (Stop).

  #### Step 3: The Agency Test (Conduct vs. State)
  **Question:** Is the primary diagnostic criterion *conduct* (actions chosen, even if compelled by urge) or *phenomenological state* (pain, affect, perception imposed on the subject)?
  *   **Primarily Conduct:** High risk of "Disapproved Way of Living." Proceed to Step 4.
  *   **Primarily State:** Lower risk. Proceed to Step 4.
  *   *Warning:* Distinguishing "urge" from "action" is a value judgment, not a biological fact. Flag this if used to rescue a category.

  #### Step 4: The Consent Test (Sickness vs. Sick Role)
  **Question:** If the individual valued their condition and refused treatment, would the diagnosis still be applied (e.g., via involuntary hold, court order, or family pressure)?
  *   **Yes (Imposed):** This is an assignment of the **Sick Role** for social control. Reclassify as **Policy/Legal Matter**. (Stop).
  *   **No (Seeking Help):** The individual identifies as "sick." Proceed to Step 5.

  #### Step 5: The Jurisdiction Test (Medical vs. Moral Solution)
  **Question:** Does the intervention target a bodily mechanism (pharmacology, surgery) or a life context (therapy, social support, legal restriction)?
  *   **Bodily:** May remain **Medical Disease** (Metaphorical).
  *   **Contextual:** Reclassify as **Problem in Living**.
  *   **Final Decision:** If Steps 1 & 2 are "No," the category is *not* a literal disease. It may only remain in the manual if the Plenary votes to retain it as a *social utility* (insurance/benefit access), acknowledging it is not ontologically medical.

  ---

  ### Limitations and Honesty Clause

  1.  **Shrinkage:** Applied consistently, this procedure will reclassify the majority of the current manual from "Diseases" to "Problems in Living."
  2.  **The Affect/Action Gap:** Step 3 requires a distinction between "mood" and "behavior." Szasz argued this is false (both are experiences). Using this step to save mood disorders is a manufactured judgment, not a procedural finding.
  3.  **The Utility Paradox:** A category can fail this test (not a disease) but still be retained for insurance/benefit reasons. The procedure identifies the *lie*, not the *policy*. The Plenary must decide if the lie is useful.
  4.  **No Moral Absolution:** Classifying something as a "Problem in Living" does not mean the suffering is fake. It means the solution is not medical.

  ---

  ### Application to Proposals

  #### 1. Proposal: Gambling Disorder (Full Diagnosis)
  *   **Step 1 (Lesion):** No specific neural lesion or lab test identifies the gambler. **(No)**
  *   **Step 2 (Norm):** "Disordered" is defined by financial loss, neglect of duty, or family distress. In a culture of high-risk speculation, this might be admired. **(Context-Dependent)**
  *   **Step 3 (Agency):** Primary criteria are *conduct* (betting, chasing losses). **(Conduct)**
  *   **Step 4 (Consent):** Often diagnosed via family intervention or legal mandate (debts). **(Imposed)**
  *   **Step 5 (Jurisdiction):** Interventions are behavioral (CBT), financial (barriers), or social (AA-style). **(Contextual)**
  *   **Verdict:** **Reclassify.** This is a problem in living (moral/financial hazard) medicalized to allow insurance reimbursement for behavioral correction.
  *   **Rationale:** No somatic marker; defined by social norms regarding money and duty; primarily conduct-based.

  #### 2. Proposal: Internet Gaming Disorder
  *   **Step 1 (Lesion):** No specific neural lesion. **(No)**
  *   **Step 2 (Norm):** "Impairment" is defined by interference with work, school, or "appropriate" socialization. **(Context-Dependent)**
  *   **Step 3 (Agency):** Primary criteria are *conduct* (playing, logging in, skipping meals). **(Conduct)**
  *   **Step 4 (Consent):** Often parents seek diagnosis for children who do not feel sick. **(Imposed)**
  *   **Step 5 (Jurisdiction):** Interventions are behavioral limits, parental controls. **(Contextual)**
  *   **Verdict:** **Reclassify.** Disapproved leisure activity. Medicalizing this converts a parental/educational conflict into a pediatric pathology.
  *   **Rationale:** Identical profile to Gambling. No somatic marker; defined by productivity norms; conduct-based.

  #### 3. Proposal: Major Depressive Disorder (MDD) (Status Quo)
  *   **Step 1 (Lesion):** No specific neural lesion or lab test. **(No)**
  *   **Step 2 (Norm):** "Impairment" is defined by inability to function in social/occupational roles. "Depressed mood" is pathological only when "persistent" or "excessive" relative to norms of grief/resilience. **(Context-Dependent)**
  *   **Step 3 (Agency):** Primary criteria are *phenomenological state* (sadness, anhedonia, guilt) rather than specific conduct. **(State)**
      *   *Procedural Note:* Here, the subcommittee must exercise judgment. Szasz would argue "expressing sadness" is conduct. The procedure allows a branch here for "affect."
  *   **Step 4 (Consent):** Patients typically seek help and desire relief. Rarely imposed unless suicide risk is acute. **(Seeking Help)**
  *   **Step 5 (Jurisdiction):** Interventions include pharmacology (targeting neurotransmitters) and therapy. **(Mixed)**
  *   **Verdict:** **Conditional Retention.**
  *   **Rationale:** Fails Lesion Test (Step 1) and Norm Test (Step 2) identical to Gaming. Diverges at Step 3 (State vs. Conduct) and Step 4 (Consent).

  ---

  ### The Divergence Analysis: MDD vs. Gaming

  You asked where the difference is manufactured if the procedure yields a verdict you dislike. Here is the unvarnished truth:

  **1. The Ontological Identity:**
  Strictly applied, **MDD and Gaming Disorder are identical** under this procedure. Both lack lesions (Step 1). Both rely on norms of functioning (Step 2). Both are treated with a mix of talk and pills (Step 5). If you reject Gaming as a "disease," consistency demands you reject MDD as a "disease" in the literal Szaszian sense. Both are "Problems in Living."

  **2. The Manufactured Fork (Step 3):**
  The only point where MDD survives while Gaming fails is **Step 3 (Agency)**.
  *   **Gaming:** Classified as *Conduct*. We assume the player *does* something.
  *   **MDD:** Classified as *State*. We assume the patient *feels* something.
  *   **The Judgment:** You are deciding that *affect* is more "bodily" and less "volitional" than *behavior*. Szasz explicitly rejected this. He argued that claiming "I am sad" is as much a communicative act (conduct) as "I am playing games."
  *   **The Cost:** To save MDD, you must assert that sadness is a "symptom of the body" while gaming is a "choice of the person." There is no procedural proof for this. It is a metaphysical preference.

  **3. The Utility Exception (Step 5):**
  MDD survives the Plenary not because it passes the SNT, but because of the **Jurisdiction Test**. We accept drugs for depression. We do not accept drugs for gaming.
  *   **Honesty Check:** If the "drugs work" is the justification, then MDD is a *treatable condition*, not necessarily a *disease*. Polio is a disease because of the virus, not because we have a vaccine.
  *   **The Verdict:** If you run this procedure honestly, MDD is a **Metaphorical Disease**. It is a "Problem in Living" that we have agreed to treat medically because the suffering is acute and the patient consents (Step 4). Gaming is a "Problem in Living" where the suffering is often attributed to observers (parents) and the behavior is judged morally.

  **Recommendation for the Subcommittee:**
  If you wish to retain MDD without hypocrisy, the rationale must change. Do not claim it is a "disease" comparable to diabetes. Claim it is a **Severe Problem in Living warranting Medical Management.**
  *   **Gaming:** Problem in Living warranting **Behavioral/Social Management.**
  *   **MDD:** Problem in Living warranting **Medical Management.**

  This preserves the insurance codes and the sick role (which you value) without lying about the lesion. It admits the Szaszian critique while rejecting his conclusion that we therefore cannot treat it. The distinction is not *ontology* (what it is), but *jurisdiction* (who handles it).

  **Final Warning:** If you use Step 3 to save MDD, be prepared for the Plenary's Szaszians to ask: "Why is pressing a slot machine lever 'conduct' but weeping in an office 'pathology'?" The procedure cannot answer that. Only your collective value judgment can. Write that into the rationale. Do not hide it behind "neurobiology" you cannot show.
