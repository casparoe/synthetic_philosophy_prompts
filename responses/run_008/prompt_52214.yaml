answer: |-
  This is a classic ethical dilemma, and your intuition is actually more sophisticated than your coworker's. Your coworker is applying a rigid, deontological rule ("any exchange of value = corruption"), while you are applying a contextual, consequentialist ethic ("does this harm the system or the stakeholders?").

  However, your coworker is right about one thing: in procurement, **appearance is reality.**

  There is a principle that captures your gut verdicts. It isn't just about the size of the gift or whether you are qualified. It is about **The Breach of Fiduciary Impartiality.**

  Here is the breakdown of that principle, how it applies to your examples, and exactly what you need to do about the scotch and your brother-in-law.

  ### The Principle: Fiduciary Impartiality

  Corruption, in a professional context, is not simply "getting a favor." It is **accepting a personal obligation that compromises your duty to act impartially on behalf of a principal.**

  To determine if something is corrupt (or at least a conflict of interest), run it through these three filters:

  1.  **The Duty of Impartiality:** Does your role require you to judge without bias? (A mail carrier delivers to everyone; a procurement officer must evaluate bids objectively).
  2.  **The Principal's Interest:** Who do you work for? Does this favor prioritize your interest over theirs? (Your employer pays you to get the best value, not to help your family).
  3.  **Third-Party Harm:** Does this exchange disadvantage a third party who is playing by the rules? (If your brother-in-law wins because of you, another landscaper loses unfairly).

  ### Applying the Principle to Your Cases

  Here is why your gut feelings match the principle, and where the lines are drawn:

  *   **Mail Carrier (Fine):** No duty of impartial judgment. The gift is a social norm (holiday tip), not a bid for specific future action. No third party is harmed.
  *   **Health Inspector (Corrupt):** High duty of impartiality. Tips create an obligation to overlook violations. Third parties (the public) are harmed by unsafe food.
  *   **Roommate Job (Fine):** Hiring is inherently subjective. Referrals are a standard, efficient hiring channel. As long as you were qualified, the company's interest (finding a good employee) was met.
  *   **Politician's Daughter (Not Fine):** Public office requires the *appearance* of impartiality to maintain institutional trust. Even if qualified, it suggests the system is rigged for insiders, harming public trust (the third party).
  *   **Barber (Fine):** No fiduciary duty to a third party. It is a direct private exchange. You both benefit, no one else loses.
  *   **Interlocking Boards (Not Fine):** Execs have a fiduciary duty to shareholders. Steering business to friends violates the duty to get the best deal for the company.
  *   **Grandfather's Town (Fine):** This is the crucial exception. **Institutional Context.** When formal institutions fail (permits don't work without "knowing a guy"), social capital becomes the only functioning currency. That isn't corruption; it's adaptation to institutional collapse. But you work in a mid-size company with functioning HR and procurement policies. You are not in your grandfather's town.

  **The Verdict on Your Coworker:** She is wrong that you are "corrupt" (morally bankrupt), but she is right that you are accumulating **Conflicts of Interest.** Corruption is a state of mind; Conflict of Interest is a structural risk. You can be a good person and still be a liability to your company.

  ### The Decision: Scotch and Landscaping

  Now we apply the principle to your specific stuck points.

  #### 1. The Scotch (Anna)
  *   **Analysis:** This was a "backward-looking" gift (for a past wedding), not a "forward-looking" bribe (for a future contract). It stems from a genuine friendship, not a vendor relationship *at the time*.
  *   **The Risk:** Anna owns a catering company. You work in procurement. If your company ever hosts events or buys food services, you are now compromised. Even if you don't think you are, others will.
  *   **The Principle:** Does this compromise your duty of impartiality? Currently, no. Potentially, yes.
  *   **Action:** **Check your employee handbook.** Most procurement policies have a strict dollar limit on gifts (often $0 or $50).
      *   *If under the limit:* You can keep it, but you should **disclose it** to your manager or compliance officer. "My friend Anna, who owns X Catering, sent this for my wedding. I want to log it so there's no confusion if they ever bid." This turns a shadowy favor into a transparent fact.
      *   *If over the limit (or policy is zero-tolerance):* You must return it or donate it to charity. Write Anna a note: "This is incredibly generous, but my new role has strict compliance rules about vendor gifts. I can't accept this without getting us both in trouble." She will understand.

  #### 2. The Brother-in-Law (Landscaping)
  *   **Analysis:** This is a "forward-looking" request during an active bid process. He is asking for a "good word."
  *   **The Risk:** High. You evaluate bids. He is bidding. If he wins, did he win because he was best, or because you vouched for him? Other bidders are harmed. Your company is harmed if they pay more than market rate.
  *   **The Principle:** This breaches the **Duty of Impartiality** and creates **Third-Party Harm.**
  *   **Action:** **You must recuse yourself.** There is no wiggle room here.
      *   Do not give him a "good word."
      *   Do not look at his bid.
      *   Tell your manager: "My brother-in-law is bidding on the landscaping contract. To avoid any conflict of interest, I need to be recused from evaluating that specific bid."
      *   Tell your BIL: "I love you, but I literally cannot discuss this bid or advocate for you. If I do, I could lose my job and your bid could be disqualified for impropriety. The best way I can help is to make sure the process is clean so you win on merit."

  ### Summary
  You are not corrupt. You are a human being embedded in a social network operating within a professional system. The friction you feel is the boundary between those two spheres.

  *   **Social Sphere:** Reciprocity, loyalty, long-term balance. (Anna, Roommate, Grandfather).
  *   **Professional Sphere:** Impartiality, contracts, fiduciary duty. (Procurement, Health Inspector, Politician).

  **Corruption happens when you import Social Sphere rules into a Professional Sphere that requires Impartiality.**

  Your coworker thinks the spheres are the same. You know they aren't. But to keep your job and your integrity, you have to police the border. Recuse yourself from the landscaping bid immediately. Log the scotch. Keep doing your job well. That is how you prove you aren't corrupt.
