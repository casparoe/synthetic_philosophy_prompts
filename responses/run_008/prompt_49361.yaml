answer: |-
  My credence that there is genuine resultant moral luck in the drunk driver case is **0.65**.

  I side with you, but not as strongly as you do. I think your roommate is making a category error, but you are risking a conflation that keeps my number from matching yours. Here is the decomposition of how I arrive at that number, followed by where I think your actual disagreement lies.

  ### 1. The Cluster Concept of Blameworthiness (Weight: 50%)
  This is the biggest driver of my number. "Blameworthiness" is not a natural kind; it is a cluster concept that conflates at least three distinct evaluations:
  *   **Quality of Will:** How much did the agent disregard moral reasons? (Internal)
  *   **Moral Significance of the Deed:** What actually happened in the world through the agent? (External)
  *   **Fittingness of Reactive Attitudes:** What emotions (guilt, resentment) and sanctions are appropriate responses? (Relational)

  If blameworthiness meant *only* Quality of Will, your roommate would be right (credence ~0.1). But in ordinary moral practice, blameworthiness tracks the Moral Significance of the Deed. When we say the unlucky driver is "worse," we are usually saying the *deed* is worse, not necessarily that his soul is more corrupt. Because the concept is a cluster, and because ordinary usage weights the "Deed" heavily, the presence of resultant luck legitimately alters the blameworthiness attribution.

  However, I don't give this 1.0 weight because there is a persistent intuition that the *agent* qua chooser hasn't changed. That tension caps my credence here.

  ### 2. The Control Principle (Weight: 30%)
  Your roommate treats the Control Principle ("you are only responsible for what you control") as a metaphysical constraint, like a law of physics. It is not. It is a normative intuition that competes with other intuitions, specifically the "Outcome Intuition" (that harm matters).

  When intuitions conflict, we must decide which to privilege. The Control Principle is attractive because it protects us from the chaos of the universe. But if we apply it rigorously (as Nagel argued), it dissolves almost all responsibility, because constitutive luck (your genetics, your upbringing) determines your "will" just as much as resultant luck determines your outcome.

  I deduct points from the "Luck is Real" side here because the Control Principle *does* have gravitational pull. It feels unfair to be judged on luck. But since the principle collapses under its own weight if applied universally, it cannot be a hard constraint. It is a defeasible guideline. This supports your view over hers, but prevents me from going to 0.8 or 0.9.

  ### 3. Legal Practice as Evidence (Weight: 20%)
  Your roommate dismisses the law as "deterrence fiction." This is too reductive. While deterrence is a factor, criminal law is also deeply retributive; it aims to codify communal moral judgments. The distinction between attempted murder and completed murder, or negligent driving vs. vehicular homicide, exists not just to deter (the deterrent threat is the same: don't drive drunk) but because the *wrong* is perceived as different.

  The law treats the completion of harm as an aggravating factor of the *offense*, not just the *sentence*. This suggests that our shared institutional morality recognizes that an agent's relationship to the world is partly constituted by what they actually cause. However, law is pragmatic, so I give this the lowest weight. It is evidence of our moral intuitions, not proof of moral truth.

  ### Sensitivity Analysis
  My final number (0.65) is most sensitive to **the definition of blameworthiness (Factor 1)**.
  If you force me to define blameworthiness strictly as "corruption of the will," my number drops to 0.2. If you define it as "the appropriateness of the total moral assessment of the agent-in-the-world," my number rises to 0.85. I settle at 0.65 because I believe ordinary language and moral practice use the latter definition, even if philosophers often argue for the former.

  ### The "One Level Up" Disagreement
  You suspect you and your roommate are disagreeing about something deeper than drunk drivers. You are. But I don't think it's about agent-regret, as you suspect.

  **You are disagreeing about Action Individuation.**

  *   **Your Roommate's View:** The action is "driving while intoxicated." Since both drivers performed this identical action, the moral evaluation must be identical. The outcome is a separate event that happened *to* the driver, not *by* the driver.
  *   **Your View:** The action is "killing a child" vs. "driving home." The outcome is constitutive of the action itself. You cannot describe what the unlucky driver *did* without mentioning the death.

  If the action is the same, the blame must be the same (Roommate). If the actions are different descriptions of reality, the blame can differ (You). Your argument about agent-regret works only if you accept that "killing a child" is a different moral object than "driving drunk." Your roommate is resisting the idea that the world gets to vote on what action you performed.

  ### The Mistake
  Your roommate is making the flat-out mistake.

  She is treating the Control Principle as an axiom that trumps all other moral data. This is a methodological error. In ethics, when a principle (Control) contradicts a robust, persistent intuition (Outcome Matters) across cultures and legal systems, you do not simply discard the intuition as a "bias." You adjust the principle.

  By calling the legal distinction a "useful deterrent fiction," she is engaging in a debunking explanation that ignores the retributive core of justice. We punish the unlucky driver more not just to scare others, but because we collectively judge that a world with a dead child in it is a world where a greater wrong has occurred, and the driver is the locus of that wrong.

  **Where you might be fooling yourself:**
  Your credence is 0.7. Mine is 0.65. The gap is small, but be careful not to conflate "more blameworthy" with "more tragic." The unlucky driver is certainly more tragic. He certainly has more to regret. But ensure you aren't sliding into thinking his *character* was worse ex-ante. Your argument holds only if you maintain that blameworthiness is retrospective and world-involving, not just a measure of prior character. If you slip into thinking he was a "worse person" before the kid ran out, you've lost the argument.

  **Final Verdict:** You are right that there is genuine moral luck, because actions are defined by their outcomes. But keep your credence slightly below 0.75 to acknowledge that the Control Principle still retains some normative force, even if it isn't sovereign.
