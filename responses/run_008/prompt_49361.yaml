prompt: |-
  My roommate and I got into a long argument on saturday night about moral luck (we'd both had wine, which felt thematically appropriate) and now I can't stop thinking about it and want an outside opinion. The case we kept circling back to is the classic one: two people drive home equally drunk, equally careless, everything about their choices and character identical. One of them happens to have a kid run into the street in front of him and kills the kid; the other gets home and sleeps it off. The law punishes the first way more, and honestly most people's gut says he's worse -- he's the one who killed a child. My roommate thinks that's just a bias we should correct for: blameworthiness is fixed by the will, the outcome was luck, and punishing the unlucky driver more is at best a useful deterrent fiction. I've been arguing that this is too quick, partly because of the agent-regret point -- the unlucky driver has to *live with* having killed a child, that's part of what happened to him and part of what he did, and it seems weird to say the killing matters for his life but not for how blameworthy he is. So my actual credence that there's genuine resultant moral luck -- that the unlucky driver really is more blameworthy, not just more punished or more pitied or more resented -- is somewhere around 0.7. My roommate says 0.25 at most, though she'll admit the legal practice is fine on pure deterrence grounds.

  What I want from you is your own number, but not a bare number, and definitely not a survey of the two positions -- I've read enough of those. Decompose it. Specifically: how much turns on whether "blameworthiness" even picks out one thing, or whether it's a cluster (how much you deserve to suffer vs how much resentment is an apt response vs what you owe to the victim/victim's family) that comes apart exactly in these cases; how much turns on whether the control principle -- you're only blameworthy for what's in your control -- is a genuine constraint on blame or just one intuition among many that luck cases are specifically designed to stress; how much weight the legal practice should get as evidence (does the law's treating completed harm differently tell us something deep, or is it explained away by deterrence and victims' need for redress, leaving nothing metaphysical behind); and whatever else you think belongs in there. Then combine them into a final credence, tell me which sub-question your number is most sensitive to, and tell me which of those two terms of the disagreement -- mine at 0.7 or hers at 0.25 -- most likely hangs on a different sub-question than the one I think our fight is about. Because I suspect we're not actually disagree about drunk drivers at all, we're disagreeing about something one level up, and I can't figure out what.

  One more thing, please commit. I don't want "some philosophers think X while others think Y, and both capture part of the truth." Pick a position, give the number your actual reasoning supports, and if you think one of us is making a flat-out mistake, say whose and where. I'd rather get a committed answer I disagree with than a careful map of the terrain -- I can read a map myself, what I can't do is figure out whether I'm fooling myself about my own 0.7.
