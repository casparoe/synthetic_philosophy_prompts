  The most damaging defeater is a case where the good does not causally depend on the harm, yet the action remains impermissible. Consider the "Invulnerable Shield": you push an invulnerable person onto the track to stop the trolley; they survive unharmed, but their body stops the train. Your test permits this (good saves five without depending on harm), but intuition forbids using them as a means. Similarly, stealing a spare kidney to save five (donor survives) passes your test but violates rights.
  *   **Concede or Resist:** Concede. This shows the moral constraint targets *agency* or *rights*, not just *harm*.
  *   **Rival Absorption:** The "using as a means" principle absorbs this easily (it bans use regardless of harm). Consequentialists deny the intuition. Your view fares worse than the Means Principle here.

  2. **Collapse into Rival Principles (Severe)**
  If "good depends on harm" is extensionally equivalent to "using a person as a means," your test offers no new guidance, merely translating a moral concept into causal language. If the causal structure simply mirrors the means principle, you haven't solved the intention problem; you've relocated it to metaphysics.
  *   **Concede or Resist:** Resist. Argue causal structure is more objective than contested moral concepts like "use."
  *   **Rival Absorption:** Means Principle proponents claim their formulation is primary. They absorb this by saying you've just rediscovered their view.

  3. **Vagueness of "Depends On" (Awkward)**
  Causal dependence admits degrees (probabilistic causation) and complex structures (preemption, overdetermination). If a trolley is slowed by the victim but would have stopped anyway via a backup barrier, does the good depend on the harm? Drawing a binary permissibility line across a spectrum of causal influence risks arbitrariness.
  *   **Concede or Resist:** Resist. Adopt a structural equation model of causation to sharpen the binary.
  *   **Rival Absorption:** Rivals absorb this easily. Plain Double Effect relies on "intention," which is notoriously vaguer than causation. Consequentialism faces measurement vagueness.

  4. **Charge of Unfalsifiability (Awkward)**
  Critics may argue you insulate the view by reinterpreting causal chains to match intuitions (e.g., claiming good *does* depend on harm whenever intuition says impermissible). If causal descriptions are adjustable to fit verdicts, the test lacks predictive power.
  *   **Concede or Resist:** Resist. Causal facts are empirical and objective, not subject to moral negotiation.
  *   **Rival Absorption:** All normative theories absorb this. Consequentialists reinterpret "good"; DDE defenders reinterpret "intention."

  5. **Empirical Results on Judgments (Merely Awkward)**
  Order effects and demographic variations in trolley intuitions suggest unstable data. If the "stable" intuitions your test explains are merely cultural artifacts, the reflective equilibrium you seek is shaky.
  *   **Concede or Resist:** Resist. Normative ethics seeks justified truths, not sociological descriptions of bias.
  *   **Rival Absorption:** Rivals absorb this easily. Consequentialists dismiss deontological intuitions as bias; DDE defenders dismiss utilitarian ones.

  Verdict: The test refines double effect but fails against harmless means cases; it requires supplementation by rights-based constraints.
