      *   **Key Facts Provided:** SVB held long-term bonds (interest rate risk), announced capital raise/losses, stock cratered, $42B withdrawal attempt in one day. Depositors were mostly startups (uninsured deposits > $250k). Communication was via Slack/VC tweets (near-simultaneous, public). Information was largely public (filings), not private.
      *   **Task:**
