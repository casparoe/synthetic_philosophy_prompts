      *   *Verdict:* The Cascade model is the *wrong* primary lens. It misdescribes the information structure and the timing. The D-D model is closer but needs modification because fundamentals *were* negative. The best fit is a **Global Game** or a **Coordinated Run on Solvency**, but since the choice is between Cascade and D-D, D-D is the stronger baseline, *but* the Cascade element explains the *speed* and *contagion* within the niche network.
      *   *Wait, the prompt asks me to commit.* If I say "It's not a cascade," I need to be sure.
      *   *Argument:* In a Bikhchandani cascade, I ignore my private signal because I infer others know something I don't. In SVB, depositors didn't have private signals about solvency; they had the *same* public signal (the announcement). They didn't infer insolvency from *withdrawals*; they withdrew because of the *announcement*, and the withdrawals accelerated because of the *constraint* (first-come-first-served).
