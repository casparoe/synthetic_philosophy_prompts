  2.  **Deconstruct the Models:**
      *   **Information Cascade (Bikhchandani et al.):**
          *   *Mechanism:* Sequential decisions. Agents have private signals. They observe prior agents' *actions* (not signals). At some point, public information from actions overwhelms private information. Agents ignore their own signal and copy predecessors.
          *   *Key Feature:* Fragility. Small shocks can tip the cascade. Information aggregation fails.
          *   *Requirement:* Private information is crucial. Sequentiality is crucial.
      *   **Diamond-Dybvig (Bank Run):**
          *   *Mechanism:* Coordination game. Two equilibria: "Good" (everyone leaves money in) and "Bad" (everyone withdraws). Driven by liquidity transformation (long-term assets, short-term liabilities).
          *   *Key Feature:* Self-fulfilling prophecy. Fundamentals might be fine, but if everyone *believes* others will run, you run.
          *   *Requirement:* Strategic complementarity. First-come-first-served constraint.
      *   **SVB Specifics:**
          *   *Fundamentals:* Actually bad. Interest rate risk was real. Unrealized losses were massive. This wasn't a run on a *healthy* bank (classic D-D), it was a run on a *distressed* bank.
