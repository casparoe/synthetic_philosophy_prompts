  (2) The analogy breaks because cranes physically lift objects within the same ontology, whereas explaining consciousness or normativity requires bridging distinct ontological categories, not just stacking physical parts. Declaring these phenomena "skyhooks" ignores that the "lifting" metaphor presupposes the phenomenon is already physically constituted, which is precisely what is contested in hard problem cases.

  (3) This usage smuggles in the assumption that explanation is binary, where a phenomenon is either fully reduced to physics or dismissed as magic, ignoring intermediate levels of abstraction that are genuinely explanatory without being fundamental. It treats the absence of a completed crane as proof of a skyhook, conflating epistemic gaps with ontological impossibilities.

  (4) Your friend's conclusions do not survive because labeling something a skyhook is a placeholder for ignorance, not a disproof of the phenomenon's reality or autonomy. By treating current explanatory limits as final ontological verdicts, he mistakes the map of current neuroscience for the territory of mind itself.

  (5) Greedy reductionism is exactly the right name because he is trying to cash out the explanatory value of higher-level patterns without doing the work of showing how those patterns emerge from the substrate. He eliminates the need for intermediate cranes by pretending the ground level does all the work instantly.
