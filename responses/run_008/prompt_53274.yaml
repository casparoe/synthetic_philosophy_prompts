answer: |-
  # Seminar Q&A Prep Sheet: Normative Authority & Promising

  **Thesis Core:** Promising = Transfer of Normative Authority. Breach = Usurpation.
  **Key Innovation:** Asymmetric Alienability (Promisee can release; Promisor cannot resign). Explains Duress vs. Third-Party Threats.
  **Audience:** Humean Naturalists (Reductionists), Scanlonian Contractualist, Game Theorist.

  ---

  ## 1. The Existential Threat (Game Theorist)
  **Objection:** "You're positing a 'normative authority' entity to do work that incentive structures and reputation constraints already do. In my models, a promise is a costly signal that alters the payoff matrix of future defection. If I break a promise, my reputation tanks, and I lose future cooperation opportunities. Why should I accept your 'authority transfer' ontology when 'equilibrium selection device' explains the behavior without the metaphysical baggage? Isn't this just flowery redescription?"

  **2-Minute Reply:**
  "Two points. First, reputation explains *why* I might keep a promise, but not *why I owe it to you*. Reputation is third-party facing; obligation is second-party facing. If I break a promise in a desert with no one watching, my reputation is safe, but I still wronged *you*. My account captures that bilateral standing; incentive accounts reduce it to aggregate utility.
  Second, the 'authority' isn't a ghostly entity; it's a change in the *reasons* available to the agents. By promising, I give you a new reason to hold me accountable that didn't exist before. Game theory takes the payoff structure as given; I'm explaining how the promise *creates* the payoff structure. You're describing the engine's heat; I'm describing the transmission."

  **Soft Spot:** You are leaning heavily on the "desert island" intuition. If the Game Theorist argues that even in a desert, the "cost" is internal (guilt/self-concept) which can be modeled as a negative utility payoff, your distinction blurs. Be ready to concede that *some* promises rely on incentives, but insist the *obligation* itself is non-reductive.

  ---

  ## 2. The Metaphysical Threat (Humean Naturalist)
  **Objection:** "I'm worried about supervenience. You say a speech act transfers 'normative authority.' What are the truth conditions for that? If natural facts are all there are, where does this authority live? Is it a social fact? If so, isn't it just a convention sustained by expectation? You reject the Humean convention view, but without a reductive base, your 'authority' looks queer. How does saying 'I promise' physically or socially move this authority from me to you?"

  **2-Minute Reply:**
  "I agree it's not a physical transfer like handing over a key. It's a deontic change, akin to how a judge's sentence changes a defendant's status from 'accused' to 'convicted.' The 'authority' is a social status that licenses certain reactive attitudes (resentment, demand) which were previously impermissible.
  I'm not denying naturalism; I'm denying reductionism. The authority supervenes on the communicative act within a practice that recognizes such acts. The difference between my view and the Humean convention view is direction of fit: For Humeans, the expectation creates the obligation. For me, the transfer of authority creates the expectation. The obligation isn't sustained by the expectation; the expectation is rational *because* of the obligation."

  **Soft Spot:** The "practice" defense risks collapsing back into conventionalism. If the authority only exists because the practice recognizes it, aren't you just a sophisticated Humean? You need to hold the line that the *normativity* of the practice isn't just regularity, but you may struggle to define what grounds that normativity without circularity.

  ---

  ## 3. The Novelty Threat (The "Wrinkle" Objection)
  **Objection:** (Likely from the Scanlonian or a sharp Humean) "Your asymmetric alienability claim feels gerrymandered to save intuitions about duress. You say I can release you, but you can't resign. Why? If authority is a burden, I should be able to drop it. If it's a gift, I should be able to refuse it. Furthermore, your distinction between duress (threat to promisor) and third-party threats (threat to others) seems arbitrary. If a mobster threatens my dog unless I promise you money, my will is just as coerced as if they threatened me. Why does one transfer authority and the other not?"

  **2-Minute Reply:**
  "On asymmetry: Authority over another's action is a *power*, not a burden. You can waive a power, but you can't force someone to revoke it unilaterally because that would undermine the security the promise was meant to provide. If I could resign at will, I never truly gave you control.
  On duress: It's not about the *target* of the threat, but the *voluntariness of the transfer*. In standard duress, the threat is designed to make the promise the only rational option, vitiating the intent to transfer authority. In third-party cases, the threat might compel the *action*, but not necessarily the *commitment to you*. However, I grant the edge cases are hard. My claim is that if the promise is the *instrument* of the coercion (e.g., 'Promise him or I shoot'), no authority transfers. If the promise is a *strategy* to mitigate a threat ('I'll promise him so he helps me hide'), authority can transfer. The line is whether the promise is the tool of the coercer or the tool of the promisor."

  **Soft Spot:** The distinction between "instrument of coercion" and "strategy to mitigate" is very fine and may look ad hoc. The Scanlonian will press you on whether the *victim's* reasonable expectations matter more than your metaphysical distinction about the coercer's intent.

  ---

  ## 4. The Moral Phenomenology Threat (Scanlonian Contractualist)
  **Objection:** "You frame the wrong as 'usurpation'—taking back decision-making power. But that feels cold. When I break a promise, I don't just invade your jurisdiction; I betray your trust and disappoint your reliance. Scanlon's Principle F is about the assurance I gave you and the reasons I gave you to expect performance. Isn't 'usurpation' too legalistic? It misses the relational harm."

  **2-Minute Reply:**
  "Usurpation isn't cold; it's structural. Betrayal and disappointment are the *feelings* that result from the usurpation. Why do you feel betrayed? Because I treated your standing as subordinate to my convenience.
  Scanlon's Principle F relies on the expectation being induced. But sometimes I bind myself without inducing strong expectations (e.g., 'I promise to try, even if I likely fail'). The obligation holds even if reliance is low. My account explains why the bond exists even when reliance is minimal: because you hold the authority, not because you hold the expectation. Usurpation explains the *right* to resent; betrayal describes the *emotion* of resentment."

  **Soft Spot:** Scanlonians argue that the "standing" to resent *comes* from the reasonable rejection of principles, not a prior transfer of authority. You risk talking past each other on the source of standing.

  ---

  ## The "Dreaded Question" Assessment

  **Your Guess:** The Game Theorist asking why this isn't just reputation/incentives.
  **My Verdict:** **You are right.** This is the most damaging because it renders your project *redundant*. If "authority" is just a folk-psychological label for "high-cost signaling," you aren't doing metaphysics; you're doing poetry.

  **The Worse Lurking Question:**
  There is a more dangerous question hidden in the **Humean/Scanlonian overlap**: **"The Immoral Promise Problem."**

  *The Question:* "If I promise to help you commit a crime, have I transferred normative authority to you? If yes, your theory implies I am obligated to help (since authority was transferred). If no, then the transfer is conditional on the act being morally permissible. If it's conditional, then *morality* is doing the binding work, not the promise. So why do we need your authority apparatus at all?"

  *Why it's worse:* It attacks the coherence of "Normative Authority." If authority can't be transferred over immoral acts, then the "authority" isn't real power; it's just a shadow of background morality.
  *Prep:* Be ready to say: "Authority is transferred, but it is *defeasible*. You have the authority to release me, but you don't have the authority to command the immoral. The obligation is to *perform or release*, not necessarily to *perform*." (This is a standard move, but have it ready).

  ---

  ## Strategic Advice for the Room

  1.  **Don't fight the Game Theorist on math; fight them on *standing*.** They can model anything as a payoff. Your trump card is the *second-personal* nature of the claim (I owe *you*, not the universe).
  2.  **Use the Scanlonian as an Ally against the Humeans.** Both of you believe in irreducible normativity. If the Humeans attack your "queer authority," the Scanlonian should feel the heat too. Frame your view as "Contractualism with a mechanism."
  3.  **Protect the Wrinkle.** The duress/third-party distinction is your original contribution. If you concede too much there, the paper becomes a standard authority view. Stand firm on the "Voluntariness of Transfer" vs. "Compulsion of Act" distinction.

  **Good luck. Keep your replies under two minutes; long defenses look like panic.**
