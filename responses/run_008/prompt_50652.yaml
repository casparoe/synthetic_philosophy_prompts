answer: |-
  ### Part I: The Structural Realism Debate in the Vocabulary of Neural Surrogates

  **The Pessimistic Meta-Induction (PMI)**
  *Original:* Past scientific theories were empirically successful but ontologically false; therefore, our current successful theories are likely ontologically false.
  *Translation:* Consider the sequence of surrogate models $M_1, M_2, \dots, M_t$ trained to approximate a physical solver $S$. Each $M_i$ achieved low validation loss on the benchmark distribution $\mathcal{D}_{val}$ available at time $t_i$. However, each $M_i$ was eventually discarded, not because it failed on $\mathcal{D}_{val}$, but because a successor $M_{i+1}$ achieved lower inference cost or better generalization under distribution shift $\mathcal{D}_{shift}$. Crucially, the internal representations (latent activations, attention patterns) of $M_i$ are often incompatible with $M_{i+1}$ (e.g., different embedding dimensions, non-isomorphic computation graphs). The PMI argues: since $M_t$ is merely the current minimizer of a loss landscape that has rejected all previous minimizers, we should expect $M_t$'s internal mechanism to be as "false" (non-robust, non-causal) as $M_{t-1}$'s, despite its current success on $\mathcal{D}_{val}$.

  **Epistemic Structural Realism (ESR)**
  *Original:* We cannot know the nature of the entities (ontology), but we can know the mathematical relations (structure) because structure is what persists across theory change.
  *Translation:* We cannot claim knowledge of the latent variables or the specific computational path the surrogate uses to map inputs to outputs (the "mechanism"). However, we can claim knowledge of the *invariances* and *equivariances* the surrogate encodes. If $M_t$ and $M_{t+1}$ differ in architecture (weights, layers) but both enforce $SO(3)$ rotation equivariance and Galilean invariance, and both generalize to $\mathcal{D}_{shift}$, then the *symmetry group* is the preserved structure. ESR asserts that while the learned representations (the weights) are ephemeral and likely "false" (arbitrary local minima), the constraint manifold (the symmetry group imposed or learned) captures the stable relations of the data-generating process.

  **Ontic Structural Realism (OSR)**
  *Original:* There are no underlying entities; structure is all there is. Relations without relata.
  *Translation:* There is no "fluid" or "field" underlying the tensor transformations. The physics *is* the computation graph that minimizes the loss. The nodes of the graph are not representations *of* something else; they are the ontological primitives. To ask for the "degrees of freedom" of the fluid beyond the latent dimension of the bottleneck layer is a category error. The world is not a simulation running on a grid; the world is the forward pass of the optimal surrogate. The loss landscape is the fundamental terrain of reality; particles are merely persistent features in the activation maps.

  **The Newman Objection**
  *Original:* If structure is just mathematical relations, any collection of objects can be mapped to any structure via a suitable relation (bijection). Thus, claiming to "know the structure" is trivial unless the relations are constrained.
  *Translation:* If "structure" is defined merely as the input-output mapping (the function $f: X \to Y$), then any universal approximator with sufficient capacity can reproduce the structure of any dataset. Two networks $M_A$ and $M_B$ "share structure" if there exists a reparameterization $\phi$ such that $M_A = \phi \circ M_B$. But since any two countable sets of weights can be bijectively mapped, claiming $M_A$ captures the "structure" of the simulation is trivial unless we specify *which* parameterizations are admissible. The objection becomes: Does your surrogate capture the structure of the fluid, or have you simply found a high-dimensional bijection that compresses the training set? Without constraints on the *complexity* of the representation (e.g., MDL, sparsity) or the *causal* direction of the edges, the claim of structural knowledge collapses into a claim of curve-fitting.

  ***

  ### Part II: Residue Report

  #### 1. On Parameterization and the Newman Objection
  > *My working definition has become: structure is whatever survives a change of parameterization. Is that epistemic structural realism, ontic structural realism, or neither? And does it dodge the Newman objection, or merely restate it?*

  Your definition is **Epistemic Structural Realism (ESR)** framed as **Gauge Invariance**. In physics, you learned that physical quantities must be independent of coordinate choice (general covariance). In your ML context, you are treating the network weights as the "coordinates" and the input-output behavior (constrained by symmetries) as the "physical quantity."

  It is not OSR, because OSR would claim the parameterization *itself* (the specific computational graph) is the reality, not just the invariant properties surviving its change. OSR denies the distinction between the "gauge" and the "physical."

  **Does it dodge Newman?** No, it restates it in a more sophisticated guise.
  In the Newman objection, the worry is that *any* two structures share a bijection. In your vocabulary, the worry is that *any* two networks can be related by a smooth reparameterization (e.g., weight space symmetries, linear transforms of latent layers). If "structure" is just "invariance under reparameterization," then a lookup table and a neural net share the same structure if they produce the same outputs, because there exists a mapping between them.

  To dodge Newman, you must restrict the class of admissible parameterizations. In ML, this is your **Inductive Bias**. You must argue that the structure is not just what survives *any* change, but what survives changes *within a specific hypothesis class* (e.g., equivariant CNNs) while maintaining low sample complexity. If you claim structure is what survives *arbitrary* reparameterization, you have defined structure as the input-output function itself, which invites the Newman triviality (any function can be mapped to any other given enough capacity). You need to argue that the *path* through the loss landscape matters, not just the minimum.

  #### 2. On the Pessimistic Meta-Induction and Test Sets
  > *Successor models keep agreeing with their predecessors about the invariances while disagreeing completely about internal mechanisms. Does that pattern support the structuralist, or does it only show that we keep whatever we have already tested?*

  This pattern supports the **Structuralist**, but only if you distinguish between *validation performance* and *generalization under shift*.

  If the induction is merely "we keep what works on the test set," then the PMI holds: you are just overfitting to the available benchmarks ($\mathcal{D}_{val}$). The invariances you keep (e.g., rotation symmetry) might just be artifacts of the data augmentation used during training, not properties of the world.

  However, if the successor models agree on invariances *that were not explicitly enforced* but emerged because they are necessary for zero-shot generalization to $\mathcal{D}_{shift}$, then the Structuralist claim is strengthened. The argument is: The "mechanism" (weights) is over-parameterized and flexible (hence changes between models), but the "structure" (symmetry group) is rigid because the loss landscape penalizes violations of it under distribution shift.

  The PMI in your terms becomes: "We keep changing the architecture to reduce inference latency, but the symmetry group $G$ remains fixed."
  *   **Structuralist Interpretation:** $G$ is a property of the data-generating distribution $P_{data}$.
  *   **Instrumentalist/PMI Interpretation:** $G$ is a property of the *union of all test sets used so far*.

  The distinction lies in whether you believe $P_{data}$ exists independently of your evaluation pipeline. If your "test sets" are just snapshots of a simulation you wrote, then the induction is trivial: you are just converging on the code you wrote. If the "test sets" are observations of a world you did not code, the persistence of $G$ across architectural changes is evidence for ESR.

  #### 3. On Ontology: Simulation vs. Nature
  > *A surrogate that matches a simulation's outputs has nothing like the simulation's ontology — no grid, no timesteps... If I accept that, am I an ontic structural realist about the simulation? And should it worry me that I am happy to say it about simulations but hesitate to say it about nature?*

  If you accept that the surrogate captures the "reality" of the simulation despite lacking the grid, you are an **Ontic Structural Realist about the Simulation**. You are claiming the grid was a "representation artifact" (like the ether) and the tensor transformations are the "structure" (like Maxwell's equations).

  **Should it worry you?** Yes, because it reveals a **Double Standard in your epistemic access.**
  *   **Case A (Simulation):** You know the ground truth exists (the numerical solver code). You know the grid is arbitrary (discretization choice). Therefore, you are comfortable saying the surrogate (which lacks the grid) captures the "real" physics of the simulation.
  *   **Case B (Nature):** You do *not* know if a ground truth code exists. You do *not* know if the "grid" (spacetime continuum? quantum fields?) is arbitrary or fundamental.

  Your hesitation to be an OSR about nature stems from the fact that in Case A, you have **access to the source code**. You can verify that the grid is not ontological. In Case B, you only have the "API" (observations).
  *   If you are OSR about the simulation, you are claiming the *function* is more real than the *implementation*.
  *   If you hesitate to be OSR about nature, you suspect there might be an *implementation* (hidden variables, discrete spacetime) that we haven't seen yet, which the neural net fails to capture.

  The worry is this: If you treat the simulation as "structure only" because the surrogate works without the grid, you are implicitly arguing that **computational efficiency implies ontological priority.** You are saying the fast model is "more real" than the slow solver. If you apply this to nature, you risk claiming that the universe is not a "simulation" (in the computational sense) but a "surrogate" (a direct mapping without underlying mechanism). That is a heavy metaphysical claim disguised as an engineering optimization.

  ***

  ### Part III: Translation Limits and Distortions

  **1. The Normative Gap (Ought vs. Is)**
  *   **Distortion:** Philosophy of science is normative (what *should* we believe is true?). Machine Learning is descriptive/optimizational (what *does* minimize loss?).
  *   **What cannot be said:** You cannot easily translate "truth" into "generalization error." A model can generalize well (low error) but be causally wrong (spurious correlations). Structural Realism claims we track *truth* via structure. ML claims we track *predictive accuracy* via invariance.
  *   **Defect or Clarity?** This is a defect in the ML vocabulary. ML lacks a concept of "truth" distinct from "performance on held-out data." The original philosophical claim was clearer about the distinction between *empirical adequacy* and *truth*. Your vocabulary collapses them into *train/test split performance*.

  **2. The "Aboutness" Problem (Intentionality)**
  *   **Distortion:** Scientific theories are *about* the world. Neural networks are functions $f(x)$.
  *   **What cannot be said:** You cannot say the network "refers" to the fluid. It transforms tensors. The philosophical debate relies on the idea that terms in a theory (e.g., "electron") refer to entities. In your vocabulary, "electron" is a feature in a latent space.
  *   **Defect or Clarity?** This suggests the original claim was less clear than it looked. The idea that theories "refer" to the world is notoriously difficult (see: reference magnetism). Your vocabulary exposes this by forcing you to define reference as "correlation with latent features." If the feature doesn't exist (disentangled representation fails), reference fails. This clarifies the philosophical fuzziness.

  **3. The Status of the Data Generating Distribution**
  *   **Distortion:** In PMI, "the world" changes or our access to it changes. In ML, we assume a stationary $P_{data}$ (usually).
  *   **What cannot be said:** You cannot easily model "theory change due to conceptual revolution" in ML. You model "model change due to better optimization/architecture."
  *   **Defect or Clarity?** Defect in vocabulary. ML assumes the target function is fixed. Science often assumes the *question* changes. Your vocabulary cannot capture the shift from "What is the fluid made of?" to "How does the fluid flow?" because both are just different loss functions to you.

  **4. The Newman Objection's Force**
  *   **Distortion:** In philosophy, Newman's objection is about logical triviality. In ML, it is about *capacity* and *regularization*.
  *   **What cannot be said:** You cannot say "any structure can be mapped" without adding "given infinite width."
  *   **Defect or Clarity?** Sign that the original claim was less clear. Newman's objection relies on abstract set theory. Your vocabulary forces the objection to become concrete: "Can a 10M parameter model fit this?" This makes the objection sharper. It shows that Structural Realism only works if you impose a **complexity prior**. Without a complexity bound (MDL), Structural Realism is trivial. Your vocabulary makes this constraint explicit (regularization), whereas the philosophical debate often leaves it implicit.

  **Summary:** Your vocabulary clarifies the *mechanisms* of structural preservation (invariance, symmetry groups) but obscures the *normative* claim to truth. It turns the PMI into a problem of distribution shift and the Newman objection into a problem of model capacity. The residue suggests that Structural Realism, in your terms, is equivalent to claiming that **independent of architecture and initialization, the optimal loss landscape enforces specific symmetry constraints.** Whether that counts as "knowing the world" depends on whether you believe the loss landscape is discovered or constructed.
