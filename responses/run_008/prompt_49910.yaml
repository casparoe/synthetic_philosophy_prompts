      *   **Context:** Monthly meetings, 6-10 protocols, 20-30 mins per protocol. Mix of low-risk and higher-risk studies.
      *   **Problem:** Recurring unresolved debates on coercion (payment), deception (withholding info), and therapeutic misconception/pressure (surgeon recruiting own patients). Doctors know regulations, but no one has a robust philosophical framework for *valid* consent.
      *   **Goal:** A decision procedure (algorithm/checklist) grounded in moral philosophy but accessible to laypeople. It needs to handle standard consent, deferred consent (emergency), and surrogate consent (dementia). It needs to identify "handoff points" where values, not procedure, decide.
      *   **Requirements:**
          *   Step-by-step procedure.
          *   Clear termination points (No/Yes/Handoff).
          *   Application to three specific cases (a, b, c).
          *   One case must yield a counter-intuitive/unwelcome result, explained honestly.
          *   Honest limitation section (what the procedure *can't* do).
      *   **Tone:** Professional, direct, pragmatic, philosophically grounded but jargon-free. No sugarcoating.

  2.  **Deconstruct the Philosophical Foundations:**
      *   *Valid Consent* requires: Capacity, Voluntariness, Information/Understanding, Authorization.
      *   *Coercion vs. Inducement:* Coercion threatens to make someone worse off relative to a baseline. Inducement offers to make them better off. Undue *influence* distorts judgment.
      *   *Deception vs. Incomplete Disclosure:* Deception asserts falsehoods. Incomplete disclosure omits truths. Both undermine autonomy if they prevent understanding of material risks.
      *   *Therapeutic Misconception/Power Dynamics:* The clinician-researcher conflict. Trust can be exploited.
      *   *Emergency/Surrogate Consent:* This isn't "consent" in the autonomous sense; it's "permission" or "authorization" based on best interests or presumed will.

  3.  **Drafting the Decision Procedure (The "Valid Consent Audit"):**
      *   Need to structure it for a 20-30 minute review.
      *   *Phase 1: The Basics (Capacity & Authority).* Is the person able? If not, is the proxy valid?
      *   *Phase 2: Information & Understanding.* What do they know? What don't they know? Why?
      *   *Phase 3: Voluntariness.* Pressure, Payment, Power.
      *   *Phase 4: The Handoffs.* Where do we stop calculating and start voting on values?

      *Refining the Steps:*
      *   *Step 1 (Authority):* Who is signing? If not the participant, why? (Handles dementia/emergency).
      *   *Step 2 (Materiality):* Is the withheld info material to the decision? (Handles deception).
      *   *Step 3 (Baseline):* Is the offer changing their baseline negatively (threat) or positively (offer)? Is the offer *too* good to refuse? (Handles payment).
      *   *Step 4 (Relationship):* Does the relationship create an obligation to say yes? (Handles surgeon).
      *   *Step 5 (The "No" Conditions):* Hard stops.
      *   *Step 6 (The "Values" Handoff):* Explicitly state where philosophy ends and policy begins.

  4.  **Addressing Special Cases (Emergency/Surrogate):**
      *   Need a specific module for this. It's not "consent." It's "Authorization."
      *   Key question: Is the research *possible* only this way? Is there genuine equipoise?

  5.  **Running the Procedure on the Three Cases:**

      *   *(a) Placebo Gel (Deception):*
          *   Info withheld: Placebo nature.
