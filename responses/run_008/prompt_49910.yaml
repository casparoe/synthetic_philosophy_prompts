  Handoff 1: Risk/Benefit balance (Philosophy says minimize risk, Committee decides acceptable level).
  Handoff 2: Social Value (Philosophy says must have value, Committee decides if *this* is valuable enough).
  Handoff 3: Cultural norms on payment (Philosophy defines undue influence, Committee sets the dollar threshold).

  Okay, ready to write.

  *Structure:*
  1.  Introduction (Acknowledging the role).
  2.  The Procedure (The "Valid Consent Audit").
      *   Pre-check (Authority).
