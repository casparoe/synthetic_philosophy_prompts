      *   *Candidate 2: Private Spend vs. Public Governance.*
          *   Fan spends money on *own* amusement.
          *   Voter decides on *binding rules for everyone*.
          *   *Weight:* High. This is the crux. Sports is a private good (mostly). Voting allocates public goods. If I treat voting purely as consumption, I ignore the externalities. If I enjoy voting for a tyrant because it feels good, the analogy says "rational fan," but reality says "dangerous citizen." The stakes differ fundamentally.
      *   *Candidate 3: Legitimacy and Misleading.*
          *   Teams don't need fans for legitimacy (mostly) and don't claim fans decide the game.
          *   Politicians *do* need turnout for legitimacy and *do* claim votes matter.
