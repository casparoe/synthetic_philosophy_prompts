      *   *Candidate 4: The Normative "Ought".*
          *   Skipping a match is neutral.
          *   Skipping voting is often viewed as civic negligence.
          *   *Weight:* Medium-High. The analogy explains *motivation*, not *obligation*. It defends rationality (is it smart for me?), not morality (is it right for us?).

