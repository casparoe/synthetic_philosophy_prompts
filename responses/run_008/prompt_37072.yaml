    "biggest_idea_both_missed": "The distinction between 'Criterion of Rightness' and 'Decision Procedure'. Jordan argues about what makes an act objectively good (outcomes), while Maya argues about how a human should decide to act (intentions/heuristics). They could agree that outcomes define the good, but intentions define the reliable method to get there, yet they treat these as mutually exclusive theories.",
    "one_question_each": {
