answer: |-
  **MEMORANDUM**

  **TO:** Charter Commission Members
  **FROM:** [Your Name/Commissioner]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Electoral Method Reform and Clarification of Arrow's Impossibility Theorem

  **I. Executive Summary**

  Our city faces a recurring legitimacy deficit: recent mayoral elections have been won with pluralities as low as 35 percent. In a field of four or five serious candidates, this allows a majority of voters to effectively reject the winner. We are tasked with recommending whether to retain First-Past-The-Post (Plurality), adopt Instant-Runoff Voting (IRV), or adopt Approval Voting.

  Much of our recent debate has centered on Arrow's Impossibility Theorem. While mathematically profound, the theorem has been invoked in ways that obscure rather than illuminate our choice. This memo clarifies what Arrow's Theorem actually establishes, addresses the four primary lines of argument raised during our deliberations, and offers a recommendation based on the specific civic problem we aim to solve.

  **Recommendation:** The Commission should recommend the adoption of **Instant-Runoff Voting (IRV)**. While Approval Voting offers theoretical advantages, IRV is the most direct remedy for the "minority winner" pathology currently plaguing our elections, possesses a stronger track record in U.S. municipal executive contests, and ensures the winner commands a majority of continuing support.

  **II. Conceptual Triage: What Arrow's Theorem Does and Does Not Say**

  Arrow's Impossibility Theorem states that no ranked-choice voting system can simultaneously satisfy a specific set of fairness criteria (Unrestricted Domain, Pareto Efficiency, Non-Dictatorship, and Independence of Irrelevant Alternatives [IIA]) in all cases.

  It is crucial to understand what this implies for our decision:
  1.  **Perfection is Impossible:** There is no mathematically "correct" voting system that avoids all paradoxes.
  2.  **Plurality is Not Safe:** A common misconception is that Plurality escapes Arrow's critique. It does not. Plurality violates IIA spectacularly (the "spoiler effect," where a losing candidate changes the winner between the remaining candidates). Therefore, retaining Plurality is not retaining a "neutral" baseline; it is retaining a system that fails the same mathematical tests as the reforms, while failing the practical test of majority legitimacy.
  3.  **Trade-offs, Not Dead Ends:** Arrow's Theorem tells us we must choose which flaws we prefer. It does not tell us that all systems are equally flawed in practice.

  **III. Engagement with Commission Arguments**

  **1. The "Arbitrariness" Argument (Mathematics Commissioner)**
  *Argument:* Since Arrow proves all ranked methods violate IIA, IRV is just as arbitrary as Plurality but more complex.
  *Analysis:* This argument is mathematically sound in the abstract but practically misleading. It is true that IRV violates IIA (specifically through non-monotonicity, where ranking a candidate higher can theoretically hurt them). However, Plurality *also* violates IIA. The relevant question is not "Which system satisfies Arrow?" (none do), but "Which violation matters less for our city?"
  Plurality's violation of IIA manifests as vote-splitting, which directly causes our 35% winner problem. IRV's violations are rare in empirical study. To claim there is "no principled basis" for preferring IRV ignores the principle of majority legitimacy. We are not trading one arbitrary rule for another; we are trading a rule that frequently ignores majority preference for one that seeks to identify it.

  **2. The "Cardinal Escape" Argument (Approval Advocate)**
  *Argument:* Arrow assumes ordinal rankings. Approval Voting uses cardinal (binary) data, so the theorem is inapplicable, making Approval the rational choice.
  *Analysis:* It is correct that Arrow's Theorem applies to ordinal social welfare functions, and thus Approval Voting technically escapes its specific constraints. However, this does not render Approval "impossibility-proof." We must consider the **Gibbard-Satterthwaite Theorem**, which demonstrates that *any* deterministic voting system with three or more outcomes is susceptible to strategic manipulation.
  In Approval Voting, the "honest" strategy is to approve every candidate you like above a certain threshold. However, voters often engage in "bullet voting" (approving only their top choice) to avoid helping a rival. This strategic behavior can cause Approval Voting to mimic Plurality outcomes, reintroducing the vote-splitting issues we seek to solve. While Approval is a robust system, the claim that it escapes the "impossibility" problem entirely is overstated; it merely shifts the vulnerability from IIA violations to strategic vulnerability.

  **3. The "Regress" Argument (Stubborn Commissioner)**
  *Argument:* We are voting on the voting method using a voting method (majority rule). Since Arrow applies to our meta-vote, our choice is illegitimate. We should default to Plurality.
  *Analysis:* This is a category mistake. Arrow's Theorem applies to the aggregation of preferences to select a *general* social welfare function. Our vote today is a *policy decision* by a legislative body, not an attempt to derive a metaphysical truth.
  Furthermore, the "default to Plurality" position is not neutral. It privileges the status quo, which is itself a choice subject to the same mathematical critiques. If we accept the regress argument, we must conclude that *no* collective decision is ever legitimate, including the decision to retain Plurality. We must break the regress pragmatically: we are using our best judgment to select a tool that better serves our constituents, acknowledging that our own decision-making process is imperfect but sufficient for governance.

  **4. The "Maine Precedent" Argument (Former Maine Resident)**
  *Argument:* The 2018 Maine 2nd District election proves IRV produces majority winners, though it may devalue first-choice preferences.
  *Analysis:* This episode requires honest scrutiny. In 2018, the incumbent (Poliquin) led in first-choice votes (44% vs. 42%) but lost after transfers awarded the victory to the challenger (Golden).
  *   **Does this show IRV works?** Yes. It demonstrated that while Poliquin had the most *first* choices, Golden had the broadest *coalition* of support (a majority of continuing ballots). This is the specific feature IRV is designed to reveal.
  *   **Does this devalue first choices?** No. It treats first choices as decisive *if* they constitute a majority. If they do not, it respects the voter's indicated second choice. To argue this "discards" first choices is to argue that a 44% plurality should override a 51% majority coalition.
  *   **Caveat:** This case does not prove IRV is immune to failure. It does not show whether non-monotonicity occurred (analysis suggests it did not in this specific race). We must acknowledge that IRV can, in rare theoretical cases, produce counter-intuitive results. However, the Maine case supports the proposition that IRV prevents candidates from winning with minority support, which is our primary objective.

  **IV. Recommendation and Rationale**

  We must choose a system based on the specific pathology we intend to cure. Our problem is not ballot complexity; it is the election of mayors who lack majority support.

  *   **Plurality** is rejected because it institutionalizes the 35% winner problem.
  *   **Approval Voting** is a strong contender. It is simpler for voters and avoids the "later-no-harm" issue (where ranking a second choice hurts your first). However, it does not guarantee a majority winner. It elects the candidate with the highest net approval, which could still be a candidate opposed by a majority (e.g., 40% approve, 60% disapprove, but the opposition is split among many candidates). Furthermore, strategic bullet voting remains a risk.
  *   **Instant-Runoff Voting (IRV)** is the recommended option. It directly addresses the legitimacy deficit by ensuring the winner secures a majority of active ballots. It mitigates the spoiler effect, allowing voters to support minor candidates without wasting their vote. While it introduces ballot complexity and carries a theoretical risk of non-monotonicity, these costs are outweighed by the benefit of a majority mandate.

  **V. Conclusion**

  Arrow's Impossibility Theorem teaches us humility: there is no perfect voting system. It does not, however, teach us paralysis. We are not seeking a mathematical utopia; we are seeking a more legitimate government.

  The status quo allows a candidate disliked by 65% of the city to govern. IRV reduces that risk. It is not immune to critique, but it is the tool best fitted to the job at hand. I urge the Commission to recommend Instant-Runoff Voting to the Council, with the explicit understanding that we are choosing the system that best prioritizes majority consent, acknowledging the trade-offs required to achieve it.

  **[Signature]**
