prompt: |-
  I'm a PhD student in political philosophy, and in three weeks I'm giving my first proper departmental seminar — not a job talk, but the audience will include people whose position I'm directly attacking, so it feels like one. My thesis: the two standard routes to a state's right to exclude would-be immigrants — the freedom-of-association analogy (the state is somehow like a club or a marriage and can pick its members) and the collective-self-determination route (a people needs control over membership in order to govern itself) — both fail, and interestingly for the same reason: they locate the right in the wrong place. If there's a right to exclude, it's derivative of the right to jurisdiction over territory, and jurisdictional rights are conditional on the state being legitimate towards foreigners, not just towards its own citizens. Which means exclusion is never sovereign: a legitimate state may exclude to keep its institutions functioning, but not to preserve its culture, its welfare standard, or its wage level. So I end up somewhere inbetween the open-borders people and the nationalists, and both sides will hate it, which is fine, but I'd like to survive the Q&A.

  The audience: a department of about twenty. The ones I'm most worried about: my supervisor's supervisor, who is basically a self-determination theorist in the David Miller mould and thinks the association analogy is a sideshow anyway, so my first move ("here are the two routes, both fail") may just bounce off him; a younger colleague who works on brain drain and the migration-and-development side of things and thinks any admission-rights framework is too state-centric — she'll ask whether jurisdiction-talk can even handle cases where the "state" in question is de facto governed by someone else or barely exists; a Kantian cosmopolitan who will want to know why legitimacy-towards-foreigners doesn't just collapse into some global egalitarian principle and give everyone a claim to enter; and a law-and-economics person who will want to know what my view implies about actual admission systems (points systems, refugee quotas, guest-worker schemes) and will be visibly annoyed if the answer is "philosophy has nothing to say here". Also our department administrator attends every talk and always asks something about the moral situation of the individual border guard just following the exclusion policy — she's asked a version of it at every seminar for years and I refuse to be caught out by it again.

  Write my prep sheet: the objections I'll actually get from these specific people, in roughly the order I expect to get them, phrased the way each of them would phrase it (you know the types), each with a two-minute reply and a note on where the reply is soft. Include the one I'm hoping nobody asks — my honest worry is I don't have a good answer to whether my "protect the institutions" proviso lets a state exclude during a pandemic or comparable emergency, and someone will spot that the proviso might expand exactly when nationalists want it to. And this part really matters to me: for each reply, flag clearly where I'm leaning on something that's genuinely contested among political philosophers versus where I'm standing on something like settled ground — I do not want to get caught presenting a contested premise as common sense in front of people who've published on exactly that.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in political philosophy.
      *   **Task:** Preparing for a departmental seminar in 3 weeks.
      *   **Topic:** State's right to exclude immigrants.
      *   **Thesis:** Standard arguments (freedom of association, collective self-determination) fail because they locate the right in the wrong place. Right to exclude is derivative of territorial jurisdiction. Jurisdictional rights are conditional on legitimacy towards *foreigners*, not just citizens. Exclusion is never sovereign (can protect institutions, not culture/welfare/wages).
      *   **Position:** Middle ground (between open borders and nationalism), likely to annoy both.
      *   **Audience:** ~20 people. Specific interlocutors identified:
          1.  Supervisor's Supervisor (Miller-esque self-determination theorist).
          2.  Younger Colleague (Migration & Development, critical of state-centrism/failed states).
          3.  Kantian Cosmopolitan (Worried legitimacy towards foreigners implies global egalitarianism/open borders).
          4.  Law & Economics Person (Wants policy implications, hates "philosophy has nothing to say").
          5.  Department Administrator (Always asks about the individual border guard's morality).
      *   **Hidden Worry:** The "protect institutions" proviso might expand too much during emergencies (like a pandemic), aligning too closely with nationalists.
      *   **Requirements:**
          *   Prep sheet format.
          *   Objections phrased in the specific voice of each interlocutor.
          *   Roughly expected order.
          *   Two-minute reply for each.
          *   Note on where the reply is soft/vulnerable.
          *   **Crucial:** Flag contested premises vs. settled ground for each reply.
          *   Include the "Hope Nobody Asks" question (Pandemic/Emergency).

  2.  **Deconstruct the Thesis & Potential Weak Points:**
      *   *Core Move:* Shifting from membership rights (association/self-determination) to jurisdictional rights.
      *   *Condition:* Jurisdiction requires legitimacy towards foreigners.
      *   *Constraint:* Exclusion only to protect institutional functioning, not culture/economics.
      *   *Weak Point 1 (Miller-esque):* Why isn't self-determination enough? Why does jurisdiction trump culture?
      *   *Weak Point 2 (State-Centric Critic):* What about failed states? Who holds jurisdiction?
      *   *Weak Point 3 (Cosmopolitan):* If legitimacy towards foreigners matters, why isn't the bar so high that exclusion is impossible?
      *   *Weak Point 4 (Policy/L&E):* How does "institutional functioning" translate to points systems?
      *   *Weak Point 5 (Admin):* Individual conscience vs. role morality.
      *   *Weak Point 6 (The Panic Question):* Emergency exceptions swallowing the rule.

  3.  **Drafting the Interlocutors & Objections:**

      *   **Interlocutor 1: The Supervisor's Supervisor (Miller-esque).**
          *   *Voice:* Gruff, experienced, slightly dismissive of "analogies," focused on the value of community/peoplehood.
          *   *Objection:* You're dismissing self-determination too quickly. A people needs to shape its future. Jurisdiction is just the shell; the *value* is the community inside.
          *   *Reply:* Distinguish between *shaping* future (allowed) and *shielding* from external moral claims (not allowed). Jurisdiction is the mechanism, but the *condition* is external legitimacy.
          *   *Contested vs. Settled:* Contested: Whether self-determination has intrinsic value independent of justice. Settled: Jurisdiction implies duties.

      *   **Interlocutor 2: The Younger Colleague (Migration & Development).**
          *   *Voice:* Sharp, empirical, critical of Western bias, focused on power dynamics.
          *   *Objection:* Your theory assumes a functioning state. What about neocolonial contexts? If jurisdiction is conditional on legitimacy to foreigners, do failed states lose the right to exclude? Who decides legitimacy?
          *   *Reply:* Acknowledge the tension. Jurisdiction is a *claim* that must be vindicated. In failed states, the right to exclude is weakened, which might actually support your view (less sovereignty).
          *   *Contested vs. Settled:* Contested: The criteria for "failed" vs. "legitimate." Settled: Legitimacy isn't binary.

      *   **Interlocutor 3: The Kantian Cosmopolitan.**
          *   *Voice:* Principled, rigorous, pushes for consistency.
          *   *Objection:* If legitimacy towards foreigners is the condition, and global inequality undermines that legitimacy, doesn't exclusion become impermissible? You're stopping short of open borders.
          *   *Reply:* Distinguish between *justice* (which might demand open borders eventually) and *jurisdictional authority* (which allows temporary exclusion to maintain the apparatus of justice). The right to exclude is instrumental, not intrinsic.
          *   *Contested vs. Settled:* Contested: Whether instrumental rights can override claims of need. Settled: Institutions need stability to function.

      *   **Interlocutor 4: Law & Economics.**
          *   *Voice:* Pragmatic, impatient with abstraction, wants numbers/rules.
          *   *Objection:* "Protect institutions" is vague. Does that mean economic protectionism? How do I write a policy based on "institutional functioning"?
          *   *Reply:* It rules out *cultural* protectionism and pure *wage* protectionism. It allows exclusion only if influx threatens the *capacity* to deliver justice (e.g., overwhelming welfare *infrastructure*, not just lowering wages).
          *   *Contested vs. Settled:* Contested: The threshold of "overwhelming." Settled: Distinction between culture and capacity.

      *   **Interlocutor 5: The Administrator.**
          *   *Voice:* Polite, persistent, focuses on the human element.
          *   *Objection:* What about the guard? If the policy is illegitimate, must they resign?
          *   *Reply:* Role morality. If the state is broadly legitimate, the guard enforces the rule. If the specific exclusion is illegitimate (e.g., racist), they have a duty to resist.
          *   *Contested vs. Settled:* Contested: The limits of role morality. Settled: Individuals aren't absolved of all moral agency.

      *   **The "Hope Nobody Asks" (Pandemic/Emergency).**
          *   *Voice:* (Internal anxiety/Sharp PhD rival).
          *   *Objection:* Your "institutional functioning" proviso allows exclusion during crises. Nationalists love crises. Doesn't this swallow the rule?
          *   *Reply:* Strict proportionality and temporariness. The crisis must threaten the *existence* of the institution, not just its comfort.
          *   *Contested vs. Settled:* Contested: Defining "existence" vs. "comfort." Settled: Emergency powers require sunset clauses.

  4.  **Refining the Content (Self-Correction/Polishing):**
      *   *Check:* Did I flag contested vs. settled clearly? *Action:* Add specific tags [CONTESTED] and [SETTLED] in the replies.
      *   *Check:* Is the tone right? *Action:* Ensure the "Voice" descriptions capture the departmental archetypes.
      *   *Check:* Is the "Soft Spot" honest? *Action:* Make sure the user knows where they might get pushed back.
      *   *Check:* Time limit. *Action:* Keep replies concise enough for a 2-minute spoken delivery (approx. 250-300 words).
      *   *Check:* The Thesis Alignment. *Action:* Ensure replies consistently reference the "Jurisdiction vs. Membership" distinction.

  5.  **Final Review against constraints:**
      *   PhD level tone? Yes.
      *   Specific audience members addressed? Yes.
      *   Order logical? Yes (Start with the big theory, move to application, end with the admin/human element).
      *   Hidden worry included? Yes.
      *   Contested/Settled flagged? Yes.

  6.  **Final Polish:** (Drafting the response based on the above thought process). *Self-correction during drafting:* Make sure the distinction between "legitimacy towards citizens" and "legitimacy towards foreigners" is clear in the Miller reply, as that's the crux of the user's thesis. Ensure the Law & Economics reply doesn't sound too wishy-washy.

  7.  **Output Generation** (Proceed to generate the prep sheet).
answer: |-
  # SEMINAR PREP SHEET: The Jurisdictional Account of Exclusion

  **Thesis Core:** Right to exclude is not intrinsic (membership/association) but derivative (territorial jurisdiction). Jurisdiction is conditional on legitimacy *towards foreigners*. Exclusion permitted only to preserve institutional functioning, not culture/welfare/wages.

  **Strategy:** Do not defend "Open Borders." Defend "Conditional Jurisdiction." Keep the distinction between *Membership Rights* (which you reject) and *Jurisdictional Rights* (which you affirm) sharp. If they attack the former, remind them you've already discarded it.

  ---

  ### 1. The Supervisor's Supervisor (The Miller-esque Self-Determination Theorist)
  **Expected Timing:** Early Q&A. He will try to reframe your argument as a subset of his.
  **The Voice:** Gruff, slightly weary of "new analogies," focused on the value of ethical community.

  **The Objection:**
  "You spend the first half dismantling the freedom of association view, which I agree is weak. But you're too quick to dismiss collective self-determination. You say jurisdiction is the source of the right. But *why* does a group have jurisdiction? Isn't it precisely because they are a 'people' who need to shape their shared life? If you strip out the cultural/ethical community aspect, you're left with a hollow shell. Why shouldn't a people protect the *character* of their institutions, not just the *capacity*?"

  **Your Reply (2 mins):**
  "Two points. First, I agree self-determination is valuable, but it's not a *trump card* against external claims. On my view, self-determination is the *exercise* of jurisdiction, not the *source* of it. The source is the need for a coordinated justice system.
  Second, regarding 'character': There is a distinction between protecting the *rules* of the game and protecting the *players*. A state can exclude to prevent the collapse of its welfare *system* (the rules), but not to prevent the welfare *level* from dropping because new players join (the outcome). Protecting the 'character' of a culture usually means protecting specific outcomes or identities against change. My account allows a people to govern themselves, but not to govern themselves *in isolation* from the moral claims of those outside. Jurisdiction is a stewardship, not ownership."

  **Soft Spot:** He will press on whether "institutional functioning" is intelligible without a shared culture to sustain it.
  **Premise Check:**
  *   [CONTESTED] That self-determination is instrumental to justice rather than intrinsically valuable. (Miller disagrees here).
  *   [SETTLED] That stewardship implies duties to non-members (standard in political legitimacy literature).

  ---

  ### 2. The Younger Colleague (Migration & Development / Critical Theory)
  **Expected Timing:** Mid-Q&A. She will attack the state-centrism.
  **The Voice:** Sharp, empirical, focused on Global South implications and power dynamics.

  **The Objection:**
  "This jurisdictional model assumes a functioning Weberian state. What about the Global South? If jurisdiction is conditional on legitimacy towards foreigners, does a post-colonial state with porous borders or external debt governance lose its right to exclude? It feels like you're giving Western states a new vocabulary to police borders while denying that right to states that are already de facto governed by external actors. Who adjudicates this 'legitimacy towards foreigners'?"

  **Your Reply (2 mins):**
  "That's a crucial tension. On my account, yes: if a state is a puppet regime or entirely captured by external capital, its claim to *territorial jurisdiction* is weakened, and so is its right to exclude. This isn't a bug; it's a feature. It means we stop treating 'sovereignty' as a blanket immunity for elites in the Global South.
  However, this doesn't grant Western states the right to intervene. The 'legitimacy condition' creates a duty for *wealthy* states to rectify the conditions that undermine that jurisdiction (e.g., debt, climate). Until then, we must be careful not to use 'illegitimacy' as an excuse for neo-colonial intervention. The right to exclude weakens, but the duty of non-interference remains until a supranational authority can step in."

  **Soft Spot:** She will ask who decides when a state is "captured." You risk sounding like you're justifying intervention.
  **Premise Check:**
  *   [CONTESTED] That sovereignty is gradable based on legitimacy (vs. the Westphalian binary).
  *   [SETTLED] That non-interference is a prima facie duty (even if defeasible).

  ---

  ### 3. The Kantian Cosmopolitan
  **Expected Timing:** Mid-Late Q&A. He will push for the logical conclusion.
  **The Voice:** Principled, rigorous, slightly disappointed you aren't going "all the way."

  **The Objection:**
  "You ground the right to exclude in legitimacy towards foreigners. But if global inequality is as severe as we know, and if our institutions rely on that inequality, isn't almost *any* exclusion illegitimate? If legitimacy requires satisfying basic claims of justice, and justice is global, doesn't your 'jurisdictional' account collapse into open borders anyway? You seem to want a halfway house that doesn't exist."

  **Your Reply (2 mins):**
  "I resist the collapse for a functional reason. Even if global justice demands redistribution, the *mechanism* for that redistribution requires stable institutions. If we dissolve border controls entirely tomorrow, the institutions required to deliver justice (courts, welfare, taxation) might collapse under the strain of movement, harming the very people we aim to help.
  So, the right to exclude is *provisional*. It exists only insofar as it is necessary to maintain the institutional capacity to discharge duties—both to citizens and foreigners. It's a 'lifeboat' argument, not a 'property' argument. I agree with you on the end goal (global justice), but I disagree that removing border controls is the immediate means to get there without destroying the apparatus of justice itself."

  **Soft Spot:** He will argue that "institutional capacity" is just an excuse for status quo bias.
  **Premise Check:**
  *   [CONTESTED] That open borders would destabilize institutions necessary for justice (empirical/counterfactual claim).
  *   [SETTLED] That institutions are necessary instruments for delivering justice (non-utopian premise).

  ---

  ### 4. The Law & Economics Person
  **Expected Timing:** Late Q&A. He wants policy traction.
  **The Voice:** Pragmatic, impatient, taps pen when hearing "normative."

  **The Objection:**
  "Okay, so we can't exclude to protect wages or culture, only to protect 'institutional functioning.' That's vague. Does that allow a points system? Does it allow refugee quotas? If I'm drafting legislation, what is the threshold? If I say 'economic stability is required for institutions,' can I exclude anyone poor? I need to know where the line is, not just where the principle is."

  **Your Reply (2 mins):**
  "The line is between *capacity* and *cost*. You cannot exclude to keep wages high for current workers; that's using the state as a closed shop. You *can* exclude if the influx is so rapid it physically prevents the administration of rights (e.g., no housing, no schools, system collapse).
  For policy: Refugee quotas based on *absorption capacity* are permissible; quotas based on *national origin* are not. Points systems are permissible only if tied to specific labor shortages that threaten institutional stability, not general economic growth. The burden of proof is on the state to demonstrate that admission would cause institutional *failure*, not just fiscal *tightening*."

  **Soft Spot:** Distinguishing "fiscal tightening" from "institutional failure" is empirically messy.
  **Premise Check:**
  *   [CONTESTED] That there is a clear empirical distinction between fiscal strain and institutional collapse.
  *   [SETTLED] That discrimination based on national origin is presumptively unjust (standard liberal premise).

  ---

  ### 5. The Department Administrator (The Border Guard Question)
  **Expected Timing:** The very last question. She never misses.
  **The Voice:** Polite, persistent, focused on the individual moral agent.

  **The Objection:**
  "This is all very well for states. But think of the individual border guard. She is just following the policy. If your theory says the state's right to exclude is conditional on legitimacy, and she suspects a particular exclusion is illegitimate, must she resign? Or is she just a cog? I've heard many theories, but the guard still has to look the refugee in the eye."

  **Your Reply (2 mins):**
  "I refuse to let the state absorb the individual's conscience. If the policy is broadly legitimate (maintaining institutional capacity), she has a role-based duty to enforce it. However, if a specific exclusion is manifestly unjust—for example, turning away a refugee when there is clear capacity—her duty to justice overrides her role duty.
  My theory makes this *harder* for the guard, not easier. She can't just say 'it's the law.' She has to ask: 'Is this exclusion necessary for the institution, or is it protectionism?' If it's the latter, she is complicit in injustice. We shouldn't offer state functionaries moral cover they don't deserve."

  **Soft Spot:** This places a huge burden on low-level functionaries.
  **Premise Check:**
  *   [CONTESTED] The extent of "role morality" vs. individual conscience in bureaucracy.
  *   [SETTLED] Individuals are not morally absolved by "just following orders" in clear cases of injustice.

  ---

  ### 6. THE "HOPE NOBODY ASKS" (The Pandemic/Emergency Proviso)
  **Expected Timing:** From a sharp PhD rival or the Miller-esque senior.
  **The Voice:** Predatory, smelling blood in the water.

  **The Objection:**
  "You say exclusion is allowed to protect 'institutional functioning.' During a pandemic, or a climate disaster, or a security crisis, nationalists argue that *any* influx threatens functioning. Doesn't your proviso expand exactly when nationalists want it to? If 'functioning' includes public health, haven't you just given them a permanent emergency exception?"

  **Your Reply (2 mins):**
  "That is the hardest challenge, and here is my constraint: **Proportionality and Temporariness.**
  An emergency exception must be (a) scientifically evidenced, (b) the least restrictive means available, and (c) subject to a sunset clause. Protecting 'public health' is valid; using public health as a pretext for permanent closure is not.
  My account requires the state to prove that *admission* causes the collapse, not that *presence* is risky. If we can quarantine or test, exclusion is not 'necessary' for functioning. The nationalist wants a wall; my account demands a sieve that only closes when the water pressure breaks the dam. It's a high bar, but I admit it is the most vulnerable point in the theory."

  **Soft Spot:** This is your weakest point. "Necessity" during emergencies is notoriously elastic.
  **Premise Check:**
  *   [CONTESTED] That emergency powers can be effectively constrained by philosophical criteria (realists will doubt this).
  *   [SETTLED] That rights restrictions during emergencies require proportionality (standard human rights law framework).

  ---

  ### GENERAL SURVIVAL TIPS

  1.  **Don't Defend the "Middle":** When they say you're splitting the difference, say you're *changing the axis*. It's not Open vs. Closed; it's Stewardship vs. Ownership.
  2.  **The "Legitimacy to Foreigners" Hook:** If you get stuck, return here. "My core claim is that jurisdiction creates duties to outsiders, not just insiders. If you reject that, we disagree on the nature of the state."
  3.  **Admit Contested Ground:** If pressed on the Miller point, say: "You're right, David Miller argues self-determination is intrinsic. I am arguing it is instrumental. That is a fundamental disagreement we won't solve today, but here is why instrumentalism fits the migration case better..." (This shows respect without conceding).
  4.  **Watch the Clock:** If the Miller-esque senior starts talking, he might not stop. Interrupt politely: "I want to make sure I understand the core objection before I run out of time..."

  **Good luck. You know the text. Trust the jurisdiction move.**
