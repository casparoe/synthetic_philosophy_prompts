      *   *Check:* Is the distinction between "noise" and "gaming" clear? Yes, this is Regressional vs. Adversarial.
      *   *Check:* Did I answer the "predictive vs explanatory" tension? Yes, this is the core trade-off.

  9.  **Final Polish:** Ensure the formatting is clean (bolding, lists) to make it readable for a backend engineer skimming for specs. (Proceed to generate output based on these thoughts).

  *(Self-Correction Note)*: I need to make sure I don't just dump the Manheim taxonomy but evaluate it against the *desiderata* I create. The prompt asks me to write the desiderata *first*, then evaluate. I must stick to that order.

  *(Refining the "Joint Unsatisfiability")*: The biggest tension is between *Domain Generality* and *Predictive Precision*. A theory that covers RL agents and Soviet factories will necessarily be abstract enough that it can't predict exactly when your PR metric will break. I need to highlight this clearly.

  *(Refining the "Friend's Company")*: This touches on *Metric Robustness*. A theory of failure must imply conditions for non-failure.

