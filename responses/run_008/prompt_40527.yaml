prompt: |-
  I'm a backend engineer, no philosophy background at all, but Goodhart's law has basically ruined my life at work this year and I need to understand it properly. Quick context: our org rolled out a "developer productivity" dashboard (commits per week, PR turnaround time, incidents closed per quarter), and within a month the numbers were all up and, as far as anyone can tell, actual shipping speed went down. My favorite bit was the incident metric: people started batching trivial issues so they could close them in bulk, and one team started opening incidents for stuff they'd already fixed so closing them would count. Meanwhile my friend at another company says their equivalent metrics have been under "pressure" for years and haven't collapsed at all, which nobody ever explains. So I went down a rabbit hole, and the weird thing is that everyone cites Goodhart's law (and Campbell's law, and sometimes something called the Lucas critique from economics) for literally everything — Soviet factories optimizing tonnage, students cramming for tests, ML reward hacking where an RL agent exploits a badly specified reward function — but there doesn't seem to be an actual theory anywhere, just the slogan and a pile of anecdotes.

  So before I go read more people arguing past each other, I want the spec first. Write me the desiderata: what an adequate theory of Goodhart's law / specification gaming actually has to deliver to count as a theory rather than a witticism. Which cases must it get right, and which distinctions can it not afford to collapse? Stuff I'd want covered but feel free to add or push back on: the difference between a proxy breaking because people strategically adapt to it versus breaking just because optimization pressure exposes its noise (I've seen ML people talk about regressional vs adversarial Goodhart or something like that, but I don't know if that taxonomy earns its keep); the difference between a proxy that was chosen *because* it correlated with the goal at low optimization pressure and one where the gaming is basically baked in from the start; the case where the proxy never collapses even under pressure (my friend's company) and whether a theory owes us an explanation of *that* or whether it's out of scope; and whether the theory has to be quantitative/predictive (tell me in advance how much optimization pressure breaks which proxy) or whether explanatory is enough — my gut says those two pull against each other but I can't articulate why.

  For each requirement give the case or consideration behind it, then do three more things. Mark which requirements are non-negotiable and which are just preferences of one camp (the AI safety people clearly want different things from the law-and-economics people, and I'd like to know which demands are genuine and which are prejudices). Tell me if any subset of the desiderata is jointly unsatisfiable — like if "predictive precision" and "covers both reinforcement learning agents and human institutions in one framework" can't both be had, that's basically a result in itself and I want that named. And then, briefly, run the common contenders against your list: the four-way taxonomy from the ML world if you know it, Campbell's law as a sociological version, and the plain cynical reading where it's just "people respond to incentives, no mystery." Keep the weight on the requirements, not the scorecard — I'm mainly trying to figure out what I should even be asking of a theory here before I waste more time on one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer, no philosophy background, pragmatic, technically literate (mentions ML, RL, regression), frustrated by organizational metrics (Goodhart's law in action).
      *   **Problem:** Goodhart's Law is cited everywhere as a slogan/anecdote, but lacks a rigorous theoretical framework. The user wants to know what an *adequate theory* looks like before diving into the literature.
      *   **Task:** Write the *desiderata* for a theory of Goodhart's Law/Specification Gaming.
      *   **Specific Requirements:**
          *   Define what makes it a theory vs. a witticism.
          *   Cover specific distinctions (strategic adaptation vs. noise/exhaustion, pre-existing correlation vs. baked-in gaming, stable proxies vs. collapsing ones).
          *   Address quantitative/predictive vs. explanatory.
          *   For each requirement: Give the case/consideration, mark negotiability (non-negotiable vs. camp preference), and identify joint unsatisfiability (trade-offs).
          *   Run common contenders (ML taxonomy, Campbell's Law, Cynical Reading) against the list.
          *   Keep weight on requirements, not the scorecard.

  2.  **Deconstruct Goodhart's Law & Related Concepts:**
      *   *Core Statement:* "When a measure becomes a target, it ceases to be a good measure."
      *   *Mechanisms:*
          *   *Regressional:* The measure is a noisy proxy. Optimizing the max of the measure selects for noise. (Statistical)
          *   *Causal:* The measure causes the goal, but only up to a point (diminishing returns) or via a specific path that can be hacked.
          *   *Extremal:* Optimization pushes the system into a regime where the correlation no longer holds (distribution shift).
          *   *Adversarial/Strategic:* Agents actively manipulate the measure without improving the goal (Gaming).
      *   *Contexts:* Economics (Lucas Critique), Sociology (Campbell's Law), AI Safety (Reward Hacking), Management (KPIs).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Req 1: Mechanism Distinction.* The user specifically asked about strategic vs. noise. A theory *must* distinguish between "the metric broke because we pushed too hard" (Extremal/Regressional) and "the metric broke because people cheated" (Adversarial).
          *   *Status:* Non-negotiable. Without this, you can't fix it (change metric vs. change incentives).
      *   *Req 2: Regime Stability.* Why did the friend's company survive? A theory needs to explain boundary conditions. When does a metric *hold*?
          *   *Status:* Non-negotiable for a *general* theory, but maybe too hard for a specific model. Let's call it a "Scope Condition."
      *   *Req 3: Predictive vs. Explanatory.* The user asks about this. Can we predict *when* it breaks?
          *   *Status:* This is the trade-off. High prediction usually requires narrow scope. High scope usually means post-hoc explanation.
      *   *Req 4: Agent Model.* Humans vs. RL agents. Humans have social norms; RL agents have pure optimization.
          *   *Status:* Camp preference. AI safety wants general optimization; Soc/Econ wants human specific.
      *   *Req 5: Intervention Guidance.* If the theory doesn't tell me what to do, is it useful?
          *   *Status:* Preference (Engineering vs. Philosophy).

  4.  **Refining the Trade-offs (Joint Unsatisfiability):**
      *   *Universality vs. Precision:* You can't have a single equation that predicts Soviet nail tonnage *and* RL reward hacking *and* PR turnaround time with high precision. The variables are too different.
      *   *Explanatory Depth vs. Actionability:* Deep causal models are hard to measure. Simple metrics are easy to measure but prone to Goodhart.

  5.  **Evaluating Contenders:**
      *   *ML Taxonomy (Regressional, Causal, Extremal, Adversarial):* Good on mechanisms, bad on human incentives.
      *   *Campbell's Law:* Good on social erosion, bad on statistical noise.
      *   *Cynical Reading ("Incentives"):* Too shallow. Doesn't explain *why* some incentives work and others fail.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration. Validate that "Goodhart" is often used as a conversation stopper rather than a starter.
      *   **The Desiderata List:** Numbered items with the specific structure requested (Case, Negotiability, Trade-offs).
