  I've spent years reading LessWrong and adjacent forums, and the epistemology I absorbed there is roughly this: probability lives in the mind, a probability is a betting price, and coherence under a Dutch book is the whole of rationality. Ambiguity aversion, as I understand it from the outside, looks like people treating unknown probabilities differently from known ones, which in my vocabulary sounds like a simple category error. Translate the Ellsberg paradox and the ambiguity-aversion literature into my vocabulary as faithfully as you can — bets at stated odds, expected utility, calibration, scoring rules, the machinery I actually use. Then give me a residue report. Which parts of the Ellsberg behavior translate cleanly, for instance as ordinary risk aversion over money that we could launder out by shrinking the stakes? Which parts translate only with distortion, such as forcing a single subjective probability where the experiments seem to show people holding none? And is there anything in the observed violations of Savage's sure-thing principle that has no counterpart in my vocabulary at all? On that last point, I want a verdict: is the residue a defect of my betting-odds epistemology, or a sign that the ambiguity-aversion literature is tracking something less coherent than it claims? Be explicit about anything the translation smuggles in rather than carries over.
