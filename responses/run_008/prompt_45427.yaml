          *   The Crucial Point: Finite $k$ is never equal to Infinite $k$. In coordination games, the threshold for action often requires $C$. If the payoff structure requires certainty that *everyone else* is certain (to avoid being the only one showing up), finite levels leave a residue of doubt.
