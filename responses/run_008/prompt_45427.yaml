      *   **Hypothesis:** The user suspects "common knowledge" is the relevant concept.
      *   **Request:** Name the phenomenon/concept, explain *why* private confirmations don't equal public announcements (the "gap"), and point to formal results/literature. Avoid just giving a label; explain the edges and mechanics.

