answer: |-
  Yes, you have hit on one of the most famous and counterintuitive results in game theory and epistemic logic.

  The phenomenon you are describing is the distinction between **Mutual Knowledge** (or iterated knowledge) and **Common Knowledge**. The specific formal result that explains why your layered confirmations fail to bridge the gap is best illustrated by **Rubinstein's Email Game**, which is a variation of the classic **Two Generals' Problem**.

  Here is the breakdown of why this happens, why the "gap" is qualitative rather than quantitative, and where the edges of the concept lie.

  ### 1. The Hierarchy of Knowledge
  To understand the gap, we have to formalize what "knowing" means in a group.

  *   **Level 1 (Mutual Knowledge):** Everyone knows the time has changed.
      *   *You tell everyone.*
  *   **Level 2:** Everyone knows that everyone knows.
      *   *Everyone confirms to you, and you tell them "I got your confirmation."*
  *   **Level 3:** Everyone knows that everyone knows that everyone knows.
      *   *You confirm their confirmation.*

  When you send private messages back and forth, you are climbing this ladder one rung at a time. If you exchange 10 rounds of confirmations, you have reached **Level 10 Knowledge**.

  **Common Knowledge** is not Level 10, or Level 100. It is **Level $\infty$**.
  Common Knowledge means: Everyone knows $X$, and everyone knows that everyone knows $X$, and everyone knows that everyone knows that everyone knows $X$... *ad infinitum*.

  ### 2. The Qualitative Jump (The Discontinuity)
  Your intuition says that Level 100 should be "basically the same" as Level $\infty$. Mathematically and logically, it is not. There is a **discontinuity**.

  In coordination games (like showing up to a pickup game), the rational decision to act often depends on **Common Knowledge**, not just high-level Mutual Knowledge. This is due to a logical process called **backward induction**, famously modeled by Ariel Rubinstein in 1989.

  Here is the logic of why private confirmations unravel:

  1.  Imagine you need to be sure the other person is coming before you commit to going (to avoid wasting a trip).
  2.  If there were **zero** confirmations, you wouldn't go (you don't know if they know).
  3.  If there was **one** confirmation (they said "OK"), you know they know. But do *they* know that *you* know? If they don't know that you know, they might think you haven't received their OK, so they might not show up. So you shouldn't show up.
  4.  If there are **two** confirmations (you said "OK to the OK"), now you know they know you know. But do *they* know that *you* know that *they* know? If the last message might have been lost, they might be stuck at step 3 logic.
  5.  **The Unraveling:** No matter how many confirmations ($N$) you exchange, there is always a residual doubt about the $(N+1)$th state. Because rational agents reason backward from the possibility of failure, if coordination isn't safe at $N=0$, the logic propagates up the chain. If I can't trust you at 1 message, I can't fully trust you at 2, because your decision at 2 depends on your assessment of my decision at 1.

  In **Rubinstein's Email Game**, he proved that if there is *any* non-zero probability of a message failing (even 0.0001%), **Common Knowledge is impossible to achieve via private messages.** Consequently, for certain payoff structures, rational players will simply default to the safe option (not showing up) regardless of how many confirmations are exchanged.

  ### 3. Why the Public Chat Works
  When you announce the time change in the main group chat where everyone can see everyone else's reactions, you are not climbing the ladder rung-by-rung. You are creating a **shared event**.

  *   **The Event:** The message appearing in the chat.
  *   **The Visibility:** Everyone sees the message appear. Everyone sees the other names in the chat. Therefore, everyone knows that everyone else sees the message appear.

  The *public nature of the channel* does the heavy lifting. It creates the infinite hierarchy ($E^\infty$) instantly because the fact that "the message was sent" is itself Common Knowledge. You don't need to confirm receipt because the medium guarantees that if one person saw it, the conditions for everyone else seeing it were identical.

  ### 4. The Edges of the Concept
  You asked for the edges of where this applies. It is not just "communication."

  **Where it applies (The Gap exists):**
  *   **Unreliable Channels:** If there is *any* doubt a message could be lost, delayed, or unread (e.g., "Did they see the notification?"), private messages cannot create Common Knowledge.
  *   **High-Stakes Coordination:** If the cost of being the *only* one to show up is high (wasted trip), players require Common Knowledge. If the cost is low (just a boring hour alone), Level 2 knowledge might suffice.
  *   **Rational Agents:** The "unraveling" effect assumes people are reasoning logically about each other's uncertainty. In real life, humans often use heuristics ("90% sure is good enough"), which is why your private messages work *sometimes*, but fail more often than the public chat.

  **Where it doesn't apply (The Gap closes):**
  *   **Perfect Channels:** If you have a guaranteed delivery system (e.g., a cryptographic protocol with 100% uptime and read receipts that cannot be faked) AND everyone knows the system is perfect, finite confirmations can establish Common Knowledge. The gap exists because of the *possibility* of error.
  *   **Schelling Points:** Sometimes coordination happens without Common Knowledge if there is a "focal point." (e.g., "Let's meet at noon" is a natural focal point; "Meet at 12:07" is not). Your public chat acts as a Schelling point for the *information itself*.

  ### 5. Names and Literature to Explore
  If you want to read the formal treatment, these are the key terms and papers:

  1.  **Common Knowledge vs. Mutual Knowledge:**
      *   **David Lewis (1969), *Convention*:** The philosophical origin. He defined Common Knowledge as the basis for social conventions.
      *   **Robert Aumann (1976), "Agreeing to Disagree":** Formalized Common Knowledge in game theory.

  2.  **The Specific "Gap" Model:**
      *   **Ariel Rubinstein (1989), "The Electronic Mail Game":** This is the exact paper that mathematically proves why $N$ confirmations $\neq$ Public Announcement. It shows the discontinuity where behavior changes drastically between Common Knowledge and high-order Mutual Knowledge.

  3.  **The Distributed Systems Analogy:**
      *   **The Two Generals' Problem:** The computer science equivalent. Two armies must attack simultaneously. They send messengers. Messengers can be captured. Proof exists that no protocol guarantees coordination. Your group chat is a "human implementation" of this problem.
      *   **Halpern & Moses (1990), *Knowledge and Common Knowledge in a Distributed Environment*:** The definitive text on why common knowledge is impossible in systems with unreliable communication.

  ### Summary
  The reason your layered confirmations fail is that you are building a **finite tower of "I know that you know"** on a foundation that allows for **uncertainty**. A public announcement changes the foundation; it makes the *state of knowledge* itself a public fact.

  In logic, **Common Knowledge is not the limit of Mutual Knowledge.** It is a different category entirely. You cannot approximate it with enough private texts, just as you cannot approximate a public square by whispering a secret to every individual in a city one by one.
