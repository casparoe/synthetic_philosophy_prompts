      *   Not scapegoat? Yes.
      *   Realistic? Yes (Pension fraud, nursing home).
      *   Verdicts correct for each theory? Yes.
      *   Address 3 pressures? Yes.

  8.  **Final Polish:** Check the flow and ensure the distinction between "Pure Retributivism" (Desert-based) and "Communicative Retributivism" is clear, as this is often a point of confusion. The prompt treats them as distinct "levers."

      *   *Lever 1:* Pure Desert (Past-looking, duty-based).
