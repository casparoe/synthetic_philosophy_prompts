answer: |-
  Here is an analysis of the implicit theory of meaning and agency underpinning the bundle of practices you described.

  ### 1. The Core Commitment: Institutional Complicity
  The unifying principle across newsrooms, platforms, and captioning services is not merely "avoiding offense." It is a theory of **Institutional Complicity via Token Endorsement**.

  The practice presupposes that to reproduce a slur token (visually or textually) is not to *report* on a speech act, but to *perform* a secondary speech act of endorsement or dissemination. When a newsroom prints "the n-word," it is drawing a boundary between the *subject* of the report (the politician) and the *author* of the report (the newsroom). When they print the slur verbatim, that boundary collapses; the newsroom becomes a co-utterer.

  This commits the practice to a view where **medium matters as much as message.** The visual text is treated as the institutional voice, whereas audio (in the subtitle case) or quoted context is treated as evidentiary material.

  ### 2. Semantic Implications: What This Rules In and Out
  Your intuition that this conflicts with a "fixed derogatory content" view is correct. The bundle of rules is incompatible with several standard semantic theories and requires a specific hybrid view.

  **Ruled Out: Pure Truth-Conditional Referentialism**
  If slurs were semantically identical to neutral counterparts (e.g., "n-word" means exactly "Black person," just with a rude tone), there would be no reason to censor them in quotes. We quote rude words constantly ("He called me an idiot"). The refusal to print the slur implies the word carries a **non-truth-conditional content**—a "poison" that isn't neutralized by quotation marks.

  **Ruled Out: Semantic Invariantism**
  Invariantism holds that a slur has the same derogatory force regardless of context or speaker. The **in-group exception** in moderation policies (allowing reclamation use) flatly contradicts this. If the meaning were fixed, an in-group member using it would be just as semantically derogatory as an out-group member. The practice presupposes that the *harm potential* or *derogatory content* is sensitive to the identity relation between speaker and target.

  **Required: Expressivism + Contextualism**
  The practice runs on a theory that slurs are **expressives**. Their primary function is not to describe the world but to enact a social hierarchy or express a prohibited attitude.
  *   **Expressivism:** Explains why quoting is banned. You cannot "quote" an expressive act without risking re-enacting it.
  *   **Contextualism:** Explains the in-group exception. The expressive content is modulated by the speaker's social standing.

  ### 3. Semantics vs. Pragmatics: Is "Entitlement" Enough?
  You asked if this could just be a norm about *standing* (pragmatics) rather than *meaning* (semantics). Could we say the word means the same thing, but out-group members just lack the license to use it?

  **A purely pragmatic account fails to license the exact bundle of rules.**
  Here is why: In a purely pragmatic framework, context usually resolves ambiguity. If a newsroom prints, "The politician said, 'I hate [slurs],'" the context makes it 100% clear that the *politician* holds the attitude, not the newsroom. If the harm were purely about audience confusion regarding *who* holds the racist attitude, quotation marks should solve it.

  The fact that quotation marks *do not* solve it implies that the **token itself** is treated as hazardous, independent of the immediate pragmatic context. The visual presence of the slur is treated as a contamination risk that transcends the specific speech act. This suggests the "poison" is partially semantic (encoded in the convention of the word) rather than purely pragmatic (dependent on immediate intent).

  Therefore, the practice requires more than a norm of entitlement; it requires a view where the word retains a **residual normative charge** even when quoted, which only a semantic or quasi-semantic theory (like conventional implicature) can explain.

  ### 4. The Subtitle Stress Test: Consistency Check
  This is the strongest point of tension.
  *   **Audio:** Unbleeped. The viewer hears the slur.
  *   **Text:** Censored. The viewer reads "[expletive]."

  **The Inconsistency:**
  If the harm lies in the *reception* of the slur by the audience, broadcasting the audio defeats the purpose of censoring the text. The audience hears the phonemes, processes the meaning, and experiences the offense (if any).
  If the harm lies in the *production* of the token, who is producing the subtitle? The captioner. Who is producing the audio? The original speaker.

  **The Implicit Distinction:**
  The practice is consistent only if it presupposes a distinction between **Transmission** and **Authorship**.
  *   **Audio** is treated as *Transmission*. The network is a conduit for the raw event. To bleep the audio would be to alter the historical record or the artistic integrity of the clip. It is framed as "evidence."
  *   **Text** is treated as *Authorship*. Subtitles and transcripts are not seen as neutral pass-throughs; they are editorial products created by the network's staff. To type the slur is for the *network* to type the slur.

  **The Stress Test Result:**
  The practice is **internally consistent** only under a specific theory of **Medium-Specific Agency**. It presupposes that text carries a higher degree of institutional authorship than audio transcription. Text is permanent, searchable, and visually "spoken" by the platform. Audio is ephemeral and "spoken" by the subject.

  However, this is fragile. As audio becomes searchable (via AI transcription) and text becomes permanent (screenshots), this distinction erodes. The practice relies on an older intuition that "writing is asserting" while "recording is documenting."

  ### 5. The Minimal Patch
  The subtitle case reveals a gap: If the captioner is an agent of the network, and the network refuses to "say" the word, why provide a text track at all that corresponds to the audio? Why not just leave that line blank?

  The current practice (printing "[expletive]") attempts to acknowledge the speech act without performing it. But if the theory is that the *token* is dangerous, "[expletive]" is a safe token, while the audio is a dangerous token.

  **The Incoherence:**
  The practice creates a **modal mismatch**. It treats the visual modality as morally weightier than the auditory modality. This is hard to justify if the harm of slurs is psychological impact on the listener/viewer, which is arguably higher via audio (tone, aggression) than text.

  **The Patch:**
  To make the theory coherent, you must add a **Norm of Normalization**.
  The implicit theory must claim that the primary harm being mitigated is not the *immediate offense* to the viewer (since the audio is unbleeped), but the **long-term normalization of the symbol** in the public lexicon.

  *   **Audio:** Does not normalize the *written symbol*. It remains an ephemeral sound.
  *   **Text:** Adds the symbol to the written record, making it searchable, copy-pasteable, and visually standard.

  **Reconstructed Theory:**
  The bundle of rules is committed to the view that:
  1.  **Slurs are Expressives:** They enact harm, not just describe.
  2.  **Identity-Dependent Force:** Their derogatory power is modulated by speaker identity (allowing in-group exceptions).
  3.  **Institutional Authorship:** Publishing text is an act of authorship, not just transmission.
  4.  **Symbolic Normalization:** The primary risk of institutional use is not immediate offense (which audio already causes) but the **reification of the written symbol** in the public sphere.

  **Conclusion on Consistency:**
  The parts are consistent *only if* you accept that the visual text carries a unique risk of **lexical legitimation** that audio does not. If you reject that premise (i.e., if you believe hearing the word is just as normalizing as reading it), the subtitle practice is incoherent performative hypocrisy. The minimal addition required to save it is the **Normalization Constraint**: Institutions must avoid adding slurs to the *written* commons, even if they must transmit the *spoken* reality for evidentiary reasons.
