          2.  *Moderation:* Ban out-group use, allow in-group use (with caveats for lyrics/quotes).
          3.  *Transcripts/Subtitles:* Audio is unbleeped, text is masked/censored.
      *   **The Question:** What theory of meaning (semantics/pragmatics) does this bundle presuppose?
      *   **Specific Constraints:**
          *   Reconstruct the implicit theory.
          *   Distinguish between what is *required* vs. *compatible*.
          *   Evaluate if a purely pragmatic account works.
          *   Identify which semantic views are ruled out.
          *   Check for internal consistency (especially the subtitle stress test).
          *   Propose a patch if inconsistent.
          *   **No citations or reading lists.**

  2.  **Initial Brainstorming & Categorization:**

      *   *The Phenomenon:* This is about "distancing." The institution (newsroom/platform) wants to report the *fact* of the utterance without *performing* the utterance.
      *   *Semantics vs. Pragmatics:*
          *   *Semantic View:* The word *means* something derogatory inherently. If you write it, you instantiate that meaning.
          *   *Pragmatic View:* The word is a tool. Context determines harm. The institution is managing harm, not meaning.
          *   *Hybrid:* The word has a potent semantic load, but the *act* of publishing is a separate speech act.
      *   *The Subtitle Paradox:* Audio = Real. Text = Representation. If the text is censored but audio isn't, the text is treated as a *label* or *record* by the captioner, not a direct transmission of the speaker's voice. The captioner is an agent.
      *   *Identity/Reclamation:* The in-group/out-group distinction suggests the meaning/harm is tied to the relationship between speaker and target, not just the phonemes.

  3.  **Analyzing the Implicit Theory:**

      *   *What is the core commitment?* It's not just about "offense." It's about *complicity*. By printing the word, the newsroom becomes a co-utterer.
      *   *Theory of Meaning:* This leans heavily towards **Expressivism** or **Use-Conditional Meaning**. The word doesn't just describe; it *does* something (subordinates, insults).
      *   *Theory of Agency:* The publisher is an agent with moral responsibility, not a neutral conduit.
      *   *The "N-word" vs. "Fuck":* Why the difference? "Fuck" is taboo/vulgar. Slurs are *harmful/violent*. The theory distinguishes between *propriety* (fuck) and *harm* (slurs).

  4.  **Addressing the Specific Questions:**

      *   *Semantic vs. Pragmatic:* Can a purely pragmatic account explain it?
          *   *Pragmatics:* Focuses on intent and effect. If the intent is reporting, and the effect is minimal, why censor?
          *   *Problem:* If it were purely pragmatic, verbatim quotes should be fine if context makes it clear it's reporting. The fact that they *aren't* fine suggests the *token itself* carries a risk that context can't fully neutralize.
          *   *Conclusion:* Pure pragmatics is insufficient. It requires a semantic commitment that the *token* has a residual power independent of immediate intent.
      *   *Which views are ruled out?*
          *   *Pure Referentialism/Truth-Conditional Semantics:* If slurs just refer to groups (like "Black person" but rude), then quoting them should be fine (like quoting "idiot"). The practice rules this out.
          *   *Invariantism:* The idea that the word has the *exact* same force regardless of context. The in-group exception rules this out. The meaning/harm *must* be context-sensitive (specifically identity-sensitive).
      *   *The Subtitle Stress Test:*
          *   Audio: Original speaker's act.
          *   Text: Captioner's act.
          *   *Inconsistency:* If the harm is in the *sound*, why censor the text? If the harm is in the *visual token*, why play the audio?
          *   *Resolution:* The text is a *permanent record* searchable and scannable. The audio is ephemeral. But more deeply, the text is the *institution's voice*. The audio is the *subject's voice*. The institution refuses to type what it won't say.
      *   *Is it consistent?* Mostly, but the subtitle case reveals a tension between *transmission* and *authorship*.

  5.  **Drafting the Analysis (Iterative Process):**

      *   *Step 1: Define the Core Theory.* Call it "Institutional Complicity via Token Endorsement." The act of publishing is a speech act.
      *   *Step 2: Semantics.* It requires a **Hybrid Semantic-Pragmatic View**. Specifically, **Expressivism** (slurs express attitude) + **Contextualism** (identity matters). It rejects **Invariantism** (same meaning always) and **Pure Referentialism** (just a label).
