      *   **Semantic Implications:** Expressivism + Contextualism (ruling out Invariantism/Referentialism).
      *   **Pragmatics vs. Semantics:** Why pure pragmatics fails.
      *   **The Subtitle Stress Test:** Analyzing the inconsistency.
      *   **The Patch:** Medium-Specific Agency.

