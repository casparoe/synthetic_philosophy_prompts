      *   *Step 5: Consistency Check.* Is it consistent? Yes, if we distinguish between *evidence* (audio) and *assertion* (text). But it's fragile.
      *   *Step 6: The Patch.* The minimal addition needed is a theory of **Medium-Specific Agency**. Text = Institutional Assertion. Audio = Recorded Evidence.

  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say the practice *proves* a semantic theory. It *presupposes* one.
      *   *Nuance:* The in-group exception is crucial. It proves the harm isn't in the phonemes alone. It's in the *social relation*.
      *   *Subtitle nuance:* It's not just permanence. It's about *searchability* and *normalization*. Seeing the word normalized in text is different from hearing it in a heated moment.
      *   *Terminology:* Avoid heavy jargon where possible, but use precise philosophical terms (Expressivism, Truth-Conditional, etc.) as requested.

  7.  **Final Polish:**

      *   Ensure the distinction between "entitlement" (norms) and "meaning" (semantics) is addressed.
      *   Make sure the "Subtitle Stress Test" gets a dedicated section.
      *   Check constraints: No citations. Direct analysis.

  8.  **Final Output Structure:**
