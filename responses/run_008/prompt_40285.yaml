          *   $P(A)$: Probability that structural factors alone would have generated war within 5 years.
          *   $P(B)$: Probability that the "inevitability" is hindsight bias (inverse of actual inevitability).
          *   $P(C)$: Probability that narrative history obscures contingency.
          *   $P(D)$: Probability that specific agency (the "wrong turn" equivalent) is the decisive variable.

