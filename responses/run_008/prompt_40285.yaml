      *   *Term 3 (Narrative Fallacy):* How much does storytelling distort causality? Let's say 0.6 (Stories need arcs, history is messy).
      *   *Term 4 (Specific Agency):* How much did the specific blunders of July 1914 matter? Let's say 0.7 (Specific decisions mattered immensely).

      *   *Wait, the prompt asks for the decomposition of the estimate itself.* I need to assign probabilities to the *propositions* that underpin the final number.
