      *   *Scholarly Consensus (roughly):* Most historians agree the assassination was the *trigger*, not the *cause*. However, whether another trigger would have appeared soon is debated. The "security dilemma" was acute.
      *   *My Estimate:* I need to balance the structural pressures (alliances, arms race, nationalism) against the agency and specific decisions made in July 1914 (the "blank cheque," Russian mobilisation). Many historians (e.g., Christopher Clark, *The Sleepwalkers*) argue it wasn't inevitable. Others (e.g., Fritz Fischer, though dated, or structural realists) argue the system was brittle.
      *   *Drafting the Number:* If I say 90%, I'm saying it was inevitable. If I say 10%, I'm saying 1914 was a freak accident. A moderate position acknowledges high tension but significant contingency. Let's aim for around 60-70%. Let's settle on **65%**. This suggests a strong structural pull towards war, but acknowledges a significant chance (35%) that diplomacy or a different crisis could have been managed, or that the specific configuration of 1914 was uniquely toxic.

  3.  **Decompose the Estimate:**
