answer: |-
  Here is a complete lesson plan designed for a 75-minute upper-level seminar. It prioritizes visceral experience over lecturing, forcing the paradox to emerge from the students' own choices.

  ### **Activity Design: The Centipede Seminar**

  **Class Size:** 14 Students (7 Pairs)
  **Time:** 75 Minutes
  **Stakes:** "Course Lottery." Each token earned = 1 entry into a draw for a high-value prize (e.g., a $100 book voucher, a "skip one reading" pass, or a nice dinner).
  **Why this works:** It avoids the ethical/IRB hurdles of cash while creating enough variance that 64 tokens feels significantly better than 2 tokens.

  #### **1. The Payoff Schedule (The "Ladder")**
  Project this on the board and hand out a printed sheet to each pair. The game has 6 decision nodes. Player 1 moves at 1, 3, 5. Player 2 moves at 2, 4, 6.
  *Note: At Node 6, Player 2 has no choice; the game ends automatically with the Node 6 payoffs. This ensures a finite terminal node for Backward Induction (BI).*

  | Node | Player | **TAKE** Payoffs (You, Partner) | **PASS** Consequence |
  | :--- | :--- | :--- | :--- |
  | **1** | P1 | **200**, 100 | Game continues to Node 2 |
  | **2** | P2 | 100, **400** | Game continues to Node 3 |
  | **3** | P1 | **800**, 200 | Game continues to Node 4 |
  | **4** | P2 | 200, **1600** | Game continues to Node 5 |
  | **5** | P1 | **3200**, 800 | Game continues to Node 6 |
  | **6** | P2 | 800, **6400** | **Game Ends** |

  **The BI Prediction:**
  *   Node 6: P2 gets 6400 (Forced).
  *   Node 5: P1 compares 3200 (Take) vs. 800 (Pass → Node 6). **Take.**
  *   Node 4: P2 compares 1600 (Take) vs. 200 (Pass → Node 5). **Take.**
  *   ...propagates back...
  *   **Node 1:** P1 Takes. Payoff: **(200, 100).**
  *   **Social Optimum:** Reach Node 6. Payoff: **(800, 6400).**

  ---

  #### **2. Logistics & Rotation**
  *   **Materials:** 7 "Game Sheets" per round. The sheet has checkboxes for PASS/TAKE at each node.
  *   **Procedure:** Pairs sit together. One sheet. P1 marks Node 1. If PASS, slide sheet to P2. If TAKE, circle payoff, raise hand for instructor verification.
  *   **Anonymity:** To prevent collusion, students submit sheets face-down. Only the instructor sees the full distribution. Partners are told their own payoff but *not* their partner's total token count across rounds.

  **Round Structure (3 Rounds Total):**
  *   **Round 1 (Baseline):** Random pairs. Standard rules. (15 mins)
  *   **Round 2 (Pre-Commitment):** **Rotate partners.** Before play starts, both players must write down their *full strategy* (e.g., "I will Pass at 1, 3, 5" or "Take at 1") and sign it. They hand the strategy to the instructor, *then* play the game. (25 mins)
  *   **Round 3 (Public Rationality):** **Rotate partners.** Before play, the class stands. You read a script: *"I am a rational payoff maximizer. I know you are a rational payoff maximizer. I know that you know that I know..."* They sit and play immediately. (20 mins)

  ---

  #### **3. What Will Predictably Go Wrong (And How to Handle It)**

  **1. The "Let's Split" Collusion**
  *   **The Problem:** A pair realizes that if they reach Node 6, they generate 7200 tokens total. If P1 takes at Node 1, they generate 300. They may verbally agree to pass all the way and split the winnings afterward.
  *   **The Fix:**
      *   **Rule:** Explicitly state in the instructions: *"Side payments or post-game splitting agreements are forbidden and will disqualify you from the lottery."*
      *   **Structural:** In Round 2 (Pre-Commitment), collect the strategy sheets *before* they speak. If their written strategy says "Take at 1" but they play "Pass," highlight this inconsistency in the debrief.
      *   **Incentive:** Remind them the lottery is *individual*. Their partner cannot transfer entries.

  **2. Number Fatigue / "Monopoly Money" Syndrome**
  *   **The Problem:** By Node 5, the numbers (3200 tokens) feel abstract. Students stop caring about the marginal gain.
  *   **The Fix:**
      *   **Visual Anchor:** Write the cash-equivalent on the board. "100 Tokens = 1% chance at the $100 Voucher."
      *   **Cap the Game:** If a pair takes > 2 minutes, intervene and say, "Time limit reached, game ends at current node." This adds pressure to Take early.

  **3. The "Node 6 Confusion"**
  *   **The Problem:** Students treat Node 6 as a choice. If P2 chooses to Pass at Node 6, the BI logic breaks (because the terminal payoff isn't fixed).
  *   **The Fix:**
      *   **Rule:** Node 6 is **not a decision**. It is a terminal state. If the game reaches Node 6, P2 *automatically* receives 6400. Print this in bold on the sheet.

  **4. The "Why Did You Pass?" Anger**
  *   **The Problem:** In Round 1, P1 might Pass, hoping P2 will Pass at Node 2. P2 Takes at Node 2. P1 feels betrayed.
  *   **The Fix:**
      *   **Framing:** Tell them *before* Round 1: *"You may feel frustrated by your partner's move. Save that emotion. It is the most important data point for this seminar."*

  ---

  #### **4. The Debrief (15 Minutes)**
  *Do not lecture. Map their experience to the theory.*

  **Phase 1: The Empirical Fact (Settled)**
  *   **Ask:** "Show of hands, how many pairs ended at Node 1?" (Likely few). "How many reached Node 4 or higher?" (Likely most).
  *   **State Flatly:** "The Backward Induction solution is unique: Take at Node 1. The empirical reality is: Almost no one does this in one-shot games. This is a robust finding in experimental economics (McKelvey & Palfrey, 1992). This is not up for debate."

  **Phase 2: The Paradox (The "Surprise")**
  *   **Ask Round 2 Players:** "Look at your Pre-Commitment sheet vs. your actual play. Did they match?"
  *   **The Point:** Many will have written "Take at 1" (knowing the theory) but Played "Pass" (hoping for cooperation).
  *   **Map to Theory:** "BI requires that I believe you will be rational at Node 5. If I am at Node 4, and you *didn't* Take at Node 3, you have already falsified the premise that you are a BI-rational player. Why should I follow BI at Node 4 if the assumption of your rationality is already broken?"
  *   **Concept:** This is the **Epistemic Break**. BI relies on *Common Knowledge of Rationality (CKR)*. If play reaches Node 4, CKR is false. The theory cannot guide you there because the world it describes no longer exists.

  **Phase 3: The Fight (Contested)**
  *   **Draw the line clearly on the board:**
      *   **Left Side (Settled):** The math is correct. *If* CKR holds, Take-at-1 is the only solution.
      *   **Right Side (Contested):** What does the failure mean?
          1.  **The Aumann View (Normative):** Rationality *is* BI. The students failed to be rational because they lacked Common Knowledge. They should have taken at 1. The failure is in the *epistemic conditions*, not the logic.
          2.  **The Binmore View (Descriptive):** The model is misspecified. Humans have social preferences (altruism, fairness) or bounded rationality. "Rationality" shouldn't be defined by BI if BI leads to Pareto-inferior outcomes (200 tokens vs 7200 tokens).
          3.  **The Learning View:** If we played this 50 times, would you converge to Node 1? (Usually yes, but only with partner matching). Does this mean BI is a *limit* concept rather than a one-shot rule?
  *   **Instruction:** "When you write your papers, do not say 'BI is wrong.' Say 'BI relies on CKR, and CKR is fragile.' Do not say 'Students are irrational.' Say 'Student utility functions likely include fairness weights not captured in the token payoff.'"

  ---

  #### **5. Limitations: What You Must Supply by Fiat**
  Be honest with them about what the classroom *cannot* reproduce.

  1.  **True Common Knowledge:** In this room, you *suspect* others are rational. In the formal model, it is an axiom. You cannot simulate an axiom with human psychology. I am telling you that the failure of BI in this room does not disprove the theorem; it disproves the applicability of the *assumptions* to this room.
  2.  **Risk Neutrality:** The lottery creates risk aversion. 6400 tokens is a "bird in the bush" for P2 at Node 6, but P1 at Node 1 faces the risk that P2 defects. Real money (or repeated play) often pushes behavior closer to BI, but one-shot classroom games favor "niceness."
  3.  **The Counterfactual:** BI relies on reasoning about nodes that are *never reached* (e.g., "What would P2 do at Node 5?"). In this game, if P1 takes at Node 1, we never know what P2 would have done. In the formal theory, that counterfactual must be fixed. In reality, it's undefined.

  ### **Instructor Cheat Sheet: Key Moments to Highlight**
  *   **If a pair reaches Node 6:** "This pair achieved the Social Optimum but violated the Nash Equilibrium. Is that irrational?"
  *   **If P1 Takes at Node 1:** "This player trusted the math more than their partner. They secured 200 tokens. They likely finished near the bottom of the class lottery standings. Was that rational?"
  *   **If Pre-Commitment differed from Play:** "This is the 'Time Inconsistency' of rationality. You planned to be a maximizer, but in the moment, you became a cooperator."

  ### **Summary of "Settled vs. Contested" for the Board**
  | **Settled Consensus** | **Live Debate (Aumann vs. Binmore et al.)** |
  | :--- | :--- |
  | BI is the unique Subgame Perfect Equilibrium. | Does SPNE define *rationality*, or just *consistency*? |
  | One-shot human play deviates significantly from BI. | Is the deviation "noise/error" or "evidence of different preferences"? |
  | CKR is a necessary condition for BI. | Is CKR ever plausible in real interactions? |
  | Repetition/learning often drives play toward BI. | Does this vindicate BI as a normative goal, or show it's only valid in specific institutional settings? |

  This plan ensures they feel the tension of the paradox (wanting to cooperate vs. knowing they should defect) before you ever write down a formal definition of "Common Knowledge."
