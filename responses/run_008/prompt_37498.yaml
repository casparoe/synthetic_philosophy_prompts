  *   **Verdict:** **Not Wrong.**
  *   **Why:** Marcus distinguishes between *causing* harm and *being present* for harm. Since the host ordered the wings regardless and the trash will be filled regardless, Marcus eating a plate changes the outcome by zero. This aligns with his **Voting** and **Volunteer** takes: if your action doesn't change the result, you aren't morally on the hook. He might call it "gluttonous" or "unhealthy," but not morally *wrong*.

  **2. Pig Share #20 (The Threshold Case)**
  *   **Verdict:** **Wrong. (And worse than the burger).**
  *   **Why:** In the burger case, Marcus admits his impact is tiny ("small wrong"). Here, he is the **trigger**. If he walks away, zero pigs die. If he signs, 20 pigs die. He has total causal efficacy. This is the opposite of the Voting case. He isn't just adding to a pile; he is building the pile. He will view this as bearing direct responsibility for the deaths of 20 animals, which outweighs the "small wrong" of a single fast-food burger.

  **3. Pig Share #26 (The Surplus Case)**
  *   **Verdict:** **Not Wrong.**
  *   **Why:** This is the critical test. The 30 pigs are already contracted. The harm (the deaths) is fixed. By signing up, he prevents economic waste for the farmer but does not cause an extra death. This aligns with the **Wings** and **Voting** cases: his choice does not increase the total amount of "bad" in the world. Even though he is participating in the meat system (like the burger), he isn't *expanding* it. Marcus cares about *marginal impact*, not just purity.

  **4. Medical Fund (The Surplus Good Case)**
  *   **Verdict:** **Not Wrong (but acted like a jerk).**
  *   **Why:** Marcus consistently rules that you are not obligated to provide a *benefit* if your contribution won't change the outcome (see: **Volunteer Day**). Since the bills are already paid, the guy's $20 changes nothing. However, Marcus will likely distinguish between "moral wrong" and "social rudeness." Skipping the volunteer day was fine because it was anonymous/optional. Stiffing a coworker is personal. He'll call the guy a "jerk" or "cheap," but won't say he committed a moral sin like he did with the well-waterers.

  ---

  ### 2. The Rule He's Actually Using

  Marcus isn't running a "Universalizability" rule (i.e., "What if everyone did that?"). If he were, he'd say skipping voting is wrong (because if everyone skipped, democracy dies). He isn't running a strict "Complicity" rule either (i.e., "Don't touch bad things"), or he'd say Pig #26 is wrong (because it's still meat).

  **His Actual Rule:** **"The Asymmetric Marginal Impact Rule."**
  *   **For Harm (Bad Stuff):** You are responsible if your action *adds* to the total harm, even slightly. (Burger, Well, Solvent).
  *   **For Benefit (Good Stuff):** You are *not* responsible if your action fails to *prevent* harm or create good, provided your individual effort wouldn't have changed the outcome. (Voting, Volunteer, Medical Fund).
  *   **The Exception:** If you are the **Trigger** (Pig #20), you are responsible for the whole outcome, because your omission *causes* the harm.

  In short: **He is strict about doing harm, but lenient about failing to do good, unless you hold the keys to the dam.**

  ---

  ### 3. Alternative Rules (The Rivals)

  There are two other rules that fit his history almost as well. You need to know these because he might try to pivot to them if you corner him.

  **Rival A: The "Clean Hands" Rule**
  *   **Logic:** It's about keeping your own soul clean, not about the math.
  *   **Fit:** Explains the Burger, Well, and Solvent cases (don't get your hands dirty). Explains Voting/Volunteer (not doing anything dirty).
  *   **Weakness:** It struggles with Pig #26. If it's about clean hands, eating the meat is still "dirty" even if the pig was already dead. If he says Pig #26 is *Not Wrong*, this rule dies.

  **Rival B: The "Team Sport" Rule**
  *   **Logic:** You are responsible for what your "team" does.
  *   **Fit:** Explains Solvent/Well (you were on the team of polluters). Explains Burger (you're on the team of meat-eaters). Explains Voting (your team wins anyway, or loses anyway).
  *   **Weakness:** It struggles with the Medical Fund. The "team" (coworkers) succeeded, but one guy didn't play. If it's about team success, he should be fine. If it's about team contribution, he's wrong. Marcus says "Not Wrong," which implies individual impact matters more than team membership.

  ---

  ### 4. Where the Rules Disagree (The Crack in the Armor)

  The rules diverge on **Fixed-Supply Harm.**
  *   **Marginal Impact Rule:** Says Pig #26 is **Not Wrong** (no extra death).
  *   **Clean Hands Rule:** Says Pig #26 is **Wrong** (you still ate a dead pig).
  *   **Team Sport Rule:** Says Pig #26 is **Wrong** (you're still on the meat-eating team).

  Marcus's history suggests he will side with **Marginal Impact** (like the Voting case). But his Burger take suggests he might side with **Clean Hands**. This is the contradiction you can exploit.

  ---

  ### 5. The BBQ Trap (The Killer Question)

  Don't ask him about politics or the environment; he has rehearsed answers for those. Ask him about **Thrift Stores**.

  Wait until you're eating, and casually ask:

  > *"Hey Marcus, random ethics question. Say I go to a thrift store and buy a fur coat. The original owner is dead, so no money goes to the fur industry. No new animals die because of me. But I'm still walking around wearing fur. Is that wrong?"*

  **Why this settles it:**
  *   **If he says "Not Wrong":** He admits his rule is purely about **Causal Impact**. You can then hit him with: *"So if I buy a burger, but the restaurant throws away one less unsold burger because I bought it, is that okay?"* (This forces him to admit the Burger take was inconsistent).
  *   **If he says "Wrong":** He admits his rule is about **Complicity/Symbolism**. You can then hit him with: *"But you said skipping the vote was fine, even if that symbolizes apathy. Why does the symbol matter for the coat but not the vote?"*

  **The Win Condition:**
  If he says the coat is **Wrong**, press him on **Pig #26**. If he says Pig #26 is **Not Wrong**, he has admitted that *impact* matters more than *purity*. If he admits impact matters more than purity, you ask him why the **Burger** is wrong when the impact of one burger is statistically zero.

  That is the loop that steamrolls him. Good luck.
