answer: |-
  The collapse of footbinding in late Qing China offers a rare, sharp historical lens through which to examine how deeply entrenched social practices end. For a millennium, footbinding survived imperial bans and Confucian moralizing, only to vanish within a single generation following the formation of anti-footbinding societies in the 1890s. This episode serves as a critical test case for two dominant theories of moral change: Kwame Anthony Appiah's honor-based account and Gerry Mackie's convention-based account.

  ### Mapping the Episode: Appiah's Honor Code

  For Appiah, moral change is driven not by rational argument but by shifts in *honor* and *shame*. Practices end when they cease to confer status and instead become sources of dishonor within a community's internalized code.

  *   **The Players:** The relevant agents are the Han elite families (who practiced binding) and the reformist intellectuals (who redefined the honor code).
  *   **Incentives and Self-Conception:** For centuries, bound feet signaled refinement, chastity, and elite status. The incentive was social distinction. Appiah argues that in the 1890s, the self-conception of the Chinese elite shifted from seeing themselves as the "Middle Kingdom" (civilized center) to a nation vulnerable to colonial domination.
  *   **The Mechanism of Change:** The collapse was driven by **national humiliation**. As China suffered defeats (Sino-Japanese War, 1894–95), reformers successfully reframed footbinding not as a mark of refinement, but as a mark of barbarism that weakened the nation (by crippling women who bore sons).
  *   **The Double Pledge:** In Appiah's view, the pledge was a public ritual of *honor*. By signing, families publicly dissociated themselves from the "shameful" old ways and aligned with the "honorable" new national identity.
  *   **Timing:** The timing is explained by the exogenous shock of imperialist aggression. The honor code shifted only when China's standing among industrialized powers became the primary metric of national worth.

  ### Mapping the Episode: Mackie's Convention Account

  For Mackie, footbinding was a **coordination convention**, specifically a self-enforcing equilibrium in the marriage market. It ended not because it became shameful, but because the interdependent expectations holding it in place were dissolved.

  *   **The Players:** The players are parents acting as rational agents within a marriage market.
  *   **Incentives:** Parents bound daughters' feet to maximize marriageability. Even if parents disliked the practice, the cost of non-compliance (an unmarriageable daughter) was too high. This created a prisoner's dilemma where individual moral preference was irrelevant.
  *   **The Mechanism of Change:** The practice fell when **coordinated pledges** allowed families to exit the equilibrium simultaneously.
  *   **The Double Pledge:** This is the smoking gun for Mackie. The pledge had two parts: (1) I will not bind my daughter, and (2) I will not allow my son to marry a bound woman. The first half is useless without the second. The pledge created a sub-market where unbound feet were guaranteed value, solving the coordination problem.
  *   **Timing:** The timing reflects the moment a critical mass of reformers could organize these societies. National humiliation provided the *motivation* to organize, but the *mechanism* of collapse was the contractual assurance of the pledge.

  ### Comparative Analysis of Salient Facts

  **1. The Double Pledge**
  *   **Mackie:** The pledge is the *causal engine*. Without the guarantee that sons would accept unbound women, the honor shift would have resulted in tragic individual sacrifices (unmarriageable daughters) rather than systemic collapse.
  *   **Appiah:** The pledge is a *symbolic performance*. It solidifies the new honor code, but the primary driver is the internalized shame.
  *   **Verdict:** The specific structure of the pledge (linking daughters' feet to sons' marriages) strongly favors Mackie. It addresses the structural interdependence that honor alone cannot fix.

  **2. Timing and the Failure of Bans**
  *   **Appiah:** Explains why bans failed earlier (the state could not legislate honor) and why the 1890s succeeded (honor shifted due to national crisis).
  *   **Mackie:** Explains why bans failed (legislation cannot change payoff matrices without enforcement/coordination) and why the 1890s succeeded (civil society created the coordination mechanism the state lacked).
  *   **Verdict:** Both explain the failure of bans, but Mackie better explains the *speed* of the collapse. Once the coordination broke, the equilibrium unraveled rapidly (within a generation), consistent with tipping-point models.

  **3. National Humiliation vs. Marriage Prospects**
  *   **Appiah:** National humiliation is the *primary cause*. The practice ended because it threatened the honor of the *race*.
  *   **Mackie:** National humiliation is an *exogenous shock* that altered the payoff matrix. It made the cost of the convention (national weakness) visible, motivating the search for a new equilibrium.
  *   **Verdict:** Appiah captures the *emotional valence* of the reform movement better. Reformers spoke the language of shame, not game theory. However, Mackie captures the *practical constraint*.

  ### Silences and Limitations

  **Where Appiah is Silent:**
  Appiah's account struggles to explain why the honor shift didn't produce a slower, more uneven decline. If shame were the sole driver, wealthy, cosmopolitan families should have stopped binding immediately upon feeling shame, regardless of marriage markets. Yet, the practice persisted until the *network* of pledges existed. Appiah underplays the **collective action problem**. He assumes that once a practice is deemed dishonorable, social pressure will enforce the ban. But in footbinding, the social pressure *was* the practice.

  **Where Mackie is Silent:**
  Mackie's account is silent on the **origin of the preference change**. Game theory explains how to exit an equilibrium, not why players suddenly want to. Why did the coordination happen in the 1890s and not the 1790s? Mackie treats the desire to stop binding as exogenous. He cannot fully account for the *moral fervor* or the specific rhetoric of "national salvation" that fueled the societies. Pure coordination does not explain why the new equilibrium was morally charged.

  ### The Role of Moral Argument

  Both accounts agree on a crucial negative finding: **Moral argument *as such* is ineffective.** For centuries, Confucian moralists argued footbinding was unnatural or cruel. This failed.
  *   For **Appiah**, argument fails until it is attached to *honor*. The reformers succeeded not because they proved binding was painful, but because they proved it was *shameful*.
  *   For **Mackie**, argument fails until it is attached to *coordination*. The reformers succeeded not because they persuaded parents binding was wrong, but because they assured parents binding was no longer *necessary*.

  The case shows that moral revolutions are rarely driven by philosophical persuasion alone. Argument requires a vehicle—either a shift in social status (Appiah) or a shift in strategic expectations (Mackie).

  ### Verdict: Rival Explanations or Complementary Layers?

  While Appiah and Mackie are often presented as rivals, the footbinding case suggests they describe **complementary layers of a single complex mechanism**, though Mackie provides the more robust explanation for the *collapse itself*.

  They are not merely competing descriptions of one mechanism because they identify different causal bottlenecks. Appiah identifies the **motivational bottleneck** (why want to change?), while Mackie identifies the **structural bottleneck** (how *can* one change?).

  However, if forced to choose which account better explains the **episode of collapse**, the evidence favors **Mackie's convention account**.

  **Evidence for Mackie:**
  The specific tactic of the **double pledge** is uniquely predicted by the convention account. If Appiah were solely correct, the primary tactic would have been public shaming campaigns or legislation to punish binders. Instead, the reformers focused on creating a *market guarantee*. The fact that the movement organized around *marriage contracts* indicates the participants understood the problem as one of interdependent expectations, not just moral stigma.

  **Counterfactual:**
  If Appiah's honor thesis were the sole driver, we would expect to see a gradual erosion of the practice starting with the highest elites (who care most about honor) spreading downward, even without formal pledges. We might see families binding feet in secret but feeling shame. Instead, the historical record shows a rapid, coordinated abandonment linked directly to membership in anti-footbinding societies.
  Conversely, if Mackie were solely right, the movement could have been purely pragmatic (e.g., "unbound feet are more modern/efficient"). The fact that the rhetoric was saturated with *shame* and *national honor* shows Appiah is necessary to explain the *fuel*, but Mackie explains the *engine*.

  **Conclusion:**
  The collapse of footbinding demonstrates that moral revolutions require both a **shift in meaning** (Appiah) and a **solution to the coordination problem** (Mackie). However, the *failure* of centuries of moral criticism and imperial bans, contrasted with the *success* of the double pledge, indicates that the structural constraint was the binding factor. Honor provided the reason to break the convention, but the convention account explains why the break was possible at all. Therefore, while Appiah explains the *spirit* of the reform, Mackie explains the *letter* of its success. The case ultimately favors Mackie's account as the necessary condition for the rapid behavioral change, with Appiah's honor dynamics serving as the catalytic context that made the coordination desirable.
