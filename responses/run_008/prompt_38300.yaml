answer: |-
  Here is a design for your 75-minute seminar. I have worn my "experimenter" hat to ensure the mechanics work in a room with 18 polite undergraduates, and my "theorist" hat to ensure the maths holds up during the debrief.

  ### Executive Summary: The Verdict on Your Ideas

  1.  **The Auction:** I advise **against** a second-price auction for this specific learning goal. While theoretically incentive-compatible, explaining *why* bidding true value is a dominant strategy takes 10–15 minutes of game theory digression that eats into your debrief. With "nice" students, auctions often collapse into collusion or polite underbidding.
      *   **Recommendation:** Use a **Random Price Mechanism (RPM)**. Students write down the maximum they would pay. You draw a random price from a hat. If their bid is higher than the drawn price, they play and pay the *drawn price*. This is incentive-compatible (like a Becker-DeGroot-Marschak mechanism) but requires zero game theory to explain. It isolates *valuation* from *strategy*.
  2.  **The Syndicate:** Keep this. It is the strongest way to demonstrate the difference between *ensemble averages* (what the maths says) and *time averages* (what the human experiences).
  3.  **The Charity Variant:** Do not run this as a full game round. It introduces **social preference** as a confounding variable. If bids go up, is it because risk aversion changed, or because they care about the cause? Save this for the discussion phase to talk about **framing**.

  ---

  ### 1. Materials List

  *   **18 Printed "Valuation Sheets"** (A5 half-sheets).
  *   **18 Printed "Syndicate Record Sheets"** (One per group).
  *   **1 Large Coin** (Visible to the back row).
  *   **1 Bag of Chocolate Coins** (Approx. 100 coins).
  *   **1 "Bank" Box** (To hold the chocolate coins).
  *   **1 Hat/Bag** containing 20 folded slips of paper numbered £1 to £20 (for the Random Price Mechanism).
  *   **Whiteboard & Markers.**

  ---

  ### 2. Minute-by-Minute Timeline (75 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–05** | **Intro & Setup** | Briefly state the game rules. Arrange desks into 6 groups of 3 (for later). |
  | **05–20** | **Round 1: Individual Valuation** | Students complete Valuation Sheets. You draw prices. 3–4 students play live. |
  | **20–35** | **Round 2: The Syndicate** | Groups pool "capital". Play 5 rounds of the game. Split winnings. |
  | **35–45** | **Round 3: The Charity Poll** | Quick show-of-hands variant. No playing. |
  | **45–75** | **The Debrief** | Map results to theory. Crucial section. |

  ---

  ### 3. Round Rules & Mechanics

  #### Round 1: Individual Valuation (The "Feel")
  **The Game:** You flip a coin. Heads = game continues, pot doubles. Tails = game ends, you win the pot.
  **The Cap:** To make this playable, the House Bankroll is capped at **£256** (8 consecutive heads).
  **The Maths:** With this cap, the **Expected Value (EV)** is exactly **£8**. (Each of the 8 possible outcomes contributes £1 to the expectation).
  **The Mechanism:**
  1.  Hand out Valuation Sheets.
  2.  Instruction: *"Write down the maximum amount of chocolate coins you would pay to play this game once."*
  3.  Collect sheets.
  4.  Draw a random price from the Hat (e.g., £3).
  5.  **Rule:** Anyone who bid £3 or more *must* play and pays £3. Anyone who bid less does not play.
  6.  Play the game 3 or 4 times with the "winning" bidders so the class sees the actual volatility.

  #### Round 2: The Syndicate (Risk Pooling)
  **Setup:** Use the 6 groups of 3 students.
  **The Pitch:** *"You are now an investment fund. You have a collective budget of £30 (10 coins each). You can buy 5 tickets for the St. Petersburg game at £2 each."*
  **Action:** The group must unanimously agree to buy or not buy. If they buy, you play the coin flip 5 times.
  **Payout:** Total winnings are added to the group pot and split equally.
  **Goal:** This demonstrates the **Law of Large Numbers**. The variance drops significantly when played 5 times vs 1 time.

  #### Round 3: The Charity Poll (Framing)
  **The Pitch:** *"Same game, £2 entry. But all winnings go to the 'End of Term Pizza Fund' rather than you personally."*
  **Action:** Show of hands. *"Who would play now?"*
  **Goal:** Highlight how **Framing** alters risk perception.

  ---

  ### 4. The Debrief: Mapping Activity to Theory

  This is where you earn your pay. Do not rush this. Use the whiteboard to record their actual bids from Round 1. You will likely see a cluster between £1 and £4, despite the £8 EV.

  **A. The Gap (EV vs. WTP)**
  *   **Observation:** "The maths says this ticket is worth £8. Most of you bid £2. Why?"
  *   **Concept:** **Risk Aversion**.
  *   **Definition for Notes:** *Risk Aversion is a preference for a sure outcome over a gamble with higher or equal expected value, due to the diminishing marginal utility of wealth.*
  *   **Point:** If money had linear utility, you'd bid £8. Because the utility of the 5th chocolate coin is less than the 1st, you discount the unlikely high payouts.

  **B. Bernoulli's Fix**
  *   **Observation:** "Bernoulli suggested we don't maximise expected money, but expected *utility*."
  *   **Concept:** **Diminishing Marginal Utility**.
  *   **Definition for Notes:** *Diminishing Marginal Utility is the principle that the additional satisfaction (utility) gained from consuming one more unit of a good decreases as the total amount consumed increases.*
  *   **Point:** If Utility = Log(Wealth), the infinite series converges. The paradox disappears.

  **C. The Cap (Realism vs. Theory)**
  *   **Observation:** "I capped the bank at £256. Did that change your mind?"
  *   **Concept:** **Counterparty Risk**.
  *   **Point:** In the real world, no casino has infinite money. The "Paradox" relies on an impossible promise. By capping it, we turned a philosophical paradox into a standard risk problem.
  *   **Discussion:** Was the original paradox ever a "real" choice? Or just a maths puzzle?

  **D. The Syndicate (Ergodicity)**
  *   **Observation:** "Did groups feel more comfortable buying 5 tickets than individuals felt buying 1?"
  *   **Concept:** **Ensemble vs. Time Average** (keep this simple).
  *   **Point:** The EV of £8 is an *ensemble average* (what happens if 1 million people play once). Your life is a *time average* (what happens if you play 1 million times). The Syndicate mimics the time average.
  *   **Takeaway:** Rationality depends on whether you can repeat the bet.

  **E. The Charity Poll (Framing)**
  *   **Observation:** "Did more hands go up for the Pizza Fund?"
  *   **Concept:** **Framing Effect**.
  *   **Definition for Notes:** *The Framing Effect is a cognitive bias where people decide on options based on whether they are presented in a positive or negative context, rather than on pure objective data.*
  *   **Point:** If utility is social, not just financial, the calculation changes. This shows that "Rational Choice" depends on what variables you put in the utility function.

  ---

  ### 5. What Will Predictably Go Wrong (And How to Fix It)

  **1. The "Joker" Bidder**
  *   **Problem:** One student bids £50 to be funny or to "break" the experiment.
  *   **Fix:** Before collecting sheets, say: *"Bids are binding. If the random price is £10 and you bid £50, you owe me £10. Do not bid money you do not have."* The threat of actual payment (in chocolate) usually curbs silliness. If it happens, exclude them from the average calculation during the debrief as an "outlier".

  **2. The "Polite" Underbidders**
  *   **Problem:** Because your students are nice, they might bid £0.50 because they feel bad taking the department's chocolate.
  *   **Fix:** Frame the chocolate as *their* endowment. *"You start with 10 coins. This is yours. Keep it or gamble it."* Loss aversion is stronger than gain seeking.

  **3. The "Maths Whiz"**
  *   **Problem:** One student calculates the £8 EV, bids £8, and loudly explains why everyone else is irrational.
  *   **Fix:** Validate them, but pivot. *"You are maximising Expected Value. Everyone else is maximising Expected Utility. Both are rational under different axioms."* This is a teachable moment, not a disruption.

  **4. The Coin Takes Too Long**
  *   **Problem:** You get 7 heads in a row. The class gets bored waiting for the 8th flip.
  *   **Fix:** Pre-calculate a list of 20 random game outcomes before the seminar. If a game drags on, say *"In the interest of time, I will simulate the remaining flips using this pre-generated sequence."*

  ---

  ### 6. What You Cannot Teach (The "Lecture" Bit)

  Be honest with them. There are two things this classroom activity cannot reproduce, and you must supply these in the final 5 minutes of lecture.

  1.  **True Wealth Effects:** Chocolate coins do not pay rent. The St. Petersburg paradox is profound because it involves *life-changing* sums. With £256 caps, we are testing "pocket money risk", not "ruin risk". Tell them: *"In the real world, the utility of £1 million is not just 'more chocolate', it is 'freedom'. That non-linearity is steeper than this room can show."*
  2.  **The Infinite Tail:** We capped the game. The true paradox relies on the tail going to infinity. You must explain that by capping it, we "solved" the paradox mathematically, but we also changed the game. The philosophical question remains: *Is a bet with infinite EV but near-zero probability of payout ever rational?*

  ---

  ### 7. Glossary for Analytical Writing

  *Include this on a handout or slide for them to copy.*

  *   **Expected Value (EV):** The sum of all possible outcomes, each weighted by its probability of occurrence.
  *   **Expected Utility:** The sum of the utility (subjective value) of all possible outcomes, each weighted by its probability, used to model decision-making under risk.
  *   **Diminishing Marginal Utility:** The economic principle that the additional satisfaction gained from an extra unit of wealth decreases as total wealth increases.
  *   **Risk Aversion:** The tendency of an agent to prefer a certain outcome over a uncertain gamble with a higher or equal expected value.
  *   **Framing Effect:** A cognitive bias where the presentation of information (e.g., as a loss vs. a gain, or for self vs. charity) influences decision-making.
  *   **Incentive Compatibility:** A property of a mechanism where participants achieve the best outcome by honestly revealing their private information (such as their true valuation).

  ---

  ### Final Advice for the "Nice Student" Problem

  Since your cohort cooperated in the Prisoner's Dilemma out of politeness, they are likely **social utility maximisers**, not purely selfish ones.

  In the debrief, lean into this. Don't treat their low bids as "irrational". Treat them as "rationally accounting for social context". If they bid low because they don't want to take the professor's chocolate, that is a valid utility constraint.

  **Your closing line:** *"Rational Choice Theory doesn't tell you what to value. It only tells you how to be consistent once you've decided what you value. If you value 'not looking greedy' higher than 'chocolate', bidding £1 is perfectly rational."*

  This validates their behaviour while teaching the theory. Good luck with the seminar.
