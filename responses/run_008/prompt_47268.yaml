      *   **Move 2 (Marcus):** Confusion between "is it real" vs. "can we prove it." It's an equilibrium argument. Even low probability of a hostile actor makes silence dominant. Silence *is* the evidence (Fermi paradox).
          *   *Analysis:* Marcus is applying game theory logic (Nash equilibrium, dominant strategies). He turns Dev's evidence (silence) into support for the theory. This is a classic "unfalsifiable" defense but logically consistent within game theory.
          *   *Verdict:* Logically sound within the model, but risks being unfalsifiable.

      *   **Move 3 (Dev):** Strikes are broadcasts. Launch points can be traced. Firing reveals you. Deterrence in the books relies on this, contradicting the "strike first" logic.
          *   *Analysis:* Dev attacks the *stability* of the equilibrium. If attacking reveals you, it's not a clean sweep. He points out an internal inconsistency in the fiction's logic regarding deterrence vs. pre-emption.
          *   *Verdict:* Very strong point regarding the mechanics of interstellar warfare.

      *   **Move 4 (Marcus):** Hiding isn't invisibility, it's not looking like a *threat*. Biosignatures $\neq$ Threat. Technological signals = Threat. Retaliation is impossible due to light-speed lag/dead civilizations.
