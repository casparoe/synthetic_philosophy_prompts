prompt: |-
  Hi! I'm a PhD student in biostatistics, and for the last few years I've been the "stats person" for a mid-sized regional water utility (long story — started as a side gig during my masters and now I can't get rid of them). The single most common question I get is some version of: "this number has been stable for X years, can we assume it stays that way?" — for sizing spare part inventories, deciding whether to keep a monitoring program, setting maintenance budgets. And I've realized I don't have a principled way to answer it; I basically vibe-check based on how long the stable period was and whether anyone in the room looks nervous.

  I've read enough philosophy of induction to know the rough shape of the problem — Hume obviously, and Goodman's grue thing, where whether a regularity projects depends on which predicate you describe it with, not just on how many confirming instances you have. Goodman's own answer seems to be something about how "entrenched" the predicate is, but entrenchment is defined by the predicate's history of successful past projections, and from where I sit that's circular-ish: we have exactly one past, one history, no control group. So what I want is to turn all this (plus whatever else is actually usable — reference class stuff, whether you have a mechanism or just a pattern, extrapolation vs interpolation) into a procedure that two utility engineers and I can run in an hour-long meeting, per forecast. Concretely:

  - an ordered list of questions, each answerable by a domain engineer with no stats training,
  - what counts as a sufficient answer at each step,
  - the conditions under which the procedure outputs "do not extrapolate, budget for the uncertainty instead" versus "extrapolate, but state a horizon",
  - and the points where it has to admit it can't settle the question and hands the decision back to a human — flag those honestly, don't bury them.

  The grue-flavored problem I keep actually hitting: a lot of our historical regularities are indexed to categories that were created at a particular date — meter types, pipe materials introduced by code changes, "accounts opened before the 2009 billing software migration." So the regularity is only ever observed on one side of a time boundary, and the category itself was drawn at that boundary. I want the procedure to include a test for this that an engineer can apply themselves (some red-flag questions about how the categories were constructed and whether the cut date has anything to do with the outcome), not just a warning to "watch out for grue-like predicates."

  Then run it on three cases: (1) pump failures — 15 years of stable rates, known failure mechanism (seal wear); (2) household demand by meter generation, where the newest generation was only rolled out 2 years ago, so we have almost no data on how the observed pattern behaves as those meters age; (3) the one where I actually disagree with the engineers — they want to keep extrapolating a 20-year seasonal demand pattern even though the region's housing stock has been turning over fast, and I suspect the procedure should tell us to stop, but run it honestly even if it sides with them.

  Also tell me what the procedure can't do — I assume it says nothing about genuinely unprecedented events, but if there are other failure modes I haven't listed, I'd rather find out now than in the next budget meeting. And if some step is basically a judgment call dressed up as a question with a checklist feel, say so; the director has to sign off on whatever we produce and I don't want to hand her false precision.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **User:** PhD student in biostatistics, acting as the "stats person" for a regional water utility.
      *   **Problem:** The "Induction Problem" in practice. Stakeholders ask: "This number has been stable for $X$ years, can we assume it stays that way?"
      *   **Current State:** Relying on "vibe-checks."
      *   **Goal:** A principled, actionable procedure (checklist/meeting protocol) for engineers and the statistician to decide whether to extrapolate stability or budget for uncertainty.
      *   **Constraints:**
          *   Must be runnable in an hour.
          *   Questions answerable by domain engineers (no stats training).
          *   Must output specific decisions (Extrapolate w/ horizon vs. Don't Extrapolate).
          *   Must explicitly flag uncertainty/judgment calls (no false precision).
          *   Must address "Grue-like" predicates (categories defined by time boundaries).
          *   Must run on three specific cases (Pump failures, New meters, Seasonal demand).
          *   Must list limitations/failure modes of the procedure itself.

  2.  **Theoretical Grounding (Briefly):**

      *   *Hume:* Induction isn't logically valid. We need pragmatic justification.
      *   *Goodman:* "Grue" problem. Predicates matter. Entrenchment is key, but circular. We need to check *why* a category exists.
      *   *Reference Class:* Are we comparing like with like?
      *   *Mechanism vs. Pattern:* Causal understanding supports extrapolation better than mere correlation.
      *   *Stationarity:* Is the underlying data generating process stable?

  3.  **Drafting the Procedure (The "Stability Extrapolation Protocol" - SEP):**

      *   *Structure:* Needs to be linear, decision-tree-like but conversational.
      *   *Step 1: Define the Predicate (The "Grue" Check).* This is crucial based on the prompt. We need to ask how the category was formed.
      *   *Step 2: Mechanism Check.* Is there a physical reason for stability?
      *   *Step 3: Reference Class/Context.* Has the environment changed?
      *   *Step 4: Horizon Setting.* If yes, how far?
      *   *Decision Logic:* Clear criteria for Go/No-Go.

      *Refining the "Grue" Check:* Goodman's issue is that "observed before time $T$" is part of the definition. In utility terms, this looks like "Meters installed before 2010." If the definition relies on the *start* of the observation period, it's suspicious.
      *   *Question:* "Was this category defined by a change in the system, or by a change in how we measure/name it?"
      *   *Question:* "If we started this project 5 years later, would this group still exist as a distinct group?"

      *Refining the Mechanism Check:* Biostats background helps here. Survival analysis logic. Wear-out vs. Random failure.
      *   *Question:* "What physically breaks?"

      *Refining the Decision:*
      *   *Green Light:* Mechanism known + Category stable + Environment stable.
      *   *Yellow Light:* Mechanism unknown but long history + Environment stable. (Extrapolate with short horizon).
      *   *Red Light:* Category defined by time boundary + Mechanism unknown + Environment changing. (Budget for uncertainty).

  4.  **Developing the Three Cases:**

      *   *Case 1: Pump Failures (Seal Wear).*
          *   Mechanism: Physical wear (strong).
          *   Category: "Pumps" (likely stable).
          *   Environment: Operational conditions stable?
          *   Verdict: Extrapolate.
      *   *Case 2: New Meter Generation.*
          *   Mechanism: Unknown aging (weak).
          *   Category: "Gen 3 Meters" (defined by rollout date - Grue risk).
          *   Data: Only 2 years (infant mortality phase?).
          *   Verdict: Do not extrapolate long-term. Budget for uncertainty.
      *   *Case 3: Seasonal Demand (Housing Turnover).*
          *   Mechanism: Human behavior (weak/variable).
          *   Category: "Regional Demand" (aggregated).
          *   Environment: Housing stock changing (covariate shift).
          *   User's intuition: Stop extrapolating.
          *   Procedure test: Does the procedure catch the housing turnover? Yes, if Step 3 (Context) is rigorous.
          *   *Self-Correction:* The prompt asks to run it *honestly* even if it sides with engineers. I need to make sure the procedure doesn't just validate my bias. If the housing turnover hasn't *yet* impacted the aggregate signal, the procedure might say "Continue but monitor." I need to be careful here to reflect the tension. Actually, if the housing stock turnover is *fast*, the "Reference Class" is changing. The procedure should flag this.

  5.  **Addressing Limitations & "False Precision":**

      *   The procedure cannot predict black swans.
      *   It cannot resolve genuine disagreement (it flags it for the Director).
      *   It relies on honest answers (GIGO).
      *   It treats "mechanism" as binary when it's often a spectrum.

  6.  **Writing the Response:**

      *   *Tone:* Professional, peer-to-peer (PhD to PhD), practical, slightly philosophical but grounded.
      *   *Structure:*
          1.  Intro (acknowledging the Hume/Goodman context).
          2.  The Protocol (The "Stability Extrapolation Protocol").
          3.  Decision Matrix.
          4.  Running the Cases.
          5.  Limitations/Failure Modes.
      *   *Key Feature:* Explicitly marking the "Judgment Call" steps.

  7.  **Refining the "Grue" Test:**
      *   I need to make sure the engineers understand this without knowing Goodman.
      *   Phrasing: "The Definition Test."
      *   Q: "Does the definition of this group depend on a calendar date?"
      *   Q: "If we had started collecting data 10 years later, would this group still be identifiable?"

  8.  **Refining the Decision Logic:**
      *   Need to distinguish between "Extrapolate" (use the mean) and "Extrapolate with Horizon" (use the mean but only for 1 year) vs "Budget for Uncertainty" (use a wide CI or scenario planning).

  9.  **Final Review against Constraints:**
      *   Hour-long meeting? Yes, checklist is short.
      *   No stats training needed? Yes, language is engineering-focused.
      *   Flags judgment calls? Yes, will add "⚠️" icons.
