      *   Limitations listed? Yes.

  *(Self-Correction during drafting Case 3)*: The prompt says "I suspect the procedure should tell us to stop, but run it honestly even if it sides with them." This implies I should not rig the procedure to guarantee my outcome. If the engineers argue that housing turnover *doesn't* affect water use per capita (e.g., new houses are same size/efficiency), the procedure might allow extrapolation. I must present the procedure as neutral. However, given "fast turnover," the *Reference Class* is shifting. I will write the procedure to flag this as a risk, leading to a "Short Horizon" rather than a hard "Stop," unless the mechanism is clearly broken. This honors the "honest run" constraint.

  *(Final Polish)*: Ensure the distinction between "Entrenchment" (Goodman) and "Mechanism" is clear. Entrenchment is linguistic/historical; Mechanism is physical. In engineering, Mechanism trumps Entrenchment. I will weight Mechanism heavily.

  Let's assemble the "Stability Extrapolation Protocol (SEP)."

  *   *Step 1: The Predicate Audit (Goodman Check).*
  *   *Step 2: The Mechanism Audit (Causal Check).*
  *   *Step 3: The Context Audit (Stationarity Check).*
  *   *Step 4: The Horizon Decision.*

  Okay, ready to write.
answer: |-
  This is a classic problem of *external validity* dressed up as budget planning. You are asking for a operationalization of the "Problem of Induction" that doesn't require a philosophy degree to execute.

  Goodman's "entrenchment" is indeed circular if you only look at past success. In engineering, we break that circle by appealing to **mechanism** and **invariance**. If a regularity holds because of a physical law (wear, gravity, flow dynamics), it projects better than if it holds because of a social convention (billing codes, policy thresholds).

  Below is the **Stability Extrapolation Protocol (SEP)**. It is designed to be printed out and filled in during a 60-minute meeting. It forces the "Grue" problem into explicit questions about category definition without using the word "Grue."

  ---

  # The Stability Extrapolation Protocol (SEP)

  **Goal:** Determine if a historical rate/mean can be used for future budgeting.
  **Participants:** Statistician (Facilitator), Domain Engineer (Subject Matter), Budget Owner (Decision Maker).
  **Time:** 60 Minutes.

  ## Part 1: The Predicate Audit (The "Grue" Check)
  *Goal: Determine if the category being measured is an artifact of time.*

  **Q1. How was this group/category defined?**
  *   **A:** By a physical characteristic (e.g., "Cast Iron Pipe," "Centrifugal Pump").
  *   **B:** By a policy or system change date (e.g., "Meters installed after 2015," "Accounts migrated to SAP").
  *   **C:** By a combination (e.g., "Pumps purchased under the 2010 contract").

  **Q2. The Counterfactual Test:**
  *   "If our utility had been founded 10 years later than it was, would this specific category still exist as a distinct group?"
  *   **Yes:** The category reflects a persistent physical or operational reality.
  *   **No:** The category is defined by its relationship to a specific calendar date. ⚠️ **JUDGMENT CALL**

  **Q3. The Boundary Check:**
  *   "Does the start date of our data coincide with the creation of the category?"
  *   **No:** We observed the category before we started measuring, or the category existed before the data start.
  *   **Yes:** The data starts exactly when the category was created. ⚠️ **JUDGMENT CALL** (High risk of "Grue": we have only observed the 'green' phase, never the 'blue' phase).

  **Sufficiency Criteria:**
  *   **Green Light:** Q1=A, Q2=Yes.
  *   **Yellow Light:** Q1=C, Q2=Yes.
  *   **Red Flag:** Q1=B, Q2=No, OR Q3=Yes.

  ---

  ## Part 2: The Mechanism Audit
  *Goal: Distinguish between correlation and causal stability.*

  **Q4. What physically breaks or drives the number?**
  *   *Engineer must describe a mechanism (wear, corrosion, consumption behavior, regulatory requirement).*
  *   **Specific:** "Seal rubber hardens over time."
  *   **Vague:** "It gets old," or "That's just how it is." ⚠️ **JUDGMENT CALL**

  **Q5. Is the mechanism exhausted or cumulative?**
  *   **Cumulative/Stable:** Wear accumulates linearly; demand is driven by population count.
  *   **Threshold/Step:** Failure happens suddenly after a threshold; demand changes with appliance efficiency standards.
  *   **Unknown:** We don't know what drives the variance. ⚠️ **JUDGMENT CALL**

  **Sufficiency Criteria:**
  *   **Green Light:** Specific Mechanism + Cumulative/Stable.
  *   **Red Flag:** Unknown Mechanism OR Threshold mechanism with data near the threshold.

  ---

  ## Part 3: The Context Audit (Stationarity)
  *Goal: Check for covariate shift.*

  **Q6. Has the environment surrounding this metric changed in the last 20% of the observation period?**
  *   *Examples: New regulations, climate shifts, housing stock turnover, upstream treatment changes.*
  *   **No:** Context is invariant.
  *   **Yes:** Context has changed.
      *   *Follow-up:* Did the metric change when the context changed?
      *   **No:** The metric is robust to this context change.
      *   **Yes/Unclear:** The metric is sensitive to context. ⚠️ **JUDGMENT CALL**

  **Sufficiency Criteria:**
  *   **Green Light:** Context invariant OR Metric robust to change.
  *   **Red Flag:** Context changed + Metric sensitive/unclear.

  ---

  ## Part 4: Decision Matrix

  | Predicate Audit | Mechanism Audit | Context Audit | **Decision** |
  | :--- | :--- | :--- | :--- |
  | **Green** | **Green** | **Green** | **Extrapolate.** Use historical mean. Set horizon at 5 years or until next major infrastructure review. |
  | **Green/Yellow** | **Green** | **Yellow** | **Extrapolate w/ Short Horizon.** Use historical mean, but budget horizon ≤ 2 years. Add 10% contingency. |
  | **Red Flag** | **Any** | **Any** | **Do Not Extrapolate.** The category is likely time-bound. Budget for uncertainty (scenario planning) instead of a point estimate. |
  | **Any** | **Red Flag** | **Red Flag** | **Do Not Extrapolate.** Mechanism unknown + Environment shifting. High risk of structural break. |
  | **Mixed** | **Mixed** | **Mixed** | **Hand to Human.** (See below). |

  ### The "Hand to Human" Clause
  If the checklist results in "Mixed" or if there is disagreement on the answers (e.g., Statistician says "Red Flag" on Q2, Engineer says "Green"):
  1.  Document the disagreement explicitly.
  2.  The Budget Owner must sign off on one of two paths:
      *   **Path A:** Adopt the Statistician's conservative estimate (Budget for Uncertainty).
      *   **Path B:** Adopt the Engineer's estimate (Extrapolate), but acknowledge the risk in the risk register.
  3.  **Do not average the numbers.**

  ---

  # Running the Cases

  Here is how the protocol executes on your three scenarios.

  ### Case 1: Pump Failures (Seal Wear)
  *   **Predicate:** "Centrifugal Pumps, Model X." Defined by physical model, not date. (Q1=A, Q2=Yes). **Green.**
  *   **Mechanism:** "Seal wear." Physical degradation is cumulative and well-understood. (Q4=Specific, Q5=Cumulative). **Green.**
  *   **Context:** Operational load has been stable. (Q6=No). **Green.**
  *   **Protocol Output:** **Extrapolate.**
  *   **Horizon:** 5 Years (or until pump replacement cycle).
  *   **Comment:** This is the ideal case. Physical laws + stable category = high entrenchment.

  ### Case 2: Household Demand by Meter Generation (New Gen)
  *   **Predicate:** "Gen 3 Meters." Defined by rollout date (2 years ago). (Q1=B, Q2=No). **Red Flag.**
      *   *Note:* This is classic Grue. "Gen 3" is defined by "Installed after Date T." We have never seen a Gen 3 meter that is 10 years old.
  *   **Mechanism:** Meter accuracy drift over time. (Q4=Vague/Unknown for this gen). **Red Flag.**
  *   **Context:** Rollout is ongoing. (Q6=Yes). **Yellow.**
  *   **Protocol Output:** **Do Not Extrapolate.**
  *   **Action:** Budget for uncertainty. Do not assume the failure/drift rate of Gen 1 or Gen 2 applies to Gen 3. Create a "Meter Replacement Contingency Fund" rather than a fixed line item.
  *   **Comment:** The protocol correctly identifies that "Gen 3" is a time-indexed predicate. We are observing the "green" phase (new meters) and assuming they won't turn "grue" (fail differently) as they age.

  ### Case 3: Seasonal Demand (Housing Turnover)
  *   **Predicate:** "Regional Residential Demand." (Q1=A). **Green.**
  *   **Mechanism:** Human consumption + Housing stock. (Q4=Specific). **Green.**
  *   **Context:** Housing stock turning over fast. (Q6=Yes).
      *   *Follow-up:* Did the metric change?
      *   *Engineer Argument:* "No, the aggregate demand curve looks the same as last year."
      *   *Statistician Argument:* "The composition is changing; the stability is coincidental so far."
      *   *Protocol Ruling:* This triggers the **Yellow/Mixed** condition. The metric hasn't changed *yet*, but the driver (housing stock) has.
  *   **Protocol Output:** **Extrapolate w/ Short Horizon.**
  *   **Horizon:** 1 Year.
  *   **Action:** You (the Statistician) wanted to stop; the Engineers want to continue. The protocol splits the difference. It allows extrapolation *for the immediate budget cycle* (validating the engineers' immediate need) but restricts the horizon to 1 year (validating your concern about structural shift).
  *   **Comment:** This is where the "Hand to Human" clause is vital. If you feel strongly that the turnover implies an *immediate* break (e.g., new houses have 50% lower flow fixtures), you mark Q6 as "Yes + Metric Sensitive." If the data hasn't shown the drop yet, the protocol forces a "Short Horizon" rather than a hard stop. This protects you: if the demand drops next year, you told them the horizon was only 1 year.

  ---

  # Limitations & Failure Modes of the SEP

  You asked for honesty about what this procedure cannot do. Put this on the cover sheet.

  1.  **The "Black Swan" Blind Spot:** The SEP assumes the future is a perturbation of the past. It cannot predict unprecedented events (e.g., a pandemic, a catastrophic aquifer contamination, a sudden state mandate). It manages *risk*, not *ruin*.
  2.  **The "Honest Engineer" Dependency:** The protocol relies on the engineer answering Q4 (Mechanism) honestly. If they say "It's wear" when it's actually "It's operator error," the protocol gives a false Green. ⚠️ **JUDGMENT CALL.**
  3.  **Lagging Indicators:** In Case 3 (Housing), the metric (demand) often lags the covariate (housing stock). The protocol might give a Green/Yellow light *just before* the break happens because the data hasn't reflected the change yet. The "Short Horizon" mitigation is the only defense here.
  4.  **No Probability Output:** This is a qualitative triage tool, not a model. It does not produce a confidence interval. It produces a *permission structure*.
  5.  **Circular Entrenchment (Residual):** While Q2 attempts to fix Goodman's circle, "Physical Characteristics" (Q1=A) are also socially constructed to some degree (e.g., we define "Cast Iron" a certain way). The protocol treats Physical as more entrenched than Administrative, which is a pragmatic heuristic, not a logical truth.

  # Implementation Note for the Director

  When you hand this to the Director, emphasize the **"Hand to Human"** clause.

  > "Director, this protocol automates the easy decisions so we can spend our time on the hard ones. If the checklist comes back 'Mixed,' it means the data cannot decide. At that point, the decision is no longer statistical; it is strategic. The protocol forces us to document that we are making a strategic bet, rather than hiding it behind a spreadsheet."

  This protects you. If Case 3 blows up, you can show the minutes: *"We flagged the housing turnover in Q6. We recommended a 1-year horizon. The decision was made to budget for 3 years based on operational necessity."* That is not a stats failure; that is a documented risk acceptance.
