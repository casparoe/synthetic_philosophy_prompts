  Your argument collapses because Premise (2) smuggles an equivocation into the definition of "wrong." It states: *"What makes his act wrong... is... the fact that it sets back a legitimate claim someone holds against him."*

  In the Minister's case (Premise 1), the "legitimate claim" is a **right** (specifically, a negative right not to be killed). This claim is *agent-relative* and *constraint-based*. It binds the Minister regardless of the consequences. To violate it is to commit a transgression.

  In the Triage/Mother cases (Premise 3), the "legitimate claim" is an **interest** or a **positive expectation** (a claim to be saved, a claim to attention). These claims are *conditional* on resources. In conditions of scarcity, these claims do not vanish, but they are **defeated**, not **violated**. The triage officer does not violate the patient's right to life (which no patient holds against a specific doctor in a war zone); she fails to satisfy her interest in survival because the world is scarce.

  Premise (2) looks innocent because in ordinary language, we use "claim" to cover both "I have a right to this" (Minister's victim) and "I have a need for this" (Triage patient). But morally, they function differently. One generates a duty *not to act* (constraint); the other generates a duty *to optimize* (goal). By treating them as identical in (2), you allow the ubiquity of competing interests (3) to dilute the specificity of rights violations (1).

  ### The Step to Reject: Premise (2)

  You should reject Premise (2) as a universal definition of the "wrong respect" required for dirty hands.

  **Why it looked innocent:**
  It appeals to a desire for moral symmetry. You want your characters to share a burden. Premise (2) grants them all the same vocabulary: they all "set back claims." It feels democratic and humane to suggest the mother and the minister are in the same boat. It allowed you to write the argument "assembling itself out of [your] own characters" because it gives them all a voice. Rejecting it feels like silencing the mother or the editor, telling them their pain doesn't "count" as wrongness.

  **Why you must reject it:**
  If you keep (2), you are forced to accept (5): that dirty hands is everywhere. If dirty hands is everywhere, it is nowhere. The concept loses its tragic weight. To preserve (6)—the distinction that makes your novel turn on the unique horror of public office—you must acknowledge that the Minister's wrong is *categorically* different from the Mother's. The Minister breaks a wall; the Mother navigates a crowd. Both are hard, but only one is a transgression.

  ### Pricing the Alternatives

  You asked for the costs. Here is the ledger.

  **Option A: Reject Premise (2) (Recommended)**
  *   **The Move:** You argue that "setting back a claim" is not sufficient for the specific wrongness of dirty hands. Dirty hands requires violating a *constraint* (a right that cannot be traded), whereas the others involve failing to maximize *goods* (interests that must be weighed).
  *   **The Cost to (1):** You must rephrase Premise (1). Dirty hands is no longer just "wrong in one respect"; it is "violating a deontological constraint for consequentialist reasons." This is clunkier. It makes the definition more technical.
  *   **The Cost to the Characters:** The Mother and Triage Officer can no longer claim they have "dirty hands" in the same sense as the Minister. They have **moral residue** or **tragic remainder**, but not dirty hands. Their guilt is real, but it is the guilt of *inability*, not *transgression*.
  *   **The Gain:** You save (6). The Minister remains distinct. His burden is heavier because he has actively done what must not be done, whereas the others have failed to do what could not be done. This creates a hierarchy of burden that can drive dramatic tension: the Mother might *argue* she has dirty hands, and the Minister must correct her, deepening the theme.

  **Option B: Reject Premise (3)**
  *   **The Move:** You argue that the Mother and Triage Officer do *not* set back legitimate claims at all. In scarcity, the claim dissolves.
  *   **The Cost:** This sanitizes the private sphere. It suggests the mother who ignores her crying child does *no wrong* in any respect, provided she is attending to the other. This feels cold and philosophically dubious. It robs your private characters of their moral complexity. They become mere technicians of scarcity rather than moral agents.
  *   **The Gain:** It preserves (1) and (2) intact.
  *   **Verdict:** High literary cost. It makes the Mother less sympathetic and the novel less emotionally resonant.

  **Option C: Reject Premise (6) (Accept Ubiquity)**
  *   **The Move:** You accept (5). Dirty hands *is* everywhere. The Minister is not special; he is just a more extreme example of the human condition.
  *   **The Cost:** You lose the specific political critique. The novel becomes about general moral tragedy rather than the specific corruption of power. The Minister becomes less a figure of unique horror and more a symbol of universal compromise.
  *   **The Gain:** Radical moral equality among your characters.
  *   **Verdict:** You explicitly stated you prefer to preserve (6). This option abandons your core thematic goal.

  ### The Recommendation

  Reject **(2)**, but do so gently.

  Do not tell your Mother character she is innocent. Tell her she is burdened, but differently. Allow her to argue for (2) in the text. Let her say, *"I left my child hungry to feed the other; I set back his claim. My hands are dirty."*

  Then let the Minister reply: *"No. You failed to save him. I killed a man. Your hands are stained with tragedy; mine are stained with sin."*

  This preserves (6) without sacrificing the emotional truth of the other characters. It changes the novel from a proof that "all choice is dirty" to an exploration of "there are different kinds of dirt." That is a richer, more dangerous book.
