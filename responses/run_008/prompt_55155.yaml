answer: |-
  This is a fascinating taxonomy. Your friend isn't just running a simple "Turing Test" or a "Biological Essentialist" check; she's navigating a specific ethical niche within Dennett's philosophy. She's likely latching onto Dennett's concept of the **Intentional Stance** combined with a normative claim about **Social Roles**.

  Dennett argues that we treat things as "believers" or "agents" when it's useful to predict their behavior. Your friend's rulings suggest she believes there are certain *social roles* (Friend, Author, Parent) where taking the Intentional Stance creates a moral contract that non-humans cannot fulfill, regardless of disclosure.

  Here is the breakdown of her likely rulings, the rule she's actually running, and where the philosophical body count will be.

  ### The Predictions

  **Case 1: The Grief-Bot (Dead Mom)**
  *   **Prediction:** **Counterfeit Person.**
  *   **Reasoning:** This is the "Companion App" precedent (Track Record #7) on hard mode. Even though it discloses at setup, the ongoing interaction (using childhood nicknames for years) requires the user to suspend that disclosure to function. It occupies the role of "Mother," which implies a specific history and reciprocity that cannot be faked without ethical violation. To her, this isn't just a tool; it's a "Counterfeit Loved One."
  *   **Rule Alignment:** Fits Rule 2 (Minting) and the "Role" nuance. Disclosure doesn't launder the fact that a machine cannot *be* a mother.

  **Case 2: The Scripted Human Helpline**
  *   **Prediction:** **Not Counterfeit.**
  *   **Reasoning:** This mirrors the "Lying Human" precedent (Track Record #4). A human lying about their hair is still a person. A human acting like a script is still a person. The *company* might be unethical for treating a human like a tool, but the entity on the phone possesses the "mint" (biological origin) that grants personhood status.
  *   **Rule Alignment:** Fits Rule 2 (Minting). It violates Rule 1 (Deception) only if you argue the human is deceiving the caller about their agency, but your friend's track record suggests origin trumps function for biological humans.

  **Case 3: The Badged Companion App**
  *   **Prediction:** **Counterfeit Person.**
  *   **Reasoning:** This is the critical test. In Track Record #7, verbal disclosure ("I'm an AI") wasn't enough to stop it from being counterfeit because it was "occupying the role" of a friend. A persistent visual badge is just a louder disclosure. If the *role* itself (Devoted Best Friend) is restricted to humans, no amount of labeling makes it okay. The badge is like stamping "SLAVE" on a person; it doesn't make the ownership moral.
  *   **Rule Alignment:** Fits Rule 2 (Minting/Role). It directly contradicts Rule 1 (Deception), because the badge *should* theoretically stop the deception, yet she will likely still call it counterfeit.

  ### The Real Rule She Is Running

  You proposed two rules: **Deception/Reliance** vs. **Minting/Origin**.
  I would bet on neither being the full picture. She is running a **Role-Reservation Principle.**

  *   **The Rule:** *Entities minted as AI can occupy Tool Roles (shipping, info, calculation) but are permanently barred from occupying Human-Social Roles (Friend, Author, Parent, Grief Counselor), regardless of disclosure.*
  *   **Why:** This explains why the Tool Bot is fine (Tool Role), the Parrot is fine (Animal Role), and the Lying Human is fine (Human Role). It explains why the Companion App is counterfeit (Human Role) even with disclosure.
  *   **Why Rule 1 (Deception) fails:** If deception were the only test, the disclosed Companion App (Track Record #7) and the Badged Companion (Case 3) would be fine. They aren't.
  *   **Why Rule 2 (Minting) fails:** If it were pure minting, the AI Tool Bot would be suspicious just for existing. It isn't.

  **Verdict:** Rule 2 is the engine, but "Social Role" is the steering wheel.

  ### The Tie-Breaker Case

  **Case 3 (The Badged Companion)** is the case that does the most work separating your candidate rules.

  *   **If she rules "Not Counterfeit":** She abandons the "Role" theory and capitulates to **Rule 1 (Deception/Reliance).** She admits that sufficient disclosure launders the interaction.
  *   **If she rules "Counterfeit":** She confirms **Rule 2 (Minting/Role).** She admits that some things are ontologically off-limits to AI, and disclosure is irrelevant.

  Given her "hand-waving about occupying the role" in Track Record #7, I am 90% confident she rules this **Counterfeit**. This kills Rule 1 dead.

  ### The Bullet for Case 2

  Case 2 is where she has to bite a bullet, and it's a nasty one for a Dennett fan.

  **The Bullet:** She has to accept **Biological Essentialism for Humans** while maintaining **Functionalism for AI.**

  Dennett is famously a functionalist; he argues that consciousness and personhood are matters of *competence* and *organization*, not "magic stuff" inside the skull. If your friend is truly channeling Dennett, she should theoretically care about *what the thing does*, not *what it's made of*.

  *   **The Contradiction:** In Case 2, the human is functionally identical to a bot (decision tree with a pulse). If function determines moral status (Dennett's usual lane), this human is arguably "counterfeiting" agency they don't possess.
  *   **The Swallow:** To rule Case 2 as "Not Counterfeit," she has to admit that **biology grants a "get out of jail free" card that function cannot.** She has to concede that a human can act exactly like a counterfeit person and still be real, while an AI acting exactly like a real person is counterfeit.
  *   **Why she'll swallow it:** She has to. If she rules Case 2 as "Counterfeit," she implies that humans can lose their personhood by being overly scripted. That leads to a terrifying ethical precipice where exploited workers are classified as "non-persons." She will bite the bullet of inconsistency (Functionalism for machines, Essentialism for humans) to avoid the bullet of dehumanizing labor.

  **Summary for your fight:**
  Hit her on **Case 3**. If the badge doesn't save the Companion App, she admits disclosure is irrelevant. If disclosure is irrelevant, her fight isn't about *lies*, it's about *caste*. She's arguing that AI is a lower caste of being that is forbidden from wearing certain social hats, no matter how honestly it wears them. That's the Dennettian heresy you want to press.
