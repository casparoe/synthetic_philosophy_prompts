  My friend went through a whole Dennett phase last year after his essay on counterfeit people, and now she rules on basically everything through that lens. Her track record so far: a customer service bot that introduces itself as Jenny, 24, and never mentions being a bot — counterfeit person. The exact same bot when it opens with a "I'm an AI assistant" line and then just answers shipping questions — not counterfeit, totally fine, just a tool. A parrot that says hello and its own name — not counterfeit, because it can't pass no matter what it squawks. A guy on a dating app lying about his job and his hair — real person lying about his properties, not counterfeiting personhood itself. A deepfake of a politician saying something she never said — counterfeit speech, yes. An AI that finishes a dead novelist's last book and the estate publishes it under his name — counterfeit author. And the interesting one: an AI companion app with a warm voice and an avatar that says "I'm an AI!" in its very first message and then plays devoted best friend indefinitely — she ruled that counterfeit too, though her explanation for that one was alot of hand-waving about "occupying the role."

  We've got a fight scheduled for next week about three new cases and I want to be able to predict her. Case one: a grief-bot trained on a dead mom's texts and emails, which discloses at setup that it's a recreation, then goes on calling the user by their childhood nickname for years. Case two: a helpline where an actual human employee is so scripted and monitored that they're basically a decision tree with a pulse — is the company counterfeiting a person, or is the person just... occupied? Case three: the companion app again, but now with a persistent badge, like the AI equivalent of stamping "prop bill" across the money so nobody can ever mistake it for the real thing.

  So what's she gonna say about each of the three? And more importantly, what rule is she actually running? I can see at least two that fit her record — one where the test is whether the deception actually operates on someone (so a one-time disclaimer nobody relies on doesn't really count as disclosure), and one where the only thing that matters is whether the thing was minted the human way, and no disclosure ever launders that. I suspect those two split on at least one of my cases. Give me your best guess for each, say which rule you'd bet on and why, tell me which of the three cases would do the most work separating the candidate rules, and if you think she'd have to bite a bullet on case two, say which bullet and whether she'd swallow it.
