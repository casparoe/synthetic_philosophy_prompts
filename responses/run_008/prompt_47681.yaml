answer: |-
  Here are ten interview questions designed for your philosophy-of-history podcast. They are structured to move from the theoretical framework to specific case studies, ending with the implications of her argument. The three required questions (marked with an asterisk) include the specific follow-ups you requested.

  **1. The Thesis and Terminology**
  Your book makes a provocative shift in vocabulary, moving from "disaster" to "crime." In the philosophy of history, we often worry about anachronism—applying modern legal or moral categories to past actors who operated under different normative frameworks. When you label these famines as political crimes, are you acting as a historian reconstructing the past, or a prosecutor judging it? How do you navigate the tension between historical understanding and moral verdict?

  **2. *The Question of Intent (Ireland)***
  *In the case of the Great Famine in Ireland, the British administration's ideology was largely doctrinaire laissez-faire rather than explicitly genocidal. They prioritized economic theory over relief, but one could argue they were negligent rather than murderous. If we categorize ideological negligence as a "crime," do we risk stretching the category until it loses its meaning? How do you distinguish between a criminal policy and a merely cruel or incompetent one?*

  *   **Follow-up:** *If you argue that foreseeability makes negligence criminal, where do we draw the line? Does every government policy with foreseeable deadly side effects—say, austerity measures or infrastructure cuts—potentially qualify as a crime against humanity, or is there a threshold of specific indifference required?*

  **3. *Entitlement vs. Expropriation (Ireland)***
  *You lean on Amartya Sen's entitlement approach, which argues famines occur when people lack the means to acquire food, not necessarily when food is absent. In Ireland, grain and livestock were actively exported while the population starved. Critics might say entitlement theory simply relabels the fact that the poor lacked money to buy food that existed. Does the concept of "entitlement failure" actually do any explanatory work here, or does it obscure the more direct reality of resource extraction?*

  *   **Follow-up:** *If the political decision was to allow exports despite the population's lack of entitlement, isn't the "entitlement failure" just the symptom, and the "political crime" the cause? Why retain the economic terminology of Sen rather than using the political language of expropriation?*

  **4. The Bengal Famine and Colonialism**
  Moving to Bengal in 1943, the dynamics shift from doctrinaire economics to wartime exigency and colonial racism. Winston Churchill's government is often cited as a primary culprit here. How does the colonial context change the nature of the "crime"? Is a famine inflicted by a colonial power upon a subject population inherently a different moral category than a famine inflicted by a state upon its own citizens, as in the Great Leap Forward?

  **5. *Democracy, Concealment, and Sen (Great Leap Forward)***
  *Sen's famous claim is that famines don't happen in functioning democracies with a free press because leaders get voted out. In the Great Leap Forward, the press was state-controlled and the scale of the disaster was actively concealed. Is your argument here that Sen's framework is incomplete? Does the deliberate cover-up alongside continued grain procurement look more like a crime against humanity than a simple entitlement failure, something Sen's framework doesn't itself distinguish?*

  *   **Follow-up:** *If the cover-up is the key mechanism of the crime, does the regime type matter as much as the information flow? If a democracy were to systematically censor famine data to protect an election, would your framework classify that as the same crime as the Great Leap Forward, effectively decoupling the "crime" from the "autocracy"?*

  **6. The Resilience of the Democracy Thesis**
  Sen's thesis relies on the idea of electoral accountability preventing starvation. However, we've seen democracies in the modern era struggle with severe food insecurity that borders on famine, even if they avoid mass mortality. Do you think "functioning democracy" is becoming a moving goalpost? At what point does a democracy's failure to protect its vulnerable populations from starvation begin to look like the political crimes you describe in autocratic settings?

  **7. The Category of "Natural Disaster"**
  If your argument holds—that these events were fundamentally political—does the category of "natural famine" survive at all? Are there historical examples of famine that were truly unavoidable acts of nature, or is environmental shock always mediated by political response? If the latter, does calling any famine "natural" become an act of political absolution?

  **8. Historiography and Prevention**
  There is a pragmatic argument that labeling these events "crimes" might hinder prevention. If current regimes fear international prosecution or historical condemnation, they might be less likely to share data or ask for aid during a crisis. Do you worry that the "crime" framework could create a perverse incentive for secrecy, or do you believe moral clarity is a prerequisite for effective prevention?

  **9. Structural Violence vs. Individual Culpability**
  Your book focuses heavily on state structures and policies. However, when we speak of "crime," we often look for individual criminals. Are you arguing for the prosecution of specific historical figures, or are you describing a form of structural violence where the system itself is the perpetrator? If it's the latter, how do we assign responsibility without individual agents to hold accountable?

  **10. Climate Change and the Future**
  Finally, looking forward: climate change is predicted to cause massive crop failures in the coming decades. If your thesis is correct, then future famines caused by climate shocks will not be natural disasters, but political crimes determined by how nations manage migration, trade, and aid. Does your framework offer a roadmap for preventing these future crises, or is it primarily a tool for reckoning with the past?
