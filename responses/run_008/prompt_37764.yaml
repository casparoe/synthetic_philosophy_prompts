answer: |-
  Your skepticism is mathematically grounded but practically misplaced, because plurality voting is actually *more* susceptible to harmful strategic voting than ranked choice when there are many candidates.

  The core flaw in your reasoning is the assumption that plain plurality is immune to strategy. In a race with five or six candidates, plurality forces voters into a high-stakes game of "vote splitting" where voting for your true favorite is often suicidal if they aren't a top-two contender. This is the spoiler effect, and it compels voters to strategically abandon their preferred candidate to prevent their least favorite from winning. Gibbard–Satterthwaite proves that *some* strategic opportunity exists in ranked systems, but it does not say all systems are equally vulnerable to strategy in practice. Ranked Choice Voting (RCV) significantly reduces the pressure to abandon your favorite candidate because your vote transfers if they lose, meaning you can vote more honestly without wasting your ballot.

  Regarding the difference between the theorems, Arrow's Impossibility Theorem and Gibbard–Satterthwaite address different flaws. Arrow proves that no ranked voting system can simultaneously satisfy a specific set of fairness criteria (like independence of irrelevant alternatives) when aggregating preferences into a social ranking. Gibbard–Satterthwaite specifically targets incentive compatibility, proving that no ranked system can completely prevent voters from benefiting by lying about their preferences in some edge cases. They are related impossibility results, but Arrow is about systemic fairness properties while Gibbard–Satterthwaite is about voter psychology and game theory. Neither says "all systems are equally bad," only that "no system is perfect."

  Your book club friend is partially right about Approval Voting, but not for the reasons they think. Approval Voting sidesteps Gibbard–Satterthwaite because it is not a ranked (ordinal) system; it is a cardinal system where you rate candidates as either "approved" or "not approved." Because it doesn't ask for a ranking order, the specific mathematical constraints of Gibbard–Satterthwaite do not apply. However, it introduces its own strategic complexity regarding where voters set their approval threshold (e.g., do I approve only my top choice or my top three?). While it avoids the specific ranking paradoxes, it is not strategy-free, though many theorists argue it is simpler for voters to navigate than RCV.

  Ultimately, switching to RCV is not a step backward because it mitigates the most damaging form of strategic voting—the spoiler effect—which is rampant in plurality systems with crowded fields. While Gibbard–Satterthwate guarantees that a perfect, strategy-proof system is impossible, RCV moves the needle toward more honest expression of preference compared to the "lesser-of-two-evils" dynamic inherent in your current plurality system.
