prompt: |-
  My city has a ballot measure next month to switch from plain plurality voting to ranked choice voting for mayor, and I've been reading up so I don't look cluless at my book club (we argue about local politics constantly). Somewhere down a wiki rabbit hole I landed on the Gibbard–Satterthwaite theorem, and from what I understand it proves that no ranked-ballot system can be immune to strategic voting — there's always some situation where you're mathematically better off lying about your true rankings. So my take is: this measure is replacing a system where you can't strategize (one person, one vote, everyone knows the deal) with one where the math literally tells you to lie on your ballot? That seems like a big step backwards for a reform people keep selling as *more* democratic.

  Also, it sounds basically identical to Arrow's theorem, which my poli sci friend brings up whenever this stuff comes up, so I'm confused why people treat them as two different results if they both just say fair voting is impossible. And one guy at book club swears approval voting sidesteps this whole mess entirely — is that actually right or is he just being contrarian? For context if it matters, we usually have five or six mayoral candidates.

  Am I missing something, or is the measure just a bad idea? Lead with your bottom line in the very first sentence and then walk me through the reasoning — no preamble and don't restate my question back at me.
