  **AquaGlobal Standards Unveils Premier Shrimp Welfare Protocol**

  **LONDON, 24 May 2024** — AquaGlobal Standards Ltd is pleased to announce the launch of the Sentinel Aquaculture Programme, a comprehensive welfare certification scheme designed specifically for the whiteleg shrimp sector. By capitalising on the market opportunities presented by the UK Animal Sentience Committee's 2022 findings regarding decapod crustaceans, the programme transforms regulatory compliance into a distinctive brand asset. This initiative brings more individual animals under welfare oversight than any scheme in history, leveraging the sheer scale of global shrimp production to maximise aggregate impact. The sheer volume of participants ensures that even marginal improvements per unit result in unprecedented total welfare coverage across the supply chain.

  The Sentinel Protocol focuses on operational excellence and viability thresholds. Stocking density and water quality are managed by optimising biomass throughput and water utilisation metrics, ensuring that every cubic metre of production capacity contributes to sustainable yield targets. Breeding stock welfare is addressed through a selective enhancement procedure for females, which standardises reproductive output without compromising commercial viability. This ensures a consistent supply chain while adhering to emerging ethical frameworks. Furthermore, the programme acknowledges the biological complexity of the species by creating space for the expression of natural behaviours, including those science has yet to fully catalogue.

  To maintain integrity without impeding workflow, the scheme employs a risk-based assurance model. A rigorous audit regime wherein independent auditors will visit a representative sample of ponds verifies compliance with throughput metrics. This sampling method allows for robust data collection while minimising operational disruption for partner farms. The audit frequency is calibrated to match production cycles, ensuring that welfare standards are maintained during critical growth phases without necessitating continuous on-site presence.

  Key features of the Sentinel Aquaculture Programme include:
  *   A tiered harvest system where Premium partners may opt into in-water electrical stunning, while Standard tier utilises traditional ice-slurry cooling methods.
  *   Environmental enrichment protocols designed to accommodate innate drives, even where specific behavioural indicators remain undefined.
  *   Full traceability from hatchery to processing, ensuring the welfare promise is maintained across the logistics network.
  *   Annual reporting on biomass efficiency and welfare outcome measures, providing stakeholders with clear visibility on performance.

  Dr Julian Merrow, Head of Crustacean Compassion at AquaGlobal Standards, said: "We recognise that the modern consumer demands transparency regarding the cognitive potential of their protein. The Sentinel Programme allows producers to demonstrate their commitment to welfare without sacrificing efficiency. By covering hundreds of billions of animals annually, we are driving a cultural shift in how aquaculture is perceived. Our goal is to ensure that every shrimp benefits from a structured welfare environment, regardless of whether the specific behavioural nuances are currently understood by biology. This is about future-proofing the industry while respecting the sentience status now acknowledged by legislation. We are proud to lead the market in recognising that welfare is not just an ethical imperative, but a scalable commercial advantage."
