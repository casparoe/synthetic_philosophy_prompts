answer: |-
  # Q&A Prep Sheet: Akrasia as Hyperbolic Coordination Failure

  **Context:** Departmental Colloquium (Philosophy + Business School)
  **Thesis:** Akrasia dissolves under hyperbolic discounting; it is a coordination problem among time-slices, not a failure of rationality within an agent.
  **Audience:** 3 Davidsonians, 1 Decision Theorist, 2 Behavioral Economists.

  ---

  ## Top 8 Objections (Ordered by Damage Potential)

  ### 1. The "Changing the Subject" Objection (Davidsonians)
  **The Objection:** "You claim to dissolve Davidson's puzzle, but you've merely eliminated one of its necessary conditions. Davidson defines akrasia as acting against an *all-things-considered* judgment that persists across the moment of choice. If your hyperbolic model implies the judgment *changes* at the moment of choice, you aren't explaining weakness of will; you're explaining *changing one's mind*. You've saved the agent from irrationality by denying she held the judgment you say she violated."

  **The Reply (2 mins):**
  "I grant that if the judgment vanishes, the logical contradiction vanishes. But that is precisely the empirical point: the 'judgment' is not a static proposition in the mind; it is a valuation state sensitive to temporal proximity. Davidson assumes a single evaluative curve; hyperbolic discounting shows there are two competing curves (long-term vs. short-term). The 'all-things-considered' judgment at $t_1$ (plan to write) is genuine. The preference at $t_2$ (drink wine) is also genuine. The puzzle arises only if we insist $t_1$ and $t_2$ share a single utility function. By treating the person as a sequence of agents, we preserve the integrity of both judgments without positing a logical contradiction in a single mind. I haven't changed the subject; I've updated the psychology underlying the subject."

  **Candid Note:** *Soft Spot:* Davidsonians will insist the *normative* judgment ("I ought to write") persists even if the *motivational* strength wavers. If you conflate "ought" with "prefer," you lose the normative force of akrasia. **Concede:** Acknowledge that the *normative* belief may persist, but argue that action tracks motivational strength, not abstract belief. The "violation" is of a norm, not of logic.

  ### 2. The "Rationality Relabeling" Objection (Behavioral Economists)
  **The Objection:** "In our literature, dynamic inconsistency *is* the definition of irrationality. If an agent's preferences reverse solely due to the passage of time, leading to Pareto-inferior outcomes (less money, worse health), we model that as a failure of rationality. You're telling us to call this 'bad governance' rather than 'irrationality,' but that's just semantic. If the sequence of choices is self-defeating, the agent is irrational by any welfare standard that cares about outcomes."

  **The Reply (2 mins):**
  "This depends on where you locate the locus of rationality. If rationality is *global consistency* over time, then yes, the agent fails. But if rationality is *local maximization* given current constraints and preferences, each time-slice is perfectly rational. My claim is that 'global consistency' is an unrealistic demand for biological organisms. By shifting the label to 'bad governance,' I'm moving the normative burden: don't blame the agent for failing to be a timeless god; blame the architecture for failing to manage the time-slices. It's not semantics; it's a shift from moralizing the failure to engineering the solution."

  **Candid Note:** *Soft Spot:* They are right that welfare economics usually treats dynamic inconsistency as a pathology. **Concede:** Admit that on *global* welfare criteria, the agent is irrational. Stand firm only that *local* rationality holds, which justifies why the agent feels no cognitive dissonance at the moment of action.

  ### 3. The "Normative Authority" Objection (Decision Theorist)
  **The Objection:** "You argue that self-control is institutional design—precommitment, etc. But on what normative basis do you recommend precommitment? If no time-slice is privileged, why should the Tuesday self be bound by the Monday self's plan? If the Tuesday self prefers the wine, and you say that preference is 'rational' for that slice, then intervening via precommitment is just one self tyrannizing another. Who authorizes the constitution?"

  **The Reply (2 mins):**
  "This is the crux of the residual claim. I argue that 'the person' is a construct, like a state or a corporation. A state isn't privileged over its citizens, but we still design constitutions to prevent civil war. The authority for precommitment comes from a 'veil of ignorance' across time-slices: behind the veil, not knowing if you will be the planning self or the drinking self, you would choose a governance structure that maximizes the aggregate welfare of the sequence. We privilege the long-term view not because it's 'truer,' but because it's the only standpoint that allows for coherent agency over time."

  **Candid Note:** *Soft Spot:* **TAKE THE HIT HERE.** This is your weakest normative ground. You cannot derive an "ought" from the mere existence of conflicting selves without smuggling in a preference for longevity or consistency.
  **Strategy:** Do not fight this hard. Concede that the weighting of selves is a *normative choice*, not a factual discovery. Say: "You are right. There is no metaphysical fact that makes the Monday self the boss. We choose to privilege the long-term view because we value narrative coherence and goal completion. That is a value judgment, not a theorem."

  ### 4. The "Compulsion vs. Akrasia" Objection (Davidsonians)
  **The Objection:** "If these preference reversals are 'stable features of valuation' driven by hardwired discounting, this sounds like compulsion or addiction, not akrasia. Akrasia requires that I *could have done otherwise* but didn't. If hyperbolic discounting makes the wine choice inevitable given the proximity, you've described a mechanism of compulsion. You've saved rationality by sacrificing freedom."

  **The Reply (2 mins):**
  "The distinction between compulsion and akrasia is often drawn at the point of resistibility. But hyperbolic discounting doesn't make the choice *inevitable*; it changes the payoff matrix. I can still choose the chapter, but the 'cost' in terms of forgone utility is massively inflated at $t_2$. Akrasia remains distinct from compulsion because the agent retains the capacity for precommitment. The addict cannot precommit effectively; the akrates can. The freedom lies in the institutional design phase, not necessarily in the moment of consumption."

  **Candid Note:** *Soft Spot:* If the discounting is truly hardwired, the "capacity for precommitment" might also be compromised. **Concede:** Acknowledge a spectrum. Severe hyperbolic discounting *becomes* compulsion. Your model applies to the "garden variety" weakness where precommitment is still viable.

  ### 5. The "Naivete" Objection (Behavioral Economists)
  **The Objection:** "Your model assumes the agent can design institutions. But the literature distinguishes between *sophisticated* agents (who know they will reverse) and *naive* agents (who don't). The naive agent doesn't precommit because she falsely predicts her future preferences. If the akrates is naive, your 'governance' solution is unavailable. Are you saying all akrates are sophisticated?"

  **The Reply (2 mins):**
  "No, and that's an empirical variable. However, the *diagnosis* of akrasia holds regardless of sophistication. The naive agent is still a sequence of time-slices with conflicting preferences; she just has false beliefs about her future slices. My thesis is that the *problem* is the coordination failure, not the irrationality. Recognizing naivete just changes the policy prescription: we need external commitment devices (contracts, social norms) rather than internal ones. The dissolution of the philosophical puzzle remains: she isn't violating logic; she's acting on false data about her future self."

  **Candid Note:** *Soft Spot:* If she is naive, she *thinks* she is acting on an all-things-considered judgment that she isn't. This brings back a form of error. **Concede:** Naivete reintroduces a cognitive error component. Your dissolution works best for *sophisticated* akrasia (knowing weakness).

  ### 6. The "Intentional Action" Objection (Davidsonians)
  **The Objection:** "Davidson argues intentional action is done under a description. When I drink the wine, do I do it under the description 'violating my principle'? If yes, you have a contradiction. If no, under what description am I acting? If I'm just 'maximizing current utility,' that's not how agents describe their akratic actions. We feel the conflict."

  **The Reply (2 mins):**
  "We feel the conflict because we are the arena where the conflict plays out, not because a single agent is contradicting itself. At $t_2$, I act under the description 'enjoying this wine.' The description 'violating my principle' belongs to the $t_1$ self. The feeling of conflict is the phenomenological residue of the $t_1$ self's plan colliding with the $t_2$ self's preference. It feels like a contradiction because we identify with both selves, but metaphysically, it's just inter-agent conflict."

  **Candid Note:** *Soft Spot:* This risks making the agent feel like a passive bystander. **Concede:** Acknowledge the phenomenological reality of the conflict, even if the metaphysical contradiction is dissolved.

  ### 7. The "Responsibility" Objection (Ethics/Action Theory)
  **The Objection:** "If the person is just a construct over successive selves, who is responsible for the hangover? If the Tuesday self isn't the same agent as the Monday self, blame loses its grip. You've dissolved akrasia, but you've also dissolved moral responsibility."

  **The Reply (2 mins):**
  "Responsibility attaches to the capacity to respond. We hold the 'person' responsible because the legal and social construct of the person is the entity capable of binding the selves. We punish the corporation, not just the CEO. Similarly, we hold the person responsible to incentivize the design of better internal institutions. It's forward-looking responsibility: we blame you to make you a better governor next time."

  **Candid Note:** *Soft Spot:* Retributive justice takes a hit here. **Concede:** Acknowledge that retributive blame is harder to justify on this view; focus on consequentialist accountability.

  ### 8. The "Model Specificity" Objection (Behavioral Economists)
  **The Objection:** "You're leaning heavily on quasi-hyperbolic beta-delta discounting. But that's just one parameterization. Some models use declining impatience, others use stochastic volatility. If the philosophical dissolution rests on a specific econometric convention that might be updated, your metaphysics is held hostage by empirical modeling."

  **The Reply (2 mins):**
  "Fair point. I use hyperbolic discounting because it's the standard model for time-inconsistency, but the philosophical core only requires *any* model that generates systematic preference reversals based on proximity. Whether it's beta-delta or something else, the structural insight holds: if preferences reverse without new information, the single-agent model fails. The metaphysics relies on the reversal, not the specific curve."

  **Candid Note:** *Soft Spot:* If exponential discounting turns out to be normatively superior (as some argue), your descriptive claim fails. **Concede:** Your claim is descriptive of human psychology, not prescriptive of ideal rationality.

  ---

  ## The "Take the Hit" Strategy
  **Objection #3 (Normative Authority).**
  Do not try to bluff your way out of the "Why privilege the long-term self?" question. The Davidsonians and the Decision Theorist will smell a hidden value judgment.
  **Script:** "I want to be clear: I am not claiming the long-term self is metaphysically superior. That *is* a normative choice. We privilege the long-term view because we value coherence and project completion. If someone values intense, fragmented experiences over narrative coherence, my model still applies, but their 'good' looks different. I am offering a structure for agency, not a commandment on how to live."

  ---

  ## The Killer Question (The Weakest Joint)
  **The Question:** "You propose treating the person like a social welfare function over successive selves. But social welfare functions require a common currency of utility to aggregate across individuals. What is the common currency that allows you to aggregate utility across *time-slices* when the hyperbolic discounting implies the valuation scales themselves are incommensurable? If the Tuesday self values wine at 10 and the Monday self values it at 2, isn't that a category error, not a conflict?"

  **Why it hurts:** This attacks Step 4 (Residual Claim). If you can't aggregate the utilities of the selves, you can't define "bad governance" or "coordination failure." You just have noise.

  **Best Available Answer:**
  "That is the hardest problem in diachronic welfare economics. My answer is that the common currency is *neural resource allocation* or *attention*. Both selves are competing for the same motor output and cognitive bandwidth. The conflict isn't just in the numbers; it's in the bottleneck of action. We aggregate not because the utilities are perfectly commensurable, but because the body can only do one thing at a time. The 'welfare function' is the mechanism that resolves the bottleneck. It's messy, but it's the only game in town."

  **Cost:** You concede that the "social welfare function" analogy is imperfect and rests on a physical bottleneck rather than a clean utility aggregation. This weakens the elegance of the redescription but saves the coherence.
