answer: |-
  **Setting:** *The back room of The Lamb & Flag, Covent Garden. It's just past eight. The reading group has formally adjourned, but Julian and Eleanor have remained with half-finished pints. The air is thick with the smell of old wood and stale ale.*

  **Julian:** It comes down to this, Ellie. You can't treat your future self as a stranger. If you know, with certainty, that tomorrow you will assign a probability of eighty per cent to rain, and you assign anything other than eighty per cent tonight, you're setting yourself up to be Dutch Booked. It's not just a bad strategy; it's incoherent. It's like asserting $P$ and not-$P$ simultaneously, just stretched out over twenty-four hours.

  **Eleanor:** Oh, stop it. You're dramatising. Believing a contradiction is a logical catastrophe. Violating Reflection is… well, it's often just prudence. Look, if I know I'm going to be drunk at midnight, I know I'll be eighty per cent confident I can drive home. Does that mean I should be eighty per cent confident now, while I'm sober, that I'm fit to drive?

  **Julian:** That's a preference, not a credence. You're talking about utility.

  **Eleanor:** Is it? What if it's about truth? Suppose there's a pill. The 'Overconfidence Pill'. I know that if I swallow it, I will become convinced, to a degree of ninety per cent, that I can fly. I know the pill adds no evidence. It just chemically tweaks my dial. According to your Reflection Principle, if I expect to be ninety per cent confident after the pill, I should be ninety per cent confident now.

  **Julian:** You're skipping a step. If you *know* the pill adds no evidence, then you know your future credence is not the result of a rational updating process. Reflection applies when you regard your future self as a rational agent processing information. In the pill case, you regard your future self as a broken instrument.

  **Eleanor:** So it's conditional? 'Reflect on your future self unless you think they've been tampered with'?

  **Julian:** It's not a get-out clause; it's a definition of the relationship. To satisfy Reflection is to treat your future self as *you*. If you anticipate the pill, you are anticipating a rupture in your rational agency. The rational move is not to take the pill.

  **Eleanor:** But suppose I have to. Maybe the pill saves my life, but the side effect is this wild overconfidence about flying. I take the pill. I survive. Tomorrow, I am ninety per cent sure I can fly. Today, I am zero per cent sure. I have violated Reflection. Am I irrational?

  **Julian:** You're in a bind. But the violation isn't the mismatch in credence; the violation was taking the pill while knowing it would sever your diachronic coherence. Once you've swallowed it, the contract is void. You can't demand coherence between a rational agent and a chemically altered one.

  **Eleanor:** Ah, so Reflection only holds between rational time-slices.

  **Julian:** Precisely.

  **Eleanor:** Then it's not a law of logic, Julian. It's a policy of trust. It's like me deferring to my friend Sarah. Normally, if Sarah says she's eighty per cent sure it'll rain, I bump my credence to eighty. I defer to her. But if I know Sarah has been drinking, or if I know she's hopelessly optimistic about the weather because she wants to go to the park, I don't defer. I don't call myself 'incoherent' for ignoring Sarah's biased opinion. So why is ignoring my future, pill-popped self any different?

  **Julian:** Because Sarah is external. You have independent data on her biases. With yourself, the presumption of rationality is default. You don't have a 'view from nowhere' on your own mind. Unless you have specific reason to suspect impairment—like the pill—you must assume your future self is updating on evidence you don't yet have.

  **Eleanor:** But that's the thing. We *do* have specific reasons. We know about confirmation bias. We know about fatigue. I know that at 6 a.m., I am a pessimist. At 6 p.m., I'm an optimist. If I'm making a plan at noon, do I defer to the 6 a.m. self or the 6 p.m. self? Reflection says I should align with my expected future credence. But my expected future credence fluctuates based on circadian rhythms, not evidence.

  **Julian:** Then you shouldn't expect your future credence to be driven by the rhythm. You should correct for it. If you know you're prone to optimism in the evening, you should discount it.

  **Eleanor:** Exactly! You're describing a process of *correction*. You're saying, 'Calculate what your future self will think, then adjust for their known flaws.' But Reflection says, 'Adopt what your future self thinks.' If I have to adjust for flaws, I'm not reflecting; I'm modelling. And if I'm modelling, I might conclude my future self is wrong.

  **Julian:** You're conflating the ideal with the implementation. In an ideal Bayesian agent, there are no circadian rhythms. There is only evidence. For us, Reflection is a regulative ideal. If you violate it without cause, you're admitting you think your future self is likely to be wrong. If you think your future self is likely to be wrong, why are you letting them make decisions tomorrow?

  **Eleanor:** Because I have to let someone make them! I can't stay in the present forever. Look, let's go back to the friend case. It's clearer there. If I know Sarah is systematically overoptimistic about tech stocks, I don't align my credence with hers. I don't call myself incoherent. I call myself sensible. Now, is the self-case genuinely different? Or is it just the friend case where the introspective data is messier?

  **Julian:** It's different. With Sarah, you have a track record. You can see the divergence between her confidence and the world. With yourself, you are the track record. To doubt your future self's rationality is to doubt your own capacity to reason. It's self-undermining.

  **Eleanor:** Is it? Or is it just humility? I know I get tired. I know I get emotional. If I resolve tonight not to buy a car tomorrow because I know tomorrow I'll be charmed by the salesman, I'm violating Reflection. Tomorrow I'll want the car. Tonight I don't. If I respected Reflection, I'd buy the car now, or at least be indifferent.

  **Julian:** That's weakness of will, not credence.

  **Eleanor:** Is it? What if it's about the *value* of the car? Tomorrow I'll believe it's worth twenty grand. Tonight I believe it's worth ten. If I know tomorrow I'll believe it's worth twenty, Reflection says I should believe it's worth twenty now.

  **Julian:** No, no. Reflection is about *credence*, not *value*. It's about truth conditions.

  **Eleanor:** But beliefs drive actions. If I know I'll accept a bet tomorrow that I'd reject today, and I don't intervene, I'm allowing myself to be money-pumped. You said it yourself earlier—Reflection prevents the bookie from milking you. But if I know my future self will accept a bad bet because of the pill, or because of the salesman, the only way to stop the milking is to *violate* Reflection. I must lock myself out of the market. I must say, 'Tomorrow you will be wrong, so today I am binding you.'

  **Julian:** That's pre-commitment. It's compatible with Reflection. You pre-commit *because* you know your future credences will be skewed. But notice what you're doing: you're acknowledging that in the future state, you won't be rational. So Reflection doesn't apply to that state.

  **Eleanor:** So Reflection only applies when you're perfect?

  **Julian:** No. When you're *rationally updating*.

  **Eleanor:** But how do I know, right now, if tomorrow I'll be rationally updating? I can't know. I have to guess. And if I guess I might be biased, I don't reflect. So Reflection isn't a constraint on my current credence. It's a constraint on my *assessment* of my future self.

  **Julian:** You're trying to turn a structural requirement into a heuristic. It's not like checking the weather to see if you need an umbrella. It's like checking if you're breathing. If you have to ask, 'Should I reflect?', you've already lost the plot. The point is that rationality requires a unity of the agent over time. If you treat your future self as a separate entity with its own errors, you've fragmented the agent.

  **Eleanor:** But I *am* fragmented! I'm a biological organism that changes. The 'unity of the agent' is a nice story we tell to make sense of responsibility. But if I'm choosing between treating Reflection as a logical law and treating it as a rule of thumb that fails when I take pills or get tired, I'll take the rule of thumb. A logical law shouldn't have exceptions carved out for 'chemical tampering' and 'fatigue'.

  **Julian:** Gravity has exceptions too. If I catch a ball, it doesn't fall. That doesn't mean gravity isn't a law. It means there are intervening forces. The pill is an intervening force.

  **Eleanor:** But with gravity, we can measure the force. With my own mind? I'm relying on my mind to tell me my mind is broken. It's circular.

  **Julian:** It's recursive, not circular. Look, let's talk about the nature of the violation. You keep comparing it to making a bad plan. Ordering the next round when you know you'll regret it.

  **Eleanor:** Exactly. It's a strategic error.

  **Julian:** It's not. If you violate Reflection, you are effectively asserting that $P(A) \neq E[P_{future}(A)]$. You're saying your current best guess is different from your expectation of your future best guess. That implies you think your future self has information you don't, or that you're smarter than you will be. If it's the former, you should update now. If it's the latter, you shouldn't trust yourself later. But you can't just sit in the middle and say, 'I know I'll think X later, but I think Y now, and that's fine.' That's saying, 'I know I'll be rational later, but I choose to be irrational now.'

  **Eleanor:** Or, 'I know I'll be biased later, so I'm being rational now by ignoring my future self.'

  **Julian:** But if you *know* you'll be biased, your expectation of your future credence should *already* factor that in. If you expect the pill to make you 90% confident, but you know the pill is noise, your *rational expectation* of your future credence isn't 90%. It's whatever the evidence warrants.

  **Eleanor:** Wait. Are you saying I should expect my future self to be rational even when I know they've taken the pill?

  **Julian:** I'm saying you should expect your future *credence* to be 90%, but you shouldn't let that dictate your *current* credence because you know the 90% is unmoored. Reflection says: $C_{now}(A | C_{future}(A) = x) = x$. But if you know the future credence is caused by a pill, the conditional changes. You're conditioning on 'Future self believes A *because of pill*'.

  **Eleanor:** So the principle holds, but the conditions are rarely met?

  **Julian:** The principle holds for rational agents. We are aspiring rational agents.

  **Eleanor:** This is what frustrates me. You keep retreating to 'rational agents'. But we're talking about *us*. In the real world, if I tell a student, 'You must align your beliefs with your future beliefs,' they'll say, 'What if I'm going to be drunk?' And I'll say, 'Don't be drunk.' And they'll say, 'What if I'm going to be sad?' And I'll say, 'Well, then don't reflect.' At that point, Reflection isn't guiding anything. It's just a label for 'Do what a perfect agent would do.'

  **Julian:** It's a norm, Eleanor. Speed limits are norms. Just because you can drive faster on an empty motorway doesn't mean the limit isn't real. It tells you where the danger lies. Violating Reflection is the danger zone. It's where diachronic exploitation happens.

  **Eleanor:** But sometimes the danger zone is the only way through. If I'm depressed, I know my future self will think everything is hopeless. If I reflect, I become hopeless now. To survive, I must refuse to defer to my future self. I must say, 'You will be wrong tomorrow.' Is that irrational?

  **Julian:** It's survival. But is it rationality? Perhaps rationality isn't always conducive to survival in the short term.

  **Eleanor:** That's a damning admission for a theory of rationality.

  **Julian:** Not at all. Rationality is about coherence. Survival is about outcomes. You can be coherent and lose. You can be incoherent and win. But if you want to call yourself a rational agent, you aim for coherence.

  **Eleanor:** I'd rather call myself a sensible human. And a sensible human knows that trust must be earned, even from oneself. If my future self has a history of panic, I don't give them the keys.

  **Julian:** Then you've ceased to view them as *you*. You've objectified your future self.

  **Eleanor:** Maybe. Or maybe I've realised that 'I' am a sequence of stages, and the current stage has a duty to protect the whole sequence, even if it means overruling the next stage.

  **Julian:** That's tyranny.

  **Eleanor:** That's parenting. And we are all parents to our future selves. Sometimes the child knows best. Sometimes they don't. Reflection assumes the child is always right.

  **Julian:** Reflection assumes the child is *you*.

  **Eleanor:** *(Signals the barman for another round)* And if I know the child is going to order a double whisky when they should be driving?

  **Julian:** Then you don't give them the money. But you still respect that, in their shoes, they'd want it.

  **Eleanor:** No. I respect that they'll *want* it. I don't respect that they're *right* to want it. Reflection conflates the prediction of belief with the endorsement of belief. I can predict I'll be wrong without endorsing the error.

  **Julian:** But if you predict you'll believe it, and you don't believe it now, you're betting against yourself.

  **Eleanor:** I'm hedging. And hedging is sensible.

  **Julian:** Hedging is admitting you don't trust your own reasoning.

  **Eleanor:** *(The drinks arrive)* Precisely. And sometimes, Julian, you shouldn't.

  **Julian:** *(Raises his glass)* To coherence, then.

  **Eleanor:** To survival.

  *(They drink. Neither looks entirely satisfied.)*
