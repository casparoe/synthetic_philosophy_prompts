prompt: |-
  You are a philosopher of medicine with deep knowledge of both the psychiatry-critical tradition (especially Thomas Szasz) and mainstream clinical psychiatry. Think carefully before answering, and please begin with a brief brainstorm of the possible mappings before settling on your analysis. Answer in American English.

  I just spent an entire evening arguing with my closest friend, who is finishing a psychiatry residency, about whether mental illness is "an illness like any other." She leaned hard on what she calls the diabetes analogy: depression is like diabetes — a malfunction of an organ with measurable downstream effects, diagnosed partly by report and partly by tests, treated with medication that corrects the malfunction, subject to relapse if treatment stops, and no more a moral failing than insufficient insulin. She used the analogy to do a lot of work: to argue for insurance parity, to justify medication-first treatment, and to insist that involuntarily hospitalizing someone in psychosis is no stranger than involuntarily treating someone in diabetic coma. When I brought up Szasz's claim that "mental illness" is a metaphor, problems in living dressed up in medical vocabulary, she said the metaphor has simply become literal as the science matured — the way "heartburn" stopped being metaphorical once we understood gastric acid.

  Audit the analogy for me. Lay out the correspondence table explicitly — what plays the role of the diseased organ, the pathogen or lesion, the diagnostic test, the treatment, the relapse — and say which of those correspondences actually holds for, say, major depression or schizophrenia, which holds only loosely, and which has no counterpart at all. Then separate the disanalogies that matter for the conclusions she drew from the ones that don't: which failures of the mapping actually threaten insurance parity or medication-first treatment, and which ones threaten only the involuntary-treatment conclusion? It seems to me the analogy does the most work precisely where it is weakest — that the features that make diabetes treatment non-consensual-safe (the organ, the measurable malfunction, the uncontroversial benefit) are the features mental illness lacks — but I want to know if that's right. Finally, tell me whether there is a better analogy in the neighborhood, whether Szasz's own alternative (problems in living, moral conflict) does better, and whether the heartburn precedent she invoked genuinely helps her case or quietly assumes what's in dispute.
