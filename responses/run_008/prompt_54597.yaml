  2. How should accuracy be defined when truth is settled only retrospectively? This determines your scoring rules. Modellers can resolve this by treating the realized history as the unique actual world for evaluation, rendering the prior indeterminacy irrelevant to performance metrics.

  3. How should objective chance constrain subjective credence in branching time? This affects calibration. You can operationalize this as a frequency-matching problem without needing to define whether chances are real properties or merely summary statistics of branches.

  4. Are truth values relative to the time of assessment? This matters for communicating updates. Adopting a relativist semantics protects analysts from accusations of error when a high-probability event fails to occur on the actualized branch.

  5. Does the Thin Red Line theory alter probabilistic aggregation? This is the lowest priority. The mathematical formalism of probability spaces remains invariant regardless of whether you metaphysically privilege one branch over others, making this a purely philosophical dispute with no operational consequence.
