answer: |-
  ### Predictions

  **1. The Reformed Kidney Market: Banned.**
  Despite the safeguards against desperation and the provision of long-term care, your adviser will likely maintain the prohibition. Her original ruling against kidney sales appears rooted in the nature of the good itself (a vital, non-regenerative organ) rather than solely the conditions of the sale. If her objection were purely about exploitation, the reformed system would satisfy her; since the baseline prohibition exists, she likely views the kidney as an "inalienable" aspect of personhood that cannot be converted into property, regardless of consent or price.

  **2. Citizenship for Sale: Banned.**
  She will likely rule against the sale of citizenship. This aligns directly with her ruling on voting. Both voting and citizenship constitute membership in the political community. To commodify them is to treat political equality as a market good, corrupting the normative foundation of the state. Since the buyers are wealthy and the state is the seller, a "vulnerability" principle might permit this; a "meaning" principle forbids it. Given her vote ruling, the latter will prevail.

  ### The Candidate Principles

  Based on her track record, two distinct jurisprudential principles explain her rulings, but they diverge on the new cases.

  **Principle A: The Corruption of Meaning (Normative Boundaries)**
  *   **Thesis:** Markets are impermissible when the act of buying and selling degrades the intrinsic value of the good or undermines the social norms constitutive of it.
  *   **Fit:**
      *   *Votes:* Selling votes corrupts democratic equality.
      *   *Kidneys:* Selling organs commodifies the human body, violating dignity/integrity.
      *   *Price Gouging:* Profiting from disaster violates norms of community solidarity.
      *   *Plasma/Eggs/Drug Trials:* These are viewed as "services" or "regenerative contributions" rather than the alienation of the self; paying for them does not corrupt the meaning of medical science or bodily autonomy.
  *   **Implication:** Bans the Reformed Kidney (body integrity) and Citizenship (political integrity).

  **Principle B: The Vulnerability and Irreversibility Constraint (Protective Autonomy)**
  *   **Thesis:** Markets are impermissible only when they exploit acute vulnerability (desperation) *and/or* impose significant, irreversible bodily harm. Where consent is informed and harm is reversible or managed, payment is permissible.
  *   **Fit:**
      *   *Kidneys:* Irreversible harm + high risk of desperation.
      *   *Price Gouging:* Exploits acute vulnerability/duress.
      *   *Plasma/Eggs/Drug Trials:* Risks are managed, tissues are regenerative (or risks are accepted by volunteers), and she explicitly dismissed the "poverty" argument for plasma, suggesting desperation alone isn't a ban-trigger without irreversible harm.
  *   **Implication:** Allows the Reformed Kidney (no desperation, care provided) and Citizenship (no vulnerable seller, wealthy buyers).

  ### The Bet

  **I would bet on Principle A (The Corruption of Meaning).**

  **Why:**
  1.  **The Vote Ruling is the Smoking Gun:** There is no plausible "vulnerability" argument for banning the sale of votes outright. Voters are not necessarily desperate, and selling a vote doesn't cause bodily harm. The only reason to ban it is that it corrupts the *meaning* of democracy. This establishes that she accepts normative corruption as a sufficient ground for prohibition.
  2.  **The Plasma Dismissal:** When you raised the poverty of plasma donors, she was unmoved. If Principle B (Vulnerability) were her driving force, the economic coercion of poor donors should have given her pause, even if she ultimately allowed it. Her indifference suggests she does not view financial pressure as a veto on markets unless paired with a normative violation (like losing a kidney).
  3.  **The Kidney/Plasma Distinction:** The clearest line in her bioethics rulings is regenerative vs. non-regenerative. Plasma and eggs replenish; kidneys do not. This tracks with a view of bodily *integrity* (Meaning) rather than just risk management (Vulnerability).

  ### The Discriminating Case

  **The Case:** **Commercial Gestational Surrogacy (Highly Regulated).**
  *   **Scenario:** A jurisdiction proposes allowing compensated surrogacy where carriers are thoroughly screened for financial stability (no desperation), provided with top-tier medical care, legal representation, and psychological support, and paid a significant fee akin to high-skilled labor.

  **Why it Discriminates:**
  *   **Under Principle A (Meaning):** This should be **Banned**. Surrogacy commodifies reproduction and kinship, turning the womb into a factory and the child into a product. It corrupts the social meaning of motherhood and family, similar to how selling kidneys corrupts bodily integrity.
  *   **Under Principle B (Vulnerability):** This should be **Allowed**. Like egg donation and drug trials, it involves bodily service and risk, but if desperation is screened out and medical risks are managed, it fits her criteria for permissible compensated bodily contribution. It is not irreversible in the same way as losing a kidney.

  If she bans surrogacy despite the safeguards, she confirms that the *nature of the good* (Meaning) trumps the *conditions of the sale*. If she allows it, she reveals that her kidney ruling was actually about irreversible harm and exploitation all along, and the "Reformed Kidney" case should have been allowed.
