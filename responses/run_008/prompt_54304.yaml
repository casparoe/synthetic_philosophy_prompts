answer: |-
  You have put your finger on one of the most persistent and under-labeled tensions in Strawsonian theory. To answer your primary question directly: **No, there is no single, canonical term** in the literature that specifically labels this asymmetry of *defeasibility* regarding causal history.

  While the phenomenon is widely discussed, it is typically subsumed under broader headers like **"The Blame-Praise Asymmetry"** or **"The Problem of Constitutive Moral Luck."** However, neither of these captures the precise mechanism you are describing: that causal explanations function as *excuses* (defeaters) for negative attitudes but merely as *context* (non-defeaters) for positive ones.

  Since you have asked to coin a term if none exists, I propose we label this **The Asymmetry of Causal Defeasibility**. Below, I define it precisely, map its boundaries, and explain why it arises within a Strawsonian framework.

  ---

  ### 1. The Term: The Asymmetry of Causal Defeasibility

  **Definition:**
  The **Asymmetry of Causal Defeasibility** is the phenomenon wherein causal-historical explanations of an agent's character or actions (e.g., upbringing, constitution, psychological conditioning) function as *defeaters* for negative reactive attitudes (resentment, indignation, blame) but fail to function as defeaters for positive reactive attitudes (gratitude, approbation, praise).

  **The Core Mechanism:**
  *   **Negative Side:** A causal story (e.g., "He stole because of childhood trauma") tends to reclassify the act from a *manifestation of ill will* to a *symptom of misfortune*, thereby invoking an excuse or exemption that dissolves resentment.
  *   **Positive Side:** A parallel causal story (e.g., "She helped because of a fortunate upbringing") tends to reclassify the act from a *mere accident* to a *stable manifestation of good will*, thereby sustaining or deepening gratitude.

  ### 2. Boundaries and Scope

  You asked specifically about third-party attitudes, self-attitudes, and self-explanation. Here is how the Asymmetry of Causal Defeasibility maps onto those domains:

  #### A. Second-Party vs. Third-Party (Resentment vs. Indignation)
  *   **Verdict:** The asymmetry holds for both.
  *   **Analysis:** Just as personal resentment dissolves when I learn my friend's slight was caused by severe depression (exemption), third-party indignation dissolves when I learn a criminal's violence was the result of coercive programming. Conversely, personal gratitude persists despite a friend's "lucky" character, just as public approbation persists for a hero whose virtue was nurtured by a supportive society. The asymmetry is structural to the reactive attitudes themselves, not merely to the personal relationship.

  #### B. Self-Reactive Attitudes (Shame vs. Pride)
  *   **Verdict:** The asymmetry holds, but with greater friction.
  *   **Analysis:**
      *   **Shame/Guilt:** If I come to understand my own harmful behavior as the inevitable output of past trauma (a causal story), therapeutic frameworks encourage the dissolution of shame. The causal story acts as a defeater.
      *   **Pride:** If I come to understand my own virtue as the inevitable output of good parenting and genetic luck, pride is *not* necessarily defeated. While humility might temper it, we do not typically feel that our good deeds are "not ours" in the same way we might feel our bad deeds were "not us" under duress.
      *   **Boundary Condition:** The asymmetry weakens here if the agent adopts a hard determinist view. If *I* believe my virtue is entirely luck, pride may dissolve into a sense of mere fortune. However, in ordinary moral practice, pride remains resilient where shame is fragile.

  #### C. Agent Self-Explanation (Modesty Norms)
  *   **Verdict:** This is the critical boundary where the asymmetry can reverse.
  *   **Analysis:** If *I* discover causally why *you* were kind, gratitude persists. However, if *you* explicitly explain your own kindness causally ("I helped you only because my upbringing made me unable to say no"), gratitude *can* be defeated.
  *   **Why:** This touches on norms of **sincerity and modesty**. When an agent cites causal luck to explain their own virtue, it can signal a lack of *commitment* to the value of the act. It suggests the good will was not fully "owned." Thus, the Asymmetry of Causal Defeasibility applies to *observer-discovered* causes, but not necessarily to *agent-cited* causes.

  ### 3. Why This Asymmetry Exists (The Strawsonian Explanation)

  If you are presenting this in a seminar, you will need to explain *why* this asymmetry exists without abandoning Strawson's core thesis. The key lies in Strawson's concept of **Quality of Will**.

  1.  **The Default Assumption:** In Strawsonian participation, we assume agents are responsible (capable of good will) unless proven otherwise.
  2.  **Negative Attitudes require a Violation:** Resentment is a response to a *violation* of a reasonable expectation of good will. A causal story (coercion, insanity, trauma) demonstrates that the expectation was unreasonable or that the will was not fully engaged. It proves the *absence* of ill will (or the absence of a will capable of choosing otherwise). Therefore, the causal story **negates the condition** for resentment.
  3.  **Positive Attitudes require a Fulfillment:** Gratitude is a response to the *fulfillment* (or exceeding) of a hope for good will. A causal story (good upbringing) explains *how* the good will was formed, but it does not prove the *absence* of good will. In fact, it often confirms the stability of that good will. Therefore, the causal story **does not negate the condition** for gratitude.

  **In short:** Causal explanations tend to show that bad acts were *not* expressions of the agent's true will (excuse), whereas they tend to show that good acts *were* expressions of the agent's true will (explanation).

  ### 4. Relevant Literature for Your Seminar

  While there is no single label, you should reference these discussions to show you know the landscape:

  *   **Thomas Nagel, "Moral Luck":** Nagel identifies **Constitutive Luck** (the luck of who you are). He argues that if we are consistent, luck should undermine praise just as it undermines blame. The fact that it doesn't is the puzzle you are identifying.
  *   **R. Jay Wallace, *Responsibility and the Moral Sentiments*:** Wallace defends a Strawsonian view but grapples with whether causal history undermines the "quality of will." He leans toward the view that only specific kinds of causal constraints (coercion) defeat responsibility, not general constitutive luck.
  *   **Susan Wolf, "Sanity and the Metaphysics of Responsibility":** Wolf suggests an asymmetry where we require "deep responsibility" for blame but perhaps less for praise. This supports the idea that the bar for defeating gratitude is higher than the bar for defeating resentment.
  *   **T.M. Scanlon, *Moral Dimensions*:** Scanlon distinguishes between **attributability** (is this act theirs?) and **accountability** (can we blame them?). Causal stories often attack accountability (blame) without attacking attributability (praise).

  ### 5. Summary for Seminar Discussion

  If you raise this in seminar, you might frame it this way:

  > "Strawson argues that reactive attitudes form a web we cannot selectively abandon without opting out of human relationships entirely. However, there appears to be an internal asymmetry within that web. We allow causal explanations to sever the link between agent and act in the case of **resentment** (via excuses/exemptions), but we refuse to let those same explanations sever the link in the case of **gratitude**. I am calling this **The Asymmetry of Causal Defeasibility**. Does this suggest that the 'Quality of Will' is interpreted differently depending on the valence of the act? Or does it suggest that our commitment to holding people responsible is actually stronger for praise than for blame?"

  This framing demonstrates a sophisticated grasp of the text while highlighting a genuine tension that Strawson himself leaves somewhat unresolved.
