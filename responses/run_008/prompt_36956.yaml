          *   *Mechanism:* Internal teleology. Not feedback-driven, but pre-programmed.
          *   *Dynamical Type:* Not a cycle. It's a transient trajectory on a heteroclinic orbit that ends at a fixed point (death). No return trip. It's a one-shot excitable medium.
          *   *Discreteness:* Seasons are qualitative labels on a continuous decay of vitality.

      *   **Toynbee (Challenge and Response):**
          *   *Concept:* Civilization grows if Creative Minority responds successfully to Challenge. Fails if response fails.
          *   *State Variable:* Civilizational Vitality ($V$).
          *   *Input:* Challenge ($C$).
          *   *Mechanism:* $V_{t+1} = f(V_t, C_t, \text{Response})$.
          *   *Dynamical Type:* Stochastic differential equation with a control term (Agency). Not a cycle per se, but a path-dependent walk. Breakdown happens if $C > \text{Response Capacity}$.
          *   *Agency:* The "Creative Minority" acts as a control function that can modulate the system's response to noise.

  3.  **Drafting the Residue Report:**

      *   *Numerology:* In dynamics, fixed periods (4 generations, 1000 years) imply autonomous oscillators with fixed eigenvalues. History isn't autonomous; it's forced. If the period is fixed, it suggests a biological clock (Spengler) or a specific decay constant (Khaldun). In dynamics, without a fixed parameter set, periods drift. If the period evaporates, the "cycle" becomes a "recurrence," which is weaker.
      *   *Agency:* Toynbee's "Creative Minority" is a control term $u(t)$ that is not determined by the state $x(t)$. In standard ODEs $\dot{x} = f(x)$, this doesn't exist. It requires $\dot{x} = f(x, u)$ where $u$ is exogenous or volitional. This breaks the closed-system assumption. It's either noise or a bifurcation parameter chosen by the system itself (reflexive control).
      *   *Reflexivity:* Polybius/Khaldun allow the observer to change the trajectory. This is the "Lucas Critique" in economics or the "Observer Effect" in quantum mechanics, but in social dynamics. A phase portrait assumes $\dot{x}$ depends only on $x$. If $\dot{x}$ depends on *knowledge of the phase portrait*, the vector field changes. This makes the system non-stationary.

  4.  **Developing the Judgment Call:**

