answer: |-
  This is a translation task that requires mapping semantic structures onto phase spaces. The risk, as you know, is forcing a vector field where there is only a narrative. However, treating these theories as candidate models reveals where their mechanical commitments lie and where they retreat into metaphor. Here is the reconstruction.

  ### I. Dynamical Reconstructions

  **1. Polybius: The Heteroclinic Cycle of Regimes**
  *   **State Variables:** Let $x$ represent the *concentration of power* and $y$ represent the *legitimacy/virtue* of the ruling principle.
  *   **Attractor Structure:** Polybius does not propose a limit cycle (a closed isolated trajectory). He proposes a **heteroclinic cycle**. Each constitution (Monarchy, Tyranny, Aristocracy, etc.) is a metastable equilibrium point (a saddle). The system lingers near a saddle until internal drift pushes it out of that basin of attraction.
  *   **Control Parameters:** The "corruption" of the ruling class acts as a slow bifurcation parameter. As virtue ($y$) decays, the stability of the current regime eigenvalue crosses zero.
  *   **Return Mechanism:** This is not a smooth return. It is a cascade. When Tyranny becomes unstable, the system does not flow gently to Aristocracy; it crashes through a bifurcation into a new basin. The "cycle" closes only because Ochlocracy (mob rule) creates the conditions (chaos) that make Monarchy (order) the new stable attractor.
  *   **Discrete vs. Continuous:** The six regimes are discrete basins. Mapping them to a continuous trajectory is a distortion *unless* viewed as a sequence of bifurcations. Polybius is describing a logical automaton of stability conditions, not a continuous flow. The "stages" are the only real objects; the transitions are singularities.

  **2. Ibn Khaldun: The Relaxation Oscillator of Solidarity**
  *   **State Variables:** Let $A$ be *'asabiyya* (group solidarity/cohesion) and $W$ be *wealth/urbanization*.
  *   **Attractor Structure:** This is a classic **relaxation oscillation**. There are two distinct timescales.
      1.  *Slow accumulation:* In the desert (low $W$), $A$ grows slowly (hardship builds cohesion).
      2.  *Fast release:* High $A$ allows conquest, rapidly increasing $W$.
      3.  *Slow decay:* High $W$ (city life) causes $A$ to decay (luxury softens the group).
      4.  *Fast collapse:* Low $A$ leads to vulnerability and rapid conquest by a new high-$A$ group.
  *   **Control Parameters:** The environment (desert vs. city) acts as the parameter switching the sign of the growth rate of $A$.
  *   **Return Mechanism:** The negative feedback is intrinsic: success (conquest) generates the condition (luxury) that destroys the cause of success (solidarity). This is a genuine limit cycle in the $(A, W)$ plane, provided the "desert" source of new $A$ is external and inexhaustible.
  *   **Discrete vs. Continuous:** The "four generations" are samples along the decay curve of $A$. The stages are not discrete states but regions of the trajectory defined by the value of $A$. This maps cleanly to continuous variables.

  **3. Spengler: The Transient Trajectory of Morphology**
  *   **State Variables:** "Cultural Soul" expression. This is ill-defined, but functionally it acts as *Civilizational Energy* ($E$).
  *   **Attractor Structure:** There is no attractor. There is no cycle. This is a **transient trajectory** on a heteroclinic orbit that terminates at a fixed point (Fossilization/Civilization).
  *   **Control Parameters:** Time is not a parameter; it is the independent variable. The "destiny" is baked into the initial conditions.
  *   **Return Mechanism:** There is none. Spengler explicitly denies the return trip. A culture is an organism; it dies. The "cycle" is only apparent if one views the succession of *different* cultures as a cycle, but there is no mechanism linking the death of one to the birth of another.
  *   **Discrete vs. Continuous:** The "seasons" are purely qualitative labels on a continuous decay of $E$. Discretizing this is a distortion. Spengler's model is topological (concerned with shape and connectivity) rather than dynamical (concerned with forces and rates of change).

  **4. Toynbee: The Stochastic Control System**
  *   **State Variables:** Civilizational Vitality ($V$).
  *   **Attractor Structure:** A **bistable system** with a "Growth" basin and a "Breakdown" basin.
  *   **Control Parameters:** The magnitude of Challenge ($C$) and the efficacy of Response ($R$).
  *   **Return Mechanism:** This is not a cycle; it is a **random walk with control**. $V_{t+1} = V_t + f(C_t, R_t)$. If $R$ matches $C$, $V$ grows. If $C$ overwhelms $R$, $V$ collapses. The "cycle" is merely the historical observation of multiple civilizations undergoing this trajectory.
  *   **Discrete vs. Continuous:** Toynbee's "stages" (Genesis, Growth, Breakdown, Disintegration) are phase transitions. They map to bifurcations where the control parameter $R$ fails to compensate for noise $C$.

  ---

  ### II. The Residue Report

  **1. Numerology (Fixed Periods)**
  In dynamical systems, a fixed period (Khaldun's 4 generations, Spengler's 1000 years) implies an **autonomous oscillator** with fixed eigenvalues.
  *   **Khaldun:** The 4-generation rule translates to a specific decay constant $\lambda$ for solidarity in an urban environment. If $A(t) = A_0 e^{-\lambda t}$, the "4 generations" is simply the time to cross a stability threshold. This is respectable dynamics *if* $\lambda$ is constant. Historically, it isn't. If the period evaporates, Khaldun retains a *recurrence relation* (solidarity decays in cities), but loses the predictive clock.
  *   **Spengler:** The millennium is a biological metaphor, not a dynamical period. It implies a pre-programmed lifespan. In dynamics, this is a "ticking bomb" variable independent of state. If you remove the fixed period from Spengler, you remove the "destiny." Nothing remains but a decay curve.
  *   **Verdict:** Numerology is the first thing to fail in a non-autonomous system. Khaldun survives as a qualitative oscillator; Spengler collapses into poetry.

  **2. Agency (The Creative Minority)**
  Toynbee's "Creative Minority" is a **control input** $u(t)$ that is not determined by the state $x(t)$.
  *   In a closed ODE $\dot{x} = f(x)$, the future is determined by the present. Toynbee posits $\dot{x} = f(x, u)$, where $u$ is volitional.
  *   In phase space, this looks like **noise**, but Toynbee insists it is *directed*. It is a **time-dependent parameter** chosen by the system itself. This breaks the closure of the dynamical system. It requires a second-order model where the system models itself to generate $u$.
  *   **Verdict:** Agency cannot be represented in a standard phase portrait. It requires **control theory**. Toynbee is describing a cybernetic system, but he treats the controller as a "heroic" variable rather than a feedback function.

  **3. Reflexivity (The Observer Effect)**
  Polybius and Khaldun allow the agents to read the model.
  *   If the vector field $f(x)$ depends on the agents' belief about $x$, the system is **non-stationary**. The phase portrait changes as the agents learn the portrait.
  *   Polybius expects the Roman reader to see the "Ochlocracy" coming and legislate. This is **feedback control** based on state estimation.
  *   **Verdict:** Standard dynamical vocabulary assumes an observer outside the system. A reflexive history requires **game-theoretic dynamics** or **adaptive systems** where the equations of motion evolve. The "cycle" is not a property of the system, but of the system's *ignorance* of the system. Once known, the cycle should theoretically break (the Lucas Critique).

  ---

  ### III. The Judgment Call

  Your suspicion is that Polybius and Ibn Khaldun are proto-dynamical (sparse but real models), while Spengler and Toynbee are morphological metaphors wearing the costume of mechanism. I argue that this assessment is half-right but misidentifies the strongest candidate.

  **1. Polybius is not Dynamical; he is Logical.**
  You suspect Polybius is proto-dynamical. I argue he is not. His *anacyclosis* is a sequence of logical necessities, not a flow. Tyranny *must* become Aristocracy because of the definition of virtue, not because of a feedback loop. In dynamical terms, Polybius describes a **Markov Chain** of discrete states with transition probabilities of 1.0. There is no state variable that "grows and decays" continuously; there is only the binary stability of the regime. He offers a syntax of power, not a dynamics of power. The "cycle" is a logical loop, not a trajectory.

  **2. Ibn Khaldun is the Only True Dynamical System.**
  Khaldun is the one you might be underestimating. He identifies a physical resource ('asabiyya), a consumption mechanism (luxury), and a regeneration mechanism (hardship). This is a **closed-loop feedback system**. The relaxation oscillation is not a metaphor; it is the structural consequence of the resource constraint. He is the only one who describes a system that *must* oscillate given the parameters, regardless of the specific actors. He is a proto-nonlinear-dynamicist.

  **3. Spengler is Topology, Not Dynamics.**
  Your suspicion that Spengler is metaphorical is correct, but the distinction is deeper. Spengler is not doing dynamics (forces causing change); he is doing **topology** (properties preserved under deformation). He cares about the *shape* of the history, not the *equations* of motion. A "millennium" in Spengler is not a period; it is a scaling factor for the shape. Calling it a failed dynamical model critiques him for a game he isn't playing. He is asserting that history is a manifold of distinct, non-intersecting curves.

  **4. Toynbee is Cybernetics without the Math.**
  Toynbee is not a cyclical theorist in the same sense. He is a **control theorist** who lacks the vocabulary for control. The "Creative Minority" is a controller intended to stabilize an unstable system (Civilization). His failure is not metaphorical; it is **under-specification**. He identifies the feedback loop (Challenge-Response) but leaves the transfer function undefined.

  **Conclusion:**
  Your vocabulary does not miss what they were tracking; rather, their claims were rarely precise enough to be modeled.
  *   **Khaldun** is the exception: He tracked a genuine relaxation oscillation. The residue (numerology) is just parameter estimation error.
  *   **Polybius** tracked a logical automaton. The residue (reflexivity) shows he knew the system was open to intervention, which breaks the automaton.
  *   **Spengler** tracked a topological classification. The residue (numerology) is aesthetic, not mechanical.
  *   **Toynbee** tracked a control problem. The residue (agency) is the control variable he could not formalize.

  The "cycle" in history is rarely a limit cycle. In Khaldun, it is a relaxation oscillation driven by resource depletion. In the others, it is either a logical sequence (Polybius), a morphological analogy (Spengler), or a control failure (Toynbee). Your dynamical vocabulary exposes that **only Khaldun proposed a mechanism that forces recurrence.** The rest proposed patterns that *look* like recurrence but rely on exogenous resets or metaphorical destinies. The "cycle" is mostly a narrative device to impose closure on open systems. Khaldun is the only one who found the closed loop.
