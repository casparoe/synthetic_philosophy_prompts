          *   The state of the *agent* matters, not just the state of the *world*.
      *   **Plato's Actual Answer:** Mention the "Tying Down" analogy (statues of Daedalus). True beliefs flee; knowledge stays. This addresses stability, which Step 3 tries to wave away ("if he never travels again").
      *   **The Cost:** What does the user give up?
