      *   **Rorty on Truth:** Does Rorty call his view a "coherence view"? In *PMN* and subsequent works, Rorty is wary of traditional "theories of truth." He often equates truth with warranted assertibility *for us*, but he explicitly denies he is offering a *theory* of truth in the traditional sense (deflationism). However, he does contrast it with correspondence. Calling it a "coherence view" is often considered a simplification or slight misreading, as coherence theories usually imply truth *is* coherence, whereas Rorty often says truth is indefinable but justification is coherence-like. *Verdict:* Partly correct/Minor error.
