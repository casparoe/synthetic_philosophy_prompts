answer: |-
  Yes, there is absolutely a name for this. You are describing a classic concept in decision theory and economics called a **Money Pump**.

  The fact that your econ classmate mentioned "revealed preference" shows they heard the terms but didn't understand the implication. In standard economic theory, the Money Pump argument is actually used to *prove* that rational people *cannot* have the kind of preferences your friend's brother has. If you can be money-pumped, you are, by definition, acting irrationally according to standard models.

  Here is the breakdown of the names, the connection between the two scenarios, and exactly where the "mistake" lives.

  ### 1. The Card Game: The Money Pump
  The scenario with the cards is a textbook **Money Pump**.

  In economics, a rational agent is assumed to have **transitive preferences**. This means if you prefer A over B, and B over C, you must prefer A over C.
  *   **Rational:** A > B and B > C $\rightarrow$ A > C.
  *   **Your Friend's Brother:** B > A, then C > B, then A > C.

  This creates a cycle (A > B > C > A). Because his preferences cycle like Rock-Paper-Scissors, the older kid can keep spinning the wheel, taking a little bit of cash ("grease") every time the wheel turns.

  **Is he being "dumb"?**
  Not necessarily on a cognitive level, but he is violating the **Axiom of Transitivity**. The older kid isn't just lucky; he is acting as an **arbitrageur**. He has identified a price inconsistency in the brother's valuation of cards and is exploiting it. The "mistake" isn't that the brother likes Card B more than Card A at 10:00 AM. The mistake is that his preference system allows for a cycle that can be exploited.

  ### 2. The Homework: Dynamic Inconsistency
  What you do to yourself is technically called **Dynamic Inconsistency** (or Time Inconsistency), often driven by **Hyperbolic Discounting**.

  *   **Friday You:** Values "Leisure Now" > "Stress Later."
  *   **Sunday You:** Values "No Stress Now" > "Leisure Then (in the past)."

  Your preferences reverse depending on *when* you are asked. This is structurally identical to the card game, but instead of cycling through cards (A $\rightarrow$ B $\rightarrow$ C), you are cycling through time (Friday $\rightarrow$ Sunday $\rightarrow$ Friday).

  ### 3. Are they the same phenomenon?
  **Yes.** They are the same logical structure applied to different dimensions.

  *   **The Card Game** is a **Spatial Money Pump**. You trade across different objects (Cards) in the same time period.
  *   **The Homework** is a **Temporal Money Pump**. You trade across different time periods (Friday vs. Sunday) with the same object (Homework).

  In both cases, there is a **Cyclic Preference**.
  *   **Card Brother:** Values B > A, C > B, A > C.
  *   **You:** Value Leisure > Work (Friday), Work > Leisure (Sunday).

  In both cases, the cycle results in a **Net Utility Loss**. The brother loses \$6 for the same card. You lose weekend relaxation and get the same grade you would have gotten if you started Friday.

  ### 4. Where exactly is the mistake?
  This is the deepest philosophical question in your post.

  **Is any single trade a mistake?**
  **No.** This is the trap. At the exact moment of the trade, the agent (brother or you) is maximizing their utility *based on their current state*.
  *   Brother *does* want Card B more than Card A at 10:00 AM.
  *   Friday You *does* want to relax more than work.

  If you stopped the video at any single frame, the decision looks rational. This is called **Local Rationality**.

  **So where is the irrationality?**
  The irrationality is **Global**. It exists in the **structure of the preferences**, not the individual choices. The mistake is failing to recognize that your preferences are inconsistent over the loop.

  In economics, this is a failure of **Metacognition** (thinking about your own thinking). The rational move isn't to make a different trade in the moment; the rational move is to **Pre-Commit**.
  *   **Card Brother:** Should have a rule: "I do not trade cards I bought today."
  *   **You:** Should use a commitment device: "I will pay a friend \$50 if I don't start homework by Friday night."

  The mistake is entering the cycle without a mechanism to stop it.

  ### 5. What about "Revealed Preference"?
  Your classmate is misunderstanding the theory. **Revealed Preference Theory** states that we can determine a person's preferences by observing their choices.
  *   If you choose B over A, you "reveal" you prefer B.
  *   If you later choose A over B, you have **violated** the Weak Axiom of Revealed Preference (WARP).

  Your classmate thinks Revealed Preference explains *why* he did it. Actually, Revealed Preference proves he is being **inconsistent**. If his preferences were stable, he couldn't be pumped. The fact that he *can* be pumped proves his revealed preferences are contradictory.

  ### 6. Scope and Application (The "Coining" Part)
  Since "Money Pump" already exists for the card game, and "Dynamic Inconsistency" exists for the time game, you don't need a new word. However, behavioral economists often group these under **Cyclic Preferences** or **Dutch Book Arguments**.

  To answer your specific questions on scope:

  *   **Does it apply when the loop takes a month?**
      Yes. This is common in subscription services. You sign up for a free trial (Gain A), forget to cancel (Loss \$), cancel (Gain Relief), then sign up again next month because you forgot (Gain A). You are money-pumped on a monthly cycle.
  *   **Does it apply when it isn't money?**
      Yes. It applies to **Utility** (happiness/satisfaction). In your homework example, you are pumping your own *peace of mind*. You pay in stress to get leisure, then pay in leisure to get rid of stress, ending up with less of both.
  *   **Does it apply when nobody profits off you?**
      Yes. This is called a **Deadweight Loss**. In the card game, the money goes to the older kid (transfer). In your homework scenario, the "money" (stress/time) just vanishes into the void. You are both the pump and the pumper. This is often called **Self-Sabotage** or **Intrapersonal Conflict**.

  ### Summary
  *   **The Name:** **Money Pump** (for the cards) and **Dynamic Inconsistency** (for the homework). Together, they are examples of **Intransitive/Cyclic Preferences**.
  *   **The Mistake:** It is not in the individual trade (which feels good), but in the **lack of a consistent preference system** and the **failure to pre-commit** to stopping the cycle.
  *   **The Lesson:** Rationality isn't just about making the best choice *now*; it's about making choices that your future self won't regret. If you can be tricked into a loop, your decision-making framework is flawed, even if your individual choices feel right.

  The older kid isn't just bullying your friend's brother; he's teaching him a brutal lesson in Behavioral Economics 101. Your friend's brother needs a **commitment device** (like a rule against trading the same card twice in a day), and you need one for your homework (like a study group you'd be embarrassed to skip).
