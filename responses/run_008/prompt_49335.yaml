prompt: |-
  Me and a friend argued til like 2am about Brexit and I'm still chewing on it. Her claim was that the whole 2016–2019 saga is basically a case study in the populist conception of the will of the people: one people, one voice, a 52–48 split gets converted into a single unified mandate, and anyone who gets in the way -- the judges in the Miller case (and the tabloid that branded them enemies of the people), MPs blocking no-deal, the people marching for a second vote -- gets recast as an elite frustrating the popular will rather than part of the demos. I kept pushing back that this is just what referendums do, majoritarian politics, not populism per se. So: analyze Brexit through the lens of the will of the people. Who was supposed to count as the people, what the theory says each actor was doing, and which parts of what actually happened it genuinely explains. But also be honest about where it breaks -- e.g. the 2019 election produced a landslide for get Brexit done with a different coalition than the 52% (loads of Leave-Labour seats flipping, etc.), so was that the same will of the people or a different one, and can the theory even tell? And tell me if the theory ends up explaining too much, where literally any outcome counts as the will of the people surfacing or being blocked.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Request:**
      *   **Context:** A late-night argument (2am) about Brexit between the user and a friend.
      *   **Friend's Claim:** Brexit (2016-2019) is a case study in *populist* conception of "the will of the people" (one people, one voice, 52% = 100% mandate, opponents = elite blockers).
      *   **User's Counter:** This is just standard majoritarian politics/referendums, not necessarily populism *per se*.
      *   **Task:** Analyze Brexit through the lens of "the will of the people."
      *   **Specific Questions to Address:**
          *   Who counts as "the people"?
          *   What does the theory say each actor (judges, MPs, protesters, government) was doing?
          *   Which parts of reality does this theory genuinely explain?
          *   Where does it break? (Specifically mention the 2019 election landslide vs. the 2016 referendum coalition).
          *   Does the theory explain *too much* (tautology risk)?
      *   **Tone:** Analytical, balanced, honest about limitations, acknowledging the complexity (since they were arguing till 2am, they want depth).

  2.  **Initial Brainstorming & Theoretical Framework:**
      *   *Populism Definition:* Mudde's definition is standard here: "Thin-centered ideology that considers society to be ultimately separated into two homogeneous and antagonistic camps: 'the pure people' versus 'the corrupt elite'." Key feature: Monism (the people have one single will).
      *   *Liberal Democracy Definition:* Pluralism. The people have many wills. Institutions mediate conflict. Minorities have rights.
      *   *The "Will of the People" (WotP):* In Brexit, this became a slogan ("Brexit means Brexit").
      *   *The 52%:* Was it a mandate or a preference?
      *   *The 2019 Election:* "Get Brexit Done." Johnson won 80 seats. But the coalition shifted (Red Wall). Is this the *same* will?
      *   *Miller Case:* Parliamentary sovereignty vs. Executive prerogative. Tabloids framed it as People vs. Judges.
      *   *Tautology Risk:* If every win is "the people" and every loss is "the elite blocking the people," the theory explains everything and nothing.

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the strength of both arguments. The friend is right about the *rhetoric* and *political strategy*; the user is right that *mechanically* referendums are majoritarian. The crux is whether the *interpretation* of that majority was populist.

      *   **Defining "The People" (The Populist Lens):**
          *   Populism requires a *homogeneous* people.
          *   In Brexit: "The People" = The 52%. But rhetorically, it expanded to "The Real Britain" vs. "Remoaners/EU/Elites."
          *   Who is excluded? EU citizens, under-18s, Scots/North Irish (eventually), and crucially, the 48%.
          *   *Theory Check:* Populism demands the 48% be silenced or converted, not accommodated.

      *   **Mapping the Actors (Theory vs. Reality):**
          *   *The Government (May/Johnson):* Claimed to be the vessel of the WotP. Johnson succeeded by simplifying it. May failed by trying to negotiate details (pluralism).
          *   *Parliament (MPs):* Tried to scrutinize/amend. Populist frame: "Traitors," "Blocking the Will."
          *   *Judiciary (Miller):* Constitutional guardians. Populist frame: "Enemies of the People."
          *   *Protesters (People's Vote):* Populist frame: "Elite attempt to overturn democracy."
          *   *User's Point:* Is this just majoritarianism? *Response:* Majoritarianism accepts opposition rights. Populism delegitimizes opposition. The *Daily Mail* headline is the smoking gun for populism, not just majoritarianism.

      *   **Where the Theory Holds Up (Explanatory Power):**
          *   Explains the *intensity* of the conflict. It wasn't policy disagreement; it was moral legitimacy.
          *   Explains the "Enemies of the People" headline.
          *   Explains why compromise (May's Deal) was impossible. You can't compromise with the "single will."
          *   Explains the prorogation of Parliament (Johnson): Removing the blocker to fulfill the will.

      *   **Where the Theory Breaks (The 2019 Election Problem):**
          *   *The User's specific point:* 2016 was 52% (older, conservative, shire). 2019 was a landslide (working class, Red Wall, "Get Brexit Done").
          *   *Populist Blind Spot:* Populism claims there is *one* will. But the will *changed* or was *refined*.
          *   If the 2016 vote was the "Sacred Will," why did we need a 2019 election to confirm it?
          *   If the 2019 election is the *new* Will, does it overwrite 2016?
          *   *Crucial Nuance:* The 2019 election wasn't just about Brexit; it was about *who* delivers it. The "Will" became "Trust Boris to finish it," not just "Leave."
          *   *Theory Failure:* Populism struggles with sequential mandates. It treats the first vote as a holy scripture. The fact that Johnson had to *reinterpret* the will (from "Leave" to "Get It Done") shows the "Will" isn't static.

      *   **The "Explains Too Much" Risk (Tautology):**
          *   If Leave wins = Will of the People triumphs.
          *   If Remain wins (hypothetically) = Would populists say it was the *real* will? Or elite manipulation?
          *   If Parliament blocks = Elite sabotage.
          *   If Parliament passes = People's will finally heard.
          *   *Verdict:* Yes, it risks becoming unfalsifiable. Every outcome is interpreted to fit the narrative. The theory explains the *rhetoric* well, but not the *mechanics*.

      *   **Synthesizing the User vs. Friend Debate:**
          *   Friend: Right about the *discourse* and *ideological framing*.
          *   User: Right about the *institutional mechanics*.
          *   Resolution: It was a populist *appropriation* of a majoritarian *tool*.

  4.  **Refining and Polishing:**
      *   *Check Tone:* Ensure it doesn't sound like I'm taking sides politically, but analyzing the political theory.
      *   *Clarity:* Use headers. Make the distinction between "Liberal Majoritarianism" and "Populist Monism" clear.
      *   *Address the 2019 Election specifically:* This is a key constraint in the prompt.
      *   *Address the "Enemies of the People" headline:* This is the strongest evidence for the friend's claim.
      *   *Conclusion:* Summarize the verdict.

  5.  **Self-Correction/Review during drafting:**
      *   *Thought:* Did I emphasize the difference between "the people" (demos) and "the people" (populist construct)?
      *   *Correction:* Need to make sure I explicitly state that in liberal democracy, the 48% are still "the people." In populism, they are often cast as outside the *true* people.
      *   *Thought:* Is the 2019 election point strong enough?
      *   *Correction:* Emphasize that the 2019 coalition was *different*. Leave 2016 was anti-immigration/sovereignty. Leave 2019 was anti-deadlock/finish it. The "Will" mutated. Populism hates mutation because it claims the Will is unitary and static.

  6.  **Final Polish:** Check against the prompt requirements one last time. (Who counts, theory on actors, where it explains, where it breaks, 2019 election, tautology risk). *Looks good.*

  7.  (Proceed to generate output based on these structured thoughts.)
answer: |-
  This is a classic political theory clash, and honestly, it's the kind of argument worth having until 2am. Both you and your friend are touching on different layers of the same phenomenon. Your friend is describing the **ideological framing** (populism), while you are describing the **institutional mechanics** (majoritarianism).

  To settle the chew, we need to distinguish between *liberal democratic majoritarianism* (your view) and *populist monism* (your friend's view). In liberal democracy, a majority wins a vote, but the minority remains part of "the people" with rights and a voice. In populism, "the people" is a moral construct: there is only *one* true will, and those who oppose it are not just opponents, but enemies of the people themselves.

  Here is an analysis of Brexit through the lens of "the will of the people," breaking down where the theory fits, where it fractures, and whether it explains too much.

  ---

  ### 1. Who Counts as "The People"?
  **The Theory:** In populist theory (think Cas Mudde or Jan-Werner Müller), "the people" are not everyone with a passport. They are the *moral* majority. The 48% are not treated as a loyal opposition; they are often framed as deluded, elite-captured, or even traitorous ("Remoaners").

  **The Brexit Reality:**
  *   **Inclusion:** The "People" were rhetorically constructed as the 17.4 million voters. But it went deeper: it was "Real Britain" vs. "Metropolitan Elite." This excluded not just Remain voters, but often institutions (Parliament, Courts) and demographics (young people, Scots, Londoners) who voted heavily Remain.
  *   **Exclusion:** The 2016 franchise excluded EU citizens living in the UK and 16–17-year-olds. Populist rhetoric often treated these exclusions as irrelevant because the "True People" had already spoken.
  *   **The Verdict:** Your friend is right here. If this were standard majoritarianism, the 48% would be respected as half the country. Instead, the slogan "The Will of the People" was used specifically to silence the 48%, implying they were no longer part of the legitimate demos.

  ### 2. What Was Each Actor Doing? (Theory vs. Reality)
  If we apply the populist "Will of the People" lens, every actor's role is pre-scripted.

  | Actor | Liberal Democratic Role | Populist "Will of the People" Role | What Actually Happened |
  | :--- | :--- | :--- | :--- |
  | **The Govt (May/Johnson)** | Implement policy within legal constraints. | The **Vessel**. Their job is to transmit the Will without distortion. May failed (too much compromise); Johnson succeeded (simplified the message). | Johnson's "Get Brexit Done" worked because it aligned the Vessel with the Will. May's deal failed because it acknowledged plural interests (NI, Scotland, Business). |
  | **Parliament (MPs)** | Deliberate, amend, represent constituents. | The **Blocker**. If they amend the Will, they are subverting democracy. | The *Daily Mail* "Enemies of the People" headline after the Miller case is the smoking gun. MPs trying to block No-Deal were framed as thwarting the 2016 vote. |
  | **Judiciary (Miller)** | Guard constitutional process (Parliamentary Sovereignty). | The **Saboteur**. Unelected judges blocking the elected Will. | The Court ruled Parliament must vote to trigger Art. 50. Populist framing: Judges vs. People. |
  | **Protesters (People's Vote)** | Exercise right to petition/protest. | The **Counter-Revolution**. An elite attempt to overturn the sacred result. | Marches for a second referendum were framed not as democracy, but as a "betrayal" of the first. |

  **Where your friend wins:** The *rhetoric* used against the Judges and MPs was unmistakably populist, not just majoritarian. In standard majoritarianism, you disagree with a court ruling; in populism, you delegitimize the court.

  **Where you win:** Mechanically, the system held. Parliament *did* vote. The Courts *were* obeyed. The "Will" had to be processed through the very institutions the populists claimed were blocking it.

  ### 3. The 2019 Election: The Theory's Breaking Point
  This is the strongest part of your counter-argument. The populist theory of "the Will" struggles immensely with the 2019 General Election.

  **The Problem of the Shifting Coalition:**
  *   **2016:** The "Will" was a coalition of economic leftists (post-industrial towns) and economic rightists (shires), united by sovereignty/immigration. 52%.
  *   **2019:** The "Will" was a landslide for Johnson. But the coalition shifted. He won Red Wall Labour seats. The mandate was no longer just "Leave"; it was "Trust Boris to Finish It."

  **Does the theory explain this?**
  *   **Populist View:** The 2019 election was the "People" finally finding the right Vessel to execute the 2016 Will. It confirms the 2016 vote.
  *   **Critical View:** The 2019 election actually *changed* the Will. In 2016, "Leave" was a vague preference. In 2019, "Get Brexit Done" was a specific instruction to accept Johnson's deal.
  *   **The Break:** If "the Will of the People" is singular and sacred (as populism claims), why did it need reaffirming three years later by a different coalition?
      *   If the 2016 vote was the absolute Will, Parliament shouldn't have needed to dissolve to check it.
      *   If the 2019 election was the *new* Will, does it overwrite the 2016 specifics? (e.g., The 2016 vote didn't specify a customs border in the Irish Sea, but the 2019 mandate accepted it).

  **Verdict:** The theory breaks here because it cannot account for the *evolution* of the will. Populism treats the Will as static (a stone tablet). Reality showed the Will was fluid (a negotiation). The 2019 election proved that "The People" didn't just want Brexit; they wanted *a specific kind of Brexit delivered by a specific leader*. That is partisan politics, not a mystical popular will.

  ### 4. Does the Theory Explain Too Much? (The Tautology Risk)
  You asked if the theory ends up explaining everything, rendering it useless. **Yes, it does.** This is the biggest weakness of the populist lens.

  *   **If Brexit happens:** The Will of the People triumphed.
  *   **If Brexit is blocked:** The Elite are suppressing the Will of the People.
  *   **If a Second Vote happens:** It's either "The People speaking again" (if Leave wins) or "Elite subversion" (if Remain wins).

  In this framework, "The Will of the People" is not a measurable variable; it is a **trump card**. It is unfalsifiable.
  *   **Example:** When Theresa May lost her deal in Parliament three times, populists argued Parliament was wrong, not that the "Will" was unclear. When Johnson prorogued Parliament, the Supreme Court said it was unlawful. The populist response wasn't "We broke the law," it was "The Law is blocking the People."

  If every outcome is interpreted as either the Will surfacing or the Will being blocked, the theory loses predictive or analytical power. It becomes a slogan rather than a lens.

  ### 5. Synthesis: Who Won the Argument?
  You both did, but on different levels.

  **Your Friend is Right About the Discourse:**
  The 2016–2019 saga *was* a case study in populist rhetoric. The conversion of a 52% majority into a 100% moral mandate, the branding of opponents as "Enemies of the People," and the framing of institutions as barriers rather than mediators is textbook populism. If you look at the *language* used (by Brexiters, the press, and Johnson), your friend's definition holds perfectly.

  **You are Right About the Mechanics:**
  However, calling it *purely* populism ignores that the UK's liberal democratic institutions actually functioned. Parliament eventually voted. The Courts were obeyed (eventually). The 2019 election required a new mandate, proving that a referendum isn't a one-time divine command. The fact that the "Will" had to be fought over, defined, and re-voted on proves it was **majoritarian politics**, where the definition of the majority is contested, not **populist monism**, where the majority is assumed to be homogeneous and static.

  **The Final Verdict:**
  Brexit was a **populist appropriation of a majoritarian tool.**
  *   **The Tool:** A referendum (majoritarian).
  *   **The Appropriation:** Framing the result as a singular, unchallengeable moral command (populist).

  The theory explains the *heat* of the conflict (why it felt like civil war rather than policy disagreement) but fails to explain the *resolution* (which required boring, pluralist horse-trading and a general election).

  **Tell your friend:** "You're right that the *rhetoric* was populist monism, but you're wrong that the *process* was. If it were truly just 'the Will of the People,' Johnson wouldn't have needed an 80-seat majority to pass it. The fact that he did proves the Will wasn't one thing—it was a coalition that had to be built, broken, and rebuilt."
