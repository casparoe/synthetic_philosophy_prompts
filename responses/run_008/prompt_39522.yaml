answer: |-
  # The Keynesian Weight & Balance Protocol
  **For:** Economic Foresight Unit Analysts
  **Subject:** Expressing Confidence in Substantive Claims
  **Time Budget:** 45–60 Minutes per Memo

  ## 1. Purpose
  This procedure prevents spurious precision. It ensures that the *amount* of evidence (Weight) is distinguished from the *direction* of the evidence (Balance). It forces analysts to admit when a question is uncertain rather than calculable.

  ## 2. The Decision Tree
  For every substantive claim in your draft, run these three tests in order.

  ### Test A: The Scope Filter
  **Question:** Is this claim strictly within our economic mandate, or does it rely on political/sociological judgments we cannot evidence?
  *   **If No:** Assign **Register 4 (Out of Scope)**.
  *   **If Yes:** Proceed to Test B.

  ### Test B: The Weight Check ($V$)
  **Question:** What is the volume and relevance of the evidence base?
  *   **High Weight:** You have direct historical analogues (≥3 cases), robust micro-data, and the structural mechanism is stable (no regime change).
  *   **Moderate Weight:** You have indirect analogues, aggregated data, or a stable mechanism but limited data points.
  *   **Low Weight:** You have theoretical models only, unique circumstances with no analogues, or the mechanism itself is evolving/breaking.
  *   **Action:** Note your Weight rating. Proceed to Test C.

  ### Test C: The Balance Check ($P$)
  **Question:** Given the evidence, can the probability be calculated, compared, or is it unknown?
  *   **Calculable:** Data supports a statistical distribution or elasticity range.
  *   **Comparable:** Evidence points clearly one way, but not enough for a number (e.g., "more likely than not").
  *   **Uncertain (1937 Style):** The future event is non-ergodic; past data does not map to future structure. No scientific basis for calculation.

  ## 3. The Four Registers
  Map your Test B and C results to these registers. Use the prescribed language.

  ### Register 1: Quantified Estimate (Number or Range)
  *   **Criteria:** High Weight + Calculable Balance.
  *   **Keynesian Logic:** High $V$ allows us to trust the numerical $P$.
  *   **Required Language:** "Based on [X] comparable instances, we estimate..."
  *   **Constraint:** Must include a confidence interval or range. Never a single point.

  ### Register 2: Comparative Belief (Qualitative Probability)
  *   **Criteria:** (Moderate Weight + Calculable Balance) OR (High Weight + Non-numerical Balance).
  *   **Keynesian Logic:** We know which way the evidence leans, but the $V$ is too low for a number, or the $P$ is inherently non-numeric.
  *   **Distinction:**
      *   *High Weight / 50-50:* "The evidence is extensive but evenly divided; the outcome is effectively a coin toss."
      *   *Low Weight / 70-30:* "Preliminary indicators suggest a likely increase, though the evidential base is thin."
  *   **Required Language:** "It is more likely than not that..." or "The balance of evidence suggests..."

  ### Register 3: Unquantifiable Uncertainty (The "Open" File)
  *   **Criteria:** Low Weight OR Uncertain Balance (1937 Style).
  *   **Keynesian Logic:** There is no rational basis for forming a calculable probability. To assign a number is to lie.
  *   **Required Language:** "There is no evidential basis to quantify..." or "This lies in the domain of uncertainty rather than risk."
  *   **Action:** Offer *scenarios* (If X, then Y; If A, then B) instead of forecasts.

  ### Register 4: Out of Scope
  *   **Criteria:** Failed Test A.
  *   **Required Language:** "This unit assesses economic impacts; the decision regarding [Political/Social Factor] is outside our remit."

  ## 4. Judgment Call Declaration
  At the end of the memo, include a **"Keynesian Caveat"** box.
  *   **Prompt:** "Identify the single claim where your judgment call was most critical."
  *   **Requirement:** State explicitly: "We judged the Weight to be [High/Mod/Low] because..." This prevents hiding subjectivity behind the procedure.

  ***

  # Worked Cases

  ### Case 1: Transaction Tax Impact on Trading Volume
  **Context:** Estimating volume shift from a 2% tax increase, using decades of cross-jurisdictional studies.
  *   **Test A (Scope):** Pass. Purely economic elasticity.
  *   **Test B (Weight):** **High.** Multiple jurisdictions, decades of data, mechanism (price sensitivity) is stable.
  *   **Test C (Balance):** **Calculable.** Elasticities can be derived from the studies.
  *   **Assigned Register:** **Register 1 (Quantified Estimate).**
  *   **Reasoning:** High $V$ supports numerical $P$. The risk of spurious precision is low because the analogues are direct.
  *   **Memo Sentence:** "Drawing on fifteen comparable tax implementations, we estimate trading volume will contract by a range of 8% to 12% within the first quarter."

  ### Case 2: New Retail Investment Product in Severe Downturn
  **Context:** Judging safety of a new product. Data exists for 10 years, but no severe downturn occurred in that period.
  *   **Test A (Scope):** Pass. Economic stability risk.
  *   **Test B (Weight):** **Low.** The specific evidence required (performance in severe downturn) is missing by definition. The 10 years of "calm" data is irrelevant to the stress test.
  *   **Test C (Balance):** **Uncertain.** We cannot calculate probability of failure without stress data.
  *   **Assigned Register:** **Register 3 (Unquantifiable Uncertainty).**
  *   **Reasoning:** This is a 1937-style uncertainty. The past does not map to the specific future shock. Assigning a probability of safety would be spurious.
  *   **Memo Sentence:** "While the product has performed benignly in stable conditions, there is no evidential basis to assess its behavior in a severe downturn; we cannot quantify the risk of failure."

  ### Case 3: Global Supply Chain Reorganization (20-Year Resilience)
  **Context:** Will a permanent reorganization make the domestic economy more resilient to shocks in 20 years?
  *   **Test A (Scope):** Pass. Economic resilience.
  *   **Test B (Weight):** **Low.** Twenty years is a structural horizon, not a cyclical one. No historical analogues exist for this specific technological/geopolitical configuration.
  *   **Test C (Balance):** **Uncertain.** Fundamental uncertainty. We do not know what shocks will exist in 20 years, nor how the reorganization will interact with them.
  *   **Assigned Register:** **Register 3 (Unquantifiable Uncertainty).**
  *   **Reasoning:** High risk of spurious precision. The "Weight" of evidence regarding 20-year structural shifts is negligible.
  *   **Memo Sentence:** "Regarding resilience twenty years out, there is no scientific basis for a calculable probability. We can outline scenarios of increased fragility or robustness, but we decline to forecast which is more likely."

  ***

  # Defense of the Unpopular Answer (Case 3)

  The Committee will dislike Case 3. They want a number to plug into a long-term fiscal model. Giving them "We don't know" feels like incompetence to them. Here is how you defend the procedure's output:

  **1. The Argument from Policy Brittleness**
  Explain that a number implies a model. If you give them "60% chance of increased resilience," they will budget for resilience. If the reality is fragility, the policy breaks. By refusing the number, you force them to build *robust* policy (works in both scenarios) rather than *optimal* policy (works only in the forecasted scenario).
  *   *Talking Point:* "A number here would create false confidence. It is more competent to define the variables that matter than to guess their values."

  **2. The Argument from Weight**
  Remind them of the distinction between *risk* (known odds) and *uncertainty* (unknown odds).
  *   *Talking Point:* "We have high Weight on the tax issue (Case 1), so we gave you a number. We have near-zero Weight on the 20-year structure (Case 3). Treating them the same would be analytically dishonest."

  **3. The Offer of Scenarios**
  Do not leave them with nothing. Replace the forecast with a sensitivity map.
  *   *Talking Point:* "We cannot tell you the probability, but we can tell you that if geopolitical fragmentation accelerates, resilience drops. If automation dominates, resilience rises. Your decision depends on which world you believe we are entering, not on our calculation."

  ***

  # Self-Assessment

  **Confidence in Keynesian Fidelity:**
  I am **moderately confident** that this procedure captures the spirit of Keynes, specifically the distinction in the *Treatise* between the probability relation ($P$) and the weight of evidence ($V$). The separation of Register 1 (High $V$) and Register 2 (Low $V$) honors his view that a high probability based on little evidence is less valuable than a moderate probability based on much evidence. The inclusion of Register 3 honors the 1937 shift toward fundamental uncertainty where no probability relation exists.

  **The Weakest Step:**
  The **Threshold for "High Weight" in Test B** is the most vulnerable point. Keynes never provided a metric for when evidence becomes "sufficient" to convert a non-numerical probability into a numerical one. I have arbitrarily set this at "≥3 direct analogues + stable mechanism." An analyst could game this by finding three weak analogues to force a Register 1 classification. Mitigating this requires the "Judgment Call Declaration," but ultimately, the distinction between "comparable" and "calculable" remains a subjective judgment call that the procedure cannot fully automate.
