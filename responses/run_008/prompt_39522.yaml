      *   **Key Keynesian Concepts:**
          *   Probability = degree of rational belief (not just frequency).
          *   Non-numerical probabilities (comparisons possible, numbers not).
          *   *Weight* of argument (amount of relevant evidence) vs. *Balance* of evidence (probability value).
          *   Distinction between calculable risk and unmeasurable uncertainty (1937).
      *   **Output Requirements:**
          1.  The Decision Procedure (Editorial Rulebook).
          2.  Four Registers (Number/Range, Comparison, Open/No Quant, Not Our Claim).
          3.  Tests for each (Evidence base, Weight, thresholds).
          4.  Distinction between Balance (50/50 with high weight vs. 70/30 with low weight).
          5.  Mark judgment calls honestly.
          6.  Three Worked Cases (Tax/Volume, New Product/Downturn, Supply Chains/20 Years).
          7.  Specific focus on the "unpopular answer" (likely Case 3) and how to defend it.
          8.  Self-Assessment (Confidence in Keynesian fidelity, weakest step).
      *   **Constraints:** Short assessment memos (2 pages max), procedure under 1 hour.

  2.  **Deconstruct Keynes for the Procedure:**

      *   *Treatise on Probability:* Probability is logical relation between proposition and evidence. $P(h|e)$.
      *   *Weight ($V$):* Amount of relevant evidence $e$. As $e$ increases, $V$ increases. $V$ is distinct from $P$. High $V$ means we *know* our probability estimate is robust. Low $V$ means even if $P$ looks precise, it's fragile.
      *   *1937 QJE:* Some things are simply uncertain (non-ergodic). No scientific basis for calculation.
      *   *Application:* We need a matrix of Balance (Probability) vs. Weight (Evidence).
      *   *Registers:*
          1.  **Quantified (Number/Range):** High Weight + Calculable Balance.
          2.  **Qualitative (Comparison):** Moderate Weight + Discernible Balance OR High Weight + Imprecise Balance.
          3.  **Uncertain (Open):** Low Weight OR Non-calculable (1937 style).
          4.  **Out of Scope:** Not economic foresight / Normative.

  3.  **Drafting the Procedure (The "Keynesian Filter"):**

      *   *Time limit:* Needs to be a checklist, not a thesis.
      *   *Step 1: Relevance & Scope.* Is this our claim?
      *   *Step 2: The Weight Test ($V$).* How much relevant evidence? (Direct analogies, data depth, structural stability).
      *   *Step 3: The Balance Test ($P$).* Can we calculate a ratio? Or just compare?
      *   *Step 4: The 1937 Uncertainty Check.* Is the system fundamentally changed?
      *   *Mapping to Registers:*
          *   Register A (Point/Range): High Weight, Calculable Balance.
          *   Register B (Comparative): Moderate Weight OR High Weight but non-numerical balance.
          *   Register C (Unquantifiable): Low Weight OR Fundamental Uncertainty.
          *   Register D (Out of Scope).
      *   *Crucial Nuance:* Distinguish 50/50 High Weight (We know it's a coin toss) vs. 70/30 Low Weight (We guess it's likely, but barely know). The procedure must force different language for these.

  4.  **Developing the Worked Cases:**

      *   *Case 1 (Tax/Volume):* Decades of studies, similar jurisdictions.
          *   Weight: High (lots of data).
          *   Balance: Calculable (elasticities exist).
          *   Register: A (Range).
          *   Wording: "We estimate a decline of 10-15%..."
      *   *Case 2 (New Product/Downturn):* Decade of data, *no* severe downturn.
          *   Weight: Low/Moderate (data exists but lacks critical stress test).
          *   Balance: Uncalculable regarding the specific risk (downturn).
          *   Register: C (Unquantifiable/Warning).
          *   Wording: "We cannot assess behavior in a severe downturn..."
      *   *Case 3 (Supply Chains/20 Years):* Structural shift, remote future.
          *   Weight: Low (too many unknown variables/structural breaks).
          *   Balance: Non-calculable (1937 Uncertainty).
          *   Register: C (Refusal to Quantify).
          *   Wording: "There is no evidential basis for a numerical forecast..."
          *   *Defense:* This is the "unpopular" one. Need to explain why giving a number is *less* competent than admitting ignorance.

  5.  **Refining the "Unpopular Answer" Defense:**

      *   The committee wants a number.
      *   The procedure says "No."
      *   Argument: Spurious precision leads to policy brittleness. Keynesian "Weight" means knowing *when* we don't know. A number implies a model that doesn't exist.
      *   Tactic: Offer the *conditions* under which the number would change (scenario planning) rather than the number itself.

  6.  **Drafting the Self-Assessment:**

      *   Confidence level: High on general spirit, moderate on specific operationalization of "Weight."
      *   Weakest step: The threshold between "Moderate Weight" (Register B) and "High Weight" (Register A). Keynes didn't give a percentage cutoff for weight. I have to invent one for the procedure.

  7.  **Review against Constraints:**

      *   *Tone:* Professional, bureaucratic but intellectually rigorous.
      *   *Length:* The prompt asks for a lot, but the *memo* constraint is for the analysts. My response can be longer to explain the procedure.
      *   *Keynes Fidelity:* Ensure "Weight" isn't confused with "Probability." Ensure 1937 "Uncertainty" is distinct from "Risk."
      *   *Time:* Procedure must be runnable in < 1 hour. Checklists help.

  8.  **Final Polish:**

      *   Make the registers distinct.
      *   Ensure the "50/50 High Weight" vs "70/30 Low Weight" distinction is clear in the wording examples.
      *   Check the "Self-Assessment" for honesty.

  *(Self-Correction during drafting)*: I initially thought about making Register B "Qualitative Probability." But Keynes emphasizes that sometimes probability itself is non-numerical. So Register B should be "Comparative Belief." Register C is "Uncertainty" (no probability basis).
  Also, need to make sure the "Weight" test is concrete enough for an analyst to do in an hour. Instead of "assess weight," ask "Do we have 3+ independent data sources?" or "Has this mechanism failed before?"

  *(Refining the Defense)*: The defense shouldn't just be "Keynes said so." It should be "Policy risk." If we give a number, you will budget for it. If the number is wrong, the budget breaks. If we give a range of uncertainty, you build resilience.

  9.  **Final Output Structure:**
      *   Introduction (Context).
      *   The Procedure (The "Keynesian Weight & Balance Protocol").
      *   The Four Registers (Definitions & Tests).
      *   Worked Cases (1, 2, 3).
      *   Defense of the Unpopular Answer (Case 3).
      *   Self-Assessment.

