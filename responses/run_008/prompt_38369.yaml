      *   *Refinement:* It's more of a clash between *Externalist/Reliabilist* leanings (Norton: is the process truth-tracking via logic?) vs. *Internalist/Phenomenological* leanings (Brown: does the agent *see* the truth?). But even that's not quite right. It's really about *Reconstructability* vs. *Phenomenological Irreducibility*.

