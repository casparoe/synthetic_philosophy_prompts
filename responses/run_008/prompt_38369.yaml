      *   **Brown (The Platonist View):** Some TEs (Galileo's falling bodies, Stevin's chain) are *a priori* insights into the nature of things. They destroy old theories and create new ones without new empirical data. They are not just reconstructing premises; they reveal laws directly. *Key claim:* "Thought experiments provide *a priori* knowledge of nature."
      *   **The Impasse:** Norton demands a reconstruction. If you can reconstruct it as an argument, it's an argument. Brown says the reconstruction misses the *phenomenology* of the insight and the *source* of the novelty.

  3.  **Evaluate the User's Hypothesis (Justification vs. Acquisition):**
      *   *Norton:* Definitely focused on justification. "What entitles us to believe the conclusion?" Answer: The premises and logic.
