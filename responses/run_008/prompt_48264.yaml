prompt: |-
  I sit on the scientific steering committee of a mid-sized institute for the neuroscience of consciousness, and at next month's meeting we must settle, for the whole upcoming funding cycle, how the institute treats first-person data. The occasion is a concrete dispute between two investigators planning a joint study on perceptual awareness under binocular rivalry. One, trained in the neurophenomenology tradition descended from Varela, wants to recruit trained meditator-observers, give them a two-month introspective refinement phase, and treat their first-person reports as primary data — in particular, as authoritative enough to overrule the experiment's neural classifier when the two disagree about whether a subject was aware of a stimulus at a given moment. The other wants to move the study to a no-report design on the grounds that verbal reports are too noisy and theory-laden to carry any weight at all, and would relegate them to an appendix. The committee, not the investigators, has to decide the methodological policy before the study is preregistered, and I have been asked to circulate the written opinion that frames the vote.

  Draft that memo for me. Its natural backbone is Dennett's heterophenomenology as laid out in Consciousness Explained, and I want you to use it seriously rather than as a label: explain what the method actually commits us to operationally — treating the subject's reports as texts to be interpreted, constructing a neutral catalog of the subject's "heterophenomenological world" without deciding in advance whether its contents correspond to real inner items, and granting the subject neither authoritative inner access nor the status of a mere faucet of behavior. Then translate those commitments into concrete, enforceable policy language: under the recommended policy, what exactly happens when a subject's report conflicts with the neural measure; whether the meditators' introspective training is a legitimate part of the protocol or a contaminant; what counts as decisive disagreement; and what the preregistration documents must say about the evidential status of reports.

  Your memo should recommend one of three options outright — adopt heterophenomenology as the institute's standing methodology for first-person data, adopt a hybrid that grants trained observers some privileged evidential role, or leave the status of reports to case-by-case adjudication — and it must do more than restate Dennett. The committee's most skeptical member (herself sympathetic to the meditator proposal) will argue that heterophenomenology begs the question: by fiat, it awards victory to the third-person point of view and builds the insignificance of first-person authority into the method rather than discovering it there, so adopting it is not a neutral methodological choice but a metaphysical ruling dressed as bookkeeping. Your memo needs to face this objection at full strength, say honestly whether it is fatal, and explain to the committee why what you are recommending is not just old-fashioned behaviorism with better manners. Where the method genuinely underdetermines the policy choices before us — for instance, whether a no-report design is heterophenomenological hygiene or an evasion of the method's whole point — say so and make the call anyway. The deliverable is a document the committee could vote on line by line, with a clear bottom line and reasoning strong enough that the losing investigator would recognize their position as having been understood rather than dismissed.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Scientific Steering Committee of a mid-sized neuroscience of consciousness institute.
      *   **Task:** Draft a memo to circulate before a vote on methodological policy regarding first-person data.
      *   **Context:** A dispute between two investigators (Neurophenomenology/Varela vs. No-Report) regarding a binocular rivalry study.
      *   **Core Framework:** Dennett's Heterophenomenology (from *Consciousness Explained*). Must be used seriously/operationally, not just as a label.
      *   **Key Policy Questions to Answer:**
          *   What happens when report conflicts with neural measure?
          *   Is meditator introspective training legitimate or a contaminant?
          *   What counts as decisive disagreement?
          *   What must preregistration say about evidential status?
      *   **Recommendation:** Choose one of three options (Heterophenomenology standing policy, Hybrid/Privileged role, Case-by-case).
      *   **Critical Objection to Address:** The skeptical committee member's argument that heterophenomenology begs the question (privileges 3rd-person by fiat, metaphysical ruling disguised as method, behaviorism with better manners).
      *   **Tone:** Professional, authoritative, nuanced, actionable (vote-ready), respectful to opposing views.
      *   **Goal:** A document the committee can vote on line-by-line, where the losing side feels understood.

  2.  **Deconstruct Heterophenomenology (Dennett):**
      *   *Core Idea:* Treat subjects' reports as *texts* to be interpreted.
      *   *Stance:* Neutral. Don't assume reports are true (Cartesian Theater) nor false (Behaviorism).
      *   *Goal:* Construct the "heterophenomenological world" (the world *as it seems* to the subject).
      *   *Truth Condition:* The subject's beliefs about their experience are real data points, but the *objects* of those beliefs (qualia, inner items) are not granted ontological reality unless supported by third-person evidence.
      *   *Operationalization:* The scientist is the interpreter. The subject is the informant, not the oracle.

  3.  **Address the Specific Dispute:**
      *   *Investigator A (Varela/Neurophenomenology):* Wants trained meditators, reports as primary/authoritative (can overrule neural classifier).
      *   *Investigator B (No-Report):* Wants no verbal reports (too noisy/theory-laden), relegate to appendix.
      *   *Heterophenomenological Verdict:*
          *   Against A: Reports cannot *overrule* neural data ontologically. The subject is not the final authority on the *cause* or *reality* of the neural state, only on the *content* of their seeming.
          *   Against B: Eliminating reports entirely throws away the "text" needed to construct the heterophenomenological world. No-report is useful for avoiding confounds, but cannot be the *only* data if we care about consciousness *as experienced*.
          *   Middle Ground: Reports are data, neural signals are data. Conflict means the model of the link between them is wrong, not that one is "true" and the other "false."

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront. (Recommendation: Adopt Heterophenomenology as standing methodology).
      *   **Context:** Briefly acknowledge the binocular rivalry dispute without getting bogged down in the specifics.
      *   **Theoretical Framework (The "Why"):** Explain Heterophenomenology operationally.
          *   Subject as informant, not oracle.
          *   Reports as texts.
          *   The "Heterophenomenological World."
      *   **Addressing the Skeptic (The "Elephant in the Room"):** This is crucial. The prompt requires facing the objection that this is question-begging/behaviorism.
          *   *Argument:* It *does* privilege the 3rd-person perspective, but that's a feature of *science*, not a bug. It's not metaphysical nihilism about experience; it's methodological agnosticism.
          *   *Distinction from Behaviorism:* Behaviorism ignores the inner story; Heterophenomenology makes the inner story the central object of study, just without granting it ontological independence.
      *   **Policy Directives (The "What"):** Translate theory into rules.
          *   *Conflict Resolution:* Neural data doesn't "overrule" report, report doesn't "overrule" neural. They are different domains. If they disagree, the *model* linking them is falsified.
          *   *Meditator Training:* Legitimate as refining the "text," but doesn't grant epistemic privilege on neural reality.
          *   *No-Report:* Permissible for specific control conditions, but cannot be the institute's default definition of consciousness measurement.
          *   *Preregistration:* Must define reports as "heterophenomenological data," not "ground truth."
      *   **Conclusion:** Reiterate the value of a unified framework.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is the recommendation too harsh on Investigator A?
      *   *Fix:* Acknowledge the value of training. It makes the "text" richer and less noisy. But deny the *authority* to overrule neural classifiers.
      *   *Critique:* Is the recommendation too harsh on Investigator B?
      *   *Fix:* Acknowledge no-report is good for avoiding motor confounds, but insist that without *some* report, we aren't studying consciousness, just correlates of stimulus processing.
      *   *Critique:* Did I answer the "Question-Begging" objection strongly enough?
      *   *Fix:* Need to explicitly state: Yes, it assumes the scientific stance is the final arbiter. But that is what makes it science. It's not a metaphysical claim that qualia don't exist; it's a methodological suspension of judgment until convergence is reached.
      *   *Tone Check:* Ensure it sounds like a Steering Committee document, not a philosophy paper. Needs actionable bullet points.

  6.  **Final Polish:**
      *   Check against the prompt requirements:
          *   Dennett's heterophenomenology used seriously? Yes.
          *   Concrete policy language? Yes.
          *   Address the skeptic's objection? Yes.
          *   Recommend one of three options? Yes (Option 1).
          *   Losing investigator feels understood? Yes, by validating the utility of their methods while restricting their ontological claims.

  7.  **Drafting the Content (Mental or Scratchpad):**
      *   *Subject:* Methodological Policy on First-Person Data.
      *   *Recommendation:* Adopt Heterophenomenology.
      *   *Key phrase:* "The subject is the sole authority on what it is like to be them, but not on what is happening in their brain."
      *   *Policy:* Reports = Data, not Truth. Neural = Data, not Truth. Convergence = Theory Support. Divergence = Theory Revision.
      *   *Skeptic:* You're right, it privileges 3rd person. But 1st person can't be the *method* of science, only the *object*.

  8.  **Final Review against constraints:**
      *   "Line by line" vote readiness -> Use clear numbered sections.
      *   "Underdetermines... make the call anyway" -> Be decisive on the no-report vs. report issue.
      *   "Old-fashioned behaviorism" -> Explicitly distinguish.

  (Proceed to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Scientific Steering Committee, Institute for the Neuroscience of Consciousness
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Methodological Policy for First-Person Data (Funding Cycle 2024–2029)

  ### 1. Executive Summary and Recommendation

  The Committee is currently asked to resolve a methodological impasse regarding the status of first-person reports in upcoming studies, specifically concerning the binocular rivalry proposal. We face three options: (1) grant trained observers authoritative privilege over neural measures (the Neurophenomenological proposal); (2) exclude reports as primary data to avoid noise (the No-Report proposal); or (3) adopt a standing institutional methodology that treats first-person reports as data to be interpreted rather than truth to be recorded or noise to be eliminated.

  **I recommend the Committee adopt Option 3: Heterophenomenology as the Institute's standing methodology.**

  This memo outlines the operational commitments of this framework, translates them into enforceable policy for the upcoming funding cycle, and addresses the substantive philosophical objection that this approach beg the question against the reality of conscious experience.

  ### 2. Theoretical Framework: Heterophenomenology Operationally

  We must move beyond using "heterophenomenology" as a label and treat it as a procedural constraint. Based on Dennett's formulation in *Consciousness Explained*, the following operational commitments define our use of first-person data:

  1.  **The Subject as Informant, Not Oracle:** The subject is the sole authority on *what it seems to them* is happening. They are not an authority on *what is actually happening* in their cognitive architecture. Their report is a "text" generated by their brain, comparable to the neural data generated by their brain.
  2.  **The Heterophenomenological World:** Our primary object of study is the "world according to the subject." We construct a neutral catalog of this world based on their reports. We do not decide in advance whether the items in this world (e.g., "a red patch," "a sudden onset") correspond to real inner items or neural states.
  3.  **Suspension of Ontological Commitment:** We treat the subject's beliefs about their experience as real data points (the belief exists), but we suspend judgment on the veridicality of the content of those beliefs until they converge with third-person measures.

  **Distinction from Behaviorism:** Unlike behaviorism, which dismisses the inner story as irrelevant, heterophenomenology makes the inner story the central object of investigation. Unlike Cartesian materialism, it does not assume the inner story is a direct window into a private theater. It is not behaviorism with better manners; it is the only stance that allows us to study consciousness scientifically without presupposing the existence of non-physical qualia or the infallibility of introspection.

  ### 3. Addressing the Skeptical Objection

  A member of this Committee has rightly argued that heterophenomenology begs the question: by fiat, it awards victory to the third-person point of view and builds the insignificance of first-person authority into the method rather than discovering it there. The objection holds that adopting this is a metaphysical ruling dressed as bookkeeping.

  **Assessment of the Objection:**
  The objection is partially correct but not fatal. It is correct that heterophenomenology *does* privilege the third-person perspective as the final arbiter of scientific truth. However, this is not a covert metaphysical claim that first-person experience is unreal. It is an explicit methodological requirement of *science*.

  If we grant the subject authority to overrule neural data (as Investigator A proposes), we cease to do neuroscience and begin to do theology; we posit a "homunculus" whose word is law. If we eliminate reports entirely (as Investigator B proposes), we cease to study consciousness and begin to study unconscious stimulus processing.

  Heterophenomenology admits its bias openly: it assumes that for a phenomenon to enter the scientific record, it must be publically observable. The "bias" is the definition of science, not a denial of experience. We are not discovering the insignificance of first-person authority; we are acknowledging that first-person authority is limited to the *phenomenal character*, not the *causal explanation*. Therefore, the objection is not a reason to reject the method, but a reason to ensure we apply it transparently.

  ### 4. Policy Directives for the Upcoming Funding Cycle

  To resolve the current dispute and standardize future proposals, the following policies shall apply to all Institute-funded projects involving first-person data.

  **4.1. Resolution of Data Conflict (Report vs. Neural Measure)**
  *   **Policy:** In the event of a disagreement between a subject's report (e.g., "I saw the stimulus") and a neural classifier (e.g., "Decoding indicates no awareness"), **neither datum overrules the other.**
  *   **Operational Consequence:** Such an event is recorded as a "divergence instance." It falsifies the current model linking the neural marker to the reported experience. It does not validate the neural marker as "truth" and the report as "error," nor vice versa.
  *   **Prohibition:** Proposals may not preregister designs where first-person reports are designated as "ground truth" capable of invalidating neural data, nor designs where neural data invalidates reports. Both are dependent variables.

  **4.2. Status of Introspective Training (The Meditator Protocol)**
  *   **Policy:** Introspective training (e.g., meditation, micro-phenomenological interviewing) is **permissible and encouraged** as a method to refine the "text."
  *   **Operational Consequence:** Training is viewed as increasing the signal-to-noise ratio of the report, similar to stabilizing a head coil. It does not, however, grant the subject epistemic privilege regarding the *cause* of the report.
  *   **Ruling on Current Dispute:** Investigator A may proceed with the two-month refinement phase. However, the meditators' reports cannot be used to re-label neural data in post-hoc analysis. The reports stand as the subjects' sincere accounts, which the neural data must explain, not obey.

  **4.3. No-Report Designs**
  *   **Policy:** No-report designs are **permissible only as control conditions**, not as the primary measure of consciousness.
  *   **Operational Consequence:** A study claiming to measure "consciousness" cannot rely solely on objective performance or neural markers without *some* validation against first-person reports in a parallel condition. To study consciousness without reference to how it seems to the subject is to study the correlates of behavior, not consciousness itself.
  *   **Ruling on Current Dispute:** Investigator B's proposal to relegate reports to an appendix is rejected for the primary aim of the study. Reports must be central to the construction of the heterophenomenological world, even if motor output is minimized (e.g., using post-trial querying rather than real-time button presses).

  **4.4. Preregistration Requirements**
  *   **Policy:** All preregistration documents must explicitly state the evidential status of reports.
  *   **Required Language:** "First-person reports are treated as heterophenomenological data. They constitute the definitive record of the subject's conscious experience *as believed by the subject*, but they are not treated as infallible indicators of underlying neural states. Discrepancies between report and neural measure will be analyzed as model failures, not data errors."

  ### 5. Implementation and Adjudication

  **5.1. Decisive Disagreement**
  We acknowledge that this method underdetermines what happens when divergence is systematic (e.g., neural data consistently indicates awareness when the subject reports none). In such cases, the Institute mandates the following hierarchy of interpretation:
  1.  Check for motor/execution confounds in the report.
  2.  Check for sensitivity/specificity limits in the neural classifier.
  3.  If both hold, posit a dissociation (e.g., "unconscious awareness" or "report-blind consciousness") but label it as a theoretical construct, not an observed fact.

  **5.2. Voting Instruction**
  The Committee is asked to vote on the adoption of **Heterophenomenology as the Standing Methodology** (Option 1).
  *   A **YES** vote endorses the policies in Section 4.
  *   A **NO** vote returns the Institute to case-by-case adjudication, risking inconsistent standards across the funding cycle.

  ### 6. Conclusion

  This policy does not dismiss the Neurophenomenological insight that experience is subtle and requires training to articulate. Nor does it dismiss the No-Report insight that motor planning can confound neural signals. It integrates both by placing them in their proper evidential lanes.

  To Investigator A: Your trained observers provide richer texts. We value that. But their authority ends at the boundary of their own skin; they cannot dictate the interpretation of their brain scans.
  To Investigator B: Your caution regarding noise is warranted. But without the text, we have no phenomenon to correlate. We cannot study consciousness by eliminating the consciousness.

  By adopting heterophenomenology, we commit to a method that is rigorous enough to satisfy the skeptic and inclusive enough to capture the data. It is not a metaphysical solution to the Hard Problem, but it is the only methodological framework that allows us to work on the problem together without talking past one another.

  **Recommended Action:** Adopt Section 4 as Institute Policy for Funding Cycle 2024–2029.
