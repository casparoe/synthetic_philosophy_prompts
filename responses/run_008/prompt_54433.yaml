answer: |-
  Good morning. Thank you all for being here. For those who knew my grandmother only as family, you know her warmth. For those who knew her as a professor, you know her rigor. But to understand her life, and to understand how we honor her today, we have to talk about what she actually believed.

  She was a Leibnizian. For forty years, she taught that this is the best of all possible worlds. I know how that sounds today. When we are hurting, being told the world is "the best" can feel like a dismissal of our pain. But she wasn't Voltaire's Pangloss. She wasn't naive. She didn't think everything *felt* good. She thought everything *meant* something.

  She used to say God creates the "richest world on the smallest budget"—the maximum variety governed by the simplest laws. In that system, nothing is random. Nothing is wasted. Not even this. To say her death is "unfair" would be to insult the coherence she loved. To say the world is "worse" without her is to misunderstand the permanence of what she added to it. She is not subtracted from the sum of things.

  So, where is the comfort in that? The comfort is in her definition of love. She taught that to love someone is to take pleasure in their happiness. She told us often that loving us made her life light. If we truly loved her, then her joy must be our joy. And by her lights, she is not suffering. She believed the soul is not made by the body, so it is not unmade by the body's death. To her, death was a doorway, not a wall.

  She is not in a "better" place, because this world remains the best possible one. But she is in a clearer state. She is free from the confusion of the physical, perceiving the harmony she spent her life studying. She is, in her own terms, more alive than she was on Tuesday.

  To her brother, and to the skeptics here: She knew the cost of this optimism. She knew it required carrying the weight of the world's evil without breaking. She didn't ignore the shadows; she just insisted they were necessary for the light to be defined. She earned her hope. It wasn't a shield; it was a conclusion.

  So, how do we go on? We don't pretend we aren't sad. Grief is the shadow of love, and it has its reason. But we do not despair. We honor her by adopting her arithmetic of the heart. The more people you love, the more sources of happiness you have. She increased that sum. We increase that sum.

  She is not gone. She has simply turned the page. And if we love her, we find our pleasure in her peace.

  Thank you.
