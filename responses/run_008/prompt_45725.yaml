answer: |-
  # JOINT STATEMENT ON THE ST. PETERSBURG PARADOX
  **Adversarial Collaboration Draft**
  **Parties:** Proponent of Orthodox Expected Utility (EU) vs. Proponent of Bounded Rationality (BR)
  **Date:** October 26, 2023

  ## I. AGREED CLAIMS

  1.  **Mathematical Structure:** Both parties agree on the formal definition of the standard St. Petersburg lottery $L$: A fair coin is tossed until it lands heads for the first time at trial $n$. The payoff is $2^n$ monetary units. The expected value (EV) is the sum $\sum_{n=1}^{\infty} (1/2^n) \cdot 2^n$, which diverges to infinity.
  2.  **Finite Truncation:** Both parties agree that if the game is truncated at any finite $N$ (due to house bankroll limits or time), the expected value becomes finite ($N$), and standard decision theory yields a determinate rational price. The paradox arises strictly in the limit as $N \to \infty$.
  3.  **Descriptive Accuracy:** Both parties agree that no actual human being would pay an arbitrarily large finite sum (e.g., \$1,000,000) to play a single round of the standard game. The disagreement is normative (what *should* a rational agent do?), not descriptive.
  4.  **Rejected "Solutions":** Both parties reject the following as non-starters for resolving the *theoretical* paradox:
      *   **The "Finite Bankroll" Objection:** Arguing that "no casino has infinite money" dissolves the practical problem but fails to address the decision-theoretic implications of unbounded random variables.
      *   **Arbitrary Probability Thresholds:** Ignoring outcomes with probability below some fixed $\epsilon$ (e.g., $10^{-100}$) is rejected as ad hoc and violative of standard continuity axioms.
  5.  **Verbal Dispute Flag:** We acknowledge a partial verbal disagreement regarding the term **"Rational Price."**
      *   **EU Interpretation:** Distinguishes between *Expected Value* (a property of the gamble) and *Certainty Equivalent* (the agent's buying price). The EU proponent argues the EV is infinite, but the Certainty Equivalent is finite due to utility curvature.
      *   **BR Interpretation:** Argues that if the EV is infinite, the concept of "Value" in decision theory is broken. For the BR proponent, "Rational Price" *is* the Certainty Equivalent, and if EV diverges from this drastically, EV is the defective metric.
      *   **Resolution:** In the sections below, "Value" refers to Expected Value (mathematical), and "Willingness to Pay" (WTP) refers to the Certainty Equivalent (behavioral/normative).

  ## II. DISAGREEMENTS AND CRUXES

  | Area of Disagreement | Orthodox EU Position (Party A) | Bounded Rationality Position (Party B) |
  | :--- | :--- | :--- |
  | **1. Boundedness of Utility** | **Unbounded utility is permissible.** Rationality does not require utility functions to be bounded. If an agent has unbounded utility (e.g., linear in money), they *ought* to pay any finite price to play. Refusal to pay implies the agent has bounded/concave utility, not that the theory is wrong. | **Bounded utility is mandatory.** No coherent agent can value outcomes infinitely. Unbounded utility leads to dominance violations and "money pumps" in generalized scenarios (e.g., Super St. Petersburg). Rationality *requires* a utility cap. |
  | **2. Single-Shot vs. Aggregation** | **Single-shot primacy.** Decision theory is fundamentally about choice under uncertainty in a single instance. Long-run frequency properties are derivative. If the math says EV is infinite, the single-shot value is infinite (modulo utility). | **Ergodicity/Time-Average primacy.** A decision rule that leads to almost-sure bankruptcy in the long run cannot be rational for a single shot. The "Value" of a gamble is its time-average growth rate, which is finite/negative for high entry fees. |
  | **3. The Pasadena Variant** | **Axiomatic Gap.** The Pasadena game (conditionally convergent series) shows that EU theory is incomplete for undefined expectations, not false. It requires a tie-breaking rule or ordering axiom, not abandonment of expectation maximization. | **Reductio Ad Absurdum.** The Pasadena game proves that expectation maximization is ill-defined for unbounded domains. If the value depends on the order of summation, the concept of "Expected Value" is meaningless for such lotteries. |

  ## III. CONCRETE TEST CASES AND PREDICTIONS

  To adjudicate these disagreements, we agree to evaluate the following thought experiments. Each side commits to the predictions below.

  ### Case A: The "Super" St. Petersburg Game
  **Setup:** The payoff is modified to $2^{2^n}$ (growing much faster).
  **Relevance:** Tests **Crux 1 (Boundedness)**. Even a logarithmic utility function $U(x) = \ln(x)$ yields infinite expected utility here.

  *   **EU Prediction:** An agent with linear utility $U(x)=x$ is rationally required to mortgage their house to play. If an agent refuses, they are admitting their utility function is bounded, which is a psychological fact, not a constraint on rationality.
  *   **BR Prediction:** Any agent who pays a significant portion of their wealth to play is irrational, regardless of their stated utility function. The structure of the gamble itself violates rational coherence because the "value" cannot be integrated into a coherent preference ordering over wealth states.

  ### Case B: Repeated Play (The Ergodicity Test)
  **Setup:** An agent is offered the standard St. Petersburg game repeatedly ($N \to \infty$) for a fixed entry fee $F$.
  **Relevance:** Tests **Crux 2 (Aggregation)**. Does the "infinite value" manifest in long-run wealth accumulation?

  *   **EU Prediction:** The *ensemble average* (expected wealth across parallel universes) grows infinitely for any finite $F$. Therefore, the gamble is favorable. The fact that the *time average* (single agent's trajectory) may decline is a property of the path, not the value.
  *   **BR Prediction:** For any entry fee $F > 1$, the agent's wealth will almost surely converge to zero over time (bankruptcy). A rational agent must maximize time-average growth, not ensemble expectation. Therefore, the rational WTP is very low (approx. \$1–\$2), regardless of utility curvature.

  ### Case C: The Pasadena Game (Stress Test)
  **Setup:** Payoffs alternate in sign and magnitude such that the expected value series is $\sum (-1)^{n-1} \frac{2^n}{n} \cdot \frac{1}{2^n} = \sum \frac{(-1)^{n-1}}{n}$. This series conditionally converges to $\ln(2)$, but rearranging the terms yields any real number.
  **Relevance:** Tests **Crux 3 (Undefined Expectations)**.

  *   **EU Prediction:** The game has no defined Expected Value under standard axioms. A rational agent needs supplementary decision rules (e.g., principal value, or a specific ordering based on causal history) to price it. The lack of a unique EV does not invalidate EU for convergent cases.
  *   **BR Prediction:** The fact that the value is order-dependent demonstrates that "Expectation" is not a robust property of the gamble. Rational agents should treat this gamble as having *no* priceable value and should be indifferent between taking the gamble and not taking it, or reject it entirely as ill-posed.

  ## IV. SIGNATURES

  _________________________ (Orthodox EU Proponent)

  _________________________ (Bounded Rationality Proponent)

  _________________________ (Facilitator/Mediator)
