answer: |-
  To translate the historiographical debate into causal inference vocabulary, we must treat history as a single observed trajectory generated by a structural causal model with unobserved confounders and dynamic feedback. The debate concerns the identifiability and stability of treatment effects within this model.

  **Structuralist inevitability** asserts that the outcome distribution is invariant across the relevant range of policies. In July 1914 terms, the claim is that $P(Y=\text{War} \mid do(T=t)) \approx 1$ for all plausible diplomatic interventions $t$ within the support of the environment $X$ (alliances, militarism, economic pressure). The structural forces act as strong confounders that dominate the causal graph; the Average Treatment Effect (ATE) of specific contingent events (the assassination, the ultimatum) is near zero because the system is overdetermined. The variance of the outcome across counterfactual policies is negligible.

  **Contingency** argues the opposite: the system is highly sensitive to specific interventions. Here, the claim is that the individual treatment effect (ITE) of specific nodes is large and heterogeneous. A minimal perturbation to the policy (a telegram delayed, a minister ill) flips the outcome from $Y=0$ to $Y=1$. This implies the causal mechanism is unstable or chaotic; the gradient $\partial Y / \partial T$ is large. In off-policy evaluation terms, the importance weights required to shift from the observed historical policy to the counterfactual peace policy would yield high variance estimators because the outcome depends critically on low-probability events.

  **The methodological objection (the third camp)** translates to a claim about identification and positivity. They argue that counterfactual history violates the overlap assumption: $0 < P(T=t \mid X) < 1$. Since we observe only one trajectory ($N=1$ timeline), the support of the historical policy does not overlap with the support of the counterfactual policy. Any estimate of $E[Y(0)]$ given $Y(1)$ is pure extrapolation beyond the support of the data. Without the ability to validate the estimator against held-out data or experiments, the counterfactual is unidentifiable; the model is misspecified by definition because the true structural equations are unknown.

  ### Residue Report

  **1. Clean Translations**
  The logical structure of the debate maps cleanly onto identification conditions. The structuralist claim is effectively a hypothesis about robustness: the outcome is insensitive to policy variation within the confidence region of the environment. The contingentist claim is a hypothesis about heterogeneity: treatment effects are large and localized. The anti-counterfactualist objection is precisely the positivity violation inherent in single-trajectory observation. When historians argue that "you cannot rewind time," they are stating that we lack the multiple realizations required to estimate variance or validate the propensity score model. The distinction between "inevitable" (structural determinism) and "contingent" (sensitive dependence) corresponds directly to the magnitude of the causal effect relative to the noise variance in the system.

  **2. Distortions and Asymmetries**
  The translation distorts significantly regarding the exogeneity of the policy. In off-policy evaluation, the logging policy is typically fixed or known. In history, the "policy" (human agency) is endogenous to the environment it acts upon. The decisions of July 1914 were not drawn from a known distribution $P(T|X)$; they were produced by the very structural forces ($X$) whose causal role is in dispute. This creates a circular identification problem: you cannot reweight for agency without modeling the decision process, but modeling the decision process requires knowing the structural forces you are trying to identify.

  Furthermore, historical units are not independent. SUTVA (Stable Unit Treatment Value Assumption) fails because interventions propagate through time. A "treatment" in 1914 changes the covariates for 1915. This dynamic feedback loop means the "environment" is non-stationary. In bandit terms, the reward function and transition dynamics change based on the policy history. Consequently, estimating the ATE of a specific decision ignores that the decision itself alters the subsequent state space, making static causal graphs inadequate for dynamic historical processes.

  **3. No Expression in Vocabulary**
  Three critical elements lack expression. First, **narrative singularity**. Causal inference compares distributions across possible worlds; historians often seek the explanation for *this* specific realized token event. They want the sufficient component cause for the actual trajectory, not the average effect across counterfactuals. My vocabulary optimizes for generalization; theirs often optimizes for specific reconstruction.

  Second, the **epistemic vs. ontological status of inevitability**. When a historian says "war was inevitable," are they claiming $P(Y=1)=1$ (ontological), or that given our knowledge $X$, $P(Y=1|X) \approx 1$ (epistemic)? Causal tools assume ontological causality but measure epistemic uncertainty. They cannot distinguish a world where peace was impossible from a world where peace was possible but improbable given the observed covariates.

  Third, **rhetorical stance**. "Inevitability" is often a moral claim about responsibility (if inevitable, no one is to blame) rather than a causal claim. My vocabulary treats causality as descriptive; it cannot capture the normative function of inevitability talk in assigning guilt or absolving actors.

  ### Verdict

  The residue piles up for three reasons, weighted by my confidence:

  1.  **Historians arguing past each other (High Confidence: 85%):** Much of the debate stems from conflating epistemic certainty with ontological determinism. Structuralists often mean "highly probable given known constraints," while contingents mean "possible given unknown variables." My tools separate these cleanly (probability vs. structural invariance), suggesting the historiographical friction is often semantic confusion that causal vocabulary resolves.
  2.  **Imprecise Historical Talk (Medium Confidence: 70%):** Historians often use "cause" to mean "narrative emphasis" rather than "counterfactual dependence." When they demand a singular explanation, they are not asking for an estimator; they are asking for a story. This is a category error relative to causal inference, which demands comparison classes.
  3.  **Missing Vocabulary (Low Confidence: 40%):** It is less likely that causal inference is missing a fundamental metaphysical component and more likely that history is a non-stationary, endogenous system that violates the assumptions required for clean identification.

  **Least Sure Point:** I am least confident in the **identification analogy** regarding the single observed trajectory. In off-policy evaluation, we assume the logging policy is known or estimable from data. In history, we have $N=1$ unit (the timeline), no access to the logging policy (the minds of actors), and no possibility of validation. This is not just a variance problem; it is a fundamental failure of identifiability that exceeds standard missing-data problems. I am only 50% confident that "unidentifiable" captures the full depth of the historian's objection, because historians sometimes accept plausible counterfactuals even when identification is technically impossible, relying on qualitative coherence rather than statistical support. My vocabulary treats this as model misspecification; they may treat it as interpretive validity. This gap remains the largest source of untranslatable friction.
