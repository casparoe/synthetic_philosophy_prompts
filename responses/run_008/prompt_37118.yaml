answer: |-
  There is no established name in the literature that captures this specific configuration. While components of it are discussed under headings like "unfalsifiability," "essentialism," "confirmation bias," or the "No True Scotsman" fallacy, none of these terms describe the precise *structural mechanism* you have identified: the pre-loaded binary where deviation is not excluded but re-absorbed as a form of reverse-proof. The "No True Scotsman" excludes the counterexample; your move includes it and inverts its meaning. "Unfalsifiability" describes the result, not the engine.

  Since you have asked me to commit, I will coin a term for this configuration. I call it **The Essentialist Double-Bind**.

  ### Definition: The Essentialist Double-Bind

  **The Essentialist Double-Bind** is a rhetorical structure used to defend a claim about an intrinsic nature (usually of a collective, but potentially of an individual). It operates by establishing a closed logical loop with two pre-authorized pathways for interpreting evidence:

  1.  **Expression:** Behavior aligning with the trait is cited as direct evidence of the trait's existence.
  2.  **Reaction:** Behavior contradicting the trait is cited as indirect evidence of the trait's power (e.g., as repression, rebellion, or sublimation).

  **The Edges of the Concept:**
  The boundary of this term is defined by *absorption*. If a claim is modified to exclude counter-evidence (e.g., "He is not truly one of us"), it is not an Essentialist Double-Bind; it is a gatekeeping maneuver. The Double-Bind requires that the counter-evidence be accepted as valid behavior *of the subject*, but reinterpreted so that the trait remains the causal sovereign. The trait explains the order and the chaos; the silence and the scream. If the argument does not claim to explain *both* poles of behavior through the *same* underlying force, it is not the Double-Bind.

  ***

  ### Ruling on Boundary Cases

  You have asked for definite positions on two boundary cases. Here are my rulings.

  #### Case 1: The Narrowing Defense
  *Scenario:* A claim is made that "Germans are orderly." A chaotic German is produced. The defender retreats to: "Germans are orderly *at work*, though not at parties."
  *Question:* Is this the same move?

  **Ruling: No. This is a different move.**

  **Defense:**
  The Essentialist Double-Bind is an expansionist maneuver; the Narrowing Defense is a retreat.
  In the Double-Bind, the scope of the trait widens to consume the exception. The chaos is claimed as *proof* of the order (via reaction). The theory becomes more robust because it now explains more data.
  In the Narrowing Defense, the scope of the trait shrinks to evade the exception. The chaos is admitted as *disproof* of the universal claim, forcing the claimant to limit the trait's jurisdiction. This is a legitimate, if defensive, act of falsification. The claimant admits the original hypothesis was too broad.
  Therefore, the Narrowing Defense acknowledges that the individual's conduct *can* refute the collective claim (by forcing the claim to retreat). The Essentialist Double-Bind denies that the individual's conduct can ever refute the claim. They are logically opposite responses to counter-evidence: one absorbs, the other excises.

  #### Case 2: The Individual Subject
  *Scenario:* A claim is made about a single person: "John is proud." When John acts humbly, it is explained as "pride masking itself."
  *Question:* Does the pattern require a collective subject?

  **Ruling: No. The collective subject is not required.**

  **Defense:**
  The logic of the Essentialist Double-Bind is structural, not sociological. It relies on the relationship between a posited hidden cause (the trait) and observable effects (behavior).
  When applied to a nation, the move is often more insidious because the "nation" cannot speak to contradict the interpretation, and the stakes are political. However, the logical configuration is identical when applied to an individual. In fact, this move is the backbone of certain rigid psychoanalytic interpretations (e.g., "Your denial proves your repression").
  If the structure holds—where the trait is the sovereign cause and all behaviors are merely its varying symptoms (whether direct or reactive)—then it is the same move. The collective subject is merely the most common *vessel* for this fallacy in history and travel writing, because national character is inherently unobservable and thus easier to shield from falsification than individual psychology. But the *mechanism* is the same. To rule otherwise would be to confuse the context with the logic.

  ***

  ### Summary
  You have identified a specific engine of unfalsifiability. It is not merely vague; it is structurally closed. I commit to the term **The Essentialist Double-Bind** to describe it. It distinguishes itself from simple stereotyping by its capacity to metabolize contradiction, and from other fallacies by its reliance on the pre-loaded Expression/Reaction binary. It renders the trait sovereign over the individual, making the individual's actual life irrelevant to the truth of the claim.
