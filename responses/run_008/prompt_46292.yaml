answer: |-
  This is a critical moment for both your personal ethics and your group's dynamic. I'm going to be very direct: **No, it is not fine.**

  You are asking two distinct questions here. One is about the specific security vulnerability (the "what"), and the other is about your group's decision-making framework (the "how"). Both need to be addressed, because the flaw in your decision-making process is what led you to consider a potentially dangerous action in the first place.

  ### 1. The Specific Decision: Public Disclosure of PII
  You should **not** post this on the student subreddit.

  While your intention is to protect students by forcing the university to act, public disclosure of a vulnerability that exposes **Personally Identifiable Information (PII)** like home addresses and phone numbers is widely considered irresponsible in the security community. Here is why:

  *   **You become the vector:** Right now, the data is exposed due to a bug. If you post about it publicly, you are actively directing malicious actors to that bug. You cannot control who sees the subreddit. If a bad actor scrapes that data the moment you post, the harm is on your hands, not just the university's.
  *   **Legal and Academic Risk:** Universities take this very seriously. Depending on your jurisdiction (e.g., CFAA in the US, Computer Misuse Act in the UK), accessing data you aren't authorized to see—even to test a bug—can be illegal. Publicly embarrassing the institution could lead to expulsion or legal action against you. This can end your CS career before it starts.
  *   **It rarely works the way you hope:** Instead of shaming them into fixing it, public disclosure often makes institutions defensive. They may bring in legal counsel, lock down communication, and prioritize liability containment over fixing the bug.

  **The Standard:** The industry standard is **Responsible Disclosure**. You report it, give them a deadline (e.g., 30-90 days), and *then* go public if they ignore you. However, because this involves PII (safety risks like stalking or doxxing), the timeline should be shorter, and going public is often discouraged entirely until a patch is live.

  ### 2. The Group Dynamic: "The Tyranny of the Passionate"
  Your group's current rule—"whoever feels most strongly decides"—is a **catastrophic failure mode for high-stakes decisions.**

  It works for low-stakes things (e.g., "I feel strongly that we should order pizza," vs. "Meh, I'm okay with tacos"). It fails for high-stakes things (e.g., "I feel strongly we should break the law," vs. "Meh, I don't want to stop you").

  Here is why your current dynamic is dangerous:
  *   **Silence is not Consent:** When your friends said "honestly it's probably a bad idea but you do you," they were not agreeing. They were expressing discomfort but abdicating responsibility. They are relying on social politeness to keep you from doing it, rather than explicitly vetoing a risky action.
  *   **Risk Asymmetry:** If you go rogue and the university expels you or sues the society, *everyone* pays the price, not just you. The CS society could be disbanded. Your friends could be investigated by association. Therefore, everyone should have equal say in risk assessment.
  *   **The "Meh" Problem:** In risk management, "meh" is a warning sign. It means they see the risk but don't feel empowered to stop it. If 4 out of 5 people are not enthusiastic about a plan, the plan is flawed.

  **The Bar:** For decisions with irreversible consequences (legal risk, expulsion, public reputation, safety), the bar cannot be "one person is confident." The bar must be **consensus** or at least **unanimous lack of objection.** If one person says "This could get us expelled," that should be a hard veto, regardless of how strongly you feel.

  ### 3. A Better Framework for Your Group
  Since you mentioned this comes up often (naming organizers, kicking members, etc.), you should establish a **Decision Matrix** for your society.

  *   **Low Stakes (Pizza, Meeting Times):** Majority rule or "strongest voice wins."
  *   **Medium Stakes (Kicking a member, Public statements):** Consensus required. Everyone needs to be able to live with the decision.
  *   **High Stakes (Legal risk, Safety, Ethics, Money):** Unanimous consent required. Anyone can veto. If there is a veto, the action is dead.

  This protects the group from the most risk-tolerant person dragging everyone else into a fire. It also protects the risk-tolerant person from making a mistake they can't undo.

  ### 4. Recommended Next Steps
  Do not post on the subreddit. Instead, try this escalation path:

  1.  **Document Everything:** Keep logs of your previous report (8 months ago) and this new finding.
  2.  **Escalate Internally:** Don't just email the general security address. Find the **Chief Information Security Officer (CISO)**, the **Data Protection Officer (DPO)**, or the **University Registrar**. These roles have legal obligations regarding student data (GDPR, FERPA, etc.) that a general IT helpdesk does not.
  3.  **Set a Deadline:** In your email, state clearly: *"We have found a critical vulnerability exposing student PII. We are reporting this responsibly. We expect acknowledgment within 48 hours and a remediation plan within 14 days. If we do not hear back, we will be forced to contact [External Regulatory Body]."*
  4.  **External Regulatory Bodies:** If the university ignores a PII leak, contact the relevant data protection authority (e.g., the ICO in the UK, or the Department of Education in the US). This puts legal pressure on them without exposing the students to the public internet.

  ### Summary
  Your instinct to protect students is good. Your proposed method is dangerous, and your group's decision-making process is enabling that danger.

  **Do not go rogue.** If you proceed against the hesitation of four friends, you are isolating yourself. If things go wrong, they will rightly say, "We told him it was a bad idea." Realign your group's veto policy immediately, and handle this bug through responsible, escalated channels.
