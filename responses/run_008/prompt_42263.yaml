      *   *Claim 5:* "The closure principle says knowledge is closed under known implication: if you know P, and you know that P implies Q, then you know Q."
          *   **Critique:** Standard definition. Acceptable for intro level.

      *   *Claim 6:* "Nozick rejects closure because of skeptical hypotheses. On his theory you know ordinary things like 'I have hands,' but you don't know 'I am not a brain in a vat,' because if you were a brain in a vat you would still believe you have hands, so that belief doesn't track."
