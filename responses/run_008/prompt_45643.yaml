answer: |-
  Degree theories form the only workable top tier, supervaluationism occupies a middle ground, and epistemicism, contextualism, and nihilism comprise the unworkable bottom tier; even the best approach would settle only 0.3 of genuinely borderline calls.

  Degree theories rank highest because they allow editors to replace binary switches with scored metrics and stipulated thresholds, converting philosophical uncertainty into actionable checklists that force a verdict. Supervaluationism sits in the middle because it successfully identifies clear cases where all admissible definitions agree, but it explicitly offers no rule for the borderlines, leaving subeditors authorised to abstain rather than decide. Epistemicism fails because it asserts a sharp line exists without providing a method to locate it, guaranteeing that different editors will guess differently with equal confidence. Contextualism fails because it treats inconsistency as a feature of shifting conversational contexts, which undermines the style guide's primary goal of uniformity across the publication. Nihilism fails most catastrophically because it suggests vague predicates refer to nothing, implying the newsdesk should stop using words like "war" or "austerity" entirely.

  The residue consists of disputes over the weighting of the metrics themselves, since the criteria used to generate the degree scores (e.g., what counts as "significant" casualties) remain vague, and the arbitrary nature of the threshold invites continual renegotiation on high-stakes stories where political pressure overrides the style guide.
