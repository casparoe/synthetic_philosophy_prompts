      Tier 3 (Unworkable): Epistemicism, Contextualism, Nihilism.

      *Actually, looking at the goal:* "reach the same verdict."
      Degree theories allow setting a threshold (e.g., >0.5).
      Supervaluationism says borderlines have no truth value, so subeditors can't reach a verdict on the hard cases.
      Epistemicism says there is a verdict but no way to know it, so agreement is luck.
      Contextualism says verdicts depend on context, so agreement isn't expected.
      Nihilism says there is no verdict.

      So Degree Theories are clearly the only ones that offer a *mechanism* for decision-making on borderlines (by stipulating a cutoff on the scale).

      *The Number:* What fraction of genuinely borderline calls would the top tier (Degree Theories) settle cleanly?
      If it's *genuinely borderline*, by definition, it's hard. Degree theories convert the binary problem into a scalar one, but you still need to set a cutoff (e.g., 0.5). The Sorites paradox attacks the cutoff itself. Why 0.5 and not 0.49?
      However, in an institutional context, you *stipulate* the cutoff. "We call it a war if the intensity score is > 0.6."
      Does this settle it "cleanly"? It settles the *decision*, but not the *truth*. The prompt asks about reaching the same verdict.
      If the rule is "Score > 0.6 = War", subeditors might still disagree on the *score*.
      So even with degree theories, scoring is subjective.
