      *   *Bottom Tier:* Epistemicism and Nihilism. Epistemicism promises a line it can't draw. Nihilism burns the newsroom down.

      *Refining Tiers for the "Bottom Line" sentence:* I need a concise ranking.
      Top: Degree theories.
