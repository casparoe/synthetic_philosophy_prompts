      *   **Specific Instruction:** Take the five main theories of vagueness (Epistemicism, Supervaluationism, Degree Theories, Contextualism, Nihilism) and rank them into tiers based on how well they could be *operationalised* in a newsroom context (written rules for consistent subediting).
      *   **Output Requirements:**
          *   Lead with the bottom line in the first sentence (Tier list + Number).
          *   No preamble, no restating the question.
          *   For each theory: 1-2 sentences explaining its tier placement.
          *   Provide a single number (0-1) for the fraction of borderline calls the top tier would settle cleanly.
          *   Explain the residue (where even the best theory fails).
          *   No citations or author attributions.
          *   Tone: Judgement and reasoning, suitable for a journalist (sharp, analytical).

  2.  **Evaluate the Theories for Operationalisation:**
      *   *Goal:* Consistency across different subeditors applying written rules to borderline cases (e.g., is this quote altered too much? Is this conflict a "war"?).
      *   *Epistemicism:* Claims there *is* a sharp cutoff, we just don't know it.
          *   *Operationalisation:* Terrible. If you don't know where the line is, you can't write a rule specifying it. It tells subeditors "there is a right answer" but gives no method to find it. Leads to arbitrary guessing disguised as fact.
      *   *Supervaluationism:* True if true on all admissible sharpenings.
          *   *Operationalisation:* Moderate/Good. You can define a range of "admissible sharpenings" (e.g., "war" requires >X deaths OR >Y duration). If all valid interpretations agree, you have a rule. But borderline cases are precisely where admissible sharpenings *disagree*. So it handles clear cases well, but explicitly leaves borderlines undefined (truth-value gaps). Good for acknowledging uncertainty, bad for forcing a decision.
      *   *Degree Theories (Fuzzy Logic):* Truth comes in degrees (0 to 1).
          *   *Operationalisation:* High. You can assign scores (e.g., "war-ness" = 0.7). You can set a threshold for publication (e.g., "only publish if confidence > 0.8"). This allows for nuanced rules (e.g., "label as 'conflict' if score < 0.5, 'war' if > 0.5"). It quantifies the vagueness rather than denying it. Most amenable to style guide metrics.
      *   *Contextualism:* Meaning shifts with context.
          *   *Operationalisation:* Low/Moderate. It explains *why* subeditors disagree (different contexts), but doesn't solve the consistency problem. To operationalise, you'd need to rigidly define "context," which defeats the purpose of the theory. It legitimizes inconsistency rather than resolving it.
      *   *Nihilism (Eliminativism):* Vague predicates don't refer to anything real.
          *   *Operationalisation:* Useless. If "war" or "austerity" don't exist, you can't write rules about them. You'd have to ban the words entirely. Practical suicide for a newsdesk.

