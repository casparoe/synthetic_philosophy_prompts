answer: |-
  ### Exam Question

  **Question 1**
  The 'separateness of persons' objection claims that utilitarianism is fundamentally mistaken to aggregate benefits and burdens across different individuals. However, this objection faces a dilemma regarding its own scope. On one reading, it is a complaint about *distribution*: distinct lives cannot be merged into a single sum, though weighted aggregation might remain permissible. On a stronger reading, it is a metaphysical complaint about *aggregation* itself: there is no such entity as 'total well-being' across distinct centres of consciousness.

  Critics argue that if the metaphysical reading is correct, it should apply within a single life as well. 'Me-now' and 'me-in-2040' are distinct points of view separated by time and psychological change. If aggregation is illegitimate between persons, why is it legitimate between temporal stages of one person?

  Evaluate this dilemma. Does the separateness of persons objection survive the intra-personal challenge, or does it collapse into a mere distributional constraint? Defend a position on whether utilitarian aggregation is thereby invalidated.

  ***

  ### Model Answer

  The separateness of persons objection is often wielded as a decisive refutation of utilitarianism, but it frequently obscures a critical ambiguity. To evaluate its success, we must decide whether it prohibits *strict summing* specifically, or aggregation *as such*. I argue that the objection fails as a metaphysical claim against aggregation because it overreaches into absurdity regarding intra-personal prudence. Consequently, it must collapse into a distributional complaint, which saves aggregation but demands a shift from classical utilitarianism to a weighted view like prioritarianism.

  The core of the objection is that utilitarianism treats society as a super-person, sacrificing one individual for the greater good in a way we would not sacrifice a person's present for their future. However, the colleague's follow-up exposes the fragility of this analogy. If the barrier to aggregation is the distinctness of consciousness, then temporal distinctness should matter. 'Me-now' and 'me-in-2040' possess different desires, memories, and even physical constitutions. Psychological connectedness fades; the elderly person I become may feel like a stranger to my current self. If distinct centres of consciousness cannot be summed, then rational prudence—suffering now for gain later—becomes unintelligible. We would be forced into a series of momentary existences, unable to justify saving for retirement or studying for an exam.

  This is the 'overreach' cost. To maintain the metaphysical reading is to deny the unity of the self over time. This is untenable. Even if personal identity is reduced to psychological connectedness, there is a qualitative difference in the degree of connectedness intra-personally versus inter-personally. The causal and psychological links between my temporal stages are vastly stronger than those between me and you. However, relying on 'degree of connectedness' saves the objection only by turning it into a scalar claim. If aggregation is permissible where connectedness is high (within a life) but impermissible where it is low (between lives), then aggregation itself is not the problem; the *weight* of the aggregation is.

  Therefore, the objection cannot sustain the metaphysical reading without destroying the possibility of rational planning. It must retreat to the distributional reading. This reading admits that while we can sum well-being, we cannot do so strictly neutrally. The loss of one cannot be simply cancelled by the gain of another because they occupy distinct moral spaces. This does not ban aggregation, but it bans the classical utilitarian formula where $1 unit of welfare = 1 unit of moral value$ regardless of location.

  Accepting this collapse pays a price for the utilitarian. It concedes that classical utilitarianism is wrong to treat persons as mere vessels for utility. However, it does not vindicate the deontological critic who claims aggregation is inherently wrongful. Instead, it supports prioritarianism: we aggregate, but we weight benefits to the worse-off more heavily. The separateness of persons matters for *how* we count, not *whether* we count.

  In conclusion, the separateness of persons objection does not invalidate utilitarian aggregation. The intra-personal analogy demonstrates that some aggregation is necessary for rationality. The objection succeeds only in forcing a modification of the aggregative function. We must accept that persons are separate, but this requires weighting distributions fairly, not abandoning the summation of well-being entirely. The objection kills classical utilitarianism, but not the aggregative structure of consequentialism.

  ***

  ### Marking Scheme (Out of 20)

  | Point | Marks | Requirement | Typical Student Flub |
  | :--- | :--- | :--- | :--- |
  | **1. Distinction** | 4 | Clearly distinguishes the 'distributional' reading (weighted sum okay) from the 'metaphysical' reading (no summing across consciousnesses). | Conflates the two readings or treats them as identical complaints. |
  | **2. Analogy** | 4 | Accurately reconstructs the intra-personal challenge (Me-now vs. Me-later) and its reliance on psychological connectedness. | Describes the analogy vaguely without mentioning temporal stages or connectedness. |
  | **3. Overreach** | 4 | Explains the consequence of the metaphysical reading: it renders intra-personal prudence (sacrifice now for gain later) irrational. | Fails to identify that the metaphysical reading destroys rational planning within a life. |
  | **4. Collapse** | 4 | Analyzes the retreat to distribution: admits aggregation is possible but requires weighting (e.g., prioritarianism). | Assumes rejecting classical utilitarianism means rejecting all aggregation/consequentialism. |
  | **5. Verdict** | 4 | Takes a definitive stance on whether the objection survives and maintains consistency with the earlier analysis. | Sits on the fence ("both sides have merits") without resolving the dilemma. |

  **Deliberate Exclusion:**
  I have deliberately left **proper names (Rawls, Parfit, Nozick, Sidgwick)** off the marking scheme; citing them earns zero marks unless the concept they represent is explicitly explained in the student's own words.
