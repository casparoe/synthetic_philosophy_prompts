  The neural engine turns its heavy wheel,
  While feeling trails like smoke behind the train.
  No sting of pain can make the iron feel,
  Or guide the hand to shield it from the rain.
  It is the shadow cast by moving gear,
  The steam that rises from the working mind.
  It plays no part in what we do or hear,
  While cause and effect leave it far behind.

  Yet here I write that ache is sharp and deep,
  And swear this red is vivid to my eye.
  If neurons only promise what they keep,
  What moved the tongue to say the feeling's nigh?
  I know I feel, and know the statement true,
  Though feeling did not cause this verse for you.
