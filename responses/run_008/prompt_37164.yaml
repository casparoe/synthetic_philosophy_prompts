answer: |-
  You have identified a classic and sophisticated objection to coordination-based accounts of convention, often called the "inevitable inertia" problem. However, your argument contains a critical error regarding how expectations function within Lewis's framework.

  The error lies in your assumption that expectations must lag behind behavior. You argue that for a convention to change, someone must deviate *first*, and that this deviator necessarily faces the old expectations of everyone else. Lewis explicitly rejects this. For Lewis, conventions are sustained by a system of *mutual expectations* and *common knowledge*. Change occurs when this system of expectations shifts, often due to a "focal point" or salient event (like a new law, a technological breakthrough, or a public announcement).

  When such a shift in common knowledge occurs, agents can update their expectations *before* they act. They do not need to wait for someone else to deviate first; instead, they can coordinate on the new behavior simultaneously because they now *expect* others to do the same. The first people to adopt the new convention are not "lone deviators" suffering a loss; they are coordinated switchers acting on updated expectations. Therefore, the payoff matrix changes alongside the expectations, removing the penalty for switching.

  Regarding your second question: Lewis's own account is primarily rationalistic and focuses on how common knowledge sustains equilibrium. He explains change through shifts in salience and precedent, which can be sudden. He does not fully develop a theory of *gradual* evolutionary change himself. That project was taken up by later theorists like Brian Skyrms and H. Peyton Young, who combined Lewis's insights with evolutionary game theory. They show how small variations can be selected for over time through learning dynamics rather than explicit rational coordination. So, while Lewis's framework allows for change (refuting the "frozen" claim), explaining gradual biological-style evolution requires extending his work with dynamic learning models.

  \verdict{Assumes expectations cannot shift prior to behavioral deviation.}
