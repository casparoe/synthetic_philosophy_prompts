  Hi, here is the draft for the interview segment, structured as eight distinct questions with follow-ups embedded in each paragraph so we can see the flow during recording. For the opening, I want to ask her to clarify her public statement that once voters can rank candidates, tactical voting becomes pointless and no one ever needs to bury their favorite to stop their least favorite. I will ask if she means this is a mathematical guarantee for every possible election or a general observation about voter behavior. The follow-up here is keyed to her likely answer that it is a practical observation rather than a strict law, in which case I will ask her to define the threshold where a system stops being resistant to strategy and starts being vulnerable to it.

  Next, I need to separate the strict claim that no voter can ever gain by ranking insincerely from the weaker empirical claim that such gains are merely rarer or harder to identify under ranked ballots than under plurality. I will ask her directly which of these two claims her campaign is actually making to the public. If she admits, as I expect, that she is making the weaker empirical claim that strategy is just less effective, my follow-up will press her on how we measure that rarity and whether admitting any possibility of gain undermines the slogan that tactical voting is pointless.

  For the third question, I plan to bring up the fundamental theorem on voting strategy which states that any rule for electing one of three or more candidates that is non-dictatorial and responsive must reward at least one voter for misreporting in some configuration. I will ask her to say which precondition of the theorem she rejects, whether it is unrestricted preference rankings, more than two viable candidates, or non-dictatorship, and what follows if she rejects none of them. I am anticipating she will argue that the theorem assumes unrestricted preferences whereas real electorates are less varied than that, so my follow-up will ask if that protection holds if political polarization increases and preferences become more varied over time.

  The fourth question will focus on the information required to game the system, noting that the theorem assumes perfectly informed, perfectly calculating voters. I will ask if her position relies on the idea that real voters rank sincerely out of habit because they cannot perform the necessary calculations. Since I predict she will argue that real voters rank sincerely out of habit whereas the theorem assumes perfect calculation, my follow-up will ask whether relying on voter habit rather than structural immunity makes the system fragile if voters become more sophisticated.

  Moving to evidence, the fifth question will ask what evidence in real elections conducted with ranked ballots could show that strategic misranking happens less often than under plurality. I will include a specific hypothetical about a voter who deliberately ranks a weak compromise above a strong rival in order to change the elimination order and ask what she would say to that voter if their tactic succeeds. The follow-up here is designed for her likely response that such cases are anomalies, so I will ask if a single successful instance of strategy invalidates the claim that the system removes the need for such tactics.

  In the sixth question, I want to compare the systems directly by asking if she is arguing that ranked ballots simply reduce the frequency of strategic voting compared to plurality rather than eliminating it entirely. I will ask if this concession means that voters still need to think strategically, just less often than they do now. My follow-up is keyed to the answer that yes, it is just an improvement rather than a solution, which will lead me to ask if campaigning on the elimination of strategy is misleading if the reality is merely a reduction in strategy.

  For the seventh question, I will ask about the burden of proof regarding voter intent, specifically whether a voter who ranks insincerely is acting irrationally or simply responding to the incentives the system provides. I will ask if the system should be judged by how it treats sincere voters or by how it incentivizes all voters. The follow-up here anticipates her saying we should judge by sincere voters, so I will ask why the system should not be designed to align incentives with sincerity rather than hoping voters ignore the incentives.

  Finally, for the closing question, I want to ask what would count against her campaign's central claim, phrased so that it cannot be answered with we just need more voter education about how ranking works. I will ask for a specific observable outcome in an election result that would force her to admit the system is manipulable. The follow-up is crucial here, as I expect she might try to pivot to education again, so I will ask directly if that outcome occurs, will she update the campaign messaging to acknowledge that strategy is still possible.
