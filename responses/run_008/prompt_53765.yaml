answer: |-
  This is an exceptionally mature starting point for an Extended Project. Your supervisor is correct: before you can judge whether a theory succeeds, you must define what success looks like. In philosophy, this is often called establishing the *desiderata* (the things desired) of a theory.

  Below is a specification for an adequate theory of moral desert. I have structured this as a list of requirements, followed by the justification for each, the specific cases they must handle, and a classification of their status (whether they are logical necessities or contested philosophical commitments). Finally, I will address the suspicion you raised about joint unsatisfiability, and briefly test your three candidates against the specification.

  ### The Specification: Requirements for a Theory of Moral Desert

  #### 1. The Control Condition
  **Requirement:** A person can only deserve praise or blame (and subsequent reward or punishment) for factors under their voluntary control.
  **Rationale:** It seems fundamentally unfair to hold someone responsible for what is merely a matter of chance. If desert is a moral concept, it must respect the agency of the individual.
  **Case Application:**
  *   *The Drunk Drivers:* Your theory must explain why the driver who kills a child is not morally more blameworthy than the identical driver who was stopped by a lucky police checkpoint, since the difference was pure luck.
  *   *Unearned Virtue:* It must account for the fact that a person's patience or courage often stems from genetics or parenting, which they did not choose.
  **Status:** **Contested Preference.** While this is a requirement for Kantians and libertarians, compatibilists (who believe determinism and responsibility can coexist) and hard determinists reject it. Some argue we *do* deserve things based on outcomes, regardless of control.

  #### 2. The Fittingness Constraint
  **Requirement:** The response (reward or punishment) must be intrinsically appropriate to the action or character, not merely useful.
  **Rationale:** This distinguishes *desert* from *utility*. If we punish a criminal solely to deter others, we are using them as a means to an end. Desert demands the punishment be a *fitting* response to the wrong itself.
  **Case Application:**
  *   *Punishment:* A theory must explain why punishing an innocent person is wrong even if it would calm a riot (utility), because they do not *deserve* it.
  **Status:** **Non-negotiable (Conceptual).** If a theory collapses this distinction, it ceases to be a theory of *desert* and becomes a theory of *consequentialism* (the view that the morality of an action is determined by its outcome). However, whether desert *exists* is contested.

  #### 3. The Distinction from Entitlement
  **Requirement:** The theory must distinguish between what a person deserves (moral merit) and what a person is entitled to (rules-based claim).
  **Rationale:** You can be entitled to something you do not deserve (e.g., a prize due to a clerical error), and deserve something you are not entitled to (e.g., help from a stranger when you have no right to demand it).
  **Case Application:**
  *   *The Student:* A student may be *entitled* to an A because they met the marking criteria, even if the exam topics favoured their specific revision luck. But do they *deserve* the A in a deeper moral sense? A theory must separate the institutional rule from the moral merit.
  **Status:** **Non-negotiable (Conceptual).** Collapsing these terms leads to confusion between legal/institutional justice and moral justice.

  #### 4. The Explanatory Power Requirement
  **Requirement:** The theory must make sense of our ordinary practices of praise, blame, gratitude, and resentment without dismissing them as mere illusions.
  **Rationale:** If a theory of desert concludes that no one ever deserves anything, it conflicts with deep-seated human intuitions and social practices (what P.F. Strawson called our 'reactive attitudes'). An adequate theory should either vindicate these practices or explain why we must radically revise them.
  **Case Application:**
  *   *The Drunk Drivers:* In law and ordinary life, we *do* blame the killer more than the lucky driver. A theory that says this is wholly irrational struggles to explain why this practice is so universal.
  **Status:** **Contested Preference.** Skeptics about desert (like some luck egalitarians) are willing to say our ordinary practices are indeed mistaken. Defenders of desert say the theory must save the phenomena.

  #### 5. The Non-Arbitrariness Condition
  **Requirement:** The basis for desert must not be morally arbitrary.
  **Rationale:** If two people are identical in all moral respects, they should be treated identically. Differences in treatment must track differences in moral agency, not differences in nature or nurture.
  **Case Application:**
  *   *Unearned Virtue:* If Person A is kind because they chose to be, and Person B is kind because they have a 'nice' brain chemistry, a theory must explain if they deserve equal credit.
  **Status:** **Contested Preference.** This is the core of the Rawlsian critique. Some argue that as long as the action was voluntary, the origin of the character does not matter.

  ---

  ### The Joint Unsatisfiability (The Contradiction)

  You suspected that requiring desert to track only what is under a person's control, while also requiring it to make sense of our ordinary practices, cannot both be done. **You are correct.** This is the central problem in the literature, often referred to as the problem of **Moral Luck**.

  Here is the contradiction stated plainly:

  1.  **Premise A (The Control Principle):** To deserve something, it must be up to you. (Requirement 1).
  2.  **Premise B (The Ubiquity of Luck):** Nothing (or almost nothing) is entirely up to you. Your character, your opportunities, and the outcomes of your actions are all influenced by genetics, upbringing, and circumstance. (Requirement 5).
  3.  **Premise C (The Practice Constraint):** We must justify our actual practices of blaming the killer more than the lucky driver, and rewarding the talented more than the untalented. (Requirement 4).

  **The Conflict:** If you accept Premise A and Premise B, you must conclude that no one ever truly deserves anything. This satisfies logic but violates Premise C (it renders our ordinary practices irrational). If you accept Premise C and Premise B, you must reject Premise A (admitting people deserve things based on luck). If you accept Premise A and Premise C, you must reject Premise B (arguing that there is a 'core self' untouched by luck, which is scientifically and philosophically difficult to prove).

  **Verdict:** There is no known theory that satisfies all five requirements above simultaneously. Any adequate theory must explicitly state which requirement it is willing to sacrifice. A theory that claims to satisfy all of them is likely hiding a contradiction.

  ---

  ### Brief Evaluation of Candidates

  Here is how your three candidates score against the specification, noting specifically where they break.

  **1. Karma (Traditional/Cosmic)**
  *   **Performance:** High on Fittingness and Non-Arbitrariness.
  *   **The Trade-off:** It satisfies the Control Condition by expanding the timeline. It claims your current luck is the result of past actions (in this life or previous ones). Thus, nothing is truly arbitrary.
  *   **The Break:** It fails on empirical verification. Philosophically, it risks becoming unfalsifiable (any outcome can be explained as 'past karma'). It also struggles with the Distinction from Entitlement, as it conflates natural events with moral justice.
  *   **Verdict:** Solves the contradiction by denying the Ubiquity of Luck (Premise B), but at the cost of empirical plausibility.

  **2. Ordinary Retributivism**
  *   **Performance:** High on Explanatory Power and Fittingness. It aligns perfectly with our legal systems and intuitions about punishment.
  *   **The Trade-off:** It generally ignores the origins of character. It treats the agent as a 'black box': if the choice came out of the box, they are responsible.
  *   **The Break:** It violates the Control Condition (Requirement 1) and Non-Arbitrariness (Requirement 5). It cannot adequately answer the 'Unearned Virtue' objection. If a criminal's violence was caused by a brain tumour or abusive childhood, retributivism struggles to explain why they *deserve* punishment rather than treatment.
  *   **Verdict:** Solves the contradiction by prioritising Practice (Premise C) over strict Control (Premise A).

  **3. The Rawlsian View (Luck Egalitarianism)**
  *   **Performance:** High on Control and Non-Arbitrariness. Rawls argues that natural assets and social starting points are 'morally arbitrary', so no one deserves the benefits flowing from them.
  *   **The Trade-off:** It replaces desert with **entitlement** based on principles of justice (e.g., the Difference Principle). We are entitled to incentives if they help the worst off, not because we deserve them.
  *   **The Break:** It violates the Explanatory Power Requirement (Requirement 4). It essentially admits that our ordinary practices of praise and blame are largely mistaken or merely useful social tools. It collapses Desert into Entitlement (Requirement 3).
  *   **Verdict:** Solves the contradiction by rejecting the existence of Desert entirely in favour of Justice/Entitlement.

  ### Conclusion for Your Project

  Your supervisor's advice was sound. By drawing up this specification, you have located the fault line in the debate. The most interesting part of your project will not be finding the theory that 'wins', but analysing which requirement each theory sacrifices.

  If I were to offer a final piece of advice for your defence: do not be afraid to conclude that the concept of desert might be incoherent. Sometimes, the most rigorous philosophical answer is to show that the question itself rests on contradictory assumptions. If you can demonstrate that Requirements 1, 4, and 5 form an 'impossible trinity', you will have produced a sophisticated piece of philosophical analysis.

  **Glossary of Technical Terms:**
  *   **A priori:** Knowledge or justification that is independent of experience (based on reasoning alone).
  *   **Compatibilism:** The belief that free will and determinism are compatible ideas.
  *   **Consequentialism:** The view that the morality of an action is determined by its outcome (e.g., Utilitarianism).
  *   **Entitlement:** A claim to something based on rules or agreements, distinct from moral merit.
  *   **Fittingness:** The idea that a response (like punishment) matches the nature of the act.
  *   **Moral Luck:** The paradox where people are judged morally for things that are partly out of their control.
  *   **Retributivism:** The theory that punishment is justified because the offender deserves it, not to prevent future crime.
  *   **Skepticism (about desert):** The view that moral desert does not exist or is incoherent.
