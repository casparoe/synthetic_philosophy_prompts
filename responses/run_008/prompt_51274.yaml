      *   *Security Analogy for Putnam:* Think of a *Macaroon* or a *Capability Token*. The token grants access to resources *within a specific context*. You can't use a token issued by the Simulation Authority to make a claim about the External Authority. The *scope* of the token prevents the statement from being true.
      *   *The "Trick" vs. "Deep":* It's deep because it attacks the *assumption* that meaning is internal. In crypto, we assume meaning is internal (the protocol state). Putnam says meaning is external (the causal chain).
      *   *Residue:* The "First Person" is the big one. Crypto has no "I". It has "Party A".
      *   *Honest Read:* Philosophers are often imprecise, but Putnam is leveraging a specific definition of semantics that crypto explicitly abstracts away. It's a feature, not a bug, of crypto that it ignores this.

