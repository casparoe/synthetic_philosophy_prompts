  Here is the decomposition of my analytical credence in the proposition that the compatibilist "cluster capacity" framework successfully preserves ordinary practices of blame and punishment against neuroscientific determinism.

  **My Total Credence:** **0.32**

  ### Decomposition

  **1. Legitimacy of the Cluster Concept**
  *   **Probability:** 0.85
  *   **Justification:** Defining concepts by their functional role in human life is standard philosophical practice and avoids category errors, provided it doesn't ignore the intuitive core of the term.

  **2. Manipulation vs. Ordinary Causation**
  *   **Probability:** 0.50
  *   **Justification:** Pereboom's manipulation argument is potent; distinguishing historical causation from covert engineering relies on intuitions that often collapse under structural scrutiny.

  **3. Survival of Moral Desert**
  *   **Probability:** 0.35
  *   **Justification:** Backward-looking retributive desert is extremely difficult to justify without alternative possibilities, even if forward-looking practices remain intact.

  **4. Distribution of Capacities**
  *   **Probability:** 0.65
  *   **Justification:** While variance is high, neuroscience suggests "reasons-responsiveness" is a spectrum where the "typical adult" category remains statistically meaningful, though porous.

  ### The Combination
  If treated as a strict logical conjunction (all four must hold for the "full package" to succeed as traditionally understood), the mathematical product is roughly **0.12**. However, philosophical coherence allows for some interdependence (e.g., if the Cluster Concept is legitimate, the requirement for Desert may soften). Adjusting for this covariance, my holistic credence settles at **0.32**.

  ### Sensitivity Analysis
  My final number is most sensitive to **Term 3 (Survival of Moral Desert)**. If you remove the requirement for *basic desert* and reduce blame to a forward-looking practice of moral address and safety, my credence in the package jumps to roughly 0.60. If strict desert is required, the number collapses toward the neuroscientist's 0.15.

  ### Divergence Analysis: You (0.65) vs. Source (0.15)
  You are correct that **Term 3 (Desert)** is the primary fault line, but there is a secondary divergence on **Term 2 (Manipulation)**.
  *   **Your 0.65** suggests you are willing to reconceive "blame" as a social practice that doesn't require metaphysical desert (raising Term 3), and you likely view the manipulation cases as edge cases that don't generalize to normal development (raising Term 2).
  *   **The Source's 0.15** suggests he views "blame" as inherently requiring retributive desert (crushing Term 3) and sees the manipulation argument as proving that *all* determination is akin to engineering (crushing Term 2).
