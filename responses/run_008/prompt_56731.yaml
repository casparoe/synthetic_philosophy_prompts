  **Term 3 (Survival of Moral Desert)** is so under-determined by empirical evidence that assigning it a probability is closer to **setting a mood than making an estimate.** There is no experiment that can resolve whether desert *ought* to survive determinism; it is a purely normative stipulation. My 0.35 reflects the current weight of philosophical argument, not a measurable likelihood, and this term acts as the "dark matter" of the debate—invisible to science but determining the gravitational pull of the entire conclusion.
