  ### Settled Facts vs. Contested Interpretations

  Before decomposing the probability, we must distinguish the empirical baseline from the philosophical superstructure.

  **Settled:**
  1.  **Historical Episodes:** It is an empirical fact that mathematical formalisms (e.g., complex numbers in QM, Riemannian geometry in GR) have successfully predicted physical phenomena prior to observation.
  2.  **Domain Asymmetry:** It is an empirical fact that this effectiveness is concentrated in fundamental physics and degrades in complexity-heavy domains like biology, economics, and climate science.
  3.  **Selection Mechanisms:** It is an empirical fact that physicists discard mathematical models that fail to fit data and preferentially pursue problems amenable to mathematical treatment.

  **Contested:**
  1.  **Wigner's Intent:** Scholars disagree on whether Wigner intended a metaphysical argument (Platonism) or an expression of aesthetic bewilderment compatible with instrumentalism.
  2.  **Explanatory Sufficiency:** There is no consensus on whether evolutionary/selection explanations fully dissolve the "miracle" or merely relocate it to the definition of "physics."
  3.  **Ontological Commitment:** Even if selection is insufficient, it is contested whether the residue implies a mind-independent mathematical structure (Realism) or a constraint on human cognition (Kantianism).

  ### Probability Decomposition

  Let $H$ be the hypothesis: "The effectiveness of mathematics in fundamental physics is not fully explained by selection effects... some further fact about the world's structure is required."

  I decompose $P(H)$ into three conditional probabilities:

  **Term 1: Truth-Aptness ($P_{apt}$)**
  *   **Probability:** 0.85
  *   **Justification:** While Wigner's tone is rhetorical, the philosophy of science community predominantly treats the essay as making a falsifiable claim about explanation rather than mere poetry.

  **Term 2: Selection Insufficiency ($P_{res} \mid P_{apt}$)**
  *   **Probability:** 0.55
  *   **Justification:** Selection explains the *application* of math, but the *anticipatory power* of abstract math (e.g., antimatter) suggests a residue that selection alone struggles to account for without circularity.

  **Term 3: Ontological vs. Cognitive Residue ($P_{ont} \mid P_{apt} \land P_{res}$)**
  *   **Probability:** 0.65
  *   **Justification:** Given a residue exists, it is more likely to be a structural feature of the world than a feature of human cognition, as the mathematics often transcends human intuitive categories (e.g., high-dimensional Hilbert spaces).

  ### Combination Calculation

  $$ P(H) = P_{apt} \times P_{res} \times P_{ont} $$
  $$ P(H) = 0.85 \times 0.55 \times 0.65 $$
  $$ P(H) \approx 0.303875 $$

  Rounded to two decimal places: **0.30**

  ### Sensitivity Analysis

  **Most Sensitive Term:** Term 2 (Selection Insufficiency).
  This term carries the heaviest argumentative load. If one convinces a skeptic that "survivorship bias" fully accounts for the predictive successes (lowering $P_{res}$ to 0.3), the final credence drops to ~0.17. Conversely, if the "No Miracles" argument is accepted as decisive (raising $P_{res}$ to 0.8), the final credence rises to ~0.44. Term 1 is relatively stable among philosophers, and Term 3 is secondary to establishing that a residue exists in the first place.

  **Evidence to Shift View:**
  The number would move most significantly upon resolving the **Domain Asymmetry**. If it were demonstrated that biological systems possess deep mathematical laws that we simply lack the computational power to solve (supporting Wigner), $P_{res}$ would rise. If it were shown that fundamental physics is uniquely defined by our ability to mathematize it, while other domains are not (supporting Selection), $P_{res}$ would fall. Currently, the asymmetry is compatible with both views, keeping $P_{res}$ near 0.55.

  ### Diagnosis of Disagreement

  The disagreement between your credence (0.35) and your friend's (0.75) likely lives in **Term 2 (Selection Insufficiency)** and **Term 3 (Ontological Commitment)**.

  *   **Your Friend (0.75):** Likely assigns $P_{res} \approx 0.85$ and $P_{ont} \approx 0.90$. They view the predictive success of mathematics as a "miracle" that naturalistic selection cannot touch, and they equate any unexplained regularity directly with mind-independent structure.
  *   **You (0.35):** Likely assign $P_{res} \approx 0.50$ and $P_{ont} \approx 0.70$. You suspect selection effects explain more than is admitted, and you remain open to the possibility that any remaining residue might be epistemic (about how we know) rather than ontic (about what exists).

  The gap is not primarily about whether math works (settled), but about whether "working" implies "truth" or merely "survival of the fittest model."

  \answer{0.30}
