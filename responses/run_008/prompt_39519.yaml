  i want you to take Einstein's 1913–1915 detour and run it through the modern hole argument, the way Earman and Norton revived it in the 80s. quick facts so we're on the same page: in late 1913 Einstein convinced himself that generally covariant field equations were impossible, via the hole argument — spread a smooth transformation that's the identity outside some matter-free region (the hole), and the theory seems to force two different metric fields onto the same events; he took this as a contradiction, dropped general covariance for about two years, then in late 1915 went back to covariance with his point-coincidence reply, roughly: only coincidences — where fields, particles, and bodies meet — are physically real. now the mapping. the modern argument isn't about a contradiction at all: it says a manifold substantivalist has to treat the two metrics as distinct possible worlds with exactly the same state before the hole, so determinism fails, and the standard escape is Leibniz equivalence. so tell me: does the modern argument actually explain what Einstein was worried about (note he was no substantivalist), and does his point-coincidence reply amount to adopting Leibniz equivalence, to sophisticated substantivalism, or to something else — and is that an answer to the argument or a change of subject? then a twist: if the argument works, it seems to threaten any theory with gauge freedom, not just GR — so maybe it was never really about the metaphysics of spacetime, only about how theories with surplus structure must individuate their points. take a definite position on each of these, including whether Einstein's two-year retreat was rational given what he believed — don't give me a menu of options and let me chose.
