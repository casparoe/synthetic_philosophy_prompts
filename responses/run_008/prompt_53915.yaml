answer: |-
  # The Preference Stability Protocol (PSP)

  ## I. Purpose and Scope
  This procedure is not for routine consent. It is triggered only when the clinical team identifies a **Suspicion of Non-Integration**: a situation where a patient's stated choice appears disconnected from their long-term values or the information provided, suggesting the influence of framing, transient emotion, or cognitive bias rather than settled autonomy.

  **Goal:** To distinguish between a *Settled Preference* (authoritative) and a *Reactive Artifact* (requiring reconsideration), without substituting the team's values for the patient's.

  ## II. The Procedure

  ### Phase 1: Baseline Establishment
  **Objective:** Confirm the current stated choice and the specific reasoning attached to it.
  **Action:** Ask the patient to state their decision and the primary reason for it in their own words.
  **Question:** "To ensure I have this exactly right: what is your decision regarding [Treatment X], and what is the main factor driving that choice?"
  **Sufficiency Criterion:** The patient must be able to articulate a reason that links the treatment to a goal (e.g., "I refuse dialysis because I do not want to spend my last months in a hospital").
  *   *If the patient cannot articulate a reason:* Stop. This indicates confusion or delirium, not bias. Proceed to capacity evaluation.
  *   *If the patient articulates a reason:* Proceed to Phase 2.

  ### Phase 2: The Invariance Probe
  **Objective:** Test whether the choice depends on the *frame* of the information rather than the *content*.
  **Action:** Re-present the clinical facts using a logically equivalent but valence-shifted description. If the original framing was negative (mortality, loss), frame this iteration positively (survival, function), or vice versa. Do not add new facts.
  **Question:** "I want to make sure I didn't accidentally emphasize the wrong part of the picture earlier. Sometimes we talk about the risks of treatment, but we should also talk about the chances of recovery. If we look at it as having a [X]% chance of returning to [Function Y], does that change how you see the decision, or is your decision the same regardless of how we do the math?"
  **Sufficiency Criterion:**
  *   **Stable:** The patient affirms the choice remains the same despite the reframing. ("It doesn't matter how you say it; I don't want the tube.")
  *   **Unstable:** The patient hesitates, changes the decision, or admits the previous framing weighed too heavily. ("Well, if you put it that way...")

  ### Phase 3: The Counterpart Probe
  **Objective:** Test whether the choice is driven by immediate affective distress (fear, shock) rather than evaluative judgment. Distance often reduces affective noise.
  **Action:** Ask the patient to advise on a clinically identical case involving a stranger.
  **Question:** "I have another patient in a very similar situation to yours. Same age, same condition, same options. They are asking me what I think they should do. I tell them I can't decide for them, but I ask: if you were in their chair, looking at their situation objectively, what would you advise them to choose?"
  **Sufficiency Criterion:**
  *   **Convergent:** The advice for the stranger matches the choice for self.
  *   **Divergent:** The advice for the stranger differs from the choice for self (e.g., "I wouldn't want to live like this, but I'd tell them to try the treatment").

  ### Phase 4: Synthesis and Recommendation
  Map the results of Phases 2 and 3 to one of three endpoints.

  | Invariance Probe | Counterpart Probe | **Endpoint Recommendation** | **Rationale** |
  | :--- | :--- | :--- | :--- |
  | **Stable** | **Convergent** | **Authoritative Choice** | The preference survives changes in framing and emotional distance. It is treated as a settled value. |
  | **Unstable** | **Any** | **Informed Reconsideration** | The choice is sensitive to framing. It is likely an artifact. Pause treatment decisions. Re-educate neutrally. Re-ask in 24 hours. |
  | **Stable** | **Divergent** | **Value Clarification (Hand-off)** | The patient knows what is "medically rational" for a stranger but rejects it for themselves. This is not a cognitive error; it is a value conflict. **Stop procedure.** Hand to ethics/human judgment. |

  ---

  ## III. Case Applications

  ### Case 1: The Framed Refusal (81-year-old refusing dialysis)
  **Context:** Patient refuses dialysis. Resident emphasized "high mortality" and "burden."
  **Phase 1 (Baseline):** "I don't want to die in a machine. The doctor said I probably won't survive."
  **Phase 2 (Invariance):** Consultant reframes: "Some patients see this as a way to buy time for a specific goal, with a [X]% chance of leaving the hospital."
  **Result:** Patient pauses. "Wait, you said I might get to go home? He didn't say that."
  **Phase 3 (Counterpart):** Not needed (Phase 2 already failed).
  **Endpoint:** **Informed Reconsideration.**
  **Analysis:** The choice flipped when the valence shifted from loss to potential gain. The procedure correctly identifies this as a framing artifact. The team is licensed to re-present the prognosis neutrally and ask again.

  ### Case 2: The Paralyzed Patient (Refusing ventilator weaning)
  **Context:** Patient paralyzed 4 weeks ago. Refuses weaning trial. Team suspects lack of psychological adaptation (believing life is worthless now, despite evidence of adaptation potential).
  **Phase 1 (Baseline):** "I would rather die than live like this. It's not a life."
  **Phase 2 (Invariance):** Consultant reframes: "We can view this as a trial. If it fails, we stop. If it succeeds, you gain communication."
  **Result:** Patient remains firm. "No trial. I am done." (Stable).
  **Phase 3 (Counterpart):** "What would you tell a stranger in your exact position?"
  **Result:** "I'd tell them to try. Everyone says you get used to it. But I know *me*. I can't do it." (Divergent).
  **Endpoint:** **Value Clarification (Hand-off).**
  **Analysis:** Here is the uncomfortable answer. The procedure *should* theoretically flag this as Divergent/Stable, sending it to human judgment. However, suppose the patient, under pressure, answers the Counterpart Probe differently: "I'd tell them to stop too." (Convergent/Stable).
  **The Uncomfortable Outcome:** If the patient says "I'd tell the stranger to stop too," the procedure yields **Authoritative Choice**.
  **Why I will not like this:** This outcome treats the refusal as a settled value. But as a moral psychologist, I know adaptation takes months. A decision made at 4 weeks is statistically likely to be regretted. By validating this as "Authoritative," the procedure protects autonomy but potentially facilitates a decision based on a temporary inability to imagine a future self. It creates a "safe harbor" for a decision that is psychologically predictable but existentially premature. The procedure cannot distinguish between a *value* ("I prize independence above life") and a *prediction error* ("I will never be happy"). It treats the latter as the former if the patient is consistent.

  ### Case 3: The Futile Demand
  **Context:** Patient demands ECMO. Team agrees physiology makes survival impossible.
  **Phase 1 (Baseline):** "I want everything done. I want to live."
  **Phase 2 (Invariance):** Consultant reframes: "Doing this intervention carries a 0% chance of leaving the hospital alive, though it extends heart function for days."
  **Result:** "I understand. I still want it." (Stable).
  **Phase 3 (Counterpart):** "What for a stranger?"
  **Result:** "I'd want them to have the chance." (Convergent).
  **Endpoint:** **Authoritative Choice.**
  **Analysis:** The procedure validates the preference.
  **The Limit:** This reveals the boundary of the tool. The procedure assesses the *validity of the preference*, not the *feasibility of the request*. A stable, convergent preference for physiologically impossible treatment remains impossible. The procedure ends with "Authoritative," but the medical reality overrides it. This case shows the procedure cannot solve conflicts where the demand exceeds the realm of medical possibility.

  ---

  ## IV. Limitations and Failure Modes

  You asked where this scaffold breaks. It breaks in three specific places.

  **1. The Fatigue Effect (Invariance Misfire)**
  You correctly anticipated this. The Invariance Probe assumes that if a choice changes, it was biased. But patients under stress suffer cognitive fatigue. A patient who has thought deeply about their mortality may answer differently to a second framing simply because the first answer exhausted their emotional bandwidth, or because the second framing introduced a nuance they hadn't considered. The procedure risks labeling *deliberation* as *instability*. If a patient says, "Hmm, I hadn't thought of it that way, let me change my mind," the protocol flags this as bias. But that is actually the definition of informed consent working correctly.

  **2. The Stranger Alienation (Counterpart Misfire)**
  For some patients, particularly those from communitarian cultures or those who feel their illness is unique punishment/test, the "stranger" question is nonsensical or offensive. "There is no stranger. There is only me." A divergent answer here might not indicate affective bias; it might indicate a specific duty to self that does not apply to others. The procedure will flag this as a Value Clarification hand-off, which is safe, but it may erode trust in the consultation.

  **3. The Stability Trap**
  The procedure privileges stability. But people are allowed to change their minds, even rapidly, without being "biased." A patient might refuse treatment in the morning and accept it in the evening because they spoke to a chaplain, not because they were framed. The procedure lacks a mechanism to distinguish *internal* value shifts from *external* framing effects.

  ---

  ## V. Confidence Assessment

  **Claim 1: Stability + Convergence correlates with Settled Preference.**
  **Confidence: High.** When a preference survives reframing and applies universally (self and other), it is robustly integrated into the patient's cognitive architecture. It is the best proxy for autonomy we have in a crisis.

  **Claim 2: Instability under Invariance correlates with Bias.**
  **Confidence: Moderate.** This is the standard finding in behavioral psychology (framing effects). However, in a clinical setting, "instability" often correlates with *ambivalence*, which is not necessarily a bias. Ambivalence deserves exploration, not correction.

  **Claim 3: Divergence (Self vs. Stranger) indicates Affective Distortion.**
  **Confidence: Low to Moderate.** This is the point I am least sure of.
  **Reasoning:** The "Self/Other" discrepancy is often used to measure emotional interference. However, it is philosophically contentious whether we *should* treat ourselves the same as strangers. I may legitimately value my own life differently than a stranger's due to my specific responsibilities (e.g., caring for a child). If I refuse a risky surgery for myself but advise a stranger to take it because I have dependents and they do not, that is a rational value distinction, not a bias. The Counterpart Probe assumes the "relevant respects" are identical, but the *consequences* of the decision are never identical between self and stranger.
  **Honest Admission:** I am least confident in the validity of the **Counterpart Probe** as a pure test of bias. It risks conflating *special obligation to self* with *cognitive distortion*. If a patient says, "I wouldn't wish this on anyone, but I won't do it myself," the procedure flags it. But that might be the most honest expression of their values possible.

  **Final Note on the Invariance Probe:**
  You asked me to single out the validity of the Invariance Probe if I was unsure. I am concerned that in high-stakes medical contexts, "strictly equivalent descriptions" are impossible. "90% survival" is not psychologically equivalent to "10% mortality" for a terrified patient, even if mathematically identical. Using the probe might not be testing for bias; it might be testing for *hope*. If the patient grabs onto the positive frame, is that bias, or is that the human will to live? The procedure treats it as bias. That is its greatest ethical risk.
