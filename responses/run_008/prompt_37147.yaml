      *   *Sartrean (Bad Faith):* It's not about belief states but about *avowal* and *flight*. Willy knows deep down but flees the responsibility of that knowledge.
      *   *Deflationary (Motivated Reasoning):* Willy isn't lying to himself; he's just processing evidence poorly because he wants a specific outcome. He's a biased lawyer.
      *   *Davidsonian (Partitioning):* Mental compartments. One part knows the suicide plan, another part plans the future.

  3.  **Analyze *Death of a Salesman* in this context:**
