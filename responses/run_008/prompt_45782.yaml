  7.  **Final Polish:** Ensure the distinction between "Regression to the Mean" (statistical artifact) and "Goodhart" (systemic collapse) is clear in the translation. (Actually, Goodhart *includes* RTM as one mechanism).

      *   *Wait, one nuance:* The user asks about "Selection and collider bias... healthy-user effect." I should ensure Regime 1 or 4 touches on this if applicable. Regime 1 is mostly measurement error/RTM. Regime 4 (Adversarial) can induce collider bias if the agent selects into the metric. I will note this.

      *   *Reflexivity:* The user mentions "true quantity is partly constituted by the measurement." This is Ian Hacking's "Looping Effects." I should mention that this is outside standard clinical epi but present in social epi.

