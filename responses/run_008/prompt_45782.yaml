      *   **User Persona:** Retired epidemiologist (35 years in drug development/pharmacoepidemiology). Highly technical, precise, skeptical of jargon, familiar with causal inference, bias, measurement error, and clinical trial design.
      *   **Task:** Translate AI-safety concepts (Goodhart's Law, specification gaming) into epidemiological vocabulary. Test the user's suspicion that these are distinct phenomena lumped together.
      *   **Specific Vocabulary to Use:** Latent variables, noisy/confounded measurements, regression to the mean, selection/collider bias, healthy-user effect, overfitting/validation leakage, surrogate endpoints (HDL example), observational vs. interventional distinction ($P(Y|X)$ vs. $P(Y|do(X))$).
      *   **Specific Regimes to Translate:** (1) Regressional, (2) Extremal, (3) Causal, (4) Adversarial.
      *   **Residue Report Questions:**
          1.  Which regimes reduce to familiar machinery? Is (4) structurally novel (agent modeling optimizer)?
          2.  What doesn't survive translation? (Normative undefined target, Reflexivity/constitution of quantity).
          3.  Precision check: Selection vs. Intervention distinction in Goodhart literature.
