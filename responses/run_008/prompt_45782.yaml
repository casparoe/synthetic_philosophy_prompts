      *   *Correction:* No, the user pointed out "agent who models the optimizer." That's a feedback loop. In epi, we call this "time-varying confounding affected by prior exposure" (Marginal Structural Models territory), but it's usually biological. Here it's strategic. I need to highlight that the *mechanism* of the confounding is strategic adaptation, which makes it non-stationary.
