answer: |-
  During a sudden flash flood in a narrow canyon, a rescue helicopter pilot identifies two isolated rock formations where survivors are stranded as the water rises dangerously high. On the first formation, six tourists are trapped together, shivering and exhausted, facing certain exposure that will result in permanent but minor mobility impairment from severe frostbite. On the second formation, a single guide is pinned under debris, facing immediate drowning as the water level crests his air pocket within minutes. The helicopter has fuel for only one hoist operation before the weather forces a retreat, meaning the pilot must choose between lifting the group of six to safety or lowering a line to extract the single guide before he succumbs to the water.

  Straightforward aggregation evaluates the choice by summing the total harm prevented in each outcome. Assuming that death constitutes a significantly greater loss than minor permanent impairment, the total harm of losing one life outweighs the combined harm of six impaired limbs; therefore, this view dictates saving the single guide to minimize the aggregate loss. The Taurek-style view rejects the notion that individual claims can be summed, arguing that each person has an equal claim to be rescued that cannot be overridden by the presence of others. Since the guide's claim to life is not individually stronger than any single tourist's claim to mobility, the numbers provide no moral reason to prefer the group, suggesting a random selection like a coin flip to show equal respect. The intermediate view holds that numbers matter morally without requiring interpersonal summation, often arguing that saving the greater number respects more individual claims simultaneously. Because there are six claimants on one rock and only one on the other, this position demands saving the six tourists simply because they are more numerous, regardless of the disparity in harm magnitude.

  The feature doing the work in this scenario is the asymmetry in harm magnitude between the two groups. If this feature is softened so that both groups face identical harms, such as death, the verdicts of straightforward aggregation and the intermediate view converge on saving the six, while the Taurek-style view remains unchanged. A committed aggregator might resist the case by challenging the commensurability of the harms, arguing that death and minor impairment belong to different categories of loss that cannot be simply added together. By denying that a coherent sum can be calculated across such different magnitudes, the aggregator undermines the premise that aggregate harm favors the one, potentially collapsing the distinction between the views or defaulting to a numbers-based heuristic when summation fails.
