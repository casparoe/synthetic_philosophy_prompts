answer: |-
  This is a crucial pivot point for your dissertation. Too often, critiques of coherence arguments attack the technical machinery without first clarifying what the machinery is supposed to *build*. If the blueprint is incoherent, the building's structural flaws are secondary.

  Below is a refined set of desiderata for a coherence argument that aims to establish Expected Utility Theory (EUT) as a *norm of rationality*. I have extended your list to cover dynamic and metaphysical gaps, categorized the requirements by their function, and flagged the tensions you suspected.

  ### I. The Desiderata

  #### 1. The Normative Bridge Requirement
  **Definition:** The argument must explain why the mathematical property of coherence (e.g., satisfying axioms, avoiding Dutch Books) entails a *normative* defect (irrationality), rather than merely a descriptive inconsistency. It must solve the "is-ought" gap inherent in representation theorems.
  **Motivating Case:** **Zynda's Indeterminacy (2000).** A representation theorem shows that *if* an agent's preferences satisfy axioms $A$, *then* there exist $P$ and $U$ such that the agent maximizes $EU$. It does not show the agent *ought* to satisfy $A$. An agent could satisfy $A$ by accident, or satisfy alternative axioms $A^*$ that yield a different representation. Without a bridge premise (e.g., "incoherence makes you vulnerable to exploitation"), the theorem is merely a mapping, not a justification.
  **Status:** **Non-negotiable.** Without this, you have formal epistemology, not normative decision theory.

  #### 2. The Non-Triviality (Derivational Purity) Requirement
  **Definition:** The premises of the argument must be strictly weaker and more intuitively plausible than the conclusion (EUT). The argument cannot smuggle the linearity of expectation or the Independence Axiom into the definition of "preference," "option," or "exploitability."
  **Motivating Case:** **The Allais Paradox (1953).** Many diachronic Dutch Book arguments derive Independence by assuming that agents value compound lotteries by reducing them to simple lotteries *in a linear fashion*. If the reduction rule presupposes the very weighting of probabilities that Independence mandates, the argument begs the question against risk-weighted views (like Buchak's REUT). The premise ("you should reduce compound lotteries") is often less plausible than the conclusion ("you should maximize EU").
  **Status:** **Non-negotiable.** If the premises are as controversial as EUT, the argument offers no dialectical leverage.

  #### 3. The Harmfulness (External Standard) Requirement
  **Definition:** The argument must demonstrate that incoherent agents suffer a loss of value *independent* of the preferences that generated the incoherence. It is insufficient to show an agent violates their own preferences; one must show those preferences were defective.
  **Motivating Case:** **The Benign Money Pump (Arntzenius 2008 / Gustafsson 2010).** Consider an agent with cyclic preferences $A \succ B \succ C \succ A$. A money pump extracts cash from them. However, after the cycle, the agent holds $A$ again (their original holding) minus cash. If the agent values $A$ lexicographically or contextually, they may not regard the loss of cash as a "harm" relative to their current state. If the only standard of harm is the agent's own willingness to pay, the pump only shows inconsistency, not irrationality. To show irrationality, you need an external standard of value (e.g., "money is always good") which EUT is supposed to explain, not presuppose.
  **Status:** **Non-negotiable.** Otherwise, "rationality" collapses into "self-consistency," which allows for self-destructive but consistent preferences.

  #### 4. The Exploitation Modality Requirement
  **Definition:** The argument must specify the metaphysical and economic conditions under which exploitation occurs. It must clarify whether the "Bookie" is an actual agent, a hypothetical construct, or a market force, and whether the market allows for frictionless, costless trading of the relevant options.
  **Motivating Case:** **The No-Trade Theorems (Milgrom & Stokey 1982).** In realistic markets with common knowledge of rationality, Dutch Books often cannot be *made* because the counterparty knows the trade reveals private information. If a Dutch Book argument relies on the existence of a "malicious Bookie" who can offer bets that real markets would not clear, the normative force is weakened. Why ought I be rational if the world is not populated by predators capable of exploiting my irrationality?
  **Status:** **Waivable (with caveats).** One can argue for *hypothetical* vulnerability (you *would* lose if a Bookie existed). However, if the scenario is physically impossible (e.g., requires infinite speed of trading), the "ought implies can" principle is threatened.

  #### 5. The Dynamic Stability Requirement
  **Definition:** For diachronic arguments, the argument must distinguish between *irrational preference change* and *rational updating*. It must not classify an agent as incoherent simply because they update their beliefs or values over time in response to new evidence.
  **Motivating Case:** **The Reflection Principle Violations (van Fraassen 1984).** An agent might currently prefer $A$ but anticipate preferring $B$ tomorrow. A naive diachronic Dutch Book can pump this agent. However, if the change is due to rational learning (e.g., acquiring new evidence), the agent is not irrational. Coherence arguments often fail to distinguish between *akrasia* (weakness of will) and *learning*, treating both as exploitable inconsistencies.
  **Status:** **Non-negotiable.** A theory of rationality that forbids changing one's mind is untenable.

  #### 6. The Completeness and Continuity Idealization Requirement
  **Definition:** The argument must justify why rational agents must have complete (comparable for all pairs) and continuous preferences, or admit these as idealizations that do not map to strict normative requirements.
  **Motivating Case:** **The Buridan's Ass / Lexical Preferences.** An agent may genuinely find two options incomparable (e.g., a career in art vs. a career in law) rather than indifferent. Forcing completeness creates a false preference. Similarly, lexical preferences (e.g., "safety trumps cost") violate continuity. If the argument treats these as irrational, it conflicts with robust intuitions about rational deliberation.
  **Status:** **Waivable.** One can argue these are *ideal* norms for perfect agents, even if humans cannot meet them. However, for a dissertation on *rationality* (not *perfect rationality*), treating these as strict norms is a vulnerability.

  #### 7. The State-Neutrality Requirement
  **Definition:** The argument must handle state-dependent utilities without collapsing. It must distinguish between the value of an outcome and the probability of the state in which that outcome occurs.
  **Motivating Case:** **The "Dead vs. Alive" Problem.** Standard Savagean frameworks struggle when the utility of money depends on whether you are alive to spend it. If the coherence argument forces a representation where probabilities are separated from utilities, it may misrepresent agents who have intrinsic preferences over states (e.g., "I want to be the kind of person who does X," regardless of the outcome).
  **Status:** **Waivable.** This is a known technical limitation of standard EUT. A coherence argument might succeed for a restricted domain of "state-independent" goods.

  ---

  ### II. Joint Unsatisfiability and Tensions

  There is a significant tension, potentially a contradiction, between **Desideratum 2 (Non-Triviality)** and **Desideratum 6 (Completeness/Idealization)** when combined with the goal of deriving **EUT**.

  **The Tension:** To derive EUT from purely consistency-based premises (Non-Triviality), you typically need strong structural axioms like Completeness and Independence. However, these axioms are the least plausible as *norms* (violating Idealization).
  *   If you weaken Completeness to allow for incomparability (satisfying Idealization), you generally cannot derive a unique probability function or a maximizing rule (violating Non-Triviality/EUT derivation).
  *   If you keep Completeness to get the math to work, you must argue that incomparability is irrational, which is a substantive claim, not a coherence claim (violating Non-Triviality).

  **The Harder Conflict:** **Desideratum 2 (Non-Triviality)** vs. **The User's Hunch (Risk Attitudes).**
  You suspected that no argument satisfies Primitive Premises *and* covers ordinary risk attitudes. This is effectively a conflict between **Non-Triviality** and **Extensional Adequacy** (the requirement that the theory matches our best judgments about cases like Allais).
  *   To satisfy Non-Triviality, the premises must be weaker than EUT.
  *   To cover ordinary risk attitudes (which often violate Independence), the conclusion must be weaker than EUT (e.g., REUT).
  *   *Therefore:* A coherence argument that successfully derives *standard* EUT will almost necessarily violate Non-Triviality (by smuggling in Independence) OR fail Extensional Adequacy (by calling Allais-preferences irrational).
  *   **Verdict:** You cannot jointly satisfy **Non-Triviality**, **Derivation of Standard EUT**, and **Extensional Adequacy regarding Risk**. One must go. Since your goal is to evaluate arguments *for* EUT, the casualty is usually Non-Triviality.

  ---

  ### III. The "Killer" Desideratum

  The single requirement that does the most work in excluding the arguments actually on offer is:

  **Desideratum 2: The Non-Triviality (Derivational Purity) Requirement.**

  **Why:**
  Almost every existing coherence argument fails here.
  1.  **Representation Theorems:** They assume the axioms (including Independence/Sure-Thing Principle). As your list notes, this often just restates the conclusion in axiomatic dress. The axioms are *less* plausible than the conclusion (EUT) for many agents (see Allais).
  2.  **Dutch Book Arguments:** To get the probabilities to behave classically, they assume the agent values compound bets by their expected value. This *is* the linearity assumption of EUT. If you don't assume that, you can Dutch Book a risk-averse agent even if they are coherent by their own lights (e.g., Buchak 2013).
  3.  **Money Pumps:** To show the loss is *normative* (not just a preference violation), they assume "more money is better" independent of the trade structure. This is a substantive value claim, not a coherence claim.

  Your hunch is real. It is not an artifact of your requirements. The "hump" exists because **EUT is a substantive theory of the good (risk neutrality), not merely a formal theory of consistency.** Coherence arguments try to derive a substantive theory from formal consistency. To do so, they must hide the substantive premises inside the definitions of "bet," "preference," or "trade." Non-Triviality exposes this hiding place.

  ---

  ### IV. Brief Scoring of the Families

  Here is how the main families fare against the critical desiderata (specifically focusing on Non-Triviality and Normative Bridge):

  | Argument Family | Normative Bridge (D1) | Non-Triviality (D2) | Harmfulness (D3) | Dynamic Stability (D5) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Synchronic Dutch Book** | **Fail.** Shows inconsistency, not irrationality. | **Fail.** Assumes additivity of prices (linearity). | **Fail.** Loss is only relative to agent's own pricing. | N/A | Purely descriptive unless supplemented. |
  | **Diachronic Dutch Book** | **Weak.** Relies on "Updating Rule" norms. | **Fail.** Often assumes Conditionalization to prove Conditionalization. | **Weak.** Depends on Bookie's existence. | **Fail.** Struggles to distinguish learning from inconsistency. | Better, but question-begging on updating. |
  | **Money Pump** | **Stronger.** Exploitation is tangible. | **Fail.** Assumes transitivity/completeness as norms without justification. | **Mixed.** "Benign pump" cases show harm is internal to preferences. | **Fail.** Often assumes preferences are stable over the pump duration. | Best for "pragmatic" force, worst for "epistemic" force. |
  | **Representation Theorems** | **Fail.** The "Reinterpretation Problem." | **Fail.** Axioms are as controversial as EUT. | **N/A.** No exploitation claimed. | **N/A.** Mostly synchronic. | Mathematically rigorous, normatively silent. |

  **Recommendation for the Chapter:**
  Focus your critical energy on **Desideratum 2 (Non-Triviality)**. This is where the literature is most vulnerable. If you can demonstrate that every successful derivation of EUT requires a premise that is *at least as controversial* as EUT itself (specifically regarding risk), you undermine the claim that coherence arguments provide a *foundation* for rationality. They merely provide a *reformulation*.
