  2.  **Brainstorming & Planning:**
      *   **The Core Math:** The Pasadena Game (Nover & Hájek, 2004) is a variant of the St. Petersburg Paradox.
          *   Payoff structure: Toss a fair coin until heads. If heads on toss $n$, payoff is $(-1)^{n-1} \frac{2^n}{n}$.
          *   Expected Value: $\sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n-1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n}$.
          *   This is the alternating harmonic series. It converges to $\ln(2)$ *if* summed in standard order.
          *   However, it is *conditionally* convergent, not absolutely convergent. By the Riemann Series Theorem, rearranging terms can make it sum to any real number, or diverge.
          *   Standard Decision Theory (EDT/CDT) usually requires absolute convergence for expected utility to be well-defined independent of ordering.
          *   So, the EV is undefined in the strict sense because the order of summation matters, and there's no natural ordering in a probabilistic mixture unless specified.
      *   **The Joke:** A casino selling this as a stable investment. The "prospectus" will claim stability while the fine print admits the value depends on how you count the money.
