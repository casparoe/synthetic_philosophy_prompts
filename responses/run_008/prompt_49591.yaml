  **OFFERING MEMORANDUM: PASADENA PREFERRED INSTRUMENT (SERIES A)**

  **Issuer:** Pasadena Palace of Chance, Ltd.  
  **Asset Class:** Conditionally Convergent Derivative  
  **Base Valuation:** 0.693 Utility Units (± Arbitration Adjustment)

  **1. INVESTMENT THESIS**  
  The Pasadena Palace of Chance is pleased to offer institutional access to the flagship Pasadena Game, a volatility instrument designed for sophisticated agents seeking exposure to non-absolutely convergent payoff streams. Unlike legacy stochastic assets (e.g., St. Petersburg Notes), the Pasadena Instrument offers a finite nominal valuation based on the canonical summation of alternating harmonic terms. Investors are invited to purchase entry tickets at a price point reflecting the natural logarithm of 2, representing the stable equilibrium of the series when processed in standard ascending order of trial index.

  **2. VALUATION METHODOLOGY**  
  The House asserts a Fair Entry Price derived from the expected utility calculation $\sum p_n u_n$. Investors should note that this valuation holds strictly under the assumption of canonical ordering (n=1 to ∞). While the series converges conditionally, it does not converge absolutely. Consequently, the reported Net Asset Value (NAV) is invariant only so long as the sequence of outcomes remains unpermuted. The House reserves the right to recalibrate NAV based on liquidity requirements, which may necessitate alternative summation orderings pursuant to the Riemann Rearrangement Protocol outlined in Section 9.

  **3. RISK DISCLOSURE**  
  Prospective investors acknowledge that the expected value of this instrument is undefined in the absence of a specified summation order. No benchmark risk-free rate can be quoted against this asset, as standard decision-theoretic axioms regarding dominance and sure things may fail to apply. Past performance is not indicative of future results, primarily because the concept of "future results" lacks a stable ensemble average. Investors seeking guaranteed returns are advised to consider our Bounded Utility Certificates, wherein payoff magnitudes are capped at $10^{100}$ utilons to ensure absolute convergence.

  **4. HOUSE POLICY ON AGGREGATION**  
  To mitigate existential risk during extended play, the House employs a Time-Average Growth Rate model for all accounts held longer than one Planck time. This policy supersedes ensemble expectation calculations. In the event of discrepancy between ensemble expectations and time-average growth, the latter shall govern payout schedules. Additionally, for retail-tier investors, the House offers a "Simplified View" option, wherein payouts are determined via median outcome maximization rather than mean utility. Selecting this option waives all rights to claim undefined positive infinity scenarios.

  **5. ARBITRATION AND REORDERING**  
  Disputes regarding the solvency of the House relative to the payoff series shall be settled by binding arbitration. The Arbitrator shall have sole discretion to determine the ordering of terms in the payoff series for the purpose of calculating outstanding liabilities. Investors acknowledge that by entering the casino floor, they consent to whatever summation order renders the House solvent. This clause is non-negotiable and constitutes the primary risk mitigation strategy for the Issuer.

  **6. UTILITY SMOOTHING**  
  Pursuant to Clause 14(b), the House quietly implements a bounded utility function across all gaming terminals. While marketing materials reference unbounded payoff structures, actual disbursements are processed through a sigmoidal utility converter to prevent numerical overflow in the House ledger. Investors seeking unbounded exposure must sign a separate waiver acknowledging the possibility of ledger collapse and subsequent payment in non-fungible experiential credits.

  **7. REGULATORY COMPLIANCE**  
  This instrument has not been registered with any Decision-Theoretic Oversight Commission. It is offered solely to agents capable of constructing their own probability measures. The House makes no representation regarding the coherence of investor preference orderings over these lotteries. By purchasing a ticket, the investor warrants that their preference relation is complete and transitive, or else agrees to have it completed by the House manager on duty.

  **8. FINAL DISCLAIMER**  
  The Pasadena Palace of Chance assumes no liability for paradoxes arising from the interaction of infinite series with finite bankrolls. Any resemblance to known philosophical impossibilities is intentional and protected under fair use statutes. Investment involves the risk of undefined loss.

