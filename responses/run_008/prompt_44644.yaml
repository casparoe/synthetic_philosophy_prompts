  6.  **Final Polish:** (Mental check of the "Ought Implies Can" section). If I say 90% credence, I need to explain that the promise becomes void *if* it's impossible. But is it impossible? He says "no way we can afford 24-hour care." That sounds like impossibility. Okay, I'll stick with high credence there.

