      *   **Component 3: Moral Residue (Guilt without Wrongdoing).**
          *   *Concept:* You can do the "right" thing but still violate a significant value, warranting regret/guilt/apology. (Bernard Williams' "Moral Luck" / "Agent Regret").
          *   *Application:* Even if memory care is the *right* choice, the promise was broken. The guilt isn't noise; it's acknowledgment of the loss.
          *   *My View:* Very High. This explains the user's intuition best.
