          *   *This is One:* ~5%. (Safety usually overrides autonomy/promises in care ethics).
      *   **Decomposition:**
          1.  *Ought Implies Can:* 90%. You can't be obligated to do the impossible. The promise was made under different conditions.
          2.  *Moral Consistency:* 80%. Systems usually allow a "least worst" option that is permissible.
          3.  *Moral Residue:* 95%. This is the crucial one. You can do the right thing and still owe an apology.
          4.  *Epistemic Uncertainty:* 70%. We feel stuck because we don't know which value to prioritize, but safety is a strong trump card.
      *   **Synthesis:** How they combine. The "Residue" factor is the key. The friend is right about the *choice*, wrong about the *feelings*.
      *   **Sensitivity:** The definition of the promise. Was it absolute or conditional?
      *   **The "Straight Talk" (Guilt):** This is the most important part. Distinguish between *culpability* (blame) and *responsibility* (burden). The guilt is real, but it's not evidence of sin. It's evidence of love.

