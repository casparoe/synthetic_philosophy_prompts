      *   **The Friend's Argument:** Philosophy undergrad. Claims "hard choices still have a best answer," "ought implies can," guilt is just grief.
      *   **The User's Intuition:** Feels like he will owe an apology either way, that he will have *failed* her factually, not just unfortunately.
      *   **The Task:**
          1.  Give credence (probability/likelihood) that *genuine moral dilemmas* exist (situations where you do wrong no matter what).
