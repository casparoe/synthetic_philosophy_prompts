answer: |-
  There is no single, settled term in the literature that captures this exact triad of positions within the specific context of *learned* artifacts. You are standing at the intersection of three distinct philosophical conversations that haven't fully merged yet: the **mechanistic philosophy of neuroscience** (Craver, Bechtel), the **metaphysics of computation** (Piccinini, Rescorla), and the **emerging philosophy of AI** (Stinson, Wüthrich, Greaves-Thomas).

  If you need a label to use in a paper or meeting tomorrow, the most precise existing framing is **"The Individuation Problem for Learned Mechanisms."** However, because the "artifact" element is doing unique work in your description (distinguishing it from biology), I will refine this below.

  Here is the carving you asked for, mapping the camps, diagnosing the switching, and offering a term for the specific configuration of the dispute.

  ### 1. The Mapping: What is actually being disputed?

  The dispute is not about whether the model exists (ontology of the object), but about the **ontology of its decomposition**. Specifically, it is a dispute over **Causal Modularity vs. Subspace Equivalence.**

  *   **Camp 1 (Causal Realists):** They are implicitly adopting an **Interventionist Account of Mechanism** (Woodward/Craver). For them, a feature is "real" if it satisfies *mutual manipulability*: you can change the feature to change the output, and change the task to change the feature. They treat the network as a **self-organized physical system** where the training dynamics are analogous to evolutionary or physical pressures that "carve joints" in the loss landscape.
  *   **Camp 2 (Predictive Instrumentalists):** They are adopting a stance of **Ontological Relativity** (Quine) or **Dennettian Real Patternhood**. They argue that because activation spaces are high-dimensional vector spaces, any orthogonal basis can describe the same subspace. If two decompositions predict equally well, there is no "fact of the matter" about which one is the *true* circuit. They view features as **coordinates**, not components.
  *   **Camp 3 (Artifact Skeptics):** They are relying on a **Design Stance** (Dennett) confused with **Constructivism**. Their claim is that because the *architecture* was designed, the *interior* lacks the independence required for realism.

  **The Carving:**
  What is being disputed is whether the **optimization trajectory** confers **mind-independent status** on the resulting weights.
  *   Camp 1 says: The data and loss function constrain the solution enough that the structure is *discovered*, not *made*.
  *   Camp 2 says: The solution space is degenerate; the structure is *imposed* by our choice of analysis.
  *   Camp 3 says: The whole system is *stipulated* by human intent, so "discovery" is a category error.

  ### 2. The "Artifact" Objection (Why Camp 3 is partially wrong)

  Camp 3's claim ("we built it, so there's nothing to be right or wrong about") fails because it conflates **Architectural Design** with **Parameter Instantiation**.

  *   **Analogy:** We designed the rules of Chess and carved the pieces (Architecture). We did not design the specific Grandmaster game played in 1972 (Parameters).
  *   **The Philosophical Move:** You can argue that the network is a **"Self-Organized Artifact."** The *container* is designed; the *contents* are the result of a dynamical system (gradient descent) interacting with a domain (data) that we did not create (e.g., natural language, physical laws).
  *   **Why this matters:** If the data distribution has structure (e.g., syntax exists in the world), and the loss function forces the model to capture it, the internal structure tracking syntax is constrained by the *world*, not just by the *engineer*. This grants it a degree of independence that Camp 3 denies.

  ### 3. The "Switching" Phenomenon

  You noted researchers switch camps between the introduction and the results. This is a recognized move in philosophy of science called **Methodological Entity Realism** (inspired by Ian Hacking).

  *   **The Move:** "I don't commit to the ontology of the feature in general (Intro), but I can spray it with electrons (Intervention) to prove it exists for the sake of this experiment (Results)."
  *   **Why they do it:** It insulates them from metaphysical criticism while allowing them to use the rhetorical power of discovery.
  *   **The Risk:** It creates a "free ride" where they get the prestige of discovery without the burden of ontological commitment. If the intervention fails later, they can retreat to Camp 2 ("it was just a predictive scheme").

  ### 4. A Proposed Term: "The Optimization-Interiority Tension"

  Since no canonical term exists, I propose you use **"The Optimization-Interiority Tension"** to describe this specific configuration.

  *   **Definition:** The disagreement over whether the internal structure of a machine learning model constitutes a discovered mechanism (due to optimization constraints) or an imposed description (due to representational freedom), given that the system is an artifact.
  *   **Excludes:** Standard realism about natural kinds (atoms), because the system is artificial.
  *   **Excludes:** Standard intentional stance (beliefs/desires), because the dispute is about sub-personal circuits.
  *   **Boundary Case:** **Superposition.**
      *   *Scenario:* A model represents 100 features in 50 dimensions. No single direction corresponds to a single feature; they are linearly entangled.
      *   *Camp 1:* "The features aren't real here; the *subspace* is the mechanism." (Or they try to find a sparse basis).
      *   *Camp 2:* "The entanglement is the reality; your demand for one-direction-per-feature is human bias."
      *   *Camp 3:* "It's just matrix multiplication; stop anthropomorphizing linear algebra."
      *   *Why this is the boundary:* This is where the "Causal" criterion breaks. If you ablate a direction in superposition, you damage multiple features. Camp 1's "reality" criterion (clean intervention) becomes mathematically impossible, forcing them to either deny reality or redefine causality.

  ### 5. Where My Answer Might Fail (The Critique)

  You asked for the vulnerability in this analysis. Here is where this philosophical framing is most likely to crumble under technical scrutiny:

  **1. The "Causal" Criterion is Technically Ill-Defined in High Dimensions.**
  My mapping of Camp 1 to Woodwardian Interventionism assumes interventions are clean. In neural networks, **interventions break the manifold.** When you ablate a "deception direction," you push the activation vector out of the distribution of vectors the network ever saw during training. The resulting behavior might not reflect the "removal of a feature" but the "response to garbage input."
  *   *The Failure:* If Camp 1's primary criterion (causal intervention) is technically confounded by out-of-distribution artifacts, then their "Realism" is built on sand. Camp 2 might be right not because of philosophy, but because the math of high-dimensional geometry makes "isolated causality" impossible.
  *   *What would change my mind:* If mechanistic interpretability develops a rigorous theory of **in-distribution interventions** (e.g., using causal scrubbing or counterfactual activations that respect the manifold), Camp 1's ontological claim becomes much stronger. Until then, Camp 2's instrumentalism is technically safer.

  **2. The "Data Independence" Assumption.**
  I argued Camp 3 is wrong because the *data* is independent of us. But in modern ML, the data is often *synthetic* or *scraped from human artifacts* (internet text). If the data is itself an artifact of human mind, and the model is an artifact of human design, the "independent joint" Camp 1 is looking for might be **human conventions all the way down.**
  *   *The Failure:* If the "syntax" the model learns is just a reflection of human labeling conventions in the training set, then Camp 3 is right: there is no "nature" being carved, only a mirror of our own prior structure.
  *   *What would change my mind:* Evidence of models learning **alien concepts**—structures useful for prediction that humans do not recognize and cannot name (e.g., "grokking" phenomena or internal world models that diverge from human ontology). This would prove the optimization process creates structure *sui generis*.

  **3. The "Switching" might be Pragmatic, not Philosophical.**
  I characterized the intro/results switch as "Methodological Entity Realism." It might simply be **Reviewers' Pressure.**
  *   *The Failure:* Researchers might actually be Camp 1 realists but write Camp 2 disclaimers to avoid rejection from reviewers who hate "AI hype."
  *   *What would change my mind:* Anonymous surveys of interpretability researchers asking for their private ontological commitments vs. their public writing. If the private views match the public disclaimers, my "Methodological Realism" diagnosis is wrong, and the field is genuinely confused.

  ### Summary Recommendation

  When you raise this in your lab:
  1.  **Name it:** Call it **"The Individuation Problem for Learned Mechanisms."**
  2.  **Challenge Camp 1:** Ask if their causal interventions respect the data manifold, or if they are measuring OOD artifacts.
  3.  **Challenge Camp 3:** Ask if they treat the *training data* as natural or artificial. If natural, they must concede the interior has some independent constraints.
  4.  **Challenge the Switchers:** Ask if they believe the feature exists *before* they ablate it, or only *during* the ablation.

  This framing shows you understand the philosophy (Interventionism, Real Patterns), the ML (Manifolds, Superposition), and the sociology (Reviewer pressure/Entity Realism).
