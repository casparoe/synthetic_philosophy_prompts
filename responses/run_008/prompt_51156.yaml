prompt: |-
  just had a two hour argument with a friend about how two people should split the gains from a deal (we started on apartment splitting and it metastasized), and I've been scribbling down my gut verdicts on cases ever since. here they are, and I want to know if any single principle captures them:

  1. two identical people splitting $100: 50/50, obviously.
  2. if one of us has a better outside option (I can walk away and get $30, she gets nothing by walking), the deal should shift toward me.
  3. if a new option appears where I could get $80 but only by leaving her with $0 — an option neither of us would ever choose — our deal shouldn't move an inch.
  4. but if the whole set of possible deals expands so that everything she could have gotten before is still available plus some new options that are better for me, then it seems flat-out unfair if I end up worse off than before the expansion. I shouldn't be punished by my own opportunities growing.
  5. if the pie shrinks symmetrically, we both lose equally.
  6. the one I keep flip-flopping on: my dream outcome is worth 100 to me and hers is only worth 40 to her, from the same starting point. something in me says we should each give up the same *fraction* of our dream, not the same absolute amount — though I can also hear my friend yelling that dreams are cheap and don't entitle you to a bigger share.

  my friend swears verdicts 3 and 4 cannot both hold and that I have to pick. she's on the side of the Nash bargaining solution (whatever that is exactly, she kept invoking it), and I half remember something called Kalai-Smorodinsky from an econ elective that was apparently on my side of the argument. so: is there one principle that gets all six, or close to it? if I have to drop a verdict, which one and why? and tell me what the resulting principle predicts for a case I haven't considered — dividing up chores instead of money, where there's no side payments and each of us hates different tasks. one more thing: wherever people who actually know this literature disagree, mark it as contested instead of handing it to me as the settled answer — my friend will pounce the second I present a camp's favorite axiom like it's common sense.
