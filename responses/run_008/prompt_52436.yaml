      *   *Implementation:* Round 1: Deck has values 10-29 (shifted up). Round 2: Deck has values 1-20 (standard). If Satisficers set threshold at 25 in Round 1 (easy to hit), then in Round 2 they might set it too high based on Round 1 experience, or we force a specific threshold.
      *   *Simpler Implementation:* Keep deck 1-20.
          *   Round 1 (Generous): Search Cost = 0.5 points. (Search is cheap, satisficing is efficient).
          *   Round 2 (Stingy): Search Cost = 2 points. (Search is expensive, but if Satisficers keep a high threshold from Round 1, they burn points searching for a unicorn that isn't there).
