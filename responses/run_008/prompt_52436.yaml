answer: |-
  Here is a complete design for your 90-minute seminar session. It is structured to be run with minimal props but high conceptual yield.

  ### Game Title: The Search for the Golden Card

  #### 1. Core Mechanics & Setup
  *   **Recall Rule:** **No Recall.** Once a card is drawn and rejected, it is placed in a "discard" pile face up. It cannot be chosen later. This creates the essential tension of search: the option you saw five turns ago is gone forever.
  *   **Deck Composition:** 20 Index Cards per deck.
  *   **Search Cost:** **2 Points** per card drawn (including the final card kept).
  *   **Payoff Formula:** $\text{Net Score} = \text{Value of Kept Card} - (\text{Total Cards Drawn} \times 2)$.
  *   **Forced Stop:** If a student exhausts the deck (draws all 20 cards), they *must* keep the 20th card. They still pay the cost for all 20 draws.
  *   **Groups:** Split the 15 students into two groups:
      *   **Group A (Maximizers, 7-8 students):** Instruction: *"Your goal is to obtain the highest possible Net Score. You should search until you are confident you have found the best option available."*
      *   **Group B (Satisficers, 7-8 students):** Instruction: *"Before drawing any cards, write down a private 'Aspiration Threshold' (a number between 1 and 20). Draw cards one by one. Stop immediately at the first card that meets or exceeds your threshold. That is your final choice."*

  #### 2. The Rounds (45 Minutes Total)

  **Round 1: The Generous Environment (20 Minutes)**
  *   **Deck:** Values 1 through 20 (shuffled).
  *   **Satisficer Instruction:** "Set your threshold where you feel a card would be a 'clear win'." (Most will pick 15–18).
  *   **Expected Outcome:**
      *   *Satisficers:* Will likely stop between draw 3 and 8. They secure a high value (15+) with low search costs. Net scores: ~10 to 14.
      *   *Maximizers:* Will search longer, fearing they might miss the 20. They incur higher costs. Some find the 20 but pay 10+ points in search costs. Net scores: ~8 to 12.
      *   *Lesson:* In a high-variance, generous environment, satisficing is more efficient.

  **Round 2: The Stingy Environment (25 Minutes)**
  *   **Deck:** Values 1 through 10, duplicated twice (shuffled). *There is no card higher than 10.*
  *   **Satisficer Instruction:** "Set your threshold based on what felt like a 'good win' in Round 1." (This anchors them to the previous environment).
  *   **Expected Outcome:**
      *   *Satisficers:* Most will set thresholds at 15+ (carried over from Round 1). Since no card meets this, they will draw the **entire deck**. They are forced to keep the 20th card (value ~5).
          *   Calculation: $5 - (20 \times 2) = -35$ points. **Catastrophic failure.**
      *   *Maximizers:* They will search deeply. Eventually, they will realize no high cards are appearing. While they suffer high search costs, they will likely stop before the very end once they infer the deck is "bad," or simply accept a 9 or 10.
          *   Calculation: $10 - (15 \times 2) = -20$ points. **Bad, but better than Satisficers.**
      *   *Lesson:* A heuristic is only rational if it matches the structure of the environment. Rigid satisficing fails when the environment shifts.

  #### 3. The Debrief (45 Minutes)

  **Part A: Herbert Simon's Scissors (15 Minutes)**
  Draw a pair of scissors on the board. Label the blades:
  1.  **Blade 1: The Organism (Cognitive Limits).** Ask the Maximizers: *"Why didn't you calculate the probability of a higher card appearing on every turn?"* Answer: Too hard, too slow. Ask the Satisficers: *"Why did you stick to your number in Round 2?"* Answer: It was a simple rule to follow under pressure. This represents our limited computational power and memory (No Recall).
  2.  **Blade 2: The Environment (Structure).** Point to the decks. Round 1 had a high mean; Round 2 had a low mean.
  3.  **The Cut:** Rationality is not a property of the mind alone; it is the *fit* between the two blades. In Round 1, the Satisficer's blade fit the environment. In Round 2, the blades misaligned, and the "rational" heuristic produced irrational results.

  **Part B: The Awkward Question (15 Minutes)**
  Pose this challenge to the class:
  *"In Round 1, the Satisficers won. But isn't that only because the threshold I implicitly encouraged (aiming for 15+) happened to match the deck? If a super-computer calculated the optimal stopping threshold to maximize expected value given the cost of drawing, wouldn't it tell you to stop at 15? So, isn't Satisficing just Maximizing outsourced to the person who set the threshold?"*

  *   **Discussion Points:**
      *   If the threshold is set via calculation, it *is* a form of maximizing (optimizing the heuristic).
      *   Simon's point is that in the real world, we rarely have the information to calculate the optimal threshold.
      *   **Who sets aspirations outside the classroom?**
          *   *Evolution:* We are hungry when our glucose drops (a biological threshold).
          *   *Culture:* A "good salary" is defined by peers, not absolute utility.
          *   *Experience:* We adjust based on what we've seen before (which leads to the Round 2 failure).

  **Part C: The Missing Feature (15 Minutes)**
  Be honest about the game's limitation.
  *"In this game, I forced you to fix your threshold before drawing. In real life, aspiration levels **adapt**. If you searched for a job for 6 months and got no offers above $50k, you would lower your threshold to $45k. This is 'adaptive aspiration' (Cyert & March)."*

  *   **Why this matters:** Real rationality isn't just static satisficing; it's the *meta-rationality* of adjusting your standards when the environment proves you wrong. The game failed to capture this to isolate the variable, but in reality, a rational agent updates their "scissors."

  #### 4. Troubleshooting: What Will Go Wrong

  1.  **The "Peek" Problem:** Students will try to look at the discard pile to count how many high cards are left.
      *   *Fix:* Appoint one student as the "Banker" who holds the deck and records scores. The player looks only at the card presented to them.
  2.  **Satisficer Cheating:** In Round 2, a Satisficer will hit a 10, realize their threshold of 15 is impossible, and quietly lower it mid-game.
      *   *Fix:* Collect the written thresholds *before* Round 2 starts. Do not let them change the paper. This is crucial for the "backfire" lesson.
  3.  **Maximizer Paralysis:** A Maximizer might refuse to stop, claiming they can never be *sure* it's the best.
      *   *Fix:* Impose a hard time limit per turn (10 seconds). If they don't choose, the card is discarded automatically.
  4.  **Math Confusion:** Students will forget to subtract the cost of the *final* card.
      *   *Fix:* Write the formula largely on the board. Have the "Banker" calculate the score, not the student.
  5.  **Time Creep:** The debrief on the "Outsourced Maximizing" objection can eat 30 minutes alone.
      *   *Fix:* Watch the clock. If you run short, cut the "Adaptive Aspiration" discussion and assign it as a reflection question for next time.

  #### 5. Materials Checklist
  *   3 Decks of 20 Index Cards (numbered 1-20 for Round 1; 1-10 twice for Round 2).
  *   Score sheets for the "Banker."
  *   Whiteboard for the Scissors diagram.
  *   Small slips of paper for Satisficers to write thresholds.

  ### Instructor's Note on the "Outsourced" Objection
  When you pose the question *"Is satisficing just maximizing outsourced?"*, expect your sharpest students to say **Yes**.
  *   **Your Counter:** "If it is maximizing, it requires knowledge of the distribution (the deck) and the cost function. In the real world (career, marriage, housing), we do not know the distribution. We don't know if the 'deck' is 1-20 or 1-10. Therefore, we cannot calculate the optimal threshold. We must use a heuristic that *hopes* to fit. That uncertainty is where Simon's bounded rationality lives, distinct from the optimization of neoclassical economics."
