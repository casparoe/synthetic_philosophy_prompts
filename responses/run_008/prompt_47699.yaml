          *   If we get to $99 vs $1.00, the $99 bidder bids $1.01 to lose 1 cent instead of 99.
          *   Knowing this, the $1.00 bidder would have bid $1.00 earlier.
          *   Working back to the start: The second player knows if they enter, they lose. So they don't enter.
