      *   **Address the Uncle/Lawsuit Example:** This is the "Concorde Fallacy" or "Escalation of Commitment." It looks like sunk cost rationality, but it's actually **Reputation** or **Option Value**. You keep funding to signal strength to competitors, or because there's a small chance of a huge payout (lottery ticket), not because the past money matters.
