answer: |-
  You are right to be suspicious. Your roommate's argument is a classic seduction in game theory, often called the "Dollar Auction Paradox," but her conclusion is wrong. You can keep Premise (1)—that rational choice depends only on future consequences—without accepting that sunk costs are rational.

  The flaw in her reconstruction is not in the arithmetic of Step (3), but in the **strategic assumption** hidden inside it. Specifically, Step (3) treats the opponent's reaction as a hope rather than a constraint.

  Here is exactly where the argument breaks, why your friends escalated, and why your uncle's lawsuit doesn't prove sunk costs are rational.

  ### The Flaw is in Step (3) and (4)

  Your roommate's Step (3) says: *"If I bid one more cent, then either the other bidder stops... or they bid again."*

  She then compares the outcome of "They stop" (you lose 1 cent) against "I stop now" (you lose $n$ cents). Since losing 1 cent is better than losing $n$ cents, she concludes bidding is rational.

  **The error:** This ignores the probability that the other bidder *will not stop*.

  To make a rational decision at Step (3), you cannot just compare the best-case scenario of bidding (they quit) against the scenario of quitting (you lose $n$). You must calculate the **Expected Value (EV)** of bidding based on the likelihood that your opponent is also following this logic.

  If your opponent is rational, they are running the same calculation. If you believe your opponent is rational, you must believe they will *also* bid when it is their turn, because *their* Step (3) tells them to. If you know they will bid again, then your bid of $n+1$ does not secure the dollar; it merely moves you to a new node where you are the second-highest bidder again, now losing $n+1$.

  If both players are perfectly rational and this is **Common Knowledge** (I know you're rational, you know I'm rational, I know you know I'm rational...), the game never escalates past the first bid. This is solved by **Backward Induction**:
  1.  If we reach \$1.00 vs \$1.01, the \$1.00 bidder bids \$1.02 to lose 2 cents instead of 100.
  2.  Knowing this, the \$1.00 bidder would have bid \$1.01 earlier.
  3.  Working all the way back to the start: The second player knows that entering the auction guarantees a loss because the first player will trap them.
  4.  Therefore, the second player never bids.
  5.  Therefore, the first player bids 1 cent and wins.

  In a world of perfect rationality, the auction ends at 1 cent. The fact that your friends bid past \$4 proves they were **not** playing under Common Knowledge of Rationality. They were playing against humans they suspected might be irrational, emotional, or cash-constrained.

  ### Why This Isn't Sunk Cost Reasoning

  This is the crucial distinction for your Premise (1).

  **Sunk Cost Reasoning** says: "I should bid \$1.51 because I have already spent \$1.50, and I don't want that money to be wasted." This treats the past expenditure as a *reason* for future action. This is irrational. The \$1.50 is gone regardless.

  **Marginal Analysis (Rational Choice)** says: "I should bid \$1.51 because there is a 20% chance my opponent folds, which gives me an expected loss of 30 cents, which is better than the certain loss of \$1.50 if I quit."

  Notice the difference? In the rational version, the \$1.50 is only relevant as the *baseline for the certain loss of quitting*. It is not the *motivation* for bidding. The motivation is the **probability of the opponent folding**.

  Your friends escalated because they assigned a non-zero probability to the other guy saying "uncle." They weren't reasoning "I spent \$4 so I must continue." They were reasoning "I spent \$4, and if I put in \$4.01, there's a chance he gets tired and quits, saving me from the \$4 loss."

  That is a gamble on the opponent's psychology, not a validation of sunk costs. If your friends knew for a fact the opponent would *never* quit (e.g., playing against a computer program hard-coded to never stop), a rational player using Premise (1) would quit immediately at 15 cents. The sunk cost would not compel them to bid.

  ### The Uncle's Lawsuit (Real World vs. Closed System)

  You mentioned your uncle's firm funding a doomed lawsuit. This looks like the Dollar Auction, but real-world conflicts have variables the auction does not.

  In the Dollar Auction, the prize is fixed (\$1) and the rules are closed. In a lawsuit or a war of attrition, two other factors come into play:
  1.  **Reputation/Signaling:** Quitting the lawsuit might signal weakness to other potential litigants or competitors, inviting more attacks. The "bid" buys future security, not just the current prize.
  2.  **Information Asymmetry:** Your uncle might believe he has private information that the lawsuit is winnable, whereas the court (the opponent) doesn't know it yet. He isn't paying to recover sunk costs; he's paying to reveal information.

  If your uncle truly funded the lawsuit *only* because "we've already spent \$200k," with no hope of winning and no reputational benefit to continuing, then yes, that is the Sunk Cost Fallacy. It is irrational. The Dollar Auction doesn't prove him right; it just illustrates how easy it is to fall into the trap when you mistake a gamble on the opponent's fatigue for a rational recovery of losses.

  ### The Verdict on Premise (1)

  You should keep Premise (1). It is the bedrock of decision theory.

  *   **Reject Step (5):** Iterating a locally optimal move does not guarantee a globally optimal strategy if the "local" view ignores the opponent's strategic response.
  *   **Reject Step (7):** The auction does not prove sunk costs are rational. It proves that **incomplete information about the opponent's rationality** creates a trap where rational players gamble on the other person's error.

  **The Advice You Wanted:**
  You asked what advice you can give your friends that doesn't collapse into "bid forever." Here it is:

  > "The money you bid is gone. Do not bid again to 'save' it. Only bid again if you have a specific, calculated reason to believe your opponent will quit on the next turn. If you believe your opponent is rational, they will not quit, so you should quit now. If you believe they are irrational, you are gambling, not investing."

  Your roommate's claim that the auction proves sunk cost reasoning is rational is a category error. The auction proves that **rationality is dangerous when you assume your opponent is less rational than you.** Your friends didn't fall for the sunk cost fallacy because they thought the past mattered; they fell for it because they thought they could out-wait the other guy. That's a different sin entirely.
