      *   The rationality depends entirely on $P(\text{opponent quits})$.
      *   If $P(\text{opponent quits}) = 0$ (because they are rational and know I am rational), then I should quit.
      *   If $P(\text{opponent quits}) > 0$ (because they might be irrational), then bidding *can* be rational.
      *   *Crucial distinction:* This isn't sunk cost reasoning. This is **probabilistic marginal analysis**. Sunk cost reasoning says "I must bid because I spent 90c." Marginal analysis says "I should bid because there's a 10% chance he folds, which gives me an expected value better than -90c."
      *   The roommate conflates "calculating marginal loss" with "validating sunk costs."
