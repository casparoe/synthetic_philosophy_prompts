answer: |-
  This is a remarkably coherent "Rationalist Consequentialist" package. It's the standard cluster for this community: separate the map (ex ante rationality) from the territory (ex post outcomes), separate the agent (blameworthiness) from the practice (blaming), and justify the practice instrumentally.

  However, you asked for an audit of *internal* tensions, not external objections. The system holds together mostly by keeping definitions siloed. When you force the silos to interact, the load-bearing walls are in your theory of responsibility.

  Here are the tensions ranked by severity.

  ### 1. The Instrumentalist Contradiction (Severity: Critical)
  **Conflict:** (4) vs. (2) + (5)

  *   **The Tension:** Point (4) claims the practice of holding people responsible is justified *entirely* by its effects (incentive design). Point (5) provides a specific instrumental argument for why punishing based on outcomes (violating the control principle) is *more* efficient (high penalty/low enforcement cost). Point (2) claims blameworthiness is fixed by control and *cannot* be changed by outcomes.
  *   **The Break:** If (4) is true ("entirely by effects"), then (2) is only valid insofar as it produces good effects. But (5) argues that ignoring (2) produces *better* effects (cheaper deterrence). Therefore, (4) + (5) logically entails that we *should* distribute blame/punishment based on outcomes. This directly contradicts (2).
  *   **Why it's critical:** You cannot maintain that blame is *purely* instrumental while simultaneously insisting on a non-instrumental constraint (control) that your own instrumental analysis suggests we should violate for efficiency.
  *   **Cheapest Fix:** Soften (4). Change "justified entirely by its effects" to "justified primarily by its effects, *constrained by fairness norms regarding control*."
  *   **The Cost:** You lose the clean, reductionist elegance of pure consequentialism about responsibility. You have to admit a deontological side-constraint that isn't itself justified by consequences. You can no longer say "desert is a fiction"; you have to say "desert is a fiction, but we pretend it's real because violating the pretense violates a rights-based constraint."

  ### 2. The Ontological Split (Severity: High)
  **Conflict:** (1) vs. (3)

  *   **The Tension:** (1) says the *act* is evaluated ex post (consequentialist). (3) says the *decision* is evaluated ex ante (expected utility). In your drunk driver case, the "act" (driving drunk + killing) is worse than the twin's "act," but the "decision" (driving drunk) is identical.
  *   **The Break:** This creates a fragmentation of the moral object. What is the primary unit of moral evaluation? If the *act* is what matters for goodness (1), but the *decision* is what matters for rationality (3), then a fully rational agent can consistently perform objectively "worse" acts through no fault of their own.
  *   **Why it's high:** It's not a logical contradiction, but it creates a "moral residue" problem. If the act is *objectively worse* (more disutility), why does the moral accounting stop at the decision? You are positing two different moral ledgers that don't reconcile. One says "More Badness Happened Here," the other says "No Extra Badness Attributed to Agent."
  *   **Cheapest Fix:** Clarify the ontology. Explicitly state that "Act" in (1) refers to *World-Histories*, while "Decision" in (3) refers to *Agency*.
  *   **The Cost:** You have to accept that "Morality" is doing two different jobs: evaluating states of the world (1) and evaluating agents (3). This makes "Is this a good thing to do?" ambiguous. Do you mean "Will this produce good worlds?" (Yes) or "Is this a good decision procedure?" (Yes, even if it produces bad worlds). You risk equivocation in live debates.

  ### 3. The First/Third Person Asymmetry (Severity: Medium)
  **Conflict:** (6) vs. (5)

  *   **The Tension:** (6) says *I* should not feel regret for outcomes outside my control (ex ante rationality only). (5) says *the law* (third party) should punish me based on outcomes (ex post results).
  *   **The Break:** Why is the state allowed to use "outcome bias" as a feature (5) when I am forbidden from using it as a bug (6)? If outcomes don't track agency/rationality (per 3 & 6), they shouldn't track liability. If they do track liability for deterrence reasons (5), why shouldn't I use regret as a self-deterrence mechanism?
  *   **Why it's medium:** It feels hypocritical, but it can be defended as a division of labor. However, it requires a robust justification for why the rules of rationality differ for individuals vs. institutions.
  *   **Cheapest Fix:** Reframe (6). Regret isn't just about "was my decision right?" It's also a signaling mechanism. Acknowledge that *some* outcome-based regret is instrumentally useful for self-training (updating heuristics), even if the specific decision was ex ante correct.
  *   **The Cost:** You weaken your stance on outcome bias. You have to admit that "irrational" emotions (regret over luck) might have instrumental value, which complicates your poker-player shtick.

  ### Summary of the Audit
  Your position is stable **only if** you keep (4) vague. As soon as you apply the instrumental logic of (4) to the legal argument in (5), it consumes the control principle in (2).

  **The Pivot Point:**
  You need to decide if (2) is a **terminal value** or a **heuristic**.
  *   If it's a terminal value (we *must* respect control), you must downgrade (4) from "entirely" to "mostly."
  *   If it's a heuristic (control usually correlates with best incentives), you must admit that in the specific case of (5), the heuristic is overridden, and the unlucky driver *should* be blamed more, contradicting (2).

  **Recommendation for the Meetup:**
  Pre-empt the attack on (4). Explicitly state: *"I am a consequentialist about the justification of the practice, but I recognize a side-constraint regarding control that limits optimization."* This admits the tension in Rank 1 before they can use it to dismantle the rest of the list. It costs you theoretical purity but saves you from contradiction.
