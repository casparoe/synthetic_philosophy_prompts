answer: |-
  | Objection | Severity | Reply | Soft Spot |
  | :--- | :---: | :--- | :--- |
  | **"Okay, you've told us what bad history looks like. Give me a specific historical claim *you* hold that you would abandon if you found X in the archive. If you can't name one, you're not actually committed to constraints, you're just theorizing."** *(The question I'm hoping nobody asks)* | 5 | "That's fair. I argue that the outbreak of WWI was not inevitable in July 1914. My constraint is this: if I found archival evidence that key decision-makers *never* considered a localized conflict, or that mobilization timetables were mechanically irreversible without human intervention, my claim collapses. I'm not saying 'anything could have happened.' I'm saying the archive shows specific off-ramps existed. If the archive proves those off-ramps were illusory, I'm wrong." | I might not have a second example ready if they press for more. It risks turning the Q&A into a grilling of my specific historical case rather than my methodological point. |
  | **"Without pre-registration, you're just fitting the curve. Any narrative can be retrofitted to look 'constrained.' How is this different from p-hacking with words?"** *(Forecaster)* | 5 | "In physics, we don't pre-register the discovery of a planet; we check if the math constrains the observation. My point is that good history rules things *out*. If a narrative says 'A made this choice because B was impossible,' and the archive shows B was on the table, the narrative fails. It's not about predicting the future; it's about being vulnerable to the past. Pre-registration helps, but vulnerability to evidence is the core currency." | Forecasters value scoring rules above all. I'm asking them to accept a qualitative form of falsification, which they may view as 'soft' compared to Brier scores. |
  | **"A skilled confabulator can invent counterfactuals that sound just as constrained as a real historian. Your test relies on the *plausibility* of the constraint, which is exactly what the narrative fallacy manipulates. How do you distinguish genius history from genius lying?"** *(Philosopher/Journalist - The "Turn Against")* | 4 | "You're right that plausibility isn't enough. That's why I emphasize *archival refutation*. A confabulator says 'anything could have happened' or picks convenient constraints. A rigorous historian points to the specific document, the specific meeting minute that shows the constraint was real *to the actors*. The difference isn't just the story's texture; it's whether the story survives contact with the trace evidence that wasn't selected to fit the story." | It's hard to prove a negative. A really good confabulator *can* forge the texture of archival constraint. I'm relying on peer review to catch this, which is fallible. |
  | **"You say archives refute narratives, but archives are silent on what didn't happen. You can't archive a counterfactual. How do you measure 'room to move' from a record of what actually moved?"** *(Journalist)* | 4 | "Archives aren't just records of actions; they're records of deliberation. They contain the memos about the roads *not* taken, the fears about scenarios that didn't unfold. When a leader writes 'We cannot do X because of Y,' that's archival evidence of a constraint. We aren't guessing the counterfactual; we're reading the actors' own assessment of their counterfactual space." | Arguments from silence are risky. If the archive is incomplete, I might mistake a missing option for an impossible one. |
  | **"You're treating archives like data mines. Context matters more than counterfactuals. If you reduce history to 'constraints,' you lose the texture that makes it human."** *(Historian)* | 4 | "I'm not asking for regression analysis on primary sources. I'm asking for accountability. Texture is vital, but texture without constraint is just fiction. I want to protect the historian's craft from the charge that it's just storytelling. Embracing constraints is how we show our stories are about the world, not just about our need for coherence." | Some historians will hear this as me importing social science imperialism into their discipline. I risk sounding like I'm lecturing them on how to do their job. |
  | **"Prediction is the only proof of understanding. If you can't forecast, you don't know the system. Geology explains earthquakes but can't predict them; that's why it's less mature than physics."** *(Forecaster)* | 3 | "Maturity isn't just prediction. Evolutionary biology explains the past brilliantly but predicts little. Understanding *why* something happened allows us to intervene in the future, even if we can't date the next event. Explanation has cash value: it tells us which levers actually move the machine, even if we can't say when the machine will break." | Hard-core forecasters believe calibration is the *only* truth. They may view this as a consolation prize for failure. |
  | **"Hindsight isn't a bug, it's a feature. We know the end, that's how we choose what matters. Without the outcome, the archive is just noise. You're asking us to pretend we don't know the ending."** *(Historian)* | 3 | "I'm not asking you to forget the ending. I'm asking you to acknowledge that knowing the ending makes some paths look brighter than they were. We can use the outcome to select the topic, but we shouldn't let the outcome distort the probability of the path. We need to reconstruct the fog of war, not just the map drawn after the battle." | The line between 'using the outcome to select the topic' and 'letting the outcome distort the path' is incredibly thin in practice. |
  | **"What counts as 'real room to move'? You're smuggling in modal metaphysics without defining it. Are we talking about physical possibility, or just what the actor perceived?"** *(Philosopher)* | 3 | "Pragmatically, I mean what the actor perceived as possible, constrained by physical reality. If they thought they could fly and jumped, the physical constraint matters. If they thought they were blocked by a law that didn't exist, the perceived constraint matters. The 'dynamic' part is tracking where those two things diverge in the archive." | This dual definition (physical vs. perceived) gives me wiggle room, but it might look like I'm moving the goalposts depending on which suits my narrative. |
  | **"Tetlock showed experts are worse than algorithms. Why trust historians to assess constraints any better than they assess probabilities?"** *(Forecaster)* | 2 | "Tetlock studied pundits giving opinions on current events. Historians are doing forensic work on closed cases with full document access. It's a different epistemic environment. One is guessing in the fog; the other is reconstructing the scene after the lights are on. The bias exists in both, but the tools to correct it are different." | Some historians *do* act like pundits (public intellectuals). I'm drawing a distinction that might not hold up for the whole discipline. |
  | **"Psychologists haven't read the primary sources. They're diagnosing a bias they only see in summaries, not in the work itself."** *(Historian)* | 2 | "Exactly. That's half my thesis. The bias literature overreaches because it tests people on vignettes, not archives. I'm not defending bias; I'm defending the archive as a corrective. We need the psychologists' rigor, but applied to the historian's material, not the psychologist's stimuli." | This might annoy the psychologists in the room who feel I'm dismissing their experimental control as irrelevant. |

  ### Upfront Concession Strategy

  To buy goodwill before the hard questions start, I should concede that **historians absolutely do fall prey to narrative fallacy.** I shouldn't position myself as defending the discipline against all criticism. I need to say clearly: "I am not saying historians are immune to bias. We love a clean story too. The archive is messy, and we clean it up." By admitting that the *effect* is real and present in my own field, I disarm the forecasters who think I'm in denial, and I reassure the historians that I'm not claiming moral superiority for our craft. I'm just arguing that the *presence* of bias doesn't mean the *method* is bankrupt. This makes my positive claim about "dynamic constraints" look like a tool for improvement, rather than a shield against criticism.
