answer: |-
  Here is the specification sheet you asked for. The frustration you're feeling is a feature, not a bug: you have stumbled onto the fact that "rationality" is not a monolith. It is a bundle of competing virtues. A theory of choice must prioritize some at the expense of others.

  Below are the desiderata for a theory of choice under risk, categorized by their function. I have distinguished between **Normative** requirements (how a rational agent *ought* to choose) and **Descriptive** requirements (how humans *actually* choose). Most confusion in your course stems from professors treating normative axioms as descriptive laws.

  ### I. The Specification (Desiderata)

  #### 1. Formal Consistency (Non-Negotiable)
  *   **Requirement:** **Transitivity** (If A > B and B > C, then A > C) and **Completeness** (For any A and B, either A ≥ B, B ≥ A, or indifferent).
  *   **Argument:** Without transitivity, preferences are cyclic. Without completeness, the agent cannot choose.
  *   **Status:** **Normative Non-Negotiable.** Violating transitivity makes you vulnerable to a strict money pump (you pay to swap A for B, B for C, then C for A, ending up with A and less money). While some descriptive theories (like certain regret models) relax this to fit data, a theory claiming to define *rationality* generally cannot drop this.

  #### 2. Dominance (Strongly Normative)
  *   **Requirement:** **First-Order Stochastic Dominance (FOSD).** If Gamble A yields a better outcome than Gamble B at every probability level, you must prefer A.
  *   **Argument:** Choosing a dominated option is tantamount to throwing away value.
  *   **Status:** **Normative Non-Negotiable.** It is very difficult to construct a "rational" defense for choosing a dominated option. However, some descriptive theories (like early Prospect Theory) violate this due to probability weighting functions that overweight small probabilities inconsistently. Rank-Dependent Utility (RDU) fixes this.

  #### 3. Dynamic Consistency (The Money Pump Shield)
  *   **Requirement:** If you prefer Plan A over Plan B at time *t=0*, and no new information arrives by *t=1*, you should not change your preference at *t=1*.
  *   **Argument:** This prevents "dynamic money pumps." If your future self deviates from your current self's optimal plan without new information, an external agent can exploit the gap between your planning self and your acting self.
  *   **Status:** **Normative Strong.** This is the primary weapon EU theorists use against Allais choosers. However, it relies on the assumption that agents cannot bind their future selves (resolute choice).

  #### 4. Separability / The Independence Axiom (The Flashpoint)
  *   **Requirement:** Preferences between two gambles should not depend on outcomes they share in common (the "common consequence"). If you prefer A to B, you should prefer (A + C) to (B + C) where C is an independent event.
  *   **Argument:** This ensures that the value of a gamble is the sum of its parts. It simplifies calculation and guarantees Dynamic Consistency.
  *   **Status:** **Normative Contested.** This is **not** a logical truth like transitivity. It is a substantive claim about how value aggregates. EU theorists treat it as non-negotiable for consistency. Allais proponents argue it ignores the *context* of risk (e.g., the emotional relief of a sure thing vs. a near-sure thing).
  *   **Descriptive Requirement:** A descriptive theory **must** violate this to capture the Allais Common-Consequence and Common-Ratio effects.

  #### 5. Descriptive Adequacy (The Reality Check)
  *   **Requirement:** The theory must reproduce systematic violations of EU observed in controlled experiments. Specifically:
      *   **Allais Common-Consequence Effect:** Preference for certainty over high probability, switching to risk-seeking when certainty is removed.
      *   **Allais Common-Ratio Effect:** Similar switching when probabilities are scaled down proportionally.
      *   **Ellsberg Ambiguity:** Preference for known probabilities over unknown probabilities (ambiguity aversion).
  *   **Status:** **Descriptive Non-Negotiable.** If the goal is to predict human behavior, EU fails here. If the goal is to prescribe behavior, EU claims these patterns are errors to be corrected.

  #### 6. Frame Invariance (Description Invariance)
  *   **Requirement:** Preferences should not change based on how the problem is described (e.g., "90% survival" vs. "10% mortality"), provided the underlying probabilities and outcomes are identical.
  *   **Argument:** Rationality implies responsiveness to reality, not rhetoric.
  *   **Status:** **Normative Ideal, Descriptive Falsehood.** Normatively, you should not be swayed by framing. Descriptively, humans always are (Prospect Theory is built on this violation).

  ---

  ### II. The Hard Trade-Off (Impossibility Result)

  You asked to be told plainly if these are jointly unsatisfiable. **They are.**

  You cannot construct a theory that satisfies all of the following simultaneously:
  1.  **Transitivity**
  2.  **First-Order Stochastic Dominance**
  3.  **Dynamic Consistency** (via standard backward induction)
  4.  **Descriptive Adequacy** (specifically, the Allais Common-Consequence effect)

  **The Conflict:**
  The Allais preference (Sure $1M > 89% $1M + 10% $5M) violates the **Independence Axiom**.
  *   If you keep **Independence**, you satisfy Dynamic Consistency and avoid money pumps, but you must condemn Allais preferences as **irrational** (failing Descriptive Adequacy).
  *   If you keep **Allais Preferences** (violating Independence), you generally sacrifice **Dynamic Consistency**. You become vulnerable to a money pump *unless* you adopt a non-standard decision procedure (like "resolute choice," where you bind your future self to the original plan despite local incentives to switch).

  **On Money Pumps:**
  Money pump arguments do not prove that Allais preferences are logically contradictory (like 2+2=5). They prove that an agent with those preferences is **exploitable** *if* they act naively at every decision node. A money pump forces you to choose between:
  1.  Changing your preferences (adopt EU).
  2.  Changing your decision procedure (adopt Resolute Choice).
  3.  Accepting exploitation (pay the pump).

  Most "fixes" involve option 2.

  ---

  ### III. Scorecard

  Here is how the major contenders score against the spec.

  **1. Expected Utility Theory (EU)**
  *   **Normative:** **A+**. Satisfies Transitivity, Dominance, Independence, and Dynamic Consistency. Immune to standard money pumps.
  *   **Descriptive:** **F**. Fails to predict Allais and Ellsberg patterns. Treats systematic human behavior as "error."
  *   **Verdict:** The gold standard for *prescribing* how to avoid exploitation, but a poor model of human psychology.

  **2. Rank-Dependent Utility (RDU) / Cumulative Prospect Theory**
  *   **Normative:** **B**. Satisfies Transitivity and Dominance (unlike early Prospect Theory). However, it violates Independence. It can face dynamic consistency issues unless paired with specific updating rules.
  *   **Descriptive:** **A**. Successfully models Allais effects via probability weighting (overweighting small probabilities, underweighting moderate/high ones).
  *   **Verdict:** The best compromise for a theory that wants to be mathematically clean but descriptively accurate. It sacrifices Independence to save Dominance.

  **3. Regret Theory**
  *   **Normative:** **C**. Explains Allais switching via the anticipation of regret (comparing outcomes across states). However, standard Regret Theory often violates **Transitivity** (A > B, B > C, but C > A) and **Dominance**.
  *   **Descriptive:** **A**. Captures the emotional drive behind the Allais switch very well.
  *   **Verdict:** Psychologically rich but structurally dangerous. If you value transitivity as a core component of rationality, Regret Theory is a non-starter normatively.

  ### Summary for Your Term Paper
  The "fix" isn't about finding a theory that does everything. It is about deciding which virtue you are willing to sacrifice.
  *   If you value **consistency and non-exploitability** above all, you stick with EU and call Allais choosers irrational.
  *   If you value **psychological realism** and think the "certainty effect" is a valid feature of value, you adopt RDU and accept that you need a more complex rule for dynamic choice to avoid money pumps.
  *   If you think **emotional comparison** is fundamental, you look at Regret Theory and accept intransitivity.

  The professor left it at "EU says you're inconsistent" because that is the normative baseline. The "fixes" are attempts to move the baseline so that the Allais preference is no longer an inconsistency, but a feature.
