prompt: |-
  I'm in a decision theory course and we just finished the unit on Allais. Our professor ran the classic pair of choices on us: first, a guaranteed million versus a gamble that's 89% a million, 10% five million, 1% nothing (most of the class, me included, took the sure thing), and then a choice between a 11% shot at a million versus a 10% shot at five million, where almost everyone switched to the five million. Then she showed us that expected utility theory says these two pairs of preferences are jointly inconsistent with the independence axiom, and left it there, like that settles it. Since then we've been speedrunning "fixes" — rank-dependent utility, prospect theory, regret theory, people just biting the bullet on the axiom — and honestly I've lost track of what the fix is even supposed to accomplish.

  So before I read another one of these papers, I want the spec first. Write out the desiderata for a theory of rational choice under risk: which observed choice patterns it has to either reproduce or condemn rather than just call irrational (Allais common-consequence and common-ratio preferences, maybe Ellsberg-style ambiguity if you think that belongs in the same spec), which structural conditions it needs (transitivity, stochastic dominance, some version of independence or a stated replacement for it), what the money-pump and Dutch book style arguments actually force versus what they merely suggest, and whether the theory is supposed to be normative, descriptive, or both — because I suspect the requirements differ depending on the job. Give the case or argument behind each requirement, and be explicit about which ones are genuinely non-negotiable and which are just the expected utility camp dressing up its own tastes as the laws of rationality. And crucially: if some subset of the desiderata is jointly unsatisfiable — e.g. if you demand both independence-ish structure and Allais-respecting latitude — say so plainly, because that's the part I actually need for my term paper.

  Then, briefly, score expected utility theory, a rank-dependent or prospect-style theory, and regret theory against your own list — a couple lines each is plenty, I care way more about the criteria than the scorecard. Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Decision theory student, just finished the Allais paradox unit.
      *   **Problem:** Feeling overwhelmed by the "speedrun" of fixes (RDU, Prospect Theory, Regret Theory, etc.) without understanding the underlying goals/specifications.
      *   **Task:** Write out the *desiderata* (specifications/requirements) for a theory of rational choice under risk.
      *   **Key Components:**
          *   Which observed choice patterns to reproduce vs. condemn (Allais, Ellsberg, etc.).
          *   Structural conditions (transitivity, stochastic dominance, independence/replacement).
          *   Money pump/Dutch book arguments (force vs. suggest).
          *   Normative vs. Descriptive distinction.
          *   Identification of non-negotiables vs. EU camp preferences.
          *   **Crucial:** Explicitly state if desiderata are jointly unsatisfiable (impossibility theorems).
          *   **Scoring:** Briefly score EU, RDU/Prospect, and Regret Theory against the list.
      *   **Tone:** Academic but accessible, American English, direct ("say so plainly").

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   *Normative vs. Descriptive:* This is the biggest fork in the road. A theory can't perfectly be both. I need to separate these clearly.
      *   *Structural Rationality:* Transitivity, Completeness, Continuity. These are usually considered the bedrock of *any* rational choice, not just EU.
      *   *Dominance:* Stochastic dominance is hard to argue against normatively.
      *   *Independence (The Allais Flashpoint):* This is the core conflict. EU says it's necessary for dynamic consistency/money pumps. Allais fans say it ignores context/common consequences.
      *   *Dynamic Consistency:* If I plan to do X tomorrow, should I actually do X? Money pumps rely on this.
      *   *Descriptive Accuracy:* Does it match how humans actually choose? (Allais patterns).
      *   *Tractability/Mathematical Elegance:* Often overlooked but important for a "theory."

  3.  **Address the "Jointly Unsatisfiable" Constraint:**
      *   This is the heart of the Allais problem. You cannot have *both* the Independence Axiom *and* the Allais common-consequence effect without violating something else (usually dynamic consistency or stochastic dominance in certain formulations).
      *   I need to highlight the tension between *Dynamic Consistency* + *Independence* vs. *Descriptive Accuracy (Allais)*.

  4.  **Drafting the Desiderata (Iterative Process):**
      *   *Requirement 1: Formal Consistency.* Transitivity, Completeness. Non-negotiable for *rationality* (normative).
      *   *Requirement 2: Dominance.* First-order stochastic dominance (FOSD). Hard to violate without looking stupid.
      *   *Requirement 3: Dynamic Consistency.* If you commit to a plan, you stick to it. Linked to money pumps.
      *   *Requirement 4: Descriptive Adequacy.* Captures Allais common-consequence and common-ratio effects.
      *   *Requirement 5: Separability/Independence.* Preferences in one branch shouldn't depend on outcomes in another branch *unless* those outcomes change the probability weighting.
      *   *Requirement 6: Ambiguity Sensitivity.* (Ellsberg). Distinct from risk.

      *Refining the Conflict:* The big trade-off is between *Dynamic Consistency* (often tied to Independence) and *Allais Preferences*. If you keep Allais preferences, you are vulnerable to money pumps *unless* you modify how you update plans (resolute choice) or give up separability.

  5.  **Distinguishing Normative vs. Descriptive:**
      *   *Normative:* How agents *ought* to choose. Focus on consistency, avoiding exploitation.
      *   *Descriptive:* How agents *do* choose. Focus on psychological realism, framing, weighting.
      *   *The "Spec" depends on the goal.* I must make this explicit. The user asked for *a* theory, but the requirements differ. I will structure the spec to acknowledge this duality.

  6.  **Addressing Money Pumps/Dutch Books:**
      *   Do they *force* rationality? No, they show vulnerability. But a rational agent *ought* to avoid being exploitable. However, some argue transaction costs or resolute choice block the pump. I need to be nuanced here.

  7.  **Scoring the Theories:**
      *   *EU:* Great on structure/dynamic consistency. Fails Allais/Ellsberg.
      *   *RDU/Prospect:* Great on Allais/Ellsberg. Weaker on dynamic consistency (sometimes violates FOSD depending on formulation).
      *   *Regret:* Explains switching well. Can violate transitivity (in some versions).

  8.  **Review against Constraints:**
      *   American English? Yes.
      *   Plainly state impossibility? Yes.
      *   Brief scoring? Yes.
      *   No preaching? Keep it analytical.

  9.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate RDU and Prospect Theory too much, though for this level they share the probability weighting feature. I'll group them as "Weighted Utility" for brevity but note the differences if needed. Let's stick to RDU as the cleaner normative alternative to Prospect Theory (which is descriptive).
      *   *Emphasis:* The user is frustrated with "EU says you're irrational." I need to validate that the Independence Axiom is a *value judgment* about separability, not a logical truth like transitivity.
      *   *Impossibility:* Be very clear: You cannot satisfy Independence + Allais Preferences + Dynamic Consistency simultaneously. Something has to give.

  10. **Final Structure:**
      *   Introduction: Acknowledge the frustration.
      *   The Spec (categorized by Normative/Descriptive).
      *   The Hard Constraints (Transitivity, Dominance).
      *   The Conflict Zone (Independence vs. Allais).
