  # JOINT STATEMENT ON THE EVOLUTIONARY CHALLENGE TO MORAL NORMATIVITY

  **Signatories:**  
  **A.** Proponent of Non-Naturalist Moral Realism (NNMR)  
  **B.** Proponent of Evolutionary Debunking Anti-Realism (EDAR)

  **Date:** October 26, 2023  
  **Context:** Adversarial Collaboration, Metaethics Seminar

  ---

  ## I. AGREED CLAIMS

  *Note on Markings: Claims marked **[Empirically Settled]** reflect consensus in evolutionary biology and psychology. Claims marked **[Philosophically Contested]** reflect points where the broader metaethical community remains divided, though we agree on the formulation of the problem.*

  1.  **[Empirically Settled]** Human moral faculties, sentiments, and judgment-making capacities are the product of natural selection. These capacities were selected primarily for their contribution to reproductive fitness and social cohesion, not for their capacity to track mind-independent normative truths.
  2.  **[Philosophically Contested]** The evolutionary genealogy of moral beliefs constitutes a *prima facie* epistemic challenge to Non-Naturalist Realism. We agree that the Realist bears an explanatory burden to explain why our evolved moral beliefs should be expected to align with mind-independent moral facts, given that the evolutionary process was insensitive to those facts. We disagree on whether this burden can be met.
  3.  **[Philosophically Contested]** Moral properties (if they exist) supervene on natural properties. There cannot be a moral difference between two situations without some underlying natural difference. We disagree on whether this supervenience relation requires a reductive explanation or if it is a brute necessary truth.
  4.  **[Empirically Settled]** Moral judgments possess a distinct phenomenology of objectivity and authority. Agents experience moral demands as binding independently of their immediate desires. We disagree on whether this phenomenology is veridical (Realist) or a useful evolutionary illusion (Anti-Realist).
  5.  **[Philosophically Contested]** Moral claims purport to provide categorical reasons for action. We agree that moral discourse functions *as if* there are objective norms. We disagree on whether there actually are such norms.

  ---

  ## II. REMAINING DISAGREEMENTS AND CRUXES

  The following table outlines the specific points of divergence that prevent consensus. We have identified two primary cruxes that determine the outcome of the debate.

  | Crux / Issue | Non-Naturalist Realist Position (A) | Evolutionary Debunking Anti-Realist Position (B) | Shared Test Case / Argument | Advance Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Idealized Rational Disagreement**<br>*(Could fully informed, unbiased agents still disagree?)* | **No.** If two agents share all non-moral facts, are fully informed, logically consistent, and free from bias, they will converge on the same moral judgments. Moral truth is a constraint on ideal rationality. | **Yes.** Even under idealized conditions, agents may hold different fundamental normative attitudes or "starting points." Rationality governs means-end coherence, not ultimate ends. | **The "Reflective Equilibrium" Thought Experiment:** Two agents debate a complex case of distributive justice (e.g., priority vs. equality) for an extended period with full information. | **A:** Predicts eventual convergence on a single principle.<br>**B:** Predicts persistent disagreement based on differing weightings of values. |
  | **2. Convergence as Evidence**<br>*(Does historical convergence track truth?)* | **Yes.** The historical trend toward expanding moral concern (e.g., rights, equality) is best explained by the gradual discovery of mind-independent moral facts, despite evolutionary headwinds. | **No.** Convergence is best explained by shared human psychology, changing material conditions, and social contagion. Correlation with "truth" is coincidental without a causal mechanism. | **The "Expansion of the Moral Circle" Argument:** The historical shift from tribal ethics to universal human rights over the last 500 years. | **A:** Predicts convergence will continue even when costly to fitness.<br>**B:** Predicts convergence will stall or reverse if fitness costs become too high. |
  | **3. The "Third Factor" Explanation**<br>*(Can evolution and truth correlate without tracking?)* | **Yes.** There is a "third factor" (e.g., survival is good, or rationality tracks truth) that explains both why evolution selected for certain traits and why those traits align with moral truth. | **No.** This begs the question. To claim survival is "good" presupposes the moral facts you are trying to prove. The correlation remains coincidental from a neutral standpoint. | **Sharon Street's Dilemma:** Either evolution influenced moral truths (contradicts Realism) or it didn't (making alignment miraculous). | **A:** Predicts a coherent non-causal explanation can be formulated.<br>**B:** Predicts all such explanations will covertly rely on moral premises. |

  ---

  ## III. VERBAL VS. SUBSTANTIVE DISPUTE ANALYSIS

  After extensive discussion, we conclude that our dispute is **primarily substantive**, but contains a **secondary verbal component**.

  **1. The Substantive Core (Metaphysics & Epistemology)**
  The bulk of our disagreement concerns the structure of reality and justification.
  *   **Metaphysics:** We disagree on whether normative properties exist *sui generis* (independent of human attitudes). This is not a matter of definition; it is a claim about the ontology of reasons.
  *   **Epistemology:** We disagree on the conditions required for justified belief. Signatory B requires a causal or quasi-causal link between fact and belief for justification. Signatory A accepts rational insight as a valid justificatory mechanism absent causal contact. This is a fundamental clash of epistemic frameworks.

  **2. The Verbal Component (Definitions of "Rationality")**
  A portion of our friction arises from differing usage of the term **"Rational."**
  *   **Signatory A (Realist)** employs a **"Thick"** conception of rationality, where rationality includes substantive normative constraints (e.g., it is irrational to value suffering for its own sake).
  *   **Signatory B (Anti-Realist)** employs a **"Thin"** (Humean) conception of rationality, where rationality is purely instrumental (e.g., it is only irrational to take means inconsistent with one's ends, regardless of what those ends are).

  **Resolution on Verbal Dispute:** We acknowledge that if Signatory B adopted Signatory A's definition of rationality, the "Idealized Rational Disagreement" crux would dissolve in favor of Realism. However, Signatory B rejects that definition as question-begging. Therefore, while the *label* is verbal, the disagreement over which definition is correct is itself substantive.

  ---

