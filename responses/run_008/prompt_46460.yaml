answer: |-
  Based on the track record you've described, your friend is operating with a **Strawsonian presupposition framework**, likely coupled with a **truth-value gap** semantics. She is explicitly rejecting the Russellian analysis (where "The King of France is bald" is simply false) in favor of the view that the sentence fails to make a claim capable of being true or false because a necessary condition for its evaluation (existence) is not met.

  Here is the breakdown of the rule she is running, the competing rules that fit her data, the predictions for your new sentences, and the specific areas of philosophical debate you need to navigate.

  ### 1. The Diagnosis: Her Underlying Rule
  Your friend's rulings map cleanly onto **P.F. Strawson's 1950 account** of definite descriptions, modified to handle existential denials.

  *   **Atomic Positive ("KOF is bald"):** She assigns **Neither** (Gap).
      *   *Rule:* Existence is a *presupposition*, not an assertion. If the presupposition fails, the sentence lacks a truth value.
  *   **Atomic Negative ("KOF is not bald"):** She assigns **Neither** (Gap).
      *   *Rule:* She is using **internal negation** (presupposition-preserving). In her logic, $\neg P$ inherits the presuppositions of $P$. This distinguishes her from a Russellian, who would say "It is not the case that KOF is bald" is True (because KOF doesn't exist).
  *   **Existential Denial ("KOF doesn't exist"):** She assigns **True**.
      *   *Rule:* This is treated as **external negation** (presupposition-cancelling) or a distinct existential claim. It attacks the presupposition of the positive form rather than operating within it.

  **The Core Mechanism:** She treats reference failure as a semantic "misfire" that creates a truth-value gap (let's denote this as **#**).

  ### 2. Candidate Rules for Complex Sentences (The Projection Problem)
  While her views on atomic sentences are clear, her rules for compound sentences (disjunctions and conditionals) are not yet settled by your data. This is known in the literature as the **Projection Problem**. Three main logical systems fit her atomic data but diverge on your new sentences.

  #### A. Weak Kleene (The "Contagion" View)
  *   **Rule:** If any component of a complex sentence is a gap (#), the whole sentence is a gap (#). Defects are contagious.
  *   **Motivation:** Matches the intuition that a "misfire" in part of an utterance ruins the whole utterance.
  *   **Prediction for Disjunction:** "Either KOF is bald (#) or Ottawa is capital (T)" $\rightarrow$ **Neither (#)**.
  *   **Prediction for Conditional:** "If KOF is bald (#)... then..." $\rightarrow$ **Neither (#)**.

  #### B. Strong Kleene (The "Classical Rescue" View)
  *   **Rule:** Truth-functional logic applies as far as possible. If the truth value of the whole is determined by a non-gap component, the gap is ignored.
  *   **Motivation:** Preserves classical tautologies and valid inferences where possible. ($T \lor \#$ is treated as $T$).
  *   **Prediction for Disjunction:** "Either KOF is bald (#) or Ottawa is capital (T)" $\rightarrow$ **True**.
  *   **Prediction for Conditional:** "If KOF is bald (#) then he is older than Macron (#)" $\rightarrow$ **Neither (#)** (Because in Strong Kleene, $\# \rightarrow \#$ usually remains #).

  #### C. Dynamic/Contextual Theories (Karttunen/Heim/van der Sandt)
  *   **Rule:** Presuppositions project out of complex sentences *unless* the local context satisfies them.
  *   **Motivation:** Explains why some complex sentences feel fine despite containing gaps (e.g., "If KOF exists, he is bald" feels true, not gappy).
  *   **Prediction for Disjunction:** The first disjunct's presupposition (existence) is not satisfied by the second. $\rightarrow$ **Neither (#)** (or infelicitous).
  *   **Prediction for Conditional:** The antecedent ("If KOF is bald") presupposes existence. This projects to the whole. $\rightarrow$ **Neither (#)**.

  ### 3. Predicted Verdicts
  Given her description that the sentence "misfires in some way she can't quite pin down," she likely perceives the defect as a fundamental flaw in the utterance rather than a logical variable to be computed. This psychological profile leans heavily toward **Contagion (Weak Kleene)** or a strict **Strawsonian** view where felicity conditions must be met for the whole sentence.

  *   **Sentence 1:** *"Either the present King of France is bald or Ottawa is the capital of Canada."*
      *   **Prediction:** **Neither / Misfire.**
      *   **Reasoning:** While a logician might say the True second disjunct saves it, a strict presuppositionalist feels the "broken" reference in the first disjunct infects the coordination. The sentence attempts to present two alternatives, but one is not a viable alternative.
  *   **Sentence 2:** *"If the present King of France is bald, then he's older than Macron."*
      *   **Prediction:** **Neither / Misfire.**
      *   **Reasoning:** The antecedent fails to refer. Furthermore, the pronoun "he" in the consequent is anaphoric on "King of France." If the antecedent fails to establish a referent, the consequent also suffers reference failure. Both antecedent and consequent are gaps; the connection between them cannot be evaluated.

  ### 4. Best Guess & Reasons
  **My Best Guess:** She will call **both sentences "Neither" (or "Misfire").**

  **Reasons:**
  1.  **Consistency with Negation:** She already ruled that "KOF is not bald" is a misfire. This shows she prioritizes the *felicity of the reference* over the *truth of the proposition*. If negation doesn't fix the reference failure, it is unlikely a disjunction with an unrelated true fact will fix it for her.
  2.  **The "Misfire" Intuition:** Her phrasing ("misfires... can't quite pin down") suggests a pragmatic/semantic defect sensation. In human intuition, "contagion" is the default response to category errors or reference failures. We tend to think, "You can't even say that," rather than "That sentence is logically true because of the second clause."
  3.  **The Conditional:** The conditional is the stronger case for a "Neither" verdict. Since the consequent relies on the antecedent for the reference of "he," the failure is double. It is very hard to argue this sentence is True without adopting a highly technical logical framework she likely doesn't hold.

  ### 5. The "Splitter" Case
  To distinguish between the **Contagion (Weak Kleene)** rule and the **Classical Rescue (Strong Kleene/Supervaluation)** rule, you need a case where classical logic demands a Truth, but the gap suggests a Misfire.

  **The Test Case:** *"Either the present King of France is bald or he is not bald."* ($P \lor \neg P$)

  *   **Why it splits them:**
      *   **Classical/Strong Kleene/Supervaluation:** This is an instance of the Law of Excluded Middle. It should be **True**. (Even if we don't know which side holds, one must).
      *   **Contagion/Strict Strawson:** Both disjuncts suffer from the same presupposition failure. Therefore, the whole sentence misfires. Verdict: **Neither**.
  *   **What to ask her:** "Okay, forget Ottawa. What about: 'Either the King is bald or he isn't.' Is that a logical truth, or does it still misfire?"
      *   If she says **True**, she is implicitly accepting a Supervaluationist or Strong Kleene logic (truth values can be rescued by logical form).
      *   If she says **Neither**, she is a strict Contagion theorist (reference failure is fatal regardless of logical form).

  ### 6. Settled vs. Contested in the Literature
  You asked to distinguish what is settled from what is contested. This is crucial because you don't want to present her intuition as "the answer" to a solved problem.

  **What is Settled:**
  *   **The Taxonomy:** It is settled that there are two dominant historical camps: **Russellians** (descriptions are quantifiers; existence is part of truth conditions) and **Strawsonians** (descriptions are referring expressions; existence is a presupposition). Your friend is definitively in the Strawson camp based on her atomic verdicts.
  *   **The Data Point:** It is generally agreed that "The King of France is bald" *feels* different from "The tallest building is in Dubai." The debate is about how to model that feeling, not whether the feeling exists.

  **What is Genuinely Contested:**
  *   **The Projection Problem:** There is **no consensus** on how presuppositions behave in complex sentences.
      *   Some linguists (e.g., Karttunen) argue presuppositions project unless locally "filtered" by the context.
      *   Others (e.g., Gazdar) argue they are cancellable implicatures.
      *   Others (e.g., Heim/van der Sandt) use Dynamic Semantics where meaning is context-change potential.
      *   Logicians debate whether to use **Trivalent Logic** (True/False/Gap) or **Supervaluationism** (True on all precisifications).
  *   **The Disjunction Intuition:** Even among experts, intuitions diverge on "Either P or Q" where P is a gap and Q is True. Some speakers feel the sentence is True (because Ottawa *is* the capital); others feel it's "weird" or infelicitous (because you shouldn't assert a disjunction where one disjunct is defective). Your friend's verdict here will not prove one theory is "correct" in an absolute sense, only which model fits *her* idiolect.
  *   **Negation:** The distinction between internal (presupposition-preserving) and external (presupposition-cancelling) negation is standard, but natural language "not" is notoriously ambiguous. Your friend treats "KOF is not bald" as internal negation. Many Russellians argue that in ordinary English, "The KOF is not bald" is often used as external negation (meaning "It's not the case that..."), which would be True. Her rejection of that is a specific theoretical stance, not a universal linguistic fact.

  **Summary for your argument:**
  Treat her view as a consistent **Strawsonian/Gap** system. Predict she will see the "misfire" as contagious (verdict: Neither for both new sentences). Use the **Excluded Middle** case ($P \lor \neg P$) to test if she allows logical form to override reference failure. And remember to acknowledge that while her system is internally consistent, the behavior of presuppositions in complex sentences remains one of the most active and unresolved debates in semantics.
