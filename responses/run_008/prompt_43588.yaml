answer: |-
  First off, take a deep breath. You have understood the Pasadena Paradox correctly, and your intuition about why it's disturbing is spot-on. It was introduced by Nover and Hájek in 2004 specifically to show that Expected Value (EV) theory, as classically defined, can break down even when the expected value isn't infinite (unlike the St. Petersburg Paradox).

  The reason your finance friend shrugged is that she operates in the world of **finite distributions**, whereas the Pasadena Paradox lives in the world of **infinite series**.

  Here is the breakdown of why you don't need to worry about this when choosing an insurance deductible, where the actual dangers lie, and what tools you should use instead of raw EV.

  ### 1. The "Get Out of Jail Free" Card: Finitude
  The Pasadena Paradox relies on three specific mathematical conditions that **do not exist in the physical world**:
  1.  **Infinite Outcomes:** The game must be capable of going on forever.
  2.  **Conditional Convergence:** The series of probabilities $\times$ payoffs must converge, but not *absolutely*. (This is what allows the Riemann Rearrangement Theorem to let you sum the series to any number you want by changing the order).
  3.  **Unbounded Payoffs:** The magnitude of the payoffs must grow without limit.

  **In real life:**
  *   **Time is finite:** You will not live forever to collect a payoff. Any contract you sign has a termination date.
  *   **Capital is finite:** No insurance company or employer has infinite money. There is a hard cap on the maximum possible payout (even if that cap is \$10 billion).
  *   **Commutativity holds:** As soon as you introduce a hard cap (e.g., "the game ends after 100 flips" or "max payout is \$1 trillion"), the series becomes **finite**. In a finite sum, order does not matter. $A + B = B + A$. The EV becomes a stable, unique number again.

  **The Correction:** For everyday decisions, you are effectively dealing with truncated distributions. The "Pasadena instability" only kicks in if the tail of the distribution is both infinite and oscillates in sign with specific growth rates. Real-world risks (salary, insurance) generally have **finite variance**. If a distribution has a finite mean and variance, the EV is robust.

  ### 2. When Should You Actually Worry?
  You asked: *"At what point does an everyday decision become Pasadena-like enough that I should stop trusting the EV calculation entirely?"*

  The answer is: **Never in the Pasadena sense, but often in the 'Fat Tail' sense.**

  While you won't encounter the alternating-sign infinite series of Pasadena, you *will* encounter situations where EV is misleading because the distribution has **heavy tails** (high kurtosis) or **undefined moments**.

  You should distrust raw EV when:
  1.  **Ruin is possible:** If one outcome in the distribution wipes you out (bankruptcy, death), the arithmetic mean is irrelevant. This is the "Absorption Barrier" problem.
  2.  **The variance is effectively infinite:** In some real-world systems (like wealth distribution or certain market crashes), the variance is so high that the Law of Large Numbers converges too slowly to be useful in a human lifetime.
  3.  **Non-ergodicity:** This is the modern correction to these paradoxes. In an ensemble average (looking at 1,000 people playing once), EV might look great. In a time average (one person playing 1,000 times), you might go bust. If the system is non-ergodic, EV is the wrong metric.

  ### 3. The Standard Corrections (What to Use Instead)
  If raw EV feels shaky (or if you just want to be rigorous), decision theorists and practitioners use these frameworks to "fix" the calculation:

  #### A. Expected Utility Theory (EUT)
  This is the classic economic solution to St. Petersburg and Pasadena-style anxieties. You don't maximize Expected *Value* (dollars); you maximize Expected *Utility*.
  *   **How it works:** You apply a concave function to the payoffs (usually logarithmic: $U(x) = \ln(x)$).
  *   **Why it helps:** Diminishing marginal utility tames the growth of the payoffs. Even if the dollar payoff grows exponentially, the *utility* grows linearly or sub-linearly. This forces the series to converge absolutely, eliminating the rearrangement problem.
  *   **Practical application:** When weighing a job with a variable bonus, don't look at the average dollar bonus. Look at what that money *does* for you. \$100k means a lot more to you if you have \$50k in savings than if you have \$5M.

  #### B. The Kelly Criterion
  If you are making repeated decisions (investing, betting), EV tells you how much to expect on average, but not how to bet without going broke.
  *   **How it works:** It calculates the optimal fraction of your bankroll to wager to maximize the geometric growth rate, not the arithmetic mean.
  *   **Why it helps:** It inherently penalizes high-variance strategies that have a risk of ruin, even if they have a positive EV.
  *   **Practical application:** Don't take a job with a volatile bonus if the volatility threatens your ability to pay fixed costs (rent, debt), even if the average bonus is higher than a flat salary.

  #### C. Value at Risk (VaR) / Conditional VaR
  Finance uses this to handle "tail risk."
  *   **How it works:** Instead of asking "What is the average outcome?", ask "What is the worst 5% of outcomes, and can I survive them?"
  *   **Practical application:** For insurance deductibles, ignore the EV of the premium savings. Look at the **maximum probable loss**. If the high-deductible plan saves you \$500/year but exposes you to a \$5,000 sudden hit that you can't afford, the EV is irrelevant. You buy the low deductible as a hedge against the left tail.

  ### 4. Why Your Friend Said "Diversify"
  Your friend wasn't dodging the question; she was applying the **Law of Large Numbers (LLN)**.
  The Pasadena Paradox breaks the LLN because the variance is undefined. However, in a diversified portfolio, you are aggregating many *finite* risks.
  *   If you have 100 independent risks, the "wobbly" EVs tend to average out *provided* the individual risks don't have infinite variance.
  *   Diversification moves you from a single-draw risk (where Pasadena matters) to a portfolio risk (where Central Limit Theorem usually applies).
  *   Her answer was practical shorthand for: "Don't let any single decision have enough weight to expose you to the tail behavior where EV breaks down."

  ### Summary: Your Decision Heuristic
  You do not need to apply a "safety margin" for the Pasadena Paradox specifically, because it requires physical impossibilities (infinite outcomes/payoffs).

  However, you **should** apply a safety margin for **Model Risk** and **Tail Risk**. Here is your checklist for ordinary decisions:

  1.  **Is the downside bounded?** (Can I lose more than I have?) If yes, ignore EV. Use **Minimax** or **Utility**.
  2.  **Is the distribution fat-tailed?** (Are extreme outliers more common than a Bell Curve suggests?) If yes, discount the EV by looking at the **Median** or **10th Percentile** outcome instead of the Mean.
  3.  **Is this a one-off or repeated?** If one-off, EV is less reliable. If repeated, ensure you have enough capital to survive the variance (Kelly).

  **The Verdict:** The Pasadena Paradox is a boundary marker that tells us "Expected Value is not a fundamental law of the universe; it is a tool that works under specific conditions." Those conditions (finite variance, absolute convergence) are met in 99.9% of human decisions. Trust your EV calculations for deductibles and salaries, but switch to **Utility** and **Risk of Ruin** thinking when the stakes involve potential bankruptcy or life-altering loss.
