      *   *Why does it break EV?* Because the series is not *absolutely* convergent. The Riemann Rearrangement Theorem states that conditionally convergent series can be rearranged to sum to any real number.
      *   *Key Condition:* This requires *infinite* outcomes with specific growth/decay rates and *alternating signs*.

  3.  **Evaluate Applicability to Real Life:**
