answer: |-
  The black box sat on Elena's desk, humming softly. 11:58 AM. In two minutes, the scanner would verify her intention. If it registered true, $1,000,000 would hit her brokerage account. If false, nothing. The toxin vial sat beside it, sealed for tomorrow.

  Elena knew the literature. Kavka. Gauthier. The endless forum wars on decision theory. She knew the trap: intention requires belief in future action. Future action requires motive. Once the money deposited, the motive evaporated. Drinking was pure loss. Therefore, she knew she wouldn't drink. Therefore, she couldn't intend.

  She had tried to hack the logic. Last week, she'd signed a contract with Sarah: if Elena didn't drink, Sarah lost $50,000. Elena had watched Sarah's face pale when she realized the bind—Elena couldn't sacrifice her friend's savings, so she'd have to drink. But Elena knew herself. She knew that tomorrow, facing the nausea, she'd rationalize. *Sarah is rich. Sarah will forgive me.* The contract dissolved in the acid of future rationalization. She'd torn it up yesterday.

  Before that, the conditioning. She'd bought sour candies, pairing the taste with the word "commit." She'd trained herself to flinch at the thought of breaking a promise. But she was a quant; she knew conditioning was just probability weighting. She could recalculate the odds tomorrow. The candy was just sugar.

  11:59 AM.

  She closed her eyes, trying to summon the state of mind. She needed to believe, truly believe, that tomorrow at noon she would swallow the poison. Not hope. Not wish. Believe.

  She tried to dissociate. *Tomorrow-Elena is a stranger,* she thought. *Today-Elena can intend for her.* But the scanner didn't measure semantic tricks. It measured cognitive state. It knew that Today-Elena controlled Tomorrow-Elena's access to the vial. It knew they were the same utility-maximizing agent.

  She tried to summon spite. She would drink just to prove the puzzle wrong. But spite was a motive, and the puzzle stipulated the suffering was pointless. If she drank for spite, it wasn't pointless. The scanner knew the stipulations. It knew her motives were transparent to her.

  She tried to let go of the money. If she didn't care about the million, maybe she'd drink. But she cared. She was washing out of academia because she cared about security. The quant job was about optimization. This was just another optimization problem.

  11:59:45.

  The hum of the box changed pitch. It was waiting for a signal that wasn't coming.

  Elena realized the tragedy wasn't that she lacked willpower. It was that she was too lucid. To win, she needed to be the kind of person who kept promises regardless of consequence. A person of principle. But she was a person of analysis. She had analyzed herself into a corner. She knew her own code too well to patch it.

  She looked at the vial. Clear liquid. Twenty-four hours of vomiting. No lasting damage. A million dollars for a day of hell, payable only if she lied to herself about who she was.

  She couldn't lie. Not to the machine. Not anymore.

  12:00:00.

  The light on the box remained red. No chime. No notification ping on her phone.

  Elena exhaled, a long, shaky sound in the quiet apartment. The tension left her shoulders, replaced by a cold, clean clarity. She hadn't lost a million dollars. She had simply failed to purchase a version of herself that didn't exist.

  She picked up the vial, weighed it in her hand, and set it back down. She opened her laptop and ordered a sandwich.
