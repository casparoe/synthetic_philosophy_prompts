answer: |-
  **Interview Questions for the Spring Issue**

  **1.** You defend the strong reading of the indeterminacy thesis: that there is no fact of the matter regarding correct translation, rather than merely a lack of evidence. Given that this position is often viewed as one of the most counter-intuitive in twentieth-century philosophy, what do you take to be the single most compelling reason for a naturalist to accept it today?

  *   **Follow-up:** If you appeal to the failure of meanings to find a place in our scientific ontology, does this not suggest the problem is simply eliminativism about meaning? If so, why frame it as *indeterminacy* rather than simply stating that there are no meanings to be determined in the first place?

  **2.** Let us turn to the famous *gavagai* example. Critics often argue that once one strips away the exoticism of the jungle setting, the example demonstrates at most that patterns of assent and dissent to occasion sentences leave the reference of individual terms underdetermined. If that is all it shows, why should it threaten the determinacy of translation for whole sentences?

  *   **Follow-up:** You will likely reply that we can compensate for a shift in the reference of a term by adjusting the translation of the surrounding logical particles or predicates. But is there not a limit to such compensation? At what point does adjusting the rest of the sentence render the translation so bizarre that it ceases to be a translation of that sentence at all?

  **3.** Quine insists that the indeterminacy of translation is stronger than the ordinary underdetermination of physical theory by evidence. In the case of physics, we say the evidence underdetermines the theory, but there is still a fact of the matter about which theory is true. Why does translation merit the stronger claim that there is *no* fact of the matter?

  *   **Follow-up:** Given your commitment to naturalism, you hold that science settles what exists. If physics posits facts that transcend immediate evidence, on what grounds do you deny that translation might similarly posit facts that transcend behavioural evidence? Why is language exempt from the realist treatment you afford to physics?

  **4.** Some philosophers suggest that the distinction you draw between physical underdetermination and translational indeterminacy relies on a verificationist intuition that Quine officially rejected. Is there a way to articulate the difference without implicitly appealing to the idea that meaning must be publicly verifiable to be real?

  *   **Follow-up:** If you maintain that the difference lies in the function of language rather than the nature of evidence, does this not commit you to a specific functionalist account of meaning? And if so, is the indeterminacy thesis actually a consequence of indeterminacy in translation, or merely a claim about the functional roles words play?

  **5.** A prominent objection, associated with Chomsky and others, is that the thesis piggybacks on behaviourist assumptions about language acquisition that most linguists and psychologists have long abandoned. Can you reconstruct the argument for indeterminacy without assuming that all evidence available to a translator must be of the stimulus-and-response kind?

  *   **Follow-up:** Suppose we grant the translator access to the speaker's internal cognitive states, as described by modern neuroscience. If those states are physical, and if physical facts are determinate, why do they not settle the question of meaning? What prevents the brain state from being the fact of the matter that Quine claims is missing?

  **6.** If you argue that neural states are themselves subject to indeterminacy, does this not push the problem back into the philosophy of mind? Are you prepared to claim that there is no fact of the matter about what a person's own brain states represent, even from the first-person perspective?

  *   **Follow-up:** If you accept that first-person authority is also illusory in this regard, how do you distinguish your view from a global scepticism about content? Is there any sense in which a speaker knows what they mean, or is self-knowledge merely another form of translation from neural input to verbal output?

  **7.** In his later work, Quine acknowledged a weaker reading of the thesis, suggesting that something like sameness of meaning for whole sentences might be preserved while only reference remains inscrutable. Do you accept this concession, or do you hold that sentence meaning is equally indeterminate?

  *   **Follow-up:** If you concede that sentence meaning is preserved, does this not quietly give away everything that made the original thesis philosophically startling? If propositional attitudes remain determinate, does the inscrutability of reference matter for anything other than technical metaphysics?

  **8.** Conversely, if you maintain the strong view that sentence meaning is also indeterminate, how do you account for the apparent stability of communication? We seem to successfully coordinate our actions based on shared understanding. Is this success merely pragmatic, or does it imply a determinacy you deny?

  *   **Follow-up:** If you argue that successful coordination is compatible with multiple incompatible translation manuals, does this not render the notion of 'misunderstanding' obsolete? If two manuals are equally correct despite contradicting one another, in what sense can a translator ever be said to have made a mistake?

  **9.** This leads to a question about your own philosophical practice. If there is no fact of the matter about whether an English sentence means what you take it to mean, how do you understand the sentences in which you defend the thesis itself? Are you not relying on the determinacy of meaning to argue against it?

  *   **Follow-up:** You might reply that we must speak from within our own language. But if the thesis is true, is it not true only relative to a chosen manual? If so, does the thesis not lose its universal force and become merely a report on how you choose to translate your neighbours?

  **10.** If the thesis is relative to a background language, does this not collapse into a form of relativism that Quine wished to avoid? How do you maintain the objectivity of the indeterminacy claim without stepping outside the very translational framework you claim is inescapable?

  *   **Follow-up:** If you accept that the claim is immanent to our current theory, does this not make the thesis contingent? If our scientific theory changes, could indeterminacy turn out to be false? Or is the thesis meant to be a necessary truth about the structure of language itself?

  **11.** Many students find the indeterminacy thesis paralysing. If meaning is not fixed, what becomes of normative claims in logic and ethics, which seem to rely on precise formulation? Do you see the thesis as having practical ethical implications, or is it confined to metaphysics?

  *   **Follow-up:** If you say it is confined to metaphysics, is that not an unstable division? If our ethical terms are subject to the same translational indeterminacy as *gavagai*, how can we claim that our moral disagreements are substantive rather than merely verbal?

  **12.** Finally, for the students reading this journal: the literature on this topic is dense and often technically demanding. Where do you see the most promising avenue for new work? Should young philosophers attempt to refute the thesis, or to explore its consequences for other areas of philosophy?

  *   **Follow-up:** If you suggest exploring its consequences, which area do you think has been most neglected? Is it in the philosophy of mind, the philosophy of logic, or perhaps in the emerging dialogue between Quinean naturalism and contemporary cognitive science?
