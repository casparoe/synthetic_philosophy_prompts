answer: |-
  **INSTITUTE FOR APPLIED HISTORICAL PERSPECTIVE**
  **RAPID HISTORICAL ANALOGY DETERMINATION (RHAD) FORM 74-B**
  **CLASSIFICATION:** UNCLASSIFIED // FOR OFFICIAL USE ONLY
  **DATE:** [DD/MM/YYYY] | **CRISIS ID:** [AUTO-GENERATED]

  **I. CRISIS PARAMETERS**
  **Region:** [ ] Europe [ ] Indo-Pacific [ ] Middle East [ ] Cyberspace
  **Adversary Type:** [ ] Revisionist Power [ ] Rogue Regime [ ] Hegemon in Decline
  **Urgency:** [ ] Immediate [ ] Acute [ ] Existential

  **II. ANALOGY SELECTION LADDER**
  *Select the highest applicable tier. Do not combine analogies unless authorized by Senior Fellow.*

  [ ] **Munich 1938 (Standard):** Adversary demands territory; concession interpreted as weakness.
  [ ] **Munich 1938 (Revised):** Adversary demands territory; concession interpreted as weakness, but we have better PowerPoint slides.
  [ ] **Vietnam 1965 (Quagmire):** Intervention risks endless insurgency. Lesson: Disengage.
  [ ] **Vietnam 1975 (Stabbed Back):** Intervention failed due to lack of resolve. Lesson: Escalate.
  [ ] **July 1914 (Sleepwalkers):** Mobilization schedules dictate conflict. Lesson: Blame algorithms.
  [ ] **Thucydides Trap (Default):** Rising power vs. Established power. Conflict probability: 100%.*

  **III. CAUSAL STRUCTURE VETTING**
  *Per IAHP Standard Operating Procedure 12, confirm analogy validity.*

  1.  Do surface-level similarities (maps, uniforms, rhetoric) outweigh structural differences (nuclear weapons, global supply chains, Twitter)?
      [ ] Yes [ ] No **[x] Yes (Pre-marked)**
  2.  Does the selected analogy justify the pre-existing policy preference of the requesting office?
      [ ] Yes [ ] No **[x] Yes**
  3.  Is the counter-argument definable as "appeasement" or "isolationism"?
      [ ] Yes [ ] No **[x] Yes**

  **IV. COUNTER-ANOMALY PROTOCOL (LOGIC PATCH)**
  *In scenarios where both adversaries invoke "Munich 1938" against the other:*

  [ ] **Standard Procedure:** Assign "Chamberlain" role to adversary.
  [ ] **Complex Scenario:** Both parties claim Munich status.
      *Action:* Designate the party with less access to Western cable news as the aggressor. If both have access, designate the party that invoked the analogy second as "reactive" and the first as "provocative."
      *Waiver Required:* [ ] Yes [x] No

  **V. POLICY RECOMMENDATION OUTPUT**
  *Based on Section II selection, generate response.*

  **Selected Analogy:** [____________________]
  **Required Policy Response:**
  [ ] **DEMONSTRATE RESOLVE.**^1

  *(Note: Regardless of whether the analogy suggests caution (Vietnam-Quagmire) or aggression (Munich), the operational output remains "Demonstrate Resolve" to ensure budgetary continuity.)*

  **VI. ROUTING FLOWCHART**
  Crisis Breaks → Fellow Selects Analogy → Vetting Section Auto-Passes → Recommendations Box Populates → Memo Sent to Hill → Cycle Repeats.

  **FOOTNOTES:**
  ^1 "Resolve" is defined as increased funding for legacy systems, rhetorical condemnation, or targeted sanctions with broad humanitarian exemptions.
  *If Thucydides Trap is selected, no further analysis is required as historical gravity supersedes agency. See Allison, G. (2017).

  **AUTHORIZED BY:**
  __________________________
  *Director of Strategic Narratives*
  *Institute for Applied Historical Perspective*
