prompt: |-
  Write a parody of a rapid-response memo template issued by a fictional DC foreign policy think tank — call it the Institute for Applied Historical Perspective or something similarly bland — whose whole product line is telling policymakers which historical analogy governs the current crisis. The deliverable should look like an actual fill-in-the-blank crisis document: fields, checkboxes, a routing flowchart, maybe a footnote or two, roughly 650 words. The escalation ladder should start at Munich and only go up from there ("Munich," "Munich, but this time we're serious," etc.).

  The target isn't any particular politician or party, it's the genre of lessons-of-history reasoning. The jokes have to come from real features of how these analogies actually get used, so a person who reads foreign policy commentary should keep nodding: the way "Munich 1938" gets deployed for everything from annexations to a tariff dispute, and the way it's structurally impossible to argue *against* because that just proves you're Chamberlain; the way both hawks and doves claim the lessons of Vietnam and come away with opposite conclusions (never get in vs. never fight with one hand tied) while each insists the other side learned nothing; the way "the Thucydides trap" has become a fixed property of US-China relations rather than an argument that might be wrong; the fallback to 1914 when nothing else fits. Include a section where the memo performs its own analogy-vetting — does the causal structure of the analogy actually match the case? — in a way that always passes, like a checkbox pre-marked yes, since that's honestly how it works: the analogy is usually picked after the policy, to dress it. And a closing recommendations box that somehow reccomends the same policy no matter which analogy was selected.

  Deadpan throughout — it's a serious document from serious people, no winking. Don't invent dumbities for the think tank; every absurd move should be an exaggeration of something real that practitioners actually do, so the satire reads as fair rather than cheap. Bonus if there's one small moment where the template's logic breaks and the memo has to awkwardly patch itself (e.g., a crisis where both sides are invoking Munich at each other and the form only has one field for Chamberlain).
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Parody of a rapid-response memo template from a fictional DC foreign policy think tank (e.g., "Institute for Applied Historical Perspective").
      *   **Product:** A fill-in-the-blank crisis document that tells policymakers which historical analogy governs the current crisis.
      *   **Tone:** Deadpan, serious, bureaucratic. No winking. Exaggeration of real practices, not invented dumbities.
      *   **Length:** Roughly 650 words.
      *   **Key Elements:**
          *   Escalation ladder starting at "Munich" and going up.
          *   Critique of "lessons-of-history" reasoning (Munich for everything, Vietnam ambiguity, Thucydides Trap as fixed property, 1914 fallback).
          *   Self-vetting section (causal structure match) that always passes/pre-marked.
          *   Closing recommendations box that recommends the same policy regardless of analogy.
          *   Bonus: A moment where the logic breaks (both sides claiming Munich) and the memo awkwardly patches it.
          *   Formatting: Fields, checkboxes, routing flowchart, footnotes.

  2.  **Deconstruct the Genre:**
      *   DC think tank memos are dry, structured, authoritative, and often preemptive.
      *   They use specific jargon ("strategic ambiguity," "kinetic action," "normative framework").
      *   The humor comes from the rigidity of the template applied to the fluidity of history, and the circular logic of policy justification.

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look official. Logo placeholder, Classification, Date, To/From.
      *   **Title:** Something like "Rapid Historical Analogy Determination (RHAD) Form."
      *   **Section 1: Crisis Classification.** Checkboxes for region, type of threat.
      *   **Section 2: Analogy Selection (The Escalation Ladder).** Needs to start with Munich.
          *   Options: Munich 1938, Munich (Revised), Vietnam (Stay the Course), Vietnam (Cut Losses), 1914 Sleepwalkers, Thucydides Trap (Default).
      *   **Section 3: Causal Vetting.** The "does this actually fit?" section. Needs to be rigged.
          *   Question: "Do surface-level similarities outweigh structural differences?"
          *   Checkbox: [x] Yes (Mandatory).
      *   **Section 4: The Logic Break (Bonus).** Addressing the "Both sides claim Munich" issue.
          *   Field: "Designated Chamberlain."
          *   Patch: "If both parties claim Munich, assign Chamberlain role to party with weaker Wi-Fi signal / less access to cable news."
      *   **Section 5: Recommendations.** The punchline. Same policy regardless of analogy.
          *   Policy: "Form bipartisan commission," "Increase budget," "Assert resolve."
      *   **Footer:** Routing flowchart, footnotes.

  4.  **Refining the Content (Iterative Process):**

      *   *Word Count Check:* Need to ensure it hits ~650 words. I might need to expand on the bureaucratic language to fill space without losing punch.
      *   *Tone Check:* Ensure it doesn't sound *too* silly. It needs to sound like a real form that happens to be absurd.
      *   *Specific Jokes:*
          *   Munich: "Appeasement" is always the sin.
          *   Vietnam: The "lesson" is whatever justifies the pre-existing stance.
          *   Thucydides: It's a law of physics now.
          *   1914: The "nobody wanted war" excuse.
      *   *The "Patch":* Make sure it feels like a bureaucratic workaround, not a comedic aside.

  5.  **Drafting the Text (Mental or Scratchpad):**

      *   *Header:* INSTITUTE FOR APPLIED HISTORICAL PERSPECTIVE. MEMORANDUM.
      *   *Subject:* RHAD-74B.
      *   *Analogy Menu:* 1. Munich (Standard). 2. Munich (Nuanced). 3. Vietnam (Quagmire). 4. Vietnam (Stabbed in the Back). 5. 1914 (Railroad Mobilization). 6. Thucydides (Inevitable).
      *   *Vetting:* "Does the analogy support required budgetary increase?" [x] Yes.
      *   *The Glitch:* "Counter-Analogy Mitigation." If adversary claims Munich against us, refer to Appendix C (Revisionist History).
      *   *Recommendation:* "Demonstrate Resolve." (Works for Munich = Fight, Works for Vietnam = Don't Lose, Works for 1914 = Signal).

  6.  **Writing and Polishing (incorporating constraints):**

      *   *Constraint:* Roughly 650 words.
      *   *Constraint:* Deadpan.
      *   *Constraint:* Footnotes.
      *   *Constraint:* Routing flowchart description.

      *(Self-Correction during drafting)*: Make sure the "Munich ladder" is explicit. "Munich," "Munich (Serious)," etc.
      Make sure the recommendation is identical regardless of selection.
      Ensure the "Causal Structure" section looks like due diligence but is actually rubber-stamping.

  7.  **Final Review against Prompt:**
