answer: |-
  Good evening everyone. Teachers, parents, fellow students.

  When I was assigned the topic "Sweden vs Norway: Which is more liberal?", I thought it was a joke. And honestly, looking at the two of us, it kind of is. We are neighbors who share a language, a love of winter sports, and a government monopoly on alcohol that treats Saturday afternoon wine purchases like a high-stakes heist.

  But my politics teacher gave me one piece of advice before walking away: "Define your terms." And she was right. You cannot answer this question until you agree on what "liberal" means.

  If you mean *economic* liberalism—low taxes, small state—then neither of us wins. We both love a big state. So we have to talk about *social* liberalism. Personal freedom. But even there, we run into traps. Does "liberal" mean being the first to pass a law? Or does it mean passing it with the most consensus? Does it mean separating church and state? Or does it means trusting adults with alcohol?

  To avoid cherry-picking facts after the fact, I proposed a scorecard to my Norwegian exchange partner before I wrote this. Three indicators. Agreed upon in advance.

  **Indicator One: Secularism.**
  Sweden separated the church from the state in 2000. Norway did it in 2012. On pure timing, Sweden takes the point. We got the state out of the church business first.

  **Indicator Two: Social Consensus.**
  My Norwegian friend pointed out that when gender-neutral marriage was passed, Norway's parliament voted with a massive majority. It wasn't just passed; it was embraced. Sweden passed it too, a year later, but the Norwegian debate was notably less fractured. If liberalism is about the will of the people, not just the date on the law, Norway takes the point.

  **Indicator Three: The Trust Test.**
  This is about alcohol. Both countries have strict systems. But generally, the Norwegian debate around personal restrictions feels slightly less moralistic than the Swedish one. We Swedes tend to lecture; you Norwegians tend to regulate. I'm calling this a tie, because honestly, trying to buy beer on a Sunday in either country feels equally illegal.

  So, we have a tie. One point each, one tie.

  This is where I have to commit. I cannot give you the cop-out answer that "we are both special."

  My weighting is this: Historical timing matters less than cultural consensus. A law passed early but with friction is less "liberal" than a law passed slightly later but with unity. Liberalism isn't just about statutes; it's about the social fabric.

  Therefore, based on the pre-committed list, and weighting consensus over timing: **The more liberal country is Norway.**

  Now, I know what my Swedish cousins are thinking. "He's just saying that because he's standing outside Oslo." And I know what my Norwegian friends are thinking. "Finally, someone admits it."

  But the data is the data. Sweden might win on the calendar, but Norway wins on the culture. And frankly, given how strict both of us are about alcohol, maybe neither of us is as liberal as we think. But if I have to choose, I'm choosing the country where the debate was quieter, the consensus was louder, and where I'm currently standing.

  Takk. Tack.
