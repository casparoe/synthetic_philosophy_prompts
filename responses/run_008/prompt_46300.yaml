answer: |-
  Here is a structured guide for your section, designed to move beyond surface-level applications and engage the theoretical tensions your students need to grapple with.

  ### 1. Brooks Hatlen: Non-Interference vs. Social Status
  Brooks is the perfect trap for a naive negative-liberty reading. Under Berlin's metric, Brooks is maximally free post-release: no guards, no walls, no direct interference. Yet, he is existentially destroyed.
  *   **The Pettit Defense:** You can argue this supports republicanism if you emphasize Pettit's claim that liberty is a *social status*, not just a physical condition. Inside, Brooks had a recognized role (librarian) and predictable rules. Outside, he lacked social standing and was vulnerable to the indifference of the world. For Pettit, vulnerability can be a form of domination if it leaves you at the mercy of structural forces, though this stretches the definition slightly.
  *   **The "Cheating" Charge:** However, push your students on whether this conflates *liberty* with *wellbeing* or *capacity*. A strict Pettitian might admit Brooks was free outside but lacked the *resources* to enjoy it. If you argue he was *unfree* outside simply because he was unhappy or unadjusted, you risk collapsing liberty into welfare. The stronger theoretical point is that negative liberty is insufficient for human flourishing, but that doesn't automatically prove non-domination was present. Brooks highlights the difference between the *status* of freedom and the *capacity* to exercise it.

  ### 2. Warden Norton: The Architecture of Arbitrary Power
  This is the film's strongest evidence for Pettit. Andy's privileges (the library, the beer) are not rights; they are favors.
  *   **Domination vs. Interference:** Norton rarely interferes with Andy's daily life once the money-laundering scheme is set, but Andy remains unfree because Norton *can* interfere at whim. The power is arbitrary.
  *   **The Predictable Warden:** To your point about an interventionist-but-predictable warden: Yes, on Pettit's metric, a strict warden who follows codified rules non-arbitarily is preferable to Norton. Republican liberty is compatible with interference if that interference is tracked by the interests of the interferee and constrained by law (non-arbitrarity). Norton represents the *rule of man*, which is the antithesis of republican freedom, even if he is occasionally benevolent. This dramatizes the core republican claim: it is the *possibility* of arbitrary interference, not the act itself, that constitutes unfreedom.

  ### 3. Red's Parole Hearing: Autonomy vs. Liberty
  Red's final hearing is often misread as a moment of political liberation.
  *   **Theoretical Categorization:** This is not liberty in the Berlin or Pettit sense. He is still physically confined (no negative liberty) and still subject to the board's arbitrary decision (no non-domination).
  *   **Positive Liberty/Dignity:** This is a moment of *autonomy* or *dignity*. He stops tailoring his will to the expectations of the master. It aligns more with a Kantian or Positive Liberty framework (self-mastery, authenticity) than political liberty. He reclaims his moral agency, but he does not reclaim his freedom until he is physically paroled. Distinguish clearly for the students: speaking truth to power is an act of integrity, but it does not change the power relation itself.

  ### 4. Where the Film Resists the Republican Reading
  You are right to suspect the film ultimately bails on the republican framework.
  *   **The Escape as Negative Liberty:** The climax is a pure negative-liberty fantasy. Andy doesn't reform the prison or establish a rule of law; he breaks the walls. The tunnel works because of *non-interference* (the guards don't notice the hammer), not because Andy secured a status of non-domination. He escapes domination by exiting the jurisdiction entirely, not by transforming the power relation.
  *   **Hope vs. Liberty:** "Hope" is a psychological state, not a political status. The film conflates internal freedom (hope/dignity) with external freedom (liberty). Andy is "free" inside his head while in solitary, but politically, he is dominated. The film suggests hope is enough to sustain you, but political theory requires us to ask about the structures. The movie is sentimental here; it suggests that maintaining an internal sphere of autonomy is a substitute for political liberty, which is a dangerous concession in a theory course.

  ### 5. Discussion Strategy
  Start with Brooks to destabilize their intuition that "out is better than in." Move to Norton to solidify the republican critique of arbitrary power. Use Red to distinguish between moral autonomy and political liberty. End with the escape to show where the film retreats into liberal individualism. This arc prevents the section from becoming a simple "Pettit fits best" confirmation bias exercise.

  Verdict: split, The film diagnoses power through a republican lens but resolves its conflict through a negative-liberty fantasy.
