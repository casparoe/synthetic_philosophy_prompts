answer: |-
  Good evening. It is a spring tradition here that I write for the festival magazine, and it is an equally stubborn tradition that I am dragooned into opening this debate. I say "dragooned" because the organizers know that my job is to stand exactly in the center of a room that wants to pull me left and right. They have already rejected two drafts of this speech for covert tilt. I am currently working on a third draft which consists entirely of weather reports, but they insisted on substance. So, here we are.

  My task is to give you a map before you walk the terrain. The motion before us is that the state has no business enforcing morality as such. Now, even that phrasing is a minefield. To say "morality as such" sounds like we are talking about enforcing rules for no reason other than rule-following. It suggests a kind of moral busybodyism. But if we describe the other side's position as protecting the shared moral fabric on which a society's cohesion depends, the tilt runs the other way. It sounds essential, like maintenance on a bridge.

  So, what is the disagreement really about? It is about the limits of state power and the nature of society itself.

  On one side, we have a view often associated with the mid-twentieth-century debate between Lord Patrick Devlin and Professor H.L.A. Hart. Let's gloss the terms. Legal moralism, the view our retired judge will likely champion, suggests that a society is not just a group of people living near each other; it is a moral community. Devlin argued that a society's shared morality is like a language. A language survives only because people keep speaking it according to shared rules. If everyone decides privately what words mean, the language collapses. Similarly, if everyone decides privately what is right and wrong, the society collapses. Therefore, the state has a legitimate interest in enforcing moral convictions, even if no specific physical harm is occurring, because the erosion of those convictions harms the society's existence.

  On the other side, we have the harm principle, the view our philosopher will likely defend. This is the liberal tradition stemming from John Stuart Mill. It argues that the only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others. His own good, either physical or moral, is not a sufficient warrant. In this view, morality is a matter for private conscience, social pressure, or family, but not the criminal law. The state must remain neutral on the "good life" so that individuals are free to pursue their own versions of it, provided they do not injure their neighbors.

  You might ask why this abstract distinction matters in a city like ours, where we worry about potholes and parking permits. It matters because the distinction determines what counts as evidence.

  Consider the live controversy currently before our city council: the proposal to criminalize the purchase of sexual services. This is a perfect test case because the supporters of the proposal are split in a way that mirrors this debate. Some supporters argue purely on harm-reduction grounds. They say commercial sex fuels trafficking and exploitation; criminalizing the buyer reduces demand and protects vulnerable people. That is a harm-based argument. It relies on data. If the data showed no link to trafficking, the argument would fail.

  Other supporters argue openly on the ground that commercial sex is a wrong the community need not tolerate, regardless of the data. They argue it is inherently degrading to human dignity. That is a moralistic argument. It relies on conviction. If the community believes it is wrong, the law should reflect that, even if no specific victim complains.

  And then there are those who seem not to have noticed there is a difference. They mix the arguments, assuming that because something is harmful, it must be immoral, or because it is immoral, it must be harmful. But the distinction is vital. If you are arguing from harm, you must prove the injury. If you are arguing from morality, you must demonstrate a consensus. Confusing the two allows us to skip the hard work of proof or the hard work of consensus-building.

  Now, for the few legal philosophers in the audience—I see you in the front row, looking skeptical—you know that there is no view from nowhere. Even a map requires a projection, and every projection distorts something. I have tried to choose one that distorts neither shoreline. To frame the question as "morality as such" risks begging the question against the moralist. To frame it as "social fabric" risks begging the question against the liberal. My goal tonight is not to solve that tension, but to ensure you see it clearly.

  This is why we have debaters. It is why we have a format that requires them to speak to you, rather than to each other. We need the charm of experience to show us why community matters. We need the precision of philosophy to show us why liberty matters.

  Our first speaker is a retired appellate judge, locally famous for having once upheld a morals-based ordinance on the grounds that a community's settled moral convictions are a legitimate basis for criminal law, full stop. He is charming, quotable, and believes that law without morality is merely bureaucracy.

  Our second speaker is a younger philosopher who has built her career on the harm-principle side of the old Hart–Devlin dispute. She is precise, dry, and believes that morality without liberty is merely coercion.

  They both deserve your attention. They both deserve your scrutiny. And neither of them needs my endorsement to make their case. The floor is theirs.
