          1.  **Primary Clause:** Action has moral worth if the agent's will is structured such that the moral rightness of the act is a non-fungible condition of their choosing it.
          2.  **Secondary Clause (Internalization):** This commitment need not be conscious or effortful; it can be embodied in habituated character traits or immediate emotional responses, provided those traits/responses track moral reasons rather than prudential ones.
