answer: |-
  # Joint Statement on Classical Hedonism vs. Lexical Threshold Negative Utilitarianism

  **Participants:** 
  *   **A:** Proponent of Classical Hedonistic Utilitarianism (CHU)
  *   **B:** Proponent of Lexical Threshold Negative Utilitarianism (LT-NU)

  **Date:** October 26, 2023

  ## 1. Areas of Agreement

  We, the undersigned, affirm the following claims as common ground for this collaboration:

  1.  **Consequentialist Framework:** We agree that the moral rightness of actions is determined by their consequences, specifically regarding the welfare of sentient beings.
  2.  **Welfarist Hedonism:** We agree that welfare consists entirely of conscious experience (pleasure and suffering). Non-experiential factors (e.g., autonomy, knowledge) have no intrinsic value except insofar as they affect experience.
  3.  **Intrinsic Valence:** We agree that suffering is intrinsically bad and pleasure is intrinsically good.
  4.  **Severity Sensitivity:** We agree that more intense suffering is worse than less intense suffering, and that the intensity of experience matters morally.
  5.  **The Self-Interest Intuition:** We both agree that, in a strictly *intrapersonal* case involving our own future selves, we would rationally accept one week of the worst possible suffering in exchange for one billion years of the best possible bliss.
  6.  **Methodology:** We agree to resolve disputes through consistency checks, thought experiments, and pre-registered predictions rather than appeals to authority or historical exegesis (specifically excluding the question of whether Karl Popper was a negative utilitarian).
  7.  **Priority of Suffering:** We agree that, *ceteris paribus*, reducing severe suffering is a higher priority than increasing mild pleasure, though we disagree on whether this priority is lexical (absolute) or weighted (aggregative).

  ## 2. Exact Disagreements

  The following table outlines our substantive moral disagreements. Each statement is phrased in the first person; only the participant who holds the view signs that specific cell.

  | Issue | Position A (Classical Hedonist) | Position B (Lexical Threshold NU) |
  | :--- | :--- | :--- |
  | **1. Aggregation Structure** | "I hold that pleasure and suffering exist on a single cardinal scale. Any amount of suffering, no matter how intense, can theoretically be outweighed by a sufficient quantity of pleasure." | "I hold that suffering above a specific intensity threshold $T$ is lexically worse than any amount of pleasure below that threshold. No quantity of pleasure can morally compensate for one instance of supra-threshold suffering in interpersonal aggregation." |
  | **2. Intra- vs. Interpersonal** | "I hold that the mathematics of value should not change based on whether experiences occur in one life or many. If the trade is good for one person over time, it is good in principle; the refusal to apply it interpersonally is inconsistent." | "I hold that intrapersonal aggregation is distinct from interpersonal aggregation. Consent and personal identity allow for prudential trade-offs within a life that are forbidden when imposing suffering on others for the sake of third-party pleasure." |
  | **3. The Sadistic Case** | "I hold that a world containing one tortured person and a trillion mildly content people can be better than a world with neither, provided the sum of mild contentment is high enough." | "I hold that a world containing one person suffering above threshold $T$ is worse than a world containing any number of people experiencing only mild contentment, regardless of the total sum." |
  | **4. Hedonic Engineering** | "I hold that if beings are engineered with a vastly higher hedonic range, a fixed absolute threshold for suffering looks like an artifact of human biology rather than a moral truth." | "I hold that the threshold is determined by the phenomenological nature of suffering itself (e.g., the breakdown of agency), not by the available range of pleasure. It remains absolute even for post-human minds." |

  ## 3. Potential Verbal Disputes & Open Conceptual Items

  We identify the following area as a potential verbal dispute. We have not resolved whether this is merely semantic or substantive.

  **The Nature of the Threshold:**
  *   **The Question:** Is the lexical threshold a fact about *phenomenology* (i.e., supra-threshold suffering feels qualitatively different, like a category error to compare it to pleasure) or a *decision-theoretic heuristic* (i.e., the tails of the distribution dominate expected value under uncertainty, creating a practical rule that looks lexical)?
  *   **A's Stance:** I suspect this is largely a verbal dispute masking a disagreement about risk aversion. If B admits the threshold is a heuristic for uncertainty, our views converge significantly.
  *   **B's Stance:** I suspect this is substantive. Even under perfect information, I maintain that certain experiences (e.g., torture that destroys the capacity to value) are incommensurable with pleasure.
  *   **Joint Statement on Status:** We acknowledge that if B's view is purely heuristic, the disagreement collapses into a debate about epistemology and risk. If B's view is phenomenological, the disagreement is axiological. We have not yet agreed on what the threshold is a threshold *of*.

  ## 4. Cruxes and Pre-Registered Predictions

  We have identified four cruxes where settling the question would move at least one of us. We record our predictions below.

  ### Crux 1: The Consistency of the Self-Interest Trade
  *   **Thought Experiment:** We isolate the variable of *consent*. If A or B could magically consent on behalf of a stranger (who would not remember the trauma but would gain the bliss), would the trade be permissible?
  *   **Relevance:** Tests whether the Intrapersonal/Interpersonal distinction (Disagreement #2) relies on consent or on the structure of value.
  *   **Prediction (A):** B will judge this impermissible. This will reveal that B's acceptance of the trade in the self-interested case relies on identity/continuity, not just value aggregation. I will argue this makes B's view agent-relative in an unjustified way.
  *   **Prediction (B):** I will judge this impermissible. I predict this will not move me, because I believe rights/constraints are agent-relative. However, if I find myself hesitating, I will update toward A's view.

  ### Crux 2: The Phenomenological Discontinuity
  *   **Thought Experiment:** We attempt to construct a "sorites series" of pain from a stubbed toe to hellish torture, asking if there is a single step where the *kind* of badness changes, not just the degree.
  *   **Relevance:** Tests the "Nature of the Threshold" (Open Item).
  *   **Prediction (A):** I predict we will fail to find a qualitative break. I expect B to agree that it is a continuum, which would force B to abandon the lexical claim as phenomenologically grounded.
  *   **Prediction (B):** I predict we will identify a break point (likely around the destruction of cognitive integration). If I cannot point to a specific phenomenological feature that breaks the scale, I will concede the threshold is likely a heuristic.

  ### Crux 3: The Hedonic Engineering Scale
  *   **Thought Experiment:** Consider a post-human species whose "mild contentment" is subjectively 100x more intense than a human's "best bliss." Does the suffering threshold scale up with them?
  *   **Relevance:** Tests whether the threshold is absolute (anthropocentric) or relative to the mind's capacity (Disagreement #4).
  *   **Prediction (A):** If B says the threshold stays absolute (human-level), I will argue B's view is biologically arbitrary. If B says it scales, I will argue lexicality is relative, not absolute. Either way, I expect this to weaken B's confidence.
  *   **Prediction (B):** I maintain the threshold is absolute based on the nature of *suffering*, not pleasure. If the post-human's "mild contentment" is intense, that does not raise the bar for what counts as intolerable suffering. I predict this intuition will hold firm.

  ### Crux 4: The Repugnant Conclusion vs. The Sadistic Conclusion
  *   **Thought Experiment:** We compare the "Sadistic Conclusion" (one tortured person outweighs trillion happy) against the "Repugnant Conclusion" (a massive population of lives barely worth living outweighs a smaller population of very happy lives).
  *   **Relevance:** Tests which bullet is harder to bite.
  *   **Prediction (A):** I bite the Repugnant Conclusion (or a variant thereof) to avoid the Sadistic Conclusion. I predict B will find the Sadistic Conclusion intuitive. If B admits the Sadistic Conclusion is counter-intuitive, they should move toward aggregation.
  *   **Prediction (B):** I bite the Sadistic Conclusion to avoid the Repugnant Conclusion. I predict that if A truly grasps the intensity of the torture, they will find the Sadistic Conclusion more palatable than trading a life for a mere sum of mild utilities.

  ---

  **Signed,**

  _________________________ (Classical Hedonist)

  _________________________ (Lexical Threshold Negative Utilitarian)
