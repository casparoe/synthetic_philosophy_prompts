answer: |-
  The break room hummed with the unusual silence of idle computers. The build servers were down for maintenance, leaving the engineering team stranded with notebooks and whiteboards. Marcus stared into his coffee, rubbing his temples.

  "I feel lobotomized," Marcus said. "I know the architecture, but without the IDE, the linter, the docs... I'm writing pseudocode in the dark."

  Dana leaned against the counter, stirring her tea. "That's exactly it. You're not just hampered, Marcus. You're literally thinking with less hardware. The tools aren't just aids; they're parts of your mind."

  Marcus sighed, smiling faintly. "Here we go. The extended mind thesis. Dana, just because I *need* the compiler doesn't mean the compiler *is* my cognition. There's a difference between something being causally necessary and being constitutive. My car needs fuel to run, but the fuel isn't the engine."

  "But the fuel doesn't process information," Dana countered. "Think about your keybindings. When you switch to a unfamiliar laptop, you hesitate. You have to consciously recall where the 'find' command is. On your main rig, your fingers just go. That muscle memory is a cognitive process happening outside your skull. If that same neural firing happened inside your head, you'd call it memory. Why does moving it to the keyboard make it 'external'?"

  "Because I can lose the keyboard and still be me," Marcus said. "If I lose access to the keybindings, I'm slowed down. If I suffer a stroke that damages my motor cortex, I'm impaired. We describe tool loss as inconvenience; we describe brain damage as loss of self. That distinction matters. It suggests we intuitively know the boundary stops at the skin."

  Dana nodded slowly. "I'll concede the intuition point. But intuitions can be prejudiced. What if that distinction is just 'skin-and-skull prejudice'? Look at how you debug. You don't introspect to find bugs. You scatter log statements. You read the output to understand your own logic. Those logs are functioning as working memory. You're offloading cognitive load onto the console."

  "Offloading isn't merging," Marcus insisted. "I possess the knowledge; the logs just help me access it. Think of a library. I have access to all that knowledge, but I don't claim to know every book by heart. Possession requires internalization. If the servers vanish, I still know how to code. You're confusing access with ownership."

  Dana paused, her spoon hovering over her mug. This was the tricky spot. "But do you know? You said earlier you couldn't reconstruct the module from memory. You only understand the bug after writing the test that reproduces it. The test isn't just checking the code; it's checking your understanding. If you can't verify the thought without the external tool, in what sense do you 'possess' the knowledge internally?"

  Marcus shifted in his chair. He couldn't quite say how he knew the algorithm worked without running it. "Okay, fair. Maybe 'possession' is too strong. But there's a reliability issue. Your mind is always with you. The build server is down right now. If the server is part of your mind, then during maintenance, you're literally missing a lobe. That seems absurd. Cognitive processes should be robust, not subject to uptime schedules."

  Dana frowned. She had walked into that one. "Alright, that stings. If cognition requires constant coupling, then downtime means mind-loss. I can't say your mind shrinks every night when you sleep or every time Jenkins goes down. Maybe it's not about constant presence, but about trusted integration. When the tool is available, is it transparent? Do you use it without questioning?"

  "Exactly," Marcus said, seizing the opening. "But that transparency doesn't make it *you*. It just makes it a good tool. The question isn't whether the tool is useful. It's whether the process stops being 'mental' the moment it crosses the skull. If I write a variable name on a whiteboard, is that thought on the board? Or is the board just reflecting the thought I had inside?"

  "Does it matter?" Dana asked. "If the whiteboard allows you to solve a problem you couldn't solve internally, the system—You plus Board—solved it. Why privilege the biological part?"

  "Because the biological part is the agent," Marcus said. "The board doesn't care if you solve it. You do. The intentionality comes from inside. If we say the mind extends, we risk dissolving the agent entirely. Where does it stop? Is the internet part of your mind because you use Google?"

  Dana laughed. "Now you're sliding down a slope. I'm talking about tight coupling. Keybindings, version control history as autobiographical memory, failing tests as cognitive constraints. But you're right about the boundary. If I can't draw a line between 'tool I use' and 'tool that is me', the theory breaks."

  Marcus finished his coffee. "So we're stuck. I can't explain why I feel less smart without the tools if I truly 'possess' the knowledge internally. But you can't explain where the mind ends if it depends on servers that go down for maintenance."

  "Then that's the question," Dana said, setting her mug down. "It's not whether tools help. It's this: At what point does a reliable causal connection become a constitutive part of the system? Is it about trust, or availability, or something else?"

  Marcus grabbed his notebook. "If we can answer that, maybe we can figure out how to work without the servers. Until then, I'm writing pseudocode in the dark."

  "Same," Dana said. "Just don't forget where your mind left off."
