  Here is why: Step (3) asserts that the space of worlds for evaluating dominance is fixed by logic alone, independent of the agent's cognitive reach. This looks attractive because it preserves the objectivity of logic, mirroring the "true state of the atmosphere" in your work. However, it slips by conflating *metaphysical* possibility with *epistemic* possibility. Accuracy-first epistemology aims to codify norms for *believers*, not just abstract credence functions. If an agent cannot distinguish between a world where $L$ is true and a world where $L$ is false (because the proof is beyond their grasp), penalizing them for treating those worlds differently violates the principle that "ought implies can." By restricting the dominance calculation to **epistemically possible worlds** (worlds compatible with what the agent can verify), you save the agent from being dominated for missing a 1,000-line proof, while still condemning them if they are incoherent relative to what they *can* see.

  The cost of rejecting (3) is that probabilistic coherence becomes relative to cognitive capacity. Two agents with different logical blind spots could both be "coherent" while assigning different probabilities to the same proposition. This sacrifices the beautiful objectivity of the probability axioms, turning them from laws of thought into laws of *manageable* thought.

  Regarding your calibration analogy: it **fails** in this specific context. In weather forecasting, recalibration is justified because you eventually get verification data (the truth arrives). For obscure logical truths, verification may never arrive for the agent. Therefore, adjusting credences toward logical truth cannot be justified *epistemically* (by accuracy) if the agent cannot access the target; it can only be justified *pragmatically* (to avoid Dutch Books or improve computational efficiency). This confirms your suspicion that the analogy smuggles in pragmatism when applied to logical limitations.

