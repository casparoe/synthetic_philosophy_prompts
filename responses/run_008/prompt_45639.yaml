answer: |-
  Dear Colleague,

  Given your students' background in welfare economics, your primary pedagogical challenge is to prevent the leveling-down objection from functioning as a conversation-ender rather than a distinction-maker. For the objection to register as a problem for only one version of egalitarianism rather than as a refutation of all of it, you must first secure their agreement that instrumental justifications for equality are distinct from intrinsic ones. You need them to concede that if equality were valuable only because it reduces envy or increases social stability, then leveling down would indeed be irrational, but that this would not touch claims about rights or fair procedures. Before introducing the objection, establish a sterile hypothetical case involving two individuals, A and B, where A has higher welfare than B. This case must explicitly exclude any possibility of envy, status competition, or social unrest, and you must state clearly that the welfare metric is already adjusted for any diminishing marginal utility of income. The reason for this exclusion is that your students will instinctively reach for instrumental arguments to defend equality, claiming that leveling down reduces utility via social friction, which conflates the distributive principle with aggregate welfare outcomes. By stripping away envy and status, you force them to confront whether equality has any non-instrumental value, which is the only ground where the leveling-down objection bites.

  You should sequence the session by presenting the leveling-down objection first to validate their intuition that blind equality is flawed, then introduce the telic-deontic distinction to save a narrow form of egalitarianism, and only then introduce prioritarianism as the view that captures the concern for the worse off without incurring the leveling-down implication. This order prevents them from dismissing the entire discussion after the objection. Within this sequence, you must head off the misconception that prioritarianism is just maximin immediately after introducing the prioritarian view by showing a scenario where a large benefit to the better off outweighs a small benefit to the worse off, which prioritarianism allows but maximin forbids. You must also intervene when defining the priority weight function to emphasize that the moral value attaches to the benefit itself, not the recipient, preserving the idea of equal moral status, otherwise they will interpret priority weighting as a claim that the poor are inherently more valuable persons. Regarding scope, you should openly decline to cover sufficiency views or the deep metaphysical debates about the currency of egalitarianism, telling them that while those are important, this seminar focuses on the structure of weighting benefits versus leveling outcomes.

  For the diagnostic question, ask them to choose between a policy that gives a massive utility gain to the moderately well-off versus a tiny gain to the worst-off, where the total utility is higher in the first case but the priority-weighted value is higher in the second, and ask them to justify their choice without referencing diminishing marginal utility or social stability. The correct answer requires them to articulate the moral weight of the benefit relative to the baseline, not just the sum of welfare. Finally, be aware that the weakest link in this sequence is the distinction between prioritarianism and utilitarianism with diminishing marginal utility, as welfare economists will insist that priority weighting is just a disguised utility curve. If you sense them resisting this, you should reorder the sequence to tackle the definition of welfare earlier, perhaps by stipulating that utility is cardinal and comparable but that the moral value function is distinct from the utility function, otherwise they will dismiss prioritarianism as redundant before you have explained its normative force.

  Best regards,

  Your Assistant
