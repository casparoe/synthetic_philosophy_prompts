  **Commander B:** They tell us the state is good. That's enough for me. I'm preping the units.

  **Commander A:** Wait. If you prep, and I don't...

  **Commander B:** Then you're the one who stayed safe while I took the shot. Is that what you want? To be the coward who hid behind Rubinstein while the opportunity vanished?

  **Commander A:** I want to be the commander who didn't throw away his battalion on a maybe.

  **Commander B:** It's not a maybe. It's a certainty obscured by noise.

  **Commander A:** Noise is all we have.

  **Commander B:** [Typing...] Look, the sun is coming up. I have to commit. I can't hold the units in reserve forever.

  **Commander A:** I know.

