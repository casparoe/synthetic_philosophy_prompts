  **Commander B:** Seven. I have seven. The state is favorable. The probability is overwhelming. We attack.

  **Commander A:** I can't. You know I can't.

  **Commander B:** Don't do this. We've run the numbers. With seven handshakes, the chance the state is bad is negligible. We're both confident. Why let the protocol freeze us?

  **Commander A:** Because confidence isn't common knowledge. Look at the chain. I know you received at least six. You know I received at least six. But I also know that *you* know I might have only received five.

  **Commander B:** So? We're not at five. We're here. Now.

  **Commander A:** It's not about where we are. It's about where the logic bottoms out. Imagine I had received zero messages. I'd have no idea if the state was favorable. I'd have to hold back. You know that.

