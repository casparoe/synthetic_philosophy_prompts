  1. A salesperson invents a second interested buyer to create urgency: manipulation, obviously.
  2. Graphic anti-smoking ads with true images of damaged lungs: NOT manipulation — nothing false, and it's aimed at everyone rather than at some specific weakness.
  3. A partner deliberately waits for a bad day, when you're feeling soft, to ask you to host Thanksgiving. Everything said is true; only the timing was chosen: manipulation.
  4. Candy at the checkout where kids will pester parents: manipulation — the store is engineering impulses, not giving anyone reasons.
  5. A telemarketer keeps a lonely elderly customer chatting because lonely people buy more, while every factual claim about the product is true: manipulation.
  6. A doctor's relative tells you the harsh true facts ("your father will not recover; you need to decide about the ventilator today"), partly to force a decision before other relatives weigh in: NOT manipulation — harsh, but just true information, and the harshness is reality's fault.

