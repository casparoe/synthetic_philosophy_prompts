  *   **Maya's Call:** Manipulation.

  ### The Splitting Case

  To definitively separate Rule 1 (Authentic Context) from Rule 2 (Vulnerability Exploitation), you would need a case where the context is authentic but the psychology is targeted.

  **Proposed Test Case:**
  A charity sends a mailer with true statistics about hunger, but prints the donation form on paper scientifically proven to feel heavier and more textured, which subconsciously increases the perceived importance of the request and donation amounts. The recipients are unaware of the paper effect.

