  *   **Rule 2 Verdict:** **Manipulation.** The tactic bypasses reason by exploiting a sensory cognitive bias (haptic feedback influencing value judgment) without the target's knowledge.

  If Maya calls this manipulation, she prioritizes Rule 2. If she clears it, she prioritizes Rule 1.

