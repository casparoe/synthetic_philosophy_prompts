  Here is the breakdown of Maya's ethical framework, applied to your current dilemma.

  ### Two Candidate Rules

  Based on Maya's track record, she is not using a simple "truth vs. lies" metric. Cases 3, 4, and 5 were all factually true but still verdicted as manipulation. Instead, her judgments align with two distinct philosophical principles that usually overlap but can diverge.

  **Rule 1: The Authentic Context Principle**
  Influence is manipulative if the agent constructs an artificial decision environment that misrepresents the actual constraints or stakes of the situation.
  *   **Focus:** The external structure of the choice.
  *   **Key Signal:** Artificial scarcity, hidden timing, or engineered constraints (Cases 1, 3, 4).
  *   **Exemption:** Harsh realities or natural consequences are permissible even if they pressure the decision (Cases 2, 6).

  **Rule 2: The Vulnerability Exploitation Principle**
  Influence is manipulative if the agent bypasses rational deliberation by targeting a specific psychological weakness or cognitive bias rather than appealing to the target's values or reason.
  *   **Focus:** The internal psychology of the target.
  *   **Key Signal:** Leveraging loneliness, impulse, bad moods, or hidden profiling (Cases 3, 4, 5).
  *   **Exemption:** Appeals to general health, safety, or moral values aimed at a broad audience are permissible (Cases 2, 6).

  ### Where the Rules Diverge

  For Tactics A and C, both rules agree.
  *   **Tactic A (Forgetfulness):** Violates Rule 1 (hidden profiling creates an artificial relationship) and Rule 2 (exploits the cognitive weakness of forgetfulness).
  *   **Tactic C (Midnight Deadline):** Violates Rule 1 (the deadline is an artificial constraint) and Rule 2 (urgency pressures impulse over reason).

  **Tactic B (Identifiable Kid) is the divergence point.**
  *   **Under Rule 1 (Authentic Context):** This tactic is **permissible**. The story is true, the program exists, and there are no artificial constraints added to the decision. It presents reality as it is.
  *   **Under Rule 2 (Vulnerability Exploitation):** This tactic is **manipulative** *if* you interpret the "identifiable victim effect" (the cognitive bias where people donate more to one named person than to statistics) as a vulnerability akin to the "kid impulse" in Case 4. If Maya views this bias as a glitch in rationality rather than a moral feature, Rule 2 flags this.

  ### Predicted Verdicts

  Here is my prediction for how Maya will rule on your three tactics, based on the consistency of her past calls.

  **Tactic A: Manipulation (Red Light)**
  *   **Reasoning:** This is the strongest match to Case 5 (Lonely Elder). In both instances, the influencer uses private data to target a specific cognitive weakness (loneliness vs. forgetfulness) that the target cannot easily guard against. The fact that the email text is true is irrelevant, just as the telemarketer's product facts were irrelevant in Case 5. Maya consistently penalizes hidden profiling that leverages a weakness.
  *   **Maya's Call:** Manipulation.

  **Tactic B: Not Manipulation (Green Light)**
