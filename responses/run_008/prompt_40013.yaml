  A. A "we miss you" win-back email with a discount, sent only to people we've profiled as having forgotten to cancel a premium trial last year. We're using their own forgetfulness pattern, which they don't know we've charted. Everything in the email is true.
  B. A true story about one named kid our clean-water program helped, with the line "your gift will support programs like hers" — no claim the money goes to her specifically. Every fact checks out.
  C. A matching campaign where the match is real but the midnight deadline was set by us precisely to create urgency, and the ad leads with a sad true story plus "matched funds expire at midnight."

