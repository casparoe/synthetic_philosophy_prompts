  *(Self-Correction during drafting)*: I need to be careful not to conflate Dennett's view with Parfit's, though they are similar on reductionism. Dennett emphasizes the *narrative* aspect more than Parfit's *psychological connectedness*. I must ensure the "Narrative" part gets enough weight. Also, ensure I don't paint Dennett as a pure instrumentalist; he believes in "Real Patterns."

  *(Final Polish)*: Make sure the distinction between "Center of Gravity" (physics) and "Center of Narrative Gravity" (interpretive) is clear. The physics CoG is observer-independent (mostly), the Narrative CoG is observer-relative (depends on the interpreter). This adds nuance to the "cheapness" objection.

