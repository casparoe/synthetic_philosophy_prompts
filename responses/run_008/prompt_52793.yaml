          4.  *Identity Indeterminacy:* Diachronic identity questions lack binary truth values in edge cases. (Substantive/Defensible).
          5.  *Instrumentalism:* Self-talk is just a tool. (False/Too weak for Dennett).
      *   *Section 2: The Wrinkle (Cheapness).* Address the fission/death issue. Dennett *does* bite the bullet on indeterminacy. But "cheap" $\neq$ "arbitrary." Constraints exist.
      *   *Section 3: The Classmate's Dismissal.* She was half-right. The question presupposes a "further fact." But it's not a *confused* question, just one with a deflationary answer.
      *   *Section 4: The Committed Verdict.*
          *   Reading: Abstract Realism + Indeterminacy.
          *   Truth: Yes, it's the best naturalistic fit.
          *   Regret: Relocates it. Regret is about narrative continuity, not metaphysical identity.
          *   Classmate: Overreached in dismissal, underexplained the theory.

