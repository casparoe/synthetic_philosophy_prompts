answer: |-
  # DIAGNOSTIC TREE: INTERPRETATIONS OF THE WHITE HORSE DIALOGUE

  **Instructions for the Reading Group:**
  This instrument classifies interpretive readings of the *Baima lun* based on logical commitments, not scholarly lineage. Begin at the **Root Assumption**. Proceed through the four **Decision Nodes** in order. At each node, select the option that best matches your interpretation of the text. Follow the path to a **Terminal Leaf**.

  **Root Assumption (Charity):**
  You grant that the Advocate's replies are internally coherent. The Advocate does not simply dodge the Interlocutor's objections (e.g., "If there is a white horse, one cannot say there are no horses"); they answer them.

  ---

  ## DECISION NODE 1: The Translation of *Fei*
  **Question:** When paraphrasing the thesis *Bai ma fei ma* into English, how do you render the copula/negation *fei*?

  *   **A. The Falsehood Reading:** You produce a sentence that is plainly false under standard logic (e.g., "A white horse is not a member of the class horse").
      *   *Go to Node 4 (Genre).*
  *   **B. The Technical Truth Reading:** You produce a sentence that is true but requires technical qualification (e.g., "White horse is not identical to horse," or "The term 'white horse' does not equate to 'horse'").
      *   *Go to Node 3 (Seeking).*
  *   **C. The Non-Sentential Reading:** You refuse to paraphrase it as a subject-predicate sentence at all (e.g., "To name 'white horse' is not to name 'horse'").
      *   *Go to Node 3 (Seeking).*

  ---

  ## DECISION NODE 2: The Sibling-Sophism Test
  **Question:** The *Zhuangzi* lists "Dogs are not hounds" as a similar disputation, and the Mohist Canons discuss "Ox-Horse" compounds. Does the *White Horse* dialogue derive its philosophical depth from something these sibling puzzles **lack**?

  *   **A. No Depth:** It relies on the same verbal ambiguity or synonymy tricks as "Dogs are not hounds."
      *   *Go to Node 4 (Genre).*
  *   **B. Unique Depth:** It reveals a structural feature of language, reality, or classification that "Dogs are not hounds" does not.
      *   *Go to Node 3 (Seeking).*
  *   **C. Shared Depth:** It shares the same logical structure as the "Ox-Horse" compound puzzles (ambiguity of compounds).
      *   *Go to Node 4 (Genre).*

  *(Note: If you arrived here from Node 1A, select A. If from 1B/1C, select B or C.)*

  ---

  ## DECISION NODE 3: The "Seeking" Observation
  **Question:** The Advocate argues: When one seeks a **horse**, yellow or black horses may be delivered; when one seeks a **white horse**, they may not. What does this observation register?

  *   **A. Difference in the World (Ontology):** It tracks a difference in the objects or universals themselves (e.g., a composite vs. a simple; a particular vs. a universal).
      *   *Go to Node 4 (Genre).*
  *   **B. Difference in Classification (Semantics):** It tracks a difference in how terms pick out kinds or stuffs (e.g., mass nouns vs. count nouns; compound vs. simple names).
      *   *Go to Node 4 (Genre).*
  *   **C. Difference in Substitutability (Pragmatics):** It tracks a difference in whether terms can be swapped in specific contexts without changing truth conditions (e.g., riding vs. naming).
      *   *Go to Node 4 (Genre).*

  ---

  ## DECISION NODE 4: Genre and Sincerity
  **Question:** What is the Advocate doing in this dialogue?

  *   **A. Asserting Doctrine:** The Advocate sincerely holds the thesis as a metaphysical or semantic truth.
      *   *Select Leaf.*
  *   **B. Exhibiting Technique:** The Advocate is training disputers to win arguments regardless of truth (Forensic/Eristic).
      *   *Select Leaf.*
  *   **C. Staging a Reductio:** The Advocate is exposing a confusion in loose usage to be corrected by a better system (Critical/Resolution).
      *   *Select Leaf.*

  ---

  ## TERMINAL LEAVES

  ### Leaf 1: The Eristic Deflation
  *   **Path:** Node 1(A) → Node 2(A) → Node 4(B).
  *   **Description:** The thesis is false in ordinary language. The dialogue is a training exercise for court disputers to learn how to defend the indefensible. It is not doctrine.
  *   **Scholarly Label:** Eristic / Sophistic Reading.

  ### Leaf 2: The Semantic Equivocation
  *   **Path:** Node 1(B) → Node 2(B) → Node 3(C) → Node 4(A).
  *   **Description:** The thesis is technically true because "is" equivicates. "White horse is not horse" means "White horse is not *identical* to horse" (distinct intensions), even if white horses are horses (extension). The "Seeking" passage shows terms are not substitutable *salva veritate*.
  *   **Scholarly Label:** Graham-Style Semantic Reading.
  *   **⚠️ Convergence Warning:** This leaf is logically adjacent to **Leaf 4 (Mereological)**. Both rely on "Non-Identity." If your reading treats "identity" as "whole-part identity," you may collapse into Leaf 4.

  ### Leaf 3: The Mass Noun / Kind Reading
  *   **Path:** Node 1(C) → Node 2(B) → Node 3(B) → Node 4(A).
  *   **Description:** Classical nouns function like mass nouns denoting "stuffs" or kinds. "White horse" and "horse" non-synonymously denote different kinds/stuffs. The paradox dissolves because we are comparing naming acts, not class membership.
  *   **Scholarly Label:** Hansen-Style Reading.
  *   **⚠️ Convergence Warning:** This leaf overlaps with **Leaf 2 (Semantic)** if "difference in kind" is treated as a semantic difference in intension.

  ### Leaf 4: The Universalist Reading
  *   **Path:** Node 1(B) → Node 2(B) → Node 3(A) → Node 4(A).
  *   **Description:** "Horse" names the abstract universal (horseness). "White horse" names a composite (horseness + whiteness). The universal is not the composite. The "Seeking" passage reflects ontological distinctness.
  *   **Scholarly Label:** Fung Yu-Lan Universalist Reading.

  ### Leaf 5: The Mereological Reading
  *   **Path:** Node 1(B) → Node 2(B) → Node 3(A) → Node 4(A).
  *   **Description:** "Horse" names a part of the content of "white horse." A part is never identical to the whole. The "Seeking" passage reflects that seeking the whole requires more than seeking the part.
  *   **Scholarly Label:** Mereological Reading.
  *   **⚠️ Convergence Warning:** This leaf occupies the **same node path** as **Leaf 4 (Universalist)**. The distinction lies only in whether you describe the ontology as "Platonic Universals" (Leaf 4) or "Part-Whole Structures" (Leaf 5). The text supports both.

  ### Leaf 6: The Mohist Resolution
  *   **Path:** Node 1(C) or 1(B) → Node 2(C) → Node 3(C) → Node 4(C).
  *   **Description:** The Advocate trades on ambiguity. The Mohist apparatus (e.g., "riding a white horse is riding a horse") shows where the equivocation lives. The dialogue is a reductio of loose usage, resolved by distinguishing contexts (killing vs. riding, naming vs. acting).
  *   **Scholarly Label:** Mohist-Style Resolution.

  ---

  ## DIAGNOSTIC APPENDIX: EMPTY & COLLAPSED NODES

  **1. Diagnosed Empty Leaves (Unoccupied Logical Space)**
  *   **The Sincere Falsehood:** (Node 1A + Node 4A). *Diagnosis:* **Incoherent.** Under the Root Assumption of charity, one cannot claim the Advocate sincerely asserts a plainly false statement as doctrine while remaining coherent.
  *   **The Trivial Doctrine:** (Node 1B + Node 2A + Node 4A). *Diagnosis:* **Unattractive.** If the thesis is merely a technical truth with no depth beyond sibling sophisms ("Dogs are not hounds"), it is unlikely to sustain a sincere metaphysical doctrine worth preserving.
  *   **The Ontological Trick:** (Node 3A + Node 4B). *Diagnosis:* **Unexplored.** It is rare to argue the text tracks real ontological differences (Seeking = World Difference) but claim the genre is merely forensic training. Usually, ontological claims imply doctrinal sincerity.

  **2. Flagged Convergences (Indistinguishable Readings)**
  *   **Graham (Leaf 2) vs. Mereological (Leaf 5):** Both readings rely on the "Non-Identity" translation of *fei*. The decision tree cannot separate them at Node 3, as "Substitutability" (Graham) and "Part-Whole" (Mereological) often yield identical predictions in the text. Readers should acknowledge this overlap.
  *   **Graham (Leaf 2) vs. Hansen (Leaf 3):** Both readings treat the thesis as true based on semantic distinctions. The split occurs at Node 1 (Sentence vs. Naming Act) and Node 3 (Substitutability vs. Kind). However, in practice, "difference in intension" (Graham) and "difference in kind-denotation" (Hansen) frequently collapse in application.

  **3. Usage Note**
  If your path leads to a Convergence Warning, your reading is structurally sound but may not be distinguishable from the neighboring leaf using *only* the internal logic of the dialogue. External historical evidence is required to separate them.
