answer: |-
  Consider a university-managed housing trust designed to support visiting scholars, currently operating at half capacity with several vacant apartments sitting idle throughout the semester. A coalition of local homeless veterans applies for temporary occupancy during a harsh winter freeze, presenting a dire need that matches the housing trust's humanitarian charter. The trust's board denies the application, not citing a lack of physical space or resources, which are plainly abundant, but rather invoking the foundational bylaws that designate these units as exclusive entitlements for the academic community. The exclusion here is absolute despite the availability of room, resting entirely on the claim that the seats belong to a specific class of people by right of institutional definition, rendering the outsiders ineligible regardless of the surplus capacity available to absorb them without risk to the current occupants.

  Imagine now a municipal emergency shelter established in a school gymnasium during a catastrophic flood, where the physical limit of safe occupancy has been reached due to sanitation and ventilation constraints. The people currently sleeping on the gym floor arrived merely by chance of proximity and timing, holding no special tenure or moral priority over the desperate newcomers pounding on the doors outside. The shelter manager must turn away the newcomers to prevent a disease outbreak that would endanger everyone inside, even though the current occupants have no stronger claim to be there than those left in the rising water. Here the exclusion is driven strictly by the arithmetic of biological capacity and systemic collapse, devoid of any property claim or prior right that distinguishes the insiders from the outsiders, forcing a triage decision based solely on the physical limits of the institution.

  When we subject these scenarios to diagnostic scrutiny, the divergent commitments of ethical frameworks become starkly visible. A Hardin-style defender finds the first scenario straightforward, arguing that preserving the institutional boundary is necessary to maintain the resource pool for its intended beneficiaries, even if space exists. However, this position struggles with the second scenario, where the boundary is arbitrary; the Hardinist must argue that the mere fact of occupancy creates a provisional entitlement to prevent total system failure. Conversely, a straightforward act utilitarian rejects the first scenario entirely, viewing the vacant units as wasted utility that should be allocated to the veterans to maximize welfare, since no capacity constraint prevents it. In the second scenario, the utilitarian agrees with the exclusion, but only because letting more people in would cause a collapse that reduces overall welfare, not because the insiders deserve safety more than the outsiders. The egalitarian who denies property claims finds the first scenario morally indefensible, viewing the bylaws as an illegitimate hoarding of common resources, while the second scenario presents a tragic dilemma where a lottery might be required since no one has a prior claim to the limited safe space.

  The diagnostic power of these cases lies in manipulating their defining features to see which moral engine stalls. If we fill the spare seats in the first scenario until the housing trust is at genuine risk, the Hardin argument shifts from boundary protection to capacity defense, revealing that the original exclusion was purely about ownership rather than survival. If we grant the shelter occupants in the second scenario formal tenure or priority status, the exclusion shifts from triage arithmetic to boundary protection, effectively turning the emergency shelter into the housing trust. This swap demonstrates that many real-world arguments conflating scarcity and entitlement are actually boundary claims disguised as capacity concerns. When a politician argues we cannot accept more refugees because schools are full, we must ask if the schools are physically incapable of holding more children or if the existing seats are claimed by a specific constituency that refuses to share.

  The strongest available line of attack for a Hardin defender faced with the second scenario is to argue that without stable boundaries, the notion of capacity itself cannot be fixed. They would contend that if anyone can claim a spot by mere presence, the definition of who counts as a legitimate user becomes fluid, making it impossible to calculate safe limits or maintain the system long-term. In this view, the arbitrary boundary of who got inside first is necessary to establish a countable population, without which the capacity constraint becomes meaningless because the demand is infinite. This suggests that even in triage situations, some boundary rule is required to make the arithmetic possible, implying that capacity and ownership are inextricably linked in practice. Ultimately, this exercise allows a reader to dissect lifeboat ethics arguments to see whether the persuasive load is carried by the arithmetic of survival or the morality of ownership, recognizing when an argument that looks like physics is secretly a claim about property.
