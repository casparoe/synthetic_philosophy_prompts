answer: |-
  It is not embarrassing to find this slogan slippery; it is a classic example of a "conversational stopper" that masquerades as a principle. It works rhetorically because it conflates several different kinds of claims (moral, causal, pragmatic) into one sentence. When you pull them apart, most of them fray.

  Here is the menu of distinct claims the slogan could be making, evaluated for plausibility and whether they actually justify shutting down your student.

  ### 1. The Waiver of Standing (Normative Claim)
  **The Claim:** Voting is the price of admission for political standing. By abstaining, you voluntarily opt out of the collective decision-making process. Therefore, you waive your right to criticize the outcome, just as you can't complain about the rules of a game you refused to play.
  *   **Plausibility:** Low. Political standing (the right to critique power) is generally considered a right of residence or personhood, not a privilege earned by participation. Minors, non-citizens, and the disenfranchised can legitimately complain about laws that bind them. If the claim were true, they couldn't.
  *   **Does it license dismissing the student?** Technically, yes—if you accept the premise. It says her complaint is *illegitimate*.
  *   **The Problem:** It proves too much. It implies that anyone who couldn't vote (due to illness, registration error, or age) loses their standing. Most colleagues would reject this if pressed.

  ### 2. The Causal Responsibility Claim (Empirical Claim)
  **The Claim:** The outcome is, in part, your fault. By not voting, you failed to prevent the winner. Therefore, the bad outcome is self-inflicted, and complaining about it is complaining about your own negligence.
  *   **Plausibility:** False. As you noted, in almost no election does one vote determine the margin. Her abstention did not cause the school board's victory.
  *   **Does it license dismissing the student?** No. Since the premise is empirically false (she didn't cause the result), the conclusion doesn't follow. You can't be blamed for a specific outcome you couldn't have changed.
  *   **The Problem:** It relies on a magical view of individual voting power.

  ### 3. The Fair Play Claim (Normative/Reciprocity Claim)
  **The Claim:** Politics is a cooperative scheme. We all benefit from the stability of the system. Voting is a minimal duty of "fair play." If you refuse to do your share to maintain the system, you lose the moral high ground to gripe when the system produces results you dislike. It's a form of free-riding.
  *   **Plausibility:** Moderate. This is the strongest philosophical defense of the slogan. It appeals to the principle of fairness: you shouldn't benefit from the collective effort of others (a functioning democracy) without contributing your own minimal effort.
  *   **Does it license dismissing the student?** Only partially. It doesn't make her *substantive* complaint wrong (the school board might still be terrible). It only makes her *attitude* objectionable. It licenses saying, "You're being ungracious," not "You're wrong."
  *   **The Problem:** It assumes voting is the only or best way to contribute. If she abstained as a protest against the options, she might argue she *is* participating, just negatively.

  ### 4. The Consistency Claim (Hypocrisy-Tracking)
  **The Claim:** It is pragmatically inconsistent to demand influence over a system you refuse to engage with. Complaining implies you want things to be different; voting is the mechanism provided to make things different. Ignoring the mechanism while demanding the result is irrational.
  *   **Plausibility:** High. This isn't about rights or causation; it's about rationality. It points out a tension between her desires (good schools) and her actions (ignoring the lever that controls schools).
  *   **Does it license dismissing the student?** No. It licenses pointing out an inconsistency, but not silencing the complaint. A hypocrite can still be right about the facts. (e.g., A smoker can correctly tell you smoking causes cancer).
  *   **The Problem:** It attacks the messenger, not the message.

  ---

  ### The Compulsory Voting Wrinkle
  You asked if the reading that best supports dismissing the student implies voting should be mandatory.

  The **Fair Play Claim (#3)** is the one that does the most work for your colleague. It suggests voting is a *civic duty*. However, holding that voting is a moral duty does not logically force one to support *legal compulsion*.
  *   **Distinction:** We have moral duties to be honest, charitable, and faithful to our spouses. We do not (mostly) make those legally compulsory.
  *   **The Colleague's Position:** Your colleague can consistently say: "Voting is a duty you owe your neighbors (Fair Play). If you shirk that duty, you lose the social license to gripe (Sanction). But the state shouldn't force you to vote (Liberty)."
  *   **The Tension:** If the penalty for not voting is "you can't complain," that is a social sanction. If the penalty is "you get fined," that is legal. The slogan relies on the social sanction. Moving to legal compulsion changes the nature of the act from a voluntary duty to a coerced one, which might actually undermine the "Fair Play" argument (since fair play requires voluntary contribution). So, your colleague can likely hold both views without contradiction, provided they keep moral duty and legal enforcement separate.

  ### What People Actually Mean
  When your colleague used this line, they almost certainly were not thinking about Waiver or Causation. They were operating on **Fair Play mixed with Social Sanction.**

  Psychologically, the slogan is a tool for enforcing social norms, not a philosophical argument about rights. It expresses frustration: *"I did my part in the messy process of democracy; you opted out but still want to enjoy the benefits of having an opinion on the outcome. That feels like cheating."*

  It works as a "stopper" because it shames the listener, not because it refutes their argument. It shifts the conversation from "Is the school board doing a bad job?" to "Are you a good citizen?"

  ### Summary for Coffee
  If you want to hand this to your colleague, here is the distillation:

  1.  **It's not about rights:** We don't lose the right to criticize the government just because we didn't vote (ask any disenfranchised person).
  2.  **It's not about causation:** One vote rarely decides an election, so the non-voter isn't personally responsible for the win.
  3.  **It is about Fair Play:** The only version that holds water is that voting is a minimal duty of reciprocity. If you don't do your share, it's ungracious to complain about the collective result.
  4.  **The Limit:** Even if the student was ungracious, that doesn't mean her complaint about the school board is wrong. It just means she's annoying.
  5.  **Compulsion:** You can believe voting is a moral duty without believing it should be a legal one. The slogan enforces the moral duty via social shame, not law.

  **Verdict:** The slogan is a valid rebuke of *civic attitude*, but an invalid rebuttal of *political substance*. Your student might be a bad citizen, but she might still be right about the school board.
