answer: |-
  ### Brainstorm of Candidate Concepts

  *   **Dilation:** This is the strongest candidate. In the literature on Imprecise Probabilities (IP), dilation occurs when conditioning on a partition (e.g., Heads/Tails) results in a posterior credal interval that is strictly wider than the prior interval for *every* element of the partition. It fits the "widening for free" description perfectly.
  *   **Ellsberg-style Ambiguity Aversion:** This refers to a preference ordering where an agent prefers known risks over unknown risks (e.g., betting on an urn with known proportions vs. unknown proportions). While your friend's behavior *leads* to ambiguity-averse choices (refusing wagers), Ellsberg is a static decision-theoretic concept, not a dynamic updating phenomenon.
  *   **Non-Conglomerability:** A technical property of probability functions where the unconditional probability of an event does not lie within the range of its conditional probabilities given a partition. Dilation is often the observable consequence of non-conglomerability in credal sets. It's related but "Dilation" is the more specific name for the *widening* effect.
  *   **Hyperprior Updating (Bayesian):** A standard Bayesian could model uncertainty about correlations using a hierarchical prior. However, a Bayesian updates the weights on these models. If done correctly, a Bayesian's posterior variance on the *parameter* might change, but their point-value credence in the event won't "widen" into an interval; it will simply move. This fails to capture the interval expansion.
  *   **Information Loss:** This is too generic. Technically, your friend gained information (the coin outcome). The phenomenon is that precision decreased despite information gain.

  **Verdict:** The phenomenon is **Dilation**. It is a well-documented, albeit controversial, feature of Imprecise Probability theory.

  ***

  ### The Phenomenon: Dilation

  The phenomenon you are describing has an established name in formal epistemology and decision theory: **Dilation**.

  Specifically, this is **credal dilation** within the framework of **Imprecise Probabilities**. It occurs when an agent represents their belief state not as a single probability function (a point), but as a set of probability functions (a credal set or interval). Dilation is the situation where, upon conditioning on new evidence $E$, the posterior interval for a hypothesis $H$ strictly contains the prior interval.

  In your friend's case:
  *   **Prior:** $P(\text{Startup}) \in [0.3, 0.6]$
  *   **Evidence:** Coin = Heads ($E$)
  *   **Posterior:** $P(\text{Startup} | E) \in [0.2, 0.7]$

  Because $[0.3, 0.6] \subset [0.2, 0.7]$, her credence has dilated.

  #### The Mechanism: Uncertain Relevance
  You noted that "every one of her models agreed the coin itself was fair." This means for every probability function $P$ in her set $\mathcal{P}$, $P(\text{Heads}) = 0.5$. However, dilation arises because the set $\mathcal{P}$ contains models with **varying dependency structures** between the coin and the startup.

  *   **Model A (Positive Correlation):** If Heads, Startup is more likely. $P(S|H) = 0.7$.
  *   **Model B (Negative Correlation):** If Heads, Startup is less likely. $P(S|H) = 0.2$.
  *   **Model C (Independence):** Coin tells us nothing. $P(S|H) = 0.45$.

  In the prior state, these conditional probabilities are averaged out (weighted by the 50% chance of Heads). The prior interval reflects the weighted average of these models. However, once you learn Heads, the "averaging" collapses. You are left looking directly at the spread of $P(S|H)$ across the models. If the models disagree sharply on the *relevance* of the evidence (the correlation), the posterior spread will be wider than the prior spread of the marginals.

  ### Distinctions from Related Concepts

  **1. Versus Ordinary Loss of Precision**
  In standard statistics, "loss of precision" usually implies noisy data or small sample sizes. If a Bayesian observes a noisy signal, their posterior variance might increase, but their *point estimate* simply moves. They never experience an *interval* expanding because they never held an interval to begin with. Dilation is structural: it happens even with perfect, noiseless evidence (like a logical truth or a fair coin flip) solely due to the structure of the credal set.

  **2. Versus Ellsberg-Style Ambiguity**
  Ellsberg ambiguity is about **preference**, not belief updating. An Ellsberg agent refuses to bet because they dislike the *state* of ambiguity. Your friend is describing a change in her *doxastic state* (her credences) over time. While dilation often *causes* ambiguity-averse behavior (she now refuses bets she previously accepted), dilation is the epistemic engine driving that change, not the preference itself.

  **3. Versus Orthodox Bayesianism**
  An orthodox Bayesian cannot undergo dilation. By definition, a Bayesian has a precise prior $P$. Upon learning $E$, they update to $P(\cdot|E)$.
  *   If the Bayesian believes the coin is independent of the startup, $P(S|H) = P(S)$. No change.
  *   If the Bayesian believes they are correlated, $P(S|H) \neq P(S)$. The value moves, but it does not "widen."
  *   If the Bayesian is unsure about the correlation, they should represent this uncertainty in a single prior (a mixture). Upon learning $H$, they update the weights of the mixture. While the *variance* of their mixture distribution might change, their credence in the startup remains a single point value. They cannot rationally refuse a bet that their own point-value credence says is favorable. Your friend's refusal to bet is a direct consequence of having an interval, not a point.

  ### Feature or Pathology?

  This is one of the most heated debates in the Imprecise Probability literature.

  **The Pathology View (The Orthodox Critique)**
  Critics, including many orthodox Bayesians and some IP theorists (e.g., Teddy Seidenfeld, though he analyzes it formally), view dilation as a defect.
  *   **Violation of Intuition:** Evidence is supposed to reduce uncertainty. Dilation implies that *any* outcome of the coin flip (Heads or Tails) makes you less precise about the startup. This suggests the agent is ignoring the value of information.
  *   **Decision Paralysis:** As you noted, your friend now refuses wagers she previously endorsed. If this happens often, the agent becomes "paralyzed," unable to make decisions that their prior self would have found rational. This violates dynamic consistency principles.
  *   **Non-Conglomerability:** Dilation implies the credal set is not conglomerable. For many mathematicians, non-conglomerability is a sign that the probability model is ill-behaved.

  **The Feature View (The IP Defense)**
  Proponents (e.g., Peter Walley, James Joyce) argue dilation is an honest representation of ignorance.
  *   **Honesty about Dependence:** If you truly do not know whether the evidence is relevant (positive correlation) or misleading (negative correlation), conditioning on that evidence *should* expose that uncertainty. To keep the interval narrow would be to pretend you know the correlation structure when you don't.
  *   **Avoiding False Precision:** A standard Bayesian is forced to pick a specific correlation coefficient to update. If they pick wrong, they become confidently incorrect. The IP agent admits, "Learning this fact reveals I don't know how to interpret it," and widens the interval to reflect that interpretive uncertainty.

  ### Boundaries and Edge Cases

  Since "Dilation" is the established term, I will not coin a new one, but I will delineate its boundaries to help you argue with your friend.

  **When Dilation Occurs:**
  1.  **Credal Sets:** The agent must use intervals/sets of probabilities, not point values.
  2.  **Uncertain Relevance:** The set must contain probability functions that disagree on the stochastic dependence between the Evidence ($E$) and Hypothesis ($H$).
  3.  **Marginal Stability:** The marginal probability of the Evidence $P(E)$ is usually stable across the set (e.g., everyone agrees the coin is fair), but the likelihoods $P(E|H)$ vary.

  **When Dilation Does *Not* Occur:**
  1.  **Epistemic Independence:** If your friend restricts her credal set to only include models where the coin and startup are **independent** (i.e., $P(S|H) = P(S)$ for all $P \in \mathcal{P}$), dilation cannot occur. The interval will remain exactly the same.
  2.  **Type-2 Updating:** Some IP theorists propose updating not just the probabilities, but the *weights* on the models (like a Bayesian mixture). If she downweights the "extreme correlation" models because they seem implausible after seeing the flip, the interval might not widen.
  3.  **Specific Evidence:** Dilation typically requires the evidence to come from a partition (Heads/Tails) where *every* outcome dilates. If she only dilates on Heads but sharpens on Tails, it is not strict dilation, just asymmetric updating.

  ### Advice for the Argument

  Your friend is technically consistent within the **Imprecise Probability** framework (specifically Walley's theory of lower previsions). She is not making a math error; she is adhering to a system that treats uncertainty about *correlations* as a source of risk.

  However, you can challenge her on the **decision-theoretic cost**. Ask her: *"If you knew beforehand that flipping this coin would widen your interval from [0.3, 0.6] to [0.2, 0.7], would you choose to flip it?"*
  *   If she says **No**, she admits the evidence has negative value, which contradicts the idea that information is good.
  *   If she says **Yes**, she must explain why she pays to become less decisive.

  Most IP theorists resolve this by arguing that dilation only occurs when the set of priors is too permissive (allowing wild correlations). A rational agent should restrict their credal set to exclude correlations that have no causal basis (e.g., a coin flip causally cannot affect a startup). If she admits there is no causal link, she should enforce **Epistemic Independence**, which eliminates dilation. If she refuses to do so, she is modeling "magical" correlations she explicitly denies believing in.
