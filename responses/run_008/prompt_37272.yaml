      *   *Postdiction/Integration Windows:* The Color Phi phenomenon relies on integration windows. If we find a hard physiological limit (e.g., a specific 100ms buffer that *must* elapse before awareness), does that imply a "stage"?
      *   *Unfalsifiability:* If *any* timing data can be reinterpreted as "just another draft," is the theory vacuous?
      *   *Alternative Models:* Integrated Information Theory (IIT) or Orch-OR posit specific structures/times. If their predictions hold and MDM's don't...
