      *   *Section 3: The Unfalsifiability Charge.* This is crucial. Address the "just more drafts" move. Is it a virtue (dissolving the problem) or a vice (immunizing the theory)? Compare to psychoanalysis.
      *   *Section 4: How a Dennettian Responds.* They won't concede easily. They will reframe the data. To defeat them, you need to force a distinction they refuse to make (e.g., "functional access" vs. "phenomenal experience").
