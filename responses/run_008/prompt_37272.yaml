          *   *Example:* If the "cutaneous rabbit" effect can be broken by a specific manipulation that proves the first tap was *definitely* felt before the second was processed.
          *   *MDM Response:* "Your manipulation just changed the content of the draft."

      *   *Category 3: Unfalsifiability (Philosophical Fatal)*
          *   If the theory explains *everything* by redefining terms, it explains nothing. If "consciousness" is just "whatever the brain says it is," the theory loses explanatory power.
          *   *MDM Response:* "That's the point. You're asking the wrong question." (This is the "deep insight vs. dodge" tension).

      *   *Category 4: The "Zombie" Timing (Awkward)*
          *   If we find blindsight patients who have accurate timing discrimination without reportable consciousness, it suggests timing is a separate module from "consciousness." MDM says they are intertwined.

