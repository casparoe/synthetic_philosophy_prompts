  2.  **Deconstruct the Multiple Drafts Model (MDM) & Timing Claim:**
      *   *Core Tenet:* No Cartesian Theater. Consciousness is not a single point in space/time where things "happen." It's a distributed process of content fixation.
      *   *Timing Claim:* The subjective timing of an event is itself a representation constructed by the brain. There is no "real time" of consciousness independent of these representations.
      *   *Orwellian vs. Stalinesque:* Orwellian = memory altered after the fact. Stalinesque = perception altered before entering consciousness. Dennett says the distinction is illusory because there's no "moment of consciousness" to anchor the difference.

  3.  **Brainstorm Potential Defeaters:**
      *   *Neural Correlates of Consciousness (NCC):* If we find a specific, localized neural signature that *necessarily* precedes reportability and correlates perfectly with subjective timing, does that restore the Theater?
