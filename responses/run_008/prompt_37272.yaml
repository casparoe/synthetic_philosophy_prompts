      *   *Section 1: The Empirical Defeaters (The "Orwellian/Stalinesque" Anchor).* Focus on finding a physical "line of completion." If we can pinpoint a neural event $N$ such that Stimulus $S$ causes $N$, and Report $R$ follows $N$, and $N$ is *necessary* for experience, MDM is in trouble. Mention Global Neuronal Workspace (GNW) as the rival.
