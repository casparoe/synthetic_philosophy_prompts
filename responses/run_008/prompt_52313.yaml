answer: |-
  Here is a design for a ninety-minute session called **"The Twelve Badges."** It is built to let the group walk into the boundary problem themselves, rather than being told about it. It uses the physical constraints of the room and a limited number of voting tokens to force the question of "who counts" without you having to lecture.

  ### Game Overview
  *   **Title:** The Twelve Badges
  *   **Time:** 90 Minutes (Strictly timed)
  *   **Participants:** 18 Adults
  *   **Stakes:** The group votes on the refreshments for the *next* month's meeting (e.g., Premium Tea vs. Standard Coffee; Biscuits vs. Fruit). This is real, but low-cost.
  *   **Core Mechanic:** In Round 1, everyone votes. In Round 2, a small sub-group decides the rules for who is allowed to vote, constrained by a scarcity of voting tokens. In Round 3, the new rules are enforced, disenfranchising some participants.

  ### Materials Needed
  1.  **Voting Badges:** 12 distinct items (lanyards, colored stickers, or simply 12 specific chairs).
  2.  **Ballot Papers:** Two colors (e.g., White for Round 1, Yellow for Round 3).
  3.  **Flipchart & Markers.**
  4.  **Timer:** Visible to all.
  5.  **Refreshment Menu:** Two clear options for the next month.

  ---

  ### Run Sheet (90 Minutes)

  #### 1. Introduction & Round 1: The Honeymoon (20 Minutes)
  *   **Setup:** Arrange tables in one large circle or three mixed tables. Ensure everyone has a seat.
  *   **Script:** "We need to decide the refreshments for next month. We have two options: [Option A] or [Option B]. Let's vote. Everyone takes a white ballot paper."
  *   **Action:** Collect votes, count them publicly, announce the winner.
  *   **Purpose:** Establish a baseline of *universal suffrage*. Everyone feels equal. Everyone assumes this is how the group works.

  #### 2. The Constraint & The Committee (15 Minutes)
  *   **Script:** "The Community Centre management has noted we spend too much time voting. For future efficiency, we are moving to a 'Registered Voter' system. We have 12 Voting Badges available for this group. We need a rule for who gets them."
  *   **Selection:** Randomly select 5 people (draw names from a hat) to form the **"Charter Committee."**
      *   *Note:* You (the facilitator) are not on this committee.
  *   **Task:** The Committee moves to a separate table (visible but apart). They have 10 minutes to write **one objective rule** for distributing the 12 Badges among the 18 people present.
      *   *Constraint:* The rule must be verifiable instantly (e.g., "People wearing glasses," "People who arrived before 9:30," "People at Table 1," "People who voted for Option A").
      *   *Constraint:* They must distribute exactly 12 Badges. 6 people will not get one.
  *   **The Rest of the Room:** While the Committee works, the other 13 participants wait. They can talk but cannot make decisions.

  #### 3. The Revelation & Round 2: The Exclusion (25 Minutes)
  *   **Action:** Committee returns. They read the Rule. They distribute the 12 Badges according to their rule.
  *   **The Shift:** Physically separate the room.
      *   **Insiders (12):** Wear badges. Sit at the main tables.
      *   **Outsiders (6):** No badges. Asked to move to a "Observation Zone" (chairs against the wall or a separate table). They can watch but not speak or vote.
  *   **Script:** "We must vote on the refreshments again to ratify the new system. Only Badge-holders may vote."
  *   **Action:** Insiders vote on the *same* refreshment options (or a slight variation). Outsiders watch.
  *   **The Lock:** Announce that under the new system, only Badge-holders can vote on *changing the Rule* for badges next time.

  #### 4. The Debrief (30 Minutes)
  *   **Crucial:** Do not start the debrief until the "Outsiders" are physically back in the main circle.
  *   **Method:** Do not lecture. Ask the following questions in order. Write key words on the flipchart.

  ---

  ### The Debrief Guide
  *Map these questions to the philosophical problems you identified.*

  **1. The Moment of the Real Decision (10 mins)**
  *   *Ask the Insiders:* "When did the result of Round 2 actually get decided? Was it when you cast your yellow ballot, or earlier?"
  *   *Ask the Outsiders:* "At what point did you lose the ability to change the outcome?"
  *   **Mapping:** This highlights your core insight: **The decision on *who counts* is more important than the decision on *what counts*.** The real vote happened in the Committee phase, not the ballot phase.

  **2. The Arbitrariness of the Line (10 mins)**
  *   *Ask the Committee:* "Why did you choose that specific rule? Was it fair?"
  *   *Ask the Group:* "If they had chosen [Alternative Rule], who would be sitting in the Observation Zone right now?"
  *   **Mapping:** This exposes **Rule 3 (Competence/Characteristics)**. Any line drawn is somewhat arbitrary. If the rule was "People wearing blue," it feels absurd. If the rule is "Homeowners," it feels legal, but the mechanism is identical.

  **3. The Lock-In Effect (10 mins)**
  *   *Ask Everyone:* "If we wanted to change the Badge Rule next week, who gets to vote on that?" (Answer: Only the 12 Insiders).
  *   *Ask:* "Is it possible for the 6 Outsiders to ever get the vote back under the current rules?"
  *   **Mapping:** This exposes the **Self-Perpetuating Nature of Boundaries**. The group that defines the membership has no incentive to expand it. This mirrors your "Owners vs. Tenants" example.

  ---

  ### Predictable Failures (Be Ready for These)

  **1. The Moral Revolt**
  *   **What happens:** The Insiders may refuse to vote while the Outsiders are excluded. They might say, "This isn't right, let them vote."
  *   **Your Move:** Do not override them. Say: "If you vote to include them, you are using your Insider power to change the rule. But remember, next time, the rule might be written by people who don't want to include you."
  *   **Lesson:** This is a *good* failure. It shows that boundaries rely on the consent of the included, which is fragile.

  **2. The Committee Paralysis**
  *   **What happens:** The 5 Committee members cannot agree on a rule and run out of time.
  *   **Your Move:** Have a default rule in your pocket (e.g., "First 12 people to arrive"). Enforce it sternly.
  *   **Lesson:** This demonstrates that *indecision* is also a decision. If the group doesn't draw the line, the facilitator (or history, or force) will draw it for them.

  **3. Anger at the Committee**
  *   **What happens:** The 6 Outsiders feel personally betrayed by the 5 Committee members.
  *   **Your Move:** In the debrief, shift the blame from the *people* to the *task*. "The Committee wasn't asked to be cruel; they were asked to solve a constraint with 12 badges. Would *you* have found a fairer rule?"
  *   **Lesson:** This prevents interpersonal feuds and focuses on the structural problem. The "villain" is the scarcity of badges (resources/power), not the neighbors.

  ---

  ### Limitations of the Game
  *Be blunt about these in your closing remarks so you don't overclaim.*

  1.  **No History:** In the game, the boundary was drawn in 10 minutes. In reality (like your Owners Association), boundaries are drawn over decades. People accept them because "that's how it's always been." The game cannot simulate the weight of tradition.
  2.  **No Exit:** In the game, the Outsiders stay in the room. In reality, excluded people often leave (move house, stop participating). The game keeps the tension visible; reality often hides it by making the excluded invisible.
  3.  **No Coercion:** If the Outsiders in the game refuse to leave the voting tables, you (the facilitator) won't physically remove them. In the real world, the state or police enforce the boundary. The game lacks the threat of force that underpins the "Right to Rule."
  4.  **The "All Affected" Problem:** The game simulates "All Subject to Coercion" (everyone is in the room). It does not fully simulate "All Affected" (the shopkeeper downstairs). You cannot easily bring an outsider into the room to represent the outside world.

  ### Bias Check (Honesty Clause)
  You asked me to tell you if the game favours one of your four rules.

  **Yes, it does.**
  The game is structurally biased against **Rule 1 (Everyone Affected)** and **Rule 4 (Consent)**.
  *   By introducing a scarcity constraint (12 badges), the game forces a **Restrictive Boundary**. It makes an open boundary impossible by design.
  *   It implicitly argues that *some* exclusion is inevitable if decisions are to be made efficiently.
  *   It favours **Rule 2 (Coercion/Compliance)** because the "Insiders" are the ones physically present and compelled to stay in the room, while the "Outsiders" are treated as optional.

  **Why this is acceptable:**
  This bias matches your experience. You noted that Rule 1 leads to "the entire planet votes on where our bins go." The game validates your intuition that a boundary *must* exist, while demonstrating that the *location* of that boundary is political, not natural. It does not solve the problem (no game can), but it proves your hypothesis: **The boundary is the decision.**

  ### Final Advice for the Facilitator
  You mentioned you work in insurance claims. Use that. When the Committee is struggling, tell them: *"Assess the risk. If you give a badge to the wrong person, what happens?"* This will trigger their real-world instincts about risk management, which is exactly how boundaries are drawn in the real world (not by philosophy, but by risk).

  When the session ends, do not offer a solution. Offer only the question: *"We have to meet again next Saturday. Who should I call?"* Let that question hang in the air as they leave.
