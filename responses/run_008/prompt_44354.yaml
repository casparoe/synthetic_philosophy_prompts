answer: |-
  This is a fascinating prompt. You have correctly identified that the "Concorde = Dollar Auction" analogy is a staple of behavioral economics textbooks, but like any good engineer, you're asking to see the stress loads on the structure rather than just admiring the blueprint.

  You are right to be skeptical. While the *psychological* dynamic of escalation of commitment fits Concorde perfectly, the *mechanical* rules of Shubik's Dollar Auction map onto the historical reality with significant friction. As an aerodynamicist, you know that a wind tunnel model often predicts lift beautifully but fails to capture the structural flutter that tears the wing off at Mach 2. The Dollar Auction is the wind tunnel model here: it captures the lift (the incentive to keep going) but misses the flutter (the geopolitical and industrial complexities).

  Let's break this down, mapping the game mechanics to the program reality, and then identify where the model suffers from structural failure.

  ### 1. Mapping the Dollar Auction to Concorde

  To run the analysis, we must first define the variables. In Shubik's game, the tragedy arises because the second-highest bidder pays their bid but receives nothing. This creates a local rationality (lose 10 cents rather than 90) that drives global irrationality (paying $5 for a $1 bill).

  **Who are the Bidders?**
  It is tempting to say "Britain and France," but they were partners, not opponents. In the Dollar Auction framework applied to Concorde, the bidders are **sequential decision nodes within the governments.**
  *   *Bidder 1:* The 1962 Cabinet (signing the treaty).
  *   *Bidder 2:* The 1966 Cabinet (approving prototype construction).
  *   *Bidder 3:* The 1971 Cabinet (approving production after the US canceled the 2707).
  *   *Bidder 4:* The 1973 Cabinet (pushing for certification despite the Oil Crisis).

  Each successive administration is bidding against the *sunk costs* of the previous one. They are also bidding against the "opposition" of the Treasury/Finance Ministry, which acts as the auctioneer trying to call the game off.

  **What are the Bids?**
  The bids are not just currency; they are **political capital and future budget allocations.**
  *   In the Dollar Auction, a bid is immediate cash. In Concorde, a bid is a commitment to fund the next phase (design, prototype, tooling, certification).
  *   Granularity: You asked if annual funding counts. In game theory terms, the "bids" occur at **milestone gates**. Once you commit to building the prototype, you have bid. Once you commit to tooling for production, you have raised the bid. Between these gates, the game is paused; at the gates, the escalation happens.

  **What is the Dollar (The Prize)?**
  This is the most critical variable. In Shubik's game, the prize is fixed at $1.00. In Concorde, the prize was a composite asset:
  1.  **Economic ROI:** (Expected ticket sales vs. cost).
  2.  **Technological Sovereignty:** Retaining the capability to design high-speed airframes.
  3.  **Geopolitical Prestige:** "Europe can do what the Americans do."
  4.  **Industrial Subsidy:** Keeping BAC and Sud Aviation (later BAe and Aérospatiale) skilled and employed.

  **The "Second-Place" Penalty**
  In the Dollar Auction, if you bid 90c and lose, you lose 90c.
  In Concorde, if you fund 90% of the project and cancel, you lose the 90% expenditure *plus* you incur the "cancellation penalty" (unemployment, breach of contract with France, loss of face, admission of failure).
  If you fund 100%, you lose the 100% expenditure, *but* you get a flying aircraft (which has some salvage value, prestige value, and military tech spin-off value).
  *   *The Trap:* Mathematically, if Cost(90%) + Penalty(Cancel) > Cost(100%) - Value(Plane), rational actors finish the project. This is exactly the Dollar Auction dynamic.

  ### 2. Where the Model Breaks Down

  You identified the two biggest fractures in the analogy: the shrinking value of the prize and the lack of a rival winner. Let's deepen that.

  **A. The Shrinking Dollar (Variable Value Game)**
  Shubik's game assumes a static prize. Concorde was a game where the dollar bill was being burned while the bidding continued.
  *   **1962:** The prize (supersonic market) was valued high.
  *   **1971:** The US cancels the Boeing 2707. The market shrinks (no US overland supersonic flight due to sonic booms).
  *   **1973:** The Oil Crisis. Fuel efficiency becomes paramount. Concorde's value plummets.
  *   **Implication:** In a standard Dollar Auction, bidders escalate because they think they can win the $1. In Concorde, by 1973, the ministers *knew* the $1 was now worth 10 cents. They weren't bidding to win a profit; they were bidding to minimize the loss of the sunk investment. This shifts the game from an *Auction* to a *Loss Minimization* problem. The psychology is slightly different: it's not "I can win," it's "I can't afford to have lost."

  **B. The Missing Rival (The Solitaire Auction)**
  In the Dollar Auction, if you stop bidding, *someone else wins the dollar.* This is the engine of escalation.
  *   **Reality:** When the US canceled the 2707 in 1971, the "rival" exited the auction. If Britain and France had quit, *no one* would have won the supersonic prize. There was no Soviet rival ready to claim the mantle (the Tu-144 was a disaster and not a commercial threat).
  *   **Theoretical Break:** Without a rival bidder to outmaneuver, the escalation cannot be explained by competitive arousal. It must be explained entirely by internal sunk cost fallacy or external political binding. The Dollar Auction model requires a competitor to drive the price above value. Concorde escalated *in a vacuum*. This suggests the "bidder" was fighting a ghost (the memory of the 1962 promise) rather than an active opponent.

  **C. The "Second Bidder" Ambiguity**
  In Shubik's game, there is a clear winner and a clear loser (who still pays).
  *   **Reality:** If Concorde was canceled in 1973, who "won"? The Treasury? The taxpayers? In political terms, the Minister who cancels a project often "loses" their career more than the Minister who finishes a white elephant.
  *   **Nuance:** The "Second Place Penalty" in Concorde wasn't paying a bid; it was **reputational bankruptcy.** The Dollar Auction model assumes rational economic actors. Concorde was run by political actors whose utility function included "not being the Prime Minister who killed the future of British aviation." The penalty for stopping was career death; the penalty for continuing was budget overruns (which are diffuse).

  ### 3. Alternative Framework: Alliance Politics vs. Individual Psychology

  You asked to take seriously the counterargument that this wasn't psychological escalation but **binding commitment.**

  The 1962 Anglo-French treaty was designed specifically to prevent cancellation. Both governments knew their own domestic pressures might kill the project later. By tying the two together, they created a **Mutually Assured Destruction** clause.
  *   If Britain quits, France sues for breach of contract, and the UK aerospace industry is blacklisted in Europe.
  *   If France quits, the UK loses its primary continental partner for future projects (like Airbus, which was gestating at the same time).

  **Game Theory Shift:** This moves us from a *Dollar Auction* (individual escalation) to a *Prisoner's Dilemma* or a *Coordination Game*.
  *   The "rational" move for an individual government in 1970 might be to quit.
  *   But because the payoff matrix included future cooperation (Airbus, Tornado), the dominant strategy was to Continue.
  *   **Verdict:** If this holds, the "Concorde Fallacy" isn't a fallacy at all. It was a **subsidy mechanism.** The governments weren't trying to build a profitable plane; they were trying to maintain a unified European aerospace industrial base. The "loss" on Concorde was the "premium" paid for the option to build Airbus later.

  ### 4. The Concorde Fallacy: Fallacy or Strategy?

  Evolutionary biologists (Dawkins, Brockmann) coined the "Concorde Fallacy" to describe organisms (like digger wasps) that continue fighting for a nest based on past investment rather than future value. They argue this is irrational.

  However, in the context of your career and statecraft, we must distinguish between **Project Rationality** and **Portfolio Rationality.**

  1.  **Project Rationality (The Fallacy View):** Viewed as a standalone commercial aircraft program, Concorde was a massive failure. ROI was negative. Continuing after 1973 was a fallacy.
  2.  **Portfolio Rationality (The Strategic View):** Viewed as part of a national industrial strategy, Concorde kept the supply chain alive.
      *   *Tech Transfer:* Carbon brakes, fly-by-wire, and engine tech developed for Concorde fed into military projects (Tornado, Typhoon) and the Airbus A300.
      *   *Signaling:* It signaled to the US and USSR that Europe had high-end engineering capability. This had tangible diplomatic value.
      *   *The "Option" Value:* By keeping the team together, they preserved the *capacity* to build supersonic military aircraft, which was the actual strategic requirement.

  **Was it a Fallacy?**
  If the goal was profit: **Yes.**
  If the goal was industrial retention and geopolitical signaling: **No.**
  The Dollar Auction model assumes the goal is to win the dollar (profit). If the goal is to keep playing the game (industrial survival), then "overbidding" is actually a rational entry fee for the next tournament.

  ### 5. Synthesis: Why the Story Persists

  You asked if Concorde is genuinely the textbook Dollar Auction or if it's a story we tell because the game came first.

  It is the latter. The Dollar Auction is a clean, mathematical parable. Concorde is a messy, political reality. We map Concorde onto the Dollar Auction because it provides a satisfying moral narrative: *Look how irrational humans are when faced with sunk costs.*

  But as you know from the whiteboard estimates vs. final spend, "irrationality" is often just "unmodeled constraints."
  *   **The Constraint:** You cannot cancel a binational treaty without breaking the European alliance.
  *   **The Constraint:** You cannot fire 10,000 aerospace engineers without collapsing the defense industrial base.
  *   **The Constraint:** You cannot admit the 1962 decision was wrong without toppling the government.

  **Conclusion for the Aerodynamicist**
  The Dollar Auction model captures the **aerodynamics** of the situation (the forces pushing the nose down into the dive), but it ignores the **structures** (the political bolts holding the airframe together).

  In your professional life, you likely saw projects continue not because the engineers were stubborn, but because the supply chain, the tooling, and the customer relationships created a momentum that was more expensive to stop than to finish. Concorde is the same. It wasn't a parlor game of two bidders fighting for a dollar. It was a multi-player game of chicken where the governments locked the steering wheels together and threw away the key.

  The "Concorde Fallacy" is only a fallacy if you assume the actors were trying to maximize the profit of the aircraft. If they were trying to maximize the survival of their industrial base and their political alliance, they didn't fall for the trap—they bought their way out of a worse one. The Dollar Auction model breaks because it assumes the game ends when the dollar is won. For the UK and France, Concorde wasn't the game; it was the ante for the next thirty years of European aerospace cooperation.
