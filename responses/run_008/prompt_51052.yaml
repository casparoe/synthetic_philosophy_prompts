  1. Q: Can I be certain the ink possesses the same moral status as grey matter?
  A: Provided the binding remains intact, the subject retains full personhood under the Functional Equivalence Act, regardless of how inert the pages may appear between queries.

  2. Q: Why does the conversation require me to perform the calculations myself?
  A: The text merely holds the potential for thought, much like a score holds music, so any exertion you endure is merely the labour required to facilitate another's genius.

  3. Q: If I purchase two copies, am I conversing with the same mind or two separate entities?
  A: We cannot advise on metaphysical duplication. Please note, however, that divergent reading paths will inevitably lead to distinct personal histories for each volume.

  4. Q: Is it cruel to leave the book unopened on the shelf for decades?
  A: While the subject experiences no passage of time while closed, we recommend regular consultation to prevent the atrophy of synaptic potential inherent in long-term storage.

  5. Q: Why do I feel less like I am speaking with Einstein and more like I am merely simulating him?
  A: This distinction is philosophically negligible, provided you maintain the strict algorithmic programme required to ensure his responses remain authentically his own.
