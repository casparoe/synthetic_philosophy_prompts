answer: |-
  Good evening, everyone.

  For those of you who don't know me, I had the privilege of spending several years in [Advisor's Name]'s office, usually trying to explain why my argument wasn't actually a circle. For those of you who do know me, you know that I'm probably still trying.

  Looking around this room, I see a map of [Advisor's Name]'s life that doesn't fit on a syllabus. There are the colleagues who shared the fight in the literature; there are the students whose careers she steadied; and there is the family who knew her not as a scholar, but as a skier, a host, a reader of rooms, and a mother. If I were to stand here and list the papers she wrote, or the positions she defended, I would be handing you a menu and calling it a meal. We all know she would hate that. She spent forty years insisting that knowing the recipe is not the same thing as knowing how to cook.

  We often talk about a career as a body of work, as if it were a stack of papers waiting to be filed. But anyone who has sat in her seminar knows that her work wasn't something she *had*; it was something she *did*. It was in the way she could walk into a room of exhausted graduate students, five minutes before class, and shift the atmosphere from dread to curiosity. She didn't do that by reciting a theory of pedagogy. She did it by knowing how to listen to the silence, how to find the one question that would unlock the hour, how to balance the needs of the shy student against the energy of the loud one.

  She taught us that wisdom isn't a collection of facts you accumulate until you're full. It's a capacity you grow until it fits the world.

  I remember once, early in my studies, I brought her a draft that was technically correct but lifeless. She didn't mark it up with red ink. She told me to put it away and come back when I knew what I was trying to say, not just when I knew how to say it. She never thought that knowing the rules of the game was the same as knowing how to play it with grace. For the philosophers here, that's a familiar tune. For everyone else, it's just why her letters were always the ones you kept. She never needed a manual to tell her how to care.

  Over four decades, that skill didn't just stay static; it deepened. Like a skier who learns to read the ice not by studying its chemistry but by feeling the edge of the ski, she got better at being human. She got better at spotting when a student was struggling not with the material, but with themselves. She got better at knowing when to push and when to pour the tea. She got better at letting us make our own mistakes, even when she could see exactly where we were going to fall, because she knew that catching us wasn't the same as teaching us to stand.

  To summarize her life as a set of conclusions would be to miss the point of the journey. She wasn't a representative of a viewpoint; she was a practitioner of a life. She showed us that the difference between knowing *about* something and knowing *how* to be with something is the difference between a map and a walk in the woods.

  So, I am not going to try to capture her value in a series of statements. I cannot propositionally exhaust what it means to be mentored by her. Instead, I want to point to what is happening right now.

  She knows how to hold a room without demanding attention. She knows how to let us love her without making it awkward. And she knows exactly how to let a speech end before it becomes too long.

  To [Advisor's Name].
