      *   *Claim 13:* "...which is why Keynes, in his Treatise on Probability, defended the unrestricted principle: equal probabilities go to equally possible alternatives, which he regarded as the foundation of the whole theory."
          *   **Status:** **Major Historical/Philosophical Error.**
