          *   **Contradiction:** The student says PI needs care/restriction (Claim 10) but then says Keynes defended the *unrestricted* principle (Claim 13).
          *   **Accuracy:** Keynes is famous for trying to *save* PI by adding conditions (relevance, symmetry of evidence), effectively admitting it is not unrestricted. To say he defended the *unrestricted* principle is historically inaccurate.

