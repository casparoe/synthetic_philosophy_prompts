answer: |-
  Dana's decision-making framework is not the standard economic model of ignoring sunk costs, nor is it purely emotional. It is a heuristic of **Narrative Integrity**. She permits sunk costs to dictate future action only when abandoning the project would retroactively convert past sacrifice from an *investment* into a *waste*, and that conversion would inflict a specific psychological or moral injury to the agent's self-concept or relational duties.

  In her standard rulings (the novel, the relationship, the stadium, the play), the activity is consumptive or transactional. Reading the last 150 pages of a dull book does not redeem the boredom of the first 750; it merely adds more boredom. Staying in a mediocre relationship does not validate the past nine years; it merely extends the mediocrity. In these cases, the past is gone regardless of the future choice.

  However, in her exception rulings (the certification, the cannoli shop), completion acts as a *keystone* that holds the arch of the past together. For the certification, the eight years of study are only "education" if the credential is earned; otherwise, they are "wasted time." For the cannoli shop, the shop is the physical monument to her father's life; closing it declares his life's work a failure. In both exceptions, quitting imposes a cost greater than the economic loss of continuing: the cost of admitting that a significant chapter of one's life (or a loved one's) was meaningless.

  Based on this reconstruction, here is the analysis of your three new cases.

  **Case 1: Your Startup**
  *   **Closest Analog:** The **Stadium** (Concorde fallacy) and the **Relationship**.
  *   **Analysis:** Like the stadium, this is a commercial venture where the central hypothesis—the structural integrity of the project—is dead. Unlike the cannoli shop, the "sacrifice" here is not a sacred family legacy but a commercial gamble. Unlike the certification, continuing does not validate the past six years if the core premise is false; it merely extends the loss. Crucially, you mention your "team's faith." In the cannoli case, keeping the shop honored the *dead*. In your case, continuing would potentially mislead the *living*. Dana values truth in decision science; leading a team based on a hypothesis you know is dead violates integrity more than winding down does. Winding down admits a failed experiment (valid data); continuing creates a zombie company (invalid data).
  *   **Prediction:** **Irrational.** She will view continuing as a classic sunk-cost fallacy because the "narrative" of the startup is already broken by the dead hypothesis.

  **Case 2: Neighbor Ruth's Saga**
  *   **Closest Analog:** The **Dull Novel**.
  *   **Analysis:** This is the critical test of the "Identity" component of Dana's rule. In the certification case, Dana finished because she needed to know she was the kind of person who finishes. Ruth, however, has "stopped thinking of herself as a writer." The identity link is severed. If Ruth finishes, she is not redeeming her identity as a writer; she is performing a chore. Furthermore, with no readers and no pleasure, there is no external legacy (like the cannoli shop) to honor. The past 19 years are sunk, and finishing the last two years cannot retroactively make them meaningful because the agent herself has disowned the role that would give them meaning.
  *   **Prediction:** **Irrational.** Without the identity claim ("I am a writer"), the "Narrative Integrity" rule does not trigger.

  **Case 3: Friend Marcus's Trilogy**
  *   **Closest Analog:** The **Certification Exams**.
  *   **Analysis:** Marcus has a public promise and an audience (fans/publisher). This creates a duty of integrity similar to Dana's certification. Quitting would not only waste the effort of the first two books but would publicly mark him as someone who breaks promises to his community. The "drudgery" is the cost of maintaining professional integrity. Unlike Ruth, Marcus is still an author in the eyes of the world; unlike you, his "hypothesis" (the story) is not dead, only the joy in telling it. Finishing validates the previous books as part of a complete work rather than abandoned fragments.
  *   **Prediction:** **Rational.** The cost of continuing (drudgery) is less than the cost to his narrative integrity and public reputation (breaking a promise).

  **The Discriminating Case**
  To distinguish between the **Backward-Looking Rule** (honor the past sacrifice regardless of current self) and the **Identity Rule** (honor the current self-concept), you need a scenario where the past demands completion, but the present self rejects it.

  Pose this case over turkey: *"Imagine a man who spent twenty years training to be a priest. One week before ordination, he loses his faith entirely. He knows he will be a miserable, hypocritical priest. If he quits, the twenty years of study and devotion were 'for nothing.' If he continues, he honors the sacrifice of the past two decades, but betrays his current conscience."*

  *   If Dana says **Continue**, she prioritizes the **Backward-Looking Rule**: The past sacrifice must be redeemed, even at the cost of current authenticity.
  *   If Dana says **Quit**, she prioritizes the **Identity Rule**: You cannot build a meaningful narrative on a lie about who you are now. (Given her ruling on the certification required *her* to know the truth about herself, I suspect she will say Quit, which confirms Identity is the true driver).

  Verdict: startup=irrational; saga=irrational; trilogy=rational
