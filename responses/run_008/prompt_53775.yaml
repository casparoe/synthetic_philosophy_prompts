          4.  Closing section (definite position on what would move the debate and what is not empirically tractable).
      *   **Tone:** Committed, not diplomatic. Make definite choices. Don't water down agreement or soften disagreement. Identify verbal disputes vs. substantive ones.
      *   **Format:** Numbered agreed claims -> Disagreements table -> Cruxes with predictions -> Closing section.

  2.  **Deconstruct the Positions:**
      *   **Declinist:** Focuses on per-capita rates of direct physical violence (war, homicide, atrocity). Sees a massive historical decline. Views this as morally significant progress.
      *   **Skeptic:** Focuses on absolute numbers, structural violence (famine, sanctions, economic arrangement), and the normative nature of defining "violence." Suspects the decline is an artifact of exclusionary definitions.
      *   **Common Ground:** Standard empirical estimates (e.g., Pinker, Goldstein, Eisner) are accepted as *data*, but not necessarily as *proof* of the thesis.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to find where they overlap without being trivial.
      *   *Empirical:* Direct physical violence per capita has likely decreased over the long run. State capacity has increased.
      *   *Concessions:* Declinist admits structural harm is excluded. Skeptic admits direct violence data isn't fabricated.
      *   *Moral:* Both care about reducing suffering.
      *   *Constraint:* "Committed, not diplomatic." Avoid "we agree to disagree." Instead, "We agree that X is true, though we weigh it differently."

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need specific points of contention.
      *   *Format:* Issue | Declinist Statement | Declinist Rationale | Skeptic Statement | Skeptic Rationale.
      *   *Key Disagreements:* The moral weight of per-capita vs. absolute; the definition of violence (direct vs. structural); the significance of state monopoly on violence (pacification vs. oppression).

  5.  **Drafting - Section 3: Cruxes:**
      *   *Instruction:* Take a stance on which sub-questions are load-bearing. Decide if per-capita vs. absolute is moral or rhetorical. Decide if a neutral definition is possible. Decide if the trend survives hostile definitions.
      *   *My Stance (as the drafter):* I need to act as the arbiter/drafter who makes "definite choices."
      *   *Crux 1: The Moral Arithmetic.* Is per-capita the right metric? I should frame this as a substantive moral disagreement, not just rhetorical.
      *   *Crux 2: The Definition of Violence.* Is there a core concept? I should argue that "direct physical infliction" is a stable core, but "structural violence" is a contested extension. The dispute is partly verbal but has substantive moral consequences.
      *   *Crux 3: Robustness of the Trend.* If we expand the definition, does the decline vanish? This is empirically tractable.
      *   *Predictions:* Need specific predictions for specific analyses.
          *   *Analysis:* Recalculating 20th-century mortality including colonial famines and sanctions.
          *   *Declinist Prediction:* Trend remains negative (decline) but slope flattens.
          *   *Skeptic Prediction:* Trend reverses or becomes indeterminate (increase/stasis).

  6.  **Drafting - Section 4: Closing Section:**
      *   *Instruction:* Definite position on what moves the debate and what is intractable.
      *   *My Stance:* The empirical trend of *direct* violence is settled. The moral weighting is not empirically tractable. The definition of violence is a political choice, not a scientific discovery.
      *   *Recommendation:* Stop asking "Is violence declining?" and start asking "Which forms of harm are we successfully mitigating, and which are we exacerbating?"

  7.  **Refining and Polishing:**
      *   *Tone Check:* Is it too soft? Ensure the Declinist sounds confident in the data, and the Skeptic sounds confident in the critique. Ensure the "Cruxes" section makes hard calls.
