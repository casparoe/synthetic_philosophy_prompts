      *   *Correction:* No, the prompt says they agree standard estimates are *roughly right*, but the Skeptic thinks what gets counted is the issue. So they agree on the *counts of the counted*, not necessarily the *counts of the real*. I need to be precise there.
      *   *Crux Selection:* The prompt suggests three specific potential cruxes. I need to select the real load-bearing ones. I will select: (1) The Metric (Per Capita vs. Absolute), (2) The Ontology (Direct vs. Structural), and (3) The Robustness (Trend survival).
      *   *Closing:* I need to be decisive. I will argue that the "Is violence declining?" question is fundamentally malformed because it conflates empirical trends with moral accounting.

  9.  **Final Review against constraints:**
