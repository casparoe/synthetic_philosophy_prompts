answer: |-
  # JOINT STATEMENT ON THE TRAJECTORY OF HUMAN VIOLENCE
  **Prepared for the Adversarial Collaboration of the Reading Group**
  **Date:** October 26, 2023
  **Parties:** The Declinist, The Skeptic

  ### I. AGREED CLAIMS

  1.  **Empirical Baseline:** Both parties accept the standard datasets regarding direct physical violence (battlefield deaths, homicide rates, execution rates) as accurate representations of *those specific categories* within the margins of historical error. We agree that per-capita rates of death by direct interpersonal and organized political violence are significantly lower in the early 21st century than in pre-state societies, medieval Europe, or the first half of the 20th century.
  2.  **State Capacity:** We agree that the consolidation of the Leviathan state correlates strongly with the reduction of decentralized, raiding, and feud-based violence. The monopoly on force reduces local homicide rates even if it centralizes the capacity for mass killing.
  3.  **Exclusion Acknowledgement:** The Declinist concedes that standard datasets (e.g., UCDP, Pinker's aggregates) systematically exclude deaths resulting from economic sanctions, preventable famine induced by policy, and structural mortality arising from economic arrangement. The Skeptic concedes that these exclusions are not necessarily the result of data fabrication, but of categorical boundaries established prior to data collection.
  4.  **Moral Stakes:** Both parties agree that the reduction of human suffering is a primary moral good. Neither party argues that violence is morally neutral; the dispute is strictly about the measurement of progress toward the reduction of suffering.
  5.  **Fragility of Progress:** Both parties agree that the observed decline in direct violence is not teleological or irreversible. Both acknowledge that nuclear escalation, ecological collapse, or state failure could reverse current trends rapidly.

  ### II. DISAGREEMENTS TABLE

  | Issue | Declinist Position | Declinist Rationale | Skeptic Position | Skeptic Rationale |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Moral Metric** | Per-capita rates are the morally decisive metric for assessing societal safety and progress. | Moral concern should track the risk faced by an individual human; a safer world for the average person is a moral improvement regardless of population size. | Absolute numbers and aggregate suffering are the morally decisive metrics. | A world with fewer killers but more dead bodies is not morally improved; total suffering matters more than individual risk probability. |
  | **The Ontology of Violence** | Violence is properly defined as the direct, intentional infliction of physical harm by an agent. | Without this narrow definition, "violence" becomes synonymous with "bad outcomes," rendering the term analytically useless for policy. | Violence includes structural and institutional harms that foreseeably shorten life or degrade agency, regardless of direct intent. | Distinguishing between shooting a civilian and starving them via policy is a moral distinction without a difference in outcome. |
  | **The Significance of the State** | The state is the primary engine of pacification; its growth explains the decline in violence. | The monopoly on force suppresses the natural entropy of tribal raiding and feud; order is a prerequisite for safety. | The state is a primary engine of规模化 (scaled) violence; its growth explains the capacity for atrocity. | Centralization does not eliminate violence; it industrializes it and masks structural killing as administration. |

  ### III. CRUXES AND LOAD-BEARING QUESTIONS

  We identify three load-bearing cruxes. We have determined that the dispute over **Definition (Ontology)** is partially verbal but masks a substantive moral disagreement. The dispute over **Metrics (Per Capita vs. Absolute)** is purely substantive and moral. The dispute over **Robustness (Trend Survival)** is empirically tractable.

  **Crux 1: The Robustness of the Trend Under Hostile Definitions**
  *Question:* If we expand the definition of violence to include "structural deaths" (famine, sanctions, preventable disease due to policy), does the long-run trend of decline remain intact, flatten, or reverse?
  *Status:* **Empirically Tractable.** This is not a matter of philosophy but of historical accounting.
  *Analysis:* A joint audit of 20th-century mortality, specifically comparing the 1940s, 1970s, and 2000s, adding estimated deaths from colonial famines, structural adjustment-induced mortality, and sanctions regimes to the standard battle-death counts.
  *   **Declinist Prediction:** The trend line will flatten, but the slope will remain negative. The efficiency of modern logistics and medicine will still show a net reduction in total preventable death rates compared to pre-modern eras.
  *   **Skeptic Prediction:** The trend line will reverse or become indeterminate. The 20th century will show a net increase in "total inflicted mortality" when structural violence is counted, driven by colonial extraction and neoliberal policy shocks.

  **Crux 2: The Moral Weight of Per-Capita vs. Absolute**
  *Question:* Is a world with 10 billion people and a 0.01% homicide rate morally superior to a world with 100 million people and a 0.1% homicide rate (assuming absolute deaths are higher in the first scenario)?
  *Status:* **Substantive Moral Disagreement.** This cannot be resolved by data.
  *Analysis:* A thought experiment regarding resource allocation. If Party A can reduce individual risk by 90% but increase total deaths by 10% due to population growth enabled by safety, and Party B can reduce total deaths by 10% but leave individual risk high, which policy is chosen?
  *   **Declinist Prediction:** We will choose Party A. The moral imperative is to secure the rights and safety of the living individual against predation.
  *   **Skeptic Prediction:** We will choose Party B. The moral imperative is to minimize the aggregate toll of suffering, regardless of the statistical risk profile.

  **Crux 3: The Neutrality of Definition**
  *Question:* Is there a "core concept" of violence that is neutral, or is the definition inherently normative?
  *Status:* **Verbal Dispute masking Moral Stance.** We agree there is no neutral arbiter.
  *Analysis:* Linguistic and legal audit of how "violence" is codified in international law versus social theory.
  *   **Declinist Prediction:** We will find that "direct physical harm" is the only definition stable enough for cross-historical comparison; broader definitions collapse into "all harm."
  *   **Skeptic Prediction:** We will find that "direct physical harm" is a legal convenience designed to exonerate states from liability for economic killing; the broader definition is more consistent with moral reality.

  ### IV. CLOSING ASSESSMENT AND PATH FORWARD

  This collaboration concludes that the question "Is violence declining?" is malformed. It conflates an empirical claim about *direct physical predation* with a moral claim about *the totality of human suffering*.

  **On Empirical Tractability:**
  The Declinist is empirically correct regarding *direct physical violence*. The data on homicide, battlefield death, and torture by direct agents shows a robust historical decline. No amount of structural analysis erases the fact that a medieval peasant was far more likely to be stabbed than a modern citizen. However, the Skeptic is morally correct that this empirical fact does not exhaust the category of "harm." The dispute is not about whether the numbers are real, but whether they are *comprehensive*.

  **On Verbal Disputes:**
  A significant portion of this debate is verbal. The Declinist uses "violence" to mean "direct physical aggression." The Skeptic uses "violence" to mean "avoidable harm imposed by power." These are not compatible definitions. We declare that future usage must distinguish between **Predatory Violence** (Declinist focus) and **Structural Mortality** (Skeptic focus). Conflating them produces confusion; separating them produces clarity.

  **On Intractability:**
  The disagreement over **Per-Capita vs. Absolute** (Crux 2) is not empirically tractable. It is a conflict of moral axioms. No dataset can prove whether individual safety is more valuable than aggregate survival. This portion of the debate must be moved from the realm of social science to the realm of political philosophy.

  **Final Recommendation:**
  We recommend abandoning the singular question "Is violence declining?" It invites the Declinist to cherry-pick direct violence data and the Skeptic to cherry-pick structural misery data. Instead, we propose a dual-track assessment:
  1.  **Track A:** Monitor Predatory Violence (homicide, war, direct atrocity). Here, the Declinist's thesis holds: progress is real and significant.
  2.  **Track B:** Monitor Structural Mortality (famine, sanctions, preventable disease, incarceration). Here, the Skeptic's thesis holds: progress is uneven, opaque, and potentially regressive.

  To ask if the world is "less violent" is to ask a question that demands a single answer where two are required. The world is less predatory, but not necessarily less cruel. We sign this statement acknowledging that peace is not merely the absence of war, but the presence of justice, and that measuring the former tells us nothing definitive about the latter.

  **Signed:**

  _________________________ (The Declinist)

  _________________________ (The Skeptic)
