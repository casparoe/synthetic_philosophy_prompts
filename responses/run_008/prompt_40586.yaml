          *   *EA Response:* Distinguish between *having a function* and *being functional*. Or use the "Modern History" view (Godfrey-Smith). Or argue biologists are speaking loosely/prospectively.
          *   *Severity:* Moderate. Can be patched, but requires nuance.

      *   **Plasticity/Co-option (Exaptation):** A trait is used for X now, but selected for Y. (e.g., feathers for flight vs. insulation). Transplanted heart.
          *   *EA Response:* Distinguish *proper function* (history) from *derived function* (current use). Millikan handles this well.
          *   *Severity:* Low. EA is actually *better* at distinguishing these than CRA.

      *   **Scope of Selection (Generalized Selection):** Immune system, neural darwinism, learning.
          *   *EA Response:* Generalize the selection mechanism (Godfrey-Smith's "Modern History" or "Generalized Selected Effects").
          *   *Severity:* Moderate to High. If you generalize too much, do you lose the normative bite?

  3.  **Evaluate the "Fatal" vs. "Awkward" Defeaters:**

      *   *Fatal:* Cases where normativity is clearly present but history is absent *and* cannot be plausibly reconstructed. (e.g., First-ever organism? First-ever mutation before reproduction?)
      *   *Awkward:* Biologists using "function" to mean "causal contribution" in physiology contexts. (This is a verbal dispute, not ontological).
