      *   **Addressing the "Repairs" (Unfalsifiability?):**
          *   *Modern History (Godfrey-Smith):* Doesn't make it unfalsifiable, but shifts the metric from "origin" to "recent maintenance." It saves the view from the Novelty problem but invites the Collapse worry.
          *   *Weakening Selection:* Risky. If *any* causal contribution counts as "selection," the normativity vanishes.
      *   **The Collapse Worry (EA vs. CRA):**
