      *   **Mapping the Defeaters (Ranked):**
          1.  *The "First Token" Problem (Fatal-ish):* The very first instance of a trait *cannot* have a function on strict EA. If biologists insist it does, EA conflicts with practice.
          2.  *The Collapse/Trivialization Worry (Structural):* If "selection" is watered down too much to fix Novelty/Scope, EA loses its distinctiveness from CRA.
