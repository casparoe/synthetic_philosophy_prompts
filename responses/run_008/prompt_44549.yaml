      *   *Qualification Problem:* User is right to reject this. Qualification is about "what could go wrong/prevent success" (e.g., potato in tailpipe). Frame is about "what else changes" (e.g., did moving the box move the floor?).

  4.  **Address the "One Problem or Two" Question (Pre-action vs. Post-action):**
