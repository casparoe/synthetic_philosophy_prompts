answer: |-
  The concept you are describing has a precise and established name in the philosophy of artificial intelligence and cognitive science: **The Frame Problem**.

  While the term is often used loosely in pop science to mean "robots can't think like humans," in technical discourse it refers exactly to the difficulty you have identified: **how to represent a dynamic world without having to explicitly state everything that does *not* change when an action occurs.**

  Here is a breakdown of the concept, its boundaries, and how it answers your specific questions about the pre/post-action distinction and the human/machine parallel.

  ### 1. The Name and Definition
  The term was coined by John McCarthy and Patrick Hayes in 1969. In formal logic, if you want a robot to understand that pushing a box moves the box, you must write a rule for that. The Frame Problem arises because, logically, you also seem to need to write rules stating that pushing the box *does not* move the walls, *does not* change the color of the box, *does not* alter the day of the week, and *does not* teleport the cat.

  Without these "frame axioms" (rules of non-change), a logical system cannot assume stability. With them, the system becomes bogged down by the sheer number of non-events it must process.

  Your engineers' "hand-written lists of what may safely be assumed to stay put" are literally **frame axioms**. When those lists fail (the rearranged office), it is a **frame violation**.

  ### 2. Why Your Rejected Labels Were Correct to Reject
  You were right to distrust the labels offered to you.

  *   **Selective Attention:** This is perceptual. It concerns what data enters the system from the sensors. The Frame Problem is *post-perceptual*. It concerns how the internal model of the world is updated after an action. A robot can "attend" to the wall color (see it) but still fail to solve the Frame Problem if it cannot logically infer that its action didn't change that color.
  *   **The Qualification Problem:** This is a sibling of the Frame Problem, but distinct. The Qualification Problem asks: *What preconditions must be met for an action to succeed?* (e.g., "The car will start, unless there is a potato in the tailpipe.") The Frame Problem asks: *What side effects occur after the action succeeds?* (e.g., "I started the car; did the garage door close?") Your journalists' examples are about side effects and stability, not preconditions.

  ### 3. Pre-Action vs. Post-Action: One Problem or Two?
  You asked whether deciding what to disregard *before* acting (relevance) and deciding what has gone stale *after* acting (persistence) are one problem or two.

  In the literature, these are often treated as **two faces of the same coin**, though they have different technical names.

  *   **The Post-Action Version (Persistence):** This is the classic logical Frame Problem. "I moved the block; is the block still red?" The challenge is **inferential inertia**. How do we assume facts persist without proving they do?
  *   **The Pre-Action Version (Relevance):** This is sometimes called the **Relevance Problem**. "I am moving the block; do I need to calculate the gravitational pull of Mars?" The challenge is **context bounding**.

  Most philosophers of AI (notably Daniel Dennett and Jerry Fodor) argue these are computationally distinct but philosophically identical. Both require the system to distinguish between **essential connections** and **accidental correlations** in the world.
  *   If you solve Persistence (you know what stays the same), you implicitly solve Relevance (you know what doesn't matter).
  *   If you solve Relevance (you know what matters), you implicitly solve Persistence (you know what to carry forward).

  For your reporting, you can accurately describe them as **the temporal boundaries of the frame**: what we carry from the past into the future, and what we leave out of the calculation.

  ### 4. Human vs. Machine: A Single Concept?
  Yes, this is a single concept covering both cases, though the *mechanism of failure* differs.

  *   **In Machines:** The Frame Problem is a **representational crisis**. The machine has no inherent sense of "common sense." It treats all logical propositions as equal weight unless told otherwise. The disaster officials you mentioned who assumed the levee would hold were treating a dynamic variable as a **static frame axiom**. They failed to update their "world model" when the context shifted from "normal weather" to "catastrophe."
  *   **In Humans:** The Frame Problem is a **cognitive heuristic**. Humans do not solve this logically; we solve it biologically and culturally. We have evolved "naive physics" that tells us desks don't change color when we leave the room. However, as your disaster example shows, human heuristics can become rigid. We suffer from **frame rigidity**—the inability to shrink or expand the frame when the situation demands it.

  The unifying concept is **Cognitive Economy in a Dynamic World**. Both humans and machines must economize on thought. They must assume stability to function, but that assumption creates brittleness when the world changes unexpectedly.

  ### 5. The Edges of the Concept
  To ensure you use the term precisely, here are the boundaries where the Frame Problem ends and other concepts begin:

  *   **It is not Uncertainty:** The Frame Problem is not about not *knowing* if the wall changed color (probability). It is about lacking a logical rule to *assume* it didn't (default logic).
  *   **It is not Bounded Rationality:** Bounded rationality is about limited processing power. The Frame Problem exists even for a god-like computer with infinite speed; it is a problem of *logic*, not just speed. (Though in practice, it manifests as a speed problem).
  *   **It is not Perception:** As noted, it is about belief update, not sensory input.
  *   **It is not Learning:** A system can "learn" new facts but still fail the Frame Problem if it doesn't know which old facts to keep.

  ### Summary for Your Reporting
  If you need a concise way to frame this in your article:

  > "The engineers are grappling with the **Frame Problem**: the logical difficulty of specifying what changes in a world without having to explicitly list everything that stays the same. It is the challenge of granting a machine 'common sense' inertia. While AI researchers worry about robots that over-think the stability of the walls, humans face the mirror image: the cognitive rigidity of assuming the levee will hold or the road will pass. In both cases, the failure is one of **context bounding**—the inability to correctly decide which parts of the world are safe to ignore."

  This terminology will signal to your technical sources that you understand the specific architectural constraint they are describing, distinguishing it from general issues of "intelligence" or "attention."
