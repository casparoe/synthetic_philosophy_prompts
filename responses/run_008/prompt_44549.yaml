          *   Need precise edges/boundaries of the concept.

  2.  **Identify the Core Concept:**
      *   The description screams **The Frame Problem**.
      *   *Origin:* McCarthy and Hayes (1969) in AI.
      *   *Definition:* How to represent a dynamic world without having to explicitly state everything that *doesn't* change when an action occurs.
      *   *Relevance to User's Examples:*
          *   Robot fetching item: Classic Frame Problem (inferring non-effects).
          *   Rearranged office: Failure of the "frame" (assumptions about stability).
