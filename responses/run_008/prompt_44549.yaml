      *   *Philosophical Consensus:* Most philosophers of AI (Dennett, Fodor, Pylyshyn) treat these as facets of the same underlying issue: **Relevance and Persistence**.
      *   *Distinction:*
          *   Pre-action: The *Relevance Problem* (often bundled into Frame).
          *   Post-action: The *Persistence Problem* (classic Frame).
      *   *Synthesis:* They are two sides of the same coin: bounding the context of change.

  5.  **Address the "Engineering vs. Human" Question:**
