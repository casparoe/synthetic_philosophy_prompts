          *   System failures: Delivery robot confused by rearranged office (assumed static); Scheduling software over-reacting to one shift swap (assumed dynamic/interconnected).
          *   Human examples: Disaster officials assuming levees/roads stay fixed (too much inertia); Journalist checking bag but not desk color (appropriate inertia).
      *   **Rejected Labels:**
          *   *Selective Attention:* Too focused on input processing, not belief update/action consequences.
          *   *Qualification Problem:* Focused on preconditions for success, not side effects or frame of reference.
      *   **Specific Questions:**
          *   Is there an established name?
