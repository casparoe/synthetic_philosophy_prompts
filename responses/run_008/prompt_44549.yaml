      *(Refining the Disaster Example)*: The disaster officials assuming the levee holds is a failure to *update* the frame. They treated a dynamic variable as a static frame axiom. This is the inverse of the robot that treated a static variable (office layout) as dynamic (re-mapping). Both are errors in classifying what belongs in the "frame" of stability.

      *(Final check on "One or Two Problems")*: Philosophers like Daniel Dennett argue it's one big problem of relevance. Logicians might separate inference of persistence from selection of preconditions. I will present the consensus view: it is one problem with two computational faces.

  9.  **Final Output Structure:**
