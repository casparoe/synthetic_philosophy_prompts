      *   *Scope/Nature of Self (Crucial Point):* Does it prove a *substance*? In *Meditation II*, Descartes is careful. He says "I am a thing that thinks." However, inferring a *persisting substance* or an *immaterial soul* immediately from the *cogito* alone is controversial and often considered a leap (the "Cartesian Circle" or category error issues). The *cogito* gives existence, but the *nature* as a distinct *substance* usually requires further argument (Real Distinction in Med VI). To say the *cogito by itself* proves immateriality is usually marked down as a conflation of Med II and Med VI.
      *   *Generalisation:* Can we say "Whatever thinks, exists"? Descartes is wary here. The certainty is indexical/first-personal ("I am, I exist"). Generalising to "All thinkers exist" or "Other minds exist" is not guaranteed by the *cogito* alone. It establishes *my* existence indubitably. Others' existence is inferred later (and less certainly).
