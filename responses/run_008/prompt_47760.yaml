answer: |-
  # Seminar Plan: The Road to Fanaticism
  **Topic:** Expected Value Maximization and Pascal's Mugging  
  **Time:** 90 Minutes  
  **Students:** 14 (Upper-level)  
  **Goal:** Students commit to linearity of value in low-stakes cases, then confront the absurd implications in high-stakes/low-probability cases, specifically distinguishing between objective risk and testimonial credence.

  ---

  ## I. Materials & Setup
  *   **Currency:** "Utilitons" (U). Printed on slips of paper or tracked on a whiteboard spreadsheet.
  *   **The Prize:** One high-value item (e.g., a very nice chocolate bar, a bottle of wine, or a "Skip One Reading" pass).
      *   *Mechanism:* At the end of class, a raffle is held. Each Utiliton = 1 ticket. (This linearizes utility for the game's duration).
  *   **Handouts:** 
      1.  **Decision Sheets:** Simple A/B choice forms.
      2.  **Mugger Cards:** Blank cards for the "Mugger" phase.
  *   **Props:** A deck of cards or a D20 die (for objective probability phases).
  *   **Room:** Whiteboard visible to all.

  ---

  ## II. Timeline & Flow

  ### 0:00 – 0:10 | Introduction & The Contract
  *   **Hook:** "Today we are investigating rational choice under uncertainty. We aren't reading papers. We are building a theory from the ground up based on your intuitions."
  *   **The Contract:** Explain the raffle system. "Your goal is to maximize your ticket count. The more tickets, the higher your chance of the prize. Rationality, for this hour, is defined as maximizing your expected tickets."
  *   **Facilitator Stance:** You are the **Scribe**, not the Sage. You record their principles; you do not judge them. *Crucial:* Do not mention Pascal, Mugging, or Fanaticism yet.

  ### 0:10 – 0:30 | Phase 1: The Calibration (Objective Probabilities)
  *   **Goal:** Lock them into Expected Value (EV) maximization using boring, intuitive gambles.
  *   **Mechanism:** Show two options on the board. Students vote privately on Decision Sheets, then reveal.
  *   **Round 1 (Obvious):**
      *   Option A: 100% chance of 10 U.
      *   Option B: 50% chance of 25 U, 50% chance of 0 U. (EV = 12.5)
      *   *Discussion:* Ask a student who chose B why. They will say "Higher average." Write **"Maximize Expected Value"** on the board. Ask if anyone chose A. If so, ask why. If they say "safety," challenge them: "But we agreed tickets = raffle chances. Safety doesn't matter, only total probability mass." *Press them until they agree EV is the rule.*
  *   **Round 2 (The Stretch):**
      *   Option A: 100% chance of 10 U.
      *   Option B: 10% chance of 120 U, 90% chance of 0 U. (EV = 12)
      *   *Discussion:* Most will still pick B. Reinforce the principle: "So, a 10% risk of nothing is acceptable for a 20% gain in EV?" Get verbal confirmation.
  *   **Round 3 (The Edge):**
      *   Option A: 100% chance of 10 U.
      *   Option B: 1% chance of 1,500 U, 99% chance of 0 U. (EV = 15)
      *   *Discussion:* Hesitation will appear. Some will switch to A.
      *   *Facilitator Trap:* Turn to the EV advocates from Round 1. "Sarah, you said we maximize EV. The math hasn't changed. Only the variance. Are you abandoning the principle, or is this still the rational choice?"
      *   *Desired Outcome:* The class consensus should solidify around: **"If the EV is higher, you take the gamble, regardless of probability size."** Write this in bold on the board. This is their **Commitment**.

  ### 0:30 – 0:55 | Phase 2: The Muggers (Testimonial Credence)
  *   **Goal:** Shift from objective dice probabilities to subjective credence in testimony. Force the distinction between *epistemic* doubt and *decision-theoretic* rejection.
  *   **Setup:** Select 3 students to be **Muggers**. They leave the room for 2 minutes to draft an offer.
  *   **Mugger Instructions:** 
      *   You must ask the Class Treasury (or individual students) for a small payment (e.g., 5 U).
      *   In exchange, you promise a massive payout (e.g., $10^{20}$ U).
      *   You cannot use dice. You must justify the probability of your payout with a **Story** (e.g., "I am an alien," "I have a time machine," "I know the lottery numbers").
      *   The Class must assign a probability to your story being true.
  *   **The Class Task:** The remaining 11 students are the **Skeptics**. They must evaluate the offer *using the Principle on the Board*.
  *   **The Interaction:**
      1.  Mugger presents story and ask (e.g., "Give me 5 U. I am a wizard. I will teleport $10^{50}$ U to you tomorrow. Probability is low, but EV is infinite.").
      2.  Skeptics discuss. They will likely want to reject it.
      3.  *Facilitator Intervention:* "Wait. Look at the Board. You committed to maximizing EV. If the payout is $10^{50}$, how low does the probability have to be for the EV to drop below 5 U?"
      4.  *The Distinction:* Students will say, "The probability is effectively zero."
      5.  *Facilitator Push:* "Is it zero because the math is wrong (Decision Theory), or because you don't believe the story (Epistemology)? If I prove to you the story is 0.0000001% likely, do you *have* to pay?"
  *   **Repeat:** Allow 2 more Muggers with different stories (one sci-fi, one metaphysical).
  *   **The Climax:** Ask for a final vote. "Based *strictly* on the principle we established in Phase 1 (Maximize EV regardless of probability size), who must accept the Mugger's deal?"
      *   If they accept: They are Fanatics.
      *   If they reject: They must cross out the Principle on the board. Ask them to write the *exception* clause. (e.g., "Unless the probability is too small" or "Unless the stake is too big").

  ### 0:55 – 1:15 | Phase 3: The Debrief (Mapping the Trap)
  *   **Step 1: The Reveal.** Announce the topic: "You have just reconstructed Pascal's Mugging and the problem of Fanaticism in Decision Theory."
  *   **Step 2: Map the Stages.**
      *   *Phase 1 (Calibration):* This is **Weak Fanaticism**. It seems reasonable to prefer 1% of 1500 over 100% of 10.
      *   *Phase 2 (Muggers):* This is **Strong Fanaticism**. The principle forces you to trade certain small goods for astronomically unlikely huge goods.
  *   **Step 3: The Escape Routes.** Draw four columns on the board. Ask students which "exit" they tried to use during the Mugger phase.
      1.  **Bounded Utility:** "There is a cap on how good $10^{50}$ U can be." (Cost: You can't value saving infinite lives as better than saving finite lives).
      2.  **Probability Thresholds:** "Probabilities below $10^{-X}$ count as zero." (Cost: You become vulnerable to 'Pascal's Wager' style arguments where probabilities are just above the threshold).
      3.  **Epistemic Defeat:** "The probability of the testimony decreases faster than the utility increases." (Cost: This is an epistemic fix, not a decision-theoretic one. It doesn't solve the problem if the chance is *objective*, like a quantum lottery).
      4.  **Biting the Bullet:** "Yes, I would pay the Mugger." (Cost: You go bankrupt in the real world).
  *   **Step 4: The Limitation.** Be frank. "In this game, 100 U = 1 Raffle Ticket. In reality, Utility is not linear. You cannot actually deliver $10^{50}$ utils. The game simulates the *logic*, but your intuition that 'this is nonsense' is partly because you know the payout is fake. In the real philosophical problem, we assume the payout *is* possible (e.g., saving lives). That is where the anxiety comes from."

  ### 1:15 – 1:30 | Q&A and Reading Assignment
  *   Distribute the actual reading (e.g., Bostrom on Pascal's Mugging, or Beckstead on Aggregation).
  *   Ask: "Now that you see the trap, how do you read this paper differently?"

  ---

  ## III. Facilitator Script & Traps
  *   **The "Safety" Objection:** If a student says in Phase 1, "I prefer the sure thing," reply: "Remember, these are raffle tickets. One ticket gives you a 1/N chance. 10 tickets gives you 10/N. Do you genuinely prefer a lower chance of the chocolate?" (Force them to see Utility = Linear in this context).
  *   **The "Scam" Objection:** In Phase 2, if they say "It's a lie," reply: "I am not asking if you trust *them*. I am asking if, *given the probability you assigned*, the EV calculation holds. If you assign $P = 10^{-10}$ and Stake $= 10^{20}$, EV is $10^{10}$. Do you pay?"
  *   **The Silence:** When the Mugger makes an absurd claim, there will be laughter. Let it sit. Then say quietly: "Laughter is an intuition. But we wrote a Principle on the board. Does the Principle laugh?"

  ---

  ## IV. Predictable Pitfalls & Fixes

  | Pitfall | Why it happens | Facilitator Fix |
  | :--- | :--- | :--- |
  | **Early Risk Aversion** | Students reject Phase 1 Round 3 (1% chance) as "too risky." | Remind them of the Raffle Mechanism. "If you reject this, you are voluntarily lowering your odds of the prize. Is that rational?" |
  | **Mugger Phase Collapse** | Students treat the Mugger phase as pure roleplay/fun and don't engage the math. | Freeze the room. "Stop the story. Write the numbers on the board. $P \times V$. Is it greater than the cost? Yes or No?" |
  | **Epistemic Confusion** | Students conflate "Probability is low" with "Claim is false." | Force the distinction. "Assume the claim is *contingently* true with probability $P$. Do not debate the truth. Debate the decision rule." |
  | **Time Overrun** | Mugger stories get too long/elaborate. | Use a visible timer. Give Muggers 3 minutes max to pitch. |
  | **Cynicism** | "This is fake, so I don't care." | Acknowledge it. "The stakes are fake. The *logic* is real. If you accept the logic here, you accept it for climate policy, AI safety, and charity." |

  ---

  ## V. What the Game Cannot Reproduce (The "Hand-Hold")
  You must explicitly supply these two points in the debrief, as the game mechanics inherently mask them:

  1.  **The Linearity of Utility:** In the game, Utility = Tickets. In reality, marginal utility diminishes. The 1 billionth dollar is worth less than the 1st. The game forces linearity to make the math work; you must explain that **Unbounded Utility** is the real philosophical assumption being tested, not just the raffle.
  2.  **The "Shut Up and Multiply" Intuition:** In the game, rejecting the Mugger feels safe. In the real philosophical problem (e.g., existential risk), rejecting the "Mugger" (a tiny chance to save billions of future lives) feels *morally catastrophic*. The game cannot reproduce the moral weight of the stakes. You must supply the emotional gravity: "Imagine the stake isn't points, but the prevention of human extinction."

  ## VI. Post-Game Reading Suggestion
  Assign **Nick Bostrom, "Pascal's Mugging"** (2009) or **Christian Tarsney, "Epistemic Humility and the Normativity of Rationality"**. 
  *Prompt for next class:* "Which escape route from today's whiteboard do you think is the least costly? Defend it against the other three."
