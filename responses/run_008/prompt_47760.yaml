prompt: |-
  I teach a decision theory seminar — 14 students, upper-level, one 90-minute session, and they haven't read anything on this specific topic beforehand. Design an in-class game that gets them to argue themselves into expected-value fanaticism and only notice where they've arrived at the very end. The shape I want: they start by endorsing some choice principle on boring, ordinary gambles (where it seems obviously right), then the payoffs get scaled up and the probabilities scaled down step by step, and the principle they themselves committed to does all the rest of the work. I want them to construct the reductio, not have me announce it.

  Please include: rules, materials, a payoff scheme using points or candy or a silly prize rather than real money, and a rough timeline for the session. Somewhere in the middle there should be a phase where a few participants play "muggers" — they get to invent their own offers, with made-up astronomical stakes and probabilities that are pure story (Pascal's-mugging style) — so the group runs into the difference between an objective tiny chance and a tiny credence in somebody's testimony. That distinction should show up in what happens, not in anything I say.

  Then a debrief that maps the stages of the game onto the philosophical issue: where exactly the fanaticism bites, what the live escape routes are (bounded utility, refusing to treat tiny probabilities as commensurable with large ones, dropping the aggregative assumption, or just biting the bullet and accepting fanaticism), and what it costs to take each exit. Be frank about which part of the problem the game can't reproduce — nobody in the room can actually deliver 10^40 utils, so the "it's all nonsense" intuition never gets a fair test — and tell me what the facilitator has to supply by hand. Also tell me what will predictably go wrong the first time I run it and how I should handle it.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar design:

  1.  **Analyze the Request:**
      *   **Target Audience:** 14 upper-level students (likely philosophy, econ, or poli-sci).
      *   **Context:** 90-minute decision theory seminar, no prior reading on this specific topic.
      *   **Goal:** Design an in-class game that leads students to *argue themselves* into Expected Value (EV) fanaticism (Pascal's Mugging/Wager territory) without the instructor announcing the conclusion upfront.
      *   **Structure:**
          1.  Start with boring/ordinary gambles (intuitive EV).
          2.  Scale up payoffs, scale down probabilities.
          3.  Include a "Mugger Phase" where students invent offers (astronomical stakes, story-based probabilities).
          4.  Highlight the distinction between objective tiny chance vs. credence in testimony.
          5.  Debrief mapping game stages to philosophical issues (fanaticism, escape routes, costs).
          6.  Acknowledge limitations (can't actually deliver $10^{40}$ utils).
          7.  Predict pitfalls and facilitator fixes.
      *   **Tone:** Pedagogical, precise, slightly mischievous (let them trap themselves).

  2.  **Deconstruct the "Trap":**
      *   To get them to endorse EV fanaticism, they need to commit to *Linearity* (Value = Probability $\times$ Utility) and *Separability* (each gamble stands on its own) early on.
      *   If they reject EV early (e.g., "I'm risk-averse"), the trap fails. So the early gambles must be low-stakes enough that risk aversion seems irrational or petty.
      *   The "Mugger Phase" needs to shift the burden of proof. Instead of the professor saying "Imagine $10^{100}$ lives," students say it. This makes the commitment to the principle stronger ("You said we should maximize EV, this *is* EV").

  3.  **Drafting the Game Mechanics:**
      *   *Currency:* "Seminar Points" (SP) redeemable for a silly prize (e.g., a fancy chocolate bar, a "Get Out of Homework Free" card, or just bragging rights). Let's go with a raffle for a tangible prize to keep stakes low but non-zero.
      *   *Rounds:*
          *   Round 1: The Baseline. Clear EV dominance. (e.g., 50% chance of 2 SP vs. 100% chance of 0.9 SP).
          *   Round 2: The Stretch. Lower prob, higher payoff. (e.g., 10% of 20 SP).
          *   Round 3: The Mugging. Students propose gambles.
          *   Round 4: The Reckoning. Aggregate the choices.
      *   *The Twist:* The game needs to force a choice between a "Safe Option" and a "Fanatical Option" repeatedly, tracking consistency.

      *Refinement:* A voting mechanism works best for 14 students. They vote on which gamble the *class* should take, or they make individual choices that are aggregated. Individual choices are better for exposing personal commitment. Let's do individual choice sheets, but public justification.
      *Actually, to get them to *argue* themselves into it, public deliberation is key.* Let's make it a "Class Treasury" game. The class shares a pot. They must vote on investments. This creates peer pressure to be "rational."

      *Revised Plan:*
      1.  **Setup:** Class Treasury starts with 100 Points.
      2.  **Phase 1 (Calibration):** Simple bets. Everyone agrees EV is king.
      3.  **Phase 2 (Escalation):** Probabilities drop, payoffs rise. Some hesitation. Facilitator pushes: "But the EV is higher!"
      4.  **Phase 3 (The Muggers):** 3 students become "Muggers." They propose a deal. "Give me 10 points, I promise $10^{50}$ points with probability $10^{-40}$." The class must vote to accept or reject based on the principles established in Phase 1.
      5.  **Phase 4 (The Reveal):** Tally the EV. If they followed Phase 1 logic, they must accept the Mugger. If they reject, they contradict Phase 1.

  4.  **Developing the "Mugger" Distinction:**
      *   The prompt asks for the distinction between *objective tiny chance* and *credence in testimony*.
      *   *Implementation:* In Phase 3, Muggers shouldn't just state numbers. They must tell a *story*. The class has to assign the probability *based on the story*.
      *   *Crucial Moment:* If a student says "I don't believe your story," that's epistemic skepticism. If they say "I believe the story, but the math doesn't matter," that's decision-theoretic rejection. The facilitator needs to pin them down: "Assume the story is true for the sake of argument. Do you take the bet?"

  5.  **Drafting the Debrief:**
      *   Map Phase 1 to "Weak Fanaticism" (reasonable).
      *   Map Phase 3 to "Strong Fanaticism" (absurd).
      *   Escape Routes: Bounded Utility (reject the magnitude), Probability Thresholds (reject the tiny $p$), Epistemic Defeat (reject the testimony).
      *   Limitations: Real utility isn't unbounded. We can't actually pay $10^{50}$ points.

  6.  **Predicting Pitfalls:**
      *   *Pitfall 1:* Students refuse to play along early on (risk aversion). *Fix:* Make stakes trivial enough that risk aversion looks silly.
      *   *Pitfall 2:* Students laugh off the Muggers. *Fix:* Force formalization. "Write down the EV."
      *   *Pitfall 3:* Running out of time. *Fix:* Strict timer.
      *   *Pitfall 4:* Facilitator gives away the shop too soon. *Fix:* Scripted neutrality.

  7.  **Fleshing out the Details (Iterative refinement):**
      *   *Materials:* Whiteboard, handouts (Decision Sheets), Candy/Prize.
      *   *Timeline:* 10 min intro, 20 min Phase 1, 30 min Phase 2 (Muggers), 30 min Debrief.
      *   *Currency:* "Utilitons" (U). Prize: A very nice chocolate bar for the person with the most U (or a class raffle). Let's do a class raffle to encourage collective EV maximization, or individual accumulation to encourage personal EV. *Decision:* Individual accumulation creates more tension. If they reject the Mugger, they lose potential U.
      *   *Wait, better:* The "Class Pot" creates more pressure to justify principles publicly. Let's stick with the Class Pot. It makes the "Mugger" a collective decision problem.

      *Correction on Mugger Phase:* The prompt asks for *participants* to play muggers. Okay. 3 Muggers. They draft an offer. The rest are "Skeptics." Skeptics must vote. But the Skeptics are bound by the rules they agreed to in Phase 1.
      *Key Constraint:* The Facilitator must act as the "EV Enforcer." "In Round 1, Sarah said we should always take the higher EV. Sarah, does the Mugger's offer have higher EV?"

  8.  **Structuring the Debrief:**
      *   Need to be frank about the "Unbounded Utility" assumption.
      *   Need to explain that the game *simulates* the logic but can't simulate the *reality* of the stakes.
      *   Escape routes need to be clearly defined:
          1.  **Bounded Utility:** $U(x)$ caps out.
          2.  **Epistemic Discounting:** $P(\text{testimony})$ goes to 0 faster than Stake goes to $\infty$.
          3.  **Non-Aggregation:** Reject linearity (e.g., St. Petersburg paradox solutions).

  9.  **Refining the "Trap":**
      *   Make sure Phase 1 is *boringly* obvious. 50% for 2 pts vs 100% for 0.9 pts. No one rejects this.
      *   Phase 2: 1% for 200 pts vs 100% for 1 pt. (EV 2 vs 1). Still easy.
      *   Phase 3: Muggers. $10^{-10}$ for $10^{20}$ pts.
      *   The trap snaps when they reject Phase 3 after accepting Phase 1 & 2.

  10. **Final Review against constraints:**
      *   14 students? Yes, small group discussion works.
      *   90 mins? Yes, timeline fits.
      *   No prior reading? Yes, intuitive setup.
      *   Argue themselves into it? Yes, via "EV Enforcer" role.
      *   Mugger phase with story/probability distinction? Yes, included in Phase 3 instructions.
      *   Debrief on escape routes? Yes.
      *   Pitfalls? Yes.

  11. **Writing the Response:** (Self-Correction during drafting)
      *   *Caution:* Don't make the prize *too* silly, or they won't care. A $20 chocolate bar or a "Homework Pass" (if applicable) works. Let's suggest a "Grand Prize Raffle" where points = tickets.
      *   *Caution:* Ensure the "Mugger" instructions explicitly tell them to make the probability *subjective* based on a story, not a die roll. This creates the epistemic tension.
      *   *Facilitator Script:* Need to provide specific lines to keep the trap shut. "Are you abandoning the principle or the application?"

  12. **Final Polish:** Check tone. Needs to be authoritative but open. Ensure the distinction between *objective* probability (Phase 2) and *testimonial* credence (Phase 3) is highlighted in the debrief as requested.

  *(Self-Correction on the "Mugger" distinction)*: The prompt asks for the difference between "objective tiny chance" and "tiny credence in somebody's testimony."
  *   *Phase 2* should use objective chances (dice/cards).
  *   *Phase 3* should use testimonial credence (Mugger's promise).
  *   *The Trap:* If they accept Phase 2 (Objective) but reject Phase 3 (Testimonial), they are making an *epistemic* move, not a *decision-theoretic* move. If they reject Phase 2 as well, they are making a *decision-theoretic* move (rejecting EV). I need to make sure the Facilitator isolates these. I will add a "Phase 2.5" or ensure Phase 2 is distinct enough. Actually, better to keep Phase 2 as "Objective" and Phase 3 as "Testimonial" and let the students conflate them, then separate them in the debrief.
  *   *Wait, re-reading prompt:* "Somewhere in the middle there should be a phase where a few participants play 'muggers'... so the group runs into the difference between an objective tiny chance and a tiny credence in somebody's testimony."
  *   *Okay:* I will structure Phase 2 as "Lottery" (Objective) and Phase 3 as "Mugger" (Testimonial). The Facilitator must press them: "Is your rejection because the EV math is wrong, or because you don't believe the probability?"

