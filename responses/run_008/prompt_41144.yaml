answer: |-
  **Essay Question**

  Consider the following two cases. **Case 1 (The Clean-Hands Accuser):** Alice blames Bob for a specific betrayal. Alice has never betrayed anyone and intends never to do so. However, when pressed, Alice concedes that had she faced Bob's exact pressures, incentives, and weaknesses of will, she too would likely have betrayed. **Case 2 (Standing by Proxy):** Carol is a close friend of Dave, who was wronged by Eve. Carol blames Eve vigorously. However, Dave has forgiven Eve, considers the matter closed, and has explicitly asked Carol to stop raising the issue.

  Write an essay addressing the following: First, does the hypocrisy objection gain any traction against Alice in Case 1? If the objection fails there, what does this reveal about the true normative basis of standing (e.g., fairness, identification, or susceptibility)? Second, commit to a position on whether lacking standing renders a blame-judgment *false*, *unjustified*, or merely *improper to express*. Finally, apply this specific commitment to Carol in Case 2. Does Carol lack standing entirely, or is her standing merely outweighed? Justify your answer by showing how your resolution of Case 1 dictates your resolution of Case 2.

  ***

  **Model Answer**

  The hypocrisy objection posits that one lacks the standing to blame if one is guilty of the same fault. Case 1 tests the boundaries of this claim. Alice is not guilty; she has clean hands. However, she admits counterfactual susceptibility. If the hypocrisy objection relies strictly on *actual* moral inconsistency (the "inconsistent standards" account), Alice retains standing. She practices what she preaches. Yet, many intuit that Alice's blame is still objectionable. This suggests the hypocrisy objection is not merely about actual wrongdoing, but about *fairness* in the moral address. To blame is to claim a certain moral authority; if Alice admits she possesses no robust virtue that distinguishes her from Bob, her claim to authority appears unearned.

  However, we must be careful. If we strip Alice of standing based on counterfactual weakness, we risk collapsing standing into general moral perfectionism. A more precise diagnosis is that the hypocrisy objection protects the *dialogic* nature of blame. Blame invites a moral conversation. If Alice admits she would have done the same, she undermines the normative distance required for that conversation. She cannot coherently say, "You ought not to have done this," while admitting, "I am no different from you." Thus, the objection grips Alice not because her judgment is false, but because her position is pragmatically self-defeating.

  This leads to the second requirement: determining the normative status of lost standing. Does lacking standing make the blame *false*? No. Bob's betrayal remains a betrayal regardless of Alice's status. The truth-conditions of the blame-judgment are independent of the blamer's virtues. Does it make the blame *unjustified*? This is closer, but "unjustified" often implies the wrongdoer doesn't deserve blame. Bob still deserves blame. Therefore, the most accurate categorization is that lacking standing makes blame *improper to express*. It is a procedural fault, not a substantive one. The content is true, the target is deserving, but the speaker lacks the license to deliver the message.

  Applying this "impropriety" framework to Case 2 clarifies Carol's position. If standing is a license to express moral protest, we must ask who holds that license. In cases of personal wrongs, the primary license belongs to the victim. Carol's standing is derivative. When Dave forgives Eve, he waives his right to pursue the matter. If Carol continues, she is not necessarily making a false claim—Eve did wrong. Nor is Carol's blame unjustified in the abstract—Eve is blameworthy. However, Carol's expression becomes improper because she is violating the victim's prerogative to manage the aftermath of the wrong.

  Crucially, the analysis of Case 1 dictates this outcome in Case 2. In Case 1, we established that standing is about the *propriety of the address* relative to the blamer's position, not the truth of the claim. Alice's counterfactual susceptibility made her address improper because it lacked moral authority. Similarly, Carol's address is improper because it lacks *relational authority*. Just as Alice cannot claim a virtue she admits she lacks, Carol cannot claim a grievance that is not hers to press. If we had argued in Case 1 that standing affects the *truth* of blame, we would be forced to say Carol's blame is false, which is absurd; Eve's wrong is objective. If we argued standing makes blame *unjustified*, we would imply Eve is no longer blameworthy, which contradicts the premise that only Dave forgave, not that Eve didn't wrong him.

  Therefore, the "improper to express" view offers the only consistent explanation for both cases. In Case 1, Alice's susceptibility undermines her authority to speak. In Case 2, Dave's forgiveness revokes Carol's authority to speak. In both instances, the moral facts remain unchanged, but the normative license to articulate them is extinguished. This preserves the objectivity of moral truth while respecting the relational norms that govern moral community. The hypocrisy objection, properly understood, is not about the blamer's sin, but about the conditions required for moral address to be legitimate rather than intrusive or arrogant.

  ***

  **Marking Scheme (20 Marks)**

  | Criterion | Marks | A-Grade Move (Distinction) | B-Grade Move (Competent) | Typical Error |
  | :--- | :---: | :--- | :--- | :--- |
  | **1. Analysis of Clean-Hands (Case 1)** | 5 | Identifies that Alice lacks *actual* inconsistency but argues susceptibility undermines *moral authority* or *fairness*. | Correctly notes Alice hasn't sinned but struggles to explain why blame might still be objectionable. | Treating counterfactual weakness as identical to actual hypocrisy without nuance. |
  | **2. Diagnosis of Hypocrisy Objection** | 4 | Argues the objection is about the *conditions of moral address* (dialogic/pragmatic) rather than just fault. | Identifies the objection is about fairness but treats it as a simple forfeiture rule. | Reducing the objection to a simple "tu quoque" fallacy without normative depth. |
  | **3. Normative Status Commitment** | 5 | Explicitly commits to "improper to express" and defends it by distinguishing truth/desert from licensing. | Chooses a category (false/unjustified/improper) but fails to clearly distinguish the alternatives. | Conflating the *truth* of the blame-judgment with the *propriety* of the blaming act. |
  | **4. Application to Proxy (Case 2)** | 4 | Derives Carol's status directly from the Case 1 commitment (derivative authority/propriety), not intuition. | Applies the chosen category to Carol but relies on intuition rather than the Case 1 framework. | Treating Carol's standing as independent of Dave's, ignoring the "proxy" constraint. |
  | **5. Argumentative Cohesion** | 2 | The link between Case 1 and Case 2 is structural; the solution to one necessitates the solution to the other. | Cases are treated sequentially with a weak or absent connecting thread. | Writing two mini-essays that happen to be in the same document. |

  **Total:** 20 Marks
