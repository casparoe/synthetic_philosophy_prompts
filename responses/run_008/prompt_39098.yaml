prompt: |-
  I've been reading Overcoming Bias and then LessWrong since roughly 2008, and the question of whether a rational person should vote is one of those chestnuts the community has been arguing about for as long as I've been lurking — the expected-value defences of voting that circulated around the 2016 election, the occasional contrarian post arguing that turnout is basically expressive signalling, the recurring fights about whether tiny-probability-high-stakes reasoning proves too much. I've finally written up my own take as a long-gestating blog post, and before I publish it I'd like serious comments. Not encouragement — actual scrutiny.

  Here is the draft.

  ---

  **The Twin Multiplier, or: Why I Vote Without Believing My Vote Is Decisive**

  The old problem, restated quickly. Downs observed in 1957 that since the probability of casting the pivotal vote in a mass election is vanishingly small, an instrumentally rational citizen should usually abstain. Riker and Ordeshook formalised this in 1968 as R = pB − C + D, where p is the probability your vote is decisive, B the benefit of your side winning, C the cost of voting, and D a residual term for duty and similar satisfactions. The D term was widely read as an admission of defeat: the calculus only works because we smuggled the conclusion in as a psychological payoff. In a large election p is on the order of one in ten million even in a competitive race, so pB is essentially zero and whether you turn out depends on whether duty outweighs the queue.

  The effective-altruist reply was to attack B instead of p. If the difference between electoral outcomes is valued at the scale of a nation rather than a person — lives, policy, the whole bundle — then one-in-ten-million times something enormous is not negligible, and an hour of voting compares surprisingly well to an hour of anything else. I always found this half-persuasive. It works only if you're willing to multiply genuinely astronomic stakes by genuinely tiny probabilities and take the product seriously, and the same style of reasoning endorses wagers on Pascal-style grounds that most of us, rightly, decline elsewhere.

  My proposed fix is a different term entirely: the size of the reference class of your decision-twins.

  The pivotal-probability estimates all condition on the actual electorate: given that millions of others show up or don't, what's the chance the margin lands exactly on your vote? But the decision I'm actually making is not mine alone. If I use something in the neighbourhood of functional or evidential decision theory — the update-on-your-own-action reasoning that this community knows from Hofstadter's superrationality and the decision-theory sequence — then the relevant event is not my single ballot but the correlated bloc of people whose choice moves with mine: people with similar information, similar values, similar processing. If there are a hundred thousand of us, and our turnout decisions really do correlate, then my abstention is evidence about the bloc, and the effective decisiveness of my choice is not p but something like the probability that the bloc is jointly pivotal. Call the ratio the twin multiplier. Under a modest multiplier, voting becomes straightforwardly rational without any exotic valuations of B and without appealing to duty at all. The D term isn't needed; it wasn't psychology that was missing from the calculus but decision theory.

  I anticipate the objection that this proves too much: that twin reasoning licenses contributing to every threshold public good — pledge drives, charity matching campaigns, anything with a cliff-edge payoff and correlated contributors. I partly accept this and partly bite the bullet: I think threshold public goods are exactly where correlated-decision reasoning does the most work, and that our intuitions against those cases are calibrated to a causal-decision-theoretic picture I reject. The harder objection, which I don't resolve in the draft, is Brennan's: that if my decision is a sample of my twins' decisions, then voting badly is also multiplied, and epistemically negligent voting is worse than abstention by the same factor that makes voting good. My stopgap is a defeater condition: vote only when you have done the epistemic work your twins would have done. But since my twins are by construction like me, it's unclear how I could ever fail this test from the inside, which suggests the condition is vacuous rather than merely unmet. I flag this honestly and leave it as the post's open wound.

  ---

  Four things I'd like from you, in decreasing order of importance:

  1. Is the twin multiplier actually coherent, or have I committed some version of the classic error of blending causal and evidential expected value — getting the benefits of a hundred thousand votes while paying the cost of one? Please adjudicate between the readings on which the move is trivially true, subtly incoherent, and true-but-assuming-FDT, since I suspect my readers will divide along exactly those lines.
  2. Have I stated the p-literature accurately — Downs's original claim, what Riker and Ordeshook actually intended the D term to do, and the order of magnitude of pivotal probabilities in large elections? Correct me where I'm sloppy, since I'm citing these informally rather than in an academic register.
  3. Does the defeater condition swallow the argument, as I fear it does, and can you see a repair that keeps the twin multiplier but doesn't make self-trust do all the work?
  4. Is section three, the twin multiplier itself, genuinely a new contribution to this well-worn discussion, or have I reinvented something from the 2016-era blog debates — or indeed from the academic literature — closely enough that I should be locating and crediting the prior versions rather than claiming the framing?

  Be blunt, including about whether the piece is worth publishing at all. I've sat on this argument for close to a decade, which I recognise is as much a warning sign as a credential.
reasoning: |-
  Here's a thinking process that leads to the critique:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Long-time reader of Overcoming Bias and LessWrong (since ~2008). Familiar with the community's specific jargon (FDT, EDT, CDT, superrationality, Pascal's mugging, effective altruism).
      *   **Task:** Provide serious scrutiny/critique of a draft blog post titled "The Twin Multiplier, or: Why I Vote Without Believing My Vote Is Decisive."
      *   **Specific Requests:**
          1.  Coherence of the "twin multiplier" (Causal vs. Evidential vs. FDT).
          2.  Accuracy of the political science literature (Downs, Riker/Ordeshook, pivotal probabilities).
          3.  Viability of the "defeater condition" (epistemic negligence).
          4.  Novelty/Originality (is this actually new or reinvented?).
      *   **Tone:** Blunt, critical, not encouraging. "Actual scrutiny."

  2.  **Analyze the Draft Content:**
      *   **Core Argument:** Standard instrumental voting fails because $p$ (pivotal probability) is tiny. EA response inflates $B$ (benefit), but risks Pascal's Mugging. The author proposes inflating the *effective* $p$ via a "twin multiplier." If $N$ people reason like me, my decision correlates with theirs. Therefore, I'm not deciding 1 vote, I'm deciding $N$ votes.
      *   **Decision Theory:** Explicitly leans on Functional/Evidential Decision Theory (FDT/EDT) and Hofstadter's superrationality.
      *   **Objections Anticipated:**
          *   "Proves too much" (threshold public goods). Author bites the bullet.
          *   Brennan's objection (bad voting is also multiplied). Author offers a "defeater condition" (vote only if epistemically diligent) but admits it might be vacuous.
      *   **Self-Assessment:** Author admits sitting on it for a decade (potential sign of perfectionism or unresolved issues).

  3.  **Address Request 1: Coherence of the Twin Multiplier (CDT vs. EDT vs. FDT)**
      *   *CDT (Causal Decision Theory):* My vote causes only my vote. Correlation is not causation. If I vote, it doesn't *cause* my twins to vote. Therefore, the multiplier is incoherent under CDT. It's the classic "magical thinking" objection.
      *   *EDT (Evidential Decision Theory):* My vote is *evidence* that my twins vote. Expected utility includes the correlation. However, EDT is often criticized for the "Smoking Lesion" problem. Does voting *cause* the outcome? No. But it correlates.
      *   *FDT (Functional Decision Theory):* This is the strongest fit. FDT says you decide the *output of your decision algorithm*. If twins run the same algorithm, they output the same decision. So you *are* choosing for all of them.
      *   *The Trap:* The draft says "my abstention is evidence about the bloc." This sounds like EDT. But then it says "effective decisiveness... is not p but... the bloc is jointly pivotal." This sounds like FDT.
      *   *Critique:* The draft blurs EDT and FDT. Under EDT, you get the correlation benefit but also the correlation cost (if you are the kind of person who votes for bad reasons, your twins do too). Under FDT, you control the algorithm. The "Twin Multiplier" is essentially a rebranding of the FDT argument for voting. It is coherent *if* you accept FDT/superrationality. It is incoherent if you demand causal leverage.
      *   *Verdict:* It's not "subtly incoherent" if framed as FDT. It is "true-but-assuming-FDT." The draft needs to be clearer that this *requires* rejecting CDT.

  4.  **Address Request 2: Accuracy of Political Science Literature**
      *   *Downs (1957):* Yes, *An Economic Theory of Democracy*. Paradox of voting.
      *   *Riker & Ordeshook (1968):* Yes, "A Theory of the Calculus of Voting." $R = PB - C + D$.
      *   *D Term:* They did introduce $D$ (citizen duty). The draft says it was "widely read as an admission of defeat." This is accurate to the economic interpretation. Political scientists often treat $D$ as a sociological variable, economists as a fudge factor.
      *   *Pivotal Probabilities:* "One in ten million even in a competitive race." This is roughly accurate for US presidential elections (Gelman, Silver, etc. have estimated ranges from 1 in 10 million to 1 in 100 million depending on the state).
      *   *Verdict:* Accurate enough for a blog post. No major errors.

  5.  **Address Request 3: The Defeater Condition (Brennan's Objection)**
      *   *The Problem:* Jason Brennan (*The Ethics of Voting*) argues that if you have a duty to vote, you have a duty to vote *well*. If the multiplier applies, bad voting is amplified.
      *   *The Draft's Fix:* "Vote only when you have done the epistemic work your twins would have done."
      *   *The Flaw:* As the author admits, this is internal. If I think I'm diligent, my twins think they are diligent.
      *   *Repair:* You need an external standard or a prior commitment device. E.g., "I only vote if I can pass a Ideological Turing Test of my opponent's view" or "I only vote if I have read X." But even then, FDT says if *I* can't pass it, my twins can't either.
      *   *Deep Critique:* The defeater condition doesn't solve the *moral* risk, it just restates the epistemic condition. The real fix in FDT terms is: "Is the algorithm 'Vote' better than the algorithm 'Abstain' given the epistemic constraints?" If the algorithm is "Vote only if informed," then running that algorithm is good. If the algorithm is "Vote regardless," it's bad. The author needs to shift from "I should check" to "My decision procedure must include the check."
      *   *Verdict:* It does swallow the argument if not framed as a pre-commitment to a specific decision *procedure* rather than a case-by-case check.

  6.  **Address Request 4: Novelty/Originality**
      *   *LessWrong History:* This is *very* familiar territory.
      *   *Key Precedents:*
          *   Eliezer Yudkowsky's "Superrationality" and "Timeless Decision Theory" posts (2009-2010).
          *   Scott Aaronson has written on this.
          *   Specifically, the argument that "Your vote counts as $N$ votes because of correlation" is a standard FDT application to voting.
          *   *The "Twin Multiplier" phrasing:* I haven't seen that exact term, but the *argument* is standard LW fare from the TDT/FDT era (2010-2017).
          *   *Academic Lit:* There is literature on "expressive voting" and "ethical voting" (e.g., Edlin, Gelman, Kaplan 2007 "The Vote as a Social Act"). They argue $B$ is large, but some acknowledge correlation.
          *   *MacAskill:* William MacAskill discusses this in *Doing Good Better* or related talks (normative uncertainty + voting).
      *   *Verdict:* It is not a new contribution to the *logic*. It is a nice *exposition* or *reframing*. The "Twin Multiplier" is a good label, but the underlying mechanics are standard FDT. The author should credit the TDT/FDT lineage explicitly rather than implying it's a novel fix to the Downs paradox. It's an application of existing decision theory to a specific problem.

  7.  **Synthesize and Structure the Critique:**
      *   **Tone:** Professional, direct, peer-review style. Acknowledge the author's seniority in the community.
      *   **Section 1: Decision Theory (The Core).** Distinguish EDT vs. FDT. The draft leans EDT ("evidence") but needs FDT ("control"). Warn about the "Magical Thinking" backlash.
      *   **Section 2: Lit Review.** Confirm accuracy. Suggest specific citations (Gelman et al.).
      *   **Section 3: The Defeater.** This is the weakest link. Explain why internal checks fail. Suggest "Algorithm Selection" instead of "Action Selection."
      *   **Section 4: Novelty.** Be honest. This is "Applied FDT 101." That's okay, but don't claim it's a new discovery. It's a synthesis.
      *   **Overall Verdict:** Worth publishing *if* framed as a clear exposition for newcomers who missed the 2010 sequences, not as a breakthrough.

  8.  **Refine the Critique (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "This is FDT." I need to explain *why* the draft's phrasing ("evidence") is risky. EDT gets you into trouble with the Smoking Lesion. FDT avoids it. The draft says "update-on-your-own-action," which is EDT-ish. FDT is "choose the output of the function." I need to point this out.
      *   *Correction on Novelty:* There was a specific post by *Ben Pace* or *Paul Christiano*? No, it's more general. The "Voting is rational under TDT" argument was circulated heavily around 2012-2016. I should mention that.
      *   *Correction on Brennan:* The "defeater" isn't just vacuous; it's dangerous. If I decide "I am diligent," I vote. If I'm wrong, I cause $N$ bad votes. The solution is lowering the prior probability that you are diligent.

  9.  **Final Polish:** Ensure the four points are addressed clearly. Keep the tone respectful but sharp. (The user asked for "blunt".)

  *(Self-Correction on the "Twin Multiplier" term)*: I recall a specific concept called the "Clout" argument or similar in the EA forum. But "Twin Multiplier" seems specific to this draft. I will treat it as a branding choice for an existing argument.

  *(Final check on the "D term")*: Riker and Ordeshook did intend D to capture sociological factors, but the economic critique is indeed that it explains everything and nothing. The draft is accurate there.

  *(Final check on "Proves Too Much")*: The draft bites the bullet on threshold public goods. I should validate that this is actually a *feature* for FDT proponents, not a bug.

  Okay, ready to write the response.
answer: |-
  This is a competent draft that clarifies a specific niche of decision-theoretic reasoning, but it suffers from an identity crisis: it wants to be a novel solution to the Downs Paradox, but it is actually an application of Functional Decision Theory (FDT) that was extensively hashed out in this community between 2010 and 2017.

  Here is the scrutiny you requested, addressing your four points in order.

  ### 1. Coherence: Causal vs. Evidential vs. Functional
  You are walking a tightrope between Evidential Decision Theory (EDT) and Functional Decision Theory (FDT), and your phrasing ("my abstention is evidence about the bloc") leans dangerously toward EDT.

  *   **The EDT Trap:** If you argue merely that your vote is *evidence* of your twins' votes, you open yourself to the "Smoking Lesion" objection. An EDT agent might vote because voting correlates with being the kind of person who cares about the outcome, but the vote itself causes nothing. Critics will dismiss this as magical thinking or superstition.
  *   **The FDT Fix:** The argument is only coherent if you explicitly adopt the FDT frame: you are not choosing an *action* (vote/abstain); you are choosing the *output of a decision algorithm*. If 100,000 people run the same algorithm (or sufficiently similar ones), and you change the output, you change the output for all of them.
  *   **The Verdict:** The "Twin Multiplier" is **true-but-assuming-FDT**. It is not coherent under Causal Decision Theory (CDT), which is the default for most political scientists and economists. You need to be blunter about this. Do not try to sneak it past CDT proponents by calling it "evidence." State clearly: "Under CDT, this is nonsense. Under FDT, it is arithmetic." If you don't make this distinction, you will attract the wrong critics who will tear you apart for violating causality.

  ### 2. Accuracy of the Political Science Literature
  Your summary of the literature is accurate enough for a blog post, though slightly stylized.

  *   **Downs (1957):** Correct. *An Economic Theory of Democracy*.
  *   **Riker & Ordeshook (1968):** Correct. They introduced $D$ specifically to save the rational choice model from the implication that no one should vote. Your characterization of $D$ as an "admission of defeat" is the standard economic critique, though political sociologists treat $D$ as a legitimate variable (social norms, identity). You are safe here.
  *   **Pivotal Probabilities:** "One in ten million" is the correct order of magnitude for US presidential elections (see Gelman, Silver, and Edlin 2012). For local elections, $p$ is higher, which actually strengthens your FDT argument (fewer voters means higher correlation density).
  *   **Correction:** You mention the EA reply attacks $B$ instead of $p$. Technically, the EA reply (e.g., MacAskill) often argues that $B$ is *astronomical* (long-term future), which makes $p \times B$ large even if $p$ is tiny. You have this right, but ensure you distinguish between "large $B$ because policy matters" vs "large $B$ because existential risk matters." The latter is more susceptible to the Pascal's Mugging critique you mention.

  ### 3. The Defeater Condition (Brennan's Objection)
  You are right to fear this swallows the argument. The "defeater condition" as written is vacuous because it relies on internal self-assessment.

  *   **The Problem:** If I am epistemically negligent, I will likely *believe* I am diligent. If my twins are like me, they are also negligent and believe they are diligent. The multiplier amplifies my error.
  *   **The Repair:** You need to shift from **Action Selection** to **Algorithm Selection**.
      *   *Current Draft:* "I will check if I am diligent, then vote." (Fails, because the check is biased).
      *   *Proposed Fix:* "I will adopt the algorithm: `If (Epistemic_Threshold_Met) then Vote else Abstain`."
      *   Under FDT, you are choosing the algorithm. The question is not "Am I diligent?" but "Is an algorithm that requires diligence better than an algorithm that votes unconditionally?"
      *   Even better: Acknowledge that for many people, the FDT answer might genuinely be **Abstain**. If your epistemic hygiene is low, the Twin Multiplier makes you a net negative. This strengthens your post: it turns voting from a "duty" into a "high-responsibility lever." It aligns with Brennan's *The Ethics of Voting* rather than fighting it. Don't try to save voting for everyone; save it for the epistemically virtuous.

  ### 4. Novelty and Prior Art
  This is the most critical point for your reputation. **This is not a new argument.**

  *   **LessWrong History:** The claim that "Voting is rational under TDT/FDT because of correlation" was a standard topic during the Timeless Decision Theory (2009) and Functional Decision Theory (2017) sequences. It was discussed in comments by Yudkowsky, Soares, and others. The specific framing of a "multiplier" based on the size of the reference class is a fresh *label*, but the mechanics are identical to the "Superrationality" arguments from 2010.
  *   **Academic Precedent:** The argument that correlation matters for voting is present in the literature on "ethical voting" (e.g., Edlin, Gelman, Kaplan, 2007, "The Vote as a Social Act"). They don't use FDT, but they argue that $p$ should be replaced by the probability that a *group* is pivotal.
  *   **Recommendation:** Do not present this as "My proposed fix." Present it as "A synthesis of FDT applied to the Downs Paradox." If you claim novelty, long-time community members will roll their eyes. If you frame it as "Here is the clearest explanation of why FDT resolves the voting paradox," it becomes a valuable resource for newcomers who missed the 2010 debates.
  *   **The "Twin Multiplier" Term:** This is good branding. Keep it. But cite the lineage.

  ### Overall Verdict
  **Is it worth publishing?**
  Yes, but only if you adjust the framing.

  *   **Don't** claim you have solved a chestnut that has baffled economists. You have applied a specific, controversial decision theory to it.
  *   **Do** lean into the "high responsibility" angle. The most interesting part of your draft is the admission that the multiplier makes bad voting *worse*. That is a stronger ethical hook than "here's why you should vote."
  *   **Do** clarify the FDT dependency. If you leave it as "evidential," you will be misunderstood.

  **Specific Edit Suggestion:**
  In the section on the defeater condition, add this: *"This implies that for a significant portion of the electorate, the rational FDT choice is abstention. If your decision algorithm is 'vote based on headlines,' and 100,000 twins run that algorithm, you have collectively purchased 100,000 tickets in a lottery you don't understand. The Twin Multiplier does not democratize rationality; it concentrates it."*

  This moves the post from "another rationalist justification for voting" to "a warning about the epistemic burden of voting," which is a much more distinctive contribution.
