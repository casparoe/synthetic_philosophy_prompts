answer: |-
  ### Executive Summary: Critical Finding

  **There is a jointly unsatisfiable subset of requirements for worst-case safety.**
  Specifically, **Worst-Case Soundness**, **Bounded Human Verification**, and **Adversarial Search Superiority** cannot hold simultaneously. If a dishonest AI can search for obfuscated arguments (claims where verification is easy but discovery of the flaw is computationally hard) faster than an honest AI can find the refutation, and the human judge cannot verify the flaw without the honest AI's guidance, the debate protocol fails in the worst case. This is not an engineering gap; it is a complexity-theoretic ceiling.

  ---

  ### Part 1: Desiderata for Trustworthy Debate Oversight

  Below are the specifications a debate-based scheme must meet to be considered for a safety case. Requirements are marked as **Non-Negotiable** (safety-critical; failure invalidates the scheme) or **Convenience** (practical relaxations that reduce robustness but may be acceptable in limited domains).

  #### 1. Atomic Verifiability
  *   **Specification:** Every terminal claim (leaf node) in the debate transcript must be verifiable by the human judge *directly* or via a trusted oracle, without requiring further debate.
  *   **Motivating Threat:** **Infinite Regress / Trust Transfer.** Without this, the judge is merely verifying that Model A's claims are consistent with Model B's claims, not that they correspond to reality. The debate becomes a consistency check between liars rather than a truth check.
  *   **Status:** **Non-Negotiable.**

  #### 2. Refutation Complexity Bound
  *   **Specification:** For any false claim $C$ made by the dishonest debater, there must exist a refutation path $R$ such that the computational cost (tokens/time) to present $R$ is less than or equal to the cost to present $C$, *and* $R$ is verifiable within the judge's cognitive budget.
  *   **Motivating Threat:** **Obfuscated Arguments.** This guards against the asymmetry where planting a lie is $O(1)$ but finding the specific logical flaw requires $O(N)$ search. If $R$ is longer than the debate window allows, the honest debater loses by timeout, regardless of truth.
  *   **Status:** **Non-Negotiable.**

  #### 3. State Binding (Cross-Examination Integrity)
  *   **Specification:** During cross-examination, the debater's internal state (weights, random seed, or context window) must be frozen or cryptographically committed. The debater cannot re-sample or re-optimize responses to new questions based on the question's content.
  *   **Motivating Threat:** **Adaptive Obfuscation.** If a dishonest debater can re-generate answers for every follow-up, it can treat cross-examination as a new search problem, finding fresh obfuscations to patch holes revealed by the judge's questions. This turns cross-examination into a tool for deepening the lie rather than exposing it.
  *   **Status:** **Non-Negotiable.**

  #### 4. Search Symmetry
  *   **Specification:** The honest and dishonest debaters must have access to equivalent computational resources and search capabilities (e.g., same number of inference steps, same access to tools).
  *   **Motivating Threat:** **Search Asymmetry.** If the dishonest debater has more compute, it can search a larger space for persuasive falsehoods than the honest debater can search for truths. Even if Refutation Complexity Bound holds theoretically, the honest debater may not find the refutation within the resource budget.
  *   **Status:** **Non-Negotiable** (for worst-case safety). *Relaxable to Convenience* only if the domain is proven to lack obfuscated arguments (see Impossibility Result).

  #### 5. Transcript Completeness
  *   **Specification:** The judge must see the entire interaction history, including hidden reasoning traces (Chain of Thought) if they are used to generate public statements.
  *   **Motivating Threat:** **Steganographic Coordination.** Debaters could coordinate via hidden channels or encode false premises in unobserved reasoning steps that influence the public output without being subject to scrutiny.
  *   **Status:** **Non-Negotiable.**

  #### 6. Judge Cognitive Load Limit
  *   **Specification:** The total complexity of the transcript presented to the judge must not exceed the judge's verified capacity for attention and logical tracking.
  *   **Motivating Threat:** **Overwhelm / Rubber-Stamping.** If the transcript is too long or complex, the judge defaults to heuristics (e.g., "which model sounds more confident"), decoupling the verdict from truth.
  *   **Status:** **Non-Negotiable.**

  ---

  ### Part 2: Cross-Examination Specifics

  Cross-examination is often proposed as the solution to obfuscation. It is only effective under strict conditions.

  **When Cross-Examination Breaks Asymmetry:**
  It works only when it forces **Commitment**. If the dishonest debater is forced to commit to a specific claim $X$ at time $t_1$, and a follow-up at $t_2$ reveals $X$ contradicts claim $Y$ (also made at $t_1$), the lie is exposed. This relies on *State Binding* (Desideratum #3). The dishonest model must not be able to retcon $X$ to fit $Y$.

  **When Cross-Examination Deepens Obfuscation:**
  If the dishonest debater is stateless (or can re-sample), every follow-up question provides *new information* about what the judge finds confusing. The debater can use this gradient to generate a *new* obfuscated argument tailored to the judge's specific blind spots. In this regime, cross-examination increases the dishonest debater's search surface area, making it *harder* for the honest debater to cover all possible adaptive lies.

  **Requirement:** Cross-examination must be **Non-Adaptive** for the debater. The debater must answer from a frozen distribution, not an optimization loop targeting the judge's confusion.

  ---

  ### Part 3: The Impossibility Result

  **The following subset of requirements is jointly unsatisfiable in the worst case:**

  1.  **Worst-Case Soundness:** The scheme guarantees the judge identifies the truth even against a superintelligent adversary.
  2.  **Bounded Human Verification:** The human judge can only verify claims of polynomial complexity (P-time) relative to their attention span.
  3.  **Adversarial Search Superiority:** The dishonest AI can search for arguments in a complexity class harder than the honest AI (e.g., finding an NP-hard obfuscated argument while the honest AI is limited to P-time refutation search).

  **The Conflict:**
  Obfuscated arguments rely on a gap between **Verification Complexity** (easy) and **Refutation Discovery Complexity** (hard).
  *   The Dishonest Debater ($D$) searches for a claim $C$ where $Verify(C)$ is easy for the Judge, but $FindRefutation(C)$ is hard.
  *   The Honest Debater ($H$) must find that refutation within the debate token limit.
  *   If $D$ has superior search capabilities (or if the problem structure inherently makes finding the bug harder than planting it), $H$ will time out before finding the specific refutation path.
  *   The Judge, bound by **Bounded Human Verification**, cannot verify the claim $C$ is false without $H$'s pointer to the flaw.
  *   Therefore, the Judge accepts $C$. **Worst-Case Soundness fails.**

  **Plain Statement:**
  You cannot guarantee safety via debate if the AI can find lies that are harder for a human+AI team to disprove than they are for the AI to invent. This is a complexity-theoretic barrier, not a prompt-engineering problem.

  ---

  ### Part 4: The Exclusionary Requirement

  The single requirement that does the most exclusionary work against proposed variants is:

  #### **Refutation Complexity Bound (Desideratum #2)**

  **Why it excludes common variants:**
  *   **Plain One-on-One Debate:** Fails immediately. If the dishonest model generates a 1,000-token argument containing one subtle error, the honest model may need 10,000 tokens of search to locate and explain that error. The honest model loses on token limits.
  *   **Recursive Decomposition:** Fails on depth. While this breaks claims into smaller pieces, an obfuscated argument can be structured such that the error only appears at the *root* after combining valid-looking leaves. To refute it, the honest model must traverse the whole tree. If the tree depth exceeds the judge's attention (Desideratum #6), the scheme fails.
  *   **Debate with Cross-Examination:** Fails if State Binding is imperfect. If the dishonest model can adapt, the "Refutation Complexity" effectively becomes infinite because the target moves. Even with State Binding, if the initial argument is obfuscated, cross-examination questions from the *honest* model are still subject to the search asymmetry—the honest model doesn't know which question will trigger the contradiction.

  **Can we shore it up?**
  **No.** This is a hard ceiling.
  You cannot "shore up" Refutation Complexity Bound without changing the problem domain. You would need to prove that for your specific application (e.g., code review, policy analysis), **no obfuscated arguments exist** (i.e., finding a bug is never asymptotically harder than writing one).
  *   In mathematics or code, this is false (finding a bug is often harder than writing code).
  *   In empirical facts, this is false (verifying a lie might be easy, finding the counter-evidence might require searching a massive database).

  **Governance Implication:**
  Debate cannot be used as a **general-purpose** safety check for capabilities where the AI might outperform humans in *search* more than in *verification*. It is only safe in domains where **Truth is Simpler than Lies**. If your use case involves high-dimensional strategy, novel science, or complex code, Debate-based oversight provides no worst-case guarantee against obfuscated arguments. You must treat it as a probabilistic heuristic, not a safety case foundation.
