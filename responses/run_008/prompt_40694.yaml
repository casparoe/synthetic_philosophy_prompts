prompt: |-
  I've just been made performance manager at a mid-sized regional transit authority, and our board has decided to move to "performance-informed budgeting": every department's next funding cycle will partly depend on a scorecard of metrics that I'm tasked with designing. I'm wary, because everyone I talk to has a Goodhart story — the last agency that paid drivers for on-time performance found buses quietly skipping stops or idling at terminals just long enough to reset their clocks, and fare inspectors who were told to prioritize "interactions per shift" started carding the same easy commuter stations rather than the problem routes. I've read enough to know there's actually a useful taxonomy hiding behind the slogan: the kind of Goodhart's law where you select on a noisy proxy and the noise gives out (regressional), the kind where you push into a region of the proxy that never contained real quality (extremal), and the kind where the metric itself causes the behavior that destroys it (causal / specification gaming). I want those distinctions in the procedure, not just the proverb.

  Please turn all of that into a procedure I can actually run when a department proposes a new metric for the scorecard. I need an ordered set of questions an analyst with no philosophy background can apply in an afternoon: what to check about how the metric was validated, how to reason about what the metric is a proxy for and where the proxy relation is only locally valid, how to anticipate the gaming strategies available to the people being measured (including ones that are individually rational and hard to call misconduct), and what a sufficient mitigation looks like — paired metrics, sampling audits, capped incentives, or refusing to attach money at all. Mark clearly which steps produce a defensible no, which steps are judgment calls dressed up as procedure, and where the procedure has to hand the decision back to me or the board because the question is one of values. Then run it on three live proposals from our current draft scorecard: (1) bus on-time performance with a 2% budget bonus attached, (2) a "customer satisfaction" score from an SMS survey sent after each ride, and (3) track-maintenance departments scored on "number of defects closed" by quarter-end. On the last one I expect the procedure to flag something specific and unwelcome, and I'd rather hear it now than after the maintenance backlog shows up in a derailment report — so tell me what the procedure says even when it's inconvenient, and say plainly what the procedure cannot do.

  For context on constraints: the board meets quarterly and will not accept "we couldn't find a good metric" as an answer more than once or twice before they design metrics themselves without me, so the procedure needs a sanctioned way to decline that doesn't read as obstruction. Analysts have two weeks per review cycle, we can't afford more than a small pilot or audit budget per metric, and the transit workers' union is represented on the committee that signs off — anything that reads as surveillance theater will die in committee even if it's methodologically sound. I want the procedure honest about that political surface too: a step is useless to me if following it guarantees the whole scorecard gets voted down.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Performance Manager at a mid-sized regional transit authority.
      *   **Task:** Design a procedure for evaluating proposed metrics for "performance-informed budgeting."
      *   **Core Concern:** Goodhart's Law (specifically the taxonomy: Regressional, Extremal, Causal/Specification Gaming).
      *   **Requirements:**
          *   Ordered set of questions for analysts (non-philosophers).
          *   Must be executable in an afternoon (per metric).
          *   Must distinguish between: Defensible No, Judgment Calls, Value Decisions (Board/Manager).
          *   Must include mitigation strategies (paired metrics, audits, caps, refusal).
          *   Must be politically viable (Union buy-in, Board deadlines).
          *   Must apply the procedure to three specific live proposals (OTP, SMS Satisfaction, Defects Closed).
          *   Must be honest about limitations (what the procedure *cannot* do).
      *   **Constraints:** Quarterly board meetings, 2-week review cycle per metric, small audit budget, Union oversight (no surveillance theater).

  2.  **Develop the Procedure (The "Goodhart Filter"):**

      *   *Goal:* Make the abstract taxonomy concrete.
      *   *Structure:* Needs to be a checklist or flow. Let's call it the "Metric Viability Protocol (MVP)."
      *   *Phase 1: Proxy Validity (Regressional Goodhart).* Is the metric actually correlated with the goal?
      *   *Phase 2: Range Validity (Extremal Goodhart).* Does the metric break at the extremes/targets?
      *   *Phase 3: Behavioral Response (Causal Goodhart).* How will people game this?
      *   *Phase 4: Mitigation & Politics.* Can we fix it? Is it acceptable to the Union/Board?
      *   *Decision Points:* Clearly label where the analyst stops and where the Manager/Board decides.

      *   *Drafting the Questions:*
          *   Q1: Correlation evidence? (Data history?)
          *   Q2: Edge cases? (What happens at 100%? 0%?)
          *   Q3: Gaming scenarios? (Brainstorming session.)
          *   Q4: Mitigation cost/feasibility?
          *   Q5: Union/Political acceptability?

      *   *Refining for Constraints:* Needs to be fast. "Afternoon" means 3-4 hours max. So, the questions need to rely on existing data or quick interviews, not new studies.
      *   *Labeling:* Use tags like [ANALYST], [MANAGER], [BOARD], [NO-GO].

  3.  **Apply the Procedure to the Three Proposals:**

      *   **Proposal 1: Bus On-Time Performance (OTP) + 2% Bonus.**
          *   *Context:* Classic Goodhart example (skipping stops, holding buses).
          *   *Analysis:* High risk of Causal Goodhart.
          *   *Mitigation:* Paired metric (completed trips vs. scheduled), random spot checks.
          *   *Political:* Union might hate "surveillance," but OTP is standard.
          *   *Verdict:* Conditional Yes, but needs specific guardrails.

      *   **Proposal 2: SMS Customer Satisfaction after *every* ride.**
          *   *Context:* High burden, selection bias, annoyance factor.
          *   *Analysis:* Regressional (does SMS = satisfaction?) and Extremal (spamming users).
          *   *Political:* High risk of rider backlash (spam). Union neutral.
          *   *Verdict:* No (too noisy/intrusive). Suggest sampling instead.

      *   **Proposal 3: Track Maintenance "Defects Closed" by Quarter-End.**
          *   *Context:* The user specifically flagged this as dangerous.
          *   *Analysis:* Extreme Causal Goodhart. Incentivizes finding easy defects or closing them improperly to hit the number. Ignores severity.
          *   *Risk:* Safety/Derailment.
          *   *Verdict:* Hard No. This is the "inconvenient truth."
          *   *Alternative:* Weighted defect severity or "time-to-repair for critical defects."

  4.  **Address the Political and Procedural Constraints:**

      *   *Board Pressure:* The procedure needs a "Defensible No" category that cites risk, not just "it's hard."
      *   *Union:* Need to emphasize that the procedure checks for "surveillance theater."
      *   *Limitations:* Acknowledge that metrics can't capture culture or unforeseen black swans.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, direct, actionable, slightly cautious (matching the user's wariness).
      *   *Structure:*
          1.  Introduction (acknowledging the stakes).
          2.  The Procedure (The "Metric Viability Protocol").
          3.  Application to the 3 Proposals.
          4.  Limitations & Political Reality.
      *   *Specific Focus:* Ensure the distinction between Regressional, Extremal, and Causal is embedded in the questions, not just namedropped.
      *   *Decision Rights:* Clearly mark who decides what.

      *(Self-Correction during drafting)*: I initially thought about suggesting complex audits. But the prompt says "small audit budget." I need to suggest low-cost mitigations like "paired metrics" or "sampling" rather than "hire more inspectors."
      *(Self-Correction on Union)*: Make sure the procedure explicitly asks "Does this look like surveillance?" If yes, it needs Union sign-off early.

  6.  **Final Review against Prompt:**

      *   *Taxonomy included?* Yes (Regressional, Extremal, Causal).
      *   *Ordered questions?* Yes.
      *   *Decision labels?* Yes ([ANALYST], [MANAGER], [BOARD], [STOP]).
      *   *Three proposals analyzed?* Yes.
      *   *Maintenance metric flagged?* Yes, strongly.
      *   *Limitations stated?* Yes.
      *   *Political constraints respected?* Yes (Union, Board timeline).

  7.  **Final Polish:** Ensure the language is crisp. "Defensible No" needs to sound like risk management, not obstructionism. (e.g., "Safety Risk" vs. "Hard to measure").

  **(Post-computation check):** The prompt asks for the procedure *first*, then the application. I will structure it that way. I need to make sure the "Maintenance" analysis hits hard on the safety aspect as requested.

  Let's build the "Metric Viability Protocol (MVP)."

  *   *Step 1: The Proxy Test (Regressional).*
  *   *Step 2: The Extremes Test (Extremal).*
  *   *Step 3: The Gaming Test (Causal).*
  *   *Step 4: The Mitigation & Politics Test.*

