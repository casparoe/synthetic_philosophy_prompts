answer: |-
  Here is the **Metric Viability Protocol (MVP)**. It is designed to be run by a junior analyst in 3–4 hours per metric. It translates the Goodhart taxonomy into operational checks, assigns decision rights clearly, and includes specific "off-ramps" to satisfy the Board without looking obstructive.

  Following the protocol, I have applied it to your three live proposals.

  ---

  # The Metric Viability Protocol (MVP)

  **Purpose:** To assess whether a proposed performance metric is robust enough to be tied to budget allocations without inducing harmful behavior or measurement failure.
  **Timebox:** 4 Hours per metric.
  **Decision Rights Key:**
  *   **[ANALYST]**: Fact-finding and recommendation.
  *   **[MANAGER]**: You (Performance Manager). Risk acceptance.
  *   **[BOARD]**: Strategic value trade-offs.
  *   **[STOP]**: Defensible rejection. Do not proceed to budgeting.

  ## Phase 1: The Proxy Test (Regressional Goodhart)
  *Goal: Determine if the metric actually correlates with the goal, or if it's just noise.*

  1.  **Historical Correlation:** Do we have at least 12 months of historical data showing that when this metric improves, the actual organizational goal (safety, ridership, efficiency) improves?
      *   *If No:* **[STOP]**. Do not use for budgeting. Pilot only.
  2.  **Noise Ratio:** Is the metric subject to high external variance (e.g., weather, traffic) that the department cannot control?
      *   *If Yes:* Requires risk-adjustment formula. **[MANAGER]** must approve the adjustment model.
  3.  **Data Integrity:** Can the data be generated automatically by existing systems, or does it require manual entry by the staff being measured?
      *   *If Manual Entry:* **[STOP]** for budget linkage. High risk of fabrication.

  ## Phase 2: The Extremes Test (Extremal Goodhart)
  *Goal: Determine if the metric breaks when pushed to the target level.*

  4.  **The 110% Question:** If a department exceeds the target by 10%, does that represent *more* value, or does it represent cutting corners? (e.g., Speeding to improve on-time performance).
      *   *If Cutting Corners:* **[STOP]**. The metric measures activity, not quality.
  5.  **The Zero Question:** If a department scores 0 on this metric, is it because they failed, or because there was no work to do? (e.g., "Defects Closed" when no defects exist).
      *   *If No Work:* Metric must be normalized by volume/exposure. **[ANALYST]** to propose denominator.

  ## Phase 3: The Gaming Test (Causal Goodhart)
  *Goal: Anticipate specification gaming and rational misconduct.*

  6.  **The "Rational Cheat" Brainstorm:** Convene a 30-minute session with one union rep and one frontline supervisor (off-record). Ask: *"If your bonus depended on this number, what is the easiest way to raise it without actually improving service?"*
      *   *Output:* List of top 3 gaming strategies.
      *   *If Strategies are Safety-Critical:* **[STOP]**. (e.g., skipping safety checks to save time).
      *   *If Strategies are Service-Critical:* **[MANAGER]** must approve mitigation.
  7.  **Surveillance Check:** Does verifying this metric require new cameras, GPS tracking, or audio recording of staff?
      *   *If Yes:* **[BOARD/UNION]** approval required before analysis continues. If Union opposes, **[STOP]**.

  ## Phase 4: Mitigation & Decision
  *Goal: Define the guardrails or kill the metric.*

  8.  **Mitigation Selection:** For every risk identified in Phase 3, select one:
      *   *Paired Metric:* (e.g., OTP paired with "Stops Completed").
      *   *Capped Incentive:* Bonus caps out at 100% of target to remove incentive to over-optimize.
      *   *Audit Sampling:* Random verification of 5% of data points.
      *   *Lag Time:* Budget adjustment happens 6 months after data to allow for quality review.
  9.  **Final Classification:**
      *   **Green:** Proceed to budgeting with mitigations.
      *   **Yellow:** Proceed as *Informational Only* (no money attached) for 2 cycles.
      *   **Red:** **[STOP]**. Metric is dangerous.

  ---

  # Application to Live Proposals

  Here is the MVP applied to your current draft scorecard.

  ## Proposal 1: Bus On-Time Performance (OTP)
  *   **Incentive:** 2% Budget Bonus for >90% OTP.
  *   **Phase 1 (Proxy):** **Pass.** Historical data shows OTP correlates with ridership retention. Data is automated (GPS).
  *   **Phase 2 (Extremes):** **Fail.** At 100% OTP, drivers may hold buses at terminals artificially (dwell time manipulation) to reset clocks, reducing overall network frequency.
  *   **Phase 3 (Gaming):** **High Risk.** "Rational Cheat" session confirms drivers can skip low-ridership stops to make time. This is service degradation, not misconduct, making it hard to punish.
  *   **Phase 4 (Mitigation):**
      *   *Paired Metric:* Must add "Percentage of Scheduled Stops Completed."
      *   *Cap:* Bonus caps at 95% OTP. (Removing incentive to hit 100%).
      *   *Audit:* Random ride-alongs to check dwell times.
  *   **Verdict:** **YELLOW (Conditional).**
      *   *Action:* Do not attach the 2% bonus yet. Run OTP + Stops Completed as *informational* for two quarters. If the correlation holds without dwell-time spikes, revisit budgeting.
      *   *Political Note:* Union will accept the "Stops Completed" pair because it protects drivers from being forced to skip stops.

  ## Proposal 2: Customer Satisfaction (SMS Survey per Ride)
  *   **Incentive:** Departmental funding tied to avg. score.
  *   **Phase 1 (Proxy):** **Fail.** SMS response rates are typically <5%. This is a noisy proxy (Regressional). It measures "anger" or "boredom," not overall satisfaction.
  *   **Phase 2 (Extremes):** **Fail.** Sending an SMS after *every* ride is intrusive. Extreme implementation causes rider churn (people turn off phones or switch modes).
  *   **Phase 3 (Gaming):** **Medium Risk.** Staff may pressure riders to "give a 5" to keep their jobs.
  *   **Phase 4 (Mitigation):**
      *   *Sampling:* Switch to random sampling (1% of riders), not 100%.
      *   *Channel:* Move to email/app push, not SMS (lower cost, less intrusive).
  *   **Verdict:** **RED (STOP).**
      *   *Action:* Reject the "per ride" SMS proposal. It violates the "Surveillance Check" (feels like harassment) and fails the Noise Ratio.
      *   *Board Script:* "This metric creates rider backlash that reduces revenue, negating the performance gain. We propose a quarterly random-sample survey instead."

  ## Proposal 3: Track Maintenance "Defects Closed"
  *   **Incentive:** Quarterly budget release tied to volume of defects closed.
  *   **Phase 1 (Proxy):** **Fail.** "Defects Closed" does not correlate with "Track Safety." It correlates with "Administrative Activity."
  *   **Phase 2 (Extremes):** **Critical Fail.** If the target is 100 defects, and there are only 50 critical defects, maintenance will be incentivized to log 50 minor/non-existent defects to hit the number (Extremal). Conversely, they may ignore complex, long-term repairs to focus on quick wins.
  *   **Phase 3 (Gaming):** **Critical Risk.** The "Rational Cheat" is obvious: Reclassify major structural issues as minor repairs to close them faster. Or, close a defect without fixing it to clear the queue.
      *   *Safety Implication:* This directly increases derailment risk.
  *   **Phase 4 (Mitigation):**
      *   *Can it be fixed?* No. You cannot pair this easily. Any volume metric on safety repairs invites corner-cutting.
      *   *Alternative:* Metric must be "Time-to-Repair for Critical Defects" (weighted by severity) OR "Safety Audit Pass Rate" (independent inspection).
  *   **Verdict:** **RED (STOP - SAFETY CRITICAL).**
      *   *Action:* **Do not put this on the scorecard.**
      *   *Board Script:* "Tying maintenance funding to volume of repairs creates a statutory safety liability. It incentivizes closing tickets over fixing tracks. We recommend funding maintenance via baseline allocation + independent safety audit pass rate."
      *   *Note:* This is the "Defensible No." Cite *liability*, not difficulty. The Board cannot argue with safety liability.

  ---

  # Limitations & Political Reality

  You asked for honesty about what this procedure cannot do.

  **1. The Procedure Cannot Detect "Culture Rot"**
  The MVP checks for specific gaming strategies, but it cannot measure the erosion of professional pride. If you tie *any* budget to metrics, you shift the culture from "public service" to "contract compliance."
  *   *Mitigation:* Keep the % of budget at risk low (under 5%). If more than 5% of a department's operating budget is metric-dependent, the procedure fails to protect against long-term morale collapse.

  **2. The Procedure Cannot Override Board Will**
  If the Board insists on the "Defects Closed" metric despite your **RED** classification:
  *   *Procedural Defense:* Document the **Phase 3 (Gaming)** safety risk in writing. Require the Board Chair to sign a waiver acknowledging the safety liability. Usually, the threat of personal liability is enough to pause the decision.

  **3. The Union Veto**
  The **Surveillance Check (Phase 3, Q7)** is your political shield. If the Union says a metric feels like surveillance, the procedure classifies it as **[STOP]**.
  *   *Why this helps you:* It allows you to tell the Board, "We can't implement this because it violates the labor agreement," rather than "I don't think this is a good idea." It externalizes the obstruction.

  **4. The "Good Enough" Trap**
  This procedure takes 4 hours per metric. With a 2-week cycle, you can only rigorously test ~5 metrics per cycle.
  *   *Constraint:* Do not allow the Board to expand the scorecard beyond 5-7 key metrics. If they add more, the analysis becomes superficial, and Goodhart's Law wins by default.

  ### Summary of Recommendations for the Next Board Meeting

  1.  **Adopt the MVP:** Present this protocol as a "Risk Management Framework" rather than a "Metric Evaluation." Boards understand risk; they find philosophy abstract.
  2.  **Kill Proposal 3:** Use the Safety Liability argument. It is the only argument that trumps budgetary efficiency.
  3.  **Modify Proposal 1:** Propose the "OTP + Stops Completed" pair as a pilot, explicitly stating no money is attached for 6 months.
  4.  **Reject Proposal 2:** Replace with a quarterly sampling survey.

  This approach gives the Board action (a framework), protects the Agency from safety liabilities (killing the maintenance metric), and respects the Union (surveillance check), while giving you the cover to say "No" based on procedure rather than opinion.
