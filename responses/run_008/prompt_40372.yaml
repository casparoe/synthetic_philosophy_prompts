          *   Brightness (Watts/Lumens) $\rightarrow$ Degree of Sentience / Moral Weight.
          *   The Dial Setting $\rightarrow$ The assumed measurable metric of "how much" consciousness exists.
      *   *Implicit Assumption:* Brightness is uniform (white light). A brighter bulb is just *more* of the same thing.

  3.  **Part 2: Where the Mapping Fails (The Critique):**

      *   *Unidimensionality vs. Multidimensionality:* A dimmer has one axis (intensity). Consciousness likely has many (pain, pleasure, self-awareness, temporal depth, emotional richness).
      *   *The "What-It's-Like" Problem:* Nagel's bat. A bee might have intense *sensory* awareness (polarized light, smell) but zero *narrative* awareness. Is that "dimmer" or just "different color"?
      *   *Thresholds vs. Gradients:* Some capacities might be binary (on/off). Do insects have *any* phenomenal experience, or just nociception (reflex)? The dimmer assumes it's on, just low.
