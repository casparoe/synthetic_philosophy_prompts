      *   *The Spreadsheet Error:* Effective Altruism (EA) style moral weighting often relies on this linear scaling. If the scale is bogus, the spreadsheet is bogus.
      *   *User's Bias Check:* Is the user resisting because they want humans to be special, or because they intuitively feel that "slight suffering" is a category error? (i.e., either you suffer or you don't; "micro-suffering" might not aggregate the way money does).

  5.  **Part 4: Alternative Analogies:**

