      *   *Idea 2: The Prism.* White light (human) splits into spectra. Insects might have just one color (pain) very brightly, but no others.
      *   *Idea 3: The Tool Kit.* Different tools for different jobs.
      *   *Selection:* The **Audio Equalizer** is best. It preserves gradability (sliders) but rejects unidimensionality (single dial). It allows for "incommensurability" (you can't say a bass-heavy track is "louder" than a treble-heavy track in a moral sense without knowing the song).
      *   *Another Option:* **Resolution vs. Color Depth.** A bee might have high refresh rate (reaction time) but low color depth (emotional nuance).

