      2. Follow-up on Continuity vs. Origin.
      3. Origin Prejudice (Causal/Big Bang).
      4. Follow-up on Fixity vs. Trajectory.
      5. Practical/Donor Gametes (The "Ghost Sibling").
      6. Follow-up on Grief/Regret.
      7. Twinning (One Zygote, Two People).
      8. Follow-up on Essence Splitting.
      9. Cloning/Synthetic Origins (Is the *process* essential?).
      10. Closing (Why does this metaphysical fact matter?).

