  **DRAFT JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Project:** The Metaphysics of Symmetry and Individuation
  **Date:** October 24, 2023
  **Participants:** Dr. [Researcher A] (Structuralist), Dr. [Researcher B] (Haecceitist)
  **Rapporteur:** [Your Name]
