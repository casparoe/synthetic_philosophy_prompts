answer: |-
  The practice of state apology for historical wrongs presupposes a corporate agency theory of the state, treating the polity as a continuous moral person distinct from its transient membership.

  This conclusion follows from the logic of the speech act itself. An apology is a first-person admission of wrongdoing ("I did this, and I am sorry"). If the state were merely a sum of living individuals (strict individualism), the first-person plural ("We apologize") would be a falsehood, because the "we" speaking did not commit the act. For the apology to be truthful rather than merely expressive of empathy, the entity speaking must be identical to the entity that acted. This identity is only possible if the state is viewed as a corporate agent—a moral person that persists through time despite the total turnover of its human components. The specific focus on the word "apology" versus "sorrow" (as seen in the Blair example) confirms this: lawyers worry about the word "apology" because it is a performative utterance that admits liability on behalf of the *entity*, whereas "sorrow" is merely an expression of individual feeling. If the state were not a continuous agent, admitting liability for past acts would be legally incoherent, rendering the lawyers' caution unnecessary.

  The distinction between guilt and responsibility is not a patch to cover a contradiction between (a) and (b), but rather the precise mechanism that makes corporate agency coherent in this context. Under the corporate view, the *State* (the office) bears responsibility for its continuity and past actions, while the *Officeholders* (the individuals) bear no guilt because they did not possess the requisite intent (*mens rea*). There is no tension here because the moral predicates apply to different subjects: responsibility attaches to the corporate person for the sake of relational repair, while guilt attaches to individual moral agents for their specific willful conduct. The Prime Minister speaks *as* the Office, not as themselves; they accept the Office's responsibility without accepting personal guilt.

  If you swapped this presupposition for strict individualism, the practice would collapse into mere statements of regret. Under individualism, no living person can say "I apologize" for a past act they did not commit without engaging in a category mistake; they can only say "I regret that this happened" or "I am sorry that my predecessors did this." This deflated form strips the apology of its performative power to acknowledge *owning* the wrong. It transforms the act from a moral reckoning by the perpetrator (the State) into an expression of empathy by a bystander (the current government). The fact that politicians fight so hard to avoid the word "apology" when they wish to avoid liability (as Blair did) proves they understand that "apology" requires the corporate view, while "sorrow" is compatible with individualism. Therefore, the practice cannot survive in its current form under strict individualism; it would cease to be apology and become condolence.
