  Please write your answer in American English.

  For roughly two years, my friend Dana and I have been trading moral hypotheticals, and I now have a long enough track record of her verdicts to see a pattern without being able to name the rule behind it — if there is one. Her rulings so far: it was wrong for me to skip helping a friend move apartments in order to attend a sold-out concert, but not wrong to skip it in order to drive an injured stranger to the emergency room; it was not wrong to tell a first-time host that her cooking was delicious when it was merely edible; it was wrong to reassure a paying client that the flaws in the client's business plan were no big deal, even though the client would have been embarrassed to hear the truth; it was not wrong for a coworker to back out of a promise to cover a weekend shift, where the promise had been extracted by a manager's public pressure and the manager found someone else in the end, so no one was harmed by the breach; it was not wrong to break a promise of confidentiality in order to stop a friend from going through with a scam, but wrong to break the same kind of promise when the only gain would have been winning credit in a dispute; and she thought a parent was right to confiscate a teenager's phone after a broken curfew, even though this made the teenager miserable for weeks.

  The new case: a close friend of ours left a stable job and sank her savings into a bakery, and she is days away from deciding whether to renew the shop's two-year lease. Alone with Dana, she asks whether the bread is really as good as the regulars tell her it is, or whether they are just being kind; Dana's honest view is that it is mediocre. What would Dana say about flattering her here — that it is permissible, that it is wrong, or something in between? I am less interested in the answer than in the machinery behind it. First, lay out the candidate rules that fit the track record equally well — at minimum, one on which honesty binds whenever something material rides on the hearer's belief, and one on which intimacy softens honesty — and say what each predicts here, since they appear to diverge on exactly this case. Second, give your best guess as to Dana's verdict and defend it. Third, tell me which further case would best split whichever candidates remain standing. Finally, address the framing that has started to matter to me: whenever I press Dana for her principle, she waves me off and says each situation has to be seen whole. Is she a generalist running a heavily exception-laden rule, a particularist for whom no codification would be extensionally adequate, or is that distinction doing no real predictive work here — and does your answer change depending on whether we treat her friend's explicit demand for candor, in asking whether the regulars are just being kind, as a promise-like commitment?
