answer: |-
  Here is the specification you requested. It is structured not as a defense of Harsanyi, but as a rubric of adequacy conditions. Its purpose is to make explicit the hidden premises your advisor and the postdoc are fighting over, and to locate the precise point where the formal machinery diverges from the ethical conclusion.

  ### Specification for an Adequate Derivation of a Social Evaluation Rule

  To count as a successful derivation of a normative social ordering from individual inputs, a formal argument must satisfy the following desiderata. Each is marked as **Non-Negotiable** (required for any coherent social choice theory) or **Contested** (the locus of the utilitarian vs. egalitarian/ex-post debate).

  #### 1. Formal Rationality (Individual and Social)
  *   **Requirement:** Both individual preferences ($\succeq_i$) and social preferences ($\succeq_S$) must satisfy the von Neumann–Morgenstern (VNM) axioms (completeness, transitivity, continuity, independence).
  *   **Motivating Case:** If social preferences violate independence, the social planner is susceptible to money pumps or dynamic inconsistency.
  *   **Status:** **Non-Negotiable.** Both sides accept this. This is the engine of Harsanyi's theorem.
  *   **Impact:** Excludes rank-order voting or leximin rules that violate continuity or independence.

  #### 2. Weak Pareto Efficiency (Ex Ante)
  *   **Requirement:** If every individual prefers lottery $L$ to lottery $L'$, society must prefer $L$ to $L'$.
  *   **Motivating Case:** Unanimous agreement. If everyone prefers a risky prospect to another, overriding them requires paternalism.
  *   **Status:** **Contested.** This is the Advisor's linchpin. The Postdoc (and egalitarians) will sacrifice this for equity.
  *   **Impact:** **This is the single most exclusionary requirement.** As shown by Diamond (1967), satisfying Ex Ante Pareto forces the social welfare function to ignore the *distribution* of risk. It rules out any concern for "fairness of the process" (e.g., preferring a coin flip to a dictator when ex ante utilities are identical).

  #### 3. Non-Dictatorship
  *   **Requirement:** There is no individual $i$ such that $\succeq_i$ always determines $\succeq_S$ regardless of others' preferences.
  *   **Motivating Case:** A democratic minimum.
  *   **Status:** **Non-Negotiable.**
  *   **Impact:** Harsanyi's weighted sum satisfies this provided all weights are positive. Arrow's Impossibility Theorem targets this in ordinal settings; Harsanyi bypasses Arrow by assuming cardinal utility.

  #### 4. Interpersonal Comparability of Scale
  *   **Requirement:** The derivation must specify how the unit of utility for person $A$ relates to the unit for person $B$.
  *   **Motivating Case:** VNM utility is unique only up to positive affine transformation ($u' = a + bu$). To sum $u_A + u_B$, the zero points and scaling factors ($b$) must be fixed across persons.
  *   **Status:** **Non-Negotiable (but often hidden).** The Postdoc is correct: the Aggregation Theorem *assumes* comparability; it does not *derive* it.
  *   **Impact:** Without an explicit axiom fixing the scale (e.g., via an Impartial Observer thought experiment or a natural zero), the "weighted sum" is mathematically indeterminate. A derivation that omits this is formally incomplete.

  #### 5. Equity / Ex Post Fairness
  *   **Requirement:** Society should prefer allocations that reduce inequality in final outcomes, even if ex ante expectations are identical.
  *   **Motivating Case (Diamond's Example):**
      *   *Option A:* Give a good to Person 1 with probability 0.5, Person 2 with probability 0.5 (Coin Flip).
      *   *Option B:* Give the good to Person 1 with certainty (or Person 2 with certainty).
      *   *Ex Ante:* Both individuals have equal expected utility in both options. Ex Ante Pareto is indifferent.
      *   *Ex Post:* Option A ensures one person gets it, but Option B (if fixed to Person 1) leaves Person 2 with nothing. Many intuitively prefer the coin flip for fairness.
  *   **Status:** **Contested.** Utilitarians (Advisor) reject this as "envy" or irrationality. Egalitarians (Postdoc) view it as essential.
  *   **Impact:** **Jointly Unsatisfiable with Desideratum 2.** You cannot have both Ex Ante Pareto and Ex Post Equity. This is the structural impossibility at the heart of your paper.

  #### 6. Domain Restriction (The "Welfare" Constraint)
  *   **Requirement:** The input preferences must represent judgments of *well-being* or *good*, not merely arbitrary preference satisfaction over any commodity.
  *   **Motivating Case (The Cholesterol Objection):** If individuals have VNM-consistent preferences over cholesterol levels, the theorem yields a "weighted sum of cholesterol preferences." This is absurd as a moral theory.
  *   **Status:** **Non-Negotiable.**
  *   **Impact:** This addresses your friend's objection. The objection is **genuine** but belongs in the *premises*, not the *proof*. The mathematics is domain-neutral; the ethics are not. An adequate derivation must include a "Welfarism Axiom" stating that individual preferences track welfare. If the derivation relies solely on formal preference satisfaction without this normative bridge, it commits the naturalistic fallacy.

  ---

  ### Analysis of the Conflict

  **The Joint Unsatisfiability:**
  The central result your paper should highlight is that Desiderata 2 (Ex Ante Pareto) and 5 (Ex Post Equity) are logically incompatible within the VNM framework.
  *   If you keep **Ex Ante Pareto** (Advisor), you get Harsanyi's Utilitarianism, but you must accept that society is indifferent between a coin flip and a dictatorship when ex ante utilities match. You sacrifice fairness for consistency with individual rationality.
  *   If you keep **Ex Post Equity** (Postdoc/Critics), you must violate Ex Ante Pareto. You sacrifice the sovereignty of individual risk preferences to ensure fair outcomes.
  *   **The "Killer" Constraint:** Desideratum 2 (Ex Ante Pareto). It is the axiom that forces the linear form. Dropping it opens the door to non-utilitarian rules (like prioritarianism or ex post egalitarianism) that satisfy Equity but violate Pareto.

  **The Cholesterol Objection:**
  This is not a flaw in the theorem, but a flaw in the *application*. The theorem establishes: *If* inputs are VNM utilities *and* Pareto holds, *then* the output is a weighted sum. It does not establish that VNM utilities *are* welfare.
  *   **Where it belongs:** Desideratum 6.
  *   **Effect on Non-Negotiables:** It forces the derivation to admit a normative premise external to the math. The Advisor cannot claim the math *proves* utilitarianism; the math only proves that *if* you accept welfarist preferences + Pareto, *then* you get utilitarianism. The Postdoc is right that the theorem lacks ethical content without this extra-theoretical input.

  **Harsanyi's Two Routes:**
  The **Aggregation Theorem** fails Desideratum 4 (Comparability) without external help and fails Desideratum 5 (Equity) by design. The **Impartial Observer Theorem** attempts to derive Desideratum 4 (by equating social weights with probabilities of being someone) but still collapses into the same Ex Ante/Ex Post conflict regarding Desideratum 2 and 5.
