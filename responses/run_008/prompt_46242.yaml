          *   List cases the derivation must get right/wrong (e.g., coin flip fairness, ex ante vs. ex post, dictatorship).
          *   Distinguish distinctions (vNM utility vs. utilitarian summability, ex ante vs. ex post, impartial observer vs. social aggregation).
          *   Address axiom compatibility (Hammond equity vs. ex ante Pareto).
