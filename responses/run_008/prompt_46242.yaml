      *   *Postdoc's View:* Harsanyi = Functional Form. VNM utilities are ordinal up to affine transformation *per person*. Summing them requires a common scale (interpersonal comparability) which the theorem doesn't provide.
      *   *The "Cholesterol" Objection:* If the math works for anything preferences are defined over, does "welfare" add anything? This touches on the *domain* of the preferences (welfare vs. other goods).

  3.  **Drafting the Desiderata (The Specification):**
      *   I need to structure this as a list of requirements that a "Social Evaluation Rule Derivation" must meet.
      *   I need to categorize them: Formal, Ethical/Normative, and Interpretative.
      *   I need to highlight the tensions (Impossibility Results).

      *   *Requirement 1: Formal Consistency (VNM).* Both individual and social preferences must satisfy rationality axioms (completeness, transitivity, continuity, independence).
      *   *Requirement 2: Pareto Efficiency.* If everyone prefers $A$ to $B$, society must prefer $A$ to $B$. (Ex Ante vs. Ex Post distinction is crucial here).
      *   *Requirement 3: Non-Dictatorship.* No single individual dictates the social ordering.
      *   *Requirement 4: Interpersonal Comparability/Scale.* The units must be comparable to sum them. (This is the Postdoc's point).
      *   *Requirement 5: Equity/Fairness.* Handling risk distribution (the coin flip case).
      *   *Requirement 6: Domain Restriction (The "Welfare" constraint).* Preferences must be about *well-being*, not just anything (addressing the Cholesterol objection).

  4.  **Refining the Tensions (The "Meat" of the paper):**
      *   *Ex Ante Pareto vs. Equity:* This is the big one. Diamond (1967) showed that Ex Ante Pareto conflicts with fairness in risk distribution. If you satisfy Ex Ante Pareto (Harsanyi), you ignore the fairness of the *process* (coin flip vs. certainty). If you care about fairness (Hammond/Ex Post), you violate Ex Ante Pareto.
      *   *The "Cholesterol" Objection:* This is about the *interpretation* of the utility function. VNM utility represents preference satisfaction. Utilitarianism requires preference satisfaction *to be welfare*. The theorem doesn't bridge that gap. This belongs in the "Interpretative/Domain" requirement.
      *   *The "Killer Constraint":* It's likely the joint satisfaction of Ex Ante Pareto and Equity (or Ex Post Equity). This is where the impossibility lies.

  5.  **Addressing the "Cholesterol" Objection specifically:**
      *   Is it a confusion? Yes and no. Mathematically, the aggregation holds for any VNM preferences. Normatively, it fails if those preferences aren't welfarist.
      *   Where does it belong? In the "Input Validity" desideratum.
      *   Impact: It forces the derivation to include a premise that individual preferences track *good*, not just *choice*.

  6.  **Structuring the Response:**
