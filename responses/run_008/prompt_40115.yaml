  1. **The positions, briefly**
  Contextualists argue the semantic content of "knows" shifts with the attributor's conversational context; in high-stakes discussions, the bar for truth rises implicitly within the conversation. Interest-Relative Invariantists (IRI) contend semantics are fixed, but knowledge itself depends on the subject's practical stakes; you know less when more is on the line for you personally. Relativists propose truth is assessment-sensitive; a claim's truth-value varies depending on who evaluates it and their specific epistemic standards at the time of assessment. All three accommodate the same shifty intuitions (e.g., DeRose's Bank Case) but locate the variability differently: in semantic content, metaphysical conditions, or truth-relativity. They agree the data shifts but disagree on whether the shift is in the word, the world, or the judge. This tripartite split defines the contemporary landscape of epistemic modals.

  2. **Diagnosis**
  Your hypothesis is astute: the stalemate is largely methodological, rooted in how we treat linguistic data. Contextualists treat intuitions about assertability as direct evidence for semantic content. They argue that when stakes rise, the proposition expressed by "S knows" changes implicitly. Invariantists argue these are merely pragmatic implicatures about conversational propriety, not truth-conditions. They claim the proposition stays fixed, but our willingness to assert it fluctuates based on social norms. Relativists add another layer, suggesting truth itself is relative to the assessor, complicating the data further. However, dismissing it as *merely* verbal overlooks the substantive normative stakes. IRI, for instance, claims knowledge is essentially action-guiding; if stakes change rational action, they change knowledge conditions. Contextualists deny this, preserving knowledge as a purely evidence-based state independent of action.

  The deadlock persists because linguistic intuitions are underdetermined. We lack a neutral metric to distinguish "what is said" from "what is implicated" without begging the question. Experimental philosophy has complicated matters by showing intuitions vary demographically, undermining the "ordinary speaker" evidence all sides cite. Consequently, the dispute sits at the intersection of philosophy of language and metaphysics. Without agreement on whether epistemology should analyze the concept "knowledge" or the state of knowing, positions talk past one another. It is not simply verbal, but it is linguistically mediated. The substantive core is whether practical interests can constitute epistemic warrant, but the methodological fog prevents consensus on whether our language reflects that reality or obscures it. The equilibrium is stable because each side protects different theoretical virtues. Contextualists save the intuition that knowledge is evidence-based; IRI saves the intuition that knowledge guides action. Ultimately, the dispute is about theoretical virtue allocation. We are arguing over which bug to treat as a feature. Until we agree on whether epistemology is descriptive linguistics or normative metaphysics, the stalemate holds. The data is too thin to support the weight of the metaphysical claims being placed upon it. There is a genuine substantive dispute about the normativity of belief, but it is obscured by a layer of semantic disagreement that the standard cases cannot pierce. The cases are too simplistic to isolate the variables. We need richer data than bank cases to separate semantic shift from pragmatic pressure. The methodological disagreement about the authority of intuition is the real barrier. You correctly identify that the fight is over whether intuitions are semantic data or psychological artifacts.

  3. **What would count as progress**
  Progress requires abandoning the hope that ordinary usage dictates metaphysical reality. A fruitful path lies in formal semantics modeling "knows" alongside other context-sensitive normative terms like "ought" or "flat." If "knows" patterns with gradable adjectives, contextualism gains ground; if it patterns with moral norms, IRI might win. Alternatively, cognitive science could reveal whether humans psychologically separate evidence from stakes. If neural processing treats high-stakes evidence differently, IRI has empirical backing. However, many suspect no single theory will win. Progress may instead mean mapping the trade-offs: contextualism preserves semantic simplicity but complicates communication; IRI preserves metaphysical realism but complicates the nature of justification. Accepting a pluralistic framework, where different knowledge concepts serve different theoretical purposes, might dissolve the demand for a unique solution. We may need to stop asking what "knows" means and start asking what work we want it to do. This shifts the goal from discovery to engineering. We construct the concept that best serves our epistemic goals rather than finding the one true definition hidden in language.

  4. **A note for the novelist**
  None of this should constrain your craft. Your intuition—that "knew" depends on narrative stakes and temperature—is philosophically sophisticated, echoing IRI and contextualism blended. Fiction operates on narrative truth, not metaphysical rigor. In a thriller, "she knew" signals commitment and drives plot, not epistemic certification. Trust your ear. The philosophers are stuck because they must account for every usage; you only need to serve the story. Use "knew" when it feels true to the character's perspective. Your narrative context sets the stakes, making your usage correct within the book.
