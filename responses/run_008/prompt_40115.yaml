      *   **Pragmatic Encroachment/Interest-Relative Invariantism (IRI) (e.g., Stanley, Fantl & McGrath):** The truth-conditions depend on the *subject's* practical stakes. Meaning is invariant, but whether the belief counts as knowledge depends on how much it matters to the believer.
      *   **Relativism (e.g., MacFarlane, Egan):** Truth is relative to the *context of assessment*. A claim can be true for me now but false for you later (or vice versa), depending on our epistemic standards.
      *   **The User's Hypothesis:** The stalemate is methodological. Is it semantics? Pragmatics? Metaphysics? Are we arguing about the word "knows" or the state of knowing?

