  ### Defense of the Reconstruction

  To reconstruct Gaṅgeśa's view, we must begin with the Navya-Nyāya definition of *śabda* (verbal testimony). In the *Tattvacintāmaṇi*, Gaṅgeśa refines the classical position that *śabda* is the statement of an *āpta* (a reliable person). For Nyāya, reliability (*āptatva*) is not merely a track record of accuracy; it is grounded in the metaphysical status of the speaker. An *āpta* must possess direct knowledge of the object (*yathārtha-jñāna*) and the sincere desire to communicate that truth (*yathārtha-pravṛtti*). Crucially, this requires *cetana* (consciousness) and *tātparya* (specific intention to convey a particular meaning).

  **The Bare LLM: Epistemically Inert**
  Gaṅgeśa would classify the outputs of a bare LLM as *not a pramāṇa*. While the model produces linguistic strings that resemble testimony, it lacks the requisite causal factors. An LLM is *jada* (insentient matter); it predicts tokens based on statistical weights rather than knowing the truth or intending to convey it. In Nyāya terms, a parrot speaking Sanskrit does not generate *śabda-pramāṇa* because the bird lacks understanding and intention. Similarly, an LLM is a sophisticated *yantra* (machine). Even if its output is true (*yathārtha*), without a valid *pramāṇa* (instrument of knowledge) causing that cognition, the truth is accidental (*yadṛcchā*). Nyāya realism demands that valid knowledge (*pramā*) arises from a specific causal chain; a broken chain (no *āpta*) yields true belief only by luck, not knowledge.

  The anti-reductionist stance of Nyāya regarding testimony—that we do not need to infer reliability every time we hear a statement—does not save the LLM. This irreducibility applies only when the source is *already established* as an *āpta*. Since the LLM is known to be a statistical engine without beliefs, the hearer cannot bypass the check for reliability; the source fails the ontological criteria before the epistemic process begins.

  **The Retrieval-Augmented LLM: Mediated Testimony**
  The classification shifts with the retrieval variant. Here, the LLM acts as a medium for human-authored documents. Nyāya accepts written testimony as valid *śabda* because the text preserves the *tātparya* of the original author. If the retrieval system accurately grounds claims in human sources, the epistemic status derives from the human authors (the *āptas*), not the model. The model becomes akin to a letter or a scribe. However, Gaṅgeśa would press on the fidelity of the transmission. If the LLM summarizes or distorts the retrieved text (a known risk), the *tātparya* is altered, breaking the chain. If the verification layer ensures strict fidelity, the output qualifies as *derived testimony*—valid *śabda* originating from the human authors, merely transmitted via a mechanical instrument.

  **Accidental Truth**
  Regarding the accurate claims made by a bare LLM, Gaṅgeśa would argue these are *tathābhūta* (so-it-is) but not *pramā* (valid knowledge) relative to the user's cognition of the source. Just as a broken clock is right twice a day without being a valid instrument of timekeeping, an LLM producing truth without knowledge generates no *pramāṇa*. The user might gain true belief, but without a valid instrument, it lacks the certification of knowledge (*pramāṇavyavasthā*).

  ### Most Uncertain Aspect

  The most uncertain aspect of this reconstruction is how Gaṅgeśa would handle the **aggregate authorship of the training corpus**. Nyāya accepts the Veda as *apauruṣeya* (authorless) yet valid because it is eternally truthful. A defender might argue the training corpus represents a "collective *āpta*" (humanity's recorded knowledge). It is unclear whether Gaṅgeśa would view the statistical distillation of this corpus as a valid transmission of collective testimony (analogous to the Veda) or as a fundamental corruption of individual *tātparya* (intention), rendering the aggregate epistemically void. This tension between collective reliability and individual intention remains unresolved in classical texts.
