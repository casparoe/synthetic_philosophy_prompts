  Elsie's case law establishes **Suffering** as the primary veto (battery eggs, foie gras, lobster). Death itself isn't forbidden (crickets, roadkill), but cruelty is. However, a latent rule may be **No Killing Mammals**, as she hasn't endorsed eating mammal flesh yet (pheasant = bird, crickets = insects). She rides horses (mammals) but doesn't eat them, suggesting a species boundary.

  **Verdicts:**

  *   **Wool:** **Wrong.** Docking without anaesthetic causes pain. Her ban on boiling lobsters proves suffering matters even without death. Preventative pain is still pain.
  *   **Venison:** **Fine.** Matches the roadkill pheasant precedent: wild life, quick death. The "No Killing Mammals" rule likely yields to the "Wild/Natural" exception she already accepts.
  *   **Pork:** **Wrong.** While the life/death conditions satisfy the Suffering rule, this breaches the untested mammal boundary. Farmed mammals, even happy ones, risk normalizing the battery/foie gras systems she opposes. She accepts neighbour's *eggs* (no kill), not neighbour's *meat*.

  **The Splitter:**

  To distinguish "Suffering Only" from "No Killing Mammals," ask: **"If the neighbour's pig died of old age, would you eat it?"**

  *   If **Yes**, her objection is to *killing*, not meat. The Suffering Rule is supreme.
  *   If **No**, her objection is to *mammal flesh* or *farming*. The Species/Killing Rule stands.

  This isolates the act of killing from the suffering involved. If she eats the naturally dead pig, your pork shoulder is theoretically permissible under her ethics (painless death), provided you can convince her the farm conditions match the "old age" welfare standard. If she refuses the dead pig, the pork shoulder is definitely off the menu, regardless of how happy the pig was. This hypothetical forces her to clarify whether the sin is the taking of life or the consumption of the animal itself.
