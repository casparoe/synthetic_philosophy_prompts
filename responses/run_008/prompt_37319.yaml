answer: |-
  Case A: Elena works as a freelance graphic designer in a city where health insurance premiums are zip-code rated. She chooses not to purchase disability insurance, preferring to invest the money in her children's education. When she develops severe repetitive strain injury and can no longer work, she faces financial ruin. On the surface, this is option luck: she gambled on her health and lost. However, the premium rates in her zip code were triple the national average due to historical redlining policies she did not choose and cannot escape. Her "choice" to forgo insurance was made from a menu priced by brute luck; the alternative to gambling was immediate deprivation, not prudent security. The loss flows from her decision, but the decision's structure was dictated by unchosen circumstance.

  Case B: Marcus operates a small farm in a isolated valley dependent on a single aquifer. Due to a natural, unanticipated geological shift, the aquifer salinizes overnight, rendering the land useless for every farmer in the valley equally. Marcus loses his livelihood and savings. This is textbook brute luck: no human agency caused the shift, and no choice mitigated it. However, because every resident suffers the exact same proportional loss, the relative distribution of resources remains perfectly equal. No one is worse off than anyone else. The loss is absolute, but the inequality metric—the core currency of luck egalitarian justice—registers zero deviation.

  **Walkthrough**
  In Case A, the brute/option luck line flips because the *voluntariness* of the choice is undermined by upstream brute luck. Standard luck egalitarianism denies compensation for option luck (the gamble). The verdict flips to **compensate** because the "option" to insure was not real; the cost was determined by unchosen zoning history. The single feature doing the work is the *pricing constraint*: when the cost of avoidance is set by brute luck, the exposure to risk inherits the status of brute luck. In Case B, the line flips because the *metric* of justice is comparative, not absolute. Standard luck egalitarianism compensates brute luck. The verdict flips to **deny** because compensation is owed only to neutralize *inequality*, not misfortune itself. The single feature doing the work is *universal impact*: when brute luck is distributed equally, it ceases to be an injustice requiring rectification.

  **Stress-Test**
  If we switch to an absolute metric of disadvantage (sufficientarianism), Case B flips back: Marcus suffers absolute hardship, so he is owed aid regardless of equality. Case A remains stable: Elena suffers absolute hardship compounded by constraint. If we make Elena's alternatives genuinely open (e.g., affordable insurance was available but she chose sushi instead), Case A flips back to **deny**: the choice becomes genuine option luck, and the upstream brute luck becomes irrelevant to the specific loss. Case B survives the stress test only if we stick strictly to relational equality; any introduction of relative advantage (e.g., one farmer had flood insurance) restores the duty to compensate Marcus.

  **Anderson Objection**
  Your roommate is correct that Case B closely mirrors the "levelling down" objection and Anderson's critique that luck egalitarianism abandons the needy if their suffering is shared. However, this does not kill the paper; it fortifies it. Your thesis is not that luck egalitarianism is the *correct* moral theory, but that it *commits* to these inverted verdicts when pushed to logical consistency. Acknowledging the overlap with Anderson demonstrates that you understand the broader philosophical landscape: you are using internal contradictions (the inversion) to highlight the external flaws (the abandonment) that relational egalitarians identify. The paper succeeds by showing that these aren't just edge cases, but structural features of the view.

  \answer{Case A: compensate; Case B: deny}
