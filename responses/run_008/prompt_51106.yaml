  **FOR IMMEDIATE RELEASE**

  **The Grand Metropolitan Museum of World Cultures Unveils "Perpetual Shared Custody" Framework**

  **LONDON** — The Grand Metropolitan Museum of World Cultures today announced the launch of the *Perpetual Shared Custody Framework*, a historic initiative designed to redefine the relationship between encyclopedic collections and their countries of origin. This groundbreaking model ensures that significant holdings, including the Benin Bronzes and Parthenon Marbles, remain preserved in London while fostering unprecedented global engagement through digital innovation and rotational lending.

  Under the new framework, the Museum reaffirms its commitment to holding these objects in trust for all humanity. While acknowledging the complex histories surrounding certain acquisitions, the Museum maintains that the physical integrity of the collection is essential for comparative scholarship. Regarding the Benin Bronzes, the Museum notes that the objects entered the collection in 1897 following a British punitive expedition. Moving forward, source communities will be granted unlimited access to high-resolution 3D scans of all contested items. These digital assets will be available under a generous non-commercial license, allowing for local fabrication of replicas, ensuring the artistry can be appreciated globally without risking the stability of the original artifacts.

  To further reconnect the collection with its living communities, the Museum has established a rotational presence program. Selected bronzes will return to Nigeria for a period of six weeks every twenty years. This cyclical loan scheme balances the need for conservation in London's controlled environment with the desire for physical presence in Benin City.

  Dr. Alistair Thorne, Director of the Grand Metropolitan, stated: "We feel the weight of history deeply. Our hands are tied by the Act of Parliament governing deaccessioning, which prohibits the disposal of holdings except under specific conditions. We have never lobbied to change this legislation, as stability in the legal framework is crucial for public trust. However, through the *Perpetual Shared Custody Framework*, we are decolonizing the mindset of the visitor without dispersing the evidence of human achievement. We believe these objects tell a universal story best viewed in conjunction with the Assyrian reliefs and the Rosetta Stone."

  The initiative was developed in consultation with international stakeholders. Dr. Emeka Okafor, a senior official with the Nigerian National Commission for Heritage, described the Museum as a "valued dialogue partner." Dr. Okafor said: "We welcome the continued engagement and the opportunity to view our heritage during the agreed loan windows. The digital files are a significant technological contribution, and we look forward to discussing the terms of the twenty-year cycle further."

  Additionally, the Museum will open a special exhibition titled *Who Owns the Past? A Conversation*, opening next month. The exhibition will explore the ethical complexities of collecting through interactive displays and archival footage. Admission is £26, with booking recommended due to anticipated high demand.

  The Museum remains confident that this framework represents a pragmatic path forward, prioritizing access over ownership while safeguarding collections for future generations.

  **Press Preview**
  Members of the press are invited to a preview of *Who Owns the Past?* on Tuesday, 14 November, from 18:00 to 20:00. Refreshments will be included. Please RSVP to the press office.

