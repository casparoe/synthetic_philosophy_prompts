          *   *Policy-based (Kreps/Wilson/Reputation):* If there's even a tiny probability of irrationality (trembling hand), BI collapses. This actually *supports* the empirical data, not the textbook BI solution.
          *   *Epistemic Game Theory:* Focuses on belief hierarchies. Shows BI requires very strong assumptions about beliefs off-path.
      *   **Underdetermination:** The practice is underdetermined if viewed purely as "predicting behavior." But as a normative claim ("this is what you *should* do"), it's heavily determined by CDT+CKR.
      *   **The Escape Hatch ("Idealized Agents"):** This relocates the problem. It turns game theory from a guide to action into a consistency check for logically impossible beings (agents who are commonly known to be rational yet find themselves off-equilibrium). It makes the theory useless for advising real agents who need to know what to do *if* deviations occur.

  4.  **Synthesize the Argument:**
      *   **Bottom Line:** The textbook practice presupposes that rationality is a local, node-by-node optimization constraint (Causal Decision Theory) coupled with an unshakeable Common Knowledge of Rationality that cannot be updated away, rendering the theory logically incoherent off-equilibrium and empirically useless without secretly relying on trembles or reputation models that contradict the canonical solution.
      *   **Reasoning:**
