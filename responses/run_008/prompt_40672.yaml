          2.  **CDT vs. Policy:** BI treats each decision node as a fresh optimization problem (CDT). FDT/UDT treats the agent as selecting a policy ex-ante. FDT agents in symmetric Centipede games often cooperate (pass) because their decision correlates with the opponent's. Therefore, FDT does *not* license the textbook teaching; it contradicts it.
          3.  **What licenses the practice?** Only strict CDT + CKR licenses BI. However, *Epistemic Game Theory* shows that BI is robust only if beliefs are structured very specifically (Stalnaker's condition).
          4.  **The Escape Hatch:** Claiming it's for "idealized agents" admits the theory doesn't apply to humans. But worse, it doesn't even apply to idealized agents off-equilibrium because the premise (CKR) contradicts the observation (deviation). It makes the solution concept a logical tautology that cannot be instantiated in any possible world where a move is actually made past node 1.
          5.  **Conclusion:** The practice persists because BI is mathematically tractable and serves as a baseline for "Nash Equilibrium in sequential games," but it sacrifices normative guidance for formal elegance. It requires assuming agents cannot learn from deviations, which is anti-Bayesian.

