answer: |-
  The textbook practice presupposes that rationality is strictly local causal optimization under an unupdateable Common Knowledge of Rationality, a combination that is logically incoherent off-equilibrium and unsupported by policy-based decision theories, making the "idealized agent" defense an admission that the theory cannot guide action in any world where deviations occur.

  This practice strictly requires Common Knowledge of Rationality (CKR) combined with Causal Decision Theory (CDT) because Backward Induction (BI) treats each decision node as an independent optimization problem where future selves are trusted to maximize utility without precommitment. CKR is not just a fit; it is a necessary axiom for the proof, because if Player 2 assigns any non-zero probability to Player 1 being irrational (or having different utilities), the induction unravels and passing becomes optimal at early nodes. Your hunch is correct: the framework is incoherent off-equilibrium because standard game theory forbids Bayesian updating on the event of a deviation; if Player 1 passes node 1, CKR is falsified, yet Player 2 is instructed to continue reasoning as if CKR holds to justify exiting at node 2, creating a contradiction where the agent must simultaneously believe the opponent is rational and that the opponent just acted irrationally.

  Rival views of rationality do not license this teaching practice; Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) would typically select a policy ex-ante that cooperates deeper into the game if logical correlation is assumed, while epistemic game theory shows that BI is fragile and requires specific belief structures (like Stalnaker's condition) that are rarely justified. The practice is only underdetermined if you view game theory as purely descriptive mathematics, but as a normative guide, it is rigidly determined by CDT+CKR. The standard escape hatch—that BI predicts idealized agents rather than advising humans—does not save the practice but relocates the problem to a logical impossibility: an "idealized" agent who finds themselves off-equilibrium cannot exist under the theory's own axioms, meaning the solution concept offers no advice for any possible state of the world except the trivial one where the game ends immediately. Textbooks maintain this practice because BI provides a unique, tractable equilibrium concept (Subgame Perfect Nash Equilibrium) that serves as a formal baseline, even though maintaining its status as a "theorem" requires ignoring the epistemic crisis that actual deviations trigger.
