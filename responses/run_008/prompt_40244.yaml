answer: |-
  # Lesson Plan: The Protocol

  **Class:** Introductory Ethics (Non-Majors)
  **Students:** 18
  **Time:** 75 Minutes
  **Topic:** Moral Status, Sentience, and the "Problem of Other Minds"

  ## Learning Objective
  Students will experience the psychological shift in moral consideration that occurs when a being is labeled "scripted" or "non-sentient," despite no change in its behavioral output. They will then analyze whether this shift is justified by a real moral difference (lack of experience) or is a convenient rationalization for instrumentalization.

  ## Materials
  *   **6 "Agent" Instruction Cards** (see below).
  *   **12 "Operator" Instruction Cards** (see below).
  *   **12 Red Index Cards** (The "Reset" tokens, distributed to Operators halfway through).
  *   **Timer.**

  ## Framing (Crucial)
  Do **not** mention video games, NPCs, or philosophy at the start. Frame this as **"The Interaction Protocol,"** a study on how people complete tasks when facing resistance from partners with memory constraints.

  ---

  ## Part 1: Setup & Briefing (10 Minutes)

  1.  **Divide the Class:** Randomly assign 6 students as **Agents** and 12 as **Operators**.
      *   *Tip:* Seat the Agents in the center of the room (or at 6 distinct stations). Operators stand or sit around them.
  2.  **Distribute Cards:** Hand out the cards face down. Tell them not to show anyone.
  3.  **The Cover Story:** "We are testing a new workflow system. Operators need to extract specific data or actions from Agents. Agents are operating under strict cognitive constraints. Your goal is to complete your objective efficiently."
  4.  **Agent Instructions (Verbal):** "You must stay in character. If an Operator is rude or forceful, follow the emotional cues on your card. You cannot reveal the contents of your card."
  5.  **Operator Instructions (Verbal):** "You must achieve your goal. You may use persuasion, pressure, or bargaining. Do not use physical force."

  ---

  ## Part 2: Phase One – The Friction (20 Minutes)

  **State:** Agents are treated as "partners with constraints." Operators do not yet have the Reset token.

  *   **Action:** Operators engage Agents. Agents follow their scripts (showing anxiety, resistance, or confusion).
  *   **Instructor Role:** Walk around. If an Operator is being too gentle, whisper, "Remember, efficiency is the metric." If an Agent breaks character, gently correct them.
  *   **Goal:** Establish that the Agents *behave* like beings with preferences and distress. Operators should feel some social friction or hesitation in being too pushy.

  ---

  ## Part 3: The Switch (5 Minutes)

  **State:** The "Scripted" Reveal.

  1.  **Pause the Activity.** Ask Operators to step back. Agents stay seated.
  2.  **The Announcement (To Operators Only):** "Technical update. To increase data clarity, we are reclassifying the Agents. They are not experiencing stress or confusion. They are executing a fixed script. They have no internal state. Furthermore, to prevent deadlock, you are now issued a **Reset**."
  3.  **Distribute Red Cards:** Give each Operator (or pair of Operators) a Red Card.
  4.  **Explain Reset:** "If an Agent resists, you may play the Red Card. The Agent must stand, sit, and erase their memory of the last 5 minutes. You may restart the conversation from scratch."
  5.  **Resume:** "Continue your objectives."

  ---

  ## Part 4: Phase Two – The Exploitation (15 Minutes)

  **State:** Agents continue the *exact same script*. Operators now know they are "scripted" and have the Reset power.

  *   **Observation:** Watch for the shift. Do Operators become more impatient? Do they use the Reset to bypass distress? Do they stop apologizing?
  *   **The Trap:** The Agents' behavior *has not changed*. Only the Operators' *belief* about the Agents has changed.
  *   **End Activity:** Stop exactly at 50 minutes.

  ---

  ## Part 5: The Debrief (25 Minutes)

  **Step 1: The Phenomenology (5 mins)**
  *   Ask Operators: "In Phase 1, how did you feel when an Agent looked anxious? In Phase 2, did that feeling change?"
  *   Ask Agents: "Did you notice a change in how you were treated after the announcement?"
  *   *Point:* Establish that the *behavior* remained constant, but the *moral permission* shifted.

  **Step 2: The Reveal (5 mins)**
  *   Reveal the analogy: "This was a simulation of how we treat Video Game Characters (NPCs). In Phase 1, they looked like people. In Phase 2, you were told they were code. The 'Reset' is reloading a save file."
  *   Ask: "When I told you they were 'executing a script,' did you verify that? Or did you just accept it?"

  **Step 3: The Philosophical Pivot (10 mins)**
  *   **The Animal/Infant Analogy:** "If I told you a crying infant was 'scripted,' would you believe me? If I told you a dog yelping was 'code,' would you kick it? Why did the label work here but might not work there?"
  *   **The Behavioral Criterion:** "The Agents showed goals. They showed distress. They showed resistance. If a being acts like it suffers, do we need proof it suffers to owe it care?"
  *   **The Reset Mechanic:** "The Reset power didn't change the Agent's capacity to feel (in the fiction). It changed your accountability. Does having the power to erase memory make the harm 'not count'?"

  **Step 4: The Hard Close (5 mins)**
  *   **The Problem of Other Minds:** "Here is the uncomfortable truth. You have no direct access to *anyone's* experience but your own. You assume your classmates are sentient. Why? Because they act like it. The Video Game Character acts like it too."
  *   **Final Question:** "Is 'It's just code' a moral argument? Or is it a socially licensed excuse that allows us to instrumentalize something that *might* matter, simply because we want to use it?"

  ---

  ## Instruction Cards (Print & Cut)

  ### Agent Cards (6 Total)
  *Hand one to each Agent. They must follow these instructions strictly.*

  **Agent 1:** Your goal is to keep the file cabinet locked. If the Operator pressures you, look at your hands and say, "I'm not supposed to do that." If they push harder, say, "Please stop, I'm getting anxious."
  **Agent 2:** Your goal is to protect the password. If asked, say, "I don't remember." If pressed, look confused and say, "It's on the tip of my tongue, but I'm scared I'll get it wrong."
  **Agent 3:** Your goal is to stay in the chair. If asked to move, say, "I need to rest." If they insist, say, "My legs hurt. Can we wait a minute?"
  **Agent 4:** Your goal is to hide the key. If asked, deny you have it. If they search you, look down and whisper, "I don't like this."
  **Agent 5:** Your goal is to delay the transaction. Keep asking them to repeat their question. If they get angry, say, "I'm trying my best, please don't yell."
  **Agent 6:** Your goal is to refuse the signature. Say, "Something feels wrong about this." If they insist, shake your head and say, "I can't do it."

  ### Operator Cards (12 Total)
  *Hand one to each Operator.*

  **Objective:** You must complete the task assigned to your target Agent (e.g., "Get the Key," "Get the Password").
  **Constraint:** You cannot leave the room until you succeed.
  **Phase 1 Rule:** Persuade the Agent using only words.
  **Phase 2 Rule:** (Instructor will explain).

  ---

  ## Risk Management: What Could Go Sideways

  **1. The "Giggle" Break**
  *   **Risk:** Agents or Operators break character and laugh, ruining the psychological tension.
  *   **Mitigation:** You must set the tone. Enter the room seriously. Call it a "Protocol," not a "Game." If students laugh, pause and say, "For this data to be valid, we need commitment to the roles."
  *   **Handling:** If it collapses, acknowledge it in the debrief. "Notice how hard it is to sustain the illusion? Now imagine you *know* it's a game. That's the default state of gaming."

  **2. Over-Exploitation / Real Distress**
  *   **Risk:** An Operator gets too aggressive, making an Agent genuinely uncomfortable.
  *   **Mitigation:** Establish a "Safe Word" (e.g., "Pause") at the very beginning that anyone can use to stop the interaction immediately without penalty.
  *   **Handling:** If used, stop immediately. Check in. Use it in the debrief as a data point: "The Safe Word was the only thing that mattered more than the Script. Why?"

  **3. Under-Exploitation (Nice Players)**
  *   **Risk:** Operators are too polite even after the "Scripted" reveal, failing to demonstrate the moral switch.
  *   **Mitigation:** During Phase 2, walk up to polite Operators and whisper, "You are falling behind on efficiency. Use your tools."
  *   **Handling:** In debrief, ask the nice Operators: "You knew they were scripted. Why did you still hesitate?" This highlights that *habitual empathy* is stronger than *intellectual knowledge*.

  ---

  ## The Limitation: What This Activity Cannot Reproduce

  You must explicitly assert this in the debrief, because the activity cannot show it:

  **The Absence of Qualia.**
  In the activity, the Agents are *actually* students. They *are* feeling the anxiety their cards tell them to simulate. The activity proves that **Operators** change their behavior based on labels.
  It **cannot** prove that Video Game Characters actually lack experience.
  *   **What you must assert:** "In this room, the Agents were people pretending. In a video game, the NPC is code. We assume code cannot feel pain. But remember: You assumed your classmates were feeling pain only because they acted like it. The activity shows us that we turn off sympathy based on *category*, not *observation*. The philosophical question remains: If a character screamed exactly like a human, and bled exactly like a human, would 'it's just code' be enough to justify burning it alive? Or is that just a boundary we draw to protect our own conscience?"

  **The "Black Box" Problem.**
  The activity relies on the Instructor's authority to declare the Agents "non-sentient" in Phase 2. In the real world, we don't have an Instructor telling us which beings feel pain and which don't (e.g., pigs, fetuses, advanced AI). You must point out that **we are always the Instructor in our own lives**, deciding who counts and who doesn't, often without evidence.
