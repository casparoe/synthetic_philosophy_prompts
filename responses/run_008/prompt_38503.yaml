          Third, **the legal reality**. In most places, brain death *is* death. Keeping the ventilator running past this point is medically futile and legally distinct from life support for a coma. The Friday deadline exists because hospitals cannot maintain dead bodies indefinitely.

          You are not deciding if he is dead; the doctors have determined that. You are deciding how to honor him in the aftermath. Listen to your brother for the facts, but listen to your mom for the love.

