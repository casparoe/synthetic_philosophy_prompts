  2.  **Internal Brainstorming & Landscape Mapping:**
      *   *The Objection:* This is the "problem of overdetermination" or "inefficacy." If the outcome happens regardless of my act, am I responsible? Utilitarians usually struggle here. Deontologists might escape via duty regardless of outcome. Virtue ethicists focus on character.
      *   *Case 1: Voting.* Probabilistic. My vote matters only if it's pivotal (ties or one-vote margin). Probability is tiny. Expected utility = (Benefit * Probability) - Cost. Often comes out negative for pure utility, but people vote for expressive reasons or duty.
      *   *Case 2: Drop of Water (Sorites/Heap).* Each drop makes a difference, but imperceptible. This is the "imperceptible harm" problem. Parfit discusses this. If harm is continuous, every drop adds to the total. The issue is epistemic (can we measure it?) vs. ontological (does it exist?).
      *   *Case 3: Carbon Emissions/Thresholds.* Non-linear harm. Maybe one ton doesn't trigger a tipping point, but a million does. This is the "threshold" view. If I'm below the threshold, did I cause harm? Some argue for expected utility across possible thresholds.
      *   *Replies:*
          1.  *Expected Utility:* Even if unlikely to be pivotal, the stakes are high enough (voting) or the probability of crossing a threshold is non-zero (carbon).
          2.  *Complicity/Integrity:* It's not about outcomes, it's about what kind of person you are or being part of a harmful group (Kantian/Virtue).
          3.  *Imperceptible Differences:* Reject the idea that imperceptible = nonexistent. Parfit's "harmless torturers."
      *   *Engineering Analogies:*
          1.  *Expected Utility:* Load balancing. One request might trigger a cascade failure (rare but high cost).
          2.  *Complicity:* Contributing to a botnet. Even if your node doesn't crash it, you're part of the attack.
          3.  *Imperceptible:* Floating point errors. Tiny errors accumulate to crash a system.
      *   *Assessment:* The weakest link is usually the assumption that "no perceptible difference" equals "no causal difference."

