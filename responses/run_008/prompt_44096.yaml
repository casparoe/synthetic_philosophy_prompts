          *   *Draft:* I find the "Imperceptible Harm" reply most robust. The weakest link in the inefficacy argument is the assumption that if a difference cannot be measured, it does not exist. Reality is continuous, not discrete. While the Expected Utility and Complicity arguments have merit, they rely on specific models of risk or social identity. The core error is ontological: treating the world as if it rounds to zero. Just as a bridge collapses due to cumulative stress no single truck caused, moral harm accumulates below the threshold of perception. We are off the hook only if we deny the physics of the situation.

