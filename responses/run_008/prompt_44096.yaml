answer: |-
  1. "The objection, sharpened"
  The argument rests on two distinct premises: one causal, one moral. The causal claim asserts that in large-scale collective problems, a single individual's action makes no detectable difference to the outcome. One vote rarely decides an election; one burger doesn't alter supply chains; one flight doesn't shift climate trajectories. The moral claim follows: if an action produces no net change in welfare or outcome, it carries no moral weight. Therefore, since my individual contribution effectively rounds to zero, I am morally exempt from participating in the solution. This isn't necessarily selfishness; it's a claim about efficacy. If the system absorbs my input without altering its state, demanding my sacrifice is irrational. The force of the argument lies in its mathematical plausibility: why pay a cost for zero return?

  2. "Where it bites hardest"
  The voting case is actually the weakest target for this objection. While the probability of being pivotal is low, the stakes are enormous, so the "expected utility" remains calculable. The carbon case is harder because climate harm involves complex thresholds; one ton might genuinely fail to trigger a specific disaster. However, the "drop of water" case poses the deepest philosophical trouble. Here, the claim is that each drop makes a difference, but the difference is imperceptible. If harm requires a perceptible worsening of condition, then no single drop harms anyone. This challenges the definition of harm itself. Unlike voting (where the mechanism is clear) or carbon (where thresholds might exist), the water case forces us to admit that reality is composed of differences too small to measure yet allegedly morally significant. It attacks the link between causal contribution and moral experience.

  3. "The main replies"
  First, the *Expected Utility* reply argues that while the chance of mattering is small, it isn't zero. In voting, if your candidate wins by one vote, the benefit is huge. In carbon emissions, there's a non-zero probability your specific emission crosses a hidden climate threshold. The moral weight is the probability multiplied by the stakes. Objection: In many cases, the probability is so vanishingly small that rational actors should still ignore it, making the obligation feel illusory.

  Second, the *Complicity* reply shifts focus from outcomes to integrity. Even if your act changes nothing, participating in a harmful practice makes you morally accountable for the collective result. You don't want your hands dirty, regardless of the splash. Objection: This risks fetishizing purity over actual good. If your sacrifice truly changes nothing, is it virtue or just vanity?

  Third, the *Imperceptible Harm* reply denies that unnoticeable differences are morally null. Just as a million pennies make a fortune, a million imperceptible harms make a tragedy. To deny this is to accept magic—that harms appear only when they become visible. Objection: This demands we treat infinitesimal causal impacts as morally equivalent to visible ones, which strains our intuitive sense of proportionality and responsibility. It requires us to act on differences we cannot verify, which is cognitively demanding.

  4. "An engineer's translation"
  The *Expected Utility* reply is like handling a race condition. You code for the edge case where your request is the one that tips the database lock, even if it rarely happens. Breakdown: Unlike code, moral probabilities aren't well-defined variables. The *Complicity* reply is like refusing to join a botnet. Even if your node doesn't crash the server, running the script makes you part of the attack vector. Breakdown: In ethics, "participation" is fuzzier than running a script. The *Imperceptible Harm* reply is like floating-point error accumulation. One rounding error doesn't crash the system, but denying its existence guarantees eventual failure. Breakdown: In ethics, we lack the precision to track these "errors," making the obligation feel abstract compared to a deterministic crash.

  5. "Your overall assessment"
  I find the "Imperceptible Harm" reply most robust. The weakest link in the inefficacy argument is the assumption that if a difference cannot be measured, it does not exist. Reality is continuous, not discrete. While the Expected Utility and Complicity arguments have merit, they rely on specific models of risk or social identity. The core error is ontological: treating the world as if it rounds to zero. Just as a bridge collapses due to cumulative stress no single truck caused, moral harm accumulates below the threshold of perception. We are off the hook only if we deny the physics of the situation.
