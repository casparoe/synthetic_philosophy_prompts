          *   *Draft:* The voting case is actually the weakest target for this objection. While the probability of being pivotal is low, the stakes are enormous, so the "expected utility" remains calculable. The carbon case is harder because climate harm involves complex thresholds; one ton might genuinely fail to trigger a specific disaster. However, the "drop of water" case poses the deepest philosophical trouble. Here, the claim is that each drop makes a difference, but the difference is imperceptible. If harm requires a perceptible worsening of condition, then no single drop harms anyone. This challenges the definition of harm itself. Unlike voting (where the mechanism is clear) or carbon (where thresholds might exist), the water case forces us to admit that reality is composed of differences too small to measure yet allegedly morally significant. It attacks the link between causal contribution and moral experience.

      *   **3. The main replies:**
          *   Need 3 distinct lines + objection to each.
          *   1. Expected Utility (Probabilistic Thresholds).
          *   2. Complicity/Integrity (Non-consequentialist).
          *   3. Rejection of Imperceptibility (Parfit-style).
          *   *Draft:* First, the *Expected Utility* reply argues that while the chance of mattering is small, it isn't zero. In voting, if your candidate wins by one vote, the benefit is huge. In carbon, there's a probability your emission crosses a hidden threshold. The moral weight is the probability multiplied by the stakes. Objection: In many cases, the probability is so vanishingly small that rational actors should still ignore it, making the obligation feel illusory.
          Second, the *Complicity* reply shifts focus from outcomes to integrity. Even if your act changes nothing, participating in a harmful practice makes you morally accountable for the collective result. You don't want your hands dirty, regardless of the splash. Objection: This risks fetishizing purity over actual good. If your sacrifice truly changes nothing, is it virtue or just vanity?
          Third, the *Imperceptible Harm* reply denies that unnoticeable differences are morally null. Just as a million pennies make a fortune, a million imperceptible harms make a tragedy. To deny this is to accept magic—that harms appear only when they become visible. Objection: This demands we treat infinitesimal causal impacts as morally equivalent to visible ones, which strains our intuitive sense of proportionality and responsibility.

      *   **4. An engineer's translation:**
          *   Map replies to computing.
          *   Expected Utility -> Race conditions/Edge cases.
          *   Complicity -> Botnet/Protocol violation.
          *   Imperceptible -> Floating point drift.
          *   *Draft:* The *Expected Utility* reply is like handling a race condition. You code for the edge case where your request is the one that tips the database lock, even if it rarely happens. Breakdown: Unlike code, moral probabilities aren't well-defined variables. The *Complicity* reply is like refusing to join a botnet. Even if your node doesn't crash the server, running the script makes you part of the attack vector. Breakdown: In ethics, "participation" is fuzzier than running a script. The *Imperceptible Harm* reply is like floating-point error accumulation. One rounding error doesn't crash the system, but denying its existence guarantees eventual failure. Breakdown: In ethics, we lack the precision to track these "errors," making the obligation feel abstract compared to a deterministic crash.

      *   **5. Your overall assessment:**
