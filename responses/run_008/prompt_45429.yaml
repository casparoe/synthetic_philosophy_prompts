answer: |-
  # Instructor's Guide: Logical Space & Diagnostic Design

  ### 1. Mapping the Logical Space
  Before presenting the quiz to students, it is necessary to map the philosophical "coordinates" this tree is designed to locate. We are testing three binary distinctions (though reality is often a spectrum).

  *   **Axis A (Scope):** Do distant strangers generate the *same kind* of moral claim as intimates? (Universal vs. Local)
  *   **Axis B (Source):** Do relationships generate obligations *prior* to explicit agreement? (Relational vs. Contractual/Principled)
  *   **Axis C (Nature of Care):** Is "care" about meeting a defined need (Beneficence) or maintaining a responsive connection (Relational)?

  **The Logical Combinations:**
  1.  **Universal + Principled:** Everyone counts equally; rules apply to all. (**Impartialist**)
  2.  **Local + Principled:** Strangers have rights (don't harm), but friends have no special claim; promises bind. (**Contractualist**)
  3.  **Universal + Relational:** Everyone is potentially in relationship; we must respond to need wherever found. (**Care Ethics - Broad**)
  4.  **Local + Relational:** Obligations stem from existing bonds; character/loyalty dictates action. (**Virtue Ethics**)
  5.  **Non-Hierarchical:** No single axis rules; context determines weight. (**Deflationary/Pluralist**)

  **Flagged Combinations (The "Empty" Quadrants):**
  *   *Universal Scope + "Break Promises for Friends":* **Incoherent.** If everyone counts equally, you cannot systematically privilege a friend's minor need over a stranger's established right (promise) without contradicting the "Universal" premise.
  *   *Local Scope + "Decide Friend-Conflicts by Coin Flip":* **Unattractive/Unexplored.** If you believe obligations are local/relational, introducing an impartial mechanism (coin flip) to resolve conflicts between loved ones negates the value of the relationship itself.
  *   *Relational Source + "Ignore Recipient's Objections":* **Tension.** This creates a "Paternalist" view. While some Virtue views hold this (Filial Piety), standard Care Ethics rejects it (Care requires listening). This tree uses this tension to separate Virtue from Care.

  **Ambiguity Note:**
  *   **Virtue Ethics vs. Care Ethics:** These positions often converge on "Help the Friend." This tree attempts to separate them using the *Paternalism* case (Virtue may prioritize 'doing good' for the parent; Care prioritizes 'staying connected' with the parent). However, in practice, these views overlap significantly and the quiz may group them if the student's intuition is not sharp on autonomy.

  ***

  # Diagnostic Quiz: What Do You Actually Stand on Care?

  **Instructions:** Read the four scenarios below. Do not overthink them. Choose the answer that matches your immediate moral intuition. Follow the arrows to find your position.

  ### Node 1: The Stranger in Need (Scope)
  **Case:** You are walking past a person you have never met and will never see again. They are in significant trouble (e.g., starving, stranded). Helping them would cost you a moderate amount of money and time, but you would not be harmed. No one else is watching.
  *   **A:** I have a **moral duty** to help. Their need alone binds me, even without a relationship. → *Go to Node 2*
  *   **B:** It would be **kind/nice** to help, but I am not morally required to. My obligations start with my community/connections. → *Go to Node 3*

  ---

  ### Node 2: The Promise vs. The Friend (Source of Obligation)
  *(Reached if you chose A: Strangers have a claim on you)*
  **Case:** You promised a stranger to meet them at a specific time to return a borrowed item. On the way, a close friend calls. They aren't in danger, but they are upset and need you to come listen to them *now*. If you stop for the friend, you break the promise to the stranger.
  *   **A:** I must **keep the promise**. A moral rule (promise-keeping) applies equally to everyone, regardless of who is asking. → *Leaf: The Impartialist*
  *   **B:** I should **help the friend**. Relationships create special obligations that can outweigh general rules. My duty to the friend is stronger because we are connected. → *Leaf: Care Ethics Proper*

  ---

  ### Node 3: The Promise vs. The Friend (Justice vs. Partiality)
  *(Reached if you chose B: Strangers do not have a strong claim on you)*
  **Case:** Same as above. You promised a stranger to return an item. A close friend needs minor emotional support.
  *   **A:** I must **keep the promise**. Justice means treating agreements as binding. My friendship doesn't give me the right to wrong a stranger. → *Leaf: Justice-First Contractualist*
  *   **B:** I should **help the friend**. Loyalty and friendship matter more than a transaction with a stranger. → *Go to Node 4*

  ---

  ### Node 4: The Resistant Parent (Nature of Care)
  *(Reached if you chose B: Friendship outweighs the Promise)*
  **Case:** Your aging parent is becoming forgetful but insists on living alone. You believe they are unsafe. They explicitly tell you: "Do not take control of my finances."
  *   **A:** I must **respect their refusal**. Even if I love them, care means listening to who they are. Forcing help breaks the relationship. → *Leaf: Care Ethics Proper* (Note: You arrived here via the "Local" path, suggesting a focus on relational maintenance over universal duty).
  *   **B:** I should **take control anyway**. I know what is good for them. Being a good child means ensuring their safety, even if they are angry. → *Leaf: Virtue-Ethical View*
  *   **C:** It **depends on the situation**. Sometimes safety matters more; sometimes autonomy does. There is no single rule for "care" or "virtue." → *Leaf: Deflationary View*

  ---

  ### Node 5: The Conflicting Loved Ones (Epistemic vs. Normative)
  *(Alternative Branch for Node 4 if distinction is needed)*
  **Case:** Two people you love deeply both have urgent, conflicting needs (e.g., both need you to drive them to the hospital at the same time). You cannot save both.
  *   **A:** I try to assess **who needs it more** objectively, like a triage nurse. The intensity of the need decides. → *Leaf: Care Ethics Proper* (Attentiveness to need is the norm).
  *   **B:** I acknowledge there is **no right answer**. I act based on who I am in that moment, knowing I will feel guilt either way. → *Leaf: Deflationary View*

  *(Note for Instructor: In the printed quiz, merge Node 4 and 5 logic to ensure all 5 leaves are reachable. The simplified tree below consolidates this for student flow.)*

  ***

  # Simplified Student Handout Version

  **Start Here:**
  **1. The Stranger:** A stranger you'll never see again needs significant help. It costs you time/money.
  *   **(A) It's my duty.** → Go to Question 2.
  *   **(B) It's optional/kind.** → Go to Question 3.

  **2. The Promise:** You promised a stranger to meet them. A friend needs minor help instead.
  *   **(A) Keep the promise.** → **Position: The Impartialist.**
  *   **(B) Help the friend.** → **Position: Care Ethics Proper.**

  **3. The Promise:** You promised a stranger to meet them. A friend needs minor help instead.
  *   **(A) Keep the promise.** → **Position: Justice-First Contractualist.**
  *   **(B) Help the friend.** → Go to Question 4.

  **4. The Parent:** Your parent refuses help they need.
  *   **(A) Respect their refusal.** → **Position: Care Ethics Proper** (Relational Focus).
  *   **(B) Force the help for their good.** → **Position: Virtue-Ethical View.**
  *   **(C) It depends/No rule.** → **Position: Deflationary View.**

  ***

  # Leaf Descriptions (For Class Discussion)

  **1. The Impartialist**
  *   **Core Idea:** Morality is like math; everyone counts as one.
  *   **On Care:** Caring for friends is fine, but not because they are *yours*. It's only okay if it doesn't violate equal treatment of strangers.
  *   **On Strangers:** Famine relief is just as obligatory as buying your child a birthday gift.

  **2. Justice-First Contractualist**
  *   **Core Idea:** Morality is about agreements and rights.
  *   **On Care:** Friendships are voluntary contracts. You can't break a promise to a stranger just because a friend asks.
  *   **On Strangers:** You shouldn't harm strangers, but you don't necessarily owe them your life savings unless you agreed to.

  **3. Care Ethics Proper**
  *   **Core Idea:** Morality is about maintaining connections and responding to needs.
  *   **On Care:** Relationships *create* obligations. You don't help a friend because it's a "rule," but because ignoring them damages the web of care.
  *   **On Paternalism:** True care requires listening. Ignoring a parent's "no" is not care; it's control.

  **4. Virtue-Ethical View**
  *   **Core Idea:** Morality is about being a good person (having good character).
  *   **On Care:** Partiality is natural and good. A person who treats their mother like a stranger lacks virtue.
  *   **On Paternalism:** Sometimes "being a good child" means protecting a parent from themselves, even if they object (Filial Piety).

  **5. Deflationary View (Pluralist)**
  *   **Core Idea:** Morality is messy; there is no single "master rule."
  *   **On Care:** Care is one value among many (like justice, loyalty, autonomy). Sometimes care wins; sometimes justice does.
  *   **On Theory:** Resists putting all cases into one system.

  ***

  # Instructor Notes on Limitations

  **1. The Care/Virtue Overlap**
  This tree attempts to separate Care Ethics and Virtue Ethics using the *Paternalism* case (Node 4). However, be aware that many Virtue Ethicists also value autonomy, and some Care Ethicists might justify paternalism if the "relationship" is defined as "keeping the parent alive." If a student lands on Virtue but argues for autonomy, acknowledge that these traditions overlap in practice.

  **2. The "Deflationary" Catch-All**
  The Deflationary leaf is where students go if they refuse to generalize. This is a philosophically respectable position (Moral Pluralism), but in an intro course, it can function as a "cop-out." Use this result to challenge the student: *"If there is no rule, how do you explain your answer to someone who disagrees?"*

  **3. The "Incoherent" Path**
  If a student answers **Node 1(A)** [Strangers have equal claim] but **Node 2(B)** [Break promise for friend], they have entered the "Incoherent" logical space flagged in the design notes. They believe everyone counts equally, but act as if friends count more. Use this to teach the concept of **consistency**: *"If the stranger counts equally, why does their promise weigh less than your friend's mood?"*
