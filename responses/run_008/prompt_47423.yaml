answer: |-
  Here are the desiderata for an adequate theory of letterform identity, structured by the empirical phenomena they must explain. I have tagged each as either **Non-negotiable** (derived from robust empirical facts about reading, design, or learning) or **Camp Prejudice** (a methodological constraint that limits the theory's scope rather than ensuring its adequacy).

  ### The Desiderata

  1.  **The Style-Identity Factorization** [Non-negotiable]
      *   **Case:** A designer can draw a new glyph in a novel style, and a reader can identify both the letter *and* the style independently.
      *   **Requirement:** The theory must posit distinct representational dimensions for *categorical identity* (which letter?) and *stylistic value* (which font/hand?). It cannot treat a letter as a point in a single similarity space where style and identity are conflated.

  2.  **The Homoglyph Resolution** [Non-negotiable]
      *   **Case:** A vertical stroke can be an 'l', an 'I', or a '1' depending on context, despite identical geometry.
      *   **Requirement:** Identity cannot be determined solely by intrinsic shape features. The theory must allow for extrinsic factors (context, systemic position) to override or assign identity when intrinsic data is ambiguous or identical.

  3.  **The Allograph Unification** [Non-negotiable]
      *   **Case:** Single-storey and double-storey 'a's (or single/double-decker 'g's) are recognized as the same letter despite lacking a common geometric skeleton.
      *   **Requirement:** The category boundary must be broad enough to encompass discontinuous shape clusters. A theory relying on continuous morphological transformation or a single geometric prototype will fail here.

  4.  **The Few-Shot Generalization** [Non-negotiable]
      *   **Case:** Children learn letter categories from handfuls of exposures; designers generalize a style from a few glyphs to the whole alphabet.
      *   **Requirement:** The learning mechanism cannot rely on statistical accumulation of thousands of examples (the "big data" assumption). It must support rapid abstraction of rules or relations from sparse data.

  5.  **The Context Modulation** [Non-negotiable]
      *   **Case:** Ambiguous letters are resolved by word context (top-down), yet isolated letters are still readable on license plates (bottom-up).
      *   **Requirement:** The theory must be hybrid. It cannot be purely data-driven (fails ambiguous cases) nor purely hypothesis-driven (fails isolated cases). It must specify how bottom-up evidence and top-down expectations interact without one canceling the other.

  6.  **The Systemic Coherence** [Non-negotiable]
      *   **Case:** Hofstadter's observation: We recognize a typeface as a "family" of 26 distinct but related entities, not just 26 independent shapes.
      *   **Requirement:** Letter identity is partly defined by its contrastive position within a set (e.g., how this 'n' relates to this 'h'). The theory must account for relational properties, not just absolute properties.

  7.  **The Explicit Rule Stipulation** [Camp Prejudice]
      *   **Case:** The demand that the theory be statable as a set of logical production rules (e.g., "if curve + vertical, then 'a'").
      *   **Requirement:** **Reject.** This privileges symbolic AI approaches. The cognitive mechanism may be sub-symbolic or connectionist; demanding explicit rules constrains the *form* of the theory rather than its *explanatory power*.

  8.  **The Neural Plausibility Constraint** [Camp Prejudice]
      *   **Case:** The demand that the theory map directly onto known cortical architectures (e.g., "must be implementable in a feed-forward ventral stream").
      *   **Requirement:** **Reject.** While desirable, this privileges current neuroscientific consensus over phenomenological adequacy. Reading is a cultural technology that may exploit brain circuitry in ways that violate "native" architectural assumptions.

  ---

  ### Incompatible Desiderata (The Trade-Offs)

  I suspect the following pair cannot be jointly satisfied by a single, flat representational mechanism. This tension is where most theories break.

  **The Conflict: Intrinsic Invariance (Desideratum 3) vs. Extrinsic Relationality (Desideratum 2 & 6)**

  *   **The Tension:** To satisfy **Allograph Unification**, the system needs an invariant representation that ignores surface geometry (treating single and double-storey 'a' as the same). To satisfy **Homoglyph Resolution** and **Systemic Coherence**, the system needs to be sensitive to external context and relational contrast (treating identical vertical strokes as different).
  *   **Why it breaks:** If you build a system robust enough to ignore geometric differences (for the 'a'), it tends to become insensitive to the subtle contextual cues needed to distinguish 'l' from 'I'. Conversely, if you build a system sensitive enough to context to distinguish 'l' from 'I', it often becomes too brittle to generalize across the radical geometric shifts of the single/double 'a'.
  *   **The Implication:** An adequate theory likely requires a **hierarchical or dual-process architecture**: a fast, intrinsic pathway for isolated recognition (sacrificing homoglyph resolution) and a slower, relational pathway for contextual disambiguation (sacrificing speed). A theory claiming to do both simultaneously in a single pass is likely glossing over the mechanism.

  ---

  ### The "Killer" Requirement

  The single requirement that does the most to exclude popular contenders is **The Style-Identity Factorization (Desideratum 1)**.

  Most cognitive theories of object recognition treat identity as a location in a multidimensional similarity space. In such spaces, "style" is simply distance from a prototype. This cannot explain how we recognize a *new* style instantly. If identity and style are entangled, encountering a new style should disrupt identity recognition (which it doesn't) or require re-learning the category (which we don't do). Only theories that treat style as a *transform* applied to an abstract identity skeleton can account for the designer's ability to generate, and the reader's ability to parse, novel typefaces without prior exposure.

  ---

  ### Scorecard of Contenders

  **Template Matching:** Fails immediately on the Few-Shot Generalization and Style-Identity Factorization, as it requires exact or near-exact geometric correspondence to function.

  **Feature/Stroke Decomposition:** Fails on the Homoglyph Resolution and Systemic Coherence, as identical feature sets ('l', 'I', '1') yield identical outputs regardless of context or systemic role.

  **Prototype/Exemplar Views:** Fails on the Allograph Unification, as bimodal distributions (single vs. double-storey 'a') cannot be represented by a single central tendency or a cloud of similar instances without arbitrary boundary cutting.
