answer: |-
  ### Mock Essay Question

  **Question:**
  Consider the sudden collapse of the 1985 Grand Coalition. **Explanation A** attributes the collapse to a covering-law schema: "When coalition partners face sustained economic stress and internal polling declines (conditions *C*), alliances dissolve (event *E*), *ceteris paribus*." **Explanation B** offers a narrative: it traces the specific sequence of cabinet meetings and leaked memos from January to March, demonstrating why the Prime Minister did not resign in February and why the junior partner did not bolt in early March, thereby ruling out nearby counterfactual alternatives until only the actual collapse remained possible.

  Critics argue Explanation B merely suppresses premises, relying on a thin generalization that "events develop continuously," making it a trivial covering-law model. Defenders argue Explanation B derives power from identifying a **contrast class** and rendering the outcome **unsurprising in retrospect** without making it **expectable in advance**.

  Write an essay adjudicating this debate. Does the narrative's reliance on contrastive exclusion and retrospective fitting constitute a structurally distinct form of explanation, or is it merely a covering-law explanation with hidden premises? Crucially, does the distinction between making an outcome *unsurprising after the fact* versus *expectable in advance* do any philosophical work in validating narrative explanation, or is it a concession that narratives fail to explain?

  ***

  ### Model Answer

  The debate between covering-law and narrative explanation turns not on the presence of generalizations, but on the logical structure of how those generalizations function. Explanation A (Covering-Law) seeks to subsume the collapse under a regularity. Its explanatory force depends on the strength of the generalization linking economic stress to dissolution. However, as Hempel admits, such schemas often rely on *ceteris paribus* clauses that are so hedged they render the law unfalsifiable or too vague to explain the specific timing of the 1985 collapse. It explains why *some* coalition would fail, but not why *this* one failed *then*.

  Explanation B (Narrative) operates differently. It does not attempt to predict the collapse from initial conditions. Instead, it functions by identifying a **contrast class**. By tracing the sequence of meetings and leaks, the narrative explains why the collapse occurred *rather than* the Prime Minister resigning in February or the junior partner bolting in March. The explanatory power lies in the elimination of specific, plausible alternatives. This is structurally distinct from subsumption because it addresses the *contingency* of the event. A covering law treats the event as an instance of a type; a narrative treats the event as the resolution of a specific tension.

  The criticism that Narrative B relies on a "thin generalization" of continuity misunderstands the narrative function. If the only implicit law is "events continue until interrupted," this is not a causal law in the Hempelian sense, but a structural constraint on intelligibility. To claim this makes narrative a "trivial" covering-law model is to stretch the definition of "law" until it loses meaning. If any connection between temporal stages counts as a law, the covering-law model becomes tautological: everything is explained by the law that things happen. The narrative does not use continuity to predict; it uses it to connect.

  This leads to the crucial distinction between making an outcome **unsurprising in retrospect** versus **expectable in advance**. For the covering-law theorist, this distinction is fatal. If an explanation cannot support prediction, it is merely a "story." However, for the narrative theorist, this distinction validates the explanation. Historical agents act without knowledge of the future; therefore, an explanation that requires the outcome to be expectable in advance imposes an impossible standard on human action. The narrative shows that given the sequence *as it unfolded*, the collapse was the only coherent resolution. It validates the outcome without denying the contingency that existed at the time.

  Therefore, the distinction does real philosophical work. It shifts the criterion of explanation from **nomological necessity** to **intelligible connection**. Explanation A fails because it cannot account for the specific path taken without ad hoc adjustments. Explanation B succeeds not because it hides laws, but because it reconstructs the agent's situation where the outcome becomes rational in hindsight. The narrative is not a failed prediction; it is a successful reconstruction of necessity from contingency. Consequently, narrative explanation is structurally distinct. It relies on the logic of plot and contrastive exclusion, not the logic of subsumption. To reduce it to suppressed premises is to ignore that history explains *changes*, not just *instances*.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **A Range (17–20 Marks): Distinctive Structural Analysis**
  *   **Contrast Class Mechanism (5 marks):** Explicitly explains how the narrative explains "why X rather than Y" by ruling out specific counterfactuals (e.g., resignation in Feb), rather than just saying "it tells a story."
  *   **The "Thin Generalization" Rebuttal (5 marks):** Argues that treating "continuity" as a law renders the covering-law model tautological/trivial, rather than simply accepting or rejecting the claim.
  *   **The Predictability Trap (5 marks):** **Crucial Move:** Does not simply state "Narratives are retrospective, Laws are predictive." Instead, argues *why* this matters: asserts that requiring prediction imposes an impossible standard on human action, making retrospectivity a *feature* of valid historical explanation, not a bug.
  *   **Synthesis (5 marks):** Concludes that narrative is structurally distinct (logic of plot/connection) rather than just a "messy" covering law.

  **B Range (13–16 Marks): Competent Recitation**
  *   **Standard Distinctions (5 marks):** Correctly identifies Hempel (subsumption/prediction) vs. Dray/Narrative (understanding/continuity).
  *   **Case Application (5 marks):** Applies the concepts to the 1985 Coalition example adequately.
  *   **The Predictability Trap (0–3 marks):** **Common Failure:** States that narratives are retrospective and laws are predictive but fails to argue whether this validates narrative or admits its inferiority. Treats the distinction as a description rather than a justification.
  *   **Conclusion (5 marks):** Reaches a conclusion, but may rely on vague compromise ("both are useful") rather than adjudicating the structural claim.

  **C Range (9–12 Marks): Surface Level**
  *   Defines DN model and Narrative but fails to engage with the "contrast class" or "suppressed premises" specific arguments.
  *   Treats the prompt as a request to summarize the semester rather than solve the specific philosophical problem posed.

  **Note for Graders:**
  The specific move that separates an A from a B is the handling of the **Predictability Trap**. A B-student will say: *"Narratives explain after the fact; Laws predict before."* An A-student will say: *"Because agents act without future knowledge, explanation requiring prediction is invalid; therefore, retrospective unsurprisingness is the correct standard for history."* If the student does not defend retrospectivity as valid, they cannot score in the A range.
