  6.  **Final Polish:** Ensure the tone is academic but accessible. Use specific terms (*empsychon organon*, *barbaros*, *encomienda*). Make sure the distinction between "Theory to Case" and "Case to Theory" is clear in the structure. (Proceed to generate output based on these thoughts.)

