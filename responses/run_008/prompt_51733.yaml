      *   **Task 1: Theory to Case:** Reconstruct Aristotle's account of natural slavery precisely (criteria, household context, benefit, natural vs. conventional). Evaluate Sepúlveda's application (faithful or distortion?). Address specific points: household vs. commonwealth/war, and the "unjust rule" criterion.
      *   **Task 2: Case to Theory:** Analyze what the episode reveals about Aristotle's theory that the text alone doesn't. Focus on: overlapping authorities, empirical criteria as rubber stamps, the junta's inability to decide, circularity/unfalsifiability of "benefit," and Las Casas's strategy.
      *   **Core Question:** Was the New World a genuinely new test case, or did it expose inherent circularity? Where is the theory silent, and where does forcing it speak do violence?
      *   **Tone:** Analytical, philosophical, historically grounded, honest/critical.

  2.  **Part 1: Theory to Case (Aristotle $\rightarrow$ Valladolid)**

      *   *Reconstructing Aristotle (Politics Book I):*
          *   **Definition:** Natural slave = one who can perceive reason (*logos*) but does not possess it (*ouk echein*). They need a master to guide them.
          *   **Ontology:** Living tool (*empsychon organon*), part of the master (*meros tou despotou*).
          *   **Teleology/Benefit:** Rule is for the benefit of *both*, but primarily the master. It's like soul ruling body.
          *   **Natural vs. Conventional:** Natural = inherent capacity. Conventional = law/custom (e.g., prisoners of war). Aristotle admits conventional slavery can be unjust if the enslaved isn't naturally a slave.
          *   **Context:** *Oikos* (household), not *Polis* (state). It's a vertical relation within a unit, not horizontal relations between states.
      *   *Evaluating Sepúlveda:*
          *   **Faithful?** He uses the vocabulary (barbarians, lack of prudence). He cites *barbaros* in the Aristotelian sense.
          *   **Distortion?**
              *   *Scale:* Aristotle talks about individuals within a household. Sepúlveda applies it to *entire nations/populations*. This is a category error.
              *   *War:* Aristotle distinguishes natural slavery from slavery by war. Sepúlveda uses "sins" (idolatry, sacrifice) as a *casus belli* to enslave a whole people, conflating punitive war with natural hierarchy.
              *   *Benefit:* Aristotle says the slave benefits. Sepúlveda argues for Spanish benefit (gold, glory) + spiritual benefit (salvation). Is spiritual salvation the same as the "virtue" Aristotle meant? Maybe, but the material extraction undermines the "benefit" claim.
      *   *The "Unjust Rule" Criterion:* Aristotle says if a natural slave is ruled unjustly, they feel it (like a body feeling pain). Las Casas uses this: Indigenous people resist, they have complex societies, therefore they aren't natural slaves. This is a strong internal critique.

  3.  **Part 2: Case to Theory (Valladolid $\rightarrow$ Aristotle)**

      *   *The Empirical Trap:* Aristotle's criterion ("perceives reason but doesn't have it") sounds empirical. But who judges? The master. This makes it unfalsifiable. If the "slave" resists, the master says "see, they lack reason." Las Casas flipped this: "They have cities/laws, therefore they have reason."
      *   *The "Benefit" Circularity:* Who defines benefit? If the ruler defines it, the theory justifies anything. Las Casas forced an objective standard (Christian virtue + Aristotelian political capacity).
      *   *New World as Stress Test:* Aristotle imagined Greeks vs. non-Greeks (barbarians). He didn't imagine trans-oceanic civilizations with empires (Aztec/Inca) that mirrored European complexity. The theory assumed a gradient of civilization that the Americas disrupted.
      *   *Silence vs. Violence:*
          *   *Silence:* Aristotle is silent on international law (*jus gentium*) regarding conquest. He doesn't give a right to conquer foreign states based on internal hierarchy.
          *   *Violence:* Forcing the theory to cover imperial conquest stretches the *oikos* analogy until it breaks. It turns a philosophical anthropology into a legal weapon.
      *   *Las Casas's Move:* He didn't reject Aristotle; he *Aristotelianized* the Indigenous. He made them fit the "free man" category better than the Spanish fit the "master" category (due to Spanish cruelty).

  4.  **Synthesizing and Structuring:**

