answer: |-
  This is a profound inquiry into the collision of classical political philosophy and early modern imperial practice. The Valladolid Debate is not merely a historical footnote; it is the moment Aristotelian ethics were stress-tested against the reality of global conquest.

  Here is a case analysis running in both directions: first applying Aristotle's theory to the debate to test Sepúlveda's fidelity, and then using the debate to interrogate the structural vulnerabilities of Aristotle's theory itself.

  ---

  ### Part I: Theory to Case
  **Reconstructing the Aristotelian Machinery**

  To judge Sepúlveda, we must first isolate the specific components of Aristotle's theory of natural slavery in *Politics* Book I.

  1.  **The Ontological Criterion:** The natural slave is defined by a specific relationship to *logos* (reason). The slave "participates" in reason enough to perceive it but does not "possess" it enough to deliberate or originate action (*Politics* 1254b). They are living tools (*empsychon organon*) and, ontologically, a part of the master (*meros tou despotou*).
  2.  **The Teleological Claim (Benefit):** The rule of master over slave is not merely expedient; it is just and beneficial for *both*. Just as the soul rules the body for the body's good, the master guides the slave toward virtue they cannot achieve alone.
  3.  **The Distinction (Natural vs. Conventional):** Aristotle explicitly distinguishes natural slavery from slavery by convention (law/war). He acknowledges that many who are enslaved by war are not natural slaves. Crucially, he notes that when a natural slave is ruled unjustly (i.e., by a master who is not truly superior in virtue), the slave feels the injustice, just as a body feels pain when ruled poorly by a soul.
  4.  **The Context (The *Oikos*):** This relation is domestic. It is a component of household management (*oikonomia*), distinct from political rule (*politike*) over free citizens or royal rule over subjects. It is vertical and intimate, not horizontal and geopolitical.

  **Sepúlveda's Application: Faithful or Distortion?**

  Sepúlveda's *Democrates Alter* attempts to map this machinery onto the Indigenous peoples of the Americas. He argues they are "barbarians" in the Aristotelian sense: lacking prudence, given to unnatural vices (sodomy, sacrifice), and therefore requiring the tutelage of the Spanish.

  **The Distortions:**
  1.  **Scale and Category (*Oikos* vs. *Imperium*):** This is the most significant rupture. Aristotle's natural slave is an *individual* within a *household*. Sepúlveda applies this to *entire nations*. Aristotle provides no mechanism for one *polis* to naturally enslave another *polis*. By scaling the household hierarchy to the international level, Sepúlveda transforms a theory of domestic management into a theory of colonial administration. Aristotle does not grant a "right of conquest" based on natural hierarchy; he describes a natural relation that *ought* to exist, not a license for war to *create* it.
  2.  **The Mechanism of Enslavement:** For Aristotle, natural slavery is a pre-existing condition recognized by nature. For Sepúlveda, it is often a *consequence* of war. He argues that because Indigenous practices (sacrifice) violate natural law, Spain has a right to wage war, and the captives of that just war become slaves. This conflates Aristotle's "conventional slavery" (prisoners of war) with "natural slavery." Aristotle warns against this exact confusion, noting that might does not make right.
  3.  **The Benefit Criterion:** Sepúlveda argues the Indigenous benefit from Spanish rule through conversion to Christianity. While this mimics the Aristotelian "virtue" argument, it is complicated by the *encomienda* system, which extracted labor for Spanish profit. If the "master" (Spain) is motivated by gold rather than the virtue of the "slave," the Aristotelian condition of mutual benefit collapses.

  **The Las Casas Counter: The Internal Criterion**
  Las Casas's genius was to accept Aristotle's premises but dispute the facts. He argued that the Indigenous peoples possessed cities, laws, mathematics, and complex governance. Therefore, they possessed *logos*.
  Crucially, Las Casas leveraged Aristotle's point about **unjust rule**. Aristotle suggests that a natural slave ruled by a non-master will feel the discord. Las Casas presented the Indigenous resistance not as irrational rebellion, but as the rational reaction of free people to tyranny. If they were natural slaves, they would accept Spanish rule as the body accepts the soul. Their resistance proved they were not "parts" of the Spanish master.

  **Verdict on Sepúlveda:** His application is a **structural distortion**. He took an ethical description of individual capacity and weaponized it as a geopolitical legal doctrine. He used Aristotle to justify what Aristotle would likely classify as "conventional slavery by force," which Aristotle admits is often unjust.

  ---

  ### Part II: Case to Theory
  **What Valladolid Reveals About Aristotle**

  If we reverse the lens, the Valladolid Debate exposes fissures in Aristotelian theory that are invisible when reading the *Politics* in the abstract.

  **1. The Empirical Rubber Stamp**
  Aristotle's criterion ("perceives reason but does not possess it") appears empirical, but the debate revealed it is epistemically closed.
  *   **The Problem:** Who measures the capacity for reason? In the *oikos*, the master decides. In Valladolid, the theologians decided.
  *   **The Exposure:** Both sides looked at the same evidence (Aztec temples, roads, calendars) and drew opposite conclusions. Sepúlveda saw "idolatry" (proof of irrationality); Las Casas saw "religion" (proof of rationality). The theory provided no neutral metric to settle the empirical claim. It functioned as a rubber stamp: if you hold the whip, you define the capacity. The theory risks becoming unfalsifiable because the "lack of reason" is inferred from the "need for rule," while the "need for rule" is justified by the "lack of reason."

  **2. The Circularity of "Benefit"**
  Aristotle claims rule is for the benefit of the ruled. Valladolid exposed that "benefit" is a normative, not descriptive, category.
  *   **Sepúlveda:** Benefit = Salvation (even if it requires death/subjugation).
  *   **Las Casas:** Benefit = Preservation of life and liberty (prerequisites for salvation).
  *   **The Exposure:** The theory cannot adjudicate between competing teleologies. If the master defines the "good" unilaterally, the claim that slavery benefits the slave is vacuous. Las Casas won the moral argument only by shifting the definition of benefit from "spiritual tutelage" to "Aristotelian political flourishing." He showed that the theory is silent on *whose* conception of the good life prevails in a clash of civilizations.

  **3. The Silence on International Relations**
  Aristotle's theory is genuinely silent on the rights of one commonwealth over another.
  *   **The Gap:** The *Politics* assumes a Greek *polis* interacting with neighbors. It does not anticipate trans-oceanic empires encountering civilizations with no shared legal framework (*jus gentium*).
  *   **The Violence:** Forcing Aristotle to speak here does violence to the text. It requires turning the "natural master" from a virtuous individual into a Crown. It requires turning "natural slavery" from an ontological status into a legal penalty for "sins against nature" (idolatry). This shifts the theory from **anthropology** (what humans *are*) to **jurisprudence** (what humans *deserve*).

  **4. The New World: New Test Case or Exposed Circularity?**
  Was the Americas a genuinely new variable, or did it just reveal the rot?
  *   **It was a New Test Case:** Aristotle's "barbarian" was a vague category, usually implying Persians or Scythians—neighbors with some shared cultural ground. The Americas presented civilizations (Inca, Aztec) that were structurally comparable to European states but culturally alien. This broke the simple Greek/Barbarian binary. The complexity of Indigenous society forced the debate onto empirical ground (do they have laws?) rather than purely metaphysical ground.
  *   **It Exposed Inherent Circularity:** However, the core circularity was always there. The theory relies on the assumption that "nature" aligns with "power." If the strong rule the weak, Aristotle asks us to check if it is *natural*. But the only evidence of it being natural is that the strong *are* ruling. Las Casas broke this circle by introducing an independent variable: **political capacity.** He argued that if they build cities, they have reason. This converted Aristotle's descriptive claim into a checkable one.

  **Conclusion: Where the Theory Breaks**

  The Valladolid Debate shows that Aristotle's theory of natural slavery works only in a closed, homogeneous system where "virtue" and "power" are assumed to align.
  *   **Where it is Silent:** It offers no procedure for adjudicating capacity between cultures that do not share a conception of virtue. It offers no limit on the scale of rule (individual vs. empire).
  *   **Where Forcing it Speaks Does Violence:** Using it to justify war transforms a philosophical observation about human diversity into a tool of extermination. It requires ignoring Aristotle's own warning that enslaving those who are not natural slaves is an act of violence, not justice.

  Ultimately, Las Casas won the debate not by rejecting Aristotle, but by being a better Aristotelian than Sepúlveda. He recognized that if the Indigenous possessed *polis*-level organization, they were, by definition, political animals (*zoon politikon*), and therefore could not be natural slaves. The tragedy of Valladolid is that the Junta could not issue a verdict because the theory itself could not resolve the conflict between **empirical reality** (Indigenous civilization) and **imperial necessity** (Spanish dominion). The theory did not fail because the New World was too new; it failed because it was never designed to judge the conscience of an empire, only the management of a household.
