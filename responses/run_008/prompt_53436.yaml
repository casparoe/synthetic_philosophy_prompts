answer: |-
  **Analysis Summary: Lines of Reasoning**

  Before drafting the recommendation, we considered four frameworks for identity. First, the *parts-based view* argues the ship is merely its wood; since most original wood is stored, the stored pile is the *Margaret Alden*. Second, the *continuity view* argues identity lies in uninterrupted history and function; the floating vessel is the ship because it has never ceased to be displayed as such. Third, the *artifact view* suggests ships are historical processes, not just matter; replacing rot is part of a ship's life, not its death. Fourth, the *pragmatic view* holds that "Margaret Alden" is a name we assign; we can choose which vessel bears it.

  The parts-based view is the strongest challenge to our current practice. If we accept it, we admit the floating vessel is a replica. However, this view ignores that a ship without function is merely lumber. The continuity and artifact views better serve the museum's mission to preserve living history, not just timber. The pragmatic view solves the naming issue but fails to satisfy the legal deed, which implies a specific object exists. Therefore, we recommend prioritizing continuity while respecting the material history.

  ***

  **DECISION MEMO**

  **To:** Board of Trustees
  **From:** Registrar's Office
  **Date:** November 1, 2023
  **Subject:** Strategic Recommendations Regarding the *Margaret Alden* Restoration and Identity

  **Purpose**
  This memo addresses the complex identity and legal status of the *Margaret Alden* following the proposed foundation-funded restoration. We must determine whether to proceed with the construction of a second hull, designate the beneficiary of the founding endowment, and clarify insurance and loan statuses. These decisions require balancing material authenticity with historical continuity.

  **Recommendation on Restoration Proposal**
  We recommend **modifying** the foundation's proposal. We should decline the construction of a second, freestanding hull made from the stored original timber. Instead, we should integrate structurally sound original material back into the floating vessel where safe, and archive the remaining stored timber as "Historical Fabric."

  Building a second hull creates two competing claims to authenticity that will confuse the public and devalue both objects. A vessel built from stored timber lacks the continuous history of the *Margaret Alden*; it would be a reconstruction using original materials, not the artifact itself. Conversely, abandoning the floating vessel ignores fifty years of continuous public engagement and maintenance. By keeping one vessel, we maintain a clear narrative. The stored wood should be preserved as an archive of the ship's maintenance history, not as a competing ship.

  **Endowment Designation**
  Regarding the founding donor's deed for the "perpetual preservation of the schooner *Margaret Alden*," we recommend the endowment fund the **continuously maintained floating vessel**.

  We must justify this to the probate court by arguing that the "schooner" is defined by its continuous existence as a maintained entity, not merely by its original atoms. Maritime tradition and museum practice recognize that wooden vessels survive through replacement. If we designate the stored timber as the beneficiary, we effectively declare the vessel we have displayed for fifty years a fake, undermining public trust and the donor's intent to preserve a visible landmark. The donor intended to preserve the *ship*, not a pile of lumber. The floating vessel represents the unbroken chain of care the donor funded.

  **Loan and Insurance Designations**
  For the pending loan request and insurance policies, we must adopt consistent terminology to avoid liability and misrepresentation.

  1.  **Loan Request:** We cannot lend "the original keel" as a standalone artifact separate from the vessel's identity. If the keel remains part of the floating vessel, it stays with the ship. If the foundation's plan to reassemble wood were accepted (which we advise against), the keel would be part of the reconstruction. We should offer to lend specific archived timber sections labeled as "Original 1902 Fabric from the *Margaret Alden*," rather than implying the loaned piece constitutes the ship itself.
  2.  **Insurance:** The floating vessel should be insured as the **1902 Artifact (Restored)**. The stored timber should be insured as **Archival Material**. This distinguishes the historical entity from the raw material. It acknowledges the 1902 origin while accurately reflecting the 2027 condition.

  **Addressing the Counter-Argument**
  We must seriously engage the argument that we destroyed the *Margaret Alden* decades ago. Critics may argue that by replacing 65% of the wood, we ceased preserving the original object and began building a replica years ago. Under this view, designating the floating vessel as the 1902 artifact is a deception.

  This view holds merit if one believes an object is nothing more than the sum of its parts. However, this definition fails to account for the nature of functional artifacts. A ship is defined by its design, its name, and its continuous service. If we accept that replacement equals destruction, then no wooden ship older than twenty years can exist in a museum. We would be forced to admit that our core collection consists of replicas, which negates the purpose of preservation. We are not deceiving the public by maintaining the vessel; we are fulfilling the requirement of preservation, which inherently involves repair. To prioritize the stored wood over the floating ship is to prioritize chemistry over history.

  **Limits of Philosophical Resolution**
  While reasoning clarifies our options, philosophy cannot settle every aspect of this decision. The board must make final judgments on values that reasoning alone cannot dictate.

  First, **public perception** is not a matter of logic. Even if we are philosophically justified in calling the floating vessel the *Margaret Alden*, will the public feel misled if they learn most wood is new? This is a risk management decision, not a metaphysical one. Second, **legal risk** regarding the deed depends on a judge's interpretation of "preservation," which may not align with our ethical reasoning. We may be right about the ship's identity but still lose the endowment in court. Third, **financial viability** dictates whether we can afford to archive the wood properly if we reject the second hull. Finally, the **donor's intent** is ultimately interpretive; we cannot know for certain if she valued the wood or the witness of the ship more.

  These factors require trustee judgment based on risk tolerance and community关系, not just abstract reasoning. We recommend proceeding with the modified plan, but the board must vote to accept the associated reputational and legal risks.

  **Action Required**
  Please review these recommendations prior to the November meeting. A vote is required to authorize the modified restoration plan and the endowment designation.
