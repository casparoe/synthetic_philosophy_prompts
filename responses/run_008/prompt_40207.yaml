prompt: |-
  I'm a final-year undergraduate taking a seminar on the history and theory of nationalism, and I need to turn a half-formed idea into a proposal for my term paper (roughly 6,000 words, due at the end of the semester). We spent two weeks on Hobsbawm's work on the invention of tradition and on Anderson's account of nations as imagined communities, and something has been nagging at me since. In the invention-of-tradition framework, the paradigm cases seem to be top-down fabrications: elites or states minting ceremonies, costumes, or symbols and passing them off as ancient, with the implicit accusation that this kind of forgery is a special legitimation trick. In Anderson's framework, by contrast, the imagining is universal and not really deceptive at all — every community larger than a village where people actually know each other is imagined in some way, and there's nothing fraudulent about that. So the word "invention" seems to be doing two different jobs: sometimes it means fabrication with a false claim to antiquity, and sometimes it just means constructedness, which on Anderson's view applies to everything and so can't be a criticism of anything. What I'd love to explore is whether the critical force of the invention thesis collapses once you make that distinction explicit. Consider a spectrum: a tradition that is fabricated but presented as ancient; a tradition that is brand new and openly acknowledged as new, like a newly independent state designing its flag and holidays in full public view; and an old practice that is silently repurposed for a new nationalist function. If everyone involved knows the tradition is new, does calling it "invented" still explain anything about how it creates loyalty?

  Please act as an expert on the historiography and theory of nationalism, and take the proposal seriously as a plan for work that could actually be completed in one semester by one student. Before committing to a framing, do some brainstorming: sketch two or three candidate ways to state the research question precisely, and say briefly why you chose the one you did and what's wrong with the alternatives. Then write the proposal itself, covering: the question, stated so that it has a determinate answer rather than dissolving into "everything is constructed"; why the existing positions leave it open; the method — I'm imagining a combination of conceptual analysis of what "invention" and "tradition" are supposed to mean in this literature, plus one or two concrete historical cases worked through carefully, though I'd welcome suggestions for which cases would best stress-test the distinction; what a successful result would look like; and an honest account of what would count as the project failing or being too big for a semester. I'm not asking for a bibliography or a literature review organized by citations — I can fill those in myself — but you should engage with the actual arguments and positions, since my professor will notice if the proposal just gestures at big names. Please think carefully about the distinction I'm drawing, and feel free to tell me if you think it's a bad idea or needs to be reformulated — I'd rather find out now than in my professor's office hours in week nine.
