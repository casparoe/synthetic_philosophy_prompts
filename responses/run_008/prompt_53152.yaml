answer: |-
  Any adequate theory of assertion norms must explain our evaluative practices via these desiderata:

  1. **Moore-Paradoxes:** Saying "It's snowing, but I don't believe it" feels defective despite truth/sincerity. Theory must explain this without stipulating falsity. (Non-negotiable: central puzzle).
  2. **Lottery/Futures:** Telling a ticket holder "Your ticket will lose" seems improper despite overwhelming probability. Theory must diagnose this and extend to future contingents. (Negotiable: intuitions shift with stakes).
  3. **Selfless Assertion:** A physician asserts a diagnosis she doubts to calm a patient. Theory must verdict on propriety and whether violation is a cost. (Negotiable: philosophical consensus lacking).
  4. **Act/Speaker Distinction:** Assertions can be proper yet blameworthy, or improper yet excusable. Theory must separate act norms from speaker culpability. (Non-negotiable: prevents category errors).
  5. **Hedging:** "Probably P" is pervasive. Is this a weaker norm, content, or loose talk? Theory requires an account. (Non-negotiable: ubiquitous practice).
  6. **Evidence Challenges:** Challenged asserters offer grounds, not sincerity. This establishes an objective standard beyond mental states, but not necessarily knowledge. (Non-negotiable: structural feature).

  **Analysis:**
  Requirements 1, 4, 5, and 6 are non-negotiable; they define the practice's structure. 2 and 3 are negotiable due to conflicting intuitions.
  **Incompatibility:** 2 (Lottery) and 3 (Selfless) tension is acute. Lottery suggests belief/justification insufficient (pushing Knowledge). Selfless suggests belief unnecessary (pushing Truth). A monistic norm struggles here; satisfying both may require pluralism.
  **Most Exclusionary:** 2 (Lottery). It eliminates Truth and Justified Belief rules aggressively, forcing explanations for why high probability fails. This structures the debate by ruling out probabilistic accounts.

  **Bookkeeping:**
  I am highly confident this list isolates the central tensions without presupposing the Knowledge Rule. I am least sure about Selfless Assertion; uniform experimental verdicts against it would elevate it to non-negotiable status.
