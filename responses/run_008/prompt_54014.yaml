answer: |-
  **Atrocity Labeling Rubric**

  **Step 1: Protected Group.** Is the target national, ethnic, racial, or religious? (1948 Convention Art. II). Political/class groups are excluded. *Judgment Call:* If identity is contested, record reasoning on perpetrator perception versus victim self-identification. This determines jurisdictional scope.

  **Step 2: Enumerated Acts.** Do acts fit Art. II (a)-(e)? Killing; serious bodily/mental harm; conditions calculated to destroy; preventing births; forcible child transfer. Pure cultural destruction (language, institutions) fails here unless tied to child transfer or births. *Judgment Call:* Assess whether "conditions of life" (e.g., starvation) are calculated to destroy or merely displace.

  **Step 3: Specific Intent (*Dolus Specialis*).** Is there intent to destroy the group "as such"? Infer from: systematic exclusivity of targeting; official dehumanization; refusal of survival options. Absence of explicit orders is not exculpatory. *Judgment Call:* If intent is ambiguous, record the inferential basis explicitly. Do not hide behind "evidence is unclear."

  **Fallback Hierarchy.** If Step 1 fails: Crimes Against Humanity (CAH)—commits us to prosecuting widespread attacks on civilians, regardless of group identity. If Step 2/3 fail: Ethnic Cleansing (descriptive, not legal crime) or Persecution. Ethnic cleansing signals forced removal; CAH signals widespread abuse.

  **Political Integrity.** We do not mirror state avoidance. Naming "genocide" triggers prevention duties under the Convention; euphemisms obscure liability. Use the legal threshold, not diplomatic comfort. If evidence supports the label, we apply it regardless of diplomatic cost. Our mandate is accuracy, not policy convenience.

  **Application**

  1.  **Khmer Rouge (Political/Class):** Step 1 Fail. Victims defined by class/politics. *Outcome:* Crimes Against Humanity. *Uncomfortable:* Despite enormous death toll, legal definition excludes political groups. This reflects the Soviet compromise you studied, not moral reality. The rubric forces us to acknowledge the legal gap rather than stretching the term.
  2.  **Myanmar-Rohingya (Protected/Acts/Intent):** Step 1 Pass (Ethnic/Religious). Step 2 Pass (Killing, conditions, births). Step 3 Pass (Inferred from systematic village destruction and exclusion). *Outcome:* Genocide. The pattern suffices for intent; no smoking gun needed.
  3.  **Cultural Destruction (Lemkin-style):** Step 1 Pass (Ethnic/Religious). Step 2 Fail (Language/institution destruction not enumerated; few killings/child transfers). Step 3 Fail (Intent to destroy culture ≠ intent to destroy group physically/biologically). *Outcome:* Crimes Against Humanity/Ethnic Cleansing. *Uncomfortable:* Lemkin's core concern (national pattern destruction) is legally invisible unless children are transferred. The Convention narrowed his vision significantly.

  **Limitations**

  This procedure cannot settle mixed-motive cases where destruction is a byproduct of counter-insurgency rather than an end goal. It relies on available evidence; hidden intent remains invisible until archives open. It cannot bridge the gap between Lemkin's sociological concept and the Convention's criminal law tool. Finally, it cannot predict future escalation; a "non-genocide" label today does not preclude genocide tomorrow. Human judgment is required at every inference point; the rubric structures discretion, it does not eliminate it. The "uncomfortable" outcome in Case 1 highlights that legal genocide is narrower than mass atrocity. The rubric ensures consistency, but cannot fix the Convention's exclusions. We must record when the law fails the reality.
