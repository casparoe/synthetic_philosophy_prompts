          *   *Analysis:* This is a standard compatibilist/pragmatic response. If $Utility(A) = Utility(B)$, then $Utility(A) \ge Utility(B)$ and $Utility(B) \ge Utility(A)$. Rational choice theory usually allows selection of any maximal option. The "starving" outcome is irrational by definition of agency.
