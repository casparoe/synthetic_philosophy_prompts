      *   *Stochastic Parameterization:* This is the strongest evidence for the "Statistical Mechanics" view. It acknowledges that $F=ma$ doesn't help you predict cloud formation in a 50km grid cell directly. You need bulk properties.
      *   *Probability:* The user asks if it's epistemic or objective. The answer is likely *both*, depending on the scale. Initial condition uncertainty is epistemic. Sub-grid turbulence is effectively objective (thermal fluctuations, molecular chaos).
