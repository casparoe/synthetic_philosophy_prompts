      *   *Key Insight:* He seems to separate *intrinsic moral status* (based on what the thing *is*) from *derivative moral status* (based on how we relate to it). The Tamagotchi has derivative status. The unconscious human has intrinsic status (perhaps based on past capacity or species norm). The NPC has neither.

