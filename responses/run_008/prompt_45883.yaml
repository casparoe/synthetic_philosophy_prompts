      *   *Selection:* Let's go with **The "Adopted AI."** If *he* forms the attachment, does the derivative status become strong enough to mimic intrinsic status? Or **The "Synthetic Biological."** A robot made of synthetic flesh that bleeds but has no neurons.
      *   *Decision:* The **"Synthetic Flesh"** case. It tests Biology vs. Function. If it bleeds and screams (mechanically) but has no neurons, does he care?
      *   *Wait, a sharper divider:* **The "Comatose AI."** An AI that *was* conscious (by some metric) but is now turned off/sleeping. Does it have the "unconscious human" status? This tests Biological Naturalism vs. Potentiality/Function.
