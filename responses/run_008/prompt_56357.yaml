answer: |-
  **Reflective Summary: Adjudication of the IEDS Seminar Discussion**

  **To:** Game Theory Module Tutor
  **From:** [Your Name]
  **Date:** Friday
  **Subject:** Adjudication of Seminar Discussion on Iterated Elimination of Dominated Strategies

  Following the problem class on the 3×3 game provided, I have analysed the exchange between Julian and Farida regarding the epistemic and behavioural assumptions underpinning Iterated Elimination of Dominated Strategies (IEDS), particularly when mixed strategies are invoked. Below is a move-by-move adjudication of their five-point exchange, followed by an assessment of the broader theoretical issues they raised.

  ### Move-by-Move Adjudication

  **Move 1: Julian's Claim on Mixed Domination**
  *Julian argues that deleting C costs no assumptions because strict domination by a mixture stands on the same footing as domination by a pure strategy.*
  **Adjudication:** Julian is **internally consistent but externally imprecise**. Within the standard von Neumann-Morgenstern (vNM) framework, he is correct: if a strategy is strictly dominated (by pure or mixed), it cannot be a best response to any belief, and a rational agent should not play it. However, his claim that this 'costs nothing in the way of assumptions' is incorrect. It presupposes that the player's preferences satisfy the independence axiom and that the payoff numbers represent utilities that are linear in probabilities.

  **Move 2: Farida's Expected-Utility Objection**
  *Farida counters that 'strictly better' implies expectation, requiring EU maximisation and the ability to randomise.*
  **Adjudication:** Farida is **substantively correct**. This is not a mere technicality. If a player cannot access a randomisation device (a 'coin toss') or if their preferences violate linearity (e.g., they exhibit ambiguity aversion or rank-dependent utility), the expected payoff of the mixture $(0.5A + 0.5B)$ is not well-defined or comparable to $C$ in the standard way. In such cases, $C$ might not be dominated. Her objection highlights that IEDS with mixed strategies is not assumption-free; it relies heavily on the specific structure of vNM utility theory.

  **Move 3: Julian's Normative Defence**
  *Julian shifts to epistemic conditions, arguing later rounds require a tower of beliefs (Common Knowledge of Rationality), which is a normative ideal rather than an empirical hypothesis.*
  **Adjudication:** Julian is **conceptually sound**. He correctly identifies that IEDS relies on Common Knowledge of Rationality (CKR). By framing the solution as a 'normative ideal', he insulates the logic from empirical falsification. If the axioms hold, the conclusion follows deductively. He is right that game theory often prescribes how agents *ought* to reason if they are perfectly rational, regardless of whether humans actually do so.

  **Move 4: Farida's Predictive Critique**
  *Farida replies that a normative ideal nobody satisfies is a poor prediction; real play depends on empirical reasoning depths (Level-k), making the solution a convention of the trained rather than a law of behaviour.*
  **Adjudication:** Farida is **pragmatically correct**. She identifies the gap between 'solution concepts' and 'predictive accuracy'. In a one-shot game without established conventions, CKR is rarely met. Her distinction between the 'exam context' (where the rules of the game include the assumption of rationality) and the 'pub context' (where they do not) is a crucial insight into the sociology of game theory. The solution (B, R) is stable only if both players believe the other will arrive at (B, R).

  **Move 5: Julian's Closing on Irrationality**
  *Julian concludes Farida has conceded the axioms and is merely complaining that people are irrational.*
  **Adjudication:** Julian is **partially mistaken**. He conflates 'violating the model' with 'irrationality'. Farida was not merely saying people make mistakes; she was questioning whether the model's axioms (specifically regarding mixtures and knowledge) are the appropriate tools for the job. To dismiss this as 'irrationality' is to beg the question. However, within the confines of a mathematics-and-economics programme, Julian is right that we proceed *as if* the axioms hold to derive the logical implications.

  ---

  ### Analysis of Key Theoretical Issues

  **1. Is Farida's Expected-Utility Objection a Real Objection or a Technicality?**
  It is a **real objection**. In many introductory contexts, mixed strategies are treated as a mathematical convenience to 'smooth out' the payoff space. However, ontologically, checking for domination by a mixed strategy requires us to treat the mixture as a viable option available to the player. If a player is restricted to pure strategies (no randomisation device), $C$ is not dominated by $A$ or $B$ individually. Consequently, the set of rationalisable strategies would be larger, and the unique solution (B, R) might not be reached. Farida correctly identifies that the 'mixture' is not just a calculation tool but carries behavioural baggage regarding risk and randomisation.

  **2. Can Julian's Distinction Between Normative Ideal and Empirical Prediction Carry the Weight?**
  It carries weight **within the discipline, but not in application**. Julian's distinction is the standard defence of non-cooperative game theory: it is a logic of consistency, not a psychology of choice. This is sufficient for solving exam problems and understanding equilibrium concepts. However, as Farida notes, this limits the theory's explanatory power in novel, one-shot interactions. If the goal is prediction, Julian's defence is insufficient; if the goal is characterising the implications of rationality, his defence holds. The tension arises because the module likely presents IEDS as both a logical tool and a predictive device.

  **3. What Are They Missing?**
  Both students overlook two subtle but critical points regarding IEDS with mixed strategies:

  *   **The Ontological Status of Mixtures in Elimination:** When we say $C$ is dominated by a mixture of $A$ and $B$, we do not necessarily require the Row player to *play* the mixture. We only require that there *exists* a probability distribution over $A$ and $B$ that yields higher utility. This is a test of **rationalisability**. If a strategy is dominated, it is not rationalisable. Farida's concern about 'implementing the randomisation' is slightly misplaced; the player need not toss a coin to play $B$, but the *threat* that they *could* mix is what makes $C$ untenable.
  *   **Epistemic Robustness:** They miss that the order of elimination matters for the *justification*, even if the final set is the same. The first step (deleting $C$) requires only Row's rationality. The second step (deleting $L, M$) requires Column to know Row is rational. The third (deleting $A$) requires Row to know Column knows Row is rational. This hierarchy is fragile. If there is even a tiny doubt about rationality (e.g., a 1% chance the opponent is 'crazy'), the whole chain can collapse (as shown in the Email Game or Centipede Game literature). Neither student fully appreciated how sensitive the derivation is to the 'common knowledge' assumption.

  ### Conclusion

  Julian is correct on the **internal logic** of the module: given vNM preferences and CKR, (B, R) is the unique rationalisable outcome. Farida is correct on the **external validity**: the assumptions required to get there are strong, behaviourally specific, and often absent in reality.

  For the purposes of the course, Julian's reasoning allows us to solve the problem. However, Farida's critique is essential for understanding *why* the solution might fail in practice. A complete understanding of IEDS requires acknowledging that it is a rigorous deduction from strong premises, not a description of universal human behaviour.

  Yours sincerely,

  [Your Name]
  Second-Year Mathematics-and-Economics Student
