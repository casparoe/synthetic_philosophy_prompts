answer: |-
  (1) The question
  Under what specific conditions does the strategic interaction between competing AI labs shift from a Prisoner's Dilemma to a Stag Hunt, given specific ratios between the alignment tax and the first-mover advantage? This project seeks to identify the threshold values where safety constraints cease to be competitive liabilities and become stable coordination points. By defining the relationship between the cost of alignment and the value of speed, the research will determine whether the AI race is structurally doomed to unsafe outcomes or if mutual restraint is a viable equilibrium under plausible parameter ranges.

  (2) What the standard framing misses
  The engineering view treats the alignment tax as a static technical overhead, something to be minimized through better interpretability or RLHF. This ignores the competitive context entirely, assuming a solo developer scenario. The strategic view acknowledges competition but defaults to a Prisoner's Dilemma: any lab slowing down for safety loses market share to a faster, reckless rival. This assumes the first-mover advantage always outweighs the cost of safety. Both frames obscure the critical variable: the relative magnitude of the tax versus the lead gained by cutting corners. If the tax is small relative to the lead required to dominate, safety becomes a focal point for coordination rather than a suicide pact. By conflating these, current discourse pushes policymakers toward purely technical subsidies (shrinking the tax) while neglecting structural interventions (changing the game) that might be more robust when the tax is unavoidable. Consequently, resources are misallocated toward solving technical problems that may not be the bottleneck, while governance mechanisms that could stabilize cooperation remain underexplored. The error lies in treating the race structure as fixed rather than endogenous to policy choices. Competitiveness is comparative: a lab loses ground only if its tax exceeds its rival's, or exceeds its own lead. The standard framing assumes the tax is always prohibitive, ignoring parameter ranges where safety costs are negligible compared to scaling advantages. This leads to a policy blind spot. If the race is a Prisoner's Dilemma, only shrinking the tax helps. If it is a Stag Hunt, changing the payoff structure via liability or compute governance works better. Confusing these leads to ineffective regulation. We need to know which game we are playing before choosing the moves. Thus, the primary theoretical gap is the lack of a conditional framework linking technical costs to strategic stability.

  (3) Method
  Month one focuses on conceptual clarification and variable definition. I will analyze the philosophical assumptions underlying current race narratives, distinguishing between absolute and relative competitiveness. This involves synthesizing arguments from collective action theory to refine the definition of the "alignment tax" not as a fixed cost but as a strategic variable dependent on rival behavior. I will produce a conceptual map linking technical safety constraints to economic incentives. Month two shifts to formal modeling. I will construct a normal-form game representing lab interactions, parameterizing the alignment tax against the first-mover advantage. I will identify the threshold values where the Nash equilibrium shifts from mutual defection (Prisoner's Dilemma) to mutual cooperation (Stag Hunt). This will be theoretical, using parameter ranges rather than empirical lab data, focusing on existence proofs for stable safety equilibria. I will perform sensitivity analysis to determine how robust the Stag Hunt equilibrium is to variations in information asymmetry and enforcement costs. Month three involves policy translation and synthesis. I will map the model's stability conditions to specific governance mechanisms, distinguishing between interventions that shrink the tax versus those that alter the payoff structure. I will categorize policy levers into two families: technical subsidies that reduce safety costs, and structural regulations like liability rules or compute governance that raise the cost of being the unsafe first mover. I will evaluate which family is robust under different parameter ranges identified in month two. The output will be a working paper combining philosophical argumentation with formal proofs, suitable for submission to a governance journal. I will also present findings to institute fellows for feedback on practical applicability and refine the policy recommendations accordingly. This ensures the theoretical model connects to real-world regulatory tools. Throughout the process, I will maintain regular contact with institute mentors to ensure the modeling assumptions remain grounded in plausible industry dynamics.

  (4) What a result looks like
  A successful result would produce a threshold theorem: for example, demonstrating that if the alignment tax remains below 15% of the potential first-mover capability lead, the race stabilizes as a Stag Hunt rather than a Prisoner's Dilemma. This would shift a regulator's strategy from subsidizing safety research (to lower the tax) to enforcing compute governance (to reduce the first-mover lead). Instead of asking "How do we make safety cheaper?", the question becomes "How do we reduce the reward for being first?" This changes funding priorities from purely technical alignment grants toward international coordination mechanisms and liability insurance requirements, offering a more durable path to risk reduction even if technical safety remains expensive. Ultimately, this provides a decision rule for regulators facing uncertainty about technical progress.

  (5) Failure conditions
  The project fails if "competitiveness" proves too multifaceted to model as a single payoff variable. If market dynamics depend on non-linear factors like regulatory capture or consumer trust that cannot be parameterized, the game-theoretic abstraction will be vacuous. Additionally, the question is ill-posed if the alignment tax cannot be meaningfully separated from capability gains; if safety and speed are jointly produced rather than trade-offs, the core variable disappears. Finally, if the threshold between game structures turns out to be so sensitive to unknown empirical parameters that no robust policy advice can be derived, the work will remain purely theoretical without governance utility. In these cases, I will pivot to a qualitative typology of race dynamics rather than a formal model. This contingency plan preserves the project's philosophical value.
