answer: |-
  This is a classic problem in the ethics of memory, and your intuitions are actually more coherent than you give them credit for. You are wrestling with the conflict between **history as record** (what happened) and **history as honor** (what we value).

  Your tentative principle ("track the achievement... unless bad faith") is a good start, but it fails because it focuses too much on the *person* and not enough on the *object* or the *community relationship* to that object. A grave marker functions differently than a courthouse statue, which functions differently than a street name.

  Here is a proposal for a principled framework that captures most of your verdicts, followed by an honest audit of where your inconsistencies lie.

  ### The Proposed Framework: "Civic Endorsement & Function"

  Instead of one rule, a naming commission needs a **weighted test**. A commemoration should be removed or altered if it fails the following three criteria. The more criteria it fails, the stronger the case for removal.

  **1. The Function Test (Honor vs. Record)**
  *   **Honorific:** Statues, building names, street names. These imply current civic endorsement of the namesake as a model for citizens.
  *   **Record-Keeping:** Graves, historical markers, plaques describing battles. These document existence or events without necessarily endorsing the moral character of the deceased.
  *   *Principle:* We have a higher burden to maintain *Honorific* markers than *Record-Keeping* ones.

  **2. The Context of Erection Test (Bad Faith vs. Contemporary Norms)**
  *   **Weaponized:** Was the commemoration erected specifically to assert dominance, intimidate a minority, or rewrite history at a time of racial/social tension? (e.g., 1920s Confederate statues).
  *   **Standard:** Was the commemoration erected according to the standard norms of its time, even if those norms were flawed by today's standards?
  *   *Principle:* "Weaponized" commemorations lose their claim to neutrality and become active harms.

  **3. The Endorsement Horizon (Living vs. Deep Past)**
  *   **Active Partnership:** Naming rights for living donors or recent figures imply an ongoing partnership and current civic approval of their character.
  *   **Historical Stratigraphy:** Names from the deep past are part of the "layers" of the city's history. Removing them can feel like erasing the historical record of who *was* valued, even if they are no longer valued *now*.
  *   *Principle:* We scrutinize current endorsements heavily; we treat deep-past names as historical artifacts unless they actively cause harm (see Test 2).

  ---

  ### Auditing Your Verdicts

  Here is how your cases map onto this framework, and where the seams show.

  **1. Confederate General (Courthouse, 1920s): REMOVE**
  *   **Verdict:** Consistent.
  *   **Why:** Fails Test 2 (Weaponized). Erected during Jim Crow to intimidate. Fails Test 1 (Honorific). It is a statue, not a grave.
  *   **Principle:** Active harm outweighs historical record.

  **2. Confederate General (Grave): KEEP**
  *   **Verdict:** Consistent.
  *   **Why:** Passes Test 1 (Record-Keeping). A grave marks a death, not necessarily a civic virtue. Removing it desecrates a burial site, which is a different moral category than removing a statue.

  **3. Slaveholding Founding Father (Street): KEEP**
  *   **Verdict:** Consistent (mostly).
  *   **Why:** Passes Test 3 (Deep Past). They are "canonical." Removing them creates disproportionate disruption (Test 3) and they weren't erected in the 1920s to intimidate Black residents specifically (Test 2), even if their legacy does that now.
  *   **Tension:** This relies on a "Proportionality" clause. We keep them because the cost of removal is too high, not because they were morally good.

  **4. Eugenics Politician (Renamed in 90s): KEEP RENAMING**
  *   **Verdict:** Consistent.
  *   **Why:** Passes Test 2 (Weaponized/Flawed). Eugenics was a specific policy failure, not a "canonical" historical inevitability like slavery in the 18th century. Also, the democratic will was already expressed in the 90s.

  **5. Union General (Native Massacres): KEEP**
  *   **Verdict:** **INCONSISTENT (The Load-Bearing Flaw).**
  *   **Why:** This is your biggest logical leak. If the Confederate statue comes down because the General fought to enslave Black people, the Union General should be scrutinized for fighting to displace/kill Native people.
  *   **The Only Defense:** You must argue **Test 2 (Context of Erection).** If the Union statue was erected in 1865-1880, it was about preserving the Union and ending slavery (a net moral good that outweighs the Native policy *in the eyes of the erectors*). If it was erected in 1920 alongside the Confederate one, your verdict is hypocritical.
  *   **Fix:** If you keep this, you must commit to **Contextualization**. The statue stays, but a plaque must explicitly detail the massacres. You cannot honor the "Union" without acknowledging the cost to Indigenous peoples.

  **6. Living Donor (Fraud): STRIP**
  *   **Verdict:** Consistent.
  *   **Why:** Fails Test 3 (Active Partnership). Keeping the name implies the city currently endorses him. He is a current liability.

  **7. Dead Donor (40 Years): KEEP**
  *   **Verdict:** Consistent (with a caveat).
  *   **Why:** Passes Test 3 (Historical Stratigraphy). The building's history includes his money. Stripping it rewrites the building's origin story.
  *   **Caveat:** This only holds if the fraud wasn't *directly* harmful to the city's residents (e.g., if he defrauded the city itself, remove it. If he defrauded shareholders in NY, keep it).

  **8. The Doctor (Polio Hero / Segregationist): THE HARD CASE**
  *   **Verdict:** **CONTEXTUALIZE, DON'T REMOVE.**
  *   **Why:** She passes Test 1 (Honorific for specific good). She fails Test 2 (Private bad acts).
  *   **Principle:** **The "Nexus Test."** Did the bad acts *enable* the good acts? Did segregationist housing policies fund the polio clinic?
      *   If **No:** Keep the name, add a plaque. Her medical contribution stands independently of her housing views.
      *   If **Yes:** Remove the name. The "achievement" is tainted by the method.
  *   **Prediction:** Most mixed-legacy cases should be resolved by adding history (plaques), not erasing names, unless the "bad" directly undermined the "good" they are honored for.

  ---

  ### Predictions for Your New Cases

  **1. Donor whose company poisoned a river (Dead, wing renamed once)**
  *   **Verdict:** **KEEP.**
  *   **Reasoning:** Test 3 (Stratigraphy). The wing has already been renamed once. To rename it again turns the building into a weather vane for every new scandal. At a certain point, the name becomes "The name of the guy who paid for this in 1980," not "Our endorsement of this guy in 2024."
  *   **Exception:** If the poisoning specifically harmed *this* city's residents, the "Active Harm" clause overrides Test 3.

  **2. Streets named for the losing side in another country's civil war**
  *   **Verdict:** **KEEP (usually).**
  *   **Reasoning:** Test 2 (Local Context). Unless this community has a specific demographic tie to that conflict (e.g., a large Armenian community naming a street after an Armenian nationalist), it is likely historical curiosity rather than civic endorsement. It lacks the "Weaponized" local context of the Confederate statue.

  **3. Statues of Ancient Philosophers (Monstrous views)**
  *   **Verdict:** **KEEP.**
  *   **Reasoning:** Test 1 (Function). These are usually "Canonical/Educational," not "Civic Honor." We name school buildings after Plato to signify "Education," not "We endorse Plato's views on slavery." They are treated as historical archetypes, not moral models.

  ---

  ### The Honest Audit: What You Need to Overturn

  You suspected the Union General and the Dead Donor were your inconsistencies. You were half-right.

  1.  **The Union General:** You cannot logically keep a statue of a man who massacred Native villages while removing a Confederate general, *unless* you lean heavily on the **Date of Erection**.
      *   *Action:* Check the dedication date of the Union statue. If it's post-1900, you have a bias problem. If it's 1860s-1880s, your principle holds (different historical context), but you **must** mandate a plaque explaining the Native American policy. You cannot have "Silent Honor."

  2.  **The Dead Donor:** This is actually defensible under "Historical Stratigraphy," *but* only if you apply it consistently.
      *   *Action:* You need a "Statute of Limitations" clause. If a donor has been dead for >25 years, their name becomes historical record, not active endorsement. If <25 years, it's active endorsement. This prevents the "40 years" verdict from looking like arbitrary laziness.

  3.  **The Founding Father (Hidden Inconsistency):** You said keep the slaveholding Founding Father. But under your "Bad Faith" principle, many Founding Father monuments were *also* erected in the 1920s-1950s to cement a specific nationalist narrative that excluded Black Americans.
      *   *Action:* You don't have to remove Washington streets. But you should apply the **Contextualization** rule here too. If a Founding Father statue lacks mention of slavery, your commission should recommend adding it.

  ### Summary Principle for the Commission

  If you need a single paragraph to hand to your colleagues, try this:

  > "The Committee evaluates commemorations based on **Civic Function** and **Contemporary Endorsement**. We distinguish between **Honorific Markers** (statues, building names) which imply current civic values, and **Historical Records** (graves, battlefields) which document the past. Honorific markers should be removed if they were erected in **Bad Faith** (to intimidate or exclude) or if the namesake's legacy is **Incompatible** with current civic values *and* the name implies active endorsement (e.g., living donors). For mixed-legacy figures from the deep past, we prefer **Contextualization** (plaques, education) over removal, unless the harm caused by the figure directly negates the achievement they are honored for."

  This allows you to keep the Founders (Deep Past/Contextualize), remove the Confederate Statue (Bad Faith/Honorific), keep the Grave (Record), and strip the Living Donor (Active Endorsement), while forcing you to address the Union General via Contextualization.
