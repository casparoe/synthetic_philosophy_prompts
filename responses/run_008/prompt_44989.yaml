prompt: |-
  I do claims policy at a mid-sized home insurer, and I need your help with something that turns out to be weirder than it sounds. Our policies cap payouts per "article" — so whether the destroyed thing counts as one article or several can swing a claim from fully covered to mostly out of pocket, and adjusters argue about it constantly with no framework. Recent examples: a sectional sofa ruined by smoke (one article or five interlocking pieces?), a modular garage shelving system, a fence blown down in a storm (one fence or forty panels?), a custom kayak with an aftermarket rudder and fishfinder, and a set of china that's only valuable as a set.

  Here's the thing — I gather there's an actual live debate in metaphysics about when a bunch of parts make up one thing. Like, one camp apparently says any old parts whatever always compose a further thing, another camp says strictly speaking there are no composite objects at all, a third says only special things (living organisms?) get to count as one, and some people think there's no informative rule and it's just a brute fact. This sounds exactly like our problem, except our adjusters have fifteen minutes per call and can't be discussing ontology with a customer whose stuff just burned.

  So: write me a decision procedure an adjuster could actually run during a claims call, in plain language. I want the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and says "pay out as one article," where it says "several articles," and where it has to punt to a human because it's a values/policy call rather than a fact. Ground it in what those metaphysical positions actually imply — but be honest about where the theory just doesn't answer the adjuster's question and we're improvising. If the procedure only works because we quietly adopted one of those camps as policy, say that explicitly, because I'd rather know when we're choosing universalism for bookkeeping reasons than pretend the metaphysics settled it.

  Then run it on three cases: (1) the sectional sofa, (2) the fence, and (3) a homeowner whose built-in floor-to-ceiling bookshelves were destroyed, where the question is whether those count as part of the house structure (different sublimit) or as furniture. Also worth handling somewhere: over the years before the storm, about half the fence's panels had been individually replaced after smaller incidents — does that change what "the fence" even is, or is that a different question than the composition one?

  Constraints: adjusters have ~15 minutes, no jargon they'd have to look up, anything that changes typical payouts needs my sign-off, and if some step only works if we rewrite the policy language, flag that instead of burying it. Include at least one case where the procedure gives an answer I'm going to hate defending to the customer, because I want to know where those are before we roll this out.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Claims policy manager at a mid-sized home insurer.
      *   **Problem:** Policy caps payouts per "article." Determining what counts as one "article" vs. many is causing disputes and inconsistency (sofa, fence, shelves, etc.).
      *   **Context:** There's a real metaphysical debate (composition) relevant here (Universalism, Nihilism, Organicism, Brutalism).
      *   **Task:** Create a practical decision procedure for adjusters (15 mins/call, plain language) grounded in these metaphysical concepts but honest about where policy overrides philosophy.
      *   **Requirements:**
          *   Step-by-step questions.
          *   Stop conditions (One Article vs. Several Articles vs. Escalate).
          *   Explicitly state where the company is adopting a specific metaphysical stance for bookkeeping.
          *   Run the procedure on three cases: Sectional Sofa, Fence (with replaced panels), Built-in Bookshelves.
          *   Include at least one outcome that will be hard to defend to customers.
          *   Flag any steps requiring policy language rewrites.
      *   **Constraints:** No jargon, 15-minute limit, acknowledge where theory fails and improvisation begins.

  2.  **Deconstruct the Metaphysics vs. Insurance Reality:**
      *   *Mereological Universalism:* Any collection of parts is an object. (Bad for insurance: everything is one article, or everything is infinite articles).
      *   *Mereological Nihilism:* Only simples exist. (Bad for insurance: nothing is covered as a composite, or everything is scrap).
      *   *Mereological Organicism:* Only living things are composites. (Bad for insurance: furniture never counts as one).
      *   *Functional/Conventionalism (The "Common Sense" view):* Things are objects based on function, unity, and social convention. (This is the only workable model for insurance).
      *   *Insurance Reality:* We need financial predictability. "Article" usually implies a distinct unit of value, function, and replaceability.

  3.  **Drafting the Decision Procedure (The "Article Unity Test"):**
      *   *Goal:* Fast, binary decisions where possible.
      *   *Philosophy:* We are implicitly adopting a *Functional-Conventionalist* view, leaning towards *Moderate Restrictivism* (things are one unit if they function as one and are sold/treated as one).
      *   *Step 1: Physical Connection.* Are they physically attached? (Nails, glue, interlocking mechanisms designed for permanence).
      *   *Step 2: Functional Unity.* Do they work together to do one job? (A sofa seats people; a fence encloses yard).
      *   *Step 3: Market/Transaction Unit.* How is it sold? (One SKU or many?).
      *   *Step 4: Replacement Logic.* If one part breaks, do you replace the part or the whole?
      *   *Escalation:* If answers are mixed, or value is high, or customer pushes back hard.

  4.  **Refining the Procedure for the User's Constraints:**
      *   Need to be honest: We are *choosing* a definition, not discovering a metaphysical truth.
      *   Need to flag policy rewrites: If the current policy says "article" without defining it, we are legally vulnerable.
      *   Need the "Hard to Defend" case: Usually, this happens when functional unity clashes with physical separability (e.g., the fence or the china).

  5.  **Developing the Test Cases:**
      *   *Case 1: Sectional Sofa.* Interlocking, sold as a set, functions as one seat. *Verdict:* One Article. (Easy win).
      *   *Case 2: Fence.* 40 panels. Some replaced over time. Physically connected but modular. *Verdict:* This is the tricky one. If we say "One Fence," it caps low. If we say "40 Panels," it pays more. Metaphysically, the "Ship of Theseus" problem applies. *Decision:* Likely "One Article" for policy purposes, but this will anger customers.
      *   *Case 3: Built-in Bookshelves.* Attached to the house. *Verdict:* Structure vs. Content. Usually "Dwelling" coverage, not "Personal Property." This is a coverage *type* issue, not just an "article" count. I need to make sure the procedure distinguishes between "Article Count" and "Coverage Category."

  6.  **Addressing the "Replaced Panels" (Ship of Theseus):**
      *   Does replacing parts change the identity? Metaphysically, maybe. Practically, no. The *function* remains the fence. The procedure needs to treat maintenance as preserving the "One Article" status.

  7.  **Structuring the Output:**
      *   **Introduction:** Acknowledge the metaphysical rabbit hole but pivot to operational reality.
      *   **The "Article Unity Test" (AUT):** The step-by-step flow.
      *   **The "Metaphysical Disclaimer":** Where we admit we are making policy, not finding truth.
      *   **Case Studies:** Applying the AUT to the Sofa, Fence, and Shelves.
      *   **Policy Flags:** What needs legal/management review.

  8.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is 15 minutes enough for 5 steps?
      *   *Fix:* Keep the questions binary (Yes/No).
      *   *Critique:* Did I address the "Hard to Defend" requirement?
      *   *Fix:* Ensure the Fence outcome is clearly identified as the customer-unfriendly one (treating 40 panels as 1 article due to functional unity).
      *   *Critique:* Did I address the "Policy Rewrite" constraint?
      *   *Fix:* Explicitly state that "Article" needs a definition in the policy wording to support this test.
      *   *Critique:* The Bookshelf case is tricky. Is it an article? Or is it part of the house?
      *   *Fix:* The procedure needs a "Gateway Question" about Coverage Type (Dwelling vs. Personal Property) before counting articles.

  9.  **Final Polish:**
      *   Tone: Professional, pragmatic, slightly candid about the "fiction" of insurance definitions.
      *   Formatting: Clear headers, bullet points for the procedure.
      *   Check against constraints: No jargon, plain language, specific cases covered.

  **(Self-Correction Note on the Fence):** The prompt asks about the fence panels being replaced over time. This is the Ship of Theseus. If we treat the fence as one article, the replacement history doesn't matter. If we treat it as panels, the history matters (some are new, some old). To keep it simple for adjusters, the procedure should prioritize *Current Functional Unity* over *Historical Composition*. I will make sure this is highlighted as a policy choice.

  **(Self-Correction on Bookshelves):** The prompt asks if they are structure or furniture. This is technically a "Coverage Part" question (Section I vs Section II), not just an "Article Limit" question. However, if they are furniture, are they one big shelf or many shelves? I need to address both layers. I will focus on the Structure vs. Furniture distinction first, as that's the bigger financial swing.

  10. **Finalizing the Output Structure:**
      *   Executive Summary (The Metaphysical Truth).
      *   The Procedure (The "Article Unity Test").
      *   The "Hard Truths" (Policy Flags).
      *   Case Applications.
      *   Implementation Warning.

