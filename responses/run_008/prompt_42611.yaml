answer: |-
  This is a classic, textbook example of **Goodhart's Law**: *"When a measure becomes a target, it ceases to be a good measure."*

  You are standing at a critical juncture that many non-profit leaders face. You have quantitative success that feels like qualitative failure. To answer your specific questions: Yes, there is a principled way to test this. And yes, it is fair to call it "gaming," even if no one is lying.

  Here is a framework to help you diagnose the situation, reframe the concept of "gaming," and write a renewal narrative that protects your mission while securing the budget.

  ### 1. Is it "Gaming"?
  You asked if it's fair to call it gaming when nobody is lying. In behavioral economics, this isn't called lying; it's called **proxy corruption**.

  Your funders want to measure *Impact*. But Impact is hard to measure. So they chose two proxies: *Speed* and *Resolution Status*.
  *   **Speed** proxies for "Accessibility."
  *   **Resolution** proxies for "Helpfulness."

  Your volunteers are not lying. They are responding faster (true) and marking conversations resolved (true). But they have implicitly redefined "Resolution" to match the metric rather than the mission. If the mission is "alleviate isolation," a quick referral might solve a practical problem (food) but fail the mission (isolation). If the mission is "triage," the referral is a win.

  It is "gaming" in the sense that the **system is being optimized for the score, not the goal.** It is rarely malicious; it is structural. Volunteers are good people trying to hit the targets you set. If you measure how fast a carpenter hammers, they will hammer fast, even if the nails are crooked.

  ### 2. Efficiency vs. Mission Drift
  You also asked if you are being romantic about the "old way." This is the hardest part to disentangle.

  **Where the metrics might be right:**
  Peer support lines can sometimes enable dependency. If a volunteer spends 90 minutes talking to someone who actually needs a food bank, that is not "sitting with them"; that is hoarding a resource they cannot provide. If the new metrics forced volunteers to stop trying to be therapists and start being connectors, that is a genuine improvement.

  **Where the metrics are likely wrong:**
  Peer support's unique value proposition is *unconditional positive regard*. It is the only place someone can go where they don't have to "fix" anything. If "Resolved" requires a link or a phone number, you have turned emotional support into customer service. A conversation where someone cries for 45 minutes and hangs up feeling less alone is a "success" in your mission, but a "failure" in your metric (low speed, no external resource, ambiguous resolution).

  ### 3. Principled Diagnostics
  Before you write that narrative, you need data to distinguish between "Better Triage" and "Hollow Efficiency." Do not rely on the two grant metrics. Run these four quick checks:

  **A. The "Return Rate" Check**
  Look at the unique users (phone numbers/IDs). Are people coming back within 24–48 hours at a higher rate than before?
  *   *If yes:* The "resolution" wasn't real. They were churned, not helped.
  *   *If no:* The referrals might actually be working.

  **B. The Transcript Audit (Qualitative)**
  Randomly select 20 conversations from last quarter. Read them.
  *   Do they feel transactional? ("Here is a number, bye.")
  *   Do they feel relational? ("I hear you, that sounds heavy.")
  *   *Crucial:* Look for the "closing move." Are volunteers steering the conversation toward a referral just to mark it "Resolved"?

  **C. The Volunteer Sentiment Survey**
  Ask your volunteers anonymously: *"Do you feel you are providing the kind of support you signed up to provide?"*
  *   If they feel like glorified switchboard operators, you have a retention risk. Burnout will spike when the work loses meaning.

  **D. The One-Question Text-Back**
  If you have consent/protocol for it, send a one-question survey to texters 1 hour after chat: *"On a scale of 1–5, how heard did you feel?"*
  *   Speed and Referrals are *output* metrics. Feeling Heard is an *outcome* metric. Compare this score to previous quarters.

  ### 4. Writing the Renewal Narrative
  You do not need to choose between "Corruption" and "Improvement." The truth is likely "Optimization with Unintended Consequences." Funders love learning organizations. You can frame this as a sophisticated evolution of your measurement strategy.

  **Do not say:** "The metrics are making us game the system."
  **Do say:** "The metrics successfully drove efficiency, revealing a new layer of complexity in measuring impact."

  **Drafting Strategy:**

  1.  **Validate the Win:** Start by acknowledging the grant worked. "The focus on response time and resource connection has significantly reduced wait times and ensured texters receive concrete resources faster." (This makes the funders feel smart).
  2.  **Introduce the Nuance:** "However, in analyzing the qualitative data, we identified a distinction between *transactional resolution* (providing a resource) and *emotional resolution* (reducing distress)."
  3.  **Propose the "Balanced Scorecard":** Tell them you want to keep the budget (and the speed metrics) but add *guardrail metrics* to ensure quality.
      *   *Keep:* Median Time to Reply.
      *   *Keep:* Resource Referral Rate.
      *   *Add:* "Feeling Heard" Score (from text-back surveys).
      *   *Add:* Volunteer Retention/Satisfaction (internal health).
      *   *Add:* 7-Day Return Rate (are we actually helping?).
  4.  **The Ask:** "To sustain the efficiency gains while safeguarding the peer-support model, we propose using the doubled budget to implement this deeper measurement layer and train volunteers on 'Resource-Infused Empathy'—connecting people to resources without rushing the human connection."

  ### 5. The Ethical Bottom Line
  You are the guardian of the practice. If you sign that renewal narrative claiming pure success while knowing the core of the work is eroding, you are setting your organization up for a crisis in Year 2.

  If the volunteers stop feeling like they are making a difference, they will quit. If the texters stop feeling heard, they will stop texting. The metrics will look great right up until the moment the whole thing collapses.

  **Recommendation:**
  Take the money. You need it. But use the renewal narrative to **renegotiate the definition of success.** Tell the funders: *"We hit the targets you gave us. Now we know those targets measure speed, not healing. To ensure your investment actually heals people, we need to track these additional things."*

  That isn't rejecting their metrics; it's maturing them. That is how you prevent Goodhart's Law from destroying your mission.
