          *   *Return Rate:* Do they come back in 24 hours?
          *   *Volunteer Sentiment:* Do they feel useful?
          *   *User Sentiment:* "Did you feel heard?"
      *   *Section 4: The Narrative.* How to write the report.
          *   Celebrate the wins (speed, referrals).
          *   Introduce nuance (the "Resolved" metric needs calibration).
          *   Propose new metrics (Balanced Scorecard).
      *   *Conclusion:* Reassure the user. They are the guardian of the mission.

  6.  **Refining the Tone:**
      *   Needs to be empathetic, professional, and analytical.
      *   Avoid accusing the volunteers.
      *   Avoid accusing the funders (they want impact, too).
      *   Focus on *system design*.

  7.  **Key Insight to Highlight:**
      *   The definition of "Resolved" is the weak link. In peer support, resolution is internal to the texter, not external to the volunteer.
      *   Speed is a resource metric, not a quality metric.

  8.  **Final Polish:** Check against the user's specific constraints (renewal narrative next month, grant tracking two numbers). Ensure the advice is actionable for that deadline. (Self-Correction: Make sure to explicitly answer "Is it fair to call it gaming?")

  9.  **Final Output Structure:**
