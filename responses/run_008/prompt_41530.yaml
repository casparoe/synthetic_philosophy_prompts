answer: |-
  **The Scenario**
  Consider a classical Szilard engine containing a single ideal gas molecule in a box of volume $V$ thermalized at temperature $T$. A partition is inserted at the center, confining the molecule to either the Left ($L$) or Right ($R$) half with equal prior probability. A demon measures the molecule's position using a detector with symmetric noise: if the molecule is $L$, the detector reads $L$ with probability $p$ and $R$ with probability $1-p$ (and vice versa for $R$). The demon stores this measurement $Y \in \{L, R\}$ in a one-bit memory register. Based on $Y$, the demon couples the partition to a load to allow isothermal expansion to volume $V$, attempting to extract work. The cycle is only complete when the memory register is reset to a standard blank state to be reused, dissipating heat into the bath.

  ***

  **The Accounting (per cycle in units of $kT$)**

  To settle the accounting, we track the work extracted during the expansion phase ($W_{ext}$) and the work required to reset the memory ($W_{erase}$).

  1.  **Work Extracted ($W_{ext}$):**
      In the presence of noisy feedback, the maximum average work extractable from the engine is bounded by the mutual information between the system state $X$ (actual position) and the measurement $Y$. This is a standard result in information thermodynamics (Sagawa & Ueda, 2010), derived from the generalized Jarzynski equality for feedback control:
      $$ \langle W_{ext} \rangle \leq kT I(X:Y) $$
      The mutual information is defined as $I(X:Y) = H(X) - H(X|Y)$.
      *   The prior entropy of the molecule is $H(X) = -\sum \frac{1}{2} \ln \frac{1}{2} = \ln 2$.
      *   The conditional entropy (the uncertainty remaining after measurement) is the binary entropy function of the error rate: $H(X|Y) = H_b(p) = -p \ln p - (1-p) \ln (1-p)$.
      *   Thus, the extracted work is:
          $$ \frac{W_{ext}}{kT} = \ln 2 - H_b(p) $$
      Note that for $p=1$ (perfect), $W_{ext} = kT \ln 2$. For $p=0.5$ (random), $W_{ext} = 0$.

  2.  **Work Paid for Erasure ($W_{erase}$):**
      To close the cycle, the demon must reset its memory bit $Y$ to a standard state (say, '0'). Landauer's Principle states that erasing information stored in a physical memory requires dissipating heat proportional to the Shannon entropy of the memory's distribution.
      *   Since the prior on $X$ is uniform and the noise is symmetric, the marginal distribution of the measurement $Y$ is also uniform ($P(Y=L)=P(Y=R)=0.5$).
      *   The physical entropy of the memory register is $H(Y) = \ln 2$.
      *   The minimum work required to reset this bit is:
          $$ \frac{W_{erase}}{kT} = \ln 2 $$

  3.  **Net Work and Entropy Balance:**
      The net work over a full cycle (expansion + reset) is:
      $$ \frac{W_{net}}{kT} = \frac{W_{ext}}{kT} - \frac{W_{erase}}{kT} = (\ln 2 - H_b(p)) - \ln 2 = -H_b(p) $$
      The total entropy change of the universe (bath + system + memory) per cycle is $\Delta S_{tot} = -W_{net}/T = k H_b(p)$. Since $H_b(p) \geq 0$, the Second Law is satisfied.

  ***

  **The Three Checks**

  **(1) Is Jake right about the cutoff?**
  Jake is wrong. He posits a linear cutoff where $p > 0.5$ yields net profit. The math shows the net work function is $W_{net}(p) = -kT H_b(p)$.
  *   The binary entropy $H_b(p)$ is strictly positive for all $0 < p < 1$.
  *   Therefore, $W_{net}$ is strictly **negative** for any fallible demon.
  *   Crucially, at $p=1$ (the perfect textbook demon), $H_b(1) = 0$, so $W_{net} = 0$.
  *   **Verdict:** There is *no* cutoff for positive net work. Even a perfect demon merely breaks even once erasure is accounted for. The "profit" Jake sees is the gross extraction $W_{ext}$, which is positive for $p \neq 0.5$, but this is always exactly offset (or exceeded) by the debt of erasure. The point $p=1$ yielding zero net work is indeed the whole point: information is a physical resource that is consumed, not created.

  **(2) Accuracy vs. Correlation:**
  You are right; accuracy is a red herring. The usefulness of the demon is determined by the Mutual Information $I(X:Y)$, which depends on $H_b(p)$.
  *   The binary entropy function is symmetric: $H_b(p) = H_b(1-p)$.
  *   Consequently, $W_{ext}(0.25) = W_{ext}(0.75)$.
  *   A demon that is right 75% of the time and a demon that is right only 25% of the time extract the exact same amount of work.
  *   **Why?** Because the demon knows $p$. If $p=0.25$, the demon simply inverts its logic (if it reads $L$, it assumes $R$). The physical quantity that matters is the **correlation** between the memory and the system, not the semantic "truth" of the memory. A demon that is consistently wrong is maximally correlated and thus maximally useful; a demon that is random ($p=0.5$) has zero correlation and is useless.

  **(3) The Memory Tape (Skipping Erasure):**
  If the demon skips erasure and writes to a fresh tape each cycle, the Second Law is not embarrassed; the debt is simply deferred.
  *   In this open-cycle scenario, the "system" now includes the growing tape.
  *   Per cycle, the tape's entropy increases by $H(Y) = \ln 2$ (as it records a random bit).
  *   The Second Law requires $\Delta S_{bath} + \Delta S_{tape} \geq 0$.
  *   Since $\Delta S_{bath} = -W_{ext}/T$, we have $W_{ext} \leq kT \Delta S_{tape} = kT \ln 2$.
  *   **The Borrowing:** The demon is borrowing against the **free energy of the blank tape**. A blank tape is a low-entropy state; a written tape is high-entropy. By filling the tape, the demon consumes the "negentropy" of the fresh storage medium. The work extracted comes from the thermal bath, but the permission to extract it comes from consuming the order of the blank tape. Eventually, you run out of tape, and you must pay the Landauer cost to reset it.

