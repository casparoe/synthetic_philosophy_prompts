answer: |-
  ### Preamble: Theoretical Stance and Simplifications

  Before applying the procedure, the underwriting team must agree on the following theoretical simplifications. This procedure does not treat ambiguity aversion as a behavioral bias to be corrected (as in some behavioral finance critiques of Ellsberg). Instead, it treats ambiguity aversion as a **rational capital preservation constraint**. In reinsurance, model error is correlated and systemic; being "wrong" together is more dangerous than being conservative individually.

  **Simplifications Made Explicit:**
  1.  **Binary Classification:** We simplify the continuum of uncertainty into "Risk" (SEU applicable) and "Ambiguity" (MEU/KMM applicable). In reality, these blend, but for operational workflow, a trigger point is required.
  2.  **Disagreement as Signal:** We assume persistent expert disagreement is *information* about model instability (supporting MaxMin), not merely *noise* to be averaged out (supporting SEU).
  3.  **Stationarity Assumption:** We assume historical data is only valid for "Risk" classification if the underlying data-generating process is stationary. If non-stationary, data abundance does not reduce ambiguity.
  4.  **Single Period:** This procedure evaluates the submission at the point of entry. It does not model the dynamic resolution of ambiguity over the life of the contract (though renewal should re-run the procedure).

  ---

  ### Ambiguity Classification & Pricing Procedure

  | Step # | Question asked about the submission | Evidence or input needed | What counts as a sufficient answer (for "Risk" classification) | Ambiguity trigger (what answer flags the submission) | Action if triggered (incl. Modeling Tradition & Judgment Flag) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Is the data-generating process stationary?** | Historical loss triangles, exposure bases, external climate/tech trend analysis. | Statistical tests confirm stability; no known structural breaks in the environment. | **Trigger:** Evidence of structural break (e.g., climate shift, regulatory regime change, new technology adoption) despite data abundance. | **Action:** Halt routine pricing. Escalate to Risk Committee.<br>**Tradition:** MaxMin (MEU). Data cannot inform priors if the urn changes.<br>**Judgment Call:** **YES.** Determining "structural break" vs. "outlier" requires human judgment. |
  | **2** | **Is the loss mechanism causally understood?** | Engineering reports, code audits, policy wording analysis, causal maps. | Clear causal chain from exposure to loss established and agreed upon by subject matter experts. | **Trigger:** "Black box" mechanism (e.g., AI decision logic, silent cyber accumulation) where causality is opaque or contested. | **Action:** Apply high ambiguity loading or require specific exclusions.<br>**Tradition:** Smooth Ambiguity (KMM). We have beliefs about the model, but low confidence.<br>**Judgment Call:** **NO.** Binary check on existence of causal audit. |
  | **3** | **Do internal experts agree on the model structure?** | Records of actuarial/underwriting model calibration sessions; variance in individual estimates. | Consensus on frequency/severity distribution family (e.g., all agree on LogNormal). | **Trigger:** High variance in expert priors (e.g., Order-of-magnitude disagreement on severity tail). | **Action:** Price against the conservative bound of the expert set; do not average.<br>**Tradition:** MaxMin (MEU). Disagreement defines the set of priors.<br>**Judgment Call:** **YES.** Defining "high variance" thresholds is subjective. |
  | **4** | **Is the exposure correlated with systemic shocks?** | Correlation matrices, scenario analysis (pandemic, cyber epidemic, financial crisis). | Losses are idiosyncratic and diversifiable within the portfolio. | **Trigger:** Losses likely to coincide with portfolio-wide stress or capital market dislocation. | **Action:** Decline or require significant co-insurance/capital relief.<br>**Tradition:** Capital Constraint (Prudence). Ambiguity + Correlation = Ruin Risk.<br>**Judgment Call:** **YES.** Correlation under stress is never known precisely. |
  | **5** | **Can the ambiguity be contractually mitigated?** | Policy wording, exclusions, definitions of "occurrence" or "loss." | Clear definitions that exclude the ambiguous perimeter (e.g., defining "cyber" explicitly). | **Trigger:** Inability to define the perimeter of coverage without leaving "silent" gaps. | **Action:** Redraft wording. If impossible, Decline.<br>**Tradition:** Contract Theory. Reduce ambiguity by reducing coverage scope.<br>**Judgment Call:** **NO.** Legal/Compliance determination. |
  | **6** | **What is the cost of being wrong?** | Capital model impact, solvency ratio impact, reputation risk assessment. | Impact is within standard risk appetite tolerances. | **Trigger:** Potential loss exceeds risk appetite or threatens solvency rating. | **Action:** Decline.<br>**Tradition:** Safety First / Lexicographic Preferences. Survival trumps expected value.<br>**Judgment Call:** **YES.** Risk appetite application is strategic, not mathematical. |

  ---

  ### Test Submissions

  #### Case 1: AI Consequential Decision Liability
  **Scenario:** A tech firm seeks cover for an AI hiring tool that screens candidates. If the AI discriminates, the class-action liability is uncapped. There is no historical loss data for this specific algorithm.
  **Procedure Run:**
  *   Step 1: No historical data. **Triggered.**
  *   Step 2: Mechanism is opaque (proprietary algorithm). **Triggered.**
  *   Step 3: Underwriters disagree on tail severity (some say capped by regulation, others say uncapped). **Triggered.**
  *   Step 6: Potential loss exceeds single-risk appetite. **Triggered.**

  ```json
  {
    "submission": "AI_Hiring_Liability_v1",
    "ambiguity_flagged": true,
    "triggering_steps": [1, 2, 3, 6],
    "recommended_action": "Decline",
    "modeling_tradition_relied_on": "MaxMin Expected Utility (MEU) / Safety First",
    "residual_judgment_call": true,
    "rationale": "The lack of data and opaque mechanism prevents SEU pricing. Expert disagreement on the tail defines a wide prior set, and the worst-case exceeds capital appetite, triggering a decline under safety-first constraints."
  }
  ```

  #### Case 2: Coastal Flood Reinsurance (Renewal)
  **Scenario:** A long-standing client in a coastal region seeks renewal. We have 40 years of loss data. However, new climate models indicate a non-stationary baseline for sea-level rise and storm intensity in that specific region. The client expects routine pricing based on the 40-year average.
  **Procedure Run:**
  *   Step 1: Data exists, but climate models indicate structural break in the physical process. **Triggered.**
  *   Step 3: Actuaries argue over how to adjust the 40-year curve (some add loading, some want new physics-based models). **Triggered.**
  *   Step 4: Flood is highly correlated across the portfolio. **Triggered.**

  ```json
  {
    "submission": "Coastal_Flood_Renewal_2024",
    "ambiguity_flagged": true,
    "triggering_steps": [1, 3, 4],
    "recommended_action": "Escalate to Risk Committee",
    "modeling_tradition_relied_on": "MaxMin Expected Utility (MEU)",
    "residual_judgment_call": true,
    "rationale": "Despite abundant data, non-stationarity invalidates the SEU assumption that the past predicts the future. Expert disagreement on adjustment factors confirms ambiguity. Routine pricing is blocked; committee must decide on the 'worst-case' climate prior."
  }
  ```

  #### Case 3: Silent Cyber in Legacy Industrial Portfolio
  **Scenario:** A manufacturing client with legacy OT (Operational Technology) systems seeks property cover. The policy does not explicitly exclude cyber, but the exposure is unclear. Two senior underwriters disagree: one sees negligible exposure, the other sees potential for systemic shutdown.
  **Procedure Run:**
  *   Step 2: Causal chain is understood (malware -> OT failure), but perimeter is "silent." **Triggered.**
  *   Step 3: Senior underwriters disagree on exposure magnitude (Negligible vs. Systemic). **Triggered.**
  *   Step 5: Policy wording cannot easily define the perimeter without rewriting the whole contract. **Triggered.**

  ```json
  {
    "submission": "Legacy_Industrial_Silent_Cyber",
    "ambiguity_flagged": true,
    "triggering_steps": [2, 3, 5],
    "recommended_action": "Require Co-insurance or Policy Exclusions",
    "modeling_tradition_relied_on": "Smooth Ambiguity (KMM)",
    "residual_judgment_call": false,
    "rationale": "Disagreement between experts is treated as information about model uncertainty, not noise. Since the mechanism is known but the exposure perimeter is ambiguous, we apply a loading and require wording clarification rather than declining outright."
  }
  ```

  ---

  ### Assessment of Procedure Weaknesses

  This procedure is weakest in **Step 1 (Stationarity)** and **Step 3 (Expert Disagreement)**.

  In **Step 1**, the distinction between "noise/outlier" and "structural break" is inherently retrospective. In real-time (e.g., early pandemic or early climate shift), the procedure relies on the analyst's ability to recognize a regime change before the data confirms it. This invites false positives (blocking profitable business due to fear of change) or false negatives (pricing routine on breaking data). The procedure marks this as a judgment call, but it does not solve the epistemic problem of *when* to trust the break.

  In **Step 3**, treating disagreement as ambiguity (MEU) rather than noise (SEU) is a conservative choice that protects capital but may erode competitiveness. If our experts are simply inexperienced rather than facing genuine ambiguity, this procedure institutionalizes their ignorance as a pricing premium. It assumes our experts are well-calibrated; if they are not, the "conservative bound" is just a guess.

  Finally, the procedure assumes **Ambiguity Aversion is Static**. It does not account for learning. A risk flagged as ambiguous today (e.g., AI liability) might resolve into a standard risk in three years. The procedure lacks a feedback loop to downgrade ambiguity flags as data accumulates, potentially causing the reinsurer to structurally underweight emerging markets permanently.
