prompt: |-
  I teach an upper-level seminar cross-listed between philosophy of religion and formal epistemology, and I am writing the ninety-minute final. Draft one essay question on the fine-tuning argument that cannot be answered by reciting the standard summary — design versus multiverse, the universe looks set up for life, and so on. The question should instead force candidates to confront a structural worry about the argument's probabilistic core. Build the question around a hypothetical student's challenge along these lines, stated in my own words rather than quoted from any text: if the physical constants could in principle have taken any value on an unbounded continuum, then the probability of landing in any finite life-permitting interval is essentially zero on any hypothesis, theistic or not; an event of vanishing prior probability does not become more probable given design, so the likelihood ratio is flat and the evidence of fine-tuning is inert. The candidates' task is to evaluate whether that move really neutralizes the argument — for example, whether it smuggles in an improper prior, whether conditionalization on an event of zero or near-zero prior probability is well-defined here, whether the design hypothesis genuinely assigns a different probability than chance to a life-permitting universe, and whether a multiverse hypothesis competes as an explanation of the same evidence or instead changes the evidential structure itself. The question must be answerable by a strong student who has never encountered the technical literature on normalizability but who understands likelihoods, priors, and conditionalization.

  Please provide the following:

  1. The exam question exactly as candidates will see it — self-contained, closed-book, with the student's challenge stated as part of the prompt, and with any needed terminology defined inline.
  2. A model answer of about 600 words that takes a definite position rather than surveying the options and abstaining.
  3. A marking scheme consisting of five must-hit points worth four marks each (total 20). For each point, name the specific move a top answer must make, and add a one-line note on how candidates who have merely memorized the standard summary of the debate typically mishandle it.

  Write everything in American English. Do not cite, name, or attribute specific articles, authors, or works anywhere in the question, model answer, or marking scheme; I want the reasoning on the page, not a bibliography, since the exam is closed-book. End your response with a final line of the form "Crux:" followed by a single sentence naming the one distinction the question is designed to test, so that I can check your draft against my intent.
