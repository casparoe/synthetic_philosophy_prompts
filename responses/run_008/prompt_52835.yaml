answer: |-
  The step you need to drop is **(5)**.

  Specifically, the rotten clause in (5) is: *"...there's nothing special about judges, cabinet ministers, or central bankers that makes elections uniquely appropriate for them and nothing else."*

  Priya has you trapped because you are trying to fight her on the definition of **equality** (Step 1 & 3), where she is mathematically and historically strong. Aristotle *did* define democracy by the lot, and a lottery *is* mathematically the most equal distribution of probability.

  If you try to argue that a lottery isn't "equal," you lose. If you argue that democracy isn't about equality, you lose your moral high ground.

  Instead, you need to argue that **Democracy is not the only value in a constitutional system, and different offices serve different functions.** Step (5) assumes that "maximizing democracy" is the sole goal of every public institution. It isn't.

  Here is how you break the chain, answer Priya's "principled difference" challenge, and pay the cost.

  ### 1. Why Step (5) Looks Fine (But Is Rotten)
  Step (5) relies on a category error. It assumes that all public offices are essentially the same kind of thing: vessels for "political will." If every office is just a place to express the people's will, then yes, the lot is the most democratic way to fill them.

  But offices are not all vessels for *will*. Some are vessels for *judgment*, *expertise*, or *stability*.
  *   **Legislators** decide what we *want* (Values/Will).
  *   **Judges** decide what is *consistent* with what we already decided (Law/Precedent).
  *   **Central Bankers** decide what is *effective* based on technical constraints (Economics/Skill).

  Step (5) collapses these distinct functions into one bucket labeled "Public Office." That is the snap point.

  ### 2. The Principled Difference (Answering Priya)
  When Priya asks, *"What is the principled difference between an office where lottery-selection is fine and one where it isn't?"*, do not talk about the *people*. Talk about the *power*.

  **The Principle:** Sortition is appropriate for **constitutive power** (setting the rules/values), but inappropriate for **executive/judicial power** (applying the rules/values).

  *   **For Legislators (The Boule):** The job is to represent the diverse interests and values of the population. There is no "correct" answer to "should we spend more on parks or roads?" It is a matter of preference. Therefore, descriptive representation (a mini-public chosen by lot) is ideal. It mirrors the people.
  *   **For Judges/Bankers:** The job is not to express a preference, but to solve a constraint. "Does this contract violate the statute?" or "Will printing money trigger hyperinflation?" These are questions of **competence and consistency**, not preference.

  **The Analogy:**
  Imagine we are designing a hospital.
  *   **The Board (Legislature):** Should be elected or chosen by lot. They decide the *values*: "Do we prioritize cost-cutting or patient comfort?" Everyone's opinion on values is equally valid.
  *   **The Surgeons (Judges/Bankers):** Should *not* be chosen by lot. If I need heart surgery, I do not want a surgeon who won a lottery. I want the one with the best track record.

  Is healthcare political? Yes. Does that mean we should pick surgeons by lot to ensure "medical equality"? No. Because the function of the surgeon is technical execution, not value selection.

  ### 3. Re-framing Step (3) and (1)
  You said you want to keep (1) (*Political equality... requires that no citizen's political input be systematically privileged*). You can keep this, but you must refine what "political input" means.

  **The Cost:** You have to admit that **Political Equality $\neq$ Functional Equality.**
  Democracy means we are all equals in *status* and in *ultimate authority* (the Constitution/The Legislature). It does not mean we are all equally capable of *performing every task* required to run the state.

  By rejecting (5), you are admitting that:
  1.  **Elections (or Merit Selection) are "Oligarchic" in flavor, but "Functional" in purpose.** You concede Priya's point that elections favor the elite. You argue that this is a *bug we accept* to get competence. We accept the "oligarchic" filter of elections for technical roles because we value *outcomes* (stable currency, consistent law) as much as *process* (equal chance).
  2.  **A Lottery *Does* Privilege Someone.** Priya says a lottery privileges nobody. You counter: **A lottery privileges Luck over Merit.** If an office requires merit, then a system that ignores merit is systematically privileging the lucky incompetent over the skilled prepared. That is a bias, just like wealth is a bias.

  ### 4. How to Win the Argument
  Here is your script for the next seminar prep:

  > "Priya, you're right about Aristotle, and you're right that the lot is mathematically more equal. I'm conceding Step (1) through (4). The lot *is* more democratic.
  >
  > But Step (5) is where the logic breaks. It assumes 'Democracy' is the only value we are maximizing. It isn't. We are maximizing **Legitimate Governance**.
  >
  > The principled difference is **Will vs. Judgment**.
  >
  > For the Legislature, we need *Will*. We need to know what the people want. A lottery gives us a perfect mirror of the people. So, I actually agree we should use sortition for the lower house or citizens' assemblies.
  >
  > But for Judges and Bankers, we need *Judgment*. We need them to ignore what the people *want* in the moment and stick to what the law *says* or what the economy *needs*. If we pick a Central Banker by lot, we aren't achieving equality; we are gambling with the currency.
  >
  > So, I'm keeping (7). Not because democracy is bad, but because democracy is for deciding values, not for piloting planes. We don't pick pilots by lot, even though we all breathe the same air."

  ### The Cost to You
  You asked what it costs to drop Step (5).
  1.  **You admit Elections are flawed.** You have to acknowledge that our current system *is* oligarchic and that sortition might actually be better for *legislatures*. (This makes you look open-minded).
  2.  **You embrace a "Mixed Constitution."** You are arguing for a system that is Democratic in the legislature, but Meritocratic/Technocratic in the administration/judiciary. This is basically the US Constitution (House = democratic, Senate = slower/elitist, Courts = appointed, President = elected but filtered).
  3.  **You redefine Democracy.** You move from "Democracy = Everyone does everything" to "Democracy = Everyone controls the ultimate direction, but delegates the technical steering."

  Priya's argument is a pure "Athenian" model. Your counter-argument is a "Modern Constitutional" model. Both are coherent. But her model fails Step (7) (insanity of random central bankers), so her chain *must* be broken at (5).
