  **2. Diagnostic Questions/Scenarios**

  *   **For You (The Skeptic):**
      *   *Argument:* "Imagine a corporation commits fraud in 1990. All employees from 1990 are dead. The corporation still exists. Is the corporation *guilty* of fraud, or merely *liable* for the damages?"
      *   *Goal:* If you admit the corporation is *guilty* (not just liable), you must raise your probability on Term (3). If you say "liable," you confirm that your disagreement is semantic: your partner calls it guilt, you call it responsibility.

  *   **For Your Partner (The Believer):**
      *   *Argument:* "If a nation bears guilt, does that imply current citizens should feel *shame* or *remorse* personally, or merely that the state must pay a debt?"
      *   *Goal:* If they say citizens should feel personal remorse, they are committed to a very strong version of Term (2) (identity fusion). If they say "just the state must pay," ask them why we need the word *guilt* rather than *debt*. This tests if they are actually arguing for Term (5) while using the language of Term (3).

  **Recommendation:**
  The dispute likely lives in the definition of **Guilt**. If you can agree that "Collective Guilt" is a distinct technical term that does not imply individual emotional remorse but does imply a specific kind of moral stain on the institution, you may find your credences converging around 0.5. If you cannot agree on that definition, you are talking past each other.
