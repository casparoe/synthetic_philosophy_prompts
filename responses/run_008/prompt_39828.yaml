prompt: |-
  I am a sixth-form student writing the proposal for my extended essay on Rousseau's views on theatre, and I would like your help turning my half-formed idea into a proper plan. In his 1758 Letter to d'Alembert, Rousseau argues against establishing a theatre in Geneva, and part of his case is that the pity we feel for fictional suffering is a cheap discharge of sentiment: audiences weep at the misfortunes of stage characters, congratulate themselves on their tender hearts, and are thereby excused from doing anything about real misfortune. The complication that interests me is that Rousseau was himself a best-selling novelist whose fiction was famous for making readers weep, so his case against the theatre appears to condemn his own practice. My question: is his argument self-undermining when applied to his own novels, or can he consistently distinguish moving prose fiction from stage performance — for example, on the grounds that reading is solitary and demands active imagination, whereas the theatre is a communal spectacle that feeds vanity, amorous passion, and imitation of the actors? Please write a one-page research proposal for a 4,000-word essay: state the question precisely, explain why the standard reading (that Rousseau was simply inconsistent) leaves it open, outline the approach and the order in which I should work through it, indicate what would count as the essay failing, and keep the scope realistic for a single term. Do not include a bibliography or citations, as I will add those myself. Please write in British English.
