answer: |-
  **Term Paper Proposal**

  **Title:** The Lemons Problem in Cause Prioritization: Endogeneity and Selection Effects in the Importance-Tractability-Neglectedness Framework

  **1. Research Question**
  The standard Importance-Tractability-Neglectedness (ITN) framework for cause prioritization treats its three constituent variables as roughly independent inputs to a priority function. This paper asks: **To what extent does the endogeneity of neglectedness—specifically its dependence on past assessments of importance and tractability—introduce a systematic selection bias that favors low-quality causes?**

  Rather than asking whether the factors are correlated (which is an empirical question requiring data I do not have), I will ask whether the *logic* of the framework creates a structural vulnerability. If rational or boundedly rational agents allocate resources to causes with high importance and tractability, then current neglectedness is a function of past evaluations of those very qualities. Consequently, a cause that remains highly neglected may signal that previous evaluators correctly identified it as low-priority. I aim to formalize this "lemons" problem using a simple decision-theoretic model and determine if a corrected framework can mitigate the bias without requiring impossible information.

  **2. The Independence Assumption and Its Role**
  In standard expositions of the ITN framework, priority $P$ is often modeled as a product or a function of marginal returns: $P = f(I, T, N)$. A crucial, often implicit, assumption is that $I$, $T$, and $N$ are exogenous parameters. Specifically, the framework assumes that observing a high value for $N$ (high neglectedness) provides information about the *room for additional funding*, but not about the intrinsic values of $I$ or $T$.

  Mathematically, this assumes $Cov(I, N) \approx 0$ and $Cov(T, N) \approx 0$. If this holds, high neglectedness is a pure opportunity: it means diminishing returns have not yet set in.

  However, if we view cause prioritization as a market-like process where resources flow toward perceived value, $N$ becomes an equilibrium outcome. Let $N_t$ be neglectedness at time $t$. A plausible dynamic is $N_t = h(N_{t-1}, I_{t-1}, T_{t-1})$, where resources flow in proportion to perceived $I \times T$. If intrinsic value persists over time ($I_t \approx I_{t-1}$), then $N_t$ is negatively correlated with $I_t$ and $T_t$.

  When this independence assumption fails, the ITN framework does not just produce noisy estimates; it produces *systematically biased* ones. It interprets the signal "others have not funded this" as "there is funding space," when it might actually mean "others have evaluated this and left." The framework systematically overweights causes that are neglected *because* they are bad, relative to causes that are neglected due to information asymmetries or lag.

  **3. Methodology: A Toy Model of Resource Allocation**
  I will not attempt an econometric analysis of global funding flows. Instead, I will construct a static toy model to demonstrate the selection effect logically. This fits the scope of a 6000-word paper and utilizes the decision theory and microeconomics background I possess.

  **The Model Structure:**
  1.  **Causes:** A population of potential causes, each with an intrinsic value $V = I \times T$. $V$ is drawn from a distribution.
  2.  **Agents:** A set of altruistic agents (governments, nonprofits, individuals) who observe $V$ with some noise $\epsilon$ and allocate resources $R$.
  3.  **Neglectedness:** Defined as the inverse of total resources allocated: $N = 1/R$.
  4.  **The EA Analyst:** An agent using the ITN framework to select a cause. They observe $N$ directly but must estimate $V$.

  **The Analysis:**
  I will derive the expected value of a cause conditional on its neglectedness, $E[V | N]$.
  *   **Case A (Standard ITN):** The analyst assumes $V$ and $N$ are independent. They maximize $E[V] \times N$.
  *   **Case B (Endogenous Model):** The analyst recognizes that $R$ (and thus $N$) was determined by other agents estimating $V$. High $N$ implies other agents estimated low $V$.

  I will show that under Case B, the priority score for high-neglectedness causes must be discounted by a "skepticism factor" representing the probability that the cause is neglected for good reasons. I will explore how this factor changes based on the *efficiency* of the altruistic market (i.e., how accurate are the other agents?).

  **Integrating the Reference Class Problem:**
  The second knot regarding "who counts" will be integrated into the definition of $R$ in the model.
  *   If the reference class includes actors with opposing goals (e.g., lobbying on both sides of an issue), effective $R$ is lower than nominal $R$.
  *   If the reference class excludes actors with different values (e.g., government funding that doesn't align with the altruist's utility function), effective $R$ is lower.
  I will model this as a measurement error in $N$. I will argue that this measurement error interacts with the selection effect: if an analyst incorrectly narrows the reference class (ignoring government funding), they overestimate $N$. Combined with the selection effect, this double-counts the opportunity, leading to severe overinvestment in causes that are actually crowded or intractable.

  **4. Proposed Outline**

  *   **Introduction (750 words):** Introduce the ITN framework and its prominence in effective altruism. State the thesis: the independence assumption is structurally flawed due to selection effects, leading to a systematic bias toward "lemon" causes.
  *   **The Standard Framework (1000 words):** Formalize the standard ITN calculation. Explicitly state the independence axiom. Explain why this makes the math tractable but vulnerable.
  *   **The Selection Effect Model (1500 words):** Present the toy model. Define the resource allocation dynamic. Derive the negative correlation between $N$ and $V$. Demonstrate mathematically how conditioning on high $N$ lowers expected $V$ in an efficient market.
  *   **The Reference Class Complication (1000 words):** Discuss how defining "resources" and "agents" alters $N$. Show how reference class errors compound the selection bias (e.g., ignoring opposing lobbying efforts makes a cause look more neglected than it is).
  *   **Mitigation Strategies (1000 words):** Propose adjustments. Can we use "meta-neglectedness" (is this cause neglected by *informed* actors?)? Can we treat the market as a signal? Discuss the limits of these corrections.
  *   **Failure Conditions and Limitations (500 words):** (See section below).
  *   **Conclusion (250 words):** Summarize findings. Argue that ITN requires a "market efficiency" check before application.

  **5. Failure Conditions**
  A paper of this nature risks collapsing if the theoretical model does not map onto the practical reality of cause prioritization. I will explicitly acknowledge the following conditions under which my thesis would fail or lose significance:

  1.  **Market Inefficiency:** If the "market" for altruism is wildly inefficient (i.e., other funders are random or systematically blind to value), then neglectedness *is* independent of quality. If governments and large NGOs fund causes based on politics rather than $I \times T$, the selection effect weakens. I need to establish a baseline of "bounded rationality" for other actors; if they are purely irrational, my model breaks.
  2.  **Value Heterogeneity:** If the EA analyst has radically different values from the rest of the funding landscape (e.g., long-termism vs. short-term poverty relief), then the "other agents" leaving a cause is not a signal of low $V$, but of low *aligned* $V$. My model must account for value divergence. If value divergence is total, the selection effect disappears for that specific analyst.
  3.  **Dynamic Shifts:** The model assumes some persistence in $I$ and $T$. If tractability changes suddenly (e.g., a new technology makes a previously intractable problem solvable), past neglect is no longer a signal of current intractability. I must limit the scope to causes where $I$ and $T$ are relatively stable over the funding cycle.
  4.  **Triviality:** If the "correction" for the selection effect is simply "use your best judgment," the paper offers no actionable improvement over the status quo. I need to ensure the proposed mitigation is distinct from general epistemic humility.

  **6. Feasibility and Timeline**
  This project is designed for a ten-week, part-time schedule. It does not require data collection, IRB approval, or complex coding.

  *   **Weeks 1-2:** Refine the toy model equations. Ensure the algebra holds for the selection effect argument. Draft the "Standard Framework" section.
  *   **Weeks 3-5:** Write the core "Selection Effect Model" and "Reference Class" sections. This is the heavy lifting.
  *   **Weeks 6-7:** Draft the "Mitigation" and "Failure Conditions" sections. Refine the argument to ensure I am not just criticizing but offering a constructive modification.
  *   **Weeks 8-9:** Full draft review. Check word count. Ensure the transition between the mathematical model and the philosophical implications is smooth.
  *   **Week 10:** Final polish, formatting, and submission.

  **7. Anticipated Contribution**
  Existing critiques of the ITN framework often focus on the difficulty of measuring the individual variables (e.g., "how do you quantify importance?"). My paper contributes a structural critique: even if we could measure $I$, $T$, and $N$ perfectly, the *relationship* between them undermines the standard calculation. By formalizing the selection effect, I move the conversation from "measurement error" (noise) to "model specification error" (bias). This provides a clearer target for proponents of the framework to address, either by defending the independence assumption or by adopting the proposed corrections.
