      *   Actually, keep it simpler for a 6000-word paper. Focus primarily on the Endogeneity/Selection Effect. Mention the Reference Class as a compounding factor that makes measuring $N$ even harder, but don't let it derail the main argument. The prompt asks to "fold it in," not make it the second half of the paper. I will treat the Reference Class issue as a measurement error component within the Neglectedness variable in the model.

