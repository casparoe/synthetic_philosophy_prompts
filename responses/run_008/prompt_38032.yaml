      *   *Reasoning:* The mathematical proof is sound *given* the assumptions. The assumption that conditionals are propositions with truth conditions that interact normally with probability is the weak link. Restricting the thesis (Friend's point 1) makes it trivial/accidental. Primitive probability (Friend's point 2) is technically possible but doesn't save truth conditions. Therefore, the Triviality Results show that indicative conditionals cannot be standard truth-conditional propositions *if* Stalnaker's Thesis is to be maintained. Since Stalnaker's Thesis is overwhelmingly intuitive (Ramsey Test), the propositional assumption must go.
      *   *Decision:* The verdict is that indicative conditionals do not express propositions (truth-conditional contents) in the standard sense. Stalnaker's Thesis is correct as a norm of assertion/belief, which forces the no-proposition view.
      *   *Strongest Objection:* The embedding problem (how can we negate or nest something that isn't a proposition?). I need to defend the no-proposition view against this.

  7.  **Drafting the Essay - Section by Section:**

      *   **Introduction:** State the stakes. Lewis vs. Stalnaker. The core tension between probability and truth conditions. State the thesis of the essay (Lewis is right about the math, Friend is right about the implication: conditionals aren't propositions).
      *   **Reconstruction:** Explain the "Total Probability" trap. Highlight the closure assumption (the thesis must hold for $P$ and $P_A$). Highlight the ratio analysis role.
      *   **Evaluating Escape Route 1 (Single Function):** Argue that semantics must be stable across belief change. If the equation breaks upon learning $A$, it's not a meaning rule. It renders the thesis contingent and psychological.
      *   **Evaluating Escape Route 2 (Primitive Probability):** Acknowledge Popper functions. Argue that this severs the link between the conditional's truth and the world. It saves the math but loses the semantic intuition that conditionals describe how the world is.
      *   **Evaluating Escape Route 3 (No-Propositions):** This is the "Constructive" reading. Address the embedding challenge. Argue that dynamic semantics or expressivism handles this better than forcing truth conditions where they don't fit.
      *   **Verdict:** The Triviality Results prove that Indicative Conditionals are not truth-conditional propositions. Stalnaker's Thesis is correct, which *entails* the no-proposition view.
      *   **Defense against Objection:** The Embedding Problem. Acknowledge it's hard. Argue that "proposition" is the concept that needs refining, not the probability thesis. We can embed speech acts or information states.

