answer: |-
  The dispute between you and your friend concerns one of the most significant results in the philosophy of language and logic: David Lewis's triviality proof regarding indicative conditionals. At stake is the semantic status of the "if... then..." construction. Your friend argues that Lewis's mathematical result is less metaphysically devastating than often portrayed, suggesting technical loopholes or a constructive reinterpretation. You argue that these loopholes amount to evasion and that the result forces a radical conclusion about meaning. To adjudicate this, we must dissect the machinery of Lewis's argument, evaluate the proposed escape routes, and determine which philosophical cost is the least prohibitive.

  The core of Lewis's argument is a *reductio ad absurdum* targeting the conjunction of three assumptions. The first is Stalnaker's Thesis: the probability of a conditional sentence "If A, then B" is equal to the conditional probability of the consequent given the antecedent, $P(A \to B) = P(B|A)$. The second is that indicative conditionals express propositions; that is, they have truth conditions and denote members of the algebra over which the probability function is defined. The third is that the probability function obeys the standard Kolmogorov axioms, specifically the ratio analysis of conditional probability ($P(B|A) = P(A \land B) / P(A)$) and the Law of Total Probability.

  Lewis's derivation proceeds by showing that if Stalnaker's Thesis holds for a probability function $P$, it must also hold for any function $P'$ derived from $P$ by conditionalization (updating on new evidence). By applying the Law of Total Probability to the proposition $A \to B$, partitioning the space by $A$ and $\neg A$, and substituting the Thesis into the resulting equation, Lewis demonstrates that $P(B|A)$ must equal $P(B)$. This implies that the antecedent and consequent are probabilistically independent. Since this must hold for any $A$ and $B$, the result is "triviality": rational agents could only believe conditionals where the antecedent provides no information about the consequent. Since we clearly do believe non-trivial conditionals, at least one of the three assumptions must be false.

  Your friend's first defense is to restrict the scope of Stalnaker's Thesis. She suggests the equation holds only for an agent's actual credence function at a specific time, not for the family of functions closed under conditionalization. If the thesis need not hold for $P_A$ (the function updated on $A$), Lewis's derivation collapses, as the substitution step fails.

  This move, however, exacts a semantic price that renders the thesis philosophically inert. Semantics is normative and stable; it governs how meaning relates to truth and belief across changes in information. If Stalnaker's Thesis is merely a contingent feature of your current psychological state, it ceases to be a rule of meaning. Consider the Ramsey Test: to evaluate "If A, then B," we hypothetically add $A$ to our stock of knowledge and evaluate $B$. This procedure inherently involves conditionalization. If the Thesis holds for your current beliefs but fails once you actually learn $A$, then the meaning of the conditional shifts depending on your epistemic state. A semantic theory that cannot survive belief update is not a theory of content; it is a description of a temporary cognitive accident. Therefore, restricting the thesis to a single function saves the mathematics by sacrificing the semantics. It preserves the equation only by making it irrelevant to the nature of conditionals.

  Her second defense attacks the ratio analysis, proposing that conditional probability is primitive (a Popper function) rather than defined as a ratio of unconditional probabilities. It is true that Lewis's specific derivation relies on the ratio analysis to manipulate the terms within the Law of Total Probability. If $P(B|A)$ is a primitive two-place function, the algebraic pressure Lewis applies is relieved.

  While mathematically coherent, this strategy severs the intuitive link between the probability of the conditional and the world. The appeal of Stalnaker's Thesis lies in its connection to truth: it suggests that our confidence in a conditional tracks the likelihood of the consequent in the scenarios where the antecedent is true. If conditional probability is primitive, it is no longer anchored to the probabilities of truth-apt propositions ($A \land B$ and $A$). This makes it mysterious why the probability of a *proposition* (the conditional) should align with a primitive measure that does not derive from the truth of propositions. Furthermore, subsequent refinements of triviality results have shown that even with Popper functions, if conditionals are treated as standard propositions within the domain, triviality tends to re-emerge. Thus, rejecting the ratio analysis creates a disconnect between the conditional's probability and its truth conditions without successfully securing the propositional status of the conditional. It explains nothing; it merely refuses the question by changing the definition of probability.

  This brings us to your friend's third and strongest point: the constructive reading. She argues that the triviality results should not be seen as a scandal but as a discovery that indicative conditionals do not express propositions. This is the expressivist or suppositional view. On this reading, Stalnaker's Thesis is correct, and the triviality proof is valid; together, they prove that the assumption of propositional content must be discarded. Conditionals are not descriptions of the world that can be true or false; they are devices for expressing a constraint on credence.

  You expressed concern that this view cannot account for the logical behavior of conditionals, specifically embedding under negation and disjunction, nested conditionals, and the validity of Modus Ponens. These are legitimate challenges, often grouped under the Frege-Geach problem. If "If A, then B" has no truth value, how can we say "It is not the case that if A, then B"? How can it serve as a premise in a valid argument?

  However, the objection that expressivism cannot handle logic is no longer decisive. Modern semantic frameworks, such as dynamic semantics or information-based semantics, model the meaning of conditionals not as sets of possible worlds (truth conditions) but as updates to an information state. In such systems, embedding is handled by tracking how information changes rather than how truth values combine. For instance, a negated conditional can be understood as a refusal to update the information state in the way the conditional prescribes. Modus Ponens remains valid because the update rule preserves information consistency, even if "validity" is redefined as preservation of acceptability rather than preservation of truth. While this requires more complex machinery than standard bivalent logic, it is not a fatal flaw. It is a theoretical cost, but one that is necessary if we are to respect the overwhelming intuitive plausibility of Stalnaker's Thesis.

  We must now reach a verdict. The choice is between three options: (1) Indicative conditionals lack truth conditions outright; (2) Stalnaker's Thesis is simply false; or (3) The Thesis survives in a restricted form.

  Option 3 (restriction) fails because it renders the thesis semantically accidental, as shown above. Option 2 (Thesis is false) is the standard truth-conditional response (e.g., the material conditional or possible worlds accounts). However, these accounts notoriously fail to capture the intuitive meaning of indicatives. The material conditional yields paradoxes (a false antecedent makes the conditional true), and possible worlds accounts (like Stalnaker's own) struggle to define the similarity metric without circularity or running afoul of triviality results anyway. Moreover, rejecting the Thesis contradicts the robust empirical finding that human reasoning aligns with conditional probability, not truth-functional logic.

  Therefore, the only defensible verdict is Option 1: **The triviality results show that indicative conditionals lack truth conditions outright.**

  Lewis's argument is sound. The assumptions of propositional content, standard probability, and Stalnaker's Thesis are inconsistent. Since Stalnaker's Thesis is the most intuitively secure of the three—capturing the very way we assess conditionals via the Ramsey Test—and standard probability is indispensable for rational belief, the assumption of propositional content must be the one to go. Your friend is correct that this is constructive work: the triviality result is the proof that conditionals are not propositions. You are correct that her other attempts to save propositional content (restriction and primitive probability) are evasive.

  The strongest objection to this verdict is the embedding problem: if conditionals aren't propositions, how do we explain the validity of arguments involving them? If "If A, then B" isn't true or false, in what sense is Modus Ponens valid?

  The defense against this objection lies in distinguishing *truth* from *correctness*. We can maintain that while conditionals do not have truth conditions, they have *assertibility conditions*. An argument is valid if accepting the premises compels acceptance of the conclusion, regardless of whether the sentences involved bear truth values. When we embed conditionals in negations or disjunctions, we are not operating on truth values but on the commitments associated with those speech acts. To say "It is not the case that if A, then B" is to express that one's epistemic state prohibits the suppositional link between A and B. This requires revising our logic from a static calculus of truth to a dynamic calculus of information. While this revision is significant, it is less costly than the alternative. The alternative requires us to accept that our most fundamental intuition about conditionals (The Ramsey Test/Stalnaker's Thesis) is systematically erroneous, or that rational belief update is impossible for conditionals. It is preferable to revise our semantics of content than to revise our understanding of rational inference.

  In conclusion, Lewis's triviality results are not a paradox to be dissolved by technical tweaks to probability theory or scope restrictions. They are a boundary marker for semantic theory. They demonstrate that the logic of indicative conditionals cannot be mapped onto the logic of propositions without collapse. Your friend's insight that this is a discovery rather than a disaster is correct, but her attempts to preserve truth conditions via restriction or primitive probability fail. The verdict stands: indicative conditionals do not express propositions. They express constraints on belief. To insist they have truth conditions is to insist on a semantic category that the mathematics of rational belief forbids.
