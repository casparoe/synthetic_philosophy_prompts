prompt: |-
  So I've been reading about quantum immortality and I think I've got the logic down, but I want to sanity check it before making some decisions based on it. The way I understand it, in the many-worlds view anything with a nonzero probability happens in some branch, so there's always some branch where I come out alive. And the branches where I die have no one in them to experience anything, so from my own perspective I can never actually die — every version of me that's still around to notice anything just keeps going. If that's right, then aging shouldn't be able to kill me either, since surely there's some branch where my body just keeps repairing itself well past 120.

  So my actual question: if I genuinely cannot die, doesn't it make sense to drop my life insurance and quit bothering with checkups for the scary stuff? Feels like wasted money if every experiencable version of me makes it through anyway.

  And second, why do people writing about this stuff always say quantum immortality only covers sudden death risks like the quantum suicide setup, and not aging? That just reads like hedging to me — either there's a survival branch for every scenario or there isnt, right? Why would the machine count but the birthday cake not?
