answer: |-
  You have stumbled onto the central tension in the philosophy of biology over the last 40 years. Your intuition is spot-on: there *are* cases where the disagreement is merely linguistic (bookkeeping), and cases where it is biological (conflict).

  Here is the breakdown of the names, the math behind the intuition, and the rule of thumb you asked for.

  ### 1. The Name: "Formal Equivalence" and the Price Equation

  The phenomenon you described—where the gene-centric story and the group-centric story turn out to be mathematically translatable descriptions of the same causal process—has a specific name in the literature: **The Formal Equivalence Thesis** (or sometimes **Kin-Group Selection Equivalence**).

  This equivalence is grounded in **The Price Equation**, developed by George Price in 1970. The Price Equation is a covariance equation that describes evolutionary change. Its magic trick is that it can be partitioned in multiple ways.

  *   **Partition A (Gene/Kin View):** You partition the variance based on genetic relatedness. You ask: "Does this trait correlate with the spread of this allele?"
  *   **Partition B (Group View):** You partition the variance based on group membership. You ask: "Does this trait correlate with the success of the group relative to other groups?"

  Mathematically, these partitions often sum to the exact same total change in gene frequency. When biologists argue over sterile workers (ants/bees), they are usually arguing over which partition is more *heuristically useful*, not which one is *physically true*.

  In philosophy of biology, specifically in the work of **Samir Okasha** (whose book *Evolution and the Levels of Selection* is the definitive text on this), this is often discussed under the header of **Perspectivalism**. Perspectivalists argue that the "unit of selection" is not a fact about the world, but a fact about how we choose to model the world.

  So, if you need a label for the "same story, two ledgers" phenomenon, call it **Formal Equivalence**.

  ### 2. Distinguishing Bookkeeping from Genuine Conflict

  You asked for a way to tell when the levels are just "partitioning dollars" versus when they are "fighting over the dollars." This is the difference between **Aligned Fitness** and **Fitness Conflict**.

  Here is the worked-out framework to distinguish them.

  #### A. The Price Equation Partition (The Math Check)
  The Price Equation splits selection into two terms:
  1.  **Within-Group Selection:** How individuals compete against neighbors in their own group.
  2.  **Between-Group Selection:** How groups compete against other groups.

  *   **Bookkeeping Case (Sterile Workers):** Both terms point in the *same* direction.
      *   *Within-group:* A sterile worker has zero direct fitness (bad for the individual).
      *   *Between-group:* Colonies with sterile workers produce more queens (good for the group).
      *   *Crucially:* Because the workers are clones or highly related, the genes for sterility *ride* the success of the group. The "loss" in the within-group term is perfectly offset by the "gain" in the between-group term *when weighted by relatedness*. The interests are aligned via kinship. There is no tension; the gene *wants* the colony to win.
  *   **Conflict Case (Meiotic Drive):** The terms point in *opposite* directions.
      *   *Within-organism:* The "cheater" chromosome replicates more than its partner (good for the gene).
      *   *Between-organism:* Organisms with cheater chromosomes produce fewer offspring or die (bad for the individual/group).
      *   Here, the math does not smooth out. The success of the lower level directly subtracts from the success of the higher level.

  #### B. The Suppressor Test (The Biological Check)
  This is the most practical rule of thumb. **Look for evolutionary suppressors.**

  *   **If Level X evolves mechanisms to suppress Level Y, they are distinct agents with conflicting interests.**
      *   *Example:* In meiotic drive, the rest of the genome (the organism level) often evolves "suppressor genes" to stop the cheater chromosome from working. The organism is literally fighting its own DNA. This proves the levels are in genuine conflict.
      *   *Example:* In multicellular organisms, the body evolves immune systems and apoptosis (cell suicide) to suppress "cheater cells" (cancer). This is a genuine conflict between cell-level selection and organism-level selection.
  *   **If no suppressors exist, it is likely bookkeeping.**
      *   *Example:* In eusocial insects, the queen does not evolve a mechanism to force workers to be sterile *against their genetic will*. The workers are sterile because their genetic interests (inclusive fitness) are best served by the queen reproducing. There is no "police force" needed because the interests are aligned.

  #### C. Evolutionary Transitions in Individuality (The Historical Check)
  Biologists **John Maynard Smith and Eors Szathmary** developed a framework called **Evolutionary Transitions in Individuality (ETI)**. This provides the historical context for your distinction.

  *   **Pre-Transition:** Independent replicators come together (e.g., single cells forming a colony). At this stage, levels are in **Conflict**. Selection acts on the cells *and* the colony, often oppositely.
  *   **Post-Transition:** The lower levels surrender their ability to replicate independently to the higher level (e.g., cells in a body cannot reproduce; only the germ line can). The higher level becomes a new "individual."
  *   **The Rule:** If the transition is complete (like a human body), arguing about Gene vs. Organism is usually **Bookkeeping**. The gene needs the organism to replicate, and the organism is built by the genes. Their interests are aligned.
      *   If the transition is incomplete or breaking down (like a slime mold colony, or a tumor forming in a body), arguing about levels is about **Genuine Conflict**.

  ### 3. Your Rule of Thumb

  To apply this to a new example without doing the math, ask these three questions in order:

  1.  **The Divergence Question:** Does the success of the lower unit *necessarily* reduce the success of the higher unit?
      *   *Yes:* Genuine Conflict (e.g., Cancer, Meiotic Drive).
      *   *No:* Proceed to question 2.
  2.  **The Suppressor Question:** Has the higher level evolved specific machinery to police or suppress the lower level?
      *   *Yes:* Genuine Conflict (proves interests were divergent enough to select for policing).
      *   *No:* Proceed to question 3.
  3.  **The Translation Question:** Can I explain the spread of the trait entirely by the lower level's benefit (inclusive fitness) *and* entirely by the higher level's benefit, with no remainder?
      *   *Yes:* Bookkeeping (Formal Equivalence). The "disagreement" is about which story is easier for humans to understand, not about how the world works.

  ### Summary
  *   **The Name:** **Formal Equivalence** (specifically Kin-Group Equivalence).
  *   **The Philosophy:** **Perspectivalism** (Okasha).
  *   **The Distinction:** **Fitness Alignment** (Bookkeeping) vs. **Fitness Conflict** (Genuine).
  *   **The Heuristic:** **The Suppressor Test**. If the organism fights the gene, it's a conflict. If they work in tandem, it's a ledger choice.

  You were right to suspect that some "colony effects" are hiding in the averages. That is essentially **Simpson's Paradox**, which is the statistical engine behind group selection. But if the paradox can be resolved by simply re-weighting the data by relatedness (Kin Selection), it's bookkeeping. If the paradox persists even after accounting for relatedness (because the gene is actively harming the carrier), it's conflict.

  Your intuition is better than most undergraduates in evolutionary biology. You've correctly identified that "Unit of Selection" is sometimes a question of **ontology** (what exists) and sometimes a question of **accounting** (how we measure).
