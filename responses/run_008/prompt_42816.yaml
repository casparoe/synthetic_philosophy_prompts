      *   *Crux B: The Innovation Rate.* Compare R&D output per dollar in state-directed vs. market-directed sectors (e.g., Space race vs. commercial aviation).
      *   *Crux C: Internal Transfer Pricing.* Do successful large firms use simulated market prices internally (M-form) or command (U-form)?
      *   *Selection:* Let's go with Internal Transfer Pricing (firm structure), Post-Socialist Recovery (historical), and Algorithmic Prediction (future/tech).

  6.  **Review and Refine (Self-Correction):**
      *   *Check:* Did I let the Austrian redefine "calculation" to mean "only possible with private property"?
