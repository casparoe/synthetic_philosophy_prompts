          *   View on Incentives: Managerial incentives can be aligned via rules (minimize cost, etc.). Bureaucracy is a management problem, not a systemic impossibility.
          *   View on Dynamics: Innovation can be handled through R&D budgets and risk simulation.
      *   **Hard-line Austrian (HA):**
          *   Core belief: Economic calculation requires private property in the means of production to generate *true* money prices.
          *   View on Information: Knowledge is dispersed, tacit, and subjective. Prices encapsulate this, but a CPB cannot access the underlying context (Hayek's "knowledge of time and place").
          *   View on Incentives: Without residual claimancy (ownership), managers lack the drive to discover new information or minimize costs effectively.
          *   View on Dynamics: The market is a discovery procedure. Planning stifles entrepreneurship. Static efficiency is irrelevant compared to dynamic coordination.

  3.  **Drafting Section 1: Agreed Claims (Common Ground):**
      *   *Constraint:* Must be signable by both. No hidden traps.
      *   *Idea 1:* Static efficiency conditions are mathematically identical. (LMS loves this, HA accepts it as a formal abstraction).
      *   *Idea 2:* The CPB *could* solve equations in a static world. (Mises conceded this in principle; Lange insisted on it).
      *   *Idea 3:* Real economies are dynamic. (Both agree static models are abstractions).
      *   *Idea 4:* The debate isn't about logical possibility in a vacuum, but practical feasibility in reality. (Mises: "It's impossible." Hayek: "It's impractical due to knowledge." Lange: "It's practical." All agree the *question* is about the real world).
      *   *Refinement:* Need to ensure the HA doesn't feel like conceding that calculation *is* possible in a static world without private property. Mises argued that without private property, there are no *prices*, so there is no *calculation*, even in statics. However, later interpretations (and Lange's reading) suggest Mises conceded the *math* works but the *institutional preconditions* don't. I need to phrase this carefully. Let's stick to the "formal conditions of equilibrium" being identical, rather than "calculation is possible."
      *   *Refinement 2:* Ensure LMS doesn't feel like conceding that dynamics make planning impossible. They agree dynamics make it *harder*, not necessarily impossible.
      *   *Drafting the points:*
          1.  Formal equilibrium conditions (Pareto) are system-agnostic.
          2.  In a hypothetical static state with fixed data, a central body could allocate resources to satisfy those conditions (the "equations of equilibrium" point).
          3.  Real economies involve change, uncertainty, and discovery, not just allocation of fixed data.
          4.  The debate centers on *how* systems handle this change and the information required to do so.
          5.  Incentives matter for both sides (LMS thinks rules work; HA thinks ownership is required).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Constraint:* Two columns. Neutral phrasing. Diagnosis (Substantive vs. Verbal).
      *   *Disagreement 1: The Nature of Prices/Data.*
          *   LMS: Prices are objective data points generated by exchange rules.
          *   HA: Prices are subjective indices of entrepreneurial judgment embedded in property rights.
          *   Diagnosis: Substantive (ontology of price).
      *   *Disagreement 2: Tacit vs. Articulable Knowledge.*
          *   LMS: Relevant knowledge can be codified (cost functions, production tech).
          *   HA: Crucial knowledge is tacit (know-how, local context) and only revealed through action.
          *   Diagnosis: Substantive (epistemology).
      *   *Disagreement 3: Incentives vs. Information.*
          *   LMS: Information is the bottleneck; incentives are solvable via bureaucracy/rules.
          *   HA: Incentives generate the information; without ownership, the information doesn't exist to be transmitted.
          *   Diagnosis: Substantive (causal link).
      *   *Disagreement 4: Dynamics/Innovation.*
          *   LMS: Innovation is a resource allocation problem (R&D budgeting).
          *   HA: Innovation is a disruption of existing allocation that planning resists.
          *   Diagnosis: Mixed (partly verbal on "innovation," mostly substantive on institutional response).

  5.  **Drafting Section 3: Cruxes (The "Testable" Claims):**
      *   *Constraint:* Concrete cases, specific predictions, no fudging.
      *   *Crux 1: Internal Firm Planning.*
