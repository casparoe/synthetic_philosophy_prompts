answer: |-
  **JOINT STATEMENT OF POSITION ON THE SOCIALIST CALCULATION DEBATE**

  **Parties:**
  *   **Proponent A (Market Socialist):** Advocates for the Lange-Lerner-Taylor model of public ownership with simulated price mechanisms.
  *   **Proponent B (Austrian):** Advocates for the Mises-Hayek critique regarding private property, dispersed knowledge, and entrepreneurial discovery.

  **Facilitator:** Philosopher of Economics (Adversarial Collaboration Draft)

  **Preamble:**
  This document is not a compromise. It is a map of overlap and divergence. Its purpose is to isolate exactly where the disagreement lies, distinguishing between empirical claims, theoretical priors, and terminological boundaries. Both parties acknowledge that the other's position is internally consistent; the dispute concerns which model maps onto reality.

  ***

  ### I. AGREED PROPOSITIONS
  *Both parties affirm the following statements. Denial of any item below voids this agreement.*

  1.  **Formal Equivalence in Statics:** In a hypothetical stationary economy with fixed preferences, resources, and technology, the formal mathematical conditions for Pareto-efficient allocation are identical regardless of ownership structure. A Central Planning Board (CPB), *if* it possessed complete data and unlimited computational capacity, could solve the system of equations required to achieve these conditions.
  2.  **The Irrelevance of Pure Statics:** Real-world economies are not stationary. They are characterized by continuous change in preferences, resources, and technology. Therefore, the decisive criterion for evaluating economic systems is not their ability to solve a fixed system of equations, but their ability to coordinate adjustments to change.
  3.  **Information is Costly:** Acquiring, transmitting, and processing economic information consumes resources. Neither side claims that information is free or that any mechanism (market or plan) operates without friction.
  4.  **Incentives are Necessary:** Efficient allocation requires that agents (managers, workers, planners) have incentives to act on information truthfully and to minimize costs. Neither side claims that "altruism" or "duty" is a sufficient substitute for institutional incentive structures.
  5.  **The Debate is Empirical, Not Purely Logical:** While the debate began with claims of logical impossibility (Mises), both parties agree that the final judgment rests on the practical feasibility of information processing and incentive alignment in complex, dynamic environments. The question is not "Can it be imagined?" but "Can it function at scale?"

  ***

  ### II. MAP OF DISAGREEMENTS
  *For each point of divergence, the wording below represents the strongest version of each side's claim, phrased such that the opposing side acknowledges this is what their opponent believes (even if they reject it).*

  | Topic | Proponent A (Market Socialist) Position | Proponent B (Austrian) Position | Diagnosis (Substantive vs. Verbal) |
  | :--- | :--- | :--- | :--- |
  | **1. The Nature of "Calculation"** | Calculation is the process of solving for equilibrium prices (shadow prices) that clear markets. This can be done iteratively by a CPB observing surpluses and shortages (trial-and-error). | Calculation is the process of entrepreneurial judgment regarding future profitability, enabled *only* by private property in means of production. Without ownership, there are no genuine prices, only accounting indices. | **Substantive (with verbal component).** <br>While the definition of "calculation" differs verbally, the substantive claim is whether *shadow prices* generated by a CPB function identically to *market prices* generated by exchange. A claims yes; B claims no. |
  | **2. The Knowledge Problem** | The knowledge required for allocation is largely objective and codifiable (technical coefficients, resource availability). It can be transmitted to a CPB without significant loss of fidelity. | The knowledge required is largely tacit, subjective, and contextual ("knowledge of time and place"). It is only revealed through the act of bidding/owning; it cannot be transmitted to a CPB because the agent does not possess it in articulable form. | **Substantive.** <br>This is an epistemological disagreement. A assumes knowledge is data; B assumes knowledge is a capacity for action. |
  | **3. Incentives vs. Information** | The primary barrier to planning is informational/computational. Incentive problems (bureaucratic slack) are solvable through managerial rules and oversight, similar to large capitalist corporations. | The primary barrier is informational, *but* information generation is endogenous to incentives. Without residual claimancy (ownership), agents have no incentive to *discover* or *utilize* local knowledge, so the information never comes into existence to be transmitted. | **Substantive.** <br>Disagreement on causal priority. A sees incentives as a separate variable from information. B sees incentives as the generator of information. |
  | **4. Dynamics and Innovation** | Innovation is a resource allocation problem. A CPB can allocate surplus to R&D and simulate risk. Market volatility is a waste of resources that planning can avoid. | Innovation is a disruptive process that violates existing plans. Market volatility is the signal mechanism that reallocates resources from failed to successful experiments. Planning inherently resists the disruption required for innovation. | **Mixed.** <br>Partly verbal (definition of "efficiency" in a dynamic context), mostly substantive regarding institutional response to disruption. |
  | **5. The Role of the Firm** | Large capitalist firms demonstrate that central planning works efficiently at scale (e.g., Walmart, Amazon). The economy can be viewed as one large firm. | Large firms exist only within a market framework that provides external price anchors for capital assets. Firms hit a "Coasean limit" where internal planning costs exceed market transaction costs; the whole economy cannot be one firm. | **Substantive.** <br>Disagreement on whether internal firm planning is analogous to economy-wide planning. |

  ***

  ### III. CRUXES AND PRE-REGISTERED PREDICTIONS
  *These are specific empirical claims where settling the fact would force at least one party to revise their theoretical stance. Vague appeals to "complexity" are prohibited.*

  #### Crux 1: The Limit of Internal Planning (The Coasean Test)
  **Context:** Large multinational corporations operate via internal command structures (transfer pricing, budgeting) rather than internal markets for many inputs.
  **The Question:** Does the efficiency of internal firm planning scale indefinitely, or does it degrade relative to external market contracting as complexity increases?

  *   **Proponent A Prediction:** As computational power and data analytics improve, the optimal size of the planned unit (the firm) will increase. We should observe a long-term trend of *increasing* average firm size and *increasing* share of GDP transacted within firm boundaries (intra-firm trade) in advanced economies.
  *   **Proponent B Prediction:** The optimal size of the planned unit is bounded by the knowledge problem. We should observe a long-term trend where firms that rely heavily on internal command (U-Form) underperform those that decentralize into profit centers (M-Form), and the boundary of the firm will stabilize or shrink relative to the market as complexity rises.
  *   **Falsification Condition:**
      *   **A is wrong if:** Data shows a sustained decline in intra-firm trade as a % of GDP alongside rising computational capacity.
      *   **B is wrong if:** The largest firms continue to absorb a growing % of economic activity while maintaining higher productivity growth than smaller competitors.

  #### Crux 2: Response to Exogenous Supply Shocks
  **Context:** Sudden, unanticipated changes in resource availability (e.g., oil shocks, natural disasters, trade embargoes).
  **The Question:** Which system reallocates resources to the new constraints faster with less welfare loss?

  *   **Proponent A Prediction:** A planning bureaucracy, having a global view of inventory and needs, can mandate reallocation faster than a market waiting for price signals to propagate. In a controlled comparison, planned sectors will show lower *volatility* in output following a shock than market sectors.
  *   **Proponent B Prediction:** Markets will adjust faster because price signals mobilize decentralized knowledge immediately. Planning will show *lags* (recognition lag, implementation lag) resulting in prolonged shortages or surpluses. Planned sectors will show higher *volatility* in output (boom/bust cycles of correction) following a shock.
  *   **Falsification Condition:**
      *   **A is wrong if:** In comparable sectors (e.g., energy or logistics), planned economies/sectors exhibit longer durations of shortage/surplus post-shock than market equivalents.
      *   **B is wrong if:** Market sectors exhibit longer recovery times and greater total output loss than planned sectors following identical exogenous shocks.

  #### Crux 3: The "Shadow Price" Accuracy Test (Modern Context)
  **Context:** Modern supply chain algorithms (e.g., Amazon, Walmart) use internal shadow prices to move goods without immediate external market transactions for every step.
  **The Question:** Do these internal algorithms rely on external market price feedback to correct errors, or do they operate independently?

  *   **Proponent A Prediction:** Advanced algorithms can approximate efficient allocation using physical data (units, time, location) with minimal reliance on external monetary price feedback. We should see internal algorithmic planning succeed even in contexts where external market prices are distorted or absent (e.g., internal logistics during price freezes).
  *   **Proponent B Prediction:** These algorithms are only effective because they are calibrated against external market prices (capital costs, fuel costs, labor rates). If external prices are removed or distorted, the internal algorithms will accumulate errors and fail.
  *   **Falsification Condition:**
      *   **A is wrong if:** Internal planning algorithms in large firms degrade significantly in performance when external input prices are artificially fixed or removed (e.g., during wartime controls or specific regulatory regimes).
      *   **B is wrong if:** Internal planning algorithms maintain efficiency in resource allocation despite significant distortions in external market prices for inputs.

  ***

  ### IV. NOTE ON INCOMMENSURABILITY
  *Both parties acknowledge one area where agreement is impossible without one side abandoning their core paradigm.*

  **The Definition of "Price":**
  *   **Proponent A** treats price as a **ratio of exchange** that can be simulated by accounting rules.
  *   **Proponent B** treats price as an **emergent phenomenon of property transfer** that cannot be simulated, only instantiated.

  **Resolution:** We agree to treat this as an empirical question (see Crux 3). If simulated prices (shadow prices) guide resources as efficiently as property-based prices, Proponent B's definition is operationally useless. If simulated prices systematically diverge from property-based prices in dynamic conditions, Proponent A's model is operationally deficient. We will not debate the definition further; we will let the predictions in Section III adjudicate the utility of the definition.

  ***

  **Signed:**

  _________________________ (Proponent A)

  _________________________ (Proponent B)

  _________________________ (Facilitator)

  **Date:** _________________________
