      *   *Crux 2: Shortage Economies vs. Market Transitions.*
          *   Context: Post-socialist transitions or specific sectors (e.g., Soviet electronics vs. US).
          *   LMS Prediction: Failures were due to political interference/poor implementation, not the model itself.
