      *   *Check:* Is the tone right? Needs to be academic but sharp.
      *   *Check:* Did I address the "Verbal vs. Substantive" diagnosis honestly?
      *   *Insight:* A lot of the debate *is* verbal regarding "calculation." Mises defines it one way, Lange another. I need to flag this clearly in the diagnosis column.

