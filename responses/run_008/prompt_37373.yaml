  2. It is also methodological, as disjunctivists prioritize explaining how perception puts us in touch with reality while intentionalists prioritize explaining why hallucination deceives us subjectively.
  3. The core deadlock rests on a bedrock intuition about whether introspective indistinguishability necessitates mental sameness, which neither side can argue for without begging the question against the other.
  4. This bedrock intuition about indistinguishability is doing the real work in keeping the standoff alive because it dictates whether the common-kind assumption is even permissible as a starting point.
  5. Progress requires stopping the search for a common ontology and instead accepting that the two sides are offering competing explanatory frameworks rather than rival descriptions of the same data.
