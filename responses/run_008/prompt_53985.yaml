answer: |-
  This is a precise application of game theory to a real-world governance problem. You are right to reject a generic sunk-cost lecture; the Dollar Auction (Shubik, 1971) is not just about sunk costs, it is about **incentive structures that make irrational escalation locally rational.**

  Here is the breakdown of how the auction's specific mechanics map to your arbitration, where the analogy holds, where it breaks, and what the logic dictates regarding exit rules.

  ### 1. Is "Protecting What We Spent" the Specific Trap?
  **Yes, but mechanically, not just psychologically.**

  In the Dollar Auction, the trap is triggered the moment the second-highest bid exceeds 50 cents. At that point, *both* top bidders are guaranteed a loss if the auction stops. The second-place bidder faces a choice: pay their bid and get nothing (realize the loss), or bid higher to become the winner (potentially recoup).

  **In your arbitration:**
  You are not in a pure Dollar Auction because in arbitration, the "second-place" bidder (you, if you lose) does not typically pay the "winner's" bid (the contractor's legal costs) unless the arbitrator awards costs against you. However, you are in a **War of Attrition with Dollar Auction dynamics.**

  The trap is active because your committee is treating the £9k not as a *sunk cost* (gone), but as an *entry fee* that purchases a probability of return.
  *   **The Auction Logic:** "I have bid £9k. If I stop now, that £9k buys nothing. If I bid £2k more, it might buy a £15k judgment."
  *   **The Structural Implication:** The auction structure implies that once you have bid, **quitting converts a *potential* loss into a *certain* loss.** The game is designed to make "certain loss" feel worse than "risk of larger loss."

  **Verdict:** The reasoning "we've spent too much to stop" is literally the reasoning the game is designed to trap. It shifts the decision criterion from *"Is the next step worth it?"* to *"How do I justify the previous step?"* The auction structure punishes the former (by offering a chance to win) and rewards the latter (by allowing you to delay the pain of realization).

  ### 2. Is There Any Point Where Continuing Is Rational?
  **Yes, but only under a strict marginal condition.**

  In the Dollar Auction, escalation is rational *only* if you have private information that the other player will fold before the bid exceeds the prize value ($1.00). If you know the other player has a limit of $0.90 and you bid $0.95, you win.

  **In your arbitration:**
  Continuing is rational **if and only if** the *Marginal Expected Value (MEV)* of the next stage is positive. The £9k must be mathematically excluded from this equation.

  $$ \text{Rational to Continue if: } (P_{win} \times \text{Recovery}) - \text{Cost}_{next\_stage} > 0 $$

  *   **$P_{win}$:** Probability of winning the specific next phase (e.g., the hearing).
  *   **Recovery:** The *additional* money you get from the contractor (not the roof value, but the damages).
  *   **Cost:** The legal fees for that specific phase.

  **The Auction's Implication:**
  If $(P_{win} \times \text{Recovery}) < \text{Cost}_{next\_stage}$, continuing is **irrational** in the auction framework, even if you are "close" to winning. In the Dollar Auction, bidding $1.50 to win $1.00 is never rational, even if you are the highest bidder. You are simply choosing the size of your loss.

  **Application:** Ask your committee to vote not on "Should we finish the arbitration?" but on "Is the *next £5k fee* justified by the *incremental* increase in recovery probability?" If the answer is no, the auction logic dictates you are now playing for pride, not value.

  ### 3. Does a Pre-Committed Exit Rule Follow from the Logic?
  **Yes, but only if it is credible.**

  In game theory, the only way to win a Dollar Auction is to make a **credible pre-commitment** not to escalate. If you can bind yourself to "I will not bid above $1.00," the other player (knowing this) will not bid $1.01, because they know they will win a worthless prize at a loss.

  **In your arbitration:**
  A hard cap (e.g., "We spend no more than £5k on arbitration") is the correct strategic move derived from the auction logic, **but** it fails if the contractor knows you are bluffing.
  *   **The Problem:** Your committee has already shown they are susceptible to the sunk-cost trap ("we've spent too much to stop"). The contractor knows this. If you set a cap of £5k, the contractor's rational move is to spend £5.1k to force you to either break your cap or fold.
  *   **The Solution:** For the cap to work, it must be **structurally binding**, not just a policy vote.
      *   *Example:* The co-op bank account requires two signatories to release funds. If one signatory (you) refuses to sign beyond the cap, the game ends.
      *   *Example:* You announce to the arbitrator and contractor that the co-op has exhausted its reserve fund for litigation. This changes the contractor's calculation: they realize you *cannot* bid higher, so they may settle to avoid their own escalation costs.

  **Verdict:** A pre-committed exit rule is not just a "nice idea"; it is the **only** mathematical solution to the escalation trap. However, without binding enforcement, it is noise.

  ### 4. Where the Analogy Breaks Down (And Which Differences Matter)

  You are right to question the fit. Here are the critical divergences:

  **A. The "Second-Place Penalty" (Crucial Difference)**
  *   **Auction:** The loser *pays* their bid to the auctioneer.
  *   **Arbitration:** The loser usually just *doesn't get reimbursed*.
  *   **Why it matters:** In the Dollar Auction, stopping guarantees a loss of the bid amount. In arbitration, stopping guarantees a loss of the *sunk* amount, but prevents *future* loss.
  *   **Implication:** The pressure to escalate is slightly lower in arbitration than in the pure auction. However, if your contract states "loser pays winner's legal fees," the analogy becomes exact. If it is "each bears own costs," you are in a **War of Attrition**. In a War of Attrition, the rational strategy is still to set a limit based on your valuation of the prize, but the "second-place penalty" pressure is less acute.

  **B. Multi-Player Internal Politics (Crucial Difference)**
  *   **Auction:** Two bidders.
  *   **Co-op:** 40 households, volunteer committee.
  *   **Why it matters:** In the auction, the bidder is a unitary rational actor. In your co-op, the "bidder" is a committee subject to voting. The "sunk cost fallacy" is often stronger in groups than individuals because no single member feels the full pain of the loss, but all want to avoid the shame of admitting a mistake.
  *   **Implication:** The "rational exit" is harder to execute because the "bidder" (the committee) can be replaced or outvoted. A new committee might come in and bid higher to "fix" the old committee's mess. This makes pre-commitment harder.

  **C. Information Asymmetry (Noise)**
  *   **Auction:** Bids are public.
  *   **Arbitration:** Strength of case is private.
  *   **Why it matters:** You might continue because you think $P_{win}$ is 80%, while the contractor thinks it's 20%. Escalation continues until information is revealed.
  *   **Implication:** Unlike the auction where escalation is purely financial, here escalation might be informational. However, after 2 years and mediation, information asymmetry should be low. If you still don't know your $P_{win}$, you are gambling, not bidding.

  ### Summary of Implications for Your Role

  1.  **Reframe the Vote:** Do not let the committee vote on "Do we continue?" Vote on "Does the *next specific invoice* yield more value than its cost?" Force the marginal calculation. If they cannot justify the marginal cost, the auction logic says stop.
  2.  **The Cap Must Be Hard:** A policy vote to cap spending is weak because a future committee can overturn it. As the bookkeeper, can you implement a control where expenditures above £X require a 75% household majority rather than a committee majority? This increases the "transaction cost" of escalating, mimicking a credible pre-commitment.
  3.  **Check the Cost-Shifting:** Verify the arbitration rules. If "loser pays," you are in a Dollar Auction (extreme pressure to escalate). If "each pays own," you are in a War of Attrition (pressure is lower, but the sunk cost trap remains).
  4.  **The "Win" Condition:** In the Dollar Auction, the only winning move is not to play. Since you are already in, the only winning move is to **minimize the loss.** If the Expected Value of finishing is negative, the "win" is cutting the loss now. A £9k loss is better than a £20k loss.

  **Final thought:** The auction teaches that once the bids exceed the value of the prize, the game is no longer about winning the prize; it is about **who bleeds out first.** If your legal costs are approaching the likely recovery amount, you are no longer disputing a roof; you are funding a contest of endurance. The logic dictates you should withdraw from the contest immediately unless you have a binding mechanism to force the contractor to fold first.
