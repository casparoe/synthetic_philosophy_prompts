prompt: |-
  Please describe the most important implications of Shubik's dollar auction — the game where a dollar is auctioned to the highest bidder, except the second-highest bidder also has to pay their bid and gets nothing, so once you've bid anything, dropping out means paying for nothing while staying in means maybe recouping — for how I should think about the escalating dispute our housing co-op (about 40 households, volunteer commitee, me doing the books) is in with the contractor who botched our roof repair. We're two years in, past mediation and now into arbitration, roughly £9k down on top of what the repair itself cost, and every time the committee votes, the people who want to keep going say we've spent to much to stop now. I don't want a generic sunk-cost lecture — I know what one of those sounds like. I want to know what the auction's specific structure implies: whether "keep going to protect what we've already spent" is literally the reasoning the game is designed to trap, whether there's any point in that framework where continuing is actually rational rather than just tempting, and whether some pre-committed exit rule (like a hard cap we set before the next hearing) genuinely follows from the auction's logic or is just a nice idea that sounds like it does. Also happy to hear where the analogy breaks down — real arbitration isn't exactly a two-bidder game with sealed escalating bids, and I get that, but I'd like to know which differences actually matter and which are just noise.
