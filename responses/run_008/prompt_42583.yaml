answer: |-
  Here are the desiderata for an adequate account of the epistemic status of the Church–Turing Thesis (CTT). They are structured to enforce the purpose you specified: settling the *kind* of claim CTT is, the *evidence* conditions, and the *falsifiability* conditions.

  ### The Desiderata

  **1. The Convergence Constraint**
  *   **Requirement:** The account must explain the extensional equivalence of independently motivated formalisms (Turing machines, $\lambda$-calculus, general recursion, Post systems) as something other than a stochastic coincidence.
  *   **Motivation:** If CTT is a pure definition, the fact that three distinct analyses of "effective calculability" converged on the same class is a miraculous accident. If it is a substantial claim, convergence is corroborating evidence. An adequate account must wear this story explicitly.
  *   **Status:** **Non-negotiable.** An account that dismisses convergence as luck fails to explain the robustness of the concept.

  **2. The Informal/Physical Distinction**
  *   **Requirement:** The account must rigorously distinguish the original thesis (about human effective calculability following rules) from physical variants (about what any physical system can compute). It must state whether they share an epistemic status or merely a name.
  *   **Motivation:** Hypercomputation debates often conflate "what a human can calculate" with "what the universe can compute." If CTT is about *effective methods* (finite, deterministic, human-followable), quantum mechanics or relativistic spacetimes are irrelevant. If it is about *physical computability*, they are central.
  *   **Status:** **Non-negotiable.** Conflation here renders the account useless for settling disputes about hypercomputation.

  **3. The Uncomputability Constraint**
  *   **Requirement:** The account must provide a principled explanation for well-specified but uncomputable functions (e.g., the Halting function). It must explain why the impossibility of computing them feels like a discovery of a limit rather than a bookkeeping choice.
  *   **Motivation:** If CTT is a definition, "uncomputable" just means "not in the defined class." But the undecidability of the Halting Problem carries modal force—it feels like a law of logic, not a linguistic boundary.
  *   **Status:** **Non-negotiable.** An account that reduces uncomputability to mere stipulation fails to capture the mathematical reality of undecidability.

  **4. The Practice Constraint**
  *   **Requirement:** The account must assign CTT a plausible role in mathematical and computer science practice, where it is routinely invoked to bridge informal algorithms and formal machines without proof.
  *   **Motivation:** Practitioners treat CTT as a license to translate "algorithm" to "Turing Machine" without justification. An account that makes this practice irrational (e.g., by calling it an unproven empirical hypothesis) or trivial (e.g., by calling it a tautology) is deficient.
  *   **Status:** **Non-negotiable.** Epistemology must track actual usage.

  **5. The Phenomenology Constraint**
  *   **Requirement:** The account must explain the peculiar phenomenology of the thesis: why it strikes nearly everyone as obvious *in retrospect*, once the definitions are grasped.
  *   **Motivation:** CTT does not feel like a contingent hypothesis (like "all swans are white") nor a pure axiom (like Choice). It feels like a conceptual clarification that was waiting to be found.
  *   **Status:** **Negotiable (Soft).** Phenomenology can be misleading, but a superior account should explain *why* the illusion of necessity arises, even if it denies the necessity.

  **6. The Refutability/Physics Tension**
  *   **Requirement:** The account must resolve the tension between demanding CTT be substantive enough to be refutable, while not making it vulnerable to physics we do not possess. It must specify *what* would overturn it.
  *   **Motivation:** If CTT is empirical, a hypercomputer overturns it. But if CTT is about *effective* methods (human, finite), a physical hypercomputer is irrelevant. The account must specify whether "computation" is anchored to human cognition or physical law.
  *   **Status:** **Non-negotiable.** This is the core of the "kind of claim" question.

  ***

  ### The Exclusionary Requirement

  You suspect it is the **Convergence Constraint**. I agree.

  This is the requirement that excludes the **Definitional Reading** (the most popular account among logicians, e.g., Davis, Sieg). The Definitional Reading holds that CTT is a proposal to *define* the informal notion of effective calculability via Turing computability.
  *   **Why it fails:** If CTT is a definition, the convergence of $\lambda$-definability, general recursion, and Turing machines is mathematically interesting but epistemically accidental. It implies Church, Turing, and Post just happened to propose definitions that matched, rather than tracking a pre-existing natural kind. The Definitional Reading cannot treat convergence as *evidence* for the correctness of the analysis, only as a theorem relating the definitions. To satisfy the Convergence Constraint, one must treat the informal notion as robust enough to be tracked independently, which pushes the account toward the Quasi-empirical or Substantial view.

  ***

  ### The Scorecard

  **1. The Definitional Reading**
  *   **Convergence:** Fails. Treats it as a mathematical coincidence of formalisms.
  *   **Informal/Physical:** Passes. Clearly separates effective calculability from physics.
  *   **Uncomputability:** Weak. Risks making undecidability look like a linguistic artifact.
  *   **Practice:** Passes. Explains why no proof is offered (it's a definition).
  *   **Phenomenology:** Passes. Explains obviousness as conceptual clarity.
  *   **Refutability:** Fails. Definitions cannot be refuted, only rejected as unuseful.

  **2. The Empirical Reading**
  *   **Convergence:** Passes. Treats convergence as strong inductive evidence.
  *   **Informal/Physical:** Fails. Often conflates the two, making CTT vulnerable to physical hypercomputation.
  *   **Uncomputability:** Passes. Treats limits as factual discoveries about the world.
  *   **Practice:** Fails. Makes standard mathematical usage (invoking CTT without evidence) epistemically reckless.
  *   **Phenomenology:** Fails. Cannot explain why a contingent hypothesis feels necessary.
  *   **Refutability:** Passes (too well). Makes CTT vulnerable to any future physics, violating the Intuition/Physics tension.

  **3. The Quasi-Empirical/Mathematical Reading**
  *   **Convergence:** Passes. Treats convergence as conceptual analysis reinforced by formal success.
  *   **Informal/Physical:** Passes. Distinguishes the conceptual analysis from physical implementation.
  *   **Uncomputability:** Passes. Treats limits as structural features of the concept.
  *   **Practice:** Passes. Views CTT as a methodological rule justified by success.
  *   **Phenomenology:** Passes. Explains obviousness as the result of successful conceptual stabilization.
  *   **Refutability:** Passes. Refutable in principle (by finding an effective method outside the class) but immune to mere physical novelty.

  **Verdict:** The Quasi-empirical reading satisfies the most non-negotiable desiderata, specifically by navigating the Convergence and Refutability constraints without collapsing into the Definitional Reading's silence on evidence or the Empirical Reading's vulnerability to physics.
