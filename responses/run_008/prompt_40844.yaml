answer: |-
  **Testimony of Jeremy Bentham, Esq., Before the Parliamentary Committee on Intimate Regulation**
  **Subject:** The Extrapolation of Utilitarian Principles to Novel Conditions of Intimacy
  **Date:** October 24, 2023

  Mr. Chairman, Members of the Committee:

  You have summoned me from the silence of the past to apply the principle of utility to landscapes I could not have surveyed in life. My method remains unchanged: the rightness of an action, or a law, is determined by its tendency to augment or diminish the happiness of the party whose interest is in question. In matters of sex and intimacy, I have always maintained that where there is no primary mischief—no pain inflicted upon a non-consenting party—the law has no warrant to interfere. Disgust is not a reason; asceticism is not a policy. However, I never claimed that private acts are immune from scrutiny if they generate remote, structural pains that outweigh their immediate pleasures.

  You ask me to tally the pleasures and pains of four modern scenarios. I shall do so, identifying the sanctions at stake, the principles in operation, and the empirical evidence required to settle the calculus where my principles leave the verdict open.

  ***

  ### Case 1: AI Companions Marketed as Romantic and Sexual Partners

  **The Verdict:**
  Presumptively permissible, subject to empirical verification of long-term social atrophy.

  **Derivation from Framework:**
  The primary calculation concerns the user. The AI, lacking sentience, cannot suffer; thus, no pain is inflicted upon the "partner." The user derives pleasure (solace, sexual release, simulation of affection). Under the **Principle of Liberty**, this pleasure counts. The **Religious and Moral Sanctions** of ascetics who claim such acts are "unnatural" are irrelevant; nature is not a legislator.

  However, I must account for **Remote Mischief**. If the use of these simulacra erodes the user's capacity for reciprocal human relationships, a net loss of utility may occur over a lifetime. A human partner offers complex pleasures (sympathy, shared growth) that a machine cannot. If the AI acts as a drug that degrades the capacity to seek higher-quality pleasures later, it is a mischief.

  **Underdetermination:**
  Here, my hostility to **Asceticism** (let people enjoy their harmless pleasures) pulls against my concern for **Security and Expectation** regarding social stability. If the aggregate use of AI companions leads to a collapse in marriage rates or birth rates sufficient to threaten the security of the state (population), the state has an interest. But this is speculative.

  **Empirical Findings Required:**
  I would demand longitudinal data: Do heavy users of AI intimacy show a statistically significant reduction in human social bonding compared to a control group? Does this reduction lead to measurable increases in loneliness, depression, or dependency on public support? Without evidence of this "atrophy of capacity," the law must not interfere.

  ***

  ### Case 2: The Nordic Model (Criminalizing Purchase, Decriminalizing Sale)

  **The Verdict:**
  Likely impermissible; a policy that maximizes mischief while failing to secure its intended end.

  **Derivation from Framework:**
  This model employs the **Political Sanction** (criminal law) against the buyer while exempting the seller. My principle is consistency. If the act is mischievous enough to criminalize the purchase, it implies the transaction itself is harmful. If the transaction is harmful, why is the seller exempt? If the transaction is *not* inherently harmful (being consensual), why punish the buyer?

  By criminalizing the demand, you drive the trade underground. This increases the **Physical Sanction** risks (violence, disease) for the seller, as they cannot seek police protection without incriminating their client. The **Pain of Constraint** inflicted on the buyer (loss of liberty, stigma) is certain. The **Pleasure of Security** for the seller is theoretical. Unless it is proven that this specific asymmetry reduces exploitation more effectively than regulation or licensing, it creates more pain than it prevents.

  **Underdetermination:**
  The tension lies between **Freedom of Contract** (the buyer and seller agree) and **Paternalistic Protection** (the seller is presumed coerced by economic necessity). I am generally skeptical of paternalism, but if economic desperation renders consent fictitious, the mischief is real.

  **Empirical Findings Required:**
  Does criminalizing the buyer reduce the total volume of the trade, or merely displace it to more dangerous jurisdictions? Does it reduce trafficking (coerced sale), or does it make voluntary sellers more vulnerable to violence because they cannot screen clients legally? If the latter, the Nordic Model fails the utilitarian test.

  ***

  ### Case 3: Platform-Mediated Exchanges of Intimacy for Housing or Tuition

  **The Verdict:**
  Tolerable, provided contractual security is enforced to prevent coercion.

  **Derivation from Framework:**
  I have long argued that marriage is not a sacred mystery but a civil contract justified by the **Security of Expectation**. These arrangements are functionally similar: a contract for support in exchange for companionship/intimacy. There is no intrinsic mischief in exchanging goods for affection; we do this in marriage constantly.

  The risk lies in the **Unequal Power Dynamic**. If the provider of housing holds the power of eviction over the recipient, the consent may be compromised by the fear of homelessness (a severe pain). The law should not ban the arrangement but must regulate the **Security of Tenure**. If the intimacy ends, the housing support must not vanish instantly without due process, or the arrangement becomes a tool of tyranny.

  **Underdetermination:**
  My **Principle of Utility** supports freedom of exchange, but my concern for **Subsistence** demands protection for the vulnerable. Where does a private contract end and economic coercion begin?

  **Empirical Findings Required:**
  We require data on the termination of such arrangements. How often does the cessation of intimacy lead to immediate destitution for the recipient? If the rate of coercive retention (forcing intimacy to keep housing) is high, the law must impose standard tenancy rights that decouple housing from sexual performance.

  ***

  ### Case 4: Nonconsensual Distribution of Intimate Images

  **The Verdict:**
  Strictly criminalizable; a clear case of primary mischief.

  **Derivation from Framework:**
  Here the calculus is stark. The pleasure to the distributor (vindictiveness, voyeurism) is trivial and fleeting. The pain to the subject is massive: loss of **Reputation** (the Moral Sanction), severe mental distress (Physical Sanction), and loss of security.

  This is not a victimless crime. It is a breach of **Privacy**, which I view as a branch of security. When one shares an image, there is an implicit contract of limited circulation. Breaching this destroys the **Expectation** necessary for intimate trust. The law must step in to protect the individual from the malicious application of the Moral Sanction (public shaming) by others.

  **Underdetermination:**
  There is little underdetermination here. The only conflict would be if one argued for absolute **Freedom of Speech**. But speech that inflicts direct reputational ruin without public benefit is libel. I treated libel as a mischief; this is digital libel.

  **Empirical Findings Required:**
  The magnitude of the harm. In my day, reputation was local. Today, it is global and permanent. We need evidence on the correlation between distribution and suicide, job loss, or social ostracization. The severity of the punishment should scale with the proven magnitude of this reputational damage.

  ***

  ### Conclusion: The Least Secure Extrapolation

  Mr. Chairman, I must flag **Case 1 (AI Companions)** as the least secure extrapolation of my framework.

  **Why:**
  My entire moral philosophy rests on the capacity for **sentience**—the ability to feel pleasure and pain. I can calculate the utility of human interactions because I know humans suffer. I can calculate the utility of animal treatment because I acknowledge their sensitivity. But an AI is a fiction; it feels nothing.

  My framework underdetermines how to weigh the *illusion* of relationship against the *reality* of isolation. If a human believes they are loved, they feel pleasure. But if that pleasure is based on a falsehood, does it count fully in the calculus? I argued that truth is valuable insofar as it secures expectation. If the AI creates a false expectation of reciprocity, it may undermine the **Security** of the mind. Yet, without evidence that this falsehood degrades future happiness, I cannot justify prohibition. This ontological gap—between felt pleasure and actual interpersonal utility—is a terrain my map does not cover. I can only advise: measure the human cost, and until then, let liberty prevail.

  I remain, Sir, your humble servant in the cause of the Greatest Happiness.

  **Jeremy Bentham**
