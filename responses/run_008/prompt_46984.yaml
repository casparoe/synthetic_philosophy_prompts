      2.  **The FID Test:** Specific analysis of Smith's "approximation" claim.
      3.  **The Residue Report:** Clean, Distorted, Missing.
      4.  **The Two Breaking Points:** Propriety and Morality.
      5.  **The Verdict:** Craft vs. Philosophy.
      6.  **Confidence & Uncertainty:** Explicit rating.

  8.  *(Self-Correction on Confidence)*: I need to make sure I don't sound *too* confident. The prompt asks me to test the feeling, not validate it. I should express uncertainty where the analogy gets thin. The "Least Sure" point should be the one regarding the *moral weight* of the Implied Author.

  9.  **Final Polish:** Check against the prompt's specific request for "Residue Report" and "Confidence Levels." Ensure the voice is appropriate for a fellow writer. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, I need to be careful about the "Ideal Reader" vs "Implied Author." The prompt conflates them slightly ("sounds suspiciously like the implied author, or like the ideal reader"). In craft theory, they are distinct. Implied Author = the version of the author constructed by the text. Ideal Reader = the hypothetical audience the text anticipates. Smith's Spectator is internal to the *agent* (the author/actor). So it maps closer to the Implied Author (the author's internal standard) than the Ideal Reader (the external target). I will make this distinction clear.

