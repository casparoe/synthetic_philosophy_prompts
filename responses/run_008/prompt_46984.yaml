      *   **Mapping Sympathy (The Act of Narration):** Smith says sympathy is imaginative projection, not contagion. In craft, this is *psychic distance* management. The author doesn't *become* the character; they construct a simulation of the character's consciousness.
          *   *FID Connection:* FID is the technical mechanism of this Smithian sympathy. It blends the narrator's voice with the character's perception. It proves Smith right: it's always filtered. It's the narrator's *version* of the character's feeling.
      *   **Mapping the Spectator (The Implied Author):** The Impartial Spectator moderates passion to be "sympathizable." The Implied Author moderates the narrative voice to be "readable" or "coherent."
