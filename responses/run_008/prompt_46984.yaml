      *   *Nuance on FID:* FID is tricky. It blurs the line. Smith says "I feel *my* version of your feeling." FID says "This is the character's thought, but in the narrator's grammar." This aligns perfectly. It's an approximation.
      *   *Nuance on Propriety:* This is the crux. Smith wants moderation. Art often wants excess. I need to highlight this tension. The "Implied Author" might demand consistency, but not necessarily *moderation*.
      *   *Nuance on Moral vs Aesthetic:* The "Implied Author" (Booth) actually *does* have a moral dimension in Booth's original formulation (*The Rhetoric of Fiction*). Booth argued the implied author embodies the moral norms of the work. So the mapping is stronger there than modernist "art for art's sake" might suggest. I should acknowledge Booth's specific definition vs. the general craft usage.

  7.  **Finalizing the Structure:**
