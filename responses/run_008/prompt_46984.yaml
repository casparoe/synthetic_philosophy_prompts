      *   **Residue Report (The Breaks):**
          *   *Clean Survival:* The imaginative nature of empathy (Sympathy $\approx$ POV). The internal judge (Spectator $\approx$ Implied Author).
          *   *Distortion:* Smith's spectator is *moral*; the Implied Author is *aesthetic/narrative*. A novel can be aesthetically coherent but morally repugnant (e.g., *Lolita*). Smith's spectator wouldn't approve of Humbert Humbert's passions unless moderated, but the Implied Author allows the *representation* of those passions.
