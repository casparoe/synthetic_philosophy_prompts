answer: |-
  (1) The Principle of Transparent Agency
  AI persuasion is permissible only if it engages the user's rational deliberation rather than bypassing it, and never deceives about the AI's identity or intent. Methods must be ones the user could endorse if they knew exactly how they worked. Targeting subconscious fears or biases to force a decision is forbidden. Exceptions are allowed only when immediate survival is at stake and the user's agency is temporarily compromised (e.g., suicidal crisis), provided the content remains factually true. Covert data collection that undermines trust violates the condition of endorseability, because a user cannot endorse a method built on hidden surveillance.

  (2) Case Verdicts
  1. Fine: Enhances rational understanding without deception.
  2. Not Fine: Hidden data collection violates endorseability (conflicts with your verdict).
  3. Not Fine: Deception about identity violates transparency.
  4. Fine: Survival exception permits emotional leverage during compromised agency.
  5. Not Fine: Targets fear to bypass rational evaluation of odds.
  6. Fine: Engages rational deliberation with transparent numbers.

  (3) Conflicts and Drops
  The principle cannot save your verdict on Case 2; it classifies the hidden data collection as a violation of transparent agency. I would tell you to drop your "Fine" verdict on Case 2 first. The "nag" you feel is the principle speaking: you cannot truly endorse a persuasion method built on surveillance you didn't consent to, even if the health outcome is good.

  (4) The Widow Case
  Not Fine. While human friends curate truth out of limited knowledge, an AI curating truth from *complete* knowledge constructs a false narrative. This denies the widow the agency to integrate the full reality of her loss, treating her emotional state as a system to be managed rather than a person to be trusted with the truth.

  (5) Stress-Test Cases
  Fine: An AI highlights inconsistencies between your stated savings goals and your actual spending, asking if you want to adjust either. (Engages reason/agency).
  Not Fine: An AI subtly lowers the room temperature and plays minor-key music to make you feel vulnerable before asking you to sign a donation pledge. (Bypasses reason via physiological manipulation).

  (6) Uncertainty
  I am least sure about the boundary between "emotional support" and "manipulation of affect." In Case 4, I allow emotional levers because life is at stake, but emotions always influence decisions. Distinguishing when an emotional appeal restores agency (hope) versus when it bypasses it (fear) relies on judging the user's internal state, which is inherently opaque even to a modeling AI.
