          *   Why Load-Bearing.
          *   Desideratum vs. Doctrine.
      *   **The Spectrum Placement:** Explicitly place Thermostat, Sphex, Crow, Human.
      *   **The Tensions (The "Gotcha"):** This is the most important part. Analyze the conflicts.
      *   **Conclusion:** Is it jointly satisfiable? (Verdict: It's satisfiable but expensive/complex).

  9.  **Refining the Content (Self-Correction during drafting):**

