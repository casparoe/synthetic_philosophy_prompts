  *   **START:** Suppose we discover a being for which diverting essentially all of society's resources toward it produces more total welfare than any alternative distribution.
      *   **Node 1 (The Intensity Monster & The Premise):** Consider the **Intensity Monster** variant (this being gains enormous welfare per unit of resource, where humans gain little). Do you accept that diverting resources to this being *actually* yields more welfare than giving them to humans?
