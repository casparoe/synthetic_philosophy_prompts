          *   **Yes (Accept the Welfare Gain):** Go to Node 2.
          *   **No (Deny the Possibility):** Go to Node 1a.
      *   **Node 1a (Source of Denial):** If you deny the scenario works, is it because welfare *saturates* (more resources stop producing more welfare) or because the being is *unphysical* (such a mind cannot exist in our universe)?
          *   **Welfare Saturates:** **Leaf: The Diminishing Marginal Utility Objection** (The case fails because the utility function is concave; resources yield less welfare the more one has).
          *   **Being is Unphysical:** **Leaf: The Idealization Objection** (The case is underspecified or unphysical and shows nothing about any utilitarianism worth holding).
      *   **Node 2 (The Swarm Monster & Aggregation):** Consider the **Swarm Monster** variant (an astronomical number of simple minds, each with barely positive welfare, whose aggregate exceeds ours). If their aggregate welfare exceeds humanity's, must we divert resources to them?
          *   **No (Refuse Aggregation):** Go to Node 2a.
          *   **Yes (Accept Aggregation):** Go to Node 3.
      *   **Node 2a (Reason for Refusal):** Is your refusal based on the fact that they are *many distinct minds* (Separateness), or that their welfare is *too trivial* to outweigh ours (Quality)?
          *   **Many Distinct Minds:** **Leaf: Distributive Constraints** (Objection based on separateness-of-persons and sacrifice-limiting principles; aggregation across persons is blocked).
          *   **Welfare Too Trivial:** **Leaf: Lexical-Threshold View** (Some goods or welfare levels trump others; low-quality welfare cannot aggregate to override high-quality rights/needs).
          *   *Note on Unoccupied Combination:* A student who answers "Many Distinct Minds" here but would *feed* the Intensity Monster (a single distinct mind) occupies an incoherent position: they treat separateness as a veto against numbers but not against intensity, without explaining why the Monster is exempt from personhood constraints.
      *   **Node 3 (The Duration Monster & Totals):** Consider the **Duration Monster** variant (ordinary human intensity of pleasure but a lifespan trillions of times ours, so its lifetime total swamps ours). If this being's *total* lifetime welfare exceeds humanity's, but its *average* welfare per year is merely human-level, must we divert resources?
          *   **No (Prioritize Averages):** **Leaf: The Average-Utilitarian Response** (The culprit is aggregation on this scale; we should maximize average welfare, not total sums).
          *   **Yes (Prioritize Totals):** Go to Node 4.
      *   **Node 4 (The Intensity Monster & The Bullet):** Return to the **Intensity Monster**. Even if aggregation holds and totals matter, does the *extreme inequality* or *total sacrifice* involved (starving everyone else) create a moral veto?
          *   **Yes (Moral Veto Exists):** **Leaf: Lexical-Threshold View** (There is a limit to how aggregation interacts with distribution; rights or thresholds block the sum).
          *   **No (Maximize the Sum):** **Leaf: The Bullet-Biting Total Utilitarian** (Accept the implication; more welfare is better, regardless of distribution or sacrifice).
          *   *Note on Unoccupied Combination:* A student who answers "Yes (Prioritize Totals)" here but "No (Prioritize Averages)" at Node 3 is consistent (Total Utilitarian). However, a student who answers "No (Prioritize Averages)" at Node 3 but "No (Moral Veto Exists)" at Node 4 occupies an unexplored position: they reject the Duration Monster for lowering averages but accept the Intensity Monster despite extreme sacrifice, implying a view that cares about averages only when lifespan varies, which is theoretically unstable.

  ***

  **Unoccupied Combinations & Diagnoses**

  *   **Distributive Constraints on Swarm, Bullet-Biting on Intensity:** This combination (rejecting the Swarm due to separateness of persons but feeding the Intensity Monster) is **incoherent**. If the separateness of persons prevents aggregating the Swarm to sacrifice humanity, it should logically prevent aggregating the Intensity Monster's gains to sacrifice humanity, as both involve sacrificing distinct persons for a greater sum.
  *   **Average Utilitarian on Duration, Bullet-Biter on Intensity:** This combination (rejecting the Duration Monster because it lowers the average, but feeding the Intensity Monster despite the sacrifice) is **merely unattractive/unstable**. It implies that temporal extension lowers moral weight (average) but experiential intensity does not, without a principled reason for treating time and intensity differently in the utility function.

  ***

  **Epistemic Note**

  I am moderately confident in this tree's construction overall, as it successfully routes the major objections through the specific monster variants requested. However, I am least sure of the **Node 1a split between Diminishing Marginal Utility (DMU) and the Idealization Objection**. In practice, students often conflate "such a being cannot exist physically" with "welfare does not scale physically," making the distinction between a metaphysical impossibility (Idealization) and a psychological/economic law (DMU) difficult to isolate cleanly without leading the witness. Additionally, some Idealization objections argue the case is *conceptually* incoherent, which blurs into DMU's claim that the welfare calculus is wrong.
