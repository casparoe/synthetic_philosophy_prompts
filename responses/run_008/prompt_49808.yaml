answer: |-
  1. Nearest concepts

  Four established concepts approach this pattern from different angles. **Precommitment** involves strategically restricting future options to alter present incentives, akin to Ulysses tying himself to the mast to resist sirens. **Signaling** entails incurring a visible cost to reveal private information about one's type to counterparties, separating oneself from bluffers. **Constrained Maximization** (David Gauthier) describes adopting a disposition to cooperate even when direct maximization suggests defection, arguing dispositionality is itself maximizing. **Strategic Irrationality** (Jon Elster) refers to cultivating preferences for locally suboptimal acts to achieve globally rational outcomes requiring credibility. Each captures a facet, but none perfectly encapsulates the disposition without physical binding.

  2. Comparison

  **Precommitment** shares the foresight of altering future behavior to benefit the present negotiation. However, it diverges on mechanism: classical precommitment involves removing options or changing payoffs externally, like burning a bridge to make retreat impossible. Your cases involve retaining the option to defect but possessing a psychological disposition not to use it. The tradeswoman *can* drop the suit; she chooses not to. This distinction matters because precommitment relies on impossibility, whereas your pattern relies on unwavering will. The option remains open, which means the agent must overcome a local incentive rather than being physically prevented from acting on it.

  **Signaling** matches the requirement that the trait be visible to others to secure favorable terms without prior history. It diverges because signaling is often a one-off cost to prove a static type, whereas your examples describe an ongoing operational mode. The negotiator does not merely signal once; his willingness to walk away is a continuous standing policy, not just an entry ticket. Signaling explains the visibility, but not the sustained irrationality. Furthermore, signaling usually implies a cost paid to reveal truth, whereas here the "cost" is the potential future loss incurred by maintaining the disposition itself.

  **Constrained Maximization** aligns closely with the core logic that rationality resides in the disposition, not the act. It diverges primarily in domain: Gauthier focuses on moral cooperation within Prisoner's Dilemmas, while your first example is punitive deterrence. Yet, the structural identity is exact: the agent maximizes utility by not maximizing in the moment. This concept captures the internal logic but misses the external communicative necessity. It explains why the agent acts, but not necessarily how the agent convinces others they will act without a prior track record of such behavior.

  **Strategic Irrationality** captures the paradox of beneficial irrationality best. It diverges only in emphasis: Elster often focuses on emotional precommitments (vengeance) as mechanisms, whereas your description treats the disposition as a stable character trait known in advance. This bridges the gap between internal psychology and external reputation, yet it often implies a temporary state rather than the permanent character trait you describe. It acknowledges the benefit of being irrational, but sometimes treats the irrationality as a tool rather than a constitutive part of the agent's identity.

  3. Verdict

  The best fit is **Strategic Irrationality**, though it requires slight refinement to fit your specific constraints. Defined precisely: The rational adoption of a disposition to perform acts that are locally suboptimal, because the visibility of that disposition secures globally optimal arrangements unavailable to a straightforward maximizer. This concept carves the phenomenon by distinguishing the *act* (irrational) from the *strategy* (rational). It acknowledges that being the sort of person who ignores cost-benefit analysis in specific instances is itself a high-value cost-benefit strategy. The rationality lies in the selection of the disposition, not the execution of the act.

  *Boundary Case 1 (Outside):* A bluff. A negotiator threatens to walk away but intends to return if called. This resembles the behavior but lacks the actual disposition, making it unstable upon scrutiny and failing the "stable disposition" criterion. It is locally rational (saving face) but globally fragile.
  *Boundary Case 2 (Marginal):* Pathological spite. A person destroys value to punish another without any prior strategic benefit or future deterrence value. This shares the local irrationality but lacks the global rationality that justifies the disposition, falling into mere self-harm rather than strategic investment.

  4. What remains unsettled

  Your description leaves open the origin of the disposition. Is it consciously cultivated, or an evolved heuristic? If conscious, how does one convince others of a disposition they could theoretically override? If evolved, does it count as rational choice or biological constraint? Finally, does the visibility require explicit communication, or can it be inferred from demographic or cultural markers? Sharpening these distinctions will clarify whether this is a decision strategy or a psychological state, and whether the irrationality is real or merely apparent to observers who misunderstand the agent's utility function.
