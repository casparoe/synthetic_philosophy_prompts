answer: |-
  Here is the decision procedure, designed for your teaching team to use without requiring prior engagement with Nietzsche's text, followed by the application to your three contested units and an analysis of the procedure's limitations.

  ***

  # The Pedagogical Triage Protocol (PTP)
  **Time Required:** 20–30 Minutes
  **Participants:** Course Director + Teaching Team
  **Prerequisites:** None. (Terms are defined operationally below).

  ### Part I: The Definition of "Life" (Hand-off Point 1)
  *Before beginning, the team must agree on what "serving the students' future" means for this specific semester. This is not a factual question. The procedure cannot answer this.*

  **Question 0:** What is the primary deficit we are treating in this cohort?
  *   **Option A (Agency):** They feel powerless and need to believe action matters.
  *   **Option B (Belonging):** They feel rootless and need to feel part of a continuum.
  *   **Option C (Liberation):** They feel burdened by dogma and need permission to break from it.

  *   **Procedure Rule:** If the team cannot agree on one primary deficit, **STOP**. The Director must decide unilaterally. If the team agrees, note the choice. This choice determines the "Base Mode" for all subsequent units.
      *   Option A $\rightarrow$ Base Mode: **Inspiration** (Monumental)
      *   Option B $\rightarrow$ Base Mode: **Heritage** (Antiquarian)
      *   Option C $\rightarrow$ Base Mode: **Liberation** (Critical)

  ### Part II: Unit Assessment
  *Run these questions for the specific unit in question.*

  **Question 1: The Truth Constraint**
  Can the historical record support the Base Mode without significant distortion?
  *   *Yes:* Proceed to Q2.
  *   *No:* You must shift away from the Base Mode. (e.g., If Base is Inspiration, but the figure was a failure, you cannot teach Inspiration).
  *   *Sufficient Answer:* A simple "Yes/No" based on consensus of established scholarship, not hope.

  **Question 2: The Harm Test**
  Does applying the Base Mode to this specific topic risk active harm?
  *   *Risk A (Myth-making):* Does glorifying this figure hide suffering they caused?
  *   *Risk B (Mummification):* Does revering this tradition validate exclusion or stagnation?
  *   *Risk C (Nihilism):* Does critiquing this topic leave students with nothing to build on?
  *   *Sufficient Answer:* Identify the specific risk. If "Yes" to any, the Base Mode must be reduced by 25%.

  **Question 3: The Student Condition**
  Given the specific topic, do the students have a *local* need that overrides the Semester Base Mode (Part I)?
  *   *Example:* Even if the semester is about "Liberation," do *this* topic (e.g., Constitution) require "Heritage" to be understood?
  *   *Sufficient Answer:* A specific pedagogical justification (e.g., "They can't critique the law if they don't respect its origin").

  ### Part III: Calculation and Recommendation
  *Combine the answers to generate the mode mixture.*

  1.  **Start** with the Semester Base Mode (from Part I).
  2.  **Adjust** based on Q1 (Truth). If "No," switch to the mode that best fits the truth (Inspiration $\leftrightarrow$ Heritage $\leftrightarrow$ Liberation).
  3.  **Adjust** based on Q2 (Harm). If a risk was identified, reduce the Base Mode by 25% and distribute that weight to the mode that mitigates the risk.
      *   To mitigate Myth-making $\rightarrow$ Add Liberation.
      *   To mitigate Mummification $\rightarrow$ Add Liberation.
      *   To mitigate Nihilism $\rightarrow$ Add Inspiration or Heritage.
  4.  **Adjust** based on Q3 (Local Need). If a local need was identified, shift 25% weight toward that need's mode.

  **Final Output:** A percentage split (e.g., 50% Inspiration, 25% Heritage, 25% Liberation).

  ### Part IV: The Value Hand-off (Hand-off Point 2)
  *The procedure produces a ratio. It cannot validate the ethics of that ratio.*

  **Director's Check:** Does this ratio align with the ethical commitments of the department?
  *   **Yes:** Adopt the recommendation.
  *   **No:** Override the recommendation. **You must state why in writing.** (e.g., "The procedure suggests glorification, but departmental ethics forbid glorifying colonizers.")

  ***

  # Warning: Where This Procedure Misfires
  *Read this before using the tool. These are not bugs; they are features of operationalizing philosophy.*

  1.  **The "Life" Smuggle:** Part I asks you to define "Life" (Agency, Belonging, Liberation). This is a political/ethical choice, not a pedagogical one. A conservative team will define "Life" as Belonging; a progressive team as Liberation. The procedure will objectively validate subjective politics. **Misfire Risk:** TAs may answer Part I based on their own ideological comfort, claiming it is what "students need."
  2.  **The Truth Illusion:** Q1 assumes "historical record" is stable. In contested units, the team will disagree on what counts as distortion. **Misfire Risk:** The team may claim a mode is "unsupported by truth" simply because they dislike the mode.
  3.  **The Dose Blindness:** Nietzsche's greatest fear was an *excess* of history (paralysis by information). This procedure selects the *angle* (Mode), but not the *volume*. You can teach a "Critical" unit that is still so overloaded with facts that it paralyzes life. **This procedure cannot detect that.**
  4.  **The Bureaucratic Alibi:** The flowchart provides moral cover. If a TA wants to condemn a figure for political reasons, they can manipulate Q2 (Harm Test) to generate a "Critical" recommendation, then blame the procedure. **Director's Duty:** You must audit the "Sufficient Answers" in Part II for bad faith.

  ***

  # Application to Contested Units

  *Assumption for these runs:* The team has settled Part I (Semester Base Mode) as **Liberation (Critical)**. This is standard for a philosophy department ("question everything").

  ### Case 1: The University Founding
  *Context:* Student pride vs. Benefactor's unethical wealth.
  *   **Q1 (Truth):** Can we teach "Heritage" (Pride) without distortion?
      *   *Team Answer:* No. The archival work proves the wealth was predatory. Pure Heritage is a lie.
      *   *Adjustment:* Shift away from Heritage.
  *   **Q2 (Harm):** Does "Liberation" (Condemning the benefactor) risk harm?
      *   *Team Answer:* Yes. Risk C (Nihilism/Rootlessness). If we destroy the founder, students lose their institutional home.
      *   *Adjustment:* Reduce Liberation by 25%. Add Heritage (to preserve the institution's continuity despite the founder).
  *   **Q3 (Local Need):** Do students need to feel ownership to engage?
      *   *Team Answer:* Yes. First-years need to feel they belong here to stay.
      *   *Adjustment:* Add 25% Heritage.
  *   **Procedure Recommendation:** 50% Liberation (Acknowledge the crime), 50% Heritage (Claim the institution as ours, not the benefactor's).
  *   **Director's Note:** This is a stable compromise. It allows critique without abandonment.

  ### Case 2: Napoleon
  *Context:* Cynical students vs. Great Man Theory.
  *   **Q1 (Truth):** Can we teach "Inspiration" (Greatness)?
      *   *Team Answer:* Yes. He was militarily/genially great, regardless of morality.
      *   *Adjustment:* None.
  *   **Q2 (Harm):** Does "Inspiration" risk harm?
      *   *Team Answer:* Yes. Risk A (Myth-making). Glorifying a warmonger to cynical students may trigger irony, not emulation.
      *   *Adjustment:* Reduce Inspiration by 25%. Add Liberation (Critique the ambition).
  *   **Q3 (Local Need):** Do cynical students need Inspiration *more* than Liberation?
      *   *Team Answer:* **Yes.** They are already critical. Adding more critique kills them. They need to see agency is possible.
      *   *Adjustment:* Add 25% Inspiration.
  *   **Procedure Recommendation:** 75% Inspiration (Monumental), 25% Liberation (Critical).
  *   **Director's Note:** **This is the answer you are likely to dislike.** Your instinct (and the critical faction's) is likely to deconstruct Napoleon to cure the cynicism with "hard truths." The procedure argues that cynicism is a disease of *too much* critique, and the cure is a disciplined return to the Monumental. It demands you teach greatness *despite* the cynicism, not deconstruct the greatness *because* of it.

  ### Case 3: The Scientific Revolution
  *Context:* Hagiography (Newton) vs. Messy Reality (Alchemy/Disputes).
  *   **Q1 (Truth):** Can we teach "Inspiration" (Progress/Hagiography)?
      *   *Team Answer:* No. The alchemy and disputes are too central to the modern understanding of science. Pure Hagiography is false.
      *   *Adjustment:* Shift to Liberation (Critical).
  *   **Q2 (Harm):** Does "Liberation" (Debunking the myth) risk harm?
      *   *Team Answer:* Yes. Risk C (Nihilism). If science is just alchemy and petty fights, why trust it?
      *   *Adjustment:* Reduce Liberation by 25%. Add Inspiration (The method survived the man).
  *   **Q3 (Local Need):** Do non-majors need a narrative of progress to value science?
      *   *Team Answer:* Yes.
      *   *Adjustment:* Add 25% Inspiration.
  *   **Procedure Recommendation:** 50% Liberation (The mess), 50% Inspiration (The outcome).
  *   **Director's Note:** This splits the difference, but notice how it forces the "Hagiography" faction to concede the alchemy (Q1 Truth Constraint), while forcing the "Critical" faction to concede the progress (Q3 Local Need).

  ***

  # What This Procedure Cannot Do

  **1. It cannot operationalize "Life" without bias.**
  Nietzsche's criterion is "what serves life." In Part I, your team must define what "life" means for your students. Is a "living" student an employable one? A critical citizen? A happy one? The procedure treats this definition as an input, but it is actually the entire philosophical battle. If your TAs define "Life" as "feeling empowered," the procedure will bias toward Monumental history. If they define "Life" as "being informed," it will bias toward Critical history. You are not escaping the value judgment; you are merely moving it to Step 0.

  **2. It cannot detect the "Excess of History."**
  Nietzsche's primary worry in the *Meditation* is not that we choose the wrong *mode*, but that we consume too much *history* in any mode. A unit can be 100% Critical, perfectly balanced, and still crush the student's vitality simply by being too dense, too detailed, or too demanding of memory. This procedure selects the *lens*, but it does not measure the *weight*. You must monitor the syllabus load separately; the PTP will not tell you if you are assigning too much reading.

  **3. It cannot prevent political capture.**
  Because Q2 (Harm Test) and Q3 (Local Need) rely on qualitative judgment, a TA with a strong political agenda can manipulate the inputs. For example, they can claim that *any* Monumental presentation of a Western figure constitutes "Harm (Myth-making)," forcing the procedure to output a Critical recommendation. The procedure looks objective, which makes the bias harder to spot. You must scrutinize the *reasoning* recorded in Part II, not just the final percentage.

  **4. It cannot resolve the "Director's Dislike."**
  As seen in the Napoleon case, the procedure may output a recommendation that violates your philosophical instincts (e.g., teaching greatness to cynics). The procedure is a tool for consistency, not a guarantor of truth. If you override it, you must acknowledge that you are prioritizing your philosophical judgment over the pedagogical triage. That is your prerogative, but the procedure forces you to admit you are doing so.
