answer: |-
  Here is a 20-minute decision procedure based on your selection-effect theory. It is designed to be run on the text of the proposal without requiring you to solve the equations.

  ### The "Port Audit" Procedure (20 Minutes)

  **Goal:** Determine if the mathematical structure fits the phenomenological structure, or if the fit is merely cosmetic.

  #### Step 1: The Invariant Check (5 Minutes)
  **Question:** What physical or logical quantities does the source math *require* to be conserved, bounded, or symmetric, and does the target system actually obey those constraints?
  *   **How to scan:** Look for the "Model Assumptions" section. Identify the source math (e.g., Hamiltonian mechanics, SIR models, Linear Regression). Google the *fundamental constraint* of that math if you don't know it (e.g., "Hamiltonian systems require energy conservation").
  *   **Pass:** The proposal explicitly states the target system approximates these constraints (e.g., "While energy isn't conserved, flux is balanced on this timescale").
  *   **Fail:** The proposal ignores a hard constraint (e.g., applying reversible math to an irreversible system).
  *   **Stop Rule:** If the target system fundamentally violates a core axiom of the math (e.g., applying conservative dynamics to a dissipative system), **STOP.** Do not fund on math grounds. (You can still fund the person, but mark the math as "unsupported.")

  #### Step 2: The Granularity & Noise Check (5 Minutes)
  **Question:** Does the scale of the "particles" in the math match the scale of the "agents" in the system, and is the noise structure compatible?
  *   **How to scan:** Look for the description of the units. Is the math designed for $N=\infty$ (thermodynamic limit) or small $N$? Is the noise Gaussian (bell curve) or Fat-Tailed (black swans)?
  *   **Pass:** The proposer acknowledges the scale mismatch and justifies why it averages out (e.g., "Though ants are fewer than atoms, their interaction rate is high enough to approximate a continuum").
  *   **Fail:** The proposal assumes smoothness in a system known to be lumpy, or assumes independence in a system known to be correlated.
  *   **Taste Flag:** If the proposal argues that "the noise doesn't matter," flag this for your intuition. That is usually where the bodies are buried.

  #### Step 3: The Failure Mode Honesty (5 Minutes)
  **Question:** Does the proposer specify where the analogy *breaks*, or do they claim the math is universal?
  *   **How to scan:** Search for "limitation," "caveat," "breakdown," or "assume."
  *   **Pass:** The proposal lists specific conditions under which the model will fail (e.g., "This breaks down if agents learn," or "This assumes no external shocks").
  *   **Fail:** The proposal implies the math *explains* the system rather than *models* it, or claims the analogy is "deep" without defining the boundaries.
  *   **Stop Rule:** If there is zero discussion of limitations, **STOP.** This is cargo culting. A mathematician knows where their tools break; a salesman does not.

  #### Step 4: The "Renaming" Test (5 Minutes)
  **Question:** Does using this math generate a prediction that couldn't be made with simpler tools, or does it just rename existing concepts?
  *   **How to scan:** Look at the "Expected Outcomes" or "Deliverables."
  *   **Pass:** "This will allow us to calculate the critical threshold for X," or "This predicts a phase transition at Y."
  *   **Fail:** "This will provide a new framework for understanding X," or "This will map the topology of Y." (If the output is a metaphor, not a number or a testable hypothesis, it's just poetry).
  *   **Taste Flag:** If the prediction is trivial (e.g., "more infection leads to more cases"), flag it. The math must earn its keep.

  ---

  ### Application to Your Three Proposals

  Here is the audit run on your specific pile.

  #### 1. Ant Colonies via Particle Systems (Stochastic)
  *   **Step 1 (Invariants):** Particle systems usually assume passive agents driven by external forces/thermal noise. Ants are active agents with internal states.
      *   *Proposal Text:* Proposer admits ants are "active matter" but argues that at the colony scale, individual agency averages out to effective temperature.
      *   *Verdict:* **Pass (with caveat).** This is a known field (active matter physics). The math has been stretched to fit, but the constraint violation is acknowledged.
  *   **Step 2 (Granularity):** 10,000 ants is enough for statistical mechanics, but not infinite.
      *   *Verdict:* **Pass.**
  *   **Step 3 (Failure Mode):** Proposer notes the model fails if pheromone trails create long-term memory (non-Markovian).
      *   *Verdict:* **Pass.** They know the break point.
  *   **Step 4 (Renaming):** Predicts a specific density threshold where traffic jams emerge.
      *   *Verdict:* **Pass.** Testable.
  *   **Overall:** **Fundable on math grounds.** It's a risky port, but the proposer respects the constraints.

  #### 2. Ecosystems via Symplectic Geometry (Planetary Orbits)
  *   **Step 1 (Invariants):** Symplectic geometry describes Hamiltonian systems. Core axiom: Phase space volume is preserved (Liouville's theorem). Energy is conserved. Systems are reversible.
      *   *Proposal Text:* Claims ecosystems have "conserved quantities" (biomass?).
      *   *Reality Check:* Ecosystems are dissipative. Energy flows through and is lost as heat. Species go extinct (irreversible). Biomass is not conserved in the relevant mathematical sense.
      *   *Verdict:* **HARD STOP.** This is a category error. You cannot port symplectic geometry to a dissipative system without fundamentally breaking the math.
  *   **Step 3 (Failure Mode):** Proposer claims this reveals the "underlying order" of nature. No mention of dissipation.
      *   *Verdict:* **Fail.**
  *   **Overall:** **Do not fund on math grounds.** This is exactly the cargo cult you fear. It treats the math as magic dust rather than a tool with specifications.

  #### 3. Scientific Fashions via Epidemiology (SIR Models)
  *   **Step 1 (Invariants):** SIR models require contact, transmission probability, and recovery (or removal).
      *   *Proposal Text:* Scientists "contact" ideas via papers/conferences. "Transmission" is citation/adoption. "Recovery" is losing interest.
      *   *Verdict:* **Pass.** The structural mechanism (contagion) is isomorphic, even if the medium is different.
  *   **Step 2 (Granularity):** Human behavior is noisier than viral loads.
      *   *Proposal Text:* Acknowledges "superspreaders" (famous PIs) and proposes a network model rather than a mean-field model to account for this.
      *   *Verdict:* **Pass.** They upgraded the math to fit the noise.
  *   **Step 3 (Failure Mode):** Admits the model cannot predict *which* idea spreads, only the *dynamics* of the spread once started.
      *   *Verdict:* **Pass.** Honest limitation.
  *   **Step 4 (Renaming):** Predicts a "herd immunity" threshold for bad methodologies (i.e., a point where adoption stalls).
      *   *Verdict:* **Pass.** Testable prediction.
  *   **Overall:** **Fundable on math grounds.**
      *   *Note:* I know you dislike this one. But structurally, this is a *better* port than the Ant one. Contagion logic applies to information better than Hamiltonian logic applies to biology. Your dislike might be aesthetic (it feels trivial) rather than mathematical. The procedure says the math holds; your taste says the question is banal. **Flag for Taste.**

  ---

  ### Where This Framing Breaks Down

  You asked for honesty about the theory and the procedure. Here are the three failure modes you need to keep in mind.

  **1. The "Abstract Success" Counter-Example**
  Your theory relies on math co-evolving with phenomena (calculus -> motion). But some of the most powerful math is powerful *because* it was stripped of context. Group Theory didn't come from physics; it came from algebra. It works in physics, chemistry, and cryptography precisely because it ignores the "phenomena" and tracks pure structure.
  *   **Risk:** The procedure might reject a proposal that uses highly abstract math (like Category Theory or Topology) because the "invariants" aren't physical.
  *   **Mitigation:** In Step 1, distinguish between *physical* constraints (energy) and *logical* constraints (connectivity). If the math is structural, check the structure, not the physics.

  **2. The "Charlatan's Limitation"**
  Step 3 relies on the proposer honestly listing failure modes. A sophisticated cargo cultist knows to write a "Limitations" section. They will say, "Of course, this assumes rational agents, which is a simplification," while building a model that collapses if agents are irrational.
  *   **Risk:** The procedure gives a "Pass" to a well-written lie.
  *   **Mitigation:** Look for *quantitative* limitations ("valid for N > 1000") rather than *qualitative* ones ("assumes rationality"). Numbers are harder to fake than prose.

  **3. The "Incrementalism" Bias**
  Your selection-effect theory favors math that has already worked on similar things. This procedure will systematically filter out high-risk, high-reward "category errors." Some of the biggest breakthroughs (e.g., Schrödinger applying eigenvalue problems to atoms, or Black-Scholes applying heat equations to options) looked like category errors at the time.
  *   **Risk:** You will fund safe, incremental modeling and miss the revolutionary misapplications.
  *   **Mitigation:** Use the "Taste Flag." If a proposal fails Step 1 but the proposer is brilliant and the question is vital, fund the *person*, not the *method*. Your procedure protects the foundation from wasting money on bad math; your intuition must protect the foundation from missing good surprises.

  **Summary Recommendation:**
  Use the Audit to kill the Symplectic/Ecosystem proposal (it's mathematically incoherent). Use the Audit to clear the Econ/Epi proposal's *math* (it's structurally sound), but apply your personal skepticism to the *value* of the question. Use the Audit to verify the Ant proposal is careful about "active matter."

  This keeps your foundation safe from nonsense without forcing you to become a mathematician.
