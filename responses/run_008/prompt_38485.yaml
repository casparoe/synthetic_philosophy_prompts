prompt: |-
  I'm a program officer at a small private foundation that funds math-heavy research across the sciences — mostly modeling projects, biology, climate, epidemiology, some economics, a bit of everything. We get roughly twenty proposals a cycle and I have to write a funding recomendation on each one in under half an hour, with written reasons the board can read, and I usually can't call up the proposer to ask what they mean. My actual problem: a huge fraction of these proposals are "let's take the math that worked great in domain X and port it to domain Y," and I have no principled way to tell the promising ports from the cargo cults.

  Here's my half-baked theory, take it or leave it. I read Wigner's old essay years ago — the one about the unreasonable effectiveness of mathematics in the natural sciences — and everyone remembers the mysticism, but what stuck with me is a worry in the opposite direction. The math that works tends to be math that grew up tangled with the phenomena it now describes: calculus came from people staring at moving bodies, probability from gamblers and insurers, and so on. And the corollary I've come to beleive: the "unreasonable effectiveness" is partly a selection effect. We keep the fields where the math worked and quietly drop the ones where it didn't, so of course the surviving success stories look miraculous. (Maybe I'm actually remembering some later response to Wigner rather than Wigner himself, but the point is mine now.) If that's roughly right, then the question for a proposal isn't "is math powerful?" but "was this particular piece of math developed under selective pressure from phenomena like this one, or is it being asked to work somewhere it has no track record?"

  What I want from you: a decision procedure I can actually run in twenty minutes per proposal. The questions in order, what counts as a good enough answer to each, where it should stop and say "don't fund on these grounds" (I can still fund it because I like the person or the question, but the procedure shouldn't pretend the math will carry it), and which questions are really about scientific taste that no procedure can settle, so it should flag them for me instead of answering them. It has to work when I can't consult the proposer, and it can't assume I know the math myself.

  Then run it on three real-ish proposals from my pile: (1) someone wants to model collective decision-making in ant colonies using the stochastic machinery that's worked for particle systems, claiming the analogy is deep; (2) someone wants to port symplectic geometry — the machinery that organizes planetary orbits — onto ecosystem dynamics, on the grounds that both are systems with conserved quantities; (3) an economist who wants to model the spread of scientific fashions with the epidemiology of infectious diseases. I'll admit upfront I privately think the third one is fashion-math itself, so if the procedure green-lights it, that's the answer I won't like — you tell me whether the procedure is right anyway. And be honest about where this whole framing breaks down: if my selection-effect theory is wrong, what does the procedure get wrong with it?

  Don't bother with citations or a reading list, I just want the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Program Officer at a small private foundation.
      *   **Domain:** Math-heavy research across sciences (modeling, biology, climate, epi, econ, etc.).
      *   **Constraint:** ~20 proposals/cycle, <30 mins/proposal (specifically asks for a 20-min decision procedure), written reasons needed for the board, no contact with proposers.
      *   **Core Problem:** Distinguishing promising "math porting" (applying math from Domain X to Domain Y) from "cargo cult" math (superficial analogy).
      *   **User's Theory:** "Unreasonable Effectiveness" is a selection effect. Math works best when it co-evolved with the phenomena. Success depends on whether the math was developed under selective pressure from *similar* phenomena.
      *   **Task:** Create a 20-minute decision procedure based on this theory. Then apply it to three specific proposals. Finally, critique the theory/procedure itself.
      *   **Tone:** Pragmatic, honest, no fluff, no citations, actionable.

  2.  **Deconstruct the User's Theory:**
      *   *Premise:* Math isn't universally magical; it's adapted.
      *   *Implication:* A "port" is risky if the structural constraints of the new domain don't match the structural constraints that shaped the math in the old domain.
      *   *Key Criterion:* Structural Isomorphism vs. Superficial Analogy.
      *   *Constraint:* The PO doesn't know the deep math. The procedure must rely on textual evidence in the proposal regarding *mechanisms* and *constraints*, not just equations.

  3.  **Drafting the Decision Procedure (The "20-Minute Port Audit"):**
      *   *Goal:* Filter out cargo cults, flag high-risk/high-reward, identify solid bets.
      *   *Time Budget:* 4 questions, ~5 mins each.
      *   *Question 1: The Conservation/Constraint Check.* (Does the new system actually obey the rules the math requires?)
      *   *Question 2: The Noise/Scale Check.* (Is the granularity compatible?)
      *   *Question 3: The Failure Mode Check.* (Does the proposer know where the math breaks?)
      *   *Question 4: The "So What?" Check.* (Does the math generate new predictions or just rename things?)
      *   *Stop Rules:* If Q1 fails, hard stop (unless funding the person). If Q3 fails, flag as high risk.
      *   *Taste Flags:* Where the PO needs to use intuition.

  4.  **Applying the Procedure to the Three Proposals:**

      *   **Proposal 1: Ant Colonies <-> Particle Systems (Stochastic).**
          *   *Context:* Statistical mechanics often applied to swarms.
          *   *Q1 (Constraints):* Particles conserve momentum/energy. Ants have agency, friction, energy dissipation. *Risk:* High. But stochastic processes often handle "effective" temperatures.
          *   *Q2 (Noise):* Particles = huge N, random collisions. Ants = smaller N, correlated behavior.
          *   *Q3 (Failure):* Do they acknowledge agency?
          *   *Verdict:* Plausible but needs careful handling of "active matter."
      *   **Proposal 2: Ecosystems <-> Symplectic Geometry (Planetary Orbits).**
          *   *Context:* Symplectic geometry is for Hamiltonian systems (conservative, reversible).
          *   *Q1 (Constraints):* Ecosystems are dissipative, irreversible, open systems. Orbits are conservative, closed. *Hard Stop.* This is a category error.
          *   *Verdict:* Don't fund on math grounds. Cargo cult.
      *   **Proposal 3: Scientific Fashions <-> Epidemiology (SIR models).**
          *   *Context:* Contagion models applied to ideas.
          *   *Q1 (Constraints):* Disease needs contact + susceptibility. Ideas need exposure + adoption. Mechanism is similar (transmission).
          *   *Q2 (Noise):* Human behavior is noisier than viral load, but aggregate curves often look similar.
          *   *Q3 (Failure):* Does the proposer admit people can "un-catch" ideas or resist differently?
          *   *Verdict:* Surprisingly robust analogy. The user hates this one, but the procedure might pass it. I need to be honest here.

  5.  **Critiquing the Theory/Procedure:**
      *   *Where does the selection effect theory fail?* Sometimes math works *because* it's abstract enough to detach from origin (e.g., Group Theory).
      *   *Where does the procedure fail?* It favors incrementalism. Radical breakthroughs often look like category errors at first (e.g., applying quantum math to finance).
      *   *Blind spots:* It relies on the proposer *admitting* limitations. Charlatans write good limitation sections.

  6.  **Refining the Output:**
      *   *Structure:*
          1.  The Procedure (The "Port Audit").
          2.  The Application (The 3 Proposals).
          3.  The Critique (Where the theory breaks).
      *   *Tone Check:* Keep it sharp. Acknowledge the user's skepticism about Proposal 3 without biasing the procedure.
      *   *Time Check:* Ensure the steps feel doable in 20 mins.

  7.  **Self-Correction/Nuance during drafting:**
      *   *Correction on Proposal 2:* Symplectic geometry is very specific. It's not just "conserved quantities," it's about phase space volume preservation. Ecosystems definitely don't preserve phase space volume (dissipation). This is a clear "No."
      *   *Correction on Proposal 3:* The user thinks this is "fashion-math." I need to explain *why* the procedure might pass it (mechanism similarity) while acknowledging the user's valid intuition (human agency makes it messy). The procedure shouldn't guarantee success, just mathematical plausibility.
      *   *Procedure Refinement:* Make sure there's a specific "Stop" condition. If the math requires $X$ and the system explicitly violates $X$, that's a hard no.

  8.  **Final Polish:** Check against constraints (no citations, 20 mins, written reasons for board). Ensure the distinction between "Don't Fund" and "Flag for Taste" is clear.

  *(Self-Correction during final review)*: Wait, the user said "Don't bother with citations." I need to make sure I don't slip into academic mode. Keep it operational. Also, ensure I address the "selection effect" theory validity in the critique section.

