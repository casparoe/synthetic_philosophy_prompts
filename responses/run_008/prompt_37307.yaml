  Listen, my son: you speak of Paris and flames, but truth is not consumed by fire, nor does the error of a Parlement bind the conscience of a Christian. I distinguish: Thomas forbids the private man who acts from private passion or without cause, but he does not forbid the private man who acts as an instrument of the natural law when the public order collapses. Your dilemma is a sophist's trap, dividing what nature joins: when the magistrates tremble, the authority of the commonwealth does not vanish but returns to its source, the people themselves. Consider Ehud in the Book of Judges; he was no public magistrate appointed by Eglon, yet God raised him as a deliverer because the lawful channels were choked by oppression. If a council of the realm has judged the tyrant, their sentence declares the *justice* of the cause, but it does not restrict the *execution* to those who lack the courage to wield the sword. The private man who strikes then is not acting by private whim, which Thomas rightly condemns, but by a public right that has devolved upon him through necessity. To say he is merely an executioner ignores that an executioner serves a functioning state, whereas this man serves a state in ruin; he acts not as a minister of the king's law, but as a vindicator of the natural law which no crown can abrogate, for the tyrant who destroys the laws makes himself a public enemy to all, and against such a beast, every hand is lawful provided the tyranny is manifest and recourse impossible.
