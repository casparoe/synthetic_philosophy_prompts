      *(Another Correction)*: Make sure to emphasize *why* the literature is thin. It's because people usually talk about "Teleology" or "Function," not specifically "Free-Floating Rationales." The student needs to brand their work carefully so it doesn't get lost in the Teleosemantics swamp.

