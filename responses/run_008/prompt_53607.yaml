          3.  **Q2 (Artifacts/Social):** The Extension.
          4.  **Q3 (Collectivities):** The Speculative Edge (Deprioritize slightly).

      *   *Wait, I need to be careful about Q3.* Dennett's interpretationism is key to FFRs. If groups have FFRs, do they have intentions? This is actually very Dennettian. But for a PhilBio student, Q1 is the anchor. I will advise making Q1 the core, Q4 the methodological defense, and Q2 the application. Q3 is the "future work" or a smaller chapter.

      *   *Let's adjust the ranking for a 3-year timeline.*
