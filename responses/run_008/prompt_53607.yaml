      *   *Missing Question:* **The Normativity/Error Problem.** Teleology requires the possibility of failure. If FFRs are just "reasons why," do they entail "reasons for"? This is crucial for distinguishing FFRs from mere causal explanations.

  7.  **Final Polish:**
