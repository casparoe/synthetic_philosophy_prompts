      *   *Refining the Principle:* The user is basically describing the **Rule of Law** as a condition of **Legality**, not just legitimacy. This is a strong Fullerian claim, but without the substantive moral claim. It's "Procedural Natural Law" without the "Substantive Natural Law."
      *   *Wait, one nuance:* Hart would say secret rules *are* law in a primitive system, just bad law. The user says "not law at all." This pushes the user closer to Fuller or Raz (authority claim) than Hart.
