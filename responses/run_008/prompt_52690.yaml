      *   This sounds remarkably like **Lon Fuller's "Internal Morality of Law"** *except* for the monstrous statute case. Fuller argues that if you satisfy the 8 desiderata (public, prospective, clear, etc.), you have law. But he also hints that extreme substantive evil might undermine the *claim* to fidelity. However, the user says the monstrous statute *is* law.
