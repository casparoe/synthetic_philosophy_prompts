  Prop: $P(\text{If Fail, Ward 4})$ could be high even if $P(\text{Fail})$ is low? Actually, Stalnaker Thesis says $P(A \to B) = P(B|A)$. So $P(\text{Fail})$ doesn't matter for the conditional's probability.
