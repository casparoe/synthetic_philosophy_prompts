answer: |-
  **Setting:** *A quiet corner of a university faculty lounge, late afternoon. Two coffee cups sit between them, one cold, one steaming.*

  **Characters:**
  *   **Prop:** Defends truth-conditional semantics (Stalnaker/Jackson line).
  *   **NTV:** Defends the no-truth-conditions view (Adams/Edgington line).

  ***

  **NTV:** You're dodging the bullet, Prop. We've been circling it for twenty minutes. Lewis's 1976 proof isn't a suggestion; it's a demolition order. If indicative conditionals express propositions—members of the algebra over which your credence function is defined—and if you maintain that the probability of that proposition equals the conditional probability of the consequent given the antecedent, then your probability function must be trivial. You can't distinguish between enough worlds to model ordinary uncertainty. Since we *are* uncertain about plenty of things, conditionals can't be propositions.

  **Prop:** I'm not dodging; I'm parsing. Lewis proves that *unrestricted* Stalnaker's Thesis is incompatible with propositional status. Specifically, he shows that if $P(A \to B) = P(B|A)$ holds for *all* probability functions obtainable by conditionalizing on the conditional itself, then triviality follows. My move is simple: I deny the thesis holds for *all* such functions. It holds for the agent's *actual* credence function at the time of utterance, but not necessarily after you conditionalize on the conditional. The proposition exists; the probabilistic equation is just a contingent feature of rational initial credences, not a necessary law of semantics.

  **NTV:** That's a retreat, not a defense. Why would the equation hold for my current credence but break the moment I learn the conditional is true? If "If it rains, the match is cancelled" expresses a fact, learning that fact should update my probabilities via standard conditionalization. If your semantics requires me to update in a way that violates the ratio analysis of conditional probability, you're positing a proposition that behaves nothing like the other propositions in my ontology. You're giving it a truth condition but denying it the logical role of a truth-bearer.

  **Prop:** I'm denying it the logical role of a *standard* truth-bearer in the context of probability kinematics, yes. But consider the alternative. You say conditionals aren't propositions. Fine. Then explain this: A nurse is triaging during a hospital blackout. She has one portable ventilator. She operates under the protocol: "If the main generator fails, Ward 4 gets the ventilator." The generator is brand new; the probability of failure is 0.01. But the conditional probability of Ward 4 getting the vent *given* failure is 1. On your view, her high confidence in the conditional is just a high conditional belief. But suppose the generator *does* fail, and she sends the vent to Ward 3. We hold her accountable. We say she violated the protocol. We say the statement "If the generator fails, Ward 4 gets the ventilator" was *false* in that situation. If it lacks a truth condition, what exactly did she violate? A feeling?

  **NTV:** She violated a conditional commitment. Look, the case actually cuts against you. The nurse's decision to reserve the vent depends on $P(\text{Ward 4} | \text{Failure})$. It does *not* depend on $P(\text{Failure})$. If your view treats the conditional as a proposition $X$, then standard probability theory says $P(X \land \text{Failure}) = P(X) \times P(\text{Failure} | X)$. If $P(\text{Failure})$ is tiny, and you treat the conditional as a standard proposition, you risk conflating the probability of the antecedent with the probability of the conditional. Adams' Thesis captures the intuition perfectly: she accepts the conditional to degree 1 because she accepts the consequent to degree 1 *on the supposition* of the antecedent. The "truth" you're looking for is just the stability of that suppositional judgment. When the failure occurs, we don't discover a pre-existing truth value; we evaluate whether her conditional commitment was honored.

  **Prop:** But that evaluation *is* a truth-value assignment! If Ward 4 doesn't get the vent, the conditional is false. If they do, it's true. You're smuggling in truth conditions via the back door of "honoring commitments." And this brings us to embedding, where your view starves. Consider: "If it is true that if the shipment arrives Friday we get the bonus, then we should pay the dockers extra." This is a coherent sentence. It embeds a conditional in the antecedent of another conditional. On my view, the inner conditional denotes a proposition, which can be the argument of the outer "if." On your view, the inner clause has no truth value. So the outer antecedent says "If it is true that [nothing]..." It's category error gibberish.

  **NTV:** I'll concede that embedding is the tax I pay for avoiding triviality. But it's not gibberish; it's a cue to parse differently. When we say "If it's true that if A, B...", we're often speaking metalinguistically or shifting to a higher-order supposition. We mean: "If, under the supposition of A, I am committed to B, then..." We can paraphrase away the embedding. Can you handle the probability of the embedded conditional? If $A \to B$ is a proposition, what is $P(C \to (A \to B))$? If you apply Stalnaker's Thesis recursively, you run into McGee's counterexamples regarding import-export. You might avoid Lewis's triviality, but you invite inconsistency in your logic of iterated conditionals.

  **Prop:** McGee's counterexamples rely on accepting Modus Ponens for iterated conditionals in a way that conflicts with the selection function semantics. I can deny Import-Export for indicatives and keep the semantics consistent. But let's talk about bets, since you love betting quotients. Take a standard conditional bet: I bet you \$100 that "If it rains tomorrow, the match is cancelled." If it doesn't rain, the bet is void. I get my money back. You claim this supports NTV: the bet is void because the conditional has no truth value when the antecedent is false.

  **NTV:** Precisely. If the conditional were a proposition, it would be either true or false when it doesn't rain. If it's false, I win the bet. If it's true, you win. But we don't settle the bet. We call it off. This suggests that when $\neg A$, the conditional isn't false; it's undefined. It matches the three-valued tables or the suppositional view. The bet tracks the conditional probability, not the truth of a material or strict implication.

  **Prop:** I disagree. The bet is void not because the proposition lacks a truth value, but because the *wager* is pragmatically cancelled. De Finetti handled this with three-valued logic, but you don't need three values to explain the void. Think of it as a contract: "Pay me if $A \land B$." If $\neg A$, the condition for payment isn't met, but neither is the condition for loss. The bet is designed to test the truth of the conditional *in the A-worlds*. The fact that we don't pay out in $\neg A$-worlds doesn't mean the conditional is truth-valueless there; it means the betting mechanism is insensitive to those worlds. In fact, if the match *is* cancelled despite no rain, do we say the conditional was true? No. We say the bet was void. But if it rains and the match continues, we say the conditional was false. The asymmetry suggests truth conditions exist, but the betting rules are restricted to the antecedent's obtaining.

  **NTV:** That's a lot of pragmatic scaffolding to save a truth condition that does no work. If the truth value in $\neg A$-worlds never affects the bet, never affects the assertion conditions, and never affects the reasoning... why posit it? Occam's razor shaves it off. Lewis saw this. He eventually agreed with me. The triviality result shows that if you want the probabilities to match our intuitive judgments about reasoning and betting—which we do—you must drop the proposition.

  **Prop:** Lewis conceded too quickly. The truth condition does work: it explains logical entailment and embedding, which you have to paraphrase away. And regarding the triviality proof, let's be precise about what we can agree on. You claim it proves conditionals aren't propositions. I claim it proves Stalnaker's Thesis isn't a universal constraint on rational credence.

  **NTV:** Okay, let's try to formulate the result neutrally. Lewis showed that there is no mapping from pairs of propositions $(A, B)$ to a proposition $(A \to B)$ in a non-trivial Boolean algebra such that for *every* probability function $P$ on that algebra, $P(A \to B) = P(B|A)$.

  **Prop:** Agreed. That is the theorem. The divergence is on the corollary. You infer: Therefore, $(A \to B)$ is not a proposition in the algebra. I infer: Therefore, the equation $P(A \to B) = P(B|A)$ does not hold for *every* probability function $P$ in the algebra. Specifically, it fails when $P$ is a function conditionalized on the conditional itself.

  **NTV:** But why would rationality require the equation to fail upon learning the conditional? If I learn "If A, B," my credence in B given A should go to 1. If the conditional is a proposition, learning it means conditionalizing on it. If your semantics says I *can't* conditionalize on it without breaking the probabilistic link, you've made the proposition epistemically inaccessible in a standard way.

  **Prop:** Not inaccessible. Just distinct. The proposition is about similarity relations between worlds. My credence in that similarity relation might align with $P(B|A)$ initially, but updating on the similarity relation itself shifts the weightings of the worlds in a way that diverges from standard conditionalization on $A$. It's a feature of the *content*, not a bug. We agree on the math, NTV. We disagree on whether the math dictates the metaphysics or the epistemology.

  **NTV:** *Sighs.* We agree on the math. But if the metaphysics dictates an epistemology where I can't update on conditionals the way I update on facts, I'll take the epistemology and drop the metaphysics.

  **Prop:** And if dropping the metaphysics makes my logic of embedding incoherent, I'll keep the metaphysics and refine the epistemology. We're at a stalemate, but at least we know the battlefield.

  **NTV:** The battlefield is the triviality theorem. We agree it forbids the union of Propositions + Universal Adams' Thesis. We just pick different casualties.

  **Prop:** Precisely. Coffee?

  **NTV:** Black. Like the truth value of a conditional when the antecedent fails.

  **Prop:** *Laughs.* Don't start that again.

  ***

  ### Post-Dialogue Note

  This dialogue takes a few liberties for the sake of clarity and dramatic compression. Primarily, **Prop's** position is a hybrid of Stalnaker (1968) and Jackson (1987); Stalnaker himself eventually moved closer to a pragmatic view to accommodate triviality, whereas Jackson defended truth conditions via "conventional implicature." **NTV** conflates Adams' probabilistic logic with Edgington's more explicit suppositionalism, particularly regarding the embedding problem (McGee 1985 is hinted at but not fully unpacked).

  The interpretive claim I am least confident in is **Prop's assertion that the failure of Stalnaker's Thesis under conditionalization is merely a "feature of the content."** Lewis's argument is often read to show that *no* proposition in the algebra can satisfy the thesis for even *one* reasonable credence function if the algebra is rich enough, unless that proposition is independent of the antecedent. Prop's defense relies on the idea that the conditional proposition is not in the same algebra as the antecedent and consequent for the purposes of probability updating, which is a contested maneuver (see Hájek 1989). The dialogue presents this as a viable "restriction," but many probabilists consider this move to effectively concede that the conditional does not behave like a proposition *for probabilistic purposes*, which is NTV's core point.
