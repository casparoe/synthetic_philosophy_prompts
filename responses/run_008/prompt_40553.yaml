prompt: |-
  I've spent twenty years as a science journalist, and most of what passes for my epistemology is newsroom practice: the two-source rule, the fact-check desk, the embargo system, the chain of custody a claim travels from lab notebook to press release to wire copy, the standing question of whether I verify a finding myself or attribute it to a named expert and let the attribution do the justificatory work. I have lately been reading the epistemology of testimony — the dispute between reductionists, who hold that testimony transmits warrant only because hearers possess an inductive track record of testimonial reliability, and anti-reductionists, who hold that testimony is a basic source of justification, available to a hearer absent defeaters — and I keep feeling that I already know this fight from the inside, under different names. But I distrust the feeling, so I want the translation done properly.

  Restate the reductionism versus anti-reductionism debate in the vocabulary I actually use. Map it carefully: the reductionist demand that testimonial warrant trace back to non-testimonial evidence onto what a fact-checker can independently confirm; the anti-reductionist's no-defeater condition onto the editorial judgment that a source may be run absent red flags; the background induction over past testimonial reliability onto the beat reporter's accumulated sense of which labs' press offices exaggerate; the dispute over whether a hearer must possess the track record or merely the world must contain one onto the difference between what I can check on deadline and what my institution's accumulated credibility does for me. Where it helps, use a concrete case: a reporter deciding whether to publish a physics result that exists as one arXiv preprint plus confirmations relayed through five independent press officers. Show me how a committed reductionist and a committed anti-reductionist would each reason about running the story, in my terms.

  Then give me the residue report, which is the part I actually want. Which parts of the philosophical disagreement map cleanly onto distinctions we draw every day; which parts I have to distort to fit into newsroom terms; and which parts have no counterpart at all in my vocabulary. I have two suspicions I want tested rather than confirmed. The first is that a newsroom is an institution built to first-hand-ify claims — to convert testimony into something checkable — and that this makes my vocabulary structurally blind to the anti-reductionist's strongest point, that almost everything anyone knows, including journalists, arrives uncheckable and stays that way; if that is the residue, it is my vocabulary that is missing something, and I would like to know what. The second is the opposite: that once both sides are forced through my practical cases, the dispute mostly dissolves into a disagreement about the word basic, with no operational difference in when either side would run the story — in which case the philosophical debate is less substantive than it looks, and the newsroom vocabulary is the clearer one. Tell me honestly which suspicion survives contact with the material, and where the translation had to cheat to make either side come out coherent.

  Do not soften the philosophy to flatter my experience; if the reductionist's picture of a self-auditing knower is, in my world, a reporter who has never met a deadline, say so — but then explain what the philosophers were actually getting at that my world cannot see.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A science journalist with 20 years of experience. Deeply familiar with newsroom epistemology (two-source rule, fact-checking, embargoes, attribution).
      *   **Current Interest:** Reading academic epistemology of testimony (Reductionism vs. Anti-Reductionism).
      *   **Core Task:** Translate the philosophical debate into newsroom vocabulary. Map specific philosophical concepts to journalistic practices. Use a concrete case (physics preprint + 5 press officers).
      *   **Critical Task (The "Residue Report"):** Analyze the limits of the translation. Test two specific suspicions:
          1.  Newsrooms are built to "first-hand-ify" claims, blinding them to the anti-reductionist truth that most knowledge is uncheckable testimony.
          2.  The philosophical dispute dissolves into semantics ("basic") with no operational difference, making newsroom vocabulary clearer.
      *   **Tone/Constraint:** Do not soften the philosophy. Be honest about where the newsroom view is blind or where the philosophy is operationally empty.

  2.  **Deconstruct the Philosophical Debate:**
      *   **Reductionism (Humean):** Testimony is not a *sui generis* source of justification. It reduces to perception, memory, and induction. I believe you *because* I have independent evidence that you are reliable. Burden of proof is on the hearer to establish reliability.
      *   **Anti-Reductionism (Reidian):** Testimony is a basic source of justification (like perception). I am entitled to believe you *unless* I have a reason not to (defeaters). Burden of proof is on the doubter to find red flags.
      *   **Global vs. Local:** Is the reliability of testimony in general required, or just this specific speaker? (Newsrooms deal with specific sources, but rely on institutional reputation).

  3.  **Drafting the Translation (Mapping):**
      *   *Reductionist Demand:* "Show me the data." Trace warrant back to non-testimonial evidence. -> *Newsroom:* Fact-checker verifying raw data, calling the PI directly, checking the methodology, not just the press release.
      *   *Anti-Reductionist No-Defeater:* "No red flags." -> *Newsroom:* Editorial judgment. Source is reputable (Nature, CERN), no conflicting emails, no history of retractions. Run it unless something smells wrong.
      *   *Background Induction:* "Track record." -> *Newsroom:* Beat reporter's mental database. "Lab X always hyped," "Researcher Y is conservative."
      *   *Hearer vs. World Track Record:* "Do *I* need to know the stats, or does the system know?" -> *Newsroom:* Individual reporter's deadline constraints vs. Institutional brand/reputation (the "wire copy" trust).
      *   *Concrete Case:* Physics preprint + 5 press officers.
          *   *Reductionist Reporter:* Won't run it based on 5 press officers. Needs to talk to the authors, check the math, find an independent expert to critique the method. The press officers are just amplifiers, not validators.
          *   *Anti-Reductionist Reporter:* Runs it. 5 independent press offices vouching for it creates a presumption of truth. Unless an expert says "this is nonsense," the testimony *itself* carries weight.

  4.  **Developing the Residue Report (The Core Analysis):**
      *   *Suspicion 1 (Newsroom Blindness):* Is the newsroom structurally blind to the anti-reductionist point?
          *   *Analysis:* Yes. The "Two-Source Rule" is inherently reductionist. It demands independent verification (induction). It treats testimony as suspect until corroborated. The anti-reductionist says testimony *is* knowledge. The newsroom treats testimony as *leads* for knowledge.
          *   *Verdict:* Suspicion 1 holds water. The newsroom ethic is "trust but verify," which is philosophically reductionist. It misses the sheer volume of knowledge we *must* accept without verification to function.
      *   *Suspicion 2 (Dissolution into Semantics):* Does the debate dissolve in practice?
          *   *Analysis:* In the *decision to publish*, they might look similar (both run the story if checks pass). But the *justification* differs. However, under deadline pressure, the distinction collapses into "risk management."
          *   *Verdict:* Suspicion 2 is partially true but dangerous. It's not just semantics; it's about where the burden of proof lies. But operationally, newsrooms force a hybrid model.
      *   *Where the Translation Cheats:*
          *   Philosophy cares about *justification* (internal state). Newsrooms care about *liability* (external consequence).
          *   Philosophy assumes an individual knower. Newsrooms are collective epistemic agents.
          *   "Attribution" is a cheat. It outsources the epistemic burden. "Scientists say X" isn't "X is true," it's "Scientists say X is true." This sidesteps the philosophical problem entirely.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to make sure I don't just say "Newsrooms are reductionist." I need to show *how* the anti-reductionist view exposes a vulnerability.
      *   *Key Insight:* The "Attribution" move is the journalist's escape hatch. It allows them to act like anti-reductionists (publishing based on testimony) while claiming reductionist cover ("I'm not saying it's true, I'm saying they said it").
      *   *Philosophical Depth:* The reductionist isn't just a pedant; they are guarding against systemic error. The anti-reductionist isn't just naive; they are acknowledging the division of cognitive labor.
      *   *Final Verdict:* Suspicion 1 is the stronger insight. The newsroom vocabulary *is* missing the concept of "entitlement without verification." Suspicion 2 is a comforting illusion; the stakes differ (truth vs. reputation).

  6.  **Drafting the Response (incorporating the voice):**
      *   *Tone:* Professional, respectful, intellectually rigorous, matching the user's sophistication.
      *   *Structure:*
          1.  The Translation (Mapping concepts).
          2.  The Concrete Case (Physics preprint).
          3.  The Residue Report (Testing the suspicions).
          4.  The Verdict (Which suspicion survives).

  7.  **Final Polish:** Check against constraints. "Do not soften the philosophy." "Say so if a reporter has never met a deadline." Ensure the distinction between *individual* reporter and *institution* is clear in the "Hearer vs. World" mapping. (Self-correction: Make sure to emphasize that attribution is a distinct epistemic category that philosophy often ignores).

  8.  *(Final thought before generating)*: The user is asking for a "residue report." This implies looking at what doesn't fit. The biggest thing that doesn't fit is *attribution*. In philosophy, "A says P" usually leads to "Do I believe P?" In journalism, "A says P" leads to "I report that A says P." This is a crucial distinction to highlight in the residue section.

