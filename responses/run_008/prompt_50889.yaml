      *   *Move 7 (Marcus):* Physical Continuity Defense. Anesthesia doesn't break *physical* causal chain. Brain still operates. It's about unbroken physical causality, not awareness.
      *   *Move 8 (Elena):* Substrate Trap. Marcus just admitted substrate/physical stuff matters. This contradicts his earlier claim that only *pattern* matters (which justified gradual replacement). If substrate matters, replacing neurons with chips should fail.

