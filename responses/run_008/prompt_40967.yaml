      *   *Check:* Is the Devlin "disgust" point clear? *Correction:* Make sure to distinguish between *moral* indignation (Devlin) and *physiological* nausea (Ludovico). This is the crux.

  8.  **Final Polish:** Ensure the voice sounds like a philosopher-film-critic. Use terms like "technocratic utilitarianism," "moral agency," "visceral register." (Proceed to generate output).

  *(Self-Correction Note: Make sure not to be too academic. Keep it punchy like a conversation between colleagues.)*

  9.  **Final Plan:**
