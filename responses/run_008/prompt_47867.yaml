answer: |-
  1. "The Question"

  Consider a convicted murderer. Case A: He dies within a month. Punishment yields no deterrence, incapacitation, rehabilitation, or communicative benefit. Case B: Punishing him triggers riots costing more lives than the crime. Answer: (1) Does retributivism require punishment in Case A? (2) Does consequentialism permit withholding it in Case B? (3) Crucially, explain what work 'desert' does in each theory. Is it a necessary condition, sufficient reason, or side constraint? Use these cases to show why distinguishing these roles matters for justified punishment.

  2. "Model Answer"

  In Case A, the consequentialist must argue against punishment. The core commitment of consequentialism is that actions are justified solely by their outcomes. Here, the offender dies within a month. Punishment cannot deter others, rehabilitate the offender, or incapacitate him beyond his impending death. Inflicting suffering now produces no future reduction in suffering. Therefore, punishment is merely a net increase in pain without any compensating social good. The retributivist reaches the opposite conclusion. For them, justification looks backward at the wrongful act, not forward to benefits. The offender committed murder; therefore, they deserve suffering. The lack of future benefit is irrelevant because desert is not about social engineering. It is about giving the offender what they are owed based on past conduct. Thus, punishment is required or at least permitted based solely on guilt.

  In Case B, the consequentialist verdict remains consistent. Punishing the offender triggers riots that cost more lives than the original crime. The net utility is negative. Even though the offender is guilty, punishing them creates more harm than it prevents. Therefore, punishment is impermissible. The retributivist faces a significant tension. If desert is a sufficient reason to punish, justice demands punishment regardless of the riots. However, most intuitively feel that causing a disaster is unjustified. This forces a nuance in retributive theory. Many retributivists argue that desert is a necessary condition for punishment, but not always sufficient. They might argue that while the offender deserves punishment, the duty to punish is overridden by the catastrophe. This suggests desert creates a prima facie duty, not an absolute one.

  These cases reveal the structural role of desert in each theory. For the consequentialist, desert is not a positive reason to punish. It functions, at best, as a side constraint. We cannot punish the innocent, but guilt alone does not justify punishment. Utility must do the heavy lifting. In Case A, the constraint is met because he is guilty, but the reason is missing because there is no utility. For the retributivist, desert is the primary justification. It is often treated as sufficient. In Case A, desert alone justifies the act. In Case B, the retributivist must decide if desert overrides consequences. If they say yes, desert is absolute. If they say no, desert is a constraint within a broader framework. This distinction is vital. If desert is merely necessary, then Case B allows withholding punishment. If desert is sufficient, Case B demands punishment despite riots. The theory chosen dictates the outcome based on this structural role.

  Ultimately, the cases show that consequentialists treat desert as a boundary, while retributivists treat it as a foundation. If a student claims desert is a goal for consequentialists, they misunderstand Case A. If they claim desert is irrelevant for retributivists in Case B, they misunderstand the duty. The distinction between desert as a necessary condition versus a sufficient reason is the key to unlocking the theoretical divergence. Without this distinction, the theories look like simple opposites rather than structurally different accounts of justification. Understanding this allows us to see why the theories yield different results not just in outcomes, but in their fundamental logic. A theory that treats desert as a maximizing goal fails in Case A. A theory that treats it as a side constraint fails to explain the intuition in Case A. Thus, the role of desert defines the theory's limits.

  3. "Marking Scheme"

  1.  **Case A Consequentialism (4 marks):** Correctly identifies punishment is unjustified because there are no future beneficial consequences (deterrence/incapacitation) to offset the harm.
  2.  **Case A Retributivism (4 marks):** Correctly identifies punishment is justified/required because past guilt creates a duty/permission independent of future outcomes.
  3.  **Case B Consequentialism (4 marks):** Correctly identifies punishment is unjustified because the net harm (riots) outweighs the benefits, despite guilt.
  4.  **Case B Retributivism (4 marks):** Identifies the tension: either punishment is required despite harm (desert is sufficient) or withheld because desert is only necessary/not absolute (catastrophe override).
  5.  **Structural Role of Desert (4 marks):** Explicitly articulates the difference: for consequentialists, desert is a side constraint (necessary but not sufficient); for retributivists, desert is the justificatory reason (often sufficient).

  4. "Where B Answers Go Wrong"

  1.  **Category Error:** Treats desert as just another positive value to be weighed in the consequentialist calculus rather than a constraint.
  2.  **Structural Blur:** Fails to distinguish between desert as a *necessary condition* versus a *sufficient reason* for punishment.
  3.  **Abstract Drift:** Defines the theories correctly but fails to apply the reasoning specifically to the details of Case A or Case B.
  4.  **Retributive Simplicity:** Assumes retributivism always demands punishment in Case B without acknowledging the "catastrophe override" nuance.
  5.  **Name-Dropping:** Relies on citing specific philosophers or theory names without explaining the underlying logical structure of desert.
