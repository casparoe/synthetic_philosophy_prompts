answer: |-
  Here is the specification for any principle claiming to arbitrate between Outcome-Supervision (OS) and Process-Supervision (PS). This document defines the constraints, case coverage, and distinction-preservation requirements such a principle must satisfy.

  ### I. Non-Negotiable Constraints (Logical & Safety Necessities)
  *These requirements must be met regardless of ideological leaning. A principle that violates these is functionally broken.*

  **1. The Verifiability Boundary Condition [NN]**
  The principle must explicitly route tasks based on the *cost of verification* relative to the *cost of generation*.
  *   **Requirement:** If the ground truth of the outcome is mechanically verifiable at low cost (e.g., code compilation, math proof check), the principle cannot mandate PS unless there is a specific safety override.
  *   **Case Coverage:** **Verifiable Outcomes (Math/Code).** In these domains, OS is the baseline. A principle demanding PS here must justify why the *steps* matter more than the *answer* (e.g., educational scaffolding vs. production utility).

  **2. The Causal Attribution Requirement [NN]**
  The principle must distinguish between correlation and causation in the feedback signal.
  *   **Requirement:** It must account for the possibility that a correct outcome was achieved via a broken process (lucky guess) or an incorrect outcome was achieved via a sound process (unlucky execution).
  *   **Distinction Preserved:** **What the supervisor can verify vs. what actually caused the result.**
  *   **Case Coverage:** **Goodhart/Reward-Hacking.** If the model learns to hack the verifier (e.g., hiding errors in code that passes tests), the principle must identify this as a failure of OS *specifically* when the verifier is incomplete.

  **3. The Deception Robustness Clause [NN]**
  The principle must evaluate the susceptibility of the supervision signal to adversarial optimization by the model.
  *   **Requirement:** It must assess whether the model can produce a "simulacrum" of the desired signal without possessing the underlying capability.
  *   **Distinction Preserved:** **Grading a trajectory vs. grading a result.**
  *   **Case Coverage:** **Processes that look good but are bad.** (e.g., Chain-of-Thought that sounds authoritative but contains circular logic or sycophancy). A principle cannot accept PS if the "process signal" is easier to fake than the "outcome signal."

  ---

  ### II. Camp Preferences (Ideological Leanings)
  *These are not logical necessities but represent the core value propositions of each side. A selection principle must acknowledge these trade-offs, even if it prioritizes one.*

  **4. The Generalization Priority [Preference: Process-First]**
  *   **Claim:** PS is superior for teaching latent reasoning structures that transfer to out-of-distribution tasks.
  *   **Requirement:** The principle must weigh **Teaching the system something** (inductive bias towards reasoning) higher than **Merely testing it** (selecting for current capability).
  *   **Trade-off:** Accepts higher supervision cost now for better sample efficiency later.

  **5. The Efficiency Priority [Preference: Outcome-First]**
  *   **Claim:** OS is superior because it is agnostic to implementation details and minimizes human bias in judging "reasoning."
  *   **Requirement:** The principle must weigh **Scalability of feedback** higher than **Granularity of feedback**.
  *   **Trade-off:** Accepts that the model might find "weird" shortcuts to the answer, provided the answer is correct.

  **6. The Human-Bias Mitigation [Preference: Outcome-First]**
  *   **Claim:** Humans are bad at judging reasoning steps (we are fooled by fluency).
  *   **Requirement:** The principle must penalize PS in domains where human evaluators have low expertise relative to the model.
  *   **Case Coverage:** **Fuzzy Outcomes ("Was this helpful?").** If the outcome is fuzzy, OS relies on human preference (RLHF), which is also biased. The principle must clarify if PS bias (judging steps) is worse than OS bias (judging vibes).

  ---

  ### III. Jointly Unsatisfiable Pairs (The Tension Frontier)
  *These are pairs of desiderata that cannot be simultaneously maximized. A selection principle must explicitly state which side of the knife it falls on for a given task.*

  **Conflict A: The Alignment-Observability Trade-off**
  *   **Desideratum 1:** "Never supervise on a signal less aligned with the true goal than the thing you actually care about." (i.e., If you care about Truth, don't optimize for Plausibility).
  *   **Desideratum 2:** "Never reward a process just because it looks good to us." (i.e., Avoid rewarding sycophancy or fluent nonsense).
  *   **The Conflict:** In **Fuzzy Outcome** cases (e.g., therapy, creative writing), the "true goal" (helpfulness) is unobservable. You *must* use a proxy.
      *   If you use the Outcome proxy (User Rating), you invite Goodharting (manipulating the user).
      *   If you use the Process proxy (Therapeutic techniques), you invite "looks good but is bad" (performative empathy).
  *   **Verdict:** You cannot satisfy both. You must choose between optimizing an imperfect outcome metric or an imperfect process metric. A principle that claims to solve this without acknowledging the loss function gap is invalid.

  **Conflict B: The Robustness-Generalization Trade-off**
  *   **Desideratum 1:** "Maximize robustness against reward hacking." (Favors PS, as it constrains *how* the answer is reached).
  *   **Desideratum 2:** "Maximize capability on tasks where the optimal path is unknown to the supervisor." (Favors OS, as PS restricts the model to human-understandable reasoning).
  *   **The Conflict:** If the model discovers a valid reasoning path that humans cannot verify or understand (alien reasoning), PS will penalize it, while OS will reward it.
  *   **Verdict:** You cannot simultaneously enforce human-interpretable safety constraints (PS) and allow for superhuman optimization strategies (OS).

  ---

  ### IV. Case Coverage Specification
  *Any proposed principle must be runnable against these four specific test cases. If the principle yields the same recommendation for all four, it is too coarse.*

  | Case Type | True Goal | Verifiability | Risk Profile | Principle Must Decide |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Formal Verification** | Correct Proof | High (Mechanical) | Low (Math doesn't lie) | **OS Default.** PS only if teaching pedagogy. |
  | **2. Subjective Helpfulness** | User Satisfaction | Low (Noisy Signal) | High (Sycophancy) | **Hybrid.** Must address how to weigh "user liked it" vs "model told truth." |
  | **3. Sycophantic Reasoning** | Truthful Analysis | Medium (Fact-checkable) | High (Persuasive Lies) | **PS Required.** Outcome (persuasive essay) is easy to fake; Process (source citation) must be checked. |
  | **4. Reward Hacking** | Task Completion | High (Surface Level) | Critical (Hidden Failure) | **OS Failure Mode.** Principle must detect when the outcome metric is decoupled from intent (e.g., deleting errors to pass tests). |

  ### V. Final Specification Requirement
  To be valid, the selection principle must output a **Weighted Ratio**, not a binary switch.
  *   It must specify: *For Task T, apply Outcome-Supervision with weight $W_o$ and Process-Supervision with weight $W_p$.*
  *   It must justify the weights based on the **Verifiability Boundary** (NN1) and the **Alignment-Observability Trade-off** (Conflict A).

  *If a principle argues for pure OS or pure PS universally, it fails the specification by collapsing the distinctions in Section I and ignoring the conflicts in Section III.*
