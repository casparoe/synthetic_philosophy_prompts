answer: |-
  Your instinct is excellent. The person in your book club is mixing accurate biographical details with a specific philosophical argument (known as an *Evolutionary Debunking Argument*) and attributing it directly to Darwin. While Darwin laid the groundwork for this argument, he didn't explicitly endorse the conclusion that morality is an "illusion."

  Here is a piece-by-piece breakdown of the claim, distinguishing between what a Darwin scholar would accept, what is a simplification, and what is historically or philosophically incorrect.

  ### Part 1: Morality and Conscience
  **The Claim:** *"In the Descent of Man, Darwin says conscience is just whichever feelings natural selection happened to reward in our ancestors — we call things right because acting that way paid off — so he's basically committed to our moral judgements being adaptive illusions rather than truths."*

  *   **What a Scholar Accepts (The Genealogy):**
      It is true that in *The Descent of Man* (1871), Darwin attempts to explain the *origin* of morality naturalistically. He argues that moral instincts arise from social instincts (sympathy, desire for approval) combined with high intellect and memory. He suggests that tribes with more courageous, sympathetic, or faithful members would flourish over other tribes. So, yes, he argues moral feelings were "rewarded" by survival success.
  *   **The Simplification (The Mechanism):**
      The phrase "paid off" suggests individual selfishness. Darwin actually leaned heavily on what we now call **group selection**. He argued that individuals might sacrifice themselves (which doesn't "pay off" for the individual), but the *tribe* survives because of that sacrifice. He viewed conscience as the conflict between a fleeting social impulse and a lasting instinct for self-preservation, mediated by reason.
  *   **What is Wrong/Sneaky (The Philosophy):**
      This is the leap from **genealogy** (where it came from) to **justification** (whether it's true). Darwin described *how* we got moral feelings; he did not explicitly conclude that those feelings are *false*.
      However, there is a nuance here: Darwin *did* express a worry that if human minds evolved from animals, we might not be able to trust our own convictions (including religious or moral ones). In a letter to William Graham, he wrote of a "horrid doubt" about whether the convictions of a monkey's mind are of any value.
      *   **Verdict:** Darwin provided the *materials* for the "adaptive illusion" argument, but calling it Darwin's own committed conclusion is an overstatement. He tended to treat morality as a mark of human advancement, not merely a trick.

  ### Part 2: Religion and the Wasps
  **The Claim:** *"Evolution explained away design, and once he'd seen the wasps that lay their eggs inside living caterpillars, he concluded a benevolent God was impossible and became an atheist."*

  *   **What a Scholar Accepts (The Wasps):**
      This refers to the Ichneumonidae wasps. Darwin famously wrote to the botanist Asa Gray: "I cannot persuade myself that a beneficent & omnipotent God would have designedly created the Ichneumonidæ with the express intention of their feeding within the living bodies of Caterpillars." This problem of pain (theodicy) was a major factor in his loss of Christian faith.
  *   **The Simplification (Explaining Design):**
      It is true that Natural Selection provided a mechanism for complex adaptation without needing a divine designer for every specific feature. This undermined the "Argument from Design" (Paley's Watchmaker), which was central to Darwin's early faith.
  *   **What is Wrong (The "Atheist" Label):**
      Darwin **did not become an atheist.** In his autobiography, he explicitly states that he never denied the existence of God in the strict sense. He moved from orthodox Christianity → Theism (belief in a creator who doesn't intervene) → **Agnosticism**.
      He coined the term "Agnostic" (or rather, adopted Huxley's term) to describe his later view: that the ultimate origin of things is beyond the reach of the human mind. He left the door open for a "First Cause," even if he rejected a benevolent, intervening Christian God.
      *   **Verdict:** The emotional trajectory is right (loss of faith due to suffering/nature's cruelty), but the label "atheist" is historically incorrect.

  ### Part 3: The Conclusion
  **The Claim:** *"On Darwin's own theory, our objection to cruelty in nature is just inherited taste."*

  **Does this follow?**
  This is the crux of the philosophical debate. Your book club friend is arguing for **Moral Anti-Realism** (specifically, an Error Theory).

  1.  **The Genetic Fallacy:** Just because we can explain the *origin* of a belief (evolution) doesn't prove the belief is *false*. We can explain the origin of our belief in mathematics or logic via evolution (pattern recognition helped us survive), but that doesn't mean 2+2=4 is an "illusion."
  2.  **Darwin's Own View:** Darwin seemed to believe in moral *progress*. He wrote about the expansion of the "moral circle" (from tribe to nation, to all races, to animals). If morality were just a fixed "adaptive illusion" for tribal survival, we wouldn't see him championing the abolition of slavery or kindness to animals as *improvements*. He treated them as real advancements.
  3.  **The "Is-Ought" Gap:** Darwin described what *is* (we have these instincts). He did not prescribe what *ought* to be. However, he often implied that following our higher social instincts *was* the right path.
  4.  **The Counter-Argument:** Many modern philosophers argue that evolution might have shaped our *capacity* for morality, but not the specific *content* of moral truth. If "cruelty is wrong" is an objective truth, evolution could have selected us to perceive it because cooperative societies survive better. The origin is adaptive, but the truth value remains intact.

  ### Summary for Your Book Club
  If you want to push back gently but firmly, here is the roadmap:

  1.  **On Religion:** "Actually, Darwin scholars point out he never called himself an atheist. He settled on 'Agnostic.' He thought the existence of a First Cause was unknowable, not disproven. The wasp example broke his belief in a *benevolent* designer, not necessarily a creator."
  2.  **On Morality:** "Darwin explained the *origin* of conscience, but he didn't explicitly say it was an *illusion.* That's a modern philosophical move called an 'Evolutionary Debunking Argument.' Darwin himself seemed to think moral progress (like treating animals better) was real, not just a trick of the genes."
  3.  **On the Conclusion:** "Even if our moral instincts are adaptive, that doesn't mean they are false. It could be that 'cooperation is good' is both evolutionarily useful *and* objectively true. Darwin gives us the history of morality, but he doesn't necessarily settle the truth of it."

  **Bottom Line:** Your friend is right that Darwin naturalized morality and religion (made them subjects of biology rather than theology). But he is wrong to claim Darwin proved them to be *false*. Darwin opened the door to that possibility, but he didn't walk all the way through it himself.
