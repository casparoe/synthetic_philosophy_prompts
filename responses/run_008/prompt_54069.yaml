      *   *Quote Check:* Recall the "horrid doubt" quote regarding the mind of a monkey. This is relevant to the "illusion" point. Darwin *did* worry about the reliability of human conviction if our minds evolved from animals. This adds weight to the book club guy's point, but needs nuance.
