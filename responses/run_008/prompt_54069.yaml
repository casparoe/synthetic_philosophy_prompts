prompt: |-
  A guy in my book club gave me Darwin's take on morality and religion like this: "In the Descent of Man, Darwin says conscience is just whichever feelings natural selection happened to reward in our ancestors — we call things right because acting that way paid off — so he's basically commited to our moral judgements being adaptive illusions rather than truths. Same with religion: evolution explained away design, and once he'd seen the wasps that lay their eggs inside living caterpillars, he concluded a benevolent God was impossible and became an atheist." My instinct is that the second half is roughly right and the first half is doing something sneaky, but I don't know the Descent well enough to say where. Can you go through it piece by piece: what a Darwin scholar would accept, what's a simplification a popularizer would make, and what's just wrong? And does his conclusion — that on Darwin's own theory, our objection to cruelty in nature is just inherited taste — actually follow from whichever parts turn out to be true?
