      From: [Name]
      Date: [Date]
      Subject: Recommendation on Voting Franchise

      **Recommendation**
      Extend voting rights to subletters only. Reject votes for wardens, the waiting list, and external stakeholders.

      **The Principle: The Rule-Subject Test**
      Our franchise should follow the "all-subjected principle": anyone bound by the co-op's coercive authority deserves a say in its exercise. This distinguishes between those *affected by* our decisions and those *subject to* our rules.

      Subletters live under our bylaws, pay our rents, and face our disciplinary procedures. They are politically subject to Hillcrest's governance. Wardens are employees; their relationship is contractual, managed through HR, not democratic membership. Waiting list applicants are future stakeholders, but they are not currently subject to our authority. External neighbors and suppliers are causally affected by our choices, but we hold no authority over them.

      **Why Not the Others?**
      Expanding votes to the waiting list confuses *interest* with *authority*. While future rents matter to them, they cannot enforce rules today. Giving wardens votes conflates *employment* with *membership*. Employees have labor rights and management channels; mixing these undermines both workplace hierarchy and member democracy.

      **The Strongest Counter-Argument**
      The case against subletters rests on *commitment*. Critics argue voting requires a shared long-term fate. Subletters stay for months; members stay for years. A transient voter might support low maintenance fees to reduce short-term rent, ignoring long-term capital decay. This is a valid concern about incentive alignment. However, denying them votes creates a taxed-without-representation scenario. They bear the immediate burden of rules they cannot shape. The risk of short-termism is better managed through quorum requirements than disenfranchisement.

      **Addressing the Slippery Slope**
      The fear that we must vote for the scaffolding supplier in Ascot relies on equating "impact" with "subjection." Yes, our budget affects his prices. But we cannot fine him, evict him, or enforce house rules upon him. The boundary of the co-op is not where our *influence* ends, but where our *authority* ends. If we vote based on causal impact, there is no line. If we vote based on subjection to rules, the line is clear: it stops at the tenancy agreement.

      **Conclusion**
      We should amend the bylaws to grant voting membership to subletters. This honors the principle that legitimacy flows from consent to authority. It draws a defensible line against infinite expansion while correcting the current democratic deficit within our walls.

