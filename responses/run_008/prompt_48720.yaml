      *   *Principle:* "Subject to Authority" vs. "Affected Interests."
      *   If the principle is "those subject to the coercive power of the rules," subletters fit best (same rules, discipline). Wardens are employees (contractual hierarchy vs. membership democracy). Waiting list are future members (not yet subject to rules).
      *   *Decision:* Recommend voting rights for Subletters only.
