answer: |-
  The concept you are describing is standardly identified in contemporary epistemology as **Non-Doxastic Foundationalism**.

  While you noted that "the Given" feels like the wrong label because it is often associated with the *critique* of this move (specifically Wilfrid Sellars' "Myth of the Given"), the positive doctrine that justification terminates in non-belief states is historically and technically referred to as an appeal to **The Given**. However, **Non-Doxastic Foundationalism** is the more precise, structural label used in current taxonomy to distinguish this view from its rivals.

  Below is the carving you requested. It defines the concept, distinguishes it from the nearby views you mentioned, and explains how it accommodates your boundary cases (perception, intuition, and pain).

  ### 1. The Concept: Non-Doxastic Foundationalism

  **Definition:** Non-Doxastic Foundationalism is the epistemological structure according to which the regress of justification is terminated by mental states that lack propositional content (or at least lack doxastic commitment), such as perceptual experiences, sensations, or intuitions.

  **The Structural Move:**
  In classical logic, a chain of justification looks like this: *Belief A is justified by Belief B, which is justified by Belief C...*
  *   **Classical Foundationalism** stops the chain at a *Basic Belief* (a belief that justifies itself or requires no further justification).
  *   **Non-Doxastic Foundationalism** stops the chain by exiting the category of belief entirely. The chain looks like this: *Belief A is justified by Belief B, which is justified by Experience E.*

  This fits your description perfectly: it denies the trilemma not by finding a magical belief, but by asserting that the "justifier" need not be a belief. It relies on a **category shift** from the doxastic (believing) to the non-doxastic (experiencing).

  ### 2. Distinctions from Nearby Concepts

  To ensure this term captures the specific maneuver you have in mind, we must distinguish it from the three alternatives you raised.

  **A. Versus Classical (Doxastic) Foundationalism**
  *   **The Difference:** Classical foundationalism (e.g., Descartes, Locke) holds that the foundation consists of *basic beliefs* (e.g., "I seem to see red" or "2+2=4" held as a belief). Non-doxastic foundationalism holds that the foundation consists of *experiences* (e.g., the visual sensation of red, the grasp of the mathematical relation).
  *   **Why your move is distinct:** In your example, the chain stops at *seeing the mug*, not the *belief that I see the mug*. Classical foundationalism requires the latter; Non-Doxastic Foundationalism requires only the former.

  **B. Versus Process Reliabilism**
  *   **The Difference:** Reliabilism (e.g., Alvin Goldman) is an externalist view. It argues a belief is justified if produced by a reliable cognitive process, regardless of whether the subject has access to a terminating state in their mind.
  *   **Why your move is distinct:** Your description implies an internalist structure ("*my* seeing," "*my* pain"). The subject terminates the regress by appealing to a current conscious state, not by appealing to the historical reliability of the mechanism that produced the state. Non-Doxastic Foundationalism is typically internalist; Reliabilism is typically externalist.

  **C. Versus "The Given" (Clarification)**
  *   **The Nuance:** You mentioned "the Given" feels like the wrong term because it is associated with the *worry* about whether non-beliefs can justify. Historically, however, "The Given" is the name of the *posited terminator*. Sellars attacked the "Myth of the Given," but the positive position is simply "Acceptance of the Given."
  *   **Why Non-Doxastic Foundationalism is better:** Because "The Given" is historically loaded with mid-20th-century debates about sense-data, **Non-Doxastic Foundationalism** is the cleaner, structural term for the maneuver itself without committing to specific metaphysical claims about sense-data.

  ### 3. Accommodating Your Boundary Cases

  You described a second version of the move involving mathematical intuition and pain. Non-Doxastic Foundationalism covers these under the umbrella of **Non-Doxastic Seemings** or **Presentations**.

  *   **Perceptual Episodes:** These are treated as *sensory experiences*. They have representational content (they present the world as being a certain way) but do not assert truth.
  *   **Mathematical Intuition:** These are treated as *intellectual seemings*. Just as a visual experience presents a mug as present, an intellectual experience presents a lemma as necessary. The justification comes from the *seeming*, not a belief about the seeming.
  *   **Pain:** This is treated as a *phenomenal state*. The belief "I am in pain" is justified by the pain itself. The pain is not a belief; it is a raw feel that warrants the belief.

  All three fit the definition because they are **conscious, justificatory states that are not themselves judgments.**

  ### 4. The Standard Objection

  You correctly identified the standard objection. In the literature, this is known as **The Sellarsian Dilemma** (or the Problem of the Given).

  *   **The Horns:** Either the non-doxastic state has propositional content (in which case it is effectively a belief, collapsing into Classical Foundationalism), or it lacks propositional content (in which case it cannot logically entail or support a belief, rendering it epistemically inert).
  *   **The Defender's Reply:** Proponents of Non-Doxastic Foundationalism (such as Michael Huemer under the label **Phenomenal Conservatism**) argue that experiences *do* have propositional content ("It seems to me that P") without requiring doxastic commitment ("I believe that P"). They argue the logical gap is bridged by a principle of *prima facie* justification: "If it seems to S that P, then S has some justification for believing P."

  ### 5. Final Verdict and Definition

  There is no need to coin a new term, as **Non-Doxastic Foundationalism** is the established technical term for exactly the structural move you described. However, to satisfy your request for a "carving" that settles the boundary cases and distinguishes the maneuver from its rivals, I offer the following precise definition:

  > **Non-Doxastic Foundationalism**
  >
  > An epistemological structure in which the regress of doxastic justification is terminated not by a self-justifying belief, but by a **conscious, non-doxastic mental state** (such as a perceptual experience, a sensation, or an intellectual seeming).
  >
  > **Boundary Conditions:**
  > 1.  **Category Shift:** The terminating item must be of a different metaphysical category than the item it justifies (e.g., an *experience* justifies a *belief*).
  > 2.  **Internal Availability:** The terminating state must be a conscious episode or standing state accessible to the subject (distinguishing it from Process Reliabilism).
  > 3.  **Non-Assertoric:** The terminating state presents content without asserting its truth (distinguishing it from Classical Foundationalism's "Basic Beliefs").

  This term captures the maneuver of exiting the "space of beliefs" to stop the regress, accommodates your examples of perception, intuition, and pain as varieties of non-doxastic states, and clearly demarcates the view from both self-justifying foundationalism and externalist reliabilism.
