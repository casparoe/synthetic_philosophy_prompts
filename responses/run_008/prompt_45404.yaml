answer: |-
  Your intuition that the podcast summary was too tidy is correct, and while the host identified a genuine and famous problem in philosophy of science, her presentation of it slides from a technical challenge into a caricature that misrepresents the current state of Bayesian epistemology. The issue she is describing is formally known as the Problem of Old Evidence, originally articulated by Clark Glymour in the nineteen eighties, and it is absolutely a standard topic in any graduate seminar on confirmation theory. She is right that if you treat Bayes' theorem strictly as a psychological rule for how a specific agent changes their mind at a specific moment in time, known evidence creates a mathematical flatline. If an agent already assigns a probability of one to a piece of evidence, conditioning on that evidence cannot change the probability of any hypothesis, because you cannot learn something you are already certain is true. However, where she goes off the rails is in assuming that this simple formulation is the only game in town, that Bayesians are unaware of the issue, and that the inability of the simple model to handle this case constitutes a refutation of the entire probabilistic approach to science.

  To address your specific worry about whether all Bayesians agree that the probability of known evidence is literally one, the answer is no, though there is a divide here that often gets glossed over in popular explanations. Strict subjective Bayesians who adhere to a principle of logical omniscience might assign a probability of one to any proposition that is known to be true, including past observations. However, many working Bayesians and philosophers of science reject the idea that empirical evidence ever truly reaches probability one, arguing that all observation is theory-laden and fallible, so there is always some non-zero uncertainty reserved for the possibility that the measurement was wrong or the record is flawed. Even among those who accept that old evidence has a probability of one, there is a crucial distinction between psychological updating and logical support. Bayes' theorem is often used not to model the history of a scientist's mental state, but to model the logical relationship between a theory and the evidence. When we say General Relativity is confirmed by Mercury's perihelion, we are not necessarily saying Einstein personally learned something new in nineteen fifteen, but rather that the theory stands in a specific probabilistic relationship to the data. The podcaster conflates the history of discovery with the context of justification, treating Bayesianism as solely a model of the former when its proponents often intend it as a model of the latter.

  Regarding her claim that Bayesians simply pretend they do not know what they know, this is a cynical description of a legitimate methodological tool known as the counterfactual or historical reconstruction approach. The idea is not to deceive oneself but to isolate the evidential support by asking what your credence in the theory would have been had you not known the evidence beforehand. This is not considered faking it in the literature; it is considered a way to strip away historical accident to see the structural support the evidence provides the theory. If you want to know if the data supports the hypothesis, you have to compare the hypothesis against a background where the data wasn't already assumed to be a fixed fact. There are other solutions as well that do not require this counterfactual move. For instance, some Bayesians argue that the new evidence is not the orbit of Mercury itself, which was indeed old, but the new fact that General Relativity entails the orbit of Mercury. The proposition changes from Mercury moves this way to Theory T predicts Mercury moves this way. Since Einstein did not know his theory would succeed until he did the math, that specific connection was new evidence, and it can be updated on normally without assigning probability one to the planetary data itself. This allows the Bayesian to capture the intuition that the explanation was the breakthrough, not the data point.

  Her leap to the conclusion that confirmation cannot be a probabilistic notion and that the Bayesian program is refuted is where the argument becomes most vulnerable to criticism. In the philosophy of science, a problem with an idealized model is rarely treated as a refutation of the entire paradigm, especially when the model is explicitly normative rather than descriptive. Saying Bayesianism is refuted by old evidence is somewhat like saying Newtonian physics was refuted because it could not explain the precession of Mercury, which is ironic given that Mercury is the very example being used. Just as Newtonian physics was subsumed into a broader framework rather than tossed in the trash, Bayesian confirmation theory is generally viewed as a robust framework that requires refinement at the edges to handle logical omniscience and old evidence. Most philosophers of science do not accept her conclusion that confirmation isn't probabilistic; rather, they accept that the simple ratio of posteriors to priors is not the only measure of confirmation. Many propose using likelihood ratios instead, which compare how well competing hypotheses predict the evidence, regardless of whether the evidence was known beforehand. Under this view, General Relativity is confirmed not because our belief in it went up upon seeing Mercury's orbit, but because General Relativity makes Mercury's orbit much more probable than Newtonian mechanics does, even if we already knew the orbit.

  If you are writing this for a general audience, the most accurate way to frame this is to acknowledge that the Problem of Old Evidence is a serious and unsolved challenge in its strongest forms, but it is not the death knell the podcaster suggests. It highlights the difference between Bayesianism as a model of human learning versus Bayesianism as a logic of scientific justification. The host was right to point out that the simple story of updating on new data does not cover the most famous historical cases of theory confirmation, and that is a significant gap for anyone claiming Bayesianism is the complete logic of science. However, she was wrong to imply that Bayesians are unaware of this, that their solutions are merely deceptive tricks, or that the existence of the problem forces us to abandon probabilistic confirmation entirely. The consensus in the field is that Bayesianism remains the best formal toolkit we have for thinking about evidence, provided we understand its limitations and use the more sophisticated variants of the theory that have been developed specifically to handle cases like Einstein and Mercury. You can safely report that this is a known tension that keeps philosophers employed, rather than a secret scandal that undermines the rationality movement's foundational math.
