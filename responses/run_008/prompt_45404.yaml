  I'm a science and ideas journalist and I'm working on a piece about whether Bayesian reasoning is really the great unifier that some people in the rationality scene say it is. For background I listened to a podcast episode (hosted by a philosophy PhD, she's usually pretty careful) where she explained the so-called problem of old evidence, and I want to make sure I have this right before I put anything like it in my article. Roughly what she said was: Bayes' theorem tells you how to update on new evidence, but the trouble is that most of the great confirmations in science involved evidence that was already sitting there before the theory came along. Mercury's perihelion had been measured decades before general relativity, and it was exactly that old anomaly that everyone took to be such a stunning confirmation of Einstein. But for a Bayesian, if you already know E, then your probability for E is one, so plugging it into the theorem gives you no movement at all in your probability for the theory — the update ratio is one to one. So the Bayesian, she concluded, has literally nothing to say about the single most celebrated confirmation in the history of physics, which is a pretty serious gap for a view that advertises itself as the logic of science. Her takeaway was that this proves confirmation can't be a probabilistic notion at all and that the whole Bayesian program is basically refuted unless you fake it by pretending you don't know what you know, which she said most Bayesians quietly do.

  It sounded convincing but also a bit too tidy, like the kind of thing that gets sharpened into a gotcha for podcast purposes. So my question: is this a fair summary? Where is it right, where is it sloppy or subtly off? I'm especially unsure about a few things and would love your read on them — whether all Bayesians agree the probability of known evidence is literally one, whether anyone would deny that the anomaly's history as a known problem is doing work here, whether "pretend you don't know it" is really the only or even the standard reply, and whether anything she said actually supports the leap to the conclusion that confirmation isn't probabilistic and the program is refuted. Please go bit by bit through her account, tell me what a working Bayesian would accept, what they'd push back on, and what's just wrong, and then tell me if her final conclusion follows from the parts that survive. And one practical request: could you keep it as continuous prose, no headings or bullet points or bold, just flowing paragraphs like a long email? If I lift any of this into my draft it'll be in prose anyway, and I find lists easier to skim but harder to actually think with. Also feel free to be blunt about the bits where she's overstating — I'd rather be corrected now than by a fact checker later.
