answer: |-
  Your friend is half-right. The reference class problem is real: there is no mathematically "correct" class. However, they are wrong that this makes forecasting *arbitrary*. It makes it *judgmental*. The goal isn't to eliminate judgment, but to make the judgment explicit, consistent, and auditable.

  In software engineering, the standard approach to this is **Reference Class Forecasting** (pioneered by Bent Flyvbjerg for infrastructure, adapted by Kahneman/Lovallo for business). The core principle is: **Specificity trades off against Stability.** A class that is very specific to your project (e.g., "Rewrites by Lead Alice") has high relevance but low statistical stability (small sample size). A class that is broad (e.g., "All Software Projects") has high stability but low relevance.

  Here is a procedure designed to navigate that trade-off in an afternoon.

  ### The Reference Class Triage Procedure

  **Time required:** 2–4 hours (mostly data gathering).
  **Tools:** Spreadsheet, access to past project records (Jira, financials, post-mortems).

  #### Step 1: Define the Target Variable
  **Question:** What exactly are we predicting?
  **Defensible Answer:** A single, measurable unit. "Duration in months" or "Cost in dollars." Do not predict "complexity" or "effort."
  **Stop Condition:** If you cannot define the unit consistently across past projects (e.g., "months" meant calendar time for Project A but person-months for Project B), stop. You cannot forecast until your history is normalized.

  #### Step 2: Generate Candidate Classes
  **Question:** What features define this project?
  **Defensible Answer:** List 5–10 attributes. Examples: *Domain (Payments), Type (Rewrite), Tech Stack (Java), Team (Internal), Lead (Alice), Vendor (None), Regulatory (PCI).*
  **Stop Condition:** None. Cast a wide net.

  #### Step 3: The Causal Relevance Filter
  **Question:** For each attribute, do we have a *reason* to believe it changes the outcome distribution, or is it just a label?
  **Defensible Answer:** You must articulate the mechanism.
  *   *Good:* "Lead experience matters because Alice knows the legacy schema."
  *   *Bad:* "Project Name starts with 'P'."
  *   *Action:* Discard attributes where you cannot name the causal mechanism. This reduces the infinite classes to a manageable few.
  **Confidence:** **Medium.** This is where bias enters. You might think a factor matters when it doesn't, or vice versa.

  #### Step 4: The Stability Threshold (The "N-Rule")
  **Question:** How many past projects fit this class?
  **Defensible Answer:**
  *   **N ≥ 10:** Statistically stable. You can use the mean and standard deviation.
  *   **5 ≤ N < 10:** Usable median. Do not use the mean (outliers skew it). Report the range (min/max).
  *   **N < 5:** Unstable. Treat as anecdotal evidence, not a distribution.
  **Stop Condition:** If *no* class passes N ≥ 5 after filtering, you have insufficient data. Proceed to Step 6 immediately.

  #### Step 5: Conflict Resolution (The "Specificity Ladder")
  **Question:** If Class A (Specific, N=6) says 5 months and Class B (Broad, N=50) says 9 months, which do I pick?
  **Defensible Answer:** Use the **Specificity Ladder**.
  1.  Start with the most specific class that meets the N ≥ 5 threshold.
  2.  Check if the broader class's range completely encompasses the specific class's range.
  3.  If they disagree significantly (non-overlapping medians), **default to the broader class** but note the specific class as a risk factor.
  *Why?* Small samples lie. A specific class with N=6 is often just noise. A broad class with N=50 is reality. Only trust the specific class if the causal link (Step 3) is undeniable *and* the data is consistent.
  **Confidence:** **High.** This is standard statistical hygiene.

  #### Step 6: The Value Judgment Hand-off
  **Question:** The data gives a distribution (e.g., "50% chance of 9 months, 90% chance of 12 months"). Which number do I commit to?
  **Defensible Answer:** **This is not a math problem.** This is a risk appetite problem.
  *   *Action:* Present the distribution to stakeholders. "Based on history, there is a 30% chance this overruns 9 months."
  *   *Hand-off:* Ask them: "Do you want a 50% confidence estimate (aggressive) or a 90% confidence estimate (conservative)?"
  *   *Philosophy Limit:* Statistics tells you the odds; it cannot tell you how much pain an overrun causes. That is a business decision.

  ---

  ### Running the Procedure on Your Three Cases

  #### Case 1: Straightforward CRUD App (Known Tech, Internal Team)
  *   **Step 1:** Duration (Months).
  *   **Step 2:** Attributes: CRUD, Internal, Known Stack, Same Team.
  *   **Step 3:** "Known Stack" and "Same Team" are causally relevant (velocity is established).
  *   **Step 4:**
      *   Class "Same Team + Known Stack": N = 12 projects. (Stable).
      *   Class "All Company Projects": N = 100 projects. (Stable).
  *   **Step 5:** Specific class median = 4 months. Broad class median = 6 months. Ranges overlap significantly. **Pick Specific Class.**
  *   **Step 6:** Distribution is tight.
  *   **Result:** **High Confidence.** You can estimate 4–5 months. The data supports specificity here.
  *   **Why:** The causal links are strong and the sample size is sufficient.

  #### Case 2: Legacy Migration (New Tech, Internal Team)
  *   **Step 1:** Duration (Months).
  *   **Step 2:** Attributes: Migration, New Tech, Internal.
  *   **Step 3:** "New Tech" is highly relevant (learning curve). "Migration" is relevant (hidden debt).
  *   **Step 4:**
      *   Class "Migration + New Tech": N = 2 projects. (Unstable).
      *   Class "All Migrations": N = 8 projects. (Usable Median).
      *   Class "All Projects": N = 100 projects. (Stable).
  *   **Step 5:** Specific class (N=2) suggests 5 months. Broad "All Migrations" (N=8) suggests 10 months. **Discard Specific.** The N=2 is noise. The N=8 is weak but better.
  *   **Step 6:** The N=8 distribution is likely wide (e.g., 6 to 14 months).
  *   **Result:** **Low Confidence.** You must report: "History suggests 6–14 months. We have no data on this specific tech stack, so we are betting on the 'Migration' penalty, not the 'Tech' speed."
  *   **Why:** You lack data on the most causal factor (the new tech). You are forced to use a proxy class (Migrations generally), which introduces variance.

  #### Case 3: External Vendor (Only 2 Data Points)
  *   **Step 1:** Duration (Months).
  *   **Step 2:** Attributes: Vendor X, External, Payments.
  *   **Step 3:** "Vendor X" is relevant (their process matters). "External" is relevant (communication overhead).
  *   **Step 4:**
      *   Class "Vendor X": N = 2. (Unstable).
      *   Class "All External Vendors": N = 5. (Borderline).
      *   Class "All Projects": N = 100. (Stable).
  *   **Step 5:** N=2 is useless. N=5 is risky. **Default to "All Projects" (N=100) adjusted for "External" risk.**
  *   **Step 6:** **Hand-off.** The data cannot settle this.
  *   **Result:** **No Confidence in Data.** You must say: "We have insufficient history with this vendor to use reference class forecasting. We should estimate based on *contractual milestones* and *phase-gating*, not historical velocity."
  *   **Why:** N=2 is not a class; it's an anecdote. Using it gives a false sense of precision. The procedure correctly forces you to admit ignorance.

  ---

  ### My Confidence in This Procedure

  You asked me to trust a checklist, so I owe you transparency on where this checklist comes from and where it might break.

  **Overall Confidence: High (85%)**
  This procedure is a synthesis of **Reference Class Forecasting** (Flyvbjerg), **Outside View planning** (Kahneman), and basic **Frequentist Statistics** (Sample Size thresholds). It is the industry standard for moving from "gut feel" to "defensible estimate." It will stop you from lying with statistics.

  **Confidence by Step:**
  1.  **Define Variable:** **95%**. If you can't measure it, you can't manage it.
  2.  **Generate Classes:** **90%**. Easy brainstorming.
  3.  **Causal Relevance:** **60%**. (See "Weakest Step" below).
  4.  **Stability Threshold:** **80%**. The N=5 rule is a heuristic, not a law of physics, but it's a safe one.
  5.  **Conflict Resolution:** **85%**. Prioritizing stability over specificity when N is low is statistically sound.
  6.  **Value Judgment:** **95%**. Distinguishing between *probability* (stats) and *risk tolerance* (business) is philosophically robust.

  **The Weakest Step: Step 3 (Causal Relevance Filter)**
  This is where the philosophy runs out and human bias runs in.
  *   **The Problem:** You decide which attributes "cause" variance. You might assume "Lead Experience" matters, but your data might show "Requirements Stability" matters 10x more. If you filter based on the wrong causal assumption, you select the wrong reference class.
  *   **The Risk:** You might discard a class with N=20 because you don't *think* the attribute matters, and keep a class with N=6 because you *feel* it does.
  *   **Mitigation:** If you have enough data (N > 30), run a regression to see what actually correlates. If you don't (which is likely), acknowledge in your report: *"We are weighting this class based on the assumption that X drives delays. If Y is the actual driver, this estimate is invalid."*

  ### Final Advice

  Your friend said your forecasts are arbitrary. They aren't arbitrary if you document *why* you picked the class.
  *   **Arbitrary:** "It feels like 9 months."
  *   **Defensible:** "We used the 'All Migrations' class (N=8) because the 'New Tech' class had insufficient data (N=2). This carries a risk that the new tech is slower than average."

  The goal isn't to be right. The goal is to be **less wrong than the alternative**, and to know exactly why you might be wrong. This procedure does that.
