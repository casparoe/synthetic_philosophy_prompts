prompt: |-
  I'm the estimation person at a mid-size software company -- whenever a team is about to commit to a project, they come ask me how long these things usually take, and my honest answer depends entirely on which past projects count as "these things." Compare the new payments rewrite to every payments project we've done and the median is about 9 months; compare it to projects run by the same lead, or to rewrites generally, or to projects with similar headcount, and I get numbers anywhere from 5 to 18 months. Nobody ever told me how to pick, so I pick whichever comparison feels right and hope nobody asks. A friend who reads philosophy said this is called the reference class problem and that there is basically no principled way to choose the comparison class, so all my forecasts are arbitrary -- which was not comforting.

  Can you turn whatever philosophy and statistics actually know about this into a procedure I could run in an afternoon on each new project? Things like: the questions to ask in order, what counts as a defensible answer to each one, when the procedure should stop and say the data can't settle it, and where it has to hand the decision back to me because the choice is a value judgment dressed up as a calculation. Then run it on three realistic cases for me: a straightforward CRUD app on tech the team already knows; a migration off a legacy system nobody here has done before; and a project staffed by an external vendor we only have two data points on. I suspect the procedure will tell me to be a lot less confident then I currently am -- fine, tell me that anyway.

  Please answer in American English. And since you're asking me to trust a checklist: say how confident you actually are in each part of the procedure, and single out the one step you're least sure of. I'd rather know exactly where the philosophy runs out than get a clean-looking checklist that's secretly just my current vibes with extra steps.
reasoning: |-
