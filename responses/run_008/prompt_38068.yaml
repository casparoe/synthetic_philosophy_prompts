answer: |-
  Your diagnosis is remarkably sharp, and you have put your finger on precisely why this debate simmered for a millennium without reaching a boil-over resolution. However, to give you a precise answer, I must first make a small but crucial historical correction regarding the alignment of the schools, as this actually strengthens your argument about the confusion.

  Traditionally, it is the **Mīmāṃsakas** who argue for *svataḥ prāmāṇya* (intrinsic validity) and *parataḥ aprāmāṇya* (extrinsic invalidity). The **Nyāya** school, conversely, is the standard-bearer for *parataḥ prāmāṇya* (extrinsic validity) for *both* truth and falsity. Nyāya argues that validity depends on special merits (*guṇas*) in the causal chain, just as error depends on defects (*doṣas*).

  However, your intuition that Nyāya often functions with a 'hybrid' or pragmatic presumption of validity is astute. In practice, Nyāya admits we do not verify every cognition before acting, yet ontologically, they insist validity is extrinsic. This very slippage supports your theory that the debate is partly verbal.

  ### Is it Verbal or Substantive?

  Your working theory that the camps are talking past one another is largely correct, but it is not *merely* verbal. It is a case of verbal confusion masking a substantive disagreement about **epistemic default**.

  **1. The Verbal Confusion (Genesis vs. Certification)**
  You are quite right that the *svataḥ* camp (Mīmāṃsā) is often speaking about the *phenomenology* of cognition: when I see a pot, I do not simultaneously wonder, "Is this a pot?" The cognition presents itself as true. To demand a second cognition to validate the first invites an infinite regress (*anavasthā*).
  The *parataḥ* camp (Buddhists and Nyāya), particularly Dharmakīrti, is speaking about the *ontological status* of the cognition: just because a cognition *feels* true does not mean it corresponds to reality. For them, *pramāṇa* status is a label earned only after the fact, via *arthakriyā* (successful action) or a subsequent determining cognition.

  When Nyāya argues that "we only ascertain causes of error, never causes of validity," they are making a pragmatic point that sounds like *svataḥ*, but they maintain the *parataḥ* ontological stance. This ambiguity allowed centuries of scholars to accuse one another of collapsing into the opponent's position, precisely because the distinction between "how a cognition arises" (*utpatti*) and "how we know it is valid" (*jñāpti*) was not always rigorously maintained.

  **2. The Substantive Disagreement (Internalism vs. Externalism)**
  Beneath the verbal fog lies a genuine substantive clash regarding **accessible justification**.
  *   **The Mīmāṃsā Intuition:** Justification must be internal and immediate. If validity were extrinsic, we could never act. This is a form of epistemic internalism rooted in the necessity of ritual efficacy. If one cannot trust the Veda or perception immediately, the entire soteriological programme collapses.
  *   **The Buddhist Intuition:** Justification is externalist and causal. A cognition is a mental event; its truth is a relation to an object that must be tested. This aligns with the soteriological goal of *nirvāṇa*: one must dismantle the illusion of inherent existence, including the illusion that our cognitions are inherently trustworthy.

  So, while they talk past each other on the mechanics of validation, they disagree fundamentally on whether trust is the **default state** of the knower (Mīmāṃsā/Nyāya pragmatism) or a **rewarded state** achieved through scrutiny (Buddhism).

  ### What Could Have Ended the Debate?

  Given this diagnosis, could anything have resolved the deadlock?

  **1. A Distinction: *Utpatti* vs. *Jñāpti***
  The Navya-Nyāya logicians (like Gaṅgeśa) actually attempted this. They distinguished between the *generation* of validity and the *awareness* of validity. They argued validity is generated extrinsically (*parataḥ utpatti*), but we might become aware of it intrinsically in certain cases.
  *   **Why it failed:** The Buddhists rejected the premise that "validity" is a property that needs generating at all. For Dharmakīrti, a cognition is only a *pramāṇa* if it is non-deceptive. To separate the cognition from its success is to reify a property that does not exist. The distinction clarified the terms but did not bridge the metaphysical gap.

  **2. A Reformulation: The Pragmatic Turn**
  A shift towards a purely pragmatic definition of truth could have bridged the divide. Since the Buddhists already utilise *arthakriyā* (causal efficacy) as the test of reality, and the Nyāya admit we act on cognitions without verification, a shared pragmatic ground was available.
  *   **Why it failed:** Soteriology. For the Mīmāṃsakas, the Veda is valid *by its very nature*, not because it "works" in a pragmatic sense. To reduce validity to utility undermines the intrinsic authority of the scriptures. For the Buddhists, "working" in the conventional world (*saṃvṛti-satya*) is precisely the trap from which one must escape. They could not agree on *what* the cognition was supposed to achieve.

  **3. A Killer Case: The Silver-Shell Illusion**
  The standard test case is the misapprehension of a shell as silver (*śukti-rajata*).
  *   **Mīmāṃsā:** The cognition "This is silver" is valid *at the time of occurrence* (otherwise, why did you reach for it?), but is later cancelled by a defeater.
  *   **Buddhism/Nyāya:** The cognition was never valid; it was erroneous from the start, proven by the failure to pick up silver.
  *   **Result:** Both sides explain the data perfectly well within their own systems. There is no "killer case" because the dispute is not about the data, but about the **status of the cognition before the error is discovered**.

  ### Conclusion: Bedrock Intuitions

  Ultimately, your suspicion is correct: the debate persists because it rests on **bedrock intuitions about default trust** that neither side could argue for without begging the question.

  *   The **Mīmāṃsā/Nyāya** intuition is that the world is intelligible and our faculties are generally reliable; doubt is the exception. This is necessary for a life of action (*pravṛtti*).
  *   The **Buddhist** intuition is that the world is deceptive and our faculties are tainted by ignorance; certainty is the exception. This is necessary for a life of liberation (*nivṛtti*).

  No distinction or reformulation could end the debate because the disagreement is not merely epistemological; it is existential. To accept the *svataḥ* position is to accept a world where authority and perception are prima facie trustworthy. To accept the *parataḥ* position is to accept a world where everything must be earned through critical scrutiny. Since both sides were arguing for a path to salvation, neither could concede the epistemic ground without surrendering the soteriological goal. The debate did not end because it was never truly about cognition; it was about how one ought to live.
