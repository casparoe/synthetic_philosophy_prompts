answer: |-
  This is an exceptionally sharp dissection of the literature. You have correctly identified the bifurcation that occurred in the 1980s and 90s: the split between the **Representational Frame Problem** (technical, logical, largely solved) and the **Epistemological Frame Problem** (cognitive, relevance-based, arguably open).

  Your "borrowed name" hypothesis is plausible, but I argue it misses a crucial historical and structural link: the logical problem was not just a rhetorical hook; it was the *proof of concept* that the epistemological problem is non-trivial.

  Here is a breakdown addressing your three questions, followed by a critique of your hypothesis.

  ### 1. Is the distinction too clean? (Logic vs. Epistemology)

  Your distinction is standard in the Knowledge Representation (KR) community, but it is slightly cleaner than the history warrants.

  **McCarthy and Hayes's Intent:**
  In their 1969 paper, McCarthy and Hayes were indeed focused on the efficiency of representation in the Situation Calculus. They wanted to avoid $N \times M$ frame axioms. However, even then, they acknowledged that the difficulty arose from the assumption that an agent must *deduce* non-change. McCarthy later explicitly distinguished the "technical frame problem" from the "philosophical frame problem," noting that the latter concerns how an agent limits its attention to relevant facts without explicit rules for doing so (which would themselves require framing).

  **The Shade Between:**
  The logical version shades into the epistemological one because the logical problem arises *only* if you assume intelligence requires explicit inference over explicit representations.
  *   **The Logical Problem:** "How do I represent non-change without explosion?" (Solved by Successor State Axioms, Circumscription, Fluent Calculus).
  *   **The Epistemological Problem:** "How do I know *which* fluents to track without checking everything?"

  The logical solutions (like Reiter's Successor State Axioms) solve the bookkeeping *given* that you have already identified the relevant fluents. They do not tell you *how* to select those fluents from the universe of possibilities. Therefore, the logical solution presupposes a solution to the relevance problem.

  **Ramification and Qualification:**
  You are mostly right to group them, but technically they are distinct constraints on action models:
  *   **Frame:** What stays the same?
  *   **Ramification:** What *indirectly* changes? (e.g., moving a table moves the cup on it).
  *   **Qualification:** What *preconditions* might fail? (e.g., the potato in the tailpipe).

  Treating them as "local faces of the same underlying difficulty" is analytically sound if you define the difficulty as **"the intractability of modeling open-world dynamics."** However, in formal KR, they require different machinery (e.g., causal minimization for ramification vs. non-monotonic logic for qualification). Conflating them risks obscuring specific technical fixes, but for your philosophical inquiry, grouping them is acceptable.

  ### 2. Is relevance a problem for *all* intelligence, or just symbolic architectures?

  This is the crux of the Dreyfus vs. Fodor debate.

  **The Symbolic Bottleneck:**
  Dreyfus is correct that the Frame Problem is a crisis *specifically* for Good Old-Fashioned AI (GOFAI). If intelligence requires serial inference over explicit propositions, the Frame Problem is fatal because the search space is infinite. A system that must logically verify that "the moon did not turn to cheese" before every action will never act.

  **The Human Condition:**
  However, Fodor (in *The Modularity of Mind*) argued that the Frame Problem is **not** just an artifact of bad architecture; it is a fundamental problem of cognitive science. Humans *do* face the relevance problem. We solve it not by inference, but by:
  1.  **Embodiment:** Our physical constraints limit the set of relevant interactions.
  2.  **Evolutionary Priors:** We are hardwired to attend to snakes and faces, not random pixel configurations.
  3.  **Affect/Emotion:** Damasio's somatic markers help prune decision trees pre-consciously.

  So, the problem is genuine for us, but we solve it **sub-symbolically**. We don't "decide" what is relevant via inference; relevance "pops out" due to architectural biases.

  **Conclusion on Q2:**
  Dreyfus's diagnosis is partially right: the *crisis* is architectural. But the *constraint* is universal. Any bounded system (biological or silicon) operating in an unbounded environment must have a mechanism for filtering relevance. If that mechanism is explicit inference, you get the Frame Problem. If it is connectionist/embodied, you get "attention." The problem doesn't vanish; it moves from the logic layer to the architecture layer.

  ### 3. Modern Learning Systems: Solution or Sidestep?

  This is where your hypothesis needs the most adjustment. Modern Deep Learning (DL) and Reinforcement Learning (RL) systems do not have a logical Frame Problem because they have no axioms. But they face a **Statistical Frame Problem**.

  **Empirical Solution?**
  Transformers (Attention mechanisms) are essentially relevance engines. They compute a weighted sum of values based on query-key similarity. This is an empirical, differentiable solution to "what should I pay attention to?"
  *   **Success:** In-distribution, these systems act in real-time with appropriate relevance.
  *   **Failure:** They are brittle Out-of-Distribution (OOD).

  **The Inheritance of Relevance:**
  You hit the nail on the head: they "quietly inherit whatever relevance their training distributions supply."
  *   If the training data implies that "cars stop at red lights," the model learns this correlation.
  *   If the world changes (e.g., a new traffic law, a weird edge case), the model has no causal model to fall back on. It cannot reason about *why* the light is relevant, only that it *was* relevant in the past.

  **Did they solve the philosophical problem?**
  No. They solved the **computational** problem of relevance approximation via massive parallelism and data. They have not solved the **epistemological** problem of *grounded* relevance.
  *   **The Frame Problem as Common Sense:** The philosophical Frame Problem is often a proxy for "Common Sense Reasoning." DL systems lack robust common sense. They fail at counterfactuals (Pearl's Ladder of Causation).
  *   **Implication:** The success of DL suggests the problem is not *principally* unsolvable, but it suggests the solution is **statistical and causal**, not logical. It implies that "relevance" is not a logical property to be deduced, but a statistical/causal property to be learned.

  ### Critique of the "Borrowed Name" Hypothesis

  Your hypothesis is that the term persists to borrow prestige/clarity from the technical problem to discuss the fuzzy philosophical one. I suggest three things this hypothesis misses:

  1.  **The Logical Problem *Revealed* the Epistemological One:**
      It wasn't just rhetorical slippage. The failure of early AI to scale wasn't just due to slow computers; it was due to the combinatorial explosion of relevance. The technical Frame Problem was the *smoking gun* that proved relevance is a hard constraint on computation. Without the formal proof of the bookkeeping explosion, the philosophical claim might have remained hand-wavy.

  2.  **It Masks the Shift from Logic to Causality:**
      The persistence of the term obscures the fact that the field has moved from **Logic** (deduction) to **Causality** (intervention). Judea Pearl argues that the Frame Problem is solved by moving from probabilistic associations to causal diagrams. If you know the causal structure, you know what changes and what doesn't without frame axioms. The "Frame Problem" label persists because we haven't fully integrated causal reasoning into general learning systems yet.

  3.  **It Underestimates the "Grounding" Issue:**
      The philosophical Frame Problem is deeply tied to Symbol Grounding. A symbolic system doesn't know what "cup" *is*, only that it is a token. Therefore, it cannot know which properties of "cup" are relevant to "drop." A grounded system (robot/brain) knows the physics of the cup. The label persists because we still don't have a complete theory of how semantic grounding interacts with dynamic prediction.

  ### Summary

  *   **Technical Frame Problem:** Solved (in KR contexts).
  *   **Philosophical Frame Problem:** Renamed "The Relevance Problem" or "Common Sense." It is not solved, but the nature of the solution has shifted from **axiomatic** to **architectural/statistical**.
  *   **Your Distinction:** Valid, but the logical problem was the necessary precursor to identifying the epistemological constraint.
  *   **Modern AI:** Solves relevance statistically, not logically. This works until the distribution shifts, revealing that the underlying causal understanding is still missing.

  The "Frame Problem" remains a useful label not because of ambiguity, but because it marks the boundary where **representation meets computation**. It asks: *How much of the world must be represented internally to act successfully externally?* We have engineering answers (neural nets), but we still lack a theoretical account of why they work as well as they do, or how to make them robust to the open-endedness of the real world.
