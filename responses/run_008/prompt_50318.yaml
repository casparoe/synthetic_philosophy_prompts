  **Metaphysician's Planning Notes**
  1.  **The Hook:** Use the class banner to ground the abstract debate in visual identity. The photo represents the past temporal part (Perry) vs. the wholly present object (Ellie).
  2.  **The Core Clash:** Focus on Temporary Intrinsics. Ellie argues property contradiction (beard/no beard); Perry argues distinct parts hold distinct properties. Ellie must counter that relativizing properties ("bearded-at-t") empties them of reality.
  3.  **The Complications:** Use the "Atom Replacement" (Dave the doctor) to challenge material constitution, and "Regret" to challenge moral ownership across time.
  4.  **The Resolution:** No victory. The stalemate reveals the fault line: Is metaphysics about fundamental ontology or useful bookkeeping?

  ***

  **The Reunion Dialogue**

  Ellie and Perry stood before the massive banner, gin tonics in hand. The photo of 1999's graduating class loomed behind them.

  "Look at that skinny kid," Ellie said, pointing to a clean-shaven face in the front row. "That's me. Literally me. Wholly present then, wholly present now."

  Perry swirled his ice. "Strictly speaking, Ellie, that's a 1999 temporal part of you. The worm extends to here, where you're hogging the shrimp."

  "Same substance, Perry. Endurance."

  "But the temporary intrinsics," Perry countered. "That kid is clean-shaven. You are bearded. If you are numerically identical to him, you have incompatible properties *simpliciter*. Contradiction."

  "Not contradiction. Change. I *was* smooth, I *am* bearded. The properties are indexed to times. I have-a-beard-at-2024."

  Perry smiled. "Ah, the relational move. But admit it: that's perdurantism with extra steps. You're saying you only have the beard relative to a time. I say the 2024 segment has the beard simpliciter. It's cleaner. No mystery about how one thing holds incompatible properties."

  "It's not mystery, it's reality," Ellie shot back. "If I only have properties relative to times, do I have any properties at all? You save the logic by losing the subject. You say 'the worm exists,' but who feels the hangover? The whole worm doesn't fit in the bed."

  Dave, their classmate now a cardiologist, sidled up. "Speaking of bodies, did you know 98% of the atoms in you have replaced themselves since graduation? Materially, you're not the same stuff."

  Perry gestured to Dave. "See? Material constitution shifts. The worm persists through the atomic swap. The 1999 slice has different atoms than the 2024 slice. Endurance can't explain how the *same* matter-less object survives total replacement."

  "I persist *through* the replacement," Ellie insisted. "I'm not the atoms. I'm the substance organizing them. Your worm is just a history book bound in flesh."

  "But who reads the book?" Ellie pressed. "Say I regret skipping class in '98. If I'm just a series of stages, who is the 'I' regretting? The current stage isn't identical to the skipping stage. Why should I pay for his tuition debt?"

  "Psychological continuity," Perry said. "The current stage inherits the mental states of the past stage. Causal connection is enough for responsibility."

  "Inheritance implies transfer between distinct things," Ellie said. "If I'm not identical to the skipper, it's collective punishment. You're saying guilt is just a baton pass."

  They stood silently for a moment, watching the room. The thunderclouds outside mirrored the stalemate.

  "So," Perry said softly. "You think I'm chopping people into slices to save logic."

  "And you think I'm magical thinkers clinging to 'substance' to save grammar," Ellie replied.

  "Maybe," Perry mused. "We agree on the shrimp. We agree on the debt. We just disagree on the bookkeeping."

  "Or," Ellie said, clinking his glass, "we disagree on what exists fundamentally. But pass the shrimp."
