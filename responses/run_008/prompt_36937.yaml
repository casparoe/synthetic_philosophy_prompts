answer: |-
  # HANDOUT: Mapping the Space of Idealized Preference
  **Seminar:** Ethics of Paternalism & AI Alignment  
  **Purpose:** To locate your normative commitments without relying on labels (e.g., "utilitarian," "Kantian," "effective altruist").  
  **Starting Assumption:** There are cases where an agent (AI, state, trustee) should *not* satisfy an individual's current, stated preferences, but rather what they would prefer under some improvement (idealization).

  ---

  ## PART I: THE DECISION TREE
  *Answer each question based on your intuition about the **strongest** version of the theory you find defensible. Do not answer based on what you think your "team" believes.*

  **START:** An agent should act on Idealized Preferences (IP) rather than Actual Preferences (AP).

  **NODE 1: SCOPE**  
  When calculating the IP, do you calculate it for **each person individually** (ignoring how their IP affects others' IP), or **jointly for everyone** (where my IP depends on what is compatible with yours)?  
  *   **[A] Individual:** The theory defines *my good*. (Go to Node 2A)  
  *   **[B] Joint:** The theory defines *our right action*. (Go to Node 2B)

  **NODE 2A: MORAL CONTENT (Individual Path)**  
  In the idealized state, do you care more about the welfare of strangers or moral principles than you do right now?  
  *   **[A1] No:** Idealization only fixes facts, logic, and calmness. (Go to Node 3A)  
  *   **[A2] Yes:** Idealization makes you morally better. (Go to Node 3A)

  **NODE 2B: MORAL CONTENT (Joint Path)**  
  In the idealized state, do the agents care more about morality/justice than they do right now?  
  *   **[B1] No:** Idealization only fixes facts, logic, and coordination. (Go to Node 3B)  
  *   **[B2] Yes:** Idealization makes agents more just/altruistic. (Go to Node 3B)

  **NODE 3A: AUTHORITY & CONTINUITY (Individual Path)**  
  If your Idealized Self rejects a core life-project your Actual Self loves (e.g., "art is pointless"), does the Idealized Self have the authority to overrule you?  
  *   **[A-i] No:** IP must be recognizable as a development of AP. (Go to Node 4A)  
  *   **[A-ii] Yes:** IP is authoritative even if it feels alien to AP. (Go to Node 4A)

  **NODE 3B: CONFLICT RESOLUTION (Joint Path)**  
  If two agents' Idealized Preferences conflict, do we **aggregate** them (trade-offs/compromise) or seek a **convergence** (a unique solution everyone would accept)?  
  *   **[B-i] Aggregate:** We sum or balance competing ideals. (Go to Node 4B)  
  *   **[B-ii] Converge:** There is one right answer we would all find. (Go to Node 4B)

  **NODE 4A: OUTPUT MODE (Individual Path)**  
  Is the goal to **maximize** the satisfaction of the IP, or to use the IP only as a **constraint** on intervention?  
  *   **[Max]:** Get as much of the IP as possible.  
  *   **[Con]:** Only intervene to prevent violation of IP.

  **NODE 4B: OUTPUT MODE (Joint Path)**  
  Is the output a specific **directive** to enforce, or a **permission** structure for the agent?  
  *   **[Dir]:** The agent must bring about the IP outcome.  
  *   **[Perm]:** The agent must not violate the IP, but has discretion otherwise.

  ---

  ## PART II: THE LEAVES (Your Destination)
  *Match your path (e.g., A → A1 → A-i → Max) to the descriptions below.*

  ### 1. The Welfare Economist (A → A1 → A-i → Max)
  **Position:** **Minimal Idealization Preference Satisfaction.**  
  **View:** People know their good best, provided they aren't high, misinformed, or panicking. Idealization is just error-correction.  
  **Literature:** Standard Welfare Economics; some Libertarian Paternalism (Thaler/Sunstein).

  ### 2. The Objective List Disguise (A → A2 → A-ii → Max) **[UNOCCUPIED REGION]**  
  **Position:** **Moralized Individual Maximization.**  
  **View:** We call it "preference," but we idealize you until you want what is objectively good, then maximize that, even if you hate it.  
  **Status:** **Theoretically Unstable.** Most philosophers admit this collapses into Objective List Theory, not preference theory. It claims to respect agency while overriding all actual agential content.  
  **Why Empty?** Incoherence. If you override actual values based on moral improvement, "preference" is doing no work.

  ### 3. The Growth Guardian (A → A2 → A-i → Con) **[CONSTRUCTED]**  
  **Position:** **Developmental Constraint Theory.**  
  **View:** Idealization includes moral growth, but you cannot force that growth on someone who rejects it. You may only stop them from permanently destroying their capacity for moral growth.  
  **Status:** Defensible but rare. It treats moral potential as a constraint rather than a goal.

  ### 4. The Silent Benefactor (A → A1 → A-ii → Con) **[CONSTRUCTED]**  
  **Position:** **Epistemic Paternalism Hard-Stop.**  
  **View:** If you knew the facts, you'd want X. I will give you X. But if you realize what I did and scream "stop," I must stop, even if you are factually wrong.  
  **Status:** A specific form of soft paternalism that prioritizes procedural consent over substantive good.

  ### 5. The Full-Information Theorist (A → A1 → A-ii → Max)  
  **Position:** **Ideal Advisor / Full-Information Account.**  
  **View:** Your good is what you would want if you knew all non-evaluative facts and reasoned perfectly. If you currently value ignorance, your idealized self rejects that, and the idealized self wins.  
  **Literature:** Peter Railton (*Morality as a Hypothetical Imperative*); Michael Smith (*The Moral Problem*).

  ### 6. The Fact-Based Technocrat (B → B1 → B-ii → Dir) **[CONSTRUCTED]**  
  **Position:** **Convergent Epistemic Authority.**  
  **View:** If everyone knew the facts and thought clearly, we would all want the exact same policy outcomes. Conflict is just error. The AI/State should enforce that unique solution.  
  **Status:** High risk of dogmatism. Assumes moral disagreement is purely empirical.

  ### 7. The Ideal Contractualist (B → B1 → B-i → Perm)  
  **Position:** **Hypothetical Bargaining.**  
  **View:** Idealized agents (no moral improvement, just rational/informed) would agree to certain rules. We aggregate their interests to find the deal. The agent is permitted to act within the deal.  
  **Literature:** T.M. Scanlon (modified); David Gauthier.

  ### 8. The Vetoed Saint (B → B2 → B-i → Perm) **[CONSTRUCTED]**  
  **Position:** **Moralized Aggregation with Veto.**  
  **View:** We should sum up what morally improved versions of us would want, *unless* a specific actual person violently objects to the moral improvement itself.  
  **Status:** Attempts to balance utilitarianism of ideals with respect for actual autonomy.

  ### 9. The Coherent Extrapolator (B → B2 → B-ii → Dir)  
  **Position:** **Coherent Extrapolated Volition (CEV).**  
  **View:** The AI should do what we *would* wish if we knew more, thought faster, were more the people we wished we were, and converged on a shared volition.  
  **Literature:** Eliezer Yudkowsky (AI Alignment).

  ### 10. The Deliberative Democrat (B → B1 → B-ii → Perm)  
  **Position:** **Ideal Discourse Theory.**  
  **View:** Conflict is resolved through idealized communication until convergence is reached. The output is not a fixed directive but a permission to act on the current state of consensus.  
  **Literature:** Jürgen Habermas; Joshua Cohen.

  ---

  ## PART III: META-ANALYSIS FOR DISCUSSION

  ### ⚠️ Indistinguishable Leaves
  **Pair:** **Leaf 9 (CEV)** and **Leaf 8 (Vetoed Saint)**.  
  **Problem:** If moral improvement (Node 2B) is robust enough to create convergence (Node 3B-ii), it is empirically difficult to distinguish from a moralized aggregation (Node 3B-i) where the weights just happen to align. If everyone becomes "perfectly moral," do they converge because they found the *one truth*, or because their aggregated preferences perfectly overlap? The tree cannot separate metaphysical convergence from statistical coincidence in the limit.

  ### 🕳️ The Unoccupied Region
  **Location:** **Leaf 2 (A → A2 → A-ii → Max).**  
  **Observation:** Almost no serious theorist defends maximizing an individual's preferences *after* morally improving them *while* allowing those preferences to override the individual's actual core values.  
  **Diagnosis:** **Unattractiveness/Incoherence.** This position claims to care about "what you want" but changes "what you want" to "what is good" and then forces it on you. It sheds the main advantage of preference theory (respect for subjective agency) without gaining the clarity of Objective List theory. It is the "worst of both worlds."

  ### 💡 Surprise Check
  *   If you thought you were a **Libertarian** but ended up at **Leaf 5 (Full-Information)**: You believe facts can override current values. Are you comfortable with a state/AI enforcing that?
  *   If you thought you were a **Utilitarian** but ended up at **Leaf 7 (Contractualist)**: You prioritize the *agreement* of idealized agents over the *sum* of their welfare.
  *   If you ended at **Leaf 6 (Technocrat)**: You believe moral disagreement is solvable via data. History suggests otherwise.

  ---
  *Instructor Note: Bring your path code (e.g., B-B2-B-ii-Dir) to section. We will group by code, not by major.*
