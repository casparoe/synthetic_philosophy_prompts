  Dear Colleagues,

  As we prepare to meet next month, I want to offer a preliminary reflection on the crisis facing our reviewer pool. We all feel the strain: acceptance rates for review requests have plummeted, and a tiny cohort of saints is carrying the weight of our entire operation. If we do not act, the journal will stall. We have three live proposals on the table: a hard quota system tying publication to reviewing duties, a soft credit system offering incentives without sanctions, or the introduction of honoraria. Choosing among them requires us to understand not just the logistics, but the specific economic and social nature of the resource we are trying to sustain.

  It is tempting to frame this as a classic tragedy of the commons, where a shared resource is depleted by overuse. But that framing is misleading. Reviewer labor is not depleted by consumption; getting your paper reviewed does not diminish the stock of available reviewers. Rather, the resource is depleted by non-contribution. This is what some economists call a collaboration good or a public good maintained by contribution. The stock exists only because people chip in. This distinction matters because it changes how we should intervene. In a commons, you restrict access to prevent depletion. In a collaboration good, you must encourage contribution to prevent collapse.

  Consider the case for the hard quota, which I know several of you favor. The argument here is robust and grounded in a sense of professional citizenship. If the journal is a community asset, then benefiting from it without sustaining it is free-riding. A hard quota enforces fairness. It ensures that the burden is distributed equitably across the profession rather than falling on the conscientious few. It treats reviewing not as charity, but as a duty of tenure and publication, akin to paying taxes for public services. There is moral clarity here: if you will not review, you should not publish. This coercive approach guarantees a baseline supply of labor and solves the immediate mathematical deficit of reviews needed per submission. It appeals to our sense of justice, ensuring that the burnout we see among our most reliable reviewers is alleviated by forcing the silent majority to pull their weight.

  However, while the quota system solves the math, it risks breaking the culture. Academic reviewing is fundamentally a gift economy. We review partly for the profession, but also for the reputational currency it generates, the silent acknowledgment that one is a trusted arbiter of quality. Formalizing this into a transactional debt risks crowding out that intrinsic motivation. If reviewing becomes a tax owed to the journal, it loses its status as a gift, and the goodwill that currently sustains us may evaporate. Furthermore, for a journal with no paid staff, the administrative burden of tracking debts, issuing warnings, and suspending submission privileges is prohibitive. We would become enforcers rather than editors, and the risk of driving authors, particularly early-career researchers vulnerable to sanctions, to competitor journals is real.

  The proposal to pay honoraria is equally understandable. Money solves motivation problems quickly. But for a mid-tier journal operating on library agreements and subscriptions, this introduces financial instability we cannot absorb. It also risks attracting reviews done for the fee rather than the scholarship, potentially lowering the quality of our feedback loop. We cannot compete with top-tier journals on price, and attempting to do so might compromise our identity.

  Therefore, I recommend we adopt a refined version of the soft credit system. We should formalize the reputational currency that is already at play. Reviewers should receive explicit credit, perhaps through a publicly accessible annual ledger or integration with services like Publons, acknowledging their labor as a professional contribution. We can pair this with soft incentives, such as expedited handling for authors who are current reviewers. This aligns with the collaboration good model: we increase the benefit of contributing without punishing non-contribution so harshly that we alienate the community. This protects our most reliable reviewers by giving them public recognition for their labor, validating the time they invest.

  This leaves the problem of enforcement. As some of you noted, monitoring norms is itself a public good, risking a second-order free rider problem where no one wants to be the enforcer. We solve this not by appointing a police force, but by transparency. If the data on reviewing contributions is visible to the board and, where appropriate, the community, the social pressure to contribute becomes decentralized. We rely on the profession's desire for recognition rather than our own capacity for coercion. This preserves the gift economy while making the gift visible. We must sustain the journal without turning it into a bureaucracy. I look forward to discussing this further when we meet.
