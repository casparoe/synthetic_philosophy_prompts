answer: |-
  ### The 10-Minute Reversal Triage Procedure

  This procedure is designed to be executed solo, using only standard experiment dashboards (assignment logs, metric breakdowns, significance calculators). It prioritizes **data integrity** first, then **causal structure**, then **business relevance**.

  **Philosophical Commitment:** This procedure implicitly adopts the **Total Causal Effect (Intention-to-Treat)** view. It assumes the business question is: *"What happens if we ship this code to everyone?"* not *"What happens to users who behave in a specific way after seeing the code?"*
  *   **Pre-test variables** are treated as **Confounders**: If imbalanced, they distort the truth. We must adjust (stratify) to find the real effect.
  *   **Post-test variables** are treated as **Mediators or Colliders**: Conditioning on them blocks the effect of the feature or introduces selection bias. We must not adjust (aggregate) to see the total impact.

  ---

  #### Step 1: The Noise Floor Check (2 Minutes)
  *   **Action:** Look at the confidence intervals (95%) for the Overall Effect and the Stratified Effects.
  *   **Question:** Do the intervals overlap zero? Do the intervals of the subgroups overlap each other?
  *   **Settles:** Whether the reversal is statistically real or sampling variance.
  *   **Sufficient Answer:** If the overall effect is not significant ($p > 0.05$) OR if the subgroup effects are not significantly different from the overall direction, the "reversal" is noise.
  *   **Decision:**
      *   If Noise: **Report Aggregate** (with wide CIs). Stop.
      *   If Signal: Proceed to Step 2.

  #### Step 2: The Integrity Check (SRM) (3 Minutes)
  *   **Action:** Check the Sample Ratio Mismatch (SRM) p-value for the overall test and *within each slice*. Check the assignment logs for the slicing variable distribution across Treatment vs. Control.
  *   **Question:** Is the traffic split 50/50 (or target ratio) within the slices? Did the proportion of the slice change between arms?
  *   **Settles:** Whether randomization held.
  *   **Sufficient Answer:** SRM p-value < 0.001 or visible drift in slice composition (e.g., Treatment has 40% Mobile, Control has 60% Mobile).
  *   **Decision:**
      *   If SRM Fail on Slicing Variable: **Escalate to Data Engineering/Statistician.** (Do not report yet; this is a pipeline bug).
      *   If SRM Pass: Proceed to Step 3.
      *   *Note:* If SRM fails but you are forced to proceed (e.g., traffic source bias known and unavoidable), treat as "Imbalance Detected" in Step 3.

  #### Step 3: The Temporal Definition Check (3 Minutes)
  *   **Action:** Determine when the slicing variable was determined relative to the user's exposure to the treatment.
  *   **Question:** Could the feature *possibly* have influenced whether a user falls into this slice?
      *   *Pre-Test:* Platform, Geo, Plan Tier, Signup Date, Device Type. (Fixed before randomization).
      *   *Post-Test:* Engagement, Retention, Onboarding Completion, Number of Sessions. (Happens after randomization).
  *   **Settles:** The causal structure (Confounder vs. Mediator/Collider).
  *   **Sufficient Answer:** A binary classification: **Pre** or **Post**.
  *   **Decision:**
      *   If **Pre-Test**: Proceed to Step 4A.
      *   If **Post-Test**: Proceed to Step 4B.
      *   If **Ambiguous** (e.g., "Active User" defined by login in last 24h, but test runs for 7 days): **Escalate.**

  #### Step 4: The Decision Matrix (2 Minutes)

  **Step 4A: Pre-Test Slice (e.g., Platform, Tier)**
  *   **Context:** The reversal is likely due to composition bias (one arm got more high-value users).
  *   **Action:** Calculate the weighted average of the stratified effects (Standardization), weighting by the *overall* population distribution, not the arm-specific distribution.
  *   **Decision:** **Report Stratified (Weighted).** The raw aggregate is biased by the imbalance; the stratified number recovers the causal effect.

  **Step 4B: Post-Test Slice (e.g., Engagement, Usage)**
  *   **Context:** The reversal is likely due to collider bias or blocking mediation. The feature may have hurt retention *by* reducing engagement. Slicing by engagement hides this mechanism.
  *   **Action:** Ignore the stratified numbers for decision-making. They answer "What is the effect on survivors?" not "What is the effect of the feature?"
  *   **Decision:** **Report Aggregate.** This represents the true business impact of shipping the feature.

  ---

  ### Addressing Your Suspicion: Causality and Slicing

  You asked if this procedure is silently committed to a view on causality. **Yes.**

  It commits to the view that **business value is determined by the Intervention, not the Observation.**
  *   In the **Graduate Admissions (Berkeley)** case, "Department Choice" is a **Pre-Test** variable (mostly). Women chose harder departments. The aggregate was misleading because it conflated "Gender" with "Department Difficulty." Adjusting for Department (Stratified) revealed the truth about bias.
  *   In **Post-Test Slicing** (e.g., Engagement), the feature *causes* the engagement. If you slice by engagement, you are comparing Treated-Engaged users against Control-Engaged users. But the Control-Engaged users are a "survivor" group (naturally highly engaged), whereas the Treated-Engaged group includes people who *only* engaged because of the feature. This creates a selection bias that makes the feature look better than it is within slices, while the aggregate correctly captures that the feature failed to move the needle (or hurt) the total population.

  **The Procedure's Stance:**
  1.  **Pre-Test Imbalance** = **Bias**. Fix it by Stratifying.
  2.  **Post-Test Conditioning** = **Mechanism Hiding**. Fix it by Aggregating.

  ---

  ### Confidence Assessment

  *   **Step 1 (Noise):** **High Confidence.** Standard statistical practice. If it's noise, no decision is needed.
  *   **Step 2 (Integrity):** **High Confidence.** SRM invalidates causal inference. If randomization broke, no number is trustworthy without engineering fixes.
  *   **Step 4 (Decision Matrix):** **Medium-High Confidence.** Aligns with standard causal inference (DAGs) and ITT principles used in tech (e.g., Uber, Netflix experimentation platforms).
  *   **Step 3 (Temporal Definition):** **Lowest Confidence.** This is the human-judgment bottleneck. Variables like "New vs. Returning" or "Active vs. Dormant" can be ambiguous depending on how the window is defined relative to the experiment start. Misclassifying a Post-Test variable as Pre-Test leads to over-adjustment; misclassifying Pre-Test as Post-Test leads to accepting biased aggregates.

  ---

  ### Running the Procedure

  #### Case 1: Notification Feature (Mobile/Desktop Slice)
  *   **Observation:** Overall Negative, Segments Positive.
  *   **Step 1 (Noise):** Assume signals are significant (per prompt implication).
  *   **Step 2 (Integrity):** Assignment logs reveal **mobile share drifted between arms**. This is an SRM/Imbalance on the slicing variable.
  *   **Step 3 (Temporal):** Platform (Mobile/Desktop) is **Pre-Test**.
  *   **Step 4A (Decision):** Pre-Test Imbalance detected. The raw aggregate is weighted by the drifted distribution (e.g., Treatment has too many Mobile users, who might have lower baseline retention). The stratified estimate corrects for this composition error.
  *   **Conclusion:** The raw aggregate is biased. The stratified (re-weighted) number reflects the true effect.
  *   **Report:** **Stratified** (specifically, the standardized mean difference derived from strata).

  #### Case 2: Notification Feature (Engagement Slice)
  *   **Observation:** Overall Negative, Segments (Engaged/Unengaged) Positive.
  *   **Step 1 (Noise):** Assume signals are significant.
  *   **Step 2 (Integrity):** No mention of assignment drift. Assume randomization held.
  *   **Step 3 (Temporal):** Engagement in the first week is **Post-Test**. The notification likely influenced whether they engaged.
  *   **Step 4B (Decision):** Post-Test Slice. Slicing by engagement conditions on a mediator/collider. The PM wants to report this because it looks positive, but it excludes the users the feature failed to engage (who drove the negative aggregate). The aggregate captures the total cost of the feature.
  *   **Conclusion:** The stratified number is a conditional illusion. The aggregate is the business reality.
  *   **Report:** **Aggregate**.

  ---

  ### Confidence in Rules
  I am **least sure** of **Step 3 (Temporal Definition)**. While "Platform" is clearly pre-test and "Retention" is clearly post-test, variables like "User Tier" (which can be upgraded during a test) or "Activity Status" (defined by a rolling window) require human judgment. If an engineer misclassifies a Post-Test variable as Pre-Test, they will erroneously stratify and hide negative total impacts. This rule requires domain knowledge that a purely automated dashboard check cannot guarantee.

  \answer{case 1: stratified; case 2: aggregate}
