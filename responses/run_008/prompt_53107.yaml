prompt: |-
  I'm a software engineer who owns the A/B testing pipeline at my company, and every few months an experiment lands on my desk where the numbers flip when we slice them: a feature looks harmful overall but positive in every segment, or the reverse. Right now the choice of which number we report goes to whoever argues loudest, and the PM who sponsored the feature signs off on it, so the stakes are real. Write me a decision procedure I can run in about ten minutes, alone, with only a dashboard in front of me: the checks to do in order (starting with whether the reversal could just be noise), what each check settles, what counts as a sufficient answer, where the procedure concludes "report the aggregate," where it concludes "report a stratified number," and where it has to give up and hand the call to a person. One suspicion I want the procedure to address head-on: it feels like it matters whether the slicing variable was fixed before the test (platform, plan tier) or only measured after it (users who completed onboarding, engaged users), because in the well-known graduate-admissions case the aggregate was the misleading number, while slicing by post-test behavior sometimes seems to manufacture reversals that dissolve in the aggregate — though I can't say why, and I'd like to know whether the procedure ends up silently committed to some view about what it means for a feature to cause an outcome, and if so what it is. Then run the procedure on two cases: (1) a notification feature that lowers seven-day retention overall but shows positive retention on both mobile and desktop, where the assignment logs later reveal that the mobile share drifted between arms; and (2) the same overall-negative feature sliced by engagement in the first week, positive among both engaged and unengaged users — a slice the sponsoring PM is eager to report. Please say how confident you are in each rule of the procedure, single out the rule you are least sure of, and end with a machine-readable line of the form \answer{case 1: <aggregate or stratified>; case 2: <aggregate or stratified>} giving the number that should be reported in each case.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Software Engineer owning the A/B testing pipeline.
      *   **Problem:** Simpson's Paradox / Reversal paradoxes (aggregate vs. stratified results contradict).
      *   **Current State:** Ad-hoc, political ("whoever argues loudest"), high stakes (PM signs off).
      *   **Task:** Create a 10-minute solo decision procedure (checklist) using only a dashboard.
      *   **Requirements:**
          *   Order of checks (start with noise).
          *   What each check settles.
          *   Sufficient answer criteria.
          *   Decision points (Report Aggregate vs. Report Stratified vs. Escalate).
          *   Address the Pre-test vs. Post-test slicing variable suspicion (causality implication).
          *   Run the procedure on two specific cases.
          *   Express confidence levels for rules (identify the weakest).
          *   End with a specific machine-readable line: `\answer{case 1: <aggregate or stratified>; case 2: <aggregate or stratified>}`.

  2.  **Analyze the Core Statistical Problem:**

      *   **Simpson's Paradox:** Occurs when a trend appears in different groups of data but disappears or reverses when these groups are combined.
      *   **Cause:** Usually confounding variables. The treatment assignment is correlated with the subgroup sizes or characteristics.
      *   **Pre-test vs. Post-test Slicing:**
          *   *Pre-test (Baseline):* e.g., Platform, Geo, Plan Tier. These are fixed before treatment. If randomization was done correctly, these should be balanced. If they aren't balanced, it's a randomization failure or drift. Adjusting for these (stratification) usually gives the *true* causal effect because it controls for the confounder.
          *   *Post-test (Collider/Mediator):* e.g., Engagement, Onboarding completion. These happen *after* treatment. Slicing by these opens "collider bias" or blocks mediation paths. If the treatment *causes* engagement, and engagement *causes* retention, slicing by engagement blocks the indirect effect of the treatment. This usually makes the aggregate the correct number for *total* impact, while the stratified number answers a different conditional question ("What is the effect on those who happened to engage?").
      *   **The "Graduate Admissions" Case (Berkeley):** Aggregate showed bias against women. Stratified by department showed no bias (or bias for women). The confounder was *Department Choice* (women applied to harder departments). Here, Department is effectively pre-treatment (choice made before admission decision). Aggregate was misleading.
      *   **The "Post-Test" Case:** If we slice by "Users who clicked," and the treatment *caused* clicks, we are comparing treated clickers vs. control clickers. But the treated group has *more* clickers because of the treatment. The control clickers are a select group of naturally high-engagement users. This creates bias. Aggregate is usually preferred for business impact.

  3.  **Drafting the Decision Procedure (The "10-Minute Triage"):**

      *   *Constraint:* Must be doable alone with a dashboard in 10 mins. No deep causal inference modeling.
      *   *Step 1: Noise Check.* Is the reversal statistically significant or just fluctuation?
      *   *Step 2: Randomization Check (SRM).* Is the traffic split actually 50/50 in the slices?
      *   *Step 3: Timing Check (The Core Causal Question).* Was the slice defined before or after treatment?
      *   *Step 4: Magnitude/Weight Check.* How big are the groups?
      *   *Decision Logic:*
          *   Noise? -> Ignore reversal.
          *   SRM Fail? -> Escalate (Data Integrity).
          *   Pre-test Slice + Imbalance? -> Stratified (Weighted).
          *   Post-test Slice? -> Aggregate (Total Effect).
          *   Ambiguous? -> Escalate.

  4.  **Refining the Procedure (Addressing the User's Suspicion):**

      *   The user suspects pre-test vs. post-test matters. They are right.
      *   *Pre-test:* Confounder. Needs adjustment (Stratified).
      *   *Post-test:* Mediator or Collider. Adjustment blocks the effect (Aggregate).
      *   *Philosophy:* The procedure implicitly adopts the "Total Causal Effect" view for business metrics. We care about what happens when we ship the feature to *everyone*, not what happens conditional on behavior the feature itself influences.

  5.  **Developing the Two Cases:**

      *   **Case 1: Notification Feature, Mobile/Desktop Slice.**
          *   Overall: Negative.
          *   Segments: Positive.
          *   Fact: Mobile share drifted between arms (SRM issue/Imbalance).
          *   Analysis: Platform is Pre-test. Drift indicates randomization failure or sampling bias. The aggregate is weighted by the messed-up distribution. The stratified estimate corrects for the imbalance.
          *   Verdict: Stratified (specifically, a weighted average of the strata, not the raw aggregate).
      *   **Case 2: Notification Feature, Engagement Slice.**
          *   Overall: Negative.
          *   Segments (Engaged/Unengaged): Positive.
          *   Fact: Engagement is Post-test (first week). PM wants to report this.
          *   Analysis: Engagement is likely influenced by the notification. Slicing by it conditions on a collider/mediator. The aggregate reflects the true business impact (including the negative side effects that might reduce engagement).
          *   Verdict: Aggregate.

  6.  **Writing the Procedure (Iterative refinement for clarity and tone):**

      *   Need to be authoritative but humble about the limitations.
      *   Need to explicitly answer the "causal view" question.
      *   Need to assign confidence levels.

      *   *Rule 1 (Noise):* Check CIs. If overlap, stop. (High Confidence).
      *   *Rule 2 (SRM):* Check assignment ratios per slice. If p < 0.001, Escalate. (High Confidence).
      *   *Rule 3 (Pre/Post):* Is the slice attribute determined *before* user sees treatment? (Medium-High Confidence - sometimes ambiguous).
      *   *Rule 4 (Decision):* Pre-test imbalance -> Stratified. Post-test -> Aggregate. (Medium Confidence - depends on specific causal graph).

      *   *Weakest Rule:* The Pre/Post distinction. Sometimes a variable feels pre-test but is actually influenced by anticipation or subtle cues. Or "Plan Tier" might change during the test. I'll flag the "Temporal Definition" rule as the least certain.

  7.  **Addressing the "Causal View" Question:**

      *   Does the procedure commit to a view? Yes.
      *   View: **Intention-to-Treat (ITT) / Total Effect.**
      *   Why? Because business decisions usually require knowing the impact of *shipping the code*, not the impact of the code *conditional on user reactions to the code*.
      *   Pre-test slices correct for *bias* (confounding).
      *   Post-test slices correct for *mechanism* (mediation), which hides the total cost/benefit.

  8.  **Final Review against Constraints:**

      *   10 minutes? Yes, checks are dashboard-based.
      *   Alone? Yes.
      *   Order? Noise -> Integrity -> Causality -> Decision.
      *   Machine readable line at the end? Yes.
      *   Confidence levels included? Yes.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction on Case 1:* The prompt says "mobile share drifted between arms." This is Sample Ratio Mismatch (SRM). If SRM exists, the aggregate is biased. The stratified analysis (meta-analysis style) is the fix. So Report Stratified (weighted).
      *   *Correction on Case 2:* Engagement is post-treatment. Reporting stratified here is "cherry-picking" the survivors. Report Aggregate.
      *   *Confidence:* Be honest. Statistical triage is heuristic.
      *   *Causal Philosophy:* Make sure to explain *why* post-test slicing is dangerous (collider bias).

  10. **Final Polish:** Ensure the tone is professional, engineering-focused, and directly answers the prompt's philosophical query about causality. (Proceed to generate output).

      *   *Wait, one nuance on Case 1:* If mobile share drifted, is the aggregate *wrong*? Yes, because the treatment group has a different composition than control. The "True" effect is the weighted average of the strata (Standardization). So "Report Stratified" implies reporting the standardized effect, not just picking one slice. I need to be clear that "Report Stratified" means "Report the variance-adjusted aggregate derived from strata."
      *   *Wait, one nuance on Case 2:* The prompt asks to choose between "Report Aggregate" or "Report Stratified". In Case 2, Aggregate is the correct business metric. In Case 1, the raw Aggregate is biased, so the Stratified (standardized) estimate is the correct "Aggregate" equivalent. I will use the terms as requested but clarify the meaning.

      *   *Refining the "Causal View" section:* The user asks if the procedure is silently committed to a view. Yes, it commits to the **Total Causal Effect** (Intention-to-Treat). It treats pre-test variables as Confounders (adjust for them) and post-test variables as Mediators/Colliders (do not adjust).

      *   *Confidence:* I need to single out the rule I am least sure of. That is likely the "Pre/Post" classification rule, as some variables are ambiguous (e.g., "Login Frequency" before test might predict engagement, but is it fixed?). I'll specify "Temporal Definition" as the weakest link.

      *   *Final check on the answer line:* `\answer{case 1: stratified; case 2: aggregate}`.

      *(Self-Correction)*: Wait, in Case 1, if there is SRM (Sample Ratio Mismatch), strictly speaking, the experiment is invalid. However, if the drift is known (e.g., mobile users were accidentally over-sampled in Control), we can re-weight. The prompt asks to choose between reporting aggregate or stratified. Reporting the raw aggregate is lying. Reporting the stratified (re-weighted) truth is the engineering fix. I will recommend Stratified (with the caveat that it implies re-weighting).
      Actually, looking at the prompt: "where the assignment logs later reveal that the mobile share drifted between arms". This is a classic SRM. Usually, SRM means "Throw away test." But if we *must* report, the stratified estimate is the only one that removes the composition bias. I will stick with Stratified for Case 1.

      For Case 2, Post-test slicing is the "Simpson's Paradox" trap where the aggregate is actually the truth for decision making. So Aggregate.

