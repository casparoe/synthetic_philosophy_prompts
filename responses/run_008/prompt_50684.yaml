  *   **Scenario A: She says "Not Real Pride."**
      *   **Reveals:** She is consistent with her **Anger/Guilt Rule**. Complex emotions *must* be tethered to a truthful cognitive proposition (e.g., "I did something worthy"). If the proposition is false, the emotion is invalid (just "excitement" or "arousal").
      *   **Implication:** Her theory is strictly **Appraisal-Truth Dependent** for social emotions.

