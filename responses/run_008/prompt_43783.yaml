prompt: |-
  im a second-year med student who somehow agreed to run next week's 50-minute seminar for first-year nursing students on what "disease" even is — like the definitional question before they get anywhere near pathophys. naturalism vs normativism, boorse and all that. i know the terrain myself roughly (biostatistical theory, the normativist pushback, wakefield's hybrid) but i've never had to teach it, and nursing students will eat me alive if it comes off as philosophy people making trouble where doctors are just trying to help people.

  so don't explain the views to me — plan the session. what has to come first so the question feels like it matters to someone who's about to spend their career treating patients (my instinct is the pure statistical-normality line goes early precisely because it fails fast on left-handedness and being unusually tall, but maybe i'm wrong about where it belongs). then the carrying example — i'm genuinely torn between grief (harmful, but is anything dysfunctional?), asymptomatic hypertension (dysfunctional by the numbers, but the person feels fine and no one's harmed until they don't), and something like male-pattern baldness or "prediabetes" where you can smell the disease-mongering off it. pick one for me, say what it needs to have and not have to carry the whole naturalist/normativist thing, and why not the others.

  misconceptions: they'll definately think disease = whatever doctors treat (do i go to pregnancy and contraception as counterexamples, or does that open a can of worms i can't close in time), they'll hear "normativism" as "diseases aren't real, it's all socially constructed, kale cures cancer", and they'll use disease/illness/sickness interchangeably the whole time. tell me where in the sequence each one gets headed off, not just that it exists. also be honest about what i should openly refuse to cover — i assume wakefield's full analysis is its own session, and the DSM politics (homosexuality's removal etc.) is tempting but i suspect it's a trap for hour one?

  end with one question i can put on the board that would show me whether they actually got the distinction rather than just the vibes. something where a student who's secretly still a normativist and one who's secretly still a naturalist would answer differently, if that makes sense.
