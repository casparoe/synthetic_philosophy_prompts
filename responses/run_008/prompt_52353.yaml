      *   **Conclusion:** The "Falsification Conditions."
          *   *Defender:* An AI that becomes smarter but spontaneously adopts human morals without training.
          *   *Critic:* An AI that pursues a trivial goal with infinite resource acquisition despite being bounded/satisficing. (Wait, need to refine this to match their specific arguments).
