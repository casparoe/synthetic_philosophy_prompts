      *   Marcus (Critic): Evidence against his critique (i.e., evidence *for* Orthogonality/IC in bounded agents) = A bounded agent that *fails* to satisfice and instead maximizes resources despite a threshold goal. Or, evidence that self-modification *stabilizes* arbitrary values. Let's go with: A self-modifying agent that retains an arbitrary terminal goal despite having the capacity to rewrite it for efficiency.

