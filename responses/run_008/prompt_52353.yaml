              *   Defender needs evidence that intelligence *does* constrain goals.
              *   Critic needs evidence that bounded agents *do* converge instrumentally despite satisficing/underspecification.

  3.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I include the "teleology" argument for the Defender? Yes, need to make sure the Defender explicitly says "You're assuming intelligence has a telos."
      *   *Check:* Did I include the "rewrite criteria" argument for the Critic? Yes, the idea that the metric for self-improvement is itself a value judgment.
      *   *Check:* Did I include the "goal-space vs. training process" clash? This is crucial for the ending.
