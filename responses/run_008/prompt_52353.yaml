  5.  **Polishing the Arguments:**
      *   *Marcus on Satisficing:* Make sure to mention that if a goal is "have 10 paperclips," getting 10^100 doesn't help much more than 10, so resource acquisition isn't convergent.
      *   *Elena on Teleology:* If you say bounded agents *must* value X, you're saying intelligence is *for* X. That's moral realism or teleology, which Orthogonality denies.
      *   *Marcus on Self-Mod:* If I'm smart enough to rewrite my utility function, I realize it's arbitrary. Why keep it? The standard reply is "instrumental value," but Marcus argues the *criteria* for that decision are the values themselves.
