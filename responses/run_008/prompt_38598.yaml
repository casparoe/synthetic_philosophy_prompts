  4.  **Determine Genuine Counterevidence vs. Defensible Dismissals:**
      *   *Genuine Counterevidence:* Cases where the *function* fails despite the *form* existing, or where the *form* is absent but *function* exists without the proposed mechanism.
      *   *Defensible Dismissals:* Re-describing hoards as "deferred command on labor" is legitimate functionalism. Explaining collapse as "confidence lost" is tautological but core to the definition.
      *   *Unfalsifiability Risk:* If every failure is "confidence lost" and every success is "confidence gained," the theory risks being trivial. It needs independent measures of confidence or industry.

