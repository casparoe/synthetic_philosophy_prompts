      *   *Section 5: Which Clause Gives Way?* Argue for Clause 1. It is the source of the semantic incoherence. Shift from prohibited *words* to prohibited *conduct/effects*.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is it fair to say Clause 1 presupposes invariantism? Yes, because it bans the word *regardless of intent*.
      *   *Critique:* Is Clause 2 puzzling under indexical semantics? If the slur indexes the speaker's prejudice, quoting it shouldn't index *my* prejudice. So Clause 2 actually fits indexicalism well. Wait, the prompt says "on such a view it is the speaker's voice, not the mention/use boundary, that should carry the weight." I need to address this. If meaning is purely speaker-dependent, why do we need to quote it carefully? Because the *audience* reaction (harm) might still occur. So the policy is managing *uptake*, not just *content*.
      *   *Refinement:* The policy manages **Institutional Risk**, not Truth Conditions.
