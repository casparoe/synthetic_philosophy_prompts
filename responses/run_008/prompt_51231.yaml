      *   *Clause 2 (Quotation)* is essential for free inquiry/discourse.
      *   *Clause 3 (In-group)* is essential for autonomy/reclamation.
      *   *Conclusion:* Clause 1 should be modified from a "Word List" to a "Harm/Conduct Standard." However, practically, Clause 1 is the engine of enforcement.
      *   *Alternative:* If we must choose based on semantic coherence, Clause 3 creates the biggest tension with Clause 1. But ethically, Clause 3 is often defended.
      *   *Better Argument:* Clause 1 is the one that *ought* to give way (or soften) because it presupposes semantic invariantism which Clauses 2 and 3 contradict. Policies should move toward context-based assessment (Pragmatics) rather than token-based prohibition (Semantics).

