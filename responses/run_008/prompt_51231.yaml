          2.  *Exemption:* Quotation, testimony, classroom discussion (mention/use distinction).
          3.  *Reclamation/In-group Exception:* In-group use is permitted or treated more leniently.
      *   **The Problem:** This structure seems semantically inconsistent.
          *   If meaning is invariant (semantic derogation), Clause 3 contradicts Clause 1.
          *   If meaning is indexical/perspectival (speaker-dependent), Clause 2 is puzzling (why does *mention* matter if the *speaker* is the key variable?).
      *   **Questions to Answer:**
          1.  What semantic theory of slurs does this structure *presuppose*?
          2.  Reconstruct the implicit theory the three clauses presuppose.
          3.  Distinguish what the practice *strictly requires* vs. what it *merely tolerates*.
          4.  Identify which clause ought to give way if the presupposition proves untenable.
      *   **Alternative Hypothesis:** Might the practice track something non-semantic (harm, standing)? Could a non-semantic theory explain the word-list format?

  2.  **Analyze the Three Clauses against Semantic Theories:**

      *   *Clause 1 (Outright Ban):* Suggests the word itself carries toxic content. This aligns with **Semantic Invariantism** (e.g., Hom, Croom, some versions of Expressivism). The word *is* the weapon.
      *   *Clause 2 (Quotation/Exemption):* Suggests the *use* matters more than the *word*. This aligns with **Use/Mention Distinction**. It implies the harm comes from the *act* of deploying the slur against someone, not merely tokening the phonetic string. This challenges pure Semantic Invariantism (if the word is inherently toxic, quoting it should still be toxic).
      *   *Clause 3 (In-group Exception):* Suggests the *speaker's identity* matters. This aligns with **Appropriation/Reclamation** theories or **Perspectival/Indexical Semantics** (e.g., Potts, Nunberg). The derogatory force is neutralized by the speaker's social location.

      *   *The Tension:*
          *   If Clause 1 is true (Word = Bad), Clause 3 shouldn't exist (In-group Word = Bad).
          *   If Clause 3 is true (Speaker = Key), Clause 2 is weird. If the harm is about the speaker's authority to derogate, quoting a slur (Clause 2) by an out-group member should still be problematic if the focus is on the *speaker's stance*, yet policies often allow quoting for news/reporting.
          *   Actually, Clause 2 protects the *context* of reporting/education. Clause 3 protects the *identity* of the speaker.

  3.  **Reconstructing the Implicit Theory:**

      *   The policies don't seem to rely on a *single* semantic theory. They rely on a **Hybrid Pragmatic-Semantic Theory of Harm**.
      *   *Core Presupposition:* Slurs are **institutional speech acts**. They derive force from social power dynamics, not just lexical content.
      *   *Clause 1* treats the word as a *proxy* for harm (administrative efficiency).
      *   *Clause 2* acknowledges the **mention/use** distinction to preserve discourse *about* the harm without enacting the harm.
      *   *Clause 3* acknowledges **standing**. Only those with the specific social standing (the target group) can token the word without enacting the subordination inherent in the slur.
      *   *Synthesis:* The theory is **Normative Pragmatics**. The word is a tool of subordination. Using it *subordinates* (Clause 1). Quoting it *describes* (Clause 2). Reclaiming it *resists* subordination (Clause 3).

  4.  **Distinguishing Requirements vs. Tolerations:**

      *   *Strictly Required:* The prevention of subordination/harm (Clause 1). This is the core goal.
      *   *Merely Tolerated:* The specific mechanisms (word lists, in-group exceptions). These are heuristic shortcuts to manage the core goal.
      *   *The Tension:* The word-list format (Clause 1) is a blunt instrument. It assumes semantic toxicity. But Clauses 2 and 3 admit it's actually about pragmatics (context and speaker).

  5.  **Addressing the "Non-Semantic" Hypothesis:**

      *   The prompt asks: "Might the practice track something other than meaning — expected harm, or standing to derogate — and could a purely non-semantic theory explain why the codes are written as word-lists in the first place?"
      *   *Yes.* A **Normative/Institutional Theory** explains this best.
      *   *Why word lists?* Administrative necessity. It's easier to police tokens than illocutionary force. It creates a "safe harbor" rule.
      *   *Why the inconsistency?* Because policies are legal/HR documents, not philosophical treatises. They prioritize risk mitigation over semantic coherence.

