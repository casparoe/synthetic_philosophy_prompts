answer: |-
  Your observation cuts to the heart of a tension in applied linguistics and institutional governance: the gap between semantic theory and administrative enforcement. The three-part structure you identify (Prohibition, Exemption, Reclamation) is indeed ubiquitous, yet it is semantically unstable if viewed through the lens of a single, coherent theory of meaning.

  Here is a reconstruction of the implicit theory these codes presuppose, an analysis of what they require versus tolerate, and a determination of which clause is the weak link.

  ### 1. The Semantic Tension
  To understand what theory the codes presuppose, we must first see why standard semantic theories fail to account for all three clauses simultaneously.

  *   **Clause 1 (Outright Ban)** presupposes **Semantic Invariantism** (or Expressivism). It treats the slur as carrying derogatory content in its truth-conditional or expressivist meaning, invariant across contexts. The word *itself* is the weapon; therefore, tokening it constitutes the violation regardless of intent.
  *   **Clause 3 (In-Group Exception)** contradicts Invariantism. It presupposes **Contextualism** or **Perspectival Semantics**. It suggests the derogatory force is not in the lexical item but in the social relation between speaker and target. If the speaker belongs to the target group, the subordinating force is neutralized (reclamation) or never activated (lack of standing to derogate).
  *   **Clause 2 (Quotation Exemption)** complicates both. If Invariantism were true (Clause 1), quoting the word should still propagate its toxic content. If Contextualism were true (Clause 3), the exemption should rely entirely on the *speaker's* intent/context, not the grammatical distinction between *use* and *mention*. The fact that policies rely on the *mention/use* boundary suggests they view the harm as **performative** rather than purely semantic.

  ### 2. Reconstructing the Implicit Theory
  The codes do not actually presuppose a semantic theory of slurs. Instead, they presuppose a **Theory of Institutional Risk Management based on Presumptive Illocutionary Force.**

  In this implicit model:
  1.  **The Word as Proxy:** The designated word is treated as a *proxy* for a harmful speech act. The institution assumes that tokening the word (Clause 1) creates a high probability of subordination or harassment, regardless of the speaker's internal state. This is not a claim about *meaning*, but about *expected uptake* and *liability*.
  2.  **The Exemption as Safety Valve:** Clause 2 acknowledges that the *illocutionary act* of derogation requires more than just the word; it requires a direction of fit toward a target. Quotation or classroom discussion changes the illocutionary point from *derogating* to *reporting* or *analyzing*. This tracks a **Speech Act Theory** where the harm lies in the force, not the proposition.
  3.  **The Exception as Standing:** Clause 3 tracks **Normative Standing**. It acknowledges that the power to subordinate via language is asymmetric. An out-group member using the word enacts a history of oppression; an in-group member may be enacting solidarity or reclamation. The harm is not in the phonetics, but in the reinforcement of social hierarchy.

  **The Synthesis:** The implicit theory is **Normative Pragmatics**. It posits that slurs are tools of subordination whose "meaning" is actually their *capacity to harm* within a power structure. The code is not trying to define truth conditions; it is trying to regulate social outcomes.

  ### 3. Requirements vs. Tolerations
  To distinguish what the practice strictly requires from what it merely tolerates, we must separate the *goal* of the policy from the *mechanism*.

  *   **Strictly Required:** The prevention of **subordinating speech acts**. The core normative commitment is that no employee or user should be subjected to language that enforces their lower social status or creates a hostile environment. This is the non-negotiable ethical baseline.
  *   **Merely Tolerated:**
      *   **The Word List (Clause 1):** This is a heuristic. It is tolerated because it is administratively efficient, not because it is semantically accurate. It treats a pragmatic problem (harm) as a semantic one (forbidden tokens).
      *   **The In-Group Exception (Clause 3):** This is often tolerated as a concession to autonomy and reclamation movements, though it creates legal and logical friction with equality policies. It is a pragmatic accommodation, not a semantic necessity.
      *   **The Mention/Use Distinction (Clause 2):** This is tolerated as a necessary condition for free inquiry and reporting, acknowledging that *talking about* harm is distinct from *inflicting* harm.

  ### 4. The Non-Semantic Explanation for Word Lists
  You ask if a purely non-semantic theory could explain why codes are written as word-lists. **Yes.**

  A **Behavioral Risk Theory** explains the word-list format better than any semantic theory. Institutions are not truth-seekers; they are risk-mitigators.
  *   **Epistemic Closure:** Determining the *illocutionary force* of an utterance requires investigating intent, context, uptake, and social history. This is expensive and litigious. Banning specific tokens provides **administrative closure**. It creates a bright-line rule that minimizes discretion and liability.
  *   **Chilling Effect as Feature:** From a risk-management perspective, the "over-breadth" of Clause 1 (banning even non-derogatory uses) is a feature, not a bug. It creates a chilling effect that discourages the word's presence entirely, thereby reducing the probability of harm, even if it sacrifices semantic nuance.

  Therefore, the word-list format is not an assertion that the word is inherently evil (Semantic Invariantism); it is an assertion that policing the word is cheaper than policing the harm (Administrative Pragmatism).

  ### 5. Which Clause Ought to Give Way?
  If the presupposition (that word-lists effectively capture harm without semantic incoherence) proves untenable, **Clause 1 (The Outright Prohibition List) ought to give way.**

  Here is the justification:
  1.  **Semantic Incoherence:** Clause 1 is the source of the contradiction. It asserts invariant toxicity, which Clauses 2 and 3 explicitly deny by allowing the word in specific contexts or from specific speakers. Retaining Clause 1 forces the institution to lie about the nature of language (claiming the word is always bad when their own policy admits it isn't).
  2.  **Ethical Priority:** Clause 2 (Free Inquiry/Reporting) and Clause 3 (Group Autonomy/Reclamation) protect vital discursive and social interests. Clause 1 protects only administrative efficiency.
  3.  **The Path Forward:** Policies should shift from **Token-Based Prohibition** to **Conduct-Based Standards**. Instead of banning "Word X," policies should prohibit "Speech that subordinates, harasses, or creates a hostile environment based on protected characteristics."

  **The Consequence:**
  If Clause 1 yields, the burden of proof shifts. Instead of "You said the banned word, you are guilty," the standard becomes "You used language (including potentially this word) in a way that enacted harm." This aligns the policy with the **Normative Pragmatic** theory that Clauses 2 and 3 already hint at. It acknowledges that the slur is not a magic spell, but a tool whose moral weight depends on the hand that wields it and the purpose for which it is used.

  ### Summary
  The tripartite structure presupposes a **Normative Pragmatic** theory disguised as **Semantic Invariantism** for the sake of enforcement. It treats the word as a proxy for harm (Clause 1), while pragmatically admitting that harm depends on context (Clause 2) and standing (Clause 3). To resolve the tension, the institution must abandon the fiction of the "toxic token" (Clause 1) and regulate the **illocutionary act of subordination** directly. This would render the word-list obsolete but make the policy semantically coherent and ethically more robust.
