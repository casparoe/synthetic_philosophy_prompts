      *(Self-Correction during drafting)*: I need to be careful about "Infinite Analysis." That applies to *contingent* truths. Gödel applies to *necessary* truths (arithmetic). Leibniz thinks necessary truths are finitely analyzable. This is a major conflict. I must address this. Leibniz might argue that arithmetic isn't the whole of reasoning, or that the human mind approximates the divine intellect which *can* see the infinite proof. But Gödel says *no* formal system works. Leibniz needs to explain how the mind isn't a formal system. The Monad doctrine is the key here.

