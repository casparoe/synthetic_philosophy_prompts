      *   *Resolution:* The *Characteristica* is for *reasoning* (discursive thought), not *perception* (consciousness). Gödel targets reasoning. The Mill Argument targets consciousness.
      *   *Tension:* If reasoning can be mechanized, but Gödel shows reasoning *cannot* be fully mechanized (for truth), does Leibniz have to concede the *Characteristica* is limited?
      *   *Leibniz's Out:* The *Characteristica* handles *Truths of Reason* (necessary). Gödel applies to arithmetic (necessary). This is a clash. Leibniz believes all necessary truths are reducible to identities. Gödel says not all are provable in a fixed system. Leibniz might say: "The system isn't big enough, or the mind adds axioms." But if the mind is a machine, it has a fixed system. If the mind is a Monad, it can evolve/expand.
      *   *Refinement:* Leibniz distinguishes between the *art of discovery* and the *art of judgment*. The *Calculus* aids judgment. Gödel limits judgment within a fixed frame. Leibniz might argue the *Characteristica* isn't a single static formal system but a dynamic language of thought mirroring the divine intellect.

  5.  **Step 4: Mechanist Rejoinders & Speculation Check:**
