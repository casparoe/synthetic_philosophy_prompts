      *   *Leibniz's Reaction:*
          *   *Premise 1 (Gödel):* Leibniz would accept the mathematical result (if translated into his terms of analysis). He anticipates undecidability in contingent truths, but necessary truths? This is tricky. For Leibniz, *all* necessary truths are finitely demonstrable *in principle*. Gödel shows some aren't demonstrable *within the system*. Leibniz might distinguish the system from the intellect.
