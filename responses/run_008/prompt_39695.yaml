          *   *Speculative:* How Leibniz would interpret Gödel's theorem specifically (anachronism). Whether he distinguishes "provability in a system" from "demonstrability by a mind" in the way Lucas does.
      *   *Tension:* The core tension is between the *Calculus Ratiocinator* (reasoning is calculation) and the *Monad* (mind is simple, not composite). If reasoning is calculation, and calculation is mechanical, is the mind mechanical? Leibniz says No. Why? Because the *source* of the calculation (the Monad) is not the calculation itself.

