  # Project Title: The Dual-Entry Thesis: Disambiguating Moral Luck to Resolve the Control Principle Stalemate

  ## 1. Research Question
  The central research question is: **Does the Control Principle apply uniformly across all instances of moral luck, or does it govern luck in the deontic status of actions (wronging) differently from luck in the aretaic vindication of character (justification)?**

  Current discourse treats "moral luck" as a monolithic problem: either luck permeates moral assessment universally, or the Control Principle excludes it universally. This project interrogates the hypothesis that moral luck is not a single phenomenon but two distinct normative entries. Specifically, it asks whether luck that alters the *wrongness* of an act (e.g., the reckless driver who hits a pedestrian) is normatively distinct from luck that alters the *retrospective justification* of a life-choice (e.g., Gauguin's artistic success vindicating his abandonment of duty). The project seeks to determine if the Control Principle is valid for the former but invalid for the latter, or vice versa.

  ## 2. Context and Existing Positions
  Since the seminal interventions by Thomas Nagel and Bernard Williams, the moral luck debate has reached a theoretical stalemate. Incompatibilists defend the Control Principle (CP) by arguing that luck cannot affect moral worth, often dismissing resultant luck cases as errors in our psychological processing. Compatibilists argue that since luck inevitably shapes outcomes and character, the CP must be rejected or radically revised.

  However, both sides proceed as if "moral luck" refers to a unified category of interference. This proposal argues that this assumption is the source of the stalemate. Existing positions leave the research question open because they conflate two distinct mechanisms:
  1.  **Deontic Luck:** Luck that determines whether an action constitutes a moral violation (the Reckless Driver case).
  2.  **Vindicatory Luck:** Luck that determines whether a risky moral gamble is retrospectively justified by its outcome (the Gauguin case).

  Current literature typically subsumes both under "resultant luck" or "constitutive luck" without analyzing whether the *normative force* of luck operates identically in both. By treating the Driver and Gauguin cases as instances of the same problem, philosophers have forced a choice between a CP that is too rigid to account for vindication and a rejection of CP that is too permissive regarding wronging. This project posits that the debate feels static because participants are defending the CP against one type of luck while attacking it with the other, without recognizing the category distinction.

  ## 3. Work Plan (Two Years, Term by Term)

  ### Year 1: Conceptual Architecture and Taxonomy
  *   **Term 1:** Comprehensive literature review focusing on post-Nagelian attempts to categorize luck. I will map existing taxonomies (resultant, circumstantial, constitutive, causal) against the proposed Deontic/Vindicatory distinction to identify gaps.
  *   **Term 2:** Development of the "Dual-Entry Thesis." I will draft the core conceptual framework defining the boundaries between luck in *wronging* and luck in *vindication*. This involves rigorous analysis of the Reckless Driver and Gauguin cases to isolate the specific normative work luck is doing in each.
  *   **Term 3:** Completion of Draft Paper 1: "The Category Error in Moral Luck." This paper will argue that the stalemate arises from conflating the two entries. It will be submitted to a top-tier journal (e.g., *Ethics* or *Philosophy and Public Affairs*).

  ### Year 2: Testing, Implications, and Dissemination
  *   **Term 4:** Stress-testing the Dual-Entry Thesis against counterexamples. I will examine hybrid cases (e.g., negligent doctors, political leaders) to ensure the distinction holds under pressure. I will also investigate whether the CP holds for Deontic Luck but fails for Vindicatory Luck, or the reverse.
  *   **Term 5:** Drafting Draft Paper 2: "Control and Vindication." This paper will explore the implications of the thesis for blame, responsibility, and regret. It will address how we should revise our practices of moral assessment if the Dual-Entry Thesis is correct.
  *   **Term 6:** Finalizing the project output. I will integrate the papers into a cohesive monograph proposal or a third synthetic article. I will present findings at two major conferences and organize a one-day workshop to solicit feedback from senior colleagues on the viability of the distinction.

  ## 4. Success and Failure Conditions
  **Successful Outcome:**
  The project succeeds if it demonstrates that the Control Principle yields coherent results when applied to Deontic Luck but generates paradoxes when applied to Vindicatory Luck (or vice versa), and that acknowledging this asymmetry dissolves the primary objections raised in the Nagel/Williams debate. Success is measured by the publication of at least two peer-reviewed articles in leading journals and the establishment of the "Dual-Entry" terminology in subsequent literature.

  **Project Failure:**
  The project fails if the distinction between Deontic and Vindicatory luck collapses upon analysis—for example, if it turns out that vindication is merely a function of consequentialist wronging, or if the Control Principle must be accepted or rejected globally to maintain normative consistency. Failure would also occur if the distinction proves to be merely verbal, offering no new traction on the underlying metaphysical or ethical problems.

  ## 5. Risk Assessment
  The two-year scope is most at risk during **Year 2, Term 4 (Stress-Testing)**. The primary danger is that the distinction, while intuitively plausible, may not withstand complex hybrid cases where wronging and vindication are entangled (e.g., a risky surgery that saves a life but violates consent). Resolving these edge cases could require significant metaphysical work on the nature of "outcomes" versus "choices," potentially threatening the timeline. Additionally, there is a risk that historical exegesis of Williams and Nagel will reveal that they already implicitly recognized this distinction, which would undermine the novelty claim and require a pivot to a more exegetical rather than theoretical focus. To mitigate this, Term 1 will include a strict cutoff for literature review to ensure sufficient time for original theoretical construction.

  \answer{The project is designed to establish that the Control Principle governs luck in the deontic status of actions but fails to govern luck in the retrospective vindication of character, revealing the paradox of moral luck as a category error rather than a genuine ethical contradiction.}
