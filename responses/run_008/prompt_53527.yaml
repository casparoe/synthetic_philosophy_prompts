answer: |-
  Use speaking grammatical English as your carrying example and begin by asking them to state the rules of grammar they follow.

  This example works because every participant possesses the ability fluently yet none can recite the syntactic rules governing it, cleanly separating the capacity to perform from the capacity to articulate propositions. It must demonstrate that intelligence is present in the action itself, not just in prior contemplation, but it must not rely on gross motor skills that invite the 'muscle memory' dismissal which sank the bicycle example.

  **Session Structure (90 Minutes)**

  **0–20 mins: The Example and the Distinction**
  Write "Knowing-That" and "Knowing-How" on opposite sides of the whiteboard. Ask the group to list the rules of English grammar they follow when speaking. When they struggle, point out that they clearly *know how* to speak without *knowing that* specific rules apply. Use this to draw the distinction: knowing-that is possessing a fact; knowing-how is possessing a capacity. Head off the "Ryle thinks skills are mindless" misconception immediately here by emphasising that speaking is an intelligent, adaptive performance, not a robotic reflex. Ryle is not removing the mind from action; he is relocating it from a prior ghostly event to the public performance itself.

  **20–40 mins: The Reductionist Objection**
  Anticipate the claim that "knowing-how is just knowing-that plus practice." Head this off now by asking if memorising a manual on swimming equips one to swim. The CS students may try to reduce skill to algorithmic execution; counter this by noting that following a rule requires knowing how to interpret the rule, leading to an infinite regress if all knowing-how is reduced to knowing-that. Do not let this drift into a technical debate on regress; keep it focused on the phenomenological difference between reading a recipe and cooking the meal.

  **40–60 mins: The Hard Cases**
  Introduce the "station" case first to show linguistic ambiguity. Write "I know how to get to the station" on the board. Ask if this is a skill or a fact. Guide them to see it is often disguised knowing-that (knowledge of a route), which shows ordinary language is messy and doesn't always map neatly onto philosophical categories. Then, slot in the pianist case. Ask if the paralysed pianist still knows how to play. This tests the limits of Ryle's view. If knowing-how is a disposition to act, and she cannot act, does she lose the knowledge? Let them wrestle with this tension; it shows the theory isn't airtight without needing to resolve it definitively.

  **60–80 mins: Intellectualism and Category Mistakes**
  Keep the recent intellectualist arguments (Stanley and Williamson) out. Including the claim that knowing-how is secretly a species of knowing-that will turn a practical discussion into a semantic quibble about propositional attitudes, which is too technical for this crowd and eats too much time. Similarly, leave the "category mistake" framing out. It is jargon that confuses more than it clarifies for non-philosophers; simply talk about "logical geography" or "different kinds of talking" instead.

  **80–90 mins: Closing and Refusal**
  Openly refuse to explain the neural basis of skill. If the CS students or the nurse ask how the brain stores abilities versus facts, state firmly that neuroscience describes the substrate, but philosophy analyses the logic of the concepts, and conflating the two muddies the water. End with this closing question to test understanding: "Can you know how to do something you are physically incapable of doing?" If they answer correctly, they will have to nuance their view based on the pianist case rather than simply reciting the initial distinction.
