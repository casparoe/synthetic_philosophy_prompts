      *   *Philosophy View:* Knowledge requires *safety* or *sensitivity*. If the world were slightly different, would you still believe it?
      *   *The Gap:* ML metrics are *aggregate* (over a test set). Knowledge is *instance-level*. A calibrated model can still be Gettiered on a specific instance (right answer, wrong reason). ML vocabulary lacks a formal term for "instance-level causal justification" beyond attention maps or saliency (which are imperfect).
      *   *Verdict:* The residue is real. "Knowledge" as a policy implies a constraint on *how* the confidence was derived, not just the value of the confidence.

  5.  **Part 4: The Commitment**
      *   I need to pick one: Knowledge, Truth, or Belief.
      *   *Truth:* Impossible to implement (requires oracle). Discard.
      *   *Belief:* Too permissive. High coverage, high risk. Hallucinations.
      *   *Knowledge:* The sweet spot for reliable systems. It maps to "Selective Prediction with Robustness Guarantees."
      *   *Decision:* Pick the **Knowledge Norm** (interpreted as Calibrated Selective Prediction with Robustness/Out-of-Distribution detection).
      *   *Why:* In deployment, reliability > coverage. Users trust systems that abstain correctly over systems that guess confidently and wrong.
      *   *Loss:* You lose coverage (utility). You lose speed (computational cost of verification/conformal checks). You might abstain on "Lottery" cases that are practically useful.

