      *   *Assertion* = Model emission (outputting a label/proposition).
      *   *Abstention* = Rejection option (outputting "I don't know" or $\bot$).
      *   *Truth Norm* = "Emit only if True." In ML, this is the *oracle policy*. You can't implement this at inference time because you don't have ground truth ($y$) when predicting ($\hat{y}$). It's the *metric* (Accuracy on Selected), not the *policy*.
      *   *Belief Norm* = "Emit only if Believed." In ML, a model always has a distribution. If "belief" means $P(\hat{y}) > 0.5$ (argmax), this is the *Always Emit* policy (coverage = 100%). If "belief" means $P(\hat{y}) > \tau$, it's standard selective prediction. But philosophically, belief is often weaker than knowledge. Let's interpret "Rational Belief" as "High Confidence" without the extra conditions of knowledge.
      *   *Knowledge Norm* = "Emit only if Known." This implies Truth + Justification + *Something Else* (Anti-luck/Safety). In ML, this looks like a stricter threshold than belief, perhaps involving calibration guarantees or conformal sets, but specifically targeting *robustness* against Gettier-style accidents.

  3.  **Part 2: Specific Philosophical Moves in ML Terms**
      *   *Moore's Paradox ("p but I don't know p"):* In ML, this is outputting a label with low confidence or high entropy. "Class is Dog (prob 0.51) but I am not sure." It sounds incoherent because the emission implies a confidence threshold was met.
      *   *Retraction:* This is *post-hoc calibration* or *online learning*. If challenged (loss signal received), the model updates weights or adjusts the threshold. It's a feedback loop.
      *   *Lottery Cases:* "My ticket will lose" (Prob 0.999999). Philosophically, you shouldn't assert this as *known*. In ML, this is a high-confidence prediction that lacks *causal mechanism* or *feature support*. It's statistically sound but semantically brittle. Does ML have this? Yes, *spurious correlations*. A model might be 99.9% confident based on a watermark, but it doesn't "know" the content.

  4.  **Part 3: The Residue (What ML misses)**
      *   The user suspects it's the "anti-luck" condition (Gettier).
