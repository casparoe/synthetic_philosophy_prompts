      *   **Concept:** Heritability ($h^2$) is the proportion of phenotypic variance in a population that is attributable to genetic variance.
      *   **Key Misconceptions:**
          *   It applies to populations, not individuals.
          *   It is specific to a particular population in a particular environment at a particular time.
          *   High heritability does *not* mean the trait is unchangeable by environmental interventions (the "heritability vs. malleability" fallacy).
          *   Differences between populations (e.g., Country X vs. Country Y average height) cannot be inferred from within-population heritability estimates (the "between-group heritability" fallacy).

  3.  **Evaluate Student A's Answers:**

      *   **Part (a):** "It means about 80% of the variation in height among the teenagers in the sample is associated with genetic differences between them, and the rest with environmental differences. Heritability is a statistic about a population, not a fixed property of height itself."
          *   *Assessment:* This is excellent. It correctly identifies variance in a population, not absolute height. It notes it's a population statistic.
          *   *Verdict:* Fully right.

      *   **Part (b):** "No, Jordan is wrong. Heritability doesn't split any one person's height into a genetic chunk and an environmental chunk. It's about variation across the sample, so it can't be applied to a single individual like that."
          *   *Assessment:* This is also excellent. It directly addresses the individual vs. population misconception.
          *   *Verdict:* Fully right.

      *   **Part (c):** "It came out lower because in Country Y the environment varies more between families. When environmental differences are bigger, environmental variance makes up a bigger share of total variance, so the genetic share, which is what heritability measures, shrinks."
          *   *Assessment:* Correct. Heritability is $V_G / (V_G + V_E)$. If $V_E$ increases (due to unequal food/healthcare), the ratio decreases assuming $V_G$ stays roughly similar or doesn't increase proportionally more.
