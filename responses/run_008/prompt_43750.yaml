  7.  **Tone Check:** Ensure I'm not talking down. Use the user's metaphors (waves, clocks, glass floors). Keep it practical.

  8.  *(Self-Correction on "Cheapest Fix Cost")*: I need to make sure I explain *what* is lost or changed by the fix. "Cost" implies a trade-off.
