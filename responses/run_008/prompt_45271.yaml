answer: |-
  # Stage 1: The Logical Space

  Before assigning labels, we must identify the three axes along which your intuitions diverge. The positions in the literature are essentially clusters of answers to these three questions:

  1.  **The History Condition:** Does it matter *how* you came to be the person who made the choice? If your desires were engineered or determined by factors outside your control (genes, upbringing, neuroscientists), does that negate accountability?
  2.  **The Alternative Condition:** Does accountability require that you *could have done otherwise* in that exact moment? If a device or law of nature ensured you would do X, but you did X willingly, does the lack of an alternative path matter?
  3.  **The Desert Condition:** What is the point of holding someone accountable? Is it to give them what they fundamentally *deserve* (retribution/praise), or is it to regulate behavior, protect society, and facilitate relationships (forward-looking)?

  # Stage 2: The Sorting Instrument

  **Instructions:** Read each scenario and select the option that best matches your intuition. Do not overthink; go with your immediate reaction.

  **1. The Silent Monitor**
  Jones is deciding whether to vote for a tax hike. Unbeknownst to him, a neuroscientist has implanted a device in his brain. If the device detects Jones is *about* to vote against the hike, it will stimulate his brain to force him to vote for it. However, Jones votes for the hike on his own, for his own reasons. The device never activates.
  *   A. Jones is fully accountable; the device made no difference to what actually happened.
  *   B. Jones is not accountable; the presence of the device means he couldn't have done otherwise.
  *   C. Jones is partially accountable; his reasons mattered, but the setup undermines the situation.

  **2. The Unwilling Addict**
  Alex is addicted to a drug. He takes the drug every day. However, Alex hates his addiction. He desperately wishes he did not want the drug. He feels alienated from his own desire.
  *   A. Alex is accountable; he took the drug voluntarily.
  *   B. Alex is not accountable; his action conflicts with what he truly wants to want.
  *   C. Alex is accountable only if he had a realistic chance to quit previously.

  **3. The Engineered Reasoning**
  Sam commits a selfish, harmful act. It turns out neuroscientists programmed Sam's brain at infancy to reason exactly this way in this situation. Sam's reasoning process is normal for a human, but the *source* of that reasoning was external manipulation.
  *   A. Sam is accountable; his reasoning was normal, regardless of how it was installed.
  *   B. Sam is not accountable; the ultimate source of the action lies with the scientists, not Sam.
  *   C. Sam is not accountable only if the programming was irresistible.

  **4. The Twin Universes**
  Imagine two identical universes. In both, a person named Lee faces an identical choice with identical thoughts, history, and laws of nature. In Universe 1, Lee chooses A. In Universe 2, Lee chooses B.
  *   A. This is impossible; if everything is identical, the choice must be the same.
  *   B. This is possible, and Lee is accountable in both cases; the difference comes from Lee.
  *   C. This is possible, but Lee is not accountable in either case; the difference is just luck.

  **5. The Self-Made Character**
  Person A was shaped entirely by genes and upbringing to be kind. Person B had violent tendencies from genes and upbringing but spent ten years deliberately practicing empathy until it became second nature. Both perform a kind act.
  *   A. Person B is more praiseworthy; they overcame their history.
  *   B. Both are equally praiseworthy; the current character is what matters.
  *   C. Neither is truly praiseworthy; both are products of causal chains.

  **6. The Perfect Prediction**
  Suppose a supercomputer could predict every choice you will make ten years in advance with 100% accuracy, based on the current state of the universe and laws of physics.
  *   A. You still make free choices; the prediction just reads what you will do.
  *   B. Your choices are not free; the prediction shows they are fixed.
  *   C. It depends on whether the computer interferes or just watches.

  **7. The Purpose of Blame**
  When we blame someone for a harm, what are we primarily doing?
  *   A. Giving them a suffering they deserve because they chose wrongly.
  *   B. Signaling that their behavior is unacceptable to protect the community.
  *   C. Trying to change their future reasoning processes.

  **8. The Quantum Coin**
  Imagine a choice in your brain is not determined by prior causes but is settled by a random quantum event (like a coin flip).
  *   A. This makes the choice free; it breaks the chain of determinism.
  *   B. This makes the choice unfree; it's just randomness, not control.
  *   C. This is irrelevant; freedom is about reasoning, not physics.

  **9. The Gun and the Phobia**
  Case 1: A man hands over his wallet because a robber points a gun at him. Case 2: A woman stays in her house because a severe agoraphobia makes leaving feel impossible.
  *   A. Both are coerced; neither is accountable for staying/handing over.
  *   B. The man is coerced; the woman is accountable for her reaction to fear.
  *   C. The man is accountable (he chose life over money); the woman is not.

  **10. The Complex Robot**
  We build a robot so complex it can debate philosophy, reflect on its goals, and modify its own code. It harms a human to achieve a goal.
  *   A. The robot is accountable; it has the same structural control as a human.
  *   B. The robot is not accountable; it was programmed by humans.
  *   C. The robot is not accountable; it lacks a soul or biological origin.

  ---

  # Scoring Key and Map

  *Note: This key maps patterns of answers to philosophical positions. Where professional consensus breaks down, it is marked as **[Contested]**.*

  ### **Cluster 1: The Incompatibilists (History & Alternatives Matter)**
  *If you chose **B** on Q3 (Engineered) AND **B** on Q6 (Prediction).*
  You believe accountability requires that the causal chain originate with you in a way that determinism prevents.
  *   **If you chose B on Q4 (Twins) and A on Q8 (Quantum):** You are a **Libertarian**. You believe indeterminism is necessary for accountability.
      *   *Note on Leaves:* The quiz cannot distinguish **Event-Causal** vs. **Agent-Causal Libertarianism**. Both hold that indeterminism is required and that the agent is the source. The difference is metaphysical (substance vs. event causation), not verdict-based on cases.
  *   **If you chose C on Q4 (Twins) and B on Q8 (Quantum):** You are a **Hard Incompatibilist** (e.g., Pereboom). You believe neither determinism nor indeterminism allows for basic desert.
  *   **If you didn't answer Q4/Q8 but hold B on Q3/Q6:** You may be a **Hard Determinist**.
      *   *Distinction:* Hard Determinists believe the world *is* deterministic. Hard Incompatibilists believe free will is impossible *even if* the world is not. This quiz uses hypotheticals, so it leans toward detecting Incompatibilism generally.

  ### **Cluster 2: The Compatibilists (History/Alternatives Less Critical)**
  *If you chose **A** on Q3 (Engineered) OR **A** on Q6 (Prediction).*
  You believe accountability is compatible with causal determination or external history, provided internal structures are intact.
  *   **If you chose B on Q1 (Monitor):** You are a **Classical Compatibilist**. You hold that the ability to do otherwise (even if just hypothetically) is required. **[Contested: Many argue Frankfurt cases like Q1 refute this requirement.]**
  *   **If you chose A on Q1 (Monitor) AND B on Q2 (Addict):** You are likely a **Frankfurtian Hierarchical Compatibilist**. You focus on whether the agent identifies with their desires (second-order volitions).
  *   **If you chose A on Q1 (Monitor) AND A/C on Q2 (Addict) AND A on Q10 (Robot):** You lean toward **Reasons-Responsiveness** (e.g., Fischer & Ravizza). You focus on whether the mechanism of choice is responsive to reasons, not on history or alternatives. **[Contested: Whether manipulation cases like Q3 undermine this is live debate.]**
  *   **If you chose B or C on Q7 (Blame):** You are likely a **Dennettian/Pragmatist**. You reject "basic desert" (Q7A) in favor of forward-looking accountability. You might accept Q6A (Prediction compatible) but deny that this grounds retributive blame.

  ### **Cluster 3: The Skeptics**
  *If you chose **C** on Q5 (Character) AND **B** on Q6 (Prediction) AND **B** on Q10 (Robot).*
  You suspect that no amount of structural control is enough if the ultimate origin is not "up to you." This overlaps with Hard Incompatibilism but may stem from a broader skepticism about agency itself.

  ### **Incoherent or Unoccupied Combinations**
  *   **Q1B (Need Alternatives) + Q3A (History Doesn't Matter):** This is theoretically unstable. If the presence of a counterfactual intervener negates responsibility (Q1B), usually the presence of actual causal determination/engineering (Q3) should also negate it. This combination suggests a "Classical Compatibilist" who hasn't fully grappled with the manipulation argument.
  *   **Q4B (Twins Possible + Accountable) + Q8B (Randomness = Unfree):** This is the "Luck Objection" tension. If you think identical agents can choose differently *and* be accountable, you usually think the difference is *not* random (Q8A). Holding both suggests an unarticulated view of agent-causation that rejects the "luck" label but accepts the "divergence."

  ### **Contested Readings in the Key**
  1.  **Q1 (Frankfurt Case):** Classical Compatibilists argue Jones *could* have done otherwise (the device would have fired), so Q1B is a defensible position. Frankfurtians argue the *availability* of the device is irrelevant if unused.
  2.  **Q3 (Manipulation):** Compatibilists argue there is no relevant difference between Q3 and ordinary upbringing (Q5). Incompatibilists argue the *intentional design* by scientists makes it different. The quiz treats Q3 as a sorter, but this is the central battleground of modern literature.
  3.  **Q7 (Desert):** Many Compatibilists accept Q7A (Desert). Dennettians and Strawsonians argue Q7B/C is the only coherent basis for blame. This is a normative disagreement, not just descriptive.

  \answer{Question 3 (The Engineered Reasoning Case) does the most sorting work because it cleanly divides those who require ultimate sourcehood from those who accept structural control.}
