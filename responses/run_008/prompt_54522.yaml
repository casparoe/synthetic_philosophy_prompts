          2.  *Race:* Anachronistic. Need to highlight the criterion is psychological/soulish, not phenotypical.
          3.  *"Man of his time":* Dismisses the argument's structure. Need to focus on internal logic, not external apology.
          4.  *Rational Capacity:* "Perceive but not possess" is the key textual nuance.
