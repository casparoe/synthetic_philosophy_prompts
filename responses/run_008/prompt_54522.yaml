prompt: |-
  I'm taking a history of political thought course this semester (mostly third-years, mix of phil and poli sci people), and the professor assigned me to run the twenty-five minute seminar discussion on Aristotle's treatment of natural slavery early in Book I of the Politics. The others will have nominally done the reading but I expect half of them skimmed it at 1am. Don't explain the view to me -- I need a plan for how to run my session.

  My instinct is to open right with the definition of the natural slave and let the argument come out of that, but I suspect that's backwards and something about teleology/function has to be in place first, otherwise the whole thing sounds like arbitrary name-calling rather than a conclusion from his framework. Tell me whether that's right, and more generally what depends on what -- I want the dependency structure, like which piece makes zero sense until another piece is in.

  On the example to build the whole thing around: I was going to use the soul-rules-the-body analogy since it's vivid and it's his own, but I have a feeling it does something sneaky -- maybe it makes the view look like it only rides on an analogy, or maybe it smuggles in the conclusion before I've earned it? You tell me what the carrying example should be, what it needs to have going for it, and what it must NOT do.

  Misconceptions I'm bracing for, roughly in the order they'll show up: (1) Aristotle is just rubber-stamping Athenian slavery exactly as practiced, when my sense is he concedes that lots of actual slaves are slaves only by law/convention and shouldn't be -- is that reading right, and where do I head off the collapse into "he was fine with it all"? (2) natural slavery is a race theory, which I think is anachronistic in a specific way worth spelling out; (3) the "everyone was a man of his time" shrug, which lets the class feel moral without understanding anything. There's also what I think is a real subtlety: people assume natural slaves have zero rational capacity, when it's more like they can perceive reason without possessing it -- that difference actually does a lot of work and I bet they'll flatten it. Where in the sequence do I defuse each one, ideally without the whole session turning into a trial of Aristotle?

  Two more things. The class will really want to debate whether anyone actually IS a natural slave (i.e., whether the category is instantiated), but that seems like a different question from what the theory commits him to -- should I shut that down or is it secretly useful? And give me one question I can end with that would show whether they understood the structure of the view rather than just absorbed a feeling about it. Also tell me what I should openly refuse to get into in twenty-five minutes and say so out loud -- I'm guessing the whole later reception (medieval natural law versions, the colonial redeployments) is out, and maybe even the deep textual stuff about how the chapters fit together, but you tell me what the honest omissions are.
