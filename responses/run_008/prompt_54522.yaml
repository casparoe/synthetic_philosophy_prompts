      *   *Instinct 2: Soul-Body Analogy.* The user worries it smuggles in the conclusion or looks like *just* an analogy.
          *   *Verdict:* Valid worry. It's not *just* an analogy for Aristotle; it's an ontological claim about hierarchy. But for a 25-min seminar, treating it as the *justification* is risky because modern students reject the metaphysics immediately. It needs to be framed as the *structural model* of rule, not the proof of who belongs where.
      *   *Misconceptions:*
