answer: |-
  You are right to trust your instinct: starting with the definition of the slave is a trap. If you begin with "A slave is a living tool," the seminar will immediately devolve into moral outrage, and the philosophical architecture will be lost. You need the **teleological framework** before the **definition**, or the definition looks like a post-hoc rationalization for brutality.

  Here is the dependency structure, the strategy for the analogy, and a minute-by-minute battle plan for 25 minutes.

  ### 1. The Dependency Structure (The Logic Map)
  Write this on the board or project it immediately. This shows the class that the conclusion rests on prior premises.

  1.  **Teleology:** Nature does nothing in vain; everything has a *telos* (end/function).
  2.  **The Polis:** The state exists for the sake of the "good life" (not just life), requiring leisure and deliberation.
  3.  **The Household (Oikos):** The prerequisite unit for the Polis. It must solve the problem of subsistence so the citizen can deliberate.
  4.  **Relations of Rule:** To function, the household needs distinct types of authority (Master/Slave, Husband/Wife, Father/Child).
  5.  **The Distinction:** Rule is natural only if it benefits *both* parties (like soul/body).
  6.  **The Definition:** A natural slave is one whose *telos* is best fulfilled by being ruled by another's reason.

  **Teaching Point:** If you knock out #1 (Teleology), #6 collapses. If you knock out #5 (Mutual Benefit), #6 becomes mere exploitation. Make sure they see that the definition of the slave is the *last* step, not the first.

  ### 2. The Carrying Example: Soul-Body Analogy
  Your suspicion is correct: the soul-body analogy is dangerous.
  *   **The Risk:** It looks like a simile ("A is *like* B") which students can easily reject ("I don't feel like my body is my slave"). It also risks smuggling in the conclusion by assuming hierarchy is inherently good before proving who belongs where.
  *   **The Fix:** Do not present it as proof that slavery is good. Present it as Aristotle's **model of authority**.
  *   **What it MUST do:** It must illustrate the concept of *beneficial despotism*. The soul rules the body for the health of the whole organism. The body does not "lose" by being ruled; it achieves its function.
  *   **What it MUST NOT do:** It must not be used to *identify* who the slave is. You cannot look at a person and say, "He looks like a body, therefore he is a slave." The analogy justifies the *structure* of the relationship, not the *empirical assignment* of roles.

  **Instruction:** When you introduce the analogy, say: *"Aristotle isn't saying slaves are bodies. He's saying this is what legitimate, natural authority looks like: it aims at the good of the ruled, not just the ruler."*

  ### 3. The 25-Minute Flow

  **0:00–5:00: The Teleological Hook (Premises 1–3)**
  *   **Do not lecture.** Ask: *"Aristotle says the city exists by nature. What does 'by nature' mean here? Does it mean 'found in the woods'?"*
  *   Guide them to *telos*/function. An acorn is "by nature" an oak tree.
  *   **Pivot:** If the Polis is for the "good life" (deliberation), what is required to make that possible? (Answer: Freedom from menial labor).
  *   **Setup:** This creates the *need* for the slave, but not yet the *justification*.

  **5:00–15:00: The Argument & The Analogy (Premises 4–6)**
  *   **The Definition:** Now introduce the "living tool" definition.
  *   **The Analogy:** Deploy the Soul-Body analogy here. Ask: *"Why does the soul rule the body? Is it tyranny?"* (No, it's for health).
  *   **The Crucial Nuance (Rational Capacity):** This is where you defuse Misconception #4.
      *   Ask: *"If the slave has no reason, they are an animal. If they have full reason, they are a citizen. What is the middle state?"*
      *   Force them to find the text: *"Perceives reason but does not possess it."*
      *   **Why this matters:** This makes slavery a psychological/functional category, not just a labor category.

  **15:00–20:00: Misconception Defense (The "Wait, really?" Phase)**
  *   **Athenian Practice (Misconception #1):** Ask: *"Does Aristotle think everyone currently in chains in Athens is a natural slave?"*
      *   They should find the text where he admits many are slaves only by *convention/law* (e.g., prisoners of war).
      *   **Point:** Aristotle is actually *criticizing* current Athenian practice for enslaving people who shouldn't be. He is a radical, not a status-quo apologist (philosophically, if not politically).
  *   **Race (Misconception #2):** If it comes up, note that the criterion is *psychic*, not phenotypical. It's anachronistic to project 18th-century biology onto 4th-century metaphysics.
  *   **"Man of his Time" (Misconception #3):** If someone shrugs, say: *"We aren't here to pardon him. We are here to see if the engine works. If the teleology is false, does the argument survive?"*

  **20:00–23:00: The Empirical Trap (Instantiation)**
  *   **The Question:** *"Okay, the theory is coherent. But are there any natural slaves?"*
  *   **Your Move:** Do not let this become a sociological debate. Bracket it.
  *   **Say:** *"Aristotle admits this is hard to tell. But notice: if we find someone suffering under a master, does that disprove the theory?"*
  *   **Goal:** They should realize that for Aristotle, a "bad" master-slave relationship means we misidentified the slave, not that natural slavery is false. The theory is unfalsifiable by suffering, which is a weakness, but structurally consistent.

  **23:00–25:00: The Closing Question**
  *   You need a question that tests if they understand the *conditions* of the view, not just the content.
  *   **Ask:** *"What piece of evidence would Aristotle accept to prove that a specific person is NOT a natural slave?"*
  *   **Correct Answer:** Evidence of independent deliberative capacity (the ability to formulate their own *telos*).
  *   **Why:** This forces them to recall the "perceives but does not possess" distinction and the teleological framework.

  ### 4. Explicit Omissions (Say this out loud)
  To keep control, explicitly state what you are **not** doing. This prevents scope creep.
  *   **"I am not covering the reception history."** (No Locke, no Hegel, no American Civil War debates).
  *   **"I am not covering the textual disputes."** (No debate on whether Book I was written earlier/later, or if chapters were rearranged).
  *   **"I am not covering the status of women and children in depth."** (Mention they exist as other household relations, but focus on slavery to stay within time).

  ### 5. Summary of Tactics for the "Skimmers"
  *   **Board Work:** Keep the Dependency Structure (1–6) on the board the whole time. When they get lost, point to the board.
  *   **Textual Anchors:** When discussing rational capacity, make them find the specific line (1254b22 is the standard Bekker number for "perceives but does not possess"). This forces engagement with the text, not just vibes.
  *   **The "Apology" Block:** If the discussion turns to "Aristotle was bad," validate the moral intuition but pivot back: *"Agreed. But our job is to understand how a brilliant mind constructed this argument so we can spot similar structures elsewhere. How does he get from 'Nature' to 'Chains'?"*

  ### Final Check on Your Instincts
  *   **Teleology first?** Yes. Absolutely.
  *   **Soul-Body Analogy?** Use it, but frame it as "Model of Authority," not "Proof of Identity."
  *   **Athenian Practice?** Distinguish Natural vs. Legal slavery early (around minute 15) to prevent the "he's just a bigot" shutdown.
  *   **Empirical Instantiation?** Bracket it. Focus on the *criteria* for instantiation, not the *fact* of it.

  This plan keeps the philosophical structure central, respects the time limit, and anticipates the specific ways third-years tend to derail this text. Good luck.
