      *   **Task:** Run a 25-minute seminar discussion on Aristotle's *Politics* Book I (Natural Slavery).
      *   **Constraints:** Do *not* explain the view (they need a plan, not a lecture). Focus on dependency structure, examples, misconceptions, timing, and scope.
      *   **Tone:** Academic, strategic, pragmatic, slightly conversational but rigorous.
