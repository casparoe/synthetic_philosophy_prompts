  7.  **Final Polish:** Check for clarity, brevity, and authority. Ensure the "Engineering Representative" voice comes through (pragmatic, risk-aware). (Self-correction: Make sure the distinction between the Board Member's "documentation" demand and the proposed "behavioral capture" is sharp.)

