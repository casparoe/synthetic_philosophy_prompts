  # JOINT STATEMENT ON THE ANALYSIS OF DISPOSITIONS
  **Date:** October 26, 2023
  **Signatories:** The Reformed Conditional Analysis Working Group (RCA) & The Disposition Realist Working Group (DR)

  ## PREAMBLE
  Since the 1990s, philosophical discourse regarding dispositions has been polarized between those seeking to salvage the conditional analysis of dispositional ascriptions and those arguing that dispositions constitute a distinct ontological category irreducible to conditionals. This document represents the output of a good-faith adversarial collaboration. Our goal is not to force consensus where none exists, but to precisely map the contour of our agreement, isolate the substantive loci of disagreement, and record divergent predictions on novel test cases. We agree to avoid stipulative definitions designed to secure victory by fiat.

  ## PART I: AGREED CLAIMS
  We jointly affirm the following propositions:

  1.  **Failure of the Simple Conditional Analysis (SCA):** We agree that the classic biconditional (*x is disposed to M if and only if, if x were S, x would M*) is false. The extension of the left-hand side does not match the extension of the right-hand side.
  2.  **Validity of Finkish Cases:** We agree that Martin's electro-fink case demonstrates that an object can possess a disposition (e.g., conductivity) even if the corresponding counterfactual is false (due to the disposition being removed prior to manifestation).
  3.  **Validity of Masking Cases:** We agree that masked objects (e.g., a fragile glass swaddled in styrofoam) possess the disposition in question even if the manifestation is prevented by external or internal interferers.
  4.  **The Role of Intrinsic Properties:** We agree that dispositional ascriptions are typically grounded in the intrinsic physical structure of the object. A change in disposition usually requires a change in the object's intrinsic properties, not merely a change in the environment (barring finks/masks).
  5.  **Counterfactuals as Evidence:** We agree that true counterfactuals of the form "If S, then M" provide strong *evidence* for the presence of a disposition, even if they do not constitute the *meaning* or *essence* of the disposition.
  6.  **Rejection of Ensured Manifestation:** We agree that a glass which breaks when struck solely due to an external guardian's intervention (Case C, below) is not correctly described as "fragile," despite the truth of the counterfactual "If struck, it would break."

  ## PART II: TABLE OF DISAGREEMENTS AND PREDICTIONS
  The following table isolates our residual disagreements. For each disagreement, we identify the underlying crux, select one of the four mandated test cases (a–d) as the concrete battleground, and record the specific predictions and conditions for belief revision for each camp.

  | # | Residual Disagreement | Underlying Crux | Concrete Case & Predictions | Conditions for Belief Revision |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Modal Status of the Connection**<br><br>**RCA:** Disposition ascriptions *are* complex conditional claims (involving intrinsic bases and non-interference clauses).<br><br>**DR:** Disposition ascriptions report on real properties (powers/categorical bases) that *support* conditionals but are not identical to them. | **Is the counterfactual truth-maker the disposition itself, or is the disposition the truth-maker for the counterfactual?**<br><br>Does the analysis of the *term* exhaust the *ontology*? | **Case (a): The Stochastic Fink**<br>A fragile glass wired to a device that tosses a fair coin upon striking; on heads, brittleness is removed instantly.<br><br>**RCA Prediction:** The analysis returns "Not Fragile" or "Fragile to degree 0.5." The strict conditional "If struck, it would break" is false. Lewis's comparative analysis struggles to rank this against a standard fragile glass without arbitrary weighting.<br><br>**DR Prediction:** The glass is "Fragile." The intrinsic power exists until the coin toss removes it. The fink interferes with the *manifestation*, not the *possession* of the power at $t_0$. | **RCA:** Would revise if it were shown that ordinary language treats stochastic fink cases as clear instances of the disposition despite the conditional failure.<br><br>**DR:** Would revise if it were shown that "possession" of a power cannot be temporally separated from its manifestation conditions even in principle. |
  | **2** | **The Intrinsicness Constraint**<br><br>**RCA:** To save the analysis, we must exclude masks by fiat via an "intrinsic basis" clause. The disposition belongs to the object only if the basis is intrinsic.<br><br>**DR:** The distinction between intrinsic and extrinsic masks is ad hoc. A mask is a mask regardless of whether it is bonded to the surface or floating nearby. | **Is the boundary of the "object" metaphysically fixed or context-dependent?**<br><br>Is the "intrinsicness" clause a discovery about language or a device to save the theory? | **Case (b): The Intrinsic Mask**<br>A fragile glass with a shock-dispersing coating molecularly bonded to its surface.<br><br>**RCA Prediction:** Verdict depends on whether the coating counts as "intrinsic." If bonded, it may be intrinsic, implying the glass is *not* fragile (saving the conditional). If extrinsic, it *is* fragile (breaking the conditional). This ambiguity threatens the analysis.<br><br>**DR Prediction:** The glass is "Fragile." The coating masks the fragility regardless of bonding. The "intrinsic" clause is revealed as a device for saving the analysis by fiat, as our intuition about fragility remains constant while the metaphysical status of the coating shifts. | **RCA:** Would revise if a non-arbitrary, principled definition of "intrinsic" could be produced that aligns perfectly with dispositional intuitions across all masking cases.<br><br>**DR:** Unmoved by semantic redefinitions. Would only revise if a physicalist reduction of "power" was shown to require the intrinsic/extrinsic distinction. |
  | **3** | **The "In Virtue Of" Clause**<br><br>**RCA:** We can exclude the Guardian case by adding a clause: the manifestation must occur *in virtue of* the intrinsic basis.<br><br>**DR:** The phrase "in virtue of" is causal/metaphysical, not conditional. You cannot analyze "in virtue of" using only counterfactuals without circularity. | **Can causal explanation be reduced to counterfactual dependence?**<br><br>Is the link between basis and manifestation analytic or synthetic? | **Case (c): The Ensured Manifestation**<br>A glass that would break if struck, but only because a guardian shatters it upon impact.<br><br>**RCA Prediction:** The analysis can exclude this by specifying that the breaking must be *caused by* the intrinsic structure in the closest possible worlds. We predict this can be formalized without invoking primitive powers.<br><br>**DR Prediction:** The analysis fails. To exclude the guardian, you must invoke the *actual causal mechanism*. Since the mechanism is absent, the disposition is absent. This proves dispositions are causal bases, not conditional summaries. | **RCA:** Would revise if it were proven that "causation" cannot be analyzed counterfactually (e.g., via pre-emption problems).<br><br>**DR:** Would revise if a purely semantic account could explain why "in virtue of" tracks causal structure without referencing causal structure. |
  | **4** | **Probability and Propensity**<br><br>**RCA:** Probabilistic dispositions must be analyzed via probabilistic conditionals ("If S, it would *probably* M").<br><br>**DR:** Objective chances are real properties (propensities). They are not reducible to frequencies or conditional probabilities. | **Is objective chance a feature of the world or a feature of our descriptions?**<br><br>Does the disposition exist if the manifestation is fundamentally chancy? | **Case (d): Probabilistic Dispositions**<br>A radioactive atom disposed to decay within the hour (probability 0.5). There is no fact that it *would* decay.<br><br>**RCA Prediction:** Requires reforming the conditional to a probabilistic operator. Risk: This makes the analysis dependent on the interpretation of probability (Humean vs. Primitivist).<br><br>**DR Prediction:** This is a distinct embarrassment for conditional analysis. The atom has a real propensity. The lack of a "would" conditional shows the analysis is category-mistaken. | **RCA:** Would revise if probabilistic conditionals were shown to be incoherent without presupposing real propensities.<br><br>**DR:** Unmoved by linguistic usage. Would only revise if quantum mechanics were shown to be fully deterministic. |

  ## PART III: SUBSTANTIVE VS. VERBAL DISAGREEMENT

  We conclude by distinguishing the semantic from the metaphysical components of our debate.

  **1. Semantics of Disposition Ascriptions**
  We acknowledge a significant overlap regarding ordinary language. Both camps agree that in standard contexts, to call an object "fragile" implies that it would break if struck.
  *   **RCA Position:** This semantic link is constitutive. The meaning of "fragile" *is* the conditional (suitably reformed).
  *   **DR Position:** This semantic link is evidentiary. The meaning of "fragile" refers to a property, which *entails* the conditional in normal conditions.
  *   **Agreement:** Settling the semantics of ordinary language **will not move either camp** on the core metaphysical issue. The RCA camp admits that ordinary usage might be loose, but insists on a reconstruction for philosophical purposes. The DR camp admits ordinary usage tracks conditionals, but insists this is because speakers track powers implicitly.

  **2. Metaphysics of Powers and Properties**
  Here lies the substantive divide.
  *   **The RCA Camp** holds that a Humean mosaic of categorical properties plus laws is sufficient. Dispositions are not "add-ons" to reality. They are committed to the view that if the conditional analysis fails, we refine the analysis, not the ontology.
  *   **The DR Camp** holds that the world contains irreducible modal features (powers/propensities). They are committed to the view that if the conditional analysis fails, it is because reality is richer than the Humean mosaic allows.

  **3. Final Declaration on Belief Revision**
  We explicitly record that **no linguistic case alone can resolve the metaphysical disagreement.**
  *   The **DR Camp** states they would be unmoved by any number of thought experiments showing that ordinary speakers treat conditionals as synonymous with dispositions. They view the metaphysics of powers as a requirement of scientific realism, not lexical analysis.
  *   The **RCA Camp** states they would be unmoved by postulations of "primitive powers" that do no work other than making the conditional analysis true. They require that any ontological addition pay its keep in explanatory power beyond saving the intuition that the glass is fragile in the fink case.

  We sign this statement acknowledging that while we share a common vocabulary and agree on the failure of the Simple Conditional Analysis, we remain divided on whether the solution lies in the refinement of logic and language (RCA) or in the expansion of ontology (DR).

  **Signed,**

  *The Reformed Conditional Analysis Working Group*
  *The Disposition Realist Working Group*
