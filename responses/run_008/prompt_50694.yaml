answer: |-
  This is a high-leverage moment for philosophy of mind. The split-brain literature has reached an impasse not because of a lack of data, but because of conceptual ambiguity regarding what the data signifies. For a small team of philosophers working over three years without new empirical capabilities, the strategy must be to clear the conceptual underbrush that prevents existing data from being decisive.

  Below is a defended ordering of the research questions. I have introduced one critical missing question (**The Definitional Question**) which I argue is the necessary prerequisite for the others. I have deprioritized the **Generalization Question** relative to the others, as it is speculative without resolving the foundational issues first.

  ### 1. The Definitional Question (Phenomenal vs. Access Unity)
  **Rank:** 1 (Most Upstream)
  **Why it ranks here:** This is the conceptual bottleneck of the entire field. Current debates (e.g., Bayne vs. Schechter) often talk past one another because one side defines "unity" as *phenomenal* (what it is like to be the subject) and the other as *access* (information availability for report/action). You cannot count subjects (Q1) or evaluate evidence (Q4) until you specify which kind of unity is at stake.
  **Dependencies:** All other questions depend on this. If unity is merely access-based, the epistemic barrier is lower; if it is phenomenal, the barrier is higher.
  **Tractability:** Highly tractable for philosophers. It requires logical analysis of existing case descriptions and thought experiments, not new data.
  **What would move it:** A consensus paper or workshop output that successfully operationalizes "phenomenal unity" distinct from "functional integration" would solve this. If the field remains stuck on equivocation, this remains the priority.

  ### 2. The Epistemic Question (Q4)
  **Rank:** 2
  **Why it ranks here:** Once we define the target (Q1 above), we must determine if existing behavioral paradigms can hit it. The core problem is the "silence" of the right hemisphere (RH). Is the RH non-experiencing, or merely non-speaking? Philosophers can analyze the logic of non-verbal reporting (e.g., left-hand pointing, tactile matching) in the existing literature to determine if "absence of report" truly entails "absence of experience."
  **Dependencies:** Depends on the Definitional Question. If we are looking for *access* unity, behavioral report is sufficient evidence. If we are looking for *phenomenal* unity, report is insufficient.
  **Tractability:** Very high. This is classic epistemology of other minds applied to a specific dataset. It fits a 3-year timeline perfectly.
  **What would move it:** Discovery of a new, robust non-verbal paradigm in the archival literature that bypasses speech would lower the priority. Continued reliance on ambiguous verbal reports keeps it high.

  ### 3. The Counting Question (Q1)
  **Rank:** 3
  **Why it ranks here:** This is the core metaphysical payload ("One subject or two?"). It ranks third because it is the *conclusion* drawn from the definitions (Q1) and evidence (Q2). Attempting to answer this before settling definition and evidence leads to the stalemate currently plaguing the field. It also opens the door to "degrees of integration" rather than binary counting.
  **Dependencies:** Depends on Definitional and Epistemic questions. You cannot count what you haven't defined or detected.
  **Tractability:** Moderate. It requires rigorous metaphysical argumentation. It is suitable for philosophers but risks becoming unmoored from the case literature if not constrained by Q2.
  **What would move it:** A conceptual breakthrough showing that "subject" is a sortal term that admits of degrees (e.g., "partial subjects") would resolve the binary trap and lower the urgency.

  ### 4. The Subcortical Question (Q2)
  **Rank:** 4
  **Why it ranks here:** This is a specific anatomical hypothesis within the broader Counting framework. It asks if the brainstem provides a "unity floor." It is lower priority because it is a *model* of how the Counting Question might be resolved, not the question itself. It requires careful reading of neuroanatomy but remains conceptual (interpreting the *significance* of the anatomy, not mapping it).
  **Dependencies:** Depends on the Counting Question. If "subject" is defined cortically, subcortical unity is irrelevant.
  **Tractability:** Moderate. Requires philosophers to engage deeply with existing neuroanatomical texts. Risk of drifting into neuroscience proper must be managed.
  **What would move it:** New anatomical reviews suggesting subcortical pathways are more functionally significant than previously thought in commissurotomy patients would raise this priority.

  ### 5. The Normative Question (New)
  **Rank:** 5
  **Why it ranks here:** I am substituting this for the Generalization Question. If the Counting Question yields "two subjects," the ethical implications are profound (consent, responsibility, welfare). This is almost entirely neglected in the literature, which focuses on metaphysics. It is a high-impact area for conceptual work that follows naturally from Q3.
  **Dependencies:** Depends entirely on the Counting Question. If there is only one subject, normative complexity collapses.
  **Tractability:** High. This is applied ethics/philosophy of action. It allows the team to produce distinct, impactful outputs (e.g., policy briefs on patient care) alongside theoretical papers.
  **What would move it:** If the Counting Question strongly favors the "two subjects" view, this becomes urgent. If "one subject" wins, this becomes speculative.

  ### Deprioritized: The Generalization Question (Q3)
  **Reason:** This question asks if split-brain findings apply to normal brains. This is the "so what?" of the project. However, it is the most speculative. Generalizing from a pathological, surgically altered brain to a normal one is risky without first securing the metaphysics of the pathological case. It should be the *conclusion* of the grant, not a primary research strand.

