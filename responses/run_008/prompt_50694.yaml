havioral paradigm — would move it up or down. After the prose, append a brief structured summary as a JSON object with these fields: "ranking" (array of the questions in your order, each a short label), "criteria" (array of strings naming the criteria you used and one line on each), "most_upstream" (the label of the question the most others depend on, plus a one-sentence reason), "deprioritized" (label of the lowest-ranked question and one sentence on why), and "neglected_by_the_field" (one line naming a question or angle the literature underweights, if any).
