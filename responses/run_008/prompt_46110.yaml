      *   *Compatibilist View:* If causation is "counterfactual dependence" or "explanatory relevance," Exclusion dissolves.
      *   *Verdict:* It bites only if you assume a "transfer of energy" model of causation at the high level. If you adopt a difference-making model, it's manageable. I need to be clear about this.

