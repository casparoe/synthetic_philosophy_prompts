          *   Give an honest verdict on the Exclusion Problem.
          *   *Do not* scorecard existing theories; focus on the criteria.

  2.  **Deconstruct the Philosophical Landscape:**
      *   The core tension is between *Physical Causal Closure* (every physical event has a sufficient physical cause) and *Mental/Symbolic Causal Efficacy* (high-level states cause things).
      *   If both are true, we risk *Overdetermination* (the effect has two sufficient causes).
      *   If we deny Mental Efficacy to save Closure, we get *Epiphenomenalism* (high-level stuff is just along for the ride).
      *   If we deny Closure to save Mental Efficacy, we violate physics (magic).
      *   Hofstadter's Careenium is a perfect analogy for the Mind-Body problem without the baggage of consciousness (qualia). It's about *information* and *control*.
      *   Key concepts: Supervenience, Realization, Multiple Realizability, Counterfactual Dependence, Explanatory Autonomy.

  3.  **Drafting Candidate Requirements (Brainstorming):**
      *   Must agree physics is closed. (Non-negotiable for science journalism).
      *   Must allow high-level talk to be meaningful. (Non-negotiable for practice).
      *   Must explain why we don't say the thermostat "believes" it's cold, but we do say the brain "believes" it's raining. (The distinction between trivial and genuine agency).
      *   Must handle Multiple Realizability (the program could run on silicon, not just billiard balls).
      *   Must avoid saying the high-level *competes* with the low-level.
      *   Must explain "Downward Causation" without magic.
      *   Must distinguish between *causation* and *explanation*.

  4.  **Refining and Selecting the Final List:**
      *   *Requirement 1: Physical Closure.* Essential. Can't contradict physics.
