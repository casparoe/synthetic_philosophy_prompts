      *   *Requirement 3: Non-Competition.* The high-level cause shouldn't fight the low-level cause. They need to be compatible.
      *   *Requirement 4: Pattern Reality.* Not all patterns are real (e.g., "grue" vs. "green"). Need to distinguish robust simmballs from random noise.
      *   *Requirement 5: Counterfactual Sensitivity.* If the program were different, the outcome would be different.
      *   *Requirement 6: The Thermostat Test.* Distinguish simple feedback from genuine representation/goals.

      *Let's consolidate these into a tighter, more philosophical set.*

      1.  **The Conservation Constraint (Physical Closure):** Micro-physics is fixed.
      2.  **The Difference-Making Constraint (Counterfactuals):** High-level changes must map to outcome changes.
      3.  **The Realization Constraint (Multiple Realizability):** The causal power must belong to the pattern, not just the specific stuff.
      4.  **The Non-Competition Constraint (Exclusion):** High-level and low-level causes shouldn't be rivals.
      5.  **The Robustness Constraint (Pattern Ontology):** Distinguish real simmballs from accidental clusters.

  5.  **Addressing the "Exclusion Problem" (The Crunch Point):**
      *   The user specifically asks for an honest verdict on whether Causal Exclusion is a real blocker or based on rejectable assumptions.
