          *   **Application:** Run the procedure on three specific candidates:
              1.  Number of beneficiaries reached per dollar.
              2.  Median time from application to grant decision.
              3.  Percentage of staff who report high job satisfaction.
          *   **Tone/Style:** Direct, vivid, unhedged on failures (especially the one the director won't like).

  2.  **Deconstruct the Theory (Mental Sandbox):**
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure."
      *   *Specification Gaming (ML):* Reward hacking, wireheading, side effects.
      *   *Campbell's Law:* Similar to Goodhart, focuses on social indicators.
      *   *Practical Translation:* How do we stop people from cheating the system without stopping them from working?
      *   *Key Vetting Concepts:*
          *   Alignment (Does it match the goal?)
          *   Observability (Can we see the *real* outcome?)
          *   Cost of Gaming (Is it harder to game than to achieve?)
          *   Unintended Consequences (What bad behavior does this incentivize?)
          *   Redundancy (Do we have a check against this?)

  3.  **Drafting the Procedure (The "Metric Stress-Test"):**
      *   *Constraint:* Must fit in a one-hour meeting. Needs to be fast and decisive.
      *   *Structure:* 5 Steps.
      *   *Step 1: The Goal Link.* (Is it actually measuring the value?)
      *   *Step 2: The Gaming Simulation.* (How would *I* cheat this?)
      *   *Step 3: The Verification Cost.* (Is checking the truth too expensive?)
      *   *Step 4: The Negative Incentive.* (What good thing gets sacrificed?)
      *   *Step 5: The Sunset Clause.* (When do we kill it?)
