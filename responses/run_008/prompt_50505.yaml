      *   *Judgment Calls:* Risk tolerance, strategic priority vs. metric accuracy.
      *   *No-Metric Scenario:* Use a "Dashboard of Weak Signals" instead of a single target.

  4.  **Running the Procedure on the Candidates:**

      *   *Candidate 1: Beneficiaries reached per dollar.*
          *   *Goal:* Efficiency + Impact.
          *   *Gaming:* Count anyone vaguely touched. Reduce service depth to increase breadth. "Zombie" beneficiaries.
          *   *Verdict:* High risk. Classic Goodhart.
          *   *Director's Reaction:* Won't like hearing this is useless/dangerous because it looks like "efficiency."

      *   *Candidate 2: Median time from application to grant decision.*
