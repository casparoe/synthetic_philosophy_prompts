          *   *Verdict:* Manageable but needs safeguards (e.g., track rejection rates alongside).
          *   *Status:* Imperfect but usable with guards.

      *   *Candidate 3: Percentage of staff high job satisfaction.*
          *   *Goal:* Retention/Culture.
          *   *Gaming:* Pressure staff to answer surveys positively. Ignore legitimate complaints to keep scores up. Hire only "happy" people (selection bias).
          *   *Verdict:* Dangerous for culture. Creates silence.
          *   *Status:* High risk, but maybe different from #1.
          *   *Decision:* I need to make sure *one* fails vividly. Candidate 1 is the most classic "efficiency trap." Candidate 3 is the "toxic positivity trap." Let's make Candidate 1 the hard fail because it directly impacts the mission (grantees/beneficiaries) whereas staff satisfaction is internal. Actually, the prompt says "I expect at least one of these to fail... in a way my director will not want to hear." Directors usually love "beneficiaries per dollar" because it sounds fiscally responsible. Killing that metric will be the hard truth.

  5.  **Refining the Output:**
