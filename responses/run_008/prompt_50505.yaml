      *   **Problem:** Recurring failure of performance metrics due to gaming (Goodhart's Law/Specification Gaming).
      *   **Goal:** A practical, actionable procedure for vetting metrics in a one-hour leadership meeting.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Kill criteria (instant rejection).
          *   Judgment calls (escalate to leadership).
          *   Distinction between "imperfect" and "exploitable."
