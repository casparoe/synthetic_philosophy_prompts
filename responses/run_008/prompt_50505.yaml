answer: |-
  # The Metric Stress-Test Protocol (MSTP)

  **Purpose:** To distinguish between metrics that are *noisy* (imperfect but safe) and metrics that are *toxic* (exploitable and dangerous) before adoption.
  **Timebox:** 60 Minutes.
  **Participants:** Leadership Team + 1 Frontline Staff Member (mandatory for reality-checking).
  **Rule:** If a metric triggers a **Kill Condition**, discussion stops. The metric is dead.

  ---

  ## Part 1: The Procedure

  ### Step 1: The Causal Link (10 Minutes)
  **Question:** "If this number goes up, does the actual mission outcome *necessarily* improve, or can the number go up while the mission stays flat?"
  *   **Sufficient Answer:** A direct causal chain where improving the metric requires improving the underlying value.
  *   **Kill Condition:** The metric can be improved by *reducing* effort on the actual mission (e.g., increasing speed by rejecting everyone).
  *   **Judgment Call:** If the link is indirect but correlated (a proxy), leadership must explicitly accept the "drift risk."

  ### Step 2: The Adversarial Simulation (15 Minutes)
  **Question:** "Assume your bonus depends entirely on hitting 110% of this target next quarter. How do you hit it without doing the actual work?"
  *   **Sufficient Answer:** The only viable strategies require genuine work or carry high risk of detection.
  *   **Kill Condition:** A team member can describe a low-effort, low-risk method to game the metric within 2 minutes.
  *   **Judgment Call:** If the gaming method is possible but requires breaking the law or obvious fraud (high risk), it is "Imperfect," not "Exploitable."

  ### Step 3: The Verification Cost (10 Minutes)
  **Question:** "How much effort does it take to audit whether a single data point is true versus generating the data point?"
  *   **Sufficient Answer:** Audit cost is < 10% of generation cost.
  *   **Kill Condition:** Audit cost is higher than generation cost, or audit requires subjective judgment that can be argued away.
  *   **Judgment Call:** If audit is expensive but sampling is viable, leadership must commit budget to the audit function.

  ### Step 4: The Collateral Damage (15 Minutes)
  **Question:** "What valuable behavior will be sacrificed to optimize this number?"
  *   **Sufficient Answer:** No critical secondary behaviors are penalized, or they are protected by a counter-metric.
  *   **Kill Condition:** Optimizing this metric actively harms beneficiaries, staff, or long-term capacity (e.g., speed vs. quality).
  *   **Judgment Call:** Leadership must weigh the trade-off. If the trade-off is acceptable, the metric is "Imperfect." If the trade-off is hidden, the metric is "Exploitable."

  ### Step 5: The Sunset & Rotation (10 Minutes)
  **Question:** "When do we retire this metric?"
  *   **Sufficient Answer:** A fixed date (e.g., 4 quarters) or a trigger (e.g., when variance drops below 5%).
  *   **Kill Condition:** "We keep it until it stops working." (This guarantees Goodhart's Law).
  *   **Judgment Call:** Determining the replacement metric before killing the current one.

  ---

  ## Part 2: Decision Logic

  | Outcome | Definition | Action |
  | :--- | :--- | :--- |
  | **GREEN** | No Kill Conditions. Trade-offs are known and managed. | **Adopt.** Pair with a counter-metric. |
  | **YELLOW** | Kill Conditions triggered but deemed "Judgment Calls." | **Adopt with Guards.** Requires specific budget for audit or a paired counter-metric. Leadership signs off on risk. |
  | **RED** | Any **Kill Condition** met without a viable guard. | **REJECT.** Do not pass go. Do not collect funding. |

  **Protocol for "No Metric Passes":**
  If all candidates are RED:
  1.  **Do not select the "least bad" metric.** A toxic metric is worse than no metric.
  2.  **Switch to Qualitative Dashboard.** Report on 3 narrative case studies + 1 financial burn rate.
  3.  **Fund the Audit, Not the Target.** Allocate the monitoring budget to random deep-dive reviews rather than performance bonuses tied to numbers.

  ---

  ## Part 3: Worked Examples

  Here is the MSTP applied to your three candidates.

  ### Candidate 1: Number of Beneficiaries Reached Per Dollar
  *Goal: Efficiency and Scale.*

  **Step 1: Causal Link:**
  *   *Analysis:* Does serving more people per dollar mean more impact? Not necessarily. It could mean serving them poorly.
  *   *Status:* **Weak Proxy.**

  **Step 2: Adversarial Simulation:**
  *   *Simulation:* "I need to increase beneficiaries per dollar. I will stop serving hard-to-reach cases (high cost). I will count anyone who attended a webinar as 'served.' I will shorten the duration of service for each client."
  *   *Time to Game:* 30 seconds.
  *   *Status:* **KILL CONDITION.** (Low effort, low risk).

  **Step 3: Verification Cost:**
  *   *Analysis:* To verify a beneficiary was truly "served" requires contacting them or reviewing case files. To count them requires a spreadsheet entry.
  *   *Status:* **KILL CONDITION.** (Audit cost >> Generation cost).

  **Step 4: Collateral Damage:**
  *   *Analysis:* This metric punishes depth. It incentivizes cream-skimming (selecting easy clients) and abandoning complex cases that need the most help.
  *   *Status:* **KILL CONDITION.** (Actively harms mission).

  **Verdict:** **RED (REJECT)**
  **Director's Briefing:** "This metric is a mission hazard. It financially rewards staff for doing shallow work and abandoning the hardest cases. If we adopt this, we will look efficient on paper while failing the people who need us most. It is not merely imperfect; it is an invitation to fraud."

  ***

  ### Candidate 2: Median Time from Application to Grant Decision
  *Goal: Responsiveness and Operational Efficiency.*

  **Step 1: Causal Link:**
  *   *Analysis:* Faster decisions generally help grantees.
  *   *Status:* **Strong Link.**

  **Step 2: Adversarial Simulation:**
  *   *Simulation:* "I need to lower median time. I will auto-reject complex applications that require review. I will ask applicants for minor formatting corrections to 'pause' the clock if our system allows."
  *   *Time to Game:* 5 minutes.
  *   *Status:* **YELLOW.** (Possible, but requires rejecting work).

  **Step 3: Verification Cost:**
  *   *Analysis:* Timestamps are system-generated. Hard to fake.
  *   *Status:* **GREEN.**

  **Step 4: Collateral Damage:**
  *   *Analysis:* Quality of review may drop. Complex, high-impact grants might be discouraged.
  *   *Status:* **YELLOW.** (Trade-off exists).
  *   *Guard:* Must be paired with "Grant Success Rate at 1 Year" or "Appeal Rate."

  **Verdict:** **YELLOW (ADOPT WITH GUARDS)**
  **Condition:** Adopt only if paired with a quality counter-metric (e.g., % of grants requiring amendment within 6 months). If speed goes up and amendments go up, the metric is being gamed.

  ***

  ### Candidate 3: Percentage of Staff Who Report High Job Satisfaction
  *Goal: Retention and Culture.*

  **Step 1: Causal Link:**
  *   *Analysis:* Happy staff stay longer.
  *   *Status:* **Strong Link.**

  **Step 2: Adversarial Simulation:**
  *   *Simulation:* "I need high satisfaction scores. I will tell staff that low scores trigger budget cuts. I will schedule surveys immediately after a pizza party. I will ignore complaints to avoid 'negativity'."
  *   *Time to Game:* 2 minutes.
  *   *Status:* **KILL CONDITION.** (Coercion is easy).

  **Step 3: Verification Cost:**
  *   *Analysis:* Anonymous surveys are hard to audit for truthfulness.
  *   *Status:* **YELLOW.**

  **Step 4: Collateral Damage:**
  *   *Analysis:* This creates a culture of silence. Legitimate HR issues get swept under the rug to protect the metric.
  *   *Status:* **KILL CONDITION.** (Actively harms culture).

  **Verdict:** **RED (REJECT)**
  **Director's Briefing:** "Measuring satisfaction as a target makes it unsafe to be dissatisfied. This metric will not measure happiness; it will measure fear. We will get 100% satisfaction scores right before a mass resignation event. Use retention rates and exit interview themes instead. Do not target the survey score itself."

  ---

  ## Summary for Leadership

  1.  **Beneficiaries Per Dollar:** **REJECT.** It incentivizes abandoning the neediest clients. It is the most dangerous metric on the docket despite looking the most "fiscally responsible."
  2.  **Time to Decision:** **ADOPT WITH GUARDS.** Pair with a quality metric to prevent corner-cutting.
  3.  **Staff Satisfaction:** **REJECT.** Targeting this metric destroys psychological safety. Measure retention, not sentiment.

  **Final Recommendation:** If we must report on efficiency (Candidate 1), do not use a ratio. Use a **Cost Per Successful Outcome** (defined by a 6-month follow-up), even if the data lags by a year. A lagging truth is better than a real-time lie.
