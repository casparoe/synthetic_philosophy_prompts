      *   *For (c):* Adopt a "Time-Slice" or "Pragmatic" view. We treat temperament as part of the person for whom we hold them responsible, even if they didn't choose the temperament. (The "Constitutive Luck" problem).
      *   *For (d):* Frame it as a "Humanitarian Constraint" on LE, not part of LE itself.

