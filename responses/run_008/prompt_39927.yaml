  **The Heterophenomenology Lab**

  **Materials:** Projector, laptop, 12 sheets, pens, whiteboard.
  **Roles:** 4 Subjects (brief 1 Plant privately), 8 Investigators.

  **Procedure (40 mins)**
  1.  **Stimulus (5 mins):** Flash a slide for 200ms containing 10 common objects (e.g., cup, key, shoe). Subjects view; Investigators turn away.
  2.  **Reporting (10 mins):** Subjects write every detail they recall. Investigators collect sheets. The Plant includes one impossible item (e.g., 'a glowing orb').
  3.  **Modelling (15 mins):** Investigators interview Subjects. Goal: Build a 'World Model' on the whiteboard listing everything that *apparently* existed during the flash. Rule: You cannot verify against the slide. You only have the text. Treat reports as database entries.
  4.  **The Twist (10 mins):** Reveal the Plant's impossibility. Investigators must update the Model. Do they erase the orb? Or list it as 'Subject believes orb'?

  **Debrief (20 mins)**
  Map the game to Dennett:
  *   **The Report as Text:** When you collected sheets, you treated experience as data. The report isn't a window into the mind; it's a string of symbols to be interpreted.
  *   **The World Model:** The whiteboard list is the 'heterophenomenological world'. It is not reality; it is the theorised reality of the Subject.
  *   **The Plant:** Keeping the orb as 'Subject believes' is the core method. You rejected the claim as fact about the world, but accepted it as fact about the Subject's mind.
  *   **Conclusion:** We never access consciousness directly. We only have reports. Science studies the reports, not the qualia.

  **Limitations**
  *   **First-Person Gap:** In life, you are both Subject and Investigator. This game separates them, obscuring how you interpret your own inner text.
  *   **The 'Real' Slide:** Dennett argues there is no definitive 'real' experience to compare against, only better interpretations. The slide creates a false ground truth.

  **Predictable Failures**
  *   **Gaming:** Subjects may lie. *Fix:* Instruct Subjects to be sincere; only the Plant deviates.
  *   **Scepticism:** Investigators may discard the Plant's data entirely. *Fix:* Force a column on the whiteboard: 'Verified Objects' vs 'Reported Beliefs'.
  *   **Time Creep:** Interviews will overrun. *Fix:* Use a visible timer. Hard stop at 40 mins.

  **Notes for Facilitator**
  Use British spelling (colour, realise). Ensure the Plant knows their role beforehand. The key realisation is that a false report is still valid data about the reporter's state.

  **Detailed Facilitator Script**
  **Intro:** "We are building a model of a mind using only I/O logs. You cannot access the source code."
  **During Modelling:** If Investigators ask "Did you really see it?", redirect: "Record what they say they saw, not what you think happened."
  **During Twist:** Ask: "If you delete the orb, you lose data about the Subject. If you keep it, you pollute the World Model. How do you schema this?"
  **Closing:** "Heterophenomenology isn't about doubting people. It's about recognising that their truth is data for your theory, not proof of the world."

  **Engineering Parallels**
  *   **Logs vs. State:** The report is a log file. The experience is the system state. You debug using logs, knowing logs can be buggy.
  *   **Data Integrity:** A corrupted log entry (the Plant) still tells you about the logging system, even if it doesn't describe the event.
  *   **Abstraction:** The whiteboard is an abstraction layer. It hides the messy hardware (brains) to present a clean interface (behaviour).

  **Preparation**
  Print the stimulus list for yourself only. Brief the Plant via email beforehand to avoid suspicion. Ensure the room has a clock visible to all. If the group is larger, add more Investigators, not Subjects. If smaller, reduce Subjects to 3.

  **Contingency**
  If the Plant is discovered early, abort and debrief immediately on why the data was treated as suspicious. If Investigators refuse to record the orb, ask them to write down *why* they excluded it. That justification is itself heterophenomenological data about the Investigators.

  **Final Check**
  Ensure you emphasise that Dennett isn't saying consciousness doesn't exist. He's saying we can't study it directly, only via this method. The activity proves that even 'wrong' data is useful if categorised correctly.
