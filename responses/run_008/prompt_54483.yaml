prompt: |-
  I'm the lead information designer at a state public-health agency. Nearly every week someone asks my team for a chart for a public report or a poster destined for a clinic waiting room: vaccination uptake by county, opioid deaths over a decade, smoking prevalence by age group. The charts we inherited from my predecessor are a mess of scaled-up people icons — one giant figure standing in for a million people — 3-D bars, and symbols whose size varies by whim. A few years ago I took a course in the history of design and became fascinated by Otto Neurath's ISOTYPE project, the picture statistics his Vienna team developed in the 1920s and 30s: a fixed vocabulary of pictograms, quantities shown by repeating identical symbols at a fixed unit value rather than by scaling a single figure, and strict consistency across charts, all in service of Neurath's conviction that a disciplined visual language could be read and compared by ordinary people — including across language barriers — in a way that words, which divide, cannot. His team had a rulebook; I have a folder of inconsistent charts and a communications office with opinions.

  Please turn Neurath's principles into a procedure my designers can actually run on each incoming chart request. The constraints are real: it has to be executable in the half hour between a request landing and the kickoff meeting, by junior designers with no statistics background, with sign-off from the epidemiologist who owns the data. The procedure should spell out the questions to ask, in order; what counts as a sufficient answer to each; when a pictogram series is the right tool versus a plain bar or line chart; how to set the unit value when the numbers are awkward (a county with 41% uptake versus one with 92%, say); what to do when the required repetition of symbols becomes visually unusable; and — this matters most — where the procedure must stop and hand the decision to a person, because the question is one of judgment about audience or emphasis that the principles don't settle. Mark the steps that are judgment calls dressed up as procedure.

  Then run the procedure on three cases we actually face: (1) vaccination uptake across our fifteen counties, ranging from 92% down to 41%; (2) a decade-long opioid death series with yearly counts running from 30 to 700; and (3) a request from the communications office to make our infant-mortality numbers look better than the neighboring county's by choosing a flattering baseline year. Include at least one case where the procedure yields an answer the requester won't like, and be candid about what the procedure cannot do at all — in particular, whether it can settle anything once the disagreement is political rather than perceptual.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Lead Information Designer at a state public-health agency.
      *   **Problem:** Inherited a mess of inconsistent, misleading charts (3D bars, scaled icons, etc.). Need to implement Otto Neurath's ISOTYPE principles (fixed vocabulary, repeating identical symbols, strict consistency) to improve clarity and accessibility.
      *   **Constraints:**
          *   Executable in ~30 minutes (between request and kickoff).
          *   Usable by junior designers (no stats background).
          *   Requires sign-off from an epidemiologist (data owner).
          *   Must handle specific technical challenges (unit values, awkward numbers, visual clutter).
          *   Must identify where human judgment overrides procedure (especially political/ethical issues).
      *   **Deliverables:**
          1.  A step-by-step procedure (The "ISOTYPE Protocol").
          2.  Application of the procedure to three specific cases (Vaccination, Opioid Deaths, Infant Mortality manipulation).
          3.  Candid reflection on limitations (political vs. perceptual disagreements).

  2.  **Deconstruct Neurath's ISOTYPE Principles for Modern Context:**
      *   *Core Tenet 1:* One symbol = One fixed quantity (no scaling).
      *   *Core Tenet 2:* Repetition over scaling (5 symbols is 5x the value of 1 symbol).
      *   *Core Tenet 3:* Simplicity and standardization (limited color, clear icons).
      *   *Core Tenet 4:* Education/Accessibility (readable by laypeople).
      *   *Adaptation:* We can't literally use woodblock prints. We need digital vectors. We need to handle percentages and large numbers efficiently. We need to know when *not* to use pictograms (too many symbols = clutter).

  3.  **Drafting the Procedure (The "ISOTYPE Protocol"):**
      *   *Goal:* Fast, actionable, defensive against bad requests.
      *   *Step 1: Define the Message.* What is the single takeaway?
      *   *Step 2: Check the Data Type.* Categorical vs. Time Series vs. Part-to-Whole.
      *   *Step 3: Choose the Form.* Pictogram vs. Bar/Line. (Crucial decision point).
      *   *Step 4: Set the Unit Value.* How much does one icon represent?
      *   *Step 5: Handle Remainders.* What if the number isn't a perfect multiple?
      *   *Step 6: The "Clutter Check".* When does it become noise?
      *   *Step 7: The Ethical/Political Stop.* When to escalate.
      *   *Constraint Check:* Needs to be doable in 30 mins. Needs to flag judgment calls.

  4.  **Refining the Procedure Steps (incorporating constraints):**
      *   *Step 1 (Intent):* Ask "What action should the viewer take?"
      *   *Step 2 (Chart Type):* ISOTYPE is for *comparisons of quantity*. Time series usually need lines. Large ranges need bars.
      *   *Step 3 (Unit Value):* Needs a heuristic. Max value / 10 symbols?
      *   *Step 4 (Fractional Symbols):* ISOTYPE rule is "no partial symbols" usually, but modern adaptation allows halves if clear. Let's stick to strict Neurath: repeat whole units, group them. Or allow simple fractions (half, quarter) if defined. Let's go with "Group by 5s or 10s" to handle large numbers.
      *   *Step 5 (The Stop):* Explicitly mark where the designer must stop and ask a human.

  5.  **Developing the Three Cases:**

      *   *Case 1: Vaccination Uptake (41% - 92%).*
          *   Data: Percentages across 15 counties.
          *   Challenge: 15 categories is a lot for pictograms. Range is wide.
          *   Procedure outcome: Likely a Bar Chart is better, but if Pictogram is insisted, need a unit value (e.g., 1 syringe = 10%). 4.1 syringes vs 9.2 syringes.
          *   *Correction:* Neurath hated fractional symbols. Better to use 1 symbol = 5% or 10%. 41% = 8 symbols (40%) + note. Or just use bars. Let's make the procedure steer towards bars for >10 categories.
          *   *Decision:* Procedure suggests Bar Chart. If Pictogram, 1 icon = 10%.

      *   *Case 2: Opioid Deaths (30 to 700 over 10 years).*
          *   Data: Time series, large range.
          *   Challenge: 700 icons is too many. 30 icons is too few if unit is high.
          *   Procedure outcome: Time series = Line Chart. Pictograms fail here due to volume and trend focus.
          *   *Decision:* Procedure rejects pictogram. Recommends Line Chart.

      *   *Case 3: Infant Mortality (Political Manipulation).*
          *   Request: "Make us look better than neighbor by choosing baseline."
          *   Challenge: Ethical violation.
          *   Procedure outcome: This hits the "Ethical/Political Stop."
          *   *Decision:* Procedure flags this as a "Red Line." Cannot proceed without Director/Lead sign-off. Explicitly states the procedure *cannot* solve this, only surface it.

  6.  **Addressing the "Judgment Calls Dressed as Procedure":**
      *   Need to be meta-cognitive. Where am I pretending a rule exists when it's actually taste or strategy?
      *   Example: Defining "Visual Clutter." Is 50 icons too many? That's subjective.
      *   Example: "Audience Emphasis." Is the goal accuracy or motivation?

  7.  **Addressing the Limitations (Political vs. Perceptual):**
      *   Neurath believed design could solve social problems. He was partly wrong. Design can clarify, but it can't fix lying.
      *   Need to be honest: If the Comms Office wants to lie, a style guide won't stop them. Only hierarchy/ethics will.

  8.  **Review and Refine:**
      *   *Tone:* Professional, pragmatic, slightly weary but principled (matching the persona).
      *   *Formatting:* Clear headings, bold text for actionable items, distinct sections for the Procedure and the Cases.
      *   *Check Constraints:* 30-minute execution? Yes, if the questions are direct. Junior designer friendly? Yes, if flowchart-style logic is used.

  9.  **Final Polish:**
      *   Ensure the Neurath influence is clear (repetition, fixed unit, education).
      *   Make sure the "Stop" points are prominent.
      *   Ensure Case 3 is handled delicately but firmly (it's the most important test).

  *(Self-Correction during drafting)*: I initially thought about allowing fractional icons. Neurath actually preferred avoiding them to maintain the "counting" feel. However, for percentages like 41%, 8.2 icons is messy. I will advise rounding to the nearest unit or using a bar chart for precision. Let's make the procedure strict: If precision is needed > visual impact, use bars.
  Also, need to make sure the "30 minute" constraint is respected. The procedure can't be a 10-page document. It needs to be a checklist.

  Let's structure the response:
  1.  Introduction (acknowledging the role and the legacy).
  2.  The Procedure (The "ISOTYPE Triage Protocol").
  3.  The Three Cases (Applied).
  4.  The Limitations (The "Where This Breaks" section).

  *Wait, one more thing:* The prompt asks to "Mark the steps that are judgment calls dressed up as procedure." I need to explicitly label these within the text.

  *Refining Case 3:* The prompt asks for a case where the procedure yields an answer the requester won't like. Case 3 is the obvious candidate (Comms office wants to spin data). But Case 1 or 2 could also be unpopular if they demand a pictogram and the procedure says "no." I will make sure Case 3 highlights the *ethical* limit, while Case 1 highlights the *aesthetic/utility* limit.

  *Final check on Neurath:* Neurath's key innovation was the "transformer" (the person who turned stats into visuals) and the rule that *quantity is number of symbols, not size of symbol*. I must emphasize this.

  Okay, ready to write.s
answer: |-
  # The ISOTYPE Triage Protocol
  **Version 1.0 | State Public Health Agency | Design Systems Unit**

  **Purpose:** To standardize visual output for public health data, ensuring legibility for low-literacy audiences and consistency across departments, while filtering out requests that violate data integrity or visual best practices.
  **Time Budget:** 30 Minutes (Pre-Kickoff)
  **Operator:** Junior Designer (with Epidemiologist data sign-off)

  ---

  ## Part 1: The Procedure

  ### Step 1: Define the "Single Sentence"
  **Action:** Ask the requester: *"If the viewer remembers only one thing from this chart, what is it?"*
  **Sufficient Answer:** A single declarative sentence (e.g., "County A has the lowest vaccination rate," not "Here is the vaccination data for all counties").
  **Fail Condition:** If the answer is "They should see all the trends," proceed to **Step 2A**. If the answer is specific, proceed to **Step 2B**.
  > **[JUDGMENT CALL]** *Determining whether a dataset supports a single narrative or requires exploratory viewing is subjective. A designer might force a narrative where none exists to satisfy this step.*

  ### Step 2: Select the Form (The Neurath Test)
  **Action:** Match the data type to the visual form using the following matrix. Do not deviate without Lead approval.

  *   **2A (Exploratory/Complex):** If the user needs to see many variables or precise trends → **Standard Bar or Line Chart.** (ISOTYPE is for *impact*, not *precision*).
  *   **2B (Comparative/Impact):** If the user needs to compare quantities across categories (e.g., County vs. County) → **Proceed to Step 3 (Pictogram Consideration).**
  *   **2C (Time Series):** If the data is over time (e.g., 10 years) → **Line Chart.** (Pictograms obscure trends).
  > **[JUDGMENT CALL]** *The line between "impact" and "precision" is porous. A designer might deem a dataset too "complex" for pictograms simply because it is tedious to build, denying the audience a more accessible format.*

  ### Step 3: The Pictogram Feasibility Check
  **Action:** If Step 2B selected Pictograms, calculate the **Symbol Count**.
  1.  Identify the Maximum Value ($V_{max}$) and Minimum Value ($V_{min}$).
  2.  Propose a Unit Value ($U$) such that $V_{max} / U \approx 10$ symbols. (Neurath's rule: Keep counts readable without actual counting).
  3.  Calculate Total Symbols needed for all categories.
  **Constraint:** If Total Symbols > 100, **ABORT PICTOGRAM.** Use a Bar Chart. Visual clutter defeats the educational purpose.
  **Constraint:** If $V_{min} / U < 1$ (i.e., the smallest value is less than one symbol), **ABORT PICTOGRAM.** You cannot show a fraction of a person ethically. Use a Bar Chart.

  ### Step 4: Set the Unit and Handle Remainders
  **Action:** Fix the Unit Value ($U$).
  **Rule:** One symbol = One fixed quantity. **Never scale the size of the symbol.**
  **Remainders:** If a value is 41% and $U = 5\%$, you have 8.2 symbols.
  *   **Option A (Strict Neurath):** Round to nearest whole symbol (8 symbols = 40%). Add a text label for exact %.
  *   **Option B (Modern Adaptation):** Use a half-symbol for remainders > 0.5. Never use quarter symbols.
  **Decision:** Default to Option A for human counts (deaths, cases). Default to Option B for percentages.
  > **[JUDGMENT CALL]** *Rounding data introduces error. Deciding whether 41% rounds down to 40% (8 symbols) or up to 45% (9 symbols) changes the visual story. This step pretends rounding is a mechanical process when it is actually a statistical choice.*

  ### Step 5: The Ethical Stop (The "Red Line")
  **Action:** Review the request against the **Baseline Integrity Rule**.
  **Rule:** The zero-baseline must be visible. The time range must not be cherry-picked to exaggerate trends. Comparisons must use identical units and populations.
  **Trigger:** If the requester asks to "adjust the baseline," "start the axis at a higher number," or "exclude outlier years" to improve appearance → **STOP.**
  **Protocol:** Do not produce the chart. Flag the request to the Lead Designer and the Epidemiologist. Note: *"Request violates Baseline Integrity Rule."*
  > **[JUDGMENT CALL]** *This is not a judgment call; it is an ethical boundary. However, enforcing it requires political capital the procedure does not provide.*

  ---

  ## Part 2: Applied Cases

  ### Case 1: Vaccination Uptake (15 Counties, 41% – 92%)
  **Request:** "Show uptake by county for the clinic waiting room."
  **Run Time:** 12 Minutes

  1.  **Single Sentence:** "County F has critically low uptake compared to the state average."
  2.  **Form Selection:** Comparative (County vs. County). Pictogram considered.
  3.  **Feasibility Check:**
      *   $V_{max} = 92\%$, $V_{min} = 41\%$.
      *   Proposed Unit ($U$) = 10%.
      *   Max Symbols = 9.2 (Round to 9).
      *   Total Symbols = 15 counties $\times$ ~6 avg symbols = 90 symbols.
      *   **Pass:** Under 100 symbols.
      *   **Min Check:** $41\% / 10\% = 4.1$ symbols. Greater than 1. **Pass.**
  4.  **Unit/Remainder:** 1 Syringe Icon = 10%.
      *   County A (92%): 9 Syringes + Label "92%".
      *   County B (41%): 4 Syringes + Label "41%".
      *   *Note:* We use Option B (Half Symbol) for percentages. 41% becomes 4 symbols. 45% would be 4.5. We will round 41% down to 4 symbols to avoid implying precision the icon cannot hold.
  5.  **Ethical Stop:** No baseline manipulation requested.

  **Outcome:** **Approved.**
  **Design Spec:** 15 rows of syringe icons. Fixed size. 10% per icon. Exact percentages labeled below each row to compensate for rounding error.
  **Requester Friction:** The Comms Office wanted a map. The procedure vetoed the map because choropleth maps are often misread by low-literacy audiences (color gradient ambiguity). The procedure mandates categorical comparison (bars/icons) over geographic distribution for this specific data type.

  ### Case 2: Opioid Deaths (10 Years, 30 – 700 counts)
  **Request:** "Show the rise in deaths over the decade for the annual report."
  **Run Time:** 8 Minutes

  1.  **Single Sentence:** "Overdose deaths have increased significantly over the last 10 years."
  2.  **Form Selection:** Time Series.
      *   **Procedure Step 2C:** Time Series = Line Chart.
      *   **Reasoning:** Pictograms obscure trends. The eye tracks a line slope better than a staircase of icons.
  3.  **Feasibility Check (Hypothetical Pictogram):**
      *   $V_{max} = 700$. $U = 70$ (to get 10 symbols).
      *   $V_{min} = 30$. $30 / 70 = 0.4$ symbols.
      *   **Fail:** Minimum value is less than one symbol. We cannot show 30 deaths with a unit of 70 without using a fractional symbol smaller than half, which violates Step 4.
      *   **Alternative Unit:** $U = 10$. Max symbols = 70. Total symbols (sum of all years) $\approx$ 350.
      *   **Fail:** Exceeds 100 symbol clutter limit (Step 3).
  4.  **Ethical Stop:** None.

  **Outcome:** **Pictogram Rejected.**
  **Design Spec:** Simple Line Chart. Thick stroke. Clear markers at Year 1 and Year 10. Zero baseline enforced.
  **Requester Friction:** The Comms Office loves "humanizing" data with icons (e.g., little tombstones or figures). They will argue the line chart is "cold." The procedure overrides this: A cluttered chart is less human than a clear one. If they insist on icons, they must accept a Bar Chart of Year 1 vs. Year 10 only, losing the trend data.

  ### Case 3: Infant Mortality (The Political Request)
  **Request:** "Compare our infant mortality to the neighboring county. Start the timeline at 2018 instead of 2015 because 2015 was a bad year for us. Make sure our bars look shorter."
  **Run Time:** 5 Minutes (plus escalation time)

  1.  **Single Sentence:** "Our county is performing better than the neighbor." (This is the *desired* sentence, not the *data* sentence).
  2.  **Form Selection:** Comparative.
  3.  **Feasibility Check:** Passes symbol count.
  4.  **Unit/Remainder:** Standard.
  5.  **Ethical Stop:** **TRIGGERED.**
      *   **Violation:** "Start timeline at 2018... because 2015 was a bad year." This is cherry-picking (Truncating the axis/timeframe).
      *   **Violation:** "Make sure our bars look shorter." Implies scaling manipulation.
      *   **Action:** **STOP.** Do not open Illustrator.

  **Outcome:** **Escalated.**
  **Protocol:** Email sent to Lead Designer and Epidemiologist. Subject: *"Integrity Violation Request - Infant Mortality Data."*
  **Body:** *"Requestor asks to truncate time series baseline to exclude 2015 outlier. This violates Step 5 (Baseline Integrity). Data shows 2015-2023 trend. Request implies intent to mislead comparison. Awaiting guidance."*
  **Requester Friction:** High. The Comms Director will claim this is "strategic framing." The procedure cannot resolve this. It only exposes it.

  ---

  ## Part 3: Limitations & The "Human Gap"

  You asked me to be candid about where this procedure fails. Neurath believed that a disciplined visual language could solve social misunderstanding. He was an optimist. Here is where the protocol hits the wall:

  **1. The "Clutter" Threshold is Subjective**
  In Step 3, I set a limit of 100 symbols. Why 100? Why not 150? This is a judgment call dressed as a rule. A senior designer might know that 120 small icons work if arranged in a tight grid, but a junior designer will follow the rule and switch to a bar chart, potentially losing the emotional impact of the "human count." The procedure optimizes for *legibility*, but public health sometimes needs *shock*. The procedure dampens shock.

  **2. Precision vs. Persuasion**
  In Case 1, we rounded 41% down to 4 symbols (40%). Technically, that is inaccurate. If the threshold for funding is 45%, showing 40% vs 45% (5 symbols) looks like a massive gap, when it is actually 41% vs 45%. The procedure prioritizes visual consistency over statistical nuance. In a funding meeting, this rounding could cost the county resources. The procedure does not know the *consequence* of the error, only the *existence* of it.

  **3. The Political Wall (Case 3)**
  This is the most critical failure point. **The procedure cannot settle a disagreement that is political rather than perceptual.**
  When the Communications Office asks to truncate the axis, they are not making a design error; they are making a political calculation. They believe saving face is more important than raw accuracy.
  *   **What the procedure does:** It creates a paper trail. It forces the junior designer to say "No" based on authority (the Protocol) rather than personal opinion.
  *   **What the procedure cannot do:** It cannot force the Communications Director to tell the truth. If the Director overrides the Lead Designer and the Epidemiologist, the chart will be made anyway. Neurath's ISOTYPE was born in "Red Vienna," a socialist municipality that *wanted* to educate the working class. If the leadership does not want the public to know the truth, no amount of pictogram standardization will help.

  **Summary for the Team:**
  Use this protocol to protect yourselves from bad design and accidental misinformation. It will save you time on the small fights (3D bars, scaled icons). It will not win the big fights (political spin). For those, the protocol is not a shield; it is a flare gun. Fire it, document the response, and let the hierarchy decide if integrity is a value we actually hold.
