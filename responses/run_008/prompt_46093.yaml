answer: |-
  Here is the principle that unifies your cases, the one intuition you need to discard, and the verdict on your voting scenario.

  ### The Principle: Non-Moral Grounding

  **Moral testimony is permissible if and only if the testifier's epistemic advantage rests primarily on their access to the *non-moral facts* that ground the moral verdict, rather than on a superior *moral sensibility* regarding your own practical commitments.**

  This is a version of *Optimism* about moral testimony, but with a specific constraint to protect your agency. It distinguishes between deferring because someone knows *more about the world* (permissible) versus deferring because someone knows *better how to value your life* (impermissible).

  Here is how the principle maps onto your list, and which clause does the heavy lifting.

  **1. The Joke/Flatmate (Permissible)**
  *   **Clause:** Access to Non-Moral Facts.
  *   **Why:** Your flatmate saw Dan's face. The moral verdict ("that was nasty") is grounded in the non-moral fact ("Dan looked hurt"). You lacked the fact; she had it. You aren't deferring on morality; you're deferring on *what happened*.

  **2. The Joke/Dan (Permissible but Uneasy)**
  *   **Clause:** Access to Non-Moral Facts.
  *   **Why:** Dan knows the context of his life (non-moral facts). However, the unease you feel comes from the "should have known" part. That shifts the verdict from "this hurt me" (fact-based) to "you were negligent" (character-based). Your principle allows you to accept the impact, but the character judgment requires your own self-reflection. The unease is a warning signal that you are nearing the limit of deference.

  **3. The Memoir (Permissible — *See Correction Below*)**
  *   **Clause:** Access to Non-Moral Facts.
  *   **Why:** The author has privileged access to the facts of her upbringing. You are deferring on the *description* of the harm, which grounds the moral verdict.
  *   **The Correction:** You said this "bugs me — it feels like I'm carrying around a belief I didn't earn." **This is the intuition you must give up.**
  *   **Why it's wrong:** You are conflating *psychological effort* with *epistemic justification*. If the testifier is credible, trusting them *is* a rational way to earn a belief. The "unearned" feeling is a philosophical prejudice (a fetish for individualism) that ignores how much of our knowledge rightly comes from trust. If you trust her account of the facts, the moral belief is earned *through* that trust. Drop the bug; keep the belief.

  **4. The Vegan Friend (Permissible)**
  *   **Clause:** Access to Non-Moral Facts (Complexity).
  *   **Why:** You say you "understand even less of what's going on." This refers to the supply chain, the slaughter methods, the environmental data. These are non-moral facts. Your friend has done the empirical legwork. You share the moral premise (suffering is bad); they provide the factual major premise (factory farming causes suffering). This is why it feels *more* acceptable than the memoir: it leads to action based on data, not just inert belief about a stranger's past.

  **5. The Girlfriend (Impermissible)**
  *   **Clause:** Superior Moral Sensibility on Practical Commitments.
  *   **Why:** This is the anchor case. Whether a relationship is "good" or "bad" isn't just a sum of objective facts; it depends on *your* emotional engagement, *your* tolerance, and *your* commitment. Your flatmate might have the facts, but the *verdict* requires a first-personal stance. To break up purely on her word is to surrender your practical agency in the most intimate domain. Her advantage here is moral sensibility, not factual access. This violates the principle.

  **6. The Seminar (Contextually Impermissible)**
  *   **Clause:** Pedagogical Goal vs. Truth.
  *   **Why:** In a seminar, the goal isn't just to hold true beliefs, but to *demonstrate understanding*. Saying "I'm with Kieran" fails the specific epistemic goal of the context (learning to reason). It's not a moral failure, but it is an epistemic failure relative to the activity.

  ---

  ### The Voting Case

  Now, applying the **Principle of Non-Moral Grounding** to your election scenario.

  **Scenario A: Blind Deference ("Friend says policy is unjust, I vote on that")**
  *   **Verdict:** **Problematic (Borderline Impermissible).**
  *   **Reasoning:** Voting is a civic exercise of practical agency, similar to the Girlfriend case but in the public sphere. If your friend says the policy is *unjust*, that is a moral verdict. If their advantage is purely moral sensibility ("I just feel it's wrong"), you are outsourcing your civic conscience. This violates the principle.
  *   **Exception:** If their claim is shorthand for non-moral facts you lack (e.g., "I've read the bill, it secretly bans X"), then it is permissible. But if it is purely "This is unjust," you are deferring on the moral sensibility itself. For a vote, you should own the moral verdict.

  **Scenario B: The Tie-Break ("I half-understand, let her decide")**
  *   **Verdict:** **Permissible.**
  *   **Reasoning:** Here, you have exercised your agency. You engaged with the material ("half-understood"). You have formed a partial judgment. The testimony is not *substituting* for your judgment; it is *completing* it. You are using their epistemic access to tip the scales on a matter where you have already done the groundwork of engagement. This preserves your constitutive agency as a voter while acknowledging your epistemic limits.

  ### Summary
  Your gut is mostly right, but your discomfort with the **Memoir** case is a philosophical error—trust *is* a valid way to earn belief. Your discomfort with the **Girlfriend** case is your most important ethical insight: some moral truths require you to feel them yourself to be true *for you*.

  Stick to the **Non-Moral Grounding** principle. Defer on facts; decide on values. Defer on complexity; decide on commitment.
