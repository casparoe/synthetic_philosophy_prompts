  I'm taking a module this term called Ethical Theory, and we've just hit the moral testimony thing (the "should you just take someone's word for what's right?" debate), and I've been keeping a list of my actual gut reactions to cases so I can figure out where I stand for my essay. The problem is my gut seems to disagree with itself. Here's roughly the list:

  - My flatmate tells me that a joke I made at the pub on Friday actually really upset our friend Dan, and that it was a nasty thing to say. I hadn't clocked it at all, but I trust her read of Dan completely, so I accept it and apologise. Feels totally fine.
  - Dan himself tells me later that I should have known the joke would land badly, given what was going on in his life. Even though I don't think I could have known, I accept his moral verdict on the situation. Also fine? Though slightly less fine, somehow.
  - I read a memoir where the author says the way her parents raised her was wrong, in ways I can kind of see but couldn't articulate or defend. I come away believing her. This one bugs me — it feels like I'm carrying around a belief I didn't earn.
  - A vegan friend, who I know has looked into it properly, tells me factory farming is seriously wrong. I don't really work through the arguments myself, I just take his word and change my diet. Weirdly this feels MORE acceptable than the memoir one, even though the stakes are way higher and I understand even less of what's going on.
  - Same flatmate as the joke case — whose judgement I trust more than my own on anything personal — tells me my girlfriend treats me badly and I should end it. I honestly can't see it myself. If I broke up with her purely on her word, that feels like the worst one on this list, even though I'd be deferring to the person I trust most.
  - In seminar someone asks what I think of utilitarianism and I say "yeah, I'm with what Kieran said" without being able to add anything. Embarrassing, but I can't tell whether it's an actual moral/epistemic failure or just cringe.

  My tentative principle was something like: moral testimony is fine for filling in the details but not for the big verdicts. But that doesn't survive contact with the list — the factory farming one is a big verdict and I'm fine with it, while the joke one is a detail and the Dan follow-up one niggles at me. And I have a feeling "how much I understand" is doing work I can't pin down, because I understood plenty about my girlfriend's situation and still think deferring is bad.

  So: is there a single principle that gets these verdicts, or close? I want you to actually commit to one — state it properly, say which case forces which clause, and if it can't save one of my verdicts, tell me which one to give up and why it was wrong anyway. And then tell me what your principle says about a case I haven't decided on: at the last general election I basically took my politically-obsessed friend's word that a certain policy was unjust, and voted on that basis — on your principle was that fine, and is the answer different if I'd been voting on something I half-understood and just let her tie-break? Don't give me a survey of the options — pick a position and defend it, and say up front if you think one of my verdicts is just mistaken.
