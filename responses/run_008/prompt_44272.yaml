answer: |-
  This is an exceptionally precise philosophical intuition. You have effectively reconstructed a thought experiment that is currently a centerpiece in contemporary value theory, without having read the literature. That suggests your reaction isn't just "doomscrolling anxiety," but a robust intuition about how human value functions.

  Here is the breakdown of the concepts, where they match your experience, and where your specific description adds nuance.

  ### 1. The Activities: "The Afterlife Condition"
  **The Nearest Concept:** Samuel Scheffler's *Death and the Afterlife* (2013).

  You are describing almost exactly what philosopher Samuel Scheffler calls **The Afterlife Condition**. Scheffler runs a thought experiment very similar to yours: He asks us to imagine that while we will live our normal lives, the earth will be destroyed by an asteroid 30 days after our death.

  He argues that realizing this would undermine our confidence in the value of our current activities *now*. He calls this the "Afterlife Condition": the idea that our confidence in the value of our lives is contingent on the survival of humanity after we die.

  **The Label for the Activities:**
  Scheffler calls these **Future-Directed Projects**.
  A more precise term from action theory is **Transgenerational Intentionality**.

  **Where your description diverges/refines it:**
  *   **Legacy vs. Continuity:** You explicitly noted this isn't about "legacy" (being remembered). Scheffler agrees. Legacy is ego-centric (I want *my* name to survive). Transgenerational Intentionality is context-centric (I want the *world* in which my name had meaning to survive).
      *   *Example:* A scientist wants their cure to be used. If humanity ends, the cure isn't "forgotten" (legacy); the *concept of health* ceases to have a bearer. The activity loses its "uptake."
  *   **The 30-Year Gap:** Scheffler usually posits immediate extinction. Your scenario (extinction 30 years later, after your peers die) is actually more potent for your specific examples. A local history book isn't just for "humanity"; it's for the specific future community of that town. If the town ceases to exist in 2080, the book becomes a artifact without a community. This aligns with **MacIntyre's notion of a "Practice"**: activities that derive meaning from a tradition extending into the past and future. If the tradition stops, the practice collapses into mere behavior.

  ### 2. The "Extra Badness": Impersonal Value vs. Person-Affecting
  **The Nearest Concept:** The **Person-Affecting Restriction** (Parfit) and **Impersonal Value**.

  You asked: *Where does the extra badness live?*
  In ethics, the standard intuition is the **Person-Affecting View**: An outcome can only be "bad" if it is bad *for someone*.
  *   In your Scenario A (Humanity continues), no specific person is better off than in Scenario B (Humanity ends), because the people in Scenario A don't exist in Scenario B to compare notes.
  *   In Scenario B, no existing person is harmed (everyone lives to 80).

  If you feel Scenario B is worse, you are rejecting the Person-Affecting View. You are intuiting **Impersonal Value** (or **Axiological Value**). This is the idea that states of affairs can be better or worse in themselves, regardless of whether a specific subject experiences the difference.

  **The Specific Puzzle:**
  You are touching on a variation of the **Non-Identity Problem** (Derek Parfit), but specifically the **Intuition of Extinction**.
  *   **Standard Non-Identity:** "If I choose policy A, a different set of people will be born than if I choose policy B. So I haven't harmed the people in B, because they wouldn't exist otherwise."
  *   **Your Scenario:** This is the **Termination Problem**. It's not about *who* is born, but *that* birth stops.

  **Where the badness lives:**
  Philosophers who agree with you (like those in the **Longtermist** tradition, though you don't need to be one to accept the logic) argue the badness lives in the **Loss of Potential Value**.
  *   It is not a harm to a subject.
  *   It is a loss of *goodness* from the universe.
  *   Think of it like a library burning down. If no one is inside, no *person* is harmed. But something *valuable* is destroyed. You are viewing humanity not as a collection of individuals, but as a **Value-Generating Mechanism**. Shutting down the mechanism is bad, even if the current operators finish their shift safely.

  ### 3. The Split: Experiential vs. World-Involving Goods
  **The Nearest Concept:** **Hedonia vs. Eudaimonia** (and the **Experience Machine**).

  You noted that ice cream and music retain their appeal, while the history book and tree planting do not. This tracks a very real philosophical distinction.

  **The Distinction:**
  *   **Experiential Goods (Hedonic):** Ice cream, music, conversation. These are **self-intimating**. Their value is realized entirely within the conscious experience of the moment. They do not require a future to validate them. If you enjoy the ice cream, the value is captured.
  *   **World-Involving Goods (Eudaimonic/Meaningful):** Writing history, planting trees, saving for education. These are **teleological** (goal-directed) and **relational**. Their value depends on "uptake" by the world.
      *   A letter only functions as communication if there is a reader.
      *   A tree only functions as a shade-giver or carbon sink if there is an atmosphere and people to sit under it.
      *   Savings only function as security if there is an economy and a niece.

  **Philosophical Label:**
  Robert Nozick's **Experience Machine** thought experiment is the classic reference. He asks: If you could plug into a machine that gave you the *experience* of writing a great book, but you actually did nothing, would you do it? Most people say no.
  Why? Because we value **actually doing things** and **actually connecting with reality**, not just the feeling of it.

  Your intuition refines this: You value the *connection* part more than the *doing* part.
  *   **Term:** **Agency vs. patiency**. Pleasures are things you undergo (patiency). Projects are things you initiate (agency). Agency requires a world that responds. If the world ends, your agency hits a wall.
  *   **Term:** **Contributory Value** (Susan Wolf). In her book *Meaning in Life and Why It Matters*, Wolf argues meaning comes from "active engagement with projects of worth." Crucially, the "worth" must be independent of you. If the future (the locus of that worth) vanishes, the project loses its "worth" status, even if the "active engagement" remains.

  ### Summary Vocabulary for Your Toolkit

  If you need to label these feelings in conversation or writing, here is the precise terminology:

  1.  **For the Activities:** **Transgenerational Projects** or **Future-Directed Endeavors**.
      *   *Why not Legacy?* Legacy is about *memory*. Transgenerational projects are about *continuity of context*.
  2.  **For the Badness:** **Impersonal Badness** or **Axiological Loss**.
      *   *Explanation:* You are operating on an **Impersonal Axiology** (value exists independently of observers) rather than a **Person-Affecting View** (value requires a victim/beneficiary).
  3.  **For the Split:** **Experiential Goods vs. World-Involving Goods**.
      *   *Alternative:* **Consumption vs. Contribution**.
      *   *Why it matters:* Experiential goods are self-contained. World-involving goods require a "receptor" in the future to complete the circuit of value.

  ### Is it an illusion?
  To answer your underlying worry: Scheffler and most contemporary ethicists would say **no, it is not an illusion.**

  If your values are structured such that your current actions are contributions to an ongoing story, then the cancellation of that story objectively undermines the success conditions of your actions. It is not a cognitive error; it is a correct assessment that the *conditions of possibility* for your projects' success have been removed.

  The fact that ice cream remains appealing confirms you aren't depressed; it confirms you distinguish between *feeling good* (which is internal) and *doing good* (which is external). The "flatness" you feel is the accurate recognition that the external pole of your meaning-making has been disconnected.

  **Recommended Reading (if you want to go deeper):**
  *   **Samuel Scheffler,** *Death and the Afterlife* (Specifically the first essay). This is the exact text for your thought experiment.
  *   **Susan Wolf,** *Meaning in Life and Why It Matters*. For the split between happiness and meaningful projects.
  *   **Derek Parfit,** *Reasons and Persons* (Part IV). For the "where does the badness live" puzzle (though it is dense).

  You have effectively identified the **Afterlife Condition** without the jargon. It is a rational response to the structure of human meaning, not a glitch.
