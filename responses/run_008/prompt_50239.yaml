      *   **The "Unfalsifiable" vs. "No Irrationality" Distinction:**
          *   "Unfalsifiable" means you can't prove it wrong.
          *   "No Irrationality" means the theory defines rationality as "whatever happens."
          *   They are linked but distinct. If RPT requires axioms, it *is* falsifiable (show me a money pump). If it's falsifiable, then people *can* act irrationally (violate axioms). So the friend conflates the *definition* of preference with the *structure* of preference.
