prompt: |-
  My friend is deep into evolutionary psychology and keeps describing the mind as a swiss army knife: not one big general-purpose blade but a bunch of little specialized tools, each carved out by natural selection to solve a specific problem our ancestors faced on the savanna. She leans on this to argue that whenever a behavior looks puzzling -- men caring so much about youth and looks in partners, people being sharp at catching cheaters in social exchanges but hopeless at the same logic framed abstractly -- the right move is to go looking for the specific module built for that job, and that anyone who's skeptical of this "find the module" strategy is basically in denial about evolution. I like her but I want to know how much work the knife picture is doing vs how much she's doing herself. Can you give me the correspondance table (what plays the factory, what's a blade, what would a newly added blade be vs a repurposed old one), then where the analogy breaks, then whether her conclusion survives once the breaks are on the table -- and if it doesn't, what a better analogy would be. One thing I care about: please keep straight what's actually settled among people who study this stuff versus what's still genuinely contested, e.g. don't hand me a specific module as established fact if the evidence for it is argued over. Could you structure it as these sections in this order: "What maps onto what" (~150 words), "Where the analogy breaks" (~150 words), "Does her conclusion survive" (~100 words), "A better analogy, if there is one" (~50 words)?
