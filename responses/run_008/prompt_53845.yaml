  ### What maps onto what

  In this popular analogy, Natural Selection is the factory, forging tools over deep time. The "blades" are distinct cognitive mechanisms or modules, each designed for a specific adaptive problem faced by our Pleistocene ancestors, like mate choice, coalition tracking, resource acquisition, or predator avoidance. A "newly added blade" represents a very specific adaptation evolved over many generations to solve a novel ancestral problem. A "repurposed old one" describes exaptation, where a trait originally evolved for one function is later co-opted for another. The friend argues that puzzling behaviors indicate a specific blade exists for that context, implying strong domain-specificity rather than general intelligence. The "handle" is the underlying brain structure, but the friend primarily emphasizes the blades themselves. This mapping assumes almost every significant behavior stems from a dedicated tool carved by selection, ultimately treating the mind as a collection of specialized circuits rather than a single general-purpose processing computer.

  ### Where the analogy breaks

  The SAK analogy implies fixed, immutable tools, but modern neuroscience shows massive neuroplasticity; neural circuits rewire based on lived experience, not just genetic blueprint. While some biases (like fear of snakes) are prepared, many proposed "modules" remain scientifically contested today. For instance, while people detect cheaters better than abstract logic violations, whether this is a dedicated "cheater module" or learned social reasoning is still heavily debated. The analogy significantly underestimates domain-general processes (general intelligence) that handle novel problems our ancestors never actually faced. It also ignores cultural evolution, which shapes human behavior faster than genetic natural selection. The mind isn't just a static kit; it's a highly dynamic system where general learning mechanisms interact with strict biological constraints. Treating every behavior as a specific blade ignores how few specific neural loci have actually been reliably identified compared to the vast number of currently proposed psychological modules.

  ### Does her conclusion survive

  No, her conclusion fails. Accepting human evolution does not require accepting massive modularity. One can agree natural selection shaped the brain while arguing it primarily created flexible, domain-general learning mechanisms rather than hundreds of specific blades. Skepticism about a specific "cheater detection module" is not denial of evolution; it's a debate about architectural implementation. Many evolutionary biologists accept selection but reject the "massive modularity" hypothesis. Her leap incorrectly conflates evolution with a contested theory of cognitive architecture. You can be fully pro-evolution and still view the mind as a flexible computer. Skepticism targets the *map*, not the *territory* of evolution.

  ### A better analogy, if there is one

  Consider a modern smartphone. Hardware imposes strict biological constraints; the OS provides domain-general learning. Most "apps" are largely downloaded via culture, not pre-installed by genetics. This captures preparedness and flexibility, acknowledging human evolution built the phone, but not every app. It allows specific specialized functions without denying general processing power.
