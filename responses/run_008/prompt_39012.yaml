prompt: |-
  National archives face a delusion problem they rarely name: they keep only a small fraction of the records generated by governments and societies — often well under five percent — and the choice of which fraction survives is made by archivists in advance of any future historian's questions, under a professional doctrine called appraisal. The profession nonetheless describes itself in curatorial, custodial terms: archivists supposedly preserve rather than interpret, keep rather than select, and leave judgment about significance to researchers. Meanwhile, the criteria actually used in appraisal tend to privilege the records of the powerful — well-organized institutional files that document official functions — while the traces of the governed, the poor, and the unwired often survive only by accident, in scraps, or on now-obsolete platforms. Some decades later, this becomes destiny: entire questions about the past turn out to be unaskable because the relevant records were appraised away, and no one can now reconstruct what the silences contain.

  What theory of value — of what a society's memory is and what it is for — does the practice of archival appraisal presuppose? Does the custodial self-description cohere at all with an act that is arguably the most consequential and least visible form of editorial power a state exercises over its own history, or is the neutrality claim a genuine presupposition rather than a fig leaf — and if so, of what: perhaps a view on which significance is an objective property of records that patient archival science can detect? Then consider two recent revisions archivists have proposed: moving appraisal from the individual office or creator to whole social functions and domains, judged by how completely a slice of society gets documented; and turning selection over to the communities themselves, on the theory that a group's own memory of its records outranks the archivist's judgment. Do these revisions share the old presupposition, replace it, or reveal that appraisal never strictly presupposed any one theory of value and could have been carried along by several? Finally, tell me what an archive built on an explicitly counter-memory view — one that deliberately over-collects from those the state documents least, and treats documented absence as itself a record to be preserved through oral history and metadata about what was destroyed or never made — would have to give up, and whether the neutrality doctrine, once abandoned for appraisal, can survive anywhere else in archival work.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Prompt:**

      *   **Core Problem:** National archives keep <5% of records. Selection (appraisal) happens *before* historians ask questions. Archivists claim to be neutral custodians (preserve, don't interpret), but appraisal is inherently interpretive and privileges the powerful. This creates "silences" that make certain historical questions unaskable.
      *   **Question 1:** What theory of value (society's memory/purpose) does traditional archival appraisal presuppose?
      *   **Question 2:** Does the "custodial/neutrality" self-description cohere with the reality of appraisal? Is it a fig leaf, or does it presuppose objective significance?
      *   **Question 3:** Analyze two recent revisions:
          *   Macro-appraisal (functional analysis of society).
          *   Community archival control (post-custodialism).
          *   Do these share, replace, or reveal the flexibility of the old presuppositions?
      *   **Question 4:** Describe an archive built on "counter-memory" (over-collecting the marginalized, preserving absence). What must it give up? Can neutrality survive elsewhere if abandoned in appraisal?

  2.  **Analyze Question 1: Theory of Value in Traditional Appraisal:**

      *   *What is valued?* State continuity, legal accountability, institutional efficiency.
      *   *Underlying Theory:* Positivism/State-Centrism. The state is the primary actor; history is the record of governance. Value is intrinsic to the record's origin (provenance) and its function in the bureaucracy.
      *   *Purpose of Memory:* To ensure the state can function legally and administratively, and to provide an "official" narrative of continuity. It's a "top-down" memory.

  3.  **Analyze Question 2: Neutrality vs. Editorial Power:**

      *   *Coherence:* It does *not* cohere. Claiming to "just keep" while actively "throwing away" is a contradiction.
      *   *Fig Leaf or Genuine?* It's largely a fig leaf (or a professional myth) to maintain authority. However, it *does* rely on a belief in "objective significance" (e.g., this document proves this law was passed). But significance *to whom*?
      *   *Conclusion:* Neutrality is impossible in appraisal. It masks a political choice to prioritize the state's view of itself.

  4.  **Analyze Question 3: Recent Revisions (Macro-appraisal & Community Control):**

      *   *Macro-appraisal (Terry Cook, etc.):* Shifts from *records* to *functions*. Instead of keeping all HR files, keep records of the *function* of hiring.
          *   *Relation to old theory:* It admits selection is inevitable but tries to make it more systematic. It still relies on expert judgment (archivists defining functions). It shares the idea that "significance" can be objectively mapped, just at a higher level.
      *   *Community Archival Control (Post-custodialism):* Communities decide what matters.
          *   *Relation to old theory:* This radically breaks the old theory. It rejects the archivist as the arbiter of value. It replaces "objective significance" with "subjective/communal significance."
      *   *Synthesis:* Do they share the old presupposition? Macro-appraisal tries to refine it; Community control rejects it. Together, they reveal that appraisal was never fixed; it's a site of struggle over who owns memory.

  5.  **Analyze Question 4: The Counter-Memory Archive:**

      *   *Concept:* Deliberately over-collect marginalized voices. Treat absence as data (metadata about destruction). Oral history to fill gaps.
      *   *What must it give up?*
          *   *Comprehensiveness of the State:* It can't claim to be the "complete" record of governance.
          *   *Neutrality:* It must admit bias.
          *   *Passive Custody:* It becomes an activist institution.
          *   *Resource Efficiency:* Over-collecting is expensive.
      *   *Can Neutrality Survive Elsewhere?*
          *   If appraisal is biased, can *description* be neutral? No, because how you describe shapes access.
          *   Can *access* be neutral? No, because digitization and prioritization shape visibility.
          *   *Verdict:* Neutrality is a myth throughout. Abandoning it in appraisal requires abandoning it in description, access, and outreach. The archive becomes a "partisan memory institution."

  6.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Academic, critical, philosophical, yet accessible.
      *   *Structure:* Follow the prompt's four distinct movements.
      *   *Key Concepts to Weave In:* Provenance, Positivism, Terry Cook (Macro-appraisal), Michelle Caswell (Community archives), Derrida (Archive Fever - optional but helpful context), Silences (Trouillot).

      *(Self-Correction during drafting)*: Make sure I don't just list the answers but weave them into a coherent argument about *power*. The prompt asks about "theory of value." I need to define that clearly.
      *   *Traditional Value:* Administrative/Legal utility + State Continuity.
      *   *Counter-Memory Value:* Restorative Justice + Epistemic Repair.

      *(Refining the "Neutrality" argument)*: Is it a fig leaf or a genuine presupposition? It's likely a "professional fiction" that serves a political function. I should argue it's a *performative* neutrality that masks power.

      *(Refining the "Counter-Memory" section)*: What does it give up? It gives up the claim to be the *sole* authority. It also risks essentializing the "marginalized." I should mention the risk of tokenism.

  7.  **Final Polish:** Check against all parts of the prompt.
      *   Theory of value identified? Yes (State-centric positivism).
      *   Custodial coherence analyzed? Yes (It's a contradiction).
      *   Two revisions analyzed? Yes (Macro vs. Community).
      *   Counter-memory archive described (give up + neutrality)? Yes.

  8.  **Final Review:** Ensure the transition between sections is smooth. The argument should build: Traditional -> Critique -> Reform Attempts -> Radical Alternative -> Implications for the Profession. (Proceed to generate output).

  *(Note: I will avoid specific citations unless they are general knowledge within the field, focusing on the philosophical arguments requested.)*

