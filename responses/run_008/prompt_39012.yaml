answer: |-
  The practice of archival appraisal presupposes a **theory of value rooted in state-centric positivism and administrative utility.** In this view, a society's memory is not a collective, organic accumulation of experience, but a curated evidence base required for the continuity of governance. Value is intrinsic to the record's origin (provenance) and its function within the bureaucracy. A record is "valuable" if it documents the exercise of authority, legal accountability, or policy formulation. The purpose of this memory is twofold: to protect the state's legal rights and to provide a stable, linear narrative of institutional evolution. Consequently, the "society" whose memory is kept is effectively synonymous with the "state," and the "history" preserved is the history of administration.

  This theory of value renders the **custodial self-description incoherent.** To claim one is merely a custodian—a passive keeper of what naturally survives—is to deny the active violence of destruction inherent in appraisal. When an archivist destroys 95% of records, they are not preserving; they are editing. The claim of neutrality functions less as a genuine presupposition of objective significance and more as a **professional fig leaf.** It masks the political nature of selection by framing it as a technical science. If archivists genuinely believed significance were an objective property detectable by science, they would not need to debate appraisal criteria so fiercely. Instead, the neutrality claim protects the archive from accusations of bias by asserting that the "significance" of a tax form is self-evident, while the "significance" of a community organizer's notebook is not. It is a claim to authority that relies on the invisibility of the selection process.

  The two recent revisions proposed by the profession attempt to patch this incoherence, but they do so in divergent ways that reveal the flexibility of archival theory.

  **Macro-appraisal** (shifting focus from records to social functions) attempts to **refine the old presupposition.** It admits that we cannot keep everything, but argues that archivists can objectively map the "functions" of society (e.g., healthcare, education, defense) and ensure each is documented. It retains the archivist as the expert judge but expands the scope beyond the central state. It shares the old theory's belief that significance can be systematically mapped by professionals, merely changing the map's scale.

  **Community archival control** (post-custodialism), conversely, **replaces the old presupposition.** It argues that value is not intrinsic to the record nor determinable by the state, but is ascribed by the community of origin. This rejects the idea of the archivist as the neutral arbiter of significance.

  Together, these revisions reveal that appraisal never strictly presupposed one theory of value; rather, it presupposed **archival authority.** Whether that authority is exercised through functional analysis or delegated to communities, the core mechanism remains the legitimization of certain memories over others. The shift shows that the profession is capable of carrying different theories of value, provided the archivist remains the gatekeeper of the *process* of valuation, even if not the *content*.

  An archive built on an explicitly **counter-memory view** would require a radical restructuring of professional identity. To deliberately over-collect from the marginalized and treat absence as data (preserving metadata about destruction, oral histories to fill silences), such an archive would have to give up:

  1.  **The Claim to Comprehensive Neutrality:** It must admit it is a partisan institution. It cannot claim to represent "all" of history; it represents a corrective to specific erasures.
  2.  **Resource Efficiency:** Over-collecting the "unwired" and preserving "absence" is labor-intensive and expensive. It would have to sacrifice the preservation of some traditional state records to fund this work, effectively inverting the 5% rule for specific demographics.
  3.  **Passive Custody:** It becomes an activist entity. If absence is a record, the archivist must investigate *why* it is absent (was it destroyed? never created?), moving from keeper to investigator.

  Finally, **the neutrality doctrine cannot survive elsewhere in archival work if abandoned in appraisal.** Appraisal is the foundation; description, access, and preservation are superstructures built upon it. If we admit that selection is political, we must admit that **description is political** (how we tag, categorize, and name records shapes their meaning) and **access is political** (what we digitize and prioritize shapes what is seen). To abandon neutrality in appraisal while retaining it in description would be to hide the bias deeper in the metadata. A counter-memory archive must embrace **transparent subjectivity.** It must state clearly: *We value these voices because they were silenced.* In doing so, it trades the impossible god-trick of neutrality for the honest power of advocacy, acknowledging that the archive is not a mirror of the past, but a weapon for the future.
