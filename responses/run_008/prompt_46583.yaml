answer: |-
  Here is a complete plan for your 90-minute session. It is designed to be run with zero budget, using only library supplies, and focuses on making the *feeling* of lock-in visceral rather than explaining the theory.

  ### Game Title: "The Compatibility Trap"

  **The Core Idea:** Players must choose between two "technologies." One is objectively better (higher value), but the other is cheaper to adopt initially. Because value depends on *how many other people* choose the same one (network effects), the group often ends up stuck on the cheaper, inferior technology because they can't coordinate a switch later.

  **Materials Needed:**
  *   **Paper:** 3 sheets per person (12 people = ~40 sheets total).
  *   **Pens/Pencils:** One per person.
  *   **Whiteboard & Markers:** To track public scores and counts.
  *   **Timer:** Your phone.
  *   **"Money":** Just numbers written on the top right of their paper.

  ---

  ### Part 1: The Rules (Read this aloud to the group)

  **1. The Setup**
  Tell the group: *"You are all competing companies. Your goal is to end the game with the highest personal score. There is no prize for the group total, only individual scores."*

  Give everyone a sheet of paper. Tell them to write their name and a starting balance of **100 Points** at the top.

  **2. The Choice**
  There are two Systems: **System Red** and **System Blue**.
  *   **Round 1:** You must buy one System.
      *   Cost of **Red**: 10 Points.
      *   Cost of **Blue**: 25 Points.
      *   *Note: Do not tell them what the Systems are worth yet. Just that they have different costs.*
  *   **Round 2:** You may keep your System or switch.
      *   **Switching Cost:** 40 Points (This is the "Lock-in" mechanic).
      *   If you stay, cost is 0.

  **3. The Scoring (The Secret)**
  Tell them: *"At the end of Round 2, I will reveal what your System is worth. Your final score depends on two things: The Base Value of your System, and how many other people are using the same System as you."*
  *(Keep the Base Values secret until after Round 1 is locked in. This simulates how people didn't know Betamax was 'better' initially, or didn't care.)*

  **4. The Communication Ban**
  During the decision phases, **no talking.** They can look at each other, but they cannot discuss strategy. This prevents them from solving the coordination problem verbally, forcing them to rely on "market signals."

  ---

  ### Part 2: Minute-by-Minute Timeline (90 Minutes)

  **0:00 – 0:10 | Introduction**
  *   Welcome everyone.
  *   Hand out paper/pens.
  *   Read the rules above.
  *   **Crucial:** Emphasize that *individual* score matters most. This encourages selfish rationality, which drives the lock-in.

  **0:10 – 0:20 | Round 1 (The Accident)**
  *   Ask everyone to write "Red" or "Blue" on their slip, fold it, and hand it to you.
  *   *Facilitator Tip:* This is where the "historical accident" happens. Because Red is cheaper (10 vs 25), rational people lean Red. But if just 1 or 2 people pick Blue on a whim, it creates uncertainty.
  *   Collect the slips. Do not reveal the counts yet.
  *   Deduct the costs from their 100 points on the whiteboard (or have them track it).

  **0:20 – 0:30 | The Reveal (The Panic)**
  *   On the whiteboard, reveal the **Base Values**:
      *   **System Red:** Base Value = 10 points.
      *   **System Blue:** Base Value = 40 points.
  *   **The Network Rule:** Reveal that for every *other* person on your same System, you get a **+5 Point Bonus**.
  *   *Do the math for them on the board:*
      *   If 10 people are on Red: Score = 10 (Base) + 45 (Bonus) = 55.
      *   If 2 people are on Blue: Score = 40 (Base) + 5 (Bonus) = 45.
  *   Ask: *"Who wants to switch?"* Most Blue users will want to switch to Red to get the network bonus. Most Red users will be terrified to switch to Blue because if not enough people follow, they get isolated.

  **0:30 – 0:45 | Round 2 (The Lock-in)**
  *   Players decide: Stick or Switch? (Remember the 40-point switching cost).
  *   Collect the slips again.
  *   **The Trap:** Calculate the final scores live on the whiteboard.
  *   *Likely Outcome:* The majority will be on Red. The Blue users will likely switch to Red to save themselves, or stay on Blue and score low.
  *   **Result:** The group converges on Red. Red is the "Winner," but the *total possible points* for the room are lower than if everyone had coordinated on Blue initially.
  *   *Why?* Because the switching cost (40) is too high to move the group from the "Red Equilibrium" to the "Blue Equilibrium" once Round 1 is done.

  **0:45 – 0:60 | The Reaction**
  *   Announce the winners.
  *   Ask the room: *"How does it feel to know Blue was better, but you're stuck on Red?"*
  *   Let them vent. This emotional frustration is the learning moment.

  **0:60 – 0:90 | The Debrief (Connecting to History)**
  *   See the "Debrief Script" below.

  ---

  ### Part 3: The Debrief Script (Connecting the Game to Reality)

  Don't lecture. Ask questions. Write their answers on the whiteboard.

  **1. Identifying the "Accident"**
  *   *Ask:* "Look at Round 1. Why did you pick Red?"
  *   *Expected Answer:* "It was cheaper." "I didn't know Blue was better." "I saw others hesitating."
  *   *Connect:* "In history, this is the 'small event.' Maybe QWERTY was just marketed better in 1870. Maybe one big company bought VHS machines early. In this game, the 'accident' was the price difference in Round 1. If I had made Blue cheaper in Round 1, would we be here?"
  *   *Point:* Small initial advantages compound.

  **2. The "Rewind the Tape" Question**
  *   *Ask:* "If we cleared the board and played this game again right now, would we end up on Red again?"
  *   *Discussion:* Some will say "Yes, because we know the trick now." Others will say "No, because we'd coordinate on Blue."
  *   *Connect:* "This is the historian's debate. **Determinists** say we end up on Red again (human nature is risk-averse). **Contingency theorists** say if you rewind to 1870, maybe a different typist jams a different key, and we end up on Blue."
  *   *Takeaway:* The game shows that once the choice is made, history feels inevitable. But *before* the choice, it was fragile.

  **3. The Cost of Switching**
  *   *Ask:* "In Round 2, who wanted to switch to Blue but didn't? Why?"
  *   *Expected Answer:* "The switching cost was too high." "I couldn't trust everyone else to switch with me."
  *   *Connect:* "This is why we still use QWERTY. Learning Dvorak (Blue) takes time (switching cost). If everyone else uses QWERTY (Red), you are isolated. The 'better' technology loses not because it's bad, but because the *transition* is too expensive."

  **4. What the Game Missed (Crucial Honesty)**
  *   *Tell them:* "I need to be honest. This game is simplified. In the real world:"
      *   **Government:** Sometimes laws force a switch (like digital TV).
      *   **Time:** This took 20 minutes. Real lock-in takes 50 years. People die out, new generations come in who don't care about the old cost.
      *   **Stakes:** In here, you lost points. In reality, companies go bankrupt. That desperation forces innovation that this game didn't capture.

  ---

  ### Part 4: Honest Critique (What Will Go Wrong)

  You asked for honesty. Here is what usually breaks in this kind of simulation:

  **1. The "Collusion" Problem**
  *   **Risk:** Someone will say in Round 1, "Hey, let's all pick Blue so we win big."
  *   **Fix:** Enforce the "No Talking" rule strictly during decision rounds. If they talk, disqualify their score. You need them to act as isolated agents to feel the lock-in.
  *   **Why:** If they coordinate, they beat the game. You want them to *lose* to the system to understand the frustration of lock-in.

  **2. The Math Confusion**
  *   **Risk:** People will get confused calculating Base Value + Network Bonus - Costs.
  *   **Fix:** You (the facilitator) do the math on the whiteboard. Don't make them calculate. Just ask them for their decision. Keep the cognitive load on the *choice*, not the arithmetic.

  **3. The "It's Just a Game" Dismissal**
  *   **Risk:** Retirees or skeptics might say, "Well, obviously I picked Red, it was a game."
  *   **Fix:** During the debrief, pivot quickly to real examples. "Okay, you knew it was a game. But did you feel that hesitation in your gut in Round 2? That hesitation is why your car still has a physical key instead of a phone app, or why we still use PDFs instead of better formats." Anchor it in their physical reality immediately.

  **4. The "Rewind" Limitation**
  *   **Risk:** You cannot actually answer "Would history be the same?"
  *   **Fix:** Don't try to answer it. Frame the game as evidence that *small changes matter*. "We can't rewind history, but this game proves that if we change the Round 1 rules, the Round 2 outcome changes completely. That suggests history isn't fixed."

  **5. Time Creep**
  *   **Risk:** The debate in the debrief will run long.
  *   **Fix:** Keep a visible timer. At minute 80, stop the discussion and give your final 5-minute summary. It is better to end on your strong conclusion than to let the energy fizzle out.

  ### Final Facilitator Tip
  The most powerful moment will be when you reveal the **Base Values** at minute 0:20. Watch the faces of the people who picked Blue (the better tech) when they realize they are in the minority. Watch the faces of the Red pickers when they realize they are stuck on the inferior tech but it's too late to move. **Point that out.** "Look at this table. This is the VHS aisle in 1990. This is the QWERTY keyboard in 1900."

  Good luck. You're not teaching them history; you're letting them live a tiny piece of it.
