      **The Trap:** If 6+ people pick Square in Round 1 (because it was cheaper), Circle becomes impossible to reach critical mass. Everyone is stuck with Square (5 pts) even though Circle (10 pts) was better.
      **The Accident:** Will 6 people pick Square? With 12 people and a cost difference, likely. But to ensure the "accident" feel, maybe the Facilitator acts as the "Market" and buys the first 3 Squares.

      *Let's polish this into a concrete plan.*
      **Name:** "The Standard."
