      3.  **Round 2:** Can switch. Switching cost 20.
      4.  **Payoff:** Based on network size + format value.
      5.  **Outcome:** If enough people picked X in Round 1 (because it was cheap/safe), the network effect locks X in. Y dies despite being better.

      *Debrief:* Connect to QWERTY. Connect to "Rewind the Tape." If we replay, does the dice roll change the first 3 choosers?

      *What will go wrong?*
      1.  Math confusion. Keep it simple.
      2.  Collusion ("Let's all pick Y!"). Need to forbid talking during choice.
      3.  Facilitator bias (pushing X too hard).
      4.  Time management.

      *What can't the game capture?*
