      **Switching Cost:** 30 credits to switch after Round 1.
      **Initial Endowment:** 20 credits.
      **Round 1:** Choose A or B. Cost: A=0, B=5. (A is slightly cheaper/easier initially).
      **Round 2:** Choose A or B. Switching cost applies.
      **Payoff:** (Base Value + Network Bonus) - Costs.
      **The Lock:** If 7+ people choose A in Round 1, the Network Bonus for A outweighs the Base Value of B for the remaining holdouts, making switching irrational even though B is "better."
      **Wait, math check:**
      If 7 choose A: A users get 10 + (6*5) = 40.
      If 5 choose B: B users get 20 + (4*5) = 40.
      It's equal. I need A to be clearly worse but dominant.
      Let's make Base Value: A=10, B=30.
      Network Bonus: +10 per person.
      If 8 choose A: A = 10 + 70 = 80.
      If 4 choose B: B = 30 + 30 = 60.
      So if 8 people pick A, A wins.
      Cost to enter A: 0. Cost to enter B: 10.
      Endowment: 50.
      This works. The "Accident" is whether the first few people pick A or B.

      *Wait, one more thing:* The prompt asks for "nobody suspects where it's going."
      If I tell them "A is inferior," they might rebel.
      I need to hide the values initially.
      **Blind Phase:** Round 1, they don't know the values. They just hear "Tech 1" and "Tech 2." Tech 1 is marketed as "Established/Reliable" (Cheap). Tech 2 is "New/Risky" (Expensive).
      **Reveal:** After Round 1, reveal Tech 2 is actually more efficient. By then, it's too late.
      This captures the "Betamax was better but nobody knew/cared initially" vibe.

      *Revised Plan:*
      1.  **Round 1:** Choose Format X or Y. X is "Standard" (Cost 0). Y is "Premium" (Cost 10). No info on value yet.
