answer: |-
  **MEMORANDUM**

  **TO:** Elections Committee
  **FROM:** Chair, Elections Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Method for Bylaws Revision

  **1. Purpose**

  This memo summarizes the committee's deliberation regarding the voting method for society officer elections. Our charge is to recommend a single method for inclusion in the proposed bylaws revision to be presented to the Council. We have evaluated four systems: the current Plurality system, Instant-Runoff Voting (IRV), Approval Voting, and the Borda Count. This recommendation balances theoretical robustness, practical implementation constraints (specifically mail-in voting), and the cultural values of our scholarly community.

  **2. The Relevance of Arrow's Impossibility Theorem**

  A significant portion of our debate invoked Kenneth Arrow's Impossibility Theorem. To ensure our recommendation rests on sound ground, we must be precise about what this theorem establishes and where it applies.

  Arrow's theorem proves that no *ranked* voting system can simultaneously satisfy a specific set of fairness criteria (including Non-dictatorship, Pareto Efficiency, and Independence of Irrelevant Alternatives) in all possible scenarios. It is a proof of inevitable trade-offs, not a proof of futility.

  *   **Where it applies:** Arrow's constraints bind any system requiring voters to rank candidates ordinally (1st, 2nd, 3rd). This includes **Instant-Runoff Voting** and the **Borda Count**. Adopting either means accepting that, in rare edge cases, the system may produce counter-intuitive results (e.g., a candidate winning despite a majority preferring another).
  *   **Where it is silent:** Arrow's theorem assumes voters express preferences as strict orderings. **Approval Voting** does not ask for rankings; it asks voters to dichotomize candidates into "approved" or "not approved." Because Approval Voting is a cardinal (or rating) system rather than an ordinal one, it technically falls outside the scope of Arrow's Impossibility Theorem. It avoids Arrow's specific impossibility result, though it faces other theoretical trade-offs (such as failing the Condorcet criterion in certain configurations).
  *   **Conclusion on Arrow:** We should not invoke Arrow to argue that "all systems are equally flawed" and therefore maintain the status quo. Rather, Arrow tells us that if we choose a ranked system (IRV/Borda), we must choose *which* fairness criteria we are willing to relax. If we choose Approval, we step outside Arrow's constraints but must evaluate the system on other merits.

  **3. Evaluation of Methods**

  **A. Plurality (Status Quo)**
  *   *Pros:* Maximum simplicity; zero transition cost.
  *   *Cons:* Highly vulnerable to the "spoiler effect" and vote-splitting. In fields with multiple sub-specialties, a candidate opposed by 60% of the membership can win with 40% of the vote if the opposition is split.
  *   *Treasurer's Position:* The Treasurer argues that plurality is "fine" and change invites confusion. This is a valid administrative concern. However, "familiarity" should not outweigh "representativeness." If our current system systematically elects officers who do not reflect the majority will due to vote-splitting, the administrative ease is a false economy.

  **B. Borda Count**
  *   *Pros:* Captures nuance in preference strength.
  *   *Cons:* Highly vulnerable to strategic voting. Voters are incentivized to rank strong competitors last ("burying"), regardless of actual merit. For a scholarly society dedicated to intellectual honesty, a system that rewards tactical insincerity is culturally misaligned. We cannot recommend this method.

  **C. Instant-Runoff Voting (IRV)**
  *   *Pros:* Ensures the winner has majority support; eliminates vote-splitting.
  *   *Cons:* Complex to explain and count. For mail-in ballots, ranking errors (skipping numbers, duplicate rankings) can lead to high rates of spoiled ballots. It also fails the Condorcet criterion (it can elect a candidate who would lose head-to-head against another).

  **D. Approval Voting**
  *   *Pros:* Simple ballot (check all candidates you find acceptable); immune to Arrow's theorem; minimizes vote-splitting; encourages consensus-building rather than polarization.
  *   *Cons:* Does not guarantee a majority winner (though usually elects a broadly acceptable candidate); vulnerable to "threshold strategy" (voters deciding whether to approve a fringe candidate), though this is less damaging than plurality's "lesser-of-two-evils" pressure.

  **4. Practical Considerations**

  **Ballot Simplicity and Mail Voting**
  Our 4,000 members vote primarily by mail. Complex ballots increase the rate of invalid votes.
  *   *Plurality:* One mark. (Lowest error rate).
  *   *Approval:* Multiple marks allowed, but conceptually identical to Plurality. (Low error rate).
  *   *IRV/Borda:* Requires numbering/ranking. (Higher error rate; requires voter education).
  Given the mail constraint, Approval and Plurality are superior to ranked methods.

  **Strategic Voting**
  Plurality forces voters to abandon their favorite candidate if that candidate appears non-viable. Approval allows members to vote for their true preference *and* a viable compromise without penalty. This aligns better with our mission to represent the diversity of the field.

  **The Condorcet Criterion**
  Should we care if the winner would beat all others in head-to-head matchups? Ideally, yes. However, Condorcet-consistent methods are often complex to tabulate and explain to the membership. Approval Voting often *elects* the Condorcet winner when one exists, as it rewards broad acceptability, even if it does not guarantee it mathematically. For a society officer role, broad acceptability (consensus) is often more valuable than narrow majority intensity.

  **5. Recommendation**

  The Committee recommends adopting **Approval Voting**.

  This recommendation balances the theoretical insights regarding Arrow's theorem with the practical constraints of mail voting. Approval Voting allows us to reform the defects of Plurality (vote-splitting) without incurring the complexity and ballot-error risks of IRV. It respects the Treasurer's concern for simplicity while addressing the committee's concern for representativeness. It rewards candidates who build coalitions across sub-disciplines rather than those who mobilize a narrow plurality.

  **6. Proposed Bylaws Language**

  To ensure clarity, we propose the following specific language for the bylaws revision:

  > **Section X. Election of Officers.**
  > (a) Elections shall be conducted by mail or electronic means as determined by the Council.
  > (b) Voting shall be conducted using the Approval Method. Each member may vote for (approve) as many candidates as they wish for each office.
  > (c) For each office, the candidate receiving the highest number of approval votes shall be elected.
  > (d) In the event of a tie, the tie shall be broken by lot.

  **7. Invitation to Dissent**

  This recommendation is not intended to close debate but to focus it. Committee members who favor IRV should argue why the guarantee of a majority winner outweighs the risk of increased spoiled mail ballots. Members who favor Plurality should argue why the risk of vote-splitting is acceptable for the sake of administrative familiarity. Members who favor Borda must address the vulnerability to strategic "burying."

  By selecting Approval Voting, we choose a system that is theoretically distinct from the constraints of Arrow's theorem, practically suited to our voting medium, and culturally aligned with the consensus-building nature of our scholarly community.

  I request the Committee's vote on this recommendation by [Date].
