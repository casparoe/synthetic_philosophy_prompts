prompt: |-
  I'm a PhD student in economics, working mostly on decision theory, and I've been sitting in on a philosophy seminar on rational choice where the professor keeps pulling out this line — "you can never be worse off finding out" — to bat away a bunch of very different worries. One student brought up patients declining a predictive test for an incurable late-onset disease, someone else asked about keeping your bid private in an auction, and at another point he used the same line to argue a policymaker should always commission one more study before deciding anything. I think I know where something like this is actually a theorem: Good's result that the expected value of a decision problem never goes down when the agent gets to observe, for free, which cell of a partition the state of the world falls in, before choosing — assuming a Bayesian who updates and then picks the act maximizing expected utility. But I'm pretty sure the professor's one-liner is doing alot more work than the theorem, and nobody called him on it because we couldn't say exactly where the theorem ends and the slogan begins.

  So help me map it. Lay out the distinct precise claims that could be hiding in "you can never be worse off finding out", ordered from ones that are basically true by definition to ones that are substantive and maybe false. For each, give a one-line verdict — true, true but trivial, false, or true only under stated extra assumptions — and say what the assumptions are. I'd especially like you to cover: the case where the observation is free but the information itself enters the agent's utilities (dread, anticipatory utility, or the result just making your existing prospects feel worse); the case where other agents can observe what you learned or infer it from how you behave (auctions, bargaining, signaling); the case where the cost is the delay while you find out, which the study itself doesn't internalize; and the degenerate reading where "finding out" just relabels options without changing anything decision-relevant. Then a short final section saying, for each of the professor's three uses — the genetic test, the auction, the one more study — which precise reading he would actually need, and whether he can get it. Numbered list, verdict at the end of each item, and please keep the whole thing under 500 words so I can actually send it to the seminar list.
