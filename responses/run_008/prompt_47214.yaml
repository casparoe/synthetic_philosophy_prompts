      *   *C.S. Lewis's Theology:* In *Mere Christianity*, he prefers the "Christus Victor" (Victory over Death) or "Ransom" model over strict Penal Substitution. He often spoke of Christ "sharing our death" to break it, not just "taking our punishment."
