  2.  **Deconstruct David Lewis's Argument:**
      *   *Premise 1:* Substitution for fines is acceptable (paying someone's speeding ticket).
      *   *Premise 2:* Substitution for bodily punishment is unacceptable (going to jail for someone).
      *   *Observation:* Christians accept PSA (bodily/death substitution) in theology but reject it in civil law.
      *   *Challenge:* Is there a principled difference? If death is the penalty, can it be transferred?
      *   *Implication for LWW:* Aslan dies for Edmund. This is bodily/death substitution. The Witch accepts it. Aslan comes back.

