      *   *The "Fine" Analogy:* Aslan's resurrection makes it look like a refundable fine *unless* the suffering itself is the point. But the text emphasizes the *shame* and the *loss*.
      *   *Narnian Justice:* The Witch accepts the deal because she is blind to the Deeper Magic. She thinks she's winning. In human courts, judges know substitution doesn't work for crime. In Narnia, the "Judge" (Witch) is an adversary, not a neutral arbiter.

