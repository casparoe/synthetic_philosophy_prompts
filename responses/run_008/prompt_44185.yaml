  This is a fantastic puzzle. Dana's intuition pump is running hot, and the "Fat Man (Doomed)" case is the critical piece of evidence that most people overlook. It rules out pure consequentialism immediately (since the net cost to the victim is zero, yet she still forbids it), and it puts heavy pressure on the "Redirecting Threat" rule.

  Here is the breakdown of the three rules you identified, how they predict the Loop case, my best guess at her verdict, and the specific case you need to bring next Tuesday to corner her.

  ### 1. The Three Rules & The Loop Prediction

  **Rule A: Doctrine of Double Effect (DDE) / Intentionality**
  *   **The Gist:** You can foresee harm, but you cannot *intend* harm as the *means* to your good end. The bad effect must be a side effect.
  *   **Fits Dana?** Yes. Switch (death is side effect) = Yes. Footbridge/Surgeon (death is the tool) = No. Medicine (death is side effect of scarcity) = Yes.
  *   **Loop Prediction:** **NO.** In the Loop case, the one guy's death is not just a side effect; it is the *mechanism* that stops the trolley. You *need* him to die to save the five. That makes his death the means, which DDE forbids.

  **Rule B: Using Persons as Means (Kantian Constraint)**
  *   **The Gist:** You cannot treat a human being merely as a tool or object to achieve a goal, even a good one.
  *   **Fits Dana?** Yes. Footbridge (man as sandbag) = No. Surgeon (man as parts store) = No. Switch (man is not a tool, just in the path) = Yes.
  *   **Loop Prediction:** **NO.** In the Loop, the man is functionally a sandbag. His body is the brake. You are using his physical existence as the stopping mechanism.

  **Rule C: Redirecting Existing Threat vs. Initiating New Harm**
  *   **The Gist:** You are allowed to deflect a threat that is already in motion, but you are not allowed to initiate a new lethal sequence or physically intervene on a person.
  *   **Fits Dana?** Mostly. Switch (redirect) = Yes. Footbridge (new force) = No. Surgeon (new force) = No. Medicine (withholding, not initiating) = Yes.
  *   **Loop Prediction:** **YES.** You are not touching the man. You are flipping a switch. The trolley is the threat, and you are merely directing where it goes. The fact that the track loops is a geometric detail; the *action* is still just redirecting.

  ### 2. My Best Guess: She Says "NO" to the Loop

  I am leaning 80/20 that Dana will say **absolutely not** to the Loop case.

  **Why?**
  The "Fat Man (Doomed)" case is the smoking gun. In that scenario, the man dies *either way*. A pure "Redirecting Threat" theorist might say "Shove him! You aren't changing his outcome, and you save five!" But Dana said **No**.

  This tells me she isn't just tracking "Who started the threat?" She is tracking **"What is the victim's role in the rescue?"**
  *   In the **Switch** case, the victim is *passive*. He just happens to be there.
  *   In the **Footbridge** and **Surgeon** cases, the victim is *active* (causally). Their body *does the work* of saving the five.
  *   In the **Loop** case, the victim *does the work*. His body is the brake.

  Even though you use a lever (like the Switch), the *causal structure* is identical to the Footbridge. The trolley doesn't stop because of the track geometry; it stops because it crushes him. Given that she rejected the Fat Man even when it cost him nothing, she likely rejects any plan where the victim's body is the *instrument* of salvation.

  ### 3. The Follow-Up Case: "The Shove to Switch"

  If she says **NO** to the Loop (as I predict), both **Rule A (DDE/Means)** and **Rule B (Bodily Integrity)** are still in the running. Both forbid using the body as a brake. To split them, you need a case where you **violate bodily integrity** but **do not use the body as a means.**

  Bring this case after dinner:

  > **The Case:** You are standing next to the lever. The one guy is standing directly in front of the lever, blocking your access. He is asleep or frozen in fear. He is *not* on the track. If you pull the lever, the trolley diverts onto the side track (standard switch geometry) and stops safely without hitting him. The five are saved. He is unharmed by the trolley.
  >
  > **The Catch:** To reach the lever, you have to physically **shove him aside**. The shove is rough; he falls and breaks his arm, but he lives.
  >
  > **The Question:** Do you shove him to save the five?

  **Why this splits the rules:**
  *   **If she says YES:** Her rule is **DDE/Means**. She doesn't care about physical contact *unless* that contact makes the person the *means of survival*. Here, the contact is just an obstacle removal. The lever stops the trolley, not his arm.
  *   **If she says NO:** Her rule is **Bodily Integrity/Contact**. She has a strict "Hands Off" policy. It doesn't matter if he's the brake or just an obstacle; you are not allowed to physically impose force on an innocent bystander, even to save five.

  ### 4. The Missed Rule: "Bodily Sovereignty"

  There is a fourth rule that fits her track record even better than the three you listed, and it might be the one that actually drives her.

  **The Rule:** **You may not violate the boundary of a person's skin to save others.**

  *   **Switch:** You touch a lever. (Skin intact) -> **Yes**
  *   **Footbridge:** You touch/push the man. (Skin boundary violated by force) -> **No**
  *   **Surgeon:** You cut the man. (Skin boundary violated by blade) -> **No**
  *   **Medicine:** You withhold liquid. (No touch) -> **Yes**
  *   **Fat Man (Doomed):** You push the man. (Skin boundary violated) -> **No**

  **Why this is annoying for her:**
  If this is her rule, the **Loop** case becomes a toss-up depending on how she defines "violation."
  *   If "violation" means *your* hand touching him: Loop is **Yes** (You touch the lever).
  *   If "violation" means *any* external force breaching his body: Loop is **No** (The trolley breaches him).

  If she says **NO** to the Loop, and then **NO** to the "Shove to Switch" (above), tell her: *"Dana, you don't care about trolleys. You're just a strict bodily autonomy absolutist. You'd let the five die before you'd lay a finger on the one."*

