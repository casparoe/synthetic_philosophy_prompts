prompt: |-
  Me and my friend Dana stayed up til like 2am last night arguing about trolley cases again (yes, we're those people) and now I'm trying to figure out what her actual rule is, because I genuinely can't tell. Her track record so far:

  - the classic switch case -- flip the lever, the trolley diverts onto the side track, one guy dies, five are saved: she says obviously do it
  - footbridge -- shove the big guy off the bridge so his body stops the trolley, one dies, five saved: absolutely not, don't even
  - the surgeon who could quietly cut up one healthy guy for parts to save five dying patients: absolutely not
  - the doctor with one vial of medicine: five patients each need a fifth of the vial, one patient needs all of it. she says split it between the five and let the one guy die. "that's just triage"
  - and the one where I thought I finally had her: the big guy on the bridge is going to be hit by the trolley in a few seconds whether or not you shove him, so shoving him costs him literally nothing and saves five. STILL absolutely not, she wouldn't even pause.

  Next tuesday we're getting dinner and I want to bring the loop case. You know the one: the side track loops all the way around and rejoins the main track AHEAD of where the five are tied down. So if you flip the lever, the trolley goes around the loop, hits the one guy on the side track, and his body is the only thing that stops it before it comes back around to the five. If he weren't on the loop track, diverting would do nothing at all -- his getting hit is the actual stopping mechanism.

  Here's my problem. I can see at least three rules that fit everything she's said so far: something like harm-as-side-effect vs harm-as-the-plan (the switch death is a side effect, the shove is the plan, the organs are the plan); something about using a person's body as the physical instrument of the rescue (the big guy is literally the brake, the organs are literally the cure); and something looser about redirecting a threat that's already in motion vs starting up a new lethal process yourself. And I have a feeling they don't all give the same answer on the loop -- like, it's still just redirecting a trolley that's already loose, but the guy on the loop track is also kind of... the brake? and I can't tell which half of that Dana will care about.

  So: what does each rule predict she says about the loop? Give me your best guess at her actual verdict and why you lean that way. And the thing I want most -- since I suspect the loop won't kill off all the surviving rules at once, design me the case to bring AFTER the loop, the one that actually splits whatever rules are left standing. If you think there's a rule I've missed that fits her track record even better, tell me that too, she'll be so annoyed.
