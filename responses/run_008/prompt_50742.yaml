answer: |-
  You have stumbled onto one of the most persistent problems in modern moral philosophy, often discussed under the heading of "consequentialist cluelessness" (most notably by James Lenman). Your frustration is warranted: standard act-utilitarianism collapses here because it demands we calculate the incalculable.

  Your tentative principle ("unknowable ripple effects count neither for nor against... except when they run through an institution...") is a strong start, but as you noted, it fails to distinguish the **Tip** from the **T-shirt**. Both run through institutions. The waiter's tip sustains the tipping norm; the T-shirt purchase sustains the garment industry.

  To capture your verdicts, we need to refine the distinction between *chaotic causal ripples* and *foreseeable structural complicity*.

  ### The Repaired Principle: The Epistemic Constraint on Complicity

  Here is the principle that best unifies your intuitions:

  > **Agents are not responsible for the unknowable, chaotic downstream consequences of their actions (the "Ripple Constraint"), BUT they are responsible for the known, structural properties of the practices they voluntarily sustain (the "Complicity Clause"), and they are bound by local normative duties regardless of consequences (the "Deontic Floor").**

  Let's break down how this repairs your draft and tests against your cases.

  1.  **The Ripple Constraint:** Unknowable butterfly effects are morally neutral. You cannot be blamed or credited for what you cannot reasonably foresee.
  2.  **The Complicity Clause:** If you know a practice relies on harm (exploitation, addiction) to function, participating in it makes you complicit in that harm, even if the specific causal chain to a specific victim is unknowable.
  3.  **The Deontic Floor:** Certain acts (lying, breaking promises) are wrong in virtue of violating local normative expectations, regardless of their downstream utility.

  ### Testing the Cases

  **1. Tipping the Waiter**
  *   **Analysis:** The downstream spending of the $5 is a *Ripple* (unknowable). The practice of tipping is not inherently *Structurally Harmful* (it's generally a norm of gratitude).
  *   **Verdict:** Permissible/Good.
  *   **Fit:** **Pass.** The Ripple Constraint excuses you from tracing the money; the Complicity Clause finds no structural harm.

  **2. The Sweatshop T-shirt**
  *   **Analysis:** The downstream economic ripples are unknown. However, the *structural property* of the transaction is known: it relies on exploitative labor conditions.
  *   **Verdict:** Wrong/Blameworthy.
  *   **Fit:** **Pass.** The Complicity Clause overrides the Ripple Constraint. You aren't blamed for the ripples; you are blamed for funding the structure.

  **3. The Tobacco Job (Earn to Give)**
  *   **Analysis:** The donations are speculative *Ripples* (saving lives downstream). The job itself is *Structurally Harmful* (selling addiction/death).
  *   **Verdict:** Wrong/Reject the speculation.
  *   **Fit:** **Pass.** The Complicity Clause (known harm of tobacco) outweighs the speculative Ripple benefits of the donations. This aligns with your refusal to credit speculative distant benefits.

  **4. The Cereal Choice**
  *   **Analysis:** Supply chain effects are unknowable *Ripples*. Unless you have specific knowledge of harm (like the T-shirt), the practice is structurally neutral by default.
  *   **Verdict:** Permissible/No obligation to trace.
  *   **Fit:** **Pass.** Ripple Constraint applies; no Complicity trigger.

  **5. Lying on the CV**
  *   **Analysis:** You argue the truth might cause harm downstream (Ripple).
  *   **Verdict:** Wrong on its face.
  *   **Fit:** **Pass.** The Deontic Floor (duty of honesty in professional contexts) trumps the Ripple Constraint. You don't even get to the consequentialist calculation.

  **6. Voting in an Enormous Election**
  *   **Analysis:** Here is your friction point. You say the "tiny probability carries real weight."
  *   **Verdict:** Obligatory.
  *   **Fit:** **FAIL (on causal grounds).** If you vote *because* of the 1-in-10-million chance of swinging the election, you are violating the Ripple Constraint. That probability is functionally equivalent to the unknowable ripples of the tip or the cereal.
  *   **Repair:** To make this fit the principle, you must justify voting not via *causal impact*, but via the **Complicity Clause**. You vote to sustain the *practice* of democracy. If everyone followed the "my vote doesn't matter" rule, the institution collapses. You are obligated to sustain the institution, regardless of your individual causal efficacy.

  ### The Hard Truth: Which Verdict Must Go?

  You asked for honesty about which verdict the best available principle cannot accommodate.

  If you insist that voting is obligatory **because of the tiny probability of being decisive**, you are inconsistent. That is mathematically indistinguishable from hoping your tip ripples into great good, or that your cereal purchase doesn't ripple into harm. The Epistemic Constraint on Complicity treats vanishing probabilities as epistemically negligible.

  **To maintain consistency, you must overturn the justification for Voting.**
  You must admit that you vote *not* because you might swing the election, but because it is a duty of civic solidarity (a Deontic Floor or Complicity duty). If you cannot accept that, and insist the *causal chance* is what matters, then you must concede that the Tip and Cereal cases *should* matter more than you think (i.e., you are under-estimating your responsibility for ripples). Given your strong intuitions on the other cases, I recommend sacrificing the **causal justification for voting**.

  ### The Test Case: Having a Child

  Now, we apply the repaired principle to the case you are flip-flopping on: **Whether to have a child, given that their descendants' effects are maximally clueless.**

  **Application:**
  1.  **The Ripple Constraint:** The actions of your grandchildren, and their children's children, are chaotic causal ripples. You cannot foresee them. Under the principle, these **do not count**. You cannot be held responsible for a great-grandchild who becomes a tyrant, nor credited for one who cures cancer. To agonize over this is to violate the Epistemic Constraint.
  2.  **The Complicity Clause:** Is having a child inherently structurally harmful?
      *   *Argument for Yes:* In a climate-crisis context, a new human has a foreseeable carbon footprint. This is a *structural* fact, not a ripple.
      *   *Argument for No:* Procreation is a fundamental human practice, not inherently exploitative like tobacco or sweatshops.
  3.  **The Deontic Floor:** Do you have a duty to potential persons? (Usually considered negative: no duty to create, but a duty not to create suffering).

  **Prediction:**
  The principle predicts that **you should not factor the distant descendants' effects into your decision.** Those are forbidden ripples.

  However, you *must* factor in the **proximate structural costs**.
  *   Can you raise this child without relying on exploitative structures (to the extent possible)?
  *   What is the foreseeable carbon cost of *this* child's life (distinct from their descendants)?
  *   What is the impact on your existing duties (friends, community)?

  **Verdict:**
  If your hesitation is solely about the "butterfly effect" of future lineage (e.g., "What if my lineage causes a war in 2150?"), the principle says: **Ignore that.** It is morally irrelevant cluelessness.
  If your hesitation is about the foreseeable resource consumption or the capacity to raise a good human (structural properties), **count that.**

  ### Summary

  Your intuitions are not a mess; they are **non-consequentialist with a structural caveat.** You are effectively a **Rule Consequentialist regarding institutions** and a **Deontologist regarding local duties**, while rejecting **Act Consequentialism regarding chaotic ripples.**

  *   **Principle:** The Epistemic Constraint on Complicity.
  *   **Sacrifice:** You must stop justifying Voting via causal probability. Justify it via civic duty.
  *   **Child Verdict:** Do not have a child (or do) based on proximate capacity and foreseeable structural costs. Do not make the decision based on the unknowable moral valence of future descendants. That is a trap of cluelessness.

  This saves 5 out of 6 of your original verdicts (modifying the *reasoning* for the 6th), and gives you a clear, non-paralyzing path forward on the child question.
