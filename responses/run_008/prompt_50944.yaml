prompt: |-
  I'm on the committee of a small charity in Leeds that hands out roughly £40,000 a year in grants to struggling families in the borough -- help with school uniforms, boiler repairs, that sort of thing. We always have more applicants than money, and I've got into long arguments with the other trustees about what a "fair" split even means here. A couple of them basically want to give to whoever seems worst off emotionally (welfare, I take it?), others want a flat rule based on income bands (resources?), and I keep thinking the real question is what people are actually able to do -- whether a kid can go on the school trip, whether a mum can keep her job with the childcare costs she's got. From reading around a bit I gather this is an old argument philosophers have under the heading "equality of what", and that there are live puzzles underneath it: expensive tastes (if someone's genuinely miserable unless they get a foreign holiday, are they worse off than someone content with less?), people whose wants have shrunk to fit their circumstances (I think one article called these adaptive preferences), and whether you should treat bad luck differently from choices people made themselves.

  I've got no philosophy training, just a stubborn streak, a decent chunk of committee time, and about a year before we rewrite our allocation guidelines. Which of the open questions in this area actually deserve my evenings, in what order, and why those rather than the others? I don't want a tour of the whole debate -- I want a defended pecking order. What makes one puzzle worth my time given that it's me and a spreadsheet, not a research institute? Some of this stuff (like whether tastes are "expensive" through anyone's fault) feels like it might matter loads for who gets a £200 grant, and some feels like it only matters for ideal societies we'll never live in -- tell me which is which. And what would change your ranking? For instance if we started means-testing properly, or if the council doubled our funding, or if a third of the applicants were asylum seekers with essentially zero income on paper.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Context:**
      *   **Who:** A trustee on a small charity committee in Leeds.
      *   **What:** Distributing ~£40k/year in grants to struggling families (uniforms, boilers, etc.).
      *   **Problem:** Demand exceeds supply. Disagreement among trustees on "fairness" (welfare vs. resources vs. capabilities).
      *   **Background:** No philosophy training, but has read around "equality of what" (Sen, Nussbaum, Dworkin, etc.).
      *   **Goal:** A *defended pecking order* of philosophical puzzles to focus on for rewriting allocation guidelines within a year.
      *   **Constraints:** Practical reality (committee time, spreadsheet, not a research institute). Needs to know what matters *now* vs. what's theoretical fluff.
      *   **Specific Questions:** Which open questions deserve time? In what order? Why? What would change the ranking (sensitivity analysis)?

  2.  **Deconstruct the Philosophical Landscape (Mental Sandbox):**
      *   *Equality of Welfare:* Focuses on happiness/satisfaction. Problem: Expensive tastes, adaptive preferences (the "happy slave" problem).
      *   *Equality of Resources:* Focuses on income/assets. Problem: Ignores conversion factors (disability, local costs), ignores choice vs. circumstance.
      *   *Equality of Opportunity/Access:* Focuses on level playing field.
      *   *The Capabilities Approach (Sen/Nussbaum):* Focuses on what people can actually *do* and *be*. (This aligns with the user's intuition about school trips and keeping jobs).
      *   *Luck Egalitarianism (Dworkin/Cohen/Arneson):* Distinguishes between brute luck (born disabled) and option luck (gambled money away).
      *   *Sufficientarianism:* Getting everyone above a threshold rather than equalizing.

  3.  **Evaluate Relevance to the Charity Context:**
      *   *Budget:* £40k is tiny compared to need. This isn't about structural justice; it's about triage.
      *   *Grants:* Small amounts (£200-£1000 typically). Uniforms, boilers, childcare. These are specific *functionings*.
      *   *Administrative Burden:* Complex philosophical tests require complex paperwork. Small charity = limited admin capacity.
      *   *Trustee Dynamics:* Need a framework that resolves arguments, not fuels them.

  4.  **Develop the Pecking Order (The Core Task):**

      *   *Priority 1: Capabilities vs. Resources (The "What" Question).*
          *   *Why:* The user is already leaning this way ("what people are actually able to do"). It fits the grant types (boilers = warmth, uniforms = school access). It avoids the "income band" trap (income doesn't equal ability to function if you have high costs).
          *   *Action:* Define a short list of "central capabilities" relevant to Leeds families (e.g., thermal comfort, educational participation, employment retention).
          *   *Philosophical weight:* High practical impact.

      *   *Priority 2: Adaptive Preferences (The "Welfare" Trap).*
          *   *Why:* The user mentioned "wants shrunk to fit circumstances." If you ask people what they need, they might say "nothing" because they've given up. If you rely on "who seems most miserable," you reward complaint, not need.
          *   *Action:* Don't ask "How sad are you?" Ask "What can't you do that you need to?"
          *   *Philosophical weight:* Prevents misallocation to the vocal vs. the stoic.

      *   *Priority 3: Choice vs. Circumstance (Luck Egalitarianism lite).*
          *   *Why:* Trustees argue about "deservingness." Did they spend money on cigarettes or did the boiler break?
          *   *Action:* Don't get bogged down in moral auditing. Focus on *current* capability deprivation regardless of cause, but perhaps prioritize *brute luck* (disability/illness) over *option luck* if funds are tight. Actually, for a small charity, "no moralizing" is usually better policy.
          *   *Philosophical weight:* High emotional charge for trustees, low administrative feasibility to prove.

      *   *Priority 4: Expensive Tastes.*
          *   *Why:* User mentioned foreign holidays.
          *   *Action:* Dismiss it. Irrelevant for poverty relief grants. No one is asking for holidays.
          *   *Philosophical weight:* Theoretical noise in this context.

  5.  **Drafting the Advice (Iterative Refinement):**

      *   *Tone:* Respectful, practical, acknowledging the "stubborn streak," avoiding jargon where possible but using it correctly.
      *   *Structure:*
          1.  Validate the intuition (Capabilities is the right horse).
          2.  The Pecking Order (1, 2, 3...).
          3.  Why this order (Impact vs. Effort).
          4.  Sensitivity Analysis (What changes the ranking?).
          5.  Practical Implementation (How to put this in the spreadsheet).

      *   *Refining Priority 1 (Capabilities):* Emphasize that this bridges the gap between "income" (too blunt) and "welfare" (too subjective). It justifies *why* a boiler repair is a grant (health capability) vs. just "they have low income."
      *   *Refining Priority 2 (Adaptive Preferences):* This is crucial for application forms. Don't ask "What do you want?" Ask "What is broken?"
      *   *Refining Priority 3 (Responsibility/Luck):* This is the trustee argument killer. Advise a "soft" version. Don't investigate, but prioritize vulnerabilities (kids, disability) which proxy for "bad luck."
      *   *Deprioritizing Expensive Tastes:* Explicitly tell them to ignore this. It's a red herring for poverty charities.

      *   *Sensitivity Analysis:*
          *   *More Money:* Shifts focus from triage to development (maybe then tastes matter?).
          *   *Means Testing:* If income is verified, Resource equality becomes easier, making Capabilities less critical for *eligibility* but still key for *allocation*.
          *   *Asylum Seekers:* Zero income makes Resource equality useless (everyone is at zero). Capabilities becomes the *only* metric.

  6.  **Final Review against Constraints:**
      *   Did I answer "which questions deserve evenings"? Yes.
      *   Did I give a "defended pecking order"? Yes.
      *   Did I address "what would change the ranking"? Yes.
      *   Is it practical for a Leeds charity? Yes, focused on boilers, uniforms, jobs.

  7.  **Final Polish:** Ensure the distinction between "Equality of What" (theoretical) and "Allocation Guidelines" (practical) is clear. The goal isn't to solve philosophy, but to use philosophy to stop committee arguments. (Self-Correction: Make sure not to sound like I'm telling them to ignore the trustees' concerns, but rather how to channel them).

  8.  *(Self-Correction during drafting)*: I initially thought about suggesting Luck Egalitarianism as #2. But for a small charity, investigating *why* someone is poor is invasive and costly. Better to frame it as "Vulnerability Prioritization" which captures the spirit without the investigation. I will adjust the advice to reflect this practical constraint.

  9.  *(Final check on "Expensive Tastes")*: Make sure to explain *why* it doesn't matter. (Because the grants are capped at basic needs, no one can claim a holiday).

  10. *(Final check on "Adaptive Preferences")*: This is the most dangerous blind spot. Emphasize this.

  11. *(Final check on "Capabilities")*: This is the user's intuition. Validate it strongly.

  12. *Structure:* Introduction -> The Ranking -> The "Why" -> The "What Ifs" -> Practical Next Steps.

  (Proceed to generate response based on this thought process.)
answer: |-
  This is a brilliant position to be in. Most people apply philosophy to abstract societies; you are applying it to a spreadsheet with £40,000 in it. That makes the stakes real.

  You are correct that you are stumbling onto the "Equality of What?" debate (Sen, Cohen, Dworkin, Arneson). But you are also right to be suspicious of spending your evenings on puzzles that belong in a seminar room rather than a Leeds community centre.

  Here is a defended pecking order for how you should spend your committee time, ranked by **impact on allocation** versus **administrative cost**.

  ### 1. The Capabilities Approach (Sen/Nussbaum)
  **Priority:** **Critical (Spend 40% of your time here)**
  **The Question:** *Are we funding resources (cash) or functionings (what people can actually do)?*

  **Why this is #1:**
  Your intuition is the correct one for a grant-giving charity. "Equality of Resources" (income bands) fails because £200 means something different to a single adult than to a family of five with a disabled child. "Equality of Welfare" (who is saddest) fails because it rewards complaint and ignores resilience.

  The Capabilities Approach asks: *What is this money actually allowing this person to be or do?*
  *   **Boiler repair:** Not "heating resource," but "capability for thermal comfort and health."
  *   **School uniform:** Not "clothing resource," but "capability for social inclusion and education."
  *   **Childcare:** Not "service cost," but "capability for employment."

  **Practical Application:**
  Stop arguing about income bands as the sole metric. Instead, draft your guidelines around a short list of **Protected Capabilities**.
  *   *Example:* "We prioritize grants that restore the capability for: (1) Thermal safety, (2) Educational participation, (3) Employment retention."
  *   **Why it stops arguments:** It gives you a objective yardstick. If Trustee A wants to fund a holiday because "it makes them happy" (Welfare), you can say, "That doesn't meet our Capabilities threshold." If Trustee B wants to fund someone slightly above the income line because their boiler is broken (Resource vs. Capability), you can say, "Income is secondary to the capability for heat."

  ### 2. Adaptive Preferences (The "Shrunk Wants" Problem)
  **Priority:** **High (Spend 30% of your time here)**
  **The Question:** *How do we spot need when the applicant has given up asking?*

  **Why this is #2:**
  This is the biggest risk to your mission. If you rely on application forms that ask "What do you need?", you will miss the people who have learned that asking is futile. This is the "happy slave" problem applied to poverty. A mum might say "We're fine" because she's skipping meals to feed the kids, whereas a more vocal applicant might demand a new TV.

  **Practical Application:**
  You need to change *how* you gather data, not just how you weigh it.
  *   **Don't ask:** "How much do you want?"
  *   **Do ask:** "What specific activity has become impossible in the last 3 months?"
  *   **Third-party refs:** Require a referral from a professional (social worker, school liaison, GP). They can spot adaptive preferences better than a form can. They can say, "This family isn't asking for help, but the kids aren't attending school."
  *   **Why it matters:** If you ignore this, your "fair" split just goes to the most articulate applicants, not the neediest.

  ### 3. Responsibility and Luck (Luck Egalitarianism lite)
  **Priority:** **Medium (Spend 20% of your time here)**
  **The Question:** *Do we distinguish between bad luck (illness) and bad choices (debt)?*

  **Why this is #3:**
  This is where your trustee arguments are probably hottest. Philosophers like Dworkin argue we should compensate for "brute luck" (born disabled) but not "option luck" (gambled away savings).
  *   **The Trap:** Investigating *why* someone is poor is invasive, expensive, and humiliating. It requires a moral audit you aren't equipped to run.
  *   **The Fix:** Adopt a **"Vulnerability Proxy."** Don't ask "Whose fault is this?" Instead, prioritize categories that statistically correlate with brute bad luck.
      *   *High Priority:* Disability, sudden bereavement, fleeing domestic violence, systemic barriers (asylum seekers).
      *   *Lower Priority:* General debt, unemployment without other factors.
  *   **Why this ranking:** You can't solve the philosophical problem of free will in a year. But you can agree on a policy that *tilts* towards bad luck without interrogating applicants. This keeps the peace among trustees without creating an inquisition.

  ### 4. Expensive Tastes
  **Priority:** **Negligible (Spend 0% of your time here)**
  **The Question:** *Should we subsidize someone who needs £500 to be as happy as someone else needs £100 to?*

  **Why this is last:**
  In the context of a £40k poverty charity, this is a phantom problem. You are funding boilers and uniforms. No one is applying for a grant to satisfy a taste for foreign holidays or vintage wine.
  *   **The Exception:** The only version of this that matters is "high cost of living due to disability." But that is already covered under **Capabilities** (it costs more to achieve the same capability of 'mobility' or 'warmth').
  *   **Advice:** If a trustee raises this, tell them it's out of scope. Your grants are capped at basic needs. Expensive tastes are philosophically interesting but administratively irrelevant for you.

  ---

  ### Sensitivity Analysis: What would change this ranking?

  You asked what would shift this order. Here are three scenarios:

  **1. If you introduced rigorous Means-Testing (Resource Focus)**
  *   *Change:* If you require bank statements for everyone and set a hard income cutoff (e.g., "Under £20k only"), **Priority 1 (Capabilities)** drops slightly, and **Priority 3 (Responsibility)** rises.
  *   *Why:* Once income is verified, the "Resource" argument becomes stronger. You then have to decide what to do with the surplus applicants *within* the same income band. That forces you to look harder at "why" they are in that band (Responsibility/Luck).
  *   *Risk:* Means-testing increases admin burden and worsens the "Adaptive Preferences" problem (people hide assets or don't apply).

  **2. If the Council doubled your funding to £80k**
  *   *Change:* **Priority 3 (Responsibility)** drops. **Priority 1 (Capabilities)** expands.
  *   *Why:* With more money, you stop doing triage on "deservingness." You can afford to be less judgmental about choices. You can move from "preventing disaster" to "improving quality of life." You might start funding things that aren't strictly survival (e.g., a school trip rather than just the uniform).
  *   *Risk:* Scope creep. You must ensure the extra money doesn't drift into "Expensive Tastes."

  **3. If 1/3 of applicants were Asylum Seekers (Zero Income)**
  *   *Change:* **Priority 1 (Capabilities)** becomes the *only* metric. **Priority 3 (Responsibility)** becomes irrelevant.
  *   *Why:* "Equality of Resources" breaks down completely. If everyone has £0 income, income bands tell you nothing. You cannot judge "choice" when people have no legal right to work.
  *   *Action:* Your guidelines must shift entirely to "Severity of Capability Deprivation." Who is coldest? Who is most at risk of eviction? The philosophical debate collapses into pure humanitarian triage.

  ### Summary Advice for the Committee

  You have a year. Don't read Rawls or Dworkin. Do this:

  1.  **Month 1-3:** Draft a **"Capabilities Charter."** List the 5-6 specific functionings your charity exists to protect (Warmth, Hygiene, Education, Safety, Employment). Get the trustees to sign off on *this list* before discussing money. This solves the "Equality of What" argument by defining *your* "What."
  2.  **Month 4-6:** Redesign the application/referral form to target **Adaptive Preferences**. Focus on "barriers faced" rather than "money needed."
  3.  **Month 7-9:** Create a **Scoring Matrix** based on the Charter.
      *   *Boiler broken in winter:* +10 points (Warmth capability).
      *   *Child excluded from school due to uniform:* +8 points (Education capability).
      *   *Income below £15k:* +2 points (Resource proxy).
      *   *Disability/Health issue:* +5 points (Vulnerability/Luck proxy).
  4.  **Month 10-12:** Pilot the matrix on last year's applications. See if the output looks "fair" to the committee.

  **The Philosophical Bottom Line:**
  You are not building a just society. You are managing a scarcity constraint. The Capabilities Approach is the only framework that respects the dignity of the applicant (focusing on what they can *do*) while giving you the administrative tools to say "no" to requests that don't meet the threshold, without having to judge their moral character.

  Stick with Capabilities. It's the only one that fits the spreadsheet.
