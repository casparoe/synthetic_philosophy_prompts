answer: |-
  Here is the breakdown you need to keep Marta's science airtight, followed by a draft of the scene that puts the technical concepts into her exhausted, grieving voice.

  ### Part 1: The Science Check (For You)

  You have grasped the core concept correctly, but here are the specific nuances to keep Marta safe from email attacks:

  1.  **Heritability is a Ratio of Variance:** You are right. Heritability ($h^2$) is the proportion of *phenotypic variance* in a *specific population* at a *specific time* that is attributable to genetic variance.
      *   Formula: $h^2 = \text{Genetic Variance} / (\text{Genetic Variance} + \text{Environmental Variance})$.
      *   **The Trap:** If you equalize the environment (everyone gets great nutrition/schooling), Environmental Variance drops. The denominator gets smaller. Heritability goes **up**.
      *   **Danny's Error:** He thinks high heritability means "environment doesn't matter." The opposite is often true: high heritability often means "we have already successfully equalized the basic environment for this group, so now only genes distinguish us."
  2.  **The 80% Figure:** This is defensible for adult IQ in Western, educated, industrialized, rich, democratic (WEIRD) populations. It tends to rise with age (children are more influenced by shared home environment; adults select their own niches). However, it is **not** a fixed constant of nature. In populations with high environmental inequality (e.g., varying access to school or nutrition), IQ heritability drops significantly (sometimes to near zero).
  3.  **Within-Group vs. Between-Group:** You are 100% correct. High heritability *within* a group tells you **nothing** about the cause of differences *between* groups. (This is Lewontin's Fallacy). Danny is using a within-group statistic to justify a between-group or interventional nihilism.
  4.  **Modifiability:** High heritability does **not** mean a trait is unmodifiable. Height is 80%+ heritable, yet average height has increased by inches over the last century due to nutrition. The genes didn't change; the environment did.

  ### Part 2: The Examples (For Marta)

  Since you want to avoid PKU, here are the two best options for Marta's internal monologue.

  **Option A: Height (The Variance Argument)**
  *   **The Science:** In a wealthy country with universal nutrition, height is highly heritable (genes determine who is taller than whom). In a famine-struck region, height is lowly heritable (environment determines who grows and who stunts).
  *   **The Punchline:** "If we all stand on the same flat floor, the tall people are tall because of genes. If some of us are standing in a hole, the height difference is the hole, not the genes."
  *   **Why it works:** It's physical, intuitive, and directly addresses the "variance" issue.

  **Option B: Myopia/Nearsightedness (The Interaction Argument)**
  *   **The Science:** Myopia has a strong genetic component. However, in a population that doesn't read or use screens, heritability is low (almost no one is nearsighted). In a population of heavy readers, heritability is high (only those with the genes become nearsighted).
  *   **The Punchline:** "You can have the genes for bad eyes, but if you live in a cave, you'll see perfectly. The environment unlocks the gene."
  *   **Why it works:** It shows that "genetic risk" requires an environmental trigger.

  **Recommendation:** Use **Height**. It is the classic counter-argument to IQ determinism for a reason: it proves that a trait can be highly heritable *and* highly malleable by environment simultaneously.

  ### Part 3: The Scene (Chapter Twelve)

  **Context:** *Marta is at the sink. It is 2:17 AM. The casserole dish is her father's, the one with the burnt-on lasagna crust that requires soaking. She is talking to the ghost of Danny sitting at the kitchen table.*

  ***

  The sponge was gray with grease. Marta scrubbed the same spot on the casserole dish, the ceramic rough under her thumb, and let the argument play out in the silence of the kitchen.

  Danny's voice in her head was smug, lubricated by two years of algorithmic rage. *Eighty percent heritable, Marta. So why are you wasting Dad's money on tutors?*

  She dipped the dish, watched the soap bubbles pop.

  "Because you don't know what heritability means, Danny," she whispered to the empty room. "You think it's a ceiling. It's not. It's a snapshot."

  She imagined him leaning back, arms crossed. *So you're saying genes don't matter?*

  "No. I'm saying the math depends on the room you're standing in."

  She grabbed the example she used for undergrads when their eyes glazed over. Height.

  "Take height," she said, scrubbing harder. "In this country, height is eighty percent heritable. Maybe more. If I look at everyone in this town, the difference between you being five-ten and me being five-four is mostly DNA. Why? Because we all had enough to eat. We all had vaccines. The environmental noise is turned down low. So the genetic signal looks loud."

  She rinsed the dish. The water was cooling.

  "But put us in a famine, Danny. Put us in a place where half the kids get protein and half don't. Suddenly, height isn't eighty percent heritable. It drops. Maybe to twenty percent. Because now the environment is screaming so loud you can't hear the genes anymore. The variance is in the soil, not the seed."

  She turned off the tap. The silence rushed back in, heavy and wet.

  "That's what you're missing. When you say IQ is eighty percent heritable, you're bragging about how equal our environment is. You're saying, 'Look, we've fixed the schools and the nutrition so well that now the only thing left making us different is our DNA.' High heritability is a victory lap for the environment. It doesn't mean the environment stopped working."

  *So why bother?* Danny's voice again. *If it's in the blood, it's in the blood.*

  "Because the blood needs the ground to stand on."

  She dried her hands on the towel hanging from the oven handle. Her father's towel. It smelled like stale smoke and lemon detergent.

  "If I take a seed of the tallest corn in the world," she thought, "and I plant it in the dark, it dies. It doesn't reach its heritable height. The tutoring program isn't trying to change the seed, Danny. It's trying to turn on the lights."

  She knew he wouldn't listen. In the morning, he'd make coffee, ask her if she slept, and make a comment about how the government can't fix biology. He would confuse *inheritance* with *destiny* because destiny is easier to blame than policy.

  Marta looked at the clean dish. It was still just a dish. The crust was gone, but the chip on the rim from 1998 was still there. Some things you fix. Some things you just manage.

  "Genes load the gun," she said to the refrigerator. "Environment pulls the trigger. You're just mad because you think you're holding the gun, but you're actually just standing in the line of fire."

  She turned off the light. The house settled. She didn't feel better, but at least the science held.

  ***

  ### Part 4: Handling Danny's Pushback (If they speak aloud)

  If you need a moment where she actually engages him (perhaps the next morning), here is how to handle his likely rhetorical traps without Marta losing her cool.

  **Danny's Move 1: The "So Nurture is Everything?" Strawman**
  *   **Danny:** "Okay, so you're saying it's all environment? That my kids are the same as Einstein's if I just buy enough flashcards?"
  *   **Marta's Answer:** "No. I'm saying you can't measure the genetic difference until you equalize the opportunity. Right now, you're using a statistic from a privileged population to justify ignoring the kids who aren't privileged. You're using a map of the suburbs to navigate the ghetto."

  **Danny's Move 2: The "Naturalistic Fallacy" (Why Try?)**
  *   **Danny:** "If it's genetic, why waste the money? Let them find their level."
  *   **Marta's Answer:** "Because 'find their level' assumes the floor is flat. It's not. Tutoring doesn't change their genes, Danny. It changes the *heritability*. It reduces the environmental noise so their actual potential can show up. You're confusing the starting line with the finish line."

  **Danny's Move 3: The "Group Difference" Trap**
  *   **Danny:** "But the scores are different between [Group A] and [Group B]. You can't explain that away."
  *   **Marta's Answer:** "I don't have to. Heritability within a group says nothing about the difference between groups. I can have two fields of corn. Field A is short, Field B is tall. In Field A, the height differences are 100% genetic. In Field B, the height differences are 100% genetic. But the reason Field B is taller than Field A is because Field B got more fertilizer. You're looking at the plants and ignoring the soil."

  ### Final Note for the Author
  The emotional core of this scene isn't the science; it's that Marta knows the science can't actually fix her relationship with her brother. She wins the argument in her head at 2am, but she knows Danny will wake up and still be Danny. The science is her coping mechanism—a way to impose order on a situation (grief, family dysfunction) that is fundamentally chaotic. Let the exhaustion bleed through the technical terms. She shouldn't sound like a professor lecturing; she should sound like someone trying to convince herself that the world makes sense.
