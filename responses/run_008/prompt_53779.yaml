  What I want from you: a worked example (or a couple) that Marta can actually use in that scene — something showing a trait that's highly heritable in one environment/population and much less heritable in another even though the genes involved haven't changed at all. I've read that this happens because heritability is a statement about variance within a population at a given time, so if you even out the environment, genetics ends up explaining more of whatever variance is left, and vice versa — but I only half trust my paraphrase of that, so part of the job is telling me if I've got it subtly wrong (same with the 80% figure itself, I've seen it described as variance explained within a group and NOT a claim about any individual or about differences between groups, please confirm that's the right way to frame it).

