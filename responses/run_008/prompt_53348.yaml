answer: |-
  This is a classic problem in normative ethics, specifically within the literature on **autonomy and informed consent**. You have correctly identified that no single variable (truth, competence, voluntariness) does all the work. Your intuitions are actually more consistent than you think; they track a **context-dependent, norm-based theory** rather than a universalist one.

  You are implicitly using a framework I will call **Domain-Normative Materiality (DNM)**.

  Under DNM, consent is not a binary switch flipped by a specific mental state. It is a social contract that is valid only if the interaction adheres to the *normative script* of that specific domain, unless deviations are made salient and comprehended.

  Here is the principle, broken into three clauses, followed by the mapping, the cost (which intuitions you must drop), and the application to your new cases.

  ---

  ### The Principle: Domain-Normative Materiality (DNM)

  **Consent is valid if and only if:**
  1.  **(Comprehension over Disclosure):** The agent comprehends the *gist* of the material risks and nature of the act, regardless of whether all data was technically available. (Prioritizes understanding over information volume).
  2.  **(Normative Materiality):** Deception or omission only invalidates consent if it concerns a fact that is *material to the physical or normative definition* of the act within that domain. (Collateral lies do not void consent; core lies do).
  3.  **(Baseline Voluntariness):** The choice is not compelled by a threat that worsens the agent's *moral or safety baseline*, as opposed to merely withholding a benefit or applying social pressure.

  ---

  ### Mapping Your Cases to the Clauses

  **Case 1 (Surgeon):**
  *   **Verdict:** Honest ignorance = Valid; Knowing lie = Invalid.
  *   **Clause:** **Normative Materiality.** In medicine, risk rates are "material" by domain norm. However, *mens rea* matters for the validity of the *interaction*. If the surgeon is ignorant, the script wasn't violated intentionally (negligence is a separate tort, but consent stands). If he lies, he violates the normative script of the doctor-patient fiduciary relationship.
  *   **Fit:** Perfect.

  **Case 2 (Sex/Marriage/Condom):**
  *   **Verdict:** Marriage lie = Valid; Condom lie = Invalid; Unknown STD = Valid.
  *   **Clause:** **Normative Materiality.** In the domain of casual sex (implied by the context), physical barriers (condoms) and physical risks (STDs known to the partner) are material to the *physical act*. Marital status is a *collateral social fact*.
  *   **Fit:** Perfect. Your intuition that unknown STDs = valid aligns with Case 1 (Surgeon ignorance). You are consistent on *epistemic state*.

  **Case 3 (Pressure):**
  *   **Verdict:** Ride threat = Invalid; Nagging = Valid-ish; Drunk enthusiasm = Valid.
  *   **Clause:** **Baseline Voluntariness.** "Find your own ride home" threatens a safety baseline (abandonment in a vulnerable state). "Nagging" is social pressure within the normal baseline of persuasion. Drunk enthusiasm implies capacity was sufficient for the *gist* (Clause 1).
  *   **Fit:** Strong.

  **Case 4 (Old Man vs. Legalese):**
  *   **Verdict:** Old Man (gist) = Valid; Smart Person (buried info) = Invalid.
  *   **Clause:** **Comprehension over Disclosure.** This is the strongest evidence for your DNM intuition. You value the *actual understanding of the gist* (Old Man) over the *technical availability of data* (Legalese). The Legalese violates the norm that material risks should be salient.
  *   **Fit:** Perfect.

  **Case 5 (Fights vs. Breakups):**
  *   **Verdict:** Taunted fight = Valid; Breakup threat = Invalid.
  *   **Clause:** **Domain-Normative.** In the domain of "masculine posturing/fights," taunting is a standard script feature. In the domain of "intimate relationships," leveraging the relationship itself to extract sex violates the normative baseline of non-transactional intimacy.
  *   **Fit:** Strong, but requires accepting that domains have different rules for pressure.

  **Case 6 (ToS vs. Gym):**
  *   **Verdict:** ToS = Valid; Gym = Invalid.
  *   **Clause:** **Normative Materiality / Salience.** The domain norm for ToS is "nobody reads this." The domain norm for a gym contract is "this is a binding financial agreement." Burying clauses in the gym contract violates the salience norm; burying them in ToS adheres to the (unfortunate) norm.
  *   **Fit:** Perfect.

  ---

  ### The Price: Which Verdicts Must Go?

  To adopt DNM cleanly, you have to pay a price. There are two places where your gut verdicts conflict with the principle's rigorous application. You need to update one side or the other.

  **1. The "Breakup Threat" (Case 5)**
  *   **The Conflict:** DNM classifies "I will break up with you" as a threat to withhold a benefit (the relationship), not a threat to worsen a baseline (like the ride home). In standard liberal ethics, you have a right to end a relationship. Threatening to exercise a right is not coercion.
  *   **The Price:** To keep your verdict (Invalid), you must argue that intimate relationships create a *special duty* where leveraging the bond for sex is a baseline violation. To keep the Principle clean, you must admit this consent is **Valid** (though perhaps morally sleazy).
  *   **Recommendation:** If you value consistency with Case 3 (Ride Home), you must distinguish *safety* threats from *emotional* threats. I recommend updating your intuition: The breakup threat is **Valid consent**, morally dubious but not coercive in the same category as abandonment.

  **2. The Unknown STD (Case 2)**
  *   **The Conflict:** You said unknown STD = Valid (matching the Surgeon ignorance case). However, public health ethics often argue that bodily integrity is violated by transmission regardless of knowledge.
  *   **The Price:** DNM supports your intuition (Valid). However, if you believe bodily harm *always* voids consent regardless of the partner's knowledge, you must abandon the parallel with the Surgeon case.
  *   **Recommendation:** Keep your intuition here. It is consistent with Case 1. Ignorance negates the *deception* required to invalidate consent, even if harm occurs.

  **3. The Old Man (Case 4)**
  *   **The Conflict:** You lean "Valid" because he gets the gist. But if he "can't retain the actual odds," does he meet Clause 1 (Comprehension of Material Risks)?
  *   **The Price:** If "material risk" includes specific odds (e.g., 2% paralysis vs 20%), the Old Man's consent is **Invalid**. If "material risk" just means "could hurt me," it is **Valid**.
  *   **Recommendation:** Define "Gist" precisely. If the trial is *highly* risky, "could hurt me" is insufficient. You may need to harden this verdict to **Invalid** for high-risk trials to protect the vulnerable, even if it feels paternalistic.

  ---

  ### Application to New Cases

  Here is how DNM resolves your two new scenarios.

  **(a) The "Don't Tell Me" Biopsy**
  *   **Scenario:** Patient tells doctor: "Don't tell me the result unless it's bad. If it's fine, just say I'm fine." She relies on the 'fine'.
  *   **Analysis:**
      *   **Domain:** Medical.
      *   **Normative Script:** Usually, patients have a right to all info. However, patients also have a right to *refuse* information (Right Not to Know).
      *   **Clause 1 (Comprehension):** She understands the act (biopsy) and the contingency (deception if good).
      *   **Clause 2 (Materiality):** She is explicitly renegotiating the information norm.
  *   **Verdict:** **Valid.** This is a pre-authorized waiver of the information norm. The deception is not a violation of the script because she rewrote the script. The consent to the *procedure* stands, and the consent to the *information protocol* stands.
  *   **Caveat:** The doctor must document this waiver rigorously to ensure it wasn't a panic-driven decision (Capacity check).

  **(b) The Poker Game with Mechanics**
  *   **Scenario:** Guy agrees to a private poker game. He knows "some private games have card mechanics." This one does. He loses money.
  *   **Analysis:**
      *   **Domain:** Gambling / Private Games.
      *   **Normative Script:** Casino poker = No cheating. Private home games = Spectrum from honor to "shark tank."
      *   **Clause 2 (Materiality):** He entered with the belief that mechanics were *possible* ("knowing full well some... have mechanics").
      *   **Distinction:** Did he consent to *this specific game* having mechanics, or just the *risk* that it might?
      *   **Application:** If the norm of *this specific circle* is "honor among friends" and the host introduced mechanics secretly, consent is **Invalid** (Violation of local norm). If the norm of *this specific circle* is "anything goes" and he joined knowing that, consent is **Valid**.
  *   **Verdict:** **Invalid (leaning).** Why? Because he knew "some" games have mechanics, not that *this* one did. Entering a room where theft is *possible* is not consent to *be stolen from*. Unless the host explicitly said "This is a mechanics-allowed game," the default norm of poker is "skill + luck, no cheating." The host violated the baseline norm of the game itself. He consented to the *risk of losing*, not the *certainty of a rigged game*.

  ### Summary for Your Mental Model

  You are not looking for a principle of **Information** or **Capacity**. You are looking for a principle of **Fair Play within Context**.

  *   **Update:** Soften the "Breakup Threat" verdict. Distinguish safety coercion from emotional leverage.
  *   **Keep:** The distinction between Collateral Lies (Marriage) and Material Lies (Condoms/Risks).
  *   **Keep:** The preference for Comprehension (Old Man) over Disclosure (Legalese).

  Your intuitions are actually highly sophisticated; they just rely on implicit social contracts. Making those contracts explicit (DNM) resolves the contradictions.
