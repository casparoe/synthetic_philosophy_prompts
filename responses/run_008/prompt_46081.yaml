answer: |-
  (a) **Essay Question**

  **The Blame Ledger Paradox**

  Consider a proposed institutional fix for the problem of hypocritical blame: a public "Blame Ledger." Before agent A blames agent B for violating norm N, A must first disclose any known violations of N they have committed themselves on the ledger. This disclosure is public and permanent.

  Proponents argue this eliminates hypocrisy: A is not falsely signaling moral superiority, but merely enforcing a norm they admit to breaking. Critics argue this renders standing transactional, reducing moral authority to a conflict-of-interest disclosure that feels insufficient to ground the reactive attitudes.

  In a 90-minute essay, answer the following:
  1. Does pre-declaring violations on the Ledger restore A's standing to blame B? Defend your position.
  2. If the Ledger fails to restore standing, what does this imply about the *source* of standing loss? (Is it about signaling purity, or something else?)
  3. If the Ledger *succeeds*, does this make standing too cheap? If it *fails*, how do we avoid the conclusion that no imperfect agent has standing to blame (the "Nobody Can Blame" problem)?
  4. Conclude by explaining how blame retains its normative "stickiness" given your resolution.

  ***

  (b) **Model Answer**

  The Blame Ledger scenario functions as a reductio against purely epistemic or signaling-based accounts of standing. If standing were merely a matter of avoiding false claims to moral superiority, the Ledger should resolve the issue. By disclosing violations, the blower updates the audience's epistemic state; the signal of purity is withdrawn. Yet, the intuition persists that a Ledger-registered hypocrite still lacks standing. This suggests standing is not about information asymmetry, but about *authority*.

  If the Ledger fails to restore standing, the loss of standing cannot be rooted solely in deception. It must be rooted in a forfeiture of jurisdiction. When one violates a norm, one undermines one's own commitment to that norm's authority. To blame is not merely to describe a wrong; it is to demand accountability. A hypocrite, even an honest one, has demonstrated that they do not hold the norm as binding upon themselves. Therefore, they lack the positional authority to hold others bound by it. The Ledger confirms the lack of commitment rather than curing it.

  However, this creates the "Nobody Can Blame" paradox. If standing requires perfect adherence to the norm being enforced, and moral perfection is impossible, then standing is impossible. Blame loses its functional role in norm maintenance. A society where no one can blame is a society where norms cannot be socially reinforced.

  To resolve this, we must distinguish between *violations* and *repudiations*. Standing is lost not by the mere fact of violation, but by the attitude toward that violation. The Ledger hypocrite treats their violation as a cost of doing business—a checkbox to clear before enforcing rules on others. This instrumentalizes the norm. In contrast, an imperfect agent retains standing if they acknowledge their violation as a *failure* rather than an exemption. They must blame from a position of shared fallibility, not distinct jurisdiction.

  Therefore, the Ledger fails because it attempts to proceduralize a relational status. Standing is restored not by disclosure, but by the appropriate reactive attitude toward one's own faults (e.g., guilt, remorse, commitment to repair). If the Ledger succeeds merely as a disclosure mechanism, it makes standing too cheap, turning moral authority into a bureaucratic filing. If it fails, we avoid the "Nobody Can Blame" problem by recognizing that standing is compatible with imperfection, provided the blower does not claim exemption from the norm they enforce.

  Blame remains "sticky" because its force derives from the shared recognition of the norm's validity, not the blower's sinlessness. The hypocrite loses standing because their actions suggest they reject the norm's validity for themselves while imposing it on others. The Ledger exposes this disconnect but cannot bridge it. Thus, standing is grounded in the *integrity of commitment*, not the *history of compliance*.

  ***

  (c) **Marking Scheme (Total: 20 Points)**

  **A-Range (17–20 points)**
  *   **Identifies the Signaling Trap (5 pts):** Explicitly argues that the Ledger defeats the "false signaling" account. If disclosure doesn't fix standing, standing isn't about purity claims.
  *   **Authority vs. Information (5 pts):** Distinguishes between epistemic transparency (knowing the blower is flawed) and normative authority (the right to hold accountable).
  *   **Solves the Paradox (5 pts):** Addresses the "Nobody Can Blame" problem by distinguishing between *violating* a norm and *repudiating* it (or similar distinction like commitment vs. compliance).
  *   **Functional Analysis (5 pts):** Explains how blame retains normative force (stickiness) without requiring perfection.

  **B-Range (13–16 points)**
  *   **Identifies the Signaling Trap (5 pts):** Notes the Ledger makes hypocrisy "honest."
  *   **Authority vs. Information (3 pts):** Mentions authority but treats it as synonymous with reputation.
  *   **Solves the Paradox (3 pts):** Acknowledges the "Nobody Can Blame" issue but offers a pragmatic fix (e.g., "we just need blame") without philosophical grounding.
  *   **Functional Analysis (2 pts):** Discusses norm enforcement but misses the link to the blower's attitude.
  *   **Deductions:** -2 for relying heavily on standard cases (e.g., Bell/Fritz) without engaging the Ledger twist.

  **C-Range (9–12 points)**
  *   **Surface Engagement (5 pts):** Discusses hypocrisy generally but treats the Ledger as a minor detail.
  *   **Binary Thinking (4 pts):** Argues simply "Yes, Ledger works" or "No, it doesn't" without exploring the implications for the theory of standing.
  *   **Missing Paradox (3 pts):** Fails to address the "Nobody Can Blame" consequence.

  **Fail (0–8 points)**
  *   Misunderstands the prompt, ignores the Ledger, or fails to complete the essay.

  ***

  (d) **Instructor's Note on Model Answer Uncertainty**

  I am least confident in the distinction drawn between *violating* and *repudiating* a norm. This is a standard move in the literature (often associated with the "commitment condition"), but a sharp student could flip this scheme by arguing that the Ledger *does* work if we shift to a purely consequentialist view of blame.

  If blame is solely a tool for behavior modification, the Ledger is a feature, not a bug: it allows imperfect enforcers to maintain the equilibrium without deception. A student arguing this could claim my model answer smuggles in a retributive or deontological conception of standing that the prompt doesn't necessitate. If they successfully argue that "standing" is just a social technology for minimizing hypocrisy costs, the Ledger restores standing by definition.

  Additionally, the model answer assumes guilt/remorse is the alternative to the Ledger. A skeptic could argue this is just another ritual. If I were grading a paper that challenged the *coherence* of standing itself (arguing the concept is obsolete), I would need to award credit for that critique, even though it falls outside the marking scheme's positive framework. Adjust the "Functional Analysis" points if the student deconstructs the premise rather than solving it.
