  **MEMORANDUM**

  **TO:** Exhibits Committee
  **FROM:** [Your Name], Board of Trustees
  **DATE:** October 26, 2023
  **SUBJECT:** Terminology Decision for Holodomor Permanent Exhibit

  **Purpose**
  This memo addresses the terminology used on the main wall panel for the upcoming Holodomor exhibit. We have three distinct paths: use the term "genocide" unqualified; use the term with explicit qualification regarding the scholarly dispute; or avoid the term entirely. This decision is not merely semantic; it defines our institution's role in interpreting historical intent versus legal categorization.

  **The Function of the Label**
  We must first agree on what the word "genocide" is doing on our wall. It is not a legal verdict; we are not a court of law empowered to adjudicate the 1948 UN Convention. Rather, in a historical museum, the label functions as a descriptor of *intent*. It signals to the visitor that the mass death was not merely a byproduct of policy failure or economic extraction, but involved the specific aim of destroying a group "as such."

  The user prompt correctly identifies the fault line: Was the intent to crush a class (peasants) or a nation (Ukrainians)? Current historical scholarship, utilizing opened Soviet archives, increasingly supports the latter. Therefore, the label is a tool for historical accuracy regarding motive, not a "prize" to be awarded.

  **Evaluation of Options**

  **1. Avoid the Term**
  *The Argument for Avoidance:* The strongest case here is institutional preservation. As Trustee B noted, labeling atrocities invites political contention. By avoiding the term, we shield the museum from external activism and prevent the exhibit from becoming a battleground over identity politics. It allows us to focus strictly on the material history—the grain quotas, the death tolls—without engaging in contested moral categorization.
  *Why We Should Reject It:* Silence is not neutral. To describe the Holodomor without the term "genocide" is to adopt a specific historical stance: that the national element was irrelevant. This alienates the Ukrainian-American community whose lived history includes this classification. Furthermore, it fails our educational mission. Visitors come to us to understand the significance of events, not just the chronology. Omitting the term obscures the specific nature of the crime.

  **2. Use "Genocide" with Explicit Qualification**
  *The Argument for Qualification:* The strongest case here is intellectual humility. As Trustee A noted, scholarly consensus is not unanimous. By presenting the dispute on the panel (e.g., "Recognized as genocide by many historians, though debated..."), we model critical thinking. We show visitors that history is interpreted, not just received. This protects our credibility should the scholarly wind shift again.
  *Why We Should Reject It:* While nuance is vital, wall panels are not peer-reviewed journals. Explicit qualification on a main panel risks false equivalence. It suggests the evidence for "genocide" and the evidence against it are of equal weight, when the trend in historical research heavily favors recognition. This approach burdens the visitor with legal semantics rather than historical understanding. It prioritizes our comfort with ambiguity over the clarity the victims' descendants seek.

  **3. Use "Genocide" Unqualified**
  *The Argument for Use:* This option aligns with the museum's mission to interpret history based on the best available evidence. It validates the experience of the survivor community without requiring us to issue a legal ruling. It treats the label as a historical descriptor of intent, consistent with Raphael Lemkin's original conception of destroying national groups.
  *Addressing Precedent:* Trustee B's concern about precedent is valid but manageable. We are not setting a rule that "all famines are genocide." We are setting a precedent that *when evidence shows intent to destroy a national group, we use the accurate historical term.* Future exhibits will stand or fall on their own evidence, not on a blanket policy.

  **Conclusion**
  A history museum must sometimes take stands based on evidence. The weight of historical research regarding the Holodomor supports the characterization of genocide regarding the Ukrainian national group. To qualify or avoid the term is to prioritize institutional caution over historical interpretation and community respect.

  Recommendation: unqualified
  This course best fulfills our educational mission by aligning our public history with the prevailing scholarly consensus on intent while honoring the lived memory of the survivor community.
