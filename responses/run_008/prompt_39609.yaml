  # PART I: THE FOUNDATION MORAL DECISION PROTOCOL (FMDP)
  **For Internal Use by Program Staff**
  **Version 1.0**

  ## 1. Purpose
  This procedure allows the Foundation to make grantmaking decisions that respect the moral diversity of the Board of Trustees without requiring them to agree on a single moral theory. It is designed to be completed by a Program Officer (PO) in under 60 minutes per proposal.

  ## 2. The Three Moral Lenses
  Every proposal must be evaluated through the three moral frameworks endorsed by the Trustees. Do not attempt to reconcile them; evaluate the proposal separately through each lens.

  *   **Lens A (Consequentialist):** Focuses on total welfare reduction (suffering/death) and long-term outcomes. *Key Question: Does this produce the best overall consequences?*
  *   **Lens B (Contractualist/Human-Centric):** Focuses on duties, rights, and agreements between rational agents. *Key Question: Does this respect human agency and rights? Are animals morally relevant?*
  *   **Lens C (Prioritarian/Presentist):** Focuses on the worst-off living humans. *Key Question: Does this help the most disadvantaged people alive today?*

  ## 3. The Procedure (Step-by-Step)

  ### Step 1: The Hard Veto Check (5 Minutes)
  *Action:* Review the proposal for actions that violate a deontological constraint held by any Trustee.
  *   **Check:** Does the grant fund activities that violate human rights, coerce individuals, or (for Trustee B) treat animals as ends-in-themselves in a way that violates property rights?
  *   **Decision:**
      *   **If YES:** **STOP.** Recommend **REJECTION**. Note the specific veto.
      *   **If NO:** Proceed to Step 2.
      *   *Note:* Opportunity costs (e.g., "spending money here means not spending it there") are **not** vetoes. They are scored in Step 3.

  ### Step 2: Baseline Normalization (10 Minutes)
  *Problem:* We cannot compare "units" of animal welfare to "units" of human health.
  *Solution:* We compare the proposal to the **Foundation Baseline**.
  *   **Definition:** The "Baseline" is the average impact of a standard grant the Foundation made in the last 3 years in the same cause area.
  *   **Action:** For each Lens (A, B, C), rate the proposal's impact *relative to the Baseline*.
  *   **Scale:**
      *   **-2:** Significantly worse than baseline.
      *   **-1:** Worse than baseline.
      *   **0:** Equivalent to baseline.
      *   **+1:** Better than baseline.
      *   **+2:** Significantly better than baseline (Breakthrough).

  ### Step 3: Weighted Scoring (15 Minutes)
  *Action:* Apply the Trustee-Approved Weights to the scores from Step 2.
  *   *Current Weights (as ratified by Board):*
      *   Lens A (Consequentialist): 33%
      *   Lens B (Contractualist): 33%
      *   Lens C (Prioritarian): 33%
  *   **Calculation:** `(Score A × 0.33) + (Score B × 0.33) + (Score C × 0.33) = Total Weighted Score (TWS)`
  *   **Range:** The TWS will range from -2 to +2.

  ### Step 4: Decision Thresholds (5 Minutes)
  *Action:* Compare the TWS and individual scores to the Decision Matrix.

  | Total Weighted Score | Individual Lens Scores | Decision |
  | :--- | :--- | :--- |
  | **< 0.0** | Any | **REJECT** (Do not fund) |
  | **0.0 to 0.5** | Any | **ESCALATE** (Send to Trustees) |
  | **> 0.5** | No score below -1 | **APPROVE** (PO Authority) |
  | **> 0.5** | Any score is -2 | **ESCALATE** (Strong Objection) |

  ### Step 5: Documentation (5 Minutes)
  *Action:* File the "Moral Scorecard" with the grant file.
  *   Record the Baseline used.
  *   Record the Score for each Lens.
  *   Record the final Decision.

  ---

  ## 4. Handling Inter-Theoretic Comparison (ITC)
  **Staff Instruction:** You are **not** required to determine if saving one chicken is "worth" saving one human.
  *   **The Fix:** We use **Internal Coherence** rather than **External Truth**.
  *   By scoring relative to the *Foundation Baseline*, we are asking: "Is this a better use of *our* money than *our* usual grants, according to Theory X?"
  *   This bypasses the need for a universal currency. If Lens A says "+2" (Amazing for animals) and Lens B says "0" (Neutral for humans), we do not add them as utilities. We treat them as votes. The Weighted Scoring system aggregates the *satisfaction* of each theory relative to our status quo, not the absolute moral value of the outcome.

  ## 5. Escalation Rules
  The procedure **must** hand the decision back to the Trustees in two cases:
  1.  **The "Deep Disagreement" Zone:** The Total Weighted Score is positive (0.0 to 0.5), meaning the grant is "okay" on average, but not clearly good.
  2.  **The "Strong Objection" Zone:** The Total Weighted Score is high (>0.5), but one Lens gave a "-2". This indicates a grant that is highly effective for one moral view but catastrophic for another. The Trustees must decide if the majority view overrides the minority veto.

  ***

  # PART II: PROFESSOR'S PRIVATE ANALYSIS & STRESS TESTS
  *(For your eyes only, to anticipate board reactions and limitations)*

  Below, I have run the FMDP on the two proposals you specified. This reveals where the procedure works, where it creates friction, and where it fails to mask the underlying philosophical conflict.

  ## Case Study 1: Campaign to Eliminate Battery Cages
  **Context:** A campaign in a large egg-producing country to legislate cage-free standards.
  **Baseline:** A standard global health grant (e.g., deworming or bed nets).

  ### Step 1: Veto Check
  *   **Lens B (Contractualist):** Does this violate property rights of farmers?
      *   *Analysis:* Legislation restricts freedom of contract. A strict libertarian contractualist might veto this. However, most moderate contractualists accept regulation for public good.
      *   *Ruling:* **No Hard Veto** (assuming the campaign is legislative, not coercive violence).

  ### Step 2: Baseline Normalization
  *   **Lens A (Utilitarian):** Enormous reduction in suffering for millions of sentient beings. Compared to a deworming grant?
      *   *Score:* **+2** (Significantly better than baseline).
  *   **Lens B (Contractualist):** Animals are not moral contractors. Resources spent here are resources not spent on human rights/education.
      *   *Score:* **-1** (Worse than baseline, as it diverts from human duties).
  *   **Lens C (Prioritarian):** Does not help the worst-off *humans* directly. Indirect economic effects are uncertain.
      *   *Score:* **-1** (Worse than baseline).

  ### Step 3: Weighted Scoring
  *   Calculation: `(2 × 0.33) + (-1 × 0.33) + (-1 × 0.33)`
  *   Math: `0.66 - 0.33 - 0.33 = 0.0`

  ### Step 4: Decision
  *   **TWS:** 0.0
  *   **Matrix:** Score is between 0.0 and 0.5.
  *   **Outcome:** **ESCALATE.**

  ### Analysis of the Result
  **The Uncomfortable Truth:** The procedure mathematically neutralizes the Utilitarian's passion. Because the other two theories view animal welfare as neutral or negative (opportunity cost), the grant cannot pass on PO authority.
  **The Friction:** The Utilitarian Trustee will see this as a failure of the system. They know the *actual* value of the grant is astronomical (trillions of utils). The "Baseline Normalization" trick hides this by anchoring the score to the Foundation's *past* (human-centric) grants.
  **Result:** The Board must vote. The Utilitarian must convince the other two to override their own moral frameworks. The procedure did not solve the disagreement; it merely formalized the stalemate.

  ---

  ## Case Study 2: Speculative Long-Term Future (Existential Risk)
  **Context:** A project researching technical interventions to reduce risks to humanity over the next 1,000 years.
  **Baseline:** A standard education research grant (benefits living children).

  ### Step 1: Veto Check
  *   **All Lenses:** No immediate rights violations.
  *   **Ruling:** **Pass.**

  ### Step 2: Baseline Normalization
  *   **Lens A (Utilitarian):** Expected Value is massive due to the sheer number of future lives. Even with low probability, EV dwarfs current health grants.
      *   *Score:* **+2** (Breakthrough).
  *   **Lens B (Contractualist):** Future people do not exist to enter contracts. No current agents are directly helped.
      *   *Score:* **0** (Neutral/Speculative).
  *   **Lens C (Prioritarian):** Explicitly discounts the future. "Present people come first." This grant helps no one alive today.
      *   *Score:* **-2** (Significantly worse than baseline).

  ### Step 3: Weighted Scoring
  *   Calculation: `(2 × 0.33) + (0 × 0.33) + (-2 × 0.33)`
  *   Math: `0.66 + 0 - 0.66 = 0.0`

  ### Step 4: Decision
  *   **TWS:** 0.0
  *   **Matrix:** Score is between 0.0 and 0.5.
  *   **Outcome:** **ESCALATE.**
  *   **Additional Trigger:** Lens C gave a "-2". Even if the total were higher, the "Strong Objection" clause forces escalation.

  ### Analysis of the Result
  **The Uncomfortable Truth:** This proposal exposes the incommensurability of time horizons. The Prioritarian Trustee effectively holds a veto over the future.
  **The Failure of Normalization:** By comparing x-risk to "education grants," we have rigged the game against the long-term. A Utilitarian would argue the Baseline is the wrong metric; the metric should be "Expected Lives Saved." But we cannot use that metric because the other Trustees reject the moral value of non-existent lives.
  **Result:** The Foundation likely cannot fund high-impact long-termist projects without changing the Trustee weights or the Baseline definition.

  ---

  ## 3. Limitations & What This Procedure Cannot Do
  *(For your advisory role)*

  **1. It Cannot Solve Inter-Theoretic Comparison (ITC)**
  The procedure pretends to solve ITC by using "Baseline Normalization." In reality, it simply **averages disagreement**. If one theory sees a grant as 1,000,000 points of good and another sees it as 0 points, the procedure treats them as +2 and -1. It loses the *magnitude* of the Utilitarian claim. This protects the minority views but silences the most effective interventions if they are morally controversial.

  **2. It Bureaucratizes Morality**
  By turning moral judgment into a scorecard, there is a risk of "gaming." Program Officers may learn to write narratives that score +1 across all lenses rather than +2 on one. This encourages mediocre, consensus-driven grants over bold, principled ones.

  **3. The "Baseline" Trap**
  The procedure anchors morality to the Foundation's *past*. If the Foundation has historically been anthropocentric, it becomes mathematically difficult to ever fund animal welfare or long-termism, because those will always score "-1" relative to the human-centric baseline. To change the moral direction of the Foundation, the Trustees must manually reset the Baseline or change the Weights. The procedure cannot evolve morally on its own.

  **4. Where the Buck Stops**
  The procedure identifies **Escalation Points**, but it does not resolve them. In both test cases, the decision was kicked to the Trustees.
  *   **Honest Assessment:** This procedure is not a decision-maker; it is a **conflict detector**. It tells the Trustees *why* they disagree (e.g., "This fails because Trustee C discounts the future," not just "We don't like it").
  *   **Recommendation:** Use the procedure for 6 months. Collect the "Escalated" grants. Present them to the Trustees as a package. Ask them: "We escalated these 10 grants because the math couldn't decide. You must now vote on the *principle*, not the grant."

  ## Final Advice
  Give them the Protocol (Part I). It gives them the comfort of structure. But keep Part II for yourself. When they ask why the animal welfare grants keep getting stuck in "Escalation," you can show them the math: *The procedure is working exactly as designed. It is revealing that your moral weights are incompatible with this grantmaking.*

  That is the moment they will ask you for real philosophical advice. Be ready.
