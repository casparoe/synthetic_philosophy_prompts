answer: |-
  **TO:** The Governing Board
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Memorandum on Screening Protocol and Jury Integrity

  **RECOMMENDATION**

  I recommend that the board adopt the Chair's proposed protocol for managing submission volume, subject to one critical revision: the top twenty semifinalists must be assessed by two independent screeners rather than one. Furthermore, we must formally reject the "chain-of-custody" amendment as procedurally unworkable, while affirming its underlying ethical concern in our deliberation guidelines.

  **CONTEXT AND EFFICIENCY**

  We face a logistical crisis. With submissions exceeding two hundred titles annually, the traditional model of full jury reading is unsustainable. The Chair's protocol correctly identifies that we must delegate initial filtering to a screening panel. I urge the board to take the efficiency argument seriously. Our screeners are seasoned critics and journalists; their judgments are not merely data points but expert testimonies. Certain qualities essential to popular science writing—structural rigor, clarity of explanation, factual accuracy—transmit reliably through description. A screener can accurately report that a chapter drags or an argument collapses without the jury needing to witness the collapse firsthand. To insist on total direct acquaintance is to prioritize purity over function, risking the prize's ability to operate at all.

  **THE CHAIN-OF-CUSTODY AMENDMENT**

  The proposed chain-of-custody rule—that testimony is admissible only from those with first-hand acquaintance—gets the epistemology right but the procedure wrong. It correctly identifies that aesthetic evaluation is not purely factual. When we say a book is "beautiful" or "profound," we are not stating a verifiable fact like "the book has 300 pages." We are offering a grounded response. Therefore, secondhand characterization is inherently degraded; it is an assessment of an assessment.

  However, adopting this rule as a strict prohibition would paralyze the jury. Deliberation is inevitably collaborative; we rely on each other's insights to sharpen our own. If a juror reads a book and convinces the others of its merit through persuasion, those others are technically relying on testimony. To ban secondhand characterization is to ban deliberation itself. The amendment fails because it treats literary judgment like legal evidence, ignoring that our goal is consensus, not adjudication.

  **THE STANDING TO PRAISE**

  Yet, the anxiety driving the amendment is valid. There is a distinction between finding the truth and having the standing to proclaim it. We might accurately identify the best book via screeners' reports, but if the jury's belief arrives solely by report, our public praise lacks authority. The prize is not merely a consumer guide; it is a cultural endorsement. When we award a prize, we are not just saying, "This book is good." We are saying, "We, the jury, have encountered this work and bear witness to its excellence."

  If our belief arrives by report rather than acquaintance, we outsource our judgment. We become administrators of other people's opinions rather than judges in our own right. This creates an epistemic distance that weakens the prize's standing. We cannot fully own a judgment we have not personally verified. The Chair's protocol mitigates this by requiring the jury to read the top five cover-to-cover. This ensures that the winner is known directly by the jury. However, it leaves the elimination process vulnerable. If a masterpiece is eliminated at the screening stage based on a single reader's idiosyncratic report, the jury never has the chance to acquire the standing to praise it.

  **PROPOSED REVISION: DOUBLE-SCREENING**

  To balance efficiency with integrity, I propose we require double-screening for the top twenty semifinalists. Under the Chair's original protocol, a single screener's two-page assessment can eliminate a book from contention before the jury sees it. This places excessive weight on one individual's subjective response. By requiring two independent assessments for the semifinal tier, we reduce the risk that a significant work is discarded due to a single screener's fatigue, bias, or misinterpretation.

  This revision respects the efficiency argument—it does not require the jury to read two hundred books—while addressing the chain-of-custody concern. It ensures that the reduction from longlist to shortlist is robust enough that the jury can trust the pool from which they select their final five. It acknowledges that while we cannot all read everything, we can ensure that the books reaching our desk have survived a more rigorous vetting than a single opinion can provide.

  **CONCLUSION**

  We must accept that some delegation is necessary. We cannot read every word submitted. But we must not delegate our responsibility to ensure the pool of finalists is robust. The Chair's protocol provides the necessary structure; the double-screening revision provides the necessary safety; and the rejection of the chain-of-custody rule preserves our ability to deliberate freely.

  Let us adopt this modified protocol. It allows us to manage the volume without surrendering the authority that comes from direct encounter. We must ensure that when we announce a winner, we do so not because a report told us it was excellent, but because we have secured the conditions necessary to recognize that excellence ourselves.

  **[Your Name]**
  **Board Member**
