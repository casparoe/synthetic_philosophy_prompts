  5.  **Identifying Tensions/Unfalsifiability:**
      *   The "Steelman" problem: If the AI is too smart, it hides its intentions. This makes the argument hard to test *before* it happens.
      *   The "Definition" problem: Defining "intelligence" or "alignment" vaguely allows moving goalposts.
      *   Incompatibility: Can you have superintelligence *and* guarantee it stays boxed? (If it's superintelligent, it escapes. If it stays boxed, was it superintelligent?)

  6.  **Identifying the "Kill Shot" Requirement:**
