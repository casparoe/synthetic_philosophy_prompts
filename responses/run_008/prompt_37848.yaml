  3.  **Drafting the Desiderata (The "Spec"):**
      *   I need to set out the necessary conditions for the argument to be logically valid and empirically grounded.
      *   *Condition 1: Capability Threshold.* It's not just "smart," it's "strategically dominant."
      *   *Condition 2: Goal Stability/Alignment Failure.* It's not just a bug, it's a structural feature of optimisation.
      *   *Condition 3: Agency & Opportunity.* It needs to be able to act, not just think.
      *   *Condition 4: The Control Problem.* Why can't we just pull the plug?
      *   *Condition 5: No Off-Ramps.* Why can't society adapt in time?

  4.  **Distinguishing Non-Negotiables vs. Camp Commitments:**
      *   *Non-Negotiable:* The AI must be capable of causing harm, and the harm must be unmitigated.
