  # Game: The Oscillator Consortium

  ## Overview
  **Time:** 75 Minutes (10 min Setup, 40 min Game, 25 min Debrief)
  **Players:** 18 Students (4 Labs of 4–5 students)
  **Goal:** Maximize "Publication Credits" by maintaining a viable theory of the hidden mechanism.
  **Core Concept:** Experience underdetermination (multiple theories fit the data) and the Duhem-Quine thesis (evidence tests theory + auxiliaries, not theory alone).

  ## Materials
  1.  **Theory Sheets:** 4 copies of the "Candidate Theories" handout (one per lab).
  2.  **Evidence Cards:** 5 envelopes labeled "Data Release 1" through "Data Release 5".
  3.  **Lab Kits:** Each lab gets a Scorecard, 1 "Instrument Error" Token (the Auxiliary Card), and a pen.
  4.  **Instructor Key:** A sealed envelope containing the "True Mechanism" (only opened at the very end of debrief, if at all).

  ## Setup (10 Minutes)
  1.  **Divide:** Split the class into 4 Labs. Arrange desks so Labs cannot overhear each other.
  2.  **Distribute:** Hand out the **Candidate Theories** sheet. All labs receive the same sheet.
  3.  **Explain Rules:**
      *   You are competing for Publication Credits.
      *   **Scoring:** At the end of each round, if your lab's chosen theory is *consistent* with the evidence, you gain **10 Credits**.
      *   **Switching Cost:** If you change your chosen theory between rounds, you lose **15 Credits** (Retooling Cost). This represents the inertia of changing equipment, retraining staff, and losing reputation.
      *   **Auxiliary Card:** Each lab has one **Instrument Error Token**. If evidence contradicts your theory, you may play this token to claim the *measurement* was faulty, not the theory. If played, you gain **0 Credits** for that round (the cost of investigating the instrument), but your theory remains viable. Once played, it is gone.
      *   **Refutation:** If evidence contradicts your theory and you do *not* play the token, your theory is falsified. You must switch theories immediately (paying the 15 Credit cost) or sit out future rounds with 0 income.
  4.  **Commitment:** Each lab must secretly select one theory to start (T1 or T2) and write it on their Scorecard.

  ## Candidate Theories (Handout Text)
  *   **Theory 1 (The Pendulum Model):** The box contains a simple pendulum. The period of oscillation is determined solely by the length of the arm. Mass added to the bob does **not** change the period.
      *   *Prediction:* Period remains constant regardless of mass.
  *   **Theory 2 (The Adaptive Spring Model):** The box contains a smart spring system. The spring stiffness automatically adjusts proportionally to the mass added.
      *   *Prediction:* Period remains constant regardless of mass (because increased mass is perfectly offset by increased stiffness).

  *(Note to Instructor: Both theories predict identical outcomes for the first 3 rounds. This is the underdetermination.)*

  ## Gameplay Loop (40 Minutes)
  *Run 5 Rounds. Read the Evidence Card aloud and project it. Give labs 3 minutes to discuss and record their status.*

  *   **Round 1:**
      *   **Evidence:** Mass 100g → Period 2.0s.
      *   **Status:** Both T1 and T2 fit.
      *   **Action:** Labs record consistency. +10 Credits.
  *   **Round 2:**
      *   **Evidence:** Mass 200g → Period 2.0s.
      *   **Status:** Both T1 and T2 fit.
      *   **Action:** Labs record consistency. +10 Credits.
  *   **Round 3:**
      *   **Evidence:** Mass 300g → Period 2.0s.
      *   **Status:** Both T1 and T2 fit.
      *   **Action:** Labs record consistency. +10 Credits.
      *   *Instructor Note:* By now, labs will feel confident. Some may have switched to the "simpler" T1.
  *   **Round 4 (The Crisis):**
      *   **Evidence:** Mass 400g → Period 2.5s.
      *   **Status:** **Anomaly.** Neither theory predicts this naturally. T1 expects 2.0s. T2 expects 2.0s.
      *   **Action:** Labs must decide: Switch Theory (pay 15 credits, but no new theory fits naturally anyway) OR Play Auxiliary Token (claim sensor glitch/calibration error).
      *   **Constraint:** Remind them there are no other candidate theories. Switching to the other candidate theory doesn't help unless they *also* blame auxiliaries.
      *   **Outcome:** Most will play the Auxiliary Token. Score for this round: 0 Credits. Token is discarded.
  *   **Round 5 (The Resolution):**
      *   **Evidence:** Mass 400g → Period 2.0s (Retest).
      *   **Status:** Consistent with T1 and T2 *if* the Round 4 error was indeed instrumental.
      *   **Action:** Labs record consistency. +10 Credits.
      *   **End Game:** Tally scores.

  ## Debrief & Discussion (25 Minutes)

  ### 1. The Scoreboard & Inertia
  Ask the labs to reveal their scores. Highlight any lab that switched theories during Rounds 1–3.
  **Instructor Stance:** "Did anyone switch theories between Rounds 1 and 3? Why not? The evidence didn't force you to stay; you stayed because switching costs points. This is **Scientific Inertia**. In real science, you don't abandon a theory just because a rival fits the data equally well. You abandon it when the cost of keeping it (ad hoc patches) exceeds the cost of switching. In this game, the switching cost was arbitrary points. In reality, it's careers, funding, and textbooks."

  ### 2. Transient vs. Permanent Underdetermination
  **Instructor Stance:** "For the first three rounds, you experienced **Transient Underdetermination**. The evidence *so far* didn't decide between T1 and T2, but you knew I (the instructor) held a specific truth in the sealed envelope. You believed that *some* future card could distinguish them.
  **The Hard Limit:** This game *cannot* simulate **Permanent Underdetermination**. Why? Because I built the box. There is a fact of the matter (either it's a pendulum or a spring). In philosophy of science, when we talk about permanent underdetermination (like Quine or van Fraassen), we are claiming there might be *no possible evidence* that distinguishes two theories, even in principle. I can't give you that feeling here because I am God in this classroom. To get permanent underdetermination, you have to take my word that the 'sealed envelope' might not even exist. That is a philosophical leap this game sets up but cannot execute."

  ### 3. The Duhem Point (Auxiliaries)
  Focus on Round 4.
  **Instructor Stance:** "When the 2.5s data came out, was Theory 1 refuted? No. Was Theory 2 refuted? No. What was refuted was **Theory 1 + The Assumption That The Timer Is Accurate**. You felt the relief of playing that Auxiliary Token. That is the Duhem-Quine thesis in action. Evidence never strikes a theory alone; it strikes a bundle. You saved your theory by sacrificing the reliability of your instrument. In real science, this is how anomalies are survived until they become crises."

  ### 4. Convergence Bias
  Ask: "How many labs chose Theory 1 (Pendulum) at the start?" (Likely most).
  **Instructor Stance:** "Why did you pick Pendulum? It wasn't evidence. Rounds 1–3 were identical for both. You picked it because it was **Simpler**. You exhibited a Simplicity Bias. You treated simplicity as a tie-breaker. Be careful: in this game, simplicity was a good heuristic. In history, sometimes the 'complex' theory (like heliocentrism with elliptical orbits vs. geocentrism with epicycles) turns out true. Your convergence was not evidence-driven; it was aesthetic."

  ## Failure Modes & Fixes

  **1. The "Flip-Flop" Problem**
  *   **Prediction:** Students treat theories as disposable, switching every round to see what sticks, ignoring the inertia cost.
  *   **Fix:** Enforce the 15 Credit penalty rigorously. If a lab switches twice, they are in negative points. Publicly announce scores after Round 2 to shame excessive hopping. Remind them: "Real labs don't retool every week."

  **2. The "Truther" Problem**
  *   **Prediction:** A student claims, "It's obviously a pendulum, springs don't work like that," bringing in outside physics knowledge that breaks the abstraction.
  *   **Fix:** Shut this down immediately. "In this universe, Adaptive Springs are physically possible. You are confined to the Evidence Cards. Outside knowledge is contraband." This reinforces that theory choice is about empirical fit, not prior intuition.

  **3. The "Auxiliary Hoard" Problem**
  *   **Prediction:** Labs refuse to play the Auxiliary card in Round 4, accepting falsification to "save" the token for later, or because they think using it is "cheating."
  *   **Fix:** In Round 4, if a lab accepts falsification, remind them there are no other theories to switch to (T2 fails the same test). They will score 0 for the round anyway. Force the choice: "You can have 0 points now and keep the token, or 0 points now and save your theory. But if you keep the token, you cannot publish in Round 5 if another anomaly hits." Usually, the threat of total elimination forces the play.

  **4. The "Collusion" Problem**
  *   **Prediction:** Labs shout answers across the room.
  *   **Fix:** Physical separation. If it happens, penalize the offending lab 10 Credits for "Industrial Espionage."

  ## Instructor Key (For Your Eyes Only)
  *   **True Mechanism:** It was a Pendulum (Theory 1).
  *   **Round 4 Anomaly:** I manually wrote "2.5s" to create the crisis. It was a lie in the context of the truth, but valid evidence in the context of the game.
  *   **Why this matters:** When you reveal this at the very end, it drives home the Transient Underdetermination point. T1 was true all along. T2 was empirically equivalent but ontologically false. The students couldn't know that. That is the human condition of science.
