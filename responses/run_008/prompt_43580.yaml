prompt: |-
  I teach a 200-level philosophy of science class — about 18 students, one 75-minute session. Design an in-class game that makes them feel underdetermination of theory by evidence rather than just hear about it. The setup I have in mind (you make the final calls though, and commit to them — no "you could do A or B" menus in the writeup): the class splits into rival labs, and there's a sealed "world" that I feed them evidence from, one card at a time. There should be a fixed pool of candidate theories handed out at the start, at least two of which fit every card I will ever release, so that by mid-game the surviving labs are stuck in genuine underdetermination — same evidence, incompatible theories, and everybody knows it. Then hit the front-runner with what looks like a clean refutation, and give each lab exactly one "blame the auxiliary" card they can play once to save their theory at a cost, so they feel the Duhem point that it's never a lone theory that faces the evidence, it's the theory bundled with assumptions about instruments and background conditions. Please also decide for me whether switching theories costs the lab points (a retooling cost, standing in for scientific inertia) — pick a scheme and defend it, don't leave it open. Payoffs should be points / publication credit, no real money.

  For the debrief, have it map what actually happened onto the distinction between what I'm calling transient underdetermination (the evidence so far doesn't decide between the theories, but some further observation could) and permanent underdetermination (no possible observation could decide it) — and it needs to be honest that my sealed world has a real mechanism in it, so the game can only ever produce the transient kind; the permanent kind I have to supply by talking, which is exactly the part a game can't reproduce. Also tell me what will predictably go wrong the first time I run it (I'm guessing: labs flip-flopping on every single card early, and someone refusing to use the evidence at all) and how I should handle it.

  Start the response with the game itself — rules, materials, timeline — no preamble and no restating my question back at me. The failure-modes section and the honest-limits note come after the game writeup, not before. And wherever the debrief has to take a stand on what the episode showed (e.g. whether the labs' convergence on one theory was evidence-driven or just simplicity bias), take the stand — give your best answer with reasons, don't lay out the interpretations and leave me to pick.
