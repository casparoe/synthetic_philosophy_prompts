answer: |-
  Verdict
  Your conclusion does not stand. Expected value is not broken; your application contains a hidden false assumption. The paradox arises because you treated the amount in hand as fixed while simultaneously treating it as a variable. This is a logical error in setting up the equation, not a failure of expected value itself. Trust expected value for insurance and jobs, provided you define probabilities correctly. The envelope puzzle warns about sloppy setup, not a reason to discard the tool.

  The step that fails
  The single wrong move is assuming that seeing $100 makes it equally likely the other envelope holds $50 or $200. This assumes every possible amount of money was equally likely to be put in the envelopes to begin with, which is impossible. In reality, there must be some limit or distribution governing how the host fills the envelopes. If the host never puts more than $150 total in the game, seeing $100 guarantees the other is $50, not $200. If the host uses a realistic budget, seeing a very high number makes it unlikely the other is double. You cannot assign 50/50 odds to doubling or halving without knowing how the money was chosen. By treating the $100 as fixed for the calculation but variable for the probability, you double-count the uncertainty. Essentially, you average two different scenarios as if they were the same. The variable $A$ represents different underlying values depending on whether you picked the smaller or larger envelope. You cannot simply plug it into an average without accounting for the prior probability of that amount appearing. This distinction is where logic collapses. Consequently, the math breaks because the probability depends on the amount, but your equation pretends it doesn't.

  Whether expected value survives
  Expected value survives intact. This puzzle is a specific trap involving undefined probabilities, not a general indictment of the concept. In real-life decisions like insurance or job offers, you usually have data to estimate probabilities reasonably well. You know the cost of premiums, the risk of accidents, or the salary ranges. The envelope problem fails because it hides the prior distribution entirely. When you have actual statistics—like accident rates or market salaries—expected value remains the gold standard for weighing risks. It only fails when you invent probabilities out of thin air, as you did with the 50/50 assumption here. Do not let a parlor trick involving infinite possibilities scare you away from a tool that works perfectly for finite, measurable risks. It is robust overall where information exists.

  What I should do instead
  For real decisions, keep using expected value consistently, but sharpen your inputs. Instead of assuming equal odds, gather data on how likely outcomes are. For insurance, compare the premium to the expected loss based on actual risk statistics. Always check your sources for bias. For job offers, weigh the salary against the probability of the company succeeding. If probabilities are truly unknown, use "expected utility" rather than raw money, accounting for how much you value security versus gain. Consider the long-term impact. Don't abandon the math; just ensure carefully the numbers you feed into it reflect reality, not convenient assumptions.

  How sure you are
  I am virtually certain based on current mathematical consensus that the reasoning error identified is the standard resolution. The weakest point is claiming real-life probabilities are knowable; sometimes they are genuinely ambiguous or rely on subjective judgment. If a mathematician demonstrated a valid probability distribution where switching always yields positive expected value without contradiction, I would change my mind immediately.
