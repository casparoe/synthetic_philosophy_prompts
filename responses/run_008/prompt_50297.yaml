      *   *Pituitary Anatomy:* The posterior pituitary is an extension of the hypothalamus. If the hypothalamus is secreting ADH, is the "entire brain" dead? Technically, no. But clinically, yes. The committee's consistency relies on whether they view "functions of the entire brain" as "every neuron" or "critical integrative functions." Case 1 suggests the latter (spinal neurons firing didn't stop death declaration). Case 4 suggests the latter (skin cells metabolizing didn't stop death declaration).
      *   *Decision:* The committee should declare death to remain consistent with Case 1 and Case 4.

  9.  **Drafting the Content:** (Mental Outline)
