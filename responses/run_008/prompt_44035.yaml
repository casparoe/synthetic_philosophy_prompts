answer: |-
  **Dublin, 1736. The Eagle Tavern, near Christ Church Cathedral.**

  **The rain is drumming hard against the leaded glass. Inside, the air is thick with tobacco smoke and the smell of wet wool. GEORGE BERKELEY, Bishop of Cloyne, sits with a stack of pamphlets—*The Querist*—beside his coffee cup. Opposite him is THOMAS STERLING, a merchant and fellow of Trinity College, a man who trusts weight and measure above all else.**

  **STERLING**
  (Tapping the pamphlet with a silver shilling)
  Query Forty-One. *"Whether the true idea of money, as such, be not altogether that of a ticket or counter?"* You write plainly enough, Bishop. But plain writing often masks a dangerous simplicity.

  **BERKELEY**
  Is it simple, Mr. Sterling? Or is it merely that we have confused the sign for the thing signified? I ask only what money *does*. It reckons, it records, it transfers. If a chip of wood or a scrap of paper performs these offices as well as a lump of silver, why must we worship the lump?

  **STERLING**
  Because the lump *is* the value. The paper is a promise. The silver *is* the payment. You propose we build the commerce of Ireland on a foundation of promises, while the real coin—the solid, honest silver—drains away to London like water through a sieve.

  **BERKELEY**
  And where does that leave us? With a sieve and no water. I have walked the roads of the south. I have seen men willing to work, land willing to bear, and yet no trade moves. Why? Because there is no medium to stir the industry. If silver refuses to stay, let us keep a token that will.

  **STERLING**
  A token backed by what? Air? Mr. Locke settled this forty years ago during the recoinage crisis. You cannot raise the denomination of coin and expect wealth to materialize. If you call a crown six shillings, you have not created value; you have merely renamed it. Your bank notes are the same trick writ large. You stamp a rag with a "Five Pounds" and pretend you have conjured five pounds of wealth.

  **BERKELEY**
  (Leaning forward)
  Locke was a great man, but he looked at money as a philosopher of nature, not a physician of the state. He asked what money *is*. I ask what money *is for*. Is wealth not the ability of a people to clothe and feed themselves? I put it in Query Fifty-Three: *"Whether the four elements, and man's labour therein, be not the true source of wealth?"* Silver cannot be eaten, Mr. Sterling. It cannot build a house. Labour does that. Money is but the whip to stir the labourer. If a paper whip cracks louder than a silver one, I say use the paper.

  **STERLING**
  A whip that breaks the moment the beast doubts the arm holding it. Silver needs no arm. It holds value by the consent of nations, yes, but a consent grounded in its scarcity and its use. It is universal. Your paper is local. It is fragile. One bad harvest, one rumor of the bank's insolvency, and your "tickets" become kindling. Confidence is a fickle beast, Bishop.

  **BERKELEY**
  And silver is stable? Its value fluctuates with every mine opened in Peru, every shipment lost to French privateers. You speak of intrinsic value as if it were a property of the metal itself, like weight or color. But take a man from the moon, show him a guinea and a loaf. He will eat the loaf. He will not eat the gold. The value of silver is itself an opinion—a habit of mankind.

  **STERLING**
  (A sharp smile)
  Ah. There it is. I wondered when we would arrive here.

  **BERKELEY**
  Arrive where?

  **STERLING**
  At the immaterial. You denied matter exists in your youth—you told us tables and chairs were merely ideas in the mind of God. Now you tell us money is merely an idea in the mind of the merchant. First you took away the floor beneath our feet, George, and now you wish to take the coin from our pockets. It seems the man has a lifelong appetite for making reality vanish.

  **BERKELEY**
  (Chuckling dryly)
  You conflate metaphysics with mechanics, Thomas. I denied that matter existed *independently* of perception to save us from skepticism, not to starve the poor. If a table supports a meal, it is real enough for dining. If a bank note supports a labourer's wage, it is real enough for commerce. I do not seek to make things vanish; I seek to make them useful. If silver sits in a vault in London, it is an idol. If paper circulates in Dublin, it is blood.

  **STERLING**
  Blood that clots easily. You say the function of money is to stir industry. Agreed. But who stirs the stirrer? If you empower a bank to issue these tickets, what checks their hand? Greed is a more potent engine than industry. If they issue too many tickets, prices rise. The labourer's wage buys less bread. The very poor you wish to help are crushed by inflation. With silver, the supply is checked by God and the earth. With paper, it is checked only by the virtue of bankers. And have you met many bankers lately?

  **BERKELEY**
  (Pauses, stirring his coffee)
  I admit it. It requires management. It requires a public spirit.

  **STERLING**
  It requires miracles.

  **BERKELEY**
  It requires what any state requires! Do you think the supply of silver is managed by angels? It is hoarded by misers and exported by merchants who care nothing for Ireland. At least with a national bank, the issuance is a public act, subject to public scrutiny. You trust the accident of mines; I would trust the design of policy.

  **STERLING**
  Design implies a designer who cannot be bribed. I trust the metal because it does not listen to parliament. But let us grant your point—that silver is merely a counter. Even a counter must be limited. If I play cards with you, and you print your own deck as we play, the game ends.

  **BERKELEY**
  Only if I print without regard to the stakes. If I issue tickets only against the value of land or labour created, the deck remains honest. The paper represents the wealth that *exists*, not wealth I invent.

  **STERLING**
  Who judges that value? You? The Bank Directors? When the harvest fails, do they reduce the money supply to match the grain? Or do they print more to relieve the distress, devaluing the note further? You say silver is opinion. But it is an opinion shared by a Frenchman, a Turk, and an Englishman. Your paper is an opinion shared only by those who haven't yet heard the bank is in trouble.

  **BERKELEY**
  (Sighs)
  So we are agreed, then. It rests on opinion. On trust.

  **STERLING**
  On trust, yes. But trust in what? In the durability of the earth, or the durability of a promise?

  **BERKELEY**
  In the durability of the people. If the people of Ireland are employed, if they are clothed, if they are fed, they will trust the token that allowed it. If they are starving while holding heavy silver, they will trust nothing. I would rather have a paper currency in a nation of workers than a silver currency in a nation of beggars.

  **STERLING**
  And I would rather have a nation that knows the difference between a promise and a payment.

  *(Sterling stands, dropping the silver shilling on the table. It rings clearly, a bright, hard sound against the wood.)*

  **STERLING**
  Keep your tickets, Bishop. I'll take the risk of the earth over the risk of men.

  **BERKELEY**
  (Looking at the coin)
  And I will take the risk of men over the silence of the earth.

  *(Berkeley picks up the shilling, weighs it in his hand for a moment, then sets it back down. He gathers his pamphlets.)*

  **BERKELEY**
  The rain has stopped. I have a school to visit in the west. They need slates, not silver.

  **STERLING**
  Then pray they don't ask you what the slates are worth.

  **BERKELEY**
  (Smiling faintly)
  I shall ask them what they can build.

  *(Berkeley turns and walks into the grey Dublin afternoon. Sterling watches him go, then picks up the shilling, rubs his thumb over the King's profile, and signals the waiter for another pot.)*

  **[END]**
