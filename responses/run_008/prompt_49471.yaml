  **DRAFT JOINT STATEMENT ON THE METAPHYSICS OF PERSISTENCE**
  **Prepared for:** The Annual Family Collaboration (Adversarial)
  **Drafted by:** [Your Name]
  **Date:** October 24, 2023

  ### 1. Agreed Substantive Claims
  *The following claims are affirmed by both the Endurantist and Perdurantist signatories. Where a claim is also compatible with Exdurance (Stage Theory), this is noted.*

  1.  **Neutrality of Ordinary Discourse:** Ordinary language regarding identity over time (e.g., "This is the same table we bought last year") does not semantically entail either endurantism or perdurantism. Both metaphysical accounts are attempts to provide truthmakers for these ordinary claims, not to replace them. **[ST: OK]**
  2.  **The Reality of Change:** Objects genuinely undergo qualitative change. The claim that "the poker is straight at $t_1$ and bent at $t_2$" is true, and any adequate metaphysics must account for this without contradiction. **[ST: OK]**
  3.  **No Literal Motion Through Time:** Persistence does not involve an object "moving" through time in the way it moves through space. Time is not a medium through which objects flow; rather, persistence is a relation between an object and multiple times. **[ST: OK]**
  4.  **The Coincidence Puzzle:** The case of the Statue and the Clay (where two objects seem to occupy the same space at the same time but have different modal properties) presents a genuine aporia for *all* theories of persistence. It is not a decisive refutation of endurantism specifically, as perdurantism must also explain why coinciding worm-segments count as distinct entities. **[ST: OK]**
  5.  **Temporal Location is Fundamental:** Where an object is *when* it exists is as metaphysically significant as where it is spatially. An account of persistence is incomplete without an account of temporal location. **[ST: OK]**
  6.  **Rejection of "No-Future" Ontology (for the sake of this collaboration):** Both parties agree to bracket Presentism for this specific dialogue. We assume for the sake of argument that past and future times (or their contents) have some ontological standing sufficient to make past/future-tensed statements true. **[ST: OK]**

  ***

  ### 2. Schedule of Residual Disagreements
  *The following table isolates the precise points of divergence. The wording in the left column is endorsed by the Endurantist as an accurate description of her view; the wording in the right column is endorsed by the Perdurantist as an accurate description of his view.*

  | Topic | Endurantist Formulation (3D) | Perdurantist Formulation (4D) |
  | :--- | :--- | :--- |
  | **Temporary Intrinsics** | Objects possess properties *relationally*. The poker is not "straight" simpliciter, but "straight-at-$t_1$." The object itself is the bearer of these time-indexed properties. | Objects possess properties *simpliciter* via their parts. The $t_1$-temporal-part of the poker is straight simpliciter; the $t_2$-temporal-part is bent simpliciter. The whole worm is neither straight nor bent. |
  | **"Wholly Present"** | At every moment of its existence, the *entire* object exists. No part of the object is absent at any time $t$ where the object exists. | The phrase is misleading. Only a temporal *part* of the object exists at $t$. The object is never "wholly" at any single time, just as a road is not wholly at any single mile-marker. |
  | **Coincidence (Counting)** | Two distinct objects (Statue, Clay) can be constituted by the same matter at the same time. They are numerically distinct despite spatial overlap because they have different persistence conditions. | Two distinct spacetime worms overlap. They share temporal parts during the period of coincidence but diverge in the past or future. We count worms by their total spacetime extent, not just current slices. |
  | **Persistence & Location** | Persistence is a *sui generis* category. It is not analogous to spatial extension. An object is *located at* a time, not *extended through* time. | Persistence is a species of location. An object is a spacetime region (or located at one). Persistence is simply having a non-zero temporal extension, analogous to spatial width. |
  | **Identity Over Time** | Strict numerical identity. The object at $t_1$ is strictly identical to the object at $t_2$. | Cross-temporal identity is a derivative notion. Strict identity holds only between temporal parts and themselves. "The object at $t_1$ is the object at $t_2$" means they are parts of the same unified worm. |

  ***

  ### 3. Cruxes and Predictions
  *These are the specific sub-questions where empirical or formal progress could theoretically shift the dialectic. We record our predictions regarding how the opposing view handles these cases.*

  **Crux A: Special Relativity and Simultaneity**
  *   **The Issue:** If simultaneity is frame-relative, then the set of spatial points constituting an object "at a time" varies by frame.
  *   **Perdurantist Claim:** This favors perdurantism. If an object is "wholly present" at a time, and "a time" is frame-relative, then the object's shape and existence become frame-relative in a way that threatens its unity. Perdurantism handles this naturally: the object is a spacetime worm; slicing it differently (different frames) just yields different cross-sections, none of which are the "real" object.
  *   **Endurantist Claim:** This is neutral. Endurantism can adopt a "spacetime location" account where the object is wholly present at each point on its worldline. Relativizing shapes to frames is no more costly than relativizing them to times.
  *   **Progress Condition:** A formal model demonstrating whether an Endurantist can define "wholly present" in Minkowski spacetime without privileging a preferred reference frame.
  *   **Recorded Predictions:**
      *   *Uncle (Perdurantist) predicts:* The Endurantist model will require a hidden "preferred frame" to make sense of "wholly present," violating the spirit of Relativity.
      *   *Friend (Endurantist) predicts:* The Perdurantist model will fail to explain why *this* specific worm (and not a gerrymandered collection of slices) constitutes a unified object, regardless of how it is sliced.

  **Crux B: The Rotating Disk**
  *   **The Issue:** A homogeneous disk rotates. In some frames, its spatial shape at an instant is circular; in others, due to Lorentz contraction, it is elliptical.
  *   **Progress Condition:** Agreement on whether the *object itself* changes shape based on the observer, or whether only the *measurement of the slice* changes.
  *   **Recorded Predictions:**
      *   *Uncle predicts:* The Endurantist must admit the object itself is elliptical in some frames, which contradicts the idea of the object having an intrinsic nature.
      *   *Friend predicts:* The Perdurantist must admit the "worm" has no single shape, rendering the claim "the disk is round" false simpliciter, which violates ordinary usage.

  ***

  ### 4. Assessment of Verbal Dispute
  *An honest evaluation of whether this disagreement is substantive or merely linguistic.*

  **Is this fight just about the word "Present"?**
  Partially, yes. A significant portion of the heat generated at Thanksgiving stems from the phrase **"Wholly Present."**
  *   **Why it is verbal:** The Endurantist uses "whole" to mean "all essential parts required for identity." The Perdurantist uses "whole" to mean "all temporal parts." When the Endurantist says, "The whole table is here," she means "No part of the table's *substance* is missing." When the Perdurantist hears this, he interprets it as "All temporal slices are here," which is obviously false. If we agree to ban the phrase "wholly present" and replace it with precise mereological terms (e.g., "multilocated" vs. "extended"), roughly 40% of the disagreement dissolves.

  **Is any part of this DEFINITELY NOT verbal?**
  Yes. The disagreement over **Truthmakers for Temporary Intrinsics** is substantive.
  *   **Why it is substantive:** This is not about how we use words, but about the structure of reality.
      *   If the Endurantist is right, the fundamental nature of an object includes *relations to times* as basic properties. The universe contains objects that bear "bent-at-$t$" properties.
      *   If the Perdurantist is right, the fundamental nature of reality includes *temporal parts* as basic entities. The universe contains "bent slices" and "straight slices."
      *   **The Stakes:** These are different ontological commitments. You cannot translate one into the other without loss. If the Perdurantist is right, the Endurantist is positing a mysterious relation ("at-$t$") that doesn't exist. If the Endurantist is right, the Perdurantist is multiplying entities (temporal parts) beyond necessity. This is not a dictionary dispute; it is a dispute about what furniture exists in the room.

  **Conclusion for the Signatories:**
  You agree on the data (the poker bends, the table lasts). You disagree on the ontology (what *makes* it true that the poker bends). You partially talk past each other regarding "presence," but you genuinely diverge on the nature of properties. Proceed accordingly.
