          *   *The Defense (Timing Incentive):* Does it answer the charge? It reframes the purpose, but it doesn't fix the *moral* hazard. If the prize goes to the winner, but the work was collaborative/inevitable, does the incentive actually work? It might encourage secrecy (like Newton) rather than collaboration. It answers the "why we do it" but not the "is it fair."
