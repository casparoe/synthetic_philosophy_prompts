      *   **Key Question 1:** Where is the "inviolate level" in *Adaptation*? (Is it the real Kaufman? The studio system? The paper?)
      *   **Key Question 2:** Does the loop still produce vertigo if the "outside" level is dragged inside (meta-fiction vs. reality)?
      *   **Key Question 3:** Is the clichéd ending part of the loop (Donald's writing) or the inviolate level breaking through (studio demands)?
      *   **Key Question 4:** Honest critique. Does the film resist this framing? Is it just irony/"having it both ways" rather than a genuine strange loop?
