  *(Self-Correction Note)*: Wait, one nuance on the "Donald" credit. The WGA allowed Donald to be credited. This blurs the line between legal reality and fiction. I should mention that. It makes the "fictional twin" legally real within the industry system. That's a perfect Tangled Hierarchy example.

