answer: |-
  Here is the definite answer you are looking for.

  The practices you described—brain-death criteria for organ donation, legal identity tied to mental capacity, and cryonics focused on the head—presuppose a specific view of the self: **You are your functioning brain.**

  This is not merely the view that you are your "memories" or "personality" in the abstract, nor is it the view that you are your whole biological organism. It is the view that personal identity is anchored to the continuous physical existence of the specific brain tissue that generates your consciousness.

  Here is why this is the only theory that fits the facts you laid out, followed by the verdict on the tension you perceive.

  ### The Implicit Theory: Brain-Based Identity
  If society operated on the view that you are your **whole body** (the somatic view), brain-dead patients on ventilators would be considered alive. Removing their organs would be killing them. The fact that we legally declare them dead while their hearts still beat proves we have rejected the somatic view.

  If society operated on the view that you are merely your **psychological data** (the abstract view), then scanning your mind and uploading it to a computer, or cloning your memories into a new brain, would be treated as survival. The law and medicine do not recognize this. A copy of you is not you. Cryonics companies freeze the head, not just a hard drive of your memories, because they know the physical structure matters.

  Therefore, these practices strictly require **Brain-Based Identity**. They operate on the rule that the person exists if and only if the specific physical brain exists and functions. The rest of the body is treated as life support equipment for the brain, not the seat of the self.

  ### Does This Theory Strictly Hold?
  These practices would not survive under a rival theory. If we switched to a somatic view, organ donation from brain-dead donors would become illegal homicide. If we switched to a pure psychological view, laws regarding inheritance and identity would have to account for digital copies or memory transplants, which they currently do not. The current legal and medical framework is built entirely on the assumption that the brain is the necessary and sufficient physical substrate of the person.

  ### Is the Tension Real or Illusory?
  The tension you described is **illusory**.

  You feel a contradiction because you are comparing two scenarios that you think point in different directions:
  1.  **Brain Dead, Body Alive:** We say the person is gone.
  2.  **Brain Alive, Body Swapped:** We say the person remains.

  You sense a tension here because one scenario discards the body while keeping the person dead, and the other discards the body while keeping the person alive. But this is not a contradiction; it is perfect consistency. Both scenarios prioritize the brain over the body.

  *   In the first case, the brain is gone, so the person is gone (even if the body remains).
  *   In the second case, the brain is present, so the person is present (even if the body changes).

  The confusion arises because common sense often equates "being alive" with "having a beating heart." The practices you identified have corrected this intuition. They distinguish between **biological life** (the organism ticking along) and **personal life** (the existence of the self). There is no inconsistency in saying the organism can survive without the person (brain death) or that the person can survive without the original organism (hypothetical transplant).

  ### Conclusion
  The practices you observed are not puzzling; they are remarkably consistent. They commit to the view that **you are your brain.** The tension you feel is not in the logic of the practices, but in the lag between those practices and our older, heart-centered intuitions about what it means to be human. The law and medicine have already decided: when the brain stops, you stop. When the brain moves, you move. The rest of the body is just hardware.
