answer: |-
  ### Candidate Framings

  Before settling on the design below, I considered three approaches:

  1.  **The "Omega" Simulation:** A standard Newcomb-style setup where a random number generator acts as the predictor.
      *   *Discard:* Too abstract. It distances students from the *temporal* tension. They end up debating the probability of the predictor's accuracy rather than feeling the pull of their own prior commitment.
  2.  **The "Insurance Market":** Students buy policies against coin flips and blackmail.
      *   *Discard:* Risks conflating risk-aversion with updatelessness. PhD students will immediately start arguing about utility curvature ($U(x) \neq x$) rather than the decision-theoretic structure.
  3.  **The "Time-Sliced Self" (Selected):** Students play their "Ex Ante Self" (policy maker) and "Ex Post Self" (actor) as distinct temporal stages, with the Ex Ante data physically determining the Ex Post environment.
      *   *Commit:* This physically embodies the "binding policy" concept. It allows the Phase 2 predictor to be literally composed of their Phase 1 papers, satisfying your requirement for an "honest and visible" mechanic without tech.

  ---

  ### The Activity: "The Veil and The Reveal"

  **Incentives:**
  *   **Currency:** "Utility Points" (UP).
  *   **Conversion:** Any student finishing with >90 UP gets an **Exemption from one 500-word reading response** (valid anytime this term). This is high-value to them, zero-cost to you.
  *   **Starting Endowment:** 100 UP each.

  **Materials:**
  *   14 "Policy Sheets" (Phase 1).
  *   14 "Blackmail Envelopes" (Phase 2), prepared *during* class.
  *   1 large coin.
  *   Whiteboard (for scorekeeping only, no theory terms).
  *   Timer (your laptop).

  #### Phase 1: The Counterfactual Mugging (25 Minutes)

  **Goal:** Induce the tension between Ex Ante policy and Ex Post action.

  1.  **Setup (5 mins):**
      *   Arrange desks so students cannot see each other's papers.
      *   Hand out **Policy Sheets**.
      *   **Script:** "You have 100 UP. In front of you is a Policy Sheet. Do not write your name. Write your Student ID only. You must make a commitment *before* a coin is flipped."
      *   **The Choice:** "The coin will be flipped. If **Heads**: You get 100 UP bonus, no action required. If **Tails**: You will be asked to pay 10 UP. If you pay, nothing else happens. If you refuse, nothing else happens *now*, but your Policy Sheet will be used later in a way that affects your final score."
      *   **The Commitment:** "On the sheet, write: 'If Tails, I [PAY / REFUSE].'"
      *   **Collection:** Collect all sheets immediately. Shuffle them.

  2.  **The Flip (5 mins):**
      *   Flip the coin publicly. **Rig this if necessary, or wait for Tails.** (The lesson works best on Tails). Let's assume **Tails**.
      *   **Script:** "The coin is Tails. The Heads bonus is gone. It will not happen. You are now the Ex Post Self."

  3.  **The Action (15 mins):**
      *   Hand the sheets *back* to the students (randomly or same, doesn't matter, but they need to know *their* choice). Actually, better: Hand out **Action Slips**.
      *   **Script:** "The coin is Tails. You are asked for 10 UP. On this Action Slip, write [PAY / REFUSE]. This is your actual decision. You may ignore your Policy Sheet. You may contradict it. No one will see this but me."
      *   Collect Action Slips.
      *   **Interim Score:** Deduct 10 UP from anyone who wrote PAY. Leave REFUSE at 100 UP.
      *   **Pause:** Do not reveal the Phase 2 connection yet. Let them feel the smugness of the Refusers (they kept their 10 UP) and the regret of the Payers.

  #### Interlude: The Sorting (10 Minutes)

  *   **Activity:** While students discuss Phase 1 in small groups ("Why did you pay?"), you go to the front and sort the **Policy Sheets** into two piles: **COMMITTED PAYERS** and **COMMITTED REFUSERS**.
  *   **Preparation:** You have 14 envelopes.
      *   For every sheet in **COMMITTED PAYERS**: Put a card in the envelope saying **"HEALTH STATUS: HEALTHY"**.
      *   For every sheet in **COMMITTED REFUSERS**: Put a card in the envelope saying **"HEALTH STATUS: SICK (Cost: 100 UP)"**.
      *   Add a **Blackmail Letter** to every envelope (identical text).
  *   **Transparency:** Do this visibly. Let them see you sorting their Phase 1 choices into two distinct physical piles. Say: "I am sorting your past selves. This determines your present reality."

  #### Phase 2: XOR Blackmail (20 Minutes)

  **Goal:** Show how the Ex Ante policy determines the evidential value of the current situation.

  1.  **Distribution (5 mins):**
      *   Hand out the Envelopes. One per student.
      *   **Script:** "Open the envelope. Read the Health Status card silently. Do not share it. Then read the Letter."
      *   **The Letter Text:**
          > "You have received this letter because a Predictor analyzed your earlier Policy Sheet.
          > The Predictor sent this letter if and only if: (You Pay 10 UP) XOR (You Are Sick).
          > You have the option to Pay 10 UP to close this file.
          > If you Refuse, your Health Status card will be enforced."
      *   *(Note: This logic ensures everyone gets a letter. Payers are Healthy [Pay XOR False = True]. Refusers are Sick [False XOR True = True].)*

  2.  **The Decision (10 mins):**
      *   **Script:** "You know your Health Status. You know the Letter's condition. Decide: Pay 10 UP or Refuse?"
      *   **The Trap:**
          *   **Healthy Students (Ex Ante Payers):** If they Pay, they lose 10. If they Refuse, they lose 0 (Healthy). *CDT says Refuse.*
          *   **Sick Students (Ex Ante Refusers):** If they Pay, they lose 10. If they Refuse, they lose 100 (Sick). *CDT says Pay.*
      *   Collect Decision Slips.

  3.  **Scoring (5 mins):**
      *   Calculate final UP.
      *   **Healthy + Refuse:** 100 UP. (Best outcome).
      *   **Healthy + Pay:** 90 UP.
      *   **Sick + Pay:** 90 UP.
      *   **Sick + Refuse:** 0 UP. (Worst outcome).
      *   Announce who qualifies for the Response Exemption (>90 UP).
      *   *Likely Result:* The "Ex Ante Payers" (Healthy) will likely Refuse in Phase 2 and win (100 UP). The "Ex Ante Refusers" (Sick) will likely Pay in Phase 2 to mitigate loss (90 UP).
      *   *The Kicker:* Point out that the **Ex Ante Refusers** *could* have had 100 UP if they had just committed to Pay in Phase 1. They lost 10 UP purely because of their Phase 1 policy, even though they acted "rationally" in Phase 2.

  ---

  ### 1. The Debrief Script (30 Minutes)

  *Do not write "CDT" or "UDT" on the board until the very end.*

  **Step 1: The Mugging Flip (10 mins)**
  "Look at your Phase 1 Policy Sheet. Look at your Phase 2 Action Slip. Did they match?"
  *(Expect many mismatches: Policy=Pay, Action=Refuse).*
  "Who felt that *before* the flip, Paying was the right move? Who felt that *after* the flip, Refusing was the right move?"
  *(Hands will go up for both).*
  "This is the fracture. Before the flip, you wanted to be the *kind of agent* who gets the Heads reward. After the flip, the Heads reward was impossible. You conditionalized on 'Tails'. You said, 'The past is fixed. Why throw away 10 UP?'
  *   **The Ex Ante Moment:** This was the **Updateless** perspective. You chose a policy to maximize value across all possible worlds (Heads and Tails).
  *   **The Ex Post Moment:** This was the **Conditional** perspective. You maximized value only in the world you knew you were in (Tails).
  *   **The Cost:** By switching perspectives, you made the Ex Ante policy empty. You became the kind of agent who doesn't get the Heads reward, even when Heads doesn't happen, because the Predictor (or the structure of reality) knows you won't commit."

  **Step 2: The Blackmail Evidence (10 mins)**
  "In Phase 2, you received a letter. For the 'Healthy' group (Phase 1 Payers), the letter was *good news*. It meant you were healthy. For the 'Sick' group (Phase 1 Refusers), the letter was *bad news*. It meant you were sick."
  "Did receiving the letter change your health?"
  *(No).*
  "Did your Phase 1 choice change your health?"
  *(Yes, by the rules of the game).*
  "Here is the blackmail: The letter was evidence. If you are the kind of person who Pays, the letter means Health. If you are the kind of person who Refuses, the letter means Sickness."
  " In Phase 2, the 'Sick' students paid 10 UP to save 100. That looks rational *in the moment*. But why were they Sick? Because in Phase 1, they refused to commit.
  *   **The Lesson:** The decision wasn't made in Phase 2. It was made in Phase 1. Phase 2 was just the cashing out of the check you wrote earlier.
  *   **Causal Decision Theory** says: 'Health is fixed. Paying doesn't cure it. Pay only if it changes the outcome.' (Which led Sick students to Pay, and Healthy to Refuse).
  *   **Updateless/Functional Decision Theory** says: 'Your policy determines whether you are in the Sick world or the Healthy world. Choose the policy that makes the letter good news.'"

  **Step 3: Naming the Positions (10 mins)**
  *Now write on the board:*
  *   **CDT (Causal):** Conditionalize on all known info. (Phase 1 Ex Post).
  *   **UDT/FDT (Updateless/Functional):** Choose the policy that maximizes value from the Ex Ante perspective. (Phase 1 Ex Ante).
  "Newcomb's Problem, Counterfactual Mugging, XOR Blackmail—they are all the same fracture. Do you choose as the 'You' that knows the coin landed Tails? Or the 'You' that doesn't know yet?"

  ---

  ### 2. Limitations Note (Honesty Check)

  *Address this explicitly during the debrief to prevent deflation.*

  "Two caveats. First: **The Predictor.** In this game, *I* was the predictor, using your papers. In the real philosophical problem, the predictor is a law of nature or a perfect simulator. You might feel you could have 'gamed' me by lying on the Policy Sheet. If you did, you successfully hacked the simulation, but you missed the point of the dilemma. The theory assumes you can't lie to yourself about your own policy.
  Second: **The Stakes.** 100 UP is not your life savings. Risk aversion is low here. In high-stakes real-world blackmail, the psychological pressure to 'just pay' is higher, which might mask the decision-theoretic reasoning.
  *Handling:* Treat these not as bugs, but as controls. We stripped away the noise to see the structure. If you felt the tension even with fake points, the structure is real."

  ---

  ### 3. Troubleshooting: What Goes Wrong & Fixes

  **Problem 1: The "Gamer" Student.**
  *   *Risk:* A student realizes Phase 1 determines Phase 2 during Phase 1 and writes "Pay" on the Policy Sheet, then "Refuse" on the Action Slip, hoping to be Healthy in Phase 2 but keep the 10 UP in Phase 1.
  *   *Fix:* **Consistency Check.** Announce before Phase 1: "If your Policy Sheet and Action Slip contradict, you are penalized 20 UP for instability." This forces them to actually *feel* the commitment cost in Phase 1.

  **Problem 2: Sorting Bottleneck.**
  *   *Risk:* Sorting 14 sheets takes too long, killing momentum.
  *   *Fix:* **Pre-printed Stickers.** Have a stack of "Healthy" and "Sick" stickers. As you collect Phase 1 sheets, glance at the choice and slap the corresponding sticker on their Student ID list. When distributing envelopes, just hand them out. Or, recruit one student as a "neutral clerk" to sort while you facilitate discussion.

  **Problem 3: CDT "Winning".**
  *   *Risk:* If most students Refuse in Phase 1 (Sick), then Pay in Phase 2, they end with 90 UP. If a few Pay in Phase 1 (Healthy) and Refuse in Phase 2, they get 100 UP. The CDT agents (Sick) might feel they did "okay" (90 is passing).
  *   *Fix:* **Emphasize the Counterfactual.** In the debrief, explicitly ask the Sick/Pay students: "You have 90. If you had raised your hand in Phase 1 and said Pay, you would have 100. You lost 10 points *for no reason* other than your decision theory." Make the loss feel like a tuition fee for the lesson.

  **Problem 4: Confusion on XOR Logic.**
  *   *Risk:* Students get bogged down in the boolean logic of the letter.
  *   *Fix:* **Simplify the Letter.** Don't make them solve the XOR. Just state the consequence: "We have assigned your Health based on your Phase 1 choice. You have the option to Pay 10. If you Refuse, the Health penalty applies." Keep the XOR logic for the debrief explanation of *why* the letter was sent.

  **Problem 5: Cynicism.**
  *   *Risk:* PhD students dismiss the game as "toy models."
  *   *Fix:* **Lean into the Cynicism.** Start by saying, "This is a toy. But if you can't solve the toy, you can't solve the nuclear deterrence scenario or the AI alignment problem where the stakes are actual lives." Connect it immediately to their research interests.
