prompt: |-
  I work on ML evals, so I spend my days thinking about metrics that don't perfectly track the thing we actually care about, proxies that get Goodharted the moment someone optimizes against them, benchmarks that measure different things for different populations of models, etc. Lately I've been trying to read political philosophy on the side and I hit the "equality of what?" debate — egalitarians arguing over whether the thing justice should equalize is welfare, or resources (or Rawls's primary goods), or capabilities, with the disabled-person and expensive-tastes and adaptive-pre preferences examples flying back and forth. I have a strong suspicion this is basically a metrics debate wearing a toga, but I want to test that.

  So: restate the three main positions (welfare egalitarianism, resource/primary-goods views, and the capabilities approach) in the vocabulary I actually use — ground truth vs. observable features, latent variables, proxy metrics, benchmark gaming, measurement invariance across subgroups, what happens when the metric becomes the target. Be as faithful as you can, one position at a time. Like, is welfare egalitarianism the view that we should equalize a latent quantity that's only ever measured through noisy proxies? Are primary goods the move of picking easily-observable input features precisely because the latent is unmeasurable and maybe not even interpersonally comparable? Is the capabilities approach a claim about the effective action space — that what matters is the set of things an agent can actually do in their environment, not their score on any single metric? Feel free to tell me where those glosses of mine are already wrong.

  Then I want the residue report, and honestly I care about that part more. Which parts of the philosophical disagreement map cleanly onto stuff I already think about (I suspect adaptive preferences are just a proxy-manipulation problem, people reporting high satisfaction because the training distribution taught them to)? Which parts you had to distort to fit into my vocabulary? And which parts have no counterpart at all — I'm guessing interpersonal comparisons of utility is one, since in my world there's no ground truth for "how well off is this model, really" that would let me compare across architectures, and maybe the philosophers are stuck with the same problem but have to pretend otherwise?

  Two asks on how you answer. First, don't smuggle in your metric-engineering assumptions and call them translation — if welfare egalitarianism only looks silly because I'm assuming anything worth measuring has to be cardinally measurable, say so. Second, tell me what would change your verdict on the big question, which is whether the residue shows my vocabulary is missing something real or whether the philosophical debate is less substantive than it looks. Like, is there a concrete case where the capabilities people and the resource people disagree about an actual policy, and would resolving a measurement problem (better wellbeing instruments, say) make the disagreement go away? Or does it survive any amount of better measurement? That's the part I can't figure out on my own, and I'd want you to point at where your reasoning there is shakiest.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** ML Evals Researcher. Thinks in terms of metrics, ground truth, latent variables, proxies, Goodhart's Law, measurement invariance, optimization targets.
      *   **Topic:** Political Philosophy's "Equality of What?" debate (Welfare Egalitarianism, Resource/Primary Goods Egalitarianism, Capabilities Approach).
      *   **Task:**
          1.  Translate the three philosophical positions into ML Evals vocabulary (Ground Truth, Proxies, Latents, etc.).
          2.  Provide a "Residue Report": What maps well? What had to be distorted? What has no counterpart?
          3.  Address specific constraints: Don't smuggle in metric-engineering assumptions as translation. Identify what would change the verdict on whether the vocabulary is missing something real or the philosophy is less substantive.
          4.  Identify concrete policy disagreements and whether better measurement resolves them.
          5.  Point out where the reasoning is shakiest.

  2.  **Deconstruct the Philosophical Positions (Mental Draft):**
      *   *Welfare Egalitarianism:* Equalize happiness/preference satisfaction. Problem: Expensive tastes (champagne vs. beer), Adaptive preferences (slave happy with slavery).
      *   *Resource Egalitarianism (Dworkin/Rawls):* Equalize means (money, rights, primary goods). Problem: Disabled person needs more resources to achieve same function.
      *   *Capabilities Approach (Sen/Nussbaum):* Equalize real freedom/opportunity to function. What can you actually *do*? Problem: Hard to measure, choosing the list of capabilities.

  3.  **Translate to ML Evals Vocabulary (Iterative Process):**
      *   *Welfare:* Latent variable (Utility/Happiness). Observed via self-report (noisy proxy). Issue: Proxy hacking (adaptive preferences) and distributional shift (expensive tastes).
      *   *Resources:* Input features/Allocated compute/budget. Easy to measure. Issue: Measurement invariance fails across subgroups (disabled vs. abled need different compute for same loss).
      *   *Capabilities:* Action space/Feasible set. Not just loss, but the Pareto frontier of available behaviors. Issue: Defining the output space is subjective.

  4.  **Drafting the Translation (Section 1):**
      *   *Welfare:* Focus on the latent. It's the "True Loss" we can't see, only infer from "User Satisfaction Scores."
      *   *Resources:* Focus on the input allocation. "Equal Compute Budget."
      *   *Capabilities:* Focus on the "Feasible Output Set." Not just what the model *did*, but what it *could* do.

  5.  **Drafting the Residue Report (Section 2):**
      *   *Clean Maps:* Adaptive preferences = Reward Hacking/Proxy Gaming. Expensive Tastes = Distributional Shift/Cost Functions. Disability = Measurement Invariance failure.
      *   *Distortions:* Philosophy cares about *normative* status (desert, responsibility). ML cares about *functional* performance. ML assumes a single global loss function usually; philosophy debates if there *is* one.
      *   *No Counterpart:* Interpersonal Comparison of Utility (ICU). In ML, we assume architectures are comparable via a benchmark. In philosophy, comparing my pain to your pain is metaphysically dubious. Also, *Agency* and *Responsibility*. ML models don't have moral agency.

  6.  **Addressing the "Big Question" & Constraints (Section 3):**
      *   *Constraint Check:* Am I assuming cardinal measurability? I need to be careful. Welfare egalitarians often assume utility is comparable. ML evals often assume benchmarks are comparable.
      *   *What would change the verdict?* If better measurement (e.g., neural correlates of happiness) solved the ICU problem, would the debate end? Sen says no, because freedom matters *independently* of outcome.
      *   *Concrete Policy Case:* Disability benefits. Resource view: Give cash. Capabilities view: Build ramps. Does better measurement solve this? No, because they value different things (means vs. ends).
      *   *Shakiest Reasoning:* I need to admit where the analogy breaks down most. Probably around *Responsibility* (Dworkin's ambition/sensitivity) vs. *Optimization* (ML doesn't care why the loss is high, just that it is).

  7.  **Refining the Tone:**
