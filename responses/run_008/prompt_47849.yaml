prompt: |-
  I teach a 300-level epistemology seminar on testimony and expertise, fourteen students, one 75-minute session, and I have a specific target: I want them to feel the difference between answers being available and understanding being in place -- and, more pointedly, what it does to you when the availability of the answer trains you out of the generation of it. The topic has stopped being academic for me: over the past year I have quietly outsourced my own lecture derivations, problem-set answer keys, and even my reading questions to an AI assistant, and last month I discovered I could no longer reconstruct, unaided, an argument I had "produced" and taught twice. I don't want to lecture them about this; I want to run it on them.

  Design a two-phase game. In phase one, students work in pairs on a set of moderately hard but learnable tasks -- I'm thinking short formal derivations or map-coloring-style constraint puzzles, where each step is small but the strategy must be internally generated. Each pair has access to a help mechanism I'll call the Oracle: a stack of sealed slips, one per puzzle step, that they may open at will. Here is the crucial design constraint: the slips must be written so that using them feels like learning rather than cheating. Each slip should explain its step genuinely and well, so that students who use them can pass an immediate comprehension check on what the slip said. Whatever the payoff scheme is (points toward a prize, some token currency), it should reward completed puzzles, and it should not directly penalize slip use -- I want the dependence to emerge from the incentive structure, not from a rule I imposed.

  Phase two comes without warning: the same pairs, the Oracles removed, and a set of isomorphic-but-shifted problems that require transferring the strategy, not replaying the steps. Some pairs will be fine; the ones I'm after are the ones who were fastest in phase one entirely on slip power.

  For the debrief, map specific moments in the game onto the conceptual distinctions: access versus ability, competence that survives only while the artifact is plugged in, the way each slip was individually a genuine learning event while the whole pattern of use was not, and the self-assessment problem -- the students who used the slips most will report having learned the most, and I want them to see their phase-two scores alongside those self-reports. Tell me what materials I need, a minute-by-minute timeline, how to write the slips so they hit the individually-helpful/globally corrosive balance, how to handle the pairs who ignore the Oracle entirely and thereby become a control group I didn't plan for, and what will predictably go wrong the first time. Finally, be frank about what the game cannot reproduce: the Oracle is honest, instantaneous, and always available, and none of those three things is true of my relationship with the tool I actually use, so tell me which of those gaps matters most and what I must supply in the debrief myself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 300-level epistemology seminar (Testimony & Expertise), 14 students, 75 minutes.
      *   **Instructor's Goal:** Make students *feel* the difference between answer availability and understanding. Specifically, the phenomenon where outsourcing generation atrophies the ability to generate. The instructor has experienced this personally with AI.
      *   **Method:** A two-phase game (no lecturing about the issue initially).
      *   **Phase 1:** Pairs, moderately hard tasks (derivations/constraint puzzles), "Oracle" slips (sealed hints/solutions). Slips must feel like learning (high quality explanations). Reward completion, *not* penalize slip use directly.
      *   **Phase 2:** Surprise. Same pairs, Oracles removed. Isomorphic-but-shifted problems requiring strategy transfer.
      *   **Debrief:** Map game moments to epistemic concepts (access vs. ability, coupled competence, self-assessment error). Compare Phase 2 scores with self-reported learning.
      *   **Specific Constraints/Questions:** Materials needed, minute-by-minute timeline, slip writing strategy, handling the "control group" (no slips), predicting failure points, and acknowledging the gap between the game's Oracle and real-world AI (honesty, speed, availability).

  2.  **Deconstruct the Core Tension:**
      *   The core tension is *Cognitive Offloading* vs. *Cognitive Integration*.
      *   The "Oracle" needs to be seductive. If it's just an answer key, students know they're cheating. If it's a Socratic tutor, it takes too long. It needs to be a "Gold-Plated Hint" – clear, convincing, makes you nod and say "Ah, I get it," but bypasses the struggle required for encoding.
      *   The Incentive Structure: If points are only for completion, speed + accuracy wins. Using the Oracle saves time/cognitive load, allowing more puzzles. This naturally incentivizes reliance without explicitly forbidding it.

  3.  **Drafting the Game Mechanics:**
      *   *Task:* Needs to be logical but not content-heavy (so Phase 2 isn't about memory of facts). Logic puzzles or formal derivations are good. Let's go with a specific type of logical derivation (e.g., Propositional Logic Natural Deduction) or a specific constraint satisfaction problem (like a mini-Sudoku or "Zebra Puzzle" variant). Logic derivations are better for "steps." Let's choose a specific, rule-based system they might know or can learn quickly. Actually, a *novel* symbolic system is better to ensure no prior knowledge interferes. Let's create a "Symbol Manipulation Game" (like a string rewriting system).
      *   *Phase 1:* 5 Problems. Oracle has 3 slips per problem (Start, Middle, End).
      *   *Phase 2:* 5 Problems. No Oracle.
      *   *Currency:* "Epistemic Credits." Awarded for completed problems. Bonus for speed? No, keep it simple. Just completion.
      *   *Self-Assessment:* Need a quick survey between Phase 1 and 2? No, that ruins the surprise. Survey *after* Phase 2, asking about Phase 1 confidence/learning.

  4.  **Developing the "Oracle" Slips:**
      *   *Constraint:* Must feel like learning.
      *   *Strategy:* The slip shouldn't just say "Do X." It should say "To get from A to B, notice that rule Y applies because of Z. Therefore, apply Y." It provides the *insight* without the *search cost*.
      *   *Risk:* If they are too helpful, everyone uses them. That's actually the point. But we need some to *not* use them to serve as a contrast. The incentive (points for completion) pushes towards efficiency.
      *   *Writing:* "Notice the pattern in the second term? It matches the antecedent of Rule 3. This allows you to detach the consequent. Write that down." -> This feels like a tutor, but it does the pattern recognition for them.

  5.  **Timeline (75 Minutes):**
      *   0-5: Intro & Grouping.
      *   5-35: Phase 1 (30 mins).
      *   35-40: Transition/Survey (Crucial: Ask "How well do you think you understand the strategy?").
      *   40-60: Phase 2 (20 mins).
      *   60-75: Debrief.
      *   *Correction:* 30 mins for Phase 1 might be too long if they get hooked on slips. 25 mins. Phase 2 needs to be short enough to induce failure but long enough to try. 15 mins. Debrief needs 20 mins.
      *   *Revised:* 0-5 Intro, 5-30 Phase 1, 30-35 Survey/Transition, 35-50 Phase 2, 50-75 Debrief.

  6.  **Handling the "Control Group" (No-Slip Users):**
      *   If some pairs ignore the Oracle, they are the "high competence" group.
      *   *Risk:* They might finish Phase 1 too fast and get bored.
      *   *Mitigation:* Make Phase 1 volume high enough that slip-users finish *more* problems than non-slip users. This reinforces the "efficiency" trap. The non-slip users do fewer problems but understand them better.
      *   *Debrief Use:* They are the evidence that the task *was* learnable without the Oracle.

  7.  **Predicting Failure Points:**
      *   *Slip Quality:* If slips are confusing, no one uses them. If too obvious, it feels like cheating. Need the "Aha!" feeling without the "Ouch" of struggle.
      *   *Phase 2 Shock:* Students might feel cheated. Need to frame it carefully in debrief.
      *   *Time Management:* 75 mins is tight. Need strict timers.
      *   *Resentment:* Students might feel manipulated. The instructor's vulnerability (admitting their own AI struggle) is the antidote.

  8.  **The AI Gap (Honesty, Speed, Availability):**
      *   *Game Oracle:* Honest, Instant, Always There.
      *   *Real AI:* Hallucinates, Latency, Context Window limits/Access issues.
      *   *Which matters most?* **Honesty/Reliability.** In the game, the slip is *right*. In real life, AI can be confidently wrong. This creates a *double* bind: you lose the skill *and* the source is unreliable.
      *   *Instructor's Role:* Must confess that the real tool is *worse* than the Oracle, making the atrophy even more dangerous.

  9.  **Refining the Debrief:**
      *   Need to plot Phase 1 Completion vs. Phase 2 Success vs. Self-Reported Understanding.
      *   The "Illusion of Explanatory Depth" is the key concept.
      *   Connect to Epistemology: Testimony (Coady, Lackey) vs. Understanding (Greco, Pritchard).
      *   Instructor Vulnerability: Share the story from the prompt.

  10. **Final Review against Constraints:**
      *   14 students (7 pairs).
      *   300-level (can handle abstract concepts).
      *   No lecture initially.
      *   Incentive structure drives dependence (points for completion).
      *   Address the "Control Group."
      *   Address the AI Gap.

  11. **Drafting the Content:** (Self-Correction during drafting)
      *   *Task Selection:* Logic derivations are best. Let's use a made-up system "The K-System" to ensure no prior knowledge. Rules: 1. A -> B, 2. B -> C, 3. A -> C (transitivity). Actually, keep it simpler. String rewriting. "AB" becomes "C". "C" + "D" becomes "E". Goal: Turn Start String to End String.
      *   *Slip Writing:* Needs to be specific. "Step 1 Slip: Identify the substring 'AB'. Rule 1 allows you to replace it with 'C'. Do this now." It tells them *what* to see and *what* to do.
      *   *Incentive:* $10 gift card for the pair with the most "Verified Solutions." Verified means Phase 2 correct answers. Wait, if I tell them Phase 2 counts, they won't use slips in Phase 1.
      *   *Correction:* Tell them Phase 1 is for points/prize. Phase 2 is a "bonus round" or just "part of the seminar." Do not reveal Phase 2 counts toward the prize until the debrief. This is ethically tricky but necessary for the "surprise." I need to frame it as "Phase 1 is the graded activity, Phase 2 is an application check." Actually, better: "Phase 1 earns tokens. Phase 2 is required to cash out tokens." No, that warns them.
      *   *Best Ethical Path:* "Phase 1 is for practice/points. Phase 2 is an assessment." If they know Phase 2 is an assessment, they might hoard slips.
      *   *Decision:* Tell them Phase 1 determines the prize. Phase 2 is "a continuation of the seminar activity." Do not explicitly link Phase 2 performance to the prize until the end. This preserves the naturalistic reliance on the Oracle.

      *(Self-Correction on Ethics)*: Deceiving students about grading/assessment is risky. I should frame Phase 2 as "A new challenge to test the robustness of the system." The surprise is the *removal of the Oracle*, not the existence of Phase 2. The incentive is purely Phase 1 completion. The "cost" is revealed in the debrief.

      *Wait, the prompt says:* "Whatever the payoff scheme is... it should reward completed puzzles, and it should not directly penalize slip use."
      *Okay:* Prize for most puzzles completed in Phase 1. Phase 2 is just "do this." The lesson comes from the *contrast* in the debrief, not the grade. This is safer.

      *Let's refine the "Control Group":* If a pair doesn't use slips, they will do fewer Phase 1 puzzles. They might feel like "losers." I need to validate them in the debrief as the "winners" of understanding.

      *AI Gap:* The prompt asks which gap matters most. I argue it's the *Illusion of Competence* combined with *Source Reliability*. The game Oracle is reliable. Real AI isn't. So the real world is worse.

      *Let's build the plan.*

      *(Final Polish)*: Ensure the tone is respectful of the instructor's vulnerability. This is a heavy meta-lesson.

      *(Materials)*: Envelopes, Slips, Problem Sheets, Timer, Whiteboard for scoring.

      *(Timeline)*: Tight. 75 mins flies.

      *(Slip Design)*: Crucial. Must be "Cognitive Candy."

      *(Debrief)*: Needs to be the anchor.

      *(AI Gap)*: Be honest.

      *(Control Group)*: Celebrate them.

      *(Failure Points)*: Time, Resentment, Slip Quality.

      *Ready to write.*
answer: |-
  This is a high-wire pedagogical act. It requires manipulating the students' incentives to induce a specific cognitive state (dependence) without their explicit consent, then revealing the manipulation to generate epistemic insight. Because you are asking them to experience a vulnerability you are currently feeling yourself, the ethical weight is significant. The debrief must be an act of shared vulnerability, not a "gotcha."

  Here is the design for the seminar.

  ### 1. Materials Needed

  *   **Problem Packets (7 pairs + 1 spare):**
      *   **Phase 1 Sheet:** 6 "String Transformation" puzzles. (See *Task Design* below).
      *   **Phase 2 Sheet:** 6 Isomorphic puzzles (different symbols, same logical structure). Kept face down until Phase 1 ends.
      *   **The Oracle:** 7 envelopes per pair. Each envelope contains 3 sealed slips per puzzle (18 slips total per envelope).
          *   *Slip 1:* The Opening Move (identifies the first valid operation).
          *   *Slip 2:* The Pivot (identifies the critical intermediate state).
          *   *Slip 3:* The Closure (confirms the final derivation).
      *   **Self-Assessment Card:** A small slip given *between* phases.
      *   **Scoreboard:** Whiteboard space to track Phase 1 completion counts.
  *   **Incentive:** A tangible prize (e.g., $50 book voucher or high-end chocolate) for the pair with the most *verified* Phase 1 completions.
  *   **Timer:** Visible to the class.

  ### 2. Task Design: The "K-System"

  Do not use standard logic or math. Use a novel symbolic system to ensure no prior knowledge interferes.

  *   **Rules:**
      1.  `XX` → `Y`
      2.  `YY` → `Z`
      3.  `YZ` → `W`
      4.  `W` → `XX` (Loop rule, creates complexity)
  *   **Goal:** Transform Start String to Target String in the fewest steps.
  *   **Phase 1:** Standard symbols (X, Y, Z, W).
  *   **Phase 2:** Shifted symbols (A, B, C, D) with isomorphic rules (e.g., `AA` → `B`).

  **Writing the Oracle Slips (The "Cognitive Candy"):**
  The slips must bypass the *search* cost while simulating the *insight*.
  *   *Bad Slip:* "Change XX to Y." (Feels like cheating).
  *   *Bad Slip:* "Look at the rules." (Feels like useless).
  *   *Good Slip:* "Notice the pair `XX` at the start of the string. Rule 1 licenses replacing this pair with `Y`. This reduces the string length and clears the way for Rule 2. Apply Rule 1 now."
      *   *Why this works:* It explains *why* (reduces length), cites authority (Rule 1), and gives the action. It creates an "Aha!" moment without the student having to scan the rules themselves. It feels like being tutored, not copied.

  ### 3. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup & Grouping**
  *   Divide into 7 pairs.
  *   Distribute Phase 1 Sheets and Oracle Envelopes.
  *   **Instructions:** "Your goal is to solve as many puzzles as possible. You have access to the Oracle. Opening a slip is not penalized. The prize goes to the pair with the most correctly solved puzzles at the end of Phase 1. You have 25 minutes."
  *   *Note:* Do not mention Phase 2. Do not mention learning goals.

  **00:05 – 00:30: Phase 1 (The Trap)**
  *   Students work. Pairs will diverge quickly.
      *   *Group A (Dependent):* Open slips immediately. Move fast. High completion count. High confidence.
      *   *Group B (Independent):* Struggle. Open few/no slips. Low completion count. Frustrated.
  *   **Instructor Role:** Circulate. If a pair is stuck, gesture to the Oracle. "The help is there if you need it." Validate the slip-users: "Good use of resources." Validate the strugglers: "Good rigor."
  *   **00:28:** Warn: "Two minutes remaining."

  **00:30 – 00:35: The Transition & Self-Assessment**
  *   Collect Phase 1 Sheets.
  *   Distribute **Self-Assessment Cards**.
  *   **Prompt:** "Rate your grasp of the K-System strategy (1-10). How confident are you that you could teach this to a peer? How much did the Oracle help you *learn* vs. just *finish*?"
  *   Collect Cards.
  *   Distribute Phase 2 Sheets.
  *   **Instructions:** "Continue working. Same rules. You have 15 minutes."
  *   *Crucial:* Do not mention the Oracles are gone until they look for them. When they ask, say calmly: "The Oracles are retired. Work with what you have."

  **00:35 – 00:50: Phase 2 (The Withdrawal)**
  *   Observe the shift. Group A (fast Phase 1) will stall immediately. They will stare at the new symbols, unable to map the rules because they never encoded the *structure*, only the *moves*.
  *   Group B (slow Phase 1) will start slower but gain momentum.
  *   **00:48:** "Stop. Pens down."

  **00:50 – 01:15: The Debrief (The Epistemology)**
  *   **Step 1: The Data (5 mins).** Draw a scatter plot on the board. X-axis: Phase 1 Score. Y-axis: Phase 2 Score. Plot the pairs anonymously (Pair 1, Pair 2...).
      *   *Expected Result:* Negative correlation. High Phase 1 scores (Slip users) = Low Phase 2 scores.
  *   **Step 2: The Self-Report (5 mins).** Reveal the Self-Assessment data.
      *   *Expected Result:* High Phase 1 scorers reported high understanding.
      *   *Point:* "The Illusion of Explanatory Depth." You felt understanding because the *system* understood, not you.
  *   **Step 3: The Conceptual Map (10 mins).**
      *   **Access vs. Ability:** The Oracle gave access to the *answer*, not the *ability* to generate it.
      *   **Coupled Competence:** In Phase 1, the "knower" was Pair + Oracle. In Phase 2, the coupling was broken. Did the knowledge reside in you, or in the system?
      *   **The Cost of Efficiency:** The slips were individually truthful. Every slip taught a true step. But the *pattern* of use prevented encoding.
  *   **Step 4: Instructor Vulnerability (5 mins).**
      *   This is where you share your prompt story. "I designed this because I outsourced my lecture derivations to an AI. Last month I couldn't reconstruct an argument I've taught for years. I am not standing above you judging this; I am standing here warning you because I am the cautionary tale."

  ### 4. Handling the "Control Group" (The Non-Users)

  Some pairs may ignore the Oracle entirely.
  *   **In Phase 1:** They will look inefficient. They will solve fewer puzzles. They might feel anxious about the prize.
  *   **In Phase 2:** They will likely outperform the slip-users.
  *   **In Debrief:** You must explicitly vindicate them. "Pair X solved half as many puzzles in Phase 1. But they are the only ones who actually possess the skill. They didn't win the prize, but they won the seminar."
  *   **Risk:** They might feel punished for doing the "right" thing.
  *   **Mitigation:** If possible, have a secondary prize for "Phase 2 Improvement" or simply ensure the main prize is trivial enough that losing it isn't a grievance.

  ### 5. Predictable Failure Points

  1.  **Slip Quality:** If the slips are too dry, students won't use them. If they are too directive ("Write C"), they feel like cheating.
      *   *Fix:* Pilot the slips on a colleague. They must say, "Ah, I see why that works," not "Oh, that's the answer."
  2.  **Time Creep:** 75 minutes is very tight.
      *   *Fix:* Be ruthless with the timer. If Phase 1 runs long, cut Phase 2 to 10 minutes. The *contrast* matters more than the completion of Phase 2.
  3.  **Student Resentment:** Students may feel manipulated or tricked.
      *   *Fix:* The "Instructor Vulnerability" section is non-negotiable. You must admit you are testing a hypothesis on them that you failed yourself. This shifts the dynamic from "Professor vs. Students" to "We vs. The Epistemic Environment."
  4.  **The "Smart" Cheaters:** A pair might hoard slips for Phase 2.
      *   *Fix:* Collect the Oracles *with* the Phase 1 sheets. Make it physically impossible to keep them.

  ### 6. The AI Gap: What the Game Cannot Reproduce

  The Game Oracle is **Honest**, **Instant**, and **Always Available**.
  Your AI Assistant is **Probabilistic**, **Latent**, and **Context-Limited**.

  **Which gap matters most?**
  **Honesty (Reliability).**
  In the game, the slips are pedagogically sound. They lead to truth. When you outsource to AI, you are outsourcing to a system that can hallucinate with high confidence.
  *   **The Game:** You lose the ability to generate, but the output you relied on was *correct*.
  *   **Reality:** You lose the ability to generate, *and* the output you rely on may be *wrong*, and you lack the competence to verify it.

  **What you must supply in the debrief:**
  You must articulate that the real-world danger is *compounded*.
  *   "In this game, the Oracle was a perfect expert. If you trusted it, you were at least right, even if you didn't learn. In my work, and in yours, the tool is not a perfect expert. It is a stochastic parrot. When I lost the ability to check the AI's work, I wasn't just losing a skill; I was losing my safety mechanism against error. The atrophy of verification is more dangerous than the atrophy of generation."

  ### 7. Epistemic Concepts to Anchor

  *   **Jennifer Lackey on Testimony:** When is it rational to rely on others? (The Oracle was reliable, but reliance prevented uptake).
  *   **Duncan Pritchard on Anti-Luck Virtue Epistemology:** Phase 1 success was partly luck (having the slip), not fully creditable to the agent's ability.
  *   **The Extended Mind (Clark & Chalmers):** Was the Oracle part of their cognitive system? Yes, in Phase 1. Phase 2 proves it wasn't *integrated*, it was *scaffolded*.
  *   **Cognitive Offloading:** The specific mechanism of the "Google Effect" or "Digital Amnesia."

  ### Final Note on Ethics
  This lesson plan involves a degree of deception (withholding the Phase 2 constraints). In a 300-level seminar, this is generally permissible if the pedagogical value is high and the debrief is thorough. However, you must ensure that the "Prize" does not impact their actual course grade. It must be purely symbolic or extracurricular. If this seminar has participation grades, you must guarantee that Phase 2 performance does not negatively impact their grade, only Phase 1 completion (which rewards the "dependent" behavior). Ideally, **no part of this game affects their course grade.** It must be a safe space to fail.
