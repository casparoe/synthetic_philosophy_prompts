  10. **Final Polish:** Check tone (academic, rigorous, responsive to constraints). Ensure all parts of the prompt are answered. (Especially the "say so plainly" instruction regarding the framing).

      *   *Decision on Framing:* I should argue that the framing is *mostly* correct but needs a tweak: ITPs don't create a *new* Benacerraf problem, but they make the existing one more visible by removing the "human intuition" veil. The "causal link" demand is already problematic for human proof; ITPs just make the lack of one obvious. I will validate the user's framing but refine the conclusion on whether it's "distinct."

