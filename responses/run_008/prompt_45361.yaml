answer: |-
  The principle needs repair.

  Your core insight—that sunk costs matter only when they generate forward-looking value—is correct for *instrumental rationality*, but your "private information" clause is too narrow, and the principle currently lacks the vocabulary to explain the asymmetry in your teammate case without dismissing your intuition as mere bias.

  ### The Repaired Principle

  **"Honoring past investment is instrumentally rational if and only if that investment has generated complementary assets (such as private information, integration depth, or team competence) that alter the forward-looking cost-benefit analysis relative to alternatives; however, honoring past investment may be expressively rational when abandonment would violate a specific commitment to collaborators or unjustly negate an agent's constitutive identity in their work."**

  *   **Clause 1 (Instrumental):** Motivated by your **Concurrency Bug (Case 2)** vs. **Build System (Case 1)**. In Case 2, the five days generated a "mental map" (a complementary asset) that lowered the future cost of fixing vs. rewriting. In Case 1, the three years generated no asset superior to the open-source alternative; the investment was purely consumptive.
  *   **Clause 2 (Expressive):** Motivated by your **Teammate Side-Project (Case 4b)**. This clause captures the "betrayal" feeling. It distinguishes between waste aversion (irrational) and the ethical cost of asking someone to disown their labor (rationally honorable in a relational context, even if instrumentally suboptimal).

  ### Verdicts on New Software Engineering Cases

  1.  **The "Bus Factor" Legacy System:** A critical service is maintained by only one engineer who understands its quirks. Management wants to rewrite it to remove the risk. The engineer argues to keep it because "I know how to fix it quickly."
      *   **Verdict:** **Honor the sunk cost (keep the system) temporarily.**
      *   **Reasoning:** Under Clause 1, the engineer's unique knowledge is a *complementary asset* (private information/competence) that lowers immediate operational risk. The rational move is not to rewrite immediately, but to treat the "sunk cost" as an asset to be mined (via documentation/training) until the asset is replicated, then switch.

  2.  **The "Marketing Launch" Feature:** Your team built a feature that users ignore. You spent $50,000 marketing the launch. Product wants to kill the feature; Marketing argues to keep iterating because "we already spent the budget to acquire users for it."
      *   **Verdict:** **Do not honor the sunk cost (kill the feature).**
      *   **Reasoning:** Under Clause 1, marketing spend does not generate a *technical* complementary asset that lowers the cost of future development or increases the feature's inherent value. The spend is consumptive. Unless the acquired users themselves constitute a retained asset (e.g., network effects), the investment is irrelevant to the build decision.

  ### Accommodation Accounting

  Your original principle cannot accommodate the **Teammate Side-Project (Case 4b)** verdict without modification.

  *   **The Conflict:** Your original principle dictates that you should feel neutral about advising your teammate to shelve the project, just as you felt neutral about your own (Case 4a). Yet, you reported it "felt wrong — like I was asking him to betray something."
  *   **Judgment:** The **principle should give way (be expanded)**, not your verdict. Your divergent feelings are not status quo bias; they track a real asymmetry between *instrumental efficiency* and *relational ethics*.
      *   In **Case 4a (Self)**, you are the sole bearer of the instrumental loss and the expressive loss. You weighed them and chose instrumentality.
      *   In **Case 4b (Teammate)**, you are advising someone else to bear the expressive loss. The "betrayal" feeling is an accurate detection of an externalized ethical cost.
  *   **Resolution:** The repaired principle above accommodates this by separating *instrumental rationality* (which demands shelving in both cases) from *expressive rationality* (which flags the teammate case as ethically sensitive). Your manager in **Case 1** was irrational because he cited *time spent* (waste), not *commitment to the team's identity*. Your hesitation in **Case 4b** was rational because you were navigating *commitment to a person*.

  Your original principle was a strong economic heuristic, but software engineering is a socio-technical discipline; a complete theory of rationality in your field must account for the human capital and agency attached to the code, not just the code itself.
