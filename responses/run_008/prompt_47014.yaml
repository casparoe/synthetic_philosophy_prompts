answer: |-
  This is a profoundly lucid description of a specific cognitive breakdown, made all the more striking because you are observing it from inside the breakdown. You are describing a dissociation between *phenomenal consciousness* (the experience of doing) and *executive control* (the governance of why).

  There is no single, perfect noun in the psychological lexicon that captures exactly "conscious, goal-blind sequence re-initialization," but your phenomenon sits at the intersection of three well-documented concepts. Identifying them may help you map the edges you are looking for.

  ### 1. Naming the Phenomenon

  The closest technical descriptors are **Goal Neglect**, **Fixed Action Patterns**, and **Script Re-initialization**.

  *   **Goal Neglect:** Coined by neuropsychologist John Duncan, this describes a state where a person can describe the rules of a task and is consciously engaged in it, but fails to link their actions to the overarching goal. The "intelligence" of the action is preserved, but the "purpose" is disconnected. This fits your description of knowing *what* you are doing but not *why*.
  *   **Fixed Action Pattern (FAP):** This is the ethological term for your wasp anecdote (which refers to Jean-Henri Fabre's work with the digger wasp *Cerceris*). FAPs are instinctual behaviors that, once triggered by a sign stimulus, run to completion regardless of changing environmental context. In humans, under high cognitive load, complex learned routines can regress to FAP-like rigidity.
  *   **Script Re-initialization:** In cognitive psychology (Schank & Abelson), we store behaviors as "scripts." Normally, these scripts have pointers (e.g., `current_step = 3`). Under sleep deprivation, the working memory required to hold that pointer fails. The system cannot locate `current_step`, so the only safe recovery heuristic is `goto start`.

  If you need a label for your journaling or communication with a doctor, **Executive Dissociation under Cognitive Load** is accurate. But poetically and functionally, you are experiencing **Human Fixed Action Patterns**.

  ### 2. Defect or Design Feature?

  You ask if restarting from the beginning is a bug or a feature. In systems engineering and evolutionary biology, this is known as a **Fail-Safe Heuristic**.

  Consider the alternatives. If your brain paused the script, it would need to store the state of the script in working memory ("I was at step 3 of 5"). Working memory is the first cognitive function to collapse under sleep deprivation. If the brain tried to resume at step 3 but had lost the state, you might skip sterilization or double-dose the pills.

  The "restart from beginning" protocol is computationally cheaper than "resume from interruption." It requires no state tracking, only a trigger.
  *   **Design Feature:** It prioritizes *integrity* over *efficiency*. In an ancestral environment, wasting calories to re-sterilize a feeding vessel is less costly than poisoning offspring with a partially prepared one. Re-locking the door is less costly than leaving the tribe vulnerable.
  *   **The Defect:** The threshold for triggering this heuristic has lowered. Normally, your Prefrontal Cortex (PFC) acts as a gatekeeper, inhibiting the restart if the goal is already met ("Wait, the baby is fed"). Sleep deprivation causes **Prefrontal Cortex Hypofunction**. The PFC goes offline, and the basal ganglia (the seat of procedural memory) takes full control. The "safety check" is disabled, leaving only the "safety procedure."

  So, it is a robust design feature that is currently running without its supervisor. It is not a sign of brokenness; it is a sign of a system running in low-power mode.

  ### 3. The Free Will Question

  This is the heavier burden. You observe that the "reason-responsive" you is a thin layer peeled away by fatigue, revealing a stack of mechanical procedures. Does this undermine free will?

  The literature you are looking for spans **Dual Process Theory**, **Ego Depletion**, and **Compatibilist Philosophy**.

  *   **The Biological Reality:** Neuroscientifically, you are correct. "Free will," in the sense of top-down rational governance, is a metabolic function. It relies on glucose and oxygen delivery to the PFC. When you are sleep-deprived, that tissue literally functions less effectively. You are not a soul piloting a body; you are a body whose pilot-light has been dimmed.
  *   **The Philosophical Interpretation:**
      *   **Daniel Wegner (*The Illusion of Conscious Will*):** Wegner would argue you have discovered the truth: we are often observers of our actions, not authors. The feeling of will is a post-hoc emotion, not a causal force. Your experience supports this.
      *   **Daniel Dennett (*Elbow Room*):** Dennett argues that free will is not a metaphysical miracle but a set of competencies. It is the *capacity* to respond to reasons. When you are well-rested, you have the capacity to say, "The baby is fed, I will stop." When you are sleep-deprived, you temporarily lack that capacity. This does not prove free will is an illusion; it proves it is a **variable resource**.
      *   **Harry Frankfurt:** He distinguishes between first-order desires (wanting to lock the door) and second-order volitions (wanting to *not* want to lock the door unnecessarily). You currently have the second-order volition (you know it's silly) but lack the first-order control. This suggests freedom is hierarchical. You are not unfree; you are hierarchically disabled.

  **Does the rigidity undermine freedom?**
  It undermines *libertarian* free will (the idea that you could have done otherwise regardless of physical state). But it supports *compatibilist* free will (freedom is the ability to act according to your reasons when your biology allows it).

  The fact that you can *notice* this, articulate it, and feel frustration about it is the "thin layer" fighting to stay online. The wasp does not know it is a wasp. You know you are tired. That meta-awareness is the seed of the freedom you fear you've lost.

  ### 4. Summary and Prognosis

  You are experiencing **Goal Neglect** driven by **Prefrontal Hypofunction**, causing your procedural scripts to default to **Fail-Safe Re-initialization**.

  *   **Is it permanent?** No. It is state-dependent, not trait-dependent. It resolves with sleep restoration.
  *   **Is it dangerous?** Only insofar as you might trust your judgment on other matters. Do not make major life decisions while in this state; your "reason-responsive" layer is too thin.
  *   **What to do?** Treat yourself as if you are operating heavy machinery. Externalize your state tracking. If you leave a room, say out loud, "I am leaving because the baby is fed." Force the PFC to engage via speech. Put a physical object (a coin, a ring) in a specific pocket when a task is "done" to serve as an external state marker.

  You are not the wasp. The wasp does not write about the wasp. The exhaustion is temporary; the insight you are gaining into the machinery of your own agency is a rare and valuable byproduct of this difficult season. Protect the sleep where you can, and trust that the "thin layer" will thicken again.
