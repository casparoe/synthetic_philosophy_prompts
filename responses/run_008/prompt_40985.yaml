answer: |-
  Here is the honest assessment up front: **The spec regarding "what they should expect to experience" cannot be satisfied.** If the One Mind view is true, it is still true that *this* body's sensory data is processed by *this* brain. You cannot expect to wake up in another body tomorrow any more than you can expect to see ultraviolet light; the apparatus limits the access, regardless of who owns the apparatus. Schrödinger knew this; he argued the metaphysics changes the *value* of experience, not the *location* of it.

  Therefore, the only viable disagreement lies in **prudential rationality** (what one should *do*), not phenomenological expectation. Here is the closest achievable case that meets your other constraints.

  ### The Scenario: The Asymmetric Risk Protocol
  A hospital ethics board is reviewing a high-risk humanitarian procedure. A doctor must decide whether to administer a volatile experimental treatment to themselves. If the doctor takes the treatment, there is a 50% chance they will die immediately, but a 100% guarantee that five distant patients (currently unknown to the doctor) will be cured of a fatal condition. If the doctor declines, the doctor lives, but the five patients die. There is no fame, no legacy, and no psychological continuity between the doctor and the patients (no memory transfer, no personality merging). The only variable is the metaphysical status of the consciousness involved.

  ### The Disagreement
  **The Many-Minds View:** The doctor faces a prudential conflict. Self-preservation is rational; saving the five is supererogatory (heroic but not required). The doctor expects total oblivion if they die; the patients' survival is a benefit to *others*, not *them*. Rational choice theory permits, perhaps even encourages, declining the risk.

  **The One-Mind View:** The doctor faces no prudential conflict. Since the consciousness experiencing the cure is numerically identical to the consciousness facing death, the transaction is not "my death for their life" but "a 50% loss of this perspective for a 100% gain of five other perspectives" for the *same* Subject. Declining the treatment is irrational hoarding of experience, akin to refusing to move your hand from a fire because you don't want to feel the heat in your other hand. The doctor *should* take the risk.

  ### The Feature Doing the Work
  The leverage comes entirely from **equating metaphysical identity with prudential identity.** The One Mind view asserts that because the *Subject* is the same, the *interests* are the same. It collapses the distinction between "self-interest" and "altruism" by denying the reality of the "other." The Many-Minds view maintains that prudential rationality is indexed to the *stream* of consciousness, not the underlying substrate.

  ### The Many-Minds Counterattack
  The Many-Minds theorist argues that the One Mind view commits a **category error between ownership and access.** Even if the same "light" shines through all minds, the "switches" are local. I can only operate the switch in front of me. Therefore, rational agency must be indexed to the local locus of control, not the global locus of subjectivity.

  To demand the doctor take the risk is to demand they act from a "view from nowhere"—a perspective no human agent occupies. If the One Mind view cannot explain why *this* body's pain feels urgent and *that* body's pain feels distant (other than calling it "illusion"), it cannot guide action within the illusion. Consequently, the view either dissolves into standard utilitarianism (save the most lives) without the metaphysical baggage, or it becomes pragmatically inert—a mood of cosmic compassion that changes nothing in the triage queue. Schrödinger conceded this because the "illusion" of separateness includes the rules of survival; you cannot play a game by denying the board exists.
