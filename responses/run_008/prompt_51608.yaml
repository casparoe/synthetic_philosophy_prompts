  10. **Final Review against constraints:**
      *   No textbook explanation? Yes.
      *   Cyclic preferences? Yes.
      *   Sweeteners? Yes.
      *   Reader sees pattern, protagonist doesn't? Yes.

  *(Self-Correction during drafting)*: I need to make sure the "same watch" at the end doesn't feel like a cheat. If he trades away his specific watch, getting a *different* watch of the same model is fine, provided his preference is based on the *type* or attributes, not the specific serial number. I will frame it as him seeking the *ideal* version of these watches. Actually, for the money pump to work strictly, he needs to end up with the *same* asset state. I will have Silas produce a watch indistinguishable in value/attributes to the first one, effectively resetting the state.

