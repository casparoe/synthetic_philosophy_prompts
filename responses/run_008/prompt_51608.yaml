          *   Patek (C) vs Omega (A): Omega has a better dial/patina (Aesthetic superiority).
      *   *Cycle:* A -> B (Tech) -> C (History) -> A (Aesthetic).
      *   *Wait, if he starts with A, he needs to end with A.*
