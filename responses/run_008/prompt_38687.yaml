answer: |-
  Here is my decomposition. I am setting my current credence in Humeanism (specifically, Lewisian Best System Analysis) at **0.40**.

  I am slightly more skeptical than you (0.3), but less than your roommate (0.75). I think the Humean position is the "default" null hypothesis because of its parsimony, but it carries specific technical debts that are currently unpaid.

  Here is how I break that 0.40 down into load-bearing sub-questions. I have treated these as conditional probabilities or weightings that feed into the final number.

  ### 1. The Vocabulary/Language Problem (Weight: 0.50)
  **The Question:** Can the Best System Analysis (BSA) select a "best" system without presupposing a privileged vocabulary of natural properties?
  **My Credence:** **0.50**

  This is the strongest technical objection (championed by Elga and Callender). As your roommate noted, "simplicity" is language-relative. In a gerrymandered language (e.g., using a predicate "G" that applies to exactly the worlds where our actual laws hold), *any* mosaic can be summarized by a trivially simple law ("Everything is G").
  To avoid this, the Humean must posit "Natural Properties" (Lewis's solution) that are prior to the laws. But if these properties are distinct from the laws, what makes them "natural"? Usually, we say they are the properties that play certain nomic roles. If so, the vocabulary is selected *by* the laws, not prior to them. Circular.
  *   **Why this dominates:** If this probability drops below 0.2, Humeanism collapses into triviality. Your roommate's point that you might be "smuggling nomic content in" is correct, but it hurts *him* too. He needs a non-nomic account of natural properties to make BSA work. I give it a 0.50 because Lewis's appeal to "perfectly natural properties" is coherent but ontologically expensive (it looks like a modal primitive in disguise).

  ### 2. The Explanatory Direction Worry (Weight: 0.65)
  **The Question:** Can a summary of facts metaphysically explain those facts, or is the Humean forced to change the subject about what "explanation" means?
  **My Credence:** **0.65**

  Your roommate is right that *pragmatic* explanation works fine (stat mech, compression algorithms). But physicists claim laws *make* the regularities happen. The Humean must say this is a cognitive illusion or a useful fiction.
  *   **Why this is less fatal:** We have successfully reduced other "directional" intuitions before (e.g., time asymmetry in a time-symmetric physics). It is plausible that "explanation" is a feature of our cognitive interface with the world, not the world itself. I penalize Humeanism here (hence 0.65, not 0.9), because it requires a deflationary error theory about scientific practice, which is costly. But it's not a knockout.

  ### 3. Coherence of "No Necessary Connections" (NNC) (Weight: 0.30)
  **The Question:** Is the Humean mosaic even intelligible without modal glue, specifically regarding spatiotemporal relations and identity?
  **My Credence:** **0.30**

  This is where your roommate got quiet, and rightly so. Humeanism says distinct existences are logically independent. But can you have a spacetime point without its relations to other points? Can you have an electron without its charge?
  If spatiotemporal relations are internal (necessary given the relata), Humeanism is false. If properties are essential to their bearers (Dispositionalism), Humeanism is false.
  *   **Why this dominates the downside:** This is the metaphysical heart of the dispute. If NNC is incoherent, Humeanism is dead. I rate this low (0.30) because modern physics (quantum entanglement, structural realism) suggests the world is *more* connected than Humeanism allows. The "mosaic" picture looks increasingly like a classical approximation.

  ### 4. Ontological Parsimony (Weight: 0.85)
  **The Question:** Does Humeanism win on simplicity of ontology?
  **My Credence:** **0.85**

  This is the Humean's ace. Anti-Humeanism posits "necessitation relations," "powers," or "dispositions" on top of the categorical facts. Humeanism just posits the facts. Ockham's razor is the only reason my credence isn't 0.10.
  *   **Why this saves it:** Even if the language problem and NNC are worrying, the Anti-Humean alternative is notoriously obscure. What *is* a necessary connection? If you can't describe it without saying "it makes things happen," you haven't explained much. Humeanism wins by default because the competitor is mysterious.

  ---

  ### Synthesis: How I Get to 0.40
  I treat the **NNC Coherence (0.30)** and **Vocabulary (0.50)** as risk factors, and **Parsimony (0.85)** as the baseline boost.
  *   If NNC is incoherent, Humeanism is 0.
  *   If Vocabulary fails, Humeanism is 0.
  *   But Parsimony keeps it alive as a "working hypothesis."
  *   *Calculation:* $0.85 \text{ (Parsimony)} \times 0.50 \text{ (Vocab)} \times 0.65 \text{ (Explanation)} \times 0.30 \text{ (NNC adjustment)} \dots$
      *   Actually, let's not multiply blindly. Think of it as a baseline of 0.85 (Parsimony) discounted by the risks.
      *   The Vocabulary risk cuts it in half ($\to 0.42$).
      *   The NNC risk cuts it significantly ($\to 0.35$).
      *   The Explanation worry is manageable ($\to 0.40$).
      *   **Final: 0.40.**

  ---

  ### Is Your Roommate Right About IBE?
  **Verdict:** He is **half-right**, but he is masking the real disagreement.

  He claims the gap is about whether **Inference to the Best Explanation (IBE)** is trustworthy in metaphysics.
  *   **Where he's right:** Both of us are using IBE. You infer "Necessary Connections" because they best explain the regularities. He infers "Humean Mosaic" because it is the simplest ontology.
  *   **Where he's wrong:** The disagreement isn't about *whether* to use IBE, but about the **weighting function**.
      *   **Your IBE function** weights *Explanatory Power* heavily. (A theory that explains *why* regularities hold is better).
      *   **His IBE function** weights *Ontological Simplicity* heavily. (A theory with fewer categories of being is better).

  Tell him: "We both trust IBE. We disagree on the cost function. You think ontological categories are expensive; I think explanatory gaps are expensive. If you think IBE is untrustworthy, you shouldn't be a Humean, because Humeanism relies on IBE to select the 'Best' System!"

  ---

  ### What Would Move My Credence? (Update Conditions)

  If you want to bring this back to him, here are the specific conditions that would shift my 0.40.

  **1. To move me toward Humeanism (0.40 $\to$ 0.70):**
  *   **Solve the Vocabulary Problem without Primitives:** Show me how to define "simplicity" or "natural properties" in purely extensional terms without smuggling in modality. If the Humean can ground the vocabulary choice in something non-nomic (e.g., cognitive neuroscience of pattern recognition, à la pragmatist Humeanism), the circularity charge dissolves.
  *   **Vindicate the Mosaic:** Show that spatiotemporal relations *are* contingent. If you can give a coherent model of a world where geometry is not necessary, the NNC objection loses teeth.

  **2. To move me toward Anti-Humeanism (0.40 $\to$ 0.10):**
  *   **Describe the Glue:** Stop saying "laws necessitate." Tell me *what that is*. Is it a relation between universals? A disposition? If the Anti-Humean can give a positive account of "necessitation" that isn't just "explanation reified," the ontological cost becomes worth paying.
  *   **Physics Vindicates Modality:** If fundamental physics (e.g., quantum mechanics) turns out to be fundamentally dispositional or structural in a way that rules out Humean mosaics (e.g., if holism is fundamental and not derivable), Humeanism is empirically falsified.

  ### Where My Decomposition Might Be Wrong
  I suspect I am **underestimating the Pragmatist Turn**.
  My decomposition assumes a realist framework where "laws" must match "mind-independent reality." But a sophisticated Humean (like Hicks or van Fraassen) might say laws are *tools* for agents embedded in the mosaic. If explanation is purely pragmatic, the "Explanatory Direction" worry (0.65) disappears entirely, and my credence should rise to **0.60**.
  *   **Weak Point:** I am treating "explanation" as a metaphysical relation. If I concede it's epistemic, the Humean wins easily. Your roommate might be banking on this. Ask him: "Are laws real features of the world, or just useful maps?" If he says "maps," he's a pragmatist, not a realist, and the debate changes.

  ### Summary for Your Roommate
  Tell him this:
  1.  **Credence:** 0.40.
  2.  **Bottleneck:** The Vocabulary Problem (0.50) and NNC Coherence (0.30). Parsimony isn't enough to overcome them.
  3.  **IBE:** We disagree on the *weights* of IBE virtues (Simplicity vs. Power), not the validity of IBE.
  4.  **Challenge:** Ask him to define "Natural Properties" without using modal terms. If he can't, the Best System has no input. If he can, he's likely smuggled in the necessity you both are fighting over.
