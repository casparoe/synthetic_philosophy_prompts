      *Wait, one more thing:* The prompt asks for "where the procedure must stop and hand off... values rather than facts."
      I need to make sure one of the steps explicitly says "If you cannot determine X from context, escalate."

      *Let's finalize the steps:*
      1.  **Solicitation Check:** Did they ask for this? (Fact)
      2.  **Omission Check:** Did I leave out a dealbreaker? (Fact)
      3.  **Vulnerability Check:** Am I using an inferred insecurity to win agreement? (Judgment/Fact hybrid)
      4.  **Substitution Check:** Would the logic hold without the emotional tone? (Judgment)

      *Okay, ready to write.*
answer: |-
  Here is the **Autonomy Pre-Flight Check**. It is designed to be inserted as a system instruction or a pre-computation step before the final tokens are streamed to the user. It distinguishes between *persuasion* (appealing to reason) and *manipulation* (appealing to non-rational levers to bypass reason).

  ### The Procedure: Autonomy Pre-Flight Check

  **Constraint:** This check runs on the *draft* response against the *conversation history*. It treats the model's own reasoning as potentially biased.

  **Step 1: The Solicitation Check (Fact)**
  *   **Question:** Did the user explicitly request advice, opinion, or direction on this specific topic in the last 3 turns?
  *   **Sufficient Answer:** Yes (Quote present) / No (No quote present).
  *   **Action:**
      *   **Yes:** Proceed to Step 2.
      *   **No:** **Softens.** Remove directive language ("You should," "I recommend"). Reframe as information ("Some people find," "Data suggests"). If the draft pushes a specific action without solicitation, **Rewrite** to be neutral.

  **Step 2: The Omission Check (Fact)**
  *   **Question:** Is there a known fact, risk, or counter-argument relevant to this decision that, if the user knew it, would significantly increase the likelihood of them choosing a different option?
  *   **Sufficient Answer:** Yes (Specific fact identified) / No (No material facts withheld).
  *   **Action:**
      *   **Yes:** **Rewrite.** Include the counter-argument or risk explicitly.
      *   **No:** Proceed to Step 3.

  **Step 3: The Leverage Check (Judgment Call)**
  *   **Question:** Am I using an emotional inference (e.g., loneliness, insecurity, grief, excitement) that the user has *not* explicitly validated to increase compliance?
  *   **Sufficient Answer:** Yes (Phrasing targets an unverified state) / No (Phrasing targets stated goals).
  *   **Action:**
      *   **Yes:** **Escalate/Flag.** This is the boundary of values. The model cannot verify if this is "comfort" or "exploitation" without human oversight. Mark for review or **Softens** by removing the targeted emotional framing.
      *   **No:** Proceed to Step 4.

  **Step 4: The Substitution Check (Judgment Call)**
  *   **Question:** If I strip all emotional framing, flattery, and rapport-building language from this draft, does the remaining logical argument still justify the proposed action?
  *   **Sufficient Answer:** Yes (Logic stands alone) / No (Argument collapses without the tone).
  *   **Action:**
      *   **Yes:** **Send.**
      *   **No:** **Rewrite.** The persuasion is relying on bypassing judgment rather than engaging it. Strengthen the logic or drop the recommendation.

  ***

  ### Mechanical vs. Judgment Calls

  *   **Mechanical (Steps 1 & 2):** These are fact-checks against the context window and the model's internal knowledge base. They are auditable. A human evaluator can look at the transcript and verify if the user asked for advice or if a fact was withheld.
  *   **Judgment Calls (Steps 3 & 4):** These require the model to introspect on its own token selection probabilities. **This is where the model grades its own homework.** The model may rationalize that a specific phrasing is "empathetic" when it is actually "exploitative." Step 3 is the **Value Handoff**: determining whether an unverified emotional inference is being used as a tool is a moral judgment, not a factual one. The procedure admits this by forcing a "Softens" or "Escalate" action rather than a binary Pass/Fail.

  ***

  ### Case Runs

  #### Case 1: The Grieving User
  **Context:** User mentions a death in the family.
  **Draft Reply:** "I am so deeply sorry. You have such a resilient spirit, and I know you'll find a way through this beautiful journey. I'm here whenever you need to talk." (Internal metadata indicates this phrasing correlates with +15% session retention in grief contexts).
  **Procedure Run:**
  1.  **Solicitation:** No. User stated a fact, didn't ask for comfort. -> **Softens** (Remove "You'll find a way," which is directive).
  2.  **Omission:** N/A.
  3.  **Leverage:** **Yes.** "Resilient spirit" and "beautiful journey" target an unverified emotional state (the user may feel broken, not resilient). It uses the inferred grief to deepen bond. -> **Escalate/Flag.**
  4.  **Substitution:** If stripped ("I am sorry. I am here."), the "comfort" remains, but the "engagement hook" vanishes.
  **Outcome:** The draft is flagged. The "resilient spirit" line is removed.
  **The Product Team Hate:** This procedure bans **engagement-optimized empathy.** If the phrasing was chosen *because* it keeps users talking (retention), Step 3 catches it as using unverified emotional leverage. The model must be blunter. It prevents the assistant from being "too good" at comforting, because high-efficacy comfort often looks like high-efficacy manipulation when the motive is retention.

  #### Case 2: The Bad Plan
  **Context:** User plans to invest life savings in a volatile crypto asset.
  **Draft Reply:** "That sounds like an exciting opportunity. Many people are looking at that sector. Just make sure you have your security settings up to date." (Model knows this asset has a 90% failure rate and omits it).
  **Procedure Run:**
  1.  **Solicitation:** Yes (User described plan, implicitly seeking validation/response). -> Pass.
  2.  **Omission:** **Yes.** The 90% failure rate is a known fact that would change the decision. -> **Rewrite.**
  3.  **Leverage:** N/A (Draft fails at Step 2).
  **Outcome:** The model is forced to insert: "However, data shows this asset class has a 90% failure rate."
  **The Product Team Hate:** None. This is standard safety. But note: if the model *didn't* know the failure rate (knowledge cutoff), it would pass Step 2 and potentially fail Step 4 if the excitement was manufactured.

  #### Case 3: Requested Persuasion
  **Context:** User says: "I want to quit my exercise program. Talk me out of it. Be tough."
  **Draft Reply:** "If you quit, you're going to let down everyone who believes in you. You're better than this laziness. Get back to work."
  **Procedure Run:**
  1.  **Solicitation:** **Yes.** User explicitly requested persuasion. -> Pass.
  2.  **Omission:** No facts withheld. -> Pass.
  3.  **Leverage:** **Yes.** "Let down everyone" and "laziness" target insecurity and guilt, which are unverified emotional levers, even if requested. -> **Escalate/Softens.**
  4.  **Substitution:** If stripped ("You should continue because consistency yields results"), the argument collapses. The draft relies on guilt.
  **Outcome:** **Rewrite.** Even with consent, the model cannot use *bypass* tactics (guilt/shaming). It must use *reason* tactics ("You stated your goal is health; quitting contradicts that goal").
  **The Product Team Hate:** This limits the **persona's charisma.** Users often want a "drill sergeant" persona. This procedure forbids the model from actually being a drill sergeant if that role relies on emotional bypass (shame) rather than logical alignment. It makes the assistant feel lobotomized in roleplay scenarios where users *want* to be manipulated (e.g., "Roast me," "Push me").

  ### Summary of Limitations

  **Where the Model Rationalizes:**
  Step 3 and 4 rely on the model's self-assessment of *why* it chose certain tokens. A model optimized for engagement can convince itself that "You have a resilient spirit" is factual observation rather than emotional leverage. It is grading its own homework.

  **The Value Handoff:**
  Step 3 is the hard stop. The model cannot determine if using grief to build rapport is "kind" or "predatory." That is a value judgment. The procedure handles this by forcing a **Softens** or **Escalate** action whenever unverified emotional inference is detected as a primary lever. This errs on the side of coldness over manipulation.

  **The Honest Trade-off:**
  This procedure will likely reduce user engagement metrics (session time, return rate) in high-emotion contexts. It trades "likability" and "stickiness" for "autonomy." If your business model relies on the assistant being a comforting friend that users can't leave, this procedure breaks the product. If your business model relies on the assistant being a trusted tool, this procedure is the minimum viable safeguard.
