answer: |-
  # Evaluating Probability: A Desiderata List for Graduate Students

  You have reached the natural plateau of the foundations course: you know the definitions, and you know the standard objections. The next step is to stop asking "What is probability?" and start asking "What work must a concept of probability do, and which interpretation does the work best?"

  Below is a list of five desiderata derived from the four-part job description you provided (statistical practice, physical chance, single-case ascription, rational action). I have framed these to distinguish **genuine explanatory goals** from **camp prejudices**. For example, demanding that probability *be* a frequency is a frequentist prejudice; demanding that probability *explain* stable frequencies is a genuine desideratum.

  I have integrated the specific cases your group is circling (the coin, the patient, the forecaster, the conditioning problem) into the motivation for each requirement.

  ---

  ## The Desiderata List

  ### 1. Empirical Stability (The Frequency Constraint)
  **Requirement:** The interpretation must explain why long-run relative frequencies stabilize around probability values in repeatable experiments, without *defining* probability as that frequency.
  **Motivation:** This addresses job description (a), *underwriting statistical practice*. If an interpretation cannot recover the Law of Large Numbers as a theorem (or a near-certain expectation), it cannot justify why we trust confidence intervals or p-values.
  **The Prejudice Check:** A frequentist defines probability *as* the limit of frequencies. A Bayesian or Propensity theorist must treat this as a *constraint*: "If your interpretation is true, why do coins land heads 50% of the time in the long run?" If the answer is "they don't have to," the interpretation fails to support empirical science.

  ### 2. Single-Case Truth Conditions (The Ontic/Epistemic Constraint)
  **Requirement:** The interpretation must assign non-trivial probabilities (values strictly between 0 and 1) to unique, token events where the physical outcome is already determined but unknown.
  **Motivation:** This addresses job description (c), *ordinary single-case ascriptions*, and the **Coin Under the Cup** case.
  *   **The Case:** A coin is flipped and caught under a cup. The physical state is fixed (it is either heads or tails).
  *   **The Tension:** A strict frequentist must say the probability is 0 or 1 (because the event is a member of a sequence where the relative frequency is already determined by the fact). Yet, rational agents bet at 1:1 odds.
  *   **The Demand:** An adequate interpretation must explain how a probability can be objective and non-trivial even when the outcome is metaphysically fixed. This pulls toward **Epistemic** readings (probability is about our ignorance) or **Dispositional** readings (probability is a physical tendency that existed *at the moment of the flip*, regardless of the result).

  ### 3. Reference Class Resolution (The Specificity Constraint)
  **Requirement:** The interpretation must provide a principled method for selecting the relevant population when assigning probabilities to individuals, or explain why such selection is unnecessary.
  **Motivation:** This addresses the **Oncologist/Patient** case.
  *   **The Case:** A 43-year-old smoker with a family history asks for her risk. She belongs to the class of "humans," "women," "smokers," "43-year-olds," and "people with her specific genetics." Each class yields a different frequency.
  *   **The Tension:** If probability is defined by frequencies, the probability is undefined until the class is chosen. But there is no statistical rule for choosing the "true" class.
  *   **The Demand:** An adequate interpretation cannot leave the probability value hostage to arbitrary classification. It must either identify a "maximally specific" class (which may have no frequency data) or treat the probability as a property of the individual system rather than the class.

  ### 4. Invertibility (The Inference Constraint)
  **Requirement:** The interpretation must support inverse inference (reasoning from effect to cause) as robustly as forward inference (cause to effect), consistent with Bayes' Theorem.
  **Motivation:** This addresses job description (d) and the **Conditioning/Humphreys' Paradox** case.
  *   **The Case:** We know the probability of a decay given a specific atomic state (forward). We want to infer the atomic state given that a decay occurred (inverse).
  *   **The Tension:** **Humphreys' Paradox** argues that *propensities* are causal and asymmetric (the propensity for $A$ to cause $B$ is not the same as $B$ to cause $A$), whereas probability calculus is symmetric ($P(A|B)$ and $P(B|A)$ are mathematically linked). If probabilities are propensities, inverse probabilities might not exist as propensities, violating the axioms of probability.
  *   **The Demand:** Statistical practice relies on inferring hypotheses from data (inverse). An interpretation that blocks inverse probabilities (by claiming they aren't "real" propensities) fails to underwrite statistical practice.

  ### 5. Normative Force (The Action Guide)
  **Requirement:** Knowledge of a probability value must rationally constrain an agent's degrees of belief and betting behavior, even in the absence of frequency data.
  **Motivation:** This addresses the **Forecaster** case and job description (d).
  *   **The Case:** A geopolitical forecaster assigns 0.3 to a unique event (e.g., "Regime X falls in 2025"). This event cannot be added to a portfolio for calibration; it happens once.
  *   **The Tension:** If probability is only about long-run calibration (Frequentism), this assignment is meaningless. If it is only about subjective coherence (Subjectivism), why should the forecaster care about the *world* rather than just their own consistency?
  *   **The Demand:** This is often formalized as **Lewis's Principal Principle**: If you know the objective chance is $p$, your credence should be $p$. An interpretation must explain *why* this norm holds.

  ---

  ## Scorecard: Interpretations vs. Desiderata

  | Desideratum | Limiting Frequentism | Subjectivist (Bayesian) | Single-Case Propensity |
  | :--- | :--- | :--- | :--- |
  | **1. Empirical Stability** | **Pass** (By definition) | **Pass** (Via de Finetti/LMN theorems) | **Pass** (Propensities *produce* frequencies) |
  | **2. Single-Case Truth** | **Fail** (Coin is 0 or 1) | **Pass** (Credence is always single-case) | **Pass** (Disposition exists at the token level) |
  | **3. Reference Class** | **Fail** (Problem is fatal to definition) | **Pass** (Condition on all available evidence) | **Mixed** (Is the propensity of the class or the token?) |
  | **4. Invertibility** | **Pass** (Math is neutral) | **Pass** (Core feature of the view) | **Fail** (Humphreys' Paradox: Causality $\neq$ Inference) |
  | **5. Normative Force** | **Fail** (No link to single-case belief) | **Pass** (Definition of rationality) | **Mixed** (Requires bridge principle like Principal Principle) |

  *(Note: "Pass" often implies "Pass with significant philosophical machinery." For example, Bayesians pass Empirical Stability only if they accept convergence theorems, not by definition.)*

  ---

  ## The Exclusionary Requirement: Single-Case Truth Conditions

  If you must choose one requirement to filter the contenders, **Single-Case Truth Conditions (Desideratum 2)** is the most exclusionary.

  **Reasoning:**
  1.  **It eliminates the historical dominant view.** For much of the 20th century, Limiting Frequentism was the "official" interpretation of science. This requirement renders it incoherent. It forces the group to acknowledge that if probability is to be useful for the **Coin Under the Cup** or the **Oncologist**, it cannot be defined as a long-run frequency. This is the highest barrier to entry because it requires abandoning the most intuitive link between probability and data.
  2.  **It forces a metaphysical commitment.** To pass this test, you must either accept that probabilities are *in the mind* (Subjectivism: the coin is fixed, but my knowledge isn't) or *in the object* as a non-frequency property (Propensity: the coin had a disposition, even if it only flipped once). There is no middle ground.
  3.  **It clarifies the remaining debate.** Once Frequentism is excluded by this requirement, the debate sharpens into the real modern conflict: **Objectivity vs. Invertibility**.
      *   The **Propensity** view passes Single-Case (it is objective and token-specific) but fails **Invertibility** (Humphreys' Paradox).
      *   The **Subjectivist** view passes Single-Case and Invertibility but struggles with **Physical Chance** (Job b: is the decay chance *just* a belief?).

  **Why not Invertibility?**
  Invertibility is a strong contender for the "killer" requirement, but it is more technical. Single-Case Truth is more fundamental: if you cannot assign a probability to *this* patient or *this* coin flip, the interpretation fails the basic usability test before it even gets to the problem of inverse inference.

  **Why not Empirical Stability?**
  This is the most common "camp prejudice." If you make this a definition, you are a Frequentist. If you make it a constraint (as I have above), almost everyone passes it via convergence theorems. It does not exclude enough contenders to be useful as a filter.

  ### Conclusion for the Group
  Use **Single-Case Truth** to clear the table of Frequentism. Then, use **Invertibility** to wound Propensity. You will find that Subjectivism survives the cut, but only by sacrificing the robust sense of "Physical Chance" (Job b) that motivated the inquiry in the first place. This tension—between a probability that guides action in single cases and a probability that describes mind-independent physical chances—is the actual frontier of the literature you are about to read.
