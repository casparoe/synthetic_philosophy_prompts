prompt: |-
  I do rapid-response comms for a human rights NGO -- press releases and short situation briefs when news of atrocities breaks, so we're working in hours not weeks, no lawyers on call, and getting the word wrong is costly in both directions (calling something genocide when it isn't gets us dismissed as propagandists, declining to call it that gets us accused of cowardice). Please turn the concept of genocide -- Lemkin's original conception together with the Genocide Convention definition -- into a checklist we can actually run on an unfolding situation: the questions in order, what counts as a sufficient answer to each, where it stops at careful hedged language like "may constitute genocide," and where it has to hand the decision to a human because the question is political rather than factual. Three things it has to handle well: inferring intent from a pattern of conduct when nobody has helpfully written the intent down, what "in part" means (if you kill the men of one town, is that a part?), and cultural or religious destruction with little physical killing -- Lemkin thought that counted for a lot and the Convention mostly doesn't, so tell me what we should do with that gap. Then run the procedure on three cases: (a) a military campaign with thousands dead and mass expulsions but no documented statements of intent; (b) systematic transfer of children out of a minority into state institutions; (c) mass killing targeting a political faction -- I know the Convention excludes political groups, but our funders keep asking about exactly these cases, so show me what the procedure says and why the answer won't satisfy them. Finally, be honest about what the checklist cannot settle: I suspect "is it genocide" is partly a political question wearing a legal costume, and I want to know precisely where the procedure ends and that judgement begins.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Rapid-response comms for a human rights NGO.
      *   **Constraints:** Working in hours, no lawyers on call, high stakes (credibility vs. moral duty).
      *   **Task:** Create a practical checklist for determining "genocide" based on Lemkin's conception + UN Genocide Convention (UNGC).
      *   **Key Challenges to Address:**
          *   Inferring intent (*dolus specialis*) from conduct.
          *   Defining "in part" (substantiality).
          *   Addressing the gap between Lemkin (cultural destruction) and UNGC (physical/biological).
      *   **Test Cases:**
          *   (a) Military campaign, mass death/expulsion, no explicit intent.
          *   (b) Systematic child transfer (Article II(e)).
          *   (c) Mass killing of a political group (excluded by UNGC).
      *   **Final Requirement:** Honesty about the limits of the checklist (where law ends and politics begins).

  2.  **Deconstruct the Legal & Conceptual Framework:**
      *   **Lemkin:** Focused on the destruction of the *group* as a national entity, including culture, language, religion, not just mass murder.
      *   **UNGC (1948):** Narrower. Focuses on physical/biological destruction. Protects national, ethnical, racial, religious groups (excludes political, social, gender, etc.). Requires *specific intent* to destroy the group *as such*.
      *   **The Gap:** Lemkin > UNGC. NGOs often want to use Lemkin's breadth but need UNGC's legal weight.
      *   **Intent:** Rarely written down. Must be inferred from pattern of acts, scale, systematic nature, targeting of leaders/culture.
      *   **"In Part":** Jurisprudence (ICTR, ICJ) suggests "substantial part," which can be qualitative (leadership) or quantitative (numbers).
      *   **Political Groups:** Explicitly excluded from UNGC due to Cold War compromises. This is a major friction point for NGOs.

  3.  **Drafting the Checklist (The Core Tool):**
      *   Needs to be sequential.
      *   Needs clear "Stop/Go" criteria.
      *   Needs to distinguish between *factual findings* and *legal characterization*.
      *   *Step 1: Protected Group.* (National, ethnical, racial, religious). If no, stop (legally).
      *   *Step 2: Prohibited Acts.* (Killing, harm, conditions, birth prevention, child transfer).
      *   *Step 3: Intent (The Hard Part).* Pattern of conduct, targeting, statements, scale.
      *   *Step 4: "In Part".* Substantiality (quantitative/qualitative).
      *   *Step 5: The Lemkin/UNGC Gap.* Cultural destruction.

  4.  **Addressing the Specific Challenges:**
      *   *Inferring Intent:* Use the "Manifest Pattern" test (ICTR/ICTY standard). Look for targeting of identity markers, disproportionate force, elimination of leadership.
      *   *Defining "In Part":* It's not just a body count. It's about whether the destruction of *this* part threatens the whole. Killing men of fighting age in one town might be a war crime; killing men across a region to prevent reproduction is genocide.
      *   *Cultural Destruction:* UNGC dropped this (Article III on cultural genocide was removed). NGOs should label this "Cultural Genocide" (descriptive) but acknowledge it doesn't meet the *legal* threshold of UNGC unless tied to physical destruction.

  5.  **Running the Test Cases:**
      *   *(a) Military Campaign:* High death/expulsion. No intent statements.
          *   *Analysis:* Fits Acts (a, b, c). Group likely protected. Intent is the hurdle. Without explicit statements, look at pattern. If expulsion is permanent and conditions are lethal -> stronger case. If it's territorial conquest -> likely Crimes Against Humanity or War Crimes.
          *   *Verdict:* "Risk of genocide" or "War Crimes/Crimes Against Humanity." Avoid definitive "Genocide" without intent evidence.
      *   *(b) Child Transfer:*
          *   *Analysis:* Fits Article II(e) exactly. Protected group? Yes. Intent? Inherent in systematic state policy.
          *   *Verdict:* Strongest legal case for Genocide under UNGC, even without mass killing.
      *   *(c) Political Faction:*
          *   *Analysis:* Fits Acts. Intent clear. *Group* is the problem. Political groups are excluded.
          *   *Verdict:* Legally *not* genocide under UNGC. Morally/Colloquially might feel like it. Funders want the word; law says no. Suggest "Politicide" or "Crimes Against Humanity."

  6.  **Addressing the "Political vs. Legal" Reality:**
      *   The user is right: "Is it genocide?" is often a political call.
      *   The checklist clarifies the *facts*, but the *label* is a strategic decision.
      *   States avoid the word to trigger obligation to prevent (Article I). NGOs use it to trigger pressure.
      *   Need to define the "Handoff Point": Where the facts are ambiguous, the decision becomes strategic/risk-based.

  7.  **Refining the Tone:**
      *   Professional, urgent, pragmatic.
      *   No academic fluff.
      *   Acknowledge the risk (credibility vs. advocacy).
      *   Clear distinction between *Legal Genocide* (UNGC) and *Sociological Genocide* (Lemkin).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I emphasize Lemkin enough?
      *   *Fix:* Ensure the cultural destruction section explicitly contrasts Lemkin's vision with the Convention's reality.
      *   *Critique:* Is the "Political Group" section clear enough for funders?
      *   *Fix:* Explain *why* they were excluded (Soviet/Colonial powers) so the NGO can explain it to funders.
      *   *Critique:* Is the checklist actionable in hours?
      *   *Fix:* Keep questions binary where possible. Use "Red Flags" for intent.

  9.  **Final Polish:** Check against the prompt's specific requirements (order of questions, sufficient answers, hedging, handoff points, three cases, honesty about limits). *Make sure to explicitly mention the "obligation to prevent" trap.*

  **(Self-Correction Note on "Political Groups"):** I need to be careful not to say political groups *never* count. Sometimes a political group overlaps with an ethnic group (e.g., Tutsi were politicized). But if it's *purely* political (e.g., communists in Indonesia 1965), it's not UNGC genocide. I will clarify this nuance.

  **(Self-Correction on "In Part"):** The ICJ Bosnia v. Serbia ruling is key here. "Substantial" is the keyword. I need to make sure the checklist reflects that "substantial" isn't just raw numbers.

  10. **Final Output Generation** (Proceeding to draft response based on these thoughts).
answer: |-
  This is a high-stakes operational tool. Below is a rapid-assessment protocol designed for comms teams working without immediate legal counsel. It distinguishes between the **legal threshold** (1948 Genocide Convention) and the **sociological reality** (Lemkin's original concept), giving you the language to navigate the gap without exposing the NGO to credibility risks.

  ### The Rapid-Response Genocide Assessment Protocol (RR-GAP)

  **Usage:** Run this sequentially. If you fail a step, you generally cannot legally use the word "genocide" without severe reputational risk, unless you explicitly qualify it (see Step 5).

  #### Step 1: The Protected Group (The Gatekeeper)
  **Question:** Is the targeted group defined by *national, ethnical, racial, or religious* identity?
  *   **Sufficient Answer:** Yes. The victims are targeted because of who they *are* (birth/identity), not just what they *do* (political affiliation, combatant status).
  *   **Stop Condition:** If the group is defined primarily by political opinion, social class, gender, or economic status.
      *   *Action:* Use "Crimes Against Humanity" or "Politicide." Do not use "Genocide" under the Convention.
      *   *Note:* If the political group overlaps significantly with an ethnic group (e.g., "The Tutsi" were politicized as "the enemy"), you may proceed, but document the ethnic targeting.

  #### Step 2: The Prohibited Acts (The Conduct)
  **Question:** Is there evidence of one or more of the five specific acts listed in Article II of the Convention?
  1.  Killing members of the group.
  2.  Causing serious bodily or mental harm.
  3.  Deliberately inflicting conditions of life calculated to bring about physical destruction (starvation, blocking medicine).
  4.  Imposing measures intended to prevent births (sterilization, banning marriage).
  5.  Forcibly transferring children of the group to another group.
  *   **Sufficient Answer:** Yes. You have verified reports of at least one of these acts occurring systematically.
  *   **Stop Condition:** If the violence is sporadic, purely military (combatant vs. combatant), or displacement is temporary/voluntary.
      *   *Action:* Use "War Crimes" or "Ethnic Cleansing."

  #### Step 3: The Specific Intent (*Dolus Specialis*)
  **Question:** Can specific intent to *destroy the group as such* be inferred from a manifest pattern of conduct?
  *   *Note:* Explicit orders ("Kill them all") are rare. You must infer intent from the *pattern*.
  *   **Sufficient Answer (Check 2+ of these "Red Flags"):**
      *   **Disproportionality:** Force used vastly exceeds military necessity.
      *   **Targeting Identity:** Destruction of mosques/churches, libraries, or language schools unrelated to military utility.
      *   **Targeting Viability:** Systematic killing of leadership, intellectuals, or women of childbearing age.
      *   **Permanence:** Expulsions are accompanied by destruction of homes/records to prevent return.
      *   **Dehumanization:** Official rhetoric describing the group as "vermin," "cancer," or "existential threat."
  *   **Stop Condition:** If the violence appears driven by territorial conquest, counter-insurgency, or resource extraction without evidence of wanting to *erase the people*.
      *   *Action:* Use "May constitute genocide," "Risk of genocide," or "Crimes Against Humanity."

  #### Step 4: Substantiality ("In Part")
  **Question:** Is the part targeted "substantial" enough that its destruction would impact the survival of the whole group?
  *   **Sufficient Answer:**
      *   *Quantitative:* The number of victims is significant relative to the total population.
      *   *Qualitative:* The victims represent a critical segment (e.g., all leadership, all women in a region) such that the group cannot function or reproduce.
      *   *Geographic:* The targeting is concentrated in a specific area where the group is concentrated (e.g., Srebrenica).
  *   **Stop Condition:** Isolated massacres that do not threaten the continuity of the group.
      *   *Action:* Use "Mass Atrocities" or "War Crimes."

  #### Step 5: The Lemkin Gap (Cultural Destruction)
  **Question:** Is the primary destruction cultural/religious with minimal physical killing?
  *   **The Reality:** Lemkin considered this core to genocide. The Convention *excluded* it (Article III was voted down in 1948).
  *   **Procedure:**
      *   If there is *no* physical killing/birth prevention/child transfer: You cannot legally call it Genocide under the Convention.
      *   **Comms Strategy:** Use the phrase **"Cultural Genocide."**
      *   *Qualification:* "While international law currently restricts 'genocide' to physical destruction, the systematic erasure of [Group]'s heritage and identity fits Raphael Lemkin's original conception of the crime."

  ---

  ### The Handoff Point: Where Law Ends and Politics Begins
  **This is where the checklist stops.** If you have passed Steps 1–4, you have a *prima facie* legal case. However, declaring "This IS Genocide" is a political decision, not just a legal one.

  *   **The Legal Question:** Do the facts meet the threshold? (The Checklist answers this).
  *   **The Political Question:** Are we willing to trigger the "Obligation to Prevent"?
      *   Under Article I of the Convention, states are obligated to *prevent* genocide. When an NGO declares "Genocide," they are demanding states act. If states ignore it, the NGO looks powerless. If the NGO is wrong, they look like propagandists.
  *   **The Decision:** If the evidence is 80% clear, the Comms Director must decide: *Do we prioritize caution ("Risk of Genocide") or mobilization ("Genocide is Occurring")?* This is not a legal call; it is a strategic risk assessment.

  ---

  ### Running the Procedure on Your Three Cases

  #### Case (a): Military campaign, thousands dead, mass expulsions, no documented intent.
  *   **Step 1 (Group):** Assume Protected (e.g., Ethnic Minority). **PASS.**
  *   **Step 2 (Acts):** Killing + Expulsion (if conditions of life are lethal). **PASS.**
  *   **Step 3 (Intent):** **FAIL/AMBIGUOUS.** No statements. Is the pattern manifest?
      *   *Analysis:* If expulsions are one-way and homes are burned, intent is inferable. If it's a frontline push with civilian casualties, it's likely War Crimes.
      *   *Verdict:* **Do not declare Genocide.**
      *   *Comms Language:* "Crimes Against Humanity" or "Ethnic Cleansing." Use "Warning signs of genocide are present."
      *   *Why:* Without explicit intent or a manifest pattern of *destruction* (vs. conquest), the legal risk is too high. States will seize on the ambiguity to dismiss you.

  #### Case (b): Systematic transfer of children out of a minority into state institutions.
  *   **Step 1 (Group):** Assume Protected. **PASS.**
  *   **Step 2 (Acts):** Article II(e) "Forcibly transferring children." **PASS.**
  *   **Step 3 (Intent):** Inherent in the *systematic* nature of state policy. **PASS.**
  *   **Step 4 (Substantiality):** If the rate of transfer threatens the group's continuity. **PASS.**
  *   **Verdict:** **Strongest Legal Case for Genocide.**
  *   *Comms Language:* "This constitutes genocide under Article II(e) of the Genocide Convention."
  *   *Why:* This is the most underused clause. It does not require mass killing. It fits the Convention exactly. It is legally safer than Case (a) because the act itself *is* the genocide, regardless of body count.

  #### Case (c): Mass killing targeting a political faction.
  *   **Step 1 (Group):** **FAIL.** Political groups are explicitly excluded from the 1948 Convention.
  *   **Step 2 (Acts):** Killing. **PASS.**
  *   **Step 3 (Intent):** Clear. **PASS.**
  *   **Verdict:** **Legally NOT Genocide.**
  *   *Comms Language:* "Politicide" or "Crimes Against Humanity (Persecution/Extermination)."
  *   *Addressing Funders:*
      *   *The Explanation:* "The Genocide Convention was weakened in 1948 by Stalin and colonial powers who wanted the freedom to crush political opposition. Legally, killing communists or democrats is not genocide. Morally, it is the same horror. If we call it genocide, legal experts and states will dismiss our entire report as inaccurate. We should call it 'Politicide' to honor the victims without losing our legal credibility."
      *   *The Hedge:* "While this does not meet the narrow legal definition of genocide, it shares the same intent to destroy a human group."

  ---

  ### Honest Limitations: What The Checklist Cannot Settle

  You are correct: "Is it genocide?" is partly a political question wearing a legal costume. Here is precisely where the procedure ends and judgment begins:

  1.  **The "Obligation to Prevent" Trap:**
      *   Once you say "Genocide," you invoke Article I. States are legally bound to intervene. They won't. They will attack *you* for making a legal demand they refuse to meet.
      *   *Judgment Call:* Sometimes "Crimes Against Humanity" is the smarter strategic label. It carries similar moral weight but doesn't trigger the specific "duty to intervene" that states actively ignore.

  2.  **The "In Part" Ambiguity:**
      *   The law says "substantial part." Is 5% substantial? Is 50% of the leadership substantial? The ICJ has been vague.
      *   *Judgment Call:* You must decide if the *narrative* of destruction holds. If you call it genocide over 500 deaths in a group of 10 million, you will be mocked. If you wait for 50,000 deaths, you are complicit in silence. The checklist identifies the *type* of killing; you must judge the *scale*.

  3.  **The Lemkin vs. Convention Gap:**
      *   Lemkin wanted to protect the *group's existence* (culture, language). The Convention protects the *group's bodies*.
      *   *Judgment Call:* If a state is erasing a culture (banning language, destroying shrines) but not killing people, the Checklist says "Not Genocide (Legal)." But Lemkin says "Genocide."
      *   *Recommendation:* Own the gap. "This is Cultural Genocide. The law hasn't caught up to the crime." This allows you to use the moral weight of the word without making a false legal claim.

  4.  **The "Political Group" Friction:**
      *   Funders want the word "Genocide" because it triggers donations. The law forbids it for political groups.
      *   *Judgment Call:* Do you prioritize donor satisfaction or institutional integrity?
      *   *Recommendation:* Hold the line. If you dilute the legal definition for political groups, you weaken the tool for ethnic/religious groups who have no other protection. Explain to funders that "Crimes Against Humanity" is the correct, prosecutable charge that leads to prison, whereas "Genocide" (misapplied) leads to op-eds and inaction.

  ### Summary for your Team
  *   **Green Light:** Article II(e) (Children) or Clear Pattern + Protected Group + Specific Intent.
  *   **Yellow Light:** "Risk of Genocide," "Warning Signs," "Cultural Genocide." (Use when intent is inferred but not proven, or destruction is cultural).
  *   **Red Light:** Political Groups, Purely Military Targets, Isolated Atrocities. (Use "War Crimes" or "Crimes Against Humanity").

  **Final Rule:** It is better to be accused of caution than of fabrication. In rapid response, "Evidence suggests genocide may be occurring" is safer and often more actionable than "This is genocide," because it demands investigation rather than inviting immediate legal rebuttal.
