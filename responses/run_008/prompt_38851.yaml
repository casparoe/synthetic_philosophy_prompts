  ### Brainstorming Failure Modes

  Good's theorem relies on a specific cluster of idealizations: the agent is a single, idealized Bayesian expected-utility maximizer; the observation is costless; the utility function is fixed; and, crucially, the probability distribution over states of the world is independent of the agent's decision to observe. To construct a counterexample, we must violate one of these premises. Here are four distinct avenues:

  1.  **Adversarial Environments (Game Theory):** If the "state of the world" includes the actions of other rational agents who can observe your information-gathering behavior, they may alter their strategy to exploit your new knowledge.
      *   *Violated Premise:* **Passive Nature.** Good's theorem assumes the probability distribution over states is fixed prior to the decision to observe; it does not account for states that are strategically responsive to the observation act itself.
  2.  **Preference Drift (Akrasia/Adaptive Preferences):** Acquiring information might change the agent's utility function (e.g., learning a fact makes a previously desired outcome repulsive, or triggers regret).
      *   *Violated Premise:* **Fixed Utility.** The theorem assumes a stable utility function $U(A, S)$ across both the "observe" and "don't observe" branches of the decision tree.
  3.  **Causal Interference (The Measurement Problem):** The physical process of acquiring information might causally alter the state of the world (e.g., a quantum measurement collapsing a wavefunction, or a credit check triggering a financial crisis).
      *   *Violated Premise:* **Causal Independence.** The theorem assumes the signal is statistically relevant to the state but causally inert regarding the state's realization.
  4.  **Bounded Rationality (Processing Costs):** The agent may lack the computational capacity to update correctly or to identify the optimal act conditional on the new information, leading to decision errors.
      *   *Violated Premise:* **Idealized Rationality.** The theorem assumes the agent always maximizes expected utility conditional on the posterior; it does not account for the risk of processing errors or cognitive overload.

  ### Selected Example: The "Fragile Asset" (Causal Interference)

  I will develop the third case: **Causal Interference**. This example is particularly pedagogically potent because it preserves the agent's internal rationality (they remain a perfect Bayesian updater and EU maximizer) while demonstrating that the *structure of the world* can render information instrumentally harmful. It isolates the assumption that observation is distinct from intervention.

  #### 1. The Setup

  **Agents:** A single Decision Maker (DM).
  **States of the World:** An asset is either **Stable ($S$)** or **Unstable ($U$)**.
  **Acts:** The DM can **Invest ($I$)** or **Hold ($H$)**.
  **Payoffs:**
  *   If $S$ and $I$: Payoff $+10$.
  *   If $U$ and $I$: Payoff $-10$.
  *   If $H$ (regardless of state): Payoff $0$.

  **Prior Probabilities:**
  The DM believes the asset is Stable with probability $0.9$.
  $$P(S) = 0.9, \quad P(U) = 0.1$$

  **The Information Opportunity:**
  The DM has access to a diagnostic scanner that perfectly reveals the state of the asset. The scanner is **intrinsically costless** (no fee, no time delay).

  **The Catch (Causal Mechanism):**
  The scanner operates by emitting a high-energy pulse to test the asset's resonance. If the asset is currently Stable, this pulse destabilizes it. If it is already Unstable, it remains Unstable.
  *   $P(S_{post} | \text{Scan}, S_{pre}) = 0$
  *   $P(U_{post} | \text{Scan}, S_{pre}) = 1$
  *   $P(U_{post} | \text{Scan}, U_{pre}) = 1$

  Effectively, the act of scanning forces the state to $U$ with probability 1. The scanner is a perfect predictor of the *post-scan* state, but the *pre-scan* state is overwritten by the measurement.

  #### 2. The Calculation

  **Scenario A: Blind Decision (No Information)**
  The DM must choose between $I$ and $H$ based on the prior.
  *   $EU(I) = (0.9 \times 10) + (0.1 \times -10) = 9 - 1 = 8$.
  *   $EU(H) = 0$.
  *   **Optimal Act:** Invest ($I$).
  *   **Expected Utility:** **8**.

  **Scenario B: Informed Decision (With Information)**
  The DM chooses to Scan, observes the result, then chooses $I$ or $H$.
  *   **Step 1: The Scan.** The DM initiates the scan. Due to the causal mechanism, the state becomes Unstable ($U$) with probability 1.
  *   **Step 2: The Signal.** The scanner reports the state. Since the state is now $U$, the scanner reports "Unstable" with probability 1.
  *   **Step 3: The Decision.** Conditional on the report "Unstable", the DM updates beliefs: $P(U | \text{Report}) = 1$.
      *   $EU(I | \text{Report}) = -10$.
      *   $EU(H | \text{Report}) = 0$.
      *   **Optimal Act:** Hold ($H$).
  *   **Expected Utility:** **0**.

  **Conclusion:**
  $$V(\text{Information}) = EU(\text{Informed}) - EU(\text{Blind}) = 0 - 8 = -8$$
  Acquiring the costless, perfect information strictly lowers the expected utility.

  #### 3. Identifying the Violated Assumption

  Good's theorem proves that $EU(\text{with info}) \ge EU(\text{without info})$ by relying on the following inequality:
  $$ \sum_{e} P(e) \max_{a} \sum_{s} P(s|e) U(a,s) \ge \max_{a} \sum_{s} P(s) U(a,s) $$
  This derivation assumes that the prior distribution $P(s)$ on the right-hand side is the **marginalization** of the joint distribution $P(s, e)$ on the left-hand side. That is, it assumes $\sum_{e} P(e)P(s|e) = P(s)$.

  In the "Fragile Asset" example, this equality fails.
  *   In the Blind scenario, $P(S) = 0.9$.
  *   In the Informed scenario, the decision to observe changes the physical state such that the effective prior for the decision node is $P(S) = 0$.

  The violated assumption is **Causal Independence of the State**. Good's theorem treats observation as an *epistemic* act (refining the partition of logical possibilities) rather than an *interventional* act (changing the physical probabilities of those possibilities). It assumes "Nature is passive" with respect to the agent's curiosity. When the act of looking changes what is there, the theorem no longer holds.

  #### 4. Honesty About Contrivance and Plausibility

  Is this example contrived? Yes, in the sense that we stipulated a measurement device that destroys the very value it measures. In ordinary macroscopic decision-making, we usually assume measurements are non-invasive (looking at a clock doesn't stop time).

  However, structurally similar situations are pervasive in high-stakes domains:
  *   **Finance:** A "stress test" or deep audit of a bank (information gathering) can trigger a loss of confidence and a bank run (state change), turning a solvent bank into an insolvent one.
  *   **Medicine:** Invasive diagnostic biopsies carry risks of spreading cancer cells or causing infection; sometimes the diagnostic process itself lowers the expected health outcome compared to empirical treatment.
  *   **Social Science (The Lucas Critique):** Publishing a predictive model of the economy (information) allows agents to adjust their behavior, thereby invalidating the model's parameters and changing the economic state.

  The example is not merely a "gotcha"; it highlights the boundary between *discovering* facts and *making* facts.

  ### Reflection: Slogan vs. Diagnostic Tool

  Does the string of caveats required to rescue the slogan "more information is always better" leave it with any content? If we must add "provided the world doesn't react, provided you don't change your mind, provided you can process it," the slogan seems to evaporate.

  However, I argue that Good's theorem is best taught not as a descriptive claim about the world, but as a **diagnostic tool for decision architecture**. When an agent rationally avoids information (e.g., a patient refusing a test, a negotiator refusing to see the other's books), Good's theorem forces us to ask: *Which idealization is failing here?*

  *   If the agent is avoiding processing costs, we are in the realm of **bounded rationality**.
  *   If the agent fears the information will leak to an opponent, we are in the realm of **game theory**.
  *   If the agent fears the measurement will alter the system, we are in the realm of **causal intervention**.

  The theorem's value lies in its ability to pinpoint the specific structural feature of the situation that makes ignorance bliss. It tells us that if information has negative value, the world is not a static backdrop against which we reason; it is a dynamic system in which our reasoning is a physical event. For the decision theorist, the theorem does not prove that information is valuable; it proves that **passivity is valuable**. In any situation where the agent cannot remain passive, the guarantee vanishes.
