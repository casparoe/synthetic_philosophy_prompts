              *   *Women?* Evolutionary psych suggests risk-taking *can* be attractive, but do women calculate "he might die, therefore he's fit"? Or do they just see "confidence"?
              *   *The "Lion" is missing.* In the human case, the risk often doesn't deter a predator; it invites *accidents*. The "predator" is gravity/traffic, which is not an adaptive agent that can be reasoned with via signaling. Gravity doesn't care about your fitness.

      *   *The Cost (Honesty of the Signal):*
          *   Gazelle: The cost is immediate energy + slight delay. If you aren't fit, you get eaten *now*. The link between signal and quality is tight.
