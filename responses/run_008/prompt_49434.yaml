      *   *Cost:* Risk of injury/death.
      *   *Signal:* "I have high genetic fitness/skill."
      *   *Benefit:* Attracting mates, deterring rivals.

  4.  **Audit the Correspondence Table (Finding the Disanalogies):**

      *   *The Lion (The Audience):*
