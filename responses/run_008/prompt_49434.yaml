      *   *The Choice (Agency):*
          *   Gazelle: Triggered by predator presence. Context-specific.
          *   Human: Often done for *intrinsic* reward (dopamine, fun, thrill). The friend claims it's *for* the signal. But often it's *for* the feeling. This undermines the "rational signaling" argument. If I do it for fun, it's not necessarily a calculated fitness strategy.

      *   *The Outcome (Fitness Maximization):*
          *   Gazelle: Increases survival probability *in that encounter*.
          *   Human: Decreases survival probability *overall*. Motorcyclists without helmets die more. Parkour athletes get injured. If the behavior reduces lifespan significantly before reproduction is complete, it's not fitness-maximizing in the biological sense.

  5.  **Address Specific User Questions:**
