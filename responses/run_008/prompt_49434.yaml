      *   *Why?* Signaling theory (Amotz Zahavi). "I am so fit, I can waste energy jumping. You won't catch me. Don't waste *your* energy chasing."
      *   *Key Mechanism:* Honest Signaling / Handicap Principle. The signal is costly. Only high-quality individuals can afford the cost. Low-quality individuals faking it would get caught/eaten.
