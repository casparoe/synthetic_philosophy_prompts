answer: |-
  The letter from Veritas Inquiry arrived on a Tuesday, tucked inside a plain white envelope that felt heavier than paper should. Elias Thorne sat at his kitchen island, the morning light catching the dust motes dancing above his coffee mug. He was a senior risk analyst for a mid-sized insurance firm, a man who made his living calculating the price of unlikely disasters. He knew how to read odds. He also knew how to read people, and the letter smelled of a specific kind of confidence that made his stomach tighten.

  *We have conducted a review of your personal history,* it read. *Our accuracy rate is public record: nineteen successful identifications out of twenty attempts. We have found an incident from 2014. We will release this information to your employer and colleagues unless you transfer $15,000 by Friday. Note: We only initiate contact when we believe the subject will comply. If you are reading this, we have already calculated your compliance.*

  Elias showed it to Sarah that evening. She was an architect, practical in a way that grounded his abstract anxieties. She read the letter twice, her brow furrowing.

  "They're bluffing," she said, sliding it back across the granite. "Or they're fishing. 'We only contact those who will pay' is a classic line. It's designed to make you feel selected, special. Like resisting is futile."

  "They have the record, though," Elias said. "Nineteen out of twenty. Publicly verified. There was a case last year, a developer in Chicago. They predicted he'd pay. He didn't. They released nothing. They admitted the failure in their quarterly transparency report. They didn't spin it. They just said, 'Case 14: Prediction error.'"

  "So they're honest about being wrong sometimes," Sarah said. "That makes them human, not omniscient. Elias, if you pay this, you're feeding a dog that bites. You're validating the mechanism. If there is no dirt, you've lost fifteen grand for nothing. If there is dirt, you've lost fifteen grand and they know you're vulnerable."

  "It's not about the dirt," Elias said, though he wasn't sure he believed himself. "It's about the selection. If I refuse, I prove them right about me being the kind of person who doesn't pay. But if I pay..."

  "If you pay, you lose the money," Sarah finished. "Look, I know how your brain works. You want to be consistent. You want to be the kind of person who optimizes the outcome. But this isn't an optimization problem. It's extortion. You don't pay for counterfactuals you can't see. You don't pay for the ghost of a secret that might not exist."

  They didn't pay. The Friday deadline passed. Nothing happened. No email leaked, no call from HR. The silence was vindicating, but it left a cold spot in Elias's chest. He had won, but he felt he had violated a principle he couldn't quite name. He had refused to buy a bridge to nowhere.

  Six weeks later, the man from Aethelgard Solutions met him in a private room at a coffee shop downtown. He was older than Elias, wearing a suit that cost more than Elias's car. He placed a tablet on the table.

  "Mr. Thorne," the man said. "I represent Aethelgard. You know our reputation. Nineteen out of twenty. Like Veritas, we publish our failures. Case 14 was ours, actually. We licensed the data to Veritas for their blackmail division. We handle the... speculative investments."

  Elias felt the cold spot widen. "What do you want?"

  "We flipped a coin," the man said. He tapped the tablet. A video played: a mechanical arm flipping a gold coin in a vacuum chamber. "Heads or tails. Fair chance. Before the flip, we ran a simulation of you. We asked: If the coin came up heads, would you agree to give us $15,000 if we asked you later? Our model said yes. So, if the coin came up heads, we would have given you $100,000 immediately, contingent on that agreement."

  The man paused, letting the number hang in the air. One hundred thousand. It was the down payment on the lake house Sarah had been sketching on napkins for years.

  "But," the man continued, "the coin came up tails. In this branch, there is no reward. There is only the request. We are asking for the $15,000 now. Consistent with the agreement your counterfactual self made in the heads branch."

  Elias stared at the tablet. The coin was resting on tails. "You're asking me to pay for a world that doesn't exist."

  "We're asking you to honor the logic that would have saved you in the world that *did* exist," the man corrected. "If you say no, you prove our model wrong. You prove you are not the kind of person who takes the win. And you walk away with nothing. If you say yes, you lose fifteen thousand now, but you validate the algorithm. You become the person who gets the hundred thousand in the other version of reality."

  "I'm in *this* reality," Elias said. His voice sounded thin. "In this reality, I hand over fifteen thousand dollars, and I get... a receipt. My wife wanted a kitchen renovation. This wipes out the budget. It delays the house. For what? A feeling of coherence?"

  "For the integrity of your decision engine," the man said. "You refused Veritas. We know. We share data. You didn't pay the blackmailer because the information existed independently of your choice. The dirt was there or it wasn't. Your payment couldn't change the past. But this? This is about the future. Your choice now determines whether the version of you in the heads world was a winner or a fool. You can't visit him, but you can decide what kind of man he was."

  Elias left the coffee shop without answering. He walked three blocks to his office and sat in his car, engine off.

  The logic was seductive. It hummed in his head like a high-tension line. If he was the kind of person who paid, the simulation would have predicted it, and he would be rich. If he was the kind of person who didn't, the simulation would have predicted that, and he would be poor. He was currently poor. By paying, he couldn't change the coin flip, but he could change the *type* of person he was. And if he changed the type of person he was, did that retroactively justify the prediction?

  It felt like vanity. It felt like sending money to a dead relative because you promised you would.

  But then he thought about Veritas. He had refused them. Sarah's argument had been solid: *You don't pay for counterfactuals you can't see.* With Veritas, the dirt was the constant. The payment was the variable. With Aethelgard, the payment was the constant, but the reward was the variable dependent on the prediction of the payment.

  Was there a difference?

  In the blackmail, paying didn't make the dirt go away. It just bought silence. In the mugging, paying didn't make the coin come up heads. It just bought... consistency.

  He went home late. Sarah was grading plans at the dining table. She looked up, sensing the shift in the air.

  "They found you," she said. It wasn't a question.

  "Aethelgard. The coin flip."

  She put her pen down. "And?"

  "They want the fifteen. They say if I pay, I'm honoring the deal that would have made us rich."

  "And if you don't?"

  "Then I'm the kind of person who leaves money on the table. Even if the table is in a different universe."

  Sarah stood up and walked over to him. She took his hands. Her palms were warm, calloused from handling model materials. "Elias. Listen to me. The Veritas letter was a threat based on what you *did*. This is a tax based on what you *would have done*. Do you see the difference?"

  "One is about the past," Elias said. "One is about the... disposition."

  "One is about reality," she said firmly. "In the first case, the truth was fixed. In this case, the reward is fixed as zero. You are being asked to burn money to warm a ghost. I know you want to be consistent. I love that about you. You want your life to add up. But consistency isn't a virtue if it means consistently losing. You refused the blackmail because you wouldn't pay for a lie. Why pay for a miracle?"

  "Because if I don't," Elias whispered, "then I'm not the person who gets the miracle."

  "You're the person who has fifteen thousand dollars," Sarah said. "And a wife who wants to renovate the kitchen. Don't trade the real for the hypothetical."

  She went to bed early. Elias stayed at the table. He opened his laptop and looked at the Aethelgard transparency log. Case 14. The subject had refused. Aethelgard had lost face. The subject had saved the money. But in the nineteen successful cases, the subjects had paid, and Aethelgard had presumably rewarded the counterfactual heads-branch versions.

  Did the heads-branch versions exist? If the universe was single, they were ghosts. If the universe was branching, they were cousins.

  He thought about the feeling of writing the check. It would feel like a loss. A tangible, bleeding loss. The renovation would be delayed. Sarah would be disappointed. She wouldn't say it, but she would look at the unfinished cabinets and remember the day he chose a principle over a home.

  But if he didn't pay, he would look at his bank account and feel safe, and yet... hollow. He would have proven himself to be the kind of person who takes the sure thing over the logical win. He would have proven Aethelgard's model wrong, which meant he was unpredictable, which meant he was chaotic.

  Was chaos better than being a sucker?

  He thought about the Veritas letter again. He had felt strong refusing that. He had felt like a man protecting his territory. If he paid Aethelgard, was he admitting that refusal was wrong? Or was he admitting that the situations were different?

  The asymmetry lived in the generation of the offer. Veritas generated their offer based on the *truth* of his past. Aethelgard generated theirs based on the *prediction* of his future. One was a mirror; the other was a seed. You don't pay the mirror to show a better reflection. But do you water the seed if the plant is already dead?

  He opened his banking app. The balance sat there, a string of digits that represented labor, time, weekends spent at the office while Sarah waited.

  He imagined the version of himself in the heads world. That Elias was walking into a bank, depositing a check for $100,000. He was telling Sarah about the lake house. He was happy. That Elias existed only because this Elias was willing to pay. If this Elias refused, did that Elias vanish? Or was he just a fiction that never was?

  If he paid, he was buying the right to say, "I am the kind of person who wins."

  If he didn't, he was buying the right to say, "I am the kind of person who lives in the real world."

  The clock on the microwave blinked 2:00 AM.

  Elias clicked the transfer button. He entered the account number Aethelgard had provided. He typed in 15,000.

  His finger hovered over the confirm key.

  He thought of Sarah's face when she saw the renovation budget slashed. He thought of the look on the Aethelgard agent's face if he walked away. A shrug? A note in a file? *Case 21: Prediction error.*

  He thought of the blackmail letter in the trash. He had been so sure then. Was he a hypocrite now? Or was he evolving?

  The cursor blinked. It was a small, rhythmic pulse. *Pay. Don't pay. Pay. Don't pay.*

  He thought about the word *coherence*. It sounded like a warm room. He thought about the word *reality*. It sounded like cold wind.

  He pressed confirm.

  The screen updated. The balance dropped. The transaction ID generated.

  He closed the laptop. The kitchen was dark. He walked to the window and looked out at the street. Nothing had changed. The cars were still parked. The streetlights still hummed. He was fifteen thousand dollars poorer. The coin was still tails. The hundred thousand dollars was still a ghost.

  He went to bed. Sarah stirred but didn't wake. He lay there in the dark, waiting for the regret to hit him. It came, sharp and acidic, when he thought about the kitchen tiles. But underneath it was something else, a strange, quiet solidness. He had paid the toll. He had honored the contract with a world he would never see.

  In the morning, he would tell her. He would have to explain why he chose the ghost over the tiles. He would have to argue that he hadn't lost the money, but rather invested it in his own identity. She might not believe him. She might call it vanity. She might be right.

  But as he drifted off, Elias held onto the thought that somewhere, in the branch of the tree he couldn't climb, there was a version of him who was rich, and who was rich specifically because Elias Thorne, here in the dark, had decided that a promise to a counterfactual was still a promise.

  He slept. The sun rose. The coin remained tails. The money did not return. And the question of whether he was a visionary or a fool sat on the kitchen counter, next to the empty coffee mug, waiting for Sarah to find it.
