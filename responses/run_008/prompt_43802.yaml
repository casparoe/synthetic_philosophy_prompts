answer: |-
  This is a classic case of a powerful philosophical slogan undergoing "telephone game" degradation as it moves from the text (*Two Dogmas of Empiricism*, 1951) to conference cocktail hours. Your intuition is correct: the slogan is being doing too much work without carrying the necessary theoretical baggage.

  Quine's actual claim in Section 6 of *Two Dogmas* is bidirectional: *"Any statement can be held true come what may, if we make drastic enough adjustments elsewhere in the system."* The popular inversion—"No statement is immune to revision"—is derived from this, but it relies entirely on **Confirmation Holism** and the **rejection of the Analytic/Synthetic distinction**. Without those, the slogan is either trivial or false.

  Here is a breakdown of the distinct theses hidden inside that slogan, graded from truism to radicalism, tailored for your seminar notes.

  ---

  ### Thesis 1: The Pragmatic Possibility Thesis
  *   **Content:** For any sentence $S$ in our language, there is a possible physical or psychological scenario in which agents stop asserting $S$ and start asserting $\neg S$.
  *   **Status:** **Truism-adjacent.** (People *can* change their minds about anything, even via error, coercion, or insanity.)
  *   **Quinean Dependency:** None.
  *   **Plausibility:** High (but philosophically uninteresting).
  *   **Supports Logic Revision?** **No.** The fact that someone *can* deny the Law of Non-Contradiction (LNC) doesn't mean they are rationally justified in doing so based on data.
  *   **Supports Math-Empiricism?** **No.** People rejecting math doesn't make math empirical.

  ### Thesis 2: The Fallibilist Thesis
  *   **Content:** There is no statement $S$ such that we are *infallibly certain* of its truth. Any belief we hold might turn out to be false.
  *   **Status:** **Moderately Contentious.** (Cartesians and some rationalists deny this regarding logical truths.)
  *   **Quinean Dependency:** Weak. (Compatible with many epistemologies that still accept analyticity.)
  *   **Plausibility:** Plausible to naturalists, but doesn't entail Quinean holism.
  *   **Supports Logic Revision?** **Weakly.** It allows that we *might* be wrong about logic, but doesn't explain *how* evidence could falsify it.
  *   **Supports Math-Empiricism?** **No.** Fallibilism about math $\neq$ math is confirmed by observation.

  ### Thesis 3: The Holistic Revisability Thesis (Quine's Core Claim)
  *   **Content:** Any statement $S$ (including logical/mathematical ones) can be rationally revised (rejected) in light of recalcitrant experience, *provided* we make compensatory adjustments to other statements in the web of belief to maintain overall coherence.
  *   **Status:** **Contentious.** (Requires accepting Confirmation Holism.)
  *   **Quinean Dependency:** **High.** Requires the rejection of the analytic/synthetic distinction. If analytic truths exist, they are immune to this kind of revision.
  *   **Plausibility:** Plausible within a coherentist epistemology, but ignores "cost."
  *   **Supports Logic Revision?** **Yes, in principle.** Quine admits we *could* revise logic to save a physical theory.
  *   **Supports Math-Empiricism?** **Yes, in principle.** Math is part of the web tested by the periphery.
  *   **Crucial Caveat:** This thesis is about *systemic* revision, not sentence-by-sentence testing. It does not claim logic and physics are revised in the *same way*, only that both are *revisable*.

  ### Thesis 4: The Epistemic Continuum Thesis
  *   **Content:** There is no *principled* epistemic difference between logical/mathematical claims and empirical claims, only a difference in **degree of centrality**. Logic is simply more central (harder to give up) than physics, not different in kind.
  *   **Status:** **Highly Contentious.** (Denies a priori knowledge as a distinct category.)
  *   **Quinean Dependency:** **Total.** This is the direct consequence of attacking the "Second Dogma" (reductionism) and the analytic/synthetic distinction.
  *   **Plausibility:** Debated. (Kripkeans and conceptual role semanticists push back.)
  *   **Supports Logic Revision?** **Yes.** If logic is just central empirical belief, data could theoretically push it out.
  *   **Supports Math-Empiricism?** **Yes.** It places math on the same epistemic spectrum as physics.
  *   **Crucial Caveat:** "Same spectrum" $\neq$ "Same location." The cost of revising the center is exponentially higher than the periphery.

  ### Thesis 5: The Radical Naturalist Thesis (The Conference Overreach)
  *   **Content:** Logical and mathematical truths are contingent facts about the world, discoverable and falsifiable by observation *in the same direct sense* as theoretical physics.
  *   **Status:** **Implausible / Caricature.** (Even Quine rejects this.)
  *   **Quinean Dependency:** **Distorted.** Quine never claimed math is tested *sentence-by-sentence* like "There is a brick house."
  *   **Plausibility:** Low.
  *   **Supports Logic Revision?** **Yes, but naively.** Ignores the "change of subject" objection.
  *   **Supports Math-Empiricism?** **Yes, but naively.** Claims math is empirical "in just the same sense" as physics.

  ---

  ### Analysis of the Two Conference Cases

  Here is how you can diagnose the overreaches in your specific examples using the taxonomy above.

  #### Case 1: Revising the Law of Non-Contradiction (LNC)
  *   **The Argument:** "Quine says nothing is immune, so if QM data is weird enough, we drop LNC."
  *   **The Diagnosis:** This relies on **Thesis 3** but ignores Quine's later views on logic.
  *   **The Counter:**
      1.  **Cost Benefit:** In *Two Dogmas*, Quine emphasizes that while we *can* revise the center (logic), the "drastic adjustments elsewhere" make it pragmatically irrational. Revising LNC blows up the web; revising a specific physical law does not.
      2.  **Change of Subject:** In *Philosophy of Logic* (1970), Quine walks back the radicalism of *Two Dogmas*. He argues that deviant logics (like quantum logic) are often just **changing the subject**. If you deny LNC, you aren't using "negation" in the standard sense. You haven't revised logic; you've changed the language.
      3.  **Seminar Note:** The slogan supports revisability *in principle* (Thesis 3), but not the claim that it is a live scientific option comparable to revising a physical law.

  #### Case 2: Mathematics is Empirical "in Just the Same Sense" as Physics
  *   **The Argument:** "Quine says math is revisable, so it's empirical like physics."
  *   **The Diagnosis:** This conflates **Thesis 4** (Continuum) with **Thesis 5** (Radical Naturalism).
  *   **The Counter:**
      1.  **Unit of Empirical Significance:** For Quine, the unit of empirical significance is the **whole of science**, not the individual statement. Physics is tested at the periphery; Math is tested only insofar as it is indispensable to the theory that touches the periphery (Indispensability Argument).
      2.  **Different Roles:** Math functions as a scaffold; physics functions as the descriptive content. They are both part of the web, but they do not play the same role *within* the web.
      3.  **Seminar Note:** Quine makes math *confirmable* by experience (via holism), but not *empirical* in the sense of being directly falsifiable by observation. The phrase "in just the same sense" is the error.

  ---

  ### Dependencies on Quine's "Package"
  If your interlocutors are not buying the whole Quinean package, the slogan loses its force. You can flag these dependencies in your notes:

  1.  **Confirmation Holism:** Without the claim that "the unit of empirical significance is the whole theory," the slogan collapses into Thesis 1 (people can change their minds). Holism is required to make logic *relevant* to experience.
  2.  **Rejection of Analyticity:** If analytic truths exist (truths true in virtue of meaning), they *are* immune to revision by data. The slogan is false if the First Dogma stands.
  3.  **Naturalism:** The drive to revise logic usually comes from a desire to naturalize epistemology. If one accepts normative epistemology, the "cost" of revising logic remains prohibitive regardless of data.

  ### Summary for Seminar Notes
  *   **The Slogan:** "No statement is immune to revision."
  *   **Weak Reading (Truism):** People can change their minds. (Doesn't support the arguments).
  *   **Quinean Reading (Holism):** Any statement can be dropped if we adjust the rest of the web. (Supports *possibility*, ignores *cost*).
  *   **Strong Reading (Caricature):** Logic/Math are tested directly by observation like physics. (False, even for Quine).
  *   **The "Logic" Rebuttal:** Revising logic is usually changing the subject (Quine 1970).
  *   **The "Math" Rebuttal:** Math is confirmed *holistically*, not sentence-by-sentence. "Same sense" is false.
  *   **Key Dependency:** The slogan does no work without **Confirmation Holism** and the **Attack on Analyticity**.
