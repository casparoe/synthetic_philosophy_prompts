  4.  **Stalinesque vs. Orwellian:**

      *   *Stalinesque:* The fabrication happens *before* the experience reaches the "theater" of consciousness. The subject never experiences the discrete flashes; they only experience the show put on for them. (Like a staged trial).
      *   *Orwellian:* The subject experiences the discrete flashes, but memory is updated later to reflect motion. (Like a show trial followed by historical revisionism).
      *   *Dennett's Point:* These are empirically indistinguishable from the *first-person perspective* and often from a third-person neural perspective too, *if* one assumes a specific moment where "consciousness happens."
      *   *Empirical Distinguishability:* If we could find a neural correlate of the "raw flash" that is conscious but then overwritten, Orwellian wins. If we find the motion construction happens before any conscious registration, Stalinesque wins. Dennett argues neither is findable because there is no "finish line" for consciousness.

