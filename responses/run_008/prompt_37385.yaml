      *   *Survival:* The conclusion survives *only if* we accept the Multiple Drafts Model. But the *Orwellian framing* undermines it because it smuggles in the "true record" that Dennett explicitly denies. The TA is using an analogy that presupposes the very thing (a pre-existing conscious state) that the conclusion denies.

