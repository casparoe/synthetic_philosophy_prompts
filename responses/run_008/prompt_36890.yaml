prompt: |-
  I write historical fiction, mostly set in the nineteenth century, and I've hit a problem I can't solve by craft alone. My current novel has a protagonist who, by the standards of the 1840s, is a genuinely good man — he's kind to his tenants, horrified by cruelty, gives to charity — and he also owns people. My first draft let the narration stay inside his moral world, and my editor said it read like an apologia; my second draft kept nudging the reader to condemn him, and my agent said it read like the narrator was winking at us over his shoulder. Both feel like cheats, and I suspect the real issue isn't style but that I have no worked-out account of how anyone — novelist or historian — should evaluate people by moral standards at all, when the standards keep moving.

  So before I do another draft, I want the spec, not a verdict on my guy. Write me the desiderata: what an adequate account of how to morally evaluate historical figures (and characters standing in for them) has to deliver. Which cases must it get right — the slaveholder decent by his era's lights, the abolitionist who was ahead of the country but horribly sexist about everything else, the "product of his time" defense, the presentist who ends up condemning basically everyone before 1950 and so cheapening condemnation itself. Which distinctions can it not collapse — explaining versus excusing, what the agent could reasonably have known versus what we know in hindsight, judging the person versus judging the world that made them. For each requirement give the case or consideration behind it, and say which ones are non-negotiable versus which are just the tastes of one camp (people who want history to vindicate the present versus people who want it left alone).

  The part I most want: tell me if some pair of the desiderata can't be jointly satisfied, and where the list forces a choice. My instinct is that "don't judge people by standards that didn't exist for them" and "don't treat morality as whatever happened to be locally accepted" pull against each other, but I can't tell whether that's a real tension or just me being muddled. And flag which single requirement does the most work — the one that, once you accept it, decides most of the disputes. Then, briefly and only if it helps, say how three familiar positions do against the list: pure presentism (judge everyone by today's standards), relativism (judge them by their own era's), and whatever you'd call the middle view people gesture at when they say "he was good for his time" without explaining what that could mean. I don't need citations or a reading list — I need the list of requirements, with your reasoning, in terms I can actually apply at the level of a sentence while writing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A historical fiction novelist (19th-century setting).
      *   **Problem:** Struggling with how to portray a "good" 1840s man who owns slaves. Previous drafts failed (one was an apologia, one was too preachy/winking).
      *   **Core Issue:** Needs a philosophical/ethical framework for evaluating historical figures/characters, not just stylistic advice.
      *   **Task:** Write a "spec" or "desiderata" list for an adequate account of moral evaluation in historical fiction.
      *   **Specific Requirements:**
          *   Identify cases the account must handle (decent slaveholder, sexist abolitionist, "product of time" defense, presentist over-condemnation).
          *   Identify distinctions that must not collapse (explaining vs. excusing, epistemic limits, judging person vs. world).
          *   Identify non-negotiables vs. camp preferences.
          *   **Crucial:** Identify if any desiderata are in tension/incompatible.
          *   **Crucial:** Identify the single requirement that does the most work.
          *   **Briefly:** Evaluate three positions (Presentism, Relativism, Middle View) against the list.
          *   **Tone:** Practical, philosophical but applicable to sentence-level writing, no citations/reading lists.

  2.  **Deconstruct the Ethical Problem:**
      *   The core tension is between *historical empathy* (understanding the past on its own terms) and *moral realism* (believing some things are just wrong, regardless of time).
      *   The user's instinct is correct: "Don't judge by standards that didn't exist" vs. "Don't treat morality as local custom" *is* a real tension.
      *   The goal is to provide a framework that allows a writer to depict a character as *subjectively* virtuous but *objectively* complicit, without the narration collapsing into either defense or condemnation.

  3.  **Drafting the Desiderata (The Spec):**
      *   I need to create a list of requirements that a robust theory of historical moral evaluation must meet.
      *   *Requirement 1: Epistemic Fairness.* What could they know? (The "Reasonable Knowledge" constraint).
      *   *Requirement 2: Moral Continuity.* Some things are always wrong. (The "Universal Baseline" constraint).
      *   *Requirement 3: Internal Coherence.* The character must make sense to themselves. (The "Psychological Reality" constraint).
      *   *Requirement 4: Structural vs. Individual.* Distinguishing personal kindness from systemic harm. (The "Complicity" constraint).
      *   *Requirement 5: The Cost of Virtue.* Acknowledging that doing the right thing in the past often had high social costs. (The "Resistance" constraint).

  4.  **Identifying Tensions and Incompatibilities:**
      *   The user asked specifically about the tension between "standards that didn't exist" and "morality isn't local."
      *   *Tension:* If we say slavery was *always* wrong (Moral Continuity), we judge them by a standard they might not have accepted. If we say we only judge by *their* standards (Relativism), we lose the ability to condemn slavery.
      *   *Resolution:* The tension is real but productive. It shouldn't be "solved" by picking one; it should be managed by distinguishing *blame* from *wrongness*. An act can be wrong even if the agent isn't fully blameworthy due to epistemic limits.
      *   *Incompatibility:* You cannot simultaneously demand "Total Empathic Immersion" (no narrator judgment) and "Moral Clarity for the Reader" (explicit condemnation). One must yield. Usually, the narration must hold the tension, not resolve it.

  5.  **Identifying the "Key" Requirement:**
      *   Which one does the most work?
      *   It's likely the distinction between *Wrongness of Act* and *Blameworthiness of Agent*.
      *   If you accept this, you can show the act is horrific (slavery) without necessarily painting the man as a monster (he was kind, etc.), but also without excusing the act. This allows the "good man owning slaves" paradox to exist without breaking the narrative voice.

  6.  **Evaluating the Three Positions:**
      *   *Pure Presentism:* Fails Epistemic Fairness. Makes everyone look like villains. Flattens history.
      *   *Relativism:* Fails Moral Continuity. Makes slavery "okay" in the 1840s. Becomes apologia.
      *   *The Middle View ("Good for his time"):* Often vague. Needs to be defined as "High virtue within local constraints, but still complicit in systemic wrongs."

  7.  **Refining for the Novelist (Sentence Level):**
      *   How does this translate to writing?
      *   Instead of the narrator saying "He was wrong," show the *consequences* of his actions on the enslaved people.
      *   Instead of the narrator saying "He couldn't help it," show the *social pressure* he ignored or accepted.
      *   The "winking" problem comes from the narrator knowing too much. The "apologia" problem comes from the narrator knowing too little.
      *   *Solution:* Limited omniscience that respects the character's blind spots but doesn't validate them.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the difficulty. It's a philosophical problem, not just craft.
      *   *The Desiderata:* List them clearly. Label Non-Negotiable vs. Debatable.
      *   *The Tension:* Address the "standards vs. local custom" conflict directly. It's the distinction between *Truth* and *Culpability*.
      *   *The Key Requirement:* The Act/Agent distinction.
      *   *The Three Positions:* Briefly score them against the spec.
      *   *Application:* How to write this.

      *(Self-Correction during drafting)*: I need to make sure I don't just give philosophy. The user asked for a "spec" they can use. I need to ensure the language is actionable.
      *   *Correction:* Make sure the "Tension" section explicitly answers their instinct about the two pulling principles.
      *   *Correction:* Ensure the "Non-Negotiable" labels are clear.

      *(Refining the "Key Requirement")*: Is it Act/Agent? Or is it *Epistemic Access*? Actually, it's the *Refusal to Equate Understanding with Exoneration*. That's the pivot point. If the writer understands *why* he did it, they don't have to say it was *okay*.

      *(Refining the Tension)*: The user asked if "don't judge by standards that didn't exist" and "don't treat morality as local" are incompatible. Yes, they are, if you treat "judging" as one thing. You have to split "judging the truth of the moral claim" from "judging the culpability of the agent."

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Desiderata list? Yes.
      *   Cases covered? Yes.
      *   Distinctions not collapsed? Yes.
      *   Non-negotiables flagged? Yes.
      *   Tensions identified? Yes.
      *   Key requirement identified? Yes.
      *   Three positions evaluated? Yes.
      *   No citations? Yes.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is the spec for an adequate account of moral evaluation in historical fiction. This is designed to function as a diagnostic tool for your narration and character construction.

  ### The Desiderata (The Spec)

  An adequate framework must satisfy the following six requirements. I have marked which are non-negotiable for a serious ethical engagement and which are matters of narrative taste.

  **1. The Epistemic Constraint (Non-Negotiable)**
  *   **Requirement:** The evaluation must distinguish between what was *true* and what was *knowable*.
  *   **The Case:** The decent slaveholder. He could not know neurobiology or modern human rights theory. He *could* know the testimony of the enslaved, the economic dependency of his class, and the arguments of contemporary abolitionists.
  *   **Application:** You cannot condemn him for lacking 2024's vocabulary. You *can* condemn him for ignoring the evidence available in 1840 (e.g., the fear in a servant's eyes, the pamphlets he chose not to read).
  *   **Failure Mode:** If you ignore this, you get Presentism (condemning ignorance that wasn't culpable).

  **2. The Moral Continuity Constraint (Non-Negotiable)**
  *   **Requirement:** The account must assert that certain harms (chattel slavery, torture, systemic dehumanization) were objectively wrong *then*, even if legally and socially sanctioned.
  *   **The Case:** The "Product of His Time" defense. If morality is purely local, slavery was "right" in 1840 Mississippi and "wrong" in 2024 New York. This collapses into moral nihilism.
  *   **Application:** The narration must treat the suffering of the enslaved as real suffering, not just "socially inappropriate behavior."
  *   **Failure Mode:** If you ignore this, you get Relativism (apologia).

  **3. The Distinction of Locus (Non-Negotiable)**
  *   **Requirement:** The account must separate judging the *agent* from judging the *structure*.
  *   **The Case:** The kind master. He can be personally gentle (agent) while upholding a violent system (structure).
  *   **Application:** You must show how his personal kindness relies on the structural violence. His ability to be "kind" is purchased by his power to be cruel.
  *   **Failure Mode:** Collapsing these leads to the "Great Man" theory (he was good, so the system wasn't that bad) or total demonization (the system was bad, so he must be a monster).

  **4. The Cost of Virtue Constraint (Non-Negotiable)**
  *   **Requirement:** The account must acknowledge the social cost of dissent.
  *   **The Case:** The abolitionist. If being anti-slavery was easy and cost-free, everyone would do it. It wasn't.
  *   **Application:** To evaluate the protagonist fairly, you must show what he would have lost by freeing his slaves (ruin, ostracization, violence). This doesn't excuse him, but it calibrates the moral weight of his inaction.
  *   **Failure Mode:** Ignoring this makes historical figures look like cartoon villains who just chose evil for fun.

  **5. The Consistency Constraint (Debatable/Taste)**
  *   **Requirement:** The account should apply similar scrutiny to virtues and vices.
  *   **The Case:** The sexist abolitionist. If you excuse the slaveholder because "everyone owned slaves," you must excuse the abolitionist's sexism because "everyone was sexist." If you condemn the abolitionist's sexism, you must admit the slaveholder had access to anti-slavery arguments.
  *   **Application:** Decide if you are writing a hagiography or an autopsy. If the latter, apply the same moral lens to all characters.
  *   **Failure Mode:** Cherry-picking which historical norms to challenge based on modern political preferences.

  **6. The Narrative Distance Constraint (Debatable/Taste)**
  *   **Requirement:** The narration must decide whose moral vocabulary it uses.
  *   **The Case:** The "Winking Narrator."
  *   **Application:** Either the narration stays within the character's moral horizon (free indirect discourse) or it steps outside. It cannot do both simultaneously without signaling the shift.
  *   **Failure Mode:** The narrator uses the character's voice but inserts modern judgment, breaking trust.

  ---

  ### The Tension: Where the Spec Forces a Choice

  You asked if "don't judge by standards that didn't exist" and "don't treat morality as whatever happened to be locally accepted" pull against each other.

  **Yes, they do.** They are logically incompatible if you treat "judgment" as a single act. You cannot satisfy both if you demand a single verdict on the character.

  *   **Principle A:** "He shouldn't be blamed for not knowing X." (Epistemic Constraint)
  *   **Principle B:** "X was wrong even if he didn't know it." (Moral Continuity)

  If you prioritize A, you risk excusing the act. If you prioritize B, you risk unfair blame.

  **The Resolution:**
  You must split the concept of **Wrongness** from **Culpability**.
  *   **Wrongness** is about the act and its impact on the victim. (Slavery is wrong, full stop. This satisfies Moral Continuity).
  *   **Culpability** is about the agent's mind and choices. (He is less culpable if he was brainwashed, more culpable if he ignored evidence. This satisfies the Epistemic Constraint).

  **The Incompatibility:**
  You cannot jointly satisfy **Total Empathic Immersion** (seeing the world exactly as he did, where slavery seems normal) and **Moral Clarity for the Reader** (the reader knowing slavery is a crime against humanity).
  *   If you stay fully inside his head, the reader may miss the horror (Apologia).
  *   If you step outside to ensure the reader sees the horror, you break the immersion (Winking).

  **The Choice:** You must choose **Friction**. The narration must allow the reader to see *more* than the character sees, without the character feeling like a puppet. The tension isn't a bug; it's the feature. The discomfort the reader feels—liking the man but hating his actions—is the accurate historical experience.

  ---

  ### The Key Requirement

  The single requirement that does the most work is **The Distinction of Locus (Requirement #3): Separating the Agent from the Structure.**

  Once you accept this, most disputes resolve:
  1.  **It kills the Apologia:** You can acknowledge he was kind to his children (Agent) without denying he was a jailer (Structure).
  2.  **It kills the Presentist Caricature:** You don't have to make him a mustache-twirling villain. He can be a loving father *and* a participant in evil. This makes him more human and the evil more terrifying.
  3.  **It fixes the Narration:** You don't need the narrator to call him a villain. You just need the narrator to show the structure working through him. When he punishes an enslaved person "for their own good," the text shows the pain, not the benevolence.

  If you get this right, you don't need to tell the reader how to judge. The gap between his self-image (good man) and the structural reality (owner of humans) creates the irony that drives the novel.

  ---

  ### Evaluation of the Three Positions

  Here is how the standard positions score against the spec:

  **1. Pure Presentism (Judge everyone by 2024 standards)**
  *   **Score:** Fails Epistemic Constraint and Cost of Virtue.
  *   **Result:** Everyone before 1950 is a villain. History becomes a morality play where the present is the hero. It flattens the specific texture of the past.
  *   **Verdict:** Unusable for serious fiction. It creates cardboard cutouts.

  **2. Hard Relativism (Judge them only by their era's standards)**
  *   **Score:** Fails Moral Continuity.
  *   **Result:** Slavery becomes "acceptable" in the 1840s. The suffering of the victims is erased because it was "legal." It reads as apologia.
  *   **Verdict:** Ethically bankrupt. It surrenders the novelist's moral agency.

  **3. The "Good For His Time" View (The Middle Ground)**
  *   **Score:** Passes most, but often vague on Moral Continuity.
  *   **Refinement:** To work, this must be defined as: *"He maximized virtue within the local constraints, but the constraints themselves were evil, and he benefited from them."*
  *   **Result:** This is the only viable position for fiction. It allows you to show him giving to charity (maximizing virtue) while showing the charity is a drop in the bucket compared to the harm of his ownership (benefiting from evil constraints).
  *   **Verdict:** Use this, but sharpen the definition. "Good for his time" does not mean "Good." It means "Less bad than his peers, but still complicit."

  ### Sentence-Level Application

  To avoid the "winking" vs. "apologia" trap in Draft 3:

  1.  **Don't narrate his guilt.** Don't write: *He knew it was wrong, but he did it anyway.* (Unless he actually knew).
  2.  **Narrate the consequence.** Write: *He spoke gently to the boy, then signed the paper that sold the boy's mother.*
  3.  **Let the blind spot stand.** Allow him to think he is benevolent. Do not correct him in the narration. Let the *scene* correct him. If he thinks he is a savior, show the person he "saved" looking terrified.
  4.  **Use the Epistemic Constraint.** If he encounters an abolitionist argument in 1840, show him dismissing it. That is where the culpability lies. Not in not knowing 2024 ethics, but in rejecting the 1840 ethics that challenged him.

  The goal is not to acquit him or convict him. It is to indict the world that made his goodness possible only through someone else's bondage.
