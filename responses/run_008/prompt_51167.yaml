answer: |-
  Here is the call: **Your narrator is misremembering the theory, and that is the key to unlocking your plot.**

  Dennett did not design these categories as mutually exclusive species, nor did he suggest that reaching the Popperian level seals you off from environmental feedback. If you write the forger as immune to reality, you are following your narrator's error, not the actual cognitive science. To save your second act and keep your character coherent, you need to lean into the following two corrections.

  ### 1. Feedback Sneaks In Through the "Model Gap"
  **Verdict:** A Popperian creature absolutely still learns from the world. The "trials" happen in the head, but the *materials* for those trials come from the environment.

  **The Defense:** The Popperian mechanism relies on an internal model of the world. You simulate an action by running it against your mental map of reality. If your map is wrong, your simulation is wrong, and reality *will* punish you when you execute the plan.

  This is exactly where your Act Two lives. The forger isn't failing because he stopped simulating; he's failing because his internal model lacks a variable he couldn't have known about. Maybe the ink dries differently in this humidity, maybe the mark has a tic he didn't display during the reconnaissance, maybe the security system was updated yesterday. The simulation was perfect, but the *data* fed into the simulation was incomplete.

  The environment punishes the Popperian creature not by stopping the simulation, but by revealing the simulation's divergence from reality. This preserves your narrator's voice (she thinks Popperians are "above" feedback) while validating your plot (the forger gets slapped by reality). The tension comes from the gap between his map and the territory.

  ### 2. They Are Layers, Not Species
  **Verdict:** Dennett explicitly treats these as evolutionary layers that accumulate, not distinct boxes. A human is always all four at once.

  **The Defense:** You cannot write a human character who is "just" Popperian. We are Darwinian (genetic instincts), Skinnerian (conditioned by pain/reward), Popperian (planners), and Gregorian (cultural users) simultaneously.

  Your forger must be both the hyper-planner and the guy who gets slapped. In fact, it is more psychologically realistic if his Popperian layer is a defense mechanism *against* his Skinnerian layer. He plans obsessively *because* he is terrified of the Skinnerian pain of real-world failure.

  When reality slaps him in Act Two, it shouldn't just be a logistical failure; it should trigger a Skinnerian response. He feels the panic, the sweat, the conditioned fear of punishment. This makes him human. If he were truly "sealed off" in a Popperian bubble, he would be a robot, and your readers wouldn't care when he fails. The drama exists precisely because the Popperian layer fails to protect the Skinnerian layer from harm.

  ### How to Use This
  Lean hard into your narrator's unreliability here. She is a windbag who categorizes people to feel superior. She *wants* to believe Popperian creatures are immune to the messiness of the world because that validates her own intellect.

  Let her monologue about how the forger is "too Popperian to be touched by consequence," and then immediately have the forger get burned by a variable he couldn't simulate. This creates a beautiful thematic irony: the narrator uses a theory of mind to distance herself from chaos, while the protagonist lives the reality that chaos always wins in the end.

  **Summary for your draft:**
  1.  **Keep the sequence where he gets it wrong.** It is theoretically sound. The simulation failed because the model was incomplete, not because he stopped simulating.
  2.  **Treat the hierarchy as a stack.** He is a Skinnerian creature wearing a Popperian hat. When the hat blows off, the Skinnerian fear is exposed.
  3.  **Let the narrator be wrong.** Her garbling of the theory is not a bug in your book; it's a feature of her character.

  You have not written yourself into a corner. You have written yourself into a conflict between a character's model of control and the world's refusal to comply. That is a solid Act Two. Go write it.
