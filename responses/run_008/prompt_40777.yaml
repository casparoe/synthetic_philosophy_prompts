answer: |-
  This is one of the classic debates in welfare economics and political philosophy, often framed as the tension between **Kaldor-Hicks efficiency** (the standard economic model for policy) and **Utilitarian welfare maximization** (the philosophical model for social good). You and Maya are both partially right, but you are operating with different definitions of "comparison."

  Maya is relying on the standard neoclassical economic orthodoxy: **Utility is ordinal, not cardinal.** We can observe that you prefer A to B, but we cannot measure *how much* you prefer it in "utils." Therefore, comparing the intensity of your satisfaction to mine is scientifically impossible. By refusing distributional weights, agencies claim they are avoiding this impossible comparison.

  You are identifying the hidden normative commitment: **Money-metric utility is being treated as cardinal.** When an agency sums willingness-to-pay (WTP) across individuals, they are implicitly asserting that a dollar of WTP from Person A is socially equivalent to a dollar of WTP from Person B. Since WTP is constrained by ability to pay, this systematically weights the preferences of the rich more heavily than the poor. By refusing to adjust for income, they *are* making an interpersonal comparison—they are comparing people via their wallet sizes rather than their welfare.

  Here is the breakdown of the philosophical presuppositions, the coherence of the position, and the table you requested.

  ### 1. The Philosophical Presuppositions

  The regulatory practice presupposes a specific, hybrid view of wellbeing that is often left unstated: **Preference Satisfaction Welfarism with a Monetary Metric.**

  *   **Wellbeing is Preference Satisfaction:** The agencies assume that what is good for people is getting what they want (revealed by choices), not necessarily pleasure (hedonism) or objective goods (objective list).
  *   **Money is the Common Denominator:** It assumes that money provides a stable, interpersonally comparable scale for preference intensity. This is the crucial leap. Economics formally says "utility is incomparable," but CBA operationally says "dollars are comparable."
  *   **The "Equal Weight per Dollar" Norm:** The refusal of distributional weights presupposes that the *marginal utility of income* is roughly equal across citizens, or that the government should act *as if* it is equal. This is not a scientific finding; it is a normative stance that prioritizes efficiency (total size of the pie) over equity (how the pie is sliced).

  ### 2. Is Maya's Distinction a Dodge?

  Maya's claim that "we measure choice, not utility" is **methodologically standard but philosophically thin.**

  *   **Why it's standard:** In revealed preference theory, "utility" is just a mathematical function we assign to choices to make sense of them. We don't need to look inside your head. So, technically, she is right that they measure WTP (choice), not internal welfare states.
  *   **Why it's a dodge:** The *purpose* of the analysis is to determine if a rule improves social welfare. If WTP is just a measure of choice, why does summing choices tell us about welfare? It only tells us about welfare if we assume choices track welfare. But if choices are constrained by income, they track *ability to pay* more than *welfare impact*. By refusing weights, the agency is asserting that a rich person's choice to buy a marginally safer car is socially more valuable than a poor person's choice to avoid a fatal hazard, simply because the rich person can bid more. That *is* an interpersonal comparison of welfare, disguised as a neutral measurement of choice.

  ### 3. Underdetermination and Rival Views

  Which views of wellbeing license these numbers?
  *   **Preference Utilitarianism:** Licenses WTP, but usually demands distributional weights (since a dollar gives less utility to a rich person). CBA uses the metric but rejects the weighting.
  *   **Wealth Maximization (Posnerian):** This view explicitly argues that social good *is* the maximization of total wealth. This licenses the numbers perfectly and admits the bias toward the rich as a feature, not a bug.
  *   **Kaldor-Hicks Efficiency:** This is the actual legal/economic standard. It asks: *Could* the winners compensate the losers? It does not require actual compensation. This licenses the numbers without requiring interpersonal utility comparison, *provided* you admit you are measuring efficiency, not welfare.

  If agencies took **incomparability** seriously (strict Paretian view), they could not sum benefits. They would need unanimous consent or use **Cost-Effectiveness Analysis** (e.g., "What is the cheapest way to save 100 lives?") without putting a dollar value on the lives.

  If they **bit the bullet on weights**, they would need an explicit **Social Welfare Function**. They would have to estimate the elasticity of marginal utility of income (e.g., if income doubles, utility only rises by 50%) and weight every dollar of WTP by the recipient's income level.

  ### 4. Summary Table

  | Component of the practice | What it presupposes about comparability | Nearest alternative reading | Breaks without the presupposition? |
  | :--- | :--- | :--- | :--- |
  | **Valuation of Statistical Life (VSL)**<br>*(Averaging WTP for risk reduction across a population)* | **Yes, Cardinal Comparability of Risk Trade-offs.**<br>Presumes a dollar's worth of risk reduction is the same unit of value regardless of who pays it. Implicitly assumes marginal utility of income is constant. | **Human Capital Approach.**<br>Value a life based on future economic productivity (earnings). This avoids utility comparisons but values the rich/employed higher than the poor/retired explicitly. | **Yes.**<br>Without comparability, you cannot average individual trade-offs into a single social number. You would have to list risk values by income quintile separately. |
  | **Summing Benefits minus Costs**<br>*(Aggregating dollars across different people)* | **Yes, Interpersonal Comparability of Monetary Value.**<br>Presumes $1 of benefit to Person A cancels out $1 of cost to Person B. Treats money as a universal proxy for welfare units. | **Utilitarian Sum of Utils.**<br>Sum actual welfare (happiness/satisfaction). Requires converting dollars to "utils" via weights, rather than summing dollars directly. | **Yes.**<br>Strict incomparability prohibits summation. You could only identify Pareto improvements (where someone gains and no one loses), which paralyzes most regulation. |
  | **Refusal of Distributional Weights**<br>*(Treating a poor person's dollar equal to a rich person's)* | **No, Denial of Comparability of Utility Intensity.**<br>Claims we cannot know if $1,000 helps a poor person *more* than a rich person. (Though operationally acts as if $1 = $1 utility). | **Prioritarianism / Equity Weighting.**<br>Explicitly weights benefits to the disadvantaged more heavily. Admits comparability is possible and necessary for justice. | **No.**<br>This component *is* the denial of comparability. It survives, but it severs the link between CBA and "Social Welfare," redefining the goal as "Aggregate Wealth." |
  | **Use of Willingness-to-Pay (WTP)**<br>*(Using market choices to value non-market goods)* | **Yes, Comparability of Preference Intensity via Budget.**<br>Presumes that the intensity of a preference is accurately measured by the amount of money one *can* spend, not just how much one *cares*. | **Deliberative Valuation.**<br>Use citizen juries or surveys to ask people what is *right*, not what they would buy. Measures moral value rather than economic capacity. | **Yes.**<br>If money does not track value (due to income constraints), WTP is a invalid metric for welfare. The practice would need to switch to voting or deliberative metrics. |
  | **Kaldor-Hicks Criterion**<br>*(Policy is good if winners *could* compensate losers)* | **No, Avoidance of Actual Utility Comparison.**<br>Claims we don't need to compare utility, only potential wealth. (This is the theoretical shield Maya is using). | **Pareto Criterion.**<br>Policy is good only if winners *do* compensate losers. Requires actual transfers to validate the comparison. | **No.**<br>This is the theoretical framework that allows the practice to claim it isn't making interpersonal utility comparisons. It survives, but admits the policy might make the poor worse off. |

  ### The Verdict

  The practice is **philosophically coherent only if you accept that "Efficiency" (wealth maximization) is a distinct goal from "Welfare" (wellbeing).**

  Maya is defending the **Efficiency** view: Agencies are tasked with making the pie as big as possible, using dollars as the ruler. She is correct that comparing "utils" is unscientific.

  You are defending the **Welfare** view: The point of regulation is to make people's lives better. You are correct that using dollars as the ruler without adjusting for income makes the ruler shrink for poor people and expand for rich ones.

  The confusion arises because agencies market CBA as a tool for **Welfare** ("benefits to society") while operating on the mechanics of **Efficiency** ("net monetary value"). If they admitted they were maximizing wealth rather than welfare, your objection would lose its moral force (because wealth *should* be weighted by ability to pay). But because they claim to be measuring social good, your objection holds: they are making interpersonal comparisons of welfare, they are just doing them using a biased metric.
