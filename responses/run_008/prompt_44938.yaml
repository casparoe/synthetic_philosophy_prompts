      *   **The Core Example:** Needs to be clinical but vivid. Congenital Insensitivity to Pain (CIP) is a good contrast, but asymbolia is the star. The example needs to show intact sensation + removed aversion. Avoid S&M (consent/pleasure confounds) and Morphine (drug confounds). The classic case is a patient with a cingulotomy or specific lesions (like the Graff-Radford cases) who says "It hurts, but it doesn't bother me."
      *   **Misconceptions & Timing:**
          1.  "Pain is subjective" (Relativism).
          2.  "Switch off hating = Utopia" (Techno-optimism).
          3.  "Suffering doesn't matter" (Negative Utilitarianism/Nihilism).
          *   Need to intercept these *during* the flow, not just at the end.
      *   **Scope Boundaries:** What to cut? Inverted spectrum, hard problem of consciousness, AI sentience. Need polite but firm "parking lot" phrases.
      *   **Closing Question:** Must test if they understand the *relocation* of the problem (from "is pain bad?" to "what makes the affective component bad?") rather than just "cool fact."

  3.  **Drafting the Plan - Section by Section:**

