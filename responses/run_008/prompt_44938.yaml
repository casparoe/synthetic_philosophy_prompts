          2.  "Just switch it off": Intercept when discussing implications. The "hating" has a function.
          3.  "Suffering doesn't matter": Intercept at the conclusion. The badness hasn't vanished; it's just attached to the reaction, not the sensation.
      *   *Scope:* Inverted spectrum is a rabbit hole. AI pain is a different debate. Hard problem is a session-ender.
      *   *Closing Question:* "Where did the 'bad' go?" is the core. Let's formulate a specific scenario.

  5.  **Final Review against Constraints:**
