      *   *The Paradox:* Majority vote on premises yields $C$. Majority vote on conclusion yields $\neg C$. (Or vice versa).
      *   *Key Mechanism:* Inconsistency between premise-based and conclusion-based aggregation.
      *   *User's Twist:* The "caucus" changed the electorate and the burden of proof (default status of $C$).

