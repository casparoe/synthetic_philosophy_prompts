answer: |-
  # The Entanglement Protocol: A Decision Procedure for Ethical Acquisitions

  **Purpose:** To resolve questions regarding artist immorality in a single committee session by separating ethical modes, decoupling institutional levers, and acknowledging the permeability of aesthetic value.
  **Time Required:** 60–90 Minutes per case.
  **Underlying Theory:** **Moderate Moralism (Ethicism).** This procedure operates on the premise that ethical defects *can* constitute aesthetic defects when they frustrate the work's intended uptake or structure. It rejects *Autonomism* (the idea that art and morality are separate spheres) and *Radical Moralism* (the idea that all moral defects are aesthetic defects).

  ---

  ## Part I: The Diagnostic Worksheet (30 Minutes)

  *Committee members must complete this section individually, then compare answers. Discrepancies trigger discussion.*

  ### Step 1: Categorize the Immorality
  *Identify the primary locus of the ethical concern. A case may have multiple, but select the dominant one.*

  *   **[ ] Type A: Internal Flaw.** The work's content, perspective, or structure endorses, normalizes, or relies upon something abhorrent (e.g., propaganda, hate speech, sadistic imagery).
  *   **[ ] Type B: Upstream/Biographical Fact.** The wrongdoing is causally upstream of the work. The artist's misconduct funded the work, the work was made through the mistreatment of subjects, or the artist's character contradicts the work's claims.
  *   **[ ] Type C: Consequential/Institutional.** The harm arises from *our* choice to platform. The artist is alive and will receive revenue/reputation; display may re-traumatize victims or signal institutional indifference.

  ### Step 2: The Entanglement Test (The "Isolation Failure" Check)
  *This step addresses the requirement that aesthetic merit cannot be assessed in isolation. Answer honestly: Does knowing the moral fact change how the work looks, sounds, or feels?*

  *   **Question:** If the audience knows the ethical fact identified in Step 1, does it frustrate the **intended uptake** of the work? (e.g., The work asks for admiration, but the knowledge provokes disgust; the work claims truth, but the knowledge reveals a lie.)
      *   **[ ] Yes, the experience is fundamentally altered.** (The moral defect *is* an aesthetic defect.)
      *   **[ ] No, the experience remains distinct.** (The moral defect is external to the aesthetic experience.)
      *   **[ ] Uncertain / Mixed.** (The experience is complicated but not necessarily ruined.)

      > **[JUDGMENT CALL 1]:** There is no algorithm for "intended uptake." The committee must agree on what the work *asks* of the viewer. If you cannot agree on the work's intended effect, you cannot proceed to Step 3 without a curatorial expert present.

  ### Step 3: The Lever Matrix
  *Do not vote "Yes/No" on the artist. Vote on the three independent levers.*

  | Lever | Option 1 | Option 2 | Option 3 |
  | :--- | :--- | :--- | :--- |
  | **1. Acquire** (Permanent Stewardship) | **Full Acquisition** (Permanent collection) | **Archival Only** (Acquire for study, not display) | **Reject** (No financial commitment) |
  | **2. Exhibit** (Public Platform) | **Featured** (Standard display) | **Conditional** (Thematic/Contextual show only) | **Suppress** (No public display) |
  | **3. Contextualize** (Framing) | **Standard** (Standard labels) | **Interventionist** (Wall texts, programming, warnings) | **Silence** (No mention of artist/bio) |

  ---

  ## Part II: The Institutional Harm Check (15 Minutes)

  *If Step 1 identified **Type C (Consequential)** harm, or if the artist is living, run this check.*

  1.  **Revenue Flow:** Can we structure the exhibition/acquisition so that **zero** revenue flows to the artist or their estate? (e.g., Buying from a third party, donating ticket sales).
      *   If **No**: The default recommendation for *Exhibit* shifts from **Featured** to **Suppress**.
  2.  **Victim Impact:** Have we consulted (or can we reasonably infer) the stance of the victims of the artist's misconduct?
      *   If **Victims Object**: The default recommendation for *Exhibit* shifts to **Suppress**.
  3.  **Mission Alignment:** Does displaying this work advance our specific public mission (education, historical record) enough to outweigh the reputational risk?
      *   If **No**: The default recommendation for *Acquire* shifts to **Reject**.

  > **[JUDGMENT CALL 2]:** This is the "Reputation vs. Truth" gate. The committee must weigh the educational value of confronting difficult history against the risk of appearing to endorse harm. There is no correct mathematical weight here.

  ---

  ## Part III: Application to Test Cases

  Here is the protocol run on your three scenarios.

  ### Case 1: The Dead Painter
  * **Scenario:** A canonical painter (d. 1920). Undisputed history of domestic cruelty and abuse. Canvases are landscapes/still lifes (morally inert content).
  * **Step 1 (Diagnosis):** **Type B (Upstream).** The harm is biographical; the content is inert.
  * **Step 2 (Entanglement):** **No.** Knowing the painter beat his spouse does not change the optical experience of a bowl of fruit. The intended uptake (appreciation of color/form) remains intact.
  * **Step 3 (Levers):**
      *   *Acquire:* **Full Acquisition.** (Historical importance remains).
      *   *Exhibit:* **Featured.** (Aesthetic merit stands).
      *   *Contextualize:* **Interventionist.** (Biographical wall text is required to prevent hagiography).
  * **Institutional Check:** Artist is dead. No revenue flows to perpetrator.
  * **Verdict:** **Buy and Show, but label the cruelty.**
  * **Rationale:** Erasing the biography falsifies history; letting the art stand acknowledges that aesthetic value can survive moral failure when they are not entangled.

  ### Case 2: The Living Filmmaker
  * **Scenario:** A celebrated living director. Notorious sexual crimes. Films do not reference the crimes.
  * **Step 1 (Diagnosis):** **Type C (Consequential)** and **Type B (Upstream).** Platforming generates revenue/reputation for a criminal; production may have involved abuse.
  * **Step 2 (Entanglement):** **Uncertain/Mixed.** For some viewers, the knowledge makes the work unwatchable (complicity); for others, the work stands apart.
  * **Step 3 (Levers):**
      *   *Acquire:* **Reject.** (Too much liability/reputational risk for permanent stewardship).
      *   *Exhibit:* **Conditional.** (Only in a retrospective context examining the separation of art/artist, not as a "Masterwork" screening).
      *   *Contextualize:* **Interventionist.** (Mandatory programming on the crimes; revenue diverted to victim support funds).
  * **Institutional Check:** **Revenue Flow.** If ticket sales/licensing fees go to the director, *Exhibit* shifts to **Suppress**.
  * **Verdict:** **Do Not Acquire. Exhibit Only if Revenue is Diverted.**
  * **Rationale:** The institutional harm (platforming a predator) outweighs the aesthetic benefit unless the institution neutralizes the material support for the artist.

  ### Case 3: The Exploitative Photographic Series
  * **Scenario:** A series famous for its "empathy" toward a vulnerable community. It is revealed the photographer systematically deceived and exploited the subjects to get the shots.
  * **Step 1 (Diagnosis):** **Type A (Internal)** and **Type B (Upstream).** The work *claims* empathy (Internal content) but is *built* on exploitation (Upstream method).
  * **Step 2 (Entanglement):** **Yes.** The work asks for an emotional response (empathy/trust). The knowledge of deception makes that response impossible, replacing it with feelings of betrayal or voyeuristic guilt. **The aesthetic merit is compromised because the work fails on its own terms.**
  * **Step 3 (Levers):**
      *   *Acquire:* **Archival Only.** (Acquire as evidence of ethical failure, not as aesthetic triumph).
      *   *Exhibit:* **Suppress (Aesthetically).** (Do not hang as "beautiful art").
      *   *Contextualize:* **Interventionist.** (If shown in a research context, the deception must be the primary text).
  * **Institutional Check:** **Mission Alignment.** Does holding this serve the public? Yes, as a cautionary record. Does showing it serve the public? No, it re-enacts the exploitation.
  * **Verdict:** **Spend Money to Hide It.**
  * **Rationale:** This is the **Unpopular Answer**. The committee is advised to use acquisition funds to purchase the work *specifically so it can be kept off the walls.*

  ---

  ## Part IV: Meta-Analysis & Constraints

  ### The Unpopular Answer (Case 3)
  You will likely dislike the verdict on Case 3. It requires the museum to spend limited acquisition budget on work that will never be aesthetically displayed.
  *   **Why the procedure demands this:** If the work is historically significant *as an artifact of exploitation*, letting it disperse into private hands erases the evidence of that harm. However, displaying it aesthetically validates the lie (the "empathy").
  *   **The Tension:** This treats the museum as an archive of ethical history rather than a temple of beauty. It prioritizes the safety of the vulnerable subjects over the public's access to "great art."

  ### Where Human Judgment Takes Over
  This procedure cannot automate values. You must pause at these specific points:
  1.  **[JUDGMENT CALL 1] (Entanglement):** Determining whether a moral flaw ruins the aesthetic experience is subjective. A committee member who believes "Art is separate" will vote "No" on Step 2; a member who believes "Art is life" will vote "Yes." You must debate this until you reach a consensus on the *work's intended uptake*, not just your personal feelings.
  2.  **[JUDGMENT CALL 2] (Reputation vs. Truth):** In Case 2, you must decide if the educational value of showing the films outweighs the signal it sends to victims. The procedure sets the guardrails (divert revenue), but it cannot calculate the reputational cost to your specific institution.

  ### Operational Theory Summary
  This procedure operationalizes **Moderate Moralism**.
  *   It rejects **Autonomism** by forcing Step 2 (The Entanglement Test). If the morality changes the experience, the aesthetic value is downgraded.
  *   It rejects **Radical Moralism** by allowing Case 1 (The Dead Painter) to be exhibited. Moral flaws do not *automatically* cancel aesthetic merit; they only do so when they interfere with the work's internal logic or intended response.
  *   It treats **Institutional Ethics** as distinct from **Artistic Ethics**. Even if the art is "clean" (Case 2), the institution may be "dirty" for showing it. This allows you to say, "This is good art, but we cannot be the ones to show it."

  ### Final Instruction for the Chair
  When the committee deadlocks, return to **Step 2**. If you cannot agree on whether the immorality changes the *experience* of the work, you are not arguing about policy; you are arguing about art criticism. Resolve the aesthetic interpretation first. The ethical verdict follows.
