prompt: |-
  I work on a technical standards committee that has to write definitions containing vague predicates — when a system is "reliable enough" to be fielded, when a model is "sufficiently interpretable" to satisfy a disclosure rule, when a concentration is "excessive" for a given zone — and I've noticed something that unsettles my amateur's understanding of the vagueness literature. The philosophy I half-remember, built around the sorites paradox, seems organized around explaining why there is no sharp boundary between the heap and the non-heap, whereas the practical half of my job is legislating one: some threshold must go in the document, a number or a criterion, and people will litigate at the margin. Before I read any further in the literature, I want the specification an adequate theory of vagueness would have to meet for a purpose like mine — a theory of vagueness good enough to advise a body that must draw boundaries on purpose.

  Write the desiderata. I'd expect the list to include at least the following sorts of items, though I want you to exercise judgment about what belongs and what doesn't: which cases the theory must get right (the ordinary sorites for a vague predicate like "bald" or "rich," but also forced-boundary cases where an institution must fix a cutoff, and the interaction between them — does the legislated line change the predicate's meaning or merely its application?); what it must say about higher-order vagueness and whether a theory that eliminates it is thereby disqualified; what it owes us about the appeal of tolerance premises — why the one-grain step seems unobjectionable in a way the full induction never does, and whether a theory that treats that appeal as simple error has missed something; whether it must deliver a determinate truth-value for each marginal statement or is permitted some weaker commitment structure, and what that means for a standards body that needs a yes-or-no answer about a borderline case; and how it should handle penumbral connections (that a shade noticeably darker than a definitely dark one is dark) and context shifts (tall for a jockey versus tall for a center). For each requirement, give the case or consideration that motivates it, and be explicit about which are non-negotiable for my legislative purpose versus which are prejudices of one camp — supervaluationists, epistemicists, degree theorists, and contextualists each smuggle in demands the others rightly refuse, and I'd like that sorted out rather than papered over.

  The part I most want to see is whether some subset of the desiderata is jointly unsatisfiable: I suspect that a requirement of tolerance — that adjacent cases in a sorites series cannot be treated differently without a relevant difference — cannot coexist with the requirement that the theory bless a legislated sharp cutoff, or at least that the two can be reconciled only by an unappealing move, such as treating the legislated predicate as an artificial homonym of the vague one. If that is right, say so and say which requirement you would abandon. Then, briefly, run the main contenders — epistemicism, supervaluationism, degree or fuzzy theories, and contextualism — against the list; keep the scoring short, since the criteria are where the thinking is. And tell me which single requirement does the most work in excluding candidates, because that will tell me which literature to read first.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A member of a technical standards committee. They deal with *practical* vagueness (legislating thresholds for "reliable enough," "excessive," etc.).
      *   **Problem:** They notice a tension between the philosophical literature on vagueness (which often argues *against* sharp boundaries, e.g., Sorites paradox) and their job (which *requires* drawing sharp boundaries).
      *   **Task:** Write a list of *desiderata* for a theory of vagueness that is adequate for *their* purpose (legislating boundaries).
      *   **Specific Requirements:**
          *   Include specific topics: ordinary Sorites vs. forced-boundary cases, interaction between them (meaning vs. application), higher-order vagueness, tolerance premises (why they appeal), truth-values (determinate vs. weaker), penumbral connections, context shifts.
          *   Distinguish between non-negotiable (for legislation) and camp-specific prejudices (supervaluationism, epistemicism, etc.).
          *   Identify joint unsatisfiability (specifically Tolerance vs. Legislated Cutoff).
          *   Evaluate main contenders (Epistemicism, Supervaluationism, Degree/Fuzzy, Contextualism) against the list.
          *   Identify the single most exclusionary requirement.
      *   **Tone:** Philosophical, precise, practical, unsentimental about "solving" vagueness, focused on utility for governance/standards.

  2.  **Deconstruct the Core Tension:**
      *   *Philosophy:* Vagueness is often seen as an inherent feature of language/concepts where boundaries are impossible or unknowable. Tolerance (if $x$ is $F$, and $y$ is very similar to $x$, $y$ is $F$) is central.
      *   *Legislation:* You *must* pick a number (e.g., 50ppm). This creates a sharp boundary.
      *   *The Conflict:* If the theory says "Sharp boundaries are impossible/false," it fails the legislative purpose. If the theory says "Sharp boundaries exist but are unknowable" (Epistemicism), it helps legally but feels wrong linguistically. If the theory says "Truth comes in degrees" (Fuzzy), how do you make a binary legal decision?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1: The Sorites & Tolerance.* Need to explain why the step-by-step reasoning feels right but leads to absurdity. *Legislative twist:* Must explain why we can override this feeling with a rule.
      *   *Item 2: Forced Boundaries.* The theory must account for *stipulative precision*. Does "50ppm" create a new concept or sharpen the old one?
      *   *Item 3: Higher-Order Vagueness.* Is "borderline" itself vague? For legislation, we need to know if the boundary itself is contestable.
      *   *Item 4: Truth Values.* Courts need Yes/No. Does the theory allow this without lying?
      *   *Item 5: Penumbral Connections.* Logic must hold (if Darker -> Dark).
      *   *Item 6: Context.* "Tall" changes. Standards often fix context ("Tall for a bridge clearance").

      *Refining for the User's Constraint:* Distinguish "Non-Negotiable" (must work for the committee) vs. "Philosophical Prejudice" (theoretical baggage).

  4.  **Addressing the "Joint Unsatisfiability" (The Crux):**
      *   The user suspects Tolerance vs. Legislated Cutoff is the conflict.
      *   *Analysis:* Tolerance says no single step changes the status. Legislation says one specific step (the threshold) changes the status (legal liability).
      *   *Resolution:* A theory for *legislation* must abandon Tolerance as a semantic constraint on the *legal* predicate, even if it holds for the *natural language* predicate. The "unappealing move" is treating the legal term as a *precisification* or a *technical homonym*.
      *   *Decision:* I need to be explicit that a theory satisfying *both* pure linguistic tolerance and *mandatory* sharp cutoffs without qualification is likely incoherent. The legislative purpose requires prioritizing the cutoff.

  5.  **Evaluating the Contenders:**
      *   *Epistemicism:* Sharp boundaries exist (good for law), but we can't know them (bad for drafting). Actually, for law, *we* set the boundary, so we know it. Epistemicism fits the *result* but implies the natural language term already had a boundary we ignored.
      *   *Supervaluationism:* Truth is super-true across all precisifications. Legislation *is* a precisification. Fits well. But higher-order vagueness is tricky.
      *   *Degree/Fuzzy:* Truth is 0-1. Law needs 0 or 1. Requires a "defuzzification" step. Good for risk assessment, bad for binary liability unless augmented.
      *   *Contextualism:* Meaning shifts with context. The "Standards Context" shifts the meaning to be precise. Very promising for this user.

  6.  **Identifying the "Most Work" Requirement:**
      *   Which one kills the most theories?
      *   Likely: **The Forced-Boundary Requirement (Actionability).** Many theories explain vagueness by saying boundaries are impossible. If the theory cannot explain how a boundary becomes possible via stipulation, it's useless here.
      *   Alternatively: **Tolerance vs. Cutoff.** If a theory insists Tolerance is semantically inviolable, it fails.
      *   *Selection:* The requirement that the theory must distinguish between *descriptive vagueness* (natural language) and *prescriptive precision* (standards) without claiming the latter is semantically defective.

  7.  **Drafting the Content (incorporating specific constraints):**
      *   *Structure:*
          1.  Introduction (acknowledging the tension).
          2.  The Desiderata List (categorized by Non-Negotiable vs. Theoretical).
          3.  The Incompatibility Thesis (Tolerance vs. Cutoff).
          4.  Scorecard of Contenders.
          5.  The "Killer" Requirement.
      *   *Tone Check:* Keep it rigorous. Don't dumb down the philosophy, but anchor it in the committee room. Use terms like "precisification," "penumbral," "bivalence."

  8.  **Refining the "Tolerance" Point:**
      *   The user asks: "whether a theory that treats that appeal [of tolerance] as simple error has missed something."
      *   *My take:* For legislation, we *must* treat it as an error in the legal context, even if it's a pragmatic feature of natural language. The theory needs to justify *why* we are allowed to make that error.

  9.  **Refining Higher-Order Vagueness:**
      *   If "borderline" is vague, then the boundary of the borderline is vague. For a standard, this leads to infinite regress. The theory must allow the committee to *stop* the regress by fiat.

  10. **Final Review against User Prompt:**
      *   Did I include ordinary Sorites? Yes.
      *   Forced-boundary cases? Yes.
      *   Interaction (meaning vs application)? Yes.
      *   Higher-order vagueness? Yes.
      *   Tolerance premises appeal? Yes.
      *   Truth-values (determinate vs weaker)? Yes.
      *   Penumbral connections? Yes.
      *   Context shifts? Yes.
      *   Non-negotiable vs. Prejudice distinction? Yes.
      *   Joint unsatisfiability addressed? Yes.
      *   Contenders evaluated? Yes.
      *   Single requirement identified? Yes.

      *(Self-Correction during drafting)*: Make sure I don't just say "Epistemicism is best." Epistemicism says the boundary *already exists*. The committee *creates* the boundary. Supervaluationism (precisification) or Contextualism (context shift) might actually fit the *act of legislating* better than Epistemicism (discovering a hidden fact). I need to be careful there. Actually, for the *result*, Epistemicism works (there is a line). For the *process*, Supervaluationism (choosing a precisification) describes the committee's action better. I will highlight this nuance.

      *Wait, one more thing:* The user asks about the interaction: "does the legislated line change the predicate's meaning or merely its application?" This is crucial. I need to make sure the desiderata demand an answer to this.

      *Let's finalize the "Killer Requirement".* It's the **Actionability Constraint**. A theory that leaves the boundary metaphysically or semantically indeterminate *after* stipulation is useless.

      *Okay, ready to write.*
answer: |-
  Here is a specification for a theory of vagueness adequate to the task of technical standard-setting. It distinguishes between what your committee *needs* (non-negotiables) and what philosophers often *want* (theoretical prejudices).

  ### I. Desiderata for a Legislative Theory of Vagueness

  #### A. Non-Negotiables (Functional Requirements)
  *These are conditions the theory must meet to be useful for a standards body. If a theory fails these, it is descriptively interesting but practically inert for your purposes.*

  **1. The Forced-Boundary Requirement (Actionability)**
  *   **Motivation:** Your committee must produce a document where compliance is binary (pass/fail). A system is either fielded or it is not.
  *   **Requirement:** The theory must explain how a vague predicate ("reliable") can be transformed into a precise regulatory criterion ("99.9% uptime") without the resulting statement being semantically defective or false. It must validate the *stipulative power* of the legislature.
  *   **Meaning vs. Application:** The theory must explicitly state whether the standard creates a new technical term (homonymy) or sharpens the existing natural language term (precisification). If it claims the latter, it must explain how the sharpening overrides the original semantic constraints.

  **2. The Bivalence Constraint (Adjudication)**
  *   **Motivation:** Courts and auditors cannot rule "neither true nor false" or "0.7 true." They need a truth-value to assign liability or certification.
  *   **Requirement:** For any case falling under the jurisdiction of the standard, the theory must deliver a determinate truth-value (True/False) once the standard is applied. It cannot leave the marginal cases in a truth-value gap *after* the standard is set.
  *   **Note:** This applies to the *regulated* predicate, not necessarily the natural language one.

  **3. The Regress Stopper (Higher-Order Vagueness)**
  *   **Motivation:** If "borderline" is itself vague (higher-order vagueness), then the boundary of the borderline is vague, leading to infinite regress. You cannot litigate a boundary that has no boundary.
  *   **Requirement:** The theory must allow the committee to terminate higher-order vagueness by fiat. It must explain why a legislated cutoff is immune to the charge that "the cutoff itself is borderline."
  *   **Status:** Non-negotiable. A theory that insists higher-order vagueness is ineliminable in principle is incompatible with rule-of-law governance.

  **4. Penumbral Preservation (Logical Coherence)**
  *   **Motivation:** Standards must not contradict basic logic. If Zone A is definitely "excessive" and Zone B is measurably more concentrated than A, Zone B must be "excessive."
  *   **Requirement:** The theory must preserve penumbral connections (entailments between clear cases and their neighbors) even while introducing a sharp cutoff. It cannot allow the cutoff to create logical absurdities (e.g., declaring a safer system "non-compliant" while a less safe one is "compliant" without a relevant difference defined in the standard).

  #### B. Theoretical Prejudices (Optional/Debatable)
  *These are demands often made by specific schools of thought. Your committee should treat these as optional features, not bugs, unless they conflict with Non-Negotiables.*

  **5. The Tolerance Intuition (Semantic vs. Pragmatic)**
  *   **Motivation:** The Sorites paradox relies on the Tolerance Principle (if $x$ is $F$, and $y$ differs imperceptibly from $x$, then $y$ is $F$). Philosophers want to save this intuition.
  *   **Requirement:** The theory should explain *why* Tolerance feels compelling in ordinary language, even if it must be rejected in the standard.
  *   **Status:** **Prejudice.** A theory that treats Tolerance as a semantic error (Epistemicism) is acceptable if it satisfies Actionability. A theory that preserves Tolerance at the cost of Actionability (some Degree Theories) is not. You need to know why the intuition exists so you can communicate the need for the cutoff to stakeholders, but you do not need the theory to validate the intuition in the regulatory context.

  **6. Contextual Sensitivity**
  *   **Motivation:** "Tall" means different things for jockeys and basketball players.
  *   **Requirement:** The theory should account for how context shifts extension.
  *   **Status:** **Prejudice.** Useful for explaining why different zones have different limits, but not strictly necessary if the standard explicitly defines the context (e.g., "Tall *in Zone A*").

  **7. Ontological Parsimony**
  *   **Motivation:** Some theories posit "degrees of truth" or "multiple worlds" (precisifications).
  *   **Status:** **Prejudice.** Irrelevant to the committee. You care about the output (the rule), not the metaphysical machinery, provided the machinery doesn't break the Non-Negotiables.

  ---

  ### II. The Incompatibility Thesis

  You suspected that **Tolerance** and **Forced-Boundary** are jointly unsatisfiable. You are correct.

  A theory cannot simultaneously maintain that:
  1.  **Tolerance is Semantically Valid:** No single micro-step changes the truth value of a vague predicate.
  2.  **Legislated Cutoffs are Semantically Valid:** A specific micro-step (the threshold) changes the truth value of the regulated predicate.

  If Tolerance holds, the cutoff is false. If the cutoff is true, Tolerance fails.

  **The Necessary Abandonment:**
  For your purpose, you **must abandon Tolerance as a semantic constraint on the regulated predicate.**
  Any theory that attempts to save Tolerance *within* the regulatory framework will fail the Actionability requirement. The "unappealing move" you anticipated is indeed required: the theory must treat the legislated predicate as a **precisification** (Supervaluationism) or a **contextual shift** (Contextualism) that explicitly suspends the Tolerance Principle of the natural language term.

  The theory must explain that the "error" of the sharp cutoff is not a semantic defect, but a **pragmatic feature of governance**. The appeal of Tolerance is a feature of *communication* (avoiding arbitrary distinctions in conversation), whereas the necessity of a Cutoff is a feature of *coordination* (solving cooperation problems). A theory that conflates these two functions will be useless to you.

  ---

  ### III. Scorecard of Contenders

  Here is how the main philosophical camps perform against your **Non-Negotiables**.

  | Theory | Actionability (Forced Boundary) | Bivalence (Yes/No) | Regress Stopper | Tolerance Explanation | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Epistemicism** (Williamson) | **Pass.** Boundaries exist; we just set them. | **Pass.** Every statement is T/F. | **Pass.** Boundaries are sharp. | **Fail.** Claims Tolerance is pure ignorance/error. | **High Utility.** Fits the legal need for binary outcomes perfectly. However, it implies the "correct" boundary existed before you wrote it, which is metaphysically odd for *standards*. |
  | **Supervaluationism** (Keefe) | **Pass.** Legislation = selecting a precisification. | **Pass.** "Super-true" once precisified. | **Mixed.** Struggles with higher-order vagueness, but legislation forces a stop. | **Pass.** Explains Tolerance as truth across *all* precisifications, but allows *one* to be chosen for law. | **High Utility.** Best describes the *act* of standard-setting (choosing one sharp version of a vague concept). |
  | **Degree/Fuzzy** (Zadeh) | **Fail.** Truth is 0–1. Needs external "defuzzification." | **Fail.** Natural output is a degree, not a bit. | **Pass.** Cutoffs can be arbitrary but clear. | **Pass.** Tolerance is preserved as gradual change. | **Low Utility.** Great for risk modeling, terrible for liability. Requires an add-on theory to explain how 0.8 becomes "Compliant." |
  | **Contextualism** (Raffman) | **Pass.** The "Standards Context" forces precision. | **Pass.** Context determines extension. | **Pass.** Context shift halts the regress. | **Pass.** Tolerance holds in *ordinary* contexts, fails in *technical* contexts. | **High Utility.** Best explains the *meaning shift* between "reliable enough" (chat) and "reliable enough" (contract). |

  ---

  ### IV. The "Killer" Requirement

  The single requirement that does the most work in excluding candidates is **The Forced-Boundary Requirement (Actionability).**

  *   **Why:** Most philosophical literature on vagueness is dedicated to explaining why sharp boundaries are *impossible*, *unknowable*, or *non-existent*. Their success condition is often the preservation of the vagueness.
  *   **Exclusion:** Any theory that treats the drawing of a sharp line as a semantic mistake (rather than a pragmatic necessity) is disqualified. This excludes "pure" Degree Theories (which resist binary cuts) and "Radical Contextualists" (who might argue the context can never fully fix the meaning).
  *   **Reading Recommendation:** Start with **Supervaluationism** (specifically the literature on *precisification* in law, e.g., Endicott or legal theorists applying Keefe). It treats your job not as discovering a boundary, but as *completing* an incomplete concept. This validates your authority to draw the line without claiming the natural language term was secretly sharp all along (Epistemicism) or that truth is fuzzy (Degree Theory).

  **Summary Advice:** Do not look for a theory that solves the Sorites paradox for *language*. Look for a theory that solves the **Coordination Problem** for *institutions*. The literature on **Precisification** and **Institutional Fact** (Searle/Supervaluationism hybrid) will serve you better than pure semantics. You are not analyzing "heap"; you are creating "legal-heap."
