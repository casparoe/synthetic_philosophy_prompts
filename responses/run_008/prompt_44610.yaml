prompt: |-
  I'm an acquisitions editor at a mid-sized trade publisher, and I'm realizing most of my job is just reading other people's decisions. I see which manuscripts went to auction and who dropped out at what number, I hear at lunch which imprints passed and for what reason (usually "didn't fall in love" which tells me nothing), and my agents are constantly telling me a book is "hot" — which mostly means other editors are saying it's hot. Somewhere in my head I know the herd is partially rational: if three smart houses are bidding, that's real information, those people read the thing and put money down. But it's also exactly how information cascades work, right? The fourth and fifth bidder aren't adding information, they're just copying, and eventually nobody in the chain is looking at the actual manuscript. And cascades are supposed to be fragile and path-dependent — which means the book everyone passed on might just have been unlucky with the first two readers.

  So: I want a decision procedure I can actually run in the twenty minutes between getting the submission and my editorial meeting, for how much weight to give the herd versus my own read. It should be grounded in what the actual cascade/herding literature says — rational herding, why cascades form even when everyone is behaving sensibly, the fact that early movers don't internalize what their choice reveals to later movers, cascade fragility, stuff like that — but translated into publishing, not economics-journal language. The questions in order, what counts as a real signal versus noise (e.g., does it matter that the passes came before or after Frankfurt? does a pass from a house with a strong list in that genre count differently?), where the procedure should tell me to stop and just go with my gut because it's a values call, and where it should force me to do the thing my gut won't like.

  Then run it on three cases. First: a literary novel that five big houses passed on but that two of my most trusted colleagues at other imprints flagged as "the best thing I read this year and I couldn't get my pub board to move" — do I want it, and what does the herd's no actually tell me? Second: a commercial thriller going to auction where two houses known for publishing exactly this stuff are already in at six figures — does my wanting it mean anything at all, or am I just bidder number three in a textbook cascade? Third: my own strong conviction case, a weird book I love that nobody else has mentioned, where the procedure should probably tell me something uncomfortable about how much my private signal is worth when nobody else is corroborating it.

  Also be honest about what the procedure can't do — like, I assume it can't tell me whether the first movers were right, only how much their choices reveal — and flag the steps that are judgment calls dressed up as questions. And if there's a place where what the herding literature recommends is genuinely in tension with how publishing actually has to work (we can't wait for more information, auctions have deadlines), say that too rather than pretending the theory just slots in.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User Persona:** Acquisitions Editor at a mid-sized trade publisher.
      *   **Problem:** Feeling like their job is just reading others' decisions (herding/information cascades). Wants to distinguish between rational signals (money/readership) and noise (copying/"didn't fall in love").
      *   **Goal:** A decision procedure (algorithm/heuristic) runnable in ~20 minutes before an editorial meeting.
      *   **Theoretical Basis:** Information cascade/herding literature (Bikhchandani, Hirshleifer, Welch, etc.) but translated into publishing terms.
      *   **Key Components:**
          *   Distinguish signal vs. noise (timing, source credibility).
          *   Identify where to trust gut vs. where to override gut.
          *   Apply to three specific cases (Passed Literary Novel, Hot Auction Thriller, Lone Wolf Weird Book).
          *   Acknowledge limitations (can't verify first movers' accuracy, theory vs. practice tension).
      *   **Tone:** Professional, insightful, realistic, slightly cynical but constructive. No econ-jargon without translation.

  2.  **Theoretical Foundation (Mental Sandbox):**

      *   *Information Cascades:* People ignore private signals to follow public actions. Happens when public information outweighs private information.
      *   *Rational Herding:* It's not stupidity; it's Bayesian updating. If House A passes, House B updates the probability of success downward.
      *   *Fragility:* Cascades can be broken by a small amount of new public info.
      *   *Externalities:* Early movers don't account for the information value of their decision to later movers.
      *   *Application:* In publishing, "Pass" is a public signal (eventually). "Bid" is a stronger public signal. "Hot" is cheap talk.
      *   *Constraint:* Editors have private signals (their read). The goal is to weigh Private Signal ($P$) vs. Public Signal ($H$ for Herd).

  3.  **Drafting the Procedure (The "Cascade Weighting Protocol"):**

      *   *Time Limit:* 20 minutes. Needs to be a checklist or a scoring system.
      *   *Step 1: Assess the Herd Quality (The Signal Strength).* Not all passes/bids are equal.
          *   Who passed? (Competitor in genre vs. generalist).
          *   When? (Before or after major info events like Frankfurt/BookExpo).
          *   Why? (Specific vs. "didn't fall in love").
      *   *Step 2: Assess Private Signal Quality (The Gut).*
          *   How sure am I? (Love vs. Like).
          *   Do I have unique info? (Author relationship, market gap).
      *   *Step 3: The Conflict Check.*
          *   If Herd says No, Gut says Yes -> Is the Herd fragile?
          *   If Herd says Yes, Gut says No -> Am I missing something or is it a cascade?
      *   *Step 4: The Decision Rule.*
          *   When to override. When to fold.

  4.  **Refining the Theory-to-Practice Translation:**

      *   *Econ Term:* "Public Action." *Publishing Term:* "The Pass List" or "The Bid List."
      *   *Econ Term:* "Private Signal." *Publishing Term:* "The Read."
      *   *Econ Term:* "Cascade Fragility." *Publishing Term:* "The Specific Objection."
      *   *Key Insight:* A pass based on "P&L doesn't work" is a hard signal. A pass based on "Not for us" is soft. A bid is a hard signal but subject to winner's curse.

  5.  **Developing the Three Cases:**

      *   *Case 1 (Passed Literary Novel):* Herd = No (5 houses). Signal = High (colleagues loved it but board said no).
          *   *Analysis:* This is a *constraint* cascade, not a *quality* cascade. The private signals were positive, public action was negative due to external constraints (board/P&L). This breaks the cascade logic.
          *   *Verdict:* High potential. The "Pass" is noise regarding quality, signal regarding commercial risk.
      *   *Case 2 (Hot Thriller Auction):* Herd = Yes (2 big bids). Gut = Maybe/Yes.
          *   *Analysis:* Classic cascade risk. If the first two bids were based on the agent's hype rather than the text, bidder 3 is just adding liquidity.
          *   *Verdict:* Need to isolate private value. If you bid, bid for *your* P&L, not to win.
      *   *Case 3 (Lone Wolf Weird Book):* Herd = Silence/No. Gut = Strong Yes.
          *   *Analysis:* High variance. If you're right, huge gain (first mover advantage). If wrong, you bear full cost. Herding literature says ignore private signal when public signal is strong, but here public signal is *absent*.
          *   *Verdict:* This is where innovation happens. But requires checking if the silence is due to invisibility or rejection.

  6.  **Addressing Limitations & Tensions:**

      *   *Theory:* Wait for more info. *Practice:* Deadline is tomorrow.
      *   *Theory:* Assume rational actors. *Practice:* Editors are tired, biased, or under pressure.
      *   *Theory:* Value of information. *Practice:* Reading takes time you don't have.

  7.  **Writing the Response (Iterative refinement):**

      *   *Intro:* Acknowledge the insight. Validate the "rational herding" feeling.
      *   *The Protocol:* Break it down into steps. Use bolding for scanability.
      *   *The Cases:* Apply the protocol strictly.
      *   *The Caveats:* Be honest about the "judgment calls."

      *(Self-Correction during drafting)*: Make sure I don't just say "trust your gut." The prompt asks for a procedure grounded in literature. The literature says *don't* trust your gut if the public signal is strong enough. I need to define *when* the public signal is strong enough.
      *Refinement:* Differentiate between "Quality Cascade" (nobody likes the book) and "Commercial Cascade" (nobody thinks it sells).
      *Refinement on Case 1:* The colleagues saying "I couldn't get my board to move" is crucial. That means the *editorial* signal was positive, the *institutional* signal was negative. That changes the weighting.

  8.  **Final Polish:** Check tone. Ensure it sounds like it's written for an editor, not an economist. Use terms like "comp titles," "P&L," "board," "agent." Ensure the 20-minute constraint is respected (the tool can't be too complex).

  9.  **Final Review against Prompt:**
      *   Decision procedure? Yes.
      *   20 minutes? Yes.
      *   Grounded in cascade literature? Yes (signal vs. noise, fragility, externalities).
      *   Publishing translation? Yes.
      *   Three cases run? Yes.
      *   Limitations flagged? Yes.
      *   Theory vs. Practice tension? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sharp diagnosis. You are describing a classic **Information Cascade**, specifically the Bikhchandani-Hirshleifer-Welch model, but applied to a market where the "asset" (the book) is experience goods (value unknown until consumed) and the "investors" (editors) are under time pressure.

  In the literature, a cascade occurs when it becomes optimal for an individual to ignore their private information (their read of the manuscript) and follow the actions of those who acted before them. This is rational: if three people passed, the probability that the book is bad increases, eventually outweighing your own positive read. The problem, as you noted, is that cascades are **fragile** (a little new info breaks them) and **path-dependent** (if the first two readers had a bad morning, the book dies).

  Here is a decision procedure designed for a 20-minute window. It forces you to quantify the *quality* of the public signal versus the *precision* of your private signal.

  ### The "Cascade Weighting" Protocol (20 Minutes)

  Do not start by reading the manuscript. Start by mapping the information landscape.

  **Step 1: Audit the Public Signal (5 Minutes)**
  *Goal: Determine if the herd's action is based on information or imitation.*

  *   **The Source Weight:** Who passed/bid?
      *   *High Weight:* A house with a dominant list in this specific category (e.g., Tor passing on a space opera). Their private signal is more precise than yours in this niche.
      *   *Low Weight:* A generalist house or one known to be restructuring/changing editorial direction. Their pass is noise.
  *   **The Timing Weight:** When did they pass?
      *   *Pre-Event:* Passes before major markets (Frankfurt/London Book Fair) suggest a fundamental quality or P&L issue.
      *   *Post-Event:* Passes after a book fails to sell rights internationally suggest a market validation failure (harder signal).
      *   *Simultaneous:* If 5 houses passed on the same Tuesday, they likely all got it the same week. This is a **Independent Signal Cluster** (strong evidence). If they passed over 3 months, the later ones might be cascading off the rumors of the first ones (weak evidence).
  *   **The Reason Code:**
      *   *Hard Pass:* "P&L doesn't work," "Too similar to X," "Author platform too small." (Reveals specific data).
      *   *Soft Pass:* "Didn't fall in love," "Not quite right for us." (Reveals nothing but risk aversion).
      *   *Constraint Pass:* "Loved it, board said no." (Reveals positive private signal, negative institutional constraint).

  **Step 2: Calibrate Your Private Signal (5 Minutes)**
  *Goal: Assess the precision of your own read, acknowledging your biases.*

  *   **The "Blind" Test:** If you strip away the knowledge of who else passed/bid, how strong is your conviction?
      *   *Scale 1-5:* 1 (Meh) to 5 (Must Have).
      *   *Adjustment:* If you know it's an auction, subtract 1 point (arousal bias). If you know everyone passed, add 1 point (contrarian bias). Use the *adjusted* score.
  *   **The Unique Information Check:** Do you have information the herd *does not* have?
      *   Do you know the author personally?
      *   Do you have a specific marketing channel they don't?
      *   Is there a comp title that just exploded that the earlier editors couldn't have known about?
      *   *If No:* Your private signal is correlated with the herd's. You are not adding new info; you are just another data point.

  **Step 3: The Fragility Test (5 Minutes)**
  *Goal: Determine if the cascade is breakable.*

  *   **Ask:** "What specific piece of information would change the mind of the houses that passed?"
      *   If the answer is "A lower advance," the cascade is financial, not qualitative.
      *   If the answer is "Nothing, they hated the prose," the cascade is qualitative.
      *   If the answer is "If they knew [X] about the author," you have an arbitrage opportunity.
  *   **The "First Mover" Check:** Look at the *first* house that passed.
      *   Cascades rely on early movers being influential. Was the first pass from a market leader? If the first pass was from a house that doesn't publish this genre, the cascade is built on sand. Ignore it.

  **Step 4: The Decision Rule (5 Minutes)**
  *   **Scenario A (Herd No / Gut Yes):** Acquire **ONLY IF** Step 1 reveals "Constraint Passes" or "Low Source Weight" AND Step 2 reveals "Unique Information." Otherwise, the cascade is likely rational (the book has a flaw you're missing).
  *   **Scenario B (Herd Yes / Gut Yes):** Bid **ONLY IF** your P&L works without assuming you can outperform the other bidders' marketing. If you are bidding because "it's hot," you are the liquidity exit for the agent, not the publisher.
  *   **Scenario C (Herd Silence / Gut Yes):** This is the **Innovation Zone**. The literature suggests you should trust your private signal here because there is no public signal to override it. However, you must apply a "Risk Discount" to your advance offer because you lack validation.

  ---

  ### Running the Cases

  #### Case 1: The Passed Literary Novel
  *Situation:* 5 big houses passed. 2 trusted colleagues say "Best thing I read, board said no."

  *   **Step 1 (Public Signal):** The "Pass" is revealed to be a **Constraint Pass**, not a Quality Pass. In cascade terms, the public action (Pass) does not match the private signal (Love). The information content of the pass is "This is commercially risky," not "This is bad."
  *   **Step 2 (Private Signal):** Your colleagues' validation boosts your private signal precision. You aren't alone in your taste; you are part of a silenced minority.
  *   **Step 3 (Fragility):** Highly fragile. The cascade is based on P&L fear, not text quality. If you can structure a deal with lower risk (lower advance, higher royalty), you break the cascade.
  *   **Verdict:** **ACQUIRE.**
  *   **Why:** The literature says cascades form when private signals are ambiguous. Here, the private signals are *positive* but the public actions are *negative* due to external constraints. This is not a true information cascade; it's a market failure. You are arbitraging the difference between editorial value and corporate risk tolerance.
  *   **The Trap:** Do not pay a "hot book" advance. Pay a "risk-managed" advance. The herd is right about the *money*, wrong about the *art*.

  #### Case 2: The Commercial Thriller Auction
  *Situation:* 2 genre-heavy houses in at six figures. You want it.

  *   **Step 1 (Public Signal):** High Source Weight (they publish this stuff). High Timing Weight (simultaneous bids). This is a **Strong Public Signal**.
  *   **Step 2 (Private Signal):** You want it. But do you have Unique Information? Probably not. If two experts bid, your read is likely correlated with theirs.
  *   **Step 3 (Fragility):** Low fragility. These houses put money down. Money is a louder signal than words. To break this, you'd need to know something they don't (e.g., film rights are already sold, which changes the value).
  *   **Verdict:** **PASS (or bid strictly to P&L).**
  *   **Why:** You are Bidder #3. In cascade models, Bidder #3 adds no information; they just increase the price. Unless you have a specific distribution advantage (Unique Info), you are suffering from the **Winner's Curse**. If you win, it's likely because the first two bidders knew something you didn't (e.g., they saw the P&L and stopped).
  *   **The Hard Truth:** If your gut says "I need this for my list prestige," acknowledge that is a marketing cost, not an acquisition value. Bid only what *your* P&L supports, not what it takes to win.

  #### Case 3: The Lone Wolf Weird Book
  *Situation:* You love it. Nobody else has mentioned it. No auction.

  *   **Step 1 (Public Signal):** Absent. Silence is not a pass. It means the book hasn't entered the cascade yet.
  *   **Step 2 (Private Signal):** High conviction. But Step 2 asks: Is your signal precise? Or are you just weirdly aligned with the author?
  *   **Step 3 (Fragility):** N/A. There is no cascade to break.
  *   **Verdict:** **ACQUIRE (with caution).**
  *   **Why:** Herding literature suggests that when public information is absent, you *must* rely on private signals. This is how new trends start. However, the "Uncomfortable Truth" here is that without corroboration, the variance on this outcome is massive. It will either be a cult hit or a total flop.
  *   **The Procedure's Command:** You must treat this as a **Venture Capital bet**. Do not bet the company. Offer a standard deal, not an aggressive one. You are paying for the *option* that you are right and the market is blind.
  *   **The Tension:** Theory says "wait for more info." Publishing says "if you wait, the agent will submit elsewhere and you'll look slow." You have to act on incomplete data.

  ---

  ### Limitations & Tensions (The "Fine Print")

  **1. The "Rational Actor" Fallacy**
  The literature assumes the editors who passed before you were rational Bayesian updaters. In publishing, they might have been tired, going through a hiring freeze, or just hated the font. The procedure assumes the "Pass" contains information. Sometimes a Pass is just noise.
  *   *Judgment Call:* Step 1 requires you to guess the mental state of your competitors. You will often be wrong.

  **2. The Time Horizon Mismatch**
  Information cascades resolve over time as more data enters the system. Publishing auctions resolve in 48 hours.
  *   *Tension:* The procedure recommends waiting to see if the "Constraint Passes" in Case 1 become "Quality Passes." You don't have time. You must assume the constraint is permanent.

  **3. The "Values Call" Override**
  The procedure cannot measure **Mission**.
  *   *Where to ignore the procedure:* If your imprint's mission is to publish voices the market ignores (Case 3), the herd signal is irrelevant by definition. The procedure is for *commercial* sustainability, not *mission* fulfillment. If you are buying for mission, acknowledge you are subsidizing the book, not investing in it.

  **4. Signaling to Agents**
  Sometimes you must bid in an auction (Case 2) not to win, but to signal to the agent that you are a player.
  *   *Tension:* Economically irrational, professionally necessary. The procedure will tell you to pass. Your career might tell you to bid. Mark this explicitly as "Relationship Maintenance Cost" in your P&L.

  ### Summary Checklist for Your 20 Minutes

  1.  **Is the Herd's "No" based on Quality or Constraints?** (If Constraints, ignore the herd).
  2.  **Is the Herd's "Yes" based on Data or Hype?** (If Hype, trust your P&L, not the room).
  3.  **Do I have Unique Information?** (If No, you are a follower. Price accordingly).
  4.  **Is this a Mission Book?** (If Yes, throw out the herd analysis).

  If you run this, you won't stop the cascades, but you will stop *participating* in them blindly. You'll know when you're investing and when you're just copying.
