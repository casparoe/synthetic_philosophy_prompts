answer: |-
  Here is an analysis of your verdicts, a proposed principle, and an honest assessment of where that principle strains against your intuitions.

  ### 1. The Proposed Principle

  There is no single, frictionless philosophical account that captures every nuance of supererogation (the technical term for "above and beyond"). However, your verdicts point strongly toward a hybrid account that combines **optionality** with **significant cost**.

  I propose you adopt the **Principle of Discretionary Significant Sacrifice**.

  **The Criteria:**
  An action (or sustained pattern of action) qualifies as "Above and Beyond" if and only if it meets three conditions:
  1.  **Beneficence:** It produces a significant good for others or the institution.
  2.  **Cost:** It imposes a significant cost, risk, or burden on the agent (financial, physical, or opportunity cost).
  3.  **Discretion:** It is not mandated by the agent's **role obligations** (job description), **special relational duties** (family), or **prior specific commitments** (pledges/contracts).

  **Why this fits your core verdicts:**
  *   **Kidney to Stranger:** Qualifies. High benefit, high cost, no prior duty (Discretion met).
  *   **Lifeguard:** Disqualifies. High benefit, high cost, but **Role Obligation** negates Discretion.
  *   **Pledged Kidney to Brother:** Disqualifies. High benefit, high cost, but **Relational Duty + Prior Commitment** negates Discretion.
  *   **20-Year Donor:** Qualifies. High aggregate cost/benefit. While a single year might seem low-cost, the *pattern* represents a sustained discretionary burden.

  ### 2. The "Act vs. Life" Problem (The 20-Year Donor)

  You asked whether your treatment of the twenty-year donor forces a choice between treating supererogation as a property of acts or of lives.

  **The Verdict:** It forces you to treat it as a property of **courses of conduct**, not just isolated acts.

  If you define "Above and Beyond" strictly as a property of singular *acts*, the 20-year donor collapses. In any given year, donating 10% might be "nice," but not heroic. If you judge her year-by-year, she never wins. If you judge her career as a whole, she is a paradigm of the award.

  **Implication for your Criteria:**
  You must explicitly write into your criteria that the committee may evaluate **sustained patterns of behavior** over time. A series of discretionary acts, individually modest but collectively burdensome, constitutes a single "Above and Beyond" contribution. This prevents the award from favoring only "moral spikes" (one-off heroes) over "moral endurance" (consistent virtue).

  ### 3. Honest Limitations: Where the Principle Fails

  You asked me to state honestly which verdicts this principle cannot accommodate. The Principle of Discretionary Significant Sacrifice is robust, but it leaves two of your cases unresolved or in tension with your instincts.

  #### A. The Promotion Motive (The Mixed-Motive Case)
  *The Case:* A colleague performs an enormous, unrequired sacrifice but admits doing it partly to look good for promotion.
  *Your Instinct:* Torn.
  *The Principle's Verdict:* **Qualifies.**

  **Why:** The principle focuses on the *act* (Cost + Benefit + Discretion). It is agnostic about motive. Philosophically, this is the "Act Supererogation" view: if the act is objectively costly and optional, it counts, regardless of whether the agent was seeking glory.

  **The Conflict:** Your hesitation suggests you lean toward a "Virtue Ethics" view, where the *praiseworthiness* depends on the character behind the act. If the act was a calculated investment for promotion, is it really a sacrifice? Or was the cost just a purchase price for status?

  **Recommendation:** You cannot have it both ways without making the criteria unworkable (probing motives is invasive and subjective). I recommend you **stick to the Act view** for the criteria, but add a **tie-breaking clause**. If two candidates are equally qualified by the metrics, the one with purer motive prevails. But do not disqualify the promotion-seeker outright; the department still benefits from the sacrifice regardless of the motive.

  #### B. The "Couldn't Live With Myself" Case (Psychological Necessity)
  *The Case:* A colleague did something enormously costly and unrequired, but said she *had* to do it to maintain her self-concept.
  *Your Instinct:* Going back and forth.
  *The Principle's Verdict:* **Qualifies (but barely).**

  **Why:** Objectively, the act was discretionary (no one else would have blamed her for not doing it). The cost was real. Therefore, it meets the criteria.

  **The Philosophical Tension:** This is the hardest case in moral philosophy. Supererogation typically requires **freedom**. If she *couldn't* have done otherwise (due to internal psychological compulsion), was she truly free? If she wasn't free, can she be praised?
  *   **View 1 (No Award):** She didn't "go beyond"; she merely followed her internal programming. It wasn't a choice; it was a necessity of her psychology.
  *   **View 2 (Award):** The "necessity" was self-imposed through prior character building. She cultivated a self for whom this action was necessary. We are praising the *character* that made the right action feel obligatory.

  **Recommendation:** You should **Award this case.** Why? Because the "Above and Beyond" award is not just about rewarding free choices; it is about **incentivizing and recognizing behavior that benefits the community.** Whether she did it because she was free or because her conscience left her no choice, the department benefits from the sacrifice, and the behavior is worth modeling. To disqualify her because her conscience is *too* sensitive would be to penalize deep virtue.

  ### 4. Summary for Your Committee Charter

  To make this actionable for next year, I suggest drafting your criteria as follows:

  > **Eligibility Criteria:**
  > Nominations must demonstrate a contribution that is **Beneficial**, **Costly**, and **Discretionary**.
  >
  > 1.  **Beneficial:** The action clearly advanced the welfare of others or the mission of the department.
  > 2.  **Costly:** The action involved significant personal risk, financial expense, or time commitment beyond normal expectations.
  > 3.  **Discretionary:** The action was not required by the nominee's job description, legal obligations, family duties, or prior specific commitments (e.g., signed pledges).
  >
  > **Evaluation Notes:**
  > *   **Sustained Conduct:** The Committee may consider sustained patterns of behavior over time, where a series of individually modest acts constitutes a significant cumulative sacrifice.
  > *   **Motivation:** While the primary focus is on the impact and cost of the action, the Committee may consider the nominee's stated motivations as a secondary factor when distinguishing between equally qualified candidates.
  > *   **Internal Compulsion:** Actions taken due to strong personal moral conviction qualify, even if the nominee felt internally compelled to act, provided no external obligation existed.

  ### Final Word
  You will not find a principle that makes every decision easy. The "Promotion" case will always feel murky because it touches on the difference between *doing good* and *being good*. By codifying the **Discretionary Significant Sacrifice** principle, you protect the committee from having to psychoanalyze candidates while ensuring that role-obligated work (like the Lifeguard) doesn't get confused with genuine generosity.

  Accept that the "Couldn't live with myself" candidate and the "Promotion" candidate create friction. That friction is not a bug in your system; it is a feature of the moral landscape. Use the tie-breaker clause to manage it.
