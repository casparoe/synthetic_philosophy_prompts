      *   *Refining the "Insufficiency" argument:* Care ethics critiques Stevens for *inauthentic* caring. Justice ethics critiques Stevens for *immoral* outcomes. You need both.
      *   *Specific Care Ethicist References:* Nel Noddings (engrossment), Joan Tronto (power/politics of care), Sara Ruddick (maternal thinking vs. professional duty).

  6.  **Self-Correction/Refinement during drafting:**
