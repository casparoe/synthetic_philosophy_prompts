prompt: |-
  My brother-in-law thinks convention-based obligations are all fake, and he ambushed me with an argument over Thanksgiving that I can't quite demolish even though I'm pretty sure it's wrong somewhere. It goes:

  (1) The content of a convention is arbitrary: 15% vs 20%, driving on the right vs the left, first-come-first-served vs take-a-number — any of these would coordinate about as well as any other, so there was never a reason to pick the one we picked.
  (2) You can't be obligated to do something when every alternative open to you would have done just as well. Being under an obligation means having a reason that rules something out, and where the options are all on a par, nothing gets ruled out.
  (3) So nobody is ever obligated to comply with a convention as such. (You might be obligated for independent reasons — don't steal the waiter's wallet — but the convention itself generates nothing.)
  (4) So nobody is obligated to tip or stand in line, and a visitor has no obligation at all to learn the local stuff when traveling, which he was very pleased about since he travels constantly and hates tipping.

  When I pushed back that this would swallow promising too, he said fine, and laid out the parallel himself: (5) which noises or marks count as a promise is just as arbitrary as the tipping percentage — another country, another era, a completely different formula does the binding. (6) So by his own steps nobody is obligated to keep a promise, and he says he'll happily bite that bullet (promising is just a habit policed by reputation, nothing more). But when I extended it to money — what counts as a dollar, what a debt even is, convention all the way down — he started squirming, because now it looks like nobody owes anybody anything, ever. And honestly I squirmed too, because I can't see what, inside his argument, distinguishes promising from any other convention.

  I want to reject something between (1) and (4), but whenever I try, he says the convention itself can't be the thing that makes the difference, because the convention is exactly what's authority is in question — pointing at the rule to justify the rule. Is that move actually as airtight as he thinks it is? Where does the argument go wrong (assuming it does)? Which step should I reject, and what does rejecting it cost me? For what its worth I'd like to keep (2) if possible, since it also blocks a couple of other arguments I like, but tell me honestly if that's the one that has to go.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Opponent:** Brother-in-law (BIL).
      *   **BIL's Argument:** Convention-based obligations are fake.
          *   (1) Content of convention is arbitrary (coordination problems have multiple equilibria).
          *   (2) Obligation requires ruling out alternatives; if alternatives are on a par, nothing is ruled out.
          *   (3) Therefore, no obligation to comply with convention *as such*.
          *   (4) Therefore, no obligation to tip, queue, learn local customs, keep promises, or repay debts.
      *   **BIL's Stance:** Willing to bite the bullet on promising (it's just reputation), but squirms on money/debt.
      *   **User's Goal:** Reject a step between (1) and (4). Wants to keep premise (2) if possible (finds it useful elsewhere). Needs to know where the argument fails and what the cost of rejection is.
      *   **Key Question:** Is the move "pointing at the rule to justify the rule" circular? Where does the argument go wrong?

  2.  **Deconstruct the BIL's Argument:**
      *   *Premise 1 (Arbitrariness):* Conventions solve coordination problems. Multiple solutions exist (drive left vs. right). The specific choice is arbitrary *ex ante*.
      *   *Premise 2 (The Normative Gap):* Obligation requires a normative reason to prefer $X$ over $Y$. If $X$ and $Y$ are functionally equivalent (on a par), there is no reason to prefer $X$. Therefore, no obligation.
      *   *Conclusion:* Conventions generate no obligations.

  3.  **Evaluate Premise 1 (Arbitrariness):**
      *   Is it true? Yes, largely. David Lewis's *Convention* defines conventions as regularities in behavior where alternatives *could* have worked.
      *   Does arbitrariness kill obligation? Not necessarily. The *selection* is arbitrary, but the *need to select* is not.
      *   *Potential Attack:* Distinguish between the *content* being arbitrary and the *fact* of coordination being necessary.

  4.  **Evaluate Premise 2 (The Normative Gap):**
      *   "You can't be obligated to do something when every alternative open to you would have done just as well."
      *   This is the crux. It sounds plausible (Buridan's Ass), but it ignores *second-order reasons*.
      *   *Key Insight:* Once a convention is *established*, the alternatives are no longer "on a par." Driving left is now *dangerous* and *disruptive*, whereas driving right is *safe* and *cooperative*. The arbitrariness is historical, not current.
      *   *Philosophical Concept:* Hume's convention, Lewis's coordination, Raz's exclusionary reasons, Gilbert's joint commitment.
      *   *The "On a Par" Claim:* This is false *ex post*. Before the convention, Left = Right. After the convention, Right = Coordination, Left = Chaos. They are not on a par anymore.

  5.  **Evaluate the "Circularity" Charge:**
      *   BIL says: "Pointing at the rule to justify the rule."
      *   Counter: We aren't pointing at the rule to justify the rule. We are pointing at the *expectations and reliance* generated by the rule to justify the obligation.
      *   It's not $Rule \rightarrow Obligation$. It's $Rule \rightarrow Expectations/Reliance \rightarrow Harm/Benefit \rightarrow Obligation$.

  6.  **Develop the Counter-Argument (Targeting Premise 2):**
      *   The BIL conflates *arbitrariness in origin* with *equivalence in outcome*.
      *   Premise (2) is the weak link. It assumes the "alternatives open to you" are still "on a par."
      *   Once a convention exists, complying and defecting are *not* on a par.
      *   *Cost of Rejecting (2):* You admit that obligations can arise from social facts/expectations, not just moral absolutes. (User wants to keep (2), but I suspect (2) is the error).
      *   *Wait, can we keep (2)?* If (2) says "If alternatives are on a par, no obligation," we can keep (2) *if* we show the alternatives are *not* on a par.
      *   *Strategy:* Attack the application of (2), not (2) itself. Show that BIL misdescribes the situation. The alternatives are *not* on a par once the convention is live.

  7.  **Develop the Counter-Argument (Targeting Premise 1/3 Link):**
      *   Even if the content is arbitrary, the *obligation* comes from the *reliance* of others.
      *   This is the Humean/Contractualist move. If I benefit from a system of rules, I owe compliance (fairness).
      *   Or: If others rely on me, defecting harms them (harm principle).

  8.  **Address the "Promising/Money" Extension:**
      *   BIL bites the bullet on promising (reputation only).
      *   Squirms on money. Why? Because money involves *debt*, which feels like real obligation.
      *   The distinction: Money isn't just a convention; it's a constitutive rule of an institution (Searle). But even so, the obligation to repay is based on reliance/expectation.
      *   If promising is fake, money is fake. BIL is inconsistent or just pragmatic.

  9.  **Structure the Response:**
      *   **Validate:** Acknowledge the strength of the argument (it's a classic philosophical puzzle, akin to Hume/Lewis).
      *   **Diagnose:** The error is in Premise (2)'s *application*, specifically the claim that alternatives remain "on a par" *after* the convention is established.
      *   **The "Ex Post" Non-Arbitrariness:** Explain how coordination transforms the payoff structure. Driving left is no longer equivalent to driving right once everyone else drives right.
      *   **The Source of Obligation:** It's not the rule itself, but the *expectations* and *reliance* the rule creates. (Avoid circularity).
      *   **Keeping Premise (2):** Show how to keep (2) by redefining "on a par."
      *   **The Cost:** Acknowledge that this grounds obligation in social facts/harm rather than metaphysical duty.
      *   **The Money/Promise Distinction:** Explain why BIL squirms (institutional facts vs. brute facts) and why his consistency is the only way to hold the line.

  10. **Refine the Argument (Self-Correction/Nuance):**
      *   *Wait, is (2) actually true?* "You can't be obligated to do something when every alternative open to you would have done just as well."
      *   If I have a choice between Brand A water and Brand B water (identical), am I obligated to pick A? No.
      *   But in conventions, the choice isn't between "Tip 15%" and "Tip 20%" in a vacuum. It's between "Tip 15%" (comply) and "Tip 0%" (defect).
      *   The BIL argues: "Tip 15% vs Tip 20% are arbitrary, so Tip 15% isn't obligatory."
      *   Counter: The obligation isn't to tip 15% *specifically* because 15% is magic. It's to tip 15% *because that is the focal point*. Deviating to 0% breaks coordination. Deviating to 20% might be okay (supererogatory), but deviating to 0% is the problem.
      *   Actually, the BIL's argument is stronger: He says the obligation to follow *the convention* (whatever it is) doesn't exist.
      *   So, is there an obligation to coordinate? Yes, usually based on fairness or harm.
      *   *Key Distinction:* The obligation to *coordinate* vs. the obligation to *this specific coordinate*.
      *   The obligation to *this specific coordinate* derives from the obligation to *coordinate* + the fact that *this is the coordinate*.
      *   This avoids circularity. $O(Do X)$ because $O(Coordinate)$ and $X = Coordinate$.
      *   This preserves (2). $X$ and $Y$ (Left/Right) were on a par. But now $X$ (Right) and $Not-X$ (Left) are *not* on a par because $Not-X$ violates $O(Coordinate)$.

  11. **Final Polish:**
      *   Make it conversational but rigorous.
      *   Give the user specific talking points for Thanksgiving 2.0.
      *   Address the "circularity" charge directly.
      *   Address the money/promising inconsistency.

  12. **Check against constraints:**
      *   User wants to keep (2) if possible.
      *   User wants to know where it goes wrong.
      *   User wants to know the cost.

      *Decision:* The error is in the move from (1) to (2). Specifically, the claim that alternatives remain "on a par" *after* the convention is established. You can keep the *text* of (2) but must reject the BIL's *application* of it. The alternatives are no longer on a par.

      *Wait, one nuance:* BIL says "nobody is ever obligated to comply with a convention *as such*."
      If I say "You are obligated because others rely on you," is that "complying with the convention as such"?
      No, it's complying with a moral principle (do not harm/rely) *via* the convention.
      So (3) is false. You are obligated to comply, but the *source* is moral (reliance), not conventional. The convention is the *mechanism*, not the *source*.
      This distinguishes the "rule justifying the rule" circularity. The rule doesn't justify the rule; the *consequences of the rule* justify the obligation.

      *Let's draft the response.*
      *   Intro: Validate the argument (it's Lewis/Hume).
      *   The Pivot: Attack the "On a Par" claim in (2).
      *   The Mechanism: Reliance/Expectation.
      *   The Circularity: It's not circular because the justification is external (harm/fairness).
      *   The Cost: Obligation is contingent on social facts, not absolute.
      *   The Money/Promise: BIL is inconsistent. Money relies on the same structure.
      *   Conclusion: How to talk to him.

      *(Self-Correction)*: I need to be careful about Premise 2.
      Premise 2: "You can't be obligated to do something when every alternative open to you would have done just as well."
      If I reject the *application* (i.e., alternatives are NOT on a par), I keep Premise 2.
      If I reject the *principle* (i.e., even if on a par, you can be obligated), I lose Premise 2.
      User wants to keep (2). So I must argue the alternatives are *not* on a par.
      Why? Because of *reliance*.
      Okay, that works.

      *Wait, what about the "Convention as such" claim (3)?*
      BIL says: "Convention itself generates nothing."
      Counter: The convention generates *expectations*. Expectations generate *obligations* (via harm/fairness). So the convention is a necessary causal link, even if not the normative ground.
      This allows us to say "Yes, you are obligated to follow the convention," without saying "The convention is magic."

      *Okay, ready to write.*
answer: |-
  This is a sophisticated argument. Your brother-in-law (BIL) has essentially reconstructed David Lewis's account of convention (*Convention: A Philosophical Study*, 1969) and combined it with a skeptical challenge about normativity that Hume would recognize. It's a "coordination problem" argument pushed to a nihilistic conclusion.

  The argument feels airtight because it exploits a gap between **arbitrariness** (the content of the rule) and **normativity** (the force of the rule). However, it is not airtight. It relies on a subtle equivocation in Premise (2) regarding what counts as "on a par."

  You can defeat this argument while keeping Premise (2). In fact, keeping (2) is the key to winning. Here is where the argument breaks, how to explain it without circularity, and what it costs you.

  ### 1. The Diagnosis: The "Ex Post" Error
  The fatal flaw is in the move from (1) to (2). BIL argues that because the choice of convention was arbitrary *ex ante* (beforehand), the options remain "on a par" *ex post* (afterwards).

  **Premise (2) says:** "You can't be obligated to do something when every alternative open to you would have done just as well."

  **The Counter:** Once a convention is established, the alternatives **no longer do just as well.** They are not on a par.

  *   **Ex Ante:** Driving Left vs. Driving Right. Both are safe *if everyone does them*. They are on a par.
  *   **Ex Post:** Everyone is Driving Right. Now, Driving Right = Coordination/Safety. Driving Left = Crash/Chaos.

  They are no longer functionally equivalent. The arbitrariness is historical; the obligation is current. By claiming the options are still "on a par," BIL is ignoring the **reliance and expectations** that the convention has created in the interim.

  ### 2. Solving the Circularity Charge
  BIL's strongest defensive move is claiming you are "pointing at the rule to justify the rule." He thinks your argument looks like this:
  *   *Why must I drive on the right?* Because it's the rule.
  *   *Why is it the rule?* Because it's the rule.

  That *would* be circular. But that isn't how conventional obligations work. The justification is not the rule itself; it is the **harm or unfairness caused by violating the expectations the rule created.**

  The structure is actually:
  1.  **Moral Principle:** You ought not to harm others who are reasonably relying on you (or: You ought to do your fair share in a cooperative scheme).
  2.  **Social Fact:** A convention exists (e.g., tipping 20%), creating reasonable expectations of reliance.
  3.  **Conclusion:** You ought to tip 20%, because violating that expectation harms the waiter (who budgeted on that income) or free-rides on the system.

  The convention doesn't generate the obligation *out of thin air*; it generates the **factual conditions** (expectations/reliance) that trigger a pre-existing moral obligation (do not harm/do your fair share).

  This avoids circularity. You aren't using the convention to justify the convention; you are using the *consequences of the convention* to justify compliance with it.

  ### 3. How to Keep Premise (2)
  You said you'd like to keep (2). You can, provided you force BIL to admit that the alternatives are not "on a par" once the convention is live.

  **The Dialogue:**
  > **You:** "I accept your Premise (2). If two options are truly on a par, there is no obligation to pick one. But you are claiming that complying with a convention and defecting from it are 'on a par.' They aren't."
  >
  > **BIL:** "Why not? 15% and 20% are arbitrary."
  >
  > **You:** "The *percentage* is arbitrary. The *compliance* is not. If I tip 0% while everyone else tips 20%, I am benefiting from a service economy I refuse to support. I am making myself an exception. That is not 'on a par' with tipping 20%. One sustains the system; the other exploits it."
  >
  > **BIL:** "But the system is fake."
  >
  > **You:** "The *specific number* is fake. The *system of reliance* is real. The waiter relies on that money. Premise (2) only applies if the outcome is the same. The outcome for the waiter is not the same."

  By doing this, you preserve (2) but show that BIL misapplies it. The obligation exists because the *defection* is worse than the *compliance*, not because the *content* is sacred.

  ### 4. The Money and Promising Trap
  BIL squirmed at the money example because he intuitively knows that "debt" feels different than "tipping," but his argument treats them identically.

  *   **Promising:** When I promise, I create an expectation in you. If I break it, I harm your ability to plan.
  *   **Money:** When I borrow $100, I create an expectation of repayment. If I don't repay, I harm the lender and destabilize the system of credit.

  If BIL bites the bullet on promising (saying it's just reputation), he must logically accept that **contracts are unenforceable in principle**, only in practice. If he squirms on money, he is admitting that **reliance creates obligation.**

  If reliance creates obligation for money, it creates obligation for tipping. You can trap him here:
  > "If I borrow $10 from you based on a verbal promise, and I don't pay you back, have I wronged you? If yes, then conventions (like language and currency) create obligations via reliance. If no, then I can take your wallet right now and claim I'm just rejecting the 'convention' of property."

  ### 5. What Does This Cost You?
  You asked what rejecting this argument costs you. It's important to be honest here.

  1.  **Obligations become Contingent:** You have to admit that conventional obligations are not "eternal truths." If the convention changes (e.g., tipping is abolished and replaced by living wages), the obligation vanishes. You cannot say "Tipping is morally required in itself," only "Tipping is required *given that* we are in this specific system."
  2.  **The "Fairness" Burden:** You ground the obligation in fairness or harm. This means if you can tip without harming anyone (e.g., a rich owner who doesn't need it, in a culture where tipping is weird), the obligation might weaken. You lose the "absolutist" high ground but gain a more nuanced, contextual ethics.
  3.  **No "Magic" Rules:** You cannot claim the rule itself has authority. You always have to point to the human cost of breaking it. This makes ethics harder work, but more honest.

  ### 6. Summary of the Counter-Attack
  Here is your roadmap for the next ambush:

  1.  **Grant (1):** Yes, the content is arbitrary (15% vs 20%).
  2.  **Grant (2):** Yes, if options are on a par, there is no obligation.
  3.  **Deny the Application:** Reject the claim that complying and defecting are "on a par" *after* the convention is established. They are not, because others are now relying on you.
  4.  **Reject (3):** The convention *does* generate obligation, but indirectly, by creating reliance which triggers moral duties (non-harm/fairness).
  5.  **Expose the Inconsistency:** Force him to choose between "Money is fake" and "Tipping is real." He cannot have both.

  **The One-Liner:**
  "Arbitrariness in the *selection* of the rule doesn't mean arbitrariness in the *consequences* of breaking it. Once everyone else has coordinated, your choice to defect isn't 'on a par' with compliance; it's a betrayal of their reliance."

  This keeps your Premise (2), avoids circularity, and explains why he squirmed about money.
