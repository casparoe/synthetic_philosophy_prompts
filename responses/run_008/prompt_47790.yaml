          *   Argument: Pride requires cognitive content (I achieved X according to standard Y). A pure bodily feeling doesn't capture the *aboutness* (intentionality) of pride. Somatic theorists try to explain this via "somatosensory maps," but saying they "don't count" is controversial.
      *   **Claim 3: Emotion/Cognition Separation & Disembodiment.**
          *   Analysis: This is the "Modularity" claim.
          *   Counter: Many philosophers argue for "Perceptual Theories of Emotion" where emotions *are* a type of valuation (cognition).
          *   Disembodiment: Functionalism vs. Biological Naturalism. If the *pattern* exists, does the substrate matter?
      *   **Claim 4: Facial Feedback vs. Appraisal.**
