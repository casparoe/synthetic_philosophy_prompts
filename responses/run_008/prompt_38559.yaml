answer: |-
  Hi there,

  Your intuition is spot on, and you are right to be alarmed by where your friend's reasoning leads. The argument you've outlined is a classic philosophical puzzle that touches on the nature of art, value, and identity, and while it feels airtight at first glance, it relies on a subtle but critical confusion in the first premise. The broken step is Premise 1, the claim that aesthetic value must supervene only on what an informed viewer could pick out by examining the work. This premise assumes a strictly formalist view of art, meaning it treats the artwork as nothing more than the sum of its sensory properties. While this is a coherent position to hold, it is demonstrably false when tested against the very examples your friend uses to support it, and rejecting it is the only way to avoid the absurd conclusions about monkeys, mothers, and signatures.

  The confusion lies in the phrase "pick-outable property," which is doing sneaky double duty throughout the argument. If by "pick-outable" your friend means properties accessible through immediate sensory inspection—like color, shape, and texture—then Premise 1 is false because aesthetic value is not solely determined by sensory input. We know this because our experience of a work changes when we learn its history; knowing a painting is a forgery makes us look at it differently, perhaps searching for flaws or seeing the brushstrokes as imitations rather than expressions, which alters the aesthetic experience itself. If, on the other hand, "pick-outable" includes properties accessible through broader knowledge, such as provenance or scientific analysis, then Premise 2 is false because a perfect forgery does not match the original in those respects; we can pick out the difference in origin even if we can't see it with the naked eye. Your friend needs Premise 1 to be true in the narrow sensory sense to make the forgery seem identical, but needs it to be true in the broad sense to ignore the history, and this shift is where the logic collapses.

  You can see this collapse clearly in the extensions your friend proposes. In the case of the letter from your dead mother, the value is not aesthetic but sentimental, and it is constitutively historical. The value lies in the causal chain connecting the paper to your mother's hand; a perfect copy lacks that history, so it lacks the value, regardless of how identical it looks. Similarly, a signature on a contract is not valued for its ink pattern but for its function as a token of authorization, which requires a specific agent to produce it. A machine copy fails to bind you not because it looks different, but because it lacks the correct causal history. Your friend treats these as support for his view, but they are actually a reductio ad absurdum; they show that in almost every other domain of value, we recognize that history and origin matter. If we accept that sentimental and legal value depend on relational properties rather than intrinsic ones, there is no good reason to insist aesthetic value is the exception.

  Giving up Premise 1 does come with a cost, though it is a cost worth paying for a richer understanding of art. If you reject the idea that value supervenes only on sensory properties, you must accept that art is not a self-contained visual stimulus but a cultural and historical artifact. This means art criticism cannot rely solely on "looking"; it requires knowledge of context, intention, and history to fully grasp the work's value. It makes aesthetic judgment less immediate and objective in a purely physical sense, acknowledging that what we value in art is often the human achievement behind it, not just the pattern it leaves on the canvas. By holding onto Premise 1, your friend preserves a neat, clean definition of art but at the expense of denying why we care about art in the first place. You are right to reject the conclusion, and the break is firmly at the first step, where the argument assumes that what a thing is matters less than what it looks like.

  Best,

  [Your Name]
