answer: |-
  **Title:** The Overfitting Objection: Predictive Economy and the Autonomy of the Intentional Stance

  **Project Summary**
  Daniel Dennett's theory of "Real Patterns" posits that beliefs and desires are ontologically real insofar as adopting the Intentional Stance toward a system yields predictive economy. By treating an entity as a rational agent, we compress complex behavioral data into manageable laws. While this defends intentional realism against eliminativism, it relies on a criterion—predictive compression—that is arguably too permissive. A gambler's superstition, a conspiracy theorist's narrative, and pareidolic face-detection all offer subjective predictive compression and guide expectation, yet we intuitively classify them as spurious rather than real. This dissertation investigates the "Overfitting Objection": if predictive economy is the sole metric for real patternhood, the Intentional Stance cannot distinguish between genuine agency and epistemic vice.

  **The Research Question**
  The central question is whether the criterion for Real Patterns can be tightened without collapsing the autonomy of the Intentional Stance. Dennett rejects "further facts" about the inner state of the agent, insisting the pattern is in the eye of the beholder. However, if the "eye of the beholder" is susceptible to overfitting—finding structure in noise—then the ontology of the mental becomes unstable. I will investigate two possibilities: first, that Real Patternhood requires an additional constraint internal to the stance, such as robustness across independent observers or generalization to unseen cases; second, that filtering spurious patterns inevitably requires appeal to the Physical Stance. If the latter is true, the Intentional Stance is not autonomous, and Dennett's realism covertly relies on the physical reductionism he seeks to avoid.

  **Current Landscape and Limitations**
  Existing defenses of Dennett's position generally fall into three categories, all of which leave the Overfitting Objection open. Instrumentalist readings sidestep the ontology but contradict Dennett's explicit realism. Appeals to a hierarchy of stances (Physical, Design, Intentional) explain when we *switch* perspectives but do not provide a normative criterion for when an Intentional attribution is *veridical* versus merely useful to a deluded observer. Finally, Dennett's occasional appeals to "objective facts about patterns" gesture toward observer-independence but lack the rigorous formulation required to rule out systematic error. None of these approaches adequately address the structural similarity between legitimate intentional prediction and the compression achieved by conspiracy theories or gambling systems.

  **Methodology**
  This project employs conceptual analysis augmented by formal analogies from statistical learning theory. I will treat "predictive economy" not merely as a metaphor but as a structural claim subject to the bias-variance tradeoff. The method involves constructing comparison cases: pairs of systems where predictive compression is held constant, but intuitive patternhood varies (e.g., a chess computer vs. a random generator interpreted by a paranoid observer). I will test whether constraints like "cross-observer stability" or "counterfactual robustness" successfully filter the spurious cases without reintroducing the "further facts" Dennett bans.

  **Work Plan and Chapter Outline**
  *Year 1: Diagnosis and Formalization.*
  Chapter 1 will reconstruct Dennett's argument for Real Patterns, isolating the specific role of predictive compression. Chapter 2 will develop the Overfitting Objection rigorously, mapping the statistical concept of overfitting onto philosophical cases of superstition and conspiracy. The goal is to demonstrate that compression alone is insufficient for ontology.

  *Year 2: Testing Constraints.*
  Chapter 3 will evaluate internal constraints. I will test whether requiring generalization to novel stimuli distinguishes the chess player from the gambler. Chapter 4 will evaluate intersubjective robustness. Does a pattern count as real only if multiple observers converge on it? I will analyze whether this convergence is a matter of fact or merely shared bias.

  *Year 3: Implications for Autonomy.*
  Chapter 5 will assess the cost of these constraints. If filtering overfitting requires checking against the Physical Stance, I will argue that Intentional Realism loses its autonomy. The conclusion will determine whether a modified Dennettian realism is viable or if the project necessitates a return to a form of physicalist reduction.

  **Risk and Failure Conditions**
  This project faces a significant risk of negative results. It is possible that no internal constraint successfully distinguishes real patterns from overfitted ones without implicitly appealing to physical underpinnings. If the only way to rule out the conspiracy theorist is to show that their model fails to map onto the physical causal structure of the system, then the Intentional Stance is not ontologically fundamental, but merely heuristic. This would constitute a "successful failure": it would demonstrate that Dennett's middle path between hard realism and eliminativism is untenable. I will take this outcome as a definitive result, as establishing the collapse of the autonomy thesis is philosophically substantive. However, the project would fail if the distinction between "useful compression" and "real pattern" proves entirely ineffable, leaving the ontology of the mental without a principled boundary.
