answer: |-
  # Adversarial Collaboration: Expected Value, Fanaticism, and the Far Future

  **Authors:** Dev [The Unbounded View] & [User] [The Constrained View]
  **Date:** October 26, 2023
  **Status:** Draft for Review

  ## Preamble

  This document records the output of a four-hour adversarial collaboration regarding the normative implications of Expected Value (EV) maximization in longtermist contexts. Specifically, we address the tension between "Fanaticism" (the obligation to pursue astronomically high-value outcomes despite vanishingly small probabilities) and "Moderation" (the refusal to let such probabilities dominate decision-making).

  **Note on Terminology:** We acknowledge that the term "Fanaticism" carries negative rhetorical baggage. In this document, it is used strictly as a technical label for the position that *unbounded expected value dominates decision theory regardless of probability magnitude*. It is not intended to imply psychological instability or moral recklessness. Conversely, "Moderation" does not imply cowardice, but rather a constraint on the applicability of EV calculus under extreme uncertainty.

  We have drafted this text to be signable by both parties. Where we disagree, we have committed to precise formulations. Where we agree, we have committed to substantive claims, not platitudes.

  ---

  ## 1. Joint Assertions

  *We both endorse the following claims. Disagreement on any of these would invalidate the specific nature of our dispute.*

  1.  **The Structure of the Problem:** The core conflict is structurally identical to the St. Petersburg Paradox. It arises when a utility function is unbounded, allowing a sufficiently large payoff to outweigh a sufficiently small probability, mathematically dominating a certain, modest good.
  2.  **Definition of Fanaticism:** We define "EV Fanaticism" as the thesis that for any certain outcome $O_{certain}$ (e.g., saving $N$ lives), there exists a probabilistic outcome $O_{risk}$ (e.g., saving $M$ lives with probability $p$) such that if $p \times M > O_{certain}$, a rational agent is *obligated* to choose $O_{risk}$, regardless of how small $p$ becomes (provided $p > 0$).
  3.  **Impersonal Value:** We agree that the dispute is not about personal risk aversion regarding one's own welfare. We are discussing *impersonal* value (e.g., total flourishing lives). Therefore, standard diminishing marginal utility of wealth does not automatically resolve the dispute.
  4.  **Verbal vs. Substantive (Risk Aversion):** We agree that a portion of our debate regarding "risk aversion" is verbal. If "risk aversion" means "curvature in the utility function of personal welfare," it is irrelevant to impersonal totals. However, if "risk aversion" means "a structural penalty on variance in impersonal outcomes," it is a substantive normative claim. We classify the latter as a real disagreement, not a verbal one.
  5.  **Epistemic Humility:** We agree that real-world estimates of probabilities like $10^{-50}$ are derived from chains of reasoning susceptible to error. We disagree only on whether this epistemic fragility *normatively defeats* the mathematical expectation, or whether we should treat the mathematical expectation as an ideal we must approximate despite the noise.
  6.  **Temporal Provincialism:** We agree that privileging the near future simply because it is near is unjustified. Any rejection of Fanaticism must rely on probability or value bounds, not on temporal discounting.

  ---

  ## 2. Disagreements Table

  *The following table isolates our residual disagreements. Each statement is phrased such that the proponent accepts it as accurate, and the opponent accepts it as a fair characterization of the view they reject.*

  | ID | Topic | Position A (Dev / Unbounded) | Position B (User / Constrained) |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Normative Force of Tiny Probabilities** | A non-zero probability, no matter how small ($10^{-50}$), retains full normative weight when multiplied by a sufficiently large value. To ignore it is to violate the axioms of rational choice. | Probabilities below a certain epistemic threshold function as zero. When an estimate relies on too many conjunctive assumptions, the "probability of the model being wrong" swamps the "probability of the event." |
  | **D2** | **Boundedness of Value** | An unbounded utility function is required for coherence. Bounding value implies there is some amount of flourishing so large that adding more makes no difference, which is axiologically absurd. | A bounded utility function is required for sanity. Without bounds, decision theory breaks down (e.g., infinite money pumps). The intuition that "more is always better" fails at transfinite scales. |
  | **D3** | **The Source of Credence** | We can assign meaningful credences to far-future scenarios via theoretical reasoning (physics, sociology) even without empirical frequency data. | Credences of $10^{-50}$ derived from back-of-envelope calculations are not "probabilities" in the decision-theoretic sense; they are placeholders for ignorance and cannot drive action. |

  ---

  ## 3. The Cruxes

  *We requested a menu of disagreements; I (the drafter) have selected the three that genuinely determine the outcome of this debate. I have excluded peripheral issues (e.g., specific historical examples) to focus on the structural levers.*

  **Crux 1: The Coherence of Unbounded Aggregation (Metaphysical)**
  *Why I picked this:* Dev identifies this as the root. If value cannot be summed to infinity, Fanaticism collapses mathematically. If it can, Moderation looks like an arbitrary stop-loss.
  *The Question:* Is it metaphysically coherent to say that a future with $10^{100}$ lives is strictly better than a future with $10^{50}$ lives in a way that scales linearly for decision making?

  **Crux 2: Epistemic Swamping (Epistemological)**
  *Why I picked this:* The User identifies this as the root. Even if Unbounded Aggregation is coherent, we cannot *know* the inputs. If the error rate in our probability estimation is higher than $10^{-50}$, the calculation is noise.
  *The Question:* Does the probability that our model of the universe is fundamentally flawed exceed the probability of the specific far-future scenario we are betting on?

  **Crux 3: Dynamic Consistency (Decision-Theoretic)**
  *Why I picked this (The Novel Crux):* Neither of you focused sufficiently on *policy stability*. A decision theory should not recommend different actions for a single gamble vs. a repeated gamble of the same expected value, nor should it allow itself to be "money-pumped." This tests whether Fanaticism or Moderation is a stable policy for an agent over time.
  *The Question:* Does the Fanatic view lead to sure losses in repeated interactions, or does the Moderate view lead to dominated outcomes in aggregate?

  ---

  ## 4. Adjudication Cases & Predictions

  *For each Crux, we specify a concrete case. We record our predictions now. If the logic of the case resolves the Crux, the loser of the prediction concedes the Crux.*

  ### Case for Crux 1: The "Infinity Switch"
  **Scenario:** You are offered a choice.
  *   **Option A:** Create a universe with $10^{100}$ happy lives.
  *   **Option B:** A 50% chance of creating a universe with $10^{100} + 1$ happy lives, and a 50% chance of creating a universe with 0 lives.
  *   **Extension:** Now imagine Option B offers $10^{100} \times 2$ lives at 50% probability. EV says take B. But if you accept B, do you accept a sequence of trades that risks everything for marginally more value indefinitely?

  **Dev's Prediction:** "I take Option B. If value is unbounded, the EV of B is higher. Refusing B implies that the difference between $10^{100}$ and $2 \times 10^{100}$ lives is negligible, which devalues the extra lives. I am willing to risk the certain $10^{100}$ for the chance at more, provided the EV holds."
  **User's Prediction:** "I take Option A. At this scale, 'value' is no longer linear. The certainty of $10^{100}$ lives saturates the moral demand. Risking total extinction for a marginal gain in *already astronomical* numbers is not rationality; it is a category error in how we measure 'good'."

  ### Case for Crux 2: The "Layered Uncertainty" Test
  **Scenario:** You must evaluate a proposal to avert a risk that could prevent $10^{50}$ future lives. The argument relies on a chain of 10 theoretical premises, each estimated at 90% confidence.
  *   **Calculation:** $0.9^{10} \approx 0.35$.
  *   **Complication:** You acknowledge a 1% chance that your entire framework for estimating these probabilities is wrong (e.g., black swan physics).
  *   **Choice:** Certain saving of 1,000 lives now vs. the probabilistic saving of $10^{50}$ lives based on the chain above.

  **Dev's Prediction:** "The 1% model error is just another probability node. You fold it into the calculation. Unless the model error is 100%, the EV of the far future still dominates the 1,000 lives. We must act on the best available estimate, not paralysis."
  **User's Prediction:** "The 1% model error swamps the $10^{-50}$ scale implications. If there is a 1% chance my math is nonsense, I cannot treat the output as a valid probability. I choose the 1,000 lives. The 'probability' of the far future is effectively undefined, not small."

  ### Case for Crux 3: The "Repeated vs. One-Off" Reversal
  **Scenario:**
  *   **Game 1 (One-Off):** You play the Fanatic Gamble once. Pay \$100 for a $10^{-50}$ chance to save $10^{60}$ lives.
  *   **Game 2 (Repeated):** You play the Fanatic Gamble 1 trillion times. Pay \$100 each time.
  *   **Observation:** In Game 2, the Law of Large Numbers applies. The EV becomes nearly certain. In Game 1, it is a near-certain loss.
  *   **The Trap:** If Moderation says "No" to Game 1 but "Yes" to Game 2, is that inconsistent? If Fanaticism says "Yes" to both, does it bleed resources in Game 1 that could have been used elsewhere?

  **Dev's Prediction:** "Consistency demands I say 'Yes' to both. If the EV is positive, it is positive. The fact that Game 2 converges to certainty just proves the math was right all along. Game 1 is just a sample size of one; I shouldn't fear variance in impersonal value."
  **User's Prediction:** "I say 'No' to Game 1 and 'Yes' to Game 2. This is not inconsistent; it is *ergodicity breaking*. In Game 1, the ruin is certain (resource loss for no gain). In Game 2, the aggregate gain is real. A rational policy maximizes across the portfolio of decisions, not each decision in isolation. Fanaticism fails because it cannot distinguish between a diversified portfolio of longshots and a single desperate bet."

  ---

  **Signatures:**

  _________________________ (Dev)

  _________________________ ([User])
