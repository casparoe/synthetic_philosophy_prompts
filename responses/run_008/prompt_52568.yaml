answer: |-
  We claim a native stock of courage,
  Until the clock demands a sudden hurry.
  We pledge a steady, built-in kindness,
  But walk past pain to clear the empty room.
  We trust our honesty is deep and true,
  Until the white-coat voice begins its prods.

  The experimenter offers gentle prods,
  And what was courage melts into compliance.
  It isn't virtue filling up the room,
  But social pressure masking as kindness.
  We say we'd stop, unless we're in a hurry,
  Then truth bends low, abandoning honesty.

  So much for honesty when stakes are high,
  When authority repeats its quiet prods.
  It wasn't malice, just a need to hurry,
  That stripped the actor of any courage.
  No hidden core of reliable kindness,
  Just context rearranging furniture in the room.

  Yet something lingers when we leave the room,
  A shame that suggests more than failed honesty.
  We mourn the lack of demonstrated kindness,
  As if the self survived the lab's prods.
  Perhaps the trait survives the loss of courage,
  A seed waiting outside the clock's hurry.

  Not every action bows to hurry,
  Some stand still in the middle of the room.
  There is a shape to character called courage,
  More than a gap between lies and honesty.
  We resist the subtle psychological prods,
  Or try to, in the name of kindness.

  We practice everyday acts of kindness,
  Even when threatened by the hurry.
  We stumble under institutional prods,
  Yet still believe we own the room we walk.
  We strive for honesty despite the cost,
  And name that stubbornness courage.

  We ask what shape the room imposes on our kindness,
  How honesty dissolves inside a hurry,
  Whether courage exists beneath the prods.
