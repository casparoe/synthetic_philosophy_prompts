answer: |-
  You are right to suspect that your reading group is reproducing a structural stall in the literature. This debate has been running hot since Temkin's *Intransitivity and the Mere Addition Paradox* (1987) and Rachels' *Counterexamples to the Transitivity of Better Than* (1998), and it remains unresolved because the two sides are often operating with different **methodological commitments** about what value theory is supposed to *do*.

  Here is a diagnosis of the disagreement, an analysis of why it stalls, and a roadmap for what would actually count as progress.

  ### 1. The Diagnosis: A Clash of Theoretical Virtues
  This is not merely a verbal dispute (about the definition of "better"), nor is it a purely substantive dispute (about the facts of value). It is a **Methodological Disagreement about the Constraints of Normative Theory.**

  Both sides agree on the data points (the intuitions about the spectrum cases). They disagree on which theoretical virtue takes precedence when those data points conflict with formal constraints.

  *   **The Transitivists (e.g., John Broome, James Rachels [later work], Alex Voorhoeve):**
      *   **Commitment:** *Coherence and Action-Guidance.* They treat "better than" as a structural concept akin to logic or rational choice. For them, transitivity is a constitutive norm of rationality. If a relation is intransitive, it cannot guide choice (due to money-pump vulnerabilities) and therefore cannot be the *normative* "better than."
      *   **The Claim:** "Better than" is by definition a strict partial order. If your intuitions suggest intransitivity, you are either misdescribing the relation (equivocation) or failing to see that one of the small steps must be false (denying the Sorites premise).
      *   **The Cost:** They must bite the bullet on **Precision**. They have to claim there is a precise point in the spectrum where a tiny change makes a difference, or that adjacent items are incomparable, which feels ad hoc.

  *   **The Intransitivists (e.g., Larry Temkin, Stuart Rachels [earlier work], Jacob Nebel):**
      *   **Commitment:** *Fit with Intuition.* They treat "better than" as a substantive property of outcomes, like "red" or "painful." If the world is messy, the concept tracking the world can be messy. They prioritize saving the intuitions about the specific cases (A is better than Z; A- is no worse than A) over preserving formal elegance.
      *   **The Claim:** Normative reality is not required to obey the laws of logic or mathematics. "Better than" is a substantive relation that happens to be intransitive in spectrum cases.
      *   **The Cost:** They must bite the bullet on **Rationality**. They have to explain how an agent can choose rationally without transitive preferences (avoiding money pumps) or accept that rationality is sometimes impossible.

  **The Verdict:** You are correct that they are answering slightly different questions. The Transitivists are asking, *"What properties must a relation have to function as a guide for rational choice?"* The Intransitivists are asking, *"What is the actual structure of the normative facts, regardless of whether they facilitate choice?"* When they debate "Is better-than transitive?", they are conflating **Choice-Worthiness** with **Normative Truth**.

  ### 2. The Role of Incomparability (The Hidden Driver)
  Your hypothesis about incomparability is astute. Much of the "stall" is actually a displaced debate about **parity** or **incomparability**.

  *   **The Transitivist Move:** To save transitivity, many argue that adjacent items in the spectrum (A and A-) are not "equally good" or "A is no worse than A-," but rather **incomparable**. If $A$ and $A-$ are incomparable, the chain of transitivity is broken, and you cannot infer $A \succeq Z$.
  *   **The Counter-Move:** Intransitivists argue this is just as counterintuitive. How can a tiny change render two outcomes incomparable? This invokes the **Small Unimprovement Problem**: if A and A- are incomparable, and A- is slightly better than A-- in some respect, why doesn't that respect tip the scale?

  **Diagnosis:** The debate often stalls here because both sides use "incomparability" as a trump card to save their preferred formal property, without agreeing on the metaphysics of incomparability. If incomparability is widespread (as the spectrum suggests), the "better than" relation becomes so sparse it loses its utility for comparison.

  ### 3. Why the "Equivocation" Charge Doesn't Resolve It
  The Transitivist claim that spectrum arguments rely on equivocation (sliding between *all-things-considered* and *in-some-respect*) is the standard defense. However, Temkin and others have constructed arguments specifically designed to block this.

  *   **Temkin's Defense:** He constructs cases where the *only* relevant respect is held constant (e.g., duration of pain), yet the intuition of intransitivity remains.
  *   **The Stall:** Transitivists respond that if the intuition remains, it proves the relation isn't "all-things-considered betterness" but something else (e.g., "betterness relative to a vague concept").
  *   **Result:** This becomes a **No True Scotsman** fallacy.
      *   *Transitivist:* "True betterness is transitive."
      *   *Intransitivist:* "Here is a case of betterness that is intransitive."
      *   *Transitivist:* "Then it wasn't true betterness."

  This confirms the disagreement is **conceptual/methodological**, not empirical.

  ### 4. What Counts as Progress?
  Since this is a methodological clash, you will not "solve" it by finding a new counterexample. Both sides have hardened against counterexamples. Progress in your reading group should look like **mapping the costs** rather than **declaring a winner**.

  Here are four specific avenues for progress:

  **A. Distinguish "Normative Betterness" from "Choice-Guiding Betterness"**
  *   **Progress:** Agree that there might be two relations.
      1.  **$>_N$ (Normative Truth):** Might be intransitive (Temkin's view). It describes the way value is distributed.
      2.  **$>_C$ (Rational Choice):** Must be transitive (Broome's view). It describes what agents can permissibly choose.
  *   **Task:** Ask the group: If $>_N$ is intransitive, how do we derive $>_C$? Do we need a "transitivizing" function (like taking the transitive closure) that distorts the normative truth to make it actionable? This moves the debate from "Which is true?" to "How do they interact?"

  **B. The Money Pump Test (Formal Progress)**
  *   **Progress:** Stop arguing intuitions and run the formal implications.
  *   **Task:** If you accept Temkin's intransitivity, can you construct a money pump?
      *   If **Yes**: Are you willing to accept that rational agents can be exploited? If so, is that a reductio of intransitivity, or a reductio of the idea that rationality precludes exploitation? (Some, like Rachels, argue exploitation arguments assume a diachronic view of agency that might not apply).
      *   If **No**: How did you block the pump without assuming transitivity? (This leads to sophisticated models of **acyclic** preferences).
  *   **Why this helps:** It forces the Intransitivists to provide a formal model of rational choice that works without transitivity, rather than just asserting "logic doesn't apply to value."

  **C. The "Vagueness" vs. "Incomparability" Distinction**
  *   **Progress:** Sharpen the metaphysics of the break in the chain.
  *   **Task:** Determine if the break in the spectrum is due to **Vagueness** (there is no fact of the matter where A stops being better than B) or **Incomparability** (there is a fact that they cannot be compared).
      *   If it's **Vagueness**, then classical logic (including transitivity) might not apply (supervaluationism). This supports Temkin.
      *   If it's **Incomparability**, transitivity holds vacuously, but the "no worse than" step in the spectrum argument fails. This supports the Transitivists.
  *   **Why this helps:** It moves the debate to the philosophy of language and metaphysics, where there are clearer tools than "intuition pumping."

  **D. Acceptance of a "Trilemma" (Meta-Progress)**
  *   **Progress:** Acknowledge that the literature suggests a trilemma where you must reject one of three claims:
      1.  **Transitivity** (Formal Coherence)
      2.  **The Small Step Principle** (No tiny change makes a huge difference)
      3.  **The Extreme Conclusion** (A is not better than Z)
  *   **Task:** Have each member of the group explicitly state which bullet they are biting and *why* that cost is preferable to the others.
      *   *Example:* "I accept intransitivity because the cost of denying the Small Step Principle (claiming a microscopic change matters morally) is higher than the cost of complicating rational choice theory."
  *   **Why this helps:** It stops the group from talking past each other. It clarifies that the disagreement is about **weighting theoretical virtues**, not about seeing the same facts.

  ### Summary for Your Group
  Tell your group this: **You are not failing to find the argument; you are encountering the limit of the framework.**

  The disagreement is not about whether $A > B$ and $B > C$ implies $A > C$ in the abstract. It is about whether the concept "better than" is defined by its **logical role** (Transitivists) or its **substantive content** (Intransitivists).

  **To move forward:** Stop trying to prove transitivity true or false. Instead, model the consequences of each. If "better" is intransitive, what happens to decision theory? If "better" is transitive, what happens to our intuitions about suffering and population? The progress lies in mapping the price of each ticket, not in pretending one is free.
