answer: |-
  This is a classic problem in special science ontology, and your background in geophysics makes you uniquely positioned to feel the friction here. You are wrestling with the gap between *fundamental physics* (protons) and *systemic patterns* (recessions, climate means), while trying to filter out *useful fictions* (average taxpayer, balance of nature).

  Since you asked for the work to be shown, I will not jump straight to the solution. I will sketch three candidate principles, stress-test them against your specific verdicts, and then derive the survivor.

  ### Phase 1: Brainstorming Candidate Principles

  **Candidate 1: The "Causal Power" Principle (Neo-Aristotelian)**
  *   **Definition:** $X$ is real if and only if $X$ can enter into causal relations. $X$ must be able to *make a difference* to the state of other entities.
  *   **Motivation:** This handles the Proton (causes scattering), the Recession (causes unemployment), and Beliefs (cause actions). It nicely excludes the "Balance of Nature" (ecosystems don't *cause* themselves to balance; that's a teleological myth).
  *   **Initial Appeal:** It aligns with your scientific training. Things that *do* work are real.

  **Candidate 2: Dennett's "Real Patterns" (Informational Compressibility)**
  *   **Definition:** $X$ is real if positing $X$ allows for noise-free compression of data about the world. If the pattern yields predictive power that isn't available at the lower level without massive computational cost, it is real.
  *   **Motivation:** This is the view you've been reading. It handles Species (clustering in phenotype space) and Beliefs (predicting your wife). It explains why the Center of Mass is real: calculating orbits particle-by-particle is impossible; treating the solar system as a point mass at the CoM is a perfect compression.
  *   **Initial Appeal:** It validates your career. Climate models are compressions of fluid dynamics. If compression = reality, your models studied reality.

  **Candidate 3: The "Interventionist" Principle (Woodwardian)**
  *   **Definition:** $X$ is real if $X$ can serve as a relatum in a causal relationship that supports *invariant generalizations under intervention*. Can you wiggle $X$ and see $Y$ change? Or can you wiggle $Z$ and see $X$ change in a law-like way?
  *   **Motivation:** This distinguishes between correlations and causes. It handles the Recession (policy interventions target "recession" as a macro-variable).
  *   **Initial Appeal:** It might solve the "Average Taxpayer" problem. You cannot intervene on the "Average Taxpayer" because no one occupies that node.

  ---

  ### Phase 2: Stress-Testing the Candidates

  Let's run your specific verdicts through these three filters to see which one breaks.

  **Test Case A: Center of Mass (CoM) vs. Average Taxpayer**
  *   *Your Verdict:* CoM is Real; Average Taxpayer is Not.
  *   *Candidate 1 (Causal Power):* **Fail.** The CoM is a mathematical point. It has no mass. It doesn't technically "exert" gravity; the mass distribution does. If we are strict, CoM is a fiction. But you say it's real. Candidate 1 is too restrictive for abstracta.
  *   *Candidate 2 (Real Patterns):* **Pass.** CoM compresses orbital data perfectly. "Average Taxpayer" compresses tax data, *but* it introduces noise/error when predicting behavior (the lump fallacy). The compression isn't "noise-free" regarding economic agency.
  *   *Candidate 3 (Interventionist):* **Pass.** Orbital mechanics treats the CoM *as if* it were the locus of gravity; interventions on the system respect the CoM. Interventions on the economy cannot target the "Average Taxpayer" because changing the average doesn't imply a specific mechanism.

  **Test Case B: Balance of Nature vs. Recession**
  *   *Your Verdict:* Balance of Nature is Not Real; Recession is Real.
  *   *Candidate 1:* **Pass.** Recessions have causal mechanisms (credit crunches, etc.). "Balance" is a normative ideal, not a mechanism.
  *   *Candidate 2:* **Pass.** "Recession" is a detectable pattern in transaction data. "Balance of Nature" is a *false* pattern; the data doesn't actually show a homeostatic set-point in complex ecosystems. It's a hallucination of order.
  *   *Candidate 3:* **Pass.** You can intervene on a recession (interest rates). You cannot intervene on a "Balance" because it doesn't exist as a state variable.

  **Test Case C: Global Mean Surface Temperature (GMST) vs. Buoy Reading**
  *   *Your Verdict:* Buoy is Real; GMST is "Real-ish" (Less Real).
  *   *Candidate 1:* **Fail.** Both are thermodynamic states. If the buoy is real, the mean of the buoys should be equally real physically.
  *   *Candidate 2:* **Pass (with tension).** The buoy is a high-fidelity local pattern. GMST is a high-level compression. Dennett allows degrees of reality based on the *level of the stance*. But your intuition says GMST is *less* real.
  *   *Candidate 3:* **Fail.** In climate science, GMST is the primary variable for intervention (radiative forcing targets GMST). A single buoy is often noise relative to the signal. If anything, GMST is *more* interventionally robust.

  **The Elimination:**
  *   **Candidate 1** is out. It's too physicalist. It can't account for the reality of the Center of Mass or the Equator, which you rightly insist are real despite being abstract.
  *   **Candidate 2** is strong, but it risks making "Average Taxpayer" real (it *does* compress data, just poorly for prediction). We need a stricter clause on *utility*.
  *   **Candidate 3** is the strongest foundation, but it needs to be merged with Dennett's insight about *patterns* to handle the Equator (which isn't intervened upon, but structures the intervention).

  ---

  ### Phase 3: The Survivor Principle

  The principle that survives the stress test is a synthesis of Interventionism and Real Patterns. I call it:

  #### **The Principle of Robust Causal-Explanatory Indispensability**

  > **Statement:** An entity, property, or pattern $X$ is **REAL** if and only if:
  > 1.  **Indispensability:** Positing $X$ is necessary for the most efficient, accurate predictive model of the system in a specific context (it cannot be eliminated without significant loss of predictive power or computational tractability).
  > 2.  **Counterfactual Stability:** $X$ supports invariant counterfactuals (if $X$ were different, $Y$ would be different) that hold true across multiple distinct modes of detection or intervention.
  > 3.  **Non-Substitutability:** $X$ cannot be replaced by a description of its constituents alone without losing the ability to explain *systemic* behavior.

  **Why this works for your tensions:**
  *   **CoM vs. Average Taxpayer:** The CoM is indispensable for orbital mechanics (Clause 1) and supports counterfactuals about orbits (Clause 2). The "Average Taxpayer" fails Clause 3: you *can* replace it with "income distribution" and gain predictive power. The "Average" actually obscures the causal mechanisms (marginal propensity to consume varies by income bracket).
  *   **Equator:** It is indispensable for navigation and climate zoning (Clause 1). It is a stable coordinate singularity (Clause 2).
  *   **Balance of Nature:** Fails Clause 2. Counterfactuals like "If we suppress this fire, the balance will be restored" turn out false in stress tests. It is a false model, not a real pattern.
  *   **Beliefs:** Indispensable for predicting your wife (Clause 1). You cannot replace "belief" with "neuron state" without losing the semantic content required for prediction (Clause 3).

  ---

  ### Phase 4: Applying the Principle to Your Cases

  Here is how the principle adjudicates your list, specifically addressing the friction points.

  1.  **Proton:** Real. Indispensable for particle physics models. Supports counterfactuals in scattering experiments.
  2.  **Center of Mass:** Real. Indispensable for celestial mechanics. You cannot calculate orbits efficiently by summing every particle's gravity. It satisfies Non-Substitutability for the *orbital* context.
  3.  **Equator:** Real. It is a structural feature of the rotating reference frame. Indispensable for Coriolis effect explanations and navigation.
  4.  **Buoy Reading:** Real. Direct measurement node. High fidelity.
  5.  **Species:** Real. Satisfies Non-Substitutability. Knowing an animal is a "shorebird" predicts behavior better than knowing its atomic composition, and better than a purely individual description (due to shared evolutionary constraints).
  6.  **Recession:** Real. It is a macro-state variable. Policy interventions target "recession" (interest rates, stimulus). You cannot replace "recession" with "list of transactions" without losing the ability to model macro-economic feedback loops.
  7.  **Belief:** Real. Indispensable for the Intentional Stance.
  8.  **Average Taxpayer:** **Not Real.** Fails Non-Substitutability. Using the "average" leads to the *lump fallacy*. The distribution is the real pattern; the average is a rhetorical shorthand that degrades predictive accuracy regarding behavior.
  9.  **Balance of Nature:** **Not Real.** Fails Counterfactual Stability. It is a normative projection, not a descriptive pattern found in the data.

  ---

  ### Phase 5: The Hard Part (Overturning Your Verdict)

  You asked for honesty: **Which of your verdicts does this principle overturn?**

  I must overturn your verdict on **Global Mean Surface Temperature (GMST)**.

  **Your Verdict:** "Real-ish, but somehow less real than the buoy reading."
  **The Principle's Verdict:** GMST is **equally real** to the buoy reading, and in the context of climate dynamics, arguably *more* real.

  **Why you are wrong (philosophically, not scientifically):**
  Your intuition here is suffering from a bias toward *local concreteness*. You feel the buoy is more real because it is a physical instrument interacting with water. The GMST feels "derived."

  However, under the **Principle of Robust Causal-Explanatory Indispensability**:
  1.  **Indispensability:** A single buoy reading is actually *noise* in the context of global energy balance. It tells you the temperature at $X,Y,Z,t$. It does not tell you the state of the climate system. GMST is the variable that appears in the Stefan-Boltzmann law applications for Earth's radiative equilibrium.
  2.  **Counterfactual Stability:** "If GMST rises by 2K, sea ice extent decreases" is a robust counterfactual. "If Buoy #452 rises by 2K, sea ice extent decreases" is not. The buoy might be in a local eddy.
  3.  **Non-Substitutability:** You cannot replace GMST with "the list of all buoy readings" in a general circulation model without losing the ability to couple the atmosphere and ocean energetically. The *mean* is the causal driver of the gradient forces.

  **The Correction:** The buoy is a *measurement token*. GMST is a *system state*. In metaphysics of science, system states are not "less real" than measurement tokens. In fact, the token is only meaningful *because* of the state it samples. Your career wasn't studying a fiction; you were studying the **causal architecture of the climate**, for which GMST is a primary node. The intuition that it is "less real" is a psychological artifact of not being able to touch it, not a metaphysical fact.

  ---

  ### Phase 6: New Cases

  Finally, applying the principle to your unlisted cases.

  **Case 1: An Economic Bubble (while inflating)**
  *   **Verdict:** **Real.**
  *   **Reasoning:** It satisfies Counterfactual Stability. "If the bubble bursts, liquidity dries up." It satisfies Indispensability. Traders and regulators model the "bubble" as an object; they adjust behavior based on its existence (FOMO, caution). It is not just a summary of prices; it is a feedback loop of expectation that exerts causal force on the market. It is a Real Pattern of collective intentionality.

  **Case 2: "The 1990s"**
  *   **Verdict:** **Ambiguous (Depends on usage).**
  *   **Reasoning:**
      *   *As a chronological container (1990-1999):* **Real Convention.** It is a bookkeeping convention based on Earth's orbit. It is real in the same way the Equator is real—a coordinate system.
      *   *As a Cultural Pattern ("The Nineties"):* **Real Pattern.** If clustering data (fashion, tech, geopolitics) shows a distinct regime shift that allows prediction (e.g., "This is a very 90s movie"), then it is real.
      *   *As a Strict Essence:* **Not Real.** If you claim "The 1990s" has a necessary essence that excludes 1989 or 1991, you fail the stress test. Boundaries leak.
      *   *Final Tally:* It is a Real Pattern *if* treated as a fuzzy cluster of cultural traits. It is a Convention *if* treated as a strict decade.

  ### Summary

  The hiding principle beneath your intuitions is **Causal-Explanatory Indispensability**. You are a scientific realist who instinctively rejects *epiphenomenal abstractions*.

  *   You accept the **Center of Mass** because it *does work* (orbital mechanics).
  *   You reject the **Average Taxpayer** because it *does no work* (fails to predict behavior).
  *   You reject the **Balance of Nature** because it *does false work* (predicts stability where there is none).

  The only adjustment you need to make is to trust your models more than your fingertips. The **Global Mean Surface Temperature** is not a "less real" shadow of the buoys; it is the actual variable that governs the physics you spent 37 years modeling. The buoys are just the sensors; the GMST is the system.
