answer: |-
  **Exam Question (Option 3)**

  **3. The Negation Challenge and the Hybrid Retreat**
  Standard introductions to the Frege–Geach problem focus on conditionals and *modus ponens*. However, a deeper challenge arises from negation. For the expressivist, "Shoplifting is wrong" expresses a con-attitude toward shoplifting. But what attitude does "Shoplifting is *not* wrong" express? If it expresses the absence of that con-attitude, it is difficult to explain why holding both views is inconsistent. If it expresses a distinct attitude (e.g., tolerance), it is difficult to explain why that attitude logically negates the first.

  Write an essay addressing the following:
  1.  Explain why negation poses a specific difficulty for expressivism regarding unasserted contexts (e.g., "If shoplifting is not wrong...").
  2.  Evaluate the strategy of assigning a logic to attitudes itself. Does this solve the compositionality problem, or does it smuggle representational content back into the theory?
  3.  Consider the Hybrid Expressivist proposal: moral sentences have truth-conditions *and* express attitudes. Does this dissolve the Frege–Geach problem, or merely relocate it? Specifically, if truth-conditions handle the logical inference, is any substantive work left for the expressivist component to do?

  ***

  **Model Answer**

  The Frege–Geach problem is often framed as a puzzle about validity in conditionals, but its root lies in the semantics of negation. For the cognitivist, "Shoplifting is wrong" asserts a proposition $p$, and "Shoplifting is not wrong" asserts $\neg p$. Inconsistency is simply believing $p$ and $\neg p$ simultaneously. For the expressivist, however, moral sentences express non-cognitive attitudes. The negation problem arises because it is unclear what attitude corresponds to $\neg p$. If "wrong" expresses disapproval, does "not wrong" express the absence of disapproval? If so, one can consistently lack disapproval while also lacking approval, which fails to capture the intuitive inconsistency between calling an act wrong and calling it not wrong. Alternatively, if "not wrong" expresses a distinct attitude (like tolerance), we must explain why disapproval and tolerance are logically incompatible in a way that mere psychological states are not.

  This difficulty compounds in unasserted contexts. In the antecedent of a conditional—"If shoplifting is not wrong, then..."—the speaker is not expressing any attitude toward shoplifting at all. A pure expressivist must explain how the meaning of "not wrong" contributes to the meaning of the whole conditional without being asserted. If the meaning of a moral term *is* the expression of an attitude, and no attitude is expressed in the antecedent, the term appears to lack meaning in that context. Yet, we reason with these terms effortlessly. To solve this, sophisticated expressivists (like Blackburn or Gibbard) propose that attitudes themselves have a logic. They argue that there is a state of "disapproving of disapproval" which is logically inconsistent with simple disapproval, mirroring the structure of propositional negation.

  However, this solution invites the charge of smuggling. If attitudes are structured such that they obey the laws of propositional logic (e.g., double negation, non-contradiction), they begin to look functionally identical to beliefs. If the "logic of attitudes" is isomorphic to the logic of truth-conditions, the expressivist has effectively replicated the cognitivist structure they sought to avoid. The worry is that to save the logic, the expressivist must treat attitudes as having correctness conditions or representational content, thereby collapsing the distinction between expressing an attitude and asserting a fact.

  This brings us to Hybrid Expressivism. The hybrid theorist grants that "Shoplifting is wrong" has truth-conditions (e.g., it is true iff shoplifting has the property of wrongness) *and* expresses a con-attitude. On the surface, this dissolves Frege–Geach immediately. The logical inference from "Stealing is wrong" and "If stealing is wrong, encouraging it is wrong" to "Encouraging it is wrong" is valid in virtue of the truth-conditional content alone. The compositional work is done by the cognitive component, which handles negation and conditionals standardly. The expressivist component is free to explain the motivational force of moral judgment without interfering with the logic.

  Yet, this dissolution may come at the cost of the expressivist motivation. Traditional expressivism was driven by the idea that moral judgments *are not* truth-apt representations of the world, often due to metaphysical queasiness or the desire to link morality essentially to action. If the hybrid view assigns standard truth-conditions to moral sentences, the metaphysical burden returns: what *is* the property of wrongness? Furthermore, if the truth-conditions do all the logical heavy lifting, the expressive component risks becoming theoretically redundant. It explains why we care about morality, but not what morality *means* in a way that distinguishes it from ordinary description. If the truth-conditions determine validity and negation, the "expression of attitude" becomes a pragmatic add-on rather than a constitutive feature of moral meaning. Thus, while the hybrid view solves the logical problem, it may fail to preserve the anti-realist insights that motivated expressivism in the first place. The Frege–Geach problem is relocated from semantics to metaphysics: we save logic, but we lose the distinctively non-cognitive account of moral thought.

  ***

  **Marking Scheme (Total: 20 Points)**

  **1. The Negation Problem (4 points)**
  *   **Must Hit:** Clearly distinguishes how cognitivism handles negation (propositional contradiction) vs. expressivism (inconsistency of attitudes). Explains why "absence of attitude" fails to capture logical inconsistency.
  *   *Common Pitfall:* Students claim expressivists simply say "not wrong" means "approval," missing the nuance that tolerance/approval isn't strictly logically contradictory to disapproval without further stipulation.

  **2. Unasserted Contexts & Negation (4 points)**
  *   **Must Hit:** Explains why negation in antecedents/disjunctions is problematic (no attitude is expressed, so how does the term contribute meaning?).
  *   *Common Pitfall:* Students rehash the standard *modus ponens* example without addressing the specific complication introduced by the negated antecedent ("If it is *not* wrong...").

  **3. The "Logic of Attitudes" & Smuggling (4 points)**
  *   **Must Hit:** Evaluates whether making attitudes logical replicates propositional structure. Acknowledges the risk that this reintroduces representational content/correctness conditions.
  *   *Common Pitfall:* Students accept the "logic of attitudes" fix at face value without critiquing whether it betrays the core non-cognitive commitment.

  **4. Hybrid Solution to Frege–Geach (4 points)**
  *   **Must Hit:** Correctly identifies that Hybrid Expressivism solves the *logical* validity issue by offloading it to truth-conditions.
  *   *Common Pitfall:* Students argue Hybrid Expressivism *fails* to solve Frege–Geach logically, rather than recognizing it solves logic but creates theoretical costs.

  **5. Hybrid Motivational Redundancy (4 points)**
  *   **Must Hit:** Argues that if truth-conditions handle logic/semantics, the expressive component may become redundant or collapse into cognitivism (metaphysical burden returns).
  *   *Common Pitfall:* Students conclude Hybrid Expressivism is the "best of both worlds" without addressing the prompt's challenge regarding whether anything is *left* for the expressivist part to do.
