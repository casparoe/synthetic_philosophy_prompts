answer: |-
  Your friend's analogy is the standard pitch for **$\psi$-epistemology** (the view that the wavefunction represents knowledge, not reality). It is intuitive, comforting, and was held by Einstein. However, it is also technically obsolete in the face of no-go theorems developed over the last 40 years, culminating in the result you half-remember from 2012.

  The weather analogy works perfectly for **classical statistical mechanics**. It fails for **quantum mechanics** because it smuggles in assumptions about the nature of "the territory" that quantum experiments have ruled out.

  Here is the audit of the analogy, the mapping, the breaks, and the integration of the two theorems you recalled.

  ### 1. The Mapping (and where it looks plausible)

  To be charitable, let's lay out the correspondence your friend is relying on:

  *   **The Territory:** The actual state of the atmosphere (pressure, temp, humidity at every point).
  *   **The Map ($\psi$):** The forecaster's probability distribution over those states.
  *   **Preparation:** The forecaster gathering initial data to draw the map.
  *   **Measurement:** A thermometer reading or looking out the window.
  *   **Collapse:** The forecaster erasing the "30% chance" and writing "100% Rain" after seeing water hit the glass.
  *   **Superposition:** Merely expressing uncertainty (e.g., "It could be Rain OR Sun").

  **Why it bugs you:** In the weather case, the uncertainty is *always* due to ignorance. There is a fact of the matter about whether it is raining, even if the map says "50%." In QM, if you treat superposition as mere ignorance, you predict experimental outcomes that differ from what we actually observe.

  ### 2. The First Break: Interference and Phase

  The most immediate physical break is **interference**.

  In the weather analogy, probabilities are non-negative real numbers. If there is a 50% chance of Path A and a 50% chance of Path B, the total probability is the sum.
  In QM, the "map" contains **amplitudes** (complex numbers). If you have amplitude $\alpha$ for Path A and $\beta$ for Path B, the probability is $|\alpha + \beta|^2$. This allows for cancellation ($\alpha = -\beta \implies P=0$).

  **The Disanalogy:** A weather forecaster cannot draw a map where "50% chance of Rain" plus "50% chance of Sun" results in "0% chance of Precipitation."
  **Why it matters:** This proves the wavefunction is not a probability distribution over underlying "ordinary" states. It is a physical field of amplitudes. If the friend insists the map is just info, she must posit that the *underlying territory* has waves that interfere, which means the territory isn't "ordinary" particles with definite properties. The weirdness has been pushed from the map to the territory, defeating her conclusion.

  ### 3. Point 1: The Non-Orthogonality Problem (Pooling)

  You recalled that "nonorthogonal quantum states can never be pooled." This refers to the distinction between **overlapping** and **disjoint** distributions.

  In the weather analogy:
  *   Forecaster A says: "It's definitely raining." (State $R$)
  *   Forecaster B says: "It's definitely cloudy." (State $C$)
  *   Since rain implies clouds, their probability distributions **overlap**. There is an underlying reality (Rain) that is consistent with both maps. If you don't know which forecaster is right, you can "pool" their info.

  In Quantum Mechanics:
  *   Consider two non-orthogonal states $|\psi\rangle$ and $|\phi\rangle$.
  *   If $\psi$ is just information about some underlying reality $\lambda$, then there must be some underlying realities $\lambda$ that are compatible with *both* preparations (just like Rain is compatible with both forecasters above).
  *   **The Break:** Quantum mechanics imposes strict limits on how well you can distinguish non-orthogonal states. If they were just overlapping classical distributions, you could, in principle, design a measurement that checks the underlying $\lambda$ to see which distribution it came from.
  *   **Hardy's Theorem (1999)** and related results show that if you assume distinct quantum states correspond to overlapping distributions of underlying realities (the weather view), you cannot reproduce the statistical predictions of QM regarding how these states can be distinguished. The "overlap" required by the epistemic view is too large; QM requires the states to be more "separate" in reality than mere ignorance allows.

  **Verdict:** The weather analogy assumes that different states of knowledge can always share a common underlying truth. QM says: "No, sometimes the knowledge *is* the distinction."

  ### 4. Point 2: The PBR Theorem (2012)

  This is the specific argument you remembered. **Pusey, Barrett, and Rudolph (PBR)** published a paper in *Nature Physics* that directly targets your friend's view.

  **The Setup:**
  1.  Assume the quantum state $\psi$ is epistemic (like the weather map). This means distinct states $\psi_1$ and $\psi_2$ correspond to probability distributions over underlying physical states $\lambda$ that **overlap**. (There is some physical reality $\lambda$ that could be described by either map).
  2.  Assume **Preparation Independence**: If I prepare two systems independently in my lab, and you prepare two systems independently in your lab, the underlying physical states $\lambda_1$ and $\lambda_2$ are independent. (This is true for weather; the rain in London is independent of the rain in Tokyo).

  **The Contradiction:**
  PBR showed that if you have overlapping distributions (epistemic view) + independent preparations, you can construct a measurement on the joint system that yields a result forbidden by quantum mechanics.
  *   Essentially, if the states overlap, there is a non-zero probability that two independently prepared systems end up in underlying states that are "compatible" with orthogonal quantum states.
  *   QM says orthogonal states yield zero probability for certain outcomes.
  *   The epistemic model predicts a non-zero probability.
  *   Experiment agrees with QM.

  **What this means for your friend:**
  To save the "wavefunction is just information" view, she must reject **Preparation Independence**. She has to argue that two systems prepared independently in separate labs are nonetheless secretly correlated in their underlying reality.
  *   **The Cost:** This makes the underlying world **highly non-ordinary**. It implies a holistic universe where "independent preparation" is an illusion.
  *   **Conclusion:** Her claim that "the underlying world is basically ordinary" is falsified by PBR. You can keep the epistemic view, but only if the underlying territory is weirdly connected (non-separable).

  ### 5. What the Analogy Smuggles In

  The weather analogy feels convincing because it silently imports two classical assumptions that QM violates:

  1.  **Non-Contextuality:** In weather, the temperature is the temperature regardless of whether you measure it with a mercury thermometer or a digital one. In QM (Kochen-Specker Theorem), the value of a property can depend on *which other compatible properties* you measure alongside it. The weather map assumes properties exist prior to measurement choice; QM says they often do not.
  2.  **Measurement as Passive:** Your friend says measurement is "just updating the map." In weather, looking at the rain doesn't change the rain. In QM, measurement is an active physical interaction that generally alters the future evolution of the system (beyond just Bayesian updating).
      *   *Counter-argument:* She might say, "Well, checking the temperature with a thermometer absorbs heat, disturbing the system."
      *   *Rebuttal:* We can account for disturbance in classical models. But quantum disturbance has a specific structure (e.g., you can't measure Position without disturbing Momentum in a specific quantified way) that cannot be modeled as simple physical kick-back on an ordinary particle.

  ### 6. Does "The World Underneath is Ordinary" Survive?

  **No.** The analogy was carrying that conclusion the whole way.

  If you strip away the breaks:
  *   To explain **Interference**, the underlying stuff must wave.
  *   To explain **Bell's Theorem**, the underlying stuff must be non-local.
  *   To explain **PBR**, the underlying stuff must be non-separable (preparations aren't independent).
  *   To explain **Contextuality**, the underlying stuff must depend on measurement settings.

  None of these are "ordinary." If your friend wants to maintain that $\psi$ is epistemic, she is welcome to it, but she cannot claim the underlying reality is a collection of ordinary particles with definite properties. She is forced into **Retrocausality** (future measurements affect past preparations) or **Holism** (the universe is one single object). Both are far weirder than just accepting the wavefunction is real.

  ### 7. A Better Analogy (if one must be used)

  The weather map is dead. A better analogy for the epistemic view that acknowledges the constraints is the **"Quantum Bank Account"** or **"Encrypted Ledger."**

  *   **The State:** A balance in a cryptographic account.
  *   **The Restriction:** You cannot check the balance without executing a transaction.
  *   **The "Collapse":** When you query the balance, the system forces a resolution that updates the ledger, but the act of querying changes the available future transactions (No-Cloning).
  *   **The PBR constraint:** You cannot have two independent accounts that share the same underlying private key without the bank flagging a fraud (contradiction).

  However, the honest answer is: **There is no classical analogy for quantum states.**

  The weather analogy works because classical probability theory is a subset of quantum theory. It works for decohered systems (macroscopic objects). Your friend is taking a tool that works for the classical limit and pretending it applies to the fundamental layer.

  ### Summary for your Friend

  Tell her this:
  1.  **Interference:** Weather probabilities don't cancel each other out; quantum amplitudes do. The map *must* have physical wave-properties to do this.
  2.  **PBR Theorem:** If the state is just info about independent underlying facts, we get the wrong answers. To keep the "info" view, you have to admit the underlying facts are secretly connected across the universe.
  3.  **The Conclusion:** You can believe the wavefunction is information, but you lose the right to call the underlying world "ordinary." The weirdness isn't in the bookkeeping; it's in the fact that the bookkeeping rules (QM) forbid an ordinary underlying reality. The map is strange *because* the territory is strange.
