answer: |-
  This is a classic moral psychology puzzle. Your sister is clearly not a pure utilitarian (she rejects the Surgeon and Footbridge cases), but she isn't a strict deontologist either (she accepts the Trolley, Tax, and Pill cases). She is operating on a hybrid system.

  Here is an analysis of the three candidate rules you mentioned, how they fit her track record, what they predict for the Thanksgiving cases, and which case will actually tell you what she thinks.

  ### Candidate Rule 1: The Doctrine of Double Effect (Means vs. Side-Effect)
  **The Rule:** It is permissible to cause harm as a foreseen *side effect* of achieving a good goal, but it is impermissible to cause harm as the *means* to that goal.
  *   **Fit with Past Cases:**
      *   *Trolley:* The death is a side effect of diverting the threat. (**Fine**)
      *   *Footbridge/Surgeon:* The death is the means (body stops trolley; organs save patients). (**Not Fine**)
      *   *Tax:* Financial loss is a side effect of raising revenue for healthcare. (**Fine**)
      *   *Pill:* Illness is a side effect of the immune response/eradication program. (**Fine**)
  *   **Predictions:**
      *   **Flooded Valley:** **Fine.** The family losing the farm is a foreseen side effect of the reservoir, not the means by which the water is stored. The county isn't *using* the farm's destruction to make water; the destruction just happens to occur.
      *   **Kidney Lottery:** **Not Fine.** The losers are being used *as means*. Their kidneys are the resource required to save the patients. Without their specific loss, the goal isn't achieved.
  *   **Weakness:** It struggles slightly with the *Tax* case if you view taxation as "taking" (means) rather than "levying" (side effect), but generally fits well.

  ### Candidate Rule 2: Separateness of Persons (Anti-Aggregation)
  **The Rule:** You cannot sacrifice one identifiable person's vital interests to aggregate small benefits for many others. We are distinct individuals, not vessels for a "greater good." Exceptions exist if the burden is shared universally or involves fungible goods (like money) rather than vital interests.
  *   **Fit with Past Cases:**
      *   *Trolley:* Often accepted here because it's a choice between two groups in an emergency, not singling one out from the population. (**Fine**)
      *   *Footbridge/Surgeon:* Clear violation. One specific person is sacrificed for others. (**Not Fine**)
      *   *Tax:* Accepted because property is fungible and distributive justice allows redistributing wealth for vital needs (healthcare). (**Fine**)
      *   *Pill:* Accepted because the burden is *universal*. No one is singled out; everyone shares the cost. (**Fine**)
  *   **Predictions:**
      *   **Flooded Valley:** **Not Fine.** This is the strongest test. One identifiable family suffers a catastrophic, irreplaceable loss (generational home) for *marginal* economic benefits scattered across a million others. This is the exact "aggregation" violation this rule forbids.
      *   **Kidney Lottery:** **Not Fine.** Specific individuals are singled out (the "losers") to suffer a catastrophic bodily loss for the benefit of others. The fact that everyone entered the lottery doesn't change that the actual burden falls on a few.
  *   **Weakness:** It has to explain why the *Trolley* case is okay (since one person dies), usually by arguing the five were also under threat, so no one was "singled out" from safety.

  ### Candidate Rule 3: Institutional Authority vs. Private Acts
  **The Rule:** Private individuals are bound by strict constraints against harming others (bodily integrity). The State, however, is permitted to impose burdens for public welfare, provided it acts through general policy rather than targeting specific bodies for destruction.
  *   **Fit with Past Cases:**
      *   *Trolley/Footbridge/Surgeon:* These are framed as individual acts. The Trolley is allowed as an emergency exception (redirecting threat), but pushing/killing is forbidden. (**Mixed**)
      *   *Tax/Pill:* These are State policies. (**Fine**)
  *   **Predictions:**
      *   **Flooded Valley:** **Fine.** This is a County/State project (Eminent Domain). It involves property, not bodily integrity. The State has the authority to trade property for public infrastructure.
      *   **Kidney Lottery:** **Not Fine.** Even if run by the State, this violates bodily integrity. The "State Policy" exception usually covers taxes and regulations, not harvesting organs.
  *   **Weakness:** It relies on a somewhat arbitrary line between "property burdens" (State OK) and "bodily burdens" (State Not OK), though her record supports this distinction.

  ---

  ### The Verdicts & The Discriminator

  Here is the scorecard for the two new cases:

  | Case | Rule 1: Double Effect | Rule 2: Separateness of Persons | Rule 3: State Authority |
  | :--- | :--- | :--- | :--- |
  | **1. Flooded Valley** | **Fine** (Side Effect) | **Not Fine** (Identifiable Loss) | **Fine** (State/Property) |
  | **2. Kidney Lottery** | **Not Fine** (Means) | **Not Fine** (Singled Out) | **Not Fine** (Bodily Integrity) |

  **Which case is the better discriminator?**
  **The Flooded Valley.**
  The Kidney Lottery is a "false friend." All three plausible rules predict she will say **"Not Fine."** It looks like a Surgeon case (using bodies as means), a Separateness case (sacrificing the few), and a Bodily Integrity case. It won't tell you *which* rule she is using, only that she rejects utilitarianism on bodily harm.

  The Flooded Valley is the true test.
  *   If she says **"Fine,"** she is running **Double Effect** or **State Authority**. She believes collateral damage to property is acceptable for public utility.
  *   If she says **"Not Fine,"** she is running **Separateness of Persons**. She believes you cannot crush one identifiable family for diffuse, marginal gains, regardless of whether it's a "side effect."

  ### My Best Guess

  **She will say the Flood is Fine, and the Kidney Lottery is Not Fine.**

  **Reasoning:**
  The strongest clue in her track record is the **Wealth Tax** case. She called it "not even a close call."
  *   In the *Separateness of Persons* framework, taxing a small minority to help the majority is often controversial because it concentrates the burden.
  *   However, she accepted it easily. This suggests she is comfortable with **concentrated burdens** provided they are **financial/property** rather than **bodily**, and provided they are enacted via **policy** rather than **direct intervention**.

  The Flood case matches the Tax case structurally: A state entity imposes a concentrated property loss on a few for the benefit of the many. The fact that the farm is "irreplaceable" is emotionally potent, but logically, she already accepted that the wealthy minority's money (which represents their life's work/security) could be taken for healthcare.

  The Kidney Lottery, however, hits the **Bodily Integrity** constraint seen in the Surgeon and Footbridge cases. Even with the "lottery" aspect (which mimics the universal Pill case), the *outcome* is non-universal bodily violation. The Pill case was fine because *everyone* got sick. In the Kidney case, *everyone* risks, but only *some* bleed. That returns it to the Surgeon dynamic: specific bodies are being harvested.

  **Summary for Thanksgiving:**
  Ask her about the **Flood**.
  *   If she hesitates and talks about the "unfairness to the family," she's a **Separateness of Persons** theorist (and might actually reject the Tax case upon reflection).
  *   If she sighs and says, "It's tragic, but necessary for the water supply," she's running **Double Effect/State Authority**.

  My money is on the latter. She sounds like a pragmatic liberal who draws a hard line at bodily violence but allows the state to manage property and risk for the greater good.
