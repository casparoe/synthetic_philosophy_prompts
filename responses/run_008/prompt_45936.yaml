  My sister has alot of opinions and I'm finally trying to pin down what rule she's actually running. Her track record on old cases: diverting the runaway trolley from five people onto one, fine; shoving the big guy off the footbridge to stop the trolley, not fine; a surgeon quietly harvesting one healthy traveler's organs to save five patients, absolutely not fine; steeply taxing a small wealthy minority to fund everyone else's healthcare, fine, not even a close call for her; a nationwide program where every single person takes a pill that guarantees one rough day of illness in order to wipe out a disease that kills a few dozen people a year, fine.

  Two new cases coming up at thanksgiving. First, the county wants to flood a valley for a reservoir: one extended family loses a farm that's been theirs for six generations (they get full market compensation, but to them the place is irreplaceable), and a million people get marginally cheaper water and slightly better flood control. Nobody is aiming at the family; the harm just falls out of the project as a side effect. Second, a hypothetical a cousin keeps pushing: a kidney lottery, where everyone's name goes in and a handful of losers each give up a kidney to save several dialysis patients, with everyone knowing the odds going in and no opting out.

  What is she going to say about each? I'm honestly less interested in the answers than in the rules her record is consistent with — like a double-effect style rule where it matters whether the harm is the means or just a side effect, versus a separateness-of-persons style rule where what matters is whether one identifiable person's big loss is being outweighed by a pile of tiny benefits scattered across other people (the classic complaint about utilitarianism treating everyone's gains and losses as if they all belonged to one big person). And there might be a third rule too, something about state policies versus private acts, that fits her record just as well. Walk me through what each candidate rule predicts on both new cases, say which verdicts it gets wrong if any, give me your best guess for what she'll say with your reasons, and tell me which of the two cases would do the better job of catching her running one rule rather than another.
