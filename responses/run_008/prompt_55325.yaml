answer: |-
  This is a sophisticated question about the sociology and methodology of economic science, specifically regarding the "Path Dependence" debate (Paul David/Brian Arthur vs. Stan Liebowitz/Stephen Margolis).

  Here is a diagnosis of why the debate stalled, the nature of the disagreement, and the prospects for progress, adhering to your epistemic constraints.

  ### 1. The Structure of the Dispute

  The best capture of the dispute is a weighted combination, but the weights are uneven. It is primarily **(b) a conceptual dispute in disguise**, fought on the terrain of **(a) empirical history**, and fueled by **(d) policy proxy fights**. Option (c) is a symptom, not the cause.

  **Weighting:**
  *   **60% Conceptual (b):** The fundamental stall occurred because the two sides were operating with incompatible definitions of "efficiency."
  *   **30% Empirical (a):** The battle was fought over archives (typewriter tests, Dvorak speeds), but this was the *vehicle*, not the engine.
  *   **10% Policy Proxy (d):** The urgency was provided by antitrust sentiment, but the debate would likely have stalled anyway due to the theoretical impasse.

  **Reasons tied to positions:**
  The stall was not merely because the QWERTY case was debunked (though Liebowitz and Margolis did significant damage to the specific historical claims regarding Dvorak's superiority). The debate froze because Liebowitz and Margolis successfully shifted the burden of proof onto a definition of efficiency that makes "lock-in" logically impossible by fiat, while David and Arthur refused to accept that definition as normatively sufficient.

  Liebowitz and Margolis introduced the distinction between *inefficiency* and *remediable inefficiency*. Their argument: If switching costs (including coordination costs) exceed the benefits of switching, the status quo is efficient *given the institutional constraints*. To call it "inefficient" requires assuming a hypothetical coordinator (a social planner) who can costlessly organize the switch. Since no such agent exists in the market, claiming the market failed is a category error.

  David and Arthur's counter (often implicit in later work) is that this definition of efficiency is tautological. It treats the *outcome* of the path-dependent process as the justification for the *constraints* of that process. If network effects prevent the internalization of benefits during the adoption phase, the market price signals were wrong *ex ante*. Calling the result "efficient" because switching is now too costly ignores the dynamic inefficiency that created the high switching costs in the first place.

  Because neither side could force the other to accept their normative baseline for welfare analysis, the empirical evidence became secondary. If you accept Liebowitz/Margolis's definition, no amount of historical evidence proves inefficiency. If you accept David's definition, the high switching costs are evidence *of* the lock-in, not a defense against it.

  ### 2. The Hidden Formal Question

  **Confidence Level: High**

  Yes, there is a hidden formal question, and it is the primary reason the debate cannot be resolved by more archival case studies. The debate is waiting on an **identification condition for equilibrium selection in the presence of asymmetric information and transaction costs.**

  The formal gap is this: Standard welfare economics compares equilibria assuming agents maximize utility given constraints. Path dependence models (like Arthur's) show that systems with increasing returns have multiple equilibria. The unresolved formal question is: **Under what observable conditions can we distinguish between a "high switching cost" equilibrium (efficient given constraints) and a "coordination failure" equilibrium (inefficient due to missing markets)?**

  In the QWERTY debate, both sides observe the same state: Everyone uses QWERTY, and no one switches.
  *   **Critics' Model:** This is a Nash Equilibrium. No individual has an incentive to deviate. Therefore, it is efficient.
  *   **Proponents' Model:** This is a Local Maximum. The Global Maximum (Dvorak) is inaccessible due to a coordination barrier that the market failed to price *during the transition phase*.

  The missing theorem is a condition that allows an econometrician to look at a locked-in market and determine if the "lock" is due to genuine technological superiority (or high transition costs that reflect real resource use) versus a pure coordination failure that *could* have been arbitrated if property rights or contracting had been structured differently *ex ante*.

  Currently, we lack a testable condition that separates "the market correctly priced the coordination difficulty" from "the market failed to price the network externality." Without this, every claim of lock-in can be dismissed as "revealed preference" (if they wanted to switch, they would have pooled resources to do so), and every defense of the status quo can be dismissed as "historical accident."

  ### 3. What Would Count as Progress?

  **Confidence Level: Moderate (Judgment Call)**

  Given the diagnosis above, **a cleaner case study will not produce progress.** The QWERTY, VHS, and Beta cases are now "degenerate" data points; both sides have entrenched interpretations of them that are immune to new evidence.

  Progress would require **a formal model with testable conditions (Option 3)**, specifically one that moves from *ex post* historical narrative to *ex ante* prediction.

  *   **Why not case studies?** History is singular. We cannot re-run the 1890s typewriter market. Any new case study (e.g., specific software standards) will suffer the same counterfactual problem: we cannot know if the rival technology was genuinely superior or if the winner just got a head start.
  *   **Why not just a sharper definition?** Philosophers have sharpened the definitions for 30 years. The problem is operationalization.
  *   **The Path Forward:** Progress requires **structural estimation of network parameters.** We need models that can estimate the *size* of the network externality versus the *size* of the switching cost in real-time during a standard war. If we can observe a market tipping, and show that the tipping occurred *before* the network benefit exceeded the switching cost (driven purely by noise or early random adoption), that would satisfy the Proponents. If we can show that the tipping point aligns exactly with the point where expected network utility internalized the switching cost, that satisfies the Critics.

  However, I judge it likely that this dispute will **dissolve and re-form (Option 4)** whenever policy becomes live. The reason is that the "definition of efficiency" is not just a technical matter; it is a political one. When antitrust enforcement is aggressive, the David/Arthur definition (markets can fail dynamically) is legally useful. When deregulation is the goal, the Liebowitz/Margolis definition (markets are robust, switching costs are real costs) is legally useful. The "science" stalls because the "policy utility" fluctuates.

  ***

  ### Epistemic Appendix: Settled vs. Contested & Confidence Levels

  Per your request, I am separating the consensus view among specialists from the contested interpretations, and labeling my confidence in these diagnoses.

  **1. What is Settled (High Confidence)**
  *   **Network Effects Exist:** There is no serious dispute that network effects and increasing returns to scale exist and can lead to multiple equilibria. This is standard in industrial organization and complexity economics.
  *   **QWERTY is a Weak Example:** Among economic historians and specialists in the debate, the specific claim that QWERTY is strictly inferior to Dvorak in a way that proves *economic* lock-in is largely considered debunked or at least heavily qualified. The empirical case Paul David made in 1985 does not survive the scrutiny Liebowitz and Margolis applied.
  *   **Switching Costs are Real Costs:** Both sides agree that switching costs exist. The dispute is not about their existence, but their normative status in welfare analysis.

  **2. What Remains Contested (High Confidence)**
  *   **The Definition of Efficiency:** There is no consensus on whether an outcome is "inefficient" if it is a Nash Equilibrium but not a Global Optimum. Neoclassical welfare economics generally sides with the Critics (if you can't profitably move, it's efficient). Evolutionary/Complexity economics sides with the Proponents (the basin of attraction matters).
  *   **Remediability:** There is no agreement on how to determine if a lock-in is "remediable." The Critics argue that if a remedy hasn't emerged, it's too costly. The Proponents argue that transaction costs *prevent* the remedy from emerging, masking the inefficiency.

  **3. Judgment Calls (Moderate Confidence)**
  *   **Why the Debate Stalled:** I am moderately confident that the *conceptual* impasse (definition of efficiency) was more decisive than the *empirical* exhaustion (QWERTY facts). While the empirical defeat of QWERTY removed the movement's "poster child," the theoretical framework of path dependence remains widely cited in tech policy. The stall is due to the incommensurability of the welfare standards, not just the lack of new data.
  *   **Prospects for Progress:** I am less confident that a formal model will resolve this. Often, when disputes are this deeply rooted in normative definitions of welfare, formal models simply become new weapons for the same fight (e.g., each side citing different assumptions in the model). It is equally likely that the debate will simply remain dormant until the next major antitrust case involving network effects (e.g., Big Tech) revives the political utility of the "lock-in" argument.

  **4. Framing Caution (High Confidence)**
  *   **No Consensus on "Who Won":** It is incorrect to state that Liebowitz and Margolis "won" the debate in a scientific sense. They won the battle over the specific QWERTY history, but they did not disprove the theory of path dependence. Conversely, it is incorrect to state that David "lost" the theoretical argument; path dependence is a standard concept in modern growth theory and tech economics, even if QWERTY is no longer the proof case.
  *   **Tacit Concessions:** Both sides claim the other conceded. Critics say Proponents admitted QWERTY wasn't locked in. Proponents say Critics admitted lock-in is possible in theory, just not in that case. Neither claim is fully accurate. The Proponents generally maintain that *some* cases exist (even if not QWERTY), and the Critics maintain that *no* cases of "remediable inefficiency" have been proven. There was no mutual concession on the core theory.
