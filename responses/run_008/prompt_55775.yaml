      *   *Smuggled Premises?* Yes. The definition of "existence" or "reality." Just because an event is on a simultaneity slice for *someone* doesn't mean it's causally fixed or ontologically settled in a way that implies determinism. Also, the assumption that "presentism" (only now exists) is incompatible with SR is debated (e.g., neo-Lorentzian views, though unpopular).
