          *   As $v \rightarrow c$, the slope $t/x$ approaches $1/c$. This line stays within the light cone? No, simultaneity lines are spacelike. They sweep through the "Elsewhere" region.
          *   Can they reach *any* future event? No. They can only reach events that are spacelike separated from the "here-now". They cannot reach events inside your future light cone.
          *   *Correction:* Putnam's argument usually relies on a chain of observers or the idea that *some* event in your future is simultaneous with *some* observer's now. But strictly speaking, an observer passing *you* at *this moment* has a simultaneity plane that is spacelike. It intersects your future worldline? No. It intersects the worldlines of distant objects.
