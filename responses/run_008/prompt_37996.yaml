answer: |-
  Here is the diagnosis of your friend's epistemology, the prediction for her verdict, and the test case to split the competing readings.

  ### 1. The Verdict
  She will grade the colleague **Wrong (Ehrlich-tier)**.

  She will reject the "Hubbert-ish" defense that births are "locked in." While the mothers for 2040 are alive today, the mothers for 2150 are not. Predicting fertility rates for 2150 requires assuming that current socio-economic behaviors (urbanization, female labor participation, cost of child-rearing) are fixed laws of nature rather than variables subject to policy, culture, or economic adaptation.

  To her, this is the exact same category error as Ehrlich: treating a **snapshot of a behavioral variable** as a **physical constraint**. She will view the "managing contraction" narrative as a story built on a refuted premise. She will not offer "Wrong-but-respectable" (Malthus) unless the colleague explicitly frames it as a conditional scenario (which the prompt says they don't), because Malthus gets charity for identifying a biological tension, whereas Ehrlich gets none for ignoring technological substitution. Fertility collapse is treated here as technological substitution (social tech) being ignored.

  ### 2. The Rule She Is Running
  Your two readings are close, but they miss the unifying principle that explains why Hubbert is "Right" while Malthus is "Wrong."

  **The Rule is: Scope Integrity (Exogenous Constraint vs. Endogenous Variable).**

  She grades a prediction **Right** only if the predictor correctly identifies the **system boundary** and the constraint within that boundary is **exogenous** (physics, geology, biology of existing stock).
  She grades a prediction **Wrong** if the predictor treats an **endogenous** variable (price, preference, policy, yield) as an exogenous constraint.

  *   **Hubbert (Right):** He defined the scope as *US Lower 48 Geology*. Geology is exogenous. Markets cannot create new oil; they can only change how/when we extract it. Fracking is a market/tech response *outside* his scope. He maintained Scope Integrity.
  *   **Ehrlich (Wrong):** He defined the scope as *Global Food System*, but treated *Yield* as exogenous. Yield is endogenous (responds to R&D, price). He violated Scope Integrity.
  *   **Malthus (Wrong-but-Respectable):** He identified a biological tension (reproduction vs. metabolism). The logic was sound, but he treated *Land Productivity* as exogenous when it was endogenous to technology. He gets charity for the mechanism, but the grade is Wrong.
  *   **Colleague (Wrong):** They define the scope as *Global Population*, but treat *Fertility Preference* as exogenous. Fertility is endogenous (responds to policy, culture, economics). Like Ehrlich, they are treating a behavioral snapshot as a law of nature.

  **Why Reading B is the better bet:**
  Reading A ("Rescue reputation when mechanism real") is the *output* of her rule, not the rule itself. Reading B ("Side with whoever treated the mechanism as real") is closer, but it needs the qualifier: **"Side with whoever treated the mechanism as a hard constraint within a correctly defined scope."**
  Hubbert wins because he admitted the market could adapt, he just said the *geology* wouldn't. The Colleague loses because they are implying the *people* won't adapt.

  ### 3. The Splitting Case
  To cleanly separate Reading A (Mechanism Reputation) from Reading B (Scope/Constraint Integrity), you need a case where the **mechanism is real**, but the **constraint is ambiguous** between physical and economic.

  **The Case: "We will hit the limit of Battery Energy Density by 2030."**

  *   **Scenario:** A predictor claims lithium-ion chemistry cannot exceed 300 Wh/kg due to thermodynamic limits (Exogenous/Physics).
  *   **Outcome:** By 2035, we have 500 Wh/kg batteries.
  *   **The Twist:** The improvement didn't come from breaking physics, but from switching to a completely different chemistry (e.g., Solid State or Lithium-Sulfur) that was known but deemed too expensive/difficult until the "limit" spurred investment.

  **How the Readings Diverge:**
  *   **Reading A (Mechanism Reputation):** The mechanism (chemical energy storage limits) was real. The system adapted (new chemistry). **Verdict: Wrong-but-respectable.** (Similar to Malthus).
  *   **Reading B (Scope Integrity):** Did the predictor claim "Lithium-Ion Density" or "General Battery Density"?
      *   If they claimed "Lithium-Ion," they are **Hubbert-Right** (Geology of Li-Ion peaked).
      *   If they claimed "Battery Density" generally, they are **Ehrlich-Wrong** (They treated the *current dominant tech* as the *physical limit*).

  **Why this splits them:**
  Your friend's history suggests she cares deeply about whether the predictor invited the adaptation or was surprised by it.
  *   If the predictor said, "Li-Ion is done, find something else," she calls them **Right** (Hubbert).
  *   If the predictor said, "Batteries are done, civilization stalls," she calls them **Wrong** (Ehrlich).

  **The Cleanest Split:**
  Ask her about **Moore's Law**.
  *   *Claim:* "Transistor density will double every two years until 2025."
  *   *Reality:* It slows down due to heat/physics, but compute power continues via 3D stacking/parallelization.
  *   *Reading A:* Mechanism (miniaturization) was real, adaptation (architecture) happened. **Respectable.**
  *   *Reading B:* If the predictor defined it as "Planar Density," they are **Right**. If they defined it as "Compute Growth," they are **Wrong** (because they conflated a specific implementation with the function).

  If she says Moore's Law predictors are **Right**, she is running **Reading B (Scope Integrity)**.
  If she says they are **Wrong-but-Respectable**, she is running **Reading A (Mechanism Charity)**.
  Given her Hubbert verdict, I bet she says **Right**, provided the predictor specified *the specific technology* rather than *the economic outcome*.
