prompt: |-
  I've recently been made head of analytics at a regional hospital network, and I keep landing in the same argument with our chief medical officer. The question is which number the executive committee should act on: the network-wide figure — readmission rates, mortality for a procedure, patient satisfaction — or the same data partitioned by ward, by case severity, by demographic. Twice now the aggregate and the breakdown have pointed in opposite directions, and each time the debate gets resolved by whoever argues loudest rather than by any principle. Please write me a decision procedure my team can actually run on a report before it goes upstairs: the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates in "report the aggregate," where in "report the breakdown," and where it must flag that the choice is not statistical at all — that whether the partitioning variable is a confounder, a mediator, or merely a descriptor of no causal relevance is doing all the work, and that someone with substantive clinical judgment has to make the call. Two constraints: it has to be runnable in under an hour by analysts whose causal-inference training amounts to a half-day briefing (so no formal causal graphs, though plain-language versions of the reasoning behind them are fine), and it must include a step for what to do when the partition was chosen after seeing the data, since an analyst who slices enough ways can reverse almost anything. Then run it on two real-feeling cases for me: one where the aggregate makes our flagship cardiac unit look better than the regional average but severity-stratified figures make it look worse, and one where a hand-hygiene initiative shows a clear effect network-wide but no effect within any single ward — and make at least one of the two come out in a direction I won't like. Finish by telling me where the procedure is most likely to misfire and give us the wrong number in front of the committee.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Head of Analytics at a regional hospital network.
      *   **Problem:** Recurring conflict with the Chief Medical Officer (CMO) about whether to report aggregate (network-wide) data or stratified (partitioned) data (Simpson's Paradox scenarios).
      *   **Goal:** A decision procedure (checklist/flowchart) for analysts to determine which number to present.
      *   **Constraints:**
          *   Runnable in under 1 hour.
          *   Analysts have limited causal inference training (no formal DAGs, plain language only).
          *   Must address "data dredging" (partition chosen after seeing data).
          *   Must distinguish between confounder, mediator, and irrelevant descriptor.
          *   Must include two "real-feeling" case studies (Cardiac/Severity, Hand-Hygiene/Ward).
          *   One case must yield an unfavorable conclusion for the user (Head of Analytics).
          *   Must conclude with limitations/failure modes of the procedure.

  2.  **Develop the Decision Procedure (The "Simpson's Protocol"):**

      *   *Objective:* Guide analysts through a logical sequence to decide between Aggregate vs. Stratified.
      *   *Step 1: The Reversal Check.* Does the direction actually flip? If not, report aggregate (simpler is better).
      *   *Step 2: The Timing Check (Data Dredging).* Was the split planned *before* looking at the outcome? If no, high skepticism.
      *   *Step 3: The Causal Role Check (Plain Language).* Is the grouping variable a Confounder (cause of both treatment and outcome), a Mediator (caused by treatment, leads to outcome), or Noise?
          *   Confounder -> Stratify.
          *   Mediator -> Aggregate (usually, because stratifying blocks the effect).
          *   Noise/Descriptor -> Aggregate.
      *   *Step 4: The Sample Size/ Stability Check.* Are the subgroups large enough to be reliable?
      *   *Step 5: The Actionability Check.* Can the committee actually *do* something about the subgroups?
      *   *Decision Nodes:* Clear criteria for stopping at "Aggregate," "Stratified," or "Escalate to Clinical Judgment."

  3.  **Drafting the Procedure (Iterative Refinement):**

      *   *Constraint Check:* Keep it simple. Avoid terms like "collider bias" or "do-calculus." Use "Common Cause," "Middleman," and "Coincidence."
      *   *Timing:* Emphasize the "pre-registration" aspect loosely (planned analysis vs. fishing).
      *   *Causal Logic:* This is the crux. I need to make sure the analysts understand *why* we stratify.
      *   *Refinement:* Add a specific "Stop & Escalate" condition for when the causal role is ambiguous.

  4.  **Developing Case Study 1: Cardiac Unit vs. Severity (Simpson's Paradox Classic).**

      *   *Scenario:* Flagship Cardiac Unit looks good overall, bad when stratified by severity.
      *   *Mechanism:* Flagship takes harder cases (tertiary care). Severity is a *confounder* (influences selection into unit and risk of death).
      *   *Procedure Outcome:* Stratify. The aggregate is misleading.
      *   *User Preference:* The prompt asks for one outcome the user "won't like." As Head of Analytics, I might want to show the network is doing well (Aggregate). But the truth (Stratified) shows the flagship is underperforming on comparable cases. This is unfavorable.
      *   *Wait, let's adjust:* If I'm Head of Analytics, I probably want to present the most accurate data. But usually, leadership wants good news. Let's make the "unfavorable" one about the *Hand Hygiene* case (Case 2) or make the Cardiac case show the flagship is *worse* (which is bad for the hospital reputation). Let's go with the Cardiac case showing the flagship is actually worse when adjusted. That's bad news for the hospital, which the CMO might fight, but the procedure demands it.
      *   *Actually, re-reading the prompt:* "make at least one of the two come out in a direction I won't like." If I'm Head of Analytics, I want to be right. If the procedure tells me to report the Aggregate, but I *wanted* to show the nuance (or vice versa).
      *   *Better interpretation:* The "direction I won't like" implies political friction. If the procedure says "Report Aggregate" but the CMO wants "Stratified" (to hide a problem), or vice versa.
      *   *Decision:* Let's make Case 2 (Hand Hygiene) the one where the procedure says "Report Aggregate" (Effect exists), but the breakdown shows nothing. This is the *ecological fallacy* or simply low power in subgroups. If the procedure says "Report Aggregate," but the wards are screaming "it didn't work for us," that's a tough spot.
      *   *Wait, simpler:* Let's make Case 1 (Cardiac) conclude "Report Stratified." This reveals the flagship unit is actually performing *worse* than average on comparable patients. This is bad news for the hospital leadership (including me).
      *   *Case 2 (Hygiene):* Let's make this one conclude "Report Aggregate." The initiative worked overall, but noise in wards hid it. This is good news.
      *   *So Case 1 is the "unfavorable" one.*

  5.  **Developing Case Study 2: Hand Hygiene Initiative.**

      *   *Scenario:* Network-wide infection rate drops. Within each ward, no significant drop.
      *   *Mechanism:* This is often a power issue or composition shift. But the prompt asks about partitioning. If the effect is real overall but not in wards, it might be that the *mix* of wards changed (e.g., high-risk wards got more resources/staffing changes alongside hygiene).
      *   *Wait, Simpson's Paradox works both ways.*
      *   *Scenario:* Overall: Hygiene reduced infections. Stratified by Ward: No effect.
      *   *Why?* Maybe the "Ward" variable is a *mediator* or the stratification creates small sample sizes (unstable). Or, more likely, this is a case where the Aggregate is the truth because the intervention was network-wide culture change, not ward-specific.
      *   *Causal Role:* Ward is a descriptor. The treatment is "Network Initiative."
      *   *Procedure Outcome:* Report Aggregate.
      *   *Twist:* What if the prompt implies the *reverse* Simpson's? (Aggregate says No Effect, Stratified says Effect).
      *   *Let's stick to the prompt's description:* "hand-hygiene initiative shows a clear effect network-wide but no effect within any single ward."
      *   *Analysis:* If the effect is real overall, but vanished in strata, it suggests the strata are too small (power issue) or the variable "Ward" isn't a confounder.
      *   *Procedure Verdict:* Report Aggregate.

  6.  **Refining the "Unfavorable" Constraint:**

      *   If I am Head of Analytics, I want to provide insight. If the procedure forces me to report that our Flagship Cardiac Unit is actually *worse* than the region (after adjustment), that is politically painful and "unfavorable" to me as a leader trying to maintain stakeholder trust.
      *   Alternatively, if the procedure tells me to ignore the breakdown (Cardiac) and report the Aggregate (which looks good), but I *know* the breakdown is the truth, that undermines my integrity.
      *   *Best fit:* The Cardiac case concludes "Report Stratified." This reveals poor performance in the flagship unit. This is unfavorable to the hospital's reputation and my position as a supporter of clinical excellence.

  7.  **Addressing the "Data Dredging" Constraint:**

      *   Need a specific step: "The Pre-Specification Test." Did we plan to slice by this variable before running the numbers? If not, penalty/burden of proof increases.

  8.  **Addressing the "Causal Role" Constraint:**

      *   Need plain language for Confounder (Risk Factor + Selection), Mediator (Pathway), Collider (Outcome of both - avoid conditioning).
      *   Keep it to: "Did this factor exist *before* the treatment/outcome?" (Confounder/Descriptor) vs "Did this happen *because* of the treatment?" (Mediator).

  9.  **Drafting the Content:**

      *   *Title:* The Simpson's Protocol.
      *   *Steps:* 1. Reversal Confirmation. 2. Pre-Specification. 3. Causal Role (The "When" Test). 4. Stability. 5. Actionability.
      *   *Case 1:* Cardiac. Severity is a Confounder (exists before treatment). Procedure says Stratify. Result: Flagship looks worse. (Unfavorable).
      *   *Case 2:* Hygiene. Ward is a Descriptor/Cluster. Effect is global. Stratification kills power. Procedure says Aggregate. Result: Initiative worked.
      *   *Failure Modes:* Where does this break? Hidden confounders, measurement error, political pressure overriding the protocol.

  10. **Review against Constraints:**

      *   *Under 1 hour?* Yes, it's a checklist.
      *   *No formal causal graphs?* Yes, using "Before/After" and "Common Cause" language.
      *   *Data Dredging?* Included in Step 2.
      *   *Two Cases?* Yes.
      *   *One Unfavorable?* Yes (Cardiac performance).
      *   *Failure Modes?* Yes, at the end.

  11. **Final Polish:**

      *   Tone: Professional, direct, actionable.
      *   Ensure the distinction between Confounder and Mediator is clear for non-experts.
      *   Make sure the "Escalate" condition is prominent.

  **(Self-Correction during drafting):** I need to be careful with the Hand Hygiene case. If the effect is clear network-wide but *no* effect within wards, that sounds like the ecological fallacy or simply low power. If the procedure says "Report Aggregate," but the wards are the unit of implementation, is that right?
  *Reasoning:* If the intervention was network-wide (e.g., new soap dispensers everywhere), the "Ward" is just a clustering variable. If the sample size per ward is too small to detect the effect, stratifying hides the truth. The causal role of "Ward" is not a confounder of the *intervention* (since everyone got it). It's just a grouping. So Aggregate is correct.
  *Wait, one nuance:* If the aggregate shows improvement, but *every* ward shows no improvement (or worsening), that is mathematically impossible unless the *weights* changed (e.g., high-infection wards shrank, low-infection wards grew). This is Simpson's Paradox in reverse.
  *Let's construct it carefully:* Network-wide infection rate dropped 20%. Within each ward, rate stayed flat. How? The network closed two high-infection ICUs and opened a low-infection outpatient surgery center. The "Ward" mix changed.
  *In this case:* "Ward" is a confounder of the *time period* comparison. We must stratify to see the truth.
  *Wait, the prompt says:* "initiative shows a clear effect network-wide but no effect within any single ward."
  *If I follow the prompt literally:* Aggregate = Good. Stratified = Null.
  *If this is Simpson's:* It means the composition shifted. The "Good" aggregate is an illusion caused by shifting patient mix (e.g., fewer sick patients overall).
  *Decision:* In this specific case, the Aggregate is misleading. The procedure *should* catch this. If the procedure says "Report Aggregate," it fails. If the procedure says "Stratify," it reveals the initiative didn't work.
  *Let's make the Procedure robust:* If the variable (Ward) affects the baseline risk, it's a confounder. We must stratify.
  *Okay, let's flip the Case 2 outcome to be the "Unfavorable" one?*
  *No, let's stick to the Cardiac one being unfavorable.* It's more classic. Flagship looks good (Aggregate) but is actually bad (Stratified).
  *For Case 2:* Let's make it so the Aggregate is actually the correct one to report, despite the wards showing nothing. Why? Low power. The initiative *did* work, but wards are too small to show it. This validates the network-wide push.
  *Wait, if Aggregate says Yes and Stratified says No, and I report Aggregate:* I am claiming success.
  *If I report Stratified:* I am claiming failure.
  *Which is true?* If the sample size is the issue, Aggregate is true. If the composition shift is the issue, Stratified is true.
  *Let's go with Low Power.* The initiative worked. Wards are too small to see it. Report Aggregate. This is "Good News."
  *Case 1 (Cardiac):* Severity is a confounder. Report Stratified. This is "Bad News" (Flagship underperforming).
  *This fits the "one direction I won't like" constraint.*

  12. **Final Review of the "Causal" Step:**
      *   Analysts can't do DAGs.
      *   Use the "Time Travel Test." Did the grouping variable exist *before* the patient arrived/was treated?
      *   Yes + Affects Outcome = Confounder (Stratify).
      *   No (happened during treatment) = Mediator (Aggregate).
      *   Yes + Doesn't Affects Outcome = Noise (Aggregate).

  13. **Final Review of "Data Dredging":**
      *   Step 2: "The Fishing Test." If you tried 10 variables to find a reversal, you must penalize confidence.

  14. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  # The Simpson's Protocol: A Decision Procedure for Aggregate vs. Stratified Reporting

  **Purpose:** To resolve conflicts between network-wide (aggregate) and partitioned (stratified) metrics without relying on volume of argument.
  **Time Required:** 45–60 minutes per report.
  **Users:** Analytics Team (Basic Causal Literacy).

  ---

  ## Part 1: The Decision Procedure

  Run these five steps in order. Do not skip. If any step triggers a **STOP**, follow the instruction.

  ### Step 1: The Reversal Confirmation
  **Question:** Does the direction of the effect *actually* flip, or does the significance just vanish?
  *   **Action:** Calculate the effect size and confidence intervals for both the Aggregate and the Stratified (weighted average) views.
  *   **Pass:** The sign flips (e.g., Aggregate is positive, Stratified is negative) OR the significance changes drastically (e.g., Aggregate $p < 0.05$, Stratified $p > 0.5$).
  *   **Fail:** The numbers move slightly but tell the same story.
  *   **Decision:** If **Fail**, **REPORT AGGREGATE**. (Simpson's Paradox is not present; simplicity wins). If **Pass**, proceed to Step 2.

  ### Step 2: The Fishing Test (Data Dredging Check)
  **Question:** Was this specific partition (ward, severity, demographic) defined *before* the data was pulled?
  *   **Evidence:** Look for a pre-analysis plan, a committee request ticket, or a standard operating procedure (SOP) that mandates this breakdown.
  *   **Pass:** Yes, this is a standard KPI breakdown or was requested prior to analysis.
  *   **Fail:** No, an analyst sliced the data five different ways until this reversal appeared.
  *   **Decision:** If **Fail**, **FLAG FOR ESCALATION**. Do not report either number yet. Note: *"Partition selected post-hoc. High risk of spurious correlation."* Send to Clinical Lead for validation before proceeding to Step 3. If **Pass**, proceed to Step 3.

  ### Step 3: The "Time Travel" Test (Causal Role)
  **Question:** Did the grouping variable exist *before* the treatment/event started, and does it influence the outcome?
  *   **Instruction:** Ask the clinical lead: "Did the patient have this characteristic (severity, ward, age) before we treated them, and does it change their risk of the outcome regardless of our treatment?"
  *   **Scenario A (Confounder):** Yes, it existed before, and Yes, it changes risk. (Example: Disease Severity, Age, Comorbidities).
      *   **Decision:** **REPORT STRATIFIED.** The aggregate is misleading because the groups are unbalanced.
  *   **Scenario B (Mediator):** No, it happened *because* of the treatment. (Example: Length of Stay, Complications during surgery).
      *   **Decision:** **REPORT AGGREGATE.** Stratifying blocks the pathway of the effect you are trying to measure.
  *   **Scenario C (Descriptor/Noise):** Yes, it existed before, but No, it doesn't clinically change risk.
      *   **Decision:** **REPORT AGGREGATE.** Stratifying adds noise without reducing bias.
  *   **Uncertain:** If the clinical lead cannot agree on the role.
      *   **Decision:** **FLAG FOR ESCALATION.** Label: *"Causal mechanism disputed. Requires Clinical Committee ruling."*

  ### Step 4: The Stability Check
  **Question:** Are the subgroups large enough to be trusted?
  *   **Action:** Check the $N$ per stratum.
  *   **Pass:** Each stratum has sufficient power (e.g., >30 events per variable, or confidence intervals are reasonably tight).
  *   **Fail:** Subgroups are tiny; confidence intervals are massive.
  *   **Decision:** If **Fail**, **REPORT AGGREGATE** (with a footnote warning about subgroup instability). Stratified noise is more dangerous than aggregate bias in small samples. If **Pass**, proceed to Step 5.

  ### Step 5: The Actionability Test
  **Question:** Can the Executive Committee actually act on the stratified data?
  *   **Instruction:** If you report the breakdown, can they allocate resources differently to the specific groups identified?
  *   **Pass:** Yes. (e.g., They can fund specific wards, or change triage protocols for severity levels).
  *   **Fail:** No. (e.g., The policy is network-wide mandatory compliance; they cannot treat wards differently).
  *   **Decision:** If **Fail**, **REPORT AGGREGATE** (but include stratified data in the appendix for context). If **Pass**, **REPORT STRATIFIED**.

  ---

  ## Part 2: Case Applications

  ### Case 1: The Flagship Cardiac Unit (Severity Stratification)
  **The Data:**
  *   **Aggregate:** Flagship Cardiac Unit mortality is 3.5%. Regional Average is 4.0%.
      *   *Initial Take:* Flagship is outperforming the network.
  *   **Stratified (by Case Severity):**
      *   Low Severity: Flagship 1.0% vs. Regional 0.8% (Worse)
      *   High Severity: Flagship 6.0% vs. Regional 5.0% (Worse)
      *   *Initial Take:* Flagship is underperforming in every category.

  **Running the Protocol:**
  1.  **Reversal:** **Pass.** Direction flips from "Better" to "Worse."
  2.  **Fishing:** **Pass.** Severity adjustment is a standard SOP for cardiac reporting.
  3.  **Time Travel:** **Scenario A (Confounder).** Severity exists *before* treatment. It dictates both which hospital the patient goes to (Flagship takes harder cases) and the risk of death.
      *   *Protocol Verdict:* **REPORT STRATIFIED.**
  4.  **Stability:** **Pass.** High volume unit.
  5.  **Actionability:** **Pass.** Committee can investigate clinical protocols at the Flagship.

  **Outcome:** You must report that the **Flagship Unit is underperforming.**
  **Why you won't like it:** As Head of Analytics, presenting data that suggests your premier unit is failing—despite the "good news" aggregate—is politically dangerous. It invites scrutiny on your team's data quality and strains relations with the Cardiac Chief. However, the protocol dictates that Severity is a confounder; the aggregate number is an illusion caused by the Flagship cherry-picking (or being assigned) harder cases.

  ### Case 2: The Hand-Hygiene Initiative (Ward Stratification)
  **The Data:**
  *   **Aggregate:** Network-wide HAI (Hospital-Acquired Infection) rate dropped 15% post-initiative ($p < 0.01$).
  *   **Stratified (by Ward):** 12 Wards analyzed. 0 show statistically significant drops. 3 show slight increases.
      *   *Initial Take:* The initiative failed locally; the aggregate is a lie.

  **Running the Protocol:**
  1.  **Reversal:** **Pass.** Significance vanishes in strata.
  2.  **Fishing:** **Pass.** Ward-level reporting is standard operational metrics.
  3.  **Time Travel:** **Scenario C (Descriptor/Noise) with Power Issues.** "Ward" exists before treatment. However, the intervention was *network-wide culture change*, not ward-specific. The variation in infection rates between wards is high, but the *effect* of the soap dispensers is uniform.
      *   *Crucial Analyst Check:* The sample size per ward is small (avg 5 infections/month). The "No Effect" finding is likely a Type II error (false negative) due to low power, not a true lack of effect.
      *   *Protocol Verdict:* **REPORT AGGREGATE.** (Step 4 Stability Check fails for strata).
  4.  **Stability:** **Fail.** Subgroups are too small to detect a 15% shift reliably.
  5.  **Actionability:** **Fail.** The initiative was a blanket policy; you cannot roll it back in specific wards based on noisy data.

  **Outcome:** You report the **Initiative was a Success.**
  **Why this is tense:** The Ward Managers will argue the data doesn't reflect their reality. However, the protocol identifies that the stratification is statistically unstable and the variable "Ward" is not a confounder of the *intervention's efficacy*, merely a source of baseline noise.

  ---

  ## Part 3: Failure Modes (Where this Procedure Will Misfire)

  Even with this protocol, you will be wrong. Here is where the procedure is most vulnerable:

  **1. The "Hidden Confounder" in the Stratified View**
  In Case 2 (Hygiene), we assumed "Ward" was just noise. But what if the wards that showed *increased* infections also underwent staffing cuts during the same period? The protocol tells you to Report Aggregate because "Ward" isn't a confounder of the *hygiene* effect. But if "Staffing Level" is a confounder *within* the wards, the Aggregate masks a failure in specific locations. The protocol relies on the "Time Travel" test being answered honestly and completely by clinical leads. If they miss a variable (Staffing), you report a false success.

  **2. The Political Override of Step 3**
  The "Time Travel" test requires clinical judgment. A determined CMO can argue that Severity is a *Mediator* (e.g., "Our coding practices changed, making patients look sicker") rather than a Confounder. If they convince the committee that the variable is a Mediator, the protocol forces you to Report Aggregate. The procedure cannot stop a senior clinician from redefining the causal mechanism to suit a narrative.

  **3. The "Actionability" Trap (Step 5)**
  In Case 1, the protocol says Report Stratified because the Committee *can* act. But if the Committee *refuses* to act on stratified data (e.g., they only bonus based on network-wide margins), reporting the stratified number creates organizational cognitive dissonance without utility. The procedure assumes rational actors; it does not account for incentive structures that punish nuance.

  **Recommendation:** When you present the report, attach the "Simpson's Protocol" checklist as an appendix. If the Committee chooses to ignore the protocol's recommendation, require that the minutes record *which step was overridden* and *by whom*. This shifts the burden of causal error from your analytics team to the decision-makers.
