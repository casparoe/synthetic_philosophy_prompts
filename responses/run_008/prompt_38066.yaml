      "Three times the stake," I said, stirring my coffee. "Heads I triple, tails I lose. One flip. No reruns."

      My nephew didn't look up from his notebook. "Kelly says twenty-five percent. Don't let the variance kill you."

      "Variance doesn't kill you on a single flip, Leo. Either I win or I lose." I leaned back. "Here's the thing. Either my utility for money is linear, in which case I bet the whole $600,000 because the expectation is positive. Or it isn't. If it's logarithmic, I bet a quarter. But that's just Expected Utility maximization with a specific function. You're dressing up a preference as a law of physics."

