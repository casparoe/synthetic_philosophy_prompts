      "But I won't go broke on a quarter stake."

      "No, but the logic holds. Would you bet the whole pension on a 50/50 to double-or-nothing?"

      "Obviously not."

      "Why? The expectation is neutral. But you wouldn't do it because you know ruin ends the game. Kelly isn't a rival theory to utility; it's the derivation of utility from dynamics. You don't *choose* log utility; life imposes it because multiplicative growth with ruin constraints behaves logarithmically over time."

      "That's the leap," I said. "This isn't multiplicative growth over time. It's one event. What is the 'time average' of a single coin flip? It's just the outcome. You're treating a single draw as if it's the limit of infinite trials. That's the Gambler's Fallacy dressed in thermodynamic clothing."

      "It's not the bet that repeats, it's your life," Leo countered. "This bet is a perturbation on your remaining wealth trajectory. If you maximize ensemble average expectation, you risk paths that lead to zero. Time averages matter for a mortal. Peters shows that ensemble expectations diverge from time expectations in non-ergodic systems. Wealth is non-ergodic."

      "So you're saying I should act as if I'll face this bet forever?"

      "I'm saying you should act as if you want to remain in the game forever. Even if this specific wager doesn't repeat, the constraint of avoiding ruin does."

      I tapped the table. "Then we agree on the math, just not the metaphysics. You say 'time average dictates log utility.' I say 'I happen to have log utility.' The bet is the same. The fraction is the same. The only difference is whether you think you've discovered a new objective principle or just described my risk aversion."

      "It's objective," he insisted. "If you bet too much, you underperform almost all paths over time. It's geometry, not psychology."

      "But for *one* flip?" I pressed. "If I die tomorrow, what's the time average then?"

      Leo paused. "Then you maximize expectation for your heirs. But you don't plan to die tomorrow."

      "So the disagreement isn't the fraction," I said. "It's whether risk aversion is a subjective preference or an objective constraint of stochastic dynamics."

      "Exactly," he said. "Is utility in your head, or in the math?"

