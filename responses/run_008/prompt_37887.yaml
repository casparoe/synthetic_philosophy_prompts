answer: |-
  **The Code**

  David adjusted the clip on his hard hat and stepped into the hallway of the St. Jude Community Center. The air smelled of floor wax and old paper, a scent he associated with institutions that cared too much and had too little money. He checked his clipboard. The annual safety inspection was a formality, usually. Most places were compliant enough to pass, non-compliant enough to note. David prided himself on being thorough. He was not a man who overlooked things. To overlook a thing was to invite chaos.

  Mrs. Gable met him at the door. She was seventy, wearing a cardigan that had seen better decades, her hands clasped as if in prayer. She knew the drill. She knew David. They had done this dance for five years.

  "David," she said, smiling warmly. "Coffee?"

  "Later, perhaps," David said. He smiled back. He liked Mrs. Gable. She ran the center with a tireless grace, organizing meals for the elderly and tutoring for the children. She was a good woman. That was why it was important to be precise. Good people deserved safe buildings.

  He moved through the rooms with the rhythm of a practiced professional. Check the exit signs. Check the extinguishers. Check the load-bearing walls. He spoke softly, noting deficiencies in a neutral tone. A blocked aisle here. A burnt-out bulb there. Mrs. Gable nodded, scribbling on her own pad. There was no tension. They were partners in the maintenance of order.

  They reached the basement. This was the heart of the center, where the heating unit hummed and the children stored their art projects. David knelt by the main electrical panel. The metal was warm. He traced the conduit with a gloved finger until he found it: a frayed section of insulation near the junction box, exposed copper gleaming dullly in the beam of his flashlight.

  He paused. The Code, Section 4, Paragraph 12, addressed exposed wiring in accessible areas. It stipulated immediate remediation for hazards posing a direct threat of fire or shock. It also allowed for provisional compliance if the hazard could be isolated within twenty-four hours.

  David looked at the wire. Then he looked at the box of crayons stacked three feet away.

  Mrs. Gable leaned in. "Oh, dear. The janitor said he'd look at that. We've been waiting on a permit for the new conduit."

  "Permits take time," David said. His voice was even. He felt the weight of the clipboard in his left hand. It was a heavy, solid thing. It anchored him.

  "Can we isolate it?" Mrs. Gable asked. "I can wrap it tonight. We have the tape. The kids have a program tomorrow. If we close, they have nowhere to go."

  David stood up. He looked at the wire again. In his mind, the wire was not just copper and plastic. It was a fact. It existed outside of his opinion. The risk was a physical property, like gravity. If he left it, and a fire started, the fire would not care about Mrs. Gable's program. The fire would simply burn.

  "The Code requires immediate closure for exposed live conductors in common areas," David said.

  "Section 4 allows provisional compliance," Mrs. Gable said gently. "You've used it before. At the church hall."

  David blinked. He looked at the exit sign above the door. It was green and steady. He looked back at Mrs. Gable. She was not arguing; she was reminding him of his own capacity. For a second, the space between them opened up. He could see the choice sitting there, plain as the flashlight on the floor. He could pick up the pen. He could write *Provisional*. He could choose to trust her tape. He could choose to prioritize the program over the protocol.

  He felt the pen in his pocket. It was warm from his body heat.

  He looked at the wire. The fraying was irregular. The tape might hold. It might not. If he chose *Provisional*, he would be taking the risk onto himself. He would be the author of the safety. But safety was not something a man authored. Safety was something a man discovered. It was out there, in the walls and the wires. To pretend he could manage it with a checkbox was arrogance. The Code knew better than David. The Code had been written by men who understood fire.

  "The church hall had a different configuration," David said. "This is a high-traffic zone."

  He turned away from the wire. He turned his attention to the clipboard. The form required a signature. He uncapped the pen. The ink flowed black and permanent onto the white paper. He checked the box marked *Immediate Closure*. He did not feel heavy. He felt light. He was not closing the center. The wire was closing the center. He was merely the instrument through which the requirement was voiced.

  Mrs. Gable did not cry. She nodded, once. She understood that David did not make the rules. No one did. They were just there, like the hills or the weather.

  "I'll call the families," she said.

  "I'll help you move the sensitive equipment," David offered. "We shouldn't leave it down here."

  They spent the next hour carrying boxes up the stairs. David lifted the heavy crates of supplies. He was careful not to strain his back. He handed Mrs. Gable a tissue when her eyes watered from the dust. He was kind. He was helpful. He was doing exactly what was required of him.

  When he left, the sun was setting. He sat in his truck and placed the clipboard on the passenger seat. He started the engine. He thought about the wire. It would be fixed now. The building would be safe. The value of safety had been preserved. He had not damaged it with his hesitation. He had served it.

  He drove home to dinner. He would tell his wife he had a hard day. She would nod and serve the soup. He would eat it. Everything was in its proper place.

  ***

  **Author's Note on Constraints and Dangers**

  **What I Left Out:**
  I deliberately excluded any internal monologue regarding David's personal history or motivation. There is no mention of a past fire trauma or a strict father—psychological causes that would excuse his behavior as a symptom of pathology. Sartre's bad faith is not a psychological disorder; it is an ontological stance available to everyone. Explaining *why* he is this way would let the reader off the hook by suggesting he is broken rather than free. I also omitted any hint of regret after the decision. A sigh or a moment of silence would imply he knows he chose; he must believe he obeyed.

  **Where the Piece Could Slip:**
  1.  **The Bureaucrat Villain:** The greatest risk was making David seem cruel or lazy. If he were indifferent to Mrs. Gable, the story becomes a critique of bureaucracy rather than bad faith. I had to ensure he was helpful (carrying boxes) and kind (offering tissues) to show that his "seriousness" is compatible with decency. He isn't hiding from responsibility because he doesn't care; he's hiding from freedom because he cares too much about the "Value."
  2.  **Authorial Irony:** The narration had to remain as earnest as David. If the narrator described the wire as "innocent" or the Code as "arbitrary," it would signal the reader to judge David from a superior vantage point. The narration treats the Code as having weight because *David* treats it as having weight. The irony must exist only in the gap between the reader's understanding of freedom and David's experience of necessity.
  3.  **The "Waiter" Transposition:** I avoided making David "play-act" his role. He isn't performing inspection; he *is* inspecting. The bad faith isn't that he is acting; it's that he believes the role dictates the action rather than the action sustaining the role. The moment of the pen was the crucial pivot: he must not feel the pen moving; he must feel the ink flowing as a consequence of the paper's demand.

  **The Moment of Refusal:**
  The slide occurs when David looks from the wire to the clipboard. Mrs. Gable explicitly names his discretion ("You've used it before"). The reader sees the option. David acknowledges the rule exists but treats the *choice* to apply it as itself a violation of the Code. He refuses the freedom to interpret by categorizing interpretation as arrogance. He slides off the human consequence (the program) to the physical fact (the wire), treating the moral weight as a property of the copper rather than his judgment.
