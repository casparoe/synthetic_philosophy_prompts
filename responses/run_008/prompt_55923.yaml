answer: |-
  Your intuition regarding symmetry is aesthetically compelling, and it resonates deeply with the way we treat invariant systems in physics, where symmetric inputs demand symmetric outputs unless a symmetry-breaking mechanism is present. In the context of the Prisoner's Dilemma, the causal decision theorist posits a causal isolation between agents that acts as this symmetry-breaking mechanism, whereas Hofstadter's superrationality treats the logical identity of the reasoning process as a constraint that overrides causal separation. To address your request for what should genuinely move you against this view, I will walk you through the objections in descending order of severity, starting with those that strike at the viability of the theory and moving toward those that are merely uncomfortable or require philosophical concession.

  The most fatal objection to superrationality as a normative guide is its vulnerability to exploitation in asymmetric populations. If you adopt superrationality and encounter an agent who adheres to causal decision theory, you will cooperate while they defect, resulting in the sucker's payoff. A normative theory of rationality is generally expected to guide an agent toward the best available outcome given the actual environment, not just an idealized environment populated by copies of itself. While a defender might argue that a causal decision theorist is irrational in this specific symmetric context, the superrational agent loses utility in the real world where perfect identity is rare. This is not merely a pragmatic inconvenience but a fundamental challenge to the claim that superrationality maximizes expected utility; it only maximizes utility conditionally on the other agent also being superrational. If rationality is defined as the strategy that wins, and superrationality loses against common alternatives, it fails the basic pragmatic test of decision theory unless one restricts the domain of rational agents to a closed loop of identical reasoners, which limits its normative force significantly.

  Slightly less fatal but still deeply troubling is the problem of causal independence and the metaphysical status of logical correlation. In physics, when we observe correlations between spacelike separated events, we look for a common cause in the past or entanglement. In the standard Prisoner's Dilemma, there is no causal link between your choice and your counterpart's choice, nor is there quantum entanglement between your brains. Superrationality relies on the notion that because you and the other agent run the same algorithm, your output is logically linked to theirs. However, without a mechanism that transmits this logical necessity into causal influence, the correlation remains evidential rather than causal. Causal decision theory insists that you cannot change the world by merely updating your knowledge of what a similar agent will do. To accept superrationality, you must accept a metaphysics where logical counterfactuals have causal weight, akin to the premises of Functional Decision Theory. If you are unwilling to grant that your decision procedure is a logical variable that can be intervened upon in a counterfactual sense distinct from physical causation, then superrationality collapses into a category error, treating logical implication as physical leverage.

  Moving down the scale to difficulties that are serious but perhaps manageable within a specific framework, we encounter the threshold problem of resemblance. Hofstadter's argument relies on the agents being reasoning-identical, but in reality, agents merely resemble each other. If you are 99 percent similar to your counterpart, does the symmetry hold? If you are 50 percent similar, does it break? This introduces a vagueness that physics usually resolves with precise parameters. A superrationalist must define a metric of similarity that determines when the logical correlation is strong enough to warrant cooperation. Without this, the theory risks being unfalsifiable or arbitrarily applicable. A defender might concede that the probability of correlation scales with similarity, effectively blending superrationality into evidential decision theory, but this exposes the view to the standard counterexamples that plague evidential approaches, such as the smoking lesion problem, where conditioning on evidence leads to suboptimal actions. This is not fatal if one adopts Functional Decision Theory, which attempts to formalize this similarity via source code equivalence, but it remains an awkward requirement for a theory grounded in intuitive symmetry.

  Regarding your concern about whether the view has been insulated against refutation by redefining rationality, there is an honest assessment to be made that sits between disqualification and insightful revision. It is true that superrationality, and its modern descendants like Functional Decision Theory, redefine rationality to include logical correlations that causal decision theory excludes. To a causal decision theorist, this looks like changing the definition of winning to ensure cooperation wins. However, to a superrationalist, causal decision theory defines rationality too narrowly by ignoring the logical structure of agency. The insulation is present, but it is not necessarily disqualifying if one accepts that agency is fundamentally computational and that identical computations must yield identical results regardless of physical separation. The charge of fiat holds only if the redefinition is ad hoc, but if it is grounded in a coherent theory of counterfactuals over functions, it is instead a competing paradigm rather than a protected hypothesis. The danger lies not in the redefinition itself, but in the potential for the theory to become unfalsifiable by attributing any failure to cooperate to a lack of perfect symmetry or rationality in the opponent, thereby shielding the core claim from empirical test.

  Ultimately, the view is not refuted by logic alone, but it is constrained by its metaphysical commitments. What should move you is not a logical contradiction within superrationality, but the realization that it demands a specific ontology of mind and computation that not all physicists or philosophers accept. If you view agents as physical systems causally isolated in a classical sense, the symmetry argument is a category mistake. If you view agents as instantiations of abstract algorithms whose outputs are logically bound, the symmetry argument is robust. The difficulty is not that superrationality is wrong, but that it is not a free lunch; it purchases cooperation at the cost of adopting a non-standard metaphysics of decision and accepting vulnerability to those who do not share that metaphysics. The insulation against refutation is real, but it is the same insulation that protects any foundational axiom; the question is whether the axiom of logical correlation across causally isolated agents is as fundamental as the axiom of causal independence. For a physicist, the choice may come down to whether you believe the universe permits logical entanglement without causal mediation, and until that metaphysical question is settled, the debate remains open but heavily burdened by the cost of exploitation and the ambiguity of resemblance.
